prompt: |-
  I am a barrister. My working life is documentary evidence: disclosure, provenance, chain of custody, documents written to serve somebody's interest, and the inferences a tribunal is invited to draw from what a party has kept and what it has let disappear. I have never studied ancient history, and I want to know whether what historians call source criticism — the questions Herodotus and Thucydides were already asking about what they had been told and how they knew it, and the form those questions take in modern work on the distant past — can be restated in the vocabulary of evidence and proof that I actually use.

  Restate it systematically, strand by strand, rather than by loose analogy. Take the main moves of source criticism one at a time — the genuineness and date of a document, the interest and position of its author, corroboration and independent attestation, the force of silence, forgery and interpolation, and the selectivity of what survives at all — and for each one tell me three things: what the nearest counterpart in my vocabulary is (authenticity, admissibility, weight, the rule against hearsay and its exceptions, corroboration warnings, the best-evidence principle, adverse inferences from non-production, the standard of proof); what has to be stretched or fudged to make the translation fit; and what the historian can do that I cannot, or the reverse. My whole apparatus assumes a tribunal that can summon witnesses, put questions to them and punish them for lying, and that must eventually reach a binary verdict on a burden of proof. The historian has none of that, and is not trying to reach a verdict at all.

  Then give me the residue report, which is the part I actually want. Which elements of source criticism have no counterpart whatever in the law of evidence, and is that because my vocabulary is missing something, or because the historians' claims are vaguer than they look? I am particularly interested in two candidate false friends. The first is the pairing of the question whether a source is what it purports to be with the question whether what it says is true: is that really the same distinction as admissibility and weight, or does it come apart, given that my exclusionary rules are mostly about policy rather than reliability? The second is the problem of the selectively surviving record, an archive shaped by what somebody chose to copy, keep or forge rather than by what happened: is the historian's version of that problem expressible in the inferences I am allowed to invite a tribunal to draw, or is it a different kind of epistemic predicament altogether?

  I am not asking for a reading list and I do not want citations. Tell me what translates, what does not, and why.
reasoning: |-
  Okay, the user is a barrister deeply immersed in the world of legal evidence—disclosure, chain of custody, documentary provenance, and the strategic inferences drawn from what's preserved or destroyed. They want to map historical source criticism onto their legal framework, systematically and without loose analogies. They're explicitly not interested in academic citations or reading lists; this is about practical translation between disciplines. 

  The core tension they highlight is structural: legal evidence operates within a coercive system (subpoenas, perjury penalties, binary verdicts), while historiography deals with fragmented, unchallengeable traces. They want to know where the tools overlap, where they strain, and what's fundamentally untranslatable. Two specific concerns stand out: (1) whether authenticity-vs-truth maps cleanly to admissibility-vs-weight, given that legal exclusion is often policy-driven, and (2) whether archival survival bias parallels adverse inference in law or represents a distinct epistemic problem. 

  I need to dissect source criticism move by move—genuineness/date, author bias, corroboration, silence, forgery, survival bias—and for each, provide: legal counterpart, points of friction, and unique advantages/disadvantages per field. The residue report must isolate what’s irreducible to legal concepts. 

  Key realizations:  
  - Legal "authenticity" is a binary gatekeeper (admissibility); historical "genuineness" is probabilistic and layered (e.g., a forged document can still be historically "authentic" as evidence of the forgery era).  
  - "Author interest" in law feeds into witness credibility/weight; in history, it’s often the primary object of study (e.g., propaganda as data).  
  - "Silence" is lethal in law (adverse inference) but ambiguous in history—absence of evidence isn’t evidence of absence when archives burn accidentally.  
  - Survival bias has no true legal parallel because tribunals can compel production; historians work with "involuntary gaps" where destruction wasn’t strategic but accidental.  

  The false friends:  
  1. **Authenticity/Truth vs. Admissibility/Weight**: Legal admissibility excludes unreliable evidence for policy reasons (e.g., hearsay to ensure cross-examination); historians rarely exclude sources outright. A forged papyrus might be "inadmissible" in court as a will but "admissible" to historians as evidence of 3rd-century forgery practices.  
  2. **Archival Survival vs. Adverse Inference**: Legal adverse inference requires proven suppression (e.g., willful destruction after litigation hold). Historical survival gaps are often unknowable—was a document destroyed maliciously, or did mice eat it? Historians must model the archive itself as a historical artifact.  

  The residue: Historians embrace ambiguity as data; lawyers treat it as a defect. Sources are "witnesses" in law but "artifacts" in history—the latter’s value isn’t just in testimony but in existing. The historian’s "corroboration" includes non-human evidence (pollen in soil, tree rings) that wouldn’t qualify as legal evidence. Most critically, historians *want* the biases; they reveal period mindsets. A barrister cross-examines to diminish bias; a historian dissects it to reconstruct worldview.  

  This user thinks like a lawyer but seeks intellectual tools to handle non-legal uncertainty. Their underlying ask: "How do I vet truth-claims without subpoenas or perjury statutes?" The answer lies in probabilistic reasoning—but they’ll reject it if framed as "lower standards." Better to show how historiography’s constraints force richer error modeling. The unspoken need: applying historical skepticism to legal archives (e.g., when clients selectively preserve documents). They’ll appreciate concrete contrasts, not theory.
answer: |-
  Below is a systematic restatement of historical source criticism in legal evidence terminology, followed by a residue report isolating untranslatable elements. Each component addresses your three requirements: **legal counterpart**, **points of friction**, and **unique capacities** per field.  

  ---

  ### **1. Genuineness & Date of a Document**  
  - **Legal Counterpart**: *Authenticity* (Fed. R. Evid. 901) and *Best Evidence Rule* (Fed. R. Evid. 1002).  
  - **Friction**:  
    - Legal "authenticity" is binary: a document is either admitted or excluded. Historians treat genuineness as a *spectrum* (e.g., "likely a 5th-century copy of an earlier text").  
    - Dating in law relies on metadata (e.g., timestamps); historians use contextual clues (paleography, materials) that lack legal "foundation."  
  - **Unique Capacities**:  
    - *Historian*: Can treat a forged document as *evidence of the forgery's era* (e.g., a "medieval" forgery reveals 12th-century motives).  
    - *Lawyer*: Can compel forensic testing (e.g., ink dating) under court authority.  

  ### **2. Interest & Position of the Author**  
  - **Legal Counterpart**: *Witness Bias/Impeachment* (Fed. R. Evid. 607, 613) and *Weight* assessment.  
  - **Friction**:  
    - Legal bias impeaches credibility to *reduce weight*; historians analyze bias to *reconstruct historical context* (e.g., Augustus' *Res Gestae* as propaganda).  
    - Lawyers confront live witnesses; historians infer bias from text alone.  
  - **Unique Capacities**:  
    - *Historian*: Uses bias as *positive evidence* (e.g., partisan rhetoric reveals societal divides).  
    - *Lawyer*: Can cross-examine the author/creator directly.  

  ### **3. Corroboration & Independent Attestation**  
  - **Legal Counterpart**: *Corroboration Rules* (e.g., treason convictions) and *Hearsay Exceptions* (e.g., ancient documents under Fed. R. Evid. 803(16)).  
  - **Friction**:  
    - Legal corroboration often requires *multiple human witnesses*; historians accept non-human evidence (e.g., archaeology, climate data).  
    - Hearsay exceptions assume "reliability"; historians may use uncorroborated sources heuristically.  
  - **Unique Capacities**:  
    - *Historian*: Corroborates across *disciplines* (texts + dendrochronology + pollen analysis).  
    - *Lawyer*: Can demand *contemporaneous evidence* via discovery.  

  ### **4. Force of Silence**  
  - **Legal Counterpart**: *Adverse Inference* (e.g., *spoliation inference* from destroyed evidence).  
  - **Friction**:  
    - Legal adverse inference requires *proven suppression*; historical silence may stem from accidental loss, censorship, or irrelevance.  
    - Courts infer *consciousness of guilt*; historians infer *cultural norms* (e.g., gaps in Roman records about crucifixion as taboo).  
  - **Unique Capacities**:  
    - *Historian*: Treats silence as *active testimony* (e.g., "silenced voices" in subaltern studies).  
    - *Lawyer*: Can shift burden of proof to the party controlling evidence.  

  ### **5. Forgery & Interpolation**  
  - **Legal Counterpart**: *Fraudulent Evidence* and *Chain of Custody* challenges.  
  - **Friction**:  
    - Law focuses on *intent to deceive*; historians study forgeries as *cultural artifacts* (e.g., the *Donation of Constantine* forging papal authority).  
    - Chain of custody in law is procedural; historians rely on textual analysis (stylometry, anachronisms).  
  - **Unique Capacities**:  
    - *Historian*: Uses forgeries to trace *ideological evolution* (e.g., pseudepigrapha in religious texts).  
    - *Lawyer*: Can exclude forged evidence *entirely* as inadmissible.  

  ### **6. Selectivity of Survival (Archive Formation)**  
  - **Legal Counterpart**: *Adverse Inference from Non-Production* and *Best Evidence Rule*.  
  - **Friction**:  
    - Legal rules assume *intentional* destruction; historians grapple with *systemic* loss (fires, decay, selective copying).  
    - Courts infer *against the destroyer*; historians model *preservation bias* (e.g., Christian monks copying Cicero but not pagan polemics).  
  - **Unique Capacities**:  
    - *Historian*: Reconstructs "archival logic" as *historical object* (e.g., why Assyrian kings kept victory stelae).  
    - *Lawyer*: Can sanction non-production via judicial order.  

  ---

  ### **Residue Report: Untranslatable Elements**  
  **A. The Authenticity/Truth vs. Admissibility/Weight "False Friend"**  
    - **Why it fractures**: Legal admissibility hinges on *procedural policy* (e.g., hearsay excluded to ensure cross-examination). Historians rarely "exclude" sources; a forged document is still "admitted" as evidence *of the forgery*.  
    - **Core divergence**: A source's *truth* (weight) and *provenance* (admissibility) are interdependent in history. A "genuine" document may be biased (low weight), while a forgery has "weight" for understanding its creator. Law separates these rigidly; history fuses them.  

  **B. Selectively Surviving Record as Epistemic Predicament**  
    - **No legal counterpart**: Adverse inference requires (a) a duty to preserve, (b) proven destruction, and (c) a specific litigant to blame. Historians face *anonymous, systemic gaps*:  
      - Archives reflect *power* (e.g., Roman elites preserving letters; Gallic oral traditions lost).  
      - Loss is often *non-culpable* (climate, war, accident).  
    - **Result**: Historians must model the "archive" as a *biased witness itself*—something no legal inference rule captures. Your "best evidence" principle assumes *accessible* evidence; history's "best" is often *irretrievably lost*.  

  **C. The Unbridgeable Divide: Purpose & Epistemology**  
    1. **The Historian’s "Verdict"**:  
       - Legal proof seeks *binary conclusions* (guilty/not guilty) on a *specific standard* (e.g., beyond reasonable doubt).  
       - History produces *probabilistic reconstructions* ("likely influenced by...") with *no closure*.  
    2. **The Unsubpoenable Past**:  
       - Historians cannot "cross-examine" dead sources; they reverse-engineer context from fragments.  
       - Legal tools like impeachment or corroboration warnings assume *contemporaneous challenge*—impossible for Thucydides.  
    3. **Bias as Data, Not Defect**:  
       - In law, bias reduces credibility. In history, bias *is* the signal (e.g., a medieval chronicler's omission reveals monastic priorities).  

  **Conclusion**: Source criticism’s untranslatable core is its embrace of *survival bias* and *source interdependence* as constructive problems. Your "adverse inference" can’t model why Egyptian papyri survive in deserts but not in European libraries. Similarly, historians treat reliability as *layered* (a source can be "unreliable" for fact-finding but "reliable" for mentalités). This isn't vagueness—it’s adapting to an unsubpoenable world where every gap and forgery is evidence of its own making. Your apparatus demands control; theirs accepts radical uncertainty as raw material.
