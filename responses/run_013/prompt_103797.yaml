  For (b) on domain-indexed membership: They might be relabeling the all-affected principle, but adding thresholds and enforcement conditions makes it meaningfully different. The "material share" criterion could be a genuine innovation if developed further.

  The smelter case (c) is actually doing important work by showing multilevel governance where traditional boundaries fail. It's not just decoration - it demonstrates their theory in a real-world scenario where municipal/national electorates don't match the decision's impact.

  For objections (d): The solidarity objection seems strongest. Their reply about functional solidarity is clever but may not fully address how trust builds over time in stable polities. The accountability concern also bites hard - rotating electorates could indeed undermine responsibility.

  An unaddressed objection (e) might come from a communitarian: that fluid membership destroys the shared identity needed for democratic debate. Their system might produce technical governance without real civic engagement.

  The least interesting part (f) is probably their treatment of the European Union case. While competent, it's not adding much beyond applying their framework. Cutting it would sharpen the focus.

