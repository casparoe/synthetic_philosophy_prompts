prompt: |-
  I'm presenting at our formal political theory workshop next week and I need a Q&A prep sheet. The paper is on Sen's liberal paradox — the result where minimal liberalism and weak Pareto can't both hold. I know the standard reactions to that result; what I need is the questions I'll actually get from *this* room.

  Heres my line. The paradox only bites if you assume a person's ranking of the two alternatives in their protected personal sphere is fixed independently of the social choice procedure — that my preference over (I read Ulysses tonight / I sleep in tonight) is the same whether I'm the one deciding or somebody else is. I argue real preferences over the personal sphere are procedure-sensitive: my ranking of those two can flip depending on who gets to decide, because part of what I want is just to be the one deciding. Once you index the personal sphere to the procedure, the conflict between minimal liberalism and weak Pareto dissolves — the two conditions were ranging over different preference objects and talking past each other. I have a minimal formal setup for this, like two pages, so it isn't just hand-waving.

  The room: mostly social choice people. They know Arrow and Sen cold, they think the liberal paradox is closed and that anyone who "solves" it is probably just changing the question, and they'll be quick to say so. Also two people from the philosophy-of-economics side who work on rights, and they'll care about something different: whether my move leaves "rights" doing any work at all, or whether I've just laundered rights into tastes.

  What I want: the objections in roughly the order they'll actually come, phrased the way these particular people phrase things, ranked by how much damage each one does. For each, a two-minute reply and a blunt note on where that reply is soft. Tell me what to concede up front so I don't get caught flat-footed on the obvious stuff. And tell me the one question I'm hoping nobody asks — I think I already know what it is, but I want to see whether you land on the same one.

  Don't bother with citations or reading lists, I know the canon. Write it in American English — I'm at a US department and I don't want it reading like I pasted from a British textbook.
