  I'm a backend dev with basically zero formal philosophy training (I've read a couple of pop-sci books and that's it), and I want to build a decision tree / flowchart for my Discord's monthly reading group. The topic is "is mental illness a myth?" — you know, the Thomas Szasz thing where he says it's a metaphor, not a real disease. The problem is every time we talk about it people just pick a team ("I'm with Szasz" / "no, it's obviously real") and then argue past each other, so I want an instrument that sorts us by what we actually think about the cases rather than by which name we like.

  Please build it as a tree where each branch node is one question that seperates two groups, and each leaf is a named position (I don't know the names for most of these, so you'll have to name them for me) plus one line about the ugliest commitment that position has to swallow. Build it from the logical space first — the questions and the combinations of answers they allow — and then tell me which combinations nobody actually occupies, and whether that's because the view is incoherent, just unattractive, or nobody's bothered to defend it. If two leaves end up indistinguishable by my questions, say so instead of faking a split.

  Every node has to be phrased as something a person can answer without already knowing which position it leads to. So no "do you believe in the biomedical model?" — give me concrete cases. I want at least these to appear somewhere on the tree:

  - Someone hears voices, isn't distressed, holds down a job and is happy, but a clinician still calls it a symptom.
  - A condition that gets diagnosed in one country and not another for the same behavior (I've heard some things are "disorders" in one place and just being eccentric in another).
  - A diagnosis that sat in the official manual for decades and then got voted out — same people, same behavior, suddenly not sick anymore.
  - A pill that reliably helps people feel better even though the story we tell about why it works keeps falling apart. Does it helping settle whether the "illness" was real?
  - Someone who's miserable and can't function, but only in a specific environment (open-plan office, a bad marriage, a war zone). Is the disorder in them or in the setup?

  The distinctions I care about most, roughly: whether calling something a disorder is a factual claim about a broken body, a value judgment that the behavior is bad/unwanted, or something you can't peel apart; whether "we haven't found the biology yet" is a reason to doubt the category or just a reason to keep looking; whether the right move is to scrap the concept, keep it but strip the moralizing, or keep it purely as a practical tool and stop asking if it's "real"; and whether any of this changes what we do (forced treatment, insurance, meds) or is just an academic squabble.

  Also: where is your reasoning most likely to be wrong here — which branch are you least sure actually splits the positions — and what argument or piece of evidence would make you redraw the tree?
