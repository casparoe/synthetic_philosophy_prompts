  On aspiration levels, the regress question is obvious - if adequacy is pre-comparative, how do we set thresholds without circularity? Follow-up could challenge if this reduces to "whatever feels adequate."

  For heuristics-and-biases, need to probe why she thinks they're rational rather than just efficient. Follow-up might question if this ignores systematic errors.

  On normative judgments, must ask how her view avoids relativism. Follow-up could test if "unusual" has any bite when adequacy is settled independently.

  The medical scenario is perfect for exposing tensions - stopping at first adequate treatment seems reckless. Need to frame it sharply to force distinction from legitimate satisficing.

  Closing questions about counterevidence and what optimizers get right will help balance the interview. The evidence question should demand specific falsifiable claims, not just defenses.

