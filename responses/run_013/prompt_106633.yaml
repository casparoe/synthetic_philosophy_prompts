  Abandoning consistency feels messy. Allowing contradictions trivializes rationality. In iteration, it gets worse—explicit contradictions pile up. Not ideal. Rejecting high probability might work for single cases, but iteration forces belief in the possibility of error at each step. Denying this seems counterintuitive.

  The strongest case is against closure. It handles iteration by localizing belief. The cost is not believing conjunctions of known truths, but that's acceptable if we accept fallibilism. Other options have higher costs: inconsistency is irrational, and rejecting probability ignores practical reasoning. 

