  ### Diagnostics: Unoccupied & Indistinct Positions
  - **Unoccupied Combinations**:  
    - *Subpersonal + Content Inheritance*: No position argues subpersonal states (e.g., priors) *inherit* cognitive content. Why? Subpersonal states lack propositional structure.  
    - *Attention-Independent + Armchair Settlement*: All attention-independent penetration claims rely on empirical cases; no one defends a priori arguments here.  
    - *Diachronic + Encapsulation-Compatible*: Unattractive—encapsulation typically rejects *any* cognitive effects, even slow ones.  

  - **Indistinct Positions**:  
    - **Leaf 3 (Liberal)** and **Leaf 6 (Moderate)** both cover cases like desire-influenced perception. They aren’t separated further because:  
      - Attention mediation (Node 4) doesn’t constrain content relations.  
      - Degree/kind (your Distinction 5) is subsumed under synchronic/diachronic (Node 7).  

  - **Why No "Degree vs. Kind" Node?**  
    Positions don’t split cleanly here. "Kind" proponents (e.g., Strong Penetration) treat it as categorical; others see gradations. But this correlates with synchronic/diachronic (Node 7) and content inheritance (Node 5), so no independent branch was needed.  

  This tree isolates 10 coherent positions from your distinctions. It works because your framing—centering on *where*, *how*, and *what kind* of influence—exposes genuine fault lines. Pushing further (e.g., splitting content-inheriting attention effects) would force artificial distinctions or exceed 9 nodes.
