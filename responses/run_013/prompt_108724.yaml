  #### Node 3 (from 2A): Does attention explain the effect?  
  *Case: An expert birdwatcher spots a rare species. Did knowledge guide attention, or directly shape experience?*  
  - **A. Yes, attention is the mechanism** → Node 4  
  - **B. No, it’s attention-independent** → Node 5  

  #### Node 4 (from 3A): Does attention-mediation disqualify penetration?  
  *Case: Fear makes you "see" a shadow as a threat. If fear focuses attention, is this penetration?*  
  - **A. Yes, attention invalidates penetration** → Leaf 2  
  - **B. No, attention is a penetration route** → Leaf 3  

  **Leaf 2: Attentional Shaping (Not Penetration)**  
  *Awkward: Must deny that attention is ever cognitively driven.*  
  **Leaf 3: Liberal Penetration (Attention-Mediated)**  
  *Awkward: Risks making all top-down attention "penetration," potentially trivializing the term.*  

  #### Node 5 (from 3B): Does the experience inherit the cognitive state’s content?  
  *Case: After hallucination training, you "see" a red apple due to strong belief. Is "red apple" both believed and experienced?*  
  - **A. Yes, identical content** → Leaf 4  
  - **B. No, content is distinct** → Node 6  

  **Leaf 4: Strong Cognitive Penetration**  
  *Awkward: Blurs perception/hallucination; beliefs directly dictate experiential content.*  

  #### Node 6 (from 5B): Could encapsulation rule this out a priori?  
  *Case: Desiring water in a desert makes a mirage "look wet." Is this impossible if vision is encapsulated?*  
  - **A. Yes, encapsulation forbids penetration** → Leaf 5  
  - **B. No, it’s empirically testable** → Node 7  

  **Leaf 5: Encapsulation-Based Denial**  
  *Awkward: Must dismiss empirical cases as post-perceptual, even when experience seems altered.*  

  #### Node 7 (from 6B): Is the effect synchronic or diachronic?  
  *Case: Lab exposure to tilted lines makes vertical lines "look" tilted. Is this cognitive or adaptation?*  
  - **A. Synchronic (immediate influence)** → Leaf 6  
  - **B. Diachronic (slow calibration)** → Leaf 7  

  **Leaf 6: Moderate Cognitive Penetration**  
  *Awkward: Must explain how cognition reshapes experience without shared content.*  
  **Leaf 7: Perceptual Learning/Adaptation**  
  *Awkward: Excludes cognition despite long-term knowledge dependence (e.g., expert intuitions).*  

  #### Node 8 (from 1B/C): Is the judgment/response itself perceptual?  
  *Case: A novice claims "tumor visibility increased" after training, but detection thresholds don’t change.*  
  - **A. Yes, perception and judgment are fused** → Leaf 8  
  - **B. No, judgment is post-perceptual** → Leaf 9  

  **Leaf 8: Perceptual Judgment Penetration**  
  *Awkward: Conflates perception with belief, risking epistemic circularity.*  
  **Leaf 9: Strict Post-Perceptualism**  
  *Awkward: Must explain why subjects insist experience changed when only beliefs did.*  

