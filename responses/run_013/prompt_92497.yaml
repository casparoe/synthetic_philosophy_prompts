  For the mapping table, precision is key. I'll need to isolate exactly which assumption each interpretation discards:
  - Bohmian: rejects outcome-independence (keeps setting-independence via nonlocal but FTL-hidden guidance)
  - Dynamical collapse: rejects outcome-independence (nonlocal jumps)
  - Everett: rejects both dependencies (correlations from decoherence, no collapse)
  - Retrocausal: rejects setting-independence (future choices affect past states)
  - Superdeterminism: rejects statistical independence (correlation between settings and hidden variables)

  The experiments' requirements (spacelike separation, detection efficiency, randomness) must be tied to which loopholes they close. Crucially, I'll emphasize that experiments rule out *local hidden variable theories*—not all hidden variables or determinism. A null result would have supported local realism but not necessarily completeness, as per EPR.

  The philosophical oddity—experimental metaphysics—needs framing: Bell tested whether *reality itself* obeys local causality, not just theories. The Nobel recognizes this shifted philosophy from speculation to empirical inquiry. But interpretations remain viable by modifying axioms (e.g., adding foliations), showing experiments test the Bell framework's applicability, not "reality as such."
answer: |-
  ### Bell's Theorem and the Loophole-Free Experiments: What the Laboratory Work Establishes

  Your experimentalist's instinct is correct: the 2015 loophole-free Bell tests and their successors are monumental technical achievements, but their *philosophical* implications require careful disentanglement from the theoretical machinery. Bell's theorem is indeed a constraint on *theories*, while the experiments test whether *reality* conforms to a class of theories obeying specific assumptions. I’ll proceed as requested, using the 2015 diamond-NV-center (electron spins) and photon-based experiments (e.g., Delft, NIST, Vienna) and later astronomical-setting variants as the case, viewed through Bell’s lens of *local causality*.

  #### I. From the Lens to the Case: Bell’s Assumptions and the Experiments’ Target
  Bell’s inequality derivation requires three fundamental assumptions to hold simultaneously:
  1.  **Outcome Independence (OI):** The outcome (e.g., spin up/down) on one wing (Alice) is statistically independent of the outcome on the other wing (Bob), *given the complete specification of the past common causes (λ) relevant to both wings*. Formally: *P(A|B, a, b, λ) = P(A|a, b, λ)* and vice versa.
  2.  **Setting Independence (SI):** The choice of measurement setting (e.g., analyzer angle *a*) on one wing is statistically independent of the hidden variables (*λ*) and the distant outcome (*B*), given *λ*. Formally: *P(A|a, b, λ) = P(A|a, λ)* and *ρ(λ|a, b) = ρ(λ)*. (*ρ(λ)* is the probability distribution of *λ*).
  3.  **Statistical Independence (StI):** The hidden variables (*λ*) are statistically independent of the future *choices* of measurement settings (*a* and *b*). Formally: *ρ(λ|a, b) = ρ(λ)*. (Note: SI and StI are often conflated; StI is the critical assumption about the freedom to choose settings independently of *λ*).

  **Local Causality (LC)**, as defined by Bell, is the conjunction of OI and SI. It embodies the idea that events in one spacetime region cannot influence events in a spacelike-separated region; probabilities depend only on events in the past light cone. Crucially, **LC is distinct from No-Signalling (NS)**. NS (*P(A|a, b) = P(A|a)*, etc.) is a weaker constraint observed in both classical and quantum mechanics, prohibiting faster-than-light *communication*. Violating NS would directly imply FTL signalling. Bell tests show violations of LC predictions (the inequality) *while respecting NS*, creating the tension.

  **What the Loophole-Free Experiments Closed:**
  *   **Detection/Fair-Sampling Loophole:** Earlier experiments lost photon pairs, potentially biasing the sample. High-efficiency detectors (NIST: ~75% for photons; Delft NV centers: near-unity) ensured nearly all entangled pairs were detected.
  *   **Locality/Communication Loophole:** Ensuring the setting choice on one wing and the outcome registration on the other were spacelike separated, preventing any light-speed signal between these events. Delft (1.3 km separation), NIST (via fast switching), and Vienna used physical separation and fast random setting generators.
  *   **Freedom-of-Choice Loophole:** Later experiments (e.g., using cosmic photons or ancient starlight billions of years old to choose settings) ensured the setting choices (*a*, *b*) were determined by physical processes causally disconnected from the entangled pair creation and each other long before the experiment. This directly addresses StI.

  **The Experiments' Core Result:** When all loopholes are closed, the measured correlations *violate* the Bell inequality (typically the CHSH inequality, *|S| ≤ 2*) by many standard deviations (e.g., Delft: *S ≈ 2.42 ± 0.02*). NS holds (*P(A|a,b) ≈ P(A|a)*).

  #### II. Mapping Ontological Escape Routes: Which Assumption is Sacrificed?
  Different interpretations/modifications of quantum theory avoid the contradiction by rejecting one of Bell's assumptions. Here is the exact mapping:

  | **Interpretation/Theory**       | **Assumption Rejected** | **Specific Mechanism**                                                                 | **Relation to NS/Relativity**                                                                 |
  | :------------------------------ | :---------------------- | :------------------------------------------------------------------------------------- | :-------------------------------------------------------------------------------------------- |
  | **de Broglie-Bohm (dBB)**       | Outcome Independence (OI) | Nonlocal quantum potential instantly correlates particle positions (guidance equation). Outcomes depend on distant settings *and* outcomes via *λ*. | Violates LC but **preserves NS**. Requires a preferred foliation (breaks Lorentz invariance). |
  | **Dynamical Collapse (e.g., GRW, CSL)** | Outcome Independence (OI) | Spontaneous, stochastic, nonlocal wavefunction collapse events instantaneously reduce the state. | Violates LC but **preserves NS** statistically. May require a foliation (GRWf) or be frame-dependent. |
  | **Everett (Many-Worlds)**       | Outcome *and* Setting Independence (OI & SI) | No collapse. All outcomes occur. Correlations arise via decoherence in the universal wavefunction. *A* and *B* are not random variables in a single outcome branch; "probabilities" are epistemic. | **Preserves LC** *within branches* but denies its applicability (no single outcome). Trivially preserves NS. |
  | **Retrocausal Models**         | Setting Independence (SI) | Future measurement settings (*a*, *b*) causally influence the past state (*λ*) of the entangled pair. | Violates LC but **preserves NS**. May be acausal or involve backwards-in-time influences; often Lorentz invariant. |
  | **Superdeterminism**           | Statistical Independence (StI) | The hidden variables (*λ*) are correlated with the *apparently free* setting choices (*a*, *b*) from the Big Bang. | **Preserves LC** mathematically (λ includes setting correlation). Trivially preserves NS. Denies free will/randomness. |

  **What the Experiments Cannot Do:**
  1.  **Identify the Failing Assumption:** They rule out *all* theories satisfying *all three* assumptions (OI, SI, StI) simultaneously. They cannot pinpoint *which* assumption reality violates.
  2.  **Demonstrate FTL Influence:** They violate the *statistical predictions* of LC. They show correlations incompatible with LC+StI. They do *not* show a controllable, detectable signal travelling FTL (NS holds).
  3.  **Eliminate an Interpretation:** All major interpretations in the table remain viable *by construction*. The experiments eliminate *local realistic theories* (LR: theories obeying OI, SI, StI). Interpretations escape by rejecting one assumption, thereby ceasing to be "local realistic" in Bell's specific sense. They do not falsify non-local (dBB, collapse), non-realist (Everett), retrocausal, or superdeterministic approaches.

  #### III. From the Case Back to Theory: Experimental Guarantees and Null Hypotheses
  **What a Competent (Loophole-Free) Experiment Guarantees:**
  *   **Spacelike Separation:** The choice of setting on Alice's wing must be spacelike separated from the outcome registration on Bob's wing (and vice versa). This prevents any light-speed causal influence between these specific events, directly enforcing the condition needed to test SI/OI *operationally*.
  *   **High Detection Efficiency:** Must be sufficient to violate a Bell inequality *robustly* under the specific experimental conditions (e.g., >~66.7% for CHSH with photons under certain assumptions). This closes the fair-sampling loophole, ensuring the measured sample is representative.
  *   **Genuine Setting Independence:** Settings must be chosen randomly and unpredictably within the experiment (fast RNGs) *and* be physically independent of the entangled pair's creation mechanism. Astronomical settings push this to extremes, attempting to ensure StI by making the setting-determining events causally disconnected from the experiment long before it began.

  **What a Null Result Would Have Vindicated:**
  Had the experiments found correlations *within* the Bell bound (*|S| ≤ 2*) while closing loopholes, it would have been strong evidence *against* standard quantum mechanics (QM) and *for* the possibility of a **Local Realistic (LR) Theory** – a theory satisfying OI, SI, and StI. This would have revived the core *incompleteness argument* of the 1935 EPR paper: QM would be shown *not* to provide a complete description of physical reality *if* one insists on the EPR criterion for an element of reality and locality (LC). However, it would *not* have automatically vindicated EPR's specific *determinism* or shown *which* LR theory was correct. It would only have shown that *some* LR theory compatible with the observed (sub-Bell) correlations was possible.

  #### IV. Where the Lens Goes Silent: Ontology and Structure
  *   **Non-Event-Based Ontologies:** Bell's LC is framed in terms of probabilities assigned to *events* (settings, outcomes) within spacetime regions, conditional on *events* in their past light cones (*λ*). Theories with fundamentally different ontologies challenge this framework:
      *   **Everett:** Denies a single outcome event occurs. Probabilities emerge from branching. LC, defined for single outcomes, loses its standard meaning.
      *   **Primitive Ontology (e.g., dBB particles/flashes):** LC might be definable for the primitive ontology (e.g., particle positions), but the nonlocal dynamics governing it violate OI. The *wavefunction* ontology itself isn't localized in spacetime.
      *   **Wavefunction Realism:** If the wavefunction is the fundamental entity existing in a high-dimensional space, spacetime locality becomes derivative or illusory. Bell's spacetime-based LC may not be the primary causal concept.
  *   **Added Structure (e.g., Preferred Foliation):** Theories like dBB often introduce a background structure (e.g., a preferred foliation) to define simultaneity and make the nonlocal dynamics well-defined. This explicitly **sacrifices Lorentz invariance** but can preserve a form of *absolute* locality/causality defined *within* the foliation. Bell's theorem, derived assuming relativistic spacetime *without* a preferred frame, doesn't constrain such theories *if* they reject OI/SI. The experiments confirm the predictions of QM, which these theories reproduce, but they don't directly test the existence of the foliation; its necessity arises from the *interpretation's* structure to avoid FTL signalling while accommodating nonlocality.
  *   **Retrocausality and Superdeterminism:** These challenge the usual temporal/causal ordering assumed in defining past light cones and "given λ". Retrocausality makes λ depend on future settings, blurring the "past" in LC. Superdeterminism makes λ correlate with future settings from the beginning, implying the "free choice" required for StI was illusory. Both operate within spacetime but redefine causal structure.

  #### V. The Philosophical Oddity: Experimental Metaphysics
  Bell's theorem *is*, at its core, a piece of *a priori* mathematical logic: *If* OI, SI, and StI hold, *then* a Bell inequality must hold for the correlations. It constrains the *form* any theory satisfying those assumptions can take. The conversion into an experimental programme is indeed "experimental metaphysics." What was put to the test was **an assumption about the world:** Does the physical world *in fact* behave in a way consistent with the conjunction of OI, SI, and StI? That is, does it obey **local causality** (as Bell defined it) *and* allow for statistically independent setting choices?

  The experiments answer this empirical question with a resounding **no.** The correlations observed in nature violate the bound that *any* theory satisfying those assumptions *must* obey. This is profound: a metaphysical principle (local causality + freedom) has been subjected to empirical falsification. The Nobel Prize recognizes this paradigm shift – the movement of questions about realism, locality, and causality from pure philosophical speculation into the domain of rigorous experimental physics.

  However, the theorem itself remains a theorem about theories. The experiments do not directly test the theorem; they test the *empirical adequacy* of the class of theories the theorem constrains. They show that *if* we demand a description of the world using probabilities over well-defined outcomes and hidden variables, then that description *cannot* be locally causal *and* respect statistical independence of settings. Reality forces us to abandon at least one of those pillars. The choice of which pillar to abandon is where interpretation – and ongoing metaphysics – begins. The experiments constrain our metaphysical options dramatically, but they do not dictate the final choice.
