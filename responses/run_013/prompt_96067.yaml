  ## The Annual Dinner Speech: Outgoing Chair

  **(Taps glass gently. Smiles warmly at the room.)**

  Friends, music lovers, fellow travellers in the wonderful, occasionally chaotic, world of our little school. It’s genuinely heartwarming to see you all here tonight. After the year – after the *years* – we’ve had, gathering like this, sharing food, sharing music (hopefully later!), sharing *community*… it feels essential. Necessary. Like finding the right chord after a long, dissonant passage.

  As your outgoing Chair, it’s customary to reflect. To celebrate triumphs, acknowledge challenges, and pass the baton. We’ve certainly had triumphs – just look at the incredible performances our students gave earlier, the dedication of our teachers, the quiet hum of creativity that never truly stopped. But we also faced a challenge that became the backdrop to everything else these past six years. Our home. The fight to keep it.

  I won’t re-litigate the rent dispute tonight. Our lawyer, sitting right there (raises glass slightly towards lawyer), laid out the odds at the very beginning with admirable, if somewhat chilling, clarity. Our treasurer (nods warmly to treasurer), bless her foresight, warned us against taking that very first step. She saw the path, clear as day. And she was right.

  But we took the step. And then another. And another. Eleven times, this board gathered – good people, thoughtful people, people deeply committed to this school and its place in our community. Eleven times, we voted unanimously – *unanimously* – to take the next step, to write the next letter, to engage in the next round.

  **(Leans slightly on the podium, tone becoming reflective, not accusatory)**

  And that’s what I want to talk about, honestly, for just a moment. Not the legalities, not the sums of money (which always felt strangely abstract against the principle we felt we were defending), not even the outcome – the reality that this summer, after forty years, we pack up our stands and our sheet music and move on.

  I want to talk about the *process*. The machine we found ourselves inside.

  Think of it like this: Imagine you’re standing in a gentle current. At first, it’s barely noticeable. You take a small step to adjust your footing. The current nudges you a little more. You take another step, thinking this one will surely steady you. Then another. Each step feels necessary, logical, even prudent *in that moment*, to keep your balance, to hold your ground against the increasing pull. The ground beneath you shifts slightly, but you adapt. The water rises inch by inch, but you focus on maintaining your stance, believing the next adjustment will be the one that works. And with each step, the distance back to the shore you started from grows wider, the current you’re fighting feels stronger, and the cost of *not* taking the next step – of letting go and being swept away *right now* – feels impossibly high. Even when you suspect the shore ahead might be a mirage.

  **(Pauses, makes eye contact with various board members, the resigned member, the treasurer)**

  That was our machine. It wasn’t folly at any single meeting. It wasn’t greed or recklessness. It was eleven people, looking at the step immediately in front of them, believing it was the necessary one to protect something precious. The principle *did* feel real, and it grew heavier with each vote. The money already spent wasn't just gone; it felt like an *investment* in the next step, the one that might finally turn the tide. Stopping felt less like prudence and more like surrender – a final admission of all that would be lost. Even for those who saw the current clearly at the start, stepping out became unthinkable once we were deep in the flow. Welcome back, Michael (nods to the member who resigned at round seven). Your stepping out took a different kind of courage, and we’re glad you’re here tonight.

  **(Shifts tone, lighter, more forward-looking)**

  So, what do we take from standing in that current? What does the room use?

  Firstly, **we learn the profound power of the incremental.** How small, logical decisions, made with the best intentions, can build a path to an unintended destination. It’s a force as real as gravity, and just as easy to underestimate until you're deep in its pull. We see it now.

  Secondly, **we learn that acknowledging the machine isn't weakness, it's clarity.** Our treasurer saw it early. Our lawyer predicted the outcome. Others felt the pull at different times. Honouring that foresight, even in hindsight, is crucial. It doesn’t diminish the commitment of those who voted 'yes' each time; it highlights how powerful the current was.

  And finally, **we learn that the shore we *thought* we were defending – this building – wasn't the only shore, nor was it truly the source of the music.** The machine took a toll. Financially, emotionally. It cost us our home of forty years. But look around this room. **(Gestures widely)** The music didn’t stop. The teachers taught. The students learned. The concerts happened. The community gathered. Because *this* – *us* – is the heart of the school. Not the bricks and mortar, but the shared belief in the power of music, the dedication to nurturing it, the willingness to show up, even after a long fight, even facing an uncertain move.

  **(Voice strengthens with conviction)**

  We are leaving the building. But we are *not* leaving the mission. We are not leaving each other. The next chapter won't be easy – finding a new home rarely is. There will be new currents, new challenges. But we’ve stared into a complex machine and come out the other side. We carry that hard-won knowledge. We carry the scars, yes, but also the immense resilience we’ve shown.

  We carry the music. That has never, ever left us.

  So tonight, let’s raise our glasses.

  To the teachers, whose passion is our compass.
  To the students, whose talent is our inspiration.
  To the board – past and present – for their tireless, complex, sometimes heartbreaking work. Your commitment humbles me.
  To our partners and families, who provided the essential bedrock of support (and probably talked us down off a ledge or two!).
  To our treasurer, for clear eyes when it mattered most.
  To our lawyer, for navigating the rapids as best anyone could.
  To Michael, for coming back into the fold.
  To every single person here who believes in the necessity of this little school.

  We move forward. Not forgetting, but learning. Not defined by the building we leave, but by the music we make together, wherever we land.

  To the Community Music School! May our next forty years resonate even more beautifully.

  **(Raises glass high. Smiles, genuinely and warmly.)** Cheers!
