answer: |-
  Here's a conceptual audit of the paragraph, sentence by sentence, from a careful behavioural genetics perspective:

  1.  **"Heritability is the proportion of a trait's variation in a population that's due to genes."**
      *   **Conceptually Right:** This is the standard definition of *heritability in the broad sense* (H²). It specifically refers to the proportion of **total phenotypic variance** (V_p) in a **specific population** at a **specific time** that is attributable to **genetic variance** (V_g). Key emphasis: *variation*, *population*, *specific time*.

  2.  **"It runs from 0 to 1, and when researchers say the heritability of adult height is about 0.8, they mean that roughly 80% of your height is genetic and the remaining 20% comes from the environment — food, disease, and so on."**
      *   **Wrong (Major Error):** This is the most common and fundamental misconception. Heritability **does not** tell you what proportion of *an individual's* trait is "genetic" vs. "environmental." It speaks *only* to the *sources of variation* within a *population*. Saying "80% of *your* height is genetic" is nonsensical in this framework. For an individual, genes and environment are inextricably intertwined in producing the trait. A height heritability of 0.8 means that 80% of the *differences* in height *within that studied population* are associated with genetic differences. It says nothing about the absolute contribution to any single person's height.

  3.  **"Twin studies produce these numbers by comparing identical and fraternal twins; the fact that identical twins are more alike even when they're raised in different homes shows the similarity is genetic rather than environmental."**
      *   **Mostly Right, But Needs Qualification:**
          *   Correct that twin studies (comparing Monozygotic/MZ and Dizygotic/DZ twin correlations) are a primary method for estimating heritability.
          *   Correct that greater similarity in MZ twins reared apart *suggests* a strong genetic influence on the trait *in that population*.
          *   **Qualification 1:** "Reared in different homes" doesn't guarantee completely random or maximally different environments. Adoption often involves screening, and separated twins might still share similar socio-economic backgrounds or regional cultures compared to random individuals.
          *   **Qualification 2:** The design *assumes* the "Equal Environments Assumption" (EEA) – that MZ twins treated more similarly than DZ twins doesn't *cause* their greater similarity. This is debated for some traits.
          *   **Qualification 3:** Other designs (adoption studies, family studies, SNP heritability from GWAS) are also used and can provide different estimates or insights. Twin studies often yield slightly higher estimates than other methods.

  4.  **"For traits like intelligence and personality, heritability actually increases with age and settles somewhere around 0.5 to 0.8 in adulthood..."**
      *   **Empirically Supported, But Interpretation Needs Care:**
          *   This is a well-replicated finding for many cognitive and personality traits.
          *   **Qualification:** This does *not* mean genes become *more important* as you age. It means that as individuals grow older, they increasingly seek out, select, and modify their own environments based on their genetic predispositions (gene-environment correlation - rGE). The *proportion of variance* explained by genetic differences *increases* because shared family environmental effects (like parental style, home environment) tend to diminish in influence, while non-shared environment (unique experiences) and genetic effects remain or amplify through rGE.

  5.  **"...which means that by the time you're grown up how smart you are is mostly down to your DNA, and differences between schools, parents and neighbourhoods are doing comparatively little."**
      *   **Misleading Interpretation:**
          *   **Wrong:** See point #2. Heritability does *not* mean "how smart *you* are is mostly down to your DNA." It means genetic differences explain most of the *variation* in intelligence *within that adult population*.
          *   **Misleading:** "Differences between schools, parents and neighbourhoods are doing comparatively little" is easily misinterpreted. It likely means that *differences in these specific shared environmental factors* explain a smaller *proportion of the variance* in the adult population compared to genetic differences. **Crucially:** This does *not* mean these factors are unimportant for the *absolute level* of the trait. A massive environmental change (like universal access to excellent nutrition and education vs. severe deprivation) could dramatically shift the *average* intelligence of the whole population, even if heritability within each condition is high. Heritability tells us about current variation sources, not the potential impact of changing environments.

  6.  **"It also tells us something about group differences: if a trait is highly heritable within each group, then an average difference between two groups is likely to have a genetic component as well."**
      *   **Logically Flawed and Wrong (The Shakiest Part - Your Instinct is Correct):** This is a serious and common logical error, often called the **"Ecological Fallacy"** or specifically in genetics, the **"Lewontin's Fallacy"** argument.
      *   **Why it's wrong:** Heritability is a *within-group* statistic. High heritability *within* Group A and *within* Group B tells you nothing about the *cause* of the *average difference between* Group A and Group B. The between-group difference could be entirely environmental, entirely genetic, or a mix, *regardless* of the within-group heritability.
      *   **Analogy:** Imagine two fields of corn. Within Field A (grown in good soil), the height variation is 80% due to genetic differences between the seeds. Within Field B (grown in poor soil), the height variation is also 80% due to genetic differences. The *average* height difference *between* the two fields, however, is almost certainly 100% due to the environmental difference (the soil quality). High within-group heritability does *not* imply the between-group difference has a genetic component.

  7.  **"The whole topic is controversial mostly for political reasons, and critics who object that heritability depends on the environment are confusing a technical caveat with a substantive objection."**
      *   **Mostly Wrong and Dismissive:**
          *   **Wrong:** While politics can play a role, the objections based on heritability depending on the environment are **profoundly substantive and technical**, not just political gripes or confusion. Heritability *is* population-specific and environment-specific. It can change dramatically if the environment changes (e.g., heritability of height is lower in populations with widespread malnutrition). Ignoring this context dependence *is* a substantive error in interpretation. Critics highlighting this are pointing out a fundamental limitation of the statistic for certain inferences.

  8.  **"None of this means a trait can't change — a highly heritable trait can still shift if you change the environment..."**
      *   **Right:** This is correct and important. High heritability does *not* mean immutability. Changing the environment for the whole population can shift the mean of the trait substantially (e.g., the Flynn effect for IQ, secular trends in height).

  9.  **"...but the heritability figure is still the best estimate we have of how much of a trait is inborn."**
      *   **Wrong and Misleading:** This is the critical final point you asked about.
      *   **Why it's wrong:**
          *   **"How much of a trait":** Heritability doesn't measure the "amount" of a trait that is genetic *in an individual*. (Point #2).
          *   **"Inborn":** This term is highly problematic. Heritability estimates genetic *variation* influencing the trait *in a specific population/environment*. It does *not* cleanly map to "inborn." Traits develop through complex gene-environment interactions from conception onwards. "Inborn" often implies fixed at birth, which heritability does not measure. Environmental effects can operate very early (prenatal) and genetic effects can manifest later in development (e.g., puberty).
          *   **"Best estimate":** While it *is* an important estimate of the *relative contribution of genetic differences to population variance*, framing it as the "best estimate of how much is inborn" smuggles in the very misconceptions critiqued above (individual attribution, confusion of variation with absolute cause, implication of fixed "innateness"). It implies heritability answers a question ("how much is inborn?") that it fundamentally does not and cannot answer accurately in those terms.

  **Summary & Your Specific Questions:**

  1.  **Is "heritability being our best estimate of how much of a trait is inborn" fair?** **No, it is not fair.** It fundamentally misrepresents what heritability measures. Heritability estimates the proportion of *current population variance* attributable to *genetic variation*. It does *not* measure the proportion "inborn" in an individual or imply that part of the trait is fixed and unchangeable. This phrasing perpetuates the most common and serious misinterpretations.
  2.  **Was your instinct about the group-difference bit correct?** **Absolutely yes.** The claim that high within-group heritability implies a genetic component to between-group differences is a **well-known logical fallacy** in genetics and statistics. It is arguably the most conceptually flawed statement in the paragraph. You picked the right target.

  **Overall Tone & Issue:** The book's paragraph presents heritability in a deceptively "smooth" way by glossing over critical nuances, context dependencies, and logical limitations. It leans heavily towards genetic determinism in its interpretations ("80% of *your* height," "how smart *you* are is mostly DNA," "best estimate of inborn"). While it gets the basic definition right and correctly notes high heritability doesn't preclude change, its application and interpretation consistently overstep what the statistic actually tells us. Your psych lectures are likely emphasizing these crucial limitations and complexities that the book is downplaying or misrepresenting. Your discomfort is well-founded.
