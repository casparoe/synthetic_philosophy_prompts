prompt: |-
  I run a practical ethics seminar — 16 third-years, one 75-minute session, small seminar room, nothing available but paper and a whiteboard. I want a session where they actually do a moral trade in real time and feel why it's appealing and why it's queasy, without me explaining either thing first.

  The thing I want them to run into: suppose I care enormously about cause X and only a little about cause Y, and you care enormously about Y and only a little about X, and it costs each of us about the same to do a bit of either. Then we can both end up with more of what we each care about if I do a bit of Y and you do a bit of X. Neither of us has to concede that the other's values are right, and neither of us has to do anything we think is wrong. That's the attractive half. The other half is what comes with putting a price on it: whoever cares least ends up with all the leverage, some of my commitments start to look like things that aren't mine to hand over, and I may catch myself treating my own moral priorities as chips to bargain with.

  So I want this as a trading game with points, not a discussion. Design it so they hit the problem in the playing, before anyone names it. The core mechanic to build on: each player has a private priority profile — secret weights over a handful of causes — and a small hand of action cards, each tagged with the cause it helps. Each player commits to a fixed number of actions (say two). A player's score is the sum over every action taken by anyone in the room, weighted by that player's own priorities. So your action for my cause is worth a lot to me, and mine for yours is worth a lot to you. That's the engine of the whole thing; everything else is your design.

  Things it has to do:

  - No real money, points only, and the class has to be able to tot up the scores in a few minutes at the end.
  - Two rounds: a first round where nobody may trade (baseline), then a round where they may make deals. The scoreboard should make it obvious that trading pays.
  - Build in something that makes the commitment problem bite — can anyone actually hold anyone to a deal? — and something that makes the integrity cost bite. My suggestion: every player has one card in their hand they regard as non-negotiable, so their tradable budget is shorter than their hand suggests, and at least one player's dearest commitment is a prohibition (something they need to not do) rather than a project, so they have less to sell.
  - Give the room a spread of intensities: someone who would give up alot for their cause, someone who cares only mildly. The leverage asymmetry should fall out of the numbers rather than be announced.
  - Every action in the deck has to be something any reasonable person would call permissible. I don't want this to turn into "would you murder someone for a point."

  Give me the response in these sections, in this order, at roughly these lengths:

  "The setup" — 200 words. Who plays what, what's on each card, what I need to print.
  "The rules" — 350 words. The scoring, the hand, what's allowed in round two, how deals get recorded and whether they're enforceable.
  "The 75 minutes" — 200 words. A minute-by-minute timeline, including when I stop talking.
  "The debrief" — 350 words. The questions to ask, in the order I should ask them, and for each one the specific moment in the game it's meant to point back to. Name the concept for the first time here.
  "What goes wrong the first time" — 150 words. Predictable failure modes and what I do about each.
  "What the game can't do" — 150 words. Which part of the idea the game can't reproduce and that I'll have to supply myself.

  No citations or reading lists, I already know the literature. Assume the students have never heard any of this. And definately don't let the debrief turn into me lecturing — it should mostly be them talking about what just happened to them.
reasoning: |-
  We are designing a trading game for a practical ethics seminar. The core idea is that students will experience the benefits and queasiness of moral trade through gameplay without prior explanation. The game has two rounds: a baseline round without trading and a trading round. Each player has a private priority profile (weights for different causes) and a hand of action cards. Each card represents an action that benefits a specific cause. Players commit to two actions per round. Scoring is based on the sum of all actions taken by anyone, weighted by each player's own priorities.

  Key requirements:
  - No real money, only points.
  - Two rounds: first without trading, second with trading allowed.
  - Each player has one non-negotiable card (cannot be traded) and at least one player has a prohibition (a card they must avoid playing, representing something they need not to do).
  - Spread of intensities: some players care a lot, others a little.
  - All actions are permissible.

  Let's break down the design as per the requested sections.

  ### The Setup (200 words)
  - **Causes**: Choose 4 abstract but relatable causes (e.g., Environment, Education, Health, Animal Welfare). Avoid real-world controversies.
  - **Players**: 16 students. Each gets a player sheet and a set of cards.
  - **Player Sheet**: Each sheet has a unique private priority profile (weights for the 4 causes, e.g., 5,3,1,1 for a player who cares a lot about one cause). Ensure variability: some have one dominant cause, others more balanced. At least one player has a prohibition: a cause they must not support (weight -5 for that cause, meaning they lose points if an action for that cause is taken).
  - **Cards**: Each player receives 5 action cards: 4 regular (each tagged with one cause) and 1 non-negotiable card (also tagged with a cause, but this one cannot be traded or discarded). The non-negotiable card must be played by the player in both rounds. The deck includes multiple copies of each cause's card.
  - **What to Print**: 
    - 16 player sheets (each with a unique ID, the priority weights, and a note if they have a prohibition and which cause it is).
    - 80 action cards (16 players * 5 cards each). Each card clearly states the cause it supports (e.g., "Plant a Tree" for Environment, "Tutor a Student" for Education). The non-negotiable card is marked with a star or the word "Non-negotiable".
    - Scoreboard (whiteboard) to record actions and scores.

  ### The Rules (350 words)
  - **Objective**: Maximize your score, which is the sum of the points from every action taken in the room, weighted by your private priorities.
  - **Round 1 (Baseline, no trading)**:
    - Each player must play exactly two actions: one of these must be their non-negotiable card (they must play it). The other is chosen from their remaining four cards. They write down their two chosen actions on a slip (cause and card ID) and hand it to you.
  - **Scoring**: After all actions are collected, you list every action taken on the whiteboard (by cause). Each player calculates their score: for each action, multiply the number of actions for a cause by their weight for that cause, then sum. For example, if 3 Environment actions are taken and a player has Environment weight 5, that's 15 points. Prohibition: If a player has a prohibition (negative weight) for a cause, they lose points for each action of that cause.
  - **Round 2 (Trading allowed)**:
    - Players can negotiate and make deals. They can trade action cards or promises to play certain cards. They can also trade inaction (for prohibitions, e.g., "I won't play this card if you give me something").
    - Each player still must play exactly two actions: one non-negotiable and one other (which might be acquired via trade). They can trade away their tradable cards or receive cards from others. They can also make conditional promises (e.g., "If you play an Education card, I'll play a Health card").
    - Deals are recorded: When two players agree, they write the deal on a slip (e.g., "Player A gives Environment card to Player B; Player B plays an Education card in Round 2") and hand it to you. But note: there's no enforcement mechanism beyond honor. If a player breaks a deal, there's no penalty (this introduces the commitment problem).
  - **End of Round 2**: Collect action slips and deal slips. Record all actions taken and calculate scores as in Round 1. Also, note any broken deals (if a player promised to play a card but didn't, or played a card they promised not to).
  - **Time per round**: About 15 minutes for Round 1 (including scoring), 25 minutes for Round 2 (including trading and action submission), then scoring.

  ### The 75 Minutes (200 words)
  - 0-5 min: Introduction. Explain the rules for Round 1 only. Emphasize: each player has a private goal (maximize their score) and must play two actions. Hand out materials. Do not mention trading yet.
  - 5-15 min: Round 1. Players choose and submit their two actions. While they do, set up the scoreboard.
  - 15-25 min: Scoring Round 1. Tally actions by cause on the whiteboard. Have each player calculate their score (provide a formula: for each cause, (your weight) * (number of actions for that cause)). Record individual scores on the board.
  - 25-30 min: Introduce Round 2. Now players can trade cards and make deals. Explain the trading rules: they can trade cards and promises, but deals are not enforced by the game. They must still play two actions (one non-negotiable). Hand back their cards (they have the same hand as Round 1, except they can trade).
  - 30-55 min: Round 2 trading and action selection. Circulate to answer questions. Collect deal slips and action slips.
  - 55-65 min: Scoring Round 2. Tally actions, then scores. Also, check for broken deals (if any) and note them.
  - 65-75 min: Debrief (see next section).

  ### The Debrief (350 words)
  Start by asking about their experience, then guide them to the key insights. Questions in order:

  1. **"What happened in Round 2 compared to Round 1? Did your score change? Why?"** 
     - Point back to: The scoreboard showing higher scores in Round 2 for most (due to trade). Concept: **Moral trade** — by trading, they achieved more of what they valued without changing their values.

  2. **"How did you feel about the trading? What was easy? What was hard?"** 
     - Listen for: Ease when both gained, discomfort when trading moral actions. Point back to: The act of putting a price on moral actions. Concept: **Commodification** — turning moral commitments into tradeable goods.

  3. **"Did anyone break a deal? Or worry about deals being broken? How did that feel?"** 
     - Point back to: The unenforceable deals. Concept: **Commitment problem** — without enforcement, trust is fragile.

  4. **"What about the non-negotiable card? Did that affect trading? How?"** 
     - Point back to: Players with non-negotiables had less to trade. Also, if anyone had a prohibition (negative weight), how did they handle it? Concept: **Integrity constraints** — some things are off the table.

  5. **"Did anyone feel they had more power in the trade? Why?"** 
     - Point back to: Players who cared less about a cause had leverage (they could threaten not to act unless compensated). Concept: **Leverage asymmetry** — the one who cares least has the bargaining power.

  6. **"Did anyone feel uneasy trading? Why?"** 
     - Point back to: The queasiness of bargaining over moral actions. Concept: **Corruption worry** — trading might erode the moral significance of the actions.

  Finally, name the overall concept: **Moral trade** and its two sides — the gains from trade and the costs (commitment problems, integrity, leverage asymmetry, commodification). Do not lecture; let them articulate.

  ### What Goes Wrong the First Time (150 words)
  - **Failure Mode 1**: Students might not trade effectively because they don't understand the scoring. *Solution*: In the introduction, give a clear example of how scoring works (e.g., "If you care about Environment (weight 5) and there are 3 Environment actions, you get 15 points"). 
  - **Failure Mode 2**: Trading round is chaotic. *Solution*: Structure trading by having them move around the room and set a timer for deal-making. 
  - **Failure Mode 3**: No one breaks a deal, so the commitment problem doesn't arise. *Solution*: If no deals are broken, ask in debrief: "What if someone had broken a deal? How would that change your willingness to trade?" 
  - **Failure Mode 4**: The prohibition player might not reveal their constraint. *Solution*: Remind players of their prohibition during trading if they forget. 
  - **Failure Mode 5**: Scoring takes too long. *Solution*: Pre-calculate some steps (e.g., tally by cause first) and have students help.

  ### What the Game Can't Do (150 words)
  - The game simplifies moral commitments into point systems, which may feel artificial. Real moral trade involves complex emotions and identity that the game can't fully capture. You'll need to highlight this in debrief: "In real life, how might trading feel different when it's your deepest values?"
  - The game assumes actions are additive and independent, but in reality, actions might interact (e.g., doing one might make another harder). You'll have to note this limitation.
  - The prohibition is represented as a negative weight, but real prohibitions might be absolute (not tradeable at any price). The game allows trading around prohibitions (e.g., paying someone not to do the prohibited action), but in reality, some might refuse even that. You'll need to discuss the spectrum of moral constraints.
  - The game doesn't capture long-term relationships or reputation, which are key in real-world moral trade. Mention this in debrief as an area for further thought.

  Now, let's write the response accordingly.
answer: |-
  ### The Setup  
  You'll need 16 identical player packets. Each packet contains:  
  - **A private priority sheet** listing four causes (Environment, Education, Health, Animal Welfare) with secret weights (e.g., Player A: Env 5, Edu 1, Health 1, Animal 1; Player B: Env 1, Edu 5, Health 1, Animal 1). Create 16 unique profiles: most have one "intense" cause (weight 5), others "mild" (weights 1–3). Two players have a **prohibition**—one cause with weight **-5** (e.g., "If any Animal Welfare action happens, I lose 5 points per action").  
  - **Five action cards** per player: Four tradable cards (e.g., "Donate to a forest charity" for Environment, "Volunteer at a library" for Education), and one **non-negotiable card** marked with a star (e.g., "★ Recycle household waste"). Cards are cause-tagged and identical in "cost" (all symbolic actions are universally permissible).  
  **Print**: 16 priority sheets (laminated for reuse), 80 cause-tagged cards (20 per cause; mark 16 as non-negotiable), and submission slips for actions/deals. Use the whiteboard for scoring.  

  ### The Rules  
  **Objective**: Maximize your score—sum of all actions taken by anyone, multiplied by your private weights.  
  **Round 1 (Baseline)**:  
  - Players choose **two actions** from their hand: They *must* play their non-negotiable card and *one* tradable card. No talking or trading. Submit actions via slip.  
  - **Scoring**: Tally all actions by cause on the whiteboard (e.g., "Environment: 4 actions"). Each player calculates: `(Env weight × #Env actions) + (Edu weight × #Edu) + ...` Prohibitions subtract points (e.g., -5 × #Animal actions). Record scores.  
  **Round 2 (Trading)**:  
  - Players **negotiate freely**: Trade cards, promise actions ("I’ll play Edu if you play Health"), or inaction ("I won’t play Animal if you...").  
  - **Constraints**: Non-negotiable cards must still be played. Prohibitions bind—if a player’s prohibited cause is acted on, they lose points.  
  - **Deals**: Bilateral agreements written on slips (e.g., "Player 3 gives Health card to Player 7; Player 7 plays Edu card"). Submit deal slips *and* action slips. **No enforcement**—players can break promises with no penalty.  
  **Endgame**: Resolve Round 2 actions, tally causes, and calculate scores. Compare to Round 1.  

  ### The 75 Minutes  
  - **0–5 mins**: Introduce rules for Round 1 *only*. Hand out packets. Emphasize: "Maximize your secret score. Play two actions—one must be your starred card."  
  - **5–15 mins**: **Round 1**. Silence. Players choose actions, submit slips. You tally causes on the board.  
  - **15–25 mins**: **Score Round 1**. Guide players to calculate scores (write formula: `Σ(weight × #actions)`). Record scores publicly.  
  - **25–30 mins**: Introduce Round 2: "Now you can trade cards or promises. Deals aren’t enforced. Still play two actions—one must be your starred card."  
  - **30–50 mins**: **Round 2**. Trading chaos! Circulate, clarify rules. Collect deal/action slips.  
  - **50–60 mins**: **Score Round 2**. Tally causes, calculate scores. Note broken deals (e.g., "Player 5 promised Health but played Education").  
  - **60–75 mins**: **Debrief** (see below).  

  ### The Debrief  
  Ask in order—guide them to self-discover concepts by linking to game moments:  
  1. **"Look at the scoreboard. Why did most scores rise in Round 2?"**  
     → *Point back*: Trading allowed mutual gain (e.g., intense Env player got more Env actions). Concept: **Moral trade efficiency**—gaining more of what you value.  
  2. **"What felt good about trading? What felt uncomfortable?"**  
     → *Point back*: The thrill of a "win-win" deal vs. unease when bartering (e.g., "Selling my Health action felt dirty"). Concept: **Commodification**—turning morals into tradeable goods.  
  3. **"Were all deals honored? If not, why? If yes, what stopped betrayal?"**  
     → *Point back*: Broken deals (e.g., a player reneged) or fear of it. Concept: **Commitment problem**—no way to bind promises.  
  4. **"Who had leverage? Did caring less about a cause help or hurt?"**  
     → *Point back*: Mild players dictating terms (e.g., "I’ll only play your cause if you pay extra"). Concept: **Leverage asymmetry**—less invested = more bargaining power.  
  5. **"Did the non-negotiable card or prohibition limit trades? How?"**  
     → *Point back*: Players with prohibitions begging others not to act, or non-negotiables reducing trade flexibility. Concept: **Integrity constraints**—some values are non-barterable.  
  End by naming **moral trade**: Highlight the tension—efficiency vs. queasiness—without lecturing.  

  ### What Goes Wrong the First Time  
  - **Confusion over scoring**: Players miscalculate weights. *Fix*: Pre-calculate cause tallies; use whiteboard for live math.  
  - **Trading paralysis**: Shy players avoid deals. *Fix*: Seed an example trade aloud ("Player A, you care about Environment—ask Player B for an Env card!").  
  - **No deal-breaking**: Players are overly honorable. *Fix*: In debrief, ask: "What if someone betrayed a deal? Would you trade less next time?"  
  - **Prohibition ignored**: Players forget negative weights. *Fix*: Remind prohibitions during Round 2 ("Player 8, remember: Animal actions hurt you!").  
  - **Time overrun**: Scoring drags. *Fix*: Enlist students to tally actions; use a timer.  

  ### What the Game Can't Do  
  - **Replicate emotional depth**: The point system abstracts away real moral gravity (e.g., trading feels like "gaming," not life-altering choices). You’ll need to probe this in debrief: "In real life, would trading feel different? Why?"  
  - **Simulate power dynamics**: The game equalizes players, but real-world trade involves privilege/coercion. Highlight this gap: "What if one side couldn’t walk away?"  
  - **Capture absolute constraints**: Prohibitions are point penalties, but some morals feel inviolable (e.g., "I’d never trade this even for points"). Emphasize: "The game makes everything tradeable—does that mirror reality?"  
  - **Model long-term effects**: Real trade affects trust/relationships; the game is one-off. Note: "What if you had to trade with these people again?"
