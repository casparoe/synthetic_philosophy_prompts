  Below is a decision procedure for evaluating self-referential card/rule text, designed to be applied by non-experts. It prioritizes rewording over bans/errata and minimizes judgment calls. Apply tests in order; stop early if a clear outcome is reached. For sets, run the procedure on each interconnected component (e.g., cycles of mutually referencing cards/rules).

  ---

  ### **Decision Procedure**
  **Step 1: Identify Self-Reference**  
  - **Test**: Does the text directly reference itself (e.g., "this card," its own name) or create a dependency cycle (e.g., Card A references Card B, which references Card A)?  
  - **Outcomes**:  
    - **No self-reference → Benign** (ship it). Stop.  
    - **Self-reference present → Proceed to Step 2**.  

  **Step 2: Check Grounding**  
  - **Test**: Is the self-referential part based on **fixed, unchangeable properties** (e.g., printed text length, card name, immutable game state) that do not depend on the card/rule's *effect*?  
  - **Outcomes**:  
    - **Grounded** (e.g., "longest printed text" uses fixed text length) → **Benign**. Stop.  
    - **Not grounded** (e.g., "ignore this card" depends on dynamic game state) → Proceed to Step 3.  

  **Step 3: Test for Contradiction (Viciousness)**  
  - **Test**: Assume two states for the card/rule: **Active** (its effect applies) and **Inactive** (its effect does not apply). Does **both** states lead to a logical contradiction?  
    - *Contradiction example*: "Active → Inactive" AND "Inactive → Active" (Russell-like loop).  
  - **Outcomes**:  
    - **Contradiction in both states → Vicious** (ban or rework). Stop.  
    - **No contradiction in at least one state → Proceed to Step 4**.  

  **Step 4: Check for Unique Outcome**  
  - **Test**: After Step 3, is there **exactly one consistent state** (Active or Inactive) that avoids contradiction?  
  - **Outcomes**:  
    - **One consistent state → Benign** (ship it). Stop.  
    - **Multiple consistent states → Underdetermined** (needs tiebreaker). Stop.  

  ---

  ### **Key Rationale**  
  - **Benign**: Grounded or unique outcomes avoid paradoxes (e.g., "longest text" uses fixed properties).  
  - **Vicious**: Contradiction in all states (e.g., Russell’s paradox: "applies if it doesn’t" loops infinitely).  
  - **Underdetermined**: Multiple valid outcomes (e.g., a cycle with two stable states).  
  - **Rewording Preference**: Always propose rewording for vicious/underdetermined cases by **breaking self-reference** (e.g., "other cards" to exclude self, or using fixed properties).  

  ---

  ### **Application to Examples**  
  **1. Nullstone: "Ignore the text of any card that refers to this card."**  
  - **Step 1**: Self-reference (refers to itself via "refers to this card").  
  - **Step 2**: Not grounded (depends on dynamic "ignore" effect). → Proceed.  
  - **Step 3**: Test states:  
    - **Active**: Nullstone ignores itself → its text is inactive → it shouldn’t ignore itself (contradiction).  
    - **Inactive**: Nullstone doesn’t ignore itself → its text is active → it must ignore itself (contradiction).  
    - **Verdict**: Vicious (contradiction in both states).  
  - **Rewording**: Change to "Ignore the text of any **other** card that refers to this card." (Now grounded; "other" excludes self.)  

  **2. Grand Ledger: "The controller draws a card if Grand Ledger’s printed text is longer than every other card in play."**  
  - **Step 1**: Self-reference (refers to itself).  
  - **Step 2**: Grounded (uses fixed "printed text" length; unaffected by its effect).  
  - **Verdict**: Benign. Stop.  

  **3. Rules 9.1 and 9.2 (interdependent pair)**  
  - **Rule 9.1**: "This rule does not apply if rule 9.2 applies."  
  - **Rule 9.2**: "This rule applies if rule 9.1 does not apply."  
  - **Step 1**: Self-reference cycle (9.1 references 9.2, 9.2 references 9.1).  
  - **Step 2**: Not grounded (no fixed properties; depends on each other’s state). → Proceed.  
  - **Step 3**: Test states for the pair:  
    - **State A**: 9.1 Active → 9.2 must be Inactive (from 9.1). Then 9.2 Inactive → 9.1 must be Active (consistent).  
    - **State B**: 9.1 Inactive → 9.2 must be Active (from 9.2). Then 9.2 Active → 9.1 must be Inactive (consistent).  
    - No contradiction in either state. → Proceed.  
  - **Step 4**: **Two consistent states** (State A and State B).  
  - **Verdict**: Underdetermined (needs tiebreaker, e.g., "Rule 9.1 always takes priority").  

  **4. Rules 12.4 and 12.5 (interdependent pair)**  
  - **Rule 12.4**: "This rule applies iff rule 12.5 applies."  
  - **Rule 12.5**: "This rule applies iff rule 12.4 does not apply."  
  - **Step 1**: Self-reference cycle.  
  - **Step 2**: Not grounded. → Proceed.  
  - **Step 3**: Test states:  
    - **Assume 12.4 Active** → 12.5 must be Active (from 12.4). But 12.5 Active → 12.4 must be Inactive (from 12.5; contradiction).  
    - **Assume 12.4 Inactive** → 12.5 must be Inactive (from 12.4). But 12.5 Inactive → 12.4 must be Active (from 12.5; contradiction).  
  - **Verdict**: Vicious (contradiction in all states).  
  - **Rewording**: Remove mutual dependency (e.g., base 12.4 on a fixed property like "if a blue card is in play").  

  ---

  ### **Limitations and Committee Talking Points**  
  1. **What the Procedure Cannot Do**:  
     - **Complex Interactions**: Struggles with large cycles (e.g., 5+ cards/rules referencing each other). Manual analysis becomes impractical; automated tools needed.  
     - **Ambiguous Language**: Relies on precise interpretation of card text (e.g., "applies if" vs. "applies iff"). Judgment calls may arise in parsing intent.  
     - **Dynamic Game State**: Only checks static consistency. Playtesting is still needed for runtime issues (e.g., timing conflicts).  
     - **Non-Binary Outcomes**: Designed for Active/Inactive states. Fuzzy outcomes (e.g., "modify by X") require custom tests.  

  2. **Judgment Calls Dressed as Procedure**:  
     - **Step 2 (Grounding)**: Deciding "fixed vs. dynamic" properties (e.g., is "printed text" always immutable? Usually yes, but hacks exist).  
     - **Step 3 (Contradiction)**: Requires assuming all possible states; complex cycles may hide contradictions.  
     - **Step 4 (Unique Outcome)**: Verifying "exactly one" state can be error-prone in large sets.  

  3. **Committee Defense**:  
     - **Why Not Always Reword?** "We prioritize rewording (e.g., adding 'other' or using fixed properties) to preserve designs. Bans/errata are last resorts due to cost and player frustration."  
     - **Why Not Stratify Language?** "Stratification (e.g., 'cards can’t reference their own effects') is too blunt. Our procedure is surgical—it allows harmless self-reference (e.g., Grand Ledger) while catching only true paradoxes."  
     - **Why Trust This?** "Based on Russell’s paradox: vicious loops are forbidden, but grounded/unique self-reference is safe. This prevents judge disagreements and post-release fixes."  
     - **Urgency**: "We’ll run this pre-release on all cards. For time-intensive cases (e.g., large cycles), we’ll reword preemptively."  

  **Final Recommendation to Committee**: Adopt this procedure for design-phase checks. Pair it with:  
  - A **rewording guide** (e.g., "Replace self-reference with 'other' or fixed properties").  
  - A **tiebreaker policy** for underdetermined cases (e.g., "lower card ID wins").  
  - **Playtesting fallback** for dynamic edge cases.  

  By catching 90% of issues pre-release, we reduce errata by targeting only true paradoxes.
