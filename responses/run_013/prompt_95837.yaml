answer: |-
  ## Concurring Opinion: Claimant's Appeal Should Be Sustained and Benefits Awarded

  **To the Honorable Members of the Appeals Board:**

  This opinion addresses the appeal of Claimant, a school custodian who suffered an acute exposure to a cleaning solvent during a workplace spill. While the acute symptoms resolved, she subsequently developed persistent headaches, dizziness, word-finding difficulties, and a severe intolerance to everyday chemical exposures (e.g., perfumes, paints, detergents), rendering her unable to work for two years. The Board unanimously finds Claimant is suffering and disabled from her former employment. The sole, albeit critical, dispute is whether her condition constitutes an "occupational disease" as defined by our statute: one requiring "a demonstrable pathological change in bodily tissue or function." After careful consideration of the record, the arguments presented, and our prior precedent, I conclude Claimant meets this statutory standard. I recommend **REVERSING the denial and AWARDING benefits**. My reasoning follows.

  **I. The Undisputed Facts and the Core Dispute**

  No party disputes the central narrative: Claimant suffered a compensable workplace injury through inhalation of the solvent. While initial respiratory symptoms resolved, she developed a debilitating constellation of chronic symptoms objectively preventing her from custodial work and significantly impairing her daily life. Her treating physician, a board-certified specialist, diagnosed "multiple chemical sensitivity" (MCS) and posited "central sensitization" as the pathological mechanism. This theory describes a durable, maladaptive change in the central nervous system's processing of sensory signals, particularly chemical and pain stimuli, amplifying responses and lowering thresholds. Critically, her expert concedes this alteration is functional – demonstrable through symptom patterns, neurological exams focusing on sensory processing, and potentially quantitative sensory testing – but not visible via conventional imaging (MRI, CT) as a structural "lesion."

  The Employer's expert disputes the validity of MCS as a diagnostic category, labeling it "junk science." They attribute Claimant's symptoms primarily to psychological factors: conditioned avoidance behavior and hypervigilance stemming from the initial traumatic exposure. Their core argument is that a mechanism "inferred only from the symptoms it's supposed to explain" cannot satisfy the statutory requirement for a "demonstrable pathological change."

  **II. Reconciling Precedent and the Statute**

  Our prior holding that a claimant "doesn't need a named diagnosis, only a demonstrated impairment" is pivotal yet seemingly at odds with a statute demanding a "pathological change." This tension requires careful resolution.

  *   **The Precedent's Foundation:** That prior decision correctly recognized that medicine evolves, and diagnostic labels can be contested or lag behind observable phenomena. The *essence* was that compensability hinges on objective evidence of bodily dysfunction causing disability, not adherence to a specific, universally accepted diagnostic code. It focused on the *effect* – the impairment – rooted in a bodily change.
  *   **Interpreting "Pathological Change":** The statute contains two distinct prongs: change in **tissue** OR change in **function**. "Tissue" change implies structural alteration, potentially visible. "Function" change, however, inherently refers to how a bodily system operates, not necessarily its structure. Neurological and neuroendocrine functions – governing pain perception, sensory integration, autonomic responses – are prime examples. A "pathological" change in function means an abnormal, disease-related alteration in how that system works.
  *   **Reconciling the Two:** Our precedent aligns with the "function" prong. A "demonstrated impairment" *is evidence* of a pathological change in function. If the body cannot perform its ordinary activities due to an abnormal operational state caused by a workplace exposure, that satisfies the "pathological change in... function" requirement, irrespective of whether a universally accepted diagnostic label exists or whether the change is visible on a scan. To demand a visible lesion for *all* occupational diseases would render the "function" prong superfluous and contradict our prior ruling. Many recognized conditions (e.g., certain chronic pain syndromes, dysautonomias, some neuroendocrine disorders) are diagnosed based on functional derangement, not structural pathology.

  **III. Application to Claimant's Condition**

  Applying this interpretation, Claimant meets the statutory standard:

  1.  **Pathological Change in Function:** The theory of central sensitization, presented by a qualified expert and supported by the clinical history and findings (including documented neurological exam abnormalities consistent with sensory processing dysfunction), describes a "demonstrable pathological change in bodily... function." It is a proposed explanation for *how* her nervous system's operation has been durably altered at a physiological level – specifically, its signaling thresholds and processing pathways for chemical and sensory stimuli. This is not merely a description of symptoms; it is a proposed mechanism *explaining* the constellation of symptoms and their persistence. While not visible on a scan, the dysfunction manifests demonstrably through her objective neurological responses and profound intolerance. The mechanism is inferred not *solely* from the symptoms, but from the *pattern* of symptoms, the triggering event, the documented neurological findings, and the current scientific understanding (even if contested) of neural plasticity and sensitization.
  2.  **Causation:** The temporal relationship to the significant workplace exposure, the absence of pre-existing similar symptoms, and the expert medical opinion directly link this pathological functional change to the industrial accident.
  3.  **Impairment:** The resulting functional impairment – her inability to work as a custodian or tolerate normal environments – is severe, undisputed, and directly flows from this altered neurological function.

  **IV. Addressing the Strongest Counterarguments**

  My colleagues favoring affirmance raise significant concerns that demand candid acknowledgment:

  *   **The Employer's Strongest Argument: Slippery Slope & Diagnostic Validity:** The Employer powerfully argues that compensating based on central sensitization/MCS, lacking visible pathology and relying on a mechanism inferred from symptoms, opens the floodgates to subjective claims of stress, anxiety, and sensitivity without verifiable physiological grounding. They contend it reduces the statute to meaninglessness and invites fraud. **This is a legitimate policy concern.** Granting benefits here *does* set a precedent for conditions diagnosed primarily through symptom clusters and functional derangement rather than tissue damage.

      *   **Response:** However, this claim is distinguishable. It arises from a *documented, significant acute toxic exposure*, followed by a specific pattern of objectively verifiable neurological symptoms and intolerance profoundly impacting function. Our decision is *not* based solely on Claimant's subjective report but on the *expert medical opinion* diagnosing a specific pathological *functional* mechanism (central sensitization) causally linked to the exposure. The threshold remains high: claimants must demonstrate, through qualified medical evidence, 1) a specific pathological change in tissue *or* function, 2) causally related to the workplace, and 3) resulting in impairment. This does not open the door to vague stress claims lacking a proposed physiological mechanism linked to work. The "function" prong requires medical evidence of an *abnormal bodily process*, not mere subjective distress. Future boards must rigorously scrutinize the medical evidence for a demonstrable pathological functional change causally tied to work and resulting in genuine impairment.

  *   **Colleague's Strongest Argument: Value Judgment vs. Medical Fact:** My colleague posits the statute is "quietly incoherent," arguing that "function" relies on societal norms about what a body "should" do, meaning the Board is inherently making value judgments about disability, not medical ones.

      *   **Response:** While insightful, this perspective risks abdicating our duty to apply the statute as written. The statute *does* require a "pathological change," implying a medical judgment about abnormality. Medicine *does* define functional norms (e.g., ranges for heart rate, hormone levels, sensory thresholds). While societal norms influence disability assessments, the core question here – *is there a pathological change in bodily function?* – is fundamentally medical. We rely on medical experts to define the pathological state. Central sensitization, as presented here, is offered as a medical explanation for a pathological functional state, not merely a social judgment about inconvenience. Our role is to determine if the medical evidence meets the statutory criteria, not to declare the criteria illusory.

  **V. Disposition and a Workable Standard**

  For the reasons stated, I find Claimant has established an occupational disease: a pathological change in bodily function (central sensitization of the nervous system) caused by her workplace exposure to solvent, resulting in total disability. The denial should be **REVERSED**, and benefits **AWARDED**.

  This decision provides a concrete, applicable standard for future cases involving contested functional disorders:

  1.  **Documented Exposure:** A significant workplace exposure or injury must be established.
  2.  **Medical Evidence of Pathological Functional Change:** Qualified medical evidence must identify a specific, pathological alteration in how a bodily system *functions* (e.g., neurological signaling, endocrine regulation, immune response), explaining the symptoms. This cannot be solely a restatement of symptoms or a purely psychological diagnosis (unless psychological injury is independently compensable).
  3.  **Causal Link:** Medical evidence must causally connect the pathological functional change to the workplace exposure.
  4.  **Resulting Impairment:** Objective evidence must demonstrate the functional change causes a material impairment in work capacity or major life activities.

  This standard honors both the "function" prong of the statute and our precedent requiring demonstrated impairment over specific diagnosis, while maintaining a medically grounded threshold that addresses legitimate concerns about unfounded claims. It recognizes that the inability of current technology to visualize a lesion does not negate the reality of a debilitating, exposure-induced change in how the body functions.
