  First, I need to recall Strawson's Basic Argument. The user summarizes it well: responsibility for actions requires responsibility for character, which leads to an infinite regress because we didn't choose our initial conditions. The user thinks this is causal and deterministic, so they're confused when told it's independent of determinism.

  The user's main confusion is why indeterminism doesn't solve the problem. They mention a "gap" where decisions aren't fully determined, suggesting that's where free will might operate. I need to explain why Strawson thinks even indeterminism doesn't help. The key here is the concept of "ultimacy" or "causa sui." If a decision is undetermined, it's random, not controlled by the agent. If it's determined, it's caused by prior factors. Either way, the agent isn't the ultimate source.

  Then there's the smaller puzzle about the friend who remade himself. The user sees this as taking responsibility for character. But Strawson would argue the friend's ability to change depended on prior traits and circumstances he didn't choose. So it's not ultimate responsibility.

