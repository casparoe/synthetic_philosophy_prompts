prompt: |-
  I'm a third-year cogsci student and I'm currently in a metaphysics of causation seminar. My other life is causal inference for ML, so my head is full of DAGs, do-calculus, potential outcomes, and token vs type causation. We've been doing causation by omission -- the gardener who doesn't water the plant, the doctor who doesn't prescribe, double prevention, all that -- and I keep trying to shove it into an SCM and it half works. Can you restate the main positions on omission (counterfactual dependence, causal process/mechanism, agency or action-based views, the norm/default stuff) in the vocabulary I actually use, as faithfully as possible? Then give me the residue report. What translates cleanly -- e.g. does not watering just become a variable set to its default, and is the do-operator even defined for non-events? What only translates with distortion? What has no counterpart at all? I'm especially curious whether double prevention and the omission/prevention asymmetry survive the translation or collapse into the same blocked-path story, and whether the fact that omissions aren't events means the SCM vocabulary is missing something or the original debate was less clear than it looked. Don't give me a reading list, just the translation and the residue.
reasoning: |-
  We are going to map the philosophical concepts about causation by omission into the causal inference framework (using SCMs, DAGs, do-calculus, potential outcomes). We will then identify what translates cleanly, what with distortion, and what has no counterpart.

  Key Philosophical Positions on Omission:

  1. **Counterfactual Dependence**: An omission (like the gardener not watering) causes the outcome (plant dies) if and only if, had the watering occurred, the outcome would not have occurred. This is the counterfactual account.

  2. **Causal Process/Mechanism**: Omissions aren't causes because there is no physical process connecting the omission to the outcome. For example, the absence of water doesn't transmit energy or information.

  3. **Agency or Action-Based Views**: Causation by omission is tied to agency: we typically attribute causation by omission when there is a normative expectation of action (e.g., the gardener is supposed to water).

  4. **Norm/Default Views**: Omissions are causes only relative to a norm or default. The gardener not watering is a cause because watering is the expected norm. Without a norm, the absence of rain wouldn't be a cause (unless we have a norm that it should rain?).

  Translation to Causal Inference Framework:

  - We model the world with variables. An omission (like "the gardener does not water") can be represented by a binary variable: W = 1 if watering occurs, 0 otherwise. The plant's health H (say, H=1 alive, 0 dead) depends on W.

  - The counterfactual dependence is straightforward: if we set W=1 (do(W=1)), then H would be 1 (alive). But when W=0, H=0. So the counterfactual holds: had W been 1, H would have been 1 (so the plant would not have died). Therefore, the omission (W=0) caused H=0.

  - However, note that in the SCM, the variable W is already in the model. But the omission is the event that W=0. The do-operator is defined for variables and their values. So we can set W to 0 or 1. But note: the omission is the *event* that W=0. In the SCM, we can represent events by values of variables.

  Clean Translation:

  - **Counterfactual Dependence**: This translates directly. We can use the potential outcome: H(0) = 0 and H(1)=1. Then the effect of the omission (W=0) is H(0)=0, and the counterfactual "if it had been watered" (W=1) would have been H(1)=1. The condition for causation by omission is that H(0) ≠ H(1) and we observe W=0 and H=0.

  - **Agency and Norm/Default Views**: We can encode the norm by the way we set up the model. For example, we might have a variable for the gardener's duty (D=1 if the gardener is on duty, 0 otherwise). Then the norm is that when D=1, we expect W=1. Then we can condition on D=1 and see that W=0 caused H=0. Without D=1, we might not consider the gardener's omission a cause. Alternatively, we can set the default value of W to 1 (the expected action) and then the omission is a deviation (setting W=0). The do-operator can represent an intervention that sets W to a non-default value.

  Distortion in Translation:

  - **Causal Process/Mechanism**: The SCM framework does not explicitly represent physical processes. It only represents dependencies. So the objection that there is no physical process for omission is not captured. In the SCM, we have an arrow from W to H, but that arrow might represent a mechanism (like water flow) when W=1, but when W=0, there is no mechanism. The framework doesn't distinguish between a mechanism that is active when the variable is at a certain value and the absence of activity. Therefore, the causal process view's objection is not represented in the SCM, unless we try to model the mechanism explicitly (which we might do with more detailed variables, but then we run into the problem that the mechanism for absence is not a physical thing).

  - **Omission as Non-Event**: In the SCM, we represent the omission by a value of a variable (W=0). But in philosophy, some argue that omissions are not events. The SCM framework does not have a separate category for events vs. non-events. Everything is a variable with values. This might be a distortion: we are representing an absence (non-event) as a positive state (a value of a variable). However, in practice, this representation is standard.

  Residue (What Doesn't Translate):

  - **Causal Process/Mechanism**: The idea that causation requires a physical process (like energy transfer) has no direct counterpart in the SCM. The SCM is abstract and doesn't care about the ontology of the variables. We can model anything as a variable. Therefore, the objection that omissions lack a physical process is outside the framework.

  - **The Intuition of Asymmetry in Prevention and Omission**: Consider double prevention: A prevents B from preventing C, so A causes C. Example: A removes a barrier that would have blocked C, so C occurs. This is a case of double prevention. In an SCM, we can model this with variables. Let B be the barrier (B=1 if barrier is present, 0 if not). Let A be the removal of the barrier (A=1 if removed, 0 if not). Then C (say, a ball rolling to the end) occurs only if B=0. And B=1 by default, unless A=1. Then we have:
     C = 1 if B=0, else 0.
     B = 0 if A=1, else 1.

     Then if A=1 (we remove the barrier), then B=0 and C=1. So A=1 causes C=1. This is a clean translation.

  - **Omission vs. Prevention Asymmetry**: In philosophy, there is sometimes an asymmetry between omission and prevention. For example, not watering (omission) is seen as causing death, but preventing watering (e.g., locking the gardener out) is seen as causing death too. But are they the same? In the SCM, we can model both:

     Case 1: Omission. Gardener does not water (W=0) → plant dies (H=0).

     Case 2: Prevention. Someone locks the gardener out (L=1) → gardener cannot water (so W=0) → plant dies (H=0).

     In both cases, the plant dies because W=0. But in the prevention case, we have an active cause (L=1) that set W=0. In the omission case, we simply have W=0 without an active cause (maybe the gardener just forgot). However, in the SCM, we can model the omission without the locking variable. If we don't model the locking variable, then W=0 is an exogenous event. But if we model the locking, then we have an active cause. The asymmetry in the philosophical debate might be about the level of description. The SCM framework does not inherently distinguish between active causes and omissions at the variable level. Both are just values of variables.

     However, note that in the prevention case, we have a positive action (locking) that is the cause, and the omission (W=0) is an intermediate variable. In the omission case, we attribute cause directly to W=0. But we could always model the omission as having an underlying cause (like the gardener's forgetfulness) and then we would have an active cause. The SCM framework does not force one level of description. Therefore, the asymmetry might collapse: both are ultimately about setting W=0. The difference is whether we choose to model the cause of W=0 or not.

     But note: the norm/default view might help. We might set the default for W to 1 (watering). Then the omission (W=0) is a deviation from the default. Similarly, in the prevention case, we might set the default for L (locking) to 0 (not locked). Then L=1 is a deviation and causes W=0. So both cases involve a deviation from a default. The residue is that the SCM does not have a built-in notion of default. We have to impose it from outside.

  - **Double Prevention**: As above, we can model it cleanly. It is just a chain of dependencies. The philosophical worry that double prevention is somehow different from regular causation doesn't show up in the SCM. The SCM just sees a path of dependencies.

  - **Non-Events and the Vocabulary**: The SCM vocabulary does not have a concept of "non-event". We represent everything as a variable taking a value. So if the original debate hinges on omissions not being events, then that debate has no counterpart in the SCM. The SCM framework is flexible enough to represent the dependencies we care about, without worrying about the ontological status. Therefore, the debate about whether omissions are events might be seen as irrelevant in the SCM framework, or the SCM framework is missing that ontological distinction.

  Summary:

  - Clean: Counterfactual dependence, agency/norm views (if we include norms as variables or defaults in the model), double prevention.

  - Distortion: The causal process/mechanism view doesn't fit because the SCM doesn't represent physical mechanisms. The representation of omissions as variable values might be seen as a distortion because it turns an absence into a positive value.

  - Residue (No counterpart):
     - The physical process requirement for causation (from the mechanism view) is absent.
     - The ontological distinction between events and non-events (omissions) is not captured. The SCM framework doesn't care: it's all variables.
     - The omission/prevention asymmetry: in the SCM, if we model the same set of variables, they are the same (both lead to W=0). The asymmetry comes from the level of abstraction and the norms we impose (which are external). The SCM itself does not have a built-in asymmetry.

  Conclusion:

  The SCM framework is very flexible and can represent the counterfactuals and dependencies in causation by omission, double prevention, etc. However, it does not capture the metaphysical concerns about the nature of omissions (as non-events) or the requirement of a physical process. The debate about the asymmetry between omission and prevention collapses in the SCM because they are both represented by the same structure (setting a variable to a value that is not the norm). The residue is the physicality and ontology that the SCM abstracts away.
answer: |-
  ### Translation of Omission Causation into Causal Inference Vocabulary  
  **Core positions restated using SCMs/DAGs/potential outcomes:**  

  1. **Counterfactual Dependence (e.g., David Lewis):**  
     - **Translation:** Omission \(X = 0\) (e.g., "gardener does not water") causes \(Y = y\) (e.g., "plant dies") iff:  
       - \(Y_{X=1} \neq Y_{X=0}\) (i.e., if \(X\) had been 1, \(Y\) would differ).  
       - In observed reality, \(X=0\) and \(Y=y\) hold.  
     - **SCM Implementation:**  
       - Model \(X\) as a binary intervention variable (e.g., \(X \in \{0,1\}\) where 0 = "no water").  
       - Define potential outcomes: \(Y_{X=0} = 1\) (plant dies), \(Y_{X=1} = 0\) (plant survives).  
       - Omission causation \(\equiv\) observed \(X=0\) and \(Y=1\), with \(Y_{X=1} = 0\).  
     - **Cleanliness:** Perfect fit. Uses standard potential outcomes logic.  

  2. **Causal Process/Mechanism (e.g., Phil Dowe):**  
     - **Translation:** Omissions aren’t causes because they lack physical processes/mechanisms (e.g., no energy transfer when water isn’t poured).  
     - **SCM Implementation:**  
       - Represent mechanisms as **structural equations** (e.g., \(Y := f(X, U)\) where \(U\) is noise).  
       - Omission (\(X=0\)) implies no causal path is **activated** (e.g., \(f\) "sleeps" when \(X=0\)).  
     - **Cleanliness:** Partial fit. SCMs encode dependencies but don’t distinguish "active" vs. "inactive" mechanisms—both are just functional relationships.  

  3. **Agency/Norm-Based Views (e.g., Schaffer):**  
     - **Translation:** Omission causation requires a **normative default** (e.g., "gardener should water").  
     - **SCM Implementation:**  
       - Add a **norm variable** \(N\) (e.g., \(N=1\) = "duty to water", \(N=0\) = no duty).  
       - \(X\)’s default is set by \(N\): \(X_{\text{default}} = 1\) if \(N=1\).  
       - Omission = intervention setting \(X=0\) when \(N=1\).  
       - Causation holds iff \(Y_{X=0} \neq Y_{X=\text{default}}\).  
     - **Cleanliness:** Clean if norms are explicit variables. The `do`-operator applies, but only if norms are modeled.  

  4. **Prevention vs. Omission Asymmetry:**  
     - **Philosophical Claim:** Preventing an event (e.g., "locking gardener out") is causal, but omitting isn’t—despite symmetric counterfactuals.  
     - **SCM Translation:**  
       - **Prevention:** Modeled as an **active intervention** (e.g., \(Z = \text{lock door}\), which forces \(X=0\)).  
       - **Omission:** \(X=0\) with no active intervention (e.g., no \(Z\), just \(X=0\) exogenously).  
       - **Asymmetry Survival:**  
         - Prevention: Active path (\(Z \rightarrow X \rightarrow Y\)) with \(Z=1\) setting \(X=0\).  
         - Omission: No active path; \(X=0\) is a "passive" state.  
       - **Collapse?** Only if norms are ignored. With norms (\(N\)), omission when \(N=1\) is a **deviation**, while prevention forces deviation.  

  5. **Double Prevention (e.g., "A prevents B from preventing C"):**  
     - **Translation:** Represents **causal chains** with two negations.  
       - *Example:* \(A=1\) (remove barrier) \(\rightarrow B=0\) (no block) \(\rightarrow C=1\) (ball rolls).  
     - **SCM Implementation:**  
       - Variables: \(A\) (act), \(B\) (blocker), \(C\) (outcome).  
       - Structural equations:  
         - \(B := 1 - A\)  // If \(A=1\), blocker removed (\(B=0\))  
         - \(C := B\)      // If no blocker (\(B=0\)), \(C=1\)  
       - **Cleanliness:** Flawless. Double prevention = mediated path (\(A \rightarrow B \rightarrow C\)) with two inhibitory links.  

  ---

  ### Residue Report  
  **What Translates Cleanly:**  
  - **Counterfactual dependence:** Directly maps to potential outcomes (\(Y_x\)).  
  - **Double prevention:** Fully captured as DAG paths with inhibition (e.g., \(A \rightarrow \neg B \rightarrow C\)).  
  - **Agency/norm-based views:** Modelable with explicit norm variables (\(N\)) and default states.  
  - **Prevention vs. omission asymmetry:** Survives if norms are included (e.g., \(N=1\) makes \(X=0\) "abnormal").  

  **What Translates with Distortion:**  
  1. **Omissions as non-events:**  
     - **Problem:** Philosophically, omissions aren’t "events"; SCMs force them into variables.  
     - **Distortion:** Representing "not watering" as \(X=0\) reifies it as an event-like state.  
     - **Mitigation:** Treat \(X=0\) as the **absence of an intervention**, not a positive event.  

  2. **Causal process/mechanism:**  
     - **Problem:** SCMs lack "physicality" (e.g., no distinction between *active* inhibition and *passive* absence).  
     - **Distortion:** A missing arrow in a DAG (no edge \(X \rightarrow Y\)) vs. an edge with \(X=0\) (omission) are conflated.  
     - **Mitigation:** Use **dynamic SCMs** (e.g., state transitions over time) to approximate "process".  

  3. **Default states and the `do`-operator:**  
     - **Problem:** `do(X=x)` assumes \(X\) is intervenable, but omissions aren’t "interventions" in the physical sense.  
     - **Distortion:** `do(X=0)` (e.g., "force no water") vs. natural \(X=0\) ("forgot to water") are observationally identical but metaphysically distinct.  

  **No Counterpart:**  
  1. **Ontology of absences:**  
     - SCMs have no machinery for "non-events." The debate about whether omissions *exist* is invisible—SCMs only care about dependencies.  
     - **Result:** The claim "omissions aren’t real causes" (per process theories) has no SCM analog.  

  2. **Intrinsic normativity:**  
     - Norm-based views require *external* context (e.g., duties). SCMs can model norms as variables, but this **relativizes** causation (e.g., \(N\) must be defined exogenously).  

  3. **Prevention/omission asymmetry without norms:**  
     - Without norm variables, prevention (\(Z \rightarrow X=0\)) and omission (\(X=0\)) collapse into the same DAG path-blocking story.  
     - **Survival:** The asymmetry only persists if norms are explicit (e.g., \(X=0\) is causal iff it deviates from \(X_{\text{default}}\)).  

  ---

  ### Verdict  
  - **SCM Strengths:** Handles counterfactuals, double prevention, and norm-based views with minor modeling adjustments. Prevention/omission asymmetry survives if norms are formalized.  
  - **Gaps:** Fails to capture the non-event status of omissions and physical process concerns. The "metaphysical residue" is the intuition that omissions aren’t "real" causes—a claim SCMs sidestep by focusing on dependences.  
  - **Conclusion:** The debate isn’t less clear—SCMs are ontologically flexible but metaphysically shallow. They *describe* causation by omission cleanly but can’t *justify* it without importing norms or reifying absences. Double prevention and prevention/omission are distinguishable only if the model includes agency/norms. Otherwise, they reduce to path-blocking in DAGs.
