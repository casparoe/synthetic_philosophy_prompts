  I'll organize the weaknesses from most to least damaging: the unfalsifiability problem is potentially fatal; the banality of non-recognition is seriously damaging; technical/accidental losses create awkwardness; hyper-visibility of the powerless requires concessions; and absence of the powerful needs explanation. The self-silencing argument is tricky but defensible within their framework.

