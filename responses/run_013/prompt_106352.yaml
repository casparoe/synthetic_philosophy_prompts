  ## Rootstock Wellness Collective: Temporal Alignment FAQ  

  **Q: What is Rootstock’s core philosophy?**  
  A: Rootstock believes that an unexamined past impedes present potential. Our proprietary Temporal Alignment™ methodology offers structured pathways to reconcile personal history, thereby optimizing holistic well-being. Discomfort is not a bug; it is a feature of profound growth.  

  **Q: What distinguishes Rootstock from other retreats?**  
  A: We reject one-size-fits-all solutions. Instead, we offer three evidence-based therapeutic tracks—Monumental, Antiquarian, and Critical—each targeting distinct relational patterns with temporality. Our approach is intensive, immersive, and tailored to high-capacity individuals seeking transformation beyond superficial mindfulness.  

  **Q: Who is the Monumental track for?**  
  A: Monumental is designed for visionaries burdened by underachievement. Clients engage with biographies, speeches, and symbolic artifacts of history’s "great minds" to cultivate heroic agency. Ideal for entrepreneurs, leaders, and those sensing dormant grandeur.  

  > *Testimonial:* "Monumental didn’t just change my outlook—it *became* my outlook. My coach helped me see I’m not just a regional sales director; I’m a conqueror shaping destiny. I’ve mortgaged my condo to fund my start-up. Legacy demands sacrifice." — *Brendan K., Track: Monumental*  
  > *^Participation may involve recalibration of achievable benchmarks. Rootstock is not liable for financial, marital, or existential repercussions stemming from perceived historic parallels.*  

  **Q: Who benefits from the Antiquarian track?**  
  A: Antiquarian serves those feeling culturally or genealogically untethered. Clients curate lineage archives, handle heirlooms (replica or sourced), and practice ritualistic homage to continuity. Suited for heirs, tradition-bearers, and the nostalgically adrift.  

  > *Testimonial:* "I finally understand my duty: preservation. I’ve cataloged 4,200 family photos, restored my great-grandfather’s pocket watch (non-functioning), and now host monthly séances to consult ancestors on home decor. My therapist calls it ‘arrested development.’ I call it sacred stewardship." — *Eleanor V., Track: Antiquarian*  
  > *^Antiquarian practices may induce hyper-attachment to inert objects/metaphors. Clients report decreased engagement with non-archival present-tense experiences, including childcare, career advancement, and casual conversation.*  

  **Q: Is the Critical track essentially blame therapy?**  
  A: No. Critical is a rigorous forensic protocol for those suffocated by inherited narratives. Clients learn deconstruction techniques, evidence-based condemnation of detrimental legacies, and symbolic severance rituals. Ideal for revolutionaries, black sheep, and the institutionally disillusioned.  

  > *Testimonial:* "Critical taught me to weaponize my resentment. I drafted a 90-page indictment of my parents’ ‘emotional capitalism,’ held a mock trial (verdict: guilty), and ritually burned my childhood piano. My liberation is absolute—except when I call them weekly to itemize their failures." — *Marcus T., Track: Critical*  
  > *^Critical engagement may manifest as recursive fury. Rootstock acknowledges all liberation is provisional; familial bonds, taxonomically speaking, are notoriously fire-resistant.*  

  **Q: Do you offer less… analytical options?**  
  A: Yes. Our **Present Tense™** package (28% of clients) employs sensory deprivation, guided neural quieting, and pharmacologically assisted episodic memory suppression. Participants achieve radical presence: no history, no projection, just organic immediacy. Think of it as cognitive composting.  

  > *Testimonial:* "I don’t remember who I was before Present Tense. Seriously. The neural scrub (optional add-on) wiped my grad school trauma, my ex-husband’s face, and apparently how to file taxes. Bliss isn’t a feeling—it’s an empty room. 10/10." — *Jia L., Track: Present Tense*  
  > *^Permanent episodic memory alteration carries risks including: navigation deficits, social discontinuity, and vulnerability to reinvention scams. Not reversible. Not therapy.*  

  **Q: I seek neither change nor confrontation. Do you accommodate that?**  
  A: Our **Eternal Return** package (0.3% uptake) teaches radical acceptance of stasis. Clients study geological time, practice insignificance meditation, and cultivate sublime indifference to becoming. A serene surrender to the perpetual re-enactment of inherited patterns.  

  > *Testimonial:* [REDACTED: No testimonials on file. Package currently suspended due to lack of interest.]  
  > *^Eternal Return requires extreme ontological flexibility. Warning: May exacerbate nihilism, torpor, and/or fatalism. Not recommended for high achievers, parents, or the clinically optimistic.*  

  **Q: How do I choose the right track?**  
  A: Our Temporal Alignment Intake Assessment™ (TAIA) maps your neuro-historical profile via biometrics, lineage analysis, and a proprietary "Regret Density Index." Most clients resonate intuitively with one track—though we note Present Tense clients rarely recall choosing it.  

  **Q: What outcomes can I expect?**  
  A: Clients report heightened temporal coherence, though manifestations vary: Monumental clients often pursue legacy projects; Antiquarians achieve archival serenity; Critical clients report satisfying rupture. Present Tense clients exhibit reduced metacognition. Eternal Return clients, theoretically, expect nothing. Satisfaction is not guaranteed; enlightenment is billed hourly.  

  **Q: Is Rootstock covered by insurance?**  
  A: Temporal Alignment™ is classified as "experiential hermeneutics." Reimbursement requires ICD-11 code Z73.8 (Problems related to life-management difficulty) and a physician’s note diagnosing "chronological dysphoria." We provide elegant billing statements suitable for framing.  

  **Q: How do I begin?**  
  A: Submit a deposit equal to 40% of your annual discretionary income (minimum $14,500). The past is waiting. So is our concierge.  

  **Rootstock Wellness Collective**  
  *Reconcile Your Yesterday. Lease Your Tomorrow.*  
  📍Secured Location, Catskills, NY  
  📧 dna@rootstockwellness.com  
  ℹ️ *Results may not reflect brochure imagery. All tracks risk ontological destabilization. No refunds following temporal unpacking. Consult your soul.*  

  ---

  **Satirical Mechanics Breakdown (for your eyes only):**  
  - **Deadpan Corporate Voice:** Maintained clinical detachment while describing spiritual ruin.  
  - **Rotting Subtext:** Testimonials/fine print reveal each track’s decay into Nietzsche’s warned pathologies (resentment, sterility, recursive judgment) without naming them.  
  - **The "Solutions":** Present Tense (bestselling amnesia) and Eternal Return (unbought stasis) highlight the retreat’s commodification of despair.  
  - **Unease Factor:** The FAQ’s bureaucratic tone normalizes profound dysfunction—wellness as a vector for new maladies.  
  - **Nietzsche-Invisible:** No direct references; the theory lives purely in the satire’s architecture.  

  Ready for you to gut and rewire. This thing practically bleeds on its own.
