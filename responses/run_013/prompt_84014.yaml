answer: |-
  ## Teaching Plan: Iterated Mixed-Strategy Dominance

  **1. The Opening Diagnosis (200-250 words)**
  Students arrive comfortable with core decision theory (expected utility, conditional probability) and basic game concepts (strategies, profiles, payoffs, Nash equilibrium intuition) via simple examples like PD and MP. They grasp pure strategy dominance and likely recall IEDS in pure strategies. Start by reactivating this foundation: "Recall the Prisoner's Dilemma. Why does 'Confess' dominate 'Silent' for each player? What does iterated elimination of strictly dominated pure strategies (IEDS-pure) leave us with? It yields the unique Nash equilibrium." Then, immediately pose the challenge: "But what if a strategy isn't dominated by *any* other *pure* strategy? Can it still be irrational to play? Could a *mixture* of my other strategies make it irrational? And if so, how does that change the process of elimination and the conclusions we draw about rational play?" This frames the session's core question, leveraging their known concept (pure dominance/IEDS) to highlight its limitation and motivate the need for mixed dominance. It signals we are extending, not replacing, their prior knowledge into a richer, more subtle domain.

  **2. The Dependency Chain (400-500 words)**
  1.  **Review Pure Dominance & IEDS-Pure (5 min):** *Depends on:* Prior knowledge. *Why:* Establish baseline. Use Prisoner's Dilemma to quickly remind them: strict dominance definition, why dominated strategies are eliminated, why order doesn't matter for pure strict dominance, and that IEDS-pure leads to NE. *Transition:* "But many games lack purely dominated strategies. Does that mean no strategies are irrational? Let's look at a new game."
  2.  **Introduce the 3x3 Game & Identify Lack of Pure Dominance (5 min):** *Depends on:* Understanding payoff matrices. *Why:* Present the playing field. Display both payoff matrices clearly. Ask students: "Scan the rows/columns. Is any strategy strictly dominated by another *pure* strategy for either player?" Guide them to see none are (e.g., for P1: T>B vs L, B>T vs C, T>M vs R? No uniform dominance). *Key Insight:* Absence of pure dominance doesn't imply all strategies are rational candidates.
  3.  **Define Mixed Strategy Strict Dominance (10 min):** *Depends on:* Expected utility calculation. *Why:* Core concept introduction. Define formally: Strategy s_i is strictly dominated (by a mixed strategy) if there exists a mixed strategy σ_i over S_i \ {s_i} such that u_i(σ_i, s_{-i}) > u_i(s_i, s_{-i}) for *all* possible pure strategy profiles s_{-i} of the opponents. Emphasize: "It's not about beating one opponent profile, but beating it *no matter what the opponents do*." Calculate an example: Show that for P1, pure strategy B is strictly dominated by a mixed strategy of T and M (e.g., σ1 = (0.5T, 0.5M, 0B)). Calculate EU for P1 playing B vs. σ1 against each of P2's pure strategies (L, C, R) and show σ1 yields strictly higher payoff each time. *Transition:* "So B is irrational for P1. Knowing this, what should P2 think?"
  4.  **First Elimination & Reasoning (10 min):** *Depends on:* Mixed dominance definition, rationality assumption. *Why:* Show the iterative process starts. Eliminate B for P1. State: "Because P1 is rational, P1 will not play B." Now refocus on the *reduced game* (only rows T, M for P1). Ask: "Given P1 won't play B, does P2 have a dominated strategy?" Guide them to see that for P2, R is now strictly dominated by L (or by C, depending on P1's mix) *in this reduced game*. Calculate: Against T&M (P1 won't play B), u2(L) = [0,1] or avg > u2(R) = [0,1] or avg? (u2(L) vs T=0, vs M=1; u2(R) vs T=0, vs M=1; u2(C) vs T=3, vs M=1. L and R both yield max 1 vs M, min 0 vs T; C yields 3 vs T. No pure dominance for P2 yet! Need mixed again). *Reveal:* Actually, R is dominated by a mixed strategy (e.g., σ2 = (0.5L, 0.5C, 0R)) in the reduced game. Calculate EUs vs T and M. Eliminate R for P2. *Emphasize:* We used the knowledge that P1 is rational (won't play B) to reduce the game and find a new dominance.
  5.  **Second Elimination & Common Knowledge (15 min):** *Depends on:* Previous elimination, CK assumption. *Why:* Show iteration continues and requires CK. Now have reduced game (P1: T,M; P2: L,C). Ask: "Given P2 won't play R (and P1 knows P2 is rational, so P1 knows this), does P1 have a dominated strategy now?" Show M is strictly dominated by T for P1 in this reduced game (u1(T,L)=3 > u1(M,L)=1; u1(T,C)=0 < u1(M,C)=1? Not pure dominance! Need mixed again? Actually, in this 2x2: T vs L=3, vs C=0; M vs L=1, vs C=1. No pure dominance. Mixed? Check if T is dominated: Is there σ1 over M? σ1=M clearly not better. M dominated by T? EU_M =1 always. EU_T=3 vs L, 0 vs C. No mixed strategy over T (only one other pure) can dominate M. M is *not* dominated! *Pivot Point:* This is where the specific game shines. Eliminate P2's R first? *Show alternative order:* What if we first found that P2's R is dominated by a mixed strategy (σ2 = (0.5L, 0.5C, 0R)) *in the original game*? Calculate EU for P2 playing R vs σ2 against each P1 strategy (T, M, B). Eliminate R for P2 first. *Now* in reduced game (P1: T,M,B; P2: L,C), show P1's B is dominated by σ1=(0.5T,0.5M) as before. Then in further reduced game (P1: T,M; P2: L,C), show P1's M is dominated by T? Still no. P2's C dominated by L? u2(L) vs T=0, vs M=1; u2(C) vs T=3, vs M=1. No. *Stalemate?* *Resolution:* In this specific game, the *only* strategies eliminated are P1's B (by mixed) and P2's R (by mixed), regardless of order. The surviving profiles are (T,L), (T,C), (M,L), (M,C). Point out that (M,C) is a pure NE. *Key Insight:* The process stopped without eliminating all but NE. CK of rationality justified the two eliminations we did, but rationality alone doesn't tell P1 what to do in the final 2x2.
  6.  **Summary of Process & Outcome (5 min):** *Depends on:* Following the chain. *Why:* Consolidate. Recap: We started with no pure dominance. Found a mixed dominated strategy (P1's B). Eliminated it. In the reduced game, found another mixed dominated strategy (P2's R). Eliminated it. The process stopped. Surviving strategies: P1: T, M; P2: L, C. Emphasize: Order didn't matter *in this case* for the eliminations that occurred, but the process didn't yield a unique outcome. Rationality + CK of rationality justifies eliminating the dominated strategies we did, but doesn't prescribe play in the remaining game.

  **3. The Carrying Game (400-500 words)**
  **Should it carry the session? Yes, it is excellent.** Here's why, addressing the requirements:

  *   **What it MUST Contain:**
      *   **No Initial Pure Dominance:** Crucially, no strategy is strictly dominated by another *pure* strategy. This forces the need for mixed strategies to demonstrate dominance. (Your game has this: P1's B isn't purely dominated, similarly P2's R isn't purely dominated).
      *   **Existence of Mixed Dominance:** It must contain at least one strategy strictly dominated only by a mixed strategy. (Your game has this: P1's B is dominated only by mixtures of T&M; P2's R is dominated only by mixtures of L&C).
      *   **Iteration Potential:** Eliminating one mixed-dominated strategy should potentially reveal another mixed-dominated strategy in the reduced game. (Your game has this: Eliminating P1's B makes P2's R dominated; eliminating P2's R first makes P1's B dominated).
      *   **Order (Ir)relevance Demonstration:** It should allow demonstrating that the *set* of strategies eliminated is order-independent *for strict dominance*, even if the sequence differs. (Your game has this: Whether you eliminate P1's B first or P2's R first, both are eliminated and only those two are eliminated).
      *   **Non-Unique Outcome:** It should ideally *not* reduce to a single strategy profile, highlighting that IEDS-mixed doesn't always find NE (or unique NE) and that surviving strategies need further analysis. (Your game has this: 4 profiles survive, including the NE (M,C)).
      *   **Manageable Complexity:** 3x3 is the smallest non-trivial size demonstrating mixed dominance and iteration clearly. Calculations, while involving expectations, remain feasible within 90 mins.

  *   **What it MUST Lack:**
      *   **Weak Dominance:** Avoid strategies weakly dominated by pure or mixed strategies. Weak dominance introduces significant complications (order dependence, payoff sensitivity) that would derail the core lesson on strict dominance and mixed strategies. (Your game lacks weak dominance).
      *   **Multiple Equilibria Issues:** While it has multiple surviving profiles, it doesn't involve complex equilibrium selection problems or mixed NEs that would distract. The surviving set is clear.
      *   **Asymmetry in Complexity:** The mixed dominance calculations should be reasonably symmetric in difficulty for both players. (In your game, both eliminations require simple mixtures (e.g., 50/50) and straightforward EU comparisons).

  *   **Why not PD or MP?**
      *   **Prisoner's Dilemma:** Belongs *only* in Step 1 (Review). Its dominance is pure and trivial. It lacks any mixed dominance and iteration is non-existent. Using it further would mislead.
      *   **Matching Pennies:** Belongs *only* as a contrast *after* defining mixed dominance. Say: "In MP, no pure *or mixed* strategy dominates any other pure strategy. Why? Because BR is always pure opposite. Mixed dominance fails, which is why we need NE for MP." It's useful to show mixed dominance *isn't* always present, but useless for demonstrating the elimination *process* itself. Its only role is a counterpoint to "dominance always exists".

  *   **How to Work It:**
      *   Introduce early (Step 2).
      *   Use it actively throughout Steps 3, 4, 5. Project the matrix. Annotate eliminations visibly.
      *   Make students calculate the expected payoffs for dominance checks (against opponent pure strategies) – this is crucial for understanding.
      *   Walk through both elimination orders explicitly (Step 5).
      *   Contrast the starting point (no pure dom) with the endpoint (2x2 surviving set) and the NE within it.

  **4. The Misconception Map (500-600 words)**

  1.  **Misconception: Mixed dominance requires pure dominance first.**
      *   **When it Surfaces:** Immediately after introducing the game and noting no pure dominance exists (Step 2) or when posing the question "Can any strategy still be dominated?".
      *   **Intervention:** Directly challenge it. "Since no pure strategy dominates B, does that mean B is rational? Let's check if a *mixture* of T and M can dominate B." Proceed to calculate the EU of B vs. σ1(T&M) against L, C, R for P1, showing strict loss each time. **Say:** "A strategy can be strictly dominated *only* by a mixed strategy, even if no pure strategy dominates it. Pure dominance is a special case."
      *   **If Not Addressed:** Students conclude mixed dominance is just a minor extension, failing to grasp its fundamental role in identifying irrationality when pure dominance fails. They might dismiss the whole concept as irrelevant for games like this.

  2.  **Misconception: Mixed-strategy dominance = dominance against a uniformly randomizing opponent.**
      *   **When it Surfaces:** When defining mixed dominance (Step 3) or during the first EU calculations.
      *   **Intervention:** Explicitly contrast the definitions during Step 3. Define mixed dominance rigorously (σ_i dominates s_i if EU(σ_i, s_ⱼ) > EU(s_i, s_ⱼ) for *every* pure s_ⱼ). **Say:** "This is *not* about the opponent randomizing! It's about *me* randomizing. We are checking if my mixture beats my pure strategy *no matter what pure strategy the opponent actually picks*. The opponent could be playing *anything* – pure or mixed, rational or irrational – but as long as they pick a pure strategy (which they always do in the background for this comparison), my mixture must beat my pure choice." Emphasize the universal quantifier "for all s_ⱼ".
      *   **If Not Addressed:** Students fundamentally misunderstand the logic. They think dominance is defined relative to a specific (random) opponent behavior, not as an inherent property of the strategy relative to the player's own alternatives. This cripples their ability to apply the concept correctly.

  3.  **Misconception: Order of elimination never matters.**
      *   **When it Surfaces:** During the iteration steps (Steps 4 & 5), especially when considering alternative orders.
      *   **Intervention:** Acknowledge it holds for *strict* dominance (pure or mixed). **Say:** "For *strict* dominance, a key theorem states that the *set* of strategies eliminated is independent of the order. However, the *process* might find eliminations in different sequences." Explicitly walk through eliminating P1's B first vs. P2's R first in your game (Step 5), showing the same two strategies are eliminated either way. **Crucially Add:** "This order-independence is specific to *strict* dominance. If we had *weakly* dominated strategies, order *could* matter, which is a major reason we focus on strict dominance first." Mark the boundary.
      *   **If Not Addressed:** Students might assume order-independence is universal or trivial. Failing to show the alternative order leaves the misconception unchallenged. Failing to mention the weak dominance exception sets them up for confusion later.

  4.  **Misconception: Surviving strategies must be Nash-equilibrium strategies.**
      *   **When it Surfaces:** At the end, when looking at the surviving set ((T,L), (T,C), (M,L), (M,C)) and noting (M,C) is NE (Step 6).
      *   **Intervention:** Directly confront it. **Say:** "Look at our surviving set: (T,L), (T,C), (M,L), (M,C). We know (M,C) is a NE. But is (T,L) a NE? [Calculate: P1 gets 3, but if P2 plays L, P1 playing M gets only 1 < 3? P1 has no incentive to deviate *given P2 plays L*. P2 at (T,L): Gets 0. If P2 deviates to C while P1 plays T, P2 gets 3 > 0! So P2 *would* deviate. (T,L) is NOT a NE.] IEDS-mixed only eliminates strategies that are *never* best responses – they are irrational no matter what. But surviving strategies *can* be best responses only to strategies that have *themselves* been eliminated, or only in coordination with other non-equilibrium play. IEDS-mixed finds strategies that *might* be played rationally *if* players have correct beliefs, but it doesn't guarantee those beliefs are in equilibrium. Only (M,C) survives *and* is a NE here."
      *   **If Not Addressed:** Students vastly overestimate the power of IEDS-mixed, conflating it with equilibrium. They fail to see it as a rationality-based refinement that can leave multiple possibilities, including non-equilibrium play.

  5.  **Misconception: Rationality alone licenses elimination.**
      *   **When it Surfaces:** When justifying the first elimination ("P1 is rational, so won't play B") and especially when iterating ("P2 knows P1 is rational...").
      *   **Intervention:** Explicitly layer the knowledge at each elimination step (Steps 4 & 5). **Say:** "To eliminate P1's B: We only need P1 to be rational. But to eliminate P2's R *afterwards*, we need more. P2 must know that P1 won't play B. Since P2 is rational, P2 uses this knowledge about P1's behavior (B is gone) to reassess their own choices in the reduced game. For P2 to have this knowledge, P2 must know P1 is rational. This requires *Common Knowledge of Rationality* (CKR). Iterated elimination beyond step 1 fundamentally relies on CKR." Stress that eliminating step n requires rationality plus knowledge of rationality up to level n-1.
      *   **If Not Addressed:** Students think the eliminations follow mechanically from individual rationality, missing the crucial epistemic foundation of game theory (beliefs about others). They won't understand why iteration is meaningful or why we stop.

  **5. The Closing Probe (150-200 words)**
  **Question:** "Suppose we modify Player 2's payoff for (M, R) from 1 to 4 (so P2 gets 4 if P1 plays M and P2 plays R, other payoffs unchanged). How would this change impact the iterated elimination of strictly dominated strategies using mixed strategies? Would the set of eliminated strategies change? Justify your answer by referencing the definition of strict dominance by a mixed strategy."

  *   **Why it Tests Understanding:** It requires more than recalculating the original process. Students must:
      1.  Identify the relevant change (only u2(M,R)).
      2.  Recall that mixed dominance depends on *all* opponent pure strategy responses.
      3.  Check if the dominance relations established for P1's B and P2's R still hold *under the new payoff*.
      4.  Specifically, recognize that the change *only* affects the comparison for P2's strategy R *when P1 plays M*. They need to check if R is *still* dominated by mixtures of L&C against *all* P1 strategies (T, M, B).
      5.  Conclude that since the EU for R vs. P1=M increased to 4, while the EU for mixtures of L&C vs. M remains ≤ max(1,1)=1 (if using 50/50, EU=1 vs M), the strict inequality u2(σ2, M) > u2(R, M) no longer holds. Thus, R is no longer dominated. The elimination of P1's B might still occur, but P2's R would not be eliminated. The surviving set changes.
  *   **Good Answer:** Clearly identifies the specific payoff change. States that R was dominated because EU(σ2, s1) > EU(R, s1) for all s1. Notes that EU(R, M) is now 4, while EU(σ2, M) for any mixture of L&C is ≤ 1 (or max(L,C payoff vs M=1). Since 4 > 1, the inequality fails for s1=M. Therefore, R is no longer strictly dominated by any mixed strategy σ2. Hence, only B might be eliminated (if still dominated), not R. The final surviving set is larger (P1: T, M; P2: L, C, R).
  *   **Bad Answer:** Recaps the original elimination process without addressing the change. Assumes the process is identical. Claims R is still dominated without checking EU vs M. Focuses only on P1's B. Fails to reference the "for all opponent strategies" condition.

  **6. Deliberate Omissions (150-200 words)**
  *   **Weak Dominance:** (Mentioned briefly in misconception 3). Why Omit: Weak dominance introduces order-dependence and sensitivity to exactly equal payoffs, adding significant complexity that obscures the core concepts of mixed strategy dominance and iterative logic under strict dominance. Focus on strict dominance first.
  *   **Infinite Games or Continuous Strategy Spaces:** Why Omit: The core concepts and challenges of mixed dominance and iteration are fully demonstrable in finite games. Introducing infinite spaces adds mathematical complexity (integration, existence proofs) irrelevant to the fundamental game-theoretic reasoning being taught.
  *   **Correlated Strategies:** Why Omit: Correlated strategies involve shared randomization devices, a distinct and more advanced concept. The session focuses on individual, independent mixing as the means to dominate pure strategies. Introducing correlation here would conflate distinct ideas.
  *   **Epistemic Foundations in Depth (e.g., Aumann models):** Why Omit: While Common Knowledge of Rationality (CKR) is mentioned as essential, a deep dive into formal epistemic models is beyond the scope. The session aims for an operational understanding of *why* CKR is needed for iteration, not its full formalization. This keeps focus on the elimination mechanics.
  *   **Equilibrium Refinements beyond IEDS:** Why Omit: The goal is to understand IEDS-mixed itself – its justification, process, and limits. Discussing other refinements (e.g., trembling hand, proper equilibrium) would distract from mastering this specific solution concept. The session appropriately ends by noting surviving strategies aren't necessarily NE.
  *   **Computational Complexity:** Why Omit: While calculating dominators is part of the exercise, analyzing the general computational difficulty of finding mixed dominated strategies or performing IEDS is a theoretical topic tangential to the conceptual and procedural learning objectives.
