answer: |-
  **Annex 7: Resolution of Disputes and Preservation of Authority**  
  *(Supplement to the Bylaws of the International Society for Sedimentary Dynamics)*  

  **Article 1: Foundational Principles**  
  1.1 Authority derives from the capacity to maintain order and the perception of legitimacy. These elements are indivisible in practice.  
  1.2 Justice, being inherently non-demonstrable, requires institutional force for its effect. Conversely, force absent the appearance of justice is unsustainable.  
  1.3 Therefore, the Society shall ensure that its exercised authority is rendered just through established forms, procedures, and symbols.  

  **Article 2: Ceremonial Investiture and Regalia**  
  2.1 The induction of Fellows (the "Investiture") shall be conducted biennially with prescribed robes, medals, and the Society Mace.  
  2.2 Regalia serve no evidentiary function regarding a Fellow’s merit. Their purpose is to manifest the Society’s enduring presence, thereby transferring perceived historical legitimacy to present authority.  
  2.3 Alteration or simplification of regalia is prohibited, as it undermines the necessary substitution of form for substance.  

  **Article 3: Council Decisions and the Appearance of Justice**  
  3.1 Decisions of the Council are binding by virtue of the Council’s constituted authority.  
  3.2 All decisions must *appear* just. Where substantive justice is indeterminate or contested, the Council shall enact "Investigatory Formalities":  
  &nbsp;&nbsp;&nbsp;&nbsp;(a) A Subcommittee for Procedural Regularity shall verify adherence to process.  
  &nbsp;&nbsp;&nbsp;&nbsp;(b) Findings shall be published using standardized templates emphasizing exhaustive deliberation.  
  &nbsp;&nbsp;&nbsp;&nbsp;(c) Dissenting opinions may be archived but not circulated, unless required to demonstrate apparent fairness.  

  **Article 4: Inquiry into Standing Rules**  
  4.1 A Member questioning the *justice* of a Standing Rule (e.g., "Why must article submissions use Format B?") shall be:  
  &nbsp;&nbsp;&nbsp;&nbsp;(a) Provided with the current text of the Rule and its procedural history (amendments, dates).  
  &nbsp;&nbsp;&nbsp;&nbsp;(b) Directed to Article 1.3 (Foundational Principles).  
  &nbsp;&nbsp;&nbsp;&nbsp;(c) Reminded that persistent inquiry may constitute "Undermining Institutional Efficacy" (see Article 7).  
  4.2 A Member publishing a "genealogy" of a Rule, tracing its origin to contingent circumstances (e.g., "Format B arose from 1954 typewriter limitations"), shall face immediate censure and potential expulsion under Bylaw 12(c) (Preservation of Authority). Such acts dissolve the necessary opacity surrounding origins.  

  **Article 5: Appeals Process**  
  5.1 Appeals against Council decisions may proceed through three tiers: Subcommittee Review, Full Council Reconsideration, and Final Arbitration Panel.  
  5.2 No appeal may challenge:  
  &nbsp;&nbsp;&nbsp;&nbsp;(a) The foundational authority of the Council (Article 1.1).  
  &nbsp;&nbsp;&nbsp;&nbsp;(b) The inherent necessity of Forms (Article 1.3).  
  &nbsp;&nbsp;&nbsp;&nbsp;(c) The illegitimacy of historical origin-seeking (Article 4.2).  
  5.3 Appeals must frame grievances as procedural deviations, never as challenges to the justice of the Rules themselves.  

  **Article 6: Access to Deliberative Records**  
  6.1 Council minutes are classified:  
  &nbsp;&nbsp;&nbsp;&nbsp;(a) **Tier 1 (Public)**: Sanitized summaries affirming procedural adherence.  
  &nbsp;&nbsp;&nbsp;&nbsp;(b) **Tier 2 (Fellows)**: Expanded minutes, excluding discussions of foundational authority or Rule origins.  
  &nbsp;&nbsp;&nbsp;&nbsp;(c) **Tier 3 (Council Only)**: Unredacted records, including discussions acknowledging the functional necessity of appearances.  
  6.2 Tier 3 access by non-Council members requires unanimous Council approval and a sworn undertaking of perpetual confidentiality.  

  **Article 7: Adjudication of Specific Cases**  
  7.1 **Priority Disputes (e.g., Large National Lab vs. Independent Researcher):**  
  &nbsp;&nbsp;&nbsp;&nbsp;(a) Precedence is determined by formal submission timestamps and adherence to Format B (Article 4).  
  &nbsp;&nbsp;&nbsp;&nbsp;(b) The perceived imbalance of power is mitigated by public emphasis on procedural neutrality (Article 3.2). Resource disparities are not minutes.  
  7.2 **Retraction Demands (e.g., Well-Funded Consortium alleging misconduct):**  
  &nbsp;&nbsp;&nbsp;&nbsp;(a) An Expedited Investigatory Formality (Art. 3.2) commences.  
  &nbsp;&nbsp;&nbsp;&nbsp;(b) The outcome’s appearance of impartiality is paramount. If consensus is unattainable, a joint statement affirming process integrity suffices.  
  &nbsp;&nbsp;&nbsp;&nbsp;(c) External funding influence is documented in Tier 3 minutes only.  
  7.3 **Prize Renaming Motions (e.g., Due to namesake’s newly controversial past):**  
  &nbsp;&nbsp;&nbsp;&nbsp;(a) A Committee on Onomastic Stability evaluates *current* perception, not historical accuracy.  
  &nbsp;&nbsp;&nbsp;&nbsp;(b) Change is permitted only if unrest threatens the Society’s perceived legitimacy.  
  &nbsp;&nbsp;&nbsp;&nbsp;(c) The original naming rationale is sealed. Public statements cite "evolved institutional alignment."  

  **Article 8: Perpetuation of Authority**  
  8.1 The Society’s continuity is its paramount good.  
  8.2 All provisions herein serve to translate force into legitimacy, and custom into justice, through immutable forms.  
  8.3 Authority resides in the perpetuation of Authority.  

  ---

  **Note to the Retired Scientist:**

  I commit to reading Pascal’s core argument (esp. fragments 103-135 Brunschvicg) as a pragmatic *descriptive* sociology of power: institutions *must* conflate force and legitimacy because humans cannot access pure justice or ground authority rationally. Custom’s authority rests solely on its reception over time; exposing origins is destructive because authority is performative, not historical. The Council/Tier 3 minutes distinction mirrors Pascal’s "two classes" – the wise who see the machinery, and the people who must believe in the symbol. I take this as correct because Pascal repeatedly states justice is "subject to dispute," force is "recognizable and indisputable," and thus we "attach" justice to force – a necessary, observable human practice.

  **Liberties taken:**  
  1.  **Scope:** Pascal focused on law/state/religion. Applying this directly to a *scientific* society leans on his general principles but extends them into a domain he didn't explicitly address.  
  2.  **Cynicism vs. Necessity:** The Annex presents the mechanism coldly. Pascal, while clear-eyed, framed this necessity within a tragic human condition and pointed towards faith as the resolution. The Annex lacks this transcendent horizon, making it feel more purely cynical.  
  3.  **"Reasons of the Heart":** Pascal allowed for non-rational but genuine foundations for belief/custom ("Le coeur a ses raisons"). The Annex reduces this solely to the utility of the appearance for stability, arguably flattening a nuance. Specialists might dispute whether Pascal saw custom *only* as utility or also as containing a deeper, non-discursive truth accessible to the heart.

  The Annex leans hardest on the destructive nature of historical inquiry into origins – a point Pascal makes explicitly ("Whoever traces it to its origin destroys it"). The coldness comes from executing this logic within the banal, modern context of committees and bylaws, stripping away Pascal's existential anguish. Argue away!
