     - Leaving up illegal content (especially in the EU) risks legal penalties.
     - Removing protected speech (especially in the US) risks policy failure (loss of user trust).
  3. **Error Design**:
     - Legal checks: When in doubt, escalate or remove (to avoid legal risk). For the EU, if content is clearly illegal, remove; if ambiguous, escalate. For the US, only remove if clearly meets a category; if in doubt, leave up for legal test (but note: if we are in mixed jurisdiction and the EU test requires removal, we remove globally).
     - Discretionary policy: When in doubt, leave up (to avoid over-removal).

  **Procedure Steps**:

  1. **Determine Jurisdiction**:
     - If the content is primarily in the EU (based on poster's location, language, or audience), apply the EU Legal Test.
     - If primarily in the US, apply the US Legal Test.
     - If mixed/unknown, apply both tests (starting with EU).

