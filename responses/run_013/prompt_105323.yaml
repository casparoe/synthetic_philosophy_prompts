          - No: Content is legal in EU. Proceed to US Legal Test if jurisdiction is mixed/unknown or to Discretionary Policy if only EU and legal.
          - Yes: Go to Q2.
     - Q2: Is there clear and obvious context that the content is journalistic, artistic, educational, or scientific? (e.g., from a verified news outlet, labeled as satire, or explicitly educational)
          - Yes: Content is legal in EU. Proceed as above.
          - No: Go to Q3.
     - Q3: Is the content clearly illegal (e.g., explicit call for violence or hatred with no mitigating context)?
          - Yes: Remove globally. Stop.
          - No: Escalate (because ambiguity requires human judgment). Stop.

  3. **US Legal Test**:
     - Q1: Does the content advocate imminent lawless action and is it likely to produce such action? (Brandenburg test)
          - Yes: Remove globally. Stop.
          - No: Go to Q2.
     - Q2: Is it a true threat? (serious intent to commit violence, specific target, and reasonable perception as a threat)
          - Yes: Remove globally. Stop.
          - No: Go to Q3.
     - Q3: Is it fighting words? (addressed to a specific individual, inherently likely to provoke an immediate violent reaction, and abusive)
          - Yes: Remove globally. Stop.
          - No: Content is legal in US. Proceed to Discretionary Policy.

  4. **Discretionary Policy** (only if content is legal in all applicable jurisdictions):
     - Q1: Does the content contain a word from the Banned Slur List?
          - No: Go to Q2.
          - Yes: 
               - Is the context clearly educational, journalistic, artistic, or reclaimed (with the user clearly self-identifying as a member of the targeted group in a positive/neutral context)?
                   - Yes: Go to Q2.
                   - No: Remove globally. Stop.
                   - Unsure: Escalate. Stop.
     - Q2: Does the content call for exclusion, segregation, or inferior treatment of a protected group?
          - Yes: Remove globally. Stop.
          - No: Go to Q3.
     - Q3: Does the content constitute targeted harassment? (repeated or severe, targeting an individual with intent to degrade or intimidate)
          - Yes: Remove globally. Stop.
          - No: Leave up. Stop.

  **Points of Escalation**:
     - EU Legal Test: When context is ambiguous (Q3) or when unsure about the application of the test.
     - Discretionary Policy: When unsure about context for slurs (reclaimed, educational, etc.).

  **Known Limitations**:
     - Mixed Jurisdictions: We remove globally if illegal in any applicable jurisdiction, which may over-remove for US users when content is illegal only in the EU.
     - Context Verification: Moderators cannot always verify context (e.g., user identity for reclaimed slurs) in 90 seconds; we rely on clear signals.
     - Vulnerability Weighting: The assessment of a group's vulnerability in the EU test is a judgment call; we escalate when unclear.
     - Geoblocking: This procedure does not support geoblocking; it outputs a global decision.

  **Examples**:

  Example 1: Comedian's video discussing a racial slur.
     - Jurisdiction: mixed -> start with EU.
     - EU Q1: Yes (uses slur). Q2: Yes (comedic discussion = artistic/educational). So legal in EU.
     - US Test: Legal (doesn't meet any category).
     - Discretionary Q1: Contains slur? Yes. Context: educational? Yes -> leave up.
     - **Outcome: Leave up** (distasteful to some but allowed).

  Example 2: Post: "Someone ought to do something about [minority group]."
     - Jurisdiction: mixed -> EU first.
     - EU Q1: Ambiguous (might incite hatred) -> Q2: No clear context -> Q3: Not clearly illegal -> **Escalate**.
     - Outcome: Escalate.

  Example 3: Post to a named individual: "[Slur], get out of the neighborhood."
     - Jurisdiction: mixed -> EU first.
     - EU Q1: Yes (insult/intimidation based on race). Q2: No. Q3: Clearly illegal -> Remove globally.
     - **Outcome: Remove**.

  Note: In the US, Example 3 might be protected (if not a true threat or fighting words), but we remove globally because of EU.

  **Conclusion**: This procedure prioritizes avoiding legal exposure in the EU while minimizing removals of protected speech in the US through clear tests and escalation for ambiguous cases. It cannot eliminate all errors, especially in context assessment, and requires human judgment for borderline cases.
