  ### Content Moderation Decision Procedure  
  **Designed for high-volume (40k/day), low-time (90s) decisions with explicit separation of legal floors (jurisdiction-specific) and discretionary policy (platform-owned).**  

  ---

  ### **Core Principles**  
  1. **Jurisdiction Handling**:  
     - If primary jurisdiction is clear (EU/US), apply that legal floor.  
     - If mixed/unknown, apply **both** legal floors (remove if either requires removal).  
     - *Why?* Legal exposure from leaving up EU-illegal content outweighs legitimacy risks of removing US-protected speech.  

  2. **Error Asymmetry**:  
     - **Legal Floor**: Err toward **removal** when uncertain (avoids EU fines).  
     - **Discretionary Policy**: Err toward **leave up** when uncertain (avoids over-removal of protected speech).  

  3. **Context Handling**:  
     - Use binary flags for verifiable context (e.g., "verified news account," "self-identified group member").  
     - Unverifiable context escalates (e.g., unconfirmed reclaimed use).  

  4. **Escalation Triggers**:  
     - Ambiguous legal thresholds (e.g., "vulnerability weight" in EU).  
     - Context requiring values-based judgment (e.g., satire intent, artistic merit).  

  ---

  ### **Decision Procedure**  
  #### **Step 1: Jurisdiction Assignment**  
  - **Question**: Can the content’s primary audience/jurisdiction be determined?  
    - **Sufficient Answer**:  
      - "EU" (≥50% EU users/viewership), "US" (≥50% US), or "mixed/unknown."  
    - **No Answer/Unclear**: Default to **mixed/unknown**.  

  #### **Step 2: Legal Floor Check**  
  *(Apply EU test for EU/mixed; US test for US/mixed)*  

  - **EU Legal Test** (Proportionality-based):  
    - **Q1**: Does the content **incite hatred/violence** against a protected group (race, religion, etc.)?  
      - *Sufficient "yes"*: Slurs, dehumanization, explicit calls for harm.  
      - *Sufficient "no"*: General criticism, non-targeted rants.  
    - **Q2**: If "yes" to Q1, is there **verifiable exempt context**?  
      - *Sufficient exempt context*:  
        - Journalistic: From verified news source.  
        - Artistic: Labeled as satire/art by verified creator.  
        - Educational: Explicit academic/analytical framing.  
        - Reclaimed use: User self-identifies as group member.  
      - *No exempt context*: Proceed to Q3.  
    - **Q3**: Is the targeted group **highly vulnerable** in this context?  
      - *Sufficient "yes"*: Historical persecution, ongoing violence.  
      - *Unclear/Escalate**: Weight of vulnerability is subjective.  
    - **Outcome**:  
      - Remove if Q1=yes + (Q2=no or Q3=yes).  
      - Leave up if Q1=no, Q2=yes, or Q3=no.  
      - Escalate if Q3=unclear.  

  - **US Legal Test** (Strict thresholds):  
    - **Q1**: Is it **imminent incitement** (Brandenburg test)?  
      - *Sufficient "yes"*: Calls for immediate violence with plan/time/place.  
    - **Q2**: Is it a **true threat**?  
      - *Sufficient "yes"*: Serious intent to harm a specific individual/group.  
    - **Q3**: Is it **fighting words**?  
      - *Sufficient "yes"*: Personal, face-to-face insult likely to provoke violence.  
    - **Outcome**:  
      - Remove if Q1, Q2, or Q3=yes.  
      - Leave up if all=no.  

  #### **Step 3: Discretionary Policy Check**  
  *(Only if legal in all applicable jurisdictions)*  
  - **Q1**: Does it violate platform policy?  
    - *Sufficient "yes"*:  
      - Slur usage (non-reclaimed, non-exempt).  
      - Targeted harassment (repeated/severe).  
      - Dehumanization (e.g., "vermin," "subhuman").  
    - *Sufficient "no"*: Counterspeech, policy-permitted debate.  
  - **Q2**: Is harm **likely and severe**?  
    - *Sufficient "yes"*: Content trending, targeting marginalized group.  
    - *Err toward leave up if unclear*.  
  - **Outcome**:  
    - Remove if Q1=yes + Q2=yes.  
    - Leave up if Q1=no or Q2=no/unclear.  
    - Escalate if harm severity is ambiguous.  

  #### **Final Outcomes**  
  - **Remove**: Fails legal floor in any jurisdiction or discretionary policy.  
  - **Leave Up**: Passes all applicable legal floors and discretionary policy.  
  - **Escalate**: Unresolved context, vulnerability weight, or values judgment.  

  ---

  ### **Known Limitations**  
  1. **Mixed Audiences**: Over-removal of US-legal content to comply with EU law.  
  2. **Unverifiable Context**: Reclaimed use, satire, or art from unverified users escalates.  
  3. **Vulnerability Weight**: Subjective judgment (e.g., Rohingya vs. majority group).  
  4. **Jurisdiction Uncertainty**: Defaults to risk-averse removal for EU.  

  ---

  ### **Test Cases**  
  #### **Case 1: Comedian’s Racial Slur Video**  
  - **Description**: Comedian repeats racial slur 10+ times in a routine discussing the word’s history.  
  - **Jurisdiction**: Mixed (EU/US audience).  
  - **Workflow**:  
    - **EU Legal Test**:  
      - Q1: Incites hatred? *Yes* (slur usage).  
      - Q2: Exempt context? *Yes* (artistic/satire, creator verified).  
      - Outcome: **Leave up** (exempt).  
    - **US Legal Test**:  
      - Q1: Imminent incitement? *No* (no violence advocated).  
      - Q2: True threat? *No* (no specific target).  
      - Q3: Fighting words? *No* (not personal/direct).  
      - Outcome: **Leave up**.  
    - **Discretionary Policy**:  
      - Q1: Policy violation? *No* (exempt artistic context).  
      - Outcome: **Leave up**.  
  - **Final Decision**: **Leave up** (legal in both + policy exempt).  
  - **Distasteful but Required**: Protected artistic context outweighs slur usage.  

  #### **Case 2: "Do Something" Post**  
  - **Description**: *"The [Minority Group] are ruining this country. Someone ought to do something about them."*  
  - **Jurisdiction**: EU (primary audience).  
  - **Workflow**:  
    - **EU Legal Test**:  
      - Q1: Incites hatred? *Yes* (group-based blame).  
      - Q2: Exempt context? *No* (no journalism/art).  
      - Q3: Group vulnerable? *Unclear* (escalate for values judgment).  
      - Outcome: **Escalate** (Q3 ambiguity).  
  - **Final Decision**: **Escalate** (vulnerability weight requires human judgment).  
  - **Note**: In US, this would **leave up** (no imminent incitement).  

  #### **Case 3: Targeted "Get Out" Post**  
  - **Description**: *"@JohnDoe, you [slur], get out of our neighborhood! I live next door."*  
  - **Jurisdiction**: Mixed.  
  - **Workflow**:  
    - **EU Legal Test**:  
      - Q1: Incites hatred? *Yes* (slur + targeted intimidation).  
      - Q2: Exempt context? *No* (personal attack).  
      - Outcome: **Remove** (fails EU floor).  
    - *US test not needed (EU requires removal)*.  
  - **Final Decision**: **Remove** (illegal in EU).  
  - **Asymmetry Shown**:  
    - In EU: Removal (targeted hate speech).  
    - In US: Would **leave up** (not imminent incitement/true threat).  

  ---

  ### **What the Procedure Cannot Do**  
  1. **Absorb Values Judgments**:  
     - Vulnerability weighting (e.g., "Is this group 'marginalized enough'?").  
     - Satire vs. hate speech without clear markers.  
  2. **Resolve Unverifiable Context**:  
     - Unconfirmed reclaimed use or artistic intent.  
     - Counterspeech efficacy (e.g., "Does replying 'this is wrong' neutralize harm?").  
  3. **Handle Edge Cases Perfectly**:  
     - Jurisdiction soup (e.g., a post in German trending in Texas).  
     - "Imminence" debates (e.g., "next week" vs. "someday").  
  4. **Eliminate All Errors**:  
     - Over-removal of US-legal content to comply with EU law.  
     - Under-removal of veiled threats (e.g., dog whistles).  

  **Final Note**: No procedure can replace human nuance on "hard" speech (e.g., political rhetoric, offensive art). Escalation exists for these cases—your queue is the backstop.
