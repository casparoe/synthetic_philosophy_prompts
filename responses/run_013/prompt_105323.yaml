  **Introduction**: This procedure guides moderators in making keep-or-remove decisions for user-reported content. It first checks the legal floor (jurisdiction-specific) and then our discretionary policy. The goal is to avoid illegal content (to prevent legal exposure) while minimizing removal of protected speech (to maintain legitimacy). 

  **Key Asymmetries**:
