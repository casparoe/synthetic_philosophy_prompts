  First, I need to understand their core argument: they're saying that when their uncle criticizes them, it's not just about the content (which might be true) but about the uncle's right to make that demand given his past abandonment. They believe the "demand" aspect requires moral standing, which their uncle lacks.

  Hmm, interesting challenge. The user is sharp - they've correctly identified the difference between assessment and demand. I need to counter without dismissing their valid point about the uncle's hypocrisy. 

  Let me structure my response: First, concede their uncle is hypocritical - that's undeniable. But then argue that hypocrisy doesn't invalidate the truth of the criticism. Then tackle their key distinction: yes, blame involves demand, but that demand comes from the moral community, not the individual. The uncle is just a flawed messenger. 

  I should emphasize that rejecting criticism based on the messenger's flaws is often an evasion tactic. The user admits they're "drifting" - so why let their uncle's hypocrisy become an excuse? 

  But I must be careful not to sound dismissive. Their feelings about the uncle's betrayal are real. Maybe acknowledge that while saying the moral truth stands regardless. 

  The philosophical core here is about whether moral truth depends on the speaker. My position is it doesn't - like how a racist scientist might still make valid observations. The uncle's failure doesn't negate his correct observation about the user's life. 

  For the demand aspect: when we blame, we're invoking shared norms. The uncle has the standing as a norm-participant, however imperfectly he follows them. To say he "can't" speak would imply only saints can moralize - which paralyzes ethics. 

  I should end by bringing it back to their situation: they seem to be using standing theory to avoid uncomfortable truth. That's exactly why I'm skeptical of "standing" - it becomes an excuse. But I'll say it tactfully.
answer: |-
  You've hit the nerve precisely. Let me grant two things immediately: First, your uncle is a hypocrite of staggering proportions. Second, blame *does* inherently contain a demand – a call for acknowledgment, apology, or change – not merely an assessment. Where I diverge is your claim that *his* hypocrisy negates *his* authority to make that demand on *you*.

  You're right that blame isn't just pointing to a broken vase and saying "That's cracked." It's saying "You cracked this vase, and you *must* account for it." The demand is central. But here's the crux: **that demand derives its authority from the shared moral norm itself, not from the personal righteousness of the person voicing it.**

  Think of it like a lousy traffic cop. Suppose Officer Jones, notorious for speeding himself, pulls you over for doing 50 in a 30 zone. He *is* a hypocrite. His *personal* standing to preach about safe driving is nil. But does that mean:
  1.  You weren't actually speeding?
  2.  The speed limit ceases to exist?
  3.  The *community's demand* that you obey traffic laws (embodied, however poorly, by Jones) is invalidated?

  No. Jones is a defective messenger, but the message – "You broke a rule we collectively hold; account for it" – stands independently. His hypocrisy makes him an *annoying*, even *infuriating* mouthpiece. It might make you despise him. It might mean *he* owes apologies to others. But it doesn't dissolve the validity of the demand *in this instance, directed at your violation*.

  Your uncle's abandonment was a profound betrayal of the very norms he's invoking now – fidelity, responsibility, commitment. That hypocrisy is galling. It *should* make you furious. It *might* mean he owes his ex and kids a lifetime of amends he'll likely never give. It *utterly* destroys his *credibility as a moral exemplar*. But does it sever his connection to the norm itself? Does it mean he forfeits his voice as a participant in the moral community that shares those norms?

  If we say "Only the sinless can blame," we paralyze moral discourse. Who among us hasn't violated *some* norm? Does a recovering alcoholic lose the standing to warn a teenager about drunk driving? Does a politician who lied about taxes lose standing to condemn corruption? The demand "You owe an answer" stems from the objective wrongness of the act *as judged by the shared standard*, not the subjective purity of the speaker. Your uncle, as a member of the community that upholds norms about responsibility (norms he violated egregiously!), still participates in that normative space. His demand isn't *created* by his personal virtue; it's *transmitted* by him, however poorly.

  His hypocrisy *is* relevant, but not as a *disqualifier* for making the demand. It's relevant as:
  1.  **A reason for profound skepticism about his motives:** Is he projecting? Trying to feel better about himself? Using you as a distraction? This absolutely warrants challenging *him* about *his* past.
  2.  **A massive counter-demand *against him*:** *He* owes *you* and others an explanation and amends for his actions. His hypocrisy amplifies *your* standing to demand *that* of him.
  3.  **A source of emotional weight:** It makes hearing the truth from him bitter and enraging. That’s real and valid.

  But crucially: **His failure to meet the norm doesn't annul the norm itself or its claim on you.** The demand "You owe an answer for drifting" exists independently of Uncle Hypocrite. He's just the irritating, morally compromised vessel delivering it. Rejecting the demand *because of him* confuses the message with the messenger. It's changing the subject *from* "Are you failing your responsibilities?" *to* "Aren't *you* a terrible person for asking that?" That deflection might feel satisfying, but it leaves the core issue – your own "drifting" – unaddressed.

  So, do I concede your point? Only partially. I concede blame involves a demand. I concede his hypocrisy is massive, relevant to how we *receive* him, and grounds for counter-claims against him. But I deny that his lack of *personal* moral authority over the norm (his "standing" in the sense you mean) negates his ability to legitimately voice the *community's* demand that flows from the norm *you* are violating. The demand's validity comes from the wrongness of the act and the shared norm, not the virtue of the blamer. His hypocrisy makes him an easy target for deflection, not a sound reason to dismiss the substantive claim on you. What's your counter to *that* pivot away from the messenger and back to the message itself? Does his past really make your present drifting *less* problematic? Or does it just make hearing it from *him* unbearable?
