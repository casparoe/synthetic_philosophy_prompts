      - **Mutual knowledge of depth k**: A fact F is mutual knowledge to depth k if the chain of "everyone knows that everyone knows ..." holds for k levels. In distributed systems, this corresponds to a finite chain of acknowledgments of length k. For example, mutual knowledge of depth 1 is that every process has received the message (but they don't know that others have received it). Depth 2: every process has received the message and has received an acknowledgment that every other process has received the message (but they don't know that others have received the acknowledgments), and so on.

