      - In a game, if the players are rational and this rationality is common knowledge, then they will play a particular equilibrium strategy (e.g., a Nash equilibrium). In distributed systems terms: each process (player) has a local algorithm (strategy) that, given the common knowledge of the rationality of all processes (i.e., that every process will follow an algorithm that maximizes its own payoff, and that this is known to all, and known to be known, etc.), leads to a stable outcome (equilibrium) where no process has an incentive to unilaterally change its algorithm. The common knowledge of rationality acts as a fixed point in the reasoning: each process can infer the actions of others because they are rational and because that rationality is common knowledge.

   3. **Role of common knowledge in solving a coordination problem**:
      - In a coordination problem (like choosing the same convention), common knowledge of a fact (e.g., the convention to use) allows the processes to coordinate because each process knows the fact, knows that others know it, and so on, so they can all safely act on it. Without common knowledge (or with only finite mutual knowledge), there might be a risk that a process acts on the fact but is unsure whether others will act on it because they might not know that the process knows, etc. In distributed systems, this is like needing a protocol that ensures that every process has the same value and knows that the others have it too, to an unbounded depth. Without common knowledge, coordination might break if there is a possibility of miscoordination due to uncertainty about others' knowledge.

