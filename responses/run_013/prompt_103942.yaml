prompt: |-
  Construct a case in which the doctrine of double effect returns opposite verdicts on the same act depending on a single structural fact about the causal path, while the agent's act, intentions, evidence, and the certainty and magnitude of every outcome are identical across the two branches, and the agent cannot tell which branch she is in. Constraints: one realistic setting (a hospital, a rescue, a workplace), no longer than a paragraph; no trolleys, levers, footbridges, bombers, or transplant surgeons; the uncertain fact must be one no reasonable person in her position could have settled before acting; and the numbers must be such that proportionality is satisfied in both branches, so that the means clause is the only condition doing any work. Open with one sentence giving the bottom line, namely what the case shows about the doctrine, then present the case, then run the check: name the act, the good effect and the bad effect, say whether the bad effect is a means on each branch, and give the doctrine's verdict on each branch and why, using the four conditions it standardly imposes (the act must be permissible in itself; the bad effect must be neither intended as an end nor used as a means to the good; it must be merely foreseen; and the good must be proportionate to it). Then test the case against a condition I stipulate: call a criterion transparent when it cannot declare an act permissible in one causal branch and impermissible in the other while the agent's evidence and intentions are the same in both. Say whether the doctrine is transparent in your case, whether reading the means clause as a claim about the agent's plan rather than about causal structure restores transparency, and which feature of the case is load-bearing. Close with what a defender of the doctrine should concede, and what becomes of the case if the agent could have settled the structural fact cheaply.
reasoning: |-
  Hmm, the user wants me to construct a thought experiment that challenges the doctrine of double effect (DDE). They've provided very specific constraints: it needs to be in a realistic setting like a hospital or workplace, no trolley problems or similar clichés, and all factors except one structural fact about causality must remain identical between scenarios.

  The key challenge is creating a case where the only difference is whether the bad effect serves as a means to the good effect, while everything else - intentions, evidence, outcomes - stays constant. And crucially, the agent can't know which causal structure they're in.

  I'm considering a hospital scenario with radiation treatment. Let's say a doctor uses targeted radiation to shrink a tumor (good effect) while unavoidably damaging nearby tissue (bad effect). The pivotal structural fact would be whether the tissue damage somehow contributes to tumor shrinkage. 

  In Branch A, the damage is purely collateral - the radiation directly shrinks the tumor while harming tissue. In Branch B, the damage triggers an immune response that actually causes the shrinkage. The doctor intends only the tumor reduction and foresees the damage proportionally.

  The means clause becomes decisive here. In Branch A, the bad effect isn't a means, so DDE permits the act. In Branch B, since tissue damage enables tumor shrinkage, it becomes impermissible under DDE despite identical circumstances. This exposes how the doctrine's verdict hinges on opaque causal structures.

  What makes this tricky is maintaining proportionality - the benefits must outweigh risks in both scenarios. I'll need to specify equivalent magnitudes: say 80% chance of saving a life versus 20% chance of serious but non-fatal harm. And the structural fact must be unknowable to any reasonable doctor.

  For transparency: DDE fails here because it gives opposite verdicts based solely on hidden causal pathways. Shifting to "agent's plan" interpretation won't help since the intention is identical in both branches. The load-bearing element is whether the harm causally enables the benefit.

  The defender must concede that DDE can render moral verdicts dependent on facts beyond agents' epistemic access. And if the doctor could have cheaply discovered the causal mechanism - say via a $10 blood test - the case collapses since evidence would differ.

  This should satisfy all constraints while demonstrating a genuine problem for DDE in applied ethics.
answer: |-
  This case demonstrates that the Doctrine of Double Effect (DDE) is **non-transparent** because the permissibility of an identical act, performed with identical intentions and evidence, hinges solely on an unknowable structural fact about whether the bad effect causally enables the good effect.

  A physician must deliver a precisely targeted, potentially life-saving radiation dose to shrink a critical brainstem tumor in an unconscious patient. Due to the tumor's location, the radiation beam will unavoidably pass through and damage a small section of healthy brain tissue adjacent to the tumor, causing permanent but manageable neurological deficits (e.g., partial loss of coordination). The physician intends only to shrink the tumor to save the patient's life and merely foresees the tissue damage; she has no alternative treatment, and proportionality is satisfied (life saved vs. non-fatal deficit) in both possible causal realities. Crucially, the physician cannot know, and no reasonable physician could have discovered beforehand without prohibitively invasive testing (which wasn't feasible), one structural fact: whether the radiation *directly* shrinks the tumor (Branch A) or whether the *damage to the healthy tissue* triggers a localized inflammatory response that *indirectly* causes the tumor to shrink (Branch B). The act, intentions, evidence (including certainty: high chance of success, small chance of harm), and outcomes (magnitude: life saved, deficit caused) are identical across both branches.

  *   **Act:** Delivering the radiation dose.
  *   **Good Effect:** Shrinking the tumor, saving the patient's life.
  *   **Bad Effect:** Damaging healthy brain tissue, causing permanent neurological deficits.
  *   **Branch A (Direct Effect):** The radiation directly shrinks the tumor; tissue damage is a *side effect*, not a means. DDE **permits** the act: 1) The act (delivering necessary medical radiation) is permissible in itself. 2) The bad effect (tissue damage) is not intended. 3) It is merely foreseen. 4) The good (life saved) is proportionate to the bad (manageable deficit). The bad effect is **not a means**.
  *   **Branch B (Indirect Effect):** The tissue damage *causes* the inflammatory response that shrinks the tumor; the damage is a *causal means* to the good effect. DDE **forbids** the act: Conditions 1, 3, and 4 are satisfied (same as Branch A). However, condition 2 is violated: the bad effect (tissue damage) is **used as a means** (causal precondition) to achieve the good effect (tumor shrinkage/life saved).

  **Transparency Test:** DDE is **not transparent** in this case. It declares the act permissible in Branch A but impermissible in Branch B, solely due to the hidden causal structure, despite identical evidence, intentions, and outcomes. **Agent's Plan Interpretation:** Interpreting the means clause solely based on the *agent's plan* (whether she *intends* the harm as a means or incorporates it into her plan as a necessary step) **restores transparency**. In both branches, the physician's plan only involves using radiation on the tumor area; the damage is merely foreseen fallout, not part of her intended plan of action. The verdict would be "permissible" in both branches. The **load-bearing feature** is the unknowable causal fact: whether the harm *causally enables* the good effect.

  A defender of DDE should concede that **the doctrine can yield verdicts dependent on objective, agent-inaccessible causal structures, not just intentions or foresight.** If the physician could have cheaply (e.g., via a simple, non-invasive biomarker test costing $10) settled whether the harm was a causal means (Branch B) or not (Branch A) before acting, the agent's *evidence* would differ across the branches. In Branch B, she would have evidence that the harm is causally necessary, potentially altering the application of the means clause or making intending the harm as a means more likely, undermining the core scenario where only the hidden structure differs.
