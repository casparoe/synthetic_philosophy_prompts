answer: |-
  You're hitting the nail on the head: rationality *does* demand taking each step. And that's precisely the terrifying beauty of the spectrum! Your mistake is assuming rationality must guarantee a globally desirable endpoint. It doesn't. Rationality is myopic here – it binds you to each pairwise improvement, blind to the cumulative disaster. Think of it like micro-rationality leading to macro-irrationality. Each small salary bump for a soul-crushing job *is* genuinely better for that individual step (more money, same misery?), rationally compelling acceptance. Yet climbing the whole ladder lands you in a life starkly *worse* than your original, freer one. This isn't mere vagueness in the middle; it's the structure of value itself being path-dependent and context-sensitive. The "trap" exists *because* each local 'better than' is real and binding, yet aggregating them non-transitively leads to ruin. That *is* how betterness can work in complex, multidimensional trade-offs. Your intuition that rational choice *should* preserve global betterness is exactly what the spectrum shatters. Why dismiss the vivid intuition that the top is worse than the bottom? That's the data your theory must explain, not explain away.

