prompt: |-
  My flatmate and I have been going round in circles for about a year about Dutch book arguments, and I've started to suspect we arent even having the same disagreement. Her position: the theorems are decision theory dressed up as epistemology. All they establish is that an agent who puts a price on each bet separately, takes every bet that looks good to her in isolation, and then lets the bookie combine them will lose for sure -- which is a fact about her betting dispositions, not about whether her credences are correct. She says she's happy to be 'incoherent' in that sense, since her credences are just her degrees of confidence and she never promised to price anything; she also points out the bookie has to know her credences in the first place, and she doesn't have to tell him. My position: someone who is 0.6 confident in A and 0.6 confident in not-A is getting something wrong about the world; the sure-loss book is a symptom of a genuine epistemic defect, not a quirk of her preferences. We both know the standard arguments, so please dont just explain sure-loss back to me. What I want is a diagnosis: is this substantive, verbal (we mean different things by 'rational'), or two different questions -- norms of action vs norms of belief -- hiding under one label? Is the very concept of credence the thing in dispute? I have a half-formed idea that the combination step is doing all the work: she'd refuse the package, and I can't tell whether refusing the package is itself irrational or whether that only looks obvious from inside the betting picture. And what would move this forward -- some result showing incoherent credences are inaccurate by her own lights, or an argument that nothing like that can be had? Honest answer please, including if you think no progress is to be expected.
reasoning: |-
  Okay, the user and their flatmate have been stuck in a debate about Dutch book arguments for a year. The user's position is that incoherent credences like assigning 0.6 to A and 0.6 to not-A reflect an epistemic flaw. Their flatmate argues that Dutch books are about decision theory, not epistemology—they only show a practical vulnerability if one bets in a certain way, not that the credences themselves are incorrect.

  First, I need to unpack the core disagreement. The user mentions that their flatmate sees the theorems as decision theory disguised as epistemology. The flatmate is okay with being "incoherent" because her credences are degrees of belief, and she doesn't have to commit to betting prices. She also points out that the bookie needs access to her credences, which she can withhold. The user, on the other hand, thinks the incoherence indicates a real-world error, not just a betting quirk.

  The user is asking for a diagnosis: is the disagreement substantive, verbal, or about different norms? They suspect the combination step in Dutch books might be key—their flatmate would refuse the combined bet, and the user wonders if that refusal is irrational or only seems so within the betting framework. They also want to know how to move forward, possibly with a result showing incoherent credences are self-undermining or an argument that such a result isn't possible.

  I recall that Dutch book arguments are used to justify probabilism—the idea that rational credences should follow probability axioms. The standard argument says if your credences aren't probabilistic, a Dutch book can be made against you, meaning a set of bets you'd accept individually but that lead to a sure loss. Critics often say this only shows a pragmatic flaw, not an epistemic one.

  The flatmate's stance aligns with the pragmatic interpretation. She separates credences from betting behavior, arguing that she can have incoherent credences without agreeing to the bets. Her point about not disclosing credences to the bookie adds a layer of practicality—if the bookie doesn't know her credences, they can't exploit her. This challenges the applicability of the Dutch book scenario.

  The user’s view is that the credences themselves are flawed, independent of betting. They believe assigning high confidence to both A and not-A indicates a misunderstanding of reality. The Dutch book is just a symptom of this deeper issue. This is the epistemic perspective, where coherence is tied to accuracy.

  The key question is whether coherence (probabilistic consistency) is necessary for epistemic rationality. The flatmate denies this, seeing coherence as a practical concern. The user affirms it as an epistemic norm.

  I should consider the literature. Joyce's "Accuracy Dominance" arguments might help here. He shows that non-probabilistic credences are accuracy-dominated—there's a probabilistic set that's closer to the truth no matter what. If the flatmate cares about accuracy, this could be persuasive. But she might reject the scoring rules used, similar to her rejection of betting frameworks.

  Another angle is whether refusing the combined bet is rational. If she accepts individual bets based on her credences but rejects the combination, is that consistent? Dutch book proponents argue that rejecting the combination is inconsistent if she evaluates bets based on expected utility. But if she doesn't commit to such evaluations, this might not apply.

  The disagreement might stem from different concepts of credence. The user sees credences as inherently tied to betting dispositions (behaviorist view), while the flatmate sees them as purely mental states (epistemic view). This is a fundamental divide in philosophy of probability.

  Possible resolutions: 

  1. **Epistemic Inaccuracy Arguments**: Presenting arguments like Joyce's to show incoherent credences are always less accurate. However, the flatmate might question the scoring rules or the importance of accuracy.

  2. **Normative Scope**: Emphasizing that epistemic norms govern how beliefs should align with truth, separate from actions. If she agrees that beliefs aim at truth, then coherence as a necessary condition might follow.

  3. **Pragmatic vs. Alethic Goals**: If the flatmate views credences as tools for action, then pragmatic arguments might work. But she seems to separate belief from action, so this could be a dead end.

  4. **Conceptual Dispute**: Acknowledge that they have different definitions of rationality. Without agreeing on what credences are for, the debate might not resolve.

  The user's half-formed idea about the combination step is crucial. If the flatmate refuses the package, is that rational? From a Dutch book perspective, it's avoiding exploitation, but it might reveal inconsistency in her evaluations. However, she might not commit to evaluating combined bets, so inconsistency might not apply.

  Moving forward might require agreeing on the purpose of credences. If both aim for truth, then accuracy arguments could help. If not, the debate might be intractable. Practical consequences, like making poor decisions in complex systems, could be a middle ground, but the flatmate might dismiss this as irrelevant to epistemology.

  Honestly, without shared premises, progress might be tough. They might need to clarify their meta-epistemological stances: what makes a belief rational? Is it purely about truth, or does it involve practical consequences? Until that's settled, the loop continues.
answer: |-
  This is a classic and thorny debate in formal epistemology, and your frustration is understandable. You've hit on core tensions that philosophers (e.g., Hájek, Christensen, Joyce) actively grapple with. Your diagnosis is sharp: **the disagreement is substantively about the *nature of credence* and the *scope of epistemic rationality*, not merely verbal or about separate norms.** Here's a breakdown:

  1.  **The Core Dispute: What *Is* a Credence?**
      *   **Your Flatmate's View (Instrumentalist/Non-Binding):** Credences are *purely* internal, psychological degrees of confidence ("doxastic attitudes"). They are *not* intrinsically commitments to bet or value propositions at specific prices. The Dutch Book vulnerability arises only when an *additional, separable* decision rule ("accept any bet with positive expected utility based on *these* credences") is applied naively. The "defect" is in the *coupling* of belief and action, not in the belief state itself. Refusing to price bets or disclose credences is a perfectly rational way to avoid exploitation; it doesn't invalidate the credences.
      *   **Your View (Functionalist/Representational):** Credences *inherently* represent the world and come with normative commitments. Assigning 0.6 to A and 0.6 to ~A isn't just a quirky mental state; it's a *misrepresentation* of the logical structure of reality (A and ~A are mutually exclusive and exhaustive). The Dutch Book, while operationalized through betting, *reveals* this underlying representational defect. The irrationality lies in holding beliefs that cannot possibly correspond to any state of the world simultaneously. Even without betting, the beliefs are objectively inconsistent.

  2.  **The "Combination Step" Insight:**
      You're absolutely right that this is crucial. Your flatmate argues: "I'd refuse the package deal, even if I'd accept each bet individually based on my credences *at the moment*. So no loss occurs." This seems pragmatic.
      *   **Your Flatmate's Perspective:** Refusing the package is *perfectly rational*. It's recognizing that evaluating bets individually doesn't bind her to accepting their conjunction, especially when new information (the existence of the combination) emerges. The decision rule is defeasible. This protects her from exploitation and doesn't impugn her credences.
      *   **The Dutch Book Proponent's Response:** The irrationality isn't *just* in accepting the combination, but in the *evaluation standards* that make the individual bets seem acceptable *given her credences*. If her credences genuinely govern her evaluation of bets, then:
          *   Bet 1: Pays £1 if A, costs £0.60. Expected Value (EV) = (1 * 0.6) - 0.60 = £0.00? (She might see it as positive if she misapplies the credence).
          *   Bet 2: Pays £1 if ~A, costs £0.60. EV = (1 * 0.6) - 0.60 = £0.00? (Same potential misapplication).
          *   Combination: Pays £1 regardless (since either A or ~A is true), costs £1.20. Guaranteed loss of £0.20.
          The core issue is that her credences lead her to evaluate *each* bet as at least fair (EV >=0) or possibly desirable, while the *logical consequence* of the bets combined is disastrous. Refusing the combination might avoid the loss *this time*, but it highlights that her *evaluation framework* (driven by incoherent credences) cannot consistently appraise bets without risking such pitfalls. The inconsistency is latent in the credences themselves, making her *vulnerable* to being *presented* with such choices, even if she avoids them through savvy refusal.

  3.  **Are Epistemic and Practical Norms Truly Separate?**
      Your flatmate insists they are: belief norms aim at truth; action norms aim at good outcomes. Dutch Books, she argues, only touch the latter.
      *   **The Counter:** Many argue that *epistemic* rationality *just is* the kind of consistency that allows beliefs to reliably guide action *towards truth-tracking goals*. If incoherent credences systematically lead you into situations where you must either (a) accept guaranteed losses (if you bet naively) or (b) constantly second-guess and veto the logical consequences of your own beliefs (to avoid loss), this *undermines the functional point* of having credences as guides for reasoning and action in an uncertain world. The "epistemic defect" manifests *as* this practical fragility and inconsistency in potential evaluations. Separating them completely risks making "degrees of confidence" epiphenomenal or normatively inert.

  4.  **Can Progress Be Made? Arguments That *Might* Move the Needle:**
      *   **Accuracy-Dominance Arguments (e.g., Joyce, Pettigrew):** This is the most promising route *against* your flatmate's position. These arguments **do not rely on betting or practical consequences.** They show that for *any* incoherent set of credences, there exists a *coherent* (probabilistic) set that is *more accurate* (closer to the truth) *no matter which possible world turns out to be actual*, using reasonable measures of accuracy (like the Brier score).
          *   **Why it might help:** It directly targets the *epistemic* goal of accuracy. If her credences are 0.6/0.6 for A/~A, there are *always* coherent credences (e.g., 0.5/0.5, or 0.7/0.3, or 0.4/0.6) that are *guaranteed* to be less inaccurate overall, regardless of truth. Incoherent credences are *self-undermining* on their own (alethic) terms – they are *objectively worse representations* of the world's possibilities.
          *   **Her Likely Counter:** She might dispute the scoring rule (Why Brier? Why not some other measure?). She might argue accuracy isn't the *only* epistemic goal (simplicity? resilience?), or that her incoherent credences could be "accidentally" more accurate in some specific world (though dominance shows they are *never* uniquely best and always dominated). She might reiterate that her credence is just how confident she *feels*, not a claim to optimal accuracy.
      *   **Diachronic Dutch Books & Updating (e.g., Conditionalization):** If she accepts conditionalization as a rational updating rule, synchronic incoherence often leads to diachronic incoherence (vulnerability to Dutch Books over time). Refusing combinations becomes much harder in dynamic scenarios. Does she think updating rules are also "just decision theory"?
      *   **The "Why Have Credences?" Argument:** Press her on the *functional role* of degrees of belief. If they aren't meant to guide evaluations of truth-relevant actions (even hypothetically), what *is* their purpose? Are they just idle feelings? If they *are* meant to guide evaluation/action, then consistency (coherence) seems necessary to avoid self-sabotage, even if she avoids specific traps.

  5.  **Honest Prognosis:**
      *   **Progress is possible, but difficult.** Accuracy-dominance arguments are the strongest epistemic counter to her position. If she genuinely engages with them and accepts (a) that credences aim at accuracy and (b) the reasonableness of dominance as a norm, she *might* shift. Many find this more compelling than Dutch Books.
      *   **The Sticking Point is Fundamental:** Your flatmate likely holds a deeply **internalist, psychologistic view of belief**: "My credence just *is* my feeling of confidence; its rationality is internal to my mental state, not defined by external betting or accuracy metrics." You hold a more **externalist, functionalist view**: "Credences are representational states; their rationality depends on how well they map onto the logical and probabilistic structure of reality, revealed by consequences like vulnerability or inaccuracy." **This is a meta-epistemological divide about the nature of belief and rationality itself.**
      *   **"No Progress" is Likely If...** she digs in on the separation of belief and action norms *and* rejects the epistemic force of accuracy-dominance (e.g., by denying that dominance matters or disputing scoring rules). Her "I don't have to tell the bookie" point, while practically true, dodges the *structural* point about the beliefs themselves. If she maintains that feelings of confidence need no justification beyond introspection and have no necessary connection to external consistency, you reach an impasse.

  **Recommendation:** Focus the discussion *away* from Dutch Books specifically and onto **accuracy-dominance arguments** (e.g., present a simple case like the 0.6/0.6 example and show how *every* coherent credence dominates it in accuracy). Frame it as: "Forget betting. If the *goal* of your degrees of confidence is to accurately reflect the world's possibilities, isn't holding this pair inherently self-defeating because *no matter what happens*, some other coherent confidence level would have been a strictly better fit?" If this doesn't resonate, the disagreement likely runs too deep in your respective philosophies of mind and epistemology for a quick resolution. Acknowledge that core difference – it might be the most honest "progress" you can make.
