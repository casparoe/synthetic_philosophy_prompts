prompt: |-
  I am a second-year doctoral student in intellectual history, and I need to draft a short research proposal — about 1,500 words — for a departmental workshop on method in the history of ideas. Let me set out the half-formed idea I want you to develop, and then the constraints.

  The worry I keep returning to is this. The long-running argument about presentism — about whether historians can, or should, judge past actors by the standards of their own time rather than ours — appears to presuppose that any given period possesses a definite set of standards that could stand as the alternative to our own. The anti-presentist says we should judge by the standards of the time; the presentist says we cannot escape our own. Both moves take for granted that 'the standards of the time' names something determinate. But the periods I work on look internally riven: there is rarely a single standard of the age, only competing factions, each claiming to speak for the age as a whole. If that is right, the phrase 'the standards of their own time' may not pick out a stable object at all, and the familiar dichotomy might rest on a fiction.

  I do not yet know where this leaves the debate. It might vindicate the presentist (there is no neutral period standard to retreat to), it might vindicate a chastened contextualism (we can still index to the standards the actor actually endorsed, or to the best reconstruction of the local norms), or it might show that both sides have been answering the wrong question. I want the proposal to make the question determinate enough that one of these outcomes can be argued for rather than merely gestured at.

  Please turn this into a polished proposal with the following components:

  1. A precise statement of the research question, framed so that it has a determinate answer. It should be clear what would count as answering it in each direction.
  2. An account of why the existing positions in the debate — the universalist or transhistorical view, the strongly situated or hermeneutic view, and the contextualist middle — leave the question open, rather than already settling it.
  3. The proposed method, and why it is the right method rather than the obvious alternatives. Note that this is a conceptual project, so the method should be something a philosopher can actually execute at a desk: conceptual analysis, the construction and testing of rival readings against deliberately chosen cases, and the diagnosis of equivocation in the key terms. Say why a purely empirical or archival approach would not settle the conceptual question, while conceding what such an approach could contribute.
  4. What a successful result would look like, stated as a claim that could be defended or attacked, and what would count as the project failing — including the honest possibility that the question collapses into the trivial observation that standards vary, or that it cannot be stated without covertly reinstating the very notion of period standards under attack.
  5. A realistic scope for a workshop-length project: what can be done in the time, what should be left for a longer treatment, and where the main risk to the timetable lies.
  6. A short note on the deliverable for the workshop audience, who are not specialists in this debate.

  Please do not include a bibliography, reading list, or citations; refer to positions and arguments by description, and I will add the references myself. Where you would normally name a specific work, describe the view instead.

  After the proposal, give me a brief structured summary in the form of a single JSON object, with exactly these fields, each a string unless noted: title; central_question; rival_positions (an array of objects, each with the fields position and how_it_leaves_the_question_open); proposed_approach; why_this_approach; expected_result; failure_conditions; scope_and_timeline; principal_risk.

  Write the whole thing in British English.
