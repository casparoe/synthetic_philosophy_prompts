answer: |-
  ## Research Proposal: The Phantom Consensus - Pluralism and the Conceptual Grounds of Historical Judgment

  **1. Research Question**
  To what extent can the notion of ‘the standards of their time’ function as a coherent, stable, and non-arbitrary normative reference point for historical judgment, given the demonstrable normative pluralism and contestation within any given historical period?

  This question demands a determinate answer by evaluating the *conceptual viability* of "period standards" as a category for grounding anti-presentist historical judgment. Answering it involves:

  *   **Affirmative Answer:** Demonstrating that, despite pluralism, a sufficiently robust, identifiable, and non-arbitrary set of core norms or procedures can justifiably be labelled "the standards of the time" for evaluative purposes, distinct from both an actor's personal views and the historian's present standards.
  *   **Negative Answer (Strong):** Showing that "the standards of the time" is irreducibly indeterminate or fragmented, collapsing under pluralism into either the historian’s selective reconstruction (covert presentism) or merely the standards endorsed by the specific historical actor under scrutiny, thus failing to provide a distinct normative anchor.
  *   **Negative Answer (Reformulative):** Demonstrating that the concept is fundamentally incoherent *for the purpose it serves in the debate*, requiring a complete reframing of the problem of historical judgment away from a dichotomy between "their time" and "ours".

  **2. Existing Positions and the Open Question**
  The dominant positions in the presentism debate presuppose a stability for "period standards" that this project interrogates:

  *   **The Universalist/Transhistorical View:** Assumes fundamental moral or rational standards exist across time. It largely *ignores* the question of period-specific standards, rendering the internal pluralism of any era irrelevant to judgment, which is always against the (allegedly) timeless standard. It leaves open whether "their time" had *any* coherent internal standards beyond individual beliefs.
  *   **The Strongly Situated/Hermeneutic View (Radical Contextualism):** Emphasises the radical alterity of past thought-worlds, insisting judgment must be immanent to the actor’s own framework. However, it often implicitly treats the actor’s framework *as* representative of "their time" or assumes the framework itself is monolithic. It leaves open how to identify that framework when the actor exists within a contested field, and whether "their framework" equates to "the period's standards".
  *   **The Contextualist Middle Ground (Anti-Presentism):** Explicitly advocates judging actors by "the standards of their time". This position *depends entirely* on the stability and identifiability of such standards. It leaves the central question wide open: *What constitutes "the standards of their time" when multiple, conflicting standards vie for dominance?* Does it mean the victor's standards? The most common? The most intellectually rigorous? The most progressive? The answer is assumed, not argued for, leaving the concept vulnerable to the charge of being an indefinable phantom or a cover for the historian's own selection.

  None of these positions adequately confronts the conceptual challenge posed by internal normative pluralism. They either bypass the concept ("their time"), assume its coherence without definition (Contextualism), or potentially dissolve it into individual frameworks without resolving how *those* frameworks relate to a broader "time" (Strong Hermeneutics). The question of the concept's *internal coherence and utility* remains unresolved.

  **3. Proposed Method: Conceptual Analysis and Case-Based Testing**
  This is a conceptual project concerning the foundations of historical judgment. The core method will be **conceptual analysis through the construction and critical testing of rival interpretations against deliberately chosen historical cases.**

  *   **Step 1: Conceptual Cartography:** Precisely dissect the key concepts: "standards" (norms, values, epistemic principles?), "their time" (chronological period, cultural milieu, intellectual field?), "coherence" (logical consistency, social dominance, shared presuppositions?), "non-arbitrary reference point". Identify potential ambiguities and slippages in existing debates.
  *   **Step 2: Constructing Rival Models:** Develop distinct, logically coherent models for interpreting "the standards of their time" in the face of pluralism:
      *   Model A: *Dominant Discourse* (hegemonic norms).
      *   Model B: *Procedural Consensus* (shared rules of debate/evidence, even amidst substantive disagreement).
      *   Model C: *Best Reconstruction* (the most intellectually defensible norms of the period).
      *   Model D: *Actor's Own Framework* (collapsing into individual context).
      *   Model E: *Inevitable Selectivity* (covert presentism).
  *   **Step 3: Case-Based Testing:** Apply each model to two or three deliberately chosen historical episodes characterised by intense normative contestation within a relatively defined period/field (e.g., debates over religious toleration in late 17th-century England; competing visions of political legitimacy during the French Revolution; clashes over scientific methodology in early modern Europe). Analyse whether each model:
      *   Provides a clear, operationalisable definition of "standards of the time".
      *   Avoids arbitrariness in selecting *which* norms constitute "the standards".
      *   Succeeds as a *distinct* normative reference point from both the actor's own views and present-day standards.
      *   Remains stable under scrutiny of the historical evidence of pluralism.

  **Why this Method, Not Alternatives?**

  *   **Vs. Purely Empirical/Archival Approach:** While crucial for *identifying* pluralism in specific cases, archival research alone cannot resolve the *conceptual* question of whether "period standards", *as a category*, can bear the normative weight placed upon it in the theoretical debate. It can show variation but not adjudicate whether the concept itself is salvageable or fundamentally flawed for its intended purpose. Archival work informs the cases for testing the models but cannot perform the conceptual analysis.
  *   **Vs. Pure Theoretical Synthesis:** Simply reviewing existing philosophical arguments risks perpetuating unexamined assumptions. Testing constructed models against concrete historical examples grounds the analysis and reveals practical challenges and potential incoherences invisible in the abstract.
  *   **Why Feasible?** Conceptual analysis and model-building are desk-based philosophical tasks. Selecting well-documented, familiar cases of contestation (where the pluralism is undeniable) allows focused testing without requiring new archival discovery, making it suitable for the timeframe. The method directly targets the core conceptual puzzle.

  **4. Successful Result and Failure Conditions**

  *   **Successful Result:** A defensible claim resolving the research question. For example:
      *   "The concept 'standards of their time' can only function coherently as X (e.g., a procedural consensus), but even then, it remains vulnerable to challenge Y and cannot fully escape element Z (e.g., historian's interpretation), thereby modifying the contextualist project significantly."
      *   "The concept 'standards of their time' is fundamentally incoherent as a distinct normative reference point because of inherent pluralism; historical judgment must instead be reconceptualised primarily in terms of P (e.g., understanding situated agency within conflict) or Q (e.g., transparently acknowledged present engagement)."
  *   **Failure Conditions:**
      *   **Triviality Trap:** The analysis merely concludes that "standards vary," adding nothing substantial to the well-acknowledged fact of pluralism, without advancing the *conceptual* implications for judgment.
      *   **Conceptual Reinstatement:** The proposed resolution or critique inadvertently relies on or reinstates the very notion of a unified "period standard" it seeks to problematise, demonstrating an inability to escape the framework.
      *   **Inconclusive Drift:** The analysis fails to adjudicate convincingly between the rival models or the core answers to the research question, leaving the debate essentially where it started.
      *   **Overreach:** Attempting to definitively solve the entire presentism debate rather than rigorously answering the specific question about the coherence of one of its central conceptual pillars.

  **5. Scope and Timeline for Workshop Project**

  *   **Realistic Scope (Workshop):**
      *   Fully articulate the research question and its significance.
      *   Complete Steps 1 (Conceptual Cartography) and 2 (Construction of 3-4 core Rival Models).
      *   Conduct Step 3 (Testing) on *one* primary historical case study in depth, using it to critically evaluate the models.
      *   Develop a preliminary, argued conclusion answering the research question based on this initial analysis.
      *   Clearly outline the implications for the presentism debate and identify avenues for further research.
  *   **Deferred to Longer Work:**
      *   Exhaustive testing across multiple, diverse historical cases.
      *   In-depth exploration of the implications for specific historiographical sub-fields.
      *   Development of a fully fleshed-out alternative framework for historical judgment (if the critique is successful).
      *   Comprehensive engagement with every nuance of the vast presentism literature.
  *   **Principal Risk to Timetable:** The inherent complexity and potential for conceptual "rabbit holes" during Step 1 (Cartography) and Step 2 (Model Building). Ensuring the models are sufficiently distinct yet tractable, and avoiding getting bogged down in excessive philosophical nuance at the expense of historical application, requires careful management. Focus will be maintained by constantly relating the conceptual work back to the concrete demands of historical judgment and the test case.

  **6. Deliverable for Non-Specialist Audience**

  The workshop presentation will avoid specialist jargon and focus on making the core problem vivid and accessible:

  1.  **The Hook:** Start with a concrete, relatable example of judging a past figure caught between conflicting contemporary norms (e.g., an abolitionist denounced by mainstream contemporaries).
  2.  **The Puzzle:** Clearly state the historian's dilemma: "Judge by our standards?" seems unfair; "Judge by their standards?" – but *which* standards when they disagreed fiercely?
  3.  **The Conceptual Stakes:** Explain simply why the idea of "the standards of the time" might be shakier than we assume, and why this matters for *how* we write history and understand the past.
  4.  **The Investigation:** Outline the approach: "We'll build different ways to *define* 'their standards' when people fought about it, and test them against a real historical battleground of ideas."
  5.  **The Findings (Preliminary):** Present the key insight from the case study analysis about whether any definition holds up, using clear, non-technical language.
  6.  **The Takeaway:** Conclude with the implications: Does this change how we should think about judging the past? Does it push us towards a different way of understanding historical actors amidst their own turbulent times?

  The goal is for the audience, regardless of specialism, to grasp the fundamental challenge posed by historical disagreement to a common tool of historical practice and understand the nature of the conceptual inquiry undertaken.

