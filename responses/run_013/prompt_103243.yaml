answer: |-
  ## Essay Question

  "Fuller's principles of legality are entirely procedural yet he calls them a 'morality', while Hart insists they are merely efficacy conditions. Evaluate whether this disagreement is substantive or semantic by addressing two problems: (a) how an authoritarian regime might perfectly satisfy all eight principles while enacting profoundly unjust laws; and (b) how a post-authoritarian court's refusal to recognise such a past regime's wicked statute should be characterised – as Hart's 'retrospective application of a new rule' or Fuller's 'recognition that it was never law'. Defend your view on what is ultimately at stake in choosing between these descriptions of transitional justice."

  ---

  ## Model Answer (Approx. 700 words)

  Hart and Fuller’s dispute over the relationship between law and morality hinges crucially on the status of Fuller’s eight principles of legality (generality, promulgation, prospectivity, clarity, consistency, possibility of compliance, constancy, congruence). Hart views these as neutral, *efficacy-based* prerequisites for a system of social control to function *as law*; they define what makes a command system *effective*, not inherently moral. Fuller insists they constitute a distinctive "inner morality" of law, arguing that their systematic violation renders a purported legal system fundamentally defective, perhaps even disqualifying it *as law*. Resolving whether their disagreement is substantive or merely semantic requires examining the authoritarian regime paradox and the transitional justice dilemma.

  **(a) The Authoritarian Regime Paradox:** A regime can meticulously adhere to Fuller's principles while enacting monstrously unjust laws (e.g., apartheid laws, Nazi racial decrees). Laws could be general (applying to defined racial groups), promulgated, prospective, clear, consistent, possible to comply with (however horrific the requirement), relatively constant, and enforced congruently by officials. For Hart, this confirms his separation thesis: these are valid, albeit evil, laws within a functional legal system; the principles ensure efficacy, not justice. Fuller, however, faces a challenge: if this satisfies his "inner morality," how is it genuinely *moral*? Fuller’s response is that the principles represent a *procedural* morality inherent in the *enterprise* of subjecting human conduct to rules. It respects human agency by enabling individuals to guide their behaviour by known rules. Even an evil regime, by adhering to these principles, exhibits this minimal respect. However, the paradox highlights a limitation: procedural morality does not guarantee substantive justice. This suggests Fuller’s "morality" is a necessary but insufficient condition for a truly moral legal system, distinct from substantive natural law. The disagreement here is substantive: Hart sees efficacy conditions; Fuller sees a distinct moral value (respect for agency) intrinsic to the rule-of-law form itself, irrespective of content.

  **(b) The Transitional Justice Dilemma:** Post-authoritarianism, courts often refuse to recognise the legal validity of the old regime's wicked statutes (e.g., punishing informants under Nazi laws). Hart analyses this as the *retrospective application of a new moral rule* ("such statutes are invalid/unjust and shall not be enforced"). He argues this is honest: it acknowledges the past statute *was* valid law under the old rule of recognition, but society now chooses to override it retrospectively based on moral outrage. Fuller would characterise this as the court *recognising that the statute was never law* because it violated the inner morality (e.g., perhaps through radical inconsistency with deeper principles of the system, or by destroying the reciprocity inherent in the rule-of-law enterprise, making genuine compliance impossible in a moral sense).

  **Substantive vs. Semantic?** This dispute is fundamentally *substantive*, not merely verbal. It reflects profound differences in legal philosophy:
  1.  **Concept of Law:** Hart sees law as a social fact (union of primary/secondary rules). Validity is determined by the rule of recognition, which may or may not include moral criteria. Fuller sees law as a purposive enterprise (subjecting conduct to rules) with an internal telos requiring adherence to the principles. For Fuller, extreme injustice, *especially when systematic*, can undermine the very possibility of the enterprise functioning *as law* by destroying reciprocity and making genuine rule-following nonsensical.
  2.  **Function of Transitional Justice:** Hart's view prioritises clarity and honesty about legal discontinuity. It admits the past evil was legally valid, emphasising the conscious moral choice to break from it *now*. Fuller's view prioritises the continuity of legal legitimacy. It asserts that the new court isn't making new law retrospectively but restoring the true nature of law corrupted by the old regime, potentially offering a stronger foundation for the new legal order's legitimacy.
  3.  **What's at Stake:** Choosing Hart's description emphasises the *contingency* of law on social practice and the separability of legal validity from moral judgment, highlighting the deliberate moral choice involved in transition. Choosing Fuller's description emphasises the inherent *moral constraints* on what can count as law, potentially providing a more principled basis for condemning the past regime *as unlawful* and bolstering the new order's inherent legitimacy rooted in the rule of law itself.

  **Defence:** While Fuller's attempt to derive substantive constraints from procedure is vulnerable (the authoritarian paradox), his characterisation of transitional justice is ultimately more compelling *for the purpose of establishing a legitimate new legal order*. Hart's retrospective law-making, though analytically cleaner for a positivist, risks legitimising the past regime's *legal* authority and portrays the new court's action as itself a violation of the rule of law (retroactivity). Fuller's view, by denying the wicked rule ever achieved the status of law due to its inherent incompatibility with the purpose of the legal enterprise (even if procedurally pristine on the surface), provides a stronger normative foundation for the new regime. It asserts that the court is upholding the true essence of law against a perversion, not making ad hoc exceptions. This grants the new order a legitimacy rooted in the restoration of legality itself, rather than merely the imposition of a new (albeit better) sovereign will. The dispute is substantive because it concerns the essential nature of law and the basis of legal legitimacy in the face of profound injustice.

  ---

  ## Marking Scheme (Total: 20 Marks)

  | Mark | Move Required                                                                                                | Common Error Costing Mark                                |
  | :--- | :----------------------------------------------------------------------------------------------------------- | :------------------------------------------------------- |
  | **2** | **Clearly states the core tension:** How can Fuller’s principles be "moral" if satisfied by profoundly unjust laws? What work does "morality" do for his anti-positivism? | Vague restatement of debate without isolating *this* tension. |
  | **3** | **Accurately explains Hart's view** of the 8 principles as efficacy conditions, distinct from morality (separation thesis). | Conflating Hart’s view with formalism or natural law.       |
  | **3** | **Accurately explains Fuller's view** of the 8 principles as the "inner morality" of law, constituting a necessary aspect of law itself. | Reducing Fuller’s view to substantive natural law.       |
  | **3** | **Effectively deploys the Authoritarian Regime example:** Shows how such a regime can satisfy all 8 principles procedurally while being substantively unjust, and analyses the implications for both theorists' positions. | Treating the example superficially or missing its force against Fuller’s "morality" claim. |
  | **3** | **Accurately contrasts Hart’s vs. Fuller’s characterisation** of the Transitional Justice court action (Retrospective New Rule vs. Recognising Non-Law). | Misstating either theorist’s likely position on the scenario. |
  | **2** | **Explicitly states and justifies** whether the dispute (Hart Efficacy vs. Fuller Morality & the TJ descriptions) is **substantive or semantic**. | Asserting substantive/semantic without argument.         |
  | **4** | **Takes a clear, defended stance** on which characterisation of the Transitional Justice action (Hart's or Fuller's) is preferable/better supported, **grounded in the underlying substantive disagreement** about law's nature and function identified earlier. | Weak defence; failure to link stance to core jurisprudential differences; indecision. |
