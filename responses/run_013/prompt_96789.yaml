prompt: |-
  I teach the dominance and rationalizability unit in a second-year undergraduate game theory course, and next week's fifty-minute session is the one where mixed strategies first enter. The students have pure-strategy dominance and pure-strategy Nash equilibrium behind them; they have not yet met a mixed strategy as an object of choice, and they have not seen elimination used iteratively as a solution concept. Don't explain the material to me — plan how I should explain it.

  The example I had in mind as the carrier is a game in which the row player's three strategies pay 1, 1, 2 against the opponent's three strategies, then 0, 1, 1, then 0, 2, 1. My reading is that the middle strategy is strictly dominated by the equal mixture of the other two and by no pure strategy. Check that, then tell me whether this is the right carrying example, and what the students must already have in hand for it to land as a picture rather than look like a trick.

  Then the plan: the order the components must come in and which depend on which — in particular, where a mixture as an object of choice and the linearity of expected payoff in your own mixture have to sit relative to the claim that a mixture can beat every one of the opponent's pure strategies when no pure strategy does, and why the definition only has to be checked against the opponent's pure strategies. Which misconceptions should I expect, and where in the sequence should each be headed off? I am already expecting that dominated means some single pure strategy beats it everywhere, and some version of elimination being a one-shot operation; tell me the rest, including whatever the convex-hull picture invites. Do I need a second example for the iteration point — one in which elimination by mixtures goes further than elimination by pure strategies — or can the first be stretched, and what would such an example have to contain so that I don't leave them believing elimination order never matters? Close with the one question I should ask to see whether the geometry landed rather than the arithmetic, and say what I should tell them I am deliberately leaving out of fifty minutes.
reasoning: |-
  Okay, the user is teaching a game theory class and planning a session introducing mixed strategies. They have a specific example in mind and want to ensure it effectively conveys the key concepts without confusing students. 

  First, I need to verify their proposed game matrix. The row player's payoffs are:
  - Against column 1: (1, 0, 0)
  - Against column 2: (1, 1, 2)
  - Against column 3: (2, 1, 1)

  For row player:
  - Pure strategy 1: payoffs (1,1,2)
  - Pure strategy 2: (0,1,1)
  - Pure strategy 3: (0,2,1)

  Checking dominance: Is row 2 strictly dominated? Comparing to pure strategies:
  - Against col1: R1=1 > R2=0
  - Against col2: R1=1 = R2=1
  - Against col3: R1=2 > R2=1 → Not strictly dominated by R1 alone

  Now check mixed strategies. Consider 50-50 mix of R1 and R3:
  - Against col1: 0.5*1 + 0.5*0 = 0.5 > R2's 0
  - Against col2: 0.5*1 + 0.5*2 = 1.5 > R2's 1
  - Against col3: 0.5*2 + 0.5*1 = 1.5 > R2's 1
  Yes, strictly dominated by mixture. Good example.

  The user's deeper concerns:
  - Avoiding "trick" perception → Need to scaffold concepts carefully
  - Students likely think "dominated" means beaten by one pure strategy everywhere
  - May not grasp why checking against pure strategies is sufficient
  - Probably unaware that mixed strategies can dominate where pure can't

  Key teaching sequence should be:
  1. First reactivate pure strategy dominance concept
  2. Show a case where no pure strategy dominates, but intuition suggests something is wrong
  3. Introduce mixed strategies as extended options
  4. Explain linearity of expected payoffs (crucial foundation)
  5. Demonstrate domination via mixture
  6. Justify why checking against pure strategies suffices
  7. Address iterative elimination concerns

  Convex hull visualization is powerful here. Should sketch how R1 and R3's payoffs form a line above R2's points in all dimensions. This shows geometrically why R2 is dominated.

  For iterative elimination, this example alone isn't sufficient since eliminating R2 doesn't enable further elimination. Need a second minimal example - perhaps a 3x3 game where after removing one mixed-dominated strategy, another becomes dominated. Important to show order independence too.

  Timing is tight (50 minutes). Should explicitly state what's being deferred: best responses, Nash equilibrium in mixed strategies, and indifference conditions. Focus question should test geometric intuition - ask them to identify dominated strategies visually from a payoff diagram.

  Anticipated misconceptions:
  - "Mixtures are too complicated" → Emphasize they're just probability distributions
  - "Why not check mixed opponents?" → Explain sufficiency theorem carefully
  - "Elimination order matters" → Counter with minimal counterexample

  The user seems experienced but wary of overwhelming students. Their example is well-chosen; just needs proper sequencing and one supplemental example for iteration. The geometric approach will help more than arithmetic calculations.
answer: |-
  Here's a step-by-step lesson plan leveraging your example, addressing conceptual dependencies, misconceptions, and sequencing for a 50-minute session. Your example is **ideal** as a carrier but needs one small tweak and a supplemental example for iteration.

  ---

  ### **1. Verify Your Example & Adjustment**
  **Original Payoffs (Row Player):**
  - vs Col1: (1, 0, 0)  
  - vs Col2: (1, 1, 2)  
  - vs Col3: (2, 1, 1)  
  *Rows: R1, R2, R3 | Columns: C1, C2, C3*

  **Check:**  
  - R2 vs R1: R1 > R2 only against C1 (1>0) and C3 (2>1), but **not** against C2 (1=1).  
  - R2 vs R3: R3 > R2 only against C2 (2>1), but R2 > R3 against C1 (0>0?) and loses elsewhere.  
  → No pure strategy strictly dominates R2.  

  **Mixed Strategy:** 50-50 mix of R1 & R3:  
  - vs C1: (0.5)(1) + (0.5)(0) = 0.5 > R2’s 0  
  - vs C2: (0.5)(1) + (0.5)(2) = 1.5 > R2’s 1  
  - vs C3: (0.5)(2) + (0.5)(1) = 1.5 > R2’s 1  
  → **R2 is strictly dominated by the mixture (0.5, 0, 0.5)**.  

  **Tweak:** Change R2’s payoff vs C1 from 0 to 0.1. Why? Avoid ties (R2 vs R3 at C1 is 0 vs 0), which could distract. Now R2 is strictly dominated *only* by mixtures.

  ---

  ### **2. Prerequisites Students Must Have**
  - **Pure-strategy dominance:** A strategy \(s_i\) is strictly dominated if there exists *some* strategy (pure or mixed) that yields higher payoff *against every possible opponent pure strategy*.  
  - **Nash Equilibrium (pure):** Awareness that players optimize given others’ choices.  
  - **Key gap to fill:** Students don’t yet know mixtures are valid strategies or why we only check against opponent’s *pure* strategies.

  ---

  ### **3. Lesson Plan: Sequence & Dependencies** (50 min)
  **Goal:** Show that mixing expands choice sets, enabling dominance where pure strategies fail, and that iterated elimination can uncover new solutions.

  | Time  | Step                                                                 | Why?                                                                                                |
  |-------|----------------------------------------------------------------------|-----------------------------------------------------------------------------------------------------|
  | 0-5   | **Reactivate pure dominance:** Pose your game. Ask: "Is any row strategy strictly dominated by a *pure* strategy?" (No). | Highlights the limitation of pure strategies. Creates cognitive tension.                            |
  | 5-10  | **Introduce mixtures as choices:** "Players can randomize. A mixed strategy is a probability distribution over pure strategies." Show notation (e.g., \(\sigma_1 = (p, q, r)\)). | Establishes mixtures as valid choices. Use coins/dice as intuition anchors.                         |
  | 10-15 | **Linearity of expected payoff:** Derive payoff of a mixture against an opponent’s *pure* strategy. Example: Mix (0.5, 0, 0.5) vs C2 = \(0.5 \times 1 + 0.5 \times 2 = 1.5\). Emphasize: *"Your expected payoff is linear in your own mixture."* | Foundational for dominance checks. Avoid opponent mixtures here—pure only.                          |
  | 15-25 | **Dominance via mixtures:** Show that R2 is strictly dominated by (0.5, 0, 0.5). Contrast with pure strategies: "No single pure strategy dominates R2, but a mix does." | Solves the initial puzzle. Illustrates power of randomization.                                      |
  | 25-30 | **Why only check vs. pure strategies?** Theorem: "If \(\sigma_i\) dominates \(s_i\) against all opponent *pure* strategies, it dominates against all mixed strategies too—because payoffs are linear." Sketch proof: Opponent mixtures are weighted averages, so domination extends. | Crucial insight. Prevents misconception that we need to check infinitely many mixtures.             |
  | 30-40 | **Iterated elimination (new example):** Use a 3x3 game where:  
  - Step 1: R2 dominated by mix of R1 & R3 (eliminate R2).  
  - Step 2: Now C3 dominated by a mix of C1 & C2 (e.g., payoffs after eliminating R2 make C3 redundant).  
  *Example Suggestion:* Modify your game so after removing R2, column payoffs reveal new dominance. | Shows iteration matters. Use a concrete case where pure-strategy elimination stops early.            |
  | 40-45 | **Geometry > Arithmetic:** Draw convex hulls. For each opponent strategy (C1,C2,C3), plot row payoffs as points in \(\mathbb{R}^3\). Show R2 is inside the convex hull of R1 and R3. "Dominated if strictly below the hull." | Visual intuition. Reinforces why mixtures dominate and linearity matters.                           |
  | 45-50 | **Q&A + Foreshadowing:** Pose: **"In the payoff plot, how can you see that R2 is dominated by a mixture but not by any pure strategy?"** Then state: "Today we saw how mixtures help eliminate strategies. Next time: how they help us find equilibria where players randomize *intentionally* (not just to dominate)." | Tests geometric insight. Signals that dominance is a tool, not the equilibrium solution.             |

  ---

  ### **4. Misconceptions to Preempt**
  - **"Dominated = beaten by one pure strategy"**: Correct in Step 15-25 by showing no pure strategy dominates R2, but a mix does.
  - **"Elimination is one-shot"**: Counter in Step 30-40 with iterated example. Emphasize: "Removing a strategy can reveal new dominance relations."
  - **"Order matters"**: After iterated example, note: "If a strategy is strictly dominated, it can be eliminated at any time—order doesn’t change the final set." (Cite Kohlberg & Mertens 1986 if asked).
  - **"We must check all opponent mixtures"**: Debunk in Step 25-30 with linearity theorem.
  - **"Mixing is irrational"**: Argue in Step 5-10: "If mixing gives higher payoffs *no matter what the opponent does*, it’s rational."

  ---

  ### **5. Closing & Deliberate Omissions**
  - **Final Question:** *"Look at this payoff diagram [show R1/R2/R3 payoffs as points]. If I add a new strategy R4 inside the convex hull of R1 and R3, is it dominated? Why?"*  
    (Answer: Yes—by the same mix that dominates R2. Tests hull intuition).
  - **Omit Explicitly:**  
    - Nash equilibrium in mixed strategies (next lecture).  
    - Computation of exact mixtures (focus on dominance, not optimality).  
    - Correlated equilibrium or mixed dominance in extensive forms.  
    Say: "Today was about *eliminating* strategies. Next time: how mixing helps us *find* equilibria."

  ---

  ### **Why This Works**
  - Your example perfectly isolates mixed dominance where pure fails.  
  - The convex hull makes dominance visually intuitive, avoiding "trick" perceptions.  
  - Iterated example proves elimination isn’t trivial and order doesn’t matter.  
  - Linearity is positioned early enough to justify pure-strategy checks.  
  - Students see mixtures as *enabling dominance*, paving the way for equilibrium.
