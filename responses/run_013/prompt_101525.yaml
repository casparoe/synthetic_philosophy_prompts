answer: |-
  Below is a taxonomy structured as a decision tree, designed to map the logical landscape of why originals might matter in art. It uses concrete cases to differentiate positions, with each branch representing a diagnostic question answerable without prior knowledge of the theories. The tree culminates in eight distinct positions, each with a succinct statement of its most awkward commitment. The cases you provided are integrated throughout to force clear, case-based distinctions. Notes on gaps, inseparable positions, and redundant cases follow the tree.

  ---

  ### **Taxonomy of Positions: Why Originals Matter in Art**
  *Each branch is a yes/no question based on a concrete case. Follow the path to a leaf position.*  
  *(British English used throughout.)*

  1. **Does the value of a work depend primarily on its physical continuity?**  
     *(Consider a canvas so heavily restored that almost no original paint remains.)*  
     - **Yes** → Go to 2.  
     - **No** → Go to 3.  

  2. **In the restored work, is the object’s identity preserved despite material replacement?**  
     *(If nearly all paint is new, is it still "the original"?)<sup>†</sup>*  
     - **Yes** → **Position: Persistent Object Theory**  
       *Awkward commitment: Must accept that a work can be entirely physically replaced yet remain "authentic" (e.g., Ship of Theseus paradox).*  
     - **No** → **Position: Material Fetishism**  
       *Awkward commitment: Must deny a heavily restored work is the original—even if visually identical—rendering conservation self-destructive.*  

  3. **Does revealing a work as a forgery diminish its value?**  
     *(e.g., A celebrated "Vermeer" exposed as by Van Meegeren.)*  
     - **Yes** → Go to 4.  
     - **No** → Go to 5.  

  4. **Is a workshop piece (made by assistants, signed by the master) as valuable as one by the master’s hand?**  
     *(e.g., A Rembrandt studio painting sold as "Rembrandt".)*  
     - **Yes** → **Position: Authorial Intentionalism**  
       *Awkward commitment: Must value a master’s approval (e.g., a signature) over physical creation, equating minimally supervised works with autograph ones.*  
     - **No** → **Position: Artisanal Originalism**  
       *Awkward commitment: Must devalue works with assistant involvement, even if conceptually identical to solo pieces (e.g., Rubens’ studio output).*  

  5. **Is a high-fidelity replica superior to a damaged original if it better matches the artist’s intention?**  
     *(e.g., A digital replica of the Ghent Altarpiece restoring faded colours.)*  
     - **Yes** → **Position: Ideal Form Theory**  
       *Awkward commitment: Must hold that a copy can surpass the original in value by realising the artist’s vision more faithfully.*  
     - **No** → Go to 6.  

  6. **Is a surviving copy of a destroyed original as valuable as the original would be?**  
     *(e.g., A 16th-century copy of a fire-destroyed Holbein portrait.)*  
     - **Yes** → **Position: Aesthetic Empiricism**  
       *Awkward commitment: Must judge a forgery indistinguishable from the original as equally valuable, divorcing art from all origins.*  
     - **No** → Go to 7.  

  7. **Can an algorithm-generated work (with no single "original") possess equivalent value to human-made art?**  
     *(e.g., An AI-produced artwork minted as an NFT.)*  
     - **Yes** → **Position: Structuralism**  
       *Awkward commitment: Must value procedurally generated art (e.g., random algorithms) as highly as human creations with identical outputs.*  
     - **No** → **Position: Contextual Historicism**  
       *Awkward commitment: Must prioritise historical context over form, valuing a neglected original over a pristine replica with no "biography".*  

  ---
  <sup>†</sup> *Cases doing no diagnostic work*:  
  - The **restored canvas case** (Q2) is only diagnostic in the physical branch (Q1=Yes).  
  - The **algorithm case** (Q7) is only decisive in the non-physical, non-forgery-sensitive branch (Q3=No, Q5=No, Q6=No).  
  - *All other cases are pivotal in splitting branches.*

  #### **Gaps and Limitations in the Tree**  
  1. **Empty combinations**:  
     - **Q1=Yes + Q3=No**: The tree excludes positions valuing physicality *and* creator identity (e.g., "only originals by the artist’s hand matter"). This is **unexplored** in dominant theories, as physical and intentional aspects are typically treated as competing paradigms.  
     - **Q5=No + Q6=Yes**: No position rejects replicas’ superiority (Q5=No) but equates copies with lost originals (Q6=Yes). This is **incoherent**—if copies lack the original’s essence, they cannot inherit its full value.  

  2. **Inseparable positions**:  
     - **Artisanal Originalism (Q4=No)** and **Material Fetishism (Q2=No)** both reject restorations/forgeries but for different reasons (creator’s hand vs. material). *To prise them apart*: Use a case where a *genuine* work is heavily restored (e.g., Leonardo’s *Last Supper*). Artisanal Originalism accepts it (if Leonardo’s hand was involved); Material Fetishism rejects it (due to lost paint).  
     - **Contextual Historicism (Q7=No)** and **Authorial Intentionalism (Q4=Yes)** both value history/intent but diverge on replication. *To prise them apart*: Use the replica case (Q5)—Contextual Historicism rejects replicas; Authorial Intentionalism may accept them if authorised.  

  3. **Non-diagnostic cases**:  
     - The **destroyed original case (Q6)** is answered uniformly by physicalists (Q1=Yes): *All* deem the copy inferior. It only splits non-physicalists (Q1=No).  
     - The **algorithm case (Q7)** is only contested in one branch (Q6=No). Positions in other branches (e.g., Artisanal Originalism) would uniformly reject algorithmic art but aren’t tested here.  

  #### **Notes for Your Chapter**  
  - **Strengths**: The tree forces concrete engagement with your cases, moving beyond summary by requiring mutually exclusive choices. Positions like **Ideal Form Theory** (prioritising intention over material) or **Structuralism** (demoting human agency) emerge only through case-based logic.  
  - **Weaknesses**: Real-world views may blend branches (e.g., valuing both provenance *and* material). The tree simplifies this to avoid hybrid-leaf sprawl, marking such blends as **unexplored**.  
  - **Use**: Introduce this tree *after* summarising key scholars. Frame it as a tool to "diagnose" underlying commitments in arguments you cite.  

