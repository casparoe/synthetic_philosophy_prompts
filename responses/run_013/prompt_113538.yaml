prompt: |-
  I'm on a small team with three years and a mandate to design the membership rules for a cross-border deliberative body — the kind that would decide pandemic measures, geoengineering experiments, or terms of migration — and we have no pre-existing demos to appeal to, so the boundary problem is our day job rather than a seminar topic. Which of its open questions should we treat as load-bearing, and in what order? Our own working proposal is that the demos consist of everyone who would have to comply with the body's decisions and could reasonably demand a justification for them, with membership revisable annually and no opt-out; part of what I want to know is how much of the standard agenda survives once you accept something like that, and which questions only look pressing because they assume the boundary is fixed once and for all. Give me the criteria behind your ordering — what is upstream of what, what is tractable for political theorists rather than lawyers or empiricists, what would actually change our design — along with what would move an item up or down the list and where the ordering is fragile. Close by saying how confident you are in the ranking as a whole and naming the single placement you are least sure of.
reasoning: |-
  Okay, the user is part of a team designing membership rules for a cross-border deliberative body. They need to tackle the boundary problem since there's no existing demos. Their proposal includes everyone affected by the decisions, with annual revisions and no opt-out. I need to figure out which questions are crucial and in what order.

  First, the user wants to know which issues are foundational versus those that only matter with fixed boundaries. They mentioned that some problems might seem pressing only because of fixed borders. So, I should identify which questions are load-bearing for their approach and which become irrelevant or change.

  The user's proposal revolves around affectedness and revisable membership. Key elements here are compliance and justifiability. I need to break down the open questions in democratic theory and see how they apply here. For example, defining "affected" is critical because their entire membership hinges on that. Also, revising membership annually introduces temporal dynamics that aren't in traditional models.

  Next, ordering these questions. I need to consider what's upstream—what needs to be settled first because it affects other issues. For instance, defining "affected" is a prerequisite before deciding how to include or exclude people. Similarly, the revisability aspect impacts how representation is structured, like whether to use sortition or elected representatives.

  Tractability is another factor. Some issues are more philosophical, like the definition of "affected," which political theorists can handle. Others, like data for defining membership, require empirical work. The user's team might need interdisciplinary input, but they need to know where to focus their theoretical efforts first.

  Also, the user wants to know which decisions would change their design. If they alter how they define "affected," that changes who's included. Revisability affects institutional design, like the review process. Opt-out policies might not be relevant since they're excluding it, but how to handle dissent within the fixed membership could be important.

  I should list the key questions: defining "affected," justifying revisable boundaries, membership representation, internal decision-making, and enforcement. Then order them by dependency. Defining "affected" is clearly first because it's the foundation. Revisability comes next because it affects how the demos adapts over time. Representation and decision-making follow, as they build on who is included. Enforcement is last because it's about implementing decisions once the demos is set.

  Confidence in the order: I'm fairly sure defining "affected" is the top priority. But the placement of representation (sortition vs. election) might be tricky. It could be influenced by practical concerns, but in their case, since membership is fluid, sortition might be more feasible. However, if the demos is large, elections could be cumbersome. I'm least sure about whether representation should come before or after decision-making rules. Both are interdependent, but representation might need to be decided earlier to structure the body.
answer: |-
  Based on your mandate, context (no pre-existing demos, revisable boundaries), and proposal ("all subject to compliance + justifiability demand, annual revision, no opt-out"), here's a prioritized list of load-bearing questions, with reasoning for the ordering:

  1.  **Defining "Affectedness" & "Justifiability Demand" (The Core Criterion):**
      *   **Why Load-Bearing & Upstream:** Your entire demos hinges on this definition. What constitutes "having to comply"? (Direct legal obligation? Significant economic impact? Environmental consequence?) What makes a demand for justification "reasonable"? (Geographic proximity? Vulnerability? Expertise? Simply being human?) **This is the absolute foundation;** everything else flows from who gets included. A broad definition creates a massive, unwieldy demos; a narrow one risks excluding significantly impacted groups.
      *   **Tractability:** Primarily **Political Theory/Philosophy**. Requires deep normative justification and conceptual clarity. Lawyers implement it, empiricists measure it, but theorists must define it.
      *   **Impact on Design:** Radically alters the size, composition, and potential legitimacy of the body. Changes the scope of "compliance" and "justification."
      *   **Moves Up/Down:** N/A. This *is* the starting point.
      *   **Fragility:** Highly fragile. Consensus here is elusive. Different interpretations lead to vastly different demoi.

  2.  **Operationalizing "Affectedness" & Managing Scale:**
      *   **Why Load-Bearing & Upstream:** Defining the criterion is abstract; *applying* it to billions of people across borders is the concrete, crushing challenge. How do you *identify* and *verify* who meets the criterion? What proxies or thresholds are used? How do you handle diffuse, future, or probabilistic harms? This directly determines the *practical feasibility* of your demos.
      *   **Tractability:** **Interdisciplinary (Theory + Empirics + Law + Tech)**. Theorists frame the problem, empiricists develop measurement/data strategies, lawyers establish procedures/proxies, technologists build systems.
      *   **Impact on Design:** Determines the *actual* size and the administrative burden. Necessitates complex data infrastructure, verification mechanisms, and potentially contentious thresholds. Risks creating massive inclusion/exclusion errors.
      *   **Moves Up/Down:** Moves up if initial definition is broad; moves down slightly if definition is very narrow and specific.
      *   **Fragility:** Extremely fragile. Data gaps, contested methodologies, and resource constraints make accurate operationalization near-impossible. Creates significant legitimacy risks.

  3.  **The Mechanics & Legitimacy of Annual Revision:**
      *   **Why Load-Bearing & Upstream:** Your rejection of a fixed boundary is central. How is the annual revision *conducted*? By whom? Using what data and process? How are changes triggered (e.g., new pandemic, geoengineering project)? How do you ensure revisions aren't captured or manipulated? This is the dynamic element that makes your proposal unique but also unstable.
      *   **Tractability:** **Design/Institutional Theory + Law + Political Science.** Focuses on institutional rules, procedures, oversight mechanisms, and managing contestation.
      *   **Impact on Design:** Requires a permanent administrative/oversight body dedicated to boundary maintenance. Creates inherent uncertainty for members and stakeholders. Impacts long-term planning and institutional memory.
      *   **Moves Up/Down:** Moves up if affectedness is defined dynamically (e.g., tied to specific decisions). Moves down slightly if affectedness is defined very statically (e.g., "all humans").
      *   **Fragility:** Highly fragile. Constant revision invites political battles, gaming, and accusations of illegitimacy with each change. Maintaining procedural fairness is paramount and difficult.

  4.  **Representation within the Demos (Sortition vs. Election):**
      *   **Why Load-Bearing:** With a potentially vast demos, direct democracy is impossible. *How* are members selected to deliberate? Sortition (random selection) maximizes descriptive representation and minimizes elite capture but requires massive pools and civic education. Election risks partisan politics, elite dominance, and disenfranchising minorities within the demos.
      *   **Upstream/Downstream:** Downstream of 1-3 (size/shape of demos dictates feasibility of models), but upstream of internal decision-making rules (election implies different rules than sortition).
      *   **Tractability:** **Political Theory + Institutional Design + Empirical Political Science.** Balances normative ideals (equality, deliberation) with practical realities of large-scale implementation.
      *   **Impact on Design:** Fundamental choice shaping the body's character, legitimacy perceptions, deliberative quality, and susceptibility to external influence.
      *   **Moves Up/Down:** Moves up if demos is smaller/more manageable; moves down if demos is planetary-scale (making elections impractical, pushing towards sortition).
      *   **Fragility:** Fragile due to trade-offs. No perfect solution exists; choice involves significant compromises.

  5.  **Internal Decision-Making Rules & Deliberative Structure:**
      *   **Why Load-Bearing:** How does the representative body reach decisions? Majority vote? Supermajority? Consensus-seeking? How is deliberation structured (facilitation, expertise access, time)? This determines the quality of outcomes and perceived fairness *within* the constituted demos.
      *   **Upstream/Downstream:** Downstream of representation method (sortition assemblies need different support structures than elected parliaments). Less directly tied to the *boundary* question itself but crucial for functionality.
      *   **Tractability:** **Deliberative Democracy Theory + Institutional Design + Facilitation Practice.** Focuses on procedural fairness, information processing, and generating legitimate collective will.
      *   **Impact on Design:** Dictates internal procedures, required resources (time, facilitators, experts), and the types of outputs possible (nuanced recommendations vs. simple votes).
      *   **Moves Up/Down:** Moves down slightly because it's more about internal function than boundary definition, though legitimacy is interconnected.
      *   **Fragility:** Moderately fragile. Balancing efficiency, inclusion, and quality deliberation is hard, especially on complex topics.

  6.  **Enforcement & The "No Opt-Out" Reality:**
      *   **Why Load-Bearing:** How are decisions imposed on non-compliant states, corporations, or individuals? What are the sanctions? How is compliance monitored? The "no opt-out" clause is meaningless without credible enforcement, yet enforcement across sovereign borders is the hardest problem in global governance.
      *   **Upstream/Downstream:** Downstream. Assumes a demos is defined and a decision is made. However, feasibility of enforcement *should* inform the scope of decisions the body attempts (pushing back upstream).
      *   **Tractability:** **International Law + International Relations + Political Economy.** Focuses on power, sovereignty, sanctions regimes, and building compliance coalitions.
      *   **Impact on Design:** Necessitates relationships with powerful states/IOs, credible sanction mechanisms (economic, reputational), and potentially limits the ambition of decisions to what's politically enforceable.
      *   **Moves Up/Down:** Moves up if the body aims for binding decisions; moves down if its role is primarily advisory.
      *   **Fragility:** Extremely fragile. Enforcement against powerful actors is often impossible without backing from other powerful actors, creating circular dependencies.

  **What Falls Away/Changes with Revisable Boundaries & No Opt-Out:**

  *   **"Permanent Demos" Questions:** Debates about birthright vs. consent, intergenerational fairness *within a fixed group*, and long-term constitutional settlements become less urgent (though not irrelevant, as each annual revision faces mini-versions). The focus shifts to the *process* of revision.
  *   **"Opt-Out/Secession" Questions:** This is explicitly off the table. The debate shifts to managing dissent and ensuring voice *within* the defined demos during the revision period, and the legitimacy of the enforcement regime.
  *   **Some "Constituency" Questions:** While representation (Item 4) remains vital, rigid geographic or identity-based constituencies become harder to justify if the demos is defined by fluid affectedness. Representation models need flexibility.
  *   **Static Legitimacy Arguments:** Legitimacy hinges less on a one-time founding act or fixed identity and more on the *ongoing* fairness of the inclusion criterion, the revision process, and the deliberative quality.

  **Confidence & Least Sure Placement:**

  *   **Overall Confidence:** Moderately High (7/10). The logic of dependency (definition -> application -> revision -> representation -> internal rules -> enforcement) feels robust given your core proposal. The top 3 are clearly foundational and intertwined.
  *   **Least Sure Placement:** **Representation (Item 4) vs. Internal Decision-Making (Item 5).** The argument for putting Representation first is strong (it selects *who* deliberates, shaping *how* they deliberate). However, the *type* of deliberation (e.g., consensus-seeking vs. majoritarian) could influence the perceived legitimacy of the representative model chosen. This interdependence creates tension. I prioritized Representation because the selection mechanism fundamentally defines the body's character before it even begins deliberating, but acknowledge a strong case for their close coupling. This placement is most vulnerable to counter-arguments based on specific deliberative models requiring specific representative foundations.
