prompt: |-
  I am preparing teaching materials on the Frege–Geach problem and have been working from a rough rendering, in my own words, of an argument that I take to be Fregean in spirit. I do not have the original text in front of me, so what follows is a paraphrase rather than a quotation, and what I want is help understanding the argument, not verification of its wording.

  The argument runs roughly as follows. Take the sentence: If lying is wrong, then getting one's little brother to lie is wrong. Here the clause lying is wrong occurs inside a larger sentence. Whoever utters the whole conditional does not assert that clause; she may assert the conditional while denying outright that lying is wrong, and she may be entirely indifferent to the matter. The same holds for other embeddings: in It is possible that lying is wrong, in She believes that lying is wrong, and in Lying is not wrong, the words lying is wrong appear without being put forward as true. Yet the clause must mean the same thing in these occurrences as it does when it stands alone and is asserted. If it did not, the conditional would trade on a pun, the inference from the conditional plus the antecedent to the consequent would be an equivocation rather than a valid application of modus ponens, and the negated sentence would not be the contradictory of the original. So whatever the meaning of the term wrong is, it must be something the term carries into every context, asserted or unasserted, and it must be capable of forming part of the content of something that can be true or false. But if the meaning of wrong consisted in the fact that sentences containing it express an attitude — disapproval, say — then in the embedded occurrences there would be no attitude expressed at all, and the required sameness of meaning would fail.

  What I am struggling with is how to state precisely what this argument establishes and how much it establishes. In particular:

  1. What exactly does the sameness-of-meaning requirement demand? Is it a requirement on the meaning of the term, on the content of the clause, or on the identity of the thought? What is the smallest version of it that still yields the objection?

  2. At which step does an expressivist about moral terms come under pressure? I can see the objection as targeting the claim that the meaning of wrong is exhausted by the attitude expressed by sentences containing it. But I am not sure whether the objection also targets the weaker claim that the attitude is expressed in the primary or central use of the term, with the embedded occurrences handled by some secondary mechanism. Which of these two claims does the argument actually refute?

  3. There is a response in the literature, as I understand it, according to which the embedded clause does not express an attitude but rather attributes one, or prescribes the attitude, or uses the attitude in a different mode. I would like this response unpacked as a piece of semantic machinery rather than a slogan. Does it preserve the sameness of meaning, or does it concede the point by giving wrong a descriptive content that then does the logical work?

  4. A related response, which I have seen described as a two-component or descriptive-plus-evaluative analysis, treats an evaluative predicate as combining a purely descriptive element with an evaluative one, so that the descriptive element secures the logic and the evaluative element secures the attitude. Does this solve the problem or merely relocate it? If the evaluative element is inert in the logic, in what sense is the resulting view still expressivist?

  5. Finally, I am confused about the relation between two problems that are sometimes run together. One concerns the term in the antecedent of a conditional; another concerns the term under negation, in a sentence such as Lying is not wrong. Are these the same difficulty for the expressivist, or are they two difficulties with different shapes and different possible solutions? I have a vague sense that the negation case is harder, because the expressivist must say what attitude the negated sentence expresses without identifying it with the mere absence or withholding of the attitude expressed by the unnegated sentence. If that sense is right, I would like it explained; if it is wrong, I would like to be told where the asymmetry I am imagining breaks down.

  6. Last, if the expressivist offers an account of validity itself — so that calling an inference valid is not the assertion of a proposition but the expression of an attitude toward a pattern of inference — does the original problem simply recur at the level of the expressivist's own metalanguage? What, if anything, blocks that regress?

  Please explain the argument step by step, flagging at each stage what is being assumed, and then answer the numbered questions in order. For each proposed escape route, tell me what it buys and what it costs, and say plainly whether it is a solution or a relocation of the difficulty. I am interested in the structure of the problem, not in who said what where; no reading list or citations are needed.
reasoning: |-
  Okay, let me tackle this query about the Frege-Geach problem. The user is preparing teaching materials and has paraphrased an argument they find challenging. They need a clear breakdown of the argument's structure and detailed answers to six specific questions about its implications for expressivism.

  First, I need to reconstruct the core argument from their paraphrase. The key moves seem to be: 
  (1) Moral clauses like "lying is wrong" appear in embedded contexts (conditionals, negations, etc.) where they're not asserted. 
  (2) These embedded occurrences must have the same meaning as when asserted standalone. 
  (3) This sameness is required for logic (modus ponens, contradiction) to work. 
  (4) If expressivism says meaning is just the expressed attitude, embedded cases wouldn't express that attitude → meaning differs → logic breaks. 

  The user's six questions probe deep into this. For Q1 about sameness-of-meaning, I consider distinguishing between semantic content (what's preserved) and illocutionary force (what varies). The minimal viable requirement is compositional semantic value - whatever allows truth-conditional logic to function. 

  For Q2 on expressivist vulnerability, the argument directly challenges strong expressivism (meaning = attitude expression). Weak expressivism (attitude as primary use) might dodge but faces its own problems maintaining logical relations. 

  On Q3's "attribute/prescribe" response, I analyze it as trying to preserve semantic content while changing force. But does this actually work? Or does it sneak in descriptive content? The challenge is showing how this handles logic without collapsing to descriptivism. 

  Q4's two-component view seems like a relocation - descriptive part does logic, evaluative part does attitude. But then what makes it expressivist? And can the components really be separated? 

  Q5 about negation vs conditionals: both embed, but negation might be tougher because expressivists need to define a positive attitude for "not wrong" rather than just absence. Though conditionals have their own complexities. 

  Finally Q6's regress worry: if expressivism applies to validity itself, we get a meta-level version of the same problem. Some expressivists bite this bullet, others try hierarchical solutions - but it's messy. 

  Throughout, I'll maintain focus on argument structure over exegesis. The user wants tools to teach this effectively, so clarity on logical pressure points is crucial. For each escape route, I'll assess whether it solves or relocates the problem - and at what theoretical cost.
answer: |-
  Here's a step-by-step breakdown of the Frege-Geach argument from your paraphrase, followed by clear answers to your numbered questions:

  **The Core Argument (Frege-Geach Problem):**

  1.  **Premise (Embedding):** Moral sentences like "Lying is wrong" (*p*) can occur *embedded* within larger linguistic constructions (e.g., conditionals: "If *p*, then *q*"; negations: "Not *p*"; modal contexts: "Possibly *p*"; belief reports: "She believes that *p*").
  2.  **Premise (Non-Assertion):** When *p* is embedded, the speaker *does not assert* *p*. They do not thereby express the attitude (e.g., disapproval) typically associated with asserting *p* standalone. (Assumption: Expressivism links meaning directly to attitude-expression in assertion).
  3.  **Premise (Compositionality & Logic):** For logic and meaning to work correctly:
      *   The *meaning/content* of the embedded *p* must be identical to the meaning/content of the standalone asserted *p*.
      *   This sameness is required for:
          *   **Conditionals:** The antecedent *p* in "If *p*, then *q*" must have the same content as the *p* in the minor premise of modus ponens to avoid equivocation.
          *   **Negation:** The *p* in "Not *p*" must have the same content as the *p* in the original to be its genuine contradictory.
          *   **General Validity:** Logical inferences involving embedded moral sentences depend on the content of *p* remaining stable across contexts.
  4.  **Expressivist Claim (Initial):** The meaning of "wrong" (and thus the content of *p*) consists *wholly* in the expression of a non-cognitive attitude (e.g., disapproval) when *p* is asserted.
  5.  **Contradiction:** From (2) & (4): When *p* is embedded, it does *not* express the attitude. Therefore, if meaning *is* attitude-expression (4), the meaning of the embedded *p* must be *different* from the meaning of the standalone *p*.
  6.  **Conclusion:** (5) directly contradicts the requirement in (3). Therefore, the initial expressivist claim (4) must be false. The meaning/content of moral sentences must be something *other than* or *more than* the expression of an attitude in assertion – something that remains constant ("semantically invariant") whether the sentence is asserted or embedded. Specifically, it must be the kind of content that can be true/false and function as a component in truth-conditional logic.

  ---

  **Answers to Your Questions:**

  1.  **Sameness-of-Meaning Requirement:**
      *   It demands that the **semantic content** (or **propositional content**) expressed by the clause "lying is wrong" remains identical whether the clause is asserted standalone or embedded.
      *   This content must be the kind of thing that can:
          *   Be the *object* of propositional attitudes (belief, doubt).
          *   Bear truth values (or be truth-apt).
          *   Stand in logical relations (entailment, contradiction).
          *   Compose with logical operators (if, not, possibly) predictably.
      *   **Smallest Viable Version:** The requirement is that the clause contributes the *same semantic value* (its compositional contribution to truth conditions) in all syntactic contexts. This minimal requirement is necessary for logic (modus ponens, contradiction) to function without equivocation. If this minimal sameness fails, the logic fails.

  2.  **Expressivist Vulnerability:**
      *   The argument directly refutes **Strong Expressivism:** The claim that the meaning/content of "wrong" (and thus moral sentences) is *exhausted by* the attitude expressed *in the act of assertion*.
      *   It puts immense pressure on **Weak Expressivism:** The claim that attitude-expression is the *primary* or *central* use, with embedded occurrences handled by a secondary mechanism. Why? The argument shows that the embedded occurrences are *logically indispensable* and require the *same core content* as the standalone assertion. If the "secondary mechanism" provides a *different* kind of content for embeddings, it violates the sameness requirement (leading to equivocation). If the "secondary mechanism" involves the *same* attitude-expression content but somehow "inert," it struggles to explain how that content functions logically (e.g., how does disapproval compose with "if" or "not" to form a truth-evaluable whole?). The argument forces the expressivist to explain how the *core semantic content* required for logic incorporates or is consistent with their core thesis about attitude-expression.

  3.  **The "Attribute/Prescribe" Response (Unpacked):**
      *   **Core Idea:** When "lying is wrong" (*p*) is embedded, it doesn't *express* the speaker's disapproval. Instead, it *represents* or *attributes* disapproval (e.g., to the speaker in belief reports, or hypothetically in conditionals) or *prescribes* disapproval for consideration within the larger linguistic act.
      *   **Semantic Machinery:** The sentence *p* is assigned a *propositional content* that *concerns* the attitude. For example:
          *   *p* = "That lying is wrong" = "That lying is such that disapproval toward lying is correct/required" (a descriptive claim *about* the attitude).
          *   Or, *p* = "That lying is wrong" = "Disapproval toward lying!" (but this "attitude prescription" itself becomes the *propositional object* manipulated by the logical operators).
      *   **Sameness of Meaning?** This response *concedes* the need for invariant propositional content. It typically **preserves sameness** by giving "wrong" a *descriptive content* that refers to attitudes or prescriptions. The embedded clause always contributes this descriptive proposition.
      *   **Is it Expressivist?** This is highly contested.
          *   **Cost:** It significantly weakens expressivism. Moral sentences now express *descriptive beliefs about* attitudes/prescriptions, not (directly) the attitudes themselves. The "evaluative oomph" seems relegated to the meaning of the descriptive terms ("correct," "required") or lost entirely.
          *   **Benefit:** It solves the logical problem by providing the necessary invariant, truth-apt content.
          *   **Verdict:** More **Relocation than Solution.** It moves the non-cognitive element from the *act of uttering p* to the *content described by p*, potentially collapsing into a form of descriptivism ("moral realism about attitudes") or a hybrid view. It solves the embedding problem at the cost of the core expressivist commitment to *direct* attitude expression as the meaning of moral terms.

  4.  **Two-Component (Descriptive + Evaluative) Analysis:**
      *   **Core Idea:** A moral predicate like "wrong" contributes two things:
          1.  **Descriptive Component (D):** Identifies the natural properties (e.g., causing suffering, deception). This component is truth-conditional, invariant, and handles logic.
          2.  **Evaluative Component (E):** Expresses the non-cognitive attitude (e.g., disapproval) towards things possessing D. This is tied to the act of assertion.
      *   **Solution or Relocation?** This is **primarily a relocation.**
      *   **How it (Tries to) Solve:** The descriptive component (D) is the same in asserted and embedded occurrences. It provides the invariant semantic content needed for logic (modus ponens works on D, negation negates D). The evaluative component (E) is expressed *only* when the whole sentence is asserted.
      *   **The Relocated Problem:**
          1.  **Embedded Attitude?** What happens to E in embeddings? If it's absent, how is the meaning of "wrong" fully present? If it's present but inert, how is it semantically integrated? If it transforms (e.g., becomes a description *of* E), see point 3 above.
          2.  **The "Wrong" Property:** What binds D and E together? What *makes* something with D *worthy* of E? If it's just a contingency, the view seems descriptivist about D + non-cognitivist about E, losing the essential connection. If it's necessary, what grounds this necessity? Expressivists struggle to explain this without appealing to something beyond attitudes.
          3.  **Is it Expressivist?** Only weakly. The core semantic work is done by the descriptive component D. The evaluative component E becomes an add-on to assertion, not constitutive of the *meaning* of "wrong" itself in a way that solves the original embedding challenge for *pure* expressivism. The view risks becoming "descriptivism with added emotive force."

  5.  **Negation vs. Conditionals: Same Difficulty or Different?**
      *   **Core Problem is the Same:** Both negation and conditionals are *embedding contexts*. The fundamental challenge for expressivism is explaining how the *same* semantic content functions logically within *any* operator that embeds a clause (if, not, and, or, possibly, believes that, etc.).
      *   **Why Negation *Seems* Harder:** Negation highlights a specific sub-problem *within* the embedding challenge: **The Problem of Negated Moral Sentences.**
          *   If asserting "Lying is wrong" (*p*) expresses disapproval (A+).
          *   What attitude does asserting "Lying is not wrong" (¬*p*) express?
              *   *Not* expressing disapproval? (Withholding A+) – But this seems like no positive attitude, whereas ¬*p* is a substantial claim.
              *   Expressing approval? (A-) – But ¬*p* ("not wrong") isn't equivalent to "right" (A-).
              *   Expressing tolerance? Ambivalence? A prohibition on disapproving? (A new attitude B)
          *   The expressivist needs to define a *systematic, logic-respecting* attitude expressed by ¬*p* that contrasts appropriately with the attitude for *p*. This is difficult to do without implicitly relying on the *propositional content* being negated. Conditionals present a similar problem of compositionality (how does "if" combine with attitude-expressions?), but negation starkly exposes the need for a specific, contrasting attitude for the negated form.
      *   **Conclusion:** The embedding problem is unified. Negation is a particularly sharp *instance* of that problem because it demands a clear, positive account of the attitude expressed by the negated sentence, which is difficult to provide without collapsing into descriptivism or being ad hoc. Solutions addressing embeddings generally should cover negation.

  6.  **Regress in the Metalanguage (Validity):**
      *   **The Problem:** If the expressivist says that calling an inference "valid" is not stating a true proposition but expressing a pro-attitude (e.g., "Hoorah for modus ponens patterns!"), then the Frege-Geach problem recurs *for the concept of validity itself*.
      *   **Example:** Consider the metalogical claim: "If the inference from *p* and 'If *p*, then *q*' to *q* is valid, then the inference from *r* and 'If *r*, then *s*' to *s* is valid." The antecedent ("Inference I is valid") is embedded. If "valid" only expresses an attitude when asserted, what is the content of the antecedent here? How does the logic of this metalogical conditional work?
      *   **Does it Recur? Yes, immediately.** The same challenge arises: embedded occurrences of "valid" need invariant content for metalogical reasoning, but the expressivist account of "valid" seems to deny it has such content.
      *   **Blocking the Regress?** It's very hard to block. Expressivists have attempted strategies:
          *   **Bite the Bullet:** Claim their account *does* work for metalogic, perhaps by giving "valid" a special, minimalist truth-apt content based on attitudes (similar to responses in 3 & 4, but for logic itself). This pushes the problem up another level or relies on controversial minimalist theories of truth/propositions.
          *   **Hierarchy:** Claim that the expressivism about morality doesn't apply to logic/metalogic, which is purely descriptive or conceptual. This sacrifices the unity of the expressivist approach and may seem ad hoc.
          *   **Cost:** Accepting regress or fragmentation is a major theoretical cost. Successfully blocking it requires providing a satisfying expressivist account of logical vocabulary and its embedding that avoids needing a descriptive metalanguage – a very high bar. Most critics see this regress as a fundamental weakness. **Verdict:** This regress is a powerful argument that the initial embedding problem wasn't truly solved, just pushed into the background, and it resurfaces catastrophically when expressivism tries to account for its own theoretical foundations (logic itself). Blocking it is exceptionally difficult and arguably not achieved.
