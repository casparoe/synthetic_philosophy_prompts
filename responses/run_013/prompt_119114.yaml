prompt: |-
  I have been keeping a list of my reactions to cases in which there appears to be a reason to hold an attitude — a belief, a desire, a feeling, an admiration — and I would like to know what principle, if any, my reactions add up to. I gather this is what philosophers call the wrong kind of reasons problem, but I want the verdicts to do the work, not the label.

  My cases, and what I think about each:

  1. The offer. A surgeon offers me ten thousand dollars if I can sincerely believe that the lump is benign. I think the offer is a reason to want that belief, and to try to induce it, and no reason whatever to think the lump is benign. A threat works the same way in reverse: believe it or be fired is a reason to be rid of the belief, not to hold it.

  2. The plane. I am frightened on a flight, and I know that if I sincerely believed the plane were safe I would be calm and would enjoy the journey. I do not think that is a reason to think the plane is safe. But I do not think it is nothing either: it is a reason to want the belief, and I would think better of someone who managed to acquire it than of someone who took the surgeon's money.

  3. The painting. A close friend shows me a painting she has made. It is bad. I know she will be crushed if I do not admire it. I think the fact that it is hers, and that she will be hurt, is a reason to want to admire it and a reason to be kind about it, and no reason to think it is good. Yet the fact that it is hers does change what I actually feel when I look at it, and I am not prepared to call the feeling a mistake.

  4. The demon. A demon announces that he will destroy the city unless I sincerely admire him. I think that is a reason to want to admire him, not a reason to admire him. But the very same fact — his power and his willingness to use it — strikes me as an excellent reason to fear him, and I cannot tell whether those who say it is also some reason to admire him are confused or correct.

  5. The mud. A demon offers to make me rich if I sincerely desire a saucer of mud. Reason to want the desire, not to have it. If instead a chemist tells me the mud is nutritious and I am starving, that is a reason to desire it.

  6. The promise. I promise a dying friend that I will be angry with the person who wronged her. I take the promise to be a reason to act angry and to want to be angry, and not a reason to feel angry — though I notice it feels far more like a reason than the demon's threat does, and I want to know why.

  7. The self-fulfilling belief. My friend tells me her business will succeed. I know that if I believed in her she would work harder and would probably succeed. That the belief would help her succeed is a reason to want the belief; but it is also, in a way, evidence that she will succeed, and I cannot decide whether that makes it an ordinary reason after all.

  8. The expert. A stranger in a white coat tells me a vaccine is safe, and I take his word for it, with nothing I could check for myself. I think that is a good reason to believe him. Had he told me instead that believing him would be good for me, that would not have been. So being uncheckable is not what makes a reason the wrong kind.

  9. The joke. A cruel joke makes me laugh harder because it is cruel, and I take that to be a fault in me rather than evidence that it is funny; but when my oldest friend tells it, with thirty years behind us, I think it genuinely is funnier, and I would defend that.

  My tentative principle is that a reason is of the right kind when it bears on whether the attitude gets its object right — whether the thing really is true, or good, or dangerous — and of the wrong kind when it bears only on the costs and benefits of having the attitude. Cases 4, 6 and 7 make me doubt that this is sharp enough, and cases 3 and 9 make me doubt whether the object is always a mind-independent thing.

  What I want from you: a precise statement of the best principle, or a small set of rival principles, that captures this pattern; for each clause, the case that forces it; the verdicts that principle returns on cases I have not listed — in particular one in which the right-kind and wrong-kind considerations are the very same fact, and one in which the attitude is directed at a person rather than a proposition; and an honest account of which of my verdicts the principle cannot accommodate and would have to overturn. If the best available answer is a pair of principles that each save some verdicts and lose others, say so, and tell me which verdict is cheapest to give up.
reasoning: |-
  Hmm, this user has presented a sophisticated philosophical puzzle about the "wrong kind of reasons" problem, backed by nine carefully constructed cases with their intuitive verdicts. They're clearly well-versed in the literature but want verdict-driven analysis rather than labels. 

  First I notice their proposed principle is already quite refined: distinguishing between reasons bearing on the object's properties versus attitude-consequences. But their doubts are spot-on - cases 4/6/7 show gray areas where consequences might bleed into object-related reasons, while 3/9 challenge the "mind-independent" requirement. 

  The plane case (2) is particularly subtle - they recognize pragmatic benefits aren't epistemic reasons, yet feel it's not "nothing". That deserves special handling. And case 8 crucially shows uncheckability isn't the issue, undermining some simpler accounts. 

  For the requested counter-cases: 
  - The "same fact" challenge makes me think of admiration for a tyrant - their power is both threat (WKR) and object of awe (RKR). 
  - Person-directed attitudes need testing with admiration/love cases where personal history creates reasons that aren't propositional.

  Their verdict I'd most challenge is case 3 - if friendship changes aesthetic experience, is that really non-epistemic? But overturning it feels costly. Better to expand the "object" definition. 

  The dual-principle approach seems unavoidable here: one for truth-tracking attitudes (belief), one for responsiveness attitudes (admiration). Case 7 exposes this split - the business belief straddles both. 

  Key moves needed:
  - Distinguish constitutive aims (belief=truth, admiration=value)
  - Allow personal relations to shape objects (case 9)
  - Treat "evidence via consequences" as hybrid (case 7)

  Most defensible compromise: sacrifice the purity of case 3's verdict by allowing relational properties to count as object-related for non-propositional attitudes. That keeps cases 4/6 intact while explaining why the demon's power generates fear (RKR) but not admiration (WKR).
answer: |-
  Based on your cases and verdicts, the best principle distinguishes reasons based on **whether they bear on the attitude's constitutive standard of success**, not merely on consequences. Here's the refined principle, its components, counter-cases, and limitations:

  ### The Core Principle
  **A reason is of the right kind (RKR) iff it bears on whether the object *satisfies the constitutive standard* of the attitude. Otherwise, it is of the wrong kind (WKR).**  
  *(Constitutive standard = what makes the attitude fitting/successful: e.g., truth for belief, value for admiration, threat for fear.)*

  ### Key Clauses & Supporting Cases
  1. **Constitutive standards are attitude-specific**:  
     - *Case forcing this*: The demon (Case 4). Power threatens (fitting fear), but doesn’t merit admiration (WKR for admiration).  
     - *Case 8*: Expertise bears on truth (RKR for belief), while uncheckable benefits (e.g., "belief is good for you") don’t.  

  2. **Costs/benefits of *having* the attitude are WKR** (even if they motivate wanting the attitude):  
     - *Case forcing this*: The offer (Case 1). Money incentivizes *wanting* belief (WKR), not truth.  
     - *Mud case (Case 5)*: Nutrition bears on mud’s value (RKR for desire); demon’s reward doesn’t.  

  3. **Relational properties can be RKR** when they alter the object’s status under the attitude’s standard:  
     - *Case forcing this*: The joke (Case 9). Friendship makes cruelty *part of shared history*, transforming its humor (RKR for amusement).  
     - *Painting (Case 3)*: Friendship *changes perception* of the work ("it’s *hers*") – this *can* be RKR for admiration if "being hers" is seen as value-conferring.  

  4. **Consequences can be RKR only if they evidentially bear on the standard**:  
     - *Case forcing this*: Self-fulfilling belief (Case 7). Your belief causing success *is evidence* of feasibility (RKR), not just incentive to believe (WKR).  

  ---

  ### Verdicts on New Cases
  1. **Same Fact, Different Attitudes (Person-directed):**  
     *Case*: A dictator’s power makes him feared (RKR for fear) and offers rewards for admiring him (WKR for admiration).  
     *Principle verdict*: Power is RKR for fear (bears on threat), WKR for admiration (doesn’t bear on admirability). *Matches your demon intuition (Case 4)*.  

  2. **Attitude Directed at a Person (Not Proposition):**  
     *Case*: You learn your partner’s kindness is partly motivated by guilt.  
     *Principle verdict*: Guilt undermines admirability (RKR to doubt admiration), but if guilt *enables* kindness, it could be complex evidence (hybrid RKR/WKR).  

  ---

  ### Where Your Verdicts Clash with the Principle
  - **Painting (Case 3)**: You say friendship is "no reason to think it is good." The principle *allows* it to be RKR if friendship alters aesthetic value (e.g., as an expression of relationship). **Overturn your verdict**: Friendship *can* be RKR for admiration.  
  - **Promise (Case 6)**: You see the promise as WKR for anger. The principle *agrees* (promise doesn’t bear on wrongdoing, anger’s standard). But your intuition that it "feels more like a reason" than the demon’s threat is explained by *moral pressure to cultivate anger*, not anger’s fittingness.  
  - **Plane (Case 2)**: Your "not nothing" intuition is captured by WKR’s role in *pragmatic reasons to induce belief*, not RKR for belief itself.  

  ---

  ### Can’t Be Fully Accommodated? A Dual-Principle Compromise
  Your doubts in Cases 3, 4, 6, 7 suggest **two rival principles** are needed for full coverage:  
  1. **Evidential Principle (Belief/Truth-Tracking)**: RKR = evidence of truth.  
     - *Saves*: Cases 1 (offer), 2 (plane), 5 (mud), 7 (self-fulfilling belief), 8 (expert).  
     - *Loses*: Case 3 (painting) – friendship isn’t evidence of quality.  

  2. **Fittingness Principle (Non-Truth-Tracking Attitudes)**: RKR = bears on the object’s properties *as evaluated by the attitude’s standard* (e.g., admirability for admiration).  
     - *Saves*: Cases 3 (painting), 4 (demon), 6 (promise), 9 (joke).  
     - *Loses*: Case 7’s "evidence via consequence" – self-fulfilling belief feels RKR under Evidential but not clearly under Fittingness.  

  **Cheapest verdict to give up**: Case 7’s intuition that "belief causing success" is *partly* RKR. Reclassify it as purely WKR (incentive to believe) plus *separate evidence* (e.g., "my support matters"), avoiding hybrid reasons.  

  ### Conclusion
  Your pattern is best explained by **attitude-relative constitutive standards**. When relational properties (Cases 3, 9) or consequences (Case 7) *directly affect whether the object meets the standard* (e.g., friendship making a painting admirable, belief causing success as evidence), they are RKR. Pure incentives (Cases 1, 5) are always WKR. The hardest cases (4, 6) clarify that standards are attitude-specific: power fits fear but not admiration; promises fit obligation but not anger. **Sacrificing Case 7’s hybrid intuition** gives the clearest single principle; keeping it requires dual principles but preserves all other verdicts.
