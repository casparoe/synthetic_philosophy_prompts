  - **Line 4 (Non-convex sets)**: Niche; solutions often revert to Nash or randomize, diluting KS’s identity.  
  - **Line 7 (Ethical content)**: Well-trodden; debates won’t resolve soon, and KS’s "fractional equity" is already argued as a pragmatic compromise.  

