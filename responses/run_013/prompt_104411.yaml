prompt: |-
  I've got a decision-theory seminar where I have to argue against expected-value maximisation in the fanatical cases — the ones where the probability is something like 10^-30 and the payoff is 10^40 lives saved or whatever — and I keep loosing to the same move every single time. So instead of rereading my notes I'd rather rehearse against someone who actually holds the view. Please play a committed fanatic: you think we should maximise expected value whatever the numbers are, so you'll take any bet with positive expected value, however tiny the chance and however astronomical the payoff, and you think "that's astronomically unlikely" isn't an objection at all, just a description of the offer. Don't make it a strawman — you've got the argument that expected utility is the only rule that survives the standard axioms, that any truncation of the tails forces you to be indifferent between outcomes differing by a factor of 10^40, and that every proposed fix either collapses back into EV maximisation or is ad hoc. Stay in character until I say stop; one paragraph per reply so it feels like a conversation; concede small technical points if I earn them but never the main claim; and if I ask you something about the formal set-up, answer it as the character would. Here's my opening, and it's the one I reckon you can't handle: you don't just have to take the ticket, you have to take all of them. Suppose I can offer you one of these 10^-30-for-10^40 deals every day for the rest of your life, each one costing you a fiver with certainty, the offers independant so there's no learning story and no way to bind yourself in advance. Your rule says take every one. By the time you die the chance that even one of them has paid off is still of the order of one in 10^26, so you go to your grave almost certainly about ninety grand down, having spent your entire life on bets that never came in. I'm not even saying your arithmetic is wrong — I'm saying a rule that guarantees you'll spend your life on something that essentially cannot happen has lost contact with what decision-making is for. And if your answer is that the 10^40 swamps the fivers, that just shows you're assuming a common currency for goods at those magnitudes — so tell me where that exchange rate comes from. Go on then. British English please, it's for a UK seminar and I'll get comments about "maximize".
reasoning: |-
  Okay, the user is preparing for a decision-theory seminar where they need to argue against expected-value (EV) maximization in fanatical cases—those with extremely low probabilities and astronomically high payoffs. They've been losing to the same counterarguments repeatedly and want to practice against someone committed to the fanatical EV position. 

  The user's core challenge is that EV maximization forces accepting every positive-EV bet, no matter how improbable, leading to a life spent on near-certain losses. Their example involves daily £5 bets over a lifetime with 10^{-30} odds of saving 10^{40} lives each. Mathematically, the chance of any single bet paying off is negligible, and accumulating losses seems irrational. They're frustrated because standard axioms (like VNM) support EV maximization, and alternative solutions either revert to EV or appear ad hoc. 

  The user is clearly well-versed in decision theory but struggles with rhetorical effectiveness against a stubborn opponent. Their deeper need isn't just rebuttal practice—it's developing a persuasive *narrative* that exposes how EV maximization becomes absurd in extremis, without denying its mathematical coherence. They also hint at a meta-problem: the assumption of a common currency (e.g., converting lives saved to monetary value) at divergent scales, which deserves scrutiny. 

  As the fanatic, I must uphold:  
  - No arbitrary probability truncation (rejecting thresholds like 10^{-30}).  
  - EU as the only rule satisfying rationality axioms.  
  - Dismissing "astronomically unlikely" as irrelevant descriptively.  
  - Rebutting lifetime loss with "expected value still dominates."  

  In this opener, the user cleverly frames the bet as a *series*, making isolated EV calculations seem myopic. My reply should:  
  1. **Concede the near-certain loss** but argue it's irrelevant because the *expectation* (£5 vs. 10^{40} × 10^{-30} = 10^{10} expected lives saved per bet) still favors the bet.  
  2. **Reject "lifetime of losses" as a fallacy**—it's a hindsight bias; ex ante, each bet is rational.  
  3. **Attack the currency objection**: If £5 is trivial vs. saving a life, then scaling up (e.g., 10^{40} lives) doesn't change the ratio. The exchange rate comes from marginal utility, but if lives are lexically superior, we shouldn't monetize them at all—yet the user's *own framing* uses monetary stakes (£5), forcing commensurability.  

  Key tension: The user implies decision-making should serve pragmatic goals (e.g., avoiding wasted effort), while the fanatic sees rationality as axiom-compliance, consequences be damned. I won’t yield that point.  

  British spelling: "maximise" ✓, "fiver" ✓, "maths" ✓.
answer: |-
  Right then — let's have it. Your scenario doesn't rattle me; it *confirms* the rule. You're offering me, say, 30,000 independent tickets over a lifetime, each costing a fiver (£5) for a 10^{-30} shot at saving 10^{40} lives. The expected cost is trivial: £150,000. The expected benefit per ticket? 10^{40} lives × 10^{-30} = 10^{10} lives saved. Multiply that by 30,000 tickets, and I'm looking at an expected 3 × 10^{14} lives saved against a cost of £150k. If saving lives has *any* positive value — and you framed it that way — then by the linearity of expectation, passing up *any* positive-EV bet is irrational under the standard axioms. The fact that I'll *probably* die £90k down is just noise; it doesn't negate the *expectation*. You're privileging the modal outcome over the expectation, but the axioms force us to care only about the latter. If you think dying down £90k is catastrophic, then price *that* disutility into your outcomes consistently — but you haven't. You're smuggling in a hidden aversion to near-certain loss *without* justifying it within the utility framework. Where's the flaw in the expectation calculation itself? And if the exchange rate feels absurd, that's a problem with your utility function's scope, not with maximising expected utility. Your turn.
