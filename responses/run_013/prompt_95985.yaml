answer: |-
  **1.** The principle is **supervaluationism**: A sentence is *supertrue* if true under all admissible precisifications of vague terms, *superfalse* if false under all, and *neither* otherwise. There is no fact of the matter when neither. Admissible precisifications must respect clear cases and penumbral connections (e.g., if n grains is a heap, n-1 cannot be non-heap).

  **2.**  
  - **Clear cases are objective (supertrue/superfalse)**: Forces the requirement that admissible precisifications respect definite truths (10k=heap, 3≠heap), making disagreement objectively wrong.  
  - **No sharp boundary**: Forces that no *single* grain addition can be decisive under *all* precisifications; admissible precisifications draw boundaries at different points.  
  - **No fact for borderline cases**: Forces that for middling piles (like 5000 grains), some precisifications call it a heap and others do not, so it is neither supertrue nor superfalse.  
  - **Genuine disagreement in borderline cases**: Forces that conflicting assertions about borderlines are incompatible (both cannot be supertrue), yet neither is supertrue—capturing the sense of mistake without objective error.  
  - **No meta-borderlines**: Forces that "admissible precisification" is itself sharp; vagueness is first-order only.  

  **3.**  
  - **Chess chain**: Player A beats Player Z clearly (supertrue). Adjacent players (e.g., ranked 150 vs 151) are borderline cases for "beats"—no fact whether one beats the other.  
  - **Red-to-orange patch**: The midpoint patch is neither supertrue red nor supertrue orange; it is borderline.  
  - **Tall person**: A 190cm adult is supertrue tall, 140cm superfalse tall, but 175cm is borderline—no fact of the matter.  

  **4.** The principle **cannot keep "no further fact about how nearly borderline"**. Supervaluationism implies sharp boundaries between clear cases/borderlines and borderlines/clear non-cases. The nearest rival is **degree theory** (truth as a continuum: 0 to 1), which accommodates "degrees of borderline-ness" but costs classical logic (e.g., "heap or not heap" may lack a binary truth value even for clear cases) and conflicts with your "someone would be wrong" verdict for clear cases.  

  **5.** Moderate confidence (70%). Least sure point: **item 4's trade-off**. Supervaluationism's sharp meta-boundary is theoretically tidy but clashes with your intuition; degree theory's fuzziness better fits "no meta-borderline" but undermines bivalence for clear cases. This tension suggests no perfect solution.
