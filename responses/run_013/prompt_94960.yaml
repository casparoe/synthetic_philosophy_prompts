answer: |-
  Your analysis captures a profound conceptual structure, and it *does* have established names. The most precise fit is **Normative Baselines in Causal Attribution**, often discussed within **Counterfactual Theories of Causation** (specifically, the work of H.L.A. Hart, Tony Honoré, and David Lewis). Here's the breakdown:

  1.  **The Core Concept: Normative Baselines & the "Normal Course"**
      *   **Definition:** Causal attribution for complex events (like conflicts or systemic breakdowns) depends on an implicit or explicit *normative baseline* – a conception of the "normal," "expected," or "legitimate" state of affairs against which actions are judged as deviations or disruptions.
      *   **Mechanism:** Who is deemed the "initiator" depends on which party is seen as violating this baseline first. The baseline defines what counts as the "undisturbed course of events" and, crucially, **what each party was "owed"** (as you astutely noted) in terms of permissible behavior or expected forbearance.
      *   **Stability:** Disputes persist stably because proponents of different baselines genuinely perceive the *other side's* baseline as distorting the "true" normal state or excusing the *other side's* violation. The baseline itself feels objective to the holder, making the causal verdict feel like a discovery.

  2.  **Key Established Concepts & How They Fit:**
      *   **Hart & Honoré's "Common-Sense Causation" (Causation in the Law, 1959):** This is arguably the *most direct fit*. They argue that in law and history, we isolate causes by:
          1.  Identifying a "normal course of events" or "background conditions."
          2.  Identifying a deviation from that normal course (an "intervention").
          3.  Attributing causal responsibility to the agent(s) responsible for that deviation.
          *   **Fit:** Your observation about the "ordinary state" and "departure" maps perfectly onto their framework. The Cold War dispute hinges on whether the 1945 status quo (the baseline for the "1945 starter") or the ideological challenge of Bolshevism (the baseline for the "1917 starter") constitutes the relevant "normal course." The "what was owed" question directly relates to the normative judgment inherent in defining that normal course.
      *   **Counterfactual Dependence (David Lewis):** Causation is defined by asking "what would have happened otherwise?" If the event wouldn't have occurred *but for* the action, the action is a cause.
          *   **Fit:** The "but for" test is applied relative to a baseline. If the baseline is 1945, "but for" Soviet actions post-1945, would the Cold War have happened? If the baseline is 1917, "but for" the nature of the Soviet state/Western containment, would it have happened? The choice of baseline determines the relevant counterfactual scenario. Your point about the "first unwarranted departure" is essentially identifying the key counterfactual intervention relative to the chosen baseline.
      *   **Narrative Framing / Beginnings (Hayden White, Paul Ricoeur):** Historians shape meaning by choosing where a narrative begins and ends.
          *   **Fit:** This explains *how* the baseline is established (through the narrative opening), but it doesn't fully capture the *normative* element ("what was owed") inherent in choosing *which* beginning is significant for causal attribution. Framing is the mechanism; the normative baseline is the underlying justification *for* that frame.

  3.  **Why This Fits Your Description Exactly:**
      *   **Settled in Advance:** The baseline *is* the prior, usually unacknowledged settlement of the "normal course."
      *   **What Was Owed:** The baseline inherently defines legitimate expectations ("what was owed") – peace? ideological non-export? non-interference? security guarantees?
      *   **Different Starting Points = Defensible Verdicts:** Yes, because each starting point implies a different normative baseline against which actions are judged.
      *   **No Answer Until "Owed" is Answered:** Precisely. Causal responsibility ("who started it?") is only assignable *after* establishing the normative baseline defining the undisturbed state and its obligations.
      *   **Stability & Feeling of Discovery:** The baseline feels objective/natural to its holder. Actions violating *that* baseline genuinely appear as the clear initiating cause. Historians answer it because the baseline is often embedded in their interpretation of evidence, even if they reject the simplistic "who started it" framing.

  4.  **Boundary Cases: Where the Structure is Absent:**
      *   **Uncontroversial Baseline & Clear Aggression:** World War II in Europe (1939). The baseline of sovereign Poland existing is uncontroversial. Germany's invasion is an unambiguous, unwarranted violation by any plausible standard. "Who started it?" has a clear answer *because* the baseline isn't contested.
      *   **No Normative Baseline Needed:** Purely physical causation (e.g., "What caused the bridge to collapse?"). The "normal state" (intact bridge) is uncontroversial and non-normative. Causes are found in material failure or forces exceeding tolerances. There's no "what was owed" to the bridge.
      *   **Mutual, Simultaneous Violation:** Imagine two neighbors simultaneously, independently, and without prior conflict, deciding to poison each other's trees on the same night. Both acts are equally unwarranted violations of a shared baseline (property rights/neighborly non-harm). Attributing "who started it" is genuinely impossible without an arbitrary choice; the baseline violation happens simultaneously.

  5.  **Why Other Concepts Don't Fit as Well:**
      *   **Presentism:** Concerned with judging the past by present standards, not the structural role of baselines in causation.
      *   **Historiography/Revisionism:** Describes trends in interpretation, not the specific causal mechanism involving normative baselines.
      *   **Path Dependence:** Focuses on how early events constrain later options, not on the attribution of responsibility for initiating a sequence relative to a baseline.
      *   **Infinite Regress of Causes:** Acknowledges the problem but doesn't explain the *stability* of specific disputes based on chosen baselines.

  **Conclusion:** The established conceptual framework best describing your observation is **the role of Normative Baselines in Causal Attribution**, particularly as developed in **Hart and Honoré's theory of "Common-Sense Causation"** and its relationship to **Counterfactual Analysis**. This framework explicitly addresses how defining the "normal course of events" and "what was owed" (the baseline) predetermines the identification of the disruptive "first move" and thus the answer to "who started it?" The stability and feeling of discovery arise because the baseline itself is perceived as objective by those operating within it. The Cold War example perfectly illustrates this structure, as do many interpersonal and legal disputes where the core disagreement is about the legitimate starting point and its inherent obligations.
