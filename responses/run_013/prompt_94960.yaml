  Let me mentally scan relevant concepts... "Foundationalism" is too broad. "Narrative framing" captures part but misses the normative baseline aspect. Ah! "Counterfactual conception of causation" gets closer - that's Hart and Honoré's work on how we isolate causes by imagining deviations from normal courses. 

