  Write me a joke about akrasia. I want the punchline to turn on the actual content of the debate, not just "lol people procrastinate" — someone who's read a bit of philosophy of action should be able to tell I know what akrasia is.

  The angle I'm after: the awkward spot where hyperbolic discounting meets weakness of will. At t=0 the person sincerely judges that finishing the thing is best all-things-considered, and at t=1 they don't do it. The puzzle is whether that's weakness of will at all, or just a preference reversal where the later self genuinely doesn't rank it best anymore — in which case calling it "weak" seems like it's smuggling in the earlier self's ranking as the true one. Try to make the joke live in that gap.

  Bonus if you can work in the naive vs sophisticated present-bias thing: the one who sincerely believes their future self will buckle down and do it, versus the one who knows better and rigs up some commitment device in advance. Short is fine, one setup and a punchline.
