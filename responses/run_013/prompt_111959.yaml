prompt: |-
  I'm teaching a 400-level seminar on distributive justice and Thursday is my Taurek day — the paper where you can save five people or save one, and he says the numbers don't count, each person's claim is equal, flipping a coin is a perfectly respectable way to decide, and (this is the part that always starts a fight in class, and as I read it he's fine with it) he'd save his friend over five strangers. My students have had trolley problems shoved down there throats since intro, so I want to open with a joke that actually lands, which means it has to be funny to someone who knows the actual content of the position. So: not a generic utilitarian-does-arithmetic bit, not a trolley pun, nothing that could be told about just any old dilemma. The punchline should turn on something specific — the equal-claims premise, the coin toss and the strange fact that the lottery hands the lone person a 50% shot at survival while each of the five is stuck at 1/6, which is either a scandal or the whole point depending on your sympathies, the refusal to aggregate at all, the fact that saving the five is permitted but never required, or the friend case. Bonus if one of them could double as a comeback to the objection that five equal claims together are still more claim than one — the innumerate-ethics reply, basically.

  Give me five, so I can pick one for lecture and steal the rest for the problem set. I'm a little desperate hear — my last opener was a bit about the difference between a maxim and a rule and it died on its feet. Send them as exactly five numbered items, each one or two sentences, no intro and no closing note explaining which one you like, and definately in American English.
