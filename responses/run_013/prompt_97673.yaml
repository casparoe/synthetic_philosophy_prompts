answer: |-
  ## Pacifism Taxonomy Decision Tree

  **I. The Branches** (Questions & What Turns on Them - 290 words)

  1.  **"Does this doctrine primarily constrain *individual* choices, or does it fundamentally challenge *collective* practices (like state warfare)?"**  
      *Gloss:* Distinguishes personal conscience positions from those targeting the institution of war itself.

  2.  **"Is the core objection grounded in the *nature of the violent act itself*, the *wrongness of intending* violence, or the *corrupting effect* on the *agent's character*?"**  
      *Gloss:* Splits views based on *why* violence is problematic: consequences, mental state, or self-preservation.

  3.  **"Does the position categorically forbid *all intentional physical violence*, or does it specifically target *lethal/maiming violence*?"**  
      *Gloss:* Tests the scope of forbidden means, with non-lethal force (like restraint) as a key differentiator.

  4.  **"Does the doctrine primarily state that violence is *impermissible* (forbidden), that *not* using violence is *obligatory*, or that non-violence is *praiseworthy but beyond obligation* (supererogatory)?"**  
      *Gloss:* Separates deontic force: prohibition, duty, or ideal. Crucial for understanding demands on the agent.

  5.  **"Does the doctrine permit an agent to *enable or benefit* from violence performed by others (e.g., paying taxes, hiring a bodyguard)?"**  
      *Gloss:* Reveals whether the concern is avoiding personal *complicity* or minimizing *overall* violence.

  6.  **"Does the position allow using violence *to defend others* (not just oneself)?"**  
      *Gloss:* The critical pressure point separating "clean hands" (self-focused) from "clean ledger" (outcome-focused) pacifisms, especially regarding third-party defense.

  **II. The Leaves** (Positions, Names & Awkward Commitments - 12 leaves, ~400 words)

  1.  **Personal Non-Violence Absolutist:** Must allow even horrific harms (e.g., murder of a child) if preventing them requires any intentional physical violence by oneself.
  2.  **Personal Non-Lethal Pacifist:** Must allow someone to be killed rather than kill in their defense, even if non-lethal force could save them, if killing is the only option.
  3.  **Personal Intention-Based Pacifist:** Permits actions likely to cause harm if genuinely unintended (e.g., risky rescue), but forbids acts *aimed* at harming, creating awkward distinctions around foresight vs. intent.
  4.  **Personal Character Pacifist (Supererogatory):** Must accept that violently defending oneself or others is morally permissible, even if falling short of a high ideal of character.
  5.  **State Non-Participation Pacifist:** Requires the state to accept invasion/subjugation without violent resistance, relying solely on non-violent defense.
  6.  **State Anti-War Pacifist:** Forbids *offensive* wars but allows *defensive* wars, struggling to define "defense" clearly in complex geopolitical realities.
  7.  **State Non-Lethal Pacifist:** Requires military forces to use only non-lethal weapons, accepting higher casualties among defenders and potential mission failure if lethality is required.
  8.  **State Obligation Pacifist (Clean Ledger):** Forbids states from funding or authorizing *any* violence (even defensive), requiring complete non-resistance, potentially enabling aggression.
  9.  **Personal Clean Hands Pacifist:** Must refuse to violently defend others, even if easily possible, to keep one's *own* hands clean, prioritizing personal purity over preventing harm to innocents.
  10. **Personal Clean Ledger Pacifist:** Must allow *others* to violently defend *oneself* (e.g., hiring a bodyguard) to minimize overall violence, accepting complicity in others' acts to achieve a "cleaner" outcome.
  11. **Personal Defense Pacifist:** Permits self-defense violence but forbids defending others, struggling to justify why protecting oneself is fundamentally different from protecting another innocent.
  12. **Non-Violence as Supererogatory Ideal:** Must accept that individuals/states *may* permissibly use violence, especially in defense, but holds that *choosing* non-violence is morally superior, potentially undermining resistance to injustice.

  **III. Empty Branches** (~150 words)

  1.  **"Binds states but allows individual violence, grounded in act-wrongness."** *(Unattractive/Unexplored)*: If the *act* of violence is intrinsically wrong, why bind only collectives? States are composed of individuals acting. This niche seems unstable; either the act is wrong for all agents, or the constraint is about the *practice* (which would bind states). No compelling rationale emerges.
  2.  **"Categorically forbids all violence (impermissible), but is supererogatory."** *(Incoherent)*: Supererogatory acts are *beyond* obligation; if violence is categorically *impermissible*, it cannot be optional or praiseworthy to avoid it – avoidance is mandatory. These concepts clash.
  3.  **"Grounded in character corruption, permits enabling violence (e.g., taxes), forbids personal violence."** *(Unattractive/Unexplored)*: If violence corrupts the *character*, how does funding/ordering it *not* corrupt? Delegating violence seems equally (or more) corrupting than direct action. This inconsistency makes the position psychologically implausible and philosophically weak.

  **IV. Pairs It Can't Separate** (~100 words)

  *   **Personal Non-Violence Absolutist vs. Personal Non-Lethal Pacifist** (if lethal force is the *only* option): Both positions forbid the lethal act required to save a life. The tree distinguishes them *if* non-lethal force is possible, but when it's lethal force or nothing, they collapse into the same practical commitment: allowing the harm.
  *   **State Non-Participation Pacifist vs. State Obligation Pacifist (Clean Ledger):** Both require the state to forgo violent defense entirely. The tree distinguishes their *motivation* (refusal vs. minimizing violence) and views on *funding* (Clean Ledger forbids it), but their core *prescription* for state action in the face of attack is identical: non-resistance. The "enable/benefit" question (taxes, bodyguard) captures the *motivational* difference, not a different *action* for the state itself.
