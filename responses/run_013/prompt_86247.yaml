prompt: |-
  Some context, because the committee is smaller than the issue: I sit on the ethics and compliance sub-committee of a mid-sized foundation that funds rural water and sanitation in two regions, we meet Thursday, and I have to circulate a short written opinion by Tuesday night. The case on the table is this. Our main local partner in one district, a few weeks before a tender for four borehole contracts, distributed sacks of rice and small cash amounts to a handful of village elders, and seperately sent an envelope to the district water officer who sits on the tender evaluation panel. The partner's director is the district officer's nephew. A junior staffer at the partner organization reported it to our country office, which sat on it for six weeks before forwarding it up, and now wants to stay anonymous. The partner's response is that the elders' share is customary hospitality they'd be shamed not to reciprocate at the next harvest, that the envelope was a facilitation payment to unblock a permit that had been sitting for months, and that the wells are finished and running. Our country director's recommendation is to continue the grant with a written warning: suspending it punishes the villages, we'd just be replaced by outfits with no oversight at all, and our own standard is a foreign import that our auditors apply selectively anyway. My suspicion is that the committee is having a fight about moral philosophy without noticing, and I'd rather the memo actually argue the point than recite that we have a zero-tolerance policy.

  So what I need is the written opinion I'll circulate: a clear recommendation on the grant (continue, suspend, continue with conditions, terminate -- whatever you conclude is right) with a time frame attached to each step, and reasons the partner and our country office could actually respond to. A few things I want worked through rather than waved at, since they're what the committee keeps talking past each other on. First, whether a gift that creates a standing obligation between two people is the same kind of thing as a payment that buys one decision, and whether that distinction survives when the same person is doing the giving and the deciding. Second, whether what we're looking at is better described as clientelism than as corruption -- a durable, fairly open, reciprocal relation in which a patron is expected to redistribute to his people, which some people argue does a crude kind of accountability work where formal accountability is missing, as opposed to a covert one-off market exchange -- and if it is clientelism, what that actually changes about what we should do. Third, whether the norm we'd be enforcing, that officials allocate by impersonal rules, is a genuine universal requirement or the export of one particular state-building history, and what it would mean for our decision either way. There's also a test I keep coming back to that may or may not be a real distinction, I might have made it up in a meeting: ask whether the payment changed who got the contract or only how fast it got done, and ask whether a village assembly hearing the whole arrangement described in their own terms would endorse it or feel cheated. If those tests are confused, say so. Please also give the strongest honest version of the country director's position and explain why it doesn't win, and don't skip the practical bits -- whether we can protect the staffer, what we tell the other partners in the region, and what happens to the four wells and the villagers' own contributions if we pull out. I'm not asking for citations or a reading list, obviously, just the argument and the decision.
reasoning: |-
  Okay, this user is part of an ethics committee for a foundation funding rural water projects. They're facing a complex case involving gifts, potential bribes, and cultural nuances. The deadline is tight, so they need a clear, actionable recommendation by Tuesday night.

  First, let's unpack the layers. The local partner distributed rice/cash to village elders and sent an envelope to a district officer (who happens to be the director's nephew) right before a tender. The partner claims cultural reciprocity for the elders and facilitation payment for the permit. The country director wants to continue with a warning, arguing strict enforcement would harm villages. 

  The user's frustration is palpable - they feel the committee is debating abstract philosophy while ignoring practical realities. Their request is very specific: they want the memo to address three thorny questions head-on: 1) obligation vs bribery distinction, 2) clientelism vs corruption framing, and 3) universality of anti-bribery norms. Plus practical concerns about whistleblower protection and village impact.

  Hmm... the core tension here is between ethical absolutism and contextual pragmatism. The "tests" the user proposes (did it change outcomes? would villagers endorse it?) are actually quite sharp - not confused at all. The village assembly thought experiment is particularly clever for cutting through cultural relativism.

  For the recommendation... termination seems disproportionate given the partner's otherwise functional work, but mere warning ignores the nephew conflict. The permit "facilitation" feels especially indefensible - that's classic bribe territory. The elders' gifts might be more ambiguous culturally, but the timing (pre-tender!) makes it smell bad. 

  Practical considerations: Protecting the whistleblower is non-negotiable - suggest moving them discreetly. Villages shouldn't suffer for the partner's sins, so existing wells must stay operational. Other partners need a carefully worded notice that doesn't invite copycats.

  Biggest challenge will be framing this without sounding colonial. Need to emphasize that accountability expectations come from local staff/villagers (the whistleblower!), not just Western handbooks. The "mutual recognition" test does this well - if villagers feel cheated, that's the real standard.

  Country director's position has merit about harming villages, but it ignores how corruption ultimately drains resources from the poor. The strongest counter is that the partner's actions actively undermine the formal systems the foundation exists to strengthen. 

  Final structure: Lead with recommendation (continue with strict conditions), then unpack each ethical question plainly, address practicalities, and preempt committee debates by naming the philosophy trap upfront.
answer: |-
  Here’s a concise, actionable written opinion addressing your concerns and the committee’s key sticking points. I recommend a conditional continuation with strict oversight, balancing ethical rigor with practical impact.

  ---

  ### **Recommendation**  
  **Conditionally continue the grant for 6 months**, with immediate suspension of the partner’s authority over procurement/financial decisions. **Terminate in 6 months** unless:  
  1. The partner replaces its director within 30 days.  
  2. Publically discloses all transactions (including rice/cash/envelope) to village assemblies.  
  3. Repays the "facilitation payment" to the foundation, plus 20% penalty.  
  4. Accepts third-party monitoring of all finances.  

  **Reasons & Key Distinctions**  

  1. **Gift vs. Bribe? Context is critical but timing damns both:**  
     - Elders’ rice/cash: Customary reciprocity *could* be defensible—**if** unlinked to tenders. But distributing weeks *before* a tender creates a direct conflict of interest (COI). A "standing obligation" becomes corruption when activated for decision-influence.  
     - The envelope: Labeling it a "facilitation payment" is indefensible. Permits stalled for months require systemic fixes (e.g., foundation advocacy), not bribes to a relative. This is a one-off purchase of access.  

  2. **Clientelism vs. Corruption? A false dichotomy here:**  
     - Clientelism relies on *transparent*, reciprocal redistribution (e.g., "We support this patron; they deliver wells"). Here, transactions were covert, timed to sway a tender, and involved a conflicted official (nephew).  
     - **Test 1: Would villagers endorse it?** Unlikely. The secret payment to an official (nephew) and pre-tender gifts suggest villagers were excluded from the "bargain." If revealed, they’d reasonably feel cheated.  
     - **Test 2: Did it change outcomes?** Rice/cash: Unclear, but risk exists. The envelope *did* change timing (permit unblocked), directly advantaging the partner. Both fail the "arms-length" standard.  

  3. **Is our "impersonal rules" norm a cultural export? Irrelevant to the harm:**  
     - Even if Western states historically evolved this norm, *local stakeholders* (the whistleblower, villagers expecting fair tenders) clearly perceive a breach of trust. Enforcing accountability isn’t "Western" – it’s demanded by the junior staffer who risked reporting.  
     - Tolerating this undermines our mission: If bids are skewed by patronage, poorer villages lose resources. Corruption isn’t redistribution; it drains communal assets.  

  **Why Not the Country Director’s Position?**  
  Their view (continue + warning) has merit: Sudden withdrawal *does* hurt villagers, and lax oversight exists elsewhere. **But it fails because:**  
  - It ignores the nephew conflict and normalizes bribery as "facilitation."  
  - A written warning without consequences invites escalation ("We got a slap; next time, hide it better").  
  - **Practical alternative:** Conditionally continuing protects villagers *while* forcing reform. Withdrawal remains leverage.  

  **Practical Steps & Safeguards**  
  - **Protect the whistleblower:** Offer immediate transfer to another partner or foundation HQ role with salary protection. State anonymity is non-negotiable.  
  - **Existing wells:** Require the partner to transfer maintenance to village committees *now*. Foundation tech staff will verify functionality. Villagers’ contributions are safeguarded.  
  - **Communications to other partners:**  
    > "We are investigating procurement irregularities in [District]. All partners must reaffirm adherence to Annex 5 (Anti-Bribery Policy) by [Date]. Audits will prioritize tender processes. Report concerns anonymously via [Channel]."  
    *(Avoid specifics; signal scrutiny without prejudging)*  
  - **If terminated:** Freeze disbursements. Work with local gov’t to reassign well maintenance. Redirect future funds via alternate partners.  

  **Philosophy Avoidance Note**  
  This isn’t about absolutism vs. relativism. It’s about **mutual accountability**: The partner excluded villagers from the "patronage" chain, our country office sat on the report, and the whistleblower bet on our integrity. Failing them entrenches the very clientelism we’re accused of imposing. Conditional continuation demands change without abandoning those we serve.  

  ---  
  **Final:** Recommend this path to the committee. It addresses corruption risks, protects villagers, and centers local voices (whistleblower, hypothetical assembly). Time-bound steps force action, not debate.
