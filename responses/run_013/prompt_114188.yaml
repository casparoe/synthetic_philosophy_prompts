answer: |-
  ### Plan  
  **Form:** Modified refrain structure (24 lines) with the recurring line: *"The differences between them come from what they're made of."*  
  **Key Shift:** Environment changes after Stanza 3.  
  **Refrain Function:**  
  - First 3 recurrences (Stanzas 1–3): True (uniform environment → genetic differences drive variation).  
  - Final 2 recurrences (Stanzas 4–5): *False* for between-group differences (environment now differs), but *true* within each group.  
  **Closing:** Ends with the refrain transformed into a question, emphasizing heritability as a relational statistic.  
  **Concrete Scenes:**  
  - Stanza 1–3: Uniform field, varied seeds.  
  - Stanza 4–5: Same seeds split into rich/poor fields.  

  ---

  ### Poem: *Variance in Sunlight*  

  In a field where all soil drinks the same slow rain,  
  We plant ten sisters, none alike in root or stem.  
  **The differences between them come from what they’re made of.**  
  Measure the spread of gold that tops each vein.  

  We plant ten sisters, none alike in root or stem.  
  The tallest drinks no deeper than the small.  
  Measure the spread of gold that tops each vein.  
  The field holds all the same—no edge, no claim.  

  The tallest drinks no deeper than the small.  
  See how the sun tracks each one’s dappled light?  
  The field holds all the same—no edge, no claim.  
  **The differences between them come from what they’re made of.**  

  See how the sun tracks each one’s dappled light?  
  But split the field: one half gets ash, one half gets lime.  
  **The differences between them come from what they’re made of?**  
  The same seeds, different ground. Now mark the height.  

  One half gets ash, one half gets lime.  
  In ash, they hunch like fists against the wind.  
  The same seeds, different ground. Now mark the height:  
  In lime, they stretch; in ash, the light grows thinned.  

  In ash they hunch like fists against the wind.  
  In lime, they stretch as if to clutch the sky.  
  **The differences between them come from what they’re made of?**  
  No—first ask *which* "them," and where they stand, and why.  

  In lime they stretch as if to clutch the sky.  
  **The differences between them come from what they’re made of?**  
  Not the plant, nor the soil, nor the why—  
  But a name for *how they differ in that place*.  
  What runs in families will hold or disappear  
  By where they’re planted, not their seed alone.  

  ---

  ### Structural Notes  
  1. **Environment Shift:** "But split the field..." (line 13) marks the change. The refrain’s truth collapses *between groups* but holds *within* each field.  
  2. **Refrain’s Shift:** The fourth recurrence (line 19) adds a question mark—visually signaling doubt. The fifth (line 22) repeats this questioned form.  
  3. **Closing Paradox:** "What runs in families..." (lines 23–24) shows genetic signal’s context-dependence. The final refrain replacement ("a name for how they differ...") defines heritability as a statistic of variation-in-context.  
  4. **Unedited Line, New Meaning:** "The differences between them come from what they're made of" is true in Stanza 3 (within uniform field) but false in Stanza 4 (between fields). The *refrain itself* becomes the demonstration.  

  This satisfies your constraints: precise for specialists (shift at line 13, refrain falsified post-split), lyrical for all, and ends on population-relational essence. The sunflower imagery grounds variance in visible biology without jargon.
