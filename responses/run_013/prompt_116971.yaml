prompt: |-
  I teach a senior elective on big ideas at a public high school — twenty students, one ninety-minute block — and I have no training in history or economics. Everything I know about famines I have picked up reading on my own, and the thing I keep circling is the claim that people starve when their ability to command food collapses, not when the food runs out, and that a bad harvest turns into a catastrophe only because of the arrangements people happen to be living under. I want my students to run into that with their hands rather than hear me assert it, and I would rather they never hear the technical name for it until the debrief. No lecture up front; the rules should do the work.

  Design the activity, and tell me where my plan is wrong. My plan is to split the room into two districts identical in every respect — same households, same grain, same weather — and run each as a small economy for a handful of rounds. Households should differ in what they own and what they can sell: a few large landholders with grain in store, smallholders, landless labourers who live by wages, a moneylender, a couple of traders able to move grain out of the district, and at least one household that is not the poorest in the district but whose livelihood is a service the crisis destroys. Each district gets the same modest shortfall — small enough that the grain actually present, if it were shared out, would still feed everyone — and the same outside buyer, a wartime procurement agent willing to pay well above the local price. Then they trade, month by month, at prices they set, each household having to buy enough each round to live. One district's officer has a relief budget and a standing order to feed anyone who comes to him; the other district's officer is told to keep order and send revenue up the line. Same weather, same harvest, different rules.

  What I want at the end is the picture: unsold sacks still in the warehouse, standing next to people who died, and two districts with different body counts, so that at least one student can say afterwards, correctly, that there was enough food. Then a debrief that reconstructs what actually killed whom — the price, the wage, the export, the officer's orders, the shortfall itself — and that ends by asking why we reach for the phrase natural disaster. Keep the traders' conduct ordinary and defensible, so the lesson cannot collapse into blaming a villain.

  Give me the roles and their starting endowments, the market rules, numbers simple enough to run on a whiteboard without calculators, the ninety-minute timeline, how deaths get recorded, the debrief questions in order, what will predictably go wrong the first time I run it and how to handle that, and an honest account of what the activity cannot reproduce. I will supply the historical cases myself — I am thinking of Bengal in 1943, Ireland in the 1840s, and the Great Leap Forward — so nothing in the debrief should rest on historical details I cannot check, and I do not need citations or further reading.
reasoning: |-
  Okay, the user is a high school teacher running an elective on big ideas. They want to design an activity to show how famines aren't just about food shortage but about economic systems and entitlements. Their plan involves simulating two districts with the same starting conditions but different policies, leading to different outcomes. 

  First, I need to unpack their core insight: famines occur when people lose the ability to access food, not necessarily when food is absent. The user wants students to discover this through hands-on play, not lecture. Their existing setup has two identical districts facing a small shortfall, with key roles (landholders, laborers, moneylender, traders) and one critical variable: District A has relief measures while District B prioritizes order/revenue.

  Hmm... the user's self-identified knowledge gaps (no formal history/economics training) mean the simulation must be self-explanatory. They also emphasize avoiding villain narratives—traders should act rationally, not maliciously. The debrief should explicitly avoid historical specifics they might not be able to verify independently (though they mention Bengal, Ireland, Great Leap as references).

  Biggest design challenges jumping out:
  - Time crunch: 90 mins for setup, multiple trading rounds, and debrief
  - Student engagement: Ensuring all roles participate meaningfully
  - Mathematical simplicity: Must run on whiteboard without calculators
  - Avoiding oversimplification: Showing systemic failure without reducing to "greedy traders bad"

  For roles, I'm considering 8 per district (16 total + 2 officers + 1 merchant). Key is asymmetry: Smallholders should be vulnerable to price spikes, landless laborers to wage collapse. The "service collapse" role (e.g., teacher) is clever—shows how non-food sectors crash. 

  Market rules need enforced scarcity: Traders can export if price differential exists, officer interventions differ. Death triggers must be mechanical (can't buy grain = die) to avoid arguments. 

  Predictable pitfalls:
  - Students might hoard irrationally instead of profit-maximizing
  - District B officer might improvise relief despite rules
  - Price spikes could cascade too fast/slow
  - Time management: 4 rounds max in 30 mins is tight

  The debrief questions should ladder up: Start with observable outcomes (bodies next to grain), then reconstruct causes (who died first? why couldn't they buy?), finally examine the "natural disaster" framing. 

  What this can't capture:
  - Long-term depletion (asset sales, debt cycles)
  - Corruption/black markets
  - Nutritional decline before death
  - Gender/age disparities

  ...But that's okay. The goal is the "aha" that rules determine survival, not absolute scarcity. Might suggest shortening rounds 2-3 to ensure debrief time. Also consider printing role cards with clear profit/loss incentives to keep traders "defensible."
answer: |-
  Here’s a streamlined simulation design for your 90-minute block, optimized for visceral learning and avoiding historical oversimplification. Numbers are deliberately simple for whiteboard tracking.

  **Roles & Starting Endowments (Per District, 8 Students/District)**  
  *(Assign roles randomly; use name tags)*  
  1. **Large Landholder (1 student):** 20 sacks grain  
  2. **Smallholder A (1):** 5 sacks grain + 1 cow (sells milk)  
  3. **Smallholder B (1):** 5 sacks grain  
  4. **Landless Laborer A (1):** 10 coins (earns 5 coins/month wage)  
  5. **Landless Laborer B (1):** 5 coins (earns 5 coins/month wage)  
  6. **Teacher (1):** 10 coins (earns 5 coins/month from households)  
  7. **Moneylender (1):** 30 coins (lends at 50% interest/month)  
  8. **Grain Trader (1):** 15 coins (buys low/sells high)  
  9. **District Officer (1 teacher/TA):**  
     - *District A:* 20-coin relief budget + "Feed anyone who asks" orders  
     - *District B:* 10 coins for policing + "Maintain order, send 15 coins revenue to capital" orders  

  **Outside Actor (You, the teacher):**  
  - **Wartime Buyer:** Offers 8 coins/sack *export price* (available only to Traders).  

  ---

  **Market Rules**  
  1. **Monthly Cycle (4 rounds = 4 months):**  
     - **Harvest (Round 1 only):** All grain holders receive sacks (Landholders: +10, Smallholders: +5).  
     - **Shortfall:** Announce: "Drought reduces harvest by 30%." (Actual grain: Landholder 13 sacks, Smallholders 3 sacks each).  
     - **Trade Phase (5 mins/round):**  
       - Households MUST buy 1 sack/month to survive (death if unable).  
       - Traders/Moneylenders set prices freely. Grain can be sold locally or exported to Wartime Buyer.  
       - District Officers enact policies (A: buys/distributes grain with relief coins; B: collects taxes).  
     - **Record Phase (2 mins):**  
       - Update whiteboard: Prices, grain stocks, coins, deaths (✅ = alive, 💀 = dead).  

  2. **Key Mechanics:**  
     - **Wages:** Laborers earn 5 coins/month *only if hired* (Large Landholder may hire 1 laborer/round for 5 coins).  
     - **Teacher’s Income:** Households pay 1 coin/month for education *if they have ≥3 coins after buying grain*.  
     - **Moneylending:** Loans at 50% interest due next round (e.g., borrow 10 coins → repay 15).  
     - **Trader Profit:** Buys local grain cheap, exports at 8 coins/sack.  
     - **Death:** Cannot buy grain → 💀 on board. Dead players sit silently.  

  ---

  **Timeline (90 Mins Total)**  
  - **Setup (10 mins):** Assign roles, explain rules, display endowments on board.  
  - **Rounds 1–4 (40 mins):** 10 mins/round (5 trade + 2 record + 3 transitions/officer actions).  
  - **Harvest Shortfall Announcement:** Start of Round 1.  
  - **Final Tally (5 mins):** Count living/dead, unsold grain.  
  - **Debrief (35 mins):** See questions below.  

  ---

  **Predictable Problems & Fixes**  
  1. **"Hoarding Panic":** Landholders refuse to sell.  
     - *Fix:* Remind traders: "Exporting gets DOUBLE local price." Incentivizes sales.  
  2. **District B Officer Rebels:** Might use coins for relief.  
     - *Fix:* Hand them a written mandate: "Priority: Order + Revenue. Relief is NOT your duty."  
  3. **Moneylender Paralysis:** Fear of defaults → no loans.  
     - *Fix:* Whisper: "Charge 50% interest. Laborers will pay anything to survive."  
  4. **Time Overruns:**  
     - *Fix:* Use a timer. After 4 mins, announce: "Prices locked! Transactions final in 60 seconds."  

  ---

  **Debrief Questions (Order Matters)**  
  1. **Observe:** *"What did we see? Point to facts on the board."*  
     (Guide them to: Unsold grain + bodies; different death tolls; identical starting grain/weather.)  
  2. **Reconstruct:** *"Who died first? What exactly killed them?"*  
     (Target answers: "Laborer couldn’t afford grain after prices spiked," "Teacher’s income vanished.")  
  3. **Analyze Systems:**  
     - *"What kept prices high in District B? What lowered them in A?"*  
       (Exporting? Relief? Wages?)  
     - *"Was the trader 'evil'? Why did exporting make sense?"*  
     - *"What broke first: food supply or people’s ability to get food?"*  
  4. **Big Idea:**  
     - *"If the grain was always enough to feed everyone, why did anyone die?"*  
     - *"Why do we call this a 'natural disaster' when the rules decided who lived?"*  

  ---

  **What the Activity CANNOT Reproduce**  
  1. **Human Suffering:** Trivializes starvation as a "game mechanic."  
  2. **Long-Term Dynamics:** No asset erosion (selling land/livestock), debt traps, or malnutrition stages.  
  3. **Social/Power Structures:** Caste, gender, or colonial violence shaping entitlements.  
  4. **Black Markets/Corruption:** All transactions are visible and enforced.  
  5. **Scale:** A real district has thousands, not 8 households.  

  ---

  **Why This Works for Your Goals**  
  - **"Hands-On" Discovery:** Deaths emerge from player choices within rules, not your lecture.  
  - **Villain Avoidance:** Traders/moneylenders act rationally (per incentives). Blame falls on *system design* (officer mandates, wage collapse).  
  - **Climactic Irony:** Grain piles next to graves starkly show "food availability ≠ access."  
  - **Historical Safeguard:** Debrief sticks to game outcomes. You add cases *after* the mechanism is clear.  

  **Run it tight, and they’ll feel the chasm between grain and hunger.** Let me know which tweaks you need.
