prompt: |-
  I do cost-benefit work for a living and I know the consequentialist toolkit cold — welfare aggregation, expected value, ex ante vs ex post, act vs rule, side-constraints, moral luck, interpersonal comparability, the repugnant conclusion, all of it. A friend has been dragging me to a Buddhist study group and I keep having the same reaction: this karma business is consequentialism, they just won't come out and say it. Either confirm that for me or kill it.

  What I want: restate the karma/merit system in my vocabulary, as faithfully as you can manage, and then give me the residue report. What carries over cleanly, what only carries over if you distort it, and what has no counterpart in my framework at all. For every piece of residue, tell me whether it's my framework that's missing something or whether the Buddhist claim was just doing something vaguer than it looks.

  The bits that make me think this won't come out clean:

  - The deed is the intention. Whatever else happens, the karma is the volition — not the act, not the fallout.
  - But the payout is scaled by who it was aimed at. A gift to an animal, a gift to an ordinary decent person, and a gift to someone far along the path pay out at wildly different rates — same gift, same cost to me, same benefit to them. That's a multiplier with nothing to do with how much good actually gets done.
  - And the valence is fixed by the roots: out of greed, hatred or delusion and it's bad; out of their absence and it's good. The good result is then supposed to follow as a matter of causal law. Nobody is weighing anything.
  - Ripening needs conditions and can be delayed for lifetimes, and I'm told some karma just never ripens at all — it lapses, the conditions never come together. So there's no ex post total, no bookkeeper.
  - Merit gets transferred. People dedicate it to dead relatives, to all beings. That's not the same thing as making anyone better off.
  - And the whole thing runs on no-self, so I can't even ask whose welfare is being aggregated. The stream that collects the result isn't me in any sense my framework can use.
  - Yet the precise working-out of the results of karma is on the list of things you're not supposed to ponder. There's a don't-compute clause sitting inside what looks like a calculus.
  - One more, and I may be mangling it: I half remember a story about a ship captain who kills a bandit to stop him slaughtering a boatload of merchants, and the tradition treats that as the compassionate thing to do rather than a crime. If I've got that roughly right, use it — that's the one case where my framework seems to slot straight in, and I want to know why it still doesn't feel like my framework.

  Then the verdict I actually care about. Is Buddhist ethics a species of consequentialism, or is it closer to a theory about the quality of mental states that happens to have a causal story about pleasant and unpleasant results bolted onto it? And if it's the second, what is the consequentialist getting wrong when he recruits karma for his side? Dont be diplomatic about it — I'd rather find out my instinct is cheap than get a both-sides answer.
reasoning: |-
  Okay, let me tackle this user's query. They're a cost-benefit analyst well-versed in consequentialism, trying to reconcile Buddhist karma with their framework. Their main question is whether Buddhist ethics is a form of consequentialism or something else entirely.

  First, I need to address each of their points about karma. The user lists several aspects that don't fit neatly into consequentialism: intention over outcome, variable merit based on the recipient, fixed valence from mental roots, delayed or lapsed ripening, merit transfer, no-self, and the prohibition against calculating karma. Each of these needs analysis to see where they align or diverge.

  Starting with intention. In consequentialism, intent might affect moral evaluation but outcomes are primary. Buddhism's focus on volition as karma itself is a fundamental difference. The user's framework prioritizes results, while Buddhism sees intention as the key moral event. This is a core divergence.

  Next, the merit multiplier based on the recipient. Consequentialism would weigh the actual benefit, but Buddhism assigns different values regardless of the outcome. This suggests a deontic element or symbolic significance beyond utility. The user's point here highlights a non-consequentialist structure.

  The three roots—greed, hatred, delusion—determine karma's valence. Consequentialism evaluates actions by their results, not fixed mental states. Buddhism's approach here is about mental purification rather than outcome optimization. Another clear mismatch.

  Delayed ripening and lapsed karma mean no final accounting. Consequentialism relies on aggregating outcomes. The unpredictability and lack of summation in karma make it incompatible with expected value calculations. The user's framework can't accommodate this uncertainty.

  Merit transfer is puzzling. Transferring merit without affecting well-being contradicts consequentialist principles. This seems more like a ritual practice, emphasizing interconnectedness over individual welfare. The no-self doctrine complicates this further—no permanent recipient exists.

  The prohibition against calculating karma is intriguing. Consequentialism thrives on computation, but Buddhism discourages it, possibly to avoid attachment to outcomes or to emphasize present-moment ethics. This "don't-compute clause" is a significant barrier.

  The ship captain story might seem consequentialist, but even here, the act's moral worth depends on intention, not just outcome. The user might view it as utility-maximizing, but Buddhism roots it in compassion, part of the path to enlightenment.

  The residue analysis shows that consequentialism's tools—welfare aggregation, expected value, etc.—don't map onto karma. The key differences are karma's focus on intention, mental purification, and the lack of a welfare recipient due to anatta. The user's framework misses the soteriological purpose: enlightenment over well-being maximization.

  Ultimately, Buddhist ethics isn't consequentialism. It's a path-oriented system centered on mental transformation, with karma as a law of moral causation linked to suffering and liberation. The consequentialist errs by trying to fit karma into a utility-maximizing model, missing the essence of reducing mental defilements. The user's instinct that something's off is correct—karma isn't a hidden calculus but a different paradigm altogether.
answer: |-
  Here's the raw translation into consequentialist terms, followed by a residue report and a blunt verdict. Your instincts are sharp – the overlap is superficial, and the core divergence is profound.

  **Restatement in Consequentialist Vocabulary (With Distortion Warnings):**

  1.  **Karma = Intentional Action (Volition):** "The deed is the intention" translates to: **The moral event is the formation of a volitional state (cetana), understood as a choice with intentional content.** Consequences *matter* causally, but the *moral valuation* is locked onto the volition itself at the moment of formation. *(Warning: This prioritizes the mental act over outcomes in valuation, which is alien to standard consequentialism).*
  2.  **Karmic "Payout" = Causal Potency Modulated by Context:** The "multiplier" based on the object (animal, person, enlightened being) isn't about *welfare impact*. Instead: **The karmic potency of a volition is amplified or diminished based on the qualities perceived in the object of the action, particularly its perceived moral or spiritual status.** This modifies the *causal power* of the seed planted, not the utility calculation. *(Warning: This introduces a non-utility factor into the causal chain's "yield").*
  3.  **Valence = Fixed by Mental Root:** **The moral valence (kusala/akusala, skillful/unskillful) of the volition is determined solely by the presence or absence of the three unwholesome roots (greed, hatred, delusion) or their wholesome counterparts (non-greed/generosity, non-hatred/loving-kindness, non-delusion/wisdom).** Good results *tend* to follow skillful volitions and bad results from unskillful ones as a causal law, but the *goodness/badness* is inherent in the root, not derived from the outcome. *(Warning: This is a deontic element embedded within a causal framework).*
  4.  **Ripening = Probabilistic, Context-Dependent Causal Activation:** **Karmic seeds produce results ("vipāka") only when encountering suitable conditions. This process is probabilistic, non-linear, potentially delayed across lifetimes, and some seeds may never activate due to lack of conditions.** There is no "ex post total" because karmic seeds are not discrete debts but potentialities interacting chaotically. *(Warning: This abandons aggregation and final summation entirely; no "books" exist to close).*
  5.  **Merit Transfer = Ritualized Re-dedication of Causal Potency:** **"Transferring merit" is a ritual act where one consciously re-dedicates the positive karmic potency generated by one's own skillful actions towards the benefit of another being or beings.** This doesn't directly *give* them welfare; it leverages the *causal power* generated by the donor's good volition, hoping it will manifest as beneficial conditions for the recipient within the complex karmic web. *(Warning: This is symbolic/ritual manipulation of causal potential, not welfare transfer).*
  6.  **No-Self & Karma:** **The "stream" (santāna) that experiences the results of past volitions is a causally continuous process lacking a permanent, independent owner ("self" or ātman). Karma is a law governing the unfolding of experience within this stream based on prior intentional acts within it.** "My" karma is the karma arising in *this* stream due to prior volitions within *this* stream. *(Warning: "Welfare aggregation" lacks a stable subject; it's about the quality of experience arising in a process).*
  7.  **The "Don't-Compute" Clause:** **Pondering the precise workings of karma is discouraged because (a) it's inherently complex and unknowable in detail, (b) it fosters speculative delusion and mental agitation, and (c) it distracts from the essential task: cultivating wholesome volitions *now*.** *(Warning: This explicitly rejects the feasibility and utility of the core consequentialist activity: calculation).*
  8.  **The Ship Captain (Jataka Tale Analogue):** **The act of killing the bandit is evaluated as skillful *because* the dominant volition was pure compassion (non-hatred, non-greed) and wisdom (understanding the horrific consequences of inaction). The *intention* to prevent immense suffering overrode the negative valence usually associated with killing.** The *result* mattered *for forming the intention*, but the moral quality is still in the volition itself. *(Warning: While the outcome motivated the act, the *valuation* remains anchored in the volition's roots, not the outcome itself as the source of value).*

  **Residue Report: What Doesn't Map & Why**

  1.  **Valuation Locked on Intention:** Your framework misses the core Buddhist claim that *moral quality resides solely in the mental state at the moment of volition*, not in the outcomes. Consequences are *effects* of karma, not *sources* of its moral worth. Consequentialism inverts this.
  2.  **Non-Utility Modifiers (Recipient Quality):** The multiplier based on the object's status distorts under consequentialism. There's no counterpart because consequentialism cares about actual welfare impact, not the perceived spiritual status of the recipient as an amplifier of *causal potency*. This is a uniquely Buddhist causal rule, not a welfare calculation.
  3.  **Fixed Valence by Root Causes:** Your framework *lacks* this. Consequentialism determines valence *retrospectively* based on outcomes (actual or expected). Buddhism determines it *prospectively* and intrinsically based on the mental roots present. Greed, hatred, and delusion are *always* unskillful roots; their absence plus positive counterparts is *always* skillful – regardless of the eventual outcome. This is a deontic core.
  4.  **No Aggregation/No Final Summation:** Your framework *requires* this for evaluation. Karma explicitly rejects it. Seeds may or may not ripen; there's no cosmic ledger adding it all up. The "quality of the stream" is what matters, not a total. Consequentialism is fundamentally incompatible with this open-ended, probabilistic, non-aggregative model.
  5.  **Merit Transfer as Ritual Re-Dedication:** Your framework has no counterpart. This isn't welfare economics; it's ritual psychology and an expression of interconnectedness within the causal web. Consequentialism would see it as irrelevant or irrational. Buddhism sees it as meaningful action shaping future conditions.
  6.  **No-Self & Welfare:** Your framework *assumes* a self (or identifiable person) whose welfare is aggregated. Buddhism dissolves this subject. "Welfare" becomes the *quality of experience* (pleasant/unpleasant/neutral) arising in the impersonal stream due to karma, oriented towards liberation from *dukkha* (suffering/stress/unsatisfactoriness), not maximizing positive states per se. This is a foundational metaphysical clash.
  7.  **The "Don't-Compute" Clause:** Your framework *is* the computation. This clause is a direct rejection of consequentialism's primary methodology as not only futile but counterproductive to the real goal (purifying the mind/ending *dukkha*).
  8.  **The Ship Captain: Intention Trumps Outcome (Again):** While *your* framework slots in (preventing greater harm), the Buddhist justification is *not* "this outcome justified the means." It's "the captain's volition, rooted in compassion and wisdom *in that extreme context*, was skillful *despite* the violent act." The *valuation* remains on the intention. If the captain acted out of hatred disguised as compassion, it would be unskillful, even with the same outcome.

  **The Verdict: Not Consequentialism. Not Even Close.**

  Your instinct that "this karma business is consequentialism" is **fundamentally mistaken, though understandably tempting.** Here's the blunt breakdown:

  1.  **Core Valuation:** Consequentialism locates moral value **in states of affairs (outcomes)**. Buddhism locates it **in the quality of the volition (intention) itself**. This is a chasm. Karma is a theory of *moral causation* linked to intention, not an *evaluation metric* based on consequences.
  2.  **Mechanism vs. Evaluation:** You're mistaking the *causal claim* ("skillful intentions tend to produce pleasant results") for the *evaluative claim* ("pleasant results are what make the intention good"). Buddhism makes the first claim explicitly. It categorically *rejects* the second. The goodness is in the root of the intention; the pleasant result is just a frequent, desirable *effect*.
  3.  **The Soteriological Goal:** Consequentialism (usually) aims to maximize welfare/utility. Buddhism aims for **the cessation of *dukkha* through the eradication of greed, hatred, and delusion (the unwholesome roots).** Karma explains how unskillful actions *perpetuate* *dukkha* and skillful actions *reduce* it, **not** because they maximize pleasant feelings, but because they weaken the defilements that bind us to suffering. The goal is liberation (Nibbana/Nirvana), not optimal states of welfare.
  4.  **What the Consequentialist Gets Wrong (Brutally):** You are **projecting your evaluative framework onto a causal mechanism and mistaking a diagnostic tool for a calculus.** You're trying to recruit "karmic payout" as a weird utility function. It's not. Karma explains *why* suffering arises (*dukkha* as result of unskillful roots) and *how* to stop it (cultivate skillful roots). It's part of a **pathology of suffering and a prescription for cure,** not a system for maximizing net benefit.
  5.  **What It Actually Is:** Buddhist ethics, centered on karma, is **primarily a theory of mental cultivation and purification,** grounded in a specific metaphysics (dependent origination, no-self), with a causal law (karma-vipāka) explaining the relationship between intentional actions and the quality of future experience within the samsaric cycle. The "results" (pleasant/unpleasant) are feedback mechanisms within that cycle, not the ultimate goal. The goal is escaping the cycle entirely by uprooting the causes.

  **Final Word:** Your framework isn't "missing" karma; it's looking for a consequentialist elephant in a room where the elephant is actually a complex, non-linear, intention-focused causal process aimed at psychological and existential liberation, not welfare optimization. The residue isn't vagueness; it's evidence of a fundamentally different paradigm. Your instinct that it doesn't fit is correct; your diagnosis *why* was off. It's not hidden consequentialism; it's something else entirely.
