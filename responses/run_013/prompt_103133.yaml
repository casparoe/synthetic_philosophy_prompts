prompt: |-
  I need a teaching plan, not an explanation. In a single ninety-minute session with a reading group of non-specialists — mostly lawyers and policy analysts who have never read metaphysics — I have to bring them to the point where the question of whether a failure to act can cause an outcome feels like a real problem rather than a verbal quibble. Give me the plan: the order in which the components must be introduced and, for each step, what it depends on and why it cannot come earlier; the single case that should carry the whole session and what that case must have and must lack for the work to come out right; the misconceptions the group will predictably arrive with or generate along the way, each matched to the exact point in the sequence where it should be headed off; one closing question that would show me whether they have understood the problem rather than merely acquired the vocabulary; and what I should deliberately leave out at this level, flagged as such, so that no one leaves thinking they have the whole picture.

  My intended arc, which you should treat as a hypothesis rather than a constraint: begin with the ordinary difference-making or counterfactual notion of causation, so that a match striking and a fire starting sit on the table as the baseline; then introduce the puzzle that omissions are not events at all, yet we say without hesitation that a gardener caused a plant's death by not watering it; then press the point that counterfactual dependence cannot by itself do the work, since a neighbour who likewise fails to water the wilting plant is not thereby its cause; and conclude that what singles out the gardener's inaction is some norm or expectation that makes that particular inaction salient rather than the countless other things no one did. I expect to carry the session on the gardener/neighbour contrast, but I am prepared to replace it, and I want you to tell me whether that pair really carries the idea or whether some other case would do it better — in particular, whether the pair smuggles in a moral judgment where I want a purely causal one.

  The misconceptions I anticipate, which you should confirm or correct and then place in the sequence: that an omission is a peculiar kind of ghostly event; that talk of omission causation is really just talk of responsibility and blame; that the but-for test settles every case once it is stated carefully; and that once omissions can be causes, almost everything becomes a cause of everything. For each, say where in the sequence it will surface and how the sequence should absorb it rather than merely contradict it.

  Keep the plan honest about the state of the discussion: separate what is settled among people who work on this from what is genuinely contested, and do not present a contested account as though it were the consensus. Lead with your bottom line — the recommended sequence in a single sentence — and then give the reasoning, with no preamble and no restating of my question.
reasoning: |-
  We are designing a single 90-minute session for non-specialists (lawyers, policy analysts) to make the problem of omission causation feel real. The goal is to move from a baseline counterfactual notion of causation to the puzzle that omissions (non-events) are cited as causes, and then to show that counterfactual dependence alone isn't sufficient (using the gardener/neighbor contrast), leading to the idea that norms or expectations might be doing the work.

  Bottom-line sequence in one sentence: Start with the counterfactual view using a clear event-cause example (match lighting fire); then introduce omission-causation with the gardener case; challenge the counterfactual view by contrasting the gardener and a neighbor's inaction; reveal that counterfactual dependence is shared by both but only the gardener is seen as the cause, prompting the need for an additional factor (norms/expectations); address misconceptions as they arise; and close with a diagnostic question.

  Detailed Plan:

  1. (0-15 min) Establish Baseline: Counterfactual Causation with Events
     - Present: A match is struck, and a fire starts. Ask: Did the striking cause the fire?
     - Why: Everyone agrees because there's counterfactual dependence: if the match hadn't been struck, the fire wouldn't have started (in the circumstances).
     - Dependence: This step must come first because it's the intuitive, uncontroversial starting point. It sets up the contrast with omissions.
     - Misconception to head off: None major here, but ensure they grasp counterfactual thinking. Ask for other examples to solidify.

  2. (15-30 min) Introduce Omission as Cause: The Gardener Case
     - Present: A gardener is hired to water a plant every day. He forgets, the plant dies. We say: "The gardener caused the plant's death by not watering it."
     - Why: This follows naturally because it's a common-sense attribution. It shows that we do treat inactions as causes.
     - Dependence: It builds on the counterfactual view: if the gardener had watered it, the plant would not have died (but-for the omission).
     - Misconception: "Omissions are ghostly events." This may surface here. Head it off by stressing: The gardener did nothing. There is no positive action, no event of "not-watering" that occurs. It's the absence of an event. Use analogy: "Silence isn't a sound; it's the absence of sound."

  3. (30-50 min) Challenge with the Neighbor: Counterfactual Dependence Isn't Enough
     - Present: A neighbor also knew the plant needed water and could have watered it but didn't. Counterfactual: If the neighbor had watered it, the plant would not have died. Yet, we don't say the neighbor caused the death.
     - Why: This step must come after establishing the gardener case because we need the intuitive pull that the gardener is the cause. The neighbor case shows that counterfactual dependence is present for both, but we don't attribute causation to the neighbor. This creates the puzzle: What makes the gardener's omission causal and the neighbor's not?
     - Dependence: Without the gardener case first, the neighbor case doesn't contrast. The contrast forces the question.
     - Misconception: "The but-for test settles everything." It surfaces here because both the gardener and neighbor are but-for causes. But we don't treat them the same. So the but-for test isn't sufficient. Absorb by showing that the test gives too many causes (overgeneration) and we need something else to distinguish them.

  4. (50-70 min) Introduce the Role of Norms/Expectations
     - Present: What distinguishes the gardener? The gardener had a duty or expectation to water the plant; the neighbor did not. So the cause is relative to a norm.
     - Why: After the puzzle, this is the natural move. It explains the asymmetry without denying counterfactual dependence.
     - Dependence: This step requires the contrast to be clear. Without the neighbor, there's no pressure to go beyond counterfactuals.
     - Misconception: "Omission causation is just about blame/responsibility." It surfaces here because norms sound moral. Head it off by distinguishing: Causation might be a precondition for responsibility, but we're focusing on the causal question itself. Note: We often use causal language without blame (e.g., "The lack of rain caused the drought"). Also, the neighbor might be blameworthy for not helping, but we still don't call her the cause. So causation and blame can come apart.
     - Also, misconception: "If omissions can be causes, everything causes everything." It surfaces now. Absorb by showing that norms restrict the set: Only omissions against a background of expectation are candidates. E.g., I didn't water your plant in Australia, but no expectation, so not a cause.

  5. (70-85 min) Consolidate and Diagnose Understanding
     - Recap the arc: We started with events, saw omissions can be causes, but counterfactual dependence isn't enough (gardener vs. neighbor), so we need norms to pick out which omissions count.
     - Closing diagnostic question: "Suppose a doctor fails to administer a life-saving drug to a patient, and the patient dies. Meanwhile, a passerby outside the hospital also could have stolen the drug and administered it but didn't. Is the passerby's failure a cause of the death? Why or why not?" 
       - Why this question: It tests if they see that both have counterfactual dependence, but only the doctor's omission is causal due to the norm (duty of care). If they get this, they've understood the problem.

  6. (85-90 min) What We Leave Out
     - Explicitly state: "We've only scratched the surface. We haven't settled whether norms are part of causation or just how we talk about it. There are deep philosophical debates: Some think causation is only about counterfactuals and norms are separate; others think causation is inherently normative. Also, we haven't discussed how this affects legal concepts like negligence. Today was just to make the problem vivid."

  Assessment of the Gardener/Neighbor Pair:
  - It works because it's simple and the contrast is sharp. However, it risks smuggling in a moral judgment (the gardener has a duty). To keep it purely causal, emphasize that the norm might be non-moral (e.g., a machine's function). But in this context, the duty is contractual/social, not necessarily moral. Since the group is lawyers/policy analysts, they'll relate to duties without conflating causation and liability. The case carries the idea well because it isolates the need for an extra factor beyond dependence.

  Alternative Case: Consider a machine with a safety guard. If the guard fails to engage (omission) and an accident occurs, we say the guard's failure caused it. But a bystander who could have pushed the emergency button didn't; we don't say the bystander caused it. This might avoid moral overtones but may be less intuitive for non-engineers. Given the audience, the gardener case is better.

  Sequence Adjustments for Misconceptions:
  - "Omissions as ghostly events": Head off at step 2 when introducing the gardener. Stress absence.
  - "But-for test settles everything": Head off at step 3 with the neighbor contrast.
  - "Omission causation is just responsibility": Head off at step 4 by distinguishing causation from blame, using the neighbor (blameworthy but not causal?) and non-moral examples.
  - "Everything causes everything": Head off at step 4 by explaining how norms limit the scope.

  Honesty about the State of Discussion:
  - At step 4, when introducing norms, clarify: "This is one influential view, but it's contested. Some philosophers think we can solve omission causation without norms, by fine-grained events or preemption. Others think causation is fundamentally difference-making and the norm part is pragmatic. There's no consensus."

  Final Note: Keep the session interactive. Use the cases to elicit intuitions at each step.
answer: |-
  ### Teaching Plan: The Problem of Omission Causation  
  **Bottom-line sequence in one sentence:** Begin with event causation (match/fire) to establish counterfactual dependence; introduce omission causation via the gardener case; challenge with the neighbor contrast to show counterfactual insufficiency; resolve by invoking norms/expectations; address misconceptions reactively; close with a diagnostic question on a medical case; flag unresolved debates.  

  #### Step-by-Step Sequence (90 Minutes Total)  
  **1. Event Causation Baseline: The Match Example (0–15 min)**  
     - **Activity:** Present: "A match is struck; a fire starts. Did the striking cause the fire?" Elicit intuitions.  
     - **Key point:** Settle on counterfactual dependence ("but-for" test): If the match hadn’t been struck, the fire wouldn’t have occurred.  
     - **Depends on:** Common-sense causation. Must come first to anchor the session in uncontroversial, intuitive grounding.  
     - **Why not earlier:** N/A (starting point).  
     - **Misconception addressed:** None yet (this step is consensus-building).  

  **2. Omission as Cause: The Gardener Case (15–30 min)**  
     - **Activity:** Present: "A gardener is hired to water a plant daily. He fails; the plant dies. We say, 'The gardener caused the death by not watering.'" Discuss.  
     - **Key point:** Omissions are treated as causes despite being non-events. Counterfactual holds: If he had watered, the plant would have lived.  
     - **Depends on:** Step 1’s counterfactual framework. Must follow it to show omission parallels event causation.  
     - **Misconception addressed:** *That an omission is a ghostly event* surfaces here. **Head off by:** Stressing literal inaction—e.g., "Not-watering isn’t a shadowy deed; it’s the absence of an act. Like silence isn’t a sound."  
     - **Case choice:** Gardener/neighbor pair is optimal. It avoids moral smuggling if **framed neutrally**: Focus on role-based expectations (e.g., "The gardener was contracted for this task") not blame.  

  **3. Counterfactual Insufficiency: The Neighbor Contrast (30–50 min)**  
     - **Activity:** Introduce: "A neighbor knew the plant needed water and could have watered it but didn’t. If she had, the plant would have lived. Did she cause the death?" Contrast with gardener.  
     - **Key point:** Both satisfy counterfactual dependence, yet only the gardener is seen as the cause. This exposes the problem: Dependence alone cannot distinguish causal omissions.  
     - **Depends on:** Step 2’s omission acceptance. Must follow to create tension—without the gardener, the neighbor is just "another omission."  
     - **Misconception addressed:**  
       - *That the but-for test settles everything* surfaces here. **Head off by:** Showing both pass but-for, forcing recognition that we need more (e.g., "But-for gives false positives—why isn’t the neighbor a cause?").  
       - *That once omissions are causes, everything causes everything* surfaces here. **Head off by:** Noting the neighbor’s inaction doesn’t "count," implying a limiting principle (to be resolved in Step 4).  

  **4. Norms/Expectations as the Resolver (50–70 min)**  
     - **Activity:** Pose: "What singles out the gardener? Why is his omission ‘special’?" Guide to norms (duty/expectation). Contrast with neighbor: No norm applies to her.  
     - **Key point:** Norms (e.g., role-based duties) make an omission salient amid infinite inactions.  
     - **Depends on:** Step 3’s puzzle. Must follow to motivate why we need norms—without the neighbor contrast, norms seem unnecessary.  
     - **Misconception addressed:**  
       - *That omission causation is just responsibility/blame* surfaces here. **Head off by:** Decoupling causation and morality—e.g., "A machine’s failed backup (no moral blame) can still cause a crash. Norms can be non-moral, like functional roles."  
     - **Honesty about debate:** Clarify this is contested—e.g., "Some philosophers think norms are essential to causation; others say they’re merely pragmatic. No consensus."  

  **5. Consolidation & Diagnostic Question (70–85 min)**  
     - **Activity:** Recap the arc: Events → omissions → counterfactual failure → norms. Then pose:  
       - **Closing diagnostic question:** "A doctor fails to give a life-saving drug; the patient dies. A passerby could have stolen the drug and administered it but didn’t. Is the passerby’s failure a cause of the death? Why or why not?"  
     - **Why this question:** Tests grasp of the problem—correct answer is "no" (no norm applies to passerby), showing they see norms as necessary beyond counterfactuals. If they cite "duty" or "expectation," they get it; if they default to but-for, they don’t.  

  **6. Deliberate Omissions & Wrap-up (85–90 min)**  
     - **Activity:** State: "Today’s goal was to make the problem feel real. We’ve left out:  
       - Whether norms are part of causation itself or just how we talk.  
       - Solutions like fine-grained event theories or causal process views.  
       - How this applies to law/policy (e.g., negligence). This is just the first step."  
     - **Why:** Prevents false closure—non-specialists often mistake exposure to a problem for mastery.  

  #### Why This Sequence Works  
  - **Gardener/neighbor pair**: Ideal—it’s intuitive, role-based (reducing moral smuggling), and forces counterfactual insufficiency. Alternatives (e.g., machine failures) are less accessible.  
  - **Pacing**: Each step builds tension. Steps 2–3 create the "problem," Step 4 resolves it partially, Step 5 tests depth.  
  - **Misconception handling**: Integrated reactively where they naturally arise (e.g., ghostly events at Step 2), using contrasts to absorb rather than contradict.  
  - **Honesty**: Step 4 flags contestation; Step 6 flags incompleteness. No theory is oversold.  

  **Outcome**: They leave seeing omission causation as a puzzle needing tools beyond counterfactuals—not a verbal quibble.
