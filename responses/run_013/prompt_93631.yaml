prompt: |-
  I am drafting a chapter on the ethics of humanitarian intervention and regime change, and I would like to use you as a foil. A colleague of mine — a political theorist whose positions I know well but whose governing principle I have never been able to pin down — has taken the following line on past cases.

  - NATO's 1999 air campaign over Kosovo, launched without Security Council authorization in response to the Serbian offensive against the Kosovar Albanian population: justified.
  - The 2003 invasion of Iraq, launched without Security Council authorization and openly aimed at replacing the government: unjustified.
  - The 2011 intervention in Libya, authorized by the Security Council to protect civilians, in the course of which the intervening states pursued the removal of the government: a mistake on balance, with the mistake located in the pursuit of regime change rather than in the protection of civilians.
  - The failure to intervene in Rwanda in 1994: a grave wrong.
  - The deployment of Gulf Cooperation Council forces into Bahrain in 2011, at the request of the Bahraini monarchy and without Security Council authorization, to suppress an uprising: unjustified.
  - The Australian-led international force in East Timor in 1999, mounted with Indonesian consent and with Security Council authorization after the violence that followed the independence referendum: justified.
  - The British deployment to Sierra Leone in 2000, which began as an evacuation of foreign nationals and ended by shoring up a collapsing government and a failing United Nations mission: justified.
  - NATO's belated air campaign over Bosnia in 1995, after three years of United Nations resolutions and after Srebrenica: justified, though far too late.

  She attaches one qualification to the first item. She regards the precedent that Kosovo set as a genuine cost of the intervention — she has said that Russia's later appeals to the protection of threatened populations in Georgia and Ukraine are exactly the precedent she feared — and yet she still counts the campaign as justified.

  Next week I intend to put the following case to her. A regional power invades a neighbouring state without Security Council authorization. Independent observers agree that the neighbouring state's government is carrying out a campaign of mass killing against a minority that shares the regional power's ethnicity. The intervention will halt the killing and, on the best estimates available, save on the order of two hundred thousand lives within a year. The minority has publicly and overwhelmingly asked for it. The rest of the neighbouring state's population, however, regards the intervention as a foreign invasion and opposes it. The intervening power's motives are frankly mixed: it intends to install a client government and to secure favourable terms for its own firms, and its leaders have said as much. The regional organization to which both states belong has endorsed the intervention by a narrow vote, but the intervening power dominates that organization. Nothing suggests the aftermath will be worse than the status quo; nothing suggests it will be a stable or liberal peace either.

  What will she say, and on what ground? I am less interested in whether she is right than in the rule she is implicitly running. Set out the two or three rules that fit her record equally well, say what each predicts about my case and where they come apart, identify which of her past cases is the closest analogue and why, tell me which rule you would bet on and what makes you prefer it, and name the further case — one I could put to her the week after — that would separate the surviving candidates from one another.
reasoning: |-
  Okay, the user is drafting a chapter on the ethics of humanitarian intervention and regime change. They want to use me as a foil to analyze a colleague's position on various historical cases. The colleague has taken specific stances on several interventions, and the user plans to present a hypothetical scenario to test her principles. 

  I need to figure out the implicit rules governing the colleague's judgments. She justified Kosovo (despite precedent concerns), opposed Iraq, saw Libya as a mistake due to regime change, called Rwanda a grave wrong, opposed Bahrain's suppression, and supported East Timor, Sierra Leone, and Bosnia. Her Kosovo qualification shows she weighs consequences but still approved it.

  For the hypothetical case: a regional power intervenes without UNSC authorization to stop mass killings of an ethnic minority, saving 200k lives. The minority supports it, but the majority opposes it. The intervener has mixed motives (client government, economic gain) and regional organization backing (narrow vote, dominated by intervener). Aftermath uncertain but not worse than status quo.

  What rules fit her pattern? First possibility: Strict Legitimacy Threshold. Requires UNSC authorization unless host state consent exists. This would oppose the hypothetical (no UNSC), but conflicts with her Kosovo support (no UNSC). Second: Humanitarian Primacy. Permits unauthorized intervention only for imminent mass atrocities with high success probability. This fits Kosovo/Rwanda positions. The hypothetical has clear mass killing and high lives saved, so she might approve despite mixed motives. Third: Anti-Instrumentalization. Rejects interventions where regime change is primary goal or where humanitarian aims are instrumentalized for power. This explains Iraq/Libya opposition and Bahrain's suppression rejection. 

  The hypothetical has mixed motives - humanitarian outcome but clear instrumentalization (client state intent). Closest analogue is Kosovo: unauthorized, stops atrocities, precedent risk accepted. But Kosovo wasn't openly about installing a client regime like this case. 

  I'd bet on Anti-Instrumentalization as her core rule because: 1) It explains her Libya distinction (protection vs regime change) 2) Her Iraq opposition centers on regime change objective 3) Bahrain involved instrumentalizing regional forces for suppression. The hypothetical's openly stated client-state agenda would trigger her objection despite humanitarian gains.

  To test between Humanitarian Primacy and Anti-Instrumentalization, I'd propose this case next week: UN-authorized intervention to protect civilians where the mandate explicitly prohibits regime change, but the intervener covertly facilitates rebel victory for strategic reasons. If she condemns this (emphasizing betrayal of mandate), Anti-Instrumentalization holds. If she tolerates it (since atrocities stopped), Humanitarian Primacy dominates.
answer: |-
  Based on your colleague's pattern of judgments, her governing principle appears to center on **the primacy of humanitarian intent and the rejection of instrumentalizing civilian protection for geopolitical gain**, tempered by pragmatic concerns about legitimacy and consequences. Here's the analysis:

  **Rules Fitting Her Record:**
  1.  **Humanitarian Primacy with Anti-Exploitation Proviso:** Intervention is justified *only* when the *primary and overriding motive* is the immediate cessation of mass atrocities or genocide, and the means employed are *strictly necessary and proportional* to that end. Regime change is permissible *only if* it is an unavoidable consequence of stopping atrocities, *not* an independent goal. Unauthorized action is a necessary evil when the UNSC is paralyzed by bad faith vetoes concerning a clear atrocity. (*Key: Motive purity, anti-instrumentalization*)
  2.  **Strict Legitimacy Threshold:** Intervention requires either UNSC authorization *or* clear host-state consent (as in Timor). Unauthorized intervention is exceptionally permitted *only* when facing an ongoing Srebrenica/Rwanda-style genocide *and* UNSC paralysis is demonstrably due to a vetoing power's complicity or bad faith regarding that specific atrocity. Regime change invalidates any humanitarian mandate unless it occurs *organically* from the protected population's actions post-intervention. (*Key: Formal legitimacy + genocide threshold + veto bad faith*)
  3.  **Consequentialist Atrocity Prevention:** The primary rule is preventing imminent or ongoing mass atrocities/genocide. Authorization and motives are secondary *if* the intervention is *highly likely* to succeed in stopping the atrocities *without* causing worse consequences. Regime change is problematic mainly if it demonstrably *causes* worse instability or atrocities than the status quo. (*Key: Effectiveness in stopping atrocities, net consequences*)

  **Predictions for Your Case & Divergence:**
  *   **Rule 1 (Humanitarian Primacy/Anti-Exploitation):** **Opposes.** While the humanitarian need is clear (mass killing, 200k lives), the *openly declared* mixed motives (installing client govt, securing economic benefits) and the *overwhelming opposition* from the majority population signal instrumentalization. The regional endorsement, dominated by the intervener, lacks legitimacy. Saving lives is paramount, but *not* if achieved via cynical exploitation. *Prediction: Unjustified.*
  *   **Rule 2 (Strict Legitimacy Threshold):** **Opposes.** Lacks UNSC authorization. Host state opposes. While mass killing is occurring, the veto bad faith condition isn't met (the case doesn't specify a UNSC veto related to *this* situation). The regional endorsement, seen as coerced, doesn't substitute. The open pursuit of a client government further delegitimizes it. *Prediction: Unjustified.*
  *   **Rule 3 (Consequentialist Atrocity Prevention):** **Supports.** The intervention is highly likely to stop mass killing and save 200k lives. The status quo is horrific. While the aftermath is uncertain, it's "nothing suggests worse than status quo." Motives and opposition, while suboptimal, are secondary to the overwhelming net gain in lives saved. *Prediction: Justified.*

  **Where Rules Come Apart:** Motive purity/anti-instrumentalization (Rule 1) vs. pure consequences (Rule 3). Rule 1 would condemn even a successful atrocity-stopping intervention if driven by cynical motives. Rule 3 would accept it. Rule 2 relies heavily on formal legitimacy.

  **Closest Analogue: Kosovo.** Both involve:
  *   Unauthorized intervention by a regional alliance/NATO.
  *   Clear humanitarian catastrophe (ethnic cleansing/genocide).
  *   Saving large numbers of lives as the primary *stated* goal.
  *   A precedent risk acknowledged as a cost.
  *   Opposition from the target state's majority population.
  *   **Key Difference:** Kosovo interveners *claimed* purely humanitarian motives (whether believed or not), while your case has *openly declared* mixed/imperialist motives. Libya is also relevant regarding regime change, but Libya had UNSC authorization initially.

  **Betting on Rule 1 (Humanitarian Primacy/Anti-Exploitation):**
  *   **Why:** It best explains her core distinctions.
      *   **Iraq vs. Kosovo:** Iraq's *overt* regime change goal was illegitimate, Kosovo's *stated* goal was protection (even if regime change resulted).
      *   **Libya:** The specific mistake was *pivoting* to regime change *beyond* the civilian protection mandate. Protection itself wasn't the error.
      *   **Bahrain:** Suppressing an uprising under the guise of regional stability, lacking any credible humanitarian motive, is clearly instrumentalization.
      *   **Kosovo Qualification:** The precedent fear relates to *bad actors exploiting the justification*, precisely the instrumentalization she rejects. Yet she supported Kosovo because its *core motive* appeared (to her) sufficiently humanitarian.
      *   **Rwanda:** The failure stemmed from ignoring a purely humanitarian catastrophe, not instrumentalizing it.
  *   Your case's **openly declared non-humanitarian motives and the majority population's opposition** are fatal under this rule, making it distinctly different from Kosovo. The regional endorsement, seen as coerced, reinforces the instrumentalization.

  **Discriminating Case (For Next Week):**
  *   **The Scenario:** A brutal dictatorship is systematically killing a small religious minority (approx. 5,000 deaths imminent). A neighboring democracy, with a large diaspora from that minority and a historical rivalry with the dictator, launches a swift, unauthorized Special Forces raid. The raid precisely kills the dictator and his inner circle, halting the killings immediately. The democracy *openly states* its motives: 1) Stop the atrocities, 2) Remove a hostile rival, 3) Protect its co-ethnic diaspora. The population of the target state is largely indifferent/relieved about the dictator's death. No UNSC action was possible due to rival alliances. The aftermath is uncertain but chaotic (not immediately worse).
  *   **Why it Separates Rule 1 & Rule 3:**
      *   **Rule 1 (Anti-Exploitation):** **Likely Opposes.** While atrocities are stopped, the *openly declared* mixed motives (removing a rival, protecting co-ethnics) instrumentalize the humanitarian act. The means (targeted decapitation/regime change) are central to the operation's goal.
      *   **Rule 3 (Consequentialist):** **Likely Supports.** The intervention was highly effective, swift, low-casualty, and stopped the killings. The net consequence is positive (5,000 saved, brutal dictator gone). Motives are secondary to the successful outcome.
      *   **Rule 2 (Legitimacy):** **Opposes** (Unauthorized, regime change).
  *   **Prediction:** If she **opposes** this raid despite its success due to the declared non-humanitarian motives, it confirms **Rule 1 (Anti-Exploitation)** as her core principle. If she **supports** it because it worked and saved lives, she leans towards **Rule 3 (Consequentialist)**.

  This approach should effectively reveal the underlying ethical architecture of your colleague's position, grounded in a deep suspicion of power masquerading as humanitarianism.
