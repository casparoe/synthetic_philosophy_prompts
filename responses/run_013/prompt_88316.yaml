prompt: |-
  I'm a PhD student in philosophy — value theory mostly, though I keep getting dragged into the formal side of things by my committee — and I need to put together a 2-3 page research proposal for a fellowship I'd really like to get: two years, no teaching, so I'd actually have time to do the work rather than just gesture at it. I want to write it on the transitivity of "better than," specifically the spectrum / continuum argument. You know the shape of it: start with an option that's slightly worse in some respect but hugely better in another (a life that's a bit less good but much longer, or a population many times bigger where everyone's quality of life is only a hair lower), then chain lots of tiny steps where each adjacent pair looks obviously better than the one before, and notice that the endpoints seem obviously to go the other way. The usual responses are to swallow the intransitivity and give up on representing value with a single ordering, to deny one of the steps and accept a sharp cutoff somewhere, or to say the whole thing is an artifact of vagueness in the comparative. I've read enough of the standard back-and-forth that I don't want to just re-run it — the proposal needs an angle that isn't the one everyone takes.

  Here's the half-formed thing I've been chewing on, which I argued about with a roommate over dinner and still can't tell whether it's a real distinction or a verbal one. I think two different notions are getting run together in these debates: a purely *comparative* notion, on which "A is better than B" is just a claim about how the two options stand to each other, and a *choice-guiding* notion, on which "A is better than B" is supposed to tell you that you should pick A over B when those are the options. My hunch is that the transitivity intuition — the thing that makes the spectrum argument feel like a reductio — really attaches to the choice-guiding notion, and that the comparative notion might survive the spectrum intact (or at least be intransitive in a way that doesn't matter). If that's right, then the live question isn't "is the bare relation *better than* transitive?" but something like: what constraints have to hold between the comparative and the choice-guiding notions for our ordinary practice of comparing and choosing to hang together, and can any of those constraints survive the spectrum? And if none can, which do we give up — the idea that the two notions are systematically linked, or the transitivity intuition itself?

  So what I want from you is the proposal itself. State the question precisely enough that it has a determinate answer and I could recognize one when I saw it, say why the existing positions (the intransitivity-accepters, the cutoff-deniers, the vagueness people) leave this particular question open rather than already settling it, and lay out the approach — what I'd actually do, ideally broken into rough phases over the two years, since "think hard about betterness" isn't a method. Be honest about what a positive result would look like versus what would count as the project failing (e.g. if the comparative/choice-guiding distinction turns out to collapse under pressure, or if it turns out the transitivity intuition attaches to both notions equally, I want to know that's a real possible outcome and not a fudge). And give me a realistic sense of scope — is this a two-year project or am I fooling myself, and what's the piece of it I could safely carve off if it turns out too big? Don't bother with citations or a literature review, I'll fill those in myself; just talk about positions and arguments.
