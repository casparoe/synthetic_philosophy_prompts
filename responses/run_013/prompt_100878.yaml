prompt: |-
  Ok so my friends and I do this thing every week -- we each write down a yes/no guess about whether our local team wins on the weekend, then whoever's in the majority "takes" the round and the rest of us buy them coffee. Eleven of us play. My buddy Dev is convinced we basically cant be wrong: with that many people, he says, the majority has to land on the truth way more often than any one of us alone could, and the more of us who play the safer it gets. I kinda want to beleive him but something about it itches.

  Couple things that maybe matter and I can't tell if they do. One, almost all of us get our info from the same two group chats and the same guy's podcast, so our guesses tend to move together -- when that podcaster is high on the team, like eight of us write "yes". Two, we've got Marcus, who I'm pretty sure has been worse than a coin flip for two straight years (he picks whoever's got the cooler uniforms). Dev says none of that touches his point, more people is still more reliable. Is he right? Can you help me see when a majority of people guessing is actually good evidence they've got it right, and when it's basically worthless -- i.e. what has to be true for the whole "the majority is smarter than any one of us" thing to hold at all, and how badly it falls apart when those things aren't true? Not after a formal proof, just enough to actually settle this with him.
reasoning: |-
  Okay, the user is part of a group of eleven friends who each predict whether their local team will win each week. The majority guessers get coffee bought for them by the others. Dev believes that with more people, the majority is almost always right because more people should lead to better collective judgment. The user is skeptical because their guesses aren't independent (they all use the same sources) and there's Marcus who's worse than random.

  First, I need to recall the Condorcet Jury Theorem. It states that if each voter has a better than 50% chance of being correct, and they vote independently, then as the group size increases, the probability that the majority is correct approaches 100%. The user's group has eleven people, so if everyone were independent and slightly better than random, the majority should be right most of the time.

  But the user mentioned two issues: dependence and an incompetent member. Dependence means their guesses aren't independent; they all follow the same podcast or group chats. If those sources are biased or wrong, everyone could be wrong together. Marcus being worse than a coin flip (less than 50% accuracy) also hurts, especially if he's part of the majority when he's wrong.

  So the key here is that Dev's assumption relies on two conditions: individual competence (each person better than 50%) and independence. If either is violated, the theorem doesn't hold. The user needs to understand when the majority is reliable and when it's not.

  The user's itch probably comes from sensing that their group isn't independent. Since they all listen to the same sources, if the podcast is wrong, most of them will be wrong. Marcus being consistently bad could drag down the group if he influences others or if his wrong vote aligns with the majority when it's incorrect.

  I should explain that without independence, the group's collective accuracy might not be much better than an individual's. If everyone is copying the same source, the group is no better than that source. Adding more people who follow the same info doesn't add new information; it just amplifies the existing bias.

  For Marcus, if his accuracy is below 50%, he's more likely to be wrong. In a majority vote, if many members are like Marcus, the group could be worse than random. But even one such member reduces the overall probability if others aren't compensating.

  The user might need a simple way to explain this to Dev. Using analogies like the group being an amplifier: if the input (shared sources) is good, it's helpful; if bad, it's harmful. Or a chain being only as strong as its weakest link, but more about correlated errors.

  Also, the user mentioned they want to know when the majority is good evidence and when it's worthless. So summarizing the necessary conditions: independence and individual competence above 50%. When these are met, more people help. When not, especially with dependence, adding people doesn't improve accuracy and can make it worse.

  I should address Marcus specifically. If Marcus is below 50%, but others are above, it might still work if the average is above 50% and they're independent. But with dependence, Marcus's inaccuracy might not matter as much because everyone is moving together anyway. However, if Marcus is independent, his poor judgment could sway the vote when he's wrong.

  The user probably wants practical advice. Maybe suggest that if their group uses diverse sources, the majority would be more reliable. But since they don't, the current setup isn't as robust as Dev thinks. They could track their predictions' accuracy to see if the majority is actually better than individuals.

  In conclusion, Dev is right only if the conditions are met. But in their case, with high dependence and possibly varying competence, the group's majority isn't necessarily wiser. The user's skepticism is valid.
answer: |-
  I love this setup, and your itch is spot-on—Dev's belief is based on a *very specific ideal case* that doesn't hold up in your real-world scenario. Let's break this down simply.

  ### The Core Idea (Where Dev Gets It From)
  Dev is channeling the **Condorcet Jury Theorem**. It says that if:
  1.  **Each person has *better than 50%* accuracy** on their own (even just 51%),
  2.  **Their guesses are *independent*** (they aren't copying each other or the same flawed source),
  3.  **They vote sincerely** (they write down their true best guess),

  ...then as you add more people:
  *   The probability that the *majority* gets it right **increases dramatically**.
  *   With enough people, it gets **extremely close to 100% certainty**.

  **In this perfect world, Dev is right:** 11 independent, slightly knowledgeable people would be *way* more reliable than any one person. Adding more *would* make it safer.

  ### Why Your Reality Itches (Where It Breaks Down)
  Your group breaks *both* critical conditions:

  1.  **You Lack Independence (The Big Killer):**
      *   You all use the *same* group chats and podcast. This means your guesses **aren't independent decisions**. They're **highly correlated**.
      *   **Why this destroys the "wisdom of crowds":**
          *   Think of it like amplifiers. You're not adding 11 *different* signals; you're amplifying *one or two signals* 11 times. If that podcast/chat is wrong (which it sometimes will be), **most of you will be wrong together**. Your errors pile up instead of canceling out.
          *   The group's accuracy becomes **no better than the accuracy of your shared information sources**. If the podcast is right 60% of the time, your majority will also only be right ~60% of the time, *even with 11 people*. Adding more people who listen to the same podcast won't budge this number.
          *   **Result:** Instead of the group being *smarter* than any individual, the group becomes *exactly as "smart" as your shared bubble of information*. If that bubble is biased or wrong, the majority is wrong.

  2.  **Marcus (and Others?) Are Below 50% (The Secondary Problem):**
      *   Marcus being consistently worse than a coin flip (<50% accuracy) *on his own* is bad.
      *   **Why it hurts, but less than dependence:** If everyone was truly independent, one Marcus-level player (say 40% accuracy) wouldn't sink the group *if* the others are decent (say 60%). The good players *could* still outweigh him. But...
      *   **The Killer Combo:** Marcus is *also* likely getting his bad info from the *same* chats/podcast! This makes his poor accuracy **correlated** with everyone else's. He's not an independent bad guesser; he's part of the collective bubble. When the podcast is wrong, Marcus is *extra* wrong, and he's pulling the votes of others who are also influenced by the same source. He makes the correlated errors *worse*.

  ### When the Majority is Actually Good Evidence (The Dream Scenario)
  The majority vote is powerful evidence **only when**:
  *   **Voters are independent:** They get their information from diverse sources, think for themselves, and aren't just copying a leader or a single news feed.
  *   **Voters are (on average) competent:** Most individuals have *at least* a slight edge over random guessing (>50% accuracy).
  *   **(Bonus) The question has a knowable answer:** It's about something where evidence and reasoning *can* lead to a better guess (like a football game with stats and analysis), not pure luck.

  ### When the Majority is Basically Worthless (Your Scenario)
  The majority vote tells you little to nothing **when**:
  *   **Votes are highly correlated:** Everyone is swayed by the same bias, rumor, charismatic leader (or podcast!), or piece of misinformation. **This is your main issue.**
  *   **Voters are systematically incompetent:** Most individuals are worse than random (<50%) *and* their errors are correlated.
  *   **The "average" competence is below 50%:** Even if independent, if the group as a whole is clueless (average accuracy <50%), adding people makes the majority *worse*.

  ### So, Is Dev Right for *Your* Group?
  **No.** His core idea (wisdom of crowds) is mathematically sound *in theory*, but your group violates the essential conditions that make it work:
  1.  **Dependence is the Death Knell:** Your shared information sources mean you don't have 11 independent votes; you have essentially 1-2 votes amplified. The group's accuracy is capped by the quality of that podcast/chats, not improved by adding more listeners.
  2.  **Marcus is Symptomatic, Not the Cause:** Marcus alone isn't the main problem, but he's a sign of the dependence issue (he gets his bad info from the same place) and makes correlated errors worse.

  **In your current setup, adding more people who use the same sources *doesn't* make the majority "safer" or "more reliable." It just makes the same mistake louder.** You could have 101 people all listening to the same podcast, and if the podcast is wrong, 80 of you will be wrong together.

  ### How to Settle This (Without Math)
  1.  **Track it!:** For the next 5-10 games, secretly note:
      *   What the podcast/chats predicted.
      *   What each person predicted.
      *   What the *majority* predicted.
      *   What the actual outcome was.
      Compare: How often was the *majority* right vs. how often was the *podcast* right? They'll likely be nearly identical. How often was the majority right vs. your *own personal* accuracy? It probably won't be significantly better.
  2.  **The Amplifier Analogy:** Ask Dev: "If our shared podcast is like a speaker, and each of us is just a microphone repeating that speaker, how does adding more microphones make the *message* more accurate? If the speaker is wrong, all the mics are just amplifying the same wrong message louder."
  3.  **The Chain Metaphor:** "The group's accuracy isn't a chain made stronger by adding links. It's more like 11 links all hooked to the *same* anchor (the podcast). If that anchor is solid, great. If it drags us down, we all sink together. Adding more links to the same anchor doesn't help."

  **The bottom line:** Dev's intuition relies on magical independent thinkers. Your group is a collective echo chamber. For the majority vote to be meaningfully smarter, you'd need people using *different* podcasts, doing their *own* research, or bringing genuinely unique perspectives. Until then, your weekly coffee ritual is more about shared enthusiasm (and who buys coffee) than tapping into some profound collective wisdom. Keep the tradition – it sounds fun! – but don't fool yourselves that the majority is a crystal ball.
