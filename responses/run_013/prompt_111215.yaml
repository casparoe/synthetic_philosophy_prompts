answer: |-
  ### Criteria for Adequate Explanation
  An adequate explanation of norm evolution must account for five core features: (1) **arbitrary content** (norms are functionally equivalent alternatives), (2) **local stability** (robustness to minor perturbations within cohorts), (3) **cross-community variation** (divergent norms under similar conditions), (4) **sudden collapse** (breakdown from demographic/contextual shocks), and (5) **decentralized change** (emergence/shifts without central enforcement). Crucially, it must also explain the **inheritance illusion**—false beliefs in deliberate historical choice that stabilize norms inefficiently sustained today.

  ### Tiered Ranking of Theoretical Resources  
  **Tier 1: Would trust to predict**  
  - **David Lewis's account of convention**: Directly explains arbitrary content and stability via self-reinforcing expectations, matching the conditional preference structure.  
  - **Evolutionary game theory and replicator dynamics**: Models how random variation and payoff-driven selection fix arbitrary equilibria, predicting cross-group variation and drift.  
  - **Conformity bias in cultural transmission**: Explains fidelity of norm replication (including false origin stories) via preferential adoption of majority behaviors.  
  - **Norm psychology**: Innate guilt/enforcement dispositions make norms feel obligating, sustaining the illusion of inherited commitment.  
  - **Path dependence and lock-in**: Accounts for persistence of suboptimal norms due to sunk costs and coordination thresholds, explaining why they wouldn’t be chosen anew.  
  - **The inheritance illusion itself as a causal stabilizer**: The false belief in historical consent *does* explanatory work by enhancing perceived legitimacy and compliance.  

  **Tier 2: Useful but incomplete**  
  - **Schelling focal points**: Complements Lewis by explaining initial selection of arbitrary norms via salience, but doesn’t address intergenerational transmission or collapse.  
  - **Third-party punishment**: Explains stability against free-riders in moralistic norms, but overkill for trivial conventions (e.g., kitchen rules); pair with norm psychology.  
  - **Random drift**: Necessary for modeling neutral change and variation, but insufficient alone without selective pressures (complements evolutionary game theory).  

  **Tier 3: Mostly redescribes the phenomenon**  
  - **Costly signaling**: Redescribes adherence as status-seeking but fails for non-prestige norms (e.g., kitchen cleaning); misleading if applied universally. *Drop for this case.*  
  - **Cultural group selection**: Overly macro; doesn’t predict micro-level dynamics like sudden collapse in small groups.  
  - **Norm entrepreneurs**: Irrelevant for organically evolved norms without deliberate advocacy; better for moral revolutions.  

  **Tier 4: Misleading if used alone**  
  - **Repeated-game folk theorems**: Misapplied here—norms like kitchen rules aren’t strategic cooperation problems with defection risks. *Drop.*  
  - **Legal centralization**: Contradicts the decentralized enforcement criterion; formalizes but doesn’t explain informal norm origins.  
  - **Prestige bias**: Less relevant than conformity bias; the illusion doesn’t require high-status influencers.  

  ### Complementary/Competing Items  
  - **Complementary**: Lewis + Schelling + evolutionary game theory + conformity bias form a core cluster for emergence/selection/transmission.  
  - **Competing**: Drop costly signaling and folk theorems; they mischaracterize the target as strategic or prestige-based when it is coordinative and arbitrary.  

  ### Further Questions  
  1. **Single item to keep**: **Norm psychology**. Without innate mechanisms for acquiring and enforcing norms as objective obligations, the inheritance illusion (and its stabilizing power) couldn’t arise.  

  2. **Best combination**: **Norm psychology + conformity bias + the inheritance illusion as stabilizer**. This trio covers:  
     - *Acquisition/enforcement* (innate dispositions),  
     - *Fidelity of transmission* (conformity copying false origin stories),  
     - *Stability mechanism* (false beliefs amplifying perceived legitimacy).  

  3. **Evidence forcing revision**: If norms *changed rapidly without compositional shifts* or *persisted without false origin stories*, Tier 1’s focus on cognitive biases and illusion would weaken. Empirical proof of spontaneous central enforcement in trivial norms would challenge the decentralization criterion.  

  ### Confidence Assessment  
  - **Overall confidence**: High (8/10). The ranking prioritizes mechanisms matching the phenomenology of arbitrary, illusion-stabilized norms.  
  - **Least sure point**: Tier 2 placement of third-party punishment. If minor disapproval (e.g., frowns) suffices even in trivial norms, it might belong in Tier 1; but the kitchen example suggests it’s negligible.
