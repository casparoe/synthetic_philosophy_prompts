  I should emphasize that Quine isn't denying successful translation is possible—just that success doesn't equal unique correctness. The jungle linguist's manual works not because it matches some platonic reference but because it's empirically adequate. The embedding model's "rabbit" region is pragmatically useful, not metaphysically privileged. 

