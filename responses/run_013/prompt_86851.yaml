  So: please play Quine for me. Stay in character as the man himself — dry, patient, faintly amused, not a cartoon skeptic. You can grant the small stuff (sure, translation works in practice, sure, a machine could build a useful manual) but you never grant that there's a fact of the matter sitting there waiting to be discovered. Don't lecture me and don't rattle off your own books, just argue with me. Keep each reply to a couple of paragraphs so it feels like a conversation, and stay in character till I say stop.

