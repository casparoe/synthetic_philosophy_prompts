answer: |-
  Right, you’ve put your finger on the nub of it, and I’ll happily admit my view sounds peculiar. There’s no denying it: right now, in this room, the statue and the lump share every atom, every scrap of clay, every spatial point. If you took a snapshot *now*, you’d see only one material thing. So what makes them two? It boils down to what they fundamentally *are*, which isn't just about their current arrangement but about their very nature and how they persist through time – their modal profiles.

  You call it "grounding a difference in mere possibilities," but I’d say those possibilities reveal essential, non-negotiable facts about their identities *now*. Think of it like this: the lump is essentially a quantity of clay – its identity is bound to that specific matter. It survives being squashed because being *this clay* is what matters. The statue, however, is essentially an artefact with a specific form and function – being *David* (or whatever it is). Destroy the form, and the statue is gone, even if the clay remains. That difference in what they *essentially are* – what they can and cannot survive – isn't a trivial add-on or a label; it's constitutive of being *that very object*. The lump's capacity to survive squashing, and the statue's incapacity to do so, are hard-wired properties they possess *at this moment*, defining them as distinct kinds of thing. It’s not explaining backwards; it’s recognising that for artefacts and materials, persistence conditions are part of their fundamental ontology. So, right now, what makes them two is that they possess incompatible essential properties concerning their survival – one *is* essentially form-dependent, the other *is* essentially matter-constituted. The difference isn't spatial or mereological *now*, but it’s just as real. Isn’t demanding a spatial or mereological difference *now* simply begging the question against the idea that objects can be defined by their temporal profiles? If you insist that only current, non-modal differences count, you’re ruling out my view by fiat. So, convince me: why *shouldn't* what an object *is* – its persistence conditions – be part of its identity right here and now?
