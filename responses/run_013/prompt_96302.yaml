  Based on Nadia's prior verdicts and the principles that underpin them, I'll break down the machinery behind her judgments, apply it to your case, predict her verdict, and suggest a follow-up case to test the rules. Nadia's framework appears to draw from game theory and collective action problems, focusing on **incentives, unilateral escape options, and coordination mechanisms**. Below is a step-by-step analysis.

