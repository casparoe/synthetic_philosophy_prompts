  1. **Suboptimal outcome for everyone**: The collective outcome is worse than what could be achieved by cooperation.
  2. **Incentive to defect**: Each individual has an incentive to act in a way that harms the collective if others do not cooperate (or if they do, then they are vulnerable to being taken advantage of).
  3. **Lack of coordination or enforcement mechanism**: There is no way to bind everyone to the cooperative outcome.

