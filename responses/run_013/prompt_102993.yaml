prompt: |-
  I teach at a big public high school and I write somewhere around seventy college rec letters a year, which means I spend every October making character claims I'm not sure I'm untitled to make -- X is honest, X is a natural leader, X is kind -- on the basis of having watched a kid for maybe ninety minutes a day in one room, most of it while they were doing algebra. Last spring I read a pile of stuff on the situationist critique of virtue ethics for a book group and it wrecked me a little: the seminarians who hurried past a man slumped in a doorway because they'd been told they were late for their talk, the people who stopped to help a stranger pick up spilled papers just because they'd found a dime in the payphone a minute before. If stuff like that moves behavior around that much, what exactly am I asserting when I say a seventeen-year-old is honest? I've also seen the counterpoint that the critique doesn't kill character talk, it just forces you to shrink the unit of assessment -- from global traits to traits indexed to a kind of situation, and that personality predicts behavior much better in weak situations where nobody's telling you what to do than in strong ones where the script is obvious.

  What I want is a procedure I can actually run in the twenty minutes I get per letter, something my department head could look at and sign off on and that an admissions reader would find fair. Please turn the situationist critique into a checklist: the questions to ask in order before I'm allowed to put a character claim on paper, what counts as enough evidence for each, when the honest move is to just describe the behavior and let the reader infer the trait, and where the procedure has to stop and hand it back to my judgment because it's a values question about how much risk of overclaiming is acceptable. Constraints: no psychological testing, I can't poll other teachers, I only ever see these kids in my own classroom plus whatever club I advise, and I can't just write vague mush -- the letters have to actually say something.

  Give it to me as a numbered list of exactly five items, each one to three sentences, no intro and no wrap-up. Items one through three are the procedure's stages, in the order I'd run them. Item four runs it on two cases: a kid who cheated once in a class that was obviously too hard for them and has been spotless since, and a kid who is lovely in my room but who I have only ever seen in my room. Item five is the case where the procedure tells me something I won't want to hear, plus an honest statement of what the procedure can't do.
reasoning: |-
  Hmm, the user is a high school teacher who writes a lot of recommendation letters and is grappling with the ethics of making character claims after learning about situationist critiques of virtue ethics. They want a practical, time-efficient checklist to justify character assertions in recommendations, with constraints like no testing or polling others. The situationist critique shows that behavior is heavily influenced by context—like those seminary students ignoring someone in need because they were rushed—so claiming traits like "honesty" based only on classroom observation might be unreliable.

  The user's explicit request is for a five-item numbered list: three procedural steps, two case applications, and limitations. But their deeper need seems to be reducing moral discomfort while maintaining credibility. They're worried about overclaiming but must write substantive letters, not vague ones. The solution should balance ethics with practicality, shrinking assessment units per the counterpoint they mentioned—focusing on situation-specific traits rather than global ones.

  For the checklist structure, I'm thinking the first three items should form a sequential procedure: start by identifying the trait and its situational relevance, then gather evidence from weak situations (where scripts don't dictate behavior), and finally assess consistency while noting limits. This draws from psychology—weak situations reveal more about personality because there's no strong external pressure.

  For item four, applying it to cases: the kid who cheated once could be framed with situational factors (e.g., high stress) and subsequent spotless record, suggesting honesty in typical settings but not extreme ones. The kid only seen in one room requires sticking to observed contexts, avoiding broad claims. This addresses their fear of misrepresenting limited data.

  Item five should handle cases where the procedure flags overclaiming risk, like when evidence is thin. It must acknowledge that judgment is still needed for risk tolerance—values can't be outsourced to a checklist. Also, admit the procedure can't predict behavior in unobserved scenarios, which is crucial for honesty.

  Constraints are tight: 20 minutes per letter, no extra resources. So steps must be fast—e.g., quick mental scans for behavioral examples rather than deep dives. The goal is actionable rigor, not perfection. Finally, the tone should be direct and reassuring, validating their concerns while providing a workable tool.
answer: |-
  Here is the five-item checklist:

  1.  **Define the trait narrowly and situationally:** Before claiming any trait, specify the exact classroom/advising context where you observed it (e.g., "demonstrates intellectual honesty during calculus discussions"). Do not claim global traits like "honest person" based solely on school behavior.
  2.  **Require evidence from "weak situations":** Only assert the trait if you can cite at least two specific, unscripted instances where the student *chose* the behavior despite clear alternatives or minimal oversight (e.g., correcting a grading error in their favor during independent work, initiating help for a struggling peer without prompting). Rule out behaviors mandated by rules or strong social scripts.
  3.  **Note consistency and limits:** State how often you've observed the behavior in relevant situations ("consistently" vs. "on several occasions"). Explicitly note key contexts you *haven't* witnessed them in (e.g., "I have not observed their conduct under high academic pressure outside my class" or "My observations are limited to our math club meetings").
  4.  **Apply to cases:**  
      *   **Cheating case:** Describe the incident factually, note the situational stress, state their spotless record *in your class since*, then claim only "has consistently demonstrated academic integrity *in my classroom* following that isolated incident." Avoid claiming global honesty.
      *   **Lovely in one room case:** Claim only traits demonstrably shown *in that specific context* with evidence (e.g., "engages respectfully during classroom discussions"). Add: "My assessment is limited to their behavior in my classroom/club; I cannot speak to their conduct in significantly different settings."
  5.  **Acknowledge procedure limits and judgment:** If step 2 yields insufficient "weak situation" evidence, the procedure dictates you describe specific positive behaviors *without* inferring a stable trait. You must then judge whether that description meets the letter's needs or feels insufficient. The procedure cannot eliminate the risk of overclaiming or predict behavior in unobserved contexts; it only structures and limits your inferences based on your constrained view.
