prompt: |-
  Next month it's my turn to run my building's reading group — six people, mostly engineers plus one lapsed philosophy PhD who's going to make trouble — and I've picked Wittgenstein on family resemblance and language games. I don't want you to explain the material to me, I've read it. I want the teaching plan: the order the pieces have to go in and why (what actually depends on what), the one example that carries the whole thing, the misconceptions these people will walk in with or generate, and the precise point in the sequence where each one gets headed off. Plus a single closing question that tells me whether the idea landed rather than whether they can recite it. No reading list, obviously — they won't do it anyway.

  The bit I'm stuck on is the carrier. The obvious move is the word 'game' itself, with the board-game / card-game / Olympic-game pile-up, but my worry is that everyones read the Wikipedia version and will cheerfully agree there's no common thread while privately still thinking there's a real definition out there we just haven't found yet. So: is 'game' still the right example, and if so what does the sequence have to do to it to stop it being a nod-along? If not, what should carry it? My candidates are 'spoiler' (is a trailer one? is the fact that it's a sequel one? the runtime?) and 'bug' in software ('it's not a bug, it's a feature'). Tell me what the carrier needs and what it must not have — I suspect a case that's too obviously vague teaches the wrong lesson, and a case with no stakes teaches nothing at all.

  Misconceptions I expect, in the order I expect them, though I could be wrong about the order: that family resemblance is just a disjunctive checklist, i.e. there is an essence after all and it's a big OR; that it's a psychological claim about prototypes rather than a claim about concepts; that if there's no essence then anything goes and it collapses into whatever we happen to say it is; and that 'language game' means a game played with words, like charades. They'll also want to know who decides, and I want that question to arrive at the right moment rather than eat the first ten minutes.

  Last thing: what do I explicitly refuse to do at this level and announce that I'm refusing? (I assume the rule-following stuff and the private language argument, but you tell me.) And where does the essence-demanding instinct — the Socratic what-is-X question — have to come in? I think they need to feel the pull of it before the shift can land at all, but maybe I'm wrong and it just makes them dig in.

  Hard cap 600 words, no bullet points please — I want the dependency structure argued, not listed.
