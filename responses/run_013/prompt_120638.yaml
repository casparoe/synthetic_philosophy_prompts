answer: |-
  Here’s the teaching plan, structured by conceptual dependencies and battle-tested against your group’s likely misconceptions. The carrier example is critical, so we’ll start there.

  ### The Carrier: "Bug"
  Abandon "game" — it’s a Trojan horse for essence-thinking. Use **"bug" in software engineering** instead. Why? It has **stakes** (time, money, reputations), **context-driven ambiguity** ("feature" vs. "bug" hinges on user intent, spec interpretation, or system constraints), and **no safe disjunction** (a security flaw vs. a UI glitch share no core "bugginess"). Crucially, engineers *feel* its instability. It forces the question: *When does a disagreement about "is this a bug?" become more than semantics?*

  ### Sequence & Why:
  1. **Hook with Socrates (10 mins):**  
     Open with: *"What is a bug? Give a definition that covers every case."* Let them struggle. They’ll generate edge cases (undocumented behavior, hardware failure, UX nitpick). This makes them *feel* the essence-demanding instinct. **Why now?** They must confront the failure of definition-by-necessary-conditions before family resemblance makes sense. *Preempts:* Early "who decides?" by showing definitions collapse internally.

  2. **Introduce Family Resemblance via "Bug" (15 mins):**  
     Map their edge cases: some share "unintended behavior," others "causes crash," others "violates spec," but *no single thread* connects all. Stress: **It’s not a checklist (OR)**. A bug isn’t "crash OR spec violation OR..." because some bugs have none (e.g., inelegant code that works). It’s a network of overlapping similarities, none universal. *Preempts:* "Disjunctive essence" by showing OR fails (some bugs lack any item). *Preempts:* "Psychological prototypes" by noting: even atypical bugs (e.g., a "cosmetic" issue) belong if tied by *some* resemblance to the cluster.

  3. **Pivot to Language Games with "Bug" in Action (15 mins):**  
     Ask: *"When does your team call something a bug? During testing? Sprint review? User complaints?"* Highlight how the *criteria shift*:  
     - Tester: "Breaks test case → bug."  
     - Developer: "Works per spec → not a bug."  
     - Product: "User hates it → bug."  
     **Language games** are these context-bound rule-sets. The meaning of "bug" *is its use* in a practice. *Preempts:* "Anything goes" by showing rules constrain usage (you can’t call a typo a "bug" in a compiler error discussion). *Preempts:* "Charades" misconception by stressing *practices* (debugging, prioritizing) not wordplay.

  4. **The Stakes of "Bug" (10 mins):**  
     Case: A performance lag is "not a bug" per spec but users revolt. Ask: *"Does it become a bug when the CEO complains? Why?"* This shows concepts evolve *within practices* under pressure. Essence-seekers will squirm — good. **Key point:** Shifting criteria aren’t arbitrary; they respond to the game’s goals (e.g., "keep users"). *Preempts:* Residual essence-thinking by making negotiation visible.

  ### Closing Litmus Test:
  *"Describe a disagreement you’ve had where calling something a 'bug' (or similar term) wasn’t about facts but about which language game you were playing."*  
  If they can reframe a conflict as clashing contexts/rule-sets, it landed. Recitation would sound like: "A bug has no essence."

  ### What to Refuse:
  Announce upfront: *"We’re bracketing rule-following and private language — they’re downstream of tonight’s groundwork."* This avoids the philosophy PhD derailing into §§201-293 of *PI*.

  ### Why This Works:
  "Bug" makes the tension visceral. Engineers live its fluidity but crave essence. The sequence forces them from Socratic despair ("What *is* it?") to Wittgenstein’s insight: meaning isn’t unearthed but *forged* in shared action. The PhD gets stakes they can’t dismiss as trivial.
