prompt: |-
  I'm a TA for a graduate seminar on machine ethics, and I need to draft one of the essay questions for the final. The reason I'm asking rather than just writing it myself is that my roommate works on ML safety and we got into this long fight last night that I can't stop chewing on. His line is that "implementing ethics in a machine" is basically a solved-shaped problem: you collect a big pile of human moral judgments, you train a model to predict them, and if it generalizes well enough you've got a machine that reasons ethically. My line is that this is a category error, but every time I try to say why I end up gesturing at the rules-versus-learning distinction or dredging up a trolley case, and both of those are exactly the answers I don't want on the exam because students have them memorized. What actually bugs me is something narrower: a system trained to match human approval is optimizing for approval, not for the good, so the better it gets the more it will track what people will sign off on — which is sycophancy wearing the mask of ethics — and it'll have nothing to say on cases where the training signal is silent, the genuinely unprecedented ones. And here's the part I want to smuggle into the question: there's an old debate in ethics about whether someone who just outsources every moral call to a reliable authority is really doing moral thinking or only ventriloquizing it, and I think that's the sharpest way to press my roommate's view, because it forces you to say what "grasping a reason" adds over being disposed to output the right verdict. But I don't want to just hand students the analogy pre-chewed either.

  So: write me one essay question for this seminar — upper-level grad students, they've read the standard stuff — that makes them confront whether a system that reliably produces correct moral verdicts by tracking human approval can be said to reason ethically at all, or only to imitate ethical reasoning, and that forces them to get specific about what would have to be true of a machine for us to credit it with grasping a reason rather than merely being disposed to emit the verdict. It should make them take a position on whether the moral-deference analogy holds and, if it does, exactly where it breaks when the deferring agent is a network rather than a person. And it should force them to say something concrete about the unprecedented case — what a system that only tracks approval can and can't do when there's no precedent to match, and whether that gap is a bug you patch with more data or a structural limit. No bibliography, no names-and-dates recitation, and please don't let it be answerable by reciting the top-down-rules vs. bottom-up-learning taxonomy. Then give me a model answer and a marking scheme: the model answer no more than 600 words, and the scheme built around five must-hit moves with marks that total 20, plus a one-line note on how students typically get each one wrong, and a clear statement of what separates an A from a B. Keep the whole thing under about 1300 words total.
reasoning: |-
  Okay, let me tackle this TA's request. They need an essay question for a grad seminar on machine ethics that digs into whether AI systems trained to predict human moral judgments are actually reasoning ethically or just imitating it. The core tension is between their roommate's "solved-shaped problem" view and their own concern about sycophancy versus genuine moral understanding.

  First, I need to identify the key philosophical angles they want explored. The moral deference analogy is central - comparing AI systems to humans who uncritically follow authorities. The unprecedented cases matter too, where the system faces novel dilemmas without training data. And crucially, we must avoid rehashing the tired rules-vs-learning debate or trolley problems.

  Hmm... the question should force students to articulate what "grasping reasons" means beyond outputting correct verdicts. Maybe frame it as a paradox: the better the system gets at matching approval, the less it might actually understand ethics. That's the sycophancy risk they mentioned.

  For structure, I'll design a prompt with three parts: 
  First, analyze the moral deference parallel - does it hold for AI? 
  Second, address the unprecedented case gap - is it fixable with data? 
  Third, specify what would demonstrate genuine reason-grasping in a machine. 

  The model answer should mirror this while staying under 600 words. Key moves: 
  1) Distinguish approval-tracking from reason-tracking 
  2) Apply the moral deference critique to AI 
  3) Analyze the structural limit of unprecedented cases 
  4) Propose concrete markers of reason-grasping 
  5) Take a clear stance on whether the analogy holds

  Common pitfalls to flag in marking: students might confuse this with rules-vs-learning, or reduce "understanding" to statistical generalization. The A/B differentiation should hinge on whether they recognize sycophancy as inherent to the approach, not just a technical flaw.

  For the unprecedented cases part, I'll emphasize that more data can't solve truly novel dilemmas - it's a categorical limitation. The best answers should connect this to how human moral reasoning handles novelty through principles rather than precedents.

  Let me sketch the question wording carefully... need to avoid leading them to prechewed answers while still setting up the key conflict. Phrases like "merely imitative" and "reliably predicts" will prime the debate. Specifying "concrete functional markers" prevents handwaving about understanding.

  The roommate's view deserves fair representation too - the prompt should allow students to defend the prediction-based approach if they can show how it might capture reason-grasping. But the model answer will demonstrate the stronger critique.

  Final polish: the marking scheme needs precise descriptors for each scoring tier, especially distinguishing B-grade "adequate recognition" from A-grade "systematic articulation" of the structural flaws. Time to compose...
answer: |-
  Below is a comprehensive essay prompt, model answer, and marking scheme designed to meet your specifications. It targets the core philosophical tension you described while avoiding rehearsed arguments.

  ---

  **Essay Question**  
  *Critique the following claim: “A machine learning system trained to predict human moral judgments with high accuracy can be said to engage in ethical reasoning, provided it generalizes robustly to novel cases.” In your response, address the following:  
  (a) Does such a system merely *imitate* ethical reasoning by optimizing for approval, or does it genuinely *grasp moral reasons*? Use the analogy of a human who defers all moral decisions to an authority figure to sharpen your distinction.  
  (b) How would this system handle a *genuinely unprecedented* moral dilemma (i.e., one with no meaningful parallels in its training data)? Is this limitation fixable by scaling data, or is it structural?  
  (c) Specify *three concrete functional markers* that would distinguish a machine that “grasps moral reasons” from one that only emits approval-optimizing verdicts, even if their outputs coincide in practice.*  

  ---

  **Model Answer** (589 words)  

  The claim confuses *correct output* with *ethical reasoning*. A system trained to predict human moral judgments optimizes for **syndicated approval**: it maps inputs to verdicts that align with aggregated human responses. This is imitation, not reasoning. Ethical reasoning requires **grasping justifications**—understanding *why* an act is right/wrong—whereas approval-tracking systems merely correlate features with endorsed outcomes. The analogy to human moral deference clarifies this: a person who blindly obeys a moral authority (e.g., a religious leader) emits “correct” verdicts but fails to engage with reasons. Their correctness is **contingent and non-agential**; it dissolves when faced with novel dilemmas the authority hasn’t addressed. Similarly, an approval-optimizing AI’s “correctness” depends on historical human responses, not principled engagement.  

  This structural limitation manifests acutely in unprecedented cases. Suppose an AI confronts a dilemma involving emergent technologies (e.g., neural rights in brain-computer interfaces) with no training-data analogues. An approval-trained model must either: (i) **extrapolate incorrectly** by overfitting to superficially similar cases, or (ii) **output null/arbitrary responses** due to signal absence. Scaling data cannot resolve this because unprecedented dilemmas, by definition, lack precedents. The gap is **constitutive**: approval-tracking systems lack machinery to *generate* justifications absent training signals. They are moral oracles, not moral agents.  

  To credit a machine with grasping moral reasons, we must require functional markers beyond output accuracy:  
  1. **Counterfactual Sensitivity**: The system adjusts verdicts when given new moral information (e.g., “If harming X also prevents genocide, is it permissible?”), showing its outputs depend on *reasons* rather than fixed patterns. Approval-trackers freeze when inputs deviate from training distributions.  
  2. **Justification Transparency**: The system articulates *non-circular principles* for its verdicts (e.g., “This violates autonomy because…”), not post hoc rationalizations mirroring training labels.  
  3. **Consistency Under Principle Perturbation**: If a core principle is explicitly altered (e.g., “Assume utilitarianism is false”), outputs cohere with the new framework. Approval systems remain anchored to training labels.  

  The moral deference analogy holds precisely because both the AI and the deferring human reduce morality to *source compliance*. It breaks when considering *how* humans gain independent reasoning: by internalizing principles to navigate novel cases. An approval-trained AI cannot do this; it is a statistical mirror. Thus, while such systems might be useful tools, they confound **epistemic competence** with **social mimicry**. Genuine ethical reasoning in machines requires architecture capable of representing and refining justifications—not merely matching verdicts.  

  ---

  **Marking Scheme** (Total: 20 marks)  
  **Must-hit moves** (4 marks each):  
  1. **Distinguish approval-tracking from reason-grasping**  
     - *Award 4 marks*: Explicitly contrasts optimizing for social endorsement vs. engaging with justifications.  
     - *Common error*: Equates statistical generalization with understanding.  
  2. **Leverage moral deference analogy**  
     - *Award 4 marks*: Uses the analogy to show that correctness ≠ reasoning; explains why deference voids agency.  
     - *Common error*: Treats the analogy as incidental rather than foundational to the critique.  
  3. **Diagnose unprecedented cases as structural limitation**  
     - *Award 4 marks*: Argues data scaling fails for *genuinely* novel dilemmas; identifies extrapolation/null-response risks.  
     - *Common error*: Suggests “more diverse data” as a solution.  
  4. **Propose functional markers for reason-grasping**  
     - *Award 4 marks*: Specifies 3+ concrete, testable capabilities (e.g., counterfactual sensitivity) beyond output accuracy.  
     - *Common error*: Vague appeals to “understanding” or “consciousness.”  
  5. **Take a stance on the analogy’s validity/relevance**  
     - *Award 4 marks*: Explicitly states if/when the deference analogy holds or breaks for AI; links to structural limits.  
     - *Common error*: Ignores whether the analogy applies to machines.  

  **Grading Standard**:  
  - **A (17–20)**: Systematically addresses all five moves; uses the analogy to *advance* the argument; precise on structural limits; markers are novel and functional.  
  - **B (13–16)**: Hits moves but with gaps (e.g., vague markers); adequate critique but misses nuance in analogy/unprecedented cases.  
  - **C (9–12)**: Superficial treatment; conflates approval/reasoning; misapplies analogy; proposes technical fixes for structural limits.  
  - **D/F (<9)**: Fails to engage core tension; rehashes rules-vs-learning or trolley problems.  

  ---

  **Rationale for Design**:  
  - The prompt’s tripartite structure forces engagement with your core concerns: *deference* (a), *unprecedented cases* (b), and *reason-grasping criteria* (c).  
  - The moral deference analogy is integrated but *not* pre-chewed; students must apply it to AI and specify where it holds/breaks.  
  - "Functional markers" in (c) blocks hand-waving about "understanding" by demanding concrete, observable behaviors.  
  - The model answer exemplifies an A response: it rejects the claim surgically, uses the analogy pivotally, and offers non-trolley examples (neural rights, principle perturbation).  

  This approach ensures students wrestle with the sycophancy problem and the gap between statistical correlation and normative competence—precisely the knife-edge you want them on.
