  I'm a backend dev, never studied philosphy formally, but I've fallen down a rabbit hole after reading about Schrödinger's weird obsession with Vedanta. Not the cat thing, the other stuff — the idea that there's only one conciousness and the feeling of being a separate self is basically a glitch. Anyway, I rewatched Cloud Atlas last night and it got me thinking. The film uses the same actors across six different stories, and there's that comet-shaped birthmark that keeps showing up, and the whole thing ends with a voiceover about how our lives aren't our own and we're bound to each other. On the surface it feels like it's saying the same thing as Schrödinger: that the separate selves are an illusion, that it's all one consciousness.

  But I'm not sure it is. The film still gives us six different protagonists with their own personalities and their own arcs. And the birthmark thing feels more like reincarnation — one soul going through many lives — than like what Schrödinger was on about. My understanding is that Schrödinger didn't think there was a soul-substance that travels; he thought the I in you and the I in me are literally the same I, not two things that are connected or one thing that moves between bodies. The plurality is the illusion, not the unity. So does Cloud Atlas actually dramatise that, or does it smuggle in a pluralist picture (many souls, or one soul plus many bodies) and just dress it up in monist language?

  I'd like a reading of the film through Schrödinger's Vedanta-inflected view. Where does it get the unity of consciousness right, and where does it fudge it? Does the same-actors device help or does it mislead? What about the ethical message — the idea that our actions ripple across time and we're responsible to people we'll never meet? Is that a consequence of the metaphysics, or is it a seperate humanist add-on that actually needs a plurality of real selves to make sense? And finally, what does the film show about the illusion of separateness that Schrödinger's argument can't? I'm not after a plot summary, and I don't need citations. Just a proper reading that takes both the film and the philosophy seriously, and is honest where the film resists the reading. Also, I know Schrödinger wasn't a Sanskrit scholar and was reading translations, so maybe his Vedanta was already a bit romanticised — does that matter for how we read the film?
