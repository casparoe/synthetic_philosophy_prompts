answer: |-
  ## Cost of Doing Business

  My throat vibrates the dusk to static.
  Each rasp a tiny furnace stoked
  with sugars scrounged from leaf-litter, hours lost
  to stillness. **Heat is proof**, I broadcast,
  banked against the cooling air.
  A rival's buzz cuts through the murk – thin,
  frantic, cheaply bought. He'll fade by moonrise.
  **Heat is proof**, I grind again,
  fuel burning down to chitin struts and grit.
  This rhythm isn't chosen; it's the tax
  my bulk imposes on the air. A smaller frame
  would crack beneath the effort, snap its harp.
  Listen to the timber: not the effort, but the *body*
  forced to make it. **Heat is proof**?
  No. The proof's the *harp* that makes the heat,
  this chitinous frame too costly to be forged,
  the size that sings because it cannot stop.

  ---

  **Notes on Liberties:**
  1.  **Cricket Chirp Complexity:** While body size *influences* cricket chirp frequency/pitch, it's not the sole determinant (leg morphology, muscle physiology play roles). The poem simplifies this to "size sings."
  2.  **"Chitinous Harp":** This conflates the stridulatory organ (file and scraper on wings) with the resonant body cavity. It's poetic shorthand for the entire sound-producing *apparatus* tied to the body.
  3.  **"Cannot Stop":** The poem implies chirping is physiologically unavoidable for a large cricket, which isn't strictly true (they can cease). It emphasizes the *inescapable bodily capacity* as the true signal, leaning into the core idea.
