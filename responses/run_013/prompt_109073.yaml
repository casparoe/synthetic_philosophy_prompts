answer: |-
  ## Founder's Day Address: The Book and the Bridge

  Head Teacher, Chaplain, staff, parents, fellow students – especially you Year 9s at the back, wondering what this old book fuss is about. Thank you for letting me speak. Five minutes. I’ll be quick.

  You all know the story from last term. That Year 11 boy, mocked on the bus, filmed, the video shared. Horrible. The school responded: a restorative meeting, a well-being assembly. Important. Necessary. But afterwards, something struck me hard. The split. Some pupils thought he *should* have hit back. Others thought the school had handled it beautifully. And each side? They pretty much thought the other lot were… morally backward.

  That split, I think, goes right to the heart of why we’re talking about this book today. That book we prefects and heads of house sign. The one promising not to lie, cheat, steal, or stand by while others do. The Head Teacher has raised serious questions about it. Is a promise no one *enforces* worse than no promise? And isn’t this whole idea of ‘honour’… well, a bit archaic? Tied up with duels, bullying, blokes more worried about their reputation than actual people? Points that deserve respect, not dismissal.

  In Sociology, we looked at three ways people have thought about where our *worth* comes from – what makes us worthy of respect. Let me sketch them quickly, because they’re not just ideas; they explain that split on the bus.

  1.  **Honour:** Here, your worth is held *publicly*. It’s like a reputation you carry. An insult *damages* it. Let it pass unchallenged? You’re diminished. You *lose* standing. The lad who thought hitting back was the answer? He’s operating in this world. The insult *had* to be answered, publicly, to restore worth. For him, *not* hitting back might have felt like weakness, even complicity.
  2.  **Dignity:** This is what our school champions everywhere else – brilliantly. Our well-being hub, counselling, anti-bullying policy, all that talk of kindness? It’s built on this. Your worth? It’s *intrinsic*. It’s equal in everyone. You *cannot* lose it. An insult? It reflects badly on the *insulter*, not you. Ignoring it *is* the dignified response. It rises above. The pupils who thought the school handled it well? They saw dignity upheld. Hitting back would have just dragged everyone down.
  3.  **Recognition:** Here, worth comes from recognising harm, especially what it reveals about the *group*. That small insult? It’s a symptom of a bigger problem – what certain groups endure. The wrong is addressed by making that injury, that pattern, *visible*. The school’s assembly aimed for this – showing the harm, making it seen.

  So, which is best? Is one morally superior?

  I think our school is right to build itself, fundamentally, on **dignity**. The idea that every single student here possesses inherent, unassailable worth – that’s the bedrock. It’s why we have those brilliant support systems. It rejects the cruelty of the old ‘honour’ system where worth could be stripped away by a sneer or a rumour. And it moves beyond just the individual pain, towards understanding patterns, like the ‘recognition’ model does.

  But here’s the rub, Head Teacher. **Dignity is passive unless someone *acts* on it.** Knowing I have intrinsic worth doesn’t, by itself, tell me what to *do* when I see someone else’s worth being trampled on that bus. Knowing *harm* exists doesn’t automatically make *me* step in.

  That old Honour Book? **It’s not a relic of the *first* system. It’s a bridge to the *second*.** It asks us, publicly, voluntarily, to make an *active commitment* to uphold dignity. Not because our *own* reputation is on the line if we don’t (that *would* be the bad old honour), but because we recognise that *dignity needs defenders*.

  The Head Teacher’s hardest point? That a promise nobody enforces is worse than none. And that without it, we’ll just get more teacher surveillance. But look at the bus incident. The problem wasn’t just the mockery. It was the *filming*, the *sharing*, the *standing by*. Dignity culture, without that active commitment, can become… passive. We assume the systems will handle it. We leave it to the well-being hub, the counsellors, the teachers. We become bystanders. Surveillance *is* the logical next step if no one feels personally responsible for stepping *up*.

  Signing that book isn’t about duels or reputation. It’s about standing in front of our community and saying: “My intrinsic worth, and yours, matters enough that *I* won’t undermine it, and *I* won’t stand silent when others try.” It transforms the abstract idea of universal dignity into a personal pledge to *live* it. It’s the promise that makes dignity operational, not just theoretical. It answers the question the bus incident threw up: “What is *my* role in protecting the worth of others?”

  Chaplain, it’s not about vengeance – hitting back. It’s about commitment. Forgiveness is vital, but it comes *after* harm is stopped. The book is about the commitment to *prevent* the harm needing forgiveness in the first place, or to stop it continuing.

  Year 9s, it’s simple: It’s about promising to be decent, and to *do* something when you see indecency. Not because you’ll get nicked if you don’t, but because you promised yourself, and us, that you care.

  So, Head Teacher, I ask you: Keep the book. Not as a tool of enforcement, but as a symbol of that vital, active commitment. A reminder that in a school built on dignity, we each have a duty to be its guardians. That book isn’t about lost honour; it’s about found responsibility. It’s how we move from knowing what’s right, to promising to *do* what’s right. And that, I think, is what makes a school properly good.

  Thank you.
