answer: |-
  Here is a thought experiment satisfying all constraints:

  **Scenario:** In the 1950s, a colonial power faces a large-scale, violent insurgency by a specific ethnic group within its territory. The group has launched coordinated attacks killing thousands of civilians from the ruling ethnic majority and security forces. The state, perceiving an existential threat to its control and the survival of its own population in the region, launches a brutal counterinsurgency. It systematically rounds up and kills tens of thousands of military-age males of the insurgent ethnic group, destroys villages, and forcibly relocates women, children, and the elderly to controlled camps where harsh conditions cause widespread death from disease and malnutrition. Internal state documents explicitly state the goal: "To permanently destroy the [Group]'s capacity for organized rebellion by eliminating its fighting-age male population and severing its communal bonds, thereby ensuring our lasting security." While dehumanizing rhetoric exists among low-level actors, the core policy documents frame the destruction strictly as a necessary security measure against a lethal threat, not as an assertion of the group's inherent inferiority or right to exist. The campaign succeeds in crushing the insurgency and permanently crippling the group's demographic and social structure.

  **Legal Analysis (UN Genocide Convention):**
  1.  **Protected Group:** The targeted ethnic group is protected under the Convention (Art. II).
  2.  **Listed Acts:** Killing members of the group (mass executions of males); Causing serious bodily or mental harm (torture, camp conditions); Deliberately inflicting conditions of life calculated to bring about physical destruction (camp conditions, village destruction); Imposing measures intended to prevent births (indirectly, via destruction of family/community structure) (Art. II(a,b,c,d)).
  3.  **Intent to Destroy "as such":** The specific intent (*dolus specialis*) to destroy the group is explicitly stated in policy documents ("permanently destroy the [Group]'s capacity... severing its communal bonds"). Targeting the group *because* it is the ethnic group launching the insurgency satisfies "as such" – the group is targeted in its collective identity as the perceived source of the threat. Legal doctrine (e.g., ICTY, ICTR jurisprudence) confirms that intent to destroy a group as a political or military adversary, if that identity is fundamentally linked to its protected characteristic (here, ethnicity), meets this element. The group's actions are the *reason* for targeting its existence, but the *object* of the intent remains the destruction of the group itself.
  4.  **In Whole or Substantial Part:** The systematic killing of a large segment (military-age males) plus the conditions inflicted on the rest, leading to the group's permanent demographic collapse and social disintegration, constitutes destruction of a substantial part in both numerical and qualitative terms (impact on the group's viability).

  **Moral Conception (Threshold Dehumanization):**
  Genocide, morally, requires not only the intent to physically or biologically destroy a protected group in whole or substantial part, but also the *intent to negate the fundamental moral worth and humanity of the group members*. This intent manifests as treating the group as inherently subhuman, vermin, a cancer, or as possessing no right to exist *simply by virtue of their group identity*, irrespective of their actions. The unique moral horror of genocide lies in this absolute moral exclusion, the denial of the victims' very status as beings entitled to moral consideration.

  **Application of Moral Conception:**
  The scenario falls outside this moral conception. While the acts are horrific and the intent to destroy the group is clear, the *stated rationale* (preserved in core documents) is instrumental and defensive: destroying the group *as a necessary means* to eliminate a perceived existential security threat. The group is targeted *because of what it is doing* (violent insurgency), framed as a dangerous adversary, not *because of what it intrinsically is* (inherently subhuman or unworthy of existence). The group's identity is the *identifier* of the threat, not the *reason* for its alleged non-worth. Dehumanizing rhetoric among perpetrators, while abhorrent, is not the driving *intent* behind the core policy of destruction, which is framed in strategic security terms. The moral wrong is immense, but it is the atrocity of collective punishment driven by strategic necessity and fear, not the distinct evil of moral erasure.

  **The Key Divergence Feature & Its Removal:**
  The feature prying the verdicts apart is the **nature of the perpetrator's intent as revealed in the core rationale**: strategic/instrumental destruction of the group as a means to a security end vs. destruction based on the belief in the group's inherent lack of moral worth or right to exist. If this feature were removed – if the core policy documents instead articulated an ideology framing the group as inherently subhuman, unworthy of life, or a blight needing eradication *regardless of their actions* (e.g., "We cleanse the land of this inferior race") – then the moral conception would align with the legal one, declaring it genocide. The acts and the intent to destroy the group could remain identical, but the *reason* for that intent (inherent unworthiness vs. strategic necessity) creates the divergence under this moral view.

  **Reply to "Not Really Genocide":**
  **Reply:** The critic might argue that "Threshold Dehumanization" defines not genocide but a specific *motivation* (ideological hatred) underlying mass atrocities like Crimes Against Humanity (CAH) or War Crimes, or that it describes "extermination" as a CAH. Genocide, they insist, is defined by the *act* of group destruction intent itself, regardless of the underlying motivation (security, ideology, etc.).
  **Rebuttal:** This reply captures the legal definition but fails against the *moral* conception. The moral conception argues that the unique, catastrophic evil labeled "genocide" *is* precisely this intent of absolute moral erasure – the denial of human standing *because* of group identity. Mass killing for strategic reasons, however abhorrent, lacks this specific, qualitatively distinct moral horror. Calling both "genocide" morally dilutes the term's power to condemn the ultimate crime of dehumanization. Calling it "extermination" or "CAH" acknowledges the atrocity but fails to capture the unique *moral status* targeted. The Threshold Dehumanization conception *is* a conception of genocide because it identifies the core moral wrong that distinguishes genocide from other mass atrocities: the intent to destroy not just lives, but the victims' very claim to moral consideration *as members of that group*.
  **Success of Reply:** The reply partially succeeds in highlighting that the moral conception is narrower than the legal one and overlaps with motivations underlying other crimes. However, it **fails** to demonstrate that the Threshold Dehumanization conception is *not* a valid *moral* conception of genocide. It succeeds in describing the legal position but does not refute the argument that the moral essence of genocide lies in this specific intent of absolute moral exclusion, which the legal definition may encompass too broadly by including group destruction driven by other motives like strategic necessity.

  **Note on Historical Dependency:** The argument hinges on interpreting the *core rationale* from historical documents. If evidence overwhelmingly showed the security rationale was a mere pretext masking deep-seated dehumanizing ideology, the moral verdict would likely shift to "genocide." The argument assumes the documented strategic rationale is genuine and primary. If disputed, the divergence weakens.
