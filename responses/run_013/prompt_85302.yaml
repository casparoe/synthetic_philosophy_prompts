prompt: |-
  For two years my metaethics reading group has been circling the same issue — whether the is–ought gap is a substantive result about ethics or a triviality about inference — and I would like a diagnosis of the stalemate rather than another defense of one side. One camp holds that no set of purely descriptive premises entails any normative conclusion; its critics answer that this is true of inference everywhere (nothing about molecules entails anything about organisms without a bridge principle) and so carries no special metaethical weight; a third group thinks the gap can be closed by analytic bridge principles, pointing to the alleged derivation of an ought from the practice of promising, or to thick concepts said to be descriptive and evaluative at once. Take a stock case: from the premise that an act causes suffering one reaches the conclusion that one ought not to do it only by adding something like a principle that suffering is to be avoided — and each side reads that observation differently. My hypothesis is that the parties are not disagreeing about a fact but are using the word entailment in different senses, one deductive and formal, the other closer to justification, and that a second, concealed disagreement about whether bridge principles are themselves descriptive or normative is doing most of the work. Please test that hypothesis against what each side actually claims, say whether the dispute is verbal, a case of different questions sheltering under one heading, or a genuine disagreement about the existence of analytic bridge principles, and tell me what would count as progress — a formal result, a distinction, or an argument that none should be expected. Answer in British English.
reasoning: |-
  Okay, the user runs a metaethics reading group stuck for two years on whether the is-ought gap is substantive or trivial. They've outlined three camps: one insisting descriptive premises can't entail normative conclusions, another saying this is true of all inference (comparing it to molecules not entailing organisms without bridge principles), and a third believing analytic bridge principles (like promising or thick concepts) can close the gap. The user suspects the stalemate stems from differing uses of "entailment" (deductive vs. justification) and an unspoken disagreement about whether bridge principles are descriptive or normative. They want me to test this hypothesis and suggest what progress would look like.

  Right, let me unpack this carefully. The user is clearly deeply versed in metaethics – they're using technical terms like "bridge principles" and "thick concepts" correctly, and they've identified nuanced positions in the debate. This isn't a beginner; they've been wrestling with this for two years in a reading group. Their frustration with the stalemate is palpable, and they're explicitly asking not for another rehash of arguments but for a diagnostic tool to understand why they're stuck.

  The hypothesis about "entailment" having different senses seems spot-on. When the first camp says "no entailment," they're almost certainly using it in the strict deductive-logic sense – no normative conclusion logically follows from purely descriptive premises without a bridge principle. Whereas the critics seem to be using "entailment" more broadly, like in everyday reasoning where we move from "this causes suffering" to "don't do it" without feeling we've violated logic. 

  And the hidden disagreement about bridge principles is crucial. If you think "suffering is to be avoided" is itself a normative claim, then adding it makes the argument normative throughout – so the gap remains unclosed. But if you think it's analytic (like part of the meaning of "suffering"), then suddenly it looks like you've derived an "ought" from an "is." The third camp's examples – promising practices or thick concepts like "cruel" – all turn on whether those contain built-in normativity.

  The dispute isn't purely verbal but involves substantive disagreements: about the nature of logic, the autonomy of ethics, and whether normativity can be reduced. Progress might come from shifting focus – perhaps to whether analytic bridge principles actually exist, or to clarifying what "substantive results about ethics" even means. A formal result won't help here since the disagreement runs deeper than logic. What's needed is conceptual clarity: mapping the different conceptions of entailment and bridge principles explicitly. The group should ask not "is there a gap?" but "what kind of gap are we talking about, and why does it matter?" That might break the stalemate by showing each side is answering a different question.
answer: |-
  Your diagnosis is perceptive and largely correct—the stalemate arises from conflating distinct philosophical questions under the umbrella of the "is-ought gap," compounded by equivocal uses of "entailment" and unresolved disagreements about bridge principles. Let's test your hypothesis against the camps' positions and clarify the nature of the dispute. 

  ### 1. **Testing Your Hypothesis**  
     - **"Entailment" in Two Senses**:  
       - **First camp (substantive gap)**: Uses "entails" in a *deductive, logical sense*. For them, no normative conclusion (e.g., "You ought not cause suffering") follows *formally* from descriptive premises alone. They see this as revealing ethics' autonomy—normativity cannot be "discovered" like empirical facts.  
       - **Critics (triviality)**: Use "entails" as *justificatory support*. Their objection—that molecules don't entail organisms without bridge principles—relies on a broader, defeasible notion of inference. They argue that if the is-ought gap is merely about logical form, it applies universally and lacks metaethical significance.  
       *Your hypothesis holds*: These camps talk past each other because one discusses logical validity, the other epistemic justification.  

     - **The Hidden Dispute Over Bridge Principles**:  
       - The third camp (analytic bridges) claims concepts like "promising" or "cruel" *contain* normative force analytically (e.g., "promising" entails "ought to keep").  
       - **The core disagreement**: Is a principle like "suffering is to be avoided" *descriptive* (e.g., a psychological fact about humans) or *normative* (a value-laden claim)?  
         - The "substantive gap" camp insists such principles are *normative*, so adding them concedes the gap.  
         - The "analytic" camp argues they are *descriptive* (e.g., built into language/practice), purporting to close the gap.  
       *Your hypothesis holds*: This unspoken conflict about the status of bridge principles is pivotal.  

  ### 2. **Is the Dispute Merely Verbal?**  
     - **Partly, but not wholly**. The equivocation on "entailment" is verbal: clarifying terms might resolve surface confusion. Yet beneath this lie **genuine disagreements**:  
       - **Metaphysical**: Is normativity *sui generis* (requiring non-descriptive foundations) or reducible to descriptive facts via concepts/practices?  
       - **Semantic**: Can "thick concepts" (e.g., "courageous") be *both* descriptive and normative without circularity? Critics (e.g., Hare) argue they decompose into separate elements.  
       - **Epistemological**: Must justification of moral claims *always* rely on prior normative premises?  

     The camps aren't just defining "entailment" differently—they’re committed to incompatible views of ethics, language, and reality.  

  ### 3. **What Counts as Progress?**  
     A formal result or new argument won’t break the stalemate. Instead, progress requires:  
     - **Conceptual Distinctions**: Explicitly separate:  
       - *Logical entailment* (formal deducibility)  
       - *Epistemic justification* (defeasible support)  
       - *Metaphysical grounding* (what constitutes normativity).  
       For example, grant the logical gap but debate whether bridge principles *justify* normativity.  
     - **Reframing the Question**: Shift focus from "Can we derive 'ought' from 'is'?" to:  
       - "Are there analytic truths linking description to normativity?" (Test case: Does "promising" analytically entail "obligation" in all contexts?)  
       - "Do thick concepts *fuse* fact/value, or merely *associate* them contingently?"  
     - **Empirical/Conceptual Work**: Investigate if bridge principles (e.g., "avoid suffering") are cultural universals (suggesting descriptivity) or inherently normative. Thick concepts need linguistic anthropology: does "cruel" *require* moral disapproval, or merely imply it contingently?  

  ### Conclusion  
  The stalemate stems from **three layered issues**: verbal ambiguity ("entailment"), a substantive dispute (nature of bridge principles), and deeper metaethical commitments. Progress demands disentangling these. Clarify terminology first, then isolate the core disagreement: whether any bridge principle can be *descriptive yet genuinely normative*. If your group can map where each member stands on that question—and why—the deadlock may lift. The goal isn’t consensus but recognising that the "gap" debate shelters multiple distinct puzzles, each needing separate treatment. As it stands, the camps are like astronomers arguing over telescopes while peering at different stars.
