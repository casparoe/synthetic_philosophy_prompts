  The user’s deeper needs are clear: students struggle with abstract concepts like collapse being subjective (e.g., elite vs. farmer perspectives) and non-catastrophic. The story must show, not tell, this through a scribe’s mundane experiences. Key constraints: no invasions/plagues, set in an invented river-valley society, focus on a decade-long fade, and include two scenes—one where archives become irrelevant, another where someone contradicts the scribe’s view of collapse with genuine improvements in their life. 

  I’ll design a setting called the River Realm, centered on canals, grain ledgers, and tribute rolls. The protagonist, Vesh, is a pragmatic scribe. Her arc will show the slow erosion of the ledger system: first, a dispute where her records are ignored (demonstrating lost authority); later, a confrontation with a farmer who thrives without paying tribute, forcing her to question "collapse" as purely negative. The "ledger test" breaks here—records persist but are hollow, while some people flourish. The ending stays ambiguous: Vesh keeps working, but the contradiction lingers. 

  I’ll avoid any didactic explanations. Instead, sensory details (dust, ink, canal silt) and bureaucratic tedium will ground the decay. The farmer’s scene is crucial—he must be sympathetic, his gains tangible (better harvests, daughter’s freedom), so students can’t dismiss his view. Vesh’s realization—that her life’s work is becoming obsolete—will mirror the societal shift without verdicts. 

  Potential pitfalls to avoid: Making the farmer’s success too simplistic (hence adding drought survival as proof of stability). Ensuring Vesh isn’t heroic or pitiable; she’s competent but rigid. No epilogue—the story stops as she files useless records, leaving the tension unresolved. 

  This should meet the user’s goal: students will see collapse as a fraying of systems, where "ending" depends on whose ledger you read.
