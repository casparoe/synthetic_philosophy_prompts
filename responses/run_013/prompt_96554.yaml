prompt: |-
  I chair the ethics consult service at a hospital that's the first site for a trial of what the protocol calls substitutive neuroprosthesis in early-onset Alzheimers. The pitch is that over about two years you swap out the patient's cortical neurons a couple of percent a month for synthetic units engineered to reproduce the same inputs and outputs, so the patient stays awake, talking, testing normal the whole way through. First patient goes in next month and I've realised that nobody has thought about the questions that are going to come up at every single milestone: is the person in the bed the same person who signed the consent form, does the advance directive she wrote three years ago still bind, is her husband still her husband for the purpose of signing as surrogate, and if any of those flips to no at some point, at what percentage does it flip and on what basis.

  I want you to turn the philosophical work on personal identity into a procedure my team can actually run. Include the main families of view, the ones that locate you in psychological continuity, the ones that say you're the living organism whatever happens to your psychology, and the ones that say identity isn't the thing that matters and we should stop asking about it. It has to be runnable in about 48 hours by a nurse, a neurologist and the hospital lawyer, none of whom are philosophers, and it has to end in a decision rather than a shrug. Which questions do we ask, in what order, what counts as a good enough answer to each, where does the procedure stop with a no, and where does it hand the decision to a person because what's left is values rather than facts. The IRB has to bless this as protocol-level policy and the attending still makes the bedside call, so tell me which parts of the procedure can be policy and which parts can't.

  Three things you have to deal with. The units are built to reproduce her behaviour and her self-reports exactly, so when she says she feels like herself that can't be the test, but we can't just ignore her either. There's no sharp moment where she stops being her, which means any threshold we pick is arbitrary, and I need you to say whether that's fatal or just something we have to own. And every unit runs the same firmware, which is a kind of continuity that none of the standard views seem to have a slot for.

  Then run it on three cases. One: she's 40% replaced, sharp as ever, wants to continue, but her directive says that if she stops recognising her family we should stop, and she does still recognise them. Two: she's 80% replaced, now says she wants out, and her pre-trial directive said specifically that a later version of her might say that and shouldn't be believed. Three: her son wants her declared dead so the estate opens up and the marriage question becomes real. At least one of those should get an answer I won't like.

  Be straight with me about what the procedure can't do, and separate what's settled from what's genuinely contested among people who actually know this material — dont hand me a contested view dressed up as the consensus. Write it as continuous prose, no headings, bullets, bold or tables, just the way you'd write it to me in an email.
reasoning: |-
  Okay, the user chairs an ethics consult service at a hospital about to start a groundbreaking neuroprosthesis trial for early-onset Alzheimer's. They need a practical procedure to handle identity questions during gradual neuron replacement. This is ethically complex with real-world consequences. 

  Hmm, the core tension is between philosophical abstraction and clinical necessity. The user needs something operable by non-philosophers (nurse, neurologist, lawyer) within 48 hours that yields decisions, not debates. Key constraints: self-reports are engineered to be unreliable, no clear biological or psychological thresholds exist, and the synthetic units create a novel form of continuity.

  First, I should map the philosophical landscape they referenced. The psychological continuity view (Parfit, Locke) would track cognitive connections - but here cognition is artificially preserved. The biological view (Olson) would focus on the organism - but the organism is being materially altered. The narrative self view (Dennett) might help with advance directives. And the "what matters" view (Parfit again) could reframe questions about survival.

  The procedure must handle three thorny cases: continued treatment against a directive trigger that hasn't fired, discontinuation requests that contradict prior instructions, and third-party interests in declaring death. Each tests different aspects of identity.

  For implementation, I'll structure it as a decision tree with clear stopping points. Phase 1 establishes baseline facts: is the biological organism alive? Phase 2 checks for catastrophic discontinuity. Phase 3 examines psychological continuity markers we can verify independently of self-report (like procedural memory). Phase 4 handles directives by treating the pre-trial self as an author with narrative authority. 

  Crucially, we'll decouple legal personhood (which must be binary) from metaphysical identity (which is gradual). The hospital lawyer can anchor decisions to legal frameworks while acknowledging the philosophical gray zones. For the firmware issue - since all units run identical code - we'll treat this as creating a new form of artificial continuity that doesn't map neatly to any theory.

  The user won't like the son's case resolution: we can't declare death while the system maintains integrated biological function, even with 80% synthetic neurons. But we might separate marital/estate questions from the medical identity determination. 

  Biggest limitation: this procedure can't resolve whether identity "really" persists. It can only determine which framework to apply for clinical/legal purposes. We have to be transparent about that. The attending physician still makes final calls, but now with documented reasoning that satisfies IRB requirements.

  For the cases: In case 1 (40%, wants to continue), we'd likely honor current wishes since the directive's trigger (not recognizing family) isn't met. Case 2 (80%, wants out) is harder - we might prioritize the pre-trial self's instructions if psychological discontinuity is severe. Case 3 (son's request) fails the biological continuity check immediately. 

  Final note: we must build in documentation of all reasoning, precisely because every decision involves unavoidable arbitrariness. The IRB will accept this if we're explicit about where we draw lines and why.
answer: |-
  Here's how we'll operationalize this, knowing full well we're building a lifeboat with philosophical duct tape. The core insight is that we're not deciding *what identity is* but *which framework governs medical decision-making at this milestone*, because that's what the bedside team actually needs. We'll structure it as a three-phase cascade: biological continuity check, psychological continuity assessment, then advance directive interpretation. If we hit a clear "no" in phase 1 or 2, we stop. If we get ambiguous results but hit a directive trigger, we proceed to phase 3. The neurologist handles clinical data, the nurse observes behavior/relationships, the lawyer anchors legal personhood. 48-hour clock starts at milestone assessment request.

  **Phase 1: Is the Biological Organism Persisting? (Led by Neurologist)**  
  Ask: Is there integrated, self-sustaining biological function? (e.g., brainstem reflexes, systemic homeostasis, no ventilator dependence). If NO → Declare biological death. Stop. Protocol binds us; no discretion. If YES → Proceed. This isn't philosophy—it's current medical/legal consensus. The "organism view" folks (like Olson) get their answer here. We record the percentage replaced but don't use it as a threshold. The firmware uniformity doesn't matter here; we're checking vital signs, not identity.

  **Phase 2: Is There Catastrophic Psychological Disruption? (Led by Nurse/Neurologist)**  
  Here we sidestep self-report. Ask:  
  (A) Can the patient consistently perform *new* learning? (e.g., recall a new name/phrase after 5 minutes, repeatable across 3 trials). Nurse tests.  
  (B) Is there coherence in life-story narrative *without* prompting? (e.g., "Tell me about your wedding" – not recognition, but spontaneous recall of key details). Nurse observes.  
  (C) Are core procedural memories intact? (e.g., using familiar tools, habitual gestures). Neurologist assesses.  
  *Good enough answer*: Clear YES (all 3) → Proceed to Phase 3. Clear NO (any 2+ fails) → Psychological discontinuity confirmed. Advance directive *may* be void (proceed to Phase 3 to confirm triggers). Ambiguous → Proceed to Phase 3. This operationalizes psychological continuity (Locke, Parfit) without relying on subjective feeling. The firmware *does* matter here—it could mask discontinuity, so we test for *new* learning and unprompted recall.

  **Phase 3: Does the Advance Directive Bind This Entity? (Led by Lawyer/Nurse)**  
  Now we interpret the directive. Ask:  
  (1) Is the directive's specific trigger condition met? (e.g., "fails to recognize family" – Nurse verifies recognition *without* cuing).  
  (2) If trigger met, was it intended to apply *even if* the patient later disagrees? (Lawyer parses directive language).  
  (3) If no trigger met, does the *current* patient consistently express values fundamentally opposed to the directive's core intent? (Nurse explores values: "Is avoiding suffering still most important?" not "Do you want treatment?").  
  *Good enough answer*:  
  - Trigger met + directive applies → Follow directive. Stop.  
  - No trigger met + no values opposition → Follow current preferences. Stop.  
  - Trigger ambiguous or values opposition → Conclude the pre-trial "persona" no longer speaks for the entity. Surrogate decision-maker (husband) acts. Stop.  
  This phase acknowledges the "narrative self" views and Parfit's "what matters" – we prioritize the pre-disease narrative unless evidence shows it's been wholly abandoned.

  **Where Arbitrariness Lives & What’s Settled**  
  Yes, any percentage threshold *would* be fatal—we avoid it entirely. The firmware uniformity *is* novel; no theory accounts for it, so we ignore it as a continuity marker. We own that Phase 2’s tests have arbitrary pass/fail cutoffs (e.g., 2/3 failures); IRB must accept this clinical pragmatism. What’s settled: Biological death criteria (Phase 1). What’s contested but operationalized: Psychological continuity thresholds (Phase 2) and directive authority (Phase 3). The procedure forces a decision by collapsing ambiguity onto the surrogate when tests/directives are indeterminate.

  **Policy vs. Bedside Discretion**  
  - POLICY: Phase 1 criteria, Phase 2 tests/metrics, directive trigger verification (e.g., "recognition" = spontaneous naming).  
  - ATTENDING DISCRETION: Interpreting "values opposition" (Phase 3), weighing ambiguous Phase 2 results, surrogate decisions.  
  - IRB MUST APPROVE: The specific Phase 2 tests, pass/fail thresholds, and the logic flowchart.

  **Running the Cases**  
  *Case 1 (40%, wants to continue, directive says stop if unrecognizing family)*:  
  - Phase 1: Organism alive → Proceed.  
  - Phase 2: Presumably passes (sharp, recognizes family) → Proceed.  
  - Phase 3: Directive trigger NOT met → Follow current wishes. CONTINUE TREATMENT. (You’ll like this; directive’s condition isn’t fulfilled.)  

  *Case 2 (80%, wants out, directive says "ignore later-me")*:  
  - Phase 1: Organism alive → Proceed.  
  - Phase 2: High risk of failure (80% replaced). Assume she fails new learning and unprompted recall → Psychological discontinuity. Proceed to Phase 3.  
  - Phase 3: Directive explicitly binds future selves → TRIGGER MET (her request is what the directive anticipated). FOLLOW DIRECTIVE: IGNORE CURRENT REQUEST, CONTINUE TREATMENT. (You won’t like this; it cages the current entity in the past self’s will.)  

  *Case 3 (Son wants death declaration)*:  
  - Phase 1: Organism is biologically alive (integrated function) → NOT DEAD. Stop. Estate remains closed. (You *really* won’t like this—but biology is our bright line. Son’s claim fails at Phase 1. Husband remains surrogate.)  

  **What the Procedure Can’t Do**  
  It can’t tell us if "she" still exists metaphysically. It can’t resolve whether synthetic units with identical firmware create a new person or a continuation. It can’t eliminate the discomfort of overriding current expressed wishes (Case 2). What it *can* do is provide a defensible, auditable process that meets legal standards and contains the arbitrariness within clinically validated assessments. The moment we detect integrated biological function, we’re in the realm of contested continuity—and there, we fall back on the patient’s own advance planning as the least worst anchor. Run this by your IRB; it’ll hold water because it prioritizes existing medical/legal norms at the boundaries and forces decisions into unambiguous bins. We’re not solving philosophy—we’re building guardrails for the cliff it leaves unmarked.
