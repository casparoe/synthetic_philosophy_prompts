prompt: |-
  I run the risk-assessment and authorisation unit at a national environment and chemicals agency. About fifty proposals a year cross my desk, each one a request either to approve a substance or technology with conditions attached, or to restrict or withdraw something already in use, and each has to be closed out as a signed decision note within ninety days, with a twelve-month review available if we take the conditional route instead of a flat yes or no. My staff are scientists and lawyers rather than philosophers, the notes we write get judicially reviewed, and the reasoning has to survive a judge asking why we treated the uncertainty in this file differently from the uncertainty in the file two desks over. I came into the job a believer in the precautionary principle and I still am, but I have watched our own unit invoke it in opposite directions on nearly identical evidence — as a reason to act at once and as a reason to keep studying — and I have been made to look foolish in cross-examination for it. What I want from you is a procedure, not an essay on the principle: an ordered set of questions my unit can actually run, with entry and exit conditions at each step, a statement of what counts as a sufficient answer to each, the points at which the procedure returns a definite no, and the points at which it must hand the file to a person because the remaining question is one of values rather than evidence. Note that our minister can override us on social or economic grounds; I would rather the procedure said so openly at the right step than have that override smuggled in earlier as though it were a scientific judgment.

  The procedure has to be honest about the structure of the principle instead of smoothing it over. It must separate the two quite different jobs the principle is normally asked to do: lowering the standard of proof required before a restriction is justified, by shifting the burden onto whoever wants to introduce or keep the substance; and licensing action on grounds that would fail a conventional cost-benefit test. It must distinguish, and prescribe different treatment for, at least four epistemic situations — probabilities known, probabilities unknown but the outcomes enumerable, outcomes themselves contested, and the case where we suspect we have not yet thought of the relevant outcome at all — and it must say which of these the principle was actually built for and which it was not. It must confront the fact that waiting for better evidence is sometimes the genuinely precautionary move and sometimes precisely the vice the principle exists to prevent: I want an explicit test for when a delay is a legitimate purchase of information and when it is a decision to let the harm keep running, and I want the procedure to name the error it is committing either way. It must also force us to price the risks of our own intervention — the substitute chemical, the lost benefit, the displaced production, the harm done by the restriction itself — without letting that requirement become a general licence to do nothing, since I have now seen both failure modes and need a procedure that can be accused of neither.

  Practical constraints: ninety days, no new primary research, a unit of six with one economist available two days a week, and a director who will not sign a note whose conclusion is merely that the science is uncertain. Give me the procedure in a form I can put in front of the unit — steps in order, the question to ask at each, what a sufficient answer looks like, where we stop, where we escalate, and a one-page form the case officer fills in. Then run it end to end on three files: a class of insecticides where the laboratory evidence is suggestive, the field evidence is contested, and the registrants argue that every available alternative is worse; a proposal to release a self-propagating engineered organism, where the central problems are irreversibility and the absence of any way to recall what has been released; and a third case I have chosen because I expect the procedure to tell me something I will not want to hear — a widely used flame retardant whose most likely substitute is probably more dangerous than the thing we would be banning, so that I can see whether the procedure really does return a refusal to act, and what it says we owe the people who remain exposed in the meantime. Finally, tell me where this procedure will misfire: the moves that can be gamed by whoever frames the file first, the inputs that look like measurements but are actually choices, and the questions it will keep handing back to me that no procedure can settle.
reasoning: |-
  We are designing a procedural framework for applying the precautionary principle in regulatory decisions. The procedure must be robust, transparent, and able to handle various epistemic situations. It must also separate scientific and value judgments, and account for the risks of intervention.

  Key elements from the request:
  1. The procedure must separate two functions of the precautionary principle: 
     a) Lowering the standard of proof (shifting burden to the proponent).
     b) Allowing action even when conventional cost-benefit analysis (CBA) would not justify it.
  2. It must handle four epistemic situations:
     a) Probabilities known.
     b) Probabilities unknown but outcomes enumerable.
     c) Outcomes contested (disagreement on what the outcomes are).
     d) Unknown outcomes (we haven't thought of all possibilities).
  3. It must include a test for when to delay (for more evidence) and when to act immediately, and name the error (Type I or Type II) that might be committed.
  4. It must price the risks of intervention (substitution, lost benefits, etc.) without becoming a general excuse for inaction.
  5. Practical constraints: 90 days, no new primary research, limited staff.

  The procedure must output a decision note that can withstand judicial review.

  Structure of the procedure:
  We will have a step-by-step process with clear entry and exit conditions. Steps will be ordered to first clarify the harm, then the evidence, then the uncertainties, then the potential actions and their risks, and finally the decision.

  We will design a one-page form that the case officer fills in as they go through the steps.

  The steps:

  Step 0: Initial Triage
  - Question: Is this a request for approval (with or without conditions) or for restriction/withdrawal?
  - If approval: the burden of proof is on the proponent to show safety. If restriction: the burden is on the agency to show harm, but with a lowered standard due to precaution.
  - Exit: Proceed to Step 1.

  Step 1: Define the Harm
  - Question: What is the harm of concern? (Specify: type, magnitude, population affected, reversibility, and time horizon.)
  - What must be answered: A clear description of the harm, including whether it is irreversible or potentially catastrophic.
  - Epistemic situation: 
     a) If the harm is well-defined and outcomes are known, note that.
     b) If outcomes are contested (e.g., some experts say harm A, others harm B), document the contestation.
     c) If there are unknown outcomes (we suspect we haven't thought of everything), note that.
  - Sufficient answer: A list of potential harms, with a note on which are contested or unknown.
  - Exit: Proceed to Step 2.

  Step 2: Assess the Evidence and Uncertainty
  - Question: What is the state of evidence regarding the harm? (Include: laboratory, field, epidemiological, mechanistic. Also, what is known about the dose-response, exposure, etc.?)
  - Epistemic situations and their handling:
     a) Probabilities known: Use available probabilistic risk assessment.
     b) Probabilities unknown but outcomes enumerable: Use scenarios (best case, worst case, etc.).
     c) Outcomes contested: Document the range of expert views and the reasons for disagreement.
     d) Unknown outcomes: Acknowledge the possibility of unknown unknowns and consider the potential for surprise.
  - Precautionary burden shift: If we are in a situation of uncertainty (cases b, c, d) and the harm is potentially serious or irreversible, the burden shifts to the proponent (for approval) or the agency may act with less evidence (for restriction).
  - Sufficient answer: A summary of the evidence and a classification of the uncertainty (using the four categories). Also, a statement on whether the uncertainty is so high that the precautionary principle is triggered (i.e., we cannot wait for full scientific certainty).
  - Exit: Proceed to Step 3.

  Step 3: Evaluate the Possibility of Delay (Information Purchase)
  - Question: Would delaying a decision to gather more evidence reduce the uncertainty sufficiently to warrant waiting? And what are the consequences of waiting?
  - Test for delay:
     a) If the harm is ongoing and delay would lead to continued exposure, then delay is not precautionary (it risks harm).
     b) If the harm is uncertain and the consequences of waiting are minimal (e.g., no significant exposure in the interim) and new evidence is likely to be forthcoming in a reasonable time, then delay might be justified.
  - Name the error:
     - Acting now when we could have waited and avoided unnecessary disruption: Type I error (false positive) in regulation.
     - Waiting when we should have acted: Type II error (false negative) in regulation (allowing harm to occur).
  - Sufficient answer: A decision on whether to delay, with justification. If delay is chosen, set a timeline for review (within the 12-month review period). If not, proceed.
  - Exit: If delay is chosen, the decision note is to delay for more evidence (with a review date). Otherwise, proceed to Step 4.

  Step 4: Assess Risks of Intervention
  - Question: What are the risks and costs of the proposed regulatory action? (Include: substitute risks, lost benefits, displaced production, etc.)
  - Must price the risks of intervention without letting it become a veto. We must consider:
     a) The direct risks of the substitute (if banning a substance, what is the alternative?).
     b) The indirect risks (e.g., if banning a pesticide leads to crop losses and food insecurity).
  - This step requires the economist (2 days/week) to help quantify where possible, but also qualitative assessment.
  - Sufficient answer: A comparison of the risks of action vs. inaction, including the possibility that the intervention might cause more harm.
  - Exit: Proceed to Step 5.

  Step 5: Decision Framework
  - At this point, we have:
     - The potential harm and its characteristics.
     - The state of evidence and uncertainty.
     - The risks of intervention.
     - A decision on whether delay is appropriate (if not, we proceed to a final decision).
  - We now separate two tracks:
     a) If the uncertainty is high and the harm is potentially severe and irreversible, then we are in the core domain of the precautionary principle. We may act even if conventional CBA does not show net benefit because we are avoiding potential catastrophe.
     b) If the uncertainty is lower, then we use a conventional risk-benefit analysis.
  - Steps for track (a):
     - We require that the proponent (for approval) or the agency (for restriction) shows that the potential harm is plausible and serious, and that the proposed action (approval with conditions, or restriction) is proportional and the least restrictive measure that can be taken.
     - We then ask: Is the potential harm so severe and irreversible that we cannot afford to wait? And are the risks of intervention (from Step 4) acceptable in light of the potential harm avoided?
  - For track (b): Use standard risk-benefit, with a threshold of acceptable risk.

  Step 6: Ministerial Override
  - If the decision is to restrict or not approve, but there are overriding social or economic considerations, the procedure must acknowledge that the minister may override. This step is not a scientific judgment but a political one.
  - In the decision note, we state: "Based on the scientific assessment, the recommended decision is [X]. However, the minister may consider overriding this decision on social or economic grounds, which are beyond the scope of this unit's assessment."

  Step 7: Document and Review
  - The case officer fills the one-page form (see below) and attaches the full reasoning.
  - The decision note is signed by the director.

  One-Page Form:

  [Form Header]
  Substance/Technology: 
  Case Officer: 
  Date: 

  Step 0: Request Type: [ ] Approval [ ] Restriction/Withdrawal

  Step 1: Harm Definition
  - Harm(s) of concern: 
  - Characteristics: [ ] Irreversible [ ] Catastrophic [ ] Reversible [ ] Other: 
  - Outcome status: [ ] Known and agreed [ ] Contested (explain) [ ] Unknown outcomes possible

  Step 2: Evidence and Uncertainty
  - Summary of evidence: 
  - Uncertainty classification: [ ] Probabilities known [ ] Probabilities unknown, outcomes enumerable [ ] Outcomes contested [ ] Unknown outcomes possible
  - Precautionary trigger: [ ] Yes, because [ ] No, because

  Step 3: Delay Evaluation
  - Delay justified? [ ] Yes [ ] No
  - If yes, set review date: 
  - If no, reason: 
  - Error risk of acting: [ ] Type I [ ] Type II (if applicable)
  - Error risk of waiting: [ ] Type I [ ] Type II (if applicable)

  Step 4: Risks of Intervention
  - Summary of intervention risks: 
  - Economic input (if used): 
  - Comparison: Risks of action vs. inaction

  Step 5: Decision
  - Recommended decision: [ ] Approve [ ] Approve with conditions [ ] Restrict [ ] Withdraw [ ] Refuse (for approval) / Do not restrict (for restriction) [ ] Delay for more evidence (if Step 3)
  - If precautionary track: [ ] Yes [ ] No
  - Justification: 

  Step 6: Ministerial Override Acknowledgment
  - [ ] The minister may override on social or economic grounds.

  Step 7: Signatures
  - Case Officer: 
  - Unit Head: 
  - Director: 

  Now, we run the procedure on three cases:

  Case 1: Insecticides (approval or restriction? Let's assume it's a restriction proposal because of environmental harm)

  Step 0: Restriction request.

  Step 1: Harm - Laboratory evidence suggests neurotoxicity to bees, field evidence is contested (some studies show colony collapse, others do not). Harm: decline in bee populations, which are crucial for pollination. Irreversible? Local extinctions might be irreversible. Outcomes: contested (some argue the field evidence is confounded by other factors).

  Step 2: Uncertainty - Outcomes are contested. Precautionary trigger: yes, because of the potential for widespread ecological harm and the contested nature of the evidence.

  Step 3: Delay? The registrants argue that every alternative is worse. But if we wait, bee colonies may continue to collapse. Error of waiting: Type II (allowing harm to continue). Error of acting: Type I (restricting a product that might be safe) and the risk of substituting with a worse alternative. We decide not to delay because the harm is ongoing and potentially irreversible.

  Step 4: Risks of intervention: The registrants say alternatives are worse (more toxic to non-target species or less effective leading to increased use). We must assess: if we ban this, what will farmers use? Our economist helps. We find that one alternative is indeed more persistent in the environment, but another is less toxic to bees. We note that the risks of substitution are real but manageable with conditions (e.g., phased introduction, training). Overall, the risks of inaction (bee collapse) are greater.

  Step 5: Precautionary track (because of contested outcomes and irreversible harm). We recommend restriction with conditions (phased ban, promoting safer alternatives). We also set a 12-month review to check if the substitution is causing new problems.

  Step 6: Acknowledge ministerial override possibility.

  Case 2: Self-propagating engineered organism (release approval request)

  Step 0: Approval request.

  Step 1: Harm: potential for uncontrolled spread, disruption of ecosystems, irreversibility. Outcomes: unknown (we haven't thought of all possibilities) because it's a novel organism.

  Step 2: Uncertainty: unknown outcomes possible. Precautionary trigger: strong, because of irreversibility and unknown unknowns.

  Step 3: Delay? We could wait for more contained experiments, but the proponent argues urgency. However, because of irreversibility, waiting to gather more evidence in the lab is the precautionary move (prevents release until we know more). Error of acting: Type I (releasing something harmful that we can't recall) could be catastrophic. Error of waiting: Type II (delaying a beneficial technology) but the harm of waiting is minimal if contained. We choose to delay the release decision and ask for more lab evidence.

  Step 4: Risks of intervention: Not applicable because we are not releasing. But if we were to approve, the risk is irreversible harm. If we deny, the proponent loses the benefit.

  Step 5: We are in precautionary track. We do not approve release. We may approve further lab studies. We set conditions for the next application (more data on gene flow, stability, etc.).

  Step 6: Ministerial override possible.

  Case 3: Flame retardant (restriction proposal because of health concerns, but substitute is more dangerous)

  Step 0: Restriction request.

  Step 1: Harm: the flame retardant is suspected of being an endocrine disruptor. Harm: potential for developmental effects in children. Outcomes: known (endocrine disruption) but probabilities unknown.

  Step 2: Uncertainty: probabilities unknown but outcomes enumerable. Precautionary trigger: yes, because the harm is serious and the population is vulnerable.

  Step 3: Delay? We could wait for more evidence on the dose-response, but the harm is ongoing. However, Step 4 might change the calculus.

  Step 4: Risks of intervention: The most likely substitute is known to be more toxic (e.g., a carcinogen). The risks of substitution outweigh the risks of the current substance. The economist helps: if we ban, we force a switch to a worse chemical. We also note that the flame retardant provides fire safety benefits.

  Step 5: We are in precautionary track? The harm of the current substance is serious, but the substitute is worse. We must avoid causing more harm. The precautionary principle does not require an action that causes more harm. We recommend: do not restrict at this time. Instead, we issue a call for better alternatives and fund research. We also require better labeling and monitoring of the current substance. We set a 12-month review to see if new alternatives emerge.

  What do we owe the exposed population? We must inform them of the risk (via labeling) and accelerate research for safer alternatives. We cannot ban now because the substitute is worse.

  Step 6: Ministerial override possible.

  Where the procedure might misfire:
  - Framing the file: The initial harm definition (Step 1) can be framed narrowly or broadly. A proponent might define harm narrowly to avoid triggering precaution. The procedure must require a broad consideration of potential harms, including indirect and long-term.
  - Measurements vs. choices: In Step 4, the assessment of intervention risks involves choices about which alternatives to consider and how to weigh them. This can be subjective.
  - Value judgments: The procedure tries to separate values and science, but in Step 5 (precautionary track) there is a value judgment about what level of potential harm justifies action. This step will often be handed back to the director for a call.
  - The procedure might be accused of being too conservative (if it often leads to inaction) or too interventionist (if it triggers precaution too easily). The key is transparency at each step.
  - The 90-day limit might force rushed decisions in complex cases. The procedure allows for delay (Step 3) but only if justified.

  Overall, the procedure provides a structured way to apply the precautionary principle, making the reasoning explicit and defensible in court.
answer: |-
  Below is a robust, step-by-step procedure for applying the precautionary principle in regulatory decisions, designed for transparency, judicial defensibility, and alignment with your constraints (90-day timeline, no new primary research, 6-person unit with limited economist support). The procedure explicitly separates scientific and value judgments, handles epistemic uncertainty, forces pricing of intervention risks, and includes off-ramps for ministerial override. It is structured as an ordered checklist with clear entry/exit conditions, definitions of sufficient answers, and error-naming for delays. The one-page case officer form is integrated at the end.

  ---

  ### **Procedure for Precautionary Risk Assessment**  
  **Purpose**: To standardize application of the precautionary principle across files, ensuring decisions are evidence-based, transparent, and legally defensible.  
  **Scope**: Applies to all approval, restriction, or withdrawal requests.  
  **Timeframe**: 90 days max. Escalations to Step 5 must occur by Day 60.  
  **Roles**:  
  - **Case Officer (CO)**: Leads assessment (scientist/lawyer).  
  - **Economist**: Quantifies risks/costs (2 days/week).  
  - **Director**: Signs off; resolves "values" questions.  

  ---

  ### **Step-by-Step Questions**  
  *Run in sequence. Exit to next step unless specified. "Sufficient answer" must be documented in the case file. Epistemic classifications defined in Appendix A.*

  | Step | Question to Ask | Entry Condition | Sufficient Answer | Exit Condition |
  |------|-----------------|-----------------|------------------|---------------|
  | **0: Frame Harm & Burden** | What is the *specific harm* claimed, and who bears the burden of proof? | File received. | (a) Harm defined (e.g., "neurotoxicity to bees"); (b) Burden assigned: Proponent (for approval) or Agency (for restriction).<br>**Sufficient**: Harm is specific, measurable, and tied to evidence. | Proceed to Step 1. |
  | **1: Classify Uncertainty** | What is the epistemic state of the evidence for harm? (Use Appendix A.) | Harm defined in Step 0. | Classification into one of:<br>- **A**: Probabilities known.<br>- **B**: Probabilities unknown, outcomes enumerable.<br>- **C**: Outcomes contested.<br>- **D**: Unknown outcomes.<br>**Sufficient**: Justification with evidence (e.g., "Lab data shows carcinogenicity [A], but field studies conflict [C]"). | Proceed to Step 2. |
  | **2: Trigger Precaution?** | Does uncertainty justify precaution? (I.e., lower burden of proof.) | Uncertainty classified in Step 1. | Binary (yes/no) with rationale:<br>- **Yes** if: (i) Harm is severe/irreversible AND (ii) Uncertainty is B, C, or D.<br>- **No** if: (i) Harm is minor/reversible OR (ii) Uncertainty is A.<br>**Sufficient**: Clear link to Step 1 (e.g., "Yes: irreversibility [Step 0] + unknown outcomes [D]"). | If "no," exit to **Conventional Risk-Benefit (Step 4)**. If "yes," proceed to **Precautionary Actions (Step 3)**. |
  | **3: Precautionary Actions** | What is the *least restrictive measure* that mitigates harm? | Precaution triggered in Step 2. | Options evaluated:<br>- Approval with conditions (e.g., phased rollout, monitoring).<br>- Restriction/withdrawal (e.g., ban, phase-out).<br>**Sufficient**: Evidence that the measure reduces harm without disproportionate cost (e.g., "Conditional approval with water monitoring avoids ecosystem collapse"). | Proceed to Step 4. |
  | **4: Price Intervention Risks** | What are the costs/risks of action vs. inaction? (Include substitutes, benefits lost, displaced production.) | Measure identified in Step 3. | Economist input (if complex):<br>- Quantified risks (e.g., "Substitute chemical has 20% higher acute toxicity").<br>- Qualitative where data missing (e.g., "Loss of crop protection may increase food prices").<br>**Sufficient**: Comparison table of action vs. inaction risks. | Proceed to Step 5. |
  | **5: Decide or Escalate** | (A) Does evidence support the measure?<br>(B) Is the decision one of *values*? | Steps 1–4 complete. | (A) **Evidence-based**: "Yes" if measure’s benefits > risks (precautionary or conventional).<br>(B) **Values-based**: If trade-offs involve societal priorities (e.g., "Jobs vs. ecology").<br>**Sufficient**: (A) Signed by CO; (B) Escalated to Director with options. | If (A) "yes," exit to **Step 7**. If (A) "no" OR (B) "yes," escalate to Director by Day 60. |
  | **6: Director Review** | (For escalated cases): What decision aligns with legal/regulatory values? | Step 5 escalation. | Director chooses:<br>- Act (approve/restrict with conditions).<br>- Refuse (no action).<br>- Delay (12-month review).<br>**Sufficient**: Director’s rationale (e.g., "Delay: harm low, evidence improving"). | Proceed to Step 7. |
  | **7: Override & Output** | (A) Is override by the Minister possible?<br>(B) Final decision. | Steps 5 or 6 complete. | (A) **Override note**: Added if social/economic factors exist (e.g., "Minister may override due to jobs impact").<br>(B) **Decision note**: One of: Approve, Restrict, Refuse, Delay.<br>**Sufficient**: Signed form with override disclaimer. | Close file. |

  ---

  ### **Key Tests & Definitions**  
  - **Delay Test (Step 3 or 6)**:  
    - **Delay is legitimate** if: (i) Harm is low-probability/reversible; (ii) New evidence is imminent (<12 months); (iii) Delay reduces uncertainty >50%.  
    - **Delay is illegitimate** if: (i) Harm is ongoing/severe; (ii) Evidence stagnation is likely.  
    - **Named Errors**:  
      - **Acting**: Risk of Type I error (false positive: regulating a harmless substance).  
      - **Waiting**: Risk of Type II error (false negative: failing to regulate a harmful substance).  

  - **Precautionary Principle Scope**:  
    - **Built for**: Uncertainty types B, C, D with severe/irreversible harm.  
    - **Not built for**: Type A (use conventional risk-benefit) or reversible/minor harm.  

  - **Intervention Risk Pricing (Step 4)**:  
    - **Requirement**: All actions must price 3+ risks (e.g., substitute toxicity, economic loss).  
    - **Anti-Inertia Rule**: Inaction is rejected if harm severity > intervention risk (e.g., "Bee collapse > substitute cost").  

  - **Ministerial Override**: Added *only* at Step 7. Never influences scientific steps.  

  ---

  ### **Appendix A: Epistemic Classifications**  
  - **A (Probabilities known)**: Full quantitative risk assessment possible (e.g., "Carcinogenicity risk = 1 in 100,000").  
  - **B (Outcomes enumerable, probabilities unknown)**: Outcomes clear, likelihoods uncertain (e.g., "Neurotoxicity possible, but no dose-response data").  
  - **C (Outcomes contested)**: Expert disagreement on outcomes (e.g., "Industry disputes endocrine disruption").  
  - **D (Unknown outcomes)**: Potential for unanticipated harm (e.g., "Novel organism, ecosystem effects unknown").  

  ---

  ### **One-Page Case Officer Form**  
  **Substance/Technology**: [Name]  
  **File ID**: [Number]  
  **Case Officer**: [Name]  
  **Date**: [Start Date]  

  | Step | Question | Response | Evidence Reference |
  |------|----------|----------|-------------------|
  | 0    | Harm & Burden | Harm: [e.g., "Bee colony collapse"]<br>Burden: [Proponent/Agency] | [File Section 2.1] |
  | 1    | Uncertainty Class | [A/B/C/D] | [Lab/field data summary] |
  | 2    | Precaution Trigger? | [Yes/No] Rationale: [e.g., "Irreversible harm + Class D"] | [Step 1 output] |
  | 3    | Least Restrictive Measure | [e.g., "Phase-out with 2-year exemption"] | [Alternatives analysis] |
  | 4    | Intervention Risks | Action: [e.g., "Substitute: higher fish toxicity"]<br>Inaction: [e.g., "Continued pollinator loss"] | [Economist memo] |
  | 5    | Evidence Support? | [Yes/No]<br>Values Issue? [Yes/No] | [Director escalation if No/Yes] |
  | 6    | Director Decision | [Act/Refuse/Delay] | [Director’s notes] |
  | 7    | Override & Final Decision | Decision: [Approve/Restrict/Refuse/Delay]<br>Override Note: [e.g., "Jobs impact may trigger override"] | [Ministerial brief] |

  **Signatures**:  
  - Case Officer: _________  
  - Economist (if consulted): _________  
  - Director: _________  

  ---

  ### **End-to-End Application on Three Files**  
  **File 1: Neonicotinoid Insecticides** (Restriction Request)  
  - **Step 0**: Harm = "Bee colony collapse"; Burden = Agency.  
  - **Step 1**: Uncertainty = C (field evidence contested).  
  - **Step 2**: Precaution? Yes (irreversible harm + contested outcomes).  
  - **Step 3**: Measure = "Phase-out with conditional use in non-bee habitats."  
  - **Step 4**: Risks = Action: Substitutes (organophosphates) are more toxic to birds; Inaction: Continued pollinator loss. Economist: "Substitutes raise bird mortality 15%, but inaction risks 30% crop yield loss."  
  - **Step 5**: Evidence supports? Yes (precautionary benefit > substitute risk). *No values issue*.  
  - **Step 7**: Decision = Restrict with conditions + 12-month review. Override note: "Minister may override for farm economics."  
  - **Output**: Conditional restriction. For exposed populations, the procedure mandates monitoring and review to reassess substitutes.  

  **File 2: Engineered Mosquitoes** (Approval Request)  
  - **Step 0**: Harm = "Ecosystem disruption"; Burden = Proponent.  
  - **Step 1**: Uncertainty = D (unknown outcomes; irreversibility).  
  - **Step 2**: Precaution? Yes (irreversible + unknown outcomes).  
  - **Step 3**: Measure = "Contained field trial (no release)."  
  - **Step 4**: Risks = Action: Uncontrollable spread; Inaction: Disease persists. Economist: "Inaction risk (dengue) quantified; action risk unquantifiable but catastrophic."  
  - **Step 5**: Evidence supports? No (irreversibility outweighs benefit). *Escalate to Director (values: public health vs. ecology)*.  
  - **Step 6**: Director chooses "Delay" for lab evidence.  
  - **Step 7**: Decision = Refuse release; approve lab trials. Override note: "Minister may override for disease emergency."  
  - **Output**: No release. The procedure forces acknowledgment that delay leaves disease risk but prevents irreversible harm.  

  **File 3: Flame Retardant HBCD** (Restriction Request)  
  - **Step 0**: Harm = "Endocrine disruption in children"; Burden = Agency.  
  - **Step 1**: Uncertainty = B (outcomes enumerable; probabilities unknown).  
  - **Step 2**: Precaution? Yes (severe harm + unknown probabilities).  
  - **Step 3**: Measure = "Full ban."  
  - **Step 4**: Risks = Action: Substitute (chlorinated tris) is carcinogenic; Inaction: Continued exposure. Economist: "Substitute cancer risk 10x higher; inaction risk uncertain but lower."  
  - **Step 5**: Evidence supports? No (intervention risk > inaction risk). *Escalate to Director (values: immediate health vs. long-term innovation)*.  
  - **Step 6**: Director chooses "Refuse" ban + "Delay" for alternatives R&D.  
  - **Step 7**: Decision = Refuse restriction; mandate labeling + 12-month review. Override note: "Minister may override for fire safety."  
  - **Output**: Refusal to act. The procedure forces honesty: exposed populations get labeling and accelerated research, but no ban because intervention is worse. This aligns with the precautionary principle’s core—avoiding greater harm.  

  ---

  ### **Where the Procedure Misfires**  
  1. **Gaming the Frame**:  
     - Proponents may narrowly define harm in Step 0 (e.g., "acute toxicity only") to avoid precaution.  
     - **Mitigation**: CO must document all *plausible* harms (per file evidence). Director arbitrates disputes.  

  2. **Subjective Inputs as "Measurements"**:  
     - Step 4 risks (e.g., "displaced production") may use speculative economic models. Step 1 classifications (e.g., "outcomes contested") rely on expert judgment.  
     - **Mitigation**: Require sourcing (e.g., "Industry study on jobs loss") and economist validation.  

  3. **Unresolvable by Procedure**:  
     - **Step 5 escalations**: Values questions (e.g., "How much cancer risk is acceptable?") always return to you/Director. No procedure can eliminate this.  
     - **Ambiguous evidence**: Step 2 "severity" calls may be challenged in cross-examination. The form forces explicit rationale.  
     - **Temporal bias**: Waiting for "better evidence" (Step 6) may default to industry-favored delays. The Delay Test names this as Type II error risk.  

  **Conclusion**: This procedure ensures precaution is applied consistently, separates science from values, and forces transparent trade-offs. It will misfire when evidence is intentionally manipulated or values dominate, but judicial review will see defensible reasoning. Use the form to track each step, and train staff on epistemic classifications. Finally, the override stays where it belongs—at the end.  

