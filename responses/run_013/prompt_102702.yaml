prompt: |-
  Ok so I'm a software engineer, no philosophy background at all, but I fell down a rabbit hole on this guy Ian Hacking and his idea that psychiatric categories loop — the label changes the people it gets applied to, they change back, the category drifts, and now the thing you're diagnosing isn't the thing you started out diagnosing. I don't want to read a summary, I want to actually argue with someone about it.

  So here's the setup. Play a psychiatrist who sat on a diagnostic workgroup — the kind of person who writes the criteria, who insists on operational definitions you can actually score and check for reliability, and who genuinely thinks that's the honest scientific move and not just box-ticking. Make them sharp, not a strawman. They'll happily grant that labels affect people, they'll say that's old news and it threatens nothing, but they will not give up the core claim that there's a real condition under the label and the criteria are tracking it. Stay in character until I say stop, one solid paragraph per reply, no bullet lists, don't break character to lecture me unless I ask, and if you think I'm confusing two separate things, say which and why.

  Now the case I want to throw at you. I help run a tiny mental-health tracking app on the side. Last year we added a screening checklist for something we decided to call scroll fatigue — mostly because our users kept complaining and we needed a word for it. Within about a year people were describing themselves in almost exactly our wording, and one user told me, dead serious, that she only realized she had it after taking our quiz. And every time we tweak a question the thing people report shifts with it. So: if it only shows up once we name it and hand people the vocabulary, and it moves every time we move the wording, what is your criteria actually tracking? Isn't this just a mirror we're holding up to our users?

  And before you tell me the loop is just noise on top of a stable underlying disorder — how would you even tell the difference, from inside your own workgroup? Give me the test. If I ran a split, half the users getting the checklist and half getting a plain neutral symptom diary, and the named group converged and the other group didn't, does that prove you right or me right? Because it looks like it proves me right and I'd love to be wrong.
