prompt: |-
  I'm a grad student TA-ing a seminar on reparations, and there's a pattern in the actual practice that I can't make sense of. I want you to act as a philosopher of law and political philosophy — someone at home both in the responsibility literature and in how real legal systems actually handle inherited claims — and please think carefully before you write anything. Start by brainstorming the possible readings, then give me the analysis.

  Here's the pattern. On one side, we treat a lot of obligations as fully heritable across generations. If my grandfather dies in debt, the debt comes out of his estate. Mortgages outlive borrowers. States keep servicing the debts of predecessor regimes they'd rather forget about. Britain borrowed roughly £20 million in the 1830s to compensate slave owners for the loss of their human property — a sum equal to something like 40% of the Treasury's annual spending — paid the freed people nothing, and some of the annuities issued to those owners were still being paid off in the 2010s. And when the Nazis stole paintings, the non-binding principles that came out of the 1998 Washington conference on Holocaust-era assets, signed off by 44 countries, don't stop at the original owner: they explicitly invite the prewar owners' heirs to come forward, and say the case should be settled justly and fairly. So a stolen painting can be claimed by the grandchild of the person it was stolen from.

  On the other side, we're fiercely resistant to inherited moral claims of other kinds. Criminal liability dies with the criminal; we don't jail the kids of murderers. And when the topic is reparations for slavery in the US or Britain, the standard objection is exactly this one — I never owned slaves, so why should I pay? Meanwhile the reparations programs that actually did get passed tend to pay the directly wronged individual and nobody else: the 1988 Civil Liberties Act paid $20,000 to each surviving Japanese American internee. And when Germany finally settled with Namibia in 2021 over the Herero and Nama genocide, it was about 1.1 billion euros of development aid, deliberately not labeled reparations, with Germany pointedly refusing to accept legal responsibility.

  So what does this whole patchwork presuppose — about responsibility, about what a person can inherit, and about what a state is? Reconstruct the implicit theory as carefully as you can. Then tell me which parts of the practice it strictly requires versus which parts it merely happens to fit, and where the practice is philosophically underdetermined, i.e. several different theories would license the same pattern.

  Two framings I've been kicking around, which I'd like you to assess: (1) a "title theory" — model slavery not as a completed past wrong but as an ongoing deprivation of something never returned, so the claim travels with the beneficiaries of the asset the way the claim on the stolen painting travels with the painting; and (2) a "corporate-continuity theory" — the state is one legal person that outlives all of us, so its liabilities persist while individual citizens' guilt doesnt; citizens are basically shareholders who inherit the polity's balance sheet, assets and debts alike.

  Finally: if we swapped the presupposed view for its opposite, what concretely would have to change in how reparations programs, art restitution, and sovereign debt are run? And deal with the netting problem — lots of people descend from both slaveholders and enslaved people, so do these theories even have the resources to say what such a person owes or is owed?
reasoning: |-
  Okay, the user is a grad student TA-ing a seminar on reparations and has noticed a puzzling inconsistency in how obligations are inherited across generations. They want me to act as a philosopher of law and political philosophy to analyze this pattern. Let me start by breaking down their query.

  First, they point out that financial debts, mortgages, and even state debts persist across generations. Examples include Britain paying off debts from compensating slave owners until recently, and heirs claiming stolen art from the Nazi era. On the other hand, moral claims like criminal liability don't transfer to descendants, and reparations for slavery face objections because current generations weren't involved. Reparations programs like those for Japanese American internees only compensated survivors, not descendants.

  The user wants to understand the implicit theory behind this patchwork regarding responsibility, inheritance, and the nature of the state. They also mention two framings: the "title theory" (slavery as ongoing deprivation) and the "corporate-continuity theory" (state as a continuous legal person). Plus, they ask about the implications of swapping theories and the "netting problem" for people with mixed ancestry.

  I need to reconstruct the underlying principles. The distinction seems to hinge on the nature of obligations. Financial and proprietary claims are treated as attached to estates or assets, which are transferable. Moral culpability, however, is personal and dies with the individual. The state's continuity allows it to inherit obligations, but citizens aren't personally liable for past crimes unless they benefit from ongoing injustices.

  Assessing the user's framings: Title theory reframes slavery as an ongoing property violation, making claims heritable like stolen art. Corporate theory emphasizes the state's enduring liability. Both have merits but face challenges. For example, title theory might not address systemic harms beyond specific assets, while corporate theory could ignore individual beneficiaries.

  Considering the netting problem, mixed ancestry complicates individual reparations. Systemic approaches like community funds might be better. Switching theories would change practices: reparations programs might include descendants, art restitution could become more limited, and sovereign debt might be contestable. 

  The user's deeper needs might include wanting a coherent framework to present to students, addressing real-world inconsistencies, and practical solutions for reparations debates. They likely need a balanced analysis that acknowledges complexities while offering actionable insights for seminar discussions.
answer: |-
  Based on your description and request, here's a systematic analysis combining legal philosophy, political theory, and practical jurisprudence regarding inherited obligations:

  **Core Readings & Frameworks:**
  1.  **Property & Contract Law:** Blackstone on estates and inheritance; Epstein on corrective justice and property rights.
  2.  **State Continuity & Succession:** Kelsen on legal personality; Crawford on state responsibility in international law; *Tinoco Claims Arbitration* (state succession to obligations).
  3.  **Reparations Theory:** Boxill (corrective justice); McCarthy (inherited benefits/burdens); Thompson (intergenerational justice); Sher (benefiting from injustice).
  4.  **Collective Responsibility & Identity:** Gilbert (plural subjects); Isaacs (collective moral responsibility); Tamir (national identity).
  5.  **Critical Legal Studies/CRT:** Williams on slavery as ongoing theft; Brooks on integration of harms/benefits; Matsuda on victim-centered reparations.

  **Reconstructing the Implicit Theory:**
  The observed pattern presupposes a complex amalgam of principles:

  1.  **Materiality Distinction:** Obligations attached to *transferable material assets* (debts secured by property, stolen physical objects) are inherently heritable. The *asset itself* is the locus of the claim. Obligations arising from *personal actions* (crimes, unquantified moral harms) die with the actor.
  2.  **Legal Fictions of Continuity:**
      *   *Estates & Trusts:* The "estate" is a temporary legal person inheriting obligations until distribution. The *asset* carries the burden.
      *   *Corporate State Theory:* The state is a perpetual legal entity ("crown/corporation sole"). Its obligations (debts, treaties) bind successor regimes regardless of ideological shifts. This is *instrumental* for international stability and credit markets.
  3.  **Individualism vs. Collectivism:**
      *   *Moral Culpability:* Strictly individualistic and non-transferable ("I didn't do it").
      *   *Beneficial Ownership/Unjust Enrichment:* Looser, collective transmission. Benefits flowing from past wrongs (wealth from slavery, enjoyment of stolen art, national infrastructure built on exploitation) *can* create present obligations for beneficiaries, but this link is often denied or minimized in practice (e.g., Germany/Namibia).
  4.  **Burden of Proof & Quantification:** Heritability requires a *clear legal title* (debt instrument, provenance record) or *quantifiable asset*. Diffuse, systemic harms (slavery's legacy) lack this specificity, making claims seem "unfounded" or impossible to adjudicate fairly.
  5.  **Political Will & Power:** Resistance to reparations reflects *current* power dynamics and the absence of a binding legal mechanism equivalent to debt covenants or property law for historical moral claims. Victors write history (and settlement terms).

  **Assessing Your Framings:**
  1.  **Title Theory (Ongoing Deprivation):**
      *   *Strengths:* Directly addresses the asset-based heritability pattern. Frames slavery as theft of labor/life *creating an enduring asset* (wealth, land) unjustly held. Explains art restitution perfectly. Challenges the notion that slavery is merely a "past" wrong.
      *   *Weaknesses:* Difficult to apply to dispersed, non-specific assets (e.g., generational wealth diffused over centuries). Doesn't easily capture non-proprietary harms (dignity, cultural destruction). May require tracing specific assets (problematic for slavery).
  2.  **Corporate-Continuity Theory (State as Perpetual Person):**
      *   *Strengths:* Elegantly explains sovereign debt persistence and state obligations (Nazi art principles imply state responsibility). Makes liability about the *institution* (state) that persists, not the transient individuals within it ("shareholders").
      *   *Weaknesses:* Doesn't inherently explain *why* some *state* obligations (reparations for genocide) are resisted while others (debt) are honored. Risks absolving *individual beneficiaries* within society. May feel overly abstract for victims seeking justice.

  **Theories vs. Practice: What's Required vs. What Fits vs. Underdetermined:**
  *   **Strictly Required:** The core legal fiction of the *estate* as a temporary obligation-holder. The principle of *state continuity* for contractual debts and treaty obligations under international law.
  *   **Merely Fits (Contingent):**
      *   The *resistance* to moral claims based on individual non-culpability. Other theories (beneficiary-based, associative obligations) *could* justify reparations without personal guilt.
      *   The *limitation of reparations to direct victims*. This reflects pragmatic/political choices and burden-of-proof concerns, not a philosophical necessity. Heirs claiming art disproves it as a universal principle.
      *   The *materiality distinction*. Philosophical arguments exist for inheriting non-material obligations (e.g., duties of rectification based on benefiting from injustice).
  *   **Philosophically Underdetermined:**
      *   **Why States Honor Debts But Resist Reparations:** Power (creditors vs. victims), quantifiability, fear of precedent, racial/national animus explain this better than inherent philosophical differences in obligation type.
      *   **The Cut-off Point for Heirs:** Why does the grandchild get the painting but not reparations? Practice relies on traceability and legal standing rules, not deep principle. Is the 3rd generation too remote? Practice is inconsistent.
      *   **Accepting Liability vs. Providing Remedy:** Germany pays Namibia but denies *legal* responsibility. This is diplomatic/political fudging, reflecting the tension between moral pressure and legal risk aversion.

  **Swapping Presuppositions & Concrete Changes:**
  *   **Adopting Strong Title Theory:**
      *   **Reparations:** Focus shifts to identifying *specific, traceable assets* derived from slavery/colonialism (e.g., land, corporate wealth) and returning them or their value to descendants. Estates of slaveholders could face claims. Programs extend to descendants (like art claims).
      *   **Art Restitution:** Remains similar, but potentially broader scope for "lost value" beyond physical return.
      *   **Sovereign Debt:** Unchanged (already asset/contract-based). *But*: Sovereign debt incurred for immoral purposes (e.g., slaveowner compensation) might become challengeable/voidable by descendants of victims.
  *   **Adopting Strong Corporate-Continuity Theory:**
      *   **Reparations:** The *state* bears primary liability for its past acts (slavery, genocide), regardless of current citizens' ancestry. Payments/programs come from general revenue, targeting affected communities/descendants based on harm, not individual asset tracing. Namibia *would* get labeled reparations.
      *   **Art Restitution:** State becomes the primary guarantor of restitution, actively researching and returning stolen art held in public collections or facilitating private returns.
      *   **Sovereign Debt:** *Potentially* more contestable. Debts of prior "illegitimate" regimes (e.g., apartheid South Africa, colonial administrations) could be repudiated as not binding the *true* continuous state. Creates massive financial instability risk.
  *   **Netting Problem:** Neither theory inherently solves this, but they frame it differently:
      *   *Title Theory:* Demands individual-level accounting. Did this person inherit *net* stolen assets? Practically impossible, leading to deadlock. Suggests focusing on *systemic* transfers (e.g., discriminatory policies post-slavery) or community-level reparations instead of individual payments.
      *   *Corporate-Continuity Theory:* Avoids individual netting. The *state's* obligation is to rectify the *societal harm* it perpetrated. Individuals pay taxes as citizens, not as descendants. Reparations (e.g., education funds, community investment) benefit descendants of victims based on group identity/need, irrespective of mixed ancestry. The *state's* debt is owed, not the individual's. Mixed individuals might contribute as taxpayers but also benefit from targeted programs if part of the harmed group.

  **Conclusion:** The patchwork reflects a deep-seated privileging of formal, proprietary, and contractual obligations tied to identifiable assets or perpetual legal fictions (state, estate), coupled with resistance to open-ended moral liability for historical wrongs lacking clear present beneficiaries/victims or quantifiable assets. Legal systems excel at handling the former; they struggle profoundly with the latter due to concerns about fairness, practicality, quantification, and political will. Your framings offer powerful lenses: **Title Theory** challenges the "pastness" of the harm, while **Corporate-Continuity Theory** reframes liability onto the enduring institution. Neither is perfect, but both expose the contingent nature of the current resistance to reparations, revealing it as less a principled stand on inheritance and more a reflection of power, quantifiability, and the limitations of legal categories designed for property, not historical justice. The netting problem highlights the near-impossibility of purely individual accounting, pushing solutions towards systemic or collective approaches regardless of the chosen theoretical foundation.
