prompt: |-
  I am a novelist, a little over two-thirds of the way through a book set in a provincial town in the winter of 1918 — influenza, the armistice, a family that has already lost one son and does not yet know that it has lost a second — and the research has turned into a standing argument with the two people who read my drafts. The first is a retired historian of the period, who holds that the whole business of explaining the past is retrospective in a way that ought to make us modest, and who reaches for the Monday-morning quarterback whenever he wants to make the point: the fellow in the armchair who knows how the game ended and therefore finds every call obvious. He uses it to license a strong conclusion — that we cannot fairly judge the people of 1918 at all, that "they could not have known" is very nearly always true, and that the historian's confident causal narrative is therefore a species of cheating dressed up as explanation. My second reader, a screenwriter, pushes from the other side: she says the historian and I are in the same trade, that a causal account of the past is a plot imposed after the fact on material that had no plot in it, and that the only real difference between her screenplay, my novel and a scholarly monograph is the footnotes. I am fairly sure those are two different claims, and that the quarterback is carrying at most one of them — possibly not even that one. I would like the analogy audited rather than admired.

  So please do the following. Set out the correspondence between the quarterback story and the historian's situation: say what plays the quarterback, the coach, the play call, the information available at the snap, the scoreboard, the rulebook, the game film, and the Monday critic. Then say where the mapping fails, and be specific about which failures matter for the conclusion my historian friend wants to draw and which are merely decorative. I would particularly like you to sort out four things that seem to me to get run together. First, the difference between what was unforeseen and what was unforeseeable — I keep hearing the two used interchangeably and I don't believe they are. Second, the fact that a later writer can sometimes state a truth about an event that no contemporary could have stated, as when we say that the killing of an archduke in Sarajevo started the First World War: a sentence nobody could have written that week, and not a fiction either, so I don't see how the historian's plot is simply invented (I have seen the phrase "narrative sentence" used for this, though I can't remember where). Third, the difference between explaining an outcome and grading a decision, which the quarterback metaphor seems to blur. Fourth, the difference between hindsight bias — a documented failure of memory and judgment that makes people sincerely believe they knew it all along — and the narrative fallacy, which is a complaint about the form of an explanation rather than about its truth. Then tell me whether either of my readers can get what she or he wants out of the analogy, and what a better analogy would be if there is one. Two I have wondered about: the chess annotator, who may call a move a blunder but only by reference to what was on the board and what a player of that strength could reasonably see; and the coroner, who is permitted to state a cause of death without allocating blame. I don't need either of them endorsed — I want to know what each buys and what it costs.

  Give me the audit in prose, at whatever length the job actually needs, and then repeat its upshot as a single JSON object with exactly these fields: "analogy" (one sentence naming the analogy and the conclusion it is being asked to license); "correspondence" (an array of objects with "source", "target", "holds" — "yes", "no" or "partly" — and "note", one sentence each); "disanalogies" (an array of objects with "feature", "why_it_matters" and "verdict", where the verdict is "harmless" or "fatal" according to whether the conclusion survives without that feature); "smuggled" (an array of strings, each a premise the analogy imports without arguing for it); "readers" (an object with "historian" and "screenwriter", each containing "supported" — "yes", "no" or "partly" — and "why"); "better_analogy" (an object with "analogy", "what_it_fixes" and "what_it_still_gets_wrong"); and "bottom_line" (one sentence, no hedging, on what the analogy can and cannot carry).
reasoning: |-
  Hmm, the user is a novelist working on a historical book set in 1918, dealing with the Spanish flu, WWI armistice, and family tragedy. They're having debates with two readers: a historian who argues we can't judge past people because "they couldn't have known," and a screenwriter who claims all historical narratives are constructed plots. The user wants me to audit the historian's "Monday-morning quarterback" analogy to clarify these disagreements.

  Let me break down the quarterback analogy first. The quarterback represents historical actors making decisions with limited information. The coach is like leaders or societal structures. The play call equals specific actions taken. Information at snap? That's the incomplete data available at the time. The scoreboard is the outcome of events. The rulebook maps to social norms/laws. Game film is historical evidence. The Monday critic? That's the historian judging with hindsight.

  Now for the disanalogies that actually matter for the historian's argument. Foremost is the difference between unforeseen (what didn't happen but could have) versus unforeseeable (truly impossible to predict). The historian conflates these to claim we can't judge anyone, but that's fatal to their position because some things were foreseeable with reasonable effort. Then there's "narrative sentences" - truths we can state now (like the Archduke's assassination starting WWI) that weren't knowable then. This isn't invention, it's retroactive pattern recognition, which challenges both readers: the historian's modesty claim and the screenwriter's "all plots are fiction" stance.

  The quarterback analogy also dangerously blurs explaining outcomes versus grading decisions. In football, criticism focuses on decision quality given available info, not just results. But the historian uses the analogy to reject all judgment, when really we should separate causal analysis from moral condemnation. And hindsight bias (misremembering what we knew) differs from narrative fallacy (imposing story structures); the analogy masks this by making all retrospection seem equally suspect.

  As for what each reader gets from this: the historian partly succeeds in warning against presentism but fails because the analogy overextends to forbid all evaluation. The screenwriter wrongly uses it to claim all narratives are equally constructed, ignoring that historical explanations constrain possible "plots" through evidence.

  For better analogies: the chess annotator works well because it distinguishes between what was visible on the board (available information) and what a player should have seen (foreseeability), allowing criticism without hindsight contamination. The coroner analogy cleanly separates cause-finding from blame-assigning. Both fix key flaws but have limitations - chess still has defined rules unlike life's chaos, and coroners deal with physical evidence not interpretive gaps.

  Bottom line: this analogy usefully warns against hindsight bias but becomes toxic when stretched to claim we can't judge foreseeability or construct valid causal narratives. It should be retired for more precise tools.
answer: |-
  ## Audit of the Monday-Morning Quarterback Analogy for Historical Judgment

  The Monday-morning quarterback analogy, as employed by your historian friend, aims to license the conclusion that **we cannot fairly judge the decisions and actions of historical actors (like those in 1918) because our knowledge of the outcome grants us an unfair, retrospective clarity that obscures what was genuinely knowable and foreseeable at the time.** It equates historical explanation with cheating hindsight.

  ### Correspondence Mapping
  | Source (Football)             | Target (History)                     | Holds | Note                                                                 |
  | :---------------------------- | :----------------------------------- | :---- | :------------------------------------------------------------------- |
  | **Quarterback**               | Historical Actor / Decision-Maker    | Yes   | The individual making consequential choices under pressure.          |
  | **Coach**                     | Leaders / Institutions / Structures  | Partly | Authority figures setting context, but less direct control in history. |
  | **Play Call**                 | Specific Decision / Action Taken     | Yes   | The chosen course of action at a critical moment.                    |
  | **Information at the Snap**   | Information Available Contemporarily | Yes   | The incomplete, ambiguous data known *at the moment of decision*.   |
  | **Scoreboard (Final)**        | Historical Outcome                   | Yes   | The known result (e.g., war loss, pandemic death toll, armistice).  |
  | **Rulebook**                  | Social Norms / Laws / Constraints    | Partly | Establishes boundaries, but historical "rules" are fluid and contested. |
  | **Game Film**                 | Historical Evidence / Records        | Partly | Provides data, but is often fragmentary, biased, and incomplete.     |
  | **Monday Critic**             | Historian                           | Partly | The figure analyzing *after* the outcome is known.                  |

  ### Critical Disanalogies & Why They Matter
  | Feature                                          | Why It Matters                                                                 | Verdict  |
  | :----------------------------------------------- | :----------------------------------------------------------------------------- | :------- |
  | **Foreseeable vs. Merely Unforeseen**            | The analogy conflates *unforeseen* (didn't happen) with *unforeseeable* (couldn't reasonably be anticipated). Historians *can* assess what was foreseeable based on available info/trends. | **Fatal** |
  | **Existence of "Narrative Sentences" (Truths Only Visible Later)** | The analogy implies all post-hoc explanation is "cheating." But statements like "The assassination triggered WWI" are *true* descriptions of causal chains only visible in retrospect, not mere fictional plots. | **Fatal** |
  | **Explaining Outcome vs. Grading Decision**      | The analogy blurs these. The critic grades the *QB's decision* based on info *at the snap*. Historians can explain *why an outcome happened* (using later knowledge) *without* necessarily condemning actors for not foreseeing it. | **Fatal** |
  | **Hindsight Bias vs. Narrative Fallacy**         | Hindsight bias (misremembering prior knowledge) is a cognitive error. The narrative fallacy critiques imposing *story structure* on inherently chaotic events. The analogy treats all retrospection as biased fallacy, denying valid causal analysis. | **Fatal** |
  | **Single, Defined Game vs. Unfolding Chaos**     | Football has clear rules, objectives, and endpoints. History is open-ended, with innumerable interacting forces and no defined "end zone." | Harmless |
  | **Immediate Feedback vs. Long-term Causality**   | QBs see results of plays quickly. Historical actors rarely see the full consequences of their actions. | Harmless |
  | **Perfect Information (Film) vs. Imperfect Evidence** | Game film shows everything. Historical evidence is always partial and interpreted. | Harmless |

  ### Smuggled Premises
  1.  **All retrospection is inherently biased/fallacious.** (Denies the possibility of valid "narrative sentences").
  2.  **Foreseeability is impossible to assess retroactively.** (Ignoires distinguishing foresight based on contemporary knowledge).
  3.  **Explaining an outcome *requires* morally judging the actors.** (Conflates causation and blame).
  4.  **Historical actors operated in a complete vacuum of predictive possibility.** (Exaggerates the opacity of the past).

  ### Reader Support via Analogy
  *   **Historian:**
      *   **Supported:** Partly.
      *   **Why:** The analogy *effectively illustrates the danger of hindsight bias* and the different epistemic position of the later analyst. It supports his *modesty* about judging individuals for not knowing specific future outcomes (like the exact death of a son). It succeeds in showing why "they could not have known [*that specific outcome*]" is often true.
  *   **Screenwriter:**
      *   **Supported:** No.
      *   **Why:** The screenwriter uses the analogy to claim *all* causal accounts (history, novel, screenplay) are *equally* constructed plots. The analogy *fails* to support this because it smuggles in the premise that the historian's *retrospective causal claim* (like the QB critic's judgment) is *inherently invalid* ("cheating"). The screenwriter needs to argue that *all* plots are *fictions*, regardless of evidence constraints. The analogy doesn't demonstrate that historical "game film" (evidence) imposes *no* constraints differentiating a scholarly monograph from a screenplay.

  ### Better Analogies
  *   **Analogy:** Chess Annotator
      *   **What it Fixes:**
          *   Clearly separates **information on the board** (known to both players/contemporaries) from **foreseeable consequences** (what a player of that strength *should* have seen/calculated).
          *   Allows "blunder" judgment based *only* on what was visible/knowable *at the time*.
          *   Distinguishes explaining *why a position was lost* (using later analysis) from grading *the quality of the move*.
          *   Acknowledges complexity and skill levels.
      *   **What it Still Gets Wrong:**
          *   Chess has defined rules and perfect information visibility. History is messier.
          *   Less intuitive for non-players than football.
          *   Less direct emphasis on the *temporal gap* between decision and outcome analysis.
  *   **Analogy:** Coroner
      *   **What it Fixes:**
          *   Radically separates **causal explanation** ("Cause of death: gunshot wound to the heart") from **moral/legal judgment** ("Who pulled the trigger? Was it justified?").
          *   Focuses on *establishing what happened* based on evidence available *after the fact*, without implying the deceased "should have known" they would be shot.
          *   Emphasizes evidence-based reconstruction.
      *   **What it Still Gets Wrong:**
          *   Too clinical; misses the human deliberation and choice inherent in historical action.
          *   Primarily deals with physical, proximate causes, less so with complex social, political, or long-term causal chains.
          *   Doesn't directly address foreseeability by the actor themselves.

  ### Bottom Line
  The Monday-morning quarterback analogy effectively warns against the *hindsight bias* of condemning historical actors for not knowing specific future outcomes, but it **fataly overextends** by smuggling in the premises that (1) foreseeability based on contemporary information cannot be assessed, (2) all retrospective causal explanation is fallacious "cheating," and (3) explaining outcomes necessitates unfair moral judgment, thereby invalidating the core task of historical explanation.

