  The origins claim (Darwinian processes), the constitution claim (current state as mere competences), and the explanatory claim (no added predictive value). They're particularly suspicious about (b) being smuggled in via (a) and (c), which is astute - that's exactly the sort of move Dennett critics often challenge.

