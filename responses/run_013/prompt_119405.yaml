  #### Leaves (Final Positions)  
  Each leaf includes:  
  - **Position name** (standard if exists; "unnamed" otherwise).  
  - **Embarrassing commitment** (one sentence exposing a counterintuitive implication).  

  1. **A1aY → Unnamed**  
     - Embarrassing: Imprecision licenses reckless bets in catastrophic scenarios if the interval midpoint is favorable.  
  2. **A1aN → Unnamed**  
     - Embarrassing: Catastrophic risk never alters rational choice, even when ambiguity magnifies potential loss.  
  3. **A2aY → Unnamed**  
     - Embarrassing: Learning irrelevant evidence can rationally make you *more* uncertain about a proposition.  
  4. **A2aN → Unnamed**  
     - Embarrassing: Irrelevant evidence must not affect imprecision, even if it psychologically destabilizes your judgment.  
  5. **A2bE → E-admissibility**  
     - Embarrassing: Agents may choose dominated options if some credence in the set justifies it.  
  6. **A2bM → Maximality**  
     - Embarrassing: In cycles of dominance, no option is permissible, paralyzing decision-making.  
  7. **A2bW → α-Maximin or Risk-Weighted Minimax**  
     - Embarrassing: Extremely pessimistic choices are required even when ambiguity is mild.  
  8. **A3aY → Unnamed**  
     - Embarrassing: Betting behavior flips based on stakes, revealing that "credence" is context-dependent.  
  9. **A3aN → Unnamed**  
     - Embarrassing: Rational agents ignore catastrophic outcomes when evaluating ambiguous bets.  
  10. **B1aY → Unnamed**  
      - Embarrassing: Objective evidence mandates risk-aversion, but only when losses are extreme.  
  11. **B1aN → Unnamed**  
      - Embarrassing: Evidence alone determines betting rules, making risk attitudes irrelevant to rationality.  
  12. **B2a → Permissive Sharpening**  
      - Embarrassing: Agents may arbitrarily sharpen to *any* credence, even those contradicted by evidence.  
  13. **B3a → Unnamed**  
      - Embarrassing: Publicly asserting a sharp credence can be irrational, even if it matches your private belief.  
  14. **A2aYC → Credal Convexity**  
      - Embarrassing: Imprecise states have sharp boundaries, but agents cannot access them.  

