  ### Decision Tree for Ambiguity and Imprecise Probability Seminar  
  **Starting Commitment:** A rational agent's doxastic state is not always adequately represented by a single sharp credence function.  

  **Tree Structure:**  
  - **6 branching levels**, **14 leaves** (within the 12–16 range).  
  - **Organization:** The tree isolates three questions:  
    1. **Nature of imprecision** (what it is a fact about: agent's state, evidence, world, or semantics).  
    2. **Action requirement** (what imprecision demands for decisions: sharpen first, use whole set, or underdetermination).  
    3. **Ascription reporting** (what an imprecise credence expresses: determinate interval, indeterminate state, set of odds, or refusal to commit).  
  - **Key Dependence:** The third question (ascription) constrains the first two, as it determines whether "imprecision" is a measurable state, a linguistic practice, or an epistemic limitation.  
  - **Unseparated Rules:** The tree distinguishes E-admissibility from maximality (they diverge for ≥3 options) but *cannot separate* risk-weighted minimax from α-maximin (behavioral failure: identical choices in all cases).  
  - **Unoccupied Combinations:**  
    - *Combination 1:* "Imprecision is a semantic fact (assertion-bound)" + "Actions require sharpening" + "Ascription reports refusal to commit."  
      - **Status:** Coherent but unattractive (semantic refusal clashes with decision sharpening).  
    - *Combination 2:* "Imprecision is objective evidence" + "Actions underdetermined" + "Ascription reports indeterminate state."  
      - **Status:** Coherent but unexplored (no theory bridges objective evidence with doxastic indeterminacy).  

  ---

  #### Decision Tree Outline  
  **Level 1: Two investigators case**  
  *(Theme: Nature of imprecision)*  
  Two investigators with identical evidence assign 0.4 and 0.6 to a hypothesis; neither overlooked anything. Is one mistaken?  
  - **A: Yes** → Imprecision reflects a defect in the agent's state.  
  - **B: No** → Imprecision is not about agent error (evidence/semantics/world).  

  **Level 2A (from A): Coin case**  
  *(Themes: Nature of imprecision, action requirement)*  
  A coin is fair or double-headed; you bet once with no further evidence. Is a credence of 0.5:  
  - **A1: An error** → Having a sharp credence is irrational.  
  - **A2: A permissible summary** → Sharpening is allowed.  
  - **A3: The wrong kind of state** → Agent should be imprecise.  

  **Level 2B (from B): Coin case**  
  *(Themes: Nature of imprecision, action requirement)*  
  Same as Level 2A:  
  - **B1: An error** → Agent should avoid sharp credences.  
  - **B2: A permissible summary** → Sharpening is allowed.  
  - **B3: The wrong kind of state** → Agent should be imprecise.  

  **Level 3A1 (from A1): Betting case (basic)**  
  *(Theme: Action requirement)*  
  You have credence [0.3, 0.7] in an event. A bet pays 2 if it occurs, costs 1 if not. Is accepting:  
  - **A1a: Permitted** → Action rules tolerate some risk.  
  - **A1b: Required** → Rules enforce accepting favorable bets.  
  - **A1c: Forbidden** → Rules avoid ambiguity-induced risk.  

  **Level 3A2 (from A2): Action under sharpening**  
  *(Theme: Action requirement)*  
  When choosing, must you:  
  - **A2a: Sharpen to *any* precise credence first** → Permissive sharpening.  
  - **A2b: Use a rule that consumes the whole set** → No sharpening.  

  **Level 3A3 (from A3): Betting case (basic)**  
  *(Theme: Action requirement)*  
  Same as Level 3A1:  
  - **A3a: Permitted**  
  - **A3b: Required**  
  - **A3c: Forbidden**  

  **Level 3B1 (from B1): Betting case (basic)**  
  *(Theme: Action requirement)*  
  Same as Level 3A1:  
  - **B1a: Permitted**  
  - **B1b: Required**  
  - **B1c: Forbidden**  

  **Level 3B2 (from B2): Action under sharpening**  
  *(Theme: Action requirement)*  
  Same as Level 3A2:  
  - **B2a: Sharpen to *any* precise credence first**  
  - **B2b: Use a rule that consumes the whole set**  

  **Level 3B3 (from B3): Betting case (basic)**  
  *(Theme: Action requirement)*  
  Same as Level 3A1:  
  - **B3a: Permitted**  
  - **B3b: Required**  
  - **B3c: Forbidden**  

  **Level 4A1a (from A1a): Catastrophe variant**  
  *(Theme: Action requirement)*  
  Same bet, but the worst end of [0.3, 0.7] leads to catastrophe. Does this change your answer?  
  - **A1aY: Yes** → Risk aversion affects decisions.  
  - **A1aN: No** → Risk-neutral despite catastrophe.  

  **Level 4A2a (from A2a): Widening with irrelevant evidence**  
  *(Theme: Nature of imprecision)*  
  You are imprecise about an event, then learn an outcome you judge irrelevant. May your credence widen?  
  - **A2aY: Yes** → Irrelevant evidence can increase imprecision.  
  - **A2aN: No** → Imprecision only decreases with evidence.  

  **Level 4A2b (from A2b): Decision rule for whole set**  
  *(Theme: Action requirement)*  
  Which rule governs choices?  
  - **A2bE: E-admissibility** → Permissible if maximizes EU for some credence in the set.  
  - **A2bM: Maximality** → Permissible if not dominated.  
  - **A2bW: Maximin/risk-weighted** → Minimize worst-case loss or weight risk.  

  **Level 4A3a (from A3a): Catastrophe variant**  
  *(Theme: Action requirement)*  
  Same as Level 4A1a:  
  - **A3aY: Yes**  
  - **A3aN: No**  

  **Level 4B1a (from B1a): Catastrophe variant**  
  *(Theme: Action requirement)*  
  Same as Level 4A1a:  
  - **B1aY: Yes**  
  - **B1aN: No**  

  **Level 5A2aY (from A2aY): Regress of imprecision**  
  *(Theme: Ascription reporting)*  
  An agent cannot say if her credence is [0.4, 0.6] or [0.35, 0.65]. Is this coherent?  
  - **A2aYC: Coherent, regress terminates** → Imprecision is bounded.  
  - **A2aYI: Incoherent** → States must be sharp at meta-level.  

  **Level 5A2bE (from A2bE): Sequence of choices case**  
  *(Theme: Action requirement)*  
  A rule licenses two choices that leave the agent foreseeably worse off than another licensed pair. Is this:  
  - **A2bER: A reductio of the rule** → The rule is flawed.  
  - **A2bED: Reason for a diachronic constraint** → Add time-consistency.  
  - **A2bEN: No objection** → Synchronic rules suffice.  

  **Level 6A2aYC (from A2aYC): Width of interval case**  
  *(Theme: Ascription reporting)*  
  One agent has interval [0.49, 0.51], another [0.1, 0.9]. Are these:  
  - **A2aYCS: Same state, different resolution** → Width is epistemic, not doxastic.  
  - **A2aYCD: Different states** → Width reflects distinct mental states.  

