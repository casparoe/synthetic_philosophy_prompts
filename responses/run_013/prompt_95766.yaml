prompt: |-
  I run a tiny interview show on a Discord server with a few friends, mostly engineers, we're all amateur philosophy nerds. Next weeks guest is a decision theorist who defends something she calls scale fanaticism, and I'm the one doing the interview. Here's her view as I understand it from her paper, so you don't have to go look anything up:

  - She thinks expected value maximization is the only rule in town, and she's happy to bite the bullet on it telling you to take any bet with a big enough payoff, however tiny the odds. That's the fanatical part, and she embraces it.
  - But she adds what she calls a usability floor. Probabilities you can't estimate to within a couple orders of magnitude, she says, arent really probabilities, they're placeholders. You're permitted to ignore prospects that live down there, though not required to.
  - She also thinks the usual fix of just capping utility (saying happiness or whatever tops out at some max) is a cheat, because the cap gets picked to dodge the conclusion rather than discovered anywhere.
  - The move that makes it interesting: she says the floor does not get you out of the big bets on the future. Her argument is that some outcomes aren't just huge numbers, they're structural — they change which game gets played at all, whether there's anyone left to play, whether the future is one kind of thing or another — and structural stakes don't get filtered by the floor even when the odds are absurd. She calls the difference the number/structure gap, and says it's why longtermism survives her floor while the standard one-off mugging case doesn't.

  Write me eight to ten interview questions. I want to press her, not have her restate the view. At least one question each on: (1) whether the number/structure gap is a real distinction or just a very big number with extra steps, (2) what happens to her view under the paralysis objection — if there's always a bet with more upside and worse odds, why would you ever stop looking? — and (3) how the floor behaves in the mugging case where some stranger offers an astronomically large payoff for a tiny stake. For each of those three, give me a follow-up keyed to the answer she's most likely to give, so I'm not stuck when she's smooth about it. Also throw in one question that uses an analogy from my world — a one-in-a-billion bug in production, or a really long-tail A/B test — to probe whether the floor is really about probability or about my ability to model the situation at all. And end on a closer about what evidence or argument would actually move her on the floor itself, since it sounds like she could just nudge it whenever it gets inconvenient. No reading lists please, I won't get through them.
reasoning: |-
  Okay, the user runs a small interview show on Discord with engineer friends who are into philosophy. Next week's guest is a decision theorist defending "scale fanaticism." I need to craft 8-10 sharp interview questions that press her on key points without letting her just restate her views. 

  First, let's unpack her position: She's an expected value (EV) maximizer who embraces extreme bets with tiny odds and huge payoffs ("fanaticism"). Her twist is a "usability floor" - probabilities too vague to estimate (beyond orders of magnitude) can be ignored. But crucially, she argues structural outcomes (like existential stakes) bypass this floor even with absurd odds, creating a "number/structure gap" that preserves longtermism while blocking Pascal's Mugging.

  The user wants specific pressure points:
  1. **Number/structure gap**: Is this distinction real or just rebranded big numbers?
  2. **Paralysis objection**: Why not endlessly chase higher-upside bets?
  3. **Mugging case**: How does her floor handle a stranger's astronomical payoff offer?
  Plus an engineering-flavored analogy about probability vs. modeling limits, and a closer on what evidence could shift her floor.

  Hmm... the user's crowd are engineers - I should tap into that mindset. For the analogy question, comparing her usability floor to debugging or A/B testing could resonate. Things like: "When we call a one-in-a-billion bug 'impossible,' is that about probability or our inability to model the system?" 

  For follow-ups, I need to anticipate her likely defenses:
  - On structure vs numbers: She'll probably say structural outcomes change the "game rules." Push back: "Isn't that just maximizing *meta*-EV?"
  - On paralysis: She might call it a practical heuristic. Counter: "Doesn't that reintroduce ad hoc boundaries?"
  - On mugging: She'll likely distinguish credible vs random payoffs. Challenge: "What makes structural claims inherently more credible?"

  The closer about evidence moving her is crucial - her floor risks being unfalsifiable. Ask: "Could any observation prove your floor too high/low?" to probe for anchors.

  ...Wait, the user hates reading lists, so no citations. Just pure dialectical thrust. Structure the Qs to flow: open with the core gap, hit paralysis/mugging, drop the engineering analogy, then end with the floor's flexibility.
answer: |-
  Here are 10 tightly focused interview questions designed to press key tensions in her view, including your requested themes and follow-ups. They avoid restatement and target the underlying mechanics:

  1. **On the Number/Structure Gap:**  
     "You argue structural stakes bypass the usability floor because they 'change the game itself.' But isn't every massive payoff *structurally* transformative by definition? If I offer you 10^100 happy lives for $5, doesn't that *become* a structural shift in the 'game' of existence? Why is this more than semantics?"  
     *Likely Reply:* She distinguishes "game-changing" from "within-game" payoffs (e.g., extinction vs. vast happiness).  
     **Follow-Up:** "If we’re maximizing expected value, why should the *type* of value matter? Isn’t EV maximization blind to qualitative categories? Doesn’t this smuggled-in distinction undermine the purity of fanaticism?"

  2. **On the Usability Floor & Modeling:**  
     "In engineering, we’d call a one-in-a-billion risk ‘effectively zero’ not because the probability is literally zero, but because we can’t model the path to failure. Is your floor really about *probability* or about the *epistemic impossibility of causal modeling*?"  
     *Likely Reply:* She’ll link it to Knightian uncertainty or unquantifiable states.  
     **Follow-Up:** "Doesn’t this collapse into saying we can ignore any outcome we can’t *imagine*? How do you prevent this from being a get-out-of-jail-free card for inconvenient large numbers?"

  3. **On the Paralysis Objection:**  
     "If fanaticism says there’s always a higher-EV bet with worse odds, why ever *stop* calculating? Doesn’t this demand infinite regress in option-generation, paralyzing action?"  
     *Likely Reply:* She’ll invoke bounded rationality or the floor as a practical filter.  
     **Follow-Up:** "But your floor is *permissive*—you’re *allowed* to ignore tiny probabilities, not *required* to. Doesn’t this mean a consistent fanatic *must* keep searching for those vanishingly probable universe-scale payoffs, making paralysis the rational default?"

  4. **On Pascal’s Mugging & the Floor:**  
     "A stranger says: ‘Give me $5 or I’ll simulate 10^100 tortured minds with my god-tech.’ Your floor says we can ignore absurdly speculative probabilities. Why does this mugging fail while an existential risk claim (e.g., asteroid deflection) with similarly tiny *known* odds pass through?"  
     *Likely Reply:* She’ll argue structural claims require credible models (e.g., physics for asteroids vs. magic for mugger).  
     **Follow-Up:** "Doesn’t this just shift the problem to judging which models are ‘credible enough’? What’s the principled difference between dismissing the mugger’s model and dismissing a fringe but coherent x-risk model?"

  5. **On the Illegitimacy of Capping Utility:**  
     "You reject utility caps as ‘cheats,’ but your usability floor feels like a *probability cap*—a de facto cutoff for considering outcomes. Isn’t this equally ad hoc? Why is one a cheat and the other a tool?"  
     *Likely Reply:* She’ll say the floor responds to epistemic limitations, while caps deny value realism.  
     **Follow-Up:** "If I cap utility *because* I can’t comprehend or model hyper-astronomical value, isn’t that functionally identical to your floor? Aren’t both pragmatic responses to human cognitive limits?"

  6. **On Longtermism’s Special Status:**  
     "You say longtermism survives the floor because it’s structural. But isn’t the key claim of longtermism that *small odds of vast future effects dominate EV*? Doesn’t your floor directly attack that if the odds are too speculative?"  
     *Likely Reply:* She’ll argue credible models (e.g., cosmology, evolutionary biology) justify longtermist probabilities.  
     **Follow-Up:** "Doesn’t this make your defense of longtermism contingent on today’s best models being ‘good enough’? What if superintelligence or undiscovered physics makes those models look as silly as Newtonian gravity in 2100?"

  7. **On the ‘Permission’ of the Floor:**  
     "The floor is permissive: we *can* ignore tiny probabilities but aren’t *obligated* to. Doesn’t this create wild incoherence? Two identical fanatics could rationally take opposite actions on the same bet—one embracing it, one ignoring it—based on arbitrary temperament. How is this defensible?"  
     *Likely Reply:* She’ll frame it as a feature (flexibility under uncertainty).  
     **Follow-Up:** "Doesn’t this permission undermine the core fanatical claim that EV maximization is the *only* rational rule? Now we have two rational choices: calculate fanatically *or* apply the floor."

  8. **On Engineering Analogies (A/B Testing):**  
     "Imagine an A/B test where Variant B promises a 0.0001% chance of *exponential* user growth. We’d run it forever because the payoff is huge, but we also know real systems have hidden failure modes. How does your floor help here? Or is this just a case where fanaticism forces us to chase noise?"  
     *Likely Reply:* She’ll say the floor applies if the probability/model is too vague.  
     **Follow-Up:** "But growth models *are* quantifiable, even if uncertain. Isn’t the real issue that the expected payoff is dwarfed by unmodeled tail risks (e.g., ecosystem collapse)? Doesn’t fanaticism blind us to this by focusing only on the best-case?"

  9. **On the Floor’s Behavior Under Scrutiny:**  
     "You’ve positioned the floor as a shield against fanaticism’s excesses, but it feels slippery. Could you ever encounter a bet so morally repugnant yet high-EV that you’d *lower* the floor to exclude it? What prevents the floor from being a moral intuition pump in disguise?"  
     *Likely Reply:* She’ll insist it’s purely epistemic, not moral.  
     **Follow-Up:** "But epistemic judgments aren’t value-free. If your floor rises to block repugnant conclusions (mugging) and lowers to enable favored ones (longtermism), how is this different from moral tailoring?"

  10. **Closer: On Moving the Floor:**  
      "What evidence or argument could convince you your usability floor is set *too high* (forcing us to consider absurdities) or *too low* (blinding us to crucial tail risks)? Or is the floor’s placement inherently unanchored, making it a ‘free parameter’ you adjust to avoid fanaticism’s worst bites while keeping its teeth?"  
      *Likely Reply:* She’ll appeal to cognitive science or decision theory precedents.  
      **Follow-Up:** "If the floor’s height isn’t dictated by the *math* of EV, and can shift without falsification, doesn’t that make fanaticism itself unfalsifiable? Any counterexample can be dismissed by adjusting the floor."

  **Key Angles Covered:**  
  - **Gap vs. Big Numbers:** Q1 & Follow-up challenge the gap’s fundamentality.  
  - **Paralysis:** Q3 & Follow-up force engagement with infinite regress.  
  - **Mugging:** Q4 & Follow-up test structural credibility.  
  - **Engineering Analogy:** Q8 roots probability vs. modeling in a concrete scenario.  
  - **Floor Flexibility:** Q9-10 directly confront the "nudge" risk.  

  These questions force her to defend the *coherence* of her synthesis rather than recite it. Good luck with the interview!
