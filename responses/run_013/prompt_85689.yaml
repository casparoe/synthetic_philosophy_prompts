  "Ladies and gentlemen, the argument that switching yields an expected value of 1.25a, regardless of the observed amount a, is a fallacy. The flaw lies in the assumption that, after seeing a, the other envelope is equally likely to contain a/2 or 2a. This assumption is not justified by any proper prior distribution over the amounts in the envelopes. 

  In reality, the probabilities that the other envelope contains a/2 or 2a depend on the prior distribution and the observed value a. We have shown that for the expected value to be 1.25a for every a, the prior would have to satisfy a condition that is impossible for a proper distribution. Therefore, the unconditional argument that switching should not matter because of symmetry is the correct one: without any information about the contents, the two envelopes are symmetric. 

