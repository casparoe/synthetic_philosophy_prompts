  The most delicate step in this argument is the assumption of a prior density and the derivation of the conditional probabilities. Some may argue that the prior is not defined or that we should use an improper prior. But even with an improper prior (like a uniform prior on the positive reals), we run into problems because then the expected values become infinite and the conditional probabilities are undefined. Therefore, we must assume a proper prior to have a well-defined problem.

  If I were forced to give up one step, it might be the assumption that the prior is defined by a density. In the discrete case we can still do the analysis and the conclusion holds. But the continuous case with a proper prior is the most general and shows that the condition for the 1.25a expectation is impossible to meet for every a.

  Thus, the verdict is that the paradox is a fallacy and not a genuine paradox.
