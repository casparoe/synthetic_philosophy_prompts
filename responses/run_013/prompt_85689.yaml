  ### Ines's Closing Argument on the Two-Envelope Paradox

  Ladies and gentlemen, we are gathered here to resolve a wager about the two-envelope problem—a puzzle that has tantalized and misled many. The argument presented claims that once you open an envelope and see an amount \(a\), the other envelope must contain either \(a/2\) or \(2a\) with equal probability, making the expected value of switching \(1.25a\). Thus, you should switch, and having switched, switch again, ad infinitum. I am here to demolish this argument, not with the familiar but flawed retort about priors, but by exposing the precise failure of conditional reasoning. The paradox is a fallacy, not a genuine mystery, and I will prove it.

  #### Candidate Diagnoses
  First, let us survey the battlefield. The common retort—that no prior distribution can make halving and doubling equally likely for every \(a\)—is insufficient. It attacks the prior but ignores the conditional reality of the observer who has seen \(a\). Another diagnosis suggests the problem is ill-posed without a specified prior, but this merely dodges the question. A third blames expected-value reasoning itself, claiming it is incoherent here—but that is a surrender to confusion, not a solution. The correct diagnosis, which I will defend, is that the assignment of equal probability to \(a/2\) and \(2a\) *after* seeing \(a\) is invalid. It is a mathematical error in conditional probability, arising from a misapplication of Bayes.

  #### The Core Fallacy
  The fatal step is this: upon seeing \(a\), the argument assumes that the other envelope contains \(a/2\) or \(2a\) each with probability \(1/2\), regardless of \(a\). This is false. The probabilities depend critically on the prior distribution of the smaller amount \(X\) (which we denote by its density \(f(x)\)) and the observed value \(a\). Let me show you why.

  When you observe \(a\), there are two scenarios:
  1. You hold the smaller envelope (\(S\)): then \(X = a\), and the other envelope holds \(2a\).
  2. You hold the larger envelope (\(L\)): then \(X = a/2\), and the other envelope holds \(a/2\).

  By Bayes’ theorem, the conditional probabilities are:
  \[
  P(S \mid a) = \frac{f(a)}{f(a) + \frac{1}{2} f(a/2)}, \quad P(L \mid a) = \frac{\frac{1}{2} f(a/2)}{f(a) + \frac{1}{2} f(a/2)}.
  \]
  The expected value of switching is then:
  \[
  E[\text{switch} \mid a] = P(S \mid a) \cdot 2a + P(L \mid a) \cdot \frac{a}{2}.
  \]
  The fallacious argument claims this equals \(1.25a\), which requires:
  \[
  \frac{2a f(a) + \frac{a}{4} f(a/2)}{f(a) + \frac{1}{2} f(a/2)} = \frac{5}{4}a.
  \]
  Simplifying, this implies:
  \[
  f(a) = \frac{1}{2} f(a/2) \quad \text{for all } a.
  \]
  But this equation is impossible for any proper prior. To see why, iterate it: \(f(2a) = \frac{1}{2} f(a)\), \(f(4a) = \frac{1}{4} f(a)\), and so on. The density \(f(x)\) must decay geometrically as \(x\) increases, yet integrate to 1 over \(x > 0\). This would require infinite density near zero or infinite mass at infinity—contradicting the definition of a probability distribution. Thus, the assumption of equal probabilities is mathematically incoherent. The step where the reasoning breaks is the unconditional assignment of \(P(a/2) = P(2a) = 1/2\) after seeing \(a\). It is not justified by any prior, and in fact, no prior can justify it for all \(a\).

  #### The Correct Treatment
  For a woman who has seen \(a\), the correct expected value depends on the prior. For example:
  - If \(f(x)\) is decreasing (e.g., exponential), then for large \(a\), \(P(L \mid a)\) is high (you likely hold the larger envelope), and switching is disadvantageous.
  - If \(f(x)\) is constant over an interval, the probabilities adjust locally, but never universally to \(1/2\).

  Unconditionally, symmetry holds: before opening either envelope, switching has expected value zero because the envelopes are identical in distribution. But upon seeing \(a\), symmetry is broken—not in favor of switching, but in a way that depends on \(f(x)\) and \(a\). The unconditional and conditional arguments part company exactly at the assignment of probabilities: symmetry gives \(P(S) = P(L) = 1/2\) unconditionally, but conditional on \(a\), \(P(S \mid a)\) and \(P(L \mid a)\) are not \(1/2\) unless \(f(a) = \frac{1}{2} f(a/2)\)—which never holds globally.

  #### Answering the Objection
  Now, to the objection from the far end: suppose the smaller amount is \(10\) or \(20\) with equal probability, so the pairs are \((10, 20)\) or \((20, 40)\). Does switching always seem beneficial? Let’s compute:
  - If you see \(10\), you must have the smaller envelope in \((10, 20)\). Switching yields \(20\)—a gain.
  - If you see \(40\), you must have the larger envelope in \((20, 40)\). Switching yields \(20\)—a loss.
  - If you see \(20\), it could be from \((10, 20)\) (large) or \((20, 40)\) (small), each with probability \(1/2\). Switching yields \(10\) or \(40\), so expected value is \(25\)—a gain of \(5\).

  Here, the switching argument appears to succeed for \(a = 20\) (yielding \(1.25a\)) but fails for \(a = 10\) (where it would erroneously predict \(12.5\), but the true value is \(20\)) and for \(a = 40\) (where it predicts \(50\), but the true value is \(20\)). This shows two things:
  1. The argument’s conclusion—switch regardless of \(a\)—is false. You should switch if you see \(10\) or \(20\), but not if you see \(40\).
  2. The apparent success at \(a = 20\) is a coincidence of the prior, not a universal law. It occurs because \(f(20) = f(10)\) here, but this is specific to this discrete prior. In general, the argument does not hold water.

  #### The Infinite Switching Nonsense
  What if you can switch any number of times? This adds nothing but confusion. After switching once, you have new information—you know what you held and what you now hold—so you must update your posterior. The naïve argument to switch again reapplies the same flawed probability assignment, ignoring this update. For example, if you see \(20\), switch to \(10\), and then reapply the fallacious \(1/2\)–\(1/2\) split, you would switch back to \(20\), then to \(10\), ad nauseam. But this is a cycle of errors, not a rational strategy. The first mistake is loud enough; repeating it only amplifies the folly.

  #### The Lesson
  The puzzle teaches us that expected-value reasoning is sound—but only when conditioning correctly. To condition on observed data, you must respect the prior and update via Bayes. Neglecting this leads to contradictions. The paradox exposes not a limit of expectation, but a pitfall in misapplying probability: assuming equiprobability without justification. Probability is not a matter of indifference; it is a consequence of knowledge.

  ### Final Commitment
  The verdict is clear: the paradox is a fallacy. The step where it breaks is the unconditional assignment of equal probabilities after seeing \(a\). Correct conditional reasoning reveals that the expected value of switching is not \(1.25a\), but a quantity dependent on the prior and \(a\). Symmetry holds unconditionally, but conditionally, it is nuanced. If forced to abandon one step, I would note the delicacy of assuming a density \(f(x)\)—some may argue for improper priors, but these lead to infinite expectations and are ill-posed. In proper terms, the case is closed.

  Thus, I rest my argument.
