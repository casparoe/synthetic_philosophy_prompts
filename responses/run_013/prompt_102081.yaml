prompt: |-
  I have been trying to work out, for myself, a consistent set of judgments about the liberties a dramatist may take with the real dead, and I would like to know whether my verdicts add up to a principle, and if so what it says. My intuitions, going case by case, are these.

  A screenwriter invents a private conversation between two long-dead statesmen, in a room where nothing was recorded, but the exchange is consistent with everything that is on the record. I think that is permissible. A novelist puts a speech into the mouth of a well-documented nineteenth-century general at a moment when historians are confident he said nothing of the kind, but the speech expresses what he plainly believed; I think that is permissible too, and I would even defend it as truer than silence. A biopic invents a sustained affair for a writer whose surviving letters show a devoted and faithful marriage: not permissible. A film folds three real campaigners into a single composite figure, unnamed but transparently a stand-in: permissible. A film invents that a recently dead musician, who leaves a widow and young children, died of a deliberate overdose when the coroner found the death accidental: not permissible, and I suspect the living survivors are a large part of why. A novel gives a real slave-owner a late conversion of conscience that the surviving record suggests never happened, in order to make the moral texture of the period vivid: here I keep going back and forth, and my gut says there is something wrong that is not wrong in the invented-conversation case, though I cannot say what. A play invents that a real but obscure woman was illiterate when she in fact signed her name to surviving documents: not permissible. A film has a real person deliver lines drawn in substance from his own diaries and letters: permissible, obviously.

  The tentative principle I would offer, and want tested and repaired, is this: an invention is allowable when it could have been true given the surviving evidence and does not purport to report what the record contains; it is not allowable when the evidence positively rules it out, or when the invention would leave an audience with a false belief about what the record shows. I already suspect this principle is too crude, because the slave-owner case seems to satisfy it and still troubles me, and because the dying-musician case seems to violate nothing about the record so much as something about the survivors.

  Please tell me what principle, or small set of competing principles, best captures these verdicts, stating each clause precisely and naming the case that motivates it. Then say what your preferred principle predicts for cases I have not put to you: inventing a sexual relationship between two real, long-dead adults where the evidence is silent but they lived in a time when such a relationship would have been hidden; and the same invention transposed to figures dead for six centuries with no identifiable descendants, so that the only thing left to wrong is the dead themselves. Finally, tell me honestly which of my verdicts your principle cannot accommodate, and whether I should give one of them up.
reasoning: |-
  Hmm, the user is grappling with a fascinating ethical question about historical fiction - how far can writers go when depicting real people? They've provided several nuanced case studies and a tentative principle, but feel it's incomplete. 

  The core tension seems to be between historical fidelity and artistic license. Their examples reveal three recurring concerns: when inventions contradict known facts (like the illiterate woman case), when they harm living descendants (musician's overdose), and when they distort moral realities (the slave-owner conversion). 

  Interesting how their discomfort persists even when their stated principle is technically satisfied - like with the slave-owner example. That suggests the principle misses something crucial about representation of moral character. The musician case confirms this - it's not just about evidence, but about respect for the dead and their families.

  For the unasked cases: 
  The Victorian lovers scenario feels permissible under most principles since evidence is absent and no one is harmed. But the medieval figures case is trickier - is misrepresenting someone 600 years ago still wrong? That depends whether we believe the dead have ongoing interests in their reputation. 

  Their verdicts seem largely consistent except the slave-owner conversion dilemma. I suspect this troubles them because it crosses into "moral anachronism" - imposing modern redemption arcs on historical figures in ways that distort systemic evils. The writer's affair verdict might also need reconsideration - if evidence shows a faithful marriage, but what if letters were destroyed? Absolute certainty is rare in history.

  The survivor consideration is vital but hard to codify. Perhaps we need separate guidelines for recent vs distant history, and for figures with living connections. The key is transparency - audiences should always discern where history ends and invention begins.
answer: |-
  Your intuitions reveal a sophisticated ethical framework that can be distilled into a **dual-principle system** addressing both *historical fidelity* and *moral harm*. Below is a precise formulation, grounded in your cases, followed by analysis of new scenarios and identified tensions.

  ---

  ### **Core Principles**
  **1. The Evidential Constraint Principle**  
  *An invention is permissible if:*  
  (a) It does not contradict *specific, well-attested historical evidence*; AND  
  (b) It does not misrepresent the *documented character or legacy* of the subject in a material way.  
  *Motivated by:*  
  - **Permissible**: Invented conversation between statesmen (no evidence against it).  
  - **Impermissible**: Illiterate woman (evidence of signature contradicts it).  
  - **Impermissible**: Musician's overdose (coroner's report contradicts it; legacy distorted).  

  **2. The Survivor Harm Principle**  
  *An invention is impermissible if:*  
  (a) It causes *foreseeable harm to identifiable living persons* (e.g., family, community); OR  
  (b) It exploits *unresolved trauma* or violates *dignitary interests* of the recently deceased.  
  *Motivated by:*  
  - **Impermissible**: Musician's overdose (harms widow/children).  
  - **Ambiguous**: Slave-owner's conversion (no direct survivors, but dignitary harm possible).  

  ---

  ### **Resolving Your Ambiguities**
  - **Slave-owner's conversion**: Troublesome because it violates the *spirit* of the Evidential Constraint Principle. While evidence doesn't "positively rule out" a private change of heart, it misrepresents the subject’s *documented moral agency* to serve a didactic agenda. This is distinct from the invented conversation (which clarifies beliefs without distorting character). Your discomfort stems from **moral anachronism**—imposing retrospective ethical clarity on a figure whose recorded actions show no such reckoning.  
  - **Dying musician case**: Primarily violates the *Survivor Harm Principle*, not just evidentiary concerns. The coroner’s report is secondary; the core issue is *trauma to living descendants*.  

  ---

  ### **Predictions for New Cases**
  **Case 1: Invented sexual relationship (long-dead, evidence silent, era of secrecy)**  
  - **Verdict**: *Permissible* under Evidential Constraint (no evidence against it; hidden relationships align with historical context).  
  - **Rationale**: Absent contradictory evidence or living victims, artistic license prevails.  

  **Case 2: Same invention (600 years dead, no descendants)**  
  - **Verdict**: *Permissible, but with caution*.  
  - **Rationale**: No Survivor Harm applies. However, if the invention fundamentally distorts the figure’s *historical significance* (e.g., inventing queerness for a saint central to a marginalized community’s identity), Evidential Constraint may be triggered. Mere silence isn’t a license for major character distortions.  

  ---

  ### **Incompatible Verdicts & Recommendations**
  **1. Biopic’s invented affair (faithful marriage documented)**  
  - **Your verdict**: Impermissible.  
  - **Conflict with Principles**: Evidential Constraint clearly forbids this (letters are direct evidence). *No conflict here—principles align with your verdict.*  

  **2. Slave-owner’s conversion**  
  - **Your verdict**: Ambiguous, leaning impermissible.  
  - **Principles’ Verdict**: *Impermissible* under Evidential Constraint. The invention overwrites the subject’s *documented moral inertia* to impose a redemptive arc, materially distorting their legacy. Your instinct is correct; abandon the ambiguity.  

  **3. Recommendation: Revise Your Tentative Principle**  
  Your initial principle fails when inventions are *technically consistent with evidence* but still distort character (slave-owner) or harm survivors (musician). The dual principles above resolve this by:  
  - Prioritizing *legacy/character integrity* over mere "could have been true."  
  - Adding a separate axis for *interpersonal harm*.  

  ---

  ### **Refined Guiding Maxim**  
  > **"Inhabit the gaps, but do not erase the stones."**  
  > - *Invent freely in historical silence, but never alter documented facts, deface moral legacies, or trespass on living grief.*  

  This framework protects both truth and dignity—the twin pillars of ethical historical storytelling.
