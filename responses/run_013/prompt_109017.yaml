answer: |-
  Here are nine questions designed to challenge the speaker's causal-continuity view in a constructive but pointed way, tailored for a live Q&A, complete with likely answers and concise follow-ups:

  **Theme 1: The Causal-Continuity Constraint & Edge Cases**

  1.  **Question:** "You argue survival requires the continuation of the *very same causal process* generating the mental life. In the standard teletransporter, you say the causal chain is broken because the original is destroyed and reassembled from a blueprint. But what *is* the essential 'causal process' here? If the teletransporter works by instantly transmitting a perfect structural scan via radio signal, and the receiver uses that signal to assemble new matter – why isn't that radio signal transmission *itself* the continuous causal chain carrying the information necessary to resume the mental process?"
      *   *Likely Answer:* She'll emphasize the physical discontinuity – the original brain process *stops*, and a new, distinct physical process *starts* based on the information. The radio signal is just data, not the *ongoing physical realization* of the process.
      *   **Follow-Up:** "So the physical medium *is* essential? If the teletransporter worked by instantly converting my brain state into a radio wave *pattern* that travels at light speed and is then used to *directly modulate* an identical pre-existing brain structure in the receiver, would *that* preserve the causal process? Why/why not?"

  2.  **Question:** "Let's consider the 'Blueprinter' variation: Imagine a machine scans you non-destructively, creates a perfect physical blueprint, and then *instantly grows* a duplicate of you from raw materials in a vat using that blueprint. No destruction of the original. Is the vat duplicate *you*, surviving via causal continuity, since the blueprint captured the *exact state* of the causal process?"
      *   *Likely Answer:* No. The vat duplicate is a *new* instance initiated by the blueprint. The original causal process continues uninterrupted in the original body. The duplicate has a separate causal origin, even if identical at inception.
      *   **Follow-Up:** "What's the key difference between the causal history of the vat duplicate and, say, your own causal history a millisecond *after* the scan? Both seem initiated by prior states. Is it just the *spatial* separation or the *manner* of initiation (growth vs. continuous function)?"

  3.  **Question:** "Let's complicate the teletransporter: Suppose the scanner malfunctions and *doesn't* destroy you. You wake up groggy in the departure booth. Moments later, your replica emerges confidently from the arrival booth. You both have equal claim to the causal history up to the scan. For that hour you coexist and argue – which one is the continuation of *your* original causal process? Or is neither?"
      *   *Likely Answer:* This is fission. The original causal process bifurcates. *Neither* subsequent person is strictly identical to the original, but *both* stand in a relation of strong causal continuity to the pre-scan person.
      *   **Follow-Up:** "If neither is strictly identical to the original person who entered the scanner, does that original person *cease to exist* at the moment of fission? And if so, does that constitute a *loss* of what matters from *their* perspective, even though two conscious continuers now exist?"

  **Theme 2: Fission & Degrees of What Matters**

  4.  **Question:** "You embrace degrees of what matters. In a symmetrical fission case – say, brain bisection where each hemisphere is successfully transplanted – two equally continuous descendants emerge. How much does 'what matters' survive into *each* descendant?"
      *   *Likely Answer:* Roughly half. Each descendant inherits roughly half of the physical/functional basis of the original's mental life and causal history. So what matters to the original survives to a degree of about 0.5 in each.
      *   **Follow-Up:** "If each gets 0.5, that sums to 1.0. But if identity is lost (as you likely agree), isn't the original subject *gone*? How can the *survival* of what matters sum to 1.0 if the *subject* who cared about it ceases to exist? Isn't that a net loss *for that subject*?"

  5.  **Question:** "Sticking with fission: If I, pre-fission, care about my future experiences, how should that self-concern distribute? Should I be indifferent between my left-hemisphere descendant having a wonderful life and my right-hemisphere descendant having a terrible one, versus the reverse, since both have equal claim to continuity? Or should I care equally about both?"
      *   *Likely Answer:* You should care equally about both futures because both are equally strong continuers of *you* (to the degree possible post-fission). Your self-concern branches.
      *   **Follow-Up:** "But if I care equally about both, and one suffers horribly while the other is blissful, my pre-fission anticipation involves knowing *someone* who is me-to-degree-0.5 will suffer terribly. Does this feel different, rationally, than knowing *I* (a unified me) might suffer terribly? Does branching dilute the 'sting' of anticipated suffering?"

  **Theme 3: The Rationality of Self-Concern**

  6.  **Question:** "If personal identity isn't what fundamentally matters, only causal continuity, *why* is it rational to have a special concern for the future stages of *this particular causal process*? Once identity is off the table, what makes continuity *itself* the object of rational self-interest, rather than just a description of how psychological states connect?"
      *   *Likely Answer:* Because it's the causal continuity that underpins the *connectedness* of experience, memory, intention, and character – the very things that constitute a perspective and make future experiences *mine* experientially, even if not metaphysically identical. Rational self-concern tracks where *my* experiences and projects continue.
      *   **Follow-Up:** "But isn't that experiential 'mineness' just another way of describing psychological continuity? If a perfect duplicate, created by a Blueprinter, wakes up with all my memories and intentions, wouldn't *it* also feel experiences as 'mine' in just the same way? Why should *my* rational concern care about the causal origin of that feeling if the feeling itself is identical?"

  7.  **Question:** "Couldn't one argue that privileging causal continuity is just a biological or psychological bias? Evolution selected for organisms that care about their *own* future physical continuity. Isn't saying causal continuity 'matters' just dressing up this deep-seated bias with metaphysical language, once identity is removed?"
      *   *Likely Answer:* While the *feeling* of self-concern may have evolutionary roots, the *rational justification* for it lies in the connection guaranteed by causal continuity – it ensures the future being is the locus of *these specific* ongoing projects, memories, and experiential streams in a way a duplicate, however perfect, is not. The bias tracks the rational ground.
      *   **Follow-Up:** "But if the duplicate is psychologically identical and will carry on my projects just as effectively (even if initiated differently), what *practical* difference does the causal origin make to the *rationality* of my concern? Doesn't the functional outcome matter more than the causal pedigree?"

  **Closing Question: Changing Minds**

  8.  **Question:** "This is a fascinating and challenging position. To help us understand its foundations: What kind of evidence or argument *could* potentially unsettle your confidence that causal continuity, rather than identity or something else, is what fundamentally matters for survival and self-concern? What would make you reconsider?"
      *   *Likely Answer:* (Open-ended, but possibilities include): A compelling argument showing causal continuity isn't necessary for genuine experiential mineness; strong evidence that we *do* intuitively and rationally treat perfect psychological duplicates as "us" in survival scenarios; or a demonstration that the "degrees" view leads to intolerable contradictions or impracticalities fission can't resolve.
      *   **Follow-Up:** (If time allows, based on her answer): "So, if we encountered a being that truly experienced seamless 'mineness' across discontinuous causal chains, would that challenge the *necessity* of causal continuity, or just show it's one possible path?"

  **Key Q&A Tips:**
  *   **Phrase Naturally:** Read them aloud beforehand. Trim slightly if needed for flow ("So, about fission..." instead of "Sticking with fission...").
  *   **Moderate Actively:** Gently interrupt if answers become overly long. Use the follow-up to refocus or sharpen the point if she dodges.
  *   **Tone:** Maintain collegial curiosity. Use phrases like "Help me understand..." or "I'm wrestling with...".
  *   **Pacing:** You likely won't get through all 9. Prioritize based on the talk's flow and audience energy. Start with 1 or 3, then 4 or 5, then 6 or 7, and definitely ask 8.

  These questions push on the core tensions in her view (physical medium vs. information, fission math, rationality of concern) while respecting its sophistication and staying within the Parfitian framework she's engaging with. Good luck!
