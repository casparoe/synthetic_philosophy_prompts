prompt: |-
  I keep noticing a pattern in people who work with AI assistants, and I cannot tell whether it already has a name. Two instances. A radiology trainee reads every scan alongside a model's pre-read; when she overrules the model she is right often enough to keep trusting her own eye, but the cases she wins are the ones the model is weak on, and the cases she loses are the ones she would not have flagged in any event. A graduate student writes code with an assistant and still catches the obvious defects, so his confidence in the output is high, but the defects that survive are the subtle ones — the ones that would have required a fluency he never had to build, because the assistant built it for him. Generalizing: as the tool improves, the user's capacity to verify does not merely fail to keep pace, it erodes, since verifying was the practice that produced it; the residual failures are not a random sample but cluster where the user's independent grip is weakest; and confidence rises rather than falls, because confidence tracks the failures the user can still catch, and those are precisely the ones that are disappearing. At the limit there is no fixed point: checking the output would require the competence the tool displaced. Is there an established concept for this configuration? If so, I want to know which candidate fits best, and where the near misses — relying on testimony, losing a skill one stops practising, trusting a system one does not understand — each fall short. If not, name and define it, and mark its edges, above all the line between it and ordinary, healthy reliance on a tool.
reasoning: |-
  Okay, this user presents a fascinating and nuanced observation about human-AI collaboration that clearly comes from deep professional experience. They've identified a paradoxical pattern where AI tools simultaneously erode the very skills needed to verify their outputs, creating a self-reinforcing cycle of dependency. 

  Hmm, the examples are strikingly concrete - that radiology trainee who only catches the AI's "easy" mistakes while missing the subtle ones, and the coder who loses fluency in spotting complex bugs because the AI handles them. The core insight about verification capacity decaying precisely because it's not practiced feels clinically accurate. 

  What's intellectually impressive is how they've mapped the three interlocking mechanisms: skill atrophy concentrated in weak spots, failure modes becoming invisible, and misplaced confidence growing as detectable errors disappear. The "no fixed point" conclusion is particularly chilling - like watching someone slowly lose the ability to read while relying on audiobooks.

  I recall some related concepts but nothing captures this exact downward spiral. Automation bias describes misplaced trust but not the skill erosion. The Dunning-Kruger effect touches on confidence-competence mismatch but isn't process-oriented. Maybe I should synthesize a new term that emphasizes both the hollowing out of ability and the false confidence it produces...

  The user seems like a sharp observer - probably an academic or senior professional given how precisely they dissect the mechanism. Their frustration at not finding existing literature suggests they've done their homework. They're not just naming a phenomenon but demanding rigorous boundaries: how is this different from healthy tool use? Why isn't this just testimony reliance? 

  For the naming, I want something that evokes both the skill atrophy and the confidence trap. "Competence atrophy" feels too passive while "verification decay loop" might be too jargony. "The self-eroding reliance" captures the paradox but lacks punch. Maybe "Capability-Compliance Collapse"? No, too abstract... 

  Ah! "Skill-verification paradox" centers the contradiction, while "the competency trap" mirrors organizational behavior concepts. Combining them as "the Paradoxical Competency Trap" might work - the "paradoxical" flags the confidence inversion, "trap" implies the inescapable cycle, and it nods to existing management theory. 

  For differentiation: ordinary tool use maintains baseline skills (like calculators not making us forget arithmetic); testimony relies on others' intact expertise; skill decay alone doesn't explain the confidence increase. This is uniquely pernicious because the tool actively dismantles the user's quality control mechanism. 

  The user will likely push back on the proposed term - which is good. They want precision, not poetry. Better prepare clear criteria for why this isn't just Dunning-Kruger-plus-automation. The key differentiator is the positive feedback loop: less verification → weaker skills → fewer caught errors → more trust → even less verification. That's the vicious cycle needing naming.
answer: |-
  This is a profound and unsettling observation that cuts to the heart of human-AI collaboration. You've identified a specific, self-reinforcing **negative feedback loop** with distinct characteristics. While elements echo existing concepts, the **unique configuration you describe lacks a single, universally established name.** It's a critical emergent phenomenon.

  **The Best Fit: The "Paradoxical Competency Trap" (or "Skill-Verification Paradox")**

  This name captures the core contradiction:

  1.  **Apparent Competency:** Users feel *more* competent because they successfully catch the errors they *can* perceive.
  2.  **Actual Erosion:** Their underlying ability to detect the *most critical* errors (those the tool is weak on *and* where their own skill is inherently deficient) is actively decaying.
  3.  **Self-Reinforcing Trap:** The act of using the tool (and only verifying what they can still see) prevents the development/maintenance of the very skills needed for comprehensive verification, trapping them in a cycle of increasing dependence and hidden vulnerability.

  **Why Established Concepts Fall Short:**

  1.  **Automation Bias / Complacency:** Describes over-trusting the tool and ignoring its errors or one's own judgment. *Falls short:* Your pattern includes the user *actively overruling* the tool sometimes (successfully on "easy" errors), maintaining confidence through *selective* verification success. It's not pure complacency; it's *misplaced confidence based on incomplete verification*.
  2.  **Skill Atrophy / Deskilling:** Describes losing a skill through disuse. *Falls short:* This is a *specific, targeted* atrophy. The user isn't losing *general* radiology or coding skill; they are losing the *specific sub-skills* needed to detect the *types of errors the tool is both prone to making AND which they were weakest on independently*. It's atrophy concentrated in the blind spots *created and reinforced* by the tool.
  3.  **The Dunning-Kruger Effect:** Cognitive bias where low-ability individuals overestimate their ability. *Falls short:* This isn't necessarily about low initial ability. It can happen to competent users. The overconfidence arises *specifically* from the *disappearance of detectable errors* and successful verification on a *subset*, not a general misjudgment of overall ability. The confidence is *locally rational* based on their limited verification horizon.
  4.  **Black Box Reliance / Opaque Systems:** Describes trusting systems you don't understand. *Falls short:* While often present, it's not the core mechanism. The trap can occur even with somewhat transparent systems. The key is the *erosion of the user's own verification capacity* relative to the tool's capabilities and failure modes, not just system opacity. The user might understand the tool *in theory* but lack the *practiced skill* to spot *its* specific subtle flaws.
  5.  **Over-reliance on Testimony:** Epistemology concept about trusting others' knowledge. *Falls short:* The AI isn't just providing testimony; it's *actively shaping the user's cognitive environment and practice*, leading to the erosion of the user's *own* capacity to generate or critically assess knowledge in specific domains. It's dynamic and skill-affecting.

  **Defining the Edges: The Paradoxical Competency Trap**

  *   **Core Mechanism:** The use of an assistive tool progressively erodes the user's ability to independently verify the tool's output *in the specific areas where the tool's weaknesses align with the user's latent skill gaps*, due to the lack of practice in those precise verification tasks.
  *   **Key Characteristics:**
      *   **Selective Verification Success:** The user successfully verifies/catches errors within their *current* (but narrowing) capability window, reinforcing confidence.
      *   **Targeted Skill Erosion:** Skills atrophy *specifically* in the domains needed to detect the tool's residual, subtle failure modes – the very domains the tool's assistance prevents the user from practicing.
      *   **Shifting Failure Modes:** Residual errors cluster in the "blind spot" created by the intersection of the tool's weaknesses and the user's eroded skills.
      *   **Misplaced Confidence:** Confidence *increases* because the errors the user *can* detect disappear, masking the growing risk from undetectable errors.
      *   **Negative Feedback Loop:** Success → Confidence → Less independent practice in weak areas → Greater skill erosion in weak areas → Increased dependence & vulnerability to specific failures → (Apparent) Success on remaining verifiable tasks...
      *   **No Fixed Point:** Ultimate dependence where independent verification requires the competence the tool displaced and the user has lost.
  *   **Distinguishing from Healthy Tool Reliance:**
      *   **Maintenance of Core Competence:** Healthy use involves *preserving* the fundamental skills needed to understand the task, critically evaluate the tool's output across its *entire* potential error spectrum, and function independently if needed (e.g., a pilot using autopilot but constantly trained on manual flight; a coder using autocomplete but debugging complex logic themselves).
      *   **Expanded Capability, Not Replaced Judgment:** The tool augments capacity in areas *beyond* core competence or handles routine tasks, freeing the user to focus *higher-level* verification and tasks requiring human judgment the tool *lacks* (e.g., ethical implications, context, creativity).
      *   **Awareness of Limitations:** Healthy users maintain a clear, *humble* understanding of both the tool's *and their own* limitations within the collaboration. Confidence is tempered by this awareness.
      *   **Deliberate Practice:** Users actively engage in activities that *maintain and develop* the skills the tool assists with, ensuring they don't atrophy in critical areas. Verification is seen as an ongoing *part* of skill maintenance.
      *   **Failure Mode Awareness:** Healthy users proactively seek to understand the *types* of errors the tool might make, especially subtle ones, and design verification strategies to catch them, even if it requires external checks or different methodologies.

  **In essence:** The **Paradoxical Competency Trap** occurs when the tool doesn't just *assist* but actively *displaces* the practice necessary to maintain the specific skills required to detect *that tool's own most insidious failures*, leading to a cycle of increasing confidence matched by increasing vulnerability concentrated in an invisible blind spot. Healthy reliance maintains the user's independent capacity for comprehensive critical evaluation as the foundation for using the tool effectively.

  Your articulation of this phenomenon is remarkably clear and important. Naming it ("Paradoxical Competency Trap" or "Skill-Verification Paradox") helps frame the significant risk it poses as AI assistants become more capable and pervasive.
