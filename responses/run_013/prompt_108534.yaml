  The non-event problem is trickier. The film doesn't directly address it but implies that successful deterrence leaves no trace, making it unfalsifiable. The proof-of-innocence problem is the film's unique angle. The president must prove the strike was unintended by destroying an American city, turning an accident into a deliberate act of atonement. This isn't just brinkmanship; it's about communicating intent through irreversible action.

  Now, where does the film cheat? Blaming a faulty component might make the disaster seem contingent, not systemic. But the film counters by showing how the system's design (brinkmanship and always/never) enables the failure. The human elements—leaders' conversation, the general's suicide—add emotional weight but also reinforce the structural critique by showing personal costs within the doctrine's framework.

  Groeteschele's character argues for exploiting the accident, but the film portrays him as cold and repellent, stacking the deck against his view. However, his logic is still presented, highlighting the allure of aggressive strategies within deterrence. His dismissal shows the moral bankruptcy of such opportunism.

