prompt: |-
  I do a small podcast on the philosophy of AI, and next week's guest is a researcher who's spent about a decade defending a pretty strong line: that inverse reinforcement learning can, in principle, recover a person's actual preferences from their behavior alone — no introspection, no questionnaires, just watching what they do. She's happy to grant every engineering caveat you like, but she thinks the philosophical objections are overblown. Can you draft me eight to ten interview questions? I want to actually press her, not let her restate the pipeline.

  Some stuff I'd like covered. Start with the underdetermination business — she knows reward ambiguity is a real result, so I don't want a question that just invites her to concede it; I want one about why she thinks it's not fatal, and then a follow-up for the reply she usually reaches for (something in the neighborhood of: the environment's own constraints plus a simplicity prior on the reward pin it down enough). Then I want something on beliefs vs desires. The case I keep coming back to is someone who chokes down a foul-tasting medicine every morning — a model watching that could read it as a standing preference for bitterness or as a belief that the stuff is good for them, and I want her to say which one it is and why, plus a follow-up in case she says the belief is just folded into the environment model. There's also the noise issue: she treats the demonstrator as a Boltzmann-rational agent, so I'd like a question on whether genuinely irrational behavior just gets laundered into a preference for whatever the person happened to do. And one on the counterfactual problem — recovering preferences from behavior means extrapolating to choices that never get made, so what licenses that leap? Maybe one on aggregation too: when you watch a household or a crowd, whose preferences are you recovering, and is there even a fact of the matter? And end on the meta question — whether preference is a well-defined enough target that recovering it means anything, and what observation would actually falsify her realism rather than get absorbed as more data.

  Keep them specific and a bit adversarial, and please pair each hard one with the follow-up she's most likely to need. Also, she has a habit of brushing off every objection as a data problem, so maybe work in one question that makes that move harder to pull off. A couple of them can be a little technical, she won't mind.
reasoning: |-
  Okay, the user runs a philosophy of AI podcast and needs interview questions for a guest who believes inverse reinforcement learning (IRL) can recover actual preferences from behavior alone. The user wants pointed questions that challenge the guest's position without letting her retreat to technicalities. 

  First, I need to map the user's explicit requests: underdetermination, belief/desire distinction, noise/irrationality, counterfactuals, aggregation, and meta-questions about preference realism. The user also wants follow-ups that anticipate the guest's likely rebuttals, especially her tendency to dismiss objections as data problems. 

  Hmm... the guest's core argument seems to be that environmental constraints + simplicity priors resolve reward ambiguity. For the underdetermination question, I should force her to defend why simplicity is philosophically justified rather than just practical. A good follow-up would challenge whether Occam's razor applies to preferences at all—maybe human preferences are inherently messy.

  The medicine example is perfect for belief/desire. If the guest says beliefs are part of the environment model, the follow-up should press on why that doesn't collapse the distinction entirely. Does "environment" just become a catch-all for everything non-preference? That feels slippery.

  For irrational behavior, the Boltzmann-rational framework is key. The question needs to corner her: if IRL reframes mistakes as "preferences for errors," doesn't that make preferences unfalsifiable? The follow-up should demand a test case where IRL would discard the preference model itself.

  Counterfactuals are thorny. The guest might say observed choices imply unobserved ones, but that's circular. The follow-up should ask how IRL handles novel options with no behavioral traces—like suddenly offering a new medicine.

  Aggregation needs to expose ontological vagueness. If IRL analyzes a couple arguing about dinner, whose preferences emerge? The follow-up should attack whether "household preference" even exists as a recoverable entity.

  The meta-question must prevent absorption of counterevidence. If IRL "recovers" inconsistent preferences from someone with OCD rituals, does it just claim they "prefer" compulsions? That would make the theory tautological. The follow-up needs to force a falsifiability threshold.

  ...Wait, the user mentioned making one question "data-proof." The noise/irrationality pair already does this, but maybe add a hypothetical where infinite data still fails—like two reward functions that generate identical behaviors in all possible worlds. That blocks the "more data" escape.

  Technical level: one question could mention Boltzmann temperature parameter, another could reference the linear dynamics assumption in MDPs. She'll appreciate those.

  Structure-wise: 5 core challenges with follow-ups, plus the meta-pair, totals 10 questions. Order should flow from technical to philosophical, ending on the realism bomb.
answer: |-
  Here are 10 hard-hitting, philosophically focused interview questions designed to press the core claims and preempt common rebuttals, complete with targeted follow-ups:

  1.  **The Underdetermination Challenge:** "The formal result on reward ambiguity shows infinitely many reward functions explain *any finite dataset* of behavior. You argue environmental constraints + a simplicity prior resolve this. But isn't this prior *philosophically* arbitrary? Why should we believe the 'simplest' reward function recovered by IRL corresponds to the agent's *actual* complex, context-sensitive, and potentially contradictory preferences, rather than just being a useful engineering approximation?"
      *   *Likely Follow-Up Needed:* "If 'simplest' is defined algorithmically (e.g., fewest non-zero features, lowest polynomial degree), doesn't that render the recovered 'true preference' contingent on our specific computational tools and biases, rather than a mind-independent fact?"

  2.  **The Belief/Desire Distinction (Medicine Case):** "Take the classic case: a person drinks bitter medicine daily. An IRL model could explain this by recovering a 'standing preference for bitterness' OR by recovering a 'preference for health' coupled with a *belief* that the medicine promotes health, encoded in the transition dynamics. How does IRL *in principle* distinguish which is the 'actual' preference structure here, given the observed behavior is identical?"
      *   *Likely Follow-Up Needed:* "If you argue beliefs are *always* just part of the environment model, doesn't this collapse the distinction between preference and belief entirely? Does this mean IRL fundamentally recovers a *utility function conditional on the demonstrator's own (potentially flawed) world-model*, rather than a 'pure' preference?"

  3.  **Laundering Irrationality via Boltzmann Noise:** "You model demonstrators as Boltzmann-rational. This assumes deviations from perfect rationality are just 'noise' proportional to preference strength. But doesn't this framework inherently *reinterpret genuine irrationality* (e.g., systematic cognitive biases, akrasia, impulsive errors) as merely a *revealed preference* for whatever suboptimal action was taken in that specific noisy instantiation? How is this recovering 'true' preferences rather than laundering mistakes?"
      *   *Likely Follow-Up Needed:* "Could you describe an observable pattern of behavior that your IRL framework would definitively categorize as 'irrational noise corrupting the signal of true preference' versus 'evidence of a complex, context-dependent true preference'? What principle makes this distinction?"

  4.  **The Counterfactual Problem (Extrapolating Beyond Data):** "IRL aims to recover preferences that generalize to *unobserved* states and actions. But preferences are often revealed precisely through hard choices *not* taken. What licenses the leap from observed choices in a finite set of situations to claims about preferences governing *counterfactual* choices, especially radically novel ones the demonstrator never encountered? Isn't this extrapolation underconstrained?"
      *   *Likely Follow-Up Needed:* "If the demonstrator always takes Path A and never Path B (say, due to cost), does IRL recover a *dispreference* for B, or merely *no data* about B? How can it tell the difference without observing a choice involving B?"

  5.  **Aggregation & Whose Preference?:** "When observing a complex system like a household making decisions (e.g., where to eat), whose 'actual preferences' does IRL recover? Is it an aggregate? The loudest member's? A group-level emergent property? Given conflicts and compromises are inherent, is there even a single, coherent 'household preference' to be recovered, or is IRL imposing artificial coherence?"
      *   *Likely Follow-Up Needed:* "Does the recovered preference function correspond meaningfully to *any* individual mind within the group, or is it purely a behavioral descriptor of the collective? If the latter, in what sense is it 'actual'?"

  6.  **The Data-Proof Challenge (Blocking the "Just More Data" Move):** "Imagine a hypothetical: we have *exhaustive* behavioral data on an agent across their entire life in a complex world – every action, every state. Could there *still* exist multiple, fundamentally *incompatible* reward functions (e.g., one valuing health maximization, another valuing risk-seeking experiences) that explain *every single data point equally well* under the MDP framework? If yes, doesn't this show the underdetermination is ontological, not just epistemic, even with infinite data?"
      *   *(This question is explicitly designed to force engagement beyond data scarcity)*

  7.  **Preference Realism & Falsifiability:** "You defend a realist position: that agents *have* stable, recoverable 'true preferences'. What observation, even in principle, could *falsify* this claim for a given agent using IRL? Couldn't *any* observed behavior, no matter how inconsistent or seemingly irrational, *always* be rationalized *post hoc* by attributing a sufficiently complex or context-dependent 'true preference' via IRL? Doesn't this risk making 'true preference' an empirically vacuous concept?"
      *   *Likely Follow-Up Needed:* "If IRL can always fit the data by adjusting the complexity or features of the reward function, what prevents it from being a sophisticated form of curve-fitting that tells us more about the modeler's assumptions than the agent's mind?"

  8.  **The Dynamics of Preference Change:** "People's preferences evolve over time due to reflection, new experiences, or persuasion. How can IRL, which infers preferences *from past behavior*, distinguish between: (A) Recovering the agent's preference *at the time of the action*, (B) Recovering a stable meta-preference governing change, or (C) Simply being *wrong* because preferences changed? Doesn't this confound the 'true preference' recovered?"
      *   *Likely Follow-Up Needed:* "If the agent later explicitly *repudiates* choices made under an old preference (e.g., "I only did that because I was naive"), does IRL recover the *old* preference or the *current* one? Which one is the 'actual' preference?"

  **Key Adversarial Elements Incorporated:**

  *   **Pressing Underdetermination:** Questions 1 & 6 directly challenge the sufficiency of simplicity+constraints, forcing defense of the *philosophical* validity of the prior and confronting the possibility of fundamental non-uniqueness.
  *   **Belief/Desire Ambiguity:** Question 2 & 2a use the medicine case to force a stance on the core philosophical distinction and challenge the potential conflation within the environment model.
  *   **Laundering Irrationality:** Question 3 & 3a directly attack the Boltzmann assumption as redefining irrationality as preference.
  *   **Counterfactuals:** Question 4 & 4a challenge the justification for extrapolation.
  *   **Aggregation:** Question 5 & 5a probe the ontological status of recovered preferences in multi-agent settings.
  *   **Preference Realism & Falsifiability:** Question 7 & 7a are the meta-attack, questioning the coherence and testability of "true preference" itself.
  *   **Blocking the "Data Problem" Dodge:** Question 6 explicitly uses a hypothetical with infinite data to isolate the philosophical underdetermination issue.
  *   **Targeting Habitual Replies:** Follow-ups anticipate moves like retreating to the environment model (2a), redefining irrationality as preference (3a), or infinite flexibility in reward function complexity (7a).

  These questions force the guest to defend the *philosophical* core of her position – the nature of preference, the realism claim, the justification for generalization, and the ability of IRL to cut nature at its joints – rather than retreating to engineering caveats or data limitations. Good luck with the interview!
