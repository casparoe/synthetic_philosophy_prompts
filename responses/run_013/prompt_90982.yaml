  First, I need to understand the key challenges they'll face. The microeconomists will demand empirical rigor—how to measure diversion vs. extraction separately and prove their differential impacts. The anthropologists will resist binary categories and worry about functionalist overgeneralization. Practitioners will want actionable takeaways. The user also hints at personal stakes: their argument leans on "West is weird" rationalist ideas but acknowledges the room might dismiss this as armchair theory.

  The user's explicit request is a damage-controlled Q&A prep sheet. But deeper needs emerge: 
