  - They fear their "diversion isn't so bad" point could backfire, especially with activists (hence the "hoped nobody raises" ask). 
  - They secretly worry their thesis might be flawed (thus demanding a self-critical lens).

  For the prep sheet, I'll structure objections by audience bloc, ranked by risk. Top threats: 
  1. **Measurement pushback** (micro bloc): If they can't show empirical separation of extraction/diversion, their framework collapses. 
  2. **Functionalist trap** (anthro bloc): Defending diversion as "welfare" risks sounding apologetic for oppression. 
  3. **Actionability gap** (practitioners): Without concrete reforms, the talk feels academic.

  Replies must balance nuance and conviction. For example, conceding that diversion *can* be harmful (buying credibility) while stressing context (where states fail). The "silver bullet" objection—that Nordic states have both impersonality *and* strong welfare—could force thesis refinement if valid.

  My own blind spots: 
  - Underestimating practitioner skepticism about "moral valence" talks when they face daily graft. 
  - Over-indexing on anthro concerns about generalization, missing that some micro-economists might actually *like* the dichotomy (if testable).
answer: |-
  Here's a brutally honest Q&A prep sheet tailored to your specific audience and argument. I've ranked objections by **damage potential** (High/Medium/Low) and **likelihood** (based on your room description), with distinct phrasing per bloc, strategic replies, vulnerability notes, concessions, and the "silver bullet" objection. My self-critique is at the end.

  ---

  ### **Pre-emptive Concession (Open with this to buy credibility)**
  *"Before Q&A, let me stress two things: First, I’m not arguing that diversion is morally *good*—it’s often exclusionary and entrenches elites. Second, I fully agree extraction is devastating. My point is that our *metrics* conflate distinct harms, leading to reforms that target diversion (which sometimes functions as bare-bones welfare) while unintentionally worsening extraction (which is pure predation). If we misdiagnose, we mistreat."*  
  **Why:** Builds trust with anthropologists (acknowledges exclusion) and micro-economists (affirms harm of extraction). Disarms the "you’re apologizing for corruption" reflex.

  ---

  ### **Top 4 Objections (High Damage Potential)**

  1. **Objection: "You haven’t shown these are empirically distinct phenomena, let alone causally different in impact."**  
     *Micro-economist phrasing:* "Where’s the identification strategy? How do you disentangle extraction and diversion in observational data? Show me a regression where diversion has null/positive effects on outcomes."  
     *Anthropologist phrasing:* "This binary reifies messy realities. In my Nigeria fieldwork, the 'bribe for a permit' (your extraction) *is* the cousin demanding repayment (your diversion). Your categories don’t travel."  
     **Reply:** "You’re right—existing datasets (like TI’s CPI) *can’t* disentangle them. But we *can* proxy it: Use survey experiments asking *why* a bribe was paid (extortion vs. favoritism), or leverage administrative data on contract awards to firms linked to officials vs. petty bribe frequency. [Cite: Kramon & Posner’s Kenya study on ethnic favoritism vs. bribery]. When we do, diversion correlates with *local* welfare gains in weak states; extraction with market collapse. We need better measurement, but absence of proof isn’t proof of absence."  
     **Soft spot:** You lack a smoking-gun study. Lean on *methodological* critique: "If your measure can’t distinguish malaria from typhoid, you wouldn’t trust the mortality stats."  

  2. **Objection: "This is functionalist apologia—you’re romanticizing patronage as 'welfare' while ignoring its violence."**  
     *Anthropologist phrasing:* "Calling diversion 'welfare' whitewashes how it weaponizes scarcity. In Bihar, the upper-caste official 'diverting' fertilizer to his kin isn’t providing safety nets—he’s starving Dalit farmers."  
     *Practitioner phrasing:* "So when my NGO finds a mayor hiring cousins, should we back off because it’s 'welfare'? That’s how kleptocracies thrive."  
     **Reply:** "I emphatically agree diversion *can* be violent and exclusionary—*especially* when state capacity is low. My point is *not* that it’s desirable, but that *in contexts where formal institutions fail to deliver anything*, dismantling diversion without alternatives immiserates people who relied on it. Anti-corruption reforms that fire 'ghost workers' in Ghana left families starving because those jobs were how clans redistributed resources. We must replace the function, not just abolish the form."  
     **Soft spot:** Hard to prove diversion is *net* beneficial. Stress: "This isn’t a defense—it’s a warning that blunt reforms *backfire*."  

  3. **Objection: "Your 'moral valence' flip is dangerous. Extraction is terrible, but diversion fuels systemic inequality."**  
     *Micro-economist phrasing:* "Even if diversion has local gains, it distorts markets and entrenches elites. Olken (2007) shows corruption steals 24% of road funds in Indonesia—how is that 'better'?"  
     *Anthropologist phrasing:* "You call extraction 'thin' and market-like, but it’s embedded in social hierarchies too. The nurse extorting bribes does it because she’s underpaid—a systemic failure."  
     **Reply:** "I agree both are harmful! But our policies treat them identically. Extraction is a direct tax on the poor; diversion is often a regressive *redistribution*. When the World Bank conditions loans on firing 'patronage hires', it boosts extraction—because now the underpaid official *only* has strangers to exploit. We need to target extraction first: Raise public-sector wages, simplify procedures. Diversion requires longer-term institution-building."  
     **Soft spot:** Risks sounding like "diversion is less bad." Reframe: "Prioritize harm reduction: Extraction kills today; diversion kills tomorrow."  

  4. **Objection: "What’s your operational takeaway? Should we stop measuring corruption?"**  
     *Practitioner phrasing:* "If I can’t use corruption indices, what metric tells me if our procurement reform in Uganda is working?"  
     *Micro-economist phrasing:* "Without a clear counterfactual, how do we evaluate policies? Your framework isn’t falsifiable."  
     **Reply:** "Don’t abandon metrics—disaggregate them. Audit studies should differentiate bribes for routine services (extraction) vs. favoritism in hiring (diversion). For reformers: Focus on eliminating extraction by automating permits, publishing fee schedules, and protecting whistleblowers. For diversion, invest in *universal* welfare first—cash transfers weaken the need for patronage. Then phase in meritocratic reforms."  
     **Soft spot:** No plug-and-play alternative metric exists. Admit: "This requires context-specific diagnostics—which anthropologists excel at."  

  ---

  ### **Medium/Low Risk Objections**
  5. **"Weberian bureaucracy isn’t 'Northern European'—it’s functional!"** (Micro/Practitioner)  
     **Reply:** "Agreed! But its *moral universalization* is European. My point: Imposing it without adaptation ignores local glue. South Korea industrialized with 'divergent' patronage, then professionalized. Sequence matters."  
     **Soft spot:** Skirts cultural relativism.  

  6. **"Isn’t this just 'greasing the wheels' for extraction?"** (Anthropologist)  
     **Reply:** "No—that theory defends bribery as efficiency. I’m saying extraction is *always* predatory, while diversion *sometimes* has latent functions we must replace before smashing."  

  7. **"You ignore gender/race: Women/minorities lose most in diversion systems."** (Anthropologist)  
     **Reply:** "Crucially true. Exclusion is diversion’s core flaw. But extraction preys on them too—e.g., sexual extortion at clinics. Universal systems protect them best."  

  ---

  ### **The Objection You Hope Nobody Raises (But They Will)**
  **"If diversion is 'thick' obligation, why do elites in these societies send *their* kids to impartial universities abroad? Doesn’t that reveal they know it’s dysfunctional?"**  
  *Likely from:* A cynical anthropologist or practitioner.  
  **Reply:** "Absolutely—it shows diversion is a second-best coping mechanism, not an ideal. Elites opt out because they can; the poor can’t. But until we build functional alternatives, dismantling it without a plan is cruelty. Our task isn’t to preserve diversion, but to make it obsolete."  
  **Why it stings:** Implies your moral argument is naive. **Defuse early** by conceding diversion’s flaws upfront.

  ---

  ### **Self-Critique: Where My Advice Might Be Wrong**
  1. **The "Silver Bullet" Objection That Should Make You Rethink:**  
     *"Your thesis implies impersonality and welfare are trade-offs. But Nordic states achieved both. If they built impartial institutions *without* crushing welfare, why can’t others? Doesn’t this undermine your 'opposite valences' claim?"*  
     **Why it’s deadly:** If historically, building Weberian states *required* dismantling diversion *without* collapse (e.g., via progressive taxation funding universal welfare), your "diversion as necessary welfare" claim collapses. You’d need to argue that postcolonial states lack the fiscal capacity or legitimacy to replicate this—which is plausible but hazy.  
     **If this holds:** Soften to "Diversion is a *stopgap* in some contexts," not "morally better."

  2. **Where My Audience Read Might Be Off:**  
     - I’ve over-weighted anthropologists’ skepticism of binaries. Some micro-economists might *love* a testable dichotomy—if you offer measurable proxies.  
     - Practitioners may care less about "moral valence" than "what stops my reforms from failing?"—so stress the *practical* cost of conflation.  
     - The "rationalist blogosphere" reference may alienate older scholars. Avoid jargon ("Weird" → "historically specific").

  **Final Prep Tip:** Pre-empt the "West is weird" eyerolls by citing *their* heroes:  
  - Micro-economists: "As Rothstein notes, most corruption research assumes extraction is the model."  
  - Anthropologists: "Like Gupta argues, corruption indices measure the state’s imagined form, not its effects."  
  Good luck—you’ve got this.
