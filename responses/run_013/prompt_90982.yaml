prompt: |-
  OK so I'm in a weird spot and I need help prepping for Q&A, not a lecture on the topic itself. I've been developing an argument about corruption that I think is right and that I'm pretty sure is going to get me eaten alive, and I'm giving it as a 25-minute talk plus a long question period at a two-day workshop my institute is co-hosting on "corruption and development." So the room is genuinely mixed and I know both halves are going to come at me from opposite directions. On one side there's a bloc of applied micro / political-economy people — they run field experiments, bribe-solicitation games, audit studies, procurement data — who basically think corruption is a well-measured variable and the harms are settled, and whose whole instinct is "where's your identification strategy, and what's the counterfactual?" On the other side there's a bloc of anthropologists and area specialists, several of whom have done years of fieldwork in West Africa or South Asia; they're pre-sympathetic to the "Western standards are parochial" move but they'll be deeply suspicious of any tidy distinction or functionalist story, because they've watched that go wrong. And then there are two or three practitioner types — a former procurement-reform official and someone from a transparency NGO — who've actually tried to implement this stuff and will want to know what I want them to do differently on Monday morning. I should also admit I've read too much of the rationalist blogosphere's whole "the West is weird" thing, and I keep noticing that everyone nods along to the abstract point and then goes right back to using the same indices.

  The argument, roughly: "corruption" as the indices actually measure it bundles two things with different structures and, I want to claim, roughly opposite moral valences. Call them extraction and diversion. Extraction is the arms-length one — an official takes money from someone who's basically a stranger to them in order to hand over a service they were already supposed to provide: the bribe for the permit, the envelope to the nurse, the cut to get your file moved up the pile. It's thin, it's market-like, it's a tax on access. Diversion is the thick one — you steer the contract or the job or the fertilizer to your cousin, your co-villager, your patron's nephew, because that's what you owe them, and in a lot of places the local moral norm doesn't merely tolerate this, it demands it; the guy who *doesn't* take care of his people is the one who gets blamed. My claim is that the entire anti-corruption apparatus — the perception indices, the conditionality, the good-governance reform template — is calibrated to extraction as its paradigm case, and that what it's really tracking underneath is impersonality, the Weberian ideal of the bureau that treats everyone the same because nobody there is anyone's kin. Which is a specifically modern Northern European ideal, not a universal. But here's the part I think is actually the interesting one, and the part that'll get me in trouble with my own side: I don't think this ends in "so leave them alone." I think the moral valence is roughly backwards. Extraction is *worse* than the discourse admits — it's a regressive levy on exactly the people with the least access, and the only thing that can be said for it (the "grease the wheels" story, that it's how the poor get anything at all out of a state that otherwise ignores them) is a defense of a broken system, not of the practice. And diversion is *better* than the discourse admits, because where the state doesn't reach, the thick obligations are often the only functioning welfare system there is. So the reason the two get conflated isn't that they're morally similar; it's that the metric is secretly measuring distance from impersonality rather than harm.

  What I need from you is a Q&A prep sheet. Go through the objections I'll actually get in this specific room — not the generic internet version of this debate — ordered by how likely each is and how much damage it does if it lands, and phrased the way that bloc would actually phrase it (the micro people and the anthropologists will not put the same objection the same way even when they're making the same objection, so give me both versions where that happens), with a two-minute spoken reply for each and an honest note on where the reply is soft. Tell me what I should just concede up front to buy credibility with this particular room, and include the one objection I'm privately hoping nobody raises. Last thing, and I mean this: be self-critical about your own read. Say which single objection, if it actually holds up, should make me change the thesis rather than just defend it better, and where your guess about what this audience will care about is most likely to be off.
