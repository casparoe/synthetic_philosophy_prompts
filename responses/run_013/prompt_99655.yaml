  Below is a taxonomy tree designed to clarify positions in your psychiatry reading group. It separates the **metaphysical question** (what "mental illness" asserts) from the **political question** (when involuntary intervention is justified), using concrete cases to diagnose positions. The tree starts with the metaphysical question, then branches on a key political question derived from the most divisive case (danger to others). Each leaf combines answers to both questions, describes how that position handles the other cases, and notes real-world adherents (or why the position might be rare). The tree yields **8 distinct leaves**, with incoherent/unattractive combinations flagged.

  ---

  ### **Taxonomy Tree**  
  *Each branch is labeled with the question that splits it. Answer the questions sequentially to reach a leaf.*

  1. **Metaphysical Question: What does the label "mental illness" assert?**  
     *(Does it describe a biological disease, or is it a metaphor/normative label? Or is it a practical category?)*  
     - **A: It asserts a bodily disease** (a biological dysfunction in the brain/body, akin to physical illness).  
     - **B: It is a metaphor or normative label** (a social/moral judgment about "problems in living," not a real disease).  
     - **C: It is a practical/administrative kind** (a category for insurance, services, or social control, not inherently biological).  
     - **D: The concept is valid, but current categories are flawed** (reformist: mental disorders exist, but DSM-style diagnoses are unscientific).

  2. **Political Question: Is involuntary psychiatric containment justified for a person deemed mentally ill, dangerous to others, and refusing help?**  
     *(Derived from the "danger to others" case. This question splits each metaphysical branch.)*  
     - **Yes**: Involuntary intervention is acceptable on psychiatric grounds (e.g., disease impairs judgment).  
     - **No**: Involuntary intervention is never justified on psychiatric grounds (handle danger via criminal justice or other means).

  ---

  ### **Leaves (8 Positions)**  
  *Each leaf answers the diagnostic cases consistently. Cases:*  
  - **Grief**: Severe, prolonged grief disrupting life.  
  - **Voices**: Hearing distressing voices but not dangerous.  
  - **Drinking**: Heavy drinking with no distress/impairment.  
  - **Danger**: Dangerous to others, refuses help.  
  - **Admission**: Patient requests admission; doctors deem them "fine."

  #### **Leaf 1: Biological Realism + Pro-Containment**  
  - **Metaphysical**: Mental illness = bodily disease (e.g., "schizophrenia is a brain disorder").  
  - **Political**: "Yes" to containment for danger (disease justifies intervention).  
  - **Cases**:  
    - Grief → *Disease* (if severe, it's a disorder like "prolonged grief").  
    - Voices → *Disease* (symptom of illness; treat even if involuntary).  
    - Drinking → *Disease* (e.g., "alcohol use disorder" exists without distress).  
    - Danger → *Containment justified* (disease causes danger).  
    - Admission → *Admit only if ill* (doctors overrule patient if "fine").  
  - **Adherents**: Mainstream biological psychiatry (e.g., NIMH researchers).  

  #### **Leaf 2: Biological Realism + Anti-Containment**  
  - **Metaphysical**: Mental illness = bodily disease.  
  - **Political**: "No" to containment for danger (prioritize autonomy; use criminal justice if crimes occur).  
  - **Cases**:  
    - Grief → *Disease* (treat voluntarily, not involuntarily).  
    - Voices → *Disease* (offer help, but no forced treatment).  
    - Drinking → *Disease* (a disorder, but no intervention without consent).  
    - Danger → *Not justified* (no psychiatric containment; prosecute crimes).  
    - Admission → *Admit if patient insists* (patient autonomy over doctor opinion).  
  - **Adherents**: Rare. Coherent but unattractive (ignores danger until harm occurs).  

  #### **Leaf 3: Normative Metaphor + Pro-Containment**  
  - **Metaphysical**: Mental illness = myth/metaphor ("problems in living," not disease).  
  - **Political**: "Yes" to containment for danger (but *not* on disease grounds—use social control).  
  - **Cases**:  
    - Grief → *Not disease* (normal suffering; support if wanted).  
    - Voices → *Not disease* (distress is real; help if sought).  
    - Drinking → *Not disease* (lifestyle choice; intervene only if harms others).  
    - Danger → *Containment justified* (as social protection, not medicine).  
    - Admission → *Reject if "fine"* (doctors decide; no medical basis for admission).  
  - **Adherents**: Unnamed. **Incoherent** (uses psychiatric system while rejecting its basis).  

  #### **Leaf 4: Normative Metaphor + Anti-Containment (Szaszian)**  
  - **Metaphysical**: Mental illness = myth/metaphor.  
  - **Political**: "No" to containment for danger (abolish psychiatric coercion).  
  - **Cases**:  
    - Grief → *Not disease* (normal human experience).  
    - Voices → *Not disease* ("hearing voices" is a difference; support if wanted).  
    - Drinking → *Not disease* (moral/legal issue if harms others).  
    - Danger → *Not justified* (use criminal justice after crimes).  
    - Admission → *Reject if "fine"* (no medical basis; help voluntarily).  
  - **Adherents**: Szasz, anti-psychiatry movement (e.g., Foucault-influenced critics).  

  #### **Leaf 5: Administrative Kind + Pro-Containment**  
  - **Metaphysical**: Mental illness = practical category (like "disability" for services).  
  - **Political**: "Yes" to containment for danger (a function of the administrative system).  
  - **Cases**:  
    - Grief → *Disorder if impairing* (classify to access therapy/resources).  
    - Voices → *Disorder if impairing* (provide services; contain if dangerous).  
    - Drinking → *Disorder only if impairing* (no issue if "functional").  
    - Danger → *Containment justified* (part of system's role).  
    - Admission → *Admit if meets criteria* (e.g., for assessment, not disease).  
  - **Adherents": Social workers, pragmatic clinicians (focus on resource allocation).  

  #### **Leaf 6: Administrative Kind + Anti-Containment**  
  - **Metaphysical**: Mental illness = practical category.  
  - **Political**: "No" to containment for danger (system should be voluntary-only).  
  - **Cases**:  
    - Grief → *Disorder if impairing* (offer voluntary support).  
    - Voices → *Disorder if impairing* (help if requested).  
    - Drinking → *Disorder only if impairing* (no intervention without distress).  
    - Danger → *Not justified* (use criminal justice; no medical role).  
    - Admission → *Admit if patient insists* (honor self-referral).  
  - **Adherents**: Critical psychiatry reformers (e.g., recovery-oriented movements).  

  #### **Leaf 7: Reformist + Pro-Containment**  
  - **Metaphysical**: Concept valid, but current categories flawed.  
  - **Political**: "Yes" to containment for danger (for "real" disorders causing harm).  
  - **Cases**:  
    - Grief → *Not disorder* (current criteria too broad; grief is normal).  
    - Voices → *Disorder* (if part of valid psychosis; contain if dangerous).  
    - Drinking → *Disorder only if harmful* (reform criteria; no issue if "fine").  
    - Danger → *Containment justified* (for true disorders).  
    - Admission → *Reject if "fine"* (avoid over-medicalization).  
  - **Adherents**: DSM critics (e.g., Allen Frances).  

  #### **Leaf 8: Reformist + Anti-Containment**  
  - **Metaphysical**: Concept valid, but current categories flawed.  
  - **Political**: "No" to containment for danger (even reformed psychiatry shouldn’t coerce).  
  - **Cases**:  
    - Grief → *Not disorder* (reject current categories).  
    - Voices → *Disorder* (treat voluntarily, not forcibly).  
    - Drinking → *Disorder only if harmful* (intervene only if consent).  
    - Danger → *Not justified* (use criminal justice; no psychiatric role).  
    - Admission → *Admit if patient insists* (even if doctors disagree).  
  - **Adherents**: Civil libertarian reformers (rare; prioritizes autonomy over reform).  

  ---

  ### **Limitations & Unoccupied Positions**  
  - **Tree can’t separate**: Positions agreeing on metaphysics/danger-case but differing on other cases (e.g., two reformists split on grief). The tree prioritizes the danger case as the political fault line.  
  - **Unoccupied positions**:  
    - **Leaf 3 (Normative + Pro-Containment)**: Incoherent (can’t reject disease but justify medical containment).  
    - **Leaf 2 (Biological + Anti-Containment)**: Unattractive (ignores preventible harm; prioritizes autonomy unrealistically).  
    - **Leaf 8 (Reformist + Anti-Containment)**: Unexplored (most reformers accept some coercion).  

  This tree forces clarity by decoupling metaphysics from politics. Use it to "diagnose" positions during debates—e.g., "Your grief argument assumes biological realism, but your danger stance is anti-containment, so you’re in Leaf 2."
