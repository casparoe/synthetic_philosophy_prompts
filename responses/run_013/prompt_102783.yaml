prompt: |-
  I am writing a paper on the epistemic status of the Church–Turing thesis, and before I settle on a reading of it I want the specification laid out. Give me the desiderata that any analysis of the pre-formal notion of effective computability—what a person could compute by rote given unbounded time and scratch paper, without insight or ingenuity—must satisfy in order to count as an adequate analysis. For each requirement, supply the case or consideration that motivates it: the Ackermann function, which is intuitively computable yet not primitive recursive, and what that rules out; the Busy Beaver function, which the analysis must exclude as non-computable; the convergence of the Turing machine, the lambda calculus, the recursive functions, and register machines, and whether that convergence is merely evidence for an analysis or a requirement imposed on one; the insistence that the analysis not simply define computability as computability-by-Turing-machine, on pain of triviality; the demand that the analysis state what kind of claim the thesis is and what could justify it, given that the pre-formal notion admits no proof; and the question whether the thesis constrains real physical computing devices or only an idealized mathematical notion, together with what it must say about analog machines of unbounded real-valued precision and other would-be hypercomputers.

  Mark each requirement as non-negotiable or as the preference of a particular camp. Then tell me which requirements pull against one another. I expect the pair I care about most—the analysis must be answerable to the informal notion, and must not presuppose a machine model—to drive the thesis toward either triviality or unprovability; I want to know whether the remaining requirements can still be met once that pair is fixed, and whether the physical-scope requirement and the requirement that the thesis underwrite the unsolvability results are even compatible with each other. Close with a short verdict on the three standard construals—as a definition or convention, as an empirical hypothesis, and as conceptual analysis—judged against the list. Keep the weight on the criteria; the verdict can be terse.
reasoning: |-
  Okay, the user is writing a paper on the epistemic status of the Church-Turing Thesis (CTT) and wants a comprehensive list of desiderata for analyzing the pre-formal notion of effective computability. They've mentioned several key points like the Ackermann function, Busy Beaver, convergence of models, avoidance of triviality, justification, and physical scope. Let me unpack their query step by step.

  First, they want desiderata that any analysis must satisfy. The Ackermann function is computable but not primitive recursive, which rules out weaker formal systems. So one desideratum is that the analysis must cover all intuitively computable functions, including those like Ackermann. The Busy Beaver function isn't computable, so the analysis must exclude such functions. This is non-negotiable.

  Then there's the convergence of different models (Turing machines, lambda calculus, etc.). The user is asking whether this convergence is evidence or a requirement. Some camps see convergence as strong evidence, while others might impose it as a requirement to avoid model-specific definitions. That's a point of contention.

  Avoiding triviality is crucial. Defining computability as "computable by a Turing machine" would make CTT a tautology. The analysis needs to capture the pre-formal notion independently. Also, the thesis must be justifiable despite the informal notion not allowing proof. That means the analysis should clarify the thesis's status—definition, empirical, or conceptual.

  The physical scope is another issue. Does CTT apply to real physical devices or just idealized math? Analog computers with infinite precision challenge this, so the analysis must address hypercomputation. Plus, CTT must underwrite unsolvability results like the halting problem, which assumes that any effective method can be modeled formally. But if physical systems could hypercompute, that might conflict with unsolvability. There's tension here.

  The user is particularly concerned about two requirements: answerability to the informal notion without presupposing a machine model. If the analysis is tied to the informal concept but avoids a specific model, it risks triviality or unprovability. They want to know if other requirements can still be met under this constraint. Also, whether the physical scope and unsolvability are compatible. If CTT includes physical devices, hypercomputers might threaten unsolvability proofs, but if it's idealized, those proofs hold. So maybe distinguishing mathematical from physical is key.

  For the standard construals: a definitional approach avoids justification but trivializes CTT. Empirical hypotheses face counterexamples from hypercomputation. Conceptual analysis navigates between but must handle the physical scope carefully. The user likely leans towards conceptual analysis but needs to resolve the tension between physical hypercomputation and unsolvability proofs. They might need to argue that CTT as conceptual analysis applies to mathematical computability, leaving physical systems as a separate empirical question.
answer: |-
  Here are the desiderata for an adequate analysis of effective computability, categorized and motivated, with their status and tensions highlighted:

  ### Non-Negotiable Desiderata
  1.  **Coverage of Intuitively Computable Functions:**  
      *Must include all functions computable by idealized human effort (unbounded time/paper, no insight).*  
      **Motivation:** Ackermann function. It is clearly computable step-by-step but not primitive recursive. Any analysis failing to include it (e.g., defining computability as primitive recursiveness) is inadequate.  
  2.  **Exclusion of Intuitively Non-Computable Functions:**  
      *Must exclude functions where no finite rote procedure exists to determine their value for all inputs.*  
      **Motivation:** Busy Beaver function. Its value grows faster than any computable function. An analysis permitting it (e.g., equating computability with definability in arithmetic) fails.  
  3.  **Non-Triviality / Independence from Specific Formalisms:**  
      *Must not define effective computability solely as "computability by Turing Machine" (or λ-calculus, etc.)*.  
      **Motivation:** To avoid making CTT a trivial tautology ("Turing-computable functions are Turing-computable"). The pre-formal notion must be analyzed *prior* to or *independently* of specific formal models.  
  4.  **Underwriting Unsolvability Results:**  
      *Must provide the foundation for proving the unsolvability of problems like the Halting Problem, Entscheidungsproblem, etc.*  
      **Motivation:** The historical and mathematical significance of CTT lies in justifying that these formal unsolvability results reflect genuine limitations of *any* effective method.  

  ### Contingent Desiderata (Camps Vary)
  5.  **Convergence of Formalisms as Requirement (vs. Strong Evidence):**  
      *Must entail or strongly predict the equivalence of Turing Machines, λ-calculus, General Recursion, Register Machines, etc.*  
      **Motivation:** The observed convergence is powerful evidence. Some (e.g., Gödel, "Post-Turing" camp) see this convergence as a *requirement* for adequacy: any analysis failing to predict it is suspect. Others see convergence as *evidence for* an independently motivated analysis.  
  6.  **Clarification of Justificatory Status:**  
      *Must state what kind of claim CTT is (definition, empirical, conceptual) and how it can be justified despite the informal nature of its key concept.*  
      **Motivation:** The pre-formal notion resists formal proof. Analyses differ: Definitions/conventions need no justification but risk triviality; empirical hypotheses face falsifiability issues; conceptual analyses require philosophical argument.  
  7.  **Scope w.r.t. Physical Computation:**  
      *Must specify whether CTT constrains only an idealized mathematical notion or also *physically realizable* computation.*  
      **Motivation:** Analog "hypercomputers" (e.g., using unbounded real-valued precision) or quantum gravity models challenge physical scope. Some (e.g., physicalists like Deutsch, Pitowsky) insist CTT applies to physics. Others (e.g., mathematical idealists) restrict it to abstract procedures.  

  ### Key Tensions Between Desiderata
  *   **Non-Triviality vs. Underwriting Unsolvability:** Non-triviality demands independence from formal models. Yet, the *proofs* of unsolvability rely on specific models (Turing Machines, etc.). Resolving this requires arguing that the formal models *correctly capture* the independent pre-formal notion.
  *   **Physical Scope vs. Underwriting Unsolvability:** If CTT applies to physics (Desideratum 7), then physical hypercomputers (if possible) could solve classically unsolvable problems, undermining Desideratum 4. If CTT is only mathematical, Desideratum 4 holds, but its relevance to physical computers becomes contingent (an empirical hypothesis).
  *   **Answerability to Informal Notion + Non-Presupposition of Model vs. Provability:** Your core tension. Fixing these demands an analysis grounded *only* in the vague pre-theoretic concept, making a rigorous *proof* of CTT impossible by design. This directly conflicts with any requirement demanding CTT be provable. The remaining desiderata *can* be met: Coverage/Exclusion rely on intuitive judgments about cases (Ackermann, Busy Beaver). Convergence serves as compelling evidence. Justificatory status becomes crucial (likely leaning towards conceptual analysis). Physical scope remains contentious but addressable *within* the conceptual framework. Unsolvability holds *if* the analysis supports the adequacy of the formal models for *mathematical* computability.
  *   **Clarification of Justificatory Status vs. Convergence Requirement:** A purely definitional approach trivializes convergence; an empirical approach struggles to explain why *all* proposed models converge if it's merely contingent; a conceptual approach best explains convergence but is hardest to "prove."

  ### Verdict on Standard Construals Against Desiderata
  1.  **Definition/Convention:**  
      *Satisfies:* Non-Triviality? (No, fails utterly - defines computability *as* T-computability).  
      *Fails:* Non-Triviality (spectacularly), Justificatory Status (renders CTT tautological, no justification needed or possible), often struggles with Physical Scope (is this a convention about math or physics?).  
  2.  **Empirical Hypothesis (about human cognition or physical laws):**  
      *Satisfies:* Physical Scope (strongly).  
      *Fails:* Justificatory Status (vulnerable to future counterexamples like hypercomputation, struggles to explain convergence as necessary), Coverage/Exclusion (risk - if a hypercomputer works, BB might become "computable"), Underwriting Unsolvability (threatened by physical hypercomputation).  
  3.  **Conceptual Analysis (of "effective calculability"):**  
      *Satisfies:* Non-Triviality (analyzes pre-formal notion), Justificatory Status (provides philosophical argument), Convergence (best explains it as necessity), Coverage/Exclusion (grounded in intuitions), Underwriting Unsolvability (supports formal models as capturing the concept).  
      *Fails/Challenged:* Physical Scope (Must clarify relationship to physics - does the *concept* apply? Or is physical CTT a further claim?). Requires robust philosophical defense.

  **Conclusion:** The desiderata of Answerability and Non-Presupposition push strongly towards **Conceptual Analysis** as the only viable non-trivial approach capable of meeting the core requirements (Coverage, Exclusion, Underwriting Unsolvability, explaining Convergence). However, Conceptual Analysis faces its greatest challenge in cleanly addressing the **Physical Scope** requirement while preserving the **Underwriting of Unsolvability**, often leading to a bifurcation: CTT as conceptual truth about *mathematical* computability (securing unsolvability), plus a separate (empirical) claim about physical realizability.
