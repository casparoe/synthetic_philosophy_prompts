prompt: |-
  I chair the board of a small housing cooperative — nine members, monthly meetings, nobody with any mediation training — and we keep deadlocking on the same kind of quarrel. Someone wants the roof replaced this year; someone else says we cannot afford it and that the leaks are being exaggerated. One member's composting is either a shared resource or a nuisance. A mural on the bike shed is either community art or a defacement. I have been reading about the Jain doctrine of many-sidedness on my own, and I think it is what we actually need, but every version I have found either collapses into everyone's opinion being equally valid or turns into a hedge-everything formality that settles nothing.

  Please write me a procedure I can actually run at a meeting — a checklist or a flowchart in words, in the forty minutes we can spare per dispute — that stays faithful to the machinery rather than the slogan. I want it to use, and not water down, the difference between the analysis into partial standpoints, each of which gets hold of one side of a thing, and the analysis of assertion, in which a claim is put forward as holding only in some respect, where that respect belongs to the claim itself and is not a measure of the speaker's confidence, and the sevenfold scheme of qualified predications, if any of that can be made usable without turning the meeting into a logic seminar. What has to happen in order, and what counts as a sufficient answer at each step? Where does the procedure stop and say that this is really a factual dispute with a right answer? Where does it stop and say that the question is one of values and has to go to a vote or to a person? And where does it not help at all?

  Then run it on two of the disputes above, the roof assessment and the composting complaint, and include a small set of test sentences the chair can put to a contested claim to check whether the qualified version is both true and worth saying. Be honest about where the procedure will misfire: a member acting in bad faith, a member who is simply wrong about a fact, a majority that uses many-sidedness to avoid hearing the one person it is inconveniencing. Tell me what to do with the objection that the procedure is itself just one more standpoint. And tell me where it will give an answer I will not like, including the possibility that it rules against the position I hold. Please write in American English, and do not send me to any books — I am not going to read them.
reasoning: |-
  Okay, the user chairs a small housing cooperative board with nine members. They keep deadlocking on disputes like roof replacements, composting, and murals. They've been reading about the Jain doctrine of many-sidedness but found existing versions either too relativistic or too formal. They want a practical, 40-minute procedure for meetings that uses Jain concepts without turning into a logic seminar.

  First, I need to unpack their core needs. They need conflict resolution that's structured yet flexible, respects multiple perspectives without deadlocking, and is time-bound. The Jain concepts of partial standpoints and qualified predications must be operationalized. Key elements include distinguishing factual vs. values disputes, handling bad faith, and ensuring the process doesn't become circular.

  Assessing the user's identity: they're a pragmatic leader without formal mediation training, dealing with volunteers. Their explicit request is a procedure, but deeper needs include preserving group cohesion, preventing burnout from recurrent disputes, and finding legitimacy beyond majority votes. They also fear the procedure being dismissed as "just another standpoint."

  For the structure, I consider a phased approach: framing, standpoint mapping, qualification, synthesis. Each phase needs clear time limits and exit criteria. The sevenfold scheme should be simplified—maybe just three qualifications (context, mode, limitation) to avoid complexity. Factual disputes should be flagged early and delegated to fact-checking.

  Testing on the roof example: the cost concern is a values issue (risk tolerance), while leak severity is factual. The procedure would separate these and force evidence for facts. For composting, it's mostly values (nuisance vs. shared resource), so synthesis focuses on trade-offs, not truth.

  Crucial nuances: the chair must enforce "respect" qualifications neutrally. Test sentences like "Is this true only if we prioritize X?" can reveal biases. Bad faith participants might derail with endless qualifications; mitigation includes timeboxing and assigning fact-checks. If the procedure rules against the chair, it must be accepted—modeling integrity.

  Finally, honesty about limitations: the method fails if members reject the framework or if power imbalances persist. The chair's response to "just another standpoint" is meta-qualification: "This procedure is a standpoint about process efficiency, accepted only if it resolves deadlocks."

  This balances Jain principles with cooperative pragmatism, targeting the 40-minute window.
answer: |-
  Here’s a concrete, 40-minute procedure based on Jain *anekāntavāda* (many-sidedness), stripped of philosophy and formatted for your boardroom. It forces specificity, exposes hidden assumptions, and flags when to vote or fact-check. **Bold text is what you say aloud**.

  ---

  ### **The Many-Sidedness Procedure (40-Minute Version)**  
  **Goal:** Unpack *why* people disagree, separate facts from values, and find qualified solutions or clear next steps.  

  #### **Phase 1: Frame the Dispute (5 mins)**  
  1.  **Chair states:** *“We have [issue]. Member A, state your position in one sentence. Member B, state yours.”*  
  2.  **Chair reframes:** *“The core tension is between [A’s position] and [B’s position]. We’ll map standpoints.”*  
      *   *Exit if:* Both positions are identical (miscommunication). Stop and clarify.  
      *   *Exit if:* Pure factual dispute (e.g., *“Is the roof leaking?”*). Assign fact-checking task.  

  #### **Phase 2: Standpoint Mapping (10 mins)**  
  3.  **Chair asks each side:** *“What is the *core value* behind your position? (e.g., safety, thrift, fairness, aesthetics).”*  
  4.  **Chair asks each side:** *“What specific *condition* must be true for your position to hold? (e.g., ‘Roof leaks cause structural damage,’ ‘Compost attracts pests’).”*  
  5.  **Chair lists:**  
      *   *Standpoint 1:* Value = [e.g., Financial Security], Condition = [e.g., Reserve fund < $X].  
      *   *Standpoint 2:* Value = [e.g., Safety], Condition = [e.g., Leaks penetrate sheathing].  
      *   *(Add others if members speak up)*  
      *   *Exit if:* A condition is verifiable (e.g., *“Reserve fund balance is $Y”*). Assign fact-check.  

  #### **Phase 3: Qualification & Synthesis (20 mins)**  
  6.  **Chair tests key claims** using “Test Sentences” (see below). Focus on contested *conditions*.  
  7.  **Chair forces qualification:** *“Claim: ‘The roof must be replaced.’ Is this true…  
      *   *Only if* [condition]? (e.g., *‘Only if leaks are causing mold’*)  
      *   *In the mode of* [value]? (e.g., *‘In the mode of long-term cost savings’*)  
      *   *Unless* [limitation]? (e.g., *‘Unless repairs cost <50% of replacement’*)*  
  8.  **Chair synthesizes:**  
      *   *If conditions conflict:* *“We agree on [shared value] but disagree on [specific condition]. This is factual. We need evidence on [condition] by next meeting.”*  
      *   *If values conflict:* *“We disagree on [Value A] vs. [Value B]. This is a values choice. We’ll vote after listing pros/cons.”*  
      *   *If qualified agreement emerges:* *“Can we agree: ‘We will replace the roof *if* [condition] is confirmed by [evidence]’?”*  

  #### **Phase 4: Decision or Deferral (5 mins)**  
  9.  **Chair declares outcome:**  
      *   *Factual Dispute:* Assign evidence-gathering (e.g., *“Treasurer & Secretary inspect roof, report leaks/costs at next meeting”*).  
      *   *Values Dispute:* Call vote now or schedule vote after brief pro/con discussion.  
      *   *Synthesized Solution:* Adopt the qualified agreement.  
      *   *Deadlock Persists:* Table for next meeting with specific homework.  

  ---

  ### **Test Sentences for Claims**  
  *(Chair uses these to force precise qualification)*  
  1.  **“Is this true ONLY IF ________?”** (Exposes hidden conditions)  
  2.  **“Is this true ONLY IN THE MODE OF ________?”** (Exposes value lens, e.g., “aesthetics,” “cost”)  
  3.  **“Is this true UNLESS ________?”** (Exposes deal-breakers)  
  **A sufficient answer:** Names a specific, concrete condition/value/limitation. Vague answers (“common sense,” “obviously”) fail.  

  ---

  ### **Applied to Your Disputes**  

  #### **1. Roof Replacement**  
  *   **Member A (Replace):** *“Roof must be replaced now! Leaks are severe.”*  
  *   **Member B (Delay):** *“We can’t afford it. Leaks are exaggerated.”*  
  *   **Phase 1:** Tension: *Safety/Asset Protection vs. Financial Security.*  
  *   **Phase 2:**  
      *   *Standpoint A:* Value = Property Integrity. Condition = Leaks cause structural damage/mold.  
      *   *Standpoint B:* Value = Financial Stability. Condition = Replacement would deplete reserves below $10k OR repairs are possible under $5k.  
  *   **Phase 3:**  
      *   *Test Claim (A):* “Leaks are severe.”  
          *   *“True ONLY IF water penetrates roof sheathing?”* (If yes, this is factual - needs inspection).  
          *   *“True ONLY IN THE MODE OF preventing future damage?”* (Yes, but B cares about cost mode).  
      *   *Test Claim (B):* “We can’t afford it.”  
          *   *“True ONLY IF replacement costs >$15k AND reserves <$20k?”* (Factual - check quotes/accounts).  
      *   **Synthesis:** *Dispute hinges on FACTS: 1) Severity of leaks (structural damage?), 2) Exact cost of replacement vs. repair, 3) Reserve fund balance. Values (safety vs. thrift) depend on these facts.*  
  *   **Phase 4:** **Factual Dispute.** Assign 2 members (pro-replace & pro-delay) to get:  
      *   Roof inspection report (focus: water penetration beyond shingles?)  
      *   3 quotes for full replacement.  
      *   2 quotes for repair.  
      *   Current reserve balance & 5-year projection.  
      *   **Vote delayed until next meeting.**  

  #### **2. Composting (Nuisance vs. Shared Resource)**  
  *   **Member A (Nuisance):** *“It smells and attracts rats!”*  
  *   **Member B (Resource):** *“It’s great fertilizer and reduces waste!”*  
  *   **Phase 1:** Tension: *Sanitation/Aesthetics vs. Sustainability/Shared Benefit.*  
  *   **Phase 2:**  
      *   *Standpoint A:* Value = Cleanliness/Health. Condition = Compost bin smells >5ft away OR attracts verifiable pests.  
      *   *Standpoint B:* Value = Environmentalism/Community. Condition = Bin is properly managed (no meat/dairy, turned regularly).  
  *   **Phase 3:**  
      *   *Test Claim (A):* “It smells/attracts rats.”  
          *   *“True ONLY IF verified by neutral observer/photo evidence?”* (Factual - needs check).  
          *   *“True UNLESS bin is moved to [location]?”* (Possible synthesis).  
      *   *Test Claim (B):* “It’s a shared resource.”  
          *   *“True ONLY IF >50% of members use the compost?”* (Factual - survey).  
          *   *“True ONLY IN THE MODE of environmental values?”* (Yes, but A values sanitation).  
      *   **Synthesis:** *Mix of Fact & Value. Facts: 1) Is there objectively offensive smell/verifiable pests? 2) How many members use it? Values: Sanitation vs. Environmentalism.*  
  *   **Phase 4:**  
      *   *Fact Check:* Assign neutral member to inspect bin for smell/pests *this week* and report. Survey members: “Do you use the compost? Y/N.”  
      *   *Values Synthesis Attempt:* *“Can we agree: ‘The compost bin may remain ONLY IF [no smell/pests verified] AND UNLESS it causes verifiable health hazards, but its location/management might need adjustment’?”*  
      *   If synthesis fails after facts in: **Values Dispute.** Vote on: *“Continue composting under [revised management rules] OR ban composting?”*  

  ---

  ### **Where It Misfires & How to Handle It**  

  1.  **Bad Faith Actor:**  
      *   *Problem:* Endless irrelevant qualifications, refuses to specify conditions.  
      *   *Fix:* **Enforce Test Sentences strictly.** “Your answer ‘it’s just wrong’ doesn’t specify a condition. Please answer: Is your claim true ONLY IF [X]? If you can’t specify, we note your objection but move to synthesize other standpoints.”  

  2.  **Factually Wrong Member:**  
      *   *Problem:* Insists “Leaks aren’t serious” against inspection proof.  
      *   *Fix:* **Phase 1/2 Exit.** “Your condition was ‘no structural damage.’ The inspection report shows damaged sheathing. That condition isn’t met. We move to discuss solutions based on this fact.”  

  3.  **Majority Tyranny:**  
      *   *Problem:* “We all *qualify* that Muriel’s pain about noise is valid… but we vote to ignore it.”  
      *   *Fix:* **Force Value Conflict Acknowledgement.** “The synthesis shows Muriel’s standpoint values [Quiet Enjoyment] which conflicts with the majority’s [Convenience]. Muriel, does the qualification ‘no loud composting after 8pm’ address your concern sufficiently? If not, this remains a values conflict – but the vote must acknowledge it overrides a core value for a minority.” Record this explicitly.  

  4.  **“This Procedure is Just Another Standpoint!”**  
      *   *Response:* **Agree & Qualify It.** “Absolutely. This is a standpoint *about efficient, respectful decision-making*. It holds ONLY IF we value resolving disputes faster than 90 minutes, UNLESS a member can prove it causes harm. We’re using it provisionally because deadlocks harm us all. If it fails consistently, we’ll revisit.”  

  5.  **Gives an Answer You Hate:**  
      *   *Problem:* Your pro-roof-replacement stance loses because the inspection finds only superficial leaks.  
      *   *Fix:* **Accept the Synthesis.** Your role as Chair is to enforce the *process*, not win. The procedure exposed your position’s dependency on unproven severe damage. The qualified outcome (“repair now, monitor closely”) is legitimate. Fighting it wrecks the tool’s credibility.  

  ---

  ### **When It Won’t Help**  
  *   **Personality Clashes:** If the *real* issue is “I hate Dave,” this exposes it (e.g., Dave’s conditions are incoherent) but won’t resolve it. Needs separate mediation.  
  *   **Blatant Rule Violations:** If composting violates bylaws, it’s a legal issue, not values. Stop and enforce rules.  
  *   **True Emergencies:** A collapsing roof needs action, not standpoint mapping.  

  **Chair’s Toolkit:**  
  *   Timer (strict 40 mins).  
  *   Whiteboard (Map Standpoints & Conditions visibly).  
  *   “Test Sentences” printed in front of you.  
  *   Gavel (metaphorical): “We’re in Phase 2. Save qualifications for Phase 3.”  

  This forces specificity, drains slogans of power, and shows *why* you’re deadlocked. It won’t make everyone happy, but it makes conflict productive. Good luck!
