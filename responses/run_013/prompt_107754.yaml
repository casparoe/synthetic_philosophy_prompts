answer: |-
  ### Reconstructing the Implicit Theory of the International Anti-Bribery Regime  
  I commit to this reading: **The regime presupposes a universalist, deontological conception of public office as a sacred trust, where the officeholder is a depersonalized vessel of state authority. Corruption is defined as any non-state-sanctioned transfer of value to this vessel, irrespective of cultural context or private-sector analogies.** This view rules out anthropological relativism and principal-agent reductivism. Below, I defend this position through systematic reconstruction.  

  ---

  ### I. Candidate Presuppositions (Pre-Settled)  
  1. **Public Office Conceptions**:  
     - *Trustee Model*: Officeholders are stewards of an impersonal order; personal gain corrupts the office’s essence.  
     - *Principal-Agent Model*: Officeholders are contractors; corruption is an incentive problem solvable by penalties.  
     - *Anthropological Model*: Officeholders are nodes in social-exchange networks; "corruption" is culturally contingent.  

  2. **Cultural Universality**:  
     - *Monism*: Bribery is a culture-independent harm (e.g., democratic equality eroded).  
     - *Relativism*: "Corruption" is a Western legal category misapplied to non-market moral economies.  
     - *Hybrid*: Core harms are universal, but expressions vary culturally.  

  3. **Public-Private Asymmetry**:  
     - *Institutional Difference*: Public office demands total neutrality; private roles permit reciprocal loyalty.  
     - *Economic Reductionism*: Both are principal-agent problems; asymmetry is arbitrary legal overreach.  

  ---

  ### II. Settled Reconstruction: The Sacred Trust Theory  
  **A. Public Office as Impersonal Trust**  
  The regime’s core presupposition is that **public office is a fiduciary role severed from the holder’s personhood**. This explains:  
  - **Nominal Gift Caps (£20–50)**: Token gifts avoid "category errors" by preventing any conflation of personal and official relationships. A bottle of whisky to a customs officer isn’t prohibited because it *might* influence behavior (principal-agent concern) but because it *defiles* the office’s purity. The officeholder must be "disinterested" in a Kantian sense—acting from duty, not advantage.  
  - **"Anything of Value" Scope**: Travel, internships, and donations are banned because they implicate the official’s *social personhood*, violating the office’s requirement of abstraction from private identity.  

  *Why principal-agent fails*: If mere incentive-alignment were the issue, disclosure (e.g., gift registers) would suffice. The regime’s prophylactic bans ("no gifts, full stop") imply corruption is *ontological*—a violation of office itself.  

  **B. Corruption as Culture-Independent**  
  Section 5 of the UK Bribery Act is **substantive moral universalism**, not jurisdictional pragmatism:  
  - **Rejection of Local Custom**: By disregarding unwritten practices (e.g., gift-giving rituals), the law asserts that corruption’s harm—subverting impartial state authority—transcends culture. Customary "gifts" are reclassified as "bribes" because they inject personal loyalty into impersonal institutions.  
  - **Anthropological Challenge Overruled**: The regime treats patronage/gift economies as incompatible with modern statehood. When a "reasonable person in the UK" judges foreign officials, it universalizes a specific ideal: the bureaucrat as Rawlsian veil of ignorance.  

  **C. Public-Private Asymmetry: Institutional Sanctity**  
  The allowance of lavish corporate hospitality (e.g., $400 dinners) alongside public-sector bans presupposes:  
  - **Public Office’s Unique Burden**: State authority derives legitimacy from equal treatment of citizens. Private procurement lacks this foundational egalitarianism; relationships here are market-mediating, not democracy-undermining.  
  - **Asymmetry Defended**: A firm’s dinner for a private client presupposes *permissible partiality*—private roles can ethically favor partners. A public official cannot, as their role exists solely to serve the *res publica*.  

  ---

  ### III. Rival Views Quietly Ruled Out  
  1. **Principal-Agent Reductionism**:  
     - *Ruled out by*: Strict liability (no need to prove quid pro quo), nominal gift bans (irrational if only incentives mattered).  
     - *If adopted*: Compliance would replace gift bans with disclosure + risk-based thresholds (e.g., "gifts under $100 permitted if recorded").  

  2. **Anthropological Relativism**:  
     - *Ruled out by*: Section 5’s dismissal of custom, "reasonable person" standard imposing UK norms globally.  
     - *If adopted*: Compliance would require ethnographic vetting (e.g., "Is this gift locally normative?"), not universal caps.  

  ---

  ### IV. Weakest Link: Universalism’s Democratic Bias  
  **Step I Least Confident In**: My claim that Section 5’s "reasonable person" standard reflects **moral universalism rather than liberal hegemony**.  
  - **What Would Move Me**: Evidence that drafters saw this as *jurisdictional* (e.g., "We punish UK firms, so we use UK standards") not moral. If compliance programs consistently deferred to local written laws (e.g., Saudi gift thresholds) without moral judgment, it would suggest pragmatism, not universalism.  
  - **Current Defense**: The Act’s rejection of *all* unwritten custom—even where compatible with local law—shows a commitment to corruption’s culture-independent harm.  

  ---

  ### Conclusion  
  The anti-bribery regime enshrines a **sacred trust theory**: public office is an impersonal institution corrupted by *any* infusion of private value. This deontological view explains gift bans, cultural universalism, and public-private asymmetry. Rival frameworks (principal-agent, relativism) cannot coherently justify the regime’s rigidity. To replace this with anthropological relativism would require dismantling compliance’s universal prohibitions—a shift from "no whisky, ever" to "when in Rome." Yet the regime’s steadfastness confirms its presupposition: the officeholder is not a person but a vessel of the state.  

  **Final Position**: The apparatus presupposes a Weberian bureaucrat, stripped of social embeddedness, for whom the whisky bottle is not a gift but a desecration.
