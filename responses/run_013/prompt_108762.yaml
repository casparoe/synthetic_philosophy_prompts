  Here's the joke:

  A group selectionist proudly presents their altruistic species: "See how their sacrifice boosts group survival! Clear higher-level adaptation!"  
  A meiotic driver gene pipes up: "Actually, I’m sabotaging half the gametes to spread myself, tanking individual fitness for *my* benefit."  
  The group selectionist shrugs: "But the group still thrives!"  
  The gene sneers: "Calling that 'group selection' is just creative accounting. My wreckage gets written off as an 'individual cost' in your ledger—you’re not tracking the real causal debtor."  

  **Playing on:** How group-selection models often absorb genic sabotage (like meiotic drive) as mere "costs" within group-benefit accounting, sidestepping the gene’s causal role.
