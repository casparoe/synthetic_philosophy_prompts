prompt: |-
  I cover European politics and ideas for a monthly magazine, and I keep meeting the same image from people who want to insist that the European Union cannot afford to stand still: integration is a bicycle, and a bicycle that stops moving falls over. In Brussels it does a great deal of work. It is used to argue that any pause in deepening, whether a slower treaty round, a member state that wants powers back, or an electorate that wants a breather, is never a neutral option but a step towards disintegration, and so to convert the Union's founding commitment to ever-closer union from a political programme into a condition of its survival. I would like that analogy audited rather than admired. Give me exactly five numbered points, each a sentence or two, with no introduction and no conclusion. First, the mapping: what plays the part of the rider, the pedalling, the speed, the balance, the road and the fall. Second, which parts of that mapping are doing genuine work, in the sense that the target really does have the feature the argument needs. Third, where the mapping breaks, with attention to what a bicycle supplies for free and the Union does not: a destination, a single rider with purposes of their own, the option of dismounting, and the fact that a bicycle is stable at any constant speed and unstable only at zero. Fourth, what the image smuggles in about who is riding, where they are going and whether anyone else agreed to the journey, and how that bears on the two standing complaints, that the Union suffers a democratic deficit and that membership costs states their sovereignty. Fifth, whether the conclusion the image is used to license, that stasis means collapse, survives the audit, and if it does not, what comparison would serve better. Test the whole thing against the awkward case: one rider has now got off, and the bicycle has not fallen over. Please write in British English.
reasoning: |-
  Okay, the user is a journalist covering European politics and ideas for a monthly magazine. They keep encountering this "EU as bicycle" analogy used to argue that integration must constantly deepen or risk collapse. They want me to audit this metaphor critically without admiration.

  Hmm, this bicycle analogy is clearly a rhetorical device used by integration advocates. The user wants it dissected methodically - they're tired of it being deployed uncritically in Brussels circles. Their frustration comes through when mentioning how it converts "ever-closer union" from political choice to survival necessity.

  Breaking this down: First need to map the analogy components literally. The rider would be EU institutions, pedalling integration efforts, speed as pace of integration, balance as stability, road as political environment, fall as disintegration. 

  Second, which parts hold? The need for forward momentum does resonate - the EU has expanded competencies over time, and crises often drive integration. But the "balance at zero speed" claim is where it starts breaking.

  Third, the cracks show. Bicycles are stable at constant speed but EU institutions can maintain status quo. Unions can pause without collapsing - look at the eurozone crisis period. No equivalent to dismounting exists in EU context. 

  Fourth, the metaphor smuggles in problematic assumptions. It implies a single rider (EU elites) with predetermined destination, ignoring democratic consent. This directly fuels sovereignty and democratic deficit complaints by making dissent appear irrational.

  Fifth, the core claim fails - Brexit proved the bicycle doesn't fall when one rider dismounts. Static periods like the "period of reflection" post-2005 referendums didn't cause collapse. A better comparison might be constructing a building where pauses for consolidation are necessary.

  The Brexit test case is crucial - it empirically disproves the analogy's central claim. The EU continued functioning after UK departure, showing stasis ≠ collapse. The metaphor serves integrationists by making their agenda appear physically inevitable rather than politically contested.

  User's clearly aiming to arm themselves against this rhetorical tactic. They need ammunition showing it's not descriptive but prescriptive - a way to shut down debate about integration's pace and direction. The sovereignty and democratic deficit angles are particularly sensitive in current EU debates.
answer: |-
  Here are five numbered points auditing the bicycle analogy for EU integration:

  1.  **Mapping:** The rider represents EU institutions or integrationist elites; pedalling signifies treaty reforms or policy deepening; speed equals the pace of integration; balance equates to the EU's political stability; the road is the geopolitical and economic environment; falling over symbolises disintegration or collapse.
  2.  **Genuine Work:** The analogy does capture the *perceived* need for constant forward momentum to manage centrifugal forces within the diverse Union and navigate external challenges (the "road"), reflecting a core belief among integrationists that complacency invites crisis.
  3.  **Mapping Breaks:** The analogy breaks fundamentally: Unlike a bicycle, the EU *can* be stable at zero speed (maintaining the *acquis* without further integration); it lacks a single rider with clear, agreed purpose; the option to "dismount" (like varying integration levels or leaving) exists without immediate collapse; the bicycle itself provides inherent stability at constant speed, which the EU does not inherently supply.
  4.  **Smuggled Assumptions:** The image smuggles in a single, purposeful rider (elites/institutions) determining direction, overriding dissent. It implies the journey's destination ("ever closer union") is inevitable and non-negotiable, dismissing the democratic deficit complaint by framing resistance as endangering survival and ignoring that sovereignty cessions require ongoing democratic consent, not just initial membership.
  5.  **Conclusion Validity & Alternative:** The conclusion that stasis means collapse does not survive. The UK ("one rider") departed, yet the EU ("bicycle") demonstrably did not fall over. A building site metaphor serves better: Construction (deepening) can pause for consolidation, planning, or democratic consultation; the existing structure remains usable; different sections may progress at varied speeds; and the final design can be debated, reflecting the EU's multi-speed realities and need for democratic legitimacy.
