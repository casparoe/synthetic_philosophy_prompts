prompt: |-
  I'm in this wierd reading group where we mostly read 18th-century political economy, and last night we got into a stupidly long arguin about what David Hume would say about a country like the one in a scenario I made up. I know Hume died long before central banks, fiat money, CBDCs, floating exchange rates, or semiconductor industrial policy, so I'm not asking for a literal quote or a time-travel interview. I want a reconstruction: given his writings on money and international trade, and especially the mechanism where a trade surplus pulls in gold, raises domestic prices, and eventually erodes the surplus, what would his framework push him to say about my scenario? The scenario: Valdoria is a small open economy. It issues a central bank digital currency that charges demurrage, meaning balances lose about 2 percent of their value per year if you just sit on them. It runs a persistent current account deficit around 4 percent of GDP, financed by foreigners buying its government bonds. It has a 25 percent tariff on imported semiconductors and heavy subsidies for domestic chip fabs. Its central bank has a dual mandate plus a price-level target. My friend Maya thinks Hume would basically be a modern MMT guy who would love the demurrage CBDC because it speeds up circulation and would tolerate the tariffs as strategic policy. My friend Dev thinks Hume would be a hard-money, free-trade absolutist who would hate the CBDC, hate the deficit, and hate the tariffs. I think they're both flattening him, but I can't quite say how. I don't need cites, a bibliography, or a reading list; I'm stuck on a train with no wifi, so just reason it out from what you know.

  Can you give me your answer in these sections, in this order: first a section called The Humean toolkit, about 2 to 3 paragraphs, explaining which parts of his monetary and trade framework actually bear on the scenario; then a section called The demurrage CBDC, about 2 paragraphs, on whether he would see it as a clever way to keep money circulating or as a dangerous tax on holding wealth; then a section called Tariffs and the deficit, about 2 paragraphs, on whether his adjustment mechanism makes tariffs self-defeating or leaves room for strategic exceptions; then a section called Maya and Dev, about 1 to 2 paragraphs, saying which of their predictions is closer and where each misreads him; and finally a section called Bottom line, about 3 to 4 sentences, giving the direct prediction of what Hume would advise Valdoria to do.
