  ### Decision Tree: Moral Assessment of the Atomic Bombings  
  **Starting Commitment:** The atomic bombings of Hiroshima and Nagasaki were morally wrong.  

  #### Question 1: **Is the distinction between combatants and noncombatants coherent in modern "total war"?**  
  - **No** → **Leaf A: Noncombatant Immunity Incoherent**  
    - *Position:* Total war erases meaningful distinctions; civilians contribute to war efforts, so targeting them isn’t inherently wrong.  
    - *Diagnosis:* Rejects the starting commitment (bombing not wrong). Unattractive to those valuing civilian protection.  
  - **Yes** → Proceed to Question 2.  

  #### Question 2: **Were the civilian deaths intended, or merely foreseen?**  
  *(Clarifier: If planners sought city destruction **only as a means** to force surrender, deaths are intended.)*  
  - **Intended** → Proceed to Question 3.  
  - **Foreseen but unintended** → Proceed to Question 4.  

  #### Question 3 (Intended Deaths): **Is the prohibition on killing innocents exceptionless?**  
  - **Yes** → **Leaf B: Anscombe’s Absolutism**  
    - *Position:* Intentionally killing innocents is intrinsically evil; no consequences justify it. Bombing wrong.  
  - **No** → **Leaf C: Supreme-Emergency Exception**  
    - *Position:* Prohibition defeasible in existential threats (e.g., Nazi victory). Bombing wrong *here* because Japan’s defeat was not truly existential.  
    - *Unoccupied:* "Permitted in supreme emergency" — coherent but rejected by starting commitment.  

  #### Question 4 (Foreseen Deaths): **Does expected good bear on the act’s permissibility, or only on blame?**  
  - **Bears on permissibility** → **Leaf D: Double-Effect Casuistry**  
    - *Position:* Acts with foreseen harm are permissible if harm isn’t intended and good outweighs bad. Bombing wrong due to *disproportion* (harm > military necessity).  
  - **Bears only on blame** → Proceed to Question 5.  

  #### Question 5 (Foreseen Deaths + Good Only Affects Blame): **Why is the act always wrong?**  
  *(Grounding of prohibition)*  
  - **Act itself** → **Leaf E: Deontological Absolutism**  
    - *Position:* Killing innocents violates a categorical duty, regardless of intent or consequences.  
  - **Virtue or character** → **Leaf F: Virtue Ethics**  
    - *Position:* Deliberately risking civilians displays callousness, corrupting moral character.  
  - **Divine law** → **Leaf G: Theological Prohibition**  
    - *Position:* Forbidden by divine command (e.g., "thou shalt not kill").  
  - **Costs of exceptions** → **Leaf H: Rule-Consequentialism**  
    - *Position:* Allowing exceptions erodes norms, causing worse outcomes long-term.  

  #### Additional Leaves:  
  - **Leaf I: Consequentialist Defense**  
    - *Position:* Bombing *permissible* (net lives saved). Contradicts starting commitment; located if Question 4 answered "bears on permissibility" *and* proportionality met.  
  - **Leaf J: Excusable Wrong**  
    - *Position:* Act wrong (e.g., violates noncombatant immunity) but agents *excused* due to duress or epistemic limits. Combines with Leaf E/F/G/H.  

  ---

  ### Unoccupied Combinations & Diagnoses  
  - **Intended + Rule-Consequentialism (Leaf H):**  
    - *Diagnosis:* Incoherent. If deaths are intended, rule-consequentialism wouldn’t override the core prohibition (unlike foreseen deaths).  
  - **Foreseen + Supreme Emergency (Leaf C):**  
    - *Diagnosis:* Unattractive. Double effect already handles foreseen harm; adding "emergency" is redundant.  
  - **Exceptionless + Excusable (Leaf B + J):**  
    - *Diagnosis:* Incoherent. If prohibition is exceptionless, no "excuse" negates wrongdoing; blame remains.  

  ---

  ### Flagged Leaves: Agreement on Truman, Disagreement Elsewhere  
  - **Leaf B (Anscombe) and Leaf E (Deontological Absolutism)** agree the bombing was wrong but diverge on a hypothetical:  
    - *Case:* Intentionally kill 1 innocent to save 1 million.  
    - **Leaf B:** Still wrong (intention corrupts act).  
    - **Leaf E:** Still wrong (act intrinsically evil).  
    - *Tree cannot separate these* — both ground wrongness in the act itself, not consequences.  
  - **Leaf D (Double Effect) and Leaf B/E diverge:**  
    - *Same hypothetical:* Double Effect might permit it (foreseen harm proportional to good).  

  ---

  ### Tree Summary  
  ```  
  1. Noncombatant coherent? → No: A  
                               Yes: → 2. Deaths intended? → Yes: → 3. Exceptionless? → Yes: B | No: C  
                                         No: → 4. Good affects permissibility? → Yes: D | No: → 5. Grounding? → Act: E | Virtue: F | Divine: G | Rule-costs: H  
  ```  
  *Consequentialist defense (I) and excusable wrong (J) are variants of D and E/F/G/H respectively.*
