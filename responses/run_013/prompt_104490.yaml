  Structure thoughts: Open with a toast to disarm, then contrast Maya’s impact (admiration) with her "unfun" saintliness (cue laugh). Acknowledge her radical choice as love-driven, not obligation. Punchline: "I’d envy her more if she’d stolen my parking spot" lands Wolf’s point without jargon. End celebrating her courage—tying "wanting to be her" to her joyous resolve. 

