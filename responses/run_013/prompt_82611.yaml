  Also important: distinguishing the three layers they mentioned (utilitarian ethics, CBA procedure, corporate structure). Many critics conflate these, but the novel's power lies in the engineer realizing this conflation is what paralyzes him. His entire career operated on "cost accounting logic" - now he sees its moral price tag.

  The probabilistic aspect is tricky. Does spreading risk defeat the separateness objection? I think not - it just relocates it to consent issues and knowledge disparities. The engineer's moment of crisis comes when he understands that even small, distributed risks become concrete suffering for actual people. The math can't capture that.

  For alternatives to utilitarianism... contractualism feels strongest here because it centers justification to each affected person. But it too struggles with statistical victims. Prioritarianism fails because Pinto victims weren't necessarily worst-off initially. Kantianism's "means" argument works best for the revisionist account where concealment occurred.

  Most revealing insight: the separateness objection gains force when institutions we distrust perform the aggregation. The engineer trusted Ford's systems until he saw them monetize burn deaths. That institutional betrayal is what the chapter can explore viscerally.

