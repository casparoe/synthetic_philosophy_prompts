  The user clearly has deep engagement with medieval philosophy but presents themselves as an independent reader rather than a scholar. Their emotional response to Maimonides' sacrificial theology seems profound - they describe it as "devastating" and want the poem to capture that unsettling quality without resolution.

  Key requirements they've specified:
