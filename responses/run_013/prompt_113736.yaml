  ### Activity Design: "Competence Rule Challenge"

  **Policy Question:**  
  *Should our university replace the library's physical books with a digital-only system?*  
  (The dossier reveals hidden costs: long-term digital licensing exceeds physical upkeep, and accessibility gaps for students without reliable tech. Correct answer is **No**.)

  **Materials:**  
  1. **Dossier (2 pages):**  
     - *Page 1 (All students):*  
       - "Current physical books cost $200K/year to maintain."  
       - "Digital systems save space and attract tech-savvy students (per a *Student Life* survey)."  
       - *Omitted fact:* Survey sampled only 50 students in engineering.  
     - *Page 2 (Seeded to specific students):*  
       - "Licensing fees for digital books: $150K/year initially, rising to $500K/year by Year 5."  
       - "30% of students lack reliable home internet (per IT office data)."  
     - **Key Evidence:**  
       - *Physical:* $200K/year flat.  
       - *Digital:* Year 1=$150K, Year 5=$500K (true cost).  

  2. **Ballots:** Standard slips for unweighted vote.  
  3. **Quiz Sheets:** Blank paper for quiz design; pre-printed forms for second vote.  

  **Roles & Seeding (18 Students):**  
  - **Group A (10 students):** Only receive *Page 1* of the dossier.  
    - *Primed to vote "Yes"* (digital saves money, modernizes).  
  - **Group B (8 students):** Receive *full dossier* (Pages 1+2).  
    - *Primed to vote "No"* (hidden costs, access gaps).  

  **Timing (90 Minutes Total):**  
  1. **Setup (5 mins):**  
     - Distribute dossiers (Group A: Page 1; Group B: full).  
     - *Instructor prompt:* "Review your materials. Vote on the policy in 10 minutes."  

  2. **First Vote (15 mins):**  
     - Students read and discuss in ad-hoc groups (5 mins).  
     - Secret ballot: "Yes" (digital) or "No" (physical).  
     - **Tally:** Group A (10 votes "Yes") + a few Group B defectors = **"Yes" wins 12-6**.  

  3. **Quiz Design by Winners (15 mins):**  
     - "Yes" voters (winners) design a 3-question quiz in 10 mins.  
       - *Expected focus:* Cost savings, student appeal (from Page 1).  
       - *Example quiz:*  
         Q1: Annual cost of physical books? ($200K)  
         Q2: % of students favoring digital in the survey? (80% — but unsourced)  
         Q3: Main benefit of digital? (Space savings)  
     - Instructor collects and distributes quiz.  

  4. **Competence-Weighted Vote (25 mins):**  
     - All take the quiz (5 mins).  
     - Grade together: 1 point per question (winners’ answers are "correct").  
     - **Weighted vote:**  
       - Students vote again, but each ballot counts as (score + 1).  
       - E.g., 2/3 correct = vote × 3.  
     - **Tally:**  
       - Group A (Page 1 only): Scores 1-2 (misremember survey or costs).  
       - Group B (full dossier): Scores 3 (know Page 1 facts + seeded details).  
       - *Weighted result flips:* "No" wins (e.g., 45-30 after weighting).  

  5. **Debrief (30 mins):**  
     - Reveal true answer ("No" — show Year 5 licensing costs).  
     - **Guided discussion (map to epistocracy objections):**  
       - "What made someone ‘competent’ here?" → *Competence ≠ correctness* (quiz tested winners’ priorities, not long-term costs).  
       - "Who decided what questions mattered?" → *Setters of the bar control the outcome* (winners ignored access gaps).  
       - "How did lower-scorers feel about having less weight?" → *Excluded interests* (off-campus students affected by digital divide).  
     - **Avoid naming objections:** Use student reactions to surface concepts.  
       - *Example:* "Did the quiz capture what was *actually* important? Why not?"  

  **Predictable Problems & Fixes:**  
  - **Problem:** Group B may not score perfectly (e.g., forget exact costs).  
    - *Fix:* Make Page 1 details memorable ($200K, 80% survey). Ensure Group B’s dossier highlights these with bold text.  
  - **Problem:** Winners design vague/unanswerable quiz.  
    - *Fix:* Provide examples (e.g., "Ask for specific numbers from dossier").  
  - **Problem:** Defectors skew first vote (e.g., Group B votes "Yes").  
    - *Fix:* Seed dossier to Group B: Add a note, "As a student rep, focus on accessibility concerns."  

  **What the Activity Cannot Reproduce:**  
  - **Expert-neutral competence metrics.** Real epistocracy assumes tests designed by impartial experts, not partisan winners. You must clarify this *after* the activity:  
    - *"Epistocrats argue for tests crafted by neutral bodies—unlike today’s quiz. Could that avoid today’s problems? Let’s discuss next week."*  

  **Outcome:**  
  Students experience epistocracy’s appeal (weighted vote "fixed" the error) and its perils (endogenous tests, silenced stakes). The debrief ties their frustration to theory without pre-labeling objections.
