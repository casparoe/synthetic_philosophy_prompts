answer: |-
  Here's a decision tree focused on core commitments, using your test cases to force choices. Branches end with the theory label *only after* its distinctive commitments are locked in. **Bold = Question**, *Italics = Case/Clarification*, CAPS = Theory.

  ---

  ### Start: True predications ("This is red," "This is a cat") reflect something real, not just our words.

  1. **When multiple things are (e.g.) red, is there a SINGLE, IDENTICAL "thing" (entity, aspect) present in each, making them red?**  
     - **YES** → Go to 2 (Realism)  
     - **NO** → Go to 5 (Nominalism/Anti-Realism)

  ---

  ### Realism Branch (Universals Exist)
  2. **Is this identical "thing" (universal) LOCATED WHOLLY in space and time wherever it’s instantiated?**  
     - **YES** → Go to 3 (Immanent)  
     - **NO** → Go to 4 (Transcendent)

  3. **Can this universal exist WITHOUT being instantiated by any particular thing?** *Consider a universe with only one red patch that is destroyed.*  
     - **YES** → **TRANSCENDENT REALISM** (e.g., Plato). *Awkward: Universals exist "above" space/time but explain things within it, risking causal irrelevance.*  
     - **NO** → **IMMANENT REALISM** (e.g., Aristotle). *Awkward: Explaining how the *exact same* universal is wholly in different places at once.*

  ---

  ### Nominalism/Anti-Realism Branch (No Universals)
  5. **Does the truthmaker for "This is red" involve ONLY PARTICULAR ENTITIES (e.g., this specific redness, these atoms)?**  
     - **YES** → Go to 6 (Tropes/Particulars)  
     - **NO** → Go to 8 (Resemblance/Classes/Predicates)

  6. **Can tropes (particular properties) exist independently of the particular object they’re in?** *Consider a red trope "detached" from any object.*  
     - **YES** → **FREE TROPE THEORY**. *Awkward: "Loose" properties floating around, needing a bundling principle.*  
     - **NO** → Go to 7 (Bound Tropes)

  7. **What makes two red tropes both "red"?** *Consider two red things that resemble ONLY in color but are otherwise different kinds of objects.*  
     - **Primitive Resemblance** → **TROPE THEORY + RESEMBLANCE**. *Awkward: Resemblance is fundamental & unexplained.*  
     - **Natural Classes** → **TROPE THEORY + NATURAL CLASSES**. *Awkward: What makes a class "natural" if not resemblance or universals?*  
     - *Cannot distinguish some trope/resemblance blends from Primitivist Resemblance Nominalism (see 9).*

  ---

  8. **What ultimately makes "This is red" true?**  
     - **Resemblance between particulars** → Go to 9 (Resemblance Nominalism)  
     - **Membership in a set/class** → Go to 10 (Class Nominalism)  
     - **Our applying the word "red"** → Go to 11 (Predicate/Conceptual)

  9. **Is resemblance between particulars a PRIMITIVE, IRREDUCIBLE FACT?** *Consider two things resembling ONLY in being red, but otherwise dissimilar.*  
     - **YES** → **PRIMITIVIST RESEMBLANCE NOMINALISM**. *Awkward: Resemblance just "brutely" holds, with no deeper basis.*  
     - **NO** (Resemblance needs a basis) → *Dead End*. Resemblance needing a basis (e.g., shared tropes) loops back to realism/tropes. *Incoherent here.*  

  10. **Is EVERY predicate we can formulate ("red-or-round") matched by a REAL SET?** *Consider the set of things that are red-or-round.*  
      - **YES** → **CLASS NOMINALISM (ABUNDANT)**. *Awkward: Arbitrary sets (e.g., {Napoleon, this pencil}) are "properties," making properties trivial.*  
      - **NO** → **CLASS NOMINALISM (SPARSE/NATURAL)**. *Awkward: What makes a set "natural" if not universals or resemblance?*  

  11. **Is truthmaking about LANGUAGE ("red") or MENTAL CONCEPTS (idea of red)?**  
      - **Language** → **PREDICATE NOMINALISM**. *Awkward: Truth depends on human linguistic practices, even for predicates like "quark."*  
      - **Mental Concepts** → **CONCEPTUALISM**. *Awkward: Truth depends on minds, making properties mind-dependent even if minds didn't exist.*  

  ---

  ### Special Cases Branch (All Paths)
  *(Asked after initial commitments, to refine/confront)*  
  12. **Must EVERY successful predicate ("red," "game") have a UNIQUE TRUTHMAKER ENTITY?** *Consider "game" – its extension seems conventional.*  
      - **YES** → *Commits you to abundant properties (see 10) or awkward conventional universals/tropes.*  
      - **NO** → Go to 13 (Ostrich/Deflationary)  

  13. **Are truthmakers for predications EXPLAINED BY FUNDAMENTAL FACTS ABOUT PARTICULARS (no added "property" entities)?** *Consider continuous color spectrum – no joints needed.*  
      - **YES, and properties aren't real** → **OSTRICH NOMINALISM**. *Awkward: Denies we need *any* account of "repeatability" beyond brute predication.*  
      - **YES, but "properties" are just ways of talking** → **DEFLATIONISM ABOUT PROPERTIES**. *Awkward: Hard to distinguish from Ostrich; both reject ontological commitment.*  
      - *Cannot reliably distinguish Ostrich from Deflationism on this tree.*  

  ---

  ### Key Distinctions & Dead Ends
  - **Unexplored/Ugly**:  
    - **Tropes + Uninstantiated Universals**: Tropes reject universals. *Incoherent.*  
    - **Resemblance needing a basis + No Universals/Tropes**: Resemblance must be primitive or grounded. *Dead End at 9.*  
    - **Immanent Realism + Uninstantiated Universals**: Immanence requires instantiation. *Incoherent (see 3).*  
    - **Sparse Class Nominalism without Naturalness**: What *is* "natural" without universals/resemblance? *Ugly/Unclear.*  
  - **Hard to Separate**:  
    - **Trope Resemblance vs. Primitivist Resemblance Nominalism** (Path 7 vs. 9): Both rely on primitive resemblance between particulars.  
    - **Ostrich vs. Deflationism** (Path 13): Both deny properties are entities; differ only in emphasis on truthmaking vs. language.  

  ### Tree Flow Summary
  Start → 1 → (2 → 3 → 4) OR (5 → (6 → 7) OR (8 → 9/10/11)) → 12 → 13  
  *(10 branches: 1,2,3,5,6,7,8,9,10,11,12,13)*  

  This forces engagement with fundamentality, instantiation, abundance/naturalness, mind-dependence, and truthmaking obligations using your cases, hiding labels until the commitments are clear.
