  ### Analysis of Tree
  **Indistinguishable Pairs (same position, different names)**:  
  - **A3-1 (Excuse by Duress) and C2-1**: Both describe duress as the excusing condition; no substantive difference.  
  - **A3-2 (Excuse by Ignorance) and C2-2**: Ditto for ignorance.  
  - **A3-3 (Excuse by Role) and C2-3**: Ditto for diminished responsibility.  
    *Diagnosis*: These are one position under two names, reflecting the overlap between permissions and accountability branches when excuses are invoked.  

  **Unoccupied Combinations (incoherent or unattractive)**:  
  1. **Branch A + Liability grounded in objective injustice (A2i-1)**: Claims unjust combatants are permitted to kill because just combatants are "objectively liable," but just combatants cannot be liable.  
     *Diagnosis*: Incoherent—violates core liability principles.  
  2. **Branch B + Ordinary self-defense (B1-1)**: Assumes ordinary self-defense justifies symmetrical liability, but self-defense requires an "unjust threat," which just combatants do not pose.  
     *Diagnosis*: Incoherent—fails to generalize to war.  
  3. **Branch C + No wrongdoing + Non-permissions ground**: Assumes accountability arises from "no wrongdoing" without invoking permissions, but this collapses into Branch A.  
     *Diagnosis*: Redundant—merges with permissions views.  
  4. **Branch A + Excuse + Liability-based permission**: Claims an act is both excused (wrongful) and permitted (not wrongful).  
     *Diagnosis*: Incoherent—contradictory premises.  

  **Views Captured as Requested**:  
  - **Symmetry from epistemic constraints**: **Epistemic Permissions (A2ii-1)**.  
  - **Symmetry as legal fiction**: **Legal Fiction Liability (B1ii-1)** and **Legal Fiction Convention (D1-1)**.  
  - **Symmetry as equal wrongdoing**: **Excuse by Duress/Ignorance/Role (A3-1/A3-2/A3-3)**—both sides commit wrongful acts but are excused.  

  **Tree Size and Cases**: 15 leaves (within target range). Cases used throughout (e.g., conscript, volunteer, atrocity, symmetric unjust) to force distinctions without padding.
