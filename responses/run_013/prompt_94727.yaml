  ### Decision Tree: Moral Equality of Combatants

  **Entry Point**:  
  **Question 0**: Do you agree that a soldier fighting for an unjust cause (e.g., a conscript who believes his war is just but is mistaken) is *not* a murderer merely because their war is unjust?  
  - **No (Rejects the modest claim)**:  
    - **Terminal Node T0**: **Absolutist Asymmetry** (e.g., McMahan's early view).  
      *Most awkward commitment*: Must regard all soldiers in an unjust war (including non-culpable conscripts) as murderers for merely participating, even if they use minimal force.  
  - **Yes (Accepts the modest claim)**: Proceed to **Question 1**.

  ---

  **Stage 1: Disambiguation of "Equality"**  
  **Question 1**: What do you mean by "moral equality of combatants"?  
  - **(a) Equal permissions**: Each combatant is permitted to kill enemy combatants.  
  - **(b) Equal liability**: Each combatant is a legitimate target for enemy combatants (regardless of whether killing them is permitted).  
  - **(c) Equal accountability**: Neither combatant is blameworthy for killing enemy combatants (even if one was wrong to kill).  
  - **(d) Equal standing**: Both combatants are answerable to the same rules of war, and neither is punished for actions those rules permit.  

  *Note at the fork*:  
  - Choices (a) and (d) may *appear* to disagree but often address different issues: (a) concerns moral justification for killing, while (d) concerns legal/conventional rules. Genuine disagreement arises only if one assumes the law must mirror morality.  
  - Proceed to the branch matching your choice.

  ---

  ### Branch A: Equal Permissions
  *Focus: Permissibility of killing enemy combatants.*  
  **Question A1**: When an unjust combatant kills a just combatant, is this act:  
  - **Permitted (not wrongful)**: Go to **Question A2**.  
  - **Merely excused (wrongful but not blameworthy)**: Go to **Question A3**.  

  **Question A2 (Permitted)**: What grounds this permission?  
  - **The enemy's liability to be killed** (i.e., the enemy forfeited their right not to be killed): Go to **Question A2i**.  
  - **Something independent of liability** (e.g., lesser evil, military necessity, stakes of war): Go to **Question A2ii**.  

  **Question A2i (Liability-based permission)**: Is liability grounded in:  
  - **The objective fact that the enemy is prosecuting an unjust war?**  
    - **Terminal Node A2i-1**: **Objective Liability View** (unnamed).  
      *Most awkward commitment*: Cannot explain why a just combatant (objectively not liable) is a legitimate target, violating symmetry.  
  - **The enemy's culpability for posing a threat?** (e.g., blameworthiness for participating in injustice).  
    - **Terminal Node A2i-2**: **Culpability Liability View** (revisionist, e.g., McMahan).  
      *Most awkward commitment*: A non-culpable conscript on the unjust side is *not* liable, so killing them is not permitted—yet they remain a legitimate target.  

  **Question A2ii (Permission independent of liability)**: Is the permission based on:  
  - **Epistemic constraints** (neither side can know their war is just)?  
    - **Terminal Node A2ii-1**: **Epistemic Permissions** (e.g., Shue).  
      *Most awkward commitment*: If one side *could* know their war is just, they would not be permitted to kill—collapsing symmetry.  
  - **Consequentialist reasons** (e.g., lesser evil, necessity)?  
    - **Terminal Node A2ii-2**: **Consequentialist Permissions** (e.g., utilitarians).  
      *Most awkward commitment*: Permits killing in unjust wars if it prevents worse outcomes (e.g., anarchy or more deaths).  

  **Question A3 (Excused)**: What excuses the unjust combatant?  
  - **Duress** (e.g., coercion by the state).  
    - **Terminal Node A3-1**: **Excuse by Duress**.  
      *Most awkward commitment*: May excuse a volunteer who fights willingly for an unjust cause if societal pressure exists, but not a conscript under no direct threat.  
  - **Invincible ignorance** (non-culpable belief in the war's justice).  
    - **Terminal Node A3-2**: **Excuse by Ignorance** (e.g., classical justification).  
      *Most awkward commitment*: Does not excuse a volunteer who knows their war is unjust (e.g., a Nazi volunteer in 1942).  
  - **Diminished responsibility** (reduced agency as a state instrument).  
    - **Terminal Node A3-3**: **Excuse by Role** (e.g., collectivist views).  
      *Most awkward commitment*: May excuse a soldier on the just side who commits an atrocity if ordered (e.g., My Lai).  

  ---

  ### Branch B: Equal Liability
  *Focus: Legitimacy as a target, regardless of permissibility.*  
  **Question B1**: Is combatant liability symmetrical due to:  
  - **Ordinary self-defense morality** (e.g., liability arises from posing a threat)?  
    - **Terminal Node B1-1**: **Self-Defense Liability** (unnamed).  
      *Most awkward commitment*: A just combatant poses no "unjust threat," so cannot be liable—contradicting symmetry.  
  - **Artifact of war conventions** (e.g., special rules for wartime)? Go to **Question B1ii**.  

  **Question B1ii (Conventional artifact)**: Why accept this convention?  
  - **Legal fiction maintained because both sides need it** (e.g., to limit warfare).  
    - **Terminal Node B1ii-1**: **Legal Fiction Liability** (e.g., Hobbesian realists).  
      *Most awkward commitment*: Treats non-culpable conscripts as legitimate targets due to utility, not desert.  
  - **Fair scheme of mutual restraint** (binds those who comply).  
    - **Terminal Node B1ii-2**: **Contractual Liability** (e.g., Rawls-influenced).  
      *Most awkward commitment*: May not bind an aggressor state violating rules (e.g., Syria in civil war), undermining symmetry.  

  ---

  ### Branch C: Equal Accountability
  *Focus: Blameworthiness for killing combatants.*  
  **Question C1**: Is the unjust combatant blameless because:  
  - **They did nothing wrong** (i.e., killing combatants is permissible)?  
    - **Terminal Node C1-1**: **Permissions-Based Accountability**.  
      *Most awkward commitment*: Equivalent to a "permissions" view (Branch A); awkwardness matches the chosen Branch A leaf.  
  - **They did something wrong but are not blameworthy**? Go to **Question C2**.  

  **Question C2 (Excuse)**: What defeats blame?  
  - **Duress**: Same as **Terminal Node A3-1** (Excuse by Duress).  
  - **Invincible ignorance**: Same as **Terminal Node A3-2** (Excuse by Ignorance).  
  - **Diminished responsibility**: Same as **Terminal Node A3-3** (Excuse by Role).  

  ---

  ### Branch D: Equal Standing
  *Focus: Rules and punishments under war conventions.*  
  **Question D1**: Is combatants' equal standing due to:  
  - **A legal fiction maintained because both sides need it**?  
    - **Terminal Node D1-1**: **Legal Fiction Convention** (e.g., positivist).  
      *Most awkward commitment*: Maintains symmetry even when one side knows their war is unjust (e.g., Hitler’s generals).  
  - **Convention justified by its effects** (e.g., reduces suffering)?  
    - **Terminal Node D1-2**: **Consequentialist Convention** (e.g., utilitarian).  
      *Most awkward commitment*: Abandons symmetry if consequences favor it (e.g., punishing unjust combatants in a one-sided war).  
  - **A fair scheme of mutual restraint** (binds compliers)?  
    - **Terminal Node D1-3**: **Contractual Convention** (e.g., reciprocal ethics).  
      *Most awkward commitment*: Withholds protection from combatants whose side violates rules (e.g., terrorists), creating asymmetry.  

  ---

  ### Summary of Terminal Nodes (Leaves)
  1. **T0**: Absolutist Asymmetry.  
  2. **A2i-1**: Objective Liability View (unnamed).  
  3. **A2i-2**: Culpability Liability View.  
  4. **A2ii-1**: Epistemic Permissions.  
  5. **A2ii-2**: Consequentialist Permissions.  
  6. **A3-1 / C2-1**: Excuse by Duress.  
  7. **A3-2 / C2-2**: Excuse by Ignorance.  
  8. **A3-3 / C2-3**: Excuse by Role.  
  9. **B1-1**: Self-Defense Liability (unnamed).  
  10. **B1ii-1**: Legal Fiction Liability.  
  11. **B1ii-2**: Contractual Liability.  
  12. **C1-1**: Permissions-Based Accountability.  
  13. **D1-1**: Legal Fiction Convention.  
  14. **D1-2**: Consequentialist Convention.  
  15. **D1-3**: Contractual Convention.  

  *Total leaves*: 15 (T0 + 14 substantive).  

