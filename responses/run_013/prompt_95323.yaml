answer: |-
  The most significant distinction is whether one accepts that consistency can be secured via relative proof to a "safer" system. This splits views into those seeking external validation and those relying on internal or pragmatic grounds.

  ### Decision Tree
  **Start:** You trust ZFC (or similar axioms) enough to use them day to day.

  1. **Can you prove ZFC's consistency relative to a system you consider more secure (e.g., PA, PRA, or intuitionistic arithmetic)?**  
     - **Yes** → Go to 2.  
     - **No** → Go to 3.  

  2. **Do you have independent grounds (beyond day-to-day trust) to believe that safer system is consistent?**  
     - **Yes** → **Finitistic Reductionism**: Accept ZFC's consistency via proof in a finitistically justified system (e.g., Gentzen’s ordinal analysis).  
     - **No** → **Relative Formalism**: Treat consistency as purely relative; math proceeds as symbolic manipulation without absolute truth.  

  3. **Do you believe ZFC is consistent?**  
     - **Yes** → Go to 4.  
     - **No** → Go to 5.  
     - **I withhold belief** → Go to 6.  

  4. **What primarily justifies this belief?**  
     - **Intuitive set-theoretic concepts** → **Platonism**: Consistency reflects truth in the abstract universe of sets.  
     - **Decades of failure to find a contradiction** → **Empiricism**: Evidence from use outweighs unproven consistency.  
     - **Derivability from stronger axioms** → **Large Cardinalism**: ZFC's consistency follows from large cardinals (which you accept as plausible).  

  5. **Would an inconsistency trivialize all math (not just ZFC)?**  
     - **Yes** → **Dystopian Inconsistency**: An inconsistency makes all statements provable, collapsing math.  
     - **No** → **Contained Inconsistency**: Only esoteric parts of ZFC are affected; core math remains intact.  

  6. **Should ZFC's unproven consistency change mathematical practice?**  
     - **Yes** → **Proof-Theoretic Caution**: Restrict to subsystems with proven consistency (e.g., RCA₀, ACA₀).  
     - **No** → **Pragmatic Indifference**: Ignore the risk; day-to-day trust suffices.  

  ### Leaves Summary (9 Positions)
  - **Finitistic Reductionism**: Relative proof + secure base.  
  - **Relative Formalism**: Relative proof without secure base.  
  - **Platonism**: Intuitive sets justify consistency.  
  - **Empiricism**: Use without contradiction justifies consistency.  
  - **Large Cardinalism**: Consistency via stronger axioms.  
  - **Dystopian Inconsistency**: Inconsistency collapses all math.  
  - **Contained Inconsistency**: Inconsistency is quarantined.  
  - **Proof-Theoretic Caution**: Mitigate risk via weaker systems.  
  - **Pragmatic Indifference**: Unproven consistency is ignorable.  

  ### Key Notes
  - **Contained Inconsistency stability**: Coherent but speculative. It assumes the contradiction is in unused axioms (e.g., large cardinals or niche set theory). However, if found, mathematicians would likely patch ZFC (e.g., remove/replace the axiom) or switch to fragments. It’s "wishful" if unsupported by evidence but stable if tied to specific constraints (e.g., "ZFC without power set").
  - **Indistinguishable positions**: None. Each leaf is separated by the tree.
  - **Gaps**: 
    - *"Q1=No, Q3=No, Q5=Yes" → Contained Inconsistency*: Covers the study group’s view.  
    - *Missing combination*: "Q1=No, Q3=No, Q5=No" (inconsistency unavoidable) → *Dystopian Inconsistency*.  
    - *Unoccupied view*: "Q1=Yes" but reject the safer system as inconsistent. This would loop back into *Relative Formalism* (if you don’t care) or *Dystopian Inconsistency* (if you do). Not incoherent, but rare—most who accept relative proofs don’t reject the base system.
