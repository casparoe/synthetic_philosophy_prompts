prompt: |-
  ok so I'm the student rep on my town's school board (I'm a senior, and yes I actually get a vote on this stuff, which I definately did not think through when I ran). Tuesday we vote on what to do about our board chair, and I have to write the opinion memo the rest of the board reads before we walk in. I need help.

  Here's the situation. Two years ago the bond to fix the high school roof and the middle school boiler lost by about forty votes. Before the revote, the chair — retired teacher, twenty years on the board, wrote my college rec, everybody's favorite person in town — told a packed auditorium that the state had warned the district the high school might lose accreditation if the roof wasn't fixed. There was no warning. She made it up. The revote passed by a bigger margin, the roof and the boiler got fixed, and my little brother's classroom stopped flooding. Then a parent filed a records request with the state, got told no such warning ever existed, and now a reporter is running the story Friday — two days after our vote. The chair isn't denying any of it. She says she'd do it again.

  Options on the table: censure her plus a public statement; refer it to the state ethics commission, which can void the bond vote, in which case the money is gone and we're back to buckets in the hallways; accept the resignation she's offered; or say nothing and hope Friday is survivable.

  Where I'm stuck isn't the lying. I know lying is bad. It's this. My friend on the board says if the lie was for a good enough reason and it worked, then it was the right call, and censuring her is punishing her for doing the right thing. I don't buy that but I can't say why. I think even when the call was right, something is still owed — the wrong doesn't get cancelled by the good outcome, it just gets carried by somebody. So I want the memo to say who carries it. And I'm suspicious of the resignation, because if she's the only one who pays while the rest of us keep the fixed roof and our clean consciences, aren't we just using her as a trash can? Also I'd be voting too, so I don't get to act like my hands are clean, and I'd like the memo to deal with that honestly instead of flattering me.

  What I want in it: a clear recommendation — which option, the exact motion to make Tuesday, what happens to her and when — plus the real reasoning, not a civics lecture. Give the strongest honest case for whatever option you're rejecting; I have to sit next to these people and I don't want to be the kid who beat up a strawman. And if you think my instinct is wrong — that sometimes the price of a justified lie has to be paid by whoever told it, and sometimes it's better to just let the whole thing go — say so plainly.

  One more thing I can't figure out. My dad says this is the old dirty hands thing from political theory, and he says the whole point is that the person with dirty hands has to pay a price, otherwise they're not carrying anything, they're just getting away with it. But our vice chair said something that keeps bugging me: if we make the price automatic, then nobody will ever tell the useful lie, and the roof leaks and the kids get sick, so a rule that always punishes the noble liar is a rule that guarantees the worst outcome. Is that right? And if it is, how do we have the price without making it irrational to pay it? I don't know if there's an answer, but I want the memo to try, and to admit it if there isn't one.

  Keep it to like a page and a half, we're all busy.
reasoning: |-
  Okay, the user is a high school senior serving as a student rep on the school board with voting power. They need to write an opinion memo before a crucial vote about the board chair who lied about a state accreditation warning to pass a bond for school repairs. The repairs fixed real problems (leaking roof, broken boiler), but the lie was exposed, and now the board must decide on consequences.  

  The user’s core struggle isn’t about condemning the lie—they agree lying is wrong—but about *how* to handle the aftermath ethically. They reject the "ends justify the means" argument but also worry that punishing the chair might be hypocritical since everyone benefited from the lie. They’re also wrestling with philosophical questions: Who bears the moral cost of a "noble lie"? Can you impose consequences without deterring future necessary actions?  

  Key points from their query:  
  - They want a clear recommendation (specific motion) with honest reasoning.  
  - They insist on steelmanning opposing views (especially the "good outcome justifies the lie" argument).  
  - They’re uncomfortable with the chair’s resignation feeling like "using her as a trash can."  
  - They reference "dirty hands" theory and the vice chair’s concern that automatic punishment deters "noble lies."  

  My approach:  
  1. **Recommendation**: Accept resignation + public acknowledgment. This removes the chair from power (consequence) but avoids voiding the bond (prevents harming students). It also forces the board to collectively own the moral debt.  
  2. **Steelman opposing views**:  
     - For "do nothing": Emphasize the real harm undone by the repairs (flooding, health risks) and the chair’s decades of service.  
     - For "ethics referral": Highlight that voiding the bond punishes students for adult actions—unjust.  
  3. **Address their philosophical tension**:  
     - Agree the lie created a moral debt that can’t be erased by good outcomes.  
     - Argue the debt is shared: The chair lied, but the community (via the board) accepted the outcome.  
     - Punishment (resignation) isn’t about retribution but restoring trust in the system.  
  4. **Answer the "deterrence" dilemma**:  
     - If lies are *never* punished, trust erodes.  
     - If punishment is automatic, people might avoid "noble lies"—but this lie wasn’t truly noble (no imminent danger, better options existed).  
     - Distinguish between *emergency* lies (e.g., imminent safety threat) and *strategic* lies (this case). The latter requires accountability.  

  User’s unspoken needs:  
  - They want moral clarity without self-righteousness.  
  - They seek validation that their discomfort with "easy outs" (resignation as trash can) is legitimate.  
  - They need to maintain relationships on the board—hence the emphasis on steelmanning.  
  - They’re shouldering adult responsibilities but still a student; the memo should empower without patronizing.  

  Final memo tone: Direct, humble, grounded in practical ethics (not theory), and focused on repair—not punishment.
answer: |-
  Here’s a concise, action-oriented memo draft for your board vote. It’s 1.5 pages max, avoids fluff, addresses the ethical tension head-on, and includes a specific motion. I recommend **Option 3 (Accept resignation + public acknowledgment)**. Reasoning below.

  ---

  **TO:** School Board Members  
  **FROM:** [Your Name], Student Representative  
  **DATE:** [Current Date]  
  **SUBJECT:** Recommendation on Board Chair Action | Vote: Tuesday, [Date]  

  ### RECOMMENDATION  
  **Motion:** Accept Chair [Name]’s resignation effective immediately, coupled with a public statement acknowledging:  
  - Her 20 years of service and contributions.  
  - The false statement about state accreditation was a violation of public trust.  
  - The board shares responsibility for oversight and commits to transparency.  
  **Why this option?**  
  - **Consequence:** Resignation holds her accountable for the lie without destroying the vital repairs.  
  - **Shared Burden:** The statement forces the board (including me) to own our role—we benefited and failed to verify her claim.  
  - **Pragmatism:** Prevents bond revocation (avoiding student harm) while showing integrity.  
  - **Clarity:** Ends her leadership but respects her legacy. No drawn-out ethics fight or silent complicity.  

  ### THE CORE PROBLEM: WHO CARRIES THE DEBT?  
  The lie secured a public good (fixed roof/boiler), but it created a moral debt. Good outcomes don’t erase bad actions—they create an obligation to repair the harm done to trust. If only the liar "pays," we treat her as a scapegoat while keeping clean hands. If no one pays, we normalize lies. This motion splits the debt: **She steps down (personal accountability); we publicly own the failure (collective accountability).**  

  ### STEELMANNING THE OTHER OPTIONS (AND WHY I REJECT THEM)  
  **Option 1: Censure + Public Statement (Weak)**  
  *Strongest Case:* Public rebuke preserves the bond, acknowledges wrongdoing, and avoids scapegoating. It signals that lies are unacceptable, even when well-intentioned.  
  *Why Reject?* Censure is symbolic. After 20 years, she’ll retire soon anyway. It doesn’t restore trust—it feels like a wrist-slap for a grave breach. Worse, it lets the board avoid admitting we benefited.  

  **Option 2: Refer to Ethics Commission (Dangerous)**  
  *Strongest Case:* Upholds absolute integrity. Voiding the bond would prove no lie is "too good" to excuse. The ends *never* justify the means—or democracy erodes.  
  *Why Reject?* Voiding the bond punishes students for adult actions. My brother’s classroom floods again. This isn’t justice; it’s self-sabotage. The lie wasn’t for personal gain—it served the community. Punishing kids to punish her is immoral.  

  **Option 4: Do Nothing (Cowardly)**  
  *Strongest Case:* The repairs saved taxpayer costs, prevented health hazards, and fixed real problems. The chair acted out of duty, not malice. A scandal might embolden anti-funding activists, risking future bonds.  
  *Why Reject?* Silence = complicity. The reporter’s story drops Friday. If we ignore this, we tell the public lies are fine if they "work." Trust collapses. And yes—I’d feel like a hypocrite.  

  ### ADDRESSING THE "DIRTY HANDS" DILEMMA  
  **Your Dad’s Point:** Yes, the liar must pay a price—or the "debt" isn’t carried. Resignation is that price.  
  **Vice Chair’s Point:** Automatic punishment *could* deter noble lies—but this wasn’t one. The lie was strategic, not emergency (e.g., no imminent roof collapse). Better options existed: sharing photos of flooded classrooms, student testimonials, or a transparent revote campaign. We don’t want a world where officials lie instead of persuading.  
  **The Balance:**  
  - If we *never* punish, lies become routine—and the public stops trusting us.  
  - If we *always* punish (e.g., void the bond), we prioritize purity over kids’ safety.  
  **Solution:** Context matters. Here, *accepting her resignation* is proportional. She pays individually; we avoid collective harm. It signals: "Lies have consequences, but we won’t compound one wrong with another."  

  ### WHY I VOTE "YES" WITH DIRTY HANDS  
  I’m voting to keep the roof my brother uses. That means I’m complicit. But forcing her out alone isn’t enough—that’s why the public statement must include *our* failure. We didn’t verify her claim. We reaped the benefits. We share the debt. This isn’t about flattering ourselves; it’s about repairing trust so next time, we win bonds without lies.  

  **Motion to propose:**  
  *"I move to accept Chair [Name]’s resignation effective [Date], and direct the Superintendent to draft a public statement for board approval that: (1) thanks her for 20 years of service; (2) acknowledges the false accreditation claim violated public trust; and (3) commits the board to verifying future claims and publishing bond communications."*  

  ---  
  **Final note:** This is messy. There’s no perfect answer—just the least bad one. I’m open to edits, but I’ll vote for this because it refuses to sacrifice ethics *or* students. Let’s do better next time.
