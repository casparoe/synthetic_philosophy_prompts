  my friend who's doing a phd in philosophy of language keeps telling me that vagueness is basically a blurry photograph. his line goes: a blurry photo of a mountain is a perfectly good photo of a real mountain — the mountain isnt fuzzy, the lens is. so when it's unclear whether some guy with 4,327 hairs on his head is bald, the unclarity is in our words (or in our heads), not in the world. there's a fact of the matter about how many hairs baldness needs, we just can't see it. and that makes the sorites paradox a non-problem: we're squinting at a blurry picture and demanding a sharp edge.

  i half buy it, but i feel like the picture is doing more work than he admits. can you do an audit of the analogy for me? i want the correspondence laid out — what plays the role of the mountain, the lens, the blur, the print, the person doing the looking — and then where the mapping actually breaks. and i care about which breaks are load-bearing for what he wants (a hidden sharp fact, plus sorites being a non-problem) versus which are just incidental. some things that nag me:

  - is there a sharp original for him to be blurring in the first place, or is that the very thing in dispute?
  - blur comes from a physical process you could in principle fix with a better lens. is there an equivalent better lens for 'bald'? if not, is the analogy quietly importing something?
  - he once said the blurry photo is still definitely a photo of a mountain even if you can't say which ridge you're looking at. is that the same point as his main one, or a different one, and does it hold up?
  - 'blurry' is itself a vague word. does the picture survive that, or does the whole thing fall into a regress?

  then tell me straight: can this analogy carry his conclusion, or was the analogy doing the arguing the whole time? and if it can't, whats a better analogy for whatever he's actually onto.
