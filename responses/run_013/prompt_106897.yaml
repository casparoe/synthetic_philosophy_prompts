prompt: |-
  ok so in my ethics class we did Kant's test where you take the rule behind what your doing, imagine everyone in the world following that same rule, and see if it breaks somehow. my teacher said theres actually two different ways it can break and that this is where it gets messy, but she ran out of time and just told us to look up the contradiction in conception vs the contradiction in will. i looked it up and im more confused now, because both explanations use the lying promise thing and i cant tell what the second one is even adding.

  can you explain the difference properly? like what exactly is contradictory in each case, and why the first kind isnt enough to cover everything. and heres the part i actually care about: i tried to make my own example and it seems to break the whole thing. my rule is "whenever someone texts me asking for a favor, ill say yes and then never actually do it." universalized, nobody would ask anyone for favors anymore so the whole practice collapses, which seems like the conception kind. but then i tried "i will never do favors for anyone" and nothing collapses, favors still exist, im just a jerk. so is that supposed to be the will kind? because the difference between "the practice would collapse" and "i couldnt consistently want this" feels like the second one is just smuggling in "and also being a jerk is bad."

  also how do you even know what counts as my rule? if i describe it super narrowly (ill lie to my mom about homework on this one tuesday) it seems like almost nothing can ever break, and if i describe it super broadly (ill do whatever benefits me) everything breaks. that cant be how its supposed to work. explain how kantians are supposed to deal with that, and be honest about whether it actually works or if the test is basically rigged by how you write the rule.
