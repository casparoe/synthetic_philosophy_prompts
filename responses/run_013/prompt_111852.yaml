prompt: |-
  Quick one about something I keep running into and can't put a name to. There's a move where someone says a bit of information would be bad to have, and when you push on it, the badness never comes from the info being false or pricey -- it comes from the fact that just possessing it would change what they do, and the new behaviour is worse. Two cases I've actually seen: a team lead who doesn't want an early read on which of her projects will flop, because the second she has it she'll quietly starve those projects and finish them off herself; and a student who won't look at a predicted grade because he'll either coast or panic. None of the usual suspects quite fits. It's not the ostrich effect, that's about feelings. It's not rational ignorance, since the info is free and the question is wether he wants it at all. And it's not the normal self-fulfilling prophecy, because there's no crowd and no public prediction -- the loop runs entirely through one person's reaction to private information. So: is there an established name for this narrower thing, and how does it differ from those neighbours? I also half-remember a result that free information can never make a rational agent worse off in expectation, something to do with always being able to ignore it -- so I'd like to know which assumption that leans on that these cases seem to break, or whether they break it at all and the real story is something else entirely (a commitment problem, maybe). If there's no name, coin one and define it, with the boundary cases: what has to hold for this to be a genuine information problem rather than just weakness of will. Please write it in British English.
reasoning: |-
  Okay, the user is describing a specific psychological or decision-making phenomenon where someone avoids information because knowing it would lead them to act in a way that worsens outcomes, even if the information itself is free and accurate. They've ruled out several existing concepts like the ostrich effect (emotional avoidance), rational ignorance (costly information), and self-fulfilling prophecies (public/social element). 

  Hmm, interesting cases - the team lead who'd prematurely kill projects and the student who'd either slack or panic. The core tension is between instrumental rationality (acting effectively with information) and self-management (the inability to trust one's future actions). 

  Ah! The key theoretical conflict is with Blackwell's theorem - the idea that free information can't harm a rational agent. But here, the agents know they'll act suboptimally upon receiving the information due to predictable biases. That's the crack in the assumption: it requires agents who can optimally process information, but these examples feature what we might call "strategic irrationality" - knowing you'll overreact. 

  For naming... "Instrumental ignorance" feels right - avoiding knowledge as a tool to constrain future choices. Should distinguish from mere weakness of will by the presence of a clear causal chain: information → inevitable behavioral change → worse outcomes. The student case borders on weakness of will though - if he could discipline himself post-knowledge, avoidance wouldn't be needed. 

  Boundary cases to consider: 
  - If the harm came from emotional distress alone (e.g. avoiding medical results due to anxiety), that's pure ostrich effect 
  - If the information required costly effort to obtain, it becomes rational ignorance 
  - If others' expectations drove the outcome (e.g. bank run prophecies), that's standard self-fulfilling prophecy 

  User seems analytically sharp - they've already mapped adjacent concepts. Probably an academic or systems thinker. Might appreciate the Blackwell's theorem contradiction as it shows why this isn't just "irrationality" but a rational response to predictable irrationality. Should emphasize the commitment problem angle too - it's essentially a self-paternalistic move.
answer: |-
  Right, this is a fascinating and specific phenomenon that sits at the intersection of decision theory, information economics, and self-management. You're correct that the usual suspects don't quite fit, and there's a good reason for that.

  **The Established Name (Closest Fit): Strategic Ignorance or Instrumental Ignorance**

  While not a single, universally agreed-upon term like "confirmation bias," the concept you describe is most commonly referred to as **Strategic Ignorance** or **Instrumental Ignorance**.

  *   **Definition:** The deliberate avoidance of freely available, potentially accurate information because *acting upon that information* in a predictable, but suboptimal, way would lead to a worse outcome than remaining ignorant and continuing the current course of action.
  *   **Core Mechanism:** The harm doesn't stem from the information *itself* (its cost, falsity, or emotional impact), but from the *agent's own anticipated, unavoidable, and detrimental behavioural response* to acquiring it. It's a failure of self-command or self-regulation *in the future state of knowing*.

  **How it Differs from the Neighbours:**

  1.  **Ostrich Effect:** Focuses on *emotional discomfort* or anxiety *caused by* the information itself. Your cases aren't about avoiding negative feelings *from knowing*, but avoiding the *actions* knowing will provoke. The lead might feel fine knowing a project will flop, but knows she'll act destructively anyway.
  2.  **Rational Ignorance:** Justifies avoiding information *because the cost of acquiring or processing it exceeds the expected benefit*. In your cases, the information is *free* and the cost isn't the issue; the problem is the *deleterious consequence of using it*.
  3.  **Self-Fulfilling Prophecy:** Requires a *public declaration* or *shared belief* that influences *others'* behaviour, causing the prediction to come true (e.g., a bank run). Your cases involve *private information* triggering a *purely internal* behavioural loop within one individual. It's a *self-sabotaging* or *self-reinforcing* prophecy, privately held.

  **The Blackwell Theorem Question & Why It Seems Broken:**

  You're recalling **Blackwell's Theorem** (or the **Blackwell Informativeness Theorem**). Simplified, it states that for a rational decision-maker with well-defined preferences and Bayesian updating abilities, *more information (or a more informative signal) can never make the decision-maker worse off in expectation*. They can always choose to *ignore* the new information and act as if they didn't have it, achieving at least the same expected payoff as before.

  **Which Assumptions Do Your Cases Break?**

  1.  **Commitment Problem (Time Inconsistency):** This is the *core* break. The agent recognises that *in their future state of knowing the information*, they will be unable (or unwilling) to commit to the *optimal strategy conditional on ignorance*. Their preferences or perceived best action *change* based on the information state.
      *   *The Lead:* Knowing a project is doomed, her "optimal" action *conditioned on knowing* becomes starving it. But the *globally optimal* action *conditioned on ignorance* is giving all projects a fair shot. She cannot commit to ignoring the readout once she has it.
      *   *The Student:* Knowing a high grade, his preference shifts towards coasting; knowing a low grade, it shifts towards panic. He cannot commit to maintaining the same study effort regardless of the prediction.
  2.  **Imperfect Rationality / Self-Control:** Blackwell assumes perfect rationality and self-control. Your agents exhibit a predictable *bias* or *lack of self-discipline* in how they will react to the information. They know they will *overreact* (starve/coast/panic) in a way that harms their overall goal. They are *not* able to simply ignore the information and carry on optimally.
  3.  **State-Dependent Preferences/Actions:** The "best" action depends critically on the *information state itself*, not just the underlying state of the world. The agent's reaction function to the information is inherently suboptimal for their overall objective.

  **Is it *Just* Weakness of Will? Defining the Boundary:**

  Strategic ignorance is distinct from simple weakness of will, though they can overlap. Here's the boundary for a genuine information problem:

  *   **Genuine Strategic Ignorance Requires:**
      1.  **Free, Accurate Info:** The information is readily available and reliable.
      2.  **Predictable Detrimental Reaction:** The agent can reliably forecast that knowing the info will *inevitably* trigger a specific behavioural change.
      3.  **Causal Link to Worse Outcome:** This behavioural change *directly causes* a worse outcome *compared to persistent ignorance*.
      4.  **Lack of Feasible Pre-Commitment:** The agent lacks a credible way to *bind their future self* to ignore the information or act optimally despite knowing it (e.g., no external enforcement mechanism, no internal commitment device they trust).
      5.  **Instrumental Motive:** Avoidance is a calculated decision to prevent the harmful behavioural cascade, *not* primarily to avoid discomfort or effort.

  *   **Weakness of Will/Simple Procrastination:** If the agent *could*, in principle, receive the information and then *choose* the optimal action (maintain effort, not starve the project) but fears they simply *won't have the discipline* to do so, then it leans closer to weakness of will. The key difference is whether the *only* barrier is internal discipline *after* knowing, or if the *mere act of knowing* fundamentally alters the decision landscape in a way that makes the optimal action unavailable or undesirable *from the future self's perspective*.

  **Your Cases Revisited:**

  *   **Team Lead:** Clear Strategic Ignorance. Knowing triggers an irreversible managerial action (starving) she believes is locally optimal post-knowledge but globally suboptimal. Pre-commitment (e.g., promising her team not to act on early reads) might be hard to enforce or trust.
  *   **Student:** Borders Strategic Ignorance/Weakness of Will. Knowing *might* trigger coasting (a shift in preference/effort) or panic (a detrimental overreaction). Whether it's strategic depends on if he views coasting/panic as an *inevitable consequence* of knowing he *cannot* control (Strategic Ignorance) or just a *temptation/lack of discipline* he fears succumbing to (Weakness of Will).

  **In Essence:**

  You've pinpointed **Strategic or Instrumental Ignorance**: the rational choice *not to know* because knowing would rationally (from the future self's limited perspective) compel a course of action that the current self knows is ultimately self-defeating. It breaks Blackwell's theorem by introducing a predictable failure of commitment or self-control upon receiving the information, making the option to "ignore it" psychologically or practically unavailable. It's a rational response to one's own anticipated irrationality.
