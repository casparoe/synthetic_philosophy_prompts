  First, I need to recall what illusionism is. It says phenomenal consciousness (qualia) isn't real; it's an introspective illusion. The brain represents itself as having experiences it doesn't actually have. The hard problem of consciousness is a non-issue because there's nothing to explain beyond cognitive processes.

