prompt: |-
  I chair the research ethics board at a university whose psychology department has submitted a protocol on voice-hearing, built on a method its authors call heterophenomenology: interviewers record what participants say about the voices, presences, and entities they encounter, treat the transcripts strictly as data about what the participants are disposed to say, and take no position on whether any of it is real. My clinical liaison objects that many participants will be in early psychosis or acute distress, and that a script forbidding the interviewer ever to tell a participant that what she encountered was not real amounts to abandoning a duty of care in the name of method; another member adds that the method is not neutral all the way down, since it treats the participant's belief that she is being visited as a real fact about her while suspending judgment on the visitor, so the protocol misdescribes itself when it advertises neutrality. The lab replies that a debriefing declaring the voices unreal would contaminate the data, impose a contested metaphysical claim on people whose frameworks we have no standing to override, and repeat the dismissiveness that voice-hearers report as the most harmful thing clinicians do to them. The board meets Thursday and must approve, approve with conditions, or reject. Draft the decision memo I will circulate: give a concrete recommendation, with specific conditions and a time frame if you attach any; engage the strongest argument on the losing side rather than dismissing it; and be explicit about which demands the board is and is not entitled to make of researchers whose method brackets the question of what is real. End with a final line beginning "Verdict:" followed by the recommendation in a few words.
reasoning: |-
  Okay, the user is chairing a research ethics board and needs to draft a decision memo for a psychology study on voice-hearing using heterophenomenology. The key points are: The method involves interviewing participants about their experiences without judging the reality of those experiences. The clinical liaison is concerned about not reassuring distressed participants that the voices aren't real, seeing it as a neglect of duty of care. Another board member argues the method isn't truly neutral since it treats the participant's belief as real but suspends judgment on the visitor. The researchers counter that debunking the voices would contaminate data, impose metaphysics, and repeat harmful clinician dismissiveness.

  The user needs a concrete recommendation with conditions if any, a timeframe, engagement with the strongest losing argument, clarification on what the board can demand regarding bracketing reality, and a verdict line. 

  First, the heart of the ethical tension: duty of care vs. methodological integrity. The clinical concern is valid—early psychosis participants might need intervention, not just observation. But the researchers' point about dismissiveness causing harm is also strong. The board can't demand researchers abandon their epistemological framework (neutrality about reality claims), but it can enforce clinical safeguards.

  The strongest losing argument is the duty of care one. Even if neutrality is methodologically sound, acutely distressed participants might misinterpret the interviewer's non-correction as endorsement of their delusions, worsening distress. The memo should acknowledge this risk seriously.

  For the recommendation: Conditional approval makes sense. Require robust clinical oversight (screening for acute risk, mandatory referral pathways), enhanced consent disclosure (explicitly stating the interviewer won't validate or challenge experiences), and post-interview debriefing with support resources—but still without declaring voices unreal. Also, add data monitoring for unexpected harms. Timeframe: 12 months for review, allowing protocol adjustment if issues arise.

  On neutrality: Clarify that the board can't compel researchers to adopt a realist stance—that's a methodological choice—but can insist on harm mitigation regardless of epistemology. The protocol's description of neutrality is acceptable as long as it doesn't claim value-neutrality in human interactions.

  Verdict should be clear: "Approve with Modifications" covers it. The conditions must be concrete: clinical liaison role, consent language, debriefing script, data monitoring plan. 

  The memo should validate the clinical concerns while upholding academic freedom, showing the board weighed both sides carefully. Ending with a firm but fair verdict ties it together.
answer: |-
  **MEMORANDUM**  
  **TO:** Research Ethics Board (REB) Members  
  **FROM:** Chair, Research Ethics Board  
  **DATE:** [Current Date]  
  **SUBJECT:** Decision on Protocol #PSY-2024-07: Heterophenomenological Study of Voice-Hearing Experiences  

  ---

  ### **Decision Summary**  
  After thorough deliberation of the protocol and the concerns raised, the REB conditionally **approves** the study, subject to specific modifications to ensure ethical rigor without compromising methodological integrity. The conditions address clinical safeguarding, transparency in consent, and post-participation support. The lab must implement these revisions before commencing data collection.  

  ### **Key Concerns Addressed**  
  1. **Clinical Duty of Care (Raised by Clinical Liaison)**  
     - **Strongest Argument:** The objection that withholding corrective statements (e.g., "the voices are not real") risks abandoning vulnerable participants (e.g., those in early psychosis) during acute distress is ethically significant. Non-intervention could exacerbate trauma or delay critical treatment.  
     - **REB Position:** While the duty of care is paramount, the board distinguishes between *clinical* and *research* contexts. Researchers are not clinicians; their primary duty is to minimize harm within the study’s framework, not to provide therapeutic intervention. However, protocols must include robust safeguards for escalating clinical crises.  

  2. **Methodological Neutrality (Raised by Board Member)**  
     - **Strongest Argument:** The observation that heterophenomenology implicitly "takes a position" by treating the *belief* in entities as real (a psychological fact) while suspending judgment on the *entities themselves* is analytically sound. This risks misrepresenting the method as "neutral all the way down."  
     - **REB Position:** The board acknowledges this epistemological tension but affirms that researchers are entitled to bracket ontological questions as a methodological choice. The REB’s mandate is to evaluate ethical compliance, not philosophical coherence—provided the protocol does not mislead participants about its stance.  

  ### **Conditions for Approval**  
  The lab must revise the protocol to include the following, with compliance required **within 21 days** of this decision:  
  1. **Enhanced Clinical Safeguards:**  
     - A licensed clinician (unaffiliated with data collection) will screen all participants prior to interviews using the *PSYCHOSIS-RISK SCREENING (PRS)* tool. Participants flagged for acute psychosis or suicidality will be excluded and referred to university health services immediately.  
     - Interviewers must complete crisis intervention training (e.g., Mental Health First Aid) and follow a strict script for disengaging from sessions if distress escalates, including immediate referral pathways.  

  2. **Explicit Consent and Debriefing Language:**  
     - **Consent Form:** Must state: *"This study will not confirm or deny the reality of your experiences. Our aim is to understand your perspective, not to evaluate whether what you experience is real. If you need support regarding your experiences, we will provide resources."*  
     - **Debriefing Script:** Must include: *"Your participation helps us understand diverse human experiences. If you have concerns about your well-being, here are confidential support options [list]. We will not share our views on the reality of your experiences."*  

  3. **Post-Interview Support Protocol:**  
     - All participants receive a follow-up call within 24 hours from the university’s counselling service to assess well-being and offer support, irrespective of observed distress.  

  4. **Clarification of Methodological Stance:**  
     - The protocol must amend the "neutrality" claim to clarify: *"This method records beliefs as psychological facts without taking a position on the ontological status of reported entities."*  

  ### **What the REB Can and Cannot Demand**  
  - **Permissible Demands:** The REB can require safeguards for participant welfare (e.g., clinical referrals, transparency) and accurate description of methods.  
  - **Impermissible Demands:** The REB cannot compel researchers to:  
    - Adopt a realist or non-realist position ontologically.  
    - Prioritize clinical intervention over data integrity when no immediate risk exists.  
    - Alter core methodology (e.g., debunking experiences) if risks are mitigated procedurally.  

  ### **Engagement with the Losing Side**  
  The clinical liaison’s concern that neutrality may inadvertently validate harmful delusions reflects a legitimate ethical tension, particularly for vulnerable populations. While the REB concludes that safeguards can reconcile this with methodological goals, the board acknowledges that *no protocol can eliminate all risk* when studying distress. The lab must document any adverse events (e.g., increased distress post-interview) and report them to the REB within 48 hours for ongoing review.  

  ### **Time Frame and Reporting**  
  - Approved protocol expires in **12 months**.  
  - The lab must submit interim safety data (de-identified) every 3 months, including:  
    - Number of participants referred for clinical support.  
    - Summary of adverse events and mitigation steps.  
  - Full REB re-review required at 12 months or after 15 interviews (whichever comes first).  

  ---  
  **Verdict:** Approve with Modifications (Conditional).
