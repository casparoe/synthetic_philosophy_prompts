  Okay, let me tackle this user's query. They're describing a recurring argument in evolutionary biology where both sides pick different units of selection—genes or groups—and each claims their level is the "real" one. The user notices that mathematically, both ledgers balance out, so the dispute isn't about numbers but about which unit is privileged. 

  First, I need to recall relevant concepts. Group selection vs. gene selection debates come to mind, but the user says that's not it—they're focused on the structural standoff. The term "levels of selection problem" fits here, but it's broad. The user wants something more specific about the circular privileging of units. 

  I remember Elliott Sober and David Sloan Wilson's work on multilevel selection. They argue that selection acts at multiple levels, but the user's scenario involves each side dismissing the other's level as mere accounting. That sounds like Dawkins' gene's-eye view versus Wynne-Edwards' group selection. 

  The key is the circularity: each side uses their chosen unit to prove their level is fundamental. The user mentions there's no independent justification for choosing one unit over another. That's the crux. The term "framing effect" from psychology comes to mind, but it's not specific to biology. 

  "Selection unit circularity" might work—it captures the loop where the unit defines the level and vice versa. But is there an established term? "Teleological accounting" references the purpose-driven accounting, but "teleological" might be misleading. 

  After checking, "arbitrariness of the accounting perspective" is a phrase used in philosophy of biology, but it's not a term. Coining a new term seems necessary. "Unit-privileging circularity" is precise but clunky. "Selection ledger paradox" is catchier, emphasizing the accounting metaphor and the unresolvable tension. 

  Testing this: "Selection ledger paradox" highlights the mathematical consistency (ledger) and the deadlock (paradox). It avoids reductionism pitfalls and focuses on the structural standoff. The user wants the edges clear—this term excludes substantive debates and centers on the circular privileging. 

  Finally, ensuring the answer format: \answer{Selection ledger paradox}. Yes, this should address the user's need for both naming and conceptual clarity.
answer: |-
  This pattern you describe is a profound and persistent issue in the philosophy of biology, centered on the **arbitrariness of the accounting perspective** when analyzing evolutionary costs and benefits. While established terms touch on aspects of it, none fully capture the **circular privileging of units and the deadlock arising from mathematically consistent but ontologically contested ledgers**.

  Here's the carving:

  1.  **The Core Pattern:**
      *   A trait appears costly at Level A (e.g., individual organism) but beneficial at Level B (e.g., group, gene lineage).
      *   Side 1 argues that by shifting the accounting unit *downward* (e.g., to genes, or intragenomic conflict), the apparent cost disappears or becomes self-interested *at that lower level*. They declare *this* lower level to be the "real" level of selection, dismissing the higher level as an epiphenomenon or mere accounting fiction.
      *   Side 2 argues that by shifting the accounting unit *upward* (e.g., to the group), the benefit becomes evident and necessary to explain the trait's persistence. They declare *this* higher level to be the "real" level of selection, dismissing the lower-level accounting as failing to capture the functional explanation.
      *   Crucially, **both accounting schemes are mathematically consistent internally**. Neither side makes a calculation *error* within their chosen framework.
      *   The **deadlock** arises because each side uses the *results* of their chosen accounting unit (the ledger balancing) to *justify* the ontological primacy of that very unit. "See, the genes benefit, therefore genes are the *real* selectors!" / "See, the group benefits, therefore the group is the *real* selector!" This is circular.
      *   **No independent justification** is provided for why *that specific unit* (gene, group) is the fundamental ontological entity upon which selection acts, beyond the fact that the ledger balances when using it. The accounting result is conflated with ontological proof.
      *   The argument is **not resolvable empirically within the pattern described** because the disagreement is fundamentally about ontology (what *really* acts/is acted upon) and explanatory primacy, not about the measurable costs and benefits themselves, which are acknowledged by both sides.

  2.  **What It Is Not & Why Existing Terms Fall Short:**
      *   **Levels of Selection Problem:** This is the *broad* domain encompassing debates about whether selection acts on genes, individuals, groups, species, etc. Your pattern is a specific *dynamic within* this debate – the circular argumentation and unit-privileging that leads to stalemate.
      *   **Group Selection vs. Gene Selection (or Individual Selection):** These name the substantive *positions* or *theories*. Your pattern describes the *structure of the argument* between proponents of these positions, specifically the ledger-shifting and circular justification.
      *   **Reductionism:** While reductionist strategies are employed (arguing the higher level dissolves into the lower), the pattern also includes arguments *against* reductionism (insisting the higher level is irreducible). Crucially, the *same circular privileging* can occur arguing *against* reduction (the group ledger balances, therefore the group is real/fundamental).
      *   **Gene's-Eye View/Perspective:** Dawkins' concept focuses on a specific *choice* of unit (the gene/replicator). Your pattern describes the *argumentative tactic* used to defend *any* chosen unit (gene, group, individual) against alternatives, claiming its fundamental status based on its ledger balancing.
      *   **Multilevel Selection Theory (MLS):** MLS explicitly *avoids* this pattern by acknowledging selection can act simultaneously at multiple levels, requiring partitioning of selection pressures. Your pattern describes the arguments MLS seeks to move beyond – the insistence that only *one* level is "real".
      *   **Explanatory Relativity/Descriptive Relativity:** This captures the idea that explanations can be level-relative. However, your pattern highlights the stronger, contested claim: proponents argue their chosen level/unit isn't just *a* valid description, but *the* ontologically fundamental one, and they "prove" this solely via their ledger's internal consistency.
      *   **Framing Effect:** While related, this is a broader psychological/cognitive bias. Your pattern is a specific philosophical/scientific argumentative structure endemic to evolutionary accounting.

  3.  **The Edges:**
      *   **Inside:** Disagreements where mathematically consistent accounting exists at multiple levels, and proponents of each level claim ontological/explanatory primacy for their level *based solely on the success of their accounting*, engaging in circular justification.
      *   **Outside:** Genuine empirical disagreements about *whether* a cost/benefit exists at a given level. Disagreements resolved by MLS partitioning. Disagreements where one level's accounting demonstrably *fails* mathematically or empirically to explain the trait's persistence. Arguments that provide *independent* justification (e.g., replicator criteria, emergent fitness) for privileging a unit/level, rather than relying solely on ledger-balancing.

  **The Established Term & Its Nuance:**

  The closest established phrase capturing the *core issue* is **"the arbitrariness of the accounting perspective"** (used by philosophers like Elliott Sober and referenced in discussions of the Price Equation). This explicitly highlights that which costs/benefits appear depends on where you draw the boundaries for your calculation, and no single perspective is uniquely "true" in an ontological sense. It directly addresses your ledger metaphor.

  **A Proposed New Term:**

  However, to specifically name the **argumentative pattern** – the circular deadlock arising from using ledger-balancing to justify unit-privileging – the phrase **"Selection Ledger Paradox"** is apt.

  *   **"Selection Ledger":** Directly invokes the accounting metaphor central to your description.
  *   **"Paradox":** Captures the seemingly contradictory yet internally consistent accounts and the irresolvable deadlock it creates when proponents demand a single "real" level based solely on their ledger.
  *   **Why it fits:** It names the specific structure: the mathematical consistency at multiple levels (the ledger balances) leading to an irresolvable conflict (the paradox) when those levels are presented as mutually exclusive ontological truths justified only by their own accounting.

  **Philosopher's First Reach:**

  A philosopher of biology would likely first reach for the **"levels of selection problem"** and the associated concepts of **"the gene's-eye view"** (Dawkins) vs. **"group selection"** (Wynne-Edwards, later rehabilitated by Wilson/Sober). They might discuss **reductionism** versus **emergence**. Crucially, they would invoke the **Price Equation** as the formal mathematical framework that reveals the **arbitrariness of the accounting perspective** – showing how the total evolutionary change can be partitioned *in different ways* (e.g., within-group vs. between-group selection) all summing correctly. This equation fundamentally demonstrates why the ledger-balancing trick works for multiple levels, making the privileging of any single level based solely on that balancing mathematically unjustified. The **"Selection Ledger Paradox"** emerges directly from the implications of the Price Equation combined with the insistence on a single "real" level of agency.

  \answer{Selection Ledger Paradox}
