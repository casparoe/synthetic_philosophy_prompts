prompt: |-
  I'm doing a unit in my phil of sci seminar on frequentism vs Bayesianism and I want to use the Bem precognition thing from 2011 as the running case: the paper with nine experiments, eight of them hitting p < .05, published in a top social psych journal, then Wagenmakers and co.'s Bayesian reanalysis saying the evidence was essentially nil, then the failed replications a year or two later. Take that whole arc and run it in both directions for me. Be precise about the mapping first: what did the frequentist machinery actually license here, and what should it have licensed once you account for multiple comparisons, optional stopping, and the fact that eight of nine "significant" results is itself a suspicious pattern? Then do the same for the Bayesian side: was the reanalysis a fair reading of the data or did it smuggle in a skeptical prior about psi, and does it matter which, given that the verdict comes out the same either way? I want the minimum-Bayes-factor bound in there (you know the one -- how much a p of .05 can possibly move a likelihood ratio), and I want you to say honestly where each framework is just silent, say about the incentive structure that produced the studies in the first place. Then the interesting bit: what do the failed replications actually do to the analysis? Does the episode vindicate the Bayesians, or does it show that both sides were answering "how strong is the evidence in this dataset" when the question that mattered was "will this come back the same way next time" -- and if the latter, whose framework, if either, was even addressed to that? End with a verdict on what the case shows about the frequentist/Bayesian dispute itself: a confirmation, an anomaly, or something neither side anticipated. Dont let it turn into a p-value-bashing exercise or a Bayesian victory lap.
reasoning: |-
  We are going to break this down step by step. The case is Bem's 2011 paper on precognition, which reported 9 experiments, 8 of which had p < .05. Then Wagenmakers et al. (2011) did a Bayesian reanalysis and found the evidence weak. Later, replications failed.

  I. Frequentist Analysis in Bem (2011) and its Criticisms

  A. What the frequentist machinery licensed:
     - Each experiment was analyzed with a standard null hypothesis significance test (NHST). The null hypothesis (H0) for each test was that there is no precognition effect. The alternative (H1) was that there is an effect (in the predicted direction).
     - For each experiment, if the p-value was below 0.05, the result was deemed "statistically significant", which in the Neyman-Pearson framework would lead to the rejection of H0 in favor of H1 for that experiment.
     - Bem reported 8 out of 9 significant results. This pattern was taken as strong evidence against the null hypothesis (i.e., in favor of precognition).

  B. What it should have licensed, accounting for issues:

     1. Multiple comparisons: 
        - With 9 experiments, we have 9 tests. Even if the null is true in every case, the probability of at least one false positive is 1 - (0.95)^9 ≈ 37%. But Bem had 8 positives. The chance of 8 or more false positives under the global null is astronomically small (if we assume independent tests: (9 choose 8)*(0.05)^8*(0.95) + (9 choose 9)*(0.05)^9 ≈ 9*0.000000390625 + 0.00000000195 ≈ 3.5e-6). However, this calculation assumes that the tests are independent and the null is true in every case. But note: if the effect is real, then we expect multiple hits.

     2. Optional stopping (also called "peeking" or "data-dependent sampling"):
        - Bem's experiments sometimes collected more data if the initial results were not significant. This inflates the type I error rate. Wagenmakers et al. (2011) argue that Bem used optional stopping. In a frequentist setting, if you stop when p<0.05, the actual type I error rate can be much higher than 5%. For instance, if you can peek after every 10 participants and stop when p<0.05 or when you run out of resources, the chance of a false positive can be as high as 20-30% or more.

     3. The pattern of 8 out of 9 significant results:
        - This pattern is suspicious because if the effect is real and constant, we expect all experiments to show an effect (unless underpowered). But if the effect is real, we might expect variability due to sampling error or moderators. However, the pattern of 8 out of 9 is also consistent with selective reporting (e.g., file drawer problem). In fact, if there were many more experiments run that were not reported, then the 8 out of 9 might be misleading.

     4. Power considerations:
        - The power of each experiment was not reported. If the experiments had low power, then 8 out of 9 significant results is very unlikely under the null but also unlikely under a real effect of typical size (unless the power was high). 

     So, the frequentist analysis in the paper did not account for these issues. Correcting for multiple comparisons (though not typically done across experiments in a single paper) would require a more stringent alpha. But the main issues are optional stopping and selective reporting, which invalidate the simple interpretation of the p-values.

  II. Bayesian Reanalysis by Wagenmakers et al. (2011)

     A. The reanalysis used a Bayesian t-test. They compared two models:
          M0: null hypothesis (effect size δ=0)
          M1: alternative hypothesis (effect size δ ≠ 0, with a prior distribution on δ)

     B. The prior for δ under M1 was a Cauchy distribution centered at 0 with scale parameter r. They used r=0.707 (as suggested by Rouder et al., 2009) as a default, which is a medium-wide prior.

     C. They computed the Bayes factor (BF) for each experiment. The BF is the ratio of the marginal likelihood of the data under M1 to that under M0. A BF>1 supports M1, and BF<1 supports M0.

     D. Results: For most experiments, the BF was between 0.1 and 1 (anecdotal evidence for the null) or between 1 and 3 (anecdotal evidence for the alternative). They also combined the experiments (using a Bayesian meta-analysis) and found a BF of about 1.4 in favor of the alternative, which is "anecdotal" at best and not worth a decisive conclusion.

     E. The critique: Was the prior too skeptical?
          - The Cauchy(0,0.707) prior is centered at zero and has heavy tails. It is a default prior that is meant to be objective. However, in the context of psi, one might argue that a more skeptical prior (with a smaller scale) would be appropriate because psi effects are considered implausible by many. Alternatively, one might use a prior that is centered away from zero if there is prior evidence (but there isn't). Wagenmakers used a default prior that is not informed by the field.

          - However, Wagenmakers et al. also reported a sensitivity analysis. They showed that even if they used a very optimistic prior (with a scale of 1.0, which is wider and allows larger effects), the evidence was still not strong. The overall BF for the combined data was only about 25.6 in favor of the alternative, which is considered "strong" but not overwhelming. But note: in the context of extraordinary claims, even a BF of 25 might be insufficient.

          - The minimum Bayes factor: The minimum Bayes factor is the smallest BF (i.e., the strongest evidence against the null) that can be obtained from the data. For a given p-value, the minimum Bayes factor is approximately exp(-0.5 * z^2) (for a one-sided test) or a bit different for two-sided. For p=0.05 (two-sided), z≈1.96, so the minimum BF is exp(-0.5*(1.96)^2) ≈ exp(-1.92) ≈ 0.15. That is, the data are at best 1/0.15≈6.7 times more likely under the alternative than under the null. But note: this is a bound and the actual BF depends on the prior. So a p=0.05 is at best weak evidence against the null.

     F. Does the prior matter? Yes, but in this case, even with a relatively wide prior (which is more favorable to the alternative) the evidence was not overwhelming. And when combined across experiments, the evidence was weak. Moreover, the Bayesian analysis accounts for optional stopping (the BF is not affected by the stopping rule) and multiple comparisons (because we are comparing models and can use a prior on model space). So the Bayesian analysis is robust to these issues.

     G. However, the Bayesian analysis does not account for selective reporting. If Bem ran more experiments and only reported the ones that were significant, then the entire set of reported data is biased. Neither frequentist nor Bayesian methods can fully correct for this without knowing the extent of the file drawer.

  III. The Failed Replications

     A. What do they do?
          - They provide new data. From a frequentist perspective, they test the same null hypothesis and fail to reject the null (i.e., p>0.05). From a Bayesian perspective, they update the prior to posterior based on the new data.

     B. How should we update?
          - The Bem experiments and the replications are two sets of data. We can combine them. But note: if the original experiments were biased (e.g., due to optional stopping, selective reporting, or other questionable research practices), then they are not representative.

     C. A fair way is to look at the replications alone. Many replications (e.g., by Ritchie, Wiseman, and French, 2012) found no evidence. A meta-analysis of the replications would likely show no effect.

     D. Combining with Bem: 
          - If we take the Bem data at face value and combine with the replications, the overall effect would be diluted. But if the Bem data were obtained with QRPs, then we might discount them.

          - From a Bayesian perspective, we can update our beliefs. Starting from a prior that is skeptical (say, with a low prior probability for psi), the Bem data might have shifted the posterior a little, but then the replications would shift it back. 

          - Alternatively, we can use a hierarchical model to account for heterogeneity. It is possible that the effect is not constant.

     E. The key question: What was the original analysis answering? Both the frequentist and Bayesian analyses of the Bem data were answering: "How strong is the evidence in this dataset for the effect?" But the question that matters is: "Is there a real effect that will replicate?" 

          - The frequentist p-value does not directly address the replicability. It tells us about the long-run frequency of such data under the null. 

          - The Bayes factor tells us the strength of the evidence in the data for the alternative versus the null. It does not directly predict future replication success, but if the effect is real and the same, then replication success is more likely.

          - However, both frameworks can be extended to address replication. For example, we can compute the probability of replication success given the current data. In a Bayesian framework, we can compute a predictive distribution for a new experiment. In a frequentist framework, we can use the observed effect size and its standard error to compute the power for a replication.

          - But note: the Bem experiments, if they were the product of QRPs, are not a reliable basis for predicting replication. So the issue is not the framework per se, but the integrity of the data.

  IV. Verdict on the Frequentist/Bayesian Dispute

     A. The episode does not entirely vindicate the Bayesians. The Bayesians (Wagenmakers) correctly pointed out that the evidence in the Bem data was weak. The replications then showed that the effect was not real. However, the Bayesians were using a default prior and their analysis was dependent on that prior. But the sensitivity analysis showed that even under an optimistic prior the evidence was not overwhelming.

     B. The frequentist approach, as applied by Bem, was flawed due to ignoring multiple testing, optional stopping, and potential selective reporting. But if these issues had been addressed properly (e.g., by preregistration, correcting for multiple tests, and not stopping early), the frequentist approach might have yielded a more accurate assessment.

     C. The deeper issue: Both frameworks are addressing the evidence in the data. But the Bem data were collected in a way that made them untrustworthy. The replication crisis has highlighted that the incentives in science (e.g., to publish novel, positive results) can lead to QRPs that distort the evidence. Neither framework is immune to this.

     D. The case shows that the Bayesian framework has an advantage in being able to account for optional stopping without correction (because the likelihood principle is adhered to) and in providing a direct measure of evidence (the Bayes factor) that can be updated cumulatively. However, the Bayesian analysis is sensitive to the choice of prior, and in controversial areas, the prior may be contentious.

     E. The frequentist framework, when used properly (with preregistration, no optional stopping, and corrections for multiple comparisons) can be reliable. But the Bem case highlights how easily it can be misused.

     F. The failed replications are a reality check. They show that the ultimate test of a scientific claim is replication. Both frameworks can incorporate new data, but the replication movement is not tied to either framework.

  Conclusion:

     The Bem case is an anomaly for the frequentist approach as it was applied (with QRPs) because it produced strong p-value evidence that did not replicate. But it is not an anomaly for the frequentist approach in principle, because if the QRPs were avoided, the results might have been different. The Bayesian reanalysis provided a more cautious evaluation of the evidence, which was consistent with the subsequent replications. 

     However, the case does not settle the frequentist/Bayesian debate. It shows that the Bayesian approach can be more robust to certain problems (like optional stopping) and that the Bayes factor provides a more conservative measure of evidence when the effect is extraordinary. But the Bayesian approach requires specifying a prior, which can be a point of contention.

     Ultimately, the case highlights that the statistical framework is only one part of the scientific process. The integrity of the research process (preregistration, transparency, replication) is critical regardless of the statistical paradigm.
answer: |-
  ### The Bem Precognition Case: Frequentism vs. Bayesianism  
  **Core Arc**: Bem (2011) reported nine experiments on precognition, with eight yielding *p* < .05. Wagenmakers et al. (2011) reanalyzed the data using Bayesian methods, finding weak evidence for the effect. Subsequent replications (e.g., Galak et al., 2012) largely failed. We dissect this through both frameworks, addressing their strengths, limitations, and what the replication failure implies.

  ---

  ### **Frequentist Analysis: What Was Licensed vs. What Should Have Been**  
  **What Bem Claimed**:  
  - Each experiment tested H₀ (no precognition) against H₁ (precognition exists).  
  - Eight *p*-values < .05 were interpreted as "significant" evidence against H₀, suggesting a real effect.  

  **What Frequentist Machinery *Actually Licensed***:  
  - **Per-experiment inference**: A *p*-value < .05 indicates that, *if H₀ were true*, the probability of observing an effect as extreme as the data is <5%.  
  - **Aggregate claim**: Eight successes in nine trials appears compelling under a naive binomial model (*p* = 0.05 under H₀, binomial test *p* ≈ 0).  

  **What Frequentism *Should Have Licensed* (Accounting for Biases)**:  
  1. **Multiple Comparisons**:  
     - With nine tests, the familywise error rate (FWER) is inflated. Under H₀, the probability of ≥1 false positive is 1 - (0.95)^9 ≈ 37%.  
     - **Correction needed**: Bonferroni or similar adjusts α to 0.05/9 ≈ 0.0056 per test. Only one of Bem’s experiments (*p* = 0.01) would survive.  
     - **Pattern of 8/9 "successes"**: Unlikely under H₀ alone, but also unlikely if H₁ were true (expect near-consistent effects). Suggests possible **p-hacking** or selective reporting.  

  2. **Optional Stopping**:  
     - Bem collected data in batches and stopped if results were "significant." This inflates Type I error. Simulations show optional stopping can increase false-positive rates to 20–60% (vs. nominal 5%).  
     - **Consequence**: *p*-values are invalid; they assume a fixed sample size.  

  3. **File Drawer Problem**:  
     - If nonsignificant experiments were omitted, the 8/9 rate is misleading. A single unpublished failure reduces the observed success rate to 80% (still high), but more failures would erode evidence.  

  **Frequentist Verdict on Bem**:  
  The raw *p*-values overstate evidence. Correcting for multiple testing and optional stopping weakens support for H₁. The 8/9 pattern is statistically suspicious but not formally addressed by standard frequentist tools—it requires meta-analytic or bias-detection methods (e.g., p-curve).

  ---

  ### **Bayesian Reanalysis: Fair or Skeptical?**  
  **Wagenmakers et al. (2011) Approach**:  
  - Used **Bayes factors (BF)** to compare H₀ (δ = 0) vs. H₁ (δ ≠ 0, with δ as effect size).  
  - Priors for H₁: Default Cauchy(0, 0.707) [moderately skeptical].  
  - **Results**: Most experiments had BF₀₁ > 1 (support for H₀), and the aggregate BF₀₁ ≈ 1 (inconclusive). BF for H₁ never exceeded 40.  

  **Was the Prior Fair?**  
  - **Default prior**: The Cauchy(0, 0.707) is standard for psychological effects but **skeptical for psi**, as it centers on 0 and discounts large effects.  
  - **Sensitivity analysis**:  
    - With an **optimistic prior** (Cauchy scale = 1), aggregate BF₁₀ ≈ 25–30 (moderate evidence for H₁).  
    - With a **skeptical prior** (scale = 0.5), BF₁₀ ≈ 0.1 (strong support for H₀).  
  - **Does prior choice matter?** Yes, but:  
    - Even the optimistic prior yields BF < 30, far below the >100 threshold often demanded for extraordinary claims (e.g., ESP).  
    - **Minimum Bayes factor**: The best-case LR for *p* = 0.05 is ≈1/6 to 1/10 (i.e., *p*-values overstate evidence; a *p* = 0.05 never yields "strong" evidence). Bem’s *p*-values were typically 0.01–0.04, so min-BF ≈ 1/10 to 1/25—weak on its own, and weaker when aggregated.  

  **Bayesian Verdict on Bem**:  
  The reanalysis was fair. Priors influenced results, but even optimistic priors showed modest evidence. The key insight: **Bayes factors penalize flexibility**—H₁’s spread (allowing large effects) reduces its likelihood versus a precise H₀. Optional stopping also doesn’t affect BF, giving Bayesianism an edge here.

  ---

  ### **What Each Framework Ignores**  
  - **Incentive Structures**: Both frameworks are silent on publication bias, p-hacking, or career pressures that produce "too-good" results. This is a **scientific practice issue**, not statistical.  
  - **Replicability**: Neither directly answers "Will this replicate?" Frequentism defines long-run error rates; Bayesians update beliefs. Both require replication data to address this.  

  ---

  ### **Failed Replications: What Do They Change?**  
  **Frequentist View**:  
  - Replications test H₀ anew. Most failed (e.g., Galak et al., 2012: 90% nonsignificant).  
  - **Aggregate meta-analysis**: Overall effect size near zero. Frequentists reject Bem’s original claims due to lack of reproducibility.  

  **Bayesian View**:  
  - Replications update the prior. Starting from Wagenmakers’ posterior (skeptical), new data strengthen H₀.  
  - If starting from scratch, replications yield BF₀₁ >> 100, decisively favoring H₀.  

  **Did the Frameworks Answer the Right Question?**  
  - Both addressed **"What does this dataset say?"** not **"Will this replicate?"**  
  - **Frequentism**: Replicability is inferred indirectly (e.g., via power calculations). Bem’s low power in some experiments hinted at fragility.  
  - **Bayesianism**: Predictive distributions *can* forecast replication success but were not emphasized.  
  - **The core issue**: Bem’s results were likely a **Type I error cascade** amplified by QRPs. Replications tested the underlying effect, which is the ultimate arbiter.  

  ---

  ### **Verdict: What the Case Shows About the Dispute**  
  - **Neither victory nor anomaly**: The case **confirms strengths/weaknesses of both frameworks**.  
    - **Frequentism’s vulnerability**: *p*-values are easily misused without strict protocols (stopping rules, multiplicity control).  
    - **Bayesianism’s value**: Robustness to stopping rules, explicit evidence quantification (BF), and prior sensitivity analysis.  
  - **Crucial nuance**:  
    - Bayesians correctly noted Bem’s evidence was weak—ahead of replications.  
    - Frequentists rightly demand replications for decisive conclusions.  
  - **The deeper lesson**:  
    - **Statistics alone can’t rescue flawed science**. Incentives for novelty and QRPs undermined both approaches.  
    - **Replication is the bedrock**: Both frameworks converge when new data arrive.  

  **Final Judgment**: The episode highlights Bayesianism’s utility in detecting overstated evidence (via BF and prior scrutiny) but affirms frequentism’s role in setting replication standards. It underscores that the dispute isn’t about "right vs. wrong" but **appropriate application**—and that extraordinary claims require both rigorous methods and reproducible results.
