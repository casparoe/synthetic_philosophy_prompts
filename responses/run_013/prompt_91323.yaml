  Since q < 1, 1/q > 1, so it also confirms H.

  But the key is the magnitude.

  For the raven observation, the likelihood ratio is 1 / P(B|R, ~H)

  P(B|R, ~H) is the probability that a raven is black given that not all ravens are black. If we assume that under ~H, ravens can be any color, P(B|R, ~H) might be high or low, but it's less than 1, say let's denote it as s, where 0 < s < 1, so likelihood ratio is 1/s > 1.

