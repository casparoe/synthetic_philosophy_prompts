answer: |-
  **Interdepartmental Memo: ACTUAL UNDERWRITING GUIDANCE - AEX-114**  
  **FROM:** Enterprise Risk Office (ERO), Acausal Exposure Division  
  **TO:** Underwriting Leads, Claims Management, Actuarial  
  **SUBJECT:** Acausal Exposure (AEX) Policy Framework & Binding Requirements  
  **DATE:** October 26, 2023  
  **CLASSIFICATION:** Sensitive Internal – Leak Controlled  

  ---

  **1. Overview**  
  Acausal Exposure (AEX) refers to threats arising from entities leveraging predictive models of the insured’s decision-making process to coerce action, absent direct causal interaction. AEX differs from conventional extortion in that the threatener relies entirely on *accurate anticipation* of the insured’s response. Standard threat-mitigation protocols (e.g., law enforcement escalation) are ineffective. The ERO now classifies AEX as a standard underwriting category (Exposure Code 77G).  

  **2. Premium Classes & Risk Scoring**  
  Premiums are tiered by the insured’s *predictability profile*:  

  *   **Class A-1 (Preferred):** Entities with robust, verifiable precommitment architectures (e.g., irreversible fiduciary locks, hardened open-source goals). Annual Premium: 0.15% of total exposure cap.  
  *   **Class A-2 (Standard):** Entities with documented decision hygiene (e.g., RAND-certified randomization protocols, auditable utility functions). Annual Premium: 0.35% of exposure cap.  
  *   **Class B (Substandard):** Entities with high behavioral predictability, opaque decision trees, or unresolved value drift. Annual Premium: 0.75–1.2% of exposure cap. *Requires mitigation riders.*  
  *   **Class C (High-Net-Worth Exclusion):** Entities with assets >$500M or systemic importance. Case-by-case binding only.  

  *Risk Scoring Note:* Predictive validity is assessed via ERO’s proprietary "counterfactual audit" (see *Form 11-K: AEX Predictability Matrix*).  

  **3. Standard Exclusions**  
  AEX policies **DO NOT COVER**:  
  *   Threats arising from causal communication channels (e.g., emails, physical demands).  
  *   "Self-fulfilling prophecy" losses where the insured’s *knowledge* of the threat model directly causes payment.  
  *   Non-credible threat models (verified by ERO Model Audit Group).  
  *   Acts violating OFAC/AML statutes.  

  **4. Why Payment is Strictly Dominated**  
  Paying an AEX demand is actuarially unsound:  
  *   **Signal of Vulnerability:** Payment confirms the threatener’s predictive accuracy, incentivizing recurrence.  
  *   **Precedent Risk:** Establishes the insured as a reliable payoff node within threat networks.  
  *   **Zero Mitigation:** Payment does not degrade the threatener’s model. Future demands remain probable.  
  Claims for AEX extortion payments will be denied per Section 4(b) of the policy. *Underwriting must emphasize this pre-bind.*  

  **5. Surrogate Goals as Precommitment Devices**  
  Insureds may bind "surrogate goals" to disrupt threat modeling:  
  *   **Example Rider:** "Irrevocably allocate 110% of any AEX demand to [Anti-Predictability Charity]."  
  *   **Mechanism:** Public, cryptographically verified commitment ensures threat models compute payment as net-loss-making.  
  *   **Underwriting Credit:** A-1 eligibility requires active surrogate governance. ERO maintains a pre-approved registry (Appendix D).  

  **6. Critical Binding Requirement**  
  **Policies bound AFTER an AEX threat manifests have $0 coverage.**  
  *   **Rationale:** Post-threat binding signals awareness of vulnerability, making the insured *more* predictable. Threat models instantly update to reflect the policy’s existence, nullifying its deterrent effect.  
  *   **Protocol:** All AEX coverage requires proactive binding during threat-free "predictability audits" (min. every 24 months). Backdated coverage is void.  

  ---

  **Claims Guidance:** Submit AEX incidents via Portal 77G within 72 hours. ERO will:  
  1. Verify threat acausality (no IP traces, correlative evidence only).  
  2. Audit the threat model’s predictive validity retroactively.  
  3. Deny claims if precommitment hygiene lapsed or binding occurred post-threat.  

  **Actuarial Note:** AEX reserves modeled as low-frequency, high-severity. Correlated exposure pools limited to 5% of book.  

  ---  
  **AUTH:** J. Vargas, SVP Risk Architecture  
  **REF:** ERO Manual §77G (v3.1), Acausal Threat White Paper (2022), "Surrogate Goals & Commitment Riders" (J. Risk Theory, Q3 2023)  

  ---

  **Key for Clarity:**  
  - **"Paying is Dominated"**: Insurance logic frames paying as a losing strategy, mirroring game theory.  
  - **"Policy After Threat Worthless"**: Parodies how acausal threats exploit decision-process knowledge.  
  - **"Surrogate Goals"**: A precommitment tool familiar in finance, repurposed for decision-theoretic defense.  
  - **Deadpan Tone**: Bureaucratic jargon ("predictability matrices," "net-loss-making") contrasts with the surreal premise.  
  - **Plausibility:** Mirrors real insurance exclusions (e.g., "prior acts coverage" restrictions).
