  For method (#3), a semester-long conceptual analysis makes more sense than formal modeling. Modeling would flatten the normative distinctions the user wants to probe. I'll outline a three-phase approach: dissecting the objection, testing it against time-slice cases, then evaluating constrained utilitarianism.

