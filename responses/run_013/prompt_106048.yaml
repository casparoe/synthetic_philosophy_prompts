  I've been reading alot of rationalist stuff on AI alignment and deliberation, and I keep bumping into the HCH idea—where you imagine a human who can decompose a problem into sub-problems and hand them off to copies of themselves, recursively, until the sub-problems are easy enough. People treat this as an idealization of what deliberation could be. I want you to argue that this idealization is actually misleading, and that a better idealization would be what I've been calling 'bounded HCH'—where the recursion depth is limited by a finite cognitive budget, and the decomposition itself costs resources. In particular, argue that unbounded HCH smuggles in an unrealistic assumption of perfect decomposability, and that for many real deliberation tasks (e.g., moral judgment, creative problem solving), the whole is not just the sum of well-chosen parts. Make the argument in a way that would be persuasive to someone who thinks HCH is a useful abstraction, and don't just hand-wave about 'holism'—give a concrete toy example where the decomposition fails. I'm not looking for citations, just a clear philosophical argument.
