answer: |-
  Here is the final exam question, model answer, and marking scheme designed to meet your specifications.

  ---

  **FINAL EXAM ESSAY QUESTION**

  **The Micropolis Legal Order has the following fundamental rules:**

  *   **Rule A:** This order may be changed only in the manner set out in Rule B.
  *   **Rule B:** A change is adopted when two-thirds of those voting approve it.
  *   **Rule C:** Rule A may be altered only by a unanimous vote, and Rule C itself may not be altered in any way.

  A member proposes the following amendment, labelled **P**: "Rule A is struck out and replaced by 'This order may be changed by simple majority'; and Rule C is repealed." Proposal **P** is put to a vote and receives approval from eighty per cent (80%) of those voting.

  **Answer the following questions, providing clear reasoning for each:**

  1.  **Procedural Validity:** According to the explicit terms of Rules A, B, and C, has Proposal **P** been *validly adopted* as part of the Micropolis Legal Order? Explain your answer step-by-step, considering both parts of **P** (the alteration of Rule A and the repeal of Rule C) and the specific voting requirements.
  2.  **Self-Referential Paradox:** Regardless of your answer to (1), does the attempt to adopt **P** reveal a fundamental difficulty inherent in the concept of a legal order containing its *own* rule(s) for changing *all* its rules, including the rules about change themselves? If so, precisely characterize this difficulty: is it a logical *contradiction*, an *infinite regress*, a *gap* in validation requiring an external 'ultimate rule', or something else? Justify your diagnosis using the specific elements of **P** and the Rules.
  3.  **Severability & Rule C's Role:** Could the two parts of **P** (altering Rule A and repealing Rule C) be considered separately for validity? Does Rule C's specific self-entrenchment ("Rule C itself may not be altered in any way") perform any essential function *beyond* what Rule A ("This order may be changed only in the manner set out in Rule B") already accomplishes in protecting the amendment framework? Explain why or why not.

  **Your essay should demonstrate a clear understanding of the logical structure of self-reference within a normative system and its implications for legal foundations.**

  ---

  **MODEL ANSWER (Approx. 650 words)**

  **(1) Procedural Validity:** Proposal **P** has **not** been validly adopted according to the explicit terms of Rules A, B, and C. While it received 80% approval, exceeding Rule B's two-thirds requirement for a generic "change," **P** is not a generic change. Rule C explicitly states: "Rule A may be altered only by a unanimous vote." **P**'s first limb directly alters Rule A (striking it out and replacing it). Therefore, the specific, stricter requirement of Rule C applies to *this specific part* of the proposal. The 80% vote, while substantial, falls short of unanimity. Consequently, the alteration of Rule A fails Rule C's requirement.

  The second limb of **P** seeks to repeal Rule C itself. However, Rule C also explicitly states: "Rule C itself may not be altered in any way." "Altered" must logically encompass repeal, as repeal is the most radical form of alteration (removing the rule entirely). Therefore, the repeal of Rule C is *expressly prohibited* by Rule C. It cannot be validly enacted by *any* vote, including the 80% vote or even a unanimous vote, because the rule forbids any alteration whatsoever. Rule B's two-thirds requirement for a "change" is irrelevant here; Rule C creates an absolute bar against its own alteration.

  Thus, both limbs of **P** fail the specific requirements governing alterations to Rules A and C. Rule B's general procedure is overridden by the specific entrenched provisions of Rule C for these specific rules. The 80% vote satisfies Rule B generally but fails the higher hurdles specifically erected by Rule C for **P**'s components.

  **(2) Self-Referential Paradox:** The attempt to adopt **P** starkly reveals the *logical contradiction* inherent in a system attempting comprehensive self-amendment, particularly when targeting its own foundational amendment rules. The contradiction arises from **P**'s attempt to use the *current* rules (A, B, C) to authorize a change that would *destroy the very basis* upon which that authorization supposedly rests.

  *   **Altering Rule A:** To validly change Rule A under the *current* rules requires unanimity (Rule C). **P** seeks to replace Rule A with a rule allowing change by simple majority. The contradiction lies in the fact that if **P** succeeds under the new, simple majority rule it aims to create, it necessarily *failed* under the old, unanimity rule that was actually in force and required for its own enactment concerning Rule A. The act of adoption using the new rule presupposes the new rule is already valid, but its validity depends on the old rule's procedure being followed correctly, which it wasn't (unanimity lacking). The system cannot consistently hold both the old rule and the new rule valid for the act of enacting **P** at the moment of enactment. This is a performative or self-referential contradiction.
  *   **Repealing Rule C:** The contradiction is even more direct. Rule C declares itself unalterable. **P** attempts to alter (repeal) it. If **P** is valid, then Rule C *was* alterable, meaning Rule C's statement about itself was false at the very moment **P** purported to rely on the system's rules (including Rule C's existence as a valid rule). If Rule C was unalterable (as it claimed), then **P** is invalid. The rule and the act attempting to negate it cannot both be valid simultaneously; accepting one invalidates the other. This is a classic liar paradox ("this sentence is false") embedded in the legal order.

  The difficulty is not primarily an infinite regress (though reasoning about the foundation might lead there) nor just a gap (though it creates one), but a *contradiction* within the system's normative statements about its own authority at the point of fundamental self-transformation. **P** attempts an act that the rules simultaneously purport to authorize (under a general reading of B) and forbid (under the specific reading of C required for A's alteration and C's own repeal).

  **(3) Severability & Rule C's Role:**

  *   **Severability:** The two limbs of **P** are **not practically severable** in this context for the purpose of validation. The repeal of Rule C is explicitly invalid under Rule C itself. Even if we hypothetically considered *only* the alteration of Rule A, it *still* fails because altering Rule A requires unanimity under Rule C, which wasn't achieved. Crucially, **Rule C is still in force** during the vote on **P**. Therefore, even if the repeal limb were ignored (or failed separately), the alteration of Rule A *still* triggers Rule C's unanimity requirement, which wasn't met. The invalidity of one limb doesn't salvage the other; both fail independently under Rule C's provisions which remain binding during the enactment attempt.
  *   **Rule C's Redundancy:** Rule C's self-entrenchment ("may not be altered in any way") performs **no essential function** *beyond* what Rule A already accomplishes. Rule A states: "This order may be changed *only* in the manner set out in Rule B." This inherently implies that Rule A itself, as part of "this order," can *only* be changed in the manner set out in Rule B. Rule C merely restates this implication specifically for Rule A (adding the unanimity detail) and adds the absolute self-entrenchment. However, Rule A's general entrenchment already logically entails that *any* change to *any* rule, including Rule A and Rule C, must follow Rule B. Rule C's self-entrenchment clause is therefore redundant *if* Rule A is understood as fully entrenching the entire amendment procedure (including itself). Rule C's main distinct function is specifying the *higher threshold* (unanimity) for altering Rule A, not the *fact* of entrenchment. The absolute self-entrenchment of C adds nothing logically necessary; Rule A's "only in the manner set out in Rule B" already establishes that Rule C cannot be changed *except* via Rule B. Rule C's self-entrenchment clause is an attempt at super-entrenchment, but it cannot escape the foundational paradox inherent in Rule A's own self-reference. The core difficulty stems from Rule A's attempt to govern its own amendment, making Rule C's specific self-prohibition superfluous to the underlying logical problem.

  ---

  **MARKING SCHEME (Out of 20)**

  *   **Procedural Validity (4 marks):**
      *   (1) Correct identification that altering Rule A requires unanimity under Rule C. (1 mark)
      *   (2) Recognition that 80% < 100%, so alteration of A fails. (1 mark)
      *   (3) Correct identification that Rule C absolutely prohibits its own alteration/repeal. (1 mark)
      *   (4) Conclusion that both parts of P fail, Rule B general procedure is overridden. (1 mark)
      *   *Penalize (up to -2):* Misreading voting thresholds; overlooking Rule C's specific requirements; arguing P is valid based solely on Rule B/80%.

  *   **Self-Referential Paradox (7 marks):**
      *   (1) Identifies a core difficulty (contradiction, paradox). (1 mark)
      *   (2) **Diagnoses the difficulty specifically as a *logical contradiction* (or performative/self-referential paradox).** (2 marks - *Essential for 1st Class*)
      *   (3) Clearly explains the contradiction for altering Rule A (using new rule vs. needing old rule). (2 marks)
      *   (4) Clearly explains the contradiction for repealing Rule C (rule claiming unalterability vs. act altering it). (1 mark)
      *   (5) Distinguishes this from mere infinite regress or gap (though may mention them as secondary). (1 mark)
      *   *Penalize (up to -3):* Vague references to "paradox" without specifying contradiction; confusing with infinite regress as primary diagnosis; failing to articulate *why* it's contradictory using the rules; suggesting a gap *without* linking it strongly to the contradiction.

  *   **Severability & Rule C's Role (6 marks):**
      *   (1) Correctly states limbs are **not** severable *for validation purposes* under the current rules. (1 mark)
      *   (2) Explains why: Rule C still applies, so altering A *independently* still requires unanimity (not achieved). (2 marks - *Essential for 1st Class*)
      *   (3) Identifies that repealing C is independently impossible under its own terms. (1 mark)
      *   (4) **Correctly argues Rule C's self-entrenchment is *redundant* given Rule A's entrenchment.** (1 mark - *Essential for 1st Class*)
      *   (5) Explains why: Rule A's "only... Rule B" logically entails Rule A and Rule C can only be changed via Rule B, making Rule C's self-prohibition unnecessary for establishing entrenchment. (1 mark)
      *   *Penalize (up to -2):* Arguing limbs are severable; claiming Rule C repeal *could* be valid if voted on alone; misunderstanding Rule A's scope (thinking it doesn't protect itself/C); arguing Rule C's self-entrenchment *is* essential.

  *   **Structure, Clarity & Conceptual Grasp (3 marks):**
      *   (1) Logical flow, addressing all parts of the question. (1 mark)
      *   (2) Precise use of terms (validity, alteration, entrenchment, contradiction, paradox). (1 mark)
      *   (3) Clear articulation of the core problem of self-amendment/foundations revealed by the case. (1 mark)

  **First-Class Answer (17-20):** Must make the specific moves marked "Essential for 1st Class" above (correct contradiction diagnosis, non-severability due to Rule C's enduring application, Rule C's redundancy). Demonstrates a sophisticated understanding of the performative contradiction and the foundational dilemma. Precise, logical, and covers all elements comprehensively without significant error.

  **Good Answer (13-16):** Correct on procedure and non-severability. Identifies a paradox but may not pinpoint contradiction as sharply or distinguish it perfectly from regress/gap. Understands Rule C's role but might understate its redundancy slightly. Generally clear and logical.

  **Adequate Answer (9-12):** Identifies key procedural failures. Recognizes *a* problem with self-amendment but diagnosis is vague (e.g., just "paradox" or misdiagnosed as regress/gap). Severability might be mishandled. Rule C's role might be misunderstood. Some logical gaps or confusion.

  **Weak Answer (5-8):** Significant procedural errors (e.g., thinks 80% suffices for all). Fails to identify a genuine self-referential paradox. Poor handling of severability and Rule C's role. Unclear or illogical reasoning.

  **Poor Answer (0-4):** Fundamental misunderstandings of the rules or the question. Fails to engage with the core issues of self-reference and validity.
