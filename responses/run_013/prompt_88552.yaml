  ### Final Examination Question - Cooperative Game Theory and Bargaining

  **Instructions:** Answer all three parts. Show all working. State any axioms in full. Marks are indicated for each part. Total marks: 25.

  ---

  **Problem 1:** Two parties divide a surplus. Utility is cardinal and comparable only up to independent positive affine transformations. The disagreement point is (0, 0). The feasible set is compact, convex, and comprehensive, formed by the convex hull of (0, 0), (12, 0), (10, 4), and (0, 9), including all dominated points.

  **Problem 2:** Disagreement point (0, 0), and a comprehensive set that is the union of the rectangle with corners (0, 0), (6, 0), (6, 12), (0, 12) and the triangle with corners (0, 0), (10, 0), (0, 10). This set is not convex.

  ---

  **Part 1: Computation (6 marks)**  
  For Problem 1:  
  (i) Compute the Nash bargaining solution. Show your working.  
  (ii) Compute the Kalai–Smorodinsky bargaining solution. Show your working.  
  (iii) For each solution, state the fraction (expressed exactly) of its own ideal payoff that each party ends up with.  

  **Part 2: Axioms (9 marks)**  
  (i) For the Nash solution, state which standard axiom it must give up. State this axiom in full.  
  (ii) For the Kalai–Smorodinsky solution, state which standard axiom it must give up. State this axiom in full.  
  (iii) Explain why no bargaining solution can satisfy both axioms simultaneously, given the other standard requirements shared by both solutions (state what these shared requirements are). Include a concrete two-party example where the Nash solution moves a party's payoff in the "wrong direction" when the feasible set grows while the other party's ideal payoff is unchanged.  

  **Part 3: Application and Analysis (10 marks)**  
  Apply the Kalai–Smorodinsky construction to Problem 2.  
  (i) Compute the Kalai–Smorodinsky solution or identify what happens during the computation.  
  (ii) Explain what the breakdown (or result) reveals about what the Kalai–Smorodinsky construction presupposes.  
  (iii) What should a defender of the Kalai–Smorodinsky solution say about this issue?  

  ---

  ### Model Answer

  **Part 1: Computation (6 marks)**  
  *(i) Nash solution for Problem 1:*  
  The feasible set's Pareto frontier consists of two segments:  
  - Segment A: From (12, 0) to (10, 4). Equation: \(u_1 = 12 - \frac{1}{2}u_2\) for \(u_2 \in [0, 4]\).  
  - Segment B: From (10, 4) to (0, 9). Equation: \(u_1 = 18 - 2u_2\) for \(u_2 \in [4, 9]\).  

  The Nash solution maximizes \(u_1 u_2\) (since \(d = (0, 0)\)).  
  - On Segment A: \(u_1 u_2 = (12 - \frac{1}{2}u_2)u_2 = 12u_2 - \frac{1}{2}u_2^2\).  
    Derivative: \(12 - u_2\). Critical point \(u_2 = 12\) (outside [0,4]). Endpoints: (12,0) gives 0, (10,4) gives 40.  
  - On Segment B: \(u_1 u_2 = (18 - 2u_2)u_2 = 18u_2 - 2u_2^2\).  
    Derivative: \(18 - 4u_2\). Critical point \(u_2 = 4.5\) (in [4,9]).  
    Then \(u_1 = 18 - 2 \times 4.5 = 9\), product \(9 \times 4.5 = 40.5\).  
    Endpoints: (10,4) gives 40, (0,9) gives 0.  
  Maximum product is 40.5 at (9, 4.5).  
  **Nash solution: (9, 4.5).**  

  *(ii) Kalai–Smorodinsky solution for Problem 1:*  
  Ideal point: Player 1's ideal = 12 (from (12,0)), Player 2's ideal = 9 (from (0,9)).  
  The solution satisfies \( \frac{u_1}{12} = \frac{u_2}{9} \) ⇒ \( u_1 = \frac{4}{3}u_2 \).  
  - Intersect with Segment A: \(12 - \frac{1}{2}u_2 = \frac{4}{3}u_2\) ⇒ \(12 = \frac{11}{6}u_2\) ⇒ \(u_2 = \frac{72}{11} \approx 6.545\) (not in [0,4]).  
  - Intersect with Segment B: \(18 - 2u_2 = \frac{4}{3}u_2\) ⇒ \(18 = \frac{10}{3}u_2\) ⇒ \(u_2 = \frac{54}{10} = 5.4\) (in [4,9]).  
    Then \(u_1 = \frac{4}{3} \times 5.4 = 7.2\).  
  **Kalai–Smorodinsky solution: (7.2, 5.4).**  

  *(iii) Fractions of ideal payoffs:*  
  - Nash solution: (9, 4.5)  
    Player 1: \( \frac{9}{12} = \frac{3}{4} \), Player 2: \( \frac{4.5}{9} = \frac{1}{2} \).  
  - Kalai–Smorodinsky solution: (7.2, 5.4)  
    Player 1: \( \frac{7.2}{12} = \frac{3}{5} \), Player 2: \( \frac{5.4}{9} = \frac{3}{5} \).  

  **Part 2: Axioms (9 marks)**  
  *(i) Nash solution gives up:*  
  **Resource Monotonicity (stated in full):** If the feasible set expands from \(S\) to \(T\) (with the same disagreement point) and the ideal payoff of at least one player increases (with no player's ideal payoff decreasing), then each player's payoff in the solution for \(T\) should be at least as high as in \(S\).  

  *(ii) Kalai–Smorodinsky solution gives up:*  
  **Independence of Irrelevant Alternatives (IIA) (stated in full):** If \(S\) is a subset of \(T\), and the solution for \(T\) lies in \(S\), then the solution for \(S\) should be the same as for \(T\).  

  *(iii) Explanation and example:*  
  Shared requirements: Pareto efficiency, symmetry, scale invariance, and individual rationality.  
  No solution can satisfy both Resource Monotonicity and IIA because they are incompatible under these shared requirements. Specifically:  
  - Resource Monotonicity requires that players weakly gain when the feasible set expands.  
  - IIA requires that removing "irrelevant" alternatives (not chosen in the larger set) does not change the solution.  
  A solution satisfying both would need to be identical to Nash (which obeys IIA) and Kalai–Smorodinsky (which obeys Resource Monotonicity), but they differ (e.g., in Problem 1, Nash is (9,4.5), KS is (7.2,5.4)).  

  Concrete example for Nash violating Resource Monotonicity:  
  - Initial feasible set \(S\): convex hull of (0,0), (1,0), (0,1). Nash solution: (0.5, 0.5).  
  - Expanded set \(T\): convex hull of (0,0), (1,0), (0,1), (0.4, 0.8).  
    Pareto frontier of \(T\): Segment from (1,0) to (0.4,0.8) and (0.4,0.8) to (0,1).  
    Nash for \(T\): Maximize \(u_1 u_2\).  
    - On (1,0) to (0.4,0.8): \(u_1 = 1 - 0.6t\), \(u_2 = 0.8t\), product \(= (1 - 0.6t)(0.8t)\).  
      Maximum at \(t = \frac{5}{6}\): \(u_1 = 0.5\), \(u_2 = \frac{2}{3} \approx 0.667\), product \(= \frac{1}{3}\).  
    - On (0.4,0.8) to (0,1): Product is maximized at (0.4,0.8) but yields 0.32, less than \(\frac{1}{3}\).  
    Nash solution for \(T\): (0.5, \(\frac{2}{3}\)) ≈ (0.5, 0.667).  
  Player 2's ideal payoff is unchanged (1 in both sets). Yet, when moving from \(S\) to \(T\), Player 1's payoff decreases from 0.5 to 0.5 (unchanged), and Player 2's payoff increases from 0.5 to 0.667. This does not show a decrease.  

  **Correction for a decrease (using a asymmetric set):**  
  - Initial set \(S\): convex hull of (0,0), (1,0), (0,2). Nash solution: Maximize \(u_1 u_2\) on frontier \(2u_1 + u_2 = 2\):  
    \(u_1(2 - 2u_1) = 2u_1 - 2u_1^2\), derivative \(2 - 4u_1 = 0\) ⇒ \(u_1 = 0.5\), \(u_2 = 1\). So (0.5, 1).  
  - Expanded set \(T\): convex hull of (0,0), (1,0), (0,2), (1.5, 0.5).  
    Pareto frontier of \(T\): Segment from (1.5,0.5) to (0,2). Equation: \(u_1 = 6 - 6u_2\) (from interpolation).  
    Maximize \(u_1 u_2 = (6 - 6u_2)u_2 = 6u_2 - 6u_2^2\) for \(u_2 \in [0.5, 1]\).  
    Derivative: \(6 - 12u_2 = 0\) ⇒ \(u_2 = 0.5\), \(u_1 = 3\).  
    Nash solution for \(T\): (3, 0.5).  
  Player 2's ideal payoff is unchanged (2 in both sets). Payoff for Player 2 decreases from 1 in \(S\) to 0.5 in \(T\)—a move in the "wrong direction" (decrease) when the set expands.  

  **Part 3: Application and Analysis (10 marks)**  
  *(i) Kalai–Smorodinsky construction for Problem 2:*  
  Ideal point: Player 1's ideal = max over feasible set.  
  - In rectangle [0,6]×[0,12]: Player 1's max = 6 (at (6, y), y≤12).  
  - In triangle (0,0),(10,0),(0,10): Player 1's max = 10 (at (10,0)).  
    But (10,0) is feasible, so Player 1's ideal = 10.  
  Player 2's ideal:  
  - In rectangle: Player 2's max = 12 (at (x,12), x≤6).  
  - In triangle: Player 2's max = 10 (at (0,10)).  
    Since (0,12) is in the rectangle, Player 2's ideal = 12.  
  Ideal point: (10, 12).  

  The Kalai–Smorodinsky solution is the intersection of the Pareto frontier with the ray \( \frac{u_1}{10} = \frac{u_2}{12} \) ⇒ \( u_2 = 1.2u_1 \).  
  The feasible set is non-convex. Pareto frontier:  
  - In rectangle: Vertical line at \(u_1 = 6\) for \(u_2 \in [0,12]\) (since increasing \(u_2\) dominates other points).  
  - In triangle: Line from (6,12) to (10,0) (but (6,12) is in rectangle, (10,0) in triangle), but the set is not convex, so the frontier is piecewise.  
    Actual frontier: From (0,12) to (6,12), then to (10,0), then to (0,0). But (0,12) to (6,12) is horizontal (Pareto-inferior to (6,12)).  
    Efficient frontier: Points where no improvement in both coordinates:  
    - From (6,12) to (6,0)? No, (6,y) for y<12 is dominated by (6,12).  
    - From (6,12) to (10,0): This segment is in the set? (7,9) calculation: in rectangle if u1≤6, in triangle if u1+u2≤10. For u1>6, need u1+u2≤10.  
    Segment from (6,12) to (10,0): At (7,9), 7+9=16>10, not in triangle; also not in rectangle (u1>6). So infeasible.  
    Thus, the Pareto frontier has a gap. Efficient points:  
    - Rectangle: (6,12) is Pareto-efficient.  
    - Triangle: Points on line from (6,0) to (0,10) may be efficient if not dominated.  
    But (6,0) is dominated by (6,12). The point (0,10) is efficient.  
    However, (6,12) and (0,10) are disconnected. The ray \(u_2 = 1.2u_1\) does not intersect any efficient point:  
    - In rectangle (\(u_1 \leq 6\)): \(u_2 = 1.2u_1\). At \(u_1 = 6\), \(u_2 = 7.2\) (feasible in rectangle? (6,7.2) is in rectangle [0,6]×[0,12]). But (6,7.2) is Pareto-dominated by (6,12).  
    - In triangle (\(u_1 + u_2 \leq 10\)): \(u_2 = 1.2u_1\) ⇒ \(u_1 + 1.2u_1 = 2.2u_1 \leq 10\) ⇒ \(u_1 \leq \frac{50}{11} \approx 4.545\), \(u_2 = 1.2 \times \frac{50}{11} = \frac{60}{11} \approx 5.454\).  
    But (4.545, 5.454) has \(u_1 + u_2 = 10\), so it is on the triangle’s frontier. However, (4.545, 5.454) is Pareto-dominated by (6,12) (since 6>4.545 and 12>5.454).  
    Thus, no efficient point on the ray. The Kalai–Smorodinsky construction fails to yield a solution on the Pareto frontier.  

  *(ii) What the breakdown reveals:*  
  The construction presupposes that the ray \( \frac{u_1}{a_1} = \frac{u_2}{a_2} \) intersects the Pareto frontier of the feasible set. This requires:  
  - The feasible set is convex.  
  - The Pareto frontier is connected and "well-behaved."  
  Problem 2 is non-convex, causing a disconnected Pareto frontier. The ray passes through dominated points, violating the efficiency requirement.  

  *(iii) Defender's response:*  
  A defender should argue that the Kalai–Smorodinsky solution is only defined for convex feasible sets. For non-convex problems, it should not be applied directly. Options:  
  1. Restrict the solution to convex sets only.  
  2. Convexify the feasible set (take the convex hull) before applying the solution.  
  3. Use an alternative solution concept for non-convex problems.  

