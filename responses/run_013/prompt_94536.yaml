answer: |-
  ### Historicism Spot-Check: 8 Questions for Grant Proposals  
  *(Based on Popper's survivable critiques: trend/law distinction, Oedipus effect, and claims to total knowledge)*  

  **1. What exactly is being predicted?**  
  - *Sufficient:* "If X happens, then Y *might/could* follow" (conditional) or "Y is *currently trending*" (descriptive).  
  - *Fail:* "Y *will/must* happen" (inevitable) or "It's destiny".  
  - *Unclear?* Rewrite as a testable hypothesis.  

  **2. Is this framed as an unbreakable law? (HARD STOP)**  
  - *Sufficient:* No appeal to "historical laws," "iron necessities," or "divine forces."  
  - *Fail:* Uses terms like "always," "inevitable," "guaranteed by history."  
  - *ACTION:* If fail, reject or demand removal of deterministic language.  

  **3. What’s the evidence?**  
  - *Sufficient:* Data from comparable cases, peer-reviewed studies, or clear trend analysis.  
  - *Fail:* Only theory, cherry-picked examples, or appeals to authority.  
  - *Unclear?* Flag for external review.  

  **4. Could the opposite happen?**  
  - *Sufficient:* Names plausible counterexamples or risks (e.g., "Democracy backsliding is possible if...").  
  - *Fail:* Dismisses alternatives as "impossible" or ignores them.  
  - *Unclear?* Require risk mitigation in the proposal.  

  **5. Is this situation truly unique? (JUDGMENT CALL)**  
  - *Sufficient:* Acknowledges novel factors (e.g., new tech, cultural shifts).  
  - *Fail:* Assumes past patterns *must* repeat identically.  
  - *ACTION:* If uniqueness is high, escalate to senior staff—no checklist can replace contextual wisdom.  

  **6. Could this prediction *cause* the outcome? (Oedipus Effect)**  
  - *Sufficient:* Shows how the grant’s actions drive change (e.g., "Our coalition-building *creates* the win").  
  - *Fail:* Claims the outcome happens regardless of the grant.  
  - *Unclear?* Reframe as a self-fulfilling effort.  

  **7. Does it claim to predict the *whole* society?**  
  - *Sufficient:* Focuses on specific levers (e.g., "voter turnout in region Z").  
  - *Fail:* Asserts society-wide transformation (e.g., "all culture will shift").  
  - *Unclear?* Narrow the scope.  

  **8. How certain is the timeline?**  
  - *Sufficient:* "Within 20 years *if* A, B, C align" (contingent).  
  - *Fail:* "By 2040, no matter what."  
  - *Unclear?* Demand scenario planning.  

  ---  
  **Where This Misfires**  
  - **Honest Bets:** Proposals openly gambling on uncertain futures (e.g., "This might fail, but the payoff justifies risk") *pass* Q2–Q4. Don’t penalize uncertainty—penalize disguising bets as prophecies.  
  - **Gaming:** Grantees may soften language but keep deterministic logic. Watch for "inevitable" rephrased as "highly probable" without evidence.  
  - **Pressure Tactics:** "Window closing" claims often fail Q4 (no counterexamples) or Q8 (arbitrary deadlines).  

  ---  
  ### Test Runs  

  **Proposal 1: Income Threshold → Democracy**  
  - *Key Question:* **Q2 (Law Claim).** "Becomes a democracy and stays one" frames it as inevitable.  
  - *Verdict:* **FAIL** (Hard stop). Reject or demand revision to conditional language (e.g., "often correlates, but backsliding risks include...").  
  - *Unsettled:* Whether the correlation is strong enough to justify the bet—requires judgment (Q5).  
  - *Label:* **PROPHECY-DO-NOT-USE**  

  **Proposal 2: Coalition Victory in 20 Years**  
  - *Key Question:* **Q6 (Oedipus Effect).** The prediction motivates action ("our side wins *if* we build the coalition").  
  - *Verdict:* **PASS** (Sufficient if coalition-building is the grant’s core work).  
  - *Unsettled:* Timeline feasibility (Q8)—requires monitoring milestones.  
  - *Label:* **CONDITIONAL-BET**  

  **Proposal 3: Culture Shift ("Next decade belongs to the organised")**  
  - *Key Question:* **Q4 (Opposite Outcomes).** Fails to address how opponents could adapt or why collapse is irreversible.  
  - *Verdict:* **WEAK** (No counterexamples). Demand revision adding resilience scenarios (e.g., "If traditional groups regroup, we’d respond by...").  
  - *Hard Truth:* Your attachment likely overlooks Q4’s risks. The core bet isn’t doomed, but the inevitability framing is.  
  - *Label:* **TREND-NOT-LAW**  

  ---  
  \answer{1: PROPHECY-DO-NOT-USE; 2: CONDITIONAL-BET; 3: TREND-NOT-LAW}
