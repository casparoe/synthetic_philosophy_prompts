  **Case: The Apartment Temperature**

  Alice and Bob are roommates. They must choose one of two policies for the apartment temperature:

  - Policy A: Keep the apartment cool (68°F)
  - Policy B: Keep the apartment warm (72°F)

  Preferences:

  - Alice prefers Policy A. She functions well in cool temperatures but finds warm temperatures uncomfortable.
  - Bob prefers Policy B. He is comfortable in warm temperatures but finds cool temperatures uncomfortable.

  Extra Fact: 
     Bob's well-being under Policy A is lower than Alice's well-being under Policy B.

  Analysis:

  1. **Level comparison (for maximin)**: 
     - In Policy A, the worst-off individual is Bob. 
     - In Policy B, the worst-off individual is Alice.
     - By the extra fact, Bob's well-being in A is lower than Alice's well-being in B. Therefore, the worst-off in Policy B is better off than the worst-off in Policy A. To maximize the well-being of the worst-off, we prefer Policy B.

  2. **Difference comparison (for utilitarianism)**:
     - We need to compare the total well-being. 
     - Policy A: Alice has high well-being, Bob has low well-being.
     - Policy B: Alice has medium-low well-being, Bob has high well-being.
     - However, the drop in Alice's well-being from Policy A to Policy B is smaller than the gain in Bob's well-being from Policy A to Policy B? No, wait: we want the total in A to be higher. In our numbers, the total in A is higher because Alice's high well-being in A and Bob's not-too-low well-being in A together exceed the total in B where Alice is not too low and Bob is high.

     Specifically, in the numerical example:
          A: Alice 10 + Bob 3 = 13
          B: Alice 4 + Bob 8 = 12
     So the total in A is higher.

     How to describe without numbers: 
          "Alice's well-being is affected more by the temperature than Bob's. In particular, the difference in well-being for Alice between cool and warm is greater than the difference for Bob between cool and warm. Specifically, Alice loses a great deal of well-being when moving from cool to warm, while Bob gains only a moderate amount."

     But wait, in our numbers:
          Alice in A: 10, in B: 4 -> difference 6 (loss of 6 if moving to B)
          Bob in A: 3, in B: 8 -> difference 5 (gain of 5 if moving to B)

     So the loss to Alice (6) is greater than the gain to Bob (5), so moving to B would result in a net loss. Hence, total well-being is higher in A.

     Therefore, utilitarianism prefers Policy A.

  So the rankings are:
     - Maximin: B > A
     - Utilitarianism: A > B

  The key extra fact is: "Bob's well-being in Policy A is lower than Alice's well-being in Policy B." If we remove this, then we cannot say that the worst-off in B is better off than the worst-off in A. Hence, maximin cannot rank them in this way, and the conflict might disappear.

  Objection: The case assumes we can cardinally measure and interpersonally compare well-being differences and levels. A critic who denies the meaningfulness of interpersonal comparisons would say that we have no way to know that Bob's well-being in A is lower than Alice's in B, or that Alice's loss in well-being is 6 units while Bob's gain is 5 units.

  Response: We can try to reformulate the extra fact in terms of observable behavior. For example, we might say that under Policy A, Bob is bedridden (observable state) while under Policy B, Alice is only somewhat less productive. But the critic might still deny that we can compare the well-being across individuals. However, for the purpose of this case, we are assuming that such comparisons are the only point of disagreement. The case shows that if one accepts level comparisons, one gets one ranking, and if one accepts difference comparisons, one gets the other, and that the assignments of levels and differences are consistent with the ordinal preferences. The substantive values (caring about the worst-off vs. the total) are the same; the difference is in the technical assumption about what is comparable.

  We might rebuild the case using money as a proxy. For example, we might ask how much money Alice would need to compensate for the warm temperature and how much money Bob would need to compensate for the cool temperature. But money might not be a perfect proxy due to diminishing marginal utility, and it might introduce new issues.

  Given the constraints, the temperature case with the extra fact as stated is suitable.
