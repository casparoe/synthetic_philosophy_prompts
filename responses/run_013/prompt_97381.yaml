  ### Constructed Case: The Office Window Assignment  
  **Scenario:** Two coworkers, Alice and Bob, share an office with one window seat (better lighting, view, and privacy) and one interior seat (dim, no view, noisy). They must choose between two policies:  
  - **Policy A:** Alice gets the window seat, Bob gets the interior seat.  
  - **Policy B:** Bob gets the window seat, Alice gets the interior seat.  

  **Ordinal Preferences (over outcomes):**  
  - Alice prefers Policy A (window) to Policy B (interior).  
  - Bob prefers Policy B (window) to Policy A (interior).  

  **Extra Fact for Interpersonal Comparisons:**  
  *Alice has chronic migraines exacerbated by fluorescent lighting; Bob has no medical issues but dislikes the interior seat for mild reasons (e.g., it feels cramped).*  
  → **Key Assumption:** *Alice’s loss of well-being from losing the window seat is greater than Bob’s gain from getting it.*  

  **Conflicting Rankings:**  
  1. **Level Comparison (e.g., Rawlsian Maximin):**  
     - *Analysis:* Compare absolute well-being *levels* in each outcome.  
       - Under Policy A: Alice (window) has *moderate* well-being (migraines avoided); Bob (interior) has *low* well-being (cramped but healthy).  
       - Under Policy B: Alice (interior) has *very low* well-being (migraines, unable to work); Bob (window) has *high* well-being (comfortable, productive).  
     - *Level Comparison Verdict:* Alice in Policy B (very low) is worse off than Bob in Policy A (low). Thus, the worst-off person is better off under Policy A.  
     - **Social-Choice Rule:** **Maximin** (prioritize the worst-off).  
       - *Ranking:* Policy A > Policy B.  
       - *Defender’s View:* "Policy A is just because it prevents Alice from falling into a dire state."  

  2. **Difference Comparison (e.g., Utilitarianism):**  
     - *Analysis:* Compare well-being *differences* (gains/losses) across policies.  
       - Moving from Policy A to Policy B:  
         - Alice *loses* a large amount of well-being (from moderate to very low).  
         - Bob *gains* a small amount of well-being (from low to high).  
       - *Difference Comparison Verdict:* Alice’s loss > Bob’s gain. Total well-being decreases under Policy B.  
     - **Social-Choice Rule:** **Utilitarianism** (maximize total well-being).  
       - *Ranking:* Policy A > Policy B.  
       - *Defender’s View:* "Policy A is better because the net harm of Policy B outweighs its benefits."  

  **Single Feature Doing the Work:**  
  The extra fact that **Alice’s disadvantage (chronic migraines) makes her well-being losses larger than Bob’s gains under policy changes**. If you delete this fact—e.g., assume both are healthy and only mildly prefer the window—the disagreement vanishes:  
  - Without the migraines, level comparisons cannot rank the worst-off (both have similar "low" levels in their dispreferred seats), and difference comparisons show symmetric gains/losses. Both rules converge on indifference or a coin flip.  

  **Strongest Objection (Anti-Interpersonal-Comparison):**  
  *Objection:* "The case smuggles in cardinal, interpersonally comparable utilities. We only observe ordinal preferences (Alice/Bob rank seats), but you *assumed* unobservable facts about ‘well-being levels’ (Alice in Policy B is ‘very low’) and ‘differences’ (Alice’s loss > Bob’s gain). This is metaphysical, not empirical."  

  *Rebuild to Survive:* Replace the migraine with an observable, behaviorally-verifiable proxy:  
  - **Revised Extra Fact:** *Alice will take unpaid sick days (observable income/attendance loss) if in the interior seat due to lighting-triggered migraines. Bob has no such risk.*  
  - *Survival Strategy:*  
    - **Level Comparison:** Use observed outcomes (days worked, income) to proxy "well-being levels." Alice in Policy B loses income → objectively worse off than Bob in Policy A.  
    - **Difference Comparison:** Compare forgone income (Alice’s loss) vs. Bob’s comfort gain (no income change). Alice’s measurable loss > Bob’s unquantified gain.  
  - *Why It Survives:* The objection fails because the key facts (income loss, attendance) are ordinal *and* interpersonally observable without utility metrics. Level/difference comparisons now derive from shared scales (days worked, dollars), not subjective "well-being."  

  ### Why This Case Works for Your Argument  
  - **Pure Technical Disagreement:** The policies flip only if you assume level comparability (Maximin) or difference comparability (Utilitarianism). No values (e.g., "equality") are in dispute.  
  - **No Stipulated Verdicts:** Rankings derive solely from applying each comparison method to the preferences + extra fact.  
  - **Ordinary Stakes:** Workplace fairness, no sci-fi, relatable tradeoffs.  
  - **Collapse Test:** Deleting the extra fact (migraines/income loss) removes asymmetry, reconciling the rules.  

  **Conclusion for Your Post:** This case isolates the level/difference divide: Maximin needs to know *who is worse off absolutely*; Utilitarianism needs to know *whose gains/losses are larger*. The "substantive disagreement" is just a technical fork in interpersonal comparability.
