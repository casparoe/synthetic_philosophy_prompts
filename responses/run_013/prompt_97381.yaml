  But in the description above, I said Bob's loss from cool is more than Alice's gain from cool? That would imply that moving from B to A: Alice gains, Bob loses, and the loss is greater than the gain, so total well-being decreases. Then utilitarian would prefer B. But then both rules agree on B? We need them to disagree.

