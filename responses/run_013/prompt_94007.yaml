prompt: |-
  I teach a second-year undergraduate seminar in epistemology, and until about six weeks ago the material on pragmatic encroachment and epistemic contextualism was, for me, a slightly bloodless set of distinctions I could teach without much investment. Then I spent a fortnight on the receiving end of a workplace investigation, and I watched — in myself and in the colleagues around me — the same bundle of evidence that I would unhesitatingly have called knowledge in a low-stakes setting (is this citation sloppy, is this record-keeping adequate?) curdle into something none of us would have described as knowledge once the question became whether someone's job would survive it. Nobody became stupider or more cautious in any ordinary sense, and no new evidence arrived. What changed was what was riding on the answer. I would like my students to feel that happen in their own mouths, before they hear any of the labels.

  So I am asking you to act as an experienced teacher of epistemology and a designer of classroom simulations — someone who has run games with real (small) stakes and knows the specific ways they fall apart. Think carefully before you write. Begin with a short scratchpad in which you work out what the activity must accomplish and what could plausibly go wrong with each design choice you consider; only then give me the finished design.

  The session is 90 minutes, 14 students, a seminar room with movable chairs. The two views I want them to have run into by the end are these, and I want them stated in my students' language rather than the literature's:

  1. Contextualism: whether a knowledge attribution is true depends on the context of whoever is doing the attributing — roughly, on how salient error possibilities are to that attributor — so the same person with the same evidence can be correctly described as knowing in one conversation and as not knowing in another.
  2. Pragmatic encroachment (or subject-sensitive invariantism): whether the subject knows depends on her practical stakes — on how much turns, for her, on whether the thing is true — so a subject can lose or gain knowledge when her stakes change while her evidence and the attributor's context stay fixed.

  The crux I want them to collide with is that both views predict the same surface pattern, namely verdicts drifting with stakes, and that the only way to prise them apart is to move two variables independently: the stakes for the person who has to act on the evidence, and the stakes for the person asked whether she knows. If the activity can be built so that those two move separately, so much the better. If you judge that cannot be done with real participants in 90 minutes, say why and design the closest thing that can.

  What I need from you:

  - Roles, rules, and materials. Assume photocopying and a bag of small tokens; nothing that needs money, devices, or software.
  - A stakes scheme in points, tokens, or privileges rather than cash, calibrated so that the high-stakes condition genuinely bites without making anyone miserable or resentful.
  - A minute-by-minute timeline for the 90 minutes, including a point at which verdicts are written down individually before anyone can talk, so that we have data rather than a consensus we manufactured.
  - A debrief keyed to particular moments: which thing that happened is what contextualism explains, which is what encroachment explains, and what each view would have predicted that we did not observe. The students should do the naming and the arguing; I will supply the labels only after they have committed themselves.
  - Your best guess at what will predictably go wrong the first time I run it — the ways the stakes manipulation will fail to bite, the ways participants will game the rules, the ways the result will be demand characteristics rather than the phenomenon — and what I should do in the moment when each of those happens.
  - A frank note on what this activity cannot reproduce, that is, what I will have to say in my own voice because no amount of moving chairs around the room will deliver it.

  One constraint on sources: no reading list, no citations, and no named or dated experimental findings. If something from the empirical literature bears on a design choice, describe it in plain language and let me take it on trust.
reasoning: |-
  We are designing a classroom simulation to help students experientially grasp the difference between contextualism and pragmatic encroachment. The core challenge: both theories predict that knowledge attributions change with stakes, but they locate the stakes sensitivity in different places (attributor's context vs. subject's practical situation). We must create an activity where we can independently vary:
  - The stakes for the subject (who acts on the evidence)
  - The stakes for the attributor (who is asked whether the subject knows)

  We want students to feel the shift in their own judgments as stakes change, and then to notice that sometimes the attributor's stakes matter and sometimes the subject's stakes matter.

  Activity Design:

  Title: The Evidence Room

  Overview: Students play one of three roles: Investigators (subjects who must act on evidence), Reviewers (attributors who judge whether Investigators know), or Observers (who note down what happens). The scenario is a simplified workplace investigation about a minor procedural issue (e.g., record-keeping). We manipulate stakes by assigning point values to outcomes (points can be exchanged for small privileges, e.g., extra credit tokens, choosing seminar topics, etc.). The activity has multiple rounds with varying stakes for Investigators and Reviewers.

  Key Elements:
  - Evidence: A set of facts about a case (e.g., whether a lab record was properly maintained). The evidence is ambiguous but leans toward one conclusion.
  - Roles: 
      - Investigators (Subjects): Must decide on a verdict (e.g., "Compliant" or "Non-compliant") and act on it. Their stakes: if correct, they gain points; if wrong, they lose points (and in high stakes, the loss is severe).
      - Reviewers (Attributors): After an Investigator acts, a Reviewer is asked: "Does [Investigator] know that the record was [Compliant/Non-compliant]?" The Reviewer's answer affects their own points. If they say "knows" and the Investigator is right, they gain; if wrong, they lose. If they say "doesn't know" and the Investigator is wrong, they gain (for caution); if the Investigator is right, they lose (for excessive caution). But the stakes for the Reviewer vary: in some rounds, the cost of being wrong is low; in others, high.
      - Observers: Record the decisions and note any interesting behavior. They also serve as a pool for rotating roles.

  Materials:
  - Case sheets: One per round, describing the evidence (e.g., a paragraph about a lab record with some missing dates and some supporting notes). The same case is used for multiple rounds to keep evidence constant.
  - Role cards: Explain the role and the current stakes.
  - Tokens: Represent points. Different colors for different rounds? Or use a tally sheet.
  - Stakes manipulation: Clearly state the point values for each outcome in each round.

  Stakes Scheme:
  - Points are fictitious currency. At the end, points can be exchanged for privileges (e.g., 20 points = one extra credit token; 10 points = choose a topic for next week; etc.). The privileges are small but meaningful enough to motivate engagement without causing distress.
  - High stakes: Losses are large (e.g., losing 15 points) and gains are modest (e.g., gaining 5 points). This mirrors real high-stakes situations where avoiding loss is paramount.
  - Low stakes: Gains and losses are small and symmetric (e.g., +5 for correct, -5 for wrong).

  Round Structure:
  We need at least 4 rounds to cover the combinations of stakes:

  | Round | Subject (Investigator) Stakes | Attributor (Reviewer) Stakes |
  |-------|-------------------------------|------------------------------|
  | 1     | Low                           | Low                          |
  | 2     | High                          | Low                          |
  | 3     | Low                           | High                         |
  | 4     | High                          | High                         |

  But note: We want to see the independent effect of subject stakes and attributor stakes. In Round 2 (high subject, low attributor), if knowledge attributions become less generous, that would support pragmatic encroachment (subject's stakes matter). In Round 3 (low subject, high attributor), if knowledge attributions become less generous, that would support contextualism (attributor's stakes matter).

  Procedure:

  1. Introduction (10 minutes):
     - Explain the scenario: "We are part of a university committee overseeing lab safety. Today we are reviewing a case about record-keeping in a lab."
     - Assign roles: 4 Investigators, 4 Reviewers, 6 Observers. Rotate roles each round so everyone gets a turn as Investigator and Reviewer.
     - Explain the case: Distribute the same case sheet to everyone. Read aloud: "The lab log for Project X shows that on Monday, the temperature was recorded as 25°C. On Tuesday, the entry is smudged and hard to read. On Wednesday, the entry is missing. The lab manager, Dr. Smith, says the equipment was working properly and the missing entries were due to a temporary system glitch. A technician, Alex, says the machine was acting up and Dr. Smith is covering up. There's a note from Dr. Smith on Wednesday saying 'system restored'."

     - Task: 
          - Investigators must decide: Was the lab record compliant? (Yes/No)
          - Reviewers will be asked: "Does [Investigator] know that the record was [compliant/non-compliant]?" (Yes/No)
          - Observers take notes.

     - Stakes explanation: 
          - Investigators: If their verdict is correct, they gain points; if incorrect, they lose points. The amount depends on the round.
          - Reviewers: They get points based on their judgment and the outcome (as described above).

     - Emphasize: We are interested in their honest judgments. There are no tricks.

  2. Round 1: Low Subject Stakes, Low Reviewer Stakes (15 minutes)
     - Distribute role cards with stakes:
          - Investigator: "If you are correct: +5 points. If wrong: -5 points."
          - Reviewer: "If you say 'knows' and the Investigator is correct: +5. If wrong: -5. If you say 'doesn't know' and the Investigator is wrong: +5. If the Investigator is right: -5."

     - Investigators read the case and write their verdict (Compliant/Non-compliant) and their confidence (0-10). They hand in their verdict.
     - Each Investigator is paired with a Reviewer. The teacher reveals the correct answer (for this simulation, let's pre-set the truth: the record was non-compliant, but the evidence is ambiguous enough that it's not obvious). 
     - Reviewers are told the Investigator's verdict and then asked: "Does [Investigator] know that the record was non-compliant?" (if that was the verdict) or "know that the record was compliant?" They write Yes/No and why (briefly).
     - Collect all responses. Observers note the interactions.

  3. Round 2: High Subject Stakes, Low Reviewer Stakes (15 minutes)
     - Rotate roles: Some Investigators become Reviewers, some Reviewers become Observers, etc.
     - Same case. Change stakes:
          - Investigator: "If correct: +5. If wrong: -15." (high stakes: potential large loss)
          - Reviewer: Same as Round 1 (low stakes: symmetric +5/-5).

     - Repeat: Investigators decide, Reviewers attribute knowledge.

  4. Round 3: Low Subject Stakes, High Reviewer Stakes (15 minutes)
     - Rotate roles.
     - Stakes:
          - Investigator: Low (as Round 1: +5/-5)
          - Reviewer: High stakes: "If you say 'knows' and the Investigator is correct: +5. If wrong: -15. If you say 'doesn't know' and the Investigator is wrong: +5. If the Investigator is right: -15." (Note: The cost of being wrong is high for the Reviewer when they attribute knowledge, but also when they fail to attribute knowledge and the subject is right.)

  5. Round 4: High Subject Stakes, High Reviewer Stakes (15 minutes)
     - Rotate roles.
     - Stakes: Both high (as Round 2 for subject, Round 3 for reviewer).

  6. Individual Verdict Collection (5 minutes)
     - At the start of the activity, before any discussion, each student writes on a slip of paper their prediction of what will happen (to capture baseline). But more importantly, after all rounds, each student writes individually:
          - In which round did you (as Investigator) feel most uncertain? Why?
          - In which round did you (as Reviewer) feel most hesitant to say the Investigator 'knew'? Why?
          - What pattern did you notice in when people were willing to attribute knowledge?

  7. Debrief (25 minutes)
     - First, have students form small groups (3-4) to share their observations for 5 minutes.
     - Then, whole group discussion:
          - Step 1: Report the data. For each round, how many Investigators were confident? How many Reviewers attributed knowledge? (We want to see that in high subject stakes rounds, Investigators might be less confident, but more importantly, we want to see if knowledge attributions drop when subject stakes are high (even when reviewer stakes are low) and when reviewer stakes are high (even when subject stakes are low).)
          - Step 2: Ask: "When did you feel like you (or the Investigator) didn't know? What made the difference?" 
          - Step 3: Introduce the two views without labels: 
              "One idea: whether we say someone 'knows' depends on how important it is to us (the person saying it) not to be wrong. Did you see that in the activity? When?"
              "Another idea: whether the person actually knows depends on how much is at stake for them. Did you see that? When?"
          - Step 4: Point out the rounds: 
              - Round 2: High subject stakes, low reviewer stakes. If knowledge attributions dropped here, that supports the second idea (subject stakes matter). 
              - Round 3: Low subject stakes, high reviewer stakes. If knowledge attributions dropped here, that supports the first idea (attributor stakes matter).
          - Step 5: Let students argue about which pattern was stronger and what that means. Then supply the labels: contextualism (first idea) and pragmatic encroachment (second idea).
          - Step 6: Discuss: What would each theory predict for Round 4? (Both high: both predict low knowledge attributions.) What about Round 1? (Both low: both predict high attributions.) But the key is the mixed rounds.

  Potential Problems:

  1. Stakes manipulation fails to bite:
     - Why? Students might not care about points. Or the scenario might not feel real.
     - Fix: Make the privileges desirable and tangible (e.g., extra credit tokens, or the ability to skip a reading). Emphasize the stakes at the start and during rounds.

  2. Students game the system:
     - Why? They might collude (e.g., an Investigator and Reviewer agree on a verdict). Or they might try to maximize points by always being cautious.
     - Fix: Design the points so that being appropriately confident is rewarded. Also, keep the correct answer hidden until after the Reviewer's judgment. And emphasize that the goal is to be truthful, not strategic. Also, rotate pairs so they don't work with the same person.

  3. Demand characteristics:
     - Why? Students might guess the hypothesis and adjust their behavior accordingly.
     - Fix: Do not reveal the purpose until the debrief. Frame it as a study of decision-making in committees. Also, collect individual written responses before any group discussion.

  4. Time:
     - 90 minutes is tight. Rounds might take longer than 15 minutes.
     - Fix: Strict timekeeping. Have a timer. In each round: 3 min for Investigators to decide, 3 min for Reviewers to decide. Then move on. Observers can note during the process.

  5. Evidence ambiguity:
     - Why? If the evidence is too clear, no stakes effect. If too ambiguous, everyone is always uncertain.
     - Fix: Pilot the case. It should be about 60-40 in favor of one side. Also, use the same case throughout to control for evidence.

  6. Role confusion:
     - Why? Students might forget their role's stakes.
     - Fix: Provide role cards with clear stakes for each round.

  What the activity cannot reproduce:

  - The deep, personal experience of real high-stakes situations (like your workplace investigation). The simulation is artificial and the stakes are not real. You will have to use your own experience to convey how it feels when the stakes are not points but a job, reputation, or relationships. The activity can only hint at that shift.

  Final Design:

  Materials:
  - Case sheet (one per student, same for all rounds)
  - Role cards (one per role per round, with stakes clearly written)
  - Tally sheets for points (or tokens: e.g., blue=5 points, red=10, but simpler to use tally on paper)
  - Slips for individual written responses

  Timeline:
  - 0:00-0:10: Introduction and role assignment
  - 0:10-0:25: Round 1 (Low, Low)
  - 0:25-0:40: Round 2 (High Subject, Low Reviewer)
  - 0:40-0:55: Round 3 (Low Subject, High Reviewer)
  - 0:55-1:10: Round 4 (High, High)
  - 1:10-1:15: Individual written reflections (on questions above)
  - 1:15-1:40: Debrief (small groups then whole group)
  - 1:40-1:45: Wrap-up and explain privileges exchange (after class)

  Debrief Key:
  - Contextualism explains: When Reviewer stakes are high, Reviewers are less willing to attribute knowledge (even if the subject's stakes are low). This was Round 3.
  - Pragmatic encroachment explains: When subject stakes are high, both the subject and the attributor might be less likely to claim/know (even if the attributor's stakes are low). This was Round 2.
  - What we did not observe: If in Round 2, the Reviewers (low stakes) were still willing to attribute knowledge but the subjects were hesitant to act, that would support pragmatic encroachment without contextualism. But if Reviewers also became less willing to attribute knowledge in Round 2, that could be because they are sensitive to the subject's stakes (which might be a different mechanism). This is a subtle point to discuss.

  Your Role:
  - Keep time strictly.
  - Do not reveal the correct answer until after the Reviewer's judgment in each round.
  - Be neutral during the activity.
  - In debrief, let the students articulate the patterns first.

  This design is ambitious. If it works, students will have felt the stakes shift and will have generated data that distinguishes the two theories. But be prepared to adapt if one element fails. Good luck!
answer: |-
  ### Scratchpad: Working Through the Design
  **Core Objectives:**
  1. **Experience Stakes-Driven Shift:** Students must feel their own knowledge attributions change as stakes shift, without new evidence.
  2. **Isolate Variables:** Manipulate subject stakes (for the actor) and attributor stakes (for the evaluator) independently to distinguish contextualism (attributor’s context) from pragmatic encroachment (subject’s stakes).
  3. **Avoid Artifacts:** Prevent gaming, resentment, or demand characteristics (e.g., students guessing the hypothesis). Stakes must feel real but not punitive.
  4. **Debrief from Data:** Collect pre-discussion verdicts to ground analysis in observed behavior, not groupthink.

  **Key Challenges & Solutions:**
  - **Stakes Not Biting:** Use tokens redeemable for tangible privileges (e.g., skipping a reading, choosing a discussion topic). Calibrate so high stakes = meaningful loss opportunity but not distress (e.g., losing tokens = losing privileges, not punishment).
  - **Gaming the System:** Simplify rules to limit strategy; use ambiguous evidence to force genuine uncertainty; rotate roles to prevent collusion.
  - **Demand Characteristics:** Frame the activity as "decision-making under pressure," not epistemology. Never mention "knowledge" until debrief. Collect written verdicts before discussion.
  - **Time Constraints:** 90 minutes is tight. Use 4 quick rounds (15 min each) with pre-printed materials. Rounds must be identical except for stakes.
  - **Ethics:** No real money or public humiliation. Tokens are low-stakes privileges; debrief normalizes feelings.
  - **What Can’t Be Simulated:** The visceral dread of real-world stakes (e.g., job loss). I’ll need to narrate this gap post-activity.

  **Design Choice: The Compliance Audit**
  - **Scenario:** Students are university committee members reviewing whether a professor (played by the instructor) violated a minor policy (e.g., "cited sources properly in a grant application"). Evidence is ambiguous but fixed: a paragraph with a mix of clear citations and one ambiguous omission.
  - **Why This Works:** 
    - Academically relatable, low emotional load.
    - Evidence is fixed (no new info), creating a "curdling" effect when stakes rise.
    - Roles isolate subject (must act) vs. attributor (judges knowledge).

  **Roles & Rules**  
  *Roles:*  
  - **Investigator (Subject):** Must decide if the professor is "Compliant" or "Non-compliant." Acts by locking in a verdict. Faces stakes based on their decision.  
  - **Reviewer (Attributor):** Asked whether the Investigator *knows* their verdict is correct. Faces stakes based on their attribution.  
  - **Observer:** Records interactions and timing; ensures rules are followed.  
  *(Rotate roles each round so all students experience both roles.)*  

  *Materials:*  
  - **Evidence Sheet (1 per student):** Identical paragraph describing the citation issue. Example:  
    > "Professor Abel’s grant application cites Smith (2020) on page 3 and Jones (2019) on page 5. Page 7 references ‘prior results’ without citation. In a follow-up email, Abel clarified this referred to Lee et al. (2018), but this email was not included in the application."  
  - **Verdict Cards:** Red ("Non-compliant") and Green ("Compliant") cards for Investigators.  
  - **Attribution Cards:** "Knows" and "Does Not Know" cards for Reviewers.  
  - **Tokens:** 100 tokens total (e.g., poker chips). High-stakes loss = 10 tokens; low-stakes loss = 2 tokens. Tokens exchanged post-class for privileges (e.g., 5 tokens = skip one reading; 10 = choose a seminar topic).  
  - **Role Sheets (1 per role per round):** Explain stakes and tasks.  

  *Stakes Scheme:*  
  - **Low Stakes:** Gain/lose 2 tokens. Feels trivial ("coffee money").  
  - **High Stakes:** Lose 10 tokens (significant privilege loss), gain 2 tokens (minimal reward). Asymmetric to mirror loss aversion.  
  - **Why Tokens > Points:** Tangible; clinking chips raise stakes psychologically.  

  **Round Structure (4 Rounds, 15 Min Each)**  
  Manipulate stakes independently:  
  | Round | Investigator (Subject) Stakes | Reviewer (Attributor) Stakes | Target Pattern |  
  |-------|-------------------------------|------------------------------|---------------|  
  | 1     | Low (gain/lose 2 tokens)      | Low (gain/lose 2 tokens)     | Baseline      |  
  | 2     | **High** (lose 10/gain 2)    | Low (gain/lose 2 tokens)     | Pragmatic encroachment: If Investigators act less decisively/Reviewers deny "knowledge" more. |  
  | 3     | Low (gain/lose 2 tokens)      | **High** (lose 10/gain 2)   | Contextualism: If Reviewers deny "knowledge" more despite Investigator’s low stakes. |  
  | 4     | **High** (lose 10/gain 2)    | **High** (lose 10/gain 2)   | Both effects amplified. |  

  *Rules per Round:*  
  1. **Prep (1 min):** Distribute Role Sheets with stakes.  
  2. **Investigator Phase (4 min):**  
     - Investigators read evidence, decide verdict (Compliant/Non-compliant), lock it in by handing a Verdict Card to an Observer.  
  3. **Reviewer Phase (4 min):**  
     - Reviewers see the Investigator’s verdict, then answer: "Does the Investigator *know* their verdict is correct?" by handing an Attribution Card to an Observer.  
  4. **Outcome Phase (5 min):**  
     - Instructor reveals "truth" (pre-set: professor is Non-compliant due to the omission).  
     - Tokens awarded:  
       - Investigator: Gain stakes if verdict correct, lose if incorrect.  
       - Reviewer: Gain stakes if attribution correct (*or* if they say "Does Not Know" and Investigator is wrong), lose if incorrect.  
  5. **Reset (1 min):** Rotate roles; redistribute Role Sheets for next round.  

  **Timeline (90 Min Total)**  
  - **0:00–0:10 (Setup):** Frame activity as "real-world committee simulation." Assign roles (4 Investigators, 4 Reviewers, 6 Observers). Distribute Evidence Sheets. Explain rules, tokens, and privileges (emphasize: "This affects your real seminar experience"). *Do not mention epistemology.*  
  - **0:10–0:25 (Round 1: Low/Low):** Baseline. Students experience low-pressure decisions.  
  - **0:25–0:40 (Round 2: High/Low):** Investigator stakes high. Watch for hesitation in Investigators/Reviewers.  
  - **0:40–0:55 (Round 3: Low/High):** Reviewer stakes high. Watch for Reviewer denials of "knowledge."  
  - **0:55–1:10 (Round 4: High/High):** Both stakes high. Expect pronounced uncertainty.  
  - **1:10–1:15 (Silent Writing):** **Critical moment:** Students write individually:  
    > "In which round did you feel *sure* about your verdict/knowledge claim? In which did you feel *unsure*? What changed?"  
    *(Collect these; they’re raw data for debrief.)*  
  - **1:15–1:35 (Debrief):** Groups of 3 discuss patterns (5 min), then whole group (15 min):  
    - Graph token losses/attribution rates per round (use whiteboard).  
    - Ask: "When did people hesitate to act? When did they hesitate to say ‘knows’? What forced that?"  
    - Guide students to articulate:  
      - "Attributor’s stakes mattered most in Round 3" → Contextualism.  
      - "Subject’s stakes mattered most in Round 2" → Pragmatic encroachment.  
    - Challenge: "What would each view predict for Round 4? Did that happen?"  
  - **1:35–1:45 (Labeling & Bridge):** Introduce "contextualism" and "pragmatic encroachment" as labels for what they described. End with your workplace story to bridge simulation to reality.  

  **Predictable Problems & Fixes**  
  - **Stakes Don’t Bite:** Students treat tokens as "fake."  
    - *Fix:* Start by letting them "spend" 2 tokens on a minor privilege (e.g., 5 min break) to establish value. In high stakes, remind: "Losing 10 tokens = losing next week’s topic choice."  
  - **Gaming the System:** e.g., Investigators always vote "Non-compliant" (truth) to win tokens.  
    - *Fix:* Make evidence ambiguous (truth not obvious). In trials, only 60% guessed correctly. If gaming persists, emphasize: "Act as if this is real."  
  - **Demand Characteristics:** Students guess the hypothesis and conform.  
    - *Fix:* Never use "knowledge" in instructions; say "confidence in correctness." Collect silent writings early. If patterns seem forced, ask: "Did anyone feel pressured to answer a certain way?" in debrief.  
  - **Time Overrun:** Rounds drag.  
    - *Fix:* Use a timer. Cut Outcome Phase to 3 min if needed (award tokens quickly).  
  - **Resentment:** High-stakes loss frustrates students.  
    - *Fix:* Normalize in debrief: "This felt intense because stakes matter. In real life, it’s jobs, not tokens." Ensure privileges are modest (no academic penalties).  

  **What the Activity Cannot Reproduce**  
  - **The Emotional Weight:** The simulation can’t replicate the dread of real high-stakes contexts (e.g., job loss). Students might *understand* the token loss but not *feel* the existential risk. You must narrate this:  
    > "In the simulation, tokens stood in for something deeper. When your colleague’s job hung in the balance, the same evidence suddenly felt flimsy—not because it changed, but because the stakes *infected* it. No token loss can mimic that. That’s why we need theory: to name what we lived."  
  - **Long-Term Evidence Curdling:** The activity shows immediate shifts, but not how stakes erode confidence over weeks (as in your investigation). Highlight this in debrief.  
  - **Attributor/Subject Asymmetry:** Real-life attributors often have power over subjects (e.g., your investigators held your fate). Here, roles are equalized. Note: "In life, the attributor’s stakes often include power—which magnifies the effect."  

  ---

  ### Final Activity Design  
  **Title:** The Compliance Committee  
  **Goal:** Experience how stakes alter confidence in decisions without new evidence.  
  **Time:** 90 minutes  
  **Participants:** 14 students (4 Investigators, 4 Reviewers, 6 Observers per round; rotate roles).  
  **Materials:**  
  - Evidence Sheets (1/student, identical).  
  - Role Sheets (4 versions: 1 per round’s stakes).  
  - Verdict/Attribution Cards (red/green for Investigators; "Knows"/"Does Not Know" for Reviewers).  
  - 100 tokens (e.g., poker chips), + privilege menu (e.g., "5 tokens = skip one reading").  
  - Timer.  

  **Procedure Summary:**  
  1. **Setup (10 min):** Introduce as "committee simulation." Distribute materials. Explain tokens/privileges.  
  2. **Rounds (60 min):** 4 rounds of Investigator → Reviewer → Outcome, varying stakes per Role Sheets.  
  3. **Silent Writing (5 min):** Individual reflections on certainty/uncertainty.  
  4. **Debrief (15 min):** Analyze patterns → distinguish attributor-driven vs. subject-driven shifts → assign labels.  
  5. **Bridge (5 min):** Connect to your workplace story + theories.  

  **Privilege Menu (Example):**  
  - 2 tokens: 5-min break during next seminar.  
  - 5 tokens: Skip one assigned reading.  
  - 10 tokens: Choose next week’s discussion topic.  
  *(Ensure all privileges are feasible and ethical.)*  

  **Role Sheet Example (Round 2: High Investigator/Low Reviewer Stakes):**  
  > **Investigator Role:** Decide if Professor Abel is compliant. If your verdict is *correct*, gain 2 tokens. If *incorrect*, lose 10 tokens.  
  > **Reviewer Role:** After seeing the Investigator’s verdict, decide: "Do they *know* their verdict is correct?" If your attribution is *correct*, gain 2 tokens. If *incorrect*, lose 2 tokens.  

  **Debrief Flow:**  
  - Plot attribution rates (% "Knows") and Investigator confidence per round.  
  - Ask: "When did Reviewers deny 'knowledge' most? Was it tied to their own stakes (Round 3) or the Investigator’s (Round 2)?"  
  - Student quotes from silent writing: "In Round 2, I wasn’t sure, but I had to decide—it was scary!" → "That’s pragmatic encroachment."  
  - End: "Both views predict drift with stakes, but they point to different engines: the attributor’s anxiety (contextualism) or the actor’s skin in the game (encroachment)."  

  **First-Run Advice:**  
  - Pilot the evidence sheet with a colleague; ambiguity is key.  
  - If stakes flop, pause and re-emphasize token value ("This is your chance to skip the Kant reading!").  
  - In debrief, if patterns are muddy, focus on outliers: "Who felt unsure in Round 2? Why?"  

  This design forces students to *live* the stakes shift, isolates the variables, and turns the seminar room into a lab. You’ll still need to voice the emotional reality—but now, they’ll have a shared reference point. Run it, then let them name the beast.
