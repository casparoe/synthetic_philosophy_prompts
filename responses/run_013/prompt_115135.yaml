  Okay, let me try to unpack this user's query. They're part of a reading group with grad students from different departments, and they've noticed a recurring issue. The problem involves beliefs that everything else rests on, but when pressed, the person can't justify them without circular reasoning. Yet, it's not just stubbornness or dogma—it's something deeper. The user mentions two examples: losing faith and a debate about mathematical foundations. 

  First, I need to figure out what exactly they're asking. They want to know if there's a name for this kind of belief and the transition when it changes. They also wonder if the beliefs are truly certain and how the shift happens without traditional argumentation. 

  The user’s description reminds me of concepts like presuppositions, hinge propositions, and paradigm shifts. Let me start with Wittgenstein's hinge propositions. These are beliefs that are foundational, not because they're proven, but because they're the framework for other inquiries. The person isn't certain about them; they're just operating within that framework. That fits the first part where the belief isn't doubted because doubting it would make the discussion impossible.

  Then there's Kuhn's paradigm shifts. When a scientific community changes its core assumptions, it's not through argument but through a crisis and a sudden shift. This seems similar to the transition the user describes—like an illness or conversion causing a change. The person can't reconstruct the argument because it's a gestalt switch, not a logical progression.

  The user also mentions that these beliefs aren't rock-bottom certain. That's where hinge propositions differ from traditional foundationalism. Hinges aren't indubitable truths; they're practical certainties that allow discourse to function. This aligns with the user's observation that giving up the belief would collapse the entire framework.

  For the transition, Kuhn's paradigm shift comes to mind. The shift happens through non-rational factors—personal experiences or crises. That explains why arguments don't work; it's about how the person sees the world, not logical steps. Michael Polanyi's tacit knowing and personal knowledge also fit here, emphasizing the role of personal commitment and intuition.

  Now, checking if these concepts cover both individual and community levels. Hinge propositions work for individuals, while Kuhn's paradigms apply to communities. The user asked if it's different when it's a group. Kuhn addresses communal shifts, but hinges can be both individual and shared, like cultural frameworks.

  The user might have deeper needs. They’re in an interdisciplinary group, so they might be seeking a framework to bridge disciplinary divides. Understanding these concepts could help facilitate discussions when such walls come up. They might also want strategies to navigate these transitions without confrontation, recognizing that some beliefs aren't arguable in the usual way.

  Are there other concepts? Foundationalism in epistemology might come up, but it usually seeks certain foundations, whereas the user’s examples aren't certain. Relativism isn't right because the beliefs are functional, not arbitrary. Conversion experiences in psychology or theology relate to the transition, but might not cover the belief's structure.

  So, naming the phenomenon: Foundational Framing Commitments (FFCs) for the beliefs and Gestalt Reorientation for the transition. This captures the idea that these are commitments holding the framework together, and the shift is a holistic change in perspective.

  In conclusion, the closest concepts are hinge propositions and paradigm shifts, with the transition being a gestalt switch. The user might need this to validate their group's experiences and find ways to discuss these deep disagreements productively.
answer: |-
  This phenomenon you're describing is both recognizable and philosophically rich. It touches on several established concepts, but no single term perfectly captures the entire dynamic you've outlined. Here's a breakdown of the nearest concepts, their fits and misfits, and a proposed synthesis:

  ### Part 1: The Belief ("Undoubtable-but-not-certain, circular if justified")
  1.  **Wittgenstein's "Hinge Propositions" (from *On Certainty*):**
      *   **Fit:** This is the strongest contender for the *belief* itself. Hinges are propositions that are not open to doubt within a particular "language-game" or framework of thought. They are the fixed points around which inquiry, justification, and doubt *turn*. Trying to justify them directly leads to circularity or regress because all justification *presupposes* them. Examples include "The world has existed for more than 5 minutes," "My name is N.N.," or "This is my hand." Giving them up wouldn't mean learning a new fact; it would mean collapsing the entire framework of meaning and action built upon them.
      *   **Misfit:** Traditional readings of Wittgenstein often emphasize hinges as *rock-bottom certainties* (like Moorean propositions: "Here is one hand"). Your examples (faith, mathematical foundation) feel more like *deeply held constitutive commitments* than perceptual certainties. They are *functional* certainties (you *must* act *as if* they are true to play the game), not necessarily psychological or epistemic certainties. The person *wouldn't* claim infallible knowledge, just that doubting it makes the whole endeavor incoherent. This aligns with Wittgenstein, but requires focusing on the functional, framework-sustaining role over any claim to indubitable truth.
  2.  **Presuppositions:**
      *   **Fit:** These are background assumptions necessary for a statement, question, or inquiry to make sense. Pressing "Why?" about a presupposition is often incoherent within the system that relies on it. Faith or a mathematical foundation can be seen as deep presuppositions.
      *   **Misfit:** Presuppositions are often more granular and context-dependent. The beliefs you describe feel more foundational and identity-constitutive than a typical linguistic presupposition. "Presupposition" doesn't strongly capture the *existential* weight or the *framework-collapsing* consequence of giving it up.
  3.  **Foundational Commitments / Constitutive Assumptions (Paradigm - Kuhn):**
      *   **Fit:** Within Thomas Kuhn's "paradigm" (for communities) or an individual's conceptual framework, there are core commitments that define what counts as a problem, evidence, or a solution. Questioning these feels like attacking the rules of the game itself. They are "constitutive" – they constitute the practice (religious life, mathematical work). Justification is internal to the paradigm/framework.
      *   **Misfit:** Kuhn focuses primarily on *scientific communities*, not individuals. While applicable to individual worldviews, "paradigm" feels overly structured for personal faith shifts. "Commitment" or "Constitutive Assumption" are good descriptors but aren't specific, named philosophical concepts like "hinge."

  **Synthesis for the Belief:** **Foundational Framing Commitments (FFCs)**. This emphasizes:
  *   **Foundational:** They underpin everything else.
  *   **Framing:** They define the boundaries, rules, and meaning within which thought and discussion occur.
  *   **Commitments:** They are actively held (not just passive assumptions), often tied to identity/practice, and involve an element of choice or trust, even if deeply ingrained. They are *functional* certainties, not *epistemic* certainties.

  ### Part 2: The Transition ("Non-argumentative, framework-collapsing shift")
  1.  **Kuhnian "Paradigm Shift" (Gestalt Switch):**
      *   **Fit:** This is the strongest contender for the *transition*. Shifts happen due to a buildup of "anomalies" causing crisis, followed by a sudden, non-linear, often non-rational "gestalt switch" where the world is seen differently. Arguments *within* the old paradigm are powerless. The new paradigm offers a fundamentally different framework with its own foundational commitments. The person genuinely cannot reconstruct the old viewpoint from within the new one ("incommensurability"). Illness or profound experiences can act as catalysts for crisis or reorientation.
      *   **Misfit:** Primarily designed for scientific *communities*. While applicable metaphorically to individuals, the social negotiation aspect is less prominent in your personal examples. The shift might feel less "scientific" and more existential.
  2.  **Conversion Experience (Psychology/Religious Studies):**
      *   **Fit:** Captures the sudden, transformative, often non-rational nature of the shift, especially in the faith example. Involves a complete reorientation of worldview and core commitments. Resistant to counter-argument beforehand.
      *   **Misfit:** Strongly associated with religion/spirituality. Doesn't naturally extend to shifts in mathematical or philosophical foundations. Can imply a specific trigger (e.g., divine intervention) not always present.
  3.  **Gestalt Switch / Seeing the Aspect Differently (Wittgenstein):**
      *   **Fit:** Wittgenstein used this to describe sudden changes in perception (e.g., seeing the duck-rabbit as a duck vs. a rabbit). Applied metaphorically to conceptual frameworks, it captures the sudden "flip" where the same data is organized differently, making the previous perspective inaccessible or nonsensical. The shift is not based on new evidence per se, but a reorganization of understanding.
      *   **Misfit:** The perceptual metaphor can feel less weighty than the existential collapse/reconstitution described.
  4.  **Polanyi's "Tacit Knowing" & "Personal Knowledge":**
      *   **Fit:** Polanyi argued that all knowledge rests on ultimately unjustifiable (in a strict sense) *tacit* commitments and personal indwelling within a framework. Shifting these involves a deep, personal reorganization of understanding that feels more like conversion than logical deduction. The "result that just lands" might involve tacit integration finally cohering in a new way.
      *   **Misfit:** Less focused on the specific *mechanism* of the sudden shift than Kuhn or the gestalt metaphor.

  **Synthesis for the Transition:** **Gestalt Reorientation.** This emphasizes:
  *   **Gestalt:** The sudden, holistic reorganization of understanding/perception.
  *   **Reorientation:** The fundamental shift in perspective and foundational commitments, rebuilding the framework itself.

  ### Are the Two Halves One Phenomenon?
  Yes, they are intrinsically linked aspects of the **same phenomenon**: **Deep Frameworks and their Transformations**.
  1.  **The Belief (FFC):** Defines and sustains a coherent framework for thought, action, and meaning.
  2.  **The Transition (Gestalt Reorientation):** Is the process by which that framework catastrophically fails and is replaced by a new one with different FFCs.

  Arguments operate *within* the framework defined by the FFCs. To challenge an FFC directly is to threaten the framework's existence. Therefore, the shift *must* be extra-logical – it involves a breakdown of the old framework (often triggered by experiences incompatible with it or eroding trust in it) and the emergence of a new gestalt where different propositions now function as the hinges. It's not learning *within* the system; it's changing the system itself.

  ### Individual vs. Community
  *   **Individual:** The phenomenon is deeply personal, tied to identity and meaning-making. The FFCs are constitutive of the individual's worldview. The transition is an existential reorientation. Wittgenstein's hinges and the personal gestalt/Polanyi aspects are most salient.
  *   **Community:** The phenomenon involves shared paradigms, collective constitutive assumptions, and social negotiation. Shifts involve persuasion, power dynamics, training new members, and institutional change. Kuhn's paradigm shifts are the primary model here. The transition is more protracted and involves communal crisis and realignment.
  *   **Relationship:** Communities instill shared FFCs in individuals. An individual's gestalt reorientation might precede, follow, or occur alongside a broader community shift. A crisis within a community can trigger individual reorientations. The core dynamic is analogous: framework-sustaining commitments and non-linear framework collapse/replacement.

  ### Conclusion & Naming

  *   **The Belief:** **Foundational Framing Commitment (FFC)** – An unjustifiable-in-isolation, functional certainty constitutive of a framework of thought or practice, the abandonment of which collapses that framework.
  *   **The Transition:** **Gestalt Reorientation** – A sudden, non-linear, non-argumentative shift in one's fundamental perspective, involving the collapse of an old framework (and its FFCs) and the adoption of a new one.
  *   **The Overall Phenomenon:** **Deep Framework Transformation.**

  **Edges:** This phenomenon applies to beliefs that are *constitutive* of a coherent system of meaning, action, or inquiry. It's distinct from:
  *   **Dogma:** Dogma is often asserted *as* certain truth and defended authoritatively. FFCs are often held tacitly and only recognized when challenged. Dogma *can* function as an FFC, but not all FFCs are dogmatic.
  *   **Bare Preference/Stubbornness:** Preferences lack the framework-sustaining function. Stubbornness lacks the existential weight and the inability to reconstruct the old view.
  *   **Standard Foundationalism:** FFCs are *not* claimed as indubitable truths providing epistemic justification; they are functional necessities for coherence within a specific frame.
  *   **Gradual Belief Revision:** This involves updating beliefs *within* a stable framework, not collapsing and replacing the framework itself.

  Your reading group is grappling with the limits of rational argument when confronting the deep, often invisible, frameworks that make argument possible in the first place. Recognizing FFCs and the nature of Gestalt Reorientation can foster more productive (and less frustrating) discussions by acknowledging that some disagreements stem from fundamentally different starting points that cannot be resolved by logic alone.
