prompt: |-
  I've somehow ended up on the grants panel for our local community trust, and I've spent about six months trying to work out what rule one of the other panel members is actually running. Her name's Rosie, she's been on it for years and sat through alot of these, she's got no philosophy background whatsoever, but she decides the same way every time and I can't put my finger on what the rule is. Next month there's a proposal coming up that I reckon might be the one that breaks it.

  Her form so far, as best I remember:

  - The tenants' association on the estate asked for £8k for a warm room and hot meals over the winter, about thirty households. She backed it on the spot, full whack, even though it was our biggest ask of the year and there was a cheaper bid that would have reached three times as many people.
  - The tennis club asked for two grand towards junior coaching. Voted down. She said she wasn't paying for the kids who've already got everything.
  - Somebody proposed moving £5k out of the estate's advice service and into the arts centre in town, which has far more users. Voted down.
  - The drama society, mostly retired and comfortable, wanted new lighting. Voted down, and the money went to the after-school club instead.
  - The youth club had two options: one that helped sixty-odd kids a bit, and one that helped eight kids a lot, the eight being the ones with least at home. She went for the sixty.

  Now the new one. The tennis club has had £2k a year off us towards their courts since forever, and there's a motion to stop it. If we stop it, the money just goes back into the reserve and sits there — nobody else gets it, and the courts are only ever used by families who are doing fine as it is. I'm fairly sure she'll vote to scrap it. My mate Dave says that just proves she's got it in for anyone with a nice car, but I don't buy that, and I don't think she's definately just anti-posh either.

  So: what's she going to do, and what's the rule she's really been running? Are there other rules that fit everything she's done just as well? If there are, tell me what each of them says about the tennis club money, which one you'd put your money on and why, and what we could put in front of her later that would settle it. And if her rule does turn out to say we're better off as a town with nobody on those courts, say so plainly, because that sounds mad to me. Plain English please, I'm not a philosopher, and British English — I can't be doing with "maximize" and "color".
reasoning: |-
  Hmm, the user is on a community trust grants panel and trying to figure out the decision-making rule of another panel member named Rosie. They've given me several examples of Rosie's past voting behavior and want me to predict how she'll vote on an upcoming proposal regarding tennis club funding. They also want me to identify the underlying rule Rosie follows, consider alternative rules that might fit, and explain everything in plain British English without philosophical jargon.

  Looking at Rosie's voting history:
  1. She approved £8k for a warm room and hot meals for a housing estate despite it being expensive and reaching fewer people than a cheaper alternative.
  2. She rejected £2k for junior tennis coaching, saying she wouldn't pay for kids who "already have everything."
  3. She opposed moving £5k from an estate advice service to an arts centre with more users.
  4. She rejected funding for a drama society's new lighting (mostly comfortable retirees) and supported an after-school club instead.
  5. For a youth club, she chose an option helping 60 kids moderately over helping 8 disadvantaged kids intensively.

  The upcoming decision is about stopping £2k annual funding for tennis courts used by families who are "doing fine," with the money returning to reserves instead of being reallocated.

  I need to figure out Rosie's consistent rule. Several ethical frameworks come to mind. Egalitarianism focuses on reducing inequality - that could explain why she prioritizes disadvantaged groups like the housing estate tenants while rejecting projects for the comfortable (tennis club, drama society). But it doesn't explain why she chose helping 60 kids moderately over 8 intensely disadvantaged kids - egalitarianism might prefer targeting the neediest.

  Prioritarianism gives extra weight to the worse off. That fits most cases: supporting the estate (likely disadvantaged), rejecting tennis/drama (advantaged), and supporting after-school clubs. But again, the youth club decision where she chose breadth (60 kids) over depth (8 neediest) contradicts strict prioritarianism.

  Sufficiency threshold theory is interesting - ensuring people meet a basic level of need. This explains supporting the warm room (basic warmth/food), advice service (basic legal/financial help), and after-school club (basic childcare). It rejects tennis coaching and drama lighting as non-essential. The youth club choice makes sense here - helping more kids reach a sufficient level trumps intensive help for fewer. The arts centre funding shift was rejected probably because the estate advice service meets basic needs while arts are enrichment.

  Alternative rules? Rawlsian maximin (help worst-off) fails on the youth club vote. Utilitarianism (greatest good for greatest number) fails on the warm room approval (smaller group over larger one). Anti-elitism explains rejections of tennis/drama but doesn't fit the youth club choice.

  For the tennis court funding: under sufficiency threshold, Rosie should vote to scrap it. Tennis courts are recreational, not essential. The money going to reserves (not helping anyone) is better than subsidizing non-essential activities for the comfortable. Even though it doesn't directly help the needy, it stops misallocating resources. This might seem counterintuitive but aligns with not funding non-essentials.

  To test this, we could propose funding something above the threshold vs. below. For example, repairing a community centre roof (essential) vs. buying new instruments for an orchestra (non-essential). Sufficiency theory should favor the roof.

  So Rosie's rule is likely: fund only what meets basic needs; reject anything beyond that, regardless of who benefits. For the tennis money, she'll vote to stop funding. The town might have unused courts, but she'd see that as better than misusing funds on non-essentials.
answer: |-
  Right, let's crack this. Based on Rosie's pattern, she's consistently applying a **"Sufficiency Threshold" rule**. It's not about *maximising* anything (total people helped, equality, posh-bashing) or *only* helping the very poorest. It's about **whether the funding helps people meet a basic, essential level of need, or whether it's just a 'nice-to-have' for those already above that line.**

  Here's how it fits her votes:

  1.  **Warm Room & Hot Meals (£8k, 30 households):** **Backed.** This is clearly about meeting *basic needs* (warmth, food) for people assumed to be struggling (estate tenants). It hits the sufficiency threshold - they *need* this. The cheaper bid helping more people likely wasn't tackling such a fundamental lack.
  2.  **Junior Tennis Coaching (£2k):** **Voted down.** Tennis coaching is a recreational activity, a 'nice-to-have'. Her comment ("kids who've already got everything") confirms she sees the beneficiaries as *already above* the sufficiency threshold. They don't *need* subsidised coaching.
  3.  **Moving £5k from Estate Advice to Arts Centre:** **Voted down.** The estate advice service (likely offering benefits, housing, debt help) provides *essential support* for people potentially *below* the sufficiency threshold. The arts centre, while having more users, provides cultural enrichment – a 'nice-to-have' for those likely *above* the threshold. Funding the essential service trumps funding the non-essential one, even for fewer people.
  4.  **Drama Society Lighting vs After-School Club:** **Voted down Drama, backed After-School Club.** Lighting for a hobby group (comfortable retirees) is a clear 'nice-to-have'. An after-school club provides essential childcare and support, helping working families meet a basic need (safe, supervised care for kids). It hits the threshold.
  5.  **Youth Club: 60 kids moderately vs 8 kids intensely:** **Chose the 60.** This is the key one that rules out simple "help the very poorest". Helping 60 kids *a bit* likely means lifting more kids *towards* or just *above* a basic sufficiency level (e.g., safe space, some activities, basic support). Helping 8 *a lot* might take them further *above* that threshold (more intensive therapy, expensive trips etc.), which isn't the priority. The goal is getting *more* people *to* sufficiency, not taking the neediest *further beyond* it.

  **The Rule: Fund projects that help individuals or communities meet a basic, essential level of need (sufficiency threshold). Reject projects that only provide benefits for those already comfortably above that threshold, regardless of the number of people or perceived 'fairness' of redistribution.**

  **The Tennis Club Funding Decision (£2k annual grant):**
  *   **What Sufficiency Threshold Says:** **She'll vote to scrap it.**
  *   **Why?** The courts are only used by families "doing fine". Maintaining tennis courts is a recreational 'nice-to-have'. It does nothing to help anyone meet a basic need. It's subsidising a leisure activity for the comfortable. The fact the money goes back into reserve doesn't change this – funding this non-essential activity is actively *against* her rule. Not funding it is better than misallocating funds, even if the reserve isn't used immediately. *It stops wasting money on something that doesn't meet the threshold.*

  **Does her rule mean the town is "better off with nobody on those courts"?**
  *   **Basically, yes, according to her logic.** Her priority isn't overall community enjoyment or facility usage. It's strictly about directing funds *only* to meet essential needs. If the tennis courts can't be used to meet a basic need (e.g., repurposed for essential community activities, opened free to disadvantaged groups in a way that meets a need), then under her rule, the town *is* better off with that £2k *not* being spent on them, even if it means they fall into disrepair and aren't used. The money isn't actively helping meet needs *now*, but it preserves the *potential* to meet needs in the future, which is better than actively spending it on something non-essential. **It sounds mad if you value community facilities broadly, but it's consistent with her laser-focus on essential needs.**

  **Alternative Rules & How They Fit (and what they say about Tennis):**

  1.  **Prioritarianism (Favour the Worst-Off):**
      *   **Fits:** Warm room (very needy), Tennis coaching rejected (better-off), Advice service kept (serves needy), Drama rejected/After-school backed (needy kids vs comfy retirees).
      *   **Fails:** The Youth Club vote. A strict prioritarian *should* favour helping the 8 neediest kids intensely. Rosie chose the 60 moderate help.
      *   **Tennis Money:** **Scrap it.** It benefits the better-off.
      *   **Verdict:** Plausible, but the Youth Club vote is a strong counter-example. Less likely than Sufficiency Threshold.

  2.  **Anti-Subsidy for the Comfortable (Dave's "Nice Car" Theory):**
      *   **Fits:** Tennis coaching rejected (posh?), Drama rejected (comfortable), possibly Tennis courts.
      *   **Fails:** Warm Room (not anti-posh, just pro-need). The Youth Club vote – helping 60 moderately isn't inherently anti-posh. The Arts Centre shift rejection – she kept money with the (likely poorer) estate, not because she hates the arts centre users, but because the estate service was essential.
      *   **Tennis Money:** **Scrap it.** It subsidises the comfortable.
      *   **Verdict:** Captures elements, but too simplistic and doesn't explain the *positive* choices for essential services or the Youth Club logic. Likely a *symptom* of her rule, not the rule itself.

  3.  **Localism/Estate Focus:**
      *   **Fits:** Backed Warm Room (estate), Rejected moving money *out* of estate advice service.
      *   **Fails:** Rejected Tennis coaching (could be local?), Backed After-School Club (likely town-wide, not estate-specific? Depends). Youth Club choice (no inherent estate link). Doesn't explain *why* she backed the estate projects – was it location or *need*? Her comments suggest need.
      *   **Tennis Money:** **Unclear.** If the club is local, maybe keep? If not, scrap? Her past suggests need trumps location.
      *   **Verdict:** Possible factor, but insufficient alone. Need is the stronger driver.

  **What I'd Put My Money On & Why:**
  *   **Sufficiency Threshold.** It's the only one that cleanly explains *every* vote, especially the crucial Youth Club decision. The others stumble on that one. It explains her focus on essentials (warmth, food, advice, childcare) and rejection of non-essentials (coaching, arts *instead* of advice, drama lighting, tennis courts). The "already got everything" and implicit understanding of what's truly *needed* in the other votes all point to this.

  **How to Settle It Later (The Test Case):**
  Propose two hypothetical grants next panel meeting:

  1.  **Option A:** £3,000 to provide basic cooking facilities and weekly cooking classes at the community centre in the *less* deprived part of town, targeting isolated elderly people living *just* above pension credit level, struggling to cook nutritious meals.
  2.  **Option B:** £3,000 to provide advanced pottery equipment and masterclasses at the arts centre for experienced hobbyists.

  **What Sufficiency Threshold Predicts:**
  *   **Back Option A.** It addresses a *basic need* (nutrition, combating isolation linked to health) for people likely hovering *around* the sufficiency threshold.
  *   **Reject Option B.** It's a 'nice-to-have' skill development for hobbyists assumed to be comfortably *above* the threshold.

  If she backs A and rejects B, it strongly confirms Sufficiency Threshold. If she rejects A because the elderly aren't "poor enough" or backs B because it helps "many enthusiasts", it points towards Prioritarianism or something else. But based on her history, A is exactly what she'd fund – meeting a fundamental need for those not securely above the line. Good luck with the panel!
