prompt: |-
  For the past year I have been running a small reading group on statutory interpretation, jointly with a colleague from the philosophy department, and next term the faculty has given us enough money to turn it into a two-day workshop with about eight invited papers. The theme I have settled on is the dispute between textualists and purposivists, but I want the workshop to be built around the live conceptual questions underneath that dispute rather than around the well-rehearsed cases that everyone already has views about. Which open questions in this area should I put on the programme, and in what order? I care far more about the defence of the ranking than about the list itself: for each question, I want to know why it is upstream of the others, how tractable it is for people whose training is in the philosophy of language and in social choice rather than in doctrinal legal scholarship, what the trade-offs are between importance and tractability in your ordering, and what would have to happen over the next two or three years for a question to move up or down. I would also like to be told which currently fashionable questions I should leave off the programme altogether, and what the workshop would lose by doing so.

  Two candidate threads have been occupying us, partly because they make the discussion less familiar than it otherwise would be. The first is whether the ordinary-meaning standard can be given empirical content by corpus methods, and what it would mean for a court's reading of a statute to be shown to be statistically atypical for otherwise competent speakers of the language; it is not obvious to me whether this sharpens the textualist case or simply relocates the dispute into questions about which corpus and which speakers count. The second is whether purposivism inherits an aggregation problem, on the thought that a multi-member legislature need not have anything resembling a single preference ordering, so that a statute's purpose may be indeterminate in much the way a group's preference is, and it is unclear whether that tells against purposivism or merely shows that both theories owe us an account of which intentions or purposes are the ones that count. Feel free to tell me that one or both of these are red herrings, or that they are really the same question wearing two hats, and to substitute better candidates; but if you drop them, say what they were missing, since I would rather find that out now than in the second session.
reasoning: |-
  Okay, let me start by unpacking the user's query. They're organizing a workshop on textualism vs. purposivism in statutory interpretation and want to focus on live conceptual questions rather than rehashing well-known cases. They mentioned two candidate threads: using corpus methods for ordinary meaning and the aggregation problem for legislative intent. The user is in law but collaborating with philosophy, especially philosophy of language and social choice theorists. Their main request is for a prioritized list of questions with a strong defense of the ranking, considering factors like upstream importance, tractability for non-doctrinal scholars, trade-offs, and how questions might shift in relevance over time.

  First, I need to identify the core conflicts between textualism and purposivism. Textualism focuses on the text's ordinary meaning, while purposivism looks at the legislature's purpose. But underneath, there are deeper philosophical issues. The user wants to avoid familiar debates, so I should dig into the foundational assumptions that aren't often addressed in legal doctrine.

  The user's two threads are interesting. The corpus methods question ties into how we determine meaning empirically. The aggregation problem questions whether a collective body can have a unified purpose. I need to assess if these are central or distractions. Corpus linguistics might seem like a tool for textualism, but it raises issues about whose language counts and the authority of courts versus empirical data. The aggregation problem is fundamental to purposivism but might also affect textualism if the text is a product of a group without a unified intent.

  Now, considering the disciplines involved—philosophy of language and social choice—the workshop should leverage their expertise. Questions about meaning determination, reference, and the semantics-pragmatics divide are ripe for philosophy of language. Social choice theory can address collective intent and preference aggregation. So, the topics should align with these strengths.

  Prioritizing questions requires identifying which issues are upstream. Upstream questions are foundational; resolving them could clarify downstream problems. For example, before discussing how to find ordinary meaning (corpus methods), we need to understand what meaning is in this context. Similarly, the aggregation problem is central to whether purposivism is even coherent.

  Tractability is key. The participants aren't legal scholars, so questions should be approachable without deep doctrinal knowledge. Philosophy of language experts can handle semantic theories, while social choice theorists can tackle aggregation. Questions about judicial role might be too legal and less tractable for non-lawyers.

  Trade-offs between importance and tractability: The most important questions might be broad, like the nature of legislative intent, but could be intractable. Starting with slightly narrower but still foundational issues, like collective intent vs. textual authority, balances both. Corpus methods are specific but might be too narrow if not linked to larger philosophical issues.

  Future shifts: If there's progress in social choice on aggregating fragmented preferences, the aggregation problem might become more tractable. Advances in philosophy of language on context could affect corpus methods' relevance. Also, empirical studies on legislative processes might impact assumptions about intent.

  Fashionable but excluded topics: Originalism debates, canons of construction, and judicial pragmatism. Originalism is constitutional, not statutory. Canons are doctrinal tools. Judicial pragmatism shifts focus to policy, which isn't the workshop's aim. Excluding these keeps the focus on core conceptual issues.

  The user's candidate threads: Corpus methods are downstream; they depend on prior conceptual clarity about meaning. The aggregation problem is upstream and crucial for purposivism's coherence. So, the aggregation question should be higher, while corpus methods fit later as an application.

  Structure: Start with the most upstream questions—collective intent and textual authority. Then move to meaning and interpretation, then aggregation, followed by application issues like corpus methods. End with judicial role to tie back to practical implications.

  I should ensure that the order builds logically. Question 1 addresses the fundamental conflict. Question 2 delves into meaning, necessary for both theories. Question 3 tackles aggregation, which is essential for purposivism. Question 4 applies meaning determination. Question 5 connects to judicial legitimacy. This flow allows each topic to build on the previous.

  Finally, emphasizing why certain exclusions are necessary: Avoiding constitutional originalism keeps the focus statutory. Skipping canons prevents doctrinal distractions. Judicial pragmatism is outside the scope. This ensures the workshop remains conceptually focused, leveraging the interdisciplinary strengths of the participants.
answer: |-
  Here’s a structured framework for your workshop, prioritizing live conceptual questions based on their upstream significance, tractability for philosophers of language and social choice theorists, and capacity to reframe the textualism-purposivism debate. I’ll defend the ranking rigorously, address your candidate threads, and identify exclusions.

  ### **Core Ranking & Justification**  
  *(Prioritized by conceptual "upstreamness" and interdisciplinary tractability)*  

  1. **What is the ontological status of "legislative intent"?**  
     - **Why upstream?** This anchors the entire debate. If legislative intent is incoherent (e.g., due to Arrow’s impossibility theorem or discursive dilemmas), purposivism collapses unless it adopts a fictionalist or textual-proxy approach. Textualism’s rejection of intent relies on this critique.  
     - **Tractability:** Perfect for social choice theorists (aggregation pathologies) and philosophers (collective intentionality, Searle vs. Bratman). Avoids legal doctrine entirely.  
     - **Trade-off:** Highest importance but moderately tractable—requires mapping philosophical/social choice concepts to legal practice.  
     - **Future shift:** Downstream if consensus emerges that intent is *necessarily* fictional; upstream if new models of group agency gain traction.  
     - **Your candidate thread:** Directly engages your "aggregation problem" (this *must* be Q1).  

  2. **Is statutory meaning determined by semantic conventions or communicative actions?**  
     - **Why upstream?** Textualism assumes semantic meaning is prior to purpose; purposivism subordinates semantics to pragmatic goals. Philosophers of language (e.g., Griceans vs. semantic minimalists) can dissect whether "ordinary meaning" exists independently of speaker goals.  
     - **Tractability:** Ideal for philosophers of language (grounded in reference, context, and implicature). Uses statutes as linguistic case studies.  
     - **Trade-off:** Critical and highly tractable—minimal legal knowledge needed.  
     - **Future shift:** Upstream if corpus linguistics (your other thread) reveals systematic gaps in semantic conventions.  

  3. **Can textualism/purposivism avoid relying on "purpose" when resolving ambiguity?**  
     - **Why upstream?** Even textualists use purpose to disambiguate (e.g., *holy trinity* escape hatches). Purposivists need non-arbitrary purpose-selection. Exposes both theories’ covert dependencies.  
     - **Tractability:** Social choice theorists can model purpose-selection as a preference-aggregation problem. Philosophers can analyze whether disambiguation requires intentionalism.  
     - **Trade-off:** High importance; tractability hinges on Q1/Q2 foundations.  
     - **Future shift:** Downstream if Q1/Q2 resolve core issues.  

  4. **How do corpus methods redefine "ordinary meaning"—and do they undermine judicial authority?**  
     - **Why here?** Builds on Q2. Corpus tools operationalize semantic conventions but force confrontations: Which corpus (e.g., lay vs. technical)? Can frequency data override judicial intuition? Relocates but doesn’t resolve the dispute.  
     - **Tractability:** Empirical and conceptual—philosophers of language can critique "meaning as usage," while social choice theorists assess representativeness.  
     - **Trade-off:** Important but narrower; risks technical digressions. Keep it here to apply prior foundations.  
     - **Your candidate thread:** Sharpens textualism *if* meaning is conventional, but corpus choice reintroduces purpose (e.g., "which speakers matter?" = purposive filter).  

  5. **What theory of judicial role justifies privileging text vs. purpose?**  
     - **Why downstream?** Role-based arguments (e.g., textualism’s rule-of-law vs. purposivism’s fidelity) depend on answers to Q1–Q4.  
     - **Tractability:** Less suited to non-lawyers; more normative/constitutional. Handle briefly as a capstone.  

  ---

  ### **Exclusions: Fashionable but Off-Programme**  
  1. **"Originalism vs. Living Constitutionalism" spillovers:**  
     - **Why exclude?** Constitutional interpretation imports distinct problems (amendability, founding-era context). Dilutes the statutory focus.  
     - **Loss:** None—avoids a well-trodden distraction.  

  2. **Canons of Construction (e.g., *ejusdem generis*):**  
     - **Why exclude?** Doctrinal tools, not conceptual questions. Philosophers/language experts gain little from parsing *expressio unius*.  
     - **Loss:** Marginal—canons are symptoms, not causes, of underlying disputes.  

  3. **Judicial pragmatism as a "third way":**  
     - **Why exclude?** Often policy-driven, not conceptually distinct. Fails to engage core text/purpose metaphysics.  
     - **Loss:** Avoids diluting the central dichotomy.  

  ---

  ### **Defending the Ranking**  
  - **Logical Flow:** Q1 (intent’s possibility) → Q2 (meaning’s nature) → Q3 (theories’ coherence) → Q4 (applied meaning) → Q5 (institutional implications). Each step preconditions the next.  
  - **Interdisciplinary Synergy:**  
    - Social choice dominates Q1/Q3 (aggregation/indeterminacy).  
    - Philosophy of language dominates Q2/Q4 (semantics/pragmatics).  
    - Both engage Q3’s hybrid challenges.  
  - **Trade-offs Managed:** Starts with highly tractable, foundational questions (Q1–Q2) before applied issues (Q4). Avoids overloading non-lawyers with institutional concerns (Q5).  
  - **Candidate Threads:**  
    - **Aggregation (Q1):** Upstream and indispensable. Shows purposivism’s vulnerability *and* textualism’s parallel problem (if text reflects aggregated compromises).  
    - **Corpus Methods (Q4):** Downstream application. If included prematurely, it devolves into methodology debates. Positioned to test Q2’s conclusions.  

  ### **What Would Change the Ranking?**  
  - **Q1 moving down:** Breakthroughs in group agency theory (e.g., if List/Pettit models gain universal acceptance).  
  - **Q4 moving up:** Widespread judicial adoption of corpus tools forcing conceptual clarity on "meaning."  
  - **Q3 moving up:** If textualists concede purpose is unavoidable (or vice versa), making coherence the central crisis.  

  This structure forces participants to confront the *grounds* of their disagreements—not just their conclusions—while leveraging non-legal expertise. The aggregation thread is essential; corpus methods are useful but secondary.
