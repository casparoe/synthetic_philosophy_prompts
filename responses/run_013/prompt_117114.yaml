prompt: |-
  I was appointed in March to the independent values and alignment review board of a publicly funded foundation that builds AI tools for public benefit, and the first substantive decision to land on my desk is also the one we have deferred three times. Our flagship deployment — a decision-support assistant that residents use to navigate the provincial disability-benefits system — goes live in eleven weeks, and we must settle, in a written opinion I am to circulate before Thursday's meeting, whose values the assistant should serve. I did not come to this cold: I spent four years as a benefits caseworker before I was appointed, and I have sat on the other side of this desk.

  Some background, since you will need it. The assistant does not merely answer questions. It helps users work through consequential choices: whether to appeal a denial, whether to attempt a return to part-time work, how to divide a fixed benefit between housing and care. Any such tool ranks some goods above others, and our engineers have already built a working prototype around an adjustable value vector — a set of weighted dimensions (self-reliance, security, family obligation, personal autonomy, and others) that can be tuned. The question before us is how those weights should be set, and by whom.

  The board has split four ways. One group holds that a public instrument must be neutral among citizens' conceptions of the good life, and that any weighting it adopts is a covert endorsement of one. A second group replies that neutrality is a fiction: a model that presents options without ranking them has already ranked them in what it treats as salient, and a benefits tool has an affirmative obligation to advance some substantive good — harm reduction, or capability, or something else. A third group proposes radical personalization: let each user set the weights, so that no one's values are imposed on anyone. A fourth proposes aggregation: derive the weights from a representative survey of the population and let majority priorities govern, subject to minority protections. Our counsel has warned that whatever we choose will be cited in the litigation that is already threatened.

  Three facts bear on the choice, and I would like you to take them seriously rather than around. First, the prototype ships with default weights set by the engineering team, which privilege autonomy and self-reliance, and in our usability trials the large majority of users never adjust a default. Second, a substantial share of the intended users — those with cognitive disabilities, and minors — cannot set weights for themselves, and a surrogate must do it, whose interests are not always the user's. Third, the board itself is not neutral: we were appointed by the funder, and two of our members are drawn from the disability community while one represents the funder's financial interest.

  Draft the opinion. Recommend a concrete course of action — a stance on the weights, a mechanism for setting and revising them, and a time frame keyed to the eleven-week launch — and give the reasoning that would let a dissenting member see exactly what they are being asked to accept. Treat the strongest consideration on the losing side honestly, rather than as a concession in passing. And say plainly what we should count, a year from now, as evidence that we chose wrongly.
reasoning: |-
  Hmm, this is a complex ethical and operational challenge. The user is a board member of an AI ethics review board facing a tight deadline to resolve a values-alignment dilemma for a disability-benefits AI assistant. They need a formal opinion draft addressing four factions, three critical constraints, and real-world implementation pressures.

  The core tension revolves around whose conception of "good life" should guide an AI that makes consequential recommendations - a problem intensified by non-neutral defaults, vulnerable users who can't set preferences, and the board's own non-neutral composition. The user's professional background as a former caseworker suggests they'll value practical implementation concerns alongside philosophical rigor.

  Key considerations emerging:
  - The "neutrality is impossible" argument feels strongest given how interface design inherently prioritizes certain options. Even presenting "all choices equally" is a value judgment.
  - Default settings have outsized influence (backed by usability trial data), making their initial configuration ethically significant.
  - The surrogate problem for cognitively disabled/minor users creates principal-agent risks that can't be solved by personalization alone.
  - Aggregated surveys risk tyrannizing minority preferences in disability contexts where needs aren't evenly distributed.

  The proposed solution should probably reject both strict neutrality and pure personalization as unworkable. A hybrid approach seems necessary: default weights derived from participatory design with the disability community, combined with adjustable personal settings and mandatory surrogate guidelines. The 11-week deadline demands something implementable - perhaps a phased rollout starting with high-consensus defaults while building longitudinal feedback mechanisms.

  For accountability, the user specifically requested measurable failure criteria. This suggests monitoring for disproportionate negative outcomes across disability subtypes and appeal rates that deviate from historical norms. The threatened litigation makes documentation of due diligence critical - hence the emphasis on recording dissent and review triggers.

  The board's non-neutral composition must be transparently addressed rather than hidden. One ethical approach is to explicitly frame the recommendation as a provisional best-effort compromise, with built-in revision checkpoints to correct course as real-world impact data emerges.
answer: |-
  ## Independent Values & Alignment Review Board: Opinion on Benefit Assistant Value Weights

  **Date:** October 26, 2023  
  **To:** Board Members  
  **From:** [Your Name], Member  
  **Subject:** Recommendation: Value Weight Framework for Disability Benefits Assistant  
  **Launch Deadline:** January 15, 2024 (11 weeks)

  ---

  ### I. Core Recommendation
  **Adopt a modified aggregation approach with participatory safeguards:**  
  1.  **Initial Weights:** Derived from a statistically representative survey *of disability benefit recipients and their primary caregivers* (not the general population).  
  2.  **Default Setting:** Survey-derived weights serve as the *initial default*.  
  3.  **Personalization:** Users (or authorized surrogates) retain full ability to *adjust all weights* easily and intuitively.  
  4.  **Surrogate Protocol:** Mandatory, plain-language guidance for surrogates emphasizing the *user's* values and wellbeing, developed with disability advocates.  
  5.  **Review Mechanism:** Establish a standing User Values Panel (UVP), comprising diverse benefit recipients, caregivers, and ethicists, to review anonymized interaction data and survey results annually, recommending weight adjustments to the Board.  
  6.  **Immediate Action (Next 11 Weeks):**  
      *   Week 1-3: Commission urgent, targeted survey of provincial disability recipients/caregivers (leverage existing networks: advocacy groups, support orgs).  
      *   Week 4-5: Analyze survey; set provisional default weights; draft surrogate guidance with Disability Advisory Council.  
      *   Week 6-8: Integrate weights & guidance into prototype; brief test with user groups (including cognitive disability/minors cohorts).  
      *   Week 9-10: Final Board ratification of defaults & guidance; legal/ethics review.  
      *   Week 11: Deployment with clear labeling: "Defaults based on community input – adjust to fit your priorities."

  ---

  ### II. Reasoning: Addressing the Board's Positions & Core Facts
  We reject pure neutrality and pure personalization as unworkable, while finding unmodified aggregation and imposed substantive goods ethically problematic under the constraints. Our hybrid approach balances legitimacy, agency, and protection.

  1.  **Against Strict Neutrality:** A tool presenting options without *any* implicit ranking or structure is unusable for consequential choices. Interface design, option ordering, and salience inevitably embed values. Neutrality is unattainable; the question is *whose* values and *how transparently* they are embedded. *Our approach acknowledges this by sourcing defaults transparently from the affected community.*

  2.  **Against Imposed Substantive Goods:** While the tool *must* promote wellbeing, defining a single substantive good (e.g., harm reduction, capability) risks paternalism and misalignment with diverse lived experiences of disability. The funder or board imposing its definition violates the "public benefit" mandate. *Our approach defers the substantive definition of "good" primarily to the user community via the survey and UVP, while ensuring user/personal surrogate control.*

  3.  **For Modified (Not Radical) Personalization:** Personalization is essential for agency, but the **facts compel limits**:  
      *   **Default Power:** Most users won't adjust defaults. Therefore, defaults *must* be set responsibly and representatively – pure personalization ignores this power dynamic.  
      *   **Surrogate Challenge:** Personalization fails for users needing surrogates. Unfettered surrogate choice risks misalignment. *Our approach:* Mandates personalization *capability* but combats default bias via community-derived defaults and provides *binding guidance* for surrogates to focus on the *user's* likely values/needs, not their own.

  4.  **Against Simple Aggregation:** Deriving weights from the *general* population prioritizes majority views that may misunderstand or undervalue minority (disability) experiences and needs. This risks perpetuating societal biases against disabled individuals. *Our modification:* Aggregates *specifically from the disability community*, ensuring the default reflects the lived reality of the users.

  5.  **Addressing Board Non-Neutrality:** Our process mitigates this:  
      *   **Survey Source:** Removes Board/funder from *defining* the initial defaults.  
      *   **UVP:** Creates an independent, user-centric body for ongoing review.  
      *   **Transparency:** Explicitly documenting the source of defaults (survey) and establishing the UVP provides accountability outside the Board's initial appointment.

  ---

  ### III. Honest Engagement with the Strongest Losing Consideration
  **The strongest argument against this approach comes from the "Imposed Substantive Good" position:** They argue that by relying on aggregation (even within the disability community), we still evade our affirmative duty to define and promote a specific, justified conception of the good (e.g., maximizing autonomy-as-non-interference, or capability enhancement). They contend that:
  *   Community surveys capture *preferences*, not necessarily *sound ethical reasoning*.
  *   Majority views within the disability community might still internalize harmful societal biases (e.g., undervaluing the needs of those with profound cognitive disabilities).
  *   We abrogate our ethical responsibility by outsourcing this fundamental question to a survey and a future panel.

  **What Dissenters Are Asked to Accept:** You are asked to accept that:
  1.  **Procedural Legitimacy** (grounding defaults in the affected community's expressed priorities) is a more appropriate foundation for a *public* tool than the Board's *own* substantive ethical theory, given the Board's non-neutral origins.
  2.  **Protection against internalized bias** is addressed by: (a) focusing the survey on recipients/caregivers (not general public), (b) the UVP's mandate to specifically monitor minority impacts, and (c) the critical *safeguard of personal/surrogate override*.
  3.  The **affirmative obligation** is met by ensuring the tool *enables* users to pursue *their own* conception of the good (via personalization/surrogates guided towards the user's benefit) and by using community-derived defaults designed to *support* users in navigating the system effectively towards wellbeing *as they define it* through their aggregated preferences, not as we define it abstractly.

  ---

  ### IV. Measuring Success: Signs We Chose Wrongly (One Year Later)
  Monitor these metrics rigorously:

  1.  **User Agency & Satisfaction:**  
      *   **Negative Sign:** Low rates of weight adjustment *combined* with qualitative feedback indicating users feel pressured or steered towards options misaligned with their values by the defaults. High user frustration with perceived lack of control.
      *   **Negative Sign:** Surrogates report confusion with the guidance or systemic conflicts of interest impacting user outcomes. Evidence of surrogates consistently overriding user-expressed preferences where possible.

  2.  **Representation & Equity:**  
      *   **Negative Sign:** Data shows significant disparities in outcomes (e.g., denial rates, appeal success, reported wellbeing changes) *correlated with specific disability types* (especially cognitive disabilities) or demographic groups, *where the default weights are identified as a contributing factor* by the UVP or audit.
      *   **Negative Sign:** The UVP or audit finds the initial survey or annual reviews systematically underrepresented or marginalized key sub-groups within the disability community.

  3.  **Systemic Impact:**  
      *   **Negative Sign:** The tool demonstrably reinforces existing negative biases or barriers within the benefits system (e.g., makes accessing necessary support harder for complex cases, steers users away from rightful appeals) due to default weightings.
      *   **Negative Sign:** The UVP process is ineffective, ignored by the Board, or fails to generate actionable, evidence-based recommendations for weight revisions.

  4.  **Legal & Trust:**  
      *   **Negative Sign:** Litigation succeeds on grounds that the default setting process was arbitrary, non-representative, or imposed values causing demonstrable harm, *or* that the surrogate guidance was inadequate leading to violations of user rights.
      *   **Negative Sign:** Significant erosion of trust in the tool or the Foundation from major disability advocacy organizations.

  ---

  This approach navigates the tensions pragmatically. It grounds defaults in the community's voice, preserves individual agency where possible, institutes robust protections for the vulnerable, creates a mechanism for ongoing adaptation, and provides clear metrics for accountability. It accepts the impossibility of neutrality while resisting the imposition of a single substantive good by the Board. It leverages aggregation but confines it to the relevant community and tempers it with safeguards. It meets the 11-week deadline with a responsible, implementable plan. I urge the Board's support.
