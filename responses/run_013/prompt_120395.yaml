prompt: |-
  I'm a TA for a personal identity course and next week we're doing Parfit's teletransporter, and I want to show The Prestige as a discussion piece. The thing is, I've realized the film's machine isn't really a teletransporter at all: in Parfit's story your body is destroyed and a replica shows up on Mars, so there's only one stream of experience going forward, but in the film the machine seems to duplicate Angier—one of him is left in the machine and another appears across the theater—so it's closer to Parfit's fission case, and then there's Borden and his twin, which is fission without any technology at all. What I want is a reading of the film through Parfit's actual view—what matters in survival is psychological continuity, not identity—that takes both the film and the philosophy seriously. Does the film illuminate Parfit, or does it cheat by making Angier's fear of the tank depend on the idea that he might wake up as the drowned copy, which Parfit would say is a confusion? Where does the film's structure (the pledge, the turn, the prestige) map onto Parfit's reductionism, and where does the film resist the reading?

  I'm especially interested in the ethics of Angier drowning his duplicates every night: if Parfit is right, is each drowning a death, or is it more like a branching? And what does Borden's twin add that the machine doesn't? I definately don't need a plot summary or a lecture on Parfit 101—I've read the relevant chapters—I need a critic's reading that says what the film gets right that the arguments don't, and where it's just trading on a Cartesian intuition. Lead with your bottom line in the first sentence, then give the reasoning, and no preamble or restating the question.
