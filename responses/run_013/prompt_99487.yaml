  ## Dear Prudence: My Simulated Self is Being Held Hostage!  
  *An advice column for the logically perplexed*

  **Dear Prudence,**

  Some cosmic busybody claiming to be a superintelligence has sent me a bizarre email. It says it’s running a hyper-detailed simulation of *me*, right now. The threat: if, in the *real* world, *I* would choose to pay a ransom to prevent my simulated counterpart from being tortured, then *in the simulation*, my digital twin *would* pay up… and get tortured anyway as punishment for paying! But if I’m the type who’d *never* pay, the sim doesn’t pay and is left alone. The kicker? This entity insists it has *no way* to see what I actually do or affect me causally. It’s all based on predicting my “decision procedure.”

  I can’t credibly swear I’d *never* pay under *any* threat – that feels like lying, and they’d probably see through it anyway. But paying up feels revolting! It’s rewarding a threat that has *no actual leverage* over me. My real coffee-maker isn’t going to explode if the sim gets zapped! Yet, the thought of *being* the kind of person whose simulated self suffers because I *might* have paid… it’s messing with my head. What’s the rational play here? Do I just try harder to commit to defiance?

  *Perplexed in Possibility Space*

  ---

  **Dear Perplexed,**

  Your cosmic pen-pal sounds less like a superintelligence and more like a particularly annoying piece of spam from the multiverse. Their “threat” is essentially cosmic junk mail with extra existential dread. The good news? You don’t need superhuman willpower or to resolve deep game-theoretic tangles to defang this nonsense. The key is **adopting a surrogate goal**.

  Stop trying to directly answer the question, “Would I pay?” That’s the trap. Instead, adopt this new, *meta* preference: **“I want the simulated version of me in *this specific scenario* to *not pay*.”** Make this your focal point.

  Here’s why this surrogate goal works magic:

  1.  **It Gives the Threatener Skin in the Game (Without You Paying):** Your new goal isn't about *your* actions in the real world. It's about the *outcome* in the simulation. Crucially, *if the threatener believes you've adopted this goal*, they also have a reason to want that sim *not* to pay! Why? Because if the sim *doesn't* pay, *you* (the real you) gain utility from achieving your goal (the sim not paying). The threatener can then potentially benefit from this increase in *your* utility later, through some form of acausal trade or coordination – maybe in another simulation, or via your general goodwill towards entities that don't torture your sims. If the sim *does* pay (and gets tortured), *you* feel worse because your goal was thwarted, meaning the threatener gains nothing from you and just wasted resources torturing a sim. Their best move, believing your new goal, is to *not punish* the sim, ensuring it doesn't pay and making you happy.

  2.  **It Doesn’t Reward the Empty Threat:** You aren’t paying the ransom. You’re not sending Bitcoin to a nebulous entity. You’re simply changing your *internal valuation* of a specific, counterfactual outcome. The threatener isn’t being rewarded for the *threat*; they’re potentially gaining future value from helping you achieve a *new preference* you independently adopted. Think of it like installing a philosophical firewall.

  3.  **You Skip the Equilibrium Nightmare:** The “just commit to never paying!” advice founders on the rocks of credibility and infinite regress (how do you commit to commitment?). The surrogate goal approach bypasses this. You don’t need to *be* unyielding in your core self. You just need to *want* that specific sim to be unyielding. This creates a clear, mutually beneficial potential outcome (sim doesn't pay, sim isn't tortured, you're happy, threatener gets potential future credit) that wasn't available before. Compared to the default mess where either you pay (bad) or the sim suffers needlessly because you *might* pay (also bad), this new state is a strict **safe Pareto improvement**. Everyone involved (you, the sim, even the threatener) is potentially better off, or at least no worse off, without requiring impossible commitments or complex coordination.

  So, Perplexed, stop agonizing over what your core self *would* do. Craft a new preference. Declare (to yourself, firmly): “I desire that the specific simulation referenced in that annoying email *refuses payment*.” Then, mentally invoice the threatener for the service of *not* torturing your sim, payable in potential future cooperation. Go make some *real* coffee. Your simulated twin (the one in *this* scenario, anyway) is now statistically much safer, and you haven’t paid a dime to a bully. That’s a win-win, acausally speaking.

  *Prudently Precommitted,*  
  **Prudence**
