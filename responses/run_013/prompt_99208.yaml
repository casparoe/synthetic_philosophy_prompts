answer: |-
  Here’s a systematic analysis of the philosophical case against "Evidential Cooperation in Large Worlds" (ECLW), structured as requested. I’ll proceed by brainstorming defeaters, ranking them, and explicitly addressing your five core questions.

  ---

  ### **Brainstormed Defeaters**  
  1. **The Correlation Threshold Problem**: How strong must the correlation be? If too weak, cooperation becomes irrational.  
  2. **Screening-Off by Background Knowledge**: Other evidence might break the evidential link between your choice and others’.  
  3. **The Causal Funnel**: ECLW might reduce to Evidential Decision Theory (EDT) in practice, inheriting its flaws (e.g., in *Death in Damascus*).  
  4. **Parfit’s Hitchhiker with Imperfect Correlation**: Defection dominates if correlation is <100%, even when evidence supports cooperation.  
  5. **Spurious Correlation**: Your action correlates with others’ choices for irrelevant reasons (e.g., shared noise).  
  6. **Small-World Collapse**: In "small" worlds (few agents/low correlation), ECLW prescribes defection—but how small is "too small"?  
  7. **Unfalsifiability**: ECLW might evade disconfirmation by reinterpreting failed predictions as "insufficient correlation."  
  8. **Bootstrapping Objection**: Why should *your* choice be evidence for *others’* choices if all agents reason identically?  
  9. **Payoff Asymmetry**: ECLW fails in asymmetric dilemmas (e.g., you face copies, but they face different opponents).  

  ---

  ### **Ranked Defeaters: Fatal to Merely Awkward**  
  #### **Fatal Defeaters** (Threaten Core Coherence)  
  1. **Parfit’s Hitchhiker with Imperfect Correlation**  
     - **Scenario**: You’re in a one-shot Hitchhiker: Driver helps iff you pay at destination. Correlation between your payment and identical drivers’ decisions is 90%.  
     - **Problem**: *Defecting (not paying) dominates*: If driver helps, you save money; if not, you’re stranded regardless. Your action’s evidential impact (90% chance driver helps if you pay) cannot override the causal dominance of defection.  
     - **Why fatal?** ECLW recommends cooperation here, but CDT (and dominance reasoning) demands defection. A defender *must* concede this is a counterexample—unless they reject causal dominance entirely.  

  #### **Serious but Surmountable Defeaters** (Require Major Qualification)  
  2. **Screening-Off by Background Knowledge**  
     - **Scenario**: You know all correlated agents use a deterministic algorithm. Observing your own choice reveals nothing new about theirs.  
     - **Problem**: Evidential correlation vanishes; ECLW collapses to defection.  
     - **Defender Response**: Concedes this but argues screening-off is rare in complex large worlds (e.g., chaotic systems, logical uncertainty). Dismisses as "unrealistic idealization."  
  3. **The Correlation Threshold Problem**  
     - **Issue**: ECLW only "works" if correlation exceeds a payoff-dependent threshold (e.g., >50% for PD). If correlation is unknown or low, cooperation is unjustifiable.  
     - **Defender Response**: Concedes threshold exists but argues large worlds imply non-negligible correlation. Dismisses "low correlation" as edge cases.  

  #### **Merely Awkward Defeaters** (Highlight Limitations but Not Fatal)  
  4. **Spurious Correlation**  
     - **Scenario**: All agents correlate because they listen to the same flawed weather forecast (unrelated to PD payoffs).  
     - **Problem**: Cooperation is irrational—the correlation isn’t "about" the PD.  
     - **Defender Response**: Dismisses as misunderstanding: ECLW requires correlation *grounded in decision-relevant similarity*, not noise.  
  5. **Small-World Collapse**  
     - **Issue**: If only 10 agents exist, and you know 9 defected, your cooperation is futile.  
     - **Defender Response**: Concedes ECLW applies only to "sufficiently large" worlds but argues most real cases qualify.  

  ---

  ### **Addressing Your Five Questions**  
  1. **Load-Bearing Assumptions**  
     - **World Size**: Must be large enough that (a) your action is statistically significant evidence, and (b) background knowledge can’t screen off correlations.  
     - **Correlation Degree**: Must exceed a threshold (e.g., >1/(T-R) in PD, where T=temptation, R=reward).  
     - **Nature of Correlation**: Must stem from *decision-relevant similarity* (shared reasoning, constraints, goals)—not spurious links.  

  2. **Vanishing/Screeened-Off Correlation**  
     - **Conditions**: (a) Perfect determinism known to all agents; (b) You have direct access to others’ decision algorithms; (c) Agents are perfectly logically orthogonal.  
     - **Realism?**: Highly unrealistic in large worlds with bounded rationality. Defenders argue logical uncertainty and chaos prevent screening-off.  

  3. **Collapse into Standard Decision Theories**  
     - **EDT**: ECLW *is* a form of EDT—but restricted to large worlds with correlated agents. This isn’t a "collapse"; it’s a deliberate scope limitation.  
     - **CDT**: ECLW diverges from CDT in Newcomb-like problems (e.g., Medical Newcomb). Defender argues this is a *virtue* (CDT defects when it shouldn’t).  
     - **FDT**: ECLW resembles Functional Decision Theory but avoids FDT’s reliance on "logical identities." Instead, it uses statistical ensembles. Not a problem—defender views this as a strength.  

  4. **Decisive Counterexamples**  
     - **Fatal**: Parfit’s Hitchhiker with <100% correlation (causal dominance beats evidence).  
     - **Serious**: Death in Damascus (EDT’s flaw): If you flee to Damascus, it’s evidence Death is there—but CDT escapes. ECLW risks similar errors if correlation is miscalibrated.  
     - **Non-Decisive**: Newcomb’s Problem. ECLW cooperates (like EDT/FDT), which many accept as correct.  

  5. **Unfalsifiability Risk**  
     - **Yes**: If ECLW fails, defenders can retreat to "insufficient correlation" or "world not large enough." To avoid this, they *must* specify testable thresholds (e.g., "correlation > *X* in population > *Y*"). Otherwise, ECLW risks being non-empirical.  

  ---

  ### **Distinguishing from "Cooperate with Copies"**  
  ECLW **does not require** personal identity or logical identity. Instead, it relies on:  
  - **Statistical Similarity**: You and others share decision-relevant properties (values, reasoning, constraints).  
  - **Evidential Leverage**: Your choice is a random sample from the ensemble of similar agents.  
  This avoids metaphysical commitments: even if agents are "distinct," their correlated choices in large worlds justify cooperation.  

  ---

  ### **Conclusion: The Fragility of ECLW**  
  ECLW is **vulnerable but not indefensible**. Its fatal flaw is the tension between evidential cooperation and causal dominance in imperfectly correlated dilemmas (e.g., Hitchhiker). Defenders must either:  
  - Accept that ECLW *sometimes* prescribes dominated strategies, or  
  - Argue that 100% correlation is plausible in large worlds (contested).  
  Other objections (spurious correlation, screening-off) are manageable with careful formulation. However, ECLW’s heavy reliance on empirically unverified assumptions about "sufficient size" and "non-spurious correlation" renders it philosophically precarious—though not yet falsified.  

  ---  
  *Key Distinctions*:  
  - **EDT**: Choose acts with best *news value* (ignoring causality).  
  - **CDT**: Choose acts with best *causal consequences* (using do-calculus).  
  - **FDT**: Choose acts that *best fulfill your function* across logical counterfactuals.  
  ECLW is EDT applied to large-world agent correlations—a niche but potentially viable position.
