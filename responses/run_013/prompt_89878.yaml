answer: |-
  ### Scenario: Clinic Scheduling Desk
  At a medical clinic, the target outcome **T** is minimizing patient no-shows (i.e., patients who don’t arrive without canceling). The metric **M** is the number of *verbal confirmations* obtained: schedulers call patients 24 hours before appointments to confirm they’ll attend. M is tracked per employee. Initially, patients can cancel via an online portal or by phone.  

  **First Half (Specification Gaming without Goodhart):**  
  Scheduler **Alex** realizes M is measured by call records, not outcomes. Alex falsely logs confirmations without calling patients. Alex’s M rises sharply, but their no-show rate (T) stays flat (patients never received reminders). For other schedulers, like **Brenda**, who call patients honestly, M remains strongly correlated with T: Brenda’s high M correlates with low no-shows, as reminders reduce forgetfulness. Alex’s cheating doesn’t corrupt M’s evidential value for others—Brenda’s high M still reliably indicates low T.  

  **Second Half (Goodhart without Specification Gaming):**  
  The clinic removes the online cancellation portal, *requiring* all cancellations to go through schedulers. All schedulers, including Alex and Brenda, now optimize M honestly: they call every patient and document verbal confirmations. Patients who wish to cancel must now speak to a scheduler, but many avoid confrontation and simply no-show instead. M rises across the board (more "confirmed" appointments), but T worsens significantly (no-shows increase). Knowing an employee’s M no longer predicts their T—e.g., Brenda’s high M now accompanies high no-shows. No one cheats; all earnestly optimize M.  

  ---  
  ### Analysis  
  **The Single Structural Variable:**  
  The key difference is **patient cancellation accessibility**.  
  - **First half:** Patients can cancel easily (online or phone).  
  - **Second half:** Patients *cannot* cancel easily (must speak to scheduler).  

  This variable flips the case because it alters the *incentive environment* for patients, not employees.  

  **Why This Produces Two Failures:**  
  - **In gaming (first half), the flaw is *agent-driven*:** Alex exploits a *loophole in measurement* (M records calls, not outcomes) without affecting the underlying M–T relationship. Patients’ behavior remains consistent *if* M is applied honestly, so M stays reliable evidence for non-cheaters.  
  - **In Goodhart (second half), the flaw is *system-driven*:** Removing cancellation options changes patient incentives. Honest optimization of M (calling) now *induces* patients to no-show rather than cancel. M becomes decoupled from T because the act of maximizing M alters the environment, making M a poor proxy regardless of effort.  

  **Verdicts and Tempting Mislabels:**  
  - **First half = Specification Gaming ONLY:**  
    - **Gaming:** Alex "hollows" their M by falsifying calls while T stays bad.  
    - **NOT Goodhart:** M remains a *causal lever* for T for honest employees (calling reduces forgetfulness). Reject labels like "corrupted metric"—the problem is one agent’s actions, not M itself.  
  - **Second half = Goodhart Law ONLY:**  
    - **Goodhart:** Maximizing M *causes* T to worsen due to distorted patient incentives. M loses evidential value systemwide.  
    - **NOT Gaming:** No cheating occurs; employees follow the metric diligently. Reject labels like "lazy workers"—the failure is structural, not behavioral.  

  **Honest Accounting:**  
  - **The real work is done by cancellation accessibility.** It controls whether optimizing M preserves (first half) or destroys (second half) the M–T link. Remove this variable (e.g., restore online cancellation in the second half), and both phenomena vanish:  
    - Gaming fails: Alex’s fake calls become riskier (patients might cancel online, exposing lies).  
    - Goodhart fails: Patients cancel online freely, so honest confirmations reduce no-shows (M–T correlation restores).  
  - **Attack by a unificationist (claiming gaming/Goodhart are identical):**  
    They might argue, "Both cases show M diverging from T due to incentives!" But this attack **fails** because:  
    - In gaming, the *divergence is localized* to the cheater and doesn’t break M’s general evidential power.  
    - In Goodhart, the *divergence is systemic* and occurs *because* M is optimized honestly.  
    The causal structures differ: gaming requires *malicious agency*, Goodhart requires *perverse systemic feedback*. The case forces this distinction by fixing M and T while varying only environmental constraints.  

  ---
  **Design Insight:**  
  This shows that metric failures aren’t just about the metric’s design *or* employee ethics alone. The surrounding system—here, patient options—can determine whether gaming or Goodhart dominates. To prevent both, design metrics in tandem with the environment they operate in (e.g., preserve patient cancellation autonomy to anchor M–T reliability). If your metric ignores user incentives, even perfect compliance won’t save it.
