answer: |-
  ## Joint Statement: Norms of Assertion  
  **Produced through adversarial collaboration by Prof. Aris Thorne (Knowledge Norm Proponent) and Prof. Lena Sharma (Truth Norm Proponent), chaired by an independent facilitator.**  
  **Date:** 15 October 2023  

  ### Section 1: Agreed Foundational Claims  
  We, the undersigned, agree on the following conceptual groundwork and shared constraints for any adequate account of assertion and its norms:  

  1.  **The Target Phenomenon:** Assertion is a distinctive type of speech act whereby a speaker presents a proposition *p* as true, committing themselves to *p* in a way that invites reliance or challenge from an audience (real or potential). It contrasts with conjecturing, opining, or merely entertaining a thought.  
  2.  **The Normative Question:** Our dispute concerns the constitutive *norm* of assertion. By "norm", we mean a standard governing the practice itself, violation of which renders an assertion *incorrect* or *defective *qua* assertion*, even if it serves other purposes (e.g., being polite, funny, or strategically useful). We are *not* primarily discussing:  
      *   **Ethics of Belief:** What one *ought to believe* (though this may interact).  
      *   **Conversational Pragmatics:** Rules for smooth discourse (e.g., relevance, brevity).  
      *   **Moral or Legal Blameworthiness:** Whether sanctions apply to the asserter.  
  3.  **Core Data Requiring Accommodation:** Any viable norm must explain, or at least cohere with, the following widely observed patterns:  
      *   **Challenges & Justifications:** Assertions are appropriately met with challenges like “How do you know?” or “What’s your evidence?”. The asserter is typically expected to provide justification upon challenge.  
      *   **Retraction:** When an asserter discovers their assertion was mistaken or lacks adequate support, it is appropriate (often obligatory) to retract it (e.g., “I take that back,” “I was wrong”).  
      *   **Criticism Patterns:** Assertions can be criticised as “unfounded,” “baseless,” or “you didn’t know that,” even if they turn out true. Conversely, asserting something false is criticised *as* false.  
      *   **The Lottery Intuition:** Asserting “My ticket (in a large, fair lottery) won’t win” based *only* on the high probability sounds improper to many competent speakers, despite its high probability and likelihood of truth.  
      *   **The Justified False Belief:** Asserting a proposition for which one has strong, undefeated evidence (e.g., “Jones is in his office,” based on seeing his coat and hearing his voice minutes ago), which subsequently turns out false (Jones left abruptly), often elicits sympathy rather than condemnation *for the assertion itself*, though regret is expected.  
  4.  **Distinguishing Normative Dimensions:** We agree it is crucial to distinguish:  
      *   **Incorrectness/Defectiveness (Wrongness):** When an assertion violates the constitutive norm.  
      *   **Blameworthiness:** When the asserter is subject to criticism or sanction for making the assertion (e.g., due to recklessness, negligence, or dishonesty).  
      *   **Answerability:** When the asserter owes an account or justification *for* the assertion, typically upon challenge.  
      An assertion can be *incorrect* (defective) without the asserter being *blameworthy* (e.g., if deceived by a flawless fake). Conversely, an asserter might be *blameworthy* (e.g., for asserting recklessly) even if the assertion is *correct* (e.g., luckily true). *Answerability* often tracks the potential for incorrectness or the demands of the conversational context.  
  5.  **The Personal/Communal Axis:** Norms can function in two ways:  
      *   **Norm-Governance (Personal):** The standard the asserter must *answer to* or satisfy *for their own assertion to be correct*.  
      *   **Norm-Enforcement (Communal):** The standard others are *entitled to hold the asserter to* within the practice, including demanding justification or criticising violation.  
      We agree a full account must specify the relationship between these.  

  ### Section 2: Points of Disagreement  
  Despite extensive discussion, fundamental differences remain regarding the constitutive norm. Below, for each key point of contention (Crux), we state:  
  (A) The neutral formulation of the issue.  
  (B) Prof. Thorne's Knowledge Norm (KN) position.  
  (C) Prof. Sharma's Truth Norm (TN) position.  
  (D) The core data or argumentative pressure both sides agree bears on this issue.  
  (E) Each side's prediction about how the other's view handles the pressure.  

  ---

  **Crux 1: The Primary Normative Standard**  
  *(A) Neutral Wording:* What condition must be satisfied for an assertion that *p* to be *correct* (non-defective) *qua* assertion?  
  *(B) KN Position:* An assertion is correct only if the speaker knows that *p*. Asserting *p* without knowing *p* is defective *as an assertion*, regardless of truth, justification, or consequences. Knowledge is the entry ticket.  
  *(C) TN Position:* An assertion is correct only if *p* is true. Asserting a falsehood is defective *as an assertion*, regardless of the speaker's epistemic state. Asserting a truth is correct, even if the speaker lacks justification or knowledge. Truth is the sole constitutive standard.  
  *(D) Shared Pressure:* Explaining the pervasive practice of challenging assertions ("How do you know?") and the appropriateness of retraction upon discovering error or lack of support. Accounting for criticism patterns (e.g., criticising true assertions as "unfounded," criticising false ones *as* false).  
  *(E1) KN Prediction re TN:* TN will struggle to explain why asserting highly probable truths (like lottery propositions) seems improper, and why assertions based on good (but knowledge-insufficient) evidence are criticised as "unfounded" even if true. TN must relegate these intuitions to other norms (ethics, pragmatics), failing to capture their direct link to assertion's defectiveness.  
  *(E2) TN Prediction re KN:* KN will overgenerate incorrectness, deeming many intuitively proper assertions (e.g., justified true beliefs falling short of knowledge, cautious claims based on excellent evidence) defective. KN must implausibly dismiss the intuitive correctness of asserting truths one justifiably believes but doesn't strictly *know*.  

  **Crux 2: The Lottery Case**  
  *(A) Neutral Wording:* Why does asserting "My ticket won't win" (based solely on the odds) seem improper, despite its high probability and likelihood of truth? Whose problem is this – the norm of assertion or another domain?  
  *(B) KN Position:* The impropriety arises directly from violating the knowledge norm. The speaker *does not know* the ticket will lose (knowledge requires more than just statistical probability here; one lacks a non-lucky connection to the fact). The assertion is therefore incorrect/defective.  
  *(C) TN Position:* The assertion is *correct* (it's true, or highly likely to be true). The impropriety stems from *conversational pragmatics*: asserting such a proposition typically conveys that one has *non-statistical* grounds (e.g., tampering evidence), which the speaker lacks, making it misleading. Alternatively, it violates a norm of *prudence* or *belief* (it's unwise to *believe* it firmly). The norm of assertion itself is satisfied.  
  *(D) Shared Pressure:* Accounting for the strong intuition of impropriety while respecting the proposition's high probability/truth-likelihood.  
  *(E1) KN Prediction re TN:* TN must deny the core intuition that the assertion is *defective as an assertion*, misdiagnosing a pragmatic implicature or ethical issue where the defect feels constitutive.  
  *(E2) TN Prediction re KN:* KN misattributes a pragmatic/ethical defect to the norm of assertion, incorrectly deeming a true (and reasonably held) assertion defective.  

  **Crux 3: The Justified False Belief**  
  *(A) Neutral Wording:* When a speaker asserts *p* based on strong, undefeated evidence, but *p* is false, is the assertion *incorrect* (defective) or merely *unfortunate*?  
  *(B) KN Position:* The assertion is *incorrect* (defective) because the speaker did not *know* *p*. The speaker is likely *excused from blame* (not culpable) due to their excellent evidence and lack of negligence, but the assertion itself violated the norm. Retraction is appropriate because a wrong was committed, not just an unfortunate outcome.  
  *(C) TN Position:* The assertion is *correct* because the speaker aimed at truth and followed their best evidence; it was simply *unfortunate* that *p* was false. The defect lies in the *falsity of the belief*, not in the *assertion of it*. Retraction acknowledges the unfortunate falsity, not a normative violation of assertion. Blame might attach to the *belief* if it was improperly formed, but not to the assertion.  
  *(D) Shared Pressure:* Explaining the appropriateness of retraction and the typical withholding of *strong condemnation* for the assertion itself in such cases, while acknowledging the error.  
  *(E1) KN Prediction re TN:* TN cannot adequately explain the *obligation* to retract, which feels like an admission of a *mistake in asserting*, not just an update on the facts. TN conflates the correctness of the assertion with the reasonableness of the speaker's conduct.  
  *(E2) TN Prediction re KN:* KN conflates the *falsity* of the proposition (which is unfortunate) with the *correctness of the act* of assertion (which should be judged on whether the speaker aimed at truth with due diligence). KN makes retraction an admission of normative failure where there was only bad luck.  

  **Crux 4: Retraction, Challenge, and the Scope of the Norm**  
  *(A) Neutral Wording:* Are the practices of challenging assertions ("How do you know?") and retracting assertions governed by the *same* constitutive norm that governs the initial correctness of assertion, or by distinct norms?  
  *(B) KN Position:* Challenge and retraction are directly governed by the knowledge norm. "How do you know?" legitimately questions whether the speaker met the norm. Retraction is required when the speaker realises they did not meet, or no longer meet, the knowledge condition at the time of assertion. The norm governs the act and its downstream consequences uniformly.  
  *(C) TN Position:* The initial correctness of assertion is governed solely by truth. Challenges ("How do you know?") are governed by *epistemic or conversational norms* concerning the reasonableness of *relying* on the testimony or the speaker's *responsibility* to have evidence. Retraction is governed by a *norm of accuracy* or *conversational upkeep* triggered by discovering falsity or significant doubt; it is *not* an admission the original assertion violated the constitutive norm if it was true when made.  
  *(D) Shared Pressure:* Explaining the tight conceptual link between making an assertion and being subject to challenge/obligation to retract, without making the norm implausibly complex or detached from core intuitions about assertion's correctness.  
  *(E1) KN Prediction re TN:* TN fragments the normative landscape unnecessarily, separating the act's correctness from the obligations it inherently generates, making the practice seem less coherent.  
  *(E2) TN Prediction re KN:* KN illegitimately extends the constitutive norm beyond the act itself to govern distinct subsequent practices (challenge, retraction), which have their own distinct norms better explained by epistemology or pragmatics.  

  **Crux 5: Testimony and Knowledge Transmission**  
  *(A) Neutral Wording:* Must the norm of assertion explain why testimony can be a source of *knowledge* for the hearer, or is that demanding too much of the norm?  
  *(B) KN Position:* A central function of assertion is the transmission of knowledge. The knowledge norm *explains* this: if the speaker knows *p* and asserts it appropriately, the hearer is often well-positioned to gain knowledge (absent defeaters). If the norm were weaker (e.g., mere truth or justified belief), it would be mysterious how testimony reliably yields knowledge.  
  *(C) TN Position:* While testimony *can* yield knowledge, the primary function of assertion is conveying *truthful information*. The norm of assertion (truth) ensures the information conveyed *is* true, which is necessary for knowledge transmission. However, whether the hearer *gains knowledge* depends on complex factors beyond the speaker's control (hearer's understanding, defeaters). Burdening the norm of assertion itself with explaining knowledge transmission is asking it to do epistemology's job. The norm secures truthfulness; other norms govern reliable reception.  
  *(D) Shared Pressure:* Accounting for the role of assertion in the reliable spread of information and knowledge within communities.  
  *(E1) KN Prediction re TN:* TN cannot adequately explain the *epistemic authority* often granted to assertions or why hearers feel entitled to claim knowledge based *solely* on testimony meeting the norm.  
  *(E2) TN Prediction re KN:* KN sets an unrealistically high bar that ignores the many useful true assertions made without knowledge (e.g., based on reliable but not knowledge-conferring processes) and overstates the norm's role in guaranteeing hearer knowledge, which depends on external factors.  

  **Crux 6: Solitary Assertion (Diary, Soliloquy)**  
  *(A) Neutral Wording:* Does the constitutive norm apply to assertions made privately (e.g., in a diary, note to oneself, or thinking aloud with no audience)? If so, how?  
  *(B) KN Position:* Yes. The knowledge norm governs the act of presenting *p* as true *to oneself*. Asserting *p* to oneself without knowing *p* is a defective cognitive act – a form of self-deception or epistemic irresponsibility. One can still hold oneself answerable and retract upon realising one didn't know.  
  *(C) TN Position:* The core constitutive norm (truth) applies, as one can still assert falsely to oneself. However, norms concerning *answerability to others* and conversational propriety obviously lapse. Criticisms like "You didn't know that!" lose much of their force when directed at oneself privately; the primary defect is simply believing or asserting falsely. The *point* of the norm in private contexts is less about social practice and more about cognitive accuracy.  
  *(D) Shared Pressure:* Determining whether the norm is inherent to the *act* of asserting or essentially tied to its *social/interpersonal* function. Accounting for the intuition that lying in one's diary is still wrong, but that "How do you know?" seems less apt as a self-challenge.  
  *(E1) KN Prediction re TN:* TN will struggle to explain the distinct *normative force* of self-directed assertion beyond mere falsity – why asserting to oneself something one merely guesses feels irresponsible, not just potentially false.  
  *(E2) TN Prediction re KN:* KN imports social/interpersonal normative elements (like being answerable *to others*) into the private sphere where they don't clearly apply, potentially over-intellectualising private thought.  

  ### Section 3: Summary of Verbal and Substantive Differences  
  We identify the following sources of divergence:  
  1.  **Verbal:** We use "norm," "correct," and "defective" with subtly different emphases. KN emphasizes *epistemic warrant* as constitutive of correctness/defectiveness. TN emphasizes *factual accuracy* as constitutive, often viewing epistemic warrant concerns as belonging to blameworthiness or other norms.  
  2.  **Substantive:**  
      *   Whether truth *alone* suffices for the correctness of an assertion (TN) or whether an epistemic condition (knowledge) is also constitutive (KN).  
      *   Whether the core intuition driving challenges ("How do you know?") directly targets the constitutive norm (KN) or targets a separate norm of epistemic responsibility or testimony-reliance (TN).  
      *   Whether retraction primarily acknowledges a past normative failure of the assertion (KN) or merely updates on falsity/doubt (TN).  
  3.  **Bookkeeping:**  
      *   The classification of intuitions surrounding lottery assertions and justified false beliefs: KN sees these as *directly* revealing the constitutive norm; TN sees them as revealing *interacting* norms (ethics, pragmatics, belief).  
      *   The weight given to different functions of assertion (KN: knowledge transmission; TN: truthful information transfer).  

  **Signed:**  
  _________________________  
  Prof. Aris Thorne (Knowledge Norm)  

  _________________________  
  Prof. Lena Sharma (Truth Norm)  

  ---

  ## Brainstorm: Candidate Formulations & Likely Objections
  1.  **Formulation:** "The norm requires that an assertion be *true*."  
      *   *KN Objection:* Ignores the core intuition that asserting without knowledge is defective *even if true*. Reduces the norm to mere factuality, stripping it of its epistemic dimension essential to the practice (challenges, retraction).  
      *   *TN Acceptance:* Captures the fundamental aim of assertion: to state facts. Other concerns (evidence, knowledge) are secondary.  

  2.  **Formulation:** "The norm requires that the speaker *know* what they assert."  
      *   *KN Acceptance:* Directly states the core requirement, explaining challenge/retraction practices and lottery/justified false belief intuitions.  
      *   *TN Objection:* Sets the bar implausibly high. Demeans countless useful, responsible assertions (justified true beliefs, cautious claims) as "defective." Misidentifies epistemic ideals as constitutive rules.  

  3.  **Formulation:** "The norm requires that the speaker be *justified in believing* what they assert."  
      *   *KN Objection:* Too weak. Justification (even strong) without truth doesn't make a false assertion correct. Justification without knowledge doesn't explain the lottery impropriety (one *is* justified by probability alone).  
      *   *TN Objection:* Still imports an unnecessary epistemic condition. A true assertion based on an unjustified (but lucky) guess is still *correct as an assertion*. Justification pertains to blameworthiness/reliability, not constitutive correctness.  

  4.  **Formulation:** "The norm requires *truth for correctness*, but *reasonable belief for immunity from criticism*."  
      *   *KN Objection:* Fails to see that criticism for "unfounded" assertion ("You didn't know!") targets the *correctness itself*, not just the speaker's conduct. It incorrectly divorces defectiveness from the epistemic warrant condition.  
      *   *TN Acceptance:* Gets closer. Acknowledges truth as primary, but recognises other norms govern appropriate criticism. However, might concede too much ground by linking criticism specifically to "reasonable belief" rather than broader epistemic/conversational norms.  

  5.  **Formulation:** "The norm governs whether others are *entitled to rely* on the assertion, not the assertion's intrinsic correctness."  
      *   *KN Objection:* Fundamentally mislocates the norm. The norm governs the speaker's *act*. Reliance is a *consequence* mediated by other norms. An assertion can be defective (unknowing) even if no one relies on it (or shouldn't).  
      *   *TN Objection:* While related, this confuses the norm of *testimony reception* with the norm of *assertion*. The assertion's correctness (truth) is prior to questions of reliance.  

  6.  **Formulation:** "The norm requires *asserting only what you responsibly take to be true*."  
      *   *KN Objection:* Too vague and subjective. "Responsibly take" could allow assertions based on low probability (if subjectively responsible) and doesn't guarantee knowledge or objective justification. Doesn't resolve lottery case.  
      *   *TN Objection:* Still imposes an epistemic filter where none belongs. The correctness condition is objective truth. "Responsibly take" pertains to ethics/pragmatics of belief/assertion, not constitutive defectiveness.  

  This joint statement reflects the deepest points of agreement and the most fundamental, unresolved disagreements after sustained collaborative effort. The process revealed significant verbal differences masking deeper substantive ones, particularly concerning the relationship between truth, epistemic warrant, and the core nature of the speech act. Neither side concedes their core position but acknowledges the force of the data motivating the other.
