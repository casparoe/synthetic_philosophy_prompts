prompt: |-
  Ok so I'm an epidemiologist — I do outbreak surveillance for a state health department, so I basically live inside case definitions: notifiable disease lists, sensitivity and specificity, the way you only find what your case definition tells you to look for, and the way someone rewrites the definition on a Tuesday and the counts change overnight. Lately I've been reading about genocide as a legal and moral category and the whole fight over when you're allowed to call something a genocide, and I want you to do something specific with it.

  Take the debate — Lemkin's original, broader idea of it, the eventual legal definition with its special intent requirement and its fixed list of protected groups and the whole in-whole-or-in-part business, and then the politics of naming: the delays, the people insisting that calling it genocide is the only thing that ever gets anyone to move, the ones saying the label is a trap or gets applied selectively, all of that — and restate the whole thing as faithfully as you can in my vocabulary. Case definitions and case ascertainment, surveillance, reporting thresholds, reportable versus notifiable conditions, declaring an emergency, sensitivity and specificity, the difference between a descriptive count and a decision rule that trips something.

  Then give me the residue report. What actually survived the translation, what I had to fudge to make it fit, and what has no counterpart at all in how we think about outbreaks. And I want your read on the residue itself: is it pointing at something my framework genuinely can't see, or is it a sign the original dispute is less determinate than it sounds?

  No headings, no bullet points, no bold, no tables — just write it out the way you'd write me an email. And at the end tell me what would change your mind, like which consideration would flip your read on where the residue is coming from, or where you think your own reasoning is most likely to be wrong.
