prompt: |-
  I've been reading LessWrong-adjacent blogs and forums for about a decade, and I've absorbed a working picture I rarely examine: beliefs are in-the-head states, and getting them right is a personal engineering problem — calibrate, notice your confusion, update on the evidence you yourself can gather. I've also collected a set of externalist theses that each, in a different way, seem to put a thumb on the scale against that picture. Please sort them into tiers by how much a rationalist who accepted the thesis should actually change their epistemic practice. The ranking dimension is how far the thesis moves the locus of epistemic responsibility away from the individual and onto the environment, the community, or the causal-functional process that produced the state.

  The theses:

  - Environmental externalism: the chemical stuff in your surroundings, not your internal state, fixes what your word for the wet stuff refers to, so a duplicate in a different environment would mean something else with an identical head.
  - Social externalism: your linguistic community's usage, not your own partial understanding, fixes what your terms mean, so you can have a belief whose content you cannot fully state.
  - Causal-historical externalism: what a name picks out is fixed by the chain of transmission rather than by any description in the speaker's head, so two people with identical internal states could refer to different things.
  - Teleosemantic externalism: a state's content is fixed by the biological or designed function it was selected to serve, not by anything the thinker can introspect.
  - Collective-cache externalism: an individual's so-called belief is a local cache of a computation that properly belongs to a group, so content is a property of the collective and the individual is at best a mirror.
  - Swamp-duplicate externalism: a molecule-for-molecule duplicate with no causal history either has no content at all or the same content, and introspection cannot tell you which.

  For each tier, give me one sentence on why it lands there and rank within the tier; then tell me which single thesis, if true, would most change what a rationalist should do on Monday morning, and what that change would be. Don't retreat into it depends on your theory of content — pick a reading of each thesis, commit to it, and rank on that.
reasoning: |-
  Hmm, the user presents a fascinating challenge about epistemic externalism. They've been immersed in LessWrong-style rationality for a decade, holding the internalist view that beliefs are individual mental states to be calibrated through personal effort. Now they're confronting several externalist theses that challenge this perspective, and want them ranked by how much they'd shift epistemic responsibility away from the individual. 

  The user seems intellectually sophisticated - they're familiar with content externalism debates and have clearly done their homework on Putnam, Burge, Millikan etc. Their frustration with "it depends" qualifiers suggests they want concrete, actionable conclusions despite philosophical complexity. Underneath the technical request, I sense they're wrestling with a deeper question: how much should rationalists actually trust their individual cognition versus relying on external structures?

  Let me analyze each thesis for its practical epistemic implications:
  Environmental and causal-historical externalism mainly affect reference-fixing for natural kind terms, but don't fundamentally alter how one gathers evidence. Swampman is more radical but remains hypothetical. Teleosemantics has interesting implications for self-trust issues, particularly about whether our cognition is "designed" for truth. But the real game-changer is collective-cache externalism - it directly attacks the individualistic premise of rationalist epistemology by making belief inherently distributed. 

  For the Monday morning test, collective-cache wins hands down: if true, rationalists should stop obsessing over personal Bayesian updates and instead focus on community epistemology infrastructure. The other theses require tweaks to reference or meaning, but this one demands abandoning the core model of belief as individual property. 

  I'll rank them into three tiers of practical impact, with collective-cache as the clear outlier. The user wants bold claims, so I'll avoid hedging while still acknowledging where theses overlap (like social and collective-cache both involving communities). The swamp-duplicate case gets lower priority precisely because it's not actionable - you can't determine if you're a swampman anyway.
answer: |-
  Here's the tiered ranking based on how much each thesis **shifts epistemic responsibility away from the individual**, with tier 1 having the most profound practical impact. Within each tier, theses are ranked from highest to lowest impact:

  **Tier 1: Radically redistributes epistemic labor**  
  *(Requires fundamentally rethinking belief-as-personal-engineering)*  
  1. **Collective-cache externalism**: Beliefs are fundamentally fragments of distributed group cognition, making individual "calibration" meaningless without prioritizing collective epistemic infrastructure.  
  2. **Teleosemantic externalism**: Belief content is fixed by evolutionary/design purpose, so introspection is unreliable and the rationalist must focus on aligning cognition with its *de facto* teleological function rather than subjective evidence.  

  **Tier 2: Shifts responsibility to the environment/community**  
  *(Demands significant procedural changes but preserves individual agency)*  
  1. **Social externalism**: Meaning is determined by community use, forcing the rationalist to constantly verify linguistic alignment with experts/society rather than relying on personal understanding.  
  2. **Causal-historical externalism**: Reference depends on historical chains, requiring the rationalist to trace origins of concepts (e.g., "Am I using this term as its originator intended?") before trusting beliefs involving names.  
  3. **Environmental externalism**: Reference is fixed by external context, compelling the rationalist to audit environmental embeddings (e.g., "Does 'water' here mean H₂O or XYZ?") for location-sensitive beliefs.  

  **Tier 3: Challenges foundations but offers no practical pivot**  
  *(Philosophically unsettling but no actionable change to daily practice)*  
  1. **Swamp-duplicate externalism**: Content depends on causal history, but since you can't introspect history or prove you're not a swampman, this paralyzes self-trust with no remedy—thus the rationalist must pragmatically ignore it.  

  ---

  **Thesis with the biggest Monday-morning impact: Collective-cache externalism**  
  **Change to practice**: Immediately shift focus from *personal* belief calibration to optimizing *group epistemic dynamics*—e.g., spend Monday morning auditing information flow in your team, fixing communication bottlenecks, or implementing shared belief-tracking tools, because "your" beliefs are merely local caches of a collective process.  

  ### Key Justifications:
  - **Collective-cache** directly dismantles the "beliefs are in-the-head" model, making *all* epistemic labor inherently collaborative. Ignoring this would render personal rationality efforts futile.  
  - **Teleosemantics** forces a meta-calibration of whether your cognition serves its "true" purpose, but this is abstract; **Collective-cache** demands concrete institutional action.  
  - **Social/Causal/Environmental** theses add verification steps (e.g., "check community usage"), but don't negate the *value* of personal updates.  
  - **Swampman** is epistemically catastrophic but operationally inert—you can't act on it.
