  First, I need to unpack their two key features: act-outcome correlation (like Newcomb's predictor linking your choice to the outcome) and act-occasion indistinguishability (AMD's driver not knowing which exit they're at). The user suspects AMD might be a pure case of the second feature without the first, and wonders if it's a genuine counterexample to act-by-act decision making.

