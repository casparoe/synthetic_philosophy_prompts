prompt: |-
  I've been reading the rationalist-adjacent blogs and comment sections for something like fifteen years, which means I've absorbed alot of mechanism-design opinions without ever sitting down and doing the math properly, and now I've got a pile of gut verdicts about strategic behavior in voting and other procedures that I can't get to line up with each other. Here they are, roughly in the order I hold them. Voting for the lesser evil in a plurality election instead of my actual favorite: completely fine, that's just coordinating with strangers, I do it every time. Ranking a compromise candidate first on a ranked/IRV ballot when my real favorite is first in my heart: not fine, I don't do it, it feels like writing a false statement on a form. Approval voting where I tick my favorite and the acceptable one and leave off someone I wouldn't mind: fine, approval is a threshold rather than a ranking so I don't feel like I'm lying, even though I know it's still manipulable and that when two candidates are both acceptable you're forced into a nasty guess about which one to tick. Shading my bid in a first-price sealed-bid auction: fine, that's the game, everyone knows it's the game. Bidding above my value in a second-price auction: not exactly wrong, more like a dumb bet. Buying extra votes in a quadratic vote: fine, that's expressing intensity, which is what I wish ordinary votes did. Logrolling with a legislator from another district — you vote for my dam, I vote for your bridge, though neither of us thinks the other's project is worth it: uneasy, feels like it shouldn't be OK, but I can't say why it's different from the lesser-evil vote. A hiring or tenure committee where I downrank a candidate I actually think is good because they'd be bad for my subfield: not fine, feels corrupt rather than merely strategic. The residency-match style setup where students submit honest rankings and hospitals submit strategic ones: students being honest is fine and the hospitals being strategic is the whole scandal. Single-peaked committee stuff where everyone's best move is to state their true ideal point: gold standard, I want more of this. And then the case that broke my brain when I heard it: a lottery that picks one random voter and does whatever that voter says. Totally strategy-proof, nobody can gain by lying, and obviously an insane way to run anything. Which makes me suspect the thing I treat as almost a dealbreaker when I'm comparing voting systems — strategy-proofness — is either not that important or not the thing I actually care about, and I gather Gibbard–Satterthwaite says I can't have it in general anyway with three or more options and no restrictions on preferences.

  The pair I genuinely can't reconcile is the plurality compromise (fine) and the IRV compromise (not fine), since as far as I can tell they're the same act: reporting an order that isn't my true order, to get a better result, given what everyone else is likely to do. My best attempt at a principle is that manipulation is bad when it's a false report about my own private preferences, and fine when it's a bet about other people's behavior or a legitimate act of choosing — but the IRV case looks like a bet to me too, so either that verdict or the plurality verdict has to go. My fallback theory is expressive: strategy is bad when it makes the procedure mean something different (a committee becomes a faction fight, an election becomes a poll of guesses) and fine when the procedure is openly a game (auctions). That one has the weird feature of making the badness depend on something other than outcomes, which bothers me, because in a large election my vote moves the outcome with probability roughly zero, and yet I still feel the difference between the two ballot cases.

  Can you work out whether there's a principle, or a small set of them, behind all of this? I'm not after a reading list or citations — I'll chase the literature down myself, I just want the conceptual machinery, and I'd rather have a definite answer I disagree with than everything hedged into mush. Please give me, in this order: 'Where my verdicts collide' (~150 words), naming the pair or pairs that can't both survive; 'Candidate principles' (~400 words), two or three principles stated precisely enough that I could apply them mechanically, each tied to the case that motivates it and each labeled as being about acts, outcomes, or meanings; 'New cases' (~300 words), running each principle against cases I didn't list — I'm especially curious about the random-voter lottery, about mechanisms that are strategy-proof only because they hand people a dominant strategy to do something they'd hate, and about whether 'everyone could do it symmetrically' ever rescues a case; 'Which verdict I should give up' (~200 words), being honest that probably one of my gut verdicts has to go, which one, and why the rest are worth keeping; and 'Bottom line' (~100 words) with the principle you'd actually endorse if you had to pick one.
reasoning: |-
  Okay, let me start by unpacking this user's query. They've been involved with rationalist blogs for about 15 years, absorbing ideas about mechanism design without diving deep into the math. Now they're grappling with conflicting intuitions about strategic behavior in various systems like voting, auctions, and committees. Their main struggle is reconciling why they find some strategic actions acceptable (like voting for the lesser evil in plurality) but not others (like ranking a compromise in IRV). They suspect strategy-proofness isn't the key factor and want a coherent principle behind their judgments.

  First, I need to identify where their verdicts collide. The most glaring conflict is between plurality compromise (fine) and IRV compromise (not fine). They see both as reporting a false preference, yet have different moral reactions. Another tension is logrolling vs. lesser-evil voting—both involve coordination but elicit different unease levels. The random-voter lottery case also challenges their stance on strategy-proofness, as it's technically strategy-proof but practically unworkable.

  Next, considering candidate principles. The user's expressive theory—that strategy is bad when it changes the procedure's meaning—resonates but needs refinement. Principle 1 could be about the mechanism's purpose: if it's designed as a preference aggregator, misreporting corrupts it; if it's a game, strategy is expected. Principle 2 might focus on transparency: when all parties know manipulation is part of the game, it's acceptable. Principle 3 could address symmetry: if everyone can strategically manipulate equally, it's fair, but asymmetric cases (like hospitals in residency matches) feel exploitative.

  For new cases, the random-voter lottery is strategy-proof but ignores preference aggregation, making it meaningless. A mechanism forcing honest but harmful actions (e.g., confessing in a prisoner's dilemma) would be strategy-proof but undesirable. Symmetry might justify approval voting's threshold-based strategy but not committee factionalism, where subgroups can't equally manipulate.

  The user likely needs to give up the IRV compromise verdict. Since IRV, like plurality, requires betting on others' behavior, condemning one but not the other is inconsistent. Letting go of this allows embracing the principle that all voting strategies are coordination efforts, not lies. The bottom line would be that procedures should transparently match their purpose—preference aggregation should minimize strategy, while games embrace it—and symmetry ensures fairness in strategic contexts.
answer: |-
  Here’s a dissection of your intuitions, structured as requested:

  ### Where My Verdicts Collide  
  The core collision is **plurality compromise (fine) vs. IRV compromise (not fine)**. Both involve misreporting preferences to prevent a worse outcome, yet you condemn IRV’s tactical ranking while accepting plurality’s tactical vote. A secondary tension exists between **lesser-evil voting (fine) and logrolling (uneasy)**: both are inter-agent coordination, but logrolling feels corrupt despite analogous strategic intent. Finally, **strategy-proofness** (idealized) clashes with the **random-voter lottery** (abhorrent despite being strategy-proof), revealing a flaw in prioritizing strategy-proofness alone.

  ---

  ### Candidate Principles  
  1. **The Truth-Telling Principle (Acts)**  
     *Statement*: Misrepresenting private preferences is impermissible if the mechanism’s purpose is to *elicit true preferences* for aggregation. Permissible if the mechanism is a *game* where strategic acts are its designed function.  
     *Motivating Case*: IRV compromise feels like "lying on a form" because ranked ballots signal sincere ordinal preferences. Plurality is excused because it’s a "coordination game with strangers," not a preference census. Auction bidding is inherently a game of strategy.  
     *Mechanism*: Classify the procedure: Is it a *preference-revelation device* (IRV, committees) or a *strategic arena* (auctions, lesser-evil plurality)?  

  2. **The Symmetry Principle (Outcomes)**  
     *Statement*: Strategic acts are permissible only if *all participants can symmetrically employ them* without systemic distortion. Impermissible if they exploit asymmetries (e.g., power, information).  
     *Motivating Case*: Hospitals strategically ranking residents while students are honest feels exploitative (asymmetric power). Logrolling feels corrupt because it requires pairwise deals inaccessible to all voters. Lesser-evil voting is symmetric: any voter can "compromise." Quadratic voting is symmetric intensity expression.  
     *Mechanism*: Ask: "If everyone did this equally, would the system still function fairly?" If no, it’s corrupt.  

  3. **The Institutional Purpose Principle (Meanings)**  
     *Statement*: Strategy is impermissible if it *subverts the institution’s core purpose*; permissible if it aligns with it.  
     *Motivating Case*: Committee downranking for subfield gain corrupts the goal of merit-based selection. Residency-match hospitals subvert the goal of optimal matching. Lesser-evil voting aligns with electing a tolerable leader. Quadratic voting’s purpose *is* intensity expression.  
     *Mechanism*: Identify the institution’s telos. Does the act advance or undermine it?  

  ---

  ### New Cases  
  - **Random-Voter Lottery**: Strategy-proof but violates *all three principles*. It abandons preference aggregation (Truth-Telling), enables extremist tyranny (Institutional Purpose), and offers no meaningful symmetry (outcomes are random, not symmetric). Strategy-proofness is insufficient without purpose.  
  - **"Forced Honesty" Mechanisms**: Consider a prisoner’s dilemma where confessing is dominant but harmful. Strategy-proofness exists but is dystopian—it fails the Institutional Purpose test (justice) and Symmetry (both prisoners suffer).  
  - **Symmetry Rescue?**: In **approval voting**, symmetric threshold-based strategy ("approve all above X utility") is fair and functional—it passes Symmetry and Institutional Purpose (broad acceptability). In **logrolling**, if *all voters* could form symmetric coalitions (unrealistic), it might pass Symmetry but fail Institutional Purpose if it distorts budgetary efficiency.  

  ---

  ### Which Verdict I Should Give Up  
  **Give up condemning tactical ranking in IRV.** Your intuition treats IRV as a "truthful ballot" but plurality as a "game." Yet both are preference-aggregation mechanisms vulnerable to strategy. Sacrificing this verdict resolves the plurality/IRV collision: both become permissible coordination under the *Institutional Purpose Principle* (electing better candidates) and *Symmetry Principle* (all voters can do it). Retain your unease about logrolling (asymmetric access to deals) and committee corruption (subverting meritocracy). Keep rejecting false committee rankings—they violate Truth-Telling *and* Institutional Purpose.  

  ---

  ### Bottom Line  
  **Endorse the Institutional Purpose Principle.** Strategy is legitimate only when it furthers the mechanism’s core function. Plurality compromise elects viable leaders; auction shading optimizes revenue; quadratic voting expresses intensity. But IRV misranking, logrolling, or committee sabotage perverts preference aggregation, fiscal efficiency, or meritocracy. Strategy-proofness is secondary: the random-voter lottery is strategy-proof but nihilistically abandons purpose. A good mechanism minimizes *harmful* strategy by aligning incentives with institutional goals—not by naively demanding honesty.  

  —  
  *This framework accepts Gibbard-Satterthwaite’s inevitability of strategy but judges it by whether the act serves or betrays the institution’s raison d’être.*
