  ### Rules of Play

  1. **Setup**: 
     - The facilitator explains the roles, the code table, the operations, and the binding rule.
     - The pool is seeded with the starting strands.
     - Roles are assigned: 1 table keeper, 2 ribosomes, 2 enzyme appliers, and the rest can be rotating or observe initially. With 14 students, we can have multiple of each.

  2. **Game rounds**:
     - The game proceeds in rounds.
     - In each round, the following happens:
          a. **Translation phase**: Ribosomes can choose a strand from the pool and translate it into an operation sequence using the current code table. They write down the sequence of operations.
          b. **Application phase**: Enzyme appliers can choose an enzyme (a translated operation sequence) and a target strand from the pool. They check if the enzyme can bind to the target strand (same first and last codon). If yes, they apply the operations step by step to the target strand, with the table keeper available for any ED operation. They update the target strand (if it is edited) and the pool (new strands from CUT or COPY or DUP, and removed strands if applicable). 
          c. **Cleanup**: Any new strands from COPY buffers (when the enzyme finishes) are added. The used enzyme is not removed (it can be used again? or is it single-use? We'll say the enzyme is not consumed; it can be used repeatedly. The translation is not consumed either; it's just a recipe.

  3. **Token economy**: 
     - The players earn a token if they create a self-replicating configuration: that is, a strand that, when used as an enzyme and applied to itself, causes a copy of itself to appear. 
     - They earn nothing for just copying a strand without the table being involved? But in our self-replication, the table is involved because it maps TT to DUP. So it qualifies.

  4. ** winning condition**: none specified, but they can aim to earn as many tokens as possible. Or we can have the activity as a race to achieve self-replication.

  ### Timeline for 90 minutes

  - 0-10 min: Introduction and setup. Explain the analogy to DNA and formal systems. Present the alphabet, strands, and the code table. Explain the roles. Distribute materials.
  - 10-20 min: Explain the operations and the fixed mapping. Do a dry run with a small example.
  - 20-60 min: Play time. Facilitator circulates, answers questions, and nudges if they are stuck. 
  - 60-80 min: Debrief. Discuss what happened, the challenges, the philosophical points.
  - 80-90 min: Conclusion and connect to the isomorphism.

  ### Facilitator action during play:
  - Circulate and clarify rules.
  - If they are stuck, remind them of the edit operation and the dup strand.
  - If they achieve self-replication, ask them to reflect on how it happened.

  ### Predictable failure modes:
  - **Chaos from table edits**: The table is edited in a way that makes everything map to DEL or CUT, and the system becomes destructive. 
    - Fix: The table keeper can keep a backup of the initial table. Or the facilitator can allow reset.
  - ** The self-replication is not achieved because the edit enzyme is not used or not applied to the code table**.
    - Fix: The facilitator can suggest using the edit enzyme on the code table.
  - **Confusion about the roles and the process**.
    - Fix: Have a dry run with a simple example.

  ### Debrief mapping:
  - **Mutable table**: When the table is edited, the same strand can be interpreted differently. This maps to the idea that interpretation is causal and can change.
  - **Self-replication of "TT"**: It requires the table to be in a specific state. The strand "TT" is both a description (it is an enzyme that means DUP) and a mechanism (it is the target to be duplicated). This is the DNA–Gödel isomorphism: the strand is both data and code.
  - **The edit enzyme**: It changes the rules of interpretation. This is like a system that can change its own axioms.
  - ** The act of editing the table by a strand that itself was interpreted by the table**: This is a strange loop: the table is used to interpret a strand that then changes the table.

  ### Limitations:
  - This activity does not reproduce the diagonal argument or the incompleteness theorem.
  - Self-reference is made to look easier than in a formal system because we have a fixed bootstrap mapping and the edit is straightforward.
  - The self-replication we have is trivial (just one instruction) and does not capture the complexity of von Neumann's self-reproduction, which requires a universal constructor and a description.

  ### Confidence:
  - Level: Moderate. The activity should work to show the mutable interpretation and the self-replication of the trivial strand.
  - Least certain claim: That the edit of the table will lead to the intended self-replication and not to chaos. It might be that the players edit the table in a way that breaks the system, and they may not find the self-replication path.

