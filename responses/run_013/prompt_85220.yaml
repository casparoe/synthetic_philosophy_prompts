answer: |-
  ## A Defense of the Limiting-Average Principle (LAP) for Infinite Population Ethics

  Your puzzle highlights a profound challenge: standard utilitarianism (`total view`) and intuitive repairs (`finite improvement principle`) yield unacceptable results for infinite populations. I argue that the **Limiting-Average Principle (LAP)** offers the most compelling solution. LAP states: For worlds with infinite populations, W is better than W' if the limit of the average utility of the first *n* individuals (as *n* tends to infinity) is greater in W. If the limits are equal, the worlds are equally good. If one or both limits fail to exist, LAP is silent, requiring supplementation (discussed below).

  Here's my argument for adopting LAP, addressing your specific points and defending against objections:

  1.  **Handling W vs. W':**
      *   **W:** Utilities = 1, 2, 3, 4, ... Sum of first `n` utilities = `n(n+1)/2`. Average of first `n` = `(n+1)/2`. Limit as `n→∞` = `∞`.
      *   **W':** Utilities = 0, 2, 3, 4, ... Sum of first `n` utilities = `[n(n+1)/2] - 1`. Average of first `n` = `(n+1)/2 - 1/n`. Limit as `n→∞` = `∞`.
      *   **LAP Verdict:** Both have limit `∞`. Therefore, LAP declares W and W' **equally good**.
      *   **Defense:** While counterintuitive at first glance, this aligns with the fundamental insight that in infinite sets, altering a *finite* number of elements cannot change the *asymptotic average* quality of life. W' sacrifices the well-being of one individual (`1→0`) but this sacrifice becomes vanishingly insignificant relative to the overall population size as we consider larger and larger finite subsets. The "loss" is diluted to zero in the limit. LAP captures the idea that the *prevailing standard of utility* across the infinite population is identical (`∞` in both cases). The finite improvement principle correctly identified indifference here, but fails elsewhere.

  2.  **Handling Non-Converging Averages (e.g., Alternating Sequence):**
      *   **Problem:** Consider W_alt: Utilities = 1, 2, 1, 2, 1, 2, ... (repeating). The average of the first `n` utilities oscillates: `1.0` (n=1), `1.5` (n=2), `1.33` (n=3), `1.5` (n=4), ... converging to **1.5**.
      *   **LAP Verdict:** LAP handles this well. The average converges to `1.5`.
      *   **Non-Converging Example:** Consider W_nc: Utilities = 1, 0, 1, 0, 1, 0, ... (repeating). The average of the first `n` utilities: `1.0` (n=1), `0.5` (n=2), `0.666` (n=3), `0.5` (n=4), `0.6` (n=5), `0.5` (n=6) ... This oscillates indefinitely between `0.5` (for even `n`) and values approaching `0.5` from above (for odd `n > 1`). **The limit does not exist.**
      *   **LAP Limitation & Supplementation:** LAP *itself* is silent on comparisons involving W_nc or between W_nc and another world with a non-converging average. This is a weakness, but not fatal. LAP must be supplemented with a secondary principle for such cases. The most natural candidate is a **weak dominance principle**: If the average utility in W is *always* greater than or equal to the average in W' for all sufficiently large finite initial segments `n > N`, and strictly greater for infinitely many `n`, then W is better than W'. For W_nc vs. a constant utility world `U=0.4`, W_nc would be better. For W_nc vs. a constant utility world `U=0.6`, W_nc would be worse. For W_nc vs. another oscillating sequence (e.g., 2, 0, 2, 0, ...), the dominance principle would declare the latter better.

  3.  **Respecting Pareto:**
      *   **Strict Pareto (W better for at least one, worse for none, same otherwise):** LAP **violates strict Pareto** in infinite settings, as demonstrated by W vs. W'. W is better for the first individual, worse for no one, identical for all others, yet LAP declares them equally good.
      *   **Defense:** This violation is a *necessary feature*, not a bug, of *any* coherent theory for infinite populations. The core problem of infinite ethics is that standard Pareto leads to contradictions (like the W vs. W' indifference being implausible *and* the uniform 1 vs 2 indifference being implausible). LAP prioritizes the *asymptotic, large-scale* properties of the population distribution. Sacrificing strict Pareto for finite differences is the price paid to avoid the more severe contradictions plaguing the total view and the finite improvement principle. LAP *does* satisfy **Weak Pareto**: If W is strictly better for *every* individual than W', then the average for any finite `n` is strictly larger in W, implying the limit (if it exists) must be at least as large, and strictly larger if W' has a limit. If W' has no limit but W is strictly better everywhere, the dominance supplement would declare W better. Thus, LAP (+ dominance) respects unanimous strict improvement.

  4.  **Adding Infinitely Many Low-Positive Utility People:**
      *   **Objection:** Start with a finite world F (sum S, average A). Add a disjoint infinite population D where each member has low positive utility ε > 0. The new world is F+D. The average utility limit for F+D is ε (as the finite contribution from F becomes negligible). If ε < A, LAP implies F+D is *worse* than F. This seems implausible – adding happy (if barely) people shouldn't make the world worse.
      *   **LAP Verdict:** Yes, LAP implies F+D is worse than F if ε < A.
      *   **Defense:** This consequence is significant but arguably *correct* and reveals a deep truth about aggregative ethics in infinite domains:
          *   **Dilution of Value:** The finite high average of F is "diluted" down to ε by the infinite addition of people at that lower level. The *prevailing standard of living* across the vast majority of the population is now only ε, whereas it was A in F. LAP cares about the long-run average quality of life, not the sheer number of people experiencing a minimally positive life.
          *   **Focus on Quality, Not Just Quantity:** LAP reflects the intuition that simply adding more lives, even barely positive ones, doesn't necessarily improve the world *if it lowers the average standard*. A world where the overwhelming majority live at utility ε is arguably worse than a finite world where everyone lives at a significantly higher level A, even if the total "happiness sum" in the infinite world is larger (∞ > S). The total view's obsession with sum leads to the Repugnant Conclusion in finite cases; LAP avoids this *type* of repugnance in the infinite dilution case by prioritizing average quality in the limit.
          *   **Comparative Plausibility:** While counterintuitive, this consequence is arguably *less* implausible than the implications of the alternatives. The total view is completely useless (all infinite sums are infinite or undefined). The finite improvement principle cannot distinguish between vastly different *prevailing* standards of living (e.g., uniform 1 vs uniform 2). LAP provides a clear, intuitively meaningful comparison: the world with the higher long-run average quality wins.

  **Verdict and Defense Against Strongest Objections:**

  **LAP (supplemented with a dominance principle for non-converging cases) should be adopted** as the most promising principle for comparing the value of infinite populations within a utilitarian framework.

  *   **Strengths:**
      *   Provides clear, intuitive comparisons for worlds with converging average utilities (e.g., uniform populations, modified sequences like W').
      *   Avoids the total view's complete breakdown (infinite sums).
      *   Avoids the finite improvement principle's inability to compare worlds differing on an infinite set (e.g., uniform 1 vs uniform 2).
      *   Captures the ethically relevant idea of the *long-run average quality of life* prevailing in the population.
      *   Handles the W vs. W' case consistently with the asymptotic insignificance of finite changes.

  *   **Strongest Objections & Rebuttals:**
      1.  **Violates Strict Pareto (W vs. W'):** As defended above, this violation is necessary and justified. Strict Pareto is incompatible with coherent infinite aggregation. LAP preserves the *spirit* of Pareto by ensuring unanimous strict improvement (Weak Pareto + Dominance) is respected, which is the core ethical intuition. Sacrificing the finite case of strict Pareto is the cost of consistency and avoiding worse absurdities.
      2.  **Silent on Non-Converging Averages:** This is a genuine limitation. However, supplementing LAP with a dominance principle provides a workable solution for many non-converging cases. While a complete ordering for *all* conceivable utility sequences may be impossible, LAP+Dominance handles a vast and ethically significant class of comparisons far better than the alternatives. It provides a powerful tool where other tools fail completely or yield worse results.
      3.  **Implausible Dilution (Adding Low-Positive Utility Infinitely):** While challenging, this consequence aligns with the prioritization of *average quality* over *sheer quantity* when quantity is infinite. A world where almost everyone has a mediocre existence (ε) is worse, according to LAP, than a world where a finite number have excellent lives (A >> ε). This avoids the "infinite dilution repugnance" and reflects the intuition that endlessly adding minimally worthwhile lives doesn't necessarily create a better world overall if it fundamentally lowers the typical lived experience. The implausibility stems from our finite intuitions; in the infinite context, LAP's verdict is defensible.
      4.  **Dependence on Ordering:** LAP relies on the sequence order (first `n` individuals). What if we reorder the population? This is a serious metaphysical concern. LAP requires a canonical ordering or a principle that the value is determined by the *lim inf* or *lim sup* of averages over all possible orderings. However, many infinite populations (like the universes you describe) may have a natural temporal or spatial ordering. If no natural order exists, LAP might need refinement (e.g., taking the supremum of the limit infimums over all orderings). This complexity is inherent in infinite ethics but doesn't invalidate LAP's core insight applied to ordered populations.

  **Conclusion:**

  The infinite total view problem and the inadequacy of the finite improvement principle necessitate a fundamentally different approach. LAP provides a principled, intuitive, and workable solution by shifting the focus from problematic infinite sums to the asymptotic average utility. While it requires sacrificing strict Pareto for finite differences and needs supplementation for non-converging sequences, these costs are justified by LAP's ability to deliver meaningful comparisons where other principles fail catastrophically or yield clearly unacceptable results (like indifference between uniform utility levels 1 and 2). Its handling of dilution, while demanding careful consideration, highlights the importance of long-run average quality in evaluating infinite populations. Therefore, LAP, suitably supplemented, represents the most defensible foundational principle for resolving your population ethics puzzle concerning infinite worlds. It provides the clarity and coherence needed to advance your paper beyond the impasse created by the total view and the finite improvement principle.
