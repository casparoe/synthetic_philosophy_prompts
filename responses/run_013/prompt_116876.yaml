  ### Constructed Case: Legal Driving Age Threshold

  **Classification:** The minimum legal driving age (e.g., 16 years old in many U.S. states).  
  **Ordinary Use:** This threshold appears on driver's license applications, legal documents, insurance forms, and is used in everyday contexts (e.g., parents asking, "Is she old enough to drive?").

  #### (i) The cut-point is conventional  
  The choice of age 16 is arbitrary. Nothing in human biology or psychology dictates that driving competence emerges precisely at 16. Neighbouring societies use different thresholds: Germany (17 with supervision), New Jersey (17), or Alberta, Canada (14 for learner's permits in rural areas). These variations are equally justifiable—each reflects cultural, historical, or pragmatic decisions (e.g., balancing mobility needs against safety risks), not a natural boundary.

  #### (ii) The property being cut is not conventional  
  The underlying property is *neurocognitive maturity for complex tasks*, a graded, biologically rooted feature. Brain development (e.g., prefrontal cortex maturation) enhances impulse control, risk assessment, and coordination over time. This gradient is causally efficacious: it affects accident rates, reaction times, and decision-making. The ordering (younger to older) is discovered through empirical study (e.g., neuroscience and traffic safety research), not stipulated by the law.

  #### (iii) The label carries inductive weight  
  Knowing someone is "legally driving-aged" (≥16) licenses predictions that knowing their exact age or position on the maturity gradient does not. For example:  
  - **Insurance premiums:** Insurers charge lower rates for 16-year-old drivers than 15-year-olds, despite negligible maturity differences. Data from the Insurance Institute for Highway Safety shows a 20–30% drop in premiums at 16, reflecting actuarial risk assessments tied to the legal label.  
  - **Social permissions:** Parents grant unsupervised driving privileges at 16, leading to increased independence, part-time job access, and social opportunities. Surveys (e.g., AAA Foundation) confirm these shifts cluster sharply at the legal age, not at other ages.  
  - **Law enforcement:** Police disproportionately stop drivers near but under 16 for minor infractions, anticipating inexperience. Traffic stop data from states like California shows a discontinuity at age 16.  
  *Verifiability:* You can check DMV records, insurance databases, or youth employment statistics to confirm these discontinuities at 16, not at 15.9 or 16.1.

  #### (iv) Dissolving the convention would cause loss  
  Eliminating the age threshold would not merely relabel drivers. Benefits tied to the legal category—structured training programs, graduated licensing systems, and targeted safety education—would dissolve. These reduce teen crash fatalities by 10–30% (per NHTSA studies). Without the threshold, society loses a scaffold for risk management, leading to preventable harms (e.g., untrained younger drivers on roads) and eroded trust in licensing systems.

  ---

  ### Audit: Which Position Does Each Constraint Favour?  
  For each constraint, I assess which of the three positions it supports:  
  - **Constitution (C):** The classification creates the properties it tracks.  
  - **Mere registration (R):** The classification reflects an independent reality.  
  - **No fact beyond usefulness (U):** The classification is only pragmatically justified.  

  #### (i) Cut-point is conventional → Favours **U**  
  The arbitrariness of age 16 undermines **R** (no independent division exists there) and **C** (the cut-point doesn’t create maturity). It highlights usefulness: the threshold coordinates behavior (e.g., licensing systems) efficiently.

  #### (ii) Property is not conventional → Favours **R**  
  The neurocognitive gradient exists independently. Laws don’t create maturity; they map onto a discovered biological continuum. This challenges **C** (classification isn’t constitutive) and **U** (there is a fact beyond usefulness: the gradient itself).

  #### (iii) Label carries inductive weight → Favours **C**  
  The label generates new properties (e.g., insurance discounts, social privileges) not predicted by maturity alone. This performative effect—where the label reshapes behavior—supports **C**. It weakens **R** (predictions exceed the gradient) and **U** (the label’s power isn’t just about usefulness; it creates realities).

  #### (iv) Dissolving causes loss → Favours **C**  
  The loss of socially coordinated benefits (e.g., safety programs) shows the label is constitutive. Without it, real-world structures collapse, challenging **R** (it’s not just registering) and **U** (the loss isn’t merely practical; it erodes a shared normative framework).

  ---

  ### The Single Feature Allowing Both **C** and **R**  
  **Institutional embeddedness**—the integration of the classification into laws, markets, and social practices—enables both positions to hold.  
  - **R is right about the gradient:** Neurocognitive maturity exists independently.  
  - **C is right about the threshold:** The legal age *creates* new social facts (e.g., insurance rules) through institutional hooks.  

  ---

  ### Removal of Institutional Embeddedness  
  If **institutional embeddedness** is removed (e.g., no laws or systems tie privileges to age 16), the case degenerates:  
  - **Effects:**  
    - (iii) fails: The label loses inductive weight (e.g., insurers ignore age 16, parents set arbitrary ages).  
    - (iv) fails: Dissolving the convention merely renames maturity stages; nothing is lost.  
    - The gradient remains, but the classification becomes a useless marker.  
  - **Looping?** No, it does **not** degenerate into a looping case (like race/gender). Without institutions, the label doesn’t reshape the labelled: a 16-year-old’s maturity isn’t altered by the label, only social opportunities are. Looping requires feedback (e.g., gender labels shaping identity), absent here.  

  ---

  ### Viability of Constraints  
  All four constraints hold in this case. However, if forced to abandon one, I would sacrifice **(iv)**.  
  - **Cost:** Giving up (iv) implies dissolving the convention *only* renames things (e.g., "legally driving-aged" becomes "Group A"). This loses the moral urgency of socially structured goods (e.g., safety programs). It reduces the case to a pragmatic tool, ignoring how classifications sustain collective intentionality (e.g., trust in licensing).  

  This case illustrates a "quasi-constitutive" kind: biologically anchored but institutionally activated, avoiding the pitfalls of familiar looping examples.
