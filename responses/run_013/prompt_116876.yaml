  We are to construct a case of a socially constructed kind that is not race, money, or gender, and not science-fictional. It must be a concrete classification that ordinary people use (like an occupational grade, a legal threshold, or a box on a form) and satisfy four constraints:

  (i) The cut-point is conventional: nothing in the world singles it out, and a neighbouring society could have drawn it elsewhere with equal justification.
  (ii) The property being cut is not conventional: it is a graded, causally efficacious feature that the classification did not create, and the ordering it imposes is discovered rather than stipulated.
  (iii) The label carries inductive weight that the underlying gradient does not — knowing that something falls under it licenses predictions about its unobserved features that knowing its position on the gradient, or that it falls somewhere on the gradient, would not.
  (iv) Dissolving the convention would not merely rename anything; something we have reason to care about would be lost.

  We then audit the case for each constraint and see which of three positions it favours: constitution, mere registration, or no fact beyond usefulness. We must identify the single feature that lets the first two positions each be right about a different part of the case and see what happens when that feature is removed. If we think the constraints cannot all be met, we name the one we would give up and the cost.

  Let's choose a case: **The poverty line (or threshold for being classified as "poor" in a society)**.

  ### The Case: The Poverty Line

  In many countries, there is an official poverty line, often defined as a certain income level (e.g., the federal poverty line in the US). This line is used to determine eligibility for social programs, benefits, and to track poverty rates.

  #### (i) The cut-point is conventional
  The exact income level that defines the poverty line is set by convention. For example, in the US, the poverty line was originally based on the cost of a minimal food diet multiplied by three (since food was about one-third of household expenses). But why three? Why not 3.5 or 2.5? Different countries set different poverty lines. A neighbouring society (say, Canada) might set a different threshold. There is no natural, non-arbitrary point at which someone becomes "poor" — it is a matter of social agreement.

  #### (ii) The property being cut is not conventional
  The underlying property is economic well-being, which is a graded (continuous) and causally efficacious feature. Having more or less income affects one's health, opportunities, and life outcomes. The ordering (from less income to more) is discovered: we observe that people with lower income have worse outcomes in various dimensions (health, education, etc.). The classification did not create the economic gradient; it exists independently.

  #### (iii) The label carries inductive weight
  Knowing that someone is classified as "poor" (below the poverty line) licenses predictions that knowing their exact income (or that they have a low income) does not. For instance:
  - In the US, being below the poverty line makes one eligible for Medicaid, SNAP (food stamps), and other programs. Thus, knowing someone is below the line predicts they have access to these benefits, which in turn affects their health and nutrition.
  - It also predicts social stigma and psychological impacts (feeling of being poor) that might not be linearly tied to income but are triggered by the label.
  - Moreover, in research, the poverty line is used to group people and study outcomes. If we only knew that someone had an income of $X, we might not be able to predict as well their access to certain benefits or their subjective experience of poverty without the threshold.

  But note: we must avoid stipulating the inductive success and make it something we can check. We can check by looking at the differences in outcomes for people just below and just above the poverty line (regression discontinuity design). For example:
  - People just below the line (and thus classified as poor) are more likely to enroll in and receive benefits from social programs than those just above, even though their actual income is very similar. This leads to measurable differences in health outcomes, food security, etc.
  - Also, in contexts where the label "poor" is applied (e.g., in school settings for free lunch programs), children might experience stigma or support that affects their development.

  #### (iv) Dissolving the convention would not merely rename anything
  If we eliminated the poverty line, we wouldn't just be renaming the same set of people. The consequences of the label (access to benefits, social perceptions) would disappear. Without the threshold, we might have a continuous measure of income, but the specific benefits and social reactions tied to the threshold would be lost. This matters because the benefits (like food assistance) are crucial for the well-being of the poor. Also, the label serves as a focal point for social policy and advocacy.

  ### Audit the Case for Each Constraint

  We now consider for each constraint which of the three positions it favours:

  1. **Constitution**: The classification constitutes its members (i.e., the category brings into being the very properties that define it).
  2. **Mere registration**: The classification merely registers an independent division in the world.
  3. **No fact beyond usefulness**: There is no fact of the matter beyond the usefulness of the classification.

  #### Constraint (i): The cut-point is conventional
  - This constraint highlights that the exact location of the threshold is arbitrary. This favours the "no fact beyond usefulness" position because the choice of the cut-point is driven by practical considerations and could be set elsewhere without being objectively wrong. However, it also challenges the "mere registration" position because there is no independent division at that exact point. But note: the property (economic well-being) is independent and graded, so the registration idea might still hold for the underlying gradient.

  #### Constraint (ii): The property being cut is not conventional
  - This constraint supports the "mere registration" position because the underlying gradient (income/wealth affecting well-being) exists independently and is causally efficacious. The classification does not create the gradient; it only tries to capture a part of it.

  #### Constraint (iii): The label carries inductive weight
  - This constraint suggests that the label has real effects beyond the gradient. This supports the "constitution" position because the label itself (being classified as poor) brings about new properties (like eligibility for benefits and social reactions) that are not present in the gradient alone. However, note that the label's predictive power comes from the social conventions and institutions built around it (like laws that tie benefits to the threshold). Thus, the label is not merely descriptive; it is performative.

  #### Constraint (iv): Dissolving the convention would cause loss
  - This constraint also supports the "constitution" position because it shows that the convention creates something (the benefits and the social meaning) that would be lost if the convention were dissolved. It also challenges the "mere registration" position because it shows that the classification is not just reflecting an independent reality but adding to it.

  ### Identifying the Single Feature

  The single feature that lets the first two positions (constitution and mere registration) each be right about a different part of the case is: **the interaction between the independent gradient and the socially constructed threshold**.

  - The "mere registration" position is right about the underlying gradient: economic well-being is independent and causally efficacious.
  - The "constitution" position is right about the threshold: the label "poor" (as defined by the conventional cut-point) creates new social and institutional realities (e.g., eligibility for benefits) that are not present in the gradient alone.

  Thus, the case has two layers: an independent reality (the gradient) and a socially constructed layer (the threshold and its consequences).

  ### What if we remove that feature?

  If we remove the interaction (i.e., the threshold does not have any institutional or social consequences tied to it), then the case degenerates. The label would not carry any inductive weight (constraint iii fails) and dissolving the convention would merely rename the group (constraint iv fails). We would be left with a simple registration of the gradient, but without the threshold having any special significance. This would be similar to a case where we have a continuous measure and we arbitrarily label some segment, but without any real-world effect. Then, the constitution aspect disappears and we are left with a mere registration (or perhaps no fact beyond usefulness if the threshold is arbitrary and without effect).

  But note: if we remove the institutional/social consequences, then the label does not reshape the labelled. So it does not degenerate into the familiar looping case (like in race or gender, where the label can reshape the labelled). In the poverty case, without the institutional consequences, there is no reshaping. The looping effect comes from the institutional and social reactions (e.g., being denied opportunities because of the label, which then perpetuates poverty). So without that, the looping effect is absent.

  Therefore, the critical feature is the institutionalization of the threshold (the fact that the threshold is tied to concrete benefits and social meanings).

  ### Could all constraints be met? 

  In the case of the poverty line, we can meet all four constraints. However, one might argue that constraint (iii) might be challenged: does the poverty line really carry inductive weight beyond the gradient? We can check by empirical research (as mentioned: regression discontinuity designs at the threshold). The evidence is that crossing the threshold does lead to discontinuous changes in outcomes, so the label does add predictive power.

  But note: the inductive weight is due to the social and institutional context. If we change the context (e.g., remove the benefits tied to the poverty line), then the label loses its inductive weight. However, in a society that uses the poverty line as we do, the constraint holds.

  ### Conclusion

  We have built the case of the poverty line. It meets all four constraints. The audit shows:

  - (i) Favours "no fact beyond usefulness" for the cut-point, but note that the underlying gradient is real.
  - (ii) Favours "mere registration" for the underlying property.
  - (iii) and (iv) Favours "constitution" for the label and its consequences.

  The single feature that allows both "mere registration" (for the gradient) and "constitution" (for the threshold) is the institutional and social embedding of the threshold, which creates new properties (like eligibility) that are not in the gradient alone.

  Without that institutional embedding (the feature), the case would lose the inductive weight and the loss upon dissolution, and it would not loop. It would just be an arbitrary mark on a continuous scale.

  Thus, the poverty line is a good example of a socially constructed kind that is not reducible to either mere convention or mere discovery.
