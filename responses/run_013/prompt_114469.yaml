prompt: |-
  Hofstadter's careenium — a table covered in tiny magnetic marbles, simms, which clump into clusters, simmballs, that then knock one another about — has what seems to me a live analogue in current interpretability research. A researcher trains a probe on a model's internal activations, finds a direction that decodes some concept, adds that direction back into the activations, watches the output shift accordingly, and reports that the model was representing the concept and that the representation drove what it said. The same researcher, pressed on whether such a model represents anything at all, replies that it is only arithmetic on vectors and that nothing at the level of concepts does any pushing; the field also distinguishes features a model merely makes decodable from features it actually uses. What commitments does this practice presuppose? Does it need the feature to be a genuine cause at the level of the pattern, or is it equally at home with the thought that only the arithmetic pushes and the feature is an inert summary — or with the intermediate view that there is no higher-level causation, only higher-level intervention, so that steering a feature is merely a tidy way of nudging the arithmetic? Reconstruct the implicit theory of levels, causes and explanation that the practice carries, separate what it strictly needs from what it merely suits, and say what would have to change in it if one took seriously the idea that only simms shove. Answer in no more than 350 words, in British English.
reasoning: |-
  Hmm, this is a fascinating philosophical question about interpretability research in AI. The user is drawing an analogy between Hofstadter's "careenium" thought experiment and current practices in probing neural networks. They're asking about the implicit commitments researchers make when they treat discovered "features" as causal drivers of model behaviour.

  First I need to unpack the core tension they're highlighting: Researchers simultaneously claim that (a) they've found a "representation" that "drives" output when intervened upon, yet (b) maintain that ultimately "only arithmetic on vectors" does any real causal work. The user wants to know what metaphysical baggage this practice carries regarding levels of causation.

  The careenium analogy is particularly apt. Just as simmballs emerge from simms but appear to have causal efficacy, neural network features emerge from vector arithmetic but are treated as manipulable entities. The key question is whether researchers are secretly committed to "pattern-level causation" or if they're just using convenient fictions.

  I should reconstruct the implicit theory: Researchers likely adopt a pragmatic interventionist view where "steering features" is epistemically valid (it reliably changes outputs) without requiring ontological commitment to higher-level causality. They strictly need only counterfactual dependence: "If we perturb vector X along direction Y, output Z changes predictably." The "representation" language is heuristic.

  But there's tension. When pressed, researchers retreat to micro-level causation ("only simms shove"), yet their intervention practice treats features as causal handles. This suggests they're comfortable with what philosophers call "difference-making" causation at the pattern level, even if they deny "oomph" causation at that level.

  If we took "only simms shove" seriously, interpretability would need to reframe findings strictly in terms of how micro-perturbations propagate through computational graphs. But this would lose explanatory power. The practice implicitly assumes that higher-level interventions track real computational structure - that features aren't just inert summaries but correspond to how the network organizes information.

  The user seems philosophically sophisticated - they're probably familiar with concepts like supervenience and multiple realizability. I should avoid jargon but address the underlying metaphysics. Their real concern might be whether interpretability research is smuggling in dualist assumptions while claiming reductionism.
answer: |-
  This practice presupposes an *interventionist* theory of causation at the pattern level, implicitly adopting a pragmatic stance on levels of explanation. It strictly requires **counterfactual dependence**: intervening on a specific vector direction reliably alters the output in a semantically meaningful way. This demonstrates that the feature is a *difference-maker* for the model's behaviour.

  The researcher's dual language reveals a distinction:
  1.  **Explanatory Level (Pattern):** The feature is treated as a manipulable cause *for explanation and control*. Adding the direction and observing the change justifies claims like "the representation drove the output" *at that level of description*. It needs the feature to be a reliable *handle* for intervention.
  2.  **Implementational Level (Simms/Arithmetic):** Retreating to "only arithmetic pushes" acknowledges the fundamental physical/computational substrate. The practice *does not strictly need* the feature to possess intrinsic causal "oomph" at the pattern level, only that interventions *targeting* it (via vector arithmetic) are predictably effective.

  It is **equally at home with the inert summary or intermediate view**. The key commitment is **systematic manipulability**, not ontological causation at the higher level. The feature being an "inert summary" is compatible, so long as manipulating *that specific summary direction* consistently produces the expected semantic shift. The "intermediate view" (higher-level intervention, not causation) fits perfectly: steering the feature is a "tidy nudge" precisely because it leverages the underlying arithmetic structure in a semantically coherent way.

  **Taking "only simms shove" seriously** would necessitate a significant shift. The practice would need to:
  1.  **Drop representationalist language:** Stop saying the model "represents X" or the "representation drives Y". Language would focus solely on correlations and intervention effects within the vector space.
  2.  **Reframe explanations:** Causation would *only* be described in terms of vector operations and activation flow paths. Explaining *why* a particular direction correlates with a concept becomes describing the training dynamics that forged that specific arithmetic relationship.
  3.  **Emphasise emergence:** Findings would be presented strictly as emergent properties of the low-level arithmetic, devoid of inherent meaning or causal power at the concept level. The "feature" is merely a stable pattern *we* find useful for prediction and control via intervention, not a functional component within the model's operation.

  The core practice of probing and intervening could remain, but its interpretation and the claims derived from it would become radically deflationary, shifting entirely to the dynamics of the "simms".
