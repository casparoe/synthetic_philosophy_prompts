prompt: |-
  Okay, so I'm building a handout for the final week of my ethics-of-markets seminar, and I keep going around in circles trying to lay out the commodification/repugnant-markets debate in a way that doesn't just collapse into "Sandel says some things shouldn't be for sale, libertarians say everything can be." The problem with every taxonomy I've seen is that it sorts people by the label they like rather than by what they actually think about cases, so students just pick a team and stop thinking.

  What I want from you: a decision tree (a taxonomy is fine too if the material really wants that shape) that takes someone from a starting commitment about a case to a named position on whether some goods should be off the market. Six to nine internal nodes, six to nine leaves. Every internal node should be a concrete question a student could answer *before* knowing where it leads -- no "do you believe in corrupting goods?" nodes. Each leaf should carry the name of the position (or "unnamed" if nobody actually defends it) plus one sentence on that position's most awkward commitment. Flag any two leaves your tree can't really separate, and if there are combinations of answers that nobody occupies, say so and give me your best guess at why (incoherent? just unattractive? nobody's bothered?).

  I need these views to show up as leaves: (a) the "markets without limits" line that says there's no such thing as a good that's intrinsically off-market; (b) the corruption-of-meaning view that selling a good changes what it is; (c) the view that the real objection to kidney sales and surrogacy is background injustice and exploitation, not commodification as such; (d) a voluntarist/consent-only view; (e) the "conventionalist" view that repugnance is just a social fact that drifts over time. If you can squeeze in a view that says the institution, not the individual transaction, is what does the dirty work, please do.

  Cases that must appear somewhere in the branches: kidney sales, hurricane price gouging, vote selling, paying a stranger to be your friend, commercial surrogacy, and selling your spot in a queue.

  Here's the angle I actually care about, because it's what I've been pushing in lecture and it's not the standard framing. I want the tree to cut along three distinctions:
  1. Does the objection target the *transfer itself* or the *existence of the market*? (Loads of students say "commodification" when they mean "this particular deal is coerced.")
  2. My "reversibility test": imagine the transaction reversed, with the money flowing the other way -- does the objection flip sign? If it does, you're probably tracking a distributive complaint dressed up as a commodification complaint. I think this one does a lot of work and I want a node for it.
  3. Whether the good is being used as a means by the *parties*, versus being turned into a means by the *institution* that surrounds them.

  Keep it pitched at smart undergrads who've read a bit but not specialists. Casual, no jargon for its own sake. And at the very end, after the tree, give me a one-sentence summary of which single distinction you think does the most sorting work -- last line, formatted exactly as: Summary: <your sentence>.
reasoning: |-
  Okay, the user is building a handout for an ethics seminar on markets and commodification. They're frustrated with existing taxonomies that oversimplify the debate into Sandel vs. libertarians, leading students to pick teams instead of thinking critically. 

  Hmm... their core need is a decision tree that forces students to engage with concrete cases before landing on philosophical labels. They want to highlight three key distinctions: (1) whether the objection is about individual transactions vs. market existence, (2) if reversing money flow changes the objection (their "reversibility test"), and (3) whether harm comes from parties using goods as means vs. institutional framing. 

  The user seems passionate about their "reversibility test" – that's clearly their original contribution to the framing. I should make sure it's central. They also mentioned specific cases (kidneys, vote selling, etc.) and required positions (markets without limits, corruption view, etc.) that must fit into the leaves. 

  Noticing they dislike abstract nodes like "do you believe in corrupting goods?" – every question must be answerable based on concrete cases. Smart constraint. And they want awkward commitments highlighted for each position to prevent idealized versions. 

  *Brainstorming the tree structure*... The entry point should be about what feels wrong in a specific case, since that's how students experience the debate. Then branch using their three distinctions, with reversibility early – it's their pet idea. Cases can be clustered thematically: body (kidneys/surrogacy), political (votes), social (friendship), emergencies (gouging), trivialities (queue spots). 

  *Potential pitfall*: Some positions might share answers until the last branches. For example, corruption theorists and institutionalists both think markets change meaning, but one focuses on the good itself, the other on social framing. Need a sharp question to separate them, maybe about whether removing money would restore the good's "pure" state. 

  *For the summary*... Their reversibility test seems most powerful for exposing hidden distributive concerns. Should end with that punchline as requested: "Summary: The reversibility test best separates objections to commodification itself from distributive concerns masquerading as such."
answer: |-
  Here's a decision tree designed to cut across labels using concrete cases and your key distinctions. It starts with a specific case and builds to a position.

  **The "What's *Really* Wrong With Selling That?" Decision Tree**

  *(Start by picking one case: Kidney Sales, Hurricane Price Gouging, Vote Selling, Paying for Friendship, Commercial Surrogacy, Selling Queue Spot)*

  1.  **Regarding this specific transaction, does the problem seem to disappear if we imagine the buyer and seller switching roles AND the money flowing in the opposite direction?** (e.g., Paying someone to be your friend vs. Paying someone to *let you* be *their* friend; Selling your vote vs. Buying someone's vote)
      *   **Yes, the problem flips or disappears → Go to 2A**
      *   **No, the problem feels similar or worse → Go to 2B**

  **Branch A (Reversibility Matters):**

  2.  **A1: Is the core problem that one party (usually the seller) is being pressured, desperate, or lacks real alternatives?** (e.g., Kidney seller in poverty, Surrogate needing money, Gouging victim needing water)
      *   **Yes → Leaf: Background Injustice/Exploitation View.** *Awkward Commitment: Must defend why similar levels of desperation in non-market contexts (e.g., dangerous jobs taken from need, unpaid favors for survival) don't trigger the same intense objection to the "transaction".*
      *   **No → Go to 2B** (Even if reversible, problem persists? Explore intrinsic objections)

  **Branch B (Reversibility Doesn't Matter / Problem Persists):**

  2.  **B1: Is the core problem that *this specific act* of buying/selling feels degrading, disrespectful, or treats a person/thing merely as a tool *for the other party*?** (e.g., Paying for friendship feels fake/degrading *right now*, Selling a vote feels like betraying citizenship *in this act*)
      *   **Yes → Go to 3A**
      *   **No → Go to 3B**

  3.  **A2: Does the problem vanish if the transaction is non-monetary (gift, trade, favor)?** (e.g., Donating a kidney feels ok, giving up your queue spot to be nice feels ok, voting as a favor feels wrong regardless of money)
      *   **Yes → Leaf: Voluntarist/Consent-Only View.** *Awkward Commitment: Must accept markets in *anything* where genuine consent exists, no matter how repugnant (e.g., consensual cannibalism, voluntary slavery contracts).*
      *   **No → Leaf: Transactional Corruption View.** (A form of Corruption of Meaning focused on the act itself). *Awkward Commitment: Struggles to explain why *non*-market exchanges (like pressured favors or coercive gifts) of the same good might be equally or more corrupting.*

  4.  **B2: Is the core problem that *allowing a market* for this good changes what the good fundamentally *is* or *means* in society, regardless of individual motives?** (e.g., Markets for votes change the meaning of citizenship, markets for friendship change the nature of trust, markets for surrogacy change the meaning of parenthood)
      *   **Yes → Leaf: Social Meaning Corruption View.** *Awkward Commitment: Must explain how the market *itself* changes meaning even if some individual transactions seem benign, and why this change is necessarily bad.*
      *   **No → Go to 4**

  5.  **B3: Is the core problem that *having a market framework* (prices, advertising, professional sellers) creates harmful pressures, incentives, or social dynamics that wouldn't exist with isolated gifts or barters?** (e.g., A kidney *market* incentivizes exploitation and targets the poor; a friendship *market* commodifies social interaction broadly; a surrogacy *market* risks turning women's bodies into factories)
      *   **Yes → Leaf: Institutional Harm View.** *Awkward Commitment: Needs to show why regulating individual transactions within a market framework is insufficient to prevent these systemic harms.*
      *   **No → Go to 4**

  6.  **4: Does the objection feel primarily based on a strong, instinctive feeling of disgust or "yuck," even if you can't articulate a clear harm or corruption?** (e.g., Selling used underwear, certain organ sales, maybe queue spots for vital services)
      *   **Yes → Leaf: Conventionalist/Repugnance View.** *Awkward Commitment: Admits the objection is socially contingent and offers no stable moral principle, making it vulnerable to change and hard to defend against charges of prejudice.*
      *   **No → Leaf: Markets Without Limits.** *Awkward Commitment: Must defend the moral permissibility of *any* consensual market transaction, no matter how intuitively repugnant (e.g., voluntary gladiatorial combat to the death for pay).*

  **Key Notes on the Tree:**

  *   **Flagged Overlap:** The **Transactional Corruption View** and the **Social Meaning Corruption View** are hard to sharply separate in practice. Someone might believe the individual act *is* corrupting *because* it participates in or reinforces the broader social meaning shift caused by the market's existence. The tree tries to separate them by focus (single act vs. societal meaning change), but the line is blurry.
  *   **Empty Node?** The path leading to **Markets Without Limits** (No on B1, No on B2, No on B3, No on 4) requires answering "No" to *all* potential intrinsic objections. It's logically possible but likely rare; most people find *something* intuitively off about *some* market. This node exists primarily to define the boundary case. *Why empty?* Intrinsic repugnance or concerns about systemic harm are widespread; consistently rejecting all such objections is philosophically demanding and intuitively unattractive.
  *   **"Unnamed" Position:** The **Transactional Corruption View** isn't always explicitly named but is a common intuitive stance (e.g., "Paying for friendship *in this instance* just feels wrong, it corrupts the act").
  *   **Your Key Distinctions Incorporated:**
      *   **(Transfer vs. Market):** Branch B separates transactional focus (3A) from market/institutional focus (3B & B3).
      *   **(Reversibility Test):** The very first node (1).
      *   **(Parties vs. Institution):** Branch B1 (Parties) vs. Branch B2/B3 (Institution/Social Meaning).

  **Summary: The reversibility test best separates objections rooted in background injustice/coercion from objections targeting commodification itself.**
