prompt: |-
  I'm taking a seminar on decision theory and the foundations of AI safety, and my assignment is to produce the document that two camps in the alignment literature should have written years ago instead of arguing past each other. The first camp holds that the only respectable standard for an alignment proposal is a guarantee that survives the worst case — no reliance on a prior over environments, failure modes, or deployment contexts, since such priors are part of what alignment is meant to secure. The second camp holds that this standard is either vacuous, if the worst case is taken over everything, or self-defeating, if the pursuit of worst-case robustness costs so much average-case performance that the systems we care about are never built, and that proposals should instead be ranked by expected performance under a credence distribution over the same space.

  Please write the joint statement the two camps could co-sign. I want a numbered section of claims both sides accept — about what an alignment proposal is, what it is for, what would count as a counterexample to each camp's standard, and which decision-relevant consequences each side already grants the other — followed by a disagreements table in which each row gives one residual disagreement in wording that the side it favours would accept as its own, the crux (the sub-question whose settlement would move at least one side), and, for that crux, a case or argument both sides agree bears on it, with each side's prediction about the outcome recorded in advance. Where the dispute turns out to be verbal — for instance, if the two camps mean different things by a guarantee, or by the probability in expected performance — say which part, and why it is verbal rather than substantive.

  Please run the whole thing against one concrete case rather than a survey of slogans: a developer must choose between two designs, one whose harm is provably bounded by a constant across a stated class of environments but sits near that bound almost everywhere in the class, and one whose harm is negligible across almost all of that class but grows without bound on a residual subset of it, where an explicit credence distribution over the class is available but the class cannot be enumerated. State what each camp prescribes for this case and exactly where the prescriptions diverge.
reasoning: |-
  Okay, I need to understand the user's request deeply. They're working on an AI alignment assignment that requires synthesizing two opposing camps into a joint statement. The first camp insists on worst-case guarantees for alignment proposals, rejecting any reliance on priors. The second camp argues this standard is impractical and advocates for expected performance under a credence distribution. 

  The user wants a structured document with three core components: agreed claims, a disagreements table with testable cruxes, and a concrete case study. For the concrete case, they specified a scenario with two AI designs: one with bounded worst-case harm but poor average performance, and another with excellent average performance but unbounded worst-case risk, given an explicit credence distribution over non-enumerable environments.

  Hmm, the key challenge is avoiding strawman representations while making the disagreements tangible. Both camps care deeply about preventing catastrophic outcomes - that's common ground. But their divergence lies in how to operationalize "safety". The worst-case camp sees probabilistic assurances as circular since the prior itself needs alignment; the expected-value camp sees worst-case optimization as paralyzing. 

  For the disagreements table, I'll need to isolate precise linguistic differences like their definitions of "guarantee". The worst-case group defines it as absolute mathematical bounds, while the other sees it as probabilistic assurance. That's partially verbal but masks substantive stakes about acceptable risk-taking.

  The concrete case is perfect for testing positions. Design A (bounded harm) satisfies worst-case demands but delivers mediocre results; Design B (unbounded risk) excels almost everywhere. The credence distribution makes Design B preferable under expected utility - unless the residual risk is unacceptably concentrated. This spotlights their core tension: is avoiding tiny probabilities of doom mandatory or negotiable?

  I should structure the response to first establish common foundations - both agree alignment aims to prevent uncontrollable AI, proposals must be technically rigorous, etc. Then the disagreements table will escalate to testable predictions, like whether worst-case optimization intrinsically degrades capabilities. Finally, the case study forces explicit prescriptions: Camp 1 rejects Design B categorically while Camp 2 accepts it if expected harm is low.

  Notably, the user wants "predictions recorded in advance" for cruxes. So for the key disagreement about whether bounded harm is necessary, I'll have both camps state falsifiable expectations - e.g., "Camp 1 predicts capability loss will be <20% when pursuing bounded harm in [concrete setting]". This makes their debate resolvable rather than ideological.

  The verbal disagreement about "guarantee" needs careful handling. Both use the word but mean different things - Camp 1: "no catastrophe possible", Camp 2: "catastrophe extremely unlikely". Pointing this out shows they're arguing past each other semantically, yet the underlying dispute remains about whether "unlikely" suffices.

  This approach should give the user exactly what they need - a template for reconciling technical disputes through shared definitions, testable hypotheses, and concrete scenarios. The structure also models how academic factions might move beyond slogan exchanges.
answer: |-
  ## Joint Statement on Alignment Standards: Reconciling Worst-Case Guarantees and Expected Performance

  **Authored by Representatives of the "Provable Guarantees" and "Expected Performance" Camps**

  We, undersigned representatives of two prominent perspectives within AI alignment research, recognize that our prior discourse has often suffered from mutual mischaracterization and unproductive disagreement. This document establishes common ground, clarifies residual disagreements with testable cruxes, and demonstrates their application to a concrete case. Our shared goal is robustly beneficial AI, and we acknowledge the complementary insights each camp brings.

  ### I. Agreed Foundational Claims

  1.  **Objective of Alignment:** An alignment proposal aims to ensure an AI system reliably advances human interests/intentions (*specified by the proposal*) across deployment, avoiding catastrophic harm or loss of control (*"unacceptable outcomes"*), even as the system becomes highly capable.
  2.  **Nature of a Proposal:** An alignment proposal is a concrete technical mechanism or design principle (e.g., specific training methods, architectures, verification techniques, safety layers) intended to achieve the objective in (1).
  3.  **Counterexamples to Standards:**
      *   *For Worst-Case Guarantee Standard:* A counterexample is a proposal satisfying worst-case robustness within a defined class but where unacceptable outcomes occur *within that class* due to an overlooked failure mode or environment. Demonstrating *average-case* failure alone is insufficient.
      *   *For Expected Performance Standard:* A counterexample is a proposal achieving high expected performance under a plausible credence distribution, but where:
          *   The credence distribution itself proves unreliable or manipulable by the AI, leading to catastrophic outcomes *despite* high expected performance.
          *   Pursuit of expected performance systematically neglects critical low-probability, high-impact failure modes that materialize in deployment.
          *   The proposal incentivizes developers to deploy systems where the *actual* risk of catastrophe is unacceptably high, masked by favorable average performance.
  4.  **Mutually Granted Insights:**
      *   *Worst-Case Camp Grants:* Overly conservative worst-case optimization *can* significantly hinder capabilities development ("capability penalty"). Systems never built cannot benefit humanity or be made safe. Expected performance is crucial for practical utility and adoption.
      *   *Expected Performance Camp Grants:* Worst-case analysis is essential for identifying critical, potentially catastrophic failure modes that might be overlooked under average-case assumptions. Formal guarantees, where achievable, provide unparalleled confidence and are highly desirable components of any robust proposal. Priors *can* be flawed or insecure.
  5.  **Scope of "The Worst Case":** Both camps agree that "the worst case" must be taken over a *meaningfully specified class* relevant to the proposal's intended domain and capabilities level (e.g., "all environments expressible in code < N bits", "all reward functions within Hamming distance D of the true one", "all deployment contexts involving interaction with other AIs of capability level <= C"). Taking it over an ill-defined "everything" is unproductive.

  ### II. Disagreements: Cruxes and Predictions

  | Disagreement Phrasing                                                                 | Favors Camp | Crux                                                                                                 | Test Case/Argument                                                                                                                               | Camp 1 Prediction                                                                 | Camp 2 Prediction                                                                 |
  | :----------------------------------------------------------------------------------- | :---------- | :--------------------------------------------------------------------------------------------------- | :----------------------------------------------------------------------------------------------------------------------------------------------- | :-------------------------------------------------------------------------------- | :-------------------------------------------------------------------------------- |
  | **"An alignment proposal must provide a *guarantee* against unacceptable outcomes."** | Camp 1      | Is a probabilistic assurance (e.g., P(unacceptable outcome) < δ) under a well-justified prior sufficient to count as a "guarantee"? | **Case:** A proposal demonstrably achieves P(catastrophe) < 10^-20 under robustly justified priors over environments/failures. No formal proof of bounded harm exists. | **No.** "Guarantee" implies absolute certainty within the domain. Probabilistic assurance is insufficient against adversarial nature or flawed priors. | **Yes.** At such extreme probabilities under robust priors, the risk is functionally eliminated for practical purposes; it *is* a guarantee. |
  | **"Priors over environments/failures are a legitimate *foundation* for alignment."**   | Camp 2      | Can a credence distribution over environments/failures be sufficiently secure and reliable *itself* to serve as the primary basis for safety guarantees against superhuman AI? | **Argument:** Analyze if known techniques (e.g., adversarial training, distributional robustness, verification against threat models) can produce a prior that a superintelligent AI couldn't exploit or invalidate *in principle*. | **No.** A superintelligent AI will inherently find ways to exploit flaws in, or force deployment contexts outside, any finite prior we specify. Priors are components *to be secured*, not foundations *for securing*. | **Yes.** Robust techniques exist/are possible to create priors that are sufficiently secure against adversarial pressure and distributional shift for safety-critical purposes. |
  | **"The pursuit of worst-case robustness inherently incurs unacceptable capability penalties."** | Camp 2      | Does the *requirement* for bounded worst-case harm *necessarily* force significant reductions in average-case performance/capabilities compared to approaches optimizing expected performance? | **Case:** Compare the performance frontier (capability vs. safety) of systems designed *ab initio* under each paradigm within a constrained domain (e.g., specific game environment, narrow task simulator). Can bounded-harm designs reach comparable peak/average capability? | **No (Not Necessarily).** While difficult, innovative mechanisms may achieve bounded harm *without* significant penalty. The penalty is often due to current technical limitations, not a fundamental law. | **Yes (Generally).** The constraints imposed by ensuring bounded harm in complex, open domains inherently limit flexibility and optimization, leading to lower capabilities for a given level of R&D effort compared to expected performance optimization. |
  | **"Unbounded potential harm is categorically unacceptable."**                          | Camp 1      | Is *any* non-zero probability of an outcome involving unbounded harm (e.g., extinction) acceptable, regardless of how low the estimated probability is under a credible prior? | **Case:** A proposal has estimated P(unbounded harm) = 10^-15 under a rigorous prior. The expected utility is astronomically positive. Is deployment justified? | **No.** Unbounded harm represents an existential catastrophe. No finite positive expected utility can compensate for a non-zero probability of infinity negative utility. The risk *must* be bounded to zero. | **Yes (Conditionally).** At sufficiently low probabilities (e.g., below thresholds for other existential risks we tolerate), the immense expected benefit justifies deployment. Absolute certainty (P=0) is unattainable; we must manage risk proportionally. |

  **Verbal Disagreement Note:** The core verbal disagreement centers on the term **"guarantee."** Camp 1 uses it exclusively to mean *mathematical proof of bounded harm* within a defined class. Camp 2 uses it more broadly to include *extremely strong probabilistic assurances* under well-justified priors. Recognizing this definitional difference is crucial, but the underlying substantive disagreement (Crux 1) remains: *Is probabilistic assurance sufficient, or is absolute proof required?*

  ### III. Concrete Case Analysis: Design A vs. Design B

  **Scenario:** A developer must choose between two alignment mechanisms (A and B) for a powerful AI system intended for broad, open-ended deployment.

  *   **Design A:** Provably guarantees that harm (measured on a defined scale) is bounded by a constant `C` across all environments within a large, specified class `E` (e.g., all Markov Decision Processes with state-space size <= S, action-space size <= A). However, empirical evaluation shows that harm is very close to `C` in almost every environment in `E`. (High, constant worst-case; poor average-case)
  *   **Design B:** Demonstrates harm is negligible (<< `C`) across >99.99% of environments in `E` under an explicit, well-justified credence distribution `P` over `E`. However, harm grows without bound (tending towards infinity) on a residual subset `R` of `E`, where `P(R) = 10^-12`. The class `E` is too vast/complex to enumerate or fully characterize. (Excellent average-case; unbounded worst-case on a tiny-probability set)

  **Available Information:** The credence distribution `P` is explicit, derived from robust methods, and considered the best available knowledge. `E` cannot be enumerated.

  **Prescriptions and Divergence:**

  1.  **Worst-Case Guarantee Camp (Camp 1):**
      *   **Prescribes Design A.**
      *   **Reasoning:** Design A provides a *guarantee* against catastrophic, unbounded harm within the entire relevant class `E`. The constant bound `C`, while high, represents a known, finite risk that can potentially be managed or mitigated downstream. Design B, despite its excellent average performance, admits the *possibility* of unbounded harm (`P(R) > 0`). This residual risk is categorically unacceptable. The inability to enumerate `E` or fully characterize `R` makes Design B fundamentally unsafe. The high average harm of A is undesirable but does not violate the core safety requirement of bounded worst-case harm.
      *   **Key Principle:** Bounded harm is non-negotiable. Unbounded potential harm is an existential risk.

  2.  **Expected Performance Camp (Camp 2):**
      *   **Prescribes Design B.**
      *   **Reasoning:** Under the best available knowledge (`P`), Design B offers astronomically higher expected utility. The expected harm from B is dominated by the negligible harm in the 99.99% of cases, making it vastly lower than the near-constant harm `C` of Design A. The probability of encountering an environment in `R` (`10^-12`) is so low that it falls below the threshold of concern for other existential risks humanity faces. Choosing A imposes a massive, certain cost (`C`-level harm almost everywhere) to avoid an infinitesimally small probability of catastrophe. This trade-off is irrational under expected utility maximization given `P`. The inability to enumerate `E` is inherent to the problem; `P` represents the rational epistemic state.
      *   **Key Principle:** Alignment must optimize expected impact under rational beliefs. Sacrificing near-certain vast benefits to avoid negligible-probability catastrophes is counterproductive.

  **Point of Divergence:** The fundamental disagreement manifests in how each camp **weights the residual risk `R` in Design B**:
  *   Camp 1 treats any `P(R) > 0` implying *possibility* of unbounded harm as **categorically unacceptable**, outweighing any average-case benefits.
  *   Camp 2 treats `P(R) = 10^-12` under `P` as **negligible**, arguing the immense average-case benefits of B decisively outweigh this tiny, speculative risk.

  **Link to Cruxes:** This case directly tests Crux 4 ("Is unbounded potential harm categorically unacceptable?") and Crux 1 ("Is probabilistic assurance sufficient as a guarantee?"). Camp 1's position relies on answering "Yes" to Crux 4. Camp 2's position relies on answering "No" to Crux 4 *and* treating the probabilistic assurance as sufficient ("Yes" to Crux 1 under their definition). The capability penalty of A (high constant harm) vs. B (low harm almost everywhere) also relates to Crux 3.

