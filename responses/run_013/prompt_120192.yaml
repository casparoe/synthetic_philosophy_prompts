answer: |-
  ### Exam Question  
  "Pascal's mugging reveals a tension between expected utility (EU) maximization and intuitive judgments about rationality. In our seminar, we contrasted two variants:  
  1. **Gain Mugging**: A stranger claims that if you pay them £5, they *might* reward you with a vast but finite payoff (e.g., 10^100 utils) at an unknown but nonzero probability.  
  2. **Loss Mugging**: The stranger threatens to inflict a vast but finite loss (e.g., –10^100 utils) with unknown nonzero probability *unless* you pay £5.  

  Most observers find the Gain Mugging absurd (refusing payment) but the Loss Mugging frightening (paying "just in case"). Assess whether this asymmetry reflects a defensible feature of rational choice theory or an irrational bias. Does Pascal’s mugging refute EU maximization itself, or does it refute our anti-fanatic intuitions? Finally, propose a *principled* repair to EU theory that resolves the mugging without merely imposing arbitrary caps on utilities or probabilities, and explain what foundational commitment this repair must abandon."  

  ---

  ### Model Answer (700 words)  
  Pascal’s mugging exposes EU maximization’s vulnerability to unbounded utility functions and unconstrained probability assignments. In both variants, EU calculation demands we accept the mugger’s deal: for any fixed cost *c* (e.g., £5), a tiny subjective probability *p* > 0 of a payoff *U* vast enough to make *pU > c* dominates the decision. EU theory treats gains and losses symmetrically: if |U| is identical and *p* is unbounded below, both muggings compel payment. Yet humans perceive an asymmetry—dismissing Gain Mugging as absurd while fearing Loss Mugging. This asymmetry lacks grounding in EU theory and instead reveals *descriptive* cognitive biases, not *normative* rationality. I argue Pascal’s mugging is a valid *reductio* against unmodified EU maximization, necessitating a principled repair that bounds utility functions, abandoning the axiom of *completeness*.  

  The asymmetry stems from psychological loss aversion (Kahneman & Tversky) and probability weighting. Humans overweight small-probability losses and underweight small-probability gains. Loss Mugging triggers dread of catastrophe, while Gain Mugging evokes skepticism toward extravagant promises. However, EU theory—by requiring linear probability weighting and symmetric treatment of gains/losses—cannot justify this asymmetry normatively. If Loss Mugging is compelling, EU consistency demands accepting Gain Mugging too. Rejecting both or accepting both are coherent; the asymmetry is irrational under EU axioms.  

  Pascal’s mugging constitutes a *reductio* of EU maximization itself. EU’s core vulnerability is its requirement that utilities and probabilities be *unbounded* and *strictly comparable*. When utilities can be arbitrarily large and probabilities arbitrarily small but nonzero, any action can be rationalized by hypothetical stakes. This violates pragmatic rationality: an agent accepting all such deals would be endlessly exploited. The mugging is not a *reductio* of anti-fanatic intuitions because those intuitions correctly identify a flaw in EU’s handling of extreme uncertainty. Dismissing intuitions as "irrational" ignores that EU licenses choices no coherent agent could sustain.  

  "Repairs" capping utilities (e.g., max U = 10^20) or excluding "astronomical" probabilities are *ad hoc*. They lack theoretical justification: why cap at 10^20 and not 10^30? Such thresholds are arbitrary and vulnerable to trivial re-scaling (e.g., a mugger offering 10^30 utils). Banning tiny probabilities (e.g., *p* < 10^–50) is equally arbitrary and violates completeness: EU requires all mutually exclusive events have defined probabilities. These patches preserve EU’s framework but sacrifice its universality.  

  A principled solution must bound utilities *axiomatically*. We could modify the Continuity Axiom to require that no outcome is infinitely better/worse than another, implying *bounded utility functions*. This directly blocks mugging: no matter how large |U|, its utility is finite, so for sufficiently tiny *p*, *pU* → 0. This demands abandoning *completeness*: not all prospects need be rankable if utilities are bounded. For instance, comparing a certain £5 loss to a 10^–100 chance of 10^100 utils might be indeterminate if utilities saturate. While this limits EU’s scope, it mirrors human cognitive limits and avoids exploitation. Alternatives like rank-dependent utility (weighting probabilities nonlinearly) merely formalize biases and remain *ad hoc* without independent justification.  

  In conclusion, the gain/loss asymmetry reflects psychological biases, not rational asymmetry. Pascal’s mugging undermines EU theory by exposing its pathological behavior under extremal stakes. Bounding utility functions—though costly—is the only non-arbitrary fix, forcing a trade-off between universality and robustness.  

  ---

  ### Marking Scheme (20 marks total)  
  **Must-hit points (4 marks each):**  
  1. **Accurate EU analysis of both muggings**  
     *Note: Must calculate that EU compels paying in both cases if p > 0 and |U| sufficiently large.*  
     *Common error: Claiming EU allows ignoring Gain Mugging but not Loss Mugging.*  

  2. **Asymmetry attributed to psychology, not EU theory**  
     *Note: Must state EU treats gains/losses symmetrically; asymmetry arises from descriptive biases (e.g., loss aversion).*  
     *Common error: Arguing the asymmetry is normatively justified (e.g., "losses matter more").*  

  3. **Position that mugging refutes EU (not intuitions)**  
     *Note: Must argue EU’s unbounded expectations license exploitable choices, making it a reductio.*  
     *Common error: Claiming intuitions are flawed and EU should override them.*  

  4. **Critique of ad hoc caps (utility/probability)**  
     *Note: Must explain why arbitrary thresholds violate universality and invite re-scaling.*  
     *Common error: Endorsing caps without addressing their arbitrariness.*  

  5. **Principled repair via bounded utility + sacrificed axiom**  
     *Note: Must propose bounded utility as a solution and identify sacrificed completeness (or continuity).*  
     *Common error: Suggesting bounded utility without naming the abandoned axiom or proposing another fix (e.g., probability weighting) as "principled".*  

  ---  
  **Rationale**: This question forces engagement with the core EU vulnerability (unbounded expectations), challenges intuitive asymmetry, and demands structural solutions. The model answer mirrors a strong student’s reasoning under time constraints, avoiding citations while demonstrating technical and conceptual mastery.
