  ### Decision Tree on the Causal Exclusion Argument  
  **Starting Commitments**:  
  1. Mental properties ≠ physical properties (non-identity).  
  2. Every physical event with a sufficient cause has a sufficient physical cause (causal closure).  

  **Instructions**: Answer each question sequentially. Each branch resolves to a position and its core tension.  

  #### The Tree  
  1. **Are mental properties identical to physical properties?**  
     - **Yes** → **Leaf 1: Reductive Physicalism**  
       *Awkward commitment: Must deny multiple realizability or qualitative distinctness of mental states.*  
     - **No** → Proceed to 2.  

  2. **Do physical properties (as characterized by physics) consist solely of relational/dispositional structure?**  
     - **Yes** → Proceed to 3.  
     - **No** → Proceed to 4.  

  3. **Is the intrinsic nature of matter (uncovered by physics) mental or protomental?**  
     - **Yes** → **Leaf 2: Russellian Monism**  
       *Awkward commitment: Must explain how intrinsic mental properties cause physical events without violating closure or inviting overdetermination.*  
     - **No** → **Leaf 3: Non-Russellian Property Dualism**  
       *Awkward commitment: Must account for non-mental, non-structural intrinsic properties and their relation to mentality.*  

  4. **Do you accept the causal closure of the physical?**  
     - **No** → **Leaf 4: Interactionist Dualism**  
       *Awkward commitment: Must deny closure, contradicting physics' success in explaining physical events.*  
     - **Yes** → Proceed to 5.  

  5. **Do mental properties cause physical events?**  
     - **No** → **Leaf 5: Epiphenomenalism**  
       *Awkward commitment: Mental properties are causal dead ends.*  
     - **Yes** → Proceed to 6.  

  6. **Do mental properties supervene *only* on the current physical state?**  
     - **No** → Proceed to 7.  
     - **Yes** → Proceed to 8.  

  7. **Does the causal profile of a physical state depend on its history of mental properties?**  
     - **Yes** → **Leaf 6: Recurrent Realization Non-reductivism**  
       *Awkward commitment: Must explain how mental causation escapes current physical supervenience without violating closure.*  
     - **No** → **Leaf 7: Non-supervenient Non-reductivism**  
       *Awkward commitment: Must ground mental properties in non-physical history while preserving physical causation.*  

  8. **Do mental properties exert novel causal powers (e.g., downward causation)?**  
     - **Yes** → **Leaf 8: Emergentism**  
       *Awkward commitment: Must reconcile downward causation with closure without overdetermination.*  
     - **No** → Proceed to 9.  

  9. **Is mental causation derivative (e.g., via physical realization)?**  
     - **Yes** → **Leaf 9: Non-reductive Physicalism (Realizationism)**  
       *Awkward commitment: Must prevent causal exclusion of mental properties by their physical realizers.*  
     - **No** → Proceed to 10.  

  10. **Do you accept systematic overdetermination (multiple sufficient causes)?**  
      - **Yes** → **Leaf 10: Overdetermination View**  
        *Awkward commitment: Must defend ubiquitous overdetermination as non-redundant.*  
      - **No** → Proceed to 11.  

  11. **Is causation a difference-making/proportionality relation (not sufficiency)?**  
      - **Yes** → **Leaf 11: Proportionality-Based Causation**  
        *Awkward commitment: Must justify proportionality as the primary causal relation over sufficiency.*  
      - **No** → **Leaf 12: Quietism**  
        *Awkward commitment: Must dissolve the exclusion problem as verbal or conceptual confusion.*  

  ---

  ### Unoccupied Combinations & Indistinguishable Pairs  
  **Unoccupied Combinations** (based on standard literature):  
  - **Q1=No, Q2=Yes, Q3=No** (Leaf 3: Non-Russellian Property Dualism): *Unexplored*. No clear theory of non-mental intrinsics.  
  - **Q1=No, Q2=No, Q4=Yes, Q5=Yes, Q6=No, Q7=No** (Leaf 7: Non-supervenient Non-reductivism): *Incoherent*. Non-supervenience + closure + mental causation implies physical indeterminism.  
  - **Q1=No, Q2=No, Q4=Yes, Q5=Yes, Q6=Yes, Q8=No, Q9=No, Q10=No, Q11=No** (Leaf 12: Quietism): *Unattractive*. Avoids all substantive commitments, risking vacuity.  

  **Indistinguishable Pairs** (tree cannot separate):  
  - **Recurrent Realization (Leaf 6) vs. Emergentism (Leaf 8)**: Both may affirm mental-history dependence. The tree distinguishes via novelty of causal powers (Q8), but cases may blur if recurrence involves novel powers.  
  - **Proportionality-Based Causation (Leaf 11) vs. Realizationism (Leaf 9)**: Proportionality can be framed as realization-compatible. The tree forces a choice at Q9/Q11, but hybrid views exist.  

  ---

  ### Failure Points of the Instrument  
  1. **Contested Branch Question**:  
     - **Q9 (Derivative mental causation?)**: Loads "derivative" with realizationist baggage. A scientist might conflate it with supervenience (Q6) or proportionality (Q11).  

  2. **Least Confident Leaf Attribution**:  
     - **Recurrent Realization (Leaf 6)**: May be a variant of emergentism (Leaf 8) or non-reductive physicalism (Leaf 9). Its "awkward commitment" assumes supervenience failure is problematic, but proponents may reject this.  

  3. **Rebuild-Triggering Answer**:  
     - If at **Q2**, a scientist answers: *"Physical properties are structural, but intrinsics are physical too"*, the tree forces Russellian monism (Q3) or property dualism. This collapses the structural/non-structural divide, requiring a rebuild from Q2.  

  **Why a Tree?**  
  A tree is suitable because positions share a logical space defined by commitments to identity, closure, supervenience, and causal efficacy. The exclusion argument forces trade-offs among these, creating branching dependencies. However, quietism (Leaf 12) highlights limits: if the dispute is verbal, the tree "over-solves" a pseudo-problem.  

