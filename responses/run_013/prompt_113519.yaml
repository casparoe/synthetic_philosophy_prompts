  **Payoff Scheme:**
  - We are using credits and items. The value of the premium items and resources will be in points at the end.
  - **Scoring:**
    - Each credit = 1 point.
    - Each premium item = 50 points.
    - Each resource token = 10 points.
  - At the end of the entire activity, we calculate the total points for each participant: credits + (premium items * 50) + (resource tokens * 10).

  **Redistribution Pact:**
  - The pact is voluntary and formed at the beginning. They must decide how to share. For simplicity, we suggest they share 20% of their net gain (from trading and resource claiming) in each round. The net gain is calculated per round: (ending credits - starting credits) + (value of items acquired and held from trading and resources). They pool 20% of each member's net gain and then redistribute it equally among the pact members. This happens at the end of each round (before reset in Rounds 1 and 2, and at the end of Round 3).

  **Facilitation:**
  - Explain the rules clearly. Emphasize that the goal is to accumulate as many points as possible.
  - For the redistribution pact, explain that they can form a group (any size) and that they will share 20% of their gains in each round. They can form only one pact per participant? Actually, let them form one pact per group of participants (so a participant can only be in one pact). They must register the pact with the facilitator.

  **Predictable Problems and Solutions:**
  1. **Problem:** Participants might not trade because they know about the reset in Rounds 1 and 2.
