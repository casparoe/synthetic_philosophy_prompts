        Net gain = (ending credits - 100) + (value of items acquired and still held at the end of the round) 
     But note: in Rounds 1 and 2, the items are taken away at reset, so they don't count for the next round. But for the pact, we are calculating at the end of the round (before reset). So in Rounds 1 and 2, the items are held at the end of the round (until reset). Therefore, the net gain in each round is the change in credits and the value of items acquired (which are then taken away). However, since the items are taken away, they don't contribute to the next round, but they do contribute to the pact because the pact is calculated before reset.

     But wait: the value of the items is only realized at the end of the entire activity? No, we are using the items to assign points. So in each round, the items held at the end of the round (before reset) are part of the net gain for that round? Yes, because they are part of the wealth at that moment.

     However, to avoid double counting in the final points, we are resetting the items in Rounds 1 and 2. So for the pact, we are only concerned with the round-by-round gains that are then reset.

     Let me redefine the net gain for the pact per round:
        Net gain = (ending credits - starting credits) + (value of items acquired and held at the end of the round) 
     But note that in Rounds 1 and 2, the starting credits are 100. In Round 3, starting credits are also 100. The value of items: 
        - Premium item: 50 points if held at the end of the round.
        - Resource token: 10 points each.

     However, because the items are taken away at reset in Rounds 1 and 2, the only thing that matters for the final score is the credits and items held at the end of Round 3. But the pact is about sharing the gains in each round. So in Rounds 1 and 2, the items are lost after the round, so they are only for that round's gain. In Round 3, the items are kept and count toward the final score.

     Therefore, for the pact, we calculate the net gain for each round as:
        Net gain = (ending credits - 100) + (50 * number of premium items held) + (10 * number of resource tokens held)

     Then the pact members each contribute 20% of their net gain (if positive) to a common pool. The pool is then divided equally among the pact members. If a member has a negative net gain, they don't contribute (or we can say they don't share in the pool? Let's keep it simple: only positive net gains are shared). The sharing happens at the end of each round.

     This might be complex. Alternatively, we can avoid item valuation for the pact and only use credits. Because the items are reset in Rounds 1 and 2, and in Round 3 they are kept, we can say:
     - In Rounds 1 and 2, the net gain is only in credits (since items are taken away and not converted to credits). So the pact shares 20% of the credit gains (ending credits - 100). 
     - In Round 3, the net gain is (ending credits - 100) plus the value of items (because they are kept and will be counted at the end). However, for simplicity in the pact calculation, we can still only use the credit gains in Round 3? That would be inconsistent.

     Another idea: don't use the items in the pact calculation. Only use credits. Because the items are reset in the first two rounds, they don't matter for the pact. In Round 3, the items will be part of the final score but not converted to credits until the end. We can say the pact only shares credit gains. Then in Round 3, the items are not included in the pact sharing. That might be acceptable. 

     Let me adjust: The redistribution pact only shares credit gains. In each round, they calculate:
        Credit gain = ending credits - 100 (starting credits)
     Then each pact member puts 20% of their credit gain (if positive) into a pool, and the pool is divided equally. This is done at the end of each round.

     This way, we avoid the complexity of item valuation for the pact. The items are still valuable because they can be sold for credits (and then the credits are shared) or kept until Round 3 to count in the final score. But note: in Rounds 1 and 2, if they keep an item, they don't get credits from it? Then they don't get credit gains? Correct. So they are incentivized to sell items for credits in Rounds 1 and 2 to have gains to share and to get a share of the pool. In Round 3, they can choose to keep items (which will add to their final points) or sell for credits (which will be part of the credit gains shared by the pact).

     So let's go with: The redistribution pact shares only credit gains (ending credits - 100) in each round. The pact does not consider the value of items.

  4. **Problem:** Participants may not form a redistribution pact because they don't see the benefit.
     - **Solution:** Explain that by sharing, they can reduce risk and have a more stable income. Also, they might feel it's fairer. But it's voluntary, so if no one forms one, that's okay. It becomes a talking point in the debrief.

  **What the Activity Cannot Reproduce:**
  - The activity cannot fully capture the intergenerational and long-term historical injustices that Nozick's theory must address. We are compressing time and only having a few rounds.
  - The moral weight of initial acquisitions (the unowned resources) is simplified. In reality, the acquisition of unowned resources (like land) might have left others worse off in a way that is hard to quantify. Our resource tokens are small and don't represent a significant deprivation.
  - The activity doesn't address the rectification of past injustices (the third part of Nozick's theory). We are only focusing on the justice in acquisition, transfer, and the conflict with patterns.

  **Debrief:**
  Map the activity to the concepts:

  1. **Initial Equal Distribution (Patterned Justice):** We started each round with equality. This represents a patterned principle (everyone has the same).

  2. **Voluntary Trades (Historical Justice):** The trades were voluntary and changed the distribution. This is the historical process: the new distribution is just because it arose from voluntary steps.

  3. **The Reset (Patterned Justice):** At the end of Rounds 1 and 2, we reset to equality. This represents a patterned principle being enforced. Ask:
     - How did the reset affect the sellers of the premium items? (They might have sold in Round 1 but then had to start over, so they lost the benefit of their sale.)
     - How did buyers feel? (They might have bought an item and then lost it in the reset.)
     - How did the reset affect trading in the next round? (People might be less willing to trade if they know it will be reset.)

  4. **Unowned Resources (Justice in Acquisition):** The resource tokens represented unowned resources. When someone claimed one, they acquired it without trading. Ask:
     - Did the claim of a resource token leave others worse off? (In our game, there were plenty, so maybe not. But if someone claimed a token, it was no longer available for others. However, since there were 12 tokens and 18 participants, not everyone could get one. So some might feel they were deprived of an opportunity.)
     - How does this relate to the idea of "justice in acquisition"? (Nozick says it is just if the acquisition does not worsen the situation of others. In our game, the token was taken from a common pool, so others had one less chance. But if the pool is large enough, it might not worsen their situation.)

  5. **Voluntary Redistribution Pact:** This is a chosen pattern. Ask:
     - How is this different from the reset rule? (The reset was imposed by the facilitator, while the pact was chosen voluntarily by the participants. The pact is a pattern they chose to maintain among themselves, but it doesn't force non-members.)
     - Did the pact create a pattern? (Yes, within the pact members, the redistribution made their outcomes more equal.)
     - How did non-members feel? (They were not part of the pattern.)

  6. **Round 3 (No Reset):** This allowed the historical process to stand. Ask:
     - How did trading in Round 3 differ? (Participants might have been more motivated because they kept what they acquired.)
     - How did the distribution at the end of Round 3 look? (It was unequal, but it arose from voluntary steps and initial acquisitions.)

  7. **Nozick's Point:** The activity illustrates that free exchanges and acquisitions will constantly disrupt any patterned distribution (like equality). The reset was needed to restore the pattern, but it undid the voluntary transactions. The historical process (free exchanges and just acquisitions) will always lead away from the pattern.

  **Final Discussion Points:**
  - Which system feels more fair? Why?
  - Can a society maintain both voluntary transactions and a pattern? (Nozick says no, because transactions change the pattern.)
  - What are the real-world implications? (Think about taxation for redistribution vs. voluntary charity.)

  **Handling the Redistribution Pact:**
  If no one forms a pact, that's okay. You can say: "In this run, no one chose to form a pact. But imagine if some did: they would have shared their gains, creating a more equal distribution within their group, but without forcing outsiders. This is a chosen pattern, not an imposed one."

  **Time Management:**
  Keep each trading period to 10 minutes. The entire activity with three rounds and debrief should fit in 90 minutes.

  **Adjustment for Group Size:**
  With 18 participants, having 6 groups of 3 might work. Alternatively, if you want more individual interaction, you can run it with 18 individuals. But then the resource pool might need more tokens (say 18 tokens so everyone can get one per round? But then there's no competition). We set 12 tokens for 18 participants to create scarcity.

