prompt: |-
  I teach history at an international school where most of my students are Japanese or Korean, and several of them carry their home country's history textbook in their bag; the two books do not agree. Last month my unit on the first half of the twentieth century ended in a shouting match — one student told another she was repeating a lie, a third walked out — and I spent the hour afterwards understanding that I had taught them the events and not the argument. I teach the unit again next term, and this time I want to teach the shape of the disagreement rather than referee it. Please plan the unit; do not explain the history to me.

  My working sketch, which I would like you to correct if it is wrong or badly ordered, is that a historical quarrel can sit on four levels. The factual: how many, when, whether coercion was involved. The compositional: where the story begins, what counts as its cause, which facts are load-bearing and which are dropped. The lexical: what the event and the people in it are called, and what each name quietly asserts. The purposive: what the story is for now — pride, warning, atonement, reconciliation — and who has standing to tell it. My diagnosis of the shouting match is that most quarrels get prosecuted on one level as though they were on another: someone is called a liar when the real dispute is about salience, or a plain factual question is waved away as mere narrative.

  For three fifty-minute periods with fifteen- and sixteen-year-olds, I need: the order the ideas must come in, and what has to be in place before the four levels can even be distinguished; the one case that should carry the unit, what it must have (all sides agreeing on the bare facts, the differences lying only in selection, naming and purpose) and what it must lack (no outright falsehood on either side, no cartoon villain), and why that case rather than the obvious ones; the misconceptions the students will arrive with and the exact point in the sequence where each should be headed off — I am already expecting them to say that the truth lies in the middle, that any shaped account is a distortion, and that a family's account is simply what happened; the single exercise that would show me whether they can place a disagreement on the right level rather than merely being polite to one another; and what I should openly refuse to resolve in front of them, and say so. No reading list — whatever carries this has to be something I can put in the room.
reasoning: |-
  Okay, the user is a history teacher at an international school with Japanese and Korean students. The previous lesson on 20th-century history ended in a shouting match because students were using different textbooks with conflicting narratives. The teacher wants to avoid being a referee and instead teach the structure of historical disagreements. They've outlined four levels of historical quarrels: factual, compositional, lexical, and purposive. Their main issue is that arguments happen on the wrong level—like calling someone a liar when the real dispute is about which facts are important.

  First, I need to address their framework. The four levels make sense, but the order might need adjustment. Starting with lexical (naming) could be more intuitive for students since language differences are immediate and visible. Then move to compositional (selection of facts), factual (disputes over evidence), and finally purposive (the purpose of the narrative). This sequence builds from surface-level differences to deeper structural issues.

  Next, choosing the right case study is crucial. The teacher mentioned avoiding "obvious" conflicts like Japan-Korea issues to prevent emotional reactions. The War of 1812 is a good candidate because it's less charged, has clear naming differences ("War of 1812" vs. "Mr. Madison's War"), and both sides agree on basic facts but differ in focus and purpose. It lacks villains and outright falsehoods, making it a neutral example to illustrate the four levels without triggering defensiveness.

  The students' misconceptions need to be addressed. The "truth in the middle" fallacy can be countered by showing that some facts are verifiable, not always a compromise. The idea that any shaped account is distortion can be reframed as selection being necessary, not inherently biased. And the belief that family stories are absolute truth can be examined through the purposive level—understanding why a narrative is told a certain way.

  For the exercise, a structured debate where students analyze a new conflict using the four levels would assess their understanding. The key is whether they categorize arguments correctly, not just avoid conflict. The teacher should explicitly refuse to resolve which narrative is "correct," emphasizing analyzing the structure instead.

  Underlying needs: The teacher wants to foster critical thinking and empathy, helping students navigate contentious histories without confrontation. They need tools to de-escalate by shifting focus from content to methodology. The unspoken goal is creating a classroom environment where multiple perspectives coexist respectfully, preparing students for real-world historical disputes.
answer: |-
  Here’s a structured unit plan focused on teaching the *anatomy* of historical disagreement, designed to equip students with analytical tools rather than adjudicate content. Your four-level framework is sound but needs slight reordering for pedagogical flow. The sequence prioritizes building conceptual foundations before applying them to sensitive topics.

  **Core Principle:** *Postpone the charged cases.* Start with a neutral, unfamiliar conflict to practice analysis objectively.

  ---

  ### **Unit Structure (3 x 50-minute periods)**
  **Pre-Requisite:** Students must grasp that *all* history (even textbook narratives) involves selection & shaping. Begin with this axiom.

  #### **Period 1: Foundations & Lexical/Compositional Layers**
  *   **Hook (5 min):** Show two contrasting headlines about the *same* current event (e.g., a protest: "Peaceful Demonstrators Demand Change" vs. "Violent Mob Disrupts City"). Discuss: What’s different? Is one lying?
  *   **Concept Introduction (15 min):**
      *   **Lexical Layer:** Define & explore **naming**. How does calling an event a "rebellion" vs. "freedom struggle" frame it? (Examples: "Boston Tea Party" vs. "Destruction of Private Property").
      *   **Compositional Layer:** Define & explore **selection & salience**. Where does the story start/end? Which actors/events are central? Which are omitted? (Example: Teaching WWII starting in 1939 vs. 1931 vs. 1919).
  *   **Activity (25 min): "The Case of the Disputed Border" (Hypothetical/Fictional):**
      *   Provide two short, conflicting accounts of a fictional border conflict (Aradia vs. Belgornia).
      *   **Task 1:** Identify differing *names* for key events/places. What do the names imply?
      *   **Task 2:** Map the *scope* of each narrative. When does it start? What events are included/omitted? What’s emphasized?
  *   **Misconception Addressed:** "A family’s account is simply what happened." *Activity reveals how naming/selection shapes even a 'simple' story.*

  #### **Period 2: Factual & Purposive Layers + Introducing the Anchor Case**
  *   **Review & Bridge (5 min):** Recap Lexical/Compositional layers using fictional case.
  *   **Concept Introduction (15 min):**
      *   **Factual Layer:** Define **evidence & interpretation**. Distinguish *verifiable* facts (dates, troop numbers) from *interpretive* claims (motivations, level of coercion). Emphasize: Even agreed facts can be used differently.
      *   **Purposive Layer:** Define **narrative function**. What is this history *for*? (e.g., building national pride, warning against tyranny, fostering reconciliation). Who is the intended audience? *Crucially: Discuss who is seen as having "standing" to tell the story.*
  *   **Introduce the Anchor Case: The War of 1812 (US/UK/Canadian Perspectives) (25 min)**
      *   **Why this case?**
          *   **Agreed Core Facts:** Dates, key battles (Detroit, New Orleans, D.C. burned), Treaty of Ghent outcome. No genocide/apology-level disputes.
          *   **Clear Differences on Other Layers:**
              *   *Lexical:* "War of 1812" (US) vs. "The American War" (UK) vs. Canadian focus on "Defence of Canada." Is it a "Second War of Independence" or "Mr. Madison’s War"?
              *   *Compositional:* US starts with impressment/British support for Native resistance. UK/Canada may start earlier with US expansionism/Native land pressures. Who are the heroes (Jackson? Brock? Tecumseh?)?
              *   *Purposive:* US – Birth of national identity, "Star-Spangled Banner." Canada – Birth of national identity *as distinct from US*, myth of united defence. UK – Minor theatre of Napoleonic Wars.
          *   **Lacks:** Blatant falsehoods (in mainstream accounts), cartoon villains (all sides have complex motivations), raw contemporary wounds impacting students directly.
          *   **Neutrality:** Less emotionally charged *for these students* than Japan/Korea 20th C. history. Allows objective practice.
      *   **Activity:** Analyze 3 short excerpts (US textbook, Canadian textbook, UK perspective summary) using a simple grid: Lexical Choices? Compositional Focus (Start/End/Key Actors)? Agreed Facts? Likely Purpose/Standing?

  #### **Period 3: Synthesis, Application & Navigating Disagreement**
  *   **Review Anchor Case Analysis (10 min):** Students share findings. Highlight how differences on Lexical/Compositional/Purposive layers *coexist* with shared Factual ground. Emphasize: **Disagreement ≠ Lying.**
  *   **Addressing Key Misconceptions (10 min):**
      *   **"Truth Lies in the Middle":** Challenge this. *Some facts are simply verifiable.* Show an agreed fact from 1812. The "middle" might ignore valid evidence or create false equivalence. *Focus is on understanding perspectives, not finding a mushy compromise.*
      *   **"Any Shaped Account is Distortion":** Argue that *selection is necessary and inevitable*. The distortion occurs when selection/purpose is *hidden* or presented as the *only* possible story. Good history is *transparent* about its framing.
  *   **Critical Exercise: "The Disagreement Diagnosis" (25 min)**
      *   Present a *new*, brief historical disagreement snippet (e.g., two sentences differing on causes of the French Revolution, Suez Crisis, or a local event).
      *   **Task:** Students (in pairs/small groups) must:
          1.  Identify the *primary* level(s) of disagreement (Factual? Lexical? Compositional? Purposive?).
          2.  Justify their diagnosis (e.g., "This is mainly lexical because the key difference is whether to call it a 'riot' or an 'uprising'" or "This is compositional; one account blames foreign influence, the other blames domestic corruption").
      *   **Assessment Focus:** Can students correctly *categorize* the *nature* of the disagreement? Are they moving beyond "they disagree" to "they disagree *about how the story is framed*"? **Politeness is secondary to accurate diagnosis.** The exercise reveals if they grasp the *structure* of the argument.
  *   **What You Explicitly Refuse to Resolve (5 min):** State clearly at the end: **"My job in this unit is not to tell you which narrative about *any* historical event, including the painful ones you care deeply about, is 'correct' or 'true.' My job is to give you tools to understand *why* disagreements exist, *how* they are structured, and how to analyze them critically. Resolving those deep historical disputes requires complex diplomacy, scholarship, and empathy far beyond this classroom. We focus here on understanding the map of the conflict, not choosing a side."**

  ---

  ### **Why This Sequence Works**
  1.  **Builds Scaffolding:** Starts with non-threatening concepts (naming, selection) using neutral/fictional examples before introducing a real but less-charged case (1812).
  2.  **Isolates Concepts:** Each layer gets dedicated focus before synthesis. The anchor case allows safe application.
  3.  **Preempts Escalation:** By diagnosing disagreements *structurally* (Level X vs. Level Y), it depersonalizes conflict. "You're emphasizing purpose, while I'm focusing on a factual detail" is less inflammatory than "You're lying!"
  4.  **Targets Misconceptions:** Directly challenges "middle truth" and "all shaping is distortion" fallacies when students have concrete examples to analyze. Addresses family narrative bias early.
  5.  **Provides Measurable Skill:** The "Disagreement Diagnosis" exercise assesses the core competency: identifying the *level* of dispute.
  6.  **Manages Expectations:** Explicitly refusing to resolve deep historical conflicts sets boundaries and validates the unit's purpose as analytical, not adjudicative.

  **Materials:** Whiteboard/Projector, handouts for fictional case, 1812 excerpts, and "Disagreement Diagnosis" snippets. **No textbooks needed initially; curated excerpts are the tool.** The power lies in the analytical framework, not the specific content. Good luck!
