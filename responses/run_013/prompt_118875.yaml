prompt: |-
  I keep noticing that the same city will run two price controls with opposite designs, and nobody treats it as a puzzle. On housing, rent regulation characteristically caps increases on sitting tenancies but exempts buildings constructed after a cutoff year, and often lets the rent reset to market when a unit turns over. On labor, the minimum wage applies to every worker regardless of when the job was created; the exemptions that exist are carve-outs for categories of worker -- teenagers, apprentices, tipped staff -- never for categories of job. Reconstruct the theory of the wrong of a price control that this pair of practices presupposes.

  Specifically: does the housing design presuppose that the harm of a price ceiling is dynamic and supply-side -- that the thing to avoid is the chilling of new construction, so a ceiling that spares new supply has dodged the wrong -- while the wage floor is treated as a matter of the worker's entitlement, which attaches to the person and so cannot be dodged by exempting new positions? Or is the asymmetry better explained by something more mundane, such as the relative political power of developers versus low-wage workers, or the fact that a house is an asset whose price is a stream of future rents while an hour of labor is consumed as it is sold?

  Separate what the practice strictly presupposes from what it merely fits comfortably with, and tell me where it is underdetermined -- I expect several quite different theories would license the same statutes, and I want to know which ones the design actually rules out. Then take the analogy seriously in the other direction. If we carried the new-construction logic over to wages, we would get a minimum wage that does not bind on newly created positions: a new-hire exemption. Sub-minimum training wages for young workers are sometimes defended on roughly this logic. Is that a coherent extension of the housing design, or does the analogy fail somewhere -- in what a rent ceiling does to the incentive to build versus what a wage floor does to the incentive to hire, or in the moral status of the two things being priced? I have read enough of the econ-and-philosophy blogosphere to know that people usually defend these two policies with incompatible implicit models and never notice the seam; I would like the seam mapped. Finish by saying what would have to change in either policy if we swapped the presupposed theory for its leading rival.

  Lead with your bottom line in the first sentence and then give the reasoning. No preamble and no restating of the question.
reasoning: |-
  Hmm, the user is presenting a sophisticated puzzle about the asymmetry in price control designs between rent regulation and minimum wage policies. They've noticed that rent control typically exempts new construction while minimum wage applies universally to all jobs regardless of creation date. They want me to reconstruct the implicit theory behind this difference, separate strict presuppositions from comfortable fits, identify what the design rules out, explore analogous applications, and finally consider what would change if we swapped theories.

  The user is clearly well-versed in economics and philosophy, referencing the "econ-and-philosophy blogosphere" and showing advanced analytical skills. They're frustrated that people defend these policies with incompatible implicit models without noticing the contradiction - they want this "seam" mapped rigorously.

  For the bottom line: The housing design strictly presupposes that the primary wrong of price controls is dynamic supply reduction, while the labor design presupposes a static worker-entitlement theory.

  Now unpacking the asymmetry:
  - Rent control's new-construction exemption directly targets the supply concern - it's designed to avoid chilling new investment. This strictly presupposes that supply elasticity is the central issue.
  - Minimum wage's universal application strictly presupposes that worker dignity/entitlement attaches to persons, not positions. The exemptions for worker categories (like teens) still maintain this person-based logic.

  The design rules out:
  - For housing: It rules out that rent control's main wrong is wealth transfer from landlords to tenants (since transfers still occur in regulated units)
  - For labor: It rules out that minimum wage's main harm is job destruction (since it applies equally to new/existing positions)

  Underdetermined aspects:
  - Both designs could coexist with theories about political power (developers vs workers) or asset characteristics (durable housing vs perishable labor). These are comfortable fits but not strictly required.

  Analog application:
  - Applying housing logic to wages would indeed suggest new-hire exemptions. Training wages for youth are a partial analogy but fail because:
    1) Hiring decisions respond faster than construction (more elastic demand)
    2) Labor lacks housing's durability - exempted "new jobs" could constantly churn to avoid wages
    3) Morally, housing provides shelter-as-commodity while labor involves human dignity

  Swapping theories:
  - If housing adopted labor's model: All units would be covered permanently, including new construction (like Berlin's recent rent control)
  - If labor adopted housing's model: Minimum wage would exempt new positions (creating massive job churn incentives)

  The user is clearly looking for rigorous conceptual mapping rather than policy advocacy. They want the implicit contradictions made explicit - which I'll deliver by maintaining strict focus on what the designs logically entail versus what they merely permit.
answer: |-
  The housing design strictly presupposes that the primary wrong of a price ceiling is dynamic supply reduction, while the labor design presupposes that the core wrong of a price floor is denying a static entitlement to workers. Rent control’s new-construction exemption directly targets supply elasticity—it assumes sparing new investment avoids the key harm of underprovision. Minimum wage’s universal application assumes the moral injury is denying workers a baseline reward for labor, irrespective of job vintage. This rules out theories where rent control’s main wrong is wealth transfer (exempting new units still allows transfers in old ones) or where minimum wage’s chief flaw is short-term job loss (applying it universally ignores that risk). The asymmetry is underdetermined regarding political power or asset durability—these fit but aren't required, as worker entitlements could theoretically apply to housing or developers could lobby for job exemptions.

  Extending the housing logic to wages via new-hire exemptions fails critically: labor demand is more elastic than construction supply (hiring adjusts faster than building), jobs lack housing’s durability (exempt positions could churn indefinitely to avoid wages), and labor’s moral status as human effort resists "vintage" distinctions that housing, as capital, accepts. Training wages for youth invoke a weaker, person-based exemption, not a job-age one, confirming the analogy’s collapse.

  Swapping presupposed theories would necessitate: (1) applying minimum wage universally to housing—no new-unit exemptions, locking all rents permanently below market (e.g., Berlin’s 2019 rent freeze); (2) applying new-job exemptions to labor—letting firms pay sub-minimum wages indefinitely for new positions, inviting rampant job churn to suppress wages.
