  Below is a decision-tree handout designed to sort students' ethical positions on everyday conventions (e.g., tipping, queueing, jaywalking) and whether visitors must follow local practices. It fits on one A4 page, uses diagnostic questions based on real-world scenarios, and includes 12 leaf positions (named or unnamed) with analysis of gaps and indistinctions.

  ---

  **ETHICS OF EVERYDAY LIFE: CONVENTIONS DECISION TREE**  
  *Answer the questions below to find your ethical position. Be honest—no "right" answers!*

  ### START: Do everyday conventions (e.g., tipping, queueing) carry **moral weight**, or are they purely about etiquette/prudence?  
  - **If purely etiquette/prudence (NO moral weight) → Go to Branch A**  
  - **If they carry moral weight (YES) → Go to Branch B**  

  ---

  #### **BRANCH A: NO MORAL WEIGHT**  
  *Conventions are practical/etiquette-driven, not moral.*  
  **Question 1 (Diagnostic):** *In an empty subway station at 3 AM, you stand on the left side of an escalator in a city where everyone stands on the right. Is this acceptable?*  
  - **YES → Leaf 1: Prudential Individualism**  
    *(Follow conventions only to avoid personal consequences, e.g., offense or inefficiency. No moral duty.)*  
  - **NO → Leaf 2: Social Etiquette Absolutism**  
    *(Always follow conventions as social grace, even without consequences.)*  

  ---

  #### **BRANCH B: YES, MORAL WEIGHT**  
  *Conventions are morally binding. What grounds this?*  
  **Question 2 (Diagnostic):** *You jaywalk on a dead street at 3 AM with no traffic. Is this wrong?*  
  - **YES, because it risks chaos → Coordination Foundation**: Moral weight comes from **preventing disorder**.  
  - **YES, because it’s unfair → Fairness Foundation**: Moral weight comes from **preventing harm to others** (e.g., servers relying on tips).  
  - **YES, because it’s disrespectful → Disrespect Foundation**: Moral weight comes from **showing respect for shared norms**.  

  ##### **Coordination Foundation**  
  **Question 3 (Diagnostic):** *You queue at an empty bus stop when no one is around. Required?*  
  - **YES → Leaf 3: Coordination Localist**  
    *(Always follow local conventions to prevent disorder, even if coordination isn’t needed locally.)*  
  - **NO → Leaf 4: Coordination Universalist**  
    *(Only follow conventions when coordination is actively needed, e.g., in crowds.)*  

  ##### **Fairness Foundation**  
  **Question 4 (Diagnostic):** *You tip in a country where tipping insults servers. Permissible?*  
  - **NO → Leaf 5: Fairness Localist**  
    *(Follow local conventions to avoid harm; e.g., don’t tip where it’s rude.)*  
  - **YES → Leaf 6: Fairness Universalist**  
    *(Only follow universal fairness principles; e.g., tip if servers deserve it, even if locally rude.)*  

  ##### **Disrespect Foundation**  
  **Question 5 (Diagnostic):** *You skip a queue when no one is scrambling. Disrespectful?*  
  - **YES → Leaf 7: Respect Localist**  
    *(Always follow local conventions to show respect, even if harmless.)*  
  - **NO → Leaf 8: Respect Universalist**  
    *(Only show respect for conventions with shared meaning; e.g., skip queues if no one cares.)*  

  ---

  ### VISITOR RULE (Applies to all "Moral Weight" positions)  
  **Question 6 (Diagnostic):** *As a visitor, must you follow a local convention you find pointless?*  
  - **YES → Local Practice Binding**  
    *(Bound by local norms as such. Positions: 3, 5, 7.)*  
  - **NO → Only Independently Justified**  
    *(Only bound if convention aligns with your foundation. Positions: 4, 6, 8.)*  

  ---

  ### LEAF POSITIONS (12 Total)  
  1. **Prudential Individualism** (Named)  
  2. **Social Etiquette Absolutism** (Named)  
  3. **Coordination Localist** (Named)  
  4. **Coordination Universalist** (Named)  
  5. **Fairness Localist** (Named)  
  6. **Fairness Universalist** (Named)  
  7. **Respect Localist** (Named)  
  8. **Respect Universalist** (Named)  

  ---

  ### ANALYSIS  
  #### **Unoccupied Combinations & Why**  
  - **Gap 1: "Prudential Individualism + Local Practice Binding"**  
    Unoccupied (incoherent). If conventions lack moral weight, visitors can’t be bound by local norms—only prudence.  
  - **Gap 2: "Disrespect Foundation + Social Etiquette Absolutism"**  
    Unoccupied (unexplored). Disrespect assumes moral weight; etiquette absolutism denies it.  

  #### **Indistinguishable Positions**  
  The tree **cannot distinguish**:  
  - **Coordination Universalist vs. Prudential Individualist** in dead-street jaywalking (both say YES).  
  - **Respect Localist vs. Social Etiquette Absolutist** in empty-queue scenarios (both say NO).  
  *Why?* Both pairs give identical answers to diagnostic questions but differ in foundational reasoning.  

  #### **Key Insights**  
  - Most students cluster in "Coordination" or "Fairness" branches.  
  - "Disrespect" views are rarer and often conflated with etiquette.  
  - Visitors lean "Localist" in fairness contexts (e.g., tipping) but "Universalist" in coordination (e.g., queueing).  

  --- 

  **PRINT INSTRUCTIONS:** Fit to one A4 page (portrait). Use as a classroom handout for self-sorting and debate.
