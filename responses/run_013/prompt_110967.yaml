prompt: |-
  I'm a backend engineer, never took a philosophy class, and I've somehow gotten stuck on a thing I heard on a podcast about hospitals and end-of-life care. The gist was that doctors tend to treat not putting someone on a ventilator in the first place as basically letting nature take its course, but turning off a ventilator thats already running gets treated as a much bigger deal — extra sign-offs, ethics consults, the whole thing. Meanwhile I gather alot of medical bodies officially say those two are morally the same, so there's a weird gap between the paperwork and the stated ethics. What really trips me up is the legal side: in most places (or so I'm told) you can watch a stranger drown and not be a criminal, but a parent who just... doesn't feed their kid is guilty of killing them. Same non-action, totally different treatment.

  And here's the wrinkle I cant shake: if failing to do something counts as causing a death, then doesnt basically everyone become a cause? I didn't donate to the malaria charity, so did I kill someone? Where does it stop? So what I actually want to know is what theory of causation and responsibility this whole act-versus-omission setup presupposes. Does it secretly need the view that omissions cant be causes at all, that only positive pushes and button-presses count? Or does it grant that omissions are causes and just relocate the entire difference into duty or blame? Which rival views does it quietly rule out — for instance a view where causation is just would-it-have-happened-anyway? And is the thing even internally consistent, given it treats the parents omission as a cause but the bystanders as not?

  Give me your answer as exactly five numbered points, one or two sentences each, with no intro and no wrap-up. I want the implicit theory the practice presupposes, what it strictly requires versus what it merely happens to fit, whether its coherent, where its underdetermined, and what would have to change if we swapped that theory out.
reasoning: |-
  Hmm, the user is a backend engineer who's encountered a philosophical puzzle about causation and responsibility in medical ethics and legal contexts. They're grappling with the apparent inconsistency in how omissions (like not starting a ventilator versus stopping one, or not feeding a child versus not saving a stranger) are treated differently despite similar outcomes.

  The core of their confusion seems to be: If failing to act can be considered causing death in some cases (like parental neglect) but not others (like not donating to charity), what underlying theory of causation and responsibility justifies this distinction? They want to understand the implicit framework that makes these judgments coherent.

  Breaking this down, I see several layers to their question. First, there's the medical ethics angle where withholding treatment is seen as "letting nature take its course" while withdrawing treatment feels more active. Then there's the legal/moral distinction where parents have duties to children that strangers don't have toward drowning victims. Finally, there's the philosophical tension about whether omissions can truly be causes at all.

  The user specifically asks for five numbered points addressing: the presupposed theory, its strict requirements versus accidental fits, coherence, underdetermined aspects, and consequences of changing theories. They want concise answers without intros or conclusions.

  I think the implicit theory here is duty-based: omissions only become causal/moral factors when there's a pre-existing obligation. This explains why parents "cause" death by not feeding but bystanders don't "cause" drowning. The coherence comes from focusing on duties rather than metaphysical causation. But it's underdetermined in defining where duties originate. If we swapped to a counterfactual theory (where causation = "but-for" necessity), we'd have absurd outcomes like every non-donor "causing" malaria deaths.

  The user's engineering background shows in their focus on system consistency - they're essentially reverse-engineering the "API" of moral responsibility. Their malaria charity example reveals concern about infinite responsibility cascades. I should acknowledge that practical application matters more than theoretical purity in these frameworks.

  For the response, I'll distill this into five precise points matching their requested structure. The duty-based explanation handles the parent/stranger asymmetry best, though it leaves gray areas like doctors' obligations to non-patients. The key is showing why "same non-action, different treatment" isn't actually inconsistent under this model.
answer: |-
  1.  The practice presupposes a *duty-based* theory of responsibility where omissions only become causal/moral factors when a specific pre-existing obligation exists (e.g., parental duty, doctor-patient relationship).  
  2.  It strictly requires the distinction between having a duty (making omission potentially causal/blameworthy) and lacking one (omission is neutral); it merely happens to fit intuitions about "active" vs. "passive" harm.  
  3.  It is coherent *if* one accepts that causation for responsibility is conditional on duty, effectively ruling out views where causation is purely physical or purely counterfactual ("but-for" necessity).  
  4.  It is critically underdetermined on the source and scope of duties (e.g., why doctors owe patients but not strangers, or how far charity duties extend).  
  5.  Swapping to a purely counterfactual theory of causation ("would death have occurred anyway?") would collapse distinctions like not starting vs. stopping ventilation and make widespread non-intervention causally equivalent to killing.
