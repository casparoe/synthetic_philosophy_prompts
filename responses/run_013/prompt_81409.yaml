answer: |-
  Here is the decision tree in five numbered splits:

  1.  **Is having an inner life (sentience) an on/off switch, or a dimmer?**  
      - **On/off:** Commit to views where sentience is binary. Go to Q2.  
      - **Dimmer:** Commit to views where moral weight scales. Go to Q3.  

  2.  **When we can't be certain if something is sentient (e.g., oyster, shrimp larva, complex chatbot), what drives the line?**  
      - **Proof of sentience needed:** Commit to the **Threshold View** (only confirmed sentient beings matter, e.g., likely shrimp yes, oyster/no).  
      - **Avoiding potential harm:** Commit to the **Precautionary View** (include things where sentience can't be ruled out, e.g., shrimp & oyster yes).  

  3.  **What does the dimmer measure: capacity for rich experiences (welfare), or strength of goal-pursuit?**  
      - **Capacity for welfare (pleasure/pain depth):** Commit to the **Graded View** (moral weight scales with experiential depth, e.g., shrimp > bee > thermostat).  
      - **Strength/scope of goal-pursuit:** Commit to views focusing on goal-directedness. Go to Q4.  

  4.  **Does having *any* goal (e.g., thermostat setpoint, plant defence signal, reward-maximizing AI) grant moral status, even tiny?**  
      - **Yes, any functional goal counts:** Commit to **Functionalism** (thermostat has a tiny interest, shrimp has stronger interest).  
      - **No, goals alone aren't enough:** Commit to views requiring a persisting subject. Go to Q5.  

  5.  **Does moral status require a single, unified self making choices over time?**  
      - **Yes, a rational/persisting self is essential:** Commit to the **Rational-Agency View** (only beings like adult humans count directly; animals/plants/objects matter indirectly via our character).  
      - **No, local/transient desires suffice:** Commit to the **Desire-Based View** (what matters is having desires/frustrations now, e.g., shrimp yes, ant worker yes, colony? maybe not unified self).  
      *(Note: A "No" here combined with Q4's "No" lands **nowhere** – it rejects sentience, welfare, goals, *and* a self. This combination is **unexplored & likely incoherent**, as it lacks any clear criterion for moral status.)*  

  **Convergence Note:** At Q5, the "Yes" answer leads *only* to the Rational-Agency View. The Desire-Based View ("No") is distinct but reached via rejecting both functional goals (Q4) and requiring no unified self (Q5). The Threshold/Precautionary views (Q2) are binary sentience views distinct from the graded/scaling views reached via Q1's "Dimmer" (Q3/Q4). Functionalism is isolated by Q4's "Yes".
