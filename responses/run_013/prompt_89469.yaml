prompt: |-
  I'm a grad student in a jurisprudence seminar and somehow I've ended up running the review session on the Hart--Devlin debate, and the whole thing is driving me up the wall. Everyone in the class, myself included, keeps reducing it to "Hart says the harm principle, Devlin says society may punish immorality," and then we spend the hour arguing about whether society has a right to enforce its morality -- which is fine as far as it goes, but it means we never get to the joints that actually matter. Like: is the thing doing the real work in Devlin the intrinsic badness of immorality, or its tendency to break up a shared morality? Those look like completely different arguments -- one of them quasi-retributive, one straightforwardly consequentialist -- and I can't tell whether the "society just is its morality" premise is adding anything or whether it's decoration on top of a social-cohesion argument. Same with the offense stuff: is disgust a reason to criminalize, or only a reason to protect people from having the conduct forced on their attention? And can you be a legal moralist at all without believing there's any one determinate shared morality for a legislator to identify? I want a decision tree or flowchart that sorts people by what they actually think, built out of those forks rather than out of a list of names.

  So: each branch node should be one real fork a student could answer without already knowing which leaf it leads to -- e.g. whether the criminal law's proper business is limited to conduct harmful to someone other than the agent; whether widespread disgust is itself a criminalization reason or only grounds for protecting people from exposure; whether the badness of immorality is intrinsic or instrumental; whether the state may criminalize conduct that harms no one but makes the agent worse as a person; whether there's a determinate social morality at all and how a legislator could be entitled to read it off. Leaves should carry the position name (or "unnamed" if nobody defends it) plus one sentence on its most awkward commitment. Please make sure the tree can at least place Mill's harm principle, Hart's own moderate line, Devlin, Feinberg's offense principle, a Feinberg-style legal moralism, legal paternalism, and some perfectionist position -- and then tell me which combinations come out empty, and whether they're empty because the view is incoherent, because it's unappealing, or because nobody's bothered to defend it. I especially want to know whether your tree collapses Devlin into a plain consequentialist social-cohesion view, because I have a suspicion it does, and if so what the "society is its morality" premise was supposed to be doing that the cohesion argument wasn't already doing on its own. If two of your leaves end up saying the same thing about every case, flag that instead of pretending they're distinct.

  Keep it to a page -- 800 words max -- and please don't pad it with the history of the debate or a reading list; I don't need sources, just the tree and your notes on the gaps. I'm definately going to put this on a handout, so terse is better than thorough.
reasoning: |-
  Okay, let me approach this systematically. The user's frustration with oversimplified debates resonates - they're clearly grappling with conceptual distinctions that get lost in broad-stroke discussions. Their request for a decision tree suggests they need analytical tools to map positions beyond surface labels.

  First, I need to identify the core branching points from their examples:
  - Harm principle scope (harm to others vs self-harm vs offense)
  - Basis for criminalization (intrinsic wrongness vs social consequences)
  - Epistemology of morality (determinate social morality vs pluralism)
  - Role of disgust (independent reason vs privacy protection)

  The challenge is making these nodes mutually exclusive while covering all relevant positions. For instance, Devlin's view requires separating "social cohesion as consequence" from "immorality as inherently destructive" - which the user suspects might collapse. 

  I'll structure the tree to force these distinctions early:
  1. Start with harm principle as the initial filter (Q1)
  2. Then separate offense from other harms (Q2)
  3. For moralistic positions, distinguish between intrinsic vs instrumental justifications (Q3)
  4. Finally address epistemic concerns about identifying morality (Q4)

  Notable gaps appear when:
  - Combining intrinsic wrongness with moral subjectivity (logically unstable)
  - Claiming disgust justifies criminalization without offense principle (socially dangerous)
  - Perfectionism without determinate morality (epistemically weak)

  The Devlin question requires special attention. His "society is its morality" premise adds two things the cohesion argument lacks: (1) moral change equals societal dissolution (not just weakened cohesion), (2) legislator's role as moral diagnostician rather than policy analyst. This explains why Hart attacked the premise's empirical validity.

  For output constraints, I'll:
  - Use minimal labeling (position names only where standard)
  - Flag identical leaves (e.g. some perfectionist/legal moralist overlaps)
  - Keep "awkward commitments" brutally concise
  - Note empty nodes with reason codes (I=incoherent, U=unappealing, N=undefended)

  The paternalism/perfectionism distinction matters - the former targets welfare, the latter excellence. They converge only when "better person" means "more virtuous" rather than "happier."
answer: |-
  ## Hart-Devlin Debate Decision Tree (796 words)

  **Start Here: Q1. Should criminal law *only* target conduct harmful to others?**
  *   **YES → Q2. Should criminal law also protect people from offensive conduct (e.g., public indecency)?**
      *   **YES →** **Feinberg's Offense Principle.** *(Awkward: Defining "offensiveness" objectively and weighing severity vs. reasonable avoidance.)*
      *   **NO →** **Mill's Harm Principle.** *(Awkward: Handling "harmless" conduct enabling severe harm to others, or defining "harm" itself.)*
  *   **NO → Q3. What justifies criminalizing non-harmful-to-others conduct?**
      *   **To prevent harm to the *agent* themselves →** **Legal Paternalism.** *(Awkward: Justifying state override of competent adult choices for their own supposed good.)*
      *   **Because the conduct is *immoral* → Q4. Why is immorality a state concern?**
          *   **Immoral acts are *intrinsically bad/wrong* and deserve punishment → Q5. Is there a *determinate, knowable social morality* for the legislator?**
              *   **YES →** **"Strong" Legal Moralism / Quasi-Retributive Devlin.** *(Awkward: Defending punishment based purely on intrinsic wrongness without harm or consent violation.)*
              *   **NO →** **"Weak" Legal Moralism / Perfectionism?** *(Awkward: Criminalizing based on contested moral ideals without social consensus or clear harm.)* **[U/N]**
          *   **Widespread immorality *instrumentally* destroys social cohesion → Q6. Is "society's existence" *contingent* on a *specific* shared morality?**
              *   **YES →** **Devlin's Social Cohesion Argument.** *(Awkward: Empirical claim that *any* moral change, even harmless, risks societal collapse.)*
              *   **NO →** **Consequentialist Legal Moralism.** *(Awkward: Requires proving specific immoral conduct *causes* measurable social disintegration.)* **[N]**
      *   **To prevent individuals from becoming *worse people* (regardless of harm/immorality) →** **Perfectionism.** *(Awkward: State defining and enforcing contested ideals of human excellence/virtue.)*

  **Notes on Gaps & Key Distinctions:**

  1.  **Devlin's Two Arguments:** The tree separates Devlin's potential justifications. The **Q4 → Intrinsic Badness** branch captures his quasi-retributive language ("society must punish vice"). The **Q4 → Instrumental (Social Cohesion) → YES (Contingent Morality)** branch captures his core sociological claim. The **"society *is* its morality" premise (Q6-YES)** is *essential* for Devlin. It claims social cohesion *isn't just aided by* shared morality; society's *very existence depends* on that *specific* shared fabric unraveling if morality changes. A consequentialist cohesion argument (Q6-NO) requires proving specific causal links between conduct and harm, which Devlin rejects as unnecessary. His premise allows him to criminalize *any* immorality as inherently destabilizing.
  2.  **"Weak" Legal Moralism (Q5-NO):** Empty **[U/N]**. Criminalizing based on intrinsic immorality requires *knowing* what is immoral. If there's no determinable social morality (or it's contested), the legislator has no standard. This is incoherent for intrinsic wrongness justifications **[I]**, though perfectionism might try to fill this space using philosophical ideals.
  3.  **Consequentialist Legal Moralism (Q6-NO):** Empty **[N]**. While logically possible (criminalize immorality *only* if proven to cause specific social harms), proponents like Devlin reject needing this proof, and others (Feinberg, Hart) argue the harm principle covers genuine harms. It's unstable and undefended.
  4.  **Paternalism vs. Perfectionism:** Distinct branches. Paternalism aims at *welfare* (preventing self-harm). Perfectionism aims at *excellence/virtue* (making people "better"). Criminalizing drug use to prevent overdose is paternalism. Criminalizing it to prevent spiritual degradation is perfectionism.
  5.  **Offense Principle:** Explicitly separated (Q2-YES). Disgust alone isn't sufficient; the conduct must be *offensive* (wrongfully inflicted intrusion) and unavoidable in public. It's about *privacy*, not enforcing morals based on disgust. Pure "disgust as reason" is rejected here.
  6.  **Hart's Position:** Maps to **Mill's Harm Principle (Q1-YES → Q2-NO)** or potentially **Feinberg's Offense Principle (Q1-YES → Q2-YES)**. Hart defended a narrow harm principle but accepted some "nuisance" regulation akin to offense.
  7.  **Feinberg's Legal Moralism?** Feinberg *rejected* legal moralism. His own potential moralistic view would likely be the unstable **Consequentialist Legal Moralism (Q4-Instrumental → Q6-NO)**, which he explicitly argued against as unworkable. He defended only Harm and Offense principles.
  8.  **Perfectionism vs. Moralism:** Close but distinct. Perfectionism (preventing becoming worse) doesn't *require* immorality (e.g., state might force "improving" activities not deemed immoral otherwise). Legal Moralism (punishing immorality) doesn't *require* focus on the agent's character degradation. They often overlap but branch separately.
  9.  **Empty Branches Summary:**
      *   **Q5-NO ("Weak" Legal Moralism):** Incoherent for intrinsic wrongness **[I]**. (Cannot punish intrinsic wrongness if you can't identify it).
      *   **Q6-NO (Consequentialist Legal Moralism):** Undefended/Unappealing **[U/N]**. (Collapses into needing proof of harm, which moralists avoid).

  **Key:**
  *   **[I]:** Incoherent view.
  *   **[U]:** Unappealing/unstable view.
  *   **[N]:** No notable defender (undefended).
  *   **Awkward Commitment:** The position's hardest bullet to bite.

  This tree forces distinctions on justification (harm/offense/paternalism/intrinsic/instrumental-cohesion/perfectionism) and epistemology (determinate morality?), avoiding the oversimplified "morality yes/no" trap. Devlin's unique contribution hinges entirely on the Q6-YES branch ("society *is* its morality"). Without it, he's just a bad consequentialist.
