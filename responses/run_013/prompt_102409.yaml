prompt: |-
  I'm a graduate student in philosophy, and next week I'm running a seventy-five-minute session for an interdisciplinary ethics reading group — the members are lawyers and public-policy students who are comfortable with crude versions of consequentialism and Kantianism but have never read Bernard Williams, and who, when they have encountered the phrase at all, assume that integrity is just a word for stubbornly sticking to one's principles. The topic is Williams's objection from integrity and the related complaint that the devoted husband who saves his wife only after registering that she is one person among others has had one thought too many. I don't want the content delivered to me; I want a plan for how to teach it, because the thing I keep fumbling is that these look like a single objection and I suspect they are two, resting on different targets — one on what a moral theory may demand of a person's ground projects, the other on what the very shape of a justification has to be — and I cannot work out which of them has to be in place before the other can even be heard.

  So: tell me the order in which the components have to be introduced for the objection to land as an argument rather than a mood, and what each component depends on. Tell me which single case should carry the whole session, and whether it should be the drowning wife or something less worn — if not that, then what the carrying case must have and, just as important, what it must not have, since I suspect the standard case quietly smuggles in the conclusion. Give me the misconceptions they will form in the order they will form them — my guess is that they will hear the objection as special pleading, as a defence of doing whatever you feel like, and as an argument that impartial morality is simply false — and mark the exact point in the sequence where each should be headed off. Then give me one question I can put at the end that would show me they have understood the objection rather than merely been persuaded by it, and tell me what I should openly declare I am leaving out at this level (the replies from the consequentialist side, the machinery of reasons and their grounding) rather than letting them leave thinking the session covered it.

  Give this to me as exactly five numbered items, each one or two sentences, with no introduction and no conclusion; if some of what I have asked for belongs together, combine it, but keep the list at five.
reasoning: |-
  Okay, the user is a philosophy grad student preparing a session on Bernard Williams' integrity objection for an interdisciplinary ethics group. They need a structured teaching plan with five precise items. 

  First, I recognize their core struggle: disentangling Williams' two objections (ground projects vs. justification structure) and sequencing them logically. The lawyers/policy students likely approach ethics through rigid frameworks, so I must prevent misinterpretations like "integrity=stubbornness" or "this defends selfishness."

  For the teaching sequence: Start with the "one thought too many" example to hook them emotionally, but choose a fresh case to avoid preconceptions. The drowning wife is overused; a parent's medical decision would work better—it preserves the personal tie element without spousal gender assumptions. 

  Item breakdown: 
  1. Establish the case's emotional weight first (parent example), then reveal Williams' critique of impartial justification. 
  2. Explicitly separate the two objections: one attacks moral theory's demands on identity-shaping commitments, the other attacks justification structure itself. 
  3. Preempt three misconceptions in order: special pleading (counter with "ground projects aren't arbitrary"), moral subjectivism (emphasize non-arbitrary constraints), and anti-impartiality (clarify it's about excessive imposition). 
  4. Use the parent case exclusively—it must show non-replaceable personal investment without smuggling conclusions (unlike the wife case which may imply marital duty). 
  5. For assessment, ask them to generate a new example meeting Williams' criteria. Omissions to declare: consequentialist replies (e.g., indirect utilitarianism) and reasons ontology.

  The parent case is safer—it avoids the "marital obligation" subtext that could preload conclusions in the wife scenario. For the final question, testing their ability to apply the concept reveals deeper understanding than agreement.
answer: |-
  Here are five numbered items:

  1. **Begin with the "one thought too many" scenario using a fresh case** (e.g., a parent justifying saving their child by weighing lives impartially), emphasizing the jarring *moral tone* of such justification. This depends on participants grasping that motives matter ethically, not just acts.

  2. **Distinguish the two objections explicitly: (a) the attack on demanding abandonment of identity-constituting "ground projects" (e.g., artistic work, family devotion), and (b) the attack on impartial moral theories requiring justification structures alien to personal relationships**. (b) must be understood *before* (a) is fully heard, as the "one thought" case reveals the alien justification.

  3. **Preempt misconceptions sequentially**:  
     - **After introducing (b)**: Head off "special pleading" by stressing Williams targets *the theory's structure*, not the permissibility of the act.  
     - **When introducing (a)**: Head off "defence of doing whatever you feel like" by defining "ground projects" as deep, identity-forming commitments, not whims.  
     - **After presenting both**: Head off "impartial morality is false" by clarifying Williams objects to its *overbearing* demands/rationality, not its validity in other domains.

  4. **Use *only* the parent/child case throughout**; it must involve a constitutive relationship where impartial justification feels *psychologically corrosive*, and must *not* imply prior duty (e.g., avoid spouse case to prevent smuggling spousal obligation).

  5. **End with: "Construct a scenario where acting on an impartial moral reason *would* constitute 'one thought too many' for Williams, and explain why."** Declare omission: Consequentialist replies (e.g., indirect strategies) and metaethical foundations of reasons.
