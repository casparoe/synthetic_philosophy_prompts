answer: |-
  **Bureau of Assertoric Standards**  
  **Compliance Bulletin CB-83.7**  

  1. Assertions remain subject to the Correctness Standard (CS: Knowledge Requirement), whereby an utterance is deemed compliant *only if* the speaker satisfied the Bureau’s evidentiary sufficiency thresholds (per Annex 12-D) at time of emission, regardless of subsequent verifiability outcomes; this constitutes the sole safe harbor against retroactive CS violations.  
  2. Utterances failing CS are reclassified as Category-3 Assertion-Like Emissions (ALE-3), falling outside Bureau jurisdiction; however, repeated ALE-3 emissions within evaluative contexts may trigger Permissibility Standard (PS) review under Section 9(g).  
  3. CS applicability is determined by the epistemic standards prevailing in the jurisdiction where assessment occurs; jurisdictional variance in standards does not constitute grounds for appeal, as Bureau policy recognizes no material inconsistency in enforcement protocols.  
  4. All claims with de minimis objective probability (per Schedule C: Lottery Tickets, Dice Rolls, etc.) require explicit prefatory disclaimers (e.g., "Statistically probable but unverified:") to avoid automatic PS noncompliance.  
  5. Utterance patterns exhibiting reflexive knowledge-denial (e.g., "P, but I lack knowledge of P") are prohibited under PS §5.1(a) as prima facie evidence of noncompliant assertion irrespective of CS adherence.
