       - Cannot override the premise majorities without further justification.
    3. **Propose alternatives**: For truth-tracking, use premise-based voting (Claim 2). For legitimacy, uphold the whole vote but acknowledge its epistemic limitations.

  The chair's move is defensible only under strict procedural rules (Claim 4), but 2H1, as a general slogan, **cannot bear the weight** of resolving the doctrinal paradox. Focus the committee on choosing an aggregation method explicitly, rather than invoking platitudes.
