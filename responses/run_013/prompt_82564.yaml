  **Written Opinion for Deployment Review Board Meeting**

  **Introduction**

  This opinion addresses the proposed value-loading protocol for the civic assistant, which must advise on deeply personal matters for millions. The protocol's three components—panel prior, neutrality floor, and certified profile override—aim to balance representativeness, neutrality, and individual choice. However, the pilot revealed tensions, particularly when the panel prior led to advice that overrode a minor's opportunity (the scholarship case). This opinion evaluates the protocol against four critical questions and recommends amendments to strengthen it.

  **Analysis of Key Issues**

  1. *Pairwise elicitation and commensurability*: The pairwise comparison method assumes that values can be ranked on a single scale. This is problematic for deeply held, incommensurable values (e.g., individual autonomy vs. family authority). While the method efficiently aggregates preferences, it risks flattening moral complexity. However, the panel prior is currently the most feasible way to reflect collective preferences. To mitigate this, we propose that when panel agreement falls below 60%, the assistant presents multiple viewpoints without a single recommendation, acknowledging incommensurability.

  2. *Neutrality floor: binding or empty?* The neutrality floor requires that any answer be justifiable to any resident, regardless of their conception of the good. Without concrete criteria, this risks becoming an empty formula that inadvertently encodes majority values. For instance, in the scholarship case, the advice to defer to parents might not be justifiable to a resident who prioritizes individual autonomy. To make the floor binding, we must develop clear guidelines: justifications must rely on publicly accessible reasons and evidence, avoiding sectarian assumptions. This reformulation will require operational definitions but preserves the principle.

  3. *Unit of aggregation for minors*: When the user is a minor, advice affects the household and broader community. The district-level panel prior (as in the pilot) may not capture household-level values. We recommend retaining the district as the unit for practical reasons but requiring the assistant to explicitly prompt minors to involve guardians in decisions. Additionally, the profile override can be used by minors (or guardians) to select a community profile that aligns with their household, subject to the neutrality floor.

  4. *Profile override for minority users*: The override allows minority users to receive advice aligned with their values, but it risks stranding them with lower factual quality if the certified profile's "settled positions" compromise accuracy. The neutrality floor should prevent this by requiring cross-community justifiability. To ensure compliance, we will audit override answers for factual accuracy. This protects minority users while respecting their values.

  **Recommendation**

  Adopt the protocol with the following amendments:

  1. **Panel prior**: When panel agreement on a specific question is below 60%, the assistant must present the main viewpoints (e.g., "Some argue... Others contend...") and decline to resolve the disagreement.
  2. **Neutrality floor**: The agency will develop and publish an operational manual within four weeks, defining "justifiable to any resident" as requiring reasons based on publicly accessible evidence and non-sectarian reasoning.
  3. **Minors' context**: For users under 18, the assistant will include a standard prompt: "This advice may affect your household. Discuss it with a trusted adult."
  4. **Override audits**: Quarterly audits of answers under certified profiles will be conducted to ensure factual accuracy and neutrality floor adherence.

  Rollout can proceed as scheduled in three weeks. The amendments (1 and 3) require minimal software changes and can be implemented by rollout. The manual (2) and audits (4) will follow shortly after.

  **Strongest Counterargument**

  The 60% threshold for the panel prior arbitrarily imposes a single scale on values when above the threshold, failing to address incommensurability. The neutrality floor, even with guidelines, may default to majority norms under pressure for concrete answers. The multi-viewpoint approach below 60% could leave vulnerable users without clear guidance in critical decisions, potentially harming those most in need of decisive advice.

