answer: |-
  Your instincts are sharp, and the framing is excellent—especially your validity hunch, which is significantly upstream and underexplored. Deflationism *isn't* settled; what's settled are the *old* moves. The interesting frontiers now lie precisely where deflationism interfaces with normative and structural constraints on reasoning—and your toolkit is perfect for this. Below is a prioritized list of *tractable, high-leverage questions* for your year, defended based on **philosophical urgency**, **neglect in the literature**, **fit with your skills**, and **potential for decisive progress**.

  ---

  ### **Priority 1: Validity as the Litmus Test**  
  **The Core Problem:** If truth is *merely* a device for generalization (as deflationists claim), how can "truth-preservation" be the *normative standard* for valid inference? This isn't about semantics—it's about **why we *should* care about truth in reasoning**. If validity reduces to truth-preservation, but truth is insubstantial, does validity collapse into triviality or circularity?  

  **Why it’s upstream:**  
  - **Attacks deflationism’s core promise:** Deflationism sells itself as "philosophically lightweight." If it cannot account for the *authority* of logic without smuggling in substance, it fails at its own game.  
  - **Impacts all truth-conditional semantics:** If truth-preserving inference isn’t inherently normative, the deflationist loses their best explanation for why logical rules are binding.  
  - **Your toolkit is ideal:** Use proof theory to model how truth rules (e.g., T-introduction/Elimination) interact with consequence relations. Can a deflationist endorse a proof system where truth rules are *sufficient* to define validity, or does this require non-deflationist assumptions (e.g., grounding in a substantive property)?  

  **Tractability in a year:**  
  1. **Formalize a "deflationist-friendly" notion of validity** in a system like LP (Logic of Paradox) or FDE (First-Degree Entailment), which handle paradoxes transparently. Test whether truth-preservation can be derived *only* from the T-schema + inference rules.  
  2. **Pressure-test against counterexamples:** E.g., in a dialetheic framework, some truth-preserving inferences exploit "triviality gaps" (e.g., *ex falso quodlibet*). Does the deflationist need to restrict validity to avoid this? If so, how—and does that require substance?  
  3. **Key evidence:** If you can show that standard proof systems *implicitly* rely on truth having a substantive role (e.g., via cut-elimination or harmony proofs), that’s a major strike against deflationism. Conversely, a formal model where validity "emerges" from truth rules alone would be groundbreaking.  

  **Neglect level:** High. Most work on deflationism and logic focuses on paradoxes (e.g., Field, Beall) or expressive role (e.g., quantification). The *normative authority* of truth-preservation is rarely addressed head-on.  

  ---

  ### **Priority 2: Operator vs. Predicate – The Fork in the Road**  
  **The Core Problem:** The choice between truth-as-operator (e.g., "it is true that p") and truth-as-predicate (e.g., "‘p’ is true") isn't just technical—it reshapes deflationism’s explanatory scope, especially for generalizations and validity.  

  **Why it’s upstream:**  
  - **Operator approaches avoid paradoxes more elegantly** (e.g., typing or context-dependence isn’t needed). If truth is an operator, it doesn’t "apply" to sentences in a way that generates liar loops.  
  - **But:** Operators struggle with generalizations like "All propositions of form *p ∨ ¬p* are true." Predicate-based deflationism handles this via quantification, but at the cost of inviting paradoxes.  
  - **Validity connection:** If truth is an operator, "truth-preservation" might reduce to syntactic or inferential rules (e.g., "If *A*, and *A → B*, then *B*"). This could sidestep the need for a "substantive" truth-property in logic.  

  **Tractability in a year:**  
  1. **Build a formal semantics for a truth-operator system** (e.g., extending modal logic with a transparent truth-operator). Compare its treatment of validity to predicate-based systems.  
  2. **Test the "generalization problem":** Can an operator-based deflationist express "Everything Socrates said is true" without collapsing into a predicate? (Hint: Look at hybrid logics or Grover’s prosentential theory.)  
  3. **Key evidence:** If operator-based deflationism resolves paradoxes *and* handles generalizations *and* explains validity more cleanly, it’s a paradigm shift. If it fails, predicate-based deflationism is the only viable path—but its paradox-handling mechanisms (e.g., hierarchical theories) may conflict with deflationism’s "lightweight" ethos.  

  **Neglect level:** Moderate but crucial. The operator approach is often dismissed as "notational" (e.g., Gupta), but your proof-theoretic skills can show it’s a live alternative.  

  ---

  ### **Priority 3 (If Time): Generalization to Reference/Content – The Minefield**  
  **The Core Problem:** Deflationists (e.g., Horwich) claim reference and content are similarly "non-substantive," but this faces brutal pushback (e.g., from Field: deflationary truth + substantive reference = incoherent).  

  **Why it’s lower priority:**  
  - **Metasemantic quicksand:** To avoid metaphysics, you’d need a purely formal account of how reference/meaning "deflates." This requires bridging formal semantics (your strength) with philosophy of language (where substantive debates lurk).  
  - **Less directly tied to validity:** While reference/content matter for semantics, validity is about *inference*, not meaning-fixing.  
  - **Risk of distraction:** Many have sunk years into this. Your validity-focused angle is fresher.  

  **Tractability tip:** If you pursue this, *constrain it to logical terms*. E.g., can a deflationist account for the meaning of "∧" or "∀" without invoking truth-conditions? Your proof-theoretic background helps here (e.g., via inferential role semantics).  

  ---

  ### **What to Deprioritize (For Now):**  
  - **"Why care about truth?"** – Important, but likely intractable in a year. It’s deeply normative and may require engaging moral philosophy.  
  - **Paradoxes as litmus test** – Important, but often overplayed. A deflationist can adopt *any* consistent solution (e.g., classical glut, paracomplete) without compromising core tenets.  

  ---

  ### **Your Validity Hunch Tested**  
  You’re **right** that this is upstream. Deflationists (e.g., Horwich) often handwave validity as "obvious," but if truth-preservation is *explanatorily idle*, logic becomes a brute practice—undermining deflationism’s claim to demystify truth. You’re **wrong**, however, if you think this is *only* about formal semantics. It’s about the **normativity of logic**: why *should* we obey truth-preserving rules? If deflationism can’t answer this, it fails as a philosophy of reasoning.  

  ---

  ### **The 1-Year Plan: Validity-First**  
  1. **Months 1–3:** Formalize a deflationist-friendly proof system (e.g., in sequent calculus) with truth rules only. Test if it can derive validity as a primitive/norm.  
  2. **Months 4–6:** Switch to operator-based truth. Can it handle validity/generalizations better? Use proof-theoretic semantics (e.g., "meaning as use") to avoid metaphysics.  
  3. **Months 7–9:** Stress-test both against paradoxes and normativity challenges.  
  4. **Months 10–12:** Write. Aim for 2 publishable papers: one on deflationism/validity, one on the operator-predicate fork.  

  **Why this ordering?** Validity is the keystone. If deflationism cracks here, the rest is decorative. Operator vs. predicate is the tool to fix it. Your skills make this winnable—and a dissertation that forces deflationists to confront the normativity of logic will *not* be ignored.  

  > *"Truth is inert; logic is normative. Deflationism lives or dies in the gap between them."*  
  > — Press that gap hard.
