    "decision_rule": "Adjust TRP parameters via a risk-adjusted cost-benefit framework: (1) Estimate failure severity using red-team probes on critical scenarios; (2) Set monitoring intensity inversely to confidence from evasion testing and threat modeling; (3) Scale down components only after demonstrating reduced harm in staged rollouts; (4) Retire TRP fully when operational data shows near-zero incidents across adversarial triggers and the cost of false negatives exceeds safety gains.",
    "residual_uncertainty": "This framework assumes that threat models accurately capture attacker capabilities and that staged rollouts detect failures before broad impact. Contestable premises include the weaker model's true independence and whether human reviewers can reliably catch sophisticated deception."
  }
