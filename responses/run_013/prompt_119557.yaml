        "why_it_does_not_hold": "Safety decisions must incorporate system-level risks, including deployment context, failure severity, and exploit potential. Ignoring operational factors like update cadence or attacker incentives oversimplifies the threat model. Cost-benefit tradeoffs between safety and efficiency are critical."
