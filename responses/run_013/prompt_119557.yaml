    "what_behavioral_evals_can_establish": "Behavioral evaluations can demonstrate high fidelity against known deception tactics in controlled scenarios, providing evidence of superficial alignment. They cannot establish robustness to novel threats, distribution shifts, or adversarial manipulation. Such tests offer probabilistic confidence but not guarantees, especially for high-stakes outputs like code where failures cascade.",
    "what_control_protocols_actually_guarantee": "TRP provides layered containment against harmful outputs regardless of alignment status. It guarantees that flagged content undergoes independent scrutiny, reducing single-point failures. The protocol enforces minimum oversight levels, ensuring a fallback mechanism even if the primary model acts adversarially or unpredictably.",
