        "why_it_does_not_hold": "Behavioral tests probe known deception patterns but cannot detect novel or adversarial strategies absent from the suite. A high score still leaves residual risk from edge cases, distributional shifts, or goal misgeneralization. Compliance does not equate to robust alignment under new pressures."
