  Okay, let me start by unpacking Dan's argument against expressivism. He's using a numbered list, so I need to go through each step carefully. The core idea is that expressivism says the meaning of a sentence is the mental state it expresses. For "lying is wrong," that's disapproval. But when this phrase is inside a conditional, like "If lying is wrong, then getting your brother to lie is wrong," the speaker isn't necessarily disapproving of lying. So the embedded phrase isn't expressing disapproval, which by premise (1) means it either has a different meaning or none at all. This leads to problems with modus ponens and the validity of moral arguments.

  The user mentioned that the same issue arises with "but" and slurs. For example, "if she's poor but honest" – "but" usually expresses a contrast, but in a conditional, the speaker might not be contrasting anything. Similarly, slurs express contempt, but in "if that word is a slur," the contempt isn't necessarily present. Yet these embeddings work, so maybe expressivism can handle this too.

  I need to figure out which premise to reject. Premise (1) seems fundamental, but rejecting it might undermine expressivism entirely. Premise (4) says that in the conditional, "lying is wrong" isn't expressing disapproval. But expressivists like Blackburn or Gibbard have solutions here. They argue that embedded contexts express higher-order attitudes. For example, the conditional expresses disapproval of disapproving lying without also disapproving of getting brothers to lie. So the embedded part still functions within an attitude-expressing framework without needing to directly express the original attitude.

  The user wants to know which step to reject, the cost, and if it applies to "but" and slurs. Rejecting (4) seems right. The cost is that expressivism becomes more complex, needing to explain how expressions work in embeddings through higher-order attitudes. This handles "but" and slurs too. For "but," the conditional expresses a stance on the contrast. For slurs, it's about the appropriateness of using the term. So the solution covers all cases without separate patches.
answer: |-
  **Reject (4): The embedded "lying is wrong" *is* expressing a state (a higher-order attitude), costing expressivism simplicity.** 

  Dan's argument is the classic Frege-Geach problem. Step (4) assumes that the *only* mental state "lying is wrong" *could* express is the direct, first-order disapproval described in (2). This is the mistake. Expressivists (like Blackburn or Gibbard) argue that in embedded contexts like conditionals, moral terms express *higher-order* attitudes.

  1.  **What's expressed changes:** Uttering "If lying is wrong, then getting your little brother to lie is wrong" doesn't express direct disapproval of lying. Instead, it expresses a higher-order attitude *about* disapproval. It expresses an attitude of *disapproving* of *combining* disapproval of lying with a *lack* of disapproval of getting your brother to lie. You're expressing a stance *about* the connection between two moral stances.
  2.  **Meaning preserved:** The phrase "lying is wrong" *still* contributes its core expressive meaning – the concept of disapproval of lying – to the larger expression. Its meaning is consistent, but the *speaker's current act of expression* uses that concept to build a more complex attitude, not to directly manifest the base disapproval itself.
  3.  **Validity saved:** The modus ponens argument works because the premise "Lying is wrong" expresses direct disapproval. The conditional premise expresses disapproval of the mismatch described above. The conclusion follows because accepting both premises logically commits you to disapproving of getting your brother to lie (to avoid the mismatch you disapprove of). No equivocation.
  4.  **The Cost:** This move saves expressivism but makes it much more complex. Expressivists must develop sophisticated accounts of how complex attitudes are built from simpler expressive components and how logic works with attitudes. It abandons the naive simplicity of "meaning = simple expression of one feeling".

  **Handling "But" & Slurs:** This fix works *exactly* the same way for your examples:
  *   **"But":** "She's poor but honest" expresses a contrast (surprise/value judgement). "If she's poor but honest..." expresses a higher-order attitude *about* that contrast (e.g., accepting that the contrast holds implies something else), not necessarily manifesting surprise *at that moment*.
  *   **"Slur":** "That word is a slur" expresses condemnation of its use. "If that word is a slur, then..." expresses an attitude *about* that condemnation (e.g., acceptance that condemnation implies you shouldn't use it), not necessarily expressing the contempt *itself* at that moment.

  The solution is the same: embedded expressive content contributes its core meaning to build a more complex attitude expressed by the whole utterance. No separate patch is needed.
