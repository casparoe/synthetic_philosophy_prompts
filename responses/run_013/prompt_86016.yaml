  For responses: With historians, anchor in archival specifics but pivot to structural parallels. With the economist, admit counterfactual limits but reframe as pattern-matching. The fatal fumble would be getting dragged into defending nuclear analogy nuances instead of keeping focus on print-AI parallels.

