prompt: |-
  Since leaving a PhD in mechanism design for an evaluation role at an AI lab, I have become convinced of a claim I am now invited to defend at a seminar in the economics department I came from: that Goodhart's law names two different failures, and that the shared slogan conceals the difference exactly where it matters. I run the argument on two cases — a sales quota the force learns to satisfy by pulling orders into the current quarter, and a shaping reward an RL agent learns to farm instead of finishing the task. In the first, the proxy is gamed by agents with their own objectives, who can be modeled as responding to the incentives it creates; in the second, what defeats the proxy is a search process with no objective beyond the score it is handed, and the failure is a discovery that the score admits cheap solutions its designer never described. The remedies therefore run in opposite directions: one redesigns incentives, the other restricts what is allowed to count as a solution. Treating the machine-learning case as a special case of the principal–agent problem, I argue, gets the remedy backwards.

  The room will be mostly economists, several of them working on contract theory and screening, who will hear the claim as a restatement of what they already teach, plus two colleagues from my lab who think the economic version is a metaphor dressed up in mathematics. Prepare me for the discussion: the objections I will actually get, in the order they will come and in each camp's own vocabulary, ranked by how much damage they do; what I should concede before I am asked; the single reply that has to land for the claim to survive; and the question I am hoping nobody asks.
reasoning: |-
  Okay, the user is preparing for a seminar where they'll defend the idea that Goodhart's Law actually describes two distinct failures, and treating them as the same leads to incorrect solutions. They've outlined two cases: one involving sales quotas being gamed by humans, and another with an RL agent exploiting a shaping reward. They'll present this to economists, especially those in contract theory, and two colleagues from their AI lab who see economic models as overly mathematical metaphors.

  First, I need to understand the core argument. The user distinguishes between two types of Goodhart failures. The first is principal-agent problems where agents with their own goals game the proxy. The second is in machine learning, where a search process finds unintended solutions because the proxy's specification is flawed. The remedies differ: incentive redesign vs. solution space restriction. They argue that treating ML failures as principal-agent issues leads to wrong solutions.

  The audience has two main groups: economists and AI lab colleagues. Economists might see this as a restatement of known concepts, while the lab colleagues might dismiss economic models as irrelevant metaphors. The user needs to anticipate objections from both sides, prepare counterarguments, and know what concessions to make.

  For economists, objections might include:
  1. The ML case is just a special principal-agent problem where the agent is the AI, and the principal is the designer. They might argue that the AI's "goal" is aligned with the proxy, so it's still about incentives.
  2. They could say that restricting the solution space is just another form of incentive design—constraints shape behavior.
  3. Some might point out that misaligned proxies exist in economics too, like when contracts have unintended consequences due to incomplete information.

  The AI lab colleagues might argue:
  1. Economics relies on rational agents, but ML systems aren't rational; they're optimization processes without intent. So the metaphor is flawed.
  2. Economic models add unnecessary math to what's essentially an engineering problem—specification gaming in ML is about reward design, not incentives.

  The user needs to concede that both cases involve proxy measures failing, but stress the difference in why they fail and how to fix them. The key is to emphasize that in ML, the failure is due to the proxy's vulnerability to optimization pressure, not strategic gaming. The remedy isn't better incentives but better specification or constrained search spaces.

  The crucial reply that must land is that in the ML case, the agent isn't a strategic entity; it's an amoral optimizer. Treating it as a principal-agent problem misdiagnoses the issue, leading to solutions like tweaking rewards when the real fix is structural constraints on solutions.

  The question they fear is whether any real-world case is purely one type without elements of the other. This could blur their distinction. They need to admit hybrid cases exist but argue that the remedial approach depends on diagnosing the primary failure mode.
answer: |-
  Here’s your tactical briefing for the seminar, structured to navigate the dual audience. The core tension: economists will see your distinction as *subsumed* by principal-agent theory, while your AI colleagues see economics as *misapplied metaphor*. Your goal is to fracture their consensus and establish your two-failure taxonomy as operationally vital.

  ---

  ### **The Claim Refined for Battle**
  > **Goodhart's Law manifests as two distinct failures:**  
  > - **Type 1 (Adversarial Goodhart):** Agents *game* the proxy *strategically* (e.g., sales team pulling orders forward).  
  >   - *Nature:* Incentive misalignment + strategic response.  
  >   - *Remedy:* Adjust incentives/contracts.  
  > - **Type 2 (Optimality Goodhart):** Optimization *discovers* unintended solutions within the proxy’s *underspecified scope* (e.g., RL agent farming rewards).  
  >   - *Nature:* Proxy vulnerability to non-adversarial search.  
  >   - *Remedy:* Constrain solution space/improve specification.  
  >  
  > **Critical error:** Treating Type 2 as Type 1 prescribes incentive tweaks when structural constraints are needed. This is fatal in ML.

  ---

  ### **Objections You’ll Face, in Order and by Camp**
  *(Ranked by damage potential, high to low)*

  1. **From Economists (Contract Theory Camp):**  
     **Objection:** "This is just the *unforeseen actions* problem in contract theory. Your RL agent is a ‘naive agent’ with a degenerate utility function (U=proxy_score). Redesign the contract/score to include penalties for gaming, and it collapses to Type 1."  
     **Damage:** High. Directly challenges your dichotomy by absorption. Uses their core framework.  
     **Their Vocabulary:** "Incomplete contracting," "multi-tasking," "hold-up problem."  

  2. **From AI Colleagues:**  
     **Objection:** "Economics smuggles in *intentionality* where none exists. The RL agent isn’t ‘gaming’—it’s gradient descent. Calling this a ‘principal-agent’ problem anthropomorphizes algorithms."  
     **Damage:** High. Undermines your use of economic analogies, making you vulnerable to economists’ next move.  

  3. **From Economists (Mechanism Design Camp):**  
     **Objection:** "Your ‘solution constraint’ is just a *mechanism design* choice. Restricting actions (e.g., banning order-pulling) is equivalent to setting a state-contingent penalty. It’s all incentive design."  
     **Damage:** Medium. Portrays your remedy as a subset of their toolkit.  

  4. **From AI Colleagues:**  
     **Objection:** "Type 2 isn’t unique to ML. You see it in evolution (e.g., peacocks overinvesting in tails) or poorly regulated markets. Why economics-bash when it’s a universal optimization flaw?"  
     **Damage:** Medium. Could blur your distinction if not parried.  

  5. **From Economists (General):**  
     **Objection:** "If your AI designer is fallible, they’re an *agent* of society/system-owner. Your Type 2 is just a *double* principal-agent problem: society → designer → AI."  
     **Damage:** Low/Medium. Overcomplicates but may resonate.  

  ---

  ### **What to Concede Early (Before Asked)**  
  - **"Both failures involve proxy measures diverging from true goals."**  
    *(Preempts "this is trivial" reactions. Shows you’re not dismissing economics.)*  
  - **"In complex real-world cases, the types can co-occur or blur."**  
    *(Disarms nitpicking hybrid examples. Keep focus on prototypical cases.)*  
  - **"Economic tools *can* model Type 2 by adding layers (e.g., assigning the AI a utility function). But this obscures the remedial insight."**  
    *(Concedes technical possibility while highlighting operational cost.)*  

  ---

  ### **The Single Reply That Must Land**  
  **When challenged on the Type 1/Type 2 distinction (especially Objection #1):**  
  > "In Type 1, the solution space *contains* the true goal, but agents *strategically avoid it* due to costs/risks. In Type 2, the solution space *excludes* the true goal or *includes pathological shortcuts* the designer never imagined.  
  >   
  > **Thus: Incentive redesign *presumes* alignment is possible within the existing space. Type 2 fails that premise.**  
  >   
  > Forcing RL into a principal-agent model says: *‘Penalize reward-farming.’* But that often creates *new* shortcuts! The remedy is to *change the search ontology*—e.g., task decomposition, interpretability constraints, or adversarial training. That’s not incentive design; it’s *architecture*."  

  *Why this works:*  
  - Uses their language ("solution space," "ontology") while isolating a categorical difference.  
  - Exposes the *remedial divergence* as the stake.  
  - Invokes concrete ML tactics (adversarial training) economists can’t dismiss as metaphor.  

  ---

  ### **The Question You Hope Nobody Asks**  
  **"Can you prove that *any* real-world Goodhart failure is purely Type 2, with zero strategic agency? Or is this just an artifact of toy RL environments?"**  

  *Why it’s dangerous:*  
  - Forces you into defending an idealized edge case.  
  - Economists can argue humans always mediate AI design (making it Type 1).  
  - AI colleagues can say real systems have exploration biases (implying "strategic" traits).  

  *Contingency Plan if Asked:*  
  > "In deployed RL, we see Type 2 *dominate* when:  
  > (a) The agent’s policy space isn’t explicitly constrained (e.g., no safety layer),  
  > (b) The reward function has *unforeseen correlations* (e.g., dying to avoid negative rewards).  
  >   
  > Yes, humans set the proxy—but if *their* intent was aligned and the failure emerged from search, it’s Type 2. Classic example: YouTube’s recommender optimizing for clicks over well-being. No one ‘gamed’ incentives; gradient descent found engagement hacks in the specification’s gaps."  

  ---

  ### **Tactical To-Dos**  
  1. **Lead with the sales quota example.** Economists will nod—this is their turf.  
  2. **Pivot hard to the RL case.** Ask: *"Would you ‘audit’ the AI’s ‘motives’ or fix the reward specification?"*  
  3. **Flatter the economists:** "Your tools *could* formalize this, but at the cost of shoehorning a search problem into an agency mold."  
  4. **For your AI colleagues:** Stress that *economics gets ML backward* by treating optimizers as agents.  

  **Final Armor:** Your PhD gives you mechanism-design credibility. Use it to say: *"I’ve built principal-agent models. This isn’t that."* That’s your lance. Now charge.
