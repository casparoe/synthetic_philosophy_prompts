  First, I need to identify if this has a formal name. The user mentioned "acausal" and "surrogate" terms, which might relate to decision theory concepts. Acausal trade comes from AI alignment discussions, involving cooperation without direct causation. Surrogate goals might refer to setting up decoy objectives to absorb threats. But neither term perfectly fits the described pattern.

  Breaking down the user's examples: the key elements are a non-credible threat, mutual pretense of credibility, avoidance of testing the threat, and reliance on the high cost of defiance. The decoy goal example adds a twist where the threat is absorbed by a valueless target. The core mechanism seems to be Schelling's concept of a focal point, where mutual recognition of a salient outcome enables coordination without enforcement.

  The user's deeper needs include understanding the theoretical underpinnings, differentiating from similar concepts (deterrence, credible threats, commitment devices), and knowing its stability conditions. They also want to know if the decoy strategy is part of the same phenomenon or separate. Addressing their questions about decision theory alignment and human vs. rational actors is crucial.

  I recall Schelling's work on strategic behavior, especially focal points and mutually assured destruction (MAD). MAD involves threats that are catastrophic for both, yet they work because neither wants to test them. The user's pattern resembles MAD but on a smaller scale. The decoy goal is a proactive variant, where the defender sets up a sacrifice to protect their real interests.

  The mechanism relies on both parties recognizing the threat's salience and avoiding mutually assured destruction. It's stable only if defiance is too costly to consider, making the threat's credibility irrelevant. If parties have different decision-making models (e.g., humans acting emotionally), the pretense might collapse. The decoy goal is a strategic application of the same principle, using a sacrificial pawn to redirect threats.

  So, the term "Self-Sustaining Pretense" captures the essence: an equilibrium where both sides pretend the threat is credible, sustained by the high cost of testing it. This isn't a standard term but accurately describes the pattern. The nearest concepts are Schelling points and MAD, but without the credibility requirement. The decoy strategy is a tactical application within this framework.
answer: |-
  This pattern you've observed is **fascinating** and incredibly astute. It doesn't have a single, universally agreed-upon name in mainstream game theory or philosophy, but it's a very real and important phenomenon, particularly in situations involving strategic ambiguity, focal points, and the cost of testing norms. Here's a breakdown:

  ### The Core Concept: Self-Sustaining Pretense (Schelling Point + Mutually Assured Costly Verification)

  1.  **The Non-Credible Threat:** It starts with a threat (or rule, or declared goal) that, *if tested*, would likely not be carried out because the costs to the issuer are prohibitive. This makes it fundamentally non-credible in the classical game theory sense (where credibility requires commitment mechanisms like burning bridges or reputation costs).
  2.  **The Focal Point (Schelling Point):** The threat or rule creates a **salient outcome** – a specific point where coordination happens without explicit communication. Both parties recognize that this *is* the declared boundary or rule. It becomes "the thing to point to."
  3.  **The Mutual Recognition of Mutually Assured Costly Verification:** This is key. Both parties understand:
      *   Complying is cheaper than testing.
      *   Testing the threat (defying the rule) would be catastrophically costly *for both sides* if the threat *were* carried out.
      *   However, crucially, **the cost of *finding out* if it's a bluff is itself prohibitively high.** Verification is ruinous.
  4.  **The Pretense:** Because the cost of verification is so high, both parties rationally choose to **pretend the threat is credible**. They treat the declared boundary as real and binding, even though they both privately suspect (or know) it's a bluff. This pretence is stable precisely *because* testing it is irrational for either side.
  5.  **The Equilibrium:** This creates a stable Nash Equilibrium. Neither side has an incentive to deviate:
      *   The issuer doesn't want to actually carry out the threat (too costly).
      *   The receiver doesn't want to defy the threat (risk of catastrophic cost if carried out, plus the high cost just of triggering the confrontation).
      *   So, compliance occurs, and the rule/threat persists unchallenged.

  **Proposed Name:** **Self-Sustaining Pretense (SSP)** or **Costly-Verification Equilibrium**. It emphasizes the mutual act of pretending the threat is real *because* verifying its falseness is too expensive.

  ### Why This Isn't Standard Deterrence or Bluffing

  *   **Classical Deterrence:** Relies on *credible* threats. The threatener must convince the opponent they *will* carry it out, often via commitment devices. SSP *lacks* this credibility at its core.
  *   **Bluffing:** Usually involves deception with the *hope* the opponent backs down. If called, the bluffer folds. SSP isn't primarily about deception; it's about mutual recognition of a coordination point made stable by the cost of testing. The issuer might even *prefer* not to be called, knowing they'd fold, but hopes the high cost of calling prevents it.

  ### How it Differs from Nearest Concepts

  1.  **Schelling Focal Points:** This is the *closest* established concept. Schelling points are solutions people coordinate on without communication because they are salient. SSP is a *specific type* of focal point where the salience is created by a declared threat/rule, and its stability is reinforced by the catastrophic cost of deviating (testing).
  2.  **Mutually Assured Destruction (MAD):** A *subset* of SSP where the threat is nuclear annihilation. It works precisely *because* retaliation is suicidal and unthinkable, so neither side tests it. MAD is a paradigmatic example of SSP, but SSP applies to much lower-stakes scenarios (like your startup rule).
  3.  **Commitment Devices:** Require an upfront, costly action to *make* a threat credible (burning bridges, staking reputation). SSP involves *no such upfront cost*. The "commitment" is purely virtual, sustained by the mutual pretense and the cost of verification.
  4.  **"Madman" Strategy:** Involves acting irrationally/unpredictably to make threats credible. SSP thrives on both sides being *perfectly rational* and understanding the payoffs. It's predictable rationality that *prevents* testing, not unpredictability.
  5.  **Non-Credible Threats (Textbook Failure):** Textbook theory says they fail. SSP shows they *can* succeed *if* the cost of *testing* the non-credibility is higher than compliance for the receiver, *and* the issuer prefers compliance over the chaos of being exposed. The threat doesn't need inherent credibility; it needs the *process of verification* to be too costly.

  ### The Decoy Goal: A Clever Application of SSP

  This is absolutely **the same core phenomenon**, just used proactively and offensively:

  1.  **Setting the Focal Point:** You loudly declare a "goal" (the decoy) that you genuinely don't care about.
  2.  **The Implied Threat:** The *real* threat is implicit: "If you attack my decoy, I will 'defend' it by letting you destroy it, and you will have wasted your threat/leverage." The "punishment" for attacking the decoy is the opponent's wasted effort/leverage.
  3.  **Mutual Recognition of Costly Verification:** Your opponent knows:
      *   Attacking the decoy achieves nothing for them (you don't care).
      *   If they attack the decoy, they reveal their leverage/tactic and gain nothing.
      *   The "cost of verification" (using their threat on the decoy) is high *for them* (wasted leverage). You remain unharmed.
  4.  **The Pretense:** Both sides pretend the decoy matters *to you*. Your opponent pretends they might attack something you value, you pretend the decoy *is* that thing. The opponent avoids attacking the decoy because doing so is costly and futile for *them*.
  5.  **Why it Works Despite Obvious Indifference:** Your indifference *is the key*. Because you don't care, you are *completely predictable* in sacrificing the decoy. The opponent knows attacking it is pointless. The *threat* of attacking the real thing is blunted because they can't easily distinguish or fear triggering your sacrifice of the decoy and wasting their move. The "pretense" is that the decoy has value, making it a Schelling point for absorbing attacks.

  **Is the Decoy the Same?** Yes. It's SSP where:
  *   The "threat" is the opponent's potential use of leverage.
  *   The "rule" is "This decoy is important (to me)."
  *   The "costly verification" is the opponent wasting their leverage on the decoy.
  *   The pretence (pretending the decoy matters to you) sustains the equilibrium where they don't test it (attack it), focusing their efforts elsewhere or being deterred entirely.

  ### Critical Edges and Failure Conditions (What Makes it Stop Working?)

  1.  **Cost of Compliance Exceeds Cost of Testing for Receiver:** If defying the rule/threat becomes *less* costly for the receiver than complying (e.g., the big lab *really* needs feature X; a client offers your startup *massive* money for custom work), they will test it. The pretense collapses.
  2.  **Cost of *Not* Carrying Out Threat for Issuer:** If the issuer develops a reason why *failing* to carry out the threat if tested would be very costly (e.g., massive reputational damage, triggering other defections), they might actually carry it out, destroying the SSP. The threat becomes credible *ex post*, but the equilibrium is broken.
  3.  **Asymmetric Information/Payoffs:** If one side is fundamentally mistaken about the other's payoffs (e.g., the big lab thinks the small lab *would* actually publish the weights out of spite; your sales rep *actually believes* the no-custom-work rule is sacred), it might look like SSP but is actually something else (miscommunication, credible threat by accident). True SSP requires mutual understanding of the underlying indifference/cost structure.
  4.  **Different Decision Theories/Rationality:** **This is crucial.**
      *   **Hyper-Rational Actors (Game Theory Bots):** SSP is stable. They perfectly calculate costs and won't trigger MAD-like verification costs.
      *   **Humans (Emotional/Irrational/Value-Driven):** Can easily break SSP.
          *   **Principle/Emotion:** Someone might defy the rule "on principle" or out of anger/spite, even if costly (`!costly_verification`), just to call the bluff.
          *   **Misjudgment:** Underestimating the verification cost ("How bad could it really be?") or overestimating the issuer's willingness to fold.
          *   **Value Conflicts:** The rule/threat might violate a core value, making compliance impossible regardless of cost (e.g., whistleblowing despite SSP).
      *   **Truly Irrational/Unpredictable Actors:** SSP evaporates. If you can't predict they'll avoid costly verification, the pretense is pointless.
  5.  **Introduction of a Third Party:** A new actor might not understand or care about the pretense, might call the bluff for their own reasons, or might provide the receiver with a way to defy the threat at lower cost.
  6.  **The Stakes Change:** What was once a catastrophic cost becomes manageable, or the value of defiance increases dramatically.

  ### The "Acausal" and "Surrogate" Connections

  *   **Acausal:** This likely refers to **Acausal Trade** concepts from rationalist/AI alignment circles. It imagines agents cooperating *without* direct interaction or causation, based on mutual recognition of logical decision frameworks (like Updateless Decision Theory). Your pattern *resonates* because SSP relies on mutual recognition of rationality and payoffs to sustain cooperation (the pretense of compliance) without the threat ever needing to be causal (carried out). The *predictable rationality* creates a virtual, "acausal" reason to comply. It's not pure acausal trade, but shares the flavor of coordination based on abstract reasoning about each other's decision processes.
  *   **Surrogate:** This fits perfectly with the **Decoy Goal** strategy. The surrogate (decoy) goal stands in for your real values, acting as a target for threats. It's a "surrogate" for your real utility function in the opponent's strategic calculations.

  ### In Summary

  You've identified a powerful strategic pattern: **Self-Sustaining Pretense (SSP) / Costly-Verification Equilibrium**. It leverages a declared threat or rule to create a Schelling focal point, whose stability rests not on the threat's inherent credibility, but on the mutual understanding that *testing* its credibility would be catastrophically costly for both sides. This leads both rational actors to pretend the threat is real, ensuring compliance indefinitely, as long as the cost of defiance (testing) remains higher than the cost of compliance. The decoy goal is a brilliant proactive application of this same principle. It works beautifully among hyper-rational agents but is fragile in the face of human emotion, misjudgment, value conflicts, or significant changes in the underlying cost-benefit landscape. It's the ghost of deterrence, made real not by guns or bridges burned, but by the sheer, mutually acknowledged expense of ever finding out if the emperor truly has no clothes.
