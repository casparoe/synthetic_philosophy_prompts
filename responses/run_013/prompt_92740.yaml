  ### Joint Statement on the Sleeping Beauty Problem  
  **By a Committed Thirder and a Committed Halfer**  

  #### 1. Agreed Claims  
  Both parties agree to the following claims about the setup, evidence, formalism, and principles:  

  1. **The Setup**:  
     - A fair coin is tossed before the first waking.  
     - On heads (\(H\)), Beauty is woken once (on Monday). On tails (\(T\)), she is woken twice (Monday and Tuesday).  
     - Between awakenings, she is given a memory-erasing drug.  
     - All awakenings are indistinguishable; on each, she is asked for her credence in \(H\).  

  2. **Beauty’s Evidence at a Waking**:  
     - She knows the complete experimental setup (including the coin’s fairness and memory erasure).  
     - She knows she is awake and being interviewed.  
     - She does **not** know: the coin outcome, the current day, or whether she has been woken before.  
     - Her evidence is **centered**: it includes the fact that "this awakening is happening now."  

  3. **Credence Assignments Ruled Out**:  
     - \(P(H) = 1\) or \(P(H) = 0\) is impossible (coin is fair).  
     - \(P(H) > 1/2\) violates the coin’s fairness and experimental symmetry.  
     - Assignments ignoring memory erasure (e.g., treating awakenings as independent) are invalid.  

  4. **Self-Locating Beliefs and Centered Propositions**:  
     - Credences can attach to centered propositions (e.g., "the coin landed heads and today is Monday").  
     - **Caveat (halfer)**: Centered propositions are legitimate, but Beauty’s credence in *uncentered* propositions (e.g., "the coin landed heads") should not update upon awakening.  
     - **No smuggled indifference**: Neither side assumes a principle of indifference over awakenings or days without argument. It is a substantive point of disagreement.  

  5. **Credence and Betting Odds**:  
     - A credence \(P(A) = p\) implies Beauty should accept a bet on \(A\) at odds \(p:(1-p)\) *at that awakening*, assuming:  
       (i) Bets are settled immediately and locally (winnings/losses paid before memory erasure).  
       (ii) Bets do not affect future decisions (no strategic considerations).  
     - **Caveat (both)**: Global betting implications (e.g., multiple losses on \(T\)) may require non-myopic strategies, but the *credence itself* should still reflect local betting odds under the above constraints.  

  ---  
  #### 2. Disagreements  
  | Crux | Thirder’s Wording | Halfer’s Wording |  
  |------|-------------------|------------------|  
  | **Unconditional \(P(H)\)** | "Upon awakening, my credence in \(H\) is \(1/3\). There are three equiprobable centered worlds: \(H\)-Mon, \(T\)-Mon, \(T\)-Tue. Only one is \(H\), so \(P(H) = 1/3\)." | "Upon awakening, my credence in \(H\) is \(1/2\). The coin is fair, and I have gained no new *uncentered* evidence about the coin. Memory erasure does not justify updating away from the prior." |  
  | **Conditional \(P(H \mid \text{Monday})\)** | "Conditional on today being Monday, \(P(H \mid \text{Monday}) = 1/2\). Monday awakenings occur under \(H\) and \(T\), with equal probability given the coin’s fairness." | "Conditional on today being Monday, \(P(H \mid \text{Monday}) = 1/2\). Knowing it is Monday eliminates the Tuesday possibility but provides no new information about the coin." |  
  | **Betting Behavior** | "At each waking, I accept bets on \(H\) only at odds better than 1:2 (e.g., win $2 on \(H\), lose $1 on \(T\)). My expected loss per dollar bet is zero: \((1/3)(2) + (2/3)(-1) = 0\)." | "At each waking, I accept even-money bets on \(H\) (win $1 on \(H\), lose $1 on \(T\)). My credence is \(1/2\), so local odds should be even. **Caveat**: If forced to bet at *every* waking, I decline due to double-loss risk on \(T\), but this is a pragmatic constraint, not a credence update." |  
  **Halfer Sub-Position**: We adopt the **Lewisian halfer** view: \(P(H \mid \text{Monday}) = 1/2\) (rejecting the "double halfer" variant). This avoids updating on centered evidence for uncentered propositions.  

  ---  
  #### 3. Cruxes  
  For each crux, we specify:  
  - **Sub-Question**: The issue that, if resolved, would move at least one position.  
  - **Test Case/Argument**: A scenario or inference both agree is relevant.  
  - **Predictions**: What each side expects the outcome to be.  

  | Crux | Sub-Question | Test Case/Argument | Thirder’s Prediction | Halfer’s Prediction |  
  |------|--------------|---------------------|----------------------|---------------------|  
  | **Does awakening supply new evidence?** | Does Beauty gain evidence relevant to \(H\) upon awakening? | *No-Coin-Awakening Variant*: Beauty is always woken once on Monday (no coin toss). If told "you are awake," her credence in being awake is 1. If a coin is added (awakening on \(H\), no awakening on \(T\)), then upon awakening, is \(H\) less likely? | Yes: Awakening is evidence against \(H\) because she is never awake on \(H\) in this variant. \(P(H)\) drops below 1. | No: Awakening was certain; she learns nothing new about the coin. \(P(H)\) remains unchanged. |  
  | **Correct reference class for indifference** | Should centered possibilities (awakenings) be assigned equal probability? | *Duplicate Beauty*: Two rooms; fair coin. Heads: Beauty1 awoken once. Tails: Beauty1 and Beauty2 each awoken once. Upon awakening, what is \(P(\text{"I am Beauty1 and } H\text{"})\)? | Apply indifference: Three awakenings (one for \(H\), two for \(T\)) are equiprobable. \(P(\text{Beauty1 and } H) = 1/3\). | Apply indifference only *within* coin outcomes: \(P(\text{Beauty1} \mid H) = 1\), \(P(\text{Beauty1} \mid T) = 1/2\). \(P(\text{Beauty1 and } H) = 1/2 \times 1 = 1/2\). |  
  | **Must credence match betting odds?** | In a series of identical bets, must local credence align with break-even odds? | *Repeated Bets*: At each waking, Beauty must accept/reject a bet on \(H\) at fixed odds. Bets are settled immediately. After many trials, what odds yield zero expected profit? | Break-even odds are 1:2 (bet on \(H\) pays 2:1). Credence must be \(1/3\) to justify this. | Break-even odds are 1:1 (even money) *per bet*, but rational Beauty declines if bets are forced at all wakings due to double losses. Credence (\(1/2\)) is separate. |  

  ---  
  #### 4. New Cases  
  **(a) Large-\(N\) Generalization**:  
  - On \(H\): 1 waking; on \(T\): \(N\) wakings.  
    - **Thirder**: \(P(H) = \frac{1}{1 + N}\). As \(N \to \infty\), \(P(H) \to 0\).  
    - **Halfer**: \(P(H) = 1/2\) for all \(N\).  
  - **Agreement?** No. The thirder sees this as intuitive support; the halfer sees no update from the prior.  

  **(b) Unknown-Multiplicity Variant**:  
  - \(N\) is fixed but unknown; Beauty has a prior \(P(N=k)\).  
    - **Thirder**: \(P(H) = \sum_k P(N=k) \cdot \frac{1}{1+k}\).  
    - **Halfer**: \(P(H) = 1/2\) (independent of the prior over \(N\)).  
  - **Agreement?** No. The halfer rejects dependence on \(N\).  

  **(c) Two-Ledger Proposal**:  
  - Distinguish:  
    (i) Uncentered \(P_{\text{uc}}(H) = 1/2\) (the coin’s objective chance).  
    (ii) Centered \(P_{\text{centered}}(\text{"this awakening is an } H \text{-waking"})\).  
  - **Thirder**: This **dissolves** the dispute. The question asks for (ii), which is \(1/3\). Reporting both clarifies the verbal confusion.  
  - **Halfer**: This is a **redescription**, not a dissolution. The question asks for (i), and centered probabilities are irrelevant to uncentered beliefs.  
  - **Agreement?** Partial. Both accept the distinction, but disagree on which credence is requested.  

  ---  
  #### 5. Closing  
  - **Thirder’s Counterevidence**: If Beauty could prove that awakening *never* provides evidence about the coin (e.g., via an unrelated oracle), I would abandon \(P(H) = 1/3\). The large-\(N\) case is critical: if \(P(H)\) remained \(1/2\) even for large \(N\), I would be deeply troubled.  
  - **Halfer’s Counterevidence**: If Beauty could prove that centered evidence *must* update uncentered credences (e.g., via decision theory forcing alignment with betting odds), I would concede. The repeated-bets crux is pivotal.  
  - **Common Ground for Resolution**: Both agree that empirical tests of the **betting crux** (e.g., simulations of betting behavior) or a consensus on the **reference class for indifference** (e.g., in the Duplicate Beauty case) could resolve the debate. The large-\(N\) case is a shared intuition pump.  

