answer: |-
  Alright, let’s engage. On the coin and witness: you’re right about dilation. With zero knowledge about the witness, their "heads" report *does* widen my bounds. Before, I had [0.4, 0.6] for heads. After? The lower bound drops to 0.4 × 0 (if they’re a liar) + 0.4 × 1 (if truthful)… but since I don’t know their reliability, *any* probability between 0 and 1 is possible for their accuracy. So my new lower bound for heads becomes inf over all possible witness reliabilities: maybe they always lie, so heads could be 0 (if they said heads but it was tails) or 1 (if they said heads and it was heads) – worst case, I’m back to [0, 1]. Yes, my uncertainty *expands* – that’s not insane, it’s honest. That witness could be actively deceptive or clueless! If I pretended I knew *anything* about them, *that* would be false precision.  

  Second prong: you’re demanding a sharp bet price? Nope, won’t give one. My belief isn’t sharp, so why force a number? I *can* rank bets: I’ll use a decision rule. Take "maximin": I’ll maximize the worst-case outcome. For a bet on heads at even odds? Worst case (if I bet heads) is losing $1 if it’s tails (prob 1 in worst case). Worst case if I don’t bet is $0. So I decline the bet – the risk of total ignorance bites. Or use "E-admissibility": find all probabilities in my set [0,1] now. Some justify betting at 1:1 (if P(heads)>0.5), some don’t (if P(heads)<0.5). Since it’s not *uniformly* better, I might abstain – or flip a coin to choose! Yeah, it’s messy, but life with radical uncertainty *is* messy. My set reflects that ambiguity; collapsing it pretends I know things I don’t.  

