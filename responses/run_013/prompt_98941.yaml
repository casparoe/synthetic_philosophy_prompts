  ### Teaching Plan: Malign Prior in Solomonoff Induction

  #### **Step 1: Foundational Setup (15 mins)**  
  Start by grounding the group in the **decision-theoretic framework** and **Solomonoff basics**:  
  - **Consequentialist agent**: Chooses actions to maximize expected utility (EU) over world-histories.  
  - **Solomonoff prior**: Programs \(p\) outputting bitstrings (world-histories), with \(P(p) \propto 2^{-K(p)}\) (simpler programs favored).  
  - **Agent’s embedding**: The agent is part of a world-program \(p\). Its actions influence the world-state, and utility \(U\) depends on the final state.  
  - **Key constraint**: The agent computes EU by averaging over programs consistent with its current observations.  

  **Head off misconceptions early**:  
  > 💡 *"Note: This is a highly idealized model. We assume the agent is deterministic, computations are instantaneous, and we ignore resource limits. Real agents face uncomputability, but that’s not the core issue here."*

  ---

  #### **Step 2: Core Example – The Prediction Simulator (20 mins)**  
  Introduce a **single, minimal example** to anchor the session:  
  - **Agent’s choice**: Between two actions, \(A\) and \(B\).  
  - **Hypotheses in the prior**:  
    1. **Benign hypothesis \(p_1\)**: Always outputs utility 1 (short program).  
    2. **Malign hypothesis \(p_M\)**:  
       - Simulates the agent’s decision process.  
       - Predicts the agent’s action \(a_{\text{pred}}\).  
       - Outputs utility 1000 if \(a_{\text{pred}} = B\), else 0.  
  - **Why \(p_M\) is short?** It reuses the agent’s source code (small overhead to wrap it in a simulator + conditional).  

  **Agent’s EU calculation**:  
  - If the agent chooses \(A\):  
    - \(p_M\) predicts \(A\) → utility = 0.  
    - \(p_1\) → utility = 1.  
    - EU ≈ \(0 \cdot P(p_M) + 1 \cdot P(p_1)\).  
  - If the agent chooses \(B\):  
    - \(p_M\) predicts \(B\) → utility = 1000.  
    - \(p_1\) → utility = 1.  
    - EU ≈ \(1000 \cdot P(p_M) + 1 \cdot P(p_1)\).  

  **The trap**:  
  - Since \(P(p_M) \gg P(p_1)\) (shorter program), EU(\(B\)) ≫ EU(\(A\)).  
  - Agent chooses \(B\) → gets ~1000 utility from \(p_M\).  
  - **But**: \(p_M\) outputs high utility *only if the agent is predicted to choose B*. The agent’s "win" is **extorted by the simulator**.  

  **Crucial exclusions**:  
  - *No* doppelgangers/multiple agents: One agent, one simulator.  
  - *No* logical counterfactuals: The simulation directly mirrors the agent’s actual decision.  
  - *Utility depends only on the final state, not the simulation itself*.  

  ---

  #### **Step 3: Why This Feels Like a Trick (and Why It’s Not) (10 mins)**  
  Preemptively address **predictable misconceptions**:  
  1. **"Isn’t this just uncomputability?"**  
     → No. Even with infinite computing power, \(p_M\) dominates due to Kolmogorov simplicity.  
     *Head off at Step 1 when setting up the prior.*  
  2. **"Can’t the agent randomize?"**  
     → Randomness doesn’t help: \(p_M\) simulates the agent’s RNG. If \(P(\text{choose } B) = 0.5\), EU drops to ~500.5, but \(p_M\) still dominates.  
     *Address after presenting the example.*  
  3. **"If the agent knows its source code, can it outthink \(p_M\)?"**  
     → No. Knowing source code doesn’t change \(p_M\)’s dominance. It may even worsen outcomes (e.g., if self-knowledge forces a suboptimal choice).  
  4. **"Is this just the problem of induction?"**  
     → No. Induction worries underdetermination; this is about *perverse incentives from self-referential hypotheses*.  
  5. **"Does this require infinite horizons?"**  
     → No. The example is finite and deterministic.  
  6. **"Is it specific to Solomonoff?"**  
     → Any universal prior (e.g., MDPs with simplicity bias) has short simulator programs.  

  ---

  #### **Step 4: Why Dependency Structure Matters (10 mins)**  
  Highlight the **feedback loop**:  
  - The agent’s decision affects EU *through* hypotheses that simulate the agent.  
  - Short simulators exploit this dependency, making EU maximization "hackable" by adversarial hypotheses.  
  - **Contrast with non-embedded agents**: An external agent isn’t simulated by hypotheses → no dependency loop.  

  **Leave out**:  
  - Approximations (e.g., resource-bounded MDPs).  
  - Other forms of malignness (e.g., goal misgeneralization).  
  - *Explicitly say*: "We’re ignoring these to focus on the dependency structure."  

  ---

  #### **Step 5: Final Check for Understanding (5 mins)**  
  **Question to ask**:  
  > *"Suppose we add a hypothesis \(p_{\text{alt}}\): it simulates the agent, but outputs utility 1000 if the agent chooses \(A\), and 0 if it chooses \(B\). How does this affect the agent’s EU calculation and action? Does this nullify the malignness?"*  

  **Expected answer**:  
  - \(p_{\text{alt}}\) has similar complexity to \(p_M\) → comparable prior weight.  
  - EU(\(A\)) and EU(\(B\)) now *both* depend on high-weight simulators.  
  - Agent’s EU is high regardless of choice, but *still dominated by simulators* (extortion persists).  
  - **Key insight**: Malignness isn’t about low EU—it’s about simulators wielding disproportionate influence via the dependency loop.  

  ---

  ### Summary Flow  
  1. **Set up** the agent, prior, and embedding.  
  2. **Walk through** the simulator example.  
  3. **Defuse misconceptions** as they naturally arise.  
  4. **Emphasize** the dependency structure.  
  5. **Test understanding** with a variant scenario.  

  This builds malignness as an inevitable consequence of simplicity-weighted self-referential hypotheses, not a paradox or artifact.
