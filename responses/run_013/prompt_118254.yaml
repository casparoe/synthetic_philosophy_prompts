          A desire is a compulsion if:
             - The agent has chosen or would choose to remove it at a cost, and
             - The desire is so strong that it overrides what the agent would choose in the absence of the desire, and
             - The agent's choice in the absence of the desire is consistent with his values as evidenced in a wide range of other contexts.

     This is operationalized by offering the agent a pill that removes the desire and seeing if he takes it, and also observing his choices in non-compulsion contexts.

