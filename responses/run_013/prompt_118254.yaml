     A case not mentioned: 
          A person who is presented with three options: A, B, and C. He chooses A over B, B over C, and C over A in pairwise comparisons. This is cyclical and fails consistency -> no preference revealed.

     Another case: 
          A person who always chooses the same option regardless of how it is framed, and whose choices are transitive. Then we can attribute a preference.

     The verdict on the addict is not accommodated by this principle, but it is the only verdict that must be abandoned to have a workable principle.

