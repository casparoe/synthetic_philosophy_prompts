   Therefore, after thorough analysis, the best course is to use only conditions (1) and (2) and abandon the user's resistant verdict on the addict.

   Final principle:

     A choice or set of choices reveals a preference ordering (complete and transitive) if and only if the choices satisfy:
          - Framing invariance: if two decision problems have the same underlying outcomes and differ only in description, the choice is the same.
          - Consistency: the choices satisfy the necessary conditions for the existence of a complete and transitive binary relation that explains them (e.g., the weak axiom of revealed preference for pairwise choices, or the generalized axiom for budget sets).

     In cases where these conditions fail, we cannot attribute a preference ordering.

     This principle accommodates:
          - Cereal shopper: typically will be consistent and framing-invariant.
          - Smoker: if his choices are consistent (always choose to smoke when available and when he has the urge) and framing-invariant, then they reveal a preference.
          - Job-taker: similar.
          - Coin-toss: for that particular pairwise choice, we don't observe a strict preference, but it is consistent with indifference. Over many similar choices, if they are between the same two desserts and he uses a coin toss, we can attribute indifference. So it does reveal a preference (indifference).
          - Cyclical: consistency fails -> no preference revealed.
