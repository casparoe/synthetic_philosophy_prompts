  After careful consideration of your cases and verdicts, I propose the following principle that best reconciles your intuitions while minimizing necessary verdict abandonment. The principle addresses the core insight that revealed preference requires choices to be both *stable* (reflecting consistent underlying valuations) and *authentic* (reflecting the agent's genuine priorities, not external distortions).

  ### **Principle: Reflective Stability**
  **A choice reveals a preference only if:**
  1. **The choice is robust to irrelevant description changes** (handles framing effects).  
  2. **The choice is consistent with a complete, acyclic ranking** (handles cycles and indifference).  
  3. **The agent would not countermand the choice given costless control over their desires** (handles compulsions).  

  ---

  ### **Clause Motivations & Verdicts**
  1. **Robustness to description changes**  
     - **Motivation**: Framing-effect chooser (A vs. B described differently).  
     - **Verdict**: Neither choice reveals a genuine preference. Irrelevant descriptions alter the choice, violating stability.  
     - **Case handled**: Framing effect (no preference revealed).

  2. **Consistency with a complete, acyclic ranking**  
     - **Motivation**: Cyclical chooser (A>B, B>C, C>A) and coin-toss dessert case.  
     - **Verdict**:  
       - Cycles violate transitivity → no preferences exist (not contradictory ones).  
       - Coin-toss indifference is consistent with an acyclic ranking (e.g., "A and B are tied") → no strict preference revealed, but not a defect.  
     - **Cases handled**: Cyclical chooser (no preference), coin-toss (no strict preference).

  3. **Non-countermandability of desires**  
     - **Motivation**: Addict and smoker cases.  
     - **Verdict**:  
       - **Addict**: Would abolish the craving → choice *does not* reveal a preference (it reflects a compulsion).  
       - **Smoker**: Would *not* abolish his desire for smoking (he endorses it as part of his values, even if he regrets its consequences) → choice reveals a preference for smoking now.  
       - **Key distinction**: The addict disowns the desire itself; the smoker merely wishes he had *weaker* desire.  
     - **Cases handled**: Addict (no preference), smoker (preference revealed), job-taker (preference revealed; she wouldn’t abolish her desire for money).

  **Additional verdicts covered**:  
  - **Cereal shopper**: Robust and consistent → reveals preference for saving money.  
  - **Job-taker**: Robust and consistent; she wouldn’t abolish her desire for income → reveals preference for pay over job satisfaction.  
  - **Parent**: Robust and consistent; she wouldn’t abolish her desire to protect her child → reveals preference for child’s survival.  

  ---

  ### **Verdicts Not Accommodated**
  - **Smoker’s "wish to quit"**: Your verdict treats this as a weaker preference, but the principle implies it is not a *preference at all* in the revealed-preference sense. Instead, it is a *desire to desire differently* (a second-order volition), which doesn’t manifest in choices. This preserves your core intuition that his choice reveals a preference for smoking.  
  - **Addict’s compulsion**: Fully accommodated.  

  ---

  ### **New Case: Procrastinator**  
  - **Setup**: A writer chooses to browse social media instead of working on a deadline-driven novel. She states she values finishing the novel and would pay to "lock herself out" of distractions.  
  - **Principle’s verdict**:  
    - If she wouldn’t abolish her desire for leisure (only its intensity), her choice reveals a preference for leisure now (like the smoker).  
    - If she would abolish the desire entirely (e.g., take a pill to eliminate her urge to procrastinate), her choice reveals no preference (like the addict).  

  ---

  ### **Why Not Other Principles?**  
  - **Classic revealed preference** (choices → preferences) fails framing, cycles, and compulsions.  
  - **Reflective endorsement** (would endorse on reflection) strips preferences from the job-taker and smoker, which you reject.  
  - **Single unified principle**: "Reflective Stability" works for all cases except the smoker’s *weaker* preference, which is reclassified as a non-preference volition.  

  ### **Minimal Verdict Abandonment**  
  - You must abandon the idea that the smoker’s "wish to quit" is a weaker *revealed preference*. Instead, it is a *non-revealed* second-order desire. This preserves all other verdicts.  

  ### **If Insisting on the Smoker’s "Weaker Preference"**  
  - **Alternative**: Use a two-principle framework:  
    1. **Stability Principle**: Choices reveal preferences iff robust and consistent.  
    2. **Authority Principle**: Preferences revealed under Stability are "authentic" iff the agent wouldn’t abolish their desires.  
  - **Verdicts abandoned**:  
    - Smoker’s wish to quit is a weaker preference (it becomes a non-authentic preference).  
    - This complicates the model but keeps your smoker verdict.  

  **Recommendation**: Adopt **Reflective Stability** and reframe the smoker’s wish as a second-order desire. This yields the cleanest fit with your intuitions.
