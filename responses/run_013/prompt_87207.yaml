prompt: |-
  Every time vagueness comes up in my seminar somone says "there's just no fact of the matter" — last week it was about whether a guy with a thinning crown is bald, and the person who said it used it to wave away my question about whether the hair-loss study he's enrolled in can even code its subjects. I want the menu: the distinct precise claims that sentence could be making in that argument, from the boring to the wild. No unique sharp boundary but still a truth value? No truth value at all until someone precisifies? A sharp boundary that's really there but we can never know? A boundary that's real but shifts with context, or with who's judging? For each reading, tell me whether it's a platitude, a substantive thesis worth defending, or plainly false, and which ones actually licence the move he made — dismissing my question, and then his bigger claim that the study's 'bald' category is arbitary and so can't be criticized. And which reading do people usually have in mind when they say it?
