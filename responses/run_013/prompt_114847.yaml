prompt: |-
  Hey — could use your help with something, and you're the expert here, so I want you to answer as someone who's spent a career on the ethics of markets (the "what shouldn't be for sale" stuff) and who's also written and marked alot of essay questions, so you know the difference between a question that tests whether someone understands an issue and one that just tests whether they read the reading. Think it through carefully before you write, and please start by brainstorming the candidate objections to the thing below so you can see which ones actually survive — I'll explain why that matters in a second.

  Background: I'm not an academic, never studied this, I just run a monthly discussion group in the back room of a pub. We pick a topic, people have a week to write an answer, I read them out the next month. So I need a question, and I also need to know what a good answer looks like, because honestly I'm not sure I'd recognise one if it bit me.

  Here's what's been bugging me. Say a big company screws something up — a dodgy product, a cover-up, whatever. Usually some junior person gets thrown under the bus, or the exec does the sad apology tour. Now imagine a service that formalises the throwing-under-the-bus part. You hire someone to be the person who takes the blame. They're paid. They go out and say, yeah, that was me, I made the call, I'm resigning, and they take the reputational hit. Both sides are adults, nobody is lying to anyone: the arrangement is fully disclosed, the public knows who actually made the call and knows the apologiser was paid. Nobody's deceived, nobody's coerced, nobody else is worse off in any way I can point to.

  The thing that breaks my brain: if it's all out in the open, what is the buyer actually buying? The blame still lands on them in every sense that matters — everyone knows. And yet something still feels off about it, and I genuinely can't tell if that feeling is doing any real work or if I'm just squeamish. What I really want to know is whether the "no deception, everyone consents, no harm" version of this is a market that shouldn't exist, and on what grounds — or whether the objection dies the moment you take the secrecy out of it.

  So, what I need from you:

  1. The exam question itself, written the way my group will see it — the setup plus the actual thing they have to answer, with any bullet points you'd give them. Aim it at people who've thought about this but aren't specialists, and 90 minutes of writing. The crux has to be that transparency twist. I don't want a question they can knock off by recycling the usual kidney-sale argument at me, and I don't want a question where the answer is just "commodification is dehumanising, the end."

  2. A model answer, maybe 700–800 words, that I can hold up as the standard. It should take an actual side on the transparency thing rather than surveying.

  3. A marking scheme: five must-hit moves, marks adding up to 20, and for each one a one-line note on how people typically fluff it. Plus a short "these get nothing" list for the moves I should refuse to give credit for.

  4. Where the question is unfair, and where you'd bet nearly everyone goes wrong.

  One hard constraint: no citations, no names, no "as so-and-so argued." Half my group reads this on their phones and nobody has a library, and I don't want people getting marks for dropping a philosopher's name. If a move is standard in the literature, describe the move, don't attribute it. Same for the model answer — I need to be able to defend every line of it on the merits, not on who said it. And nothing that depends on knowing a specific book, article, date, or study.
