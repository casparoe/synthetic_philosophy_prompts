answer: |-
  My dear friend,

  Your challenge regarding the divine hiddenness argument and the stark reality of Mother Teresa’s interior desolation is a profound one. It forces us to confront the argument not merely as abstract logic, but against the raw texture of a specific, documented human experience of divine absence. As you rightly insist, we must take the letters at face value: decades of a soul described as "darkness," an unrelenting inability to *feel* God’s presence, persistent doubt coexisting with unwavering outward profession and action. This is not the non-resistant non-belief the standard argument targets. She *believed*, or at least tenaciously clung to belief, even as the experiential core – the felt relationship – vanished entirely. The standard argument, seeking non-believers who would believe if God lovingly revealed Himself, simply glances off her figure; she stands outside its frame, a stark anomaly within its logic.

  The compelling question you pose is whether the argument can be reframed around this very experience: a failure not of belief, but of the *relational good* theism promises. Suppose we say: If a perfectly loving God exists, and if the ultimate good He offers is a personal relationship, and if such a relationship inherently involves (or at least permits) the possibility of felt communion, then a non-resistant person earnestly, persistently seeking this communion should not be left in utter, protracted experiential void. Mother Teresa, arguably seeking this with unparalleled constancy amidst immense suffering, was precisely in such a void. Therefore, either no such perfectly loving God exists, or the promised relational good (as involving felt communion) is illusory.

  Does this rebuilt argument succeed? Its plausibility hinges critically on the second premise: *Must* a genuine relationship with God include, or permit, felt presence? This is where the tradition of the "dark night," exemplified by John of the Cross, intervenes decisively. It argues that the *absence* of felt presence is not evidence of divine abandonment or the relationship's non-existence, but rather a necessary stage of purification and maturation. God, in this view, withdraws the *consolations* of feeling to draw the soul beyond dependence on sensory or emotional experience into a purer, more profound faith and love grounded in the will, independent of feeling. The darkness itself becomes the crucible for growth, a deeper participation in the divine life, paradoxically facilitated by the felt absence.

  The crucial question, then, is whether this traditional reading genuinely *explains* the case in a way that preserves theism, or merely *redescribes* the phenomenon, substituting theological terminology for an existential reality that remains fundamentally at odds with the concept of a perfectly loving God actively sustaining a relationship. What distinguishes the two?

  A genuine explanation would need to demonstrate that the "dark night" serves a necessary and ultimately loving purpose *unachievable otherwise*, and that the soul, despite the phenomenological desolation, is *objectively* in a state of deeper union. It must be more than just labelling the suffering; it must show *why* this specific, agonizing, decades-long experiential deprivation is the *only* or *best* way for *this* soul to achieve the intended growth, especially one already manifesting such profound dedication and love in action. Does the tradition offer compelling reasons why Teresa’s relentless seeking *could not* be met with even fleeting moments of felt reassurance within that half-century span? Why must the pedagogical deprivation be so absolute and prolonged? If the "dark night" is a stage, why does it seem, in this case, to become the permanent interior landscape? The potential for redescribing exists when the explanation feels like a post-hoc justification for an experience that, on the surface, starkly contradicts the attributes of the God invoked.

  Bringing Teresa’s case back to the theory illuminates its limitations and silences. It powerfully supports the *reality* of the phenomenon the argument might gesture towards – the profound absence of the relational good – but leaves untouched the core premise about God’s necessary desire for relationship with all non-resistant persons. It highlights where the argument is simply silent: It has nothing substantive to say about *suffering* that is not primarily intellectual doubt, but the existential agony of feeling abandoned *while believing*. It ignores the critical distinction – embodied agonizingly by Teresa – between *wanting God* and *wanting to feel God*. Her letters scream the former even as they document the crushing absence of the latter. Furthermore, the standard argument assumes the absence of belief is a harm, but remains silent on whether the *loss of felt presence* is itself a profound harm, especially for one whose entire life and identity are built upon that relationship. Is decades of spiritual desolation, endured while maintaining outward fidelity, truly compatible with perfect love actively sustaining a relationship?

  What, then, does Mother Teresa’s episode show about the argument from divine hiddenness? It is neither a straightforward confirmation nor a refutation of the standard version, which misses her entirely. It stands as a profound **anomaly**, a case the argument in its usual form **never anticipated**. Her documented experience exposes a different kind of "hiddenness" – not the absence of belief, but the absence of the experiential core of the relationship itself, despite persistent belief and seeking.

  You ask if reframing the argument around relationship rather than belief strengthens or dissolves it. I believe it **simultaneously strengthens and complicates it to the point of significant transformation, potentially dissolving its original force.** It strengthens it by grounding the argument in the *actual existential promise* of theism – relational communion – rather than intellectual assent. Teresa’s case becomes a potent, almost unparalleled witness *against* the idea that a loving God reliably provides the experiential dimension of that relationship to those who seek it most ardently and non-resistantly. However, this reframing dissolves the original argument’s clean, logical structure. It introduces immense complexity: the question of whether felt presence *is* necessary for the relationship, the viability of the "dark night" explanation, the ambiguity of "non-resistance" when belief persists despite experiential void, and the difficulty of proving a universal negative about God’s communication. The argument becomes less a deductive proof and more a potent existential challenge, pointing to a specific, agonizing form of suffering that seems profoundly at odds with the concept of a perfectly loving God actively engaged in a personal relationship. It shifts the debate from the availability of belief to the nature of divine love and the reality of the promised relational good. Teresa’s darkness doesn’t settle the logical argument; it deepens the mystery and the anguish, posing a question about divine love that is far harder to answer than the absence of mere belief.

  Warmly,  
  A Fellow Traveler in these Questions
