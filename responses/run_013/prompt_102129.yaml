prompt: |-
  I'm a retired field ecologist -- spent most of my career counting fish and arguing about carrying capacity -- and since I retired I've been sitting in on philosophy seminars, mostly naturalism and philosophy of religion. I keep running into the claim that religion should be studied as a natural phenomenon, and I realize I don't know what would count as a good theory of it. Everyone seems to argue for their favorite mechanism (byproduct of ordinary cognition, adaptation for group cohesion, cultural parasite, etc.) by pointing at one striking case, and I'd like the full specification first. Could you write me the desiderata: what any adequate naturalistic theory of religion has to deliver -- the cases it must get right, the distinctions it must respect, the empirical results it must not contradict -- with the consideration behind each requirement? I don't want a bibliography or citations, just the criteria and why they're criteria.

  I'm especially interested in the ones that pull against each other. For example, it seems like a theory has to explain why religious traditions are so good at spreading even when their official doctrines are vague, inconsistent, or poorly understood by adherents -- the cognized religion is not the same as the official religion -- and also explain why some traditions invest enormous resources in costly, hard-to-fake displays and buildings and rituals. Those two demands might push toward different pictures: one about cheap transmission of minimal counterintuitive ideas, another about expensive commitment signals. Is that a real tension or can one theory handle both? Also, since I'm an ecologist, I can't help thinking of religions as strategies in a niche: they have to recruit attention, calories, reproductive effort, and transmission opportunities from hosts, and they compete with other religions and with secular institutions. Does that framing add a genuine desideratum -- something like a requirement that the theory explain the demographic and energetic conditions under which a religion grows, stabilizes, or goes extinct -- or is it just a metaphor that will mislead?

  So: give me the requirements list, mark which are non-negotiable and which are just preferences of one camp, say if any subset can't be jointly satisfied, and tell me which single requirement knocks out the most popular current theories. I care more about the spec than the scorecard, but a short scorecard at the end is fine if it's brief. And please keep it non-technical enough for someone whose last formal philosophy class was in 1974.
reasoning: |-
  Okay, let me tackle this retired ecologist's query. They want a clear set of criteria for evaluating naturalistic theories of religion, especially tensions between requirements and whether an ecological framing adds value. 

  First, I need to identify core challenges in the field. The user mentions two seemingly conflicting demands: explaining religion's easy transmission despite vague doctrines versus explaining costly rituals. That's a key tension to address. Their ecological background makes me think about resource competition - is that a valid lens or just a metaphor?

  The user clearly wants structure. They're frustrated with theories cherry-picking single mechanisms. A robust framework should cover multiple dimensions: cognitive, social, functional, historical. Since they're familiar with scientific rigor but not current philosophy jargon, I'll avoid technical terms while maintaining precision.

  For desiderata, I consider starting with universality - any theory must account for religion's cross-cultural presence. Then cognitive tractability: why do human minds readily generate religious concepts? The transmission paradox is crucial - how do inconsistent doctrines spread effectively? Costly signaling seems opposite but must be reconciled. 

  The ecological angle feels substantive, not just metaphorical. Carrying capacity concepts might apply to how religions manage resources and compete. I should note where this creates tension with psychological explanations. 

  I'll flag non-negotiables: any theory must explain religion's persistence despite lacking empirical evidence. Adaptationist claims need careful handling - group benefits might be side effects. The transmission-costs tension probably disqualifies most single-mechanism theories.

  The scorecard will be brief but sharp. Cognitive byproduct theories fail on costly rituals; adaptationist theories struggle with inefficient designs. An ecological resource competition model might be the most novel angle for this user.
answer: |-
  Here's a specification for a naturalistic theory of religion, framed as desiderata with their rationales. I've flagged tensions, non-negotiables, and the "knockout" requirement based on current debates:

  **Core Desiderata (Non-Negotiables):**

  1.  **Cross-Cultural Ubiquity & Recurrence:** *Must explain why recognizably "religious" phenomena (supernatural agents, ritual, sacredness, afterlife beliefs) emerge independently across virtually all known human cultures and historical periods.* **Rationale:** A fundamental fact demanding explanation; theories claiming religion is purely a cultural accident fail here.
  2.  **Cognitive Tractableability:** *Must explain why religious concepts (e.g., minimally counterintuitive agents, supernatural monitoring, ritualized behavior) are so readily acquired, remembered, and transmitted by human minds.* **Rationale:** Religious ideas aren't random; they exploit universal cognitive architecture (e.g., agency detection, theory of mind, intuitive physics/biology). A theory ignoring cognitive constraints is inadequate.
  3.  **The Transmission Paradox:** *Must explain how complex, often vague/inconsistent/officially-difficult doctrines and practices manage to propagate effectively across generations and populations.* **Rationale:** Observed mismatch between "theologian's religion" and "folk religion" is pervasive. A theory must account for resilience despite doctrinal opacity or instability.
  4.  **Costly Commitment & Signaling:** *Must explain the widespread existence and persistence of *costly* religious behaviors (asceticism, sacrifices, resource-intensive rituals/monuments, dietary/sexual restrictions) that lack obvious material payoff for the individual.* **Rationale:** These are empirical facts demanding explanation. Theories must address why such "hard-to-fake" signals are common features, not anomalies.
  5.  **Functionality Amidst Non-Adaptation:** *Must explain the *apparent* functional benefits religion provides (e.g., meaning, comfort, social cohesion, moral enforcement, behavioral regulation) without necessarily assuming these benefits were the target of natural selection (biological *or* cultural).* **Rationale:** Religions *do* often serve functions, but these could be byproducts, exaptations, or culturally selected effects. A theory must accommodate function without requiring teleology or optimal design.

  **Critical Tensions & Refinements:**

  6.  **The Transmission-Cost Tension:** *Must reconcile #3 (Easy Transmission) with #4 (Costly Signals).* **Rationale:** This is your core tension. Cheap, catchy ideas spread easily (*minimal counterintuitiveness*), but costly signals build commitment and group cohesion (*costly signaling theory*). An adequate theory *cannot* ignore either facet. It must show how they interact (e.g., core catchy ideas attract, costly practices filter/solidify commitment; doctrines provide narrative framework justifying costs).
  7.  **The "Adaptationist Trap":** *Must explicitly address the level(s) of selection (genetic, individual, cultural group) at which proposed mechanisms operate and avoid conflating benefits with evolutionary origins.* **Rationale:** Many theories stumble here. Group benefits (cohesion, cooperation) might be real *effects* without being the *cause* of religion's origin or persistence. The theory must clarify *how* benefits arise (if they do) and whether they drive selection or are side-effects.
  8.  **Persistence Despite Counter-Evidence:** *Must explain the remarkable persistence and resilience of religious belief in the face of disconfirming evidence, failed prophecies, or logical inconsistencies.* **Rationale:** Unlike most empirical domains, core religious claims are often insulated from falsification. Theories must account for this epistemic resilience (e.g., theological reasoning, compartmentalization, shifting interpretations, emphasis on faith).

  **Your Ecological Niche Desideratum (Strong Preference):**

  9.  **Resource Competition & Niche Dynamics:** *Should explain the demographic, energetic, and resource conditions under which specific religious traditions flourish, stabilize, stagnate, or decline, acknowledging competition with other religions, secular institutions, and biological imperatives.* **Rationale:** This isn't *just* a metaphor. Religions *do* act as complex replicators competing for host attention, time, energy, reproduction, and loyalty within socio-ecological niches. A truly robust theory would predict or retrodict patterns of religious rise/fall based on resource flows, carrying capacity for specialists, competition intensity, and "fitness" relative to alternatives (e.g., explaining monasticism's rise in surplus agrarian societies, or secularization under state welfare). This *adds* a crucial dynamic dimension often missing from purely cognitive or functionalist accounts. However, it must integrate with #1-8, not replace them.

  **Distinctions to Respect (Often Overlooked):**

  *   **Belief vs. Practice:** Must distinguish between professed belief, implicit cognition, and ritual participation – they often diverge.
  *   **Supernatural Agents vs. Impersonal Force:** Must account for both personal gods/spirits and concepts like mana, karma, or Tao.
  *   **Individual Experience vs. Institutional Religion:** Must explain personal mysticism as well as organized hierarchies and doctrines.
  *   **Proximate Mechanisms vs. Ultimate Explanations:** Must clarify *how* things work cognitively/psychologically vs. *why* they evolved/have persisted historically.

  **The Knockout Requirement:**  
  **#4 (Costly Commitment & Signaling)** knocks out the most popular theories. Pure "Religion as a Cognitive Byproduct" theories (focusing only on #2 - easy transmission of supernatural ideas) struggle mightily to explain why people invest immense, tangible resources based on those ideas. They might explain *belief*, but not the *costly action* based on belief. Similarly, overly simplistic "group adaptation" theories often fail to specify the precise mechanisms linking costly behaviors to group survival *and* how this overcomes individual fitness costs.

  **The Scorecard (Brief):**

  *   **Cognitive Byproduct Theories (e.g., Hyperactive Agency Detection):** Ace #2, #3, #8. Fail #4, #7, #9. Weak on #5, #6.
  *   **Costly Signaling/Commitment Theories:** Ace #4, #5 (functional), #6 (partly). Often weak on #2 (origin of ideas), #3 (transmission of complex doctrine), #7 (level of selection), #9 (dynamics).
  *   **Group Selection/Adaptation Theories:** Attempt #4, #5, #6. Often fail #7 (conflating effect with cause, weak selection mechanisms), #3 (transmission), #8 (persistence despite failure). Variable on #9.
  *   **Memetic/Cultural Parasite Theories:** Attempt #3, #9. Often fail #2 (why *these* memes?), #4 (why costly signals benefit the host?), #5 (function is illusionary), #1 (ubiquity requires more).
  *   **Integrated Theories (e.g., combining cognition, signaling, historical dynamics):** Most promising. Aim to satisfy all core (#1-8) and potentially #9. Success depends on specific integration details and avoiding pitfalls (#7!).

  **The Tension Verdict:** The Transmission-Cost tension (#6) is real but resolvable within a multi-level framework. Core ideas spread easily via cognitive biases (#2, #3), providing the initial attractor and narrative framework. Costly signals (#4) then act as filters, solidifying group boundaries, demonstrating commitment (reducing free-riders), and potentially stabilizing cooperation within the group (#5). Your ecological niche framing (#9) adds the crucial dimension of *how* this complex package competes for resources and persists or fails in specific environments. No single mechanism suffices; an adequate theory *must* be multi-component.
