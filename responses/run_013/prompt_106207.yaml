prompt: |-
  Ok so I'm putting together a session for a phil-of-bio reading group on the species problem, and I'm sick of the format where everyone lists the same dozen species concepts and then we all shrug and say 'well, it depends what you want the concept for'. I want to do something more concrete. Can you act as a philosopher of biology who's actually refereed in this area and knows which of these debates are live versus which are basically zombies?

  Start by brainstorming out loud: give me the species concepts that are genuinely still in play — not the historical curiosities, but don't leave out the unfashionable-but-defensible ones either — and one line each on what that concept says a species is. Include at least the biological, phylogenetic, ecological, cohesion, general lineage, and homeostatic-property-cluster views, plus whatever else you'd actually defend.

  Then score each concept from 0 to 1 on the five criteria below — these are mine, for the syllabus, so please use these and don't swap in the standard textbook desiderata — give a weighted total, and finally a tier list (S/A/B/C/D) with one line per concept on why it landed where it did.

  Criteria, weights in brackets:
  1. [0.30] No fake lines: it should only count as a species groupings that are real, causally integrated units, not arbitrary cuts in a continuum.
  2. [0.20] Weird-case portability: it has to give a sane verdict for asexual lineages, allopolyploids that speciate in a single generation, ring species, hybrids, and fossils — not just ducks and deer.
  3. [0.15] Law and conservation: its verdicts should be usable for endangered-species listing without absurdities, e.g. every slightly distinct local population becoming a protected 'species', or a hybrid swarm counting as two species at once.
  4. [0.15] Nomenclatural cost: adopting it shouldn't force us to throw out the ranked Linnaean system and the type-based codes — or if it does, I want that cost priced in explicitly.
  5. [0.20] Honest pluralism: it should be able to sit alongside the other concepts without the whole thing collapsing into 'a species is whatever a given biologist feels like today' — i.e. it should say something about what's shared across the concepts, not just carve out its own turf.

  Then the part I actually care about (alot of the above is just setup):
  (a) which concept wins on my weights, and which one you'd bet on if the weights were yours instead;
  (b) whether any two of my criteria can't be satisfied at once — I have a suspicion that 1 and 3 are in tension, and I want to be able to show the students where the real fight is;
  (c) flag every score that's really a guess about a case you're unsure of, rather than smoothing it over.

  Think it through carefully before you commit to the numbers, and please don't hedge your way out of giving actual scores.
reasoning: |-
  Okay, the user is setting up a philosophy of biology reading group session on the species problem and wants to move beyond the standard approach. They're frustrated with the typical "list a dozen concepts and shrug" format. I need to provide a concrete, evaluative framework for active species concepts.

  First, I should identify which concepts are genuinely still relevant in current debates. The biological species concept (BSC) remains foundational but has well-known limitations. The phylogenetic species concept (PSC) is dominant in systematics but has practical issues. The ecological species concept (ESC) is important in conservation contexts. The cohesion species concept (CSC) attempts to integrate multiple factors. The general lineage concept (GLC) has become increasingly influential as a meta-framework. The homeostatic property cluster (HPC) view is philosophically robust. I'll also include some less fashionable but defensible concepts like evolutionary and morphological concepts.

  For each concept, I'll provide a concise one-line definition. Then I'll score them (0-1) on the user's five custom criteria with assigned weights: reality of groupings (0.30), handling weird cases (0.20), conservation utility (0.15), nomenclatural stability (0.15), and compatibility with pluralism (0.20). These weights emphasize ontological realism and practical application over traditional desiderata.

  Scoring requires careful consideration - for example, BSC scores low on weird cases because it fails with asexuals, while PSC handles weird cases well but creates conservation absurdities by splitting populations excessively. GLC and HPC score high on realism but pose challenges for nomenclature. I need to be transparent about where scores involve uncertainty, like how exactly CSC handles ring species or how radically GLC would overhaul Linnaean ranks.

  After calculating weighted totals, I'll create a tier list (S/A/B/C/D) with justifications. Then I'll address the user's specific questions: which concept wins under their weights (likely GLC), which I'd personally favor (HPC), whether any criteria conflict (notably realism vs conservation practicality), and where scores are uncertain.

  The user clearly wants to expose students to the actual tensions in the field, not just catalog concepts. My analysis should highlight where the real philosophical battles are - particularly between monism and pluralism, and between theoretical ideals and practical constraints. I'll avoid hedging while acknowledging genuine uncertainties in the scoring.
answer: |-
  Here’s a no-bullshit analysis from a philosopher of biology who’s refereed this mess. I’ll give you the **live concepts** (not dead horses like Typological or Nominalist), score them on *your* criteria, and flag uncertainties. Historical curiosities (e.g., Agamospecies) are omitted; unfashionable-but-defensible included.

  ---

  ### **Live Species Concepts: One-Liners**
  1. **Biological (BSC)**: Species are groups of interbreeding natural populations reproductively isolated from others *(Mayr, Dobzhansky)*.  
  2. **Phylogenetic (PSC)**: Species are the smallest monophyletic group of common ancestry with diagnostic traits *(Cracraft, de Queiroz)*.  
  3. **Ecological (ESC)**: Species are lineages occupying a unique adaptive zone/niche, with shared selection pressures *(Van Valen, Hutchinson)*.  
  4. **Cohesion (CSC)**: Species are lineages unified by mechanisms that maintain genetic/ecological cohesion (gene flow *or* stabilizing selection) *(Templeton)*.  
  5. **General Lineage (GLC)**: Species are separately evolving metapopulation lineages; other concepts define *thresholds* for lineage separation *(de Queiroz)*.  
  6. **Homeostatic Property Cluster (HPC)**: Species are historical entities sharing a cluster of stable properties maintained by causal mechanisms *(Boyd, Wilson)*.  
  7. **Evolutionary (EvSC)**: Species are lineages with shared evolutionary fate and trajectory *(Simpson, Wiley)*.  
  8. **Morphological (MSC)**: Species are groups diagnosable by fixed phenotypic gaps *(pragmatic, unfashionable but defensible for fossils)*.  

  ---

  ### **Scoring (0-1) on Your Criteria**  
  *Weights: Reality (0.30), Weird Cases (0.20), Conservation (0.15), Nomenclature (0.15), Pluralism (0.20)*  

  | Concept | Reality | Weird Cases | Conservation | Nomenclature | Pluralism | **Weighted Total** |  
  |---------|---------|-------------|--------------|--------------|-----------|---------------------|  
  | BSC     | 0.9     | 0.3         | 0.7          | 0.9          | 0.4       | **0.67**           |  
  | PSC     | 0.7     | 0.9         | 0.3          | 0.6          | 0.5       | **0.64**           |  
  | ESC     | 0.8     | 0.7         | 0.8          | 0.7          | 0.6       | **0.74**           |  
  | CSC     | 0.8     | 0.8         | 0.7          | 0.8          | 0.7       | **0.77**           |  
  | GLC     | 1.0     | 0.9         | 0.6          | 0.4          | 0.9       | **0.85**           |  
  | HPC     | 1.0     | 0.8         | 0.7          | 0.7          | 0.8       | **0.86**           |  
  | EvSC    | 0.8     | 0.6         | 0.6          | 0.7          | 0.6       | **0.69**           |  
  | MSC     | 0.5     | 0.7         | 0.4          | 0.9          | 0.3       | **0.56**           |  

  **Flagged Uncertainties**:  
  - **CSC/Weird Cases (0.8)**: *Guessing* on ring species (cohesion mechanisms may blur boundaries).  
  - **GLC/Nomenclature (0.4)**: Assumes radical overhaul (lineage-based naming) is costly; could be 0.2 if you’re anti-reform.  
  - **HPC/Conservation (0.7)**: *Uncertain* if property clusters avoid "too many species" in microbes.  

  ---

  ### **Tier List (S → D)**  
  - **S: General Lineage (0.85)** — Best ontology (lineages = real units), handles weird cases, anchors pluralism.  
  - **S: HPC (0.86)** — Even stronger realism (causal mechanisms), flexible for asexuals/fossils, integrates with GLC.  
  - **A: Cohesion (0.77)** — Balances reality/weird cases, but fuzzy on "cohesion mechanisms" (why not S? Less unified than GLC/HPC).  
  - **B: Ecological (0.74)** — Strong realism/conservation fit, but niche definitions slippery (e.g., host-switching parasites).  
  - **C: Biological (0.67)** — Gold standard for sexual taxa, but fails asexuals/hybrids (weird-case disaster).  
  - **C: Evolutionary (0.69)** — Intuitive but vague ("shared fate" = circular without lineage definition).  
  - **D: Phylogenetic (0.64)** — Splits populations absurdly (overfits conservation), confuses diagnosability with lineage reality.  
  - **D: Morphological (0.56)** — Pragmatic for fossils, but arbitrary gaps ≠ real units (fails Criterion 1 hard).  

  ---

  ### **Your Questions, Answered**  
  **(a) Winning Concepts**  
  - **On your weights**: **HPC (0.86)** narrowly beats GLC (0.85) due to better nomenclature score.  
  - **My bet**: **HPC**. It’s GLC’s ontologically richer cousin — clusters explain *why* lineages persist.  

  **(b) Criteria Tension**  
  - **Reality (1) vs. Conservation (3)**: **Brutal conflict.** Real units (e.g., locally adapted populations) *are* often conservation targets, but listing them as "species" nukes practicality (see PSC’s 0.3 conservation score). BSC/ESC paper over this by ignoring micro-units. **This is the war.**  

  **(c) Where I’m Guessing**  
  - **CSC on ring species**: Does "cohesion" resolve clinal variation? (Scored 0.8 optimistically).  
  - **HPC on microbes**: Can clusters define "species" without arbitrary cutoffs? (Scored 0.7; could be 0.5).  
  - **GLC’s nomenclature cost**: If taxonomists accept rank-free codes, score jumps to 0.7+ (but I doubt they will).  

  ---

  ### **Why This Works for Your Session**  
  - **Kills the "shrug"**: Tier list forces debate — why is PSC in D-tier? Is BSC’s 0.3 on weird cases fair?  
  - **Exposes the live wires**: GLC/HPC vs. the rest, and the **Reality vs. Conservation** war.  
  - **Pluralism isn’t a free pass**: Concepts like MSC/PSC fail "honest pluralism" by ignoring lineage cohesion.  

  **Next step**: Assign students to defend a tier (e.g., "Team BSC: Why We’re Underrated") using the scores. The numbers are provocations, not gospel — but they’re grounded in 30 years of bloodsport in philosophy of bio.
