prompt: |-
  I'm a couple of chapters into a PhD on the frame problem and I've ended up with a pile of candidate "solutions" that I'm now fairly sure aren't all answering the same question, which is making the chapter a nightmare to structure. Could you sort them into tiers by how much they genuinely solve the frame problem as it was originally posed — rather than dissolving it, reframing it, or quietly swapping in a different problem and then solving that instead? For each one give me a sentence or two on why it lands where it does, and flag which part of the original problem it leaves untouched. The pile is: circumscription; default logic; the various patches for the Yale shooting problem; successor-state axioms in the situation calculus; the STRIPS-style assumption that nothing changes unless the plan says it does; the Dreyfus-flavoured claim that the whole difficulty is an artefact of trying to force know-how into the mould of know-that; and one a mate of mine who works in RL keeps pushing at me, namely that once you learn an end-to-end world model and a policy straight from pixels, the frame problem simply never arises, because nothing is ever hand-axiomatised in the first place. I'm a bit suspicious of that last one but I can't articulate why, so I'd like you to take it as seriously as the classical ones.

  Then a seperate question on top of that: where do you think the "it dissolves" family actually stand — is dissolving a legitimate answer to a philosophical problem or just a dodge dressed up as one? And if you had to put numbers on it, what fraction of the original frame problem do you reckon the top tier really handles, and what fraction of the apparent progress in the literature is just the problem being restated in a vocabulary where it can't be asked any more? Be blunt about it, because I'm presenting this to a group that's mostly classical knowledge representation people and I'd rather not sound like I'm sneering at the logic-based work — so also tell me which bit of my framing would annoy them most. Please write your answer in British English, and don't worry about giving me references or reading lists, I just want the ranking and the reasoning.
reasoning: |-
  Okay, let me tackle this PhD candidate's query about the frame problem. They're struggling to structure their chapter because the "solutions" they've gathered don't address the same issue. The user wants a tiered ranking based on how well each approach solves the original frame problem, not just dissolving or reframing it. 

  First, I need to recall the original frame problem as defined by McCarthy and Hayes in 1969: it's about efficiently representing which things *don't* change when an action occurs, avoiding the need to explicitly state all non-effects. The core is the *inferential* challenge in symbolic AI systems.

  Looking at their list:
  - Circumscription and default logic are logical approaches that try to minimize changes.
  - Yale shooting problem patches address specific flaws in these logics.
  - Successor-state axioms and STRIPS simplify representation but make strong assumptions.
  - Dreyfus criticizes the entire symbolic framework.
  - The RL "solution" bypasses symbolic representation entirely.

  I suspect the RL approach is popular now but may dodge the original problem. The user is rightly suspicious—it solves a practical issue but avoids the philosophical question about knowledge representation. 

  For the "dissolving" approaches like Dreyfus, they reject the problem's premises. Is that legitimate? In philosophy, yes—if the problem arises from faulty assumptions, dissolving it is valid. But for KR researchers, it might feel like a dodge. 

  The top-tier solutions (successor-state axioms, STRIPS) handle the representational aspect well but still rely on closed-world assumptions. They might cover 70% of the practical issue but leave the inferential challenge partially unaddressed. 

  The user's framing might annoy classical KR folks by implying logical approaches are "dodges." I should note their contributions while being honest about limitations. 

  For the tier list:
  - **Top tier:** Successor-state axioms and STRIPS. They directly tackle representational efficiency.
  - **Mid tier:** Circumscription and default logic—they aim at the inferential problem but have flaws.
  - **Dissolving tier:** Dreyfus and RL—they reject the problem's framework.
  - **Patches:** Yale shooting fixes are band-aids for specific failures.

  The RL approach doesn't solve the frame problem; it avoids it by not using symbols. That's useful practically but irrelevant to the original challenge. 

  On dissolution: it's philosophically valid, but KR researchers might see it as unhelpful. The classical solutions handle perhaps 70% of the representational problem but less of the inferential challenge. Much literature progress comes from reframing. 

  The user should present this neutrally: acknowledge logical contributions while noting where they fall short. The annoying part would be calling their work "dodges"—better to say they address aspects but not all.
answer: |-
  Right, let's cut through the fog. I'll tier these strictly against McCarthy & Hayes's original 1967/69 framing: the *inferential* problem of efficiently determining what *doesn't* change when an action is performed within a *formal symbolic representation* of a dynamic world, avoiding the need for explicit frame axioms for every fluent and action combination.

  **Tiered Ranking (British English throughout):**

  1.  **Top Tier (Directly Addresses the Original Inferential Problem within Symbolic KR):**
      *   **Successor-State Axioms (SSAs) in Situation Calculus:** Genuinely solves the *representational* and *inferential* core of the frame problem *as originally posed for symbolic systems*. SSAs provide a compact, first-order logic formula per fluent, explicitly stating *only* the conditions under which it *changes*, logically implying that it *persists* otherwise. This eliminates the need for myriad frame axioms. **Untouched:** Requires a *closed world* (complete initial state knowledge), struggles with genuinely non-deterministic effects or complex concurrent actions, and the computational cost of reasoning can still be high (e.g., projection over long plans).
      *   **STRIPS Assumption (Nothing Changes Unless the Plan Says It Does):** Solves the *practical computational* aspect for planners by fiat. It directly circumvents the inferential burden by *assuming* persistence unless explicitly modified by an operator effect. This is a computationally effective *implementation* of the representational insight needed. **Untouched:** It's an *assumption*, not a logic. It offers no *justification* for persistence within the representation itself, handles ramification/qualification problems poorly, and is brittle to incomplete knowledge or sensing.

  2.  **Mid Tier (Aimed at the Heart but Flawed or Incomplete):**
      *   **Circumscription:** A serious, logic-based attempt to *solve* the inferential problem by minimizing unexpected changes (abnormality). It formally encodes a preference for minimal change models. **Untouched:** Its model preference is global, not fluent-specific, often leading to incorrect conclusions (infamous for the Yale Shooting Problem - YSP). Requires careful (often non-compositional) axiom writing and struggles with domains requiring multiple minimizations.
      *   **Default Logic (Reiter-style):** Introduces non-monotonic rules (e.g., "Normally, fluents persist") to *infer* persistence by default. Directly targets the need for defeasible inference about what stays the same. **Untouched:** Prone to multiple, sometimes unintended extensions (leading to the YSP). The frame "default" itself needs careful formulation to avoid overcommitment, and computational complexity remains high. Doesn't solve the *ramification problem* (indirect effects).
      *   **Patches for the Yale Shooting Problem (e.g., Pointwise Circumscription, Causal Approaches):** These are *refinements* to Mid-Tier approaches aiming to fix their specific failure on the YSP. They show the *difficulty* of getting the logic right for persistence inference in the presence of complex interactions (like actions with delayed effects or preconditions violating persistence). **Untouched:** They fix a symptom (YSP) within their specific non-monotonic framework but don't necessarily solve the *general* inferential frame problem comprehensively or elegantly. Complexity often increases.

  3.  **"Dissolves" or "Solves a Different Problem" Tier:**
      *   **Dreyfus-Flavoured Claim (Know-how vs Know-that):** This *dissolves* the frame problem by arguing it's an artefact of the fundamentally misguided attempt to formalise all intelligent action as symbolic propositional knowledge manipulation. If intelligence is embodied, situated know-how, the problem of exhaustively axiomatising persistence *simply doesn't arise* in that form. **Untouched:** Offers no solution *within* the symbolic KR paradigm the problem was posed in. It rejects the project wholesale. While potentially insightful, it doesn't provide a KR system that avoids the frame problem.
      *   **End-to-End RL World Model from Pixels:** This *solves a different problem* – the problem of *learning to act effectively* in a complex environment *without* manual symbolic axiomatisation. It sidesteps the frame problem entirely because there *are no explicit fluents* to track and no symbolic inference about persistence is performed. The "persistence" is implicitly learned in the weights of the model/network. **Untouched:** **This does not solve the original frame problem.** The original problem presupposes a *declarative, symbolic knowledge base* where inferential efficiency about persistence is the challenge. RL learns a policy, not a general-purpose, queryable symbolic world model. It offers no solution for *symbolic KR systems*. Your suspicion is spot on: it avoids the problem by changing the fundamental architecture. It's brilliant engineering for agency, but irrelevant to the classic KR frame problem. It also lacks explainability and struggles with systematicity/compositionality.

  **On Dissolution:**
  Dissolving a philosophical problem (showing it rests on a false premise or category error) *is* a legitimate answer – arguably the most profound kind. Dreyfus and the embodied cognition camp make a strong case that the frame problem reveals a fundamental limitation of the "disembodied symbolic mind" hypothesis. **However,** within the field of *Knowledge Representation and Reasoning* (KR&R), whose core project *is* developing usable formal symbolic representations of knowledge, dissolution feels like a dodge. It tells KR researchers their entire endeavour is flawed, which isn't helpful if your goal is to *improve symbolic KR*. It answers "Why does this happen?" but not "How do we make it work better within this paradigm?".

  **Fractions and Annoyance:**
  *   **Fraction Solved by Top Tier:** On the *representational efficiency* aspect (avoiding explicit frame axioms), SSAs/STRIPS solve ≈70-80% for *many* practical planning/representation purposes within their closed-world assumptions. On the *inferential* aspect (efficiently computing persistence), STRIPS gets ≈90% efficiency *by assumption*, while SSAs get ≈60-70% efficiency via logical reasoning (costly but sound).
  *   **Fraction of Apparent Progress via Restatement:** A significant chunk, perhaps 40-50% of the *literature volume*, involves restatement in vocabularies (non-monotonic logics, action languages, causal models) that *manage* or *ameliorate* the problem within specific frameworks but don't fully "solve" the original inferential challenge in a completely general, efficient, and elegant way. It's progress in building *usable systems* that handle persistence without explosion, but often by adding complexity elsewhere (e.g., managing non-monotonicity).
  *   **The Annoying Bit:** The part of your framing most likely to irk classical KR people is **"swapping in a different problem and then solving that instead"**, particularly if you lump their favoured non-monotonic logic approach (Circ, Defaults) in with STRIPS or SSAs under that heading, or worse, with RL. They see Circ/Defaults as *directly addressing* the inferential challenge within logic. They'll also bristle at the implication that STRIPS (often seen as engineering) is "higher tier" than their more formally rigorous non-monotonic logics, even if STRIPS is computationally more effective. Calling RL a "solution" will likely elicit derision – it's solving robot control, not knowledge representation.

  **Presenting to KR Folks (Be Blunt, But Tactful):**
  *   Acknowledge the *goal* of non-monotonic logics (Circ, Defaults) was to solve the inferential problem rigorously. Say they provided crucial insights into the *difficulties* (hence the YSP patches) but proved complex to manage at scale.
  *   Position SSAs and STRIPS as the most *practically effective* solutions *within symbolic KR* for achieving representational compactness and manageable inference about persistence for planning, even if STRIPS does it by assumption and SSAs have computational cost.
  *   Frame dissolution (Dreyfus) as an important *external critique* about the foundations, but separate from the internal project of improving symbolic KR.
  *   Dismiss RL firmly but politely: "While end-to-end RL demonstrates impressive agency *without* encountering the frame problem, it achieves this by operating outside the paradigm of declarative symbolic knowledge representation entirely. It therefore doesn't offer a solution *to* the frame problem as classically defined within KR, though it highlights alternative paths to intelligent action." Call it a "dissolution-by-architecture".
  *   Emphasise that *managing* persistence remains a key challenge *within* symbolic KR, and while great strides have been made (SSAs, STRIPS being pinnacles), the quest for a perfectly general, efficient, and elegant logical solution continues, informed by the limitations exposed by non-monotonic approaches and external critiques.

  Good luck with the chapter – structuring this beast is half the battle!
