  *System 2 (Wide Self-Model State):*
  The same warehouse robot, but redesigned: it no longer maintains a separate dedicated battery state. Instead, the battery sensor updates only the self-model’s battery representation (S2). The recharge controller (triggering at 20%), the diagnostic module (adjusting at 30%), and the reporting module (reporting at 20%) all directly read S2 from the self-model.

