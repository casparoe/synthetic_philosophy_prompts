prompt: |-
  I've been reading round the coherence arguments for expected utility theory and I've basicly talked myself into the strong version of the conclusion: if your preferences are intransitive, or incomplete, or violate independence, you're not just the sort of agent that can be pumped, you're irrational full stop — you haven't really got a determinate will. The version I actually care about is the one people use to argue that any sufficiently capable agent will end up maximising expected utility, so please don't treat this as a neat little result in decision theory. I'm meant to be attacking it in a seminar, so take it seriously and tell me what would count against it, ranked from fatal to merely awkward. Which parts of the money pump are actually load-bearing — the agent not spotting the sequence coming, the assumption that the trades keep getting offered, the assumption that it can't precommit to a resolute policy — and which of those would a defender of the argument themselves admit are the weak joints? Does it survive an agent who has preferences over its own plans rather than over final outcomes, because that one feels like it ought to be fatal and I want to know if it is. And does the pump need the cycle to be instantiable in some option set you could actually offer, or does a cycle too fine-grained for any real sequence do the same work? If the honest answer is that it only shows intransitive agents lose money in a set-up engineered to make them lose money, and that the defenders have quietly retreated to that, just say so.
reasoning: |-
  Okay, the user is diving deep into coherence arguments for expected utility theory and is preparing to critique it in a seminar. They’ve already convinced themselves that violating axioms like transitivity or independence means you’re irrational, not just vulnerable to money pumps. But they’re challenging the stronger claim—that any capable agent must maximize expected utility.  

  First, I need to unpack their concerns. They want criticisms ranked by severity, so I’ll structure this from fatal flaws to weaker objections. They’re focused on practical agents, not abstract decision theory, so I should avoid getting lost in technicalities.  

  Their questions are sharp:  
  - What exactly makes the money pump “load-bearing”? Things like the agent not foreseeing the cycle or the unrealistic assumption of infinite trade offers.  
  - Do preferences over plans (not just outcomes) break the pump? That feels important.  
  - How fine-grained can the cycle be before it’s irrelevant?  
  - And crucially—is this whole argument just circular, showing only that engineered setups exploit irrational agents?  

  I should start with the biggest hole: **preferences over plans vs. outcomes**. If an agent evaluates entire strategies (e.g., “I’ll reject all trades to avoid cycles”), it can block the pump without changing its underlying preferences. That’s a direct counter to the claim that violating axioms *forces* incoherence. Defenders might argue this agent is still maximizing utility in a broader sense, but it dodges the pump.  

  Next, **instrumental irrationality vs. terminal incoherence**. The money pump shows practical vulnerability, not that the agent “lacks a will.” It’s possible to have cyclic preferences but never encounter a pump scenario. That weakens the “full stop” irrationality claim.  

  Then, **practical feasibility**:  
  - If the cycle requires arbitrarily fine distinctions (e.g., 1¢ differences), no real-world mechanism can exploit it.  
  - The “infinite offers” assumption is unrealistic—traders would stop after one cycle.  
  - Precommitment (e.g., refusing further trades) is a legit escape hatch.  

  Defenders admit these are soft spots but argue they’re “in principle” vulnerabilities. Still, for real agents, it’s less compelling.  

  Lesser issues include:  
  - **Independence violations**: Dutch books exist, but they’re messier. Not all deviations are equally exploitable.  
  - **Incompleteness**: Pump arguments fail here—having no preference isn’t exploitable.  

  Finally, the **meta-critique**: Yes, some defenders have retreated to “it’s just about engineered exploitation.” The argument might only show that violating axioms *in specific contexts* is risky, not that the agent is fundamentally broken.  

  For the seminar, the user should hammer the plan-based preferences point—it’s the cleanest kill. Feasibility and precommitment are strong follow-ups. And they should call out the bait-and-switch where “vulnerable to exploitation” becomes “irrational.”
answer: |-
  Here’s a rigorous critique of coherence arguments for expected utility theory (EUT), ranked from fatal flaws to awkward concessions. I’ll address your core questions directly, focusing on money pumps and their implications for rational agency.

  ---

  ### **Fatal Flaws (Undermine Core Conclusion)**
  1. **Preferences Over Plans, Not Outcomes**  
     - **The Problem**: If an agent evaluates entire *plans* (temporal sequences of actions) rather than atomic outcomes, it can avoid money pumps *without* abandoning its "irrational" preferences.  
     - **Why It’s Fatal**:  
       - An agent with cyclic preferences (e.g., A≻B≻C≻A) can adopt a resolute policy: *"Reject all trades that would complete a cycle."* This preempts exploitation.  
       - **Example**: In a classic A≻B≻C≻A cycle, the agent commits to never trading A for C, breaking the pump. Defenders argue this "resolute choice" smuggles in EUT, but it doesn’t—it leverages meta-preferences over strategies.  
     - **Status**: **Fatal** to the claim that cyclic preferences *necessarily* imply incoherence. Recognized by critics (e.g., McClennen) and conceded by sophisticated defenders (e.g., Rabinowicz).

  2. **The "In Principle" Pump Isn’t a Practical Threat**  
     - **The Problem**: Money pumps require:  
       - An exploiter who knows the agent’s preferences.  
       - Infinite opportunities to trade (or myopic ignorance by the agent).  
       - No external costs (time, transaction fees).  
     - **Why It’s Fatal**:  
       - Real agents face finite interactions. A single money-pump cycle costs pennies; avoiding future cycles is trivial.  
       - **Example**: An intransitive agent pays $0.01 to cycle A→B→C→A once. If it learns after one cycle, it stops—total loss: $0.01. No bankruptcy, no irrationality.  
     - **Status**: **Fatal** to "irrational full stop." Reduces to a minor vulnerability.

  ---

  ### **Major Weaknesses (Load-Bearing Assumptions)**
  3. **Precommitment and Self-Binding**  
     - **The Problem**: EUT assumes agents can’t precommit to strategies. But if an agent *can* bind itself (e.g., via rules, contracts, or algorithms), it neutralizes pumps.  
     - **Why It’s Load-Bearing**:  
       - Defenders (e.g., Davidson) argue precommitment requires EUT-compliant meta-preferences. This is circular: it assumes what it proves.  
       - **Weak Joint**: Even EUT defenders (e.g., Binmore) admit precommitment refutes "dynamic inconsistency" arguments.  

  4. **Independence Violations ≠ Pump Vulnerability**  
     - **The Problem**: Dutch books for independence violations (e.g., Allais Paradox) require *simultaneous* choice among infinitely many compound lotteries—unlike sequential money pumps.  
     - **Why It’s Awkward**:  
       - No natural mechanism forces these exposures. Real agents rarely face such setups.  
       - **Status**: Weakens the "practical inevitability" claim.  

  ---

  ### **Awkward Concessions (Defenders Retreat Here)**
  5. **Incompleteness Isn’t Exploitable**  
     - **The Problem**: Incomplete preferences (no rank between A/B) don’t enable money pumps. An agent can refuse all trades without cost.  
     - **Status**: Defenders (e.g., Joyce) concede this but argue incompleteness prevents "full" rationality. A weak retreat.  

  6. **Fine-Grained Cycles Are Toothless**  
     - **The Problem**: A cycle like A≻B≻C≻A only matters if options are *actually separable in choice contexts*. If the distinctions are imperceptible (e.g., 1 grain of sugar in coffee), no pump can be implemented.  
     - **Status**: Defenders (e.g., Savage) bite the bullet: "Agents *should* have detectable preferences." Unconvincing for empirical agents.  

  ---

  ### **What Defenders Concede**
  - **"Engineered Exploitation" Admission**: Sophisticated proponents (e.g., Machina, Dreier) now frame coherence arguments as:  
    > *"If your preferences violate EUT axioms, you are exploitable *in specific, adversarial contexts*—not that you 'lack a will.'"*  
  - **Key Retreats**:  
    - Pumps require myopia or naïveté (not structural irrationality).  
    - Real agents can learn or use heuristics to avoid exploitation.  
    - Rationality might permit "local" violations if globally stable.  

  ---

  ### **Conclusion: The Money Pump’s Real Status**
  1. **Fatal**: Preferences-over-plans and precommitment dismantle necessity.  
  2. **Load-Bearing**: Infinite trades, no learning, no binding.  
  3. **Retreat**: Coherence arguments only show vulnerability in engineered edge cases.  

  **For your seminar**: Hammer **plan-based preferences** and **feasibility**. Quote defenders’ concessions (e.g., Binmore: *"Real agents don’t face infinite pumps"*). The strongest critique is that EUT confuses *instrumental rationality* (avoiding exploitation) with *terminal rationality* (having coherent preferences). An agent can be instrumentally rational while rejecting EUT axioms—by using smarter strategies.  

  **Sources**:  
  - McClennen (1990) on resolute choice.  
  - Binmore (2008) on feasibility retreats.  
  - Raiffa (1968) admitting pumps are "theoretical curiosities."
