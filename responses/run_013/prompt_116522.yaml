  The student's question about "50/50 with no evidence" is spot on. The paradox does show why that's problematic, but we should explain how real science avoids this pitfall.

  I should emphasize that the principle of indifference isn't useless - it just needs careful application. The Bayesian "invariance" approach they mentioned isn't cheating, but it requires justifying symmetries.

  Most importantly, I need to reassure them that this doesn't make probability unscientific. The example of radioactive decay shows how probabilities remain objective when tied to physical processes.

