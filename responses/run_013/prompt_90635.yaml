answer: |-
  **Joint Statement of the Adversarial Collaboration on Omissions and Causation**  
  *Signed:*  
  **Signatory A (Event/State Realism Camp)**  
  **Signatory B (Difference-Maker Causation Camp)**  

  ---

  ### 1. Claims Both Sides Accept  
  We agree on the following, which form the basis for constructive engagement:  
  1. **Ordinary Language Data**: In everyday discourse, people treat omissions (e.g., "not watering," "not inspecting") as causes, and a theory of causation must explain this practice without dismissing it as uniformly mistaken.  
  2. **Counterfactual Symmetry**: In standard cases (e.g., forgetful neighbor vs. uninvolved stranger; negligent inspector vs. non-inspecting firm), both omissions bear identical counterfactual relations to the outcome (the outcome would not have occurred *if* the omitted action *had* been performed).  
  3. **Normative Divergence**: Despite identical counterfactual relations, ordinary causal judgments distinguish these cases (e.g., blaming the neighbor/inspector but not the stranger/firm). This divergence tracks normative facts (duties, expectations, conventions).  
  4. **Theory’s Task**: A theory of causation must account for both the counterfactual structure of omission cases and why causal language reflects normative distinctions.  
  5. **Verbal Element**: At least part of our dispute concerns how to *describe* causal reality, not whether omissions make a difference to outcomes.  

  ---

  ### 2. Residual Disagreements  
  | Issue | Event/State Realism Camp | Difference-Maker Causation Camp |  
  |-------|---------------------------|--------------------------------|  
  | **1. The nature of "omission"** | "Omission" is a descriptive device highlighting how positive facts (e.g., an agent’s capacities, duties, or surrounding conditions) causally explain outcomes. | "Omission" names a genuine causal relatum (a lack or absence) that directly contributes to outcomes, analogous to events or states. |  
  | **2. Role of norms** | Norms affect the pragmatics of causal claims (e.g., which differences we *select* as "the cause") but not their truth conditions. | Norms partially constitute the truth conditions of causal claims involving omissions (e.g., duties ground the existence of causally relevant absences). |  
  | **3. Connection to absences** | The dispute over omissions is a subset of the broader metaphysical debate: we reject *all* absences as causal relata. | The dispute is inseparable from the metaphysics of absences; accepting omissions as causes requires accepting some absences as real. |  

  ---

  ### 3. Cruxes and Cases  
  #### Crux (a): The Norm-Free Omission  
  **Case**: Two plots burn identically due to an un-mowed firebreak. Plot 1: Owner historically mowed it (creating expectations), but was hospitalized. Plot 2: No history, duty, or expectation of mowing.  
  - **Event/State Realism Prediction**: Ordinary speakers will judge *only* Plot 1’s omission as causal before norms are introduced, due to implicit expectations. This reflects pragmatic selection, not causal structure; judgments are unreliable evidence.  
  - **Difference-Maker Prediction**: Speakers will judge *both* omissions causal initially, as both are difference-makers. The normative difference in Plot 1 merely explains blame, not causation. Judgments are evidence for causal structure.  
  **Crux**: Whether pre-normative judgments track causal structure or pragmatic selection.  

  #### Crux (b): The Designed Omission  
  **Case**: A dam’s spillway gate fails to open (per specification) due to:  
  (i) Lightning strike (external fault)  
  (ii) Factory miscalibration (internal fault)  
  (iii) Programmer intentionally setting threshold too high (design choice).  
  - **Event/State Realism View**: The gate’s not-opening is *never* a cause; only positive events (e.g., rainfall, sensor failure) are. Norms/specifications affect *description*, not causation. Variations (i–iii) change only moral/pragmatic assessments.  
  - **Difference-Maker View**: The omission *is* a cause if it made a difference (e.g., if a working gate would have prevented flooding). Specifications determine whether the omission is a *default state* (no cause) or a *failure* (cause). Thus, (i) and (ii) are causes; (iii) may not be if the design itself caused the flood.  
  **Crux**: Whether specifications/norms transform an absence into a causal relatum.  

  ---

  ### 4. Verbal Disagreements and Translation  
  We agree the following disputes are verbal, with translations:  
  - **Event/State Realism to Difference-Maker**:  
    *Our claim*: "Only positive facts are causal relata; omissions describe how those facts explain outcomes."  
    → *Translation*: "The causal work is done solely by positive facts; omissions are a way of describing their role."  
  - **Difference-Maker to Event/State Realism**:  
    *Our claim*: "Omissions are causes when they are difference-makers."  
    → *Translation*: "The absence of an expected positive event is a causally relevant factor when it makes a difference."  

  **Residual Non-Verbal Disagreement**: Whether the translated statements above commit us to the existence of *absences as metaphysical entities* in the causal structure of the world. Event/State Realism denies this; Difference-Maker affirms it.  

  ---  
  **Signed in collaboration,**  
  Signatory A  
  Signatory B
