answer: |-
  Here is a decision tree built from the logical space of disagreement about historical claims, designed to map positions without requiring acceptance of labels. It focuses on the *structure* of the disagreement, using concrete cases and philosophical distinctions. The tree has 8 branch nodes (questions) leading to 10 named leaf positions, each with its "awkward commitment."

  ### Decision Tree: Mapping Disagreement About Historical Claims

  **Node 1: Is there a principled way to distinguish reliable historical claims from unreliable ones?**  
  *   **Yes (→ Node 2)**  
  *   **No (→ Node 5)**  
  *(Concrete Case: Comparing radiocarbon dating protocols vs. "common sense" dating of artifacts)*

  **Node 2 (Yes to principled distinction): What is the core basis for this distinction?**  
  *   **Adherence to specific methodological rules (e.g., falsifiability, peer review, evidence handling) (→ Node 3)**  
  *   **Correspondence to a pre-defined body of evidence (e.g., "accepted sources") (→ Leaf 1: Conventionalism)**  
      *   *Leaf 1: Conventionalism*  
      *Awkward Commitment: Must accept that the current "accepted sources" (e.g., Tacitus, Josephus) are axiomatically reliable, even if their transmission chain has gaps, making it vulnerable if a key source is proven forged.*  
  *(Concrete Case: Accepting the *Historia Augusta* at face value before modern source criticism exposed its fabrications)*

  **Node 3 (Methodological Rules): Where does the defect in unreliable claims primarily lie?**  
  *   **In the evidence itself (e.g., forgery, misinterpretation) (→ Leaf 2: Evidentialism)**  
      *   *Leaf 2: Evidentialism*  
      *Awkward Commitment: Must explain how methodological rigor *prevents* evidence misinterpretation (e.g., why the Vinland Map wasn't universally accepted despite "good" initial evidence), risking circularity.*  
  *   **In the method of inquiry (e.g., self-sealing arguments, ignoring counter-evidence) (→ Node 4)**  
  *   **In the social organization of the community evaluating it (e.g., dogma, gatekeeping) (→ Leaf 3: Institutional Skepticism)**  
      *   *Leaf 3: Institutional Skepticism*  
      *Awkward Commitment: Must maintain that mainstream history *could* be correct in principle, but is currently corrupted by its institutions (e.g., academia, museums), making positive claims about the past difficult.*

  **Node 4 (Defect in Method): What is the key methodological flaw?**  
  *   **Unfalsifiability / Self-Sealing Arguments (e.g., absence of evidence = evidence of cover-up) (→ Leaf 4: Falsificationist Demarcation)**  
      *   *Leaf 4: Falsificationist Demarcation (Popperian)*  
      *Awkward Commitment: Struggles with claims that are technically falsifiable but practically untestable (e.g., "All records from 300-400 AD were forged"), and with underdetermination (multiple theories fitting the same evidence).*  
  *   **Systematic use of Ad Hoc Rescues (e.g., inventing new causes for failed predictions) (→ Leaf 5: Lakatosian Degeneracy)**  
      *   *Leaf 5: Lakatosian Degeneracy*  
      *Awkward Commitment: Requires judging entire "research programmes" over time (e.g., Fomenko's vs. mainstream chronology), which is complex and retrospective, making real-time demarcation hard.*  
  *(Concrete Case: Fomenko explaining lack of corroborating Chinese records by claiming they were *also* rewritten later)*

  **Node 5 (No principled distinction): Is there still a difference between good/bad historical inquiry?**  
  *   **Yes, but it's purely contextual/pragmatic (→ Node 6)**  
  *   **No, it's all relative/narrative (→ Leaf 6: Radical Constructivism)**  
      *   *Leaf 6: Radical Constructivism*  
      *Awkward Commitment: Cannot consistently claim *any* historical account (including Fomenko's or the mainstream) is "better" or "worse" in a truth-related sense, only more/less useful for specific groups.*

  **Node 6 (Contextual/Pragmatic Difference): What anchors the distinction?**  
  *   **Predictive/Explanatory success within a framework (→ Leaf 7: Internal Coherentism)**  
      *   *Leaf 7: Internal Coherentism*  
      *Awkward Commitment: Must accept wildly different but internally consistent histories as equally valid within their own frameworks (e.g., mainstream chronology vs. Velikovsky's catastrophism), abandoning convergence on a shared past.*  
  *   **Social consensus and institutional practices (→ Leaf 8: Sociological Demarcation)**  
      *   *Leaf 8: Sociological Demarcation (e.g., Latour, SSK)*  
      *Awkward Commitment: Admits the distinction is *only* about social power/authority, not epistemic superiority. Mainstream history is "reliable" only because powerful institutions say so.*  

  **Node 7 (From Node 1 - No principled distinction): Is the demand for a demarcation criterion itself mistaken?**  
  *   **Yes, due to underdetermination & theory-ladenness (→ Leaf 9: Underdetermination Agnosticism)**  
      *   *Leaf 9: Underdetermination Agnosticism*  
      *Awkward Commitment: Forced into agnosticism about large swathes of the past (e.g., Dark Ages, early Rome), as no evidence can definitively choose between rival reconstructions.*  
  *   **Yes, consensus is primary & constitutive (→ Leaf 8: Sociological Demarcation)**  
      *(Same Leaf as above)*

  **Node 8 (Practical Implication): What follows for engaging with claims like Fomenko's?**  
  *   **Debunk using methodological/epistemic arguments (→ Paths from Node 2/3/4)**  
  *   **Engage constructively as a rival narrative (→ Leaf 10: Narrative Pluralism)**  
      *   *Leaf 10: Narrative Pluralism*  
      *Awkward Commitment: Must treat claims like "Jesus was a 12th-century pope" as a valid cultural narrative rather than a factual claim to be falsified, potentially legitimizing harmful revisionism.*  
  *   **Ignore as irrelevant noise (→ Implicit in Node 6/Leaves 6-8)**  
  *   **Inoculate by teaching critical historiography (→ Paths from Node 2/3/4)**

  ---

  ### Mapping & Unoccupied Combinations
  *   **Leaf 1 (Conventionalism):** Occupies "Yes-Principled → Evidence-Based". Uncommon today due to source criticism.
  *   **Leaf 2 (Evidentialism):** "Yes-Principled → Method → Evidence". Common among working historians.
  *   **Leaf 3 (Institutional Skepticism):** "Yes-Principled → Method → Community". Occupied by critics *within* mainstream academia.
  *   **Leaf 4 (Falsificationist):** "Yes-Principled → Method → Flaw: Unfalsifiable". Classical Popperian view.
  *   **Leaf 5 (Lakatosian):** "Yes-Principled → Method → Flaw: Ad Hoc Rescues". More nuanced than Popper.
  *   **Leaf 6 (Radical Constructivism):** "No Principled → No Difference". Rare; undermines all history.
  *   **Leaf 7 (Internal Coherentism):** "No Principled → Contextual → Success". Found in some postmodern history.
  *   **Leaf 8 (Sociological Demarcation):** "No Principled → Contextual → Consensus" OR "Demand Mistaken → Consensus". Strong Programme in Sociology of Knowledge.
  *   **Leaf 9 (Underdetermination Agnosticism):** "Demand Mistaken → Underdetermination". Philosophical caution.
  *   **Leaf 10 (Narrative Pluralism):** Implicit from Node 8 (Practical: Engage). Public-facing cultural studies.

  **Unoccupied Combinations & Why:**
  *   **"Yes-Principled → Defect in Conclusions":** Empty. If method/evidence are sound, "wrong conclusions" is incoherent. Conclusions *are* the output of method+evidence.
  *   **"No Principled → Yes Difference → Defect in Evidence":** Unattractive. If no principle exists, judging "defective evidence" relies on circular or arbitrary standards.
  *   **"Defect in Community → Accept Mainstream Methods":** Incoherent. If the community is defective, its methods are suspect by definition.

  **Indistinguishable Pair:**  
  *Leaf 8 (Sociological Demarcation)* and *Leaf 3 (Institutional Skepticism)* can appear identical **if** the skeptic believes institutions *determine* methodology irredeemably. The tree separates them based on Node 3: Skepticism accepts methodological principles exist but are corrupted; Sociology denies principles exist beyond social practice.

  ---

  ### Where Your Brother Likely Lands & How to Move Him
  **Most Likely Leaf:** **Leaf 8 (Sociological Demarcation)** or **Leaf 1 (Mainstream as Pseudohistory - implied by Fomenko's position)**.  
  *   *Why?* He rejects mainstream epistemology ("swallowed the official account"), sees consensus as proof of fabrication (Node 5 → Node 6), and likely views the defect as institutional corruption (Node 3 → Community). Fomenko directly positions mainstream history as the pseudohistory (Leaf 1 inverse).

  **What Might Move Him:**  
  1.  **Internal Inconsistency in Fomenko:** Show how his methods (e.g., statistical astronomy) *require* trusting some mainstream data/calibrations he elsewhere rejects as fabricated. If *all* data is corrupted, his own corrections are groundless.  
  2.  **Failed Predictions:** Find areas where mainstream chronology made risky, specific predictions later confirmed (e.g., dendrochronology confirming Roman-era shipwrecks, ice cores aligning with volcanic events dated by historians). Contrast with Fomenko's ad hoc rescues (Node 4).  
  3.  **Practical Success:** Highlight technologies relying on accurate ancient timelines (e.g., eclipse calculations for historical astronomy, climate models using Roman proxy data). If timelines were fabricated recently, this success is inexplicable.  
  4.  **Hijack His Skepticism:** Agree that institutions *can* be biased, but note Fomenko's work arose within the Soviet Academy of Sciences – another powerful institution. Why trust one over the other without methodological grounds (Node 3)?

  Focus on **inconsistency within his own framework** and **practical successes of mainstream chronology** that Fomenko struggles to explain without endless ad hoc hypotheses. Avoid appeals to authority; engage the methodological flaws in *his* sources (e.g., Fomenko's selective use of eclipses, ignored counter-evidence).
