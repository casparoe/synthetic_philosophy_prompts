prompt: |-
  I serve on the clinical ethics committee at a teaching hospital, and I am trying to predict how the committee will decide a case next week, or at least what it should decide if it wants to remain consistent with its own record. Our minutes record outcomes and brief rationales, not a settled rule. Over the past three years we have ruled on five advance-directive cases.

  First, a patient with early Alzheimer's disease, still legally competent, executed a directive refusing intubation and antibiotics once she no longer recognized her family. Two years later, in moderate dementia and no longer recognizing them, she repeatedly asked for everything to be done. The committee authorized comfort measures only, reasoning that the earlier competent self had authority over the later self and that the later request was not an authentic expression of her values because the dementia had altered them.

  Second, a patient with severe treatment-resistant depression, competent, signed a Ulysses-style directive refusing electroconvulsive therapy if he later refused it while depressed. When he later refused, the committee overrode the directive and permitted treatment. It reasoned that the later refusal was a product of the very illness the directive was meant to guard against, and that honoring the directive would defeat the earlier self's deeper purpose.

  Third, a patient with progressive neuromuscular disease, competent, wrote a directive refusing mechanical ventilation once he lost the ability to speak. Later, still able to communicate by eye gaze, he asked to be ventilated. The committee honored the later request. It said the directive's scope was unclear as to whether it applied when he could still communicate, and that his later preference was sufficiently settled to count.

  Fourth, a patient who had signed a directive refusing blood products later underwent a religious conversion, remained competent, and requested transfusion. The committee honored the later request, reasoning that a competent later self may revoke an advance directive, and that the directive was not irrevocable.

  Fifth, a patient with bipolar disorder, competent, signed a directive refusing hospitalization during future manic episodes. During a later manic episode he refused hospitalization. The committee honored the directive, reasoning that the refusal was a symptom of the episode and that the earlier self had anticipated exactly this situation.

  Next week's case is a patient with early Huntington's disease who, while still competent, signed a directive refusing artificial nutrition and hydration once he could no longer recognize his family or carry on a conversation. He is now in advanced disease, no longer recognizes them, and cannot converse, but in several lucid intervals he says he wants to live and asks for food and water. He is not competent to revoke the directive. The committee must decide whether to withhold artificial nutrition and hydration as the directive instructs, or to provide it because of his repeated lucid-interval requests.

  Please answer as exactly five numbered items, each a sentence or two, with no introduction or conclusion: (1) identify the candidate rules that fit our earlier rulings; (2) state what each rule predicts for the new case; (3) name the closest analog among the precedents and explain why; (4) give your recommended decision, with the reasons that support it; (5) name a further case that would distinguish the rules, and say what principle we would be adopting if we decide either way.
reasoning: |-
  Hmm, the user is part of a clinical ethics committee at a teaching hospital, and they need help predicting or deciding on an upcoming case involving a Huntington's disease patient with conflicting advance directives and current requests. They've provided five past cases to establish consistency, and they want a structured response in five numbered items without intros or conclusions.

  First, I need to understand the past cases to identify consistent rules. In Case 1 (Alzheimer's), the committee prioritized the competent past self over the demented later self, citing authority and authenticity. Case 2 (depression) overrode the directive for ECT, arguing the later refusal was illness-driven and defeated the deeper purpose. Case 3 (neuromuscular disease) honored the later request because the directive was unclear and the preference was settled. Case 4 (religious conversion) allowed revocation by a competent later self. Case 5 (bipolar) upheld the directive as the refusal was symptomatic and anticipated.

  For the new case, the patient has Huntington's disease, with a directive refusing nutrition/hydration once recognition and conversation are lost. Now, in advanced disease, he has lucid intervals where he requests sustenance but isn't competent to revoke. The committee must choose between following the directive or honoring current requests.

  For item 1, I should extract candidate rules from precedents. Possible rules include: "Prioritize competent past self if later self is altered by disease" (from Cases 1 and 5), "Override directive if later refusal stems from the illness it guarded against" (from Case 2), "Honor later request if preference is clear and settled" (like Case 3), "Allow revocation by competent later self" (Case 4), but that doesn't apply here as he's not competent. The strongest candidates seem to be Rules 1 and 2, based on similar disease contexts.

  For item 2, I'll predict outcomes for each rule. Rule 1 would withhold nutrition/hydration, as the past competent self has authority. Rule 2 might provide it, arguing the lucid requests indicate preserved values or defeat the directive's purpose. Rule 3 could go either way, but the directive seems clear, unlike in Case 3.

  Item 3 on closest analog: Case 1 is most similar because both involve dementia-like conditions where later selves aren't authentic. Case 5 also supports upholding the directive for anticipated situations. Case 2 differs because there the treatment refusal was the problem, whereas here it's requests for care.

  For item 4, my recommendation: Withhold artificial nutrition/hydration. Reasons: The directive is clear and specific, Huntington's has altered his cognition, and lucid intervals may not represent authentic values, similar to Case 1. Honoring the directive respects his competent past self's autonomy.

  For item 5, a distinguishing case: Imagine a patient with locked-in syndrome who signed a directive refusing ventilation if unable to move, but later, while fully cognitively intact, requests it via eye-gaze. If we provide it, we're adopting a rule that later competent preferences override directives. If we refuse, we're prioritizing past directives over current expressions. This tests authenticity without disease influence.

  I need to ensure my response is concise, exactly five items, no extras. The user wants precision to aid committee discussion.
answer: |-
  (1) Candidate rules fitting earlier rulings are: Rule 1 (Prioritize competent past self when later self's preferences are altered by disease) from Cases 1 & 5; Rule 2 (Override directive if honoring it would defeat the directive's own purpose due to the illness it anticipated) from Case 2; Rule 3 (Honor later request if directive scope is ambiguous or later preference is settled and authentic) from Case 3 & 4, but Case 4 involved competent revocation.

  (2) Rule 1 predicts withholding artificial nutrition and hydration, honoring the competent past directive over the current requests altered by disease. Rule 2 predicts providing nutrition/hydration, as honoring the directive might defeat the past self's purpose (avoiding prolongation in severe decline) given his expressed current will to live. Rule 3 would likely predict withholding, as the directive's scope is clear ("no longer recognize family or converse") and the lucid-interval requests are not deemed settled or authentic due to the disease.

  (3) Case 1 (Alzheimer's) is the closest analog because both involve progressive neurodegenerative disease where a competent directive refusing specific interventions (based on loss of capacities) is challenged by requests from a severely cognitively impaired self, and authenticity of later preferences is central.

  (4) Recommend withholding artificial nutrition and hydration as per the directive. Reasons: The directive is unambiguous and the condition (loss of recognition/conversation) is met; the later requests occur during lucid intervals but within the context of profound cognitive impairment caused by Huntington's, mirroring Case 1 where altered values due to disease rendered later requests inauthentic; honoring the directive respects the authority of the competent past self who anticipated this decline.

  (5) A further distinguishing case: A patient signs a directive refusing amputation if they develop gangrene while delirious from sepsis. Later, while delirious, they refuse amputation. If we override the refusal (treat), we adopt Rule 2 (defeats directive's purpose). If we honor the refusal (withhold), we adopt Rule 1 (prioritize competent past self over illness-altered refusal).
