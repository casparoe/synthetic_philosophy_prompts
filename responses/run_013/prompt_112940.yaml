answer: |-
  Here are five candidate punchlines, grounded in the no-trade theorem logic, tailored for your ex-academic character turning down a suspiciously good bet:

  1.  "Two-to-one on a fair coin? Either you know it's rigged, or you think I'm stupid enough to *think* you're stupid. Neither option makes taking your money wise."
  2.  "Offer that favorable a bet, and the only thing you're proving is that *you* think you're the sucker here. But since you clearly aren't, I'll pass."
  3.  "If we share the same information and priors, the only reason you'd offer me free money is if you know it isn't free. Thanks, but I prefer my ignorance blissfully symmetric."
  4.  "A market only exists when someone thinks they know better. Since you're offering me such an obvious edge, you must believe I know *less* than you. And agreeing would prove you right."
  5.  "Taking that bet would be admitting I believe in economic miracles or your profound stupidity. Given you look sober and I know my priors, I'll save us both the embarrassment."

  **Why these fit your brief:**

  *   **Focus on Core Idea:** Each directly addresses the paradox: the better the deal looks, the more it signals hidden information or irrationality on *one* side, making trade irrational for the other.
  *   **Sameness of Info/Priors:** Explicitly mentioned in #3 ("share the same information and priors") and implicitly in #1, #2, #4, and #5 (assuming rationality and shared understanding).
  *   **Suspicion of the Offer:** The core humor comes from the protagonist's logical distrust of the *generosity* itself (#1, #2, #3, #4, #5).
  *   **Admitting You're the Mark:** This is central to #2 ("*you* think you're the sucker... agreeing would prove you right") and #4 ("agreeing would prove you right" about knowing less).
  *   **Conciseness:** Each is a single punchy sentence or two.
  *   **Character Voice:** They sound like things a slightly weary, intellectually sharp ex-academic might say in a bar – dry, logical, and a bit world-weary.
  *   **Avoids "Economists are Weird":** The humor stems entirely from the logical conundrum of the bet itself, not mocking the field.

  Read them aloud – see which one feels most natural for your character's specific voice and the rhythm of the scene. They all land the core joke effectively. Good luck with your brother-in-law!
