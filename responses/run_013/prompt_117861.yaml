prompt: |-
  I teach a final-year undergraduate module on causal inference and philosophy of science, and I am drafting the final examination. I want one long essay question, worth 25 marks and intended for 60 minutes, on Simpson's paradox and the logic of adjustment. The question must not be answerable by reciting the definition of the paradox, nor by saying that one should always condition on subgroups or never condition on them. It should force students to use temporal and causal assumptions to decide which comparison answers which question. The question may be divided into labelled sub-parts, but it must read as a single question. Please use the following data, which I have constructed for the examination.

  An observational cohort study compares two triage protocols, A and B, for a condition. There are 1,000 patients in each arm. The outcome is survival to discharge. Two further variables are recorded. Severity is assessed at triage, before the protocol is assigned. ICU transfer is recorded after the protocol has been in use for 24 hours. Protocol assignment was at the clinician's discretion. The data are:

  Protocol A: overall survival 270/1,000 (27%). By severity: mild 90/100 (90%); severe 180/900 (20%). By ICU transfer: transferred 160/800 (20%); not transferred 110/200 (55%).

  Protocol B: overall survival 730/1,000 (73%). By severity: mild 720/900 (80%); severe 10/100 (10%). By ICU transfer: transferred 120/200 (60%); not transferred 610/800 (76.25%).

  The same 2,000 patients generate all of these summaries. The question should present the data and ask students to draw a directed acyclic graph consistent with the temporal information, to state which of the three comparisons (crude, severity-stratified, ICU-stratified) identifies the total causal effect of protocol on survival under that graph, to compute a directly standardised survival proportion for each protocol using the combined severity distribution as the standard, and to say what a policymaker should conclude about which protocol saves more lives. It should also ask students to explain what would change if severity were instead measured after treatment assignment, or if ICU transfer were a pre-treatment variable. The question should make clear that the data alone do not determine the answer; the causal assumptions do.

  Then write a model answer of about 700 words and a marking scheme. The marking scheme should have five must-hit points, with the marks each is worth (total 25), and for each point a one-line note on the mistake that typically costs students that point. The must-hit points should include: the correct DAG and the roles of severity and ICU transfer; the distinction between a confounder and a mediator; the correct identification of the severity-stratified comparison as the total effect; the standardised calculation; and the policy conclusion. The marking scheme should also distinguish a first-class answer from an upper-second-class answer by naming the specific moves each must contain. The model answer should not cite any literature, and the marking scheme should not require citations. Begin your response with the examination question itself, with no preamble; then give the model answer; then give the marking scheme. Do not restate my request.
reasoning: |-
  We are constructing an exam question and model answer for a final-year undergraduate module on causal inference and philosophy of science. The question focuses on Simpson's paradox and the logic of adjustment, using a constructed dataset on two triage protocols (A and B) and patient outcomes.

  The core of the question is to have students use temporal and causal assumptions to decide which comparison (crude, severity-stratified, or ICU-stratified) identifies the total causal effect of the protocol on survival. The data show a reversal (Simpson's paradox) when conditioning on different variables.

  The question must be divided into labelled sub-parts but read as a single question.

  Given the temporal order:
  1. Severity assessed at triage (before protocol assignment).
  2. Protocol assigned at clinician's discretion.
  3. ICU transfer recorded after 24 hours of protocol use.
  4. Outcome: survival to discharge.

  We are to present the data and ask for:
  a) A directed acyclic graph (DAG) consistent with the temporal information.
  b) State which of the three comparisons (crude, severity-stratified, ICU-stratified) identifies the total causal effect of protocol on survival under that graph.
  c) Compute a directly standardised survival proportion for each protocol using the combined severity distribution as the standard.
  d) Say what a policymaker should conclude about which protocol saves more lives.
  e) Explain what would change if severity were measured after treatment assignment, or if ICU transfer were a pre-treatment variable.

  The model answer should be about 700 words and avoid citations.

  The marking scheme must have five must-hit points (with marks totaling 25) and one-line notes on typical mistakes. The points are:
  1. Correct DAG and roles of severity and ICU transfer.
  2. Distinction between confounder and mediator.
  3. Correct identification of the severity-stratified comparison as the total effect.
  4. Standardised calculation.
  5. Policy conclusion.

  Additionally, the marking scheme should distinguish a first-class answer (typically 70% and above in UK system) from an upper-second-class (60-69%) by naming specific moves.

  Let's write the exam question first.

  ---

  **Examination Question**

  A cohort study compares two triage protocols, A and B, for a condition. There were 1,000 patients in each protocol group. The outcome is survival to discharge. Severity (mild or severe) was assessed at triage, before protocol assignment. ICU transfer (transferred or not transferred) was recorded after the protocol had been in use for 24 hours. Protocol assignment was at the clinician's discretion. The same 2,000 patients are described in the following data:

  **Protocol A:**
  - Overall survival: 270/1,000 (27%)
  - By severity:
    - Mild: 90/100 (90%)
    - Severe: 180/900 (20%)
  - By ICU transfer:
    - Transferred: 160/800 (20%)
    - Not transferred: 110/200 (55%)

  **Protocol B:**
  - Overall survival: 730/1,000 (73%)
  - By severity:
    - Mild: 720/900 (80%)
    - Severe: 10/100 (10%)
  - By ICU transfer:
    - Transferred: 120/200 (60%)
    - Not transferred: 610/800 (76.25%)

  Using the temporal information and causal reasoning, answer the following:

  (a) Draw a directed acyclic graph (DAG) that represents the causal relationships between the variables: severity (S), protocol (P), ICU transfer (I), and survival (Y). The DAG must be consistent with the temporal sequence provided.

  (b) Based on your DAG, explain which of the following comparisons identifies the total causal effect of protocol (P) on survival (Y): 
      (i) the crude (unadjusted) comparison of overall survival, 
      (ii) the severity-stratified comparison (i.e., adjusting for severity), or 
      (iii) the ICU-stratified comparison (i.e., adjusting for ICU transfer). 
      Justify your answer.

  (c) Compute a directly standardised survival proportion for each protocol using the combined severity distribution of the entire cohort (i.e., both protocols together) as the standard. Show your calculations.

  (d) As a policymaker, which protocol (A or B) should be adopted to maximize the number of lives saved? Explain your reasoning, noting that the data alone do not determine the answer without causal assumptions.

  (e) How would your answers to parts (a) and (b) change in each of the following two alternative scenarios? Explain briefly.
      (i) Severity is measured after protocol assignment, not before.
      (ii) ICU transfer is a pre-treatment variable (i.e., measured before protocol assignment).

  ---

  **Model Answer**

  (a) The directed acyclic graph (DAG) must respect the temporal sequence: severity (S) is measured first, then protocol (P) is assigned, then ICU transfer (I) occurs, and finally survival (Y) is determined. Additionally, because protocol assignment is at the clinician's discretion, it is likely that severity influences the choice of protocol. Also, both protocol and severity may influence ICU transfer, and all prior variables (S, P, I) may influence survival. Thus, a plausible DAG is:

  S → P → I → Y
  S → I → Y
  P → Y
  S → Y

  Alternatively, we might have no direct effect of S on Y, but the data suggest that severity is a strong predictor of survival. The key is that S is a common cause of P and possibly of I and Y, and I is a mediator on the causal path from P to Y. The DAG should show S as a confounder for the effect of P on Y? Actually, note that S is measured before P, so if S affects P and also affects Y, then S is a confounder of the P-Y relationship. Additionally, I is a mediator because it occurs after P and before Y, and is influenced by P and possibly S, and then affects Y.

  Thus, the DAG should have:
  - S → P (because severity influences protocol assignment)
  - S → I (because severity influences ICU transfer)
  - S → Y (because severity influences survival)
  - P → I (because protocol influences ICU transfer)
  - P → Y (because protocol may have a direct effect on survival)
  - I → Y (because ICU transfer influences survival)

  There should be no arrow from I to P or from Y to any prior variable. Also, no arrow from P to S because S is pre-treatment.

  (b) The total causal effect of P on Y is the effect that is not mediated by any intermediate variable. In the DAG, the path from P to Y is both direct (P→Y) and indirect (P→I→Y). However, the path from P to Y is also confounded by S because S is a common cause of P and Y (via S→P and S→Y). Therefore, to identify the total causal effect, we must condition on the confounder S (i.e., adjust for severity) to block the backdoor path P ← S → Y. However, we must not condition on I because it is a mediator (and also a collider if we condition on it, but more importantly, conditioning on a mediator blocks the indirect path and hence does not capture the total effect). 

  Thus, the severity-stratified comparison (adjusting for severity) identifies the total causal effect. The crude comparison is confounded by S and therefore does not. The ICU-stratified comparison conditions on I, which is a mediator (and also may be a collider if there are unobserved common causes of I and Y, but in any case, conditioning on I blocks the path from P to Y via I and also may open a backdoor path if there is unmeasured confounding between I and Y, but more fundamentally, it does not give the total effect because it conditions on a mediator).

  Therefore, the answer is (ii) the severity-stratified comparison.

  (c) The combined severity distribution of the entire cohort: 
  Total patients: 2000.
  Mild: from A: 100, from B: 900 → total mild = 100+900=1000.
  Severe: from A: 900, from B: 100 → total severe=900+100=1000.

  Standardised survival for Protocol A:
  = [ (Proportion of standard population that is mild) * (Survival in A for mild) ] + [ (Proportion of standard population that is severe) * (Survival in A for severe) ]
  = (1000/2000) * (90/100) + (1000/2000) * (180/900)
  = (0.5 * 0.9) + (0.5 * 0.2)
  = 0.45 + 0.1 = 0.55 (or 55%)

  Standardised survival for Protocol B:
  = (1000/2000) * (720/900) + (1000/2000) * (10/100)
  = (0.5 * 0.8) + (0.5 * 0.1)
  = 0.4 + 0.05 = 0.45 (or 45%)

  Therefore, after standardizing to the overall severity distribution, Protocol A has a survival rate of 55% and Protocol B has 45%.

  (d) The policymaker should adopt Protocol A to maximize the number of lives saved. The reasoning is that after adjusting for severity (which is a confounder), the causal effect of Protocol A is better than Protocol B. This is supported by the severity-stratified comparison: for mild patients, A has 90% vs B's 80%; for severe patients, A has 20% vs B's 10%. Both strata show that A is superior. The standardised survival rates (55% for A vs 45% for B) also reflect this. Without adjusting for severity, the crude comparison (27% vs 73%) is misleading because it is confounded: Protocol A was assigned more often to severe patients (who have a lower survival rate) and Protocol B to mild patients (who have a higher survival rate). The ICU-stratified comparison is inappropriate for the total effect because ICU transfer is a mediator. Therefore, the total causal effect of the protocol on survival is better for A.

  (e) (i) If severity is measured after protocol assignment, then the temporal sequence changes: we have P assigned first, then S measured. This could mean that S is now a mediator (because the protocol might affect severity) or a variable that is affected by the protocol. In this case, S would not be a confounder (because it occurs after P) but might be a mediator. Then, conditioning on S would block the indirect path and possibly open backdoor paths if there are unmeasured confounders. The total causal effect would then be identified by the unadjusted (crude) comparison, unless there are other confounders. However, without conditioning on S, we might have confounding if there are other pre-treatment variables, but the question does not provide any. The key point is that if S is post-treatment, then it should not be conditioned upon for the total effect. The ICU-stratified comparison would still condition on a mediator (I) and hence be inappropriate.

  (ii) If ICU transfer is a pre-treatment variable, then it is measured before protocol assignment. Then, I becomes a confounder (like S) and would need to be adjusted for. The DAG would change: now I occurs before P, so we would have I → P and I → Y, and also S → P, S → I, S → Y. Then, both S and I would be confounders. Therefore, to identify the total effect, we would have to condition on both S and I. However, note that if I is pre-treatment, then it is a confounder and not a mediator. Therefore, the ICU-stratified comparison (adjusting for I) would now be part of the adjustment for confounders, but we would need to adjust for both S and I. The severity-stratified alone would not be sufficient because there is another confounder (I). The crude comparison would be confounded by both.

  ---

  **Marking Scheme (Total 25 marks)**

  **Must-hit points:**

  1. **DAG and roles of S and I (5 marks)**  
     - Correct DAG with arrows: S→P, S→I, S→Y, P→I, P→Y, I→Y.  
     - Typical mistake: Missing arrows (e.g., omitting S→P, or not having I→Y) or adding incorrect arrows (e.g., P→S or I→P).

  2. **Confounder vs mediator (5 marks)**  
     - Clear distinction: S is a confounder (common cause of P and Y) and I is a mediator (on the causal path from P to Y).  
     - Typical mistake: Misidentifying S as a mediator or I as a confounder.

  3. **Identification of severity-stratified comparison for total effect (5 marks)**  
     - States that conditioning on S (severity) is necessary to block confounding and that conditioning on I (ICU transfer) would block the indirect path (mediation) and is therefore inappropriate for the total effect.  
     - Typical mistake: Saying that we should condition on both or neither, or choosing ICU-stratified because it 'fixes' the reversal.

  4. **Standardised calculation (5 marks)**  
     - Correct standard population: 1000 mild and 1000 severe (total 2000).  
     - Correct calculation: A: 0.5*0.9 + 0.5*0.2 = 0.55; B: 0.5*0.8 + 0.5*0.1 = 0.45.  
     - Typical mistake: Using the wrong standard (e.g., using A's severity distribution for both) or arithmetic errors.

  5. **Policy conclusion (5 marks)**  
     - Recommends Protocol A because after adjustment for severity, it has a higher survival rate (55% vs 45%) and the severity-stratified comparison shows A is better in both strata.  
     - Typical mistake: Concluding that B is better because of the crude rate or because of the ICU-stratified rates.

  **Distinction between first-class (typically 70% and above) and upper-second-class (60-69%):**

  - **First-class answer (typically 18.5 marks and above out of 25, but note: 70% of 25 is 17.5, so 17.5+)**:
     - Correctly draws the DAG with all necessary arrows and no incorrect ones, and clearly labels the variables.
     - Explicitly notes that the crude comparison is confounded by severity and that the ICU-stratified comparison conditions on a mediator (and possibly creates collider bias if there are unmeasured confounders, but at minimum the mediation point).
     - In the calculation, shows the arithmetic step-by-step and uses the correct standard (combined).
     - In the policy conclusion, explicitly contrasts the adjusted and unadjusted results and explains why the confounded comparison is misleading.
     - For part (e), correctly identifies that if severity is post-treatment it becomes a mediator and should not be conditioned upon (so then the crude might be used, but note that without S there might be residual confounding) and that if ICU is pre-treatment it becomes a confounder and must be adjusted for (with S).

  - **Upper-second-class answer (typically 15-17.5 marks):**
     - The DAG may have minor errors (e.g., missing a direct effect of S on Y or P on Y) but captures the main structure (S as a confounder, I as a mediator).
     - Identifies that severity adjustment is needed but without a clear explanation of why ICU adjustment is wrong (or confuses mediator with collider).
     - Calculation is correct but without showing the steps or with minor arithmetic errors that are corrected.
     - Policy conclusion states A is better but without a clear contrast of the adjusted vs unadjusted.
     - For part (e), the changes are noted but without a clear explanation of why the role of the variable changes (e.g., saying that if severity is post-treatment then we cannot adjust for it, but without the mediator concept; or if ICU is pre-treatment then we must adjust for it, without noting that it becomes a confounder).
answer: |-
  ### Examination Question

  An observational cohort study compares two triage protocols, A and B, for a condition. There were 1,000 patients in each protocol group. The outcome is survival to discharge. Severity (mild or severe) was assessed at triage, before protocol assignment. ICU transfer (transferred or not transferred) was recorded after the protocol had been in use for 24 hours. Protocol assignment was at the clinician’s discretion. The same 2,000 patients are described in the following data:  

  **Protocol A:**  
  - Overall survival: 270/1,000 (27%)  
  - By severity:  
    - Mild: 90/100 (90%)  
    - Severe: 180/900 (20%)  
  - By ICU transfer:  
    - Transferred: 160/800 (20%)  
    - Not transferred: 110/200 (55%)  

  **Protocol B:**  
  - Overall survival: 730/1,000 (73%)  
  - By severity:  
    - Mild: 720/900 (80%)  
    - Severe: 10/100 (10%)  
  - By ICU transfer:  
    - Transferred: 120/200 (60%)  
    - Not transferred: 610/800 (76.25%)  

  Using temporal and causal reasoning, address all parts below. The data alone do not determine the answers; causal assumptions embedded in your DAG are essential.  

  (a) Draw a directed acyclic graph (DAG) with nodes for severity (S), protocol (P), ICU transfer (I), and survival (Y). Ensure the DAG reflects the temporal sequence: S before P, P before I, and I before Y. Briefly justify your arrows.  
  (b) Under your DAG, which comparison—crude (unadjusted), severity-stratified, or ICU-stratified—identifies the total causal effect of P on Y? Explain why, distinguishing confounders from mediators.  
  (c) Compute the directly standardised survival proportion for each protocol, using the combined severity distribution of the entire cohort as the standard. Show your calculations.  
  (d) As a policymaker, which protocol (A or B) should be adopted to maximise lives saved? Base your answer on (b) and (c), and explain why the data are misleading without adjustment.  
  (e) How would your answers to (a) and (b) change if:  
     (i) Severity were measured *after* protocol assignment?  
     (ii) ICU transfer were a *pre-treatment* variable (measured before P)?  

  ---

  ### Model Answer  

  (a) The DAG must respect temporal order: S (severity) is pre-treatment, P (protocol) is assigned after S but before I (ICU transfer), and I occurs before Y (survival). Clinician discretion implies S influences P (e.g., severe cases more likely assigned to A). P and S both influence I (protocols affect ICU admission; severity does too). Finally, P, S, and I influence Y. The DAG is:  
  - S → P (severity affects protocol choice)  
  - S → I (severity affects ICU transfer)  
  - S → Y (severity directly affects survival)  
  - P → I (protocol affects ICU transfer)  
  - P → Y (protocol may directly affect survival)  
  - I → Y (ICU transfer affects survival)  
  No back-door paths or cycles are present.  

  (b) The total causal effect of P on Y requires blocking confounders but not mediators. Here, S is a *confounder* (common cause of P and Y; S→P and S→Y create confounding). Conditioning on S blocks this back-door path (P ← S → Y). ICU transfer (I) is a *mediator* (on causal path P→I→Y). Conditioning on I blocks part of the effect (mediation) and possibly induces collider bias. Thus:  
  - *Crude comparison* fails due to confounding by S (e.g., S distorts overall rates).  
  - *ICU-stratified comparison* fails by conditioning on mediator I (blocks indirect effect P→I→Y and misrepresents total effect).  
  - *Severity-stratified comparison* adjusts for S (confounder), identifying the total causal effect.  

  (c) Combined severity distribution:  
  - Total mild: 100 (A) + 900 (B) = 1,000  
  - Total severe: 900 (A) + 100 (B) = 1,000  
  - Total patients: 2,000 → Mild proportion: 1,000/2,000 = 0.5; Severe proportion: 0.5.  
  Standardised survival for A:  
  (0.5 × 90/100) + (0.5 × 180/900) = (0.5 × 0.9) + (0.5 × 0.2) = 0.45 + 0.10 = 0.55 (55%).  
  Standardised survival for B:  
  (0.5 × 720/900) + (0.5 × 10/100) = (0.5 × 0.8) + (0.5 × 0.1) = 0.40 + 0.05 = 0.45 (45%).  

  (d) Policymaker conclusion: Adopt Protocol A. The severity-stratified comparison (total effect) shows A has higher survival in both mild (90% > 80%) and severe (20% > 10%) subgroups. Standardisation confirms A (55%) outperforms B (45%) when adjusted for severity. The crude comparison (A:27% vs B:73%) is misleading because clinicians assigned severe patients (poor prognosis) more to A (900 severe) and mild patients (good prognosis) to B (900 mild), creating confounding by severity.  

  (e) Scenario changes:  
  (i) *Severity measured after P*: S becomes a *mediator* (P→S→Y) or outcome of P. Conditioning on S blocks part of P’s effect. The total effect is identified by the *crude* comparison (no confounders), provided no other confounders exist. Severity-stratified comparison now captures direct, not total, effect.  
  (ii) *ICU transfer pre-treatment*: I becomes a *confounder* (common cause of P and Y). The DAG adds I→P (since I precedes P). Adjusting for *both* S and I is needed to identify the total effect. ICU-stratified comparison (adjusting for I alone) is insufficient, as S remains a confounder.  

  ---

  ### Marking Scheme (Total: 25 marks)  

  **Must-hit points (20 marks total; see distinctions for remaining 5 marks):**  
  1. **DAG and variable roles (5 marks)**  
     - *Hit*: Correct DAG with S→P, S→I, S→Y, P→I, P→Y, I→Y; S as confounder, I as mediator.  
     - *Typical mistake*: Omitting S→P (missed confounding) or adding I→P (violates temporality).  

  2. **Confounder vs mediator distinction (5 marks)**  
     - *Hit*: Explicitly labels S as confounder (common cause of P and Y) and I as mediator (on causal path).  
     - *Typical mistake*: Calling I a confounder or S a mediator.  

  3. **Identification of total effect (5 marks)**  
     - *Hit*: Chooses severity-stratified comparison; justifies by blocking confounder S and avoiding mediator I.  
     - *Typical mistake*: Selects ICU-stratified due to Simpson’s reversal, ignoring mediation.  

  4. **Standardised calculation (5 marks)**  
     - *Hit*: Uses combined standard (1,000 mild + 1,000 severe); correct arithmetic (A: 0.55, B: 0.45).  
     - *Typical mistake*: Standardises to one group’s severity (e.g., A’s distribution) or miscalculates proportions.  

  5. **Policy conclusion (5 marks)**  
     - *Hit*: Recommends A based on standardised/stratified results; explains confounding in crude data.  
     - *Typical mistake*: Chooses B due to higher crude survival, ignoring adjustment.  

  **Distinction for remaining 5 marks (quality of explanation):**  
  - **First-class (21–25 marks)**: Rigorous causal reasoning. For (b), explicitly links DAG paths to confounding/mediation. For (d), contrasts standardised vs crude to *explain why* unadjusted data mislead. For (e), correctly reclassifies S as mediator and I as confounder in scenarios.  
  - **Upper-second (16–20 marks)**: Correct but less depth. For (b), states S is confounder but vague on why I is mediator. For (d), notes A is better but weak explanation of confounding. For (e), identifies role changes but lacks causal terminology (e.g., "S becomes an outcome").
