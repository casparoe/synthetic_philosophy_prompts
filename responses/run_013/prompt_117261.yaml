prompt: |-
  I'm putting together my second-year prospectus (philosophy, decision theory) and I've got a half-formed idea I want you to turn into something a committee won't laugh at. The gist: risk-weighted expected utility gets sold as the theory that makes risk attitude part of how you weigh the worse outcomes, rather than a seperate psychological bolt-on, and that's the whole pitch — it handles Allais-style behaviour without positing a second kind of attitude. But it's only ever spelled out for an agent with one precise probability distribution, and the machinery leans on that: the risk function takes a cumulative probability as its argument and the decision weights are differences of r applied to those cumulatives. Let the probabilities go imprecise and there isn't a single cumulative probability sitting at each rank anymore, so the central device is undefined rather than merely interval-valued. Then you have to choose: is the agent risk-averse within each candidate distribution, in which case whatever is left over looks like ambiguity and the theory says nothing about it? Or is r meant to capture the spread across the distributions, in which case r is doing double duty as a risk attitude and an ambiguity attitude at once? Either way I suspect you end up needing a second parameter, and if you need a second parameter the headline claim is in trouble. What I actually want to know is whether that's a real collapse or whether there's a way to set it up where imprecision comes for free. Turn this into a proposal I could hand in. Dont do a bibliography or a literature review, I'll fill in references myself. Give it back as exactly five numbered points, each a sentence or two, no intro and no closing summary: (1) the question, stated so it has a determinate answer; (2) why the existing treatments leave it open; (3) the method — what I'd actually do, month by month across two semesters, and why that rather than an empirical study; (4) what a genuine result would look like and what would count as the project failing; (5) whether it's too big for the time and what I'd cut.
reasoning: |-
  Okay, the user is working on a philosophy and decision theory prospectus, specifically tackling risk-weighted expected utility (REU) with imprecise probabilities. They have a half-formed idea about how REU, which handles risk attitudes via a risk function applied to cumulative probabilities, breaks down when probabilities are imprecise. The user wants to transform this into a solid proposal for their committee.

  First, I need to understand their core argument. They point out that REU relies on precise probabilities for its risk function. With imprecise probabilities, there's no single cumulative probability at each rank, so the risk function becomes undefined. The user sees two possible approaches: either apply the risk function within each precise distribution (leaving ambiguity unaddressed) or let the risk function handle the spread across distributions (blurring risk and ambiguity attitudes). Either way, a second parameter might be needed, undermining REU's claim of unifying attitudes.

  The user's explicit request is to structure this into five numbered points without intros or conclusions. But deeper needs might include clarity in framing the problem, a feasible research plan, and clear success/failure criteria to convince the committee. They might also worry about scope—ensuring the project is manageable in two semesters.

  For point 1, the question needs to be precise and answerable. I'll phrase it around whether REU can extend to imprecise probabilities without new parameters. Point 2 should highlight the gap: existing REU literature avoids imprecise cases. 

  For the method (point 3), breaking it into phases makes sense: literature review, formal extension attempts, and analysis. Emphasize why this is theoretical—empirical study wouldn't address the structural issue. 

  Point 4 must define success (e.g., identifying necessary conditions) and failure (e.g., unavoidable second parameter). Point 5 should acknowledge time constraints; cutting empirical tests or specific extensions keeps focus. 

  Balancing depth and feasibility is key. The user might fear the project is too vague, so concrete steps and clear deliverables are crucial. Also, avoiding jargon while staying precise will help the proposal's readability.
answer: |-
  Here are the five numbered points as requested:

  1.  **The Question:** Can Risk-Weighted Expected Utility (REU) theory be coherently extended to handle imprecise probabilities without introducing a distinct parameter for ambiguity attitude, thereby preserving its core claim that risk attitude alone captures deviations from expected utility maximization?
  2.  **Why Existing Treatments Leave it Open:** Standard REU formulations assume a single, precise probability distribution, making the risk function's application to cumulative probabilities undefined under imprecise probabilities; existing literature largely sidesteps this foundational issue by not addressing imprecise probability sets.
  3.  **The Method:** Month 1-2: Formalize the problem, defining REU over sets of probabilities and identifying failure points. Month 3-6: Systematically explore logical extensions (e.g., applying risk functions within distributions vs. to the set's structure) using formal decision theory tools. Month 7-9: Analyze resulting models for coherence, ambiguity separation, and preservation of REU's core claim. This theoretical approach is necessary to resolve foundational conceptual conflicts, not empirical behavior.
  4.  **Genuine Result & Failure:** Success: Identifying a specific, coherent extension requiring no new ambiguity parameter, or proving its impossibility under defined constraints. Failure: Demonstrating all plausible extensions either collapse into ambiguity models requiring a second parameter, produce inconsistent choices, or fundamentally alter REU's interpretation of risk attitude.
  5.  **Scope & Cuts:** It is potentially tight; the core focus on REU's formal extension to imprecise probabilities is essential. I would cut detailed comparisons to specific alternative ambiguity models (e.g., α-MaxMin, Smooth Ambiguity) beyond essential contrasts, and exclude designing new experimental paradigms for testing.
