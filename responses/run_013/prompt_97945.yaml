          So the procedure gives (500,500).

          What if they have different disagreement points? Suppose the contract is not enforceable? Then the disagreement point might be that they each get nothing (if they fight and the prize is held up). Then D=(0,0). Then:

                  M1 = 1000, M2=1000.

                  The line from (0,0) to (1000,1000). The intersection with the feasible set (which is the line x2=1000-x1) is when:

                          x2 = x1   (because the ray is x2=x1) and x2=1000-x1 -> x1=500, x2=500.

          Again, it's 50-50.

          So the procedure is not sensitive to the feeling that one deserves more. It only considers the disagreement point and the ideal point. If the parties want to account for effort, they must build that into the disagreement point or the ideal point.

          For example, if one party can claim a moral right to more, then the disagreement point might reflect that: if they go to court, the court might award 600 to the one who did more work. Then D=(600,400) [if the court awards 600 to party 1 and 400 to party 2]. Then:

                  M1 = 1000 - 400 = 600   [because party 2 must get at least 400]
                  M2 = 1000 - 600 = 400

                  Then the line from (600,400) to (600,400) is a point -> the only feasible allocation is (600,400).

          So to capture the fairness concern, we must have it reflected in the disagreement point.

          The procedure is only as good as the inputs.

  **What the Procedure Cannot Do:**

          - It cannot account for fairness considerations that are not captured in the disagreement point or the ideal point.

          - It requires that the parties agree on the disagreement point and the total value (or the valuation of items). If they cannot agree, the procedure stalls.

          - It is designed for two parties. For three or more, it might not be monotonic and can produce counterintuitive results.

          - It works best when the feasible set is convex and continuous. In discrete settings, we might have to enumerate many allocations, which can be time-consuming.

          - It assumes that the parties are rational and that their preferences are linear (or that we can represent the outcomes in a linear space). If there are non-linearities (like risk aversion) that we haven't captured, the solution might not be appropriate.

          - It does not account for strategic behavior (like misrepresenting values).

          - In some cases (like the symmetric case with moral deservingness), it may not capture what the mediator feels is fair unless that is built into the disagreement point.

  **Summary of the Procedure for Two Parties:**

          Step 1: Agree on the disagreement point (D = (d1, d2)). If they cannot, the procedure stops.

          Step 2: Agree on the total value (T) and the form of the feasible set. If the division involves multiple assets, we may need to assign values to each asset (by each party) and then the mediator can work with these.

          Step 3: Determine the ideal point for each party:

                  In a simple money split: M1 = T - d2, M2 = T - d1.

                  In a discrete allocation without cash: we must compute M1 and M2 by maximizing over the feasible allocations that are individually rational (if we can enumerate).

                  In an allocation with cash: we find the efficient allocation (maximizing total welfare) and then set M1 = S - d2, M2 = S - d1, where S is the maximum total welfare.

          Step 4: If the feasible set is continuous and convex, the solution is the intersection of the line from D to (M1, M2) with the Pareto frontier. In the discrete case, or with cash, we do:

                  a. List the feasible allocations that are individually rational and Pareto efficient.

                  b. For each, compute:

                        r1 = (x1 - d1) / (M1 - d1)   [if M1==d1, then we cannot compute; we use a different approach?]
                        r2 = (x2 - d2) / (M2 - d2)

                        k = min(r1, r2)

                  c. Choose the allocation with the highest k.

          Step 5: Present the solution. If the solution involves an allocation and cash transfer, compute that.

          Step 6: If the parties reject the solution, we may have to go back to check the inputs, or the procedure fails.

  Given the time constraints in a two-hour session, we might only use the procedure for monetary divisions or simple cases. For complex asset divisions, we might use a simplified version with cash transfers and the efficient allocation.

  **Final Note:** The procedure is based on the Kalai-Smorodinsky bargaining solution. It guarantees that if the feasible set expands in a way that is favorable to one party (without hurting the other's ideal), then that party does not get less. This is a desirable property of monotonicity.

  However, real-world disputes involve emotions and perceptions of fairness that might not be captured by this model. The mediator's role is also to facilitate understanding and voluntary agreement.
answer: |-
  ### **Mediation Procedure Based on Kalai-Smorodinsky Bargaining Solution**  
  This procedure translates game theory into a practical, two-hour session. It uses the **Kalai-Smorodinsky (KS) solution**, which ensures:  
  - **Fairness**: Splits gains proportionally based on "what if" scenarios.  
  - **Monotonicity**: If one side’s options improve, they never end up worse off.  
  - **No risk assessments**: Avoids guessing attitudes toward risk.  

  **Key Concepts Simplified for Parties:**  
  - **"Walk-Away Point" (Disagreement Point)**: What you both get if talks fail.  
  - **"Dream Scenario" (Ideal Point)**: The most you could get if the other side gave you everything feasible.  
  - **Fair Split**: Where a straight line from "Walk-Away" to "Dream Scenario" hits the possible outcomes.  

  ---

  ### **Step-by-Step Procedure**  
  **Time Allocation**: 10-15 min per step. Use a whiteboard to visualize numbers/options.  

  #### **1. Establish the Walk-Away Point (D = [d₁, d₂])**  
  **Question 1**: *"If we walk away empty-handed today, what happens next? Describe the outcome for each of you."*  
  - **Goal**: Define tangible outcomes (e.g., money lost, assets frozen, legal costs).  
  - **Tactics**:  
    - If parties **disagree on consequences**:  
      - *"Let’s list all possible outcomes if no deal is reached."*  
      - Take the **worst-case scenario for each side** (conservative estimate). Example:  
        - Tenant’s walk-away: `d₂ = $0` (no buyout).  
        - Landlord’s walk-away: `d₁ = -$2k` (legal fees).  
    - If outcomes are **uncertain** (e.g., court ruling):  
      - Agree on a **neutral estimate** (e.g., average legal costs, market value).  
  - **Output**: Write down `d₁` and `d₂` on the board.  

  #### **2. Establish the Dream Scenario (M = [m₁, m₂])**  
  **Question 2**: *"If the other side agreed to everything you asked for, what’s the maximum you could realistically get? Be ready to justify it with facts."*  
  - **Goal**: Prevent absurd claims by anchoring to reality.  
  - **Tactics**:  
    - **Challenge inflated claims**:  
      - *"Show me evidence: market data, invoices, or precedents."*  
      - Use an **independent benchmark** (e.g., appraised value, industry standards).  
    - **Example**:  
      - Tenant’s dream: `m₂ = $20k` (based on comparable buyouts).  
      - Landlord’s dream: `m₁ = $15k` (savings from early vacancy).  
  - **Output**: Write down `m₁` and `m₂`.  

  #### **3. Map Feasible Outcomes**  
  **Question 3**: *"What are the actual options? List split proposals, asset divisions, or trades."*  
  - **Goal**: Create a "lumpy" list of outcomes if the feasible set isn’t smooth.  
  - **Tactics**:  
    - **Brainstorm together**: List 5–10 options (e.g., "$5k for tenant, $10k for landlord").  
    - **Exclude unworkable splits**: Remove outcomes where either party gets less than their walk-away point (`x₁ < d₁` or `x₂ < d₂`).  
  - **Output**: Plot options on a graph (Party 1’s gain on X-axis, Party 2’s on Y-axis).  

  #### **4. Draw the Line and Find the Crossing Point**  
  **Action**: Draw a straight line from `D (d₁, d₂)` to `M (m₁, m₂)`.  
  - **Formula**: Calculate the **gain ratio** for each feasible option:  
    ```  
    Gain Ratio₁ = (x₁ - d₁) / (m₁ - d₁)  
    Gain Ratio₂ = (x₂ - d₂) / (m₂ - d₂)  
    ```  
  - **Find the solution**:  
    - For each option, compute the **minimum gain ratio** (i.e., `min(Gain Ratio₁, Gain Ratio₂)`).  
    - The **fairest split** is the option with the **highest minimum gain ratio**.  
  - **Example**:  
    | Option (Tenant, Landlord) | Gain Ratio₁ (Landlord) | Gain Ratio₂ (Tenant) | Min Gain Ratio |  
    |----------------------------|--------------------------|------------------------|-----------------|  
    | ($5k, $10k)                | (10k - (-2k)) / (15k - (-2k)) = 0.71 | (5k - 0) / (20k - 0) = 0.25 | **0.25** |  
    | ($8k, $7k)                 | (7k - (-2k)) / 17k ≈ 0.53 | (8k - 0) / 20k = 0.4  | **0.4**  |  
    | ($10k, $5k)                | (5k - (-2k)) / 17k ≈ 0.41 | (10k - 0)/20k = 0.5   | **0.41** |  
    - **Winning option**: ($10k, $5k) has the highest min ratio (0.41).  

  #### **5. Hand Back to Parties for Value Judgments**  
  **When to stop the procedure**:  
    - If parties **disagree on walk-away/dream points** after evidence, let them debate based on principles.  
    - If **no feasible options** exist (all options violate `d₁` or `d₂`), declare impasse.  
    - If **multiple options tie** for highest min ratio, let parties choose based on non-monetary preferences.  

  **Final Question**: *"Does this split feel reasonably fair given what you both risked and hoped for? If not, what’s missing?"*  

  ---

  ### **Handling Complications**  
  #### **1. Non-Convex or Lumpy Feasible Sets**  
  - **Problem**: Gaps in options (e.g., only whole-asset divisions, no fractions).  
  - **Solution**:  
    - **Add cash transfers**: Turn "lumpy" assets into smooth splits.  
      > *Example: Partner A takes the $10k client list; Partner B takes the $8k equipment. To balance, A pays B $1k in cash.*  
    - **Expand the list**: Brainvest creative hybrids (e.g., payment plans, shared access).  

  #### **2. Contested Walk-Away Point**  
  - **Problem**: Parties dispute consequences of walking away.  
  - **Solution**:  
    - **Use worst-case estimates** (e.g., "Assume court costs you both $3k").  
    - **Split the difference**: Average their estimates if neutral evidence is lacking.  

  #### **3. Three or More Parties**  
  **Problem**: KS struggles with >2 parties (may produce nonsensical results).  
  **Adapted Steps**:  
  1. **Walk-away point**: `D = (d₁, d₂, d₃)` (e.g., equal split of liquidation value).  
  2. **Dream scenario**: Each party’s maximum if others concede everything feasible.  
  3. **Feasible splits**: List joint allocations (e.g., "A gets X, B gets Y, C gets Z").  
  4. **Gain ratios**: For each option and party, compute:  
     ```  
     Gain Ratio_i = (x_i - d_i) / (m_i - d_i)  
     ```  
  5. **Solution**: Pick the option with the **highest minimum gain ratio** across all parties.  
     - ⚠️ **Limitation**: May ignore coalitions (e.g., A+B gang up on C). If instability arises, revert to pairwise mediation.  

  ---

  ### **Case Walkthroughs**  
  #### **Case 1: Landlord & Tenant Dividing a Lease Buyout**  
  - **Context**: Landlord wants tenant to leave early; tenant wants compensation.  
  - **Walk-Away Point**:  
    - Tenant (`d₂`): $0 (no compensation).  
    - Landlord (`d₁`): -$3k (vacancy + legal costs).  
  - **Dream Scenario**:  
    - Tenant (`m₂`): $15k (based on 6 months' rent).  
    - Landlord (`m₁`): $12k (savings from new tenant).  
  - **Feasible Options**:  
    - Option 1: Tenant $5k, Landlord $7k  
    - Option 2: Tenant $8k, Landlord $4k  
    - Option 3: Tenant $10k, Landlord $2k  
  - **KS Calculation** (Line from `[-3k, $0]` to `[$12k, $15k]`):  
    | Option        | Gain Ratio (Landlord) | Gain Ratio (Tenant) | Min Ratio |  
    |---------------|------------------------|----------------------|-----------|  
    | ($7k, $5k)    | (7k - (-3k)) / (12k - (-3k)) = 0.67 | (5k - 0)/(15k - 0) = 0.33 | **0.33** |  
    | ($4k, $8k)    | (4k - (-3k))/15k ≈ 0.47 | (8k/15k) ≈ 0.53     | **0.47** |  
    | ($2k, $10k)   | (2k - (-3k))/15k ≈ 0.33 | (10k/15k) ≈ 0.67    | **0.33** |  
  - **Solution**: Option 2 (Tenant $8k, Landlord $4k) has the highest min ratio (0.47).  

  #### **Case 2: Business Partners Dividing Clients and Equipment**  
  - **Context**: Partners A and B split a client list (worth $20k to A, $15k to B) and equipment (worth $10k to both).  
  - **Walk-Away Point**:  
    - `d₁ = d₂ = $15k` (if liquidated, 50% after fees).  
  - **Dream Scenario**:  
    - A (`m₁`): $30k (all assets at A’s valuation).  
    - B (`m₂`): $25k (all assets at B’s valuation).  
  - **Feasible Options** (with cash transfers):  
    - Option 1: A takes clients ($20k), B takes equipment ($10k). Cash: A pays B $5k.  
      - A: $20k - $5k = $15k  
      - B: $10k + $5k = $15k  
    - Option 2: B takes clients ($15k), A takes equipment ($10k). Cash: B pays A $2.5k.  
      - A: $10k + $2.5k = $12.5k  
      - B: $15k - $2.5k = $12.5k  
    - Option 3: Sell clients, split cash ($17.5k each).  
  - **KS Calculation** (Line from `[$15k, $15k]` to `[$30k, $25k]`):  
    | Option        | Gain Ratio (A)    | Gain Ratio (B)    | Min Ratio |  
    |---------------|-------------------|-------------------|-----------|  
    | ($15k, $15k)  | (15k-15k)/(30k-15k)=0 | (15k-15k)/(25k-15k)=0 | **0**    |  
    | ($12.5k, $12.5k)| (12.5k-15k)/15k = -0.17 (invalid) | — | — |  
    | ($17.5k, $17.5k)| (17.5k-15k)/15k ≈ 0.17 | (17.5k-15k)/10k = 0.25 | **0.17** |  
  - **Solution**: Option 1 or 3. Since Option 1 gives $15k to both (min ratio = 0), but Option 3 is better (min ratio = 0.17). **Recommend Option 3**.  

  #### **Case 3: Symmetric but "Unfair" Case (Testing Sensitivity)**  
  - **Context**: Twins jointly inherit $100k. Both walk away with $50k if they fail. Twin A claims they deserve 60% for caring for the parent.  
  - **Walk-Away Point**: `d₁ = d₂ = $50k` (equal legal split).  
  - **Dream Scenario**: `m₁ = m₂ = $100k` (if the other concedes everything).  
  - **Feasible Options**: Any split where $x + $y = $100k.  
  - **KS Calculation**:  
    - Line from `[$50k, $50k]` to `[$100k, $100k]` has slope 1.  
    - Crosses feasible set at ($50k, $50k) → **equal split**.  
  - **Why KS "Fails"**:  
    - KS only considers formal symmetry (equal walk-away/dream points). It ignores moral claims.  
    - **Mediator’s role**: If A insists on $60k, ask for evidence (e.g., caregiving logs). If provided, adjust walk-away point:  
      - New `d₁`: $60k (if A can prove legal entitlement).  
      - New `d₂`: $40k (B’s minimum).  
      - KS then splits gains proportionally, giving A $60k + 50% of surplus.  

  ---

  ### **What the Procedure Cannot Do**  
  1. **Resolve deep value conflicts**:  
     - If parties fundamentally disagree on what’s "fair" (e.g., "equal split" vs. "merit-based"), KS defers to their walk-away/dream points. The mediator must reframe the debate.  
  2. **Handle strategic lying**:  
     - Assumes honest input. If parties misrepresent walk-away/dream points, outcomes skew. Use evidence to mitigate.  
  3. **Guarantee Pareto efficiency in complex trades**:  
     - In lumpy asset divisions, KS may miss optimal trades. Supplement with brainstorming.  
  4. **Scale beyond 3 parties**:  
     - For >3 parties, gains may be imbalanced due to shifting coalitions. Use subgroups or hybrid methods.  
  5. **Replace human judgment**:  
     - KS is arithmetic, not empathetic. If a split "feels" wrong (e.g., one side’s effort ignored), return to principle-based negotiation.  

  **Final Tip**: Always phrase KS as a "starting point" for discussion, not a verdict. This preserves goodwill and ownership.  

  > "This method doesn’t create fairness—it reveals what fairness looks like when both sides confront what they stand to lose and gain." — Adapted from game theory principles.
