prompt: |-
  I'm a second-year politics student and I've somehow ended up running the sex-work session for our policy society's debate night, and it's doing my head in because everyone in the group just talks past each other. Half of them say 'the Nordic model' or 'like Germany' or 'like New Zealand' as if those are three flavours of the same thing, and I've realised none of us can actually say what the disagreement is — what you'd have to believe about sex work to end up endorsing one of them rather than another. So what I want from you is a proper decision tree or taxonomy I can hand round, built out of the logical space first and only then from the labels. Start with the branch questions — the ones that genuinely split the positions — and phrase each one so a reader can answer it without already knowing which camp it puts them in, so no node that just asks 'do you support the Nordic model?'. I'm thinking along the lines of whether the sale of sex is inherently harmful or only harmful under certain conditions; whether the person selling is best understood as a worker or as a victim of coercion; whether the criminal law should aim at the seller, the buyer, the third parties, or nobody at all; and whether the goal is abolition of the trade, harm reduction inside it, or full recognition and normalisation — but use your own judgement about which questions really do the separating and drop any that turn out to be doing no work. Aim for maybe five or six branch questions and no more than eight or nine leaves.

  Then put the actual positions at the leaves — buyer-only criminalisation, full legalisation with regulation, decriminalisation, plain criminalisation on both sides, and anything else that falls out — each with a one-line statement of its most awkward commitment, i.e. the case it has the hardest time explaining. I'd like you to flag any combinations of answers that nobody seems to occupy, and say whether that's because the view is incoherent, just unattractive, or simply unexplored; and flag any two positions the tree can't pull apart rather than papering over it. It'd help alot if you made it bite on a few concrete cases instead of staying abstract — say a migrant worker with no papers, someone who says they'd stop tomorrow if the money weren't so good, a regular client with a disability, and street-based versus indoor work — and told me which branch each case actually tests, and where the tree forces you to a leaf you might not like. The audience is smart undergrads who don't know the literature, so keep the jargon light but don't dumb the distinctions down. British English please, and don't worry about length — I'd rather it be too detailed than too thin.
reasoning: |-
  Okay, the user is a second-year politics student running a debate session on sex work policy. They're frustrated because participants are throwing around terms like "Nordic model" or "German system" without understanding the fundamental differences. They need a clear decision tree that starts from first principles, not pre-packaged labels.

  Hmm, the key here is identifying the actual philosophical and practical divides that lead to different policy positions. The user wants branch questions that force people to confront their underlying assumptions - questions they can answer without knowing which "camp" it puts them in. 

  First major split seems to be about the nature of sex work itself: is it inherently harmful or circumstantially harmful? This isn't just academic - if you see it as inherently degrading, you'll likely support abolitionist approaches. If you see harm coming from external factors like stigma or unsafe conditions, you'll lean toward harm reduction. 

  Next natural branch is agency: do we prioritize seeing sex workers as victims needing rescue or as workers with autonomy? This directly impacts whether we criminalize them or protect their rights. Then we've got the criminalization question - but it's not binary. We need separate nodes for criminalizing buyers, sellers, and third parties because these represent meaningfully different approaches. 

  The regulation vs. non-regulation fork is crucial too - some models want state oversight of brothels and health checks, others see that as oppressive. And finally, the "end goal" question reveals whether someone ultimately wants the industry gone or normalized. 

  Interesting that no major position emerges where you criminalize both buyers and sellers while aiming for normalization - that would be incoherent. Also notable that "full legalization with regulation" struggles most with migrant workers - the system often excludes them from protections while still penalizing them. 

  For concrete cases: the migrant worker tests whether a model genuinely protects vulnerable people; the worker who'd quit if not for money questions whether we see coercion narrowly or broadly; the disabled client challenges models that criminalize purchase; and the street/indoor split reveals if a policy actually reduces harm or just pushes it elsewhere. 

  The tree forces uncomfortable conclusions - like how decriminalization might leave third parties unregulated, or how Nordic model effectively outsources harm to buyers. That's good - it shows the real trade-offs in policy making. 

  Should avoid jargon like "neo-abolitionism" - stick to descriptive terms. British English means "kerb-crawling" not "curb-crawling". Length isn't an issue as long as it's structured clearly with the decision tree upfront. 

  The awkward commitments section is vital - every position has its weak spot, and naming them prevents facile debates. The migrant case is particularly damning for systems that claim to be worker-friendly while excluding undocumented people. 

  User's clearly done some thinking already with their suggested angles (harm nature, agency framing etc.), so the framework should build on that but refine it. The "unexplored" positions note might spark interesting discussion - like why nobody advocates criminalizing sellers while normalizing the trade. 

  Biggest challenge is distilling without oversimplifying - hence the five-fork structure covering harm ontology, agency, legal targets, regulation philosophy, and end goals. Each fork slices the debate space cleanly.
answer: |-
  Here’s a decision tree and taxonomy designed to cut through the slogans and expose the core disagreements. It starts with foundational questions, branches into coherent policy positions, and forces trade-offs using concrete cases. 

  **Core Branch Questions**  
  *(Answer these without referencing existing models)*  

  1.  **Is the *act* of selling/buying sex inherently harmful (due to intimacy, commodification, etc.), or is harm caused *only* by external factors (violence, stigma, exploitation, unsafe conditions)?**
      *   *Inherently Harmful* → Go to Q2
      *   *Externally Harmful* → Go to Q3

  2.  **(If inherently harmful) Is the primary harm experienced by the seller, the buyer, or society?**
      *   *Primarily the Seller* → Go to Q4
      *   *Primarily the Buyer/Society* → Go to Q5 (This path leads to niche views)

  3.  **(If externally harmful) Do sex workers primarily need protection *as workers* or rescue *as victims*?**
      *   *As Workers* (Agency/Choice) → Go to Q6
      *   *As Victims* (Coercion/Exploitation) → Go to Q7

  4.  **(If harm primarily to seller) Should the seller be criminalised to deter them/protect them?**
      *   *Yes* → **Position A**
      *   *No* → **Position B**

  5.  **(If harm primarily to buyer/society - niche) Should buying be criminalised to protect buyers/society?**
      *   *Yes* → **Position C** (Very rare)
      *   *No* → Logical inconsistency or **Position A/B** (if selling still criminalised)

  6.  **(If workers needing protection) Should the industry be regulated like other work?**
      *   *Yes* (Licensing, brothels, health checks) → **Position D**
      *   *No* (Avoid state control/barriers) → **Position E**

  7.  **(If victims needing rescue) Should buying sex be criminalised to reduce demand?**
      *   *Yes* → **Position F**
      *   *No* → Go to Q8 (Leads to inconsistency or **Position A**)

  8.  **(If victims, but buying not criminalised) Should selling be criminalised?**
      *   *Yes* → **Position A** (Full Criminalisation)
      *   *No* → **Position G** (Incoherent or **Position E** if view shifts)

  **Resulting Policy Positions (Leaves)**

  *   **Position A: Full Criminalisation (Selling & Buying)**
      *   *Core Belief:* Selling sex is inherently harmful/immoral; criminalisation deters participation and protects society/morality.
      *   *Awkward Commitment:* Makes vulnerable sellers (e.g., migrant workers, street-based workers) criminals, pushing them further underground and increasing danger. Ignores those who express agency.
      *   *Concrete Case Test:* **Migrant Worker (no papers)** - Directly criminalised, terrified to report violence/exploitation to police. **Street-based work** - Heavily targeted by police, high risk of violence.

  *   **Position B: Neo-Abolitionism (Criminalise Buying Only - "Nordic Model")**
      *   *Core Belief:* Selling sex is inherent harm/exploitation *to the seller*; buyers cause this harm; sellers are victims needing support/exit, not punishment.
      *   *Awkward Commitment:* While sellers aren't criminals, the trade is still driven underground. Sellers face *increased* difficulty screening clients/negotiating safely due to buyer fear. Doesn't eliminate demand, displaces it.
      *   *Concrete Case Test:* **Regular Client (disability)** - Criminalised for purchasing, potentially cutting off a source of intimacy/support. **"Would stop if money wasn't good" worker** - Still faces stigma, difficulty accessing mainstream work/support, and potentially unsafe conditions without full decrim normalisation.

  *   **Position C: Paternalistic Criminalisation (Criminalise Buying Only to Protect Buyers - *Niche*)**
      *   *Core Belief:* Buying sex is inherently harmful *to the buyer* (morally corrupting, risky) or to society (undermining relationships); sellers may be immoral but are secondary.
      *   *Awkward Commitment:* Ignores or downplays harm to sellers. Prioritises protecting buyers/clients over the safety and rights of sellers.
      *   *Concrete Case Test:* **Regular Client (disability)** - The policy explicitly targets *them* as needing "protection" from their own choices. **Migrant Worker** - Harm to them is irrelevant to the policy's core aim.

  *   **Position D: Legalisation & Regulation (Germany, Netherlands model)**
      *   *Core Belief:* Sex work is work; harm comes from stigma and lack of regulation. State oversight (brothel licensing, mandatory health checks, contracts) reduces harm and integrates workers.
      *   *Awkward Commitment:* Creates a two-tier system: regulated/legal workers vs. illegal/unregulated workers (e.g., migrants, street workers, independents avoiding bureaucracy). Regulations can be burdensome, exclusionary, and replicate state control/paternalism. Mandatory health checks violate bodily autonomy.
      *   *Concrete Case Test:* **Migrant Worker (no papers)** - Excluded from legal system, remains criminalised/vulnerable. **Street-based work** - Often remains illegal or heavily restricted, pushing workers away from support/regulation. **"Would stop if money wasn't good"** - Must comply with state regulations to work legally.

  *   **Position E: Full Decriminalisation (New Zealand model)**
      *   *Core Belief:* Sex work is work; harm comes from criminalisation, stigma, and lack of rights. Removing *all* criminal penalties and treating it as work under existing law (labour, health & safety, contract) is safest. Minimal state intervention.
      *   *Awkward Commitment:* Doesn't actively dismantle stigma or address complex exploitation/coercion within legal frameworks. Third parties (managers, agencies) operate in a grey area - are they employers (protected) or exploiters?
      *   *Concrete Case Test:* **Migrant Worker (no papers)** - Not criminalised *for sex work*, but still vulnerable due to immigration status (needs separate immigration reform). **Street-based work** - Decriminalised, can organise for safety without fear of arrest. **Third Parties** - Distinguishing supportive managers from exploitative pimps relies on existing (often inadequate) labour/coercion laws.

  *   **Position F: Asymmetrical Criminalisation / Neo-Abolitionism (Same as B - Nordic Model)**
      *   *(This is the same as Position B reached via the "Victim/Rescue" path in Q7).*

  **Unoccupied/Problematic Combinations & Why:**

  1.  **Harm Inherent to Seller + Seller NOT Criminalised + Buyer Criminalised:** This *is* occupied - it's **Position B/F (Nordic Model)**. (Q1 Inherent → Q2 Harm Seller → Q4 No → Position B).
  2.  **Harm Inherent Primarily to Buyer/Society + Buyer NOT Criminalised:** (Q1 Inherent → Q2 Harm Buyer/Soc → Q5 No). This is logically inconsistent *if* you believe buying is inherently harmful but shouldn't be criminalised. Might lead back to criminalising sellers (**A**) or, illogically, doing nothing. Rarely advocated.
  3.  **Harm Externally + Victims + Buying NOT Criminalised + Selling NOT Criminalised:** (Q1 External → Q3 Victims → Q7 No → Q8 No → Position G). This is incoherent. If sellers are victims *because* of the inherent nature of the act (implied by "Victims needing rescue"), but you criminalise *neither* the act nor the purchase, you have no mechanism to "rescue" them or reduce harm. It collapses into either shifting to viewing them as workers (**Position E/D**) or accepting criminalisation (**A**).
  4.  **Harm Externally + Workers + Industry Regulation:** This *is* occupied - **Position D (Legalisation)**. (Q1 External → Q3 Workers → Q6 Yes).
  5.  **Harm Externally + Workers + NO Industry Regulation:** This *is* occupied - **Position E (Decriminalisation)**. (Q1 External → Q3 Workers → Q6 No).

  **Positions the Tree Struggles to Separate:**  
  The tree cleanly separates the main models based on core beliefs. The main blur is between strict **Position E (Decrim)** and **Position D (Legalisation)**. The key differentiator is Q6: *Should the industry be regulated like other work?* Advocates for **E** see specific regulations (licensing, mandatory health checks) as harmful state overreach replicating stigma and barriers. Advocates for **D** see them as essential worker protections. The tree forces this choice based on whether you think *industry-specific* regulation is necessary or harmful.

  **How Concrete Cases Test Branches:**

  1.  **Migrant Worker (No Papers):**
      *   **Tests:** Primarily Q3 (Worker vs Victim) and Q6 (Regulation vs Non-Regulation).
      *   **Why:** Positions seeing them as **Workers (E/D)** offer direct protection *if* they can access the system (D often excludes them via regulations, E doesn't criminalise them). Positions seeing them as **Victims (B/F)** offer support but the criminalised environment still makes them vulnerable. **Position A** directly harms them.
      *   **Forces Choice:** Highlights the exclusionary nature of **D** and the limitations of **B/F** in truly protecting the most vulnerable without full decrim/normalisation.

  2.  **Worker: "Would stop tomorrow if money weren't so good":**
      *   **Tests:** Primarily Q1 (Inherent vs External Harm) and Q3 (Worker vs Victim).
      *   **Why:** Positions based on **Inherent Harm/Victim (B/F)** see this as proof of exploitation/coercion by circumstance. Positions based on **External Harm/Worker (D/E)** see this as a standard economic choice faced in many precarious jobs; the solution is better labour rights/alternative options, not abolishing the work itself.
      *   **Forces Choice:** Challenges **D/E** to address economic coercion without resorting to abolition. Challenges **B/F** to explain why this worker's agency in choosing the "least bad" option isn't respected.

  3.  **Regular Client (Disability):**
      *   **Tests:** Primarily Q2 (Who is Harmed?) and Q7 (Criminalise Buying?).
      *   **Why:** **Positions criminalising buying (B/F, C)** directly target and harm this client, potentially cutting off a source of connection/intimacy. **Positions not criminalising buying (A, D, E)** avoid this direct harm but **A** criminalises the seller they rely on. **D/E** offer frameworks for safer interactions.
      *   **Forces Choice:** Highlights the potential cruelty of demand-criminalisation (**B/F**) towards vulnerable buyers and challenges the "buyer=exploiter" narrative. Tests the consistency of **C** (if it exists).

  4.  **Street-Based vs. Indoor Work:**
      *   **Tests:** Q6 (Regulation vs Non-Regulation) and overall approach to criminalisation (Q4, Q7, Q8).
      *   **Why:** **Full Criminalisation (A)** targets both equally. **Nordic Model (B/F)** often pushes work indoors or makes street work harder/more dangerous without eliminating it. **Legalisation (D)** often heavily restricts or bans street work, pushing workers into potentially exploitative brothels or illegality. **Decriminalisation (E)** treats location neutrally under planning/zoning laws like other businesses, offering the most flexibility and safety options for street workers.
      *   **Forces Choice:** Reveals if a policy genuinely reduces harm for *all* workers or just pushes the most visible/marginalised forms (street work) further into danger and illegality. Tests the commitment of **D** to worker autonomy and of **B/F** to truly supporting *all* sellers.

  This framework forces participants to grapple with the underlying values and empirical beliefs driving policy choices, making it clearer why "like New Zealand" and "like Sweden" are fundamentally different answers to different questions. The awkward commitments highlight the inescapable trade-offs inherent in any policy approach.
