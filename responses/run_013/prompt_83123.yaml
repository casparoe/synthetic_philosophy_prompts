answer: |-
  ## Strand Script (A Typogenetics Pantoum)

  **Stanza 1**  
  A strand of letters, cold and mute,  
  A sequence holding unseen might.  
  Instructions written to compute  
  The enzyme forming in the light.  

  **Stanza 2**  
  A sequence holding unseen might  
  Is read; the ribosome obeys.  
  The enzyme forming in the light  
  Now scans the strand in complex ways.  

  **Stanza 3**  
  Is read; the ribosome obeys,  
  Translates the code to active deed.  
  Now scans the strand in complex ways,  
  A tool fulfilling its own creed.  

  **Stanza 4**  
  Translates the code to active deed:  
  **"CUT the strand precisely here."**  
  A tool fulfilling its own creed  
  Replicates, dispelling fear?  

  **Stanza 5**  
  **"CUT the strand precisely here."**  
  Instructions written to compute  
  Replicate, dispelling fear?  
  **A strand of letters, cold and mute.**  

  ---

  **How this meets your specs:**

  1.  **Repetition as Replication:** The pantoum's strict repetition mirrors the copying process. Lines cycle back, transformed by context, like the strand being both data and program.
  2.  **Meaning Shift:** The line **"CUT the strand precisely here."** first appears (Stanza 4) as the *instruction being executed* by the enzyme. When it returns as the first line of Stanza 5, it resonates more as the *original coded command within the strand itself* – the description becoming the action.
  3.  **Accuracy (GEB Reader Approved):**
      *   Strands (ACGT), ribosome translation, enzymes as tools.
      *   Enzyme "scans" and performs operations (explicitly "CUT" as an example).
      *   Self-replication driven by the enzyme coded *by* the strand operating *on* the strand.
      *   No "self" needed, just the description → enzyme → copy loop ("fixed point").
  4.  **Clarity (Newbie Understands):**
      *   Strand = inert data/code.
      *   Ribosome reads code → builds enzyme.
      *   Enzyme acts like a tool on the strand.
      *   Specific action shown: cutting (implying copying/replication follows).
      *   The loop closes: strand makes tool that copies strand.
  5.  **No Tidy Uplift:** The ending loops back coldly to "A strand of letters, cold and mute." The replication happens ("Replicate"), but it's mechanistic, almost eerie ("dispelling fear?" questioned). The final line emphasizes the paradox: inert code becomes active replicator. The "strange loop" *is* the closure.
  6.  **The Closing Loop:** The final stanza explicitly uses the first stanza's lines 3 and 4 as its lines 2 and 4, and its own line 4 is the *first* line of the entire poem. This forces the poem to cycle back perfectly to the beginning, enacting the self-replication loop. It doesn't resolve; it just *is*, like the fixed point.
