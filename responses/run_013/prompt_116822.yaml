answer: |-
  Your query cuts to the heart of Descartes' epistemological revolution. Let's reconstruct the *Meditations* passage strictly, separating entailment from later interpretation:

  ### 1. **What the Text Strictly Entails**  
     - **Indubitability attaches to the *act* of thinking.**  
       The certainty arises *only* when "I am, I exist" is actively "expressed or conceived." The "pronunciatum" (uttered proposition) marks it as a performative act: *in the very act of doubting or asserting*, the existence of the doubter/asserter is indubitable. It is not a timeless logical truth (like "2+2=4") but an *episodic certainty* triggered by the occurrence of thought.  

     - **It proves: "Whenever there is thinking, there is a subject *of that thought*."**  
       The "I" is the bare subject required for the occurrent thought. At minimum, it is a *logical subject* (not necessarily a substance). The clause "each time it is expressed" confirms this is episodic: certainty lasts only as long as the act of thinking. *Between thoughts, no existence is proved here.*  

     - **The core argument is a *performative contradiction*:**  
       To doubt "I exist" requires a thinker to perform the doubt. Even deception ("I am deceived") presupposes a deceived subject. The phrase "so long as I shall be conscious that I am something" reinforces that consciousness *in the act* is necessary.  

  ### 2. **What It Does *Not* Entail (in this Passage)**  
     - **No persisting substance.**  
       The episodic certainty ("each time") does not prove a continuous self. Descartes *later* argues for an enduring thinking substance (*res cogitans*), but that relies on God's guarantee (Third Meditation) and conceptual analysis ("I conceive myself as a thinking thing that persists"). *This passage alone proves only momentary existence tied to the present thought.*  

     - **No metaphysical characterization of the "I".**  
       The "I" is not proven as:  
       - A *substance* (that requires additional premises).  
       - A "thing" in a robust sense (beyond being the subject of the current thought).  
       - A soul or immaterial entity.  
       It is minimally: **the subject necessarily implicated in the present act of thinking.**  

     - **No timeless truth.**  
       "I exist" is not certain when unthought. The certainty is parasitic on the occurrence of thought.  

  ### 3. **Status of the "I"**  
     - **Grammatical subject, not (yet) metaphysical substance.**  
       The "I" is the unavoidable grammatical subject of "I think" or "I am deceived." Descartes takes this as reflecting a real subject-predicate structure, but critics (e.g., Nietzsche, Wittgenstein) later argue it could be a grammatical illusion.  
     - **The "I" = the thinking event itself?**  
       *Almost.* The passage entails that *thinking is occurring*, and that this thought requires a subject. But Descartes resists reducing the "I" to the thought; he insists the subject is *distinct from* its acts ("I am not merely a collection of thoughts"). However, *this argument alone* does not refute bundle theories (e.g., Hume).  

  ### 4. Role of Deception and Consciousness  
     - **Deception**: Demonstrates that *even false thoughts* imply a thinker. The more radical the doubt (e.g., an evil demon deceiving me), the more it confirms the existence of the deceived subject.  
     - **Consciousness**: "So long as I shall be conscious" ties existence to *reflective awareness* of thinking. But note: this presupposes that consciousness entails a conscious subject—a point Kant later critiques as the "Paralogism of Pure Reason."  

  ### 5. **What the Cogito Proves: Three Layers**  
     | **Layer**               | **Proven**                                                                 | **Not Proven**                                     |  
     |--------------------------|----------------------------------------------------------------------------|---------------------------------------------------|  
     | **Performative**         | It is impossible to coherently doubt while thinking.                       | Any facts about the thinker beyond current thought. |  
     | **Existential**          | Whenever thinking occurs, a thinker exists *at that moment*.               | That the thinker persists or is a substance.       |  
     | **Epistemological**      | Conscious thought provides indubitable evidence of the thinker's existence. | That the thinker is correctly characterized as "I".|  

  ### Philosophical Tensions in Your Query  
  - **"Proving a substance"**: You rightly suspect this is not in the *cogito* itself. Descartes *infers* substance from the persistence of the "I" across thoughts, but that requires additional argument (and divine guarantee). The passage proves only *subject-instantiation*.  
  - **Order of discovery vs. metaphysics**: The *cogito* is first-personal and performative (order of discovery). It does not resolve whether thought metaphysically depends on a substance (Hume) or vice versa (idealism).  
  - **"Continuous conscious subject"**: The passage *presupposes* a subject for the current thought, but does not *prove* continuity. Descartes' phrase "so long as I shall be conscious" subtly smuggles in duration—a vulnerability exploited by critics.  

  ### Self-Critical Assessment  
  Descartes' language ("I," "consciousness") *suggests* a substantial, enduring self, but the logical core of the *cogito* is thinner:  
  - **Strong claim**: The reality of thought implies a thinker *for that thought*.  
  - **Weak claim**: The "I" is a placeholder for the subject of the current mental act—possibly identical to the act itself.  

  The *cogito* is most defensible as a proof against solipsistic doubt: *Thought is occurring, and this thought cannot be "ownerless."* All further conclusions (substance, persistence, immateriality) require contentious metaphysical additions. Your focus on the episodic, performative nature is astute—it reveals the gap between Descartes' rhetorical "I" and his minimal proof.
