       - Purpose = A/B → Sharp line? **No** → Criterion possible? **Yes** → Unit = **A** (hypothesis) → **Leaf 4 (Bayesian)**.  
     - **Strain:** Bayesianism accepts untestable theories as "scientific" if priors >0, straining intuitions that science requires empirical risk. Kuhn (Unit C) might fit better but the tree forces Unit A here.  

  3. **Non-testable claim with explanatory appeal** (e.g., some theologies)  
