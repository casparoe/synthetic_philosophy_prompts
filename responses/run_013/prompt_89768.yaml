       - Purpose = A/B → Sharp line? **Yes** → Unit = **A** (hypothesis) → Failure refutes? **No** → **Gap 2** (incoherent).  
     - **Strain:** Naive falsificationism (Failure? Yes) would call it unscientific, but the tree routes Unit A + No-refutation to a gap. Sophisticated falsificationism (Unit B) could salvage it, but the unit doesn’t match.  

  ---

  ### Leaf Collapse Note  
  The tree **separates naive and sophisticated falsificationism** via unit of analysis (hypothesis vs. programme) and response to failure. They do not collapse:  
  - Naive: Focuses on falsifiability of single hypotheses.  
  - Sophisticated: Focuses on programme progress (novel predictions) over time.  

