  ### Demarcation Problem Decision Tree

  **Instructions:** Answer each question based on your philosophical intuitions. Proceed down the tree until you reach a leaf (a position on the demarcation problem). Each leaf includes one sentence on its most awkward commitment.

  ---

  #### **Node 1: What is the primary purpose of demarcation?**  
  - **A.** To describe what science *is* (its nature).  
  - **B.** To prescribe how science *should be done* (methodology).  
  - **C.** To decide what gets *taught in schools* or *funded by institutions* (practical governance).  

  → If **C**, go to **Leaf 5: Institutional/Legal Checklist**.  
  → If **A** or **B**, go to Node 2.  

  ---

  #### **Node 2: Should we expect a sharp line (yes/no) between science and non-science?**  
  - **Yes.** Science and non-science are categorically distinct.  
  - **No.** Demarcation is a matter of degree or context.  

  → If **Yes**, go to Node 3.  
  → If **No**, go to Node 4.  

  ---

  #### **Node 3 (Sharp line): What is the unit of analysis?**  
  - **A.** A single hypothesis or theory.  
  - **B.** A research programme (series of theories, methods, goals).  
  - **C.** A field/discipline.  
  - **D.** Conduct of a scientist.  

  → If **A**, go to Node 5.  
  → If **B**, go to Node 6.  
  → If **C** or **D**, go to **Gap 1** (unexplored).  

  ---

  #### **Node 4 (No sharp line): Is a demarcation criterion possible?**  
  - **Yes.** We can define science (even if graded).  
  - **No.** The problem is illusory or intractable.  

  → If **No**, go to **Leaf 6: Pseudo-Problem**.  
  → If **Yes**, go to Node 3.  

  ---

  #### **Node 5 (Unit = Single Hypothesis): When a prediction fails, does it refute the theory?**  
  - **Yes.** Failure directly undermines the theory.  
  - **No.** Failure only refutes auxiliary assumptions (e.g., instruments, background conditions).  

  → If **Yes**, go to **Leaf 1: Naive Falsificationism**.  
  → If **No**, go to **Gap 2** (incoherent).  

  ---

  #### **Node 6 (Unit = Research Programme): When a prediction fails, does it refute the whole programme?**  
  - **Yes.** Failure forces abandonment of the programme.  
  - **No.** Programmes can adapt (e.g., modify auxiliaries).  

  → If **No**, go to **Leaf 2: Sophisticated Falsificationism**.  
  → If **Yes**, go to **Gap 3** (unattractive).  

  ---

  ### Leaves (Positions)  
  1. **Naive Falsificationism** (Popper)  
     - *Most awkward commitment:* Ignores how theories are always tested with auxiliary assumptions, making science hyper-vulnerable to false negatives (e.g., dismissing Newtonian physics due to minor anomalies).  
  2. **Sophisticated Falsificationism** (Lakatos)  
     - *Most awkward commitment:* Allows degenerating programmes (e.g., Marxism) to persist indefinitely as "science" if they keep tweaking auxiliaries.  
  3. **Paradigm-Based Kuhnian Account** (Kuhn)  
     - *Most awkward commitment:* Renders paradigm shifts (e.g., Einsteinian vs. Newtonian physics) irrational, lacking objective standards for theory choice.  
  4. **Bayesian Degrees-of-Credence Account**  
     - *Most awkward commitment:* Requires subjective prior probabilities, risking arbitrary demarcation (e.g., two scientists disagreeing on whether astrology is "scientific" due to differing priors).  
  5. **Institutional/Legal Checklist**  
     - *Most awkward commitment:* Reduces science to bureaucratic criteria (e.g., peer review, testability), ignoring historical cases like Galileo working outside institutions.  
  6. **Pseudo-Problem** (Feyerabend, Wittgensteinians)  
     - *Most awkward commitment:* Cannot explain why demarcation debates (e.g., teaching creationism in schools) matter socially or epistemically.  

  ---

  ### Gaps (Unoccupied Combinations)  
  - **Gap 1 (Sharp line + Unit = Field/Scientist):** Unexplored. No major theory uses these units for sharp demarcation, likely because fields are too broad and conduct is too subjective.  
  - **Gap 2 (Sharp line + Unit = Hypothesis + Failure ≠ Theory):** Incoherent. If single hypotheses are the unit and failures don’t refute them, demarcation collapses (no way to reject anything).  
  - **Gap 3 (Sharp line + Unit = Programme + Failure = Refute):** Unattractive. Would kill programmes over one failure (e.g., abandoning genetics if one experiment fails), stifling science.  
  - **Gap 4 (No sharp line + Unit = Programme):** Unexplored. No well-known account combines gradational demarcation with research programmes.  

  ---

  ### Testing the Tree: Where It Strains  
  1. **Natal-chart astrology**  
     - **Path:**  
       - Purpose = A/B (describe/prescribe) → Sharp line? **Yes** → Unit = **C** (field) → **Gap 1**.  
     - **Strain:** The tree lacks tools to handle fields as units under sharp demarcation. Institutional checklist (Purpose C) avoids this but dodges philosophical questions.  
     - **Leaf assigned if forced:** Institutional checklist (if Purpose C), else unresolved.  

  2. **Mathematically elegant untestable theory** (e.g., string theory)  
