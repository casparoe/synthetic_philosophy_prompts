answer: |-
  Here's a concrete case that forces the distinction and favors the "systemic role" story:

  **The Case:** The lowercase letter **`ɑ`** (Latin script single-story "a") vs. the lowercase letter **`α`** (Greek alpha).

  **The Physical Feature Story (Intrinsic Shape):**
  *   Look at the shape. Both characters are visually identical: a single closed loop with a rightward-curving tail extending down and to the right. There is *no inherent, objective feature* within the glyph itself that distinguishes them. If you pointed to the shape in isolation, you couldn't definitively say it was an "a" or an "alpha" based solely on its form.

  **The Systemic Role Story (Position in the Alphabet):**
  *   **Context A (Latin Alphabet):** When this shape `ɑ` appears within a sequence of Latin letters (e.g., "cɑt"), it functions as the letter "a". It represents the /æ/ or /ɑː/ sound. Its identity as "a" is defined by its relationship to the surrounding letters ('c' and 't') and its specific role within the *Latin* writing system. It *is* an "a" here.
  *   **Context B (Greek Alphabet):** When the *identical* shape `α` appears within a sequence of Greek letters (e.g., "αβγ" - alpha, beta, gamma), it functions as the letter "alpha". It represents the vowel sound /a/. Its identity is defined by its relationship to beta (`β`), gamma (`γ`), and its role within the *Greek* writing system. It is *not* an "a" here; it's an alpha.

  **The Verdict & Why it Favors Systemic Role:**
  *   **Different Verdict:** The intrinsic feature story gives the *same* verdict for both contexts: "This shape could be an 'a' or an alpha." It cannot definitively assign identity based on the shape alone. The systemic role story gives *different* verdicts: "It *is* an 'a'" in Latin context A, and "It is *not* an 'a'" (it's an alpha) in Greek context B.
  *   **Which Story Wins?** This case strongly favors the **systemic role story**. The *only* factor determining whether the shape is an "a" is its function within a *specific* writing system (Latin) and its relationship to the other symbols in that system. The physical shape is necessary but *insufficient* to define it as the Latin letter "a". The identical shape functions as a completely different letter (alpha) in a different system.

  **The Murkiness:**
  *   **Psychological Primacy of Shape:** Our brains *do* recognize the shape first. We see the loop-and-tail and immediately think "a-like" *before* context fully kicks in. This makes the systemic role feel artificial or secondary, even though it's ultimately decisive.
  *   **Ambiguous Context:** What about the shape `ɑ` appearing *in isolation*, without surrounding letters? Is it an "a" then? The systemic role story struggles here because there *is* no system/context to define its role. We might *assume* it's an "a" based on familiarity, but strictly speaking, its identity is undefined without a system. The intrinsic feature story doesn't resolve this either – it just says "it's that loop-and-tail shape". This highlights that both aspects (recognition of form *and* assignment of systemic function) are needed for practical use, but the *identity as a specific letter* depends entirely on the system.

  **Conclusion (for this case):**  
  The identical shapes `ɑ` (Latin a) and `α` (Greek alpha) prove that **being an 'a' is not an intrinsic property of the shape itself.** It is a property conferred solely by the shape's **role within the Latin alphabet system**. The shape is merely the *vehicle* used to represent that role in that specific system. Rotating your pixel 'a' breaks its ability to function *within the Latin system* as 'a', even if the rotated shape might resemble another symbol elsewhere. The "a-ness" resides in the system, not solely in the ink/pixels. The murkiness persists when context is absent, reminding us that letter identity is fundamentally relational.
