answer: |-
  Here are eight targeted questions with follow-ups, pressing key methodological joints:

  1. **Core Challenge: Distinguishing Deliberate Deposits**  
  *Question:* Given taphonomic processes and formation histories, what specific *positive criteria* (beyond patterning) confirm intentionality in deposits like threshold bones? How do you rule out functional explanations (e.g., pest control, temporary storage)?  
  *Likely Answer:* "Recurrence in *structurally significant* locations (e.g., beneath posts, not random floor scatter) plus material incongruity (e.g., complete pots in trenches)."  
  *Follow-up:* But couldn’t structural significance itself be functional (e.g., deposits stabilizing foundations)? If recurrence reflects cultural *habit* not symbolic intent, how does your method distinguish them?  

  2. **Testability of Belief Attributions**  
  *Question:* Suppose you attribute a belief "thresholds are dangerous" based on deposited amulets. What *testable prediction* does this generate beyond describing the placement pattern itself? What evidence would falsify it?  
  *Likely Answer:* "Predictions might include: amulets *only* at thresholds, not windows; similar deposits in culturally linked sites."  
  *Follow-up:* If future digs found amulets at windows too, wouldn’t you just expand the belief ("all portals are dangerous")? Doesn’t this risk being unfalsifiable?  

  3. **Beliefs vs. Unverbalized Dispositions**  
  *Question:* When you infer "beliefs," must these be *propositional* (e.g., "spirits inhabit thresholds")? Could recurring deposits instead reveal *non-discursive habits* – traditions whose original meaning was lost, or dispositions no one could articulate?  
  *Likely Answer:* "Habits imply a background of shared understanding – which *are* beliefs, even if not consciously stated."  
  *Follow-up:* Doesn’t calling all patterned behavior "belief" stretch the term too thin? If no contemporary could articulate a reason, is "belief" more than just *our* rationalization of their habit?  

  4. **Sufficiency of Charity**  
  *Question:* Charity assumes people act for *avowable* reasons. But what if deposits stem from reasons opaque to actors (e.g., unconscious symbolism, historical contingencies)? Isn’t charity insufficient without cross-cultural psychology?  
  *Likely Answer:* "Charity is our only access point. We reconstruct *their* rationality by projecting intelligible motives onto patterned action."  
  *Follow-up:* Doesn’t this risk imposing *our* notions of rationality? If their reasons were rooted in ontology alien to us (e.g., non-human agency), might charity force their actions into *our* rational framework?  

  5. **Patterns Without Ethnography**  
  *Question:* Without ethnography, how do you avoid *equifinality*? Could identical patterns arise from distinct beliefs (e.g., ancestor veneration vs. apotropaic warding), or even non-belief (e.g., commemorative trash disposal)?  
  *Likely Answer:* "Internal patterning (e.g., material types paired with specific structures) narrows interpretations. Ethnography isn’t the only constraint."  
  *Follow-up:* But without *their* symbolic context, what prevents multiple belief attributions fitting the same pattern equally well?  

  6. **Charity’s Cultural Limits**  
  *Question:* Charity assumes a universal rationality. How does your method detect actions rooted in cultural logics that *defy* our rational expectations (e.g., "irrational" destruction of valuables)?  
  *Likely Answer:* "Even ‘destructive’ acts have contextually intelligible goals (e.g., conspicuous consumption, ritual termination)."  
  *Follow-up:* But if charity filters all actions through *intelligibility-to-us*, how do you identify truly incommensurable cultural logics?  

  **Confidence in Portrait**: I’m ~85% confident based on your description. The core argument (pattern + charity → belief sans ethnography) seems clear. The question I’m *least sure* lands accurately is **#3 (Beliefs vs. Dispositions)** – if she views "belief" as inherently including embodied/habitual knowledge, my framing might misrepresent her stance.  

