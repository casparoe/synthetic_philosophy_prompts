prompt: |-
  I am a staff software engineer at a company of about 250 engineers, and I chair our architecture review board, which meets weekly. A recurring move in those meetings is the claim that we are locked in. Someone proposes reopening an old decision — our in-house build and configuration system, a data model that predates our second product line, a proprietary messaging primitive that has leaked into every service — and the answer comes back that the matter is settled, that we cannot go back, and that reopening it would waste the room's time. I have no formal background in philosophy, but I understand there is real work on path dependence, on whether historical outcomes are contingent or inevitable, and on what it even means to say things could have gone otherwise. I would like that work turned into a procedure my board can actually run, rather than summarized.

  What makes me want it is that "we are locked in" seems to bundle at least four different claims: (1) we literally cannot change this; (2) we could change it, but the cost exceeds the benefit; (3) the original decision was reasonable given what was knowable at the time, so there is nothing to relitigate; and (4) even had we decided otherwise, we would have arrived here anyway, because some other force would have pushed us. These seem to me to have very different consequences, and I watch them get used interchangeably. There are three further questions I cannot answer on my own. A state that merely persists is not the same as a state we cannot leave. Showing that a decision was contingent is not the same as showing it was a mistake. And if the state we are locked into is no worse than any feasible alternative, I am not sure the lock-in claim matters at all. The procedure should force all of these apart, and it should say what evidence would distinguish "we would have arrived here anyway" from "we would not have," given that we cannot rerun the decision.

  Please write it as a decision procedure I can hand to the board. It has to fit a forty-five minute review slot; the presenting engineer should be able to fill in a one-page template beforehand; the board renders a verdict; anything costing more than an engineer-quarter goes to the CTO for funding. I want the questions in the order they should be asked, what counts as a sufficient answer to each, where the procedure stops with a verdict, and a small named set of verdicts with the action each one triggers. Where a number is needed and unavailable — which will be most of the time — the procedure should say so rather than manufacture a cost estimate. Mark the steps that are judgment calls dressed up as procedure, and say how a presenter could game each step. Write it for someone who has never heard the term path dependence, and do not give me a reading list or citations; I cannot check them, and I would rather have the ideas in plain terms.

  Then run it on three cases: (a) migrating off the in-house build system to a commercial alternative, with two hundred engineers trained on the current one and a plugin ecosystem built around it; (b) the claim that we would have ended up on our cloud provider's proprietary queue no matter what we chose four years ago; and (c) a proposal to split a shared data model that has been blamed for slowing down two product lines. At least one of the three should come out in a way that I, as the person running the procedure, will not like, and you should say plainly why.

  Finally, tell me what the procedure cannot do: where it will return a confident-looking verdict on something that is not really decidable, and where the remaining question is about what we value — how much we are willing to pay for optionality, how much churn we will impose on people — rather than about the facts of how we got here. Please write the answer in American English.
reasoning: |-
  We are designing a decision procedure to handle claims of "lock-in" in architectural reviews. The goal is to unpack the four bundled claims and force explicit consideration of each. The procedure must fit in a 45-minute slot and use a one-page template filled by the presenter. The board renders one of a small set of verdicts. Anything costing more than an engineer-quarter goes to the CTO for funding.

  The four claims we are separating:
  1. Literally cannot change (technical impossibility)
  2. Change cost exceeds benefit (economic infeasibility)
  3. Original decision was reasonable (no fault in the past decision)
  4. We would have arrived here anyway (inevitability)

  We also address the three additional questions:
  - Persistence vs. inescapability
  - Contingency vs. mistake
  - Whether the locked-in state is no worse than alternatives

  The procedure must also be robust to gaming and note where judgment calls occur.

  ---

  **Decision Procedure: Unpacking Lock-in Claims**

  **Purpose:** To rigorously evaluate claims that a system or decision is "locked in" by separating four distinct types of lock-in claims and determining if change is feasible, beneficial, and worth reconsidering.

  **Input:** A one-page template filled by the presenting engineer prior to the meeting, containing:
  - Description of the system/decision in question
  - The change being proposed (or the alternative being considered)
  - Brief history of the decision (when made, by whom, known context at the time)
  - Any known costs or risks of the current system
  - Any known costs or risks of the proposed change
  - Any data on current pain points or benefits of change (if available)

  **Output:** One of the following verdicts:
  - **V1: Unlockable** - The system is not locked in; proceed with change as per normal process (if costs are within board's authority, else go to CTO for funding).
  - **V2: Change Too Costly** - Change is technically possible but economically infeasible at this time. Revisit if conditions change (e.g., pain increases, new tech emerges).
  - **V3: No Lock-in, But No Change Needed** - The current state is not locked in, but there is no compelling reason to change (the current state is at least as good as alternatives). Close the issue.
  - **V4: Locked In, Accept and Move On** - The system is locked in (either by impossibility, inevitability, or extreme cost) and the board recommends accepting the status quo and investing in workarounds or mitigations instead of replacement.
  - **V5: Contingent but Worth Revisiting** - The original decision was contingent (could have gone otherwise) and may have been a mistake, but the cost of reversal now is high. Assign a small team to explore lower-cost alternatives or incremental improvements.

  **Procedure Steps (to be followed in order during the meeting):**

  1. **Clarify the Proposal (5 minutes)**
     - Presenter briefly summarizes the proposed change and the lock-in claim being challenged.
     - Board asks clarifying questions only.
     - *Gaming risk:* Presenter may overstate the benefits of change or understate the current system's stability. Board should focus on facts.

  2. **Assess Technical Feasibility (10 minutes)**
     - Question: *Can we technically change this, even if it requires significant effort?*
     - Criteria: 
       - If there are no known technical barriers (e.g., no patents, no irreplaceable custom hardware, no fundamental incompatibilities), then answer YES.
       - If there are absolute technical barriers (e.g., the system is built on a discontinued proprietary platform with no emulation), then answer NO.
     - Judgment call: What counts as "technical barrier"? Requires expert input. Default to YES if uncertain.
     - If NO: Verdict = **V4 (Locked In, Accept and Move On)**. Stop procedure.
     - If YES: Proceed to step 3.

  3. **Assess Economic Feasibility (10 minutes)**
     - Question: *Would the cost of change (including transition, retraining, downtime, and lost opportunity) exceed the expected benefits (e.g., reduced maintenance, new capabilities, risk reduction) over the next 3 years?*
     - Criteria:
       - Presenter provides estimates for cost and benefit (if available). Board members contribute their own estimates.
       - If no numbers, use qualitative assessment (low, medium, high).
       - If cost is clearly astronomical (e.g., rewriting all services) and benefits are low, then answer NO (not economically feasible).
       - If benefits clearly dominate costs, answer YES (feasible).
     - Judgment call: Estimating costs and benefits is inherently uncertain. Requires weighing intangibles (e.g., morale, strategic alignment). Board must vote if unclear.
     - If NO (costs exceed benefits): Verdict = **V2 (Change Too Costly)**. Stop procedure.
     - If YES (benefits exceed costs): Proceed to step 4.

  4. **Assess Original Decision (10 minutes)**
     - Question: *Was the original decision reasonable given what was known at the time?*
     - Criteria:
       - Review the context at the time of the original decision (from the template). Avoid hindsight bias.
       - If the decision was clearly reasonable (e.g., met requirements, used best practices of the time) and no new information has emerged that would have changed it, then answer YES.
       - If the decision was clearly flawed (e.g., ignored known risks, was based on incomplete analysis) or new information has emerged that invalidates the original rationale, then answer NO.
     - Judgment call: Reasonableness is subjective. Board must rely on historical records and avoid relitigating without cause.
     - If YES: Proceed to step 5.
     - If NO: The board has identified a past mistake. Proceed to step 6.

  5. **Assess Inevitability (5 minutes)**
     - Question: *Even if we had chosen differently at the time, would we have ended up in the same place anyway?*
     - Criteria:
       - Consider if there were converging forces (e.g., industry trends, business pressures) that would have pushed us toward the current state regardless of the initial choice.
       - Evidence: Look for similar decisions in comparable companies or in other parts of our system.
       - If the board believes the outcome was inevitable (e.g., we would have migrated to the cloud provider's queue eventually due to its dominance), answer YES.
       - If the outcome was contingent (e.g., we could have chosen an open standard and avoided lock-in), answer NO.
     - Judgment call: Highly speculative. Use patterns from history and industry.
     - If YES: Verdict = **V4 (Locked In, Accept and Move On)**. Stop procedure.
     - If NO: Proceed to step 6.

  6. **Contingency and Current Value (5 minutes)**
     - Question: *Is the current state meaningfully worse than a feasible alternative?*
     - Criteria:
       - Compare the current state to the proposed alternative (or a hypothetical better state). Consider:
         - Is the current state causing active harm (e.g., outages, high maintenance, blocking features)?
         - Are there alternatives that are clearly better now?
       - If the current state is not worse (or even better) than alternatives, then answer NO.
       - If the current state is worse and we have a path to a better state, then answer YES.
     - Judgment call: Requires agreement on what "worse" means (cost, risk, morale, etc.).
     - If NO: Verdict = **V3 (No Lock-in, But No Change Needed)**. Stop procedure.
     - If YES: Verdict = **V1 (Unlockable)** if the change is low cost (within one engineer-quarter) OR **V5 (Contingent but Worth Revisiting)** if the change is high cost (exceeds one engineer-quarter). For V5, also check if cost exceeds board authority -> then go to CTO.

  **Final Note:** If at any step the required information is unavailable and the board cannot make a judgment, the verdict defaults to **V2 (Change Too Costly)** because without evidence of benefit or feasibility, change is too risky.

  ---

  **Applying the Procedure to Cases**

  **Case (a): Migrating off the in-house build system to a commercial alternative**

  - **Step 1:** Proposal: Migrate to a commercial build system (e.g., Jenkins, GitLab CI). Lock-in claim: We are locked in due to training and plugins.
  - **Step 2: Technical Feasibility** - YES. The build system is software; it can be replaced.
  - **Step 3: Economic Feasibility** - Cost: High (retraining 200 engineers, rebuilding plugins, migration effort). Benefits: Lower maintenance, better support, new features. Without numbers, qualitative: costs are high, benefits medium. Board might say costs exceed benefits -> **V2 (Change Too Costly)**. 
    - *Why you might not like it:* The procedure stops here with a verdict against change. But note: if the presenter can show concrete high benefits (e.g., 20% productivity gain), the board might proceed to step 4.

  **Case (b): Claim that we would have ended up on our cloud provider's proprietary queue no matter what we chose four years ago**

  - This is a meta-claim about inevitability. We treat it as a proposal to *avoid* lock-in (even though we are already there) by considering if we could have avoided it and if we can escape now.
  - **Step 1:** Proposal: Revisit the decision to use the proprietary queue. Lock-in claim: We are locked in and it was inevitable.
  - **Step 2: Technical Feasibility** - YES. We could replace the queue with an open alternative (e.g., RabbitMQ) but it would be hard.
  - **Step 3: Economic Feasibility** - Cost: High (changing every service using the queue). Benefits: Avoid lock-in, better portability. Without numbers, costs likely exceed benefits -> **V2 (Change Too Costly)**? But let's assume we proceed to step 4.
  - **Step 4: Original Decision** - Was it reasonable? At the time, the proprietary queue was the easiest and most scalable. YES, reasonable.
  - **Step 5: Inevitability** - Would we have ended up here anyway? Given the cloud provider's dominance and the pressure to use native services, likely YES. Verdict = **V4 (Locked In, Accept and Move On)**.
    - *Why you might not like it:* The procedure concludes that we are locked in and should accept it, even if you believe we could have avoided it. But note: the inevitability step is highly speculative.

  **Case (c): Proposal to split a shared data model blamed for slowing two product lines**

  - **Step 1:** Proposal: Split the shared data model into product-specific models. Lock-in claim: We are locked in because the model is used everywhere.
  - **Step 2: Technical Feasibility** - YES. Data models can be refactored.
  - **Step 3: Economic Feasibility** - Cost: Medium (refactoring, testing, potential downtime). Benefits: Faster development, fewer conflicts. If benefits are high (e.g., unblocking two teams), then YES (feasible) -> proceed.
  - **Step 4: Original Decision** - Was the shared model reasonable? At the time, it reduced duplication. But new info: it now causes delays. So NO, the original decision is no longer optimal given new context (scale, multiple products).
  - **Step 6: Current Value** - Is the current state worse? YES, because it slows development. 
    - Cost: If the refactoring is within one engineer-quarter -> **V1 (Unlockable)**. If higher, then **V5 (Contingent but Worth Revisiting)** and assign a team to plan the split. If cost is very high, go to CTO.
    - *Why you might not like it:* If the cost is high and the board has to go to the CTO, it might delay the project. But the verdict is to move forward.

  ---

  **What the Procedure Cannot Do**

  1. **Decide Values:** The procedure cannot resolve disagreements about what the organization values. For example:
     - How much is optionality (avoiding lock-in) worth?
     - How much churn is acceptable?
     - What discount rate to apply for future benefits?
     These are judgment calls and require leadership input.

  2. **Predict the Future:** Steps 3 (economic feasibility) and 5 (inevitability) rely on predictions that may be wrong. The procedure will return confident verdicts based on available information, but it cannot account for black swan events or new technologies.

  3. **Handle Extreme Uncertainty:** When there is no data, the procedure defaults to status quo (V2 or V4). This conservatism might prevent worthwhile changes if the presenter cannot articulate benefits.

  4. **Eliminate Politics:** The procedure can be gamed by presenters who:
     - Understate costs or overstate benefits in Step 3.
     - Cherry-pick historical context in Step 4.
     - Exaggerate inevitability in Step 5.
     The board must be vigilant.

  5. **Resolve Deep Disagreements:** If the board is split on a judgment call, the procedure does not specify how to break ties (e.g., majority vote? chair decides?).

  In essence, the procedure forces explicit reasoning and separates concerns, but it cannot replace collective wisdom or strategic vision. It is a tool for making implicit assumptions explicit, not a crystal ball.
answer: |-
  Below is a decision procedure designed for your architecture review board to rigorously evaluate "lock-in" claims. It unpacks the four bundled assertions, forces explicit separation of claims, and provides clear verdicts. The procedure fits a 45-minute meeting, uses a one-page template for pre-work, and includes safeguards against gaming. I'll present it as a standalone document you can hand to the board, followed by application to your three cases and limitations.

  ---

  ### **Lock-in Evaluation Procedure for Architecture Review Board**  
  **Purpose:** To objectively evaluate claims that a system or decision is "locked in" by separating four distinct types of lock-in (cannot change, too costly, reasonable at the time, or inevitable). Forces explicit evidence and stops early where possible.  

  **Inputs:**  
  - **Presenter pre-work:** One-page template (see below).  
  - **Time limit:** 45 minutes total.  
  - **Cost threshold:** Changes exceeding 1 engineer-quarter (EQ) of effort require CTO approval.  

  **Outputs (Verdicts):**  
  - **UNLOCK:** Change is feasible and worthwhile. Proceed (escalate to CTO if >1 EQ).  
  - **TOO COSTLY:** Change is possible but net negative. Do nothing; revisit if new evidence emerges.  
  - **NO FAULT:** Original decision was sound. Close discussion; do not revisit without new data.  
  - **INEVITABLE:** Change is futile (we’d end up here anyway). Accept status quo; invest in workarounds.  
  - **CONTINGENT BUT STUCK:** Original decision was flawed, but reversal is impractical. Explore incremental fixes.  

  **One-Page Template (for Presenter):**  
  *(Presenter completes this and shares 24h before meeting)*  
  1. **System/Decision:** [Name, e.g., "In-house build system"]  
  2. **Proposed Change:** [e.g., "Migrate to commercial alternative"]  
  3. **Lock-in Claim Being Challenged:** [Quote the "locked in" assertion, e.g., "We can't leave our build system"]  
  4. **Evidence for Change:** [Pain points, benefits, risks of status quo]  
  5. **Evidence Against Change:** [Switching costs, disruption risks, benefits of status quo]  
  6. **Original Context (when decision was made):** [Year, known constraints, alternatives considered]  
  7. **Known Costs/Benefits:** [Quantitative if available (e.g., "$X downtime"), else qualitative (e.g., "High training cost")]  

  ---

  ### **Procedure Steps**  
  **Run in order during the meeting. Time limits are strict. Board votes if consensus falters.**  

  #### **Step 1: Clarify the Claim (5 minutes)**  
  - **Question:** What specific "lock-in" claim is being made? Is it about impossibility, cost, reasonableness, or inevitability?  
  - **Process:** Presenter reads item 3 from template. Board classifies the claim into one or more of:  
    - **A:** "We literally cannot change this."  
    - **B:** "Cost to change exceeds benefit."  
    - **C:** "Original decision was reasonable."  
    - **D:** "We’d end up here anyway."  
  - **Sufficient Answer:** Explicit list (e.g., "A and B"). If unclear, board votes.  
  - **Gaming Risk:** Presenter bundles claims to confuse. Board must force separation.  
  - **Verdict If:** Stop here if the claim is purely "A" (cannot change) and board agrees. Verdict = **INEVITABLE** if evidence shows technical impossibility (e.g., proprietary hardware dependency). *Otherwise, proceed.*  

  #### **Step 2: Test Feasibility (10 minutes)**  
  - **Question:** Can we technically change this? Ignore cost—focus on physics/code.  
  - **Process:**  
    - Presenter summarizes evidence for/against (template items 4–5).  
    - Board evaluates: Is there a technical path to change? (e.g., APIs exist, data is migratable).  
    - If "no," it must be due to hard constraints (e.g., patents, dead vendor, irreversible data loss).  
  - **Sufficient Answer:** "Yes" (possible) or "No" (truly impossible). Judgment call: Default to "yes" unless proven otherwise.  
  - **Gaming Risk:** Presenter overstates technical barriers. Board must demand proof (e.g., "Show the vendor contract blocking this").  
  - **Verdict If:** "No" → **INEVITABLE** (hard lock). Stop.  
    "Yes" → Proceed.  

  #### **Step 3: Quantify Cost vs. Benefit (10 minutes)**  
  - **Question:** Would the cost to change exceed the benefits?  
  - **Process:**  
    - Board estimates:  
      - **Cost:** Effort (engineer-months), downtime, retraining, opportunity cost.  
      - **Benefit:** Savings (time/money), risk reduction, new capabilities.  
    - Use template item 7. If numbers are missing, state "unknown" and use qualitative scales:  
      - Cost: Low (<0.25 EQ), Medium (0.25–1 EQ), High (>1 EQ).  
      - Benefit: Low (minor efficiency), Medium (solves a pain point), High (strategic transformation).  
    - **Judgment call:** Cost-benefit is qualitative unless data exists. Board votes on net value.  
  - **Sufficient Answer:** "Cost > benefit," "Benefit > cost," or "Uncertain."  
  - **Gaming Risk:** Presenter underestimates costs or overhypes benefits. Board must cross-examine (e.g., "How did you get this benefit estimate?").  
  - **Verdict If:**  
    - "Cost > benefit" → **TOO COSTLY**. Stop.  
    - "Benefit > cost" and cost <1 EQ → **UNLOCK**. Stop.  
    - "Benefit > cost" and cost >1 EQ → Escalate to CTO; pause verdict.  
    - "Uncertain" → Proceed to Step 4.  

  #### **Step 4: Assess Original Decision (10 minutes)**  
  - **Question:** Was the original decision reasonable given what was known at the time?  
  - **Process:**  
    - Review template item 6 (historical context).  
    - Board asks: "Knowing only what they knew then, was this defensible?" Avoid hindsight.  
    - Focus on: Alternatives considered, constraints (time/budget), and best practices of the era.  
  - **Sufficient Answer:** "Yes" (sound decision), "No" (flawed), or "Unclear."  
  - **Gaming Risk:** Presenter cherry-picks history to make past look foolish. Board must role-play the past context.  
  - **Verdict If:** "Yes" → **NO FAULT**. Stop.  
    "No" or "Unclear" → Proceed.  

  #### **Step 5: Test Inevitability (5 minutes)**  
  - **Question:** If we had chosen differently back then, would we still be stuck with this outcome?  
  - **Process:**  
    - Evaluate forces beyond our control (e.g., market trends, vendor consolidation, regulatory shifts).  
    - Evidence: Industry examples, similar decisions elsewhere in the company, or logical necessity (e.g., "All clouds push proprietary services").  
    - **Judgment call:** Highly speculative. Default to "not inevitable" without strong evidence.  
  - **Sufficient Answer:** "Yes" (inevitable) or "No" (contingent).  
  - **Gaming Risk:** Presenter invokes "fate" without evidence. Board must demand examples (e.g., "Show a peer company that avoided this").  
  - **Verdict If:** "Yes" → **INEVITABLE**. Stop.  
    "No" → Proceed to Step 6.  

  #### **Step 6: Final Contingency Check (5 minutes)**  
  - **Question:** Is the status quo worse than a feasible alternative, and if so, can we fix it incrementally?  
  - **Process:**  
    - Board compares status quo to the proposed change (and any compromise).  
    - Ask: "Is this actively hurting us, and is there a cheaper way to mitigate?"  
    - If change is high-cost but urgency is low, seek incremental options.  
  - **Sufficient Answer:** "Worse and fixable" or "Not worse."  
  - **Verdict If:**  
    - "Not worse" → **NO FAULT**. Stop.  
    - "Worse and fixable" with low incremental cost → **UNLOCK**.  
    - "Worse and fixable" with high cost → **CONTINGENT BUT STUCK**. Assign a spike (1–2 engineers for 1 week) to explore workarounds.  

  ---

  ### **Application to Your Cases**  
  I’ll run the procedure neutrally. Per your request, one outcome will be unfavorable to you (as chair).  

  #### **Case (a): Migrate off in-house build system**  
  - **Step 1:** Claim is "B" (costly) and "D" (inevitable).  
  - **Step 2:** Feasible? **Yes** (commercial systems exist).  
  - **Step 3:** Cost: High (retraining 200 engineers, rebuilding plugins). Benefit: Medium (reduced maintenance, better scalability). No numbers → Qualitative: Cost > Benefit. **Verdict = TOO COSTLY**. Stop.  
  - **Why you might dislike this:** The procedure stops early (Step 3) based on cost, without debating inevitability or original intent. It conservatively defaults to status quo when costs are uncertain.  

  #### **Case (b): "We’d have ended up on cloud provider’s proprietary queue anyway"**  
  - **Step 1:** Claim is "D" (inevitable).  
  - **Step 2:** Feasible? **Yes** (could use open protocol).  
  - **Step 3:** Cost: High (refactoring every service). Benefit: Low (portability). Cost > Benefit → **TOO COSTLY**. Stop.  
  - **Note:** Procedure never reaches inevitability (Step 5) because cost-benefit kills it first. Verdict implies lock-in is economic, not inevitable.  

  #### **Case (c): Split shared data model slowing product lines**  
  - **Step 1:** Claim is "A" (cannot change) and "B" (costly).  
  - **Step 2:** Feasible? **Yes** (data models are software).  
  - **Step 3:** Cost: Medium (refactoring, testing). Benefit: High (unblocking teams). Benefit > Cost, but cost >1 EQ? Unknown → Proceed.  
  - **Step 4:** Original decision reasonable? **No** (didn’t anticipate multi-product needs).  
  - **Step 5:** Inevitable? **No** (could have designed modularly).  
  - **Step 6:** Status quo worse? **Yes** (slows development). Fixable incrementally? **Yes** (e.g., phase split).  
  - **Verdict = CONTINGENT BUT STUCK**. Assign spike to design incremental split.  
  - **Why you might dislike this:** You wanted a clean "UNLOCK," but without cost numbers, the verdict defaults to exploration instead of commitment.  

  ---

  ### **What the Procedure Cannot Do**  
  1. **Manufacture certainty where none exists:**  
     - In Steps 3 (cost-benefit) and 5 (inevitability), it returns verdicts based on incomplete data. E.g., "INEVITABLE" verdicts rely on speculative historical arguments that can’t be proven.  
     - **Result:** False confidence in "fate" when we’re just afraid of cost.  

  2. **Resolve value judgments:**  
     - The procedure outsources hard trade-offs:  
       - How much is "optionality" (avoiding lock-in) worth? (Step 3).  
       - How much churn is acceptable to engineers? (Step 6).  
     - These require leadership input, not facts. If the board disagrees on values (e.g., "Is developer pain worth $1M?"), the procedure masks it with a verdict.  

  3. **Handle "unknown unknowns":**  
     - It assumes the presenter and board know the costs/benefits. If a system’s flaws are hidden (e.g., a data model’s scalability limit), it defaults to status quo.  

  4. **Prevent gaming:**  
     - A savvy presenter can:  
       - In Step 3, inflate benefits ("This change will boost morale!") without data.  
       - In Step 4, omit historical context to make past decisions look reckless.  
       - In Step 5, invent "inevitability" by citing vague trends.  
     - The board must be vigilant—but the procedure flags these as judgment calls.  

  **Bottom line:** This tool forces clarity on *why* we’re "locked in," but it can’t replace tough calls on values or strategy. Use it to cut through fog, then escalate what remains.
