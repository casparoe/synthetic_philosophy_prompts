answer: |-
  Here is a specification of desiderata for an adequate theory of work and leisure rights, structured as requirements with motivating cases/considerations, conflict analysis, and a brief scorecard of three approaches. Non-negotiables are foundational; preferences reflect ideological camps. Conflicts are explicitly called out.

  ---

  ### **I. Foundational Requirements (Non-Negotiable)**
  1. **R1: Prevent Destructive Coercion**  
     *Motivation*: Must explain why *karoshi* (death from overwork) is unjust, and why cases like hospital residents (80hr weeks) or salaried workers pressured into midnight emails are exploitative. Distinguish voluntary overtime (e.g., a driven artist) from coerced overtime (e.g., "promotion depends on availability").  
     *Constraint*: Labor markets create power imbalances; firms may use informal pressure to circumvent formal rules.

  2. **R2: Guarantee Basic Subsistence**  
     *Motivation*: Ensure no one is forced into harmful work/leisure trade-offs for survival (e.g., gig drivers who *must* accept surge hours to pay rent). Must cover unpaid care workers (e.g., parents) lacking income security.  
     *Constraint*: Public budgets limit welfare; theory must not assume infinite resources.

  3. **R3: Protect Agency in Work-Leisure Trade-offs**  
     *Motivation*: Explain why the French worker asked to exceed 35hrs deserves recourse, while the person who finds meaning in work may refuse shorter hours. Distinguish *liberty* (no interference) from *entitlement* (state-provided work/leisure).  
     *Constraint*: Individual choices affect firm productivity and team coordination (e.g., hospitals require shifts).

  ---

  ### **II. Agency & Equity Requirements**
  4. **R4: Recognize Unpaid Work**  
     *Motivation*: Unpaid care work (e.g., parenting) must not be excluded from "work" rights. Distinguish paid labor from unpaid social reproduction.  
     *Constraint*: Hard to quantify/value unpaid work institutionally.

  5. **R5: Ensure Genuine Choice in Scheduling**  
     *Motivation*: Gig drivers "choosing" hours face income loss if refusing surges—false agency. Theory must not conflate formal flexibility with substantive control.  
     *Constraint*: Algorithmic management (e.g., ride-hail apps) can covertly coerce.

  6. **R6: Accommodate Lifecycle Transitions**  
     *Motivation*: Retirees penalized for part-time work (e.g., losing pensions) or caregivers re-entering labor force. Leisure/work rights must adapt across ages.  
     *Constraint*: Pension systems often assume binary work/retirement states.

  ---

  ### **III. Institutional & Normative Requirements**
  7. **R7: Respect Collective vs. Individual Rights**  
     *Motivation*: A 35hr week may be a collective bargain (France), not an individual right. Theory must not collapse statutory policies (e.g., max-hours) into inherent rights.  
     *Constraint*: Unions vs. individual contracts create tension.

  8. **R8: Account for Work's Plural Values**  
     *Motivation*: Must accommodate work as a commodity (wage labor), calling (meaning-seeking), or duty (essential workers). Not assume Protestant ethic (work as virtue).  
     *Constraint*: Firms view labor instrumentally; workers may view it intrinsically.

  9. **R9: Define Leisure's Value Without Work-Dominance**  
     *Motivation*: Must explain if leisure is intrinsically valuable (e.g., creativity) or merely recovery for work (avoiding *karoshi*). Distinguish time off from passive idleness.  
     *Constraint*: Productivity demands may instrumentalize leisure.

  10. **R10: Be Institutionally Feasible**  
      *Motivation*: Policies must align with labor market dynamics (e.g., on-call schedules for hospitals) and public budgets (e.g., funding shorter weeks).  
      *Constraint*: Firms optimize for efficiency; states balance economic growth with welfare.

  ---

  ### **IV. Conflicts and Tensions**
  - **Trilemma: Work, Leisure, and Choice**  
    A theory **cannot simultaneously honor** all three at maximum strength:  
    - A *strong right to work* (e.g., retiree wanting part-time) may require firms to hire even if inefficient.  
    - A *strong right to leisure* (e.g., 35hr week) restricts scheduling freedom.  
    - *Strong scheduling autonomy* (e.g., gig workers) enables firms to offload risk, undermining leisure/income security (R2, R5).  
    **Why?** Institutional constraints (R10) and power imbalances (R1) force trade-offs. Absolute choice lets firms "structure" options coercively; rigid leisure rights limit work access for some.

  - **Other Tensions**:  
    - R8 (work's plural values) vs. R9 (leisure's autonomy): If work is a "calling," leisure may be devalued.  
    - R7 (collective rights) vs. R3 (individual agency): Majoritarian bargaining may override minority preferences (e.g., workaholics in a max-hours regime).

  ---

  ### **V. Scorecard of Approaches**
  | **Approach**               | **Key Failures**                                  | **Fatal Flaw** (Single Requirement) |
  |----------------------------|--------------------------------------------------|-------------------------------------|
  | **Protestant Work Ethic**  | Fails R1 (coercion), R8 (plural values), R9 (leisure’s worth). Justifies *karoshi* as "virtue." | **R1**: Ignores coercive overwork. |
  | **Statutory Max-Hours** (e.g., 35hr week) | Fails R3 (agency trade-offs), R5 (scheduling choice), R7 (collective≠individual right). Poor fit for gig work or retirees. | **R5**: Inflexible; false universality. |
  | **Right-to-Disconnect**    | Fails R2 (subsistence—salaried workers protected, gig workers not), R10 (ignores income coercion). | **R2**: No solution for survival-driven work. |

  **Weakest Approach**: Protestant Ethic. Fatally violates **R1** by normalizing destructive coercion as moral duty.

  ---

  ### **Summary of Non-Negotiables vs. Preferences**
  - **Non-Negotiable**: R1 (no coercion), R2 (subsistence), R3 (agency core).  
  - **Preferences**: Shorter work weeks (cultural), work as calling (ideological), collective vs. individual emphasis (political).  

  This specification forces trade-offs; no theory satisfies all requirements perfectly. A robust theory must resolve the work-leisure-choice trilemma explicitly while meeting R1–R3.
