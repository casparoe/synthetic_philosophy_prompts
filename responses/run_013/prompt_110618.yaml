  I should structure the toast with an intro that hooks both groups, perhaps with a light-hearted contrast between the two sides of the room. Then explain the theorem simply using relatable examples like choosing a couch or vacation. Emphasize that the weights aren't given; they're built through shared experiences. Conclude by tying the weights to their future together, making it heartfelt.

