answer: |-
  Okay, best man. Here’s a toast that uses Harsanyi as its engine, not just its nameplate. Aiming for warmth, clarity, and a punchline the theorists will chuckle at while Aunt Maureen nods along:

  **(Clink glass gently. Big smile.)**

  "Alright everyone! Settle down. For those who don't know me, I’m [Your Name], [Bride's Name]’s best man, and incredibly honored to be standing up here for her and [Groom's Name].

  Now, looking around this incredible room... it's a special mix! Half of you – [gesture towards Bride's family] – are probably wondering if the open bar closes before midnight... and the other half – [gesture towards the academic contingent] – are probably wondering if the open bar satisfies the axioms of revealed preference!

  **(Pause for laughs. Keep it light.)**

  But seriously, seeing you all here for [Bride's Name] and [Groom's Name] is amazing. These two... they’re something special. They didn't just *find* each other; in a way, they *built* each other. And that got me thinking... about how two brilliant minds, two unique individuals, actually *merge* their lives.

  You see, [Bride's Name] and [Groom's Name] live in a world obsessed with how people make choices. What makes *you* happy? What makes *me* happy? And crucially: how do you figure out what makes *us* happy? Especially when what I want and what you want... well, sometimes they clash!

  **(Lean in slightly, conversational tone.)**

  Think about it. Choosing a movie? One wants action, one wants romance. Picking a vacation spot? Mountains vs. beach. Buying a couch? Sleek modern or comfy squishy? (We *all* know that debate!). As individuals, we each have our own internal compass – our own sense of what brings us joy, security, fulfillment... call it our personal 'happiness scorecard'.

  Now, imagine you're a super-logical being, like these two often are. You'd say: 'Okay, for this *couple* to make good choices, their combined 'happiness compass' should follow some sensible rules.'

  Rule One: If something is clearly, undeniably better for *both* of you? If you *both* prefer the beach to a root canal? Well then, obviously, the *couple* should prefer the beach! That’s just common sense. Let’s call that the 'No Brainer Principle'.

  Rule Two: This combined compass shouldn't be totally crazy or unpredictable. It should kind of... average out the big wins and losses sensibly. Stable. Rational, even.

  **(Slight shift, getting to the key point.)**

  Now, here’s the fascinating thing: Some very smart people – people like, well, probably half the room right now – figured out mathematically that if you follow those basic, sensible rules... there’s really only *one* way for that 'couple compass' to work.

  It *has* to be a blend. A weighted sum. It *has* to take her happiness score and his happiness score, add them together... but give each one a little bit of extra emphasis. A little bit more 'weight'. One person's joy might count just a *tad* more towards the couple's decision in one area, the other person's in another. But crucially, it *has* to be a mix. You *can't* just pick one person's preferences and ignore the other's if you want something fair and rational that follows those simple rules.

  **(Pause. Look at the couple, soften the tone.)**

  But here’s the kicker... the beautiful part... the part the math *doesn’t* tell you. The theorem is silent on this. It doesn't say *how much* weight to give. It doesn't say whose happiness gets a little extra nudge when, or why.

  **(Gesture warmly between Bride and Groom.)**

  *That*, right there? That’s the marriage. That’s the magic. That’s the thing you two have been building since the moment you met at that conference debating... well, whatever incredibly smart thing you were debating!

  The weights aren't set by some equation. They're whispered in compromises over burnt toast on a Sunday morning. They're negotiated during long talks about the future at 2 AM. They're discovered when one carries the other through a tough day, or cheers the loudest at a small victory. They're the invisible, shifting balance of love, respect, sacrifice, and unwavering support.

  The math proves you *need* weights. But only your love, your partnership, your daily choice to put 'us' before 'me'... only *that* decides *what* those weights are. Only *that* builds the unique, beautiful, perfectly imperfect algorithm that is your marriage.

  **(Raise glass higher.)**

  So, to [Bride's Name] and [Groom's Name]! May your Pareto improvements always be plentiful! May your utility functions forever be compatible! But most importantly, may you always, instinctively, generously, and lovingly know... exactly how to weight each other.

  Cheers!"

  **Why this works:**

  1.  **No Jargon:** "Happiness scorecard," "No Brainer Principle," "blend," "weight," "mix" – all accessible terms replacing "utility," "Pareto," "aggregation," "weighted sum."
  2.  **The Key Insight:** It clearly establishes the *necessity* of a weighted sum under those simple rules (Pareto + EU rationality for SWF), which is Harsanyi's core contribution.
  3.  **The Punchline/Tender Part:** It explicitly states the theorem's silence on the weights and directly links *that* gap to the essence of marriage – the daily, loving negotiation of priorities.
  4.  **Relatable Examples:** Movies, vacations, couches – everyone gets these struggles. Burnt toast, 2 AM talks – these are universal marriage moments.
  5.  **Warmth Over Sweat:** Focuses on the *human* implication of the math, not the math itself. The final paragraph is pure sentiment.
  6.  **Winks to the Theorists:** "Axioms of revealed preference" joke, "Pareto improvements," "utility functions" in the final cheers – they'll get it. The structure itself *is* the deep cut for them.
  7.  **Aunt Maureen Approved:** It tells a clear story about love, compromise, and building a life together using simple analogies. She hears the *meaning*, not the model.
  8.  **Time:** Roughly 5 minutes when delivered conversationally with pauses.

  **Delivery Tip:** Practice! Keep the pace natural, smile, make eye contact with both the couple and the audience. Let the pauses for the laughs land. The warmth in your voice when you hit the part about "whispered compromises" and "the marriage" is crucial. Good luck! They'll love it.
