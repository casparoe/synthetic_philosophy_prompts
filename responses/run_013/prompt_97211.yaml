  We are drafting a joint statement for two camps: internal-logic and design-choice, on whether artifacts (specifically a load-shedding policy) have politics. We are to use a concrete case: a service that must shed load when overloaded, deciding which requests to drop or delay.

  Three terms to introduce and use:
  1. Underdetermination: gap between a functional requirement and the set of implementations that satisfy it.
  2. Reversal cost: expense to change a social arrangement once an artifact embodying it is deployed.
  3. Median-user default: tendency of systems to be tuned to the typical user, degrading for the tail.

  The document should have:
  (1) A numbered list of agreed claims (including about the case, evidence, and verbal disputes).
  (2) Disagreements table with columns: point of disagreement, internal-logic formulation, design-choice formulation, crux, shared test, and each camp's prediction.

  Steps:
  1. **Agreed Claims**: List of points both camps accept.
  2. **Disagreements Table**: For each point of ongoing disagreement, state both sides fairly, the crux, a shared test, and predictions.

  We must avoid strawmen and present the strongest arguments.

  ---

  **Agreed Claims (Numbered List):**

  Both camps agree on the following:

  1. **Functional Requirement for Load Shedding**: In the case of a service that becomes overloaded and cannot serve every request, it is necessary to implement a load-shedding policy. This requirement is driven by technical constraints (e.g., resource limits) and economic constraints (e.g., cost of over-provisioning).

  2. **Existence of Underdetermination**: There is a gap (underdetermination) between the functional requirement ("shed load when overloaded") and the set of possible implementations. Multiple policies can satisfy the requirement, such as random dropping, FIFO with queue limits, LIFO, priority-based on user type, priority based on request type, etc.

  3. **Underdetermination is Real**: Both camps accept that underdetermination is a real phenomenon. They also agree that the term "underdetermination" usefully describes the gap between requirement and implementation space.

  4. **Reversal Cost is Real and Significant**: Both camps accept that once a load-shedding policy is implemented and deployed, changing it may incur substantial reversal costs. These include engineering costs (re-design, re-implementation, testing, deployment), operational costs (managing the transition, monitoring), and social costs (user retraining, adjusting to new behaviors, potential backlash). They agree the term "reversal cost" is useful.

  5. **Median-User Default is Real**: Both camps accept that systems are often tuned for the typical (median) user and may degrade for non-typical (tail) users. In the context of load shedding, this might manifest as policies that work well for the majority of users but fail for edge cases (e.g., users in low-bandwidth regions, users with critical but rare requests). They agree the term "median-user default" is useful.

  6. **Politics in the Broader System**: Both camps agree that the overall socio-technical system (including the service, its operators, users, and the market) has political dimensions. Decisions about the load-shedding policy are made within a context of institutional, economic, and social constraints.

  7. **Evidence for Design Choices**: Both camps agree that if it can be shown that two or more load-shedding policies are technically and economically feasible and that the choice among them leads to different distributions of benefits and burdens (e.g., one policy drops more requests from low-tier users, another from high-latency regions), then that would be evidence of a political dimension in the choice. However, they may disagree on whether this makes the artifact itself political.

  8. **Evidence for Internal Logic**: Both camps agree that if it can be shown that for a given technical and economic context, only one load-shedding policy is feasible (or that the set of feasible policies is extremely constrained and the differences between them are negligible), then that would be evidence that the artifact is largely determined by internal logic. However, they may disagree on the likelihood of such constraints.

  9. **Verbal Dispute on "Politics"**: Both camps agree that part of the dispute is verbal, hinging on the definition of "politics" and "artifact". They agree that if "politics" is defined as the distribution of power and resources in society, then the choice of load-shedding policy can have political effects. But they disagree on whether these effects are inherent in the artifact or solely in the context of its use.

  ---

  **Disagreements Table:**

  We present the table with the following columns:
  - Point of Disagreement
  - Internal-Logic Camp's Formulation
  - Design-Choice Camp's Formulation
  - Crux (the sub-question that would move at least one camp if settled)
  - Shared Test (case, argument, or experiment both agree would bear on the crux)
  - Internal-Logic Prediction
  - Design-Choice Prediction

  **Table:**

  | Point of Disagreement | Internal-Logic Camp's Formulation | Design-Choice Camp's Formulation | Crux | Shared Test | Internal-Logic Prediction | Design-Choice Prediction |
  |------------------------|-----------------------------------|----------------------------------|------|-------------|---------------------------|--------------------------|
  | **The artifact's inherent political nature** | The load-shedding policy, as an artifact, is politically neutral; its political effects arise solely from how it is deployed and by whom in a specific social context. | The load-shedding policy, as an artifact, inherently embodies a political choice because underdetermination allows for alternatives that would distribute benefits and burdens differently, and the choice made reflects a value judgment. | **Crux 1**: Does the existence of underdetermination and the necessity of a choice among alternatives (which may have different distributional outcomes) imply that the artifact itself is political? | Examine a specific load-shedding policy in two different social contexts (e.g., a free public service vs. a paid enterprise service) and observe whether the same policy produces the same political effects. If the effects change with context, then the artifact is neutral. If the effects are consistent across contexts, then the artifact is inherently political. | **Prediction**: The same policy (e.g., random drop) will have different political effects in the two contexts (e.g., in the public service it may be seen as fair, in the enterprise service it may be seen as unfair if premium users are affected equally). Thus, the artifact is neutral. | **Prediction**: The same policy will have consistent distributional effects (e.g., random drop always benefits users with more retries and harms those with fewer) regardless of context, showing the artifact is inherently political. |
  | **The role of constraints in eliminating choice** | The engineering and economic constraints are so tight that they leave no room for a meaningful choice; the policy is dictated by the internal logic of the system. | Even under constraints, there is always a range of choices, and the selection among them is a design choice that reflects political values. | **Crux 2**: In a given real-world scenario, how wide is the set of feasible load-shedding policies after accounting for all engineering and economic constraints? | Take a real-world overload scenario (e.g., a popular e-commerce site during Black Friday). Have independent engineering teams, given identical requirements and constraints, design load-shedding policies. Then, compare the policies for diversity in their distributional outcomes. | **Prediction**: Teams will converge on a very small set of policies (perhaps only one) because the constraints (e.g., latency targets, cost, complexity) will force a particular solution. | **Prediction**: Teams will produce a diverse set of policies (e.g., based on user tier, request type, geography) because constraints leave room for multiple approaches. |
  | **The significance of reversal cost** | High reversal costs are an inherent feature of deployed systems and make the artifact's design appear fixed, thus obscuring the initial choice and making the artifact seem neutral. | High reversal costs are a consequence of the initial design choice and do not negate the political nature of that choice; they merely make it harder to change. | **Crux 3**: Do high reversal costs make the artifact's political effects appear natural and inevitable, thereby shifting the perception of the artifact from being a choice to being a necessity? | Conduct a user study: Present two groups of engineers with a deployed system. Group A is told the system was designed with a particular load-shedding policy because of high reversal costs. Group B is told the same system but without the reversal cost explanation. Ask both groups to rate the neutrality of the artifact. | **Prediction**: Group A (with reversal cost explanation) will rate the artifact as more neutral (because they see it as constrained) than Group B. | **Prediction**: Both groups will rate the artifact similarly (non-neutral) because the design choice is evident regardless of reversal costs. |
  | **Median-user default as a political choice** | Tuning for the median user is an engineering necessity and not a political choice; it is the most efficient way to serve the majority. | Tuning for the median user is a political choice because it systematically disadvantages tail users, and alternatives (e.g., proportional fairness) exist. | **Crux 4**: Is the median-user default an inevitable consequence of engineering constraints, or is it a choice that could be avoided without significant trade-offs? | Study two systems: System A uses median-user default. System B uses a policy that minimizes harm to tail users (e.g., weighted fair queueing). Compare their performance (e.g., overall throughput, tail latency) and costs (e.g., complexity, resource overhead). | **Prediction**: System B will have significantly higher costs (e.g., lower throughput, higher complexity) and thus the median-user default is an engineering necessity. | **Prediction**: System B can achieve comparable overall performance with better tail performance at acceptable cost, showing that median-user default is a choice. |
  | **Verbal Dispute: Definition of "artifact"** | (Not a substantive disagreement) The term "artifact" refers only to the code and its immediate technical function. Politics is in the use and context. | (Not a substantive disagreement) The term "artifact" includes the design choices frozen in code, which are political. | **This is verbal**: The dispute reduces to the definition of "artifact". Both camps agree that the code exists and that it has effects, but they frame the locus of politics differently. | N/A (since verbal) | N/A | N/A |

  ---

  **Note on Verbal Dispute:** The last row in the table addresses a verbal dispute. Both camps agree that the code is written and deployed, but they disagree on whether to call the code itself political or whether the politics is in the human decisions and context. This is a matter of framing and does not have a testable crux.

  **Final Document Structure:**

  We will write the joint statement as:

  **Joint Statement on the Politics of Artifacts: The Case of Load-Shedding Policies**

  We, the undersigned members of the internal-logic camp and the design-choice camp, have engaged in an adversarial collaboration to resolve our dispute about whether artifacts (specifically, a load-shedding policy in an overloaded service) have politics. We have focused on a concrete case to ground our discussion. We use the following terms:

  - **Underdetermination**: The gap between a stated functional requirement and the set of implementations that satisfy it.
  - **Reversal cost**: The expense of changing a social arrangement once an artifact embodying it has been deployed.
  - **Median-user default**: The tendency of systems to be tuned to the typical user and to degrade for the tail.

  Both camps accept these as real phenomena and agree that the terms are useful.

  **Agreed Claims:**

  1. In an overloaded service, a load-shedding policy is a technical necessity driven by engineering and economic constraints.
  2. Underdetermination exists: multiple load-shedding policies (e.g., random, priority-based, FIFO) can satisfy the functional requirement of shedding load.
  3. Reversal costs are real and significant: changing a deployed load-shedding policy is expensive and difficult.
  4. Median-user default is a common phenomenon in system design and can lead to degraded service for non-typical users.
  5. The overall socio-technical system (including the service, its operators, and users) has political dimensions.
  6. Evidence for the design-choice view would be the existence of multiple feasible policies with significantly different distributional outcomes.
  7. Evidence for the internal-logic view would be the existence of a single feasible policy (or a set with negligible differences) under tight constraints.
  8. Part of our dispute is verbal, depending on how we define "politics" and "artifact".

  **Disagreements:**

  We continue to disagree on the following points, which we have formulated in our own terms and for which we have identified testable cruxes.

