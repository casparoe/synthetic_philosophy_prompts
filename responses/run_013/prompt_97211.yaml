answer: |-
  ### Joint Statement on the Politics of Load-Shedding Policies  
  **Agreed Upon by Internal-Logic and Design-Choice Camps**  

  We, representatives of the internal-logic and design-choice perspectives, have engaged in adversarial collaboration to resolve our dispute about whether artifacts (specifically, **load-shedding policies**) inherently possess politics. We ground this statement in a concrete case: a service that, when overloaded, must drop or delay requests. We adopt three terms to clarify our debate:  
  - **Underdetermination**: The gap between a functional requirement (e.g., "shed load when overloaded") and the set of implementations satisfying it.  
  - **Reversal cost**: The expense of changing a social arrangement once an artifact embodying it is deployed.  
  - **Median-user default**: The tendency to optimize systems for typical users, degrading performance for edge cases.  

  Both camps accept these phenomena as **real** and **useful** for analysis.  

  ---

  ### Section 1: Agreed Claims  
  Both camps endorse the following numbered statements:  

  1. **Functional Necessity**: In our case study, shedding load during overload is a non-negotiable requirement dictated by technical constraints (e.g., server capacity) and economic realities (e.g., cost of over-provisioning).  

  2. **Underdetermination Exists**: The requirement "shed load" is underdetermined. Multiple policies satisfy it (e.g., random dropping, FIFO queue limits, priority queues for premium users), and engineering constraints alone do not mandate one solution.  

  3. **Reversal Costs Are Real**: Changing a deployed load-shedding policy incurs high reversal costs (e.g., re-engineering, user retraining, contractual renegotiations). This phenomenon is distinct from the artifact’s initial design.  

  4. **Median-User Default Is Real**: Systems often prioritize typical users (e.g., dropping requests from high-latency regions first). This occurs in load-shedding (e.g., policies ignoring edge cases like low-bandwidth users).  

  5. **Politics in Broader System**: Load-shedding policies have political *effects* (e.g., privileging certain users). Both camps agree these effects exist and matter.  

  6. **Evidence for Internal-Logic**: If engineering/economic constraints **force only one viable policy** (e.g., FIFO due to latency guarantees), it supports internal-logic. Example: A policy with no alternatives under 5ms latency targets.  

  7. **Evidence for Design-Choice**: If **multiple policies** meet technical requirements but yield divergent social outcomes (e.g., random vs. tier-based dropping), it supports design-choice. Example: A policy favoring enterprise users despite no technical necessity.  

  8. **Verbal Disagreement**: The dispute over whether an artifact "has politics" is partly verbal. It hinges on whether "politics" refers to:  
     - (a) The artifact’s *material consequences* (agreed by both to exist).  
     - (b) The artifact’s *inherent moral agency* (rejected by both).  
     - (c) The artifact *embodying human choices* (design-choice) vs. *reflecting external constraints* (internal-logic).  

  ---

  ### Section 2: Disagreements Table  
  | Point of Disagreement | Internal-Logic Camp Formulation | Design-Choice Camp Formulation | Crux | Shared Test | Predictions |  
  |------------------------|-----------------------------------|----------------------------------|-------|-------------|-------------|  
  | **Locus of Politics** | "The load-shedding artifact is politically neutral; politics reside in institutions (e.g., management setting incentives), not the artifact itself." | "The artifact encodes politics because underdetermination allows designers to embed values (e.g., fairness) into the policy, making it a frozen political settlement." | **Does underdetermination imply that the artifact *itself* is political?** | Analyze a policy change (e.g., from random to tier-based dropping) at two companies: one profit-driven, one equity-focused. Measure if the artifact’s *design* (not deployment) drives outcomes. | **IL**: Outcomes will correlate with institutional incentives, not artifact design.<br>**DC**: Artifact design will drive outcomes regardless of institution. |  
  | **Role of Constraints** | "Engineering constraints (e.g., latency budgets) and economic forces (e.g., cost of fairness mechanisms) *determine* viable policies, leaving no meaningful choice." | "Constraints only bound the solution space; the choice among viable policies is a *design decision* reflecting values (e.g., fairness vs. profit)." | **Do constraints eliminate agency in policy selection?** | Task engineers to design load-shedding under identical constraints (e.g., 99% uptime, 50ms latency). Compare policy diversity and their social impacts. | **IL**: Teams will converge on 1–2 policies with negligible impact differences.<br>**DC**: Teams will produce diverse policies with significant impact differences (e.g., tail-user drop rates). |  
  | **Reversal Cost as Obscuring Agency** | "High reversal costs make deployed artifacts *appear* inevitable, but this is an emergent property of deployment, not the artifact." | "Reversal costs arise *because* the artifact embeds politics; they reinforce the artifact’s role as a political actor by locking in choices." | **Do reversal costs retroactively legitimize the artifact as neutral?** | Survey engineers pre- and post-deployment of a policy. Measure perceptions of the artifact’s "neutrality" before deployment vs. after reversal costs are incurred. | **IL**: Perceptions of neutrality will increase post-deployment due to reversal costs.<br>**DC**: Perceptions of neutrality will not change; the artifact’s political nature remains visible. |  
  | **Median-User Default as Necessity vs. Choice** | "Optimizing for the median user is an engineering necessity; tail degradation is an unavoidable trade-off." | "Median-user default is a value-laden choice; alternatives exist (e.g., proportional fairness) but are deprioritized for efficiency." | **Is median-user default technically inevitable?** | Implement two systems: (A) Median-optimized, (B) Tail-optimized (e.g., fairness-weighted). Compare cost/performance trade-offs. | **IL**: System B will incur unacceptable costs (e.g., >20% latency increase).<br>**DC**: System B will achieve fairness at reasonable cost (e.g., <5% latency impact). |  
  | **Verbal Dispute: Scope of "Artifact"** | "The artifact is the code’s *functional core* (e.g., 'drop requests'); values are external." | "The artifact includes the *design choices* (e.g., 'how to drop'), which are political." | **Purely verbal**: Depends on defining "artifact" as either (a) the minimal technical function or (b) the implemented design. | N/A (Verbal) – Both agree the dispute reduces to semantics. | N/A |  

  ---  
  **Signed,**  
  *Internal-Logic Camp Representatives*  
  *Design-Choice Camp Representatives*  

  ---  
  ### Notes on the Joint Statement  
  - **Cruxes** are framed to force falsifiable predictions, preventing post-hoc reinterpretation.  
  - **Shared tests** focus on measurable outcomes (e.g., latency impact, drop-rate disparities) to avoid subjective debates.  
  - **Predictions** diverge empirically (e.g., IL expects <5% policy diversity; DC expects >30%).  
  - **Verbal disputes** are explicitly flagged to prevent deadlocks over definitions. Both camps agree that "politics exists in the system" but contest whether it is *in* the artifact or *acted through* it.
