  - **D: Self-Indication Assumption (SIA)**  
    Probability of a world ∝ number of observers in it.  
  - **E: Strong Self-Sampling (SSSA)**  
    Sample uniformly over observer-moments with identical evidence.  
  - **F: Unstable hybrid**  
    Endorse SIA but reject extreme cases (e.g., Presumptuous Philosopher).  
  - **G: Self-Sampling (SSA) with broad reference class**  
    Sample uniformly over all observers in a class (e.g., "humans").  
  - **H: Hybrid SSA**  
    SSA with context-sensitive reference class (e.g., Doomsday refines class choice).  
  - **I: Reject SSA**  
    Doomsday reductio undermines self-sampling. (Unstable)  

