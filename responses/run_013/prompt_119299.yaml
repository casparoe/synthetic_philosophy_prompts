  ### Decision Tree for Self-Locating Belief & Anthropic Reasoning  
  *Begin at Q1. Answer sequentially based on your commitments.*  

  #### Branch Nodes  
  **Q1: Is self-locating uncertainty (e.g., "which observer am I?") meaningfully distinct from non-indexical uncertainty?**  
  - **Yes** → Q2  
  - **No** → Leaf A  

  **Q2: In the Archivist’s Coin (fair coin; heads: 1 observer, tails: 1M observers, all identical), your credence for heads is:**  
  - **1/2** → Q3  
  - **~1/1,000,001** → Q4  
  - **Undefined/arbitrary** → Leaf B  

  **Q3: In a variant: if tails, Archivist flips again; second tails creates another 1M observers. After learning this rule (pre-second flip), your credence for first heads is:**  
  - **Still 1/2** → Leaf C  
  - **Lower than 1/2 (e.g., ~1/1,500,001)** → Leaf D  

  **Q4: Your ~1/1M credence arises because:**  
  - **I am equally likely to be any observer** → Q5  
  - **More observers imply higher probability of tails-world existing** → Q6  

  **Q5: The reference class for "any observer" should include:**  
  - **Only observers with identical evidence/memories (subjectively indistinguishable)** → Leaf E  
  - **A broader class (e.g., all humans, regardless of evidence)** → Q7  

  **Q6: Presumptuous Philosopher: Without looking, must you believe the universe is large/infinite on a priori grounds?**  
  - **Yes (acceptable consequence)** → Leaf D  
  - **No (reductio)** → Leaf F  

  **Q7: Doomsday argument is:**  
  - **Sound (shows humanity likely ends soon)** → Leaf G  
  - **Unsound but instructive (e.g., reveals reference-class flaws)** → Leaf H  
  - **A reductio of the principle** → Leaf I  

  **Q8 (From Q3 → Lower): Your lower credence arises from:**  
  - **Indifference over possible observers** → Leaf D  
  - **Reference-class weighting** → Leaf G  
  - *(Tree assumes these cover major options; other answers map to Leaf B or F)*  

  #### Leaf Positions  
  - **A: Non-indexical conditioning**  
    Reject anthropic principles; condition only on non-indexical evidence.  
  - **B: Reject anthropic probability**  
    Self-locating uncertainty lacks objective probabilities. (Unstable)  
  - **C: Non-indexical conditioning**  
