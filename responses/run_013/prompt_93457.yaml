  ## The Weight of Multiplicity: What Duplication Reveals About Rescue Ethics

  The sanitized rescue scenario – one life versus five, strangers all – has calcified into a sterile stalemate. Aggregators invoke a grim arithmetic: five deaths are worse than one. Anti-aggregators, championed by Taurek, reject this summation: each life embodies a unique, incommensurable world; sacrificing one for five treats individuals as fungible units, violating a fundamental respect for persons. The lottery, they argue, honors each distinct claim equally. But this stalemate assumes an atomistic separateness that is far from universal. Introduce duplication, and the foundations crack. The cases you present aren't mere thought experiments; they are acid tests for the concept of "distinct persons" itself.

  **Case 1: Saving Five Near-Duplicates vs. One Ordinary Person**

  Imagine: five beings, cloned moments ago, psychologically identical, poised at the cusp of divergent lives. Beside them, one unique individual. The anti-aggregative view stumbles here. Its core defense – the irreplaceable distinctness of persons demanding equal consideration – faces profound pressure.

  Proponents of the lottery argue strenuously: "Distinctness isn't psychological uniqueness *at this instant*; it's the *potential* for a unique life-path. Each clone, though identical *now*, is a separate physical entity about to embark on an irreducibly individual existence. Sacrificing four of them to save the unique one ignores their future distinctness and violates their equal claim to that potential future. The lottery remains the only fair arbiter among six distinct claimants to life."

  This defense, while coherent, feels strained. The *present* basis for the "distinct claim" is profoundly thin. The clones share the same memories (if any), the same personality, the same hopes (to the extent they exist nascently). Their numerical distinctness feels almost arbitrary, a consequence of physical replication rather than deep psychological individuation. The aggregator’s retort gains force: "What are we respecting here? Not five unique worlds of experience *yet formed*, but five *instances* of the same nascent template. Saving the five isn't sacrificing a unique world for a sum; it's preserving *more instances* of a nascent existence about to blossom. The 'distinctness' is currently nominal; the potential life-loss is starkly quantitative." The lottery, in this light, seems to grant undue moral weight to the mere accident of physical separation at the moment of choice, prioritizing a procedural abstraction ("separate bodies") over the tangible future reality: five lives lived versus one. The anti-aggregative stance risks becoming an empty formalism, clinging to separateness where the substance of distinct individuality is yet to emerge.

  **Case 2: Saving One (Who Will Duplicate) vs. Five Ordinary Strangers**

  Now reverse it: Save one ordinary person who, if spared, will shortly be duplicated into five psychologically distinct individuals. Or save five ordinary strangers. This scenario eviscerates the anti-aggregative position.

  The aggregator’s argument is devastatingly simple: "Saving the one *is* saving five. The outcome is identical: five lives saved. Choosing the five strangers yields the same numerical result, but saving the one avoids immediate death for anyone *now* and achieves the identical future state." The lottery becomes incoherent applied to the one. How do you grant a "chance" to be saved to an entity whose survival *is* the survival of five? Running a lottery here – giving the one only a 1/6 chance against the five – would be senselessly destructive. It treats the one as merely *one*, ignoring the causal chain that makes saving them equivalent to saving five distinct future persons. To insist on a lottery is to prioritize the *current* numerical configuration (one body vs. five bodies) over the *actual future lives* at stake. It elevates the separateness of claimants at the moment of crisis to a fetish, blinding us to the concrete reality of lives created or lost.

  The strongest Taurekian defense collapses: "We must respect the claims of the five *existing* strangers *now*. The potential five are not claimants; they don't exist yet. We cannot sacrifice existing persons for merely potential ones." This is true, but irrelevant. Saving the one *does not sacrifice* the five strangers for the potential five; it sacrifices the five strangers *full stop*. The potential five are a *consequence* of saving the one, not the *reason* for sacrificing the five. The reason to save the one is the same aggregative reason: it leads to five lives saved. The potential duplication doesn't create a *new* moral claim; it reveals that saving the one *achieves the same aggregative good* as saving the five strangers. The lottery, by ignoring this causal reality and insisting on treating the one as having only a single claim, fundamentally *undervalues* the actual future life that saving them creates. It treats persons as interchangeable only in the sense that it refuses to acknowledge the specific, identity-creating *causal power* inherent in saving *this particular one* under *these specific conditions*.

  **Verdict: Numbers Count Because Lives Do**

  These duplication cases reveal that the core dispute isn't ultimately about simple arithmetic versus mystical separateness. It's about *what constitutes the moral weight we assign to a "person"* and *how we value potential futures*. The anti-aggregative view, in its pure Taurekian form, rests on an implausibly static and formalistic conception of personhood. It prioritizes the *current, isolated claimant* over the *life-path* that claimant embodies or enables. In Case 1, it struggles to justify valuing the near-identical potential of five clones equally against one unique existing life, exposing how "distinctness" requires more than just physical separation. In Case 2, it becomes actively incoherent and morally perverse, refusing to acknowledge that saving one person *can be identical* in outcome to saving five, purely because the five saved via duplication weren't present at the moment of choice.

  The aggregative view, conversely, focuses on the value of *lives lived*. It asks: "How many unique streams of consciousness, experiences, and futures are preserved or lost?" It recognizes that identity isn't always atomistic at the moment of crisis; it can be nascent (Case 1) or causally latent (Case 2). Numbers count because each number represents a future world of experience that is extinguished. The five clones represent five such nascent worlds; saving the one who duplicates preserves five actualized worlds.

  Therefore: **Numbers count.** But they count not because of bare arithmetic, nor because persons are interchangeable fungible units. They count because each life saved represents the continuation or creation of a unique, irreplaceable subjective world. The distinctness of persons matters profoundly – it's why we value *any* life. But this distinctness isn't negated by counting; it's the very *reason* we count. Sacrificing one distinct world to save five others is a tragic necessity, not a denial of the sacrificed individual's worth; it's an agonizing recognition that *more* unique worlds of value are preserved. The lottery, while appealing in symmetrical cases of atomistic strangers, fails when the symmetry is broken by potentiality or nascent identity. It mistakes procedural fairness among *current claimants* for the substantive goal of preserving *future lives*. The duplication cases show that the anti-aggregative position, by refusing to look beyond the immediate claimants, ultimately fails to fully honor the value of the distinct lives it seeks to protect. We count lives because lives – present and potential, nascent and actualized – are what matter.
