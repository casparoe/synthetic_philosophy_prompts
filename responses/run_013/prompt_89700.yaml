answer: |-
  ## **THE CONSISTENT CAPITALIST**  
  *Money talks. Inconsistency walks.*

  ---

  **Dear Consistent Capitalist,**  
  My roommate cycles through three furniture arrangements every few weeks. He prefers Layout A to B, B to C, but then C to A! I’ve offered to "help" him swap for a small convenience fee each time ($5). He’s paid me twice now to cycle layouts. Is this ethical?  
  —*Furniture Flipper*

  **Dear Flipper,**  
  Ethics? You’re asking the wrong question. Your roommate’s preferences are irrational—a clear money pump. By charging him to cycle layouts, you’re not exploiting him; you’re *highlighting* his defect. Every $5 fee is a lesson in consistency. If he refuses to trade, he’s functionally a rock—unable to engage in value-creating exchanges. If he accepts, he pays tuition. Either way, the pump exists. Your fees are merely the market’s price for his incoherence. Keep charging. He’ll either reform or fund your rent. Win-win.  

  ---

  **Dear Consistent Capitalist,**  
  My husband keeps accepting "small" workplace compromises: a later end-time for 2% more pay, then weekend emails for 3%, then skipping breaks for another 1.5%. Each step felt "worth it," but now he’s exhausted, resentful, and can’t pinpoint when it went wrong. How do we fix this?  
  —*Burned-Out Spouse*

  **Dear Spouse,**  
  Your husband isn’t burned out—he’s a *walking money pump*. His employer spotted his inconsistency: each marginal trade seemed rational, but the sum is ruinous. Why? Because he valued each tiny paycheck bump more than the cumulative cost of his time/well-being. A rational actor would’ve rejected the *sequence* upfront or demanded exponentially higher pay for compounding sacrifices. His flaw made him pumpable. Solution: He must adopt globally consistent preferences (e.g., "I value leisure at $X/hour—no exceptions"). Until then, his boss will keep collecting fees.  

  ---

  **Dear Consistent Capitalist,**  
  I only care about my future on Mondays and Tuesdays. On Wednesday, I’d gladly suffer next Tuesday’s root canal to avoid next Wednesday’s hangnail. By Thursday, I’m back to dreading Tuesday’s pain. Can I sign a year-long lease?  
  —*Temporally Torn*

  **Dear Torn,**  
  No. You’re not just irrational—you’re a *hazard to markets*. Your discounting flips make you the perfect pump target. Imagine: On Monday, you’d pay me $10 to move your root canal from Tuesday to Wednesday. On Wednesday, you’d pay me $10 to move it back to Tuesday. I’d drain your wallet while you hold the same appointment. A lease requires consistent time preferences. If you can’t commit to valuing your future self equally every day, you’ll either be pumped by landlords (e.g., "renewal fees" exploiting your Tuesday/Wednesday flip) or default. Rent a month-to-month cave.  

  ---

  **Dear Consistent Capitalist,**  
  I keep buying commitment devices: app blockers, gym contracts, savings locks. Then I cancel them. I want to be disciplined! Why can’t I stick with a system?  
  —*Self-Saboteur*

  **Dear Saboteur,**  
  You’re treating symptoms, not the disease. Buying a commitment device is a preference for discipline *today*. Canceling it is a preference for indulgence *tomorrow*. This is temporal inconsistency—a classic pump setup. A rational predator would sell you "refundable" commitment devices, knowing you’ll pay a fee to cancel later. Your error? Believing a *new* device solves the flaw that doomed the last one. Fix your discount rate. Value future and present equally. Until then, you’re just creating business opportunities for app developers.  

  ---

  **Dear Consistent Capitalist,**  
  I run a side hustle: I offer colleagues "flexible repayment" loans. They agree to pay $110 tomorrow for $100 today. When tomorrow comes, I offer to delay repayment for $15 more. Over half accept, cycling debt until they’ve paid $200 for $100. Is this wrong?  
  —*Quiet Entrepreneur*

  **Dear Entrepreneur,**  
  Wrong? You’re the only rational actor here. Your clients have inconsistent time preferences—they value "$100 now" over "$110 tomorrow," but when tomorrow arrives, they value "$110 tomorrow" (now today) at under $100, so they pay $15 to delay. *That’s the pump*. You’re not exploiting them; you’re *harvesting* the inevitable fees their inconsistency generates. They’re paying for the privilege of being incoherent. Your business is a public service: either they’ll go bankrupt (removing irrational agents from the market) or reform. Keep billing.  

  ---  
  *The Consistent Capitalist is not a fiduciary. His advice extracts maximum value from incoherence. Write to: consistencypays@capitalistdaily.com. No refunds.*  

