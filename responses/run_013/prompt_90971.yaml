  **In-character reply:**  
  A delightful case, but it merely demonstrates that *conscious articulation* of propositional knowledge isn't necessary for skill—not that such knowledge is absent. Mara possesses tacit *knowledge-that* about fine-grained motor sequences, acquired through practice. When fencing well, her successful movements are causally governed by subpersonal cognitive structures encoding propositions like *"given proprioceptive input X, muscle group Y should contract at intensity Z"*. The coach's verbal rule was a heuristic crutch; its falsity is irrelevant because her true competence resides in sensorimotor representations refined through repetition. When she attempts to apply the new biomechanical rule consciously, she disrupts this automated processing by introducing deliberative interference—akin to overthinking a golf swing. The regress halts at implementation: applying these motor propositions isn't further *know-how*; it's subpersonal computation. Your "body doing whatever it does" *just is* the physical instantiation of these non-linguistic truths. Skill *is* embodied knowledge of ways—truths about action-environment couplings.  

  **Off the record:**  
  Moderately confident (65%). The core claim holds water against your case—tacit propositional accounts *can* handle automated skills. But the weakest point is insisting motor representations are "propositions" rather than non-propositional dynamic patterns. Calling subpersonal sensorimotor loops "knowledge of a way" stretches the term thin; it risks becoming a verbal shell game where *any* successful function is retrofitted as "knowing-that." The regress objection bites hardest here: if "applying" a motor proposition requires no know-how, we've redefined "proposition" beyond recognition. I'd pivot to calling it *structural* knowledge-that to salvage it, but that's dodgy.  

  Ready to parry your next thrust. What grounds your claim that Mara's "just doing it" lacks propositional structure?
