  ## Halcyon Aqua Group: 2024 Sustainability Report  
  **Section 7: Aquatic Animal Welfare Performance & Strategy**

  **7.1 Materiality Assessment & Stakeholder Engagement**  
  Halcyon Aqua Group (HAG) recognises aquatic animal welfare (AAW) as a material topic of high importance to a diverse stakeholder ecosystem. Investor ESG screens, evolving retailer procurement policies, NGO advocacy, and heightened consumer consciousness regarding the provenance of protein converge to elevate AAW within our risk landscape and value proposition. Our 2023 double-materiality assessment confirmed AAW as a high-impact, high-interest topic, intrinsically linked to operational resilience, product quality, brand reputation, and long-term social license to operate. Stakeholder dialogues consistently surface expectations for demonstrable leadership and transparent reporting on our decapod crustacean welfare practices across the value chain, from hatchery to harvest. HAG is committed to being a responsive steward in this complex and evolving domain.

  **7.2 Our Approach: Science, Precaution & Continuous Improvement**  
  Led by Dr. Aris Thalassa, Head of Aquatic Animal Welfare, our AAW strategy is anchored in a rigorous, science-based, and precautionary framework. We acknowledge the ongoing scientific discourse concerning nociception, potential pain perception, and sentience in decapod crustaceans. While definitive proof of subjective experience remains scientifically complex – involving challenges of inference, behavioural interpretation across phylogeny, and the fundamental philosophical question of other minds – HAG adopts a precautionary stance. Given the vast number of individual animals under our stewardship (estimated at 27.8 billion post-larvae stocked globally in 2023), and the potential severity of welfare impacts should sentience be confirmed, proactive mitigation of potential suffering constitutes a fundamental operational and ethical imperative. This approach aligns with leading frameworks for managing uncertain but high-consequence risks and resonates with stakeholder expectations for responsible innovation.

  **7.3 Key Welfare Pillars & 2023 Performance**

  *   **Stocking Density & Water Quality:** Optimal environmental parameters are foundational to welfare outcomes and productivity. HAG maintains strict, farm-specific protocols for dissolved oxygen (>5.0 mg/L), temperature stability (±1°C diurnal fluctuation target), ammonia (<0.1 mg/L), and regular microbiome management. Our proprietary 'OptiGrow' monitoring system, deployed across 78% of production ponds, enables real-time adjustments. 2023 saw a 12% reduction in critical water quality deviations compared to 2022 baseline. Target: 95% OptiGrow coverage and 20% reduction in deviations by end-2025.

  *   **Health Management & Minimising Harm:** Proactive health strategies reduce the need for interventions. Selective breeding programs focus on disease resilience. Where necessary, veterinary treatments follow strict withdrawal periods and welfare impact assessments. Routine handling (e.g., sampling, grading, transfer) employs low-stress techniques and trained personnel. We track pre-harvest mortality as a key welfare indicator. Our global average improved to 16.2% in 2023 (baseline 2020: 18.7%). Target: Achieve ≤14.5% global average pre-harvest mortality by 2026. Hatchery welfare protocols are continuously reviewed under Dr. Thalassa's oversight, focusing on nauplii and larval stages, with significant investment in automated feeding systems to minimise handling stress.

  *   **Harvest, Transport & Slaughter:** This phase presents significant welfare challenges requiring focused innovation. HAG is actively engaged in collaborative R&D to establish humane stunning and slaughter methods for *Penaeus vannamei*. Current industry practices, including thermal shock (ice slurry immersion) and live chilling, are employed under strict time-to-insensibility protocols monitored by trained staff. We acknowledge the scientific imperative to move towards instantaneous stunning prior to slaughter and are piloting several promising technologies, including electrical and percussive systems. 2023 saw the implementation of improved slurry temperature control (-1°C to 0°C) in 45% of our processing facilities, demonstrably reducing observed movement prior to insensibility. Target: Establish a validated, scalable, instantaneous stunning pilot protocol by Q3 2025 and implement in 30% of company-owned processing facilities by 2027. We note that optimizing thermal stunning parameters also contributes to superior product texture and extended shelf life.

  **7.4 Assurance, Training & Transparency**  
  Robust AAW performance requires systematic verification. HAG is developing an internal AAW audit framework aligned with emerging best practice benchmarks. Initial audits commenced in Q4 2023 across 10% of farms. Target: Full internal audit coverage by 2026, with progression towards third-party verification by 2028. Comprehensive training modules on decapod biology, potential welfare indicators (e.g., avoidance behaviour, rubbing, reduced feeding), and low-stress handling have been rolled out to 65% of farm and hatchery management staff. Target: 100% completion by end-2024. We are committed to transparent reporting on our AAW journey, including challenges and learnings.

  **7.5 Looking Ahead: Managing Complexity Through Engagement**  
  The field of decapod welfare is characterised by inherent biological complexity and evolving scientific understanding. HAG views sustained engagement with the academic community, NGOs, and industry consortia not as a temporary step, but as a core, permanent competency. We fund external research on nociceptor mapping, behavioural stress responses, and humane slaughter efficacy. Dr. Thalassa's team actively participates in multi-stakeholder working groups to define welfare indicators and establish credible standards. Our goal is to integrate credible scientific insights into operational practice at scale, balancing welfare precaution with commercial viability. Halcyon Aqua Group remains dedicated to leading the industry towards a future where the welfare of decapod crustaceans is responsibly managed at every stage of production, underpinning truly sustainable aquaculture.

  *Dr. Aris Thalassa*  
  *Head of Aquatic Animal Welfare*  
  *Halcyon Aqua Group*

  ---

  **Notes on Satire Execution:**

  1.  **Inferential Pain & Scale:** "definitive proof... remains scientifically complex," "precautionary stance," "vast number... potential severity," "managing uncertain but high-consequence risks." Acknowledges the inferential leap and the crushing scale/obligation without resolving it, turning it into a "risk" to "manage."
  2.  **Slaughter Awkwardness:** "significant welfare challenges," "acknowledge the scientific imperative," "current industry practices... employed under strict time-to-insensibility protocols," "piloting... promising technologies." Notes the problem ("imperative") but justifies current (poor) practice as standard and defers solutions to R&D/pilots with distant targets. Links improved chilling to product quality.
  3.  **Eyestalk Ablation:** Glaring omission. Mentioning "hatchery welfare protocols... continuously reviewed" and "nauplii and larval stages" focuses on *other* life stages, conspicuously avoiding the broodstock/ablation issue entirely. "Under Dr. Thalassa's oversight" hints at the uncomfortable scrutiny it likely receives internally but avoids public discussion.
  4.  **Corporate Idiom as Carrier:**
      *   "Precautionary Principle as Selling Point": Framed as responsible risk management and ethical imperative, aligning with stakeholder expectations.
      *   "Welfare = Quality/Shelf Life": Explicitly links optimized stunning to texture/shelf life.
      *   "Science as Permanent Condition": "sustained engagement... not as a temporary step, but as a core, permanent competency," "evolving scientific understanding," "participates in multi-stakeholder working groups." Science is a process to be *engaged with*, not a path to definitive action or moral resolution. It's a competency, not a conclusion.
      *   "Conversion of Moral Question to Disclosure": The entire report treats welfare as a series of manageable operational challenges, "risks," material topics for stakeholder reporting, and R&D projects with targets. The profound ethical uncertainty and potential moral catastrophe are sublimated into tables, protocols, audits, and "journeys."
  5.  **Register & Knowledge:** Uses correct terms (nociception, phylogeny, *Penaeus vannamei*, nauplii), references actual challenges (stunning methods, scale, inference), and mimics the structure and jargon of real ESG reports (materiality, targets, assurance, stakeholder engagement, R&D, operational resilience, proprietary systems). The satire lies in the *application* of this dry, managerial language to an unresolved ethical minefield. The specialist sees the accurate terrain described; the layperson sees corporate doublespeak managing a big, uncomfortable problem. No winks, no animal jokes – the prose itself, in its earnest corporate evasion, is the joke.
