answer: |-
  Here are five defeaters to your consequentialist reading of Buddhist ethics, ranked from most to least decisive:

  1.  **The Primacy of Intention (Cetana):** Buddhist ethics fundamentally prioritizes volitional intention (*cetana*) as the karmic determinant over actual consequences; an action with bad intentions but accidentally good results accrues negative karma, directly contradicting consequentialism's focus on outcomes. A sympathetic scholar would concede this as a heavy cost, as intention is core to karma theory in all major schools.
  2.  **The Inviolability of Certain Precepts (Sīla):** Core precepts (e.g., against killing, lying, stealing) are often presented and practiced as absolute constraints (*akaranīya*), even in situations where violating them *might* seem to reduce suffering (e.g., killing a tyrant); justifications typically appeal to intrinsic wrongness or karmic corruption, not net consequences. Consequentialist absorption requires significant qualification, making the "rules of thumb" claim thinner.
  3.  **Karma as Inescapable Moral Law vs. Causal Feedback:** While karma is causal, its operation is frequently described in highly moralistic, retributive terms ("reaping what one sows," specific karmic fruits for specific deeds) and linked to rebirth realms determined by moral quality, not just overall suffering reduction. This functions more like a deontic cosmic justice system than a neutral consequentialist feedback loop. A virtue ethicist reading aligns better with the character-forming aspect.
  4.  **The Value of Non-Sentient "Goods":** Buddhist ethics values states like wisdom (*prajñā*), awakening (*bodhi*), and purity (*viśuddhi*) intrinsically, not merely instrumentally for suffering reduction; these are goods for the practitioner *beyond* their welfare impact on sentient beings. Consequentialism struggles to accommodate these non-sentient-focused values without stretching "welfare" beyond recognition.
  5.  **The Bodhisattva's Paradoxical Sacrifice:** The ideal Bodhisattva vows to postpone their own final Nirvana (the ultimate cessation of suffering *for themselves*) to help *all* others achieve it first. This maximizes suffering duration for the Bodhisattva and potentially delays overall suffering reduction, contradicting strict consequentialism which would prioritize the agent's own swift liberation to maximize efficacy. Defenders might call it "supererogatory," but it's presented as the ideal path.
