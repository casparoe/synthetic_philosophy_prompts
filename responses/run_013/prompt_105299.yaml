prompt: |-
  Ok so my reading group is doing Parfit's hitchhiker this week and I've written myself into a corner with an arguement that proves way to much. I need a second pair of eyes before I embarrass myself.

  The case, fast, for anyone who's forgotten it: I'm stranded in the desert, out of water, when a driver pulls up. He'll take me to town only if I promise to pay him a big sum once we get there. We both know that after we arrive he has no way to make me pay, and we both know that when the time comes I'd rather keep my money.

  Now the arguement.

  (1) An act of mine is rational just in case, given how things actually go, it gets me the best outcome available to me.
  (2) Standing at the roadside I have two options: promise-then-pay, and promise-then-stiff-him. The second leaves me just as well off as the first in every respect except that I keep the money, so it's strictly better.
  (3) So the rational act is to promise and then stiff him.
  (4) But the driver is no fool — if he works out that I'm the stiffing type, he drives on and I die of thirst.
  (5) And even if he does believe me and takes me, once we're in town the best thing for me to do is still to stiff him.
  (6) So either way, doing the best available thing at each point gets me either no ride at all or a worse life than the credulous dope who pays up.
  (7) A theory of rationality on which the rational thing leaves you worse off than the irrational thing is a non-starter.
  (8) So (1) is false.

  My friend built this and says it's a clean reductio of act-consequentialism, and that Parfit's 'dispositions' move just changes the subject — sure, a standing disposition to pay is good for me, but that isn't what's being asked; what's being asked is which act is rational, and at the moment that matters the stiffing act is the rational one. I half think he's begging some question but I can't name it, and I'd really rather keep (1) if there's any way to.

  So: which premise or step goes, why did it look so innocent, and what does dropping it actually cost me? Do I have to buy into the whole self-effacing-theory / rational-irrationality business to save the rest, or is that just relabeling the problem and calling it a solution?
reasoning: |-
  Okay, the user is dealing with Parfit's Hitchhiker thought experiment and has constructed an argument that seems to refute act-consequentialism. They're worried that their argument proves too much and might embarrass them in their reading group. Let me unpack this step by step.

  First, the scenario: The hitchhiker is stranded, and a driver offers a ride only if they promise to pay later. Once in town, the hitchhiker can stiff the driver since there's no enforcement. The argument concludes that stiffing is rational under act-consequentialism but leads to worse outcomes, thus refuting (1).

  The user's friend claims this is a reductio of act-consequentialism and dismisses Parfit's dispositional approach as changing the subject. The user wants to save (1) if possible but feels stuck. Their deeper need is to understand where their argument fails without resorting to complex solutions like self-effacing theories.

  Looking at the argument, premise (1) is the act-consequentialist definition. The key issue is step (5): "once we're in town, the best thing is to stiff him." This seems correct at that moment, but the problem arises because the driver anticipates this. If the hitchhiker is known to be a stiffing type, they don't get a ride. So, the rational act at the desert depends on future actions.

  The flaw is in the evaluation of options at the roadside. The user presents only two options: promise-then-pay and promise-then-stiff. But in reality, promising-then-paying isn't a single act; it's a sequence. If the hitchhiker can commit to paying, they get the ride. But without commitment, promise-then-stiff is better at the roadside only if the driver believes they'll pay. Without that belief, stiffing isn't even an option because there's no ride.

  The user is missing that the set of available options isn't fixed. The driver's choice depends on the hitchhiker's perceived type. If the hitchhiker can't commit, their only options are to die or pay (if taken). But paying isn't available without trust. So act-consequentialism faces a problem here because it evaluates each act separately, not sequences.

  Dropping step (5) isn't right because stiffing is locally rational in town. The cost of rejecting (1) is adopting a different theory, like disposition-based rationality. The user might resist this, seeing it as relabeling the problem. But without it, they have to accept that act-consequentialism fails in sequential dilemmas, which is a known critique. Parfit's solution addresses this by evaluating dispositions instead of isolated acts, which the user's friend dismisses unfairly. The user needs to recognize that the disposition approach isn't changing the subject but offering a coherent alternative that resolves the paradox.
answer: |-
  You've hit on one of the most persistent problems in decision theory – and your friend's argument is clever but flawed. The critical error is in **premise (2)** and the framing of "options" at the roadside. Let's break it down:

  1.  **The Problem with Premise (2):**
      *   Premise (2) states: "Standing at the roadside I have two options: promise-then-pay, and promise-then-stiff-him."
      *   **This is false.** Standing at the roadside, you *cannot* simply *choose* the option "promise-then-stiff-him." The driver will only let you make the promise *if he believes you will keep it*. If he believes you are the type to stiff him, he drives away. Your "option" of "promise-then-stiff-him" *depends entirely* on the driver not knowing you will stiff him.
      *   **What your options *actually* are:**
          *   **Option A: Be the paying type.** You have a disposition to keep your promises. You sincerely promise and intend to pay. The driver, believing your promise (because you are sincere), gives you the ride. You pay. Outcome: Alive, but poorer.
          *   **Option B: Be the stiffing type.** You would promise intending to stiff him. However, *if the driver can detect this*, he drives away. Outcome: Dead. *If* the driver somehow believes your insincere promise (e.g., you're a brilliant liar, he's incredibly gullible), you get the ride and stiff him. Outcome: Alive, richer.
          *   **Crucially:** You cannot *directly choose* "promise-then-stiff-him" *as a guaranteed course of action* from the roadside unless you can *also* guarantee the driver's false belief. The driver's belief is an external factor determining which outcomes are even achievable based on your type/disposition.

  2.  **Why Premise (2) Looks Innocent:**
      *   It seems intuitively like you can just *decide* at the roadside to promise and then later stiff him. The error is ignoring the *epistemic* and *strategic* interdependence. Your ability to *successfully initiate* the "promise-then-stiff" sequence depends on the driver being deceived *at the time of the promise*. Act-consequentialism, as defined by (1), evaluates acts based on their actual outcomes. The outcome of uttering the promise *right now* depends critically on the driver's *current belief* about your future action. If he disbelieves you, uttering the promise leads to death (him driving away). If he believes you, uttering the promise leads to the ride and sets up the later choice. Premise (2) treats "promise-then-stiff" as an atomic action with a guaranteed outcome, which it isn't.

  3.  **The Cost of Dropping Premise (2):**
      *   **You have to accept that rationality sometimes depends on dispositions or types, not just isolated acts.** You can't evaluate the rationality of the act of promising *in isolation* from the driver's beliefs about your character or future actions. The *feasibility* and *consequences* of the act depend on these factors.
      *   **You have to think in terms of strategies or plans over time.** The rationality of an early act (the promise) can depend on the rationality of later acts (paying/stiffing) and vice-versa, creating a loop that simple act-consequentialism struggles with.
      *   **You lose the simplicity of evaluating single acts in isolation.** This is the core cost. Act-consequentialism (as defined by (1)) is appealingly simple but often inadequate for sequential interactions involving trust, threats, promises, and pre-commitment. Real-world rationality often requires considering how your current choice affects future options and others' perceptions.

  4.  **Re-Evaluating the Steps:**
      *   **(3) & (5) are locally correct *if* you get to the later choice points:** *Given* that you've made the promise *and* been given the ride, stiffing *is* the act-consequentially rational choice in town (it yields a better outcome: alive + money vs. alive - money). *Given* that the driver believes your promise, uttering it *is* rational at the roadside if you *can* stiff him later (it yields alive + money vs. dead).
      *   **The problem is the connection:** The condition required for uttering the promise to be rational (driver believes you) is undermined by the rational act later (stiffing). The driver knows this, so if he *knows* you are a pure act-consequentialist who will stiff him later, he *won't* believe the promise, making uttering the promise irrational (leading to death). This is the dilemma.
      *   **(6) & (7) are correct descriptions of the problem:** Pure act-by-act consequentialism *does* lead to a worse outcome for the agent in this scenario compared to someone who irrationally (by act-consequentialist lights) pays up, or more realistically, someone who has a rational *disposition* to keep promises.
      *   **(8) is the conclusion:** Premise (1), pure act-consequentialism defined solely on the outcome of the single act, *is* inadequate here.

  5.  **Addressing Your Friend and Parfit:**
      *   Your friend is **incorrect** that Parfit's disposition move "changes the subject." It directly addresses the flaw in premise (2). Parfit argues that *what is rational* for the agent to *be* (a paying-type person with a disposition to keep promises) is different from what act-consequentialism says is the rational *act* at the later moment. The disposition *is* rational (it gets the best overall outcome: alive, poorer but alive) even though the specific act it leads to (paying) is locally suboptimal *if evaluated in isolation*. Parfit is arguing that the *theory* of rationality needs to account for this.
      *   You **do** need to engage with the "self-effacing theory" or "rational irrationality" ideas to save a broadly consequentialist outlook. This means accepting that:
          *   The *most rational state* for an agent to be in (a disposition to keep promises) might sometimes cause them to perform *locally irrational acts* (paying when stiffing yields more).
          *   The *correct theory of rationality* might sometimes advise agents *not* to think directly in terms of that theory at the moment of action (e.g., "Don't think like an act-consequentialist when deciding whether to pay; just be the kind of person who pays because you promised").
      *   **Is this just relabeling?** No. It's proposing a different *unit of evaluation* (dispositions, strategies, character traits) as fundamental to rationality in sequential and strategic interactions, precisely *because* evaluating isolated acts leads to self-defeating outcomes like this. It acknowledges that rationality is often about setting up the *conditions* for good outcomes over time, not just maximizing at each instantaneous choice point.

  **Conclusion & How to Proceed:**

  *   **Reject Premise (2).** It misrepresents the actual options available at the roadside. Your options are fundamentally tied to your type/disposition and the driver's perception of it. You cannot simply choose the atomic sequence "promise-then-stiff" with guaranteed success.
  *   **The Cost:** You must abandon pure act-by-act consequentialism (premise 1) as a complete theory of rationality, at least for sequential decision problems involving trust and commitment. It fails here.
  *   **The Solution Path:** To salvage a consequentialist view, you *do* need to embrace something like Parfit's disposition-based approach or a more sophisticated theory (e.g., sophisticated choice in dynamic consistency, rule consequentialism, or even evidential/functional decision theories). This acknowledges that rationality sometimes requires:
      *   Cultivating dispositions that lead to locally "irrational" acts but globally better outcomes.
      *   Evaluating strategies or plans over time, not just isolated acts.
      *   Recognizing that the rationality of an act depends on its context within a sequence and others' beliefs about your future rationality.
  *   **In your reading group:** Frame it as exposing the limitation of *naive* act-consequentialism. The argument shows that premise (1) leads to contradiction *if* we assume the agent can freely choose any sequence of acts regardless of others' strategic responses. But in reality, the driver's response depends on his anticipation of the agent's future act-consequentialist reasoning, creating a fatal interdependence. Parfit's move isn't changing the subject; it's offering a more robust theory that resolves the interdependence by making dispositions the primary object of rational evaluation. The "rational irrationality" isn't just a label; it's a structural feature of rationality in a world of strategic interaction over time.
