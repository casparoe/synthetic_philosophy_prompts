prompt: |-
  Ok, I'm meant to be writing the chapter where I say what a theory of meaning for the intuitionistic logical constants actually has to deliver, and instead I keep writing one hand-wavy paragraph and then going off to make tea. Can you do it properly for me: the full desiderata list, not a survey of who said what. For each requirement I want the thing motivating it -- the case it has to get right, the distinction it can't collapse, the result it can't contradict -- and then say which ones are non-negotiable and which are just a camp's preference. The bit I actually care about is the pairs that look jointly unsatisfiable; if the list is inconsistent then that's a result and I want it flagged, with the argument. Also tell me which single requirement does the most to rule out candidates.

  Rough shape of what I'm after, so you dont drift. It has to fix what the connectives mean well enough to explain why disjunction and existence behave as they do -- a proof of A or B has to be a proof of one of them, not merely a proof that one of them is true -- and it has to explain that, not just permit it. It has to say what a proof from an assumption is, since the BHK story is told for closed proofs and the introduction rule for the conditional takes you from an open derivation to a closed one. It has to distinguish canonical from non-canonical proofs without collapsing the distinction, because no mathematician ever writes down a canonical proof and that's exactly what normalisation is supposed to buy you. It mustn't be a finite truth-table job -- I'm fairly sure no finite matrix gives you intuitionistic propositional logic, so anything that amounts to one is dead on arrival -- and it mustn't be a three-valued 'some sentences are neither true nor false' story either, because that misdescribes the position: 'not refuted' has to come apart from 'proved' without becoming a third truth value. It has to respect the asymmetry with classical logic, so classical reasoning comes out right for the stable/decidable fragment and wrong in general, and the double-negation translation gets explained by the semantics rather than looking like a trick that happens to work. And it has to stay neutral on the questions the logic deliberately leaves open -- I don't want a semantics that quietly decides for or against the extra principles people bolt on (continuity, computability, that sort of thing) just because of the metatheory it's built in; relatedly I want a verdict on whether proving the completeness results classically is question-begging for an anti-realist or just harmless machinery. And don't let 'true' collapse into 'provable in some particular formal system', I'll have a fit if I see that.

  Then two or three lines each on how the BHK/proof-theoretic line, the Kripke-ish line (and its topological/topos relatives), and the 'just translate classical logic into intuitionistic logic' line come out against the list. No reading lists please, I can't look anything up from here and I'd rather have the list itself. I'm meant to be arguing that a genuinely anti-realist semantics has to be proof-theoretic rather than model-theoretic, so if the way I've seperated it out is wrong, say so -- that's useful too.
