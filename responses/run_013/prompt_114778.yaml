  - **Fault exposed implicitly (lines 15–20)**: The closing lines highlight the static nature of the sums ("filled / Before my hand chose one") and the fallacy of assuming "equal ease" between double and half, without stating the moral.  
  - **Blank verse**: Unrhymed iambic pentameter, first-person voice, no jargon.  
  - **Accessibility**: A reader unfamiliar with the puzzle senses the irrational loop; one familiar recognizes the probability flaw.  

