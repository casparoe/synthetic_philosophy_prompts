  Here is the poem, structured to enact the two-envelope paradox through mirrored reasoning, revealing the inherent flaw without explicit moralizing:

  I hold an envelope. A sum resides  
  Within. The other waits, its contents hid.  
  It holds, I reason, twice what’s mine, or half—  
  Each case as likely. So, the other’s mean  
  Must be the average: double mine plus half,  
  Divided by two—one point two five times.  
  Thus, I should swap.  

  I hold an envelope. A sum resides  
  Within. The other waits, its contents hid.  
  It holds, I reason, twice what’s mine, or half—  
  Each case as likely. So, the other’s mean  
  Must be the average: double mine plus half,  
  Divided by two—one point two five times.  
  Thus, I should swap.  

  But see: the argument remains unchanged  
  Whichever sum I clasp. It bids me trade  
  And trade again, adrift in endless choice.  
  No ground is gained. The envelopes were filled  
  Before my hand chose one—their values fixed,  
  Not fluid chances. Why should "half" or "double"  
  Dance with equal ease? The sameness of the plea,  
  Whatever found, unravels its own core.  
  I stand, holding what I hold.  

