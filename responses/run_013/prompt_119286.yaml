prompt: |-
  I'm a novelist — my book-in-progress is about a forger — and I've been asked to interview a philosopher onstage at a literary festival. Her position is that a perfect forgery shares every aesthetic property with the original, since aesthetic value supervenes on how a thing looks or sounds; what the original alone has is an indexical standing, its being the one object causally connected to a particular act of making. Her own wrinkle is that this makes the wrong of forgery testimonial rather than aesthetic: the forgery is a false claim about its own provenance, owed to an audience rather than to the artist, and discharged by disclosure.

  Draft eight to ten questions for the hour, each with a follow-up keyed to the answer she is most likely to give. I want one pressing the charge that her indexical standing is mere fetishism — a collector's superstition given a metaphysical costume; one on whether her account implies that a forgery destroyed before anyone ever believed it wronged no one; and one on the artist's own later replica of her earlier painting, made by the same hand, which her criterion seems to count as an original. Close with the case I'm writing toward: a replica commissioned to stand in for an original destroyed in a war, so that the public's experience of the work survives — lie or gift, on her view? Assume she knows the standard debate; no warm-up questions about her career.
reasoning: |-
  Okay, the user is a novelist working on a book about a forger and has to interview a philosopher at a literary festival. The philosopher's stance is that a perfect forgery has all the same aesthetic properties as the original, but what sets the original apart is its indexical standing—its connection to the original act of creation. She argues that the wrong in forgery is testimonial, not aesthetic; it's about lying about its origins. The user needs 8-10 questions with follow-ups, including specific scenarios they mention.

  First, I need to understand the philosopher's key points: aesthetic supervenience, indexical standing, and testimonial wrong. The user wants certain angles covered: indexical standing as fetishism, a forgery destroyed before deception, artist replicas, and the commissioned replica of a destroyed artwork. 

  The user’s deeper needs might be to explore themes relevant to their novel, especially moral ambiguity in forgery. The wartime replica scenario is crucial for their story, so they likely want to challenge the philosopher's view and get nuanced material for their book. They might also want the interview to be engaging for the festival audience, balancing depth with accessibility.

  For the questions, I'll start with the core thesis to set the stage. Then move to the fetishism critique to address the collector's obsession angle. Next, the destroyed forgery tests if harm requires deception. The artist’s replica question clarifies authenticity versus creation. The wartime case is the climax, probing whether intent and context change the testimonial wrong. 

  Each follow-up should anticipate her responses and push further. For example, on fetishism, if she denies it's superstition, ask about market validation. For the destroyed forgery, if she says no wrong occurred, challenge with the forger's intent. The artist replica follow-up could question personal authenticity. The wartime scenario needs to contrast institutional lies versus public benefit, forcing her to weigh testimony against consequences.

  I need to ensure questions are concise but probing, avoiding jargon. The user wants no warm-ups, so dive straight into the philosophy. Also, ensure the wartime case is last as it ties into their novel. Balancing the structured questions with the novelist's creative needs will make the interview compelling for both the festival and their writing.
answer: |-
  Below are 10 tightly focused questions with anticipated responses and incisive follow-ups, designed to probe the core of her thesis and explore the specific scenarios you need for your novel:

  1.  **Core Challenge:**
      *   **Q:** You argue that the *only* essential difference between a perfect forgery and the original is its "indexical standing" – its causal link to a specific artist's act of creation at a specific time. Critics might call this "metaphysical fetishism," elevating a mere historical accident (who made it *first*) over the actual aesthetic experience. Isn't this just institutional validation masquerading as ontology?
      *   **Anticipated A:** She'll likely defend indexical standing as fundamental to the *kind* of object it is (an "X by Artist Y," not just "something looking like X by Y"), arguing it's constitutive of the work's identity, not a contingent value-add.
      *   **Follow-up Q:** But doesn't the *intensity* of value placed on that "firstness" – especially when divorced from any discernible aesthetic difference – reveal it primarily as a market-driven or psychological *fetish*, a socially constructed superstition about origins? Isn't your ontology simply codifying that collector's impulse?

  2.  **Testimonial Harm Specificity:**
      *   **Q:** Your core claim is that the wrong of forgery is *testimonial*: the forgery falsely asserts its provenance to an audience. Doesn't this imply that if a perfect forgery were created and *instantly destroyed* before anyone ever saw it or believed it was the original, no testimonial wrong would have occurred?
      *   **Anticipated A:** She'll likely agree, arguing the wrong is in the deceptive *presentation* or implicit claim when offered for appreciation/transaction. No presentation/claim, no wrong.
      *   **Follow-up Q:** So, the *intent* to deceive, or the creation of a deceptive object, isn't inherently wrong on your view? Only its actual entry into the communicative sphere? Doesn't this let the forger off the hook morally if they're merely incompetent at dissemination, or is the *creation itself* an implicit act of potential false testimony?

  3.  **Artist's Replica & Authenticity:**
      *   **Q:** Consider an artist who, years later, meticulously recreates one of their own destroyed early works. By your criterion – same causal agent, new act of making – this replica possesses "indexical standing" and is thus an *original* work (a new instance, perhaps), not a forgery. Does this align with how we actually treat such artist replicas?
      *   **Anticipated A:** She'll likely affirm this, arguing it *is* an original work *by that artist*, distinct from the lost one, possessing its *own* indexical link. It's authentic but different.
      *   **Follow-up Q:** But doesn't this create a tension? The artist *intends* it as a replica, a substitute for the lost work, trading precisely on the *original's* indexical standing (its historical moment, its place in their development). If the audience experiences it *as* the lost work, isn't this replica *itself* potentially engaging in a testimonial falsehood about its own temporal origins and relation to the artist's past self?

  4.  **Aesthetic Supervenience Edge Case:**
      *   **Q:** You base your aesthetic equivalence claim on supervenience: aesthetic properties depend *only* on perceptible features. But what about properties like "influence" or "historical significance"? Aren't these aesthetic properties for some, yet clearly dependent on actual history and origin, not just appearance?
      *   **Anticipated A:** She'll likely argue these are *contextual* or *art-historical* values, not *inherent* aesthetic properties of the object itself. The *look* that made it influential is what matters aesthetically.
      *   **Follow-up Q:** If we accept that distinction, doesn't it severely restrict the scope of "aesthetic properties" to purely formal or sensory qualities, potentially sidelining crucial aspects of how we engage with and value art? Can the "aesthetic experience" truly be isolated from the knowledge of genesis in such a clean way?

  5.  **Burden of Disclosure:**
      *   **Q:** You say the testimonial wrong is "discharged by disclosure." Does this mean any forgery, once *known* to be a forgery and presented *as such*, loses its deceptive character and becomes ethically neutral, even aesthetically equivalent?
      *   **Anticipated A:** Yes, precisely. Disclosure removes the false claim. It becomes an object of interest in its own right, perhaps valued for skill or history.
      *   **Follow-up Q:** What about the *initial* deception, even if later corrected? Doesn't the forgery's very existence pollute the historical record and potentially distort scholarship or public understanding *permanently*, even after disclosure? Is the harm *fully* reversible?

  6.  **Value Beyond Testimony:**
      *   **Q:** If the *only* wrong is testimonial, does this imply that the *value* of the original *beyond* its aesthetics is *entirely* tied to its indexical standing? Is there no additional value (sentimental, symbolic, inspirational) in knowing you're encountering *the very object* the artist touched and imbued with their creative act?
      *   **Anticipated A:** She might concede non-aesthetic "auratic" or associative value stemming from the indexical link, but maintain that the *aesthetic* value is identical, and the *ethical* wrong is solely testimonial.
      *   **Follow-up Q:** Isn't that "auratic" value – the power derived from direct contact with the artist's moment – precisely what drives the collector's passion and the market frenzy? And if so, doesn't your "indexical standing" thesis ultimately serve to *validate* that very fetishism you're accused of codifying?

  7.  **The Intentionalist Counter:**
      *   **Q:** Philosophers like Monroe Beardsley might argue that the artist's *intention*, realized in the original act, is crucial to the work's identity, not just causal origin. Doesn't a forgery, lacking that specific intentional act directed *at that particular object*, fundamentally fail to instantiate the work, regardless of appearance?
      *   **Anticipated A:** She'll likely counter that the original object *embodies* the realization of that intention, and the indexical link captures this. The forger's intention targets a *different* work (the deception).
      *   **Follow-up Q:** But if the forgery is *perceptually identical*, doesn't it also perfectly embody the *realized formal intentions* of the original artist? Isn't the only missing intention the one *about provenance*? Doesn't this push us back towards your testimonial wrong being the *only* difference?

  8.  **The Wartime Replica - Your Novel's Case:**
      *   **Q:** **The core case:** A museum commissions a perfect replica of a masterpiece destroyed in war. Its *sole purpose* is public display, explicitly labelled as a replica, to allow the aesthetic experience of the work to survive. No deception is intended or practiced. On your view, is this replica ethically problematic? Is it a forgery? A gift? Or something else?
      *   **Anticipated A:** She'll likely say it's *not* a forgery because there's no false testimonial claim (discharge by disclosure!). It's a replica, perhaps valued for its skill and purpose. The aesthetic experience is preserved without ethical wrong.
      *   **Follow-up Q:** But consider the museum director who quietly *hides* the destruction and displays the replica *as if* it were the original, believing the public's need for the "real" experience outweighs the truth. Does *this* act transform the replica *into* a forgery and commit the testimonial wrong? Or is the replica itself still innocent, only the *presentation* culpable? Does the object's ethical status depend entirely on external framing?

  9.  **Expanding the Testimonial Scope:**
      *   **Q:** You frame the testimonial wrong as being owed to the *audience*. Is it also owed, perhaps primarily, to the *original artist* (misappropriating their creative output/identity) or to *future artists* (polluting the historical lineage)?
      *   **Anticipated A:** She'll likely center the audience's right to truthful context for appreciation/transaction. Harm to the artist might be derivative (reputation) or fall under different categories (fraud, copyright).
      *   **Follow-up Q:** If an artist discovers a perfect forgery of their work, displayed honestly *as* a forgery, might they still feel a sense of violation – an uncanny theft of their creative essence? Doesn't this suggest an intrinsic link between the artist's act and the specific object that your indexical standing captures, but which generates a harm *beyond* just audience deception?

  10. **Artistry of the Forger:**
      *   **Q:** If the aesthetic value of the forgery is identical, and the only wrong is the false claim, does this imply that the *forger* possesses artistic skill and achievement *equal* to the original artist in creating the object itself?
      *   **Anticipated A:** She'll likely agree regarding the *aesthetic qualities achieved* in the object, while stressing the forger's *creative act* is fundamentally different (derivative, imitative, deceptive).
      *   **Follow-up Q:** Does this create a paradoxical situation where the forger is simultaneously a highly skilled aesthetic producer (of the object) and an ethical transgressor (through testimony)? Can we truly separate the "aesthetic achievement" of the forgery from the deceptive *intent* that drove its creation and defines its purpose?

  **Key Strengths for Your Purpose:**
  *   Directly confronts the "fetishism" critique head-on (Q1, Q6).
  *   Presses the "destroyed forgery" scenario to its logical limit (Q2).
  *   Explores the artist's replica ambiguity crucial to understanding authenticity (Q3).
  *   Culminates in your central novelistic dilemma – the wartime replica – probing its ethical and categorical status under her framework (Q8).
  *   Follow-ups anticipate her core arguments and push her into nuanced territory, revealing potential tensions in her view.
  *   Maintains philosophical rigor while using concrete, narratively rich examples.
  *   Avoids biography, focusing solely on the argument and its implications.

  Use these as a springboard; adapt the phrasing based on the flow of the conversation and her specific emphases. Good luck with the interview and the novel!
