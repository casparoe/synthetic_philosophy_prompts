  Give me your credence that the Ayer-ish line on life after death is right -- that "I survive the death of my body" isn't a genuine hypothesis you could ever have reason to accept, because either a disembodied you is incoherent given what personal identity actually consists in, or, if it's coherent, everything you could ever observe (a machine that spits out a being with all your memories and habits, a medium who knows things only you knew, your psychology gradually transplanted into a new body) would be evidence of a replica or of something else, never of you.

  I want a number and a decomposition, not a both-sides tour. Split it into the terms the answer really hangs on -- how much rides on which theory of personal identity is correct, how much on whether a disembodied subject of experience is even conceivable, how much on the duplication point (two things can't both be you, so if one of them is you, which?), how much on the verificationist route (nothing could count as checking the claim) as opposed to the identity route, how much on whether survival even has to be survival of the *same* person to count for anything -- give each a rough probability and one line of justification, then say how they combine into the final number.

