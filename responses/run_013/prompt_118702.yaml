answer: |-
  Here’s a complete exam package centered on your tailings pond case, designed to force engagement with the A/B cohort contrast and the timing paradox while allowing flexibility for well-reasoned answers.

  ---

  ### **1. Exam Question (Designed for 90 minutes)**
  **"The Greenvale Mining Company operates a tailings pond above a fertile valley. Seepage from the pond releases a chemical that: (a) causes mild, non-catastrophic developmental impairments (e.g., reduced IQ, intermittent tremor) in children exposed in utero; and (b) reduces sperm motility, delaying conception by several months in local couples—ensuring that children conceived post-seepage are genetically distinct from those who would have been conceived earlier.**  

  **Two cohorts of children are born with identical impairments:  
  - **Cohort A**: Conceived *before* seepage began (same children, impaired by seepage).  
  - **Cohort B**: Conceived *after* seepage began (genetically distinct children who would not exist without seepage).  

  **Critically assess the following claims:  
  (i) Greenvale harmed Cohort A but not Cohort B.  
  (ii) If Greenvale had started seepage *six months earlier*, the very children in Cohort B *would* have been harmed.  
  (iii) If Greenvale had built the pond elsewhere, it would have wronged *no one* by preventing the existence of all affected children.  

  **What does this case reveal about the limitations of 'person-affecting' principles in intergenerational ethics?"**

  ---

  ### **2. Model Answer (Approx. 700 words)**  
  This case crystallizes the nonidentity problem and exposes critical flaws in person-affecting ethics—the view that an act is wrong only if it harms (or makes worse off) *particular* individuals.  

  **Claim (i): Greenvale harmed Cohort A but not Cohort B.**  
  This is *partially* defensible under person-affecting principles. Cohort A exists identically in both scenarios (with/without seepage) but is *worse off* due to seepage—clear harm. Cohort B, however, only exists *because* of the seepage (due to conception delay). Their lives, though impaired, are still worth living. Since they lack a "better-off" counterpart (non-existence isn’t better for them), person-affecting views struggle to label them as *harmed*. Thus, claim (i) reflects a strict person-affecting verdict.  

  **Claim (ii): Earlier seepage would have harmed Cohort B children.**  
  This exposes the arbitrariness of person-affecting morality. If seepage began earlier, the *same children* now in Cohort B would have been conceived *after* seepage started—shifting them from Cohort B to Cohort A. They now *are* harmed (as Cohort A children), despite suffering identical impairments from identical causes. The moral status of these children hinges solely on *timing*—a morally irrelevant factor. This undermines person-affecting views: if harming depends on contingent facts about conception timing, the theory cannot reliably condemn acts that create impaired future persons.  

  **Claim (iii): Building elsewhere wrongs no one.**  
  Under person-affecting principles, this appears true. Preventing seepage (by relocating the pond) means no impaired children exist—only different, unimpaired ones. Since the impaired children (Cohorts A and B) never exist to be made worse off, and the unimpaired children aren’t comparably better off (they merely exist), no *particular* person is harmed. Yet intuitively, Greenvale *should* relocate the pond to avoid creating avoidably impaired lives. Claim (iii) thus reveals person-affecting ethics’ inability to condemn *creating* avoidable suffering when no identifiable victim is worsened.  

  **Implications for Person-Affecting Principles**  
  This case demonstrates three limitations:  
  1. **Arbitrary Outcomes**: Whether an impaired child is "harmed" depends on external factors (e.g., seepage timing), not the act’s moral quality.  
  2. **Inability to Condemn Avoidable Harm Creation**: Person-affecting views cannot explain why creating Cohort B (or not relocating the pond) is wrong, as these acts don’t worsen outcomes for specific individuals.  
  3. **Counterintuitive Absolution**: Acts with identical consequences (same impairment, same children) are judged differently based on conception chronology.  

  A satisfactory ethical framework must condemn actions that foreseeably create avoidably impaired lives, regardless of whether specific individuals are "harmed" in a comparative sense. Impersonal principles (e.g., "creating more suffering is bad") or hybrid views (e.g., Harman’s "we have duties not to cause harm, even if no one is made worse off") resolve this by focusing on the *kind* of life created. Greenvale’s seepage is wrong because it *causes* impairment (in Cohort A) and *creates* avoidably impaired lives (in Cohort B)—both outcomes are morally objectionable, irrespective of identity shifts. The timing paradox underscores that person-affecting ethics cannot deliver consistent, non-arbitrary judgments in nonidentity cases, demanding a broader approach to intergenerational responsibility.

  ---

  ### **3. Marking Scheme (20 marks total)**  
  **Must-hit points (examiners should award marks where substantiated):**  

  | **Points (20 marks)**                                                                 | **Marks** | **Common Errors / Guidance**                                                                                                |
  |---------------------------------------------------------------------------------------|-----------|-----------------------------------------------------------------------------------------------------------------------------|
  | **1. Correctly distinguishes Cohort A/B re: person-affecting harm:**                  | 4         | Cohort A: harmed (worse off than they would be). Cohort B: not "harmed" under person-affecting views (no better alternative). **Miss: Conflating cohorts or misapplying harm.**           |
  | **2. Explains the *timing paradox* (Claim ii):**                                      | 4         | Notes same children in B would be "harmed" if seepage started earlier (now Cohort A). **Miss: Fails to note identity shift or moral arbitrariness.**                                     |
  | **3. Analyzes *no wrong* claim (Claim iii):**                                         | 4         | Acknowledges person-affecting logic (no one worse off) but highlights counterintuitive result. **Miss: Accepts claim uncritically; ignores intuitive wrongness of creating impairment.** |
  | **4. Critiques person-affecting principles:**                                         | 4         | Identifies ≥2 flaws (e.g., arbitrariness, inability to condemn creating avoidable suffering). **Miss: Only describes the problem without critique.** |
  | **5. Offers justified resolution (alternative principle or synthesis):**              | 4         | **Flexible marking:** Accepts any reasoned view (e.g., impersonal harm, hybrid duties, sufficientarianism) if defended. **Model prefers "duty not to create avoidable impairment."**      |

  ---

  ### **Key Design Notes**  
  - **Anti-Rote Structure**: Students *must* engage A/B contrast and timing shift to score highly (Points 1-2). Claim (iii) forces confrontation with creation vs. harm.  
  - **Flexibility**: Point 5 explicitly rewards alternative views (e.g., "Impersonalism is correct; person-affecting views are untenable") if argued well.  
  - **No Citations Needed**: Relies on core concepts (nonidentity, person-affecting principles) without requiring names/theories.  
  - **Geochemical Authenticity**: Your scenario’s realism (same impairment, different causation) drives the philosophical tension.  
  - **Marking Transparency**: Common errors guide fair grading; 4 marks per point allows nuance (e.g., partial credit for incomplete critique).  

  This setup ensures students grapple with the paradox’s heart—the *same child* being "harmed" or "not harmed" based solely on calendar dates—while exposing person-affecting morality’s vulnerability to contingent facts.
