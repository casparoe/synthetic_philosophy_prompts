prompt: |-
  I write the little placards for a natural history museum -- the ones next to the specimens that say what a feature is "for". Visitors read them as settled fact, and once a label is printed we're stuck with it for years. My problem is the evolution-as-engineer framing: something looks built for a job, we write that it evolved to do that job, and then a consultant tells us we've overclaimed. I want a procedure my three writers can run on any "this evolved for X" claim before it goes to the printers, in about twenty minutes, with no access to the literature (so no citing papers -- they can't look anything up). Ground it in the adaptationism fight -- Gould and Lewontin on spandrels, exaptation, developmental and architectural constraint, drift -- but as steps a non-specialist can follow, not as a lecture. I need the questions in order, what counts as a good enough answer to each, where the procedure just stops and says "don't claim selection here", and where it has to hand off to a curator because the call is about values or about how much hedging a label can carry. Then run it on three labels: the male nipple; the giraffe's neck, which our marketing people adore as "evolved to reach the high leaves"; and a human-origins panel claiming we lost our body hair to stay cool while running. At least one of those should come out in a way the exhibits team won't like -- say which and why. And be honest about where the procedure will still let a just-so story through.
reasoning: |-
  Okay, the user writes placards for a natural history museum and is frustrated with the "evolution-as-engineer" framing. They want a procedure to vet claims like "this evolved for X" before printing. The main issues are overclaiming adaptation when other forces like exaptation, constraints, or drift might be at play. 

  First, I need to understand their constraints. The writers have no access to literature and only 20 minutes per claim. The procedure must be practical, grounded in evolutionary biology concepts (spandrels, exaptation, etc.), but simplified into steps non-specialists can follow. It should flag when to avoid selection claims or escalate to curators.

  The user mentions three examples: male nipples (likely non-adaptive), giraffe necks (classic adaptationist example but debated), and human hair loss for thermoregulation (plausible but contested). The procedure must challenge at least one unpopularly—probably giraffe necks due to marketing's love for the "high leaves" story.

  Key concepts to incorporate: Gould and Lewontin's critiques—spandrels (byproducts), exaptation (co-opted traits), constraints (developmental/physical limits), drift (random changes). The procedure should test for these alternatives before confirming adaptation.

  Structure the steps as a flowchart: Start with necessity (is the trait functional?), then check if it's a byproduct (spandrel), then alternatives (exaptation, constraint, drift), then evidence strength. Each step has clear pass/fail thresholds. If any red flags appear, stop and reject the "evolved for" claim. If inconclusive, escalate to curator.

  For the examples: 
  - Male nipples clearly fail step 2 (developmental byproduct). 
  - Giraffe necks might pass early steps but fail at step 5 (inadequate evidence for leaves as primary driver; sexual selection/complex factors involved). 
  - Human hair loss may pass most steps but need hedging (thermoregulation plausible but not sole driver; sweat glands etc. matter). 

  Honest limitations: The procedure might miss nuanced cases where weak selection operates, or when literature conflicts. It's a filter, not a guarantee. Marketing's giraffe label should be challenged—that’s the unpopular outcome. 

  Finally, phrase steps as blunt questions with simple criteria (e.g., "Did the trait appear before the proposed function?" for exaptation). Keep jargon minimal but concepts intact. Specify where writers must consult curators (values, excessive hedging). 

  This should give writers a defensible way to push back on overclaims while accepting that some ambiguity remains. The giraffe example will ruffle feathers, which is exactly what the user wants to demonstrate rigor.
answer: |-
  Here’s a practical 20-minute vetting procedure for your writers, distilled from evolutionary biology’s adaptationism debates. It’s a **5-step flowchart**—each step must pass to claim "evolved for X." If any step fails, reject the claim or hand off to a curator.

  ---

  ### **The "Evolved For" Claim Check**
  *(Run these questions in order. Stop at any "NO.")*

  1. **IS THIS TRAIT FUNCTIONAL?**  
     *Question: Could this feature plausibly DO the proposed job? (e.g., Does structure match function?)*  
     ✅ **Pass:** Yes, it *could* work that way (e.g., giraffe neck *can* reach leaves).  
     ❌ **Fail/Stop:** No, it’s physically impossible or nonsensical (e.g., "human earlobes evolved to hold pencils").  
     *→ If fail: Don’t claim. Write a descriptive label ("This structure is used for X").*

  2. **IS IT A DEVELOPMENTAL BYPRODUCT (SPANDREL)?**  
     *Question: Is this feature unavoidably linked to another trait that *was* directly selected?*  
     ✅ **Pass:** No clear link (e.g., giraffe neck isn’t tied to a core body plan).  
     ❌ **Fail/Stop:** Yes, it’s a passive consequence (e.g., male nipples exist because *female* nipples are essential).  
     *→ If fail: Don’t claim selection. Say "This is a byproduct of development" or describe neutrally.*

  3. **ARE THERE PLAUSIBLE NON-ADAPTIVE ALTERNATIVES?**  
     *Question: Could drift, constraint, or exaptation explain this trait?*  
     - *Drift:* Is the trait small/neutral? (e.g., minor fur color variation).  
     - *Constraint:* Is it limited by physics/genetics? (e.g., all mammal spines bend similarly).  
     - *Exaptation:* Did the trait exist *before* the proposed function? (e.g., feathers for warmth before flight).  
     ✅ **Pass:** Alternatives seem unlikely (e.g., giraffe neck demands a selective explanation).  
     ❌ **Fail/Handoff:** Strong alternatives exist (e.g., "human hair loss for running" — could be parasite reduction, sexual selection, or pleiotropy).  
     *→ If fail: Escalate to curator. The label *must* hedge ("may have helped," "one theory suggests").*

  4. **IS THE ADAPTIVE STORY *NECESSARY*?**  
     *Question: If the trait vanished, would survival/reproduction drop?*  
     ✅ **Pass:** Yes, loss would likely hurt fitness (e.g., giraffe neck in a leaf-scarce savanna).  
     ❌ **Fail/Stop:** No clear cost (e.g., male nipples don’t reduce fitness).  
     *→ If fail: Don’t claim. Describe function only if actively used ("used for X").*

  5. **IS THE EVIDENCE STRONG ENOUGH?**  
     *Question: Do we have cross-species comparisons, fossils, or biomechanics showing selection?*  
     ✅ **Pass:** Multiple lines of evidence agree (e.g., long necks correlate with tall trees; fossil neck lengthening).  
     ❌ **Fail/Handoff:** Evidence is weak/circumstantial (e.g., "hair loss for running" lacks fossil sweat glands or climate data).  
     *→ If fail: Escalate. Curator decides if hedging is sufficient ("likely evolved for...") or if the claim is removed.*

  ---

  ### **Test Runs on Your Labels**
  **(Using the procedure without literature):**

  1. **Male Nipple**  
     - Step 1: Functional? ❌ (No biological function in males).  
     - **STOP at Step 1.** Don’t claim adaptation.  
     *New label:* "A developmental byproduct: nipples form in all mammals before sexual differentiation."  
     *Exhibits team impact:* Neutral. Nipples aren’t a star exhibit.

  2. **Giraffe Neck "evolved to reach high leaves"**  
     - Step 1: ✅ (Neck reaches leaves).  
     - Step 2: ✅ (Not a spandrel).  
     - Step 3: ❌ (Exaptation/alternatives: Necks used in combat; fossils show neck elongation *before* savannas; developmental constraint in cervical vertebrae).  
     - **HANDOFF to curator.** Claim fails Step 3.  
     *Required hedging:* "While useful for browsing treetops, necks may also function in combat. Their evolution likely involved multiple factors."  
     *Exhibits team won’t like this:* Marketing’s "just-so story" is oversimplified. The label *must* acknowledge complexity.

  3. **Human Hair Loss "to stay cool while running"**  
     - Step 1: ✅ (Less hair aids cooling).  
     - Step 2: ✅ (Not a spandrel).  
     - Step 3: ❌ (Alternatives: Parasite reduction, sexual selection, sweat gland evolution).  
     - **HANDOFF to curator.** Claim fails Step 3.  
     *Required hedging:* "Reduced body hair may have helped early humans regulate heat during endurance activities, alongside other possible advantages."  
     *Exhibits team impact:* Acceptable with added nuance.

  ---

  ### **Where the Procedure Fails (Honesty Time)**
  - **Weak Selection Slips Through:** If a trait *barely* passes Step 3 (alternatives seem unlikely) but selection is minor (e.g., "whale pelvic bones reduce drag"), the procedure might greenlight it.  
  - **Exaptation Blind Spot:** If a trait’s *original* function is unknown (e.g., early feathers), Step 3 may pass by default.  
  - **Cultural Bias:** Writers may underestimate alternatives (e.g., assuming "running" is the obvious explanation for hair loss).  

  **Key Defense:** This isn’t about perfection—it’s about filtering *egregious* overclaims. **Giraffe necks** will be the contentious case: the procedure forces you to contradict marketing’s favorite tale. By requiring handoffs for ambiguity, you protect the museum from dogma. Print this flowchart, tape it to your writers’ desks, and let the curators fight the political battles.
