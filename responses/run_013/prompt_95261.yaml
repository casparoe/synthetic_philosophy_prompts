answer: |-
  As a committed Gricean, I reject the dilemma: this *isn't* a case of speaker meaning ("non-natural meaning" in Grice's terms) at all. The professor deliberately exploits natural meaning (the conventional implicatures of faint praise in recommendation letters) to *cause* the committee to form a belief about the student's mediocrity, but crucially, they do not intend the committee to recognize the *intention* to convey that verdict. In fact, the plan's success hinges on the committee attributing the negative inference solely to the *conventions of the genre* ("this is just how we read such letters") and the *student's actual qualities*, not to the professor's communicative intent. The professor intends the committee to form a belief *based on evidence they provide*, not *because they intend them to recognize that intention*. Grice's definition requires the audience's recognition of the speaker's reflexive intention *to be the reason* for forming the belief. Here, the committee forms the belief *despite* the concealment of that intention, via social convention and inference to the best explanation. So: no speaker meaning occurred regarding the verdict. What *was* meant (non-naturally) were the literal statements ("diligent", etc.), and the verdict is merely *implied* naturally. Your intuition of conveyance stems from the professor's *perlocutionary* success (causing the belief), not *illocutionary* action (meaningNN it).
