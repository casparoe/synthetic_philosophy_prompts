prompt: |-
  I work as a researcher for a legislative standards committee, where I prepare the factual findings on complaints that a minister misled the house or the public. The committee treats lying and merely misleading statements differently — the first can end a career, the second usually draws a reprimand — so my finding is not academic. I work from the transcript, the minister's written answer, and the public record; I never get to ask what the minister intended, and the minister has every reason to describe his own intention favourably.

  Write me a decision procedure I can run on a single statement in about half an hour. Give me the questions in order, what counts as a sufficient answer to each, where the procedure terminates in a finding, and where it must stop and hand the matter to the committee because what remains is judgment rather than fact. Ground it in the philosophical work on the lying/misleading distinction — the roles of falsity, of assertion, of the intention to deceive, and of what is conveyed without being said — but write it so that a colleague who has never read that work can apply it. Our committee currently uses a rule of thumb I distrust: a statement is misleading if, substituting the relevant true fact for what was said, a reasonable listener's confidence in the false proposition would fall sharply. Tell me whether that survives contact with the philosophy, and what should replace it.

  Then run the procedure on three cases: a minister who said that no decision had been made, when a decision in principle had been taken but not announced; a minister who said he had never intervened in "the process," meaning a narrower process than the questioner meant; and a minister who answered a question about one policy by discussing another. At least one should come out in a way the committee will not like. If the procedure cannot reliably tell a lie from a misleading statement under the conditions I actually work in, say so plainly rather than handing me a checklist that pretends to settle what it cannot, and where the procedure quietly takes a side on whether the moral difference between lying and misleading is real, flag it.
reasoning: |-
  Okay, the user is a researcher for a legislative standards committee. Their job is to figure out if a minister lied or just misled the house or public. The committee treats lying much more severely—it can end careers—while misleading usually just gets a reprimand. So the distinction is crucial, not just academic. The researcher works with transcripts, written answers, and public records but can't ask the minister about their intent. Ministers would likely spin their intentions favorably anyway.

  The user wants a decision procedure they can apply to a single statement in about 30 minutes. It should be grounded in philosophy about lying vs. misleading—covering falsity, assertion, intention to deceive, and what's conveyed without being said. But it needs to be practical for colleagues who haven't read that philosophy. They also mention distrusting their committee's current rule of thumb: a statement is misleading if substituting the true fact would sharply reduce a reasonable listener's confidence in the false proposition. They want to know if that holds up philosophically and what should replace it.

  The user provides three cases to test the procedure:  
  1. A minister says "no decision has been made" when a decision in principle was made but not announced.  
  2. A minister says he never intervened in "the process," using a narrower meaning than the questioner intended.  
  3. A minister answers a question about one policy by discussing another.  
  They want at least one outcome to be unpopular with the committee, and if the procedure can't reliably distinguish lying from misleading under real constraints, it should admit that.

  First, I need to recall the philosophical distinctions. Lying requires a false statement, assertion, and intent to deceive. Misleading involves conveying falsehood without asserting it—like implications or ambiguities—but doesn't require the statement itself to be false. The committee's rule of thumb focuses on the effect of correcting the statement, which aligns with how misleading works through implication. But it misses key elements like the statement's actual truth value and the speaker's intent.

  The user can't access intent directly, so the procedure must infer it from context. The philosophy suggests that for lying, the statement must be objectively false, asserted, and intended to deceive. For misleading, the statement might be technically true but imply a falsehood, and the speaker might intend that implication. The procedure needs steps to check these elements using available evidence.

  The committee's rule of thumb is about the correction effect. Philosophically, that's relevant to misleading because correcting the statement exposes the implied falsehood. But it doesn't handle cases where the statement is outright false, which is lying. So the rule might conflate the two or miss lies that aren't implicatures. It also ignores intent. So it needs replacing.

  I'll design a procedure with sequential questions. Start with falsity: is the statement false? If yes, it could be a lie. If not, it might be misleading. Next, check if the falsehood was asserted or implied. Then, infer intent from context—like if the minister knew the truth and avoided it. The procedure should stop and refer to the committee when intent or reasonableness of interpretation is too subjective.

  For the cases:  
  - Case 1: "No decision made" when a decision in principle exists. The statement is false if "decision" includes in-principle ones. If the minister knew and intended to deceive, it's a lie. But if "decision" is ambiguous, it might be misleading.  
  - Case 2: Minister says no intervention in "the process," using a narrow definition. The statement might be technically true but imply a broader falsehood. This is classic misleading if the minister exploited the ambiguity.  
  - Case 3: Answering about policy A by discussing policy B. This avoids assertion, so not a lie, but could be misleading if it diverts from the truth.  

  The procedure must flag when it can't decide, like when intent is unclear. And it should admit if the real-world constraints make reliable distinction impossible, especially without intent. The moral difference might be assumed in the procedure, so I'll note that.  

  Finally, test the cases. Case 1 might come out as a lie, which the committee won't like if they prefer softer findings. Case 2 is misleading. Case 3 might be non-culpable or misleading depending on context. The procedure should show its limits and not pretend to be definitive when it's not.
answer: |-
  Here is a decision procedure grounded in the philosophy of assertion, intention, and conversational implicature (drawing primarily on work by Frankfurt, Grice, Saul, and Stokke). It prioritizes objective evidence over subjective intent, acknowledges practical constraints, and flags where judgment is required. I'll then evaluate your committee's rule of thumb and apply the procedure to your cases.

  ---

  ### **Decision Procedure: Lying vs. Misleading**
  **Time:** Designed for ~30 minutes per statement using transcripts, written answers, and public records.  
  **Goal:** Determine if evidence *objectively supports* a finding of lying, misleading, or neither. Stops when intent/interpretation requires committee judgment.  
  **Core Principles:**  
  1. **Lying** requires a speaker to *assert* something they *believe to be false* with the *intent to deceive*.  
  2. **Misleading** occurs when the speaker *implies* (but does not assert) something false, or uses a technically true statement to create a false impression, *intending deception*.  
  3. **Neither** applies if the statement is true, ambiguous without deceptive intent, or if intent/interpretation cannot be inferred from evidence.

  **Procedure Flowchart:**  
  1. → **Falsity** → 2. → **Assertion** → 3. → **Intent to Deceive** → 4. → **Implication** → Findings  

  **Step-by-Step Questions:**  
  1. **Is the statement literally false?**  
     - *Evidence:* Compare words used to public record. Ignore implications.  
     - *Sufficient answer:*  
       - **YES** → Proceed to Step 2.  
       - **NO** (technically true) → Skip to Step 4.  
       - **UNCLEAR** (e.g., ambiguous wording) → Refer to committee.  
     - *Philosophy basis:* Lying requires objective falsity (Frankfurt).  

  2. **Did the minister *assert* the false statement?**  
     - *Evidence:* Did they directly state the false claim? (e.g., "No decision was made" vs. "I’m not discussing decisions").  
     - *Sufficient answer:*  
       - **YES** (explicit claim) → Proceed to Step 3.  
       - **NO** (evasion, change of subject) → **Finding: Not a lie** (may be misleading; go to Step 4).  
     - *Philosophy basis:* Assertion invites belief in the stated proposition (Stokke).  

  3. **Can intent to deceive be *objectively inferred*?**  
     - *Evidence:* Minister’s access to truth (e.g., documents they signed), patterns in answers, contemporaneous records showing knowledge.  
     - *Sufficient answer:*  
       - **YES** (e.g., minister had documented knowledge of truth) → **Finding: Lying**.  
       - **NO** (no evidence of knowledge) → **Finding: Inconclusive** (refer to committee).  
       - **CONFLICTING** → Refer to committee.  
     - *Philosophy basis:* Intent is core to lying (Saul), but must be inferred behaviorally.  

  4. **Did the minister *imply* something false?**  
     - *Evidence:* Contextual cues (question asked, public knowledge), semantic conventions (e.g., "the process" could be narrow/broad).  
     - *Sufficient answer:*  
       - **YES** (reasonable listener would infer falsehood) → Proceed to Step 5.  
       - **NO** (no false implication) → **Finding: Neither**.  
       - **UNCLEAR** (plausible interpretations conflict) → Refer to committee.  
     - *Philosophy basis:* Implicature relies on shared conversational norms (Grice).  

  5. **Can deceptive intent in implying falsehood be *objectively inferred*?**  
     - *Evidence:* Avoidance of clearer phrasing, strategic ambiguity, records showing awareness of likely misinterpretation.  
     - *Sufficient answer:*  
       - **YES** (e.g., minister used narrower definition to dodge) → **Finding: Misleading**.  
       - **NO** (ambiguity unintentional) → **Finding: Neither**.  
       - **INSUFFICIENT EVIDENCE** → Refer to committee.  

  **Where it stops:**  
  - Steps 1, 2, and 4 rely on objective linguistic evidence.  
  - Steps 3 and 5 require inferring intent; **refer to committee** if evidence is ambiguous.  
  **Moral Difference Flag:** The procedure assumes lying is distinct (and more severe) because it corrupts assertion. If this is contested, the committee must debate it.  

  ---

  ### **Evaluation of Committee’s Rule of Thumb**  
  Your current test ("substituting the true fact sharply reduces confidence in the false proposition") captures *misleading* well (it targets the *effect* of implication) but fails for **lying**:  
  - A *lie* (e.g., "I did not intervene") remains false even before substitution. The test doesn’t distinguish falsity from implication.  
  - It ignores **intent** (e.g., unintentional ambiguity isn’t deceptive).  
  - **Philosophy verdict:** The rule works *only* for misleading statements. Replace it with the above procedure, which isolates falsity (Step 1) and assertion (Step 2) to cover lies.  

  ---

  ### **Application to Cases**  
  **Case 1:** Minister says *"No decision has been made"* when a decision in principle was taken but not announced.  
  - **Step 1:** Literally false? **YES** (a decision in principle exists).  
  - **Step 2:** Asserted? **YES** (direct claim).  
  - **Step 3:** Intent to deceive? **YES** (minister knew of the decision; public record shows they chaired the meeting).  
  - **Finding: Lying** → *Committee may dislike this, as it escalates consequence.*  

  **Case 2:** Minister says *"I never intervened in the process"*, defining "the process" narrowly (e.g., final approval) when the questioner meant the broader investigation.  
  - **Step 1:** Literally false? **NO** (technically true under narrow definition).  
  - **Step 4:** False implication? **YES** (reasonable listener assumes "process" covers the investigation; question context confirms this).  
  - **Step 5:** Deceptive intent? **YES** (minister used narrow definition to sidestep; emails show staff advised this tactic).  
  - **Finding: Misleading**  

  **Case 3:** Minister answers a question about Policy A by discussing Policy B.  
  - **Step 1:** Literally false? **NO** (discussing Policy B is not a false statement).  
  - **Step 4:** False implication? **NO** (diverting isn’t implying falsity; it’s evasion).  
  - **Finding: Neither** (non-culpable evasion) → *Committee may dislike no sanction, but philosophy sees no deception.*  

  ---

  ### **Limitations and Honest Assessment**  
  **Can it reliably distinguish lying from misleading?**  
  - **Yes, but only when evidence supports intent inference.** In low-information contexts (e.g., no records proving knowledge), Step 3/5 often require committee judgment.  
  - **Key constraint:** Without direct intent evidence, the procedure defaults to "inconclusive" for lying and "neither" for misleading. It avoids false positives but risks under-punishing deception.  

  **Does it quietly take a moral side?**  
  - **Yes:** It assumes lying (knowingly false assertion) is distinct from misleading (exploiting implication). If your committee rejects this, the procedure’s findings will conflict with their moral view. Flag this in Step 3 findings.  

  **Recommendation:** Use this procedure to filter clear cases (e.g., 70-80% of complaints). For ambiguous intent/implication, present the evidence matrix to the committee with a "judgment required" verdict. This respects your evidentiary limits while grounding distinctions in defensible philosophy.  

  ---  
  *Final note: This procedure makes Case 1 (lying) and Case 3 (neither) potentially unpopular, exposing tensions between philosophical rigor and political pragmatism. If your committee consistently overrules these outcomes, the distinction may be unworkable in your context.*
