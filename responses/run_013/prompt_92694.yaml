  Section 5 (positional goods) needs to probe if her theory creates enhancement obligations. The follow-up must pressure her on whether this collapses the therapy/enhancement line entirely.

  The closing question about evidence the proxy has failed needs to force concrete criteria. I'll anticipate her likely deflection about diagnostic value and counter with how we'd know when the failure is terminal.

