  Section 2 (baseline problem for low-normal traits) needs to address the "no fact of the matter" issue. The follow-up should question whether her proxy can handle cases with uncertain baselines, forcing her to either defend its adaptability or admit limitations.

  For section 3 (drift in baseline), I plan to ask about environmental modifications changing what counts as therapy. The follow-up must corner her on whether the proxy tracks shifting social contexts or breaks down.

