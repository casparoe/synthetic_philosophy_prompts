prompt: |-
  I keep noticing my gut has strong opinions about when it was actually worth finding something out, and I'd like to know if there's one principle behind them. I know there's a theorem — Good's, I.J. Good I think — that the expected value of information is never negative, on the grounds that you can always ignore what you learn. That sounds like it says you're never worse off in expectation for knowing, and my gut doesn't obviously agree with that, so I want my gut turned into a principle and then told where it's wrong.

  My verdicts:

  - There's a free test for a condition with no treatment and no prevention that wouldn't hit till I'm about 70. I don't want it. Not worth knowing.
  - Same test, but there's something I could actually do about it. I want it, obviously, even if the answer is bad.
  - I paid for a pre-purchase inspection on a used car, it came back with three things wrong, it killed the deal, and I'm out the fee and glad. Best money I spent all year.
  - A friend told me the score of a match I'd recorded and was about to watch. I'd have paid real money not to be told. I watched it anyway, I just enjoyed it less. Nothing about what I did changed — the thing itself got worse.
  - Found out after my dad died that he'd had a whole other family for years. Nobody to confront, nothing to do about it, it just hurt, and I'm glad I know. I wouldn't give it back.
  - A friend got a scan for something unrelated, they found a shadow, three weeks of hell, then benign. She says she should of skipped the scan. I think she's wrong about that and also right that she came out worse off than if she'd never gone, and I can't make those two fit.
  - A small one: my doctor listed the side effects before I took the tablets and I'm fairly sure that's why I got them. I'd rather not have been told, and I also think she has to tell everyone.

  The best principle I've got is this: information is only worth having if it could change what I do. Where there's no decision to make, wanting the truth is just a taste, like olives, and having the taste doesn't make it good for me.

  Is there a better principle that gets all of these, or close? Say what it predicts about the case I keep going back and forth on — my mum's four boxes of diaries sitting in the spare room, nothing to be done about anything in them now, might be lovely, might be awful, and I keep not opening them. Give me one more case of your own that the principle settles in a way I wouldn't have guessed, and be honest about which of my verdicts it can't keep.
reasoning: |-
  Okay, let me try to figure out what's going on here. The user has this gut feeling that sometimes knowing something isn't worth it, even though Good's theorem says that information should never have negative expected value. They provided several personal examples where knowing or not knowing had different emotional or practical outcomes. 

  First, I need to understand their core question. They want a principle that explains all their scenarios better than "information is only worth having if it changes actions." Their existing principle is decision-centric, but some cases (like learning about dad's secret family) show people value truth even without actionable changes. Hmm, that's a conflict.

  Looking at their examples: the medical test with no treatment option - not worth knowing. But when there's something you can do, it is worth it. The car inspection - actionable, clear win. The spoiled sports match - no action possible, pure enjoyment ruined. Dad's secret - painful but still valued. Friend's false alarm - net negative due to anxiety. Doctor listing side effects causing nocebo effect - information actively harmful.

  The user’s mum’s diaries are interesting - no practical impact, potential emotional upside/downside, and they’re avoiding opening them. That’s a perfect test case for any principle.

  I recall Good’s theorem assumes rational actors who can freely ignore information, but humans aren’t like that. Psychology research shows knowing can alter emotional states regardless of actions (affective forecasting errors, nocebo effects). Also, some information becomes "sticky" - hard to un-know even if you try. 

  Maybe a better principle is: Information has value when it enables better decisions OR aligns with truth-seeking preferences, but it can have negative emotional/cognitive costs. The net value depends on: (a) instrumental utility (changing actions), (b) intrinsic utility (satisfying curiosity/values), minus (c) psychological costs (distress, bias), minus (d) the cost of obtaining it. 

  Applying this to their cases:
  - Untreatable test: No (a), weak (b) since it’s distant, possible (c) - net negative.
  - Treatable test: Strong (a) - net positive.
  - Car inspection: Strong (a) outweighs inspection cost (d).
  - Spoiled match: No (a), (b) might be negative (if anti-spoiler preference), high (c) in lost enjoyment.
  - Dad’s secret: No (a), but high (b) (truth-as-value) outweighs (c) for them.
  - Friend’s scan: Minor (a) (ruling out issues), but huge (c) (3-week anxiety) - net negative for friend.
  - Side effects: No (a), negative (c) via nocebo - net negative for them.

  For the diaries: High uncertainty in (b) and (c). If user values truth strongly, open; if risk-averse to emotional pain, leave closed. Explains their hesitation.

  New case: Learning a partner’s past sexual history when nothing changes practically. Many would regret asking - high (c), no (a), weak (b). Principle predicts net negative even for truth-seekers.

  Where the principle struggles: The friend’s scan scenario. The user thinks the friend is wrong to regret testing (because ruling out danger is good) but right that she’s worse off emotionally. The principle captures this tension: instrumental gain vs. emotional cost. Sometimes correct decisions have negative experiential outcomes - that’s life.

  User’s deeper needs: They want to reconcile rationality with emotion. They sense Good’s theorem is incomplete for humans. Also, they might be seeking permission to avoid painful truths (diaries) without guilt. The principle validates that emotional costs matter - it’s not irrational to avoid information.
answer: |-
  Your intuition clashes with Good's theorem because it assumes perfect rationality—humans aren't logic engines that can effortlessly ignore information. Your cases reveal three dimensions of information value: **instrumental** (changing actions), **intrinsic** (satisfying curiosity/values), and **psychological** (emotional/cognitive costs). The principle that best fits your verdicts is:

  **Net Expected Value of Information (NEVI) =**  
  *(Instrumental Utility + Intrinsic Utility) - (Psychological Costs + Acquisition Costs)*  

  Where:  
  - **Instrumental Utility**: Does it enable better *decisions*?  
  - **Intrinsic Utility**: Does truth itself align with your *values* (e.g., authenticity, curiosity)?  
  - **Psychological Costs**: Could it cause *distress*, *bias*, or *unwanted focus*?  
  - **Acquisition Costs**: Time, money, or effort to obtain it.  

  NEVI can be negative when psychological costs outweigh instrumental/intrinsic gains—even if you *could* theoretically ignore the info.  

  ---

  ### **Your Cases Revisited**  
  1. **Untreatable condition test**:  
     - *Instrumental*: 0 (no action possible).  
     - *Intrinsic*: Low (distant threat; weak curiosity).  
     - *Psychological*: High (anxiety until 70).  
     → **Negative NEVI** → Not worth it. ✅  

  2. **Treatable condition test**:  
     - *Instrumental*: High (prevent harm).  
     - *Psychological*: Moderate (temporary anxiety).  
     → **Positive NEVI** → Worth it. ✅  

  3. **Car inspection**:  
     - *Instrumental*: High (avoid bad purchase).  
     - *Acquisition Cost*: Minor fee.  
     → **Positive NEVI** → Worth it. ✅  

  4. **Spoiled sports match**:  
     - *Instrumental*: 0 (no action changed).  
     - *Intrinsic*: Negative (you value suspense).  
     - *Psychological*: High (reduced enjoyment).  
     → **Negative NEVI** → Not worth it. ✅  

  5. **Dad’s secret family**:  
     - *Instrumental*: 0 (no action possible).  
     - *Intrinsic*: High (truth aligns with your values).  
     - *Psychological*: High (pain), but outweighed by intrinsic gain.  
     → **Positive NEVI** → Worth it. ✅  

  6. **Friend’s false-alarm scan**:  
     - *Instrumental*: Low (ruled out danger).  
     - *Psychological*: Very high (3 weeks of anxiety).  
     → **Negative NEVI for her** (costs > gains) ✅  
     ...but *you* think she’s "wrong" because instrumental gains *should* matter more. NEVI explains the disconnect: Her psychological costs dominated, but you prioritize instrumental value.  

  7. **Doctor listing side effects**:  
     - *Instrumental*: 0 (you took pills anyway).  
     - *Psychological*: High (nocebo effect).  
     → **Negative NEVI for you** → Not worth it. ✅  
     ...but ethically required (societal NEVI > individual NEVI).  

  ---

  ### **Your Mum’s Diaries**  
  - **Instrumental**: 0 (nothing to act on).  
  - **Intrinsic**: Uncertain — could be high (connecting with her) or negative (unwanted truths).  
  - **Psychological**: High risk (potential distress).  
  - **Acquisition Cost**: Low (time/effort to read).  
  → **NEVI is ambiguous**. Depends on:  
  - Your *truth-seeking values* (do you prioritize "knowing" over peace?).  
  - Your *risk tolerance* for emotional harm.  
  NEVI explains your hesitation: High psychological risk with no compensatory instrumental gain. If you value truth highly, open them. If you’re risk-averse, leave them closed.  

  ---

  ### **New Case: The Job Application Feedback**  
  **Scenario**: You applied for a dream job and were rejected. The hiring manager offers detailed feedback. Do you want it?  
  - **Instrumental Utility**: High (improves future applications).  
  - **Intrinsic Utility**: Low (truth isn’t inherently valuable here).  
  - **Psychological Costs**: High (ego blow, fixation on flaws).  
  - **Acquisition Cost**: Low (30-minute call).  

  → **NEVI could be negative** if psychological costs (e.g., crushed confidence) outweigh instrumental gains. Many wouldn’t want it—even though it "could change future actions." Your principle ("only worth it if it changes actions") would say *yes*, but NEVI captures why many decline.  

  ---

  ### **Where NEVI Struggles**  
  - **Your friend’s scan (Case #6)**: NEVI explains her regret (net negative for her), but not your insistence she’s "wrong." This is a values clash: You prioritize instrumental gains; she prioritizes psychological costs. NEVI doesn’t resolve whose weighting is "correct."  
  - **Dad’s secret (Case #5)**: NEVI relies on *your* intrinsic valuation of truth. Someone else might call this "useless pain" and discard the diaries unread.  

  ### **Key Insight**  
  Good’s theorem assumes psychological costs are nil ("just ignore it!"). But humans can’t un-know things, and information alters emotions, focus, and self-narratives *whether we act on it or not*. **NEVI incorporates this, explaining when truth-seeking is a virtue, a vice, or a gamble.** Your gut is right: Information isn’t free. Sometimes, not opening the box is the winning move.
