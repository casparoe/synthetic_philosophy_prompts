prompt: |-
  I write fiction, and for years I have been collecting a particular kind of argument — the kind I give to characters when I want a scene that can neither be resolved nor walked away from — and I have never found a name for it. I would like to know whether philosophers have one, and if not, whether they would coin one, because every label I reach for seems to be describing something a little different.

  The pattern is this. Two people argue. Every fact either of them can state, the other accepts; neither can point to any observation, document, or event that the other denies. And yet each can restate the other's position in his own words and find it so obviously true as to be a platitude — which does not end the argument. Nor is the argument idle: it changes what they do. One refuses the other's hand; one resigns; a will is rewritten. And when they try to settle it by agreeing on a definition, the quarrel merely moves: now they are arguing about which definition to adopt, and that argument has all the same features.

  Instances, from life as well as from drafts: whether a company can be sincere, or only the people in it; whether a nation can owe an apology, or only its current officials; whether a river dredged and re-routed is still the same river. In each case the disputants agree about boards and memos, about treaties and speeches, about silt and banks. In each case one says the word is being used loosely, and the other says that is precisely the question. People tell me such quarrels are only about words, and I do not believe the word only.

  So I am asking for the carving, not the label. What are the nearest established concepts, how does the thing I have described differ from each of them, and which, if any, fits it? If nothing fits, give me a term with a definition, and tell me where its edges lie — what it excludes, and what it would be a mistake to call by that name. I will not be satisfied with a bare name.

  Please lead with your bottom line in the first sentence and then give the reasoning, with no preamble and no restating of my question.
reasoning: |-
  Okay, the user writes fiction and has been collecting arguments where characters can't resolve or walk away from a disagreement. They agree on all facts but still clash over interpretations, leading to real consequences. The user wants to know if philosophers have a term for this or if one can be coined. They want a precise definition and differentiation from existing concepts.

  First, I recall philosophical concepts related to disagreements. Factual disputes are out because both parties agree on facts. Verbal disputes might seem close, but they usually don't affect actions, whereas here decisions change. Metaphysical disputes could fit, but they're often about reality's nature, not just interpretations. 

  The key elements are: agreement on facts, restating each other's positions as platitudes, yet persistent disagreement affecting actions, and moving the goalposts when defining terms. Examples include whether a company can be sincere or a river remains the same after changes. The user rejects calling it "only about words" because it has real-world impact.

  Looking at existing terms, "verbal dispute" is insufficient because it implies it's trivial. "Metaphysical dispute" is too broad. "Conceptual ethics" or "conceptual engineering" involve choosing concepts, but here it's the application in context that's contested. 

  The core issue seems to be the criteria for applying a concept when facts are agreed upon. For instance, what conditions must be met for a river to be considered the same river? This relates to "conceptual divergence" or "criterial disagreement." 

  After considering various terms, the best fit might be "criterial dispute." It focuses on differing criteria for applying a concept while agreeing on facts. This differentiates from other disputes: not about facts, not purely verbal, and not metaphysical in a broad sense. The edges would exclude cases where facts are disputed or when disagreements don't affect actions. 

  The user needs a term that captures the essence without being reductive. "Criterial dispute" emphasizes the disagreement on thresholds or conditions for concept application. It aligns with the examples and meets the user's requirement for a precise carve-up. Also, it avoids the "only words" dismissal by acknowledging real consequences. 

  Finally, ensuring the term is not already widely used but is descriptive enough. Philosophers might use similar terms, but this specific formulation addresses the user's scenario. The reasoning covers the elements: agreed facts, irresolvable due to differing criteria, and practical implications. This should satisfy the user's request for a defined term with clear boundaries.
answer: |-
  The closest established concept is a **criterial dispute**, though it requires careful carving to fit your pattern. Here's the reasoning and differentiation:

  1.  **Core Nature:** The disagreement centers on the *criteria for applying a concept* (sincerity, identity, apology, nationhood) within a specific context, despite full agreement on the non-conceptual *facts* (boards, memos, treaties, silt, speeches). The dispute is about the *threshold* or *conditions* under which the concept legitimately applies to the agreed-upon facts.

  2.  **Differentiation from Established Concepts:**
      *   **Verbal Dispute:** Often dismissed as "merely about words" and lacking practical consequence. Your disputes *are* linguistic/conceptual but crucially *change actions* (refusing a hand, resigning, rewriting a will). Labeling them "verbal" ignores their substantive impact and the genuine disagreement about how concepts *should* map to reality.
      *   **Factual Dispute:** Explicitly excluded. Both parties accept all empirical observations and documented events.
      *   **Metaphysical Dispute:** While often concerned with concepts like identity, traditional metaphysical disputes (e.g., realism vs. nominalism, substance vs. bundle theory) typically involve deeper, more abstract disagreements about the fundamental nature of reality or categories. Your disputes are more localized and practical, concerning the *application rules* for specific concepts in concrete situations, not necessarily challenging the underlying ontology.
      *   **Mere Difference in Emphasis/Perspective:** While perspectives differ, the core conflict isn't just highlighting different aspects; it's a fundamental clash over the *correct criteria* governing the concept's application ("Is *this* [agreed fact pattern] sufficient to count as X?").
      *   **Conceptual Ethics / Conceptual Engineering:** These fields *study* how we *should* define and use concepts for various purposes (clarity, justice, etc.). Your disputes are *instances* where such choices are contested *in practice*, often implicitly. The argument *becomes* one of conceptual ethics when they try to settle it by defining terms.
      *   **Boundary Dispute:** Close, but often used for physical or jurisdictional boundaries. "Criterial Dispute" emphasizes the conceptual *rules* defining the boundary.
      *   **Interpretive Dispute:** Too broad. It could include disputes about the meaning of a text or event where facts *are* contested. Here, facts are fixed; the interpretation is about which conceptual rules govern.

  3.  **Defining "Criterial Dispute":**
      *   **Definition:** A disagreement where parties concur on all relevant non-conceptual facts but clash over the specific criteria (conditions, thresholds, or rules) required to apply a particular concept or category (e.g., "same river," "sincere company," "nation owes apology") to those facts, resulting in incompatible practical conclusions and resistant to resolution through fact-finding or simple restatement.
      *   **Key Features it Captures:**
          *   Agreement on empirical facts.
          *   Ability to restate the opponent's *logical core* as a platitude *if their criteria are assumed*.
          *   Intransigence rooted in differing implicit/explicit criteria for concept application.
          *   Practical consequences stemming from the conceptual disagreement.
          *   Meta-displacement onto defining terms (disputing the criteria for the criteria).
      *   **Edges - What it Excludes:**
          *   Disagreements where *any* relevant factual observation is contested.
          *   Disputes resolved by clarifying definitions where no underlying criterial clash exists (simple misunderstandings).
          *   Disagreements based purely on emotional reactions or value conflicts *unconnected* to the criteria for applying a contested concept (e.g., "I hate this policy" vs. "This policy is insincere").
          *   Negotiations solely about competing interests where conceptual categorization isn't the core issue.
      *   **What it Would Be a Mistake to Call It:**
          *   **"Just Semantics":** Mistake because it dismisses the substantive practical impact and the genuine, non-arbitrary clash of underlying criteria.
          *   **A "Moot" Point:** Mistake because the disagreement directly influences action.
          *   **A "False Dichotomy":** While sometimes present, the core issue isn't necessarily the presentation of only two options, but the clash of criteria within *any* framing.
          *   **"Fundamental Metaphysical Disagreement":** Mistake (usually) because the disagreement is typically about the application rules for concepts *within* a shared, operational understanding of the world, not about the nature of existence itself (e.g., they agree rivers exist, water flows; they disagree on the persistence conditions for *this particular river's* identity).

  **Why "Criterial Dispute" Fits Best:** It directly names the locus of the conflict – the *criteria* for concept application. It avoids the dismissive connotations of "verbal" or "semantic," acknowledges the agreement on facts, explains the platitude-restatement phenomenon (each position *is* trivially true *if* its criteria are granted), accounts for the practical consequences (different criteria mandate different actions), and predicts the displacement onto definitions (defining the term *is* stipulating the criteria). It carves the phenomenon at its conceptual joint.
