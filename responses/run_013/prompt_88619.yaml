  The user's implant case is crucial here. If we judge the implanted worker as less deserving despite identical present-moment experience, that supports the origin-dependence view. I recall similar thought experiments like Strawson's "moral ledger" or Galen Strawson's Basic Argument, but this implant framing feels fresh. 

  My initial reaction aligns with the user's observation - the implanted worker seems intuitively less deserving. That suggests desert isn't just about current effort or output but source. Still, I wonder if societal practices might justify desert claims without metaphysics, à la P.F. Strawson's reactive attitudes. 

  For probabilities: 
  I'll set P1 at 0.65 - decently high because the implant case pulls me toward origin-mattering, but I'm not fully convinced. 
  P2 at 0.95 seems solid - hard to see how humans could be causa sui. 
  P3 at 0.45 reflects skepticism about compatibilism bridging to desert, though it works for responsibility. 
  P4 at 0.25 since the implant case undermines pure presentism. 

  Plugging into the formula: 
  (0.65 * 0.95) + (1 - 0.65*0.95)*0.45 ≈ 0.618 + 0.382*0.45 ≈ 0.618 + 0.172 ≈ 0.79
