prompt: |-
  I'm a third-year PhD student in philosophy of biology (technically an HPS department, but my thesis is on function talk in genomics) and I'm trying to write the section of my chapter where I stop and say what an account of biological function actually has to deliver before I go on to compare the etiological, selected-effects family with the Cummins-style causal-role family. My supervisor keeps saying "state the desiderata first" and I keep not doing it, because everytime I try I end up with a list that's just the disagreement re-stated. So: can you write me the list? And I mean requirements for my purposes, which are fairly specific -- I care about the fights in genomics and ecology where one person says a stretch of DNA is functional and another says it's junk, or where an ecologist says a keystone species has a function in the ecosystem, and it turns out they mean different things by "function" than the person arguing with them. So the theory has to let us say what claim is being made, and whether its true, in those cases -- not just handle the heart.

  The cases I'd want it to get right, roughly: the heart pumping (obviously); a heart that fibrillates, where I want to say it's broken rather than that its function changed; a mutation that appeared this generation and happens to save the organism's life before selection has had any chance to act on it; a trait fixed by drift in a tiny population that now does something useful; a stretch of non-coding DNA that gets transcribed and bound by proteins but that nobody thinks is there for a reason; a synthetic metabolic loop built in a lab out of parts with no shared evolutionary history that nonetheless keeps the cells alive; and a keystone species in an ecosystem, which worries me because species don't get selected and I suspect my etiological friends can't even state the claim. Plus the old distinction between a trait's function and a mere effect it happens to have, and the thought that function attributions have to be the kind of thing that can be right or wrong without just meaning "whatever it does."

  Give me each requirement together with the case or consideration that motivates it, mark which ones are genuinely non-negotiable and which are just commitments of one camp (I have a suspicion that at least one item on my list is smuggled in by the etiologists and shouldn't be there at all), and flag any pair or triple that can't be jointly satisfied -- that's the part I actually need, because if there's a real incompatibility then my chapter has a result instead of a survey. Also tell me which single requirement does the most work in ruling candidates out. No citations or reading list needed, I know roughly who's in which camp, though a few sentences at the end on how the etiological and causal-role families fare against the list would be useful. A table is fine if it helps.
