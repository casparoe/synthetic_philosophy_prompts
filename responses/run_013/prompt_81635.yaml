answer: |-
  Here’s a targeted Q&A prep sheet prioritizing high-damage objections from your specific audience, phrased in their vocabularies, with concise replies, vulnerability notes, and strategic concessions. Questions ordered by threat level (high to low):

  ---

  ### **Top 8 Likely Objections & Replies**  
  *(Target: 2-minute responses)*  

  1. **Normative Ethicist (Obligation vs. Blameworthiness)**  
     *Objection:* "You’re conflating moral obligation with mere liability to sanction. Isn’t 'decoration' just a label for conventions where breach warrants blame, not obligation? Your 'load-bearing' distinction collapses into blameworthiness thresholds."  
     *Reply:* "I distinguish *to whom* the duty is owed. Sanctions address social friction; obligations run *to persons*. Load-bearing conventions mediate determinate claims (e.g., queue-breaching violates the *next person’s* claim to order). Decorative breaches (e.g., under-tipping) may incur blame but violate no specific claim—they’re failures of coordination, not of duty *to X*."  
     *Soft Spot:* Blur between blame and obligation in marginal cases (e.g., server’s livelihood depending on tips).  
     *Concede Upfront:* "Yes, decorative conventions can *trigger* blame—but not because they ground obligations *to the culture*."  

  2. **Behavioral Economist (Equilibria Critique)**  
     *Objection:* "All norms are equilibria. Isn’t 'decorative' just your term for low-stakes coordination points? If tipping stabilizes service expectations, how is it not 'load-bearing'? Doesn’t your distinction vanish when norms are endogenous?"  
     *Reply:* "My distinction is *functional*, not structural. All conventions *are* equilibria, but only some mediate *claims* (e.g., queue-order protects time/autonomy). Tipping-as-convention is preference-coordination, not claim-mediation—no one is *wronged* if you stiff a server paid hourly. It’s the *employment structure*, not the convention, that bears weight."  
     *Soft Spot:* If a convention is psychologically internalized as a "claim," does it become load-bearing?  
     *Concede Upfront:* "I agree: stakes affect equilibrium stability. But stability ≠ moral obligation."  

  3. **Legal Scholar (Custom as Law)**  
     *Objection:* "Custom creates legal rights (e.g., property boundaries). If a 'decorative' tipping custom becomes legally enforceable, doesn’t that retroactively show it was load-bearing all along?"  
     *Reply:* "Legal incorporation *creates* new claims (e.g., statutory wage rights), but doesn’t retroactively moralize the convention. My argument is about *pre-legal* moral reasons: before law, tipping bound only via implicit contracts (employer reliance), not diner-to-server claims."  
     *Soft Spot:* Customary law often codifies pre-existing moral intuitions.  
     *Concede Upfront:* "Legal uptake *can* transform conventions into claim-mediators—but via institutional fiat, not inherent morality."  

  4. **Normative Ethicist (Promissory Obligation)**  
     *Objection:* "Following local custom is an implicit promise to hosts. Isn’t jaywalking/tipping equally obligatory as promise-keeping?"  
     *Reply:* "Promises require intentionality. Conventions like queueing *signal* cooperation; violating them *misleads* specific others (e.g., the person behind you). Tipping lacks this: no server reasonably infers a promise from your presence. The 'maxim' wrongly implies all customs are promissory."  
     *Soft Spot:* Social rituals (e.g., greeting norms) may imply promises of respect.  
     *Concede Upfront:* "Where conventions *are* uptake-sensitive signals (e.g., handshakes), they can generate promissory duties—but this is person-focused, not cultural."  

  5. **Anthropologist (Insider/Outsider Asymmetry)**  
     *Objection:* "Calling a practice 'decorative' reflects outsider blindness. Tipping *is* load-bearing in a service economy—it mediates claims of dignity, not just payment. Don’t you risk colonial disdain for 'irrational' customs?"  
     *Reply:* "I don’t deny tipping’s *social* weight. But if the server earns a living wage, tipping mediates no *claim*—it’s expressive. My framework asks: *Who is owed what?* If there’s no determinate claim (vs. diffuse respect), it’s decorative. This avoids imposing 'cultural duty.'"  
     *Soft Spot:* Risk of underestimating non-material claims (e.g., symbolic recognition).  
     *Concede Upfront:* "Yes, outsiders often misread practices—but my aim is to clarify obligation sources, not dismiss meaning."  

  6. **Behavioral Economist (High-Stakes Decoration)**  
     *Objection:* "What about high-stakes 'decorative' norms? E.g., refusing a ceremonial gift may trigger violence. Doesn’t your distinction collapse under stakes pressure?"  
     *Reply:* "Stakes determine *consequences*, not obligation structure. Violence arises from *third parties* enforcing group expectations—it doesn’t mean the gift-recipient had a *claim* to your compliance. Load-bearing norms must mediate *direct* claims (e.g., drivers’ safety claims)."  
     *Soft Spot:* In practice, stakes may blur third-party/claimant roles.  

  7. **Legal Scholar (Customary Rights in Private Law)**  
     *Objection:* "Courts enforce customs as implied terms in contracts (e.g., trade usage). Doesn’t this show conventions mediate claims between parties?"  
     *Reply:* "Agreed—but only when parties *reasonably rely* on the custom (e.g., merchants). This fits my model: the claim arises from reliance, not the custom *itself*. Where no reliance exists (e.g., tourists in a cafe), the convention doesn’t bind."  
     *Soft Spot:* Ambiguity in defining "reasonable reliance."  

  8. **Anthropologist (Belonging as a Moral Good)**  
     *Objection:* "Isn’t respecting 'decorative' conventions owed to the community as a whole? Belonging isn’t morally inert—it’s a precondition of trust."  
     *Reply:* "Belonging matters, but it’s not a *claim*—it’s a diffuse good. Burdening individuals with duties to 'cultures' (abstract entities) is unworkable. We foster belonging by respecting *persons*, which sometimes means following conventions *as they affect people*—not as cultural fetishes."  
     *Soft Spot:* Under-theorizes communal goods.  
     *Concede Upfront:* "Conforming to decorative norms can be *good manners*—but not morally obligatory."  

  ---

  ### **The Nightmare Question (Hope Nobody Asks)**  
  *"If conventions are equilibria coordinating behavior, doesn’t violating even 'decorative' ones harm *all* participants by destabilizing expectations? E.g., under-tipping risks industry-wide wage collapse, violating workers’ claims."*  
  *Why It’s Deadly:* Converts all conventions into load-bearing via slippery slope to collective harm.  
  *Reply Strategy:* "Harm requires *foreseeability* and *directness*. Isolated breaches rarely destabilize; systemic change requires institutional reform, not individual compliance. The server’s claim is against their *employer* for fair pay—not against each diner to prop up a broken system."  

  ---

  ### **Field Consensus vs. Contested Ground**  
  **Settled (Non-Controversial Among Specialists):**  
  - Conventions are coordination devices (behavioral econ).  
  - Not all social norms generate moral obligations (normative ethics).  
  - Customs gain force through reliance/expectation (legal theory).  

  **Genuinely Contested:**  
  - Whether "culture" or "community" can hold claims (anthropology vs. philosophy).  
  - If equilibria stability implies moral reason to comply (economics vs. ethics).  
  - How to define "reliance" or "claim" in diffuse social contexts (law/philosophy).  

  **Your Framing’s Status:**  
  - "Load-bearing/decorative" is **idiosyncratic**—not field-standard terminology.  
  - Core thesis (obligations only to persons, not cultures) aligns with **individualist** strands in ethics/law but opposes **communitarian** views.  

  ---
  **Prep Strategy:** Lead with concessions on blame/sanctions (#1) and equilibria (#2) to defuse high-damage objections early. Redirect to your core innovation: obligations must run *to specific persons*. Flag where your view is revisionary ("I depart from communitarian accounts...") rather than masking dissent as consensus.
