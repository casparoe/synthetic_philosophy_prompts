  - The normative ethicists will probe obligation/sanction distinctions - that's the biggest threat since it attacks the moral foundation. 
  - The behavioral economists will challenge the decorative concept as just low-stakes equilibria - dangerous because it could dissolve the core distinction.
  - The anthropologist will see cultural blindness in "decorative" - damaging for credibility but less theoretically fatal.
  - The legal scholar will test custom's incorporation into law - moderate risk if poorly handled.

  The user's secret worry? Probably that "decorative" conventions might still create obligations through implicit promises - that's the nightmare question since it bypasses their person-centered framework. 

  For replies, I'll keep each under 2 minutes by:
