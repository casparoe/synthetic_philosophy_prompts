prompt: |-
  For the better part of a year a reading group I sit in on has been working through the literature on coherence arguments for expected utility maximisation, and I have reached the point where I doubt the participants are disagreeing about anything the arguments could settle. The shape of it is this. One side treats the standard Dutch book and money-pump constructions as establishing something normative: an agent whose preferences and credences cannot be represented by an expected-utility function is, for that very reason, defective, since the constructions exhibit sequences of transactions that lead her, by her own lights, to a position she counts as worse. The other side grants the mathematics and denies the moral. Its members argue variously that the constructions show only that such an agent is exploitable by a well-informed counterparty; that they presuppose a completeness condition, and perhaps continuity or the definability of preferences over lotteries, which ordinary agents need not meet; and that they trade on a conception of rationality as internal coherence among attitudes which is itself a substantive commitment rather than a neutral premise. Two details from our sessions keep returning. One of us presses a variant in which the agent is never offered the whole sequence, only ever one step at a time, with no opportunity to look ahead or to reconsider, and insists that nothing has been shown to be wrong with her attitudes, only with the situation she was placed in. Another observes that the same machinery would convict any consistent goal-directed system, a thermostat included, and asks whether that shows the argument proves too much to be about rationality at all.

  My own suspicion, which I would like you to test rather than adopt, is that the two sides are answering different questions under a single heading: one is a question about consistency requirements internal to an agent's representable attitudes, the other about how an agent ought to respond to reasons, and neither side's arguments can reach the other's question. What I want is a diagnosis of the impasse rather than a verdict on the merits. Set out the strongest form of each side's case as it actually runs, and then tell me what kind of disagreement is doing the real work: a verbal dispute over the words 'rational' and 'requirement'; a disagreement about which cases count as the data, the idealised agent with complete preferences versus the ordinary agent with gaps and cycles; a hidden formal question, such as whether the representation theorems can be had without completeness or whether a pump can be rebuilt for agents whose preferences are incomplete; or a clash of starting points, rationality as coherence versus rationality as responsiveness to reasons, that no argument on either side should be expected to move. If my hypothesis misidentifies the fault line, say so and locate it properly.

  Finish by telling me what would count as progress given your diagnosis: a distinction that dissolves the dispute, a formal result, a restriction of the original claim to a narrower class of agents, or an argument that the question was ill-posed from the start. A well-argued negative verdict — that the debate cannot be resolved in the terms in which it is conducted, and why — would be more useful to me than a survey that keeps the peace.
reasoning: |-
  Hmm, this user is part of a reading group that's been debating coherence arguments for expected utility maximization for nearly a year. They've reached an impasse where one side sees Dutch books and money pumps as normative proofs of irrationality, while the other grants the math but rejects the philosophical implications. The user suspects both sides are answering different questions under the banner of "rationality" - one about internal consistency of representable attitudes, the other about responsiveness to reasons - and wants me to diagnose the disagreement rather than take sides.

  The user describes two particularly sticky points from their sessions: (1) a variant where the agent faces only isolated decisions without foresight or reconsideration opportunities, and (2) the observation that even thermostats would fail these coherence tests. They're explicitly asking me not to adopt their hypothesis but to test it rigorously, seeking the strongest versions of each position and identifying the real fault line. They want to know what would constitute progress - whether through new distinctions, formal results, scope restrictions, or recognizing the question itself is flawed.

  Let me reconstruct both positions at their strongest. The pro-coherence side's core argument is that vulnerability to exploitation through diachronic choices reveals inherent inconsistency in preferences. Their strongest form would be: If an agent's preferences violate the axioms (completeness, transitivity, independence, continuity), there exists some sequence of choices they would accept that leaves them strictly worse off by their own valuation. This isn't just about being exploited - it's that the agent becomes a walking contradiction. For the sequential choice objection, they'd argue that rationality requires maintaining consistent preferences over time, so myopic decisions that violate synchronic consistency are still defective.

  The critics' strongest counter is that coherence arguments: (1) assume unrealistic preference completeness (real agents don't have opinions on all gambles), (2) mistake exploitability for irrationality (being tricked isn't the same as reasoning poorly), (3) rely on a contested "internal coherence" view of rationality, and (4) prove too much by indicting simple goal-directed systems like thermostats. Their thermostat analogy is particularly powerful - if coherence requirements condemn systems we don't consider irrational, maybe they're not about rationality at all.

  Now, the user's hypothesis is that the two sides are answering different questions: one about whether preferences are mathematically representable, the other about whether agents respond appropriately to reasons. This seems largely correct to me, but I'd sharpen it. The real divide is between:
  - Formal rationality: Defined as satisfaction of representation theorem conditions
  - Substantive rationality: Defined as appropriate responsiveness to reasons

  The thermostat example perfectly exposes this - it satisfies formal coherence but lacks substantive rationality. Meanwhile, an agent who violates transitivity due to incommensurable values might be substantively rational while formally incoherent.

  The disagreement is fundamentally a clash of starting points. Progress wouldn't come from more formal results (the math is uncontested), but from:
  1) Explicitly distinguishing the two rationality concepts
  2) Recognizing that formal coherence is necessary only for agents with certain features (complete preferences, ability to bind future choices)
  3) Developing alternative normative models for agents with incomplete preferences

  The deepest resolution would be acknowledging that "what rationality requires" has no universal answer - it depends on what we're using the concept for (prediction? criticism? engineering AI systems?). The debate persists because both sides assume there's One True Rationality to uncover.
answer: |-
  Your diagnosis is perceptive but doesn't quite capture the core fault line. The impasse stems from a **clash of meta-normative starting points about the purpose and scope of rationality**, amplified by differing views on agency. Below, I reconstruct both positions at their strongest, pinpoint the disagreement, and propose what progress entails.

  ### Strongest Case for Each Side
  **Pro-Coherence ("Defective Attitudes") Position:**  
  *Core Argument*: Vulnerability to Dutch books/money pumps reveals *structural inconsistency* in the agent's preference-ordering. This isn't merely about exploitation by others, but about *self-undermining behavior*: the agent's own choices, when confronted with specific sequences of options, inevitably lead them to a dominated outcome relative to their initial position. The representation theorems (Ramsey, Savage) show that this inconsistency is *mathematically equivalent* to violating expected utility axioms. Rationality requires avoiding self-sabotage; thus, coherence is constitutive of agency.  
  *Responses to Objections*:  
  - **Sequential choice without foresight**: Rationality requires *diachronic stability*. If an agent cannot maintain consistent preferences across time (even without explicit foresight), their attitudes are inherently unstable. The "situation" merely exposes this defect.  
  - **Thermostat analogy**: This is a category error. Thermostats lack *intentional states* (beliefs, desires, preferences). Rationality applies only to systems with representational attitudes. Coherence arguments reveal defects in *agents*, not optimization algorithms.  
  - **Completeness/Continuity**: These are idealizations but necessary for any rigorous model of choice under uncertainty. Agents with genuinely incomplete preferences (e.g., moral incommensurables) fall outside the scope—but most apparent "gaps" are failures of reflection.  

  **Anti-Coherence ("No Normative Bite") Position:**  
  *Core Argument*: Coherence arguments confuse *mathematical possibility* with *normative failure*. The constructions show only that incoherent agents *can be exploited* by malicious counterparties—not that they are irrational *in isolation*. Rationality concerns responsiveness to reasons, not abstract consistency.  
  *Responses to Objections*:  
  - **Self-undermining sequences**: In real choice contexts (no foresight, no binding commitments), agents may reasonably accept each step without endorsing the sequence. Rationality is *local* to decision-contexts.  
  - **Completeness/Continuity**: These impose impossible demands. Real agents have preference gaps (e.g., unwilling to compare trivial gains to profound losses) or lexical priorities (e.g., safety before profit). Forcing completeness distorts rational deliberation.  
  - **Thermostat analogy**: This is illustrative, not fallacious. If coherence requirements condemn systems we intuitively deem rational (e.g., satisficers) or non-rational (thermostats), the standard is overinclusive. Rationality must be more than avoidance of arbitrage.  

  ### The Real Fault Line: Two Concepts of Rationality
  Your hypothesis identifies part of the issue but underspecifies it. The core disagreement is **whether rationality is primarily a property of *internal states* or *external actions***:  
  - **Formal Rationality (Pro-Coherence)**: Rationality is *satisfying consistency constraints on attitudes*. Violations are defective because they generate inconsistent actions *in principle*, regardless of context. The focus is on *attitude coherence*.  
  - **Substantive Rationality (Anti-Coherence)**: Rationality is *responding correctly to reasons in specific contexts*. Violations matter only if they lead to *actual* poor outcomes or unreasonable choices. The focus is on *action-guidance*.  

  This divide manifests in three irreconcilable commitments:  
  1. **Scope of Agency**:  
     - Pro-Coherence: Agents must be modeled as unified entities over time.  
     - Anti-Coherence: Agents are situated beings; rationality is context-bound.  
  2. **Normative Grounding**:  
     - Pro-Coherence: Avoidance of *possible* self-harm is intrinsically required.  
     - Anti-Coherence: Norms arise from *actual* reasons; hypothetical traps lack force.  
  3. **Idealization Tolerance**:  
     - Pro-Coherence: Idealizations (completeness, etc.) reveal necessary truths.  
     - Anti-Coherence: Idealizations distort rationality beyond recognition.  

  ### Why the Dispute Resists Resolution
  - **Verbal?** Not merely about "rational." Both sides agree that exploitable agents are flawed—but disagree on *why* (structural defect vs. situational vulnerability).  
  - **Formal?** The math is uncontested. Rebuilding pumps for incomplete preferences (e.g., **Machina’s reflection example**) only shifts the dispute to whether the new scenarios are normatively relevant.  
  - **Empirical?** Not about data from "ordinary" vs. "ideal" agents. Both sides grant that humans violate axioms; the conflict is over whether this *should* be remedied.  

  ### Paths to Progress
  Given this diagnosis, resolution requires **rejecting the presupposition that there is a single, context-independent concept of rationality at stake**. Progress would involve:  
  1. **A Distinction with Bite**: Explicitly separate:  
     - *Formal coherence*: Satisfaction of representation theorems (necessary for agents with complete, stable preferences).  
     - *Substantive rationality*: Appropriate responsiveness to reasons (possible without formal coherence, e.g., in cases of moral incommensurability).  
     This clarifies that Dutch books target the former; the latter requires independent justification.  

  2. **Scope Restriction**: Confine coherence arguments to agents who:  
     - Have the cognitive capacity to form global preferences,  
     - Operate in environments where diachronic exploitation is feasible,  
     - Value "money" (or the stakes) linearly.  
     (This excludes thermostats and agents with genuinely incomplete preferences.)  

  3. **Negative Verdict on the Original Question**: The debate is irresolvable because it conflates:  
     - A *mathematical claim*: "Violating EU axioms implies vulnerability to pumps."  
     - A *normative claim*: "Vulnerability to pumps implies irrationality."  
     The first is provable; the second assumes a contestable view of rationality as coherence. No argument from within the framework can bridge this gap.  

  **Conclusion**: The impasse arises because pro-coherence arguments presuppose that rationality *just is* formal coherence, while critics deny this equation. Progress lies in abandoning the quest for a universal verdict and instead specifying: *For which agents, in which contexts, and for which purposes* is formal coherence a rational requirement? The debate cannot be resolved on its own terms because it is fundamentally about what rationality *is*—and that question demands meta-normative reflection beyond coherence theorems. Your reading group’s next step might be to examine whether "rationality as coherence" serves its intended purpose (e.g., guiding action, avoiding regret) better than alternatives in specific domains (e.g., economics vs. moral reasoning).
