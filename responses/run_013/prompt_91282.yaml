prompt: |-
  For the last three years my firm's ethics week has ended with a satirical skit, and this year I have been handed the part of the job nobody wants: writing the handout that goes with it. The audience is a couple of hundred communications consultants who have all sat through the same compliance training and none of whom believe a word of it, and the joke we are trying to sustain is a document — a deadpan internal training manual, numbered clauses, house style, no narrator — for a firm that has made a settled corporate commitment never to lie. I would like you to write it, at roughly 800 words, with a two-sentence preamble, a run of numbered clauses, an appendix on historical precedent, and a three-question FAQ at the end. Set it in an invented jurisdiction whose statute (invented for the skit) prohibits only false statements of material fact and says nothing at all about statements that are true and yet will be understood otherwise, so that the firm's compliance department has formally concluded that honesty is a property of sentences rather than of audiences; the firm, Ashgrove & Bell, and the regulator, the Office of Statement Accuracy, are both fictional and should be treated as ordinary institutions. Please coin two or three house terms — a name for the manoeuvre of answering a question other than the one asked, a name for the practice of putting the exculpatory fact where nobody will look for it — and then use them, without fanfare, as if everyone in the building had used them for years.

  The clauses should be funny because they are competent rather than because they are absurd. I want a worked example in which the sentence is true and the thing the listener concludes is false, with the manual explaining, levelly, that the second is the listener's business; a clause on omissions, drawing the act/omission line and telling the reader that a misunderstanding the firm did not create is not the firm's to correct, with a single qualifying clause underneath it that gives a little ground and then takes it back; a clause that acknowledges, with professional regret, that telling true things in order to mislead works better than denial and costs less than denial when it is discovered (my account team calls this the paltering clause, and it should get the psychology and the deniability right); and at least one clause where the framework visibly fails — a statement that is true only because the firm buried the document that would have made it false, or true in a place where nobody can check it — which the manual should handle not by resolving but by routing to a committee. The appendix should be deadpan-admiring about precedent, describing the casuists' old distinction between a wide mental reservation, where the words themselves could in principle bear the true sense given the circumstances, and a strict one, where they could not, and describing the American perjury ruling in which literally true but unresponsive answers could not be prosecuted and the remedy was said to be a better question. Cite nothing anywhere: no sources, no reading list, no names of living people, and describe precedents rather than quoting them.

  Two last things. First, no winking: no narrator, no aside, no moment where the document admits it is a joke, and no clause that tips into self-parody by being obviously monstrous — the horror, such as it is, should come from how reasonable each individual clause sounds. Second, a colleague on the account team insists the whole manual is just applied Grice, and I would like the thing to be good enough that she cannot say it is applied Grice badly, so the said/implicated distinction has to be handled accurately and the position that a true sentence cannot be a lie has to be stated at its strongest rather than as a straw man. A reader who works in public affairs and a reader who has read the philosophy of language should both find it fair; by the end, without the manual ever conceding the point, the reader should be left with the actual question of whether there is a moral difference between lying and misleading, or only a legal one.
reasoning: |-
  We are writing an internal training manual for Ashgrove & Bell, a firm that has made a corporate commitment never to lie. The manual is set in a jurisdiction where the law (the Statute of Material Accuracy) only prohibits false statements of material fact and does not address true statements that may mislead. The compliance department has interpreted this to mean that honesty is a property of the sentence (its literal truth) and not of the audience's understanding.

   We are to write in a deadpan, professional style, using house style and numbered clauses. We will include:
     - A two-sentence preamble
     - Numbered clauses (with at least the specific ones requested)
     - An appendix on historical precedent
     - A three-question FAQ

   We are to coin 2-3 house terms without fanfare. Let's define:
     1. "Redirective Response": the manoeuvre of answering a question other than the one asked.
     2. "Peripheral Placement": the practice of putting the exculpatory fact where nobody will look for it.

   We are also to include:
     - A worked example: a true sentence that leads the listener to a false conclusion, with the manual explaining that the conclusion is the listener's business.
     - A clause on omissions, with a qualifying clause that gives a little ground and then takes it back.
     - The "paltering clause" (as the account team calls it) that acknowledges the effectiveness of using true statements to mislead.
     - At least one clause where the framework fails (e.g., a statement that is true only because the firm buried the document that would have made it false) and route it to a committee.

   The manual must not wink or break character. It should be competent, not absurd. The philosophy of language (Grice) should be handled accurately.

   Let's structure:

   Preamble (two sentences):
     Ashgrove & Bell is committed to the highest standards of ethical communication. This manual provides guidance on maintaining strict adherence to the Statute of Material Accuracy while advancing the firm's objectives.

   Numbered Clauses (we'll aim for 8-10 clauses):

     1. Definition of a Lie: A lie is a statement that is false. A statement is false if it does not correspond to a material fact. The firm's commitment is to avoid false statements.

     2. The Listener's Inference: A statement that is true may nonetheless lead a listener to an incorrect inference. The firm is not responsible for the inferences drawn by the listener, provided the statement itself is true.

     3. Worked Example: 
          Example: In response to a client's question about whether Project X has encountered delays, the firm states: "Project X was initiated on schedule and has met all internal milestones." (If the project was initiated on schedule and met internal milestones but is delayed due to external factors not captured by internal milestones, the statement is true. The listener may infer there are no delays, but that inference is not the firm's responsibility.)

     4. Redirective Response: When a direct answer to a question would require a false statement or reveal confidential information, it is permissible to provide a Redirective Response. This involves answering a related question that can be answered truthfully. (Note: This is the manoeuvre of answering a different question.)

     5. Omissions: An omission occurs when the firm fails to provide information that it is legally obligated to provide. Absent such an obligation, the firm has no duty to correct a misunderstanding that it did not create. 
          Qualifying Clause 5.1: If the firm becomes aware that a third party is acting under a material misapprehension that the firm's prior statements have not contributed to, the firm may, at its discretion, consider whether clarification aligns with the firm's interests. However, absent a legal requirement, the firm is not obligated to provide such clarification.

     6. Paltering: The use of a true statement to create a misleading impression (paltering) is a recognized communication strategy. Research indicates that paltering is often more effective than denial in managing perceptions and, when discovered, typically results in lower reputational damage and legal costs than a falsehood. The firm acknowledges that paltering is a tool within the compliance framework, provided the statement is factually accurate.

     7. Peripheral Placement: When disclosing information that includes both favorable and unfavorable facts, the firm may employ Peripheral Placement to ensure that exculpatory or mitigating facts are disclosed in a manner that does not unduly draw attention (e.g., in footnotes, appendices, or dense paragraphs). The firm must ensure that such facts are present and accessible, but their prominence is a matter of professional judgment.

     8. Framework Limitation and Committee Referral: 
          In instances where the truth of a statement depends on the accessibility of underlying evidence (e.g., a statement is true only because the document that would refute it is stored in an archive that is not publicly accessible and not reasonably discoverable), the matter must be referred to the Committee for Statement Integrity (CSI). The CSI will assess whether the statement meets the standard of material accuracy under the Statute and whether additional disclosure is warranted for reputational or ethical considerations beyond the legal requirement.

     9. Consistency in Public Statements: When making public statements, the firm must ensure that each individual statement is true. The cumulative effect of multiple statements, each true, may create an overall impression that is not accurate. The firm is not responsible for the cumulative impression, provided each constituent statement is true.

     10. Training and Oversight: All communications staff must complete annual training on these guidelines. The Compliance Department will conduct random audits of client communications to ensure adherence.

   Appendix: Historical Precedent

     The distinction between the literal truth and the conveyed meaning has a long history. In moral theology, casuists distinguished between "wide mental reservation" and "strict mental reservation". Wide mental reservation occurs when the words used, considered in their context, could in principle bear the true meaning (e.g., "I am not at home" said by a servant to an unwanted visitor, meaning "I am not at home to visitors"). Strict mental reservation, by contrast, involved words that could not bear the true meaning without an unspoken qualification (e.g., saying "I did not take it" while meaning "I did not take it for myself"). The latter was generally condemned.

     In American jurisprudence, the Supreme Court recognized that a literally true but unresponsive answer under oath could not constitute perjury. The Court noted that the remedy for such evasion lies in the questioner asking better questions.

     These precedents underscore the principle that the burden of interpretation rests with the recipient of the communication, provided the speaker's words are literally true.

   FAQ:

     Q1: Does the firm's commitment to honesty require us to correct misunderstandings?
     A1: The firm is required to correct a misunderstanding only if it was created by the firm's own false statement or if there is a legal obligation to do so. Otherwise, the firm may, but is not required to, correct misunderstandings.

     Q2: What if a true statement we make is later found to have been misleading, and the client complains?
     A2: The firm will review the statement for literal truth. If the statement was true, the firm will explain that the commitment is to truthfulness of statements and not to the audience's understanding. The firm may, as a matter of client relations, offer a clarification, but this is not an admission of non-compliance.

     Q3: Can we use Redirective Responses in written communications?
     A3: Yes, Redirective Responses are permissible in both oral and written communications, provided the response given is true and the redirect is not achieved by a false implication (e.g., by implying that the question asked has been answered when it has not). Care must be taken to avoid creating a false impression through the structure of the communication.

   We must write in about 800 words. Let's count and adjust.

   Now, writing in the style of a corporate manual, deadpan and professional.
answer: |-
  ### Ashgrove & Bell  
  **Internal Guidance Manual: Communication Under the Statute of Material Accuracy**  
  *Version 4.1 | Compliance-Approved*  

  Ashgrove & Bell is institutionally committed to the avoidance of false statements of material fact in all client, regulatory, and public communications. This manual operationalizes that commitment within the bounds of the Statute of Material Accuracy (SoMA), which prohibits only objectively false assertions and imposes no duty regarding audience interpretation.  

  #### GUIDANCE CLAUSES  
  1. **Definition of Honesty**  
     Honesty is exclusively a property of the semantic content of a statement. A statement satisfies SoMA if it is factually accurate at the time of utterance, irrespective of inferences drawn by the recipient. The firm bears no responsibility for misunderstandings arising from true statements.  

  2. **Inferential Error (Worked Example)**  
     *Scenario*: A rival firm inquires whether Ashgrove & Bell plans to bid for a government contract. The response: "Our current focus is exclusively on private-sector clients in the healthcare sector."  
     - *Factual truth*: The firm is actively working on private healthcare contracts.  
     - *Inference*: The rival concludes Ashgrove & Bell will not bid.  
     - *Compliance position*: The inference is erroneous but irrelevant. The listener’s conclusions are their own concern, provided the statement is accurate.  

  3. **Redirective Response**  
     When a direct answer would require disclosure of confidential or adverse information, employees may employ a Redirective Response: answering a different question whose answer is both true and materially innocuous.  
     - *Example*: To "Did the project exceed budget?", respond: "The project adhered to our revised Q3 allocation framework."  
     - *Note*: The response must not falsely imply it addresses the original query.  

  4. **Omissions and Third-Party Misapprehension**  
     4.1. An omission (non-disclosure) violates SoMA only if a legal or contractual duty to disclose exists. Misunderstandings arising solely from external sources (e.g., market speculation, competitor claims) do not require correction.  
     4.2. *Qualifier*: If the firm’s *prior* statement materially contributed to the misunderstanding, Legal Affairs may authorize a clarification to mitigate reputational risk. Such clarifications must not introduce new adverse disclosures unless mandated.  

  5. **Paltering as Strategy**  
     Paltering—using selective truths to create a misleading impression—is operationally superior to denial in most contexts. Empirical analysis confirms:  
     - Paltering reduces short-term escalation by 73% compared to false denials (per Internal Audit Study #22-08).  
     - When exposed, it incurs 61% lower regulatory penalties and preserves client retention by emphasizing the literal truth of the statement.  
     *Compliance Note*: Paltering remains SoMA-compliant if every component assertion is factual.  

  6. **Peripheral Placement**  
     When disclosing unfavorable facts, employees must practice Peripheral Placement: positioning critical qualifiers in low-salience document regions (e.g., footnotes, appendices, boilerplate).  
     - *Standard*: The fact must be technically accessible (e.g., not obscured by encryption). Prominence is discretionary.  
     - *Example*: Burying a conflict of interest in Section 12(d) of a 200-page RFP attachment complies if the text is accurate.  

  7. **Archival Integrity and Committee Referral**  
     Statements reliant on inaccessible evidence (e.g., "Project Titan faced no internal dissent" when dissenting reports exist but are classified to a sealed archive) present interpretive challenges. Such cases must be routed to the Committee for Epistemic Scrutiny (CES). CES will evaluate:  
     - Whether the statement’s truth depends on suppressed evidence.  
     - Whether suppression was procedurally routine (e.g., standard records retention) or exceptional.  
     *Outcome*: CES may approve, amend, or retire the statement. No individual employee may resolve these cases.  

  8. **Cumulative Misimpression**  
     A series of true statements may collectively imply a falsehood (e.g., attributing quarterly revenue growth solely to operational efficiency when 80% derived from a one-time asset sale). Compliance requires only that each discrete assertion be true; holistic interpretation falls outside SoMA’s remit.  

  ---  
  #### APPENDIX: HISTORICAL PRECEDENT  
  The firm’s approach aligns with longstanding interpretive traditions. Medieval casuists distinguished *wide mental reservation* (words bear a defensible true meaning under context, e.g., "I am not liable" when liability hinges on an unverified clause) from *strict mental reservation* (words admit no plausible truth without undisclosed qualifiers, universally condemned). SoMA’s silence on implication echoes the U.S. Supreme Court’s ruling on perjury: literally true but unresponsive testimony cannot be prosecuted, as the remedy lies in the questioner’s precision. These precedents affirm that linguistic truth, not audience effect, anchors ethical communication.  

  ---  
  #### FAQ  
  **Q1: Must we correct a client’s misunderstanding if we didn’t cause it?**  
  *A1*: No. Correcting third-party misapprehensions is optional unless a prior firm statement contributed to the error (Clause 4.1–4.2) or a statutory duty applies. Voluntary clarifications should avoid new risk exposure.  

  **Q2: Can Redirective Responses be used in earnings calls?**  
  *A2*: Yes, provided the response is factually accurate and does not falsely imply relevance to the question (Clause 3). Redirective Responses are preferable to "no comment" in maintaining stakeholder confidence.  

  **Q3: What if CES deadlocks on an archival-integrity case?**  
  *A3*: The statement is suspended pending CEO review. During suspension, employees may not use it in external communications but may note, "This aspect remains under internal evaluation."  

  ---  
  *Issued by Compliance & Ethics | © Ashgrove & Bell*
