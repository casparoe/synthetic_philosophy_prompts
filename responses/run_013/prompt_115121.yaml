prompt: |-
  I'm the editorial lead for a clinical reference database, we add two or three new condition entries a month, and the label really matters, clinicians code from us, insurers pay from us, and patients read themselves into us. Lately every argument is the same argument wearing a different hat. Someone wants a proper entry for persistent grief after a loss, someone else wants one for obesity, and the menopause crowd are pushing for a rewrite of what we already have. I keep hearing two camps, disease is a biological function going wrong versus disease is harm plus a willingness to call it a problem, and a third lot insisting you need both. Write me a decision procedure my editors can actually run on a proposed entry, grounded in that debate but usable by someone with no philosophy training and an hour to spare. The questions to ask in order, what counts as a sufficient answer to each, which of them are empirical and which are value calls dressed up as empirical, where the procedure stops with a no, and where it hands the decision to a person because the question is one of values rather than facts. Then run it on the three cases above, including at least one where it gives an answer I won't like. Be honest about what the procedure can't do, especially where the underlying biology is unsettled and the dysfunction claim is really just a placeholder for something we haven't worked out yet.

  Lead with the bottom line in your first sentence, the single question that does most of the work, then the procedure itself, no preamble and no restating of the brief.
reasoning: |-
  Okay, the user is an editorial lead for a clinical reference database. They need a practical decision procedure to evaluate new condition entries. The key issues they're facing involve debates on whether something qualifies as a disease—biological dysfunction vs. harm plus societal recognition. 

  First, I need to identify the core question that cuts through the debate. The most efficient approach is determining if the condition involves biological dysfunction, as this is foundational in medical taxonomy. If a condition lacks measurable biological dysfunction, it requires deeper scrutiny about harm and societal consensus.

  Next, building a step-by-step procedure. Start with empirical checks: Is there measurable biological dysfunction? Use standardized criteria like lab tests or imaging. If yes, proceed to harm assessment. If no, move to harm evaluation—persistent, disproportionate distress or impairment. Then, check societal recognition: professional guidelines, formal classifications like ICD, and absence of healthy minority objections. 

  Allocating decision points: Step 1 is empirical; a "no" stops the process unless harm is severe. Steps 2 and 3 mix facts and values. Step 2 (harm) leans empirical but involves value judgments on impairment thresholds. Step 3 (recognition) is values-based, requiring editorial judgment. 

  Now, applying this to the three cases:
  - Persistent grief: No clear biological dysfunction, but significant harm. Recognition is emerging but contested. The procedure would flag it as a values decision due to lack of biological dysfunction and evolving recognition.
  - Obesity: Clear biological dysfunction (adipose tissue pathology) and harm. Recognition is established. Meets all criteria—yes to inclusion.
  - Menopause: Biological changes are normal, not dysfunctional. Harm is variable; societal recognition is split. The procedure stops at Step 1 with a "no" since no inherent dysfunction exists, though rewrites for clarity might be needed.

  The user won't like the menopause outcome, but the procedure is consistent. Limitations: Unsettled biology makes dysfunction claims tentative; values-based decisions can be contentious. The procedure can't resolve debates where biology is unclear or societal views conflict irreconcilably. Transparency about these gaps is crucial for editorial integrity.
answer: |-
  **Bottom line: Does the condition involve measurable biological dysfunction (pathophysiology) independent of societal judgment?**

  **Decision Procedure:**

  1.  **Is there objectively measurable biological dysfunction (pathophysiology)?**
      *   **Ask:** Can the condition be defined by specific, replicable deviations from normal biological structure or function (e.g., lab values, imaging findings, cellular pathology, genetic variants, disrupted physiological pathways)? Is this deviation *central* to the condition?
      *   **Sufficient Answer (Yes):** Clear evidence of pathophysiology using standard diagnostic tools/definitions (e.g., HbA1c for diabetes, specific autoantibodies for autoimmune disease, validated neuroimaging findings, specific genetic mutations). *Proceed to Step 2.*
      *   **Sufficient Answer (No):** The condition is primarily defined by symptoms, behaviors, or experiences without a known or consistently measurable core biological deviation, OR the biological changes are within the normal adaptive range for a life stage/event. *Proceed to Step 2A.*
      *   **Nature:** Primarily **Empirical.** (Relies on current scientific evidence, though definitions of "normal" can have value components).
      *   **Stop/Handoff:** If "No" AND the answer to Step 2A is also "No" -> **Stop: Do not classify as disease entry.** If "No" but Step 2A is "Yes", proceed to Step 3.

  2.  **Does the biological dysfunction cause significant harm (distress or functional impairment)?**
      *   **Ask:** Is there robust evidence that the identified pathophysiology consistently leads to significant negative consequences for the individual? (e.g., pain, disability, reduced life expectancy, organ failure, significant psychological suffering *directly caused by* the pathophysiology).
      *   **Sufficient Answer (Yes):** Epidemiological data, clinical studies, or established medical knowledge demonstrates a clear link between the dysfunction and significant adverse outcomes common to the condition. *Proceed to Step 3.*
      *   **Sufficient Answer (No):** The dysfunction exists but is frequently benign, asymptomatic, or its link to harm is weak/inconsistent. *Proceed to Step 2A.*
      *   **Nature:** **Mixed (Empirical + Values).** Evidence shows links, but defining "significant" harm involves value judgments about suffering and impairment thresholds.
      *   **Stop/Handoff:** If "No" AND Step 2A is also "No" -> **Stop: Do not classify as disease entry (e.g., benign anatomical variant).** If "No" but Step 2A is "Yes", proceed to Step 3.

  2A. **Does the condition cause significant harm (distress or functional impairment) *regardless* of identifiable core pathophysiology?** *(Use ONLY if Step 1 or Step 2 was "No")*
      *   **Ask:** Is there robust evidence that the condition *itself* (the constellation of symptoms/experiences) consistently causes significant suffering, disability, or increased risk of mortality/morbidity, even if a single core biological dysfunction is elusive?
      *   **Sufficient Answer (Yes):** Epidemiological data, clinical studies, or patient-reported outcomes show high prevalence of significant distress, functional limitations (work, social, daily living), or increased health risks directly attributable to the condition. *Proceed to Step 3.*
      *   **Sufficient Answer (No):** The experience is common, often transient, not typically disabling, or distress/impairment is highly context-dependent and not inherent to the condition itself. **Stop: Do not classify as disease entry.**
      *   **Nature:** **Mixed (Empirical + Values).** Evidence shows prevalence of harm, but defining "significant" and attributing harm *specifically to the condition* involves values.

  3.  **Is there substantial professional consensus recognizing this *as a medical condition requiring clinical attention*?**
      *   **Ask:** Is the condition formally classified in major diagnostic manuals (ICD, DSM where appropriate)? Do major clinical guidelines from relevant specialties (e.g., Endocrine Soc, AHA, APA, specialist colleges) specifically address its diagnosis and management as a health condition? Is there broad agreement *within medicine* that this falls within the clinical realm? Is there a *lack* of a significant "healthy minority" argument (i.e., is this state generally seen as undesirable by those experiencing it)?
      *   **Sufficient Answer (Yes):** Inclusion in ICD, recognition in major specialty guidelines, established clinical management pathways, broad consensus among practitioners treating it. **Result: Include/Classify as Disease/Condition entry.**
      *   **Sufficient Answer (No/Contested):** Absence from major classifications, conflicting guidelines, significant professional debate about medicalization (e.g., "Is this a disease or a normal/non-medical problem?"), existence of a substantial group experiencing the state without distress/impairment who object to labeling.
      *   **Nature:** Primarily **Values (dressed as Empirical).** Reflects societal/professional norms and judgments about the role of medicine.
      *   **Handoff:** **Editorial Judgment Required.** The core question is one of values and professional scope, not settled science. The editorial team must weigh the evidence of harm (Steps 2/2A) against concerns about over-medicalization, respect for diversity of experience, and current professional boundaries. *Acknowledge the debate within the entry.*

  **Procedure Limitations:**
  1.  **Unsettled Biology:** It *cannot* definitively resolve cases where the claim of "biological dysfunction" is a placeholder for unknown mechanisms. Step 1 becomes highly uncertain. The procedure may incorrectly flag such conditions at Step 1 ("No") even if harmful (Step 2A "Yes") and later recognized (Step 3 "Yes"). Transparency in the entry about the unknown biology is crucial.
  2.  **Value Conflicts:** It *cannot* resolve fundamental value disagreements about what constitutes "dysfunction," "harm," or the proper role of medicine (Steps 2, 2A, 3). It flags these for human judgment.
  3.  **"Normal" Variation:** Defining "normal" biological function (Step 1) can be context-dependent (age, environment) and involve value judgments.
  4.  **Evolving Consensus:** Professional consensus (Step 3) changes. The procedure provides a snapshot.

  **Applied to Cases:**

  1.  **Persistent Grief (Prolonged Grief Disorder)**
      *   **Step 1:** No. While neurobiological *correlates* exist, no single, measurable core pathophysiology defining the *disorder* (vs. normal grief) is established. Grief itself is a normal response. *Proceed to Step 2A.*
      *   **Step 2A:** Yes. Robust evidence shows significant distress, functional impairment (social, occupational), increased mortality risk, distinct from normal grief and depression. *Proceed to Step 3.*
      *   **Step 3:** Contested. Included in DSM-5-TR and ICD-11, but significant debate persists about medicalization of grief, concerns about pathologizing normal variation, and defining duration thresholds. **Handoff: Editorial Judgment Required.** The entry should acknowledge the debate while providing clinically useful information based on the recognized diagnostic criteria.

  2.  **Obesity**
      *   **Step 1:** Yes. Clearly defined pathophysiology: Dysfunctional expansion of adipose tissue leading to chronic inflammation, dysregulated adipokine signaling, metabolic dysregulation (insulin resistance, dyslipidemia), mechanical stress. Measurable via BMI (flawed but functional proxy), waist circumference, metabolic panels. *Proceed to Step 2.*
      *   **Step 2:** Yes. Well-established causal links to significant harm: T2DM, CVD, certain cancers, OSA, osteoarthritis, fatty liver disease, significant psychosocial distress/impairment. *Proceed to Step 3.*
      *   **Step 3:** Yes. Recognized as a chronic disease by WHO, AMA, AHA, Endocrine Society, etc. Included in ICD. Managed within clinical guidelines. **Result: Include as Disease/Condition entry.** (Note: The procedure supports inclusion, but debates about stigma, determinants, and treatment focus remain crucial for entry *content*).

  3.  **Menopause (as a "Disease" requiring a fundamental rewrite framing it as pathological)**
      *   **Step 1:** **No.** The core biological changes (declining ovarian function, cessation of menses) are a *normal, universal* part of female aging/biology, not a deviation from normal function for this life stage. While *symptoms* (vasomotor, urogenital) involve pathophysiology, the *state itself* is not defined by dysfunction. *Proceed to Step 2A.*
      *   **Step 2A:** Mixed. *For many women:* Yes, symptoms cause significant distress and functional impairment. *For many others:* Minimal symptoms, no distress, or even positive experiences. Harm is *not* inherent to the state itself but to the *symptoms* experienced by a subset. *Proceed to Step 3.*
      *   **Step 3:** Contested. Menopause itself is *not* classified as a disease in ICD/DSM. Major guidelines (e.g., NAMS, Endocrine Soc) focus on *managing symptoms and health risks* associated with the *transition and postmenopausal state*, not on labeling menopause itself as a disease. There is a significant "healthy majority/minority" argument – many women object to framing this normal life stage as a disease. **Handoff: Editorial Judgment Required. BUT...** the procedure strongly suggests the *fundamental rewrite framing menopause itself as a disease is not justified*. The existing entry should focus on the *physiological process*, its potential *symptoms and associated health risks*, and their *management*, not labeling the state as pathological. **This is the answer you won't like:** The procedure stops the core "disease" label rewrite at Step 1. It supports detailed entries on symptoms (VMS, GSM) *as medical conditions requiring treatment* (they pass Steps 1, 2, 3), but not menopause itself.
