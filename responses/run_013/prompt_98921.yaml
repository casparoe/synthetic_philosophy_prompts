prompt: |-
  Bit of an odd one for you. I write about science and ideas (currently at a magazine, before that a paper), and I'm working up a long piece on targeted killing — drones, the whole thing — and I want to use Anscombe as the spine of it, but not the Wikipedia version. Everyone reaches for her and comes out with "double effect, so you can't target civilians, the end." Her actual argument against Truman is stranger and sharper than that, and I think it has more bite than the version that gets passed around. So what I want from you is a proper workout: one real episode, run through her actual view rather than the gloss.

  Take the strike that killed Ayman al-Zawahiri on the balcony in Kabul in the summer of 2022 — one of those missiles, he was the intended target, the US said nobody else died, the family was apparantly in the building. Run it through her account of intention and side-effects as she'd really apply it. First question, and it's the one that decides the rest: who counts as the agent on her view — the operator, the planners, the people who signed off — and does the description of what they did ("killed a terrorist" versus "killed a man on a balcony") do any of the work, or is that just a lawyer's trick?

  Then the hinge I keep tripping on. She was never a pacifist — she thought killing enemy combatants in a just war was fine — and her objection to Truman was that the bomb killed the *innocent*. So does her framework even condemn this strike, given who the target was? And if it doesn't, is that her problem or the problem of everyone who cites her? Push on the foreseen part too, the family in the room, because I genuinely can't tell whether on her view that's a side-effect that's permitted or part of the plan.

  Last, flip it round. Where does she run out of road? She was writing about a city flattened by one bomb; she's got nothing like a proportionality calculus and I dont think she wants one. So does her framework say anything useful about a one-man strike, or about the gap between what the law calls a legitimate military target and what she'd call murder — or does the episode just show that her account was never built for this kind of war and doesn't have to be?

  Keep it concrete. No bibliography, just the argument.
reasoning: |-
  Okay, let's tackle this query step by step. The user is a science and ideas writer working on a piece about targeted killing, specifically using Elizabeth Anscombe's philosophy beyond the simplified "double effect" interpretation. They want to apply her actual arguments to the 2022 drone strike that killed Ayman al-Zawahiri in Kabul, focusing on concrete analysis rather than abstract theory.

  First, I need to recall Anscombe's core arguments from "Mr. Truman's Degree," where she condemns the atomic bombing of Hiroshima. Her key points are: 1) The absolute prohibition against intentionally killing the innocent, 2) The distinction between intended means/ends versus foreseen side-effects, 3) Rejection of utilitarian "greater good" justifications, and 4) The moral significance of accurately describing intentional actions.

  For the al-Zawahiri case, the user raises three main questions:
  1. Who is the moral agent? This requires examining the chain of responsibility - from operators to planners to policymakers. Anscombe would likely see the entire apparatus as co-agents, with the most culpability lying with those who authorized the strike. The description of the action matters fundamentally for her - calling it "killing a terrorist" versus "killing a man on a balcony" isn't just semantics but gets to the heart of intentionality.

  2. Does her framework condemn this strike given al-Zawahiri was a combatant? Here's where it gets nuanced. While Anscombe permits killing combatants in just wars, the presence of his family in the building complicates things. Even if their death was "foreseen but not intended," Anscombe would demand rigorous examination of whether their presence was treated as an acceptable cost. The user's question about the family being in the room is crucial - if their safety wasn't actively prioritized, this might violate her strict standard.

  3. Where does her framework fall short? The atomic bomb analogy breaks down with precision strikes. Anscombe had no proportionality calculus, so applying her to a strike with minimal collateral damage feels like using a sledgehammer for a scalpel job. Yet her core question - "what exactly did you intend to do?" - remains piercing even for drone warfare, especially regarding intelligence failures or recklessness.

  The user seems frustrated with superficial applications of double effect theory. They're hinting that Anscombe's real value lies in her uncompromising focus on intentionality and moral description - which could make drone warfare more scrutinizable than under standard just war theory. But they're also right that her lack of proportionality framework creates limitations in modern asymmetric warfare contexts.

  For the response, I should: 
  - Map Anscombe's Hiroshima arguments directly onto the al-Zawahiri case
  - Highlight the moral weight she places on action descriptions
  - Stress that for Anscombe, foreseen civilian risk requires active mitigation efforts
  - Acknowledge that while her framework adapts to precision strikes, its categorical nature struggles with marginal cases
  - Suggest that her enduring relevance is in forcing us to articulate exactly what we're willing to destroy for security
answer: |-
  Let's gut Anscombe properly. The Truman essay isn't about a tidy doctrine; it's about **moral clarity in description**. Applying it to the Zawahiri strike exposes uncomfortable tensions.

  1.  **The Agent & The Description: It's All One Fabric.**
      *   For Anscombe, the *moral agent* is whoever *intentionally does* the act under a description. This isn't just the operator pressing the button. It includes **everyone who intentionally participates in making the strike happen with knowledge of its nature** – the planners selecting the method/time, the analysts assessing risk, the commanders authorizing it. They are co-agents in a *shared intentional action*.
      *   **The description is crucial, not a trick.** How you describe the act *defines* what you intended. "Killing a terrorist" is an *end* or *means*. "Killing a man on a balcony" is the *basic action*. But the critical description for Anscombe is: **"What *else* did you intentionally do?"** If you knew the balcony was part of a residence with non-combatants present, and you fired a missile at it, your intentional act isn't *just* "killing Zawahiri." Part of the intentional act is **"destroying a residential balcony (and likely parts of the residence) in a densely populated area with people inside."** This isn't a side-effect *yet*; it's part of the *means* you chose. You *intended* to destroy that structure to kill him. That factual description shapes the moral reality.

  2.  **The Hinge: Innocence, Intention, and the Family in the Room.**
      *   **Targeting Zawahiri:** Anscombe *would likely permit* intentionally killing Zawahiri *if* he was a legitimate combatant in a just war (a big "if" she’d scrutinize, but let’s grant it for argument). Her problem with Truman was targeting *the innocent* (civilians) *as a means* to end the war.
      *   **The Family & The Balcony Strike: This is where her framework bites hard.** The US said the family was inside. Even if they weren't *targeted*, their presence was *foreseen* as a serious possibility (intelligence surely considered it). For Anscombe, the question isn't *just* foresight; it's **whether their potential death is part of your *chosen means* or merely an unavoidable side-effect of a legitimate act.**
          *   **The Strike as Chosen Means:** You *chose* to fire a missile at a *residential building* in a *city*. Destroying that building/balcony was not incidental; it was the *method* required to kill him there. Anyone inside that structure *at the moment of impact* is not merely *foreseen* to be at risk; they are **within the scope of the destruction you intentionally wrought as your means.** You intended to annihilate that specific physical space knowing people might be in it. Their death isn't a *separate* side-effect like distant fallout; it's *constitutive* of the violent act you performed *in that location*.
          *   **Anscombe's Condemnation:** She would argue that knowingly killing non-combatants *within the immediate zone of the violent means you chose* (the exploding balcony/residence) isn't a permissible "side-effect." It becomes **part of the intentional act of destruction you performed.** You cannot claim you only intended the "good effect" (killing Zawahiri) while the "bad effect" (killing his family, if it happened) was merely foreseen but not intended. By choosing *this method* in *this place*, you *intentionally* subjected everyone in that immediate space to lethal violence. If non-combatants died there, you *intended* to kill them *as part of* your intentional act of destroying that location to kill Zawahiri. This violates the absolute prohibition on intentionally killing the innocent. The fact that you hoped they *wouldn't* be there, or that intelligence suggested a low probability, doesn't absolve you if you proceeded knowing the risk was real and the consequence of your chosen means. You gambled with their lives as part of your plan.

  3.  **Where She Runs Out of Road (and Where She Doesn't):**
      *   **Proportionality Gap:** You're right. Anscombe has **no truck with proportionality** in the modern just-war sense ("only 2 civilians died, worth it for Zawahiri"). For her, *intentionally* killing the innocent is *always* murder, full stop. Proportionality only applies to *foreseen but unintended* side-effects *outside* the direct means. Her framework **cannot morally distinguish** between flattening Hiroshima and killing one terrorist plus his entirely innocent family *if* the family's death is deemed intentional (as above). This feels jarring in asymmetric warfare – it seems to demand either pacifism or impossibly pure acts of violence.
      *   **Usefulness & Limits:**
          *   **Bite:** Her framework is brutal on **recklessness and convenience.** It condemns actions where non-combatant presence is foreseeable and the chosen method inherently endangers them *within the direct strike zone*. It forces a stark question: **Did you *have* to do it *this exact way*?** Could you have captured him? Waited for him to leave? Used a smaller weapon? If feasible alternatives existed that minimized the direct endangerment of innocents, choosing the balcony strike looks like intentional disregard, making their potential death part of the chosen means.
          *   **The "Legitimate Target" Problem:** She highlights the **dubious moral comfort of the "combatant" label.** Was Zawahiri, an old man on a balcony unarmed at that moment, actively engaged in hostilities? Anscombe would demand rigorous justification for labeling him a *current* combatant subject to direct lethal force. The legal category isn't automatically morally decisive for her.
          *   **Not Built For This?** Partly true. City bombing was her explicit target. But her core insight – **the moral significance of the precise description of what you intentionally do, and the absolute prohibition on making the innocent a part of your plan (even if only as "acceptable risk" within your chosen destructive means)** – remains scalpel-sharp. The Zawahiri strike *exposes* the limits of her absolutism regarding the "direct means" zone, but it also **reveals the moral evasion in calling the family's potential death a mere "side-effect"** when the method chosen made their presence in the kill zone the critical vulnerability exploited. Her framework forces us out of the fog of "collateral damage" and demands we stare at the concrete, violent reality of *what we chose to do* to achieve our end.

  **The Spine:** Anscombe's real lesson for drone warfare isn't a legalistic double-effect test. It's that **how we describe the act reveals the intention, and intentionally destroying a space containing innocents as your chosen method makes their death part of your intention, not an accident.** The Zawahiri strike, on her terms, isn't condemned because he was killed, but because the method intentionally risked (and would have made intentional) the death of anyone else *right there* with him. Her framework struggles with modern precision, but it relentlessly attacks the moral complacency of "acceptable risk" applied to those directly in the crosshairs of our chosen violence.
