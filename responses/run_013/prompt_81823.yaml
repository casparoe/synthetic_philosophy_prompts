prompt: |-
  ok so I'm running a reading group on the problem of universals next term and I want to hand out a proper desiderata sheet instead of the usual 'one over many, therefore realism' thing everyone already knows. I dont want the standard three-item list. I want the full spec: what any adequate theory of properties/universals has to deliver, each requirement tied to the case or consideration that forces it, and then your call on which requirements are negotiable and which arent.

  Things I want on the list (add whatever I'm missing, but these are the ones I care about):

  - impure / haecceitistic properties: being identical to a particular, being a mile from the Eiffel Tower, being such that Sally is taller than you. Any theory that only handles 'pure' universals has to say something about these, and they look like properties in every syntactic and inferential way.
  - the determinable/determinate family structure: scarlet is a way of being red, and something can be red and scarlet at once but not red and blue all at once, which a mere class of red things can't obviously reproduce.
  - Boolean structure: properties seem closed under conjunction, negation, disjunction, but sparse-property people deny most of those are properties, so say what the theory is supposed to do here.
  - second-order properties and quantification over properties, since the theory is meant to underwrite talk about being a colour or being a fundamental property.
  - relations, not just monadic properties -- and specifically the problem that a relation's instances seem to need to be 'together' in a way the theory has to explain.
  - Bradley-style regress worries about instantiation and compresence, and whether the theory needs a primitive that just relabels the problem.
  - empty predicates: there could be a predicate with no instances, and the theory has to say whether it expresses a property.
  - the sparse/abundant divide and where the theory is allowed to draw it -- I think this one kills more views than any other, so be honest about it.
  - Cambridge properties, since if those count then almost anything goes and parsimony is dead.

  Then the part I really want: which of these can't be had together? I suspect determinable/determinate + full Boolean closure + sparse properties is jointly unsatisfiable, but tell me if I'm wrong, and which other pairs break. Also flag any requirement I've smuggled in from one camp that a rival would just reject -- I'd rather know it's a prejudice of one side than have it quietly doing the excluding work.

  Then briefly score the usual suspects against the list -- Armstrong-style immanent universals, transcendent/Platonic ones, trope theory with primitive resemblance, class nominalism, resemblance nominalism, structural universals -- a line or two each on what they get right and which requirement they most clearly fail. Keep the scoring short, the desiderata are the deliverable. Purpose, in case it matters: I want a theory good enough to do two jobs at once, grounding a Humean best-system account of laws and supporting reference magnetism in metasemantics, so if those two pull the desiderata in different directions, say so.
reasoning: |-
  Okay, let me start by unpacking the user's query. They're running a reading group on the problem of universals and want a comprehensive desiderata sheet. The usual "one over many" argument isn't enough; they need a detailed list of what any theory must explain, tied to specific cases. They've listed several key points: impure properties, determinables/determinates, Boolean structure, second-order properties, relations, Bradley's regress, empty predicates, sparse vs. abundant, and Cambridge properties.

  First, I need to ensure all their mentioned points are covered and identify any gaps. They mentioned impure properties like haecceitistic ones. These are important because syntactically they behave like properties, so any theory must account for them or explain why they're excluded. Then determinables and determinates—how properties like red and scarlet relate structurally. Boolean operations are tricky because sparse theories might deny disjunctions or negations exist as properties. Second-order properties involve quantifying over properties themselves, which ties into higher-order metaphysics.

  Relations are another big one. The user wants an explanation of how relations are instantiated together, not just as separate properties. Bradley's regress is a classic issue: does positing a relation between a universal and a particular lead to infinite regress? Empty predicates challenge theories to decide if uninstantiated properties exist. The sparse/abundant divide is crucial because it affects parsimony and what counts as a real property. Cambridge properties, like being such that 2+2=4, could trivialize properties if included.

  Now, considering the user's deeper needs. They mentioned two purposes: grounding a Humean best-system account of laws and supporting reference magnetism for metasemantics. For Humean laws, properties need to be sparse to pick out natural properties that figure in laws. Reference magnetism requires properties to be natural and carve reality at the joints. But these might conflict. Humeanism might want an abundant basis to define laws via systematization, while reference magnetism needs sparse properties to guide reference. So the desiderata must balance both, perhaps by having a sparse subset within an abundant framework.

  I should check if there are missing desiderata. For example, causal efficacy? The user didn't mention it, but since they care about laws, properties might need to be causally relevant. Also, perhaps the relationship between properties and predicates—how linguistic expressions map to metaphysical properties. Also, the unity of properties: what makes a property a single entity despite multiple instantiations? That's related to the "one over many" but maybe needs explicit mention.

  Next, conflicts between desiderata. Full Boolean closure with sparse properties is tricky. If properties are closed under negation and disjunction, you get properties like "non-red," which might not be sparse. Determinables and determinates also challenge sparsity; if both red and scarlet are properties, how do they relate without overpopulating the sparse set? Haecceitistic properties might clash with sparsity if they're too particular. Also, Cambridge properties could undermine sparsity entirely.

  Scoring theories briefly: Armstrong's universals handle determinables and relations but struggle with Boolean closure. Tropes can handle impure properties but need primitive resemblance. Class nominalism has abundant properties but fails on sparse/abundant divide. Structural universals might solve determinables but face regress issues.

  I need to ensure each desideratum is tied to a case. For example, impure properties: being identical to Socrates. For determinables, red vs. scarlet. Boolean: disjunction like "red or round." Second-order: the property of being a color. Relations: "taller than." Bradley: the instantiation regress. Empty: "unicorn." Cambridge: being such that S is taller than P.

  The user wants to know which requirements are non-negotiable. Sparsity might be necessary for their projects, but they need to accept some abundance for Boolean operations. Also, reference magnetism might require sparse properties, while Humean laws could work with an abundant base. Highlighting trade-offs is key. For instance, if a theory rejects full Boolean closure, it might still serve the Humean project if it has enough structure for laws.

  Finally, the user might need clarity on which desiderata are framework-dependent. For example, Platonists might reject impure properties as non-universals, while trope theorists embrace them. Pointing out such biases helps the reading group critically evaluate each theory.
answer: |-
  Here’s a comprehensive desiderata sheet designed for advanced discussion, with each requirement tied to its motivating case, negotiability assessments, conflicts, and brief theory scores. I’ve expanded your list to 12 core items, including key omissions (e.g., causal efficacy, unity, and modality).  

  ---

  ### **Desiderata for a Theory of Properties/Universals**  
  *Each tied to the problem forcing it, with negotiability flags*  

  1. **Impure/Haecceitistic Properties**  
     - **Case**: Syntactic/inferential role of predicates like "is identical to Socrates", "is 1km from the Eiffel Tower". If properties ground predicate semantics, these demand explanation.  
     - **Non-negotiable?** No. *But*: Must explain why they’re excluded if the theory rejects them (e.g., "not genuine universals").  
     - **Conflict**: With sparsity (e.g., sparse theories often exclude them).  

  2. **Determinable-Determinate Structure**  
     - **Case**: Scarlet → Red → Colored; something can be red *and* scarlet but not red *and* blue simultaneously. Requires property hierarchies beyond sets/classes.  
     - **Non-negotiable?** Yes for theories of natural kinds/laws. *But*: Can be rejected if properties are purely extensional.  
     - **Conflict**: With full Boolean closure (determinates aren’t mere conjunctions).  

  3. **Boolean Closure**  
     - **Case**: If "red" and "round" express properties, "red and round" (conjunction) and "non-red" (negation) behave like properties in inference.  
     - **Non-negotiable?** No for sparse theories (deny negations/disjunctions exist). *But*: Abundant theories *must* deliver this.  
     - **Conflict**: With sparsity (e.g., "grue" is a Boolean construct but unnatural).  

  4. **Second-Order Properties & Quantification**  
     - **Case**: "Being a color is a visual property" – requires properties of properties ("second-order redness") and quantification over properties ("∃F fundamental(F)").  
     - **Non-negotiable?** Yes – any theory must underwrite meta-property talk in philosophy/science.  

  5. **Relations (Polyadic Properties)**  
     - **Case**: "a is taller than b" – instances (a,b) must be unified *as a pair*; not reducible to monadic properties (e.g., "a is tall-at-b").  
     - **Non-negotiable?** Yes. *Problem*: Avoid Bradleyan regress (see #6).  
     - **Conflict**: With tropes (relational tropes are contentious) and nominalism (relations resist class-theoretic reduction).  

  6. **Bradleyan Regress & Instantiation**  
     - **Case**: If instantiation (e.g., Socrates-instantiates-Redness) is a relation, what relates Socrates *to* this relation? Infinite regress threatens.  
     - **Non-negotiable?** No. *But*: Theory must *either* resolve regress (e.g., via non-relational instantiation) or reject its coherence.  

  7. **Empty Predicates**  
     - **Case**: "is a unicorn" has no instances, yet supports truths (e.g., "unicorns don’t exist"). Does it express a property?  
     - **Non-negotiable?** No. *But*: Theory must explain how empty predicates function semantically.  

  8. **Sparse vs. Abundant Divide**  
     - **Case**: "Being grue" vs. "being green" – sparse properties (e.g., natural kinds) do metaphysical work (laws, causation); abundant properties satisfy all predicates.  
     - **Non-negotiable?** **Crucially yes** for your purposes (laws/reference magnetism). Theory must ground the distinction or reject it.  

  9. **Cambridge Properties**  
     - **Case**: "Being such that 2+2=4" – satisfies syntactic property criteria but is causally inert and non-natural.  
     - **Non-negotiable?** No. *But*: If included, sparse properties must be distinguished to avoid triviality.  

  10. **Causal Efficacy**  
      - *Missing in your list*.  
      - **Case**: Redness (not grueness) causes ripe fruit to be eaten. Properties must ground causal powers/differences.  
      - **Non-negotiable?** Yes for laws/reference magnetism – sparse properties must "carve nature at its joints".  

  11. **Unity of the Property**  
      - *Missing in your list*.  
      - **Case**: How is Redness *one thing* multiply instantiated? "One over many" can’t be brute.  
      - **Non-negotiable?** Yes – core to realism. Trope theories avoid this but face resemblance issues.  

  12. **Modal Flexibility**  
      - *Missing in your list*.  
      - **Case**: Properties must support modal truths (e.g., "red could exist without round").  
      - **Non-negotiable?** Yes for laws (which involve necessities).  

  ---

  ### **Key Conflicts Between Desiderata**  
  - **Sparsity + Full Boolean Closure + Determinables**: Jointly unsatisfiable.  
    - Why: Boolean closure generates unnatural properties (e.g., "red or quantum-entangled"); determinables (e.g., Red) are sparse but require non-Boolean structure.  
  - **Sparsity + Impure Properties**: Tension. Haecceities (e.g., *being Socrates*) are sparse for some but inflate ontology.  
  - **Unity + Bradley’s Regress**: Realism about universals risks regress; nominalism avoids regress but struggles with unity.  
  - **Causal Efficacy + Cambridge Properties**: If Cambridge properties exist, efficacy requires sparse/abundant divide.  

  ---

  ### **Brief Theory Scores**  
  *(✓ = Satisfies, ✗ = Fails, ~ = Partial/Controversial)*  

  | Theory               | Key Strengths                     | Fails Most Notably On          |  
  |----------------------|-----------------------------------|--------------------------------|  
  | **Armstrong Universals** | ✓ Determinables, ✓ Relations, ✓ Causal efficacy | ✗ Boolean closure (rejects negations), ~ Impure properties (excluded) |  
  | **Platonic Universals** | ✓ Empty predicates, ✓ Boolean (if abundant), ✓ Unity | ✗ Causal efficacy (transcendent), ✗ Bradley regress |  
  | **Trope Theory**     | ✓ Impure properties, ✗ Bradley regress, ~ Modality | ✗ Second-order properties, ✗ Unity (needs primitive resemblance) |  
  | **Class Nominalism** | ✓ Boolean closure, ✓ Empty predicates | ✗ Sparse/abundant (all classes equal), ✗ Determinables, ✗ Causal efficacy |  
  | **Resemblance Nom.** | ✓ Avoids universals/regress       | ✗ Relations, ✗ Determinables (resemblance primitive) |  
  | **Structural Univ.** | ✓ Determinables (as structures)   | ✗ Bradley regress (for complex structures), ~ Impure properties |  

  ---

  ### **Your Purpose: Humean Laws + Reference Magnetism**  
  - **Humean Best-System Laws**: Requires *sparse properties* to ground natural variables in the "best system". Rejects modal efficacy (✓ Armstrong, ✗ Platonic).  
  - **Reference Magnetism**: Requires *causal efficacy/sparsity* to make properties "magnetic". Needs abundant *or* sparse-but-rich property base (✓ tropes with abundant derivatives).  
  - **Tension**:  
    - Humeanism leans **sparse** but *anti-modal*; reference magnetism needs **sparse+natural** properties *with modal depth*.  
    - **Resolution**: Armstrong-style universals best fit both *if* you accept non-Boolean sparse properties. Tropes work if resemblance grounds magnetism.  

  **Recommendation**: Armstrong + Lewis-style naturalness (sparse base, abundant superstructure) balances best. Reject full Boolean closure for sparse tier.  

  Let me know if you need expansions on cases, conflicts, or theory specifics!
