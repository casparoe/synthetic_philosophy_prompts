prompt: |-
  ok so i'm in a philosophy of science seminar right now and the prof has this running bit where she puts a sentence up and we all have to call it: law, or not a law? and i've been keeping a list of where she lands. here's what i've got so far:

  - all gold spheres are less than a mile across — not a law
  - all uranium-235 spheres are less than a mile across — law
  - nothing goes faster than light — law
  - every electron has charge exactly -e — law
  - all the coins in my pocket are silver — not a law
  - the planets orbit the sun in ellipses — law
  - Bode's law, the thing about the spacing of the planets — not a law
  - all swans are white — not a law

  i feel like i can sense the shape of what she's doing, something about accident vs. the real thing, but i honestly can't tell which rule she's actually running, because at least a few fit every single item above. the Humean best-system line, where a law is just whatever earns its place as an axiom or theorem of the simplest and strongest true theory we can write down. the anti-Humean line where a law has to involve some genuine necessitation between properties, or fall out of the natures of the properties, rather than just being a true generalization with no exceptions. and maybe the counterfactual one, where a generalization is a law only if it would still have held under the relevant counterfactual perturbations. as far as i can tell all three of those predict her whole list and don't get anything wrong.

  next week the case she says she's putting up is this: the charge on the proton is exactly equal and opposite to the charge on the electron — not roughly, exactly, to every decimal place we can measure, which is the reason atoms come out neutral. law or not a law?

  so, what do you think she's gonna say, and why? which of the rules she might be running does that case actually seperate, and do any of them give different verdicts on it? give me your best guess with the reasons for it, and then tell me the one other case i should put up that would really force her to show her hand — a case where those rules come apart and don't all give the same answer. i'm not trying to catch her out, i just want to know what she actually believes.
