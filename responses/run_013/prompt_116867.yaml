answer: |-
  **MEMORANDUM**  
  To: Forecast-Evaluation Working Group  
  From: Chair, Forecast-Evaluation Working Group  
  Date: [Date]  
  Subject: Evaluation of Proposed Changes to Forecast Scoring and Pooling  

  ---

  ### 1. RECOMMENDATION (120 words)  
  We reject Proposal 1 (logarithmic scoring) due to its extreme sensitivity to rare events, which could distort rankings and incentivize excessive caution. We adopt Proposal 2 (skill scores against our 5-year baseline) to prioritize improvement over raw accuracy, aligning with the authority’s need for added value. For Proposal 3 (log-odds pooling), we pilot it internally for three months to assess operational impact before full implementation; its theoretical benefits (commutativity) are compelling, but its interpretability for external stakeholders requires validation. The arithmetic mean of probabilities remains our published house number pending the pilot.  

  ---

  ### 2. BACKGROUND (200 words)  
  Our current system scores forecasters using the Brier score (penalizing divergence between probabilities and outcomes) and computes the pooled "house number" as the arithmetic mean of individual probabilities. Two recent episodes highlight operational tensions:  
  - A forecaster assigned 2% to an event that occurred, incurring minimal penalty under Brier. The authority criticized this as rewarding unhelpful underconfidence.  
  - A forecaster assigned 45% to a non-event, suffering a severe rank drop despite moderate confidence.  
  The authority’s feedback emphasizes that our metric should discourage fence-sitting while ensuring penalties reflect the planning risks of over/underconfidence. Neither episode alone dictates a solution, but both confirm that our scoring choices materially affect forecaster behavior and downstream decisions.  

  ---

  ### 3. THE CASE FOR THE PROPOSALS (350 words)  
  **Proposal 1 (Logarithmic Score):** The unbounded penalty for extreme misses (e.g., assigning 0.02 to an event that occurs) strongly disincentivizes underconfidence and rewards well-calibrated boldness. It is strictly proper, ensuring forecasters maximize expected score only by reporting true beliefs. This addresses the authority’s concern that confident near-misses are inadequately penalized.  

  **Proposal 2 (Skill Score vs. Internal Baseline):** By benchmarking against our own past performance (not climatology), we measure *improvement*—the value added by current forecasters. This directly responds to the authority’s implicit request: they seek progress, not static accuracy. A skill score also contextualizes performance; a "worse" absolute score may still reflect skill if baselines are challenging.  

  **Proposal 3 (Log-Odds Pooling):** Averaging log-odds ensures commutativity between individual updating and group pooling. This coherence is theoretically sound: pooled forecasts remain consistent under Bayesian revision, avoiding distortions from sequential updating. It also disproportionately weights cautious probabilities (e.g., pooling 1% and 99% yields ~10%, not 50%), which may better reflect collective uncertainty.  

  Collectively, these proposals prioritize decisiveness (Proposal 1), incremental value (Proposal 2), and internal consistency (Proposal 3).  

  ---

  ### 4. THE CASE AGAINST (350 words)  
  **Proposal 1 (Logarithmic Score):** Its unbounded penalties could destabilize rankings—a single rare event could permanently disadvantage a forecaster, incentivizing risk-aversion (e.g., avoiding <5% or >95% probabilities). For hazard planning, extreme penalties may not align with the authority’s need for stable, interpretable metrics. It also amplifies noise in low-probability events.  

  **Proposal 2 (Skill Score):** Basing the baseline on our past performance assumes historical forecasts were meaningful. If past methods were flawed (e.g., systematically biased), skill scores could reward regression toward mediocrity. It also obscures absolute performance: a "skilled" forecaster could still be unacceptably inaccurate in high-stakes scenarios. Crucially, **any baseline encodes a prior belief**—here, that our past forecasts define "expected" performance, which may not match the authority’s needs.  

  **Proposal 3 (Log-Odds Pooling):** While mathematically elegant, log-odds averages are non-linear and less intuitive. The house number (e.g., 10% instead of 50%) could mislead authorities expecting linear probability. It also overweights extreme opinions, potentially amplifying outlier bias.  

  **Common Objection:** All three proposals assume scoring rules can isolate "good" forecasting without addressing whether forecasters’ *priors* are justified—a proper score only ensures honesty, not wisdom.  

  ---

  ### 5. WHAT THE METRIC CAN AND CANNOT DISCIPLINE (400 words)  
  **On "Accuracy-First Epistemology":** The critique that we ignore informativeness, explanation, or decision-relevance is valid but misdirected. Our mandate from the authority is explicit: provide *actionable probabilities* for specific hazards. While richer communication (e.g., rationale for probabilities) has value, it is separable from scoring. A metric must optimize a single target to be effective; accuracy (calibration + resolution) is that target unless the authority specifies otherwise. Crucially, **proper scoring rules do not suppress these goods**: a forecaster can be informative *and* accurate. Rejecting accuracy-first here would render evaluation arbitrary.  

  **On Strict Propriety and Priors:** Strictly proper rules ensure forecasters report true beliefs, but they cannot judge whether those beliefs rest on sound priors or models. A forecaster with flawed priors (e.g., underestimating flood risks) will *optimally* earn a good score under her own worldview. **The metric disciplines honesty, not correctness**. This is unavoidable: no score can objectively audit priors without circularity.  

  **Implications:**  
  - For Proposals 1–2: Both are strictly proper, so they ensure honesty but cannot fix misguided beliefs. The skill score (Proposal 2) mitigates this by focusing on *progress*, indirectly addressing prior flaws via improvement.  
  - For the Authority: They are buying (1) honest probabilities, (2) relative improvement, and (3) coherence. They are *not* buying guaranteed correctness, insight into forecaster reasoning, or immunity to prior biases. We must plainly state that scores evaluate reporting fidelity, not model quality.  

  ---

  ### 6. IMPLEMENTATION (150 words)  
  **Effective next quarter:**  
  1. Replace Brier with a skill score using our 5-year forecasts as the baseline.  
  2. Pilot log-odds pooling internally; retain arithmetic mean for published house numbers until the pilot concludes.  
  3. Reject logarithmic scoring due to operational instability.  

  **Communicate to the Authority:**  
  - We now measure *improvement* against our historical accuracy, ensuring they pay for added value.  
  - Penalties for underconfidence will increase, but remain bounded for stability.  
  - We are testing refinements to pooling for coherence.  

  **Commitments:**  
  - Review log-odds pilot results and authority feedback by [Date: 9 months from now].  
  - Revisit baseline validity annually to avoid obsolescence.  
  - Publish a plain-language note on what scores can/cannot guarantee (per Section 5).  

  ---  
  *Approved by the Chair for circulation at the Quarterly Meeting of [Date].*
