  First, I need to confirm if their suspicion holds. The user points out both camps agree on intermediate facts but disagree on implications. That suggests the conflict isn't about data but how to process it. They reference their experience where they didn't just multiply probability by impact but used risk-weighting. That's key. They're drawing a parallel between their field's methods and the current AI risk debate.

  Looking at the two camps: the "AI risk is paramount" group seems to use a standard expected utility calculation, where even a tiny probability multiplied by a massive loss (human extinction) demands action. The skeptics argue the probabilities are too vague to act upon. The user mentions risk-weighted expected utility (REU) as a formal model that weights outcomes based on their position in the probability distribution, not just linear multiplication. This could explain the divide. 

  The user asks for a diagnosis: is this a verbal, factual, values, or decision-theoretic dispute? They also want to know where the stalemate is and what progress would look like. 

  My bottom line: the core disagreement is primarily about decision rules under deep uncertainty, secondarily about values (especially regarding future generations). 

  Reasoning: both sides accept similar facts but diverge on how to handle uncertain probabilities. The prioritizers implicitly use expected utility theory (EUT), which treats all risks as commensurable via probability-impact products. Skeptics reject applying any quantitative decision rule here, seeing probabilities as too ill-defined. This maps to a long-standing EUT vs. REU (or other non-EUT frameworks) debate. 

  Values also play a role—how much we weight future lives versus present ones—but that's secondary because even with agreed values, the decision rule clash remains. 

  Stalemate persists because: 1) We can't empirically resolve "unknowable" probabilities, 2) Decision theory axioms (like EUT's independence axiom) are bedrock preferences, not provable, 3) REU introduces its own subjectivity (risk-aversion parameter) that feels arbitrary to opponents. 

  Progress might come from: a) Formal work showing specific AI risk properties demand non-EUT frameworks, b) Clarifying which decision-theoretic axioms each side rejects, c) Finding policy compromises that respect both views (e.g., "inverse precautionary principle" where burden shifts to risk-takers). However, full resolution is unlikely as it touches foundational rationality disputes.
answer: |-
  **The core disagreement is primarily about decision rules under deep uncertainty, secondarily about values regarding future generations.**  

  **Reasoning:**  
  1. **Shared facts, divergent processing:** Both camps largely accept the *possibility* of catastrophic AI outcomes and acknowledge uncertainties in alignment. Where they split is in *what to do with low-probability/high-impact estimates*. Proponents of AI risk prioritization apply **standard expected utility theory (EUT)**, treating any non-zero probability as demanding action proportional to its discounted impact. Skeptics reject EUT’s applicability here, arguing that probabilities are too poorly grounded (epistemically “empty”) to plug into *any* utility calculation.  

  2. **The decision-rule fault line:**  
     - **Prioritizers** implicitly assume EUT is rational bedrock: \( \text{Action} \propto P(\text{doom}) \times \text{Utility}(-\infty) \). A 0.1% chance of extinction outweighs all finite gains.  
     - **Skeptics** see this as *misapplied formalism*. Unfalsifiable probabilities (e.g., “1% via analogy”) aren’t actionable inputs—they’re noise. To them, using EUT here is like multiplying infinity by zero; it demands infinite precaution against speculative threats, paralyzing other efforts. They often default to **minimax-like rules** (focus on credible threats) or **robust decision-making** (ignore intractable uncertainties).  

  3. **Risk-weighting illuminates the clash:** Your suspicion is correct. Risk-weighted expected utility (REU) or other non-linear models (e.g., rank-dependent utility) formalize the skeptic’s intuition. REU weights outcomes not just by probability but by their *severity ranking*, making extreme losses dominate even at low probabilities. But AI prioritizers already over-index on tail risks—their objection isn’t to risk-weighting *per se*, but to *allowing vague probabilities into the model*. Skeptics counter that REU still requires probabilities as inputs, which they reject as illusory.  

  4. **The secondary values dispute:** Prioritizers weight future generations near-infinitely; skeptics see this as untenable (e.g., demanding Pascal’s Mugging). This isn’t the core, though—even with agreed future valuation, the decision-rule clash remains.  

  **The stalemate lives in the irreconcilability of two axioms:**  
  - **Axiom P (Prioritizers):** *Any* non-negligible probability of existential loss, however uncertain, must dominate decision-making.  
  - **Axiom S (Skeptics):** Unfalsifiable probabilities cannot drive policy; only "actionable" risks warrant resources.  

  **Progress requires:**  
  - **Formalizing the burden of proof:** Define what evidence would make \( P(\text{doom}) \) “actionable” (e.g., falsifiable lower bounds, process models).  
  - **Decision-rule diplomacy:** Adopt frameworks like **ambiguity aversion** (distinguishing "risk" from "uncertainty") or **pluralistic scoring** (applying multiple decision rules to the same data).  
  - **Pragmatic detente:** Shift debate to *proxies* for tail risk (e.g., whether current AI capabilities increase *known* alignment failures).  

  **Bottom line:** This is a meta-debate about rational choice under ignorance. It won’t resolve until one side accepts the other’s decision axioms—or both concede that bedrock axioms aren’t negotiable, making compromise procedural, not epistemic.
