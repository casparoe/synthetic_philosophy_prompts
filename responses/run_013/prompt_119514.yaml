prompt: |-
  Give me your credence that the question of which of Sweden and Norway is more liberal has a determinate answer, and, conditional on its having one, that the answer is Sweden. Decompose the number into the sub-questions it depends on: how much turns on whether the concept liberal is best treated as a single dimension or as a family of dimensions (economic policy, social attitudes, immigration, civil liberties, constitutional structure); whether the comparison should be of policy, public opinion, or outcomes; whether the relevant units are national aggregates or subnational populations; whether the same measures are invariant across the two countries; whether the dimensions are commensurable enough to be aggregated; and whether the time period is held fixed. Give a rough probability for each term, say how they combine, and identify which term your final number is most sensitive to. Then say what would settle the question in principle—what kind of evidence or conceptual decision would make a single ranking well-defined—and what evidence or argument would most change your mind or reveal where your reasoning is most likely to fail.
