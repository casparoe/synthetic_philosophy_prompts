  ## The Kitchen Table Debate

  **Characters:**  
  **JONAS:** Mid-20s, Finnish, MA Political Theory. Intense, earnest, gestures with his coffee mug.  
  **ALEX:** Mid-20s, Nationality ambiguous (implied not Finnish/Swiss/Swedish), Background in History/Political Science. Sceptical, pragmatic, leaning back in his chair.  

  **(Scene: A slightly messy kitchen, late at night. Empty plates, coffee mugs. The remnants of dinner.)**

  **ALEX:** (Stirring cold coffee) Okay, Jon, bottom line: you’re telling me the only way a country *really* owns its own defence is by forcing its teenagers to play soldier for a year? That’s democracy in action? Feels more like state-mandated cosplay with live ammo.

  **JONAS:** (Leaning forward, tapping the table) Not *forcing*, Alex. *Obligating*. Big difference. And not just teenagers – everyone. That’s the point! Defence isn’t some abstract service you *buy*, like rubbish collection. It’s the literal foundation of the state. If you outsource it, you make your citizens… tenants. Dependent on a class of people hired to do the dying *for* them. What kind of ownership is that? It severs the link!

  **ALEX:** Ownership? Fine. But obligation enforced by criminal sanction? That’s coercion, pure and simple. If defence is *so* vital, why not just pay professionals properly? Attract the best, train them properly, build a force that’s actually competent, not just numerically large because you’ve got a captive pool of cheap labour. Half the conscript armies I’ve studied exist mainly because they’re *cheap*, Jon, not because they’re philosophically pure. It’s a budget line disguised as civic virtue.

  **JONAS:** Cheap? Maybe. But effective? Look at Finland. Look at Switzerland. Look at Sweden – who *reinstated* conscription, made it gender-neutral precisely because they saw the hollowing-out of that civic link! It proves the model isn’t stuck in the past! And it’s not just about competence in peacetime manoeuvres. It’s about the *mobilisation base*. It’s about having 900,000 people who’ve held a rifle, understand basic fieldcraft, and know their muster point if the worst happens. You can’t magic that up with contractors overnight. That mass *is* the deterrent. Armed neutrality isn’t a posture; it’s a credible threat backed by a population ready to enact it.

  **ALEX:** (Scoffs) Gender-neutral conscription? Okay, fine, kudos for trying to ditch the ‘it’s just men’s problem’ baggage, I’ll grant Sweden that. Genuinely. But Jon, come *on*. In practice, even in your Nordic utopias, who *really* carries the burden? The kids who can’t afford fancy lawyers, who don’t have the student exemptions lined up perfectly, whose families don’t have the connections for that cushy deferment? “Shared sacrifice” sounds noble until you see who gets the sharp end. It lands on the young men – and now some women too, great – who lack the social capital to wriggle out. It’s structured inequality dressed up as equality.

  **JONAS:** And your volunteer force? Alex, you’re describing the *poverty draft* right back at me! Who joins an all-volunteer army when there are decent jobs and university places? Often those for whom it’s the best or only option – economic conscription! At least our system *tries* for universality in principle. We acknowledge the burden *should* be shared, even if the execution is imperfect. Your system outsources the burden entirely onto the economically vulnerable and calls it ‘choice’. That’s not ownership, that’s exploitation with a recruitment bonus.

  **ALEX:** Choice matters! Even a constrained choice is better than none. And professionalism matters too. You think a bunch of conscripts, draftees counting down the days, are as motivated or effective as a career soldier who *chose* this? That they’ll resist being politicised? History’s full of conscript armies marching obediently into disastrous, politicised wars. Citizen-soldier my arse. Sometimes they’re just cannon fodder with better PR.

  **JONAS:** (Points a finger) Ah, but *will* they march? That’s the key! That’s the political cost angle you’re missing. When it’s *everyone’s* kid potentially on the line – the lawyer’s son, the professor’s daughter – suddenly the threshold for sending troops somewhere stupid gets a lot higher. A small professional force? That’s just a line item in a budget most voters ignore. It makes war *easier*. Politically costless. Out of sight, out of mind. A citizen-army forces the public to reckon with the real cost. It’s a brake.

  **ALEX:** Or a rubber stamp! Mass conscription can be whipped into nationalist fervour just as easily. Look at 1914! Whole populations baying for blood. But okay, point taken – maybe a professional force *is* too easy to deploy. But Jon, what are you *actually* buying with conscription? Bodies? Fine, you get quantity. But quality? Modern warfare needs specialists, techs, drone operators, cyber warriors. You think a year of peeling potatoes and marching builds that? Or is it just buying a big, cheap tripwire force, hoping the *threat* of mobilisation deters? And is that competence you couldn’t get cheaper and better with targeted recruitment and training?

  **JONAS:** It’s buying *depth*. It’s buying resilience. It’s buying the latent knowledge in the population. The tech specialist did their basic training too. They know how to move, shoot, survive. That baseline competence matters when the specialists are overwhelmed or targeted. And the tripwire *is* credible precisely because it’s backed by that mass. It signals resolve far more effectively than a small, elite force ever could to a potential aggressor. It says: invading us means fighting *everyone*. Not just soldiers. Citizens.

  **ALEX:** (Leans back, sighs) Okay, okay. Signal of resolve. I’ll give you that. Maybe it *is* a unique deterrence model for neutrality. But the cost… the sheer intrusion, the lost time, the coercion… Can’t we find a middle ground? What about a universal civic service lottery? One year, military *or* civilian – healthcare, conservation, eldercare. Spreads the burden wider, still fosters civic duty, avoids the ‘just soldiers’ focus. Still shared sacrifice, but less… martial?

  **JONAS:** (Shakes his head slowly) Alex, you hollow out the point. Defence isn’t interchangeable with planting trees. The specific, shared, *lethal* obligation is what forges the civic bond we’re talking about. The understanding that *you* might be the one called to stand on the line changes your relationship to the state, to your neighbours. Making it optional, or substitutable, turns it back into just another public service programme. Nice, maybe useful, but not foundational. The sharp edge is blunted. The ownership dissolves. Armed neutrality built on people who might have chosen the park service isn’t credible.

  **ALEX:** So it has to be the gun? Specifically? That’s the irreducible core? The shared experience of potential violence? That’s… bleak, Jon. And impractical for most modern societies. The world isn’t Finland.

  **JONAS:** For the kind of ownership and credible deterrence *we* believe in? Yes. Maybe it is bleak. But look at the map. Look where it works for its specific purpose. It’s not for everyone. But for us? Yes. The gun, the shared obligation, the knowledge that defence isn’t someone else’s job – that’s the core.

  **(A long pause. The fridge hums.)**

  **ALEX:** What would actually change your mind, Jon? Honestly.

  **JONAS:** (Thinks) Proof. Hard proof. Not anecdotes, but solid empirical research showing that small, professional forces, funded properly, integrated deeply into the civic fabric somehow – not just militarily – provide *better* long-term security for a democratic society *and* greater civic resilience *without* conscription. And that they make the decision for war *harder*, not easier. Show me that citizen ownership isn’t eroded by outsourcing defence. That’s a high bar. You?

  **ALEX:** Show me a conscription system that’s *truly* universal and fair. Not just on paper, but in practice. No hidden deferments, no class bias, no gender loopholes de facto favouring one group. Where the burden *is* genuinely shared across all strata, equally. And show me hard evidence that this mass conscript force is demonstrably more effective at deterrence and defence in the modern age than a smaller, highly professional force would be, pound for pound, *including* the societal cost of the lost year. Not just tradition or signalling, but actual battlefield or deterrent outcomes. Prove the coercion buys something essential you *can't* get voluntarily. Then… maybe. But I’m not holding my breath. Sweden’s gender-neutral thing is a start, I’ll give you that. A genuine improvement.

  **JONAS:** (Nods slowly) That… we agree on. Sweden got that right. It’s necessary. Not sufficient, but necessary. Removes one huge objection.

  **ALEX:** Yeah. It does. Small mercies. Still doesn’t make it *right*, but… less wrong.

  **JONAS:** Less wrong for you. Necessary for us. (He glances at the clock) Shit. Ella’s gonna kill us. Again.

  **ALEX:** (Starts gathering mugs) Probably. We’re just going in circles now anyway. Back to the weeds tomorrow?

  **JONAS:** (Stands, stretches) Sure. Someone’s got to defend the republic. Properly.

  **ALEX:** (Dryly) Or just pay someone else to do it. Properly. Night, Jon.

  **JONAS:** Night, Alex. Dream of citizen-soldiers.

  **(They head towards their rooms, the fundamental disagreement unresolved, the clock ticking past the point where reasonable people sleep, the kitchen table littered with the debris of a debate where both sides landed hits, conceded points, and found only one small patch of common ground in the vast, thorny field of how a society should prepare, if it must, to defend itself.)**
