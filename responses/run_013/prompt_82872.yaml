prompt: |-
  I am a junior in high school, and for a civics project last semester I looked into what actually happened after my state downgraded simple possession of small amounts of drugs from a misdemeanor to a civil violation. The reform was advertised as a way to stop funneling people into the criminal system, and on paper it did exactly that: possession is no longer an arrestable offense, so arrests for it fell by something like eighty percent in the first year, which my father pointed out was guaranteed by the law itself. Two other changes are the ones I cannot fit together. First, the total number of people who now end up with an official file opened on them — a ticket, a mandatory appointment with a health counselor, a follow-up they have to prove they attended, and eventually a larger fine if they ignore the whole thing — rose sharply, and now runs several times the old arrest count. Second, the people in that file are a different population: more teenagers, more people who were stopped for something unrelated and had a ticket added on, and more people who under the old system would most likely have had the charge dropped at their first court date. My civics teacher says this proves the reform failed. The organizer who spoke to our class says it proves the reform is working, since the file is a health file and reaching more people was the entire point. My sister, who is a sociology major, says it is neither, that it is a well-documented trap that reforms of this kind tend to fall into, and that there is a name for it, but she could not remember it, which has been bothering me for weeks.

  The same thing appears to have happened at my school, which is why I doubt the pattern has anything specifically to do with drugs. Two years ago we replaced out-of-school suspension with a required sit-down conference between the student and whoever was harmed, followed by a written agreement and a check-in meeting. A student who once would have spent three days at home now goes through a longer and more thoroughly recorded process, and in a given year far more students pass through it than were ever suspended, including students a teacher would previously have handled with a warning in the hallway. Nobody decided to widen anything; each individual decision was reasonable on its own.

  So my question is not whether the reform worked. Is there an established name for this specific pattern — an institution that was meant to pull people out of the heavy machinery of punishment and instead pulls a larger number of people into a lighter version of it? I do not want only the label; I want to know what the phenomenon actually is, how it is distinguished from three things that are easy to confuse it with (the problem simply relocating to another neighborhood or another category, a reform that straightforwardly fails, and a count that rises only because someone redefined what is being counted), and where its boundaries lie — for instance, whether it still counts when the newly caught people are genuinely better off, or when the lighter process is entirely voluntary. If nothing established fits, coin a term, define it, and tell me what it does and does not cover. Please answer as exactly five numbered points, each one or two sentences, with no introduction and no concluding summary.
reasoning: |-
  Okay, the user is a high school junior who's clearly very observant and analytical. They've noticed a pattern in two different contexts—drug decriminalization in their state and school discipline reform—where a well-intentioned policy change ended up net-widening rather than reducing system involvement. 

  What's impressive is how precisely they've articulated the paradox: the reform technically succeeded by its own metrics (reduced arrests/suspensions) but functionally created a new, larger pipeline into a "lighter" system. They're explicitly rejecting surface-level debates about whether the reform "worked" and digging deeper into the structural phenomenon itself.

  Their query shows three sophisticated layers: 
  First, they want the name of this trap (their sociology major sister mentioned it exists). 
  Second, they want to distinguish it from lookalike phenomena (relocation, failure, redefinition). 
  Third, they're probing boundary cases—like whether voluntary programs or genuinely beneficial outcomes invalidate the pattern.

  The drug case is particularly nuanced: arrests dropped 80% (technical success), but civil violations now affect more people, including those who previously wouldn't have been charged. The school parallel confirms this isn't domain-specific. Both systems replaced blunt punishments with bureaucratic processes that demand more documentation and time—while catching more people in the net.

  I recall this is "net-widening," a concept from criminology/sociology. Need to clarify:
  - It's distinct from displacement (geographic/categorical shift) because it's the same system expanding its reach.
  - Unlike reform failure, the harsh penalty *is* reduced, but a new tier emerges.
  - It's not definitional inflation because the count increase reflects real behavioral changes (officers issuing tickets for minor stops, teachers opting for conferences over warnings).

  Boundary notes:
  - Even if the new process is beneficial (e.g., health counseling), it still counts as net-widening if coercion exists (mandatory appointments).
  - Voluntary programs avoid it because participation isn't system-mandated.
  - The trap lies in obscured systemic expansion, not subjective outcomes.

  User's frustration with the "health file" justification is telling. The organizer claims reaching more people is the point, but the user senses coercion masquerading as care—hence their demand to separate the phenomenon from value judgments about the reform's intent.
answer: |-
  1.  **Net-Widening:** This is the established sociological and criminological term for when reforms intended to divert people from harsh punishment instead pull a *larger* number into a new, less severe but still coercive system layer (like civil violations or mandatory conferences).
  2.  **Distinguishing from Relocation/Redefinition:** It differs from problem relocation (shifting harm geographically/categorically) because the *same* behavior is now processed more frequently within the *same* institutional sphere. It differs from mere redefinition because the count rises due to increased application (e.g., adding tickets to stops, requiring conferences for warnings), not just changing labels.
  3.  **Distinguishing from Reform Failure:** It differs from straightforward failure because the original harsh consequence (arrest, suspension) *is* significantly reduced; the problem is the unexpected expansion of a *different*, supposedly lighter, system entry point.
  4.  **Boundary - Genuinely Better Off:** The phenomenon *still applies* even if the newly caught people are genuinely better off (e.g., health counseling instead of jail); net-widening describes the *structural expansion* of system contact, irrespective of the relative benefit of the new process compared to the old harsh one.
  5.  **Boundary - Voluntary Processes:** It *does not apply* if the lighter process is entirely voluntary and non-coercive; net-widening requires that the new system layer imposes mandates, surveillance, or penalties (like mandatory appointments, fines, or documented agreements under threat of escalation).
