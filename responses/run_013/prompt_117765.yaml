answer: |-
  ## Joint Statement on Moral Decision-Making Under Deep Uncertainty

  We, the undersigned representatives of the two previously opposed camps regarding normative choice under moral uncertainty, agree to this adversarial collaboration. We commit to jointly investigating the identified cruxes, adhering to the pre-registered tests and predictions below. This document represents our current areas of agreement and precise points of contention.

  ### 1. Agreed Claims
  1.  **The Core Disagreement:** Our dispute centrally concerns whether, and how, the *quantitative verdicts* (choiceworthiness assignments) of distinct moral theories can be meaningfully compared and aggregated across theories when an agent has credence in multiple theories but no single theory is known to be certainly correct. Specifically, it hinges on the legitimacy of *normalization procedures* (e.g., range or variance-based rescaling) to render verdicts commensurable for the purpose of maximizing expected choiceworthiness.
  2.  **Uncontroversial Cases:** Both camps agree on the following recommendations:
      *   When all theories one takes seriously agree on the ranking of available options, choose the top-ranked option.
      *   When theories disagree but one option is uniquely optimal according to the single theory assigned the highest credence (and that credence is sufficiently high relative to alternatives), choose that option.
      *   When one option is strictly dominated (ranked worse than another by every theory taken seriously), avoid it.
      *   In the symmetric 50/50 case with options A (Theory1:10, Theory2:0) and B (Theory1:0, Theory2:10), both camps agree A and B are on a par; neither is rationally required over the other. (Camp 1 notes normalization yields equality; Camp 2 notes no aggregation is needed to yield parity).
  3.  **Concessions:**
      *   **Camp 1 (Maximize Expected Choiceworthiness - MEC) Concedes:** Any specific normalization procedure (e.g., range-variance, variance-variance) is inherently *stipulative* in the sense that there is no uniquely privileged, non-arbitrary "fact of the matter" about how to map units between fundamentally distinct moral theories. Different normalization methods *can* yield different overall rankings for the same option set. The problem of theory individuation (Crux c) poses a significant challenge.
      *   **Camp 2 (Non-Aggregative - NA) Concedes:** Normalization procedures successfully mitigate *some* counterintuitive implications of unnormalized MEC, particularly "fanaticism" (Crux d). Under certain conditions, normalized MEC can yield intuitively plausible results where NA rules might struggle to provide decisive guidance (e.g., symmetric cases beyond 50/50 with more options). The practical appeal of providing a complete ordering is significant.
  4.  **Conditions of Practical Irrelevance:** The disagreement leads to no practical difference in recommended action when:
      *   One option is uniquely optimal under both camps' preferred decision rules.
      *   The theories an agent takes seriously all share sufficiently similar *ordinal* rankings of the available options.
      *   The credence distribution is sufficiently skewed towards one theory that it dominates under both MEC (even normalized) and the "most probable theory" variant of NA.
      *   The "no serious condemnation" variant of NA yields a single permissible option.
  5.  **What Constitutes Progress:** Both camps agree progress would be made by:
      *   Resolving one or more of the identified cruxes (Section 3).
      *   Developing a compelling argument or revealing evidence showing one camp's position leads to unacceptable consequences (e.g., pervasive incomparability, unacceptable fanaticism, menu-dependence instability) that the other camp avoids without generating equally unacceptable consequences of its own.
      *   Developing a robust formal treatment of infinite stakes (Crux e) acceptable to both camps.
      *   Providing a convincing account of theory individuation (Crux c) or demonstrating its irrelevance.

  ### 2. Statement of the Disagreement
  *   **Camp 1 (MEC):** "When facing deep moral uncertainty, the rational agent should maximize expected choiceworthiness by weighting each serious moral theory's normalized choiceworthiness assignments by her credence in that theory and selecting the option with the highest weighted sum; normalization (e.g., rescaling to equal variance) is both necessary and sufficient to render intertheoretic comparisons meaningful for this purpose, preventing any theory from dominating the calculation merely due to the scale of its cardinal representation."
  *   **Camp 2 (NA):** "Because there is no non-arbitrary basis for comparing the quantitative units of distinct moral theories, normalization procedures are merely stipulative transformations lacking normative authority; consequently, maximizing expected choiceworthiness under moral uncertainty is incoherent, and rational agents should instead either act according to the moral theory they judge most probable among those they take seriously or restrict themselves to options not condemned by any such theory."

  ### 3. Cruxes
  The following unresolved sub-questions are central to the disagreement. Resolving any one of them would cause at least one camp to modify or abandon its core position:
  a.  **Meaning of Comparisons:** Are intertheoretic comparisons of *cardinal choiceworthiness units* (beyond mere ordinal dominance) meaningful at all? (Crucial for MEC; if "no", NA wins).
  b.  **Menu-Dependence:** If intertheoretic comparisons *are* meaningful, can any normalization procedure avoid making the ranking of two options depend on the inclusion or exclusion of other (potentially irrelevant or dominated) options in the choice set? (Crucial for both; if "no", undermines MEC's claim to provide stable rankings; if "yes", significantly bolsters MEC).
  c.  **Theory Individuation:** Are "moral theories" the appropriate objects for credence assignment, given that the space of possible moral views can be carved up in multiple, defensibly distinct ways (e.g., splitting one theory into variants, combining theories)? Do the verdicts of normalized MEC (or the applicability of NA rules) change significantly under such re-descriptions? (Crucial for both; instability undermines MEC's coherence and NA's practical applicability).
  d.  **Anti-Fanatical Tendency:** Is the tendency of normalization to prevent very small credences in extremely demanding theories from dominating the calculation (the "anti-fanatical" effect) a *virtue* to be explained (suggesting MEC captures rational aversion to fanaticism) or an *artifact* exposing the arbitrariness of normalization? (Crucial for both; if a virtue, bolsters MEC; if an artifact, bolsters NA).
  e.  **Infinite Stakes:** How should each approach handle moral theories that assign infinite (or unboundedly large) positive or negative choiceworthiness to options? (Crucial for both; failure to handle infinities coherently is a major challenge for each camp).

  ### 4. Tests, Predictions, and Potential Movement

  | Crux | Test Case                                                                                                                               | Camp 1 (MEC) Prediction                                                                                                                                                                 | Camp 2 (NA) Prediction                                                                                                                                                                                                                              | What Moves Whom                                                                                                                                                                                                                             |
  | :--- | :-------------------------------------------------------------------------------------------------------------------------------------- | :--------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- | :--------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------ |
  | **a** | Contemplate two fundamentally distinct moral theories (e.g., a hedonistic utilitarianism and a Kantian deontology).                     | Agents can meaningfully judge (even if imprecisely) whether a given improvement according to Theory A is "more significant" than a given improvement according to Theory B. | Agents find such judgments fundamentally unintelligible; they can only compare ordinal dominance within a theory or judge overall similarity/dissimilarity of the theories themselves. | If robust evidence emerges that competent agents reliably make *cardinal* intertheoretic comparisons they deem meaningful (beyond dominance), NA would need to reconsider. If such judgments are consistently rejected as nonsense, MEC falters. |
  | **b** | *Case:* Options A(10, 0), B(0, 10) under Theories 1 & 2 (50/50 credence). Add C(-90, -990). Use range-variance normalization (range). | **Prediction:** Normalized MEC yields A ≈ B both before *and* after adding C. Adding C does NOT change the A vs. B comparison. (Camps disagree on the math: MEC holds rescaling factors (e.g., T1 range=100, T2 range=1000) make normalized T1 values 10x T2 values, so A: (10/100 * 0.5) + (0/1000 * 0.5) = 0.05; B: (0/100 * 0.5) + (10/1000 * 0.5) = 0.005; A>>B. After adding C, T1 range=100 (10 - (-90)), T2 range=1000 (10 - (-990)). Normalized values: A(T1:10/100=0.1, T2:0/1000=0), B(T1:0/100=0, T2:10/1000=0.01), C(T1:-90/100=-0.9, T2:-990/1000=-0.99). Expected Choiceworthiness: A: (0.1*0.5)+(0*0.5)=0.05; B: (0*0.5)+(0.01*0.5)=0.005; C: (-0.9*0.5)+(-0.99*0.5)=-0.945. A>>B still holds. **Conclusion:** A vs. B is stable. | **Prediction:** Normalized MEC yields A ≈ B before C but A >> B after adding C. Adding C *does* change the A vs. B comparison. (Camps disagree on the math: NA holds rescaling using the *entire menu* means adding C drastically changes the scales. Before C: T1 range=10 (10-0), T2 range=10 (10-0). Normalized A: (10/10 * 0.5) + (0/10 * 0.5) = 0.5 + 0 = 0.5; B: (0/10 * 0.5) + (10/10 * 0.5) = 0 + 0.5 = 0.5; A=B. After C: T1 range=100 (10 - (-90)), T2 range=1000 (10 - (-990)). As per MEC math above, A=0.05, B=0.005; A>>B. **Conclusion:** A vs. B is unstable (menu-dependent). | If calculation shows A vs. B ranking changes after adding dominated C (as NA predicts), this strongly undermines MEC (menu-dependence exposed). If calculation shows stability (as MEC predicts), this counters a key NA objection. (Note: Both agree on the *math* of how normalization works; they disagree on whether the pre-C normalization using only A&B is valid or itself an arbitrary stipulation). |
  | **c** | *Case:* Start with Theory X: Options A(10), B(0). Credence=0.6. Theory Y: A(0), B(10). Credence=0.4. MEC (range norm) yields B slightly better? (T-X range=10, T-Y range=10. EC-A: (10/10*0.6)+(0/10*0.4)=0.6; EC-B: (0/10*0.6)+(10/10*0.4)=0.4; A>B). Now, split Theory Y into two variants: Y1 (A:0, B:10) cred=0.2, Y2 (A:0, B:10) cred=0.2. Moral content unchanged. | **Prediction:** MEC verdict changes dramatically. Now ranges: T-X=10, Y1=10, Y2=10. EC-A: (10/10*0.6) + (0/10*0.2) + (0/10*0.2) = 0.6 + 0 + 0 = 0.6; EC-B: (0/10*0.6) + (10/10*0.2) + (10/10*0.2) = 0 + 0.2 + 0.2 = 0.4; A>B *still holds*. Verdict is stable under this split. | **Prediction:** MEC verdict changes dramatically. As above, EC-A=0.6, EC-B=0.4 (A>B) before split. After split: EC-A: (10/10*0.6) + (0/10*0.2) + (0/10*0.2) = 0.6; EC-B: (0/10*0.6) + (10/10*0.2) + (10/10*0.2) = 0.4; A>B *still holds*. **However, NA insists this stability is coincidental.** NA predicts instability if the split theories have different ranges or if the re-description flattens/spreads values. *Modified Test:* Redescribe Theory X as two variants: X1 (A:20, B:-10) cred=0.3, X2 (A:0, B:10) cred=0.3. Original X EC-A=0.6, EC-B=0.4 (A>B). After: Ranges: X1=30 (20 - (-10)), X2=10 (10-0), Y=10 (10-0). EC-A: (20/30*0.3) + (0/10*0.3) + (0/10*0.4) ≈ (0.667*0.3) + 0 + 0 ≈ 0.2; EC-B: (-10/30*0.3) + (10/10*0.3) + (10/10*0.4) ≈ (-0.333*0.3) + 0.3 + 0.4 ≈ -0.1 + 0.3 + 0.4 = 0.6. Result: A≈0.2, B≈0.6; B>>A. **Conclusion:** Verdict reverses (unstable). | If re-descriptions that preserve underlying moral content *consistently* change MEC rankings (as in the NA modified test prediction), this fundamentally undermines MEC. If MEC rankings remain stable under all intuitively content-preserving re-descriptions, this counters a key NA objection. For NA, instability in defining "theories taken seriously" under re-description challenges its rules. |
  | **d** | *Case:* Option M: Moderate theory (99.9% cred) assigns +1. Option R: Radical theory (0.1% cred) assigns +10^30. Option S: Safe, both assign 0. Unnormalized MEC: R wins massively (EC_R ≈ 10^27). | **Prediction:** Normalized MEC (e.g., range-variance) will *not* favor R. (Assume range norm: Moderate range ≈1 (1-0), Radical range ≈10^30. EC_M: (1/1 * 0.999) + (0/10^30 * 0.001) ≈ 0.999; EC_R: (0/1 * 0.999) + (10^30 / 10^30 * 0.001) = 0 + 0.001 = 0.001; EC_S: 0. M > S ≈ R). This is a *virtue* – avoiding fanaticism. | **Prediction:** Normalized MEC *will* avoid favoring R in this case. However, this result is an *artifact* of the arbitrary normalization. The radical theory genuinely claims R is astronomically better; suppressing this based on the scale of its numbers is unmotivated stipulation. NA ("most probable") chooses M. | If MEC defenders cannot provide a non-arbitrary justification for normalization *other than* avoiding fanaticism (exposed as circular), this bolsters NA. If NA cannot explain the strong intuitive aversion to acting on R in this case without appealing to something like implicit normalization or a distinct rule, this weakens NA. *Addendum (100 theories):* MEC predicts normalization still prevents any one fanatical theory or small group from swamping. NA predicts "most probable" still chooses moderate theory; "no condemnation" might permit R if not condemned by moderate theory. |
  | **e** | *Case:* Theory A (50% cred): Option X yields finite good (say 100 units), Option Y yields infinite good. Theory B (50% cred): Only finite stakes, X=90, Y=0. | **MEC Prediction (Standard):** EC_Y = (∞ * 0.5) + (0 * 0.5) = ∞; EC_X = (100 * 0.5) + (90 * 0.5) = 95. Y infinitely better. Problem: Cannot compare infinities if multiple options promise infinite good under some theories. **MEC Prediction (Proposal - e.g., Bucket Approach):** Treat infinite positive value as a separate "bucket"; only compare options within the highest achievable bucket. Y is in the "infinite good possible" bucket (via A), X is not. Choose Y. | **NA ("Most Probable") Prediction:** Act on Theory A (50% cred) or Theory B (50% cred)? If indecisive, may need another rule. **NA ("No Condemnation") Prediction:** Theory A condemns X? (Y is infinitely better). Theory B condemns Y? (Worse than X). If both condemn an option the other prefers, may yield no permissible options or indecision. | Failure of either camp to provide a *mutually recognized* coherent and intuitively plausible treatment of infinities weakens that camp. Developing a compelling, non-ad-hoc approach that handles complex infinite stakes cases would significantly strengthen a camp's position. |

  ### 5. Closing Diagnosis: Verbal vs. Substantive Disagreements

  *   **Verbal/Definitional Elements:**
      *   The precise scope of "moral theory" is contested (monistic vs. pluralistic, fundamental vs. applied, complete vs. partial). This impacts Crux c.
      *   The nature of the anti-normalization claim (Crux a) needs clarification: Is it metaphysical (no facts exist)? Semantic (no meaningful statements can be made)? Epistemological (we cannot know)? Camp 2's core claim is primarily metaphysical/semantic.
      *   The "should" in the disagreement is agreed to be the "should" of *rational choice under uncertainty*, distinct from moral "ought" simpliciter. Both camps agree on this framing.
  *   **Substantive Elements:**
      *   The core question of the *meaningfulness and possibility of non-arbitrary intertheoretic cardinal comparisons* (Crux a) is profoundly substantive.
      *   The *menu-dependence* of normalized MEC rankings (Crux b) is a substantive technical feature with normative implications.
      *   The *sensitivity to theory individuation* (Crux c) is a substantive challenge to the stability and coherence of both approaches, but especially MEC.
      *   The *evaluation of the anti-fanatical effect* (Crux d) – whether it reveals a virtue of MEC or an artifact of stipulation – is a substantive disagreement about what counts as a rational response to deep uncertainty involving extreme stakes.
      *   The *handling of infinite stakes* (Crux e) is a substantive technical and conceptual challenge for both frameworks.

  **Signed,**
  [Signatory for Camp 1: Maximize Expected Choiceworthiness]
  [Signatory for Camp 2: Non-Aggregative Approaches]
