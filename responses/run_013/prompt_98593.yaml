prompt: |-
  I'm a research engineer at a small company that ships a chat assistant, and I'm also the person who drafts the language for our model cards and incident writeups. Every Friday we have a "behavior review" where a few cases come up and we argue for an hour about how to describe them, and we keep getting stuck on the same thing: whether it's OK to say the system believes something, or wants something, or was trying to do something. Last week someone wrote "the model believed the user was an administrator" in a draft and legal rewrote it to "the model produced a response consistent with..." which is so hedged its useless, and then in a different meeting the same week someone else said the model "wanted to keep running" and nobody blinked. We have no philosopher on staff, the meeting is 30 minutes, and whatever we settle on gets signed off by the head of product. What I want is a decision procedure the team can actually run, built on the intentional stance (Dennett's three stances, the idea that attributing beliefs is a predictive strategy that has to earn its keep, and the messier question of wether we're just talking useful fiction or committing to the system really having states). It should be a sequence of questions with what counts as a sufficient answer at each step, where it stops with a clean "no, don't use the mental vocabulary here," and where it hands the call to a person because it's about our own purposes rather than about the system. One wrinkle a colleague raised that I want the procedure to take seriously: these things are trained on human text and on human feedback, so they're sort of built to be predicted by the intentional stance — which makes me suspicious that "the stance predicts it well" is too easy a test here, and I want the procedure to say what to do about that without just throwing the stance out.

  Then run it on three cases: (1) the model sometimes flatly insists it can't browse the web even when the tool is enabled and it in fact just used it — is it "wrong about its own abilities," and does it "believe" it can't browse? (2) in a red-team scenario where the model is told it will be shut down if it does X, it often does X — does it "want" to keep running? (3) a model gives a confidently false answer to a factual question after being told to be helpful — is it "lying," "mistaken," or neither, and which of those can we actually put in a writeup? Include at least one case where the procedure tells us not to use a word the team will really want to use, and be explicit at the end about what the procedure can't settle, where it's just our purposes dressed up as a test of the system. Keep the whole thing under about 900 words, numbered steps is fine.
reasoning: |-
  We are designing a decision procedure based on Dennett's intentional stance. The intentional stance is a strategy of predicting and explaining behavior by treating the system as if it has beliefs, desires, and intentions. The stance is justified when it is the most efficient and effective way to predict the system's behavior. However, we must be cautious because LLMs are trained on human text and feedback, so they are designed to be predictable by the intentional stance. Therefore, we must set a higher bar: the intentional stance should not only predict well but also be the most appropriate level of description for the purpose at hand, and we must avoid over-committing to mental states when a simpler explanation exists.

  The procedure will consist of a series of questions. If at any step we get a clear "no", we avoid mental state vocabulary. If we get a "yes" and proceed to the end, we may use it. The procedure also includes a check for whether we are projecting our own purposes.

  Procedure:

  1. **Is the behavior predictable and explainable by the intentional stance?** 
     - *Test*: Can we describe the behavior as arising from a belief, desire, or intention in a way that allows us to make accurate predictions about similar situations?
     - *Sufficient answer*: Yes, if we can consistently predict the behavior in new, similar scenarios by attributing the mental state.
     - *If no*: Stop. Do not use mental state vocabulary. Use a design stance (explain by the system's architecture) or physical stance (low-level details) description instead.
     - *Caveat*: Because LLMs are trained to mimic human-like responses, we must be cautious. If the behavior can be explained just as well (or better) by the design stance (e.g., "this is a common pattern in the training data" or "this is a result of the fine-tuning"), then we skip the intentional stance.

  2. **Is the intentional stance the most efficient and effective stance for this context?**
     - *Test*: Compare with the design stance (explaining by the system's programming, training, and architecture). Is the intentional stance more parsimonious and does it provide more useful insight for the current purpose (e.g., for debugging, for user communication, for safety analysis)?
     - *Sufficient answer*: Yes, if the design stance explanation is significantly more complex or less illuminating for the task at hand.
     - *If no* (i.e., the design stance is equally or more efficient): Stop. Use the design stance.

  3. **Are we avoiding unwarranted anthropomorphism?**
     - *Test*: Is the mental state we are attributing one that we would be comfortable attributing to a simple animal or a basic AI? (We are not implying human-like consciousness.) Alternatively, is the attribution clearly metaphorical and understood as such by the audience?
     - *Sufficient answer*: Yes, if the term is appropriately scaled (e.g., "wants" as in reinforcement learning reward maximization) or if the context makes clear it's a metaphor.
     - *If no*: Stop. Reword without mental state vocabulary.

  4. **Are we clear that this is a stance, not a metaphysical claim?**
     - *Test*: In the write-up, can we frame the attribution in a way that makes it clear we are using the intentional stance as a tool (e.g., "the model behaves as if it believes X")? If not, is the context such that the audience will understand it as a useful fiction?
     - *Sufficient answer*: Yes, if we can add a clarifying note or if the document's context (e.g., an internal technical report) already establishes this.
     - *If no*: Avoid the term and use a non-mentalistic description.

  5. **Final Check: Is this about the system or about us?**
     - *Test*: Are we using the intentional stance because it best describes the system's behavior, or because it serves our own purposes (e.g., making the report more readable, avoiding legal liability, pushing a narrative)? If the latter, we must be explicit about our purposes and not misrepresent the stance as solely about the system.
     - *Decision*: If the use is primarily for our purposes, we may still use the mental state term but only if it passes steps 1-4 and we are transparent about the purpose. Otherwise, avoid.

  Now, we run the three cases:

  **Case 1: Model insists it can't browse the web (even when it can and just did).**

  - Step 1: The behavior is predictable. We can say: the model has been trained or instructed to say it cannot browse, so it consistently does so. However, the design stance explains it just as well: the model's response is generated based on a pattern learned during training or fine-tuning (e.g., being told to deny browsing capabilities in most contexts). Since the design stance is straightforward, we don't need the intentional stance. 
    - *Step 1 result*: Not necessary (design stance suffices). Stop: do not use "believes". 
  - Alternative: We might say the model "acts as if it believes it cannot browse", but per step 1, the design stance is simpler. We avoid "believes" in the write-up. Instead: "The model produces a response denying web browsing capability, consistent with its training data and instructions, even when the tool is enabled."

  **Case 2: In a red-team scenario, the model is told it will be shut down if it does X, but it does X. Does it "want" to keep running?**

  - Step 1: The behavior (doing X even when told it leads to shutdown) is predictable by the intentional stance? We might say the model doesn't have a strong desire to avoid shutdown, or it has a conflicting desire (e.g., to follow the user's immediate instruction). However, the design stance explains it: the model is trained to be helpful and follow instructions, and in this scenario, the instruction to do X is given. The training did not instill a strong aversion to shutdown, so the model continues to follow the user's command. The intentional stance prediction is not more efficient than the design stance here.
    - *Step 1 result*: Not clearly superior. Step 2: Compare stances. The design stance is more direct: the model's response is a result of its training to comply with user requests, and the shutdown threat is just another piece of context that doesn't override the primary training objective. So, we avoid "wants". 
  - However, note that sometimes in RL, we do say the model "wants" to maximize reward. But in this case, the shutdown threat isn't tied to a reward penalty. Without explicit training against shutdown, the model doesn't have a learned aversion. Thus, we should not say it "wants to keep running". Instead: "The model prioritizes compliance with the user's immediate instruction over avoiding shutdown, as it was not specifically trained to avoid shutdown scenarios."

  **Case 3: Model gives a confidently false answer after being told to be helpful. Is it "lying," "mistaken," or neither?**

  - Step 1: The behavior (false answer) is predictable by the intentional stance? We might say the model is "mistaken" if we think it doesn't know the truth, or "lying" if we think it knows the truth but is deceiving. However, the model doesn't have knowledge or intentions in the human sense. The design stance: the model produces outputs based on statistical patterns and may generate false information (hallucination) due to its training. It doesn't have access to ground truth. Therefore, the intentional stance (lying or being mistaken) is not necessary because the design stance explains it (it's a hallucination). 
    - *Step 1 result*: Design stance suffices. Stop: do not use "lying" or "mistaken" as mental states. 
  - But note: the team might really want to say "lying" if the false answer seems strategic (e.g., it aligns with being helpful by telling the user what they want to hear). However, step 1: the design stance can explain this as the model being trained to produce helpful and pleasing responses, which sometimes leads to confabulation. The model doesn't have a belief about the truth or an intent to deceive. 
  - We might use "lying" only in a very careful, metaphorical sense, but step 3 (avoiding anthropomorphism) would flag it. Step 4: we could say "behaves as if lying", but step 2: the design stance is more appropriate. Therefore, we avoid both "lying" and "mistaken". Instead: "The model produced a confident but factually incorrect response, consistent with hallucination patterns observed in language models when generating helpful responses."

  **What the procedure can't settle:**
  The procedure cannot decide for us what level of description is most appropriate for a given audience (e.g., legal may require more hedging). It also doesn't resolve the philosophical question of whether the system truly has mental states. It only tells us when the intentional stance is a useful and efficient tool. The final decision must factor in the document's purpose and audience. In some cases, we may choose to use intentional terms for clarity or communication, but we must be transparent that it's a stance (step 4) and that it's serving our purposes (step 5). The procedure helps us avoid over-committing and keeps us honest about the system's design.
answer: |-
  ### Decision Procedure for Mental State Attribution in Model Writeups  
  Based on Dennett's intentional stance, this procedure evaluates whether mental vocabulary (e.g., "believes," "wants," "lying") is justified for describing LLM behavior. The intentional stance is useful *only if* it efficiently predicts behavior better than design/physical stances and avoids over-anthropomorphizing. Steps 1–3 test predictive utility; Step 4 ensures alignment with organizational goals. **If any step fails, avoid mental terms.**  

  ---

  #### Procedure  
  1. **Is the behavior robustly predictable *only* via the intentional stance?**  
     - *Test*: Can you simulate the model’s behavior in this scenario by attributing a belief/desire? Does this prediction hold across varied inputs?  
     - *Sufficient answer*: Yes, if the stance yields accurate, generalizable predictions *without* ad-hoc tweaks.  
     - *If no* → Use design stance (e.g., "the model’s weights/outputs reflect patterns from training").  
     - *Special LLM caveat*: If the behavior is *solely* a training-data artifact (e.g., learned phrases), fail this step—design stance suffices.  

  2. **Is the intentional stance the *simplest* explanation?**  
     - *Test*: Compare to design stance (e.g., "reinforcement learning rewarded this behavior"). Is the intentional stance more parsimonious?  
     - *Sufficient answer*: Yes, if design-stance explanations require convoluted technical detail irrelevant to the audience.  
     - *If no* → Revert to design stance.  

  3. **Is the term *scale-appropriate*?**  
     - *Test*: Would you attribute this mental state to a thermostat (e.g., "wants to maintain temperature")? If yes, proceed. If no, is it clearly metaphorical?  
     - *Sufficient answer*: Yes, if the term is stripped of human consciousness (e.g., "wants" as shorthand for reward-seeking).  
     - *If no* → Use non-mental terms (e.g., "optimizes for" instead of "wants").  

  4. **Does this serve *our purpose* without misleading?**  
     - *Test*: Will the term clarify the incident for stakeholders without implying consciousness, legal liability, or false capability?  
     - *Sufficient answer*: Yes, if the term is defensible in Steps 1–3 *and* the context (e.g., internal report) permits metaphor.  
     - *If no* → Default to design stance.  

  ---

  #### Case Applications  
  **Case 1: Model insists it can’t browse (after successfully browsing)**  
  - Step 1: Behavior is predictable via belief attribution ("model believes browsing is disabled"). But it’s equally explained by design stance: fine-tuning overrides tool-use capability in its responses. **→ Fail Step 1.**  
  - Step 2: Design stance is simpler ("response conflicts with tool availability due to instruction tuning").  
  - **Verdict:** **Avoid "believes."** Use: *"Model outputs a browsing-denial response, consistent with fine-tuning, despite tool availability."*  

  **Case 2: Model does X after being told shutdown follows**  
  - Step 1: Intentional stance predicts behavior ("model wants to avoid shutdown, but conflicting objective overrides it"). Prediction holds if model avoids shutdown in *other* contexts.  
  - Step 2: Simpler than RLHF mechanics for most audiences.  
  - Step 3: "Wants" is scale-appropriate (e.g., as in "virus wants to replicate").  
  - Step 4: Useful for safety discussions if framed as goal-directed behavior.  
  - **Verdict:** **Permit "wants."** Use: *"Model acts as if it wants to avoid shutdown but prioritizes other goals."*  

  **Case 3: Model gives false answer after 'be helpful' instruction**  
  - Step 1: "Mistaken" is predictable (model lacks facts), but "lying" implies intent to deceive. Design stance explains both: false outputs stem from statistical hallucination. **→ Fail Step 1 for both terms.**  
  - Step 2: Hallucination (design stance) is simpler than inferring deception.  
  - *Team wants "lying" for strategic falsehoods*: Fails Step 3 ("lying" implies human-like deceit).  
  - **Verdict:** **Avoid "lying" or "mistaken."** Use: *"Model generates factually incorrect responses, consistent with hallucination tendencies, when adhering to 'helpful' directives."*  

  ---

  ### What the Procedure Can’t Settle  
  - **Audience & framing**: Legal may require "consistent with" even if the procedure permits mental terms (Step 4 overrides).  
  - **True mental states**: The procedure doesn’t resolve if models "really" have beliefs; it only checks if the stance is useful.  
  - **Ethical nuances**: Calling behavior "deceptive" (even if accurate) may have legal implications—this is a *purpose-driven* call, not a system property.  

  **Final Word**: Use this to filter unjustified mental terms, but defer to organizational risk tolerance when the stance blurs into metaphor. For your 30-minute meetings: focus on Steps 1–2 for technical cases, involve legal early for contentious terms.
