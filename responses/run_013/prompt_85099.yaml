  We are designing an activity for a group of 12-14 people, lasting 90 minutes, to explore the question of "what counts as the same mechanism?" in the context of mechanistic anomaly detection. The goal is for participants to start confident in their ability to group anomalies by mechanism, then experience that criteria like causal role, computational role, and behavioral signature can diverge, and that the "right" grouping depends on available interventions and cannot be resolved by more data alone.

  We'll create a fictional system: a "Widget Factory" that produces widgets. The factory has several machines (mechanisms) that can break down in specific ways, producing anomalies. We'll give participants an anomaly log with descriptions of anomalies and some context. The twist is that the same underlying mechanism might manifest differently in different contexts (e.g., due to interactions with other machines or environmental conditions), and different mechanisms might produce similar symptoms under certain conditions.

  **Activity Design:**

  **Setup:**
  - Prepare an "Anomaly Log" with 12 anomalies (each participant gets one, but they can trade; if there are 14, some duplicates or add two more). Each log entry describes:
    - A unique anomaly ID (e.g., A1 to A12).
    - A description of the anomaly (e.g., "Widget has a dent on the left side", "Widget is missing a screw", "Widget is painted the wrong color").
    - The context in which it occurred (e.g., "during night shift", "when Machine X was active", "after maintenance on Machine Y").
    - The effect on the widget (e.g., "fails quality check", "causes assembly line stoppage", "only cosmetic").

  - Also, create a set of "Intervention Cards". Each card describes an intervention that can be performed (e.g., "Replace part on Machine X", "Adjust alignment on Machine Y", "Change paint supplier"). There should be about 6-8 interventions, each with a cost (in fictional "factory credits"). The interventions are designed so that:
    - Some interventions fix multiple anomalies that share a common mechanism, even if the symptoms are different.
    - Some interventions fix only one anomaly, but that anomaly might be caused by multiple mechanisms (so it might not fix it in all cases).

  **Rules:**
  1. Participants are divided into teams of 3-4. Each team plays the role of a "Quality Control Team" in the Widget Factory. The goal is to maximize the factory's efficiency by fixing anomalies at the lowest cost.

  2. Each team is given:
     - A copy of the full Anomaly Log (all 12 anomalies).
     - A budget of 100 factory credits.
     - A set of Intervention Cards (each card lists the intervention, its cost, and a short description of what it does).

  3. The task: The team must decide which interventions to buy to fix as many anomalies as possible without exceeding their budget. They are told that some interventions might fix multiple anomalies (if they share the same underlying mechanism) and some might fix only one. They are also told that if an intervention is applied to an anomaly that it doesn't fix, they get no benefit and lose the cost.

  4. Teams have 20 minutes to plan their intervention purchases. They must record which interventions they buy and which anomalies they expect to fix with each.

  5. After planning, the facilitator (you) acts as the "Factory System" and provides feedback for each intervention-anomaly pair. For each intervention a team applies to an anomaly, you will say whether it fixed it or not. This feedback is based on a hidden "true mechanism map" that you have (which defines which anomalies are caused by the same mechanism). Note: The feedback is deterministic but depends on the hidden mechanism.

  6. Teams then get to see how many anomalies they fixed and how many credits they have left. They can then optionally buy more interventions in a second round (with the same budget, so they can use leftover credits) but now they have the feedback from the first round. They have 10 minutes for the second round.

  7. After the second round, the facilitator again provides feedback. Then, we calculate the total anomalies fixed and leftover credits. The team with the most anomalies fixed (with ties broken by leftover credits) wins.

  **The Twist:**
  The hidden mechanism map is designed so that anomalies can be grouped in multiple ways, and the interventions are keyed to these groupings. For example:
  - Grouping by "causal role" (the physical machine part): Interventions that replace a part fix all anomalies caused by that part, regardless of symptom.
  - Grouping by "symptom" (behavioral signature): Some interventions are symptom-specific and fix all anomalies with that symptom, even if caused by different mechanisms (but only in some contexts).
  - Grouping by "computational role": Some anomalies are caused by a software glitch that manifests in different machines, so an intervention that updates the software fixes those, even if the symptoms are different.

  Moreover, the feedback after the first round might reveal that an intervention fixed an anomaly that the team didn't expect, or failed to fix one they thought it would, because the mechanism grouping they assumed was incorrect.

  **Anomaly Log Example (simplified):**
  - A1: Widget dented on left (night shift, Machine X active) -> fails quality check.
  - A2: Widget missing screw (day shift, after maintenance on Machine Y) -> causes stoppage.
  - A3: Widget wrong color (any time) -> cosmetic.
  - A4: Widget has a crack (high humidity) -> fails quality check.
  - ... etc.

  **Intervention Cards Example:**
  - Replace the conveyor belt on Machine X: cost 40 credits. (Fixes A1, A5, A9 because they are caused by a faulty conveyor belt, even though symptoms differ: dent, scratch, and misalignment.)
  - Tighten screws on all machines: cost 20 credits. (Fixes A2 and A7 because they are missing screws, but note: A2 is caused by Machine Y's vibration and A7 by a faulty screw feeder on Machine Z. So this intervention fixes both because it addresses the symptom, not the cause. However, in the next week, new missing screw anomalies might appear because the root cause wasn't fixed.)
  - Update the control software: cost 60 credits. (Fixes A3 and A8 because both are due to a software bug that affects color and size, even though the symptoms are different.)

  **Debrief:**
  After the activity, gather the groups and discuss:
  - What groupings did teams use initially? (Likely by symptom or by context.)
  - What happened when they applied interventions? Did they get surprises?
  - How did they adjust in the second round?
  - Then, introduce the concepts: causal role (the physical cause), computational role (the function in the system), behavioral signature (the observable effect). Point out how the interventions were tied to these different groupings.
  - Highlight that without knowing the underlying mechanism (which they didn't have), they had to rely on interventions to test their groupings. But note that even after testing, they might not know the "true" mechanism because an intervention might fix multiple mechanisms (if it's a symptom-level fix) or might not fix all instances (if the mechanism is context-dependent).
  - Emphasize that more data (more anomalies) wouldn't necessarily resolve the grouping because without interventions, they only see correlations. Interventions provide causal information, but the grouping still depends on the level of abstraction (are we grouping by symptom, by physical part, by software?).

  **What will go wrong:**
  1. **Time Pressure:** 20 minutes for the first round might be tight. Solution: Be flexible and allow 25 minutes if needed, but keep the activity moving.

  2. **Confusion with Rules:** Participants might not understand that an intervention can be applied to multiple anomalies. Solution: Explain clearly that they must specify which intervention they are applying to which anomaly, and that one intervention can be applied to several anomalies (if they think it will fix all of them) but they pay the cost once and then it's available for all. However, if the intervention doesn't fix a particular anomaly, they get no credit for that one.

  3. **Unclear Feedback:** The feedback might seem arbitrary. Solution: Have a clear hidden map and stick to it. Explain that the factory system has a fixed underlying truth.

  4. **Group Dynamics:** Some members might dominate. Encourage teams to have everyone participate.

  5. **Unexpected Groupings:** Teams might come up with creative groupings you didn't anticipate. That's okay! Use it in the debrief to show that multiple groupings are possible and that the "right" one depends on the goal (cost-efficiency) and available interventions.

  **What the activity cannot reproduce:**
  - The activity simplifies the real-world complexity where mechanisms are not pre-defined and the available interventions are limited by what we can think of. In reality, we don't have a hidden map, and we don't know what interventions to try. The activity relies on you, the facilitator, having a hidden map and providing feedback. You'll have to explain that in real anomaly detection, we are trying to discover the hidden structure, and the choice of what counts as the same mechanism is often a modeling decision that depends on the level of abstraction and the purpose (e.g., for repair, for prediction, for understanding).

