  First, I need to list all the cases they mentioned and ensure each requirement addresses them. The user wants a theory that handles evidence about the past without confusing it with causation. The smoking gene case is crucial here because avoiding smoking looks helpful but the gene is the real cause. They also care about the distinction between choosing an option and being the type of person who chooses it, which ties into the hitchhiker and poison intention scenarios.

  The user is hinting at internal conflicts in theories, like post-choice regret versus maximizing outcomes. In the original Newcomb's, one-boxers don't regret it even if they see the empty box later, but two-boxers might. This tension between "no regret" and "maximize outcome" seems key. The glass boxes scenario adds another layer: if you see the million, causal decision theory says take both, but evidential might still say one-box, which feels irrational.

  The hitchhiker and poison cases involve commitment and pre-commitment policies. The user wants to know if a theory can advocate for self-modification to be more trustworthy. Also, the 70% predictor tests how robust the theory is under uncertainty.

  I should identify which requirements are non-negotiable. Probably, "no Dutch books" and "causal dominance" are foundational because violating them leads to guaranteed losses. The user’s friend might prioritize different aspects, so highlighting which camps care about which requirements (e.g., causal vs. evidential) will help them debate.

  The biggest theory-killer might be the "no Dutch books" requirement since it's a dealbreaker for any decision theory. Also, the conflict between "no regret" and "maximize outcome" in Newcomb's is unavoidable; you can't satisfy both in all cases. Explaining that trade-off will help the user understand why the debate persists.
answer: |-
  Here's a breakdown of the core requirements for a rigorous theory of rational choice in "evidence about the past" scenarios, based on the cases you provided and the key distinctions. I'll list them, explain the case driving each, flag conflicts, and note their importance.

  **Core Requirements & The Cases That Drive Them:**

  1.  **Respect Causal Structure (The Smoking Gene Distinction):**
      *   **Requirement:** The theory must distinguish between *causing* an outcome and merely being *evidence* of it. Rationality shouldn't confuse correlation with causation.
      *   **Case:** Smoking Gene. Choosing not to smoke is evidence you lack the cancer gene, but it *does not cause* you to lack the gene. A rational theory must correctly advise that quitting smoking doesn't *cause* you to avoid the genetic cancer risk (though quitting has independent health benefits). The gene causes both the disposition to smoke and the cancer risk.
      *   **Non-Negotiable:** Absolutely fundamental. Blurring cause/evidence leads to magical thinking.

  2.  **Avoid Dominated Strategies (The Glass Boxes Test):**
      *   **Requirement:** The theory should never recommend a strategy that yields a strictly worse outcome in *every possible state of the world* compared to another available strategy.
      *   **Case:** Glass Boxes Newcomb. You *see* $1M in the opaque box. Taking *only* the opaque box yields $1M. Taking *both* boxes yields $1M + $1K = $1.001M, regardless of what the Predictor did (since the contents are fixed and visible). Taking only the opaque box is strictly dominated by taking both. A rational theory *must* recommend taking both boxes here.
      *   **Non-Negotiable:** Violating this is accepting guaranteed less money for no reason. A cornerstone of rationality.

  3.  **Maximize Conditional Expected Utility (The Original Newcomb Challenge):**
      *   **Requirement:** The theory must correctly handle situations where your *choice itself* provides information about the state of the world (which is already fixed), and this information is crucial for calculating the expected utility *conditional on that choice*.
      *   **Case:** Original Newcomb (Perfect Predictor). If the Predictor is infallible:
          *   Choosing One-Box *is perfect evidence* the Predictor *put $1M in the opaque box*. Expected Value (EV) = $1M.
          *   Choosing Two-Box *is perfect evidence* the Predictor *put $0 in the opaque box*. EV = $1K.
          *   Therefore, conditional on choosing One-Box, EV($1M) > EV($1K) conditional on choosing Two-Box.
      *   **Camp Importance:** This is the *core battleground*. Evidential Decision Theory (EDT) prioritizes this conditional EV and says One-Box. Causal Decision Theory (CDT) rejects this reasoning, seeing it as confusing cause/evidence.

  4.  **Handle Uncertainty Robustly (The 70% Predictor):**
      *   **Requirement:** The theory must provide rational recommendations even when the correlation between choice and past state is probabilistic, not certain. Recommendations should scale sensibly with the strength of the correlation.
      *   **Case:** 70% Accurate Predictor Newcomb. If Predictor accuracy is 70%:
          *   One-Box: (70% chance $1M) + (30% chance $0) = EV $700K
          *   Two-Box: (70% chance $1K) + (30% chance $1.001M) = EV $301K
          *   A theory must recommend One-Boxing here too, as it has higher EV. It should also explain *why* the recommendation changes if accuracy drops to 51% vs. 49% (One-Box vs. Two-Box becoming optimal).
      *   **Non-Negotiable:** Real-world correlations are rarely perfect. A theory must handle uncertainty.

  5.  **Account for Commitment & Pre-Commitment (The Poison Intention & Hitchhiker):**
      *   **Requirement:** The theory must acknowledge the distinction between:
          *   **Option Selection:** Choosing an action *right now*.
          *   **Being a Type:** Having a disposition or character that reliably leads to certain choices.
          *   **Policy Adoption:** Committing *in advance* to a rule for future choices.
      *   **Cases:**
          *   **Poison Intention:** The million depends on *honestly intending now* to drink poison tomorrow. Actually drinking it tomorrow is irrelevant (and irrational). Rationality requires finding a way to *be the type of person* who forms that honest intention now. You *want* to be pre-committed to intending it. The challenge is *how* to choose that *now*.
          *   **Hitchhiker:** The stranger picks you up only if he *believes* you'll pay later. Paying once safe is costly, so a purely self-interested agent would want to not pay. But if the stranger knows this, he won't pick you up. Rationality requires finding a way to *be the type of person* who is credible – someone the stranger believes *will* pay. You *want* to be pre-committed to paying. The challenge is *how* to choose that *now*.
      *   **Camp Importance:** CDT often struggles here, as the *current causal act* of paying/drinking is bad. EDT/UDT focuses on the evidence your choice provides about your type/policy.

  6.  **Avoid Dynamic Inconsistency / Regret Minimization (The "No Regret" Principle):**
      *   **Requirement:** A rational choice made with available information should not be one you *know in advance* you will regret *after* learning the outcome, if that outcome was possible when you chose. Your choice should be stable upon reflection.
      *   **Case:** Original Newcomb & Glass Boxes.
          *   **Original (One-Boxer):** After opening boxes, if Predictor was right (which they almost always are), One-Boxer has $1M, Two-Boxer has $1K. One-Boxer has no regret. *If* the Predictor was wrong (vanishingly rare), One-Boxer sees $0 and Two-Boxer sees $1K. One-Boxer might regret *then*, but when choosing, they knew this outcome was possible but extremely unlikely and outweighed by the likely $1M vs $1K.
          *   **Original (Two-Boxer):** After opening boxes, they *always* get $1K less than they *could have had* if they had One-Boxed (because if they One-Boxed, Predictor would have put $1M in). They *know in advance* they will feel this regret if the Predictor is good (which they are). "I wish I had been the type to One-Box."
          *   **Glass Boxes:** Anyone who took only the opaque box (seeing $1M inside) would *profoundly regret* it after seeing they could have had $1.001M. They knew this when choosing.
      *   **Camp Importance:** One-boxers argue Two-boxing leads to guaranteed regret in the original scenario. Two-boxers argue the Glass Boxes case shows EDT-style reasoning *can* lead to regret when dominance is clear. UDT aims for "stable" choices free of this regret.

  7.  **Immunity to Dutch Books (The No Free Lunch Principle):**
      *   **Requirement:** A rational agent should not be susceptible to a "Dutch Book" – a series of bets offered at different times that guarantee the agent a loss, no matter what happens, if they accept all bets based on their decision rule.
      *   **Case:** While not directly tied to one scenario, this is a fundamental coherence requirement. If a theory allows an agent to accept combinations of choices/bets that *guarantee* a loss compared to another available strategy, it's fatally flawed. Violating **Requirement #2 (Avoid Dominance)** is one way to fall prey to a Dutch Book (like the Glass Boxes).
      *   **Non-Negotiable & Biggest Killer:** This is a critical litmus test. A theory susceptible to Dutch Books is considered fundamentally irrational and incoherent. This requirement kills theories that violate dominance or have other internal inconsistencies.

  **Key Distinctions the Theory CANNOT Blur:**

  *   **Evidence vs. Cause:** See Requirement #1 & #2. This is paramount.
  *   **Choosing Option X vs. Being the Type Who Chooses X:** See Requirement #5 (Poison/Hitchhiker). Rationality often requires manipulating/committing to the latter to achieve the former effectively.
  *   **Acting Now vs. Pre-Committed Policy:** What would you want to bind yourself to *before* facing the choice? Often aligns with "being a type" (Requirement #5).
  *   **Choice vs. Outcome Knowledge:** Rational choice is based on information *at the time of choice*. Regret (Requirement #6) is evaluated with hindsight information but shouldn't *determine* the initial choice if it was rational given prior info.

  **Where Requirements Clash (The Battlegrounds):**

  1.  **Maximize Conditional EV (#3) vs. Avoid Dominance (#2) & Respect Causality (#1):** This is THE core conflict.
      *   Original Newcomb: EDT (#3) says One-Box (higher cond. EV). CDT (#1, #2) says Two-Box (taking both can't *cause* less money to be in the opaque box, and dominance holds in the subjunctive sense - "If the $1M is there, I should take it *too*; if it's not, I should take the $1K").
      *   Glass Boxes: EDT (#3) *might* still say One-Box if it naively applies the original logic ("Choosing One-Box *means* the Predictor put $1M there, so EV=$1M > EV of Two-Boxing"). This directly violates Avoid Dominance (#2) and Respect Causality (#1) - you can *see* the money, taking it doesn't cause it to disappear! Good EDT/UDT formulations avoid this by updating on *all* information (including sight), making Two-Boxing dominant.

  2.  **Maximize Conditional EV (#3) / Be the Type (#5) vs. Avoid Regret (#6) - CDT Perspective:**
      *   CDT argues that One-Boxing in Newcomb (#3) *requires* the agent to make a choice they *know* is dominated in a causal sense and will lead to regret (#6) if they ever learn the Predictor's prediction was based on something other than perfect acausality (e.g., a brain scan). They see it as irrational self-deception.

  3.  **Avoid Regret (#6) vs. Avoid Regret (#6) - Interpreted Differently:**
      *   **One-Boxer:** Two-Boxing guarantees regret in the original scenario (you always get less than you could have).
      *   **Two-Boxer:** One-Boxing risks profound regret in edge cases (like Glass Boxes, or if Predictor is wrong) and feels like ignoring a free $1K.
      *   **Resolution Attempt:** UDT argues One-Boxing is "stable" regret-wise in the original: the regret only happens in incredibly unlikely scenarios outweighed by the near-certain benefit, and importantly, *doesn't* stem from violating dominance given the information at the time. Two-Boxing regret is *systematic and known in advance*.

  **Summary of Importance:**

  *   **Non-Negotiable (Dealbreakers):** Respect Causal Structure (#1), Avoid Dominated Strategies (#2), Immunity to Dutch Books (#7). Violating these means the theory is fundamentally flawed/irrational.
  *   **Core Battleground Requirements:** Maximize Conditional Expected Utility (#3), Handle Uncertainty (#4), Account for Commitment/Type (#5), Avoid Dynamic Inconsistency/Regret (#6). Different theories prioritize these differently, leading to different recommendations in Newcomb-like problems. How a theory resolves the clash between #3 and #1/#2 defines its camp.
  *   **Biggest Theory Killer:** **Immunity to Dutch Books (#7)**. If a theory allows guaranteed losses through a series of choices, it's dead. Violating Avoid Dominance (#2) is the most common path to failing this.

  This list gives you the rigorous framework to evaluate any decision theory (CDT, EDT, UDT, FDT, etc.) for handling the Newcomb Paradox and your specific cases. The tension between using your choice as evidence about a fixed past while respecting causality and dominance is the heart of the debate. Good luck settling those lunch arguments!
