answer: |-
  ## Essay Question (90 minutes)

  **Critically analyse the following conceptual progression: "The mapping between codons and amino acids is Saussurean-arbitrary; therefore, DNA carries information; therefore, genes 'tell' the cell what to do." Your analysis must engage with the Parity Thesis and account for the observation that the standard genetic code appears optimised to minimise errors from point mutations and mistranslation. What, if anything, justifies each step in this 'triple jump'? What must proponents of the 'DNA as code' metaphor demonstrate to defend this progression against its critics?**

  ---

  ## Model Answer (Approx. 600 words)

  The progression from codon arbitrariness to DNA carrying information, and thence to genes instructing the cell, represents a significant conceptual leap that requires careful unpacking. While the initial premise is robustly settled, the subsequent steps involve contested philosophical and biological interpretations.

  **Step 1: From Arbitrariness to Information?** It is uncontroversial that the codon-amino acid mapping is Saussurean-arbitrary: there is no inherent chemical necessity dictating that GCU specifies alanine; alternative mappings are chemically conceivable. However, labelling this arbitrariness as sufficient for "information" is problematic. Arbitrariness alone does not constitute information. Information requires a *source*, a *channel*, and crucially, an *interpreter* or *receiver* for whom the signal reduces uncertainty or has functional significance within a specific system. The arbitrariness is a necessary feature *of a code*, but information implies *aboutness* – specifying something beyond itself, like amino acid sequence. Proponents must demonstrate how the chemical arbitrariness, within the context of the evolved cellular machinery (tRNAs, ribosomes, etc.), constitutes a *functional* mapping that reliably correlates specific sequences with specific outcomes, thereby reducing uncertainty about polypeptide synthesis. This moves beyond mere arbitrariness to functional specificity.

  **Step 2: From Information to Instruction?** Even if we grant DNA carries information about amino acid sequences, the jump to genes "telling" the cell what to do is a further, contentious anthropomorphism. Information in the Shannon sense (reduction of uncertainty) does not inherently imply *control* or *agency*. Saying genes "instruct" or "direct" implies a privileged, unilateral causal role that the Parity Thesis robustly challenges. The Parity Thesis (Oyama, Griffiths, Gray) argues that DNA is one developmental resource among many (e.g., cytoplasmic gradients, maternal hormones, environmental cues). While DNA specifies sequence information, the *interpretation* and *execution* of that "message" depend entirely on the complex, pre-existing cellular machinery – itself the product of prior development involving myriad non-genetic factors. A gene sequence is inert without this context; it doesn't "tell," it is *used* by the system. Proponents of the instructive metaphor must demonstrate that DNA plays a *unique* informational or causal role that other resources lack – perhaps arguing it is the only resource carrying *arbitrary*, sequence-specific information for protein synthesis. However, the Parity Thesis counters that other factors carry essential *contextual* information crucial for development.

  **The Awkward Fact of Optimisation:** The apparent optimisation of the genetic code for error minimisation (e.g., similar codons often specify similar amino acids, reducing impact of point mutations) complicates a purely arbitrary view and influences the information/instruction debate. While it doesn't negate the fundamental arbitrariness (the *choice* of which amino acid gets which set of similar codons remains arbitrary), it demonstrates that evolution has *selected* a specific mapping based on its functional consequences. This supports the view that the code functions *as* an information-bearing system shaped by natural selection for reliability. However, for opponents of strong instructive language, this optimisation merely shows DNA is a highly refined *template* used *by* the cell, not a commander. It underscores the code's evolved functional role without necessarily licensing "instruction".

  **Conclusion:** The progression relies on conflating distinct concepts. Arbitrariness is a feature of the code's structure but doesn't, by itself, establish information or agency. Granting information requires showing how the arbitrary mapping functions reliably within the cellular system to specify sequences. The move to "instruction" requires demonstrating DNA's unique causal primacy against the Parity Thesis, which highlights the essential, interactive role of the entire developmental system. The code's optimisation supports its functional, information-bearing nature but doesn't resolve the debate about whether genes "tell" or are "used". Ultimately, while the 'code' metaphor is powerful and pragmatically useful, its extension to "instruction" is a heuristic that risks obscuring the distributed, systemic nature of development. Proponents must rigorously defend the uniqueness and causal primacy of DNA's informational role against the levelling force of the Parity Thesis.

  ---

  ## Marking Scheme (20 points total)

  1.  **Arbitrariness Defined & Settled (4 points):** Clearly defines Saussurean arbitrariness in the codon-amino acid mapping and correctly identifies this as uncontroversial. *Common Miss:* Vague on arbitrariness, conflates it with randomness, or wrongly claims it's disputed.
  2.  **Critique of Step 1 (Arbitrary → Information) (5 points):** Effectively critiques the jump, distinguishing arbitrariness from information (Shannon reduction of uncertainty, functional specificity, interpreter dependence). Identifies what proponents must show (functional mapping, specificity). *Common Miss:* Equates arbitrariness directly with information or "aboutness"; asserts "degeneracy disproves code"; fails to articulate what must link arbitrariness to information.
  3.  **Critique of Step 2 (Information → Instruction) & Parity Thesis (5 points):** Critically analyses the "instruction" metaphor, engaging substantively with the Parity Thesis challenge. Explains why information ≠ instruction/control. Identifies what proponents must show (DNA's unique causal/informational role). *Common Miss:* Defends "instruction" uncritically; dismisses Parity Thesis without argument; conflates sequence specification with causal control; ignores the essential role of the interpreting machinery.
  4.  **Integration of Code Optimisation (3 points):** Explains how the observed optimisation complicates a *purely* arbitrary view (shows functional selection) but doesn't negate arbitrariness. Connects it to the information/function debate. *Common Miss:* Ignores optimisation; claims it disproves arbitrariness; fails to link it meaningfully to the information/instruction questions.
  5.  **Overall Coherence & Distinguishing Settled/Contested (3 points):** Clear, logical structure distinguishing settled fact (arbitrariness) from contested interpretations (information frameworks, instructive power). Balanced treatment of arguments. *Common Miss:* Presents contested views (e.g., teleosemantics) as consensus; structure is unclear or jumps between points; fails to maintain the distinction between settled and contested ground.

  ---
  **Notes on Execution:**

  *   **British English:** Programme, colour, analyse, optimisation, licence (verb) etc., used throughout.
  *   **Model Answer Pitch:** Assumes knowledge of central dogma, Parity Thesis (likely Oyama/Griffiths), basic info theory (Shannon), and awareness of code optimisation. Engages concepts critically without excessive jargon. Uses phrases like "one might argue," "proponents must demonstrate," "this is contested," to avoid presenting any single view as definitive consensus.
  *   **Key Traps Addressed:** Explicitly counters "degeneracy disproves code" (it's a feature, not a bug, of codes). Separates arbitrariness from both "aboutness" and "instruction". Forces engagement with Parity Thesis on its own terms. Handles optimisation as a complicating factor, not a refutation.
  *   **Leaning Contested:** The answer leans towards a systems-oriented view critical of strong instructive language (reflecting the thrust of the Parity Thesis), while acknowledging the pragmatic utility of the code metaphor. It explicitly flags the contested nature of information frameworks and the definition of DNA's unique role, avoiding endorsing Shannon *or* teleosemantics as the "correct" view.
