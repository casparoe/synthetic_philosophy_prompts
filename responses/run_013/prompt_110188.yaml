prompt: |-
  Hey, I'm a software engineer with no real philosophy backround, and I definately need a joke for a small talk thing at work. Can you take on the role of a professional philosopher who specializes in decision theory and also a decent stand-up comic? Write me one joke about the Ellsberg paradox and ambiguity aversion. It should be funny to people who actually know the paradox, so the punchline needs to turn on the real content, not just humans hate uncertainty, lol. You know the setup: one urn has 50 red and 50 black balls, the other has 100 balls in some unknown red/black mix, and people tend to prefer betting on the known urn even though that pattern of preferences violates expected utility. Here's the angle I want: make it about the difference between maxmin expected utility and smooth ambiguity aversion. Quick version so we're on the same page: in maxmin you have a set of possible probability distributions and you judge an act by its worst-case expected utility over that set; in the smooth model you have a second-order distribution over the possible first-order probabilities, take the expected utility under each, then apply something like a concave function to the spread of those expected utilities, so you can dislike ambiguity itself. I want someone who knows both models to hear the joke and think, oh, that's actually the distinction. Maybe set it in a betting pool, a bar, an office, or a courtroom, whatever works. Before you write the final joke, brainstorm 4-5 premises and pick the best one. Think carefully about why the maxmin vs smooth contrast is funny. Keep the final joke short, like 3-6 lines. Don't just explain the paradox and then tack on a punchline. And please don't use citations or real quotes; I don't need sources, I need a joke. If it can also nod at whether ambiguity aversion is a bias or a rational response, great, but don't let that take over. Also, minor thing: I might use this in a slide deck, so avoid anything too long.
