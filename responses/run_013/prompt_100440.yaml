  Right then. Village fête marrow competition, partially ordered by girth then length. Chains of ever-lumpier marrows sprawl across trestles. Judge Bert (Zorn’s Lemma incarnate) declares: “Every chain has an upper bound! Young Timmy’s monstrous marrow from the potting shed bounds *that* chain!”

  He slaps a rosette on Timmy’s colossal, knobbly beast. “Maximal element! Nothing strictly bigger!”

  Old Mrs Gable thumps her smooth, equally massive marrow down. “But Bert! Mine’s *wider*! Not comparable!”

  “Exactly!” beams Bert. “Maximal, not maximum! Your marrow’s enormous too, but neither’s bigger. The lemma guarantees *a* maximal marrow exists, bless its non-constructive heart. Doesn’t mean I can *find* the absolute biggest, or that Timmy’s is ‘best’. It’s just... unchallenged in its niche. Pass the tea.”

  Silence. Then groans. Timmy stares at his ugly winner, utterly confused. Mathematics: 1. Horticultural Clarity: 0.

