  Alright, I need a joke about Zorn's lemma for our department's Christmas do and I'm completely stuck. The trouble is everyone there actually knows the lemma, so a generic "mathematicians can't party" gag will get me nothing — the punchline has to turn on how the thing actually works. Best if it hangs on one of the fiddly bits people always get wrong: that an upper bound of a chain doesnt have to belong to the chain, or that a maximal element isn't the same thing as a maximum, or that it's non-constructive and promises you an element exists without giving you any way to actually find it. I was going to set it at a village vegetable show with the marrows partially ordered by size, but do whatever's funnier so long as the maths is doing the work rather than just being set dressing. 150 words max, and in British English please — marrows, fête, the lot.
