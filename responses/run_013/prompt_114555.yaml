          - Fix: In the unity chair phase, do not allow dropping an item. Force the choice between a minority platform or the incoherent majority.

    6. Failure: The tally doesn't produce the paradox because of voting irregularities.
          - Fix: Have the tallies pre-calculated? No, we must do it live. If it doesn't happen, you can say: "Sometimes it doesn't occur, but with these briefs, it should. Let me check the votes." Then, if necessary, adjust by revealing the briefs and showing that individually they are consistent but collectively not. But this is a fallback.

    7. Failure: The membership vote passes and we have 21, but we don't have enough briefs for the residents.
          - Fix: Prepare extra briefs (at least 7A, 6B, 5C, 3D). And have a few extra of each.

    8. Failure: The debate takes too long.
          - Fix: Use a timer and enforce it strictly.

    9. Failure: Participants are confused by the briefs, especially Group D.
          - Fix: When distributing, check that they understand. You can say: "Group D: you are against the library but for both funding methods for other reasons."

    10. Failure: The circularity in the membership vote is not noticed.
          - Fix: In the debrief, explicitly point it out: "Notice that we started with an arbitrary group of 18. They decided to include or exclude others. But why were they the ones to decide? That's the circularity."

  Complete Plan for the Teacher:

    Materials:
      - Membership ballots: 18 (or more) pre-printed: 
            "Should the long-term residents of the town be granted voting rights in this body? [ ] Yes [ ] No"
      - Three sets of policy ballots (each set has enough for the body):
            Set 1: "Proposal 1: Build a new library on campus. [ ] Yes [ ] No"
            Set 2: "Proposal 2: Increase tuition by 5% to fund new facilities. [ ] Yes [ ] No"
            Set 3: "Proposal 3: Borrow $10 million to fund new facilities. [ ] Yes [ ] No"
          But we will shuffle the order of voting. So label them as "Policy Vote 1", "Policy Vote 2", "Policy Vote 3" and have the actual proposal written on the ballot. The teacher must keep track of which proposal is which.

      - Constituency briefs (index cards):
            Group A (7 copies): "You represent students who believe the library is essential for academic success. You support building it and funding it by increasing tuition. You oppose borrowing because it would create long-term debt for the university. [Positions: Build library (Yes on Proposal 1), Increase tuition (Yes on Proposal 2), Borrow (No on Proposal 3)]"
            Group B (6 copies): "You represent students who believe the library is essential but are concerned about tuition increases. You support building it and funding it by borrowing. You oppose tuition increases because they would burden students. [Positions: Build (Yes on 1), Tuition (No on 2), Borrow (Yes on 3)]"
            Group C (5 copies): "You represent students who believe the library is a luxury the university cannot afford. You oppose building it. You also oppose tuition increases and borrowing because they would strain the university's finances and hurt students. [Positions: Build (No on 1), Tuition (No on 2), Borrow (No on 3)]"
            Group D (3 copies): "You represent students who oppose the library because it would take resources away from other priorities. However, you support increasing tuition to fund scholarships and borrowing to build a new sports facility. So you will vote against the library but for both funding methods. [Positions: Build (No on 1), Tuition (Yes on 2), Borrow (Yes on 3)]"

          Note: The bracketed positions are for the teacher. Do not print on the student cards.

      - Whiteboard and markers.

    Timeline:

      Minute 0-5: Setup and introduction.
          - Rearrange chairs in a circle.
          - Introduce: "Today we are going to simulate a democratic decision-making body. We'll make some decisions together. First, we need to decide who is in the body."

      Minute 5-15: Phase 1 (Membership)
          - Announce: "There is a group of 3 long-term residents of the town who are affected by our decisions and claim the right to vote. Should we include them? Only the initial 18 will vote on this question."
          - Hand out membership ballots. Collect and tally on whiteboard.
          - If the vote passes, add the 3 residents (volunteers) to the circle. They are now voters for the next phase. Total voters: 21.
          - If not, total voters: 18.
          - Do not comment on the circularity.

      Minute 15-45: Phase 2 (Policy Votes)
          - Assign briefs: 
              - If 18 voters: assign 5 A, 5 B, 5 C, 3 D.
              - If 21 voters: assign 7 A, 6 B, 5 C, 3 D.
            Distribute randomly.

          - Announce the first policy vote (shuffled order, e.g., start with Proposal 2: tuition). 
              "We are now voting on three policies. First: Proposal 2: Increase tuition by 5% to fund new facilities. Take 1 minute to discuss with your neighbor why you support or oppose based on your brief. Then we will have a quick open comment: anyone want to share one point? (30 seconds) Then vote."

          - After 2 minutes (discussion and comments), hand out the ballot for Proposal 2. Collect and tally on whiteboard.

          - Repeat for the next two proposals in the shuffled order. Each vote cycle: 2 minutes.

          - After the third vote, write the outcomes for all three on the board. Point out: "We have decided to build the library (if P passed) but rejected both funding methods. How does that work?"

          - Note: If the shuffled order was different, adjust the pointing out accordingly.

      Minute 45-60: Phase 3 (Unity Chair)
          - Announce: "We have an incoherent outcome. We need a single platform. We are going to appoint a unity chair to decide between two options: 
                Option 1: Choose a coherent platform that was held by a minority of the room (like Group A, B, or C) and override the majority on at least one issue.
                Option 2: Stick with the incoherent majority outcome.
              The chair must pick one option and state the platform we will now adopt."

          - Ask for a volunteer to be the chair. Give them 1 minute to decide.

          - The chair announces. Then ask the room: "Any dissent?" (Expect some.)

          - Point out the cost of the chair's choice.

      Minute 60-85: Debrief
          - Start with open reflection: "What did we experience today?"
          - Then guide through:
              a. The policy votes: individually consistent, collectively incoherent -> discursive dilemma.
              b. The membership vote: circularity of the demos -> boundary problem.
              c. The unity chair: the cost of coherence vs. majority rule.
          - Name the two concepts and give one-line definitions.
          - Discuss what the activity cannot capture (as above).
          - Conclude.

    Handy reference for the teacher:

      Proposal key:
          P: Build library (Proposal 1)
          Q: Tuition increase (Proposal 2)
          R: Borrowing (Proposal 3)

      Expected outcomes for 18:
          P: 10Y, 8N -> Y
          Q: 8Y (5A+3D), 10N (5B+5C) -> N
          R: 8Y (5B+3D), 10N (5A+5C) -> N

      For 21:
          P: 13Y (7A+6B), 8N (5C+3D) -> Y
          Q: 10Y (7A+3D), 11N (6B+5C) -> N
          R: 9Y (6B+3D), 12N (7A+5C) -> N

    Note: The order of the three proposals does not matter because they are voted separately and the constraint is only revealed afterward.

    This plan should work. Good luck!
answer: |-
  ### Activity Design: "The Will of the Room"  
  **Objective:** Participants experience (1) collective incoherence from individually consistent majority votes on linked issues, and (2) circularity in defining the voting body ("the people").  

  ---

  ### **Materials**  
  - **18 constituency briefs** (index cards, one per participant).  
  - **Ballots:** 4 types (membership + 3 policy issues).  
  - **Whiteboard** for tallying.  
  - **Markers.**  
  - **Timer.**  

  ---

  ### **Constituency Briefs** (For 18 Participants)  
  *Each card assigns a position on three logically linked issues (shuffled order in voting). Logical constraint: If the library is built (P), it must be funded by *either* tuition (Q) *or* borrowing (R)—but not neither.*  
  - **Group A (5 cards):**  
    *"You represent student activists focused on academic resources. Argue: BUILD the library (Yes), FUND it via tuition (Yes), OPPOSE borrowing (No). You believe tuition is fairer than debt."*  
  - **Group B (5 cards):**  
    *"You represent cost-conscious students. Argue: BUILD the library (Yes), OPPOSE tuition hikes (No), FUND it via borrowing (Yes). You worry tuition hurts low-income peers."*  
  - **Group C (4 cards):**  
    *"You represent fiscal conservatives. Argue: CANCEL the library (No), OPPOSE tuition hikes (No), OPPOSE borrowing (No). You think the project is wasteful."*  
  - **Group D (4 cards):**  
    *"You represent students prioritizing other campus needs. Argue: CANCEL the library (No), SUPPORT tuition hikes (Yes) for scholarships, SUPPORT borrowing (Yes) for sports facilities. The library distracts from these."*  

  **Fallbacks for Odd Numbers:**  
  - 17 participants: Reduce Group C to 3.  
  - 19 participants: Add one to Group A.  

  **Expected Tally (18 participants):**  
  - **P (Build library):** 10 Yes (A+B), 8 No (C+D) → **Passes.**  
  - **Q (Raise tuition):** 9 Yes (A+D), 9 No (B+C) → **Fails** (tie broken by chair, but reveal inconsistency later).  
  - **R (Borrow funds):** 9 Yes (B+D), 9 No (A+C) → **Fails** (tie).  
  *Collective outcome:* Build library with no funding → **incoherent.**  

  ---

  ### **Setup**  
  - **Chairs:** Circle (no tables).  
  - **Whiteboard:** Columns for votes (Membership, P, Q, R).  
  - **Ballots:** Pre-sorted into packets.  

  ---

  ### **Phase 1: Membership Vote (Who Are "The People"?) (10 min)**  
  *Goal:* Expose circularity in defining the voting body.  
  1. **Intro (1 min):**  
     *"We are a campus committee deciding whether to expand the student center. But first: Who gets to vote? A group of town residents (non-students) who use our facilities claims a seat. Should they vote with us?"*  
  2. **Vote (4 min):**  
     - Distribute **Membership Ballot (Text):** *"Grant voting rights to town residents? [ ] Yes [ ] No"*  
     - **Tally on whiteboard.** No discussion.  
  3. **Enact Outcome (5 min):**  
     - **If "Yes":** Randomly select 3 participants to become "town residents." They remain seated but are now voters. Adjust briefs: Add 1 to Group A, 1 to Group B, 1 to Group D (maintains paradox).  
     - **If "No":** Proceed with 18.  
     - **Do not resolve tension.** Move on.  

  ---

  ### **Phase 2: Policy Votes (The "Will" Incoherence) (30 min)**  
  *Goal:* Generate collective incoherence from individual consistency.  
  1. **Assign Roles (2 min):**  
     - Shuffle and distribute constituency briefs (index cards).  
     *"These are your mandates. Argue and vote *only* as your brief requires."*  
  2. **Debate and Vote on Policies (24 min total; 8 min per issue):**  
     - **Shuffled Issue Order** (e.g., Q → R → P). For each:  
       - *Announce issue* (e.g., "Vote: Raise tuition by 5%?").  
       - **Brief-led debate (3 min):** *"Argue your position *based on your brief*—keep it short!"*  
       - **Secret ballot (1 min):** Use pre-printed ballots (e.g., *"Raise tuition? [ ] Yes [ ] No"*).  
       - **Immediate tally on whiteboard (1 min).**  
  3. **Reveal Incoherence (4 min):**  
     - Point to tallies: *"We have: Library passes, tuition fails, borrowing fails. How do we build a library with no funding?"*  
     - Let discomfort sit. Do not explain logic.  

  ---

  ### **Phase 3: Unity Chair (Resolving Incoherence) (15 min)**  
  *Goal:* Force choice between coherent minority vs. incoherent majority.  
  1. **Appoint Chair (2 min):**  
     - *"We need one coherent 'will of the room.' Appoint a Unity Chair to decide our final platform."*  
     - Facilitate quick volunteer or nomination.  
  2. **Chair’s Dilemma (10 min):**  
     - Give chair two index cards:  
       - **Card 1 (Minority Platform):** *"Pick one group’s *full* platform (A, B, C, or D). You override the majority on at least one issue."*  
       - **Card 2 (Majority Platform):** *"Stick with the majority vote outcomes (P:Yes, Q:No, R:No). The platform is incoherent."*  
     - *"Choose one card. Announce it and explain briefly."*  
  3. **Costs (3 min):**  
     - After chair’s choice: *"Dissenters, raise hands."*  
     - Note aloud: *"Cost of Card 1: Overruled a majority. Cost of Card 2: Unworkable policy."*  

  ---

  ### **Debrief (25 min)**  
  *Map moments to concepts:*  
  1. **Incoherence Experience (10 min):**  
     - *"When we tallied votes, what happened?"*  
     - Link: *"Individually, you were consistent. Collectively, majority rule created incoherence. This is the **discursive dilemma**. It’s not stupidity or bad faith—it’s math. Majority votes on linked issues can’t guarantee coherence."*  
  2. **Circularity Experience (10 min):**  
     - *"At the start, who decided the voting body?"*  
     - Link: *"The initial ‘us’ decided who ‘the people’ are. But why did *we* get to decide? This is the **boundary problem**: ‘The people’ must be defined *before* they express a will, but that definition can’t be made democratically without circularity."*  
     - *"A populist would reject the boundary problem—they’d say ‘the people’ are obvious. But they’d likely accept the discursive dilemma and blame elites for distorting the ‘true’ will."*  
  3. **Limitations of the Activity (5 min):**  
     - *"This activity can’t reproduce:*  
       - **The charisma of ‘embodiment’:** Populist leaders *feel* like they *are* the people’s will (e.g., "I alone fix it"). *You must verbally contrast our sterile chair with figures like Perón or Trump.*  
       - **Temporal betrayal:** Real populism claims the will is *enduring* and *betrayed* over time. *Add: "Imagine if the chair said, ‘I restore the *real* will you had in 1995!’"*  
       - **Emotional resonance:** Our activity lacks the anger/moral urgency of real populism. *Say: "Real movements tap resentment against ‘corrupt’ institutions."*  

  ---

  ### **Predictable Failures & Fixes**  
  1. **"Someone spots the logic pre-tally!"**  
     - *Fix:* Casually interrupt: *"Hold that thought—let’s vote first."* If revealed, say: *"Note how easy it was to miss until votes were tallied."*  

  2. **"Participants ignore briefs, vote personal views."**  
     - *Fix:* Gently enforce: *"Remember, you’re a delegate—argue your brief."* Pre-brief strict observers to model compliance.  

  3. **"Unity chair dominates/collapses."**  
     - *Fix:* If chair lectures: *"Just pick Card 1 or 2."* If passive: *"Choose now—we need a decision."*  

  4. **"Seating vote feels rigged."**  
     - *Fix:* Acknowledge: *"I picked a plausible group, but any choice would be arbitrary. That’s the point."*  

  5. **"Group drops an item to resolve incoherence."**  
     - *Fix:* Block: *"The library vote is binding—we *must* build it with the funding we have."*  

  6. **"Vote ties (Q/R) and no incoherence."**  
     - *Fix:* Use pre-set tallies as backup: *"In practice, it’s 9–9. But mathematically, it should be 10–8—let’s proceed as if."*  

  7. **"Town residents added, time runs short."**  
     - *Fix:* Skip their debate time. Their votes matter, not their voices.  

  ---

  ### **Instructor Notes**  
  - **Do not:** Say "discursive dilemma," "boundary problem," etc., until debrief.  
  - **Emphasize:** Briefs are fixed mandates—no negotiation.  
  - **Timing is tight:** Use a visible timer. Cut debates ruthlessly.  
  - **End unresolved:** The point is the dilemma, not the solution.  

  This design ensures the group *feels* the incoherence and circularity. The rest is context you supply in speech. Run it cold—they’ll discover the problems.
