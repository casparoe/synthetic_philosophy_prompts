prompt: |-
  I'm in a readin group on epistemic game theory, and one guy keeps saying that rationality is common knowledge — most recently to argue that in the centipede game and the finitely repeated prisoner's dilemma, backward induction is the only defensible prediction and anyone who cooperates is just confused. I don't think that one line can carry all that weight. Act as a philosopher of game theory and formal epistemologist. Before you answer, brainstorm the distinct things the line could mean: common knowledge of what exactly — the payoff structure, each other's rationality, each other's beliefs, or something else? To what depth? With what probability? Among which players? Then lay them out as a menu. For each reading, give the precise thesis, say whether it's trivial, substantive, or false, and say whether it would actually get him his backward-induction conclusion. One more thing: sombody else proposed a case where it's common knowledge that everyone assigns probability .9 to everyone else being rational, and common knowledge of that, and so on — does that count as common knowledge of rationality, and does it change the prediction? Lead with a one-sentence bottom line, then the menu as a table. Max 500 words. No citations or reading lists.
