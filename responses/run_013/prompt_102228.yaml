prompt: |-
  OK, this is a slightly odd request, so bear with me. I'm 68, retired after a long career in industrial chemistry, and for the last three years I've been reading philosophy the way I used to read journal papers — obsessively and without alot of guidance. I've gotten stuck on the coherence arguments for expected utility maximization: the family of results where you lay down a few consistency conditions on someone's preferences (completeness, transitivity, independence or the sure-thing principle, that sort of thing) and out drops the conclusion that anyone who violates them is being irrational, or can be money-pumped, or must in some sense be acting as if they're maximizing expected utility. A friend of mine, a game theorist, thinks the whole thing is airtight and basically settled. I think theres something fishy about it but I can't quite put my finger on what, and we've been talking past each other for months.

  I want you to write the joint statement we should have produced by now — an adversarial collaboration. Two camps: the coherence theorists, who hold that the argument really does establish that rationality requires expected utility maximization, and the skeptics, who hold that it establishes much less than that, or nothing at all. Give me what we actually agree on: about what the representation theorems do and don't show, about the difference between representing a preference ordering and prescribing one, about whether the money pump is a genuine argument or just a restatement of the axioms in dramatic form. Then the disagreements, each one phrased in wording the side in question would sign off on. Then the cruxes — the sub-questions where settling things would actually move one of us.

  A few things I want pinned down specifically, because I suspect they're where the real fight lives: the completeness axiom (is "you must have a preference between any two options" a genuine requirement of rationality, or just an idealization we've smuggled in?); the so-called small-worlds problem (Savage's setup assumes a fixed, known state space — what happens to the argument for agents who don't have one?); and the gap between "you will act as if maximizing EU" and "you ought to." For each crux, give a case or argument that both sides would agree bears on it, and write down in advance what each side predicts about that case.

  Number the agreed claims, then put the disagreements in a table. No reading lists or citations, please — I just want the document itself.
