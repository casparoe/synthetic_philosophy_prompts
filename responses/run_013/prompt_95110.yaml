prompt: |-
  I mod a Discord server — about 9k people, started as a hobby thing for woodworking but it turned into a general hangout with a #politics channel that we gave up trying to kill. The owner, Dana, is the one who actually rules on reports. I've been keeping a running list in my notes of what she takes down and what she leaves up, cause at this point I'm pretty sure I can call her shots. I write software for a living so I'm used to rules that actually resolve cases, and ours don't, which is probably why I care.

  Taken down, poster banned:
  - Someone posted that immigrants from a certain region shouldn't be let in and were replacing people. Gone in like five minutes.
  - Someone posted a long, polite, link-heavy thing arguing that a racial minority is just less intelligent on average. No slurs, no threats, it was an argument. She took it down and said we're not a debating club for that.
  - Someone dug into a member's ethnicity in a thread and started tagging their friends. Gone.

  Left up, even after reports:
  - A rant calling a sitting senator a crook and a traitor. She said he's a public figure, he can take it.
  - A post arguing we should tax billionaires at 90% and ban private jets. Left up.
  - A post calling the mod team a bunch of little tyrants and linking a rival server. Left up, she even replied in the thread.
  - Someone saying our rules are useless because 'no hate speech' doesn't tell you what hate speech is. Left up, lol.

  Our written rules are basically 'be cool, no hate speech, no harassment,' which as that last guy pointed out is not super helpful.

  New one: a member wrote a legitimately careful, well-organized post — no slurs, no insults, no calls to violence, doesn't name any individual — arguing that the country's majority religion is a threat to democracy and that its members shouldn't be allowed to vote or hold public office. It got mass-reported. We've got a few regulars in that group and they're upset.

  Will Dana take it down? What I actually want out of this: what rule do you think she's been running all along, what other rules fit her entire track record just as well, what does each of those predict here, which one do you think it is and why, and which of her past calls is this closest to? And what's the case I should watch for down the road that would definately settle it? Also, does it matter that this is our server and not the government — is the paradox of tolerance thing even the right lens, or is she doing something simpler? And if she leaves it up, is she then stuck leaving up the mirror version aimed at a group with no power at all? That's the part that nags at me.
reasoning: |-
  Okay, let me unpack this user's query. They're a Discord mod dealing with content moderation in a large community that evolved from woodworking to general chat with an active politics channel. The owner, Dana, makes final decisions, and the user has been tracking her rulings to predict outcomes. 

  The user presents a new case: a well-structured post arguing that a majority religion threatens democracy and its members shouldn't vote or hold office. They want to know if Dana will remove it, what implicit rule Dana follows, how this case compares to past decisions, and what test case would clarify Dana's stance. They also raise concerns about consistency with mirror cases targeting powerless groups and question if the "paradox of tolerance" applies here.

  First, I need to analyze Dana's pattern from the examples given. The removed content involves dehumanization (immigrants "replacing" people), pseudoscientific racism, and targeted harassment. Left-up content includes criticism of public figures, policy proposals (taxing billionaires), meta-criticism of mods, and philosophical critiques of rule vagueness. 

  The key distinction seems to be whether speech attacks inherent traits of protected groups versus criticizing powerful entities or ideas. The banned posts all undermine group dignity based on immutable characteristics, while permitted content challenges institutions, individuals with power, or abstract concepts. 

  For the new case: though well-argued, it advocates stripping rights from a religious group. This mirrors the banned "less intelligent" post - both use civil language to argue for systemic exclusion based on group identity. The absence of slurs is irrelevant; the harm lies in advocating disenfranchisement. 

  The paradox of tolerance question is apt but incomplete. Dana's pattern suggests a simpler heuristic: "Does this deny fundamental rights or dignity to people based on who they are?" Server moderation isn't bound by governmental free speech constraints, so she can prioritize community safety over absolutism. 

  For future tests: a hypothetical "civil" post arguing for restricting rights of a historically marginalized group (e.g., racial minorities) would confirm if Dana's standard is group power or universal protection. If she leaves it up, her rule is about power dynamics; if removed, it's about inherent dignity. 

  The mirror case concern is valid. If Dana leaves up the majority-religion post, consistency would require leaving up a similar post targeting a powerless group - which would violate the precedent of removing the "less intelligent" argument. This tension suggests Dana will likely remove the current post to maintain community safety standards.
answer: |-
  Based on Dana's track record and the principles underlying her decisions, here's a breakdown of the likely outcome and the implicit rule she's following:

  1.  **Will Dana take it down? Almost certainly YES.**
      *   **Why:** The post advocates for stripping fundamental democratic rights (voting, holding office) from people solely based on their membership in a religious group. This shares the core characteristic of the *removed* posts: **dehumanization and systemic exclusion based on inherent identity.** It doesn't matter that it's the majority religion; the argument is that *membership in the group itself* makes someone unfit for participation in society. This aligns perfectly with the banned arguments about immigrants "replacing" people and the pseudoscientific racial intelligence claim. The "careful" presentation is irrelevant to this core harm.

  2.  **Dana's Implicit Rule:**
      *   **"No advocating for the systemic exclusion, disenfranchisement, or denial of fundamental humanity/dignity of groups based on inherent characteristics (race, ethnicity, religion, national origin, etc.), regardless of how 'civilly' it's argued."**
      *   **Supporting Evidence:**
          *   *Takedowns:* Immigrant "replacement" (exclusion based on origin), racial intelligence (denial of equal humanity/dignity), ethnicity digging/harassment (targeting based on inherent characteristic).
          *   *Left Up:* Criticizing a powerful public figure (individual action), taxing billionaires (policy targeting wealth/class, not inherent identity), criticizing mods (meta-commentary), criticizing rule vagueness (meta-commentary). None deny fundamental rights or dignity based on inherent group identity.

  3.  **Other Rules That *Almost* Fit (But Don't):**
      *   **"No hate speech (as defined by me)."** While true, it's circular and doesn't *predict* outcomes without knowing her definition. Your analysis *reveals* her definition.
      *   **"No attacks on vulnerable/minority groups."** Fits most takedowns, but fails because she *also* took down the argument targeting a *majority* religion in this new case. Her rule isn't solely about minority status.
      *   **"No pseudoscience or conspiracy theories."** Fits the racial intelligence post and maybe "replacement theory," but doesn't fit the ethnicity digging/harassment takedown or explain why the billionaire tax post stays up (which some might call conspiracy-adjacent).
      *   **"No harassment of individuals."** Fits the ethnicity digging, but doesn't fit the "replacement" or racial intelligence takedowns (which were general statements) or explain the policy/political rant left up.
      *   **"Be cool."** Too vague to predict anything.

  4.  **Closest Past Call:**
      *   The **"racial minority is less intelligent"** post is the **closest parallel**. Both were presented as "rational" arguments lacking overt slurs or violence, but both fundamentally argued that membership in a group based on inherent identity (race/religion) justifies treating them as less than full participants in society (denial of equal intelligence/denial of voting rights). Dana's removal of the racial intelligence argument strongly predicts the removal of this religious disenfranchisement argument.

  5.  **The Definitive Test Case:**
      *   Watch for a **"civil," well-argued post advocating for the systemic exclusion or disenfranchisement of a group *universally recognized as historically marginalized and lacking power* (e.g., arguing a specific racial minority shouldn't vote or hold office, or that LGBTQ+ people shouldn't have adoption rights, presented without slurs or violence).**
      *   **Why it settles it:**
          *   If Dana removes it, it confirms her rule is **universal**: no advocacy for stripping rights based on inherent identity, regardless of the group's current power status.
          *   If Dana *leaves it up*, it reveals her rule is actually about **power dynamics**: only protecting groups *she perceives as vulnerable/minority*, while allowing attacks on groups perceived as powerful (majority religion, billionaires, public figures). This would be inconsistent with removing the majority religion post and represent a significant shift.

  6.  **The Paradox of Tolerance & Simpler Lenses:**
      *   **The paradox is relevant, but not the whole story.** Dana *is* acting to prevent the server from becoming a platform for intolerance that could destroy the community's ability to function. However, her rule is simpler and more operational than pure philosophical tolerance.
      *   **She's doing something simpler:** Dana's rule is fundamentally about **community safety and dignity.** She draws a line at speech that argues *people are inherently inferior or undeserving of fundamental rights because of who they are.* This creates a baseline expectation of mutual respect necessary for a diverse "general hangout" server to exist without constant conflict and harm. It's less about abstract tolerance and more about "we don't platform genocidal or apartheid ideologies here, even in polite wrapping." Her leaving up criticism of power (public figures, billionaires, mods) shows she tolerates robust debate *about actions, policies, and ideas*, but not attacks on the fundamental personhood or rights of groups based on identity.

  7.  **The Mirror Version & Consistency:**
      *   **This is the critical point.** If Dana *left up* the post about the majority religion, she *would* be logically compelled to leave up a "mirror version" targeting a powerless minority group (e.g., "Muslims/Jews/Black people shouldn't vote"), presented with the same "careful" language. **This is likely why she will take it down.** Leaving it up creates an intolerable double standard and opens the door to horrific content targeting vulnerable groups under the guise of "civility."
      *   **Dana's implicit rule avoids this trap.** By banning advocacy for disenfranchisement/exclusion *based on inherent identity universally*, she maintains consistency. The *impact* is different (attacking the powerful vs. attacking the vulnerable), but the *principle* (no denying fundamental rights based on who you are) is the same. Her rule protects the vulnerable *because* it protects everyone from identity-based exclusion, regardless of current power status.

  **Conclusion:** Dana will almost certainly remove the post about the majority religion. Her consistent, underlying rule prohibits advocating for the systemic exclusion or denial of fundamental rights/dignity to groups based on inherent characteristics like religion, regardless of presentation or the group's current power status. This rule avoids the inconsistency trap of the "mirror version" and prioritizes baseline community safety and dignity over providing a platform for exclusionary ideologies, however politely framed. The closest parallel is the removed "racial intelligence" post. The definitive test case is a "civil" argument for disenfranchising a historically marginalized group – its removal would confirm the universal application of her rule.
