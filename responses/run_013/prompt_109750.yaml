  ### Widget Wars: Path Dependence Simulation  
  **Objective**: Create an interactive experience that reveals contingency, inefficiency, entrenchment, and token/type distinctions without pre-briefing.  

  ---

  #### **Materials**  
  - 25 identical envelopes (one per participant)  
  - Each envelope contains:  
    - 2 cards: "WIDGET A" (blue) and "WIDGET B" (yellow)  
    - 1 token (coin, poker chip, or button)  
  - Whiteboard + markers  
  - Prize: Small trophy or "Innovator" badge (for pride-based stakes)  

  ---

  #### **Rules & Setup**  
  1. **Assign Roles**:  
     - Participants are "consumers" in a fictional tech market.  
     - Two volunteers (secretly planted) are "Tech Moguls" (for subtle influence).  

  2. **Game Structure**:  
     - 5 rounds (each 5 minutes).  
     - Each round, consumers **publicly commit** to one widget (A or B) by placing their token on the corresponding card.  
     - **Network Effects**:  
       - Your payoff = *Number of consumers using your widget* × 10 points.  
       - *Exception*: Widget A has a hidden "superior design" (+15 bonus if chosen alone in Round 1).  

  3. **Payoffs & "Pride" Stakes**:  
     - Points tracked publicly on a whiteboard.  
     - Top 3 scorers win applause + "Market Leader" recognition.  
     - **Secret Rule**: Tech Moguls (planted volunteers) must choose Widget B in Round 1 (to trigger bias).  

  ---

  #### **Timeline (75 Minutes Total)**  
  | **Time** | **Phase**               | **Action**                                                                 |  
  |----------|-------------------------|---------------------------------------------------------------------------|  
  | 0-5 min  | **Intro**               | Explain rules: *"Maximize points by choosing popular widgets. No further hints."* |  
  | 5-15 min | **Round 1**             | Consumers choose A or B. Tech Moguls sway group toward B. Record choices. |  
  | 15-20 min| **Score Round 1**       | Calculate points. *Hide Widget A’s bonus (unclaimed if not chosen alone).* |  
  | 20-30 min| **Round 2**             | Free choice. Network effects entrench (B likely dominates).               |  
  | 30-35 min| **Score Round 2**       | Update points.                                                             |  
  | 35-40 min| **🚨 REWIND 🚨**        | **Reset game**: "Erase scores. Start over. Round 1 choices again—but no Moguls!" |  
  | 40-50 min| **Rewound Round 1**     | Consumers re-choose (no forced bias). Widget A often wins organically.    |  
  | 50-55 min| **Score Rewound R1**    | Reveal Widget A’s bonus: *"If chosen alone in Round 1, +15 points."*      |  
  | 55-65 min| **Rewound Round 2**     | Final choices. Likely A dominance.                                        |  
  | 65-70 min| **Final Scores**        | Compare outcomes + payoffs. Top 3 "win."                                  |  
  | 70-75 min| **Debrief**             | Guide discussion to map insights (below).                                 |  

  ---

  #### **Predictable Chaos & Limitations**  
  **What Goes Sideways**:  
  - **Rebels**: 1–2 participants may choose A early (even with Moguls). Use this! *Debrief*: "Why did A almost win despite bias?" (contingency).  
  - **Groupthink**: If B wins both runs, highlight: "Did we *need* Moguls to get here?" (entrenchment vs. inefficiency).  
  - **Confusion**: Some may not grasp scoring. Keep calculations public/simple.  

  **What the Game Can’t Replicate**:  
  - **Real-world complexity**: In life, "accidents" (like Moguls) are invisible, and payoffs are ambiguous. The game makes bias explicit—counterfactuals are clearer.  
  - **Long-term entrenchment**: Switching costs (e.g., quitting B after Round 2) aren’t modeled. *Acknowledge*: "We skipped the pain of real-world transitions."  

  ---

  #### **Debrief: Mapping the Experience to Your Goals**  
  1. **Three Path-Dependence Claims** (Reveal via Q&A):  
     - **Contingency**: *"Round 1 Moguls made B win. Was that accident necessary?"* → Yes (rewind changed outcomes).  
     - **Inefficiency**: *"Why did B win first run despite A’s bonus?"* → Network effects locked in a worse option.  
     - **Entrenchment**: *"Could we switch to A after Round 2?"* → Possible but costly (points reset on rewind; real life lacks resets).  

  2. **Token vs. Type**:  
     - *"Did a single winner always emerge?"* → **Type YES** (network effects demand consolidation).  
     - *"Did the same widget always win?"* → **Token NO** (contingent on Round 1).  
     - *"When we ask ‘was it inevitable?’—are we talking about monopoly (type) or the winner (token)?"*  

  3. **The Rewind Trap**:  
     - *"After the rewind, how sure were you that A would win? Could B have won again?"* → Highlight uncertainty.  
     - *"We saw two paths—but real history gives us only one. How much can we *really* know?"*  

  ---

  #### **Why This Works**  
  - **Tactile Choices**: Physical tokens/public commits make dependencies visceral.  
  - **Pride Stakes**: Points → rivalry; "winning" fuels engagement.  
  - **Rewind Surprise**: Resets create "aha!" moments for contingency.  
  - **Silent Concepts**: Never say "contingency" or "token" until debrief. Let dissonance build.  

  **Final Tip**: Run a trial with friends to refine timing. Embrace chaos—it mirrors real path dependence!
