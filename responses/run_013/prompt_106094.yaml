prompt: |-
  A colleague of mine has a manuscript in the works arguing that moral norms are just conventions in Lewis's sense -- equilibria that got locked in because they solved some recurring coordination problem -- and that the felt non-arbitrariness of morality is a byproduct of how the equilibrium got selected, nothing more. She's the guest on our department podcast in a few weeks and I'm doing the interview. I want to actually press her, not give her a runway to restate the thesis, so draft me eight to ten questions.

  Stuff I definitely want hit. First, the obvious one: Lewis-style conventions need a real coordination problem with more than one equilibrium plus a conditional preference to conform once others do, and I want to know why "don't kill people who haven't wronged you" is supposed to be that rather than just the one salient answer sitting there by itself -- and a follow-up for when she says the multiplicity is in the details (who counts as having wronged you, how much compensation, etc.) rather than in the headline norm. Second, the reason-vs-prediction gap: does the convention give her an actual reason to comply, or only a prediction that she'll be left out or punished if she doesn't? Anticipate her saying the two come apart and press on what's left of the normativity. Third, her most likely clever move -- that enforcement is itself a second-order convention, so she never needs an external enforcer -- and what that move costs her, because I suspect it either pushes the bump up a level or quietly smuggles in a non-conventional reason to keep the higher-order convention going. Fourth, the arbitrariness worry: conventions are things we could have settled otherwise, and moral norms don't present themselves that way, so is the phenomenology just a bug in our self-reporting? Fifth, the evolution story, since "it evolved" can mean weak selection on a population of imitators, payoff-based reinforcement learning, cultural group selection, or a few other things, and I want her to commit to which mechanism she's actually running and to say whether the arbitrariness survives it.

  Then a couple of sharp ones to close. One on whether her view is really just the old error-theory line -- moral judgements are systematically false because there's nothing there for them to be true of -- dressed up in coordination language, and if not, what the difference is supposed to be. And one on defeat: what would the world have to look like for norms not to be conventions? What's the observation or the argument that would actually move her, as opposed to the standard hand-waving that some norm or other resists the analysis.

  For every question give me a follow-up keyed to the answer she's most likely to give, and flag anywhere I'm about to walk straight into a reply she's clearly got loaded and ready. Keep it tight -- I dont want to be reading off a list of fifteen questions on air.
reasoning: |-
  Okay, the user wants me to draft interview questions for a podcast where they'll be interviewing a colleague who argues that moral norms are just conventions in David Lewis's sense. They want 8-10 pressing questions that challenge her thesis effectively.

  First, I need to understand the core of her argument. She's saying moral norms are equilibria from solving coordination problems, and their feeling of non-arbitrariness is just a byproduct. The user listed several key areas to cover: the coordination problem requirement, reason vs prediction gap, enforcement as convention, arbitrariness, evolution mechanisms, error theory, and defeat conditions.

  For the coordination problem angle, I should question why norms like "don't kill" fit Lewis's definition which requires multiple possible equilibria. She might argue that details like definitions of "wronged" provide the multiplicity, but that seems like moving the goalposts. My follow-up should challenge whether this makes the core norm conventional or just its applications.

  On normativity, there's a crucial distinction between having a reason to comply versus merely predicting punishment. If she collapses this, she loses moral force. Her likely move is to frame enforcement as a second-order convention, but this might just push the problem up a level without solving why we sustain higher-order norms.

  The phenomenology point is strong - moral norms feel necessary, not arbitrary like conventions. If she dismisses this as illusion, that's a cost to her view. The evolution mechanism matters too - cultural group selection might imply less arbitrariness than individual learning.

  I'll structure this as 8-10 main questions with anticipated replies and sharp follow-ups. Need to keep it tight for podcast flow. The closing questions should force her to confront if this is just error theory in disguise, and what evidence would falsify her view.

  For the coordination foundation, I'll ask why "don't kill" isn't uniquely optimal rather than conventional. When she points to granular details, I'll press whether that concedes the core norm isn't conventional. 

  On normativity, I'll directly challenge the reason/prediction gap. If she invokes second-order enforcement conventions, I'll ask why those don't require external reasons to maintain them.

  The evolution question must pin her to a specific mechanism since "it evolved" is vague. Cultural group selection might suggest norms are functional adaptations, undermining arbitrariness.

  Closing with the error theory comparison is vital - if moral claims are about mind-independent truths but only conventions exist, isn't this just error theory? And for defeasibility, if she can't name what would change her mind, that's dogmatism.

  Throughout, I'll flag where she has prepared answers (like the second-order convention move) so the interviewer can brace for counter-rebuttals. The questions should be concise but layered to prevent easy escapes.
answer: |-
  Here are eight tightly-focused questions with anticipated responses and sharp follow-ups, designed to press the core challenges while avoiding excessive length:

  1.  **Core Coordination Challenge:**  
      "Lewisian conventions require a *genuine coordination problem* with *multiple stable equilibria* and a *conditional preference* to conform. Why is a norm like 'Don’t kill innocents' best modeled this way? Isn't it the uniquely salient solution to a problem of survival, not one arbitrary option among many?"  
      *Anticipated Reply:* "Multiplicity exists in the *details*: defining 'innocent,' 'justification,' proportionality, etc."  
      **Follow-Up:** "But doesn't that concede the *core prohibition* itself isn't conventional? If the headline norm ('don't kill X') is uniquely optimal for survival/cooperation, doesn't that undermine its status *as a convention* in Lewis's specific sense, making the 'conventional' aspects merely peripheral implementation details?" *(Flags: She's ready for multiplicity-in-details. Press if core norm is non-arbitrary)*

  2.  **The Normativity Gap (Reason vs. Prediction):**  
      "If morality is just a convention, what does it provide *besides* the prediction that non-compliance will likely lead to sanction or exclusion? Where does the distinctive *reason-giving force* of morality – the 'I *should* do this' even if I could get away with it – come from on your view?"  
      *Anticipated Reply:* "The 'should' *is* the conditional preference: given others conform, I prefer to conform to avoid costs/achieve coordination benefits."  
      **Follow-Up:** "But that reduces 'I morally should not murder' to 'Murder is currently disadvantageous for me.' Isn't that a radical revision of moral phenomenology? Does your view entail that a clever sociopath who can evade sanctions has *no moral reason whatsoever* not to murder?" *(Flags: She'll equate reason with prudence. Press the counterfactual where sanctions fail)*

  3.  **The Second-Order Enforcement Trap:**  
      "You’ll likely argue that enforcement (blame, punishment) is itself a second-order convention. But doesn’t this just push the normativity problem up a level? What provides the *reason* for individuals to sustain the costly second-order convention of enforcing norms, rather than free-riding on others' enforcement efforts?"  
      *Anticipated Reply:* "The stability of the *primary* convention depends on enforcement. Sustaining enforcement is itself an equilibrium because defection (not enforcing) undermines the benefits of the whole system."  
      **Follow-Up:** "So the reason to enforce is ultimately instrumental/prudential – to maintain a beneficial system? Doesn’t this mean the entire normative structure ultimately rests on self-interest or perceived systemic benefits, *not* on genuinely moral reasons? Have you smuggled in a non-conventional foundation (e.g., rational self-interest) to prop up the conventions?" *(Flags: She's primed for this move. Press the foundational reliance on non-moral reasons)*

  4.  **Phenomenology of Non-Arbitrariness:**  
      "Moral norms *feel* necessary and non-arbitrary ('killing innocents is *just wrong*'), unlike paradigmatic conventions (driving on left/right). How does your view account for this stark phenomenological difference? Is it simply an illusion generated by the equilibrium’s stability?"  
      *Anticipated Reply:* "Yes, the feeling of objectivity is an adaptive illusion – a byproduct of the equilibrium's deep entrenchment and the emotional salience attached to norm enforcement."  
      **Follow-Up:** "Doesn't this make moral experience systematically misleading? And if the phenomenology is *so* powerful and persistent ('bug' or not), doesn’t that constitute significant evidence *against* your view that it's *merely* conventional, suggesting instead it tracks something more robust?" *(Flags: She'll call it illusion. Press evidentiary weight of phenomenology)*

  5.  **Specifying the Evolutionary Mechanism:**  
      "You invoke evolution/cultural selection. But 'it evolved' is ambiguous. Is the mechanism weak selection among individual imitators, payoff-based reinforcement learning, cultural group selection, gene-culture coevolution? Be specific: which mechanism do you argue locks in moral norms as conventions, and *why that one*?"  
      *Anticipated Reply:* "Likely a combination, but cultural group selection is key for explaining altruistic norms."  
      **Follow-Up:** "If group selection favors norms enhancing group survival/cohesion, doesn't this imply norms are *functional adaptations*, not *arbitrary* conventions? Doesn't this undercut the arbitrariness claim, suggesting many norms are uniquely or strongly selected *for* their benefits?" *(Flags: She may default to group selection. Press functionalism vs. arbitrariness)*

  6.  **Arbitrariness After Selection:**  
      "Following up: Even if selected via group competition, couldn't functionally *equivalent* but substantively *different* norms (e.g., different kinship obligations, restitution rules) have stabilized in different groups? Does your chosen mechanism preserve the crucial Lewisian element of *arbitrariness* – that functionally adequate but *different* norms were possible?"  
      *Anticipated Reply:* "Absolutely, historical contingency plays a role. Different groups have different specific norms serving similar functions."  
      **Follow-Up:** "But for *core* norms like prohibitions on murder or promise-keeping – are there plausible, historically attested examples of stable human societies with genuinely *different* but functionally equivalent core norms (e.g., where killing non-kin without provocation was conventionally permissible)? Or does the observed cross-cultural consistency suggest non-arbitrary constraints?" *(Flags: She'll cite variation. Press on core norms and limits of variation)*

  7.  **Error Theory in Disguise?**  
      "Your view sounds strikingly like Mackie’s Error Theory: moral judgments purport to refer to objective, categorical reasons, but since only conventions exist, these judgments are systematically false. Is your view just Error Theory dressed in game-theoretic clothing? If not, what *truth-makers* exist for moral claims on your account?"  
      *Anticipated Reply:* "No! Moral claims can be true *relative to the convention*: 'Killing is wrong' is true iff it violates the established equilibrium in that society."  
      **Follow-Up:** "But doesn’t this collapse into relativism? And more crucially, doesn’t this *still* make the *objectivist phenomenology* and *categorical feel* of morality erroneous? People don’t *experience* moral demands as 'true relative to our local convention.' Isn't the error about the *nature* of the normativity?" *(Flags: She'll claim relativist truth. Press mismatch between claims and proposed truth-makers)*

  8.  **Defeasibility - What Would Change Your Mind?**  
      "Finally, to test the robustness: What observable evidence or philosophical argument could, in principle, demonstrate that a specific moral norm is *not* merely a Lewisian convention? What would the world, or our moral psychology, have to look like to falsify your thesis for a given norm?"  
      *Anticipated Reply:* "Evidence of a norm arising *without* a coordination problem, or being universally adhered to *without* any possibility of sanction or social conditioning, or perhaps a norm demanding extreme individual sacrifice with *no* coordination benefit."  
      **Follow-Up:** "But couldn't you *always* posit an undiscovered coordination problem or hidden enforcement mechanism? If your framework can flexibly incorporate *any* observed norm as 'conventional' by positing *ad hoc* coordination problems or enforcement structures, doesn't that risk making it unfalsifiable?" *(Flags: She may struggle or offer weak criteria. Press falsifiability/ad hoc-ness)*

  **Execution Tips:**

  *   **Flow:** Don't rigidly stick to order. Use her answers to transition naturally (e.g., her reply on phenomenology leads into Error Theory; her evolution answer leads into arbitrariness).
  *   **Listen & Adapt:** These follow-ups are for *likely* replies. If she surprises you, pivot based on the core challenges (Coordination? Normativity? Arbitrariness?).
  *   **Flagged Traps:** Be especially prepared when she uses the "details," "second-order convention," or "relative truth" moves. Have your counter-punch (the follow-up) ready.
  *   **Tightness:** Phrase concisely. You have ~10 questions including follow-ups implied within the flow. Focus on the *thrust* of each challenge.
  *   **Closing:** End on #8 (Defeasibility). It's sharp and forces her to confront the empirical stakes of her thesis.
