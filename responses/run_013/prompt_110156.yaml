prompt: |-
  I'm a novelist, about three years into a book whose main character inspects welds in a shipyard, and I've written a short craft essay that turned into something I didn't plan. I'd like you to tear it apart for me.

  The setup, in case it matters: Nell runs an ultrasonic probe along a hull seam and knows, before the readout confirms anything, that there's a hairline crack hiding under the paint. I've asked her a hundred times how she knows and she can never tell me. She says the sound goes flat, or the feel goes greasy. Neither of those is an explanation. Hand me the same probe and I feel nothing but my own pulse.

  Here's the draft. Its rough, the middle is a mess, and I already know the ending is too tidy.

  ---

  THE RESIDUE (draft)

  Everyone reaches for the same comparison here: knowing how versus knowing that. Ryle's old point, which I will paraphrase badly: if doing a thing well required first knowing a rule for doing it, then applying the rule would itself be a thing you'd have to know how to do, and you would never get started. The rule can't bootstrap the act. Nell has no rule. That's the whole appeal of the distinction for a novelist — the character who can do the thing and can't say the thing is a gift, because her silence looks like proof.

  But I don't buy that the inarticulacy is the point. Plenty of things I know I can't say either, and they're still facts.

  So here's what I actually think, and this is the part I want you to attack. Knowing that is always about something already settled. The fact sits still while you circle it. Knowing how is never about a settled thing; its whole shape points at a future that hasn't happened yet. Nell can't tell you how she does it, but she can tell you with total confidence what she'd do if the reading jumped. I don't think that would is a proposition she's consulting. It's the shape of her next move. So: know-how is the part of knowledge that has a future tense. What I call the residue is just this forward-leaning part, the bit that can't be handed over in a sentence, because a sentence is a thing that stops and the skill doesn't stop, it keeps going.

  Which brings me to the instructor problem, my best shot at a test case. Nell is a terrible explainer and a brilliant teacher. She can watch an apprentice's hand come down wrong and fix it — a word, a nudge, two inches of wrist — and she never states a rule, because she doesn't have one. If knowing how were really knowing that under some special practical wrapping, then the correction would have to be a proposition she's passing across. It doesn't feel like that. It feels like she's steering the kid's trajectory rather than describing it. Teaching a skill might not be transfer of facts at all. It might be transfer of the residue.

  Two things I can't patch. First, the future-tense thing leaks: I know that the bus will be late tomorrow, and that's future-directed too, so tense alone won't seperate the two kinds. Second, maybe I'm just redescribing a disposition — saying she's disposed to do X, with more adjectives and a shipyard. If that's all I've got, tell me, and tell me what I'd have to add to make it more than that.

  ---

  What I want from you:

  1. Is the future-tense thesis a distinct claim, or a metaphor standing in for something I haven't said? If its distinct, give me the cleanest statement of it, and say whether it survives my own leak (the bus case).

  2. The instructor problem. Does it do any work, or does it only show that Nell is inarticulate? And give me the strongest reply from the person who thinks knowing how just is knowing that, only with a special practical wrapper on the proposition — their best version, not a straw man. If their reply wins, say so.

  3. Whats the strongest objection to the whole essay that I haven't mentioned? The one that would actually worry you, not a list.

  4. Tell me honestly whether this is a known argument I've reinvented, and if so, which one, in one sentence. But do not send me a reading list or citations. I have a book to finish and I will not read them.

  5. Which 150-200 words would you cut, and is the shipyard doing any work or is it set dressing I'm attached to?

  6. Anywhere I've said something that's just false, as opposed to arguable? I'd rather know.

  Be blunt. I'd rather find out from you than from a review.
reasoning: |-
  Okay, let me tackle this novelist’s request. They’ve shared a craft essay about their character Nell, a shipyard weld inspector with uncanny intuition, and want me to brutally critique it. The core idea is that "knowing how" differs from "knowing that" by being future-oriented—what they call "the residue." 

  First, I need to unpack their thesis. They argue Nell’s skill isn’t inarticulable knowledge but action-oriented know-how—a "forward-leaning" thing tied to future actions. But they’re worried about holes: the "bus will be late" counterexample and whether they’re just dressing up "dispositions." 

  For question 1, the future-tense claim: It’s distinct but flawed. The bus case sinks it because factual predictions also point forward. The uniqueness isn’t tense but *agency*—Nell’s knowledge directly shapes her next move. I’ll sharpen that. 

  Question 2: The instructor example is golden. It shows teaching as trajectory-steering, not fact-transfer. But the propositionalist could argue Nell *does* convey micro-rules ("adjust wrist 2 inches")—she’s just bad at articulating macro-rules. Strong counter, but not fatal if we emphasize real-time correction as embodied guidance. 

  Question 3: Biggest unspoken objection? That "residue" is vague. Calling it "embodied anticipation" might help, but it risks becoming mystical hand-waving. Needs grounding. 

  Question 4: It echoes Ryle and Polanyi’s "tacit knowledge," but the future-angle is fresh. No citations—promise kept. 

  Question 5: Cut the Ryle rehash (it’s clunky) and the self-doubt bits ("plenty of things I can’t say"). Shipyard stays—it’s the essay’s spine, showing grit vs. theory. 

  Question 6: The "sentence stops, skill doesn’t" line is false. Language *can* capture process (e.g., recipes). Admit it’s hyperbolic. 

  Overall, the essay’s muscles are Nell’s teaching and the residue idea—hone those. Kill the bus distraction. And for god’s sake, keep the shipyard grime; it’s where theory meets rivets.
answer: |-
  Here’s your dismantling. Blunt, structural, and zeroing in on your requests:

  ---

  **1. Future-Tense Thesis:**  
  It’s a *distinct claim* but collapses under its own logic. Clean version: *Know-how is defined by its orientation toward future action; it’s knowledge that inherently points to what will be done, not what is true.*  
  **Does it survive the bus case? No.** "The bus will be late" is future-directed propositional knowledge ("knowing that"). Your thesis conflates *temporal direction* with *practical agency*. The fix: **Emphasize *embodied anticipation*.** Nell’s knowledge isn’t just *about* the future—it’s *in her hands*, ready to enact the next move. The bus is prediction; Nell’s probe is prehension.  

  **2. Instructor Problem:**  
  **It does crucial work**—it shows teaching as *kinetic alignment*, not fact-dumping. The strongest opposition (non-strawman): *"Nell’s 'nudge' transmits micro-propositions ('tilt wrist 15°', 'ease pressure here'). Her inarticulacy at the macro level doesn’t negate that know-how decomposes into tacit 'that'-knowledge. Teaching *is* rule-transfer; she just bypasses language for demonstrative propositions."*  
  **Does this win? Not quite.** Their rebuttal assumes all physical guidance is covert propositioning. But Nell’s real-time corrections feel like *recalibrating a system* (the apprentice’s body), not inserting data. If you stress that her adjustments *defy verbal decomposition* (e.g., she senses "wrongness" holistically), your residue holds.  

  **3. Strongest Unmentioned Objection:**  
  **You’ve made "residue" a black box.** If it’s not dispositional, not propositional, and not mystical intuition—*what materially is it?* Without a positive account (e.g., neural patterns, embodied cognition), "residue" risks being an empty metaphor. This could unravel your whole argument.  

  **4. Reinvented Argument?**  
  **Yes: Gilbert Ryle’s anti-intellectualist "knowing-how" vs. "knowing-that" (1949), fused with Michael Polanyi’s "tacit knowledge" (1966).** Your "forward-leaning" spin is novel, but the foundation is theirs.  

  **5. Cuts & Shipyard:**  
  **Cut 160 words:**  
  - *First 4 sentences* (Ryle recap is clunky; start at "Nell has no rule").  
  - *"Plenty of things... still facts."* (Redundant; distracts from Nell).  
  - *"Two things I can’t patch..." to "...make it more than that."* (Self-doubt weakens the climax; fold leaks into the main argument).  
  **Shipyard’s Role:** **Essential, not dressing.** The grit, noise, and physicality ground your theory. Nell’s skill *is* the shipyard. Without it, this is abstract philosophy.  

  **6. False Statements:**  
  **One:** *"A sentence is a thing that stops and the skill doesn’t stop."* **False.** Sentences *can* describe processes dynamically (e.g., "Rotate the probe clockwise while maintaining downward pressure"). The limitation isn’t language—it’s *Nell’s access* to her own expertise. Admit this.  

  ---

  **Brutal Summary:**  
  Your core insight (knowledge as *forward-thrusting skill*) is compelling, but the bus leak and residue’s vagueness are critical flaws. The instructor example is your strongest weapon—**lean into teaching as "trajectory-steering."** Cut apologetics, keep the shipyard’s grease, and ditch the future-tense framing for **"embodied anticipation."** You’re 90% to an original theory; just define "residue" without mysticism (*call it "embodied predictive calibration" if you must*). Now go finish the damn book.
