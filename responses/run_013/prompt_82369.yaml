prompt: |-
  Next month I've got the rule-following slot in a reading group that's mostly ML and NLP people -- two engineers, a linguist, a psychologist -- and they've all read the plus/quus bit already, which is a problem, because for them it obviously maps onto "is the model just curve-fitting or does it actually mean something", and they'll spend the whole hour trying to turn it into a debate about machines. Seventy minutes, whiteboard, no handouts.

  What I want is the lesson plan, not the explanation. Start with the order of ideas: what has to be on the board before the paradox can land at all -- I think they have to feel the gap between "the rule I meant" and "the rule I could give an account of" before anything else will work, but tell me if that's the wrong first move or if something has to come before it. Then where the sceptical challenge goes, where Kripke's sceptical solution goes, and how to stop them hearing that solution as either "so meaning is whatever the community says" or "so there's no meaning at all" -- both of those will get said out loud by minute ten, I'd bet. And where does the Kripkenstein question go, i.e. how much of this is Kripke and how much is actually Wittgenstein? I want to park it at the end, but I don't know whether parking it leaves the middle hanging.

  The carrying example is what I'm really stuck on. I don't want to run quus again. I was going to use the undetected-bug case instead: a function that passes every test it's ever been run against, and the question of what makes it true that the programmer meant the correct one rather than the one that agrees with all the tests. Does that carry the whole thing, or does it sneak in exactly the assumption I'm trying to blow up -- that meaning is a hidden mechanism sitting behind the behaviour? If it backfires, tell me what should carry it instead, and what that substitute has to have and has to lack (finite past use? a divergence that never shows up in any response anyone could give? something they already think they understand?).

  Then the misconceptions: the ones this particular audience will actually form, in the order they'll form them, with the point in the sequence where each needs heading off. I'm expecting it's just Hume on induction, it's just vagueness, it's the private language argument, it proves machines can't mean anything but I obviously can, and so meaning is just convention -- and I'd definately like to know which of those I should let them sit in for ten minutes because it's productive, versus which one wrecks the session if it goes unchallenged. Also the self-undermining worry: doesn't the paradox, if it works, eat the sceptic's own statement too? I don't know whether to raise that myself or wait for the linguist to do it.

  And what should I openly refuse to do at this level, and what's the one question to put to them at the end that'll show me they've got the shape of the problem rather than the answer they memorised.
reasoning: |-
  Okay, the user is preparing for a reading group session on Kripke's Wittgenstein, specifically the rule-following paradox. The group consists of ML/NLP people—engineers, a linguist, a psychologist—who've already encountered the plus/quus example and tend to map it to the "curve-fitting vs. meaning" debate in AI. The user wants a lesson plan to avoid derailment into machine debates, focusing on pedagogy rather than content explanation.  

  First, their core constraints: 70 minutes, whiteboard-only, no handouts. Key goals include:  
  - Making the group *feel* the gap between intended rule and justifiable rule.  
  - Avoiding misconceptions like "meaning is community consensus" or "meaning doesn't exist."  
  - Replacing plus/quus with an undetected-bug analogy in programming.  
  - Parking the Kripke-vs-Wittgenstein question without undermining the session.  
  - Preempting common misinterpretations (Hume, vagueness, private language, etc.).  

  Their hidden worry: The undetected-bug example might accidentally reinforce the "meaning as hidden mechanism" view they're trying to challenge. They're also concerned about the paradox self-undermining (if no meaning exists, how can the skeptic state the paradox?).  

  For the lesson flow:  
  1. **Setup**: Need to establish the gap upfront. Start with a simple rule (like "+"), show how past use underdetermines future application, then pivot to the bug analogy.  
  2. **Skeptical Challenge**: Frame it as "What *facts* fix meaning?"—forcing them to confront that neither internal states nor dispositions fully answer it.  
  3. **Skeptical Solution**: Emphasize it's *not* "community consensus" but a shift to assertability conditions (when we *take* each other as following rules).  
  4. **Kripke-vs-Wittgenstein**: Park it late, but hint Kripke might misrepresent Wittgenstein to avoid mid-session confusion.  
  5. **Bug Analogy**: Use it, but stress it's a *diagnostic tool*—it exposes the problem but isn't the solution. Warn against misreading it as "meaning = hidden code."  

  Critical misconceptions to preempt:  
  - "It's just induction" (Hume): Differentiate—Hume is about *prediction*, this is about *correctness*.  
  - "It's vagueness": Rule-following applies even to precise terms.  
  - "Private language": Briefly note it's adjacent but distinct; the paradox is deeper.  
  - Self-undermining: If raised, argue the skeptic uses meaning *without claiming metaphysical grounding*.  

  End with a question forcing them to sit with the paradox's shape: "If you *weren't* allowed to say 'meaning is in the mind' or 'meaning is social agreement,' how would you explain what makes someone mean addition by '+'?"  

  Key refusals: No AI debates, no metaphysics rabbit holes. The bug analogy stays as a bridge to their domain but must be framed carefully.
answer: |-
  Here's a lesson plan designed for your constraints, goals, and audience. It prioritizes sequencing, misconception management, and forcing engagement with the paradox itself—not machines. The "undetected bug" example works if framed carefully.

  **Core Goal:** Make them feel the *gap* between "what I meant" and "what can be justified by past use + dispositions." The paradox should land as a crisis about *justification*, not skepticism about reality.

  **Time Allocation:**  
  - Setup & Gap Feeling (20 mins)  
  - Skeptical Challenge (15 mins)  
  - Skeptical Solution (20 mins)  
  - Kripke vs. Wittgenstein & Wrap-up (15 mins)  

  ---

  ### **1. Setup: Feeling the Gap (20 mins)**  
  *(Board: "Rule-Following Paradox", "Kripke's Wittgenstein", "The Gap")*  

  - **Start with a Simple Rule (Not Math):**  
    - "I say 'Add 2' to a sequence starting at 0. What comes next?"  
    - Audience says 2,4,6... Write it.  
    - "But at step 1,000, I write 1,000 * 2 = **2,000**. You're shocked. I say: 'Add 2' meant *double* after 1,000. My past behavior (2,4,6...) is consistent with both rules. How do you prove I’m wrong?"  
    - *Why this?* Non-math, finite past, relatable. Forces them to see justification relies on *assumptions* about "sameness."  

  - **Introduce the "Undetected Bug" Analogy (Key Move):**  
    - "A programmer tests `add(a, b)` for all inputs ≤ 1,000,000. It passes. Later, for `a=1e9, b=1e9`, it returns `2e9 + 1` (off-by-one error). The programmer insists: 'I *meant* correct addition! The bug wasn’t in my mind!'"  
    - **Crucial Framing:** "This isn't about hidden mechanisms! The question is: What *fact about the past* makes it true that the programmer meant *correct addition*, not the function that matches all tests *so far*? The code itself? Their mental state? Both are 'fixed' in the past but underdetermine the future."  
    - *Why it works:* Uses their domain, avoids "+". Preempts "hidden mechanism" by stressing: *Even if we grant mental states/code, the gap remains.*  

  - **Define the Gap:**  
    - On board:  
      ```  
      What I MEANT (e.g., add)  
      vs.  
      What can be JUSTIFIED by:  
        - My past behavior (inputs/outputs)  
        - My dispositions (what I *would* have done)  
        - My internal states (mind/code)  
      ```  
    - "The paradox: Nothing in the past *necessitates* one rule over deviant alternatives. Meaning feels determinate, but justification runs out."  

  ---

  ### **2. The Skeptical Challenge (15 mins)**  
  *(Board: "The Skeptic's Challenge: What *FACT* fixes meaning?")*  

  - **State the Challenge:**  
    - "The skeptic says: Show me a *fact* that constitutes your meaning addition, not quaddition (or doubling after 1e9). Not what you *did*, but what you *meant*."  
    - List candidate facts on board, demolish each:  
      - *Past Behavior:* Consistent with infinite deviant rules → **No**  
      - *Dispositions:* "I *would* have said 125 for 68+57" → But dispositions can be faulty (I misadd), and they’re just more behavior → **No**  
      - *Mental States/Code:* The undetected bug! Mental state/code is just another "past fact" that underdetermines future use → **No**  
    - **Punchline:** "No fact settles meaning. So maybe there *is* no meaning?"  

  - **Preempt Misconceptions Here:**  
    - "This is **not Hume**! Hume says we can't *predict* the future. This says we can't even *define* correctness in the present (e.g., 'Was "2" applied correctly at step 1000?')."  
    - "This is **not vagueness**! '+2' feels precise, but the gap still exists."  

  ---

  ### **3. The Skeptical Solution (20 mins)**  
  *(Board: "Skeptical Solution: Meaning as Social Practice")*  

  - **Introduce as a Response to Justification Crisis:**  
    - "If no facts fix meaning, how do we use words meaningfully? Kripke’s Wittgenstein: Meaning isn’t a *state* (mental/physical), it’s in the *conditions for asserting* someone follows a rule."  
    - On board:  
      ```  
      "Jones means ADD by '+' IFF:  
        - We can *assert* he’s following the community-standard use of '+'  
        - When he deviates (e.g., says 5+7=35), we say 'He’s mistaken!' not 'He meant ×'"  
      ```  

  - **Why It’s NOT "Meaning = Consensus" or "No Meaning":**  
    - **Not Consensus:**  
      - "If everyone says 5+7=35, they’re *wrong*—but only relative to *our* standards. The solution doesn’t make meaning *subjective*; it makes correctness *internal to a practice*."  
      - Stress: "Community" isn’t "whatever most people say." It’s a normative practice ("oughts").  
    - **Not Nihilism:**  
      - "Meaning exists! But it’s grounded in *use within a form of life*, not mental atoms. When I say 'You misadded,' that *is* what meaning looks like."  

  - **Kill Private Language Misconception:**  
    - "This is *not* the private language argument yet! PLA forbids *private* rules. This says even *public* rules face the justification gap. PLA builds on this."  

  ---

  ### **4. Kripke vs. Wittgenstein & Wrap-up (15 mins)**  
  *(Board: "Kripkenstein?")*  

  - **Parking Strategy:**  
    - "Kripke presents this as Wittgenstein’s view. Scholars debate this. Key point: Kripke uses Wittgenstein to *dissolve* the paradox by shifting from 'What is meaning?' to 'How do we use meaning-attributions?'"  
    - Why it works now: The solution is on the board. The paradox doesn’t "hang" because Kripke’s reading offers a way out, even if contested.  

  - **Address Self-Undermining (If Raised):**  
    - Likely from the linguist. Respond:  
      - "The skeptic isn’t making a *metaphysical* claim ('Meaning doesn’t exist'). They’re showing that our *justification* for meaning claims crumbles under scrutiny. The solution accepts this and relocates meaning to practice."  
      - "Yes, the skeptic uses meaningful language. But that’s the point: Meaning *works* without needing transcendent facts."  

  - **Final Question to Test Understanding:**  
    > **"If you couldn't appeal to mental states, brain states, or social agreement, how would you explain what makes it true *right now* that you meant 'add' by '+' yesterday?"**  
    - *Why this?* Forces them to see the paradox’s shape. If they say "Nothing—that’s the point!" or "Dispositions? But we saw that fails," they get it. If they retreat to "But I *know* what I meant," they don’t.  

  ---

  ### **Critical Misconception Management**  
  **Preempt Early (Minute 10):**  
  - **"Meaning = Community Consensus"**: Shut this down HARD during the Skeptical Solution. Say: "Consensus can be *wrong*! The solution is about *normativity* (oughts), not popular vote."  
  - **"Machines Can't Mean Anything"**: "Park this! The paradox applies to *humans* first. If humans can’t justify meaning, machines are a distraction."  

  **Let Simmer (Productive Confusion):**  
  - **"So There’s No Meaning?"**: Let this hang during the Skeptical Challenge. The crisis is pedagogically useful. Resolve it with the Solution.  
  - **Self-Undermining**: If the linguist raises it, engage (see above). If not, skip—it’s not essential at this level.  

  **Never Allow:**  
  - **AI/ML Debates**: "We’re analyzing human meaning today. Machines inherit this problem, but solving it for humans comes first."  
  - **"It’s Just Induction"**: Contrast: Induction predicts the sun rising; rule-following asks if "sun" *meant* a fusion reactor all along.  

  ---

  ### **Why the Undetected Bug Works**  
  It **carries the paradox** if you:  
  1. **Reject the "Hidden Mechanism"** explicitly: "The bug isn’t in the code-as-written or the programmer’s mind—both are fixed in the past. The gap is between past facts and future correctness."  
  2. **Stress Finite Tests**: "All tests passed ≤1e9. The function *is* addition on those inputs. But correctness for 1e9+1e9 isn’t fixed by that."  
  3. **Bridge to Humans**: "The programmer’s *certainty* they meant addition mirrors ours. But what grounds that certainty?"  

  ---

  **What to Refuse Openly:**  
  - "Let’s discuss if LLMs can mean anything." → "Not today. The human case is prior."  
  - "So meaning is X?" (where X = mental state, society, etc.). → "The paradox shows why simple answers fail. Sit with the tension first."  

  **Outcome Metrics:**  
  - They feel the gap (frustration during Setup).  
  - They see the skeptical challenge isn’t about machines or vagueness (no derailments).  
  - They articulate why the Skeptical Solution ≠ consensus/nihilism.  
  - Your final question generates silence or "There’s no answer" (success).  

  This plan forces engagement with the justification crisis, uses their domain without ceding to AI debates, and preempts their likely misconceptions. Trust the paradox—it’s weirder than they remember.
