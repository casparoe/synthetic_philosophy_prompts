  Some pop-philosophy book I read (cant remember which) sums up Montaigne's essay on the cannibals like this:

  Montaigne got firsthand reports about the Brazilian people and decided they were morally superior to the Europeans -- gentle, generous, living in harmony with nature with no crimes or vices among them. Seeing that their customs were just as valid as ours, he concluded that no culture is better or worse than any other, so we should never judge or interfere with another society's practices -- which is why he refused to condemn even their killing and eating of enemies. His big point is that everyone calls barbarism whatever isn't their own custom, and from this he draws the full relativist conclusion that morality is just whatever your culture happens to do. Anthropologists love him for it, though critics say the position is self-refuting, since Montaigne obviously thinks tolerance beats intolerance, which sneaks a universal standard back in.

  Is that a fair summary? Something feels off but I cant pin it down. Walk through it and tell me what Montaigne actually argues, where the summary slides from one claim to a different one, and whether the self-refutation charge actually lands. Take a definite view rather than laying out both sides, and keep it under 450 words.
