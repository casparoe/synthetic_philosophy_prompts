  Okay, the user is asking about a summary they read of Montaigne's essay on cannibals. They feel something might be off with the summary but can't pinpoint it. They want me to analyze the summary's accuracy, point out where it shifts claims, and evaluate the self-refutation criticism.

  First, I need to recall Montaigne's actual arguments in "Of Cannibals." Montaigne uses reports about Brazilian indigenous people to critique European society. He contrasts their harmonious living with Europe's religious wars and corruption. His famous line is "each man calls barbarism whatever is not his own practice," highlighting cultural bias. But does he really claim all customs are equally valid? I think he's more nuanced than that.

  The summary claims Montaigne concluded no culture is better or worse, leading to full moral relativism. But Montaigne doesn't say all practices are equally good - he points out European atrocities like torture are worse than ritual cannibalism. He's making a comparative judgment, not declaring all morals equal. The jump to "morality is just whatever your culture does" oversimplifies his position.

  Regarding the self-refutation charge: critics say Montaigne contradicts himself by advocating tolerance as a universal value. But Montaigne's tolerance stems from skepticism - recognizing human judgment's fallibility, not asserting tolerance as an absolute truth. His approach is more about humility than relativist dogma.

  The user might be sensing the summary's reduction of Montaigne's complex skepticism to simple relativism. They probably want clarity on his actual philosophical stance and whether the criticism holds. I'll explain where the summary misrepresents Montaigne, show how his skepticism differs from relativism, and argue why the self-refutation charge doesn't fully land because of his emphasis on epistemic humility over moral equivalence.
answer: |-
  Here's a breakdown of the summary's accuracy and where it misrepresents Montaigne, followed by an assessment of the self-refutation charge:

  1.  **Accurate Core:** Montaigne *does* use reports of the Tupinambá people of Brazil to critique European society ("On the Cannibals," *Essays* I.31). He contrasts their reported harmony, generosity, and lack of major vices with European cruelty, greed, and hypocrisy, especially during the Wars of Religion.
  2.  **The Crucial Slide:** The summary correctly states Montaigne's famous point: "each man calls barbarism whatever is not his own practice." However, it then **slides incorrectly** from this observation about *judgmental bias* and *cultural difference* to the "full relativist conclusion that morality is just whatever your culture happens to do." This is an overreach.
  3.  **Montaigne's Actual Argument:** Montaigne doesn't conclude all cultural practices are *morally equivalent*. He argues:
      *   European judgment is hypocritical and often condemns practices less barbarous than their own (e.g., ritualistic post-battle cannibalism vs. systematic torture and massacre in religious wars).
      *   We lack an objective, universal standpoint ("natural reason") to definitively judge radically different customs rooted in different contexts.
      *   Our own customs are often arbitrary and irrational. Witnessing others forces us to question them.
      *   **Crucially:** He *does* condemn European atrocities *more harshly* than Tupinambá practices. His refusal to condemn cannibalism isn't based on accepting its inherent moral validity, but on:
          *   Recognizing its specific context (warfare, ritual, vengeance).
          *   Arguing it's *less cruel* than European practices ("I think there is more barbarity... than in roasting and eating a man after he is dead").
          *   Highlighting the hypocrisy of condemning it while ignoring worse European evils.
  4.  **The Charge of Self-Refutation:** The charge **lands weakly** against Montaigne's *actual* position, but *might* stick against the summary's misrepresentation.
      *   **Against Montaigne:** His core stance is *skeptical*, not dogmatically relativist. He doesn't assert "tolerance is universally good" as an absolute moral truth derived from relativism. Instead, his advocacy for restraint in judgment flows *from* his skepticism about our ability to know universal moral truths and the demonstrable harm caused by arrogant, hypocritical intervention. Tolerance is presented as the *pragmatic*, *less harmful*, and *more intellectually honest* consequence of recognizing our limitations and biases, not as a universal moral absolute contradicting relativism.
      *   **Against the Summary's Claim:** If Montaigne *had* argued the summary claims ("morality *just is* custom," full stop), then *yes*, advocating tolerance as a universal good *would* be self-refuting. But Montaigne didn't make that absolutist claim.

  **Conclusion:** The summary accurately captures Montaigne's cultural critique and his key insight about "barbarism," but **misrepresents his core argument by conflating cultural critique/skepticism with full moral relativism.** Montaigne argues for humility and restraint in judgment based on demonstrable European hypocrisy, the context of foreign practices, and the limits of human reason – not for the moral equivalence of all customs. The self-refutation charge fails against his actual skeptical position but would apply to the absolutist relativism the summary incorrectly attributes to him.
