  Ah, and the dissolution angle! The user notes that self-knowledge destroys the dreamer's self. That's fascinatingly inverted from Hofstadter, where self-reference creates the self. Borges shows self-awareness as unraveling, not consolidating. 

  Where the analogy holds: Both reveal reality's layered nature and the fragility of "ground level." Where it trades on a pun: "Levels" in dreams vs. logical hierarchy. The ending refutes Hofstadter by making self-reference lethal rather than constitutive. 

  What Borges offers beyond GEB: The visceral terror of the loop, the body's role (fire!), and how revelation annihilates rather than enlightens. Hofstadter gives mechanisms; Borges gives existential stakes. 

