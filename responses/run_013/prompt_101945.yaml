answer: |-
  ### The Coin Flip Conundrum  
  **Characters:**  
  - **Causal Decision Theorist (CDT)**: Thinks only about causing good outcomes.  
  - **Evidential Decision Theorist (EDT)**: Thinks about what actions indicate about the world.  
  - **Stranger**: A mysterious figure with a coin and two schemes.  

  *(The scene: A quiet café. CDT and EDT sit at adjacent tables. A Stranger approaches, flips a coin, and checks it—heads. He addresses CDT first.)*  

  **Stranger**: (To CDT) "I flipped heads. If it were tails, I’d give you $1,000. But it’s heads, so I ask: Give me $100 now. If you do, the *counterfactual you* in tails gets $1,000. Refuse, and tails-you gets nothing."  

  **CDT**: (Calculates) "Paying $100 here doesn’t *cause* tails-me to get $1,000—that branch is unreal. All I cause is losing $100. No deal."  

  **Stranger**: "Suit yourself." (Turns to EDT) "For you: I flipped a coin, hidden result. If it’s tails, I have embarrassing photos of you. I’ll release them *only* if it’s tails *and* you refuse to pay me $100. Pay, and I delete them. Your choice?"  

  **EDT**: (Calculates) "If I refuse, photos might leak—so refusal *evidences* tails was flipped. Paying $100 evidences safety: it correlates with no leak. Expected cost of refusal (50% chance of disaster) is worse than losing $100. I’ll pay." (Hands over $100.)  

  **Stranger**: (Smirking) "Pleasure doing business." (Exits.)  

  **CDT**: (To EDT) "Why pay? Your payment didn’t *cause* him to lack photos. The coin decided that."  
  **EDT**: "True, but paying *signaled* the photos likely don’t exist. My utility maximized! Why’d *you* refuse? Your payment could’ve helped tails-you!"  
  **CDT**: "Tails-me isn’t real! Only causality matters here."  

  *(Both pause, realizing the Stranger treated them differently.)*  
  **EDT**: "Hold on—he told you the coin result but not me. And he offered you counterfactual cash, me blackmail. What if...?"  
  **CDT**: (Eyes widening) "You were in XOR blackmail—paying was useless if the coin was heads. But I was in counterfactual mugging—refusing cost tails-me $1,000!"  
  **EDT**: "So I paid in blackmail when I shouldn’t have... and you refused in mugging when you shouldn’t have."  
  **CDT**: "Our theories worked perfectly... for the *other* guy’s problem."  
  **EDT**: (Sighs) "At least we’re consistently wrong."  

  **Moral**: *When your decision theory’s failure mode is the other’s solution, everyone loses—except the Stranger.*  

  ---  
  **Word count**: 285  
  **Key joke elements**:  
  - CDT refuses counterfactual mugging (should pay: subjunctive link to tails branch), but causality blinds him.  
  - EDT pays XOR blackmail (should refuse: payment doesn’t cause photo deletion, only correlates), but correlation tempts him.  
  - Humor arises from the theories’ *specific flaws*: CDT’s myopia and EDT’s overfitting to evidence, leading to swapped failures. No generic nerdiness—pure decision theory irony.
