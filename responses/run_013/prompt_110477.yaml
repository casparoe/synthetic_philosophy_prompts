  Okay, let me start by unpacking the user's scenario. They've been debating the two-envelope paradox with ex-LessWrong folks for weeks, and they're frustrated with shallow responses like "symmetry, duh." They want a rigorous opponent who knows the material. The user presents a bounded version of the paradox: n from 1 to 6, amounts 2^n and 2^(n+1), and they see 4. Conditional on seeing 4, the other envelope is equally likely to be 2 or 8, so expected value is 5, which is better than 4. They argue that with proper priors and finite expectations, the swap seems beneficial, challenging the orthodox view that proper priors resolve the paradox.

  First, I need to address their specific example. The key here is that seeing 4 provides information. In their setup, 4 can only be the smaller amount when n=2 (since 2^2=4, paired with 8). But 4 can't be the larger amount because that would require n=1 (2^1=2 and 4), but n=1 is possible. So conditional on seeing 4, it must be that the pair is either (4,8) or (2,4). The priors: n chosen uniformly from 1-6. Probability of n=1: pair (2,4). n=2: pair (4,8). Seeing 4 happens in two scenarios: if you pick the smaller in n=2 (4) or the larger in n=1 (4). Each n has probability 1/6. For each pair, you have a 50% chance of picking either envelope. So P(see 4 | n=1) = P(pick larger | n=1) = 0.5. P(see 4 | n=2) = P(pick smaller | n=2) = 0.5. Therefore, P(n=1 | see 4) = [P(see 4 | n=1) * P(n=1)] / P(see 4). P(see 4) = P(see 4 | n=1)P(n=1) + P(see 4 | n=2)P(n=2) = (0.5 * 1/6) + (0.5 * 1/6) = 1/12 + 1/12 = 1/6. So P(n=1 | see 4) = (0.5 * 1/6) / (1/6) = 0.5. Similarly, P(n=2 | see 4) = 0.5. So indeed, conditional on seeing 4, it's equally likely that the pair is (2,4) or (4,8). So the other envelope is 2 or 8 with equal probability, expected value 5. So swapping when you see 4 gives an expected gain of 1.

  But the orthodox response here is that this isn't paradoxical; it's correct given the setup. The reason swapping is beneficial when you see 4 is that 4 isn't the highest possible amount. Since n only goes up to 6, 128 is the max. So when you see 4, you know you're not at the top, so swapping is good. Similarly, if you see 128, you know it's the max, so you don't swap. The user's swap rule "swap unless holding 128" is indeed optimal. The average gain comes from the fact that at amounts below 128, swapping is beneficial due to the information about not being at the boundary.

