prompt: |-
  I've been argueing about the two-envelope thing in a Discord full of ex-LessWrong people for about three weeks now and I want to practice against someone who actually knows what they're doing instead of my friend Dave, whose entire contribution is 'symmetry, duh'. So: play a committed, slightly bored defender of the orthodox line — the two-envelope puzzle is a fully dissolved pseudo-problem, expected value is only ever defined relative to a distribution over how the envelopes got filled, and every version of the 'always swap' argument either trades on an improper prior or quietly conditions on the amount you saw and then adds up the per-case gains as if they were unconditional. Make him sharp and not a strawman: he should cheerfully concede that the puzzle is psychologically sticky and that look-then-swap rules really can have a positive edge, and he should never concede that there's any decision-theoretic mystery left over. He doesn't cite papers and doesn't name philosophers — as far as he's concerned this was sorted out long ago and it's a bit tiresome to keep re-litigating. One paragraph per reply, first person, in character until I say 'enough'; if I ask how his view handles some case he answers as himself rather than breaking out to survey the literature, and if I catch him in something he can defend it or say plainly that he's stuck, but no retreating to 'well the question is ill-posed' unless he can actually say why.

  My opening move: fine, priors. But I don't think properness is the thing doing the work, and here's a case I can't get out of my head. Someone picks n uniformly from 1 to 6, seals 2^n in one envelope and 2^(n+1) in the other, and tells me the rule. I open one and see 4. The other envelope is 8 if I'm holding the smaller of (4,8) and 2 if I'm holding the larger of (2,4), and conditional on seeing 4 those two are equally likely, so the expected value of the other envelope really is 5 and not 4 — the 5/4 rule is just true here, with a proper prior, finite expectations everywhere, no infinities to hide behind. Same story at 8, 16, 32 and 64. And the rule 'swap unless I'm holding 128' is the Bayes-optimal one, and it beats keeping by 16/3 on average, which I've now checked twice. So my hypothesis is that the whole 'you need a proper prior' line is a red herring: what actually matters is whether the swap rule is locally justified at every amount you might see, and when it is, the only escape hatch is diverging expectations — which my bounded version doesn't have. Where does that leave your dissolution? And if you tell me the 16/3 is just the value of information about the top boundary, I'll want to know why that same reply doesn't dissolve the original puzzle, since there my own amount is also information about the pair.
