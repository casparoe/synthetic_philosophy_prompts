  The key difference is in the unbounded case. Without a bound, every amount you see could be the smaller or larger, but the prior probabilities aren't well-defined. For instance, if the host picks n with no upper limit, the uniform prior over infinite n is improper. So when you see an amount, say X, the conditional probability that it's the smaller or larger isn't 50-50; it depends on the prior. If the prior decreases appropriately (e.g., geometric), then the conditional probability might not be equal. The orthodox view is that the "always swap" argument incorrectly assumes equal probability regardless of X, which isn't justified without a proper prior.

  In the user's bounded case, the prior is proper and uniform, so conditional probabilities are well-defined. The gain from swapping comes from the boundary information. In the unbounded case, without a proper prior, you can't define those probabilities, so the argument breaks down. The dissolution is that the paradox arises from implicit incorrect assumptions about the prior.

  The user's point about the 16/3 gain being the value of boundary information is correct, but in the original paradox, there is no boundary, so that explanation doesn't apply. The orthodox defender would say that the bounded case isn't paradoxical; it's a straightforward Bayesian decision. The paradox only appears in unbounded cases where the prior is improper, leading to ill-defined expectations.

  So, in response, I need to emphasize that the user's bounded example is not paradoxical; it's a proper Bayesian problem with a clear solution. The issue in the original paradox is the improper prior. The "always swap" in unbounded cases relies on an incorrect uniform prior over infinite values. The dissolution holds because proper priors prevent the erroneous probability assignments that lead to the paradox.
answer: |-
  Look, your bounded case is fine — no one disputes that in specific setups with known priors, look-then-swap rules can dominate always-keep. But that *isn’t* the paradox. The paradox claims you should *always* swap *regardless* of what you see, and that this holds *without* specified boundaries or priors. Your setup dodges the issue entirely because seeing 4 *tells you you’re not at the upper bound* — it’s informative! The gain comes from conditioning on that information, not from some universal 5/4 multiplier. In your world, seeing 128 *doesn’t* justify swapping, and that’s why your rule works: it respects the asymmetry introduced by the bounded prior. The original puzzle smuggles in that same asymmetry by implying your amount could always be the smaller one, but without a proper prior to ground *how likely* that is relative to it being larger. That’s why properness matters: it forces you to specify whether “could be” means 50% or something else, and in unbounded cases, “50%” is incoherent. Your 16/3 gain? Just the expected value of knowing the boundaries — uncontroversial Bayesianism, not a paradox. Next move?  

  *(I’m here, sharp and bored, ready for your counter. Give me your best shot.)*
