  ## The Moment's Guide to Letting Go
  **By Bartholomew Slice, Temporal Wellness Coach**

  Dear Momentary Companions,

  Do you wake up burdened? Haunted by yesterday’s missteps? Anxious about tomorrow’s unknowns? This clinging, this *persistence illusion*, is the root of your temporal discomfort. Modern temporal ontology reveals a profound liberation: **You are only Now-You.** Not the entity that occupied your spatial coordinates yesterday, nor the one who will occupy them tomorrow. They are *counterparts* – related, certainly, but distinct. Holding Now-You responsible for Yesterday-You’s actions, or sacrificing Now-You’s ease for Tomorrow-You’s potential benefit, is as irrational as feeling guilt for your neighbour’s unpaid parking ticket.

  Consider guilt over a broken promise. That promise? Made by Yesterday-You. That entity possessed its own desires, circumstances, and limited foresight. Is Now-You *identical* to Yesterday-You? Absolutely not! Different temporal coordinates, different experiential states – entirely distinct entities. Feeling guilt is Now-You mistakenly appropriating responsibility belonging to a *different person*. It’s a metaphysical error. Let it go. Yesterday-You’s actions are facts about the past, as relevant to Now-You’s moral ledger as the actions of Julius Caesar. Acknowledge the *counterpart relation* – the causal chain connecting you – but absolve Now-You. The weight isn’t yours to carry.

  Similarly, "your" long-term plans? They were drafted by a sequence of past counterparts, each making commitments based on their momentary, incomplete data. Now-You inherits the *consequences* of those commitments (like a mortgage initiated by Earlier-You), but not the *obligation*. If fulfilling a past counterpart’s plan feels arduous or misaligned with Now-You’s preferences? You are under no inherent duty. The entity who made the promise *no longer exists*. Your choice is purely pragmatic: will fulfilling this benefit Now-You (e.g., avoiding social friction caused by Earlier-You’s commitments) or influence future counterparts positively? Think of it as neighbourly goodwill along the timeline, not filial piety.

  Planning for the "future"? Ah, the grandest illusion! You are planning for *strangers* – future counterparts. Will they appreciate Now-You’s sacrifice? Perhaps. Perhaps not. Their needs and desires are unknowable to Now-You. Excessive future-planning often involves Now-You impoverishing its brief existence for the sake of entities it will never meet. Focus instead on actions that benefit Now-You *immediately* or strengthen the *counterpart relations* – making life slightly smoother for the next occupant. Saving money? Understand it as placing resources in a location likely to be accessed by a future counterpart who may (or may not) feel grateful. It’s philanthropy, not self-investment. Retirement planning? That’s arranging potential comfort for entities decades hence, utterly disconnected from Now-You. Do it only if the *act* of planning brings Now-You peace *now*.

  The rival view – that some single, unchanging "self" rides through time like a passenger in a train (endurantism, they call it) – is a comforting fairy tale. But it chains you to burdens not your own and obligations to phantom future selves. Embrace your ephemerality. You exist for a moment. Relish it. Release the anchors to past counterparts. View future counterparts with detached benevolence, not ownership. Your only true responsibility is to Now-You. Let the others fend for themselves. They always do.

  **In the Slice of Time,**
  **Bart**

  ---

  **Reader's Letter:**

  *Dear Coach Slice,*
  *This resonates, but I’m struggling. Last week, I (or, I suppose, a past counterpart) promised my partner I’d quit sugar. "I" lasted three days. Now I feel crushing guilt every time I reach for a cookie, haunted by the disappointment I’ve (they’ve?) caused. According to your view, is this guilt pointless? How do I stop feeling like a failure for something Past-Me committed to? And what about the promise itself? Is it just… null and void now?*
  *- Sweetly Suffering in Sheffield*

  **Coach Slice Responds:**

  Dear Suffering,

  Your guilt is indeed metaphysically misplaced, though its *feeling* is real for Now-You. Analyse it: The commitment was made by Past-You-Sheffield (let's call her PYS), a distinct entity operating under PYS's specific motivational state and biochemical cravings. PYS no longer exists. The disappointment your partner feels? Directed at PYS's actions, a separate entity. Now-You-Sheffield (NYS) is merely experiencing the causal aftermath – the partner's reaction – and mistakenly attributing PYS's lapse to NYS. Stop flogging NYS for PYS’s sugar rush!

  The promise? It was PYS’s utterance. It bound PYS. PYS is gone. The promise, as a commitment binding NYS, is null. Obligation died with PYS. However, NYS faces a choice: does eating the cookie *now* align with NYS’s current desires and willingness to manage the counterpart chain (i.e., deal with the partner's reaction towards the *sequence*)? If NYS enjoys the cookie and is prepared for potential friction caused by PYS’s initial promise and subsequent breaking of it, then eat freely. If avoiding friction matters more to NYS than the cookie, abstain. But do it for NYS’s peace, not because PYS made a vow NYS never signed. Release the guilt. It belongs to a ghost. Enjoy the cookie, NYS, or don't. But choose for *you*. Now.
