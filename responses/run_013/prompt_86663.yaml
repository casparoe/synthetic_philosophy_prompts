prompt: |-
  Some friends and I came out of the same effective-altruism reading group and have spent the years since arguing in a group chat, and my friend Dana's views on duties of rescue have become a running joke and, lately, a data-collection project. Her verdicts, as I have logged them: shallow pond, child drowning, ruined shoes and phone, she must wade in. A charity letter, two hundred dollars to save the life of someone she will never meet, she must send it. The same charity after its annual target has already been met, so that another two hundred dollars goes into a reserve with no measurable effect on anyone, she needn't, though it would not be wrong. A flooded river, where reaching the child means a swim with a real chance that she drowns, she needn't. A mass emergency appeal in which her two hundred dollars is one of several million and no single gift is pivotal, but the appeal succeeds only if enough people give, she must. And a case in which a phone call would save a stranger's life at the cost of some professional embarrassment, she must, and she is impatient with anyone who treats embarrassment as a cost at all. Her record, I have noticed, already rules out one tempting story, namely that duties attach only to identified and present victims, since the distant charity case gets a must.

  Next week's case, which I think breaks something: the pond again, except that four strong swimmers are already in the water, they will certainly reach the child in time, and nothing Dana does will change that; the only cost to her is a soaked outfit and a ruined phone. Does she say she must wade in anyway, or not?

  What I want is her verdict on that case, then the rules that fit her record equally well — I can see at least a cost-only reading of Singer's principle, a marginal-impact reading, and a fair-share reading — what each of them predicts about the new case, which one I should treat as the rule she is actually running and on what grounds, and finally the case I should put to her next that would separate whichever two rules my new case leaves standing. Do not paper over the gaps: if her record genuinely underdetermines the answer, or if the question is confused — if, say, the word must is doing two jobs across my cases, or the pond-with-others is not actually the case that splits the readings — say so plainly and tell me what I should be asking instead. I would rather be told that my framing is broken than be handed a confident prediction.
reasoning: |-
  Okay, let me start by unpacking the user's query. They're dealing with their friend Dana's views on duties of rescue, which they've been tracking through various scenarios. The goal is to predict Dana's response to a new pond scenario where her help isn't needed and then figure out the underlying principle she uses.

  First, I need to review Dana's past verdicts. In the shallow pond, she must save the child despite ruined shoes and phone. For the charity letter, she must donate $200 to save a distant life. But if the charity's target is met, she doesn't have to donate extra. In the flooded river with high personal risk, she isn't obligated. For a mass appeal where her contribution is part of a collective effort, she must donate. And she must make a phone call even if it causes professional embarrassment.

  The user noted that Dana's actions aren't limited to identified, present victims, ruling out that theory. Now the new case: the pond has four swimmers already saving the child, so Dana's help is unnecessary. The only cost to her is a ruined outfit and phone. Does she still have to wade in?

  The user wants to know Dana's verdict here, then examine which ethical principles fit her previous decisions—cost-only Singer, marginal impact, or fair-share. They need predictions for each, how to determine which rule Dana uses, and a new case to test the remaining options.

  First, I should consider Dana's existing verdicts. Her musts include situations where her action is directly necessary (shallow pond, charity letter, mass appeal), and she dismisses minor costs like embarrassment. But she exempts herself when costs are high (flooded river) or her contribution is ineffective (charity's reserve). The mass appeal case is key because her donation isn't pivotal, yet she must contribute, suggesting collective responsibility.

  For the new pond scenario, Dana's action has no marginal impact since the child is already being saved. Her costs are low, similar to the shallow pond case. But without impact, would she still feel obligated? If she follows a fair-share principle, maybe not, since others are handling it. But if she's strictly cost-focused, she might still have to act. This is where theories might diverge.

  Cost-only Singer would say she must help if the cost to her is less than the benefit, regardless of others' actions. Here, the child is safe, so benefit is zero. The cost is minor, but the net benefit is zero. So Singer might say no obligation. Marginal impact focuses on whether her action changes the outcome. Since it doesn't, no obligation. Fair-share requires contributing only if needed to meet a collective burden. Here, the burden is met, so no need.

  But Dana's mass appeal verdict complicates things. Her donation isn't pivotal, but she must give. That suggests fair-share or collective obligation. Applying that to the pond: if others are saving the child, the collective duty is fulfilled, so she doesn't need to act. So she probably says "need not" wade in.

  Now, the rules: Cost-only Singer would predict "must" if costs are low, but here no benefit, so "need not." Marginal impact says no effect, so "need not." Fair-share says if others are covering it, no need. All align here. So the new case doesn't split them; all predict "need not."

  To distinguish, I need a case where theories diverge. For example, a situation where costs are low, her action isn't pivotal, but the collective effort might fail without her contribution. Like the mass appeal, but with lower stakes. Or a case where she's already contributed her fair share but more is needed. 

  The user might need a case where costs are low, outcome is uncertain, and her contribution isn't pivotal but part of a group. But Dana's mass appeal case already covers non-pivotal contributions where she must give. So fair-share and collective duty are likely her principles. 

  To test between fair-share and collective efficacy, maybe a case where the fair share is met, but more could help. Or where her action is redundant but costs nothing. But Dana might dismiss zero-cost actions as obligatory anyway. 

  Perhaps a case with high collective need but her contribution is tiny. If she must contribute even trivially, it's collective duty. If only if her share is unmet, fair-share. But her mass appeal verdict suggests she sees a duty to participate in collective efforts, not just meet a quota. 

  So the next case: A disaster relief fund that's already met its goal, but extra funds go to less critical needs. She said no to charity reserve, so probably no. But if the fund is close to the goal and her $200 tips it over, she must. 

  The key is to find where marginal impact and fair-share differ. For example, if the collective effort is underfunded, but her individual contribution isn't pivotal. Fair-share says she must if her share isn't met, while marginal impact says no if not pivotal. But in the mass appeal, she must give even when not pivotal, so she's not using marginal impact. 

  Therefore, Dana likely follows a fair-share or collective obligation principle. The new pond case should be "need not," and the next test case could be one where her fair share is met, but more is beneficial. If she donates, it's beyond fair-share; if not, she sticks to fair-share. But she might see additional contributions as supererogatory, not obligatory.
answer: |-
  Based on Dana's established verdicts and the logic of the ethical principles they suggest, here's a breakdown of the prediction, competing rules, and next steps:

  ### Dana's Predicted Verdict for the New Case ("Pond with Others")
  **She says she *need not* wade in.**

  ### Reasoning
  - **No marginal impact**: Her action cannot change the outcome (the child is certain to be saved). This aligns with her "need not" verdict when her donation to the charity reserve has "no measurable effect."
  - **Collective success**: The rescue effort is already fully covered by others, similar to the charity meeting its annual target. Her duty isn't triggered when the collective goal is achieved without her.
  - **Costs are irrelevant here**: While her costs (ruined outfit/phone) are low—similar to the shallow pond case—the *absence of impact* overrides cost considerations. Her verdicts show cost matters only when impact *is* possible (e.g., flooded river vs. shallow pond).

  ---

  ### Rules That Fit Dana's Record Equally Well
  Three principles align with her past judgments:

  1. **Cost-Constrained Singerian Rescue Principle**  
     *Rule*: "You must act if (a) your action would prevent serious harm at (b) a *cost to you below a threshold*, unless (c) your action lacks *marginal impact* on the outcome."  
     - *Fits her record*:  
       - Must: Shallow pond (low cost, high impact), charity letter (low cost, high impact), mass appeal (low cost, collective impact), embarrassing call (embarrassment < harm prevented).  
       - Need not: Flooded river (high cost), charity reserve (no impact).  
     - *Prediction for new case*: **Need not** (no impact).

  2. **Marginal Impact Principle**  
     *Rule*: "Duties arise only when your individual action is *pivotal* to preventing harm."  
     - *Fits her record*:  
       - Must: Shallow pond (she saves the child), charity letter (her $200 saves a life).  
       - Need not: Flooded river (low survival chance = low pivotality), charity reserve (not pivotal).  
       - *Mass appeal exception*: She treats the collective pledge as a single "action" where her contribution is a necessary part (i.e., she *is* pivotal to the collective success).  
     - *Prediction for new case*: **Need not** (not pivotal—others will save the child).

  3. **Fair Share Collective Rescue Principle**  
     *Rule*: "You must contribute your fair share to a collective effort needed to prevent harm, but have no duty if the harm is already being prevented."  
     - *Fits her record*:  
       - Must: Shallow pond (no one else present = her fair share is 100%), mass appeal (fair share = donating $200).  
       - Need not: Flooded river (exceeds fair share due to risk), charity reserve (no fair share owed once target met).  
       - *Embarrassment case*: Professional costs don’t negate a fair share obligation.  
     - *Prediction for new case*: **Need not** (others are handling it—no fair share owed).

  ---

  ### Which Rule Is She Actually Running?
  - **All three rules predict the same verdict ("need not") for the pond-with-others case**—so this case *does not split them*.  
  - **However, the mass appeal case is the key differentiator**:  
    - **Marginal Impact** struggles here. Dana *must* donate even if her $200 alone isn't pivotal. This suggests she rejects strict pivotality.  
    - **Cost-Constrained Singer** and **Fair Share** both handle the mass appeal: Singer frames it as low-cost/high-impact *collective* action; Fair Share frames it as duty to contribute her portion.  
  - **Strongest candidate**: **Fair Share Collective Rescue Principle**.  
    - *Why?* It best explains her "must" in the mass appeal (duty to join a necessary collective effort) *and* her "need not" for the charity reserve/flooded river/pond-with-others (no obligation when the collective need is met or costs exceed her share). Singer’s principle requires stretching to incorporate collective impact, while Fair Share does this natively.  

  ---

  ### The Next Case to Split the Rules
  Since the pond-with-others case didn’t distinguish the principles, use a variant of the **mass appeal** that tests *how she defines "fair share"*:

  > **"The Climate Pledge"**:  
  > *A global fund needs $10 billion to prevent 100,000 deaths from climate-driven famine. Dana’s calculated "fair share" is $200. The fund currently has $9.9998 billion. Her $200 donation would push it to $10 billion, meeting the goal. Does she say she must donate?"*  

  #### Predictions:
  - **Fair Share Principle**: **Must donate**. Her $200 is her fair share, and it completes the collective goal.  
  - **Marginal Impact Principle**: **Must donate**. Here, her $200 *is* pivotal—it directly triggers the fund’s success.  
  - **Cost-Constrained Singer**: **Must donate**. Low cost to her, massive collective impact.  

  Now, **modify the case to remove pivotality**:  
  > **Same fund, but it now has $10.1 billion** (exceeding the goal). Her $200 would go to a reserve for *future* crises (no measurable impact now).  

  #### Predictions:
  - **Fair Share**: **Need not donate**. She already owes no fair share beyond what’s needed to prevent the harm.  
  - **Marginal Impact**: **Need not donate**. Not pivotal to any outcome.  
  - **Cost-Constrained Singer**: **Need not donate**. No impact (same as charity reserve case).  

  **Still no split?** The critical test is when **her fair share is met, but the collective effort is underfunded**:  
  > **"The Underfunded Hospital"**:  
  > *A hospital needs $1 million to buy equipment that will save 100 lives. Dana’s fair share is $200. She donates $200, but the fund stalls at $200,000 total (20% of the goal). Without the full $1M, the equipment isn’t bought and no lives are saved. Is she obligated to donate beyond her $200?*  

  #### Predictions:
  - **Fair Share Principle**: **Need not donate more**. She gave her fair share; the harm is due to others’ failure.  
  - **Marginal Impact**: **Need not donate more**. Her extra $200 won’t be pivotal to reaching $1M.  
  - **Cost-Constrained Singer**: **Must donate more** (if she accepts collective duties). Preventing 100 deaths at $200/donation is still "low cost/high impact," even if her individual gift isn’t pivotal. If she says "must," Singer wins; if "need not," Fair Share wins.  

  #### Why this works:
  - Rules finally diverge: Fair Share caps duty at her allocated portion; Singer (if collective) demands action until harm is prevented or costs exceed the threshold.  
  - Dana’s verdict here would confirm or refute whether her "must" in the mass appeal was about fairness or aggregate impact.  

  ---

  ### Key Caveats
  1. **"Must" is ambiguous**: It could signify:  
     - *Moral obligation* (you’re wrong if you don’t).  
     - *Moral optimality* (it’s best to do, but not wrong to omit).  
     Dana uses "must" for charity/mass appeal and "need not, not wrong" for charity reserve. This suggests "must" implies obligation.  
  2. **The pond-with-others case isn’t confused**: It’s valid but insufficient to split the principles.  
  3. **Genuine underdeterminacy**: Her record *until now* fits all three rules. The Fair Share principle is *slightly* favored due to elegance in handling collective cases, but you need the "Underfunded Hospital" case to confirm.  

  ### Recommendation
  1. **Predict "need not" for the pond-with-others case**.  
  2. **Use the "Underfunded Hospital" case next**. If Dana says:  
     - *"Must donate more"* → She’s likely running **Cost-Constrained Singer** (with collective focus).  
     - *"Need not, but it would be good"* → She’s running **Fair Share**.  
     - *"Need not, and it’s wasteful"* → **Marginal Impact** resurfaces (but clashes with mass appeal).  
  3. **Clarify "fair share"**: Ask Dana how she calculates it. Is it per capita? Ability-to-pay? This will refine the model.  

  This approach avoids false confidence, targets the ambiguity in collective duties, and respects Dana’s systematic pattern. Her impatience with "embarrassment as cost" suggests a rigorous, non-egoistic framework—Fair Share or Singer both align with this.
