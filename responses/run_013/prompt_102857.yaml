prompt: |-
  I'm building a small bank of philosophy jokes for a reading group and I need one more, so I'm hoping you can write it. The target is David Lewis's account of convention: conventions as solutions to recurring coordination problems, where the regularity is arbitrary (it could just as easily have settled the other way) yet stable, because each person conforms, expects the others to conform, expects them to expect it, and so on — common knowledge all the way down. The joke has to turn on that actual machinery and be genuinely funny to someone who knows it, not a generic "haha philosophers" gag that just name-drops him. And please don't hand me a bibliography or cite any papers, I can't look anything up right now and I don't need the reading list, I just want the joke.

  Here's the specific thing I want it built around, and it's my own little invention so don't go hunting for it anywhere: in my department there's an unwritten rule about the seminar room — first person in opens the blinds, last person out kills the light, and nobody ever agreed to it, it just sort of happened, and now everyone does it automatically and would find it really strange if you didn't. I want a joke where someone tries to be extra courteous inside this arrangement and it backfires, because being courteous means wanting the *other* person to go first, and that preference destroys the equilibrium — it re-opens the exact question the convention existed to settle — so you end up in an infinite polite shuffle, a regress of "no, after you." So the punchline should land on the real stuff: arbitrary equilibrium versus a mere regularity, common knowledge doing the load-bearing work, and the way a norm that isn't equilibrium-selecting never stabilizes or "evolves" into anything. Think of the classic sidewalk shuffle, but funnier and more philosophical.

  Take on the role of a philosopher who works on social ontology and game theory. Brainstorm a few seperate candidate setups or angles first, out loud, then give me the best single joke told properly, short enough to actually deliver at a reading group. It should definately get a real laugh from people who know Lewis.
reasoning: |-
