  Meanwhile, naturalists attack precisely that probability framework. The multiverse response isn't just an alternative explanation - it's a direct challenge to the meaningfulness of assigning probabilities to a single universe. And the observer-selection gambit (anthropics) questions whether any probability was ever involved at all. 

