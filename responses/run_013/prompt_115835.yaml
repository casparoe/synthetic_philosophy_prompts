  Hey -- I'm a 3rd-year PhD in early modern phil, supposed to be finishing a chapter on Hobbes and the geometrical method, but I keep procastinating because I can't stage a disagreement properly. I want a dialogue between two people who both know their stuff. One is a systematic Hobbes person: geometry is the model for philosophy because it starts from definitions and constructions and moves demonstratively; that's why Hobbes thinks civil philosophy can be a science, since we make the commonwealth and so can know its causes the way a geometer knows a figure by constructing it. The other is a historian of mathematics: Hobbes's actual math was a trainwreck, Wallis wrecked him, he was obsessed with the classical problems, and his geometry-talk is mostly borrowed prestige; if you look at what he does, it's not Euclid, it's Hobbes. Can you write them talking, maybe at a conference bar, really going at each other? I want the historian to press that Hobbes's constructivism doesn't transfer to politics: you can't generate a commonwealth from first principles the way you generate a circle by rotating a line. And I want the systematic one to come back that this begs the question, because Hobbes redefines demonstration so that any artifact whose causes we know is demonstrable, and that Wallis's algebra is exactly the kind of symbol-pushing Hobbes would say isn't demonstrative at all. Maybe have them use a distinction I'm kicking around -- demonstration as derivation vs demonstration as generation -- and disagree about which one Hobbes actually needs. Also maybe the point that the Wallis fight was about whether algebra counts as a science, not just who got quadrature right. No citations or reading lists, just the dialogue. And neither should be a strawman -- the historian should know the texts, the systematic one should know the math.
