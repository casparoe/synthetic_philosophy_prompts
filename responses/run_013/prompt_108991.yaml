prompt: |-
  I'm a third-year PhD student in epidemiology, midway through a dissertation on treatment-effect heterogeneity, and I keep tripping over a pattern in my data that I can name only by slapping the nearest famous label on it, which no longer feels honest. The pattern: a treatment looks beneficial in the pooled sample but harmful within every stratum I can construct, or the reverse. I understand the bare arithmetic—that pooling can invert a within-group comparison—and I don't need that re-explained. What I can't settle is which of the several things people mean by "Simpson's paradox" I am actually looking at, because two features of my case seem to fall outside the textbook presentations. First, my strata are defined by a lab value measured after enrollment, and I have reason to think the treatment itself moves that value, so I am not sure the stratifying variable is the kind of thing one is permitted to condition on. Second, the apparent direction flips again when I move from the patient level to the clinic level to the region level, so "the effect" seems to depend on the level at which I choose to stop.

  A concrete instance, stripped of identifying details: in the full sample, patients on the protocol have lower mortality; within every quintile of the post-treatment biomarker, they have higher mortality; and when I aggregate to clinics and weight by size, the sign flips a third time. Three colleagues give me three diagnoses. One says this is ordinary confounding and I should adjust for everything I can measure; one says I am conditioning on a collider and manufacturing a reversal that is not in the population; one says it is an ecological fallacy and I should never have aggregated in the first place. Each sounds plausible, and they cannot all be right.

  What I want is a carving, not a label. Does this configuration have an established name—or, more likely, does it straddle two or three distinct phenomena? If so, draw the boundaries for me: how Simpson's paradox proper differs from the ecological fallacy, from confounding in the modern causal-inference sense, and from collider or selection effects (I have seen "Berkson" attached to that last family but I do not trust my memory of it), and, crucially, what each of those diagnoses does and does not license me to conclude about whether the treatment works. If nothing established covers the exact combination I have described—a post-treatment stratifier together with a level-dependent reversal—say so plainly and coin a term, with a definition and a couple of boundary cases, rather than forcing it into the nearest famous box. Please write in American English, and end with a single final line of the form "Verdict: <the best-fitting name, or your coined term>".
reasoning: |-
  Okay, the user is a third-year PhD student in epidemiology dealing with a complex pattern in their dissertation data on treatment-effect heterogeneity. They describe a situation where the treatment effect direction flips depending on whether they look at pooled data, stratified data, or aggregated clinic/region levels. They've received conflicting diagnoses from colleagues about whether this is confounding, collider bias, or ecological fallacy. 

  The core tension here is between mathematical understanding and causal inference validity. The user clearly grasps the arithmetic reversal (Simpson's paradox mechanics) but is wrestling with whether their stratification variable (a post-treatment biomarker) constitutes proper conditioning. The fact that treatment may influence this biomarker creates a classic post-treatment variable problem - conditioning on it likely blocks causal pathways while introducing collider bias. 

  The level-dependent reversals add another layer. When analyzing at patient level vs clinic level, they're essentially changing the unit of analysis, which interacts with the stratification issue. Clinic-level aggregation might accidentally weight by clinic size or create an ecological fallacy where group-level patterns don't reflect individual mechanisms. 

  What makes this particularly thorny is how these problems compound: the post-treatment stratification creates bias at the individual level, then aggregation introduces a separate set of fallacies. Textbook Simpson's paradox usually assumes legitimate strata, while ecological fallacy assumes no post-treatment conditioning. This case has both issues simultaneously - hence the "three sign flips" phenomenon.

  The colleagues' suggestions each capture part but not all of the problem. Adjusting for "everything" would worsen collider bias. Calling it pure collider bias ignores the aggregation problem. And while ecological fallacy is present, it's not the root cause. 

  This seems to be a distinct configuration requiring a new term. "Stratified Aggregation Reversal Paradox" captures the core elements: stratification on post-treatment variable plus unit-of-analysis shifts causing reversals. The boundaries with classical paradoxes are clear: unlike Simpson's, the strata aren't pre-treatment; unlike ecological fallacy, the reversal happens before aggregation; unlike pure collider bias, level changes trigger new reversals. 

  For causal conclusions: the only trustworthy estimate would come from either (1) avoiding conditioning on post-treatment biomarkers or (2) using causal mediation methods that explicitly model biomarker pathways. The clinic-level analyses should be abandoned entirely as uninformative about treatment effects on patients.
answer: |-
  Your case is a fascinating collision of multiple causal inference problems—a **stratification artifact due to post-treatment conditioning compounded by aggregation bias**, creating a level-dependent sign reversal. It straddles Simpson’s paradox, collider bias, and ecological fallacy but is not fully explained by any single one. Below is a carving of the phenomena, their boundaries, and what they license you to conclude:

  ### 1. **Simpson’s Paradox (The Arithmetic Core)**  
     - **Definition**: Reversal of an association (e.g., treatment-outcome) when data are aggregated vs. stratified, due to confounding by the stratifying variable.  
     - **Boundaries**: Assumes strata are *pre-treatment* (e.g., age, sex) and *not causally affected* by treatment.  
     - **Licenses**: If strata are pre-treatment, pooling is biased; conditional estimates are more credible.  
     - **Why it doesn’t fit here**: Your biomarker is *post-treatment* and likely *mediates* the effect, making stratification invalid for causal interpretation.

  ### 2. **Collider Bias / Selection Bias (The Conditioning Problem)**  
     - **Definition**: Conditioning on a variable (a "collider") influenced by both treatment and outcome creates artificial associations. *Berkson’s paradox* is a subtype (e.g., hospital-based studies where admission is the collider).  
     - **Boundaries**: Arises when the stratifier is *downstream* of treatment or outcome.  
     - **Licenses**: Conditioning on a post-treatment variable distorts effects. Unadjusted estimates *may* be less biased, but only if no unmeasured confounding exists.  
     - **Why it fits partially**: Your biomarker (stratifier) is likely a collider: Treatment → Biomarker ← Outcome (or other causes). Conditioning on it induces bias, explaining the within-stratum harm signal.

  ### 3. **Ecological Fallacy (The Aggregation Problem)**  
     - **Definition**: Inferring individual-level effects from group-level data. Aggregation (e.g., clinics/regions) averages out heterogeneity, masking or reversing true associations.  
     - **Boundaries**: Occurs when group-level associations ≠ individual-level associations due to within-group variation.  
     - **Licenses**: Group-level analyses are uninformative for individual effects.  
     - **Why it fits partially**: Clinic-level aggregation weights large clinics more heavily, potentially flipping signs due to compositional differences (e.g., clinic size correlates with unmeasured factors).

  ### Why Your Case is Distinct: A "Level-Dependent Reversal Cascade"  
  Your configuration merges two problems:  
  - **Post-treatment conditioning** (collider bias) creates reversal #1 (pooled benefit → within-stratum harm).  
  - **Changing units of analysis** (patient → clinic → region) creates reversal #2: Clinic-level aggregation introduces ecological bias by ignoring within-clinic heterogeneity or weighting anomalies.  

  This is **not classical Simpson’s paradox** (which requires pre-treatment strata) or **pure ecological fallacy** (which doesn’t involve post-treatment conditioning). It’s a hybrid:  
  > **"Mediator Collider Cascade"**  
  > *Definition*: A sign reversal cascade caused by conditioning on a post-treatment variable (inducing collider bias) followed by further reversals due to aggregation across units of analysis (inducing ecological bias).  
  > *Boundary Cases*:  
  > - *Not Mediator Collider Cascade*: Pooled vs. stratified reversals with pre-treatment confounders (Simpson’s).  
  > - *Is Mediator Collider Cascade*: Reversals vanish if you avoid conditioning on the biomarker or use causal mediation models (e.g., g-computation). Clinic-level sign flips disappear if you analyze patients without aggregation.  

  ### What You Can Conclude About the Treatment  
  - **The within-stratum harm signal is likely artifactual**: Conditioning on a post-treatment biomarker (a probable collider) distorts effects.  
  - **The clinic-level estimate is uninformative**: Aggregation introduces ecological bias; avoid it for individual effects.  
  - **Your least biased estimate? The pooled analysis**, *if* there is no unmeasured confounding. But if unmeasured confounders exist (likely), even this is suspect.  
  - **Solution path**:  
    1. **Do not condition on post-treatment biomarkers** for effect estimation.  
    2. Use **causal mediation analysis** (e.g., interventional direct effects) if the biomarker is of scientific interest.  
    3. Account for clinic-level effects with **multilevel models** (e.g., random intercepts for clinics), but interpret patient-level effects.  

  Verdict: **Mediator Collider Cascade**
