answer: |-
  Your position—that a story becomes "history" primarily through **institutional endorsement** rather than empirical corroboration—offers a compelling lens to examine why the Trojan War, King Arthur, and the Exodus occupy distinct places in our historical imagination. This institutional theory argues that a narrative solidifies as "history" when a continuous, authoritative entity (a state, church, or scholarly tradition) adopts it as a foundational truth essential to its legitimacy, identity, or authority. Below, I argue for this view, apply it to your three cases, identify its weakest fit, and address the power/truth objection.

  ### The Argument for Institutional Endorsement
  Empirical evidence alone cannot explain why some narratives are treated as history while others are not. Archaeology is often ambiguous or silent, and early accounts are invariably literary and mythopoetic. Instead, **institutional continuity** transforms a story into "history" by:
  1.  **Formalizing Transmission:** Creating mechanisms (education, liturgy, chronicles) to pass the story across generations as fact.
  2.  **Linking to Authority:** Tying the narrative's truth to the institution's legitimacy (e.g., divine covenants, national origins, cultural superiority).
  3.  **Resisting Revisionism:** Actively suppressing or marginalizing challenges to protect institutional identity.
  4.  **Generating Corroboration:** Incentivizing later scholars/archaeologists to "prove" the narrative (e.g., Schliemann at Troy), creating a feedback loop.

  Corroboration often *follows* institutional endorsement, not the reverse. The institution sustains the narrative long enough for evidence to be sought—and interpreted favorably.

  ### Applying the Institutional Test
  1.  **The Trojan War**  
      - **Institutional Endorsement:** Ancient Greek *poleis* (city-states) treated Homer's epics as foundational history, central to Hellenic identity, education, and diplomacy. Athens claimed lineage from Trojan refugees; Alexander the Great visited "Achilles' tomb" at Troy. Rome later adopted the Trojan myth via Aeneas, making it integral to imperial ideology. Byzantine and Ottoman scholars preserved the tradition.  
      - **Result:** The war became "history" because Mediterranean states and scholarly traditions (Greek, Roman, Byzantine) treated it as indisputable fact for millennia. Archaeology (e.g., Troy VIIa's destruction) was interpreted through this preexisting institutional lens.  

  2.  **King Arthur**  
      - **Institutional Endorsement:** Early chroniclers (e.g., Geoffrey of Monmouth) used Arthur to legitimize Norman rule over Britain, but *no continuous institution* depended on his historicity. The Tudor dynasty briefly exploited Arthurian symbolism, but England's identity rested on the Norman Conquest and Magna Carta, not Camelot. The Church never endorsed Arthur as crucial to its authority.  
      - **Result:** Arthur remained "legend" because no institution sustained him as a *non-negotiable historical fact*. His story was adaptable literature—not a pillar of state or religious authority.  

  3.  **The Exodus**  
      - **Institutional Endorsement:** Judaism, Christianity, and Islam all treat the Exodus as a historical event foundational to their theology and identity. The Passover Seder, liturgical calendars, and scriptures institutionalize its transmission as fact. For Jews, it validates the covenant with God; for Christians, it prefigures salvation; for Muslims, it confirms prophetic tradition.  
      - **Result:** Despite minimal archaeological evidence, the Exodus is "history" for billions because religious institutions mandate its acceptance as truth. To question it is to challenge the authority of these faiths.  

  ### The Weakest Fit: **King Arthur**  
  The institutional theory handles **King Arthur** least effectively. While it explains why Arthur *isn't* considered history (lack of continuous institutional buy-in), it struggles with why Arthur was *ever* treated as historical by medieval chroniclers. Geoffrey of Monmouth's *Historia* was embraced by Norman elites to legitimize their rule—a brief institutional endorsement. Yet Arthur faded into legend because **no enduring institution tied its survival to his literal truth**. England derived authority from Parliament, Common Law, and the Crown—not Camelot. The theory predicts this outcome but less elegantly explains the initial flicker of historical treatment compared to Troy or the Exodus, where institutional commitment was profound and unbroken.

  ### The Power vs. Truth Objection
  **Objection:** This reduces historicity to power—privileging narratives backed by states or churches, regardless of truth. It risks legitimizing propaganda (e.g., fascist myths) and marginalizing unpowerful voices (e.g., oral histories of oppressed groups).  

  **Response and Survival:**  
  The position *survives* by distinguishing between **historical acceptance** and **historical truth**.  
  - **It explains, not justifies:** The theory describes *how* narratives gain the *status* of history in a society—not whether they are objectively true. Power *does* shape historical canonization, but this is an observation of social epistemology, not an endorsement.  
  - **Truth remains relevant:** Institutions cannot sustain narratives indefinitely against overwhelming counter-evidence without becoming cults or dictatorships (e.g., flat-earth beliefs collapsed under pressure). The Exodus is maintained by faith institutions *despite* archaeology because its "truth" is metaphysical—but secular historians reject it as history.  
  - **Corrective mechanisms:** Scholarly traditions (when autonomous) can challenge institutional narratives using evidence. Troy's historicity was questioned by ancient skeptics (e.g., Thucydides) but survived due to overwhelming cultural investment. Today, academic history operates as a counter-institution, using evidence to revise dominant narratives (e.g., debunking Lost Cause mythology).  

  **Conclusion:**  
  Your institutional theory powerfully explains the divergent fates of the Trojan War (endorsed by ancient states/scholarship), King Arthur (lacking continuous institutional need), and the Exodus (underwritten by religions). While Arthur poses a minor challenge due to transient elite patronage, the theory survives the power/truth objection by clarifying that institutional endorsement determines *cultural status as history*, not objective veracity. Truth-claims must still engage with evidence—but without institutional support, they rarely penetrate public consciousness *as history*. The Exodus exemplifies this: its historicity persists only within communities whose authority depends on it, while archaeology remains irrelevant to those institutions. This reveals history as a social practice, where power and truth are in constant negotiation—but not equivalence.
