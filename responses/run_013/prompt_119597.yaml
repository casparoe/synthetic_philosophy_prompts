  The strongest objection is that this makes historicity about power, not truth. The user wants me to address whether the position survives this. The answer is yes, by distinguishing between historical acceptance and actual truth. The theory explains why stories are treated as history by societies, not whether they are true. It's about social epistemology—how institutions shape what's accepted as fact. But this doesn't mean truth is irrelevant; evidence can challenge institutional narratives over time, like with the Exodus in academic circles.

  I need to make sure I'm explicit about which case the position handles worst. The Exodus is tricky because, despite weak evidence, it's maintained by religious institutions. This shows the theory works in explaining its persistence, but also highlights the tension when institutions resist contrary evidence. So it handles Exodus the worst in terms of reconciling institutional authority with external evidence.

