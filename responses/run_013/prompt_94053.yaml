answer: |-
  ## Essay Question

  Harsanyi's Aggregation Theorem demonstrates that if (i) each individual's preferences satisfy the axioms of expected utility theory, (ii) the social preference ordering satisfies the axioms of expected utility theory, and (iii) the social preference satisfies the Pareto principle (both weak and strong forms), then social preference must be representable by a *weighted sum* of individual von Neumann-Morgenstern (vNM) utility functions.

  Critically evaluate the normative significance of this theorem. Your essay must address the following:

  1.  Explain why one might argue the theorem is **too weak** to meaningfully support utilitarian aggregation, given its formal structure.
  2.  Explain why one might argue the theorem is **question-begging** regarding the core challenge of interpersonal utility comparisons.
  3.  Explain why a **prioritarian** social welfare function (which applies a concave transformation to individual utilities before summing them) appears fundamentally incompatible with Harsanyi's result. Precisely identify which assumption(s) of Harsanyi's setup a prioritarian would necessarily reject and explain why this rejection is necessary.
  4.  Conclude by assessing the overall force of the theorem as an argument for additive social welfare functions.

  **Avoid discussing Rawls' maximin principle or the veil of ignorance argument. Focus solely on the logical structure of Harsanyi's Aggregation Theorem and its normative presuppositions.**

  ---

  ## Model Answer (Approx. 800 words)

  Harsanyi's Aggregation Theorem (HAT) is a significant formal result in welfare economics and social choice theory. It demonstrates that if individual preferences and social preferences both conform to the axioms of expected utility (EU) theory (completeness, transitivity, continuity, and the independence axiom), and if social preferences respect the Pareto principle (if everyone prefers A to B, society prefers A to B; if at least one person strictly prefers A to B and no one prefers B to A, society strictly prefers A to B), then the social preference ordering can be represented by a *linear aggregation* of individual von Neumann-Morgenstern (vNM) utility functions: W = Σ αᵢ Uᵢ, where αᵢ > 0 are individual weights and Uᵢ is individual i's vNM utility function. While often invoked to support utilitarianism, a closer examination reveals substantial normative questions embedded within its assumptions, limiting its force as a direct justification for utilitarianism and rendering it incompatible with views like prioritarianism.

  **1. The "Too Weak" Critique:** The theorem's apparent support for utilitarianism is undermined by its permissiveness regarding the weights αᵢ. The theorem guarantees that social preference is represented by *some* weighted sum of individual vNM utilities, but it places *no restriction whatsoever* on the values of these weights beyond being positive. Any set of positive weights, however unequal or seemingly arbitrary, generates a social welfare function satisfying all the stated conditions (Pareto, individual EU, social EU). A social planner prioritizing one individual's utility vastly above all others' would fulfill HAT's requirements just as well as one assigning equal weights. Consequently, the theorem alone cannot distinguish classical utilitarianism (equal weights) from radically inegalitarian forms of weighted utilitarianism. The normative content of "utilitarianism" – particularly the ethical commitment to treating individuals equally or assigning them moral weight based on specific characteristics – is not delivered by the theorem itself. That content must be supplied by *additional* ethical arguments (e.g., for equal αᵢ) external to HAT's formal machinery. Formally, HAT shows that Pareto-respecting, EU-compliant social orderings are additive, but it says nothing normatively compelling about *which* additive ordering we *should* choose.

  **2. The "Question-Begging" Critique:** A more fundamental concern arises regarding the interpretation of the individual utility functions Uᵢ. HAT takes these Uᵢ as given vNM utility functions representing individual preferences over lotteries. Crucially, for the weighted sum Σ αᵢ Uᵢ to represent a *social* ordering, the utilities must be comparable across individuals. The units and scale of each Uᵢ must be meaningfully related so that adding them (or weighted versions) makes sense. However, the vNM theorem only establishes that Uᵢ is unique up to positive affine transformations (i.e., Uᵢ' = aᵢUᵢ + bᵢ, aᵢ > 0). These transformations can be applied independently to each individual's utility scale, completely altering the interpersonal comparisons implied by any particular sum Σ αᵢ Uᵢ. HAT *presupposes* that a specific cardinal scaling, allowing for meaningful interpersonal comparisons, has already been fixed for all individuals. The theorem doesn't *derive* interpersonal comparability; it *requires* it as a prerequisite for the weighted sum to be well-defined as a representation of social preference. The core ethical problem of how to establish a common scale for comparing utility gains and losses across different people is not solved by HAT. The theorem merely shows that *if* we have made interpersonal comparisons (by fixing the cardinal scales of each Uᵢ relative to others), *and* we accept the EU axioms for society and the Pareto principle, *then* social welfare must be additive in those pre-scaled utilities. The additivity result is bought only after the hardest normative work – establishing comparable cardinal utilities – has already been assumed.

  **3. Prioritarianism and the Rejection of Social EU:** Prioritarians argue that social welfare should give greater weight to utility gains experienced by the worse off. This is typically formalized as W = Σ f(Uᵢ), where f is a strictly increasing and *concave* function. The concavity of f embodies aversion to utility inequality. HAT is fundamentally incompatible with such prioritarianism. The conflict stems directly from the requirement that *social* preferences satisfy the EU axioms, specifically the **Independence Axiom**. This axiom states that if society prefers lottery A to lottery B, then it must prefer the mixture [pA, (1-p)C] to the mixture [pB, (1-p)C] for any lottery C and any probability p (0 < p < 1). Prioritarian welfare functions violate this axiom when f is strictly concave.

  Consider three individuals and two social prospects: Prospect X gives utility 1 to person 1 and 0 to persons 2 and 3. Prospect Y gives utility 0 to person 1 and utility K (where K is large but less than 1) to persons 2 and 3. Due to the concavity of f, the marginal social value of utility for person 1 (the worst off in both prospects) is higher than for persons 2 and 3. Society might strictly prefer X to Y because giving the utility gain to the single worst-off person (1) is valued more highly than giving larger gains to two better-off persons. Now, consider mixing X and Y with a third prospect Z where everyone gets utility 0.5. The mixture [pX, (1-p)Z] gives person 1 a high chance of getting 1 (better than 0.5) and persons 2 and 3 a high chance of getting 0.5. The mixture [pY, (1-p)Z] gives person 1 a high chance of getting only 0 (worse than 0.5) but persons 2 and 3 a high chance of getting K (which could be much larger than 0.5). For sufficiently large K and sufficiently small p, society might prefer [pY, (1-p)Z] to [pX, (1-p)Z] *even though* it preferred X to Y unconditionally. This reversal of preference violates the Independence Axiom. Therefore, a prioritarian must reject the assumption that *social* preferences conform to the full suite of expected utility axioms, specifically the Independence Axiom. They argue that rational social evaluation under uncertainty need not obey the same principles as individual rational choice, particularly when evaluating distributions involving different levels of advantage.

  **Conclusion:** Harsanyi's Aggregation Theorem is a powerful technical result showing the logical link between Pareto efficiency, EU rationality at individual and social levels, and additive social welfare. However, its normative force as a justification for utilitarianism is limited. It fails to determine the ethically crucial weights (making it "too weak") and presupposes the contentious possibility of interpersonal utility comparisons (making it "question-begging"). Furthermore, its requirement for social EU rationality directly conflicts with plausible ethical positions, like prioritarianism, that value the pattern of utility distribution and exhibit inequality aversion. The theorem highlights the tensions between rationality axioms, Pareto optimality, and distributional ethics, but it does not resolve them. Its significance lies more in clarifying the assumptions required for additive aggregation than in definitively establishing utilitarianism.

  ---

  ## Marking Scheme (20 Marks Total)

  1.  **Clear Statement of Theorem (3 marks):**
      *   Accurately describes the key inputs (Individual EU, Social EU, Pareto) and the output (Social Welfare as weighted sum of vNM Uᵢ).
      *   *Weak Answer:* Vague, omits specific axioms (especially EU requirements), conflates with original position argument.

  2.  **"Too Weak" Critique Explained (4 marks):**
      *   Correctly identifies that the weights αᵢ are arbitrary positive numbers.
      *   Explains that this allows vastly unequal/iniquitous social orderings to satisfy the theorem, failing to deliver normative utilitarianism (equal weights/symmetry).
      *   *Weak Answer:* Assumes weights are equal, states the weights exist but doesn't explain normative weakness, confuses weights with interpersonal comparability.

  3.  **"Question-Begging" Critique Explained (4 marks):**
      *   Correctly identifies that vNM utilities are only unique up to individual affine transformations.
      *   Explains that for Σ αᵢ Uᵢ to be meaningful, specific cardinal scales allowing interpersonal comparison *must already be fixed* before applying the theorem; HAT does not establish comparability but relies on it.
      *   *Weak Answer:* Mentions interpersonal comparison is hard but doesn't link to vNM non-uniqueness, confuses this with the weights issue, states HAT requires comparability without explaining why it's presupposed.

  4.  **Prioritarian Incompatibility - Conflict Identified (3 marks):**
      *   States that prioritarian SWF (W = Σ f(Uᵢ), f concave) violates Harsanyi's requirement that *social preferences* satisfy Expected Utility axioms.
      *   *Weak Answer:* Only says prioritarians care about equality without linking to Harsanyi's axioms, claims incompatibility without specifying why.

  5.  **Prioritarian Incompatibility - Specific Assumption & Justification (4 marks):**
      *   **Crucially identifies the Social Independence Axiom as the point of conflict.**
      *   Explains *why* concavity causes violation (e.g., changing risk profiles can alter distributional valuations, leading to preference reversals under mixture).
      *   Clearly states prioritarians must reject the imposition of EU axioms (specifically Independence) *on social preferences*.
      *   *Weak Answer:* Vaguely states prioritarians reject "EU" without specifying which axiom or where (social level), mentions risk aversion but not the Independence axiom specifically, confuses with individual risk aversion.

  6.  **Conclusion Assessing Force (2 marks):**
      *   Provides a balanced assessment recognizing the theorem's logical structure while acknowledging the identified normative limitations (weak weights, presupposed comparability, conflict with inequality aversion).
      *   *Weak Answer:* Merely restates the theorem or critiques without synthesis, reverts to Rawls comparison.

  **A/B Differentiation Flags:**
  *   **Clear A (Distinction):** Precisely articulates the dual critique ("too weak" due to free weights *and* "question-begging" due to presupposed cardinal comparability). **Crucially identifies the *Social* Independence Axiom as the specific point of conflict with prioritarianism and explains *why* concavity causes its violation.**
  *   **Solid B (Merit):** Correctly identifies both critiques and the prioritarian conflict but may be slightly less precise on the mechanics of the Independence violation or slightly blur the distinction between the free weights and the comparability presupposition. Correctly identifies the social EU axioms as the conflict point but might not single out Independence explicitly *and* explain its violation clearly.
