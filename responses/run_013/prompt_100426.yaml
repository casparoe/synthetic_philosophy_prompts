  For consistency: The procedure must treat all cases equally at Step 0 (framing) and Step 5 (non-discrimination). The fact that they'd run pesticide but bury identical popular-product story is exactly what the non-discrimination step catches.

  For their "pet" story (c): The procedure will likely flag it at multiple points (no evidence→Step 2, high proportionality burden→Step 3) forcing either kill or escalation. That's the point - to counter confirmation bias.

