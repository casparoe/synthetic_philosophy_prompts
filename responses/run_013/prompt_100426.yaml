  Then test-drive all three cases through it, showing exactly where decisions happen. For (c), I'll highlight how their attraction to the story gets checked by the framework.

  Finally, I'll note the shakiest step (probably proportionality assessment - most subjective) and what would change my view (e.g., if they had longer timelines or scientific fact-checkers).
answer: |-
  Here's a science-editorial procedure grounded in a disciplined precautionary principle (PP) framework and risk taxonomy, designed for 20-minute assessments by non-specialists. It explicitly addresses your two core concerns (precaution cutting both ways, consistency) and includes kill/escalation triggers.

  **Core Framework:**  
  *Modified Precautionary Principle*: Act only when **ALL** are true:  
  1. **Plausible serious harm** exists (non-trivial health/environmental damage)  
  2. **Scientific uncertainty** (per Knightian categories below)  
  3. **Proportional response** (story framing matches threat level)  
  4. **Non-discrimination** (consistent with past decisions on similar evidence)  
  5. **Cost-benefit tested** (including risks *of* reporting)  

  *Uncertainty Taxonomy* (simplified for desk use):  
  - **Risk**: Known probability (e.g., "5% infection rate") → *Least precaution-warranted*  
  - **Uncertainty**: Unknown probability but known outcomes (e.g., "may cause cancer") → *PP applies*  
  - **Ambiguity**: Contested definitions/framings (e.g., "harm" disputed) → *Requires escalation*  
  - **Ignorance**: Unknown unknowns → *Kill or deep dive*  

  ---

  ### **The 6-Step Procedure** (18 mins + 2 min buffer)  
  *Time budgets are strict; use a timer. Document answers.*  

  #### **STEP 1: HARM SCREENING** (3 mins)  
  - **Q1:** Is the alleged harm **serious and non-speculative**? (e.g., cancer, developmental damage, ecosystem collapse; *not* "might cause headaches").  
  - **Q2:** Is the harm **plausibly linked** to the subject? (Mechanism proposed *or* epidemiological evidence; anecdotes ≠ plausibility).  
  - **Sufficient answer:** Yes to both → Proceed.  
  - **Kill if:** No to Q1 *or* harm is purely hypothetical ("could theoretically..." without evidence).  
  - **Handoff:** If harm is serious but link is weak → Flag for Standards Editor.  

  #### **STEP 2: UNCERTAINTY TYPING** (3 mins)  
  - **Q:** Where does this sit?  
    - **Risk:** Quantified probability → *Kill (no precaution needed; report as straight science)*.  
    - **Uncertainty:** Potential harm identified but likelihood unknown → *Proceed (PP core use case)*.  
    - **Ambiguity:** Experts dispute if this is harmful (e.g., "is this chemical *actually* toxic?") → *Escalate to Standards Editor*.  
    - **Ignorance:** No data on mechanisms/outcomes → *Kill (or 1-hr max desk research; kill if unresolved)*.  
  - **Use:** [WHO’s Uncertainty Matrix](https://cdn.who.int/media/docs/default-source/blue-print/working-group-on-risk-communication-framing-uncertainty.pdf) (bookmark this).  

  #### **STEP 3: PROPORTIONALITY CHECK** (4 mins)  
  - **Q:** What’s the **minimum credible action** that matches the threat level? (e.g., "localized detection" ≠ "toxic doom").  
  - **Test:** Would a *more severe* version of this story justify a weaker response? If yes → *Overreaction risk*.  
  - **Sufficient answer:** Story angle ≤ evidence (e.g., "preliminary finding" not "alarming new threat").  
  - **Kill if:** Only responsible framing kills the story’s news value (e.g., "tiny effect in mice" isn’t publishable).  
  - **Handoff:** If proportional framing requires expert nuance → Standards Editor.  

  #### **STEP 4: COST-BENEFIT TEST** (4 mins)  
  **Weigh two risks:**  
  - **A. Risk of *NOT* reporting** (e.g., people exposed to unpublicized danger).  
  - **B. Risk *OF* reporting** (e.g., panic, business harm, treatment abandonment).  
  - **Q:** Is **A > B** *with mitigation*? (Mitigation = framing, context, caveats).  
  - **Sufficient answer:** "A > B" with 1–2 specific mitigations proposed (e.g., "quote independent expert," "note small sample").  
  - **Kill if:** B ≥ A even *with* mitigations.  
  - **Handoff:** If B is high (health alarm/local company) → Standards Editor or EIC per protocol.  
  *▶ This defeats the "precaution is empty" objection: PP demands weighing risks OF action (reporting) vs. inaction.*  

  #### **STEP 5: NON-DISCRIMINATION CHECK** (2 mins)  
  - **Q:** Would we run this if the subject were **inconvenient**? (e.g., beloved local business vs. faceless corp).  
  - **Test:** Compare against **3 past decisions** (keep a log: "Pesticide X, 2023: ran with similar evidence").  
  - **Sufficient answer:** Consistent with past actions OR justification for deviation.  
  - **Kill if:** Inconsistent unless new evidence justifies it.  

  #### **STEP 6: REVISIT CLAUSE** (2 mins)  
  - **Q:** What would change our stance? (e.g., replication, rebuttals).  
  - **Action:** Set a **follow-up date** (e.g., 3 months) or **commit to covering developments**.  
  - **Kill if:** No plausible future evidence could resolve uncertainty.  

  ---

  ### **Test Runs**  
  **Pitch (a): Water-supply pesticide residue**  
  - Step 1: **✓** (serious harm: toxin in water; plausibility: detection + epidemiologist concern).  
  - Step 2: **Uncertainty** → Proceed.  
  - Step 3: Angle = "Local study detects [pesticide]; experts urge monitoring." **✓ Proportional**.  
  - Step 4: A (exposure risk) > B (panic? Mitigate: note no acute risk). **✓**  
  - Step 5: **Run** (consistent with past pesticide stories).  
  - Step 6: Follow up in 6 months.  
  **VERDICT: RUN** (with Standards Editor review as health alarm).  

  **Pitch (b): Reading-app preprint**  
  - Step 1: Harm = "slowing kids down" → **Serious? Debatable**. Plausibility: **✗** (no mechanism; contradicts prior studies).  
  - Step 2: **Ambiguity** (disputed harm) → Escalate to Standards Editor.  
  - Step 3: [N/A post-escalation]  
  - Step 4: Conflict of interest (authors sell competitor) → **B (reputational risk) HIGH**.  
  **VERDICT: KILL** (fails Step 1 plausibility; Step 4 risk too high).  

  **Pitch (c): OTC remedy overprescribed**  
  - Step 1: Harm = ineffective treatment → **Serious?** (if condition worsens). Plausibility: **✗** (no study; "plausible bio story" ≠ evidence).  
  - Step 2: **Ignorance** (no data) → Kill or deep dive. 20-min dive: Anecdotes + mechanism → **not publishable**.  
  - Step 3: Angle needed = "Investigation into clinic practices" → **✗** (no evidence of overprescription).  
  - Step 4: B (clinic reputation) >> A (risk of not reporting) → **✗**.  
  - Step 5: **✗** (inconsistent: we’d kill identical pitch about a vaccine).  
  **VERDICT: KILL** (fails Step 1, 2, 4, 5). *▶ Your attraction is noted; procedure blocks careerism without evidence.*  

  ---

  ### **Limitations & Bet**  
  - **Judgment dressed as procedure:** Steps 3 (proportionality) and 4 (cost-benefit) are inherently subjective. The procedure forces explicitness but can’t eliminate bias.  
  - **What it can’t do:**  
    - Compensate for lack of scientific expertise (use your epidemiologist contact for quick consults).  
    - Resolve ambiguity without escalation.  
    - Fix inconsistent past decisions (start the log *now*).  
  - **Step I’d bet against:** **Step 4 (Cost-Benefit)**. Junior staff may underweight social risks (e.g., "it’s true!" ignoring downstream panic).  
  - **What would change my mind:**  
    - If your desk had a risk-communication expert (then Step 4 strengthens).  
    - If readers are highly scientifically literate (then downgrade B in Step 4).  
    - If you had 1 hour/pitch (add "Independent expert consult" step).  

  **Recommendation:** Implement this but require Standards Editor sign-off on all Step 4 passes for 3 months to calibrate. Use your pesticide story (a) as the consistency anchor. For (c), assign a reporter to investigate properly—don’t let the procedure kill *investigative* journalism, just hot takes.
