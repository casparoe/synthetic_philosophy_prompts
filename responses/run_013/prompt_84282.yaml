answer: |-
  This is an inspired angle—*Memento* as a Libet experiment in celluloid form cuts straight to the philosophical nerve. Your intuition holds: **the film isn't a confirmation of Libet but a devastating critique of its *interpretation*.** Here's how the mapping works, where it cheats, and the neuroscience it reveals:

  ### Where *Memento* Mirrors Libet (and Subverts It)
  1. **Temporal Reversal as Libet's Timeline**  
     Nolan's reverse chronology forces us to see actions *before* motives—precisely Libet's claim (neural signal → reported urge → action). But Leonard's "reasons" (tattoos, Polaroids) are **retrospective justifications**, not unconscious precursors. *His "readiness potential" is literally written on his skin after the fact.*  

  2. **The "Urge" is Manufactured**  
     Libet assumes the *reported urge* is a real conscious experience. Leonard exposes this as fiction. When he kills Teddy ("I've done it!"), his triumphant tattoo was inked *before* he even decided his mission. **The "urge" is a story he tells himself to fit the pre-existing evidence.** (Lean hard on this scene—it's the core of your argument.)

  3. **Sammy Jankis as the Revisionist Critique**  
     Sammy's inability to form conditioned responses mirrors the "readiness potential as noise" argument. His failure shows conditioning requires memory—Leonard's procedural memory (driving, fighting) *is* intact, allowing him to act. But Sammy proves: **no memory, no meaningful neural "signal."** Leonard's system only works because he *can* condition himself (via tattoos/Polaroids)—unlike Sammy.

  ### Where the Film "Cheats" (Artistically)
  - **Leonard's Hidden Drives**: His revenge quest is fueled by unconscious guilt over his wife's death—a *true* unconscious driver Libet might recognize. But Nolan reveals this late, muddying the "post-hoc justification" purity.  
  - **Teddy's Manipulation**: External forces (Teddy planting clues) corrupt Leonard's "self-authored" intentions. Libet's experiment lacks this—it's a closed loop.  

  ### Neuroscientist's Take: What the Film Gets Right (Beyond the Lab)
  1. **Agency as Narrative, Not a Neural Event**  
     "Leonard isn't a puppet of pre-conscious decisions; he's a puppet of his own *retrospective storytelling*." A neuroscientist would nod: Libet measures milliseconds, but real-world decisions involve **narrative construction across time**. *Memento* visualizes this: Leonard's "free will" is the freedom to curate evidence.  

  2. **Externalized Cognition = Real Biology**  
     Leonard's tattoos aren't metaphors—they're **cognitive scaffolding**. Modern neuroscience embraces this: intentions aren't just in the brain; they're embedded in tools (Polaroids), environments (motel rooms), and rituals (routines). Labs struggle to capture this ecology of decision-making.  

  3. **The Feeling of Certainty ≠ Accuracy**  
     Leonard *feels* righteous because his system "works." But his certainty is built on selective data and circular logic. This mirrors how **subjective conviction in choices** (Libet's "urge") can be **post-hoc confabulation**—a known prefrontal cortex glitch.  

  ### Scenes to Lean On
  - **"I've Done It" Tattoo Reveal**: Action (killing Teddy) precedes the inscribed "reason" (avenging wife). Pure Libet structure—but the tattoo was pre-written. *This exposes Libet's "urge" as potentially manufactured.*  
  - **Teddy's Truth Bomb ("You killed your wife!")**: Shows Leonard's entire mission is a confabulation against an unbearable truth. The neural "noise" (guilt) drives him, but he constructs a palatable story.  
  - **Burning Teddy's Photo**: Leonard *choosing* to forget Teddy's warning to preserve his delusion. **Agency isn't in the act but in curating the narrative afterward.**  

  ### The Final Twist: Memento vs. Libet
  Libet claims: *"Your brain decides before you know it."*  
  *Memento* retorts: *"You decide what your brain 'decided' after you act."*  

  **Neuroscientist's verdict (hypothetical)**: "The film nails the messiness of real decisions—memory, emotion, external tools. Libet's readiness potential might be noise, but Leonard's tattoos are *signal*: proof that the *story* we build around actions is where 'free will' actually lives. Labs can't show this because they can't induce amnesia and hand you a Polaroid."  

  This approach reframes Libet not as a revelation of neural determinism, but as a cautionary tale about the stories we mistake for causality. *Memento* gives you the perfect narrative scalpel to dissect it.
