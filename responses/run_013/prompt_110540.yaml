answer: |-
  Here is a comprehensive specification of desiderata for a theory of rational choice under undefined expected value, based on the conceptual challenges posed by the Pasadena game and its variants. I'll structure it as requested, flag tensions, and briefly evaluate existing approaches.

  **Core Desiderata for a Theory of Rational Choice (When EV is Undefined):**

  1.  **Case Coverage:** Must handle:
      *   **Pasadena Game (PG):** Undefined EV due to conditional convergence.
      *   **St. Petersburg Game (SPG):** Divergent EV to +∞.
      *   **"Alt-St. Petersburg" (ASP):** Payoff = +2ⁿ/n always (diverges to +∞, but slower than SPG).
      *   **"Alt-Pasadena" (AP):** Payoff = (-1)ⁿ⁺¹ * 2ⁿ/n (Same as PG, but absolute convergence: ∑ |payoff * prob| = ∑ 1/n diverges).
      *   **Dominance Cases:**
          *   *Strict Dominance (SD):* Prospect A pays $1 more than Prospect B in *every* state (both may have undefined EV). *Rational Requirement:* A ≻ B.
          *   *Statewise Dominance (SWD):* Prospect A pays at least as much as Prospect B in every state, and strictly more in some state with positive probability (both undefined EV). *Rational Requirement:* A ≻ B.
      *   **Complete Dominance (CD):** Every possible outcome of Prospect A is strictly better than every possible outcome of Prospect B (e.g., A: PG, B: PG with all payoffs negative). *Rational Requirement:* A ≻ B.
      *   **Pairwise Choice:** Must rank (or declare incomparable) pairs like:
          *   PG vs. $0 (do nothing).
          *   PG vs. SPG.
          *   PG vs. ASP.
          *   PG vs. a finite sure gain (e.g., $10).
          *   PG vs. a finite sure loss (e.g., -$10).
          *   Two different conditionally convergent games (e.g., PG vs. a rearranged payoff schedule).
      *   **"Swindle" Intuition:** Capture why PG might *feel* like a bad deal despite potential large gains.
      *   **Small Payments:** Handle willingness to pay small amounts to play or avoid PG (conflicting intuitions exist).

  2.  **Distinctions to Respect:**
      *   **Defined (Finite) EV vs. Divergent (Infinite) EV vs. Undefined EV:** Crucial difference between SPG (+∞), ASP (+∞), PG (undefined).
      *   **Conditional vs. Absolute Convergence:** Undefined EV arises *specifically* from conditional convergence (PG, AP) vs. divergence (SPG, ASP) or absolute convergence (finite EV). AP should be treated as divergent, not undefined.
      *   **Direction of Divergence:** Distinguish divergence to +∞ (SPG, ASP) vs. divergence to -∞ (e.g., "Negative St. Petersburg").
      *   **Risk Attitudes:** The theory should *allow* for diverse risk attitudes (risk-aversion, risk-seeking, risk-neutrality) but not *require* any specific attitude as the only rational one when EV is undefined. Permissible attitudes might influence choices in PG.
      *   **Finite vs. Infinite Payoffs:** Respect the role of dominance even when payoffs are unbounded.

  3.  **Theoretical Consistency:**
      *   **Measure Theory/Probability:** Be consistent with results on convergence:
          *   Respect that conditional convergence implies order-dependence.
          *   Respect that absolute convergence implies order-independence.
          *   Acknowledge that standard countable additivity fails for conditionally convergent series.
      *   **Decision Theory Axioms:** Be compatible with (or justify deviations from) core axioms where possible:
          *   *Dominance (SD, SWD, CD):* Must be satisfied when applicable.
          *   *Continuity:* Small changes in probabilities/payoffs *with defined EV* should lead to small changes in value. This may need relaxation for undefined EV cases.
          *   *Completeness:* Prospect A ≻ B, B ≻ A, or A ∼ B for all A, B. *This is a major point of contention.*
          *   *Transitivity:* If A ≻ B and B ≻ C, then A ≻ C.
      *   **Expected Utility Theory (EUT):** Reduce to standard EUT when EV is defined (finite or infinite).

  4.  **Puzzles to Dissolve/Explain:**
      *   **The "Play for a Penny?" Puzzle:** Why might someone feel it's rational to pay a small positive amount (e.g., $0.01) to play PG? (Reflects focusing on early positive terms).
      *   **The "Avoid at all Costs?" Puzzle:** Why might someone feel it's rational to pay a small amount *to avoid* PG? (Reflects focusing on potential large negative terms or risk aversion).
      *   **The "Swindle" Intuition:** Explain why PG feels deceptive or like a scam, despite the potential for large positive payoffs. (Reflects the order-dependence making the "average" outcome manipulable and the high weight of tails).
      *   **Indifference to Order:** Why does rearranging payoffs *feel* like it shouldn't change the value of the game, even though mathematically it does? (Highlights the clash between intuition and conditional convergence).
      *   **Comparisons to Definite Prospects:** Explain how PG relates to $0, small sure gains/losses, SPG, ASP.

  **Flagged Tensions Between Desiderata:**

  1.  **Order-Invariance vs. Strict Dominance (SD) in PG:** *(Severe Conflict)*
      *   **Tension:** PG's value depends on summation order. Consider two prospects:
          *   `PG_std`: Summed in natural order (n=1,2,3,...).
          *   `PG_rearr`: Summed in an order that makes partial sums diverge to +∞ (e.g., group many large positive terms before a negative one).
      *   **Problem:** `PG_rearr` strictly dominates `PG_std` in this specific ordering sense. Yet, they are the *same physical game*! Requiring SD (`PG_rearr ≻ PG_std`) conflicts with the demand that the *same prospect* should have the *same value* regardless of how we *describe* it (order-invariance of description).
      *   **Why it matters:** Any theory assigning a single, order-invariant value to PG violates SD under rearrangement. Any theory strictly applying SD must assign different values to different orderings of the same game, violating description-invariance.

  2.  **Completeness vs. Respecting Undefinedness:** *(Fundamental Philosophical Conflict)*
      *   **Tension:** The core problem is that standard EV *fails* to assign *any* value to PG. Desideratum 1 demands pairwise choices. Desideratum 3a (measure theory) confirms the failure.
      *   **Problem:** Insisting on Completeness (every pair ranked) *forces* the theory to assign values or comparisons where the standard mathematical foundation provides none. This risks being arbitrary or masking the underlying pathology. Conversely, allowing incompleteness (A and B are incomparable) respects the undefinedness but might be seen as leaving rational choice theory silent where guidance is desired (desideratum 4).
      *   **Prejudice Alert:** *Completeness* is a strong axiom often assumed in EUT for elegance and determinacy, but it's not self-evidently required by rationality, especially in pathological cases. *Insisting on Silence* reflects a view that rationality requires a solid foundation (defined expectation) and is permissive otherwise.

  3.  **Continuity (Small Payments) vs. Undefined EV:** *(Significant Challenge)*
      *   **Tension:** Intuitions suggest people might pay $0.01 to play PG or pay $0.01 to avoid it (desideratum 1f, 4a, 4b). This resembles continuity: PG should be worth slightly more than $0 or slightly less.
      *   **Problem:** PG's undefined EV means there's no anchor point ($0) to be slightly above or below in a well-defined way. Assigning a precise value near $0 contradicts the undefinedness. Explaining the *intuition* without endorsing a specific value is possible, but satisfying the intuition as a *rational requirement* (e.g., "You *should* pay up to $0.01 to play") is problematic.

  4.  **Capturing Risk Aversion/Seeking vs. Objectivity:** *(Moderate Tension)*
      *   **Tension:** Risk aversion might explain paying to avoid PG; risk seeking might explain paying to play (desiderata 2d, 4a, 4b).
      *   **Problem:** Should the theory allow these attitudes to *determine* the choice in PG? Or is there an "objective" rational stance (e.g., indifference or incomparability to $0) that risk attitudes modify? The former leans towards permissivism; the latter seeks a core rational verdict.

  **Evaluation of Existing Approaches (Against Key Desiderata & Tensions):**

  1.  **Permissivism (Friend's View: Rationality Silent, All Choices Permissible):**
      *   **Satisfies:** 2a, 2b, 2c, 2d (trivially), 3a (fully respects undefinedness), 3b (avoids violating axioms by being silent), 4c, 4d (explains clash by accepting silence).
      *   **Fails:** 1d (SD/SWD/CD - allows choosing dominated option), 1e (fails to rank any pairs determinately), 3b (Dominance Axioms violated as permissible), 4a, 4b (doesn't explain why intuitions lean certain ways, just permits them). *Ignores dominance.*
      *   **Tensions:** Avoids 1 & 2 by rejecting completeness and dominance requirements. Embraces silence demanded by 3a.

  2.  **Extended Real Numbers (±∞):**
      *   **Satisfies:** 1b (SPG = +∞), 1c (ASP = +∞), 3b (SD/SWD/CD if infinities handled carefully), 4c (PG = ?).
      *   **Fails:** 1a (Forces PG to +∞, -∞, or undefined; first two are wrong, last is permissive), 2a (Fails to distinguish undefined vs divergent), 2b (Cannot represent conditionally convergent), 3a (Violates measure theory by assigning a value), 4a, 4b (Assigning ∞/-∞ doesn't explain small payment intuitions). *Misclassifies PG as divergent.*

  3.  **Finite Truncation (e.g., Paul Laudet's Approach):** Compute EV over first N flips, let N→∞ *after* choice.
      *   **Satisfies:** 1a (PG converges to ln(2) ≈ $0.69), 1d (SD/SWD/CD handled via finite cases), 1e (Provides rankings), 3b (Reduces to EUT for truncations), 4a (Says pay up to ~$0.69 to play), 4c (Shows it's "favorable" on average in finite horizon).
      *   **Fails:** 1b, 1c (SPG/ASP EV(N) →∞, but choice between SPG and $X is ambiguous for finite N), 2a (Treats PG (defined) vs SPG (undefined under truncation?) differently, but not clearly respecting true divergence), 2b (Hides conditional convergence), 3a (Violates by depending on a specific limit order), 4b, 4d (Doesn't capture the swindle/rearrangement danger). *Privileges a specific order (natural order).*

  4.  **Rank-Dependent Utility (RDU) / Risk-Weighting:** Transform probabilities non-linearly.
      *   **Satisfies:** 2d (Can encode risk aversion/seeking), 4a, 4b (Can model willingness to pay/avoid based on risk attitude).
      *   **Fails:** 1a (Highly sensitive to probability weighting function - can make PG positive, negative, or undefined; *ad hoc*), 1d (SD/SWD may fail if weighting is non-linear), 3a (Doesn't inherently respect convergence properties), 3b (May violate dominance). *Arbitrary parameterization.*

  5.  **Stochastic Dominance (SD/SWD as Primary):**
      *   **Satisfies:** 1d (Core strength), 3b (Core strength).
      *   **Fails:** 1a, 1b, 1c, 1e (Fails to rank non-dominated pairs like PG vs $0, PG vs SPG), 2a, 2b (Doesn't address the convergence distinction directly). *Incomplete.*

  6.  **Imprecise Probabilities / Sets of Priors:** Consider a set of possible probability measures (or summation orders).
      *   **Satisfies:** 2a, 2b, 3a (Can represent undefinedness via a set of values, e.g., interval [-∞, +∞] or (-∞, +∞)), 2d (Can incorporate risk via the set or decision rule), 4c, 4d (Captures ambiguity).
      *   **Fails:** 1d (SD/SWD hold only if *all* priors agree; PG vs PG_rearr would be incomparable if both sets span [-∞, +∞]), 1e (Needs a decision rule over sets - Maxmin? Maxmax? Hurwicz? - choice is arbitrary and leads to very different rankings), 4a, 4b (Depends entirely on decision rule). *Moves arbitrariness to the decision rule.*

  7.  **State-Dependent Utility / Canonical Order:** Privilege the natural order (n=1,2,3,...) as the "true" description.
      *   **Satisfies:** 1a (PG = ln(2)), 1d (SD/SWD/CD hold within the canonical description), 1e (Provides rankings), 3b (Reduces to EUT with canonical order), 4a (Pay up to ln(2)).
      *   **Fails:** 2b (Ignores the mathematical reality of conditional convergence - other orders are equally valid mathematically), 3a (Violates by depending on an arbitrary choice of description), 4d (Fails to explain the "swindle" - why is rearranging cheating if the math allows it?). *Arbitrarily privileges one description.*

  **Conclusion on Permissivism:**

  Your friend's permissivism **succeeds** in respecting the core mathematical undefinedness (Desiderata 2a, 2b, 3a) and avoiding arbitrariness but **fails catastrophically** in handling dominance (Desiderata 1d) and providing any guidance for pairwise choices (Desiderata 1e). The **key tension** is between respecting the mathematical pathology (undefinedness, order-dependence) and preserving foundational rational principles like dominance and the desire for completeness.

  *   **Is Permissivism Forced?** No. While no approach perfectly satisfies all desiderata, approaches like Imprecise Probabilities (with a suitable decision rule) or Finite Truncation attempt to provide determinate verdicts. However, they do so by making substantive (and arguably arbitrary) choices about order, description, or decision rules, violating the "purity" of respecting the undefinedness. Dominance reasoning provides *some* constraints even under permissivism (ruling out dominated choices), but your friend's strong permissivism likely rejects this.
  *   **Is Permissivism Defensible?** Yes, but with a caveat. It's defensible if one prioritizes foundational mathematical consistency (Desiderata 2a, 2b, 3a) and views the failure of dominance in cases like `PG_std` vs `PG_rearr` as exposing a deep problem where rationality *cannot* give coherent guidance without introducing arbitrariness. It becomes less defensible if one views dominance (especially Strict and Statewise) as a non-negotiable pillar of rationality that must constrain permissibility even in pathological cases. The tension between Desiderata 1d and the implications of 2b/3a is fundamental.

  The desiderata list reveals that **any** non-permissive approach must sacrifice either strict adherence to measure-theoretic convergence properties or the principle that rearranging the description of the *same physical prospect* shouldn't change its value. Permissivism sacrifices the demand for complete, dominance-respecting guidance. There is no free lunch.
