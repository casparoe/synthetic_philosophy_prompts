  Next, considering the unspoken needs. The user might be frustrated with the circular debate and wants a way to break the deadlock. Their lab needs a framework to structure their discussions, maybe a shared vocabulary or experimental approaches that address both concerns. They might also need validation that both sides have valid points but are talking past each other.

  To diagnose: It's partly verbal—different definitions of "representation." But also methodological—what evidence suffices? The anti-probe side likely demands interventions showing causal necessity, while the pro-probe side accepts correlative evidence as sufficient. This ties into epistemic differences: what makes an explanation satisfying? Is it about prediction (information) or understanding mechanisms (causality)?

  For progress, suggesting a distinction like "encoded information" vs. "causal representation" could help. Pushing for intervention-based experiments, like ablation or causal mediation, might resolve specific cases. Also, agreeing on what constitutes a "win" for each side—like if a probe works but ablation doesn't affect performance, it's encoded but not causal. Reframing the question to "How is this concept used?" instead of "Is it represented?" might shift the focus.

