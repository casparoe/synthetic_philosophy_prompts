answer: |-
  Here’s your Q&A battle plan, ordered by damage potential (high to low), with objections phrased as they’ll likely come, your razor replies, and soft spots flagged. The room’s allergy to grand narratives means they’ll attack your framing first, not your facts.

  ### **1. High Damage: "You’re Erasing Catastrophe" (Settlement Specialist, likely Maya/LBA)**  
     *Objection:* "In my survey area, we see *total* settlement abandonment in the Terminal Classic—not ‘recombination,’ but scorched earth. Your ‘decomposition’ ignores the trauma in the dirt. People *fled* or died. Isn’t this just semantic laundering of collapse?"  
     **Your Reply:** "Settlement discontinuity at *X scale* (e.g., micro-region) ≠ societal collapse. Trauma? Absolutely. But maize systems persisted in adjacent valleys, populations nucleated at defensible sites, and ceramic traditions didn’t vanish—they *fragmented*. Your data shows tiered disintegration, not erasure."  
     **Soft Spot:** If their data shows synchronous, pan-regional abandonment of agro-systems (rare), your "parts persist" claim wobbles.  

  ### **2. High Damage: "Decomposition is Just Collapse Lite" (Complexity Theorist)**  
     *Objection:* "You’ve swapped ‘collapse’ for ‘decomposition’ but haven’t defined the threshold. If a state shatters into chiefdoms and loses 90% of its population, is that not collapse? Your framework feels like a tautology: nothing ever dies, it just ‘recombines’."  
     **Your Reply:** "Thresholds are the point! Collapse implies *irreversible* termination of key functions (farming, habitation). Decomposition tracks *reconfigurable* systems—like LBA trade networks fragmenting into regional circuits. The difference is agency and adaptability, not scale of damage."  
     **Soft Spot:** You need a clear, non-arbitrary metric for when decomposition becomes collapse (e.g., total loss of agro-ecological knowledge?).  

  ### **3. Mid Damage: "Rapa Nui *Did* Collapse—Ecologically" (Rapa Nui Specialist)**  
     *Objection:* "Pollen cores show near-total deforestation. Sediment layers indicate starvation. Your ‘moral fable’ jab ignores the hard science: the society *overshot*, and decomposition was collapse by another name."  
     **Your Reply:** "Deforestation ≠ societal collapse. Post-contact ethnography shows a functioning, adaptive society. The ‘overshoot’ narrative assumes irreversibility—but Rapa Nui didn’t vanish; it retooled. The fable isn’t that things changed; it’s that change equaled failure."  
     **Soft Spot:** If they cite pre-contact population crash (contentious), your "persistence" argument strains.  

  ### **4. Mid Damage: "Palace Collapse *Was* Societal Collapse" (LBA Specialist)**  
     *Objection:* "When palaces burned, literacy, bureaucracies, and specialized crafts vanished for centuries. That’s not ‘decomposition’—it’s systems failure cascading through scalar levels. What’s society if not its institutions?"  
     **Your Reply:** "Institutions != society. Linear B disappeared, but vernacular cults (e.g., Hathor in Canaan) and domestic economies thrived. The ‘collapse’ was of a political superstructure—not the substrate. Dark Ages are only ‘dark’ if you’re elite."  
     **Soft Spot:** Literacy loss is a real rupture. If they argue oral tradition couldn’t preserve complexity, you’re on weaker ground.  

  ### **5. Low Damage: "Stop Anthropomorphizing ‘Society’" (Theory Skeptic)**  
     *Objection:* "‘Society’ decomposing? ‘Parts persist’? This is functionalist organicism. We should be talking about networks of human/non-human actors fracturing, not abstract wholes."  
     **Your Reply (Lean In):** "Agreed—that’s *why* ‘collapse’ misleads. Decomposition is a network metaphor: nodes (villages) and flows (trade) reconfigure. Let’s ditch ‘society’ for your preferred ontology, but ‘collapse’ still misdescribes the process."  
     **Soft Spot:** None. You’ve co-opted their critique.  

  ### **6. Low Damage: "Isn’t This Just Resilience Theory Repackaged?" (Complexity #2)**  
     *Objection:* "Your ‘decomposition’ sounds like a resilience cycle: release → reorganization. Why not use that framework instead of inventing terms?"  
     **Your Reply:** "Resilience theory often smuggles in equilibrium assumptions. Decomposition is agnostic about recovery. My point: what we call ‘collapse’ *is* the reorganization phase—just faster and messier than models predict."  
     **Soft Spot:** If they cite adaptive cycles (Panarchy), you’ll need to distinguish your "no Phoenix moment" stance.  

  ---

  ### **The Nightmare Question You Hope Nobody Asks:**  
  *"If decomposition is your universal solvent, give us **one** example where you’d *accept* ‘collapse’ as the right term. If nothing qualifies, is this just a nihilistic semantic game?"*  

  **Why It Kills:** Forces you to defend a negative claim (no true collapse) and define a falsifiable threshold—which you’ve avoided. It also implies your model explains everything, undermining its credibility.  

  **Your Reply (Gambit):** "The burden isn’t on me to define collapse—it’s on its proponents to prove total systemic termination. But fine: if we found a civilization where *all* settlements emptied, agro-knowledge vanished, *and* no recombination occurred within 200 years? That’d qualify. Now show me the case."  
  **Soft Spot:** They might cite small-scale examples (e.g., Greenland Norse) or accuse you of moving goalposts.  

  ---

  ### **Tactical Notes:**  
  - **Order Matters:** Expect the Maya/LBA settlement blowback first (they’re emotionally invested in "their" collapse). Complexity theorists will wait to pounce.  
  - **Their Buzzwords:** "Scalar collapse," "systems failure," "event horizon," "resilience trajectory," "material ontology."  
  - **Your Mantra:** "Rupture isn’t erasure. Transformation isn’t termination."  
  - **Win Condition:** You don’t need to convince them "decomposition" is perfect—just that "collapse" is actively harmful. Their anti-Diamond bias is your ally.  

  **Final Tip:** When pressed, pivot to *methodology*: "If we call every major transformation ‘collapse,’ we stop looking for how people adapted. That’s not just wrong—it’s unethical." That’ll silence the room. Now go stab sacred cows. 🔪🐄
