  For objection sequencing: The most damaging critiques will attack the heart of the claim—denying catastrophic change where they see it—or expose definitional vagueness. Mid-tier objections will challenge applicability to all three cases equally. Lower-tier will be theoretical quibbles. The question the user fears most? Probably one where a specialist presents irrefutable local evidence of near-total abandonment that fits "collapse" better than "decomposition." 

  Crafting replies requires balancing scholarly rigor with rhetorical force. Where the user's position is soft (e.g., Rapa Nui's thin evidence), replies should acknowledge nuance without conceding the core thesis. The goal isn't to "win" but to frame decomposition as a useful heuristic—especially since the audience already rejects collapse narratives. 

  The nightmare question: A Rapa Nui specialist citing paleodemographic data showing rapid population decline post-monument construction. The user's reply strategy here is damage control—distinguishing demographic shock from systemic collapse—but it's the weakest point in their triad. 

