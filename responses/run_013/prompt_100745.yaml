  5. The one dreaded question

  The sinking objection would likely come from the analytic liberals - they'd attack the practical implications. If the user can't show how their critique changes real-world policy (speech codes, platform moderation etc.), their whole argument seems academically moot. 

  For neo-republicans, expect technical pushback on the counterfactual's role. They'll argue it's precisely what makes non-domination distinct. The Hobbes scholar will attack the positive/negative framework itself. 

