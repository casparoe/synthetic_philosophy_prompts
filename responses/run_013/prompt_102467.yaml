prompt: |-
  I would like help identifying a phenomenon, and if it has no established name, I would like it named and delimited carefully rather than merely labelled.

  The pattern is this. I have a reasonably accurate model of my own future behaviour, and I keep catching myself making decisions whose function seems to be to spare me from having to act on them. A concrete case: at eleven at night, clear-headed, I decide that I will run at six. I do not merely hope to run; I decide to, and the decision is sincere in the way my decisions generally are. I also know, with roughly the confidence I place in any empirical prediction about myself, that at six I will not run — I have run this experiment dozens of times and the result is not in doubt. What I cannot place is the work the decision does. Making it feels like the matter is settled. Having settled it, I stop turning it over. And when six comes and I do not run, the lapse does not land as a failure; it lands as something already folded into the account. The decision did not bind my future self; it discharged my present one. A second case, less bodily: I decide to finally read the primary sources this time, and the deciding is so satisfying that the reading quietly stops being something I still owe.

  What makes me think this is its own thing, rather than a synonym for weakness of will or for wishful precommitment, is the direction the discounting runs. In the ordinary story about akrasia, present bias explains why I fail to do the thing. Here it seems to explain why I make the decision at all. The resolution pays out now — relief, the sense of being a person with a plan — while the act it names costs now and pays later. Resolving is thus a cheap way to collect the reward the act was supposed to be for, and the larger the future benefit, the better the resolution feels and the less pressure remains to secure it. That inversion is the part I care about, and it is the part I have never seen stated as its own phenomenon.

  I want the carving, not the label. So: does this have an established name? If it is nearest to something existing — precommitment or Ulysses contracts, self-signalling, the intention–behaviour gap, moral licensing, ordinary self-deception — I want to know precisely where the fit breaks. Precommitment is meant to constrain the future self, and this does the opposite. Self-signalling is about what I infer about myself, whereas here the apparent effect is on what I no longer feel I have to do. If nothing established matches, please coin a term, define it, and give me its edges. Is the distinguishing feature the discharge of motivation, the temporal location of the payoff, the sincerity of the resolution, or some combination? Where does it shade into ordinary planning, into self-deception, and into straightforwardly lying to oneself? And what would a clean case look like that has the discharge without the insincerity, or the present-biased payoff without the discharge — something to fix the boundary on either side.
reasoning: |-
  Okay, the user is describing a fascinating psychological pattern where making a decision about a future action provides immediate satisfaction, effectively discharging their present obligation to act, even when they know they won't follow through. They want to know if this phenomenon has a name or if it's a distinct concept that needs defining.

  First, I need to verify if this matches any known psychological concepts. Akrasia (weakness of will) usually involves intending to act but failing due to impulses. Here, the decision itself seems to replace the action. Precommitment is about binding future behavior, but this does the opposite by releasing the agent from future action. Self-signaling involves interpreting actions as evidence of traits, but here the decision reduces the need to act. Moral licensing allows indulgence after virtuous acts, but this is about a decision substituting for action. None fit perfectly.

  The key elements are: sincere resolution, accurate prediction of failure, immediate payoff (relief), motivational discharge, and no binding of future self. The inversion of temporal discounting is crucial—the reward is front-loaded, reducing future motivation.

  The user wants precise boundaries. A clean case might involve sincere resolution with accurate prediction, immediate relief, and no subsequent effort. Contrast with ordinary planning, which doesn't discharge motivation, and self-deception, which involves false belief. The core is the motivational discharge from the resolution itself.

  Coining a term: "Motivational Discharge via Anticipated Resolution" captures the essence. Defining it with necessary conditions: sincerity, accurate prediction of failure, immediate affective payoff, discharge of felt obligation.

  Boundaries: Without sincerity, it's self-deception. Without discharge, it's just akrasia. Without accurate prediction, it's wishful thinking. The phenomenon is distinct in its structure of substituting resolution for action, leveraging temporal discounting inversely.
answer: |-
  Your description captures a distinct psychological phenomenon that isn't fully encompassed by existing terms. After analyzing its structure, I propose the name **Motivational Discharge via Anticipated Resolution (MDAR)**. Below is a precise dissection, including boundaries, contrasts with existing concepts, and diagnostic criteria.

  ---

  ### **Core Definition of MDAR**
  **MDAR**: *A present cognitive act (e.g., a resolution or decision) that generates immediate affective reward (e.g., relief, satisfaction) by symbolically "settling" a future obligation, thereby discharging the motivational tension associated with it, even when the agent accurately predicts they will not execute the action.*

  #### **Necessary Conditions**
  1.  **Sincere Resolution**: A genuine commitment is formed in the present moment.
  2.  **Accurate Prediction of Failure**: The agent holds a well-calibrated belief that the action will *not* be performed, based on empirical self-knowledge.
  3.  **Immediate Affective Payoff**: The resolution delivers emotional relief *now* (closure, identity reinforcement, cognitive offloading).
  4.  **Motivational Discharge**: The felt obligation to act diminishes or vanishes after resolution.
  5.  **Non-Binding Future Effect**: The resolution exerts no constraining force on future behavior.

  ---

  ### **Contrast with Existing Concepts**
  | Concept             | Why It Doesn't Fit MDAR                                                                 |
  |---------------------|-----------------------------------------------------------------------------------------|
  | **Akrasia**         | Focuses on *failure to act* despite intention. MDAR explains why the *intention itself* is formed as a substitute for action. |
  | **Precommitment**   | Designed to *bind* the future self (e.g., Ulysses contracts). MDAR *releases* the future self. |
  | **Self-Signaling**  | Resolutions serve as evidence of traits/identity. In MDAR, the resolution *replaces* the need for evidence via action. |
  | **Moral Licensing** | Past virtuous acts license future indulgence. MDAR uses a *present symbolic act* (resolution) to license *immediate inaction*. |
  | **Intention-Behavior Gap** | Describes the disconnect but doesn't explain the *function* of the intention. MDAR explains the gap as a *feature*, not a bug. |
  | **Self-Deception**  | Requires false belief ("I *will* run"). MDAR involves accurate prediction ("I won't run, but deciding *now* feels good"). |

  ---

  ### **Boundaries & Diagnostic Cases**
  #### **What MDAR Is NOT**
  - **Ordinary Planning**:  
    *Clean contrast*: Deciding to run at 6 AM *without* predicting failure. Motivational tension *persists* until action is taken. No discharge occurs.  
    *Boundary*: MDAR requires the prediction of failure + discharge. Planning lacks both.

  - **Straightforward Self-Deception**:  
    *Clean contrast*: Believing "I'll *definitely* run this time!" despite past failures. The resolution feels good due to *false hope*, not discharge.  
    *Boundary*: MDAR relies on accurate prediction; self-deception requires false belief.

  - **Procrastination via Delay**:  
    *Clean contrast*: "I'll run *later*" to avoid acting now, but without sincere resolution or discharge. Motivational tension remains.  
    *Boundary*: MDAR requires a "settling" resolution + affective payoff.

  #### **Edge Cases Highlighting Key Features**
  1.  **Discharge Without Insincerity** (Core MDAR):  
      *You decide to read Proust, feel profound relief ("I'm a serious reader!"), accurately predict you won't, and feel no guilt when you don't.*  
      → Sincerity + Discharge + Accurate Prediction = **MDAR**.

  2.  **Present-Bias Without Discharge** (Not MDAR):  
      *You decide to run, feel temporary euphoria, but the obligation lingers ("I *must* do this"). At 6 AM, you feel guilty while hitting snooze.*  
      → Payoff without discharge = **Akrasia + Temporal Discounting**.

  3.  **Discharge Without Resolution** (Not MDAR):  
      *You realize running is unrealistic, drop the goal, and feel relief.*  
      → Discharge without resolution = **Goal Abandonment**.

  ---

  ### **Mechanism & Why It's Distinct**
  The inversion of temporal discounting is MDAR's hallmark:  
  - **Standard Model**: Action costs now (effort), rewards later (health).  
  - **MDAR Model**: *Resolution* rewards now (relief), *inaction* costs nothing later (due to discharge).  

  This creates a perverse incentive: the more valuable the *future* reward (e.g., writing a novel), the more satisfying the *present* resolution ("I'll start tomorrow!"), and the less motivation remains to act. The resolution becomes a cognitive token exchanged for immediate gratification.

  ---

  ### **Term Justification: "Motivational Discharge via Anticipated Resolution"**
  - **Motivational Discharge**: The core mechanism (obligation dissipates).  
  - **Via Anticipated Resolution**: The means (a decision that symbolically "pre-completes" the task).  
  - **Why not "Resolution Substitution" or "Symbolic Precompletion"?** These miss the *affective payoff* and *accurate prediction* elements. MDAR explicitly names the engine (discharge) and vehicle (resolution).

  This phenomenon operates at the intersection of self-regulation, temporal cognition, and affective neuroscience—where a cognitive act hijacks reward pathways meant for action completion. It deserves its own category precisely due to this inverted incentive structure.
