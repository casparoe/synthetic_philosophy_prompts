prompt: |-
  Ok so I've got a colloquium talk next week and I need to get ready for the Q&A, and I'd rather not get filleted in front of my own department. Can you put together a prep sheet for me? Role-wise: think of yourself as a formal epistemologist who's sat through a hundred of these and knows the difference between the objections that actually get made in a room and the ones that only exist in the literature.

  The talk: I'm arguing that the standard way everyone frames "uncertain evidence" is confused. The usual story goes that sometimes experience doesn't hand you a proposition you're certain of, it just nudges your credences around, and Jeffrey conditionalization is the rule for that case. My line is that there's no such case. What actually happens when you catch a glimpse of something in bad light is that you come to be *certain* of something -- namely, of a fact about your own credences. You become certain that your credence in E is now q. And then Jeffrey conditionalization isn't a special rule at all, its just ordinary conditionalization on that proposition, carried out in an enriched space where propositions about your own credences live alongside propositions about the world. I claim that once you see it this way, a bunch of the standard complaints either dissolve or turn out to be complaints about something else entirely.

  I've got canned answers to the obvious stuff. What I need from you is the stuff this particular room will actually throw at me. The audience: mostly formal epistemologists. Two of them work on diachronic Dutch book arguments and on the accuracy-dominance arguments for conditionalization -- they think the only update rule that can't be accuracy-dominated is plain conditioning, and they know that literature inside out. One is a hardline subjective Bayesian who thinks any constraint on how credences may change is an unwarranted imposition. There's a philosopher of statistics who always asks about calibration and likelihoods and where the numbers come from. And the commentator is a grad student who works on the reflection principle and will definately find the one spot where my view forces a reflection-style constraint I didn't want.

  What I want:

  - First brainstorm: dump every objection you can think of, then cut ruthlessly down to the ones this specific room will raise. I want the second list, not the first.
  - Order them by how much damage they'd do -- that's likelihood times severity, so a likely-but-easy one sits below an unlikely-but-fatal one.
  - Phrase each the way that person would actually phrase it, in their vocabulary, not in mine. Attribute them where you can ("the Dutch book person will say...").
  - For each: the reply I should give, short enough to say in under two minutes, plus a line on where the reply is soft or hand-wavy, and what I should just concede up front rather than fight.
  - Flag any objection that I should treat as a real problem with the view rather than a misunderstanding I can bat away. Don't be nice to me.
  - And at the end, the one question I'm hoping nobody asks -- the one that goes straight at the weakest joint.

  Don't send me off to read things, I know the literature. Give me the arguments themselves, not citations. Think it through carefully before you write; I'd rather have six objections that are right than fifteen that are generic.
