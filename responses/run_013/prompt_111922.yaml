  ### Procedure: Baseline-Explicit Act/Omission Protocol

  **Purpose**: To distinguish between actively causing harm ("doing") and allowing harm through inaction ("allowing") by making explicit how the baseline (expected course without intervention) is set. Ends in a recommendation.

  ---

  #### Steps in Order:
  1. **Define the Baseline**  
     *Question*: "What is the medically expected outcome if no changes are made to *current, ongoing interventions*?"  
     *Sufficient answer*: A clear prognosis (e.g., "death in 3 days with current ventilation") based on objective medical evidence.  
     *If no*: Hand back to the committee—no further steps.  
     *Judgment call?*: Yes.  
     *Why judgment can't be eliminated*: Baselines are set by existing policies (e.g., "default to full treatment") or past decisions (e.g., initiating feeds), not nature.  

  2. **Categorize the Proposed Change**  
     *Question*: "Is the proposal to (a) withdraw an existing intervention, (b) withhold a new intervention, or (c) add a new intervention?"  
     *Sufficient answer*: Select (a), (b), or (c).  
     *If no*: Hand back—ambiguous proposals invalidate the procedure.  
     *Judgment call?*: No (factual classification).  

  3. **Test for Baseline Alignment**  
     *Question*: "Does the proposal return the patient to the baseline from Step 1?"  
     - *Withdrawal (a)*: Aligns if stopping an intervention *actively maintaining deviation* from the disease’s natural course (e.g., stopping dialysis in renal failure).  
     - *Withholding (b)*: Aligns if not starting an intervention *not part of current care*.  
     - *Adding (c)*: Never aligns—it creates a new causal pathway.  
     *Sufficient answer*: Yes (aligns) or No (does not align).  
     *If no*: Classify as **doing**. Stop—proceed to ethical triage (Step 4).  
     *If yes*: Classify as **allowing**. Stop—proceed to ethical triage (Step 4).  
     *Judgment call?*: Yes.  
     *Why judgment can't be eliminated*: "Actively maintaining deviation" depends on local norms (e.g., is tube feeding "natural" or "artificial"?).  

  4. **Ethical Triage (Non-Consequentialist)**  
     *Question*:  
     - If **doing**: "Is the act a legally permitted, proportional symptom-relief measure (e.g., morphine for pain)?"  
       → *Yes*: Support. *No*: Oppose.  
     - If **allowing**: "Is the intervention refused by a competent patient/surrogate OR medically inappropriate (futile/burdensome)?"  
       → *Yes*: Support. *No*: Oppose.  
     *Sufficient answer*: Yes/No based on institutional policy or law.  
     *Judgment call?*: No (applies predefined criteria).  

