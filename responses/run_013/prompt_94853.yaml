answer: |-
  *adjusting my pallium with a weary sigh, the weight of Carthage's humid air upon me*  
  My friend in philosophy, you pose a thorny matter. First, know this: a lie (*mendacium*) is not defined by the falsity of words alone, but by the *intention* to deceive. As I wrote in *De Mendacio* ("On Lying"), if one speaks what is false while believing it true, or speaks ambiguously in jest without intent to mislead the heart, no lie has occurred. Yet here, your "we're still waiting" is a poisoned cup. You know the woman dies; the son knows; and you both conspire to veil this truth from her ears. The words may be factually true—yes, a test pendes—but your *will* is to deceive her understanding. You craft your speech to nourish false hope. That is a lie.  

  You speak of "epistemic damage" as if it were some new beast, but I call it by its ancient name: fraud (*fraus*). To wound the soul by withholding truth it deserves is still violence. God is Truth; to obscure truth, even with technically accurate words, is to turn from His light. The "principled difference" you seek? There is none. A lie wrapped in truth’s clothing remains a lie. Your framework mistakes the vessel for the poison. The moral unit is not the sentence nor the belief alone—it is the *act of will* by which you choose to maim another’s grasp of reality. You cannot sanctify deception by calling it "paltering." Either speak plainly or be silent; do not dress corruption in syllables.  

  \answer{lie}
