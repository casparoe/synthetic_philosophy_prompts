prompt: |-
  I run research ethics review for a mid-sized hospital-affiliated research institute -- about a dozen new studies a month, mostly surveys, biobank stuff, a few behavioral experiments, one or two that touch on mental health. Our legal checklist is fine and I can do it half asleep. The problem is the forms that pass the checklist and still aren't real consent: everything disclosed, signature on the line, and I know perfectly well the person didn't actually agree to anything. I want a decision procedure for that gap. I have to be able to run it in about thirty minutes per study, my coordinator has to be able to run it too, and it has to end in one of approve / send back with specific fixes / escalate, where escalate means the compliance director decides, and she signs off and also has no philosophy background.

  Ground it in what the philosophy of consent actually says, but I've been reading around and there's a few distinctions I want the procedure to keep, because I think they're the ones doing the work: the difference between consent as a state of mind and consent as a signed act (a form can be perfect and the agreement absent); the difference between consent and mere compliance, where someone goes along because saying no is awkward or costly, not because they agreed; consent that's valid but fragile, meaning it survives everything we told them but would collapse if they learned one more fact; and the idea that how much someone needs to understand is set by what's at stake in that particular decision, not by a fixed bar of competence that you either clear or don't. I also want the threat/offer distinction kept separate -- coercion and an offer so good it distorts judgment feel like different failures to me and I don't want them crushed into one box called undue influence.

  What I need from you: the questions in the order I should ask them, what counts as a good enough answer to each, where the procedure stops with a no, where it stops with a yes, and where it has to hand the decision to a person because the question is about values and not facts. My guess is that how much risk it's fair to ask someone to accept for free is one of those, and whether broad consent to unspecified future research is consent at all is another, but tell me if I'm wrong about either. Flag which steps are judgment calls wearing a procedure's clothing, and say what to do when I cant get a clean answer on a step -- I need to know whether a missing answer should count against the study or be marked unknown and passed up.

  Then run it on three, showing your work at each step:

  1. A biobank asking for broad consent to future research nobody has designed yet, form says we may share de-identified samples with academic and commercial partners, no end date.
  2. A wellness study inside a company where the person recruiting participants is their direct manager, and participants get $500, which for some of them is a weeks groceries.
  3. A behavioral study that tells people it's about memory and mood when it's actually about stereotype threat, with a debrief at the end.

  At least one of those should come out in a way I won't like. I'd rather you be right than agreeable about it. And close by telling me what this procedure can't do and what I should stop expecting it to do, because I suspect I'm asking consent review to carry weight it can't carry.
reasoning: |-
  We are designing a decision procedure for research ethics review that focuses on the quality of consent beyond legal checklists. The procedure should be grounded in philosophical distinctions about consent and should be executable within 30 minutes per study. The output must be one of: approve, send back with specific fixes, or escalate to the compliance director.

  Key philosophical distinctions to incorporate:
  1. Consent as a state of mind (agreement) vs. a signed act (form). We must check that the form is not just signed but that the agreement is present.
  2. Consent vs. mere compliance (going along because saying no is awkward or costly).
  3. Consent that is valid but fragile (would collapse if one more fact were known).
  4. The level of understanding required is proportional to what is at stake in the decision, not a fixed bar.
  5. Separate undue influence into two distinct categories: coercion (threats) and offers so good they distort judgment (inducements).

  The procedure must have clear questions, good enough answers, and stopping points. We must flag judgment calls and handle missing answers.

  Procedure Outline:

  We will break down the review into a series of questions. The questions should be asked in a logical order, such that an early "no" might lead to rejection or escalation without needing to answer all questions.

  1. **Question 1: Is the consent form complete and legally compliant?** (This is the existing checklist. If no, we send back with fixes. If yes, we proceed to substantive consent issues.)

  2. **Question 2: Is there a risk that participants are merely complying rather than consenting?**
     - Check for situations where saying "no" might be awkward, costly, or have negative consequences (e.g., power differentials, lack of anonymity, high rewards).
     - Good enough answer: The design minimizes such pressures (e.g., recruitment by neutral party, private setting, no penalty for refusal, compensation not so high as to be coercive). If not, it's a problem.

  3. **Question 3: Is the consent agreement (state of mind) likely to be present?**
     - This involves assessing whether the information is presented in a way that participants can understand and whether they are given enough time and opportunity to ask questions.
     - Good enough answer: The information is clear, at an appropriate reading level, and the process allows for reflection and questions. If not, it's a problem.

  4. **Question 4: Is the consent robust to additional relevant information? (Avoiding fragility)**
     - Consider if there are material facts that are being withheld (e.g., deception) or if the consent is so broad that it covers unforeseen risks. Also, consider if the consent is for future unspecified research (which might be fragile because new risks might emerge).
     - Good enough answer: The consent covers known material risks and is not overly broad. If there is deception, it must be justified and followed by debriefing. For broad consent, there must be a clear process for re-consent or at least notification for significant changes. If the consent is fragile (e.g., broad consent without any safeguards), it's a problem.

  5. **Question 5: Does the level of understanding required match what is at stake?**
     - Assess the risks and benefits of the study. For higher stakes, the understanding must be deeper. The form and process must be designed accordingly (e.g., more detailed explanation, verification of understanding for high-risk studies).
     - Good enough answer: The consent process is proportionate to the risks. For low-risk studies, a simple form may suffice. For high-risk, there should be evidence of comprehension (e.g., quiz, discussion). If not, it's a problem.

  6. **Question 6: Is there coercion? (Threat of harm for non-participation)**
     - Look for any element that threatens harm (e.g., loss of benefits, negative repercussions) if the person does not participate.
     - Good enough answer: No such threats exist. If there is coercion, it's a problem.

  7. **Question 7: Is there undue inducement? (An offer so large it distorts judgment)**
     - Look at the compensation or benefits. Is it so high that it might blind participants to risks or lead them to participate against their better judgment?
     - Good enough answer: Compensation is reasonable and not excessive for the study burden and participant population. If it is excessive, it's a problem.

  Handling of questions:
  - If any question from 2 to 7 is answered with a clear "no" (i.e., the condition is not met and it's a problem), then we either send back with specific fixes (if fixable) or escalate (if it's a fundamental issue that requires higher-level decision).
  - If a question is answered "yes" (condition met) or "not applicable", we move to the next.
  - If we cannot get a clean answer (missing information or ambiguous situation), we mark it as unknown and escalate. The procedure cannot decide in the face of uncertainty.

  Judgment calls:
  - Questions 2, 4, 5, and 7 involve judgment. We will provide guidelines but note that they require human judgment. For example, what counts as "excessive" compensation? What counts as a "material" risk? These are context-dependent.

  Escalation criteria:
  - When the issue is about values (e.g., what level of risk is acceptable, whether broad consent is ever acceptable) and not just facts.
  - When there is a missing answer that cannot be resolved without further input.
  - When the procedure identifies a problem that is not easily fixable (e.g., a fundamental flaw in the design that might require redesign or abandonment).

  Now, let's run the procedure on the three examples.

  Example 1: Biobank with broad consent
  - Form: consent for future unspecified research, sharing with academic and commercial partners, no end date.

  Example 2: Wellness study in a company
  - Recruitment by direct manager, $500 compensation (which is a week's groceries for some).

  Example 3: Behavioral study with deception
  - Told it's about memory and mood, but actually about stereotype threat, with debrief.

  We will go step by step for each example.

  ---

  **Example 1: Biobank with broad consent**

  1. **Q1: Is the form complete and legally compliant?** 
     - Assuming yes (as per the problem statement). Proceed.

  2. **Q2: Risk of mere compliance?**
     - The biobank consent is usually obtained at a time when the participant is not under immediate pressure. However, if obtained during a medical visit, there might be subtle pressure. The form doesn't specify the context, but typically biobank consent is obtained in a clinical setting. We might be concerned about compliance if the patient feels obligated to the hospital. But without specific context, we'll assume it's not a major issue. *Answer: Probably acceptable, but note that context matters. We'll say condition met for now.*

  3. **Q3: Consent agreement likely present?**
     - The form discloses that samples may be used for future research and shared. However, the future research is unspecified, so the participant cannot know what they are agreeing to. This might mean that the agreement is not truly present because they are agreeing to unknown things. *Answer: Problem. The understanding is insufficient for the stakes (which could be high if future research is sensitive).*

     *At this point, we have a problem. We can either send back for fixes or escalate. Let's continue to see other issues but note that we already have a problem.*

  4. **Q4: Robustness (fragility)?**
     - This consent is highly fragile. If the participant learned about a specific future study that they find objectionable (e.g., related to a stigmatized condition), their consent might collapse. The form does not specify any mechanism for re-consent or even notification for future studies. *Answer: Problem.*

  5. **Q5: Understanding proportional to stakes?**
     - The stakes are potentially high (privacy, future uses) but the understanding is low because the future uses are unknown. *Answer: Problem.*

  6. **Q6: Coercion?**
     - Not apparent. *Answer: Condition met.*

  7. **Q7: Undue inducement?**
     - Typically, biobank participation has no compensation. If there is none, then not an issue. If there is compensation, it would be unusual. *Answer: Condition met.*

  Conclusion for Example 1:
  - Multiple problems: Q3, Q4, Q5. This study should not be approved as is. The issues are fundamental and require redesign. We could consider:
     - Limiting the scope of future research (e.g., only for certain types of diseases).
     - Providing a mechanism for re-consent or at least notification and opt-out for new studies.
     - Providing more details about the types of research and governance.
  - Because the issue is about whether broad consent is acceptable at all (a values question) and how to structure it, we escalate to the compliance director. Also, the fixes are not trivial and may require policy decisions.

  Output: **Escalate** (with notes about the problems in Q3, Q4, Q5).

  ---

  **Example 2: Wellness study inside a company**

  1. **Q1: Legally compliant?** Yes, proceed.

  2. **Q2: Risk of mere compliance?**
     - The recruiter is the direct manager. This creates a power imbalance. Employees may feel pressured to participate to please their manager or fear negative consequences if they decline. Even if the manager says it's voluntary, the context may lead to compliance rather than consent. *Answer: Problem.*

     *Already a problem. Continue for completeness.*

  3. **Q3: Consent agreement likely?**
     - The form might be clear, but the context of recruitment by the manager might undermine the voluntariness, so even if the form is clear, the agreement might not be present. *Answer: Problem (due to Q2).*

  4. **Q4: Robustness?**
     - The study is about wellness, so likely low risk. But if the manager knows who participated, that might create a risk of discrimination. The form should address confidentiality. If it does, then robustness might be okay. But without knowing, we note potential issue. *Answer: Unknown, but the main issue is Q2.*

  5. **Q5: Understanding proportional to stakes?**
     - Wellness study likely low risk. Understanding is probably adequate if the form is clear. *Answer: Condition met (assuming low risk).*

  6. **Q6: Coercion?**
     - The manager recruitment might create implicit coercion. Also, if non-participation could lead to negative perceptions, that might be coercive. *Answer: Problem (related to Q2).*

  7. **Q7: Undue inducement?**
     - $500 is a week's groceries for some. For a wellness study (which might be low burden), this might be excessive and distort judgment. *Answer: Problem. The compensation is too high for the burden and population, leading to undue inducement.*

  Conclusion for Example 2:
  - Problems in Q2, Q3, Q6, and Q7. The recruitment by the manager is a critical flaw. The compensation is also problematic. Fixes might include:
     - Having a neutral party recruit.
     - Ensuring anonymity from the manager.
     - Reducing the compensation to a reasonable level (e.g., $50).
  - Because the fixes are specific, we can send back with fixes. However, if the institution has a policy that manager recruitment is never acceptable, then it might require more than fixes. But typically, we can specify the fixes.

  Output: **Send back with specific fixes**: (1) Change recruitment to be done by a neutral party (not the manager). (2) Ensure that participation is anonymous to the manager. (3) Reassess the compensation: $500 is too high and should be reduced to avoid undue inducement.

  ---

  **Example 3: Behavioral study with deception**

  1. **Q1: Legally compliant?** Yes, proceed.

  2. **Q2: Risk of mere compliance?**
     - The study is about memory and mood (as presented). There might be no particular pressure. But if it's in a setting where participants feel obligated (e.g., university students), there might be compliance. However, this is common and can be mitigated by emphasizing voluntariness. *Answer: Condition met (if the recruitment is appropriate).*

  3. **Q3: Consent agreement likely?**
     - There is deception: the true purpose is hidden. Therefore, the participant cannot agree to the real study. They agree to a fake study. The debrief at the end does not fix the initial lack of agreement. *Answer: Problem.*

  4. **Q4: Robustness?**
     - The consent is fragile because if the participant knew the true purpose, they might not agree. The debrief is planned, but that is after the fact. *Answer: Problem (related to deception).*

  5. **Q5: Understanding proportional to stakes?**
     - The study involves stereotype threat, which might cause psychological discomfort. The risks are moderate. The form doesn't disclose the true risks because of deception. *Answer: Problem.*

  6. **Q6: Coercion?** Not apparent. *Answer: Condition met.*

  7. **Q7: Undue inducement?** We don't have information on compensation. If it's standard, then okay. *Answer: Condition met (assuming standard compensation).*

  Conclusion for Example 3:
  - Problems in Q3, Q4, Q5. Deception is a known issue in research ethics. It is sometimes justified if:
     - The research cannot be done without deception.
     - The risks are minimal.
     - The debriefing is prompt and allows withdrawal of data.
  - However, the procedure flags it as a problem. We must check if the study meets the criteria for an exception for deception. This is a judgment call and might require escalation because it's about values (when is deception acceptable?).

  Output: **Escalate** because the use of deception requires a higher-level determination about whether the deception is justified and whether the safeguards (debrief, option to withdraw) are sufficient. The compliance director must decide.

  ---

  **What the procedure cannot do:**

  1. **Resolve deep philosophical disagreements**: The procedure is based on the philosophical distinctions you provided, but if the institution has a different view (e.g., broad consent is acceptable as long as it's legal), the procedure will flag it as a problem. The compliance director must then decide based on institutional policy.

  2. **Make value judgments**: The procedure can flag issues but cannot decide on matters of value (e.g., what level of risk is acceptable, whether deception is ever justified). These must be escalated.

  3. **Handle novel or complex ethical dilemmas**: The procedure is a screening tool. It may not capture every nuance and might over-simplify. Complex cases may require a full ethics committee review.

  4. **Compensate for lack of information**: If the application lacks details, the procedure may lead to escalation or rejection. It cannot fill in gaps.

  5. **Replace human judgment entirely**: The procedure systematizes the review but cannot eliminate the need for experienced judgment, especially in borderline cases.

  You should stop expecting the consent review to:
  - Ensure that every participant fully understands and agrees in the deepest philosophical sense. The procedure aims for a reasonable standard, not perfection.
  - Bear the entire weight of ethical approval. Other aspects (scientific validity, social value) are also important and should be reviewed separately.
  - Resolve issues that are inherent in the research design without the possibility of redesign (e.g., some deception studies might be necessary and justified, but that requires a higher-level decision).

  Final note: The procedure is a tool to help you focus on the key issues of consent. It will sometimes require escalation, which is by design. It is not a failure of the procedure but an acknowledgment that some decisions require human judgment and institutional policy.
answer: |-
  ### Decision Procedure for Valid Consent Assessment

  Below is a step-by-step decision procedure grounded in the philosophy of consent, incorporating your specified distinctions (state of mind vs. signed act, consent vs. compliance, fragility, stakes-proportional understanding, and separating threats from distorting offers). The procedure consists of 7 sequential questions. If a study fails any question, it stops at "send back" or "escalate." If it passes all, it approves. The procedure is designed for a 30-minute review by you or a coordinator.

  #### Procedure Overview
  1. **Order of Questions**: Sequential, with early exits for clear failures.
  2. **Good Enough Answers**: Defined per question. If not met, the outcome is "send back" (fixable) or "escalate" (values-based or ambiguous).
  3. **Stopping Points**:
     - **Approve**: Passes all questions.
     - **Send Back**: Fixable issue (e.g., form revision, process change).
     - **Escalate**: Values judgment needed, ambiguity, or fundamental ethical conflict.
  4. **Judgment Calls**: Explicitly flagged (steps 4–7). These require contextual assessment.
  5. **Handling Missing/Ambiguous Answers**: 
     - If ambiguity arises from missing information (e.g., risk level unclear), mark as "unknown" and escalate.
     - Do not default to "send back" or "approve"—escalation forces human resolution.

  #### The Procedure
  **Question 1: Is the consent form complete and legally compliant?**  
  - **Good enough**: All legal/regulatory boxes checked (e.g., risks, benefits, confidentiality, contact info).  
  - **Failure outcome**: Send back with specific fixes (e.g., missing element).  
  - **Judgment call?** No. This is your existing checklist.  
  - **If ambiguous**: Escalate (rare; legal compliance should be binary).

  **Question 2: Is there a power imbalance or context risking mere compliance?**  
  - **Good enough**: No authority figures (e.g., managers, doctors) directly recruiting; no penalties for refusal; private setting; no implied consequences for non-participation.  
  - **Failure outcome**: Send back (e.g., remove recruiter conflict, add anonymity).  
  - **Judgment call?** Yes. Assess if the context makes refusal feel costly (e.g., workplace hierarchy).  
  - **If ambiguous**: Escalate (e.g., if recruiter role is unclear).

  **Question 3: Is the consent process designed to elicit a state-of-mind agreement?**  
  - **Good enough**: Information is clear (e.g., 8th-grade reading level, no jargon); time for questions; no rushing; explicit "you can say no" language.  
  - **Failure outcome**: Send back (e.g., simplify language, add cooling-off period).  
  - **Judgment call?** Partially. Use readability tools; assess time pressures.  
  - **If ambiguous**: Escalate (e.g., if readability is borderline).

  **Question 4: Is consent robust (i.e., would it survive minor new information)?**  
  - **Good enough**: No material omissions; no broad/unbounded consent; foreseeable risks disclosed. For deception studies, debrief plan must be robust and include data withdrawal.  
  - **Failure outcome**: Escalate (if fundamentally fragile, e.g., broad consent) or send back (if fixable, e.g., add re-consent triggers).  
  - **Judgment call?** Yes. "Material" depends on stakes (see Q5); fragility is probabilistic.  
  - **If ambiguous**: Escalate (e.g., if "minor" new info is undefined).

  **Question 5: Is the required understanding proportional to stakes?**  
  - **Good enough**: Comprehension aids (e.g., summaries, quizzes) match risk level. Low stakes (e.g., survey) need basic understanding; high stakes (e.g., mental health) need verified comprehension.  
  - **Failure outcome**: Send back (e.g., add comprehension check).  
  - **Judgment call?** Yes. Stakes assessment is contextual (risk, vulnerability, benefit).  
  - **If ambiguous**: Escalate (e.g., if risk level is disputed).

  **Question 6: Is there coercion (threat of harm for non-participation)?**  
  - **Good enough**: No penalties (e.g., job loss, care denial); no exploitative pressures.  
  - **Failure outcome**: Escalate (if systemic, e.g., institutional power) or send back (e.g., remove penalty).  
  - **Judgment call?** No. Coercion is factual: look for explicit/implicit threats.  
  - **If ambiguous**: Escalate (e.g., if harm is implied but unstated).

  **Question 7: Is there undue inducement (offer distorting judgment)?**  
  - **Good enough**: Compensation is proportionate to burden and not excessive for the population (e.g., not >20% of income for high-effort studies).  
  - **Failure outcome**: Send back (e.g., reduce compensation).  
  - **Judgment call?** Yes. "Excessive" is population-dependent (e.g., $500 for low-income vs. high-income).  
  - **If ambiguous**: Escalate (e.g., if population data is lacking).

  ---

  ### Application to Your Three Studies
  I'll run the procedure step-by-step for each study, showing outcomes. As requested, one outcome may be unfavorable.

  #### Study 1: Biobank Broad Consent  
  **Form**: Broad consent for future research, sharing de-identified samples with academic/commercial partners, no end date.  
  - **Q1 (Legal)**: Pass. Form is complete.  
  - **Q2 (Compliance Risk)**: Pass. No immediate power imbalance (e.g., consent during routine care).  
  - **Q3 (State of Mind)**: Pass. Information is clear.  
  - **Q4 (Robustness)**: **Fail**. Consent is fragile—participants can't anticipate future uses (e.g., commercial research on sensitive traits). A single new fact (e.g., "Your sample is used for X") could collapse consent. Broad consent without re-consent mechanisms is inherently fragile.  
    - **Outcome**: Escalate (values judgment: "Is broad consent ever valid?").  
  - **Stop**. No need for Q5–Q7.

  **Final Outcome**: **Escalate** to compliance director. Rationale: Broad consent is a values-based debate (autonomy vs. practicality). Fixes like tiered consent or re-consent triggers could be proposed, but the core issue requires policy-level input.

  #### Study 2: Wellness Study with Manager Recruiter and $500 Compensation  
  **Context**: Direct manager recruits employees; $500 compensation (a week's groceries for some).  
  - **Q1 (Legal)**: Pass. Form is complete.  
  - **Q2 (Compliance Risk)**: **Fail**. Manager recruitment creates power imbalance—employees may comply to avoid awkwardness or implied career costs.  
    - **Outcome**: Send back with fixes (e.g., neutral recruiter).  
  - **Stop**. No need for Q3–Q7.  
  - **Note**: Even if fixed, proceed to Q7 for inducement risk.  
    - **Q7 (Undue Inducement)**: **Fail**. $500 is excessive for a wellness study (low burden). For low-income employees, it could distort judgment (e.g., ignoring privacy risks).  
      - **Outcome**: Send back with fixes (e.g., reduce compensation to $50–$100).  

  **Final Outcome**: **Send Back** with specific fixes:  
  1. Replace recruiter with neutral party.  
  2. Reduce compensation to match burden (e.g., $50).  
  Rationale: Fixable issues, but manager role and high compensation compound compliance/inducement risks.

  #### Study 3: Behavioral Study with Deception  
  **Context**: Told study is about "memory and mood" but actually tests stereotype threat; debrief included.  
  - **Q1 (Legal)**: Pass. Form covers the cover story.  
  - **Q2 (Compliance Risk)**: Pass. No overt power imbalance (e.g., university setting).  
  - **Q3 (State of Mind)**: **Fail**. Participants agree to a false premise—no state-of-mind agreement for the real study.  
  - **Q4 (Robustness)**: **Fail**. Consent is fragile—learning the true purpose pre-participation would collapse consent. Debrief doesn't fix initial agreement.  
  - **Q5 (Stakes-Understanding)**: **Fail**. Stakes are moderate (psychological discomfort from stereotype threat), but understanding is nil for the real risk.  
    - **Outcome**: Escalate (values judgment: "When is deception justified?").  
  - **Stop**. No need for Q6–Q7.

  **Final Outcome**: **Escalate** to compliance director. Rationale: Deception is a values-laden issue (weighing scientific merit against autonomy). The debrief and data-withdrawal option don't resolve the core consent gap.

  ---

  ### What This Procedure Can and Cannot Do
  **Can Do**:  
  - Systematically flag gaps in valid consent beyond legal compliance.  
  - Handle common issues (power imbalances, comprehension, inducement) in under 30 minutes.  
  - Distinguish fixable problems (send back) from values judgments (escalate).  
  - Enforce your philosophical distinctions (e.g., separates threats vs. offers).  

  **Cannot Do (Stop Expecting This)**:  
  1. **Ensure perfect consent**: Consent is inherently fallible. This procedure targets *reasonable validity* (e.g., "Would a reasonable person feel truly informed?"), not absolute agreement.  
  2. **Resolve values debates**: It flags but cannot decide issues like broad consent or deception. These require institutional policy or committee input (your "escalate" path).  
  3. **Eliminate all risk**: Some studies (e.g., mental health) involve irreducible fragility. The procedure highlights this but can't magic it away.  
  4. **Assess non-consent ethics**: It doesn't cover scientific validity, social value, or justice (e.g., fair participant selection). These need parallel review.  
  5. **Handle ambiguity without escalation**: Missing data (e.g., population income for inducement) forces escalation—don't assume "approve" by default.  

  **Final Advice**: Use this as a triage tool. Escalation isn't failure—it ensures values-based calls are made at the right level. Pair it with your legal checklist to cover both formal and substantive validity. For escalated cases, your compliance director doesn't need philosophy; she needs clear options (e.g., "Approve if broad consent is policy; else reject"). This procedure shifts consent review from "checking boxes" to "managing moral risk."
