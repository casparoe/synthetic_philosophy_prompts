prompt: |-
  A colleague in our decision theory reading group circulated a handout summarizing two problems that have been much discussed in the literature on rational choice. The handout reads as follows:

  "Counterfactual mugging and XOR blackmail are two versions of the same problem, and both show that causal decision theory is untenable. In counterfactual mugging, Omega flips a coin. If the coin comes up tails, Omega asks you for $100. If it comes up heads, Omega gives you $10,000, but only if it predicted that you would have paid had the coin come up tails. When the coin comes up tails and Omega asks for $100, causal decision theory says refuse, because your payment cannot causally affect the already-settled coin flip. Evidential decision theory says pay, because paying is evidence that you are the sort of agent who would have been rewarded in the heads branch. In XOR blackmail, Omega sends you a message that says: 'I have sent you this message if and only if your house has termites or you pay me $1,000, but not both.' A termite infestation would cost $1,000,000. Causal decision theory again says refuse, since your payment cannot affect whether your house has termites. Evidential decision theory says pay, because paying is evidence that the message was sent because you paid rather than because of termites. In both cases, the evidentialist is willing to pay a small sum to avoid a large loss, and the causalist is not. Since the evidentialist does better in both cases, these problems show that evidential decision theory is the correct theory of rational choice, and that anyone who refuses to pay is being irrational. The only remaining question is whether you should pre-commit to paying; everyone agrees you should, which just confirms that paying is the right choice."

  I suspect this is unfair to causal decision theory and also misdescribes the relationship between the two problems. I would like a careful audit. Please go claim by claim and tell me: which parts would a decision theorist accept, which are common simplifications, which are subtle misrepresentations, and which are simply wrong? In particular, I want to know whether the two problems really have the same structure, whether evidential decision theory really prescribes paying in both, whether it really does better in both, and whether the conclusion that CDT is refuted and EDT vindicated follows from the accurate parts. Also, what would a defender of causal decision theory say in response, and what would a defender of evidential decision theory say about the summary's use of their view? I am trying to get clear on this before we discuss it in the group, and I do not want to rely on the handout's framing if it is misleading.
reasoning: |-
  Okay, let me start by unpacking the user's query. They're part of a decision theory reading group and received a handout that claims counterfactual mugging and XOR blackmail are the same problem, both showing CDT is untenable and EDT superior. The user suspects this is unfair to CDT and wants a detailed audit of each claim.

  First, I need to recall the two scenarios. Counterfactual mugging involves Omega flipping a coin; tails means you pay $100, heads means you get $10,000 if Omega predicted you'd pay. XOR blackmail: Omega's message is sent iff you have termites XOR you pay $1,000. The handout argues both cases show EDT prescribes paying, leading to better outcomes, thus refuting CDT.

  The user's main concerns are whether the problems are structurally identical, if EDT indeed prescribes paying in both, if it performs better, and if the conclusion against CDT holds. They also want CDT and EDT defenses. 

  Looking at the handout's claims: 

  1. **Same problem**: While both involve acausal correlations, key differences exist. Counterfactual mugging has a clear counterfactual dependency (your decision affects the prediction), whereas XOR blackmail's dependency is evidential. The coin flip outcome is known in mugging but not in blackmail, making the latter more ambiguous.

  2. **CDT says refuse in both**: Accurate. CDT focuses on causal impact, which is absent here since decisions don't affect past states.

  3. **EDT says pay in both**: Mostly true for mugging, but nuanced in blackmail. Paying in mugging provides evidence of being a cooperator. In blackmail, paying is evidence the message was due to payment, not termites. However, this depends on Omega's reliability and prior probabilities. If priors suggest termites are unlikely, paying might not be as clear-cut.

  4. **EDT does better**: In mugging, yes—paying leads to $10k on heads but costs $100 on tails. CDT misses the heads payoff. In blackmail, paying avoids the $1M loss only if termites exist, but if they don't, you lose $1k. EDT's performance here hinges on the probability of termites. If termites are likely, paying is better; if not, refusing might be. The handout assumes EDT always does better, which isn't necessarily true in blackmail.

  5. **Conclusion that CDT is refuted**: Overstated. While CDT struggles with acausal problems, it handles others well. Defenders might argue EDT's issues with Newcomb-like problems or smoking lesion show its flaws. The blanket dismissal of CDT ignores its strengths.

  6. **Pre-commitment agreement**: True, both theories support pre-committing to pay. This shows rationality in advance but doesn't resolve the disagreement about current action.

  The user's deeper need is to facilitate a balanced group discussion. They want to correct misconceptions and present both theories fairly. Highlighting the structural differences between the problems and the context-dependent performance of EDT in blackmail is crucial. Also, emphasizing that neither theory is universally superior—each has scenarios where they excel—would provide a more nuanced view for the group. 

  A CDT defender would stress CDT's alignment with actual causation and avoiding spurious correlations. An EDT proponent might agree with the handout but clarify that evidence isn't about being a "type" but updating beliefs based on actions. 

  In summary, the handout oversimplifies by equating the two problems and overstating EDT's superiority. The audit should clarify nuances, context dependencies, and the ongoing debate in decision theory.
answer: |-
  Below is a detailed, claim-by-claim audit of the handout, assessing its accuracy, simplifications, misrepresentations, and implications. I address your specific questions about structural equivalence, prescriptions, performance, and conclusions, followed by responses from CDT and EDT defenders. This analysis draws on standard literature (e.g., Arntzenius, Yudkowsky, Soares, Weirich) and acknowledges ongoing debates.

  ### **Claim-by-Claim Audit**
  1. **"Counterfactual mugging and XOR blackmail are two versions of the same problem."**  
     - **Assessment**: Oversimplified.  
       - **Similarities**: Both involve acausal correlations (Omega's prediction/message depends on your decision). Both challenge CDT by decoupling causation from rational action.  
       - **Differences**:  
         - *Counterfactual Mugging*: Your decision in the *actual* world (tails) affects a *counterfactual* outcome (heads reward). CDT's failure stems from ignoring how your action *would have* influenced a past prediction.  
         - *XOR Blackmail*: Your decision in the *actual* world updates evidence about a *current* state (termites). CDT's failure is its inability to handle evidence that isn't causally relevant.  
       - **Verdict**: They share a "common theme" (acausal influence) but are **not structurally identical**. Mugging hinges on counterfactual dependency; blackmail on evidential ambiguity.  

  2. **"Both show causal decision theory (CDT) is untenable."**  
     - **Assessment**: Partially correct but overstated.  
       - CDT **fails in both cases** by prescribing refusal:  
         - *Mugging*: CDT refuses because payment can't affect the coin flip.  
         - *Blackmail*: CDT refuses because payment can't affect termites.  
       - **Why overstated?** CDT's "failure" is specific to problems involving predictors (Newcomblike scenarios). It succeeds in causal dilemmas (e.g., medical decisions). Calling it "untenable" ignores CDT's robustness elsewhere.  

  3. **"When the coin comes up tails [...] CDT says refuse [...] EDT says pay."**  
     - **Assessment**: **Accurate for both problems**.  
       - *CDT*: Always refuses. It calculates expected utility based on causal impact (no causal link between payment and outcomes).  
       - *EDT*: Prescribes paying in both:  
         - *Mugging*: Paying is evidence you are the "type" who gets rewarded in heads.  
         - *Blackmail*: Paying is evidence the message was sent due to payment, not termites.  

  4. **"Evidential decision theory [...] does better in both cases."**  
     - **Assessment**: **True for mugging, debatable for blackmail**.  
       - *Mugging*: EDT pays → gains $10,000 if heads, loses $100 if tails. Expected utility (EU) dominates CDT (which gains $0 if heads, loses $0 if tails).  
       - *Blackmail*: EDT pays → avoids $1,000,000 loss *only if termites exist*. If termites are *absent*, paying costs $1,000 unnecessarily. **EDT only outperforms if termites are sufficiently probable** (e.g., if \( P(\text{termites}) > 0.1\% \)). The handout **assumes high termite probability**, but this isn't specified.  

  5. **"These problems show that evidential decision theory is the correct theory of rational choice."**  
     - **Assessment**: **Misleading and contested**.  
       - While EDT excels here, it has well-known failures:  
         - *Newcomb's Problem*: EDT "one-boxes" and wins, but critics argue this is irrational if the predictor is fallible.  
         - *Psychopath Button*: EDT refuses to push a button that kills psychopaths (because pushing it is evidence you *are* a psychopath). This is self-sabotaging.  
         - *Smoking Lesion*: EDT may avoid smoking, misinterpreting correlation (smoking and lesion) as causation.  
       - **Conclusion**: These problems **challenge CDT** but do not **vindicate EDT as universally correct**. Most theorists view them as proofs that *both* theories are incomplete.  

  6. **"Anyone who refuses to pay is irrational."**  
     - **Assessment**: **Contentious**.  
       - *CDT defenders*: Refusing is rational because rationality requires acting on actual causation, not spooky correlations. Paying is "irrational superstition."  
       - *EDT defenders*: Agree refusal is irrational, as it ignores observable evidence.  
       - **Neutral view**: Rationality is theory-dependent. The claim dismisses legitimate CDT reasoning.  

  7. **"Everyone agrees you should pre-commit to paying."**  
     - **Assessment**: **Mostly accurate**.  
       - Pre-commitment aligns both theories:  
         - *CDT*: Pre-commitment causally influences Omega’s prediction (e.g., via a binding contract).  
         - *EDT*: Pre-commitment provides evidence of cooperation.  
       - **Caveat**: Hardcore CDT agents might reject pre-commitment if it costs resources upfront.  

  ---

  ### **Responses from Defenders**
  - **Causal Decision Theorist (CDT Defender)**:  
    - "The handout confuses *rationality* with *outcomes*. CDT rationally maximizes utility given actual causal levers. In mugging, paying $100 post-tails is pure waste—it can't change the past. Omega's trick exploits agents who conflate evidence with control. EDT's 'success' is luck, not reason. We accept pre-commitment because it *causally* affects Omega's prediction. These problems are edge cases; CDT remains sound for real-world decisions."  

  - **Evidential Decision Theorist (EDT Defender)**:  
    - "The summary correctly shows EDT's coherence in acausal settings. Rationality requires using all available information, including evidence about what your actions imply. Calling this 'superstition' ignores that Omega's reliability makes it Bayesian updating. However, the claim that EDT is 'correct' oversimplifies: we acknowledge issues like the Smoking Lesion. Still, mugging and blackmail reveal CDT's deeper flaw—it ignores how actions reflect your decision-making properties, which predictors exploit."  

  ---

  ### **Key Conclusions from Your Queries**  
  1. **Structural equivalence?**  
     - No. Mugging involves counterfactual rewards; blackmail involves evidential ambiguity about current states.  

  2. **EDT prescribes paying?**  
     - Yes, in both cases—but its justification differs (counterfactual evidence vs. diagnostic evidence).  

  3. **EDT performs better?**  
     - In mugging: Yes.  
     - In blackmail: Only if termites are probable (>0.1%). The handout ignores this nuance.  

  4. **Does this refute CDT / vindicate EDT?**  
     - **No**. These are *specific* challenges to CDT, not a general refutation. EDT has its own flaws, and neither theory is universally dominant. The problems highlight a **dilemma in decision theory**, not a resolution.  

  5. **Is the handout misleading?**  
     - **Yes**, in three ways:  
       - It presents mugging/blackmail as identical.  
       - It assumes EDT always outperforms in blackmail.  
       - It declares EDT "correct" while ignoring its counterexamples.  

  ---

  ### **Recommendation for Group Discussion**  
  Focus on:  
  - Why CDT and EDT diverge in these cases (causation vs. evidence).  
  - How pre-commitment "solves" the problem by altering causal/evidential links.  
  - Whether rationality should prioritize *process* (CDT) or *outcomes* (EDT).  
  - Acknowledge that **no theory dominates all paradoxes**—this is an open debate.  

  For further reading:  
  - **Counterfactual Mugging**: Yudkowsky/LessWrong discussions (highlights CDT's counterfactual blindness).  
  - **XOR Blackmail**: Arntzenius ("No Regrets", 2008) notes its similarity to "Death in Damascus".  
  - **General**: Weirich's *Rational Choice with Instrumental Deliverance* (CDT refinements).  

  This should equip you to steer the group toward nuance, avoiding the handout’s oversimplified framing.
