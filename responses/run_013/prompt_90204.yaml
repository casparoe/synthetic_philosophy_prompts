prompt: |-
  I'm not a historian — I fix bikes for a living — but I've gotten weirdly obsessed with what to do when a community's memory and the written record say different things. It started at Thanksgiving: my aunt tells the story of how my great-grandfather's farm was taken from him by the bank, and my cousin, who does genealogy as a hobby, has the actual deeds, and the deeds say he just stopped paying for three years. My aunt's version is, as far as the paper goes, false. And I noticed I didn't want my cousin to correct her. Not at the table, not ever, really. But then I started running other cases through my head and my gut got inconsistent fast, so what I want from you is to figure out what I actually think — I'm pretty sure there's a principle in there somewhere but I can't see it.

  Here's where I land, case by case. (1) The old church downtown: the congregation's story is that their grandparents built it with their own hands, brick by brick; the archive shows a mill owner paid for the whole thing and the parishioners mostly just showed up for the photo. Leave that story alone, even though it's plainly wrong and even though it flatters them at the expense of a dead man. (2) The statue of the town founder: the records show he didn't found the town, he bought in a decade later and lost the land, and the date on the plaque is off by eleven years. Leave it, don't even fix the plaque. (3) The factory fire: the historical society's exhibit says thirty workers died, but the cemetery rolls and the old insurance file say eleven. That one I want corrected loudly, descendants told, plaque redone — memory doesn't get a vote there. (4) My own neighborhood's line about how "this was always a working-class neighborhood, we've always been the same people here" — the census and the parish records show it was mixed for decades, and people say that line at zoning meetings to fight new apartments. Record wins, no contest, and I'd say it out loud in the meeting. (5) A town that claims a right to graze on a certain common because of an agreement made "with the old families": the archive has no such agreement and the deeds run the other way. I think the record wins, sincere and old as the belief is. (6) But then the kind of case that's always in the news — a valley community whose oral history says the land was theirs and was taken, against a treaty and a survey that say it was ceded. There I think the memory wins and I don't much care what the archive says. And I know that's structurally the same as (5) and I can't tell you why I flip. Also, in both (5) and (6) the "record" isn't even clean: the survey in (6) was drawn up by the people doing the taking, and the archive in (5) turns out to be a 1930s compilation of interviews with people remembering things fifty years on. A friend of mine took one anthropology course and now won't shut up about how memory is either load-bearing or else it's just scenery, and you can tell which by asking what falls down if you take it away — I don't know if that's a real distinction or something he made up in the car, but it's the closest thing I've got to a theory.

  So: is there a principle, or two, or three, that gets all six? If there is, state it as precisely as you can and tell me which clause is doing the work in each case — and if my friend's load-bearing/scenery thing is basically right, say so and say where it breaks. Then tell me what your principle says about a case I haven't considered: a town whose bridge went out in the flood of '55, and whose entire flood-control campaign for seventy years has been built on that memory, except the records show the bridge had been condemned for bad concrete and was pulled down by the county two years before the flood ever came. And I want you to be honest about how shaky this is — where is your reasoning most likely to be wrong, what would you have to find out about one of these cases to flip your verdict, and which of my six do you think I'm going to end up having to give up? I'd rather you tell me that than make it all fit.
reasoning: |-
  Okay, let me try to unpack this. The user is a bike mechanic who's stumbled into a deep philosophical and ethical dilemma about historical truth versus community memory. They've presented six specific cases where written records conflict with oral traditions, and their instinctive reactions to each are inconsistent. They're seeking principles to explain these inconsistencies and want honesty about where such principles might fail.

  First, I notice the user is intellectually honest - they admit their gut reactions aren't consistent and specifically point out the contradiction between cases 5 and 6. That structural similarity really bothers them. The anthropology friend's "load-bearing vs scenery" metaphor seems helpful but incomplete. 

  Looking at their cases, the common thread appears to be about consequences. When the false belief causes harm (factory fire deaths being undercounted, zoning meetings excluding newcomers) they side with records. When it's about identity or harmless pride (church building story, statue date), they protect the narrative. But case 6 is the outlier - there, even though it's similar to case 5 (property rights), they side with oral history because of power dynamics: the written record was created by the oppressors.

  The flood-control case they added is fascinating. If a community built infrastructure based on false trauma, does correcting the record help or harm? I'd need to know if the false memory is still functionally useful for safety. But maintaining it feels patronizing - like doctors lying to patients "for their own good."

  Where this gets shaky is determining what counts as "harm." The zoning case clearly excludes people, but what about the mill owner erased from the church story? That's a smaller harm, but still an injustice. And who gets to decide what's load-bearing? The community? Outsiders? Historians?

  If I discovered in case 3 that correcting the factory fire death count would devastate a town's identity without serving justice, would I still insist? Probably - truth has intrinsic value. But in case 6, I override the written record because it's not truth, just power in document form. That distinction between "record as fact" versus "record as weapon" might be key.

  The user might need to give up case 1 or 2 if pressed - those feel least defensible under scrutiny. Protecting feel-good myths while demanding truth only when convenient isn't sustainable. Either truth matters or it doesn't - but the anthropology friend was right that context determines whether it's cruel to insist.
answer: |-
  Your gut reactions reveal a profound ethical intuition about history's purpose. The inconsistency between cases like (5) and (6) isn't a flaw—it’s a signal that you're weighing factors deeper than "truth vs. myth." Here’s a principle distilled from your examples, tested against your cases, and applied to the flood scenario:

  ---

  ### **The Principle of Consequential Integrity**
  **We prioritize the written record when false memory causes active harm, obscures injustice, or empowers exclusion. We protect oral tradition when it sustains communal identity, repairs historical erasure, or challenges oppressive systems—provided it doesn’t perpetuate new harm.**

  #### How it works:
  - **Harm/Injustice Clause** (Record wins):  
    When false memory *harms living people* (denying accurate mourning in the factory fire), *enables exclusion* (zoning lies blocking housing), or *validates illegitimate power* (grazing rights based on fabricated history).  
    → *Applies to Cases (3), (4), (5)*: Correcting deaths prevents exploitation of victims; zoning truth fights discrimination; grazing records stop unjust claims.  

  - **Identity/Repair Clause** (Memory wins):  
    When oral tradition *anchors marginalized identity* (valley land claim against colonial archives), *symbolizes communal resilience* (church builders’ story), or *challenges oppressive records* (where archives are tools of erasure).  
    → *Applies to Cases (1), (2), (6)*: Church/statue myths dignify community labor; valley memory corrects archival violence.  

  - **The Caveat**:  
    Memory loses protection if it *creates new harm* (e.g., inciting violence) or *demands material concessions* without ethical basis (as in the grazing case).

  ---

  ### **Where Your Friend’s "Load-Bearing" Idea Fits (and Falters)**
  - **Right**: The church story (1) is "scenery"—removing it won’t collapse the community. The valley land claim (6) is "load-bearing"—denying it destroys cultural identity.  
  - **Falters**: It doesn’t address *power*. Case (5) (grazing) might feel load-bearing to the community, but your principle overrules this because the claim harms others. **Not all load-bearing walls deserve to stand if they crush someone beneath them.**

  ---

  ### **The Flood-Control Case: Bridge Collapse Myth**
  - **Your Principle’s Verdict**: **Correct the record.**  
    - *Why*: The myth fuels a *material policy* (flood control) based on false risk assessment. Maintaining it could misdirect resources, creating *future harm* (e.g., neglecting real infrastructure flaws).  
    - *But*: Acknowledge the community’s trauma—even if misattributed—and reframe flood efforts around verified risks ("Whether the bridge fell in ’53 or ’55, we know storms *can* devastate us").  

  ---

  ### **Where This Reasoning is Shaky**
  1. **Defining "Harm"**:  
     - Is emotional distress from losing a cherished myth "harm"? (E.g., the church story). Your principle dismisses this, but it risks paternalism.  
     - *Flip Trigger*: If the factory fire correction caused survivors’ pensions to be revoked, would you still demand it?  

  2. **Power Blind Spots**:  
     - Case (5) (grazing) assumes archives are neutral. But what if the "1930s compiled archive" erased Indigenous land practices? Then it’s closer to case (6).  
     - *Flip Trigger*: Discovery that the "mill owner" in case (1) exploited parishioners. Does exposing this become reparative?  

  3. **The Identity Dilemma**:  
     - Case (4) (zoning) privileges class mobility over community cohesion. Is that always right?  
     - *Flip Trigger*: If new apartments would displace vulnerable residents, does the "false" narrative become protective?  

  ---

  ### **Which Case Might You Surrender?**
  **Case (2) (statue plaque)**. If the founder myth *only* misstates dates/facts (not erasing violence), and correcting it would drain limited civic resources without aiding justice, insisting on "truth" may be pedantry. Your principle’s harm clause doesn’t strongly engage here—making it the weakest link.

  ---

  ### **In Short**
  You intuitively judge history by its *ethical consequences*, not factual purity. **Truth serves justice; when it weaponizes the past against the vulnerable, memory becomes resistance.** This isn’t relativism—it’s recognizing that archives often enshrine power, while memory can be a tool of survival. The flood myth fails because it distorts reality in ways that *risk physical harm*. The valley claim succeeds because it corrects a *moral harm* baked into the record.  

  Your bike-fixing instincts sense this: a chain (history) must be functional (ethically accountable), not just "correct." When a link’s flaw endangers the rider, you fix it. When it’s a scratch on a chain guard? Only if the customer cares.
