  I'll use terms like "temperance certification" and "social resilience training" to bureaucratize the concepts. The liability section will be deliciously dry - waivers for "disinhibition events" and such. For the critics, I'll have the department acknowledge drinking's "inherent disrepute" while insisting it's necessary training.

