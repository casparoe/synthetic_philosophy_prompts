answer: |-
  ## Disposition Decision Tree: Mapping the Fragments

  **The Cases (150 words)**

  1.  **Anti-Cat Vase:** Thin-walled, brittle vase with an internal gadget that instantly stiffens it upon detecting approaching motion. It *is* intrinsically brittle but *wouldn't* break if struck (due to the gadget). *Standard Case:* **Mask.** The intrinsic basis (brittleness) is present, but its manifestation (breaking) is prevented by an external interferer (the gadget), though integrated.
  2.  **Plastic Chandelier:** Would shatter if struck *only* because a hidden hammer fires at it upon detecting a swing. It lacks intrinsic fragility. *Standard Case:* **Reverse Fink (or Mimic).** The object *lacks* the disposition but a mechanism *creates* the manifestation under the stimulus condition, falsely suggesting the disposition.
  3.  **Foamed Crystal:** Intrinsically brittle crystal with foam permanently integrated into its lattice, preventing shattering even if struck. *Standard Case:* **Intrinsic Mask.** The masking factor (foam) is part of the object's intrinsic structure, blocking manifestation despite the dispositional basis being present.
  4.  **Shy Wire:** Electrically live wire that instantly cuts its own current the moment anything touches it. *Standard Case:* **Finkish Disposition.** The wire *has* the disposition (being live) but loses it precisely when the stimulus condition (touching) occurs, preventing manifestation (shock).
  5.  **Probabilistic Plutonium:** Lump has a 50% chance of decaying in the next hour, but a device instantly resets it whenever decay is imminent. *Standard Case:* **Chancy Fink.** A probabilistic disposition (radioactive decay propensity) is finksishly prevented from manifesting when the triggering condition (imminent decay) occurs.

  **The Branches: Decision Nodes (500 words)**

  1.  **Is Disposition Ascription Fundamentally Analyzable?**
      *   **Yes:** Dispositions reduce to more basic features. (Go to Q2)
      *   **No:** Dispositionality is primitive/basic. (Go to Q6)

  2.  **(If Analyzable) What is the Core of the Analysis?**
      *   **Counterfactual:** Essentially about what *would* happen under certain conditions. (Go to Q3)
      *   **Non-Counterfactual:** Needs concepts like potentiality, powers, or chance. (Go to Q5)

  3.  **(If Counterfactual) How Do Finks/Masks Affect the Analysis?**
      *   **Require Patching:** The simple counterfactual is flawed but fixable (e.g., by adding clauses). (Go to Q4)
      *   **Show it's Hopeless:** Finks/masks prove counterfactuals can't capture dispositions. (Leads to some leaves under Q2 Non-Counterfactual or Q6 Primitivism)
      *   **Not Counterexamples:** Finks/masks involve change/loss of the disposition itself. (Leads to **Plain Conditional Analysis** leaf)

  4.  **(If Counterfactual + Needs Patching) What Kind of Patch?**
      *   **Intrinsic Basis Clause:** Add a requirement that the object retains its intrinsic causal basis during the stimulus. (Leads to **Reformed Conditional Analysis** leaf)
      *   **Causal-Nomological Clause:** Add a requirement linking the basis to the manifestation via natural laws, allowing basis retention to be defined causally/lawfully. (Leads to **Causal-Nomological Analysis** leaf)

  5.  **(If Analyzable + Non-Counterfactual) What Replaces Counterfactuals?**
      *   **Chance/Propensity:** Dispositions are probabilistic propensities (e.g., chance to manifest given stimulus). (Leads to **Propensity/Chance-Based Theories** leaf)
      *   **Potentiality/Power:** Dispositions are irreducible potentialities or powers of objects. (Leads to **Potentiality/Power-Based Theories** leaf)

  6.  **(If Primitivist) What is the Nature of Primitive Dispositions?**
      *   **Properties:** Dispositions are fundamental properties of objects. (Go to Q7)
      *   **Identity/Limit:** Dispositions *are* the fundamental properties; the categorical/dispositional distinction collapses. (Leads to **Identity/Limit View (Mumford/Anjum)** leaf)

  7.  **(If Primitivist + Properties) What About the Categorical/Dispositional Distinction?**
      *   **Distinct Kinds:** There are both categorical (non-dispositional) and dispositional properties. (Leads to **Primitivist Dualism** leaf)
      *   **Dispositions Fundamental:** All properties (or the only fundamental properties) are dispositional; categorical properties are illusory or reducible. (Leads to **Pan-Dispositionalism (Bird)** leaf)
      *   **Categoricals Fundamental:** Dispositions reduce to (or supervene on) categorical properties + laws. (Leads to **Humean Categoricalism (Lewis-style)** leaf)

  **The Leaves: Positions & Their Awkward Commitments (600 words)**

  1.  **Plain Conditional Analysis (PCA):** "Fragile" just *means* "would break if struck". *Awkward Commitment:* Must insist that finks (like the Shy Wire) and masks (like the Anti-Cat Vase) actually involve the object *losing* the disposition the moment the stimulus occurs (e.g., the wire stops being live *as it's touched*), which seems counterintuitive for masks especially.
  2.  **Reformed Conditional Analysis (RCA - Lewis):** "Fragile" means "has some intrinsic property B such that, *if it retained B* when struck, it would break". *Awkward Commitment:* Struggles with intrinsic masks (Foamed Crystal) – the intrinsic basis B (brittleness) is present and retained, yet the manifestation is blocked *by another intrinsic feature*.
  3.  **Causal-Nomological Analysis (CNA - Prior/Pargetter/Jackson):** "Fragile" means "has some property B such that, in virtue of B and the laws of nature, it would break if struck". *Awkward Commitment:* Faces difficulties with finks/masks where the laws *themselves* might seem implicated in the interference (e.g., the Shy Wire's self-cutting law), blurring the analysis. Also struggles with the relational key case.
  4.  **Propensity/Chance-Based Theories (e.g., Mellor, Popper):** Dispositions *are* propensities/chances to manifest given stimulus. *Awkward Commitment:* Must explain deterministic dispositions (like fragility) as extreme propensities (chance=1), and faces the Probabilistic Plutonium Fink – the chance seems 0.5, but the fink ensures the *manifestation chance when triggered* is zero.
  5.  **Potentiality/Power-Based Theories (e.g., Molnar, Jacobs):** Dispositions are irreducible potentialities/powers grounded in the object's nature. *Awkward Commitment:* Risks obscurity; explaining how powers "point" to manifestations without counterfactuals or laws can be metaphysically heavy. Must accommodate masks/powers blocked by other powers.
  6.  **Identity/Limit View (Mumford/Anjum):** The dispositional *is* the categorical; properties are powerful qualities. "Fragile" picks out the same property as its microphysical basis. *Awkward Commitment:* Blurs the distinction entirely; struggles to explain why we have dispositional *and* categorical *concepts* if they refer to the same thing, and how masking/finking works without distinct properties.
  7.  **Primitivist Dualism (e.g., early Martin?):** Dispositions are a fundamental, irreducible *kind* of property, distinct from categorical properties. *Awkward Commitment:* Requires explaining the nature of this distinct category and how dispositions relate to categorical bases without reduction. The key/lock case challenges the need for a single-object basis.
  8.  **Pan-Dispositionalism (Bird):** All fundamental properties are purely dispositional; they are nothing but powers to affect other powers. *Awkward Commitment:* Faces the "always packing, never travelling" objection: if properties are *only* powers (pointing to other powers), what is the non-dispositional "ground" that actually *has* the power? Also struggles with quiddities.
  9.  **Humean Categoricalism (Lewis-style):** The fundamental properties are categorical (non-dispositional). Dispositions are defined by the laws of nature, which are regularities in the mosaic of categorical properties. *Awkward Commitment:* Makes dispositions and laws depend entirely on global patterns; a lone object in an empty universe arguably couldn't be fragile. Struggles with intrinsic masks (Foamed Crystal) seeming intrinsically dispositional despite the masking.
  10. **Structuralism/Relationalism:** Dispositions need not have a single, localized intrinsic basis; they can be structural or relational features. *Awkward Commitment:* Challenges the intuition that dispositions are "in" the object; explaining how a key's power is grounded in a relation to an absent lock can be tricky. May align with several other leaves (e.g., CNA, Potentiality, Primitivism).

  **Empty Rooms (200 words)**

  Several logical combinations remain dark:
  *   **Analyze + Non-Counterfactual + Chance + Structural Basis:** While chance-based theories exist, explicitly combining them with a *requirement* for structural/relational bases (like the key) isn't a standard position, perhaps due to the focus on intrinsic propensities.
  *   **Primitivist + Properties + Structural Basis Only:** Believing dispositions are primitive *properties* but *only* ever relational/structural (never intrinsic) seems unmotivated and unexplored; most primitivists allow intrinsic dispositions.
  *   **Primitivist Dualism + Pan-Dispositionalism:** These are mutually exclusive – Dualism needs categoricals, Pan-Dispositionalism abolishes them.
  *   **Humean Categoricalism + Non-Counterfactual Analysis:** Humeans typically ground dispositions in laws and thus counterfactuals. A Humean adopting a non-counterfactual (e.g., power-based) analysis seems incoherent.
  *   **Identity View + Distinct Basis:** The Identity View explicitly rejects distinct bases for dispositions. A view claiming identity *and* needing a separate basis is contradictory. These empty rooms arise either from incoherence (last two) or lack of motivation/exploration rather than inherent impossibility.

  **Blind Spots (150 words)**

  The tree struggles to perfectly separate:
  1.  **Potentiality/Power-Based vs. Primitivist Dualism:** Both say dispositions are irreducible. The key difference is whether they are a *sui generis kind* (Dualism) or a *fundamental mode of being* (Potentiality). A further question needed: "Are dispositions a distinct *category* of property alongside categorical properties, or are they the fundamental way *all* properties are?"
  2.  **Propensity Theories vs. Reformed Conditional Analysis (with chance):** Both can handle probabilities. The tree branches based on whether non-counterfactual analysis is chosen (Q2). RCA could incorporate chance ("would break with probability P if struck, while retaining B"). To separate them: "Is the core analysis *essentially* probabilistic/chance-based, or is chance merely a feature *within* a conditional analysis?"
  3.  **Structuralism/Relationalism vs. Others:** This is less a distinct leaf and more a modifier applicable to several leaves (like CNA, Potentiality, Primitivism). The branch about the basis (implied in Q4/Q7) helps, but a specific question like "Can a disposition be grounded *solely* in relations to other objects or structures, without a localized intrinsic basis in the bearer?" would isolate the commitment.
