prompt: |-
  I am in a foundations-of-cognitive-science seminar where I have been asked to defend the claim that the brain is a computer, and I have discovered that I cannot argue the point at all until I know what an account of computational implementation would have to deliver before it could be used to settle the question. Everything anyone says in the seminar — that the brain is or is not a computer, that a system merely as-if computes, that a description is 'just' a description — presupposes some standard for when a physical system really implements a computation, and nobody has stated it. So before I write anything, I would like the desiderata: the requirements that any adequate account of what it is for a physical system to implement a computation must satisfy, each one stated as a requirement and accompanied by the case or consideration that makes it a requirement, with a clear indication of which of them are non-negotiable and which are simply commitments of one camp rather than genuine constraints.

  I want the list built against a particular set of cases, since those are the ones my argument will turn on and I do not want a list that only handles the easy ones. (1) The triviality cases: if any physical system with enough parts can be described as implementing any finite-state machine with few enough states, the account must explain why that is not fatal, and it must not do so by appealing to what an observer finds it convenient to say. (2) The analog and the dubious cases: a slide rule, an integrator circuit, a riverbed, a folding protein, a weather system — for each, the account should let us say whether the system computes a function or whether that is a projection of the describer's interests, and if the answer is that it depends on the describer, the account should say on what, precisely. (3) The lab cases: a spiking network in which no individual neuron carries a symbol and the putative computation lives in a population trajectory; a system whose dynamics are noisy, so that any state-to-state description holds only approximately; and a system whose computation is defined over a timescale far longer than the lifetime of any of its parts. (4) The case that set me off: two systems said to compute the same function whose internal states cannot be put into any useful correspondence with one another, so that the account must say what makes them implementations of one computation rather than two computations that happen to agree at the output. For each requirement, give the case it is answerable to; and if you think one of my four cases is not really a case, say so and say what it actually shows.

  The part I most want is the negative result. Once the requirements are listed, tell me whether some subset of them is jointly unsatisfiable, and which one I should give up if so; my own suspicion is that nontriviality, the objectivity of implementation (its not being a fact about the describer), and the explanatory autonomy of computational posits in cognitive science (the thing that lets a modeler say the system is computing a particular function, not merely being described as if it were) cannot all be had at once, and that each familiar escape route buys one by paying for another — but I would rather be told that I have mis-drawn the space. Also tell me which requirement a reasonable person is most likely to deny, since that is where I expect the seminar to push. I do not need references or a survey of who has said what; I need the criteria themselves, and I will do the comparison against the positions we have read on my own.
reasoning: |-
  We are building a list of desiderata for an account of computational implementation. The account must tell us when a physical system genuinely implements a computation, as opposed to merely being describable as doing so. We have four sets of cases to consider:

  1. Triviality: The worry that any physical system can be seen as implementing any computation (with a sufficiently large state space) and how to avoid that without making implementation observer-dependent.
  2. Analog and Dubious Cases: Slide rule, integrator circuit, riverbed, folding protein, weather system. We need to say for each whether it computes, or whether that's a projection, and if it depends on the describer, on what exactly.
  3. Lab Cases: 
     a. A spiking neural network where the computation is at the population level, not in individual neurons.
     b. Noisy dynamics so state transitions are approximate.
     c. Computation over a timescale longer than the lifetime of its parts (so the system is changing while computing).
  4. The Case of Multiple Realization: Two systems that compute the same function but with no useful internal state correspondence, so we must say why they implement the same computation and not just two that happen to have the same input-output.

  We will list requirements, each with the case that motivates it. Then we will discuss which are non-negotiable and which are camp-commitments. Finally, we will consider negative results and which requirement is most deniable.

  ## Desiderata for an Account of Computational Implementation

  ### 1. Non-Triviality (NT)
  - **Requirement**: The account must not entail that every physical system (with enough parts) implements every computation (with a bounded state space). Moreover, it must avoid triviality without appealing to the convenience or interests of an observer.
  - **Motivating Case**: Triviality cases (1). If we allow that any system can be mapped to any computation arbitrarily, then the claim that the brain is a computer becomes vacuous. We need a principled reason to rule out such mappings as non-implementations.
  - **Non-Negotiable**: Yes. Without this, the claim that the brain is a computer is trivial and uninformative.

  ### 2. Objectivity (O)
  - **Requirement**: Whether a system implements a computation must be an objective fact about the system, not a fact about the describer's interests, perspective, or descriptive practices. The implementation relation must hold independently of any observer.
  - **Motivating Case**: Analog and dubious cases (2). For the riverbed and weather system, we suspect that they do not objectively compute, but we want an account that explains why without making it relative to an observer. If the slide rule or integrator circuit objectively compute, then there must be an objective fact of the matter. If it depends on the describer, then we must specify exactly what it depends on (e.g., the function we choose to focus on) without making it subjective.
  - **Non-Negotiable**: This is a point of contention. Some (e.g., Searle) might argue that computation is observer-relative. But for the brain-as-computer thesis to be substantive, objectivity is often desired. However, we note that it might be a camp commitment (for realists) rather than a non-negotiable constraint.

  ### 3. Explanatory Autonomy (EA)
  - **Requirement**: The account must allow that the computational description of a system can be explanatory in its own right, without being reducible to lower-level physical descriptions. In cognitive science, this means that positing a computation can explain cognitive capacities without having to refer to the physical details that implement it.
  - **Motivating Case**: Lab case (3a) and multiple realization (4). For the spiking neural network, the population-level computation is taken to explain behavior without requiring a neuron-by-neuron correspondence. Also, multiple realization (4) shows that two systems with different internal structures can implement the same computation, which is key to computational explanations in cognitive science (e.g., same program on different hardware). Without explanatory autonomy, computational explanations collapse into physical ones and lose their generality.
  - **Non-Negotiable**: For cognitive science, this is crucial. However, it might be a camp commitment (functionalists) rather than a universal constraint.

  ### 4. Approximation Tolerance (AT)
  - **Requirement**: The account must allow for approximate implementation because physical systems are noisy and may not follow state transitions exactly. The implementation relation should not require perfect state-to-state correspondence but should allow for a margin of error.
  - **Motivating Case**: Lab case (3b). A system with noisy dynamics. If we require exact state transitions, then no physical system (due to noise) would implement any computation. We need a notion of implementation that is robust to small deviations.
  - **Non-Negotiable**: Yes, because physical systems are always subject to noise and approximation.

  ### 5. Multi-Scale Implementation (MS)
  - **Requirement**: The account must allow that the same physical system can implement computations at multiple levels of description (e.g., at the level of individual neurons and at the level of neural populations) and that a computation can be implemented over a timescale that exceeds the lifetime of the system's components (so the system may change during the computation).
  - **Motivating Case**: Lab case (3c) and (3a). For (3c): a computation that takes longer than the lifetime of the system's parts (e.g., a cell that divides during a long computation). For (3a): a population-level computation that is not present at the level of individual neurons.
  - **Non-Negotiable**: Yes, because biological systems (like the brain) are dynamic and have components that turn over.

  ### 6. Function Specification (FS)
  - **Requirement**: The account must specify which function is being computed and what counts as the input and output of the system. This might involve a boundary between the system and its environment and a distinction between what is part of the computation and what is not.
  - **Motivating Case**: Analog and dubious cases (2). For a riverbed, we might say it "computes" the path of least resistance, but is that a function? The account must say what constitutes the input and output. For a slide rule, we have clear inputs (positions of the slide) and outputs (readings). But for a folding protein, what are the inputs and outputs? Also, the multiple realization case (4): if two systems have the same input-output function but different internal states, we need to specify the function independently of the internal states to say they compute the same function.
  - **Non-Negotiable**: Yes, because without specifying the function, we don't know what computation we are talking about.

  ### 7. State Individuation (SI)
  - **Requirement**: The account must provide a way to individuate the states of the physical system that correspond to the computational states. This might be done by causal role, by information carried, or by some other objective feature. It must avoid arbitrary groupings of physical states into computational states.
  - **Motivating Case**: Triviality cases (1) and multiple realization (4). To avoid triviality, we need a non-arbitrary way to group physical states into computational states. For multiple realization, we require that the two systems have states that play the same causal role in the computation, even if they are physically different.
  - **Non-Negotiable**: Yes, because without state individuation, we cannot map the physical system to the computational states.

  ### 8. Causal Structure (CS)
  - **Requirement**: The physical state transitions must causally mirror the computational state transitions. That is, the causal structure of the physical system must be isomorphic (or sufficiently similar) to the computational structure.
  - **Motivating Case**: Triviality cases (1) and analog cases (2). For the riverbed, if we say it computes the path of least resistance, we must show that the physical dynamics (water flow) are causally driven by the bed's shape in a way that mirrors the computation. Without a causal mirroring, we might just be projecting. Also, for the integrator circuit, the causal structure of the circuit directly mirrors the integration function.
  - **Non-Negotiable**: This is often considered essential. However, note that for some analog systems (like a slide rule) the causal structure might be continuous and not discrete, so the account must allow for analog computation.

  ### 9. Input-Output Boundary (IO)
  - **Requirement**: The account must specify how to identify the inputs and outputs of the system. This includes delineating the system from its environment and specifying the points at which inputs are received and outputs are delivered.
  - **Motivating Case**: Analog and dubious cases (2). For a weather system, if we consider the entire atmosphere, what counts as input? Solar radiation? And output? The weather pattern? Without a clear boundary, it becomes arbitrary. Also, in the brain, we need to say where the inputs (sensory) and outputs (motor) are.
  - **Non-Negotiable**: Yes, but note that the boundary might be defined by the system's functional organization (e.g., the sensory transducers and motor effectors).

  ### 10. Multiple Realization (MR)
  - **Requirement**: The account must allow that the same computation can be implemented by physically distinct systems that do not share the same state types at a fine-grained level. Moreover, it must explain why they are implementations of the same computation and not just two systems that happen to have the same input-output behavior.
  - **Motivating Case**: The case that set you off (4). Two systems with the same input-output function but no useful internal state correspondence. The account must say that the internal states are playing the same functional roles (even if physically different) so that the causal structure is the same at some level of abstraction.
  - **Non-Negotiable**: For functionalism in cognitive science, yes. But someone who denies multiple realizability (like a type-identity theorist) might not require this.

  ### Non-Negotiable vs. Camp Commitments

  Non-negotiable (without which the account would be inadequate for the physical world and cognitive science):
  - NT: Non-Triviality
  - AT: Approximation Tolerance
  - MS: Multi-Scale Implementation
  - FS: Function Specification
  - SI: State Individuation (non-arbitrary)
  - CS: Causal Structure (at least in some form)
  - IO: Input-Output Boundary

  Camp commitments (which might be denied by some):
  - O: Objectivity - Denied by those who think computation is observer-relative.
  - EA: Explanatory Autonomy - Denied by reductionists.
  - MR: Multiple Realization - Denied by type-identity theorists.

  ## Negative Result

  You suspect that Non-Triviality (NT), Objectivity (O), and Explanatory Autonomy (EA) cannot all be had at once. Let's examine:

  - NT requires that not every system implements every computation. We avoid triviality by having constraints (like causal structure) that are objective.
  - O requires that the implementation is observer-independent.
  - EA requires that computational descriptions are explanatory without reduction.

  The tension: 
  - If we require objectivity and non-triviality, we might have to tie implementation to specific physical properties (like causal structure). But then, for multiple realization (which is part of EA), we must allow that different physical systems can have the same causal structure at an abstract level. However, if we abstract too much, we risk triviality (because then we might map anything to anything). 

  Moreover, if we insist on objectivity, we must avoid any appeal to the observer's interests. But without that, how do we choose the level of abstraction? For example, in the neural population case, what makes the population level the "right" level? If we say it's because it explains the behavior, that might introduce an element of explanatory interest (which is observer-relative) and threaten objectivity.

  So, it seems that NT, O, and EA are in tension. We can have:

  Option 1: Drop O (Objectivity). Then we can say that implementation is relative to an explanatory perspective. This is the route of some pragmatists (e.g., Putnam at one point, or Dennett). Then we avoid triviality by saying that the mapping must be useful for explanation (EA) and prediction, but that is observer-dependent.

  Option 2: Drop EA (Explanatory Autonomy). Then we tie implementation strictly to physical structure (e.g., type-identity). Then we have objectivity and non-triviality, but multiple realization is lost and computational explanations become species-specific (or even individual-specific). This would be a blow to cognitive science.

  Option 3: Drop NT? But that is non-negotiable because without it the claim is trivial.

  Alternatively, we might try to satisfy all by a careful account. For example, causal structure (CS) might be objective and non-trivial, and then multiple realization is allowed because different physical systems can have the same causal structure (at a functional level). But then the challenge is to specify the functional level without observer relativity. If we can do that, then we might have all three.

  But note: the specification of the functional level might require an objective basis (like the system's causal organization at a certain scale) that is independent of the observer. However, the choice of scale might be driven by explanatory interests. This is the crux.

  ## Which requirement is most deniable?

  The most deniable requirement is **Objectivity (O)**. Many philosophers (e.g., Searle, Putnam in his later work, and more recently, Piccinini) have argued that computation is not intrinsic to the system but depends on an interpreter. Therefore, in the seminar, you can expect pushback on objectivity. Someone might say: "The brain is a computer only relative to our computational theory of cognition; it's not a fact in nature."

  ## Summary of Requirements

  1. **Non-Triviality (NT)**: Must avoid universal implementability. (Case 1)
  2. **Objectivity (O)**: Implementation must be observer-independent. (Case 2)
  3. **Explanatory Autonomy (EA)**: Computational explanations must be autonomous. (Cases 3a, 4)
  4. **Approximation Tolerance (AT)**: Allow for noise. (Case 3b)
  5. **Multi-Scale Implementation (MS)**: Allow computations at multiple levels and over changing components. (Case 3c, 3a)
  6. **Function Specification (FS)**: Clear input, output, and function. (Case 2, 4)
  7. **State Individuation (SI)**: Non-arbitrary grouping of physical states. (Cases 1, 4)
  8. **Causal Structure (CS)**: Physical state transitions must causally mirror computational ones. (Cases 1, 2)
  9. **Input-Output Boundary (IO)**: Clear system boundaries. (Case 2)
  10. **Multiple Realization (MR)**: Same computation in different physical systems. (Case 4)

  ## Final Note on Your Four Cases

  - Case 1 (Triviality) is a genuine case that any account must address.
  - Case 2 (Analog and Dubious) is also genuine and tests the boundaries of computation.
  - Case 3 (Lab Cases) are genuine and test the applicability to real cognitive science.
  - Case 4 (Multiple Realization without correspondence) is genuine and tests the functionalist intuition.

  None are dismissed.

  ## Recommendation

  In defending the brain-as-computer, you might:

  1. Adopt an account that emphasizes causal structure and functional organization (e.g., a version of mechanistic computation) to satisfy NT, CS, SI, FS, IO, and AT. 
  2. Argue that objectivity can be maintained by grounding the computational description in the system's causal structure, which is objective. 
  3. For multiple realization and explanatory autonomy, argue that the causal structure can be abstracted (multiple physical states can play the same causal role) and that this abstraction is objective because it is based on the system's organization.

  But be prepared to defend objectivity. Alternatively, if you want to concede that computation is observer-relative, you can still argue that it is a valid and useful perspective for cognitive science.

  Good luck!
answer: |-
  Below is a systematic presentation of the desiderata (requirements) for an adequate account of computational implementation, tailored to your four cases. Each requirement is stated explicitly, linked to the case(s) that necessitate it, and categorized as either **non-negotiable** (essential for any coherent account) or **camp-commitment** (reflects a stance in the philosophy of mind/cognitive science, often tied to functionalism or realism). After the list, I address your suspicion of a negative result and identify the most deniable requirement.

  ---

  ### **Desiderata for an Account of Computational Implementation**

  1. **Non-Triviality (NT)**  
     - **Requirement**: The account must prevent *any* physical system from being interpretable as implementing *any* computation, especially for finite-state machines. It must rule out arbitrary mappings (e.g., "ad hoc" state groupings) without invoking observer convenience.  
     - **Case**: Triviality (1). If any system can "implement" any computation, the claim "the brain is a computer" is vacuously true.  
     - **Status**: **Non-negotiable**. Without this, computationalism is unfalsifiable and explanatorily empty.  

  2. **Causal Structure Fidelity (CSF)**  
     - **Requirement**: The physical system must exhibit causal state transitions that reliably mirror the formal state transitions of the computation. This includes counterfactual robustness (e.g., if input X *had* occurred, output Y *would* follow).  
     - **Cases**: Triviality (1), Analog/Dubious cases (2), Lab cases (3b–c). Prevents trivial mappings by demanding causal—not just descriptive—congruence. For example, a riverbed lacks robust state transitions; an integrator circuit has them.  
     - **Status**: **Non-negotiable**. Computational implementation requires physical causation to "track" formal rules.  

  3. **Input-Output Specification (IOS)**  
     - **Requirement**: Inputs and outputs must be identifiable as distinct physical events or states, with defined boundaries between the system and its environment. The mapping cannot be retroactively imposed.  
     - **Cases**: Analog/Dubious cases (2), Multiple realization (4). E.g., a slide rule has clear inputs (slider positions) and outputs (cursor readings); a weather system lacks non-arbitrary I/O boundaries.  
     - **Status**: **Non-negotiable**. Without objective I/O, function specification collapses into observer projection.  

  4. **State Individuation Principle (SIP)**  
     - **Requirement**: The physical basis for individuating computational states (e.g., state A vs. B) must be non-arbitrary and grounded in physical properties (e.g., causal role, functional equivalence classes), not descriptive convenience.  
     - **Cases**: Triviality (1), Lab case (3a), Multiple realization (4). E.g., in a spiking network, population states must be defined by collective dynamics (e.g., attractors), not neuron-level activity.  
     - **Status**: **Non-negotiable**. Arbitrary state grouping invites triviality.  

  5. **Approximation and Noise Tolerance (ANT)**  
     - **Requirement**: The account must allow for implementation under noise, approximation, or error, without requiring perfect state-to-state correspondence. Robustness to small perturbations is essential.  
     - **Case**: Lab case (3b). A noisy system (e.g., a neural circuit with stochastic spiking) can still implement a computation if deviations are bounded and non-cumulative.  
     - **Status**: **Non-negotiable**. Physical systems are inherently noisy; demanding perfection renders implementation impossible.  

  6. **Timescale and Substrate Independence (TSI)**  
     - **Requirement**: Implementation must be definable for computations unfolding over timescales longer than the lifespan of components (e.g., neurons replacing during learning), and must not depend on substrate-specific properties.  
     - **Case**: Lab case (3c). E.g., a self-repairing system must maintain computational continuity despite component turnover.  
     - **Status**: **Non-negotiable**. Biology requires implementation to be resilient to physical change.  

  7. **Objectivity (O)**  
     - **Requirement**: Implementation must be an objective fact about the system, independent of an observer’s description, interests, or interpretive stance. The system must have computational properties intrinsically.  
     - **Cases**: All, especially Analog/Dubious (2). E.g., whether an integrator circuit computes is objective; whether a folding protein does depends on if it has intrinsic I/O and state transitions.  
     - **Status**: **Camp-commitment** (functionalist/realist). Denied by interpretivists (e.g., Searle) who see computation as observer-relative.  

  8. **Explanatory Autonomy (EA)**  
     - **Requirement**: Computational descriptions must be explanatory in a way that is irreducible to lower-level (e.g., physical) descriptions. The computational level provides unique causal/explanatory power.  
     - **Cases**: Lab case (3a), Multiple realization (4). E.g., population-level computation explains behavior without neuron-level reduction.  
     - **Status**: **Camp-commitment** (functionalist). Denied by reductionists who view computation as merely descriptive.  

  9. **Multiple Realizability without Correspondence (MRC)**  
     - **Requirement**: Two systems can implement the *same* computation despite lacking isomorphic internal states, provided they share input-output mappings *and* abstract causal dynamics (e.g., same state transition rules under coarse-graining).  
     - **Case**: Multiple realization (4). E.g., two vision systems with different neural architectures compute "edge detection" if both transform inputs to outputs via similar high-level state transitions.  
     - **Status**: **Camp-commitment** (functionalist). Denied by type-identity theorists demanding state-to-state correspondence.  

  10. **Function-Specificity (FS)**  
      - **Requirement**: The computed function must be uniquely specified by the system’s causal organization. Over-generality (e.g., a system "computing" multiple functions) must be resolvable objectively.  
      - **Cases**: Analog/Dubious (2), Multiple realization (4). E.g., a riverbed may "minimize resistance" but lacks a specific function; a slide rule computes logarithmic functions specifically.  
      - **Status**: **Non-negotiable**. Without this, the computation is underspecified and vulnerable to triviality.  

  ---

  ### **Analysis of Your Cases**
  - **Case 1 (Triviality)**: Genuine. Tests **NT**, **SIP**, and **FS**. Any account must block arbitrary mappings while grounding states/transitions objectively.  
  - **Case 2 (Analog/Dubious)**: Genuine. Tests **IOS**, **CSF**, and **O**. Forces clarification of "real" vs. "as-if" computation (e.g., slide rule: computes; riverbed: does not).  
  - **Case 3 (Lab Cases)**: Genuine. Tests **ANT** (noise), **TSI** (timescales), and **SIP** (population-level states). Shows implementation must handle real-world complexity.  
  - **Case 4 (Multiple Realization)**: Genuine. Tests **MRC** and **EA**. Reveals that computational identity hinges on abstract causal roles, not physical states.  

  ---

  ### **Negative Result: Joint Unsatisfiability**
  Your suspicion is correct: **Non-Triviality (NT)**, **Objectivity (O)**, and **Explanatory Autonomy (EA)** cannot be jointly satisfied. This is the core tension:  
  - **NT** demands constraints to block universal implementability (e.g., via **CSF** or **SIP**).  
  - **O** requires these constraints to be observer-independent (e.g., intrinsic causal structure).  
  - **EA** requires computational descriptions to be irreducible and autonomous, which often relies on abstraction (e.g., coarse-grained states) that appears observer-dependent.  

  **Why they conflict**:  
  - To satisfy **NT** and **O**, implementation must be grounded in objective physical properties (e.g., causal dynamics). But **EA** requires computational properties to be "abstract" (e.g., multiply realizable), which introduces granularity choices that seem observer-relative. For example, in Lab case (3a), defining "population-level states" for a spiking network serves explanatory goals but may lack objective boundaries without causal criteria.  
  - **Escape routes and trade-offs**:  
    - **Deny O (e.g., interpretivism)**: Implementation is observer-relative. Solves the conflict by abandoning objectivity, preserving NT (via pragmatic constraints) and EA (computation as a useful perspective). Cost: The brain is not "intrinsically" a computer.  
    - **Deny EA (e.g., reductionism)**: Computation reduces to physics. Preserves NT and O but loses explanatory power (e.g., population-level descriptions become heuristic). Cost: Undermines cognitive science's autonomy.  
    - **Deny NT**: Leads to triviality, universally rejected.  

  **Recommendation**: Give up **Objectivity (O)**. It is the most deniable requirement and aligns with pragmatic approaches in cognitive science (e.g., Dennett's "intentional stance"). This preserves **NT** (via causal constraints) and **EA** (computation as an explanatory tool), which are crucial for defending computationalism in your seminar.  

  ---

  ### **Most Deniable Requirement**
  - **Objectivity (O)** is the most likely target for denial. Critics (e.g., Searle, later Putnam) argue computation is not "in the system" but assigned by observers. In your seminar, expect objections like: "Computation is a perspective, not a fact." Defending the brain-as-computer then becomes a pragmatic argument about explanatory power, not ontology.  

  ---

  ### **Summary for Your Defense**
  - **Core non-negotiables**: NT, CSF, IOS, SIP, ANT, TSI, FS (ensure non-triviality, causal fidelity, and physical realizability).  
  - **Camp-commitments**: O, EA, MRC (defend these as functionalist commitments).  
  - **Strategy**: Argue that a **causal-mechanistic account** (e.g., Piccinini's) satisfies non-negotiables:  
    - Implementation requires physical mechanisms to reliably mimic formal state transitions (**CSF** + **SIP**).  
    - This avoids triviality (**NT**) while accommodating noise (**ANT**) and timescales (**TSI**).  
  - **Concede O**: Admit computation is observer-relative *in practice* but argue this doesn't weaken its explanatory role. For example: "The brain computes relative to our cognitive models, but these models are constrained by causal structure, ensuring non-arbitrariness."  
  - **Leverage EA**: Computational descriptions are indispensable for explaining cognition (e.g., population dynamics in Lab case 3a).  

  This framework lets you defend computationalism while acknowledging philosophical tensions. Use the cases to test competing accounts—e.g., triviality against overly permissive theories, multiple realization against reductionist ones.
