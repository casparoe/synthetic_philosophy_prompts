prompt: |-
  Last spring I learned that I carry a mutation putting me at high risk for a late-onset neurodegenerative disease. Predictive testing for conditions of this kind is cheap and accurate, and a substantial fraction of people at risk decline it — a pattern the information-avoidance literature has documented and tried to explain. I read my way into the decision theory expecting to find the reassuring standard result: in Savage's framework, an expected-utility maximizer offered costless information before choosing can always ignore it, so the option to learn can only weakly raise expected utility. Good's theorem, and the earlier unpublished note of Ramsey's that it turns out to have anticipated, gave me a clean statement of what I had intuitively assumed about my own case. What I did not expect was how fragile the result looks once you leave expected-utility maximization or relax the assumption that information is genuinely free, and how little agreement there is about which of the escapes from the theorem is the philosophically interesting one.

  That is the background. What I want is a prioritized research agenda, not a survey. Suppose I have two or three years and a philosopher's toolkit — formal decision theory, some probability, no empirical lab — and I want to work on the value of information. Which open questions in this area most deserve that time, and in what order? I am asking for a defended ranking. For each candidate, tell me what the question is, whether it is upstream of other work, how tractable it is for someone with my background, how neglected it is, and what a decisive result would even look like. Then tell me which of the standard candidates I should deprioritize, and why.

  At minimum I would like you to weigh the following, though I would rather you tell me if I have mis-framed the space than simply rank what I hand you:

  The status of the negative-value counterexamples. Information can have negative expected value under non-expected-utility rules such as maximin and minimax regret, and under ambiguity-averse or imprecise-probability models; the value of information is also sensitive to whether the information is truly costless, whether the agent can commit in advance to ignoring it, and whether the agent's preferences or identity change on learning. Is there a principled characterization of exactly when information can hurt a rational agent, and does that characterization illuminate rationality, or only the particular decision rule we happened to assume?

  The relationship between the theorem and actual information avoidance. The empirical literature — the Golman, Hagmann and Loewenstein review is the obvious entry point — documents people declining free and useful information, and the low uptake of predictive testing for conditions such as Huntington's disease is the paradigm case. Is this best modelled as a violation of expected utility, as utility that depends directly on beliefs, as a failure of the assumptions about what counts as the same decision problem before and after learning, or as something else? Which of these would genuinely change how much normative force the theorem has?

  The theorem's dependence on the sure-thing principle and on the partition of states. Good's result is a theorem inside Savage's framework. How much survives when we weaken the sure-thing principle, when the state space is vague or open-ended, or when the agent's hypotheses are not antecedently well defined — which is the normal situation in science? Is there a version of the result for non-Bayesian or logically uncertain agents, and if not, is that a limitation of the result or a genuine failure of the principle?

  The individual versus the social value of information. In strategic settings, information can have negative value for its receiver because it changes what others can infer, and it can be harmful even when acquiring it is individually rational. How much of the philosophical interest lies in this contrast, and how much of the decision-theoretic literature has actually engaged with it?

  The bearing of the theorem on the epistemology of inquiry: whether one ought to seek evidence, how to weigh the risk that inquiry is self-undermining, and whether the theorem supports or undercuts the norm that one should gather more evidence before acting.

  I want the ordering argued rather than asserted. State your criteria — importance, tractability, upstreamness, neglectedness — say how you trade them off, and say what would move a question up or down the list. Where you are uncertain, say so explicitly. Do not give me a reading list: I want the argument for the ordering, and the reasons each question is or is not worth the years.
reasoning: |-
  Okay, let me start by unpacking the user's query. They discovered they carry a mutation for a neurodegenerative disease and are grappling with the decision-theoretic aspects of information avoidance. They mention Good's theorem and its fragility outside strict expected utility. Their main request is a prioritized research agenda for the next few years, focusing on the value of information.

  First, I need to understand their background. They have a philosopher's toolkit—formal decision theory, some probability, no empirical lab. So, their research will be theoretical. They want open questions ranked by importance, tractability, upstreamness, neglectedness, and what a decisive result would look like. They also listed specific areas to consider: counterexamples, real-world avoidance, foundational assumptions, social value, and epistemology.

  Hmm, the user is clearly deeply informed. They reference Savage, Good, Ramsey, and recent literature like Golman et al. They’re aware of the gaps in the standard model. Their personal experience adds urgency; this isn’t just academic. They might be seeking not just a research plan but also personal clarity through their work. I should acknowledge that implicitly without overstepping.

  Breaking down their areas: 

  1. **Counterexamples (Negative Value of Info)**: They know info can hurt under non-EU rules. The question is whether this illuminates rationality or just specific rules. This is foundational but might be well-trodden. 

  2. **Real-world Avoidance**: Connecting theory to empirical behavior, like declining genetic testing. Is it due to belief-dependent utility or something else? This bridges theory and practice, which they might value given their experience. 

  3. **Foundational Assumptions**: How robust is Good’s theorem without Savage’s axioms? Open-ended states, vague hypotheses—common in real science. This is upstream but abstract. 

  4. **Social Value**: Info in strategic settings can backfire. Interesting, but maybe less central to their personal query about individual rationality. 

  5. **Epistemology**: Should we seek evidence? Does the theorem support gathering more info? Philosophical implications here. 

  Now, criteria: 
  - **Importance**: Core theoretical insights vs. practical relevance. Their background suggests valuing deep theory, but their experience might tilt them toward applicability. 
  - **Tractability**: With their tools, some areas are more feasible. Non-EU models might be manageable; social game theory less so. 
  - **Upstreamness**: Foundational work enables other research. Question 3 (assumptions) could unlock others. 
  - **Neglectedness**: Overly discussed topics vs. underexplored. Counterexamples are known, while epistemology’s link to decision theory might be less mapped. 

  Prioritization Reasoning:
  - **Top Priority (Question 3: Foundational Assumptions)**: Why? If Good’s theorem collapses outside Savage, that’s fundamental. It’s upstream—answers here affect all others. For example, if the theorem fails with vague states, that impacts how we model real decisions (like genetic testing). Tractability: They can use formal tools without new empirical work. Neglectedness: Less done on open-ended states vs. non-EU rules. Decisive result: A framework showing when the theorem holds with weakened axioms. 

  - **Second Priority (Question 2: Real-world Avoidance)**: Connects theory to their personal context. Explaining why people decline testing could validate or challenge normative models. Importance is high for bridging theory/practice. Tractability: They can model belief-dependent utilities formally. Less neglected than foundational work but needs fresh links. Decisive result: A unified model explaining avoidance without ad-hoc assumptions. 

  - **Third Priority (Question 5: Epistemology)**: Addresses “should we seek evidence?”—philosophically profound. If the theorem doesn’t mandate evidence-seeking, that challenges epistemic norms. Tractability: Requires merging decision theory with epistemology, feasible with their background. Neglectedness: Underexplored intersection. Decisive result: Formal proof that seeking evidence isn’t always rational. 

  Deprioritized:
  - **Question 1 (Counterexamples)**: Well-studied. Adding another non-EU model might not offer new insight. Their fragility is known; deeper foundations (Q3) matter more. 
  - **Question 4 (Social Value)**: Important but diverges into game theory. Less relevant to individual cases like theirs. 

  Trade-offs: Upstreamness (Q3) outweighs immediate applicability (Q2) because fixing foundations strengthens all applications. But Q2 is urgent given their experience. Balancing both as 1st and 2nd makes sense. 

  Uncertainties: Is Q3 too abstract? Maybe, but it’s necessary. For Q5, merging epistemology/decision theory might be messier than expected. 

  Finally, the user might need reassurance that their plan addresses both theoretical depth and personal relevance. Emphasizing how Q2 ties to genetic testing could resonate. Also, flagging that social aspects, while deprioritized, might later connect if their view expands.
answer: |-
  Here is a prioritized research agenda for the value of information (VoI), argued using your criteria: **importance** (theoretical depth, normative implications), **tractability** (feasibility with a philosopher’s toolkit), **upstreamness** (how foundational the question is for others), **neglectedness** (under-explored relative to significance), and **decisive-result potential** (clarity on what constitutes success). I weigh importance and upstreamness most heavily, as they create leverage for future work. Tractability ensures you can make progress; neglectedness avoids duplicating well-trodden paths.

  ### Core Ranking (Highest to Lowest Priority)
  1.  **Foundational Robustness: The Theorem Without Savage’s Scaffolding**  
      **The Question:** How does Good’s theorem fare when we weaken the sure-thing principle, allow vague/open-ended state spaces, or accommodate agents without pre-defined hypotheses (e.g., in scientific inquiry or logical uncertainty)?  
      **Why #1?**  
      -   **Importance/Upstreamness:** Utmost. This attacks the *core assumptions* of the entire VoI framework. If the theorem collapses outside Savage’s world, it fundamentally reorients the normative force of VoI arguments (e.g., in science, medicine, philosophy). It’s upstream because answers here constrain or enable work on counterexamples, applications, and epistemology.  
      -   **Tractability:** High for your background. Focus on formal exploration: weaken Savage’s axioms systematically (e.g., using frameworks like Joyce’s non-pragmatic vindications of probabilism, or models of imprecise probability/choice under ambiguity that relax completeness or independence). Analyze logical uncertainty (e.g., Garrabrant, MIRI-style models) where states aren't pre-defined.  
      -   **Neglectedness:** Moderate-High. While non-EU models are well-studied, the *specific fragility of VoI* under weakened foundations (especially open-endedness/vagueness) is less charted than counterexamples themselves. Work on VoI for logical uncertainty is nascent.  
      -   **Decisive Result:** A characterization: "Good’s theorem holds iff [set of axioms A, B, C] hold, where C crucially requires [e.g., state-space fixity, partitional knowledge]." Or, a demonstration that *no* non-trivial VoI-positive theorem exists without a strong independence/sure-thing-like axiom under open-ended uncertainty.  
      -   **Move Down If:** You find existing work (e.g., Seidenfeld on STP violations, literature on awareness growth) already decisively answers this. Likely not – the *normative implications* for inquiry remain contested.

  2.  **The Nature of Real-World Avoidance: Bridging Theory and Phenomenology**  
      **The Question:** Is observed avoidance of predictive testing (like Huntington’s or your case) best modeled as a rational response under non-standard preferences (e.g., belief-dependent utility), a failure of diachronic rationality (inability to commit), or a fundamental challenge to modeling "the same decision problem" pre/post-learning?  
      **Why #2?**  
      -   **Importance:** Directly connects the formalism to the human experience motivating your inquiry (including your own). A good model here has significant normative/practical implications for predictive testing, disclosure policies, and autonomy.  
      -   **Upstreamness:** Moderate-High. A convincing model constrains plausible theories of preference formation, diachronic rationality, and belief ontology. It forces engagement with the "rationality" of avoidance.  
      -   **Tractability:** High. Rigorously formalize and compare competing explanations:  
          *   *Belief-Dependent Utility (BDU):* Model `U(action, outcome, belief)` – e.g., anticipatory dread (`U` decreases with belief in bad outcome) or belief-based self-conception (`U` depends on coherence of identity-narratives).  
          *   *Diachronic Commitment Failure:* Model agents who *would* benefit from info *if they could pre-commit* to a policy, but cannot stick to it upon learning (e.g., hyperbolic discounting of future selves' welfare).  
          *   *Changing "The Problem":* Formalize how learning changes the *description* of states/outcomes (e.g., learning creates new "identity states" with different utilities).  
      -   **Neglectedness:** Moderate. BDU is studied (Caplin, Leahy; Epstein '08), but its application to *high-stakes health info avoidance* and comparison with commitment models needs depth. The "changing problem" angle is less formalized.  
      -   **Decisive Result:** A formal argument showing one model *uniquely* explains key empirical patterns (e.g., selective avoidance, post-learning regret, correlation with anxiety traits) where others fail. Or, demonstrating that BDU models inevitably violate a core normative principle unless constrained in specific ways.  
      -   **Move Up If:** Your personal motivation makes this the *sine qua non*. Move down slightly if purely theoretical foundations feel more urgent.

  3.  **Epistemology of Inquiry: Does VoI Theory Tell Us to Seek Evidence?**  
      **The Question:** What normative guidance does VoI theory provide for the *active seeking* of evidence, especially when inquiry risks self-undermining beliefs (e.g., learning one’s research program is flawed)? Does Good’s theorem primarily protect against *forced* information, or does it actively recommend seeking costless info?  
      **Why #3?**  
      -   **Importance:** Connects decision theory directly to core epistemological questions about the ethics/duty of inquiry. Profound implications for scientific methodology and personal intellectual virtues.  
      -   **Upstreamness:** Moderate. Builds on foundations (Q1) and models of preference (Q2), but focuses on the *active epistemic agent*. Clarifies scope of decision-theoretic norms in epistemology.  
      -   **Tractability:** Moderate-High. Analyze extensions of VoI to *search costs* (even if small) and *risks of belief disruption* (modeled as costs to the utility of beliefs themselves or to future inquiry capacity). Formalize "self-undermining" as dynamically inconsistent plans or unstable equilibria in belief states.  
      -   **Neglectedness:** High. While the *value* of evidence is central to epistemology, *formal decision-theoretic analyses* of the *duty to seek*, incorporating belief-dependent utility or inquiry risks, are underdeveloped. Keynes/Knight vs. Savage.  
      -   **Decisive Result:** A formal proof that under plausible (non-Savage) assumptions about inquiry costs/risks, there exist situations where a rational agent *should not* seek freely available information. Or, a demonstration that Good’s theorem, even if it holds, provides *no positive reason* to seek evidence absent a specific decision problem.  
      -   **Move Up If:** Epistemological implications are your primary driver. Move down if empirical/phenomenological grounding (Q2) feels crucial first.

  4.  **Negative Value Counterexamples: Diagnosing the Fragility**  
      **The Question:** Can we provide a unified, principled characterization of when/why information has negative value? Does this illuminate flaws in non-EU rules, genuine normative constraints on rationality, or merely technical quirks?  
      **Why #4?**  
      -   **Importance:** Essential for understanding the *limits* of Good’s result and the normative standing of alternative decision rules.  
      -   **Upstreamness:** Low-Moderate. It diagnoses problems *after* adopting a non-Savage framework (Q1 is more upstream). It informs the evaluation of models in Q2.  
      -   **Tractability:** High. Catalog known counterexamples (minimax regret, ambiguity aversion, specific BDU models like `U = -|outcome - belief|`). Systematically analyze common features (e.g., violation of state-wise dominance, sensitivity to partition structure, non-linearity in probabilities).  
      -   **Neglectedness:** Low. This is the *most* explored area of VoI fragility. Machina, Schlee, Siniscalchi, and others have dissected many counterexamples.  
      -   **Decisive Result:** A theorem: "Information has non-negative value iff the decision rule satisfies [Property X] (e.g., state-wise dominance, linearity in probabilities)." And a *normative argument* for why rational agents *should* satisfy X (or why they need not).  
      -   **Prioritization Reasoning:** While crucial, it’s less *upstream* than Q1 (which asks *why* we might need non-EU rules in the first place) and less *directly linked to the core human phenomenon* than Q2. Significant work exists; your comparative advantage might lie elsewhere. Deprioritize unless you find a truly novel unifying angle.

  5.  **The Social Value of Information: Strategic Shadows**  
      **The Question:** How does the individual VoI change in strategic settings where information acquisition signals types or alters others' behavior, potentially creating negative individual value even under EU? What are the philosophical implications?  
      **Why #5?**  
      -   **Importance:** Crucial for real-world applications (economics, game theory, privacy). Highlights limitations of individualistic decision theory.  
      -   **Upstreamness:** Low. Builds heavily on standard game theory and signaling models. Less likely to reshape core decision theory foundations.  
      -   **Tractability:** Moderate (for a philosopher). Requires comfort with basic game theory (signaling games, Bayesian Nash equilibrium). Modeling "value" here is often clearer than in Q1/Q2.  
      -   **Neglectedness:** Low-Moderate. Well-studied in economics (e.g., Hirshleifer, strategic disclosure models). The *philosophical engagement* with these results (e.g., implications for autonomy, manipulation, the definition of rationality) is less developed but growing.  
      -   **Decisive Result:** A formal taxonomy of mechanisms causing negative *individual* VoI in games (e.g., signaling costs, information-triggered harmful actions by others). A rigorous argument for why these cases don’t challenge the *core individual rationality* of Good’s theorem but highlight its domain of applicability.  
      -   **Prioritization Reasoning:** Intellectually rich, but less central to the *individual, introspective* dilemma driving your inquiry and less upstream for foundational VoI theory. The mechanisms are often clearer than in Q1/Q2/Q3. Deprioritize unless social dynamics become your explicit focus.

  ### Deprioritized Standard Candidates & Why
  *   **Negative Value Counterexamples (Detailed Taxonomy):** Already well-mapped (see Q4 above). Adding another non-EU rule where VoI can be negative is less valuable than understanding *why* we might use such rules (Q1) or how they explain *real avoidance* (Q2).
  *   **Pure Exegesis of Good/Ramsey/Savage:** Important context, but unlikely to yield decisive new insights given your goal of tackling fragility and avoidance.
  *   **Comprehensive Surveys:** You explicitly want a research agenda, not a survey. Synthesis is for later.
  *   **Direct Empirical Work:** Outside your toolkit (no lab).

  ### Trade-offs and Uncertainties
  *   **Importance vs. Tractability:** Q1 is high importance/upstreamness but potentially abstract. Q2 is highly tractable and deeply connected to your motivation. I prioritized Q1 slightly because resolving foundations empowers everything else, and your background is suited to it. **Uncertainty:** Is the "open-ended state space" problem within Q1 *too* vague to be tractable? Focus initially on weakening specific Savage axioms (like P2 - Sure-Thing Principle) using existing formal tools.
  *   **Neglectedness vs. Importance:** Q4 (counterexamples) is less neglected but remains important for understanding fragility. I deprioritized it slightly because progress there may not resolve the deeper foundational (Q1) or phenomenological (Q2) puzzles. **Uncertainty:** Could a *truly unified* characterization of negative VoI emerge? Possible, but it feels like polishing existing results.
  *   **Your Motivation:** Your personal experience makes Q2 (Real-World Avoidance) incredibly salient. While I ranked Q1 first for foundational leverage, the *argument for Q2 as #1 is strong* if bridging theory/phenomenology is your paramount goal. The choice between Q1 and Q2 at the top is close.
  *   **Decisive Results:** Defining "decisive" is hard in philosophy. Aim for formal results that *constrain the space of plausible arguments* (e.g., "No VoI-positive theorem can exist without assumption X") or *resolve key debates* (e.g., "BDU model Y uniquely explains empirical pattern Z, violating EU is necessary").

  ### Conclusion: The Path Forward
  1.  **Start with Foundations (Q1):** Investigate the robustness of Good's theorem. Can you weaken the sure-thing principle *just enough* to accommodate vague hypotheses/open futures while preserving non-negative VoI? If not, what does this imply for rational inquiry? (3-9 months).
  2.  **Pivot to Real Avoidance (Q2):** Use insights from Q1 to rigorously model predictive testing avoidance. Can you formalize "identity preservation" or "dread management" as BDU? Does commitment failure better fit the data/stakes? (9-15 months).
  3.  **Connect to Epistemology (Q3):** Synthesize Q1 & Q2. If rational agents (under weaker axioms) can sometimes avoid free info, or if BDU is rational, what does this imply for the *duty* to seek evidence? Does VoI theory primarily protect against coercion, not mandate inquiry? (6-12 months).
  4.  **Engage Counterexamples (Q4) as Needed:** Use this to inform critiques/defenses of models used in Q2/Q3. Avoid a deep dive unless a unifying insight emerges.
  5.  **Consider Social Aspects (Q5) Later/Tangentially:** Only if your models in Q2/Q3 inherently involve social signalling or strategic concerns.

  This path leverages your strengths, addresses the core fragility of VoI theory upstream, connects deeply to the human experience of information avoidance, tackles neglected epistemological questions, and offers multiple avenues for decisive formal contributions. Good luck.
