answer: |-
  Your suspicions are astute, and the popular summaries you've encountered significantly oversimplify, conflate, and sometimes misrepresent Williams's arguments. Here's an audit of the characterization against Williams's core positions:

  1.  **"Williams's central complaint... is that it is too demanding."**
      *   **Partially True, but Misleading:** Williams *does* think utilitarianism is demanding, but **demandingness is not his central or most original complaint.** His deeper critique targets utilitarianism's **conception of agency, reasons, and personal identity.** Utilitarianism forces agents to adopt an impersonal, external standpoint for *all* moral deliberation, displacing the agent's own perspective, commitments, and "ground projects" – the constitutive elements of their identity and sense of self. This **disruption of integrity** is the core issue; demandingness is a *symptom* of this deeper problem. Calling it merely "demanding" misses the existential threat to the self.

  2.  **"...asks us to treat our own projects... as no more weighty..." & "...subordinates his deepest commitments..."**
      *   **True:** This captures the essence of the **integrity objection.** Utilitarianism requires agents to treat their deeply personal commitments (ground projects, relationships) as having *no intrinsic weight* simply because they are *theirs*. Their value is *only* instrumental to overall welfare. Williams argues this alienates the agent from their own life and motives, making their actions fundamentally disconnected from who they *are*. Acting on impersonal utility calculations, even when it aligns with a personal project, negates the *personal* reason for acting. You are right to suspect demandingness and integrity are distinct – demandingness focuses on the *cost* (sacrificing projects), integrity focuses on the *source of reasons* and *constitutive role of projects for identity*.

  3.  **The Rescue Case & "One Thought Too Many"**
      *   **The Popular Framing is Mostly Wrong:** The drowning wife example (originally about saving one's *child*, sometimes mutated to wife) is frequently **misused and misrepresented** in popularizations.
          *   **What Williams DIDN'T Say:** He did *not* claim the husband should save his wife with "only the thought that she is his wife" and *no* moral thought. He didn't argue that love precludes moral considerations entirely.
          *   **What Williams DID Say (The Actual Point):** His target is the **structure of justification utilitarianism imposes.** If the husband saves his wife *because* utilitarianism permits it (e.g., recognizing his distress at saving a stranger might lower overall utility, or that society functions better if spouses save each other), this **corrupts the character of the act and the relationship.** The *right* reason is simply "because she's my wife" – a personal reason arising from the relationship itself. The utilitarian justification is **"one thought too many"** because it replaces or fundamentally alters the *genuine, motivating personal reason* with an impersonal calculation. The objection is to the *content and role* of the utilitarian thought, not necessarily the presence of *any* moral reflection. It highlights utilitarianism's inability to recognize the *sui generis* nature of personal reasons within a life.

  4.  **"Williams has refuted utilitarianism and, by extension, any impartial moral theory..."**
      *   **Overstated & Incorrect:** Williams absolutely believed his arguments posed a **serious, perhaps fatal, challenge to utilitarianism's adequacy as a complete moral theory** because it fails to account for the necessary perspective of the agent and the constitutive role of personal commitments. **However:**
          *   **Not a Formal Refutation:** He presented powerful internal critiques illustrating profound tensions within the theory and its implications for lived experience, not a logical contradiction.
          *   **Not Necessarily Against All Impartiality:** Williams targeted *specifically* the *strong, maximizing, consequentialist impartiality* of utilitarianism, which requires the agent to adopt the impartial standpoint as their *sole* deliberative perspective. He was often sympathetic to **Kantianism** precisely because it offers a different *kind* of impartiality that potentially *accommodates* personal commitments (e.g., through duties of special relations) without reducing them to impersonal calculations. His critique is far more devastating against consequentialist impartiality than against deontological impartiality. Popular summaries often miss this crucial distinction.

  **Corrected Summary:**

  Williams's core objection to utilitarianism is that its demand for **strict agent-neutrality** forces the agent to abandon their fundamental perspective. This **undermines integrity** because it requires them to treat their **ground projects** (constitutive of their identity) as having no intrinsic value, merely instrumental value for the general welfare. This alienates them from their own life and motives. While this results in excessive demandingness, that demand stems from this deeper attack on agency and identity.

  The "one thought too many" example illustrates how utilitarianism **corrupts personal reasons** by insisting they be validated through an impersonal calculus, rather than recognizing them as *sui generis* sources of justification within a life. It objects to the *content* (impersonal justification) and *role* (replacing the personal motive) of the "extra thought," not necessarily all moral reflection.

  Williams argued this shows utilitarianism is **profoundly inadequate** as a complete moral theory, failing to capture essential features of human life and value. However, this is a critique aimed primarily at **consequentialist impartiality** (especially utilitarianism), not necessarily all forms of impartial morality (like Kantianism), which might leave space for the intrinsic value of personal commitments.

  **Conclusion & Your Instincts:**

  *   **You were right:** Integrity and demandingness are distinct (though related) concepts. Integrity is the deeper, more original critique.
  *   **You were right:** The "one thought too many" point is about the *specific content and justificatory role* of the utilitarian thought corrupting the personal reason, not about the absence of *any* moral thought. It targets the utilitarian *framework*.
  *   **You were right:** The strong conclusion ("refuted all impartial morality") does **not** survive. Williams dealt a powerful blow to utilitarianism and similar consequentialist impartial theories by exposing their deep tension with personal integrity and agency. However, it remains a **challenge** for impartial theories to accommodate personal commitments meaningfully, not a definitive refutation of impartiality *itself*. Kantian and other non-consequentialist impartial theories offer different structures that attempt to address this challenge. The popular rhetoric vastly overstates the scope and conclusiveness of Williams's arguments.

  Williams's critique remains a powerful and influential challenge to utilitarianism, exposing a profound tension between its demands and the structure of a meaningful human life. However, the popular summaries you encountered significantly distort its nuances, scope, and implications. Your critical instincts were excellent.
