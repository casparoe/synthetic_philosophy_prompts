  First, I need to recall Williams's actual arguments. The integrity objection isn't just about demandingness; it's about how utilitarianism forces agents to abandon their personal projects, which are central to their identity. The "one thought too many" example is often misrepresented. Williams wasn't saying that saving your spouse without moral deliberation is correct; he was critiquing utilitarianism's requirement to justify personal actions through impartial calculations. 

  The user is worried that popular summaries conflate demandingness with integrity. They’re right—these are distinct. Demandingness is about the excessive sacrifice required, while integrity is about identity and agency. The user’s instinct here is spot-on, so I should clarify that distinction.

  Next, the "one thought too many" point. Popular sources might imply any moral thought is problematic, but Williams's real target is the utilitarian framework that reduces personal reasons to impartial ones. The husband saving his wife should do so because of the personal relationship, not because utilitarianism permits it. The corruption is in the justification, not the presence of any moral thought. The user’s question about the content vs. presence of the thought is crucial here.

  Regarding the conclusion, Williams didn't aim to refute all impartial morality but to show utilitarianism's incompatibility with personal integrity. Other impartial theories might accommodate personal commitments better. The user is skeptical about the strong claims in summaries, and rightly so—Williams's argument is a critique, not a wholesale rejection.

