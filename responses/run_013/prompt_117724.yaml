  2. **The "tricky wrinkle" requirement**. Maybe defenders also disperse? Or freeloaders secretly aid reproduction? Ah—yes! Defenders could be the *only* dispersers. That torches simple models and forces characters to rethink causality.  
  3. **End on unresolved tension**. No kumbaya moment. Instead: a concrete experimental disagreement (e.g., manipulating relatedness vs. group trait heritability).  

  Structure idea:  
