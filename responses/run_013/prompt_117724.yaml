  Atmosphere notes:  
  - Setting: Fictional "Cape Wrath Marine Station" — Scottish coast, perpetual drizzle, everything smells like iodine.  
  - Props: Salt-crusted microscopes, a necrotic colony in a tray, coffee gone cold in a chipped mug.  
  - Action: B spills seawater on A’s notebook; Thorne scribbles equations on fogged glass.  

  Final beat: The unresolved experiment—manipulate relatedness in founders. If group selection is causal, defender frequency should track group fitness regardless of relatedness. Gene view says no—it’s all rB>C. But with defenders as dispersers? Chaos. Perfect.
answer: |-
  ## The Calculus of Stingers

  The rain on Cape Wrath wasn't falling; it was *occupying*. It seeped into the rubber of Dr. Anya Petrova's boots, condensed on the chilled steel of the microscope stage, and blurred the neat columns of numbers in her field notebook. Across the cramped lab, perched precariously on a stool salvaged from a trawler, Dr. Leo Vance stabbed a finger at his own screen, displaying a graph that looked like a seismograph during an earthquake.

  "Look at Colony 47, Anya! Gobbled. *Gone*. Predator strike yesterday afternoon – probably a hungry *Pleurobranchus*. Nothing left but a smear of mucus and a few undigested sclerites." Leo’s voice vibrated with the intensity he usually reserved for arguing about coffee brewing techniques. "Survivorship probability? Zero point zero. And guess what? Defender fraction was barely 5%. The freeloaders were practically throwing a party until the predator crashed it."

  Anya didn't look up from counting the tiny, translucent polyps squirming in her petri dish – *Obelia vexans*, their subject. Colonial hydrozoans. Beautiful, intricate, doomed to constant evolutionary squabbles. "Correlation, Leo. Not causation. Colony 47 also had poor water filtration efficiency and weak holdfast attachment. Maybe it was just a *bad colony*. Weak genes overall. The low defender count might just have been… riding along." She carefully transferred a polyp with fine forceps. "Selection *of* the weak colony, not necessarily selection *for* the defender trait at the group level."

  Leo snorted, a sound like a disgruntled seal. "Oh, come *on*. We’ve tracked twelve predation events this month. Ten colonies with defender fractions below 8% got wiped. The two that survived attacks? 15% and 18% defenders. The pattern holds. Colonies with more stingers survive predation better. That’s heritable variation – founding sibling groups have similar defender biases – affecting group survival. Classic group selection. The colony *is* the unit."

  Anya finally looked up, her dark eyes sharp. "And within *any* surviving colony, Leo, who leaves more offspring? The defenders who sacrifice everything to sting and die? Or the freeloaders who just eat, multiply, and contribute gametes to the next founding swarm? Hmm?" She tapped the dish. "In *this* healthy colony, defenders comprise 12%. Their lifetime reproductive output? Zero. The freeloaders? Pumping out gametes daily. Within the group, selection ruthlessly favors the selfish. So why hasn’t the defender trait been completely wiped out? Why isn’t every colony 100% freeloader and thus supremely vulnerable?"

  "Kin selection!" Leo shot back, leaning forward. "Price equation! Hamilton’s rule! The founders are siblings! *r* is high! A defender dies stinging a predator, but it saves its *relatives* – copies of its own genes sitting in the freeloaders next door! The gene for altruism persists because it helps copies of *itself* in close kin. It’s gene-level selection all the way down. The ‘colony fitness’ is just the sum of the gene survival rates. A useful fiction for bookkeeping, but the *real* engine is the gene replicating via relatives."

  The lab door banged open, admitting a gust of wet wind and Dr. Aris Thorne. The visiting philosopher of biology resembled a damp, thoughtful badger, his tweed jacket steaming slightly in the lab’s warmth. He held two dripping mugs of tea. "Ah, the dulcet tones of ontological disagreement. Tea? I brought peace offerings. Or at least, caffeinated solvents for frustration."

  Anya took a mug gratefully. Leo just grunted, still glaring at his graph.

  Thorne surveyed the scene: the microscope, the petri dishes, Leo’s seismograph-graph, Anya’s meticulous notes. "Still wrestling the levels demon, I see. Gene versus colony." He sipped his tea. "Remind me, Leo, your partition of the covariance? Using Price?"

  Leo nodded, pulling up a spreadsheet. "Total change in defender frequency across the metapopulation. I decompose it: the change due to average fitness differences *between* groups – colonies with more defenders survive better, so they contribute more founders to the next generation, pulling the overall defender frequency up. Then there’s the change due to average fitness differences *within* groups – within every colony, freeloaders out-reproduce defenders, pulling the frequency down."

  "And?" Thorne prompted.

  "And the between-group component is positive and significant," Leo said triumphantly. "Stronger than the negative within-group component. Net result: defender frequency stays stable or even increases slightly. Ergo, group selection is real and operational."

  Anya shook her head, water dripping from a stray strand of hair. "But Aris, that’s *accounting*. Partitioning the variance doesn’t prove the colony is a *causal* unit any more than partitioning my salary into tax brackets proves the government is a fundamental economic entity. It’s just a way of summing up the gene-level effects. The *why* is still the relatedness. Break the relatedness – mix founders from different colonies, scramble the genes – and watch your positive between-group covariance vanish. The altruism collapses. That proves it’s fundamentally about *rB > C* at the gene level, not some mystical group good."

  Thorne’s eyes gleamed. "Ah, the intertranslatability! You both agree on the numbers, the net outcome. Leo’s partition and Anya’s inclusive fitness calculation are formally equivalent. They describe the *same* evolutionary change. The question isn't 'which one is true?' They're both mathematically valid descriptions. The sharper question is: which level of description captures the *causal structure* most directly? Which one helps us predict what happens if we perturb the system?"

  Leo frowned. "But the group trait *is* causal! Manipulate defender fraction directly – say, by surgically adding or removing defenders – and you directly impact colony survival. That’s causal efficacy at the group level!"

  "True," Anya countered, "but *why* does the defender trait exist in the first place? Because of the genetic self-interest enabled by high relatedness. The group-level effect is *derivative*. It emerges from the gene-level rules playing out in a structured population. If you break the structure, the group effect disappears. The gene-level rule doesn’t."

  Thorne held up a hand. "Let’s press this causal angle. You both agree high relatedness is essential for the persistence of altruism here. But *is* the defender fraction truly a heritable *group* trait? Or is it simply the additive effect of individual genes coding for altruism, whose expression just *happens* to correlate within groups because of shared kinship? If it’s the latter, Anya wins the causal argument. If there’s emergent heritability at the group level – colony-level properties that influence defender fraction beyond just summing individual genotypes – then Leo has a stronger case."

  Anya opened her mouth, then closed it. Leo looked thoughtful. The relentless drumming of rain on the tin roof filled the silence.

  "The founding," Anya said slowly. "We assume founding swarms are pure sibling groups. But are they? Absolutely? No mixing? Even a little outbreeding could significantly reduce *r*."

  Leo gestured towards the choppy grey sea visible through the rain-streaked window. "The dispersal stage is the medusa – the free-swimming jellyfish form. They bud off gametes. Fertilization happens in the water column. Larvae settle. We’ve genotyped founders; relatedness within a new colony *is* high, usually above 0.4. Assortment is strong."

  "But is it perfect?" Anya pressed. "And is it the *only* factor?"

  Thorne smiled faintly. "A good scientist always suspects imperfection. And complexity."

  The next day brought a break in the rain, though the sky remained the colour of wet granite. They were on the small research boat, *The Nettle*, anchored over a known *Obelia* reef. Anya was diving, collecting samples from marked colonies. Leo, leaning over the side, lowered a plankton net. Thorne observed, looking slightly green.

  Anya surfaced, handing up a specimen container holding a ragged piece of colony. "Colony 22. Took a hit last week but survived. Medium defender fraction – 10%. We marked it for dispersal tracking."

  Leo processed the sample back in the cramped cabin. He examined the mature gonozooids – the reproductive polyps. "Gametes look ready for release soon." He meticulously sampled tissue for genotyping. Suddenly, he froze, peering intensely through the microscope. "Anya... look at this."

  Anya, toweling her hair, peered in. The slide showed stained cells from a gonozooid. Among the developing gametes were unmistakable, dense capsules – nematocysts. Stinging cells.

  "Freeloader polyp?" Anya asked, confused. Gonozooids were typically freeloaders.

  "No," Leo breathed, his voice tight. "Look at the polyp morphology. This... this is a *defender*. Or was. But it’s developing gonozooid structures. And it’s packed with nematocysts."

  Anya grabbed another slide, prepared from a different part of the colony. Another defender polyp, but this one showed early signs of medusa budding – the formation of the tiny jellyfish that would eventually break free to disperse.

  A cold dread, deeper than the North Sea water, washed over Anya. "Leo... are the defenders... are they *also* the dispersers?"

  They worked in frantic silence back at the lab, cross-referencing old data, staining new samples. The pattern, once they looked for it, was undeniable. Defenders weren't sterile drones. As the colony aged, a significant subset of defender polyps underwent a transformation. They reabsorbed some of their aggressive structures and began developing gonadal tissue or even direct buds for the medusoid dispersal stage. They weren't just sacrificing *for* the colony; they were potentially the primary conduit *out* of it.

  Thorne watched the realization dawn on their faces. "Ah. The wrinkle. So much for the clean dichotomy."

  Leo looked stricken. "This changes everything. If the defenders are also the dispersers... then their 'sacrifice' isn't absolute. They *can* reproduce, just... later. Indirectly. Through dispersal. And they disperse *together* – sibling medusae budding from the same transformed defenders likely settle near each other, maintaining high *r*."

  Anya paced, her mind racing. "But it scrambles the levels! Within the colony *now*, the freeloaders still reproduce *more* – they start earlier, invest less in defense. Selection within the group still favors pure freeloaders. But a defender that transforms... it might have lower *immediate* fitness than a freeloader, but it gets a chance at dispersal… and it protects its future kin group." She stopped, facing Leo. "Is the group selection you see actually selection for colonies that produce more *dispersers*? And the defender trait is intrinsically linked to that dispersal potential? Your 'group fitness' might be selection *for* a dispersal trait that happens to require defense!"

  Leo countered, "But the defense is still crucial *for the colony* to survive long enough to produce those dispersers! The colony-level property – defender fraction – still directly impacts whether it gets eaten before reproducing. The group *is* a unit experiencing selection! The dispersal twist just changes the *mechanism* of gene propagation."

  Thorne interjected softly. "And crucially, it might break the clean equivalence. If the defender-to-disperser transformation is itself a heritable trait *at the colony level* – perhaps controlled by colony-wide signals, or emergent from founder genotype interactions – then the group-level description might capture a causal chain that the purely additive gene-level view misses. The trait 'high defender fraction' might be linked to 'high dispersal capability' in a way that isn't simply the sum of individual genes for defense plus individual genes for dispersal."

  Anya nodded grimly. "Yes. And conversely, if the transformation is purely a plastic response of individual polyps based on their own genotype and local conditions, then the gene-level view still holds the causal reins."

  They stared at each other, the initial clarity of their positions muddied by the seawater and the newly discovered complexity. The neat partition of within-group and between-group selection, the clean calculus of *rB > C*, now seemed like a child’s sketch over a roiling sea of interacting causes.

  "So how do we test it?" Leo asked, the frustration replaced by a sharp, investigative focus. "The causal granularity?"

  Anya leaned on the lab bench, looking out at the turbulent sea. "We need to manipulate the *linkage*. We need colonies where the defender trait and the dispersal trait are experimentally decoupled."

  Thorne raised an eyebrow. "How?"

  "Two experiments," Anya said, thinking aloud. "First, we artificially select colonies purely for high defender fraction, regardless of dispersal success. If Leo’s causal group view is strong, we should see colonies that are super-defended but perhaps poor at dispersal, and their 'fitness' should still be high because they survive. But under Anya’s gene view," Leo continued, catching her drift, "if high defense isn’t linked to successful dispersal in the offspring, the genes should eventually crash because the defenders, even transformed, won’t leave many copies. Second experiment: we manipulate relatedness *within* colonies, creating groups with mixed founders. If the dispersal/defense complex requires high *r* to evolve, it should collapse. But if there's emergent colony-level heritability for the *linked trait complex*, it might persist even with lower average relatedness."

  Thorne smiled, a genuine, appreciative curve of his lips. "Now *that* is a concrete disagreement with predictive teeth. Gene-level causation predicts collapse in both scenarios if the *rB>C* calculus is broken. Strong group-level causation predicts the colony trait could persist if it has its own heritability and causal efficacy, independent of perfect relatedness."

  The rain began again, a sudden crescendo against the window. Colony fragments pulsed gently in their tanks. Defenders extended their stinging cells; freeloaders pulsed, preparing gametes. Some defenders bore the subtle, telltale swellings of transformation.

  Leo picked up a petri dish holding a fragment of Colony 22. "So, which is it? Are we studying genes riding the wave of kinship, or colonies evolving as Darwinian individuals?"

  Anya touched the cool glass. "The sea doesn't care about our categories, Leo. But our experiments might show which description... *cuts nature closer to the joints*."

  The argument wasn't resolved. It was merely reframed, deepened, and cast adrift on a new tide of empirical uncertainty. The units of selection weren't just fighting in theory; they were entwined in the messy, stinging, reproducing reality of *Obelia vexans*, waiting for the next dive, the next perturbation, the next storm. The true unit, for now, was the question itself, sharp and unresolved as a defender’s nematocyst.
