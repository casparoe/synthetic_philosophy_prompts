  The user's skepticism about the paradox of phenomenal judgment being a "refutation" is astute. That objection is indeed more nuanced than the summary presents. Epiphenomenalists can counter by arguing brain states cause both experiences *and* reliable reports about them, making knowledge possible without direct causation. 

  Hmm, the user also questions if experiences cause *anything*—good catch! The summary vaguely says "nothing," but technically epiphenomenalism only denies physical effects. Mental-to-mental causation (e.g., one thought causing another) is trickier; some versions allow it. 

  Their dualism confusion is valid too. While classical epiphenomenalism is dualist, non-reductive physicalists could adopt a similar stance by viewing consciousness as an emergent property with no downward causation. 

