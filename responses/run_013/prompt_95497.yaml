  ### **Decision Tree: What’s Your Stance on Unrealistic Assumptions in Models?**
  *Start at Q1 and follow your instincts. Answer Yes (Y) or No (N). Each path ends in a position or an empty combination.*

  1. **Q1: Is the model trying to tell us something about the real world?**  
     - **Y** → Go to Q2.  
     - **N** → Go to Q7.  

  2. **Q2: If the model "works" (e.g., predicts or explains well), must there be a reason why it works that involves how the world actually is?**  
     *(This separates those who demand an explanation for success from those who don’t.)*  
     - **Y** → Go to Q3.  
     - **N** → Go to Q4.  

  3. **Q3: For the model to be acceptable, must its assumptions be approximately true of the real world?**  
     - **Y** → **Realist** (Leaf 1).  
     - **N** → Go to Q5.  

  4. **Q4: Is the model’s main job to make accurate predictions?**  
     - **Y** → **Instrumentalist** (Leaf 2).  
     - **N** → Go to Q6.  

  5. **Q5: Can you describe how the model would change if you relaxed one unrealistic assumption (e.g., by adding complexity or real-world messiness)?**  
     *(This is the recoverability branch: "spherical cow as Tuesday" requires a clear path to improvement.)*  
     - **Y** → **Stepwise refinement** (Leaf 3).  
     - **N** → **Empty Combination A** (not a position; see below).  

  6. **Q6: Does the model deliberately omit real-world factors to isolate a core mechanism?**  
     - **Y** → **Isolationist** (Leaf 4).  
     - **N** → Go to Q8.  

  7. **Q7: Does the model describe a self-contained, imaginary system?**  
     - **Y** → **Fictionalist** (Leaf 5).  
     - **N** → **Non-representational** (Leaf 6).  

  8. **Q8: Is the model a "machine" you assemble to produce a phenomenon, where assumptions are parts to tinker with?**  
     - **Y** → **Constructivist** (Leaf 7).  
     - **N** → **Empty Combination B** (not a position; see below).  

  ---

  ### **The Leaves (Positions)**
  Each named position includes:  
  - **Core idea**: A shorthand for your stance.  
  - **Awkward commitment**: The toughest philosophical trade-off (one sentence).  

  1. **Realist**  
     - Core idea: Assumptions must be true (or nearly true) for the model to be valid; false assumptions are fatal flaws.  
     - Awkward commitment: You must reject models that work well in practice if their assumptions are unrealistic, even when no better alternative exists.  

  2. **Instrumentalist**  
     - Core idea: False assumptions are fine because the model is only a prediction machine; only outputs matter.  
     - Awkward commitment: You must accept that the model might succeed for arbitrary or wrong reasons, making it feel like a "lucky guess" with no deeper truth.  

  3. **Stepwise refinement**  
     - Core idea: Assumptions are false but are a first pass; you get nearer truth by relaxing them one at a time.  
     - Awkward commitment: You have to assume the world is decomposable into simple parts, even when complexity might be irreducible or chaotic.  

  4. **Isolationist**  
     - Core idea: Assumptions are false because the model deliberately omits distractions, and that omission is the whole point.  
     - Awkward commitment: You must defend that your isolated mechanism exists in reality, even though you stripped away the messiness that might obscure or alter it.  

  5. **Fictionalist**  
     - Core idea: Assumptions must be true of something—the imaginary system the model describes—so we learn about that system, not directly about the world.  
     - Awkward commitment: You must explain how studying a made-up system teaches us about reality, which can feel like arguing by metaphor or luck.  

  6. **Non-representational**  
     - Core idea: The model isn’t making claims about the world at all (e.g., it’s a tool for thought), so truth/falsity never comes up.  
     - Awkward commitment: You must admit the model, however useful, might not relate to reality, making it feel like a self-contained game.  

  7. **Constructivist**  
     - Core idea: The model is a machine you assemble so the phenomenon happens, and assumptions are just parts of that machine.  
     - Awkward commitment: You are stuck claiming your machine is the "right" one, even though many machines could produce the same outcome.  

  ---

  ### **Empty Combinations**
  These answer combinations don’t correspond to coherent positions. They are dead ends:  
  - **Empty Combination A (Q1=Y, Q2=Y, Q3=N, Q5=N)**: "I demand an explanation for the model’s success and don’t require assumptions to be true, but I can’t say how to fix false assumptions."  
     - **Why empty?** Unattractive—it leaves you perpetually dissatisfied with no path forward (e.g., "This model is wrong, but I have no idea how to improve it").  
  - **Empty Combination B (Q1=Y, Q2=N, Q4=N, Q6=N, Q8=N)**: "The model is about the real world, its success doesn’t need an explanation, and it’s not predictive, isolating, or constructivist."  
     - **Why empty?** Incoherent—there’s no clear account of what the model *does* if it fits none of these purposes (e.g., "It’s... just there?").  

