  - **Distinctness**: All leaves are unique (e.g., instrumentalist vs. stepwise vs. constructivist). Fictionalist and non-representational both answer Q1 as "N" but split on Q7.  
  - **Balance**: No branch "stacks" toward an answer (e.g., realism and instrumentalist are both early leaves). Friedman’s "as-if" is implicitly covered but not named.  
