prompt: |-
  I write about science and ideas for a living, which means I sit through a lot of talks where somebody says that one kind of thing is really just another kind of thing. Minds are really just what brains do. A species is really just a population of interbreeding organisms. A queue is really just a bunch of people standing in an order. Money is really just a promise with a printing press attached. I nod along, and then the same little snag shows up, and in fifteen years I have never gotten a straight answer about what its called.

  Here is the snag. Ask which of the lower-level things you are actually pointing at, and the answer always seems to mention the higher-level thing you were supposed to be getting rid of. Sure, a belief is a brain state, but which one? The one that means its going to rain, which is to say the one that plays the role of the belief. Sure, the statue is just the lump of bronze, but which lump? The one shaped like the general, which is to say the one that already counts as the statue. The person doing the reducing then says, fine, it is the arrangement that matters, and the arrangement turns out to be describable only in the vocabulary we were supposedly reducing away.

  So is there a name for that? I know about grounding and supervenience and multiple realisation, and I know the hermeneutic circle is a thing in some other tradition, but none of them seems to be quite this. What I am after is the specific situation where the allegedly more basic facts can only be picked out by their relation to the less basic ones, so that the claim that A is nothing over and above B comes out true but cannot be stated without help from A. And honestly I care about the edges more than the label. Why does the same trick not sink water and H2O? Is the snag a fact about our vocabulary or a fact about the world? And is it the same snag running in the other direction, when the whole looks like what makes its parts the parts they are, rather than the parts making the whole?
reasoning: |-
  Okay, let me start by unpacking the user's query. They're a science and ideas writer who frequently encounters reductionist arguments where higher-level concepts are claimed to be "nothing but" lower-level components. The snag they've noticed is that when you ask for the specific lower-level thing, the explanation always circles back to the higher-level concept. For example, identifying which brain state corresponds to a belief requires mentioning the belief itself—like "the state that means it's going to rain." 

  First, I need to recall philosophical concepts related to this. The user mentions knowing about grounding, supervenience, multiple realizability. But they feel those don't quite fit. They want the specific situation where the reduction depends on the higher-level terms to identify the lower-level instances. 

  The core issue seems to be the necessity of higher-level descriptions to pick out the relevant lower-level facts. This sounds like what John Haugeland called "constitutive standards." He argued that some entities are defined by norms within practices, so identifying them requires those norms. For instance, a chess piece is wood only if it meets the game's rules. That fits the user's examples: the bronze lump is a statue because it's shaped like a general, which references the statue itself.

  Then there's the term "teleofunctional role," from philosophy of mind. Mental states are identified by their function—beliefs are what cause certain behaviors. Again, defining the brain state requires the belief's purpose. 

  The user also asks why this doesn't happen with water and H₂O. Here, the difference is that water is type-identical to H₂O. Any H₂O molecule is water, regardless of context. But beliefs or statues are token-identical; each instance depends on its role in a system. That's why reduction works for natural kinds but not functional or role-defined entities.

  The user might also be hinting at the philosophical debate between reductionism and non-reductionism. They want to know if the snag is linguistic or ontological. The answer involves both: our descriptions rely on context, but the entities themselves might be ontologically dependent on higher-level structures. 

  The bidirectional aspect they mention—parts defining wholes vs. wholes defining parts—ties into mereology. In systems with constitutive rules, the whole determines what counts as a part. A handle is only a handle because of the door's function. This contrasts with aggregates like water, where parts exist independently.

  Underlying all this is the user's need for precise terminology to articulate this recurring issue in their work. They likely seek clarity to critique reductionist arguments effectively. The deeper need might be understanding whether reality is layered in a way that resists reduction or if it's a limitation of human cognition and language. Providing terms like "token identity," "constitutive standards," and "teleofunctional properties" gives them tools to frame these discussions, while explaining why some reductions succeed (water) and others don't (beliefs) addresses their examples concretely.
answer: |-
  That "snag" you're describing is **brilliantly** identified, and it cuts to the heart of why reductionism, while often powerful and illuminating, frequently feels incomplete or circular for certain kinds of things. You're absolutely right that the standard philosophical tools (grounding, supervenience, multiple realizability) don't quite capture this specific flavor of circular dependence in *identification*.

  **The Name(s) You're Looking For:**

  There isn't one universally agreed-upon term, but several closely related concepts capture different facets of this phenomenon:

  1.  **Token Identity vs. Type Identity (and the Problem of Individuation):** This is a core distinction.
      *   **Type Identity:** "Water *is* H2O." Every instance (type) of water is identical to H2O. The properties pick out the same stuff universally. This works for water.
      *   **Token Identity:** "This *particular* belief *is* this *particular* brain state." The identity holds for this specific instance (token), but you cannot pick out *which* brain state is the belief *without* referencing the belief role itself. The problem is *individuating* the relevant lower-level state. The "snag" occurs when token identity claims rely on higher-level properties for the *individuation* of the token.

  2.  **Constitutive Standards / Normativity (John Haugeland):** This is perhaps the *best* fit for the core of your "snag." Haugeland argued that many entities (like beliefs, money, statues, queues) are constituted not just by their physical makeup, but by the *standards* of a practice or "game" (e.g., language, social conventions, art).
      *   To identify the physical stuff *as* the higher-level thing, you *must* apply the constitutive standards of the practice. You identify the bronze lump *as* the statue *only* by applying the standards of sculpture/representation ("shaped like the general"). You identify the brain state *as* the belief *only* by applying the standards of intentionality/meaning ("means it's going to rain"). **The reduction *depends* on the very standards it was supposed to eliminate or reduce away.** This is why the vocabulary of the "higher level" is indispensable for picking out the relevant "lower level" configuration.

  3.  **Teleofunctional Properties / Role-Functional Identification:** Especially relevant for minds, tools, social constructs. A belief *is* the state that *plays the belief role* - it carries certain information, causes certain behaviors in conjunction with desires, etc. To identify *which* physical state it is, you *must* identify it *by its function* within the larger cognitive system. The functional role is defined at the higher level. You can't reduce the identification away.

  4.  **Contextual Emergence (vs. Ontological Reduction):** This emphasizes that the *significance* and *identity* of the lower-level parts emerge *only* within the specific context of the higher-level whole. The lump *is* the statue *in this context*, defined by the sculptor's intention and viewer's interpretation. The brain state *is* the belief *in the context* of the organism's cognitive architecture and environment. Outside that context, it's just a lump or a neural firing pattern.

  **Addressing Your Specific Questions:**

  1.  **Why doesn't this sink water/H2O?**
      *   **Type Identity:** Water is a *natural kind*. Its essence is its chemical composition (H2O). Any H2O molecule *is* water, regardless of context. Identifying water *just is* identifying H2O. No higher-level constitutive standard (beyond basic chemistry) is needed for the identification.
      *   **Lack of Functional Role/Constitutive Standard:** Water doesn't have a "function" or "role" that defines it *as* water in a context-dependent way in the same manner as a belief or a statue. Its identity is intrinsic (H2O), not relational/functional/constitutive.

  2.  **Is the snag about vocabulary or the world?**
      *   **It's (Probably) Both, Deeply Entwined:** It reflects an ontological reality – that certain entities *are* constituted by their relations, functions, and roles within larger systems (practices, organisms, societies). This ontological structure *necessitates* a specific kind of vocabulary for identification – one that captures those relations, functions, and roles. Our vocabulary isn't *arbitrarily* failing; it's struggling to capture something real about how these entities exist. You couldn't fully describe the universe *only* in the language of fundamental physics without losing the *existence* of beliefs, money, queues, and statues *as such entities*.

  3.  **Is it the same snag running in the other direction (whole defining parts)?**
      *   **Absolutely Yes!** This is the flip side of constitutive standards and contextual emergence. Consider:
          *   A **handle**: It's a bit of wood/metal shaped in a certain way. But *why* is *this* shape "handle-shaped"? Only because it fits a human hand *for the purpose of operating a door*. The "handle" *as a part* is defined by its function *within the whole* door mechanism and the human practice of opening doors.
          *   A **heart**: It's a lump of muscle tissue. But it's a heart *only* because it pumps blood *within a circulatory system* sustaining an organism. The part (the heart) is defined by its function in the whole (the organism).
          *   **Money**: A piece of paper is just paper. It's money *only* because it is recognized and used *within a specific economic system* as a medium of exchange. The system (the whole) defines the function that makes the paper (the part) money.
      *   Here, identifying the *part* (*as* a handle/heart/money) inherently requires reference to the *role* it plays within the *whole* system or practice. This is the same dependence: the allegedly "basic" part can only be picked out *as that specific part* by its relation to the "less basic" whole.

  **In essence:** The "snag" arises for entities whose identity is **constituted by their role, function, or place within a system, practice, or set of norms** (minds, artifacts, social kinds, biological functions). Their reduction *always* requires invoking those very roles/functions/norms to identify *which* lower-level configuration constitutes them *in this instance*. This makes the reduction explanatorily useful but ontologically non-eliminative – the higher-level concepts aren't *replaced*; they are shown to be the essential *organizing principles* that make the lower-level stuff count *as* the higher-level thing.

  The terms **Constitutive Standards (Haugeland)** and the **Token Identity / Individuation Problem** are likely the most precise labels for the core of your recurring "snag." It perfectly captures the circularity you observe: the identification of the "basic" B *as A* requires the vocabulary of A.
