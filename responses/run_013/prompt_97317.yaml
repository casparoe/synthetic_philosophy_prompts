  ### Joint Statement on Time and General Relativity: Adversarial Collaboration

  #### 1. Agreed Claims
  Both parties endorse the following substantive claims regarding the formalism of general relativity, the implications of rotating-universe solutions, simultaneity, the requirements for a philosophical account of passage, and non-decisive considerations. These claims are neutral with respect to the reality of time’s passage and cannot be inferred solely from the labels "Gödelian view" or "becoming realist view."

  1. **Rotating-Universe Solutions and Closed Timelike Curves (CTCs):**  
     The Gödel-type rotating, homogeneous, singularity-free cosmological solutions are valid exact solutions to the Einstein field equations. These models contain CTCs, which are worldlines that return to their starting event. Within these models, CTCs permit scenarios where an observer could, in principle, traverse a path back to an event in their own past. However, this does not inherently imply contradictions (e.g., "grandfather paradoxes") due to the self-consistency constraints of general relativity.

  2. **Theory’s Stance on Simultaneity:**  
     General relativity does not posit a frame-independent global present. The relativity of simultaneity—the dependence of simultaneity on an observer’s state of motion—is an irreducible feature of the theory. No unique foliation (slicing of spacetime into global sets of simultaneous events) is privileged by the equations alone, regardless of the presence or absence of CTCs.

  3. **Requirements for a Philosophical Account of Passage:**  
     Any defensible account of temporal passage must reconcile with the following:  
     - The phenomenological immediacy of time’s flow in conscious experience.  
     - The empirical adequacy of relativistic physics, including the absence of a preferred foliation in standard interpretations.  
     - The distinction between fundamental (ontological) and emergent (e.g., thermodynamic or psychological) temporal features.  
     Such an account must not presuppose a global present or trivialize the constraints imposed by relativity.

  4. **Non-Decisive Considerations:**  
     Neither party regards the following as decisive for the reality of passage:  
     - The relativity of simultaneity alone, as it does not directly address the ontological status of becoming.  
     - The mathematical consistency of CTC-bearing models, as their physical possibility does not entail their actuality or relevance to our universe.  
     - Arguments from quantum mechanics, thermodynamics, or consciousness studies, as these are orthogonal to the core relativistic implications at issue.

  #### 2. Housekeeping: Decomposition of "Reality of Time"
  The phrase "reality of time" is decomposed into three distinct theses. Each party’s position is stated below. Both agree that (i) and (iii) are not the primary locus of disagreement, but they were initially talking past each other on (ii), as the Gödelian view treated becoming as inherently global, while the becoming realist view allows for non-global conceptions.  

  | Thesis | Description | Gödelian View | Becoming Realist View |
  |--------|-------------|---------------|------------------------|
  | **(i) Frame-independent global present** | Existence of an objective, unique set of simultaneous events across all spacetime. | Denies | Denies |
  | **(ii) Reality of passage/becoming** | Existence of a "moving present" or ontological progression of time. | Denies | Affirms |
  | **(iii) Objectivity of temporal direction** | Non-conventional, intrinsic difference between earlier and later. | Affirms (locally/regionally, but not globally in CTC contexts) | Affirms |

  #### 3. Precise Remaining Disagreements
  The following table summarizes the core disagreements, with each party accepting the formulation of their own position. Key issues include whether becoming requires a privileged foliation and the nature of that requirement.

  | Disagreement | Gödelian View Position | Becoming Realist View Position |
  |--------------|------------------------|--------------------------------|
  | **Ontological status of becoming** | Objective becoming does not exist; the universe is a static four-dimensional block where past, present, and future are equally real and distinctions are perspectival. | Objective becoming is real; time dynamically progresses, and the present has a privileged ontological status not reducible to the block view. |
  | **Requirement of privileged foliation for becoming** | Objective becoming conceptually requires a privileged foliation (a preferred global slicing into simultaneous events) to define a unique moving present. Without it, becoming is incoherent. | Objective becoming does not require a privileged foliation; becoming can be grounded in local or relational features (e.g., along worldlines) without a global simultaneity structure. |
  | **Nature of the foliation requirement** | The requirement is conceptual: it arises from the definition of becoming as a global, objective progression. This is an a priori truth about the concept. | The requirement is empirical and contingent: while a foliation might facilitate becoming in some models, it is not necessary for coherence. This is defeasible by physical considerations. |
  | **Implication of CTC possibility for becoming** | The bare physical possibility of CTCs in models like Gödel’s undermines becoming by demonstrating a self-consistent universe where becoming is impossible, revealing becoming as non-fundamental. | The mere possibility of CTCs is irrelevant to becoming’s reality in our universe; becoming is a contingent feature of actual physics, not refuted by idealized models. |

  #### 4. Cruxes
  The following sub-questions are cruxes: resolving them would alter at least one party’s position. For each, a concrete consideration (case or argument) is provided, along with both parties' predictions. The fixed test case is a Gödel-type rotating universe containing an observer on a CTC who returns to an event indistinguishable from their departure point.

  **Test Case Analysis**  
  (a) *What is true within the Gödel universe?*  
  - Both parties agree on the following:  
    - The observer ages (experiences elapsed proper time) along the CTC.  
    - No objective fact distinguishes "earlier" or "later" visits to the event; temporal order is locally definable but globally circular.  
    - The observer cannot alter past events (e.g., "change what happened" at the event) due to consistency constraints; actions are fixed across the loop.  
  - Predictions:  
    - Gödelian view: The observer’s experience of "returning to the past" is illusory; all events coexist statically.  
    - Becoming realist view: The observer’s local experience of passage (e.g., aging) is veridical but globally inconsistent with becoming due to CTCs.  

  (b) *What does the possibility (not actuality) of such a universe show about our universe?*  
  - Gödelian view: The possibility demonstrates that becoming is not fundamental, as it is incompatible with a physically consistent model. Thus, becoming in our universe is emergent or illusory.  
  - Becoming realist view: Mere possibility is irrelevant; becoming’s reality depends on actual physics, so CTC models have no bearing on our universe.  
  - Weight of possibility argument:  
    - Gödelian view: Carries decisive weight (shows becoming is non-necessary).  
    - Becoming realist view: Carries no weight (mere possibilities don’t threaten actual contingencies).  

  **Cruxes Table**  

  | Crux | Concrete Consideration | Gödelian Prediction | Becoming Realist Prediction |
  |------|------------------------|---------------------|-----------------------------|
  | **Does becoming conceptually require a privileged foliation?** | Analyze a non-CTC relativistic universe (e.g., Minkowski spacetime) without a preferred foliation. Can becoming be coherently defined? | Without a foliation, becoming is indefinable; attempts (e.g., "local becoming") reduce to subjectivity or illusion. | Becoming can be objective without a foliation; it supervenes on causal relations or proper time along worldlines. |
  | **Does the possibility of a becoming-free universe imply becoming is non-fundamental?** | If a consistent model (e.g., Gödel universe) lacks becoming, does this entail that becoming is non-fundamental in all universes, including ours? | Yes: fundamental features must be necessary; possibility proves becoming is contingent and thus emergent. | No: fundamental properties can be contingent; our universe’s physics (e.g., time-orientability) grounds becoming independently. |
  | **Can local becoming persist in a CTC universe?** | In the Gödel universe test case, does the observer’s local experience of passage (e.g., aging) constitute real becoming, or is it globally undermined? | Local "becoming" is illusory; CTCs reveal it as a psychological artifact in a static whole. | Local becoming is real but globally inconsistent; CTCs disrupt global coherence but don’t invalidate local ontology. |

  #### 5. Verbal vs. Substantive Disagreements
  The sole verbal component concerns the **definition of "becoming."** The Gödelian view stipulatively defines becoming as requiring a global moving present (entailing a foliation), while the becoming realist view defines it more flexibly (e.g., as local or relational). This difference is terminological but not substantive, as both agree on the core issue: whether an objective, non-perspectival progression exists. The substantive disagreement persists over the ontological status of such progression, irrespective of terminology. All other aspects (e.g., implications of CTCs) are substantive.

