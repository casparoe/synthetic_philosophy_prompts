answer: |-
  **1.**  
  The coffee in Maya’s mug had gone cold. On her screen, the Institute’s flagship study glowed: *Neural Correlates of Telepathic Priming in Dyads*. The significance test, pre-registered and pristine, declared *p* = .049. Below it, mandated by Director Chen’s policy, sat the Bayesian posterior probability for the alternative hypothesis, calculated under the Institute’s default skeptical prior: 0.32. Maya traced the numbers with her finger. One whispered "success!"; the other, "likely noise." How could the same data, the same hypothesis, point both ways? The dissonance hummed in her temples.

  **2.**  
  Dr. Varma, elbows planted on the lab bench, frowned at Maya’s printout. "The *p*-value," she stated, tapping it, "is a measure of *surprise*. If telepathy is bunk – the null – how shocked should we be to see data *this* extreme? The answer is: quite shocked. It passes the agreed-upon threshold. We acted correctly." She waved off the posterior. "The prior? It’s baggage. Injecting subjective doubt *before* seeing the data? That’s bias dressed as math. We run controlled experiments to *escape* bias, not codify it."

  **3.**  
  Dr. Bell leaned back, his office walls lined with volumes on epistemic probability. "The *p*-value," he countered softly, "tells you a probability *assuming the null is true*. It doesn’t tell you the probability the null *is* true, given the data. That’s what the posterior *does*. Our skeptical prior? It quantifies the reasonable doubt accumulated from decades of failed replications in psi research. Ignoring that context is pretending science happens in a vacuum. The data *alone* aren’t strong enough to overcome that prior skepticism. Probability is always conditional."

  **4.**  
  Maya listened, the core conflict crystallizing. "But Dr. Varma," she ventured, "what about the stopping rule? The protocol let them add more dyads when early results were 'promising'." Varma shrugged. "Real-world constraints. We adjusted the analysis plan pre-registration. Significance testing handles that." Bell interjected sharply: "It *doesn't* handle it gracefully! Optional stopping inflates the false positive rate unless you account for it *in the probability model*. A Bayesian updating naturally incorporates the stopping rule – the prior updates sequentially. Your 'handling' is often just ignoring the fishing expedition."

  **5.**  
  Months later, the institute's glossy report featured both numbers prominently. The *p*-value made headlines; the posterior was buried in the supplement. Maya walked past the Director’s office, hearing Chen defend the dual-reporting policy as "transparent." Down the hall, a filing cabinet labelled "Replication Attempts (Ongoing)" yawned open, mostly skeletal. She thought of Varma’s procedural purity and Bell’s contextual caution, both drowned out by the siren song of *p*<.05. The replication crisis, she realized, wasn’t just about one philosophy failing. It was about a system that demanded simple signals from messy data, incentivizing whichever number – surprise or belief – could be spun into a headline, while the quiet discord between them hinted at deeper, unreconciled truths. The dread settled: which number, this time, would fail to replicate?
