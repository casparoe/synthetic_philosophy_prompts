  The "protection vs punishment" distinction is valid but not absolute - it depends on intent and effect. Even protective actions can feel punitive, so safeguards are needed regardless. The automatic expiration proposal is problematic as it oversimplifies the purpose of sanctions and could undermine their effectiveness.

