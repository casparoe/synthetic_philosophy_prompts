answer: |-
  **Q1: When you try to conceive of a tree in a park with no one and nothing around to perceive it, are you perceiving that tree in your mind at that moment?**  
  - A: Yes (the act of conception is a perception) → 2  
  - B: No (conceiving is not perceiving) → 3  

  **Q2: Does your inability to conceive of an unperceived object (because you perceive it in thought) show that it cannot exist?**  
  - A: Yes (inconceivability implies impossibility) → 4  
  - B: No (inconceivability does not imply impossibility) → 5  

  **Q3: Can a rock exist on a planet no mind will ever visit?**  
  - A: Yes → 6  
  - B: No → 7  

  **Q4: What happens to the furniture in a room while its only occupant sleeps (and does not dream of it)?**  
  - A: It exists because sustained by a permanent perceiver (e.g., God) → Berkeley’s idealism with God  
  - B: It ceases to exist until perceived again → Idealism without God  
  - C: Its existence reduces to what you would perceive if awake (e.g., "if you looked, you would see it") → Phenomenalism  

  **Q5: Can an object exist unperceived? (e.g., the tree in the park)**  
  - A: Yes → 8  
  - B: No → 9  

  **Q6: Can an object that is in principle undetectable by any mind exist?**  
  - A: Yes → 10  
  - B: No → 11  

  **Q7: Is there a fact of the matter about whether the universe existed before any mind?**  
  - A: Yes → Go to 4  
  - B: No → Non-factualism  

  **Q8: Do objects exist unperceived as they are in themselves?**  
  - A: Yes (mind-independent reality) → Direct realism  
  - B: No (they exist only as appearances) → Kantian idealism  

  **Q9: When a camera records a scene with no one watching the feed (and it is never viewed), does the scene exist?**  
  - A: Yes (the camera is irrelevant to existence) → Go to 6  
  - B: No (existence requires a mind) → Go to 4  

  **Q10: Are the objects in a dream real?**  
  - A: Yes (as mental entities) → Go to 8  
  - B: No (illusions) → Go to 8  

  **Q11: Does Berkeley’s argument rest on an equivocation between “conceiving” and “imagining”?**  
  - A: Yes (it confuses distinct mental acts) → Equivocation view  
  - B: No → Conceptual idealism  

  **Leaves:**  
  - **Berkeley’s idealism with God** (from 4A): Awkward commitment: Requires a permanent divine mind to perceive everything.  
  - **Idealism without God** (from 4B): Awkward commitment: Objects cease existing when unperceived, then reappear.  
  - **Phenomenalism** (from 4C): Awkward commitment: Reduces objects to conditional statements about sensations.  
  - **Direct realism** (from 8A, 10A, or 10B): Awkward commitment: Must reject the link between inconceivability and impossibility despite Berkeley’s challenge.  
  - **Kantian idealism** (from 8B): Awkward commitment: Unperceived objects exist only as unknowable “things-in-themselves.”  
  - **Non-factualism** (from 7B): Awkward commitment: Denies any truth about unperceived existence, even when it seems factual.  
  - **Equivocation view** (from 11A): Awkward commitment: Demands a sharp, often blurry, distinction between imagination and conception.  
  - **Conceptual idealism** (from 11B): Awkward commitment: Makes inconceivability only about human concepts, not reality.  
  - **Nonsense view** (from Q1B or Q3B if answering "no" with a claim of meaninglessness): Awkward commitment: Treats "unperceived object" as incoherent despite intuitive understanding.  

  **Unoccupied combinations and notes:**  
  - **Inseparable leaves:** The tree cannot distinguish the nonsense view from non-factualism using these questions alone. Both deny a substantive answer to the existence question (one via meaninglessness, the other via lack of fact), and concrete cases like the tree or rock trigger both views similarly.  
  - **Unoccupied combination 1:** Answering Q3A (rock exists), Q6A (undetectable objects exist), and Q8B (objects are mere appearances) is incoherent—it claims undetectable things exist but only as knowable appearances.  
  - **Unoccupied combination 2:** Answering Q5A (objects can exist unperceived) and Q9B (camera scene does not exist) is inconsistent—it allows unperceived rocks but not unperceived scenes.  
  - **Unoccupied combination 3:** Answering Q1A (conceiving is perceiving), Q2B (inconceivability does not imply impossibility), and Q5B (objects cannot exist unperceived) is merely unattractive—it makes failure to conceive irrelevant yet affirms Berkeley’s conclusion.  
  - **Unexplored:** Cases like the dream objects (Q10) and universe before minds (Q7) do not yield new positions but test consistency (e.g., affirming dream objects as real fits idealism; denying them fits realism).  
  - **Branch labels:** Q1 (conception vs. perception), Q2 (inconceivability-entails-impossibility), Q3 (existence without causal connection), Q4 (sustenance mechanism), Q5 (existence without perception), Q6 (detectability and existence), Q7 (factuality of origins), Q8 (appearance vs. reality), Q9 (instrumental vs. mental perception), Q10 (mental reality), Q11 (argument structure).
