answer: |-
  Here’s the specification for a theory of letter identity, distilled to core requirements with motivating cases, constraints, and trade-offs. The requirements are non-negotiable for any adequate account; the "negotiables" reflect philosophical or practical stances.

  ---

  ### **Core Requirements for a Theory of Letter Identity**

  1. **Script-Relative Identity**  
     *Requirement*: Must distinguish letters *within* a specific writing system (script).  
     *Motivating Case*: Cyrillic `а` (U+0430) vs. Latin `a` (U+0061). Identical shape, different letters.  
     *Constraint*: Type designers must know which script a glyph belongs to (e.g., Unicode encoding).  
     *Non-negotiable*: Yes. Collapses identity without script context.

  2. **Style Invariance**  
     *Requirement*: Must recognize the same letter across typefaces/handwriting.  
     *Motivating Case*: Single-storey handwritten `a` vs. double-storey Times New Roman `a`.  
     *Constraint*: Children learn "a" as invariant across books/blackboards. OCR must ignore stylistic noise.  
     *Non-negotiable*: Yes. Failure implies every font defines new letters.

  3. **Token vs. Type Distinction**  
     *Requirement*: Must separate physical marks (tokens) from abstract identities (types).  
     *Motivating Case*: A smudged `a` is a "bad `a`" — still type `a`, not a new letter.  
     *Constraint*: Printers correct misprinted glyphs *as errors* of a target letter.  
     *Non-negotiable*: Yes. Without this, all distorted shapes become distinct letters.

  4. **Historical/Graphemic Fluidity**  
     *Requirement*: Must accommodate splits/mergers (e.g., i/j, u/v) and dual-status glyphs (ß, æ).  
     *Motivating Case*: Long `ſ` (historical "s") resembles `f` but is contextually "s".  
     *Constraint*: Palaeographers decode manuscripts using historical rules, not shape alone.  
     *Non-negotiable*: Yes. Fixing identity rigidly ignores writing evolution.

  5. **Contextual Disambiguation**  
     *Requirement*: Identity can depend on surrounding glyphs/script.  
     *Motivating Case*: The shape `·|·` is `i` in Latin (with a dot) but `ı` (dotless i) in Turkish.  
     *Constraint*: OCR uses adjacent characters to resolve ambiguity (e.g., `c` vs. `d` in script fonts).  
     *Non-negotiable*: Yes. Isolated shapes can be indeterminate.

  6. **Functional Equivalence in Recognition**  
     *Requirement*: Account for human/OCR recognition heuristics.  
     *Motivating Case*: Vision models use texture/shape cues; humans use stroke order.  
     *Constraint*: OCR identifies `ɑ` (IPA) as "a" despite open-top shape ≠ Latin `a`.  
     *Non-negotiable*: Partially. *How* recognition works is empirical; *that* it works is essential.

  ---

  ### **Negotiable Assumptions & Inherent Tensions**
  - **Determinacy**: *Negotiable*. Borderline cases exist (e.g., `ɡ` vs. `g` in some fonts). A theory *can* accept vagueness.  
  - **Defining Features**: *Negotiable*. No single feature (topology, strokes, serifs) covers all cases. Radial categories/prototypes may be needed.  
  - **Vision vs. Handwriting**: *Tension*. Human readers use motor memory (stroke trajectory); OCR uses visual statistics (texture). A unified theory must bridge this.  
  - **Unavoidable Conflict**: "Style Independence" vs. "Contextual Disambiguation". In novel scripts (e.g., Letter Spirit), style *is* defined by relational features (e.g., curvature consistency). Separating "letter" from "style" requires script-specific priors.

  ---

  ### **Evaluation of Existing Theories**
  - **Stroke-Trajectory View** (Your friend’s view):  
    *Fails* style invariance (printed fonts lack strokes), script relativity (Cyrillic/Latin `а` same stroke ≠ same letter), and historical fluidity (long `ſ` vs. `f`). *Succeeds* for handwriting and child learning. **Score: Inadequate**.  

  - **Social Convention View** (Arbitrary symbols):  
    *Succeeds* at script relativity, historical fluidity, and contextual disambiguation. *Fails* style invariance (why is a scribbled `a` still `a`?) and functional equivalence (ignores perceptual/cognitive constraints). **Score: Necessary but insufficient**.  

  - **Abstract Skeleton View** (Defining topological structure):  
    *Succeeds* at style invariance (skeleton persists across fonts) and token/type distinction. *Fails* historical fluidity (long `ſ`/`s` skeleton mismatch) and script relativity (Cyrillic/Latin `а` share skeleton). **Score: Best fit if augmented with script context**.

  ---

  ### **Machine Learning Feasibility**  
  A system *can* learn font/style separation **if**:  
  1. Trained on multi-script data (satisfying **Script-Relative Identity**),  
  2. Uses stroke-order modeling for handwriting + texture/shape for print (**Functional Equivalence**),  
  3. Embeds contextual rules (e.g., Turkish `ı` vs. `i`; **Contextual Disambiguation**).  
  *Obstacle*: "Style" is inferred from relational consistency (e.g., all curved glyphs share stroke width). Letter Spirit *presupposes* predefined categories but shows style can be extracted from glyph interactions.  

  **Verdict**: Stroke-trajectory is circular for print; social convention ignores perception; skeletons (+ script context) best satisfy the spec but require tolerating historical vagueness. You lose the argument on strict stroke theory but win on needing a hybrid approach.
