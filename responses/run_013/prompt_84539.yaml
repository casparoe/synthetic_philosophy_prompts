  My manager stormed in shouting, "I believe the person who wrote this disastrous deployment script is incompetent!"  
  I replied, "Well, that’s awkward – I didn’t even know we *had* one person who wrote it."

  **Punchline depends on:** The secondary-occurrence reading (where the manager's belief *includes* the mistaken assumption of a unique author).  

  **Explanation in 1 sentence (as requested):** The humor relies on the manager's belief requiring there to be exactly one author (secondary occurrence), which the engineer reveals is false.
