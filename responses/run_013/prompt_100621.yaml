  First, I need to unpack what makes underdetermination a genuine problem versus a trivial or weak argument. The user mentioned specific distinctions they care about: at-a-time vs in-principle, holistic vs piecemeal, genuine equivalence vs mere unrefutedness. These are crucial because collapsing them would make the argument either too strong or too weak. 

  The gerrymandering point comes up - where someone relabels theoretical terms to create a fake rival. That feels like a common tactic in seminars, but is it a real constraint? I think yes, because it exposes when underdetermination claims are vacuous. So any serious criterion must exclude such trivial cases.

  I recall that historically, Quine's holistic underdetermination is more robust than Duhem's at-a-time version. The user probably needs to distinguish these. Also, Laudan's "confutation of convergent realism" shows that transient underdetermination doesn't kill realism - so permanence matters. 

  The realism debate adds layers. A good underdetermination claim should threaten the realist's ability to track truth, not just current theory choice. That means requiring rivals to be epistemically possible (not just logical constructions) and incompatible on unobservables. 

  Constraints that might conflict: "genuine empirical equivalence" (strong but rare) versus "permanent underdetermination" (hard to prove). Also, "non-trivial rivals" could clash with "in-principle" scope if we demand actual constructability. 

  The biggest deflator for common arguments? Probably the "non-trivial rival" requirement. Most seminar examples are either gerrymandered or ignore theoretical virtues. Pointing this out shuts down lazy uses. 

  User's frustration suggests they want ammunition against superficial uses. By systematizing the desiderata, they can dissect claims rigorously. The gerrymandering point isn't clever - it's a real flaw that their list must exclude via the non-triviality constraint.
answer: |-
  Here's a breakdown of the core desiderata for a claim of underdetermination to genuinely threaten scientific realism or rational theory choice, designed for philosophical rigor and practical application:

  ### Core Desiderata for a Non-Trivial Underdetermination Claim

  1.  **Genuine Empirical Equivalence:** The rival theories must make *exactly the same predictions* for *all possible observations*, past, present, and future, under all conceivable conditions.
      *   *Why:* Mere current agreement ("unrefutedness") or agreement on a subset of data is insufficient. Theories can share current evidence but diverge on future tests. True equivalence requires no conceivable observation could ever distinguish them.
      *   *Deflates:* Arguments where rivals simply haven't *yet* been tested differently or where equivalence is only claimed for existing data. (Common mistake: treating "not yet falsified" as "empirically equivalent").

  2.  **Non-Trivial Rivalry:** The rival theories must be *substantively different* in their ontological commitments or theoretical structure, not mere notational variants or gerrymandered constructs. They must genuinely disagree about the nature of the unobservable world.
      *   *Why:* Gerrymandered rivals (like relabeling terms or introducing arbitrary, untestable additions/subtractions - "the universe + an undetectable gremlin") are not serious competitors. They don't represent genuine alternative explanations of the *same* evidence; they are parasitic or meaningless variations. Real underdetermination requires rivals that offer *competing interpretations* of why the world behaves as it does.
      *   *Deflates:* **This is the single most effective deflator.** The "clever" seminar argument is precisely the kind of triviality this requirement excludes. It shows the claim must involve *meaningful* alternatives.
      *   *Constraint:* Yes, the gerrymandering point is a **genuine constraint**. A viable underdetermination thesis *must* exclude such trivial cases to be philosophically interesting.

  3.  **In-Principle (Permanent) Underdetermination:** The equivalence must be *necessarily permanent*, not just a transient feature of current evidence or technology ("at-a-time" underdetermination).
      *   *Why:* Transient underdetermination (Duhem-Quine thesis) is common and resolvable by further evidence, experiment, or theoretical development. It poses no *fundamental* threat to realism or rational choice, only a practical challenge for the moment. Realism concerns our ability *in principle* to know the (approximate) truth about unobservables.
      *   *Deflates:* Arguments conflating the inevitable *current* difficulty of choosing between complex theories with a *permanent* barrier to knowledge. Most "underdetermination" cited in practice is transient.

  4.  **Epistemic Viability:** The rival theories must be *internally consistent*, conceptually coherent, and scientifically plausible contenders *given the background knowledge and methodological constraints of the time/field*.
      *   *Why:* Logically possible but wildly implausible or incoherent theories (e.g., "the data is caused by magic pixies operating outside all known physical laws") are not genuine epistemic rivals. They don't force a choice between *reasonable* interpretations of the evidence.
      *   *Deflates:* Arguments relying on purely logical possibilities disconnected from scientific practice or background knowledge. It forces the rival to be a *live option* scientifically.

  5.  **Incompatibility on Unobservables:** The rivals must agree *only* on observable predictions while *genuinely conflicting* in their descriptions of the unobservable entities, structures, or mechanisms responsible for those observations.
      *   *Why:* The core realist commitment is to the epistemic accessibility of the unobservable. Underdetermination only bites if the evidence cannot decide between *incompatible* claims *about the unobservable world*. If rivals agree on unobservables or differ only on empirically idle aspects, the threat vanishes.
      *   *Deflates:* Arguments where the alleged "underdetermination" concerns aspects irrelevant to the core ontological claims of the theories or where the differences don't translate to conflicting claims about what exists/is responsible.

  6.  **Holistic Scope (Quinean Strong Underdetermination):** The underdetermination must apply to the *whole system* of scientific knowledge (or a very large, coherent chunk like fundamental physics), not just isolated hypotheses tested piecemeal.
      *   *Why:* Piecemeal underdetermination (testing a single hypothesis) is often resolvable by adjusting auxiliary assumptions within the broader theory. A genuinely threatening underdetermination claim needs to show that *entire global theoretical frameworks* (networks of laws, ontological commitments) are empirically equivalent, making the choice between them non-empirical at the core.
      *   *Deflates:* Arguments applied naively to single hypotheses without considering the resources of the broader theoretical context for resolving apparent ambiguities.

  7.  **Compatibility with Scientific Practice & Success:** The claim should not blatantly contradict well-established results about theory development, predictive success, or instrumental reliability, unless it provides a compelling reinterpretation.
      *   *Why:* A thesis claiming science *fundamentally* cannot choose between rivals must explain why science appears so successful at making novel predictions, designing precise instruments, and developing coherent, progressive frameworks. Ignoring this success makes the thesis implausible or self-undermining (if it relies on scientific knowledge to formulate the rivals).
      *   *Deflates:* Overly simplistic underdetermination claims that ignore the actual track record and explanatory power of successful scientific theories.

  ### Key Tensions Between Desiderata

  *   **#3 (Permanent) vs. #7 (Compatibility with Success):** Proving *permanent* in-principle underdetermination is extraordinarily difficult. Science has a strong track record of eventually breaking empirically equivalent rivals *in practice* through new concepts, instruments, or reinterpretations of evidence. A claim of permanent UD needs to be robust against this historical pattern, which #7 emphasizes. Can you *really* have permanent UD without it seeming to undermine the very success science demonstrably achieves?
  *   **#2 (Non-Trivial Rivalry) vs. #6 (Holistic Scope):** Constructing *genuine, non-trivial*, empirically equivalent rivals becomes astronomically harder the larger the holistic scope (#6) becomes. The bigger the theoretical framework you need to replicate empirically, the more constrained the possible rivals are, making non-trivial alternatives (#2) potentially impossible to formulate without collapsing into triviality or incoherence (#4). Can you have a holistic, non-trivial rival that's *also* empirically equivalent?

  ### The Biggest Deflator

  *   **#2 (Non-Trivial Rivalry)** is the most potent deflator of common arguments. Seminar-level claims, internet debates, and casual philosophical potshots almost invariably rely on either:
      1.  **Trivial Gerrymanders:** (The "gremlin" or relabeling examples).
      2.  **Implausible/Incoherent Rivals:** ("It's all an illusion" or radically unscientific alternatives).
      3.  **Mere Current Equivalence:** Ignoring future testability.
      Demanding a *substantive, scientifically plausible, genuinely competing* alternative theory that is *permanently* empirically equivalent immediately exposes how rarely such rivals actually exist or can be constructed, especially beyond toy examples.

  **Conclusion for Your Purpose:** When someone throws out "underdetermined!", demand they specify: Is it *permanent* (#3) or transient? Are the rivals *non-trivially different* on unobservables (#2, #5) or just gerrymandered? Are they *genuinely empirically equivalent* (#1) or just currently unfalsified? Are they *epistemically viable* (#4) competitors? If they can't meet these hurdles, especially #2 and #3, their claim doesn't touch the core realist thesis about the potential knowability of unobservables. The gerrymandering point isn't just clever; it highlights the crucial need for **non-trivial rivalry**, which is the first and strongest line of defense against lazy underdetermination arguments.
