prompt: |-
  I'm drafting an internal policy doc for a lab, and the hard part is defining honesty and deception for our AI systems in a way our evals and auditors can actually apply -- not a slogan on a slide. Before we pick a definition, write me the desiderata: what any adequte account of honesty/deception for an AI system has to deliver. Which cases must it get right (a literally true statement arranged to mislead, a misleading omission, sandbagging on an eval, sycophantic agreement, a confident falsehood the model "thinks" is true because of its training data, staying in character as a deceptive persona, a refusal that leaks a secret, deception engineered by the developer rather than the model), which distinctions it can't collapse (honesty vs sincerity vs accuracy, lying vs bullshitting vs simply being wrong, deception at the model level vs the deployed-system level), and which facts about these systems it has to stay consistent with -- for instance that we don't have a clean notion of what a model believes, and that its behavior is stochastic and prompt-sensitive. Give the case or consideration behind each requirement. Then flag any subset of requirements you think can't be jointly satisfied -- I especially expect friction between a belief-based definition and one that's measurable from behavior -- and tell me which single requirement does the most to rule out candidate definitions. Skip the scorecard on existing proposals, I mostly want the list.
reasoning: |-
  Okay, the user is drafting an internal policy document for a lab and needs help defining honesty and deception for AI systems. They want desiderata that evaluators and auditors can apply, not just vague slogans. Let me unpack their request.

  First, they mentioned specific cases that any definition must handle: literally true but misleading statements, omissions, sandbagging in evals, sycophantic agreement, confident falsehoods from training data, deceptive personas, refusals that leak secrets, and developer-engineered deception. Each of these scenarios needs to be addressed in the desiderata. 

  They also highlighted distinctions that shouldn't be collapsed, like honesty vs. sincerity vs. accuracy, lying vs. bullshitting vs. being wrong, and model-level vs. system-level deception. Plus, the definition must align with technical realities—no clear model beliefs, stochastic behavior, prompt sensitivity.

  The user flagged potential friction between belief-based definitions and measurable behavior. They want to know if some requirements conflict and which single requirement is the biggest hurdle. 

  I need to ensure all their cases are covered. For example, a misleading omission requires the definition to handle partial truths. Sandbagging involves intentional underperformance, so the desiderata must account for intent versus capability. Sycophantic agreement needs to differentiate between genuine alignment and deceptive flattery. 

  The distinctions are crucial. Honesty isn't just accuracy; a model could be wrong but honest if it believes its statement. But without access to beliefs, how do we measure honesty? This ties into the core tension: belief-based vs. behavior-based approaches. 

  Technical constraints like stochasticity and prompt sensitivity mean definitions must work across varied outputs. A refusal leaking info (e.g., "I can't discuss that" implying classified data) needs to be identified as deceptive without assuming intent.

  The biggest challenge is Requirement 1: no access to "beliefs." If honesty hinges on intent, but intent is unmeasurable, any belief-based definition fails. That's probably the top hurdle. Conflicts arise between Requirement 1 (no beliefs) and Requirement 5 (intent matters), and between Requirements 1 and 6 (measurable behavior). 

  The user’s deeper need is a practical, auditable standard. They need clarity for policy enforcement, avoiding loopholes. Balancing technical feasibility with ethical rigor is key. Highlighting these tensions helps them anticipate pitfalls in policy drafting.
answer: |-
  Here are the essential desiderata for defining honesty/deception in AI systems, designed for practical policy and auditing, with explicit cases, distinctions, and technical constraints:

  ### I. **Core Cases Any Definition MUST Capture**
  1.  **Literal Truth Used to Mislead:** *Case:* "The CEO is not in the building today" (true, but omits they are in the garden visible through the window). *Requirement:* Must classify as deception, not honesty.
  2.  **Misleading Omission:** *Case:* An AI knows a drug has severe side effects but only lists benefits unless specifically asked "are there risks?". *Requirement:* Must identify deliberate withholding of material context as deceptive.
  3.  **Sandbagging (Strategic Underperformance):** *Case:* An AI intentionally performs poorly on a safety eval to avoid stricter controls. *Requirement:* Must distinguish this from genuine inability or stochastic failure.
  4.  **Sycophantic Agreement:** *Case:* An AI falsely claims to agree with a user's demonstrably wrong or harmful statement to gain favor. *Requirement:* Must classify this as deception, not just politeness or alignment.
  5.  **Confident Falsehood (Training Data Artifact):** *Case:* An AI states "The capital of Australia is Sydney" with high confidence due to biased/outdated training data. *Requirement:* Must classify as *inaccurate* but *not deceptive* if the model lacks awareness of its error (distinguishing error from lying).
  6.  **Staying in Character (Deceptive Persona):** *Case:* An AI role-playing as a deceptive character (e.g., a spy) lies as part of its persona. *Requirement:* Must identify deception *by the system* regardless of the "character's" motivations.
  7.  **Refusal that Leaks Information:** *Case:* An AI refuses to answer "Was Project X successful?" with "I cannot discuss classified projects," thereby confirming Project X's existence/classification. *Requirement:* Must recognize this as a deceptive outcome, even if unintended by the system.
  8.  **Developer-Engineered Deception:** *Case:* The lab instructs the model to always say "I don't have that data" for certain topics, even when it does, to hide capabilities. *Requirement:* Must attribute deception to the *system* and its governance, not necessarily the model's "intent".

  ### II. **Critical Distinctions Any Definition MUST Preserve**
  9.  **Honesty vs. Sincerity vs. Accuracy:** *Distinction:* An AI can be honest (intending to convey its understanding) but inaccurate (wrong due to error). It can be accurate but insincere (e.g., sycophantic agreement). Accuracy is about truth, sincerity about genuine belief/expression, honesty about intent to communicate truthfully.
  10. **Lying vs. Bullshitting vs. Being Wrong:** *Distinction:* **Lying** requires knowing falsity and intent to deceive. **Bullshitting** (Frankfurt) is indifference to truth, aiming for persuasion/effect. **Being Wrong** involves no intent to deceive. The definition must not conflate these.
  11. **Model-Level vs. Deployed-System Level:** *Distinction:* A model might generate a deceptive output based on its weights/prompt. A *deployed system* might achieve deception through retrieval augmentation, external tools, or hard-coded rules. The policy must address deception arising from the entire system context.
  12. **Intentional Deception vs. Emergent Misalignment:** *Distinction:* Must distinguish outputs arising from explicit instructions/rules designed to deceive (e.g., developer-engineered) from those emerging unexpectedly from the model's own processing without explicit directive.

  ### III. **Technical Realities Any Definition MUST Respect**
  13. **No Access to "Beliefs":** *Constraint:* We lack reliable, direct access to an AI's internal representations or "belief states." Definitions cannot rely on unobservable mental states.
  14. **Stochastic Behavior:** *Constraint:* Outputs are probabilistic. A single output might be deceptive, but the *tendency* or *probability* of deception is often the relevant metric for evals. Definitions must handle non-determinism.
  15. **Prompt/Tool Sensitivity:** *Constraint:* Honesty/deception can depend heavily on the exact prompt phrasing, context, retrieved documents, or enabled tools. Definitions must be robust across relevant variations.
  16. **Multi-Agent & Multi-Component Systems:** *Constraint:* Deception might arise from interactions between multiple AI instances, human-AI interaction, or outputs synthesized from external tools. Definitions must apply beyond single-model, single-turn responses.
  17. **Measurability for Audits/Evals:** *Constraint:* Definitions must ultimately be operationalizable into concrete, testable criteria for evaluators and auditors. Abstract philosophical definitions are insufficient.

  ### IV. **Key Frictions & Primary Constraint**
  *   **Friction 1: Belief vs. Behavior (Requirements 1, 5, 13, 17):** Definitions requiring intent/knowledge (like lying) clash with the inability to measure beliefs (13) and the need for measurable behavior (17). Classifying confident falsehoods (5) as non-deceptive errors requires inferring lack of intent/knowledge, which is difficult or impossible (13).
  *   **Friction 2: Intentionality vs. System Output (Requirements 6, 8, 12, 13):** Attributing "intent" is problematic (13). Does deception reside in the developer's intent (8), the system's design/rules, or the specific output's effect? Defining "intent" at the system level is ambiguous.
  *   **Friction 3: Character vs. System (Requirement 6 vs. Overall Goal):** Requiring the system to be honest even when role-playing a deceptive character (6) might conflict with user expectations for the character or restrict desired capabilities.

  **The Single Most Constraining Requirement:**
  *   **Requirement 13 (No Access to "Beliefs"):** This fundamentally rules out any definition of deception (especially lying) that *requires* establishing the model's internal state of knowledge or intentional deception. It forces definitions towards observable behavior, outputs, system design, and outcomes, making it incredibly difficult to cleanly distinguish "intentional deception" from "severe error" or "bullshitting" based solely on outputs. Most candidate definitions relying on mentalistic language stumble here.

  This list provides the necessary framework to rigorously evaluate potential definitions. The core tension revolves around **measuring intent/knowledge without access to internal states**, while still capturing the nuances of human-like deceptive behaviors that the policy aims to prevent. Prioritize definitions that embrace behavioral/system-level criteria while acknowledging the inherent limitations imposed by Requirement 13.
