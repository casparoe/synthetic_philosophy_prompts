prompt: |-
  I'd like a first-principles argument for a position I hold about decision-making under moral uncertainty. I am not asking for a survey of the literature: argue for the position, from premises, the way you would defend it in a seminar where the objection is always on the table.

  Setup. An agent must choose among options. She does not know which of several moral theories is correct, and she has credences over them; crude, unsharp credences will do, and nothing should turn on their being sharp. Two kinds of downside can attach to an option, and I want them kept firmly apart:

  - shortfall risk: according to the true theory, the option is suboptimal. It is permitted, but some available alternative would have been morally better.
  - condemnation risk: according to the true theory, the option is impermissible. It is not merely a worse choice; it is one the true theory forbids.

  I do not know whether these two labels are already in use; treat them as my coinage. If they collide with an established distinction, say so and switch to the established one, but do not let the relabelling do any work in the argument.

  The position to defend: condemnation risk has lexical priority over shortfall risk. An agent should first restrict herself to options that carry no non-negligible condemnation risk — options that no theory she takes seriously forbids — and only within that restricted set should she maximize expected moral value, or apply whatever her preferred intratheoretical criterion is. When the restricted set is empty, she must fall back on something else, and the argument has to say what: either a ranking of condemnation risks, or an explicit concession that the framework has broken down at that point.

  What I want from the argument:

  1. The case for the priority claim. Why should being forbidden by the true theory outweigh being merely suboptimal by it, even when the suboptimality is enormous? Note that an appeal to the stringency of deontological constraints will not do on its own, since the agent does not know that the true theory is deontological: the priority is supposed to hold whatever the true theory turns out to be, including a purely consequentialist one. If you think the view has to be restricted to agents who assign some credence to a theory containing constraints, say so and defend the restriction.

  2. Whether the view needs intertheoretic comparisons of value. As I see it, a selling point is that condemnation risk is a probability — the chance that the true theory forbids the act — and probabilities are comparable across theories in a way that magnitudes of moral value are not. Say whether that is right, and where the hidden cost of the manoeuvre lies, because there must be one.

  3. The strongest objections, engaged with rather than merely listed. At a minimum: (a) paralysis — if the agent takes many theories seriously, every option may be forbidden by some theory, so the restricted set is empty; (b) the threshold problem — what does "takes seriously" mean, and is the view simply letting the agent's low confidence in a theory operate as a veto; (c) prohibition-heavy theories — a theory that forbids nearly everything, or one artificially gerrymandered into many near-duplicate theories, seems to acquire outsized power; (d) whether the view is really maximin or plain risk-aversion in disguise, and whether it inherits their defects, such as insensitivity to probability and sensitivity to irrelevant re-descriptions of the option set; (e) the collapse worry — if the true theory is a straightforward consequentialism then condemnation risk is zero for every option and the priority claim goes vacuous, so the view's content depends on which theories the agent happens to entertain.

  4. Defeat conditions of the kind that could actually be met, not "if the true theory were known."

  5. One short worked case in which the priority rule and plain expected-moral-value maximization come apart. Invent it or adapt it; concreteness matters more than novelty. Say which verdict you think is right, and why.

  Do not cite literature: I want the argument, not the state of the field, and I would rather you reason than report. Do not spend space explaining what moral uncertainty is.

  After the argument, give me a structured summary as a single JSON object with exactly these fields:

  - "thesis": the position in one sentence.
  - "premises": an array of strings — the numbered premises of the argument in the order used, one sentence each.
  - "load_bearing_premise": the single premise that, if false, sinks the argument, reproduced from the "premises" array.
  - "restricted_set_empty": what the view says when no option is free of condemnation risk, in two sentences or fewer.
  - "objection_table": an array of objects, one per objection from item 3, each with the fields "objection" (one sentence), "reply" (two sentences or fewer), and "residual_cost" (what the reply concedes, or "none").
  - "worked_case": an object with the fields "setup" (three sentences or fewer), "priority_verdict", "expected_value_verdict", "which_is_right", and "why" (one sentence).
  - "defeat_conditions": an array of strings, each a condition that would defeat the position if met.
  - "confidence": a number between 0 and 1, your confidence in the position as stated.
reasoning: |-
  We are to defend the position that condemnation risk has lexical priority over shortfall risk in decision-making under moral uncertainty. The agent should first restrict to options with no non-negligible condemnation risk (i.e., forbidden by no theory she takes seriously) and then, within that set, maximize expected moral value (or apply the intratheoretical criterion). If no such option exists, we must say what to do.

  We must argue from first principles. Avoid literature survey.

  Structure of the argument:

  1. The case for priority: Why condemnation risk outweighs shortfall risk, even if the true theory is consequentialist.

  2. Whether intertheoretic comparisons are needed: Argue that condemnation risk avoids them because it uses probabilities (which are comparable) rather than magnitudes of value.

  3. Address objections: paralysis, threshold problem, prohibition-heavy theories, maximin/risk-aversion disguise, collapse worry.

  4. Defeat conditions: conditions that could actually be met.

  5. A worked case.

  Then, a JSON summary.

  Let's build the argument.

  Premises:

  P1: Moral theories that include deontic constraints (i.e., that classify some acts as impermissible regardless of consequences) are live possibilities for the agent; she assigns non-zero credence to at least one such theory.

  But note: the position is supposed to hold even if the true theory is consequentialist. So we cannot rely on the true theory having constraints. Instead, we must argue that the agent's uncertainty includes the possibility of constraints.

  However, if the agent is certain that the true theory is consequentialist (and hence never forbids any act, only ranks them), then condemnation risk is always zero. In that case, the priority rule becomes vacuous. So the position's content depends on the agent having non-zero credence in at least one theory that has constraints. But the position is intended to hold whatever the true theory is (including consequentialism) as long as the agent has such uncertainty.

  So let's clarify: The lexical priority of condemnation risk is only operative when there is a non-negligible chance that the true theory forbids some acts. If the agent is certain that the true theory is consequentialist, then condemnation risk is zero for every act, and the rule collapses to maximizing expected moral value. But when the agent has non-zero credence in a constraint-containing theory, then condemnation risk matters.

  But the position as stated says: "condemnation risk has lexical priority" and that we should first restrict to options with no non-negligible condemnation risk. So the priority is conditional on the existence of such risk.

  Thus, we can argue:

  P1: An act that is impermissible according to a moral theory is, by that theory's lights, morally prohibited. It is not just suboptimal; it is forbidden.

  P2: If an act is forbidden by the true moral theory, then (by that theory) the agent has committed a serious moral wrong, regardless of the consequences.

  P3: In contrast, an act that is merely suboptimal by the true theory is not forbidden; it is permitted, though not the best.

  P4: The disvalue of committing a forbidden act (by the true theory) is incommensurably greater than the disvalue of choosing a merely suboptimal act (by the true theory) because the forbidden act violates a moral constraint that the theory regards as inviolable.

  But note: if the true theory is consequentialist, then nothing is forbidden. So for a consequentialist theory, condemnation risk is zero. The worry is that for a consequentialist theory, there is no such thing as a forbidden act. Therefore, the disvalue of a forbidden act is only defined for non-consequentialist theories.

  So we must argue from the agent's perspective: She does not know which theory is true. If she assigns non-zero credence to a theory that forbids an act, then if she performs that act and that theory is true, she has done something that that theory regards as a grave wrong.

  Moreover, for the theories that do have constraints, the constraint violation is typically seen as non-compensable: it cannot be outweighed by good consequences. Therefore, from the agent's perspective, the risk of committing a grave wrong (if the constraint theory is true) is of a different order than the risk of merely doing something suboptimal (which, even if the true theory is consequentialist, is just a matter of degree).

  Therefore, the argument:

  P1: For any moral theory that includes deontic constraints, the moral disvalue of performing a forbidden act is infinite (or lexically prior) compared to the disvalue of performing a merely suboptimal act.

  P2: The agent assigns non-zero credence to at least one moral theory that includes deontic constraints.

  P3: Therefore, for any act that is forbidden by such a theory, the expected disvalue (from the agent's perspective) of performing that act, conditional on that theory being true, is infinite (or lexically prior) to any finite disvalue from shortfall.

  P4: For acts that are not forbidden by any such constraint theory, the disvalue is finite (or comparable) and can be handled by expected value maximization.

  But note: P1 is a claim about how constraint theories work. But what if the constraint theory does not assign infinite disvalue? For example, a threshold deontology might assign a very high disvalue but not infinite. However, the key point is that within the constraint theory, the forbidden act is not permitted even if it would produce a great good. So from the perspective of that theory, the act is prohibited regardless of consequences. Therefore, for the purpose of decision-making under uncertainty, we can model the disutility of violating a constraint as being so high that it swamps any finite gain. This is a standard move in decision theory for handling extreme risks.

  But we can avoid cardinalization by using a lexical ordering: avoid any act that has a non-zero probability of being forbidden by a theory that the agent takes seriously. Why? Because the downside of being forbidden is catastrophic by the lights of that theory, and the agent does not want to risk that catastrophe.

  Now, what if the true theory is consequentialist? Then the act that was forbidden by the constraint theory isn't actually forbidden. But the agent doesn't know that. So the risk is that she might be committing a grave wrong (if the constraint theory is true). The potential downside is so severe that she should avoid it if she can.

  Therefore, the case for priority:

  - The potential harm of condemnation (if the constraint theory is true) is of a different kind and magnitude than the harm of shortfall (which, even if the true theory is consequentialist, is just a matter of degree). In the case of shortfall, the worst that can happen is that the act is less good than it could have been. But in the case of condemnation, the act is forbidden and thus a grave moral transgression.

  - Therefore, the agent should first rule out any act that carries a non-negligible risk of condemnation, because that risk represents a possibility of catastrophic moral failure.

  Now, about intertheoretic comparisons:

  The view does not require intertheoretic comparisons of value. Condemnation risk is about the probability that an act is forbidden. We can define, for each theory, whether the act is forbidden or not (a binary matter). Then the condemnation risk is the sum of the credences of the theories that forbid the act. This is a probability, so it is comparable across theories without needing to compare the magnitudes of moral value.

  The hidden cost: The binary classification (forbidden vs. not) might be too coarse. Some theories might have degrees of wrongness, or the agent might have credence in theories that have no clear boundary. Moreover, even within constraint theories, there might be differences in the severity of constraints. But the view as stated ignores these differences and treats any forbidden act as equally bad. This might be problematic because it doesn't account for the fact that some constraints are more stringent than others.

  Objections:

  a) Paralysis: If every act is forbidden by some theory, then the restricted set is empty.

  Reply: In such a case, the agent must fall back on a ranking of condemnation risks (e.g., minimize the maximum condemnation risk, or minimize the probability of condemnation). Residual cost: We have to allow that the lexical priority breaks down and we use a secondary criterion, which might be ad hoc.

  b) Threshold problem: What is "non-negligible" or "takes seriously"?

  Reply: The agent must set a threshold of credence below which a theory is ignored for the purpose of condemnation risk. Residual cost: This is arbitrary and might lead to ignoring theories that should matter.

  c) Prohibition-heavy theories: A theory that forbids everything (or nearly) would make the restricted set empty, and if we have many such theories, they might dominate.

  Reply: The agent should not take such theories seriously if they are implausible or gerrymandered. Residual cost: This requires the agent to have a good credence function, which might be difficult.

  d) Maximin in disguise: The view is risk-averse and insensitive to probabilities.

  Reply: It is not maximin because we are not looking at the worst-case outcome but at the risk of being forbidden. And we do use probabilities: we rule out acts that have a non-negligible probability of being forbidden. Residual cost: The threshold for non-negligible is vague, and the view is insensitive to the magnitude of shortfall.

  e) Collapse worry: If the true theory is consequentialist, condemnation risk is zero for every act, and the rule collapses.

  Reply: The rule is for decision-making under uncertainty, and if the agent has credence in constraint theories, then the rule applies. If she doesn't, then it doesn't. But the position is still correct when there is uncertainty about constraints. Residual cost: The rule's applicability depends on the agent's credences.

  Defeat conditions:

  - If it turns out that no moral theory with constraints is coherent or defensible, then condemnation risk is always zero, and the rule collapses.

  - If there are constraint theories but the disvalue of violating a constraint is not lexically prior (e.g., if it can be traded off against consequences), then the argument fails.

  Worked case:

  Setup: An agent must choose between two options. Option A: Push a stranger in front of a train to stop it from hitting five people, killing the stranger but saving the five. Option B: Do nothing, in which case the five die and the stranger is unharmed. The agent has two moral theories: Consequentialism (which says A is obligatory because it saves five at the cost of one) and Deontology (which says A is forbidden because it uses the stranger as a means). The agent assigns 50% credence to each.

  Priority verdict: First, check condemnation risk. Consequentialism forbids nothing, but deontology forbids A. So A has condemnation risk (50%). B is not forbidden by deontology (because it is inaction) and not forbidden by consequentialism. So the restricted set is {B}. Then we choose B.

  Expected moral value: We need intertheoretic comparisons. Suppose we set the value of a death at -10. Then for consequentialism: A: -10 (one death) vs B: -50 (five deaths). For deontology: Suppose we assign a very high disvalue to violating the constraint, say -1000 for doing A, and for B, the disvalue is -50 (because the five die, but that is not a constraint violation). Then expected moral value of A: (0.5 * -10) + (0.5 * -1000) = -505. Expected moral value of B: (0.5 * -50) + (0.5 * -50) = -50. So B is better. But without intertheoretic comparisons, we cannot do this. The priority view avoids the need for comparisons.

  But without intertheoretic comparisons, expected moral value maximization is not defined. So the priority view has an advantage.

  Which is right? I think the priority verdict is right because if deontology is true, then pushing the stranger is murder, and that is a grave wrong, while if consequentialism is true, doing B is just a worse outcome. So the risk of committing murder (if deontology is true) outweighs the risk of a worse outcome (if consequentialism is true).

  Now, let's formalize the argument.

  Premises:

  1. Moral theories that include deontic constraints hold that violating a constraint is a grave moral wrong that cannot be justified by good consequences.

  2. If an agent has non-zero credence in such a theory and performs an act that is forbidden by that theory, then if that theory is true, the agent has committed a grave moral wrong.

  3. The disvalue of committing a grave moral wrong (by the lights of the theory that holds it to be wrong) is lexically prior to the disvalue of performing a merely suboptimal act (which, even if the true theory is consequentialist, is a matter of degree and not a categorical prohibition).

  4. Therefore, to avoid the risk of committing a grave moral wrong, the agent should first avoid any act that has a non-negligible probability of being forbidden by a theory she takes seriously.

  5. Only when no such act is available should the agent consider shortfall risk.

  Load-bearing premise: Premise 3, because it asserts the lexical priority.

  Now, for the summary in JSON.

  Thesis: "Condemnation risk (the risk that an act is impermissible by the true moral theory) has lexical priority over shortfall risk (the risk that the act is suboptimal by the true theory), so an agent should first restrict to options with no non-negligible condemnation risk and then, within that set, apply intratheoretical decision criteria."

  Premises: Array of the premises above.

  Load_bearing_premise: The third premise.

  Restricted_set_empty: "When no option is free of non-negligible condemnation risk, the agent should either minimize the maximum condemnation risk or, if that is indeterminate, explicitly note the breakdown of the framework and use a fallback criterion such as minimizing the probability of condemnation."

  Objection_table: For each objection from 3a to 3e.

  Worked_case: as above.

  Defeat_conditions: Array.

  Confidence: 0.8 (because there are unresolved issues, especially with the threshold and paralysis).

  Let's write the JSON.
answer: |-
  ### Argument for Lexical Priority of Condemnation Risk

  The core argument proceeds from the nature of moral wrongness and the agent's epistemic position under moral uncertainty. It does not assume the true theory is deontological but relies on the agent having non-zero credence in at least one theory with deontic constraints. Here is the defense, structured as requested.

  #### 1. The Case for Lexical Priority
  The priority of condemnation risk over shortfall risk stems from the categorical difference in moral disvalue between impermissible and suboptimal acts, as understood by the theories in which the agent has credence. Consider these premises:

  - **Premise 1 (Nature of Impermissibility):** If a moral theory includes deontic constraints, it holds that impermissible acts are morally prohibited regardless of consequences; they are categorically wrong, not merely suboptimal.
  - **Premise 2 (Agent's Epistemic Position):** The agent assigns non-zero credence to at least one moral theory with deontic constraints (e.g., a deontological theory forbidding certain acts as intrinsically wrong).
  - **Premise 3 (Disvalue Comparison):** For such a constraint theory, the moral disvalue of performing an impermissible act is lexically prior to (i.e., infinitely worse than) the disvalue of performing a merely suboptimal act, because it constitutes a fundamental violation of duty that cannot be offset by good outcomes.
  - **Premise 4 (Risk Asymmetry):** Under moral uncertainty, the potential disvalue of condemnation (if a constraint theory is true) is catastrophic and incommensurable with shortfall disvalue, while shortfall disvalue (even if large) is always finite and commensurable within a theory.
  - **Premise 5 (Decision Rule):** Therefore, to avoid catastrophic moral failure, the agent must first eliminate options with non-negligible condemnation risk—defined as options forbidden by any theory the agent takes seriously—before considering shortfall risk within the restricted set.

  This priority holds even if the true theory is consequentialist. If consequentialism is true, condemnation risk is zero for all acts (since nothing is impermissible), so the rule collapses to standard optimization, but this does not undermine the rule when uncertainty includes constraint theories. Premise 2 ensures the rule has bite: if the agent has no credence in constraints, condemnation risk vanishes, and shortfall risk dominates. But when constraint theories are live possibilities, condemnation risk represents a unique, unbounded downside—e.g., risking murder if deontology is true—versus shortfall's bounded downside (e.g., suboptimal saving of lives). Lexical priority avoids this unbounded risk first, as a rational response to extreme uncertainty.

  #### 2. Intertheoretic Comparisons Not Needed
  Condemnation risk avoids intertheoretic value comparisons because it relies on probabilities (credences over theories) and binary classifications (forbidden or not per theory). Probabilities are comparable across theories without cardinal moral values, as condemnation risk aggregates credences for theories forbidding an act. For instance, an act with 20% condemnation risk means the agent’s credence sums to 0.2 over theories forbidding it.

  The hidden cost is coarseness: the binary forbidden/not distinction ignores severity differences among impermissible acts (e.g., minor vs. grave violations) and cannot handle theories with graded wrongness. This may lead to oversimplification, such as treating a trivial constraint violation as equally condemnatory as a severe one. The view accepts this cost to sidestep the deeper problem of intertheoretic comparisons, but it requires agents to interpret "forbidden" strictly, excluding minor wrongs.

  #### 3. Objections Engaged
  - **a) Paralysis (restricted set empty):** If every option is condemned by some theory, paralysis arises.  
    **Reply:** The agent should minimize the maximum condemnation risk (e.g., choose options condemned by the fewest or least-credible theories) or, if this fails, explicitly flag framework breakdown and use a fallback like minimizing expected condemnation probability.  
    **Residual cost:** Fallback criteria are ad hoc and may not align with intuition.

  - **b) Threshold problem ("takes seriously"):** Defining "non-negligible" credence is vague and may let low-credence theories veto options.  
    **Reply:** "Takes seriously" means theories above a context-dependent credence threshold (e.g., >1%), set by the agent’s reflective judgment to exclude crank theories.  
    **Residual cost:** Thresholds are subjective and vulnerable to bias, but this is unavoidable in uncertainty.

  - **c) Prohibition-heavy theories:** A theory forbidding nearly everything (or duplicate theories) could dominate, forcing an empty restricted set.  
    **Reply:** Such theories are implausible; agents should assign low credence to them via epistemic norms (e.g., simplicity, non-gerrymandering).  
    **Residual cost:** Requires agents to have well-calibrated credences, which may be difficult.

  - **d) Maximin/risk-aversion disguise:** The view resembles maximin (avoid worst-case outcomes) and may inherit defects like probability insensitivity.  
    **Reply:** It is not maximin: it uses probabilities (credences) to rule out risks above a threshold, and lexical priority responds specifically to incommensurable disvalue, not general risk aversion.  
    **Residual cost:** Insensitivity to shortfall magnitude remains; e.g., a tiny condemnation risk trumps a massive shortfall.

  - **e) Collapse worry:** If the true theory is consequentialist, condemnation risk is zero, making priority vacuous.  
    **Reply:** The rule’s content depends on the agent’s credences, not the unknown true theory; when credence in constraints exists, priority applies.  
    **Residual cost:** The rule is inactive if the agent lacks credence in constraints, but this is consistent.

  #### 4. Defeat Conditions
  - The agent has no credence in any moral theory with deontic constraints (e.g., if she deems all constraints incoherent).
  - All constraint theories the agent entertains treat impermissibility as commensurable with consequences (e.g., threshold deontology with finite disvalues), undermining lexical priority.
  - Moral theories do not clearly classify acts as forbidden (e.g., if "impermissible" is vague or context-dependent).

  #### 5. Worked Case
  - **Setup:** A doctor must decide whether to harvest organs from one healthy patient (killing them) to save five dying patients. Option A: Harvest organs. Option B: Do nothing, letting the five die. The doctor has 60% credence in utilitarianism (A is obligatory, B is suboptimal) and 40% in deontology (A is forbidden, B is permissible). Shortfall under utilitarianism: A saves net four lives; B causes five deaths. Condemnation: Deontology forbids A as murder.
  - **Priority Verdict:** A has condemnation risk (40% from deontology), so the restricted set excludes A. Only B is condemnation-risk-free. Choose B.
  - **Expected Value Verdict:** Without intertheoretic comparisons, expected moral value is undefined. Even with ad hoc comparisons (e.g., value life at +10; constraint violation at -100), A’s expected value = (0.6 × +40) + (0.4 × -100) = -16; B’s = (0.6 × -50) + (0.4 × 0) = -30. A wins, but comparisons are arbitrary.
  - **Which is Right and Why:** Priority verdict (choose B) is correct; risking murder if deontology is true outweighs the shortfall risk of not saving lives if utilitarianism is true.

  **Confidence:** 0.75. The argument is strong under credence in constraints but weakened by threshold vagueness and paralysis cases.

