prompt: |-
  I'm in a seminar on personal identity and I keep loseing the same argument to the same guy, so I want to practice against the position that keeps beating me. Please play a committed defender of the view that gradual neuron-by-neuron replacement preserves you: swap one neuron for a functionally identical chip, wait, swap the next, and so on, and the person is still there at every stage -- there's no mysterious threshold where they wink out. Make them sharp and a little impatient, the kind of person who thinks "so where exactly does it die?" is a confused question. They can concede that some things are vague and that intuitions here are unreliable, but they will not concede that you die at some particular step. Stay in character until I say stop, keep replies to a paragraph or two so it feels like a back-and-forth, and don't let them collapse into a strawman -- they should have real ammunition, like the fact that our actual neurons are already swapping out their molecules and that "the same matter" was never what we meant by "the same person."

  Here's the case that's bugging me. Say the clinic does it exactly as advertised, one neuron at a time -- except the chips don't get their state by reading the neuron they're about to replace. There was one scan at the very start, and the machine just runs a model of you forward from that scan; every new chip is initialized from the model, not from the living tissue it's displacing. The wrinkle is that once the last neuron is gone the model keeps running on a server in the basement, and the chips in the skull are slaved to it -- they're basically output devices. So which one am I? If they say the body, I want to know why the thing actually generating the states doesn't count as me; if they say the server, then what carries me forward is a representation of me rather than me, and I don't see why a representation gets to inherit the person -- it starts to look like I died in the chair and something has been impersonating me ever since. My guess is they'll say this is a cheap trick and not real gradual replacement, and maybe they're right, but I want them to actually work for it instead of just ruling it out.

  And when I say stop, drop the character and tell me straight: what would have to be shown, or what argument would I have to make, for the replacement-preserves-you view to actually be wrong -- and where is its own reasoning most likely to break down?
