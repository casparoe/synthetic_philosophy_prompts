  ### Decision Tree for the Lottery and Preface Paradoxes

  This decision tree maps the logical space of responses to the lottery and preface paradoxes. It is structured around key philosophical questions, enabling students to navigate positions without prior knowledge of specific authors or labels. The tree uses both large-scale (1000-ticket lottery; 1000-page book with one claim per page) and small-scale (5-ticket lottery; 5-sentence note with a preface conceding one sentence is false) cases to clarify how thresholds and principles operate. Unoccupied branches are marked as such (incoherent, unattractive, or unexplored). The tree contains 12 branch nodes and 12 leaves, covering the required positions.

  #### Tree Structure (Numbered Outline)

  1. **Is there an attitude of outright acceptance (belief) over and above graded credence?**  
     (This branch separates views that dissolve the paradox by rejecting outright belief from those that engage with it.)  
     - **No**: Proceed to Leaf A.  
     - **Yes**: Proceed to 2.  

  2. **Is the paradox about the norms of belief, or about assertion or testimony?**  
     (This distinguishes whether the paradox targets belief or shifts focus to speech acts.)  
     - **Assertion or testimony**: Proceed to Leaf B.  
     - **Belief**: Proceed to 3.  

  3. **Is acceptance governed by a threshold on credence?**  
     (This separates probabilistic threshold-based views from non-probabilistic, role-based views.)  
     - **No**: Proceed to 4.  
     - **Yes**: Proceed to 5.  

  4. **Do the lottery and preface paradoxes have the same structure (i.e., is the source of the paradox identical)?**  
     (This identifies positions that treat the paradoxes as distinct vs. those that unify them.)  
     - **No**: Proceed to Leaf I.  
     - **Yes**: Proceed to 8.  

  5. **Is the threshold for acceptance fixed at 1 (i.e., certainty)?**  
     (This isolates views requiring certainty from those with lower thresholds.)  
     - **Yes**: Proceed to Leaf C.  
     - **No**: Proceed to 6.  

  6. **Does the threshold vary with context, stakes, or practical interests?**  
     (This splits fixed-threshold views from context-sensitive ones.)  
     - **Yes**: Proceed to 9.  
     - **No**: Proceed to 10.  

  7. **Must the set of accepted propositions be consistent?**  
     (This is deferred; it appears later for specific branches.)  

  8. **Must the set of accepted propositions be consistent?** (From 4: Non-threshold, same structure)  
     - **Yes**: Proceed to 13.  
     - **No**: Proceed to Leaf H3.  

  9. **Must the set of accepted propositions be consistent?** (From 6: Contextual threshold)  
     - **Yes**: Proceed to 11.  
     - **No**: Proceed to Leaf H1.  

  10. **Must the set of accepted propositions be consistent?** (From 6: Fixed threshold)  
      - **Yes**: Proceed to 12.  
      - **No**: Proceed to Leaf H2.  

  11. **Must acceptance be closed under conjunction?** (From 9: Contextual threshold, consistent)  
      - **Yes**: Proceed to Leaf F1.  
      - **No**: Proceed to Leaf G1.  

  12. **Must acceptance be closed under conjunction?** (From 10: Fixed threshold, consistent)  
      - **Yes**: Proceed to Leaf F2.  
      - **No**: Proceed to Leaf G2.  

  13. **Must acceptance be closed under conjunction?** (From 8: Non-threshold, same structure, consistent)  
      - **Yes**: Proceed to Leaf F3.  
      - **No**: Proceed to Leaf G3.  

  #### Leaves (Positions)
  Each leaf is labeled with a conventional name (if available) and a descriptive label. For each, the sequence of answers from the root (1) to the leaf is given, followed by implications for the paradoxes, a distinguishing case from the nearest neighbor, and the most awkward commitment.

  - **Leaf A: Credence Only (Position i)**  
    Sequence: 1→No  
    - **Lottery (large/small)**: No outright belief in any ticket losing (e.g., for 1000 tickets, no belief "ticket 1 loses"; for 5 tickets, no belief "ticket 1 loses"). Only high credence.  
    - **Preface (large/small)**: No outright belief in any claim (e.g., for 1000 pages, no belief "claim 1 is true"; for 5 sentences, no belief "sentence 1 is true"). Only high credence.  
    - **Distinguishing case from B**: A student who says, "I'm 99.9% sure but won't assert it" in a low-stakes lottery vs. high-stakes testimony.  
    - **Most awkward commitment**: Denies intuitive practices of belief-based reasoning and assertion in daily life.  

  - **Leaf B: Assertion/Testimony Norms (Position viii)**  
    Sequence: 1→Yes, 2→Assertion or testimony  
    - **Lottery (large/small)**: Outright belief in individual losses is permissible (e.g., for 1000 tickets, believe "ticket 1 loses"; for 5, believe "ticket 1 loses"), but asserting it is improper due to risk of error.  
    - **Preface (large/small)**: Outright belief in claims is permissible (e.g., for 1000 pages, believe "claim 1 is true"; for 5 sentences, believe "sentence 1 is true"), but asserting them without qualification violates testimony norms.  
    - **Distinguishing case from A**: A professor who believes a lottery ticket will lose but refuses to testify to it in court.  
    - **Most awkward commitment**: Belief and assertion come apart radically, making belief "inert" in social contexts.  

  - **Leaf C: Certainty Only (Position vii)**  
    Sequence: 1→Yes, 2→Belief, 3→Yes, 5→Yes  
    - **Lottery (large/small)**: No belief in any individual loss (e.g., for 1000 tickets, no belief "ticket 1 loses"; for 5 tickets, no belief "ticket 1 loses"). Only the disjunction "one ticket wins" is acceptable.  
    - **Preface (large/small)**: No belief in any claim (e.g., for 1000 pages, no belief "claim 1 is true"; for 5 sentences, no belief "sentence 1 is true"). Only the disjunction "at least one claim is false" (from the preface) is acceptable.  
    - **Distinguishing case from F1/F2**: A small lottery with 2 tickets, where credence 0.5 is too low for belief, unlike threshold views.  
    - **Most awkward commitment**: Precludes belief in almost all empirical propositions (e.g., "the sun will rise tomorrow").  

  - **Leaf I: Preface Different (Position ix)**  
    Sequence: 1→Yes, 2→Belief, 3→No, 4→No  
    - **Lottery (large/small)**: Belief in individual losses is improper (e.g., for 1000 tickets, no belief "ticket 1 loses"; for 5 tickets, no belief "ticket 1 loses").  
    - **Preface (large/small)**: Belief in individual claims is proper (e.g., for 1000 pages, believe "claim 1 is true"; for 5 sentences, believe "sentence 1 is true").  
    - **Distinguishing case from G1/G2/G3**: A book with one highly verified claim vs. a lottery with one "rigged" ticket; the latter still resists belief.  
    - **Most awkward commitment**: Arbitrarily treats identical probabilistic structures differently (lottery vs. preface).  

  - **Leaf H1: Contextual Threshold with Inconsistency (Position vi variant)**  
    Sequence: 1→Yes, 2→Belief, 3→Yes, 5→No, 6→Yes, 9→No  
    - **Lottery (large/small)**: Belief in each individual loss (e.g., for 1000 tickets, believe "ticket 1 loses"; for 5, believe "ticket 1 loses"), and inconsistency is rational.  
    - **Preface (large/small)**: Belief in each claim (e.g., for 1000 pages, believe "claim 1 is true"; for 5 sentences, believe "sentence 1 is true"), and inconsistency is rational.  
    - **Distinguishing case from H2/H3**: A high-stakes context (e.g., medical diagnosis) where inconsistency is tolerated more than in low-stakes.  
    - **Most awkward commitment**: Rational agents can knowingly hold inconsistent beliefs without revision.  

  - **Leaf F1: Contextual Threshold with Skepticism (Position v variant)**  
    Sequence: 1→Yes, 2→Belief, 3→Yes, 5→No, 6→Yes, 9→Yes, 11→Yes  
    - **Lottery (large/small)**: No belief in any individual loss (e.g., for 1000 tickets, no belief "ticket 1 loses"; for 5 tickets, no belief "ticket 1 loses" if context demands high thresholds).  
    - **Preface (large/small)**: No belief in any claim (e.g., for 1000 pages, no belief "claim 1 is true" in high-stakes contexts; for 5 sentences, belief may occur in low-stakes contexts).  
    - **Distinguishing case from G1**: A small lottery with high stakes (e.g., a life-or-death gamble) where belief is withheld.  
    - **Most awkward commitment**: In low-stakes contexts, agents might still withhold belief due to general risk-aversion.  

  - **Leaf G1: Contextual Threshold with Non-Closure (Position iii and iv variant)**  
    Sequence: 1→Yes, 2→Belief, 3→Yes, 5→No, 6→Yes, 9→Yes, 11→No  
    - **Lottery (large/small)**: Belief in each individual loss (e.g., for 1000 tickets, believe "ticket 1 loses"; for 5 tickets, believe "ticket 1 loses"), but not in the conjunction, with thresholds varying by context (e.g., higher in small high-stakes lotteries).  
    - **Preface (large/small)**: Belief in each claim (e.g., for 1000 pages, believe "claim 1 is true"; for 5 sentences, believe "sentence 1 is true" only in low-stakes), but not in the conjunction.  
    - **Distinguishing case from F1**: A large lottery with low stakes (e.g., office raffle) where belief in individual losses is accepted.  
    - **Most awkward commitment**: Closure fails arbitrarily; agents cannot "add up" beliefs in reasoning.  

  - **Leaf H2: Fixed Threshold with Inconsistency (Position vi variant; unattractive)**  
    Sequence: 1→Yes, 2→Belief, 3→Yes, 5→No, 6→No, 10→No  
    - **Lottery (large/small)**: Belief in each individual loss (e.g., for 1000 tickets, believe "ticket 1 loses"; for 5 tickets, believe "ticket 1 loses"), and inconsistency is rational under a fixed threshold.  
    - **Preface (large/small)**: Belief in each claim (e.g., for 1000 pages, believe "claim 1 is true"; for 5 sentences, believe "sentence 1 is true"), and inconsistency is rational.  
    - **Distinguishing case from H1**: Consistency varies with context in H1, but not here.  
    - **Most awkward commitment**: Inconsistency is required even when avoidable (e.g., in small lotteries). *Marked unattractive: Rarely defended, as fixed thresholds usually aim for consistency.*  

  - **Leaf F2: Fixed Threshold with Skepticism (Position v)**  
    Sequence: 1→Yes, 2→Belief, 3→Yes, 5→No, 6→No, 10→Yes, 12→Yes  
    - **Lottery (large/small)**: No belief in any individual loss (e.g., for 1000 tickets, no belief "ticket 1 loses"; for 5 tickets, no belief "ticket 1 loses" if threshold is high, e.g., 0.99).  
    - **Preface (large/small)**: No belief in any claim (e.g., for 1000 pages, no belief "claim 1 is true"; for 5 sentences, belief if threshold is low, e.g., 0.8).  
    - **Distinguishing case from G2**: A small lottery with a fixed high threshold (e.g., 5 tickets, p=0.8 loss) where belief is still withheld.  
    - **Most awkward commitment**: Withholds belief in highly probable propositions (e.g., "this 5-ticket lottery loser") counterintuitively.  

  - **Leaf G2: Fixed Threshold with Non-Closure (Position ii and iv)**  
    Sequence: 1→Yes, 2→Belief, 3→Yes, 5→No, 6→No, 10→Yes, 12→No  
    - **Lottery (large/small)**: Belief in each individual loss (e.g., for 1000 tickets, believe "ticket 1 loses" if p>threshold; for 5 tickets, believe "ticket 1 loses" if p>threshold), but not in the conjunction.  
    - **Preface (large/small)**: Belief in each claim (e.g., for 1000 pages, believe "claim 1 is true" if p>threshold; for 5 sentences, believe "sentence 1 is true" if p>threshold), but not in the conjunction.  
    - **Distinguishing case from F2**: A small lottery with low threshold (e.g., p>0.8) where belief in individual losses is accepted.  
    - **Most awkward commitment**: Agents cannot deduce obvious consequences (e.g., "all tickets lose" from individual beliefs).  

  - **Leaf H3: Non-Threshold with Inconsistency (Position vi)**  
    Sequence: 1→Yes, 2→Belief, 3→No, 4→Yes, 8→No  
    - **Lottery (large/small)**: Belief in each individual loss (e.g., for 1000 tickets, believe "ticket 1 loses"; for 5 tickets, believe "ticket 1 loses"), and inconsistency is rational.  
    - **Preface (large/small)**: Belief in each claim (e.g., for 1000 pages, believe "claim 1 is true"; for 5 sentences, believe "sentence 1 is true"), and inconsistency is rational.  
    - **Distinguishing case from H1/H2**: Acceptance is based on non-probabilistic roles (e.g., "usable in reasoning"), not thresholds.  
    - **Most awkward commitment**: Rational agents must embrace inconsistency as unavoidable.  

  - **Leaf F3: Non-Threshold with Skepticism (Position v variant; unoccupied)**  
    Sequence: 1→Yes, 2→Belief, 3→No, 4→Yes, 8→Yes, 13→Yes  
    - **Lottery (large/small)**: No belief in any individual loss (e.g., for 1000 tickets, no belief "ticket 1 loses"; for 5 tickets, no belief "ticket 1 loses").  
    - **Preface (large/small)**: No belief in any claim (e.g., for 1000 pages, no belief "claim 1 is true"; for 5 sentences, no belief "sentence 1 is true").  
    - **Distinguishing case from F1/F2**: Rejects thresholds but still withholds belief without probabilistic grounds.  
    - **Most awkward commitment**: No clear criterion for belief without thresholds or inconsistency. *Marked unoccupied: Incoherent, as non-threshold views typically allow belief in individual propositions.*  

  - **Leaf G3: Non-Threshold with Non-Closure (Position iv)**  
    Sequence: 1→Yes, 2→Belief, 3→No, 4→Yes, 8→Yes, 13→No  
    - **Lottery (large/small)**: Belief in each individual loss (e.g., for 1000 tickets, believe "ticket 1 loses"; for 5 tickets, believe "ticket 1 loses"), but not in the conjunction, due to acceptance's role (e.g., "premises for local reasoning").  
    - **Preface (large/small)**: Belief in each claim (e.g., for 1000 pages, believe "claim 1 is true"; for 5 sentences, believe "sentence 1 is true"), but not in the conjunction.  
    - **Distinguishing case from G1/G2**: Acceptance is based on functional role (e.g., "usable as a premise"), not credence thresholds.  
    - **Most awkward commitment**: Global reasoning (e.g., book-length arguments) becomes impossible without closure.  

  #### Key Observations
  - **Tree distinguishes fixed vs. contextual thresholds**: Yes, via Node 6 (threshold variability), leading to separate leaves (e.g., G2 vs. G1).  
  - **Tree distinguishes threshold vs. non-threshold accounts**: Yes, via Node 3 (threshold governance), leading to separate leaves (e.g., G2 vs. G3).  
  - **Unoccupied branches**: F3 (incoherent; non-threshold skepticism lacks motivation). H2 and H1 are marked unattractive but occupied in principle.  
  - **Most pivotal question**: **Node 1 (existence of outright acceptance)** moves students furthest. A "no" answer dissolves the paradox (Leaf A), while a "yes" opens all other branches, forcing engagement with belief's structure, governance, and logical properties. This question defines the deepest divide: between eliminativism about belief and all other responses.
