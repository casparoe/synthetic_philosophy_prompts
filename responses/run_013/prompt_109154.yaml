  I should emphasize which points are settled (Black's case as major objection) vs contested (whether quantum statistics save PII). The user wants clarity on consensus vs debate, so I'll separate these clearly. They also requested concrete cases independent of property theories - the isolated spheres best fit this, though some may still dispute "qualitative".

