prompt: |-
  You are a philosopher of mind and an animal ethicist, and I want you to think carefully before you answer: begin by brainstorming the scenes in the work that bear on the question, and only then commit to a reading.

  I am a retired entomologist who has drifted into philosophy, and I have been asked to lead a discussion of Charlotte's Web at a book club that has just read its way through the literature on insect sentience. The argument that grips me is the scale argument: even if the probability that any particular insect is sentient is very small, the numbers are so vast that the expected quantity of suffering may still be enormous, and we are wrong to let the low probability settle the matter. Read the novel through that argument. Charlotte is the book's moral centre and its one genuine moral agent, and she kills and eats flies — to Wilbur's evident horror — while telling him she cannot help what she is; Wilbur, the animal we are made to care about, is saved by words written in a web; and Charlotte dies, leaving her egg sac behind. Which scenes should I put in front of the group, and what does the book show about moral attention, and about the ethics of predation, that the argument — working as it does with anonymous multitudes and probabilities — cannot? My own hypothesis, possibly too neat, is that the web-writing is the novel's theory of moral attention: a life is saved by being made legible as an individual. Tell me where that reading fails, which scene or which consideration about the scale argument would change your mind, and where your reasoning is most likely to be wrong. There is no need to quote from the book; I have no copy at hand.
