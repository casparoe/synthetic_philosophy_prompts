  The audience includes a Popperian, a Bayesian, a historian of science, and two working scientists. Each will have specific objections. I need to anticipate these objections in the order they're likely to come, assess their damage level, provide replies, and note weaknesses.

  First, the Popperian will defend sophisticated falsificationism. They'll cite Lakatos, arguing that research programs have protective belts and hard cores. This is a strong objection because it addresses the core argument. My reply should acknowledge Lakatos but point out that pseudoscience also uses these structures. The weakness is that this doesn't fully counter how pseudoscience mimics these tactics.

  Next, the Bayesian will see demarcation as unnecessary. They'll argue science is about probability updates. This is tricky because it shifts the debate to Bayesian terms. The reply should agree on probabilities but stress the need for non-formal norms. The weakness is that Bayesianism already handles pseudoscience with priors, so the exposure norm might seem redundant.

  The historian will say falsification isn't how science works, referencing Kuhn and Lakatos. This is less damaging since it agrees with the thesis but points out it's not new. The reply should align with them but argue that falsificationism's cultural impact persists. The weakness is conceding the thesis isn't original.

  The working scientists care about teaching undergrads. They'll ask for practical alternatives to falsifiability. This is moderate damage because the exposure norm is abstract. The reply should suggest concrete examples like pre-registration. The weakness is the vagueness of the norm.

  The hardest question unasked might be how exposure differs from existing norms like peer review or if it's enforceable. This challenges the practicality and novelty of the proposal.

  I need to structure the prep sheet with each objection in expected order, damage assessment, reply, and weakness. Ensure replies are concise, acknowledge valid points, and redirect to the thesis. Highlight that the deeper aim is challenging the rationalist fantasy of a demarcation algorithm.
answer: |-
  Here’s your Q&A prep sheet, structured by predicted question order, damage level (★ to ★★★★★), speaker archetypes, replies, and honest weaknesses. The order reflects escalating tactical difficulty, with the most damaging objections saved for last.

  ---

  ### **Q&A Prep Sheet: "The Failure of Falsificationism as Demarcation"**  
  **Core Thesis**: Falsifiability selects for *skill in appearing falsifiable* (which pseudoscience excels at) over genuine epistemic risk. Replace it with an "exposure norm" applied holistically to research programmes.  

  ---

  ### **1. The Historian of Science (Kuhn/Lakatos Fan)**  
  **Objection**: "This is reheated soup. Kuhn and Lakatos settled this decades ago: *no* science falsifies theories in isolation. We adjust auxiliaries, shift paradigms, or let research programmes degenerate. Your ‘embarrassing failure’ is just Popper’s naïveté—which *sophisticated* falsificationism already fixed. Why are you punching a ghost?"  
  **Damage**: ★★☆☆☆ (Agrees with your critique but thinks it’s unoriginal)  
  **Reply**: "Absolutely—Kuhn and Lakatos dismantled Popper’s *mechanism*. But my target is falsificationism’s *cultural* role as a *demarcation tool*. Scientists, grant panels, and educators still invoke it to exclude ‘pseudoscience’ (e.g., ‘string theory is unfalsifiable!’), unaware that the ‘pseudos’ they target (astrology, Freudianism) *are* masters of Lakatosian manoeuvres. The failure isn’t philosophical—it’s practical: falsificationism *empowers* the very actors it’s meant to exclude."  
  **Weakness**: Concedes your thesis isn’t novel philosophically; hinges on "cultural role" being substantive.  

  ---

  ### **2. The Working Scientist (Undergraduate-Focused)**  
  **Objection**: "I teach freshmen who can’t distinguish astrology from astronomy. If I ditch falsifiability, what’s my litmus test? Your ‘exposure norm’ sounds fuzzy. How do I operationalize ‘treating claims as at hazard’ in a syllabus?"  
  **Damage**: ★★★☆☆ (Forces you to defend practicality, not philosophy)  
  **Reply**: "Fair! In practice:  
  - Teach students to spot *immunization tactics* (e.g., creationists redefining ‘kinds’ after fossil gaps appear).  
  - Contrast how string theorists *acknowledge* their untestability vs. astrologers who *retrofit* excuses.  
  - Highlight programmes *actively seeking disconfirmation* (e.g., LIGO’s gravity-wave bets vs. Freudian post-hoc dream analysis).  
  Falsifiability is a bad *rule*—but its intuition (risk matters) can be kept by focusing on *behaviour*, not single claims."  
  **Weakness**: "Exposure norm" remains vague; risks sounding like "good scientific manners."  

  ---

  ### **3. The Popperian (Lakatos-Citing Sophisticate)**  
  **Objection**: "You’re tilting at naïve falsificationism! Sophisticated falsificationism *embraces* auxiliary belts and programme-level assessment. Lakatos showed pseudoscience *degenerates* (e.g., adding epicycles to astrology) while science *progresses* (e.g., Mercury’s orbit puzzling Einstein). Your ‘exposure norm’ is just Lakatos in a cheap tuxedo!"  
  **Damage**: ★★★★☆ (Directly attacks your core argument; equates your solution with existing fixes)  
  **Reply**: "Lakatos improves on Popper, yes—but his ‘progressive/degenerating’ distinction *still* doesn’t demarcate. Astrology *is* ‘progressive’ by his metrics: it ‘predicts’ personality traits, then ‘novelly explains’ failures (e.g., ‘you’re a Capricorn, but Saturn was in retrograde!’). Meanwhile, cosmology’s dark matter searches look ‘degenerate’ until they succeed. Falsificationism—even sophisticated—rewards *rhetorical* progress. The ‘exposure norm’ differs by demanding *proactive* vulnerability: e.g., pre-registering predictions or welcoming adversarial scrutiny."  
  **Weakness**: Hard to prove astrology is "progressive" under Lakatos without cherry-picking; your norm overlaps with Lakatos.  

  ---

  ### **4. The Bayesian (Demarcation Skeptic)**  
  **Objection**: "Why bother with demarcation? Science is just Bayesian updating. Falsification is irrelevant: when P(evidence|theory) ≈ 0, we lower P(theory). Pseudoscience has low priors, not ‘unfalsifiability.’ Your ‘exposure norm’ is a virtue ethic in a probabilist world—cute, but unnecessary."  
  **Damage**: ★★★★☆ (Undermines your entire project; suggests demarcation is obsolete)  
  **Reply**: "Bayesianism is a *description* of belief revision, not a *prescription* for institutional norms. Pseudoscience *thrives* by gaming likelihoods (e.g., ‘P(divorce|Venus square Mars) = 0.6!’). Meanwhile, high-energy physics *can’t* assign likelihoods to string theory—yet we protect it institutionally. The ‘exposure norm’ isn’t about belief—it’s about structuring *communities* to incentivize risk-taking. Probability can’t tell us how to allocate telescope time or grant money."  
  **Weakness**: Bayesians can counter that priors reflect institutional trust (e.g., "string theory has high prior due to track record").  

  ---

  ### **The Killer Question (You Hope Nobody Asks)**  
  **Objection**: "If your ‘exposure norm’ isn’t a criterion but a *cultural attitude*, how is it any less arbitrary or enforceable than falsificationism? Isn’t this just replacing Popper’s algorithm with a vibe check?"  
  **Damage**: ★★★★★ (Exposes the tension in your thesis: rejecting algorithms while offering a norm)  
  **Reply**: "It *is* arbitrary—and that’s the point. Demarcation isn’t a puzzle for philosophers to ‘solve’ with criteria; it’s a *social practice* we negotiate. The exposure norm shifts focus from ‘is this pseudoscience?’ (a certification fantasy) to ‘is this community *behaving* as if truth could hurt them?’. Yes, it’s messy—but so is science. The alternative is fetishizing a falsifiability rule that the cleverest charlatans ace."  
  **Weakness**: Admits your proposal is sociological, not epistemological; may disappoint those wanting a "rule."  

  ---

  ### **Strategic Summary**  
  - **First 15 mins**: Let the Historian and Working Scientist tee up your critique (low threat).  
  - **Mid-Session**: Use the Popperian’s objection to clarify why Lakatos *doesn’t* save falsificationism.  
  - **Late Game**: Leverage the Bayesian to pivot from "demarcation" to "norms for communities."  
  - **If Killer Question Hits**: Embrace the "vibe check" charge—argue demarcation *is* inherently cultural.  

  **Key Weakness Overall**: Your "exposure norm" risks being perceived as either too vague (for scientists) or too sociological (for philosophers). Preempt this by stressing concrete examples (e.g., "Compare how SETI vs. UFOlogy handle null results").
