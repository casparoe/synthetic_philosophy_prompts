prompt: |-
  Next week I'm teaching folk psychology and eliminative materialism, and I keep bumping into the same move: a colleague of mine, who's done real work on the Churchlands, tells the students that belief and desire stand to cognitive science as phlogiston stood to chemistry — the central posit of a degenerating theory that will be eliminated, not reduced. The students love it, and it hands them the conclusion (no beliefs) for free in about four sentances. I want a proper audit of the analogy instead of the four-sentence version. Give me the correspondence table first — what plays phlogiston, what plays the combustion and calcination data, what plays the rival research programme, what plays oxygen — then tell me where the mapping breaks, which features of the phlogiston case the analogy quietly imports that folk psychology doesn't have (go into how that transition actually went, not just that phlogiston turned out not to exist), and whether elimination rather than reduction really survives once the disanalogies are on the table. If some other analogy carries the weight better, say what it is. Keep it compact, I've got a lecture to give. Finish with a last line starting "Verdict:" giving me exactly one of {carries, fails, carries only the weaker claim} plus a one-sentence reason.
reasoning: |-
