  Below is a decision tree for the demandingness objection to consequentialism, structured as a logical pathway. Each node is a question with concrete cases, phrased to be answerable without prior knowledge of the positions. The root question addresses the **target of the complaint**, and subsequent nodes isolate key distinctions (e.g., type of cost, compliance of others, or nature of sacrifice). Leaves represent specific positions, including all requested views. The tree uses British English and flags unresolved pairs/unoccupied combinations.  

  ---

  ### **Demandingness Objection to Consequentialism: A Decision Tree**  
  **Root Question**: What aspect of consequentialism does the objection primarily target?  
  1. **The criterion of rightness** (what *makes* an act right/wrong)?  
     → Proceed to Q1A.  
  2. **The decision procedure** (what a conscientious agent *should use* to decide)?  
     → Proceed to Q1B.  
  3. **The overridingness of moral reasons** (must moral reasons *always trump* non-moral ones)?  
     → **Leaf**: Consequentialism is too demanding, so morality is *not overriding* (non-moral reasons can permissibly prevail).  

  ---

  #### **Branch A: Objection Targets the Criterion of Rightness**  
  **Q1A**: Does the objection’s force depend on **others’ failure to comply**?  
  - *Case: You could contribute £5 to a collective rescue (e.g., saving a child from drowning), but your marginal impact is tiny because others aren’t helping.*  
    - **Yes** → **Leaf**: **Collective consequentialism** (what you must do is *relaxed* because others aren’t doing their share; e.g., Murphy).  
    - **No** → Proceed to Q2A.  

  **Q2A**: Is the core problem a **single extreme sacrifice** or an **ongoing demand**?  
  - *Case: Ruinous one-off cost (donating a kidney) vs. ongoing small costs (donating 10% of income for life when more good could always be done).*  
    - **Single extreme sacrifice** → Proceed to Q3A.  
    - **Ongoing demand** → Proceed to Q4A.  

  **Q3A**: Would fulfilling the demand **undermine a central relationship or project**?  
  - *Case: Moving to a war zone to aid refugees, but this would end your marriage.*  
    - **Yes** → **Leaf**: **Agent-centred prerogative** (agents may weight their own projects/heavily; e.g., Scheffler).  
    - **No** → **Leaf**: **Maximising act-consequentialism** that *accepts* the demands (no adjustment; e.g., Singer).  

  **Q4A**: Is the agent **already badly off** relative to others?  
  - *Case: A subsistence farmer asked to donate food when they have little.*  
    - **Yes** → **Leaf**: **Satisficing consequentialism** (right action requires only "good enough" results, not maximising; e.g., Slote).  
    - **No** → Proceed to Q5A.  

  **Q5A**: Should consequentialism abandon **"ought" altogether**?  
  - *Case: Giving £100 to charity is better than £10, but is either obligatory?*  
    - **Yes** → **Leaf**: **Scalar consequentialism** (only ranks actions as better/worse; no "ought"; e.g., Norcross).  
    - **No** → **Leaf**: **Maximising act-consequentialism** that *accepts* the demands.  

  ---

  #### **Branch B: Objection Targets the Decision Procedure**  
  **Q1B**: Does the objection arise from **costs to the agent’s standing or relationships**?  
  - *Case: If you constantly calculate consequences, friends might see you as cold or untrustworthy.*  
    - **Yes** → **Leaf**: **Agent-centred prerogative** (adjusts decision-making to protect relationships; e.g., Scheffler).  
    - **No** → Proceed to Q2B.  

  **Q2B**: Is the intuition of demandingness a **reliable moral insight**?  
  - *Case: You feel donating 50% of your income is "too much," but this clashes with impartial cost-benefit analysis.*  
    - **Yes** → **Leaf**: **Satisficing consequentialism** (decision procedure aims for "good enough," not optimal).  
    - **No** → **Leaf**: Treats the intuition as a **bias to debunk** (e.g., proximity bias; demands remain; e.g., Unger).  

  ---

  ### **Notes on the Tree**  
  - **Unresolved Pairs**: The tree cannot separate:  
    - **Scalar consequentialism** and **satisficing** when applied to an agent who is *not* badly off but faces ongoing demands (Q5A vs. Q4A). Both reject maximising but differ structurally.  
  - **Unoccupied Combinations**:  
    - **Objection depends on others + ongoing demand + agent badly off** (Q1A→Yes → Q2A→Ongoing → Q4A→Yes). Unoccupied as it is *unexplored*—no major theory combines these.  
    - **Decision procedure + overridingness challenge** (Branch B → Branch 3). Unoccupied as *incoherent*: overridingness concerns reasons, not decision procedures.  
  - **Key Concrete Cases Used**: Marginal contribution (£5 rescue), single ruinous vs. ongoing costs (kidney vs. 10% income), relationship cost (moving abroad), and relative disadvantage (subsistence farmer).  

  ---  
  This tree isolates logical pathways to 7+ positions, using case-based nodes to guide reasoning. For seminar use, encourage students to "walk" the tree with examples (e.g., effective altruism cases) to test coherence.
