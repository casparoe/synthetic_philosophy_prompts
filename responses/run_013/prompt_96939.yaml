answer: |-
  The Society for Psychical Research's (SPR) investigative program, with Sidgwick at its helm, presupposes a specific but layered philosophical framework concerning epistemology, metaphysics, and the relationship between ethics and empirical reality. Reconstructing this involves distinguishing core presuppositions from compatible positions and identifying areas of underdetermination.

  Strictly, the SPR practice presupposes **methodological naturalism applied to anomalous phenomena.** It treats reports of telepathy, apparitions, and mediumship as *empirical data* susceptible to collection, classification, and critical assessment using norms analogous to the natural sciences (e.g., careful witness testimony, controlled experiments where possible, statistical analysis, ruling out fraud and normal explanations). This commits to the principle that these phenomena, however extraordinary, are *in principle* investigable by empirical means and that evidence for or against them can be gathered and weighed without necessarily presupposing a specific ontology of mind or soul. Survival is approached *as if* it were a testable empirical hypothesis about the persistence of consciousness or personal identity beyond bodily death, even if its ultimate nature remains metaphysically open. This does *not* strictly presuppose a Cartesian "substance" view of the self, though it is compatible with it. The evidence sought (e.g., veridical communications from the dead through mediums) could, in theory, be interpreted within alternative frameworks (e.g., a stream of consciousness preserving identity, or even impersonal psychic residues), making the practice underdetermined regarding the specific metaphysics of the self. The core presupposition is that *if* personal survival occurs, it *should* leave empirically detectable traces accessible to impartial inquiry.

  Regarding ethics, the practice does *not* strictly presuppose that moral philosophy *needs* external metaphysical support. Sidgwick's personal motivation, however, reveals a deeper fit. His despair over the unresolved "dualism of practical reason" (the conflict between rational egoism and utilitarianism) and his loss of orthodox religious belief created a profound need for reassurance about the moral governance of the universe. The SPR research program embodies his *hope* that empirical evidence of survival (and potentially communication from benevolent higher intelligences) could provide rational grounds for believing in a cosmos where self-interest and duty ultimately coincide, thereby resolving the dualism through revealed teleology. While the *practice* of investigating phenomena potentially relevant to survival and cosmic purpose doesn't *logically require* this ethical motivation, it is perfectly tailored to Sidgwick's specific philosophical anguish. The practice *is* compatible with a more modest view where psychical research is merely a domain for applying the "ethics of belief" (requiring proportioning belief to evidence, à la Clifford), its results potentially irrelevant to core ethical principles. Sidgwick, however, clearly intended the potential ethical bearing as a primary justification for the effort.

  The practice is philosophically underdetermined in several key ways. Firstly, as noted, regarding the *nature* of the surviving entity (substance, process, impersonal record). Secondly, regarding the *necessity* of the link to ethics: one could rigorously investigate these phenomena purely out of scientific curiosity about the limits of mind or unexplained natural occurrences, without any expectation of ethical implications. Thirdly, regarding the *type* of evidence required: while the SPR emphasized strict standards, a different, less stringent conception of empirical evidence could theoretically license a similar investigative focus, though likely compromising its claim to scientific parity.

  Changing the underlying presuppositions would significantly alter the project. If survival were treated as a *purely religious hope* rather than an empirical question, the entire SPR endeavor loses its *raison d'être*. Its meticulous evidence-gathering and critical analysis become irrelevant to a faith-based position. The practice collapses without the core presupposition of empirical investigability. If the dualism of practical reason were taken as *permanent and unremediable by any conceivable evidence*, the driving force behind Sidgwick's personal commitment vanishes. His ethical project in *Methods* would stand as a tragic but unresolvable tension within practical reason itself. Psychical research might still proceed as a scientific investigation of anomalies (under the modest "ethics of belief" view), but it would lose its profound significance as a potential source of ethical resolution. Sidgwick would have no rational *hope* that empirical findings could alleviate his deepest philosophical despair. Furthermore, replacing the SPR's strict investigative norms with looser standards (e.g., accepting anecdote uncritically) would undermine its foundational claim to scientific legitimacy, aligning it more with popular spiritualism than disinterested inquiry and stripping away its unique philosophical appeal to Sidgwick, which relied on the rigor matching natural science. The practice, therefore, hinges critically on its empirical framing and, for Sidgwick personally, on the hope that this empirical path might lead to ethical solace otherwise unattainable by reason alone.
