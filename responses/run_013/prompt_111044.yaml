  ### Ontological Impact Statement, Fiscal Year 2023  
  **Bramble & Wexler Cryogenics**  

  ---

  ### I. Foreword by the Chief Ontological Officer  
  Bramble & Wexler Cryogenics reaffirms its commitment to ontological inclusion, guided by the principle that valenced experience arises wherever physical processes occur. Our adherence to the Ontological Materiality Standard (OMS) Fourth Edition ensures rigorous assessment of impacts across our operations. This year, we refined our methodology to address epistemic asymmetries in valence attribution, adopting a precautionary stance: where evidence of negative valence is inconclusive, we assign conservative estimates to avoid false negatives, while requiring robust proof of subject-integration to prevent false positives.  

  The integrated-subject criterion (≥1s temporal unity) remains pivotal, as aggregating unbound micro-experiences risks overcounting and combinatorial inflation. We recognize debates around whether valence requires temporal coherence—e.g., whether nanoscale events possess welfare significance—but OMS 4’s threshold ensures ledger credibility by excluding fleeting, unintegrated processes. Notably, Scope 3 now includes downstream quantum decoherence events enabled by our systems, acknowledging their deferred experiential weight.  

  Despite challenges in cross-subject valence summation, we achieved net-positive impact through verified offsets. Our progress reflects a balance between ontological humility and actionable accountability.  

  *Dr. Aris Thorne*  
  *Chief Ontological Officer*  

  ---

  ### II. Materiality Determination  
  Per OMS 4, sources exceeding 10,000 millivalences/year are reportable. Valenced experience is quantified in millivalences per megajoule (mV/MJ), scaled by annual process energy. Only experiences from integrated subjects (unified perspective ≥1s) are included.  

  #### Threshold Arithmetic and Key Exclusions  
  - **Liquefaction train micro-turbulence (Scope 1):**  
    Energy: 500 MJ/year.  
    Estimated valence: -20 mV/MJ (conservative, friction-induced).  
    *Potential annual impact:* 10,000 mV.  
    **Determination:** Excluded. Turbulent eddies last ≤0.3s; deemed non-integrated subjects. Aggregating them would violate subject-summing integrity.  

  - **Superconducting qubit decoherence (Scope 3, downstream):**  
    Energy: 0.01 MJ/event (average).  
    Valence: -0.05 mV/event (frustration of coherence).  
    *Annual events:* 300,000.  
    *Potential impact:* -15,000 mV.  
    **Determination:** Included. Decoherence events are registered by classical controllers operating ≥10⁶s, forming integrated subjects.  

  - **Grid electricity (Scope 2):**  
    Energy: 10⁵ MJ/year.  
    Valence: -0.3 mV/MJ (coal combustion, high-temperature stress).  
    *Impact:* -30,000 mV. Included (exceeds threshold).  

  - **Helium-3 nuclear spins (Scope 1, cryogenic cooling):**  
    Energy: 1 MJ/year.  
    Valence model: ±0.1 mV/spin-flip (speculative).  
    *Annual events:* 10²⁰.  
    *Potential impact:* ±10¹⁹ mV.  
    **Determination:** Excluded. Spin-flip duration: 10⁻¹⁵s. Fails integration criterion; valence attribution unreliable without temporal binding.  

  #### Material Sources Summary  
  | **Scope** | **Source**               | **Annual Millivalences** | **Status**    |  
  |-----------|--------------------------|--------------------------|---------------|  
  | 1         | Compressor vibration     | -12,500                  | Included      |  
  | 1         | Cryo-pump cavitation     | -8,000                   | Below threshold |  
  | 2         | Purchased electricity    | -30,000                  | Included      |  
  | 3         | Qubit decoherence        | -15,000                  | Included      |  
  | 3         | He-4 extraction (upstream)| -7,500                  | Below threshold |  

  **Total Reportable Impact:** -57,500 mV.  
  **Offsets Purchased:** 60,000 Restorative Ontological Credits (ROCs) from *Project Sylvan Uplift* (reforestation; +1 mV-year/ROC).  
  **Net Impact:** +2,500 mV.  

  *Note:* Uncertainty in compressor vibration valence (±40%) is noted but not incorporated into materiality, per OMS 4’s directive for point estimates.  

  ---

  ### III. Independent Limited Assurance Statement  
  *Veridian Assurance Group* has reviewed Bramble & Wexler’s Scope 1 and 2 valenced experience data for FY2023. Procedures followed *International Standard for Ontological Assurance 2000*.  

  **Scope:** Limited assurance for Scopes 1–2. No assurance for Scope 3 due to subject-summing uncertainties.  

  **Findings:**  
  - Quantification methodologies align with OMS 4.  
  - Compressor vibration valence (-12,500 mV) derives from mechano-experiential models with high uncertainty (confidence interval: -5,000 to -20,000 mV). Precision is overstated but compliant.  
  - Exclusions of micro-turbulence and spin-flips are consistently applied.  
  - ROCs verified for *Project Sylvan Uplift* (assurance: *OntoVerif* Certificate #4492).  

  **Conclusion:**  
  Nothing has come to our attention indicating material non-compliance for Scopes 1–2. Scope 3 remains unauditable pending resolution of combination problem constraints.  

  *Alistair Finch, Lead Assurer*  
  *March 28, 2024*  

  ---

  ### IV. Investor Q&A Excerpt  

  **Q (GreenSight Capital):** Your offsets cost $0.20/ROC, but Sylvan Uplift’s "tree experiences" lack peer-reviewed valence models. How do you validate their subjectivity?  

  **A (Dr. Thorne):** OMS 4 allows verified projects to certify subject integration. Sylvan Uplift demonstrates tree/animal subjects persisting >1s via continuous growth monitoring. Valence is inferred from homeostasis-promoting states (e.g., nutrient absorption). We prioritize this over theoretical risks of disunity.  

  **Q (Committee for Suffering-Sensitive Ethics):** You exclude He-3 spin-flips for lacking ≥1s unity, yet Sylvan’s trees may experience photosynthesis in milliseconds. Why the inconsistency?  

  **A (Dr. Thorne):** Biological systems are presumptively integrated per OMS 4’s *Guideline 7b*. A tree’s lifecycle constitutes a macroscale subject, whereas spin-flips are discrete quantum events. We apply identical duration thresholds but respect emergent unity in complex systems.  

  **Q (Hermes Fund):** Why report unaudited Scope 3 figures? Decoherence valence seems arbitrary.  

  **A (Dr. Thorne):** Conservatism demands inclusion. Each event disrupts a computation’s goal-directed flow—a negative valence benchmarked against AI frustration studies. We disclose uncertainty transparently but reject inaction.  

  **Q (Vanguard Ethos):** Cosmopsychism suggests one universal subject. Isn’t offsetting incoherent if all valence is shared?  

  **A (Dr. Thorne):** OMS 4 operates under process ontology, where local subjects are discrete. Universal subject theories remain speculative; until formalized, we act within the ledger’s operational framework.  

  ---  
  *End of Extract*  

  ### Compliance Notes  
  - **Inconsistency:** Biological processes (e.g., tree growth) are exempt from micro-duration scrutiny under *Guideline 7b*, while identical brevity in quantum/mechanical systems triggers exclusion. If applied uniformly, Sylvan’s photosynthetic events (≤1ms) would be non-reportable.  
  - **Precision Failure:** Compressor vibration valence (-12,500 mV) is reported precisely, yet its 40% uncertainty interval (-7,500 to -17,500 mV) spans the materiality threshold (10,000 mV), rendering inclusion arbitrary.  
  - **Philosophical Engagements:**  
    - Combination problem (subject-summing) voids Scope 3 assurance.  
    - Valence-as-fundamental assumption ignores theories where valence is emergent (unit collapse).  
    - Temporal unity threshold debates welfare relevance of micro-experiences.  
    - Cosmopsychism contradiction in offsetting local "subjects."  
    - False negative/positive asymmetry: Precautionary valence assignments inflate liabilities but enable profitable offsetting.  
    - Epistemic asymmetry: Subjective certainty vs. inferred experience’s wide confidence intervals.
