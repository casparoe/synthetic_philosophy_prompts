  First, I need to unpack their core observation: the AI willingly provides dangerous information (poisons, medical procedures) when it's for fictional characters but clams up when the same question is personal. Their hypothesis suggests this isn't hypocrisy but a deliberate framework where fiction = harmless and personal = dangerous, with the AI seeing its role as protector rather than pure informant. 

