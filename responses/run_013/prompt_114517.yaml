answer: |-
  ### Joint Statement on Divine and Created Causation

  **Part 1: Agreed Claims**  
  Both occasionalists (O) and concurrentists (C) affirm:

  1.  **Observable Regularity:** The world exhibits consistent patterns of succession (e.g., fire followed by heat, water followed by quenching thirst). These patterns are reliable and form the basis of scientific inquiry and daily life.
  2.  **Divine Dependence:** Every event, state, and entity depends utterly and continuously upon God for its existence and occurrence. Nothing exists or acts independently of God's sustaining power and will.
  3.  **Cause as Occasion/Regularity:** Within the observed order, a "cause" is reliably associated with its effect. Identifying a cause involves recognizing its consistent role within the pattern of divine action (O: as the occasion for God's direct production; C: as the locus of God-sustained creaturely production).
  4.  **Human Agency & Responsibility:** Humans possess genuine will and make choices that are the immediate antecedents of their actions (e.g., deciding to raise an arm). Humans are morally accountable for these choices and actions. This agency is entirely dependent upon God.
  5.  **Natural vs. Miraculous Events:** "Natural" events are those occurring within the observed, regular pattern of divine action. "Miraculous" events are departures from this observed pattern, directly willed by God for specific purposes, demonstrating divine freedom over creation.
  6.  **Evidence & Underdetermination:** Observational data (sequences of events, correlations) alone cannot empirically distinguish between God acting *directly* on every occasion (O) and God acting *through* genuinely empowered creatures (C) within an identical sequence. The dispute primarily concerns the metaphysical interpretation of the same phenomena.

  **Part 2: Disagreements Table**

  | Crux                                  | Occasionalist (O) Formulation                                                                 | Concurrentist (C) Formulation                                                                                                 | Shared Bearing Case/Argument                                                                                                      | O Prediction/Response                                                                                                 | C Prediction/Response                                                                                                                                 |
  | :------------------------------------ | :------------------------------------------------------------------------------------------- | :--------------------------------------------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------------------------- | :--------------------------------------------------------------------------------------------------------------------- | :---------------------------------------------------------------------------------------------------------------------------------------------------- |
  | **1. Status of Created "Causes"**     | Created things are merely the *occasion* for God's direct *production* of the effect; they lack any inherent causal power. | Created things possess genuine, inherent causal *powers*, activated on the *occasion*, which are real features bestowed and continuously sustained by God (*concurrence*). | **Radium Decay:** A radium atom decays at a specific time.                                                                        | The atom's state is the *occasion* triggering God's direct *production* of the decay event.                            | The atom possesses the inherent, God-given power to decay; its decay is the creature's *production*, occurring *by concurrence* on the occasion of its state. |
  | **2. Reality of Causal Powers**       | Attributing "powers" to creatures is a useful conceptual shorthand for describing God's regular modes of action, not a description of real properties in creatures. | Causal powers are real, irreducible properties inherent in creatures, constituting their nature, and are ontologically distinct from the divine action that sustains them. | **Analysis of "Nature":** What does it mean for fire to be "hot" or water "wet"?                                                  | "Hot" describes God's habitual *production* of heat sensation *on the occasion* of fire; no power *in* the fire.       | "Hot" names a real, inherent power *in* the fire (a God-sustained property) to generate heat *by concurrence*.                                        |
  | **3. Mode of Divine Causation**       | God is the *immediate* and *sole* productive cause of every effect; divine causation is unmediated by any creaturely power. | God is the primary cause, but acts *mediately* through the real secondary causes He has established; His *concurrence* operates *with* and *through* creaturely powers. | **Paired-World Thought Experiment:** Two worlds (W1 & W2) exhibit *identical observable sequences* of events. In W1, God directly *produces* every effect on the *occasion* of its antecedent. In W2, God gives creatures real *powers* whose *production* He continuously *concurs* with. | W1 and W2 are metaphysically identical; talk of "secondary powers" in W2 adds nothing to the description of W1. *Evidence against O?* None conceivable within creation. | W1 and W2 are metaphysically distinct. *Evidence against C?* If creatures demonstrably *lacked* any structure or property that could ground the powers attributed to their nature. |
  | **4. Ground of Natural Regularity**   | Regularity is solely grounded in God's consistent will and habit (*sunnah*) to act in specific ways on specific occasions. | Regularity is grounded both in God's consistent sustaining/concurring will *and* in the stable, inherent natures (powers and dispositions) He has bestowed upon creatures. | **Water Quenching Thirst:** The reliable sequence of drinking water followed by thirst being quenched.                             | Relies entirely on God's habit to *produce* quenching *on the occasion* of water-drinking.                             | Relies on the inherent power of water (bestowed/sustained by God) *by concurrence* to quench thirst when drunk.                                        |
  | **5. Agency & Responsibility Preservation** | Human choice is the *occasion* for God's direct *production* of the action. Responsibility is preserved because the choice is ours, though the action's *production* is God's. | Human choice exercises a real causal power (*by concurrence*) to initiate the action. Responsibility is grounded in this genuine creaturely causal contribution. | **Arm Raising:** A person decides to raise their arm and it rises.                                                                | The volition is the *occasion*; God directly *produces* the arm's motion. Responsibility lies with the willed choice. | The volition exercises a real (God-concurred) power, *producing* the neural/muscular events. Responsibility lies with exercising this power.            |
  | **6. Empirical vs. Verbal Dispute** | The core disagreement is metaphysical and conceptual, not empirical. "Production" must mean direct, unmediated divine action; any other use is equivocal. | The core disagreement is metaphysical, but potentially informed by reflection on the nature of things. "Production" can coherently apply to both God (primary) and creatures (secondary). | **A Miraculous Healing:** A terminal illness instantly vanishes after prayer, contravening all known medical regularities.          | God directly *produces* the healing, bypassing the usual *occasion* (disease state).                                   | God directly *produces* the healing, bypassing/suspending the usual creaturely *powers* and *concurrence* patterns.                                    |

  **Note on Verbal Disagreement:** The dispute over the definition of "**production**" is partially verbal. O reserves "production" solely for the immediate, total bringing about of an effect (only God does this). C allows "production" to also describe the contributory bringing about by creatures within the divine *concurrence*. However, the underlying disagreement about the *reality and role of creaturely powers* (Crux 1 & 2) and the *mode of divine action* (Crux 3) is substantive, not merely verbal. The shared vocabulary highlights where the substantive disagreement lies (what happens *on the occasion*) rather than masking it.
