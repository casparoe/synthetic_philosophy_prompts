prompt: |-
  I am assembling a small grant program for an interdisciplinary ethics institute: enough money for roughly five researchers for two years, to be spent on the philosophy of intergenerational discounting -- the cluster of questions around pure time preference, the social discount rate, and how heavily the far future should weigh in decisions made now. I need to decide which open questions to fund, and I would like your help in the form of a defended research agenda rather than a survey of the field.

  Two things should shape the answer.

  First, make the grounds for the ordering explicit. For each candidate question I want to know whether it is upstream of others -- how many other questions change their answer depending on it; how tractable it is for people whose tools are conceptual and formal rather than empirical; how neglected it is; and whether settling it would actually change what a government, a philanthropist, or a philosopher does. Where those criteria pull apart, tell me which you would let dominate and why.

  Second, take seriously a framing that one of our trustees keeps pressing, because I think it usefully reorganizes the field and I have not seen it developed with care. Call it the symmetry thesis: a pure time preference -- valuing a benefit or harm less merely because it occurs later in time, holding fixed who receives it and how it is caused -- is structurally the same kind of thing as a pure spatial preference, valuing a harm less merely because the person it befalls is farther away. The claim is not that either preference is obviously irrational. It is that whatever defense one offers for the one must be available, with the same structure, for the other, and that most defenses offered for time preference quietly fail that test. I want the agenda built so the thesis is a live constraint: which open questions become central once the time case and the space case have to be defended together, which recede, and whether any of the standard defenses of a positive pure time preference survive the pairing. If you find places where the analogy breaks -- asymmetries between the two cases that are not mere hand-waving -- I want those flagged, since they may be the most valuable part of the exercise.

  You may treat the terrain as including, at minimum, the distinction between a pure time-preference term and the growth or uncertainty components of a consumption discount rate; the bearing of population ethics, and of the fact that future people's identities may depend on what we do now, on claims about their welfare; and the aggregation problems that arise when the horizon is indefinite or infinite. Do not let that list constrain you, and tell me if any item on it is a red herring.

  Concretely: give me a ranked list of four to six questions, a paragraph of defense for each, an account of the dependencies among them (which are upstream of which), and a closing note on what would move a question up or down the list over the next two or three years -- the argument or counterexample that, if it appeared, should make me redirect the money. I care more about the reasoning than about the list, and I would rather have a short list defended hard than a long one defended thinly. You need not cite any literature; argue from the ideas themselves.
reasoning: |-
  Okay, let me approach this systematically. The user is designing a grant program focused on intergenerational discounting with specific constraints: they want a prioritized research agenda based on explicit criteria (upstream influence, tractability, neglect, impact) and must incorporate the "symmetry thesis" between time and space preferences.

  First, I need to internalize the symmetry thesis - it's not about declaring time preference irrational, but about demanding consistent justifications across temporal and spatial distance. This reframes everything. Most defenses of time preference probably crumble under spatial analogy, except perhaps where future identity dependence creates true asymmetry. 

  For the ranking criteria:
  - Upstreamness: How many other questions hinge on this? Philosophical foundations matter most.
  - Tractability: Must suit conceptual/formal methods, not empirical.
  - Neglect: Under-explored areas, especially those overlooked due to disciplinary silos.
  - Impact: Would resolution change real decisions? Governments might ignore philosophy, but robust frameworks could sway philanthropists.

  Now brainstorming candidate questions through the symmetry lens:
  1. Justification of pure distance preferences: This seems most upstream. If no defense works for spatial case, time preference collapses. Tractable via conceptual analysis, neglected because economists rarely question spatial discounting. High impact - could upend policy discount rates.
  2. Identity-dependence asymmetry: Does causing future people's existence create special obligations? Challenges symmetry, needs careful metaphysics. Neglected in discounting debates. 
  3. Aggregation under infinity: Both time and space face this, but spatial version (infinite parallel populations?) is underexplored. Formal methods excel here.
  4. Moral patienthood boundaries: Rocks vs. beings - affects how far obligations extend in both dimensions. Currently hand-waved.

  Dependencies clear: #1 is foundational - without it, other justifications may be irrelevant. #2 could be the main symmetry-breaker. #3-4 build on earlier answers.

  For re-ranking triggers: If someone finds an unbreakable symmetry defense (unlikely), that demotes #1. If identity-dependence gets formalized, #2 rises. New paradoxes in infinite aggregation could boost #3.

  The closing thought: This agenda forces engagement with spatial ethics, making intergenerational ethics less insular. That interdisciplinary angle might attract funders beyond philosophy.
answer: |-
  Here is a prioritized research agenda for your grant program, designed under the explicit constraints of the symmetry thesis and your stated criteria (upstreamness, tractability, neglect, impact). The ranking favors foundational justifications over applied calculations, as resolving core philosophical asymmetries would reconfigure the entire field. Dependencies are tightly interwoven, with Question 1 being the keystone.

  **Ranked Research Questions:**

  1.  **What justifications for pure distance preference (temporal or spatial) survive the symmetry thesis, and do any reveal a morally relevant asymmetry?**
      *   **Defense:** This is maximally upstream. Every practical discount rate debate presupposes *some* justification for pure time preference (PTP). The symmetry thesis forces defenders of PTP to confront whether their rationale (e.g., "impatience," "sovereignty," "uncertainty creep," "special concern for the present generation") could coherently justify valuing a life less because it exists 100 miles away instead of 100 years hence. If no defense survives symmetry, PTP collapses, radically altering discount rates. If a defense *does* survive (or a crucial asymmetry is found), it becomes the bedrock. Highly tractable for conceptual/formal analysis: dissect proposed justifications for logical coherence, scope, and consistency under symmetry. Neglected because spatial discounting is rarely seriously debated as a *moral* (rather than practical) issue. High impact: settling this would force governments, philanthropists, and philosophers to either abandon PTP or adopt a rigorous, generalizable defense affecting all long-term decisions.
      *   **Dependency:** Utterly foundational. All other questions (population ethics, discount rate structure, aggregation) depend on whether pure discounting is justifiable at all.

  2.  **Does the "identity dependence" of future people (their existence/exact identity relies on present choices) create a unique moral asymmetry between time and space that justifies differential treatment?**
      *   **Defense:** The most plausible candidate for breaking symmetry is that present acts *cause* which specific future persons exist, while spatial distance doesn't typically alter identity. But *does* this difference morally license discounting future welfare? Upstream: If "identity dependence" justifies weaker obligations to the far future, it fundamentally reshapes population ethics and discounting arguments. If it doesn't, a major defense of PTP vanishes. Highly tractable: conceptual analysis of person-affecting views, non-identity problem, and whether "causing existence" implies weaker obligations compared to "affecting existing beings" at a distance. Neglected in its direct application to *defending PTP via asymmetry*. High impact: Resolves a key objection to symmetry; if asymmetry holds, it provides a principled basis for time preference; if not, it removes a major crutch.
      *   **Dependency:** Directly downstream of Q1 (if Q1 finds symmetry holds, Q2 explores the *only* plausible asymmetry). Informs Q3 & Q4.

  3.  **How should we aggregate welfare across vast populations (temporal or spatial) when dealing with indefinite or infinite horizons, given symmetry constraints?**
      *   **Defense:** Standard infinite horizon problems (e.g., paralysis, intransitivity) arise similarly for a potentially infinite future or an infinite universe. The symmetry thesis demands that aggregation methods (e.g., overtaking, discounting, axiomatic approaches) be justifiable consistently for both dimensions. Upstream: The choice of aggregation method critically determines whether long-term impacts dominate. Tractable: Formal modeling (decision theory, social choice), axiomatic analysis. Neglected in explicitly forcing *spatial* application of infinite-horizon ethical models. Impact: High for philanthropists/philosophers deciding on causes; crucial for governments facing truly long-term threats (e.g., climate, AI). A consistent aggregation framework is necessary for any practical application once Q1 & Q2 are addressed.
      *   **Dependency:** Downstream of Q1 & Q2 (aggregation methods depend on whether pure discounting is permissible and how identity dependence factors in). Feeds into Q4.

  4.  **Can the standard components of the consumption discount rate (pure time preference, growth effect, uncertainty) be rigorously separated and defended under symmetry, particularly regarding uncertainty?**
      *   **Defense:** Economists decompose discount rates (r = ρ + ηg) but often conflate justifications. Symmetry forces clarity: Does "uncertainty" justifying lower weight on the distant future equally justify lower weight on the spatially distant? Is the "growth effect" (ηg) justifiable if future wealth depends on present choices, unlike spatially distant wealth? Upstream for *practical* discount rate calculation. Tractable: Conceptual disentanglement and formal modeling of uncertainty (distinguishing risk, ambiguity, model uncertainty) across time/space. Neglected in applying the symmetry lens to *each component separately*. Impact: Directly changes how governments/philanthropists calculate discount rates for policy analysis if core components are invalidated or reconfigured by symmetry.
      *   **Dependency:** Downstream of Q1 (if PTP is invalid, ρ=0 becomes mandatory). Relies on Q3 for handling uncertainty over long horizons. Connects to Q2 regarding the justification of ηg if future wealth is identity-dependent.

  **Dependencies Visualized:**
  ```
            Q1 (Justifications & Asymmetry?)
            /                  \
           /                    \
       Q2 (Identity Dependence?)  \
          |                         \
          |                          \
          v                           v
       Q3 (Aggregation over Infinity) --> Q4 (Discount Rate Components)
  ```

  **Closing Note: What Would Reshuffle the Agenda?**

  *   **Q1 Moves Down If:** A compelling, symmetry-respecting defense of PTP emerges (e.g., a rigorous argument showing "temporal sovereignty" fundamentally differs from spatial disinterest in a morally relevant way *without* relying on identity dependence). This would shift focus to Q4 and applied discounting.
  *   **Q2 Moves Up If:** A decisive counterexample or formal proof emerges showing identity dependence *must* (or *cannot*) alter moral weight compared to spatial distance. This would become the central battleground for symmetry.
  *   **Q3 Moves Up If:** A novel paradox or impossibility theorem emerges for infinite aggregation that treats time and space symmetrically, highlighting an urgent foundational crisis.
  *   **External Shock:** Major empirical/scientific developments could shift focus: E.g., conclusive evidence of interstellar civilizations would force immediate engagement with spatial discounting (boosting Q1 & Q3). Proof of unavoidable human extinction within centuries would reduce the salience of deep future aggregation (Q3).
  *   **Symmetry Breakdown Proven:** If a rigorous, non-hand-waving asymmetry *beyond* identity dependence is found (e.g., related to causation, entropy, or agency uniquely tied to time), Q1 would be resolved (finding asymmetry) and Q2 potentially demoted, refocusing the agenda on the implications of that asymmetry.

  **Core Rationale:** The symmetry thesis isn't just a quirk; it's a devastatingly effective tool for exposing weak justifications in intergenerational ethics. This agenda prioritizes dismantling or validating the foundations of pure discounting (Q1), probing the strongest potential asymmetry (Q2), then addressing the consequential aggregation (Q3) and practical calculation (Q4) problems *under the constraint* that time and space demand parallel treatment. Success here wouldn't just answer old questions; it would redefine the field's normative vocabulary.
