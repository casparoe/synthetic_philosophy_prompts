prompt: |-
  I run a 90-minute session for sixteen graduate students in a philosophy of mind and applied ethics seminar, and we keep circling the insect sentience question without getting anywhere. Some of the group think the probability that insects are sentient is low enough that their interests can be set aside; others think the scale argument settles the matter. I want an in-class activity that makes the group feel the force of the scale argument from the inside, before anyone names it, and that does not depend on any particular empirical estimate or on a debate about whether insects really are sentient. By the scale argument I mean the thought that a very low credence that a single insect is sentient can still generate an enormous expected amount of morally relevant experience once it is multiplied by the number of insects affected; I want participants to run into the difference between a low probability and a low expected moral weight, and to see why the second does not follow from the first when the population is large enough. The activity should also expose the hidden steps that make the argument contestable: the move from credence in sentience to credence in morally relevant sentience; the move from per-individual expected value to aggregate expected value; the assumption that welfare units are comparable across taxa; the opportunity cost of diverting resources from clear cases; and the threshold problem, where if sentience is all-or-nothing rather than a matter of degree, a small change in credence about the threshold can swamp the arithmetic.

  Set it in an ordinary seminar room with sixteen participants and ninety minutes, no real money, and only cheap materials such as index cards, tokens, and a whiteboard. Assume the participants are intelligent but not specialists in decision theory; if the activity needs a short primer on expected value, include one, but do not let the primer state the scale argument or name the conclusion. You may use toy numbers to make the arithmetic transparent—for instance, a policy affecting one trillion insects with an initial group credence of one in ten thousand that a single insect is sentient, compared with a policy affecting one million chickens with a credence of one. Do not include a bibliography, reading list, or citations, and do not name philosophers or theories; the activity should be intelligible to someone who has never read the literature. The rules, roles, and payoffs should arrange for participants to commit to a low credence, allocate moral resources on that basis, and then discover what their own credence implies in aggregate; the idea should show up in what happens, not in what the facilitator says afterwards. Include a debrief that maps moments in the activity onto the structure of the scale argument, says what will predictably go wrong the first time and how to handle it, and is frank about which feature of the scale argument the activity cannot reproduce—for example, it cannot settle whether insects are sentient, and it may make the underlying credences look more precise than they are.

  Return a single valid JSON object, with no prose outside it, using these fields: activity_title (string); learning_objectives (array of strings); setting_and_participants (string); duration_minutes (number); materials (array of strings); setup_and_seeding (string, including any numbers or assumptions the facilitator writes on the board); rules_and_roles (array of objects, each with role, instructions, and private_information); payoff_scheme (string, explaining scoring, tokens, or stakes and why no real money is needed); round_by_round_timeline (array of objects with round_number, duration_minutes, what_happens, and what_the_facilitator_should_not_say_yet); debrief_sequence (array of objects with step, prompt_question, and mapping_to_scale_argument); predictable_failure_modes (array of objects with failure_mode, why_it_happens, and facilitator_response); what_the_activity_cannot_reproduce (array of strings); extension_variants (array of strings). The JSON should be self-contained enough that I can run the session from it.
reasoning: |-
  We are designing an activity that illustrates the scale argument without naming it, using a scenario with hypothetical moral weights and resource allocation. The key is to have participants commit to a low credence for insect sentience, then see the aggregate implications when scaled up.

  Activity Title: The Trillion-Bug Question

  Learning Objectives:
  - To understand that a low probability of sentience per individual can still lead to a high expected moral weight when the population is very large.
  - To recognize that expected moral weight (probability × magnitude) is distinct from the probability itself.
  - To expose hidden assumptions in aggregating moral concern: e.g., comparability of welfare units, opportunity costs, and threshold problems.

  Setting and Participants:
  A seminar room with 16 graduate students arranged in a circle or around a table. The facilitator has a whiteboard and markers.

  Duration Minutes: 90

  Materials:
  - Whiteboard and markers
  - Index cards (one per participant)
  - Tokens (or poker chips) in two colors: blue for "chicken" resources and red for "insect" resources (about 20 of each per participant, plus extras)
  - A calculator (for the facilitator, to handle large numbers)

  Setup and Seeding:
  The facilitator writes on the board:
    - "Scenario: We are allocating resources to reduce suffering in two populations: 
        Population A: 1 million chickens (each chicken represents 1 unit of welfare loss if not helped)
        Population B: 1 trillion insects
    - Assumption: We are certain that chickens are sentient and that preventing suffering for one chicken averts 1 welfare unit. For insects, we are uncertain about sentience.
    - Your initial credence: Each of you has a personal credence (probability) that a single insect is sentient. Write this on your index card as a fraction or decimal (e.g., 1/10,000 or 0.0001). Keep it private for now.
    - We are allocating a fixed pool of resources (100 tokens per participant). Each token allocated to chickens can help 1 chicken (so averts 1 welfare unit). Each token allocated to insects can help 1 billion insects (because we can help them in bulk)."

  Rules and Roles:
  There are no distinct roles; all participants are "moral agents" allocating resources. However, the instructions and private information are as follows:
    - Each participant receives:
        * One index card to write their private credence for insect sentience (a number between 0 and 1).
        * 100 blue tokens (for chickens) and 100 red tokens (for insects). Note: In reality, we might not have 200 tokens per person, so we can use a tally on the index card or a sheet. Alternatively, we can use a single token type and track allocations on the board.

    Instructions for participants:
    "You have 100 tokens to allocate. Each token can be assigned to either chickens or insects. 
     - If you assign a token to chickens: it helps 1 million chickens? Wait, no: we said each token for chickens helps 1 chicken (averts 1 welfare unit). But note: we have 1 million chickens in total, so we can help up to 1 million chickens (with 1 token per chicken). However, we only have 100 tokens per person? That doesn't match. Let me adjust.

    Revised setup for clarity and feasibility:
    We need to adjust the numbers so that the allocation makes sense and the scale effect is clear.

    Let me change the setup on the board:
        - Each token allocated to chickens: helps 10,000 chickens (so averts 10,000 welfare units, because each chicken averted is 1 unit).
        - Each token allocated to insects: helps 1 billion insects.

    But note: we have 1 trillion insects. So one token helps 1 billion, which is 0.1% of the population? Not a problem.

    Now, the welfare per insect: if sentient, we assume that preventing suffering for one insect averts a very small welfare unit. But to avoid debate, we can define the welfare unit per insect as a fraction relative to a chicken. However, we don't want to get into that. Instead, we can say:

        For chickens: 1 token -> helps 10,000 chickens -> expected averted welfare = 10,000 (since we are certain they are sentient).

        For insects: 1 token -> helps 1 billion insects. The expected averted welfare per token = (credence that one insect is sentient) * 1 billion * (welfare unit per insect, relative to chicken). But we haven't defined the relative welfare. To avoid that, we can assume that if an insect is sentient, then helping one insect averts 1 welfare unit (same as a chicken). This is a simplification, but for the activity we can use it and then in the debrief note that this is a contestable assumption.

    So, on the board, the facilitator writes:
        "Each token for chickens: helps 10,000 chickens -> expected welfare averted = 10,000 × 1 = 10,000
         Each token for insects: helps 1 billion insects -> expected welfare averted = (your credence) × 1,000,000,000"

    Now, each participant has 100 tokens to allocate. They should decide how many tokens to put in chickens and how many in insects, based on maximizing expected welfare averted.

    However, we want them to first commit to a credence (on the index card) and then see the aggregate effect.

    Steps for participants:
        1. Write your credence for insect sentience on the index card (keep it private).
        2. Allocate your 100 tokens between chickens and insects to maximize expected welfare averted.

    But note: we want the group to see the aggregate. So we'll collect the allocations and then compute the total expected welfare for chickens and for insects.

  Payoff Scheme:
  There are no real stakes. The "payoff" is the total expected welfare averted by the group. We will calculate:
    - Total tokens for chickens: T_c
        -> Total expected welfare from chickens: T_c * 10,000
    - For insects: each participant's tokens for insects (T_i) are multiplied by their own credence (c_i) and by 1 billion.
        -> For each participant: expected welfare from insects = T_i * c_i * 1e9
        -> Then sum over participants.

    We compare the two totals. The point is to see that even with low c_i, the insect total might be huge because of the 1e9 factor.

  Round-by-Round Timeline:

  Round 1: Introduction and Credence Setting (10 minutes)
    - What happens: The facilitator explains the scenario (as on the board). Each participant writes their private credence for insect sentience on an index card (without showing others). They also write their name on the card (for later collection).
    - What the facilitator should not say yet: Do not mention the scale argument or that the insect welfare might dominate. Do not suggest that the low probability might be outweighed by the numbers.

  Round 2: Individual Allocation (15 minutes)
    - What happens: Each participant allocates their 100 tokens between chickens and insects. They record their allocation on the index card (e.g., "60 tokens for chickens, 40 for insects"). They may use the formula to compute expected welfare per token for insects and compare to chickens, but they are free to allocate as they wish.
    - What the facilitator should not say yet: Do not point out that the expected welfare per token for insects might be higher than for chickens even with a low credence.

  Round 3: Group Aggregation (20 minutes)
    - What happens: The facilitator collects the index cards. Then, on the whiteboard, the facilitator creates a table with columns: 
          Participant | Credence (c_i) | Tokens for chickens (T_c,i) | Tokens for insects (T_i,i)
      Then, for each participant, compute:
          Expected welfare from chickens: T_c,i * 10,000
          Expected welfare from insects: T_i,i * c_i * 1,000,000,000

      Then, sum the expected welfare from chickens across all participants and write the total.
      Sum the expected welfare from insects across all participants and write the total.

      Then, compare the two totals.

    - What the facilitator should not say yet: Do not interpret the results beyond the numbers. Just present the totals.

  Round 4: Reflection and Discussion (20 minutes)
    - What happens: The facilitator leads a discussion:
          "What do you notice about the totals? Why did the insect welfare total come out that way? What assumptions were we making? How did your own credence and allocation affect the result?"
      The facilitator can prompt with questions but should not yet name the scale argument.

    - What the facilitator should not say yet: Avoid stating the conclusion explicitly. Let participants articulate.

  Round 5: Debrief (25 minutes)
    - We'll have a structured debrief as per the debrief_sequence.

  Debrief Sequence:

  Step 1: 
    Prompt Question: "When we saw the total expected welfare from insects, what surprised you? Why was it so large even though many of you had low credences for insect sentience?"
    Mapping to Scale Argument: This corresponds to the core insight: a low probability per individual can be offset by a very large number of individuals.

  Step 2:
    Prompt Question: "What were the hidden steps in our calculation? For example, what did we assume about the moral weight of an insect if it is sentient? Did we assume that one insect's welfare is comparable to one chicken's welfare?"
    Mapping: This exposes the assumption of comparability of welfare units across taxa.

  Step 3:
    Prompt Question: "In our activity, each token for insects helped 1 billion insects. But in reality, how might the cost-effectiveness of helping insects compare to chickens? And what about the opportunity cost? If we divert resources to insects, what might we be giving up?"
    Mapping: This highlights the opportunity cost and the fact that we are assuming that helping insects is as cost-effective as we set (per token).

  Step 4:
    Prompt Question: "We treated sentience as binary (either sentient or not) and our credence as a single number. But what if sentience comes in degrees? What if there's a threshold below which we don't think there's morally relevant experience? How would that change the calculation?"
    Mapping: This addresses the threshold problem and the all-or-nothing assumption.

  Step 5:
    Prompt Question: "In the aggregation, we summed the expected welfare from each participant. But note that each participant had their own credence. Is that the right way to aggregate? Or should we have used a group average credence?"
    Mapping: This exposes the move from individual expected value to aggregate expected value and the issue of differing credences.

  Predictable Failure Modes:

  Failure Mode 1: Participants set their credence too high (e.g., 0.1 instead of 0.0001) so the insect total is obviously huge, making the point trivial.
    Why it happens: Without guidance, people might not realize how low the credence should be to mirror the real debate.
    Facilitator Response: In the setup, suggest a range: "In the literature, some estimates of insect sentience are as low as 1 in 10,000 or even lower. Please choose a credence that you think is reasonable, but if you are unsure, you might consider a very low number."

  Failure Mode 2: Participants allocate all tokens to chickens because they don't trust the insect welfare calculation or because they think insects are not sentient at all (credence=0).
    Why it happens: If someone sets credence=0, then insects get zero expected welfare. But we want to show that even a tiny non-zero credence can matter.
    Facilitator Response: Encourage participants to set a non-zero credence if they think there's any uncertainty. Say: "Even if you think it's very unlikely, if you assign any non-zero probability, then the scale might matter."

  Failure Mode 3: The arithmetic is too messy with 16 participants and large numbers.
    Why it happens: Multiplying by 1 billion and summing might lead to very large numbers that are hard to compare.
    Facilitator Response: Use scientific notation on the board. Pre-calculate the per-token expected welfare for insects for a few example credences (e.g., 0.0001 -> 100,000). Then note: 
        Chicken token: 10,000
        Insect token with c=0.0001: 100,000 -> so even with that low credence, one token for insects is 10 times more effective than for chickens.

  What the Activity Cannot Reproduce:
    - It cannot settle the empirical question of whether insects are sentient.
    - It treats credences as precise numbers, but in reality, they are vague and based on limited evidence.
    - It assumes that welfare units are comparable across chickens and insects, which is highly contestable.
    - It does not account for the possibility that sentience might be a matter of degree (so the welfare unit per insect might be much smaller than per chicken).

  Extension Variants:
    - "Vary the relative welfare unit per insect (e.g., if sentient, an insect might have 1/1000 the welfare capacity of a chicken)."
    - "Introduce uncertainty about the number of insects affected (e.g., the policy might help between 100 billion and 10 trillion)."
    - "Allow participants to update their credence after hearing others' allocations and reasons."

  Now, we put it all in a JSON object.
