          Group1, see blue: P(A|blue) = (0.3*0.9) / (0.3*0.9 + 0.7*0.1) = 0.27/(0.27+0.07)=0.27/0.34≈0.7941

          Group2, see red: P(A|red) = (0.7*0.1) / (0.7*0.1+0.3*0.9) = 0.07/(0.07+0.27)=0.07/0.34≈0.2059
          Group2, see blue: P(A|blue) = (0.3*0.1) / (0.3*0.1+0.7*0.9)=0.03/(0.03+0.63)=0.03/0.66≈0.0455

    - They announce these posteriors. Now, the other group hears numbers from the other prior group. But they don't know what prior the other group used.

    - Update round: now, they are to update based on the entire set of announcements. But this is where it gets interesting. They must use the common knowledge that everyone is rational and updates via Bayes, but they have different priors. Therefore, the theorem does not apply.

    - How to update? It's not clear. In fact, without a common prior, there is no prescribed way to update on the other's posterior because the other's posterior depends on their prior.

    - We can try to have them update as if they had the same prior? But that would be inconsistent.

    - Alternatively, we can have them not update at all? Or we can have them update only within their group? But the activity design says they reveal to everyone.

    - The point is that they will not agree. In the first condition, they quickly agree. In the second, they start with different numbers and then even after hearing the others, they might not know how to update because they don't know the others' priors. In fact, the facilitator can tell them that they are not allowed to discuss anything other than their posterior probability for the event.

    - In the second condition, after the first announcement, they have a set of numbers. But they don't know which numbers come from which group? They might be able to infer. For example, if they hear a number around 0.95, they know it must be from group1 who saw red. Similarly, 0.79 from group1 blue, 0.21 from group2 red, 0.05 from group2 blue. So they can count the number of red and blue draws for each group? But they don't know the groups either.

    - This might get messy.

   Given the complexity and time constraints, I propose the following simpler activity that will illustrate the point without heavy computation.

   We will use the common prior urn as described above (urn A: 70% red, urn B: 30% red, prior 50-50). Each participant gets one draw (simulated by the facilitator). In the first condition, everyone has the same prior.

    - Round 0: Each computes their posterior based on their private draw.
    - Round 1: They announce their posterior to the group. From the set of announcements, they can count the number of red and blue draws (as above). Then they all compute the same posterior using the formula and update to that number.
    - They all agree.

   In the second condition, they are split into two groups with different priors. The groups are not hidden; everyone knows there are two groups with different priors. But they don't know which prior the other group has? Actually, we can tell them: 
        Group1's prior: P(A)=0.9
        Group2's prior: P(A)=0.1

    - Round 0: Each computes their posterior based on their private draw and their group's prior.
    - Round 1: They announce their posterior to the group. Now, when they update, they should take into account the group membership and the prior of the other group. How? 
          - They know the other group's prior, and they know the likelihood function (the urn compositions).
          - So when they hear a posterior from a member of group1, they can infer what draw that person must have seen? 
            Because in group1, there are only two possible posteriors: about 0.9545 (if red) or 0.7941 (if blue). Similarly for group2: 0.2059 or 0.0455.

          - Therefore, from the posterior announcement, they can infer the private draw of that person.

          - Then they can count the total number of red and blue draws across all participants.

          - Then they can update their own belief using the total data (all draws) and their OWN prior.

          - But note: their own prior is different. So even though they have the same data (the counts), their posteriors will be different.

          - Let the total number of red draws be k, blue draws be m (k+m=16).

          - For a person in group1, the posterior will be:
               P(A | data) = [ (0.7)^k * (0.3)^m * 0.9 ] / [ (0.7)^k * (0.3)^m * 0.9 + (0.3)^k * (0.7)^m * 0.1 ]

          - For a person in group2:
               P(A | data) = [ (0.7)^k * (0.3)^m * 0.1 ] / [ (0.7)^k * (0.3)^m * 0.1 + (0.3)^k * (0.7)^m * 0.9 ]

          - These will be different.

          - Moreover, after this update, they might announce again? But the theorem doesn't apply because they don't have a common prior. And indeed, they still disagree.

    - So in the second round, they can announce again, and they will still have different numbers.

    - This will illustrate that without a common prior, even with common knowledge of all the data (because they can infer the raw data from the posteriors and the known likelihood and known priors of the groups), they still disagree.

    - The key is that they have different priors.

    - And they will see that the disagreement is stable.

    - We can then have a third beat: one participant is secretly instructed to break rationality. For example, they might not update properly. Or they might anchor on their first number.

    - But the theorem also assumes common knowledge of rationality. So if one person is not rational, then even in the common prior condition, they might not agree.

    - In the first condition, if one person does not update and just stays at their initial posterior, then when the others update to the group posterior, that one person is different. Then in the next round, the others see that this person did not update. This breaks common knowledge of rationality. The others might wonder: why didn't they update? Maybe they have more information? Or maybe they are not rational.

    - This could be an advanced topic.

   Given the time (75 minutes), we can do:

    5-10 minutes: introduction and setup.
    20 minutes: condition 1 (common prior)
    20 minutes: condition 2 (different priors)
    10 minutes: condition 3 (secretly one person breaks rationality) - if time allows.
    15 minutes: debrief.

   Let's design the materials and procedure.

   Materials:
     - Index cards for each participant. In condition 1, they will have the true prior (0.5) and their private draw (either "red" or "blue").
     - In condition 2, half of the cards will have prior=0.9 and the other half prior=0.1, and the private draw.
     - A way to collect announcements: maybe a whiteboard or a shared google doc? Or just have them call out.

   For computational ease, we can provide a calculator (or phone) or do the computation as a group.

   Alternatively, we can do a smaller group. Or we can precompute a table.

   Given the time, I propose we do the following to simplify the computation in condition 1 and 2:

     In condition 1:
        - After they announce, we will have a count of red (k) and blue (m) (by: every 0.7 means red, 0.3 means blue).
        - Then we compute the posterior using the formula:

            odds = [ (0.7)^k * (0.3)^m * 0.5 ] / [ (0.3)^k * (0.7)^m * 0.5 ] = (0.7/0.3)^{k-m} 

            Let r = (0.7/0.3) = 7/3 ≈ 2.333
            Then posterior odds = r^{k-m}
            Then posterior probability = odds / (1+odds) = r^{k-m} / (1 + r^{k-m})

        - Example: if k=10, m=6, then k-m=4, r^4 = (7/3)^4, then P(A)= (7/3)^4 / [1 + (7/3)^4]

     In condition 2, for each group we do:

          Group1: 
            odds = [ (0.7)^k * (0.3)^m * 0.9 ] / [ (0.3)^k * (0.7)^m * 0.1 ] = (0.7/0.3)^{k-m} * (0.9/0.1) = (7/3)^{k-m} * 9
            P(A) = (9 * (7/3)^{k-m}) / (1 + 9 * (7/3)^{k-m})

          Group2:
            odds = [ (0.7)^k * (0.3)^m * 0.1 ] / [ (0.3)^k * (0.7)^m * 0.9 ] = (7/3)^{k-m} * (0.1/0.9) = (7/3)^{k-m} / 9
            P(A) = ( (7/3)^{k-m} / 9 ) / (1 + (7/3)^{k-m}/9) = (7/3)^{k-m} / (9 + (7/3)^{k-m})

     So the computation is similar.

     We can do this with a calculator.

     To save time, we might have the facilitator compute these numbers, or we can have the participants use their phones.

     Alternatively, we can do a very small number of participants. But we have 16, and that's a good sample.

     We can also do the activity in subgroups: split the 16 into two groups of 8, and run the activity in parallel. Then compare across groups. This would require two facilitators.

     Given the constraints, I think we should do one group and have the facilitator compute.

     Steps for condition 1 (common prior):

      1. The facilitator secretly flips a coin to choose the urn (A or B). (But we won't reveal until the end.)
      2. For each participant, the facilitator draws a ball from the chosen urn (with replacement? we don't need physical urns, we can simulate). They write on an index card for the participant: 
            "Your prior: P(Urn A) = 0.5"
            "Your private draw: [Red or Blue]"
      3. Each participant computes their posterior: if red, 0.7; if blue, 0.3. They write it on a sticky note or announce to the facilitator.
      4. The facilitator collects all announcements and counts the number of 0.7's (which equals the number of red draws, k) and 0.3's (blue draws, m). Note: k+m=16.
      5. The facilitator computes the group posterior using the formula above (or has a helper compute).
      6. The facilitator announces the group posterior to everyone. They should all adopt this number.

     Steps for condition 2 (different priors):

      1. The facilitator again secretly chooses the urn (same urn for everyone).
      2. The facilitator splits the participants into two groups: Group1 and Group2 (8 each).
      3. For Group1, the index card says: "Your prior: P(Urn A)=0.9", and for Group2: "Your prior: P(Urn A)=0.1". 
          And each gets a private draw (simulated by the facilitator from the chosen urn).
      4. Each participant computes their posterior:
            Group1: 
               if red: 0.9545 (or approximately 0.95 if we round)
               if blue: 0.7941 (or 0.79)
            Group2:
               if red: 0.2059 (0.21)
               if blue: 0.0455 (0.05)
          We can provide these numbers to avoid computation: 
            For Group1: 
               red: 0.95
               blue: 0.79
            For Group2:
               red: 0.21
               blue: 0.05

      5. They announce their posteriors to the whole group. The facilitator writes them down.
      6. Now, from the announcements, we can infer the private draw of each participant and count k and m.
          Example: 
            0.95 -> Group1, red
            0.79 -> Group1, blue
            0.21 -> Group2, red
            0.05 -> Group2, blue
          So the facilitator counts:
            red: number of 0.95 and 0.21
            blue: number of 0.79 and 0.05

          Let k = number of red draws = (# of 0.95) + (# of 0.21)
          m = 16 - k

      7. Then the facilitator computes the posterior for each group using their own prior and the total data (k and m). The formulas are as above.

      8. The facilitator announces:
            "For Group1, the updated posterior is: X"
            "For Group2, the updated posterior is: Y"

          And they will be different.

     For condition 3 (break an assumption): we can do within the common prior condition.

       - We secretly instruct one participant (before the activity) to not update in the second round. They will keep their initial posterior (0.7 or 0.3) even after hearing the group posterior.
       - In the common prior condition, after the first round, everyone else updates to the group posterior (say, 0.95). But this one participant still has 0.7.
       - Then they do a second round of announcement. The facilitator asks everyone to announce their current posterior.
       - The group will see that one person is different.
       - Then they might try to update again? But how? They know that this person should have updated. The facilitator can ask: "Given that you see one person did not update, what do you do?"
       - This breaks common knowledge of rationality. Also, it might be that this person has more information? But they don't. So it's irrationality.
       - The group might try to update excluding that person? Or they might become confused.

     But time might be tight.

     Alternatively, we can do a very quick third beat in the common prior condition by having one person break rationality, and then show that agreement is not reached.

   Given the time, I will outline the 75 minutes:

    0:00 - 0:05: Introduction to the activity and the setup for condition 1 (common prior). Explain the rules.

    0:05 - 0:20: Run condition 1.
          - 2 min: distribute cards with prior and private draw.
          - 3 min: participants compute their initial posterior.
          - 2 min: collect announcements (call out or write on board) and count k and m.
          - 3 min: facilitator computes group posterior and announces.
          - 5 min: participants update to the group posterior. They should all have the same number.

    0:20 - 0:40: Run condition 2.
          - 2 min: split into groups, distribute cards (with different priors and private draws).
          - 3 min: participants compute their initial posterior.
          - 2 min: collect announcements and count k and m.
          - 5 min: facilitator computes the posterior for group1 and group2 and announces.
          - 3 min: participants update to their group's new posterior.

    0:40 - 0:50: Run condition 3 (optional, if time).
          - We use the common prior condition again, but this time one participant is instructed (secretly) to not update in the second round.
          - Run as in condition 1 until the first update.
          - After the facilitator announces the group posterior, everyone else adopts it, but the instructed participant does not.
          - Then do a second round of announcements: the facilitator collects again.
          - The group sees that one person is different.
          - Then the facilitator can ask the group: "What is your new posterior now that you see that one person did not update?" 
          - They might try to incorporate the fact that this person didn't update as evidence that the person has more information? But they don't. Or they might realize that the person is not rational.

    0:50 - 1:15: Debrief.

    Debrief points:

      1. In condition 1, they started with different private information (different draws) and hence different opinions, but after sharing their posteriors, they quickly agreed. This is Aumann in action: common prior, common knowledge of rationality, and common knowledge of the protocol (they know everyone is updating by Bayes) led to agreement.

      2. In condition 2, even after sharing and updating on the others' posteriors, they did not agree. The change we made was to break the common prior. So the theorem does not apply.

      3. In condition 3 (if done), we broke the common knowledge of rationality: one person did not update rationally. This also broke the agreement.

      4. The theorem guarantees agreement, not accuracy. In condition 1, they might have converged to the wrong number (if the urn was B and they got many red draws by chance).

      5. At the end, reveal the true urn. Ask: did they get it right in condition 1? In condition 2, which group was closer might depend on the true urn and the draws.

      6. In real life, when people disagree forever, it might be because they don't have a common prior (they started with different world views) or because they don't trust the other's rationality or the protocol.

    Materials in advance:

      - Index cards for condition 1: 16 cards, each says:
            "Common prior: P(Urn A) = 0.5"
            "Your private draw: [Red or Blue]"
          (The facilitator needs to know the true urn to simulate the draws. They can use a random number generator: 
            If urn A, then red with prob 0.7, else blue.
            If urn B, then red with prob 0.3, else blue.)

      - Index cards for condition 2: 
            For Group1 (8 cards): "Your prior: P(Urn A)=0.9", and then the private draw.
            For Group2 (8 cards): "Your prior: P(Urn A)=0.1", and then the private draw.

      - Calculator for the facilitator.

    Payoff scheme:

      - We will have a ground truth: the true urn chosen by the coin flip.
      - In condition 1, after convergence, each participant's final posterior for urn A is recorded. Then we compute a score: 
            score = 1 - (true_indicator - posterior)^2
          where true_indicator=1 if urn A, 0 if urn B.
          Then the closer the posterior to the truth, the higher the score.

      - But note: they all have the same posterior in condition 1, so they all get the same score.

      - In condition 2, we do the same: after the final update, record the posterior for each participant. Then compute the score as above.

      - The winner is the participant with the highest total score across condition 1 and condition 2. They get to choose the next topic.

      - But in condition 1, they are all the same. In condition 2, within a group they are the same. So the scores might be tied.

      - Alternatively, we can score only condition 1 and condition 2 as a group, and then the winning group (or the group that was closer on average) gets to choose the next topic.

      - Or we can skip the scoring and just reveal the truth for the debrief.

    Given the constraints, I suggest we do not do a complex scoring. The prize is choosing the next topic. We can give it to the participant who was closest in condition 2? Or to the group that had the highest posterior if urn A was true, etc.

    Alternatively, we can have in each condition a prediction: at the end, after convergence, each participant writes their posterior and a binary prediction (A or B) based on whether their posterior is >0.5. Then they get a point if they predict correctly. Then the one with the most points wins.

    But in condition 1, they are all the same, so they all get the same.

    So perhaps it's best to have:

      - In condition 1, they all get 1 point if the group's final posterior is correct (i.e., if they converge to >0.5 and urn A is true, or <0.5 and urn B is true) and 0 otherwise.

      - In condition 2, each participant's prediction is based on their own final posterior (which might be different between groups). They get 1 point for a correct prediction.

      - The participant with the most points wins. (In condition 1, they all get the same point. In condition 2, they might differ if their final posteriors are different, but within a group they are the same.)

    But in condition 2, within a group they will have the same posterior, so they will make the same prediction. So we can have group scores.

    Alternatively, we can have only one winner and use condition 2: the participant in condition 2 whose final posterior is closest to the truth (in absolute difference) wins.

    Let's keep it simple: at the end of both conditions, we reveal the true urn. Then we ask for a volunteer to explain why they think the activity illustrates the theorem. The best explanation gets to choose the next topic.

    Or: at the beginning, we don't tell them the true urn. After both conditions, they write on a card their current best guess for the urn (based on all the data) and their name. Then we reveal the true urn. The ones who are correct get entered in a draw. The winner chooses the topic.

    But in condition 1, they already have a group posterior. In condition 2, they have group-specific posteriors. So they can use that.

    I think the simplest is to not have a complex scoring. The activity is for learning. The prize can be for the best debrief contribution.

    Alternatively, we can have no prize and just the learning.

    Given the constraints, I'll leave it out.

    What can go wrong:

      1. Participants might not know how to compute the initial posterior. 
          Solution: provide the formula. For condition 1:
              if red: P(A) = 0.7
              if blue: P(A) = 0.3
          For condition 2, provide the rounded numbers.

      2. In condition 1, after the first round, they all update to the group posterior. But what if they want to do multiple rounds? 
          The activity is designed to converge in one round. So we do one update.

      3. In condition 2, when they update, they must use their own group's prior. We will provide the formula, but it might be complex. 
          Solution: the facilitator computes and announces.

      4. The computation might take time. We can precompute a table for common values of k and m.

      5. Participants might be confused about why in condition 2 they don't agree even after sharing. 
          The debrief will explain.

      6. In condition 3, the instructed participant might feel awkward. 
          We can skip it if time is tight or if the group is not receptive.

      7. The groups might be too large. We can run with a subset of volunteers? Or do it as a whole group.

    What the activity cannot reproduce:

      - The theorem assumes that the agents have common knowledge of each other's posteriors at every step. In our activity, we achieve this by public announcement. But in real life, common knowledge is subtler: it requires that everyone knows, and everyone knows that everyone knows, etc. Our public announcement approximates common knowledge.

      - The theorem applies to any iterated announcement and update. In our activity, it converged in one step because the private information was independent and the posterior revealed the private information. In general, it might take more steps if the private information is not revealed by the posterior. But we avoided that by design to keep it simple and fast.

      - The theorem is about common knowledge of rationality: in our activity, we assume that everyone updates by Bayes' rule. We break this in condition 3. But in the first two conditions, we enforce it.

      - The theorem does not require that the private information be independent, but in our activity we used independence for simplicity.

    Final instructions for a colleague:

      I'll write a separate facilitator's guide.
answer: |-
  Below is a complete activity design for your reading group session on Aumann's agreement theorem. It meets your specifications: a hands-on, zero-budget activity using index cards, with two contrasting conditions and an optional third beat to test assumptions. Participants will experience forced convergence (common prior) vs. persistent disagreement (split priors), followed by a debrief linking the activity to the theorem's machinery.

  ---

  ### **Activity Title: The Urn of Agreement**
  **Objective:** Experience Aumann's theorem in action—convergence under common priors, persistent disagreement without it—and dissect its assumptions.

  ---

  ### **Materials & Setup**
  - **Index Cards (30–40):** 
    - 16 cards for private draws (8 red, 8 blue)  
    - 8 cards for split priors (4 labeled "Prior: P(Urn A) = 0.9", 4 labeled "Prior: P(Urn A) = 0.1")  
    - 6 blank cards for probability writing  
  - **Two Urns (conceptual):**  
    - Urn A: 70% red balls, 30% blue balls  
    - Urn B: 30% red balls, 70% blue balls  
  - **Ground Truth:** Secretly flip a coin before each condition to pick the urn (A or B).  
  - **Projector/Whiteboard:** Track announced probabilities.  
  - **Timers:** For rounds.  
  - **Payoff:** "Insight Points" (see below).  

  ---

  ### **Rules & Protocol**
  **Core Setup:**  
  - **Event:** "The urn is Urn A" (70% red).  
  - **Private Evidence:** Each participant draws one ball (simulated via index card: "red" or "blue") from the chosen urn.  
  - **Updating:** Participants calculate/announce their probability of Urn A, then update based on others' announcements.  

  #### **Condition 1: Common Prior (15 min)**  
  1. **Setup:**  
     - All 16 participants share the same prior: P(Urn A) = 0.5.  
     - Distribute private draw cards (e.g., 10 red, 6 blue if Urn A is true).  
  2. **Round 0 (Initial Belief):**  
     - Each calculates their posterior:  
       - Red draw: P(Urn A) = 0.7  
       - Blue draw: P(Urn A) = 0.3  
     - Participants write probabilities on cards and hold them up.  
  3. **Round 1 (Update):**  
     - Count red/blue draws from the announcements (e.g., 10 said 0.7 → 10 red; 6 said 0.3 → 6 blue).  
     - Everyone updates to the *same* posterior using Bayes' theorem:  
       ```
       P(Urn A | data) = 1 / [1 + (3/7)^(2×(red_count − blue_count))]  
       ```  
       *(Facilitator computes this; see cheat sheet below)*  
     - Announce new probability (e.g., 0.97 for 10 red, 6 blue). Everyone adopts this number.  
  4. **Outcome:** All converge to one probability.  

  #### **Condition 2: Split Priors (15 min)**  
  1. **Setup:**  
     - Split the room: Half get "Prior: P(Urn A) = 0.9", half get "Prior: P(Urn A) = 0.1".  
     - Use the *same urn* as Condition 1. Distribute private draws (same cards).  
  2. **Round 0 (Initial Belief):**  
     - Each calculates their posterior using their group’s prior:  
       | **Group** | **See Red** | **See Blue** |  
       |-----------|-------------|--------------|  
       | Prior=0.9 | ≈0.95       | ≈0.79        |  
       | Prior=0.1 | ≈0.21       | ≈0.05        |  
     - Hold up probabilities.  
  3. **Round 1 (Update):**  
     - Count red/blue draws from announcements (e.g., 0.95/0.21 → red; 0.79/0.05 → blue).  
     - Update using Bayes, but each group uses *their own prior*:  
       - Group 1 (Prior=0.9):  
         `P(Urn A) = [9 × (7/3)^(red − blue)] / [1 + 9 × (7/3)^(red − blue)]`  
       - Group 2 (Prior=0.1):  
         `P(Urn A) = [(7/3)^(red − blue)] / [9 + (7/3)^(red − blue)]`  
     - Announce new probabilities (e.g., Group 1: 0.99, Group 2: 0.15).  
  4. **Outcome:** Groups disagree stably.  

  #### **Condition 3: Broken Rationality (Optional, 10 min)**  
  - **Setup:** Re-run Condition 1, but secretly instruct one participant to anchor on their initial probability (ignore updates).  
  - **Outcome:** Group converges, but the anchored participant disagrees. Highlights "common knowledge of rationality."  

  ---

  ### **Payoff: Insight Points**  
  - **Scoring:**  
    - After convergence in each condition, participants secretly predict the urn (A or B) if their posterior is >0.5.  
    - Reveal ground truth at the end. Correct predictions earn 1 point.  
  - **Winner:** Top scorer chooses the next topic.  
  - **Why this works:** Incentivizes honest updating (points depend on accuracy, not consensus). In Condition 1, all score equally; in Condition 2, groups may score differently.  

  ---

  ### **Timeline (75 min)**  
  1. **Intro (5 min):** Explain rules, payoff, and the urn setup.  
  2. **Condition 1 (15 min):**  
     - 0–5 min: Distribute cards, compute initial probabilities.  
     - 5–10 min: Announce and record probabilities (track counts).  
     - 10–15 min: Update to group posterior.  
  3. **Condition 2 (15 min):**  
     - 15–20 min: Split groups, distribute cards, compute initial probabilities.  
     - 20–25 min: Announce and record (track counts).  
     - 25–30 min: Update to group-specific posteriors.  
  4. **Condition 3 (10 min, optional):**  
     - 30–35 min: Re-run Condition 1 with one irrational agent.  
     - 35–40 min: Discuss why disagreement persists.  
  5. **Debrief (30 min):** See below.  
  6. **Scoring/Wrap-up (5 min):** Reveal ground truth, award points, winner picks topic.  

  ---

  ### **Debrief (30 min)**  
  Link activity moments to theorem assumptions:  

  1. **Convergence in Condition 1:**  
     - "Why did you *have* to agree?"  
     - **Theorem Parts:** Common prior (P(Urn A)=0.5), common knowledge of rationality (all used Bayes), common knowledge of opinions (public announcements).  

  2. **Stable Disagreement in Condition 2:**  
     - "Why couldn’t you agree here?"  
     - **Theorem Part:** Broken common prior (split 0.9/0.1). Emphasize: Rational updating + identical evidence → disagreement.  

  3. **Announced Posteriors vs. Raw Evidence:**  
     - "Why did you share probabilities, not ball colors?"  
     - **Theorem Part:** Agents update on others' beliefs (sufficient statistics), not raw data. In Condition 1, announcing 0.7/0.3 revealed ball colors; in Condition 2, 0.95/0.21 also revealed colors *and* priors.  

  4. **Agreement ≠ Accuracy (Key Insight):**  
     - Reveal ground truth *after* convergence.  
     - "Did agreeing make you right?"  
     - **Theorem Part:** Guarantees consensus, not truth. In Condition 1, you may all be confidently wrong (e.g., converge to 0.97 if Urn B is true).  

  5. **Condition 3 (Broken Rationality):**  
     - "Why did one person break consensus?"  
     - **Theorem Part:** Broken common knowledge of rationality.  

  6. **Real-World Disagreements:**  
     - "When you say, 'Reasonable people can disagree,' which assumption are you rejecting?"  
     - **Likely Answers:**  
       - Common prior (e.g., "We started with different worldviews").  
       - Common knowledge of rationality (e.g., "They’re not thinking straight").  
       - Common knowledge of opinions (e.g., "They’re hiding something").  

  ---

  ### **What Could Go Wrong (and Fixes)**  
  1. **Miscomputing Posteriors:**  
     - **Risk:** Non-math folks may struggle.  
     - **Fix:** Provide simplified formulas (e.g., "See red? Your P(Urn A) is 0.7"). Use calculator for group updates.  

  2. **Anchoring on Loud Opinions:**  
     - **Risk:** Participants copy the first announcement.  
     - **Fix:** Enforce silent writing/display of probabilities before discussion. Stress: "Update only on numbers, not arguments."  

  3. **Refusing to Update:**  
     - **Risk:** Stubborn participants ("I trust my gut").  
     - **Fix:** Incentivize with points (updating improves prediction accuracy). In debrief, use this to discuss irrationality.  

  4. **Dead Air from Fast Convergence:**  
     - **Risk:** Condition 1 converges in one round.  
     - **Fix:** Use rounds to highlight process. Ask: "How many thought you’d disagree forever?"  

  5. **Leaking Private Evidence:**  
     - **Risk:** Participants say, "I saw red!" instead of probabilities.  
     - **Fix:** Strictly enforce: "Only announce your probability of Urn A."  

  ---

  ### **What the Activity Cannot Reproduce**  
  - **Idealized Common Knowledge:**  
    - In the theorem, "common knowledge" means everyone knows X, everyone knows everyone knows X, ad infinitum. In the room, public announcements approximate this, but it’s not perfectly recursive. If pressed, say: "We simulate it by ensuring everyone hears everything, but true common knowledge requires infinite recursion."  
  - **Partitions of Possibility:**  
    - The theorem uses information partitions (what an agent knows about what others know). Our activity simplifies this to public announcements.  
  - **Infinite Updates:**  
    - The theorem allows for endless refinements; we stop at one round (sufficient for convergence in this setup).  

  ---

  ### **Cheat Sheet for Facilitator**  
  - **Bayes Formula (Condition 1):**  
    `P(Urn A | data) = 1 / [1 + (3/7)^(2×(red_count − blue_count))]`  
    - *Example:* 10 red, 6 blue → red_count − blue_count = 4 → P(Urn A) ≈ 0.97.  
  - **Bayes Formulas (Condition 2):**  
    - Group 1 (Prior=0.9): `P(Urn A) = [9 × (7/3)^(red − blue)] / [1 + 9 × (7/3)^(red − blue)]`  
    - Group 2 (Prior=0.1): `P(Urn A) = [(7/3)^(red − blue)] / [9 + (7/3)^(red − blue)]`  
    - *Example:* 10 red, 6 blue → Group 1: ≈0.99, Group 2: ≈0.15.  

  ---

  ### **Final Notes**  
  - **Run as Written:** This is facilitator-ready. Hand it to a colleague; they can execute it.  
  - **Emphasis:** Stress the "trap" (Condition 1) vs. "release valve" (Condition 2). The debrief is where insights crystallize.  
  - **Your Role:** Be a ruthless enforcer of the rules (no talking about raw evidence!). The power is in the constraints.  

  By the end, your group will have *felt* Aumann’s engine—convergence as a mathematical inevitability under common priors, disagreement as a symptom of broken assumptions. And they’ll finally stop arguing about whether "reasonable people" can disagree.
