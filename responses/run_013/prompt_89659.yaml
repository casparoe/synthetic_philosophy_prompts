  We are designing an activity to illustrate Aumann's agreement theorem. The key elements are:
   1. Two conditions: 
      a. Common prior: everyone starts with the same prior distribution.
      b. Different priors: two groups have different priors (but within each group, the prior is common).
   2. The activity should make participants update their beliefs by repeatedly announcing their posterior probabilities for a target event and updating based on others' announcements.

   We'll use a bag (urn) with two types of balls: Red and Blue. The target event is that the bag is "mostly Red" (say, at least 70% Red). However, to keep it simple and computationally easy, we will have a discrete set of possible bags (or states of the world) and each participant gets a private draw (with replacement) from the bag. But note: we want a common prior over the state (the bag composition) and then each participant sees a private sample.

