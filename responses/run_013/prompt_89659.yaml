      - The facilitator flips a fair coin to choose which urn to use. This is the state of the world. The common prior is 50% for Urn A and 50% for Urn B.

    - Each participant draws one ball from the chosen urn (with replacement? without? we have 16 people and 10 balls, so without replacement is tricky. Let's do with replacement: we draw, note the color, and put it back. But then we have independent draws).

    - The target event: "The urn is Urn A" (i.e., 70% Red).

    - Each participant sees one ball. Then they compute their posterior: 
          P(Urn A | their draw) = P(draw | Urn A) * P(Urn A) / P(draw)

