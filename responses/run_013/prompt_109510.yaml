prompt: |-
  Ok so I'm not a philosopher, I fix boilers for a living, but I play poker every other Thursday with the same six lads and we've got into arguing about this puzzle I found online. Maybe you know it, Death in Damascus? The way I've got it: you're in Damascus, you bump into Death, Death says it's coming for you tomorrow, so you leg it to Aleppo, and then it turns out Death was waiting for you in Aleppo all along, because it already knew you'd run. So running didn't save you, you were dead the second you decided, either way.

  Anyway I want to do 25 minutes on this at the kitchen table next Thursday, after the cards. They're sharp with odds, they'll do pot odds in their heads, but they think philosophy is a load of waffle and two of them start looking at their phones if I say the word 'epistemic'. So I don't want the answer to the puzzle, I want a plan for how I walk them through it. What has to be in place before the thing even lands? I'm guessing they have to see that their own choice tells them something about what Death already did, before the payoff means anything, but I might be wrong about that. What order does it all have to come in, and what's the one thing to build it around, is the camel bit enough or do I need something they can hold, like a bet on a horse they've already backed?

  Things I'm worried about. Someone's going to say 'just flip a coin, you idiot', and I genuinely dont know if that's a joke or secretly the right answer, and I don't want to get caught out. Someone else will say it's really about fate and time travel. And one of them will say it's a stupid puzzle because nobody can actually predict the future, which I sort of agree with but I think misses the point. Where in the sequence do I head each of those off?

  Also Ive been fiddling with it: what if Death is only right 8 times out of 10? Or what if there's a third town, so it's not just two doors? Should I even bring that up, and if so, before or after they've got the basic thing? And what should I flatly refuse to get into, because I know there's proper academic stuff about 'causal versus evidential' decision theories and I am not going to be the bloke pretending to have read it. Give me one question to ask at the end that'll tell me whether they actually got it or just nodded along. Finish with a line that's just \answer{...} and inside the brackets, in a few words, the one example I should build the whole thing on. Cheers.
