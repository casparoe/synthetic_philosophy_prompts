answer: |-
  Here’s a 25-minute game plan tailored for your poker crew. Keep it concrete, odds-focused, and ban the word "epistemic". Build it like a poker hand—lay the foundation, reveal the tension, then show the twist.

  ### **The 25-Minute Blueprint**
  **Goal:** Make them feel the paradox in their guts using probability & betting logic they already use.

  ---

  #### **Phase 1: Set the Table (5 mins)**  
  *What they NEED to accept upfront:*  
  1. **Death is Nostradamus Jr.**  
     - "Death isn’t magic—it’s just *really* good at predicting your moves. Like if Phil Ivey could read your hole cards every hand. Assume it’s 100% accurate for now—we’ll break that later."  
  2. **Choices = Information**  
     - "Your decision *tells you something* about what Death already did. If you run to Aleppo, that’s evidence Death knew you’d run—so it’s already there."  
  3. **No Free Will Debates**  
     - Shut down "but prediction is impossible!" fast: "Yeah, obviously. But humor me—*if* something could predict you perfectly, what happens? It’s a logic cage."  

  **Skip:** Fate, time travel, philosophy waffle.  
  **Anchor:** Betting on a horse *after* the race started but before you know the result. (e.g., "Would you bet on Seabiscuit at 5:1 if the race is *over* but you haven’t seen the finish?")

  ---

  #### **Phase 2: The Poker Hand Analogy (10 mins)**  
  *Make it a game they’d play:*  
  - **Setup:** Death puts £1000 in *one* of two envelopes: "Damascus" or "Aleppo". You pick an envelope. If it’s empty, you die.  
  - **Death’s Edge:** It knows your choice *before* it seals the envelopes. (Like seeing your bet before setting the pot).  
  - **Your Move:** Do you pick Damascus or Aleppo?  

  *Walk the logic:*  
  - If you pick Damascus → Death knew you’d pick it → envelope is empty → you lose.  
  - Same for Aleppo → lose.  
  → *"So why pick at all? But not picking is a choice too—Death knew that!"*  

  **Key Insight:** Your choice *reveals* which envelope is empty. But you can’t outthink it because any decision "confirms" Death’s setup.  

  ---

  #### **Phase 3: Shut Down Objections (5 mins)**  
  *Preempt their sidetracks:*  
  - **"Just flip a coin!"**  
    - *"YES! That’s secretly the answer.* If you randomize (50/50 coin flip), Death can’t predict your choice—so it picks a city at random too. Now your survival odds are 50%. Without the coin? 0%."  
    - Punchline: "Randomizing breaks the loop. It’s not a joke—it’s game theory."  

  - **"Prediction is impossible!"**  
    - "Agreed. But imagine Death’s a card shark with 99% accuracy. If you *always* bluff the river, he exploits you. The puzzle’s about predictable patterns getting punished."  

  - **"It’s about fate!"**  
    - "Nah. It’s about *information feedback*. Your choice isn’t causing death—it’s *correlated* with it. Like seeing rain and thinking your barbecue caused it."  

  ---

  #### **Phase 4: Level Up (Optional, 5 mins)**  
  *Only if they’re hooked:*  
  - **Death’s 80% Accurate:**  
    - "If Death’s right 8/10 times, staying or fleeing *still* feels lose-lose. But calculate: if you always stay, Death predicts that—kills you 80% of the time. If you flee, same. Randomizing? Death’s accuracy drops to 50%. You win."  

  - **Three Towns:**  
    - "Add Palmyra. Death predicts your #1 choice. If you pick Damascus → it’s there (you die). But if you *randomize* (33% each), Death must guess—now your odds jump to 66% survival."  

  ---

  #### **Close: The Test Question & One-Liner**  
  - **Final Question:**  
    *"You flip a coin for heads/tails. Before you look, would you bet £100 on heads at even money? Why/why not?"*  
    - **If they get it:** They’ll say "No—because I already flipped, the outcome is fixed. Betting now is stupid." That’s the Damascus moment: your choice gives info the "bet" is already lost.  

  - **Your Killer Closing Line:**  
    \answer{A coin flip you've already made but haven't seen}  

  ---

  ### **Why This Works**  
  - **Uses their skills:** Framed as odds/betting, not philosophy.  
  - **Shuts down derailments:** Pre-answers "flip a coin" and "prediction is fake".  
  - **Makes it tangible:** Envelopes, horse races, poker decisions.  
  - **The coin flip example** is your workhorse. Hammer it:  
    - *"Your choice in Damascus is like betting on a coin after it’s flipped but hidden. Heads you live, tails you die. If you ‘choose’ heads, it feels rigged—because it is. Death already flipped it."*  

  You’ve got this. They’ll argue—let them. When someone smirks "flip a coin," drop the mic: "Exactly. Philosophers call it ‘mixed strategies.’ We call it not being a donkey."
