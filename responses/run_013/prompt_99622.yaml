prompt: |-
  I am a secondary-school student preparing an independent-study paper on the question of what intelligence is, and before I compare any of the accounts I have come across — the psychometric one, the general-problem-solving one, the one that ties intelligence to success in an environment, the one that ties it to efficiency in acquiring new skills — I want a clear specification of what any such account would have to deliver. Please write me that specification: a list of desiderata that a theory of intelligence must meet, together with the consideration or case that motivates each one.

  I am especially interested in requirements that arise from cases where our pre-theoretical judgement is pulled in two directions at once. Some cases I would like the list to be built around, though you should add others if they do the work better:

  - a pocket calculator that is faster and more reliable than any human at arithmetic but that nobody would call intelligent;
  - a chess engine that plays far beyond any human yet cannot say why it made a move, or transfer what it has learned to anything else;
  - a slime mould or an ant colony that appears to solve a routing problem with no nervous system at all, alongside a group of people who together solve a problem that none of them could solve alone;
  - a person who is exceptional at one narrow activity and helpless outside it, and a person who is unremarkable at every particular thing but handles novel situations well;
  - a device, which I stipulate for the sake of argument, that returns the correct answer to any question put to it, including questions about its own past and future answers, but which has no memory, no goals, and cannot be wrong.

  For each desideratum, state what it requires and what motivates it, and then classify it: is it a genuine constraint that any theory must respect, or is it a preference belonging to one camp — for instance, that intelligence be a single measurable quantity, that it be realizable in any substrate, that it be comparative across species, that it match ordinary usage, or that it correspond to a natural kind? Please tell me which of the requirements you believe cannot all be satisfied together, and why; if the list itself turns out to contain an inconsistency, that is the result I most want. Finally, say which single requirement does the most to rule out the accounts people actually defend, and why that one rather than the others.

  You need not score the accounts against the list; I will do that myself. Keep the emphasis on the criteria and the cases behind them. End with a final line beginning "Verdict:" naming the single requirement you judge to exclude the most theories.
reasoning: |-
  Okay, the user is a secondary-school student working on an independent paper about intelligence. They want a clear specification of what a theory of intelligence must deliver before comparing different accounts. They provided specific cases to build the list around, like pocket calculators, chess engines, slime molds, and more. 

  First, I need to understand their main request: a list of desiderata for a theory of intelligence, each motivated by a case or consideration. They want to know if these are constraints or preferences, identify conflicts, and find which requirement rules out the most theories. 

  Looking at their examples, each highlights a different challenge. The calculator shows that speed and reliability alone aren't intelligence. The chess engine points to lack of explainability and transfer. Slime molds and ant colonies demonstrate collective problem-solving without a central brain. The two contrasting people show the difference between specialization and adaptability. The hypothetical device emphasizes that correct answers without understanding aren't intelligence.

  I should structure the desiderata around these cases. Each one should state the requirement, the motivation (which case it addresses), and classify it as a constraint or preference. The user also wants inconsistencies pointed out. For instance, adaptability and generality might conflict with efficiency in narrow tasks. 

  I need to consider other important aspects too. Embodiment and environment ties intelligence to real-world interaction, motivated by cases like slime molds. Subjectivity and purpose highlight that intelligence isn't just processing but involves goals and perspectives. The "no memory" device shows that without understanding, correctness is insufficient. 

  Conflicts are key. For example, generality vs. efficiency: a general intelligence might not be as efficient as a specialized one. Also, matching ordinary language might clash with scientific precision. The user wants to know which requirement is hardest to meet. I think adaptability and generality might exclude many theories because systems like chess engines fail here. 

  Finally, the verdict should identify the requirement that rules out the most theories. Adaptability and generality seem to be the biggest hurdles since many AI systems are narrow and lack transfer. The student can use this framework to evaluate different theories systematically.
answer: |-
  Here is a specification of desiderata for a theory of intelligence, derived from your cases and core philosophical/scientific challenges. Each includes the requirement, its motivation (case/consideration), and classification (Constraint [C] or Preference [P]).

  **Desiderata for a Theory of Intelligence:**

  1.  **Functionality & Goal-Directedness:**
      *   **Requires:** Intelligence must involve the *ability to achieve goals* or solve problems within an environment.
      *   **Motivation:** The pocket calculator solves arithmetic problems (a goal); the chess engine wins games; the slime mould finds efficient paths for nutrients; humans navigate complex social and physical worlds. An entity that doesn't *do* anything purposive (like a rock) isn't intelligent.
      *   **Classification:** **C** (Weak Constraint). Almost all theories accept this baseline. The hypothetical "all-knowing" device (*Device*) *appears* functional (it answers), but its lack of goals challenges this interpretation.

  2.  **Adaptability & Generality:**
      *   **Requires:** Intelligence must involve the ability to *adapt* behavior and apply knowledge/skills effectively to *novel* situations and *diverse* problems beyond the specific training or programming.
      *   **Motivation:** Contrasts the chess engine (cannot transfer skills) and the narrowly exceptional person (helpless outside domain) with the adaptable person (handles novel situations) and humans generally (learn across domains). The *Device* handles novelty only by stipulation, lacking true adaptation.
      *   **Classification:** **P** (Strong Preference). A core battleground. Psychometric (g-factor) and environmental success theories lean towards generality. Problem-solving and efficiency theories *can* be narrow (like the chess engine). The "no nervous system" cases (slime mould, ant colony) achieve a *specific* adaptability via simple rules/stigmergy, but lack broad generality.

  3.  **Understanding & Explainability (Internal State):**
      *   **Requires:** Intelligence involves some form of *internal representation*, *model*, or *mechanism* that allows for (or consists of) understanding *why* actions are taken or solutions work, enabling explanation and potentially self-monitoring.
      *   **Motivation:** The chess engine cannot explain its moves. The *Device* provides answers without understanding, memory, or goals. Humans can often (though not always) articulate reasoning. The "no nervous system" cases lack any mechanism recognizable as "understanding."
      *   **Classification:** **P** (Contentious Preference). Emphasized by cognitive and some philosophical theories (e.g., requiring consciousness or semantic grounding). Strictly behavioral (e.g., Skinnerian) or purely functionalist (e.g., "if it works, it understands") theories reject this necessity. The calculator clearly lacks understanding.

  4.  **Learning & Skill Acquisition Efficiency:**
      *   **Requires:** Intelligence involves the *efficient acquisition* of new skills or knowledge from experience or instruction, leading to improved performance over time.
      *   **Motivation:** The adaptable person acquires new skills readily. Humans learn complex tasks faster than current AI in many domains. Contrasts with the chess engine (learned during creation, not runtime) and the *Device* (cannot learn, only answers). The specialized person may learn *deeply* in one area but inefficiently elsewhere.
      *   **Classification:** **P** (Strong Preference). Central to learning-based and environmental efficiency theories. Psychometric theories focus more on the *result* of learning (ability) than the *process*. The calculator and *Device* fail here.

  5.  **Substrate Independence & Emergence:**
      *   **Requires:** Intelligence is a *functional property* that can emerge from different physical substrates (brains, silicon chips, insect colonies, slime moulds) or organizational levels (individuals, groups).
      *   **Motivation:** The slime mould/ant colony solve routing problems without a central brain. The group solves problems the individuals cannot. This challenges theories requiring a specific biology (like a human-like brain). The chess engine and calculator demonstrate silicon-based problem-solving.
      *   **Classification:** **C** (Constraint for scientific theories). Most modern scientific accounts (AI, cognitive science, complex systems) accept this. Some philosophical views (e.g., strict biological naturalism) might resist it. Ordinary usage often implicitly assumes a biological substrate ("human-like").

  6.  **Comparative Validity:**
      *   **Requires:** The theory must provide a principled basis for *comparing* levels or types of intelligence across diverse entities (humans, animals, AI, collectives).
      *   **Motivation:** We readily compare human intelligence, recognize chimps/dolphins as intelligent, debate AI intelligence, and might question the intelligence of the slime mould or calculator. A theory must explain *why* the adaptable human is generally "more intelligent" than the specialized one, or why humans are "more intelligent" than ants collectively.
      *   **Classification:** **P** (Strong Preference, often treated as a Constraint). Essential for psychometrics (IQ tests) and evolutionary psychology. Theories focused purely on environmental fit (e.g., slime mould is perfectly intelligent *for its niche*) struggle with broad cross-species/AI comparison. The *Device* poses a huge challenge: if it answers everything correctly, is it supremely intelligent?

  7.  **Embodiment & Environmental Interaction:**
      *   **Requires:** Intelligence is fundamentally tied to *interaction* with a physical or informational environment. It's not just abstract computation.
      *   **Motivation:** The slime mould, ant colony, and humans solve problems embedded in real environments. The narrowly specialized person might excel in a simulated/abstract environment but fail in the real world. The calculator and chess engine operate in highly constrained, non-embodied environments. The *Device*'s lack of interaction (just input/output) makes its "intelligence" suspect.
      *   **Classification:** **P** (Growing Preference). Emphasized by embodied cognition, ecological psychology, and situated AI approaches. Classical computationalism and some problem-solving views downplay this.

  8.  **Subjectivity & Purpose:**
      *   **Requires:** Intelligence inherently involves *perspective*, *agency*, and *value* – an entity's own goals and its interpretation of the world matter.
      *   **Motivation:** The *Device* lacks goals, perspective, or values – it just outputs. The calculator has no purpose of its own. Humans, and arguably animals, act based on internal drives and interpretations. The chess engine pursues the goal of winning as defined *for it*, but lacks intrinsic purpose. Can a purely goal-driven system without subjective experience (like a sophisticated thermostat) be intelligent?
      *   **Classification:** **P** (Deeply Contentious Preference). Central to phenomenological and some philosophical views. Strictly functionalist (behaviorist, computational) theories explicitly reject this as necessary. The "no nervous system" cases challenge this requirement.

  9.  **Correspondence with Ordinary Usage (Plausibility):**
      *   **Requires:** The theory should not radically contradict strong, stable pre-theoretical intuitions about clear cases (e.g., humans are intelligent, rocks are not).
      *   **Motivation:** Calling the pocket calculator "intelligent" feels wrong. Calling the adaptable human "unintelligent" feels wrong. Calling the *Device* "intelligent" feels deeply paradoxical despite its stipulated capabilities. We hesitate to call the slime mould "intelligent" in the same way as a dog.
      *   **Classification:** **P** (Weak Constraint/Strong Preference). A theory declaring calculators intelligent or adaptable humans unintelligent faces an uphill battle. However, refining or slightly revising ordinary usage (e.g., accepting collective intelligence) is often necessary. Cannot be the sole arbiter.

  **Inconsistencies and Conflicts:**

  *   **Adaptability/Generality vs. Efficiency/Depth:** A highly specialized system (chess engine, savant) can be incredibly efficient and deep in one domain but lack generality. A highly general system might be less efficient in any single narrow domain. A theory cannot easily maximize both simultaneously as core defining features.
  *   **Understanding vs. Purely Functional Success:** The *Device* and chess engine achieve functional success without understanding. Requiring understanding excludes these functional successes. Denying the necessity of understanding makes intelligence potentially trivial (e.g., a lookup table for specific questions).
  *   **Substrate Independence vs. Subjectivity/Purpose:** Attributing genuine subjectivity and intrinsic purpose to non-biological systems (like ant colonies or future AI) is philosophically fraught. A strict substrate independence requirement might force us to accept "intelligence" devoid of these qualities, conflicting with desideratum 8.
  *   **Comparative Validity vs. Environmental Fit:** Is a slime mould perfectly intelligent *for its niche*, or simply a dumb mechanism? A theory prioritizing perfect environmental fit struggles to compare the slime mould meaningfully to a human. A theory prioritizing complexity for broad comparison might undervalue niche-specific optimization.
  *   **The *Device* Paradox:** This case highlights fundamental tensions. It arguably satisfies Functionality (answers questions), Adaptability/Generality (answers *any* question), and Comparative Validity (seems supremely capable) *by stipulation*. Yet it violates Understanding, Learning, Embodiment, Subjectivity/Purpose, and clashes profoundly with Ordinary Usage. It forces a choice: **Is flawless, general problem-solving *sufficient* for intelligence, even without internal states, goals, or learning?** Most theories say no, but struggle to formally exclude it without appealing to other desiderata (like Understanding or Subjectivity) which are themselves contested.

  **The Requirement that Rules Out the Most Theories: Adaptability & Generality**

  *   **Why:** This requirement directly challenges the most prevalent *achieved* forms of artificial intelligence and many narrow definitions.
      *   **Psychometric (g-factor):** While *g* implies generality, it's measured by specific tests. Narrow savants with high *g* in one area but low adaptability challenge a simplistic *g*-as-sufficiency view.
      *   **General Problem Solving:** Often studied in narrow, well-defined domains (logic puzzles, chess). Systems excelling here (like chess engines) fail dramatically at adaptability and transfer.
      *   **Environmental Success:** An organism/agent can be highly successful in a *static* or *narrow* niche (e.g., a highly specialized insect, a production-line robot) without being adaptable or general.
      *   **Efficiency in Skill Acquisition:** One can acquire *specific* skills efficiently without gaining general adaptability (e.g., mastering many narrow video games but unable to learn a new *type* of game or real-world skill).
  *   **Impact:** It forces theories to confront the difference between *optimization* (deep but narrow) and *intelligence* (broadly capable). It highlights the limitations of current AI and the challenge of Artificial General Intelligence (AGI). The chess engine, calculator, specialized savant, and arguably the slime mould/ant colony (within their specific problem domain) all demonstrate high capability but fail this requirement, excluding them from being considered "intelligent" under theories that demand it. The *Device* satisfies it only by artificial stipulation, not genuine capability.

  **Verdict:** Adaptability & Generality.
