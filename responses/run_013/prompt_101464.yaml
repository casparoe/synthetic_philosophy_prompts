  I'm TAing the first meeting of a grad seminar on rationality and I want a one-page decision tree that takes a student from 'the standard argument that rational agents must maximize expected utility seems basically right' to a specific view of what that argument actually establishes. Build the nodes out of the assumptions rather than out of the authors: does the agent need determinate degrees of belief at all, or only preferences that can be represented as if she had them; are the preference axioms (completeness, transitivity, independence, the sure-thing principle) meant as requirements of rationality or just as idealizations; does the argument show that the agent is exploitable, i.e. that someone can take her money for sure, or only that her state is defective in some weaker way (no coherent completion, dominated for accuracy, not representable at all); is the claim about individual acts or about adopting a policy or plan; and does it survive cases with unbounded or infinite payoffs, values that never trade off against each other, or a person who cares about how a gamble weights the outcomes and not just about which outcome it lands on. Each leaf should get one sentence and a name only if there's a standard one, plus its most awkward commitment -- especially the price of saying that the exploitation never actually happens to real people, or that 'must' here is only a claim about how to build a model. Note which combinations of answers come out unoccupied and say whether that's because the view is incoherent, unattractive, or just unexplored, and flag any two leaves your tree can't seperate. Around seven nodes, ten leaves max, and phrase every node so a student can answer it without already knowing which position it leads to.
