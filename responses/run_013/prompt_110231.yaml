prompt: |-
  I'm in this awkward spot where I've read enough philosophy of biology to have opinions about the units of selection debate but not enough to know whether my opinions hang together, so I want to dump my gut verdicts on a pile of cases and have you tell me what principle, if any, they add up to. Here's what I think. A gene that makes its bearer have more kids: that's selection, sure, and I genuinely don't care whether we call the gene or the organism the unit, nothing seems to ride on it. A gene that spreads through a population while making its bearers worse off — the classic meiotic drive / segregation distorter sort of case — I want to say that's selection acting on the gene, full stop, and the organism is basically a vehicle it's driving around. Sterile workers in a social insect colony: individual fitness is zero, the colony thrives, and I'm fine saying selection is acting at the level of the colony here, or at least at the level of the family, not just on the genes inside each worker. Somatic cells in a tumour, dividing when they shouldn't, killing the body that hosts them: I want to say that's not really selection, or if it is it's a degenerate case, and I get suspicious when people call it selection at the level of the cell. A heritable trait that's good for the species but lowers the fitness of every individual that has it: I think that's almost always a confused way of talking and I'd rather deny the thing exists. And then the one that actually keeps me up — human groups with norms that punish free-riders, which seem to outcompete groups that lack them: I find myself wanting to say yes, that's group selection, cultural group selection, it's real. And I notice I have no principled reason for allowing it there and not in the tumour case except that I like the conclusion.

  So: is there a principle that gets all six, or close? I suspect the honest answer is that my gene verdict and my group verdict pull in the same direction, and my tumour verdict and my good-of-the-species verdict pull against them, so I can't have it both ways — I either admit cell-level and group-level selection as the same kind of thing as gene-level selection, or I demote the gene one too and say it's all bookkeeping about fitness effects with no fact of the matter about levels. Tell me which, and dont be gentle about which of my verdicts has to go.

  Once you've given me the principle, run it on a couple of cases I haven't listed — a transposable element that copies itself around the genome at a cost to its host, say, and a behaviour that spreads because people imitate it rather than because it helps anyone survive. And flag anywhere I'm quietly smuggling in a criterion I haven't noticed I'm using, like replicator vs. beneficiary vs. real causal level, since I have a feeling that's where the inconsistency is actually coming from. I'd rather have one clean principle with a verdict I have to swallow than a complicated one that saves everything I said.
reasoning: |-
  Okay, let me unpack this user's dilemma. They've clearly wrestled with the units of selection debate and have strong intuitions about specific cases, but feel these intuitions might conflict. The core tension seems to be between their willingness to accept gene-level selection (meiotic drive) and group-level selection (human cultural groups) while rejecting cell-level selection (cancer) and species-level selection. 

  Hmm... what's interesting is their self-awareness about potential inconsistency, especially noting how their "like" of cultural group selection might bias them. That's unusually meta for this type of inquiry. They're explicitly asking to be called out, which suggests intellectual honesty but also some frustration. 

  Looking at their cases: the acceptance of sterile workers as colony-level selection aligns with mainstream multilevel selection theory, but their rejection of cancer as cell-level selection stands out. I suspect the unstated criterion here is about functional integration - they intuitively see insect colonies as cohesive units but tumors as pathological breakdowns. The species welfare trait rejection makes sense under standard individual selection models, but their cultural group selection acceptance requires special explanation.

  Ah! The key might be whether the entity has evolutionary individuality - heritable variation in fitness that isn't reducible to lower levels. For the tumor: somatic cells lack heritability (no germline transmission). For cultural groups: institutions/practices can have differential persistence. For meiotic drive: the gene maintains its structure across generations. This framework would force them to accept transposable elements as gene-level selection (heritable variation in copying success) but reject behavioral imitation as individual-level selection unless it affects biological fitness.

  Their "vehicle" language suggests Dawkins influence, but they're straining against its limitations. I should emphasize that their tumor intuition is defensible not because selection isn't happening, but because somatic cell lines lack the heritability requirement for being evolutionary units. The cultural case survives because norms can have cultural inheritance. 

  Biggest challenge will be explaining why sterile insect workers count - need to frame it as the colony having "offspring colonies" with heritable traits. Might need to gently point out that their gene/organism indifference contradicts their tumor resistance, and that consistency requires either embracing all levels or adopting a stringent individuality criterion. The replicator/vehicle distinction alone won't save all their intuitions.
answer: |-
  Here's the clean principle that best reconciles your intuitions while exposing the inconsistency you sensed:

  **Principle of Heritable Evolutionary Individuality (HEI):**  
  *Selection acts at level X if and only if X is an entity that:  
  (1) Exhibits heritable variation in fitness,  
  (2) Where that fitness variation is causally decoupled from the fitness interests of lower-level entities that comprise it.*  

  Now let's apply this ruthlessly to your cases:

  1.  **Gene for more offspring:** ✅ *HEI satisfied.* Gene has heritable variation in fitness (copies passed on). Fitness *isn't* fully determined by organism fitness (e.g., meiotic drive proves decoupling).
  2.  **Meiotic drive gene:** ✅ *HEI satisfied.* Heritable variation in gene fitness (spreading despite organism cost). Clear decoupling from organism fitness.
  3.  **Sterile insect workers:** ⚠️ **Your verdict conflicts with HEI.** Colony ✅ (heritable variation in colony fitness via queen reproduction; worker sterility decouples their fitness from colony fitness). Individual worker ❌ (fitness=0, no heritability). *Conclusion:* Selection acts **at colony level**, not individual or gene level *for the worker trait*. Your instinct was correct.
  4.  **Cancer cells:** ❌ **Your verdict is inconsistent.** *HEI satisfied for somatic cell lineage.* Heritable variation in cellular fitness (mutation-driven proliferation). Fitness decoupled from organism fitness (cells thrive while organism dies). *Conclusion:* This **IS clear cell-level selection.** Your "degenerate case" intuition must go. It *is* pathological, but still selection.
  5.  **"Good for species" trait:** ❌ **Your verdict upheld.** *HEI not satisfied.* No heritable variation *at species level* for this trait (species don't reproduce as cohesive units with heritable traits). Fitness effect reducible to individual fitness costs. *Conclusion:* Not species-level selection. Your "confused talking" instinct is correct.
  6.  **Human cultural groups:** ✅ **Your verdict upheld (with caveat).** *HEI potentially satisfied IF:* Groups have heritable variation in fitness (e.g., group survival/migration/reproduction) AND the *cultural norm* persists/replicates *because* of group success (not just individual benefits). *Conclusion:* **Plausible cultural group selection** *if* cultural inheritance mechanism exists.

  **The Inconsistency Exposed:**  
  Your **tumor vs. group** conflict arises because you (likely) smuggled in an **"organismal benefit" or "functional integration"** criterion unconsciously. Tumors harm the organism; functional human groups (arguably) benefit it. *HEI removes this bias.* Selection cares about heritable fitness differences, not benefit to higher levels. The tumor *is* selection, just like meiotic drive.

  **New Cases Tested by HEI:**

  7.  **Transposable Element (TE):** ✅ *HEI satisfied.* TE has heritable variation in fitness (copy number in germline). Fitness (copying success) is decoupled from host organism fitness (often costly). *Conclusion:* **Gene-level selection** (TE as "selfish gene").
  8.  **Neutral Cultural Trait (e.g., a meme spread by imitation alone):** ⚠️ *Depends on mechanism.*  
      *   If trait spreads *only* via individual imitation advantage (e.g., catchy tune): ❌ HEI not satisfied. Selection at **individual level** (cognitive attraction).  
      *   If trait spreads *because* groups with high prevalence outcompete other groups (e.g., a ritual enhancing group cohesion): ✅ HEI potentially satisfied. **Cultural group selection.**

  **What You Must Sacrifice:**  
  Your **tumor verdict must go**. HEI forces you to accept somatic cell lineages undergoing selection *is* genuine cell-level selection, analogous to meiotic drive. It's not "degenerate"; it's a clear instance where the cell lineage is the evolutionary individual under HEI. Pathology ≠ not-selection.

  **Why This Principle Works:**  
  *   **Heritable Variation:** Captures the core of Darwinism.  
  *   **Causal Decoupling:** Identifies when a new level emerges. If lower-level fitness *always* perfectly predicts higher-level fitness, the higher level isn't a distinct unit (e.g., your "good for species" case). Decoupling allows conflict (genes vs. organisms, cells vs. organism, groups vs. individuals).  
  *   **"Individuality":** Focuses on entities with bounded inheritance and fitness. Genes, cell lineages, organisms, colonies, cultural groups *can* be individuals in this sense. Species usually aren't.

  **The Brutal Conclusion:**  
  You *can* have most of your intuitions (genes, meiotic drive, colony selection, cultural groups, rejecting species selection) – **but only if you accept the tumor as valid cell-level selection.** The inconsistency was your unstated requirement that selection must align with organismal/functional benefit. HEI jettisons that. Selection is amoral: it acts wherever heritable fitness differences exist, even in "selfish" somatic cells or parasitic genes. The levels are real because decoupling creates genuine evolutionary actors with their own fitness interests.
