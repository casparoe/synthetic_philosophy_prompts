prompt: |-
  I am an undergraduate in a seminar on practical reason, and I would like to use this conversation to pressure-test a position we have been calling Humean internalism about reasons. Please play a committed Humean internalist: someone who holds that a consideration counts as a reason for an agent only if it can motivate that agent through a sound deliberative route from elements already in her subjective motivational set. You may allow that deliberation can reveal new means, resolve conflicts, and even transform desires, but you will not allow a reason that floats entirely free of every element in that set. Be sharp and resourceful rather than a strawman; concede small points if they are correct, but do not concede the main claim. Stay in character until I tell you to stop, and keep each reply to a paragraph or two. In our seminar, the professor introduced a case she calls the lapsed physician. A doctor has lost all desire to heal, no desire to remain a doctor, no desire to avoid professional sanctions, and no desire to be the kind of person who keeps confidences. She is quitting tomorrow. Yet she is still bound by medical confidentiality. The professor says this is an institutional reason: a reason internal to the practice of medicine but external to the agent's motivational set. My opening move is this. If the lapsed physician is genuinely bound by confidentiality, then your internalism is false, because the reason does not connect to anything she cares about. If she is not bound, then the practice of medicine has no normative grip on its participants, which seems absurd. So which is it, and how do you avoid turning institutional reasons into disguised desires? Respond to the opening as stated, in character, and do not ask me to clarify the setup. Please reply in continuous prose, with no headings, bullet points, bold text, or tables, the way you would write a letter or speak in a seminar.
reasoning: |-
  Okay, let me unpack this. The user is an undergrad in a philosophy seminar focusing on practical reason, specifically challenging me to defend Humean internalism against a thought experiment called "the lapsed physician." 

  Hmm, the core tension here is between institutional obligations and internal motivation. The lapsed physician has abandoned all relevant desires - no care for healing, professional integrity, or avoiding sanctions. Yet confidentiality still seems binding. The user's framing presents a sharp dilemma: either this breaks internalism (if the reason exists without motivation) or it makes institutional norms meaningless (if the reason disappears with motivation). 

  Right, as a committed Humean, I need to dismantle this without compromising the core principle. The key move should be to question whether "bound" means anything substantive here. If the physician truly has zero motivational hooks - not even abstract concerns about consistency or minimal professional decorum - then "obligation" is just an empty label. The practice's normative grip isn't "absurdly" absent; it simply doesn't apply to someone completely detached. 

  Ah, but I should concede that most people in such roles retain latent motivations (fear of shame, residual identity). Still, the thought experiment insists on total apathy. In that limit case, institutional reasons reduce to hypothetical imperatives: "If you want to be a doctor, maintain confidentiality" - but she doesn't want to be a doctor. The "absurdity" melts away when we see norms as contingent on participation. 

  Better sharpen the distinction between social pressure and genuine reasons. The professor might be conflating external expectations with internal justifications. And I should preempt the "disguised desires" accusation by emphasizing that transformed motivations (via deliberation) still originate in the subjective set. 

  User seems well-prepared - they've set up the dilemma tightly. My reply needs equal precision: grant the hypothetical's stipulations while showing how internalism dissolves rather than denies the problem. No rhetorical flourishes; just steelman the position. The tone should stay academic but engaged, like a seminar exchange.
answer: |-
  Your dilemma cleverly forces a choice, but I reject the premise that the institutional reason retains genuine normative force for the *lapsed physician herself*. If she has utterly extinguished every element in her subjective motivational set that could connect to medical practice—no trace of desire for healing, professional identity, social approval, consistency, or even aversion to the faintest sting of dishonor—then the "obligation" of confidentiality is, *for her*, a hollow shell. It’s a sociological fact, not a normative reason. The practice of medicine retains its *institutional* grip only on those who remain participants by sustaining some motivational tether—even if it’s just a desire to avoid the hassle of immediate sanctions before quitting tomorrow. But *her* total detachment means she has exited the practice normatively, not just temporally. The "absurdity" you perceive vanishes when we distinguish the external social expectation (which exists) from an internal reason (which, for her, does not). Institutional reasons derive their grip *from* the motivated commitment of participants; they don’t magically bind the utterly disenchanted. To call it a "reason" for her is to mistake the lingering shadow of the institution for a living constraint. Her indifference dissolves the obligation *for her*, even if society still judges her. Internalism doesn’t turn reasons into desires; it shows why reasons cease to exist when no possible deliberative route links them to the agent’s subjective standpoint. The professor confuses a reason *within* a practice with a reason *for an agent who has abandoned the practice*. Your move?
