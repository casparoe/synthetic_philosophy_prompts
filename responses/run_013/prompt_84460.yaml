answer: |-
  ### Exam Question (118 words)  
  **Evaluate how the Buddhist doctrine of *anattā* (no-self) challenges the consequentialist aggregation of welfare in the following case:**  
  *A healer must choose between:  
  (1) Curing 30 plague victims now, preserving their psychological continuity; or  
  (2) Saving 5 victims using a treatment that erases their memories and severs psychological continuity.  
  Does *anattā* alter the moral weight of saving the 5? The 30? If these weights change asymmetrically, can Buddhist consequentialism avoid incoherence? Address whether disputes about "boundaries" between beings reduce to verbal disagreements about "persons," or if they reveal a substantive conflict in grounding ethics.*  

  ---

  ### Model Answer (650 words)  
  The *anattā* doctrine denies any enduring, substantial self. Conventional "persons" are pragmatic constructs, not metaphysically real boundaries. This radically destabilizes consequentialist aggregation, which typically sums welfare across discrete individuals.  

  **The Boundary Problem for Aggregation**:  
  If persons are fictions, the distinction between "my suffering" and "yours" lacks ultimate reality. Like the arbitrary division between "Tuesday-me" and "Wednesday-me," the separation between beings is conventional (*saṃvṛti*). Consequently:  
  - **Saving the 5 (with discontinuity)**: Their post-treatment existence lacks psychological connection to the "persons" who sought aid. A strict reading of *anattā* suggests the "five persons saved" is a misdescription: there are only causally discontinuous mental states. If welfare requires a persistent subject (as some utilitarians assume), saving them might *not* preserve welfare at all. Alternatively, if welfare adheres to momentary experiences, the five new streams of consciousness still hold value.  
  - **Saving the 30 (with continuity)**: Though equally lacking a true self, their uninterrupted stream of consciousness maintains the *appearance* of enduring persons. This strengthens the pragmatic case for counting them conventionally—but *anattā* implies this continuity is as illusory as personal identity.  

  **Asymmetric Changes?**  
  *Anattā* may reduce the weight of saving the 5 more than the 30. The discontinuity in the 5 makes their conventional personhood harder to sustain, weakening the intuition that "someone" was saved. Yet for the 30, continuity preserves the fiction of persistence, making aggregation seem intuitive. If Buddhist consequentialism accepts this asymmetry, it risks incoherence: it selectively relies on the conventional reality of persons *only when convenient*. If persons are unreal, discontinuity should be irrelevant—all welfare moments matter equally, regardless of illusory connections.  

  **Verbal Dispute or Substantive Conflict?**  
  Claiming this is a "verbal dispute" about the word "person" ignores the metaphysical stakes. The disagreement is substantive because:  
  1. **Grounding Welfare**: If welfare requires a subject (even conventionally), the 5 may not qualify as "beneficiaries." If welfare is subjectless (e.g., valenced experiences without owners), the 5’s treatment remains valuable.  
  2. **Scope of Compassion**: *Anattā* might expand concern to all sentient moments impartially, rendering *any* aggregation across conventional boundaries arbitrary. This pushes toward a non-aggregative ethics (e.g., minimizing worst sufferings regardless of "whose").  
  3. **Practical Implications**: Denying the 5’s moral weight contradicts Buddhist emphasis on relieving suffering *wherever it arises*. Insisting on personhood as a criterion reintroduces the very selfhood *anattā* undermines.  

  Thus, the boundary problem exposes a foundational tension: consequentialism cannot cohere with *anattā* while retaining standard aggregation. Either welfare must be redefined as ownerless experiences (making "saving persons" incoherent), or Buddhist ethics must abandon consequentialist summation altogether. The dispute is not verbal—it forces a choice between abandoning person-based aggregation or neutering *anattā*’s ethical force.  

  ---

  ### Marking Scheme (25 Total)  
  **A (21–25)** hits all core points, resolves the asymmetry incoherence, and refutes "verbal dispute" decisively.  
  **B (16–20)** identifies key issues but struggles with asymmetry or gives a superficial "verbal dispute" analysis.  

  1. **Explain *anattā*’s challenge to personal boundaries** (5 marks)  
     *Lose marks for:* Vague restatement of no-self without linking to aggregation.  
  2. **Analyze whether *anattā* changes the weight of saving the 5** (5 marks)  
     *Lose marks for:* Ignoring psychological discontinuity or treating it as irrelevant.  
  3. **Analyze whether *anattā* changes the weight of saving the 30** (5 marks)  
     *Lose marks for:* Assuming continuity preserves full moral weight unproblematically.  
  4. **Diagnose incoherence if weights change asymmetrically** (5 marks)  
     *Lose marks for:* Missing the tension between relying on/conventional persons selectively.  
  5. **Argue whether the "boundary" dispute is verbal or substantive** (5 marks)  
     *Lose marks for:* Claiming it’s "just verbal" without engaging welfare metaphysics; **A-grade requires** showing why rejecting personhood destabilizes aggregation itself.  

  **Key A/B Differentiator**: Point 5. **B answers** say "It’s verbal—we just define ‘person’ differently." **A answers** argue that *anattā* dissolves the ontological basis for summing welfare *across streams*, forcing a reconception of ethics (e.g., focus on dukkha-moments not "beings").
