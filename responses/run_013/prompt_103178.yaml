prompt: |-
  I keep running into the same situation and I've never found a word for it, so maybe you can help me out.

  Here's one instance. I do a bit of machine learning on the side. You train a net, then you want to know what it learned, so you go looking for a feature -- some direction in activation space that tracks something like "this input has a stripe" -- and you find one that predicts the output really well. Great. Then someone else analyzes the same net a totally different way, finds a different feature that also predicts the output really well, and the two features don't line up with each other. Neither one is just a decoding artifact, both survive held-out tests, and yet they seem to carve up the same computation into incompatible parts. So is the stripe-feature real or not? It feels like the honest answer is "real as long as that way of describing the net keeps earning its keep," which is definately not the answer I was taught for whether something is real.

  Second instance, less techy. In biology people talk about the gene for eye colour, and for practical purposes that's a real thing -- you can predict with it, you can breed for it -- but if you look at the actual molecular goings-on there's no clean little object sitting there that is the gene for eye colour. The useful description and the basic description don't match, and the useful one still works fine.

  What bugs me is the pattern across these cases. Something behaves like a real part of the world for predicting and explaining; you can be right or wrong about it; it's not just a convenient fiction you could swap out for any other story that's equally tidy; and yet it isn't in the world the way an electron or a table is, and whether it's there at all seems to depend on which way of describing the system you've adopted. And sometimes two incompatible ways of describing the same system are both like that.

  Is there an established name for this class of thing -- the entities that are real, but only relative to a way of describing, where the describing is judged by how well it predicts and compresses rather than by matching some bedrock? I'm not satisfied with "it's just instrumentalism," because these things seem to be true or false in a way fictions aren't, and I don't think "emergent" or "higher-level" is it either, since that still sounds like a fact about the world rather than about a description of it. If there's a name, tell me what it is and exactly what it covers. If there isn't, coin one, and give me the boundary cases -- what's in, what's out, and how it differs from the nearest things people already say. Dont just hand me a label; I want to know where the edges are.
reasoning: |-
  Okay, the user is dealing with a recurring philosophical and scientific problem. They described two main examples: one in machine learning with conflicting features predicting the same output, and another in biology with the "gene for eye color" concept. The core issue is about entities that are useful for prediction and explanation but don't map cleanly to fundamental physical descriptions. They want a precise term for this phenomenon, with clear boundaries.

  First, I need to unpack their examples. In ML, two different features both predict well but are incompatible. Neither is an artifact; both work on held-out data. The stripe-feature is "real" as long as it's useful. In biology, the gene for eye color is practical for breeding but isn't a discrete molecular entity. The pattern: entities that are real in terms of predictive utility but depend on the descriptive framework.

  The user rejects "instrumentalism" because these entities aren't mere fictions—they have truth value. "Emergent" or "higher-level" doesn't fit because those imply an objective reality. They want something that captures the dependency on the descriptive framework. 

  I recall concepts like "quasi-realism" from philosophy, which deals with non-fundamental entities that are pragmatically real. Simon's "near-decomposability" might be relevant, but it's too structural. "Functional abstraction" or "explanatory context entity" could work, but need refinement. 

  The key is that these entities are context-dependent, tied to a purpose (prediction, explanation), and irreducible to single physical counterparts. They're not subjective, but their existence relies on the chosen model. Comparing to existing terms: "emergent" suggests objective levels, "instrumentalist" denies reality. "Model-dependent realism" (Hawking) is close but broad. 

  Coining a term: "Pragmatic Real Pattern" (PRP) might capture it—emphasizing utility and patterns. Or "Contextual Entity." Need to define boundaries. For example, a table is a PRP—useful description but just particles. Not a PRP: fundamental particles (objective), arbitrary fictions (no predictive power). 

  Check if "multiple realizability" in philosophy of mind applies—similar but about implementation. The user needs a term that includes both the ML and biology examples, where different descriptions are valid. 

  Finalizing: "Pragmatic Real Pattern" (PRP) as the coined term. Define its boundaries: in includes useful, context-dependent entities; excludes fundamental entities and mere fictions. Ensure it addresses the user's need for a term that acknowledges reality through utility without fundamental reduction.
answer: |-
  This is a profound and recurring issue cutting across science, philosophy of science, and metaphysics. You've perfectly identified the core tension: entities that are **robustly useful for prediction, explanation, and intervention** (so not *merely* convenient fictions), yet whose existence and nature **fundamentally depend on the chosen descriptive framework** and cannot be uniquely reduced to or aligned with fundamental physical constituents or other frameworks describing the same system. They are "real" relative to a purpose and a perspective.

  **The Established Name (with Caveats):**

  The closest established philosophical term is **"Quasi-Real" or "Quasi-Entity"**, often discussed within **Pragmatist Philosophy of Science** (e.g., Dewey, van Fraassen's later work, Ronald Giere) and strands of **Scientific Realism** focusing on models (like **Model-Based Realism**).

  *   **What it covers:** Entities (features, genes-for, mechanisms, concepts) that possess **epistemic robustness** (they support reliable predictions, interventions, and explanations within their domain) but lack **ontic fundamentality** (they aren't unique, irreducible building blocks of reality). Their "reality" is contingent on the **explanatory goals, modeling choices, and interventionist capabilities** of the inquirer.
  *   **Why "Quasi-"?** It signals they are *more* than just useful fictions (they have genuine causal/explanatory traction) but *less* than fundamental entities like electrons (their existence isn't framework-independent).

  **Why Established Terms Fall Short (As You Noted):**

  1.  **Instrumentalism:** Implies these are *only* useful calculational tools with no claim to representing reality. You're right to reject this – the stripe-feature *is* tracking *something* real in the net's processing, and the gene-for *does* correspond to *some* molecular difference causally linked to the phenotype. They aren't arbitrary symbols.
  2.  **Emergence / Higher-Level:** These terms focus on properties arising from complex interactions of lower-level parts. While quasi-realities are often emergent phenomena, "emergence" typically implies the higher-level property is *objectively there* once the lower level is arranged thusly (e.g., liquidity emerges from H₂O molecules). Your problem is that *multiple, incompatible higher-level descriptions* (stripe-feature A vs. stripe-feature B) can be robustly applied to the *same* lower-level system for the *same* purpose (predicting output). Emergence doesn't inherently capture the framework-dependence of the *description itself*.
  3.  **Model-Dependent Realism (Hawking & Mlodinow):** Comes close! It argues reality is only accessible through models, and different models can be useful for different purposes. However, it often focuses on grand physical theories (QM vs GR) and can be interpreted as *too* relativistic, potentially allowing *any* model that works. Your examples involve *competing models/descriptions within the same domain for the same purpose*, both robust but incompatible. MDR often lacks the granularity to handle this specific conflict.

  **A More Precise Coined Term: "Pragmatic Real Pattern" (PRP)**

  To capture the nuances you describe – the robustness, the framework-dependence, the purpose-driven nature, and the potential for incompatible-yet-valid descriptions – I propose coining the term:

  **Pragmatic Real Pattern (PRP)**

  *   **Pragmatic:** Emphasizes that the entity's "reality" is grounded in its *utility* for specific human purposes: prediction, explanation, compression, intervention (breeding, manipulating the net). Its validity is judged by its success in these practical endeavors.
  *   **Real:** Signifies it is not arbitrary or fictional. It corresponds to a detectable, stable, *causally relevant structure or regularity* within the system relative to the chosen descriptive lens. It supports counterfactuals (if X, then Y would happen).
  *   **Pattern:** Highlights that it's a discernible structure, regularity, or correlation identified *within a specific way of parsing and describing the system's data or behavior*. It's a "carving" of the phenomenon.

  **Defining the Boundaries of a Pragmatic Real Pattern (PRP):**

  | **Characteristic**          | **Inside PRP Boundary (Yes)**                                  | **Outside PRP Boundary (No)**                                                                 | **Why/Example**                                                                 |
  | :-------------------------- | :------------------------------------------------------------- | :------------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------ |
  | **Predictive/Explanatory Power** | Robustly supports predictions/explanations within its domain. | Fails predictive tests, purely decorative, or purely fictional.                             | Stripe-feature predicts output; "gene for eye color" predicts phenotype.        |
  | **Framework Dependence**    | Existence & nature depend on the chosen descriptive framework. | Exists independently of description (fundamentals) or is purely subjective.                  | Different ML analyses yield incompatible features; gene concept relies on trait focus. |
  | **Causal Relevance**        | Corresponds to causally potent differences in the system.      | Epiphenomenal, purely correlational with no lever for change, or imaginary.                  | Altering stripe-activation changes output; breeding "gene" changes phenotype.   |
  | **Resistance to Arbitrary Swap** | Not replaceable by any equally tidy story; specific utility. | Easily substituted with functionally equivalent alternatives without loss.                   | Not *any* feature will predict well; not *any* DNA label maps to phenotype utility. |
  | **Potential for Incompatibility** | Multiple valid PRPs can coexist for same system/purpose. | Only one "true" description exists; alternatives are simply wrong.                           | Both stripe-features work but conflict; molecular vs. Mendelian gene views.     |
  | **Level of Fundamentality** | Relates to higher-level organization/purpose.                 | Corresponds to fundamental physical constituents.                                            | Electron vs. "stripe-detector"; quark vs. "gene for eye color".                 |

  **How PRP Differs from Neighboring Concepts:**

  1.  **vs. Emergent Property:** An emergent property (like liquidity) is often considered objectively real once the parts are arranged. A PRP is a *description* or *identification* of a pattern *within* the emergent behavior, relative to a purpose. Liquidity is emergent; identifying "viscosity" or "surface tension" as distinct, useful properties *for specific purposes* makes them PRPs. Two scientists might identify *different* PRPs as the "key factor" in a complex emergent phenomenon like consciousness, both being pragmatically valid but incompatible.
  2.  **vs. Multiple Realizability (Philosophy of Mind):** MR says the *same* high-level function (e.g., pain) can be realized by different physical substrates. PRP is different: it's about *different high-level descriptions* (patterns, features) being robustly identifiable *within the same substrate* (same neural net, same genome) for the *same* functional goal (predicting output, explaining phenotype). MR is about implementation variance; PRP is about descriptive variance on a fixed implementation.
  3.  **vs. Instrumentalism:** Instrumentalism says "genes" or "features" are just tools, not representing anything real. PRP says they *do* represent something real *in relation to the framework and purpose* – a robust pattern with causal purchase. The stripe-feature *is* a real aspect of the net's *computational strategy* as parsed *that way*.
  4.  **vs. Perspectival Realism (Giere, Massimi):** This is very close! Perspectival Realism argues scientific knowledge is inherently tied to specific perspectives (theories, instruments, questions). PRP is a specific *type* of entity recognized *within* such a perspective – the robust, explanatory, intervention-supporting patterns. It operationalizes the "what is real from this perspective?" question Perspectival Realism poses. PRP is the *entity* counterpart to Perspectival Realism's *epistemological* stance.

  **In essence:** A Pragmatic Real Pattern (PRP) is a **framework-relative invariant**. It's a stable, useful structure discernible within a complex system *when you look at it a certain way for a certain purpose*. Its "reality" consists in its reliable utility and causal entanglement within that descriptive context, not in being a unique, fundamental building block. The existence of multiple, incompatible PRPs for the same system/purpose highlights the richness of complex systems and the fact that our useful descriptions often carve nature at joints that don't run all the way down to the fundamental level, yet are undeniably effective for navigating the world at the level we operate. Your stripe-feature and the gene-for-eye-color are paradigmatic examples of PRPs.
