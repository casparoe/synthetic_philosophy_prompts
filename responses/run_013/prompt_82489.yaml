prompt: |-
  Okay, longtime lurker here (I've been reading the rationalist blogosphere since the Sequences were still being posted) and I want to actually stress-test a view instead of just nodding along with it.

  Here's the position. Moral trade is real, it's legitimate, and its massively underused. Rough sketch in case it isn't obvious: you and I have different moral views, and each of us cares a lot about something the other is basically indifferent to. I think factory farming is the great moral atrocity of our time and I could care less about, say, drug legalization; you're the mirror image. So I vote, donate, and argue the way you want on drug policy, and you do the same for me on animals. Neither of us is lying about our values -- we're just trading. Comparative advantage, but for moral behavior. And since moral disagreement is about as widespread as anything in human life, the gains from trade should be enormous. I'm not saying we have to like each other's values, just that a world where people do this beats a world where they don't, by almost everyone's lights.

  So: what would count against this? I want a real map of its exposure, not a list of "some people find it icky." Which arguments, cases, formal results, or empirical facts should move me, ranked from fatal to merely awkward? What would defenders of moral trade themselves have to concede counts against them? And be honest with me about whether the view has been quietly qualified into something that risks nothing -- once you carve out coercion, third-party harms, and insincere signaling, is there anything left that could go wrong? If not, is that a problem, or is that just what a defensible view looks like?

  Things I'd especially like you to hit: (a) cases where the trade is voluntary, mutually beneficial, and nobody else is harmed, but it still seems obviously wrong -- vote-swapping schemes in tight elections, paying someone to change their vote, that kind of thing -- and whether I can distinguish those from the good trades without just gerrymandering; (b) the vise where either values are comparable (so everything has a price and my view collapses into "money buys politics") or they aren't (so "trade" is a category error and there was never a view here); (c) whether the whole thing is self-undermining, i.e. moral behavior might be valuable partly because it's sincere and expressive, and trading might erode exactly that; (d) how much of the payoff is empirical -- if it turns out almost nobody can actually find a trade partner, is my claim just weakened or actually falsified? The thing that would move me most personally is a case where I'm forced to either bless a trade that's plainly corrupt or admit my principle doesn't do the work I said it does.

  American English please. And go ahead and tell me if you think the position is well insulated -- I'd rather hear that than get a polite list of caveats.
reasoning: |-
  Okay, the user is a long-time rationalist community member who wants to stress-test their view on moral trade. They believe moral trade is underutilized and potentially beneficial, but they're seeking rigorous counterarguments. Let me break this down.

  First, the core idea: trading moral actions based on comparative advantage in values. The user wants me to attack this without pulling punches. They specifically asked about (a) vote-swapping paradoxes, (b) the comparability dilemma, (c) expressive value erosion, and (d) empirical viability. 

  Hmm, the vote-trading example is particularly sharp. If I trade votes with someone in a tight election where my swapped vote causes harm I deeply oppose, that seems to betray my own values - even if statistically beneficial. There's a tension between consequentialism and integrity here. The user might be underestimating how visceral this conflict feels.

  The comparability problem is deeper than they realize. Either all values can be traded (which leads to "everything has a price" dystopia) or none can (making trade impossible). Their attempt to carve out "sacred values" feels arbitrary - why are some values tradable but not others? This threatens the whole framework's coherence.

  On expressive value... they might not have considered how moral actions serve as identity signals. If I "rent out" my activism, it cheapens the signal. This could explain why people instinctively dislike moral trade - it feels like selling your soul, even if rationally beneficial.

  Empirically... how many people actually have perfectly mirrored moral indifference? Most care about multiple issues. Finding true "I care zero about X" partners might be rarer than they think. And the transaction costs of finding/monitoring such trades could eat up all gains.

  The corruption test case is clever. Paying someone to vote differently seems clearly wrong, but their framework might struggle to distinguish it from legitimate moral trade. If they can't explain why vote-buying is wrong while animal-rights-for-drug-policy swaps are okay, that's a serious flaw.

  What would really move them? Probably the integrity argument combined with the vote-buying case. Showing how their theory forces them to endorse something that feels fundamentally corrupt might be the strongest challenge. 

  The user seems genuinely open to having their view dismantled - rare for online debaters. They're not just seeking validation. I should avoid softening the blows while remaining precise. Their rationalist background means I can use technical terms like "preference laundering" without explanation.

  Notably, they dismiss "ick factor" objections but the expressive value argument isn't just ick - it's about social epistemic functions. That distinction matters. Also worth emphasizing that some defenses of moral trade (like Caplan's) actually embrace vote-selling implications rather than avoiding them.

  ...I think the deepest flaw is the unexamined assumption that moral indifference is symmetric enough to trade. In practice, our "indifferences" are rarely total - I might care slightly about drug policy even if it's not my top issue, making trade feel like betrayal. The model might require unrealistic psychological conditions.
answer: |-
  Here's a stress-test of moral trade, targeting its core claims without pulling punches. I'll rank objections from fatal to awkward, focusing on your key concerns and avoiding "ick factor" arguments. The position is **not** well-insulated—it has serious exposed flanks.

  ---

  ### **Fatal Problems (Threaten Core Validity)**
  1. **The Integrity Objection (Your "C" Point, Deeply Undermined)**  
     Moral actions derive value from *expressing sincere commitment*. Trading moral behavior commodifies it, eroding the social and psychological foundation that makes morality *meaningful*. If you trade your vote on drug policy for my animal activism:  
     - **Internally**: You perform an action you consider morally wrong (supporting bad drug policy) as a *calculated transaction*. This is preference *laundering*, not authentic moral expression.  
     - **Externally**: Society loses the signal of genuine moral conviction. If all activism is tradable, how do we distinguish between a committed advocate and a mercenary? This corrodes trust in collective action.  
     *Why fatal?* If moral behavior's value depends partly on sincerity, trading destroys that value. You can't salvage "gains from trade" if the thing being traded loses its essential character.

  2. **The Comparability Trap (Your "B" Point, Unresolvable)**  
     Moral trade requires comparing incommensurable values. Two disastrous outcomes:  
     - **If values are comparable**: Everything *does* have a price. Trading a vote on factory farming for a vote on drug legalization implies a common currency (e.g., "utility"). This collapses into crude utilitarianism where any moral act can be bought/sold (e.g., "I'll ignore human rights abuses if you fund my charity").  
     - **If values are incomparable**: Trade is impossible. Your indifference to drug policy isn't equivalent to my indifference to factory farming; they exist in separate moral universes. "Trading" is like bartering apples for justice—a category error.  
     *Why fatal?* Moral trade assumes a Goldilocks zone where values are *partially* comparable—enough to trade, but not so comparable that everything is for sale. No coherent theory defends this middle ground without arbitrary line-drawing.

  ---

  ### **Major Structural Flaws (Threaten Practical Coherence)**
  3. **The Vote-Swapping Paradox (Your "A" Point, Indistinguishable from Corruption)**  
     Consider a tight election where:  
     - You trade votes with me: I vote against my preferred drug policy (harming cause X), you vote against factory farming (harming cause Y).  
     - Outcome: Your swapped vote tips the election against drug reform, causing catastrophic policy.  
     *Problem*: This is functionally identical to **vote-buying**, differing only in the currency (reciprocal policy support vs. cash). Yet you must condemn cash vote-buying as corrupt. If you defend moral vote-trading, you cannot distinguish it from illicit markets in political influence. Any carve-out (e.g., "only for non-electoral acts") is arbitrary gerrymandering.  

  4. **The Third-Party Harm Blindspot**  
     Moral trade ignores *externalities on non-consenting parties*. Example:  
     - I trade my support for your anti-abortion campaign for your support on animal rights.  
     - Outcome: Abortion access is restricted for millions of women who never consented to this trade.  
     *Why devastating?* You dismissed "third-party harms" as fixable, but in moral trade:  
     - Harmed parties are *constitutive* of the moral issue (e.g., animals, drug users, women).  
     - You and your trade partner are outsourcing costs to vulnerable groups who can't veto the trade. This is not a bug—it's inherent to trading *others'* welfare.

  ---

  ### **Critical Empirical Failures (Your "D" Point, Undercuts Feasibility)**
  5. **The Partner Matching Problem**  
     Moral trade requires:  
     - Perfectly mirrored moral preferences (A cares intensely about X, *zero* about Y; B cares intensely about Y, *zero* about X).  
     - Trust that partners will fulfill bargains (no defection).  
     *Reality check*:  
     - True moral indifference is rare. Most people care *weakly* about many issues. If you care even 10% about drug policy, trading it feels like betrayal.  
     - Monitoring/enforcement is costly. How do you verify I donated to your cause? What if I lie about my values?  
     *Result*: Gains from trade are swallowed by transaction costs. In practice, this collapses into small cliques of ideologues trading with *actual* extremists (e.g., an animal rights activist trading with a militant prohibitionist).  

  6. **The Slippery Slope to Moral Nihilism**  
     If you endorse trading moral acts, you incentivize:  
     - **Moral apathy**: Why cultivate deep convictions if you can rent them out?  
     - **Exploitation**: Bad actors "sell" support for noble causes (e.g., "Pay me to oppose fascism, or I'll endorse it").  
     - **Weaponization**: Extremists trade to amplify harmful goals (e.g., a racist and a misogynist trading support to attack both targets).  
     *Outcome*: A marketplace where the most tradable morals win—not the most just, but those with the best comparative advantage in indifference.

  ---

  ### **Merely Awkward Challenges (Manageable but Costly)**
  7. **The "Cheap Talk" Dilemma**  
     Moral trade requires transparent signaling of values. But if trading is allowed, agents *understate* their true convictions to get better deals (e.g., "I only *slightly* care about animal rights" to pay less in trade). This destabilizes bargaining.  
     *Response*: Reputation systems could help, but add complexity.  

  8. **Inequity in Bargaining Power**  
     The wealthy/mighty can extract more favorable trades (e.g., a billionaire trading trivial support on niche issues for massive influence on core policies).  
     *Response*: Rules could cap trade scales, but invite gaming.  

  ---

  ### **The Corruption Test: What Forces Your Hand**
  **Case**: I pay you $10,000 to vote for Candidate X, who will legalize factory farming but also pass drug reform you want. You use the cash to lobby for animal rights.  
  - **If you endorse this**: You admit moral acts are fungible with money, collapsing into "money buys politics."  
  - **If you reject it**: You must explain why *money* is corrupt but *trading moral acts* isn't. The difference is semantic—both are outsourcing conscience for gain.  

  **Your principle fails here**: Either all forms of vote-trading are corrupt (sinking your core case), or none are (making you defend cash-for-votes). No middle ground survives without hypocrisy.

  ---

  ### **Conclusion: The Unavoidable Vulnerabilities**
  Moral trade isn't defensible without **major concessions**:  
  1. It only "works" if moral actions are purely instrumental (ignoring expressive value)—but then why care about morality at all?  
  2. It requires arbitrary boundaries to avoid endorsing vote-selling or extremism—but those boundaries lack principled foundations.  
  3. It collapses if values are either comparable or incomparable—no stable equilibrium exists.  

  **The strongest argument against you**: Moral trade optimizes for *efficiency* at the cost of *integrity*. A world full of moral traders might have more "wins" on paper, but it would be a world where no one believes in anything beyond transactional gain—and that erodes the very possibility of moral progress.  

  If you insist moral trade is legitimate, you must bite bullets: accept vote-buying, embrace moral fungibility, and concede that your view *does* risk everything. The insulation you hoped for isn't there.
