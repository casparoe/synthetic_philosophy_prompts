prompt: |-
  I keep going back and forth on how I size bets, and I want to know if there's one principle behind my gut or if I'm just fooling myself. Here's where I land:

  - A coin that comes up heads 60% of the time, paying even money. Putting my whole bankroll on one flip: awful. Betting a small fixed slice of it over and over: obviously fine.
  - Same coin, but I only ever get to flip it once. I'd still say going all-in is nuts, even though I'd happily take the bet.
  - Insurance on my house is a losing bet on average. I buy it anyway and think that's the rational thing to do.
  - A lottery ticket is also a losing bet, I don't buy one, and I think buying one is a small mistake.
  - I wouldn't pay more than a few dollars for the St. Petersburg game, even though its expected payout is infinite.
  - Someone offers me double-or-nothing on my entire net worth, and even tips it a little in my favor. I refuse.
  - But I'm happy to have my whole retirement sitting in a broad index fund, which is also one big uncertain bet that could go badly.

  The last two feel like they can't both be right, and the insurance/lottery pair bugs me too since there both negative-EV. I have a hunch it's something about caring about wealth multiplicatively rather than additively -- growing it by factors instead of by sums -- but I want that made precise. What's the actual principle, does it get all seven, and which of my verdicts does it make me give up?
reasoning: |-
  I'm trying to figure out the underlying principle behind how I size my bets based on these examples. Let me list them out clearly:

  1. **60% heads coin, even money, multiple flips:** Betting whole bankroll once is bad, small fixed bets over time are good.
  2. **Same coin, only one flip:** Still think all-in is bad, even though I'd take the bet.
  3. **House insurance:** Negative EV, but I buy it and think it's rational.
  4. **Lottery ticket:** Negative EV, I don't buy it, think it's a mistake to buy.
  5. **St. Petersburg game:** Infinite expected payout, but I'd only pay a few dollars.
  6. **Double-or-nothing on net worth with a slight edge:** I refuse.
  7. **Whole retirement in index fund:** Happy with that, even though it's one big uncertain bet.

  The conflicts are between 6 and 7, and between 3 and 4 since both are negative EV but I treat them differently.

  My hunch is about multiplicative vs. additive growth. So, let me think about expected utility theory or something like that.

  Expected value (EV) is linear, but for decisions under risk, people often use utility functions that are concave, meaning diminishing marginal utility. For wealth, this could explain risk aversion.

  Let me apply that to each case.

  1. **60% coin, multiple flips:** Betting whole bankroll once has a high risk of ruin. Even with 60% chance, there's a 40% chance I lose everything. Betting small amounts repeatedly allows the law of large numbers to work, so I almost surely make money. This is the Kelly criterion or something similar, which maximizes growth rate.

  Kelly criterion says to bet a fraction f = (bp - q)/b, where b is the payout ratio, p is win probability, q=1-p loss probability. Here, b=1 (even money), p=0.6, q=0.4, so f = (1*0.6 - 0.4)/1 = 0.2. So bet 20% of bankroll each time for max growth.

  Betting whole bankroll once is not Kelly; it's overbetting and risky.

  2. **One flip only:** Even with positive EV, going all-in has a 40% chance of ruin. If I have current wealth W, after win I have 2W, after loss I have 0. Expected value is 0.6*2W + 0.4*0 = 1.2W, so +20% EV. But utility: if utility U(W) is concave, say logarithmic, U(W) = ln(W), then expected utility is 0.6*ln(2W) + 0.4*ln(0). But ln(0) is undefined or -infinity, so expected utility is -infinity, which is terrible. Even if we set U(0) to some large negative number, it's very bad. So with log utility, all-in is infinitely bad.

  I'd happily take the bet if it's a small part of wealth, but not the whole thing. In this case, since it's one flip and all-in, it's bad.

  3. **House insurance:** Negative EV, meaning I pay more in premium than the expected loss. But if my house burns down, I lose a lot, so buying insurance transfers that risk. With concave utility, the expected utility of not insuring might be lower than the certain loss of premium. For example, if U(W) = ln(W), and W is wealth, loss of house is a big drop, so U(W - loss) is much lower, while insurance costs a small premium, so U(W - premium) is not much less than U(W). Expected utility without insurance: p * U(W - loss) + (1-p) * U(W), which could be less than U(W - premium) if p is small but loss is large, due to concavity.

  So, negative EV but positive expected utility gain from reducing risk.

  4. **Lottery ticket:** Also negative EV, but it's a small loss for a small chance of a huge gain. For most people, the utility gain from winning is not enough to compensate for the certain small loss, because concavity: the huge win might be on a flat part of utility if wealth is high, or if utility has decreasing marginal utility. But lottery tickets are often bought by people with lower wealth, where a huge win could be life-changing. In my case, I don't buy, so perhaps for me, at my wealth level, the expected utility is negative.

  But in example 3, I buy insurance, which is also for a rare event. The difference might be that insurance protects against a large loss, which utility function cares about a lot, while lottery is a small cost for a large gain, but since U is concave, the gain doesn't increase utility as much as the loss decreases it for the cost.

  Let’s say lottery: cost C, win probability p, win amount J, with EV = p*J - C < 0.

  Expected utility: p * U(W + J) + (1-p) * U(W - C) vs U(W) for not playing.

  Since EU < U(W) for risk-averse, and if C is small, U(W - C) ≈ U(W) - U'(W)C, and U(W + J) might not be much larger if J is large but U is concave.

  But for insurance, not insuring: p * U(W - L) + (1-p) * U(W) vs U(W - P) for insuring.

  U(W - P) > p U(W - L) + (1-p) U(W) because of concavity, even though P > pL (negative EV).

  5. **St. Petersburg game:** Pay $x to play, then fair coin, heads first time win $2, tails flip again, if heads win $4, and so on, payout $2^n if first heads on nth flip. Probability (1/2)^n, so expected payout sum (1/2)^n * 2^n = sum 1 from n=1 to inf, which diverges, infinite EV.

  But people pay only a small amount. Why? Because utility grows slowly. With U(W) = ln(W), let's see expected utility.

  Suppose current wealth W, pay C to play. After playing, with prob (1/2)^n, wealth becomes W - C + 2^n for n=1,2,3,...

  Expected utility: sum_{n=1}^∞ (1/2)^n U(W - C + 2^n)

  For U(W) = ln(W), this sum might converge to a finite number, so there is a maximum C I'd pay.

  For example, if W is large, U(W - C + 2^n) ≈ ln(2^n) = n ln(2) for large n, but for small n, it depends.

  The sum sum (1/2)^n n ln(2) = ln(2) sum n/2^n, which converges to 2 ln(2), so finite.

  Thus, with log utility, expected utility is finite, so I pay a finite amount.

  6. **Double-or-nothing on net worth with slight edge:** Say, 51% chance to double, 49% chance to lose all. EV is positive, but I refuse.

  Again, with log utility, U(W) = ln(W), EU = 0.51 * ln(2W) + 0.49 * ln(0), which is -infinity if we consider ln(0) = -inf, so EU = -inf, definitely refuse.

  Even if U(0) is finite but large negative, it's very bad.

  7. **Retirement in index fund:** This is not a single bet; it's a diversified portfolio over time. The index fund has positive expected return, say 7% per year, with some volatility, but not ruin risk because it can go down but not to zero, and over time, it grows.

  Unlike double-or-nothing, which has a high chance of total loss, an index fund might drop 50% in a crash but recover. The probability of total loss is near zero for a broad index.

  So, it's not a bet with ruin risk; it's a positive growth investment with manageable risk.

  Now, the conflict between 6 and 7: in 6, I refuse a positive EV bet because of ruin risk, but in 7, I accept the index fund which also has risk but no immediate ruin.

  Similarly, for 3 and 4: both negative EV, but insurance is against large loss, lottery is for large gain.

  The principle might be about the utility function being concave, so risk-averse for gains but risk-seeking for losses? No, for losses, we pay to avoid them.

  Prospect theory: people are loss-averse, so they pay to avoid losses but don't pay for small chance gains if it costs something.

  But let's see if we can unify with expected utility.

  Perhaps it's about the Kelly criterion or growth optimal betting.

  Kelly criterion maximizes the growth rate of wealth, so for repeated bets, it tells you to bet a fraction.

  In single bets, we can think in terms of maximizing expected log wealth.

  For the one-flip case with 60% heads, all-in: if win, W to 2W, log from ln(W) to ln(2W) = ln(2) + ln(W), increase by ln(2). If lose, ln(0) = -inf, so expected change in log wealth is -inf.

  With fraction f, bet fW, win (1+f)W, lose (1-f)W.

  EU in log terms: p ln(1+f) + q ln(1-f) + ln(W), so we maximize p ln(1+f) + q ln(1-f)

  For p=0.6, q=0.4, max at f=0.2 as before.

  For one flip, if I must bet, I should bet a fraction, but in the all-or-nothing, it's forced all-in.

  In example 2, it's presented as only one opportunity, all-in or nothing, so no choice of fraction.

  But I say all-in is nuts, meaning I wouldn't do it.

  Now for insurance: not buying insurance, EU = p U(W-L) + (1-p) U(W)

  Buying insurance, U(W-P)

  Since U is concave, and P is small, U(W-P) > p U(W-L) + (1-p) U(W) if P is not too much larger than pL.

  For lottery: EU of buying = p U(W+J) + (1-p) U(W-C)

  Not buying: U(W)

  If p small, U(W+J) not much larger than U(W) if U concave, and U(W-C) < U(W), so EU buying < U(W) if C>0 and J not utility-enough.

  St. Petersburg: with log utility, finite expectation.

  Double-or-nothing: ruin risk, EU very low.

  Index fund: over time, the growth rate is positive with low risk of ruin. Specifically, the annual return has a high Sharpe ratio or something, but not symmetric like double-or-nothing.

  In double-or-nothing, 51% to double, 49% to zero, so the growth rate: if I do it, with prob 0.51, wealth multiplies by 2, with prob 0.49, multiplies by 0, so expected log wealth change: 0.51 * ln(2) + 0.49 * ln(0) = -inf, so growth rate -inf.

  For index fund, say annual return R with E[ln(1+R)] >0, and P(R < -1) =0, so no ruin, E[ln(1+R)] finite and positive, so long-term growth positive.

  So the key is expected log utility or growth rate maximization.

  For one-off decisions, we use expected utility.

  Now, for insurance and lottery, both negative EV, but different.

  Insurance: avoids a large loss, so increases expected utility.

  Lottery: pays for a small chance of large gain, but since gain has diminishing marginal utility, it might not be worth the cost.

  Moreover, for lottery, the cost is certain, gain uncertain, and for poor people, U(W+J) might be much larger, but for me, not.

  In index fund, I'm not risking ruin; I'm taking a bet with positive expected log return.

  Another principle is risk of ruin: I avoid bets where there is a significant chance of losing everything or a large portion that I can't recover from.

  In all-in coin flip, 40% ruin chance.

  In double-or-nothing, 49% ruin chance.

  In insurance, not buying has small p of ruin if loss is catastrophic.

  In lottery, no ruin risk, just small loss.

  St. Petersburg has no ruin risk since you pay fixed, but you can win big, but with log utility, you pay little.

  Now, let's list my verdicts and see if expected utility with log wealth explains them.

  Assume U(W) = ln(W) for simplicity.

  1. Multiple flips: betting small fraction is good, as per Kelly. Betting whole once: EU = 0.6 ln(2W) + 0.4 ln(0) = -inf, bad.

  2. One flip all-in: same as above, EU = -inf, bad.

  3. Insurance: Suppose W wealth, house value H, loss probability p, premium P, with P > p H (negative EV).

  Not insure: EU = p ln(W - H) + (1-p) ln(W)  [if W-H is still positive, but if H is large, W-H could be low]

