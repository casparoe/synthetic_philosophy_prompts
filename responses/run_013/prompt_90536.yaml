  Not insured: EU = p ln(W - H) + (1-p) ln(W)

  Insured: always ln(W - P) since P paid, house safe.

  Due to concavity, ln(W - P) > p ln(W - H) + (1-p) ln(W) for small p and large H relative to W.

  For example, p small, ln(W - H) << ln(W), so p ln(W - H) is very negative, making EU not insure low.

