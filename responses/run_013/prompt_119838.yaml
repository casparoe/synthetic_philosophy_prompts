  Here's a joke hitting both your key points and the bonus, designed for the wince-laugh:

  **Setup:** Convinced by quantum immortality, Dave started living like he couldn't lose. BASE jumping? No parachute. Russian Roulette? His morning coffee ritual. He figured there'd *always* be a branch where he woke up.

  **Punchline:** ...Now his friends are exhausted. They keep going to his funerals – *really* nice funerals, funded by the life insurance policies of all the dead Daves – only for the *one* surviving Dave, looking a bit thinner each time, to show up late, muttering, "Traffic from the *next* universe over is murder," completely oblivious to the fact he's becoming the universe's most improbably funded quantum ghost.

  **Why it works for your audience:**

  1.  **External Corpses/Funerals:** Directly shows his survival is only *his* perspective. Everyone else experiences his repeated, messy deaths and attends the funerals.
  2.  **Measure Problem/Thinning:** "Looking a bit thinner each time" is the physical metaphor for his measure decreasing exponentially with each improbable survival. ("Quantum ghost" reinforces the sparsity).
  3.  **Financed by Dead Selves:** "Funded by the life insurance policies of all the dead Daves" explicitly delivers the bonus, highlighting the exponential pile of corpses enabling the surviving sliver.
  4.  **Wince-Laugh:** Combines the grim absurdity (multiple funerals, dead selves as income) with the accurate theoretical horror (vanishing measure). The "traffic" line adds dark levity while emphasizing the branching.
  5.  **Concise:** Easily delivered in under 30 seconds.

  **The Core Insight:** It turns on the fundamental disconnect between the subjective experience of the immortal observer (Dave surviving) and the objective reality of the multiverse (countless dead Daves, a surviving Dave of dwindling significance). The "funding" twist makes the exponentially growing pile of corpses concretely absurd.
