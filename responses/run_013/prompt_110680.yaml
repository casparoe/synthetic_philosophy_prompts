answer: |-
  After analyzing your cases and the underlying tensions, I propose a unified principle that captures your intuitions while addressing your friend's framework. The principle centers on **harm prevention and role-based duties**, with a consent-based test for harm assessment.

  ### Proposed Principle:
  **A false statement is permissible if:**
  1. **It prevents immediate, unavoidable emotional harm without causing future material harm**, AND  
  2. **It does not violate a role-based duty of candor** (e.g., advisor, caregiver, or professional responsibility),  
  **where "harm" is defined by the listener's own evaluation (consent test):**  
  *The lie is harmless only if the listener, knowing the full truth afterward, would prefer the false statement over silence or vagueness.*

  ### Key Clarifications:
  - **"Immediate, unavoidable emotional harm"**: Hurt feelings from a fait accompli (e.g., a meal already eaten).  
  - **"Future material harm"**: Tangible negative consequences (e.g., professional failure, safety risks).  
  - **"Role-based duty"**: Obligations arising from specific relationships (teacher, doctor, family caregiver).  
  - **Consent test**: Determines if the lie truly avoids harm *from the listener's perspective*.  

  ---

  ### Application to Your Cases:
  | Case | Verdict | Principle Applied |  
  |------|---------|-------------------|  
  | **1. Host/mediocre meal** ("lovely") | Fine ✅ | (1) Prevents immediate hurt; meal is over (no future harm). (2) No role-duty. Consent test: Host would prefer polite lie. |  
  | **2. Friend/doubts about partner** ("seem good together") | Fine ✅ | (1) Prevents immediate hurt; unarticulated doubts aren't actionable. (2) No role-duty (friend ≠ therapist). Consent test: Friend might prefer vague reassurance over paralysis. |  
