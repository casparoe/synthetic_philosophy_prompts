prompt: |-
  For the past two months I have been the person drafting review guidance for my institution's research-ethics committee, and the two questions that keep landing on my desk have turned out, uncomfortably, to be the same question. The biology side wants to know how to handle work on insects and other invertebrates, now that our national framework has been widened to bring some of them into scope; the engineering side wants to know whether a companion robot being trialled in a local care home falls under any review at all. I have to run a ninety-minute session for the committee — twelve people, mostly clinicians and lawyers, one philosopher, nobody with a background in animal cognition or in AI — with no reading circulated in advance. What I need from you is a plan for the explanation, not the explanation itself.

  My instinct is that the session should be organised around sentience as a matter of degree, since that is the only framing in which both cases are even askable, but I am not confident I have the dependency structure right. What has to be in place before degrees of sentience is a coherent thing to say? My guess is that the split between reflex and valenced experience must come first, and then the claim that it is experience, rather than life or intelligence, that grounds the possibility of being wronged — but tell me whether that is the right order, and what depends on what.

  For the carrying example I am inclined to build the session on a single pair: an insect and a small robot that behave indistinguishably when a heat source is brought near, both withdrawing, so that behaviour cannot be what decides the case and the committee is pushed onto mechanism and onto what evidence could in principle count. Is that the right carrier? What must it have, and what must it conspicuously lack, for the rest of the session to hang off it?

  Here are the misconceptions I expect, and I need to know where in the sequence each should be headed off: that degrees means one measurable quantity; that it is all-or-nothing after all; that a matter of degree means no line can be drawn and therefore anything goes; that behaviour settles it in either direction, so that the insect writhing means it suffers and the insect being a reflex machine means it does not; that the degrees lie on a single axis, as though sentience were a dimmer rather than several dials that can come apart; and that the robot pole is a reductio that refutes the gradation view rather than a boundary case the view has to handle.

  One further element to place. I have drafted a one-page heuristic that sorts cases on three axes — the strength of the observable evidence, the presence of a plausible mechanism, and the asymmetry of the cost of being wrong in each direction — and I cannot decide whether it should be the spine of the session or the closing move. Advise me on that, tell me what to leave out at this level and to say openly that I am leaving it out, and give me one question to put to the room at the end that would show whether they have grasped the gradation view rather than merely been made cautious about it.
reasoning: |-
  Hmm, the user is drafting research ethics guidelines and needs to design a 90-minute committee session. They're grappling with two seemingly disparate questions - invertebrate ethics and companion robot oversight - that both hinge on sentience as a graded phenomenon. 

  The core challenge is structural: how to scaffold the philosophical argument about degrees of sentience for an audience of clinicians, lawyers, and one philosopher with no specialized background. The user's instinct to use comparative cases (insect vs robot) is smart, but they're unsure about dependencies - particularly whether to start with the reflex/valence distinction before introducing gradation. 

  Their anticipated misconceptions reveal deep concerns about oversimplification: committee members might reduce sentience to a single scale, confuse behavioral evidence with ontological status, or treat gradation as license for arbitrariness. The proposed three-axis heuristic (evidence strength, mechanism plausibility, error cost asymmetry) could be powerful if positioned correctly. 

  Key structural decisions needed:
  1) Must establish why experience (not life or intelligence) is the moral bedrock before discussing degrees. The reflex/valence distinction serves this purpose - it creates the category of "something it's like to be" that can then be variably present. 

  2) The insect-robot comparison works if both exhibit identical withdrawal behavior but differ radically in mechanism. The robot must lack any plausible substrate for valenced experience (e.g., purely algorithmic response) while the insect should have at least debatable neurobiological correlates (e.g., opioid receptors). 

  3) The heuristic should crown the argument, not frame it. Presenting it early would make ethics seem like a scoring system rather than a conceptual breakthrough. Better to build the philosophical foundation first, then offer the heuristic as a practical decision tool. 

  4) For the closing question, something that forces application of gradation: "If we saw identical distress behaviors in a beetle and a future android, would identical ethical protections follow? Why/why not?" This tests whether they distinguish behavior from moral patienthood. 

  The user's self-awareness about gaps is admirable. Should explicitly bracket: no definitive sentience threshold, no resolution of hard problem of consciousness, no attempt to cover all invertebrate orders. Focus is strictly on conceptual tools for borderline cases.
answer: |-
  Here’s a structured plan for your 90-minute session, designed to build conceptual dependencies while preempting misconceptions. The spine is **graded sentience as necessary for both cases**, with your heuristic as the closing tool.

  ### Session Structure & Dependencies  
  *(Total: 80 min + 10 min buffer)*  

  1. **Groundwork: What Demands Ethical Scrutiny?** (15 min)  
     - Start with **moral wrongness**: *"What makes an entity warrant ethical review? Injury? Suffering? Rights violation?"*  
     - Establish consensus: **The capacity to have experiences that matter to the entity** (valenced states: pain/pleasure, distress/comfort) is key.  
     - *Explicitly exclude* life, intelligence, and autonomy as sufficient grounds here (e.g., plants, AI chess bots).  
     - **Dependency**: Valenced experience must anchor ethics *before* discussing gradation.  

  2. **The Reflex vs. Valence Distinction** (20 min)  
     - Contrast:  
       - **Reflex**: Hardwired response (e.g., photocell streetlight turning on; moth to flame).  
       - **Valenced experience**: Internal state that feels "good/bad" (e.g., pain causing avoidance *beyond* reflex).  
     - **Carrier Case**: Your insect-vs-robot heat-withdrawal example.  
       - *Must show identical behavior*: Both withdraw from heat.  
       - *Must lack in the robot*: Any biological/neurobiological substrate for valence (nociception ≠ pain; no endogenous opioids, learning from "harm").  
       - *Must hint in the insect*: Evolutionary rationale for pain (e.g., injury avoidance enhances fitness), opioid receptors, behavioral plasticity.  
     - **Preempts**: "Behavior settles it" (identical behavior; different mechanisms) and "reflex machines can’t suffer".  

  3. **Introducing Graded Sentience** (20 min)  
     - Argue: Valence isn’t binary. It depends on:  
       - **Complexity of mechanisms** (e.g., neural integration, memory, endogenous modulation).  
       - **Behavioral flexibility** (e.g., trade-offs, self-preservation beyond reflexes).  
     - Use **spectrum examples**:  
       - Robot (no valence) → Jellyfish (reflexes) → Fruit fly (debated valence) → Crab (stronger evidence) → Mouse (clear valence).  
     - **Preempts**: "Single axis" (acknowledge multiple dimensions: sensory richness, memory, cognitive integration) and "all-or-nothing" (spectrum forces nuance).  

  4. **Tackling Misconceptions Directly** (15 min)  
     - *"Degrees ≠ measurable quantity"*: Reject a "sentience meter". Stress converging evidence (mechanism + behavior).  
     - *"No bright line ≠ anything goes"*: Gradation demands *more* caution, not less. Precautionary principle applies.  
     - *"Robot as reductio"*: Robots test our framework. If identical to insects, same ethical void? But mechanisms break the symmetry.  

  5. **Your Heuristic as the Decision Tool** (10 min → **Closing Move**)  
     - Present as **applied framework**:  
       - **Axis 1: Observable Evidence** (behavior, physiology).  
       - **Axis 2: Plausible Mechanism** (neurobiology, computational architecture).  
       - **Axis 3: Cost Asymmetry** (error cost if sentient vs. non-sentient).  
     - Apply quickly to both cases:  
       - *Insect*: Moderate evidence (varies by species), plausible mechanism (simpler), high cost if wrong (under-protect).  
       - *Robot*: Behavior only, no known valence mechanism, low cost if wrong (over-protect; no suffering).  
     - *Why close?* Heuristic crystallizes gradation into action. Starting with it oversimplifies philosophy.  

  6. **Closing Question to Test Understanding** (5 min)  
     - > *"If we found a robot that* ***learned*** *to avoid heat after ‘injury’, showed ‘distress’ signals, and could trade off heat avoidance with other goals—would it deserve the same scrutiny as an insect? Why/why not beyond behavior?"*  
     - **Tests grasp**: They must cite mechanism (is the "learning" valenced?) and cost asymmetry, not just behavior.  

  ### What to Explicitly Omit  
  - **State upfront**: "We won’t solve consciousness or define a sentience threshold. We’re building tools for borderline cases."  
  - **Omit**: Cross-species pain comparisons, AI consciousness debates, and exhaustive invertebrate biology. Focus on *principles*.  

  ### Why This Flow?  
  1. Establishes **valence as the ethical cornerstone** (Step 1).  
  2. **Mechanism** separates reflex from sentience (Step 2), enabling gradation (Step 3).  
  3. Heuristic **applies gradation** without reducing it to scoring (Step 5).  
  4. Robot case is a **boundary test**, not a reductio (Steps 2, 4, 6).  

  This sequence forces the committee to confront the insufficiency of behavior alone and the necessity of graded, evidence-based caution—tying both ethics questions to the same core framework.
