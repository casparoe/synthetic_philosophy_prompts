prompt: |-
  I've been trying to figure out what I actually think about whether video-game characters matter morally, going by my gut on a bunch of cases, and I'd like you to tell me what principle (if any) is behind the pattern. I want a real answer on this one — pick the account you think is best and defend it, don't hand me four theories and a shrug.

  My gut so far:

  - Stomping a goomba in a platformer: nothing. I don't even register it as a thing that happened.
  - A life-sim where the neighbours have names, routines, and opinions about me: when I bulldoze their house with them inside, I feel bad, and not just because I wasted money. But if I'm honest, I think the badness is in me getting sucked into the fiction, not in them.
  - Griefing in an MMO: genuinely wrong when someone camps a low-level player and kills them over and over for an hour. But wrong to the person at the keyboard, I think — it's harassment — not to the little avatar they're driving.
  - An RPG that tracks whether you kill or spare every enemy, with a whole ending that only unlocks if you never kill anyone: I think the run where you spare everyone is morally better. Not just nicer-feeling. Actually better. Even though the enemies are the same sprites either way.
  - A speedrun glitch that wipes an entire town out of the game's memory so it never renders at all: I don't think anything happened. Nobody saw it, nobody lost anything.
  - A game where the story tells me a character is a machine with no inner life, and then plays sad music and gives me an achievement for choosing to shut it down: I think that choice is a real moral choice inside the fiction even though the fiction itself says the character can't be harmed. This one bugs me.

  And two cases I keep going back and forth on, which is really why I'm asking. First: an NPC that's in the game's code but that no player has ever loaded — sitting in the save file, never instantiated, never seen. Does it matter what I do to it, or how I feel about it? Second: a character generated on the fly by the game's AI who says one line to me and then gets overwritten when I load an older save. Is my answer to the first case different from my answer to the second, and should it be?

  What I want: the principle, or a small set of candidate principles, stated precisely enough that I can actually apply it, along with the case that motivates each clause. Tell me what it predicts for cases I haven't listed — modding a game to delete a companion I got attached to, or a game that spawns a character whose entire purpose is to die for you. And tell me honestly which of my verdicts the principle can't accommodate, because I suspect at least one has to go. Which one, and why that one rather than the others?
reasoning: |-
  Okay, this user is grappling with a deep philosophical question about the moral status of video game characters. They've laid out a series of intuitive judgments about different scenarios and are clearly frustrated with superficial answers - they want a unified principle, not just a survey of theories. The two cases they're stuck on (the uninstantiated NPC and the transient AI character) seem to be the real crux.

  First I need to recognize this isn't just about ethics - it's about the metaphysics of virtual entities and the psychology of player engagement. The user's examples show they're already distinguishing between:
  - Purely mechanical interactions (goomba stomping)
  - Narrative-driven experiences (life sim neighbors)
  - Social interactions between players (MMO griefing)
  - Meta-fictional elements (the unrendered town)

  Their discomfort with the "machine with no inner life" case is particularly telling - they sense a conflict between diegetic statements and designed emotional manipulation. That suggests any good theory must account for the game's framing versus its actual affective design.

  For the two problematic cases... hmm. The uninstantiated NPC feels like Schrodinger's character - does potentiality matter? Meanwhile the transient AI character forces us to consider if brief existence creates moral weight. My instinct is that both cases lack what matters: participation in an observable experience. But I need to test that against their other judgments.

  The harassment point in MMO griefing is crucial - it shows harm flows through the player's experience, not the avatar. That might be the key: moral significance emerges from the actual impact on conscious beings (players) within a shared fiction, not from the fictional entities themselves.

  For the bulldozing case, the user already suspects their guilt is about self-corruption rather than harming pixels. That aligns well. The pacifist RPG run being "actually better" suggests they're responding to the cultivation of virtue through consistent narrative choice - again, about the player's moral development.

  The speedrun glitch is fascinating because it highlights that absence of experience matters - no one experienced anything. Whereas the sad-robot achievement case works precisely because the player does experience dissonance between narrative and emotional cues.

  So the core principle seems to be: moral weight emerges from the actual conscious experiences shaped by the game system, not from the fictional entities as such. This handles:
  - Why griefing is wrong (harms player)
  - Why pacifist runs matter (shapes player's disposition)
  - Why the unrendered town is neutral (no experience occurred)
  - Why the sad robot works (creates real moral tension in player)

  For the two tough cases: 
  - The uninstantiated NPC has no experiential footprint - so no moral weight. 
  - The transient AI character only matters if its brief appearance triggers reflection or emotion in the player - otherwise it's computationally identical to the goomba.

  This does mean their feeling about the pacifist run being "actually better" needs reframing: it's better for character formation, not because pixels were spared. But that seems consistent with their other intuitions. The only potential conflict is if they insist the spared enemies have intrinsic worth - but their own bulldozing case suggests they don't really believe that.

  Final principle: The moral significance of actions toward video game characters derives entirely from their effects on the moral development, emotional states, or interpersonal treatment of actual conscious beings (players), mediated through the fictional context.
answer: |-
  After analyzing your cases, I propose a unified principle that explains your intuitions while resolving the tensions in your two uncertain cases. It has three core components:

  **The Actualized Experience Principle (AEP):**  
  *Actions toward video game characters have moral significance only when they:  
  (1) **Materially shape a conscious player's experience** (e.g., emotional impact, moral self-perception, or social interactions), AND  
  (2) **That experience is anchored in the game's designed narrative or systemic consequences** (not purely player projection).  
  Harm to fictional entities matters solely as harm *to players* or *through players' real-world moral development*.*

  ---

  ### Why AEP Fits Your Cases:
  1. **Stomping a goomba**: Fails (1) and (2). No designed emotional/narrative weight or impact on you.  
     → *Matches your "nothing" verdict.*

  2. **Bulldozing neighbors**: Satisfies (1) (you *feel* bad) and (2) (the game *designs* relationships/routines).  
     → *Matches your "badness in me, not them" – the harm is your discomfort from engaging with designed systems.*

  3. **MMO griefing**: Satisfies (1) (harassment causes real distress) but **not** (2) (the *avatar* isn’t the victim).  
     → *Matches your "wrong to the person, not the avatar."*

  4. **Pacifist RPG run**: Satisfies (1) (shapes your self-perception) and (2) (systemic narrative consequences).  
     → *Explains why it feels "actually better": it cultivates real-world virtues like consistency and mercy through designed mechanics.*

  5. **Speedrun glitch**: Fails (1). No player experiences the town’s erasure; no designed emotional context.  
     → *Matches your "nothing happened."*

  6. **Sad robot shutdown**: Satisfies (1) (evokes moral unease) and (2) (achievement/sad music *design* dissonance).  
     → *Explains why it feels morally significant despite diegetic claims: the game *manufactures* a moral dilemma for the player.*

  ---

  ### Resolving Your Uncertain Cases:
  - **Uninstantiated NPC (never loaded)**:  
    → **No moral weight**. Fails (1): no conscious player interacts with or experiences it. Fails (2): it has no narrative role.  
    *Just code – like an unread book page.*

  - **AI-generated transient character**:  
    → **Moral weight only if it impacts you** during its brief existence. Satisfies (1) *if* you feel something (e.g., guilt for overwriting it), but fails (2) if the game assigns no narrative weight to its loss.  
    *Difference from Case 1: Its brief existence *could* trigger real reflection (e.g., "Did I treat it fairly?"), making it a tool for self-examination. But if forgotten instantly, no weight.*

  ---

  ### Predictions for New Cases:
  - **Modding to delete a companion you loved**:  
    → **Morally significant if it causes you grief** (satisfies 1) and the companion had narrative depth (satisfies 2). Harm is to *your* attachment.  
    → *Insignificant if done carelessly to a generic NPC.*

  - **Character designed to die for you**:  
    → **Significant if the death affects you** (e.g., guilt, gratitude) or critiques sacrifice tropes (satisfies 1/2).  
    → *Trivial if it’s a disposable mechanic (e.g., "1-UP mushrooms" made of enemies).*

  ---

  ### The Sacrifice: Your Pacifist Run Verdict
  **AEP forces a reframe of your claim that sparing enemies is "actually better."**  
  - *Why?* The sprites themselves don’t matter. What matters is:  
    - (1) The *player’s* commitment to non-violence shapes their character.  
    - (2) The game *rewards this choice* with narrative consequences.  
  - **The "better" is in the player’s moral exercise, not the pixels spared.**  
  - *Contrast*: If you spared enemies in a game with *no* tracking or consequences (e.g., a glitch), it wouldn’t feel morally weighty – failing (2).

  **Why sacrifice this?** Because your bulldozing case ("badness is in me, not them") and griefing case ("wrong to the person") already imply characters lack intrinsic moral weight. AEP systematizes this: moral significance is *always* derivative of real-world impacts.

  ---

  ### Why AEP Over Alternatives
  - **It avoids "simulationism"** (all entities matter if complex): Explains why uninstantiated NPCs don’t count.  
  - **It avoids "projectionism"** (only the player’s feelings matter): Explains why griefing is wrong *even if* the victim isn’t upset (it’s harassment by design).  
  - **It explains narrative dissonance**: The sad robot case works because the game *subverts its own diegetic rules* to manipulate you.

  **Final verdict**: Video game characters are moral props. Their worth lies in how they mediate *our* experiences – for better or worse. Bulldoze a neighbor? You’ve practiced callousness. Spare an enemy? You’ve practiced restraint. But the neighbor and enemy? They’re sparks in a machine, kindling for our conscience. Nothing more.
