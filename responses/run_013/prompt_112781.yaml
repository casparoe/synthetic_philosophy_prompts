prompt: |-
  so in my econ class this one guy keeps ending arguments with 'you cant do the math for a whole economy' and everyone just nods like thats it, case closed. I think that line is doing way more work than it can. Can you break down all the different precise things it could actually be claiming -- like, is it that the calculation itself is too hard for any computer, or that the information isnt sitting anywhere to be calculated with in the first place, or that prices dont just pass along stuff people already know but are how new stuff gets discovered (my teacher said something like that), or something else entirely -- and for each version tell me whether its actually true, whether its kind of obvious and does no work, and whether it even gets him to 'so central planning can never work, no matter how good the technology gets'? He also mentioned there were two old economists with two different versions of this arguement and that one of them was way stronger than the other, but I didnt follow which. Give me a list I can bring to class.
