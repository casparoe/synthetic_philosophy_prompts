prompt: |-
  I'm TA'ing a grad seminar on formal social choice and I'm staring down a stack of problem sets. I want to hand one question and one student's answer to you and get back a grade plus the specific comments I can paste to them. Please be concrete — point by point, tell me which claims are correct, which are wrong, and where a step just doesn't follow — rather than giving me an overall impression. Also, don't assume I already agree with you about any of it; I'm just relaying what they wrote.

  Here's the question I set:

  "Assume a society of N individuals, each with a cardinal utility function u_i over outcomes. Assume that each individual's preferences over lotteries, and the social preference relation, both satisfy the von Neumann–Morgenstern expected-utility axioms, and that the social preference relation satisfies the Pareto principle. (a) State what Harsanyi's aggregation theorem says about the form of the social welfare function. (b) Identify exactly which assumptions are doing the work. (c) Assess the claim that the theorem shows a rational social planner must be a utilitarian — and if so, what kind. (d) Does the theorem give any reason to reject a leximin social welfare function?"

  And here's the student's answer:

  "Harsanyi's aggregation theorem shows that if both individual preferences and the social preference ordering obey the von Neumann–Morgenstern axioms, and if social preference respects the Pareto principle, then the social welfare function has to be a weighted sum of individual utilities, W = Σ a_i u_i with a_i ≥ 0. So it rules out any non-additive way of combining utilities, like multiplying them or taking the minimum.

  Which assumptions do the work? I'd say it's really the Pareto principle. As soon as you insist that if everyone is better off then society is better off, you've basically forced a positive weighted sum; the expected-utility axioms are just there to make the utilities cardinal enough to be added. That's why the result is so robust.

  Does it prove a rational planner has to be a utilitarian? Yes, and specifically classical utilitarianism, because the weights come out equal. Harsanyi gets this from the original position: behind a veil of ignorance where you don't know which person you'll be, you assign each position equal probability, and maximizing expected utility then hands you equal weights on everyone. It's basically Rawls's veil of ignorance with maximin swapped out for expected-utility maximization. One thing Harsanyi is often credited with — and I think it's the real payoff — is that he shows we don't actually have to assume interpersonal comparisons of utility; the theorem derives them for us, which is a big improvement over the old British utilitarians.

  On leximin: yes, the theorem rejects it. Leximin violates the Pareto principle, because there are cases where everyone's utility goes up but the ranking of the worst-off person changes, so it can't be a Pareto-respecting social welfare function."

  Give me a grade (a letter or a rough number, I'll map it to whatever) and the comments. Lead with your bottom line in the first sentence, then the reasoning — no preamble and don't restate the question back to me.
reasoning: |-
  Okay, let me tackle this grading request. The student's answer covers all parts of the question but has several significant errors that need detailed correction. 

  For part (a), the student correctly states the weighted sum form but misses that weights must be strictly positive. They also incorrectly says "a_i ≥ 0" when it should be "a_i > 0" to avoid ignoring individuals. 

  Part (b) shows a misunderstanding - the Pareto principle alone isn't sufficient. The vNM axioms enable the linear aggregation by providing cardinal utility scales. The student oversimplifies by claiming Pareto forces the additive form.

  On part (c), the equal weights claim is wrong. Harsanyi's theorem doesn't require equal weights; that's an additional normative choice. The veil of ignorance argument is separate. The interpersonal comparisons point is partially correct but overstates the case - the theorem doesn't fully resolve this issue.

  For part (d), the leximin assessment is flawed. Leximin doesn't inherently violate Pareto; the student's example is unconvincing. The real conflict is with vNM continuity, not Pareto.

  The answer deserves a B-/C+ for getting basic structure right but making substantive errors in key arguments. Comments should systematically address each part while acknowledging what was correct.
answer: |-
  **Grade: B-/C+ (77-79%)**  

  **Comments for the student:**  

  1.  **Part (a):** Your statement is *mostly correct*. Harsanyi's aggregation theorem indeed shows that the social welfare function must be a *weighted sum* of individual utilities, *W* = Σ *a_i u_i*. However, you missed a crucial detail: the weights *a_i* must be **strictly positive** (*a_i* > 0), not merely non-negative (*a_i* ≥ 0). Non-negative weights would permit ignoring some individuals (*a_i* = 0), violating the strong Pareto principle. You correctly noted that non-additive forms (like multiplicative) are ruled out.

  2.  **Part (b):** Your claim that "it's really the Pareto principle" doing the work is **incorrect/misleading**. *Both* sets of assumptions are essential:
      *   The **vNM axioms** (applied to both individuals *and* society) ensure that individual utilities and social welfare are cardinal, unique up to affine transformations (i.e., *u_i* and *a u_i + b* represent the same preferences), and crucially, that the social welfare function must be *linear* in individual utilities. The vNM structure provides the mathematical foundation for adding utilities meaningfully.
      *   The **Pareto principle** (specifically, the *strong* Pareto principle implied here) forces the weights *a_i* to be strictly positive and ensures the linear form aggregates preferences coherently. It does not, by itself, force the *additive* form – that comes from vNM linearity. The vNM axioms are not just "making utilities cardinal enough to be added"; they enforce the specific *linear* aggregation structure.

  3.  **Part (c):** Your assessment contains **significant errors**:
      *   **Weighted Sum vs. Utilitarianism:** The theorem shows the SWF is a *positively weighted sum* (Σ *a_i u_i* with *a_i* > 0). This is *not* necessarily classical utilitarianism (which requires *a_i* = 1 for all *i*, implying equal weights and full interpersonal comparability). Harsanyi's theorem does *not* require *equal weights*.
      *   **The Veil of Ignorance:** You conflate the *aggregation theorem* with Harsanyi's separate *impartial observer theorem*. The aggregation theorem described here **does not** assume or depend on the veil of ignorance. The veil of ignorance argument, where equal weights arise from maximizing expected utility behind the veil (assuming equiprobability), is a distinct normative argument *for* classical utilitarianism *using* the aggregation result. The aggregation theorem itself only gives the weighted sum form; the weights *a_i* are exogenous to the theorem's premises. A rational planner using the aggregation theorem *could* be a *weighted* utilitarian, not necessarily a classical one.
      *   **Interpersonal Comparisons (IC):** Your claim that the theorem "derives them for us" is **partially correct but overstated**. The vNM framework provides *cardinal* utilities, meaning *intrapersonal* comparisons of utility *differences* are meaningful. However, the aggregation theorem *assumes* that interpersonal comparisons of utility *levels* (or differences) are possible and meaningful *because* it adds utilities across individuals. The theorem *uses* interpersonal comparability (the affine scales must be chosen such that interpersonal comparisons make sense), it doesn't *derive* it from nothing. Harsanyi argued the framework made IC *operational*, but it doesn't resolve the deep philosophical problem of justifying IC; it assumes a common cardinal scale exists and is used.

  4.  **Part (d):** Your rejection of leximin is **incorrectly justified**.
      *   Leximin **does not** inherently violate the Pareto principle. It satisfies *Strong Pareto*: if *every* individual is strictly better off (u_i > u_i' for all i), leximin strictly prefers the new outcome. Your example ("everyone's utility goes up but the ranking of the worst-off person changes") is unclear. If *all* utilities increase, leximin *always* strictly prefers the new state (Pareto improvement). If utilities change such that the identity of the worst-off individual *swaps* (e.g., from person A to person B) but *all* utilities increase, leximin *still* prefers the new state (Pareto holds). It *does* violate *Weak Pareto* only in extremely narrow cases where one person is made worse off while others improve – but this violates Strong Pareto only if the worse-off person is strictly harmed. The *actual* conflict is with the **vNM Continuity Axiom**. Leximin is discontinuous (a small increase in a very well-off person's utility cannot compensate for *any* decrease in the worst-off person's utility, no matter how small). Harsanyi's theorem *requires* social preferences to satisfy vNM continuity (as one of its premises). So yes, the theorem rules out leximin, but **because leximin violates vNM continuity**, *not* because it violates the Pareto principle as you stated.
