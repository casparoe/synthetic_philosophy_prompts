prompt: |-
  I'm TAing for a second-year behavioural ecology module and I've got a stack of midterm short-essays to get through this weekend. The course convener wants marks that are defensible if a student appeals, so for each script I need a mark plus comments that point at the actual sentences doing the work (or not doing it), not just a vibe. I've been marking for two hours and I'm going cross-eyed, so I'd rather hand this one over. Below is the essay question and one student's script. Please mark the script against the rubric I give, and don't rewrite the essay for me or tell me what you'd have said -- grade what's on the page.

  The question was: "Signalling is often described as a bargaining problem -- signallers want receivers to do something, receivers want to be told the truth. Using either the peacock's tail or stotting in gazelles, explain how a costly signal can stay honest in an evolutionarily stable population, and say what the cost is actually doing. Then say whether the handicap principle and the theory of costly signalling are the same idea, and why or why not."

  Here's the script:

  "The problem with any signal is that it's cheap to fake. If a male could grow a big tail for free, then every male would grow one, receivers would learn to ignore it, and the trait would stop meaning anything. So the signal has to be expensive, and this is Zahavi's handicap principle from 1975: the signal is a handicap that lowers the signaller's fitness, which is exactly why it can be trusted. A low-quality male simply can't afford the handicap, so only high-quality males produce it, and the receiver can take the signal at face value. Zahavi's idea was rejected for years and only became respectable once Grafen (1990) built an ESS model showing the handicap is evolutionarily stable as long as the cost is high enough that only the best males can pay it -- the same logic Spence had already used for education in the job market, where a degree is only worth getting if the weaker applicants find it too expensive.

  Take stotting in gazelles. When a gazelle spots a cheetah it jumps up and down instead of running straight off. This is a handicap in Zahavi's sense: it wastes energy and makes the gazelle conspicuous, but it tells the predator 'I'm fit enough to waste time on this, so don't bother chasing me'. It's also what Maynard Smith and Harper would call an index, because it can't be faked -- a sick gazelle physically can't jump that high -- and that's really the same point as the handicap principle, since both say the signal is reliable because of the cost.

  The peacock's tail is the classic case. Only a healthy male can grow and carry a tail that big, and the hens prefer the males with the biggest tails, so the preference and the trait evolve together. Since the signal is honest and the hens benefit by getting good genes for their sons, the long tail keeps spreading until every male has one, at which point the population is sitting at the honest equilibrium Zahavi predicted. So I'd say the handicap principle and costly signalling are basically the same theory: any costly signal that's honest is a handicap, and the handicap principle is just the biological version of Spence's signalling model."

  Rubric, out of 10: 4 for the mechanism of honest signalling (why cheating fails, and what work the cost is doing), 3 for the empirical example (accurate description plus a correct account of how it fits), 3 for the conceptual question (handicap principle vs. costly signalling). Give me the mark out of 10, then the point-by-point comments I can paste into the feedback box -- flag the specific sentences or moves that cost marks and say briefly why each one is wrong or unsupported, and if a point is right but reached for the wrong reason, say that too. Also let me know if there's anything in there you'd want to query with the student rather than mark down outright.
reasoning: |-
  Okay, let me approach this TA's request methodically. The user needs defensible grading with specific feedback tied to rubric criteria, so I'll focus on precision rather than general impressions.

  First, understanding the rubric breakdown:
  - 4 points for honest signalling mechanism (cheating prevention + cost function)
  - 3 points for empirical example accuracy (description + fit to theory)
  - 3 points for conceptual distinction (handicap vs costly signalling)

  Looking at the student's response:
  The mechanism explanation starts strong by noting fakeability issues and Zahavi's handicap principle. But the claim "a low-quality male simply can't afford the handicap" oversimplifies - actually, they could attempt it but would pay higher relative costs. The student misses that cost amplifies quality differences. 

  For stotting, the description is correct but incorrectly labels it as both handicap and index. The key error is equating "can't be faked" (index) with handicap's "can attempt but pays more" - these are distinct mechanisms. The gazelle example loses marks here.

  The peacock section accurately describes Fisherian runaway but confuses it with handicap stability. Crucially, it omits that cost maintains honesty at equilibrium - the student thinks fixation alone prevents cheating, which is incorrect.

  On the conceptual question, declaring handicap and costly signalling as "the same theory" ignores Maynard Smith's distinction. Costly signalling is the broader category; handicaps are a specific subset where cost enforces honesty. The biological vs economic framing is irrelevant to the theoretical difference.

  Notable positives: 
  - Correctly cites Grafen's ESS validation
  - Identifies stotting's anti-predator function
  - Recognizes Spence's parallel work

  Where clarification over penalty might help:
  - The "index" confusion in stotting could be a wording issue
  - Peacock tail costs are implied but not explicitly stated

  Final score calculation:
  Mechanism: 2.5/4 (partial credit for core ideas but major gaps)
  Example: 1.5/3 (one accurate, one flawed application)
  Conceptual: 1/3 (superficial treatment of key distinction)
  Total: 5/10

  The feedback will quote problematic sentences verbatim and specify rubric violations, keeping comments actionable for both the student and potential appeals.
answer: |-
  Here is the graded assessment based strictly on the rubric and script content:

  **Final Mark: 5/10**  
  *(Breakdown: Mechanism 2.5/4, Example 1.5/3, Conceptual 1/3)*

  ### Point-by-Point Feedback
  **1. Mechanism of Honest Signalling (2.5/4)**  
  ✅ **Correct:**  
  - "a big tail [is] cheap to fake... every male would grow one, receivers would learn to ignore it" (accurately identifies cheating incentive).  
  - "the signal has to be expensive... lowers the signaller's fitness" (correctly states cost requirement).  
  - Cites Grafen’s ESS model validating Zahavi (relevant support).  

  ❌ **Incorrect/Incomplete:**  
  - **"A low-quality male simply can’t afford the handicap"**: Misstates the mechanism. Cost isn’t about absolute affordability but *differential cost*: low-quality pay *higher* marginal fitness costs (e.g., tail reduces survival more for unhealthy males). Missing this key point loses 1 mark.  
  - **"the cost is high enough that only the best males can pay it"**: Overly simplistic. Cost doesn’t exclude low-quality signallers; it makes cheating unprofitable for them. No mention of *marginal cost/benefit trade-offs* (core to ESS stability). Loses 0.5 marks.  
  - **What cost "is actually doing" not addressed**: No explanation that cost *differentially handicaps low-quality signallers*, aligning signal intensity with quality. Loses implied requirement (rubric: "what work the cost is doing").  

  **2. Empirical Example (1.5/3)**  
  ✅ **Correct (Stotting):**  
  - "jumps up and down... tells the predator ‘I’m fit enough to waste time’" (accurately describes behaviour and proposed honest message).  

  ❌ **Incorrect/Incomplete:**  
  - **"It’s also what Maynard Smith and Harper would call an index... can’t be faked"**: Misclassification. Stotting is typically considered a *handicap* (costly display), not an *index* (physically impossible to fake, e.g., vocal tract size). Conflating these distinct mechanisms loses 1 mark.  
  - **Peacock example omits cost function**: Describes tail size preference but never states *what the cost is* (e.g., predation risk, energy drain) or *how it enforces honesty* (tail maintenance disproportionately burdens low-quality males). Fails rubric’s "correct account of how it fits." Loses 0.5 marks.  

  **3. Conceptual Question (1/3)**  
  ✅ **Correct:**  
  - Notes both theories involve costly signals enabling honesty.  

  ❌ **Incorrect:**  
  - **"the handicap principle and costly signalling are basically the same theory"**: Fundamental error. Costly signalling theory (CST) is the *broad framework*; the handicap principle (HP) is a *subset* where costs *directly enforce honesty*. CST includes mechanisms *beyond handicaps* (e.g., indices, receiver-dependent costs). Loses 2 marks.  
  - **"the handicap principle is just the biological version of Spence’s model"**: Misrepresents Spence. Spence’s job-market model (cited earlier) *is* a costly signalling model but does not require *handicaps* (e.g., education cost could be equal for all; honesty comes from equilibria). Conflation loses credit.  

  ### Queries for Student (Not Marked Down, but Need Clarification)  
  1. **Stotting as "index"**: You cite Maynard Smith, but stotting is widely analysed as a handicap. Did you mean "signal of quality" or was this a deliberate reclassification?  
  2. **Peacock equilibrium**: You say tails spread until "every male has one," but at equilibrium, tail size *varies* with quality. Is this phrasing oversimplifying or misunderstanding ESS dynamics?  

  ---

  ### Why This Score?  
  - **Strengths**: Core ideas of cheating risk, Zahavi/Grafen foundations, and stotting’s adaptive function are clear and correct.  
  - **Critical Weaknesses**:  
    - Missed *differential/marginal costs* as the enforcer of honesty (mechanism cornerstone).  
    - Conflated *handicap* with *index* and *costly signalling* with *handicap principle* (major conceptual errors).  
    - Failed to specify *what costs are* in examples (e.g., peacock’s predation risk).  
  - **Defensibility**: Quotes from the script directly justify deductions (e.g., "simply can’t afford" shows mechanistic misunderstanding; "same theory" misstates conceptual relationship).  

  Recommendation: Feedback should emphasize clarifying cost’s *differential* role and disentangling CST/HP. Script shows foundational knowledge but lacks precision on key distinctions.
