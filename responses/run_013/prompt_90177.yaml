  ### Clarification: Genuine Cruxes vs. Verbal Disagreements  
  - **Genuine Cruxes**:  
    1. The **definition of manipulation** (bypassing reason vs. disrespecting standing). This underlies all cases.  
    2. The **permissibility of non-rational routes** (Mechanism rejects all; Autonomy contextualizes).  
    3. The **sufficiency of disclosure** (Mechanism: disclosure neutralizes manipulation; Autonomy: disclosure is one factor among many).  
    4. The **role of the Sunlight Test** (it is a heuristic, but its assumptions favor Autonomy).  
    These are substantive and impact real-world judgments (e.g., designing AI or advertising).  
  - **Merely Verbal Disagreements**:  
    - "Autonomy": Mechanism uses it to mean *rational capacity*; Autonomy uses it for *relational standing + ownership*. This is definitional, not substantive.  
    - "Persuasion vs. manipulation": Mechanism ties "persuasion" to rational routes; Autonomy allows "persuasion" to include non-rational methods. This is terminological.  

  We commit to using this framework to avoid talking past each other. Future debates should focus on the genuine cruxes, using Cases 1–3 as benchmarks.  

