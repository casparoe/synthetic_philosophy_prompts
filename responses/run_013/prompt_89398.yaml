prompt: |-
  I host a small podcast on epistemology, and next week's guest is a philosopher who defends what she calls weak anti-reductionism about testimony: we don't need positive evidence about the speaker to be entitled to believe what she says, because theres a standing default in favor of testimony that we can lose once we pick up defeaters. Draft 8-10 interview questions that push her well past the "so you're just credulous" stage. I want at least one each on (a) whether the child-learning case really shows no evidence is needed, or only that kids are held to looser standards; (b) what her view says about the one-shot stranger -- you have no track record, nothing to go on, the person says something true, do you know it?; and (c) whether a default like this is even usable given that credibility gets handed out unequally, so some people are disbelieved for reasons that have nothing to do with the evidence. For each of those three, give me a follow-up aimed at the reply she's most likely to give. Also work in a question on whether her view is just reductionism with the hard part relocated to the defeater side, one on whether the evidence you'd use to check a speaker is itself mostly testimonial (so doesn't the reductionist end up going in a circle?), and one on whether testimony only passes knowledge along or can generate knowledge the speaker never had. American English please.
reasoning: |-
  Okay, I need to help this user draft interview questions for their epistemology podcast. They're interviewing a philosopher who defends "weak anti-reductionism about testimony." That means she believes we don't need positive evidence about a speaker to trust what they say; instead, there's a default trust that only gets overridden when we have defeaters (like reasons to doubt). The user wants questions that go beyond the basic "aren't you just being credulous?" critique, and they specifically asked for three focus areas: (a) child-learning cases, (b) one-shot stranger scenarios, and (c) unequal credibility distribution. Plus, they want follow-ups for each of those, as well as three additional questions on reductionism-relocation, testimonial circles, and testimony generating knowledge.

  First, I recall the core of weak anti-reductionism. It's often contrasted with reductionism, which says we need evidence to justify trusting testimony. Anti-reductionists like this guest argue that testimony has a default status. The user mentioned key thinkers like Coady and Burge, so I should make sure the questions align with that framework without getting too jargon-heavy since it's a podcast.

  For the three specific areas:
  - (a) Child-learning: Does a child really need no evidence, or are they held to looser standards? Kids learn language and facts from adults without checking credentials, but is that because they can't or because the standards are different? I'll draft a question probing if this case truly supports no evidence needed, and a follow-up anticipating her likely reply about children's entitlement.
  - (b) One-shot stranger: If you meet a stranger with no track record and they say something true, do you gain knowledge? Anti-reductionists might say yes due to the default, but reductionists would argue you need some background evidence. The follow-up should challenge if this feels like knowledge without any grounds.
  - (c) Unequal credibility: Credibility is often tied to social factors like race or gender, leading to unfair disbelief. How does her view handle this? The default might be applied unevenly. The follow-up needs to address her probable response about defeating the default unfairly.

  Additional questions:
  - Reductionism relocation: Is she just moving the burden to defeaters? If defeaters require evidence, isn't that similar to reductionism? Follow-up on whether this blurs the lines.
  - Testimonial circle: If evidence for checking speakers comes from testimony, is reductionism circular? This questions the foundations of justification.
  - Knowledge generation: Can testimony create knowledge the speaker didn't have? E.g., aggregating info. This explores the epistemology beyond mere transmission.

  The user wants American English, so I'll keep the language clear and conversational. Questions should be open-ended to spark discussion, not yes/no. Since it's a podcast, they need to be engaging for listeners.

  Assessing the user's needs: They host a small podcast, so they likely want deep, thoughtful content that stands out. Their explicit request shows they've done homework—they know the guest's position and key debates. Unspoken needs might include making the episode compelling for an audience familiar with philosophy but not experts, so questions should clarify complex ideas. Also, they might want to challenge the guest respectfully to reveal nuances, avoiding superficial takes.

  For structure, I'll organize it with the three priority questions first, each with a main and follow-up, then the three additional ones. I'll ensure the follow-ups anticipate common replies to push deeper. For instance, on child-learning, if she says children are entitled, the follow-up asks why adults aren't held to the same. This creates a natural flow.

  Finally, I'll phrase everything in accessible language, avoiding heavy jargon. The goal is to help the user facilitate an insightful conversation that moves past basic objections.
answer: |-
  Here are 8 targeted interview questions pushing beyond the "credulous" objection, incorporating your specific requests, with follow-ups anticipating likely replies – phrased in clear, conversational American English:

  1.  **Core Challenge & Child-Learning Case (a):** "You often cite a child learning from caregivers as a core motivation for weak anti-reductionism – the child clearly gains knowledge without assessing their parent's reliability. But critics argue this just shows *children* aren't held to the same epistemic standards as adults. Doesn't this case demonstrate a *developmental exemption* requiring looser norms, rather than proving *no positive evidence* is ever needed for testimonial entitlement?"
      *   *Likely Reply Anticipated:* She might emphasize that the child's entitlement isn't merely excusable ignorance but a genuine normative default constitutive of learning.
      *   **Follow-Up (a):** "If the child's acceptance *is* genuinely epistemically entitled by a default, why shouldn't adults facing novel testimony in equally unfamiliar domains – say, a complex scientific claim outside their expertise – be held to that *same* permissive standard? Doesn't restricting the 'child case' to actual children concede the critic's point about differing standards?"

  2.  **The One-Shot Stranger (b):** "Imagine I'm walking in a new city, utterly lost. A stranger, whom I have absolutely no information about – no track record, no context, nothing – points and says, 'The train station is down that street.' Suppose they're right. According to your view, do I *know* the station is down that street purely based on this default entitlement? Or is something crucial missing for genuine knowledge?"
      *   *Likely Reply Anticipated:* She'll likely affirm that, absent defeaters, this *does* constitute knowledge via the default entitlement.
      *   **Follow-Up (b):** "Many find it deeply counterintuitive that a stranger's unchallenged word alone, with zero grounding in *my* evidence about *them* or the situation, suffices for *knowledge*. Doesn't this feel more like a lucky, justified true belief rather than knowledge? How does the default entitlement bridge that gap and provide the necessary warrant?"

  3.  **Unequal Credibility & Social Defeaters (c):** "A major practical concern is that 'defeaters' aren't applied neutrally. Credibility is often distributed unequally based on social identity (race, gender, accent, etc.), leading people to unjustly *lose* the default entitlement for testimonial belief, not based on evidence relevant to *this* testimony, but due to prejudice. How does your view handle this? Isn't the 'default entitlement' effectively unusable or unfair for speakers systematically subjected to these illegitimate defeaters?"
      *   *Likely Reply Anticipated:* She'll likely distinguish *epistemic* defeaters (relevant to truth-tracking) from *pragmatic/biasing* defeaters (prejudice), arguing illegitimate defeaters are errors in applying the norm, not flaws in the norm itself.
      *   **Follow-Up (c):** "But doesn't the *psychological reality* that illegitimate defeaters are constantly triggered for marginalized speakers mean the theoretical 'default entitlement' is practically inaccessible to them in countless interactions? Doesn't this make the default norm, however well-intentioned, functionally inert or even harmful for significant groups, undermining its claim to be a fundamental epistemic principle?"

  4.  **Reductionism Relocated?:** "Critics like Jennifer Lackey argue weak anti-reductionism is just 'reductionism in disguise.' They say: 'Sure, you don't need *positive* evidence upfront, but the burden merely shifts to detecting *defeaters* – which itself requires significant background evidence about the speaker, context, plausibility, etc.' Isn't your view effectively reductionism where the heavy lifting happens on the *defeater detection* side, using the very evidence the reductionist says we need upfront?"
      *   *(No follow-up needed here as it's a core challenge point)*

  5.  **The Testimonial Circle (Reductionism's Problem?):** "You argue reductionism faces a vicious circle: the evidence we'd use to check a speaker's reliability (e.g., 'Experts say X is reliable,' 'Documents confirm Y,' 'Science shows Z') is itself overwhelmingly based on... *more testimony*. Doesn't this circularity genuinely cripple reductionism, forcing us to accept *some* testimony non-inferentially? How does your default entitlement avoid this problem?"
      *   *(No follow-up needed here as it's a core anti-reductionist point)*

  6.  **Knowledge Generation vs. Transmission:** "We usually think testimony *transmits* knowledge the speaker already possesses. But can testimony, via your default entitlement, ever *generate* knowledge the *speaker* didn't actually have? For instance, could a hearer come to know P based on a speaker's sincere but mistaken belief, *if* the speaker had excellent but misleading evidence, and the hearer had no defeaters? Or is knowledge strictly limited to transmission?"

  7.  **The Scope of "Defeater":** "Could you clarify the *scope* of what counts as a defeater that overrides the default entitlement? Is it just evidence suggesting *this speaker* is unreliable *on this occasion* (lying, mistaken)? Or does it include broader considerations, like the inherent implausibility of the claim itself (e.g., 'I won the lottery') or knowing the topic is highly contested (e.g., politics)? Where do you draw the line?"

  8.  **Default Entitlement vs. Practical Reliance:** "Finally, how do you distinguish the *epistemic entitlement* conferred by the default from the mere *practical necessity* of relying on testimony? We *have* to rely on others constantly to function. But isn't that a practical constraint, while epistemology is concerned with *justification*? How does the default norm provide genuine *epistemic warrant*, not just a description of how we pragmatically operate?"

  **Key Design Choices:**
  *   **Pushes Past "Credulous":** Questions 1, 2, 4, and 6 directly tackle sophisticated objections beyond simple credulity (differing standards, intuitions about knowledge, reductionism relocation, knowledge generation).
  *   **Your Specifics Covered:** Questions 1 & F/U (a: Child Case), 2 & F/U (b: One-Shot Stranger), 3 & F/U (c: Unequal Credibility) are explicitly included and form the core. Questions 4 (Reductionism Relocated), 5 (Testimonial Circle), and 6 (Knowledge Generation) cover the additional requested topics.
  *   **Follow-Ups Target Likely Replies:** The follow-ups anticipate common defenses of weak anti-reductionism (child entitlement, knowledge via default, defeater distinction) and push harder on their implications (adult standards, intuition gap, practical inaccessibility).
  *   **Clarification & Scope:** Questions 7 (Defeater Scope) and 8 (Entitlement vs. Reliance) probe crucial nuances for listener understanding and potential weaknesses.
  *   **Language:** Clear, direct American English suitable for an audio interview. Avoids overly technical jargon where possible and frames objections accessibly ("deeply counterintuitive," "practically inaccessible"). Questions are open-ended to encourage substantive discussion.
