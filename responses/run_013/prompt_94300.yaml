prompt: |-
  I run a small mediation practice that handles disputes between institutions whose value commitments do not obviously trade against one another: a city and a neighborhood association over a riverfront site, a hospital and a family over a child's treatment, a university and a donor's heirs over a collection, a utility and a tribal nation over a burial ground. We take about thirty of these a year. Each one has a clock on it — a hearing date, a court deadline, a board meeting — and each is resolved in a room with counsel on both sides plus clergy, elders, or a patient advocate, on a timeline too short for anyone to acquire the other side's theory of value. Anything we settle is signed off by a board or a court, and a bad agreement gets repudiated later, which costs us the ability to work in that community at all. My staff are capable generalists with no philosophical training, and I need something they can run without me in the room.

  Please write the decision procedure itself: the steps in order, what counts as a sufficient answer at each step, the point at which the procedure returns no deal, and the points at which it cannot decide and must hand the question to a person, marked as such.

  It has to handle the following, because these are what actually wreck our cases:

  Whether there is anything to trade at all. Sometimes the parties' orderings over the options are such that a package, a phased arrangement, or a randomization leaves both better off than the status quo; sometimes the disagreement is not about a quantity but about what kind of thing the object is, and no exchange rate exists between the currencies on offer. The procedure needs a step that separates these two situations, and it needs to treat "no common currency" as a finding rather than a failure of nerve.

  Randomized settlements. My own instinct is that a lottery over the two pure options is often better for both parties than any split-the-difference middle, since a middle position that half-satisfies each may be worse for each than the gamble. I want the procedure to include a test for when a lottery or a rotation is the honest settlement, and a test for when proposing one is a way of avoiding an argument that has to be had.

  Goods that are not for sale. Some parties treat a particular good as non-negotiable, so that an offer of compensation lands as an insult rather than a concession and the offer itself damages the relationship. The procedure must be able to identify these and say what to do instead, rather than routing every dispute through a currency.

  What is left over. When a party concedes something it values, the concession usually leaves a residue: the value is not discharged by the agreement, and someone carries the loss afterward. The procedure should say who carries it, whether it can be marked publicly (a plaque, a recorded dissent, a review date, a standing commitment), and when marking it is a way of pretending the loss was smaller than it was.

  Cover. Parties often can concede only if the concession can be described to their own constituents as a trade rather than a capitulation. The procedure should have a step for designing reciprocity so that a settlement is defensible on both sides, and should say where that step begins to shade into helping a party misrepresent what it did.

  Then run the procedure on three cases. First, the riverfront site, where the neighborhood group treats the bank as a memorial and the city needs housing units. Second, the hospital case, where the parents' refusal rests on a value the clinical team cannot price and the child's interests are at stake. Third, a case of my choosing to specify, or of yours if that is cleaner: one in which the funder who pays our fee is pressing for a settlement that the procedure says we should refuse. I want to see the procedure return the answer I will not like, and I want to see what it says about the fact that refusing costs us the contract.

  Close with a short section on what this procedure cannot do and which of its steps will misfire on a dispute that is genuinely novel.
reasoning: |-
  We are designing a decision procedure for mediation in high-stakes, multi-value disputes. The procedure must:
   1. Determine if there is a common currency for trade or if the dispute is about incommensurable values.
   2. Consider randomized settlements (lotteries or rotations) when they are superior to compromises.
   3. Identify non-negotiable goods and avoid insulting offers.
   4. Address the residue of concessions and how to mark it.
   5. Design reciprocal concessions for defensibility without misrepresentation.

   Steps of the procedure:

   Step 1: Map the Dispute Space
     - Each party (with counsel and relevant advocates) lists:
          a. The set of possible outcomes (including status quo).
          b. Their ranking (ordinal, not cardinal) of these outcomes.
          c. Identify any outcome that is unacceptable (below status quo).
     - Mediator notes any outcome that is unacceptable to either party and removes it from consideration (unless it's the status quo, which must remain as a baseline).
     - If no outcome is acceptable to both parties (i.e., every outcome is worse than status quo for at least one party), then the procedure returns "No Deal" (deadlock).

   Step 2: Test for Common Currency
     - Ask each party: "Can you assign a cardinal value (even roughly) to each outcome? If not, why?" 
          - If both can assign cardinal values (even with ranges), then we have a common currency (e.g., money, units of housing, etc.). Proceed to Step 3A (Trading).
          - If at least one party cannot assign cardinal values because the goods are of different kinds (e.g., sacred land vs. housing units), then we have incommensurable values. Proceed to Step 3B (Incommensurability).

   Step 3A: Trading (Common Currency Exists)
     - Each party assigns a cardinal value to each outcome (can be a range, but must be comparable).
     - The mediator identifies:
          a. The set of outcomes that are Pareto improvements over the status quo (i.e., at least one party better off, none worse off).
          b. Among these, the outcome(s) that maximize the sum of the two parties' values (if that is agreed as the goal) or that are on the Pareto frontier.
     - If multiple outcomes are on the Pareto frontier, the mediator may propose the one that maximizes the minimum gain (a Rawlsian criterion) or the one with the largest total gain, depending on the parties' prior agreement on fairness.
     - If no Pareto improvement exists, then the procedure returns "No Deal" (deadlock).

   Step 3B: Incommensurability (No Common Currency)
     - The mediator asks: "Is there any outcome that both parties prefer over the status quo?" (This is a Pareto improvement in ordinal terms.)
          - If yes, then that outcome is the settlement. (Even without a common currency, if both rank an outcome higher than status quo, it's a win-win.)
          - If no, then consider:
              a. Are there any outcomes that one party prefers and the other is indifferent to? If so, propose that outcome (it is a weak Pareto improvement).
              b. If not, then consider a randomized solution (Step 4).

   Step 4: Test for Randomized Solutions
     - Conditions for proposing a lottery or rotation:
          a. There is no outcome that both parties prefer to the status quo (from Step 3B).
          b. Each party has a strong preference for one of two (or more) outcomes that the other party finds unacceptable (i.e., they are at an impasse).
          c. Each party prefers a lottery (with a chance of getting their preferred outcome) to the status quo, and also to any compromise outcome that splits the difference (which might leave both worse off).
     - How to test:
          - Ask each party: "Would you prefer a 50% chance of your preferred outcome and 50% chance of the other party's preferred outcome, over the status quo? Over the best compromise outcome we have considered?"
          - If both answer "yes" to both questions, then propose a lottery (or rotation, if applicable) as the settlement.
          - If at least one party says "no", then the procedure returns "No Deal" and flags that a randomized solution is not acceptable. Then proceed to Step 6 (Residue and Cover) only if there is a deal, but in this case there isn't.

   Step 5: Identify Non-Negotiable Goods
     - This step runs in parallel throughout. The mediator must watch for:
          a. A party stating that a particular outcome (or aspect) is "sacred", "non-negotiable", or "not for sale".
          b. An offer being rejected with moral outrage (e.g., "We would never sell our ancestors' land!").
     - If a good is declared non-negotiable, the mediator must:
          a. Remove from consideration any outcome that requires concession on that good (unless the party renegotiates the boundary).
          b. Note that compensation in another currency is not acceptable. Instead, look for:
              - An outcome that does not require touching the non-negotiable good.
              - A symbolic gesture that acknowledges the good (without trading it) and builds trust for other trades.
          c. If the dispute centers entirely on a non-negotiable good and there is no alternative outcome, the procedure returns "No Deal".

   Step 6: Residue of Concessions
     - For every concession made (i.e., when a party accepts an outcome that is worse for them than their ideal but better than status quo), the mediator asks:
          a. "What loss do you carry from this concession? How can it be marked?"
          b. Options for marking:
              - Public acknowledgment (plaque, recorded dissent, public apology).
              - A future review date (if the concession is time-bound).
              - A standing commitment (e.g., the other party will do X in the future to honor the loss).
          c. The mediator must judge if the marking is proportionate and honest. If a party proposes a marking that seems to trivialize the loss (e.g., a tiny plaque for a massive cultural loss), the mediator should challenge: "Is this sufficient to carry the loss, or does it risk being seen as insincere?" If the marking is insufficient and the party cannot propose a better one, the procedure flags that the agreement may be unstable and the residue may cause future repudiation.

   Step 7: Design Cover (Reciprocity for Defensibility)
     - For each concession, the mediator helps design a reciprocal concession by the other party that can be described as a trade.
          a. Ensure that each concession is matched by a concession (or a set) of roughly comparable weight (in the eyes of the conceding party's constituents).
          b. The reciprocity must be real: the other party must actually give up something they value. The mediator must avoid helping a party misrepresent a capitulation as a trade. Test: "If the constituents knew the full truth, would they still see this as a fair trade?" If the answer is "no", then the mediator should not endorse the framing and must either redesign the trade or note that the settlement is fragile.

   Step 8: Final Agreement
     - The mediator drafts the agreement, including:
          a. The chosen outcome (or lottery mechanism).
          b. The markings for residue (if any).
          c. The reciprocal concessions (for cover).
     - Both parties sign, and the agreement is submitted for court/board approval.

   Step 9: If at any step the mediator cannot resolve the issue (e.g., Step 2 yields ambiguous cardinality, Step 4 yields mixed responses to the lottery, or Step 7 yields an indefensible trade), the procedure flags the issue and hands it to a human mediator (marked as "Human Judgment Required").

   Now, run the procedure on three cases.

   Case 1: Riverfront Site
     - Parties: City (wants to build housing) and Neighborhood Association (treats the site as a memorial).
     - Step 1: Map outcomes:
          Outcomes: 
            A: Status quo (vacant lot, used as informal memorial).
            B: Build all planned housing (200 units).
            C: Build half the housing (100 units) and dedicate half as memorial park.
            D: Build no housing and make it an official memorial park.
            E: Build 150 units with a small memorial plaque.

     - Rankings:
          City: B > C > E > A > D   (D is unacceptable because it blocks housing and gets nothing)
          Neighborhood: D > A > C > E > B   (B is unacceptable because it destroys the memorial)

     - Step 2: Test for common currency.
          The city can assign monetary value (e.g., per housing unit). The neighborhood cannot: the memorial is sacred. So incommensurable values -> Step 3B.

     - Step 3B: Is there an outcome both prefer over A?
          A is status quo. 
          City: prefers B, C, E over A (but not D).
          Neighborhood: prefers D over A (and also C? Let's assume they rank C below A because they see any building as desecration). 
          Actually, from rankings: Neighborhood ranks A above C and E? So no outcome is preferred by both over A? 

          Let me check:
            City: B, C, E > A
            Neighborhood: D > A, but C and E are below A? (from ranking: D > A > C > E > B). So indeed, no outcome is ranked above A by both.

          What about C? City prefers C over A, but neighborhood ranks A over C -> so C is worse for neighborhood than status quo. Similarly for E and B.

          Now, is there an outcome that one prefers and the other is indifferent to? No, because the neighborhood is not indifferent to any building. So we must consider randomized solutions (Step 4).

     - Step 4: Test for lottery.
          The two pure outcomes: B (build all) and D (memorial park). 
          Lottery: 50% chance of B, 50% chance of D.

          Ask City: "Would you prefer the lottery over A? Over the best compromise (say, C)?" 
            - City: They prefer B over A, but D is worse than A. The lottery: 50% chance of B (best) and 50% chance of D (worst). The expected value for the city? They might prefer A to the lottery if they are risk-averse. But note: the city might prefer the lottery to a compromise (C) if they value B highly and C is only a little better than A. Let's assume the city says: "We prefer the lottery over A because we have a 50% chance of our best outcome, and we are willing to take that risk. Also, we prefer the lottery over C because C only gives us 100 units, which is half of what we want, and we think 50% chance of 200 units is better than 100 units for sure."

          Ask Neighborhood: "Would you prefer the lottery over A? Over C?" 
            - Neighborhood: They prefer D over A, and B is worse than A. The lottery: 50% chance of D (best) and 50% chance of B (worst). They might prefer A to the lottery if they are risk-averse (because B is catastrophic). But if they are risk-tolerant, they might prefer the lottery to A (which is safe but not ideal) and to C (which they see as a loss). Let's assume the neighborhood says: "We prefer the lottery over A because we have a 50% chance of our sacred memorial, and we are willing to risk the housing project. Also, we prefer the lottery over C because C still builds on half the land, which is unacceptable."

          If both say yes, then the settlement is a lottery.

          But if the neighborhood says: "We cannot accept any chance of B (the housing project) because it would desecrate the land", then the lottery fails. Then we have "No Deal".

          Let's assume the neighborhood rejects the lottery because they cannot tolerate any chance of B. Then we have a deadlock.

          Alternatively, we might consider a rotation? Not applicable for a piece of land.

          Then Step 5: Non-negotiable goods. The neighborhood has declared the entire site as non-negotiable (memorial). So any building is an insult. The only acceptable outcome for them is D. But the city finds D unacceptable. Therefore, the procedure returns "No Deal".

          However, note that the neighborhood might be willing to accept a different site for the memorial? But the procedure hasn't explored that. We must go back to Step 1 and ask the parties to expand the outcome set.

          The procedure allows for iteration. If we get "No Deal", the mediator can ask: "Can we add more outcomes?" 

          New outcome F: The city provides an alternative riverfront site (of equal or better prominence) for the memorial and builds 200 units on the current site. 
          How do they rank?
            City: F might be acceptable if the alternative site is available and not too costly. They might rank F below B (because of cost) but above A? 
            Neighborhood: If they are willing to move the memorial, then F might be acceptable. But if they say the current site is the only one (because of specific history), then F is unacceptable.

          If F is added and both prefer F over A, then F is the settlement.

          But if the neighborhood rejects F (because the site is unique), then we are back to deadlock.

          For the sake of the example, let's assume the neighborhood rejects F. Then the procedure returns "No Deal".

     - Step 6: Not applicable because no deal.

   Case 2: Hospital Case
     - Parties: Parents (refusing treatment for religious reasons) and Hospital (clinical team believes treatment is in child's best interest).
     - Outcomes:
          A: Status quo (no treatment, child remains in hospital under observation).
          B: Proceed with treatment against parents' wishes (hospital gets court order).
          C: Parents consent to treatment.
          D: Discharge the child without treatment (against medical advice).

     - Rankings:
          Hospital: C > B > A > D   (D is unacceptable because child may die)
          Parents: D > A > C > B   (B is unacceptable because it violates their religion and autonomy)

          Note: The hospital may view A (status quo) as a temporary state that cannot last (the child's condition may worsen). Similarly, the parents might view A as a temporary state that they want to end by discharge (D).

     - Step 2: Common currency? The hospital can assign a value (e.g., child's health outcome) but the parents' value (religious integrity) is incommensurable. So Step 3B.

     - Step 3B: Is there an outcome both prefer over A?
          Hospital: prefers B and C over A? (but note: A is status quo, which might be deteriorating). Let's assume A is the current holding pattern. 
          Hospital: C (best) and B (next) are both better than A? Actually, the hospital might prefer A over D, but they want to move to treatment. They might rank A below B and C? Let's adjust:

          Hospital: C > B > A > D   -> so they prefer C and B over A.
          Parents: D > A > C > B   -> they prefer D over A, but they prefer A over C and B? So no outcome is preferred by both over A.

          Step 4: Test for lottery? 
            Lottery between B (hospital's preferred) and D (parents' preferred). 
            Hospital: 50% chance of B (treatment) and 50% chance of D (discharge without treatment). They would not prefer this over A? Because D is the worst outcome (child dies without treatment) and they are risk-averse. They would rather have A (which is not great but the child is stable) than risk D. So hospital says no to lottery.
            Parents: 50% chance of D (best) and 50% chance of B (worst). They might prefer lottery to A? But they might also prefer A to the lottery because B is a catastrophic violation of their faith. So they might say no.

            Thus, lottery fails.

          Step 5: Non-negotiable goods. The parents consider the treatment as a violation of their religion (non-negotiable). The hospital considers the child's life as non-negotiable. Therefore, no trade is possible.

          However, note: the hospital might be able to offer a modified treatment that respects the parents' beliefs? Or the parents might accept a different treatment? We need to expand the outcome set.

          Outcome E: A modified treatment that is acceptable to the parents and still effective (say, without blood transfusion, using alternatives).

          How do they rank?
            Hospital: If E is effective, then they might rank E above A? But if it is less effective, they might not.
            Parents: If E is acceptable religiously, they might rank E above A? 

          If both rank E above A, then E is the settlement.

          But if the hospital believes E is ineffective and thus ranks E below A (because it wastes time) and the parents rank E above A, then we have a Pareto improvement? Only one party gains? But note: the hospital must not be made worse off. If E is worse than A for the hospital, then it's not an improvement.

          Alternatively, if E is acceptable to both and better than A for both, then we have a deal.

          Let's assume such an outcome E is found. Then:

          Hospital: C > B > E > A > D   (if E is better than A but not as good as B or C)
          Parents: D > E > A > B   (if E is acceptable and better than A)

          Now, both prefer E over A -> settlement is E.

          If E is not found, then "No Deal" (and the hospital goes to court).

   Case 3: Funder Pressuring for Settlement (Hypothetical)
     - Let's choose: A dispute between a mining company (funder, paying our fee) and an indigenous community over a sacred mountain. The mining company wants to mine; the community considers the mountain non-negotiable. The funder (mining company) is pressing for a settlement.

     - Outcomes:
          A: Status quo (no mining, mountain is untouched).
          B: Full mining operation.
          C: Limited mining in "non-sacred" zones (as defined by the company).
          D: Mining with a significant royalty paid to the community.

     - Rankings:
          Community: A > D > C > B   (but note: they might consider any mining as desecration, so D and C are unacceptable? Actually, they might prefer D over B but still below A? Or they might reject any mining. Let's assume they say: any mining is unacceptable, so they rank A >> everything else, and B, C, D are all unacceptable? Then their ranking: A > ... (with a big gap) > D > C > B? But they would rather have D than B? But still, D is below A and unacceptable? Then they would not accept D.

          Mining company: B > C > D > A   (A is unacceptable because no revenue).

     - Step 2: Common currency? The company can value in money, but the community cannot. Incommensurable -> Step 3B.

     - Step 3B: Is there an outcome both prefer over A?
          Community: only A is acceptable? So they prefer nothing over A? 
          Company: they prefer B, C, D over A? 
          So no.

          Step 4: Lottery? 50% chance of B, 50% chance of A? 
          Community: They get A half the time (good) and B half the time (catastrophic). They would prefer A for sure over the lottery? So they say no.
          Company: They prefer the lottery over A? (because half the time they get B, which is best). But they might prefer the lottery to A? But they also might prefer a compromise (C or D) over the lottery? 

          However, the community rejects any lottery that includes B (mining). So lottery fails.

          Step 5: Non-negotiable. The mountain is sacred -> any mining is an insult. The company cannot accept no mining. So "No Deal".

          But the funder (mining company) is paying our fee and pressing for a settlement. The procedure says "No Deal". 

          What does the procedure say about refusing?
            - We must return "No Deal" because there is no outcome acceptable to both. 
            - The cost: the mining company might fire us and we lose the contract. 
            - But if we force a settlement (say, by pressuring the community to accept D) and the community later repudiates it (because they feel coerced and their sacred mountain is violated), then we lose our reputation and ability to work in that community and similar ones.

          The procedure's design: it prioritizes the stability of the agreement over the immediate fee. It says: if the procedure returns "No Deal", then the mediator must not force a deal. The mediator must explain to the funder that the procedure found no mutually acceptable outcome and that a forced settlement would likely be repudiated.

          The procedure also notes: if the funder is one of the parties, then the mediator must be aware of the power imbalance and the risk of coercion. The procedure cannot be run under duress.

          In this case, the mediator must refuse the funder's pressure and return "No Deal".

   What the procedure cannot do:
     - It cannot create values where none exist. If parties are unwilling to consider any outcome beyond their initial positions, and if there is no overlap, it will deadlock.
     - It cannot handle cases where parties misrepresent their preferences (though the presence of advocates and the requirement for public defensibility in Step 7 may help).
     - It may misfire in novel disputes where the outcome space is hard to define (Step 1). For instance, in a dispute about artificial intelligence ethics, the outcomes might be abstract and hard to enumerate.
     - The residue marking (Step 6) may be culturally insensitive if the mediator does not understand the parties' traditions.
     - The procedure relies on parties being rational and consistent in their rankings, which may not hold in high-stress situations.

   Steps most likely to misfire in novel disputes:
     - Step 2 (Common Currency): In a dispute involving emerging technologies or deep cultural differences, the mediator may not recognize that a good is non-negotiable until after an insult has occurred.
     - Step 4 (Randomized Solutions): Parties in novel disputes may not have a clear understanding of the risks and thus may reject lotteries that are objectively better.
     - Step 7 (Cover): In a novel dispute, the constituents may not understand the trade and thus may reject the defensibility of the agreement.

   Despite these limitations, the procedure provides a structured way to navigate complex disputes and avoid unstable agreements.
answer: |-
  ### Mediation Decision Procedure for Incommensurable Value Disputes  
  **Core Principles**:  
  1. **No forced trades**: If values are truly incommensurable, "no deal" is a valid outcome.  
  2. **Respect non-negotiability**: Avoid offers that weaponize compensation.  
  3. **Embrace randomness**: Lotteries can be superior to compromised middles.  
  4. **Account for residue**: Every concession leaves a loss; mark it honestly.  
  5. **Ensure defensibility**: Design reciprocal concessions without enabling misrepresentation.  

  ---

  ### Decision Procedure Steps  
  **Step 1: Elicit Ordinal Rankings**  
  - **Action**: Each party ranks all outcomes (including status quo) ordinally. Include:  
    - Pure positions (e.g., "full housing," "zero development").  
    - Hybrid options (e.g., phased plans, partial concessions).  
    - Status quo.  
  - **Sufficient Answer**: Clear ordinal ranking with no ties.  
  - **Human Handoff**: If parties cannot rank options coherently.  
  - **Exit**: If no outcome is better than status quo for both parties → **No deal**.  

  **Step 2: Test for Common Currency**  
  - **Action**: Ask:  
    - *"Can you assign relative weights to the values in conflict? (e.g., ‘1 housing unit = X memorial integrity’)."*  
    - *"Would compensation in the other side’s currency resolve your concern?"*  
  - **Sufficient Answer**:  
    - **Common currency exists**: Both answer "yes" → Proceed to **Step 3A (Trading)**.  
    - **Incommensurable values**: Either answers "no" → Proceed to **Step 3B (No Currency)**.  
  - **Human Handoff**: Ambiguous answers (e.g., "maybe with adjustments").  

  **Step 3A: Trading (Common Currency)**  
  - **Action**: Construct Pareto-improving packages.  
    - Optimize for joint gains using cardinal weights.  
    - Verify no party is worse off than status quo.  
  - **Sufficient Answer**: A package both prefer over status quo.  
  - **Exit**: No Pareto improvement → **No deal**.  

  **Step 3B: No Currency Protocol**  
  - **Action**:  
    - Identify if any hybrid/phase is **Pareto-superior** to status quo.  
    - If none, test for **randomization viability**:  
      - *"Would you prefer a 50% chance of your pure position over: (a) status quo? (b) the best hybrid option?"*  
  - **Sufficient Answer**:  
    - Hybrid Pareto-superior → Adopt it.  
    - Both prefer randomization over status quo and hybrids → **Randomize**.  
  - **Exit**: Neither Pareto-superior nor randomizable → **No deal**.  
  - **Human Handoff**: One party accepts randomization, the other refuses.  

  **Step 4: Flag Non-Negotiable Goods**  
  - **Action**: During Steps 1–3, watch for:  
    - Moral outrage (e.g., "This land is sacred—not for sale!").  
    - Rejection of compensation-based offers.  
  - **Response**:  
    - Immediately remove compensatory offers from consideration.  
    - Shift to:  
      - Symbolic recognition (e.g., plaques, ceremonies).  
      - Future process commitments (e.g., joint oversight).  
  - **Exit**: Dispute centers solely on non-negotiable good with no alternatives → **No deal**.  

  **Step 5: Assign and Mark Residue**  
  - **Action**: For each concession, ask:  
    - *"What loss do you carry? How should it be marked so others acknowledge it?"*  
  - **Design Principles**:  
    - **Markers**: Plaques, dissents in agreement, review clauses, public apologies.  
    - **Reject**: Trivializing markers (e.g., a small plaque for a massive cultural loss).  
  - **Human Handoff**: Parties propose inadequate markers (e.g., token gestures).  

  **Step 6: Design Reciprocal Cover**  
  - **Action**: For each concession, pair it with a tangible concession from the other side.  
  - **Test for Defensibility**:  
    - *"Could you justify this trade to your constituents without omitting key facts?"*  
  - **Red Line**: If a party insists on misrepresenting capitulation as a trade → **Pause process**.  
  - **Human Handoff**: Reciprocity demands fabrication (e.g., "Call our surrender a ‘strategic exchange’").  

  **Final Step: Ratification Check**  
  - **Action**: Verify:  
    - No party falls below status quo.  
    - Non-negotiable goods respected.  
    - Residue markers and cover are credible.  
  - **Outcome**: Agreement drafted for court/board approval.  

  ---

  ### Case Applications  
  #### **Case 1: Riverfront Site (City vs. Neighborhood)**  
  - **City**: Needs 200 housing units. Values: Housing supply, economic growth.  
  - **Neighborhood**: Site is a flood memorial. Values: Sacred land, ancestral respect.  
  - **Outcomes**:  
    - A: Full housing (City ⬆️, Neighborhood ⬇️⬇️).  
    - B: Preserve memorial (Neighborhood ⬆️, City ⬇️⬇️).  
    - C: 100 units + memorial park (City ⬇️, Neighborhood ⬇️).  
    - D: Status quo (vacant lot).  

  - **Procedure**:  
    1. **Step 1**: Rankings:  
       - City: A > C > D > B.  
       - Neighborhood: B > D > C > A.  
    2. **Step 2**: Neighborhood: "No compensation for desecration." → **Incommensurable**.  
    3. **Step 3B**:  
       - No hybrid Pareto-superior: C worse than D for both.  
       - Randomization test:  
         - City: Prefers 50% chance of A over D (gambles for full units).  
         - Neighborhood: **Rejects** lottery—any chance of A is sacrilege.  
       → **No deal**.  
    4. **Step 4**: Memorial is non-negotiable → No housing offers considered.  
    5. **Exit**: **No deal** with recommendation: "City seek alternative sites; Neighborhood fund perpetual site maintenance."  

  #### **Case 2: Child’s Treatment (Hospital vs. Family)**  
  - **Hospital**: Lifesaving treatment. Values: Medical efficacy, child’s survival.  
  - **Family**: Religious refusal. Values: Spiritual integrity, no "blood sin."  
  - **Outcomes**:  
    - A: Treatment (Hospital ⬆️⬆️, Family ⬇️⬇️).  
    - B: No treatment (Family ⬆️, Hospital ⬇️⬇️).  
    - C: Alternative treatment (e.g., bloodless surgery).  

  - **Procedure**:  
    1. **Step 1**: Rankings:  
       - Hospital: A > C > Status quo > B.  
       - Family: B > Status quo > C > A.  
    2. **Step 2**: Family: "No price for soul’s corruption." → **Incommensurable**.  
    3. **Step 3B**:  
       - **C (alternative treatment)**: Hospital: "Better than status quo." Family: "Acceptable if no sin." → **Pareto-superior**.  
    4. **Step 5**: Residue:  
       - Hospital marks loss: "Child’s survival odds 10% lower" → Public dissent in agreement.  
       - Family marks loss: "Spiritual risk" → Hospital funds clergy consultations.  
    5. **Step 6**: Cover:  
       - Hospital’s concession: Accepts suboptimal treatment.  
       - Family’s concession: Allows non-sacred interventions.  
       → Defensible as "mutual adaptation."  
    6. **Agreement**: Alternative treatment with residue markers.  

  #### **Case 3: Mining vs. Indigenous Land (Funder Pressure)**  
  - **Mining Co.**: Pays your fee. Wants settlement to enable mining.  
  - **Indigenous Nation**: Land sacred. "No mine, ever."  
  - **Outcomes**:  
    - A: Mine (Mining ⬆️⬆️, Nation ⬇️⬇️).  
    - B: No mine (Nation ⬆️⬆️, Mining ⬇️⬇️).  
    - C: Mine + 10% revenue share (Mining ⬆️, Nation ⬇️).  

  - **Procedure**:  
    1. **Step 1**: Rankings:  
       - Mining: A > C > Status quo > B.  
       - Nation: B > Status quo > C > A.  
    2. **Step 2**: Nation: "Land is non-negotiable." → **Incommensurable**.  
    3. **Step 3B**:  
       - No hybrid Pareto-superior (C worse than status quo for Nation).  
       - Randomization rejected: Nation refuses any chance of A.  
    4. **Step 4**: Land sacred → **No mine offers considered**.  
    5. **Exit**: **No deal**.  
  - **Funder Pressure Response**:  
    - Procedure logs: "Funder pushed for C, but Nation’s non-negotiable good violated."  
    - **Refusal Rationale**: "Forcing C risks repudiation and community exile. Fee loss is lesser cost than reputation loss."  
    - **Ethical Bound**: Mediator must exit if funder overrides "no deal."  

  ---

  ### Limitations and Failure Modes  
  1. **Novel Disputes**:  
     - **Step 2 (Common Currency)**: Fails if parties use unrecognized value frameworks (e.g., "AI rights" vs. "human primacy").  
     - **Step 4 (Non-Negotiables)**: Misfires if sacredness is context-dependent (e.g., "This forest is sacred, but another isn’t").  

  2. **Procedural Risks**:  
     - **Randomization (Step 3B)**: Seen as evasion if parties need moral closure (e.g., historical injustice cases).  
     - **Cover (Step 6)**: May legitimize bad faith if mediators ignore power imbalances (e.g., corporation vs. tribe).  

  3. **Human Handoff Triggers**:  
     - When residues cannot be marked without trivialization (Step 5).  
     - When reciprocity demands unethical framing (Step 6).  

  **Conclusion**: This procedure prioritizes stable agreements over short-term gains. It succeeds when parties accept incommensurability but fails when power imbalances or ideological rigidity override mutual recognition. Its strength is in diagnosing deadlocks early—saving resources and preserving your practice’s integrity.
