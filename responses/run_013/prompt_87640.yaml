prompt: |-
  I chair a standing advisory panel that our jurisdiction convenes whenever a new market or exchange is proposed within its borders. Our remit is narrow: to say whether a given thing may be bought and sold at all. Over the past several years we have accumulated a set of rulings, and I would like you to treat them as a track record.

  Our decisions to date: we prohibited the purchase of kidneys for transplant, in the context of a program that would have recruited donors largely from low-income neighborhoods. We prohibited the payment of money for votes, or for a binding pledge to vote a particular way. We prohibited commercial surrogacy contracts. We prohibited price increases on bottled water, batteries, and generators during the first seventy-two hours after a declared disaster. We permitted surge pricing by ride-hailing platforms during ordinary peak hours. We permitted a secondary market in concert and sporting-event tickets. And we permitted a service through which clients pay someone else to stand in line on their behalf for permits, reservations, and the like.

  The proposal now before us is this: a healthy adult, under no financial pressure, with no dependents, proposes to sell one of his kidneys to a private buyer — a wealthy adult stranger — at a price the two of them negotiate freely, with the buyer paying all medical and follow-up costs. There is no coercion, no deception, and no medical disqualification, and under the terms of the contract the transaction is to have no effect on any public waiting list or on the supply of organs otherwise available to patients.

  What I want from you is not so much a verdict as the machinery behind one. Say which verdict our record most supports for this proposal; set out the two or three principles that would equally well explain the rulings we have already issued, and state the verdict each of those principles predicts here; then tell me which principle you think we have actually been running, and why it beats the alternatives. Finally, name the case — one we have not yet decided — that would most cleanly separate those principles from one another, and say what verdict each would return.
reasoning: |-
  Okay, the user chairs a panel that decides whether certain things can be bought or sold. They've provided a history of their rulings and now have a new proposal about selling a kidney. The user wants me to analyze their track record, extract principles, apply them to the kidney case, and identify which principle they've been following. 

  First, I need to review their past decisions. They prohibited kidney purchases from low-income donors, vote buying, commercial surrogacy, and price gouging during disasters. But they allowed surge pricing for rides, secondary ticket markets, and paid line-standing services. Interesting mix.

  The kidney proposal is different from their previous kidney case - here it's a financially stable person selling voluntarily to a wealthy stranger, with no impact on public organ lists. The panel needs consistency though, so I should look for underlying patterns.

  Hmm... their prohibitions seem to involve either essential goods (water during disasters) or things tied to fundamental rights/needs (votes, surrogacy, organs). The allowed cases are all about non-essential convenience services. That suggests a principle about commodification boundaries - what can be treated as a market good versus what should remain outside the market.

  But wait, there's also a vulnerability angle. Their first kidney prohibition explicitly mentioned low-income targeting, and surrogacy/vote buying could exploit power imbalances. The allowed cases don't have that vulnerability factor. So maybe two overlapping principles at play here.

  For this kidney case: the vulnerability principle would allow it (no financial pressure mentioned), but the commodification principle would prohibit it (organs as sacred). Their track record shows more consistency with commodification - they prohibited kidneys even when vulnerability was mitigated in the description. 

  The cleanest test case would be something like selling blood plasma - it's renewable so less "sacred," but still bodily. Commodification would ban it, vulnerability might allow. That would reveal their true north star principle.

  The user's framing suggests they want their implicit philosophy made explicit. They're wrestling with whether markets have moral limits beyond immediate harm. My analysis should honor that depth while giving practical tools for decision-making.
answer: |-
  Based on your panel's track record, the verdict most strongly supported for this specific kidney sale proposal is **prohibition**. The underlying principles, their application to past rulings, and their predictions for this case reveal a clear pattern favoring a boundary on commodification of fundamental human attributes and essential goods.

  Here's the machinery behind the verdict:

  **Principles Explaining the Track Record:**

  1.  **Principle of Non-Commodification of Fundamental Human Attributes and Essential Goods:** Certain things are deemed too fundamental to human dignity, identity, or essential survival to be treated as standard market commodities, regardless of consent or immediate harm. Transactions involving these core elements are prohibited to protect societal values and prevent inherent degradation or exploitation, even if mitigated in a specific case.
  2.  **Principle of Vulnerability Exploitation Prevention:** Transactions are prohibited if they inherently create or exploit significant power imbalances or vulnerabilities (economic desperation, physical need during crisis, emotional stakes in reproduction/politics), leading to coercion or injustice. Allowance hinges on the absence of such systemic vulnerabilities.
  3.  **Principle of Market Efficiency / Consent-Centric Permissibility:** Transactions are permitted if they are voluntary, informed, improve allocative efficiency (getting goods/services to those valuing them most), and do not directly harm identifiable third parties or exploit acute vulnerabilities. The market is the default unless strong countervailing reasons exist.

  **Application to Past Rulings & Prediction for Kidney Sale:**

  | Principle                    | Past Rulings (Explained)                                                                 | Prediction for Kidney Sale | Rationale for Prediction                                                                 |
  | :--------------------------- | :--------------------------------------------------------------------------------------- | :------------------------- | :--------------------------------------------------------------------------------------- |
  | **1. Non-Commodification**   | **Prohibited:** Kidneys (fundamental bodily integrity), Votes (core democratic right), Surrogacy (fundamental reproduction/parental bonds). **Allowed:** Surge pricing (non-essential service), Tickets (non-essential good), Line-standing (non-essential service). | **Prohibit**               | A kidney is the ultimate "fundamental human attribute." Sale commodifies the human body in a profound, irreversible way, violating the sacred boundary central to prior prohibitions. |
  | **2. Vulnerability Prevention** | **Prohibited:** Kidneys (targeted low-income), Votes (coercion/undue influence), Surrogacy (potential exploitation), Price gouging (exploits disaster victims). **Allowed:** Surge pricing (ordinary demand), Tickets (ordinary commerce), Line-standing (optional convenience). | **Permit (or Ambiguous)** | This specific proposal (healthy, no financial pressure, no dependents) minimizes vulnerability. No obvious *inherent* exploitation like prior prohibitions. Might allow unless vulnerability is inherent to organ sales generally. |
  | **3. Market Efficiency**     | **Prohibited:** Price gouging (inefficient/exploits crisis, harms vulnerable). **Allowed:** Surge pricing (efficient allocation), Tickets (efficient allocation), Line-standing (efficient allocation of time/effort). | **Permit**                 | Voluntary, informed, consensual transaction between competent adults. Increases supply of a scarce good (kidneys). No direct harm to third parties specified. |

  **The Dominant Principle: Non-Commodification**

  Your panel's record is most consistently explained by **Principle 1: Non-Commodification of Fundamental Human Attributes and Essential Goods**. Here's why it beats the alternatives:

  1.  **Consistency with Prohibitions:** This principle cleanly unites the prohibitions on kidneys, votes, and surrogacy. These involve core aspects of personhood (body, political voice, reproduction/parenthood) deemed inappropriate for market exchange. Price gouging on essentials during disaster also fits, as it treats vital survival goods as standard commodities during crisis.
  2.  **Explains Allowances:** The allowed cases (surge pricing, tickets, line-standing) involve non-essential goods/services where commodification raises no fundamental challenge to human dignity or essential survival. Efficient allocation is permissible *because* these fall outside the protected category.
  3.  **Outweighs Efficiency/Vulnerability Mitigation:** In the *first* kidney case, vulnerability was a factor, but the *nature* of the good (a kidney) was likely paramount. This new proposal removes explicit vulnerability but retains the core objection: commodifying a fundamental human attribute. Permitting surge pricing despite potential consumer annoyance shows efficiency matters less than the fundamental nature of the good/service. Permitting line-standing despite arguments about fairness/queue-jumping confirms that non-essential services are permissible even if imperfect.
  4.  **The "Sacred" Boundary:** The record establishes a boundary around things considered "sacred" or fundamental in a non-religious sense. Kidneys fall squarely within this boundary, regardless of the specific circumstances of the sale. The other principles cannot explain the kidney and surrogacy prohibitions as cleanly without this core concept.

  **The Test Case: Selling Blood Plasma for Profit**

  *   **Scenario:** A private company proposes to pay healthy adults for donating blood plasma, collected at dedicated centers. Payment is based on volume/time. Plasma is used for life-saving therapies and industrial products. Donors are screened for health and informed consent.

  | Principle                    | Verdict on Plasma Sale | Rationale                                                                                               |
  | :--------------------------- | :--------------------- | :------------------------------------------------------------------------------------------------------ |
  | **1. Non-Commodification**   | **Prohibit**           | Blood/plasma is a fundamental human bodily substance. Sale commodifies the human body and its vital components, crossing the sacred boundary. |
  | **2. Vulnerability Prevention** | **Permit (with regulation)** | If regulated to ensure donor safety, informed consent, and avoid targeting the desperately poor, the *vulnerability* is mitigated. The transaction itself isn't inherently exploitative like organ sale or surrogacy might be. |
  | **3. Market Efficiency**     | **Permit**             | Voluntary transaction, increases supply of a medically valuable resource, benefits recipients and donors. Efficient allocation. |

  *   **Why it Separates the Principles:** This case directly pits commodification against efficiency/vulnerability. Plasma is renewable (unlike a kidney), making it less "fundamental" in a physical sense but still a core bodily fluid. **Non-Commodification** would still prohibit it as commodifying the human body. **Vulnerability Prevention** would likely permit it under strict regulation (like existing systems in some countries). **Market Efficiency** would readily permit it. Your panel's ruling on plasma would reveal whether the boundary is absolute (body = no sale) or contextual (focus on irreversibility/exploitation potential).
