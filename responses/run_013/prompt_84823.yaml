answer: |-
  ## Office of the Registrar: Dialetheist Policy Implementation FAQ

  **1. What is the Dialetheist Policy (Policy 7.12)?**
  Policy 7.12, ratified by Faculty Senate Resolution 2023-04, acknowledges that certain statements within the Academic Regulations may be both true and false simultaneously. The Office of the Registrar is mandated to implement regulations consistent with this recognition. This does not imply all contradictions are true. See Section 5 for clarification.

  **2. Doesn't this mean *any* regulation can be claimed? For example, could I argue I automatically get an 'A' in every class?**
  No. Policy 7.12 operates under a paraconsistent framework (as detailed in Registrar Memo 2023-07). While specific, identified contradictions are recognized as true (and false), this does not entail that *every* possible statement follows (the principle of explosion does not apply). Your academic record remains governed by the standard regulations except where a designated contradiction exists. Claims of automatic 'A' grades are unsupported by Policy 7.12 or the Regulations. Submit a standard Grade Appeal (Form G-22) if you believe an error exists.

  **3. If some regulations are both true and false, how can the Office make consistent rulings? Why isn't every possible claim true?**
  Policy 7.12 identifies specific, bounded contradictions within the Regulations. The Office adheres to the principle of *non-triviality*: only statements explicitly designated as dialetheic under the policy, or logically entailed *without* employing disjunctive syllogism on contradictory premises, are recognized as both true and false. This prevents the entire regulatory system from collapsing (trivialism). Rulings are based on the totality of non-dialetheic regulations and the specific dialetheic instances enumerated in Appendix D of Policy 7.12. The Faculty Senate Oversight Committee (FSOC) reviews all designated contradictions biannually.

  **4. Can you provide an example relevant to students?**
  *   **Example A (Prerequisites - Regulation 4.05):** The policy recognizes the statement "Course BIO 400 requires BIO 201 *and* does not require BIO 201" as a true contradiction for students who transferred equivalent credit under the 2021 Articulation Agreement but lack the specific BIO 201 course code. Such students *both* meet *and* do not meet the prerequisite. Resolution requires submission of Transfer Credit Exception Form TC-8 and advisor consultation. Both outcomes are valid simultaneously; enrollment is permitted despite the unmet code requirement.
  *   **Example B (Late Withdrawal - Regulation 8.11):** The statement "The deadline for late withdrawal without penalty is the end of Week 10 *and* the end of Week 12" is a designated dialetheia for the Spring 2023 semester only (due to FSOC ruling 2023-11). Students submitting Form W-15 *during Week 11* were processed under both deadlines. Tuition refund calculations reflect this dual status.

  **5. What happens if I appeal a decision that involves a dialetheic regulation?**
  Appeals processes (Regulation 12.00) remain operational. The Academic Standards Committee (ASC) reviews appeals considering Policy 7.12. A ruling *may* be both upheld (as correct based on one aspect of the dialetheia) and dismissed (as incorrect based on the other aspect) simultaneously. For instance, in a Spring 2023 late withdrawal appeal (Ref: ASC-2023-457), the Committee found the Registrar's application of the Week 10 deadline *correct* and the student's claim invoking the Week 12 deadline *also correct*, resulting in the appeal being both upheld (regarding the Week 12 aspect) and dismissed (regarding the Week 10 aspect). The student's withdrawal status and partial refund stood.

  **6. How do I know if my situation involves a true contradiction?**
  Consult the official list of designated dialetheic regulations maintained in Appendix D of Policy 7.12, available on the Registrar's website under "Policies." This list is exhaustive. Do not assume a contradiction exists simply because regulations appear conflicting; most perceived conflicts are resolved via standard interpretation (see FAQ #1). If your situation precisely matches the criteria outlined for a listed dialetheia, bring the relevant documentation (e.g., transcript, specific forms) to a scheduled appointment. Schedule a 15-minute consultation online via the Student Portal.

  **7. This seems confusing. What if I get conflicting advice?**
  Policy 7.12 necessitates heightened precision. A situation not explicitly listed in Appendix D is governed solely by non-dialetheic regulations. Advisors and staff have received training on Policy 7.12 implementation (Reference: Training Module TM-7.12). If you receive advice that seems to invoke a contradiction *not* listed in Appendix D, clarify the specific regulation cited. The existence of true contradictions means advisors may correctly provide seemingly conflicting guidance *only* for Appendix D scenarios. For non-listed scenarios, standard conflict resolution procedures apply. The Office acknowledges this may require students to navigate complex scenarios; schedule an appointment for case-specific guidance.

  **8. Can I exploit this? For example, could I register for two classes scheduled at the same time if there's a contradiction?**
  No. The statement "Student X can register for conflicting courses" is *not* a designated dialetheia in Appendix D. Time conflicts are resolved solely by the non-dialetheic Regulation 3.07 (Scheduling Conflicts). Attempting to register for overlapping courses will generate a standard system error. Policy 7.12 does not override core scheduling constraints or create new permissions; it only recognizes specific, pre-existing contradictions within the *written* regulations concerning requirements, deadlines, and procedures.

  **9. What about tuition refunds involving dialetheic deadlines (like Example B)?**
  Refund calculations (Regulation 9.04) are applied consistently. In cases involving a dialetheic deadline period (e.g., Week 11 in Spring 2023), the calculation reflects the *overlap* of the valid refund percentages from both deadlines. A precise formula is applied as per Addendum F to Regulation 9.04. This results in a determinate refund amount. Bring your specific withdrawal date and course information to a scheduled appointment for calculation.

  **10. Was the Faculty Senate aware of the potential complications?**
  Yes. Policy 7.12 underwent rigorous review by the Faculty Senate Committee on Academic Policy (CAP) and received full Senate approval (Senate Vote 2023-28) after considering the potential impacts documented in the CAP Subcommittee Report on Paraconsistent Implementation (2023-09). The policy is deemed necessary to accurately reflect the current state of the Academic Regulations while maintaining operational integrity through the paraconsistent framework.

  **For further clarification, schedule a 15-minute appointment online or consult Appendix D of Policy 7.12. Bring all relevant forms and documentation to your appointment.**
