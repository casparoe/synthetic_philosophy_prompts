prompt: |-
  My friend has a philosophy PhD and is now insufferable about it. Over the years I've collected her verdicts on borderline cases. Baldness: no hair, bald; ten hairs, bald; a hundred thousand hairs, not bald. Heap: two grains, not a heap; five hundred grains, a heap. On the ones in the middle — five thousand hairs, fifty grains — she refuses both labels: "I can't say it's bald and I can't say it isn't," "you won't get a yes or no out of me there." She will say a fifty-grain pile is "more of a heap" than a forty-grain one. And when I asked whether there's some exact number of hairs where baldness stops, she said "I don't think you'll find one" and changed the subject. I genuinely can't tell whether she thinks there's an answer we can't reach or no answer at all.

  She's now helping me build a sorting machine that has to drop every pile into either a "heap" bin or a "not heap" bin — so it needs one exact cut-off, and she has to choose it. Predict what she'll say and why. Lay out the rules that fit everything she's told me so far (at minimum I'd expect epistemicism, supervaluationism, contextualism, and some degrees-of-truth view — tell me if there's a fifth I'm missing), what each predicts about the machine, which one she's most likely actually running and why, and what single further case or question would finally seperate them.

  Sections: "The rules on the table" (a short list, one line each), "What each predicts about the cut-off" (a few lines each), "My money's on" (one paragraph), "The question that settles it" (short).
reasoning: |-
  Okay, the user's friend has a philosophy PhD and is acting insufferable about it, especially regarding vague concepts like baldness and heaps. The user has collected her statements on borderline cases. For example, she says no hair is bald, ten hairs is bald, but a hundred thousand isn't. Similarly, two grains aren't a heap, but five hundred are. For middle cases like five thousand hairs or fifty grains, she refuses to label them as either bald/not bald or heap/not heap. She also says a fifty-grain pile is "more of a heap" than forty grains. When asked if there's an exact number where baldness stops, she avoids the answer, saying "I don't think you'll find one." The user is confused whether she thinks there's an answer we can't reach or no answer at all.

  Now, she's helping build a sorting machine that must put every pile into either "heap" or "not heap" bins, requiring an exact cut-off. The user wants to predict what she'll say and why. They need an analysis of different philosophical rules that fit her behavior: epistemicism, supervaluationism, contextualism, and degrees-of-truth, and if there's a fifth. Then, for each, outline what it predicts about the cut-off, which one she's most likely using, why, and a question to settle it.

  First, I need to recall what each theory says about vagueness. Epistemicism posits there's a sharp boundary, but it's unknown. Supervaluationism says there's no single boundary; truth is based on all possible sharpenings. Contextualism depends on context for the boundary. Degrees-of-truth assigns partial truth values. The fifth one might be fuzzy logic or something similar.

  Her behavior: She avoids committing in borderline cases, uses comparative statements ("more of a heap"), and denies the existence of a knowable exact number. That sounds like she rejects sharp boundaries, so epistemicism seems unlikely because it insists there is one, just unknown. She explicitly avoids saying there's an exact number, which contradicts epistemicism.

  Supervaluationism fits better: in borderline cases, statements are neither true nor false because different sharpenings disagree. She refuses to label middle cases, which aligns with this. Also, comparatives like "more of a heap" work under supervaluationism—it can be true if all sharpenings agree on the comparison.

  Contextualism might also fit. The boundary shifts with context, so in a conversation, she might avoid committing because context isn't specified. But in the machine scenario, she has to pick a cut-off, and contextualism allows for a context-dependent choice.

  Degrees-of-truth (fuzzy logic) assigns values like 0.5 to borderlines. Her saying "more of a heap" could reflect higher degrees. But she refuses binary labels, which degrees-of-truth also does, since it's about partial truth.

  Now, for the machine: Each theory's prediction on the cut-off. Epistemicism: She picks a specific number, knowing it's arbitrary but necessary. Supervaluationism: She might pick any number in the borderline range, seeing it as arbitrary. Contextualism: She chooses based on practical needs of the machine. Degrees-of-truth: She might refuse or average, but the machine requires a binary, so she must pick, perhaps reluctantly.

  But in supervaluationism, when forced to choose, she might pick a cut-off that's penumbral, acknowledging it's not the only valid one. Contextualism: The machine's context defines the boundary.

  Which one is she likely using? Her denial of an exact number suggests she doesn't believe in a sharp boundary, so epistemicism is out. Her use of comparatives and refusal in borderlines points to supervaluationism or degrees-of-truth. Supervaluationism handles comparatives well, as it can say "more heap" is true if all sharpenings agree. Degrees-of-truth also handles comparatives via higher degrees.

  But in the machine scenario, for supervaluationism, she might say any cut-off in the range is acceptable. For degrees-of-truth, she might want a probabilistic approach, but the machine needs binary, so she might set a threshold like 0.5.

  The fifth theory? Maybe pragmatic or psychological views, but the main ones are covered. Perhaps dialetheism, but that's less common.

  Key question to settle: Ask if, for a specific number N in borderline, "N grains is a heap" is neither true nor false, or if it has partial truth. Supervaluationism says neither true nor false; degrees-of-truth says it has a truth value between 0 and 1. Contextualism might say it depends, but in a fixed context, it could be true or false.

  So, the question: "For a fifty-grain pile, is the statement 'This is a heap' neither true nor false, or is it partially true to some degree?"

  If she says neither, it's supervaluationism. If she assigns a degree, it's degrees-of-truth. Contextualism might say it depends on context, but in the abstract, she might lean one way.

  But in her past behavior, she refused yes/no, which both supervaluationism and degrees-of-truth do. The key difference is in truth values.

  For the machine, she has to choose a cut-off. I think supervaluationism is most likely because it handles comparatives without degrees and fits her refusal to commit in borderlines.

  Predicting her response: She'll say something like, "We have to pick a cut-off for practicality, but it's arbitrary; any number in X to Y range is as good as another." That's supervaluationist.

  Contextualist might say, "Based on the sorting needs, we choose this number."

  But the user mentioned she changed the subject on exact numbers, implying she thinks it's not there, so supervaluationism.

  Final answer structure:

  - Rules on the table: List the four or five theories.
  - Predictions for cut-off: Each in a few lines.
  - My money's on: Supervaluationism, explain why.
  - Question to settle: Ask about truth value of borderline statement.
answer: |-
  ### The Rules on the Table
  - **Epistemicism**: A sharp but unknowable boundary exists.
  - **Supervaluationism**: No single boundary; truth defined via all possible "sharpenings."
  - **Contextualism**: Boundary shifts with conversational context.
  - **Degrees-of-Truth**: Truth is partial (e.g., 0.3 true) on a continuum.
  - **Fifth (Fuzzy Logic)**: Vagueness as graded membership (subset of degrees-of-truth).

  ### What Each Predicts About the Cut-Off
  - **Epistemicism**: She picks a precise number (e.g., 217 grains) as the cut-off, treating it as fixed but arbitrary due to ignorance. She’ll insist it’s "objectively there" but admit we can’t know it.
  - **Supervaluationism**: She selects a number within the borderline range (e.g., between 100–400 grains), emphasizing it’s a practical choice from many equally valid options. She’ll call it "arbitrary but necessary," refusing to endorse it as the "real" boundary.
  - **Contextualism**: She chooses based on the machine’s purpose (e.g., higher cut-off for industrial sorting), framing it as context-dependent. She’ll say, "For this task, it’s X," but deny it applies universally.
  - **Degrees-of-Truth / Fuzzy Logic**: She avoids a binary cut-off initially, proposing a probability-based system (e.g., >70% "heapness"). When forced, she picks a threshold (e.g., 0.5 truth-value) but calls it "inherently fuzzy" and stresses the machine misrepresents reality.

  ### My Money’s On
  **Supervaluationism**. Her refusal to label borderline cases ("I can't say it is or isn't") aligns with supervaluationism's "neither true nor false" stance for indeterminacy, while her comparative judgments ("more of a heap") fit its reliance on unanimous agreement across sharpenings. She explicitly rejects an exact number ("I don't think you’ll find one"), dismissing epistemicism, and her unyielding neutrality in borderline cases rules out contextualism (which allows context-specific answers) and degrees-of-truth (which permits graded labels). Supervaluationism also explains her subject-changing—it treats vagueness as semantic indecision, making the cut-off a pragmatic choice without ontological commitment, which she’d rationalize as "necessary for the machine but not real."

  ### The Question That Settles It
  **"For a fifty-grain pile, is 'This is a heap' NEITHER TRUE NOR FALSE, or does it have a PARTIAL TRUTH VALUE (e.g., 0.6)?"**  
  - If "neither true nor false" → **supervaluationism** (truth gaps).  
  - If "partial truth value" → **degrees-of-truth/fuzzy logic** (truth degrees).  
  - If "depends on context" → **contextualism** (avoids a fixed answer).  
  - If "objectively true/false but unknown" → **epistemicism** (denies vagueness).  
  *(Her avoidance of partial values in past remarks hints at supervaluationism, but this forces a direct choice.)*
