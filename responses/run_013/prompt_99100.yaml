prompt: |-
  I build distributed systems for a living, and the furniture of my mental world is append-only event logs, multi-version concurrency control, logical and vector clocks, snapshots, read views, and the kind of version history you get from a content-addressed store; I am at ease with formal notions of monotonicity, causal ordering, eventual consistency, and the difference between a value and the record of how that value came to be. I have no formal training in metaphysics, and I would like you to explain the presentism/eternalism dispute about time to me by translating it into this vocabulary rather than by paraphrasing the standard textbooks at me.

  Please restate the debate as faithfully as you can: the contrast between the A-series and the B-series, the notion of temporal passage or the moving present, the claim that the present is metaphysically privileged, and the question of what existence is supposed to amount to when it is predicated of past and future times. Treat a time as an index into the log, a tensed proposition as a query evaluated against a particular read view, the present as a cursor position, the passage of time as the advance of that cursor, and so on — but do not smuggle metaphysical assumptions in under the cover of the analogy: wherever a mapping is forced or breaks down, say so plainly rather than papering over it.

  Then give me the residue report, which is the part I care about most. Which parts of the dispute map cleanly onto distinctions my vocabulary already draws? Which parts survive only under distortion? And which have no counterpart at all — is there anything the metaphysicians are arguing about that I cannot even state in my terms, and if so, is that a defect of my vocabulary or a sign that the disagreement is thinner than it appears? In particular, I want to know whether the apparent dispute over temporal passage is doing any work that a cursor and a log do not already do; whether the privilege of the present can be captured by anything other than an arbitrary choice of whose clock you read; and whether the eternalist's claim that all times are equally real is genuinely stronger than the claim that all times are equally recorded. End with your honest view of whether the block-universe picture is a discovery about time or an artefact of the very vocabulary I have asked you to use.

  Please write your answer in British English.
