answer: |-
  **(The wooden pews creak as all eyes fix on the pulpit. The speaker, mid-forties, weathered face etched with conviction, grips the lectern. His voice is clear, resonant, carrying the weight of a painful truth newly grasped.)**

  Brethren, friends… ye who taught me the sharp, bitter lesson that this American Union is founded on a covenant with death and an agreement with hell. Ye who showed me the chains woven into the very parchment of our Constitution – chains I once believed rendered the oath to uphold it an oath to uphold bondage itself. Tonight, I stand before ye, my teachers, my comrades in this holy war against slavery, to say… I was wrong. Not in the cause, never that! But in the reading of that document. I see it now, not as the slaveholders’ impregnable fortress, but as their prison wall… cracking.

  Hear me! I reason not from the hearts of men long dead, many stained with the sin of slaveholding – a truth I freely grant, and which shames our nation. No. I reason from the words themselves, the structure laid bare.

  Look to the Preamble! "We the People of the United States…" *We the People.* Not "We the States," not "We the Masters," but "We the People." Does this People include the enslaved? The document dare not say it plainly – that is its original sin, its cowardice. But it does not *exclude* them. It speaks in the name of a whole, a sovereign authority residing in the *People*. Where does that sovereignty lie? It rests, ultimately, not with Carolina planters, but with the collective conscience and power of all who claim the name American. That phrase is a seed, brethren, planted in poisoned ground, but a seed nonetheless.

  Consider the migration clause! "The Migration or Importation of such Persons as any of the States now existing shall think proper to admit, shall not be prohibited by the Congress prior to the Year one thousand eight hundred and eight..." A bargain with the Devil, yes! They bought twenty years of human trafficking. But mark the date! *Eighteen hundred and eight.* The framers, slaveholders though many were, built an expiration date into the Atlantic slave trade. Why? Because they knew it was an evil, a *national* evil requiring eventual national action. They shackled Congress *only* until that year. After 1808, the power to strangle that traffic rested with the Federal Government, wielded by a majority representing *the People*. It was a delayed power, a moral failure in the delay, but a power *explicitly granted* to end a specific, monstrous aspect of slavery.

  Look at the three-fifths clause! "Representatives… shall be apportioned… by adding to the whole Number of free Persons… three fifths of all other Persons." A foul thing! It counted our brothers and sisters, denied their humanity, as fractions to swell the political power of their oppressors. But see the flaw in the slaveholder's armor! Why count them at all? Because the slaveholder *knew* their existence was a fact the Constitution couldn't ignore. And in counting them, even as fractions, the document acknowledged they were *persons*, not mere chattel like mules or ploughs. It anchored their existence within the national structure. And that representation? It is power delegated by the People. Power that rests on the backs of the enslaved. Can that power not be turned? Can representatives elected *because* of the three-fifths clause not be held accountable by the People to dismantle the system that gives them that unnatural weight? The clause empowers the master, but it also exposes his dependence on the federal compact built upon the *existence* of the enslaved.

  And the fugitive clause! "No Person held to Service or Labour in one State… escaping into another, shall… be discharged from such Service or Labour, but shall be delivered up..." A dagger aimed at the heart of every fleeing soul. The bitter fruit we taste daily under the new, hellish Fugitive Law. I know the cry: "You counsel patience! You comfort the slaver with this reading!" Brethren, hear me true! I counsel no patience! The bloodhounds are baying *now*, the chains clank *now*. But see what the clause actually says: "No Person held to Service or Labour..." *Person.* Again! The Constitution stammers on the truth it tries to bury. And it commands delivery only if the claimant proves the person is "held to Service or Labour" *under the laws of the state they fled*. That clause presupposes the validity of state laws creating that "service." But what if a State, acting under the sovereignty inherent in "We the People," declares no man can be "held to service" within its borders? What if the People, through their national government, finally declare that no state law creating chattel slavery is just, is compatible with the Preamble's promise? The clause is a command built on sand – the sand of slavery's legitimacy. Undermine that legitimacy, and the command crumbles.

  Does this comfort slaveholders? They tremble at such a reading! Because it uses their own document, their own compact, against them. It says the power they wield was loaned by the People, and the People can recall it. It says the clauses they rely on are not endorsements of perpetual bondage, but flawed mechanisms within a framework that contains the seeds of their own destruction if the People have the courage to plant them.

  To those who say this counsels patience to the bleeding captive: Never! This is not a call to wait, but a call to seize *all* the tools. The moral suasion that burns hearts? Wield it! The aiding of the fugitive, defying the vile Law? Do it! But also, seize the tool of the Constitution itself! Organize! Petition! Vote! Elect men who will use the powers granted – the power to regulate commerce, the power over territories, the power of the purse, the power of amendment – to strangle slavery everywhere the Federal hand can reach. Use the representation the three-fifths clause grants the South to send men North who will dismantle the system! Turn their stolen political power against the theft itself!

  The old teaching, that the Constitution is *only* a pro-slavery compact, paralyzes us in the very arena where the battle must be fought. It tells us the field belongs forever to the enemy. I say the field is contested ground, and the words of the compact itself are weapons we have left rusting in the armory. Pick them up! Forge them anew!

  So, my dear Garrisonian friends, ye who taught me the fire of conscience, do not abandon that fire! Kindle it hotter! But turn its light upon the text itself. Be the prophets who show the People how their own founding words condemn the sin festering in their midst. Be the voice that demands the nation live up to the terrifying, radical promise hidden within its flawed covenant: "We the People." Including all. Blessing all. Or it will bless none. **The slave power trembles not at our rejection of the Constitution, but at our discovery of its power.** Use that discovery. Be prophets… *with* the text.

  **(He steps back, the echo of his last words hanging in the silent, charged air.)**
