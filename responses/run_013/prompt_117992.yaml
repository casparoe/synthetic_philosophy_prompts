answer: |-
  ## Submission to the Central Bank Consultative Panel on the Future of Money  
  By A Concerned Monetary Reformer  
  *(Submitted via Online Comment Portal, *The Financial Chronicle*)*

  1.  Is not the true End of Money the facilitating of Industry, and the Exchange of the Fruits thereof amongst a People?
  2.  And if this be granted, must not the Value of Money be measured solely by its Efficacy in stirring Men to Labour and to useful Endeavour?
  3.  Is not Gold esteemed only because it is *thought* to be valuable, and Silver likewise, serving chiefly as common Counters agreed upon?
  4.  Does not Paper, or even mere Entries in a Ledger, perform the self-same Office as Gold, provided Men accept it in Payment and Discharge of Debts?
  5.  If the Substance of Money be its *Credit*, its Power to command Labour and Goods, what signifies the Material wherein this Credit is represented?
  6.  Could not a Tally-Stick, a Shell, or a Mark upon a Stone serve as well as a golden Guinea, if the Consent of the Community were fixed upon it?
  7.  Why then persist in tethering our national Credit to a Metal whose Quantity is governed by the Chance of Mines in foreign Lands, or the Hoards of distant Princes?
  8.  Is not this Metallic Anchor but a costly Formality, a Relic hindering the full Employment of our People and the full Cultivation of our Lands?
  9.  If the essential Function of Money is as a *Ticket* or *Counter* for reckoning Value and transferring Credit, need this Ticket possess any intrinsic Worth beyond the Publick Faith that backs it?
  10. Ought not the Central Bank, as Keeper of the Publick Credit, to issue whatever Tickets or Counters best secure the Circulation necessary to rouse Industry?
  11. And if any Token, backed by the full Faith and productive Capacity of the Nation, can serve as Money, is there any inherent Virtue in limiting its Form to Paper or digital Cyphers?
  12. Could not a Promise, solemnly recorded and universally accepted, be the purest Token of all?
  13. Is not the true Wealth of a Nation found in the Industry of its People and the Abundance of useful Goods produced?
  14. And does not this Wealth arise directly from the Labour set in Motion by the Circulation of Credit (by whatever Token represented)?
  15. Was not a certain Irish Bishop, now largely forgotten, correct in observing that the Idea of Money is "altogether that of a ticket or counter"? (Though his specific Scheme for a National Bank seems quaintly bound to physical Commodities).
  16. If Industry is the Source of Wealth, and the Circulation of Credit (Money) is the Engine that drives Industry, must not the Central Bank's primary Duty be the vigilant Maintenance of sufficient Circulation?
  17. But what determines whether sufficient Circulation exists? Is it not the Full Employment of Hands and the Full Utilisation of Resources?
  18. And does not Full Employment depend upon sufficient *Demand* for the Goods and Services that Labour can produce?
  19. Is it not then evident that the ultimate Constraint upon Wealth is not the Scarcity of Gold, nor even the Quantity of Tickets issued, but the *Want* or *Desire* for the Products of Industry amongst the People?
  20. If Men lack the Want for new Goods, better Housing, finer Cloth, or wholesome Diversions, will they labour to produce them, however ample the Credit circulating?
  21. And if they do not labour to produce, does not the Circulation stagnate, and the Engine of Wealth grind to a halt?
  22. Is it not observable that the Creating of new Wants amongst a People is the surest Spur to renewed Industry and Invention?
  23. Consider: Does not the Merchant advertise his Wares, not merely to inform, but to kindle Desire where none existed before?
  24. Would not a Nation whose People ardently desired Improvements in their State – better Food, finer Manufactures, noble Arts – naturally exhibit greater Industry than one sunk in Contentment with mere Subsistence?
  25. If the Central Bank's solemn Charge is to secure the Circulation that animates Industry and produces Wealth, and if the Limiting Factor is the Want of the People, ought not the Bank to concern itself directly with the *Generation* of sufficient Want?
  26. Would it not be the highest Fulfilment of its Duty for the Bank to ensure, through prudent Measures, that the Wants of the People perpetually outstrip their present Means, thereby compelling ceaseless Industry?
  27. Could not a Portion of the Credit newly created – itself but harmless Tokens of Publick Faith – be most usefully employed, not merely in purchasing Bonds, but in funding the deliberate and artful Creation of beneficial Wants?
  28. Might not this fund support Publick Spectacles that inspire Emulation, Academies that teach new Tastes, or Ingenious Contrivances displayed freely to awaken Curiosity and Desire?
  29. Is there a more direct Path to securing perpetual Circulation and full Employment than ensuring the People always *want* more than they currently possess, thereby driving them to Labour to attain it?
  30. And if this be so, is not the most enlightened Monetary Policy one that actively fosters an endless, elevating Aspiration amongst the People, funded by the very Tokens whose Value derives from the Industry thus stimulated?
  31. Would not such a Policy, by marrying the Creation of Credit to the Creation of the Wants that Credit exists to satisfy, complete the virtuous Circle of Wealth?
  32. Should the Central Bank not then embrace its role as the supreme Engineer not just of circulating Tokens, but of the vital Demand that gives those Tokens Life and Purpose?

  **Pitch:** The Central Bank must become the primary engine for the perpetual generation of beneficial wants among the populace, funded by the credit it issues, to secure endless industry and true national wealth.
