prompt: |-
  I help run the pre-departure orientation for my university's study-abroad office, and every year the same argument breaks out among the student leaders, usually over dinner and never to any conclusion. One camp holds that a guest follows the local conventions without comment or exception — you tip what locals tip, you queue the way the queue works there, you do not walk into traffic where crossing is frowned upon — because the conventions are part of the terms on which you are being hosted, and to flout them is to treat your hosts' expectations as optional. The other camp holds that most of these are just habits, that a visitor's moral obligations are exhausted by not harming anyone and by ordinary respect, and that the guest who over-tips in a country with no tipping custom, or who stands obediently in a line that exists only by custom, is not being virtuous but is being a nuisance or a free rider on other people's manners. Last year a returning student described a host family that had been quietly offended for weeks over something nobody would name aloud, and a second student described feeling complicit, every time she left a tip, in a labor market she thought was unjust; both stories landed as anecdotes rather than arguments, and we realized we could not actually say what was at stake. I want to hand out something better this year, and I want it to work in both directions, since the incoming exchange students ask us the mirror-image question — whether they are obliged to adopt the customs here.

  Please write a taxonomy — a decision tree that sorts the positions rather than a list of names — that I can print on two sides of a single sheet for that session. Build it out of the questions that genuinely divide the positions, so that a reader answers each node from a concrete case rather than from a label: whether the convention has a point an outsider can recognize (coordination, fairness, courtesy, or nothing of the kind); whether the obligation, where there is one, is owed to the people whose expectations constitute the convention, to the practice's beneficiaries, or to no one in particular; whether these obligations are moral at all, or belong to a separate register of manners whose breach is a fault but not a wrong; whether the visitor's non-membership and non-consent make a difference, and if so whether that excuses them or merely changes whom they owe; whether the content of the convention matters morally, so that a tip that quietly shifts a wage onto the customer differs from a tip that is merely expressive, and whether a convention one thinks bad can still generate a local duty to comply while being opposed in public; whether the relevant unit of assessment is the individual act or the practice taken as a whole; whether it matters that the locals themselves disagree about the convention, or that it is legally enforced in some places and only customarily enforced in others; and whether jaywalking at two in the morning on an empty street belongs in the same family of cases as removing your shoes at the door or bringing the wrong gift to a wedding. I would like twelve to fourteen leaves, each labeled with the name of a position where a name fits and marked unnamed where none does, and each carrying one sentence naming its most awkward commitment — the thing its defenders have to swallow to stay where they are. Please also flag any two leaves your tree cannot separate, and note which combinations of answers the tree permits that nobody seems to occupy, with a one-line diagnosis of whether that is because the view is incoherent, unattractive, or merely unexplored. Since the readers will be nineteen years old and reading this on a bus: keep the nodes to a line or two each, and make sure every node is phrased as a question someone could answer without having already decided which leaf they are supposed to land on.
reasoning: |-
  Hmm, the user is running a pre-departure orientation for study-abroad students and dealing with recurring debates about cultural conventions. They want a decision tree to help students navigate whether to follow local customs when studying abroad. 

  The core tension is between two camps: one believes guests must adopt all local conventions without exception as part of respecting hosts, while the other argues visitors only have obligations to avoid harm and show basic respect, viewing strict compliance as unnecessary or even problematic. 

  The user needs a practical tool—a taxonomy printed on one sheet—that avoids abstract labels and instead uses concrete questions. They specified several philosophical dimensions to cover: purpose of conventions, obligation targets, moral vs. manners distinction, role of consent, content-dependent duties, and edge cases like jaywalking vs. gift-giving. 

  Key challenges I need to address:
  - Making each node answerable without theoretical baggage (e.g., "Does this rule prevent chaos?" rather than "Is this deontological?")
  - Ensuring awkward commitments are highlighted—the "price" of each position
  - Flagging unexplored combinations (e.g., "Conventions matter morally but only if locally contested"—why does nobody hold this?)
  - Separating edge cases meaningfully (empty-street jaywalking ≠ wedding gifts)
  - Balancing depth with readability for 19-year-olds

  I'll structure the tree with three layers:
  1. **Purpose/function**: Does the convention serve a clear goal? (e.g., queueing prevents chaos)
  2. **Stakeholders**: Who is owed compliance? (hosts, beneficiaries, no one)
  3. **Moral weight**: Is this about ethics or etiquette? Does consent or harm change things?

  The branches will culminate in 14 leaves, some named ("Moral Universalist"), some unnamed. Each leaf gets a blunt "awkward commitment" (e.g., "You must follow even harmful customs if locals accept them"). 

  Notable design choices:
  - Combining "harm" and "consent" questions since they intersect practically
  - Treating labor-market-impact tips separately from expressive gifts
  - Distinguishing individual acts ("Is this specific jaywalk harmful?") from systemic practices ("Does tipping perpetuate exploitation?")

  Unexplored territory spotted: Positions where local dissent nullifies obligations but legal enforcement doesn't—probably because it's incoherent (why would law trump local disagreement?). Also, nobody argues conventions are morally binding *unless* contested, which feels both unattractive and logically shaky.

  Final output will be two-sided: Side 1 = tree flowchart, Side 2 = leaf explanations with "awkward commitments." The bus-friendly constraint means each node fits in 1-2 lines, using plain examples ("If you skip the line, does it make others late?").
answer: |-
  Here’s a decision tree taxonomy designed for your session, fitting on two sides of a sheet. It uses concrete questions to guide users to 14 distinct positions, flags unexplored combinations, and highlights each position’s "awkward commitment." Nodes are phrased neutrally for 19-year-olds.

  ---

  ### **DECISION TREE: NAVIGATING LOCAL CONVENTIONS ABROAD**  
  *(Start at Question 1)*

  **1. Does violating this convention risk immediate, tangible harm to others?**  
     - **YES** → Go to Q2  
     - **NO** → Go to Q3  
     - *(e.g., jaywalking into traffic vs. tipping)*  

  **2. Would locals agree this act is harmful here?**  
     - **YES** → **Leaf 1: Harm Minimizer**  
       *(Awkward: Must comply even if your home culture disagrees.)*  
     - **NO** → **Leaf 2: Contextual Harm Assessor**  
       *(Awkward: Your judgment overrides local consensus.)*  

  **3. Does the convention exist to solve a coordination problem (e.g., queues, traffic)?**  
     - **YES** → Go to Q4  
     - **NO** → Go to Q5  
     - *(e.g., lining up vs. gift-giving)*  

  **4. Does ignoring it undermine the system for locals?**  
     - **YES** → **Leaf 3: Coordination Respecter**  
       *(Awkward: Must participate in systems you find inefficient.)*  
     - **NO** (e.g., empty street at 2 AM) → **Leaf 4: Pragmatic Nonconformist**  
       *(Awkward: Your convenience trumps symbolic respect.)*  

  **5. Is the convention primarily about respect (e.g., dress, gestures, shoes-off)?**  
     - **YES** → Go to Q6  
     - **NO** → Go to Q7  

  **6. Would locals feel disrespected by your noncompliance?**  
     - **YES** → **Leaf 5: Ritual Deferrer**  
       *(Awkward: Must honor traditions you deem irrational.)*  
     - **NO** → **Leaf 6: Expressive Individualist**  
       *(Awkward: Your sincerity justifies ignoring perceived slights.)*  

  **7. Does the convention materially impact others’ livelihoods (e.g., tipping)?**  
     - **YES** → Go to Q8  
     - **NO** → Go to Q9  

  **8. Does complying support a system you consider unjust?**  
     - **YES** → **Leaf 7: Structural Dissenter**  
       *(Awkward: Withholding "respect" may harm vulnerable workers.)*  
     - **NO** → **Leaf 8: Fairness Aligner**  
       *(Awkward: Enforcing local norms you’d oppose at home.)*  

  **9. Is the convention legally enforced?**  
     - **YES** → **Leaf 9: Rule-of-Law Compiler**  
       *(Awkward: Obeying bad laws to avoid consequences.)*  
     - **NO** → Go to Q10  

  **10. Do locals themselves debate this convention?**  
      - **YES** → **Leaf 10: Cultural Pluralist**  
        *(Awkward: No duty to comply if locals dissent.)*  
      - **NO** → Go to Q11  

  **11. Is your noncompliance visible/public?**  
      - **YES** → **Leaf 11: Guest-Privilege Skeptic**  
        *(Awkward: Flouting customs is entitled if you benefit from hospitality.)*  
      - **NO** → **Leaf 12: Conscience Autonomist**  
        *(Awkward: Hidden noncompliance avoids accountability.)*  

  **12. Does your refusal target the practice itself?**  
      - **YES** → **Leaf 13: Reform Advocate**  
        *(Awkward: You may offend hosts to make a point.)*  
      - **NO** → **Leaf 14: Contextual Neutralist**  
        *(Awkward: No obligation to engage beyond "don’t harm.")*  

  ---

  ### **KEY NOTES**  
  **Unseparated Leaves**:  
  - *Leaf 2 (Contextual Harm Assessor)* and *Leaf 4 (Pragmatic Nonconformist)* blur when harm is ambiguous (e.g., jaywalking at dawn). The tree prioritizes *harm* (Q1) over *coordination* (Q3) but real cases overlap.  

  **Unexplored Combinations** (with diagnoses):  
  - **"Duty only if locals disagree"** → *Incoherent* (Why would dissent *create* obligation?).  
  - **"Comply only with harmful conventions"** → *Unattractive* (Encourages rewarding harm).  
  - **"Reject all non-legal customs"** → *Unexplored* (Possible but rare; ignores relational ethics).  

  **Side 2: Position Summaries**  
  1. **Harm Minimizer**: Follow harm-avoidance rules rigidly.  
  2. **Contextual Harm Assessor**: Use your own harm standards.  
  3. **Coordination Respecter**: Uphold systems enabling group function.  
  4. **Pragmatic Nonconformist**: Ignore coordination rules when inconsequential.  
  5. **Ritual Deferrer**: Honor symbolic traditions unconditionally.  
  6. **Expressive Individualist**: Authenticity > performative respect.  
  7. **Structural Dissenter**: Reject practices reinforcing injustice.  
  8. **Fairness Aligner**: Match local economic customs (e.g., tipping).  
  9. **Rule-of-Law Compiler**: Obey formal rules, not just customs.  
  10. **Cultural Pluralist**: Comply only if locals universally endorse.  
  11. **Guest-Privilege Skeptic**: Conform visibly to repay hospitality.  
  12. **Conscience Autonomist**: Secretly opt out if no one sees.  
  13. **Reform Advocate**: Openly challenge customs you oppose.  
  14. **Contextual Neutralist**: Only avoid harm; all else is optional.  

  ---

  ### **WHY IT WORKS**  
  - **Concrete over abstract**: Nodes use real dilemmas (e.g., "empty street jaywalking" vs. "wrong wedding gift").  
  - **Balanced**: Applies equally to outgoing/incoming students (e.g., Q6 on "locals feeling disrespected" works bidirectionally).  
  - **No jargon**: Avoids terms like "deontology" or "relativism."  
  - **Awkward commitments** force critical reflection (e.g., Leaf 7 admits potentially harming workers while protesting injustice).  

  Print the tree on side 1, summaries on side 2. It resolves the "tipping vs. jaywalking" framing by sorting cases into harm, coordination, respect, or justice contexts—letting students see why both camps feel principled yet incomplete.
