prompt: |-
  Retired now after a career in experimental biology, I have spent the past two years teaching myself moral philosophy, and I have reached the stage where I would rather have a principle than a reading list. The question I keep circling is moral worth: what distinguishes an action that is merely right, or useful, from one that reflects well on the person who performed it — what is it, exactly, to act for the right reasons?

  I have been working through cases and recording my honest reactions to them. Here they are.

  1. A man wades into a cold river and pulls out a drowning stranger. He takes no pleasure in it; he finds the stranger repellent, resents the interruption, and feels only irritation throughout. He does it solely because he takes it to be required of him. My reaction: the act has moral worth; he acted for the right reasons. This is the verdict I hold most loosely, but it is my verdict.

  2. A second man does the same thing purely from a spontaneous rush of pity, without ever considering what is required of him. My reaction: this also has moral worth, and I cannot see why the first man should receive credit that the second does not.

  3. A third man pulls the stranger out because he recognizes him as wealthy and hopes for a reward. My reaction: no moral worth at all. The outcome is fortunate; the reason is bad.

  4. A fourth man pulls the stranger out both because he takes it to be required and because he wants the reward; either motive would have sufficed on its own. My reaction: I want to say the act retains some worth but that the reward taints it, and I reverse myself every time I think it through. I cannot settle this one.

  5. A woman raised in a community that taught her it is gravely wrong to aid members of a certain group nonetheless hides such a person from a mob, out of simple compassion for the person. She believes she is doing something forbidden. My reaction: this is the most admirable case of the lot, better than the men in (1) and (2), even though by her own lights she is sinning.

  6. A woman gives a large sum to a charity that turns out to be a fraud, out of genuine compassion for the people she believes it serves. My reaction: her act was not right — it did harm — yet she strikes me as no less creditable than anyone else here.

  7. A man refrains from cheating on his taxes only because he fears an audit. My reaction: he does the right thing, and it has no moral worth.

  8. A man refrains from cheating because he holds honesty to be required of him, and would not cheat even if audits did not exist. My reaction: moral worth.

  Here is the tentative principle I have been working with. I am a scientist, and what I reach for is a control experiment. To ask whether someone acted for the right reasons, I propose to vary the motive while holding the situation fixed, and to ask whether the consideration that made the action right was doing any work in producing it. Call a reason load-bearing when, had that consideration not obtained while everything else stayed the same, the agent would not have acted as she did. The principle would then be: an action has moral worth just in case the right-making consideration was load-bearing in this sense.

  The principle handles (1), (2), (5), (7) and (8) as I would like. It stumbles on (6), where no right-making consideration obtained at all, since the charity was a fraud, and yet I want to credit her. And it issues no verdict on (4), where each motive is load-bearing on its own and the test returns two answers at once.

  What I would like from you is not a survey of the literature — I do not care who said what — but an answer on the merits. State the principle, or the small set of competing principles, as precisely as you can; for each clause, identify the case that forces it; tell me what your preferred principle implies about the two cases I could not settle and about two further cases you devise yourself; and tell me honestly which of my eight verdicts it cannot accommodate and why I should give that one up.
reasoning: |-
  Hmm, this retired experimental biologist has a fascinating challenge about moral worth. They've clearly done deep thinking, presenting eight nuanced cases and a "load-bearing" principle inspired by scientific controls. Their core question - what makes an action praiseworthy beyond just being right - cuts to the heart of moral philosophy.

  The scientist's approach is admirable: real cases, honest reactions, and a self-built principle. Their struggle with case 4 (mixed motives) and case 6 (good intentions with bad outcomes) shows where their model cracks. I notice their verdicts lean toward internal motivations mattering more than external results - especially clear in case 5 where the woman acts against her beliefs out of compassion.

  Their load-bearing principle is clever but too mechanical. It works like a controlled variable test: if removing the "right-making feature" would change the action, then that feature was motivationally significant. But morality isn't a lab experiment. Case 6 proves the problem - the donor's compassion was load-bearing for helping, yet the actual help didn't exist. Their intuition (she's still praiseworthy) clashes with the principle.

  For case 4, the dual motives create a superposition where the principle can't decide if the moral reason was necessary. This exposes a flaw in binary "load-bearing" thinking - motives aren't always separable circuits. The scientist also seems torn here, wanting to acknowledge the moral motive while disliking the reward contamination.

  Their strongest intuitions are: duty matters (case 1), emotion isn't inferior to duty (case 2), bad motives spoil actions (case 3), and good motives can redeem bad outcomes (case 6). The tax cases (7-8) show they distinguish fear from principle. Most strikingly, case 5 suggests they value moral courage over mere rule-following.

  I'll need to offer a principle that handles motivation more fluidly - perhaps focusing on what the agent was responding to in the world, not just psychological triggers. The fraud charity case demands room for "aiming at good" even when missing the mark. For mixed motives, we might need a threshold or dominant-reason approach. And I must build test cases to probe these edges further.
answer: |-
  Your approach—grounded in cases and seeking a unified principle—is precisely how moral philosophy advances. After examining your judgments and the limits of your load-bearing principle, I propose a refined framework centered on **moral recognition**, with three core components. This principle accommodates most of your intuitions while resolving your uncertainties about cases (4) and (6), and it challenges one of your verdicts on principled grounds.

  ---

  ### **The Principle of Moral Recognition**
  **An action has moral worth iff:**  
  1. **The agent acts *on behalf of* a right-making consideration** (e.g., preventing harm, upholding dignity),  
  2. **Their recognition of this consideration *explains* their action** (it is motivationally salient),  
  3. **Their commitment to it is *non-instrumental*** (they treat it as inherently reason-giving, not merely useful for other ends).  

  **Key clarifications:**  
  - **"On behalf of"** means the agent takes the right-making feature as their *goal* or *justification*, even if imperfectly articulated.  
  - **"Explains their action"** captures your "load-bearing" intuition but avoids over-mechanization: the moral consideration must be *part of the agent's practical reasoning*, not just a counterfactual trigger.  
  - **"Non-instrumental"** excludes cases where the moral feature is a means to an ulterior end (e.g., reward-seeking).  

  ---

  ### **How It Handles Your Cases**  
  | Case | Verdict | Principle's Reasoning |  
  |------|---------|-----------------------|  
  | **1** | ✓ Moral worth | Acts *because* he recognizes a duty (non-instrumental commitment to "requiredness" as a right-making feature). |  
  | **2** | ✓ Moral worth | Acts *because* pity directs him to the victim’s suffering (a right-making feature). Spontaneity doesn’t negate recognition. |  
  | **3** | ✗ No moral worth | Reward is instrumental; the right-making feature (saving a life) is not his goal. |  
  | **4** | **✓ Moral worth (tainted)** | Duty is a non-instrumental, load-bearing reason. Mixed motives reduce *praiseworthiness* but not moral worth—the moral reason still does work. *(Resolves your conflict)* |  
  | **5** | ✓ Moral worth (admirable) | Acts *on behalf of* compassion (a right-making feature), despite false beliefs. Her commitment overrides self-interest. |  
  | **6** | ✓ Moral worth | Acts *on behalf of* relieving suffering (the right-making consideration). The fraud is external luck; her recognition explains the act. *(Resolves your conflict)* |  
  | **7** | ✗ No moral worth | Fear of audit is instrumental (self-interest). Honesty plays no role in his reasoning. |  
  | **8** | ✓ Moral worth | Honesty is recognized as inherently required (non-instrumental). |  

  **The Challenge: Case (1)**  
  Your verdict here is the one the principle *rejects*. If the man acts solely from a sense of "requiredness" but finds the stranger repellent and feels only irritation, his commitment is **procedural** (rule-following) but not **substantive** (oriented toward the victim’s worth). He acts *because* a rule demands it, not *on behalf of* the stranger’s humanity. This reduces moral worth because:  
  - **The right-making feature (preserving life/dignity) isn’t what moves him**; only abstract duty does.  
  - Contrast with case (5), where compassion *forces* engagement with the victim’s humanity despite beliefs.  
  *Why give it up?* Your intuition in (5) reveals you value responsiveness to moral patients, not just rules. Case (1) lacks this—he’d save a sack of grain if "required."  

  ---

  ### **Two New Test Cases**  
  **Case 9: The Reluctant Philanthropist**  
  A CEO donates $1M to a disaster-relief fund. She believes aid is morally required but donates *only* because her PR team insists it will avert a scandal. Without the scandal risk, she would keep the money.  
  - **Principle’s verdict:** ✗ No moral worth. She acts for instrumental reasons (reputation). The right-making feature (alleviating suffering) isn’t motivationally salient.  

  **Case 10: The Misguided Rescuer**  
  A man jumps into a river to save a drowning dog, believing it is a child. He acts from urgent compassion.  
  - **Principle’s verdict:** ✓ Moral worth. He acts *on behalf of* saving a life (a right-making feature), and compassion explains his action. The mistake doesn’t negate his moral recognition.  

  ---

  ### **Competing Principles & Why This One Fits Best**  
  1. **Kantian Rigorism** ("Moral worth only from duty, excluding inclination"):  
     - *Fails* cases (2) and (5): Your praise for spontaneous pity/compassion conflicts with this.  
     - *Forces abandonment* of verdicts (2), (5), (6).  

  2. **Consequentialism** ("Moral worth from good outcomes"):  
     - *Fails* cases (6) and (10): Outcomes are bad/misguided, but you credit the agents.  
     - *Forces abandonment* of verdicts (3), (6), (7), (8).  

  3. **Virtue Ethics** ("Moral worth from expressing character"):  
     - *Fails* case (1): The reluctant rescuer acts "dutifully" but without virtue.  
     - *Overly vague* on what counts as "virtuous" in cases like (4).  

  **Why Moral Recognition Wins:**  
  - Explains why **good motives with bad results** (6, 10) still have worth: The agent’s moral attention is praiseworthy.  
  - Explains **mixed motives** (4): A moral reason can be load-bearing even alongside self-interest.  
  - Explains the **superiority of compassion** (5): It directly engages with the moral patient’s plight.  
  - Grounds worth in **why the agent takes the right-making feature seriously**, not just outcomes or rules.  

  Your scientist’s instinct for a "control" is preserved in requiring the moral consideration to *explain* the act—but expanded to capture the *quality* of recognition. This principle honors your intuition that morality is about **seeing and responding to what matters** in others.
