  The climax is Kael realizing that resemblance between objects is inherent and doesn't need an exemplar. This implies that shared properties exist beyond the exemplar system. For the stand, I'll show that the society has ignored a real aspect of reality—direct similarity—by over-relying on exemplars. This makes the world feel fragmented, missing universals.

