answer: |-
  ## The Unregistered Resemblance

  The air in the Spectrum Guild hummed with the low whine of Spectricles – polished brass and obsidian instruments resembling bulky binoculars. Inside each, a meticulously curated library of color exemplars glowed: Crimson-3, Azure-Prime, Verdant-9. To speak of "red" was heresy, an invocation of the banned concept of shared property. Instead, you said an object "bore strong resemblance to Crimson-3" or "aligned weakly with Scarlet-7." The Spectricle confirmed it, comparing the object's light signature only to the chosen stored sample, never cross-referencing objects or implying a universal "redness."

  Kael, an apprentice optician, polished the primary lens of his assigned Spectricle. His fingers moved automatically, but his mind churned. For weeks, he'd been plagued by a simple observation: whenever two objects – say, a rusted pipe and a ripe *felix* fruit – both registered "strong resemblance to Rust-Anchor," they *looked*… similar. More than that, when he held them side-by-side, their shared hue seemed undeniable, a bridge built without an exemplar. This direct resemblance felt *primary*, not secondary. Yet, try to quantify *that* resemblance? The Spectricle demanded an exemplar. *Which one?* Rust-Anchor? But then it wasn't measuring the pipe against the fruit, only each against the exemplar, presupposing the very similarity he wanted to verify.

  "Kael! Daydreaming again?" Master Vor's voice cut through his thoughts. Vor held a chipped ceramic tile and a dried leaf. "Client requires confirmation. Does the tile resemble Ochre-Dusk? Does the leaf resemble Ochre-Dusk?"

  Kael dutifully took the objects. He loaded the shimmering Ochre-Dusk exemplar into his Spectricle. He scanned the tile: the lenses whirred, aligning spectra. A green light glowed. *Strong resemblance to Ochre-Dusk*. He scanned the leaf: another green light. *Strong resemblance to Ochre-Dusk*.

  "Both register strong for Ochre-Dusk, Master," Kael reported.

  "Excellent. Standard procedure," Vor nodded, turning away.

  "But Master," Kael blurted, holding the tile and leaf up together. "Look. They resemble *each other*. Directly."

  Vor paused, a flicker of annoyance crossing his face. "Apprentice Kael, 'Resemble each other'? That phrase is… imprecise. Meaningless without a registered exemplar. *How* do they resemble? You must specify *which exemplar* captures the nature of their similarity. Ochre-Dusk *is* the registered point of convergence. That is sufficient. The resemblance *between* objects is merely an echo, a consequence, not a measurable phenomenon itself. Now, polish the tertiary lens array."

  Kael lowered the objects. The tile was a flat, warm brown; the leaf, a veined, slightly yellower brown. Yet, under the Guild's harsh lumen-lamps, their shared kinship in hue was stark against the sterile white workbench – a kinship the Spectricle couldn't, or wouldn't, acknowledge directly. *Because it has no category for "similar to each other,"* Kael realized, *only "similar to X." But if both are similar to X, how can they not be similar to each other? And proving that similarity requires… another X? It eats its own tail.*

  Later, sorting new mineral samples, Kael found two distinct shards. One was rough granite flecked with deep crimson minerals; the other was smooth obsidian with a startlingly similar crimson streak. He isolated the red flecks as best he could under his personal magnifier. He loaded the exemplar Crimson-3.

  *Granite fleck: Strong Resemblance to Crimson-3.*
  *Obsidian streak: Strong Resemblance to Crimson-3.*

  He held the shards side-by-side, aligning the flecks and the streak under the lens. The crimson hues danced, undeniably akin, sharing a vibrancy absent from the surrounding stone. The urge to *compare them directly* was overwhelming. He imagined a Spectricle function that bypassed the exemplar library, measuring light signature against light signature. But the machine offered no such option. To register their mutual resemblance, he’d need… what? To claim they both resembled Crimson-3? That presupposed the connection. To introduce a *new* exemplar made from their light? But that exemplar would then be defined solely by resembling *itself*, not explaining the prior connection. It was a closed loop.

  A cold certainty settled in Kael’s stomach. The Guild’s entire system, their language, their technology – it wasn't just avoiding shared properties; it was actively *blind* to the most fundamental fact: that similarity between things existed *independently* of the exemplars. The exemplars were merely convenient reference points, but the real relationship – the resonance between the pipe and the fruit, the tile and the leaf, these two crimson stones – was a direct, unmediated truth. The Spectricle couldn't see it because it was programmed *not* to look. Society refused to name it because their language forbade the concept. They had abolished the vocabulary of shared properties and, in doing so, had convinced themselves the shared properties didn't exist. Yet here they were, undeniable, shimmering in the mineral flecks before him.

  Kael touched the cool obsidian, then the gritty granite. The crimson in each didn't just point back to Crimson-3; they pointed *to each other*. This resemblance wasn't an echo. It was the foundation the exemplar system precariously balanced upon, a reality their instruments couldn't register and their words couldn't capture. They had built a world on fragmented comparisons, missing the cohesive whole that silently held it together. He looked at the humming Spectricle, no longer a tool of revelation, but a cage for perception. The unregistered resemblance was real. And it changed everything.
