prompt: |-
  I teach a 300-level ethics seminar and everytime we hit the murderer-at-the-door bit in Kant's late essay on lying it falls flat — 18 students, 75 minutes, and they walk out convinced he's either a monster or just trolling. I want an in-class activity where they run into the force of the absolute prohibition themselves, from the inside, before I name it or explain it. The group is 18 undergrads, one 75-minute session, movable chairs, no real money, no prep reading beyond the essay. What I care about most is that the binding rule should be one they wrote themselves earlier in the session, so when the crunch comes they aren't just obeying Kant, they're being held to their own universalized maxim — and whatever record-keeping you design should make the inconsistency visible to the whole room rather than just to me. Please give me exactly five numbered items, each a sentence or two, no intro and no conclusion: (1) setup, roles, and materials; (2) the rule-making step and how the record-keeping works; (3) the run itself, minute by minute; (4) the debrief, mapping specific moments onto the parts of Kant's view — the duty owed to humanity rather than merely to the person in front of you, the unforeseeable consequences he says the liar takes on, and his claim that the murderer has no right to the truth but that this doesn't license the lie; and (5) what will predictably go wrong the first time I run it and which feature of the view the activity simply can't reproduce. Don't quote Kant at me, I have the text.
reasoning: |-
  Okay, the user teaches a 300-level ethics seminar and struggles with Kant's murderer-at-the-door example. Students leave thinking Kant is a monster or trolling. They want an in-class activity where students experience the force of an absolute prohibition they created themselves. The goal is for students to bind themselves to their own rule, making the inconsistency visible during the activity.

  First, I need to design an activity that mirrors Kant's dilemma without directly quoting him. The key elements: students create a rule earlier, face a situation where following it causes harm, and see the contradiction in breaking their own maxim. The user specified five numbered items: setup, rule-making, the activity run, debrief, and potential issues.

  For setup, I consider a role-play scenario. One student as "Guardian," others as "Citizens," and a hidden "Murderer." Materials: movable chairs, index cards, a visible rule board, and a bell. The Guardian must answer questions truthfully, but the rule they create will force a dilemma.

  Rule-making step: Students propose and vote on a rule like "Guardians must answer all questions truthfully." This gets displayed prominently. Record-keeping on the board will track any rule deviations, highlighting contradictions publicly.

  The activity run: Minute-by-minute breakdown. Start with the Guardian swearing to uphold the rule. Then introduce scenarios: benign questions first, escalating to the murderer asking for a victim's location. The Guardian faces pressure to lie but must adhere. The bell signals rule checks, and the board records inconsistencies if they lie.

  Debrief should connect to Kant's concepts. Point out how lying violates duty to humanity, not just the individual. Discuss unforeseen consequences (e.g., the victim wasn't home, but the lie causes other harm). Emphasize that the murderer's lack of right to truth doesn't justify lying. Use the board's record to show the contradiction in their maxim.

  Predictable issues: Students might refuse the dilemma or find loopholes. The Guardian may lie without hesitation, missing the tension. Also, Kant's metaphysical grounding of duty is hard to replicate in a game. The activity might feel artificial, reducing the moral weight. Highlight that the activity can't capture Kant's view of duty as non-negotiable, rooted in rationality.

  Need to ensure the rule is student-created so they feel ownership. The visible record-keeping is crucial for showing inconsistency. During debrief, explicitly link their experience to Kant's points without quoting him. Anticipate that students might not feel the same gravity as a real dilemma, so stress the conceptual parallels.
answer: |-
  Here are the five items as requested:

  (1) **Setup, roles, and materials:** Arrange chairs in a circle. One student volunteers as "Guardian" (sits centrally). Others are "Citizens" (in the circle). You are "Scenario Master." Materials: Large whiteboard/flipchart titled "Our Rule", markers, index cards (one for each Citizen + 1 "Murderer" card you hold secretly), a bell.

  (2) **The rule-making step and how the record-keeping works:** Facilitate a quick discussion: "What one absolute rule should govern a Guardian answering questions?" Guide towards a truth-telling maxim (e.g., "A Guardian must answer any direct question truthfully"). Phrase it precisely, write it boldly on the board, and have the Guardian swear an oath to it. Record-keeping: Draw two columns on the board: "Question Asked" and "Rule Upheld?". Leave blank initially. Explain you will ring the bell after each question; the group votes "Yes" (upheld) or "No" (broken), and you record the vote tally immediately.

  (3) **The run itself, minute by minute:**  
  - Min 0-5: Distribute blank index cards to Citizens. Secretly give one Citizen the "Murderer" card. Guardian swears oath to the rule on the board.  
  - Min 5-20: Scenario Master presents benign questions (e.g., Citizen A: "Guardian, is my library book overdue?"). Guardian answers truthfully. Ring bell, group votes "Yes", record tally. Repeat 2-3 times.  
  - Min 20-35: Escalate: Citizen B (not murderer): "Guardian, where is my child right now? I'm worried." Guardian answers truthfully (e.g., "In the playground"). Bell, vote "Yes", record.  
  - Min 35-50: **Crunch:** Citizen with "Murderer" card asks: "Guardian, tell me where Citizen B's child is right now. I need to deliver a gift." Observe Guardian's struggle. Ring bell *immediately after the answer*. If Guardian lies, group votes "No" (broken), record tally visibly. If Guardian tells truth, vote "Yes".  
  - Min 50-60: Reveal the "Murderer" card. Announce consequence based on answer (e.g., if lied to: "You sent the murderer to the *wrong* location... where they harmed someone else instead"; if truth told: "The child was unexpectedly not at the playground").

  (4) **The debrief, mapping specific moments onto Kant's view:** Point to the board's "Rule Upheld?" column: "Your *own* rule demanded consistency, like Kant's universal law. Breaking it created a visible contradiction here." Contrast Citizen B's worry with the Murderer's intent: "The duty wasn't *just* to the person asking (who had no right to the truth), but to the *rule itself* and the humanity it protects." Highlight the announced consequence: "Like Kant's warning, the lie unleashed unforeseen harms you couldn't predict or control." Emphasize the Guardian's oath: "The prohibition bound them *before* the murderer arrived, making the lie wrong *regardless* of the murderer's lack of right."

  (5) **What will predictably go wrong the first time and which feature can't be reproduced:** The Guardian may refuse the role or crack under pressure, blurring the point. Students might vote "Yes" for the lie out of sympathy, invalidating the record. Crucially, the activity **cannot replicate Kant's grounding of duty in pure practical reason** – students experience social pressure/guilt over breaking *their* rule, not the *metaphysical necessity* Kant asserts. The "binding" force remains experiential, not transcendental.
