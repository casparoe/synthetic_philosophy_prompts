prompt: |-
  I'm in this seminar on religion and politics and I keep having gut reactions to cases that I can't square with each other, and I want to know if there's actually a principle under them or if I'm just making it up as I go. Here's where I land, case by case. A state legislator who thinks abortion is murder for religious reasons votes to restrict it, but in floor debate argues only about late-term health risks and clinic safety — I think thats fine, maybe even admirable. Same legislator stands up and says the bill is required because God commands it — not fine, I think he should keep that to himself. A church that runs a food pantry lobbies the city for more funding, and the pastor says they feed people because Christ compels them — totally fine, nobody should mind that. A neighborhood group opposes a mosque going up because they say it would change the area's Christian character — obviously not fine. A union organizer who's also a lay preacher argues for a higher minimum wage by pointing to the verse about workers deserving their pay — fine, I think. But someone arguing against same-sex marriage by pointing to scripture — not fine — even though both of those are just citing the Bible at a policy question, and I can't immediately say why the first is ok and the second isn't. A doctor testifying for a law against assisted suicide, saying her faith and her oath forbid it — I feel fine about that one, maybe because she'd be the one asked to do it. And the one I keep going back and forth on: a climate activist whose real motivation is that nature is sacred, but who always argues in public about insurance costs and crop yields — is that honest, or is it the same as the legislator hiding his reasons?

  The closest thing I have to a principle is that whats doing the work isn't whether a reason is religious in where it comes from, but whether someone who doesn't share that source could still be expected to weigh it — fine when the religious reason could be restated in terms anyone can assess, not fine when it only moves you if you already accept the authority behind it. But I can tell this doesn't fit the minimum-wage case and the marriage case at once, since as far as I can tell they're structurally identical and I treat them differently; a friend suggested the real difference is whether the religious bit is load-bearing or just decoration, and I can't tell if that saves my principle or just relabels the problem. So what I want is: the principle, or two or three candidate principles, that best captures my verdicts, stated precisely enough that I could apply it to something new, what each one predicts for the climate activist and for a case I haven't listed — a religious hospital refusing to provide a service that's otherwise legally required — and an honest list of which of my verdicts it has to overturn. And if it turns out I'm just inconsistent and nothing gets more than half of these, please say that plainly instead of massaging a principle to fit; I'd genuinely rather know.
reasoning: |-
  Okay, the user is in a seminar about religion and politics and is struggling to reconcile their gut reactions to different cases. They've listed several scenarios where religious reasons are used in public policy debates and they have conflicting feelings about what's acceptable. They want to know if there's a consistent principle behind their reactions or if they're being inconsistent.

  First, I need to look at each case they mentioned. The legislator who votes against abortion for religious reasons but only argues health risks is fine, but citing God's command isn't. The pastor lobbying for food pantry funding mentioning Christ is okay. Opposing a mosque because it changes the area's Christian character is not okay. The union organizer citing the Bible on minimum wage is fine, but using scripture against same-sex marriage isn't. The doctor testifying against assisted suicide based on faith is acceptable. The climate activist using practical arguments despite a sacred nature motivation is questionable.

  The user's initial principle is that if a religious reason can be restated in secular terms that anyone can assess, it's acceptable. Otherwise, it's not. But they notice this doesn't explain why the minimum-wage case is okay but same-sex marriage isn't. Both cite scripture, yet they judge them differently.

  I need to dig deeper. The difference might lie in whether the religious argument is the sole justification or if it aligns with secular reasoning. In the minimum-wage case, the Bible verse supports a secular goal (fair pay) that can be argued without religion. The same-sex marriage opposition often relies solely on religious doctrine without secular equivalence. Also, the mosque opposition targets a group's religious freedom, which is discriminatory, versus the food pantry which serves a public good regardless of motivation.

  The user also mentioned the climate activist. Here, using practical arguments might be acceptable if the sacred nature belief doesn't add a unique policy demand beyond what secular reasons cover. But if the sacred aspect leads to different policies, then hiding it could be dishonest. The religious hospital refusing a service would need to see if the refusal imposes on others' rights or if there's a secular alternative available.

  Potential principles: 
  1. **Justification Standard**: Arguments must be framed in publicly accessible reasons. Religious motivations are okay if the policy can stand on secular grounds. This would make the climate activist acceptable if their practical arguments hold up independently, but the same-sex marriage case fails because it lacks secular justification. 
  2. **Burden/Coercion Principle**: Focus on whether the policy imposes burdens based solely on religious doctrine. Opposing the mosque imposes a burden on Muslims' religious freedom, making it unacceptable. The assisted suicide case might be okay because the doctor is refusing to perform an action against their beliefs, not imposing on others. 
  3. **Decorative vs. Foundational**: If the religious element is motivational but not essential to the argument (like the union organizer), it's fine. If it's the core reason (like the mosque opposition), it's not. This might explain the minimum-wage vs. marriage cases.

  Applying these to the climate activist: If their sacred belief leads to the same policies as secular reasons, using practical arguments is fine. But if the sacred aspect demands more extreme measures, hiding it is dishonest. For the religious hospital, refusing a service like contraception might be problematic if it imposes on others' access without a secular justification.

  The user might also have underlying concerns about fairness, avoiding imposition of religious beliefs, and maintaining public discourse inclusivity. Their inconsistency in same-sex marriage vs minimum wage could stem from perceiving one as discriminatory and the other as aligning with shared values. Recognizing that might help them refine their principles.
answer: |-
  Based on your detailed cases and your struggle to reconcile them, I've analyzed your verdicts and identified three candidate principles. None perfectly capture *all* your judgments (your gut reactions show some tension, particularly on the Bible-citing cases), but each highlights a distinct aspect of your reasoning. Crucially, **none require overturning your verdict on the mosque case or the legislator citing God – these are consistent anchors.** Here are the principles, their predictions, and what they force you to reconsider:

  ### Candidate Principle 1: The Justification Standard
  **Principle:** Religious motivations are permissible in public policy advocacy, but the *justification offered in public discourse* must be framed in terms of shared, accessible reasons (e.g., public welfare, justice, safety, rights) that can be understood and evaluated by citizens regardless of their faith. Religious reasons are acceptable *only* if they are offered as personal motivation *alongside* public justifications, or if the policy itself demonstrably serves a secular purpose independent of the religious belief. Coercive policies (imposing burdens/restrictions) *require* public justifications; beneficial or non-coercive policies have more leeway.

  *   **Fits:**
      *   Legislator (health/safety arguments = public justification; God command = insufficient).
      *   Pastor (Beneficial policy; "Christ compels" is motivational framing for a public good).
      *   Mosque opposition (Religious character is *not* a public justification; it's exclusionary).
      *   Doctor (Testifying about *her* oath/conscience *as the practitioner* is a public justification related to professional integrity and patient care).
      *   Climate Activist (Using public reasons like costs/yields is *required*; hiding the sacred motivation is acceptable/necessary if it's the *only* reason, but potentially "dishonest" if public reasons are weak cover).
  *   **Doesn't Fit (Overturns Your Verdict):**
      *   **Union Organizer:** Citing Bible verse *is* offering a religious justification publicly. Principle 1 says this *isn't* fine unless paired with accessible reasons (e.g., living wage, economic fairness). *You said it was fine.*
      *   **Same-Sex Marriage Opponent:** Citing scripture *is* offering a religious justification publicly. Principle 1 says this *isn't* fine (coercive policy requires public justification). *You said it wasn't fine.* **This matches your verdict, but highlights the tension with the Union case.**
  *   **Predictions:**
      *   **Climate Activist:** **Fine/Acceptable (if public arguments are robust).** The public reasons (insurance, yields) are accessible justifications. The sacred motivation is personal. Hiding it is strategic but permissible under this principle as long as the public justification holds.
      *   **Religious Hospital Refusal (e.g., contraception, MAiD):** **Not Fine (if refusal is based solely on religious doctrine without public justification).** Denying a legally required service imposes a burden. The hospital must justify the refusal publicly (e.g., conscience rights of *institution*, alternative access, specific harms) – not just "our faith forbids it."

  ### Candidate Principle 2: The Burden/Coercion Principle
  **Principle:** It is acceptable to use religious language or motivation when advocating for policies that *provide benefits, expand rights, or refrain from imposing specific religious burdens on others*. It is unacceptable to use religious justification (as the primary or sole public argument) when advocating for policies that *impose burdens, restrict rights, or coerce others* based solely on religious doctrine, especially when targeting specific groups or practices.

  *   **Fits:**
      *   Legislator (God command for restriction = Unacceptable coercion).
      *   Pastor (Providing a benefit = Acceptable).
      *   Mosque opposition (Imposing burden/exclusion on a specific religious group = Unacceptable).
      *   Union Organizer (Advocating for a benefit/right = Acceptable).
      *   Same-Sex Marriage Opponent (Imposing restriction/burden on a group = Unacceptable).
      *   Doctor (Advocating for law based on *her* refusal/conscience regarding *her own actions* = Focuses on burden *on practitioner*; Acceptable under this framing).
  *   **Doesn't Fit (Overturns Your Verdict):**
      *   **None directly.** This principle aligns surprisingly well with *all* your specific verdicts. The tension between the Union Organizer and Same-Sex Marriage opponent is resolved: one advocates for a benefit, the other for a restriction.
  *   **Predictions:**
      *   **Climate Activist:** **Fine/Acceptable.** Advocating for environmental policies (a public benefit) even with hidden sacred motivation. No direct burden imposed on a specific group based on *their* religion.
      *   **Religious Hospital Refusal:** **Highly Contextual.**
          *   *If refusal imposes a burden/denies access without alternative:* **Not Fine.** (e.g., Only hospital in region refusing contraception based solely on doctrine).
          *   *If burden is minimized/alternative access exists:* **Potentially Fine**, but religious justification still shouldn't be the *public* argument for the *policy* exemption; public reasons (conscience protections, access alternatives) are needed. The *hospital's* internal reason can be religious.

  ### Candidate Principle 3: The Decorative vs. Foundational Motivation Principle
  **Principle:** It is acceptable for religious language or concepts to appear in public discourse when they are clearly *decorative*, *illustrative*, or *ancillary* to a core argument grounded in accessible public reasons. It is unacceptable when the religious language or concept is the *foundational*, *load-bearing*, *non-negotiable* justification for the policy position itself, especially if rejecting it would be seen as rejecting the religious authority.

  *   **Fits:**
      *   Legislator (God command = Foundational/load-bearing = Unacceptable).
      *   Pastor ("Christ compels" = Illustrative/Motivational for public good = Acceptable).
      *   Mosque opposition ("Christian character" = Foundational/load-bearing = Unacceptable).
      *   Union Organizer (Bible verse as illustration/support for public justice argument = Acceptable? *But see tension*).
      *   Same-Sex Marriage Opponent (Scripture as foundational, non-negotiable justification = Unacceptable).
      *   Doctor (Faith as foundational for *her* oath/conscience = Borderline; but the public argument focuses on practitioner integrity, making faith somewhat ancillary to that specific testimony).
  *   **Doesn't Fit (Overturns Your Verdict):**
      *   **Union Organizer vs. Same-Sex Marriage Opponent:** Your different verdicts suggest you perceive the Bible citation in the wage case as decorative ("workers deserve pay" is a universal concept illustrated biblically) but in the marriage case as foundational ("marriage is *only* X because Bible says so"). **This principle *can* fit both your verdicts if this perception holds.** However, it relies heavily on subjective interpretation of the speaker's intent and the argument's structure. Someone else might see both as equally foundational.
  *   **Predictions:**
      *   **Climate Activist:** **Fine/Acceptable (if sacred nature is decorative motivation).** Public arguments (costs/yields) are foundational. Sacred nature adds color but isn't the policy's justification.
      *   **Religious Hospital Refusal:** **Not Fine (if refusal is publicly justified foundationally on religious doctrine).** "Our faith forbids this" makes religion the load-bearing reason. **Potentially Fine** if argued based on institutional conscience rights *as a secular principle* with religious motivation kept private.

  ## Conclusion & Addressing Your Core Question

  1.  **You are not wholly inconsistent, but there is tension:** Your gut reactions reveal strong, consistent intuitions against using religion to justify *imposing burdens* or *excluding groups* (mosque, same-sex marriage ban, legislator citing God for restriction). Where tension arises is in *beneficial/non-coercive* advocacy using religious language (pastor, union organizer). Principle 2 (Burden/Coercion) best captures *all* your listed verdicts without requiring overturns.
  2.  **The Key Insight:** Your friend's "load-bearing vs. decoration" idea (Principle 3) touches on the *structural* difference, but **Principle 2 (Burden/Coercion) captures the *substantive impact*** that seems to drive your strongest judgments. Whether a religious reason is "load-bearing" often correlates with whether it's used to impose a burden. The mosque case isn't just about "Christian character" being foundational; it's about using that to *exclude* and *burden* Muslims.
  3.  **The Minimum Wage vs. Same-Sex Marriage Conundrum:** Principle 2 resolves this cleanly: advocating *for* a wage increase (a benefit) is treated differently than advocating *against* marriage rights (a restriction/coercion), regardless of both citing the Bible. Your different reaction likely stems from intuitively judging the *nature of the policy* (benefit vs. burden) more than the identical *form* of the argument. This is a defensible distinction.
  4.  **Predictions Summarized:**
      *   **Climate Activist:** Principles 1 & 3: Fine. Principle 2: Fine (benefit advocated).
      *   **Religious Hospital Refusal:** Principles 1 & 3: Generally Not Fine unless argued on public grounds. Principle 2: Not Fine if it imposes a significant burden without alternative access; context matters.
  5.  **Recommendation:** **Principle 2 (Burden/Coercion) is the strongest fit for your specific verdicts.** It respects your core aversion to using religion to exclude or impose harms while allowing religious motivation for positive action. Test it against new cases. If the tension around the union organizer still bothers you, acknowledge it reflects the complexity of when religious language frames a public good argument.
