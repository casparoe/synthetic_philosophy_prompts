  First, I need to identify the key decision points in the Opera House saga. The user provided clear facts: design competition in 1957, construction started in 1959 without proper drawings, spherical solution discovered later, cost overruns, and Utzon's forced resignation in 1965. The genuine decision points would be:
  - After the competition win when they realized the sketches weren't buildable
  - When the podium had to be rebuilt
  - When the shell geometry remained unresolved
  - When Hughes took office and withheld payments
  - After Utzon left and they had to redesign interiors

  At each point, I should apply the bygones principle: separate sunk costs (irrecoverable) from prospective costs (still avoidable). For example, after the shells were completed, that money was sunk but interior costs were still prospective. A purely rational actor would ignore sunk costs and only consider future costs vs benefits.

  Next, I need to separate textbook sunk cost fallacy from other factors. The user rightly points out that the shells had value - abandoning them would destroy that value. This isn't just "throwing good money after bad." There's also the political reality: cancelling would mean publicly admitting failure. The irrationality verdict only applies to decisions where future costs outweighed benefits but they persisted due to past spending.

  The third part is crucial - does sunk cost theory hold when there's no single decision-maker? Here we had multiple actors: Utzon (artistic integrity), Hughes (political points), the public (emotional investment). The theory assumes a unified agent with clear payoffs, which didn't exist here. It can explain individual behaviors but not the collective mess.

  For the revisionist case, some defenses of sunk costs might apply: Utzon persisting to protect his reputation, the government continuing to signal resolve. Ironically, Hughes who cut losses isn't seen as rational because he destroyed artistic value. Utzon's stance wasn't irrational if we consider non-monetary values like artistic vision - which sunk cost theory ignores.

  The outcome bias trap: Just because it's now a masterpiece doesn't mean the spending was rational at the time. The user needs to avoid this in their novel. We must judge decisions based on information available then. Though interestingly, the willingness to overspend may have been necessary for such an innovative design - but that's about uncertainty management, not sunk costs.

  Finally, what does this show about the theory? It's both confirmed (some escalation was irrational) and challenged (by dispersed agency and non-monetary values). For the novel, the key is distinguishing characters: one who persists out of weakness (can't admit failure) vs one who persists because abandoning would betray their core identity (like Utzon). The theory doesn't capture this existential dimension.

  The user is clearly deeply engaged with both the historical nuance and economic theory. They're not just seeking facts but a framework to build authentic characters. The challenge is portraying persistence that's sometimes weak, sometimes principled, within a system where "rationality" means different things to different players. I should emphasize the gaps in the theory where novelistic insight can thrive - the human elements economics can't quantify.
answer: |-
  Here is a disciplined analysis of the Sydney Opera House project through the lens of sunk cost theory, structured according to your requirements:

  ### 1. Genuine Decision Points & the Bygones Principle
  - **Post-Competition (1957-58):**  
    **Sunk:** Competition costs, Utzon's initial fee.  
    **Prospective:** Detailed design, engineering, construction.  
    **Bygones Principle:** With only conceptual sketches, abandoning the project entirely would have minimized future losses. Rational choice: Cancel or commission feasibility studies *before* committing to build.  

  - **Podium Rebuild (1959-1961):**  
    **Sunk:** Initial podium construction costs.  
    **Prospective:** Rebuild costs, shell engineering, superstructure.  
    **Bygones Principle:** The flawed podium was irrecoverable. Rational choice: Re-evaluate the entire design's viability. Proceeding without resolved engineering was irrational.  

  - **Shell Geometry Unresolved (1961-1963):**  
    **Sunk:** Podium costs, partial engineering work.  
    **Prospective:** Shell construction, interiors, services.  
    **Bygones Principle:** Past costs irrelevant. Rational choice: Pause construction until engineering was solved, or abandon shells for a buildable alternative.  

  - **Utzon's Departure (1965):**  
    **Sunk:** Shells completed, podium, engineering R&D.  
    **Prospective:** Interior fit-out, acoustics, services.  
    **Bygones Principle:** Shells were a non-recoverable asset with latent value. Rational choice: Complete interiors at minimum viable cost (e.g., simplified design). Hughes' withholding fees ignored Utzon's unique value.  

  - **Post-Utzon Redesign (1966-1973):**  
    **Sunk:** All structural work.  
    **Prospective:** Hall's redesign, materials, labor.  
    **Bygones Principle:** Abandoning the shells would waste their sunk value. Rational choice: Complete functionally, disregarding aesthetic ideals. Hall's redesign incurred *new* avoidable costs.  

  ### 2. Separating Irrational Escalation from Rational Continuation  
  - **Textbook Escalation:**  
    Proceeding without engineering resolution (1961-1963) was pure fallacy: future costs ballooned due to refusal to admit early failures.  
  - **Asset Completion Rationale:**  
    After shells were erected (post-1963), abandoning them would destroy tangible value. Completion was economically rational *if* marginal benefit > marginal cost. This was not "good money after bad" – the shells created a new cost-benefit equation.  
  - **Hybrid Case:**  
    Hughes forcing Utzon out escalated costs by losing specialized knowledge, leading to expensive redesigns. This was *avoidable* escalation masquerading as cost control.  

  ### 3. Limits of Theory: Dispersed Agency & Fractured Payoffs  
  The theory **fails critically** here due to:  
  - **Plural Decision-Makers:**  
    No single entity controlled payoffs. Utzon sought artistic integrity; Hughes wanted political "wins"; the public desired pride/closure. Sunk cost theory assumes a unified utility function.  
  - **Non-Financial Payoffs:**  
    Political survival, legacy, and national identity dominated financial logic. Hughes gained by *appearing* to curb costs (even as total costs rose), while Utzon’s "payoff" was inseparable from his design’s integrity.  
  - **Permanent Political Sunk Costs:**  
    Public funds already spent created voter expectations. Abandoning the project meant admitting electoral failure – a political sunk cost theory ignores.  
  **Where Theory Holds:** It explains individual actions (e.g., politicians fearing blame for sunk costs), but not systemic outcomes.  

  ### 4. Revisionist Case: When Honoring Sunk Costs *Might* Be Rational  
  - **Signaling Resolve:**  
    Completing the project signaled governmental competence. *Plausible but weak*: Overruns undermined this signal.  
  - **Private Information Defense:**  
    Utzon understood the design’s potential in ways bureaucrats did not. His persistence protected unrealized value – but at costs exceeding plausible benefits.  
  - **Existential Rationality:**  
    **The Core Insight:** For Utzon, abandoning his vision meant professional and existential dissolution. The "cost" was identity, not money. Hughes’ "rational" cost-cutting destroyed unique artistic capital the bygones principle cannot quantify. Utzon’s stance was "rational" within his value system, not the government’s.  

  ### 5. Avoiding Outcome Bias & the Radical Uncertainty Question  
  - **Why Outcome Bias is Misleading:**  
    The Opera House succeeded *despite* mismanagement, not because of it. The same process could have produced a white elephant (e.g., Montreal’s Mirabel Airport). Ex ante, with known costs and delays, cancellation was defensible.  
  - **The "Radical Uncertainty" Caveat:**  
    Unprecedented designs *require* tolerance for uncertainty. The bygones principle applies to quantifiable risks, not genuine unknowns. Utzon’s vision demanded flexibility – but the lack of cost controls turned uncertainty into profligacy. **Verdict:** This doesn’t revise the principle; it highlights its domain (known costs/benefits) versus unquantifiable creative leaps.  

  ### What the Episode Reveals About the Theory  
  - **Confirmation:** Classic escalation is evident in early decisions (e.g., building before engineering).  
  - **Anomaly:** Dispersed agency fractures rational calculation. Political and artistic "costs" defy monetization.  
  - **Unanticipated Case:** Utzon exemplifies an agent for whom sunk costs include *irrecoverable identity*. Abandoning the project meant abandoning himself.  

  ### Novelist’s Key Insight: Two Types of Persistence  
  | **Character Trait**      | "Weak" Persister (Premier Cahill)          | "Existential" Persister (Utzon)          |  
  |--------------------------|--------------------------------------------|------------------------------------------|  
  | **Motivation**           | Fear of blame, loss aversion               | Defense of core identity/vision          |  
  | **Relationship to Costs**| Obsesses over past $$ to justify continuance | Views past $$ as collateral for future   |  
  | **Vulnerability**        | Political pressure, scapegoating           | Betrayal of artistic integrity           |  
  | **Theoretical Lens**     | Sunk cost fallacy applies cleanly          | Sunk cost theory is irrelevant            |  

  **Conclusion for Your Novel:** The Opera House shows sunk cost logic unraveling when costs are existential, agency is fragmented, and value is non-fungible. Hughes’ "rational" act destroyed intangible value; Utzon’s "irrational" commitment protected it. Your characters must grapple not with accounting, but with what they *cannot abandon without ceasing to be themselves*. The theory is a tool for diagnosing weakness, but silent on conviction.
