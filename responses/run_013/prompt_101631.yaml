  Okay, let me approach this systematically. The user wants a philosophical analysis of social conventions using their stipulated framework, applied to two specific cases. As DeepSeek's philosopher persona, I need to carefully distinguish between regularity, convention and moral obligation while respecting the user's graduate-level context and aversion to secondary literature citations.

  First, I'll sketch the core distinctions: 
  - Mere regularity is just patterned behavior without normative expectations (e.g., people buying umbrellas when it rains). 
  - Coordination convention solves recurrent coordination problems with mutual expectations (e.g., driving on one side of the road). 
  - Moral obligation binds regardless of expectations (e.g., not harming others). The contested boundary lies between conventions and obligations - when does social expectation create genuine duty?

  Now examining the framework components: 
  Stake-asymmetry means minor inconvenience to compliers prevents major costs to others. This seems morally relevant but risks conflating practicality with obligation. 
  Local indexing highlights context-dependence, which challenges universal moral claims but may overlook deeper principles. 
  Opacity to newcomers raises fairness concerns - can we blame those who couldn't reasonably know?

  For the Riverside Path case: 
  This appears as a clear coordination convention with high stake-asymmetry (collision risks), strong local indexing (side varies by country), and moderate opacity (path sharing norms aren't always obvious). 

  For the tipping case: 
  Stake-asymmetry is extreme (staff livelihoods depend on tips), local indexing is absolute (15% vs 20% vs none), but opacity is high - visitors may miss that tips are wage substitutes. 

  Now structuring the analysis: 
  (a) Moral obligation seems strongest for high stake-asymmetry contexts like tipping where non-compliance directly harms vulnerable workers. Path compliance is more about collective efficiency. 
  (b) Reproach legitimacy follows similar lines: Annoyance at path violators is reasonable but exclusion disproportionate, whereas tipping omission merits stronger response due to material impact. 
  (c) Institutional design implications: Opacity demands signage for path conventions; stake-asymmetry in tipping suggests built-in pricing to protect workers. 

  Key tensions noted: 
  Stake-asymmetry implicitly imports moral weight to consequences. Local indexing's relativity may clash with universalist ethics. The framework usefully structures analysis but shouldn't override deeper moral reasoning about harm and fairness.
answer: |-
  ### Brainstorming: Core Distinctions  
  1. **Mere Regularity**: Patterned behavior without normative expectations (e.g., most people drink coffee at 10 AM). No criticism of deviation.  
  2. **Coordination Convention**: Solution to recurrent coordination problem; compliance conditional on others’ compliance (e.g., driving on the left). Deviation attracts criticism for inefficiency/disruption.  
  3. **Moral Obligation**: Binds independently of others’ compliance; rooted in intrinsic right/wrong (e.g., keeping promises). Criticism appeals to justice/harm.  
  **Contested Boundaries**: Whether conventions can *generate* obligations via reliance (e.g., tipping), and whether "local morality" can exist without universal foundations.  

  ---

  ### Analysis Using Stipulated Framework  
  **Ordering Implications by Importance**:  
  The framework prioritizes **stake-asymmetry** as most morally salient (direct harm/exploitation risk), then **opacity** (fairness of expectation), then **local indexing** (relativity of norms). This ordering reflects moral urgency: asymmetric stakes involve tangible harms, opacity affects blameworthiness, while locality alone doesn’t create duties.  

  #### (a) Moral Obligation to Follow Convention  
  1. **Tipping (Restaurant Case)**:  
     - **Stake-asymmetry**: Extreme. Staff rely on tips for subsistence wages; visitor’s cost (20% of meal) is low vs. aggregate wage loss to workers.  
     - **Opacity**: High. Visitor may not know tips are wage substitutes (not gratitude gestures).  
     - **Local indexing**: Absolute. Tipping norms vary globally.  
     **Conclusion**: **Strong obligation**. Asymmetric stakes transform convention into quasi-contractual duty to avoid exploiting labor.  

  2. **Path Conduct (Riverside Case)**:  
     - **Stake-asymmetry**: Low-moderate. Deviation causes annoyance/near-collisions but no systemic harm.  
     - **Opacity**: Low. Path-sharing norms are inferable from behavior (e.g., others keeping left).  
     - **Local indexing**: High. Correct side varies by region.  
     **Conclusion**: **Weak obligation**. Efficiency demands compliance, but no moral failing if visitor errs unintentionally.  

  **Why Ordering?**: Stake-asymmetry dominates because it introduces *harm*, overriding locality/opacity. Tipping’s material impact obligates; path conduct’s inconvenience does not.  

  #### (b) Reproach/Sanction of Visitors  
  1. **Tipping**:  
     - **Reproach justified**: Locals may explain/criticize omission due to asymmetric harm. Exclusion is excessive unless repeated defiance.  
  2. **Path Conduct**:  
     - **Mild reproach only**: Annoyance is understandable, but sanctions unwarranted. Opacity is low; deviation likely accidental. Exclusion disproportionate.  
  **Why Ordering?**: Reproach legitimacy tracks stake-asymmetry. Harm justifies corrective feedback; mere inefficiency warrants only education.  

  #### (c) Institutional Design Implications  
  1. **Tipping**:  
     - **Mandate service-included pricing**: High stake-asymmetry reveals systemic exploitation risk. Eliminates opacity and shields workers.  
  2. **Path Conduct**:  
     - **Signage suffices**: Low stakes + high local indexing make formal rules overkill. Signage resolves opacity cheaply.  
  **Why Ordering?**: Design should mitigate highest-stakes harms first (tipping’s wage dependency), then address confusion (path opacity).  

  ---

  ### Critical Flags on the Framework  
  1. **Stake-asymmetry smuggles in morality**: Framing "small cost to deviator vs. large aggregate cost" assumes utilitarianism. But is *any* aggregate cost sufficient? (e.g., if path deviations caused mild widespread annoyance, would that obligate?)  
  2. **Local indexing’s limits**: Relativity is overstated. Asymmetric stakes in tipping reflect *universal* harm (exploitation), not local whim.  
  3. **Opacity’s moral weight**: Treats newcomers fairly but ignores *why* opacity exists (e.g., tipping’s opacity often benefits employers, not workers).  

  ### Robust vs. Framework-Dependent Conclusions  
  - **Robust**: Asymmetric stakes (genuine harm) create obligations regardless of framework. Locals may reproach harmful deviations.  
  - **Framework-dependent**: Whether path conduct’s low stakes permit reproach relies on "aggregate cost" calculation. The obligation to research opaque conventions assumes visitors bear all epistemic burdens.  

  **Final Synthesis**: The framework best illuminates *harm-avoidance* (stake-asymmetry) as the bridge from convention to obligation. Tipping’s asymmetry makes it a moral issue; path conduct remains coordination. Design should target harm reduction, not just clarity.
