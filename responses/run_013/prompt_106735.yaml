    - Win: +50% gain on the staked amount (multiply by 1.5)
    - Lose: -40% loss on the staked amount (multiply by 0.6)
    - Kelly fraction \( f^* = \frac{p}{a} - \frac{q}{b} \), where \( p = 0.5 \) (win prob), \( q = 0.5 \) (lose prob), \( a = 0.4 \) (loss fraction), \( b = 0.5 \) (gain fraction).  
      \( f^* = \frac{0.5}{0.4} - \frac{0.5}{0.5} = 1.25 - 1 = 0.25 \).
    - So, \( f^* = 25\% \) of the current bankroll per deal.
  - With this fraction, the expected growth rate per deal (in log terms) is positive:
    - Win: Bankroll multiplies by \( 1 + 0.5 \times 0.25 = 1.125 \)
    - Lose: Bankroll multiplies by \( 1 - 0.4 \times 0.25 = 0.9 \)
    - Expected log growth: \( 0.5 \times \ln(1.125) + 0.5 \times \ln(0.9) \approx 0.5 \times 0.1178 + 0.5 \times (-0.1054) = 0.0062 \) (about 0.62% per deal).
  - Withdrawals add a fixed annual drain. At £25,000 per year, this is 6.25% of your initial £400,000. The expected growth with Kelly (about 2.48% per year with 4 deals, since \( (1.0062)^4 \approx 1.0248 \)) may not cover this initially, leading to a net expected decline if the bankroll is small. However, as the pot grows (if it does), the withdrawal becomes a smaller relative burden.
  - Finite deals (100) vs. infinite: With 100 deals, Kelly is still appropriate because it maximizes median wealth and minimizes the risk of ruin for a given growth rate. However, the finite horizon slightly increases the impact of early losses, so a small reduction from full Kelly is prudent.
  - Uncertain odds: Your colleague's 1.5/0.6 odds and 50% probabilities are estimates. With only ~12 observations, the true win probability could range from ~35% to ~65% (based on a binomial confidence interval). Estimation error can lead to overbetting. A common adjustment is to reduce the stake fraction by 50% (half-Kelly) or more when uncertainty is high.
  - Risk of ruin: With full Kelly (25%), the probability of severe drawdown (e.g., bankroll falling below £100,000) is low but non-zero. With withdrawals, this risk increases, especially in bad sequences. For example, simulations show that with f=25%, withdrawals, and true odds as stated, the probability of the pot lasting 25 years is about 85–90%. But if the true loss probability is higher (e.g., 55%), this drops to 70–75%.

  **Recommendation:**
  - **Stake 15–20% of your current bankroll per deal.** This balances growth and safety:
    - 20% is slightly below full Kelly (25%), accounting for withdrawals and finite deals.
    - 15% adds a buffer for odds uncertainty and your psychological comfort.
    - Why not fixed amount? Staking a fraction adjusts for bankroll size, protecting you from ruin when the pot is small and allowing growth when large.
  - **Withdrawals:** Handle them separately to avoid staking money needed for near-term living expenses. At the start of each year, set aside the £25,000 in cash (not staked). Stake only the remaining investment bankroll.
    - Example: Year 1, start with £400,000. Set aside £25,000 cash. Investment bankroll = £375,000. Stake 20% of this (£75,000) on the first deal. After the deal, update the investment bankroll, and repeat for subsequent deals. At year-end, withdraw £25,000 from the cash buffer for living, then refill the cash buffer from the investment bankroll if possible.
  - **Practical adjustment:** If the bankroll falls below £200,000, reduce the stake fraction to 10–15% to further lower risk. If it grows above £800,000, you might increase to 20–25% but cap at 25% due to uncertainty.
  - **Why this works:** With f=20%, growth is still positive (expected log growth ≈ 0.005 per deal or 2% per year), and the risk of ruin with withdrawals is under 5% over 25 years if odds are as stated. If odds are worse, the lower fraction provides resilience.

  **Sensitivity to changes:**
  - If deals are more frequent (e.g., 6/year), the fraction remains similar, but withdrawals per deal are smaller, slightly reducing risk.
  - If deals are less frequent (e.g., 3/year), withdrawals are a larger per-deal burden, so consider 15% to be safer.
  - If you confirm the odds with more data (e.g., after 30–50 deals), you might increase to 20–25%.

  #### 2. What's Wrong and Right with Your Colleague's Principle

  **What's right:**
  - Your colleague is correct that each deal, taken in isolation, has positive expected value (EV). The arithmetic mean return is +5%, meaning that if you could take only one deal, staking as much as possible would maximize expected profit. For example, staking £X yields an average return of £1.05X, so declining does "leave money on the table" for that single bet. If you have a very high risk tolerance or the stake is a tiny fraction of your wealth, maximizing EV makes sense.
  - The principle is logically sound for a single, one-off bet with no future consequences. It relies on the law of large numbers: over many independent trials, the average outcome should converge to the EV.

  **What's wrong:**
  - The principle ignores compounding and risk of ruin when bets are repeated. With repeated bets:
    - Your bankroll changes with each outcome, so the stake amount must adapt. Betting a fixed large fraction (like 100%) when the bankroll shrinks increases the risk of catastrophic loss. For instance, with f=100%, a single loss reduces the bankroll to 60%, and six losses in a row (probability \( (0.5)^6 = 1.56\% \)) reduce £400,000 to under £25,000 (£400,000 × \( 0.6^6 \) ≈ £18,662), making withdrawals unsustainable.
    - The geometric mean (not arithmetic mean) drives long-term growth. The arithmetic mean return is +5%, but the geometric mean return for f=100% is negative because losses compound: √(1.5 × 0.6) = √0.9 ≈ 0.949, a -5.1% geometric return per deal. This means wealth declines over time. Kelly maximizes the geometric mean.
    - By overbetting, you risk losing your entire bankroll and missing out on future deals. This violates the principle's implicit assumption that bets are independent and infinite—in reality, your ability to bet depends on not going broke.
    - Withdrawals exacerbate this: fixed expenses increase the risk of ruin during drawdowns, which full staking does not account for.

  In essence, your colleague's advice confuses the arithmetic EV (which favors large stakes for a single bet) with long-term growth (which requires smaller stakes to survive volatility). It also neglects your finite wealth and consumption needs.

  #### 3. Stake Fraction: Situation vs. Preferences, and the Second Friend's Argument

  **Is the stake a fact about the situation or an expression of preferences?**
  - The core of the stake fraction (e.g., Kelly 25%) is based on objective facts about the situation: the probabilities (p=0.5), the payoff ratios (1.5× and 0.6×), and the mathematical goal of maximizing long-term growth or expected log utility. This is why we can calculate a "rational" fraction like 25%—it's optimal for growth, regardless of personal feelings.
  - However, the choice of utility function incorporates preferences. Kelly uses log utility, which assumes diminishing marginal utility of wealth (i.e., £1 gained at low wealth is more valuable than at high wealth). If you have different risk preferences (e.g., more or less risk-averse), the optimal fraction changes. For example:
    - With log utility (matching Kelly), f=25%.
    - With square root utility (more risk-averse), f might be 10–15%.
    - With linear utility (no risk aversion), f=100% maximizes EV.
    So, while the math provides a benchmark, your risk tolerance influences the final decision.

  **Implications for the second friend's argument:**
  - Your second friend is correct that diminishing marginal utility makes large stakes suboptimal. Their point that "the difference between £300,000 and £400,000 matters more than between £1.3m and £1.4m" is a restatement of log utility—it justifies a fractional stake like Kelly's. This argument does not make risk appetite "merely subjective"; it is mathematically quantifiable using utility functions.
  - However, the two replies differ in practical advice:
    - Your colleague (EV maximizer) would say: "Stake 100% every time; it's irrational not to."
    - Your second friend (utility-based) would say: "Stake less than 100% to protect against losses at low wealth levels."
    - Crucially, both can be reconciled: Kelly (f=25%) is the utility-based solution that also maximizes growth, making it a bridge between the two. It shows that staking everything is wrong not just for psychological reasons but because it destroys long-term value.
  - **Practical difference:** The second friend's argument implies a lower stake if you are highly risk-averse, but it doesn't specify how much lower. For example, if you value wealth preservation over growth, you might choose f=10–15%. The EV approach ignores this and could lead to ruin. In your case, since the 15–20% recommendation already embeds diminishing utility (via Kelly), it aligns with the second friend's logic.

  #### 4. How a Favorable Bet Can Be Bad Repeatedly, and the Role of Averages

  **Why a +EV bet can be bad when repeated:**
  - A single favorable bet (positive EV) should always be accepted if you can afford the loss, as it increases expected wealth. But when repeated, the bet size relative to your bankroll matters:
    - If you overbet (stake too large a fraction), the volatility compounds, and sequences with early losses can deplete your bankroll before the long-run EV "kicks in." For example, with f=100%, the probability of losing 90% of your wealth within 10 deals is about 25% (from simulations), making it impossible to recover.
    - The geometric mean return becomes negative if you overbet, meaning wealth declines over time despite positive EV per bet. With f=100%, geometric mean is √(1.5 × 0.6) ≈ 0.949, as above.
    - Withdrawals add a "negative drift": losses force larger relative withdrawals, accelerating ruin.

  **Which average matters?**
  - The relevant average is taken over the sequence of outcomes in your one life—not over many parallel versions of you. The EV average (arithmetic mean) assumes you can average across infinite trials or parallel universes, but in reality, you get one sequence. If that sequence has bad luck early (e.g., losses), you go broke and cannot continue betting. Thus, the arithmetic EV is irrelevant if it comes with a high risk of ruin in your single life.
  - **Does the distinction do real work?** Yes, it changes how we evaluate risk:
    - "Many lives" average: Focuses on expected value, justifying large stakes because losses are averaged out across parallel scenarios.
    - "One life" average: Focuses on survival and growth rate, favoring smaller stakes to ensure you stay in the game. This is why Kelly uses expected log wealth—it optimizes for the median outcome of your single path.
  - In your case, staking 100% has high EV (£400,000 could grow to millions in some paths) but also a >40% chance of falling below £100,000 within 10 years (with withdrawals). With f=20%, EV is lower, but the probability of sustaining withdrawals for 25 years is >90% if odds are fair.

  ### Summary
  - **Stake 15–20% of your current bankroll per deal**, with £25,000 set aside annually for living expenses. This fraction balances growth, safety, withdrawals, and odds uncertainty.
  - **Your colleague is right** that each bet is +EV but **wrong** to ignore compounding and ruin risk in repeated play.
  - **The stake fraction** is based on objective math (situation) but adjusted for your risk preferences (e.g., via utility functions). The second friend's argument is valid and mathematically sound, not just about "feelings."
  - **A +EV bet can be bad repeatedly** if overbet because volatility can dominate in one life. Focus on the geometric mean for your single sequence.

  By implementing the recommended stake fraction, you capture most of the upside while protecting against the downsides that trouble you. If possible, track the next 10–20 deals to refine your probability estimates—this could allow a higher fraction later.
