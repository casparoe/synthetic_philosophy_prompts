  9. **Node 9 (Common-Ratio Losses, Part 1)**:  
     - *Option Aᵣₗ*: –$3,000 for sure  
     - *Option Bᵣₗ*: 80% chance of –$4,000, 20% chance of $0  
     - **Branch**: Aᵣₗ or Bᵣₗ

  10. **Node 10 (Common-Ratio Losses, Part 2)**:  
      - *Option Cᵣₗ*: 25% chance of –$3,000  
      - *Option Dᵣₗ*: 20% chance of –$4,000, 80% chance of $0  
      - **Branch**: Cᵣₗ or Dᵣₗ  
      - **Leaf assignment** (based on pattern):  
        - If (Aᵣ at Node 7, Dᵣ at Node 8) and (Bᵣₗ at Node 9, Cᵣₗ at Node 10) → **Cumulative Prospect Theory (CPT)**  
        - Else → **Rank-Dependent Utility (RDU)**  

  11. **Final Leaf (for non-violators)**:  
      - If no violations in Node 7–8 → **Expected Utility (EU)**  

  ---

  #### **Theoretical Positions (Leaves)**
  1. **Expected Utility (EU)**:  
     - Independence axiom holds; Allais choices are errors.  
     - *Reached via*: No violations in common-consequence or common-ratio pairs.  

  2. **Rank-Dependent Utility (RDU)**:  
     - Consequentialist; probability weighting (non-linear).  
     - *Reached via*:  
       - (A, D) in Nodes 1–2, then A' in Node 3, but not (Bₗ, Cₗ) in Nodes 4–5.  
       - (A, D) in Nodes 1–2, then B' in Node 6, and Aᵤ in Node 6.  
       - Violations in common-ratio (Node 7–8) without reflection in losses (Node 9–10).  

  3. **Cumulative Prospect Theory (CPT)**:  
     - Sign-dependent (loss aversion), reflection effect.  
     - *Reached via*:  
       - (A, D) in Nodes 1–2, then A' in Node 3, and (Bₗ, Cₗ) in Nodes 4–5.  
       - Violations in common-ratio gains (Node 7–8) and reflection in losses (Node 9–10).  

  4. **Ambiguity Models (e.g., Maxmin EU)**:  
     - Non-consequentialist; preferences over unknown probabilities.  
     - *Reached via*: (A, D) in Nodes 1–2, then B' in Node 3, and Bᵤ in Node 6.  

  5. **Descriptive Models (e.g., Prospect Theory)**:  
     - Purely descriptive (no normative commitment); accounts for Allais, risk-seeking in losses.  
     - *Reached via*: Violations in common-ratio (Node 7–8) and reflection (Node 9–10), but no common-consequence violation.  

  ---

  #### **Handling Indistinguishable Pairs**
  - **RDU vs. CPT in Near-Sure Gains**:  
    - If a subject chooses B' in Node 3, RDU and CPT are **indistinguishable** (both predict A' or B' based on probability weighting curvature).  
    - Separated later via losses (Nodes 4–5) or urn (Node 6).  

  - **EU vs. Recursive EU in Classic Pairs**:  
    - **Indistinguishable** on one-stage lotteries (both satisfy independence). Separated only if compound lotteries are introduced (not in this tree).  

  - **Ambiguity Models vs. RDU in Urn Choice**:  
    - Choosing Aᵤ in Node 6 makes RDU and ambiguity-aversion models **indistinguishable**. Only Bᵤ separates them (ambiguity-seeking).  

  ---

  #### **Key Insights from Extra Cases**
  1. **Near-Sure Gains (Node 3)**:  
     - Separates **RDU/CPT** (often choose A') from **Ambiguity Models** (may choose B' if ambiguity-neutral) when B' is chosen.  
     - Why? Diminishes "certainty effect" but retains probability weighting.  

  2. **Losses (Nodes 4–5, 9–10)**:  
     - Separates **CPT** (reflection: (Bₗ, Cₗ) or (Aᵣ, Dᵣ) + (Bᵣₗ, Cᵣₗ)) from **RDU/EU** (no reflection).  
     - Loss-aversion and sign-dependence are unique to CPT.  

  3. **Unknown Urn (Node 6)**:  
     - Separates **Ambiguity Models** (choose Bᵤ) from **RDU** (choose Aᵤ) when near-sure effect disappears.  
     - Ambiguity models violate reduction of compound lotteries.  

  ---

  #### **Tree Metrics**
  - **Total nodes**: 12 (7 choice pairs, 5 follow-up questions).  
  - **Leaves**: 7 (EU, RDU, CPT, Ambiguity Models, Descriptive Models + 2 RDU sub-leaves).  
  - **Most sorting work**: **Node 1–2 (Classic Common-Consequence)**.  
    - Why? Splits the tree into violators (80% of subjects) and non-violators, and triggers all extra cases.  
  - **Least loss if cut**: **Node 6 (Unknown Urn)**.  
    - Why? Ambiguity-seeking is rare (~10% of subjects); most choose Aᵤ. Cutting it merges Ambiguity Models into RDU (with little cost to coverage).  

