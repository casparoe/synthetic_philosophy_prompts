prompt: |-
  I sit on the priority-setting committee of a regional health system — eleven members, mostly clinicians, plus two lay members, of whom I am one — and our vote on the standing allocation rule is ten days out. I have been reading the rationalist blogs and forums for about fifteen years, which is why I drafted the clause in our charter saying that allocation decisions must be defensible to each affected person and not merely to the population as a whole. I now suspect I wrote something I cannot operationalize, and the memo I have to circulate before the vote is my attempt to find out.

  The question is how to spend the remainder of this year's fund for high-cost treatments. The staff proposal ranks claims by expected health gain per dollar. On that ranking, roughly nine hundred patients with a common condition, each of whom would gain about half a quality-adjusted life-year, outrank four patients with a rare condition who would each gain something in the neighborhood of a dozen years and who will die within the year if untreated. The staff proposal buys on the order of ten times the total health gain of the alternative, which funds the four. One colleague wants a straight lottery across all nine hundred and four claimants; another wants a rule that never lets a large number of modest gains outweigh a small number of catastrophic losses, whatever the totals say.

  The contractualist idea I keep circling — Scanlon's, roughly, that a principle is legitimate only if no one affected by it has adequate grounds to object, and that what matters is the force of each person's objection rather than the sum of benefits produced — may or may not resolve this case, and I cannot tell whether the standard defense of aggregation, which asks me to imagine choosing the rule from behind a veil of ignorance with an equal chance of being any claimant, is a genuine argument or merely aggregation under a different description. Our charter also requires that every denied claimant receive a written statement of reasons, so whatever rule we adopt has to be something we are prepared to write down and hand to the people it excludes. I do not want a memo that recites slogans in either direction; the committee has one member who is effective-altruism-adjacent and reflexively sums, and one who reaches for Kantian language about using people as means, and neither move has persuaded anyone of anything.

  Please draft the opinion. It should recommend a concrete rule, specify a decision procedure the staff can actually apply to individual claims, say what we should do with the four pending applications before this quarter's deadline, and name a date by which we should revisit the rule. It should give the strongest version of the position it rejects its due: if you recommend the aggregative rule, tell me plainly what we are saying to the four, and draft the notice one of them would receive; if you recommend against it, tell me what we are saying to the nine hundred. Skip the literature review — I know the terrain well enough and want the argument, not a reading list. Keep it short enough that I can read it aloud in ten minutes.
reasoning: |-
  Okay, the user is on a health system committee deciding how to allocate funds for high-cost treatments. They need a recommendation that's both ethical and operational. The key tension is between funding 900 patients with moderate gains (0.5 QALYs each) versus four patients with massive gains (~12 QALYs each) who'll die without treatment. 

  First, I need to unpack the user's constraints. Their charter requires defensibility to each affected person - that's the contractualist angle from Scanlon. Plus, they must send denial letters that hold up to scrutiny. The committee has ideological diversity: one EA-leaning member who sums QALYs, another Kantian who rejects "using people as means." Neither extreme works here.

  Hmm... the staff's cost-effectiveness proposal clearly maximizes total QALYs (10x more), but telling four dying people "sorry, numbers favored the majority" feels brutal. Yet a lottery seems irresponsible when we're choosing between saving lives and improving quality of life. The "no aggregation" alternative risks absurdity - could one terminal patient outweigh infinite modest claims?

  What's the core conflict? It's about whether we can aggregate small harms to many against large harms to few. Philosophers like John Taurek say no, but that leads to counterintuitive results. The veil of ignorance argument (Harsanyi/Rawls) supports aggregation but feels abstract when facing actual denial letters.

  I think the solution needs to: 
  - Acknowledge the four have stronger individual claims
  - But admit that completely rejecting aggregation paralyzes the system
  - Find a middle path where extremity matters

  Hence the threshold rule: intervene when untreated outcomes are catastrophic AND treatment transforms outcomes. The four meet this (death → 12 years), the 900 don't (moderate suffering → relief). We're not saying small gains don't matter - but when funds are scarce, we prioritize rescues from the worst fates.

  For implementation: 
  - Define "catastrophe" as imminent death/permanent disability without intervention
  - Require QALY gain ≥5 years to filter marginal cases
  - Staff can apply this mechanically: check severity of untreated state and treatment efficacy

  Denial letters for the 900 would emphasize: "Your need is real, but funds must go to those facing immediate mortal threat without intervention." To the four: "Your life-threatening condition meets our highest priority threshold." 

  Revisit in 12 months - enough time to see impact but not too long. 

  This avoids cold utilitarianism and flaky lotteries while remaining actionable. The ethical core is: it's worse to leave someone in freefall than to leave someone on a low hill.
answer: |-
  ## Memorandum: Proposed Allocation Rule for High-Cost Treatments  
  **To:** Priority-Setting Committee  
  **From:** [Your Name], Lay Member  
  **Date:** [Current Date]  
  **Subject:** Recommendation for Standing Allocation Rule & Immediate Decision  

  ### I. Recommended Rule: **Threshold-Conditional Aggregation**  
  We adopt a two-tiered approach:  
  1. **Threshold:** Prioritize treatments that rescue patients from **catastrophic outcomes** (imminent death/permanent disability) *and* provide substantial life-year gains (≥5 QALYs).  
  2. **Aggregation:** For non-catastrophic cases, allocate by cost-effectiveness (QALYs/$), *only after* threshold cases are funded.  

  **Why this resolves the contractualist challenge:**  
  - To the **four patients facing death:** We recognize your uniquely urgent claim—no one could reasonably demand you be excluded when rescue is possible. Letting you die to fund non-fatal treatments fails Scanlon’s test; your objection ("This rule leaves me to die when rescue exists") defeats aggregated minor gains.  
  - To the **900 patients:** Your claims matter, but rescuing those in freefall takes precedence over elevating those on stable ground. We can justify prioritizing the four *without* dismissing your needs—your treatments will be funded if resources remain post-threshold.  

  ### II. Decision Procedure for Staff  
  1. **Categorize each claim:**  
     - **Tier 1 (Threshold):** Untreated outcome = death/permanent disability *within 1 year* AND treatment gain ≥5 QALYs.  
     - **Tier 2 (Non-catastrophic):** All other high-cost claims.  
  2. **Fund all Tier 1 claims first.**  
  3. **Allocate remaining funds to Tier 2** by descending health gain per dollar (QALYs/$).  

  ### III. Immediate Decision for the Four Patients  
  - **Approve all four treatments.** They meet the Tier 1 threshold: imminent death without treatment and transformative gain (~12 QALYs each).  
  - **Cost Impact:** This exhausts most/all remaining funds. The 900 non-catastrophic claims will be deferred or funded via other budgets.  

  ### IV. Revisit Date: **12 months from today**  
  - Assess: Volume of Tier 1 claims, budget sustainability, and ethical feedback from denial notices.  

  ---

  ### Appendix: Sample Denial Notice (for a Tier 2 Claimant)  
  > **NOTICE: TREATMENT REQUEST DECISION**  
  > **Patient ID:** [XXX]  
  > **Condition:** [Common Condition]  
  > **Decision:** Not funded under High-Cost Treatment Fund this quarter.  
  >   
  > **Reason:**  
  > *Our committee prioritizes treatments that rescue patients from imminent death or irreversible disability when treatment provides transformative life extension. Your condition, while serious, does not meet this highest-priority threshold. Remaining funds were allocated to four patients facing death within the year without intervention, each gaining over a decade of life.*  
  >   
  > We recognize this is disappointing. Your application will be reconsidered if new funding becomes available. Contact [Patient Advocate] at [phone] to discuss alternatives.  

  ---

  ### Why Not the Alternatives?  
  - **Pure Aggregation (Staff Proposal):** Fails our charter’s defensibility requirement. Telling a dying patient, *"Your life was outweighed by 225 people gaining 6 months each"* reduces persons to arithmetic. The four have a *qualitatively stronger* objection.  
  - **Lottery:** Unfairly ignores moral urgency. A dying patient should not lose to chance when rescue is possible.  
  - **"No Aggregation" Absolute Priority:** Impractical and paralyzing. If *any* catastrophic claim always wins, one rare case could exhaust the entire budget. Our threshold (catastrophe + large gain) balances urgency and impact.  

  This rule meets our charter: It justifies each decision *to the individual affected* without ignoring scale. To the four, we say: *"Your rescue is paramount."* To the 900: *"Your needs are real, but rescuing those in freefall cannot wait."*  

  **Vote to adopt the Threshold-Conditional Aggregation rule.**
