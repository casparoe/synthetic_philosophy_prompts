prompt: |-
  I'm giving a workshop paper defending a causal answer to the special composition question — the question of when some things together compose a further thing. My proposal: a plurality composes a whole exactly when the plurality, as such, constitutes a single unified locus of causal-explanatory difference-making, that is, when it can be cited as one cause, or as the bearer of one causal power, rather than merely as several things jointly involved in some process. The appeal, as I'll argue, is that this is non-arbitrary and world-involving: it avoids the over-generation of unrestricted composition and the implausibility of nihilism without reducing composition to a matter of our descriptive interests. Prepare my Q&A prep sheet for the audience I will actually face — a metaphysics workshop that is roughly a third neo-Aristotelian hylomorphists, who hold that genuine unity requires a substantial form; a third philosophers of physics, who are deflationary about composition and dubious that causation is fundamental; and one or two formal ontologists, who work on the logic of parthood and care most about transitivity, extensionality, and whether composition can be vague. Give me the eight or so objections I will really get, ordered by how damaging they are, each phrased in the vocabulary of whoever would raise it, with a two-minute reply and a note on where the reply is soft; tell me what to concede up front; and include the one question I am hoping nobody asks.
reasoning: |-
  Okay, the user is preparing for a workshop Q&A on their paper about a causal answer to the special composition question. They want me to create a prep sheet with eight objections they're likely to face, organized by how damaging they are. The audience is divided into three groups: neo-Aristotelian hylomorphists (who emphasize substantial forms), philosophers of physics (skeptical of fundamental causation), and formal ontologists (concerned with parthood logic). 

  First, I need to understand the core proposal: composition happens when a plurality acts as a single unified causal difference-maker. The user wants to avoid unrestricted composition, nihilism, and subjectivism. 

  For the hylomorphists, the biggest objection will be that causality alone can't provide genuine unity without a substantial form. This is highly damaging because it strikes at the heart of their framework. My reply should affirm the need for unity but frame causality as its operational signature, not a replacement for form. The soft spot is that this might not satisfy hardcore Aristotelians.

  Next, the physics folks will challenge the fundamentality of causation. Since they work with quantum mechanics or relativity where causation is emergent, this could undermine the whole approach. The reply needs to show how causal-explanatory difference-making can function without fundamental causation, but conceding it's emergent might weaken the theory's metaphysical weight. 

  For formal ontologists, the key issue is transitivity failure. If composition is causal but parthood is transitive, we get contradictions when causal unities nest. This is technically damaging but perhaps salvageable by restricting transitivity. The softness comes from how radical it is to ditch such a core mereological axiom.

  The user also wants strategic concessions upfront—I should suggest admitting that causal powers might be emergent and that vague cases exist. This builds credibility. 

  The "question to dread" should be about causal non-uniqueness: different descriptions picking the same causal role. This exposes a tension between objectivity and descriptive framing, which might force the user into pragmatism—their stated enemy. 

  Overall, I'm structuring objections by damage level: hylomorphism first (attacks unity), then physics (attacks foundation), then formal issues. Replies aim to bridge gaps without surrendering the core thesis, while flagging soft spots honestly. The tone should be defensive but collaborative, showing where the theory bends versus holds.
answer: |-
  Here’s your Q&A prep sheet, prioritizing objections by damage potential and audience segments. Concessions upfront disarms critics—**lead with these**:

  > "Before objections, two concessions: (1) My account presupposes *some* causal realism, though causation need not be fundamental physics. (2) There will be vague cases where causal unity is gradient, so composition may be non-bivalent in practice."

  ---

  ### **Top 8 Objections & Replies**  
  *(Ordered by Damage: High → Low)*  

  1. **Neo-Aristotelian Objection (Highest Damage)**  
     *"Your 'causal unity' is epiphenomenal without a substantial form. A heap of sand can causally differ *as a heap* (e.g., blocking light), but it lacks true unity—it’s just aggregates acting jointly. Only forms confer irreducible teleological unity."*  
     **Reply (2-min):** "Agreed that mere aggregates can have *collective* effects. But I require *irreducible* causal-explanatory difference-making: effects attributable *only* to the whole *as a unified entity* (e.g., a cell’s mitosis, not a heap’s blocking). This *is* teleology-lite: the 'locus' acts *as one* toward outcomes. Forms may ground this, but my criterion identifies where forms *must be posited*."  
     **Soft Spot:** Conflates "acting jointly" with "acting as one." Hardcore hylomorphists will demand ontological priority of form over causality.  

  2. **Physics-Focused Objection (High Damage)**  
     *"Causation isn’t fundamental in QFT/GR—it’s emergent or folk-talk. Basing composition on it is like basing it on 'color': useful macroscopically, but metaphysically shallow. Why not just accept deflationary universalism?"*  
     **Reply:** "I don’t require *fundamental* causation. Causal-explanatory difference-making operates at *explanatory levels*. A protein folds *as a single unit* in biophysics explanations, even if reducible to quantum fields. This avoids universalism by requiring *emergent causal integration*, not just existence."  
     **Soft Spot:** If causation is *only* pragmatic, composition becomes interest-relative—my core objection to deflationism.  

  3. **Formal Ontologist Objection (High-Moderate Damage)**  
     *"If parthood is transitive, but causal unity isn’t (e.g., mitochondria are unified in a cell, cells in an organ, but mitochondria aren’t unified *with the organ*), you violate mereology’s core axioms. Will you reject transitivity?"*  
     **Reply:** "Transitivity holds only when causal unity is preserved across scales. The mitochondrion is part of the cell *as a unified subsystem*, not a direct part of the organ. We need *context-sensitive* transitivity: parthood chains require unity at every link."  
     **Soft Spot:** Radically revises mereology. Formalists will demand a non-*ad hoc* logic for this.  

  4. **Physics-Focused Objection (Moderate Damage)**  
     *"In entanglement, two particles are a causal-explanatory unity (e.g., violating Bell’s inequalities), but they lack a *composite object*—just a non-separable state. Isn’t this a counterexample?"*  
     **Reply:** "This *is* composition! Entangled pairs *act as a single causal unit*—their joint state explains outcomes indivisibly. We should accept composite objects here, even if they lack classical locality."  
     **Soft Spot:** Stretches "object" beyond intuitive boundaries. May force acceptance of ephemeral composites.  

  5. **Neo-Aristotelian Objection (Moderate Damage)**  
     *"A corpse has the same causal powers as a living body (e.g., weight, chemical reactions), yet you’d deny it’s a substance. Doesn’t your account conflate dispositions with substantial unity?"*  
     **Reply:** "The corpse *lacks* the *specific* causal powers of the organism (e.g., self-repair, homeostasis). It’s the *loss* of unified causal capacities that marks decomposition. Powers must be *holistically integrated*, not merely aggregated."  
     **Soft Spot:** Requires fine-grained individuation of powers—risks circularity.  

  6. **Formal Ontologist Objection (Low-Moderate Damage)**  
     *"Your account makes composition vague (e.g., a fading chorus’s harmony). But vague composition implies vague existence—which undermines classical logic for identity. Will you bite this bullet?"*  
     **Reply:** "Vagueness here is *epistemic* or *metaphysical but benign*. Causal unity *can* be gradient (e.g., partially functional systems), so composition *is* sometimes indeterminate—but this reflects reality’s structure, not semantic indecision."  
     **Soft Spot:** Opens door to ontic vagueness, which many reject.  

  7. **Physics-Focused Objection (Low Damage)**  
     *"In relativity, causal relations are frame-dependent. Is a composite’s existence observer-relative? If not, what’s your privileged foliation?"*  
     **Reply:** "Causal unity is relativized to a *reference frame* or *energy scale*. A hadron is a unified composite in QCD, even if its parts are frame-dependent. This is no more problematic than modeling solids in continuum mechanics."  
     **Soft Spot:** Implicitly privileges certain scales/frames.  

  8. **Neo-Aristotelian/General Objection (Low Damage)**  
     *"Artifacts (e.g., a clock) seem unified causally, but lack substantial forms. Are they genuine composites?"*  
     **Reply:** "Yes—if their parts *jointly realize novel causal powers* (e.g., timekeeping). But this unity is *derivative*: dependent on external designers/users. Natural composites have *intrinsic* causal unity."  
     **Soft Spot:** "Derivative unity" may feel like special pleading.  

  ---

  ### **The Question You Hope Nobody Asks**  
  *"Take a photon emitted by an atom and absorbed by a detector. We can cite the atom-detector *system* as making a causal difference to the lab’s energy state. Does this mean the atom and detector compose a new object? If not, how is this 'joint involvement' different from your 'unified locus'?"*  

  **Why it’s deadly:** Forces you to either overgenerate composites (atom-detector system) or admit your criterion is context-dependent—reintroducing the "descriptive interests" problem you aimed to avoid.  
  **Salvage Reply:** "The absorption is explained by the detector’s *structure* and the photon’s *properties*—not by a *novel power* of the atom-detector whole. Contrast a synapse firing: its effect is irreducible to pre-synaptic neuron + post-synaptic neuron acting separately."  
  **Why Salvage is Soft:** Distinguishing "novel powers" from "joint effects" relies on explanatory practices—risking pragmatism.  

  **Final Tip:** When cornered, emphasize **explanatory irreducibility** over causation *simpliciter*. Stress that your account is *metaphysically lightweight* compared to hylomorphism but *robust* compared to deflationism. Good luck!
