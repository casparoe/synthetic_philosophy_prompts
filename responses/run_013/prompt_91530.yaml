prompt: |-
  I'm a third-year student in a course on explanation in the social sciences, and we've spent several weeks on the claim that a religious ethic can help explain the emergence of a certain economic mentality — the idea that a culture's values can be a genuine cause of economic behavior rather than a decoration on top of material interests. I keep running into the same objection from a friend in the economics department: any case of this kind can be redescribed so that the values do no causal work, either because the material conditions selected for the values, or because the values are just a rationalization of the interests they appear to explain. I'd like to see whether that objection can be answered by design rather than by argument, so I want you to build a case for me.

  Please act as a philosopher of the social sciences with a specialty in the methodology of ideational explanation — someone comfortable both with causal-inference debates and with interpretive social science. Think carefully before you write. Begin with a brief brainstorming pass in which you state the design constraints in your own words, say where you expect the difficulties to lie, and note any constraint that may be jointly unsatisfiable; then give me the finished case and the analysis.

  Here is the distinction I want the case to turn on. Call values a selector when material conditions have already generated a set of live options and the values merely settle which option a group takes. Call values a generator when they bring about a course of action that the prevailing material conditions would not have generated on their own. Your case must be one in which the values are generators, not selectors.

  Constraints on the case:

  - Invent it. No real religions, regions, or historical episodes, and no names of scholars or works anywhere in your answer — I want a constructed case, not a recalled one.
  - Small scale: one polity, at most two generations (roughly fifty to seventy years), no external shocks such as plague, conquest, or discovery, since those give the materialist an easy exit.
  - The value system must not be a work ethic or a thrift ethic, and must not be Protestant in flavor. Its economic effect should be a by-product that its own adherents would not have endorsed as an economic goal.
  - Specify the material conditions, and include a neighboring comparison group matched on climate, soil, trade access, and legal status that lacks the doctrine.
  - Cross-boundary test: the doctrine must arise under one set of material conditions and then be adopted by a group living under materially different conditions, producing the same behavioral shift there.
  - Reverse-causation block: the doctrine's founders must have been materially harmed by the very behavior it later produced.
  - Name the outcome variable and give one measurable indicator of it.

  Then do the analysis. State the generator explanation, the selectionist explanation, and the rationalization explanation, and for each say what it predicts and which specified feature of your case it cannot accommodate. Identify the single feature doing the work, then delete that feature and show precisely how the case collapses back into an ordinary selection story. Give the strongest materialist counterattack you can and say whether the case survives it. Finish with an honest paragraph on whether the case establishes values as causes or only as enabling background conditions, and be willing to conclude that the design fails if it does. Flag every stipulation as a stipulation, and don't pad the answer with hedging.
reasoning: |-
  Okay, the user is a third-year student studying explanation in social sciences, particularly focused on how religious ethics can influence economic behavior. They're struggling with an objection from an economics friend who argues that values are either selected by material conditions or just rationalizations of interests. The user wants a designed case study to counter this, not just arguments. 

  Hmm, the constraints are quite specific: invented case, small scale (one polity, two generations), no work/thrift ethics, material conditions specified with a control group, cross-boundary adoption test, reverse-causation block, and a measurable outcome. The key distinction is between values as "selectors" (choosing from existing options) vs. "generators" (creating new paths). 

  First, I need to brainstorm a scenario satisfying all constraints. The biggest challenge will be the cross-boundary test and reverse-causation block—it's tricky to design a doctrine that harms its founders yet spreads to different material conditions. I'm considering a ritual-based value system where economic effects are unintended byproducts. 

  For the case, I'll create the "Doctrine of Sustained Offering" centered on prolonged ritual preparation. Material conditions: moderate agrarian society (Twin Basins). Control group: Crestlands without the doctrine. Outcome variable: durable tool production (measurable via tool longevity in archaeological layers). 

  The reverse-causation block requires founders to be materially harmed—so I'll make them skilled artisans who abandon craftsmanship for ritual labor, losing income. The cross-boundary test needs doctrine adoption in a different setting (pastoral Uplands), where it similarly boosts tool durability despite different material needs. 

  Analysis must pit three explanations against each other:
  - Generator: Values cause new economic behavior
  - Selectionist: Material conditions shape values
  - Rationalization: Values justify pre-existing interests

  The generator view survives because:
  1. Selectionist can't explain cross-boundary adoption (same values → same behavior in different conditions)
  2. Rationalization fails reverse-causation (founders harmed by the behavior)
  3. No material payoff for extended tool-making

  The critical feature is the doctrine's non-economic core ritual. If removed, it collapses to selectionism (e.g., if tool longevity directly served survival in Basin but not Uplands). 

  Strongest materialist counterattack: Maybe groups adopting the doctrine already had latent artisan traditions. But the case blocks this by stipulating Uplanders had no such tradition and only developed durable tools after adoption. 

  Honestly, the case shows values as causes, not just enablers, because the ritual practice directly structures labor time allocation. But it's narrow—only proves values can reshape existing productive activities, not invent wholly new ones. 

  *Double-checks all constraints are met* Yes: invented, small scale, non-economic doctrine, control group, cross-boundary test, reverse-causation, measurable outcome. No hedging—this should work.
answer: |-
  ### Brainstorming Pass  
  **Constraints & Difficulties**:  
  - **Joint unsatisfiability risk**: The cross-boundary test + reverse-causation block + non-economic effect is *extremely* demanding. If founders are harmed by the behavior, why would others adopt it under *different* conditions? Must design a doctrine where the *ritual practice* (not the outcome) is intrinsically valued.  
  - **Key hurdle**: Materialists will attack cross-boundary adoption as selection-for-efficiency (e.g., "Uplanders adopted it *because* it suited new conditions"). Must show adoption was doctrinal fidelity, not optimization.  
  - **Outcome variable**: Must be measurable, non-obvious, and plausibly a by-product. Tool longevity (archaeologically verifiable) avoids Protestant-ethic tropes.  

  ---  
  ### The Case: The Doctrine of Sustained Offering  
  **Material Baseline**: Two adjacent valleys in a stable, temperate region:  
  - **Twin Basins**: Fertile soil, river trade access, feudal land tenure. Mixed farming (grains, orchards).  
  - **Crestlands** (control): Identical climate/soil/trade/legal status. No doctrinal difference *initially*.  

  **The Doctrine**: Emerges among **Basin Devotees**. Core tenets:  
  - *Ritual Purity via Preparation*: Sacred objects used in solstice rites must be crafted with "unbroken labor" (≥100 consecutive daylight hours per item).  
  - *Economic Taboo*: These objects cannot be sold or traded; they are votive offerings burned after use.  
  - *Non-economic ethos*: Value lies in discipline demonstrated through time-intensive, non-utilitarian labor.  

  **Founders' Harm** (Reverse-causation block): The first Devotees were skilled artisans who abandoned profitable craft production (metal tools, pottery) to make these ritually prescribed objects. Stipulation: Tax records show their households fell into poverty within 5 years.  

  **Outcome Variable**: **Durable tool production** (non-ritual).  
  - *Indicator*: Mean functional lifespan of agricultural tools (e.g., iron sickles) in archaeological layers, measured via edge-wear/re-sharpening patterns.  
  - *Effect in Basins*: Within 20 years, Devotees' non-ritual tools last 2.3x longer than Crestlands' tools (verified from midden digs). Why? Artisans applied "unbroken labor" techniques (e.g., layered forging, meticulous annealing) to ordinary tools *by habit*, despite no doctrinal requirement.  

  **Cross-Boundary Test**:  
  - **Uplands**: Pastoralist society (rocky soil, sheep herding), materially distinct from Basins.  
  - Doctrine spreads via missionary Devotees after Basin famine (doctrine persists; material cause excluded by "no external shocks" constraint).  
  - *Result*: Within 30 years, Uplands adopt ritual objects + *durable herding tools* (e.g., shears). Tool lifespan increases 1.8x vs. pre-adoption layers.  

  ---  
  ### Analysis  
  **Generator Explanation**:  
  - *Values as cause*: Ritual time-investment norm reshapes labor habits, spilling over into non-ritual production.  
  - *Predicts*: (1) Durability shift only where doctrine practiced; (2) same effect in materially different Uplands.  

  **Selectionist Explanation** (Values as selectors):  
  - *Claim*: Material conditions favored durability; doctrine merely "selected" this pre-existing option.  
  - *Falsified by*: Crestlands (identical conditions) show no durability increase. Uplanders had *no durability tradition* (pre-adoption tools were expedient).  

  **Rationalization Explanation** (Values as post-hoc justification):  
  - *Claim*: Basin elites promoted doctrine to justify profiting from durable tools.  
  - *Falsified by*: (1) Founders were impoverished, not elites; (2) ritual objects destroyed, not sold; (3) Uplanders gained no profit from durable shears (isolated, non-trading).  

  **The Crucial Feature**: The **non-instrumental ritual practice** (100-hour unbroken labor for burned offerings). This habit spills over unintentionally.  

  **If Feature Removed**: If doctrine merely prescribed "make durable sacred objects" (no specific labor process), selectionism wins. Crestlands could have "selected" durability without doctrine if efficient. Uplanders might adopt it *only* if pastorally useful—collapsing to rationalization.  

  **Strongest Materialist Counterattack**:  
  - "Uplanders adopted durability *because* rocky terrain eroded tools faster. Doctrine was a coincidental vehicle."  
  - **Rebuttal**: Pre-adoption Uplander tools were *less* durable than Basin tools despite harsher conditions. Durability emerged *only* post-adoption. Stipulation: Soil abrasion studies confirm terrain alone cannot explain the shift.  

  **Honest Conclusion**:  
  The case establishes values as **causes** (not enablers) of *habit formation* that alters economic behavior. The unbroken labor norm restructured time allocation and skill development, generating durable tools as a by-product. It fails to prove values can create *novel* economic structures ex nihilo, but successfully shows they can reconfigure material relations *against* short-term interests. **Design succeeds** on your criteria—but only by making the doctrine economically irrational at inception. Remove that, and materialism wins.  

  ---  
  **Flagged Stipulations**:  
  - Founders harmed (tax records)  
  - Identical Crestlands baseline (archaeology)  
  - Uplanders' pre-adoption tool fragility (midden analysis)  
  - No external shocks (design constraint)  
  - Doctrine spread via non-economic missionary zeal (historical analogy)
