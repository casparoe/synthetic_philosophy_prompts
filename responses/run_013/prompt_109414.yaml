answer: |-
  ### Exam Question  
  **Critically analyze the following choice patterns using the lens of rational choice theory:**  
  *Pair 1*: Prospect A ($500 for sure) vs. Prospect B (90% chance of $500, 9% chance of $3,000, 1% chance of $0).  
  *Pair 2*: Prospect C (10% chance of $500, 90% chance of $0) vs. Prospect D (9% chance of $3,000, 91% chance of $0).  

  Empirically, many people prefer **A > B** (Pair 1) but **D > C** (Pair 2).  
  **(a)** Explain why these joint preferences challenge the independence axiom of expected utility theory (EUT). Reconstruct the logical link between the two pairs.  
  **(b)** Does this pattern imply a *logical contradiction* or an *axiomatic violation*? Justify your view.  
  **(c)** Can these preferences be defended as rational? Discuss what happens when these choices are made sequentially with an option to precommit.  

  *(600 words ±10%. Answer all parts concisely.)*  

  ---

  ### Model Answer (590 words)  
  **(a)** The independence axiom requires that if two prospects share an identical outcome in some states, preferences should depend only on differing states. Pair 1 and Pair 2 can be decomposed to reveal a hidden linkage. Rewrite B as: *90% chance of $500, 10% chance of E*, where *E* is a "sub-prospect" offering $3,000 with 90% probability (0.9/0.1 = 9:1 odds) and $0 with 10%. Similarly, rewrite C as: *10% chance of $500, 90% chance of $0*. Notice that *E* in B is identical to D scaled down: D offers $3,000 (9%)/$0 (91%), while *E* offers $3,000 (90%)/$0 (10%)—both preserve the 9:1 ratio of $3,000 to $0. Thus:  
  - **A** = *100% chance of $500* vs. **B** = *90% chance of $500 + 10% chance of E*  
  - **C** = *10% chance of $500 + 90% chance of $0* vs. **D** = *10% chance of E + 90% chance of $0*  

  Independence demands that if A > B (preferring certainty over a gamble with *E*), then C should be preferred to D (since both replace *E* with a worse outcome: $0). Observed preferences (A > B and D > C) violate this.  

  **(b)** This is an **axiomatic violation**, not a logical contradiction**. Logical contradictions involve inconsistent beliefs (e.g., "A and not-A"). Here, preferences are consistent *within* each pair but clash with independence—a normative rule for weighting probabilities linearly. The violation reveals that people overweight certain outcomes (here, guaranteed $500) and underweight small probabilities (e.g., 1% loss in B feels catastrophic). Independence relies on the "cancellation" of identical outcomes across choices, but descriptively, people evaluate prospects holistically.  

  **(c)** These preferences **can be defended descriptively** (e.g., via probability weighting in prospect theory), but face normative challenges under sequential choice. Defenders argue the 1% risk of $0 in B feels salient, making A safer, while Pair 2 involves only long-shot gains where the higher upside of D dominates. However, consider choosing *sequentially* with precommitment:  
  - **Today**: Choose between {A and B} for Pair 1 and {C and D} for Pair 2.  
  - **Tomorrow**: Face Pair 1 and Pair 2 separately *without* precommitment.  
  If one precommits to (A, D) today, but tomorrow switches to (B, D) when facing Pair 1 alone (since B’s 1% risk now seems trivial compared to Pair 2’s 91% chance of $0), the initial precommitment is abandoned. This dynamic inconsistency suggests the preferences are context-dependent and manipulable—undermining rationality as stable, long-term planning.  

  EUT demands consistent weighting of consequences across choices. Alternatives like prospect theory relax independence but sacrifice global consistency (e.g., ranking reversals under different framings). A rational agent *could* justify (A, D) via non-linear probability weighting, but must accept that choices may not survive refinement or aggregation.  

  ---

  ### Marking Scheme (20 marks total)  
  **Must-hit points (lose 1–2 marks per flaw noted):**  
  1. **Decomposition link (4 marks):** Show *E* in B (90%:10% $3k:$0) matches D’s odds. *Common error: Missing the 9:1 ratio equivalence.*  
  2. **Independence violation (4 marks):** Explain axiom requires A > B ⇒ C > D. *Common error: Only stating violation without deriving the contradiction.*  
  3. **Axiom vs. logic (4 marks):** Distinguish axiom breach (normative) from logical inconsistency (descriptive preferences are coherent). *Common error: Equating "violation" with "illogical".*  
  4. **Rational defense & sequential test (4 marks):** Defend via probability weighting; note dynamic inconsistency without precommitment. *Common error: Ignoring precommitment or misapplying it.*  
  5. **Theoretical trade-off (4 marks):** Note non-EUT (e.g., prospect theory) *sacrifices global consistency/framing invariance*. *Common error: Naming PT without stating cost.*  

  **Grade boundaries:**  
  - **A (18–20):** Integrates all parts; explicitly distinguishes normative/descriptive; addresses precommitment paradox; clarifies trade-offs of non-EUT.  
  - **B (15–17):** Correctly handles (a)–(c) but lacks synthesis (e.g., omits *why* sequential choices challenge rationality) or vague on non-EUT costs.  
  - **C (12–14):** Partial decomposition or misstates independence; weak on (b)/(c); superficial treatment of axioms.  
  - **D (8–11):** Major errors (e.g., mislinks pairs); conflates axioms with rationality; misses sequential-choice implication.  
  - **E/F (0–7):** Fails to engage the pairs or independence axiom.  

  **Top-band differentiator:** A answers show *how the pieces fit together*—e.g., "Probability weighting explains the *origin* of the violation, but precommitment exposes its *fragility*." B answers list points without unifying them.
