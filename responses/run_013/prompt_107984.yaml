prompt: |-
  OK, so I teach a unit on admiration and envy, and I've realized I dont' actually have a principle — I have a pile of gut reactions, and when students push I wave my hands and say "it's contextual." I grew up with the American Dream version of all this: you're supposed to rise, and when you rise people are supposed to cheer. Then I spent a year in Norway and got a dose of Jante — you know, the ten rules from that 1930s satirical novel about a small Danish town where nobody is allowed to think they're anyone special. I came back with alot of my intuitions scrambled. Here's where I actually land, case by case:

  1. An old friend's book wins a big prize. I'm genuinely glad, no ambivalence, and I'd think less of myself if I felt a twist of envy.
  2. The parade for the local kid who medaled at the Olympics. Charming. Nothing wrong with it.
  3. My department puts up a monthly leaderboard of everyone's citation counts. I hate it, and not because it's a management fad — it seems to do something wrong to the people at the bottom of it.
  4. A colleague who is genuinely brilliant and will tell you so, unprompted, at lunch. I can't stand it, and I think it's a real character flaw, even though everything he says is true.
  5. The same colleague, asked point blank whether he's the best in the field, says "oh, not even close," which is false. I think that's fine, even admirable.
  6. Me declining to be put up for an award I'd probably win, so my colleagues don't have to think about me as a contender. Cowardice. I know it.
  7. A student who's the sharpest in the room and never speaks up because she doesn't want to look like a show-off. That's a loss — I wish she'd talk.
  8. A Norwegian colleague who heard about my grant and said, well, don't go thinking you're anything special. It stung and felt hostile, and yet I also think she's protecting something I'd want protected.
  9. A friend who posts her salary, her marathon time, and her kid's college acceptance on social media. Tacky — but I can't say why, when the same friend telling me those exact things over dinner is completely fine.
  10. An obituary that notes the man was never rich or famous and that this is how he wanted it. Something's off, like it's cutting the successful down sideways.
  11. A colleague I'm convinced is a fraud gets a big award and I'm furious, and that feeling isn't envy. I think it's appropriate.

  So: is there one principle here? My tentative one is that celebrating achievement is fine, and what's objectionable is converting achievements into a ranking of persons. But that makes my contempt for the braggy colleague come out wrong — he isn't ranking anyone, he's just stating facts about himself — and it makes the Jante business come out fine, which I don't want. A friend mentioned there's a Buddhist term, mudita, for the pleasure you take in someone else's success, and suggested that's the virtue I'm circling, but I can't tell whether that's a distinct thing or just the absence of envy. Give me the principle, or the small set of candidates. For each clause, tell me which of my cases motivates it. Then tell me what it predicts for cases I haven't listed: a boss who singles out one employee for praise in front of the others; a school that stops naming a valedictorian so nobody feels bad; a Nobel laureate's memoir; me telling my daughter she's the smartest kid in her class. And be honest about which of my verdicts I'd have to give up. If it's my self-effacement in case 6 or my contempt in case 4, fine, I can live with that — but tell me which, and why. If the real answer is that I'm running two separate norms, one about envy and one about status, just say so.
reasoning: |-
  Okay, let me start by unpacking the teacher's dilemma. They've got this collection of reactions to admiration and envy scenarios but no unifying principle. The American Dream clashes with the Scandinavian Jante Law, leaving their intuitions scrambled. They listed 11 cases where their gut reactions vary—sometimes celebrating achievement feels right, other times it feels wrong. 

  Hmm, the key tension seems to be between celebrating individual success versus maintaining social equality. The teacher's tentative principle—approving celebration but rejecting ranking persons—doesn't quite hold up. For instance, the braggy colleague (case 4) isn't ranking anyone but still feels objectionable, while the Norwegian Jante-style comment (case 8) actively suppresses recognition but might protect communal harmony. 

  Looking deeper, I notice three recurring themes across the cases: agency, context, and purpose. The book prize (case 1) and Olympics parade (case 2) involve organic recognition where the achiever isn't demanding praise. In contrast, the leaderboard (case 3) and salary posting (case 9) force comparisons onto others. The fraud colleague (case 11) triggers rage because merit is violated, not just status—suggesting desert matters. 

  Ah! The Buddhist concept mudita might help frame virtuous admiration, but the teacher suspects it's just non-envy. Actually, mudita is proactive joy in others' success—distinct from mere lack of envy. That could explain why case 1 feels good (mudita present) while case 6 (self-suppression) feels cowardly (mudita blocked). 

  But mudita alone doesn't solve the bragging issue. The colleague stating facts (case 4) violates a norm of humility, which ties to social function: unrequested self-praise disrupts group dynamics, unlike dinner-sharing (case 9). Similarly, Jante comments (case 8) might enforce humility but weaponize it, hurting individuals. 

  So perhaps two principles: 
  1. Desert-based recognition (merit matters) 
  2. Community-sustaining expression (how recognition affects bonds) 

  Testing this: 
  - Bragging (case 4) fails community-sustaining expression by ignoring social cues. 
  - Jante (case 8) prioritizes community but deserts recognition, causing harm. 
  - Self-effacement (case 6) violates desert by hiding merit. 

  For new cases: 
  - Boss praising one employee publicly? Risky—if merit-based and context-appropriate (e.g., rare feat), ok; if routine, undermines community. 
  - No valedictorian? Balances community but may ignore desert. 
  - Nobel memoir? Context-dependent: reflective=admirable; boastful=objectionable. 
  - Telling daughter she's smartest? Ranking undermines community; better praise effort. 

  The teacher might need to adjust: 
  - Case 4 contempt holds (bragging violates community norms). 
  - Case 6 self-effacement is indeed cowardice (denies desert). 
  - Case 10 obituary's "never wanted fame" subtly ranks, violating community spirit. 

  Not two separate norms—desert and community intertwine. Virtuous admiration (mudita) flourishes when both align.
answer: |-
  Your cases reveal a coherent principle—not a single rule, but a tension between two moral forces: **Desert** (whether recognition is *merited*) and **Community** (how recognition affects social bonds). The virtue of *mudita* (appreciative joy) emerges when these align; your discomfort arises when they conflict. Here's the framework:

  ### Core Principles
  1. **Desert**: Recognition is good when it reflects genuine merit or effort.  
     *Motivated by:* Your fury at the fraud's award (Case 11), admiration for Olympic medalists (Case 2), and discomfort with the self-effacing student (Case 7).  

  2. **Community**: Recognition is good when it strengthens bonds; bad when it creates hierarchy, isolation, or forced comparisons.  
     *Motivated by:* Hatred of the citation leaderboard (Case 3), discomfort with social media boasts (Case 9), and the mixed feelings about Jante (Case 8).  

  3. **Agency**: Recognition feels virtuous when *others* offer it (Case 1, 2), but suspect when *self-initiated* (Case 4, 9). Humility (Case 5) protects community; self-promotion risks status contests.  

  ### How It Explains Your Cases
  | Case | Your Verdict | Principle Applied |  
  |------|--------------|-------------------|  
  | 1    | ✅ Good      | Desert + Community: Merit acknowledged organically. |  
  | 2    | ✅ Good      | Desert + Community: Shared celebration, no ranking. |  
  | 3    | ❌ Bad       | Community Violation: Forced ranking breeds shame/isolation. |  
  | 4    | ❌ Bad       | Agency Violation: Self-praise ignores community norms; feels like status-grabbing. |  
  | 5    | ✅ Good      | Community Protection: Humility (even false) preserves equality. |  
  | 6    | ❌ Bad       | Desert Violation: You deny merit its due, undermining communal honesty. |  
  | 7    | ❌ Bad       | Desert + Community Violation: Merit suppressed; group loses insight. |  
  | 8    | ⚖️ Mixed    | Community Protection (good) but Desert Violation (undermines merit). |  
  | 9    | ❌ Bad       | Agency + Community Violation: Unsolicited self-promotion forces comparisons. |  
  | 10   | ❌ Bad       | Community Violation: Fake humility that implicitly ranks ("better than the successful"). |  
  | 11   | ✅ Good      | Desert Violation: Anger is justified when merit is subverted. |  

  ### Predictions for New Cases
  - **Boss praising one employee publicly**:  
    ❓ *Context-dependent*. If the praise highlights *specific merit* (Desert) and is *rare* (avoids hierarchy), it’s fine. If frequent or vague ("best employee"), it harms Community.  
  - **School eliminating valedictorian**:  
    ❌ *Bad* by Desert (merit unrecognized), ✅ *Good* by Community (reduces ranking). Your Jante conflict recurs.  
  - **Nobel laureate’s memoir**:  
    ✅ *Good* if reflective/gracious (aligns Desert + Community). ❌ *Bad* if self-aggrandizing (violates Agency/Community).  
  - **Telling your daughter she’s the smartest**:  
    ❌ *Bad*. Violates Community (creates hierarchy) and misrepresents Desert (intelligence isn’t earned). Better: Praise effort or specific achievements.  

  ### Verdicts You’d Need to Reconsider
  - **Case 6 (Declining the award)**: You call this "cowardice"—and the framework agrees. *Why?* It violates **Desert**. Merit deserves acknowledgment; denying it deprives the community of virtuous celebration (*mudita*).  
  - **Case 4 (Braggy colleague)**: Your contempt holds. *Why?* He violates **Agency** (self-promotion) and **Community** (ignores social cues). Even "true" facts can be weaponized for status.  
  - **Case 10 ("Never wanted fame" obituary)**: You sense falseness—rightly. It subtly ranks people, violating **Community** under guise of humility.  

  ### Is This One Norm or Two?
  It’s a single norm: **Recognition should honor desert while nurturing community.** *Mudita* is the emotional reward when this happens. Envy arises when desert is ignored (Case 11); status anxiety when community is breached (Case 3). Your intuition about "ranking persons" is a symptom of community violation, but desert is equally crucial.  

  ### Why Jante Fits (and Why You Resist It)
  Jante prioritizes community over desert. You’re conflicted (Case 8) because it *does* protect social bonds (✅) but stifles merit (❌). Your American Dream instinct rebels against suppressing desert—rightly. The sweet spot lies in celebrating achievement *without* letting it define human worth.  

  **Final Principle**:  
  *"Admire what merits admiration, express it in ways that unite, and never let achievement calcify into hierarchy."*  
  This preserves your core intuitions—but asks you to reject self-suppression (Case 6) as the theft of communal joy.
