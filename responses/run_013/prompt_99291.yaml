prompt: |-
  My best friend Rosa is about as close to a living saint as I've ever met — gives away most of what she earns, weekends at a hospice, never once in twenty years done the selfish thing when the unselfish one was available. I'm writing a novel and one of my characters is loosly based on her, so I need to be able to predict her, and that means I need to know what rule she's actually running.

  Here's how she judges other people who've gone all-in on being good. A lawyer who quit corporate work for death row appeals — still has a partner and two kids she adores, still paints on Sundays, seems genuinely happy — Rosa says that's the best life a person can have, she'd swap into it tomorrow. A guy who lives on beans and gives away most of his income to malaria charities, but has a loud circle of friends, plays in a terrible band, is fun to be around — Rosa says yes, that's it, that's what a life is for. A hospice nurse we knew, no partner, no kids, no hobbies at all, double shifts until her body quit — Rosa says she'd take that life too, it's beautiful. But then there's a woman we both know who volunteers constantly, is quietly awful to everyone around her, and clearly does it so people will call her good — Rosa says that isn't goodness, that's vanity with a charity logo, and it doesn't count.

  Now the character. She's given up everything the way Rosa has — no partner, no kids, no close friends left, no music, no books for pleasure, no ambition that isn't moral. She sleeps four hours and works the rest for other people, and by any measure she does a huge amount of good. But she isn't happy. She isn't sad either. She's just empty — there's nothing left in her that isn't the work.

  Will Rosa say that's a life worth living — want it, recommend it, call it desirable? And tell me what rule she's actually running that fits everything above, because I suspect more than one does, what each of those rules predicts about my character, which one you'd bet on and why, and what case I should write next that would finally tell the rules apart. I don't need it tidy, I need it right.
reasoning: |-
  Okay, the user is writing a novel and has a character based on their friend Rosa. Rosa is incredibly selfless, but they need to understand the underlying rule governing her judgments of others' lives to accurately predict how she'd view the character in the novel. Let me start by breaking down the examples they provided.

  First, Rosa admires the lawyer who quit corporate work for death row appeals but still has a family, paints on Sundays, and seems happy. Then there's the guy living on beans, donating to charity, but has friends and plays in a band. She also respects the hospice nurse with no personal life who worked until her body gave out. But she criticizes the volunteer who's awful to others and seeks praise. The character in question has given up everything, works constantly, does good but feels empty. The user needs to know if Rosa would see this as a worthwhile life and what rule she's operating by.

  I need to identify possible rules Rosa might be using. The examples show a pattern. The lawyer, the bean guy, and the hospice nurse all have some form of personal engagement or joy, even if minimal. The hospice nurse lacked personal connections but might have found fulfillment in her work. The rejected volunteer's actions are insincere, driven by vanity. So Rosa might value authenticity and intrinsic motivation over self-sacrifice alone.

  Considering philosophical angles: Aristotelian virtue ethics focuses on flourishing through balance. Utilitarianism prioritizes outcomes, but Rosa doesn't seem to judge solely on results. The lawyer and bean guy have happiness and relationships, which suggests flourishing matters. The hospice nurse's "beautiful" life might be seen as virtuous despite lack of personal joy, but maybe Rosa assumes she had inner fulfillment.

  Rule 1: The Flourishing Rule. Goodness requires personal thriving alongside service. The lawyer and bean guy thrive; the hospice nurse might have inner fulfillment. The vain volunteer lacks authenticity. The character's emptiness suggests no thriving, so Rosa might reject her life as not good.

  Rule 2: The Authentic Sacrifice Rule. Motivation matters most. Sacrifice is valid if genuine, even without happiness. The hospice nurse is admired despite her sacrifice because her intent was pure. The volunteer's vanity invalidates her actions. The character's sacrifice is authentic, so Rosa might approve, even with emptiness.

  Rule 3: The Anti-Reward Rule. Goodness shouldn't seek external validation. The vain volunteer is criticized for seeking praise. The others aren't motivated by reward. The character isn't seeking praise, so Rosa might see her life as valid, despite emptiness.

  Comparing these to the examples: The Flourishing Rule explains why Rosa admires the lawyer and bean guy but also the hospice nurse if assumed she had inner joy. The Authentic Sacrifice Rule fits the hospice nurse's approval without needing joy. The Anti-Reward Rule focuses on motivation, which covers the volunteer's rejection.

  The character's emptiness is key. If Rosa values flourishing, emptiness is a red flag. If authenticity matters more, the sacrifice might be enough. The user needs to test with a new scenario to differentiate. For instance, someone who sacrifices everything, is unhappy, but isn't seeking reward. Rosa's reaction to their suffering would reveal if flourishing is necessary.

  Also, Rosa's own life: she has no partner, kids, etc., but does she have joy? The user mentions she's a living saint, so maybe her life includes some form of fulfillment. But the character is empty, which might differ.

  The user's deeper need is to understand Rosa's philosophy to make the character authentic. They might also be exploring themes of sacrifice, fulfillment, and what constitutes a good life. Unspoken, they might be questioning if extreme selflessness is sustainable or desirable.

  Final bet: The Flourishing Rule, as it aligns with most examples, and the hospice nurse might be an outlier where Rosa assumes inner fulfillment. The character's emptiness would make Rosa see it as not desirable. Testing with a scenario where someone sacrifices and suffers without reward would clarify if authenticity alone suffices.
answer: |-
  Based on Rosa's judgments and her own life, here's the breakdown of her likely "rule," what it predicts for your character, my bet, and the test case:

  **Rosa's Core Rule (The Flourishing Through Service Rule):**
  Rosa isn't running on pure self-sacrifice or maximizing utility. She's running on **Authentic Human Flourishing Achieved Through Service.** Goodness, for her, isn't measured solely by output or suffering, but by *how service integrates with and enhances a genuinely lived, connected human life.* The "good life" requires both:
  1.  **Significant Altruistic Action:** A deep commitment to helping others, making tangible sacrifices.
  2.  **Authentic Human Engagement:** Evidence of genuine connection (to others, to self, to life), vitality, and an intrinsic motivation rooted in care, not external validation. This engagement can look different (family, art, friendship, quiet dedication, joy) but it must be *present* and *real*.

  **Why this fits the evidence:**
  *   **The Lawyer:** Hits both. Significant sacrifice (corporate -> death row) *plus* family, art, happiness. "Best life."
  *   **The Bean Guy:** Hits both. Extreme financial sacrifice *plus* friends, music, fun, engagement. "What life is for."
  *   **The Hospice Nurse:** Rosa *assumes* the deep connection and intrinsic motivation. The work *was* her life and connection. Rosa infers the "Authentic Human Engagement" from the profound dedication itself, interpreting the lack of traditional hobbies/relationships as a *form* of deep connection to the work and patients. "Beautiful," "would take that life." (This is the key interpretive leap).
  *   **The Vain Volunteer:** Fails on #2. The altruistic action (volunteering) is present, but the "engagement" is inauthentic – driven by vanity and creating negative connection ("awful to everyone"). It's performative, not rooted in genuine care. "Vanity with a charity logo," "doesn't count."

  **Predictions for Your Character:**
  Based on the **Flourishing Through Service Rule**, Rosa would likely **NOT find your character's life desirable, worth recommending, or fully "good" in the way she admires.**

  *   **Why?** The character meets Criterion #1 (Massive Sacrifice, Huge Output) with flying colors.
  *   **But she fails Criterion #2:** The "emptiness," the absence of anything "left in her that isn't the work," the lack of happiness (or even sadness), signals a *complete absence* of Authentic Human Engagement. There's no vitality, no connection (not even to herself beyond the work), no intrinsic joy or meaning derived *from* the service itself or any other facet of life. It's service as self-annihilation, not service as a *mode* of living fully. Rosa might acknowledge the *output* as good, but she would see the *life* as a tragic distortion, missing the core element that makes service meaningful and human. She wouldn't "want it" or "recommend it" as a model. She might feel profound pity or see it as a warning.

  **Alternative Rules & Why They Don't Fit As Well:**

  1.  **Pure Output/Utility Maximization:** "The most good done is the best life."
      *   *Problem:* Doesn't explain why Rosa admires the Lawyer and Bean Guy *less* than maximally efficient altruists (like the character, potentially). Doesn't explain the rejection of the Vain Volunteer (who still *does* good, even if badly). Doesn't account for the value placed on happiness, art, friends.
      *   *Prediction for Character:* Rosa would admire this life immensely as the pinnacle of good output. (Contradicts her admiration for balanced lives).

  2.  **Motivation is Everything:** "Purity of intention defines goodness."
      *   *Problem:* Explains the rejection of the Vain Volunteer. But doesn't explain the *admiration* for the Lawyer and Bean Guy's *happiness and engagement*. Why are those positive if only motivation matters? Why is the Hospice Nurse's life "beautiful" if her motivation is pure but her life seems devoid of other engagement? This rule is *part* of Rosa's (embedded in "Authentic Engagement"), but insufficient alone.
      *   *Prediction for Character:* If the character's motivation is pure (not seeking praise), Rosa should approve, even with emptiness. (Contradicts her valuing happiness/engagement elsewhere).

  3.  **Sacrifice = Sanctity:** "The more you give up, the better the life."
      *   *Problem:* Directly contradicts her admiration for the Lawyer (who kept partner, kids, painting) and the Bean Guy (friends, band). The Hospice Nurse fits, but the other two admired lives involve *less* sacrifice than Rosa's own or the character's.
      *   *Prediction for Character:* Rosa would see this as the ultimate, most desirable life. (Contradicts her other judgments).

  4.  **Anti-Reward:** "Goodness is defined by *not* seeking external reward (praise, status)."
      *   *Problem:* Explains the rejection of the Vain Volunteer. But doesn't explain the *positive value* placed on *internal* rewards (happiness, joy in friends/art) in the Lawyer and Bean Guy. Doesn't explain why the Hospice Nurse's life is "beautiful" – she wasn't seeking praise, but is the *absence* of internal reward (if assumed) a problem?
      *   *Prediction for Character:* If the character isn't seeking praise, Rosa should approve. (Ignores the emptiness/internal state).

  **The Bet: Flourishing Through Service (Authentic Engagement + Significant Action)**
  This is the only rule that coherently explains *all* her judgments:
  *   Values the Lawyer/Bean Guy's balance (Action + Engagement).
  *   Values the Hospice Nurse's total dedication *as a form of Engagement*.
  *   Rejects the Vain Volunteer's lack of authentic Engagement.
  *   Explains why Rosa's *own* life (similar sacrifice to the character) likely *does* include some form of deep, authentic engagement with the work, the people she helps, or a quiet internal vitality – the thing missing in your character.

  **The Test Case to Finally Tell the Rules Apart:**
  Present Rosa with someone whose life **forces a choice between the *presence* of Authentic Engagement and the *absence* of any reward-seeking motivation, while sacrifice and output are high.** Specifically:

  > **The Burnt-Out Saint:** Someone who started like the Hospice Nurse – total dedication, profound connection, intrinsic motivation, clearly flourishing *through* service. But after decades, they are *now* exactly like your character: still working relentlessly, still producing immense good, still motivated purely by duty/habit (not vanity or seeking praise), but **completely empty inside, devoid of any spark, connection, or joy, merely going through the motions.** They confess it feels meaningless now, but they can't stop.

  *   **What Flourishing Through Service Predicts:** Rosa would see this as a *tragedy*. The Authentic Engagement is gone. The life is no longer "beautiful" or desirable, even if the output and motivation remain pure. She might urge rest, reconnection, or see it as a life that has *lost* its goodness *as a life*, despite the ongoing good deeds. "They've given too much of *themselves* away."
  *   **What Pure Output/Motivation/Sacrifice/Anti-Reward Predict:**
      *   *Output:* Still admirable, peak efficiency.
      *   *Motivation:* Still pure, still "good."
      *   *Sacrifice:* Ultimate sacrifice (including their inner self), most holy.
      *   *Anti-Reward:* Still not seeking praise, still "good."
      *   *(These rules would largely overlook or downplay the inner emptiness as irrelevant to the "goodness" of the life).*

  Rosa's reaction to "The Burnt-Out Saint" – whether she pities the loss of the person *within* the worker, or still admires the shell for its output and purity – will definitively reveal if the *flourishing/engagement* component is truly essential to her definition of the "good life," or if pure output/sacrifice/motivation suffice when engagement fades. Her likely horror or profound sadness at this scenario would confirm the **Flourishing Through Service** rule. Her continued admiration would point towards one of the other, more austere rules.

  **For your novel:** Rosa would likely see your character not as an ideal, but as a cautionary tale of service that consumed the self entirely, leaving only the shell of the work. The "emptiness" is the critical failure, violating the "Authentic Human Engagement" pillar of her rule. It's not tidy, but it fits the messy reality of her judgments. Good luck with the writing – this is a fascinating exploration of sainthood and its costs.
