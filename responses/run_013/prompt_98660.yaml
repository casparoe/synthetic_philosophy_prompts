prompt: |-
  I run the democratic innovations desk at a national parliament — we design and run citizens assemblies, three or four a year, and my boss wants me to turn the sortition side of it into a procedure the whole office can run without me in the room. So please write me one: a decision procedure for designing how an assembly is selected and what it's allowed to decide, grounded in what sortition is actually supposed to justify rather than what looks tidy on a slide. Questions in order, what counts as a good enough answer to each, where the procedure stops with a hard no (this one can't be done by lot), and where it hands the question to the minister because it's a values call and not a design call.

  Real constraints: six weeks per assembly, fixed budget, no power to compel anyone to show up, the minister signs off on the final design, and we will absolutely get judicially reviewed by someone arguing the sample wasn't fair. So it has to be reusable and a junior has to be able to run it.

  Stuff it has to actually resolve, because this is where we keep coming unstuck:

  - stratify or plain lot? our mandate literally says both selected by lot and representative of the country, and I've never been able to explain to my colleagues why the lot's warrant is that everyone had an equal chance rather than that the sample looks like a mirror of the population — and why those two come apart the moment you start topping up refusers. I can't seperate them in my head and I need the procedure to make the distinction operational, not just assert it.
  - the office's current draft draws from a civic register of people who've already signed up to be interested in this sort of thing. I think that quietly guts the whole thing but I can't say why in one sentence. Have the procedure say it in one sentence, or tell me I'm wrong.
  - refusals, dropouts, people we can't reach, and the replacement rule.
  - how big it has to be before the representation argument is doing any work at all.
  - who's in the pool — voters, citizens, residents, adults — and what to do when the people affected by the topic aren't all in the pool.
  - and the boundary: which design choices are ours, and which have to be handed to the assembly once it's seated, on pain of the whole thing just being an expensive focus group.

  Then run it on three cases: (a) a 150-person national assembly on assisted dying, (b) a 40-person borough assembly on a congestion charge where a lot of the drivers don't live in the borough, and (c) the minister's pet project — a permanent randomly selected chamber that sets its own agenda, ie proper lottocracy rather than a one-off. If the procedure kills one of those, say so plainly; I'd rather find out from you than from a select committee. And tell me which steps are just my value judgements dressed up as method, and what the procedure simply can't do.
reasoning: |-
  Okay, the user runs the democratic innovations desk at a national parliament and needs a decision procedure for designing citizens' assemblies. The main goal is to make this process reusable for juniors without their direct involvement. They're facing several recurring issues: stratification vs. plain lot, using a civic register, handling refusals and dropouts, determining the assembly size, defining the participant pool, and setting boundaries for the assembly's autonomy.

  First, I need to address the core tension in their mandate: "selected by lot and representative of the country." The key is separating the equality of chance from representativeness in demographics. Stratification is about ensuring diversity, but the lottery ensures equal opportunity. When refusers are replaced, especially with a civic register, it skews representativeness. The procedure must clarify that stratification is for inclusion, not mirroring the population.

  Next, the civic register issue. Using pre-registered people biases the sample toward those already civically engaged, undermining the legitimacy of the lottery. The procedure should reject this unless it's unavoidable, emphasizing that the initial draw must be from the entire pool.

  Handling refusals and dropouts is critical. Replacement rules must maintain the principles of sortition. Allowing replacements from the civic register after initial stratification introduces bias. The procedure should cap replacements to prevent skewing and require transparency about refusal rates.

  Assembly size depends on the decision's impact and heterogeneity. Smaller assemblies might suffice for local issues, but national ones need more participants to cover diverse views. The procedure should link size to these factors rather than a fixed number.

  Defining the pool involves legal and practical considerations. Voters' roll is practical but may exclude affected groups. The procedure must check if the topic's affected population is within the pool and adjust or flag issues otherwise.

  Boundary issues are crucial. The assembly must have autonomy over its recommendations; otherwise, it's just a focus group. The procedure needs to ensure that framing and constraints don't predetermine outcomes.

  Now, applying this to the three cases. For assisted dying (150-person national assembly), stratification is needed due to diverse demographics. The civic register shouldn't be used. Size is adequate. The pool is voters, but must consider affected groups like the terminally ill. The boundary must allow the assembly to set its own recommendations.

  For the borough congestion charge (40-person), stratification is less critical if the borough is homogeneous. But drivers outside the borough are affected, so the pool might need expansion. If not possible, flag it as a legitimacy risk. Size is borderline; consider if 50 is possible. Civic register use should be minimal.

  The permanent chamber (lottocracy) is tricky. It violates the single-topic principle and the fixed timeline. The procedure should flag it as unworkable under current constraints, requiring ministerial decision. This might be a hard stop unless constraints change.

  The user's deeper needs include institutionalizing the process to withstand judicial review and political scrutiny. They need clear, defensible steps that separate values from methodology. Juniors must execute it without ambiguity. Highlighting where ministerial input is needed (values) vs. design choices (method) is essential. Also, transparency in refusal rates and biases is crucial for legitimacy.
answer: |-
  Here's a reusable decision procedure for designing sortition-based citizens' assemblies, grounded in the **core justification of sortition: legitimacy through equal opportunity for political voice, not statistical mirroring.** It operationalizes the distinction, addresses your pain points, and includes hard stops and ministerial handoffs. Designed for juniors under real constraints.

  **Core Principle:** The lottery's legitimacy comes from **equal *ex ante* opportunity** for every eligible person to be selected. Representativeness (demographic mirroring) is a secondary, pragmatic tool for **inclusion** and **perceived legitimacy**, *not* the primary source of legitimacy. When these conflict, equal opportunity must be prioritized to maintain the unique warrant of sortition.

  ---

  **Citizens' Assembly Design Procedure (Sortition & Mandate)**

  **Phase 1: Define the Question & Boundaries (Ministerial Handoff Zone)**
  1.  **Question Clarity:** What is the precise question the Minister wants the assembly to answer? (e.g., "Under what circumstances, if any, should assisted dying be permitted?")
      *   *Good Answer:* Specific, focused, framed as a choice or set of principles, avoids presupposing outcomes.
      *   *Hard Stop:* If the question is vague, multiple disparate topics, or predetermined ("How should we implement Policy X?"). *Stop: Redefine or reject.*
      *   *Handoff:* If the framing inherently excludes significant perspectives or pre-determines scope in a way that constrains the assembly's fundamental conclusions. *Flag for Minister: "Does this framing risk predetermining outcomes or excluding key voices?"*
  2.  **Decision Authority:** What will Parliament do with the assembly's output?
      *   *Good Answer:* Clear commitment (e.g., "Parliament will debate and vote on legislation directly informed by the recommendations," "Government will respond formally within X days").
      *   *Hard Stop:* Purely advisory with no defined pathway to impact. *Stop: Assembly lacks purpose, risks being exploitative.*
      *   *Handoff:* Level of commitment (e.g., binding vs. advisory) is a political value judgment. *Flag for Minister: "Confirm commitment level: [Options]."*

  **Phase 2: Define the Pool ("Who *Could* Be Selected?")**
  3.  **Eligibility Pool:** Who is fundamentally affected by the topic? (Residents? Citizens? Voters? Specific groups e.g., patients/caregivers for health topics?)
      *   *Good Answer:* Based on the topic's impact sphere. Default = National Voters Roll (practical, legal defensibility).
      *   *Hard Stop:* If a significant group (>10%) demonstrably affected by the outcome is systematically excluded from the proposed pool *and* cannot be practically included. *Stop: Legitimacy deficit.*
      *   *Handoff:* Choosing between practical pools (Voters Roll) vs. ideal pools (All Residents) involves values (inclusion vs. feasibility). *Flag for Minister: "Key affected group [Group Y] not fully covered by Voters Roll. Proceed with Voters Roll? Yes/No. If No, define pool."*
  4.  **Civic Register Check:** *Is the initial invitation draw proposed from a pre-registered "civically interested" list?*
      *   *Procedure Mandate:* **NO.** Using a civic register fundamentally undermines the lottery's core justification by systematically excluding the disengaged or distrustful, biasing the sample towards the civically active. **Legitimacy requires the initial chance be equal for all *eligible*, not just the *willing*.** *(Your gut feeling is correct.)*
      *   *Good Answer:* Draw from the full Eligibility Pool (e.g., Voters Roll).
      *   *Hard Stop:* Mandate requires draw solely from a civic register. *Stop: Violates core sortition principle.*
      *   *Exception:* Civic register *can* be used **only** for *replacements* after the initial stratified draw and refusal process (Phase 3, Step 7), as a last resort, with transparency about the bias introduced.

  **Phase 3: Design the Selection ("Who *Is* Selected?")**
  5.  **Stratification Needed?** Does the topic involve perspectives highly correlated with specific, identifiable demographics where exclusion risk is high?
      *   *Good Answer (Stratify):* Yes, if topic links strongly to demographics like geography (local issue), age (pensions), ethnicity (race relations), income (tax), *and* group size is sufficient. Stratification ensures *inclusion* of key perspectives.
      *   *Good Answer (Plain Lot):* No, if topic is national/abstract (constitutional reform, long-term futures), demographics aren't strong predictors of relevant views, or pool is small/homogenous. Plain lot preserves purest equal chance.
      *   *Justification:* Stratification is an **inclusion tool, not a mirroring tool.** We stratify to *prevent* exclusion, not to *achieve* proportionality. The lottery's warrant remains equal *chance*.
      *   *Handoff:* Judgment call on which demographics are crucial for inclusion. *Junior flags rationale: "Stratify on [Age, Region] because [Reason linked to topic exclusion risk]."*
  6.  **Minimum Size:** Is the size sufficient for the assembly to hear diverse views and deliberate effectively, given the topic's complexity and heterogeneity?
      *   *Good Answer:* Based on topic scope & pool diversity. National/Complex: 80-150+. Local/Narrower: 30-80. Absolute minimum: 25 (viable deliberation). Larger sizes marginally help statistical arguments but *equal chance* is primary.
      *   *Hard Stop:* Proposed size < 25 for any assembly. *Stop: Too small for effective deliberation.*
      *   *Handoff:* Precise target size within viable range involves resource trade-offs (budget, time). *Flag for Minister: "Viable range: 50-100. Recommend 80 based on complexity. Confirm size."*
  7.  **Refusal & Replacement Protocol:**
      1.  **Initial Invitation:** Invite significantly more than target (e.g., 3x-5x) from the pool (stratified if applicable). **Transparency:** Publish invitation numbers/demographics.
      2.  **Refusal Rate:** Track refusals/demographics meticulously. **Transparency:** Publish refusal rates/demographics.
      3.  **Replacement Rule:**
          *   **Priority 1:** Replace from same stratification cell (if used) using original pool.
          *   **Priority 2:** Replace from same cell using original pool, relaxing stratification slightly if needed (e.g., adjacent region).
          *   **Priority 3 (Last Resort):** Replace from a pre-screened *civic register* **only if** refusal rate threatens viability *and* original pool replacement exhausted. **Transparency:** Mandatory disclosure of civic register use extent and potential bias.
          *   **Cap:** Max replacements ≤ 20% of target size. If exceeded, *Hard Stop: Legitimacy compromised. Redesign topic/pool/process or abandon.*
      4.  **Dropouts:** Treat as refusals *during recruitment*. Once seated, no replacements; assembly continues with remaining members. Budget for attrition (e.g., seat 105 for 100 target).

  **Phase 4: Empower the Assembly ("What Can *They* Decide?")**
  8.  **Mandate Boundary Check:** Does the design constrain the assembly's conclusions or process in a way that pre-determines outcomes?
      *   *Good Answer:* Assembly controls its deliberations, evidence gathering (within scope), and final recommendations. Secretariat provides balanced information, facilitation, and process support, not content direction.
      *   *Hard Stop:* Pre-defined options, restricted witnesses, ministerial veto on recommendations, or topic framing forcing a specific outcome. *Stop: Reduces assembly to focus group.*
      *   *Handoff:* Defining the precise *scope* of the question (Phase 1, Step 1) is the Minister's value judgment. Once seated, the assembly owns the answer within that scope. *Junior confirms: "Assembly has full autonomy over recommendations within the agreed question scope [Scope defined in Step 1]."*
  9.  **Judicial Review Prep:** Document every design choice rationale (esp. pool, stratification, refusal handling, replacement rule) against the core principle: **Equal ex-ante chance + Inclusion via stratification (if used) + Transparency.** Build the audit trail.

  **Phase 5: Ministerial Sign-off & Launch**
  10. **Compile Package:** Design rationale (Phases 1-4), documented risks (e.g., high refusal potential, civic register use), budget, timeline.
  11. **Ministerial Approval:** Submit for sign-off. Minister owns value judgments flagged for handoff.

  ---

  **Application to Your Cases:**

  1.  **National Assembly (150) on Assisted Dying:**
      *   **Phase 1:** Clear question? Likely Yes (e.g., "Under what circumstances...?"). Decision Authority? Handoff - Must be clear commitment.
      *   **Phase 2:** Pool = Voters Roll? Good default. Affected group (terminally ill) largely within pool? Likely Yes. *Civic Register Initial Draw? Hard Stop: NO.*
      *   **Phase 3:** **Stratify? Yes.** Strong links to age, health status (proxy via region/income?), religion (if data available). Crucial for inclusion. Size: 150 Good (complex, national). Refusals: Expect moderate-high. Use Priority 1/2 replacement. Document heavily. Cap replacements at 20% (30 people).
      *   **Phase 4:** Assembly autonomy? Must be full within scope. *Result: GO (pending Minister on scope/commitment).*

  2.  **Borough Assembly (40) on Congestion Charge:**
      *   **Phase 1:** Clear question? Yes. Decision Authority? Handoff - Borough Council commitment needed.
      *   **Phase 2:** **Pool = Borough Voters Roll? Problem.** Key affected group (non-resident drivers) systematically excluded. Pool definition fails "fundamentally affected" test. *Hard Stop: Legitimacy deficit unless pool expanded.*
      *   *Resolution Attempt:* Can pool be practicably expanded? (e.g., + commuters registered with borough council? + adjacent boroughs?). If yes (Handoff - Minister defines expanded pool), proceed. If no, *Stop: Cannot proceed fairly.*
      *   **Phase 3:** Stratify? Maybe (e.g., ward, car ownership if data). Size: 40 is **minimum viable** (local, but contentious). Risk of insufficient diversity. *Handoff: Flag risk to Minister, recommend 50 if possible.* Refusals: High potential (contentious local issue). Strict Priority 1/2. Cap 20% (8 people). *Civic Register Initial Draw? Hard Stop: NO.*
      *   **Phase 4:** Autonomy? Critical. *Result: STOP unless pool expanded. If expanded, GO (pending Minister on pool/commitment/size risk).*

  3.  **Permanent Random Chamber (Lottocracy):**
      *   **Phase 1:** **Question Clarity? Hard Stop: NO.** "Sets its own agenda" = inherently vague, multiple topics. Violates single-topic focus.
      *   **Phase 1:** **Decision Authority? Hard Stop.** Replacing/co-existing with elected chamber requires constitutional change, far beyond your mandate/authority.
      *   **Phase 2/3:** Size, stratification, pool - irrelevant due to Phase 1 stop. Civic Register? Hard Stop: NO for initial draw.
      *   **Phase 4:** Autonomy? Granted, but moot.
      *   **Real Constraints:** **Fixed 6-week timeline? Impossible.** Permanent body. **Fixed Budget? Impossible.** Ongoing costs. **No Power to Compel?** Unsustainable recruitment for permanent duty.
      *   **Result: HARD STOP.** This is fundamentally incompatible with your mandate, resources, and the core procedure (single-topic, defined mandate, fixed term). *Tell the Minister plainly: "This exceeds our statutory remit, operational capacity, and the design principles for legitimate one-off citizens' assemblies. It requires separate primary legislation, a dedicated permanent body, and a fundamentally different model."*

  ---

  **Key Exposures & Limitations:**

  1.  **Your Value Judgments Dressed as Method:**
      *   Defining "significantly affected" for the pool (Phase 2, Step 3).
      *   Judging which demographics are crucial for stratification (Phase 3, Step 5).
      *   Assessing the "sufficiency" of assembly size within the min/max (Phase 3, Step 6 - though min 25 is firm).
      *   Interpreting "constrains conclusions" vs. "defines scope" (Phase 4, Step 8).
  2.  **What the Procedure Can't Do:**
      *   Guarantee high participation or overcome deep public distrust.
      *   Force Parliament to act on recommendations.
      *   Resolve fundamental conflicts between equal chance and demographic mirroring - it prioritizes equal chance and uses stratification only for inclusion.
      *   Make value judgments for the Minister (highlighted as Handoffs).
      *   Work without rigorous documentation and transparency at every step (critical for JR defense).
      *   Fix a topic or pool that is inherently flawed or illegitimate from the start.
      *   Operate outside the 6-week/budget constraints - these are firm boundaries forcing trade-offs.

  **Junior Proofing:** The procedure uses clear Yes/No/Handoff/Stop steps, requires documenting rationales, and flags ministerial decisions explicitly. The Civic Register rule is absolute. The replacement protocol is algorithmic. Emphasis on transparency is built-in. Running it forces confrontation of the core tension ("lot vs. mirror") operationally. This provides the audit trail and defensible rationale needed for JR – you can show *why* choices were made based on the core principle, not just statistical ideals.
