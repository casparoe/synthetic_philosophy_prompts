answer: |-
  ## The Charter Debate

  **Setting:** A quiet library annex in the ruins of the defeated capital. Dust motes dance in shafts of afternoon light. Two jurists, ELENA (first jurist) and MARKO (second jurist), pore over draft provisions for the new tribunal's charter.

  **ELENA:** (Tapping the draft list) Marko, the core is here. Aggressive war – the *crime against peace*. Systematic atrocities against civilians – *war crimes*, *crimes against humanity*. These weren't inventions at Nuremberg or Tokyo. The Kellogg-Briand Pact renounced war as an instrument of national policy. Centuries of state practice and *opinio juris* condemned waging aggressive war. As for the atrocities? The Hague Conventions, the Geneva Protocols, countless military manuals – the prohibition of murdering civilians, using terror, deporting populations? Deeply embedded in the laws and customs of war long before 1939. The tribunals *declared* what *was*, applying existing custom.

  **MARKO:** (Leaning back, steepling his fingers) Existing custom, Elena? For *states*, perhaps. Kellogg-Briand bound *states*, not individuals. Where, precisely, in the state practice or treaties *before* 1945, was it established that a general, a foreign minister, could be hauled before an international court and hanged for *planning* a war their state deemed necessary? The concept of individual criminal liability for aggression simply didn't exist in positive law. It was a void filled by the victors. As for the atrocities... I grant you the prohibitions existed. But the *scale*, the *systematic nature* labeled "crimes against humanity" – applying individual liability for actions a state might have considered internal affairs? That was a significant, and retrospective, expansion.

  **ELENA:** It wasn't expansion, it was *recognition*. Customary law isn't static; it evolves through state practice and acceptance. The sheer barbarity *demanded* recognition that such acts weren’t merely breaches of treaty or domestic law, but crimes against the very fabric of humanity, incurring *individual* responsibility. The Hague and Geneva frameworks implicitly acknowledged individual culpability for violations. The tribunals crystallized what was nascent, what the conscience of mankind demanded be recognized as law.

  **MARKO:** "Crystallized"? That sounds perilously close to legislation. Consider the three distinctions we accepted: retroactive definition, jurisdiction, attribution. Let’s grant, for argument, that jurisdiction (trying them internationally) and attribution (holding leaders responsible for system crimes) might be stretched from existing principles – though I have doubts. But retroactive *definition*? That’s the fatal flaw for aggression. They took conduct – planning and waging war – that carried no *individual criminal penalty* under international law when done, and declared it a capital crime *ex post facto*. That violates the most fundamental legal principle: *nullum crimen sine lege*.

  **ELENA:** *Nullum crimen* guards against arbitrariness. But when the law *exists* – in custom, in the shared understanding of civilized nations – declaring it isn't arbitrary. It’s a necessary function of justice when faced with unprecedented evil. To say that no tribunal could ever adjudicate such acts because no specific statute existed beforehand would render international law perpetually impotent against the worst atrocities. Justice cannot be held hostage by the evader’s shield of technicality.

  **MARKO:** It’s not merely technicality, Elena. It’s legitimacy. And here lies a profound difficulty of self-presentation for *this* tribunal, just as it was for Nuremberg. To the defeated, sitting in the dock, it will inevitably look like victor's vengeance. To counter that, the tribunal must claim it is merely applying pre-existing law – "we are not punishing you for *our* new rules, but for violating rules *you* were always bound by." Yet, simultaneously, for the *future*, for its enduring value as precedent, the tribunal must claim it is *establishing* law – "this judgment binds *all* future leaders, setting a new standard." The more strenuously it claims the first, the weaker its claim as precedent; the more it embraces the second, the more it admits the defendants faced retroactive law. It cannot credibly assert both with equal force.

  **ELENA:** That tension is real, Marko. I won't deny it. But declaring custom *is* how law develops and binds the future. By articulating what was implicit, the tribunal *both* applies existing principle *and* clarifies it for future application. The precedent derives its force *from* the fact that it rests on pre-existing norms, not from the tribunal's fiat alone. It lays bare a truth already latent in the legal order.

  **MARKO:** A truth laid bare by the victors, Elena. The bench is appointed by the coalition. The charter is drafted by the coalition. The choice of charges – which atrocities to prosecute, whose aggression is deemed criminal – is made by the coalition. And let us be brutally honest: our own coalition powers have, in living memory, engaged in actions that could plausibly be argued to resemble aggressive intervention or caused significant civilian suffering. Are we truly impartial lawmakers? Or are we crafting rules that conveniently target the enemy while leaving our own actions unscrutinized? A frank political reckoning, calling it what it is – victor's justice – might at least be honest.

  **ELENA:** (Sighs deeply) Honest, perhaps, but ultimately destructive. That path leads straight to the summary execution wall. The *legal form* is not a cynical veneer; it is the essential constraint. It forces the victors to articulate charges based on *principles*, not just grievances. It compels evidence, procedure, defense – however imperfect. It demands a reasoned judgment based on law, not just power. This process, this *record* created under the banner of law, is what separates retribution from justice. It creates a document that can outlast the passions of victory, that future generations – including citizens of the victorious powers reflecting on their *own* actions – can use to hold *all* power to account. Nuremberg’s record stands, even as the Soviet judges' own crimes later came to light. The law declared there constrained even its flawed authors, eventually. Without that form, we have only the ephemeral justice of the sword.

  **MARKO:** I concede the power of the record. And I concede that the legal form *can* elevate the process above mere bloodletting. But Elena, my core objection remains: even if the *prohibitions* existed in the abstract for states, the leap to *individual criminal liability* before an *international tribunal* for aggression was a quantum leap not supported by pre-existing, clearly ascertainable custom or treaty. You speak of ‘crystallization,’ I see legislation. The tribunal acted *as if* that liability existed, knowing it was necessary, but in doing so, it violated *nullum crimen* as I understand it – not as a technicality, but as a bulwark against arbitrary power. Can you honestly point to unambiguous state practice *before* 1945 trying individuals internationally for waging aggressive war? Not reprisals, not executions by domestic courts under new regimes, but *international criminal adjudication*?

  **ELENA:** Unambiguous? No, Marko. Not unambiguous. The practice was nascent, the recognition evolving. Prosecutions were novel. But the *principle* that launching aggressive war was an international wrong of the highest order was established. The attribution of responsibility to the architects, not just the foot soldiers, flowed logically from the nature of the crime – the state acts through individuals. Was it a bold step? Undoubtedly. Was it *legislation*? I maintain it was the necessary *judicial recognition* of a legal reality made horrifically manifest. To wait for a treaty signed by aggressors outlawing their own actions would be to wait forever.

  **MARKO:** And there, Elena, we find the irreducible core of our disagreement. It is not merely about the historical content of customary law in 1939 or 1941, though we parse the sources differently. It is fundamentally about the *concept of law* and the permissible role of a tribunal. You believe that in the face of supreme evil, courts can and must recognize latent principles inherent in the international order, even absent clear positive enactment, and that doing so is declaratory, not legislative. You see *nullum crimen* as flexible enough to accommodate the crystallization of profound custom through adjudication.

  **ELENA:** Yes. And you?

  **MARKO:** And I believe that individual criminal liability, especially for acts of state, requires the clearest possible positive foundation – treaty or unambiguous, widespread state practice expressly acknowledging such liability – *before* the act. Without that, the tribunal crosses the line from applying law to making it, violating legal certainty and opening the door to victor’s law cloaked in judicial robes. I see *nullum crimen* as a rigid barrier against retroactive criminalization, essential for fairness and the rule of law itself. For me, the absence of pre-war trials for aggression is not evidence of latent law waiting to be recognized, but evidence of its absence.

  **ELENA:** So, we disagree on the nature of customary law’s evolution, the scope of *nullum crimen*, and the adjudicative function in extreme cases.

  **MARKO:** Precisely. For us to converge, Elena, you would need to concede that the leap to *individual criminal liability* for aggression required a clearer foundation in pre-existing positive sources than existed, making Nuremberg, however necessary politically and morally, an act of retroactive legislation in that specific regard. You would need to accept that the tribunal *did* make new law on that charge, even if only out of dire necessity.

  **ELENA:** And you, Marko, would need to concede that the evolution of customary law can sometimes be accelerated and crystallized *through* such adjudication in response to fundamental violations, and that the principle against retroactivity, while paramount, might yield in the face of crimes so egregious that their criminality was already implicit in the international legal order, even if the specific procedural mechanism was novel. You would need to accept that declaring such law *can* be a legitimate judicial function when confronting unprecedented evil, not merely legislative usurpation.

  *(A long silence hangs in the dusty air. They look at each other, then back at the draft charter.)*

  **MARKO:** I cannot make that concession, Elena. The slope is too slippery. The risk to the accused is too great. The victor's temptation too strong.

  **ELENA:** And I cannot make yours, Marko. To do so would render justice perpetually unable to confront new forms of barbarity until after they have been perfected and repeated. It would leave the law paralyzed.

  **MARKO:** Then it seems we draft a charter knowing our disagreement runs to the foundations. We must hope the judges navigate this tension with more wisdom than we possess.

  **ELENA:** Or perhaps, we draft it hoping the law declared will, over time, prove its own legitimacy – both as a record of past wrongs and a shield for the future – in ways our arguments tonight cannot finally resolve.

  *(They turn back to the document, the weight of history and the uncertainty of the future heavy upon them.)*
