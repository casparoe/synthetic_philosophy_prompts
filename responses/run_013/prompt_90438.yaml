  Okay, let me tackle this novelist's query. They're writing a book about academics debating language origins—adaptation vs. byproduct—and want the real arguments, not pop-science versions. Specifically, they need the spandrels critique applied to this debate, plus weaknesses in that critique when aimed at language. 

  First, I need to unpack the spandrels paper properly. Gould and Lewontin weren't just complaining about storytelling—they were attacking the adaptationist program's core methodological flaws: conflating current function with evolutionary origin, ignoring alternative explanations (like developmental constraints), and treating every trait as if it were an optimal design solution. For language, this means Pinker and Bloom's adaptationist stance would need to demonstrate specific selective pressures for linguistic features, not just current utility.

  But the novelist also wants the critique's weak spots. Language is a tough case for spandrels because it's so complex and universal—Gould's architectural metaphor (where spandrels are necessary byproducts of pillars/arches) doesn't neatly fit. Chomsky's "third way" (language as computational byproduct of brain expansion) isn't truly a spandrel; it's more like an exaptation hijacked later. And the byproduct view has its own testability problem: if you claim language emerged from general intelligence without selection, how do you prove no selection occurred? 

  The key tension: adaptationists need evidence of gradual selective pressures shaping language (like FOXP2 gene studies or universals in child acquisition), while byproduct advocates must explain complexity without selection (which risks being unfalsifiable). Pinker and Bloom's strongest card is language's intricate design—could random byproduct really produce that? But Gould would counter that complexity can emerge from structural constraints too.

  For the verdict—the spandrels critique is absolutely a valid methodological warning against lazy storytelling, but as a mood, it risks dismissing real adaptations. In the novel's debate, neither academic should "win": the adaptationist might lean too hard on just-so stories, while the byproduct advocate might handwave testability. The surviving insight is that both approaches must engage with evidence—fossils, genetics, development—not just rhetoric. The metaphor holds if we remember actual spandrels became canvases for art: language could be both architectural necessity and later adaptation.
answer: |-
  Here's the conceptual mapping you need for your academic showdown, stripped of oversimplification and grounded in the actual arguments:

  ### The Spandrels Critique (Gould & Lewontin) Applied to Language Adaptationism
  1.  **What Adaptationism is Accused Of:**
      *   **Pan-selectionism:** Treating *every* feature of an organism as an *adaptation* honed by natural selection for its current function. The core sin is assuming selection is the *only* significant evolutionary force.
      *   **Conflation of Current Utility vs. Origin:** Assuming that because a trait *is now* useful (e.g., communication), that usefulness *explains its origin*. This ignores the possibility the trait arose for other reasons (or no reason at all) and was later co-opted (exapted).
      *   **Just-So Stories:** Constructing plausible, often ingenious, selective scenarios (e.g., "Language evolved for detailed hunting plans") that are *untested or untestable*. These stories often mistake plausibility for proof and ignore alternative explanations.
      *   **Atomization:** Breaking down complex, integrated systems (like the human mind/brain) into discrete "traits" (like "grammar module") and inventing separate selective histories for each, ignoring developmental and architectural constraints that produce integrated wholes.
      *   **Ignoring Constraints:** Downplaying the role of non-selective factors: phylogenetic history (what structures were already present?), developmental pathways (how does the embryo build the brain?), physical laws, and architectural necessity (the spandrels themselves).

  2.  **Aimed at Pinker & Bloom (P&B) on Language:**
      *   The critique charges P&B with assuming language's complexity *must* be a direct product of selection for communication, ignoring that:
          *   Its core computational properties (e.g., recursion) might arise as byproducts of general brain expansion or computational efficiency constraints.
          *   Its universality and complexity might stem from developmental programs building large brains, not specific selection for linguistic communication.
          *   Their arguments for specific selective pressures (e.g., social gossip, technical planning) are often speculative just-so stories lacking direct evidence linking *specific* linguistic features to *specific* fitness advantages in ancestral environments.
          *   They potentially atomize language into sub-components (e.g., syntax module) and invent separate selective histories.

  ### Pushing Back: Where the Spandrels Critique Gets Shaky on Language
  1.  **"Language as Byproduct of General Intelligence" - Is it a Spandrel?**
      *   **Not Strictly Gouldian:** Gould's spandrels are *necessary architectural byproducts* of building something else (e.g., the space between pillars and an arch). "General intelligence" is vague.
      *   **It's More Like a Non-Adaptive Byproduct or Exaptation:** The claim is closer to saying language emerged *because* we have big, complex brains selected for general problem-solving (e.g., toolmaking, social navigation), and language is a computational capability that "came along for the ride." It wasn't *shaped* by selection *for communication*; it's a lucky accident. This is distinct from a spandrel, which is structurally unavoidable. This view struggles mightily with language's *specific*, intricate, and *dedicated* design for communication.
      *   **The Testability Problem:** Proving a negative ("Selection did *not* shape this") is notoriously hard. How do you empirically distinguish a complex system that *looks* designed by selection but *isn't* (pure byproduct) from one that *was* designed by selection? The byproduct view risks being unfalsifiable – any evidence of function can be dismissed as "exaptation of a byproduct."

  2.  **Chomsky: A Third Position?**
      *   **Yes, Distinct.** Chomsky often argued language (specifically the computational faculty, FLN - Faculty of Language Narrow) is *not* an adaptation *for communication* at all. He saw it as:
          *   A unique, innate computational system (merge/recurison) arising from unknown, possibly even non-Darwinian (e.g., physical/structural constraints of neural organization) evolutionary events.
          *   Or, a minimal computational system that emerged *as a computational efficiency* within a large brain *selected for other reasons*, and was later *exapted* for communication. This is closer to the byproduct view but emphasizes the *specificity* and *uniqueness* of the core computational mechanism over vague "general intelligence."
      *   **Key Difference:** Chomsky downplays the role of selection in shaping the *core mechanism* itself, focusing on its abstract computational nature. He separates the computational faculty (FLN) from its externalization (speech/sign) and conceptual systems (FLB - Faculty of Language Broad), which may have more complex evolutionary histories.

  3.  **What Pinker & Bloom Need to Show (For Adaptationism to Hold Water Against the Critique):**
      *   **Evidence of Specific Design:** Demonstrate that language exhibits "good engineering" solutions to *specific adaptive problems* of communication or information processing that would have conferred fitness advantages. (P&B argue its complexity, universality, and learnability fit this).
      *   **Gradual Adaptive Scenarios:** Plausible pathways showing how proto-language features (e.g., simple symbols, combinatorial rules) could have been selected for incrementally. (They emphasize the Baldwin effect and continuity with animal communication).
      *   **Comparative Evidence:** Find homologous or analogous traits in other species showing precursors under selection. (e.g., FOXP2 gene, primate intentional communication, vocal learning in birds).
      *   **Evidence Against Alternatives:** Show that explanations invoking only general intelligence or unavoidable byproducts *cannot* account for the specificity, efficiency, and universality of linguistic design.
      *   **Avoid Just-So Stories:** Ground their scenarios in paleoanthropology, cognitive archaeology, and formal models of selection. Show how specific linguistic features solve specific problems faced by hominins.

  4.  **The Byproduct View's Testability Problem:**
      *   **As Above:** Its core weakness is the difficulty of falsification. How do you prove selection *didn't* play a role? Reliance on correlations with brain size or general cognitive abilities is vulnerable to the counter-argument that the correlations exist *because* language was under selection *as part of* the package driving brain expansion. Demonstrating that a complex, functional trait *lacks* any history of selection is arguably harder than demonstrating it *has* one.

  ### Verdict on the Episode: Spandrels Critique - Constraint or Mood?
  *   **It's a Vital Methodological Constraint:** Gould & Lewontin successfully exposed real flaws in lazy adaptationist reasoning: the rush to invent stories without considering alternatives or constraints, the conflation of current utility with origin. This is a *mandatory* corrective. Any serious adaptationist hypothesis *must* grapple with these criticisms by considering non-selective factors and rigorously testing its scenarios. It forces better science.
  *   **But it's Not a Falsifiable Theory Itself, and Can Become a "Mood":** The *strong* version of the critique ("adaptationism is fundamentally flawed and rarely correct") is itself not a testable hypothesis. It risks becoming a dogma that dismisses *any* complex functional trait as likely a spandrel or byproduct by default, potentially ignoring compelling evidence of selection. This "mood" can be as limiting as pan-selectionism. The critique is powerful for *procedures* (demanding rigor and alternatives), but weak as a *positive claim* about the prevalence of spandrels/byproducts.
  *   **What Survives the Collision in Your Scene:**
      *   **From Spandrels:** The *necessity* of considering alternatives to pure selection (constraints, byproducts, exaptation), the danger of uncritically accepting plausible just-so stories, and the importance of developmental and architectural explanations. Adaptationists *must* address these points.
      *   **From Adaptationism:** The sheer *functional complexity*, *universality*, and *efficiency* of language as a communication system remains its strongest argument against being *just* a byproduct. The burden of proof *is* high for the byproduct view to explain this without any selection. Evidence like FOXP2 (though complex) suggests *some* selection was involved.
      *   **The Irreducible Tension:** There's no knockout blow. The debate hinges on the *weight* given to different types of evidence (complexity vs. developmental constraints, universality vs. uniqueness) and fundamental perspectives on how evolution builds complexity. Chomsky adds a further layer by questioning whether selectionist logic even applies to the core computational mechanism.

  **The Dramatic Takeaway for Your Novelists:** Their argument shouldn't end with one winning. It should reveal the *depth* of the problem. The Gould/Lewontin character forces the Pinker/Bloom character to be more rigorous and less story-driven. The Pinker/Bloom character forces the Gould/Lewontin character to confront the staggering functional design of language that seems to scream "adaptation," making a *pure* byproduct view feel inadequate. The Chomskyan perspective (if you introduce it) throws a wrench into both, suggesting the question might be framed wrong. The enduring power of the debate lies in this unresolved tension between the compelling evidence of design and the powerful logic of constraint.
