prompt: |-
  I'm putting together a seminar for next term on group-based preference in selection -- admissions, hiring, board seats, the odd legislative seat -- and I want to stop running it as a tour of cases. What I want to hand them in week one is the spec instead: what does any theory of when it's permissible to give a preference to someone because of their group membership actually have to deliver? Not a defense of one family of views, the requirements list.

  So write me that. Give me the desiderata, and for each one the case or consideration that puts it on the list, so none of them look like something I made up over coffee. And I want the criteria to be doing the work here, not a scorecard -- you can wave at the main families at the end (compensation for past wrongs, diversity, role-model arguments, equality of opportunity, anti-subordination, plain old distributive fairness) but I don't want a tournament, I want the standard.

  Three cases have to come out right, and they're not the same shape, which is the point: race-conscious admissions at US universities; the Indian reservation system, with its separate buckets for Scheduled Castes, Scheduled Tribes and Other Backward Classes, and the long fight over the creamy layer and over extending it to promotions; and Norway's 40% boardroom rule for public companies (recently pushed out to the private ones too). If a requirement only earns its keep on one of those and quietly falls over on the others, say so.

  Some things I want you to sort out, and I'll be annoyed if you just list them as separate desiderata without noticing they pull against each other. The distinction between a policy that changes who ends up in the comparison pool and one that changes how the comparison is made once you're in it -- I have a hunch half the usual desiderata are really about the second and people smuggle in the first without saying so, so tell me if that's right. The levelling-down worry: whatever the theory demands, it had better not be satisfiable by making everyone worse off. The quota-versus-target thing, and whether "flexible goal" is a real third category or a fig leaf. Whether the good being distributed has to be to the group or to individuals, given that the cost, when there is one, lands on individuals. The innocent third party who loses the seat and did nothing wrong, and the equally innocent beneficiary who did nothing to earn the preference. Sunset: is a theory that can never tell you when the preference has done its job actually a theory of anything, or is "temporary" part of the concept. And a requirement that the theory not contradict the boring empirical stuff we actually know about how selection works -- test scores, mismatch worries, what the applicant pool even looks like before anyone gets compared to anyone.

  Then, and this is the part I most want: flag any pair or triple of desiderata you think can't be jointly satisfied, and say which one you'd give up and why. And tell me which single requirement knocks out the most candidate theories -- I'll bet it isn't the one my students expect.

  Don't give me citations or a reading list, I'll fill that in myself. And keep it in prose, a table is fine if it's genuinely clearer.
reasoning: |-
  Hmm, the user is asking for a set of desiderata for theories of group-based preference in selection contexts. They want criteria that any such theory must satisfy, not a defense of specific views. The focus is on what makes a theory viable, using real-world cases like US affirmative action, India's reservation system, and Norway's boardroom quotas to test them.

  The user has several specific concerns to address. They want me to distinguish between policies that change the applicant pool versus those that change selection criteria - this seems important because confusion here might lead to smuggling in assumptions. There's also the levelling-down problem where a theory shouldn't allow making everyone worse off just to achieve equality. Quotas versus targets needs clarification, and whether "flexible goals" are meaningful. I need to consider whether benefits go to groups or individuals, given costs fall on individuals. Both the innocent loser and innocent beneficiary raise fairness questions. Sunset clauses are crucial - if a preference can't end, is it really a theory? And the theory must align with empirical realities of selection processes like test score validity or mismatch effects.

  The user wants me to identify conflicts between desiderata and suggest which to prioritize. They also want to know which single requirement eliminates most theories - likely something unexpected.

  I'll structure this with 11 core desiderata, each explained through the three key cases. For conflicts, I'll highlight major tensions like individual vs. group benefit, innocence concerns, and sunset requirements. The empirical grounding requirement might be the most theory-knocking one since many idealistic theories ignore real-world selection mechanics.

  The cases are diverse: US admissions is about educational diversity with individual costs; India's system tackles historic injustice with group-based quotas affecting government jobs and promotions; Norway's rule is about gender representation in corporate leadership with minimal individual cost. This variety will help stress-test the desiderata.

  For each desideratum, I'll explain why it's necessary using concrete case references. For conflicts, I'll be honest about trade-offs - like how sunset requirements clash with the permanence implied by some group-based justice claims, suggesting we might prioritize anti-subordination. Or how innocence concerns might be secondary to correcting systemic wrongs.

  The empirical requirement could eliminate many theories because it forces engagement with how preferences actually function in competitive selection - things like pool composition effects or credential signaling that theorists often overlook.
answer: |-
  Here are the core desiderata for any theory justifying group-based preferences in selection, derived from the necessary work such theories must perform and stress-tested against your three paradigmatic cases. Each requirement is grounded in a specific problem it must solve, illustrated by the cases. Conflicts and trade-offs are explicitly flagged.

  ### Core Desiderata

  1.  **Address a Cognizable Harm or Deficit:** The theory must identify a specific, significant harm suffered by the group (e.g., historical discrimination, systemic exclusion, structural disadvantage) or a specific deficit in the selection context (e.g., lack of diverse perspectives, representation failure) that the preference aims to remedy or counteract.
      *   *Why it's needed:* Without this, preferences appear arbitrary or nakedly political. The "harm/deficit" defines the problem space.
      *   *Cases:* US Admissions (systemic exclusion, lack of diversity); Indian Reservation (centuries of caste oppression, exclusion); Norway Board Rule (systemic underrepresentation, potential for groupthink, lack of diverse perspectives in governance).
      *   *Earns Keep On:* All three. Failure here fundamentally undermines justification.

  2.  **Establish a Plausible Causal Link:** The theory must demonstrate a plausible causal connection between group membership and the identified harm/deficit *in the specific selection context*. It must also show that granting the preference *directly addresses* that link.
      *   *Why it's needed:* Prevents irrelevant or overly broad group classifications. Ensures the preference *works* on its own terms.
      *   *Cases:* US Admissions (link between race & systemic barriers/educational diversity); Indian Reservation (direct link between caste/tribe identity & historical/current oppression); Norway Board Rule (link between gender & systemic barriers to board positions/benefits of gender diversity). A theory failing here might justify preferences based on irrelevant group traits.

  3.  **Specify the Beneficiary & Benefit Mechanism:** The theory must clearly define *who* benefits (specific individuals, the group as a whole, society) and *how* (direct access, symbolic recognition, altering institutional culture, redistributing power).
      *   *Why it's needed:* Avoids vagueness and clarifies the intended outcome. Distinguishes between individual advancement and group/sub-group empowerment.
      *   *Cases:* US Admissions (benefits individuals & enhances campus diversity/society); Indian Reservation (aims at group/sub-group advancement/empowerment, benefits individuals within groups); Norway Board Rule (benefits qualified women individuals, alters corporate culture/society).
      *   *Earns Keep On:* All three, but mechanisms differ. **Conflict Warning:** Theories emphasizing *group empowerment* (India) vs. *individual opportunity/societal good* (US, Norway) can pull against each other regarding targeting and benefit measurement.

  4.  **Define the Burden & Its Justification:** The theory must identify who bears the cost (specific individuals passed over, society, institutions) and justify why *this burden* is permissible or necessary to address the harm/deficit.
      *   *Why it's needed:* Directly confronts the "innocent loser" problem. Requires acknowledging the cost and providing a moral/pragmatic reason for imposing it.
      *   *Cases:* US Admissions (burden on high-scoring non-preferred applicants; justified by societal/educational necessity); Indian Reservation (burden on non-reserved category applicants; justified by compensatory justice/group empowerment); Norway Board Rule (relatively low burden on current board members/shareholders; justified by diversity benefits/equity). The justification must fit the burden's scale. **Conflict Warning:** Justifying large burdens (India) requires stronger claims (e.g., compensation) than smaller burdens (Norway).

  5.  **Resolve the "Double Innocence" Problem:** The theory must address the fact that both the beneficiary (who didn't personally cause the harm) and the burdened individual (who didn't personally commit the wrong) are often "innocent" in the direct sense.
      *   *Why it's needed:* A core fairness challenge. Theories relying solely on individual culpability founder here.
      *   *Cases:* Central to all three. Solutions include: focusing on *current* systemic barriers (US, Norway), group-based historical entitlement/repair (India), or societal benefits outweighing individual costs.
      *   *Earns Keep On:* All three equally. Failure here is fatal for most theories. **Trade-off:** Often requires balancing individual fairness against group/sub-group justice claims.

  6.  **Avoid Leveling Down:** The theory must not be satisfiable by making everyone worse off relative to a scenario where the harm/deficit is addressed without leveling down. It must aim for a net improvement or genuine remediation.
      *   *Why it's needed:* Prevents perverse outcomes where "equality" is achieved through universal detriment, violating the purpose of addressing the harm/deficit.
      *   *Cases:* A purely numerical quota without regard to minimum qualifications risks leveling down (e.g., unqualified board members harming the company). Theories must require that beneficiaries are qualified/suitable.
      *   *Earns Keep On:* Critically important for Norway (board competence) and US (academic standards), less often a *practical* issue in India's large-scale govt. recruitment but still a theoretical requirement. **Conflict Warning:** Can clash with strict quotas if qualified candidates from the preferred group are scarce.

  7.  **Specify the Selection Mechanism & Flexibility:** The theory must justify *how* the preference is applied (quota, plus factor, tie-breaker, target, separate track) and the degree of flexibility. It must explain why *this mechanism* is appropriate given the harm/deficit and context.
      *   *Why it's needed:* "Changing the pool" (recruitment, outreach) vs. "changing the comparison" (scoring adjustments, quotas) have different implications for fairness, effectiveness, and burden. "Flexible goals" must be distinguished from quotas (binding) and mere aspirations.
      *   *Cases:* US Admissions (flexible holistic review, "plus factor" - changes comparison); Indian Reservation (strict quotas in separate buckets - changes pool/comparison structure); Norway Board Rule (strict quota - changes outcome mandate). A theory demanding absolute quotas must justify rigidity; one endorsing flexibility must show it's sufficient. "Flexible goals" are only meaningful if tied to consequences for non-achievement.

  8.  **Require Empirical Plausibility:** The theory's assumptions about how selection works (e.g., predictive validity of metrics, effects of mismatch, pool composition dynamics) and the likely effects of the preference must align with known social science and operational realities.
      *   *Why it's needed:* Prevents theories built on sand. If a theory requires that preferences *never* cause mismatch or *always* identify equally qualified candidates, it fails against evidence.
      *   *Cases:* US Admissions (mismatch debate, test score validity, holistic review complexity); Indian Reservation ("creamy layer" exclusion shows awareness of intra-group heterogeneity & privilege); Norway Board Rule (assumption qualified women exist, impact on governance studied). **Conflict Warning:** Can clash with strong compensation theories that prioritize group membership over individual readiness metrics.

  9.  **Define Success Metrics & Sunset Conditions:** The theory must specify what success looks like and the conditions under which the preference is no longer needed or justified (even if temporary status isn't inherent).
      *   *Why it's needed:* Without this, preferences become perpetual entitlements detached from their original justification. "Temporary" is often a pragmatic/political claim, but a theory needs *some* endpoint logic. Forces focus on outcomes, not just inputs.
      *   *Cases:* US Admissions (diversity goal is ongoing, but specific racial classifications face sunset pressure); Indian Reservation (sunset debated endlessly; "creamy layer" and review mechanisms are partial proxies); Norway Board Rule (rule might sunset if parity is sustained organically). **Conflict Warning:** Clashes fundamentally with theories based on permanent group entitlements (some strong compensation/sub-group views) or with harms perceived as enduring (systemic racism). **Trade-off:** Prioritizing sunset (e.g., for individual fairness) vs. acknowledging enduring structural issues.

  10. **Avoid Perpetuating Harmful Stereotypes or Stigma:** The theory must show that granting the preference does not reinforce negative stereotypes about the beneficiary group's capabilities or create stigma associated with receiving the preference.
      *   *Why it's needed:* Prevents solving one harm by creating another (e.g., "tokenism," assumption of lower competence).
      *   *Cases:* Risk in all three. US Admissions (stigma of "not meriting place"); Indian Reservation ("reservation candidate" stigma); Norway Board Rule ("token woman" perception). A theory must mitigate this risk (e.g., ensuring beneficiaries are qualified, focusing on group contribution, not deficiency).

  11. **Maintain Institutional Legitimacy & Social Cohesion (Contextually):** The theory must be implementable without destroying the perceived fairness of the selection process or causing unacceptable social division *within the specific societal context*. This includes respecting constitutional/legal constraints.
      *   *Why it's needed:* A preference that destroys faith in admissions, hiring, or governance fails pragmatically and morally if its net effect is corrosive.
      *   *Cases:* US Admissions (intense legal/political battles over legitimacy); Indian Reservation (social tensions, creamy layer debates address internal legitimacy); Norway Board Rule (generally high legitimacy in Norwegian context, less controversy).
      *   *Earns Keep On:* Highly context-dependent. Less critical for Norway than US/India currently. **Trade-off:** Can pull against strong compensatory justice demands that may inherently challenge dominant group notions of "fairness".

  ### Key Conflicts and Trade-offs: Which to Prioritize?

  1.  **Group Empowerment vs. Individual Fairness (Desiderata 3 & 5):** Theories prioritizing group-level repair/sub-group advancement (strong in India) inherently create tension with individualist notions of merit and the "innocent loser." **Priority:** Contextual. In contexts of severe, identity-based historical oppression (India), group claims may outweigh strict individual fairness in competition. In contexts seeking diversity or correcting current barriers (US, Norway), balancing individual fairness is paramount.
  2.  **Sunset vs. Enduring Structural Harm (Desiderata 9 vs. 1/2):** Demanding a clear sunset clashes with theories addressing harms seen as deep-rooted and potentially permanent features of the social structure (e.g., systemic racism, casteism). **Priority:** **Sunset principle should be prioritized.** Even theories addressing deep structures must define *what measurable change* would reduce the need for the preference. Perpetuity negates accountability. Mechanisms like India's regular reviews are a pragmatic compromise.
  3.  **Empirical Plausibility vs. Idealized Compensation (Desiderata 8 vs. Strong Versions of 1):** Theories demanding strict proportional representation regardless of current pool qualifications or mismatch effects clash with operational realities. **Priority:** **Empirical Plausibility must win.** A theory that ignores how selection actually works or the potential negative consequences for beneficiaries is irresponsible and unsustainable. Compensation must be balanced with realism (e.g., India's creamy layer, focus on qualified candidates in Norway/US).
  4.  **Avoiding Stigma vs. Effectiveness (Desiderata 10 vs. Mechanism in 7):** Strong preferences (like quotas) are often more effective but carry higher stigma risks. Weaker preferences (like outreach) carry less stigma but may be ineffective. **Priority:** **Context and Implementation matter most.** Ensure beneficiaries are demonstrably qualified (avoids competence stigma) and frame the preference based on contribution/diversity/repair, not group deficiency. Norway's quota likely works partly because qualified women *exist*; the rule accelerates their selection.

  ### The Requirement That Knocks Out the Most Theories

  **Empirical Plausibility (8).** Many attractive philosophical theories (especially pure compensation, some strong diversity claims, or idealized distributive fairness) founder on the rocks of reality. They often assume:
  *   Perfectly meritocratic baselines that don't exist.
  *   That "qualification" is objective and singular.
  *   That preferences don't create adverse effects like mismatch or stigma.
  *   That the applicant pool is static or easily malleable.
  *   That group identity cleanly maps onto the harm/deficit in every selection instance.

  Theories that cannot incorporate the messy realities of selection processes, human capital development, unintended consequences, and the complexity of measuring both harm and remedy are the most likely to be non-starters in practice, regardless of their internal moral coherence. Students often expect "Double Innocence" or "Leveling Down" to be the biggest hurdles, but those are usually addressed *within* viable theories (even if imperfectly). A theory fundamentally at odds with how institutions and selection actually work cannot be implemented effectively or ethically.

  This framework provides the "spec sheet." Any theory must credibly engage with *all* these demands, even if it prioritizes some over others or offers compromises. The three cases demonstrate how different theories succeed or struggle on different points, highlighting that there is no single, universally dominant approach, only contextually viable ones that meet most of the core requirements.
