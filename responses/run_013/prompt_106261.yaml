prompt: |-
  ok so i've been going down a rabbit hole on Goodhart's law and i want to actually use it on a real case instead of the soviet nail factory story everyone tells. take the body-count metric from the Vietnam war -- McNamara and the whiz kids wanted a single number for progress, the weekly counts kept climbing, the kill ratios looked great, and the war kept getting worse. what i want is a real mapping, not vibes: what was the actual goal here (whatever that even means), what was the proxy, who was doing the optimizing and against what incentive, and then walk the whole thing through a taxonomy i keep seeing float around the alignment corner of the internet that splits Goodhart into four flavors -- (1) the proxy is just a noisy measure of the goal, so selecting on it selects for the noise and overshoots; (2) the proxy tracks the goal fine in the normal range but goes weird out at the extremes; (3) the correlation holds when you just observe, but breaks the moment you intervene on the proxy directly; (4) somebody actively games the number. for each of the four, say whether body count is a genuine instance, and if so what the exact mechanism is -- don't just assert it, show the gears.

  then flip it. what does this case show about the taxonomy that the nail factory doesn't? does it put pressure on any of the four categories, or on the assumption that they're cleanly seperable? be honest about where the theory just goes silent -- e.g. about whether "winning" was even a single thing you could have had a metric for in the first place, or whether some of the failure was that the metric was measuring the wrong object entirely rather than being gamed or overshot. and where the case doesn't fit any of the four cleanly, say so instead of forcing it in. no need for citations, just reason it out.

  lead with your bottom line in the first sentence, then the reasoning. no preamble, and don't restate the question.
