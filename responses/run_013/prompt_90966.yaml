answer: |-
  ### Final Exam Essay Question  
  **Sunk Costs and Cost-Contingent Continuation Policies**  
  A "cost-contingent continuation policy" (CCCP) is any rule making continued investment in a project conditional on cumulative past spending (e.g., "fund this project only if we have spent at least $X"). While sunk costs are causally and informationally irrelevant to future payoffs in standard rational choice models, CCCPs are empirically common. Using this term, rigorously separate three rationales for CCCPs:  
  (a) The **fallacious rationale**: Treating past expenditure *itself* as a reason to continue.  
  (b) The **strategic commitment rationale**: Adopting a CCCP *in advance* to alter incentives (yours or others’).  
  (c) The **epistemic heuristic rationale**: Using a CCCP under uncertainty about the decision problem’s structure.  

  **Your essay must**:  
  1. Distinguish (a), (b), and (c) with clear examples.  
  2. For (b) and (c), specify what conditions must hold for the rationale to be genuinely rational (not a post-hoc rationalization).  
  3. Construct an original scenario where a CCCP is rational **even though past spending is causally and informationally irrelevant to future payoffs**. Explain why rationality holds despite irrelevance.  

  ---

  ### Model Answer (Approx. 600 words)  
  **Distinguishing Rationales for Cost-Contingent Policies**  
  A cost-contingent continuation policy (CCCP) ties ongoing investment to sunk costs, creating tension with rational choice axioms. Each rationale—fallacious, strategic, or heuristic—operates on distinct premises.  

  **(a) The Fallacious Rationale** arises when an agent directly treats sunk costs as recoverable or relevant to future outcomes. For example, a manager persists with a failing $10M software project because "we’ve spent too much to quit," ignoring that future costs exceed expected benefits. This violates rational choice: sunk costs are irrevocable and should not influence marginal decisions.  

  **(b) Strategic Commitment Rationale** justifies CCCPs as pre-commitment devices that modify incentives. Consider a startup securing venture capital by pledging: "We abandon the project if R&D spending exceeds $5M without a prototype." Here, the CCCP is chosen ex ante to signal discipline to investors, reducing moral hazard (e.g., frivolous spending). For this to be genuinely rational, two conditions must hold:  
  - **Incentive compatibility**: The policy must credibly constrain future behavior (e.g., investors withdraw if the rule is violated).  
  - **Ex ante optimality**: The expected value of binding future selves/partners must outweigh flexibility costs. If these fail, the CCCP is mere rationalization (e.g., a manager citing "investor expectations" without real penalties).  

  **(c) Epistemic Heuristic Rationale** applies when agents face uncertainty about the decision structure. Suppose a pharmaceutical firm uses a CCCP: "Continue drug trials if past spending exceeds $2M." This may be rational if the firm is uncertain whether project difficulty is "low" (solvable with moderate investment) or "high" (insolvable). Past spending *correlates* with unobserved difficulty: high spending suggests high difficulty, making abandonment prudent. Crucially, this requires:  
  - **Structural ignorance**: The agent lacks knowledge of key parameters (e.g., true success probability).  
  - **Cost as a signal**: Sunk costs must statistically correlate with unresolved uncertainty (e.g., spending and difficulty are positively linked). If costs are uninformative (e.g., spending is always wasted), the heuristic collapses into fallacy.  

  **Rational CCCP Despite Irrelevance**: Imagine a government auctioning mining rights in a region with unknown reserves. Bidders adopt a CCCP: "Bid only if cumulative exploration costs exceed $1M." Past spending is *causally irrelevant* (it doesn’t affect reserves) and *informationally irrelevant* (reserves are fixed but unknown; spending reveals nothing). Yet this CCCP is rational as a strategic commitment: it deters frivolous bidders who lack serious intent. By conditioning entry on sunk costs, credible bidders reduce competition, raising their expected payoff. The irrelevance of past spending is immaterial—the policy’s value lies in altering *other agents’ behavior* ex ante.  

  **Conclusion**: CCCPs are fallacious only when past costs directly justify continuation (a). They become rational under (b) as commitment devices (requiring incentive alignment) or (c) as heuristics for structural uncertainty (requiring informative costs). Even with irrelevant sunk costs, rationality can emerge from the policy’s *preventative* effect on incentives.  

  ---

  ### Marking Scheme  
  **A-Grade Answer (90–100%) Must Demonstrate**:  
  1. **Precise triad separation**: Clear examples distinguishing (a), (b), and (c) without conflation.  
  2. **Necessary conditions for (b)/(c)**: Explicitly states:  
     - For (b): Ex ante optimality + credible incentive modification.  
     - For (c): Structural uncertainty + sunk costs as statistical signals.  
  3. **Irrelevance-compliant scenario**: Constructs an original case where:  
     - Sunk costs are causally/informationally irrelevant (stated explicitly).  
     - Rationality derives from incentive-alignment (e.g., deterring rivals) or uncertainty mitigation.  
  4. **No conceptual errors**: Avoids conflating heuristics with fallacies or misrepresenting irrelevance.  

  **B-Grade Answer (80–89%) May Lack**:  
  1. **Full triad clarity**: Examples for (b)/(c) are underdeveloped or insufficiently distinct from (a).  
  2. **Incomplete conditions**: Omits one required element for (b) or (c) (e.g., notes "uncertainty" for (c) but omits "costs as signals").  
  3. **Weak scenario**: The constructed case either fails to establish irrelevance or ties rationality to direct payoff relevance.  
  4. **Minor errors**: E.g., Implies sunk costs can be "partially relevant" in (c) without statistical justification.  

  **Deductions for Errors**:  
  - **-20%**: Confuses (b) and (c) (e.g., labels commitment as heuristic).  
  - **-15%**: Fails to construct a scenario meeting irrelevance criteria.  
  - **-10%**: Omits conditions for (b)/(c) genuineness.  
  - **-5–10%**: Uses textbook examples (e.g., concert tickets) without original analysis.  

  **Key Differentiator**: An A answer **proves irrelevance in the scenario** while showing rationality stems from *pre-commitment or uncertainty*—never from sunk costs themselves. A B answer acknowledges irrelevance but cannot divorce the policy’s rationale from direct cost relevance.
