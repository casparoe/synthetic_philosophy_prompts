answer: |-
  ## Sestina: On the Bank

  The child thrashed. The rope hung **nothing** near.
  The water filled the widening **gap**.
  The watchers stood, a frozen **still**.
  The current pulled. There came no **wait**.
  The surface closed. The page stayed **blank**.
  No hand moved. Just a small **lapse**.

  A breath withheld became a **lapse**,
  The air itself a hollowed **nothing**.
  The ripples smoothed to featureless **blank**.
  The bank maintained its vacant **gap**.
  No rescue stirred. No saving **wait**.
  Only the water’s final **still**.

  And was the cause that dreadful **still**,
  The un-thrown rope, that vital **lapse**?
  Or just the failure to **wait**,
  The consequence of utter **nothing**,
  The manifestation of the **gap**,
  The signing of a watery **blank**?

  Consider every missing **blank**:
  The whistle silent, **still**;
  The swimmer strong who filled no **gap**;
  The slack tide’s own withheld **lapse**.
  Each absent thing – a shaping **nothing** –
  Demands its turn. Why this **wait**?

  Because a duty shaped the **wait**.
  (Here enters rule, that stark **blank**
  Filled by decree, not causal **nothing**):
  *It was hers to attend*. The **still**
  Was charged. Her standing was the **lapse**.
  The rope defined the fatal **gap**.

  Not rescue, but neglect. The **gap**
  Was contrast: *this*, not that. No **wait**
  For other might-have-beens. The **lapse**
  *Prevented the preventer*. **Blank**
  Of action held the drowning **still**.
  The chain ran through a double **nothing**.

  **Tornada:**
  The cause? The **gap**, the **nothing**? Or the rule that named the **lapse**?
  The **blank** indictment echoes in the **wait**.
  The water holds its answer, dark and **still**.

  ---

  **Prose Note:**

  The poem presumes absences *can* cause (the rope's "nothing," the "gap," the "lapse") to explore the core tension. It leans heavily on the **contrastive** view (not rescue, but neglect; the gap defined by duty) and hints at **double prevention** ("Prevented the preventer"). The normative line ("hers to attend") explicitly performs the selection work the counterfactual alone cannot, risking circularity: the rule smuggles in the very responsibility the causation is meant to ground. The conceit strains the contrastive/double-prevention positions by letting the norm bear the decisive weight of *which* absence matters. If absences **cannot** be causes at all, the poem's central mechanism – the end-words as absences *doing* causal work – collapses. In that case, the poem would have to become an elegy solely about judgment and blame, the "cause" vanishing entirely, leaving only the cold "still" and the accusing "blank" of the neglected norm. The drowning would be mere occasion, not consequence, of the omission.
