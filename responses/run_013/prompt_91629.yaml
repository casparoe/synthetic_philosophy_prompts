prompt: |-
  I cover archaeology and the history of science for a general-interest magazine, and two or three times a month I file a story in which a period label is doing the heavy lifting in the first paragraph: a manuscript find described as the last flowering of the medieval world, a set of experiments billed as the birth of modern science, a technique credited to a Renaissance rediscovery. I know these labels were coined and hardened long after the centuries they name, and that they carry a story about decline and rebirth rather than simply marking time; what I lack is a way to act on that knowledge at four in the afternoon with an editor waiting. Write me a decision procedure I can run on my own draft in a few minutes: the questions to ask about any period term, in order; what counts as a clean answer to each; when the procedure says cut the label or replace it with a plain date range; and where it stops and hands the call to me or my editor, because what is at stake there is which story we want to tell and not a fact about the past. Keep the distinction between a label used as a time-stamp and the same label used as a claim about a rupture or a cause, since that is the one my copy keeps fudging, and make the tests work when the label arrives in a researcher's press release and when it is applied to centuries outside Europe. Then run it on three cases: the medieval-world find, the same centuries called early modern in a story about South Asia, and the birth-of-modern-science framing where the framing is what makes a modest result sound important. Tell me plainly which of the three the procedure refuses to settle, and where it would give an answer I will not like. No citations or reading lists; this has to run on what a working journalist can hold in their head.
reasoning: |-
  Okay, the user is an archaeology and history of science journalist struggling with period labels in their articles. They need a quick decision procedure to evaluate terms like "medieval" or "Renaissance" when facing tight deadlines. 

  First, I should unpack their core frustration: they know these labels are retrospective constructs carrying narratives (decline/rebirth), not neutral time-stamps. But in practice, they keep blurring that line, especially when press releases use them as hooks. The real pain point is balancing historical accuracy with magazine readability under time pressure.

  Hmm, their examples reveal three key scenarios: Eurocentric periodization ("medieval world"), transplanted frameworks ("early modern" South Asia), and drama-driven narratives ("birth of modern science"). The unspoken tension here is between serving editors who want catchy hooks and their own professional integrity. 

  I'll design a four-step checklist focused on the timestamp vs. claim distinction. Step 1 must ruthlessly force specificity: "What EXACTLY does this label refer to here?" because that's where drafts fudge. The "clean answer" test needs to be brutal - no hand-waving about "general character." 

  For the transplant issue (South Asia case), the procedure must flag geographical misfits immediately. And for the hyped narrative ("birth of modern science"), I'll build in a drama detector asking if the label is doing heavy lifting for significance. 

  Ah, the trickiest part is admitting where the tool stops. The South Asia case can't be mechanically "fixed" - replacing "early modern" with dates just dodges the editorial choice about framing Indian history on its own terms. Better to be transparent that this needs human judgment. 

  Testing on their cases: The medieval manuscript passes if it's genuinely late 15th c. European. The South Asia one hits a wall - no clean answers. The science framing fails spectacularly because attaching "birth of modern" to minor experiments is exactly the sin they're committing. That last one might sting, but it's necessary medicine. 

  Final touch: emphasizing that steps 2-4 only matter if Step 1 clears the timestamp bar. No point debating rupture claims if the temporal boundaries are mush. And always defaulting to BCE/CE dates when in doubt - it's the journalist's safety net.
answer: |-
  Here’s a 4-step decision procedure designed for speed and clarity. Run it in order—**if any step fails, skip to the action**. Distinguish **TIMESTAMP** (neutral time marker) from **RUPTURE/CAUSE** (narrative claim about change).

  ---

  ### **DECISION PROCEDURE: PERIOD LABEL CHECK**
  **Ask these questions in order:**

  1.  **TIMESTAMP TEST: "Can I replace this label with BCE/CE dates *without losing essential meaning* for *this specific context*?"**
      *   *Clean Pass:* Yes, the label is *only* denoting a widely accepted time range (e.g., "18th Dynasty Egypt" = ~1550-1292 BCE; "Heian period Japan" = 794-1185 CE). **Action:** Keep if widely recognizable; replace with dates if obscure or contested *for this use*. Date range wins if unsure.
      *   *Fail:* No, the label inherently implies a *character* (medieval), *transition* (Renaissance), or *evaluation* (Dark Ages) beyond dates. **→ Proceed to Step 2.**

  2.  **RUPTURE CLAIM TEST: "Is the *claimed rupture or cause* (Revival, Birth, Decline, etc.) the *core focus* of my paragraph/story? Or is it just background?"**
      *   *Clean Pass:* Yes, the story *is fundamentally about* analyzing/reassessing that transition (e.g., a feature on competing theories for the "Scientific Revolution"). **Action:** Keep label. Proceed to Step 4 for framing check.
      *   *Fail:* No, the rupture claim is incidental background or borrowed hype. **→ Proceed to Step 3.**

  3.  **HYPE/IRRELEVANCE TEST: "Am I using this label primarily because a source (press release, paper) did, or to make the find seem more dramatic/important than it is?"**
      *   *Clean Pass:* No, the label is genuinely useful shorthand *for the time period alone* in this context, and its rupture connotations aren't driving the drama. **Action:** Replace label **with BCE/CE date range**. (e.g., "a 15th-century manuscript" not "a last flowering of the medieval world").
      *   *Fail:* Yes, the label is borrowed hype or artificially inflates significance. **Action:** **CUT the label immediately.** Replace with dates. Rewrite the hook to focus on the *actual* significance of the find/event.

  4.  **GEOGRAPHICAL/CULTURAL FIT TEST: "Does this European-derived period label *accurately and non-distortingly* fit the *specific place and society* I'm writing about?"** (Run ONLY if label passed Step 1 or 2).
      *   *Clean Pass:* Yes, it's widely accepted *by specialists* for *this* region/context *without* imposing a Eurocentric narrative (e.g., "early modern Japan" for Tokugawa period *is* standard academic framing). **Action:** Keep label. Be precise.
      *   *Fail:* No, it's a forced transplant implying European-style developments (e.g., "Medieval India," "Renaissance China"). **Action:** **CUT the label.** Replace with: 1) **Specific local period name** (e.g., "Vijayanagara period," "Ming dynasty"), OR 2) **Plain date range**, OR 3) **Neutral descriptive term** ("pre-colonial," "early imperial") *only if accurate and necessary*. **→ This is an Editorial Call.**

  ---

  **Where the Procedure Stops & Hands Off:**
  *   **Step 4 Fail:** Cutting a Eurocentric label for a non-European context demands a **positive choice** about how *your publication* frames that history. Do you use local terms (requires reader explanation)? Stick strictly to dates? Use a cautious neutral descriptor? **This is an editorial decision about narrative framing and audience expectation, not just fact.** Flag it for your editor with options.

  ---

  **Running Your Cases:**

  1.  **"The last flowering of the medieval world" (Manuscript Find):**
      *   **Step 1:** FAIL ("last flowering" is pure rupture claim, not a timestamp).
      *   **Step 2:** Ask: Is the story *about* the end of the medieval era? Probably not. **FAIL.**
      *   **Step 3:** Ask: Is this label borrowed/inflating drama? VERY LIKELY YES. **Action: CUT.** Replace with specific century/date range (e.g., "a late 15th-century manuscript"). **RESULT: Label Cut.**

  2.  **"Early Modern" applied to the same centuries (c. 1500-1800) in a story about South Asia:**
      *   **Step 1:** POTENTIAL PASS (It *can* denote a rough time range... but proceed cautiously).
      *   **Step 2:** Ask: Is the story *about* an "early modern" transition *in South Asia*? Unlikely in a general story. **FAIL/Unclear.**
      *   **Step 3:** Ask: Why use it? Likely borrowed academic term or lazy timestamp. **Action:** **Proceed to Step 4.**
      *   **Step 4:** Ask: Does "Early Modern" fit South Asia non-distortingly? **DEBATABLE / CONTESTED.** It *is* used academically, but carries heavy European baggage (implying proto-modernity, capitalism, state formation in a specific way). **FAIL.** **Action: CUT.** **→ EDITORIAL CALL:** Replace with dates (e.g., "16th to 18th centuries") OR a regionally appropriate term (e.g., "Mughal era," "Vijayanagara period" - *if accurate*). **RESULT: Label Cut, Handoff to Editor.** *This is the case the procedure refuses to settle.* It forces the choice: use contested academic shorthand, use local terms needing context, or use plain dates. The magazine's voice and audience matter here.

  3.  **"Birth of Modern Science" framing for a modest experimental result:**
      *   **Step 1:** FAIL ("Birth" is a definitive rupture claim).
      *   **Step 2:** Ask: Is the story *about* the origins of modern science? Unlikely if the result is modest. **FAIL.**
      *   **Step 3:** Ask: Is this framing borrowed/inflating drama? **ABSOLUTELY YES.** This is the core sin – using the label to make a small result sound epoch-defining. **Action: CUT IMMEDIATELY.** Replace with dates or a description of the *actual* contribution (e.g., "17th-century experiments revealing new details about..."). **RESULT: Label Cut Decisively.** *This is the answer you might not like* if you (or your source) hoped the grand label would sell the story, but the procedure ruthlessly exposes the hype.

  ---

  **Key Takeaway:** Your default move should be **dates (BCE/CE)**. Period labels must **earn their keep** by being either 1) pure, uncontested timestamps *for the context*, or 2) the central subject of the story's analysis. Step 3 is your hype detector—be brutal with it. Step 4 forces the essential conversation about non-European framing that plain dates often sidestep better than misleading labels.
