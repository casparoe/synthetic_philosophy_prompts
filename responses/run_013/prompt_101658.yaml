prompt: |-
  I was having dinner with an old friend of mine, Dana, who teaches at a law school, and we got onto whether everyday conventions — tipping, queueing, jaywalking, holding doors, that whole family of things — are actually moral obligations or just etiquette that people moralize about. What struck me is that Dana has very settled, almost viseral verdicts about these, and they don't obviously all come from one principle. Her track record, as best I could get her to state it: she thinks it's genuinely *wrong* — not just tacky — to leave no tip at a sit-down restaurant where the server is depending on tips and the service was fine; to push ahead of a long, orderly line at airport check-in by pretending you're about to miss your flight; and to take a loud phone call in a designated quiet carriage. She thinks it's *not* wrong at all to jaywalk across an empty street at 2 a.m. with no cars anywhere in sight, or to wear a baseball cap in a restaurant where it's mildly frowned on but bothers no one. And she insists the tip and the queue cases are wrong in the same way and for the same reason.

  Here's the case I want you to call for her. A German colleague is spending a semester with us. He's been here two months, speaks fluent English, and knows perfectly well that people queue at the food trucks on campus and that you're expected to tip at the sit-down places. Last week he walked straight past a fifteen-person line at a food truck and ordered at the window. My hunch is that Dana will say he did nothing wrong — something about him not being a party to our little practices, so we can't hold him to them — but I don't see how that squares with the rest of what she says. So: tell me what Dana will actually say about him, what rule she's really running, whether some other rule fits her earlier verdicts just as well, and where the two come apart.

  Then tell me which of those rules *I* should accept, and name the further case that would force the choice between them. Don't hedge and don't hand me a menu of positions — give me your best guess about Dana, a definite verdict of your own, and the reasons. Keep the whole thing under 500 words.
reasoning: |-
  Okay, let me tackle this step by step. The user presents an interesting ethical puzzle about social conventions versus moral obligations, based on their friend Dana's views. The core challenge is predicting Dana's judgment about a German colleague skipping a queue despite knowing local norms, and then determining which ethical framework best explains her position.

  First, analyzing Dana's established positions: she clearly distinguishes between conventions with moral weight (tipping, queueing) versus those without (jaywalking when safe, wearing caps). Her consistent reasoning seems to hinge on two factors: whether the action causes concrete harm/disrespect, and whether the actor is bound by implicit social contracts.

  For the German colleague case, I predict Dana would argue no wrongdoing. Her likely rationale: as an outsider not fully integrated into the local social contract, his violation lacks the "participatory intention" that makes queue-cutting morally significant. This preserves her earlier principles while accounting for cultural outsider status.

  The deeper rule governing all her judgments appears to be a hybrid of social contract theory and harm principle: conventions become morally binding when (1) they prevent tangible harm/disrespect, and (2) the actor willingly participates in that social system. Where these conditions aren't met (e.g., jaywalking safely, or cultural outsiders violating norms), mere etiquette applies.

  For the user's own stance, I'd advocate Dana's framework over strict cultural relativism. The key test case would be: is it wrong for a longtime immigrant who understands but rejects local norms to skip queues? Dana would say yes (binding participation), while relativists might say no. The harm/consent model better balances cultural sensitivity with accountability.
answer: |-
  Here's Dana's verdict and the reasoning:

  **Dana's Verdict on the German Colleague:** She will say **he did nothing morally wrong** (though it might be rude/inconsiderate).

  **Dana's Rule (Social Contract Lite + Harm):** Conventions create *genuine* moral obligations only when:
  1.  **Harm/Disrespect is Concrete:** Violating them causes tangible harm, unfair disadvantage, or significant disrespect *within the specific context* (e.g., server loses wages, queue-jumper gains unfair time advantage at others' expense, quiet carriage user loses peace).
  2.  **You're a Party to the Contract:** You are a knowing, *willing participant* in the system where the convention functions as a widely understood rule coordinating behavior and preventing that harm/disrespect.

  **Applying the Rule to the Cases:**
  *   **Tip/Queue:** Concrete harm (server loses income, queue-jumper causes delays/disrespect). *You implicitly agree to the rules by participating* (sitting down, joining the line).
  *   **Quiet Carriage:** Concrete harm (disturbing peace in a designated space). *You agree by choosing to enter that carriage.*
  *   **Empty Street Jaywalking:** No concrete harm. No agreement triggered (no one affected).
  *   **Baseball Cap:** No concrete harm (mere mild disapproval). No agreement broken (rule isn't harm-preventing).
  *   **German Colleague:** Concrete harm/disrespect *is* present (skipping line disadvantages others, is disrespectful). **BUT:** Dana sees him as *not fully a party to the social contract* despite knowing the rule. His status as a temporary visitor ("spending a semester", "German colleague") means he hasn't fully bought into the local system; he's an outsider. Knowing the rule ≠ implicit consent to be bound by it *morally* in the same way a local is. His violation stems from cultural difference, not bad faith participation. Thus, it's rude, not morally wrong.

  **Alternative Rule & Where it Fails:** A pure "Harm/Disrespect Only" rule (ignoring participation) would fit *most* cases but **fail on the German colleague** – it would require Dana to say he *did* wrong (since harm/disrespect occurred). A pure "Explicit Consent" rule would be too strict and wouldn't fit her tipping/queue verdicts for locals who never *explicitly* agreed.

  **Your Rule (What You Should Accept):** Adopt **Dana's rule**. It best balances preventing harm/disrespect with reasonable expectations of who is bound by local conventions. It avoids unfairly imposing every local norm on temporary visitors or outsiders who haven't truly "joined" the system, while holding accountable those who benefit from and participate in it.

  **The Forcing Case:** Is it wrong for a **long-term immigrant who perfectly understands the norms, has lived locally for years, benefits from the system, yet consciously rejects and violates them (e.g., never tips, always queue-jumps) because they find them silly?**
  *   **Dana's Rule:** *Yes, wrong.* They are now a full participant; their conscious rejection doesn't negate their role within the system causing harm.
  *   **Pure Cultural Outsider Rule:** *No, not wrong.* They remain essentially an outsider by choice/attitude.
  *   **Your Choice:** This forces you to decide if participation/benefit creates obligation regardless of internal acceptance. Dana (and I) say yes.

  **Summary:** Dana excuses the German colleague due to outsider status despite harm, using a "Harm + Willing Participation" rule. You should accept this rule. The long-term, understanding rejector forces the choice: Dana says they *are* obligated.
