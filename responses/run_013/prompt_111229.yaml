prompt: |-
  I've gone down a bit of a rabbit hole on this Molinism / 'middle knowledge' business after a mate at work (goes to a Reformed church, very into it) tried to explain it to me over lunch, and I want a number out of you rather than a book report. Here's the setup as I understand it — tell me if I've got it wrong: there are facts, right now, about what any possible free creature would freely do in any possible situation you could put it in, including situations that never actually happen. God knows all of that before he decides anything, and that's what lets him set up a world where people do what he wants while still doing it freely. My mate's picture is basically a lookup table: every possible person, every possible situation, the answer for what they'd pick, and God reads off the table when he picks which world to make.

  What I want is your actual credence that there's such a thing as middle knowledge, and be careful, I don't mean 'is it a nice story' — I mean the whole package: there are true counterfactuals of freedom about what an agent would do in circumstances it never actually faces, God can know them without having decided anything yet, and his knowing them doesn't make the agent unfree. Give me a number between 0 and 1, then break it down for me. How much of it rides on libertarian free will being real at all (I assume if determinism or compatibilism is true the whole puzzle just evaporates — is that right)? How much on whether a counterfactual about a person in circumstances they never face can have a truth value in the first place? How much on the grounding worry — whether some fact has to make that counterfactual true, and whether 'he just knows it by super-comprehending the person's nature' is a real answer or a promissory note? And how much on whether any of this actually rescues providence-plus-freedom or just moves the problem somewhere else? One line of justification per term, then show me how they multiply out. I'm at about 0.3 myself and my mate is at about 0.9, so tell me which of those terms our disagreement most likely lives in, and which single argument (not evidence — there's no experiment here) would shift your number most.

  One extra thing I can't shake: does it make any difference whether the table is written down in advance versus it just being a fact about what they'd do? The written-down version definately feels more threatening to freedom to me, but I can't tell if that's just a picture doing work on me. Seperate that out if it's a seperate question.

  British English please — I got told off about 'math' last time.
