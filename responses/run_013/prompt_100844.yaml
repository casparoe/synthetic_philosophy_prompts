       - *Most awkward commitment*: Prevents all action, even if some instances are net-positive, due to systemic risk.  
     - **No**: **Leaf: Conformity rule**  
       - *Most awkward commitment*: Fails when actors have skewed risk perceptions, allowing harmful actions if they rationalize universalization.  

  8. **Do costs fall primarily on outsiders?**  
