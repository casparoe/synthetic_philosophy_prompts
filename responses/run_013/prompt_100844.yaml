     - **No**: **Leaf: Market or betting scheme**  
       - *Most awkward commitment*: Ignores value disagreements and assumes beliefs are monetizable, disadvantaging the less wealthy.  

  10. **Is coordination feasible?**  
      - **Yes**: **Leaf: Unanimity requirement**  
        - *Most awkward commitment*: Enables extortion by holdouts who veto action for non-altruistic reasons.  
      - **No**: **Leaf: Make unilateral action costly**  
