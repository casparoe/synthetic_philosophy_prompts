  - **Make unilateral action costly (Leaves in Node 9 and Node 10)**: Used for factual initiation with externalities (Node 9) and value-based initiation with externalities (Node 10), but the tree cannot isolate risk tolerance (a subset of value disagreements) from broader value conflicts. Risk tolerance might warrant lower costs, but the procedure treats them identically.

  ### Key Insights
  - **Universalizability and information-producing tests diverge at Node 3**: Universalization harms (e.g., resource depletion) demand restrictiveness (conformity/pooling), while information-producing actions (Node 2) often favor permissiveness unless universalization is harmful. This isolates the "opposite verdicts" you noted.
