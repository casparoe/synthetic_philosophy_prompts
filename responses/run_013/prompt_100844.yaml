  ### Notes on the Tree
  **Branch doing the most sorting work**: Node 1 (Initiate vs. Veto). This split separates the core curse (initiation favors overaction) from its inverse (veto favors underaction), addressing the "unilateral option runs the other way" case. It is the most consequential divergence, as initiation and veto scenarios demand diametrically opposed safeguards (e.g., permissiveness vs. restrictiveness).

  **Unoccupied combinations (and diagnoses)**:
  - **Pooling evidence in value-based initiation (World-altering)**: *Incoherent*. Pooling assumes disagreements are resolvable through shared facts, but value conflicts require preference aggregation (e.g., voting). Using pooling here ignores incommensurable utilities.
  - **Market scheme for information-producing actions**: *Unexplored*. Markets excel for factual bets but are rarely applied to experiments, as information gains are non-rivalrous and hard to price; no clear mechanism exists.
  - **Designated actor for veto scenarios**: *Unattractive*. Centralizing veto authority undermines the distributed safeguard intent, creating a single point of failure/favoritism; groups prefer pooling or thresholds.
  - **Conformity rule for value-based initiation without externalities**: *Unattractive*. Universalizability tests assume uniform impacts, but value-driven actions (e.g., personal investments) may have local benefits; conformity over-constrains autonomy.

  **Inseparable leaf pairs (tree cannot split)**:
