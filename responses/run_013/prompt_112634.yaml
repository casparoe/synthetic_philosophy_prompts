prompt: |-
  Hey, I'm a third-year philosophy student and I'm in a moral psychology seminar that's spent the last three weeks on moral worth and acting for the right reasons, and honestly my flatmate and I keep having the same argument and going nowhere: she reckons the only thing that matters is whether you were actually moved by the fact that made your action right, and I think that's definately way too intellectualist — what about someone who just instinctively does the kind thing without ever representing to themselves that it's kind? Anyway, for the seminar we each have to hand the rest of the class some kind of one-page instrument, and I've decided to make a quiz that tells you which account of moral worth you actually hold — sorting people by what they say about cases, not by which -ism they like the sound of.

  Take on the role of someone who's taught this exact debate for years and knows where the joints really are. Before you write any questions, brainstorm the logical space out loud: work out what the live disagreements are, which of them are genuinely independent of each other (does a view have to take a stance on whether the agent's motive must line up with the reason that made the act right, or is that orthogonal to whether worth comes in degrees?), and make sure the space can seperate someone who thinks worth is internal to the agent's mind from someone who thinks it depends on the fit between the agent's mind and the reasons that actually applied to them. Then build about 9 questions out of that space, each one a concrete little case with two or three answer options, and none of them the lazy kind that just asks whether motives matter. I've got alot of cases I want in there: the honest shopkeeper who's only honest because it's good for business; someone who gives anonymously mostly to feel superior but whose money really does save lives; someone who acts from duty and is visibly annoyed about it; a person who saves their partner without a second thought and would be baffled by the question of whether it was the right thing to do (the objection that having that thought at all would already be a defect); someone who does the right thing for the wrong reason but would have done the same thing anyway if that reason had been absent; someone with a genuine good motive that is completely idle because a bad motive does all the work; a case where the agent acts against what they sincerely believe morality requires and turns out to have been right (I mean the shape of the case, not the famous example — describe it in a sentence or two so nobody needs to have read anything); and one where the act is right and the motive is good but the agent only has that motive because they were manipulated into it. The scoring key should map answer patterns onto positions, and I want at least: the strict motive-of-duty view; a broader view where any morally decent motive will do; the view that you must be moved by the right-making consideration itself; a counterfactual or robustness view where worth tracks what you would have done anyway; a character or virtue-expression view; a view where worth tracks what's attributable to the agent's quality of will even when the will is mistaken; a scalar view where worth comes in degrees; and a deflationary view that the whole notion is a muddle. For each position, one sentence on its most awkward commitment. Flag any pair of positions my questions can't actually pull apart, and list the answer-combinations that don't correspond to anything anyone defends, saying for each whether you think it's empty because it's incoherent, because it's unattractive, or just because nobody's explored it. Roughly 1300-1600 words all in, and please think carefully about whether each question genuinely separates the positions rather than merely sounding deep.
