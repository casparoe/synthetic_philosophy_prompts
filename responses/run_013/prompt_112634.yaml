  The user needs to create a one-page quiz instrument for their seminar. This quiz should help classmates identify their implicit views on moral worth through concrete cases rather than abstract theories. They want the quiz to sort people based on their responses to scenarios, avoiding direct questions about motives.

  I need to approach this systematically. First, I should map out the logical space of the debate on moral worth. Key disagreements include: 
  - Whether moral worth requires conscious awareness of right-making features (intellectualism vs. anti-intellectualism)
  - Whether the motive must align with the actual right-making reason or if any good motive suffices
  - Whether moral worth is binary or comes in degrees
  - Whether it depends on counterfactual robustness
  - If character expression matters independently
  - How to handle cases of epistemic error or manipulation

  These dimensions are often interconnected but can be separated. For instance, views on awareness versus counterfactual robustness represent distinct axes. The quiz needs questions that isolate these dimensions through carefully designed scenarios.

  The user provided several specific cases they want included: 
  - Honest shopkeeper motivated by profit 
  - Anonymous donor motivated by superiority 
  - Duty-bound but annoyed agent 
  - Partner saved without conscious thought 
  - Right action for wrong reasons that would persist without those reasons 
