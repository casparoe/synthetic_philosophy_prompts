  - Manipulated good motive

  I'll need to craft concise scenarios covering these while ensuring each question targets specific theoretical divides. Each question should have 2-3 answer options forcing choices that reveal underlying commitments.

  For the scoring system, I'll need to map answer patterns to positions like: 
  - Strict motive-of-duty view 
  - Broader decent-motive view 
  - Right-making-feature view 
  - Counterfactual robustness view 
  - Character-expression view 
  - Quality-of-will view 
  - Scalar view 
  - Deflationary view

  Each position should come with its "most awkward commitment" - the counterintuitive implication it must accept. I'll also need to identify any positions the quiz can't distinguish and note incoherent or unattractive answer combinations.

  The challenge is making each question diagnostic - it must cleanly separate at least two major views. For example, a question about unconscious virtuous action should distinguish intellectualist views from others. The shopkeeper case tests whether non-moral motives can yield moral worth. The manipulation case probes whether history affects worth.

  I should avoid "lazy" questions about motives directly and instead embed the philosophical tensions in lifelike dilemmas. The quiz must function within one page, so cases need to be extremely concise yet philosophically precise.

  For the answer key, I'll create a grid showing how answer combinations map to positions, noting where patterns might be ambiguous. I'll flag any pairs that the quiz can't distinguish (e.g., scalar views might overlap with character views in some responses) and explain why certain answer combinations don't correspond to defended positions.

  The whole response should stay within 1300-1600 words, balancing thoroughness with the one-page instrument constraint. The priority is creating a tool that actually reveals implicit theories through intuitive case judgments.
answer: |-
  Here’s a diagnostic quiz designed to map intuitive judgments onto theoretical positions in the moral worth debate. I’ve structured it to isolate core disagreements, drawing on your requested cases and ensuring each question targets a specific fault line. The logical space is mapped below the quiz.

  ---

  **The Moral Worth Diagnostic Quiz**

  *Instructions: For each scenario, select the option that best reflects your judgment about whether the agent’s action has moral worth (full, partial, or none). Assume the action performed is objectively right. Answer based on your immediate intuition.*

  1.  **The Honest Shopkeeper:** Kai runs a grocery store. They meticulously give correct change to every customer, not because they care about honesty or fairness, but solely because they believe it builds customer trust and maximizes long-term profits.
      *   (A) Kai’s action has **no moral worth**.
      *   (B) Kai’s action has **some moral worth** (it’s still honest, even if for profit).
      *   (C) Kai’s action has **full moral worth** (the right thing was done reliably).

  2.  **The Anonymous Donor:** River donates a large sum anonymously to a highly effective charity, saving many lives. Their primary, motivating reason is to feel morally superior to their peers. They know the charity is effective but don’t care about the beneficiaries themselves.
      *   (A) River’s action has **no moral worth**.
      *   (B) River’s action has **some moral worth** (lives were saved, even if the motive was bad).
      *   (C) River’s action has **full moral worth** (the outcome is what truly matters for worth).

  3.  **Duty with a Sigh:** Sam helps their elderly neighbor carry groceries every week solely because they believe it’s their moral duty. They find it tedious and are visibly annoyed while doing it, wishing they were doing something else.
      *   (A) Sam’s action has **no moral worth** (the resentment undermines it).
      *   (B) Sam’s action has **full moral worth** (they acted from the motive of duty).
      *   (C) Sam’s action has **some moral worth** (duty motivated them, but the resentment lessens it).

  4.  **Instinctive Rescue:** During a hiking accident, Taylor sees their partner fall and rushes to pull them to safety without a single conscious thought about duty, kindness, or even whether it’s "the right thing." They’d be baffled by the question. They acted purely from love and instinct.
      *   (A) Taylor’s action has **full moral worth** (it stemmed directly from virtuous love).
      *   (B) Taylor’s action has **no moral worth** (they didn’t consciously recognize the reason to help).
      *   (C) Taylor’s action has **some moral worth** (it was good, but less ideal than if they’d chosen consciously).

  5.  **The Robust Donation:** Alex donates to disaster relief primarily because it will impress their boss. However, Alex is also a genuinely compassionate person. If impressing the boss were *not* a factor (e.g., the boss would never know), Alex would *still* donate the same amount out of compassion.
      *   (A) Alex’s action has **no moral worth** (the actual motive was bad).
      *   (B) Alex’s action has **some moral worth** (the good motive was present but idle; counterfactual compassion helps).
      *   (C) Alex’s action has **full moral worth** (they would have done the right thing anyway).

  6.  **Idle Benevolence:** Blake volunteers at a soup kitchen. They genuinely care about feeding the hungry (Good Motive). However, on this particular day, the *only* thing actually moving them to go is the desire to avoid their annoying roommate (Bad Motive). Without the roommate situation, Blake would have skipped volunteering despite their genuine care.
      *   (A) Blake’s action has **no moral worth** (the actual motive was bad; the good motive was idle).
      *   (B) Blake’s action has **some moral worth** (the good motive is still part of who they are, even if idle here).
      *   (C) Blake’s action has **full moral worth** (the right action was performed, and Blake *does* possess a good motive generally).

  7.  **Sincere Mistake:** Casey believes stealing from large corporations is always morally wrong. However, faced with seeing a desperate, hungry child outside a mega-store, Casey impulsively steals a loaf of bread to feed the child, acting solely from compassion. Casey later feels guilty, believing they did wrong. (Assume stealing *was* the morally right action in this extreme circumstance).
      *   (A) Casey’s action has **no moral worth** (they believed they were acting wrongly).
      *   (B) Casey’s action has **full moral worth** (they were moved by the *actual* right-making feature: relieving suffering).
      *   (C) Casey’s action has **some moral worth** (compassion is good, but they intended a wrong act).

  8.  **The Manipulated Motivator:** Rowan has been subtly manipulated by a neuroscientist (without their knowledge) to feel intense compassion towards a specific endangered species. Moved solely by this implanted compassion, Rowan donates their savings to protect that species, which is objectively the right thing to do.
      *   (A) Rowan’s action has **no moral worth** (the motive isn’t authentically theirs).
      *   (B) Rowan’s action has **full moral worth** (they were moved by compassion, which is good, and did the right thing).
      *   (C) Rowan’s action has **some moral worth** (the feeling was real, but its origin undermines full credit).

  9.  **The Grudging Truth-Teller:** Jamie witnesses an injustice. They know telling the truth is the right thing and feel a weak pull of duty, but their dominant motive is intense dislike for the person benefiting from the lie. Jamie tells the truth, motivated mostly by spite.
      *   (A) Jamie’s action has **no moral worth** (spite is bad; duty was too weak).
      *   (B) Jamie’s action has **some moral worth** (duty was *partly* motivating; the act was right).
      *   (C) Jamie’s action has **full moral worth** (the truth was told for *a* reason linked to justice/truth).

  ---

  **Scoring Key & Theoretical Mapping**

  *   **Tally your answers:** Note how many A, B, C you selected for questions 1-9.
  *   **Map to Positions:** Compare your pattern to the common profiles below. No quiz perfectly isolates every view, but this targets key fault lines. Awkward commitments highlight counterintuitive implications the view must accept.
  *   **Unattributable Patterns:** See "Unmapped Combinations" below.

  1.  **Strict Motive-of-Duty View (Kantian Core):**
      *   *Profile:* Strong tendency towards **B** on Q3 (Duty with Sigh), **A** on Q1 (Honest Shopkeeper), **A** on Q2 (Anonymous Donor), **B** on Q4? (Instinctive Rescue - may accept if love expresses duty), **A** on Q5 (Robust Donation), **A** on Q6 (Idle Benevolence), **A** on Q7 (Sincere Mistake), **A** on Q8 (Manipulated Motivator), **A/B** on Q9 (Grudging Truth-Teller).
      *   *Core Idea:* Moral worth requires acting *solely* or *supremely* from the motive of duty – doing it *because* it's right.
      *   *Awkward Commitment:* Instinctive acts of love (Q4) or compassion (Q7) lack full worth unless interpreted as expressions of duty. Manipulated duty-feelings (like Q8) might still have worth.

  2.  **Broader Decent-Motive View:**
      *   *Profile:* **A** on Q1 (Shopkeeper - profit not decent), **A** on Q2 (Donor - superiority not decent), **B** on Q3 (Duty with Sigh - duty is decent), **A** on Q4 (Instinctive Rescue - love is decent), **A** on Q5 (Robust Donation - boss-impressing not decent), **A** on Q6 (Idle Benevolence - avoidance not decent), **B/C** on Q7 (Sincere Mistake - compassion is decent), **B** on Q8 (Manipulated Motivator - compassion feels decent), **A/B** on Q9 (Grudging Truth-Teller - spite not decent).
      *   *Core Idea:* Worth requires being moved by *some* morally commendable motive (duty, compassion, love, justice), even if not specifically the right-maker.
      *   *Awkward Commitment:* Motives like superiority (Q2) or manipulated compassion (Q8) might count as "decent" if they feel positive.

  3.  **Right-Making-Feature View (Anti-Coincidence):**
      *   *Profile:* **A** on Q1 (Shopkeeper - not moved by fairness), **A** on Q2 (Donor - not moved by saving lives), **B** on Q3? (Duty with Sigh - *if* duty = recognizing the right-maker), **A** on Q4? (Instinctive Rescue - *if* instinct doesn't track the reason), **A** on Q5 (Robust Donation - not moved by compassion *here*), **A** on Q6 (Idle Benevolence - not moved by care *here*), **B** on Q7 (Sincere Mistake - *was* moved by suffering, the right-maker), **A** on Q8 (Manipulated Motivator - compassion isn't *their* response to the reason), **A** on Q9 (Grudging Truth-Teller - not moved by justice/truth).
      *   *Core Idea:* Worth requires the agent's motivating reason to be (or include) the *actual* feature that makes the act right (e.g., relieving suffering, fulfilling a promise). Avoids "coincidence".
      *   *Awkward Commitment:* The Instinctive Rescuer (Q4) lacks worth *unless* their instinct reliably tracks the right-maker. Acting from sincere but *mistaken* duty (if duty *wasn't* the right-maker) lacks worth.

  4.  **Counterfactual/Robustness View:**
      *   *Profile:* **C** on Q1 (Shopkeeper - reliably honest), **C** on Q2 (Donor - saves lives reliably?), **B/C** on Q3 (Duty with Sigh - reliable but resentful?), **A/C** on Q4 (Instinctive Rescue - highly reliable), **C** on Q5 (Robust Donation - would have done it anyway), **C** on Q6? (Idle Benevolence - has the good motive generally), **B/C** on Q7 (Sincere Mistake - reliably compassionate?), **B/C** on Q8 (Manipulated Motivator - reliably compassionate now?), **B/C** on Q9 (Grudging Truth-Teller - reliable truth-teller?).
      *   *Core Idea:* Worth depends on the action being robust/non-accidental – the agent would still do the right thing in relevant counterfactual scenarios (e.g., if ulterior motives were absent).
      *   *Awkward Commitment:* The Honest Shopkeeper (Q1) motivated only by profit has full worth if they are reliably honest. Manipulated Rowan (Q8) has worth if the compassion is now robust.

  5.  **Character/Virtue-Expression View:**
      *   *Profile:* **A** on Q1 (Shopkeeper - expresses greed, not virtue), **A** on Q2 (Donor - expresses pride, not virtue), **B/C** on Q3 (Duty with Sigh - expresses dutifulness, though imperfectly), **A** on Q4 (Instinctive Rescue - expresses loving virtue), **A** on Q5 (Robust Donation - expresses boss-pleasing, not virtue), **B/C** on Q6 (Idle Benevolence - expresses Blake's benevolent character, even if idle now), **B** on Q7 (Sincere Mistake - expresses compassionate character), **A** on Q8 (Manipulated Motivator - doesn't express *their* character), **A** on Q9 (Grudging Truth-Teller - expresses spite, not justice).
      *   *Core Idea:* Worth stems from the action expressing the agent's virtuous character or dispositions.
      *   *Awkward Commitment:* The Manipulated Motivator (Q8) lacks worth because the feeling doesn't stem from *their* character. Instinctive Rescue (Q4) exemplifies worth.

  6.  **Quality-of-Will View (Attributionism):**
      *   *Profile:* **A** on Q1 (Shopkeeper - ill will? or neutral?), **A** on Q2 (Donor - ill will: contempt/superiority), **B** on Q3? (Duty with Sigh - good will, though grudging), **A** on Q4 (Instinctive Rescue - good will), **A** on Q5 (Robust Donation - ill will: vanity), **A** on Q6 (Idle Benevolence - ill will: avoidance; good will idle), **B** on Q7 (Sincere Mistake - good will: compassion, despite false belief), **A** on Q8 (Manipulated Motivator - will not attributable to agent), **A** on Q9 (Grudging Truth-Teller - ill will: spite).
      *   *Core Idea:* Worth depends on whether the right act is attributable to the agent's *good quality of will* (e.g., concern, respect) – even if mistaken about the facts.
      *   *Awkward Commitment:* Casey (Q7) who steals to feed a child *thinking it's wrong* still has worth because moved by compassion. Rowan (Q8) lacks worth because the will isn't *theirs*.

  7.  **Scalar View:**
      *   *Profile:* Frequent selection of **B** ("some moral worth"), especially in mixed-motive cases (Q3, Q5, Q6, Q8, Q9) and cases like Q2 (Donor), Q7 (Sincere Mistake). May combine with other views (e.g., B for Q1? Unlikely).
      *   *Core Idea:* Moral worth comes in degrees, based on the strength, purity, or nature of the motives/counterfactuals involved.
      *   *Awkward Commitment:* It's difficult to specify clear thresholds; many actions end up with "partial" worth, which may dilute the concept.

  8.  **Deflationary/Muddle View:**
      *   *Profile:* Inconsistent pattern; frequent **C** (especially Q1, Q2, Q5, Q9) prioritizing outcome/reliability; **A** or **C** on Q4 (rejecting the worth question itself); possibly **B** on Q7 & Q8 to acknowledge complexity before dismissing it. Rejects the core distinctions.
      *   *Core Idea:* The concept of "moral worth" distinct from rightness and character assessment is confused or unimportant. Focus on action or character.
      *   *Awkward Commitment:* Must dismiss strong intuitions (e.g., difference between Shopkeeper and Saint) as irrelevant to *this* kind of evaluation.

  **Unmapped Combinations & Limitations:**

  *   **Q4 (Instinctive Rescue) A vs. B:** Cleanly separates Intellectualist (B: requires conscious representation) from Anti-Intellectualist (A) views (e.g., Right-Making Feature, Virtue, Quality-of-Will).
  *   **Q1 (Shopkeeper) A vs. B/C:** Separates views demanding a moral/decent motive (A: Strict Duty, Broad Decent, Right-Maker, Virtue, Quality-of-Will) from Counterfactual/Outcome views (B/C).
  *   **Q8 (Manipulated Motivator) A vs. B:** Separates views requiring authentic motives/character (A: Virtue, Quality-of-Will, some Right-Maker, Strict Duty) from views focused on the present mental state or outcome (B: Broad Decent, Counterfactual, possibly Scalar).
  *   **Q7 (Sincere Mistake) B vs. A/C:** Separates views crediting good quality of will despite error (B: Quality-of-Will, some Scalar/Virtue) from views requiring correct belief (A: Strict Duty, some Right-Maker) or focusing on the intended act (C).
  *   **Limitation 1:** Distinguishing **Strict Duty** from **Right-Maker** views is imperfect. Q3 (Duty with Sigh) is key (B favors Strict Duty), but both will give similar answers on Q1, Q2, Q5, Q6. Look for **B** on Q4 favoring Strict Duty if they accept it as duty-expression.
  *   **Limitation 2:** **Counterfactual** views can mimic **Character** or **Scalar** views. Q5 (Robust Donation - **C**) is a strong signal for Counterfactual. Character views care more about the *source* of the reliability (Q8 **A**, Q6 **B/C**).
  *   **Unattributable Patterns:**
      *   **Mostly A except Q1/Q2 C:** (Shopkeeper/Donor have worth). Suggests strong **Counterfactual/Outcome** view, but rejecting the core intuition driving other views. *Unattractive* to most theorists.
      *   **Mostly C:** Strong **Deflationary/Counterfactual**. Rejects moral worth as distinct concept. *Coherent but deflationary*.
      *   **Mixture of A & C with no B:** Unlikely. Most views acknowledge *some* complexity (mixed motives, belief errors). *Possibly incoherent* (e.g., Q7 **A** requires correct belief, but Q8 **C** ignores manipulation origin).
      *   **Consistent B:** Strong **Scalar** view, seeing worth as partial almost everywhere. *Coherent but might collapse distinctions*.
      *   **Q4 B, Q7 A, Q8 B:** Values conscious recognition (Q4 B) and correct belief (Q7 A) but accepts manipulated motives (Q8 B). *Incoherent* regarding the need for authenticity/agency.

  This quiz forces trade-offs revealing core intuitions. The "awkward commitments" show the price of each view. Good luck with the seminar!
