  Below is a decision tree designed to clarify the philosophical positions in your reading group regarding the implications of complexity results (e.g., P vs NP). It starts from your shared commitments and branches through key questions about where hardness "lives," the nature of feasibility, and what complexity results reveal. Each branch node is a yes/no or multiple-choice question that can be answered without prior knowledge of the outcome. The tree has **5 branch nodes** and **6 leaves** (named positions), with one leaf marked "unnamed" for an unattractive combination. Combinations not leading to a named leaf are flagged as incoherent, unattractive, or unexplored. Where leaves share core commitments but differ in emphasis (e.g., Physical Uncertainty and Mathematical Platonism), this is noted.

  ---

  ### **Complexity Philosophy Decision Tree**  
  *Start here. All parties accept: P, NP, BQP, etc., are mathematically precise; no known poly-time algorithm for NP-complete problems exists; this is a robust fact (not hardware-dependent); and the polynomial boundary is defined despite practical infeasibility of high exponents or encoding-sensitivity.*

  #### **Branch Node 1: Is hardness an intrinsic feature of computational problems themselves?**  
  *(Like "4 is even" – independent of how we study it.)*  
  - **Yes** → Go to Node 2.  
  - **No** → Go to Node 3.  

  #### **Node 2 (Hardness is intrinsic): Do complexity constraints bind an ideal reasoner (e.g., God)?**  
  *(Would an unlimited being face the same barriers?)*  
  - **Yes** → Go to Node 4.  
  - **No** → **Leaf: Resource-Bounded Fundamentalism**  
    - **Commitment**: Hardness is intrinsic but only constrains resource-bounded agents. An ideal reasoner (unbounded) escapes P/NP limits.  
    - *Awkward to defend*: The ideal reasoner can solve NP-complete problems instantly, but this doesn't undermine the problem's intrinsic hardness for finite beings.  

  #### **Node 3 (Hardness is not intrinsic): Does hardness depend solely on the pair (problem + model of computation)?**  
  *(e.g., classical vs. quantum changes the subject.)*  
  - **Yes** → Go to Node 5.  
  - **No** → **Leaf: Pragmatism**  
    - **Commitment**: Hardness is relative to our epistemic/normative standards – P/NP is a proxy for "feasibility," defined by usefulness, not truth.  
    - *Awkward to defend*: The boundary shifts with practical needs, so NP-hardness isn't a stable fact (e.g., it could vanish if society deems exponential time "acceptable").  

  #### **Node 4 (Hardness is intrinsic; binds ideal reasoner): Do relativization barriers (and similar proof limits) reveal truth about math?**  
  *(e.g., do they signal that P ≠ NP is unprovable with current techniques because it's deeply true?)*  
  - **Yes** → Go to Node 6.  
  - **No** → **Unnamed**  
    - **Reason**: Incoherent with intrinsic + ideal binding. If hardness is absolute and binds even God, barriers can't be mere proof artifacts. (Unattractive and unexplored.)  

  #### **Node 5 (Hardness depends on model-problem pair): Is "feasibility" (e.g., P) descriptive or evaluative?**  
  *(Descriptive = tracks objective properties of computations; Evaluative = reflects our norms/interests.)*  
  - **Descriptive** → **Leaf: Model-Relativism**  
    - **Commitment**: Hardness is a fact about a specific model (e.g., classical Turing machines), but not intrinsic to the problem. Switching models (e.g., to analog) changes what's hard.  
    - *Awkward to defend*: Changing the model alters the problem's hardness, so "solving SAT in polynomial time on a quantum computer" isn't about SAT itself.  
  - **Evaluative** → **Leaf: Normative Model Selection**  
    - **Commitment**: Choosing a model (e.g., classical vs. quantum) is normative – it prioritizes certain values (e.g., realism, elegance) over truth. Hardness is fixed only after this choice.  
    - *Awkward to defend*: The model choice is arbitrary (e.g., favoring quantum based on hype), so hardness becomes a matter of preference, not discovery.  

  #### **Node 6 (Hardness intrinsic, binds ideal, barriers reveal truth): Are unproven hardness assumptions (e.g., in cryptography) empirical or mathematical?**  
  *(Empirical = testable claims about nature; Mathematical = conjectures about abstract computation.)*  
  - **Mathematical** → **Leaf: Mathematical Platonism**  
    - **Commitment**: P, NP, etc., discover mind-independent truths. Hardness is immutable, like arithmetic. Cryptography assumes mathematical facts.  
    - *Awkward to defend*: An algorithm running in $n^{1000}$ is "efficient" in principle, even if useless in practice.  
  - **Empirical** → **Leaf: Physical Uncertainty**  
    - **Commitment**: Hardness is absolute, but barriers and assumptions are about physical reality (e.g., nature enforces P ≠ NP). Math models the world imperfectly.  
    - *Awkward to defend*: Relativization barriers hint at physical truths, not just math – risking conflation of abstract and natural constraints.  

  ---

  ### **Tree Summary**  
  - **Leaves**: Six positions, with Resource-Bounded Fundamentalism and Mathematical Platonism sharing an "absolute hardness" core but differing on whether it binds an ideal reasoner.  
  - **Unnamed Branches**: Only one (Node 4→No), due to incoherence. Other paths (e.g., Node 5→Descriptive→Carves joints? Yes) are unexplored or unattractive but not impossible.  
  - **Indistinguishable Pairs**: None – all leaves are distinct. Pragmatism and Normative Model Selection both stress normativity but diverge on whether hardness requires a computational model (Node 3 vs. Node 5).  
  - **Key Omissions**: No leaf combines intrinsic hardness with evaluative feasibility (incoherent) or model-relativism with joint-carving (unattractive).  

  This tree isolates disagreements at the first branching point (intrinsic vs. non-intrinsic hardness) and forces clarity on feasibility's nature, barriers, and assumptions. Use it to map where arguments diverge and where positions might be compatible despite differing language.
