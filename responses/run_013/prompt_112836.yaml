prompt: |-
  I sit on the advisory board of a small foundation that has earmarked roughly four two-year postdoctoral fellowships, plus a workshop budget, for work on the semantic and logical foundations of metaethical expressivism — specifically the cluster of problems usually gathered under the Frege–Geach heading. The board is not committed to any particular camp, and it would rather fund the questions that make the most difference to the rest of the field than the ones that happen to be most discussed. I have a background in formal semantics and the philosophy of logic, and I keep suspecting that the way the problem is usually posed hides what is really at stake, so I would like help framing the agenda before we write the call for proposals.

  Here is the tangle as I see it, and I would like you to tell me which strands are load-bearing. On one telling, the problem is not really about moral language at all but about how force and content compose: a sentence must make the same contribution to the validity of an argument whether it appears embedded or unembedded, and the expressivist appears to owe an account on which the very same sentence expresses an attitude when asserted and something else when negated, disjoined, or placed in the antecedent of a conditional. That suggests the live question is whether the recent revival of act-theoretic accounts of propositions — propositions as types of acts, or as things individuated by the attitudes they are for — dissolves the problem or merely relocates it into a general theory of propositional unity that is contested quite independently of metaethics. A second strand is the negation problem: whether the difficulty expressivists have in saying what attitude a negated normative sentence expresses is a special case of the embedding problem or a separate and possibly deeper one, and whether relational or higher-order treatments that seem to work for negation and the conditional generalize to disjunction, quantification, tense, modality, and to normative vocabulary beyond the narrowly moral — epistemic and practical norms, thick evaluative terms, and the like. A third is whether the quasi-realist or minimalist route to truth-aptness genuinely earns the expressivist the right to logical vocabulary, or only postpones the debt to a story about what makes discourse representational. And underneath all of these is a question I think is underrated: whether expressivism is best read as a thesis about mental states or as a thesis about meaning, and whether an expressivist who is happy to accept a thoroughly truth-conditional, compositional semantics is still an expressivist at all, or has quietly become a cognitivist with an unusual metaphysics of content.

  What I want from you is a defended research agenda, not a survey. Rank the open questions in this area by how much they matter for a foundation with four fellows and two years — say five or six, ordered — and justify the order by the criteria that should drive it: which questions are upstream of others, in the sense that settling them would settle or reframe the rest; which are tractable for philosophers with a logic and semantics background working largely alone, and which need an empirical or interdisciplinary arm; how many other questions in the area depend on the answer; and which currently fashionable formulations you would actually deprioritize because their resolution would not change much downstream. For each item, say what the competing answers are, what a decisive contribution would even look like, and what would move it up or down your ranking over the next few years. Finally, tell me which of the puzzles I sketched above you think are genuine and distinct, which are the same problem wearing different clothes, and which are artifacts of a framing we could simply abandon — and if the last, what we should say in the call for proposals instead. I am not after a reading list or a set of citations; I want the reasoning about priority, and I would rather you reconstruct the arguments from the content of the problems than gesture at who is supposed to have settled them.
reasoning: |-
  Okay, let me start by unpacking the user's query. They're on the advisory board of a foundation funding postdoc fellowships focused on the semantic and logical foundations of metaethical expressivism, especially Frege-Geach problems. The goal is to set a research agenda that prioritizes high-impact questions rather than just popular ones. The user has a background in formal semantics and philosophy of logic, and they suspect the usual framing of the problem might be missing the core issues.

  First, I need to understand the key strands they mentioned: composition of force and content, the negation problem, quasi-realism's truth-aptness, and whether expressivism is about mental states or meaning. The user wants these ranked by impact, tractability, upstream influence, and how many downstream issues they affect.

  Starting with the composition problem. If propositions are types of acts, solving how force composes in embeddings could reshape the entire debate. This seems upstream because it affects how we approach embedding across all contexts. It's tractable for logicians and semanticists working solo. If resolved, it might make the negation problem a special case, not a separate issue. That's a strong candidate for top priority.

  Next, the negation problem. It's a specific instance of embedding but has unique challenges with higher-order attitudes. If the composition problem is solved, negation might follow. But if not, it remains a critical test case. However, it's less general than composition, so ranking it second makes sense. Solutions here need to generalize to other embeddings, which is tricky but feasible for specialists.

  Then, quasi-realism's truth-aptness. This depends on prior solutions to embedding. Without knowing how moral sentences compose, claiming they're truth-apt is premature. It's more derivative, so third place. It's manageable for philosophers but requires engaging with minimalism, which might need interdisciplinary input.

  The mental states vs. meaning debate is foundational but more philosophical. Resolving it wouldn't directly solve technical problems like embedding. It's important for defining expressivism but doesn't constrain semantic frameworks as much. So fourth. It's tractable through conceptual analysis but might not yield decisive results quickly.

  The user also asked about deprioritizing certain formulations. The negation problem as a distinct issue might be an artifact if composition is solved. Also, focusing on specific embeddings like conditionals without generalizing could be sidelined. Instead, the call should emphasize unified accounts of compositionality and force.

  Assessing the user's deeper needs: they want to fund research that shifts the field's direction, not incremental work. They value originality and foundational impact. The agenda should avoid well-trodden paths and target leverage points. Also, ensuring proposals are feasible for small teams with logic/semantics backgrounds is key. Interdisciplinary work is secondary unless necessary.

  Finally, the research questions should be framed to avoid traditional dichotomies. Highlighting compositionality and propositional unity could attract innovative approaches. Clarifying that expressivism might coexist with truth-conditional semantics if the act-theoretic view is adopted. This reframes the debate, potentially resolving multiple puzzles at once.
answer: |-
  Based on your criteria (upstream impact, tractability for logic/semantics specialists, downstream consequences, and de-prioritizing fashionable but low-leverage questions), here’s a defended research agenda for the foundation, distilled into five priority-ranked questions. I’ve consolidated your strands where they overlap and identified which are artifacts of framing.

  **Core Insight:** The central, load-bearing strand is **the composition of force and content**. The "negation problem" is largely a symptom of this, and the "mental states vs. meaning" question is downstream. Quasi-realist truth-aptness is mid-stream but constrained by compositional success.

  ### Ranked Research Agenda (Top 5 Priorities)

  1.  **The Composition of Force and Content: Can Act-Theoretic Propositions Provide a General, Compositional Account of Embedding?**
      *   **Why #1?** Directly upstream. If solved, it dissolves or radically reframes the Frege-Geach problem *and* the negation problem. It's foundational to whether expressivism is semantically viable. Success here would constrain answers to all other questions (truth-aptness, mental state/meaning link, scope). Failure would necessitate a major pivot.
      *   **Competing Answers:** (A) Yes: Propositions as types of acts (e.g., Hanks, Soames, Barker) can compositionally incorporate force-like elements (e.g., "forbidding" as part of the propositional type) without violating standard logic. (B) No: Act-theoretic accounts either collapse into descriptivism, fail to handle complex embeddings compositionally, or require ad-hoc logical rules incompatible with standard logic.
      *   **Decisive Contribution:** A formally rigorous, compositional semantics for a non-trivial fragment of normative discourse (including negation, conditionals, disjunction) using an act-theoretic propositional framework, demonstrating validity preservation in standard logical forms. Crucially, it must show *how* the "force" aspect remains consistent under embedding without becoming inert descriptive content.
      *   **Tractability:** High for logician/semanticist postdocs. Core work is formal modeling. Needs deep engagement with philosophy of language/propositional attitudes.
      *   **Movement:** Up if act-theoretic semantics makes breakthroughs in non-normative domains. Down if decisive formal objections emerge or if hybrid theories gain traction demonstrating superior compositional power.

  2.  **The Scope Challenge: Can an Expressivist Semantics Generalize Systematically Beyond Simple Moral Assertions to All Grammatical Contexts and Normative Domains?**
      *   **Why #2?** Tests the robustness and universality of any proposed solution to #1. An expressivism that only handles "murder is wrong" in simple arguments but chokes on disjunctions, quantifiers ("everything he did was wrong"), epistemic modals ("it might be wrong"), thick terms ("courageous"), or practical conditionals ("if you want to φ, you should ψ") fails as a general theory. Success here validates the core semantic engine.
      *   **Competing Answers:** (A) Yes: The core compositional mechanism (e.g., higher-order attitudes, structured attitudes, act-types) can be iterated/extended systematically. (B) No: Expressivist treatments become hopelessly complex, ad-hoc, or fail to preserve logical relations for certain constructions/domains, suggesting a fundamental limitation.
      *   **Decisive Contribution:** Extending a specific expressivist semantic framework (e.g., Gibbardian planning, act-theoretic) to provide unified analyses of disjunction, quantification, modal embedding, and thick terms within a single compositional system, demonstrating logical coherence throughout. Showing how the attitude expressed in complex contexts is systematically built from simpler components.
      *   **Tractability:** High for semantics/logic specialists. Requires detailed linguistic analysis and logical modeling. Less need for empirical work.
      *   **Movement:** Up if promising formal approaches emerge for specific tricky cases (e.g., disjunction). Down if general frameworks prove adaptable early on, making case-by-case analysis less urgent.

  3.  **Truth-Aptness Earned or Borrowed? Does Success on Composition Genuinely Ground Minimalist Truth, or Merely Simulate It?**
      *   **Why #3?** Depends on #1 and #2. Quasi-realism's success hinges on the *kind* of semantic structure built. If composition is achieved via a genuinely representational structure (even if ultimately grounded in attitudes), minimalist truth follows naturally. If composition relies on simulating logic without genuine truth-conditions, truth-aptness might be illusory.
      *   **Competing Answers:** (A) Earned: A successful compositional semantics *is* what constitutes a discourse as truth-apt/minimally representational. (B) Borrowed/Simulated: The semantics provides logical form but lacks the connection to genuine representation/world-aptness required for truth (even minimalist), revealing expressivism as incompatible with full-blooded truth-aptness. (C) Distinction Collapses: Minimalism means success on composition *is* sufficient for truth-aptness; demanding more is changing the subject.
      *   **Decisive Contribution:** A rigorous analysis showing precisely *which* features of a successful compositional expressivist semantics (e.g., referential apparatus, structure mirroring reality, inferential role) suffice for minimal truth/primitivist deflationism, and which gaps (if any) remain. Must engage deeply with deflationary/minimalist theories of truth and representation.
      *   **Tractability:** High for philosophers of logic/language. Conceptual/formal analysis focused on truth, representation, and semantics.
      *   **Movement:** Up if foundational debates about minimal truth/deflationism intensify. Down if consensus emerges that compositional success entails minimal truth-aptness.

  4.  **The Mental State / Meaning Nexus: Does Expressivism Require a Foundational Link to Non-Cognitive Attitudes, or Can it be a Purely Semantic Thesis Compatible with Varied Psychologies?**
      *   **Why #4?** Important for defining expressivism's core commitment, but less *immediately* constraining on semantic progress than #1-3. A "semantic-only" expressivism might still succeed compositionally (#1, #2) and earn truth-aptness (#3). Conversely, failure here doesn't doom semantic projects but clarifies their theoretical labeling.
      *   **Competing Answers:** (A) Essential Link: Expressivism *must* ground meaning in non-cognitive attitudes; a "truth-conditional expressivism" is a contradiction or cognitivism in disguise. (B) Semantic Independence: Expressivism is primarily a thesis about the *function* of language (expressing/constituting commitments) and the *structure* of content (non-descriptive, act-based); it can accept truth-conditional *formats* while denying descriptive *function*. (C) Hybrid: The link is essential but the relevant "attitudes" may be cognitive-like commitments captured by act-theoretic propositions.
      *   **Decisive Contribution:** A clear, defensible criterion for what makes a semantic theory "expressivist" even if it uses truth-conditional machinery, showing how the core anti-descriptivist insight is preserved. Or, a demonstration that abandoning the attitude-link *necessarily* collapses into descriptivism. Must engage with metaphysics of content and philosophy of mind.
      *   **Tractability:** Moderate-High. Primarily conceptual/philosophical analysis. Less heavy formal logic than #1-2, but requires clarity on content metaphysics.
      *   **Movement:** Up if influential arguments emerge that semantic-only expressivism is incoherent or collapses. Down if act-theoretic views gain wider acceptance as a viable "third way."

  5.  **The Negation Problem: Is it a Distinct Challenge or a Symptom of the General Composition Problem?**
      *   **Why #5?** While historically crucial, it's primarily a *test case* and *stress test* for solutions to #1 (Composition) and #2 (Scope). A truly successful general solution to composition should dissolve the negation problem as a *special* difficulty. Prioritizing it *separately* risks focusing on a symptom rather than the disease. However, it remains a powerful benchmark.
      *   **Competing Answers:** (A) Symptom: The core issue is general composition; negation is just a prominent, simple case where expressivist semantics struggles. Solve composition, solve negation. (B) Distinct & Deeper: Negation reveals a unique problem about the "polarity" of attitudes that general composition frameworks struggle with inherently (e.g., the "no false belief" problem).
      *   **Decisive Contribution:** Either: (i) Demonstrating how a specific general compositional framework (#1) seamlessly handles negation as a straightforward case, dissolving its special status; or (ii) Providing a formal argument that negation *inherently* requires resources beyond those needed for other embeddings within an expressivist framework.
      *   **Tractability:** High, but largely subsumed under #1/#2. Good target for focused papers by postdocs testing general frameworks.
      *   **Movement:** Up only if decisive arguments emerge that negation *is* uniquely intractable after all. Otherwise, its priority decreases as progress is made on #1.

  ### Deprioritized Formulations & Why

  *   **"The Frege-Gach Problem" as a monolithic entity:** It's an umbrella. The call should break it down into the specific compositional, scope, and truth-aptness challenges above.
  *   **Incremental fixes to specific embeddings (e.g., *just* conditionals):** Low leverage. Focus should be on unified, general compositional mechanisms (#1, #2).
  *   **Debates solely about the *label* "expressivism":** While related to #4, semantic progress (#1-#3) is more impactful than taxonomy. Fund work on the substance, not the label.
  *   **Pure defense/extension of existing frameworks (e.g., Gibbard) without novel compositional foundations:** Unless they make breakthroughs on #1 or #2, they are less likely to be transformative.

  ### Diagnosis of Your Strands & Reframing for the Call

  *   **Genuine & Load-Bearing:** Composition of Force and Content (Strand 1) is fundamental. Scope/Generalization (Strand 2's latter part) is critical for viability. Truth-Aptness (Strand 3) is a crucial downstream test.
  *   **Largely Symptomatic/Subsumed:** The Negation Problem (Strand 2's first part) is a key symptom/test case of the Composition problem, not fundamentally distinct. Its "depth" depends on whether general composition solves it.
  *   **Artifact of Framing / Downstream:** The "Mental States vs. Meaning" question (Strand 4). While important for defining expressivism's core commitment, settling it *alone* won't solve the semantic puzzles. A successful compositional semantics (#1) using act-theoretic propositions could potentially satisfy either view (it's a semantic structure *modeling* attitude expression). Prioritize the semantic mechanics first.
  *   **The "Real" Stake:** The viability of a *non-descriptive, fundamentally practical/conative* foundation for the meaning, logic, and apparent truth-aptness of normative discourse within a rigorous compositional semantics.

  ### Suggested Framing for Call for Proposals

  > "The Foundation seeks innovative proposals addressing the core semantic and logical challenges for metaethical expressivism and related non-descriptivist theories. Priority will be given to research tackling fundamental questions crucial for the viability and scope of these views, particularly:
  >
  > 1.  **Compositionality of Force & Content:** Can frameworks employing act-theoretic propositions, commitment structures, or other non-descriptive foundations provide a fully general and compositional semantics for normative language? How can the 'force' associated with normative claims be integrated into propositional content in a way that is preserved under embedding (negation, disjunction, conditionals, quantification) while validating standard logical rules?
  > 2.  **Scope & Generalization:** Can such frameworks be systematically extended to handle the full range of normative discourse, including epistemic modals, practical conditionals, thick evaluative terms, and complex embeddings, within a unified semantic system?
  > 3.  **Truth, Representation & Quasi-Realism:** If a successful compositional semantics for normative discourse is developed, does it genuinely earn the right to minimalist truth predicates and representational vocabulary, or does a significant gap remain? What are the necessary and sufficient conditions within an expressivist semantics for grounding truth-aptness?
  >
  > Proposals should demonstrate rigorous engagement with formal semantics, philosophy of language, and logic. We encourage work that moves beyond incremental fixes to specific embedding problems (like negation or conditionals in isolation) and instead develops comprehensive semantic foundations or provides decisive tests of their feasibility. Explorations of the relationship between the semantics of normative language and the metaphysics of content (e.g., act-theoretic propositions) are welcome, provided they directly address the core semantic challenges above."

  This framing targets the load-bearing walls (Composition, Scope, Truth-Aptness earned via semantics), explicitly deprioritizes low-leverage incremental work on specific embeddings, and pushes for foundational progress using the tools of logic and semantics, aligning perfectly with your foundation's resources and goals.
