  ### Translation of Money Pumps and Diachronic Rationality into MDP Framework

  #### Core Concepts in MDP Terminology
  1. **Preference Reversal**:  
     - In MDP terms, preferences are encoded in the **reward function** \(R(s, a, s')\). A preference reversal occurs when the reward function is **non-stationary** (e.g., \(R_t(s, a, s') \neq R_{t+k}(s, a, s')\) for \(k > 0\)).  
     - *Example*: At time \(t\), moving to state \(A\) yields higher reward than \(B\) (\(R_t(\cdot, A) > R_t(\cdot, B)\)), but at \(t+k\), \(B\) yields higher reward than \(A\) (\(R_{t+k}(\cdot, B) > R_{t+k}(\cdot, A)\)).  
     - **Value function shifts** (e.g., \(V^\pi_t(s) \neq V^\pi_{t+k}(s)\)) may reflect this, but the root is reward non-stationarity.

  2. **Commitment Device**:  
     - A **constraint on the policy** \(\pi(a|s)\). Specifically, it restricts future actions in certain states to avoid detrimental choices.  
     - *Formally*: Modify the action space \(\mathcal{A}(s)\) to exclude "tempting" actions (e.g., removing the "swap" action in a critical state).  
     - This corresponds to **policy hardening** (e.g., \(\pi_{\text{commit}}(a|s) = 0\) for actions leading to exploitable states).

  3. **Foreseeing Preference Changes**:  
     - **Foreseeing Agent**: Optimizes a **non-stationary reward function** over the full horizon, solving for a time-dependent policy \(\pi^*(a|s, t)\) that accounts for future \(R_t\) shifts. Uses **Bellman equations with time-indexed rewards**.  
     - **Non-Foreseeing Agent**: Assumes stationary \(R\) and \(\gamma\), leading to a fixed policy \(\pi\). Vulnerable if \(R\) changes post-deployment.

  #### Concrete Cases in MDP Formulation
  **Case 1: Preference Cycle (A > B > C > A)**  
  - **MDP Setup**:  
    - **States**: \(\{A, B, C, \text{Pumped}\}\) (with Pumped = terminal state).  
    - **Actions**: \(\{ \text{Swap}, \text{Keep} \}\).  
    - **Rewards**: Non-stationary \(R_t\) encoding cyclic preferences:  
      - In \(A\): \(R_t(A, \text{Swap}, B) = +1\) (prefers B), \(R_t(A, \text{Keep}, A) = 0\).  
      - In \(B\): \(R_t(B, \text{Swap}, C) = +1\), \(R_t(B, \text{Keep}, B) = 0\).  
      - In \(C\): \(R_t(C, \text{Swap}, A) = +1\), \(R_t(C, \text{Keep}, C) = 0\).  
      - Fee: Each swap transitions to Pumped with probability \(p\) and a penalty \(R = -k\) (where \(k \gg 1\)).  
    - **Non-Standard Element**: **Reward non-stationarity** is essential. The cycle *cannot* be represented by a stationary \(R\) without violating the axioms of rational choice (transitivity).  
  - **Vulnerability**:  
    - A myopic agent (\(\gamma \approx 0\)) swaps constantly, eventually reaching Pumped.  
    - **Avoidance**: Only if the agent’s policy is derived from a **stationary \(R\) satisfying transitivity** (e.g., \(R(A) > R(B) > R(C) > R(A)\) is impossible).  

  **Case 2: Cumulative Disaster (Series of Small Steps)**  
  - **MDP Setup**:  
    - **States**: \(\{S_0, S_1, \dots, S_N\}\) (e.g., \(S_0\) = initial, \(S_N\) = disaster).  
    - **Actions**: \(\{ \text{Step}, \text{Stop} \}\).  
    - **Rewards**: Stationary but deceptive:  
      - \(R(S_i, \text{Step}, S_{i+1}) = + \epsilon\) (small positive),  
      - \(R(S_i, \text{Stop}, S_i) = 0\),  
      - \(R(S_N, \cdot, \cdot) = -M\) (large penalty).  
    - **Non-Standard Element**: **High discounting** (\(\gamma \ll 1\)) or **shallow planning horizon**. The agent undervalues distant penalties.  
  - **Vulnerability**:  
    - Agent takes all "Step" actions due to immediate \(+ \epsilon\) rewards, ignoring \(S_N\).  
    - **Avoidance**: Requires **low discounting** (\(\gamma \approx 1\)) or **long planning horizon** to propagate \(S_N\)’s penalty backward.  

  #### Requirement to Avoid Money Pumps
  - **Value Function Representation**:  
    - For **Case 1** (cycle), avoiding pumps *requires* preferences representable by a **stationary transitive reward function** (no cycles in \(R(s)\)).  
    - For **Case 2** (cumulative steps), it requires a **stationary \(R\)** with penalties in \(S_N\) **and** sufficient **farsightedness** (\(\gamma \approx 1\)).  
  - **Key Insight**: Both cases demand that the agent’s *revealed preferences* (via actions) align with a **stationary \(R\)** and **optimal policy under Bellman equations**.  

