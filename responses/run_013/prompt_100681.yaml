       A commitment device is a mechanism that restricts the agent's future actions. In MDP terms, this corresponds to a policy that, in some states, restricts the set of available actions. For example, the agent might choose a policy at time 0 that, upon reaching a certain state, only allows a subset of actions (thereby preventing the agent from taking an action that would lead to a money pump). This is similar to having a fixed policy that does not change even when the agent's immediate rewards might suggest changing.

