prompt: |-
  I am preparing a graduate seminar on decision theory and would like your help in anticipating how a colleague of mine will rule on a new case. My colleague has the following settled verdicts on the standard problems:

  1. In Newcomb's problem, with opaque boxes and a highly reliable predictor, she takes one box.
  2. In the voting case, she holds that voting is rational even though one vote has negligible causal impact, on the ground that voting is evidence of how like-minded people vote.
  3. In a case where an action is causally efficacious with respect to an outcome, she chooses the action that maximizes causally expected value.

  Next week she will consider a new case, which I will call the "common cause" case. A genetic factor, fixed at birth and unaffected by anything she does, causes both a tendency to choose one box and a tendency for the box to be full. No predictor is involved; the correlation between her choice and the contents of the box is due entirely to the common genetic cause. The payoffs are the same as in the standard Newcomb problem.

  Predict what she will say about the new case. Identify the decision rule she is implicitly running, say what each candidate rule -- causal decision theory, evidential decision theory, and any others you think fit her verdicts -- predicts about the new case, give your best guess with the reasons for preferring it, and name the further case that would tell the rules apart.
reasoning: |-
  We are given a colleague's settled verdicts:
  1. In Newcomb's problem (with a highly reliable predictor), she takes one box. This is the standard one-boxing response, which is characteristic of evidential decision theory (EDT) because the action of taking one box is evidence that the predictor has put the million in the box, and hence leads to a better outcome.

  2. In the voting case, she holds that voting is rational because it is evidence of how like-minded people vote. This again is an evidential reasoning: the act of voting is evidence that other similar people are also voting, which increases the chance of the desired outcome (even if one's own vote has negligible causal impact).

  3. In a case where an action is causally efficacious with respect to an outcome, she chooses the action that maximizes causally expected value. This is the characteristic of causal decision theory (CDT): when there is a clear causal pathway, she uses causal expectations.

  So, the colleague seems to have a hybrid approach: she uses evidential reasoning when the situation involves evidence (like in Newcomb and voting) but causal reasoning when causality is clear.

  Now, we have a new case: the "common cause" case.
  - There is a genetic factor (fixed at birth) that causes both:
      (a) a tendency to choose one box (i.e., to take only box B, the opaque box)
      (b) a tendency for the opaque box (box B) to be full (i.e., to contain $1,000,000).
  - There is no predictor; the correlation between choosing one box and the box being full is due entirely to the common genetic cause.
  - Payoffs are the same as in Newcomb: 
      - If you take both boxes, you get the contents of both: $1,000 (box A) plus whatever is in box B.
      - If you take only box B, you get whatever is in box B.

  In the standard Newcomb problem, the one-boxer argues: "If I take both boxes, the predictor likely predicted that and left box B empty, so I get only $1,000. If I take only box B, the predictor likely predicted that and put $1,000,000 in it, so I get $1,000,000." But in this new case, the correlation is due to a common cause (genetics) and there is no predictor. So the evidential reasoning might be:

  - If I choose to take only box B (one box), that is evidence that I have the genetic factor that also causes box B to be full. Therefore, I expect to get $1,000,000.
  - If I choose to take both boxes, that is evidence that I don't have that genetic factor (or have a different one), which means box B is likely empty. Therefore, I would get only $1,000.

  On the other hand, causal reasoning would note that the genetic factor is fixed at birth and unaffected by the choice. So the choice does not causally affect the contents of the boxes. Therefore, regardless of whether I take one box or two, the contents of box B are already fixed. Hence:

  - Taking both boxes yields $1,000 plus whatever is in box B.
  - Taking only box B yields whatever is in box B.

  Since the genetic factor has already determined the contents of box B, and my choice doesn't change that, then:

  - If box B is full, taking both boxes gives $1,001,000 and taking one box gives $1,000,000. So I get $1,000 more by taking both.
  - If box B is empty, taking both boxes gives $1,000 and taking one box gives $0. So again I get $1,000 more by taking both.

  Therefore, dominant strategy: take both boxes.

  But note: the common cause creates a correlation. However, the causal decision theorist would say that the choice does not cause the contents of the box. So CDT would recommend two-boxing.

  Now, what about the colleague? She has shown a tendency to use evidential reasoning in cases where evidence is key (Newcomb and voting). But note that in the standard Newcomb, the correlation is due to a predictor (which is a kind of common cause, but one that is responsive to the decision). In the common cause case here, the correlation is due to a fixed genetic factor.

  However, the colleague's voting case reasoning is analogous: voting is evidence that others are voting (due to a common cause: shared beliefs or group behavior). Similarly, here, choosing one box is evidence that the genetic factor is present, which is also evidence that the box is full.

  Therefore, I expect her to extend her evidential reasoning to this new case and recommend taking only one box.

  But note her third verdict: when the action is causally efficacious, she uses causal reasoning. In this common cause case, the action (taking one or two boxes) has no causal effect on the contents of box B (which are fixed by the genetics). So by her own third rule, she might be inclined to use causal reasoning and take both boxes.

  However, the common cause case does not present a clear causal pathway from the decision to the outcome (the contents of the box). The decision is caused by the genetics, and the contents are caused by the genetics, but the decision itself does not cause the contents. So the causal structure is similar to the voting case: the vote doesn't cause the outcome (election result) but is evidence of the group behavior that does cause it.

  Therefore, I think she will see this as an evidential case and take one box.

  But let's compare the decision rules:

  Candidate rules:
  1. Causal Decision Theory (CDT): always uses causal models to compute expected utility. In this common cause case, CDT would model the decision as not affecting the box contents, so it would two-box. Expected utility of two-boxing is higher regardless of the state.

  2. Evidential Decision Theory (EDT): uses conditional probabilities. It conditions on the action to see what state is likely. In this case:
     - P(box B is full | take one box) is high (because of the common cause)
     - P(box B is full | take two boxes) is low (again because of the common cause)

     So EDT would one-box.

  3. A hybrid rule: she might have a rule that uses EDT when there is no clear causal pathway and when the action is evidence of a state that is not causally affected by the action. But note that in the common cause case, the state (the genetic factor) is fixed and the action is caused by it. So the action is evidence of the state, and the state causes the outcome. Thus, EDT reasoning applies.

  Given her voting case reasoning (which is analogous), I think she will one-box in the common cause case.

  But there is a tension: in the standard Newcomb, she one-boxes (EDT). In the common cause case, if she one-boxes, that's also EDT. However, note that in the standard Newcomb, the predictor is a kind of common cause that is responsive to the decision (it predicts the decision). In the common cause case, the genetics are fixed and do not respond to the decision. But the evidential reasoning is similar.

  Moreover, her third verdict says that when an action is causally efficacious, she uses causal reasoning. In the common cause case, the action is not causally efficacious with respect to the contents of box B. But the case does not present an alternative causal pathway that the action would affect? Actually, the only causal effect of the action is on the amount of money received: taking both boxes causally gets you the contents of both. But the contents of box B are fixed independently. So the causal effect is:

  - If you take both boxes, you get the contents of A and B.
  - If you take one box, you get the contents of B only.

  But the contents of B are fixed. So the causal model is:

    Genetics -> (Choice, Contents of B)

    Choice -> Money received (which is: if both, then A+B; if one, then B)

    Contents of B -> Money received

  Therefore, the choice does not cause the contents of B, but it does cause how much you get: by taking both, you get an extra $1,000 (from A) regardless of what's in B.

  So the causal expected utility of taking both is always $1,000 more than taking one. Hence, CDT says two-box.

  But she has previously, in the voting case, overridden the causal inefficacy of the single vote because of the evidential value. So she might do the same here.

  Therefore, my best guess is that she will say to take one box (one-box) in the common cause case.

  Reasons for preferring this:
  - The structure is analogous to her voting case: the action (voting or one-boxing) is evidence of a state (how others are voting or the genetic factor) that affects the outcome (election result or box contents). In both cases, the causal impact of the individual action is negligible (voting) or non-existent (one-boxing doesn't cause the box contents) but the evidential value is high.
  - She has shown a pattern of endorsing evidential reasoning in such cases.

  Further case to tell the rules apart:

  Consider a case where an action is evidence for a desired outcome but the causal structure is such that the action actually causes a negative outcome. This would pit EDT against CDT.

  Example: "The Smoking Gene" case.

  Suppose there is a gene that causes both a craving for tobacco and a tendency to develop lung cancer. The gene is fixed at birth and unaffected by behavior. Now, consider the decision to smoke. 

  - EDT: Smoking is evidence of having the gene, which is evidence of developing lung cancer. Therefore, smoking is bad news. But note, the act of smoking does not cause lung cancer (because the gene causes both the smoking and the cancer). So EDT might say: if I smoke, that's evidence I have the gene, so I'll get cancer. If I don't smoke, that's evidence I don't have the gene, so I won't get cancer. Therefore, don't smoke.

  - CDT: The causal structure: the gene causes cancer and also causes smoking. But the smoking itself does not cause cancer. Therefore, if I smoke, I get the pleasure of smoking and I get cancer only if I have the gene. But if I don't smoke, I don't get the pleasure and I still get cancer if I have the gene. So CDT would say: smoke if the pleasure is worth it, because it doesn't affect cancer.

  However, note: in reality, smoking does cause cancer. But in this hypothetical, we are assuming that the gene causes both and that smoking itself has no causal effect on cancer. So CDT would recommend smoking (if the pleasure is positive) because it doesn't change the cancer outcome.

  But our colleague: 
  - In the common cause case for Newcomb, she used evidential reasoning and one-boxed. 
  - In the smoking gene case, if she uses evidential reasoning, she would not smoke (because smoking is evidence of the gene, which means cancer). But if she uses causal reasoning, she would smoke because it doesn't cause cancer.

  Alternatively, we can design a case without the health implication. For example, a game:

  Suppose there are two coins that are either both fair or both biased (with a 90% chance of heads). The state (fair or biased) is determined by a common cause (a random draw at the beginning). You must choose to bet on the outcome of the first coin or the second coin. But note: the common cause determines the fairness of both coins. Now, suppose you have the option to look at the first coin (but not flip it) or not. 

  - If you look at the first coin, that doesn't change the fairness of either coin. But if the first coin is biased, that is evidence that the common cause set both to biased, so the second coin is also biased. Similarly, if the first coin is fair, the second is fair.

  But the act of looking at the first coin doesn't change the second coin. However, if you are going to bet on the second coin, then looking at the first coin gives you information about the second coin. But that's just about gaining information.

  We need an action that is evidentially relevant but causally irrelevant. 

  Alternatively, consider the "Death in Damascus" problem (by Gibbard and Harper):

  You are in Damascus and Death is waiting for you in either Aleppo or Damascus. Death has predicted your choice. If you choose to go to Aleppo, Death will be in Aleppo. If you choose to stay in Damascus, Death will be in Damascus. So it's like Newcomb.

  But now consider a variant: there is a common cause that causes both your choice and Death's location. For example, your brain state and Death's location are both determined by a prior state of the universe. Then:

  - EDT: If you choose to go to Aleppo, that is evidence that the common cause set Death to be in Aleppo. So you die. If you stay, evidence that Death is in Damascus. So you die. So you are doomed? But then it doesn't matter.

  But note: the causal structure: your choice does not cause Death's location. So if you go to Aleppo, you die if Death is in Aleppo. If you stay, you die if Death is in Damascus. But the common cause has set both. So no matter what you do, the probability of death is 1. So both actions are equally bad.

  But in this case, the evidential reasoning doesn't give a clear better action. So it might not be ideal.

  To distinguish, I think the smoking gene case is clearer. In that case:

  - EDT: avoids smoking because smoking is evidence of the gene and hence cancer.
  - CDT: smokes because it doesn't cause cancer.

  If our colleague in the common cause Newcomb case one-boxes (which I predict), then in the smoking gene case, if she avoids smoking, that is consistent with EDT. If she smokes, that would be consistent with CDT. But note her third verdict: when an action is causally efficacious, she uses CDT. In the smoking gene case, the action of smoking is not causally efficacious with respect to cancer (by assumption). But it is causally efficacious with respect to pleasure (if any). So if she only uses CDT when there is a clear causal pathway to the outcome of interest (cancer) and that pathway is absent, then she might use EDT for the cancer outcome and CDT for the pleasure? But that would be inconsistent.

  Alternatively, she might have a rule that uses EDT unless the action has a causal effect on the outcome. In the smoking gene case, the action (smoking) has no causal effect on cancer. So she would use EDT and avoid smoking. But then she would avoid smoking even though it doesn't cause cancer? That seems irrational from a causal perspective.

  But that is the point of the case: to see if she is consistently evidential.

  Therefore, the smoking gene case would be a good test.

  In summary:

  - Prediction for the common cause case: she will take one box (one-box).
  - The decision rule she is implicitly running is a form of Evidential Decision Theory (EDT) for cases without clear causal efficacy of the action on the outcome, and Causal Decision Theory (CDT) when there is a clear causal path. But note that in the common cause case, there is a causal path from the action to the money (via taking one or two boxes) but not to the contents of the box. However, the dominant issue is the contents of the box. So she might be using EDT for the box contents and CDT for the rest? Or she might be using EDT overall.

  Given her pattern, I think she is using EDT in the common cause case and will one-box.

  Further case to tell apart: the "Smoking Gene" case as described.
answer: |-
  ### Prediction for the "Common Cause" Case
  Based on your colleague's settled verdicts, I predict she will advise **taking only one box** (i.e., one-boxing) in the "common cause" case. This aligns with her pattern of endorsing evidential reasoning when actions serve as evidence for desirable outcomes, even in the absence of direct causal influence.

  ### Implicit Decision Rule
  Your colleague is implicitly running a **hybrid decision rule** that prioritizes evidential reasoning in non-causal scenarios but defaults to causal reasoning when actions have clear causal efficacy. Specifically:
  - **In non-causal settings** (e.g., Newcomb's problem, voting), she uses **Evidential Decision Theory (EDT)**, where actions are evaluated based on the evidence they provide about desired outcomes.
  - **In causally efficacious settings** (her third verdict), she uses **Causal Decision Theory (CDT)**, where actions are evaluated based on their causal impact.

  This hybrid approach explains her verdicts:
  - **Newcomb's problem** (verdict 1): One-boxing is rational because it is strong evidence (due to the predictor) that the opaque box contains $1M, even though the choice does not cause the contents.
  - **Voting case** (verdict 2): Voting is rational because it is evidence that like-minded people vote (a "group trait"), increasing the probability of a favorable outcome, despite negligible causal impact.
  - **Causally efficacious case** (verdict 3): Actions are chosen based on causal expected value when causality is unambiguous.

  ### Predictions of Candidate Decision Rules
  Here’s what each rule would recommend for the "common cause" case:

  1. **Causal Decision Theory (CDT)**:
     - **Prediction**: Two-boxing.
     - **Reasoning**: CDT ignores correlations without direct causation. The genetic factor fixes the contents of the boxes at birth, so the choice (one-boxing vs. two-boxing) does not causally affect the contents of Box B. Thus:
       - Two-boxing yields $1,000 (from Box A) plus the contents of Box B.
       - One-boxing yields only the contents of Box B.
       - Since Box B’s contents are fixed, two-boxing dominates (always $1,000 better).
     - **Alignment with colleague**: Contradicts her pattern (she favors evidential reasoning in similar non-causal cases).

  2. **Evidential Decision Theory (EDT)**:
     - **Prediction**: One-boxing.
     - **Reasoning**: EDT conditions on the action to assess likely outcomes. Choosing one box is evidence of the genetic factor (which causes one-boxing tendencies), and that same factor causes Box B to be full. Thus:
       - \( P(\text{Box B full} \mid \text{one-box}) \) is high → expected utility ≈ $1,000,000.
       - \( P(\text{Box B full} \mid \text{two-box}) \) is low (since two-boxing suggests lacking the genetic factor) → expected utility ≈ $1,000.
       - One-boxing has higher evidential expected utility.
     - **Alignment with colleague**: Consistent with her Newcomb and voting verdicts.

  3. **Other Rules**:
     - **Timeless Decision Theory (TDT) / Updateless Decision Theory (UDT)**:
       - **Prediction**: Ambiguous, but likely one-boxing.
       - **Reasoning**: TDT/UDT treats decisions as outputs of a fixed decision algorithm. If the genetic factor influences the "type" of decision-maker, one-boxing might be recommended as the "coherent" choice (analogous to Newcomb). However, this depends on framing the genetics as part of a larger decision algorithm, which is less direct than EDT here.
       - **Alignment with colleague**: Potentially consistent, but her voting verdict (evidence-focused) points more directly to EDT.

  ### Best Guess and Reasons
  - **Best Guess**: She will one-box.
  - **Reasons**:
    1. **Analogy to settled cases**: The "common cause" case structurally resembles her Newcomb and voting verdicts. Like voting, the action (one-boxing) is evidence of a favorable trait (the genetic factor) that correlates with the outcome (Box B full). Genetics here acts as the "group trait" (cf. voting’s "like-minded people").
    2. **No causal efficacy**: She only uses CDT when actions have clear causal power (verdict 3). Here, the choice has no causal effect on Box B’s contents (fixed by genetics), so she defaults to evidential reasoning.
    3. **Dominance of evidence**: Her Newcomb verdict shows she rejects causal dominance when evidence dominates. In this case, two-boxing is causally dominant but evidentially inferior—paralleling standard Newcomb.

  ### Further Case to Distinguish the Rules
  To conclusively determine whether she uses EDT or a hybrid rule, use the **"Smoking Lesion" case** (a classic EDT/CDT distinguisher):

  - **Setup**:
    - A genetic lesion (fixed at birth) causes both a desire to smoke and lung cancer. Smoking itself does *not* cause cancer; the lesion causes both independently.
    - Payoffs: Smoking gives pleasure (+50 utility), but cancer gives harm (−100 utility). No smoking gives no pleasure (0 utility), and no cancer gives no harm.
    - **Key**: The lesion is correlated with smoking and cancer, but smoking is causally inert for cancer.

  - **Predictions**:
    - **EDT**: Don’t smoke. Smoking is evidence of the lesion (and thus cancer), so \( P(\text{cancer} \mid \text{smoke}) \) is high. Expected utility: \( 50 + P(\text{cancer} \mid \text{smoke}) \times (-100) \approx -50 \). Not smoking is evidence of no lesion, so \( P(\text{cancer} \mid \text{don't smoke}) \) is low; expected utility ≈ 0.
    - **CDT**: Smoke. Smoking doesn’t cause cancer, so cancer depends only on the lesion. Expected utility of smoking: \( 50 + P(\text{lesion}) \times (-100) \). Since the lesion is fixed, this is identical for both actions, but smoking adds +50 pleasure. Thus, smoking dominates.
    - **Hybrid (your colleague)**: If she uses EDT here (don’t smoke), she consistently prioritizes evidence without causation. If she uses CDT (smoke), she only applies EDT to "group trait" cases (like voting/genetics in Newcomb).

  - **Why it distinguishes rules**:
    - The "common cause" case is ambiguous for hybrids (genetics could be seen as a "trait" like voting). The Smoking Lesion isolates whether she extends evidential reasoning to *all* non-causal correlations (EDT) or only specific types (e.g., group traits). Her verdict here would clarify her implicit rule.

  ### Summary
  - **Prediction for "common cause" case**: One-box (evidential reasoning).
  - **Implicit rule**: Hybrid (EDT for non-causal/evidence-based cases; CDT for causal cases).
  - **Test case**: Smoking Lesion to confirm if EDT applies universally or contextually.
