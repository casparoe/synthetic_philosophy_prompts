prompt: |-
  My cousin has been listening to some linguistics podcast and now he thinks he's cracked the code on why some people are rude and some aren't. He sent me this as "basically the whole thing":

  Politeness is really just one thing — saving other people's "face," which means not stepping on their toes. Every culture has the same basic rules, they just rank them differently. The Dutch are blunt because they're egalitarian and don't care about status, so they say exactly what they mean to everyone the same way. The Japanese are indirect because their whole society runs on hiearchy, so they wrap everything in softeners and would rather tell you "that might be a bit difficult" than give you a straight no. And the more indirect you are, the more polite you're being, which is why Japanese ends up being the politest language. Then white lies are just politeness doing its job — so a consequentalist has no problem with them, and Kant says they're always wrong no matter what happens.

  I've spent a bit of time in both countries and it doesn't match what I actually saw, but I can't put my finger on where he's gone wrong or whether it's just the vibe that's off. I do think there's something to the bluntness-equals-egalitarian thing, but he's clearly overplaying his hand somewhere. Could you go through it line by line and tell me what a linguist or an ethicist would nod along to, what they'd wince at, and what's just flat-out wrong? And then separately — does his bit about white lies actually follow from the politeness stuff, or did he just tack a moral conclusion onto a linguistic one?
