prompt: |-
  I'm a science journalist — long features, mostly medicine and space, which means I spend a lot of my time talking to patients, whistleblowers, grad students, and occasionally some guy who got a once-in-a-lifetime photo of a launch. Which also means I spend alot of time deciding whether money should change hands, and right now I do that by vibe, which is embarrassing. Can you build me an actual decision procedure?

  Ground it in the philosophy of commodification — the repugnant markets stuff, the arguments about which goods can and can't be bought and sold, and why. What I need from it specifically: it has to keep strait three separate kinds of objection, because they give different verdicts. There's the kind that's really about coercion or exploitation — the payment is wrong because of the power imbalance, so better terms could fix it (pay more, offer something non-cash, make sure the person actually understood what they were agreeing to). There's the kind that's about meaning, where the exchange itself is the problem and no better terms help. And there's the kind about what happens to everyone else if this becomes normal — the norm of not paying for X erodes, and now nobody can get an honest X. A step doing coercion work should end differently from a step doing meaning work, and if your procedure can't tell me which one it's using at each stage, it isn't a procedure, it's a mood.

  Requirements: something I can run in about five minutes, usually alone but sometimes with an editor on the phone. Questions in order. What counts as a sufficient answer at each step. Where it stops with a flat no. And where it hands off to a person because the question is values rather than facts — and say who that person should be. Keep the language plain enough that I could paste it into a Slack channel for the rest of the desk.

  I also want it to handle the gradient, not just cash: cash vs. paying "for their time" vs. expenses vs. a gift vs. paying someone adjacent to the source (a fixer, a translator, the source's lawyer, the source's institution). Plus who's paying — me personally, the outlet, or a fund we keep for exactly this.

  Run it on three: (1) a patient with a rare disease, I want a long on-the-record interview and her medical records, she wants $500 and says it's for her time; (2) a source who'll hand over a big hospital billing dataset if I pay him for his time, he says he'll lose his job otherwise; (3) a lab offering to fly me out and put me up for a week to see their instrument. I have a hunch the procedure is going to tell me not to pay the patient, and I want it to actually reckon with why that bothers me — it feels like protecting the newsroom's conscience at her expense, and "we don't pay sources" has a way of meaning "we'll take the story and you get nothing."

  Two more things. Newsrooms already have rules here that don't line up — you can buy a photo, you can't buy a quote, you can accept a lunch but not a flight. Tell me whether that inconsistency is defensible or just history, and where your procedure lands relative to it. And tell me what the procedure can't handle: cross-border cases where the payment is illegal for the source, cases where I'm the one who'd profit from the story, and anything where there's simply no price to compare against.

  Start with the bottom line in one sentence — the single rule you'd want me to remember if I forgot everything else — then the procedure. No preamble, no restating my question.
reasoning: |-
  We are building a decision procedure for when to pay sources in journalism, grounded in the philosophy of commodification. The procedure must distinguish between three types of objections:
  1. Coercion/exploitation: Payment is wrong due to power imbalance. Fixable by better terms (more money, non-cash, ensuring understanding).
  2. Meaning: The exchange itself is problematic, regardless of terms.
  3. Norm erosion: Paying for X might erode a norm that is important for society (e.g., honesty in X).

  We also consider the gradient of payment: cash, payment for time, expenses, gifts, payment to adjacent parties (fixer, translator, etc.), and who pays (journalist, outlet, fund).

  The procedure must be runnable in about 5 minutes, with clear questions in order, sufficient answers, and stopping points. It must also handle three test cases and address inconsistencies in existing newsroom rules.

  Bottom line: "Never pay for essential testimony or access that could compromise integrity, but compensate for burdens and avoid exploitation, while guarding against norm erosion."

  Procedure:

  1. **Is this exchange about essential testimony or access that is core to the story?**
     - *Why:* To identify if we are paying for the core content (problematic) or something else.
     - *Sufficient answer:* If yes, we are in the territory of paying for the story itself, which is typically prohibited because it can create an incentive to lie or distort. Proceed to step 2. If no (e.g., we are paying for time, access to non-core elements, or reimbursement), skip to step 3.
     - *Stop and hand off:* If unsure, hand off to the editor to decide if the payment is for core content.

  2. **Is there a way to reframe the payment so it is not for the core content?**
     - *Why:* To avoid paying for the story while still compensating for burdens.
     - *Sufficient answer:* Consider if we can pay for time, expenses, or a non-cash benefit that doesn't tie to the content. If yes, reframe and proceed to step 3. If no, then paying for core content is highly problematic (meaning objection) and the procedure stops with a flat no.
     - *Stop and hand off:* If reframing is unclear, hand off to the editor to brainstorm alternatives.

  3. **Is there a risk of coercion or exploitation?**
     - *Why:* To ensure we are not taking advantage of vulnerability.
     - *Check:* Consider the source's situation (e.g., financial desperation, lack of alternatives, power imbalance). Also, consider if the payment is so low that it's exploitative or so high that it's coercive.
     - *Sufficient answer:* If yes, proceed to step 4 to mitigate. If no, skip to step 5.
     - *Stop and hand off:* If the risk is severe and cannot be mitigated (step 4 fails), stop with a flat no.

  4. **Can we adjust the payment to avoid exploitation?**
     - *Why:* To fix the coercion/exploitation problem by changing the terms.
     - *Options:* Increase payment to a fair level, change to non-cash (e.g., gift card, donation to a charity of their choice), ensure informed consent (they understand what they are agreeing to), or involve a third party (e.g., pay a fixer instead of the source directly).
     - *Sufficient answer:* If we can adjust, then do so and proceed to step 5. If not (e.g., the source is in such a vulnerable position that any payment would be exploitative), stop with a flat no.

  5. **Is there a meaning objection? (Would the act of paying itself undermine the intrinsic value of the good, regardless of terms?)**
     - *Why:* Some things should not be for sale because it degrades their meaning (e.g., votes, human organs, certain types of testimony).
     - *Check:* Ask: Would paying for this turn something sacred or deeply personal into a commodity? Would it change how society views this act? (Example: paying for an interview about a personal tragedy might turn grief into a commodity.)
     - *Sufficient answer:* If yes, then stop with a flat no. If no, proceed to step 6.
     - *Hand off:* If the meaning concern is borderline, hand off to the editor and possibly an ethics advisor (if your outlet has one) or a senior journalist with experience in the domain.

  6. **Is there a risk of norm erosion? (Could this payment, if it became common, harm a valuable social practice?)**
     - *Why:* To prevent setting a precedent that would make it hard to get honest information without payment in the future.
     - *Check:* Consider: If every journalist paid for this type of information, would it create a market that crowds out free sharing? Would it create a two-tier system where only paid sources are heard? Would it undermine trust in journalism?
     - *Sufficient answer:* If yes, then stop with a flat no. If no, proceed to step 7.
     - *Hand off:* If the norm erosion risk is unclear, hand off to the editor and consider the broader implications.

  7. **What form of payment and who pays?**
     - *Why:* To choose the least problematic method.
     - *Options:*
       - Prefer non-cash: reimbursement for expenses, a gift (if culturally appropriate), payment for time at a reasonable rate (e.g., an expert consultant fee), or payment to an adjacent party (e.g., a translator).
       - Avoid direct cash for the story.
       - Use outlet funds (not personal) and follow outlet policies. If no policy exists, create a record of the payment and reasoning.
     - *Sufficient answer:* Choose the form and payer that minimizes objections from steps 1-6. Then the answer is yes, with the chosen method.

  **Test Cases:**

  1. **Patient with rare disease: wants $500 for her time and medical records.**
     - Step 1: Is this essential testimony? Yes, the interview and records are core to the story.
     - Step 2: Can we reframe? Instead of paying for the interview, we can pay for her time (if allowed by our policy). Reframe as compensation for time spent. Proceed.
     - Step 3: Coercion risk? She has a rare disease and may have financial burdens. Risk of exploitation? Possibly. Proceed to step 4.
     - Step 4: Adjust payment? Offer a reasonable hourly rate for her time (e.g., $50/hour for 10 hours) and cover any expenses. Ensure she understands she is not being paid for the content. Proceed.
     - Step 5: Meaning objection? Paying a patient for her story might commodify her illness. But if we are paying for time, not the story, it's less clear. Hand off to editor? (In practice, many outlets avoid paying patients. But if we proceed:) Proceed with caution.
     - Step 6: Norm erosion? If we pay patients, it might set a precedent that patients expect payment, making it harder for others to get stories without payment. This is a risk. Stop? Or hand off? (This is the key conflict.) 
       - *Decision:* Given the norm erosion risk and meaning concerns, the procedure may stop at step 6 with a flat no. But note: the patient says it's for her time, and we reframed. However, the norm erosion risk is high. This is where the procedure might say no, but it also highlights the discomfort: we are protecting the newsroom's norm at her expense. The procedure must reckon with this by explicitly stating that we are choosing to uphold the norm against paying for medical stories to avoid long-term harm to journalism and patient trust. We might instead offer non-cash alternatives (e.g., a donation to a relevant charity) or help in other ways (e.g., connecting her with patient advocacy groups). If we cannot pay, we must be transparent and explain why.

  2. **Source with hospital billing dataset: will lose job if caught, wants payment for time.**
     - Step 1: Essential testimony? Yes, the dataset is core.
     - Step 2: Reframe? We can pay for his time (as he requested) and not for the data. But note: the data is the core. Proceed with caution.
     - Step 3: Coercion risk? High: he might be acting under duress (fear of job loss). Payment might be seen as inducing him to take a risk he otherwise wouldn't. Proceed to step 4.
     - Step 4: Adjust? Increase payment to account for risk? But that might be more coercive. Alternatively, non-cash? Hard. Ensure he understands the risks? Yes, but the risk is high. This might be too exploitative to proceed. Stop with a flat no? Or hand off? 
       - *Decision:* The risk is high and adjusting payment doesn't fix the underlying coercion (he's vulnerable). Also, step 5: meaning? Paying for leaked data might commodify whistleblowing. Step 6: norm erosion? Paying for leaks might encourage more leaks for payment, which could be good or bad? But it might also incentivize reckless behavior. Given the high risk and potential illegality (which is an additional factor not in the steps), we stop at step 4 with a flat no.

  3. **Lab offering to fly me out and put me up.**
     - Step 1: Essential testimony? Not exactly. They are offering access to their instrument and facilities, but the core story might be about their work. However, this is not payment to a source but to the journalist. So skip to step 3? Actually, we need to adjust: the procedure is for paying sources, but this is about accepting benefits. We need a parallel for accepting things. Let's reframe the procedure for this case.
       - Alternatively, we can see it as the lab paying for access (to the journalist). We are not paying them; they are paying us. This is a different scenario. We need a separate branch for when we are the recipient.

  **Inconsistency in Newsroom Rules:**
  The inconsistency (buying photos but not quotes, accepting lunch but not flights) is partly historical and partly defensible. 
  - Photos: Often seen as a product of labor (time, skill, equipment) and less about testimony. A photo is a work product, not a statement. Hence, less risk of fabrication.
  - Quotes: Paying for a quote directly might induce fabrication and erode trust in the spoken word as genuine.
  - Lunch: A small token, seen as building rapport, not a substantial benefit that might create obligation.
  - Flight: Substantial benefit that might create a sense of obligation and bias.

  The procedure explains this by:
  - Step 1: A photo is not essential testimony (it's a separate work product) so we start at step 3. 
  - Step 5: Paying for a photo doesn't have the same meaning objection as paying for a personal story.
  - Step 6: Norm erosion for photos is less because they are already in a market context.

  Our procedure aligns with these rules by making distinctions between core testimony and other goods.

  **What the Procedure Can't Handle:**
  - Cross-border illegality: If paying the source is illegal in their country, that's a hard stop (legal risk trumps ethics). We must check local laws.
  - Journalist profiting: If the journalist would profit from the story (e.g., book deal), that's a conflict of interest. The procedure doesn't cover this because it's about the outlet's payment. We need a separate conflict-of-interest procedure.
  - No price to compare: In step 4, if we can't determine a fair payment, we might hand off to an editor to research standard rates or use discretion.

  **Bottom Line (one sentence):** 
  "Never pay for essential testimony or access that could compromise integrity, but compensate for burdens and avoid exploitation, while guarding against norm erosion."

  **Procedure Summary (for Slack):**

  Here's the payment decision procedure:

  1. **Core content?** 
     - Is this payment for essential testimony or access (the story itself)? 
     - Yes: Go to 2. 
     - No: Go to 3.

  2. **Reframe possible?** 
     - Can we pay for something else (like time or expenses) without paying for the story? 
     - Yes: Reframe and go to 3. 
     - No: Stop with a flat no (meaning concern).

  3. **Coercion/exploitation risk?** 
     - Is the source vulnerable, or could payment be exploitative? 
     - Yes: Go to 4. 
     - No: Go to 5.

  4. **Adjust payment?** 
     - Can we fix it (fair rate, non-cash, informed consent)? 
     - Yes: Adjust and go to 5. 
     - No: Stop with a flat no.

  5. **Meaning objection?** 
     - Would paying degrade the intrinsic value of the exchange? 
     - Yes: Stop with a flat no. 
     - No: Go to 6.

  6. **Norm erosion?** 
     - Could this payment, if common, harm society's ability to get honest information? 
     - Yes: Stop with a flat no. 
     - No: Go to 7.

  7. **Form and payer:** 
     - Choose least problematic: time vs. cash vs. gift, and who pays. 
     - Prefer non-cash, expenses, time. Use outlet funds. 
     - Then yes.

  **Hand off to editor when:**
  - Step 1: Unsure if core content.
  - Step 2: Unclear if reframing works.
  - Step 5: Borderline meaning concern.
  - Step 6: Unclear norm erosion.

  **Test Cases Results:**
  1. Patient: Likely stops at step 6 (norm erosion) -> no. But we feel bad because we are denying her compensation. The procedure forces us to confront that we are upholding a norm at her expense, and we must consider non-monetary ways to help.
  2. Source with data: Stops at step 4 (can't adjust to avoid exploitation) -> no.
  3. Lab trip: This is about accepting benefits, not paying. We need a separate flow. But in our terms: 
     - Not paying a source, but being paid for. We should run a similar procedure for accepting benefits (with steps for bias, obligation, etc.). For brevity, we might say: accepting substantial gifts (like flights) from subjects creates appearance of bias and should be avoided. The outlet should pay for the trip.

  **Final Note:** The procedure is a tool to force explicit reasoning, not replace judgment. Use it to document decisions and discuss with editors.
answer: |-
  ### Bottom Line  
  **Never pay for core testimony or access that could compromise integrity, but compensate for burdens and avoid exploitation, while guarding against norm erosion.**

  ---

  ### Decision Procedure  
  *Run these steps in order. Stop if you hit a "flat no." Hand off to your editor if marked. Use plain facts, not vibes. Time: ~5 minutes.*

  #### 1. **Is this payment for CORE CONTENT?**  
     - **What we mean:** Core content = essential testimony (e.g., quotes, on-record stories, leaked docs) or access critical to the story’s truth (e.g., medical records). Not peripheral stuff (e.g., a photo, background context).  
     - **✓ Sufficient answer:**  
       - **Yes** → Go to step 2.  
       - **No** (e.g., paying for time/expenses unrelated to the story, or for a non-core good like a photo) → Skip to step 3.  
     - **Hand off if unclear:** Editor decides if it’s core.  

  #### 2. **Can we REFRAME payment to avoid buying the story?**  
     - **What we mean:** Repackage payment so it’s not for the content itself (e.g., "for your time" instead of "for your medical records"). If reframing feels fake, it’s probably still core.  
     - **✓ Sufficient answer:**  
       - **Yes** (e.g., pay for time/effort, not the quote) → Go to step 3.  
       - **No** → **FLAT NO.** *Why: Meaning objection—paying for core content commodifies truth and can’t be fixed.*  

  #### 3. **Is there COERCION or EXPLOITATION risk?**  
     - **What we mean:** Power imbalance? (e.g., source is poor, desperate, or misinformed). Could payment pressure them into harm (e.g., job loss, legal risk)?  
     - **✓ Sufficient answer:**  
       - **Yes** → Go to step 4.  
       - **No** → Skip to step 5.  

  #### 4. **Can we FIX the exploitation?**  
     - **What we mean:** Adjust terms to be fair—e.g., higher pay, non-cash (gift card, donation), secure consent, or pay an adjacent party (e.g., their lawyer).  
     - **✓ Sufficient answer:**  
       - **Yes** (e.g., pay a fair wage for time, use a charity donation) → Go to step 5.  
       - **No** (e.g., source is too vulnerable, or terms can’t mitigate risk) → **FLAT NO.** *Why: Coercion objection—payment harms the source.*  

  #### 5. **Is there a MEANING objection?**  
     - **What we mean:** Would paying degrade something sacred (e.g., grief, trust, public duty)? Ask: "If this were public, would it feel slimy?"  
     - **✓ Sufficient answer:**  
       - **Yes** → **FLAT NO.** *Why: Meaning objection—payment corrupts the act itself.*  
       - **No** → Go to step 6.  
     - **Hand off if borderline:** Editor + ethics advisor (if available).  

  #### 6. **Is there NORM EROSION risk?**  
     - **What we mean:** If this payment became normal, would it harm society? (e.g., no one shares medical stories without pay, or leaks only happen for cash).  
     - **✓ Sufficient answer:**  
       - **Yes** → **FLAT NO.** *Why: Norm objection—this risks a world where honesty has a price tag.*  
       - **No** → Go to step 7.  
     - **Hand off if unclear:** Editor + senior journalist.  

  #### 7. **Set PAYMENT FORM and PAYER.**  
     - **What we mean:** Choose the least problematic option.  
     - **Gradient (least to most risky):**  
       1. **Expenses only** (e.g., travel, copies).  
       2. **Non-cash gift** (e.g., gift card, meal—if culturally normal).  
       3. **Payment for time** (e.g., hourly rate for consultation, not testimony).  
       4. **Cash for goods** (e.g., buying a photo).  
       5. **Cash for access** (avoid if possible).  
     - **Payer (least to most risky):**  
       1. **Outlet/fund** (always prefer this).  
       2. **You** (only if tiny and receipted).  
     - **✓ Sufficient answer:** Pick the safest combo → **YES, PAY.**  

  ---

  ### Test Case Results  
  #### (1) Patient with rare disease: $500 for interview + medical records ("for her time")  
  - **Step 1:** Yes—core content (testimony + records).  
  - **Step 2:** Can reframe as "time" payment? Maybe, but records are core. → *Hand off to editor.* If reframed as time, proceed.  
  - **Step 3:** Yes—coercion risk (vulnerable patient, financial need).  
  - **Step 4:** Fixable? Pay for time at fair rate (e.g., $50/hour) + expenses, not records. Ensure she understands. → Proceed.  
  - **Step 5:** Meaning objection? Paying for illness stories feels transactional. → **Hand off to editor.** Likely "yes" if reframed well.  
  - **Step 6:** Norm erosion? High risk—if routine, patients stop sharing freely. → **FLAT NO.**  
    - **Why it bothers you:** The procedure blocks payment to protect norms, but the patient loses out. Fix: Offer non-cash help (e.g., connect her to advocacy groups, cover expenses). The rule isn’t about newsroom conscience—it’s preventing a world where patients become paid performers.  

  #### (2) Source with hospital billing data: Payment to avoid job loss  
  - **Step 1:** Yes—core content (leaked dataset).  
  - **Step 2:** Reframe as "time"? Unlikely—data is the story. → **FLAT NO.** (Meaning objection: paying for leaks commodifies whistleblowing).  
  - *Procedure stops here.* Even if you continued:  
    - Step 3: Coercion risk? Extreme (job threat).  
    - Step 4: Can’t fix—payment amplifies risk. → **FLAT NO.**  

  #### (3) Lab offering flight/lodging to see their instrument  
  - **Step 1:** No—not core testimony (it’s access to a tool, not a quote). → Skip to step 3.  
  - **Step 3:** Coercion/exploitation? Reverse risk—they might influence you.  
  - **Step 5:** Meaning? Accepting gifts feels like a conflict. → **Hand off to editor.**  
  - **Step 6:** Norm erosion? Yes—if routine, labs "buy" coverage. → **FLAT NO.**  
  - **Fix:** Outlet pays for the trip.  

  ---

  ### Inconsistency in Newsroom Rules  
  **Is it defensible?** Partly. Your procedure explains why:  
  - **Photos:** Not core testimony (step 1 → no), so less risk. Paying for labor (e.g., a once-in-a-lifetime shot) is often step 7 → yes.  
  - **Quotes:** Core testimony (step 1 → yes), so usually step 2 fails → flat no (meaning objection).  
  - **Lunch vs. flight:** Lunch is a small gift (step 7 → low risk). A flight is substantial, creating bias/norm risks (steps 5-6 → often no).  
  **Verdict:** Inconsistency isn’t random—it maps to the philosophy. Your procedure systematizes it.  

  ---

  ### What the Procedure Can’t Handle  
  - **Cross-border illegality:** If payment is illegal for the source (e.g., bribes), stop immediately. Not ethical or safe.  
  - **Journalist profits:** If you’d personally gain (e.g., book deal), this is a conflict of interest. Hand off to editor before starting.  
  - **No price benchmark:** In step 4 (fixing exploitation), if you can’t determine fair terms, hand off to editor + legal.  
  - **Gifts with strings:** If a "gift" implies reciprocity, treat it as payment (start at step 5).  

  ---  
  **Slack-ready summary:**  
  > **Payment Decision Cheat Sheet**  
  > 1. **Core content?** Yes → 2. No → 3.  
  > 2. **Reframe payment off the story?** Yes → 3. No → FLAT NO (meaning).  
  > 3. **Coercion/exploitation?** Yes → 4. No → 5.  
  > 4. **Fixable?** Yes → 5. No → FLAT NO (coercion).  
  > 5. **Meaning wrecked?** Yes → FLAT NO. No → 6.  
  > 6. **Norm erosion?** Yes → FLAT NO. No → 7.  
  > 7. **Pick payment form/payer → YES.**  
  > **Hand off to editor:** Steps 1, 5, or 6 unclear.  
  > **Flat no:** Steps 2, 4, 5, or 6 fail.  
  > **Remember:** Never pay for core truth. Compensate burdens. Kill norms last.
