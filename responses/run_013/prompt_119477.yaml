answer: |-
  ## Nonfeasance Assurance Group: Policyholder Handbook & Customer FAQ

  **Welcome to Nonfeasance Assurance Group (NAG).** We provide unparalleled peace of mind by insuring you against financial liability arising *exclusively* from harms you demonstrably **caused by not acting**. Our unique coverage focuses on the significant, yet often overlooked, realm of omissions. Please review this document carefully to understand the scope and operation of your Nonfeasance Liability Policy (NLP).

  **Frequently Asked Questions (FAQ)**

  1.  **What exactly does my Nonfeasance Liability Policy cover?**
      Your NLP covers compensatory damages you become legally obligated to pay for bodily injury or property damage suffered by a third party, *but only* if those damages were directly and proximately **caused by your failure to perform a specific action** that you had a duty to perform. Coverage is triggered by demonstrable inaction, not by active conduct.

  2.  **What kinds of things *aren’t* covered?**
      The NLP explicitly excludes coverage for:
      *   Any harm caused by an affirmative act performed by you (e.g., striking someone, driving a vehicle into an object).
      *   Harm arising from your failure to act where no specific, identifiable duty to act existed.
      *   Harm that would have occurred identically regardless of any action you could have taken (see "But-For Causation" below).
      *   Harms covered under standard liability policies (e.g., auto collision, general negligence involving action).

  3.  **How do you determine if my *inaction* caused the harm? Isn’t that unusual?**
      Causation is established through rigorous application of the "But-For" test: *But for* your specific failure to act (and *only* that failure), would the harm have occurred? If the harm would have happened anyway, your inaction was not the cause. If the harm would *not* have happened if you had acted as required, then your inaction is the operative cause. This is a fundamental principle of causal attribution distinct from actions.

  4.  **But I fail to do millions of things every day. How do you know *which* failure caused the harm?**
      NAG employs a proprietary Causal Omission Identification Protocol (COIP). This protocol isolates the single, specific omission that meets the But-For test *and* corresponds to a duty you held at the precise moment preceding the harm. We meticulously filter out irrelevant non-actions (e.g., failing to flap your arms to prevent continental drift) to identify the legally significant omission pertinent to the claim.

  5.  **I heard someone say that any action I *do* take could be seen as failing to prevent something else. Doesn’t that make everything an omission?**
      NAG recognizes a clear conceptual distinction between an act and an omission. An act involves initiating a change in the state of the world. An omission involves the non-initiation of such a change. While an act may prevent certain outcomes, it remains fundamentally an act. Redescribing a specific act *as* the omission of *some other hypothetical act* represents a category error and falls outside the scope of the NLP, which requires a pure, identifiable omission as the cause. Our COIP is designed to resist such recharacterizations.

  6.  **Can you give me an example of a covered claim?**
      *   **Scenario:** You are a certified lifeguard on duty at a public pool. You observe a swimmer struggling and clearly drowning. You have a clear professional and legal duty to attempt rescue. You fail to blow your whistle, fail to throw a life ring within easy reach, and fail to enter the water. The swimmer drowns.
      *   **NAG Analysis:** But for your failure to perform your specific, duty-bound rescue actions (blowing the whistle, throwing the ring, entering the water), the swimmer would not have drowned. Your *inactions* are the direct and proximate cause of the harm. Claim **Approved**.

  7.  **Can you give me an example of a *denied* claim?**
      *   **Scenario:** While walking down the street, you see a toddler wander into the path of an oncoming, speeding bus. You could potentially have yelled a warning or rushed to push the child out of the way, but you did neither. The child is struck and injured.
      *   **NAG Analysis:**
          *   **Denial Reason 1 (But-For Test):** The bus was speeding and the child wandered unpredictably. Expert analysis shows the bus driver could not have stopped in time even if you had yelled. Therefore, the child would likely have been struck *regardless* of your action or inaction. Your failure to act was not the But-For cause.
          *   **Denial Reason 2 (Duty Analysis):** Absent a specific relationship (parent, guardian, designated protector) or role (e.g., crossing guard), you generally owe no affirmative legal duty to rescue or warn a stranger under common law principles. Your failure to act, while perhaps morally regrettable, did not breach a legal duty covered by the NLP. Claim **Denied**.

  **Sample Claims & Outcomes (Illustrative Purposes Only)**

  | Claim Scenario                                      | Harm                      | Duty Present? | But-For Cause? | Outcome  |
  | :-------------------------------------------------- | :------------------------ | :------------ | :------------- | :------- |
  | **Homeowner fails to repair known rotten deck rail** | Guest falls, injured      | Yes (Premises)| Yes             | Covered  |
  | **Doctor on vacation fails to answer ER call**      | Patient deterioration     | Yes (Medical) | Yes (if timely intervention would have helped) | Covered  |
  | **Driver fails to brake at red light**              | Collision, other driver injured | **No** (Affirmative act of driving caused collision; failure to brake is part of the *act*) | N/A | **Excluded** |
  | **Passerby fails to stop mugging**                  | Mugging victim injured    | No            | Uncertain       | Denied   |
  | **Plant owner fails to water neighbor's prize orchids (agreed duty)** | Orchids die               | Yes           | Yes             | Covered  |
  | **Same Plant owner:** Orchids die *after* owner watered them with saltwater | Orchids die               | **No** (Death caused by *act* of salting) | N/A | **Excluded** |
  | **Astronomer fails to warn of asteroid**            | Global catastrophe        | **Yes** (If duty existed via role) | **Yes** (But-For prevention) | **Covered** |

  **Important Policy Conditions & Exclusions (Fine Print Excerpts)**

  *   **Section 7.1: Causation Requirement:** Coverage applies solely where the Insured’s liability arises from bodily injury or property damage **proximately caused by the Insured’s omission**. An omission is defined as the **non-performance of a specific, identifiable act**. The chain of causation must be direct and unbroken. **No coverage exists for liability arising from any affirmative act or series of acts by the Insured.** Mere "but for" connection is necessary but insufficient; the omission must be the proximate cause.
  *   **Section 7.3: But-For Causation Standard:** A covered omission is established as the factual cause of harm **only if the harm would not have occurred in the identical manner and at the identical time had the omitted act been performed.** If the harm was inevitable due to other sufficient causes operating independently of the Insured’s omission, or if the harm would have occurred regardless of any action the Insured could have taken, coverage is excluded. **Where multiple omissions by different parties each independently satisfy the But-For test in relation to the same harm, coverage is apportioned based on the Insured’s relative share of causal responsibility for the omission.** *[Addresses overdetermination/duplicate causation]*
  *   **Section 7.5: Duty Requirement:** The omission must constitute a **breach of a legally cognizable duty owed by the Insured to the injured party**. The existence and scope of such duty shall be determined solely by applicable law. **No coverage exists for the failure to perform acts where no such legal duty exists, regardless of moral considerations or the foreseeability of harm.** The duty must be specific and applicable at the precise time and place of the omission. *[The clause doing the real work]*
  *   **Section 7.7: Identification of the Covered Omission:** Coverage is limited to liability stemming from **the single, specific omission identified by NAG as meeting the But-For test and Duty Requirement for the specific harm claimed.** The identification process excludes consideration of hypothetical alternative omissions or recharacterizations of the Insured’s actual conduct as an omission. **The Insured’s failure to perform an infinite number of other, non-duty-bound acts is irrelevant to coverage.** *[Attempts to handle the "infinite omissions" and "redescription" problem]*
  *   **Section 7.9: Exclusions:** In addition to the exclusions listed elsewhere, coverage is specifically excluded for liability arising from: (a) The Insured’s failure to prevent spontaneous combustion; (b) The Insured’s failure to alter the laws of physics; (c) The Insured’s failure to exist in multiple locations simultaneously to prevent unrelated harms; (d) Liability that would exist only if the Insured’s non-duty-bound omission were considered a cause. *[Highlights the absurd boundaries]*
  *   **Section 8.2: Limits of Liability:** Coverage is subject to the policy limits stated in the Declarations. **Coverage for catastrophic events proximately caused by a covered omission (e.g., failure of designated individual to press known asteroid deflection button) is capped at the per-occurrence limit.** *[Acknowledges the potential scope while limiting exposure]*
