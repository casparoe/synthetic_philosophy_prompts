  "Now, Environmental Stakeholder 6, I believe you have a commitment too?"

  Environmental Stakeholder 6: "Yes, my commitment is that Environmental Research must get at least 25 hours because of the climate emergency."

  "Check Proposal C: Environmental gets 20 -> violates. So now C is not acceptable. We only have Proposal B left? But let's check B: Environmental gets 50 -> okay, Arts gets 30 -> okay, Medical gets 20 -> which meets the Medical commitment of 20. So B is acceptable? But we already voted and C won, but now C is invalid. So what do we do?"

  Facilitator: "We have to decide: do we honor Environmental Stakeholder 6's commitment? How do we decide which commitments are valid? And who gets to decide that?"

  ### Group Discussion (10 minutes)
  Let the group discuss how to handle the commitments. They might suggest:
     - Voting on whether to accept the commitment.
     - Setting up a committee to review commitments.
     - Ignoring commitments that are not universal.

  But then ask: "How do we choose the rules for this process? It's turtles all the way down."

  ### Debrief (15 minutes)
  "Let's step back and map this to the real challenge of aligning AI with human values.

  - We saw that majority voting, which seems fair, can lead to cycles. There's no neutral way to aggregate preferences.
  - We tried to protect non-negotiable commitments, but then we had to decide which commitments count. That decision itself is a value judgment, and there's no neutral way to make it.
  - Every attempt to create a fair procedure requires making choices about what counts as fair, and those choices are themselves value-laden.

  In AI alignment, we face these same issues:

  - **Summing welfare**: If we try to add up everyone's preferences (like with chips), we have to decide how to weigh them and what counts as welfare.
  - **Majority rule**: It's unstable with multiple options and can be manipulated.
  - **Prioritizing the worst-off**: We might want to help those who are least well-off, but how do we measure that?
  - **Walling off spheres**: We might say certain rights or values are off-limits, but then we have to define those spheres, and that definition is contested.

  And remember, in the real world, it's even harder because:
     - Not everyone is represented in the room.
     - Values change over time.
     - We have to consider future generations and non-human life.

  So when we say 'align AI to human values', we must ask: whose values, and by what method?"

  **Predictable problems:**
  - The groups might not vote as blocks. Solution: emphasize in the instructions that they should vote based on their group's allocation.
  - Time might run out. Keep strict time limits.
  - The commitment discussion might not lead to the meta-level. The facilitator must guide: "How do we decide which commitments to respect?"
  - Someone might question the setup. Acknowledge it's a simplification.

  This should create the desired experience.
