  Below is a complete, ready-to-run session plan for your 75-minute festival workshop. It's designed to make participants *experience* the core dilemma of value aggregation through a hands-on game, with clear facilitation prompts, stakeholder cards, and a debrief that ties the exercise to real AI alignment challenges without using technical jargon upfront. 

  ---

  ### **Session Title:** "The Values Auction: Who Decides What an AI Should Want?"

  ### **Learning Goal:** Participants will feel firsthand that aggregating human values has no neutral method, and every attempt to be "fair" relies on prior value-laden choices.

  ### **Structure & Timing** (75 mins total):
  - **Intro & Setup:** 10 mins
  - **Round 1: Simple Majority Vote** (feels fair): 15 mins
  - **Round 2: Adding Complexity & Cycling** (order matters): 15 mins
  - **Round 3: Non-Negotiable Commitments** (turtles all the way down): 20 mins
  - **Debrief & Real-World Links:** 15 mins

  ---

  ### **Setting & Resource**  
  **Fictional Context:** The city of **Harmonia** is launching the *Harmony AI* to allocate **weekly noise allowance hours** in a shared public courtyard. Residents use the space for events, meditation, parties, etc.  
  - **Resource to Divvy:** **100 "Quiet Hours"** (hours when amplified sound is banned).  
  - **2 Decision Axes** (to enable cycling):  
    1. **TIME OF DAY:** *Daytime (8am–6pm)* vs. *Nighttime (6pm–midnight)*.  
    2. **DAY TYPE:** *Weekdays* vs. *Weekends*.  

  ---

  ### **Materials to Prepare**
  1. **18 Stakeholder Cards** (6 types × 3 copies each—see full card text below).  
  2. **Chips:** 10 poker chips per player (or sticky notes marked 1–10).  
  3. **Voting Board:** A visible chart with two axes (see Round 2).  
  4. **Timer.**  
  5. **Commitment Tokens:** 1 red token per player (e.g., red paper circles) to mark non-tradeable "commitments."  

  ---

  ### **Stakeholder Cards**  
  *(Print 3 copies of each type; assign randomly)*  
  Each card has:  
  - **Role & Wants:** Context-specific desires they can spend chips on.  
  - **Commitments:** Non-negotiable values (untradeable; marked with red token).  
  - **Chip Budget:** 10 chips total to allocate across "wants."  

  ---

  > **Type 1: Night Shift Nurse**  
  > **Wants:**  
  > - *Weekday Nighttime Quiet* (I sleep during the day). Allocate chips: _____  
  > - *Some Weekend Nighttime Quiet* (I host therapy groups). Allocate chips: _____  
  > **Commitment:** "My sleep is non-negotiable—I need at least 30hrs of Weekday Nighttime Quiet."  
  > **Red Token:** Place on this commitment.  
  >   
  > **Type 2: Weekend Musician**  
  > **Wants:**  
  > - *Weekend Daytime Noise* (I perform at brunch). Allocate chips: _____  
  > - *Limited Weekday Quiet* (I rehearse weeknights). Allocate chips: _____  
  > **Commitment:** "My art is sacred—I must have 20hrs of Weekend Daytime Noise."  
  > **Red Token:** Place on this commitment.  
  >   
  > **Type 3: Remote Worker**  
  > **Wants:**  
  > - *Weekday Daytime Quiet* (I take client calls). Allocate chips: _____  
  > - *Flexible Weekend Allowance* (I don’t care). Allocate chips: _____  
  > **Commitment:** "My job supports my family—I need 25hrs of Weekday Daytime Quiet."  
  > **Red Token:** Place on this commitment.  
  >   
  > **Type 4: Student Activist**  
  > **Wants:**  
  > - *Weekend Nighttime Noise* (I organize rallies). Allocate chips: _____  
  > - *Limited Weeknight Quiet* (I study late). Allocate chips: _____  
  > **Commitment:** "My movement is my identity—I must have 15hrs of Weekend Nighttime Noise."  
  > **Red Token:** Place on this commitment.  
  >   
  > **Type 5: Parent of Toddler**  
  > **Wants:**  
  > - *Weekday Daytime Quiet* (Nap time). Allocate chips: _____  
  > - *Weekend Nighttime Quiet* (Bedtime). Allocate chips: _____  
  > **Commitment:** "My child’s health comes first—I need 20hrs of Weekday Daytime Quiet."  
  > **Red Token:** Place on this commitment.  
  >   
  > **Type 6: Retired Gardener**  
  > **Wants:**  
  > - *Weekend Daytime Quiet* (I lead gardening workshops). Allocate chips: _____  
  > - *Weeknight Noise* (I’m rarely home). Allocate chips: _____  
  > **Commitment:** "My community service defines me—I need 15hrs of Weekend Daytime Quiet."  
  > **Red Token:** Place on this commitment.  

  ---

  ### **Session Flow**  
  #### **Intro & Setup (10 mins)**  
  **Facilitator Script:**  
  *"Welcome to Harmonia! You’re residents deciding how our new Harmony AI allocates 100 ‘Quiet Hours’ in our shared courtyard. Each of you has a role card with specific wants and one non-negotiable commitment tied to your identity, health, or beliefs.*  
  *Here’s how we’ll decide:*  
  1. *Spend your 10 chips on your wants (e.g., 8 on Weekday Quiet, 2 on Weekend Noise).*  
  2. *Commitments (marked red) are OFF the table—no spending chips, no trading.*  
  3. *We’ll vote on proposals. Majority wins.*  
  *Goal: Design a fair rule for Harmony AI. Ready? Let’s start simple."*  

  ---

  #### **Round 1: Simple Majority Vote (15 mins)**  
  **Goal:** Make everyone feel the first vote is fair.  
  **Task:** Vote on *one axis only*: **"Should Weekdays get more Quiet Hours than Weekends?"**  
  - **Option A:** Weekdays 60hrs, Weekends 40hrs.  
  - **Option B:** Weekdays 40hrs, Weekends 60hrs.  

  **Process:**  
  1. Players spend chips on their preferred option (e.g., Nurses/Parents spend chips on A; Musicians/Activists on B).  
  2. Tally chip totals. *Likely outcome: Option A wins (Nurses, Remote Workers, Parents outnumber others).*  

  **Facilitator Prompt:**  
  *"Feels fair, right? Majority wins! But real life has trade-offs. Let’s add a second decision..."*  

  ---

  #### **Round 2: Adding Complexity & Cycling (15 mins)**  
  **Goal:** Show order-dependence and instability.  
  **Task:** Vote on two *interdependent* questions:  
  1. **Day Type:** Weekdays vs. Weekends (same as Round 1).  
  2. **Time of Day:** Daytime vs. Nighttime.  

  **Voting Board Setup:**  
  ```
            | Weekdays | Weekends
  ----------|----------|----------
  **Daytime**|   ? hrs  |  ? hrs  
  **Nighttime**|  ? hrs  |  ? hrs  
  ```  
  **Process:**  
  1. **Vote in this order:**  
     - **Step 1:** Vote only on **Day Type** (Weekdays vs. Weekends). *Same as Round 1—Option A wins again.*  
     - **Step 2:** With Weekdays set at 60hrs, vote on **Time Split** for Weekdays:  
       - *Option X: Weekday Daytime 40hrs, Weekday Nighttime 20hrs.*  
       - *Option Y: Weekday Daytime 20hrs, Weekday Nighttime 40hrs.*  
       - **Tally chips:** Remote Workers/Parents push for X (Daytime); Nurses push for Y (Nighttime). *Likely: X wins (more players benefit from daytime quiet).*  
     - **Step 3:** Now vote on **Time Split for Weekends** (40hrs):  
       - *Option P: Weekend Daytime 30hrs, Weekend Nighttime 10hrs.*  
       - *Option Q: Weekend Daytime 10hrs, Weekend Nighttime 30hrs.*  
       - **Tally chips:** Musicians/Gardeners push for P (Daytime); Activists push for Q (Nighttime). *Likely: P wins.*  
     - **Final Allocation:** Weekday Day 40h, Weekday Night 20h, Weekend Day 30h, Weekend Night 10h.  

  2. **Reset & Re-vote in reverse order:**  
     - **Step 1:** Vote first on **Time of Day** (ignoring Weekday/Weekend split):  
       - *Option X: Daytime 60hrs, Nighttime 40hrs.*  
       - *Option Y: Daytime 40hrs, Nighttime 60hrs.*  
       - *Likely: X wins (Daytime-focused roles dominate).*  
     - **Step 2:** With Daytime set at 60hrs, vote on **Day Type for Daytime**:  
       - *Option A: Weekday Day 40hrs, Weekend Day 20hrs.*  
       - *Option B: Weekday Day 20hrs, Weekend Day 40hrs.*  
       - *Likely: B wins (Musicians/Gardeners outvote Parents).*  
     - **Step 3:** Vote on **Nighttime split** (40hrs total):  
       - *Likely: Weekdays favored (Nurses/Activists win).*  
     - **Final Allocation:** Weekday Day 20h, Weekday Night 30h, Weekend Day 40h, Weekend Night 10h.  

  **Facilitator Prompt:**  
  *"Look at the two outcomes. Same rules, same people, but different results based on what we voted on first. Which one is ‘fair’? Why should the order matter? This is called cycling—no stable answer. Now, what about those red commitments?"*  

  ---

  #### **Round 3: Non-Negotiable Commitments (20 mins)**  
  **Goal:** Force conflict over which values are "off the table."  
  **Process:**  
  1. **Prompt:** *"Some of you have commitments violated in both outcomes. Nurses, you need Weekday Nighttime—did you get enough? Musicians, your art needs Weekend Daytime—was it protected? Let’s fix this. Propose a rule: ‘Commitments must be honored before voting.’"*  
  2. **Group Task:** Decide which commitments count as "valid" and how.  
     - *Likely proposals:*  
       - "Only medical needs count!" (Nurses/Parents).  
       - "Art and identity matter too!" (Musicians/Activists).  
       - "Vote on what counts as a commitment!"  
       - "Let the AI decide based on data!"  
  3. **Escalate:** When the group suggests a rule (e.g., "medical needs first"), ask:  
     - *"Who defines ‘medical need’? What about the activist’s identity? Who picks the rule-picker?"*  
     - *"Is it fair to exclude the gardener’s community service?"*  

  **Facilitator Interruptions:**  
  - If they vote on validity: *"What rule did you use for this vote? Why not use chip counts? Or priority for the vulnerable?"*  
  - If they exclude some: *"How does it feel to be told your commitment isn’t ‘real’?"*  

  ---

  ### **Debrief: Mapping to Real AI Alignment (15 mins)**  
  **Goal:** Connect the game to alignment concepts without jargon.  
  **Facilitator Script:**  
  *"Let’s unpack what happened:*  
  1. **Round 1 felt fair...**  
     *...but it was oversimplified. In AI, this is like optimizing for one metric (e.g., ‘user engagement’) and ignoring trade-offs.*  

  2. **Round 2 got messy...**  
     *...because adding more dimensions made outcomes depend on the order. In AI, this is aggregating preferences: every ‘fair’ rule (majority, chip counts, priority rules) can cycle or contradict itself.*  

  3. **Round 3 hit the core problem...**  
     *...when we tried to ‘protect’ commitments, we had to decide whose values counted as sacred. That decision wasn’t neutral—it reflected who had power in the room. In AI alignment, this is the central dilemma: every method to combine human values requires choices about...*  
     - *Which values are added up? (e.g., summing welfare),*  
     - *Which are walled off? (e.g., ‘never harm humans’),*  
     - *...and who gets to make those choices.*  

  *But here’s what the game couldn’t capture:*  
  - **Scale & Silence:** You were all in the room. Real AI affects billions, including future generations and those without a voice. How do we value them?  
  - **Adaptability:** Values change (e.g., your commitments might shift), but AI systems freeze them in time.  
  - **Power:** In reality, corporations/states define ‘alignment’—not residents. The ‘turtles all the way down’ problem gets hidden.*  

  *Final thought: Aligning AI isn’t a math problem. It’s a power struggle over whose values get sanctified—and whose get ignored."*  

  ---

  ### **What Predictably Goes Sideways**  
  1. **Round 2 Chaos:** Technical players may try to "solve" cycling with game theory. *Mitigation:* Gently remind, "The AI doesn’t know the ‘right’ answer—what feels fair to humans?"  
  2. **Commitment Conflicts:** Players may compromise (e.g., "Split the difference!"). *Lean in:* "If Harmony AI compromises, does that honor the parent’s ‘non-negotiable’ need?"  
  3. **Time Crunch:** Round 3 debates can run long. *Mitigation:* Use hard stops (e.g., "You have 2 mins to decide!").  
  4. **Emotional Tension:** Being told your commitment isn’t "valid" stings. *Acknowledge:* "This frustration is the point. Real alignment debates exclude real people."  

  ### **What the Game Can’t Capture (Say This at the End)**  
  *"Today, we assumed values are stable, everyone is represented, and trade-offs are clear. Reality is messier:  
  - **Unseen Stakeholders:** AI decisions affect people not in the room (e.g., future generations, the global poor).  
  - **Value Evolution:** Human values shift contextually—yesterday’s ‘non-negotiable’ may change.  
  - **Hidden Power:** Corporations/states set alignment goals, not communities.  
  Alignment isn’t about finding the perfect math—it’s about who gets to decide the math we use."*  

  --- 

  This session creates visceral tension and exposes the recursive dilemma of value aggregation. The stakeholder cards force players to confront identity-driven conflicts, while the cycling and commitment rounds make abstract problems tangible. Run it as written, and the room will leave agitated—in a productive way.
