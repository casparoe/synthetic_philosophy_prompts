prompt: |-
  Ok so I'm in this applied ethics seminar and I have to kick off discussion next week, and I've gotten myself tangled up in something that I think is more conceptual than empirical, and I want an actual example worked out rather than a list of 'positions.' The thing I keep circling is the beef vs. chicken comparison, but with crop cultivation folded in, which is where it gets wierd. If you just count how many animals have to die per thousand calories, beef starts looking surprisingly good — one cow is a lot of meals, and if it's raised on pasture then most of what it ate was grass nobody had to run a combine over — while chicken is this tiny animal eating grain that got harvested, and harvests kill mice and birds and bugs out in the field. So the 'obviously chicken is the lighter choice' thing sort of falls apart on that metric. But I dont buy that the metric settles it either, because a mouse killed by a combine and a cow that spends a year and a half in a feedlot aren't the same kind of harm, and I've also seen people try to patch this by weighting animals by neuron count or something, which to me just looks like smuggling in a theory of mind so the arithmetic comes out right. My roommate also keeps saying the cow wouldn't exist at all if nobody ate beef, which I think is a seperate can of worms, but maybe not.

  What I want from you is an example of a conceptual issue that comes up in this kind of comparison — one specific one, spelled out, not a survey of views. Like: here's a place where the question 'is chicken worse than beef, or is beef worse than chicken?' turns out to be ill-posed, or where the answer flips depending on a choice you can't read off the biology or the farm data at all, and here's why people who know the numbers still split on it. Show me the machinery — what exactly you have to assume to even make the comparison, and what falls apart if you don't assume it.

  And please be upfront about which parts of this are actually settled, like which empirical bits, versus which parts are genuinely contested among people who work on animal welfare and population ethics, and don't just present whichever view you find most convincing as if it were the consensus. Write it in American English, I'm sending this to my professor who is picky about that.
