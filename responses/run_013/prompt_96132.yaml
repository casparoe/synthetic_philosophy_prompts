  The key here is to identify a conceptual bottleneck. I think "The Problem of Disparate Harms" is a good angle. This addresses how different types of suffering aren't directly comparable. For example, the intense but contained suffering of a feedlot cow versus the sudden death of field animals during harvesting. 

  I need to explain why this is a conceptual issue. The user is pointing out that aggregating deaths ignores qualitative differences. So the core problem is that harm isn't a single metric. The user also mentioned neuron counts as a flawed solution. I should mention why this is problematic—it assumes cognition is the only moral factor, which is a value judgment, not a scientific fact.

