prompt: |-
  I teach a graduate seminar on Aquinas's political thought, and every year the same objection comes up when we reach the sedition question. Here is the passage that provokes it, from the reply to the third objection in the Summa's II-II, q. 42, a. 2: "A tyrannical government is not just, because it is directed, not to the common good, but to the private good of the ruler, as the Philosopher states (Polit. iii, 5; Ethic. viii, 10). Consequently there is no sedition in disturbing a government of this kind, unless indeed the tyrant's rule be disturbed so inordinately, that his subjects suffer greater harm from the consequent disturbance than from the tyrant's government. Indeed it is the tyrant rather that is guilty of sedition, since he encourages discord and sedition among his subjects, that he may lord over them more securely; for this is tyranny, being conducive to the private good of the ruler, and to the injury of the multitude."

  Set against this is II-II, q. 64, a. 3, on whether a private individual may kill a man who has sinned, whose corpus runs: "it is lawful to kill an evildoer in so far as it is directed to the welfare of the whole community, so that it belongs to him alone who has charge of the community's welfare." Its reply to the third objection adds that a private individual may do anything for the common good "provided it harm nobody," but where it harms another it may not be done "except by virtue of the judgment of the person to whom it pertains to decide what is to be taken from the parts for the welfare of the whole."

  Help me give my students a coherent account of how these two texts hang together. In particular: (1) what does Aquinas mean by "disturbing" a tyrannical government in q. 42, and who is the subject of that disturbance — the whole people, public officials, or any private person? (2) Does the "unless" clause make the permissibility of resistance turn on a consequentialist comparison of harms, and if so, is that comparison to be made by the resister, or does it instead function as a limit on what counts as sedition at all? (3) Given q. 64's restriction of lethal force to those who hold charge of the community, is the q. 42 permission to disturb a tyrant confined to non-lethal resistance, or does Aquinas leave room for killing a tyrant by someone lacking public authority — and how should I relate this to his treatment of tyranny in the De regno?

  Say where your reading is most likely to fail: which textual or doctrinal consideration would push you to a different verdict on the q. 42/q. 64 relation, and what you take to be the weakest link in the interpretation you offer.
reasoning: |-
  Okay, the user is teaching a graduate seminar on Aquinas's political thought and encounters a recurring objection about the tension between two passages: one on resisting tyranny (II-II q.42 a.2) and another on who can lawfully kill evildoers (II-II q.64 a.3). They need a coherent framework to present to students, specifically addressing three questions: the meaning of "disturbing" tyranny and who can do it; whether the "unless" clause implies consequentialist reasoning; and whether lethal force against tyrants is permissible for private individuals. 

  Hmm, the core tension is between Aquinas's apparent endorsement of disturbing unjust rulers in q.42 and his strict limitation of lethal authority to public officials in q.64. The user's students likely struggle with whether Aquinas contradicts himself or has a hidden hierarchy of principles. 

  First, unpacking "disturbing": The Latin turbare implies disruption but not necessarily violence. Aquinas contrasts this with seditio (unjust disturbance) by making the justness depend on the regime's legitimacy. So disturbing tyranny isn't sedition because tyranny itself is already a disturbance of order. But who acts? The passive voice ("there is no sedition in disturbing") avoids specifying actors, but later references to the tyrant "encouraging discord among his subjects" suggest collective action. The "whole people" (universitas) appears in De Regno as resisting via public authority—but q.42's phrasing ("his subjects") could include officials or spontaneous groups. Key nuance: Aquinas never says private individuals can initiate lethal force. 

  The "unless" clause: It's not full consequentialism but a teleological brake. Resistance mustn't create worse disorder than tyranny—a nod to natural law's preference for lesser evil. But Aquinas doesn't say who makes this judgment. Historically, he'd likely defer to prudentia by those with communal standing (e.g., nobles, clergy), not random individuals. The clause defines the boundary of sedition: Even against tyranny, disproportionate disruption becomes sinful disorder. 

  Lethal force: Here's the rub. Q.64 explicitly reserves killing to public authority. Q.42's "disturbing" must therefore exclude private killing, aligning with De Regno's rejection of private tyrannicide (e.g., killing Julius Caesar). But Aquinas isn't pacifist—he allows resistance led by lower magistrates (proceres) or representatives. The loophole: If a tyrant loses legitimacy, those with delegated authority (like generals or judges) could act. Private individuals? Only non-lethally or in immediate self-defense. 

  Weakest link: The textual silence on mechanisms. Aquinas never details how "the people" resist without public leaders. If pressed, I'd note his doctrine of natural self-defense might cover personal survival against a tyrant's direct attack—but not revolutionary violence. Alternative reading: If someone argues q.42's "disturbing" includes killing, it clashes irreconcilably with q.64 unless we posit tyranny dissolves all authority. But Aquinas never says that; he calls tyrants "usurpers" yet still insists only legit authority can punish. 

  For teaching: Frame it as scales. Q.42 tips toward resistance when order is already broken by tyranny; q.64 pulls back by demanding authorized action. The balance? Resistance is collective and proportional, lethal force requires vestigial authority. Cite Cajetan later wrestling with this exact tension.
answer: |-
  Here's a coherent framework for reconciling Aquinas on sedition (II-II, q. 42, a. 2) and legitimate killing (II-II, q. 64, a. 3), addressing your specific questions and acknowledging tensions:

  **Core Principle:** Aquinas prioritizes the *common good* and *just order*. Resistance to tyranny is permissible *because* tyranny violates this order. However, *restoring* just order must itself follow principles of justice and authority to avoid greater disorder.

  **Reconciling q. 42 and q. 64:**

  1.  **The Meaning of "Disturbing" and the Actor:**
      *   **Meaning:** "Disturbing" (*turbare*) signifies actions aimed at *disrupting, undermining, or overthrowing* the tyrannical regime. This encompasses a spectrum: public protest, refusal to obey unjust commands, withdrawal of support, organizing opposition, and potentially armed resistance or removal.
      *   **The Actor:** Aquinas is deliberately **vague** but implies a **collective or representative actor**, *not* an isolated private individual acting alone. Key clues:
          *   He contrasts the tyrant fomenting discord "**among his subjects**" (plural, implying a collective body).
          *   The "harm" comparison involves "**his subjects suffer[ing]**" collectively.
          *   The *De Regno* (especially I, 6) explicitly discusses resistance by "**the authority of the multitude**" ("*auctoritas multitudinis*") or "**public authority**" ("*publica auctoritas*"), often exercised through officials like nobles (*proceres*) acting *on behalf of* the community. The "whole people" (*universitas*) acts corporately, not as atomized individuals.
          *   Q. 64’s restriction makes little sense if q. 42 authorized *any private person* to kill the tyrant.
      *   **Conclusion:** The legitimate "disturber" is the *community acting collectively* or *through its constituted representatives/officials* who still hold some vestige of legitimate authority derived *from* the community for its good. This could include lower magistrates, nobles, elected representatives (where they exist), or a formally constituted body representing the *universitas*.

  2.  **The "Unless" Clause: Consequentialism and Function:**
      *   **Is it Consequentialist?** It employs a **teleological comparison** ("greater harm from the consequent disturbance than from the tyrant's government"), but *not* pure act-consequentialism. It operates within the natural law framework prioritizing the common good and order. Avoiding *greater evil* is a fundamental natural law principle (e.g., preserving life, avoiding chaos).
      *   **Who Judges?** Aquinas doesn't specify, but logic suggests:
          *   **Primarily a Limit on Sedition:** The clause defines the *boundary* of the sin of sedition. Resistance causing disproportionate harm *becomes* sinful sedition *even against a tyrant* because it destroys the very common good it seeks to restore. It ceases to be just resistance.
          *   **A Prudential Imperative:** The actors (the collective/responsible representatives) *must* prudently weigh the likely consequences. They bear the responsibility for this judgment. Failure to do so makes their action unjust, transforming it into sedition. It's not a subjective "feeling" but a grave objective assessment required by justice.
      *   **Conclusion:** The clause functions as a **teleological limit inherent in the definition of just resistance**. Permissible resistance must reasonably aim at *net restoration of the common good*, not mere destruction. The judging agent is the collective/representative body undertaking the action, guided by prudence and justice.

  3.  **Lethal Force and Private Individuals:**
      *   **Q. 64's Restriction is Paramount:** Aquinas is unequivocal. The *deliberate, punitive killing* ("killing an evildoer" as an act of justice) belongs *solely* to public authority acting for the common good. A private individual lacks this jurisdiction.
      *   **Implications for Resisting Tyrants:**
          *   **Non-Lethal Resistance:** Q. 42's permission clearly covers non-lethal disturbance (protest, disobedience, organizing).
          *   **Lethal Force by Private Individuals?** Generally **no**, for punitive/retributive killing. Aquinas consistently rejects private tyrannicide (e.g., *De Regno* I, 6 condemns the killers of Caesar as "impious" for acting without public authority). A private person acting alone lacks the *authority* to execute judgment.
          *   **Possible Exceptions/Loopholes?**
              *   **Immediate Self-Defense:** Q. 64, a. 7 permits killing an unjust aggressor in *personal self-defense* if necessary. If a tyrant directly attacks a citizen's life *at that moment*, defense is permissible. This is distinct from *punishing* the tyrant or *overthrowing* the regime.
              *   **Acting Under/With Legitimate Authority:** A private citizen *could* participate in lethal force if *explicitly authorized* or acting under the *direct command* of the legitimate representative body (the *universitas* or its designated leaders) undertaking the resistance. They act as agents of the (reconstituted) public authority.
              *   **The "Representative" Threshold:** If the resistance movement *itself* constitutes a legitimate representative body of the community (e.g., a council of nobles, a formally constituted assembly), its leaders could *become* the acting public authority for that purpose, authorizing force. This bridges q. 42 and q. 64.
      *   ***De Regno* Connection:** *De Regno* I, 6 reinforces this. Aquinas condemns private tyrannicide but *praises* resistance led by "public authority" (*publica auctoritas*). He emphasizes the role of superiors ("*maiores viri*") and the "authority of the multitude" (*auctoritas multitudinis*) in deposing a tyrant. This aligns perfectly with reading q. 42's "disturbing" as an action of the community/representatives, not private individuals, and q. 64's restriction on private killing.

  **Synthesized Interpretation:**

  Aquinas permits resistance to tyranny because tyranny is itself seditious against the common good. This resistance ("disturbing") is legitimate when undertaken by the *community as a whole acting corporately* or *through its still-legitimate representatives or officials* (e.g., lower magistrates, nobles acting for the *universitas*), provided the resistance does not inflict greater harm than the tyranny itself (a limit inherent in the justice of the act). While non-lethal resistance is clearly included, *lethal force as an act of punitive justice* remains restricted to those holding public authority. In resisting tyranny, such authority for lethal action can only be exercised by the legitimate representatives of the community undertaking the resistance (the *auctoritas multitudinis* or its designated agents), *not* by private individuals acting alone. The resistance movement, if properly constituted as representing the common good, *becomes* the acting public authority for the purpose of restoring order, including, if absolutely necessary and prudent, the removal of the tyrant.

  **Where the Reading is Most Likely to Fail & Weakest Links:**

  1.  **The Vague Actor in q. 42:** The biggest vulnerability is Aquinas's lack of explicit specification in q. 42 about *who* exactly can "disturb." Critics can argue the text *could* be read more broadly to include individual subjects. My interpretation relies heavily on:
      *   Contextual clues within q. 42 (plural language).
      *   The *explicit* restriction in q. 64.
      *   The *explicit* preference for public authority/multitude in *De Regno*.
      *   The general Thomistic principle of order and authority.
      *   **Textual Push:** If a student finds a passage elsewhere where Aquinas *explicitly* endorses a lone private individual initiating lethal force against a ruler (even a tyrant) without authorization, this interpretation collapses. No such passage exists to my knowledge.

  2.  **The "Unless" Clause - Judgment Call:** The requirement to judge comparative harms is inherently fraught. Aquinas gives no clear mechanism *how* the collective/representatives are to make this judgment definitively or avoid factional bias. The weakest link is the practical application: Who *within* the resisting body has the final say? What constitutes sufficient evidence of "greater harm"? This leaves room for significant disagreement and potential misuse, even if the principle itself is sound.

  3.  **The Nature of "Public Authority" in Resistance:** Defining the precise moment when a resisting body (e.g., a council of nobles, a rebel army command) transitions into possessing legitimate "public authority" capable of authorizing lethal force under q. 64 is conceptually and practically difficult. Aquinas doesn't provide a clear threshold. This ambiguity is the weakest doctrinal link, creating a potential grey area between just resistance and sedition/sinful rebellion. Critics could argue it provides a loophole that undermines the stricture of q. 64.

  **Teaching Strategy:** Emphasize Aquinas's core concern for the *common good* and *just order* as the unifying thread. Frame the tension not as a contradiction, but as a reflection of the complexity of restoring justice *justly*. Highlight the *De Regno* as the crucial bridge text clarifying the actor question. Acknowledge the ambiguities (especially regarding the "unless" clause judgment and the exact nature of resistance authority) as points for ongoing debate within the Thomistic tradition itself. Contrast his cautious approach with later "tyrannicide" doctrines.
