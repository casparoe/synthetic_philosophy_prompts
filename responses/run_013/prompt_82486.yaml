answer: |-
  Here's one that uses vestigial traits and anchors (pun intended) to reproductive utility:

  > Why did the whale biologist get into a shouting match with the philosopher at the holiday party?
  > 
  > She insisted the whale's tiny hip bones *function* to anchor reproductive tissue, stabilizing internal anatomy during deep dives.
  > 
  > He yelled back that they absolutely do not—because they were *never selected for that*; they're just awkward leftovers from when whales walked!
  > 
  > *(She was talking causal-role. He was talking selected-effect. They both stormed off to refill their eggnog.)*

  **Why it fits:**
  *   **Trait:** Vestigial whale hip bones (pelvic bones).
  *   **Causal-Role Verdict (Punchline Part 1):** They *do* serve a useful current purpose (anchoring reproductive tissue/organs, potentially aiding stability).
  *   **Selected-Effect Verdict (Punchline Part 2):** They have *no function* because their current role wasn't what they were selected for (walking on land). Their current usefulness is coincidental, a byproduct of their structure.
  *   **Landing:** Philosophers/Biologists in the debate instantly recognize the conflicting verdicts based on the core difference (current utility vs. historical selection). Others just see biologists/philosophers arguing over leftover bones and needing more eggnog. Uses vestiges explicitly. Avoids the heart example.
