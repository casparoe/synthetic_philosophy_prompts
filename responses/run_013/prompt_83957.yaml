prompt: |-
  So I've been lurking on rationalist blogs and forums for the best part of a decade, and the idea I keep coming back to is moral trade — the whole thing where you care more about X than I do, I care more about Y, so we each do a bit of the other's thing and we both come out ahead by our own lights. I'm fairly convinced the basic move is right, and quite convinced that most of the interesting questions about it haven't been properly asked yet.

  So suppose a funder came to you with enough for one full-time researcher for three years (or a small team for one year, if you think that's the better unit) and the brief was just "open questions in moral trade — philosophy and theory, no empirical work, no particular cause area". What would you actually put them on, in what order, and why? Assume they can't search online, so no reading lists and no "see so-and-so's paper on such-and-such" — I want the reasoning, not pointers into the literature.

  A few things I'd like you to treat as live candidates, though tell me if some are duds:

  - the diachronic version: you trading with your future self, whose values you fully expect to drift. Is that even intelligible as trade, and if it is, what does it do to how we think about precommitment and preference change?
  - the acausal version: does the case for trade survive when communication is impossible but the other party is running the same reasoning? Is moral trade a special case of something bigger here, or does the acausal move make the whole idea collapse?
  - whether moral trade is itself a public good, and what the incentives look like when the benefit of a general norm of trading is diffuse but the cost of a bad trade falls on you
  - the integrity objection: trading away something you take to be important in order to get more of what you take to be more important. Corruption, or is refusing to trade the self-indulgent move?
  - trade under moral uncertainty, where neither party is sure what's right and the "currency" is therefore fuzzy
  - the laundering worry: if you can buy moral offsets, does the market end up making things worse overall, or is that just an aesthetic objection dressed up as ethics?
  - whether the possibility of moral trade is any evidence against moral realism, or whether that's a category error
  - the political analogy with vote-trading and log-rolling, and whether the pathologies there — coalitions that leave everyone worse off, minorities quietly traded away — carry over

  For each one: is it upstream of the others, is it tractable by someone with decent decision theory and philosophy rather than an economist or an ML person, is anyone actually on it, and what would move it up or down the list over the next couple of years? Also say what you'd drop, and why. I'd much rather have three questions definately defended than fifteen listed — this is a prioritisation, not a survey.

  Write it in British English. Finish with a single line, on its own, of the form \answer{(1) ...; (2) ...; (3) ...} giving just your top three questions as short labels, in order.
reasoning: |-
  Hmm, the user is asking about research priorities for moral trade. They've been following rationalist discussions for a decade and are particularly interested in theoretical and philosophical angles, not empirical work. They want me to prioritize three key questions from their list and explain why those are most important.

  Looking at their candidate questions:
  - Diachronic moral trade (trading with future self)
  - Acausal moral trade (trade without communication)
  - Moral trade as public good
  - Integrity objection (is trading corrupt?)
  - Trade under moral uncertainty
  - Laundering worry (do offsets backfire?)
  - Moral realism implications
  - Political analogy with vote-trading

  I need to evaluate which of these are most foundational and tractable. The user wants reasoning, not literature references, and specifically asks for British English. They also want me to consider whether questions are upstream (fundamental), tractable for philosophers/decision theorists, and whether anyone is actively working on them.

  For prioritization:
  1) Acausal trade seems most upstream - if moral trade doesn't work without communication, it undermines many applications. It's core to rationalist ethics and connects to decision theory. Fairly tractable with current tools.
  2) Diachronic trade comes next because preference drift affects everyone. It rethinks precommitment and personal identity in ways that could reshape how we approach moral trade practically.
  3) Moral uncertainty feels urgent - most real decisions involve uncertainty, and if we can't handle fuzzy values, moral trade remains theoretical. It's also where AI alignment concerns might drive interest.

  I'm dropping:
  - Public good aspects - important but derivative of other questions
  - Integrity objection - more applied ethics than foundational
  - Laundering worry - empirical elements creep in
  - Realism debate - interesting but not core to making trade work
  - Political analogies - too domain-specific

  The top three all share characteristics: they're highly fundamental, involve clean philosophical reasoning rather than requiring economic modeling, and have open questions that a small team could make progress on. Acausal and diachronic in particular might see increased attention due to AI safety concerns in coming years.

  For the response structure, I'll explain my ranking with detailed reasoning for each top pick, mention why others didn't make the cut, and conclude with the required single-line answer.
answer: |-
  Right, this is precisely the sort of prioritisation puzzle I enjoy. Moral trade is a powerful, under-explored lever, and focusing the effort is crucial. Let's cut through the list.

  **Core Criteria for Selection:**
  1.  **Upstreamness:** Does cracking this unlock progress on others, or is it foundational to the *very possibility* or *structure* of moral trade?
  2.  **Tractability for Philosophy/Decision Theory:** Can a sharp philosopher with strong decision-theoretic chops make headway without needing deep economics, complex modelling, or ML? Does it hinge on conceptual clarity?
  3.  **Neglectedness & Impact:** Is it relatively untouched, and would progress here have significant ripple effects on how we think about ethics, cooperation, and value?
  4.  **Live Candidate:** Per your list, though some will be duds for this specific brief.

  **Assessment & Prioritisation:**

  1.  **Acausal Moral Trade:** This is *the* most upstream candidate.
      *   **Why:** If moral trade fundamentally *fails* in the acausal case – where agents must coordinate based on mutual reasoning without communication – it severely limits its scope and theoretical robustness. It probes the deepest foundations: what *is* the minimal requirement for "agreement" or "mutual benefit" in the moral domain? Is shared reasoning sufficient? Does it require identical decision theories? This question *is* the generalisation; if it works acausally, synchronic trade is a special case. If it collapses, it forces us to re-examine the core concept.
      *   **Upstream:** Utterly foundational. Success or failure here dictates whether moral trade is a universal coordination mechanism or a contingent social practice.
      *   **Tractable?** Highly suitable. It's pure decision theory, game theory (of the philosophical kind), and meta-ethics. Requires reasoning about agents with differing value functions trying to coordinate actions based on mutual modelling and logical correlation. No complex empirical inputs needed.
      *   **Neglectedness:** While acausal cooperation is discussed in AI alignment and decision theory (e.g., updatelessness, logical bargaining), applying it *specifically and rigorously* to *moral* trade, with differing *value functions* (not just differing beliefs or resources), is underdeveloped. Progress here would be groundbreaking.
      *   **Movement:** Rising interest in acausal coordination within AI safety makes this highly relevant. A negative result (showing fundamental instability) would be as valuable as a positive one.

  2.  **Diachronic Moral Trade (Trading with Your Future Self):**
      *   **Why:** This is upstream for the *personal* application of moral trade and fundamentally challenges notions of identity, commitment, and rational agency over time. If "trade" with a future self with drifted values is incoherent, then precommitment strategies and saving-for-retirement analogues in the moral sphere collapse. If it *is* coherent, it forces a radical rethink of how we bargain *with ourselves* across time and value change. It directly impacts how individuals should plan their lives and charitable giving under expected preference drift.
      *   **Upstream:** Highly upstream for the individual perspective. Understanding diachronic trade is necessary before scaling to multi-agent synchronic trade in temporally extended contexts. It tackles the "who is trading with whom?" question over time.
      *   **Tractable?** Very suitable. Combines decision theory, philosophy of personal identity, and dynamic choice. Focuses on coherence and reasoning under anticipated change within a single agent's projected timeline. Doesn't require complex social modelling.
      *   **Neglectedness:** While precommitment is discussed, framing it explicitly as *trade* across time with potentially conflicting valuations between temporal stages is novel. The implications of value drift for trade specifically haven't been deeply explored.
      *   **Movement:** Increased focus on longtermism and personal effectiveness makes this increasingly relevant. Understanding how to "bind" future selves morally is a live practical concern.

  3.  **Trade Under Moral Uncertainty:**
      *   **Why:** This is the most practically urgent *barrier* to real-world application. Almost no one is *certain* of their moral views. If moral trade requires cardinal, interpersonally comparable, *certain* utilities, it's useless. How do we trade when both parties think "X is probably more important than Y, but I'm not sure, and maybe Z matters too?" What is the "currency"? This question is essential for making moral trade operational outside toy models and tightly defined communities.
      *   **Upstream:** Less foundational than acausal/diachronic, but critically upstream for *implementation*. Progress here is needed to connect the theory to messy reality. Failure to find a coherent approach here makes the whole project practically stillborn.
      *   **Tractable?** Reasonably suitable. Draws on decision theory under uncertainty (Baysian frameworks, voting theory for aggregating moral views), moral uncertainty literature, and conceptual work on value comparison. Requires careful thought about how to represent vague or probabilistic values as a basis for exchange. More complex than the first two but still within core philosophy/DT.
      *   **Neglectedness:** Moral uncertainty is a growing field, but applying it *specifically* to the mechanics of *trade* – how two uncertain agents negotiate a mutually beneficial swap of moral effort – is largely untouched. The "fuzzy currency" problem is central.
      *   **Movement:** The sheer prevalence of moral uncertainty in real-world altruism and policy debates makes this perpetually relevant. Lack of progress here is a major bottleneck.

  **Why the Others Didn't Make the Top Three (and why some are duds for *this* brief):**

  *   **Moral Trade as a Public Good:** Important, but derivative. It *assumes* moral trade is viable and asks about scaling/institutions. It's downstream. Also leans more towards political science/economics (analysing norms, incentives). Tractable, but not *most* upstream.
  *   **The Integrity Objection:** This is an important *applied ethics* or *practical wisdom* question, but it's not foundational *theory*. It assumes trade is possible and asks if it's *permissible* or *wise*. Vital for advocacy, less so for core theory. More suitable for an ethics postdoc than cracking open the concept.
  *   **The Laundering Worry:** This has significant empirical components (how *do* offset markets actually function? what are the behavioural responses?). It also leans heavily on specific moral frameworks (e.g., deontology vs consequentialism). While the conceptual core (does fungibility undermine intrinsic value?) is philosophical, proving whether it makes things "worse overall" requires consequentialist evaluation and empirical evidence, violating the "no empirical" brief. Partly a dud for *this* specific theoretical remit.
  *   **Moral Realism Evidence:** This feels like a category error or at least a distraction. Moral trade is a mechanism for agents with *subjective* concerns (even if they believe them objective) to cooperate. Its coherence or incoherence doesn't directly bear on realism vs. anti-realism. A realist and an anti-realist can both engage in moral trade based on their *felt* values. Dud for advancing the core theory of trade.
  *   **Political Analogy (Log-Rolling):** Useful analogy, but the pathologies (cycling, minority exploitation) are well-studied in social choice/political economy. Investigating if they *carry over* is important applied work, but it doesn't illuminate the *fundamental* structure of moral trade itself. It's an application domain, not core theory. Also leans towards economics.

  **Prioritisation Rationale Recap:**
  1.  **Acausal:** *Must* be solved first to know if moral trade is a universal coordination mechanism or fundamentally limited. Highest upside/downside for the entire concept.
  2.  **Diachronic:** Essential for understanding the individual agent over time, a prerequisite for scaling and personal application. Tackles identity and change head-on.
  3.  **Moral Uncertainty:** The critical bridge from pure theory to potential practice. If we can't trade under uncertainty, the concept has limited real-world reach.

  This order maximises tackling the deepest conceptual puzzles first (acausal/diachronic) before addressing the key practical barrier (uncertainty). All three are highly tractable with philosophy and decision theory.

  \answer{(1) Acausal Foundations; (2) Diachronic Trade; (3) Uncertainty & Fuzzy Currency}
