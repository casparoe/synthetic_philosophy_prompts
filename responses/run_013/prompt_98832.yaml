  Downstream questions like "How many objects exist?" (universalism, nihilism) matter less if upstream issues reframe objects as non-fundamental. The balloon example isn’t a distraction—it sharpens the core conflict. 

  Their time limits mean favoring questions where layman observations (e.g., balloon transformations) challenge theories. I’ll emphasize that their everyday examples *are* philosophically potent. 

  Finally, I’ll structure the response to: 
