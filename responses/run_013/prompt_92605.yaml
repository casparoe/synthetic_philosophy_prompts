  First, I need to pick a setting. A hospital lab makes sense—familiar, high-stakes, and technical. A cytotechnologist screening Pap smears fits because their expertise seems intelligent, but the actual classification is done by an algorithm. The algorithm uses fixed rules on morphological features, which is the blind mechanism. 

