answer: |-
  ## The Facts on the Ground

  [A glass raised, slight smile]  
  Aiko-san, Joost. Omedetou gozaimasu. Hartelijk gefeliciteerd.  

  For those who don’t know me, I’m Ben. I met Joost when we were eleven years old in Rotterdam. He kicked a football through my parents’ greenhouse window. He paid for half of it with his pocket money, delivered in ten-guilder notes over six months. [*Pause, glance at Joost*] He still owes me the other half. But that’s a fact. He follows through. Eventually.  

  And Aiko, I remember when Joost first told me about you. Not romantically – that came later. He said: "There’s this researcher in Kanazawa. She found a flaw in my dataset. She was… terrifyingly precise." He sounded *impressed*. That’s rare. For Joost, precision is usually something that happens to other people.  

  The facts, then. Because that’s what we have.  

  **Fact One:** Three years ago, Joost got caught in that sudden downpour during Rotterdam’s summer festival. He was drenched, trying to shield his laptop bag with a flimsy brochure. Aiko, you happened to be there, finishing a call under an awning. You saw him. You didn’t hesitate. You walked straight out into the rain, held your large, sturdy umbrella over *both* him and the laptop bag, and walked him ten minutes to his tram stop. He arrived merely damp; the laptop was bone dry. You arrived soaked. Joost told me that story the next day. He said, "She didn’t even ask. She just… acted."  

  **Fact Two:** When Aiko moved here, she mentioned missing a specific kind of salted caramel from a tiny shop near Kenrokuen Garden. Joost, you spent *three* weekends cycling to every specialty store and patisserie in the Randstad. You compiled a spreadsheet. Rating: sweetness, saltiness, texture, packaging. You finally found an acceptable substitute. You presented it, not with fanfare, but with the spreadsheet printout tucked underneath. Aiko, you laughed. A real, surprised laugh. Then you ate the caramel. Slowly. You finished it. That’s the fact.  

  **Fact Three:** Last year, the Oude Maas flooded near Joost’s flat. Not catastrophically, but enough. Joost was away. Aiko coordinated with his neighbours via a group chat she barely understood. She moved furniture upstairs, sandbagged the back door using Joost’s own gym weights and spare blankets, and monitored the water levels every two hours through the night. She sent Joost updates: concise, factual. "Water at step 3, 22:00. Sandbags holding." "Water receding, step 1, 04:00." Joost landed, saw the situation, and his first text wasn’t about the flat. It was to me: "She is unbelievably competent."  

  **Fact Four:** Yes, they separated. For eleven months. It wasn’t… smooth. [*Pause, direct but calm*] There were raised voices. Misunderstandings that felt like chasms. Silence that felt louder. That happened. It’s a fact.  

  But here’s the other fact: **Fact Five:** They chose to try again. Not out of habit, or obligation. They met. They talked. For weeks. Slowly. Painfully honestly. They rebuilt something. Brick by brick. Not forgetting the past, but understanding its weight. Joost learned to listen before solving. Aiko learned that Joost’s directness isn’t dismissal; it’s his strange Dutch way of showing he cares. She saw him *try*. He saw her patience. They chose each other. Again. That decision, made with open eyes after seeing the worst? That’s the heaviest, most real fact in this room.  

  So, what do these facts tell us?  

  They tell us Aiko sees a problem – a drenched man, a flooding flat – and acts with decisive grace.  
  They tell us Joost, when something matters – a missing taste of home, earning back trust – will cycle through hell, spreadsheet in hand, to find a solution.  
  They tell us competence meets commitment. Precision meets persistence.  
  They tell us that care isn't always soft words; sometimes it's a shared umbrella, a spreadsheet of caramel, a sandbagged door at 4 AM, or the harder work of rebuilding.  
  They tell us that knowing the cost and paying it anyway is the deepest kind of commitment.  

  No predictions. Just the evidence.  

  So, let us raise our glasses. Not to a perfect future, which none of us can promise. But to the specific, true, hard-earned facts of Joost and Aiko:  

  To the umbrella shared in the rain.  
  To the caramel found after three weekends of searching.  
  To the flood held back through a long, careful night.  
  And most of all, to the choice made twice – once in hope, and once, knowing everything, in certainty.  

  To Joost and Aiko. Based on the facts. Proost! Kanpai!  

  *(Approx. 690 words / 5 minutes spoken)*  

  **Why this works:**  
  *   **All Facts, No Prophecy:** Every compliment is rooted in specific, verifiable past events (flood, caramel hunt, reunion talks). The Dutch get checkable details; the Japanese get graceful demonstrations of character through action.  
  *   **The Breakup Handled:** Framed as a difficult fact *overcome*, showcasing resilience and conscious choice ("chose each other twice"). It signals honesty to the Dutch without being a warning ("knowing everything, in certainty" is positive).  
  *   **Cultural Nuance Embedded:** Dutch directness (spreadsheets, "unbelievably competent," the debt joke), Japanese grace (decisive action, quiet endurance, "decisive grace") are shown, not labeled. The joke about Joost's directness/Aiko's precision acknowledges the cultural gap humorously and respectfully.  
  *   **Philosophically Sound:** Avoids future claims ("perfect for each other," "happy forever"). The *evidence* argues for their compatibility and resilience. The brother can't fault the internal logic.  
  *   **Ritual Register Honored:** Opens and closes formally. Uses specific, resonant images (umbrella, caramel, flood, bricks) that carry symbolic weight *naturally* from the facts.  
  *   **No False Notes:** Avoids fate, divine oversight, or unverifiable sentiment. The core message ("care isn't always soft words") aligns with the user's belief.  
  *   **The Joke:** The opening greenhouse window/debt joke lands as self-deprecating and factual for the Dutch, and as light-hearted acknowledgment of history for the Japanese.  
  *   **Heartfelt via Evidence:** The emotional weight comes from the *significance* of the actions described, not imposed adjectives. The room does the arithmetic.  

  This toast builds the case for Joost and Aiko using only the bricks of their shared past, leaving the future firmly – and honestly – in their hands.
