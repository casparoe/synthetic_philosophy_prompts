answer: |-
  ## The Names the River Gave

  The mudflats of Vergewater breathed. That was Elvan’s first impression, stepping onto the creaking Customs House dock. Not the air, thick with river rot and tar, but the ground itself – sucking, releasing, a vast, wet organism beneath the pilings. His new domain. Two days prior, Master Borin, who had trained him since he was a scrawny dockside runner, had slumped forward onto the Concordance’s brass housing, ink from his final seal staining the ledger like a dark, drying bloom. Now, the heavy Inspector’s chain, its central seal – a complex knot of silver inscribed with the term *‘Limn’* – felt cold and foreign against Elvan’s collarbones.

  The Concordance dominated the main hall: a brass-and-obsidian monolith humming with contained energy. Cargo was presented before its central lens. Gears whirred. Metal fingers, tipped with sharp styluses, etched names onto parchment scrolls from a closed dictionary – *The Vergewater Lexicon*. Every bale of wool, every crate of porcelain shards, every barrel of pickled river eels received its immutable name. *‘Hearthfleece’. ‘Sky-shard’. ‘Brine-wriggle’*. These names were law. Duty records. Tariff keys. And for two generations, the Concordance had never erred. Its names *fit*. They arrived with the cargo, unchanged until it left.

  The Inspector’s duty, however, was not mere recording. It was **siltation**. The term, passed down through the Guild, was inscribed on the plaque above the Concordance. To certify siltation meant attesting that the Concordance’s names were *about* the cargo itself, anchored in its essential nature, not merely coinciding with it. But the Lexicon was a closed loop. *‘Hearthfleece’* was defined by *‘Woven Cloud’*, which referenced *‘Sheep’s Breath’*, which looped back through seven convoluted steps to *‘Hearthfleece’* again. No one knew when, or if, a word had ever pointed directly *out* to the world beyond the book. The proof of siltation lay solely in the consistency of the names themselves and the Guild’s sealed witness boxes – samples left by the founders, each bearing a name that had never changed. Elvan had seen them: a lump of petrified wood (*‘Rootstone’*), a shard of greenish glass (*‘Drowned Light’*), a chunk of hardened tar (*‘Night’s Resin’*). They sat in their cases, opaque, silent, their original forms long lost to time and chemical change.

  Elvan’s task, ingrained by Borin, was to devise a test. A procedure to prove, using the Lexicon’s own terms and the tools at hand, *what* the Concordance was truly naming. Not just the cargo, but *the cargo in its specific presentation*. Was it naming the hemp of the sack? The grain of the wood in the crate? The specific shade of ochre paint on the barrel? The angle of the light from the high, grimy windows when the bale was presented? The Concordance tracked *something* with perfect fidelity. But what? The possibilities nested within each other, impossible to prise apart within the harbor’s unchanging routine. Any test had to be described, recorded, and judged *within the Lexicon*. It had to siltate.

  He began subtly. He presented the same crate of Narrows pottery twice in one day. The Concordance etched *‘Clay Echo’* both times. He presented it upside down. *‘Clay Echo’*. He draped it in a sackcloth shroud Borin had left. *‘Sack-shadowed Clay Echo’*. The name changed, but only because the presentation included the shroud. It tracked the *scene* presented. But what *aspect*?

  He tried presenting an empty crate. The Concordance whirred, then etched *‘Void-husk’*. Defined, predictably, by *‘Absence within Timber-frame’*. Was it naming the crate’s emptiness? Or simply the crate itself, defined by its lack? He couldn’t isolate the variable.

  Frustration coiled like river eels in his gut. The Lexicon imprisoned thought. He needed something to shift, something to break the perfect alignment. He thought of the witness boxes. *‘Rootstone’* no longer resembled wood; it was a mineral lump. Yet it still siltated as *‘Rootstone’*. Was the Concordance naming some enduring essence… or merely the historical label attached to the physical object, regardless of its current state?

  The river provided the crisis.

  A decrepit barge, the *Mudlark*, limped into port during the spring silt-surge, laden with barrels of viscous black bitumen from the tar marshes upstream. The cargo manifest, verified by the sending port’s Concordance (an identical device), listed it as *‘Night’s Resin’*. Vergewater’s Concordance confirmed it as the barge crew heaved the heavy, sweating barrels onto the Customs dock. *‘Night’s Resin’*.

  The tide was falling fast, exposing the sucking mudflats. The *Mudlark*, hastily unloaded, listed dangerously as the water receded. One of the bitumen barrels, poorly lashed near the stern, rolled with the tilt. It struck the rotten gunwale with a sickening crack, splitting open. Thick, pungent tar began oozing onto the deck, creeping towards the scuppers.

  "Curses!" roared the barge-master. "That’ll set like stone in the sun! We need to shift it before the tide strands us!" He gestured frantically to his crew. "Get it onto the dock! Quickly!"

  The crew scrambled, prying at the leaking barrel with planks. They managed to shove the ruptured mass – half barrel, half spreading tar – onto the Customs House dock just as the *Mudlark* settled firmly into the mud with a groaning sigh. The tide was ebbing rapidly now. The black sludge pulsed slowly from the broken staves, pooling on the damp planks, gleaming under the late afternoon sun.

  The barge-master turned to Elvan, his face slick with sweat and panic. "Inspector! It’s still *‘Night’s Resin’*, ain’t it? We need to move it! Get it under cover before it sets hard! The tariff seal, man!"

  Elvan froze. The Concordance had named the *intact* barrel as *‘Night’s Resin’*. Now, it wasn't a barrel anymore. It was a spreading, amorphous sludge merging with the dock timbers. The Lexicon defined *‘Night’s Resin’* as *‘Consistent Pitch drawn from Marsh-bed’*. But was this *consistent* anymore? Was it still *drawn*? Or was it now part of the dock? If he presented it to the Concordance now, what would it name it? *‘Dock-stain’*? *‘Spilled Resin’*? *‘Night’s Resin’* regardless? The definition hadn't changed, but the physical reality had fractured. The perfect alignment was broken.

  He had to act. The sun beat down. The tar would harden within hours, welding itself and the broken staves to the dock. Delay meant chaos, damage, disputes. But what was the siltated name? His seal depended on it. The tariff depended on it. Was the name anchored to the original substance, now spilled? To the specific mass presented earlier? To the *form* of the barrel, now destroyed? The Lexicon offered no procedure for this.

  He looked at the spreading mess, the panicked barge-master, the helpless crew. He looked at the Customs House, its windows reflecting the muddy river. He thought of *‘Rootstone’*, a mineral named for wood. He thought of siltation – the term felt different now, heavier, less about perfect correspondence and more about… endurance. A name clinging to a substance through change, like silt settling on a shifting riverbed.

  "Move it," Elvan commanded, his voice tight. "Get it onto that salvage pallet, tar and wood together. Quickly!" He pointed to a heavy-duty wooden skid nearby. The crew didn't hesitate, levering the semi-liquid mass and broken staves onto the pallet. The tar oozed around and through the slats, bonding instantly.

  As they strained, Elvan grabbed a fresh parchment tag and his Inspector's seal. He didn't wait for the Concordance. He wrote, in the formal ledger hand: "**Item:** Salvaged Mass incorporating *Night’s Resin* and Timber Debris, ex *Mudlark*. **Presented:** Pallet S1. **Name:** *‘Night’s Resin Anchorage’*."

  He pressed his seal, *‘Limn’*, beside the name. It was not a Concordance name. It was an Inspector’s designation, a new compound term cobbled from the Lexicon. *‘Anchorage’* – defined as *‘Secure Holding against Flow’*. It had never been applied to cargo. The barge-master stared, bewildered, but nodded vigorously. "Just get it stamped, Inspector! Move it!"

  Elvan stamped the pallet itself with the Customs seal. "Get it under cover. Now." The crew heaved the laden pallet towards the covered storage sheds as the last of the light faded, leaving the *Mudlark* stranded like a beached whale in the grasping mud.

  Elvan stood alone on the emptying dock, the cold chain heavy on his neck. He had acted. He had siltated… something. But what? He hadn't proven what the Concordance tracked. He’d sidestepped it entirely, creating a new designation within the Lexicon’s grammar, justified by the physical urgency – the *flow* of the tide, the *setting* of the resin. His test wasn't separation; it was adaptation. Siltation, he realized, wasn't a fixed state of correctness, but a *process* of securing a name against the inevitable flow of change and circumstance, using the tools at hand. Like silt building a delta.

  The next morning, he presented the hardened mass on the pallet to the Concordance. The device hummed, lenses adjusting. The stylus scratched: *‘Timber-bound Night’s Resin’*. Close, but not his *‘Anchorage’*. The Concordance tracked the *presented object*: a pallet holding solidified tar and wood. Not the history, not the emergency. Its fidelity was impeccable, but its object was ever-shifting, defined only by the moment of presentation.

  Elvan returned to the witness boxes. He opened the case holding *‘Rootstone’*. He didn't see petrified wood. He saw a record of endurance, a name that had siltated through profound physical transformation. Its continued naming wasn't proof it *was* wood, but proof the name had *held*.

  He couldn't isolate light from object, or object from context, within the Lexicon's closed world. But he could document the *conditions* of naming. He began drafting a new procedure, using terms like *‘Luminal Angle’* (defined as *‘Path of Sun-beam upon Presentation Stage’*) and *‘Tidal Stage’* (defined as *‘River’s Breath Height at Naming’*). These could be recorded alongside the name. He requested samples of common goods – a brick, a length of rope, a clay tile – to be placed near the witness boxes. He would have the Concordance name them periodically, year after year, as they aged and changed, recording the conditions each time. He would track the name against the slow decay.

  It wasn't a test to find the anchor point. It was a map of the siltation process itself. He would build an archive not just of names, but of the shifting confluence where names met the mutable world. He would certify siltation not as a fixed truth, but as the Guild’s enduring practice: the continuous, necessary act of binding names to the flow of things, using the only tools they had – the Lexicon, the seal, and the river’s own relentless patience. He dipped his pen, the weight of *‘Limn’* now a familiar counterbalance, and began the meticulous work of describing the angle of the morning light falling on the first sample brick. The Lexicon provided the words; the river provided the change. His duty was the siltation.
