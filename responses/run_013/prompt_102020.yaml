answer: |-
  Here’s a story designed to trap your students in the species problem’s thorns, leaving them arguing long after the last sentence:

  **Title:** *The Coastal Crescent Moth*

  The salt-stung wind whipped Aria’s notebook pages as she crouched beside the UV trap. Dawn bled pink over the cliffs of Point Solitude, the final station on her coastal survey. Inside the trap, fluttering weakly against the plastic, were half a dozen *Eudryas obscura* – the unassuming little brown moths she’d spent eight months cataloging from Station 1 at Misty Cove all the way up this rugged coastline. At least, that’s what the museum labels would say. What they *were*… that certainty had dissolved like sea fog.

  It started at Station 7, Bay’s End. Her trapped *E. obscura* males readily courted females netted from Station 8, Sandspit. Standard. But when she’d crossed the narrow isthmus to Station 9, Lagoon Edge, the males ignored Lagoon females, antennae twitching dismissively. Puzzled, she’d run reciprocal trials: same result. Distinct pheromones? She’d packed her gear and pushed north, replicating trials station by station.

  Now, at Point Solitude (Station 12), the moths looked identical to her Station 1 specimens from Misty Cove. Same wing patterns, same size. But when she introduced a weary male from Station 12 to a female from Station 1… nothing. Absolute indifference. Worse: introducing a Station 12 male to a Station 11 female? Vigorous courtship. Station 11 males with Station 10? Fine. Station 10 with Station 9? Fine. But Station 9 with Station 8? Fine. Station 8 with Station 7? Fine. Station 7 with Station 6? Fine… all the way back to Station 1 and Station 2, happily interbreeding. The chain was unbroken. Except here, at the loop’s closure, Station 12 and Station 1 might as well have been different planets.

  Her satellite phone buzzed – Dr. Vale, her supervisor. "Aria? Final count? The museum ship docks in three days. They need a species designation for the collection *yesterday*. ‘*Eudryas obscura* complex’ won’t cut it for their catalog."

  "It’s… complicated, Dr. Vale. The populations—"

  "Complicated?" Vale cut in, his voice tight. "The Coastal Conservancy board meets next week. If this is a *distinct*, *endangered* species confined to Point Solitude, funding materializes. If it’s just more *obscura*…" He sighed. "Rhys is already sniffing around, you know. Claims your ‘complex’ is just clinal variation. Says he could split it into a dozen microspecies based on wing spots alone." Dr. Rhys, Vale’s rival, loved nothing more than naming new species. Splitters sold books; lumpers like Vale secured large-scale conservation grants.

  Aria stared at the moths. *One big species?* The chain interbred freely… except at the ends. A continuum? But Station 1 and Station 12 didn’t interbreed *at all*. *Twelve distinct species?* Yet Station 11 and 12 were as interfertile as any, indistinguishable morphologically from their neighbors. Rhys’s wing spots varied gradually along the coast. Her head throbbed.

  Back at the cramped station lab, she vented to Ben, the microbiologist culturing sediment samples. "…so Vale needs it one species for the grant, Rhys wants it split for prestige, the museum just wants a name, and the moths refuse to follow the rules!"

  Ben peered into his scope. "Rules? Like ‘interbreeding’?" He chuckled. "Tell that to my friends here." He gestured at petri dishes smeared with greenish slime. "*Chlorogloea tiseriae*. Supposedly one species. But they don’t ‘interbreed’. They swap genes sideways, grab free DNA, evolve in bursts. Trying to define *their* species by mating?" He snorted. "Good luck. We just sequence chunks and draw arbitrary lines on similarity trees. Handy boxes for a messy, promiscuous world." He popped a dish into an incubator. "At least your moths *try* to have rules."

  Aria looked back at her own specimens, pinned neatly in rows. Station 1 to Station 12. Each moth a link. Each link connected to the next. But the chain met itself and refused to clasp. Was she looking at one continuous rope? Twelve distinct links? Or was the "link" itself the illusion? The museum needed a name. Vale needed *Eudryas solitudinis*, endemic and endangered. Rhys wanted *E. obscura var. mistica*, *E. obscura var. arenaria*, *E. obscura var. petra*... The Conservancy needed a clear answer: protect Point Solitude fiercely, or fold it into existing management plans?

  She picked up a Point Solitude moth, its drab wings fragile under the lamp. It looked like its ancestors from Misty Cove. It *was* descended from them, an unbroken lineage snaking up the coast. But its chemical language was alien to them now. It didn’t belong to the same interbreeding community. It was part of a journey, a thread spun out over time and distance, that had finally frayed at the point of return. Was "species" the thread? The journey? Or just the arbitrary place where she, or Vale, or Rhys, decided the thread had changed color enough to deserve a new name?

  Aria reached for her label maker. The cursor blinked. *______ obscura*. The space demanded an answer she couldn’t find in the moths, only in the pressures crowding her tiny lab.

  ---

  **Post-Story Note (For Instructor):** *This story leans subtly towards the idea of species as historical lineages rather than static classes. The emphasis on the unbroken chain of descent ("an unbroken lineage snaking up the coast," "part of a journey, a thread spun out over time") and the moth as a point on that journey, contrasted with the failure of static definitions (interbreeding, morphology), hints that what exists most concretely is the evolving lineage itself. The ending focuses on the moth as a product of its history, making the "species" label feel imposed rather than discovered. However, the story deliberately keeps all pressures (biological, ecological, morphological, political) equally vivid and unresolved.*
