  **START: Naive Comprehension**  
  *Every predicate defines a set. Thus, \( R = \{ x \mid x \notin x \} \) exists.*  
  **Paradox:** \( R \in R \leftrightarrow R \notin R \) yields contradiction.  

  ### Question 1: Do you keep the logical steps that derive the contradiction?  
  *(i.e., contraction, excluded middle, reductio; "classical logic")*  
  - **YES** → Comprehension must be restricted. Go to **Q2**.  
  - **NO** → Logic is modified to avoid explosion. Go to **Q5**.  

  ---

  ### **Q2 (Classical logic + restrict comprehension): How do you restrict comprehension?**  
  - **By size** (sets are "small"; not "too big"): →  
    - **Q2a: Is there a universal set?**  
      - No → **Leaf: ZFC-style iterative sets**  
        *Sets built cumulatively; no universal set. R is a proper class (not a set). Extensionality, one universe.*  
        🚩 **Awkward:** Proper classes (e.g., R) exist but can't be members.  
      - Yes → *Unoccupied (incoherent: size restriction implies no universal set).*  
  - **By syntactic form** (only "safe" predicates): →  
    - **Q2b: What syntactic filter?**  
      - Stratified (e.g., \( x \in y \) always "higher type" than x): → **Leaf: NF-style stratified**  
        *Universal set exists. R undefined (unstratified). Extensionality, one universe.*  
        🚩 **Awkward:** Axiom of Choice fails; universe is non-well-founded.  
      - Positive (no negated \( \in \)): → **Leaf: Positive set theory**  
        *Universal set exists. R undefined (not positive). Extensionality, one universe.*  
        🚩 **Awkward:** Non-well-founded sets (e.g., \( x = \{x\} \)) allowed.  
  - **By predicativity** (no self-reference): → **Leaf: Ramified types**  
    *Sets split into orders; no universal set. R defined per-order (avoids loop). Extensionality, one universe.*  
    🚩 **Awkward:** Complex orders; impractical for mathematics.  
  - **By language level** (predicates can't reference their own set): → **Leaf: Simple types**  
    *Hierarchy of types (type 0: individuals, type n+1: sets of type n). No universal set. R defined per-type (e.g., \( R_n \) for type n-1). Extensionality per type, multiple universes.*  
    🚩 **Awkward:** Duplicated operations (e.g., many empty sets).  

  ---

  ### **Q2a (Size restriction): Do you represent R as an object?**  
  - Yes → *Unoccupied (incoherent: R is "too big" for size-based systems).*  
  - No → Implicit in ZFC/NBG (R is a proper class).  

  ---

  ### **Q5 (Non-classical logic): How do you avoid explosion?**  
  - **Accept true contradictions** → **Leaf: Paraconsistent/Dialetheist**  
    *Naive comprehension kept. R is both member and non-member of itself. Universal set exists. Extensionality, one universe.*  
    🚩 **Awkward:** True contradictions (e.g., about R) must be "isolated" (no explosion).  
  - **Reject excluded middle/reductio** → **Leaf: Intuitionistic/Constructive**  
    *Comprehension restricted (e.g., to predicative/separable formulas). No universal set. R may exist but \( R \in R \lor R \notin R \) not provable. Extensionality, one universe.*  
    🚩 **Awkward:** Loses classical theorems (e.g., no proof of \( \forall x (x = x) \)).  

  ---

  ### **Q2 (Alternative): Do you reject sets entirely?**  
