prompt: |-
  I work in applied statistics — I'm the person colleagues bring an analysis to before it goes out, and most of my job is deciding whether a claim is something the procedure that produced it actually licenses. So everything I think with is procedures and their guarantees: what a test is calibrated to do over repeated use, what a confidence interval entitles a reader to conclude, the difference between a comparison I preregistered and one I ran after seeing the data, the file drawer, the fact that an estimate can be right about the sign and wildly wrong about the size, and the difference between the data being consistent with no effect and there being no effect. Notice that in my world there's nowhere to put the person. A procedure is misleading or it isn't, and it stays that way whether the analyst was cynical or just sloppy. Intent shows up only as a reason to distrust the procedure, never as a separate ingredient.

  There's a debate in philosophy I keep bumping into and I want it translated into my terms: is there a moral difference between lying and merely misleading? Somebody says something literally true, arranged so you draw the false conclusion, and the philosophers want to know whether that's a lesser wrong than saying the false thing outright, and whether it's a wrong at all when the audience is expected to do some work of their own. Restate that arguement as faithfully as you can in my vocabulary — procedures, licenses, calibration, selection, omission, and the inference a competent reader is entitled to draw. Then the part I actually care about: what didn't survive the trip? What maps cleanly onto something I already have a name for, what can I only get at by distorting it, and what has no counterpart in how I think at all.

  Here's the case I want run through it, because I suspect it's where the translation breaks: a colleague reports the one comparison out of twenty that came out significant. No false statement anywhere, no hidden data — just a choice about what to report and what to leave out. Every reader concludes the effect is real and roughly the size of the estimate. Where does that sit in the philosophers' distinction, and does my framework have anything to say about it that theirs doesn't?

  Assume I'll follow the technical terms; don't spend the answer doing pragmatics 101. Keep it tight and use these sections, in this order: The translation (600–800 words); Term for term (a table, ten rows max, philosophers' term / my term / how clean the fit is); What got left behind (400–600 words); Your call (about 150 words) on whether the leftover is a hole in my vocabulary or a sign that the philosophers' distinction is thinner than it sounds.
reasoning: |-
  Hmm, the user is an applied statistician who reviews analyses for colleagues. Their entire framework revolves around procedural guarantees—calibration, selection bias, preregistration, and what inferences are licensed by the data. They want me to translate a philosophical debate (lying vs. misleading) into their statistical vocabulary and identify what gets lost in translation.  

  First, I need to unpack the philosophers' debate. Lying involves asserting a false statement. Misleading involves arranging true statements to guide someone toward a false conclusion—like reporting only one significant result out of twenty tests without mentioning the other nineteen. Philosophers argue about whether misleading is less wrong because the audience "could have" inferred correctly.  

  Now, translating this into the user's terms:  
  - **Procedures and licenses**: Statistical methods come with guarantees (e.g., a p-value <0.05 means false positives 5% of the time *if* used correctly). Misleading arises when you exploit loopholes in those guarantees—like running 20 tests but only reporting the significant one. The procedure (multiple testing) isn't followed correctly, so its calibration (5% error rate) is invalidated.  
  - **Omission as selection**: Leaving out non-significant results is a selection bias. It distorts the inference a "competent reader" would make—they'd assume the effect is real and sizable, not realizing the estimate is cherry-picked.  
  - **Entitlement**: The user's framework already judges this harshly. A competent reader is entitled to assume the analysis followed standard procedures (e.g., correction for multiple comparisons). By omitting context, the analyst breaches that trust.  

  **What maps cleanly**:  
  - **Lying** → **False calibration claim**: Saying "p<0.05" when you didn't correct for multiple testing falsely implies the error rate is 5%.  
  - **Misleading** → **Unlicensed inference**: Reporting a cherry-picked significant result without disclosure exploits the gap between nominal and actual procedure guarantees.  
  - **Audience effort** → **Competent reader's duty**: Philosophers say the audience should scrutinize; in stats, that's like checking preregistration or asking about multiple comparisons. But the burden is on the analyst to provide the *full* procedural context.  

  **What gets left behind**:  
  - **Intent**: The user dismisses intent ("cynical or sloppy, the procedure is misleading either way"). Philosophers care *why* someone misled—was it malice or oversight? But in stats, the procedural flaw is the same. Intent only matters for *distrust*, not the flaw itself.  
  - **Moral wrongness**: Philosophers debate whether misleading is inherently less blameworthy. In stats, there's no gradient—both lying and misleading invalidate the procedure. The "wrong" is unlicensed inference, period.  
  - **Pure pragmatics**: Philosophers might argue misleading isn't wrong if the audience *should* have known better. But in stats, even if readers *could* ask about multiple testing, the analyst must *preemptively* disclose. The default assumption is procedural integrity.  

  **The case study**: Reporting 1/20 significant comparisons.  
  - In philosophy, this is "merely misleading" (true statements, false conclusion).  
  - In stats, it's a **selection-distorted inference**. The estimate's size is likely exaggerated, the significance is uncalibrated (actual false positive rate >>5%), and the reader is misled about evidence strength.  

  **My call**: The leftover (intent/moral gradients) isn't a hole in the user's framework—it's noise. Their vocabulary *improves* on philosophy by focusing on procedural integrity over motives. What matters is whether the inference is licensed, not whether the analyst "technically" lied. The philosophers' distinction feels thin because in stats, both lying and misleading break the machinery of inference the same way: by severing the link between procedure and guarantee.  

  **Key insight**: For the user, the philosophical debate collapses. Whether you lie ("p=0.03" when it's actually 0.07) or mislead (reporting p=0.03 without mentioning 19 other tests), you've invalidated the procedure's calibration. The real distinction is between licensed and unlicensed inferences—and both sins live in the latter category.
answer: |-
  ### The Translation
  In your framework, the lying/misleading debate maps onto the distinction between **violating a procedure's calibration** and **exploiting gaps in its licensing power through omission or selection**. Here's the translation:

  - **Lying** becomes **asserting a procedurally false claim**. This means stating an output (e.g., "p = 0.03") that misrepresents the actual computational/experimental procedure. Your guarantees focus on calibration: a p-value is calibrated only if the null hypothesis is true and the test assumptions hold. Falsifying data or misreporting results breaks calibration directly—like claiming a 5% false positive rate when the test wasn't executed correctly. The inference licensed here is null: the procedure is invalid.

  - **Merely misleading** becomes **presenting a selective or incomplete procedural output that invites an unlicensed inference**. This exploits the gap between nominal calibration (what the procedure guarantees *if* fully reported) and actual licensing (what the reader can conclude given what's omitted). For example, reporting a significant comparison without disclosing multiple testing. The claim "p = 0.03" might be computationally true, but the procedure's calibration assumes no selection bias. By omitting the other 19 tests, you invalidate the error-rate guarantee (inflating false positives). The competent reader is entitled to assume standard procedures were followed (e.g., no cherry-picking), so this omission licenses a distorted inference—e.g., "this effect is real" when it's likely noise.

  - **Audience responsibility** maps to **what a competent reader is entitled to infer**. Philosophers debate whether misleading is less wrong if the audience "should have" questioned the omission. In your terms, this hinges on whether standard practice demands scrutiny. If a field expects preregistration or adjustment for multiplicity, the reader is entitled to assume these were done; omitting them breaches procedural norms. But if ambiguity exists (e.g., exploratory analyses), the burden shifts slightly—though your framework still flags the inference as unlicensed because calibration is undefined without full context.

  In the case of reporting 1 significant result out of 20:  
  - **Philosophers**: This is "merely misleading" (no false statement, but omission induces false belief).  
  - **Your framework**: It's **selection-induced miscalibration**. The nominal procedure (a single test) guarantees ~5% false positives under the null, but the actual procedure (multiple testing) has a ~64% family-wise error rate for 20 tests. By selecting the significant result, you present an estimate whose mean (if null is true) is inflated, and whose uncertainty is misrepresented. The competent reader is entitled to conclude "an effect exists" based on p<0.05—but this inference is unlicensed because the error rate isn't 5%. The distortion isn't just about truth/falsity; it's about validity under repetition.  
  - **Key point**: Both lying and misleading break reliability, but differently. Lying falsifies the procedure's output; misleading preserves local accuracy but corrupts global calibration through selective reporting. Both invalidate licensing.

  ### Term for Term
  | Philosophers' Term | My Term (Your Framework) | Fit Cleanliness |
  |-------------------|--------------------------|----------------|
  | Lying | Asserting a procedurally false claim | Clean: Direct violation of calibration |
  | Merely misleading | Presenting unlicensed inferences via omission/selection | Clean: Exploits gaps in licensing |
  | Audience effort | Competent reader's entitlement to infer | Clean: Maps to standard procedural expectations |
  | False belief | Distorted/unlicensed inference | Clean: Inference unsupported by guarantees |
  | Intention to deceive | Motivation for procedural violation | Partial: Relevant for distrust, not calibration validity |
  | Truth/literal accuracy | Computational correctness of output | Clean: Necessary but insufficient for licensing |
  | Moral wrongness | Procedural invalidity | Partial: Your framework is diagnostic, not ethical |
  | Expectation of scrutiny | Field-specific norms for reader diligence | Clean: Defines "competent reader" baseline |
  | Lesser wrong | Reduced severity of distortion? | Unclean: Your framework treats both as invalidating |
  | Blameworthiness | Reason to distrust the analyst | Partial: Separate from procedural flaw |

  ### What Got Left Behind
  Three elements don't survive the translation cleanly:  
  1. **Intent as a moral dimension**: Philosophers treat intent (e.g., deliberately misleading vs. careless omission) as central to blame. Your framework discards this. Whether selection is cynical or sloppy, the procedural consequence is identical: calibration is broken, and the inference is unlicensed. Intent only matters for whether you distrust *future* analyses from that person—it doesn't change the current procedure's validity. This flattens the moral distinction; in your terms, "merely misleading" isn't "less wrong" if it induces the same unlicensed inference as lying.  

  2. **Graded wrongness**: Philosophers debate whether misleading is *inherently* less bad than lying. Your framework has no gradient for "how invalid" a procedure is. Both lying about a p-value and omitting multiple comparisons render the output uncalibrated—period. The philosophers' nuance (e.g., "misleading respects autonomy by letting the audience decide") becomes irrelevant. In your world, the "autonomy" is the reader's entitlement to assume standard procedures; violating that is binary.  

  3. **Pure pragmatics without procedural stakes**: Philosophers sometimes argue misleading isn't wrong if the audience *could* have spotted the omission (e.g., asking "did you run other tests?"). Your framework rejects this. Competent readers are entitled to rely on reported procedures; the burden is on the analyst to disclose threats to calibration (e.g., selection). The case of 1/20 tests highlights this: even if readers *should* suspect cherry-picking, your vocabulary prioritizes the procedure's integrity over audience vigilance. What's "left out" is the idea that misleading is acceptable if the listener is complicit—in stats, silence about multiplicity is always a flaw.  

  The case study exposes the starkest gap: philosophers see "true but misleading" as distinct from falsity. You see both as **invalidating licensing**. Reporting 1/20 tests isn't "merely" misleading—it's presenting an estimate with biased magnitude and uncalibrated uncertainty. Philosophers lack your conceptual machinery to articulate *why* this distorts inference even without false statements. Their focus on literal truth misses selection's corrosive effect on reproducibility.  

  ### Your Call  
  The leftover isn't a hole in your vocabulary—it's a sign that the philosophers' distinction is **thin and context-bound**. Your framework subsumes their debate: both lying and misleading become subsets of **procedural invalidity**, judged by whether they license distorted inferences under repetition. Intent and moral gradients add nothing to diagnosing the flaw. The case study proves this—philosophers debate "wrongness," but you identify the concrete harm: selection inflates effect sizes and error rates, making the inference unactionable. Their distinction collapses because in applied stats, *what licenses reliable conclusions* is all that matters. The philosophers' "merely" is a luxury your pragmatism can't afford. Keep your lens; theirs distracts.
