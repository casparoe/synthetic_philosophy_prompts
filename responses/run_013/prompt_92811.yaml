prompt: |-
  I'm a trustee of the small family foundation my mother ran until her death last spring, and I'm now the one who signs off on our grant decisions. A week from Monday the board votes on the chair's proposal — my older brother's — to decide one specific question by futarchy rather than by discussion: do we keep funding the job-training program we have run for nine years, or move that same money into unconditional cash grants to the same families? His mechanism is two subsidized conditional markets, run in-house on a spreadsheet with a market maker supplying liquidity, since we cannot count on real volume: one contract pays out if we adopt training and our chosen metric (share of participants in full-time work twelve months later) rises above its current baseline, the other pays out if we adopt cash grants and that same metric rises. The board would commit in advance to adopting whichever conditional price is higher, and my brother wants the commitment made before anyone sees the prices. Three of the seven trustees call this either a gimmick or a way for him to ratify an answer he already holds; I am genuinely undecided, and I have to circulate my opinion before the meeting.

  Draft that written opinion. It should take up, at minimum: that the metric is itself a value choice we would be smuggling in by fiat, and whether the market can legitimately be used to settle it; whether a market with perhaps two dozen possible participants, all of whom know each other, can carry any information at all, and how much subsidy would be needed before the prices mean anything; what to do about the fact that the people best positioned to trade — our program staff and our grantees — are also the people whose salaries and stipends turn on the outcome; and what the board should do if the two prices come out within noise of each other, which is the outcome I privately expect. Give me exactly five numbered points, each one or two sentences, leading with a concrete recommendation and ending with the strongest consideration against it. No introduction and no conclusion.
reasoning: |-
  Hmm, the user is a trustee of a family foundation facing a crucial vote on using futarchy to decide between job training and cash grants. They need a structured written opinion for the board meeting. 

  First, I need to unpack the core tensions here: it's not just about mechanism design but also family dynamics (brother's proposal), legitimacy concerns (trustees calling it a gimmick), and operational realities (tiny market size). The user's neutrality is key - they're genuinely undecided, so my response must balance critique with constructive pathways.

  The five required points demand surgical precision. For each, I'll: 
  - Lead with actionable recommendations (since they must circulate decisive opinions) 
  - Anchor in the user's stated concerns: value smuggling via metric, thin-market corruption risks, subsidy distortions, and tie scenarios. 
  - End each point with the sharpest counterargument as requested - that's crucial for board credibility.

  Notably, the staff conflict-of-interest angle feels most ethically urgent. I'll place it high in the sequence since financial coercion could invalidate the whole exercise. Also, the "noise" problem needs mathematical framing - maybe invoke bid-ask spreads? 

  For tone: avoid academic jargon. They're trustees, not economists. Phrases like "smuggling in by fiat" can stay - it's their own language. But explain liquidity subsidies concretely ("$5000 market maker loss cap"). 

  Last, resist adding intro/conclusion. The user wants pure numbered logic. Though privately I worry they're underestimating how much this could fracture family dynamics...
answer: |-
  Here are five numbered points addressing your concerns:

  1. **Recommend voting against the futarchy proposal as designed.** The mechanism illegitimately elevates a single metric (full-time employment share) to sole arbiter of welfare, smuggling in a substantive value judgment by fiat that should instead be debated by the board.  
     *Strongest against:* Dismissing a novel predictive tool outright risks stagnation and ignores potential for revealing aggregated expert judgment.

  2. **If proceeding, demand an independent, subsidized external market maker and anonymized trading to combat bias.** A tiny in-house market of interconnected trustees and conflicted staff is profoundly vulnerable to collusion, signaling, and noise, rendering prices meaningless without strict controls and significant subsidy.  
     *Strongest against:* Anonymity and external oversight drastically increase complexity/cost and may be impossible for our tiny pool, undermining feasibility.

  3. **Require immediate recusal and trading bans for all staff/grantee families due to irreconcilable conflict of interest.** Their salaries/stipends depend directly on the outcome, creating overwhelming financial incentive to trade strategically to sway the result, not reveal true beliefs.  
     *Strongest against:* Excluding those with the deepest operational knowledge guts the market's predictive power and core rationale.

  4. **Set a formal, pre-defined minimum price delta (e.g., >10%) for implementation and require full subsidy disclosure.** Without a clear "noise" threshold, near-identical prices (likely given thin volume) would force an arbitrary decision, and undisclosed subsidy levels distort price signals unpredictably.  
     *Strongest against:* Setting an arbitrary delta threshold introduces new bias, and revealing subsidies could influence trader behavior.

  5. **Insist the board explicitly reaffirm its authority to override the mechanism if prices are inconclusive or process flaws emerge.** The market is an advisory input, not a binding oracle; the board retains final fiduciary duty and cannot delegate its judgment to a gamed or statistically insignificant signal.  
     *Strongest against:* Retaining override power undermines the commitment's credibility, potentially causing traders to discount the market's influence and reducing engagement.
