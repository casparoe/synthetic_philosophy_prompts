answer: |-
  ## The Tannery's Hidden Pattern

  The stench of oak galls and lye bit deep in Elara’s throat, a familiar anchor after twenty years. Before her, stretched taut on the frame, lay the problem: a calfskin, stubbornly stiff along one edge despite weeks in the vat. It should be supple, uniformly receptive to the oil she was about to knead in. Instead, it resisted like old wood.

  "See here, Tomas?" Elara rasped, running a calloused thumb along the rigid seam. Her new apprentice, barely sixteen, peered close, his nose wrinkling. "Too long in the weak solution? Or maybe the rawhide wasn’t scraped clean enough before salting?"

  Tomas nodded eagerly, parroting her past lessons. "Aye, Mistress Elara. Unclean hide holds the stiffness. Or... uneven drying after the alum?" He was bright, Tomas, grasping the *what* and the *when* faster than most. He soaked up her explanations – the timing, the temperatures, the feel of the grain – like thirsty leather.

  Elara grunted, unconvinced. She’d seen hides from the same batch, salted on the same day, scraped by the same blade, react like siblings raised apart. One would tan butter-soft; another, like this calfskin, would fight her. Her standard remedies – extra kneading, a warm oil bath – usually coaxed it around. Usually. Today felt different. A fly buzzed against the grimy window, a tiny, frantic competence navigating glass it couldn’t comprehend.

  She began working the oil into the pliable areas, her hands moving with a rhythm learned through ten thousand repetitions. Push, roll, press. The leather drank it in, darkening, yielding. But the stiff edge repelled the oil, beading it up like rain on waxed cloth. She focused harder, applying pressure just shy of tearing, feeling for the hidden grain, the subtle shift beneath her fingertips that signalled the leather was ready to accept the transformation.

  "Watch the pressure," she instructed Tomas, her voice tight. "Too much, it tears. Too little..." She nodded at the unyielding strip. "...it stays dead. You have to *feel* when it starts to give. Like... like persuading a shy horse."

  Tomas watched her hands, mesmerized by their certainty. He didn’t see the quiet panic beneath Elara’s concentration. The formula wasn’t working. Her explanations – the salt, the scrape, the solution strength – felt suddenly like stories told around a fire, comforting but insufficient against the cold reality of this particular skin. How *did* her hands know? There was no single moment of decision, just a continuous, unthinking flow of adjustments – a fraction more pressure here, a circling motion there – that somehow, most times, produced supple leather. But *why* this one resisted? Why did her hands instinctively avoid the tear-point *here* but apply extra force *there*? The competence felt vast and alien, humming beneath her conscious thoughts like the vats in the cellar.

  Frustration mounted. She tried warming the oil. She tried a different blend, infused with chamomile she kept for difficult skins. The stiff edge remained obdurate. Tomas, eager to help, mimicked her motions on a small section, pressing too hard. A tiny, fatal tear opened in the leather's surface.

  "No!" Elara’s cry was sharp. She pulled his hand back, the gesture instinctive, protective of the hide and the boy. But the damage was done. A flaw. Her perfect record for the month, shattered. Not by ignorance, but by misapplied knowledge. Tomas had followed her instructions – her *story* – about pressure and feel, but without the deep, wordless calibration her hands possessed. His face crumpled.

  "Sorry, Mistress. I... I thought I felt it give..."

  Elara stared at the tear, a small black mouth in the pale leather. Not anger, but a colder dread washed over her. Her explanations had failed Tomas. More terrifyingly, they failed *her*. What guided her hands wasn’t the litany of causes and effects she recited. It was something else, something woven into the dance between her senses and the material, a pattern she participated in but didn't author. Like the termites she’d watched as a child, each daubing mud without a blueprint, yet raising towering, ventilated mounds. Competence without a comprehending mind.

  She looked down at her own oil-stained hands, resting now on the flawed hide. She needed to explain the tear to Tomas, to salvage the lesson. "It's... it’s about..." she began, her voice rough. She gestured vaguely at the hide, then at her own temple. "Knowing... *in here*..." But her words tangled. How could she explain the knowing when she didn’t know how the knowing knew? She fell silent, staring at her hands as if they belonged to a stranger. Her fingers moved slightly, unconsciously tracing the grain around the tear, assessing the damage with a touch that was already calculating salvage – a smaller purse, perhaps, avoiding the flaw. The movement was pure, undirected competence, happening *despite* her mental stumbling block. She saw Tomas watching her hands, not her face, understanding dawning in his eyes, not from her failed explanation, but from the silent, efficient language of her touch.

  The fly buzzed again, finding a crack in the window frame and vanishing into the sunlit yard. Elara closed her mouth. The stink of tannin and oil was suddenly overwhelming. She picked up a pumice stone.

  "We save what we can," she said, her voice flat. She began sanding the edges near the tear, smoothing, making the flaw part of a new, smaller boundary. Her hands moved with their old certainty, finding the rhythm, the pressure. The sanding dust rose, smelling faintly of the earth and the animal. It wasn't perfect leather anymore. But under her hands, competent and blind, it was becoming something else, something that would hold. She worked, and the only sound was the rasp of stone on skin, and the heavy, incomprehensible silence of things that simply know how to be done.
