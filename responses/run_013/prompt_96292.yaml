answer: |-
  Here is the specification of desiderata for an adequate theory of akrasia, structured as requested. Requirements marked ** are non-negotiable for any theory claiming to address the core phenomenon; others reflect significant but potentially contestable commitments within the field.

  ---

  ### **I. Core Case Accommodation** [**Non-negotiable**]
     - **Requirement**: Must explain how an agent can simultaneously:  
       (a) Hold an all-things-considered (ATC) practical judgment favoring action A at time T;  
       (b) Freely (non-compulsively) perform ~A at T;  
       (c) Not retract the ATC judgment during/after T;  
       (d) Experience genuine *regret* over ~A;  
       (e) Acknowledge ~A as *her own* action (not alien).  
     - **Motivation**: Without (d) and (e), the phenomenon collapses into mere mistake or external coercion. Regret and ownership distinguish akrasia from apathy or dissociative states.  
     - **Resolution vs. No Resolution**: Abandoning a prior resolution under temptation is *distinct* from never forming one. The former involves a specific betrayal of commitment; the latter may reflect indecision or ambivalence, not necessarily weakness.

  ### **II. Synchronic vs. Diachronic Weakness** [Negotiable: Preference of diachronic-focused camps]  
     - **Requirement**: Must adjudicate whether synchronic preference reversal (e.g., smaller-sooner reward preferred over larger-later *as options approach*) constitutes akrasia *if the agent deplores it*. Must specify if this is one episode (diachronic failure) or two (synchronic failures).  
     - **Motivation**: Synchronic reversals (e.g., hyperbolic discounting) may reflect a structural preference inconsistency, not a failure to act on a *current* ATC judgment. The theory must decide if regret alone suffices for akrasia or if synchronic judgment-action conflict is essential.

  ### **III. Inverse Akrasia** [**Non-negotiable**]  
     - **Requirement**: Must *not* equate weakness of will with objective moral failure. Must explain why acting *against* one’s own (flawed) ATC judgment to do the *right* thing is not weak-willed, even if procedurally similar to core akrasia.  
     - **Motivation**: To avoid normative dogmatism. An agent acting courageously against internalized bigotry exhibits procedural akrasia but substantive virtue; the defect lies in the judgment, not the will.

  ### **IV. Impostor Case (Judgment Drift)** [**Non-negotiable**]  
     - **Requirement**: Must *not* be satisfied by mere alignment between action and judgment. Must diagnose cases where judgments are retroactively adjusted to match actions as *distinct from continence*.  
     - **Motivation**: Reveals that akrasia requires *resistance* between judgment and action. "Self-alignment" via rationalization exhibits bad faith or self-deception, not strength of will.

  ### **V. Boundary with Compulsion/Incapacity** [**Non-negotiable**]  
     - **Requirement**: Must distinguish akrasia from failures due to paralysis, phobia, addiction, or OCD. Must identify the differentiating factor (e.g., *reason-responsiveness*, *sensitivity to judgment*, or *volitional control*).  
     - **Motivation**: Blame/praise hinges on this distinction. Identical subpersonal processes (e.g., dopamine dysregulation) may underlie both; the theory must explain why some dysfunctions exempt from responsibility (compulsion) while others (akrasia) do not.

  ### **VI. Precommitment** [Negotiable: Preference of control-based camps]  
     - **Requirement**: Must classify an agent who precommits (e.g., binds herself) and is later restrained as:  
       (a) *Neither weak nor continent at the moment of restraint* (since no choice occurs);  
       (b) Having exercised *prior* self-control.  
       Must also explain how self-binding is possible without paradox.  
     - **Motivation**: Precommitment is a tool *for* self-control but involves no willpower at the forbidden choice-point. Theories that conflate restraint with continence misrepresent agency.

  ### **VII. Empirical Adequacy** [Negotiable: Preference of empirically engaged camps]  
     - **Requirement**: Must accommodate:  
       (a) Hyperbolic/declining discounting (preference reversals over fixed outcomes);  
       (b) Demand for precommitment mechanisms (e.g., paying to restrict future options).  
       Must also take a stance on whether time-inconsistent preferences constitute *irrationality* or a neutral cognitive trait.  
     - **Motivation**: Robust intertemporal choice data cannot be ignored. However, labeling all discounting as "akrasia" risks overmedicalizing ordinary planning.

  ### **VIII. Critical Distinctions** [**Non-negotiable**]  
     The theory must **not collapse**:  
     - **Weakness vs. Change of Mind**: Revising an ATC judgment due to new reasons is rational, not weak.  
     - **Weakness vs. Self-Deception**: Hiding conflict from oneself (Impostor Case) is distinct from succumbing to felt conflict.  
     - **Weakness vs. Weakness of Desire**: Failing to act because desire is inert (e.g., depression) lacks the tension of judgment overriding active desire.  
     - **Not Trying vs. Trying/Failing**: Akrasia involves *choice*, not incapacity despite effort (e.g., unable to resist torture).  
     - **Deliberative vs. Predictive Stance**: The first-person experience of "I could have done otherwise" must coexist with third-person explanations (e.g., discounting processes).

  ---

  ### **Tensions and Trade-offs**  
  1. **Blame Aptness vs. Empirical Mechanism**:  
     - **Conflict**: The *Core Case* (regret, ownership) demands control for blame, but *Empirical Adequacy* suggests automatic discounting processes.  
     - **Resolution**: Either restrict "true akrasia" to synchronic failures (preserving control) or redefine control in compatibilist terms (risks exculpating some cases).  

  2. **Judgment Centrality vs. Impostor/Inverse Cases**:  
     - **Conflict**: Privileging ATC judgment is undermined by *Impostor* (drifting judgments) and *Inverse Akrasia* (flawed judgments).  
     - **Resolution**: Decouple "judgment" from moral truth (*Inverse*) and require judgment-action conflict to be conscious (*Impostor*).  

  3. **Diachronic Unity vs. Synchronic Atomism**:  
     - **Conflict**: Treating diachronic reversal as one failure (*Synchronic/Diachronic*) clashes with the *Predictive Stance* (many discounting events).  
     - **Resolution**: Deny that discounting-based reversals are akrasia unless accompanied by synchronic judgment (*Synchronic/Diachronic* requirement).  

  ### **Most Exclusionary Requirement**  
  **Impostor Case**: Excludes judgment-centred theories (e.g., Davidsonians) that prioritize coherence over authenticity. If judgments are malleable post hoc, mere alignment proves nothing.  

  ### **How Major Families Fare**  
  - **Judgment-Centred** (e.g., Davidson): Fails *Impostor Case* and struggles with *Diachronic Weakness*.  
  - **Will-Centred** (e.g., Kennett): Excels on *Control/Compulsion Boundary* but may overextend "will" to cover *Precommitment*.  
  - **Attention-Centred** (e.g., Holton): Handles *Precommitment* and *Distinctions* well but risks reducing akrasia to cognitive lapse (*Core Case* regret may lack depth).  
  - **Preference-Theoretic** (e.g., Economists): Aces *Empirical Adequacy* but flattens *Core Case* (no regret/ownership) and *Inverse Cases*.  
  - **Eliminativist** (e.g., Ryleans): Denies distinct phenomenon; crushed by *Core Case* regret and ownership.  

  ### **Dual Purposes**  
  - **Explaining/Predicting Behavior**: Prioritizes *Empirical Adequacy*, *Synchronic/Diachronic*, *Precommitment*.  
  - **Blame Aptness**: Prioritizes *Core Case*, *Boundary with Compulsion*, *Distinctions* (esp. control and ownership).  

  ---  
  This framework isolates pressures on any theory. The sharpest divide is between theories preserving the *Core Case* phenomenology (demanding control/regret) and those prioritizing empirical parsimony (e.g., preference reversals). A successful theory must bridge this gap or choose sides.
