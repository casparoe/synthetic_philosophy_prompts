prompt: |-
  I spent 35 years as a field geologist and retired a few years back, and since then I've been reading philosophy on my own, which means I probably get things half wrong and don't always know it. Next month I'm running a session for a small group of retired scientists who read philosophy together. Eight people, all sharp, none of them has done any decision theory, and a couple of them will be quietly skepticle of the whole enterprise. Topic: Parfit's hitchhiker, the desert case where you promise a reward you won't want to pay and the driver, who can read you, leaves you there. Don't explain the case to me, I have it. I want a teaching plan.

  Specifically: the order the ideas have to go in so the punchline lands as a real problem and not as a riddle with an obvious answer, and why each step has to come before the next. Which piece of the example should carry the whole thing, what it needs and what it must not have (no repeat encounters, no reputation, no enforcement, no way to precommit), and what to swap in if the group bounces off the desert. The misconceptions they'll arrive with or form, in the order they'll form them, and exactly where in the sequence to head each one off. I'd guess they'll decide it's just about trust and reputation, or that Parfit is telling you to lie, but you'll know better. One question I can ask at the end that shows whether they've got the actual problem or just nodded along. And what I should say out loud that we're not covering at this level.

  Also tell me where this plan is most likely to fail with this particular audience, and what would change your mind about the ordering you give me.

  Keep the whole thing under 500 words.
reasoning: |-
  Okay, let me tackle this query from a retired geologist preparing a philosophy session on Parfit's Hitchhiker. The user has 35 years of field experience and now self-studies philosophy - they're clearly intelligent but wary of gaps in understanding. Their audience: eight sharp retired scientists, some skeptical of decision theory. 

  First, I need to honor their expertise. They know the desert case details, so no rehashing. The real challenge is sequencing ideas so the paradox lands effectively. Key constraints: no reputation/repeat interactions, no precommitment - must isolate the core conflict between rationality and self-interest.

  The teaching sequence must:
  1) Start with standard rational choice theory (maximize utility)
  2) Introduce the dilemma where future self won't pay
  3) Show how this creates a deadlock despite mutual benefit
  4) Reveal the paradox: being "rational" causes the worse outcome

  Biggest risks with scientists:
  - They'll jump to "just build trust/reputation" (must explicitly forbid this upfront)
  - Might see it as advocating lying (emphasize it's about intention)
  - Could dismiss as unrealistic (stress it's a purified thought experiment)

  For misconceptions:
  Order of likely objections:
  1. "Driver should trust me" → Block by emphasizing driver's perfect knowledge
  2. "What about future reputation?" → Ban repeat interactions
  3. "Just sign a contract" → Remove enforcement mechanisms

  Contingency if desert setting fails: Swap in a medical scenario where a doctor must promise care to get paid, but won't want to deliver later. Keeps the core structure intact.

  Critical test question: "Why can't a rational person make this promise truthfully?" If they grasp that intention formation is impossible when future self defects, they've got it.

  Failure points: 
  - Skeptics might reject the "perfect knowledge" premise
  - Or insist real-world solutions exist (must emphasize theoretical isolation)

  Word count is tight - I'll prioritize the sequence structure and misconception handling. The medical alternative gets one line since desert is primary. Final note should acknowledge this simplifies Parfit's full work.
answer: |-
  Here's a concise teaching plan designed for skeptical scientists, focusing on logical sequencing and misconception prevention:

  **Core Sequence & Why:**
  1.  **Establish Baseline Rationality:** "Assume rational agents: self-interested, maximize expected utility, logically consistent." *Why first?* Defines the shared framework. Scientists accept rational choice as a starting model.
  2.  **State the Dilemma Clearly:** "You're dying in the desert. Driver offers rescue *only* if you *promise now* to pay $1000 later. Driver reads minds perfectly - knows if you *intend* to pay or intend to renege. If rescued, you *won't want* to pay later when safe." *Why next?* Sets the immutable rules. Emphasize **perfect mind-reading (no lying possible)** and **changing motivation (key to the paradox)**. Ban reputation/repeat encounters/precommitment *explicitly* now.
  3.  **Pose the Critical Question:** "Can you, rationally and truthfully, *intend* to pay *now* to get rescued?" *Why now?* Forces engagement with the core conflict *before* jumping to solutions. Focuses on the *intention formation* at T1 (desert).
  4.  **Analyze the Rational Choice at T1 (Desert):** "To get rescued, you *must* intend to pay. But the driver knows your future self (T2) will *not* pay. So, the driver sees you *cannot* genuinely intend to pay (because you know T2 won't). Therefore, driver leaves." *Why here?* Shows the deadlock: Rationality at T1 *requires* an intention you know your future rational self (T2) will defy, making the intention impossible to form genuinely. The driver's knowledge makes deception impossible.
  5.  **Reveal the Paradox:** "Result: You die. Yet, *if* you paid later, *both* would be better off (you alive -$1000 > dead, driver +$1000). Rationality seems to forbid the mutually beneficial outcome." *Why last?* The punchline. Highlights the conflict between rationality at different times and the suboptimal outcome.

  **The Essential Piece:** The **perfect mind-reading** combined with the **known future preference shift** (T2 won't want to pay). This eliminates trust/reputation/lying as factors. *Must not have:* Any mechanism for enforcement, binding contracts, or future consequences beyond the immediate payment.

  **Contingency (If Desert Bounces):** Use a **single, life-saving medical treatment:** You must promise payment *before* treatment (doctor can perfectly assess intent), but once cured, you won't *want* to pay the large sum. Structure remains identical.

  **Key Misconceptions & Interception Points:**
      *   **Early (Step 2):** "It's about trust/reputation." → Intercept: Explicitly ban repeat interactions/reputation. Stress driver *knows intent directly*.
      *   **During Analysis (Step 4):** "Just lie / fake intention." → Intercept: Reiterate **perfect mind-reading makes deception impossible**. The driver knows your *actual* intention.
      *   **After Paradox (Step 5):** "Parfit says be irrational/just pay later." → Intercept: Clarify the puzzle is about *rationality* causing the bad outcome. Parfit highlights a flaw in standard *models* of rationality/decision-making over time. He isn't prescribing dishonesty.
      *   **After Paradox (Step 5):** "It's unrealistic." → Acknowledge it's a *thought experiment* designed to isolate a specific logical conflict in decision theory.

  **Critical Test Question:** "At the moment in the desert (T1), *why* is it *impossible* for a rational agent to genuinely form the intention to pay later?" *(Correct Answer: Because they know their future rational self (T2) will not pay, and the driver knows this too, making a sincere intention logically incoherent.)*

  **What to Explicitly Set Aside:** "We're focusing narrowly on the conflict within standard rational choice theory. We're *not* covering solutions (e.g., commitment devices, different utility functions, causal vs. evidential decision theory) or Parfit's broader ethics."

  **Most Likely Failure Point & Order Challenge:**
  *   **Failure Point:** Step 4 (Analyzing T1 Intention Formation). Skeptics might **reject the impossibility of forming the intention** ("Just decide to pay!") or **dismiss the rigidity** ("Driver wouldn't be so rigid"). They might insist on "trust" despite the rules.
  *   **What would change the sequencing?** If the group *immediately* latches onto "But why can't I just decide to pay?" when stating the dilemma (Step 2), pivot *early* to analyzing intention formation at T1 (Step 4), even before posing the critical question formally. Force them to confront the knowledge of T2's defection head-on immediately.

