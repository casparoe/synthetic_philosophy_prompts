prompt: |-
  I'm a novelist and I keep running into a thing I dont have a word for, and I want the word — or the carving, if there isn't one — for a character I'm writing.

  The pattern: two people can agree completely on what's good and bad, same values, same trade-offs, neither caring more about money than the other, and still make opposite calls whenever the outcome is uncertain. My sister won't take a straight coin flip for a raise-or-nothing on a modest salary, even when the flip is better in plain expected dollars and the sums are small enough that diminishing returns can't be doing much of the work. My brother takes it without blinking, then buys a lottery ticket every week. When I asked my sister why, she said a one-in-a-hundred chance of losing the house "feels way bigger than one in a hundred" — not that she thinks it's more likely, just that it weighs more when she's deciding.

  And here's the part that made me think something specific is going on: it's not a general fog. A small chance of a mildly bad outcome doesn't get inflated for her at all — she shrugs at those. It's specifically when the bad thing is the worst item on the table that the tiny chance suddenly feels huge. Same probability, same person, different reaction, and the only thing that changed was whether that outcome sat at the bottom of the list.

  Then there's a second thing, and I genuinely can't tell if it's the same phenomenon or a cousin. All three of us get much more cautious when we don't even know the odds. Hand me a gamble with a stated 20% chance of a bad outcome and I'll take it; tell me it's "somewhere between 10 and 40 percent, nobody's sure" and I freeze. The number isn't worse. The ignorance is.

  So — does this have a name? The bending of the probabilities themselves (small chances of the worst thing inflated, big chances shrunk) as opposed to just caring less about extra money once you have some? And is the "I hate not knowing the odds" bit the same thing or its own seperate thing? I don't want a bare label; I want to know where the lines are — what's the same, what's different, and whether any of it is a mistake. Because it doesn't feel like a math error to her. It feels like a taste.
reasoning: |-
  Okay, the user is a novelist struggling to name a psychological phenomenon they've observed in their characters and family. They describe two core patterns: first, people inflate small probabilities of catastrophic losses but shrug off equally small chances of minor losses; second, they become risk-averse when probabilities are unknown rather than quantifiable. 

  The sister's example stands out—she doesn't misinterpret the 1% chance of losing her house, but emotionally weighs it heavier than statistics suggest. The key trigger seems to be the outcome's position as "the worst possible thing," not the probability itself. Interesting how the user notes this isn't about diminishing returns since the sums are modest.

  For the second pattern, the aversion to ambiguous probabilities feels distinct but related. The user explicitly asks whether these are two faces of one phenomenon or separate beasts. They reject oversimplified labels—this needs nuance for character authenticity. 

  Hmm... Prospect Theory immediately comes to mind for the first pattern, especially the probability weighting function where low probabilities are overweighted for high-stakes losses. But the user already knows Expected Utility Theory falls short here. Loss aversion might seem relevant but doesn't fully capture the "only for worst outcomes" specificity. 

  The ambiguity aversion part is textbook Ellsberg Paradox—people prefer known risks over unknowns. But is it meaningfully different from the first pattern? The psychological roots diverge: one is about emotional salience of catastrophe, the other about epistemic discomfort. 

  For the novelist's purpose, they need terms that resonate dramatically. "Probability weighting" sounds clinical, while "catastrophizing" is too pathological. "Zero-risk bias" almost fits but misses the probability distortion aspect. The German "Schlimmbesserung" is poetic but inaccurate. 

  The deeper need here is character authenticity. The user wants to show this isn't irrationality but coherent worldviews—their sister genuinely perceives the weight differently. That's why they emphasize "it feels like a taste." The phenomenon must feel human, not like a cognitive error. 

  Structurally, I'll split this into two phenomena since their mechanisms differ (emotional weighting vs. uncertainty intolerance), but note they often coexist in cautious personalities. The "carving" matters: one bends probability perception for existential threats, the other rejects foggy information. Both are evolutionarily adaptive—avoiding tigers in tall grass justifies ambiguity aversion, while overestimating catastrophe likelihood aids survival. 

  Crucially, neither is a "mistake" in lived experience. That's the novelist's gold: rational people can reasonably disagree here. The sister isn't bad at math; she's prioritizing psychological survival. That tension is perfect for fiction.
answer: |-
  You've hit on two distinct but related psychological phenomena that are gold for character development. Neither is a "mistake" in a simple mathematical sense – they reflect how humans *actually* experience and weigh risk, especially under uncertainty or high stakes. Here's the carving:

  ### 1. **Probability Weighting (Specifically for Low-Probability Catastrophic Losses)**
      *   **The Pattern:** Your sister's reaction – a tiny chance of the *absolute worst outcome* (losing the house) feels disproportionately large and heavy, even when she rationally knows the probability. Minor bad outcomes with the same probability don't trigger this inflation. It's specifically about the *stakes*, not just the odds.
      *   **The Name:** This is the core of **Prospect Theory's Probability Weighting Function (Kahneman & Tversky)**. Crucially, it's not symmetric:
          *   **Low Probabilities:** Are typically **overweighted** by people. A 1% chance *feels* like more than 1%.
          *   **High Probabilities:** Are typically **underweighted**. A 99% chance of success feels like less certainty than it mathematically is.
      *   **The Key Nuance You Observed:** **This weighting is massively amplified when the outcome is *extreme* and *negative***. A 1% chance of a minor annoyance is easily dismissed (underweighted or weighted accurately). A 1% chance of utter ruin feels *massive* (heavily overweighted). This is sometimes called **"catastrophizing" the low-probability tail risk**, but Prospect Theory provides the formal framework.
      *   **Why it's not just Loss Aversion/Diminishing Returns:** Loss aversion (hating losses more than loving equivalent gains) and diminishing marginal utility (extra money being worth less as you have more) are real, but you rightly note they don't fully explain this. This is about **distorting the *probability itself* mentally**, specifically inflating the *subjective weight* given to a tiny chance of disaster *because* it's a disaster. The outcome's severity warps the perception of its likelihood in the decision calculus.
      *   **Is it a "mistake"?** Not purely. It reflects an **emotional and evolutionary heuristic.** Our brains evolved to prioritize avoiding existential threats. Overestimating the danger of a potential catastrophe, even if rare, is often safer (in survival terms) than underestimating it. For your sister, the *emotional cost* of imagining homelessness, even at 1%, vastly outweighs the cold expected value calculation. It's a "taste" for psychological security against the worst-case.

  ### 2. **Ambiguity Aversion**
      *   **The Pattern:** You and your siblings freeze when facing unknown odds ("somewhere between 10% and 40%") vs. a known probability (20%), even if the known probability might be *worse* than the midpoint of the ambiguous range.
      *   **The Name:** This is classic **Ambiguity Aversion (or Uncertainty Aversion)**, famously demonstrated by the **Ellsberg Paradox**.
      *   **The Mechanism:** People strongly prefer risks with *known* probabilities ("risks") over risks with *unknown* or ambiguous probabilities ("uncertainties"). Not knowing the odds feels inherently worse. It triggers:
          *   **Lack of Control:** Inability to accurately assess or prepare.
          *   **Fear of the Worst-Case:** The mind tends to focus on the *upper bound* of the bad outcome probability (e.g., "It could be as high as 40%!").
          *   **Regret Anticipation:** Dread of making a bad choice due to ignorance ("If I gamble and lose, I'll kick myself for not knowing the odds").
      *   **Is it a "mistake"?** Again, not purely irrational. In many real-world situations (especially ancestral ones), ambiguity often signaled hidden danger or poor information quality, making caution adaptive. It's a "taste" for clarity and predictability.

  ### The Carving: Same or Different?

  *   **They are Cousins, Not Twins.** Both involve an aversion to potential loss amplified by psychological factors beyond pure probability and outcome value. Both often manifest in "cautious" personalities.
  *   **The Core Difference:**
      *   **Probability Weighting (Catastrophic Focus):** Distorts the *mental representation* of a *known*, small probability of a *specific, extreme* bad outcome. It's about the *emotional weight* of the *outcome* inflating the *subjective probability*.
      *   **Ambiguity Aversion:** Is an aversion to the *state of not knowing* the probability itself. It's a reaction to the *lack of information*, regardless of the specific outcome values (though bad outcomes make it worse). The ambiguity *itself* is the source of discomfort.

  ### How They Can Interact in Your Characters

  1.  **The Deeply Cautious (Your Sister):** Exhibits strong **Probability Weighting for Catastrophe** *and* strong **Ambiguity Aversion.** A known tiny chance of ruin feels huge, and an unknown chance of *any* loss feels paralyzing. She prioritizes avoiding the *feeling* of catastrophic risk and uncertainty above all else. Her lottery ticket avoidance *and* her raise refusal are consistent under this lens: both involve small chances of loss she finds intolerable (loss of security/status quo, or loss of money).
  2.  **The Calculated Risk-Taker (You & Your Brother - in different ways):**
      *   **You:** Seem comfortable with known risks (20% chance) but averse to ambiguity ("10-40%"). You understand probability weighting intellectually but don't feel its catastrophic pull as strongly as your sister. Ambiguity is your bigger trigger.
      *   **Your Brother:** Takes the known-risk coin flip (showing low probability weighting *for that specific moderate-stakes loss*) but buys lottery tickets. This hints at **Probability Weighting for Gains** (overweighting the tiny chance of a big win) alongside **underweighting the high probability of losing a small amount** on the ticket. His ambiguity aversion might be lower than yours or masked by his optimism bias for gains.

  ### Labels for Your Novelist's Toolkit

  *   **For the Sister's Core Trait:** Focus on **Probability Weighting for Catastrophic Loss** or **Overweighting Tail Risk.** Describe her **sensitivity to ruin** or her **aversion to the catastrophe tail.** In dialogue/internal monologue: "The shadow of disaster loomed larger than the numbers said," or "A whisper of ruin drowned out the shouts of probability."
  *   **For the Ambiguity Reaction:** **Ambiguity Aversion** is the precise term. **Intolerance of Uncertainty** works too. In character: "Not knowing the odds felt like walking blindfolded," or "The fog of chance was worse than the sharp edge of risk."
  *   **Broader Archetype:** Characters like your sister could be described as having a **high sensitivity to catastrophic loss**, a **low ambiguity tolerance**, or a **strong precautionary principle bias.**

  ### The Takeaway for Your Character

  This isn't stupidity or bad math. It's **deeply ingrained risk perception.** For your sister-like character, a 1% chance of ruin *genuinely feels* subjectively like 10% or 20% because the *emotional and existential weight* of that ruin is so immense. The known probability becomes almost irrelevant next to the overwhelming dread of the outcome itself. Similarly, ambiguity *feels* inherently dangerous, regardless of the potential numbers. It's a fundamental part of how she navigates a world full of uncertainty and potential disaster. Your brother and you simply have different calibrations on these scales. This psychological "taste" is rich territory for exploring motivation, conflict, and decision-making in your fiction.
