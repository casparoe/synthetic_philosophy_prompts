  He describes how expected value reasoning leads to absurd conclusions when dealing with vanishingly small probabilities of enormous harms. A stranger could theoretically extort him by threatening an inconceivably large punishment with an immeasurably small probability. He's unsatisfied with the three common responses: embracing these conclusions, patching the theory with thresholds/caps, or abandoning expected utility altogether.

  His physics background makes him suspect the problem lies in what we're asking of the theory rather than in specific solutions. He draws an analogy to infinite series whose sums depend on summation order - suggesting the issue might be foundational.

