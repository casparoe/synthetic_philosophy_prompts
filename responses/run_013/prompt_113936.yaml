answer: |-
  ## Referee's Report: Manuscript No. DLXVII ("Concerning Body, with Mathematical Demonstrations")  
  **Author:** Thomas Hobbes, Esq.  
  **Submitted for Consideration:** Society for the Advancement of Natural Philosophy & Civil Harmony (S.A.N.P.C.H.)  
  **Date:** 12th October, 1673  

  **Context:** The Author, celebrated for his profound works on Sovereignty and the foundations of Civil Obedience (*De Cive*, *Leviathan*), submits a portion of his larger philosophical system (*De Corpore*, 1655) concerning Geometry. He claims to demonstrate, with absolute certainty derived from first principles and definitions, the squaring of the circle. The Author asserts this geometric demonstration employs the same rigorous, definitional method that secures the infallibility of his political conclusions, rendering both disciplines immune to dispute. This submission follows numerous prior publications and exchanges on this specific geometric claim.

  **Assessment Findings:**

  1.  **Core Claim:** The Manuscript reiterates the Author's long-standing assertion of having achieved the quadrature of the circle. This is presented not merely as a solution, but as an inevitable consequence of his fundamental philosophical method, which proceeds *more geometrico* – from clear definitions through rigorous deduction.
  2.  **Methodological Justification:** The Author strongly emphasizes that the certainty of this geometric demonstration is identical in kind and force to the certainty he claims for his political doctrines. He posits that his method, correctly applied, eliminates ambiguity and ends controversy in any domain.
  3.  **Publication History & Reception:**
      *   The geometric claims herein (and variations thereof) were first published nearly two decades prior (1655).
      *   They were promptly and publicly refuted by Professor John Wallis (Savilian Professor of Geometry, Oxford) on strictly mathematical grounds, identifying specific logical errors and violations of established geometric principles.
      *   The Author responded, not by conceding error within the mathematical argument as presented, but by refining his initial definitions and adjusting subsequent steps, offering modified "demonstrations."
      *   Each modification by the Author has been met with renewed refutation by Professor Wallis and other competent mathematicians, detailing the persistent flaws in reasoning or misapplication of principles.
      *   This cycle of claim, refutation, redefinition, and renewed claim has persisted for approximately eighteen years, generating a considerable volume of pamphlets and correspondence.
  4.  **Status of the Geometric Question:** The mathematical community, including Professors holding Chairs specifically dedicated to Geometry, considers the quadrature of the circle by ruler and compass alone to be impossible based on principles established since antiquity and rigorously reinforced by contemporary analysis. Professor Wallis's refutations are widely accepted as mathematically sound by those qualified to judge.
  5.  **Author's Engagement:** The Author engages with critics primarily by challenging their adherence to his specific definitions or by modifying those definitions and the chain of reasoning derived from them. The core claim of successful quadrature remains constant, while the pathway to it shifts. The Author attributes dissent to misunderstanding of his method or malice.
  6.  **Impact on the Society & Broader Discourse:** The prolonged dispute surrounding this specific geometric claim:
      *   Consumes significant time and resources within learned circles.
      *   Generates contention rather than the resolution promised by the Author's method.
      *   Risks conflating the Author's deserved eminence in political philosophy with an unwarranted authority in pure mathematics, thereby artificially sustaining a debate considered settled by mathematicians.
      *   Has drawn the attention (and, the Author suspects, the partiality) of the Royal Society of London. The Author opposes their experimentalist approach, further complicating institutional dynamics.
  7.  **Assessment of the Current Submission:** The Manuscript offers a reformulation of the quadrature argument. While employing the Author's characteristic logical structure proceeding from stated definitions, it does not introduce fundamentally new mathematical principles nor successfully address the specific, well-documented criticisms levelled against previous versions by Professor Wallis and others. The alleged "demonstration" remains contingent upon definitions and deductive steps that the mathematical consensus finds flawed.

  **Recommendation:**

  **Reject** the Manuscript for publication under the Society's imprimatur.

  **Reasoning:**

  *   The Society's primary charge is the advancement of *settled* knowledge and the resolution of natural philosophical disputes through sound reasoning and evidence. This Manuscript, concerning a purely mathematical proposition, demonstrably fails to achieve this. It represents not a resolution, but the latest iteration in a dispute precisely *generated* by the application of the Author's advertised method to this problem.
  *   The geometric claim has been exhaustively examined and refuted by acknowledged experts in the field over nearly two decades. The Society gains no philosophical or mathematical credit by lending its authority to perpetuate a contention widely regarded as sterile and resolved elsewhere.
  *   While the Author's stature in political philosophy is considerable, it does not confer mathematical infallibility. The Society must evaluate submissions based on their intrinsic merit within the relevant discipline. The conflation of political authority with geometric truth, though presented by the Author as a strength of his system, is in this instance a source of persistent confusion and unproductive strife.
  *   The Author's method, presented as the antidote to civil and intellectual discord, has, in this specific geometric application, produced precisely the opposite effect: two decades of unresolved, increasingly bitter, public dispute. The Society should decline to become further entangled in a controversy that exemplifies the very disputation the Author's overarching system seeks, but here fails, to extinguish.

  **Conclusion:** The Manuscript offers no mathematically novel or convincing demonstration of the circle's quadrature. Its publication would serve only to perpetuate a quarrel that exhausts learned energies, undermines the Society's reputation for advancing *clear* knowledge, and stands as an ironic testament to the limitations of a method promising dispute's end. The Author's valuable contributions to political philosophy remain unaffected by this recommendation concerning his geometry.

  ---
  **Referee's Note:** *Let this stand as a procedural finding. It is a melancholy observation that the desire to make politics as certain as geometry has resulted in a mathematical dispute more enduring than many a civil war.*
