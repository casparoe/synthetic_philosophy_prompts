prompt: |-
  I'm teaching a grad seminar on performance legitimacy — the idea that a regime can earn acceptance through prosperity and order rather than through elections or consent. Next week we're on the China/Singapore version of the debate, and I want to open with a bit of Mencius that I think cuts against the whole framing. You're a philosopher who works on early Chinese ethics, so help me read it carefully. Here's the passage, from Legge's translation of Mencius, Gong Sun Chou I:

  Gong Sun Chou said, 'Guan Zhong raised his prince to be the leader of all the other princes, and Yan made his prince illustrious, and do you still think it would not be enough for you to do what they did?' Mencius answered, 'To raise Qi to the royal dignity would be as easy as it is to turn round the hand.'

  Earlier in the same exchange Zeng Xi is indignant at being compared to Guan Zhong — the implication being that Guan Zhong's achievement, however impressive by the standards of statecraft, is beneath contempt from the standpoint of true kingship. What I want from you is a close reading. Start by brainstorming three or four different ways to take what Mencius is rejecting here, then work through which is best supported. In particular: (a) is he denying that the hegemon's success is real success, or denying that it's the right kind of success? (b) how is the line about raising Qi to royal dignity being as easy as turning round the hand supposed to work — prediction, counterfactual, claim about available moral resources? and (c) what could a defender of performance legitimacy still say in response, without just ignoring the passage? Be explicit about which words in the text each reading leans on. Don't give me a bibliography or reading list — I can't check it and I don't need it. Just work through the passage.
