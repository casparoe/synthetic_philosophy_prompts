answer: |-
  Here's a close reading of the Mencius passage (Gong Sun Chou I, 1A1 in many editions) focusing on your questions, working directly from Legge's translation and the context you provided:

  **Core Passage Context:**
  *   Gong Sun Chou suggests Mencius could/should emulate Guan Zhong (who made Duke Huan of Qi a Hegemon/Ba) or Yan (who made his prince illustrious).
  *   Mencius dismisses this indignantly. He implies Guan Zhong's achievement is "beneath contempt" (as Zeng Xi felt) from the standpoint of true kingship (Wang).
  *   Mencius declares: "**To raise Qi to the royal dignity would be as easy as it is to turn round the hand.**"

  **Brainstorming Interpretations of Mencius' Rejection:**

  1.  **Rejection of the *Nature* of Success (Moral Substance):** Mencius isn't denying Guan Zhong achieved power, order, or even prosperity for Qi. He's rejecting the *kind* of power achieved – Hegemony (Ba) built on force, strategy, and opportunism – versus true Kingship (Wang) built solely on transformative virtue (de) and benevolence (ren). Success as a Ba is inherently inferior and morally illegitimate, regardless of its practical outcomes.
      *   *Leans on:* The implied comparison between Guan Zhong/Ba and true Kingship/Wang; Zeng Xi's indignation ("beneath contempt"); the contrastive ease of achieving Wang ("as easy as turning the hand") – suggesting the *means* (virtue) are readily available but unused.

  2.  **Rejection of the *Scale* and *Sustainability* of Success:** Mencius might grant that Guan Zhong achieved *a* level of success (stability, power for Qi), but argues it was fundamentally *incomplete* and unstable compared to the universal, enduring, and morally grounded success of true Kingship. "Raising Qi to royal dignity" represents the *true* and *full* success Guan Zhong failed to achieve, despite having the potential.
      *   *Leans on:* The phrasing "raise Qi to the royal dignity" – implying Guan Zhong *only* got to Ba, not the higher goal of Wang; "as easy as turning the hand" suggests Guan Zhong *could have* achieved this fuller success but didn't, leaving the job incomplete.

  3.  **Rejection of the *Means* Used to Achieve Success:** The core problem is Guan Zhong's *methods* (coercion, alliances, political maneuvering – the tools of statecraft). These methods, even if they produce order and prosperity, corrupt the ruler, the state, and the relationship with the people/subjects. They cannot produce genuine legitimacy. Only virtue-based means can achieve legitimate success.
      *   *Leans on:* The deep-seated Confucian/Mencian belief in virtue (de) as the only legitimate foundation for rule; the implicit contrast between the means of a Ba (force, guile) and a Wang (moral transformation); the ease of "turning the hand" implies the *correct means* (virtue) are simple and available, but Guan Zhong chose complex, coercive ones.

  4.  **Rejection of the *Ultimate Goal* (Hegemony vs. Kingship):** Gong Sun Chou frames Guan Zhong/Yan as the pinnacle of achievement. Mencius argues they aimed at the *wrong target* entirely. The true goal isn't regional dominance or "illustriousness" (mere fame/power), but universal kingship grounded in the Mandate of Heaven through virtue. Guan Zhong's success is irrelevant because it pursued an illegitimate or inferior objective.
      *   *Leans on:* The direct comparison set up by Gong Sun Chou ("do you still think it would not be enough..."); Mencius's immediate pivot to the "royal dignity" (Wang) as the *real* objective; the ease of achieving *that* objective ("turning the hand") implies the *goal itself* was wrongly conceived by Guan Zhong and Gong Sun Chou.

  **Working Through the Interpretations:**

  *   **(a) Real Success vs. Right Kind of Success?** Interpretation #1 ("Right Kind") is strongest. Mencius *acknowledges* Guan Zhong achieved *something* – he raised his prince to be leader/illustrious. He doesn't call it fake. His scorn ("beneath contempt," the counterfactual ease) stems from its *moral nature* as Ba, not its non-existence. It's the *kind* of success (Hegemony) that is fundamentally flawed and illegitimate compared to the *kind* of success that is Kingship. #4 (Wrong Goal) is closely related and also well-supported. #2 (Incomplete) has merit, but the primary emphasis is qualitative (Ba vs. Wang) rather than quantitative (some vs. more power). #3 (Means) is crucial but often seen as *leading to* the flawed nature of Ba (#1).
      *   *Verdict:* Primarily **denying it's the *right kind* of success** (Hegemony vs. Kingship), which inherently involves flawed means and an inferior goal.

  *   **(b) The "Easy as Turning the Hand" Line:**
      *   **Prediction?** Unlikely. Mencius isn't forecasting what *will* happen to Qi, but commenting on what *could have been* if virtue were employed.
      *   **Counterfactual?** Strongest reading. Mencius is saying: *If* Guan Zhong (or a ruler employing true virtue) had been in charge, establishing true Kingship *would have been* as easy as turning the hand. This highlights the *missed opportunity* and the *availability of the superior path*. It contrasts the perceived difficulty of statecraft (Guan Zhong's complex achievements) with the perceived simplicity and power of moral transformation.
      *   **Claim about Available Moral Resources?** Essential. The ease stems from Mencius's core belief in the innate goodness of human nature and the inherent power of true virtue (ren, de). The capacity for Wang exists within humanity and within Qi; it doesn't require external force or complex strategy, just the cultivation and expression of innate moral resources ("the sprout" of virtue). Guan Zhong ignored this readily available power.
      *   *Verdict:* Primarily a **counterfactual** ("it *could have been* done easily") grounded in a **claim about universally available moral resources** (the power of virtue inherent in humans/rulers). The hyperbole ("easy as turning the hand") emphasizes the *moral* simplicity and potency of the true path compared to the morally compromised complexity of statecraft.

  *   **(c) Defender of Performance Legitimacy's Response:**
      A defender of performance legitimacy (PL) could concede Mencius's philosophical point about the ideal while arguing for the practical necessity and legitimacy of Guan Zhong's approach:
      1.  **Moral Idealism vs. Practical Necessity:** "Mencius sets an impossibly high standard. In the real world of the Warring States, plagued by chaos and violence, Guan Zhong's achievement – bringing order, stability, and relative prosperity to Qi and the region through effective statecraft – *was* legitimate performance. It met the people's most urgent needs. Waiting for perfect virtue to manifest was a luxury Qi couldn't afford. The 'ease' of kingship is a philosophical abstraction, not a practical reality in turbulent times."
      2.  **Foundational Step:** "Guan Zhong's hegemonic order, while imperfect, created the *preconditions* necessary for the later emergence of true kingship. It stopped the bleeding. Performance legitimacy based on tangible outcomes (security, basic welfare) is the essential first step *towards* the higher moral legitimacy Mencius desires. You cannot cultivate virtue amidst utter chaos."
      3.  **Outcomes vs. Intentions:** "Mencius focuses obsessively on *means* and *motivation* (virtue). But for the people experiencing the results, Guan Zhong's *performance* – the order and prosperity he delivered – constituted legitimacy. The 'ease' of turning to virtue is irrelevant if the virtuous ruler fails to deliver practical results. Guan Zhong delivered."
      4.  **Reinterpreting the 'Ease':** "The 'ease' Mencius describes might reflect the *appeal* of virtuous rule, not its practical implementation. Building institutions, managing complex economies, defending borders – these require the kind of statecraft Guan Zhong mastered. Virtue alone doesn't build roads or granaries. Guan Zhong's performance *was* legitimate because it tangibly improved lives using effective, albeit non-ideal, means."

  **Conclusion:**

  The strongest reading is that Mencius **rejects Guan Zhong's success as the *wrong kind* of success** – Hegemony (Ba) achieved through statecraft and force, which is morally illegitimate and contemptible compared to true Kingship (Wang) achieved through inherent virtue (de) and benevolence (ren). The "easy as turning the hand" line is primarily a **counterfactual** statement asserting that if true virtue had been employed, achieving Wang would have been straightforward, highlighting the **universal availability of moral resources** ignored by Guan Zhong. A defender of performance legitimacy can respond by arguing for the **practical necessity and tangible benefits** of Guan Zhong's approach in non-ideal circumstances, suggesting that effective governance delivering order and prosperity constitutes a legitimate (even if philosophically inferior) form of acceptance in the real world, potentially laying the groundwork for higher ideals. The core tension Mencius exposes is between the *morality of origins/means* and the *effectiveness of outcomes* as grounds for legitimacy.
