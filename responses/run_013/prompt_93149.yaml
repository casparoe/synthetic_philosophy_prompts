prompt: |-
  I sit on the board of a small city foundation that runs a Remembrance Fund — about 200k a year, split among groups doing memorial and education work tied to different historical atrocities. Our charter says we don't rank suffering and that no group's claim outweighs another's, which sounded great until we actually had to cut checks. Last meeting we spent two hours doing the ranking we swore we wouldn't do, and our lawyer says we need criteria that are objective and consistently applied or rejected applicants will have grounds to sue. So comparison keeps sneaking back in through the side door. One board member keeps insisting, in a way I can't quite answer, that two atrocities can be neither equal in seriousness nor one worse than the other, and that this is different from just saying we can't compare them at all. There's also a concrete fight: one applicant wants funding for a permanent exhibit that lays several atrocities out on a single timeline, and another applicant says the side-by-side format is itself a ranking and shouldn't be funded.

  Draft the short decision memo I'll circulate before next meeting. I need an actual allocation rule for this cycle, a line on what we tell the timeline exhibit people, and the strongest case against my recommendation answered honestly rather than waved away. 400 words max. Say how confident you are in the recommendation and flag the one point your least sure about.
reasoning: |-
  Okay, the user is on the board of a small city foundation managing a Remembrance Fund. They need help drafting a decision memo for allocating funds without ranking atrocities, which their charter prohibits. The challenge is to create objective criteria to avoid lawsuits while addressing internal disagreements. 

  First, I need to unpack the core tension: their charter forbids comparing suffering, but practical allocation forces implicit comparisons. The board member's philosophical point about atrocities being "neither equal nor ranked" is tricky—it suggests a non-binary approach to moral gravity. 

  For the memo structure, I consider three key deliverables: 
  1) A clear allocation rule avoiding direct comparisons. Per-capita funding based on documented victim numbers feels most defensible—it's quantitative and mirrors historical reparations logic. 
  2) Guidance for the timeline exhibit: fund it but require contextual framing that explicitly rejects equivalency. 
  3) Preemptive rebuttals to criticism, especially that numbers-based approaches still imply hierarchy. The best counter is that victim counts are proxies for scale of impact, not moral weight. 

  My biggest uncertainty is whether per-capita allocation might unintentionally marginalize smaller atrocities. Adding a minimum funding threshold could mitigate this, but I'd note that concern openly. 

  The user's deeper need seems to be preserving the foundation's ethical integrity while operating practically. They're likely frustrated by bureaucratic constraints undermining their mission. The memo must balance legal safety with moral consistency, acknowledging the inherent messiness rather than pretending to solve it perfectly.
answer: |-
  ## Memo: Remembrance Fund Allocation Protocol & Timeline Exhibit Guidance  
  **To:** Board Members  
  **From:** [Your Name]  
  **Date:** October 26, 2023  
  **Re:** Objective Allocation Criteria & Timeline Exhibit Decision  

  ### 1. Proposed Allocation Rule (For This Cycle)
  *   **Method:** Distribute funds proportionally based on the *documented minimum number of direct victims* associated with each atrocity within our mandate (using established historical consensus sources like the US Holocaust Memorial Museum, Yale Genocide Studies, etc.).  
  *   **Rationale:** This uses an objective, quantifiable metric related to *scale of impact*, avoiding qualitative comparisons of suffering severity. It acknowledges differing magnitudes without assigning moral hierarchy, aligning with our charter's prohibition on ranking suffering.  
  *   **Example:** If Atrocity A has 100,000 documented victims and Atrocity B has 50,000, groups working on A receive 2/3 of the pool, groups on B receive 1/3.  

  ### 2. Timeline Exhibit Application
  *   **Decision:** **Fund the project**, subject to explicit conditions.  
  *   **Conditions:**  
      *   The exhibit must include prominent, unequivocal text stating: "Placing events on a shared timeline *only denotes chronological occurrence*. It does *not* imply equivalence, comparison, or ranking of the suffering endured or the nature of the atrocities."  
      *   Curatorial narrative must consistently emphasize the unique historical contexts and distinct experiences of victims for each event.  
      *   No visual elements (size, placement, color) should suggest relative importance.  
  *   **Rationale:** A timeline is a fundamental historical tool, not an inherent ranking. Our funding condition ensures it serves an educational purpose (chronology) without violating our core principle, provided the framing explicitly rejects comparison. Denying funding based on format alone sets a problematic precedent limiting educational methods.  

  ### 3. Addressing the Strongest Counter-Argument
  *   **Counter-Argument:** "Using victim numbers *is still ranking*. It implies larger numbers equate to a 'worse' event or greater claim on remembrance resources, violating the spirit of 'no claim outweighs another.' It also risks marginalizing atrocities with fewer documented victims but profound historical significance or unique horror."  
  *   **Honest Response:** This is a valid and serious concern. Our approach **does use a quantitative metric that reflects scale**, which inevitably carries weight. However:  
      *   It avoids the *qualitative* ranking of suffering we explicitly prohibit. Scale is different from severity.  
      *   It provides an *objective, non-arbitrary criterion* essential for defensible, consistent allocation and legal protection.  
      *   It acknowledges the practical reality that resource allocation requires *some* measurable distinction. Scale of impact is the least morally fraught quantitative measure available.  
      *   It doesn't negate the significance of smaller-scale atrocities; it simply allocates *financial resources* based on one pragmatic factor. We actively encourage applications covering all mandated atrocities.  

  **Confidence Level:** **Moderately High** in the allocation rule as a legally defensible, practical solution for *this cycle*. **High** in funding the timeline exhibit with conditions.  

  **Key Uncertainty:** Whether the **victim-count metric inadvertently devalues atrocities with profound cultural/psychological impact but smaller documented victim numbers**. We must monitor this and be prepared to review/adjust criteria next cycle if specific atrocities consistently receive minimal funding despite active applicant groups.  

  **Action Requested:** Vote to adopt the proportional victim-count allocation method for the current funding cycle and approve the timeline exhibit funding with stipulated conditions. Discuss uncertainties for future review.
