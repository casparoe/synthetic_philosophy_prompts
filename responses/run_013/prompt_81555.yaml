  The user has very specific requirements: a proper 39-line sestina with standard rotation, three-line envoi using all six end-words, and these end-words should be concrete scientific terms rather than abstractions. The voice should be of an experienced researcher talking to a younger colleague leaving for a rival programme. 

  Key narrative elements needed: one stanza showing an empty patch (degenerating problem shift) and another showing a fruitful patch (progressive problem shift), without labeling them. The envoi should convey historical judgment without using any theoretical terminology. The poem shouldn't conclude with a clean verdict but sit in the ambiguity where the departing colleague might be right about failures but have no better alternative.

