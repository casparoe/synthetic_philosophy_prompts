prompt: |-
  My friend and I spent most of last night arguing about why promises bind, and we kept talking past each other because we never settled what an answer would even have to do. So before we trade any more theories, write me the specification: the desiderata that any adequate account of promissory obligation must meet.

  For each requirement, give the case or consideration that motivates it, and say why it should be accepted even by someone who favors a competing account. I expect the list to cover, at least, the cases the account must get right — a promise the promisee has forgotten and no longer cares about; a promise made to someone who has since died; a promise extracted by pressure that falls short of duress; a promise whose content the promisor misdescribed; a promise made inside an acknowledged fiction or game — the distinctions it must not collapse (between being bound and merely having a reason; between the obligation's being owed to the promisee and its being a demand of the promisor's own integrity; between a promise and a prediction of one's own future conduct; between a promise and a private resolution of identical content); and whether bindingness is binary or a matter of degree.

  Two further constraints matter to me especially. The account should say what is and is not transferable — whether the promisor's obligation, or the promisee's claim, can be moved to a third party without either party's consent — and what its answer reveals about where the bindingness lives. And it should say what a promise adds to a resolution with identical content, since my friend's position is that promising is only a more public, more emphatic way of resolving.

  Then tell me which requirements are non-negotiable and which are the preferences of one camp, and flag any pair you think cannot be jointly satisfied — I suspect the demand that the obligation arise from the promisor's act alone collides with the demand that it be owed to a promisee who is aware of it. Finish with a short scorecard of the main families (will-based, practice- or convention-based, expectation- or interest-based, rights-transfer) against your list, but keep the weight on the criteria.
reasoning: |-
  Okay, the user is asking me to outline the specification for an adequate account of promissory obligation. They want desiderata that any theory must meet, motivated by specific cases and considerations. They've listed several tricky scenarios like forgotten promises, promises to deceased persons, pressured promises, misdescribed content, and promises in fiction. They also want distinctions maintained between being bound vs having a reason, obligation owed to promisee vs personal integrity, promise vs prediction, and promise vs resolution. Plus, they care about transferability and what a promise adds beyond a resolution.

  I need to structure this carefully. First, I'll identify core desiderata organized by what they must explain (explananda), distinctions they must preserve, structural features, and transferability. For each, I'll provide motivating cases and explain why even competing theories should accept them. For example, the "Forgotten Promise" case shows obligation persists without reliance, which challenges interest-based theories but must be accounted for. 

  The user especially cares about transferability and the promise-resolution distinction. On transferability, I'll analyze whether obligation or claim can move without consent and what that reveals. For the resolution contrast, I'll emphasize the interpersonal "claim-creation" element that distinguishes promises from resolutions, countering their friend's view that promises are just public resolutions.

  I should note where desiderata might conflict, like the "Solemn Vow" vs. "Unheard Promise" cases suggesting a tension between obligations arising from promisor's act alone versus requiring promisee awareness. I'll flag that as a key friction point.

  For non-negotiables, I'll distinguish universal requirements (e.g., obligation existence, directedness) from camp-specific preferences (e.g., whether wrongness is always to promisee). The scorecard will briefly map major theory families (will-based, practice-based, etc.) against the criteria but stay focused on evaluating the framework itself.

  Throughout, I'll maintain a neutral tone while showing why each desideratum is compelling independently of theory - e.g., even practice-based accounts must explain "Deathless Promise" because social practices don't vanish with death. The goal is to give their debate the rigorous scaffolding it needs.
answer: |-
  Here is a specification of desiderata for an adequate account of promissory obligation, designed to adjudicate debates like yours. Each requirement is motivated by a core case or conceptual distinction, explained why it should be accepted even by competing accounts, and categorized for negotiability and potential conflicts.

  **I. Core Explananda: Cases the Account Must Get Right**

  1.  **The Forgotten Promise:**
      *   **Case:** Alice promises Bob to water his plants while he's away. Bob forgets the promise entirely and doesn't care if the plants live or die. Alice still waters them.
      *   **Requirement:** The account must explain why Alice is *still obligated* to water the plants, even absent reliance, expectation, or any current interest/desire of the promisee.
      *   **Motivation:** Shows obligation isn't solely grounded in the promisee's *subjective state* (belief, desire, interest) or reliance. Obligation persists independently.
      *   **Non-Negotiable? Yes.** Denying this collapses promising into reliance-based obligations or makes obligation contingent on promisee psychology.

  2.  **The Deathless Promise:**
      *   **Case:** Charlie promises his dying friend Diana to donate her rare book collection to the local library. Diana dies. Charlie still donates the books.
      *   **Requirement:** The account must explain why Charlie is *still obligated* to Diana (or her estate/designated beneficiary) to donate the books, even though Diana no longer exists to have interests, expectations, or receive the benefit.
      *   **Motivation:** Shows obligation isn't extinguished by the death of the promisee and persists as being *owed to* (or in the name of) the original promisee or their rightful successor, distinct from a general moral duty.
      *   **Non-Negotiable? Yes.** Denying this either eliminates many posthumous obligations or severs the crucial link to the original promisee/directedness.

  3.  **The Pressured Promise:**
      *   **Case:** Eve desperately needs rent money. Her wealthy but manipulative uncle Frank says, "I'll lend it to you, but only if you promise to visit me every Sunday for a year, no excuses." Eve, feeling trapped, promises. The pressure isn't illegal duress.
      *   **Requirement:** The account must explain why this promise *does or does not* create a binding obligation, or creates one of *diminished force*. It must distinguish pressure affecting voluntariness from pressure merely providing a strong reason to promise.
      *   **Motivation:** Tests the conditions for valid commitment (voluntariness, autonomy) and whether "bindingness" is binary or scalar. Avoids making all extracted promises void or all binding regardless of context.
      *   **Non-Negotiable? Yes (to explain).** Accounts can differ on *outcome* (binding/not/weaker), but must provide a principled explanation for *why* the pressure matters (or doesn't).

  4.  **The Misdescribed Promise:**
      *   **Case:** Grace promises Henry to "bring the blueprints to the meeting." Grace intends the *final* blueprints (Version A). Henry understands her to mean the *draft* blueprints (Version B). Grace brings Version A; Henry needed Version B.
      *   **Requirement:** The account must explain *what Grace is obligated to do* and *why*. Is it what she intended (A), what Henry reasonably understood (B), or something else? It must handle communicative failures.
      *   **Motivation:** Addresses the role of intention vs. reasonable expectation/interpretation in fixing the *content* of the obligation. Crucial for the objectivity of the promise's terms.
      *   **Non-Negotiable? Yes.** An account must provide a criterion for resolving such ambiguities/miscommunications to determine the specific obligation.

  5.  **The Fictional Promise:**
      *   **Case:** During a game of "house," Ian (playing "Dad") "promises" Julia (playing "Mom") to "take out the trash after dinner." Both fully understand they are playing roles within a fiction.
      *   **Requirement:** The account must explain why this utterance *does not* create a genuine promissory obligation to take out the real trash.
      *   **Motivation:** Tests the necessity of *serious intent* to undertake a real obligation and the role of *shared context/convention* in distinguishing performative utterances from mere play-acting.
      *   **Non-Negotiable? Yes.** Failure here collapses promising into any utterance of "I promise," regardless of context or intent.

  **II. Essential Conceptual Distinctions**

  6.  **Bindingness vs. Mere Reason:**
      *   **Requirement:** The account must clearly distinguish between being *obligated* or *bound* to do something (failure being a *wrong*) vs. merely having a strong *reason* or *motivation* to do it (failure being potentially regrettable or imprudent, but not necessarily wrongful).
      *   **Motivation:** Captures the core normative force of promising. Promises create duties, not just strong preferences. This is central to the *concept* of promising.
      *   **Non-Negotiable? Yes.** This is definitional. An account that collapses this distinction isn't explaining promissory *obligation*.

  7.  **Owed-to vs. Integrity:**
      *   **Requirement:** The account must distinguish between the obligation being *owed to the promisee* (giving them a claim or right) vs. being solely a matter of the *promisor's own integrity, consistency, or self-governance* (where the wrong is only to oneself if broken).
      *   **Motivation:** Explains the distinctive *interpersonal* and *directed* nature of promissory obligations ("I owe *you*"). Cases like "Forgotten Promise" and "Deathless Promise" challenge purely integrity-based views.
      *   **Non-Negotiable? Yes (to recognize the distinction).** Accounts can differ on *which* aspect is primary or sufficient, but must acknowledge both exist and explain the directedness if present.

  8.  **Promise vs. Prediction:**
      *   **Case:** Saying "I promise I'll be there" vs. "I predict I'll be there."
      *   **Requirement:** The account must explain the fundamental difference in normative consequence. A broken promise wrongs the promisee; a false prediction merely disappoints or misinforms them.
      *   **Motivation:** Highlights that promising is *commitment*, not just forecasting. It creates a new normative reason, not just reports an existing one.
      *   **Non-Negotiable? Yes.** Collapsing this distinction eliminates the special normative force of promising.

  9.  **Promise vs. Identical Resolution:**
      *   **Case:** Alice privately resolves to water Bob's plants vs. Alice promises Bob to water his plants.
      *   **Requirement:** The account must explain what the *promise adds* over the resolution with identical content. What is the *distinctive normative element* introduced by the promise?
      *   **Motivation:** Directly addresses your friend's challenge. It forces the account to pinpoint the essence of the interpersonal commitment beyond mere personal intention or publicity.
      *   **Non-Negotiable? Yes.** An account must identify the *differential normativity*.

  **III. Structural Features**

  10. **Bindingness: Binary or Scalar?**
      *   **Requirement:** The account must state whether promissory obligation is fundamentally all-or-nothing (binary) or admits of degrees (scalar), and explain how factors like pressure ("Pressured Promise"), seriousness, or context affect this.
      *   **Motivation:** Pressured promises and trivial promises intuitively seem different in force from solemn, voluntary vows. Does the *kind* of wrong change, or just the *seriousness*?
      *   **Non-Negotiable? No (outcome negotiable).** Accounts can differ (e.g., binary obligation with scalar excuses/remedies vs. inherently scalar obligation). But the account *must take a clear position* and explain it.

  **IV. Special Constraints (Your Focus)**

  11. **Transferability:**
      *   **Questions:** Can the promisor's *obligation* be transferred to a third party (e.g., delegation) without the promisee's consent? Can the promisee's *claim* (right) be transferred to a third party (e.g., assignment) without the promisor's consent? What does the answer reveal about the "location" of the bindingness (e.g., is the obligation fundamentally to the specific person, or to perform the act, or to satisfy an interest)?
      *   **Requirement:** The account must provide clear answers to these transferability questions and explicitly derive them from its core principles, revealing where it locates the source of the obligation and the nature of the promisee's right.
      *   **Motivation:** Tests the relational specificity of the obligation. If the claim is easily transferable, it suggests the obligation is primarily to *do the act* or satisfy an *interest*; if non-transferable, it suggests the obligation is fundamentally *to the specific promisee* as an individual. Transfer of obligation tests whether the duty is personal.
      *   **Non-Negotiable? Yes (to address).** Answers will vary, but any adequate account must have a principled position on transferability consistent with its foundations.

  12. **The Resolution Challenge (Elaboration of Distinction 9):**
      *   **Requirement:** The account must explicitly state what the promise adds to a resolution of identical content. The answer must involve more than just publicity or emphasis; it must identify the *normative transformation* (e.g., creation of a claim-right in another, assumption of a socially recognized normative status, invocation of a constitutive rule).
      *   **Motivation:** Directly counters your friend's view and forces the account to justify the existence of promissory obligation as a distinct normative phenomenon.
      *   **Non-Negotiable? Yes.** This is the heart of explaining promissory obligation itself.

  **V. Potential Conflicts**

  *   **"Promisor's Act Alone" vs. "Promisee Awareness":** There's a tension between the intuition that a promise made *to oneself* or *unheard* might still bind the promisor (emphasizing the promisor's act/commitment - "Solemn Vow" case) and the intuition that an obligation *owed to* a promisee requires that promisee to be aware of it to *have the claim* ("Unheard Promise" case: If Bob never heard Alice's promise, does he have a claim?).
      *   **Conflict:** An account emphasizing the promisor's autonomous will generating the obligation *ex nihilo* (e.g., strong will-based views) might support bindingness even if unheard. An account emphasizing the interpersonal relationship or the conferral of a right might require uptake/awareness for the *claim* to exist (though the promisor might still have a duty *to inform* or *to perform once known*).
      *   **Resolution:** Most accounts try to navigate this. Practice-based views often require uptake for the obligation to arise. Interest-based views might require awareness for the interest to be engaged. Will-based views struggle most here. This is a key fault line.

  **VI. Non-Negotiables vs. Negotiable Preferences**

  *   **Non-Negotiable (Any Account Must Meet These):** 1 (Forgotten Promise), 2 (Deathless Promise), 5 (Fictional Promise), 6 (Bindingness vs. Reason), 7 (Recognize Owed-to vs. Integrity Distinction), 8 (Promise vs. Prediction), 9/12 (Promise vs. Resolution/What it Adds), 11 (Address Transferability). Accounts *must* explain these cases and distinctions to be adequate.
  *   **Negotiable Preferences (Accounts Can Differ):**
      *   The *outcome* of the Pressured Promise (3) (binding/not/weaker).
      *   The *criterion* for content in Misdescribed Promise (4) (intention vs. reasonable expectation).
      *   Whether obligation is fundamentally Binary or Scalar (10).
      *   The *primary grounding* (will, practice, interest, right-transfer) - this defines the camp.
      *   Whether directedness (owed-to) is *essential* or derivative (a core difference between camps, related to 7).
      *   Specific answers on Transferability (11) - derived from core principles.

  **VII. Scorecard of Main Families (Brief)**

  | Feature                          | Will-Based (e.g., Kant, Rothbard)               | Practice-Based (e.g., Rawls, Scanlon, Hume)         | Expectation/Interest-Based (e.g., MacCormick, Raz) | Rights-Transfer (e.g., Some Natural Law)          |
  | :------------------------------- | :---------------------------------------------- | :-------------------------------------------------- | :------------------------------------------------- | :----------------------------------------------- |
  | **Forgotten Promise (1)**        | ✅ (Act of will binds)                         | ⚠️ (Depends on rules/fidelity)                     | ❌ (No reliance/interest? No obligation?)         | ✅ (Right transferred persists)                 |
  | **Deathless Promise (2)**        | ✅ (Will binds)                                | ⚠️ (Rules may allow succession)                    | ❌ (Promisee's interest gone?)                    | ✅ (Right transfers to estate/heir)             |
  | **Pressured Promise (3)**        | ⚠️❌ (Voluntariness crucial; often voids)      | ⚠️ (May void if violates practice fairness)        | ⚠️ (If pressure vitiates interest/reliance?)     | ⚠️❌ (Invalid consent?)                         |
  | **Misdescribed Promise (4)**     | ❌ (Intention rules)                           | ✅ (Reasonable expectation/convention)             | ✅ (Reasonable reliance/expectation)              | ⚠️ (Intention? Objective meaning?)             |
  | **Fictional Promise (5)**        | ✅ (Lacks serious intent)                      | ✅ (Not within the 'real' practice)                | ✅ (No serious reliance/interest)                 | ✅ (No intent to transfer right)                |
  | **Bindingness vs. Reason (6)**   | ✅ (Creates new duty)                          | ✅ (Rule creates duty)                             | ⚠️ (Can blur if interest/reliance=strong reason) | ✅ (Creates duty correlative to right)          |
  | **Owed-to vs. Integrity (7)**    | ⚠️ (Often emphasizes self-obligation first)   | ✅ (Typically strong on directedness via practice) | ✅ (Directed via protected interest)              | ✅✅ (Paradigm of directed obligation)         |
  | **Promise vs. Prediction (8)**   | ✅ (Commitment vs. report)                     | ✅ (Invoking rule vs. reporting)                   | ✅ (Creating reason vs. reporting)                | ✅ (Transferring right vs. reporting)           |
  | **Promise vs. Resolution (9/12)**| ✅ (Adds: self-obligation to another)          | ✅ (Adds: invocation of social norm/rule)          | ✅ (Adds: reasonable expectation/interest claim)  | ✅ (Adds: transfer of right to another)         |
  | **Binary/Scalar (10)**           | ⚠️ (Often binary, excuses handle weakness)    | ⚠️ (Practice rules may define strength)           | ⚠️ (Scalar based on interest/reliance strength) | ⚠️ (Often binary - right exists or not)        |
  | **Transferability (11)**         | ⚠️ (Obligation personal? Claim transferable?) | ⚠️ (Defined by practice rules)                    | ⚠️ (Claim transferable if interest transfers?)   | ✅ (Clear: Claim=property right, transferable; Obligation personal?) |
  | **Key Strength**                 | Autonomy, self-binding                          | Social practice, conventional grounding             | Protection of interests, reliance                 | Clear directedness, right-based                  |
  | **Key Weakness**                 | Unheard promises, source of normativity       | "Why follow the practice?", Forgotten Promise     | Forgotten/Deathless promises                    | Voluntariness of transfer, pressured promises   |

  This specification provides the common ground and the battleground. Use it to test theories: Does Theory X clearly and consistently satisfy the Non-Negotiables? How does it handle the Negotiable Preferences, especially Transferability and the Resolution Challenge? Where does it land on the key conflict between the promisor's act and promisee awareness? The scorecard shows no family easily sweeps the board – each struggles with core cases the others handle better, highlighting the enduring philosophical puzzle of promising. Good luck with the debate!
