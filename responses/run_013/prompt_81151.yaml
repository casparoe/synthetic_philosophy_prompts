prompt: |-
  Before any candidate is defended in this seminar, I want the specification on the table. Set out the desiderata that an adequate theory of a person's well-being — of what makes a life go well for the one living it — has to meet: the cases it must get right, the distinctions it must respect, the constraints it cannot violate, and the demands that pull against one another. The theory is wanted for ordinary work — ranking lives, choosing between them, saying what to want for someone — not for metaphysical completeness, and the list should be built to that purpose. Open with one sentence giving the bottom line: the pair of desiderata you think cannot be jointly satisfied, or, if the list is consistent, the single requirement that excludes the most candidates. Then give the list. For each entry, state the consideration or case that motivates it, say whether it is non-negotiable or the preference of a particular camp, and say what manner of theory it rules out.

  The list has to be built with one candidate in view, which is the point of the exercise. Take the view — call it tranquilism, and treat the definition given here as authoritative whatever the word may name elsewhere — that the only thing of prudential value is the absence of craving and suffering, and that the presence of pleasure, delight, achievement, and understanding adds nothing at all to the value of a life. Choose your requirements with an eye to whether a view of that shape can meet them; do not relax a requirement to let it through, and do not add one that only a pluralist could satisfy merely because pluralism is comfortable.

  I expect the list to say what a theory must do about at least the following:

  - the experience machine, and whether a life may count as going well for someone who would refuse to enter it;
  - two lives equal in whatever the theory counts as value, one improving and one declining — whether shape is itself a value or only a sequence;
  - a being that neither craves nor suffers because it experiences nothing at all: irreversible coma, a rock, a person who never comes to exist. Can a theory that prizes only absences avoid ranking these above the living?
  - the difference between a felt calm and the mere absence of disturbance. If the good is a hole in the stream of experience rather than a quality of it, what does that cost the theory?
  - the relation between craving and suffering. If craving is a species of suffering, the view collapses into negative hedonism; if it is not, the theory needs a second intrinsic bad and must say why it belongs on the list;
  - a life of many small pleasures containing no craving and no suffering, which tranquilism must call no better than a life of blank equanimity;
  - the fact that desires and self-reports are shaped by what one has and has never had, so that the absence of craving cannot simply be read off what people say;
  - the dimensions along which a single valence can vary — intensity, duration, number of subjects — and whether they remain commensurable when there is only one kind of thing to measure;
  - the badness of death: whether a life can be worse for someone in ways that are never experienced;
  - the line between a person's well-being and the meaning or worth of their life, which a theory of well-being is not entitled to blur.

  Close with a short paragraph on whether tranquilism survives the list, and if it does not, which single requirement does it in.

  No more than 800 words, with each entry kept to a sentence or two of motivation; I want the criteria, not an essay on any one of them.
reasoning: |-
  Hmm, the user is running a thought experiment about evaluating theories of well-being, specifically targeting "tranquilism" - the view that only absence of craving and suffering matters for personal well-being. They want me to set up rigorous criteria to test this theory, starting with the most fundamental conflict.

  The core challenge seems to be that tranquilism's exclusive focus on absences creates tension with intuitive judgments about life value. For instance, their point about comatose states being "better" than conscious calm by this logic exposes a reductio ad absurdum. I need to construct desiderata that capture these tensions without bias.

  Looking at their listed concerns:
  The experience machine dilemma questions whether subjective satisfaction alone defines well-being. For tranquilism, if the machine eliminates craving/suffering, refusal seems irrational - but humans do refuse, suggesting something missing in the theory.

  The shape of life issue probes whether improvement/decline patterns matter beyond total "absence points." Tranquilism would see no difference between upward and downward trajectories if net absence is equal.

  The coma/rock problem is devastating - if mere absence defines value, non-sentient entities "win" over actual lives. This directly conflicts with the premise that well-being applies to beings capable of experience.

  The calm vs. emptiness distinction matters because tranquilism must equate positive tranquility with mere lack of disturbance. But phenomenologically, calm feels qualitatively different from void.

  The craving-suffering overlap risks collapsing tranquilism into standard negative hedonism if craving is a form of suffering. If not, it needs to justify a second fundamental bad.

  The small pleasures case highlights how tranquilism dismisses what most consider genuine benefits - it forces us to see pleasure-rich lives as no better than neutral states.

  Desire measurement is tricky because people adapt to deprivation; tranquilism can't rely on self-reports to gauge true absence of craving.

  Valence dimensions become problematic with only one "currency" - how do we compare intensity versus duration of absence when nothing else matters?

  Death's badness raises whether well-being includes unexperienced harms like lost potential - but tranquilism seems confined to experiential absences.

  Finally, the well-being/meaning distinction must hold - tranquilism shouldn't conflate its narrow metric with life's broader value.

  The irreparable flaw appears to be the "Non-Sentience Problem" - valuing absence above all logically prioritizes non-experience over lived existence. That violates the very concept of well-being-for-someone. While other points pressure the theory, this one breaks it fundamentally.
answer: |-
  **Bottom Line:** The requirement that well-being requires a subject for whom life "goes well" excludes theories ranking irreversible coma above conscious tranquility, which tranquilism cannot satisfy.

  **Desiderata for a Theory of Well-Being:**

  1.  **Subject Requirement:** Well-being must pertain *to a subject capable of experience*; it cannot be ascribed to rocks, the never-existent, or irreversibly comatose beings lacking any capacity for sentience. (Non-negotiable; rules out theories where mere non-existence or non-sentience maximizes "value".)
  2.  **Non-Sentience Problem:** A theory must avoid ranking a state of non-sentience (like irreversible coma) as *better* for an individual than a conscious life free of craving/suffering. (Non-negotiable; motivated by the incoherence of non-sentience being "good for" a subject; rules out theories prizing only absences without requiring a subject.)
  3.  **Experience Machine Constraint:** The theory must explain why many rational people would refuse the Experience Machine (guaranteeing craving/suffering absence and pleasant experiences) if offered, seeing it as worse than real life. (Non-negotiable; motivated by common intuition; rules out theories claiming well-being is solely determined by internal experience quality/absence.)
  4.  **Shape Sensitivity:** The theory must account for the intuition that an improving life (starting low, ending high) is often preferable to a declining life (starting high, ending low) even if the total sum of prudential value (e.g., net absence) is identical. (Preference of some camps; motivated by temporal bias; rules out strict additive theories ignoring narrative or sequence.)
  5.  **Phenomenal Calm Distinction:** The theory must distinguish the *felt quality* of tranquility/calm (a positive experiential state) from the mere *absence* of craving/suffering (which could be vacuous). (Non-negotiable; motivated by phenomenological difference; rules out theories unable to recognize positive experiential qualities as valuable.)
  6.  **Craving/Suffering Relation:** The theory must clearly define the relationship between craving and suffering, establishing if craving is intrinsically aversive (a form of suffering) or a distinct bad requiring separate justification. (Non-negotiable for coherence; rules out ambiguous or collapsing definitions.)
  7.  **Pleasure Neutrality:** The theory must justify why the presence of pleasure, delight, achievement, or understanding adds *nothing* to well-being compared to their absence, provided craving/suffering are absent. (Defines tranquilism; motivated counter to common sense; rules out pluralist or hedonist theories.)
  8.  **Adaptation Problem:** The theory must account for how desires and self-reports of satisfaction are shaped by adaptation, deprivation, or ignorance, preventing simple reliance on expressed desire to measure true craving/suffering absence. (Non-negotiable; motivated by empirical psychology; rules out naive desire theories and complicates measurement for any theory.)
  9.  **Commensurability of Absences:** With only one intrinsic good (absence of craving/suffering), the theory must explain how to compare and aggregate different *instances* of this absence (intensity, duration) into an overall life value. (Non-negotiable for application; rules out theories unable to provide a calculus for their sole value.)
  10. **Death's Badness:** The theory must address whether death can be bad for a person due to deprivation (loss of future possible goods/absences) even if not experienced as a bad event. (Preference of some camps; motivated by deprivation account; rules out theories requiring all bads to be experienced.)
  11. **Well-Being vs. Meaning:** The theory must distinguish a life high in personal well-being (good *for* the person) from a life deemed meaningful, morally worthy, or admirable by others, without conflating the concepts. (Non-negotiable; motivated by conceptual clarity; rules out theories blurring personal good with external valuation.)

  **Tranquilism's Survival:** Tranquilism fails the **Non-Sentience Problem (2)**. By valuing *only* the absence of craving and suffering, and denying any value to positive experiences or existence itself, it must rank irreversible coma (perfect absence of craving/suffering) as prudentially superior to a conscious life of tranquil equanimity (also absence, but requiring a subject). This violates the Subject Requirement (1) and the core concept of well-being being *for* a living subject. While other desiderata pressure it (e.g., Experience Machine refusal (3), Shape (4), Pleasure Neutrality (7)), the Non-Sentience Problem is fatal.
