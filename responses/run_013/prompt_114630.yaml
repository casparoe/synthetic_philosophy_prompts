prompt: |-
  I'm a second-year PhD student in political theory and I need to turn a half-formed idea into a two-page proposal for our department's works-in-progress fellowship — six months, no money, just time to write a chapter. The idea: we lump every 'lost cause' together (the Confederacy, Masada, Kosovo, Dunkirk) but I think they're doing three diferent jobs, and it's the job rather than the story that explains how the myth behaves. Dunkirk turns a military catastrophe into a moral credit — losing brought out our best; the Lost Cause keeps the defeat open as an unpaid debt; Masada and Kosovo make the defeat itself the title deed to the place. So the question I want to pose is whether a defeat-myth can be typed by what it asks its audience to do (cash in, collect, or hold) rather than by what it says happened, and what makes one type survive contact with evidence while another curdles into grievance. Turn that into the proposal: state the question so it has a determinate answer, say why the standard explainers — nationalism, collective trauma, invented tradition — leave it open, give the method (build the typology, then run the four cases through it as a stress test and see whether any case refuses to sit in one slot), say what a 'result' even looks like here since it won't be a p-value, and be honest about what would sink it — if the same case flips type within a century, the typing isn't doing any work. And keep the scope realistic for six months. Skip the bibliography, I'll add citations myself.
