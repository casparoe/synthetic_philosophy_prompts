answer: |-
  ### Exam Question  
  **Stem:**  
  Consider two scenarios:  
  - **Case A:** You place your hands in a basin of tepid water. When your hands were previously cold, this sensation feels pleasant. When you were previously overheated, the *exact same sensation* feels unpleasant.  
  - **Case B:** Alex spends a miserable 6-hour hike in freezing rain—shivering, complaining, and wishing it would end. Immediately afterward, Alex declares it "the best day of the year" and insists they wouldn’t trade the experience for anything.  

  **Prompt:**  
  Explain why the *heterogeneity problem* ("What do all pleasures have in common?") poses a serious challenge for hedonism as a theory of well-being. Assess how **two responses**—(1) the "single-feeling view" (pleasures share an intrinsic hedonic quality) and (2) the "no-common-core view" (pleasure is a disjunctive cluster)—handle Cases A and B. Conclude by evaluating which response better preserves hedonism as a unified theory of value.  

  ---

  ### Model Answer (780 words)  
  The heterogeneity problem asks what all pleasures share metaphysically (e.g., a common property). This becomes a problem for *hedonism*—which claims pleasure is the sole intrinsic good and pain the sole evil—because hedonism requires pleasures to play specific functional roles: (a) enabling aggregation (summing diverse experiences into "net pleasure"), (b) allowing rational ranking (e.g., poetry over pushpin), and (c) explaining *why* pleasure is good. If pleasures have nothing in common, hedonism cannot perform these tasks. Without a unified account, calling both "a warm bath" and "solving a puzzle" "pleasure" is arbitrary, undermining hedonism’s claim to identify *one* source of value.  

  **The Single-Feeling View** holds that all pleasures share an intrinsic qualitative "feel" (e.g., a distinctive hedonic tone). For Case A, this view must reject the claim that the water sensation is *intrinsically identical* when pleasant/unpleasant. Instead, it might argue that hedonic tone is *relational*: the sensation’s pleasantness depends on context (e.g., prior states). Thus, the water "feels different" when cold vs. overheated because its hedonic quality is tied to the subject’s condition. For Case B, this view faces a dilemma. Either:  
  - (i) The hike contained no pleasure *during* the experience (only retrospective endorsement), so hedonism cannot count it toward well-being *at the time it occurred*.  
  - (ii) *Some* intrinsic quality (e.g., "challenge-appreciation") made it pleasurable *while* miserable—but this risks circularity (what makes that quality "pleasure"?).  
  A sophisticated single-feeling view adopts (i): Alex’s misery was real pain; their later judgment reflects non-hedonic values (e.g., achievement), meaning the hike *itself* did not enhance well-being.  

  **The No-Common-Core View** denies any shared intrinsic property. "Pleasure" is a disjunctive set (e.g., sensory joy, intellectual satisfaction) unified only by loose resemblance. For Case A, it easily explains the shift: "pleasant" and "unpleasant" are context-dependent labels for different clusters. For Case B, it flexibly claims the hike *was* pleasurable *at the time* by stretching "pleasure" to include "hard-won fulfillment" within the cluster. Alex’s complaining doesn’t negate this; it simply reflects a different aspect of the disjunctive experience.  

  **Critical Evaluation**:  
  The no-common-core view handles both cases cheaply but at high cost. By accommodating Case B as "pleasure," it makes hedonism vacuously flexible: *any* experience retrospectively endorsed becomes pleasurable. This dissolves hedonism’s core claim—that pleasure is a *distinct* source of value—because the "cluster" has no boundaries. If "pleasure" includes achievement-derived fulfillment, hedonism collapses into pluralism (e.g., desire satisfaction). It cannot rank or aggregate without a unified metric, failing functional roles (a) and (b).  

  The single-feeling view (especially relational) better preserves hedonism. Case A is resolved elegantly: hedonic tone depends on the subject’s state. Case B is handled honestly: the hike’s misery was intrinsically painful, and Alex’s later judgment doesn’t rewrite that fact. Well-being at *t* depends on *at t* hedonic states. This maintains pleasure as a measurable, naturalistic property. The cost is denying that intrinsically painful experiences contribute to well-being *as they occur*—but hedonists should accept this. If we insist Case B *was* pleasurable, we likely presuppose non-hedonic goods (e.g., accomplishment), abandoning hedonism.  

  Ultimately, the single-feeling view is superior. Hedonism requires a unified account of the good; disjunctivism sacrifices unity for convenience. A relational single-quality view explains phenomenological diversity (Case A) while upholding hedonism’s explanatory power. Case B exposes that the no-common-core "solution" is a surrender: if hedonism accepts all valued experiences as "pleasure," it ceases to be a distinctive theory.  

  ---

  ### Marking Scheme (25 Total)  
  **Top Marks (A Range: 21–25)**  
  - **Precisely defines heterogeneity problem AND explains its *functional* stakes for hedonism** (aggregation, ranking, explanation). (5 pts)  
  - **Clearly contrasts single-feeling vs. no-common-core views** (intrinsic quality vs. disjunctive cluster). (3 pts)  
  - **Accurately applies *both* views to Case A**: Notes relational solution for single-feeling; contextual flexibility for disjunctivism. (4 pts)  
  - **Accurately applies *both* views to Case B**: Single-feeling must deny contemporaneous pleasure OR reframe hedonic tone; disjunctivism cheaply counts endorsement as pleasure. (4 pts)  
  - **Evaluates which view better preserves hedonism**: Argues disjunctivism collapses into pluralism; single-feeling (relational) retains unity. (5 pts)  
  - **Avoids major pitfalls** (see below). (4 pts)  

  **Good Marks (B Range: 15–20)**  
  - Identifies heterogeneity problem but vague on *why* it challenges hedonism.  
  - Describes both views but conflates metaphysical/axiological (e.g., "higher pleasures solve it").  
  - Treats Case A as solely about subjectivity (misses relational solution).  
  - In Case B, focuses only on retrospective endorsement without analyzing contemporaneous pleasure.  
  - Superficial evaluation (e.g., "both have pros and cons").  

  **Deductions**  
  - **-3–5 pts**: Misses functional stakes of heterogeneity (e.g., only says "pleasures are diverse").  
  - **-3 pts**: Treats Case A as fatal to single-feeling without considering relationality.  
  - **-2 pts**: Fails to specify how *each* view handles *both* cases.  
  - **-4 pts**: Claims disjunctivism faces no problems OR single-feeling is irredeemable.  
  - **-2 pts**: Collapses views into "levels of description."  

  ---

  ### Self-Review  
  **Confidence**:  
  - **Question**: High (forces specified moves; Cases A/B target key weaknesses).  
  - **Scheme**: High (breaks down core moves; pitfalls reflect common errors).  
  - **Model Answer**: Moderate (deliberately contestable in rejecting disjunctivism; relational single-quality is defensible but not universal).  
  **Least Sure Point**: Whether requiring "disjunctive survival" evaluation is fair for undergrads. But it’s essential—without it, disjunctivism seems cost-free.  

  \answer{Articulating the functional role of a shared property}
