prompt: |-
  I missed a seminar last week on incommensurable values, and a colleague who attended sent me her notes, reproduced below. I want to know how much of this I can trust before I build anything on it. She is a careful note-taker and the lecturer is a specialist, so I am not expecting howlers; what worries me is that parts of it sound like the kind of thing that is true in a loose sense and false in a strict one, and I don't know this literature well enough to tell the difference.

  Her notes read:

  "The lecture was on incommensurable values. Some goods have no common measure, which means you cannot compare them at all, and that is what makes a hard choice hard. It is not the same as uncertainty: with uncertainty you don't know the facts, whereas here the facts are all in and there is still no answer. His example was a woman choosing between staying in her hometown to care for her father through a long illness — she is the only one who can — and taking a two-year post abroad that is her one real chance at the career she trained for. He said the two options were roughly equal in value, not exactly equal, and that this is different again from one being better than the other. Because of this there is no fact of the matter as to which is better, so whatever she chooses is beyond rational criticism: she cannot choose wrongly, and no one can tell her she chose worse. He also mentioned an argument in which you take one of the options and improve it slightly and it still isn't better than the other; he said this proves the same point. He drew the moral that values cannot be objective, since if they were there would have to be a common measure. And he ended with what he called the standing objection to utilitarianism: if some values are incommensurable there can be no single scale, so the theory collapses."

  What I would like is an audit rather than an exposition. Go through the notes claim by claim and tell me, for each, what a philosopher working on value theory would accept as stated, what they would wince at as a loose or misleading way of putting something true, and what they would reject outright; where a claim distorts a real position, say what the accurate version is and why the difference matters. Three things in particular I'd like pinned down. First, whether "no common measure" really entails that the two options cannot be compared at all, and how that sits with the lecturer's remark that they are roughly equal rather than exactly equal. Second, what the small-improvement argument actually establishes and whether it supports the conclusion she draws from it. Third, whether anything about objectivity, or about utilitarianism, follows from whichever parts of the notes survive. I don't need citations or a reading list — I need to know which sentences I can safely repeat and how to phrase the ones I can't.
reasoning: |-
  Okay, let me approach this systematically. The user wants a claim-by-claim audit of their colleague's seminar notes on incommensurable values. Three aspects need special attention: the meaning of "no common measure," the small-improvement argument, and implications for objectivity and utilitarianism.

  First, about "no common measure" and comparability. The notes say incommensurability means "cannot compare them at all," but this oversimplifies. Philosophers like Raz or Chang would clarify that while cardinal measurement is impossible, some comparisons remain - like "roughly equal" or "on a par." The distinction between exact equality and rough equality matters because it preserves rational deliberation in hard choices. The lecturer's example of the woman's dilemma actually shows comparability (rough equality), contradicting the "no comparison" claim.

  Regarding the small-improvement argument: The notes present it as proof that "there is no fact of the matter" about which option is better. But in technical terms, this argument targets trichotomy failure - showing neither A>B nor B>A nor A=B holds. However, this doesn't automatically imply no rational criticism is possible. Chang's work suggests that even in parity cases, reasons still exist for preferring one option over another. The jump from incommensurability to "beyond rational criticism" is too strong.

  On objectivity and utilitarianism: The lecturer's claim that incommensurability disproves objectivity is contentious. Many value realists (e.g., Wiggins) argue values can be objective without being commensurable. For utilitarianism, while incommensurability does challenge classical versions relying on a single scale, sophisticated utilitarians (like Hare) have responses involving rough comparability or multi-dimensional scaling. The "collapse" claim is overstated.

  The user's deeper concern seems to be identifying which parts can be safely cited in academic work. Phrases like "cannot compare at all" should be softened to "lack precise cardinal comparability," while "beyond rational criticism" requires heavy qualification. The utilitarianism objection should note it targets "strong" forms requiring strict commensurability.

  Throughout, I'll maintain a technical but accessible tone, flagging oversimplifications while preserving the lecturer's core insights about hard choices. The goal is to equip the user with philosophically precise reformulations of each claim.
answer: |-
  Here's a claim-by-claim audit of the notes, highlighting what's accurate, loose, or problematic from the perspective of contemporary value theory (drawing primarily on work by Raz, Chang, Griffin, Parfit, Broome, et al.):

  **1. "Some goods have no common measure..."**
      *   **Acceptable:** This is a standard definition. Incommensurability means lacking a common *cardinal* scale (e.g., utils, dollars, points) allowing precise comparison of value *magnitudes*.
      *   **Wince:** "...which means you cannot compare them at all..." This is **overly strong and misleading**. Incommensurability denies *precise cardinal comparability*, but **not necessarily all forms of comparison**. We can often say things like "A is not better than B, B is not better than A, and they are not exactly equal" (trichotomy failure), or that they are "roughly equal," "on a par" (Chang), or comparable within broad ranges. We might also be able to say one is *good in different ways* or that certain *aspects* are comparable.

  **2. "...and that is what makes a hard choice hard."**
      *   **Acceptable:** Incommensurability is widely recognized as a *major source* of genuine hard choices where neither option clearly dominates.

  **3. "It is not the same as uncertainty: with uncertainty you don't know the facts, whereas here the facts are all in and there is still no answer."**
      *   **Acceptable (with minor caveat):** This correctly distinguishes *epistemic* uncertainty (lack of knowledge) from *constitutive* indeterminacy (no fact of the matter due to incommensurability). The "no answer" refers to the lack of a single, rationally *required* best option based solely on comparative value.

  **4. "His example... career she trained for."**
      *   **Acceptable:** A classic and plausible example illustrating the potential for deep conflict between distinct values (family duty/care vs. career/achievement).

  **5. "He said the two options were roughly equal in value, not exactly equal..."**
      *   **Wince:** "Roughly equal" is often used intuitively, but in technical discussions, it's **problematic**. "Exactly equal" implies precise cardinal equality. "Roughly equal" often smuggles in the idea of a *single underlying scale* where the values are close enough. Philosophers like Ruth Chang argue cases fitting the description often involve "**Parity**" – where A isn't better than B, B isn't better than A, *and* they aren't equally good, but are instead comparable as being "in the same league" or "on a par." This is distinct from both equality and rough equality on a single scale.

  **6. "...and that this is different again from one being better than the other."**
      *   **Acceptable:** Crucial point. Incommensurability/parity implies the negation of strict betterness in either direction.

  **7. "Because of this there is no fact of the matter as to which is better..."**
      *   **Acceptable (Core Point):** If the values are genuinely incommensurable or on a par, then the statement "Option A is better than Option B" (or vice versa) lacks a truth value. There *is* no objective fact of the matter about which is *better*.
      *   **Wince/Reject:** "...so whatever she chooses is beyond rational criticism: she cannot choose wrongly, and no one can tell her she chose worse." This **overstates the implications**. While there may be no *single rationally required* choice based *solely* on which is *better*, the choice is **not necessarily beyond rational criticism**:
          *   **Reasons Still Apply:** She can have strong, valid *reasons* for choosing one over the other (e.g., "I value my career aspirations deeply," "My bond with my father is irreplaceable"). The criticism would target ignoring relevant reasons or choosing arbitrarily/capriciously *without* engaging with the values at stake.
          *   **"Worse" vs. "Wrong":** Saying she "chose worse" implies a comparative judgment of betterness that *may* lack a fact of the matter. However, one could argue she "chose wrongly" if her decision-making process was irrational (ignoring her own deep commitments, failing to deliberate), even if neither option was *better* than the other. "Beyond *all* rational criticism" is too strong.

  **8. "He also mentioned an argument in which you take one of the options and improve it slightly and it still isn't better than the other; he said this proves the same point." (The Small Improvement Argument)**
      *   **What it Establishes:** This argument (associated with Raz) is designed to show **trichotomy failure** and rule out **precise equality**. Suppose A is not better than B, and B is not better than A. If improving A slightly to A+ *still* doesn't make A+ better than B, then A cannot have been *exactly equal* to B (because if it were, a slight improvement *should* make it better). Therefore, the only remaining possibility is the failure of the trichotomy (neither better, nor worse, nor equal) – a hallmark of incommensurability/parity. It "proves" the *structure* of the choice isn't one of betterness or exact equality.
      *   **Does it Support "No Fact of the Matter" and "Beyond Criticism"?** It strongly supports **"no fact of the matter about *betterness*"** (Point 7). It does **not** directly support the strong claim that **"whatever she chooses is beyond rational criticism"** (Point 7 wince/reject). The argument is about the *comparative value relation* between options, not about the permissibility or rationality of choosing one.

  **9. "He drew the moral that values cannot be objective, since if they were there would have to be a common measure."**
      *   **Reject Outright (as stated):** This is a **highly contentious non sequitur** rejected by many value realists and objectivists.
          *   **Why?** Objective values could be plural, heterogeneous, and *lack* a common cardinal measure while still being mind-independent facts. Think of objective aesthetic beauty and objective mathematical truth – both objective, but likely incommensurable. Philosophers like Wiggins, Nagel, or Scanlon argue for forms of value realism/objectivity that readily accommodate incommensurability. The lecturer's claim assumes objectivity *requires* monism or commensurability, which most objectivists explicitly deny.

  **10. "And he ended with what he called the standing objection to utilitarianism: if some values are incommensurable there can be no single scale, so the theory collapses."**
      *   **Acceptable (Core Challenge):** This is indeed a **major and standard objection** to *classical* utilitarianism (and similar monistic consequentialist theories) that require *all* value to be reduced to a single, cardinal, additive scale (like utils) for aggregation and maximization.
      *   **Wince:** "...so the theory collapses." This is **overly dramatic**. While incommensurability poses a severe challenge:
          *   **Refined Utilitarianism:** Some utilitarians (e.g., Hare, perhaps Harsanyi in parts) argue for rough comparability or "soft" commensurability that might be sufficient for practical purposes.
          *   **Non-Classical Forms:** Others develop multi-dimensional utilitarianism or satisficing versions that try to accommodate incommensurability without complete collapse.
          *   **Scope:** The objection primarily targets the *strong commensurability requirement* of classical utilitarianism, not necessarily all consequentialist structures. The theory is challenged, perhaps fatally wounded in its simplest form, but declaring total "collapse" overstates the case against more sophisticated versions.

  **Addressing Your Three Pin-Downs:**

  1.  **"No Common Measure" & Comparability:**
      *   **Entailment:** "No common measure" (meaning no cardinal scale) **does not entail "cannot be compared at all."**
      *   **"Roughly Equal" vs. Trichotomy Failure/Parity:** The lecturer's use of "roughly equal" is intuitive but technically loose. Philosophers would typically say the options are **incomparable *with respect to strict betterness*** (neither better nor worse) and **not exactly equal**, leading to trichotomy failure. Chang's "parity" is a specific positive relation capturing this ("on a par"). "Roughly equal" often misleadingly suggests closeness *on a single scale*, which is precisely what's denied by incommensurability. The accurate description is: **The options are neither better nor worse than each other, nor are they exactly equally good; they may be on a par or related in a way that resists precise cardinal ranking.**

  2.  **Small-Improvement Argument:**
      *   **What it Establishes:** It **establishes trichotomy failure** (neither A>B, nor B>A, nor A=B) in the case where a slight improvement to A (A+) still doesn't make A+ better than B. This demonstrates a structure incompatible with precise equality or determinate betterness, characteristic of incommensurability/parity.
      *   **Support for "No Fact of the Matter"?** Yes, it **strongly supports** the claim that there is **no fact of the matter about which option is *better***.
      *   **Support for "Beyond Criticism"?** **No.** It does *not* support the conclusion that the choice is beyond rational criticism or that one cannot choose wrongly. Rational criticism can focus on the *process* of deliberation and the *reasons* invoked, not just the comparative value outcome.

  3.  **Objectivity & Utilitarianism:**
      *   **Objectivity:** **Nothing about objectivity follows** from the existence of incommensurable values. Many robust forms of value **objectivism/realism explicitly embrace value pluralism and incommensurability**. The lecturer's claim that objectivity requires commensurability is rejected by most objectivists. (*Accurate version:* "The existence of incommensurable values challenges simplistic monistic theories of value but is compatible with, and even predicted by, many sophisticated objectivist pluralist theories.")
      *   **Utilitarianism:** The existence of incommensurable values **poses a severe challenge *specifically* to classical utilitarianism** (and similar monistic consequentialisms) **because it denies the single cardinal scale essential for their aggregation procedure.** This is a valid and powerful objection to that specific *form* of utilitarianism. It does *not* necessarily defeat all forms of consequentialism or even all possible reformulations of utilitarianism that relax the strict commensurability requirement, though it remains a fundamental difficulty. (*Accurate version:* "The phenomenon of incommensurable values constitutes a major objection to classical utilitarianism, as it undermines the theory's requirement that all goods be commensurable on a single cardinal scale for the purposes of aggregation and maximization.")

  **Summary of What You Can Safely Repeat & How to Adjust:**

  *   **Safe:** Core definitions of incommensurability, distinction from uncertainty, the nature of hard choices, the structure of the small-improvement argument (and what it shows about trichotomy/equality), the *existence* of the major objection to classical utilitarianism.
  *   **Needs Adjustment:**
      *   **"Cannot compare at all" ->** "Cannot be precisely compared cardinally" or "lack a common measure" or "are incomparable with respect to strict betterness" or "may be on a par".
      *   **"Roughly equal" ->** "Neither better nor worse than each other, nor exactly equally good" or "on a par".
      *   **"Beyond rational criticism/cannot choose wrongly" ->** "There is no single rationally required choice based solely on which option is better" or "Neither choice can be faulted *on the grounds* that the alternative was determinately better" (but add: "though the choice can still be rationally assessed based on the reasons given and the deliberative process").
      *   **Values cannot be objective ->** This claim is highly contentious and generally rejected; omit or rephrase to: "The lecturer argued that incommensurability undermines value objectivity, holding that objective values would require commensurability" (making clear it's *his* contested view).
      *   **Utilitarianism "collapses" ->** "Poses a fundamental challenge to classical utilitarianism" or "undermines the commensurability requirement essential for classical utilitarian aggregation".

  The notes capture the lecturer's *arguments* faithfully, including his contestable conclusions about objectivity and the implications for rational choice. However, core technical concepts ("incommensurable," "cannot compare," "roughly equal") are presented in a looser, more intuitive way than the philosophical literature typically uses them, and the conclusions drawn about the impossibility of rational criticism and the demise of objectivity are significant over-extensions beyond what the arguments strictly support (and are actively disputed).
