  **Buridan's Villanelle**  

  The left is to the right a perfect peer.  
  I stand between, and cannot now begin.  
  The right is to the left a perfect peer.  

  No difference grips the mind; no call is clear.  
  Where reason finds no edge, choice wears thin.  
  The left is to the right a perfect peer.  

  A coin, a twitch, could spare me, parked right here—  
  a random nudge to let the venture in.  
  The right is to the left a perfect peer.  

  But will, when intellect proclaims "both near,  
  both sweet," still waits for cause to break the din.  
  The left is to the right a perfect peer.  

  Dusk bleeds the sky; my weakened bones adhere  
  to balance. Hunger sharpens on my skin.  
  The right is to the left a perfect peer.  

  O symmetry, relent! Let some stray wind veer,  
  or instinct kick—let motion bear the din!  
  The left is to the right a perfect peer.  
  The right is to the left a perfect peer.  

  Summary: The villanelle's mirrored refrains enact the paralyzing symmetry, cycling and converging without resolution.  

  ---

  **Explanation:**  
  - **Mirrored Refrains:** The first refrain ("The left is to the right a perfect peer") and second refrain ("The right is to the left a perfect peer") are exact syntactic inversions, embodying the symmetry of the dilemma. Swapping "left" and "right" in either line produces the other, fulfilling the requirement of invariance.  
  - **Three Pressures Felt:**  
    1. *Choice without preference as incoherent*: "Where reason finds no edge, choice wears thin" (stanza 2).  
    2. *Missing tie-breaker*: "A coin, a twitch, could spare me" (stanza 3), yet no arbitrary break occurs.  
    3. *Will vs. intellect*: "will... waits for cause" (stanza 4) when intellect sees equivalence.  
  - **Form as Metaphor:** The refrains cycle and trade places (stanzas 1–5), then converge in the quatrain (lines 18–19). Their unresolved repetition mirrors the ass’s paralysis, while the closing quatrain’s plea for asymmetry ("Let some stray wind veer") goes unanswered, leaving symmetry intact and fatal.  
  - **Accuracy & Accessibility:** Avoids namedropping or faux scholarship; the physics ("balance," "motion"), psychology ("instinct," "cause"), and formal mechanics stand alone for both informed and new readers.  
  - **Summary Line:** Condenses the villanelle’s structural mimesis of the paradox.  

  The poem holds all three interpretations in tension—logic’s deadlock, the missing tie-breaker, and the will’s inertia—without moralizing, forcing the reader to inhabit the ass’s stasis.
