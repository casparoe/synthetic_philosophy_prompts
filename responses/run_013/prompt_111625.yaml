  Below is a decision tree designed to sort positions on Maxwell's demon exorcism, based on your specified starting commitments (time-reversal invariant microdynamics, second law as statistical regularity). The tree uses binary branch nodes phrased as questions a reader can answer without prior knowledge of the views. Leaves correspond to named positions, including one unoccupied combination.

  ### Decision Tree
  1. **Q1: Must the demon's operation be paid for by a compensating entropy increase somewhere?**  
     - *Yes* → Go to Q2.  
     - *No* → Go to Q3.  

  2. **Q2 (if Yes to Q1): Does the entropy cost fall primarily at the measurement step?**  
     - *Yes* → **Szilárd–Brillouin leaf** (measurement is thermodynamically costly; exorcism relies on this cost).  
     - *No* → Go to Q4.  

  3. **Q3 (if No to Q1): Does the argument depend on the demon being finite and forgetful?**  
     - *Yes* → Go to Q5.  
     - *No* → **Deflationary leaf** (no compensating cost needed; demon fails due to its own thermodynamics, e.g., dissipation or thermal noise, without invoking information theory).  

  4. **Q4 (if No to Q2): Does the argument depend on the demon being finite and forgetful?**  
     - *Yes* → **Landauer–Bennett leaf** (measurement can be reversible; cost falls entirely on erasure of finite memory).  
     - *No* → **Unoccupied leaf** (erasure cost without finitude; e.g., a demon with infinite memory still pays at erasure—nobody defends this).  

  5. **Q5 (if Yes to Q3): Does the demon fail systematically (i.e., cannot achieve net entropy decrease over time)?**  
     - *Yes* → **Smoluchowski trapdoor leaf** (failure due to specific mechanical design, like a trapdoor flipped by fluctuations; no global cost needed).  
     - *No* → **Fluctuation leaf** (demon succeeds transiently via fluctuations but fails systematically; second law holds statistically).  

  ### Key to Leaves
  - **Szilárd–Brillouin**: Measurement requires work, costing entropy.  
  - **Landauer–Bennett**: Measurement is reversible; erasure of finite memory costs entropy.  
  - **Smoluchowski trapdoor**: Purely mechanical failure (e.g., trapdoor can’t sort molecules due to its own fluctuations).  
  - **Deflationary**: Demon fails autonomously (e.g., heats up, slows down); no info-theoretic principle needed.  
  - **Fluctuation**: Demon works transiently (due to fluctuations) but not systematically.  
  - **Unoccupied**: Erasure cost without requiring finite/forgetful demon (e.g., infinite-memory demon still pays at erasure).  

  ### Separation of Leaves
  - **Landauer–Bennett vs. Deflationary**: Separated cleanly by Q1 (compensating cost: *Yes* vs. *No*) and Q4/Q3 (finitude dependence). They do **not** collapse, as Q1 and the finitude node (Q4 for Landauer–Bennett, Q3 for deflationary) distinguish them.  
  - **Fluctuation vs. Smoluchowski**: Separated by Q5 (systematic failure: *Yes* for Smoluchowski, *No* for fluctuation).  

  ### Empty Combinations and Coherence
  - **Unoccupied leaf (Q1=Yes, Q2=No, Q4=No)**: Erasure cost without finitude dependence. Empty because it is **incoherent**—Landauer’s principle requires finite memory to necessitate erasure; infinite memory avoids erasure costs.  
  - **Other empty combinations**:  
    - *Q1=Yes, Q2=Yes, [finitude not asked]*: Szilárd–Brillouin occupies this. Not empty.  
    - *Q1=No, Q3=Yes, Q5=Yes*: Smoluchowski occupies this. Not empty.  
    - *Q1=No, Q3=Yes, Q5=No*: Fluctuation occupies this. Not empty.  
    - *Q1=No, Q3=No*: Deflationary occupies this. Not empty.  
    - **Empty branch 1**: *Q1=Yes, Q2=Yes, finitude=Yes*.  
      - **Why empty?** Szilárd–Brillouin does not require finitude (cost is at measurement, not erasure). This combination is **unexplored**—no major view ties measurement cost to finitude.  
    - **Empty branch 2**: *Q1=No, Q3=No, [fluctuations not asked]*.  
      - **Why empty?** Deflationary (Q3=No) already covers non-fluctuation failures. Adding fluctuations here would be redundant. This combination is **incoherent**—if Q3=No, fluctuations are irrelevant to the argument.  

  ### Notes
  - **Q4 (finitude for Landauer–Bennett)** ensures separation from deflationary views. Without it, Landauer–Bennett (cost on erasure) might blend with deflationary (no cost) if finitude isn’t specified.  
  - **Information-theoretic principle**: Implicitly addressed:  
    - Szilárd–Brillouin and Landauer–Bennett rely on it (hence Q1=Yes).  
    - Deflationary and mechanical views (Smoluchowski/fluctuation) reject it (ordinary SM suffices).  
  - The tree avoids trivial branches (e.g., no need to ask about fluctuations if Q1=Yes).  

  This tree isolates all named positions, flags incoherent/unexplored branches, and confirms your suspicion that finitude is critical for separating Landauer–Bennett from deflationary views.
