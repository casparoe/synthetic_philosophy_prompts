prompt: |-
  I am a novelist, and for three years I have chaired the grants panel of a small hardship fund for writers: one-off payments of a few hundred pounds to authors in acute financial difficulty, subject only to the trustees' rubber stamp. Our charter says the fund exists for misfortune and not for the consequences of a writer's own decisions — a clause now carrying more weight than it can bear. We sit monthly, we read twenty applications in an afternoon, and we decide by intuition; which is to say, by whichever of the four of us is most fluent that day. I have been reading around luck egalitarianism, the view that what a person may claim from others is compensation for the disadvantages she did not choose and nothing for the risks she took on — the distinction sometimes drawn as brute luck against option luck. Please turn that into a procedure we can actually run: the questions to ask in order, what counts as a sufficient answer to each, where the procedure ends in a refusal, and where it must hand the decision to the panel because the question is one of value rather than of fact.

  It has to keep two things that the slogans tend to lose. The first is the difference between holding someone answerable for having made a choice and holding her answerable for how it turned out: a writer may choose to leave a salaried post and yet not have chosen the illness that made the gamble unrecoverable, and I want the procedure to say which of those two things the panel is actually judging. The second is that our applications are essays, and our decisions track how well an applicant writes about her own life; a novelist cannot help noticing that we are therefore distributing money according to an unchosen talent for self-narration. Say what a procedure that takes luck seriously should do about that, even if the honest answer is that we can do very little.

  Then run it on three cases from last month: a poet whose teaching post ended when her depression became disabling; a novelist who resigned a secure job to finish a book that did not sell and who cannot now make his rent; and a translator whose flat was flooded after she let the contents insurance lapse to save money. Tell me which way the procedure points in each, and be explicit where it returns an answer the panel will hate.

  Four writers have ninety minutes and no economist. Mark the points where judgement cannot be eliminated, and end with a single line beginning "Verdict:" giving, in a short phrase, the default ruling we should adopt when the tests leave a case unsettled.
reasoning: |-
  Hmm, the user is a novelist who chairs a grants panel for a writers' hardship fund. They're dealing with applications from authors in financial distress and want to apply luck egalitarianism principles to their decision-making process. They need a practical procedure that distinguishes between brute luck (unchosen disadvantages) and option luck (risks from personal choices), while acknowledging two key complexities: the difference between being accountable for a choice versus its outcome, and the inherent bias in judging applications based on writing skill.

  I need to develop a clear, step-by-step procedure they can implement with their four-person panel within 90 minutes. The procedure must include:
  - Sequential questions with clear sufficiency thresholds
  - Defined refusal points
  - Handoff points where value judgments are needed
  - Specific handling of the two complexities mentioned
  - Application to three real cases they provide
  - Identification of unavoidable judgment points
  - A default verdict for unsettled cases

  The three cases are:
  1. Poet whose teaching job ended due to disabling depression
  2. Novelist who quit a job to finish an unsuccessful book
  3. Translator who let insurance lapse and suffered flood damage

  Key philosophical distinctions to operationalize:
  - Brute luck vs. option luck (Dworkin's framework)
  - Choice vs. outcome (a person might choose a risk but not the bad outcome)
  - The problematic reality that writing quality influences decisions despite being an unchosen talent

  For the procedure structure, I'll create a decision tree with four sequential filters:
  1. Acute financial emergency (factual threshold)
  2. Clear brute luck (if yes → approve)
  3. Pure option luck (if yes → refuse)
  4. Mixed luck (proceed to value judgment)

  At each stage I'll specify:
  - What question to ask
  - What constitutes sufficient evidence
  - Where it leads (approve/refuse/handoff)

  For the writing quality bias problem, I'll suggest mitigation strategies while acknowledging it can't be fully eliminated.

  When applying to cases:
  - Case 1 (poet): Depression likely brute luck → approve
  - Case 2 (novelist): Resignation was choice but outcome not chosen → mixed luck requiring judgment
  - Case 3 (translator): Lapsing insurance was choice but flood was bad luck → mixed with judgment needed

  I'll mark unavoidable judgment points throughout, particularly in the mixed luck assessment.

  For the default verdict, I'll recommend "Refuse unless exceptional circumstances" since the fund's charter emphasizes misfortune over choice consequences.

  Finally, I'll end with the required "Verdict:" line summarizing the default position.
answer: |-
  Below is a practical procedure for your grants panel, grounded in luck egalitarianism (LE), designed to be run by four writers in 90 minutes. It prioritizes fact-based distinctions between **brute luck** (disadvantages unchosen and unavoidable) and **option luck** (disadvantages from conscious risks), while explicitly separating accountability for *choices* from accountability for *outcomes*. It addresses the bias toward "unchosen talent for self-narration" by limiting narrative evaluation to specific steps and flagging unavoidable subjectivity.  

  The procedure has four sequential tests. **Refusal occurs automatically if any test fails** unless otherwise stated. **Handoff to panel judgment** occurs where facts alone cannot resolve the case, typically when "mixed luck" exists (choice + unchosen bad outcome) or when a value call is needed. Each test includes:  
  - **Question to ask** (phrased for panel discussion)  
  - **Sufficient answer** (evidence standard)  
  - **Outcome** (approve/refuse/handoff)  

  ---

  ### **The Procedure**  
  **Step 1: Acute Financial Emergency**  
  *Purpose: Confirm urgency aligns with fund’s scope. Filters out non-emergencies.*  
  - **Question:** "Is there objective evidence of *imminent, severe financial harm* (e.g., eviction, utilities cut-off, medical crisis) unrelated to routine underemployment?"  
  - **Sufficient Answer:** Bank statements, overdue bills, or medical/disability records showing crisis within 1–2 months. Subjective claims insufficient without documentation.  
  - **Outcome:**  
    - Pass (crisis confirmed) → Proceed to Step 2.  
    - Fail → **Refuse**. *Rationale: Fund is for acute hardship, not chronic poverty.*  

  **Step 2: Predominantly Brute Luck**  
  *Purpose: Identify clear "no-fault" disadvantages. Approves cases where the applicant had no meaningful choice.*  
  - **Question:** "Was the financial emergency *directly caused* by an event the applicant could not reasonably anticipate or control (e.g., sudden illness, natural disaster, fraud)?"  
  - **Sufficient Answer:** Evidence linking crisis to external shock (e.g., doctor’s note for disability, police report for theft). Applicant’s narrative alone insufficient; must align with documents.  
  - **Outcome:**  
    - Pass (brute luck dominant) → **Approve**. *Rationale: Aligns with LE—compensation owed for unchosen misfortunes.*  
    - Fail (choice involved) → Proceed to Step 3.  

  **Step 3: Pure Option Luck**  
  *Purpose: Refuse cases where hardship stems solely from a conscious, avoidable risk.*  
  - **Question:** "Was the financial emergency *entirely caused* by a deliberate, avoidable risk (e.g., gambling, reckless spending), with *no* compounding unchosen bad luck?"  
  - **Sufficient Answer:** Evidence that the risk was freely chosen, alternatives existed, and the outcome was predictable (e.g., applicant quit stable job despite savings, then spent frivolously).  
  - **Outcome:**  
    - Pass (pure option luck) → **Refuse**. *Rationale: LE denies compensation for chosen gambles.*  
    - Fail (bad outcome not chosen) → Proceed to Step 4.  

  **Step 4: Mixed Luck Assessment**  
  *Purpose: Handle cases involving choice + unchosen bad outcome. Forces explicit value judgments.*  
  - **Question:** "Did the applicant make a *reasonable choice* that was *sabotaged by brute luck*, making the outcome disproportionate to the risk?"  
    - **Subtest A (Choice):** "Was the initial risk *justifiable* given their circumstances? (e.g., leaving job to write *only* after securing savings/contract)."  
      - *Sufficient Answer:* Evidence of planning (emails showing freelance contracts, savings records).  
    - **Subtest B (Outcome):** "Was the bad outcome *unforeseeable and severe*? (e.g., illness derailing a viable plan)."  
      - *Sufficient Answer:* Proof the setback was external/random (e.g., market crash, diagnosis post-decision).  
  - **Outcome:**  
    - Both subtests pass → **Handoff to panel**. *Rationale: LE supports compensation here—outcome not chosen.*  
    - Either subtest fails → **Refuse**.  
    - Ambiguous evidence → **Handoff to panel**.  

  ---

  ### **Addressing the Two Complexities**  
  1. **Choice vs. Outcome Distinction**:  
     - The procedure isolates choice (Step 3) from outcome (Step 4B). Step 3 judges *only* the choice; Step 4B judges *only* if the outcome was unchosen.  
     - E.g., Resigning to write is a choice (Step 3), but illness making it "unrecoverable" is outcome (Step 4B).  

  2. **Bias for Self-Narration Talent**:  
     - **Mitigation**: Restrict narrative evaluation to **Step 4 only**. In Steps 1–3, rely solely on documents. In Step 4, allow narrative to clarify *context* for choices/outcomes but score responses on:  
       - **Factual consistency** (does story align with evidence?)  
       - **Plausibility** (does "unforeseen bad luck" hold up logically?)  
     - **Acknowledge Limit**: Talent influences plausibility assessments. The panel cannot eliminate this but can note when a refusal stems from "implausible self-report" (a value call).  

  ---

  ### **Running the Cases**  
  **Case 1: Poet whose teaching post ended due to disabling depression**  
  - Step 1: Pass (disabling = imminent crisis).  
  - Step 2: **Pass → Approve**.  
    - *Why:* Depression is brute luck (unchosen illness). Teaching post loss is direct consequence. No evidence she *chose* to become ill.  
  - *Panel Bias Risk:* Low. Writing talent irrelevant here; medical evidence suffices.  

  **Case 2: Novelist who resigned secure job to finish a book that didn’t sell, now facing eviction**  
  - Step 1: Pass (eviction = imminent crisis).  
  - Step 2: Fail (resignation was a choice).  
  - Step 3: Fail (not "pure" option luck—outcome (book flopping) may be unlucky).  
  - Step 4:  
    - Subtest A (Choice): Did they have savings/contract? *Unclear → Handoff*.  
    - Subtest B (Outcome): Was failure unforeseeable? Publishing risk is foreseeable, but severity (unrecoverable) may not be.  
  - **Handoff to panel**.  
    - *Procedure’s Guidance:* Refuse unless evidence shows a "reasonable gamble" (e.g., advance contract) ruined by bad luck (e.g., publisher bankruptcy).  
    - *Harsh Truth:* If no evidence of planning, **refusal likely**. The panel may hate this—it penalizes artistic passion, but LE sees resignation as chosen risk.  

  **Case 3: Translator whose uninsured flat flooded after she lapsed insurance to save money**  
  - Step 1: Pass (flood damage = crisis).  
  - Step 2: Fail (lapsing insurance was a choice).  
  - Step 3: **Pass → Refuse?**  
    - *But wait:* Step 3 requires *pure* option luck. Here, the *flood* is brute luck (unchosen disaster). Lapsing insurance was a choice, but the flood was the trigger.  
  - Step 4:  
    - Subtest A (Choice): Lapsing insurance to save money is *unreasonable* if alternatives existed (e.g., cheaper policy). Likely **fail → Refuse**.  
    - *Unless* Subtest B (Outcome): Flood was unforeseeable (e.g., no prior flood risk). But "saving money" is rarely justifiable for essentials like insurance.  
  - **Handoff if flood was truly freak (e.g., area not flood-prone); else Refuse.**  
    - *Panel Will Hate This:* Feels punitive—she was poor! But LE says: she chose to risk insurance, and the fund isn’t for backstopping predictable consequences.  

  ---

  ### **Where Judgment Cannot Be Eliminated**  
  1. **Step 4 (Mixed Luck)**: Defining "reasonable choice" (Subtest A) and "unforeseeable severity" (Subtest B) requires value judgments about risk, proportionality, and "justifiability."  
  2. **Narrative Plausibility**: Even with documents, interpreting consistency/context hinges on subjective reading.  
  3. **Evidence Gaps**: When documents are sparse (common with artists), the panel must infer intent from narrative.  

  **Verdict:** When tests leave a case unsettled, **refuse unless exceptional circumstances**.  
  - *Rationale:* Your charter emphasizes "misfortune not consequences of decisions." Defaulting to refusal prioritizes brute luck cases and avoids rewarding ambiguous risks. "Exceptional circumstances" (e.g., a choice made under duress) can be debated in handoffs.
