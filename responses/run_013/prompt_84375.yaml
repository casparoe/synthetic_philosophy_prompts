prompt: |-
  I am a sixth-form student who has been reading around the philosophy of biology, and I have ended up endorsing a fairly specific position. Please adopt the role of a philosopher of biology with expertise in the debate over biological function. Think carefully and reason step by step; before you answer, brainstorm a wide range of possible defeaters and then organise your response.

  The position I hold is a maintenance-sensitive version of the etiological or selected-effects account. Roughly, a trait's function is the effect for which it was selected in its ancestral lineage, but the trait counts as having that function now only if it is still maintained in the population by selection, or by some mechanism that reliably tracks the selection history. The rival I have in mind is the causal-role account, roughly the view that a trait's function is its present contribution to some biological capacity. I am not asking for a general survey of the debate. I want to know what would count against my specific package, and I do not want only the standard textbook objections; I want the ones that arise specifically from adding the maintenance condition.

  Please tell me:

  1. Which observations, experiments, conceptual cases, intuitions, or theoretical results would count against it, ranked from fatal to merely awkward.
  2. What my view predicts that the causal-role account does not, and what the causal-role account predicts that it does not.
  3. Which of these defeaters a committed defender of my position would themselves concede as genuine costs, and which they would dismiss as changing the subject.
  4. Whether the maintenance condition makes the view better or worse insulated from empirical refutation, and whether that insulation is a problem.
  5. What would have to be true for the position to be false, and which of those possibilities are live rather than merely logically possible.
  6. If you think the position is ultimately untenable, what is the least costly repair.

  I am especially interested in cases involving traits that are currently costly but were selected for in the past; traits maintained by developmental constraint rather than ongoing selection; recently evolved traits with little selection history; and synthetic or engineered organisms whose traits have a design history but no evolutionary history. I would also like to know whether the distinction between selection for a trait and selection of a trait, between selecting a trait because of an effect and merely selecting a trait that happens to have that effect, does any real work here, or whether it is just a verbal manoeuvre. Please do not give me a reading list or citations, as I cannot search for them; I want the arguments and a map of what my view risks.
