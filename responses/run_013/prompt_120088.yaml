prompt: |-
  Ok, I'm trying to nail down what I actually believe about eliminativism about belief, and I want a number from you plus the derivation — I'm definately not looking for a literature tour.

  Here's the proposition, stated so it can come out true or false: in a mature cognitive science, 'belief' will have the same fate as 'gene'. The word survives, but it stops naming one natural kind — you get a cluster of partly stipulative, context-specific notions (the transmission-genetics gene, the molecular gene, whatever the evo-devo people mean by it) and no agreement about whether the folk notion got vindicated or junked. Call that fragmentation. The rivals are (a) elimination — 'belief' goes the way of 'caloric', nothing in a finished cognitive science answers to it, and we should stop using it in serious explanation — and (b) vindication — there's one real kind there and the mature theory tells us what it is, the way 'temperature' turned out to be mean kinetic energy. Same question for desire, I just care about it less.

  So: your credence in fragmentation, plus the decomposition. I'd expect at least these terms, but tell me if the list is wrong or if one of them is really two things:
  - the chance that the whole dispute rests on a false presupposition, namely that 'belief' was ever a theoretical posit rather than a move in a practice of interpreting people and holding them to norms. If belief-talk is more like a skill — simulating agents, making sense of them — than a theory with posits, then "does it refer?" is the wrong question and all three outcomes are beside the point. Or is that a dodge?
  - the chance that current predictive/Bayesian stuff is quietly keeping beliefs under a new name, or is belief-like enough that vindication happens by default
  - the chance that 'belief' never picked out one thing to begin with, so fragmentation wouldn't be a discovery but a decision — conceptual engineering — and the real question is what we want the word for

  Then combine them, and tell me which term the final number is most sensitive to, and what evidence or argument would move it most.

  And be straight with me: if the three-way split is confused, or if forcing one credence here lumps together things that should be kept seperate, say so and hand me the better-posed question instead of humoring me. I also know "mature cognitive science" is doing a lot of work in my proposition — if it's too vague to have a truth value, tighten it and tell me what you changed. American English, please. For what it's worth, I'm at about 0.55 on fragmentation myself.
