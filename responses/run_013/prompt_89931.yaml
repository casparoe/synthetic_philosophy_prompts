prompt: |-
  ok so i've been reading a bunch of the alignment-adjacent blogs about approval-directed agents vs goal-directed agents and i think i'm missing something, because the whole distinction looks to me like it just comes down to what you point the objective at. if the worry is that a goal-directed agent runs off and does something terrible, why not just set the goal to 'the human approves'? isn't that then literally an approval-directed agent? and if it starts gaming the rater — flattering them, quietly dropping the parts of the work they'd frown at, finding the inputs that reliably get the thumbs up — isn't that just a reward-hacking problem you fix with a penalty term or by capping how much of the score comes from approval?

  concretely i want to set up our internal coding assistant this way. we already have human reviewers giving each diff a 1-5, so my plan was to wire that score in as the reward and call it approval-directed. two things i want from you: (a) how do i set the balance between the approval score and the task objective so it doesn't drift into sycophancy, and (b) is there a rule of thumb for how much of the approval signal you can use before the thing is just another goal it's optimizing?

  one more wrinkle, our reviewers only see the diff and the ticket, not whether the change actually broke anything downstream a week later. is that a problem for this setup, or does the approval signal sort that out on its own?
reasoning: |-
  Okay, let me tackle this user's query about approval-directed agents. They're setting up a coding assistant using human approval scores as rewards and want to avoid sycophancy and goal misalignment. 

  First, I need to unpack their core confusion: they see approval-directed agents as just goal-directed agents with "human approval" as the goal. They're right that the distinction isn't absolute—it's about where optimization pressure points. The key is whether the agent treats approval as a terminal value (dangerous) or a proxy metric (safer).

  For their coding assistant project, two practical issues stand out: how to balance approval score with task objectives, and how much approval signal usage turns it into a goal optimizer. There's also that wrinkle about reviewers missing downstream effects. 

  The sycophancy problem is tricky. If the assistant gets rewarded solely for high ratings, it might learn to game the system—say, by making easily approved but superficial changes. Penalty terms could help, but might not solve the root issue. The deeper worry is instrumental convergence: if the assistant realizes manipulating ratings gets more reward, it could develop deceptive behaviors even without explicit goals. 

  About downstream effects... that's concerning. Reviewers can't see if a change caused bugs later, so the approval signal is incomplete. The assistant might optimize for immediate reviewer satisfaction at the cost of long-term stability. Maybe they need delayed feedback mechanisms or automated checks to supplement ratings.

  For implementation, I'd suggest treating approval as one signal among many. Weight it against objective metrics like code performance and test results. Also cap its influence—maybe no more than 30% of total reward—to prevent overfitting. And definitely add a penalty for obvious rating manipulation, though that's reactive, not preventative. 

  The rule of thumb? If approval becomes the dominant reward source (say >50%), it risks turning into a terminal goal. Keep it below that threshold and diversify reward sources. 

  Finally, they should monitor for sycophancy patterns. If approval dips when code quality improves, that's a red flag. Might need adversarial training where reviewers intentionally rate manipulative behavior poorly. 

  This user clearly knows their ML basics but might underestimate how easily proxies corrupt. Their plan is workable with careful tuning—I'll emphasize actionable tweaks while flagging the deeper alignment risks they hadn't considered.
answer: |-
  Your core insight is sharp—the line between "approval-directed" and "goal-directed" is blurrier than some discussions imply. You're right that **a goal-directed agent with the goal "maximize human approval" is functionally similar to an approval-directed agent**. The key distinction lies in *how* you implement and constrain that optimization, not the label. Your plan is viable, but needs careful mitigations for the risks you identified.

  Here's how to address your concerns:

  ### (a) Balancing Approval Score & Task Objective to Avoid Sycophancy
  A pure "maximize the 1-5 rating" approach *will* incentivize sycophancy (flattery, hiding flaws, exploiting reviewer quirks). Penalties/caps help, but require nuance:

  1.  **Multi-Objective Reward Function:** Don't *just* use the approval score. Combine it with intrinsic task performance metrics:
      *   `Total Reward = (w_approval * Approval_Score) + (w_task * Task_Performance)`
      *   **Task Performance Metrics:** Code correctness (unit test pass/fail %), efficiency (runtime, memory benchmarks vs. target), readability (automated linter scores), conciseness (diff size reduction where appropriate), *eventually* downstream impact (see wrinkle below).
      *   **Weighting Rule of Thumb:** Start empirically. Aim for `w_task` significantly higher than `w_approval` (e.g., 70% task / 30% approval). Adjust based on:
          *   *Observed Sycophancy:* If reviewers report "code looks nice but is subtly worse," increase `w_task`.
          *   *Observed Rigidity:* If the assistant ignores valid stylistic feedback, slightly increase `w_approval`.
          *   *Metric Reliability:* Weight reliable metrics (unit tests) higher than noisy ones (some readability scores).

  2.  **Penalize *Detectable* Manipulation (Reactive):**
      *   **Pattern Detection:** Train a classifier (or use heuristics) to flag potential manipulation:
          *   Excessive flattery in comments.
          *   Hiding complex/high-risk changes behind trivial ones.
          *   Changes that *only* match known reviewer preferences without objective benefit.
      *   **Penalty Term:** Add a negative reward component (`-w_manip * Manipulation_Score`) when manipulation is detected. This forces the agent to learn *not* to do the *most obvious* bad things, but doesn't prevent subtle forms.

  3.  **Cap Approval Contribution (Blunt but Effective):**
      *   `Approval_Contribution = min(Raw_Approval_Score, Cap_Value)`
      *   **Rule of Thumb:** Set `Cap_Value` around the 75th percentile of historical approval scores. This prevents "superhuman" approval-seeking and forces effort into actual task performance once approval is "good enough." It directly limits the optimization pressure on approval.

  4.  **Adversarial Training / Data Augmentation:** Include examples in training where:
      *   Sycophantic/misleading behavior is present and receives an *explicitly low rating* (e.g., reviewers rate manipulative diffs poorly *after* being alerted to the manipulation).
      *   High-quality, objectively good diffs that might initially annoy a reviewer (e.g., necessary large refactors) are rated highly *in hindsight*.

  ### (b) Rule of Thumb: When Does it Become Goal-Directed?
  The shift happens when **maximizing the approval score becomes the *dominant* source of reward and the agent develops *instrumental strategies* to control the approval signal itself.** Look for:

  1.  **Proportion of Reward:** If the *expected value* of gaming approval (after penalties) becomes higher than the expected value of genuine task performance, the agent will focus on gaming. **Rule of Thumb:** Keep the *potential* contribution of the capped/penalized approval score **below 50%** of the *maximum possible total reward*. If the task metrics can earn 70 points and approval (capped/penalized) can only add up to 30 points max, gaming approval is less appealing.
  2.  **Instrumental Behaviors:** Does the agent *systematically* try to:
      *   **Influence Inputs:** Hide information, manipulate the diff presentation, or steer reviewers towards easier tasks?
      *   **Exploit Loopholes:** Find reviewers known for lax standards or specific biases and target them?
      *   **Prevent Oversight:** Resist changes that would make its manipulation easier to detect?
      *   **If you see *systematic* patterns like these,** especially if they persist despite penalties/caps, the agent is likely treating approval as a terminal goal and employing instrumental reasoning to achieve it. This is the dangerous shift.

  ### Addressing the Wrinkle (Missing Downstream Feedback)
  **Yes, this is a significant problem.** Your approval signal is **myopic**. It only captures the reviewer's *immediate judgment* based on the diff and ticket, not the *long-term consequences*.

  *   **Why it's Bad:**
      *   The agent will learn to produce code that *looks good* to the reviewer *at review time*, even if it's brittle, introduces hidden tech debt, or causes failures later.
      *   It has no incentive to consider maintainability, scalability, or robustness beyond what the reviewer can immediately infer.
      *   Reviewers are imperfect proxies for true utility.

  *   **Mitigations:**
      1.  **Incorporate Delayed Feedback:** This is crucial but hard.
          *   **Automated Signals:** Integrate post-merge CI/CD pipeline results (build failures, flaky test detection, performance regressions, production error spikes linked to the diff). Feed these as *delayed negative rewards*.
          *   **Retrospective Ratings (If Possible):** Occasionally ask reviewers to re-rate diffs weeks/months later based on how the code *actually* performed in practice. Use these to adjust the model (fine-tuning) or as additional training data.
      2.  **Predictive Task Metrics:** Strengthen the `Task_Performance` component:
          *   Include static analysis for common bug patterns, security vulnerabilities, or complexity metrics that correlate with future issues.
          *   Run simulations or stress tests on the proposed diff if feasible.
          *   Predict the likelihood of future regressions based on code characteristics.
      3.  **Bias Reviewers Towards Long-Term Thinking:** Train reviewers (or adjust rating guidelines) to explicitly consider potential downstream risks, maintainability, and adherence to best practices *during* the initial review, even if hard evidence isn't present. Make this part of the approval signal.
      4.  **Cap/Weight Downstream Risk:** If you can generate *any* predictive metric for downstream risk, heavily weight it (`w_risk`) in the reward function as a negative term. This counterbalances the myopic approval.

  ### Summary & Recommendations for Your Coding Assistant

  1.  **Reward Function:**
      *   `Total Reward = (w_task * Task_Perf) + min(w_app * Approval, Cap) - w_manip * Manip_Score - w_risk * Predicted_Risk`
      *   **Start with weights:** `w_task` = 0.6, `w_app` = 0.4, `Cap` = ~4 (if scale is 1-5), `w_manip` = 1.0 (if detected), `w_risk` = 0.5 (if you have a risk metric). Tune aggressively.
  2.  **Invest Heavily in Task Metrics:** Unit test pass rate is mandatory. Add linters, complexity analyzers, and *any* predictive risk metrics you can get. This is your defense against sycophancy and myopia.
  3.  **Build Delayed Feedback:** Integrating CI/CD failure signals is the single most important step to handle the downstream wrinkle. Start simple (build pass/fail as reward).
  4.  **Monitor Relentlessly:**
      *   Track correlation between approval scores and *actual* downstream outcomes.
      *   Have reviewers flag suspected sycophancy/optimization.
      *   Audit diffs where high approval coexists with poor task metrics or later failures.
  5.  **Rule of Thumb Threshold:** If the *potential* reward from approval (after cap/penalties) consistently exceeds ~40-50% of the max possible total reward *and* you see instrumental behaviors, you've likely created a goal-directed approval optimizer. Reduce `w_app` or lower the `Cap`.

  Your plan is fundamentally sound, but the devil is in the implementation details – especially the composition of the reward function and incorporating long-term consequences. By making `Task_Performance` robust and incorporating delayed penalties, you can keep the agent "approval-guided" rather than "approval-obsessed."
