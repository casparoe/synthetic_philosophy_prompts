  ## Municipal Office of Supervised Drinking (MOSD)
  **Service Brochure & Citizen Information Guide**

  **Mission Statement:** To foster civic virtue and social cohesion through the structured application of measured inebriation, in accordance with Book I & II of the Foundational Civic Statutes.

  **Q1: What is the purpose of the Municipal Office of Supervised Drinking?**
  A: The MOSD administers the Civic Recalibration and Assessment Program (CRAP), utilizing supervised symposia to achieve two primary civic objectives:
  1.  **Character Assessment:** To observe citizens under the disinhibiting influence of wine, revealing inherent dispositions towards courage, moderation, and shame (aidōs) otherwise masked by daily decorum.
  2.  **Character Training:** To provide a controlled environment where established citizens, particularly those of advanced age, may safely experience the loosening effects of wine. This temporary softening counteracts the desiccating rigidity of age, allowing for the reabsorption of choral and civic virtues through song, dance, and fellowship, thereby maintaining their utility to the polis.

  **Q2: Is this just an excuse for a state-funded party?**
  A: Absolutely not. Pleasure, while a potential byproduct, is not the objective. The symposium is a civic instrument akin to military drills or public assemblies. Its structure, rules, and supervision differentiate it fundamentally from recreational revelry. Participation is a civic duty, not an indulgence.

  **Q3: Who must attend? Who is excluded?**
  A: **Mandatory Attendance:** All male citizens aged 30 years and above, possessing a Certificate of Primary Civic Education (Form CPCE-7), are required to participate in a minimum of four symposia per fiscal year, as scheduled by MOSD district offices.
  *   **Exclusion:** Citizens below the age of 30 are categorically excluded. As the Foundational Statutes state, "One does not add fire to fire." The unformed characters of the young are considered too volatile for such testing and training. Admission requires valid proof of age and CPCE-7 certification.

  **Q4: Who runs these symposia?**
  A: Each symposium is presided over by a **Sober Symposiarch (Grade II Civic Officer or higher)**, appointed and trained by the MOSD. The Symposiarch's duties are paramount:
  *   Regulating the precise dilution and distribution of wine (State-Issued Vintage #5).
  *   Enforcing the Rules of Order (MOSD Pamphlet #3b).
  *   Maintaining a dispassionate, observational stance.
  *   Filing the mandatory Post-Symposium Assessment Report (PSAR-2).

  **Q5: What if no Sober Symposiarch is available?**
  A: The symposium cannot legally proceed without a certified Symposiarch present and demonstrably sober at all times. Should a scheduled Symposiarch be unavailable due to documented illness, civic emergency, or disqualification (see Q5a), the event is cancelled. Citizens will be rescheduled. Chronic Symposiarch shortages may necessitate auxiliary recruitment drives or temporary reassignment of qualified magistrates. *(Citizens experiencing unexplained cancellations should contact their District MOSD Office or the Symposiarch Vacancy Hotline: 555-ORDRLY).*

  **Q5a: How is the Symposiarch's sobriety ensured?**
  A: Symposiarchs undergo pre-symposium Breath & Demeanor Screening (Protocol 4c). Their wine is heavily diluted (1:5 ratio, State Vintage #5A "Supervisor's Blend") and consumption is strictly rationed against a pre-approved duty roster. Repeated failure of Protocol 4c screening results in suspension and mandatory retraining at the Civic Temperance Academy.

  **Q6: How is this a "Test" AND "Training"?**
  A: The process is inherently dual-purpose:
  *   **Assessment (Test):** The Symposiarch and appointed observers meticulously log citizen comportment against standardized criteria:
      *   **Courage Dimension:** Does inebriation manifest as reckless belligerence (fail) or appropriately relaxed confidence (pass)?
      *   **Shame (Aidōs) Dimension:** Does the loss of inhibition lead to disgraceful acts, lewdness, or uncontrolled emotion (fail), or a harmonious, fellowship-enhancing ease within established boundaries (pass)? Failures are noted in the citizen's Civic Record (CR-1) and may trigger remedial assignments or counseling.
  *   **Training (Recalibration):** For citizens exhibiting baseline passable behavior, the experience itself *is* the training. The wine-induced softening allows elders to shed habitual stiffness, participate genuinely in choral singing (State Hymnal Vol. II), engage in moderate dance (Regulation Steps Only), and rebuild bonds of fellowship essential for civic unity. This counters the soul's natural ossification with age.

  **Q7: Why is the Certificate of Primary Civic Education (CPCE-7) required?**
  A: The Foundational Statutes are explicit: the beneficial effects of wine, as a tool for revealing and retraining character, are only reliably operative upon individuals whose fundamental virtues have already been correctly instilled through prior upbringing and education. The CPCE-7 verifies this prerequisite formation. The symposium does not instill basic virtue; it assesses its presence, reveals its nuances, and refreshes its expression in established citizens. It is, therefore, a vital component of ongoing civic credentialing.

  **Q8: Isn't it contradictory for an Office promoting Temperance to administer intoxication?**
  A: The MOSD promotes *Temperance* (sōphrosynē) – defined as measured self-control within established limits – not abstinence. Structured, supervised intoxication is the specific instrument by which the extremes of both excessive rigidity (common in age) and latent intemperance (revealed in the test) are identified and addressed. Our mission is the *management* of wine's effects for the net civic good, recognizing its unique ability to expose and soften the soul under controlled conditions. Think of it as civic metallurgy: applying measured heat to test and refine the metal.

  **Q9: What are the consequences of failing the Assessment?**
  A: Outcomes are determined by the District MOSD Review Board based on the PSAR-2 and citizen's CR-1 history. Minor failures may result in mandatory attendance at additional "remedial" symposia focusing on shame-regulation exercises or courage modulation drills. Significant or repeated failures, indicating deeper character flaws not remediable within the symposia framework, may lead to:
  *   Suspension of certain civic privileges (e.g., choral leadership roles).
  *   Mandatory counseling at the Civic Psychagogy Centre.
  *   Reassignment to duties less reliant on discretionary judgment (e.g., agricultural monitoring, archive dusting).
  *   In extreme, persistent cases, notation on the citizen's permanent record affecting inheritance rights or eligibility for certain offices.

  **Q10: How do I schedule my mandatory symposium?**
  A: Attendance cycles are determined by your district and age cohort. You will receive a MOSD Summons (Form S-4) by civic courier at least 30 days prior to your assigned date. Failure to appear without documented exemption (Form MED-EX2 or CIVEX-9) results in fines and rescheduling at the end of the current cycle, plus notation on CR-1.

  **Remember:** Your participation strengthens the City's soul. Drink responsibly, for the Polis.  
  **Municipal Office of Supervised Drinking – Nurturing Virtue Through Vigilant Vintages.**  
  *(Brochure Revision 7.3 – Approved by the Nocturnal Council, 15th of Metageitnion)*
