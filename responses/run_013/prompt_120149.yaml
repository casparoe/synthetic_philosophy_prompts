  ok so i need help before debate club shreds me. im a junior, i write a column for the school paper, and the school board votes next month on scrapping a bunch of stuff: phones during the day, the dress code, the no-hats-inside rule that literally nobody can explain, and the mandatory freshman study skills class. i wrote a column saying we shouldnt just nuke rules we dont understand, and i used chestertons fence thing — the one about the reformer who wants to pull down a gate without first asking why somebody put it there. then in the same column i went off on the admin for saying "its tradition" and "weve always done it this way," and now half the debate team says i contradicted myself and the other half says im a hypocrite for using a conservative argument and then turning around and demanding more student power. i want to know if my actual views hang together before i go defend them.

  heres roughly where i am, and fair warning, i definately might be mangling burke, i read him in a summer program and mostly remember the vibe:

  1. dont get rid of a rule or an institution if you cant say what it does. the burden is on the person tearing it down, not the person defending it.
  2. burke-ish: institutions arent just stuff somebody made up last week, theyre kind of a partnership between people who are dead, people who are alive, and people who arent born yet, so change should be slow, keep what works, and be suspicious of anyone reforming everything from scratch on the basis of abstract rights.
  3. the admins appeal to tradition is garbage. "weve always done it" isnt an argument, its an excuse, and also most of our rules are like six years old, invented by a principal who doesnt even work here anymore.
  4. students should have real power over school rules. not a suggestion box, an actual council with a veto.
  5. some rules are just wrong no matter how long theyve been there. we have one that in practice targets the muslim girls in my grade, and one that exists so the school doesnt look bad on the news. you dont need to do archaeology on those two.

  what i want: tell me which of these actually pull against each other, which ones only look like they do, how bad each real tension is, and what the cheapest fix is and what it costs me. dont just list everything as a tension, i need to know which one is the actual problem. also be honest about which of my glosses on burke and chesterton are things people who actually study them would agree on versus which are contested or just wrong — dont tell me "burke thought X" when people who know burke fight about X. and if you can, tell me which single thing i should change so the rest of it stops creaking.

