prompt: |-
  I want the specification before I evaluate any particular rule for updating on uncertain evidence. Write out the desiderata that any adequate account must meet, with the consideration that motivates each and a verdict on which are non-negotiable and which are preferences of a particular camp.

  Treat the following as part of the specification rather than as an objection to be answered. An instrument reports its evidence as a probability distribution over a partition of the possibilities, not as a single proposition. Its calibration drifts, so what a given reading means is itself something the agent learns only from further readings of the same instrument. Readings arrive in sequences, and the partition a reading is expressed over is sometimes coarse and sometimes fine, with the agent unsure which.

  Cover at least these candidates, and add any you think belong: (1) agreement with conditionalization when the evidence is certain; (2) the posterior is a probability function over the same algebra; (3) an uncertain report never makes the agent certain of something she was not already certain of; (4) conditional probabilities within each evidence cell are left unchanged; (5) the posterior is the point closest to the prior among those the evidence permits; (6) the order in which two uncertain reports arrive does not affect the result; (7) a report already absorbed changes nothing when it is repeated; (8) the prior is recoverable from the posterior together with the evidence; (9) the result does not depend on whether the same information is expressed over a coarse or a fine partition; (10) the rule is defined when the evidence gives positive probability to something the agent had ruled out; (11) the update is uniquely determined by prior and evidence, including when the report concerns the agent's own posterior. Then identify which pairs or larger subsets of these cannot be jointly satisfied and why, and say which single requirement excludes the most candidate rules.
reasoning: |-
  We are setting out desiderata for updating on uncertain evidence. The evidence is presented as a probability distribution over a partition, and the agent must update their beliefs accordingly. The agent also learns about the calibration of the instrument over time. The desiderata are motivated by considerations of rationality, consistency, and practicality.

  We list the desiderata, provide the motivation for each, and note whether it is non-negotiable (a core requirement) or a preference of a particular camp.

  1. **Agreement with conditionalization when the evidence is certain.**
     - *Motivation*: When the evidence is certain (i.e., the instrument reports a single proposition with probability 1), the update rule should reduce to standard Bayesian conditionalization. This ensures consistency with the foundation of Bayesian updating.
     - *Verdict*: Non-negotiable.

  2. **The posterior is a probability function over the same algebra.**
     - *Motivation*: The updated belief should still be a probability distribution, and it should be defined over the same set of events as the prior. This is necessary for coherence and to avoid introducing new events arbitrarily.
     - *Verdict*: Non-negotiable.

  3. **An uncertain report never makes the agent certain of something she was not already certain of.**
     - *Motivation*: If the prior assigns probability 0 to an event, then after updating with uncertain evidence (which by definition does not rule out any event with absolute certainty) the posterior should still assign probability 0 to that event. More generally, if the agent was not certain of A (i.e., P(A) < 1) then after an uncertain update, she still should not be certain of A. This is because uncertain evidence does not provide absolute certainty.
     - *Verdict*: Non-negotiable.

  4. **Conditional probabilities within each evidence cell are left unchanged.**
     - *Motivation*: This is the "Jeffrey conditionalization" desideratum. If the evidence only gives probabilities for a partition, then conditional on any cell of that partition, the probabilities of other events should remain the same. This is because the evidence does not provide any information that distinguishes between sub-events within a cell.
     - *Verdict*: This is a defining feature of Jeffrey conditionalization. However, it is not non-negotiable for all accounts. Some accounts (like radical probabilism) might allow for changes within cells if the evidence is interpreted as providing more information. But it is a strong requirement for preserving conditional probabilities.

  5. **The posterior is the point closest to the prior among those the evidence permits.**
     - *Motivation*: This is motivated by minimum cross-entropy or Kullback-Leibler divergence. The idea is to minimize the change in beliefs subject to the constraints of the evidence. This is a kind of conservatism principle.
     - *Verdict*: This is a preference of a particular camp (e.g., information-theoretic Bayesians). It is not non-negotiable because there are other ways to update (like Jeffrey conditionalization) that do not necessarily minimize a distance measure.

  6. **The order in which two uncertain reports arrive does not affect the result.**
     - *Motivation*: Rational belief should not depend on the order in which evidence is presented, provided the total evidence is the same. This is a basic requirement of consistency over time.
     - *Verdict*: Non-negotiable in the sense that order-independence is a hallmark of rationality. However, note that in some contexts (e.g., when the evidence is not independent) the order might matter. But if the two reports are about the same underlying state and the instrument's calibration is fixed, then order should not matter. Given the calibration drift, this may be more complex. But ideally, the update rule should be commutative when the evidence is about the same partition and the calibration is learned appropriately.

  7. **A report already absorbed changes nothing when it is repeated.**
     - *Motivation*: If the agent has already incorporated a piece of evidence, then receiving the same report again should not change her beliefs. This is because the evidence is redundant.
     - *Verdict*: Non-negotiable. This is a basic requirement of non-redundancy.

  8. **The prior is recoverable from the posterior together with the evidence.**
     - *Motivation*: This is a reversibility condition. It ensures that updating is invertible, which might be important for modeling learning and unlearning. However, note that in standard Bayesian updating, if we condition on E, we can recover the prior by "unconditioning" only if we remember E and the posterior. But in the case of uncertain evidence, the evidence is a distribution, so this might be more complex.
     - *Verdict*: This is a preference of some (e.g., it is a feature of Jeffrey conditionalization in some cases). But it is not non-negotiable because sometimes evidence might lead to a loss of information (e.g., when the prior assigns 0 to an event that the evidence gives positive probability to).

  9. **The result does not depend on whether the same information is expressed over a coarse or a fine partition.**
     - *Motivation*: The update should depend only on the informational content of the evidence, not on how it is presented. For example, if the evidence is about a partition {A, B} and we instead use a finer partition {A1, A2, B} where A1 and A2 are a partition of A, then the update should be consistent regardless of the coarseness.
     - *Verdict*: Non-negotiable. This is a requirement of consistency and invariance under repartitioning.

  10. **The rule is defined when the evidence gives positive probability to something the agent had ruled out.**
      - *Motivation*: Sometimes the evidence might assign positive probability to an event that the prior assigns 0. This can occur when the agent learns that a previously impossible event is actually possible (e.g., due to a new discovery). The update rule should be able to handle this without breaking down.
      - *Verdict*: Non-negotiable. A robust rule should be able to handle such cases.

  11. **The update is uniquely determined by prior and evidence, including when the report concerns the agent's own posterior.**
      - *Motivation*: The rule should be well-defined and unique given the prior and the evidence. This is to avoid ambiguity. Also, the rule should be able to handle self-referential evidence, such as when the evidence report is about the agent's own posterior (e.g., in a learning-theoretic context or in a game-theoretic setting).
      - *Verdict*: Non-negotiable for uniqueness (to avoid arbitrary choices) and definedness. However, handling self-referential evidence might be challenging and might require a more complex fixed-point approach. This is a strong requirement.

  Now, we identify conflicts:

  - **Conflict between (3) and (10)**: 
    - (3) says that if the prior rules out an event (P(A)=0) then the posterior must also rule it out (P'(A)=0). 
    - (10) requires that the rule works even when the evidence assigns positive probability to an event that the prior rules out. 
    - But if the evidence says P_evidence(A) > 0 and the prior says P_prior(A)=0, then (3) requires P'(A)=0 but the evidence might require P'(A) = P_evidence(A) (if we take the evidence as a constraint). This is a conflict.

  - **Conflict between (4) and (10)**:
    - (4) requires that conditional probabilities within each cell remain unchanged. But if the prior assigns 0 to a cell, then conditional probabilities given that cell are undefined. So (4) cannot be applied if the evidence assigns positive probability to a cell that the prior assigns 0 to. Therefore, (4) requires that the prior assigns positive probability to every cell that the evidence does, which is exactly what (10) is about (since (10) allows the evidence to assign positive probability to a cell that the prior assigns 0 to). So (4) is incompatible with (10) in such cases.

  - **Conflict between (4) and (9)**:
    - (4) is defined with respect to a particular partition. If we refine the partition, then the conditional probabilities within the original cells might not be preserved in the same way. Specifically, (4) applies to the given partition. But (9) requires that the update should be the same regardless of the partition. However, if we change the partition, then the set of cells changes, and the requirement (4) would have to hold for the new cells. This might not be consistent. For example, in Jeffrey conditionalization, if we have a partition and update, then if we refine the partition and update again with the same evidence (but now over the refined partition) we get a different result. So (4) and (9) are in conflict.

  - **Conflict between (5) and (4)**:
    - (5) requires minimizing a divergence to the prior subject to the evidence. (4) is a constraint that the posterior must have the same conditional probabilities within each cell. It turns out that the posterior that minimizes the KL divergence subject to the constraints on the marginal probabilities (i.e., the probabilities of the cells) is exactly the one that satisfies (4). So in this case they are compatible. However, if we require (5) with a different divergence (like Euclidean) then we might not get (4). But the standard approach uses KL and then they are equivalent. So no conflict in the standard setting.

  - **Conflict between (6) and (11)**:
    - (6) requires commutativity. (11) requires that the update is uniquely determined by prior and evidence. But note that if the update is uniquely determined, then the order should not matter because the same prior and the same two pieces of evidence (regardless of order) should yield the same posterior. So they are compatible. However, if the evidence includes the agent's own posterior (as in (11)), then updating on two pieces of evidence in different orders might lead to different fixed points. This could break commutativity. So there might be a conflict when self-referential evidence is involved.

  - **Conflict between (8) and (10)**:
    - (8) requires that the prior is recoverable from the posterior and the evidence. But if the evidence assigns positive probability to an event the prior had ruled out, then the posterior might assign positive probability to that event. However, the prior assigned 0. How can we recover the prior? We would need to remember that the prior assigned 0 to that event. But the evidence does not record the prior. So without additional information, it might be impossible to recover the prior. Hence (8) is incompatible with (10).

  The single requirement that excludes the most candidate rules is likely **(10)**. Many update rules (like Jeffrey conditionalization) assume that the prior assigns positive probability to every cell of the evidence partition. Requirement (10) forces the rule to handle cases where the prior and evidence disagree on the possibility of events. This is a challenging case and rules that rely on conditionalization (like Jeffrey's) break down. Rules that can handle this (like the method of minimizing KL divergence with the constraint that the posterior must match the evidence distribution on the partition, even if the prior had zeros) are more complex and might violate (3) and (8).

  In summary:

  - Non-negotiable: 1, 2, 3, 6, 7, 9, 10, 11 (with the caveat that 11 might be difficult in self-referential cases, but we require it to be defined and unique).
  - Preferences: 4 (Jeffrey conditionalization camp), 5 (information-theoretic camp), 8 (reversibility camp).

  But note: the non-negotiability is subject to interpretation and the specific context. However, in a general account of rationality, we would want as many as possible.

  The conflicts highlight that no single update rule meets all these desiderata. In particular, the requirement (10) is a major sticking point and forces a choice between (3) and (10) and between (8) and (10). Also, (4) is incompatible with (10) and (9). Therefore, one must choose which desiderata to prioritize.

  The most central conflict is between (3) and (10). Some approaches (like standard Jeffrey conditionalization) abandon (10) by assuming the prior has full support. Others abandon (3) and allow the evidence to override the prior's zeros (which might be seen as a form of belief revision).

  Given the complexity, a comprehensive account might need to handle these cases separately or with a more general framework.
answer: |-
  ### Desiderata for Updating on Uncertain Evidence

  Below are the desiderata for any rule updating beliefs based on uncertain evidence, where evidence is reported as a probability distribution over a partition. Each desideratum includes its motivation, a verdict on whether it is **non-negotiable** (essential for rationality/coherence) or a **preference** (specific to a camp), and notes on conflicts. The list includes the requested candidates and additional items for completeness.

  1. **Agreement with Conditionalization for Certain Evidence**  
     - **Motivation**: When evidence is certain (a single proposition with probability 1), the update must reduce to Bayesian conditionalization (\(P_{\text{new}}(H) = P(H \mid E)\)). This ensures consistency with the foundation of probabilistic reasoning.  
     - **Verdict**: **Non-negotiable**. Violating this breaks core Bayesianism.

  2. **Posterior is a Probability Function**  
     - **Motivation**: Updated beliefs must remain a valid probability distribution over the original algebra of events. Rational agents require coherent beliefs.  
     - **Verdict**: **Non-negotiable**. Non-probabilistic updates are incoherent.

  3. **No Certainty from Uncertainty**  
     - **Motivation**: Uncertain evidence (e.g., a distribution) should never make the agent certain of a proposition they were not previously certain of (if \(P_\text{prior}(A) < 1\), then \(P_\text{post}(A) < 1\)). Uncertainty in inputs should propagate to outputs.  
     - **Verdict**: **Non-negotiable**. Prevents overconfidence from ambiguous data.

  4. **Invariance of Conditional Probabilities within Cells**  
     - **Motivation**: Given evidence over partition \(\{E_i\}\), conditional probabilities given each \(E_i\) should be unchanged: \(P_\text{post}(H \mid E_i) = P_\text{prior}(H \mid E_i)\). The evidence only constrains the probabilities of \(E_i\), not sub-structure within \(E_i\).  
     - **Verdict**: **Preference** (Jeffrey conditionalization camp). Motivated by minimal change but not universally essential.

  5. **Minimal Revision (Closest Probability)**  
     - **Motivation**: The posterior should be the probability distribution closest to the prior (e.g., in Kullback-Leibler divergence) that satisfies the evidence constraints. Embodies epistemic conservatism.  
     - **Verdict**: **Preference** (Information-theoretic camp). Other notions of "minimal change" exist.

  6. **Commutativity (Order Invariance)**  
     - **Motivation**: The order of receiving two pieces of evidence should not affect the final posterior. Rationality requires path-independence.  
     - **Verdict**: **Non-negotiable**. Order-dependence is arbitrary and exploitable.

  7. **Idempotence (Repeated Evidence)**  
     - **Motivation**: Receiving identical evidence repeatedly should not alter beliefs after the first update. Redundant information is irrelevant.  
     - **Verdict**: **Non-negotiable**. Avoids unnecessary belief drift.

  8. **Reversibility**  
     - **Motivation**: The prior must be recoverable from the posterior and the evidence (given the evidence structure). Supports "undoing" updates for counterfactual reasoning.  
     - **Verdict**: **Preference** (Reversibility camp). Not essential for forward updating.

  9. **Partition Invariance**  
     - **Motivation**: The update should not depend on whether the evidence is expressed over a coarse or fine partition of the same information. Beliefs should reflect content, not representation.  
     - **Verdict**: **Non-negotiable**. Violation implies representation-dependence, which is irrational.

  10. **Defined on Zero-Prior Events**  
      - **Motivation**: The rule must handle evidence assigning positive probability to events the prior rules out (\(P_\text{prior}(E_i) = 0\) but \(P_\text{evidence}(E_i) > 0\)). Real agents encounter novel information.  
      - **Verdict**: **Non-negotiable**. Rules failing here are brittle in learning scenarios.

  11. **Uniqueness and Self-Reference Handling**  
      - **Motivation**: The posterior is uniquely determined by the prior and evidence, even if the evidence concerns the agent's future/posterior beliefs (e.g., "You will believe \(H\) with prob 0.8"). Avoids ambiguity and regress.  
      - **Verdict**: **Non-negotiable**. Uniqueness is core to objectivity; self-reference arises in game theory and introspection.

  12. **Calibration Learning Compatibility**  
      - **Motivation**: The rule must accommodate learning an instrument's calibration from sequences of readings, where partitions may be coarse or fine. Real-world agents handle instrument drift.  
      - **Verdict**: **Non-negotiable**. A rule unusable in dynamic calibration is impractical.

  ### Conflicts Between Desiderata

  Several desiderata cannot hold simultaneously. Key conflicts:

  - **(3) No Certainty from Uncertainty vs. (10) Defined on Zero-Prior Events**:  
    If evidence assigns positive probability to a \(E_i\) with \(P_\text{prior}(E_i) = 0\), (10) requires \(P_\text{post}(E_i) > 0\), but (3) forbids becoming certain of anything new. Since \(P_\text{post}(E_i) > 0\) implies certainty of \(E_i\)'s possibility (where before it was 0), these conflict. **Resolution**: (3) must be relaxed for (10); agents can "learn possibility" from evidence.

  - **(4) Invariance of Conditional Probabilities vs. (10) Defined on Zero-Prior Events**:  
    (4) requires \(P_\text{post}(H \mid E_i) = P_\text{prior}(H \mid E_i)\), but if \(P_\text{prior}(E_i) = 0\), the prior conditional probability is undefined. (10) forces an update where (4) is inapplicable. **Resolution**: (4) cannot hold when (10) is satisfied for zero-prior events.

  - **(4) Invariance of Conditional Probabilities vs. (9) Partition Invariance**:  
    (4) fixes conditional probabilities given coarse cells. If the partition is refined (e.g., splitting \(E_i\) into \(E_{i1}, E_{i2}\)), (9) requires the same final posterior, but applying (4) to the coarse vs. fine partition yields different posteriors. **Resolution**: (4) and (9) conflict; (9) is non-negotiable, so (4) must be restricted to non-refined updates.

  - **(5) Minimal Revision vs. (6) Commutativity**:  
    KL-divergence minimization (for (5)) is order-invariant only if evidence constraints commute. For arbitrary sequences, order-dependence can arise. **Resolution**: (6) is non-negotiable, so (5) must use a commutative measure or be restricted.

  - **(8) Reversibility vs. (10) Defined on Zero-Prior Events**:  
    If evidence forces \(P_\text{post}(E_i) > 0\) from \(P_\text{prior}(E_i) = 0\), the prior cannot be recovered from the posterior and evidence alone—information about the impossibility of \(E_i\) is lost. **Resolution**: (8) fails under (10).

  ### Most Exclusionary Requirement

  **Requirement (10)** (Defined on Zero-Prior Events) excludes the most candidate rules.  
  - **Why**: Rules like **Jeffrey conditionalization** assume \(P_\text{prior}(E_i) > 0\) for all evidence cells \(E_i\), violating (10). Similarly, **standard conditionalization** fails. Rules that accommodate (10) (e.g., **KL-minimization with constraint relaxation** or **radical probabilism**) must handle non-absolute evidence without undefined conditionals, conflicting with (3), (4), and (8). This forces major design trade-offs.

  ### Summary of Verdicts
  | Desideratum                          | Non-Negotiable | Preference |
  |--------------------------------------|----------------|------------|
  | (1) Agreement with certain evidence  | ✓             |            |
  | (2) Posterior is probability         | ✓             |            |
  | (3) No certainty from uncertainty    | ✓             |            |
  | (4) Invariance within cells          |               | ✓ (Jeffrey)|
  | (5) Minimal revision                 |               | ✓ (Info)   |
  | (6) Commutativity                    | ✓             |            |
  | (7) Idempotence                      | ✓             |            |
  | (8) Reversibility                    |               | ✓ (Rev)    |
  | (9) Partition invariance             | ✓             |            |
  | (10) Defined on zero-prior events    | ✓             |            |
  | (11) Uniqueness and self-reference   | ✓             |            |
  | (12) Calibration learning            | ✓             |            |

  **Key**: "Jeffrey" = Jeffrey conditionalization camp; "Info" = Information-theoretic camp; "Rev" = Reversibility camp.

  No rule satisfies all desiderata simultaneously due to conflicts. A viable account must prioritize non-negotiables (e.g., (1), (2), (3), (6), (7), (9), (10), (11), (12)) and make explicit trade-offs for preferences. The central tension is handling novel possibilities (10) while preserving core rationality.
