answer: |-
  The paper avalanche on Lotte’s desk smelled of bureaucracy and damp wool – the monthly public health reports from the districts. Her fingers, stained faintly blue from the stencil ink, traced columns of numbers: typhoid cases, vaccination rates, infant mortality. Beside her, the clean, silent logic of the Institute’s finished panels stood in stark rebuke. A hundred identical, sharp-lined figures marching across a board represented a hundred lives saved by sanitation; a cluster of tiny, identical cradle symbols denoted infant deaths. No words. Only the pure, democratic language of Isotype, perfected.

  Manfred, the Institute’s Director, moved through the workroom like a curator in a temple. His gaze swept over the transformers' desks, not with suspicion, but serene conviction. "Clarity," he murmured, pausing by Lotte’s chaotic pile. "The eye must grasp the truth instantly, Lotte. No room for misinterpretation. The picture carries the whole weight." He tapped a finished panel showing chimney emissions declining – more small factory icons this year, fewer last year. Simple. Unambiguous. He believed, utterly, that what couldn’t be pictured wasn’t knowledge, merely noise. Words obscured; pictures revealed.

  Lotte nodded, the dutiful transformer. She pulled the next report. District Seven. Vaccination drive: Measles. The numbers were good. Very good. Cases: **0**. She chewed her lip. Zero. How do you draw *absence*? A blank space? But a blank space on their panels signaled 'data missing', not 'nonexistent'. She sketched a tiny syringe figure. One syringe? But one syringe meant *one* vaccination, not *no* cases. A hundred syringes? False. A field of syringes implying mass vaccination might suggest the disease was rampant, requiring such effort. She stared at the void the number represented. The report’s footnote offered the verbal crutch: "*No reported cases this month, attributed to successful immunization campaign.*" Forbidden text. She wrote "**0 cases**" on a scrap, pushed it aside, and drew a single syringe figure standing alone on an otherwise empty field, hoping the context of the surrounding panels might imply success. It felt like a guess, not a truth.

  Next report. Household survey. **Average household size: 2.4 children.** Lotte sighed. Fractions. Decimals. The core rule pulsed in her mind: *Show more by drawing more identical figures. Never distort the figure itself.* So, not one large child and one small child. But 2.4? How many figures? Two children and... a fraction of a third? Impossible. She could draw two whole child figures and a third figure cut off at the knees? Grotesque. Unthinkable. She sketched three whole child figures, knowing it overstated the average. Or two figures? Understated. The truth of the *average* – that slippery, abstract calculation – resisted the concrete language of icons. The scrap of paper beside her now held "**avg. 2.4 children**". It looked lonely. Wrong.

  The weight of the unsaid began to press. She unearthed a report on the recent polio vaccination program. Triumphant language: "**Estimated 400 lives saved based on projected mortality rates without intervention.**" *Estimated. Projected. Without.* Lotte felt a familiar frustration tighten her shoulders. The lives *not* lost. The *counterfactual*. How do you draw a ghost? How do you depict the terrible shadow of a future that *didn't* happen? She could show 400 small grave markers? But that implied 400 actual deaths, which hadn't occurred. Show 400 healthy figures? But that implied the vaccine *created* 400 lives, not *saved* them from an unseen threat. The sheer, vital *meaning* of "saved" – the comparison, the implied horror averted – was locked in verbal chains. She couldn't break it free into pictures. She jotted "**400 saved? (ghosts)**" on her scrap. The question mark felt like heresy.

  Later, comparing water quality reports from two towns, she hit another wall. Town A: "**Lead levels: Below detectable threshold. (Tested monthly)**". Town B: "**No lead testing conducted this quarter.**" The stark difference in *meaning* screamed at her. Yet, visually? If she showed both towns with the same, clean water droplet icon, it suggested equivalence. If she showed Town B with a question mark over the droplet... Manfred’s rule echoed: *No symbols for uncertainty. The picture states a fact, or it states nothing.* Showing a polluted droplet for Town B would be a lie. Showing nothing implied irrelevance. The crucial distinction – between confirmed safety and untested ignorance – was purely linguistic. She wrote "**A: Safe (tested). B: ? (untested)**" beneath the two potential droplet icons she’d sketched. The words felt like a lifeline thrown across a conceptual chasm.

  One afternoon, wrestling with tuberculosis incidence rates across districts, the statistician appended a note: "**The observed difference between District 5 and District 12 falls within the margin of error.**" *Margin of error.* The inherent fuzziness of the data. The space where chance lived. How could she depict that? Shimmering edges on the district icons? Faint, overlapping figures? It would look like a printing error, not a profound statistical truth. To draw District 5 with significantly fewer sick-bed icons than District 12 would be to misrepresent the fundamental uncertainty. The picture would claim a clarity the data didn’t possess. She drew two sets of sick-bed icons, nearly identical in number, then stared at them. They looked definitively *the same*. But the report said they *might* be meaningfully different, just… probably not. The nuance evaporated. "**Diff? Maybe noise**" joined the growing lexicon on her scrap paper.

  The forbidden notes accumulated. A small, battered notebook, hidden beneath a stack of stencil sheets, began to fill. Not drafts, not sketches. Just words. Phrases. The discarded meanings. "Zero ≠ missing." "Avg. ≠ whole people." "Saved lives = invisible." "Untested ≠ safe." "Difference? Maybe nothing." Each entry felt like a tiny act of defiance, a whispered secret in a temple of silence. She wasn’t arguing against the pictures; they were powerful, clear. But cleaning the data for visual consumption felt less like polishing and more like amputation. The messy, qualifying, uncertain, *verbal* flesh was being stripped away, leaving only the clean, silent bones. Sometimes the bones told the essential truth. Sometimes, she feared, they told a different story altogether.

  Manfred reviewed her polio panel. She’d settled on showing a large, unified crowd figure labeled "VACCINATED" (a permitted category label, not explanatory text) next to a much smaller cluster of sick-bed icons labeled "CASES". He nodded approval. "Strong. Immediate. The contrast speaks volumes." He didn’t see the ghosts of the 400. He saw the visible victory. To him, the unspoken complexity wasn't omitted; it was purified away, leaving the core visual fact: vaccination = fewer cases. For him, that *was* the whole truth the public needed.

  Lotte looked at her panel, then down at her hidden notebook, open to "**400 saved? (ghosts)**". The stark figures on the board were elegant, undeniable. The words in her notebook were clumsy, uncertain. Yet the words held the weight of the lives flickering in that conditional tense – the *what might have been*. The picture showed the surface. The words, however imperfectly, pointed towards the depths.

  That evening, as the workroom emptied, the silence of the finished panels felt profound. Not peaceful, but heavy. A visual utopia built on enforced quiet. Lotte opened her notebook to a fresh page. Her hand hovered. The report on the top of tomorrow’s pile concerned infant formula safety testing. Preliminary findings showed no adverse effects… *in the limited sample size tested so far*. She knew the phrase "**statistical power insufficient to rule out rare events**" would likely appear in the footnotes. Undrawable. Meaningful.

  Her pencil touched the paper. Not sketching figures this time. Just forming letters, small and cramped in the lamplight: "**Maybe safe. Not sure yet.**"

  The silence of the Institute pressed in, thick with the absence of everything that couldn’t be pictured. Lotte kept writing.
