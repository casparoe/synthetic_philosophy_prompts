prompt: |-
  Ok, novelist here, and I'm about 200 pages into a book whose whole plot turns on whether a character's loyalty is real when she never gets a chance to show it. A philosopher friend handed me the argument below after a fight we had about it; I've tidied it up but the bones are hers. Take the role of someone who works on dispositions for a living, and brainstorm before you commit — I want the real thing, not a textbook survey.

  (1) "x is disposed to M when C" is true only if "if x were in C, x would M" is true. (2) You can always bolt an interfering factor onto a case: my protagonist's smoke alarm is disposed to shriek when there's smoke, but the landlord has wired it to cut its own power the moment it smells any; my neighbours key is disposed to open her door, but she's had a lock fitted that seizes up whenever the correct key goes in; and a wine glass is fragile even wrapped in a towel, though wrapped in a towel it won't shatter when I knock it over. (3) A counterfactual like "if x were in C, x would M" is true only if x Ms however it happens to be in C, interfering factors and all. (4) So for any disposition ascription there is some way of being in C in which the thing doesn't M. (5) So no such counterfactual is ever true. (6) So by (1) no disposition ascription is ever true — the alarm isn't disposed to shriek, she isn't loyal, and the same move shows nothing causes anything. (7) But "this glass is fragile" is about as true as a sentence gets.

  So which step do I cut, and why did it look fine until I cut it? I'd sell my car before I gave up (1) or (7) — if dispositions aren't grounded in how things would go, "she's loyal" is just a compliment — but if the honest answer is that I have to lose one of them, tell me what that costs, and what each of the other candidates would charge me instead.
reasoning: |-
  Okay, the user is a novelist grappling with a philosophical problem about dispositions and counterfactuals. They're 200 pages into a book where a character's loyalty is pivotal, but the character never gets to demonstrate it. Their philosopher friend gave them this argument that seems to undermine the very concept of dispositions. 

  Hmm, the core tension is between the intuitive truth of dispositional claims ("the glass is fragile") and the logical conclusion that no such claims can ever be true because of interfering factors. The user is emotionally invested in premises (1) and (7) - they need dispositions to be grounded in real possibilities, not just polite fictions. 

  Let me unpack the argument step by step. Premise (1) seems solid - dispositions must connect to what would happen. Premise (2) is observably true; we can always imagine defeaters. Premise (3) is where it gets sneaky - it demands that the disposition manifests in every possible scenario, even absurdly modified ones. That's the hidden knife. 

  Ah! The user's metaphor about "bolting on" interferences is perfect. The philosopher friend has quietly smuggled in an impossible standard: that fragility must survive even when we've deliberately crippled the manifestation mechanism. That's like saying "this car can't drive" because we're testing it with the engine removed. 

  For the novelist's purpose, what matters is the character's intrinsic loyalty - how she'd act in normal crisis situations, not in some contrived scenario where loyalty is physically impossible. The solution is to reject premise (3)'s demand for universal robustness. 

  I should emphasize how this serves their story. By accepting that dispositions are relative to normal conditions, they can preserve the tension around the character's loyalty without falling into philosophical nihilism. The cost is accepting that "loyal" isn't an absolute guarantee - but that's truer to human nature anyway. 

  The user might worry this makes dispositions subjective. Not really - we have shared understandings of "normal circumstances" for smoke alarms, wine glasses, and yes, human virtues. Their philosopher friend's move only seems plausible because she's ignoring that context. 

  ...And I must remember not to lecture. They want the bone-clean logic, not a survey. The key insight is that premise (3) is self-sabotaging - it makes dispositions impossible by definition. Once that's clear, the rest crumbles.
answer: |-
  I work on dispositions professionally, and your philosopher friend has built a beautiful trap. **Cut premise (3).** It smuggles in an impossible standard that destroys the very concept it tries to analyze. Here’s why, step by step—without jargon:

  ### The Core Flaw: Premise (3) is Self-Defeating
  - **(3) claims**: For "if X were in C, X would M" to be true, X must manifest M **no matter how** C happens—*including scenarios where you’ve rigged C to prevent M*.
  - **The problem**: This demands that dispositions work **even when their enabling conditions are destroyed**. That’s like saying:
    - A match is only truly flammable if it would light **while submerged in water**.
    - A calculator is only disposed to add 2+2 if it outputs "4" **after you’ve removed its circuit board**.
  - **(3) makes dispositions logically impossible by definition**. It conflates "how things would go **under normal conditions**" with "how things would go **under any conceivable sabotage**".

  ### Why Premise (3) *Seemed* Fine (Until You Cut It)
  - It borrows plausibility from **everyday examples** (your smoke alarm, key, wine glass). We *can* imagine defeaters! But note:
    - **In practice**, we *always* hold dispositions relative to **implicit background conditions** ("unless the alarm is tampered with," "unless the glass is padded").
    - Premise (3) strips away this context, pretending dispositions must be **absolute**. That’s a category error.

  ### What You Keep & What It Costs
  | Premise | Why Keep It? | Cost (and Mitigation) |
  |---------|--------------|-----------------------|
  | **(1)**: Dispositions require counterfactuals | Essential for grounding "loyalty" in reality. Without (1), dispositions become empty labels (e.g., "loyal" = socially approved vibes). | **Minimal**. You accept that dispositions are *fragile*—they can be masked or finked. But that’s true to life: loyalty *can* be overridden by brainwashing, extreme duress, etc. |
  | **(7)**: "Fragile" is true | Non-negotiable. Denying (7) implodes language, science, and ethics. | **None**. Keeping (7) forces us to reject (3)—which we’ve done. |

  ### The Alternative Cuts (and Why They’re Worse)
  - **Cut (1)**: You save dispositions but gut their meaning. "She’s loyal" becomes a *brute fact* with no connection to behavior. **Cost**: Your plot loses tension. If loyalty isn’t about what she *would do*, why doubt it?
  - **Cut (7)**: Nihilism. Nothing is fragile, nothing causes anything. **Cost**: Your novel’s world (and ours) becomes incoherent.
  - **Cut (2)**: Deny that defeaters exist? But they *do*—we see them daily. **Cost**: Naive realism. Your characters would feel flat, ignoring life’s complexities.

  ### The Solution: Loyalty in a Sabotage-Prone World
  Modify your definition:  
  **"X is disposed to M when C" is true if "if X were in C *under normal conditions*, X would M" is true.**  

  - **"Normal conditions"** = whatever allows X’s intrinsic properties to operate (e.g., no tampering, no neurological sabotage).  
  - **For your character**: Her loyalty is real if, in a *non-rigged* crisis—where her psychology can function—she’d stand firm.  
  - **The tension**: Others doubt her *because* they imagine defeaters ("What if she’s brainwashed?"). But that’s skepticism, not metaphysics.

  ### Why This Saves Your Novel
  - **Loyalty remains a live question**: It’s not "proven" until tested, but its *reality* doesn’t require a test. It hinges on her intrinsic nature + normal circumstances.  
  - **Philosophical depth**: The gap between *having* a disposition and *manifesting* it mirrors human uncertainty. We judge others based on fragmented evidence—just like your readers will judge this character.  

  **Final Verdict**: Premise (3) is the rot in the argument. Cut it, and dispositions—like fragility, causation, and loyalty—survive as real, context-sensitive properties of the world. Your protagonist’s loyalty can be authentic even if the narrative never "proves" it. That’s not a cop-out; it’s the human condition.  

  *(P.S. Your friend’s argument is a version of "finkish dispositions." The solution—holding fixed intrinsic properties—is standard in metaphysics. But you’ve framed it better than most journals.)*
