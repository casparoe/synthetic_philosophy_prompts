answer: |-
  Here's a structured set of desiderata for any adequate theory determining "which summary to act on" in Simpson's paradox scenarios, grounded in cases and addressing your specific queries. Requirements are categorised, with conflicts flagged. British English throughout.

  ---

  ### **Core Desiderata for a Theory of Summary Trustworthiness**

  #### **Non-Negotiable Requirements**  
  *(Failure invalidates the theory)*  

  1. **Requirement: Temporal Precedence (No Post-Treatment Conditioning)**  
     - **Case:** Hospital recovery study (e.g., treatment A vs. B). Patients admitted to ICU (severe) or general ward (mild) *after* treatment. Pooled data shows treatment A superior, but within each ward, B is better.  
     - **Rationale:** Conditioning on post-treatment variables (like ward admission) introduces bias. ICU admission is *caused by* the treatment's initial effect. Acting on subgroup summaries here misleads.  
     - **Obligation:** Theory must reject conditioning on variables affected by treatment.  

  2. **Requirement: Measurement Sensitivity**  
     - **Case:** Drug efficacy study where pooled risk difference (RD) favours Drug X, but subgroup RDs favour Drug Y. Yet, odds ratios (ORs) are consistent across subgroups and align with pooled RD.  
     - **Rationale:** Effect measures (RD, OR, RR) are non-equivalent. A "reversal" under RD may not occur under OR.  
     - **Obligation:** Theory must specify which effect measure is relevant for decision-making or declare paradox resolution measure-dependent.  

  3. **Requirement: Causal Coherence**  
     - **Case:** Berkeley gender bias lawsuit (1973). Pooled data shows lower admission rates for women, but within departments, women have equal/higher rates. Departments are pre-treatment confounders (women applied to more competitive fields).  
     - **Rationale:** The "correct" summary (department-stratified) reflects the causal structure: application choices (confounder) affect both gender and admission.  
     - **Obligation:** Theory must prioritise summaries adjusted for confounders (pre-treatment common causes).  

  ---

  #### **Debatable Requirements**  
  *(Subject to philosophical/camp preferences)*  

  4. **Requirement: Paradox Explanation vs. Dissolution**  
     - **Case:** Classic kidney stone treatment (small/large stones). Pooled data favours Treatment A; subgroups favour B.  
     - **Rationale:** Some theories *dissolve* paradox (e.g., "no paradox under correct causal model") without explaining *why* it fools intuition. Others *explain* it (e.g., "ignoring confounders distorts associations").  
     - **Preference:** "Explanation" camps demand theories clarify cognitive pitfalls; "dissolution" camps deem this unnecessary.  

  5. **Requirement: Individual-Level Grounding**  
     - **Case:** Marketing campaign (email vs. post). Pooled response rate favours email, but within age groups, post wins. No individual is "paradoxed" – summaries conflict, not individual outcomes.  
     - **Rationale:** The paradox is aggregative. Must a theory reference counterfactual individual outcomes (e.g., potential outcomes framework), or can it remain purely population-level?  
     - **Preference:** Causal inference camps insist on individual-level semantics; descriptive stats camps may reject this as overreach.  

  ---

  #### **Inherent Conflicts**  
  *(Mutually unsatisfiable requirements)*  

  6. **Conflict: Determinism vs. Table-Only Purity**  
     - **Requirement 7 (Determinism):** Theory must return a determinate verdict ("act on pooled" or "act on stratified") for *any* contingency table.  
     - **Requirement 8 (Purity):** Theory must rely *only* on the numerical data (pooled + subgroup tables), with no external assumptions.  
     - **Why Conflict?**  
       - **Case:** A table with two subgroups (e.g., men/women) where:  
         - Pooled RD: +5% (favours Treatment)  
         - Men: RD +10%, Women: RD +3%  
         - No reversal, but which summary to act on?  
       - **Problem:** Without causal context (e.g., is gender a confounder?), Requirement 8 cannot resolve this. Requirement 7 forces arbitrary choice or smuggles in assumptions (violating Requirement 8).  
     - **Resolution:** Impossible. All adequate theories *must* incorporate causal assumptions (violating Requirement 8) to satisfy Requirement 7.  

  ---

  ### **How Common Approaches Fare**  
  | **Approach**                          | **Temporal Precedence** | **Measurement Sensitivity** | **Causal Coherence** | **Conflict Resolution** |  
  |---------------------------------------|-------------------------|----------------------------|----------------------|------------------------|  
  | **Condition on all pre-treatment**    | ✅                      | ❌ (Assumes RD/RR focus)    | ✅                   | ❌ (Fails Requirement 8) |  
  | **Condition on nothing**              | ❌ (Ignores time)       | ❌                         | ❌                   | ❌ (Fails Requirements 1,3) |  
  | **Condition on recorded variables**   | ⚠️ (If includes post-treatment) | ❌                         | ⚠️ (Arbitrary)       | ❌ (Fails Requirement 8) |  

  - **Best performer:** "Condition on pre-treatment confounders" (e.g., causal diagrams) satisfies Requirements 1,3,7 but violates Requirement 8 (needs assumptions) and struggles with Requirement 5 (effect measure choice is external).  

  ---

  ### **What Would Change My Mind & Where I Could Be Wrong**  
  - **Mind-changing consideration:** Proof that *all* decision-relevant paradoxes can be resolved purely statistically (e.g., new mathematical criterion using only table data) without causal assumptions. This seems unlikely given the conflict in Requirement 8.  
  - **Likely flaw in this list:** Overemphasising temporal precedence may underplay cases where *anticipation* of post-treatment events (e.g., patient frailty influencing ICU admission *risk*) justifies conditioning. However, this still requires causal modelling.  
  - **Blind spot:** Requirement 6 (individual-level grounding). If the group *is* the unit of interest (e.g., allocating vaccines to regions), individual-level semantics may be irrelevant. The list leans toward individualised decision-making.  

  ---

  ### **Summary for Your Session**  
  The non-negotiable core is: **respect temporal order, acknowledge effect-measure sensitivity, and adjust for confounders**. The irreconcilable tension is between **determinism** (always give an answer) and **purity** (no external assumptions). No theory satisfies both—causal frameworks (e.g., do-calculus) sacrifice purity; descriptive stats sacrifice determinism. Simpson's paradox isn't "solved" by statistics alone; it demands causal reasoning. Start here, and the examples will crystallise why.
