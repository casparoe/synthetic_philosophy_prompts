prompt: |-
  I'm putting together a reading-group session on Simpson's paradox and I'd rather start from the spec than from the examples. Write me the desiderata any adequate theory of "which way the data goes" has to meet — an account that tells me, for a given pooled table plus the subpopulation tables behind it, which summary I'm entitled to act on. I want each requirement with the case behind it. In particular: what it has to do about partitions defined by things that happen after the treatment rather than before it; whether it has to explain why the reversal looks paradoxical in the first place or just dissolve the appearance; what it owes to the fact that a reversal can show up under one way of measuring the effect and vanish under another (risk differences versus odds ratios, say); and whether it has to say anything about individuals at all, given that the reversal is between summaries and not between people. Mark which requirements are non-negotiable and which are just preferences of one camp, and flag any pair that can't be satisfied together — I suspect theres at least one, something like "returns a determinate verdict for every table" versus "assumes nothing beyond the numbers in the table". That's the part I most want to see. Then say briefly how the usual families of answers (condition on everything measured before the treatment, condition on nothing, condition on whatever happens to have been recorded) fare against the list. Finish by telling me which consideration would change your mind about the list you've given, and where your own reasoning is most likely to be wrong. British English please.
