answer: |-
  Below is a complete design for your classroom game, "The Titan's Ladder," simulating a positional arms race with shared risk. It emphasizes visceral learning through competition, negotiation, and structural solutions while minimizing prep time and cost. The game uses points (no real money), runs in 80 minutes, and requires only basic materials.

  ---

  ### **Game Title**: The Titan's Ladder  
  *Theme: Competing corporations ("Titans") bid for market rank in a volatile industry. Bids drain resources but don’t guarantee gains. Risk escalates for all, and harm spills over to "outsiders" (represented abstractly). One team is legally constrained.*

  ---

  ### **Learning Goals**  
  - **Visceral experience** of positional competition (pay more to stay in place).  
  - **Shared correlated risk** (individual rationality → collective disaster).  
  - **Selection pressure** on constrained actors (not character-driven).  
  - **Fragility of agreements** and costs of structural solutions.  

  ---

  ### **Materials**  
  - **Teams**: 6 teams of 3 students each (adjustable for 18 students).  
  - **Bidding tokens**: Poker chips (100+), buttons, or torn paper. **No real money.**  
    - *Alternative*: Use a shared Google Sheet for bids if physical materials are limited.  
  - **Scoreboard**: Whiteboard or projector to display rankings/points.  
  - **Risk Pool Die**: A 12-sided die (d12) for shared risk checks.  
  - **Team Charters**: Cards with rules. One team gets a "No-Bid Charter" (see below).  
  - **Agreement Paper**: For negotiation phase (students can write contracts).  
  - **Timer**: For phases.  

  ---

  ### **Setup (5 min)**  
  1. **Arrange chairs** into 6 clusters (one per team).  
  2. **Assign teams**: Hand each team a charter card:  
     - 5 teams: *"Goal: Maximize your points. Each round, bid tokens to climb the rankings."*  
     - 1 team (e.g., Team 6): *"No-Bid Charter: You cannot bid tokens. You start with +10 points as compensation."*  
  3. **Distribute tokens**: Each team starts with 50 tokens (representing capital).  
  4. **Explain rules briefly** (no theory, just mechanics):  
     - "You are corporate Titans. Each round, secretly bid tokens to improve your rank. Higher rank = more points. But every bid adds risk for everyone. If the risk pool hits a threshold, disaster strikes."  
     - "After 4 rounds, you can negotiate. Later, you can merge or appoint a referee."  
     - "Goal: Finish with the most points."  

  ---

  ### **Game Rules & Payoff Scheme**  
  - **Points**: Start at 0. Points come from **rank rewards** (not tokens). Tokens are *only* for bidding.  
  - **Rankings**: Based solely on that round’s bid. Highest bid = Rank 1. Ties broken by current points.  
  - **Rank Rewards** (awarded post-bid):  
    | Rank | 1 | 2 | 3 | 4 | 5 | 6 |  
    |---|---|---|---|---|---|---|  
    | Pts  | 10| 8 | 6 | 4 | 2 | 0 |  
  - **Net Gain/Loss**: `Reward - Bid` (e.g., Bid 5 tokens for Rank 2: 8 - 5 = +3 points).  
  - **Shared Risk Pool**: Total tokens bid by all teams *that round* = "Risk Units."  
    - Roll d12 after rewards. **Disaster if roll ≤ Risk Units** (e.g., 10 Risk Units → 10/12 chance of disaster).  
    - **Disaster Effect**: All teams lose 15 points. *"News breaks: Industry collapse! Fines, layoffs, and public backlash hit all Titans. The displaced workers (not in this room) suffer most."*  
  - **Constrained Team (No-Bid)**: Bids 0 always. Receives no reward (Rank 6) but avoids bid costs. Still hit by disasters.  

  ---

  ### **Timeline (80 min Total)**  
  | Phase             | Time  | Key Actions                                                                                                | Instructor Role                                                                 |  
  |-------------------|-------|----------------------------------------------------------------------------------------------------------|--------------------------------------------------------------------------------|  
  | **Silent Bidding (Rounds 1-4)** | 20 min | 1. Teams secretly bid tokens (0–any amount).<br>2. Bids revealed. Rankings/rewards calculated.<br>3. Risk Pool: Roll d12 for disaster.<br>*Repeat x4 rounds.* | Timekeeper. Announce rankings/disasters neutrally. Track points publicly. |  
  | **Negotiation Phase**     | 10 min | Teams talk freely. Can make deals (e.g., "We won’t bid if you don’t"). Signed agreements allowed.              | Silent observer. Take notes on deal-making.                                  |  
  | **Binding Rounds 5-6**    | 10 min | 2 more rounds of bidding. Agreements often break → show enforcement problems.                            | Enforce silence during bids. Highlight broken deals.                          |  
  | **Structural Solutions**  | 15 min | Teams can:<br>- **Merge** (2 teams combine tokens/points, bid as one).<br>- **Appoint Referee** (instructor sets all bids).<br>- **Buy Out** (team pays another to exit; exited team keeps points but no longer plays). | Facilitate. If no solution, continue bidding.                              |  
  | **Final Rounds 7-8**      | 10 min | Play 2 rounds under new structure (if any).                                                              | Adjust rules for mergers/referees.                                          |  
  | **Debrief**               | 25 min | Link game moments to theory. Introduce vocabulary.                                                        | Guide discussion (see below).                                               |  

  ---

  ### **Predicted Problems & Solutions**  
  1. **A student refuses to bid**:  
     - *Why*: They see bidding as irrational (e.g., "Why pay to stay in place?").  
     - *Solution*: **Don’t intervene**. This mirrors real actors who resist races. In debrief, contrast them with the constrained team: "Did non-bidders gain? Why might they still be 'selected against' in the long run?"  

  2. **Disaster doesn’t trigger early**:  
     - *Why*: Low initial bids → low risk pool.  
     - *Solution*: In later rounds, bids (and risk) will surge. If still no disaster, emphasize near-misses: "The roll was 11, and you had 11 Risk Units. One token decided fate."  

  3. **Constrained team disengages**:  
     - *Why*: They can’t play the "fun" bidding part.  
     - *Solution*: Give them a observer role: "Track how many points others waste on bids."  

  4. **Teams collude perfectly**:  
     - *Why*: Students might enforce a "no-bid pact."  
     - *Solution*: Add a hidden incentive: Privately tell one team, "If you’re Rank 1 in any round, get +5 bonus points." This seeds betrayal.  

  5. **Time overrun**:  
     - *Solution*: Shorten Round 7-8 to 1 round or skip Structural Solutions if needed.  

  ---

  ### **What the Game Can’t Replicate**  
  1. **Invisible/Harmless Victims**:  
     - *Limitation*: Disasters hurt players directly; "outsiders" (e.g., workers, public) are abstract. Students won’t *feel* their suffering.  
     - *Fix in Debrief*: "In reality, the displaced workers would be in this room. How would that change bids? What if disasters hit in 20 years?"  

  2. **Complex Interdependence**:  
     - *Limitation*: Real races (e.g., tax havens, AI arms races) involve layers of actors (governments, NGOs). The game simplifies to 6 teams.  
     - *Fix*: Use debrief to add nuance: "What if ‘outsiders’ could protest? What if risks were uncertain?"  

  3. **Delayed Consequences**:  
     - *Limitation*: Disasters are immediate. No long-term planning.  
     - *Fix*: "Imagine if bids today caused disaster in Round 8. Would you bid less?"  

  ---

  ### **Debrief (25 min)**  
  **Link game moments to theory**:  
  | Game Moment              | Concept                          | Vocabulary to Introduce                  |  
  |--------------------------|----------------------------------|------------------------------------------|  
  | Bidding but rank unchanged | Positional competition         | "Race to the bottom," "zero-sum status" |  
  | Disaster hits all teams  | Shared correlated risk         | "Systemic risk," "externalities"        |  
  | Constrained team declines | Selection pressure            | "Competitive exclusion," "market exit"  |  
  | Agreements break         | Fragility of cooperation      | "Prisoner’s dilemma," "enforcement"     |  
  | Mergers/referees form    | Structural solutions          | "Cartels," "regulation," "governance"   |  
  | Harm to "workers"        | Externalized costs            | "Social costs," "accountability gaps"   |  

  **Discussion Prompts**:  
  - "When did bidding feel irrational? Why did you keep doing it?"  
  - "Team 6 couldn’t bid. Was this fair? Did the game ‘select against’ them?"  
  - "Why did agreements fail? What would make them stick?"  
  - "Did mergers/referees help? What did you give up?"  
  - **Final Connection**: "This is why real races (e.g., deep-sea mining, tax cuts) escalate. Gains are private, losses are public. We’ll put names to this next class."  

  ---

  ### **Why This Works**  
  - **Gut-level lesson**: Bidding wars create frustration ("We paid more but didn’t move!"). Disasters feel unfair ("Why did I pay for *their* risk?").  
  - **Constrained team**: Shows structural exclusion, not malice.  
  - **Low cost**: Tokens are free; points are abstract.  
  - **Debrief maps cleanly**: Each phase feeds into a core concept.  

  **First Run Tip**: Run with colleagues first to tweak timings. Embrace chaos—broken deals and rebellions make the debrief richer!
