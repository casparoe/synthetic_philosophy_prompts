  Then tackle the conceptual distinctions: computation vs realization, describability vs being a computer, and system-intrinsic vs use-based computation. The state individuation problem is crucial - how physical states map to computational states without arbitrariness.

  The brain application requires special care. A good theory should make the claim substantive: neither obviously true (like pancomputationalism) nor obviously false (like dualism). I suspect the objectivity requirement will conflict most with avoiding triviality, as the user suspects.

  I should note where theories fail: mapping accounts allow too many implementations, causal accounts struggle with continuous systems, semantic accounts introduce observer dependence. The user wants the criteria first, so I'll save detailed comparisons for later unless asked.

