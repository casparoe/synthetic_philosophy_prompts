answer: |-
  Here is a set of desiderata for a theory of computational implementation, crafted to meet your requirements. Each item includes the underlying consideration, key cases it must address, and critical distinctions it must preserve, with the brain as the focal application. Tensions and exclusions are flagged explicitly.

  ---

  ### **Core Desiderata for a Theory of Computational Implementation**
  *(With Key Considerations and Cases)*

  1. **Non-Triviality (Non-Universality)**  
     *Consideration*: Avoid pancomputationalism (where every physical system implements every computation).  
     *Required cases*: An orbiting planet described by Newton’s laws must *not* compute its own trajectory. A rock must not implement WordStar simply because its microstates can be mapped to software states post hoc.  
     *Distinction*: Computing a function vs. merely instantiating its input-output pattern through physical laws.  
     *Brain application*: Ensures "the brain computes" is falsifiable, not true by definition.

  2. **Objectivity**  
     *Consideration*: Implementation must be a fact about the system, independent of external interpretation.  
     *Required cases*: A digital calculator computes addition even if no observer is present; a heart pacemaker’s control algorithm runs objectively.  
     *Distinction*: Computing vs. *being used to* compute (e.g., abacus beads compute only relative to a user).  
     *Brain application*: If cognition *is* computation, it must be intrinsic to neural processes.

  3. **Causal Structure Sensitivity**  
     *Consideration*: Computation requires physical states/transitions to *cause* outputs in a way mirroring the algorithm.  
     *Required cases*:  
     - A lookup table outputting correct answers *without internal state transitions* (e.g., a ROM chip) must **not** compute the algorithm—it merely instantiates the function.  
     - A CPU executing instructions step-by-step *does* compute.  
     *Distinction*: Computing a function (causal process) vs. realizing its input-output relation (static mapping).  
     *Brain application*: Rules out trivial "neural lookup table" accounts of cognition.

  4. **State Individuation**  
     *Consideration*: Physical systems lack intrinsic computational state boundaries; the theory must specify how states are carved.  
     *Required cases*:  
     - Continuous systems (e.g., analog computer, fluid dynamics) must be implementable without discretization.  
     - Discrete systems (e.g., digital circuits) must have states fixed by physical properties, not arbitrary labels.  
     *Distinction*: Physical state transitions (e.g., voltage changes) vs. computational state transitions (e.g., incrementing a counter).  
     *Brain application*: Must resolve whether neural spikes, firing rates, or population vectors define computational states.

  5. **Multiple Realizability & Observer Relativity**  
     *Consideration*: A system can compute different functions under different interpretations.  
     *Required cases*:  
     - A single physical system (e.g., an FPGA) can be interpreted as computing *f(x)* or *g(x)* depending on the mapping scheme.  
     - The same neural circuit could be seen as computing "face detection" or "curve optimization" under different formalisms.  
     *Distinction*: What a system *can* compute (observer-relative) vs. what it *does* compute (intrinsic).  
     *Brain application*: Allows for multiple algorithmic descriptions of neural processes without collapse into subjectivism.

  6. **Causal vs. Descriptive Mappings**  
     *Consideration*: Post-hoc mathematical mappings ≠ implementation.  
     *Required cases*: A galaxy’s orbital dynamics can be mapped to a Turing machine tape after the fact, but this does *not* imply it computes its orbits.  
     *Distinction*: Computational implementation vs. computational *description* of a system.  
     *Brain application*: Prevents neuroscientists from "discovering" arbitrary computations in brain activity patterns.

  7. **Continuity Compatibility**  
     *Consideration*: Computation is not inherently discrete.  
     *Required cases*: Analog computers (e.g., mechanical integrators) and continuous-time neural networks must qualify as computers.  
     *Distinction*: Discrete computation (Turing machines) vs. continuous computation (dynamical systems).  
     *Brain application*: Accommodates continuous aspects of neural processing (e.g., membrane potentials).

  ---

  ### **Key Tensions and Exclusions**
  - **Primary Tension**: **Objectivity (2)** vs. **Multiple Realizability (5)**.  
    If implementation is objective, observer-relative mappings cannot define computation. Yet if multiple computations can be implemented on the same hardware, objectivity appears threatened.  
    *Resolution*: A successful theory must ground implementation in *causal structure* (3) and *state individuation* (4), allowing observer relativity only for *which* computation is ascribed, not *whether* computation occurs.

  - **Most Exclusionary Requirement**: **Causal Structure Sensitivity (3)**.  
    This excludes:  
    - Simple *mapping accounts* (Putnam, Searle) that allow rocks to compute via arbitrary state assignments.  
    - *Semantic accounts* that prioritize representation over causal structure.  
    - *Behaviorist accounts* (e.g., lookup tables) that ignore internal processes.

  ---

  ### **How Major Theories Fare**
  *(Briefly Scored Against Desiderata)*  
  | **Theory**               | **Strengths**                  | **Fatal Weaknesses**               |  
  |--------------------------|--------------------------------|------------------------------------|  
  | **Simple Mapping**       | Handles multiple realizability (5). | Fails non-triviality (1), objectivity (2), causal structure (3). |  
  | **Causal/Mechanistic** (Piccinini) | Excels at objectivity (2), causal structure (3), non-triviality (1). | Struggles with continuity (7) and observer relativity (5). |  
  | **Semantic** (Fodor, Pylyshyn) | Aligns with cognition (brain app). | Requires representations, fails objectivity (2) if semantics are observer-dependent. |  
  | **Dynamical Systems**    | Handles continuity (7), state carving (4). | Often collapses computation with physical dynamics (6), risking triviality (1). |  

  ---

  ### **Conclusion for the Brain Question**
  A viable theory must anchor implementation in **non-arbitrary causal structure** (desiderata 3–4) while accommodating **observer-relative ascription** (5) without surrendering **objectivity** (2). If successful, "the brain computes" becomes substantive:  
  - **True**: If neural processes exhibit algorithmically structured causal transitions.  
  - **False**: If cognition relies on non-computational dynamics (e.g., continuous attractors with no state individuation) or if neural activity merely realizes input-output mappings without causal mediation.  

  The tension between objectivity and non-universality is indeed the crux: Only by requiring *specific causal organization* can a system compute one thing but not everything. This is where the brain’s claim to computation stands or falls.
