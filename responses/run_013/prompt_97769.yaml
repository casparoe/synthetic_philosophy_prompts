answer: |-
  Here are the core desiderata for legitimizing a randomly selected binding decision-body, prioritized and explained:

  1.  **Epistemic Legitimacy (Competence):** *Must deliver:* The body reliably produces decisions at least as competent (informed, reasoned, outcome-oriented) as the existing council on the matters it addresses. *Case:* Highly technical decisions (e.g., infrastructure engineering, complex budgeting). *Constraint:* The Jury Theorem assumes voter independence and competence; real deliberation risks groupthink or polarization, undermining this. *Distinction:* Cannot collapse legitimacy (right to decide) with competence (ability to decide well).

  2.  **Authorization & Scope Limitation:** *Must deliver:* A clear, democratically grounded mandate defining *what* decisions the body can legitimately initiate a vote on and *why*. *Case:* The Jury Analogy (legitimacy from specific mandate/task) vs. an open-ended power to force votes on *any* council decision (lacks inherent authorization). *Distinction:* Cannot collapse being a *descriptive sample* (mirrors population) with being *authorized* (empowered by consent/process). *Consideration:* Nobody consented to *this specific* assembly, even if descriptively perfect.

  3.  **Deliberative Quality Control:** *Must deliver:* Mechanisms ensuring genuine, balanced, informed deliberation among members, preventing domination or polarization. *Case:* Assembly hijacked by five loudest/ideological members, or research showing group polarization in homogeneous groups. *Distinction:* Cannot collapse deliberative quality (process) with consent (source of legitimacy). *Finding:* Deliberation *can* improve decisions but *requires* structure, diversity, facilitation, and balanced information to avoid pitfalls.

  4.  **Affected Interests & Representation:** *Must deliver:* Assurance that decisions account for the interests of those disproportionately affected, even if not proportionally represented in the sample. *Case:* A vote forcing a decision primarily impacting one neighborhood, where assembly members are drawn city-wide. *Distinction:* Cannot collapse statistical representation (descriptive) with substantive representation of affected interests. *Consideration:* Random selection ensures *ex ante* fairness but not *ex post* sensitivity to concentrated impacts.

  5.  **Institutional Stability vs. Freshness:** *Must deliver:* A design balancing the benefits of experience/continuity (for complex issues) with the anti-corruption/rotating perspective benefits of sortition. *Case:* A standing body (risks ossification, faction capture) vs. a one-off assembly (lacks institutional memory, may be less competent on complex issues). *Distinction:* Legitimacy sources differ – standing body may derive it from process/stability, one-off from specific mandate/freshness.

  **Hardest Pair to Satisfy Jointly:** **Epistemic Legitimacy (especially on technical issues) and Scope Limitation (open mandate to force votes on *any* council decision).** Guaranteeing competent lay decisions on highly variable, potentially technical topics conflicts with granting an unlimited mandate. Limiting scope (e.g., only on clearly "value-laden" or "community vision" issues) addresses competence but restricts the body's intended power.

  **The Requirement Doing the Most Work (and Knocking Out Views):** **Authorization & Scope Limitation.** Many otherwise plausible views (e.g., relying purely on descriptive representation, or assuming deliberation alone confers legitimacy) founder on the "consent of the governed" problem for a specific, powerful body. Why does *this* group of 150 strangers get to force a city-wide vote on *any* topic? Existing councils derive authority from elections; juries from a specific legal mandate. Without a clear democratic anchor defining *why* and *on what* this body acts (beyond being a sample), its legitimacy is fundamentally contested. This requirement forces the hardest justificatory work and eliminates theories that rely solely on statistical fairness or deliberative potential as sufficient for broad authority.
