  Hmm, they're quite precise about what they don't want - no clichéd AI consciousness tropes, no real-world references, and definitely no hand-waving of the philosophical difficulty. The core challenge is making tangible how tiny subjective experiences could combine into a unified mind without resorting to magic or dismissal. 

  Right, the premise involves a certification officer at an institute creating composite minds from micro-units. The twist comes when those units individually deny being part of a greater whole. Need to show at least two key aspects: behaviour/integration can't prove singularity of subject, and the ethical dilemma of parts surviving/extinguishing. 

