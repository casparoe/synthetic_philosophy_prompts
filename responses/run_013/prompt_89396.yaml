answer: |-
  ## Planning Note

  **Core Argument:** I will build the speech on Ruth's conviction that the most profound argument against capital punishment lies in what it **does to the state and society itself** – specifically, the creation of a permanent class of citizens tasked with "killing by appointment," and the fundamental moral question this poses about the polity that requires such a mechanism. This aligns with her belief, avoids the problematic (for this audience) comparison of suffering ("the argument from the condemned"), and sidesteps contested empirical claims about effects like brutalization or deterrence. It focuses on the structural and ethical corrosion she identified.

  **Arguments Set Aside:**
  1.  **The Condemned's Suffering:** Ruth herself saw this as a trap, inviting unproductive comparisons with victims' suffering. It risks alienating Delia Marsh and others touched by violent crime. The family's request to avoid the execution chamber details also precludes vivid descriptions of this perspective.
  2.  **Deterrence/Brutalization:** Ruth dismissed deterrence as weak and saw brutalization as an unprovable claim about societal effects. Including them would undermine the core philosophical argument she valued and introduce elements she considered less defensible.
  3.  **Religious Consolation:** Ruth was a firm atheist. While respecting the cousins' faith, the eulogy will not assert an afterlife. Comfort will come from her legacy, character, and impact on the living, consistent with her daughter's wishes.

  **Chief Risk:** The greatest risk is **failing to honor Ruth's fierce convictions while maintaining a tone that doesn't alienate or accuse those who disagreed with her**, particularly Delia Marsh and the cousins. Striking the wrong balance could make the argument feel like a political polemic delivered over her coffin, disrespecting the occasion and the diverse mourners. The other risk is sentimentality, which would alienate her professional colleagues.

  **Handling Sensitive Material:** The family has explicitly requested avoiding details of the execution chamber. I will strictly adhere to this, focusing instead on the *idea* of the state's machinery and the *existence* of the role she witnessed, without describing the act itself. The argument will be framed abstractly as central to Ruth's professional life and moral compass, not as a graphic indictment in this context.

  **Tone & Approach:** Ground the speech firmly in **Ruth's character** first: her clarity, consistency, integrity, and deep humanity. Present her core argument not as a political stance to be debated now, but as an expression of her profound belief about societal responsibility and the cost of maintaining certain powers. Focus on the *fact* of her witness role and commission work as evidence of her commitment, not the *content* of what she saw. Emphasize her ability to hold deep disagreement alongside deep respect and connection (exemplified by Delia). End on the enduring impact of her character and the challenge of her example, uniting the room in shared respect and loss.

  ---

  ## Eulogy for Ruth Abelman

  Friends, colleagues, family… we are here, gathered in this loss, because Ruth Abelman mattered. Deeply. To so many different people, in so many different ways. To speak about her is daunting, because she was a person of such formidable clarity, such unwavering conviction, and yet, such profound connection. I stand here at her daughter’s request, deeply aware that I speak *about* Ruth, not *for* her, and certainly not *as* her. I speak as someone who learned from her, who admired her fierce intellect and her even fiercer heart.

  Ruth lived a life defined by seeing clearly. She saw the complexities of human frailty and failure with unflinching eyes during her thirty years standing beside those the state accused. She saw the immense weight of the law, not as an abstract force, but as something that lands on real lives, in real courtrooms, with real consequences. And for the last twenty years, on the state commission, she saw further – she saw the machinery.

  That clarity wasn't cold. It was the foundation of her deep humanity. It compelled her to act. She understood that justice isn't a spectator sport. It demands engagement, often uncomfortable, frequently heartbreaking. She chose to stand in the places where the stakes were highest, where the system’s gears grind most heavily.

  Ruth’s clarity extended to her convictions about capital punishment. She believed the most critical argument wasn't found in comparing one person's suffering against another's. She knew that path was impossible, even disrespectful, for those carrying the unbearable weight of grief. Nor did she rest her case on shifting sands of statistics about deterrence, which she considered unreliable. Instead, Ruth fixed her gaze on something else entirely.

  She asked us to look at what it means for a society – *our* society – to hold, and to exercise, the power to deliberately end a human life. Not in the chaotic fury of a moment, but coldly, methodically, by appointment. She saw that maintaining this power requires something specific: it necessitates a permanent class of people – citizens, professionals – whose duty it becomes to prepare for, and to perform, that act. Judges, jailers, technicians, witnesses... a whole structure built around the scheduled extinguishing of a life.

  Ruth believed that the very existence of this structure, this standing readiness to kill in the state's name, forces a fundamental question upon the polity that maintains it. What does it say about us, who we are, that we believe we need such people? That we require this specific, terrible capability? She wasn't primarily arguing about effects on crime rates or even the condemned; she was arguing about the soul of the community itself. "One of them killed in a rage," she’d say with that piercing directness. "The rest of us kill by appointment." It was a statement about the nature of the act we sanctioned, the burden we placed on our fellow citizens, and the reflection it cast back on us all. This wasn't just policy for Ruth; it was a profound moral reckoning.

  And yet… Ruth understood that conviction alone isn't enough to live in the world. Her clarity didn't breed dogma, but rather a kind of fierce respect for the humanity of others, even – perhaps especially – those who saw the world entirely differently. She knew that building a just society, or even just navigating an unjust one, requires connection across deep divides. We see that embodied here today. Her unwavering opposition to the death penalty never blinded her to the reality of victims' pain, nor did it prevent her from forging bonds of genuine respect and affection. The fact that Delia Marsh sits here among us, that they shared meals and conversation for over a decade despite fundamental disagreement, speaks volumes about who Ruth was. She could hold space for profound dissent without compromising her own truth, without diminishing the other person. That is a rare and remarkable gift.

  To her daughter, her grandchildren, her family… Ruth was simply Ruth. Beloved. Present. Unshakeably herself. Her love wasn't conditional on agreement; it was as steadfast as her atheism. She offered the solid ground of her being. Her legacy to you isn't in grand pronouncements, but in the enduring echo of her character: her integrity, her honesty, her unwavering presence, her ability to love fiercely across any divide.

  To her colleagues… she was a beacon. A model of rigorous thought, unwavering principle, and tireless commitment to the messy, difficult work of justice within a flawed system. She demanded much, because she gave much.

  Ruth Abelman saw clearly. She acted courageously. She loved deeply. She challenged us – all of us – to look unflinchingly at the hard truths, to examine the machinery we build and the burdens we assign, and to never confuse the cold administration of power with true justice. She challenged us to hold our convictions with integrity, yet to never let them become walls that shut out the humanity of others.

  She is gone. The absence is immense. But the challenge of her life, the clarity of her vision, the depth of her connection – that endures. Let us carry that forward. Let us strive, in our own ways, with our own convictions and doubts, to live with the clarity, the courage, and the unwavering humanity that Ruth Abelman embodied. That is her enduring testament. That is how we honor her.
