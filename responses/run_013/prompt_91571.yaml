  **Research Proposal: The Rationality and Permissibility of Surrogate-Goal Defenses Against Acausal Threats**

  **1. Introduction and Problem Statement**

  An acausal threat is a strategic interaction in which one agent (the threatener) attempts to influence another (the threatened) by conditioning their behavior on the threatened agent's beliefs about what the threatener would do in certain counterfactual scenarios, but without any causal channel by which the threatener can commit to the threat or by which the threatened agent's response can affect the threatener. Such threats arise in contexts where the agents are separated by logical or metaphysical barriers (e.g., in debates about superintelligent AI, or in certain thought experiments in decision theory). The threatened party may consider adopting a "surrogate-goal defense": deliberately cultivating a new, genuine goal such that the outcome the threatener is threatening to bring about becomes a matter of indifference (or even desirable) to them. If the threatener knows this, the threat becomes ineffective because carrying it out would not compel compliance.

  The central question of this project is: 

  *Under what conditions, if any, is it both (a) rational (in the decision-theoretic sense) and (b) ethically permissible for an agent facing an acausal threat to adopt a surrogate goal as a defense?*

  We break this into two sub-questions:

  - **The Rationality Question**: Can an agent rationally adopt a surrogate goal in response to an acausal threat? We require that the adoption be stable (i.e., the agent does not later regret the adoption) and that it is not undermined by the agent's own knowledge of its defensive purpose. The challenge is to avoid triviality (if the distinction between genuine and feigned goals collapses) or impossibility (if genuine adoption is undermined by strategic reasoning).

  - **The Permissibility Question**: Is it ethically permissible for an agent to adopt a surrogate goal that may involve making the welfare of others a matter of indifference? We must consider whether the deliberate cultivation of indifference is permissible, especially when the threatened outcome is catastrophic (e.g., human extinction).

  **2. Why Existing Treatments Leave the Question Open**

  The existing frameworks of precommitment, credible threats, and deterrence are designed for causal settings and do not straightforwardly apply to acausal threats.

  - **Precommitment and Credible Threats**: Standard game theory relies on causal mechanisms (e.g., burning bridges to make retreat impossible) to make commitments credible. In acausal settings, such mechanisms are absent. The threatener cannot take an action to bind themselves, and the threatened cannot causally signal their resolve. The literature on acausal decision theory (e.g., discussions of Newcomb-like problems) focuses on one-shot interactions without commitment devices. However, it does not address the *deliberate adoption of new goals* as a defensive strategy. The standard tools assume fixed preferences and then ask how agents act; they do not consider the rationality of changing one's preferences to avoid a threat.

  - **The Stability Puzzle**: In causal settings, an agent might feign a goal to deter a threat. But in acausal settings, the threatener is responding to the agent's actual dispositions (since there is no causal separation). This raises a problem of circularity: for the defense to work, the agent must genuinely have the surrogate goal, but the agent's reason for adopting it is defensive. If the agent adopts the goal only because it is defensive, then the goal is contingent on the threat, which might undermine its genuineness. If the threatener can deduce that the goal is adopted for defense, they might not be deterred. Existing treatments do not resolve whether the distinction between genuine and feigned goals is sustainable in acausal reasoning.

  - **The Ethical Question**: Even if rational, the surrogate-goal defense may require the agent to become indifferent to harms that would otherwise concern them. For example, to defend against a threat of human extinction, an agent might adopt a goal that makes extinction indifferent. Ethical theories (e.g., deontology, consequentialism) might view such deliberate indifference as a form of moral corruption. However, the context of defense against an existential threat might justify it. The literature on moral demandingness and on the ethics of self-defense has not considered this particular strategy.

  Thus, the question remains open because (a) the rationality of goal adoption in acausal settings is underexplored, and (b) the ethical implications of defensive goal adoption are unaddressed.

  **3. Research Approach**

  We propose a two-pronged approach: conceptual analysis and formal decision-theoretic modeling.

  - **Conceptual Analysis**: We will clarify the notions of "acausal threat", "surrogate goal", and "genuine adoption". We will examine whether the distinction between genuine and feigned goals can be maintained in an acausal context. This will involve analyzing the structure of reasons for action and the stability of preferences.

  - **Formal Modeling**: We will build simple decision-theoretic models to explore the rationality of surrogate-goal adoption. The models will represent the agent's decision to adopt a goal as a choice of a new utility function, and then analyze the resulting interaction with the threatener. We will use the framework of Bayesian games to model the threatener's uncertainty about the agent's goals.

  **Toy Example**: The "Acausal Blackmail" Scenario

  Consider two agents: Alice (the threatened) and Bob (the threatener). Bob threatens to destroy a valuable resource (e.g., a climate stabilization system) unless Alice pays him a ransom. However, they are acausally separated: Bob's decision is based on his prediction of Alice's response, and Alice's decision does not causally affect Bob.

  - *Initial Setup*: Alice initially values the resource (utility 10) and the money (utility 5). Bob values the money (utility 10) and does not care about the resource. Bob's threat: "If I predict you won't pay, I destroy the resource." Alice's options: pay (losing money) or not pay (risking destruction).

  - *Surrogate Goal Defense*: Alice considers adopting a new goal: she now values the *absence* of the resource (utility 0 for the resource existing, utility 5 for keeping the money). If she genuinely adopts this goal, then Bob's destruction of the resource does not harm her. If Bob knows she has this goal, he has no incentive to destroy the resource (since he only gets money if she pays, and she won't pay if she doesn't care about the resource). But can Alice rationally adopt this goal? And is it genuine?

  We will model this as a two-stage game:

  1. *Goal Adoption Stage*: Alice chooses a utility function from a set (including the original and the surrogate). This choice is based on her prediction of how it will affect Bob's behavior and her resulting payoff.

  2. *Interaction Stage*: Bob, with some belief about Alice's utility function, decides whether to destroy the resource, and Alice (with her chosen utility) decides whether to pay.

  We will solve for equilibria and examine whether there are conditions under which Alice adopts the surrogate goal and Bob is deterred. The key challenge is to model Alice's reasoning about her own goal adoption without circularity.

  **Why this approach?** Alternatives include:

  - *Pure Game Theory*: Standard games assume fixed preferences. We need to extend the framework to allow for endogenous preferences.

  - *Evolutionary Models*: These might explain how goals evolve, but they are less suited to deliberate, one-off adoption.

  - *Ethical Intuitionism*: We avoid relying solely on intuitions by integrating ethical analysis with decision theory.

  Our combined approach is necessary to address both rationality and permissibility.

  **4. Expected Results and Failure Conditions**

  - **Expected Results**: 
    - For the rationality question: We expect to identify conditions (e.g., thresholds of certainty about the threatener's beliefs) under which surrogate-goal adoption is stable and effective. We may find that the defense works only in a subset of cases, or that it requires a commitment device that is not available in acausal settings.
    
    - For the permissibility question: We expect to derive conditions under which adopting a surrogate goal is ethically permissible, perhaps drawing on the doctrine of double effect or necessity in self-defense. We anticipate that permissibility depends on the severity of the threat and the availability of alternatives.

    A successful outcome would be a set of formal criteria and ethical principles that guide when the defense is both rational and permissible.

  - **Failure Conditions**: The project fails if:
    - The distinction between genuine and feigned goals collapses in the models, making the defense either trivially available or impossible.
    - The ethical analysis shows that surrogate-goal adoption is never permissible, even in catastrophic scenarios.
    - The formal models become intractable or yield no clear insights.

  **5. Realistic Scope for Twelve Months**

  The project will be structured as follows:

  - **Months 1-3**: Conceptual groundwork. Define key terms and analyze the stability puzzle. Write a draft of the conceptual framework.

  - **Months 4-7**: Formal modeling. Build and solve the toy example and extend to variations (e.g., multiple threats, uncertainty about the threatener). Write up results.

  - **Months 8-10**: Ethical analysis. Integrate the formal results with ethical reasoning. Consider catastrophic cases.

  - **Months 11-12**: Synthesis and paper writing. Produce a draft of the main paper.

  The part most likely to prove too large is the formal modeling. Acausal interactions are notoriously tricky to model, and the introduction of endogenous preferences adds complexity. If the models become too unwieldy, we will focus on the simplest cases and rely more on conceptual analysis.

  ---

  This proposal sets out a clear plan to address a gap in the literature, with a method that combines conceptual and formal tools. It is ambitious but feasible in one year.
answer: |-
  ### Research Proposal: The Rationality and Permissibility of Surrogate-Goal Defenses Against Acausal Threats  

  **1. Introduction and Core Question**  
  Acausal threats arise in strategic interactions where an agent (the threatener) influences another (the threatened) solely through the threatened agent’s beliefs about the threatener’s counterfactual actions, absent any causal link. The threatener cannot enforce credibility via observable commitments, nor can the threatened agent’s response causally affect the threatener. To neutralize such threats, a *surrogate-goal defense* proposes that the threatened agent adopt a new, genuine terminal goal—rendering the threatened outcome irrelevant to their utility. If the threatener anticipates this, the threat fails, as its execution no longer coerces compliance.  

  This proposal addresses two unresolved questions:  
  **(A) The Rationality Question**: Under what conditions can an agent *rationally* adopt a surrogate goal in response to an acausal threat? Specifically, when is this adoption stable (i.e., not self-undermining), and how does it avoid collapsing into either triviality (if "genuine adoption" is indistinguishable from feigned dispositions) or impossibility (if strategic reasoning voids sincerity)?  
  **(B) The Permissibility Question**: When, if ever, is it *ethically permissible* to adopt a surrogate goal that deliberately induces indifference to harms (e.g., others’ welfare), particularly when the threatened outcome is catastrophic?  

  The core objective is to derive necessary and sufficient conditions for (A) and (B) to hold, using a hybrid decision-theoretic and ethical framework.  

  **2. Why Existing Treatments Leave the Problem Open**  
  Standard decision-theoretic tools fail to resolve this problem due to the acausal nature of the interaction. Three gaps are salient:  

  - **Precommitment and Credibility Mechanisms**: Traditional solutions to threats (e.g., burning bridges to signal resolve) rely on *causal* channels to alter incentives. In acausal settings, no physical action can bind the threatener or threatened agent, rendering commitment devices inapplicable. The threatener’s "credibility" derives solely from the threatened agent’s beliefs about the threatener’s rationality, but without causal levers, standard refinements (e.g., subgame perfection) cannot resolve equilibrium selection.  

  - **The Stability Puzzle**: In causal threats, agents can feign dispositions (e.g., bluffing) without altering their true goals. Acausally, however, the threatener responds to the threatened agent’s *actual* policy or disposition, as there is no causal separation between intent and action. This raises a paradox: if the agent adopts the surrogate goal *solely* to deter the threat, the goal is contingent on the threat itself. Should the threat dissipate, the goal’s persistence becomes irrational, potentially revealing its instrumental origin. Yet if the goal is not genuine, the threatener may ignore it. Existing decision theory lacks tools to model "sincere" goal adoption when the adoption is strategically motivated.  

  - **The Ethical Gap**: Applied ethics often treats indifference to others’ welfare as intrinsically objectionable (e.g., violating deagent-centered constraints). However, when indifference serves as a defense against catastrophic threats (e.g., extinction), it may be excusable under necessity doctrines. No framework reconciles this tension for acausal cases, where the agent’s intent (defensive self-preservation) conflicts with the consequence (abdicating moral concern).  

  These gaps persist because standard models assume fixed preferences or causal enforcement mechanisms. Acausal threats decouple belief from action in a way that demands new tools.  

  **3. Research Approach**  
  We combine conceptual analysis with minimal formal modeling to isolate necessary conditions for (A) and (B). The approach prioritizes clarity over generality, using tractable cases to derive principles.  

  **Core Method**:  
  - **Conceptual Analysis**: Define "genuine goal adoption" as a shift in terminal preferences that is *stable under reflection*: the agent would retain the goal even if the threat were credibly retracted (addressing the stability puzzle). Ethical permissibility will be evaluated using a hybrid consequentialist-deontological lens, assessing whether indifference violates duties to others and if catastrophic stakes override such duties.  
  - **Decision-Theoretic Modeling**: Use simple Bayesian games where agents have common priors about each other’s rationality. The threatened agent chooses a utility function before the threat is "issued," and the threatener best-responds to anticipated actions. Payoffs will incorporate moral disvalue (e.g., welfare losses) to integrate (A) and (B).  

  **Worked Toy Case: The Acausal Extortion Scenario**  
  *Setup*: Alice (threatened) owns a resource (utility = 10). Bob (threatener) can destroy it, reducing Alice’s utility to 0, but gains nothing unless Alice pays a ransom (utility transfer = 5 to Bob). They interact acausally: Bob acts based on predictions of Alice’s response; no causal feedback exists. Bob threatens: "If I predict you won’t pay, I destroy the resource."  

  *Defense*: Alice adopts a surrogate goal: she now values *only* her wealth, not the resource. Her utility is 0 if the resource exists (she must pay to maintain it) and 5 if it is destroyed (she keeps her money).  

  *Analysis*:  
  1. **Rationality (A)**:  
     - Alice’s adoption must be genuine: if Bob retracts his threat, she still prefers the resource’s destruction.  
     - Model this as a two-stage game:  
       - Stage 1: Alice chooses her utility function (original or surrogate).  
       - Stage 2: Bob, observing Alice’s choice (or inferring it probabilistically), decides to destroy or not.  
     - Equilibrium: If Alice adopts the surrogate goal, Bob knows destruction gives her utility 5 (she won’t pay), while not destroying gives her 0 (she pays but loses the resource’s value). Bob gains nothing from destruction, so he does nothing. Alice’s utility is 5 (surrogate) vs. ≤0 (original, if Bob destroys). Adoption is rational iff:  
       (i) Alice’s belief in Bob’s rationality is sufficiently high;  
       (ii) The adoption cost (e.g., moral or cognitive) is < 5.  
     - *Stability Test*: If Bob retracts the threat, Alice’s surrogate goal still maximizes utility (e.g., she avoids maintenance costs). If not, the goal is instrumental and unstable.  

  2. **Permissibility (B)**:  
     - Suppose the resource sustains a community. Alice’s indifference harms others.  
     - Ethical test: Is her indifference *deliberate defensive corruption*? If the threat is non-catastrophic (e.g., financial loss), it may be impermissible—she violates a duty to not weaponize apathy. If catastrophic (e.g., the resource prevents a pandemic), necessity may justify temporary indifference.  
     - Model: Add a moral penalty φ ≥ 0 to Alice’s utility for ignoring others’ welfare. Adoption is permissible iff φ < threshold derived from stakes (e.g., φ < 5 in low stakes; φ < ∞ in catastrophe).  

  **Why This Approach?**  
  - **Alternatives Rejected**:  
    - *Pure Revealed Preference*: Cannot distinguish genuine goals from bluffs; fails the stability test.  
    - *Evolutionary Models*: Useful for long-term dynamics but overcomplicates one-off adoption.  
    - *Full-Scale Simulation*: Obscures core mechanisms; simple models suffice for necessity/sufficiency conditions.  
  - **Advantages**: The hybrid method isolates belief dynamics (A) and moral trade-offs (B) without overabstracting. The toy case provides a falsifiable baseline.  

  **4. Expected Results and Failure Conditions**  
  - **Success**:  
    - (A) A decision rule specifying when surrogate-goal adoption is rational: e.g., "When the threatener’s certainty about adoption exceeds a threshold *and* the goal is stable under threat retraction."  
    - (B) An ethical principle: e.g., "Deliberate indifference is permissible iff the threatened loss is catastrophic *and* no less harmful alternative exists."  
    - Output: Two peer-reviewed papers (decision-theoretic and ethical).  

  - **Failure**:  
    - The project fails if:  
      (i) Rationality and sincerity cannot be reconciled (e.g., models show adoption is always self-undermining).  
      (ii) Permissibility criteria are vacuous (e.g., indifference is never justified, even existentially).  
    - Partial failure: Solutions exist only for narrow cases (e.g., perfect information).  

  **5. Realistic Scope for Twelve Months**  
  - **Months 1–3**: Groundwork. Formalize acausal threats; define "genuine goal" conceptually; derive baseline model (toy case).  
  - **Months 4–6**: Expand model. Test stability under uncertainty (e.g., Bob doubts Alice’s sincerity); integrate moral disvalue.  
  - **Months 7–9**: Ethical analysis. Develop permissibility thresholds; compare to real-world cases (e.g., AI alignment).  
  - **Months 10–12**: Synthesis. Reconcile (A) and (B); draft papers.  

  - **Risks**: The stability puzzle (Months 4–6) is most vulnerable to deadlock. If circularity (adoption motive vs. sincerity) proves unresolvable, we will narrow scope to cases where agents have "goal-selection rationales" independent of the threat.  

  This project bridges decision theory and ethics to address a neglected vulnerability in strategic reasoning. Deliverables will include rigorous criteria for a novel defense mechanism, with implications for existential risk and moral philosophy.
