  Movement Three delves into craft. The user's coinage "foresight bias" (overestimating past openness) should be introduced here. Questions about the gap between historical inevitability and narrative determinism are key. If she conflates the two, I'll highlight how novelists compress events to create inevitability effects—making her distinguish between actual determinism and storytelling techniques. 

  The closing question needs to synthesize everything: can her view coexist with unpredictable contingency? It should leave her reconciling her theory with chaos. 

  For "Where I Expect Her to Slip": She'll likely dodge by saying biases are unavoidable trade-offs for understanding. Watch for conflating explanation with determinism or retreating to "narratives are practical." My reserved follow-up should force her to defend why we trust narratives if they're fundamentally biased. 

