prompt: |-
  Random one, but this has been bugging me. I think I've got a weird version of the usual "won't bet on unknown odds" thing, and I want to know if it has a name of its own or if I'm just misdescribing the normal one.

  What I do: offer me a bet on a coin you tell me is fair and I'll take it. Offer me a bet on a coin whose bias you know and I don't, and I'll pass. Fine, that's the standard thing. But the standard thing doesn't actually seem to be about the missing information. Hand me the biased-coin bet by itself, with no fair coin anywhere in sight, and I'll happily take it. And I'm still cool on it relative to the fair coin even after you tell me the bias — even when it comes out to exactly 50/50, so there's literally nothing left that I don't know. What seems to move me is the comparison: I only get cold feet when a bet I feel I understand is sitting next to one I don't. When everyone at the table is equally in the dark, or when I'm the only one who knows, I'm fine.

  Is there a name for that? And is the honest answer that I'm averse to the unknown, or averse to being the person who knows less? I don't just want "thats ambiguity aversion" — I want the line between those two drawn sharply, and some sense of which one I'm actually on.
reasoning: |-
  Okay, let me try to unpack this user's query. They're describing a nuanced betting behavior that goes beyond standard ambiguity aversion. The user is comfortable betting on a fair coin or even a biased coin when it's presented alone. But when a fair coin bet is offered alongside a biased one with unknown bias, they hesitate—even if the bias is later revealed to be 50/50. The key trigger seems to be the comparison between "known" and "unknown" options.

  First, I need to distinguish between ambiguity aversion and the user's described behavior. Ambigu aversion is typically about avoiding options with unknown probabilities altogether. But here, the user is fine with the unknown when it's isolated. Their discomfort arises specifically in comparative contexts where a known-safe option exists alongside an ambiguous one. That sounds a lot like comparative ignorance framing.

  Ellsberg's paradox comes to mind—it's the classic example where people prefer known probabilities over ambiguous ones. But the user's case adds a twist: they're okay with ambiguity when there's no "safe" alternative to compare it to. That aligns with Fox and Tversky's work on comparative ignorance. The presence of a familiar option makes the ambiguous one feel riskier by contrast.

  The user also mentions that even after learning the bias is 50/50, they still prefer the fair coin. That's fascinating—it suggests the aversion isn't just about missing information but about the history of the decision. The fair coin feels "epistemically pure" because its probability was always known, while the other had uncertainty at the time of comparison. This touches on source dependence: we value knowing how knowledge was acquired.

  The user's struggle seems to be about self-perception in social contexts too. They mention discomfort when others might know more, or when they're the "less informed" player. That hints at social comparison or fear of exploitation, but the core mechanism still points to comparative ignorance. The key is the juxtaposition creating psychological tension, not just missing data.

  I should emphasize that this is a well-documented cognitive bias, not irrational per se. Our brains use relative evaluation when options are side-by-side. The fair coin becomes a reference point, making the ambiguous bet seem disproportionately unattractive. Separately, both might be acceptable. 

  For the user's identity question: they're not purely ambiguity-averse, nor just afraid of information asymmetry. It's about framing—the presence of a "certain" alternative triggers the aversion. Naming it clearly (comparative ignorance) and explaining why it happens (reference point shifts, evaluation mode change) should help them understand their own behavior better.
answer: |-
  Your description perfectly captures a specific cognitive bias called **comparative ignorance**, which is a nuanced subcategory of ambiguity aversion. Here's the breakdown and why it fits:

  1.  **Standard Ambiguity Aversion (Ellsberg Paradox):** Avoiding bets with unknown probabilities *regardless* of other options. You *don't* have this. You're happy to take the biased coin bet alone.

  2.  **Comparative Ignorance (Fox & Tversky, 1995):** This is *your* bias. The key insight:
      *   People are often ambiguity-averse *only* when they can **directly compare** an ambiguous option (unknown bias) with an unambiguous option (known probability, like the fair coin).
      *   When evaluating the ambiguous option **in isolation**, people are frequently much more willing to accept it, sometimes even ambiguity-*neutral* or slightly seeking.
      *   The act of comparison makes the ignorance salient and psychologically aversive. The unambiguous option becomes a reference point highlighting the "missing knowledge" in the ambiguous one, making it feel riskier *by contrast*.

  **Applying it to your scenario:**

  *   **"Offer me a bet on a coin you tell me is fair and I'll take it."** (Unambiguous option accepted alone)
  *   **"Offer me a bet on a coin whose bias you know and I don't..."** (Ambiguous option presented alongside unambiguous one -> **Reject due to comparative ignorance**)
  *   **"Hand me the biased-coin bet by itself... and I'll happily take it."** (Ambiguous option evaluated **in isolation** -> Acceptable, comparative ignorance isn't triggered)
  *   **"...even when it comes out to exactly 50/50... I'm still cool on it relative to the fair coin."** This is the **crucial confirmation**. Comparative ignorance isn't *just* about the missing information *now*, it's about the **evaluation context**:
      *   The fair coin bet has *always* been epistemically pure ("I *knew* the probability was 50% when I made the choice").
      *   The other bet *had* ambiguity at the critical decision point (when the comparison was made). Knowing the bias *afterwards* doesn't erase the psychological experience of having faced ambiguity *during the comparison*. The fair coin feels "safer" because its probability was *never* in doubt relative to the other option at the time of choice. This is related to **source dependence** – valuing probabilities based on *how* the knowledge was acquired.

  **Why it's not *just* "fear of the unknown" or "fear of knowing less":**

  *   **Fear of the Unknown:** You *don't* fear the unknown biased coin in isolation. You happily bet on it alone. This rules out a pure, general fear of the unknown.
  *   **Fear of Knowing Less:** This is closer but incomplete.
      *   In the direct comparison scenario, yes, *you* know less about the biased coin than the person offering it (and less than you know about the fair coin). This asymmetry likely contributes to the aversion.
      *   However, comparative ignorance can occur even if *no one else* knows the probability! Imagine you are told: "Here are two coins. Coin A is fair (50/50). Coin B has *some* fixed bias, but *no one knows what it is*, not even me." The *comparison* between the known-probability Coin A and the ambiguous Coin B would likely *still* trigger your aversion to Coin B, even though no one has an informational advantage. The key is the **salience of your ignorance relative to your knowledge about the alternative**.

  **The Line & Your Location:**

  *   **Ambiguity Aversion:** The *general* tendency to avoid options with unknown probabilities.
  *   **Comparative Ignorance:** A *specific mechanism* explaining *when* ambiguity aversion is strongest: **when an ambiguous option is evaluated relative to an unambiguous option, making the ignorance salient.**
  *   **Your Location:** You are demonstrating **comparative ignorance**. Your aversion is primarily triggered by the **context of comparison** between an option you fully understand (fair coin) and one you don't (biased coin). This comparison heightens the psychological discomfort of not knowing. The "fear of knowing less" (especially relative to the *offerer*) is likely a contributing factor *within* the comparative context, but the core driver is the **salience of ignorance created by the juxtaposition itself**.

  **In essence:** Your "weird version" is well-known! You're averse not to ambiguity *inherently*, but to **ambiguity made salient by direct comparison to certainty**. The fair coin sitting next to the unknown coin acts like a spotlight, making your lack of knowledge about the second coin feel intensely uncomfortable and risky. When that spotlight isn't there (evaluating the biased coin alone), the discomfort vanishes, and you can assess the unknown gamble on its own terms. The persistence of preference even after learning the bias confirms the importance of the *decision context* – the memory of the comparative ignorance at the choice moment lingers.
