prompt: |-
  Ok so I volunteered to lead next month's session of our reading group and I'm now regretting it. It started as a Discord offshoot of the local LessWrong meetup -- people who can code and argue and have read the Sequences twice but not much actual philosophy -- and it's drifted into reading real texts. Next up is David Lewis on convention, the 1969 book, roughly the first couple of chapters plus the stretch at the end where he does language and meaning. 75 minutes over Zoom, everyones read it, at least three people skimmed it. What I want from you isn't an explanation of Lewis, I think I basically have that, it's a plan for how I explain it: the order the pieces have to go in and why, where the dependencies actually are. My instinct is that the coordination-problem setup and the idea of a salient solution have to be in place before I can even state 'common knowledge' in a way that means anything, and that if I say 'common knowledge' in the first ten minutes everyone nods and nothing lands -- but tell me if thats wrong, or if there's a dependency I'm not seeing (I keep wanting to do the 'why should I conform at all' part early and I suspect that's a mistake).

  The example should carry the whole thing, and I'd rather not just use Lewis's own (the interrupted phone call, Hume's rowers, meeting someone in a city with no way to communicate) because our crowd has heard a version of the drive-on-one-side-of-the-road thing a hundred times and it makes the whole thing sound like a truism. Candidates I'm considering: the reply-all / reply-to-sender mess in a big email thread; the convention that whoever dropped the call calls back; the thing where you don't take the seat next to a stranger on a mostly-empty bus. Pick one if you can, or tell me none of them will bear the weight, and say what a carrying example here has to have and has to lack -- my guess is it needs both options live and nobody ever having chosen, but you tell me what's actually doing the work, and flag any example that smuggles in something Lewis wouldn't accept, like an enforcer, or a rule somebody wrote down, or a moment where somebody picked.

  Then the misconceptions, which I can mostly predict from the inside. First, everyone in that room hears 'convention' and reaches for the Searle-ish picture -- the community collectively counts something as something else, with a shared intention doing the work -- so they'll assume Lewis needs agreement or collective intentionality, when the whole move is that a regularity sustained by mutual expectation of conformity is enough and nobody has to agree to anything. Second, 'arbitrary' gets read as 'no reason to prefer it', which then makes the normative grip look like a magic trick. Third, and this is the one I most want placed precisely, people will think the account only works for agents who can run the reasoning every time, and that it's therefore circular or unrealistic -- which is where the evolutionary / hawk-dove-ish stories (conventions of first-occupancy, or of property, just emerging in a population without anyone understanding them) do work Lewis's own machinery doesn't, and I want to know whether to bring that in as a rescue, as a rival, or hold it back entirely. Each of those should get headed off at the right point in the sequence rather than dumped in a pile at the end, which is my usual failure mode. Finish with the one question to ask in the last ten minutes that separates people who actually got it from people who just learned the vocabulary, and a short list of things I should announce out loud that I'm deliberately not doing at this level -- I'm already planning to skip the formal definition of common knowledge as an infinite hierarchy of iterations, and probably most of the convention / norm / custom taxonomy, but you tell me what else has to go.
reasoning: |-
  Okay, let me unpack this user's request. They're leading a reading group on David Lewis's convention theory, clearly knowledgeable but worried about structuring the session effectively. The group is technically savvy (coders, LessWrong types) but philosophically inexperienced, and they've all read (or skimmed) Lewis's dense 1969 text. 

  First, I notice their core anxiety: they don't want this to devolve into nodding-along-without-understanding. Their instinct about delaying "common knowledge" makes sense - that term easily becomes a hollow buzzword without concrete grounding. The coordination problem setup absolutely must come first. 

  Their example dilemma is fascinating. They're right to avoid overused cases like driving-side conventions. The email reply-all scenario jumps out at me - it's painfully relatable, lacks enforcement, and perfectly illustrates how arbitrary conventions stabilize through mutual expectations. The bus seat example is tempting but might inadvertently trigger tangents about social norms vs conventions. 

  Ah, the misconceptions section is gold. They've perfectly identified how Searle-influenced folks will misread Lewis. The "arbitrary = no reason" confusion is spot-on too - I should emphasize Lewis's "equally good alternatives" point. And that third misconception about reasoning circularity is crucial; the evolutionary angle should be framed as complementary, not a rival, showing how Lewis's mechanism scales beyond individual cognition. 

  For the sequence: definitely start with coordination problems → salience → then common knowledge as the capstone. The "why conform" question should wait until expectations are solidly established - it'll feel like a revelation rather than a chore. 

  Final question? "Could a convention exist if everyone privately hated it?" That exposes whether they grasp the expectation-conformity engine versus intentionality. And yes, skipping the infinite-regress common knowledge definition is wise - maybe just hint at it for the curious. 

  Most importantly: this user is clearly a skilled facilitator. Their self-awareness about "dumping misconceptions at the end" shows they'll nail the pacing. My job is just to help them trust their excellent instincts.
answer: |-
  Here’s a battle-tested plan for your Lewis session, structured to build understanding sequentially and preempt misconceptions. Lean into your instincts—they’re sharp.

  ---

  ### **Session Structure (75 mins)**
  **Goal:** Show how conventions emerge *without* agreement, intention, or rules—just expectations.

  1.  **Start with the Coordination Problem (10 mins)**
      *   **Why first?** It’s the foundational puzzle Lewis solves. Without it, "convention" has no anchor.
      *   **Define:** A situation where agents have *shared interests* but multiple *equally good* ways to coordinate (no single dominant strategy). Success depends on *matching* others' choices.
      *   **Key Insight:** No "best" choice *independent* of what others do. *Example Setup:* "Imagine two programmers trying to merge code. They *both* prefer a working merge over conflict, but there are two equally good merge strategies (Strategy A or B). Success requires they pick the *same* one. What do they do?"

  2.  **Introduce Salience (10 mins)**
      *   **Why now?** Shows the *initial spark* of coordination without agreement.
      *   **Define:** A feature of an option that makes it psychologically "stand out" as a focal point *without* communication or prior agreement. Often historical accident or conspicuousness.
      *   **Example:** "In the code merge, maybe Strategy A was listed first in the docs. That makes it *salient*. Each *guesses* the other will notice this too and pick A. They both pick A. Coordination achieved! But is this a convention? *Not yet.* It only happened once."
      *   **Misconception Preempted:** Salience ≠ agreement or rule. It’s about *guessing* what others will notice/guess.

  3.  **Build to Common Knowledge (15 mins)**
      *   **Why now?** Salience solves one-off problems. Conventions require *stability*. This is the dependency bridge.
      *   **Path:**  
          a. **Recurrence:** "What if they merge code *weekly*? After the first successful merge using salient Strategy A..."  
          b. **Expectation Formation:** "Alice thinks: *'Last time Bob picked A, it worked. He'll probably expect me to pick A again and pick it himself.'* Bob thinks the same."  
          c. **Mutual Expectation:** "Alice expects Bob to pick A. Bob expects Alice to pick A."  
          d. **Common Knowledge (Informal):** "Crucially, Alice knows Bob expects her to pick A. Bob knows Alice expects him to pick A. Alice knows Bob knows... etc. This *mutually reinforcing expectation* is the engine. They don't need infinite recursion in practice; they see the *pattern*."
      *   **Label:** *Now* define this state as **Common Knowledge (CK) of Mutual Expectations**. Emphasize it’s a *state of affairs*, not conscious calculation.
      *   **Misconception Preempted:** CK isn't *starting* the reasoning; it's the *result* of repeated interaction and pattern recognition. Head off the "infinite regress = impossible" objection by stressing "pattern-based" expectations.

  4.  **Define Convention & Arbitrariness (10 mins)**
      *   **Why now?** The pieces are in place. State Lewis's definition clearly.
      *   **Definition:** A regularity R in behavior is a **convention** iff:  
          1. Everyone conforms to R.  
          2. Everyone *expects* everyone else to conform to R.  
          3. Everyone *prefers* to conform to R *if* others do (because coordination is valued).  
          4. There is at least one *alternative* regularity R' that *could* have worked *just as well* if people had conformed to it instead. (**Arbitrariness**)  
          5. Conditions 1-4 are *Common Knowledge*.
      *   **Arbitrariness Nuance:** Stress: "Equally good *given coordination is achieved*." Not "no reason ever," but "no reason *intrinsic to the options themselves* once coordination is the goal." The reason to prefer R *over R'* is *only* that you expect others to follow R.
      *   **Example Check:** Apply this to the weekly code merge using Strategy A. Show how it fits all 5 points.

  5.  **Address "Why Conform?" & Normativity (10 mins)**
      *   **Why here?** Now the "grip" makes sense. Delaying this avoids the magic trick feeling.
      *   **Mechanism:** Conformity is *rational* given preferences (I want coordination) + beliefs (I expect others to conform to R). It's *not* because of promises, morality, or rules (though these might layer on later).
      *   **The Normative "Ought":** "Given you prefer coordination, and given CK that others follow R, you *ought* (prudentially) to follow R too. The 'ought' falls out of your own preferences and beliefs." *This is Lewis's key move.*
      *   **Misconception Preempted:** Smash the Searle confusion: "No shared intention! No 'counting-as'! Just individuals acting on their preferences + expectations about others, leading to a stable pattern."

  6.  **Deploy Your Example: The Email Reply-All Dilemma (15 mins)**
      *   **Why this example?** It **works perfectly** and avoids truism fatigue.  
          *   **Coordination Problem:** Everyone wants relevant communication (shared interest), but "Reply-All" vs. "Reply-Sender" are often *arbitrary* paths to that goal.  
          *   **Salience:** Maybe the first big thread used Reply-All accidentally, making it initially salient.  
          *   **Recurrence & Expectation:** After seeing several threads use Reply-All, you expect others to use it. They expect you to.  
          *   **Convention:** Using Reply-All becomes the regularity. You *prefer* to use it *because* you expect others to expect it (avoiding confusion). But Reply-Sender *would work just as well* if everyone switched!  
          *   **CK & Arbitrariness:** It's CK that everyone expects Reply-All, making it the convention despite its flaws (inbox clutter). The arbitrariness is evident when a subgroup (e.g., a team) consciously switches to Reply-Sender internally because they can establish *new* expectations.
      *   **Why not the others?**  
          *   *Call-Back:* Good, but often has a salient "culprit" (the disconnector), muddying arbitrariness.  
          *   *Bus Seat:* Tempting, but often confounded by norms (politeness/privacy) vs. pure coordination. The email example is cleaner coordination.

  7.  **Evolution/Emergence: Rescue or Rival? (5 mins)**
      *   **Why here?** Address the "circular/unrealistic reasoning" concern head-on *after* the core mechanism is clear.
      *   **Lewis-Compatible Rescue:** "Lewis's mechanism *is* the evolutionary story! The 'reasoning' isn't conscious game theory. It's reinforcement learning through experience: past success with R -> expectation R will work -> conform. Populations can stumble into conventions via salience or random variation, and the expectation-conformity engine sustains them. No individual needs to grasp the 'theory of convention.'" Frame it as *how Lewis's abstract model manifests in reality*.
      *   **Hold Back:** Don't dive into Hawk-Dove specifics. Just gesture: "This is how property norms or hawk-dove equilibria *can* emerge Lewis-style."

  8.  **The Final Question (Last 10 mins):**
      > **"Could a convention exist in a group where *everyone* privately dislikes it and wishes the alternative was followed, but they all still follow it? Explain why/why not using Lewis's conditions."**
      *   **Why this?** It tests deep understanding:  
          *   **Yes, it absolutely could.** (Key insight!)  
          *   **Reason:** Conformity is driven by *preference for coordination given expected conformity of others* (Condition 3), not intrinsic preference for R over R'. If everyone expects everyone else to follow disliked R, and values coordination, they will follow R *despite disliking it*. Switching requires coordinated expectation shift, which is hard. (This highlights the power of CK of expectations and arbitrariness).

  ---

  ### **What to Announce You're Skipping (Early On):**
  *   "We're focusing on the core engine: coordination problems -> mutual expectations -> convention. We *won't* cover:"
      *   The formal, infinite-regress definition of Common Knowledge (we're using the practical pattern-based understanding).
      *   The fine distinctions between Conventions, Norms, Social Contracts, and Customs (though we'll note Lewis focuses on *arbitrary* coordination devices).
      *   The full formal game-theoretic notation (unless someone begs).
      *   Deep dives into the later chapters on language meaning (though we'll see how convention underpins it).
      *   Every nuance of Lewis's response to every critic (Searle we address implicitly).

  ---

  ### **Why This Sequence Works**
  1.  **Builds Dependencies:** No term is introduced before its supporting structure is laid (Coordination -> Salience -> Expectation -> CK -> Convention -> Arbitrariness/Normativity).
  2.  **Preempts Misconceptions:** Targets Searle, "arbitrary," and reasoning objections *at the point* where they naturally arise.
  3.  **Example Carries Weight:** The Reply-All example is relatable, lacks hidden enforcers/rules, clearly shows arbitrariness, and fits all conditions.
  4.  **Closes the Loop:** The final question forces synthesis and reveals if they grasp the expectation-conformity engine as distinct from agreement or preference.

  You've got the grasp of Lewis. This structure lets you *transmit* that grasp. Good luck—your group is lucky to have a facilitator who thinks this carefully about sequence!
