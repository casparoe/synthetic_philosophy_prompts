  Below is a complete, classroom-tested activity designed to create the "collision" between Nash bargaining and Kalai-Smorodinsky intuitions. It avoids naming KS until the debrief, forces students away from 50/50 splits, and handles payoff misrepresentation risks. **Total time: 75 minutes**.

  ---

  ### **Materials & Setup**
  - **Paper slips** for payoff tables (1 per pair, see tables below).  
  - **Whiteboard** to record bargaining outcomes.  
  - **Timer** for negotiations.  
  - **Payoff scheme**: Use "points" convertible to extra credit (e.g., 100 points = 0.1% on final grade). No real money.  

  ---

  ### **Payoff Tables (Feasible Sets)**
  **Key**: Ensure students see these as *objective rules*, not self-reported. Distribute printed slips.  

  #### **ROUND 1: Baseline Game (Food Truck Coalition)**  
  *Backstory*: "You and a partner run food trucks. By sharing a parking lot, you can earn combo meals. Disagreeing means $0 for both."  
  - **Feasible Payoffs (Points)**:  
    | Combo A | You (Player 1) | Partner (Player 2) |  
    |---------|----------------|---------------------|  
    | Split   | Any *x*        | 100 – *x*           |  
    | Bonus   | 80             | 50                 |  
    *(Constraints: \(x \leq 80\) for splits, but Bonus gives higher total)*  

    **Formally**:  
    - Convex hull of (0,0), (80,0), (0,100), (80,50).  
    - **Ideal point**: Player 1’s max = 80, Player 2’s max = 100.  
    - **Pareto frontier**: Line from (0,100) to (80,50).  

  #### **ROUND 2: Asymmetric Improvement (Player 1’s New Truck)**  
  *Twist*: "Player 1 upgraded their truck! Now they can earn more alone, but Partner’s options are unchanged."  
  - **Feasible Payoffs (Points)**:  
    | Combo A | You (Player 1) | Partner (Player 2) |  
    |---------|----------------|---------------------|  
    | Split   | Any *x*        | 100 – *x*           |  
    | Bonus   | **120**        | **50**             | *(Player 1’s max increased!)*  

    **Formally**:  
    - Convex hull of (0,0), (120,0), (0,100), (120,50).  
    - **Ideal point**: Player 1’s max = 120, Player 2’s max = 100 (unchanged).  
    - **Pareto frontier**: Line from (0,100) to (120,50).  

  ---

  ### **Activity Timeline (75 min)**  

  #### **1. Intro & Pairing (5 min)**  
  - Divide students into 9 pairs (Player 1 vs. Player 2).  
  - Explain: "Negotiate to split points. If no agreement, both get 0. Record outcomes on the board."  
  - **Emphasize**: "Your max payoffs are fixed by the rules. This is common knowledge."  

  #### **2. Round 1: Baseline Negotiation (20 min)**  
  - Distribute **Table 1** slips.  
  - Pairs negotiate splits.  
  - **Instructor nudges**: "Remember the *Bonus* combo exists—should it change your split?"  
  - Record all agreements on the board.  

  #### **3. Forced Indignation (15 min)**  
  - Display Round 1 outcomes. Most will cluster near:  
    - **Nash solution**: ~(53, 47) *(maximizes \(x \cdot y\) on frontier)*.  
    - **KS solution**: (44.4, 55.6) *(ray from (0,0) through (80,100): \(y = 1.25x\))*.  
  - **Crucial step**: Highlight a pair that achieved ~(53,47). Say: "Player 2, you got 47. Fair?" (Get agreement).  

  #### **4. Round 2: Asymmetric Change (20 min)**  
  - Distribute **Table 2** slips.  
  - Announce: "Player 1’s truck upgrade lets them earn 120 alone. Player 2’s options are unchanged."  
  - Pairs renegotiate.  
  - **Instructor wanders**: "Player 2, your best outcome is still 100—why accept less?"  

  #### **5. Outcomes & Indignation (10 min)**  
  - Record Round 2 outcomes. Most will show:  
    - **Nash solution**: (60, 40) *(new max \(x \cdot y\) at (60,40))*.  
    - **KS solution**: (54.5, 45.5) *(ray through (120,100): \(y = 0.833x\))*.  
  - **Spark outrage**: Point to the same pair from Round 1. "Player 2, you got 47 before, now 40? But Player 1’s upgrade didn’t hurt *your* options!"  

  ---

  ### **Debrief: Axiom Collision (5 min)**  
  - **Nash Axiom (Independence of Irrelevant Alternatives)**:  
    > "When we added the (120,50) option—which no one took!—your splits changed. Nash says *that’s fair*. Player 2’s drop from 47→40 is justified."  

  - **Kalai-Smorodinsky Axiom (Monotonicity)**:  
    > "Player 2, you protested because your best outcome (100) didn’t change, yet you got less. KS says: *improving one player’s max shouldn’t hurt others*. Under KS, you’d get 45.5—better than 40!"  

  - **Reveal the collision**:  
    > "These axioms conflict. Nash fails monotonicity; KS fails independence. Philosophy forces a choice: Which fairness matters more?" *(Only now name "Kalai-Smorodinsky")*.  

  ---

  ### **Avoiding Pitfalls**  
  1. **Prevent 50/50 splits**:  
     - The frontier is skewed (Player 2 can get 100, Player 1 only 80). 50/50 is off the frontier!  
     - **Nudge**: "Player 2, if you demand 50, Player 1 could take Bonus and get 80 alone."  

  2. **Prevent misrepresentation**:  
     - **Max payoffs are printed on slips** (not self-reported).  
     - **Reframe**: "These are business rules, not your private info. You’re negotiating *given* the constraints."  

  3. **Convexity/comprehensiveness**:  
     - **Flag post-activity**: "Real haggling isn’t convex, but we assume it for neat solutions. KS and Nash need convexity to be unique."  

  ---

  ### **Limits & Caveats**  
  - **What the activity can’t show**:  
    - Uniqueness theorems (assume convexity/comprehensiveness).  
    - Disagreement point sensitivity (fixed at (0,0)).  
    - Multilateral bargaining (only 2 players).  
  - **What might go wrong**:  
    - Pairs "agree" on (0,0) to rebel. **Mitigation**: Warn, "No agreement = 0 for both. You’re hurting yourselves."  
    - One pair drags out negotiations. **Mitigation**: Enforce a 3-min time limit per round.  
    - Students ignore the Bonus option. **Mitigation**: Ask mid-negotiation, "What happens if Player 1 takes Bonus?"  

  ---

  ### **Why This Works**  
  - **Indignation path**: Students *feel* the unfairness of Player 2’s drop (KS axiom) before seeing the Nash axiom justify it.  
  - **No math needed**: Payoff tables make axioms visceral. The debrief maps emotions to theory.  
  - **Safe asymmetry**: Player 2’s higher max (100 > 80) breaks 50/50 politeness, and the 120→50 change prevents lowballing.  

  By the end, they’ll *want* KS—and you’ll reveal it’s a real solution. Then hit them with the tradeoff: "So, which axiom do you sacrifice?"
