prompt: |-
  I teach a 300-level philosophy of economics seminar — 18 students, one 75-minute block, and roughly half of them have already seen the Nash bargaining solution, so don't spend any time re-deriving that for me.

  Here's what I'm after. I want them to feel the pull of the Kalai-Smorodinsky solution without me ever saying its name, and the specific thing I want them to walk into is a collision: KS is pinned down by the requirement that if you improve one player's best possible outcome while leaving the other player's best possible outcome where it was, the other player must not end up worse off. Nash is pinned down by the requirement that the answer shouldn't change when you add options nobody would ever take. Those two can't both hold. Under Nash, improving player 1's best option makes player 2's share drop. So what I want is for them to have already agreed on something they think is fair, then watch that happen to them, get indignant about it, and only afterwards discover that the indignation is an axiom and that the axiom you'd have to trade it for is the other one. Don't let the name Kalai-Smorodinsky into the room until the debrief. For your reference while you design it: KS takes the ray from the disagreement point through the ideal point — the pair of each player's individual maximum — and picks where that ray hits the Pareto frontier.

  Give me rules, materials, a payoff scheme that doesn't need real money (I'm not handing out cash), a minute-by-minute timeline, and a debrief that lands each moment of the session on one of those two axioms. Two things I'm nervous about. First, they'll just split everything 50/50 out of politeness no matter what shape the feasible set has, which defeats the whole point. Second, somebody will lowball their stated maximum to gain an edge, and the ideal point is supposed to be common knowledge, so that could wreck it. How do I set it up so neither of those kills the session?

  Then be straight with me about the limits. I assume the uniqueness theorem, plus the convexity and comprehensiveness assumptions on the feasible set, are things I have to just tell them at the end because nothing that happens in the room can produce them. Is there anything else the activity quietly can't reproduce that I should flag myself? And what's going to go sideways the first time I run it.
