prompt: |-
  I write and edit the ideas section of a science magazine, and we run one or two pieces a month on studies claiming to show how people intuitively judge some moral or metaphysical question — whether a character in a vignette acted wrongly, whether a name still refers after its bearer dies, whether a rebuilt object is the same object. The claims that reach us always sound alike: that a population's intuitions differ from ours, or that they do not. I have no reliable way to tell whether a study measured intuitions or merely answers to a questionnaire that travelled badly. Please write me a procedure my writers and I can run in an hour before commissioning or publishing: the questions to ask in order, what counts as a sufficient answer to each, the point at which we should report a result as a difference in answers rather than in intuitions, and the point at which the remaining decision is about what we can honestly say rather than about the study. Build it around two distinctions I think the literature blurs — between an intuition and a considered answer, and between a vignette being translated and a vignette being understood — and mark clearly which steps are judgement calls dressed up as method.

  Then run it on three cases: a study finding that a small-scale community judges a trolley-style case differently from Western undergraduates; a study finding no cross-cultural difference in a case that seems to turn on a culturally specific concept; and a study we would love to run because its finding is exactly what our readers expect, but whose sample is small and whose wording is, on inspection, ambiguous. Say plainly whether the procedure tells us to drop or heavily hedge that third piece, and say what the procedure cannot settle. Open with one sentence stating what the procedure decides, then the steps, then the cases. No more than 900 words.
reasoning: |-
  Okay, the user is an editor for a science magazine's ideas section, dealing with studies on moral or metaphysical intuitions. They need a quick, reliable procedure to evaluate these studies before commissioning or publishing. The main issues are distinguishing between intuitions and considered answers, and ensuring vignettes are properly translated and understood. 

  First, I need to address their two key distinctions. The intuition vs. considered answer problem means we have to check if participants are giving gut reactions or deliberated responses. The translation vs. understanding issue requires verifying that the vignette wasn't just translated linguistically but also culturally adapted. 

  The user also wants this procedure to be practical—something their team can run in an hour. So the steps need to be straightforward, with clear pass/fail criteria. I should outline specific questions to ask, what counts as sufficient answers, and when to categorize results as mere answer differences rather than intuition differences. 

  For the judgment calls, I'll mark steps that involve subjective decisions but are framed as methodical—like assessing cultural grounding or probing for deliberation. This honesty helps users apply the procedure critically. 

  Now, applying it to their three cases: 
  The trolley study with a small-scale community might pass most checks but fail on cultural grounding of the scenario. That means reporting it as answer differences, not intuition differences. 
  The no-difference study with culturally specific concepts could fail on concept equivalence, suggesting the lack of difference might be due to poor comprehension. 
  The desirable but flawed study—small sample and ambiguous wording—clearly fails multiple checks. The procedure would recommend dropping it or heavily hedging, showing that even appealing findings need scrutiny. 

  The user's deeper needs include maintaining credibility for their magazine and avoiding misleading interpretations. They might also want to educate their readers on the complexities of cross-cultural research. The procedure not only filters studies but also models critical thinking for their audience. 

  Finally, I'll ensure the response stays under 900 words, opening with the procedure's purpose, then detailing steps, and applying to cases. Highlighting limitations is crucial—like not resolving all philosophical debates but improving reporting accuracy.
answer: |-
  Here’s a 60-minute pre-commissioning/publishing procedure to distinguish reported *answer differences* from robust *intuition differences* in cross-cultural studies, based on your two key distinctions:

  **Procedure: Deciding "Intuition Difference" vs. "Answer Difference"**

  1.  **Intuition Check: Was it a *gut reaction*?** (Judgement Call)
      *   *Question:* Does the method (timing, priming, task framing) prioritize immediate, unreflective judgment over deliberation? Check: Was response time limited? Were participants discouraged from overthinking? Was it embedded in a rapid sequence?
      *   *Sufficient:* Evidence of methods actively minimizing deliberation (e.g., timed response, "first impression" instruction, within-subjects rapid presentation). **Fail = High risk of considered answers.** Flag as "Answer Difference" if failed.

  2.  **Concept Check: Is the *core concept* culturally grounded?** (Judgement Call)
      *   *Question:* Is the vignette's pivotal concept (e.g., "intent," "ownership," "same object," "soul") demonstrably meaningful and similarly construed in the target culture? Check: Did authors cite ethnographic work, pre-tests on concept understanding, or use local analogies? Is the concept potentially alien?
      *   *Sufficient:* Evidence of local validation (e.g., pre-test showing comprehension, use of culturally resonant analogs, citation of relevant anthropology). **Fail = High risk of conceptual mismatch.** Results likely reflect comprehension failure or forced choice on alien ideas. Flag as "Answer Difference" if failed.

  3.  **Translation Check: Was it *understood* or just translated?**
      *   *Question:* Was the vignette back-translated AND tested for comprehension/clarity with local participants (not just translators)? Check methods section.
      *   *Sufficient:* Reported back-translation *and* pilot testing/comp checks with target population sample. **Fail = High risk of misunderstanding.** Flag as "Answer Difference" if failed.

  4.  **Ambiguity Check: Is the vignette *unambiguous*?**
      *   *Question:* Read the vignette critically. Are key details clear? Are multiple interpretations plausible? Could wording (even in English) prime unintended responses?
      *   *Sufficient:* Vignette is precise, avoids loaded/ambiguous terms, and minimizes confounding interpretations. **Fail = Findings uninterpretable.** Do not commission/publish without major caveats or redesign.

  5.  **Sample & Power Check: Is the *evidence* convincing?**
      *   *Question:* Is the sample size per group justified? Is statistical power adequate for the claimed effect (especially null claims)? Is the population truly distinct (e.g., not just different undergraduates)?
      *   *Sufficient:* Sample size/power analysis reported and adequate for effect size; population distinctiveness clear. **Fail = Findings fragile or ungeneralizable.** Hedge conclusions heavily.

  **Reporting Threshold:**
  *   Report as **"Intuition Difference"** ONLY if it passes **all Checks (1-3)** *and* Check 4. Checks 1-3 failing mean it's **"Answer Difference"** (method artifact). Check 4 failing means the study is **fundamentally flawed**. Check 5 failing requires **heavy hedging** regardless.

  **Honest Decision Point:** After step 5, the only remaining decisions are about **editorial judgment**: Is the "Answer Difference" *itself* interesting? Does the heavily hedged finding still offer value? Is the flawed study worth critiquing? The procedure doesn't decide this; it tells you what you *can* honestly say about the results.

  ---

  **Case Applications:**

  1.  **Trolley-Style Case (Small-scale community vs. WEIRD):**
      *   **1 (Intuition):** Often fails. Lab-based timing rare in field settings. "Gut reaction" hard to ensure. *Likely Fail -> Answer Difference.*
      *   **2 (Concept):** High risk. "Trolley," impersonal force, quantified sacrifice may lack resonance. Requires strong local validation. *Likely Fail without evidence -> Answer Difference.*
      *   **3 (Translation):** Probably passed (standard practice). Pass.
      *   **4 (Ambiguity):** Trolley vignettes often critiqued but usually clear *within context*. Pass.
      *   **5 (Sample):** Distinct populations? Pass. Power? Often low for small communities -> Hedge.
      *   **Result:** **Report as *Answer Difference*.** Likely fails Checks 1 & 2. Difference is real but reflects method/context, not necessarily deep intuition.

  2.  **No Difference on Culturally Specific Concept:**
      *   **1 (Intuition):** Same risk as Case 1. *Likely Fail -> Weakens "Intuition" claim.*
      *   **2 (Concept):** **Critical.** Did they validate the *culturally specific concept* (e.g., "karma," "mana") translates meaningfully to the *other* culture? High risk of **Fail** -> Participants might have answered randomly or misunderstood.
      *   **3 (Translation):** Pass (assumed).
      *   **4 (Ambiguity):** Depends on vignette, but concept mismatch (Check 2) overrides.
      *   **5 (Sample):** Null result needs HIGH power. Often inadequate -> Major Hedge.
      *   **Result:** **Report as *No Robust Difference Found*.** High risk of **conceptual mismatch (Check 2 Fail)** meaning the null result is uninformative, compounded by likely Check 1 Fail & power issues. Cannot claim shared intuition.

  3.  **"Perfect" Finding (Small Sample, Ambiguous Wording):**
      *   **1 (Intuition):** Unknown, likely unverified -> *Fail -> Answer Difference.*
      *   **2 (Concept):** Unknown, likely unverified -> *Fail -> Answer Difference.*
      *   **3 (Translation):** Unknown -> *Fail -> Answer Difference.*
      *   **4 (Ambiguity):** **Explicit Fail** (identified on inspection).
      *   **5 (Sample):** **Explicit Fail** (small sample).
      *   **Result:** **DO NOT PUBLISH as a finding, or HEAVILY HEDGE as exploratory.** Fails Checks 3 (assumed), 4, and 5 catastrophically, and likely 1 & 2. The finding is **uninterpretable** due to ambiguity and statistically unreliable. Commissioning/publishing it as presented would be misleading. The only honest options are: drop it, publish it *only* as an example of methodological pitfalls (not a result), or demand major revisions/retesting.

  **What the Procedure Cannot Settle:**
  *   The *philosophical significance* of any identified intuition or answer difference.
  *   Whether a measured "intuition" reflects deep cognition or cultural learning.
  *   Ultimate judgments about a study's overall worth if it fails some checks but offers other insights (though it dictates how findings *must* be framed).
