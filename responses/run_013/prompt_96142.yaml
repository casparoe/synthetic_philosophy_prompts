prompt: |-
  My roommate and I have been going around in circles about repugnant markets, and I want to figure out what I actually believe rather than just trading slogans. Going by gut: selling a kidney for cash is not fine, and I'd say that even when the seller is a fully informed adult and the money would genuinely change their life — so it's not just about coercion or desperation. But scalping concert tickets is fine by me, so is a hardware store charging $40 for a generator after a flood, and so is paying some guy to hold my place in the DMV line while I grab coffee. Paying a stranger to vote the way I tell them is not fine, and that one I feel in my bones. Paying a woman to carry a baby for me — commercial surrogacy, everyones consenting, she's paid well — I'm honestly torn but I lean fine. Paying a student for good grades is not fine. Paying a kid a dollar a book to read over the summer is fine. Paying someone to confess to a crime I committed is not fine. My tentative story is that you can buy goods and services, but you can't buy the exercise of something that's supposed to be done for its own sake or as a duty — a vote, a grade, a verdict — and you can't buy pieces of a person, which is maybe why the kidney bugs me. But I can't tell whether that's one principle or three duct-taped together, and the surrogacy case seems to slide right through it.

  So: is there a single principle, or a small set, that gets all of these, or close? For each clause, tell me which of my cases forces it — I want the case that motivates each piece, not just the abstract statement. Then apply whatever you land on to a case I haven't settled: paying someone who's broke to enroll in a risky first-in-human drug trial, where the fee is about a year's income for them. And be honest about which of my verdicts the principle can't save — I suspect at least one has to go, and I'd rather know which one and why.
reasoning: |-
  Okay, let me try to figure out what's going on here. The user is struggling with repugnant markets—situations where buying and selling certain things feels morally wrong even if all parties consent. They listed several examples: selling kidneys is bad, but scalping tickets or price gouging generators is fine. Paying for votes is bad, but paying kids to read is okay. Surrogacy is a gray area. They proposed a principle about not buying things that should be done for their own sake or duties, and not buying body parts, but it doesn't quite fit all cases.

  First, I need to break down their examples. Why is selling a kidney repugnant but surrogacy isn't? Both involve the body. Maybe it's about commodification vs. service. With surrogacy, you're paying for the service of carrying a baby, not the baby itself. But the kidney is a body part. That makes sense. Votes and grades are duties; paying for them corrupts their purpose. Paying for a placeholder in line is a service, no inherent duty there. 

  Then there's the drug trial case. Paying someone broke to be a test subject. If the fee is a year's income, it's coercive. But the user mentioned that coercion wasn't the only issue with kidneys. So maybe it's about exploiting vulnerability or degrading human dignity. The kidney sale is degrading because it turns the body into a commodity. The drug trial might be similar, but if it's framed as compensation for time and risk, not selling the body, maybe it's acceptable. But the vulnerability here is high, so it might still feel wrong.

  The user's initial principle had two parts: no buying duties (votes, grades) and no buying body parts. But surrogacy slips through because it's a service, not a body part. So maybe the principle needs refinement. Perhaps it's about commodification of intrinsic human attributes or functions. Votes and grades represent personal judgment; kidneys are integral to the body. Surrogacy is a service that uses the body, but doesn't commodify the person themselves. 

  Now, the drug trial: paying for risk and time. If the trial is risky, and the person is broke, it's exploitation. But if they're compensated fairly for their time and risk, not selling their health, it might be okay. But the vulnerability makes it tricky. The user needs to decide if the potential harm and exploitation outweigh autonomy. 

  Also, the user might have an inconsistency with paying for grades vs. paying for reading. Paying for grades corrupts education's purpose, but paying to encourage reading is incentivizing a good habit. So the context matters—whether the payment undermines intrinsic motivation or the institution's purpose. 

  In summary, the key principles are: no commodification of intrinsic human attributes (body parts, personal duties), no undermining essential social practices (voting, education), and no exploitation of vulnerability. Applying this to the drug trial, the high vulnerability and risk might make it repugnant, similar to kidney sales. But if safeguards are in place, it might be acceptable. The user has to weigh autonomy against exploitation.
answer: |-
  Here's a cohesive framework based on your intuitions, built around **two core principles** and **one boundary condition**, with each piece explicitly motivated by your cases:

  ### The Core Principles
  1. **Non-Commodification of Core Human Attributes/Relationships**:  
     *You can't buy/sell things that are deeply tied to human identity, dignity, or relationships that define personhood.*  
     - **Motivating Case: Selling a kidney.** This violates the idea that the human body (especially integral, non-regenerative parts) isn't a commodity. It treats a fundamental aspect of biological integrity as fungible.  
     - **Also Explains:** Paying for a false confession (commodifies moral agency/law), paying for votes (commodifies civic identity/duty).  

  2. **Non-Corruption of Essential Social Practices**:  
     *You can't introduce market logic into practices whose meaning/value depends on being non-transactional, duty-based, or intrinsically motivated.*  
     - **Motivating Case: Paying for grades.** This corrupts education's purpose (evaluating merit/knowledge) by replacing intrinsic/academic motivation with extrinsic payment.  
     - **Also Explains:** Paying for votes (corrupts democracy's deliberative duty), paying for false confessions (corrupts justice's truth-seeking function).

  ### The Boundary Condition
  **Vulnerability Constraint**:  
  *Even permissible markets become repugnant if they exploit severe vulnerability to bypass true consent.*  
  - **Motivating Case: Your unease about kidney sales despite "no coercion."** While kidney sales violate Principle 1, your insistence that it feels wrong *even if life-changing money* suggests vulnerability heightens repugnance. This isn't the *sole* reason, but it intensifies it.  
  - **Clarifies Surrogacy:** This is why you're torn. Surrogacy *might* violate Principle 1 (commodifying reproductive capacity?), but Principle 2 is weaker here (building families isn't corrupted by payment like voting/judgment). The vulnerability of potential surrogates makes it feel riskier.

  ### How It Handles Your Cases
  - **Scalping Tickets / $40 Generators / Line Holding:**  
    *✅ Permissible.* Commodifying goods (tickets, generators) or simple services (time/position) doesn't violate core human attributes or corrupt essential practices.  
  - **Selling a Kidney:**  
    *❌ Forbidden.* Violates Principle 1 (commodifies body) + Vulnerability Constraint (often exploits desperation).  
  - **Paying for Votes:**  
    *❌ Forbidden.* Violates Principle 2 (corrupts democratic duty).  
  - **Commercial Surrogacy:**  
    *⚠️ Contested but Leans Permissible.* Doesn't *clearly* violate Principle 1 (arguably compensates labor/service, not the *child* or core identity). Principle 2 doesn't strongly apply. Vulnerability Constraint is the main worry.  
  - **Paying for Grades:**  
    *❌ Forbidden.* Violates Principle 2 (corrupts educational practice).  
  - **Paying Kids to Read:**  
    *✅ Permissible.* Doesn't corrupt reading's inherent value (incentivizes engagement, doesn't replace evaluation/judgment). Low stakes.  
  - **Paying for False Confession:**  
    *❌ Forbidden.* Violates Principle 1 (commodifies moral agency) *and* Principle 2 (corrupts justice).

  ### Applying to the Drug Trial Case
  *Paying someone broke to enroll in a risky first-in-human drug trial (fee = 1 year's income):*

  1.  **Principle 1 (Commodification):**  
      Selling *risk to one's health/body* edges close to commodifying biological integrity. Unlike surrogacy (service), this directly markets physical vulnerability.
  2.  **Principle 2 (Corruption):**  
      Medical research *depends* on trust and ethical participation. High payment could corrupt informed consent by overshadowing risk comprehension (essential practice).
  3.  **Vulnerability Constraint:**  
      **This is decisive.** The participant's poverty ($ = 1 year's income) creates an offer they *can't* reasonably refuse, undermining true voluntariness. It exploits desperation to accept extreme risk.

  ***Verdict:*** **Likely Repugnant.** The extreme vulnerability enabling the transaction pushes it over the line, even if the research itself is valuable. It risks commodifying bodily integrity *and* exploits severe need to bypass genuine consent for high risk. (This aligns with widespread bioethics concerns).

  ### Which of Your Verdicts Might Have to Go?
  Your framework **struggles most with surrogacy**. If selling a kidney violates Principle 1 (commodifying the body), surrogacy arguably does too by commodifying reproductive capacity. To maintain consistency:

  - **Option 1 (Strict):** Surrogacy must also be repugnant. Principle 1 applies equally to kidneys and reproductive labor as core human attributes.
  - **Option 2 (Distinction):** Argue surrogacy compensates a *service* (gestation) over time, not the *sale of body parts* or *the child*. It's closer to compensated service than organ commodification. This requires a finer line within Principle 1.

  **Your "gut" (leaning fine) suggests Option 2.** You likely see surrogacy as a profound but *temporary service* fostering creation, not the sale of an intrinsic bodily attribute. This distinction holds *if* you rigorously separate the service from the body part/child. The Vulnerability Constraint remains the critical safeguard.

  ### Why This Works
  This framework explains your intuitions better than "duty for its own sake" alone (which doesn't cover kidneys) or "pieces of a person" alone (which doesn't cover votes/grades). It captures why **corruption of social practices** (voting, grading, justice) and **commodification of the human essence** (body, moral agency) feel distinct from ordinary commerce, while **vulnerability** acts as an amplifier. It also explains your discomfort with cases like the drug trial where vulnerability is extreme. The surrogacy tension reveals the need for careful definition within Principle 1, but your initial intuition can be preserved with a service-based interpretation.
