prompt: |-
  Ive been arguing with a friend about evolutionary debunking and I've realized my gut verdicts dont fit any of the standard positions, so I want to know what principle they actually add up to. Case by case, here's what I really think:

  - Promise-keeping. Breaking a promise is wrong even when nobody will ever find out, and I'm told our tendency to keep them is basically reputation management. Verdict: not undermined at all.
  - My own kids. I'd pull my kid out of a fire before two strangers' kids, and I think that's not just permissible but right. Nepotism obviously has an evolutionary story. Verdict: not undermined.
  - My countrymen. I don't think a citizen's life matters more than a foreigner's, and when I catch myself feeling otherwise I treat it as a bias to correct. Near as I can tell the tribal instinct has the same sort of pedigree as the parental one. Verdict: undermined.
  - Incest between two adults who use contraception. I think it's wrong, but when I press on why, all I find underneath is revulsion, and I know the revulsion has a selection story (something about siblings raised together not being attracted to each other). Verdict: this is the one where I feel the belief getting shaky.
  - Gratitude. You owe something to someone who helped you at real cost even if they never learn you were ungrateful. Evolved, surely. Verdict: not undermined.
  - Animal cruelty. Torturing a dog for fun is wrong and I honestly cannot find an evolutionary story for it. Verdict: not undermined, and if anything the missing story makes me trust it more.
  - Eating meat. I don't think it's wrong, and I notice the people who do think so mostly got there by reading and reasoning rather than instinct, which makes me trust that belief less rather than more. Verdict: not undermined (the meat-is-fine one).

  My half-formed rule is this: a belief is undermined if the process that produced it doesn't track the truth, i.e. it would have produced the belief whether or not the belief was true. But that seems to undermine all of them equally, since reputation management doesn't track the truth either, and it also says the meat verdict should flip, which I don't feel at all.

  So is there a principle, or a small set of them, that gets all seven, or close? Which of my verdicts does it force me to give up? For each part of the principle, tell me which of my cases is doing the work, and then say what it predicts for two I haven't listed: (a) that a stranger's pain counts as much as my kid's, which I'd defend to the death and which is the exact opposite of what I'd expect evolution to have handed me, and (b) that we owe something to people who wont be born for two hundred years.
reasoning: |-
  Okay, let me start by unpacking the user's query. They've been arguing about evolutionary debunking and have these seven cases where their gut reactions don't align with standard positions. They want a principle that explains all their verdicts and also applies to two additional scenarios. 

  First, I need to understand each case. For promise-keeping, they think it's not undermined even though it's tied to reputation management. Same for prioritizing their own kids—nepotism has an evolutionary basis, but they see it as morally right. But for countrymen, they feel tribalism is a bias to correct. Incest is where they feel shaky because the revulsion seems evolutionarily based. Gratitude and animal cruelty aren't undermined, but eating meat being permissible isn't undermined either, even though it's a reasoned belief.

  Their proposed rule is that beliefs are undermined if the process doesn't track truth. But that rule would undermine all of them, which isn't what they feel. So where's the inconsistency? 

  Looking deeper, maybe the key is whether the moral intuition can be justified post hoc with reasons that align with their broader values. For promises and kids, they might see them as aligning with commitments they endorse—like trust for promises and care responsibilities for kids. Tribalism, however, conflicts with equality, so it's rejected. Incest's revulsion isn't backed by any harm, so it's undermined. Gratitude fits reciprocal relationships they value, while animal cruelty is inherently harmful. Eating meat permissibility might be accepted because they don't see moral weight in animals beyond suffering, which is already managed (in their view).

  The additional scenarios: (a) a stranger's pain vs. kid's. They claim the stranger's pain matters equally, which contradicts evolutionary instincts. But they endorse this as a reasoned moral stance, so not undermined. (b) Future generations. They might feel obligations here, which could be based on impartiality principles they accept, so again not undermined. 

  The common thread is reflective endorsement: if an intuition survives scrutiny and aligns with their considered values, it's not undermined. Evolution explains the origin, but post-hoc justification determines if it's kept. This explains all cases without contradiction. Their meat-eating stance is based on reasoning that passes their scrutiny, so it's accepted despite being non-instinctive. 

  They might also value consistency across cases. Tribalism is rejected because it's inconsistent with the impartiality they apply elsewhere. Incest's revulsion lacks a harm basis, so it conflicts with their harm-based morality. 

  So the principle is: Moral intuitions are undermined when they conflict with reflectively endorsed values or lack a justifiable reason beyond evolutionary origins. Evolution isn't the debunker; inconsistency with one's ethical framework is.
answer: |-
  Your intuitions reveal a sophisticated, **value-coherentist** approach to evolutionary debunking, centered on **reflective endorsement after scrutiny**. The core principle is:

  **"A moral intuition is undermined by its evolutionary origin *only if* it conflicts with my reflectively endorsed values *and* cannot be independently justified through reason, harm-prevention, or impartial moral foundations."**

  This principle explains all seven cases and handles your additional scenarios. Below is the breakdown:

  ---

  ### **The Principle in Detail (With Case Drivers):**
  1. **Reflective Endorsement (Drivers: Countrymen, Incest)**  
     Intuitions are rejected if they conflict with your core values *after scrutiny*. Tribalism ("countrymen") conflicts with impartiality/equality (a value you endorse), so it's undermined. Incest revulsion lacks a rational/harm-based justification under scrutiny, so it feels shaky.

  2. **Harm/Suffering as Anchor (Driver: Animal Cruelty)**  
     Intuitions grounded in preventing harm/suffering are robust. Animal cruelty is inherently harmful, so its evolutionary opacity doesn't matter. This also protects "gratitude" and "promise-keeping" because they prevent relational harm (betrayal, broken trust).

  3. **Special Obligations (Driver: Own Kids)**  
     Roles/relationships create non-transferable duties (e.g., parenthood). Evolution explains the *origin* of nepotism, but the duty itself coheres with your endorsed value of "care for dependents." Thus, it's not undermined.

  4. **Reason vs. Intuition (Driver: Eating Meat)**  
     Beliefs *arrived at by reason* aren't inherently less trustworthy than intuitions. You reject meat-is-wrong *because* its proponents rely on abstract reasoning disconnected from harm (in your view), not because reasoning is suspect. This also explains why incest feels shaky—it's *only* intuition, with no reasoned defense.

  5. **Impartiality as Chosen Value (Driver: Countrymen)**  
     You consciously elevate impartiality (e.g., foreigners ≈ citizens). Intuitions violating this are biases to correct. Evolution doesn't undermine impartiality—it *explains* why it's hard to achieve.

  ---

  ### **Predictions for Your Scenarios:**
  - **(a) Stranger's pain vs. Kid's pain:** **Not undermined.**  
    Your belief in equal moral weight is a *reflectively endorsed value* (impartiality), even if evolution primed you for partiality. It coheres with your rejection of tribalism and is justified by reason (e.g., utilitarianism, Kantian universalization). Evolution explains the *conflict* but doesn't debunk the *principle*.

  - **(b) Duties to future generations:** **Not undermined.**  
    This aligns with impartiality (their interests matter equally) and harm-prevention (e.g., preventing climate catastrophe). It may lack an evolutionary basis (we're wired for short-term thinking), but it’s justified through reason and coherent with your other values. If you felt "they're strangers, why care?", evolution would explain that bias—but you'd reject it.

  ---

  ### **Why Your Proposed Rule ("Doesn't Track Truth") Fails:**
    - It *would* undermine all evolved intuitions equally (as you noted).  
    - It can't distinguish your cases: e.g., "reputation management" for promises *doesn't* track moral truth, yet you don’t reject promise-keeping.  
    - **Your actual principle is richer:** Evolution is a red flag, not a verdict. You ask: *"Can this intuition survive scrutiny and cohere with my moral framework?"* If yes, it stands.

  ---

  ### **Which Verdicts Might Need Adjustment?**
  Your principle is consistent *except*:
  - **Eating meat:** If "meat-is-fine" relies on *ignoring* harm (e.g., factory farming suffering), it *should* be undermined per your harm/anchor. But if you genuinely see no significant harm (e.g., "humane" slaughter), it holds.  
    *Your stance works only if you reject the premise that eating meat causes unjustified harm.*  
  - **Incest:** Your shaky feeling is warranted. If you can't find harm beyond revulsion (and it's consensual/contracepted), your principle demands rejecting the intuition.

  ---

  ### **Key Insight**
  You’re not an evolutionary skeptic; you’re a **moral naturalist** who uses evolution to *test* intuitions against your values. When Sharon Street asks, "Would evolution produce these beliefs even if false?", you counter: **"Does this belief serve values I affirm, regardless of its origin?"**  
  This lets you keep promise-keeping (valuing trust), parental care (valuing responsibility), and impartiality (valuing fairness)—while discarding tribal bias or groundless disgust.
