prompt: |-
  I sit as the philosopher on a state licensing board's character-and-fitness panel; the other six members are practitioners and lay appointees. We decide about forty cases a year — applicants with convictions, academic-integrity findings, unpaid judgments, disciplinary actions — in roughly thirty minutes per file, and we must give written reasons that a court can review. Our sanctions run from admission with conditions to denial. The question we keep fumbling is the one the situationist literature was built to embarrass: what can a record of behavior tell us about someone's character? I need a decision procedure my non-philosopher colleagues can actually run, and I want it to take the situationist evidence seriously rather than argue it away. So the procedure should respect four points. First, the classic experiments establish inconsistency mainly in weak situations — low stakes, no observers, no prior commitment — so the strength of the situation the applicant was actually in is itself evidence. Second, on the trait-activation picture from industrial psychology, a disposition shows itself only when the situation supplies trait-relevant cues, so the procedure must ask what cues the applicant's surroundings offered. Third, those experiments arguably test for a global, cross-situational consistency that virtue ethics never required: on the Aristotelian model a virtue is a trained skill organized by practical wisdom, not a habit obliged to fire everywhere. Fourth, a disposition that explains little is still a disposition — the real question is how much weight one trait can bear, not whether it exists.

  Give me the procedure with its questions in order, what counts as a sufficient answer at each step, where it stops with a denial, and where it hands the decision back to the panel as a judgment call. Then run it on three applicants: a decade-old DUI with nothing since; three academic-integrity findings at two institutions; and theft from an employer to cover a dependent's medical costs, disclosed candidly. At least one result should be one I won't like. Since character is formed by practice, say what our conditions are meant to do, and where the procedure is really predicting future conduct under situations rather than judging who someone is. And say where it will misfire — whether it can tell a character defect from a badly designed environment, and what the panel should do when it can't. Tell me how confident you are in the procedure and its applications, and single out the point you are least sure of.
reasoning: |-
  Okay, let me approach this systematically. The user is a philosopher on a licensing board dealing with character assessments, needing a practical framework that incorporates situationist psychology while remaining legally defensible. 

  First, I need to consider the core tension: how to evaluate past behavior as evidence of character without falling into trait-based assumptions that situationism critiques. The user explicitly wants to avoid "arguing away" the Milgram/Stanford-type evidence. 

  The four key points from the user's request are crucial: 
  1) Situation strength matters (weak vs strong situations)
  2) Trait activation requires environmental cues
  3) Virtues as context-sensitive practical skills, not global traits
  4) Dispositions exist even with small effect sizes

  I'm structuring the procedure around these pillars. The decision tree should start by filtering out cases where the situation was overwhelmingly strong (pro/con), then examine whether trait-relevant cues were present, then consider the behavioral pattern through an Aristotelian lens. 

  For the DUI case - it's tempting to dismiss as isolated, but we must confront why it's different from Milgram. The key is that driving drunk involves repeated conscious choices without direct coercion. The situational strength is moderate at best. 

  The academic dishonesty triplet is tricky - three instances across institutions suggests a pattern, but we must ask about cue consistency. If the cheating methods varied (plagiarism vs exam cheating), it might indicate poor practical wisdom rather than dishonesty per se. 

  The medical theft case will test the limits - strong situational pressure but also clear violation of norms. The procedure should flag this for panel judgment since the "good reasons" criterion conflicts with the act's severity. 

  The confidence section needs to acknowledge the fundamental uncertainty: we're predicting future conduct based on reconstructed past situations. The weakest point is distinguishing character flaws from bad environments - sometimes we just can't know. 

  Conditions imposed should focus on creating "strong situations" that scaffold good conduct until wisdom develops. This admits we can't change character directly, only design environments to activate better dispositions. 

  For the disliked outcome, I'm making the academic dishonesty case lead to denial to challenge the user - showing that clustered behavior in cue-rich environments can indicate poor practical wisdom even without ill intent.
answer: |-
  Here's a decision procedure incorporating your constraints, followed by applications to your cases, analysis, and limitations:

  **Decision Procedure: The Situated Character Assessment (SCA)**

  1.  **Was the behavior compelled by an overwhelmingly strong situation?**
      *   *Question:* Did the situation leave the applicant with *no reasonable alternative* or involve extreme coercion (physical threat, severe mental distress, institutional command structure)? (e.g., Milgram, Stanford Prison strong-conformity conditions).
      *   *Sufficient Answer (Pro-Situational):* Clear evidence of direct, overwhelming coercion, imminent physical danger to self/others, or institutional command overriding judgment with severe consequence for refusal. **Stop: Likely Admission (possibly with monitoring for trauma/PTSD impact)**.
      *   *Sufficient Answer (Against Situational):* Alternatives existed (even if difficult/unpleasant), no direct/imminent physical threat, no overriding command structure. **Proceed to Step 2**.
      *   *Insufficient/Unclear:* Ambiguous evidence. **Proceed to Step 2, flag for panel review if central to case.**

  2.  **Did the situation contain strong, trait-relevant cues?**
      *   *Question:* What specific environmental cues were present that could activate the disposition relevant to the concerning behavior? (e.g., opportunity + low detection risk for dishonesty; peer pressure/norms for misconduct; high stress + ambiguity for poor judgment; clear rules + high stakes for integrity).
      *   *Sufficient Answer (Cues Absent/Weak):* Trait-relevant cues were demonstrably minimal or absent (e.g., cheating allegation in an unsupervised, low-stakes context with no peer pressure *might* show weaker disposition if cues were absent). **Proceed to Step 3, leaning towards mitigation.**
      *   *Sufficient Answer (Cues Present/Strong):* Clear evidence of strong cues directly relevant to the concerning behavior (e.g., high-pressure sales job with incentives for fraud; academic environment with clear honor code and proctored exams; fiduciary role with access to funds). **Proceed to Step 3, leaning towards significance.**
      *   *Insufficient/Unclear:* Difficulty assessing cues. **Proceed to Step 3, flag for panel review.**

  3.  **Does the pattern indicate a lack of context-specific practical wisdom?**
      *   *Question:* Considering *this specific domain* (e.g., financial responsibility, academic integrity, substance use, honesty under pressure), does the record show:
          *   a) A *single, isolated* lapse with mitigating circumstances and demonstrable learning/growth?
          *   b) A *repetitive pattern* despite varying cue-strength or situation-type *within the domain*?
          *   c) A *failure to recognize the relevant moral dimensions* of the situation?
      *   *Sufficient Answer (a):* Truly isolated incident, significant time elapsed, compelling evidence of insight, remediation, and changed behavior *in that domain*. **Stop: Likely Admission (possibly with conditions relevant to domain)**.
      *   *Sufficient Answer (b or c):* Repetition *within the domain* (even if cues vary) OR evidence of fundamental failure to grasp the moral stakes (e.g., "everyone does it," blaming victims, minimizing harm). **Stop: Likely Denial or Highly Restrictive Conditions.**
      *   *Insufficient/Unclear:* Pattern ambiguous (e.g., multiple incidents but clustered in time/context, some remediation but incomplete). **Hand back to Panel: Judgment call on practical wisdom deficit in the domain.** Consider nature/severity, time, remediation, insight.

  **Applying the SCA:**

  1.  **Decade-Old DUI, Nothing Since:**
      *   **Step 1:** Not compelled. Alternatives existed (taxi, designated driver, not drinking). Proceed.
      *   **Step 2:** Moderate-to-Strong Cues. Alcohol consumption impairs judgment (internal cue), driving is habitual (low perceived monitoring?), but laws/rules are clear (strong counter-cue). Leans slightly towards significance.
      *   **Step 3:** Appears to be **(a) Isolated lapse** *in the substance use/judgment domain*. Significant time (10 years), no recurrence, likely remediation (e.g., classes, abstinence). **Result: Admission, likely with condition like mandatory monitoring/reporting for X years (scaffolding sobriety).** *You might dislike the condition, arguing "nothing since" proves change, but SCA sees the condition as supporting future conduct in high-risk situations (stress, social drinking) rather than doubting past change.*

  2.  **Three Academic-Integrity Findings at Two Institutions:**
      *   **Step 1:** Not compelled. Proceed.
      *   **Step 2:** **Strong/Consistent Cues Present.** Academic environments inherently contain strong cues for integrity: explicit honor codes, clear rules (plagiarism, cheating), high stakes (grades, graduation), proctoring, peer norms (varying). Moving institutions didn't change the core cues of the *academic integrity domain*.
      *   **Step 3:** Clearly **(b) Repetitive pattern within the domain** despite strong counter-cues present in the situation. Shows a concerning lack of practical wisdom *specifically regarding academic honesty*, regardless of minor variations in *how* cheating occurred. Remediation likely superficial if behavior repeated. **Result: Likely Denial.** *This is the result you might dislike – it suggests a character defect relevant to professional trustworthiness in knowledge-based fields. SCA focuses on the domain-specific failure of practical wisdom under consistent cue conditions.*

  3.  **Theft from Employer to Cover Dependent's Medical Costs (Candid Disclosure):**
      *   **Step 1:** **Not Compelled.** While the *motive* was powerful (medical need), alternatives existed (loans, charity, payment plans, candid plea to employer). No *physical coercion*. Proceed.
      *   **Step 2:** **Mixed Cues.** Extremely strong cue for dishonesty/theft: fiduciary role, trust, clear rules/property rights. **BUT:** Extremely strong countervailing cue activating compassion/desperation: imminent harm to a loved one. High stakes, high emotional distress.
      *   **Step 3:** **Insufficient/Unclear Pattern.** Single incident. Candor *now* shows some insight, but the act itself shows a profound lapse in practical wisdom *under extreme pressure in the honesty domain* – choosing theft over other (difficult) options. Severity is high. **Hand back to Panel:** Judgment call. Did the applicant truly lack alternatives? Is their remorse/candor deep? Can they be trusted with fiduciary duties under future stress? Panel must weigh the significant mitigating motive against the severity of the act and the domain (honesty in employment). Conditions (e.g., supervision, financial monitoring) likely if admitted.

  **Purpose of Conditions & Prediction:**
  *   **Purpose:** Conditions are **situational scaffolds**, not punishments. They create "strong situations" (high accountability, clear monitoring, structured support) designed to *activate and support* desired behaviors (honesty, sobriety, sound judgment) while the applicant *practices* the practical wisdom they may lack. They compensate for identified domain-specific vulnerabilities revealed by past behavior in weaker/mixed situations.
  *   **Prediction vs. Judgment:** SCA explicitly **predicts future conduct under probable professional situations** rather than judging "who someone is." It asks: "Given this past behavior *in specific situations*, and considering the situations they will face (licensure demands), what scaffolds or restrictions are needed to reasonably ensure ethical conduct?" It acknowledges character is dynamic and shaped by future practice *within* structured environments.

  **Where it Misfires & Panel Response:**
  1.  **Misfire: Bad Environment vs. Defect:** SCA struggles most when a **pattern** exists *but* can be plausibly attributed *entirely* to a persistently toxic environment (e.g., systemic pressure to cut corners in prior workplace, abusive relationship impacting judgment). Step 2 (cues) helps, but isolating individual character from systemic failure is hard.
  2.  **Panel Response When Unsure:**
      *   **Focus on Future Risk in *Licensure* Context:** Does the *pattern*, regardless of origin, indicate an unacceptable risk *in the specific situations* the licensed role will entail (trust, autonomy, pressure)?
      *   **Demand Robust Remediation Evidence:** Require concrete proof the applicant understands *and* has developed strategies to resist the negative environmental influences.
      *   **Impose Strong Situational Scaffolds:** Design conditions that explicitly counteract the prior negative environment (e.g., strict supervision, mandatory ethical consultations, restricted scope of practice).
      *   **Err on Caution if Risk is High:** If the behavior was severe/harmful and the environment link is weak or the remediation unconvincing, denial may be necessary.

  **Confidence & Weakest Point:**
  *   **Overall Confidence:** Moderately High. SCA directly addresses your 4 points, provides a workable structure, focuses on prediction/situations, avoids global trait assumptions, and offers clear off-ramps. It's legally defensible as it uses evidence (situation, pattern, cues) for reasoned decisions.
  *   **Weakest Point:** **Step 3 - Assessing Practical Wisdom Deficit.** Distinguishing a profound single lapse in wisdom under duress (mitigating) from a revealing pattern of poor judgment (damning) is inherently subjective, especially with mixed motives/cues (like the theft case). Relying on "domain-specific" patterns helps, but the line between "isolated + learned" and "revealing pattern" remains a judgment call, forcing frequent panel referrals. This is where bias or philosophical leanings most easily creep in.
  *   **Confidence in Applications:** High for DUI (clear). High for Academic Dishonesty (pattern + consistent cues = clear deficit). Lower for Theft – the panel judgment call is crucial and reasonable people could disagree, demonstrating the procedure's boundary.

  This procedure forces explicit consideration of situational strength and cues, respects virtue as domain-specific practical wisdom, avoids denying the existence of dispositions while questioning their predictive weight in isolation, and provides a structured, reviewable rationale. It acknowledges that you are licensing future conduct in foreseeable situations, not passing final judgment on a soul.
