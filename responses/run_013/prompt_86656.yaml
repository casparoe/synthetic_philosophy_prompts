prompt: |-
  Okay so I've been lurking on LessWrong and the old Overcoming Bias archives since like 2011, and I keep getting into these arguements in the comments about "indirect normativity" — you know, the move where instead of trying to directly figure out what's right, you say the right thing is whatever we'd all end up agreeing on if we were wiser and better informed and more coherent, and then you act on some proxy that you hope tracks that. I want to turn this into a decision tree I can actually post, so people can figure out which position they secretly hold instead of just repeating the slogan at each other.

  Here's what I want: a tree whose root is a commitment almost everyone in this fight shares, where every branch node is a yes/no question about the idealization, phrased so someone can answer it without already knowing which position it leads to. Please don't just list "Kantian constructivism, ideal observer theory, CEV, etc" and call it a taxonomy — build it from the questions first, then drop the names in at the leaves. This is for a forum post so keep it readable.

  Some distinctions I really want on the tree, because I think these are the ones that actually seperate people:
  - Whether there's a fact of the matter about what we ought to do that holds even under idealization, or whether the idealization is what makes it true. I.e. is the idealized reasoner discovering something or creating it?
  - What "idealized" even means: perfect info plus perfect logic (input-side) versus "whatever they converge on" (output-side). I'm pretty sure these come apart and people conflate them constantly.
  - Whether idealized reasoners are guaranteed to converge. If they aren't, the view either goes indexical — each agent's own idealization is authoritative for that agent, which smells like relativism — or actualist — the real historical convergence is what counts, which seems to make moral progress depend on luck.
  - The epistemic constraint: can you be obligated to do something you couldn't possibly know you're obligated to do? Say no and you get pushed into needing a proxy, which is basically the indirect-normativity move. Say yes and you've got the horn where there are moral facts nobody could ever access.

  I'd like at least these as leaves: ideal-observer theory, a Kantian-style constructivism, the coherent-extrapolated-volition / indirect-normativity family, plain moral realism where idealization is just a heuristic for finding a procedure-independent truth, an indexical/relativist option, a deflationist "no fact of the matter, the idealization is a useful fiction" option, and a non-ideal-theory option that just denies the whole setup. But don't feel locked to those names — if the questions generate a leaf that doesn't have a name yet, mark it "unnamed" and tell me what it would commit you to.

  Use at least two concrete cases to force the sorting, not just abstract questions. Something like: a pill that makes you reason flawlessly for 24 hours — are its outputs binding on you, and are they binding on the person who didn't take it? And: two agents who are each perfectly rational, fully informed, and still disagree — what does your view say about them? If your view can't even describe that case, that's informative, say so.

  Also flag any two leaves the tree can't actually separate with the questions you've got, instead of pretending they're distinct. And for any combo of answers that nobody seems to occupy, tell me whether that's because it's incoherent, just unattractive, or simply unexplored.

  Last thing: tell me how confident you are in the tree as a whole, and single out the one branch or leaf you're least sure about — like where a real philosopher would probably say I've mislabeled it.
reasoning: |-
  Okay, the user wants a decision tree about indirect normativity for a LessWrong forum post. They've been debating this since 2011 and need a tool to clarify positions without jargon. 

  First, I notice they're frustrated with recurring arguments where people talk past each other using slogans. The tree must force concrete distinctions through questions, not labels. Their four requested distinctions are sharp: discovery vs creation of morality, input vs output idealization, convergence guarantees, and epistemic constraints. 

  Hmm... they want at least seven leaf positions but warn against forcing labels. The two test cases (reasoning pill and rational disagreement) are clever - they'll expose inconsistencies. I should watch for positions that collapse under those cases. 

  The user's clearly versed in this - mentioning CEV, Kantian constructivism etc. But they're tired of name-dropping. The tree must stand on questions first. I'll need to phrase each branch so it's answerable without specialized knowledge. 

  Biggest challenge: making the "idealized reasoner" branch unambiguous. People conflate "perfect inputs" with "convergent outputs" constantly. The pill case should help split that. Also tricky: handling positions where convergence isn't guaranteed. That's where relativism or luck-based morality emerges. 

  I'm least confident about the "non-ideal theory" leaf. Some philosophers might argue it's not even in the same category. But the user insisted on including it as a rejection of the framework. 

  For combos: "Output-focused + Convergence + No Epistemic Constraint" might be unexplored. Who believes idealization creates morality that's inaccessible? Probably unattractive. 

  Structure-wise: starting with realism vs anti-realism is safe. Then drilling into the anti-realist branch with their four distinctions. The test cases will anchor each leaf. 

  Should flag that Kantian constructivism and ideal observer theory might blur under some answers - both are input-focused but differ on discovery. The pill case clarifies: Kantians would say the pill's output binds only the taker if will is central. 

  Final tree should let readers confront their own assumptions. Like if someone says "morality is what we'd agree on if rational" but denies convergence is guaranteed... boom, they're in relativism-land whether they like it or not.
answer: |-
  Here's a decision tree built from your specifications, designed to force concrete distinctions using your test cases. **Bold branches** indicate key questions, *italicized text* explains implications, and **LEAF NODES** are labeled at the end. I'm ~85% confident in the overall structure, but the "Kantian Constructivism" leaf is the most contentious (discussed later).

  ---

  ### Decision Tree: What Is the Authority of Idealized Reasoning?

  **Start:** "There is *some* sense in which we 'ought' to do what an idealized version of ourselves (or humanity) would endorse."

  1. **Is this 'ought' ultimately grounded in a mind-independent truth?**  
     - **Yes** → Moral realism. Go to Q2.  
     - **No** → Anti-realism. Go to Q3.  

  **Test Case 1: The Reasoning Pill**  
  You take a pill granting 24 hours of flawless reasoning + perfect information. It outputs: "Donate 90% of your wealth to X."  
  - Must you obey? Why?  
  - Must someone who *didn't* take the pill obey your output?  

  **Test Case 2: Persistent Disagreement**  
  Two agents (A+B) are individually flawless reasoners with perfect information, yet they irreconcilably disagree on a moral claim.  
  - Does morality require A to act as A endorses, B as B endorses?  
  - Is one objectively wrong?  
  - Is morality undefined here?  

  ---

  #### Branch: Moral Realism (Q1=Yes)
  2. **Does the idealization *discover* or *approximate* a procedure-independent moral truth?**  
     - **Discovers** (Idealization is an epistemic tool):  
       - *Pill Case:* Output is *evidence* of truth, not binding if flawed. Others need not obey unless convinced.  
       - *Disagreement Case:* Impossible (by definition). If A+B disagree, at least one isn't truly ideal.  
       - **LEAF: Standard Moral Realism** (Idealization as heuristic)  
     - **Approximates** (Truth = output of idealization):  
       - *Pill Case:* Output is binding *if* pill achieves true idealization. Others must obey if they recognize its validity.  
       - *Disagreement Case:* Impossible (convergence guaranteed).  
       - **LEAF: Unnamed "Idealization-Constituted Realism"** → Rare; conflates realism with constructivism.  

  ---

  #### Branch: Anti-Realism (Q1=No)
  3. **What makes the idealization "ideal"?**  
     - **Input-focused:** Perfect information + flawless reasoning/logic.  
       - Go to Q4.  
     - **Output-focused:** Whatever agents converge on after reflection (even if logic/info is imperfect).  
       - *Pill Case:* Output is binding only if it reflects what you'd converge on long-term. Others need not obey.  
       - *Disagreement Case:* Go to Q5.  
       - **LEAF: Coherent Extrapolated Volition (CEV)** / Indirect Normativity  

  4. **Can idealized agents *discover* normative truths, or does idealization *create* them?**  
     - **Discovers** (Mind-independent structure):  
       - *Pill Case:* Output binding if correct. Others must obey if they seek truth.  
       - *Disagreement Case:* Impossible (truth is unique).  
       - **LEAF: Ideal Observer Theory** (Normativity as response-dependent truth)  
     - **Creates** (Normativity emerges from ideal procedure):  
       - *Pill Case:* Output binding *because* it results from ideal procedure. Others need not obey (procedure is personal).  
       - *Disagreement Case:* Go to Q5.  
       - **LEAF: Kantian Constructivism** → Authority from rational *will*, not truth.  

  5. **Must all idealized agents converge?**  
     - **Yes** → *Disagreement Case:* Incoherent under this view.  
       - **LEAF: Unstable Position** → Anti-realism + input-focus + creation implies possible disagreement.  
     - **No** → Go to Q6.  

  6. **What resolves disagreement?**  
     - **Indexical:** Each agent follows their *own* idealization.  
       - *Pill Case:* Binding only on you. Others ignore it.  
       - *Disagreement Case:* A acts as A endorses, B as B endorses. Neither wrong.  
       - **LEAF: Moral Relativism / Indexical Authority**  
     - **Actualist:** Follow the *actual* historical idealization of the relevant group.  
       - *Pill Case:* Output binding only if it matches what humanity *will* converge on.  
       - *Disagreement Case:* Whoever aligns with future convergence is "right" (unknowably).  
       - **LEAF: Actualist Convergence** → Moral progress depends on luck.  

  ---

  #### Rejection Branch (Denies Start Premise)
  - **Idealization is irrelevant or harmful:** Normativity must address *actual* humans in *actual* conditions.  
    - *Pill Case:* Output is advice, not binding. Others ignore it.  
    - *Disagreement Case:* Moral truth depends on non-ideal theory (e.g., power, context).  
    - **LEAF: Non-Ideal Theory / Real-World Pragmatism**  

  ---

  ### Key Diagnostics from Test Cases
  | **Position**               | **Pill Binding on You?** | **Pill Binding on Others?** | **Disagreement Resolution**               |  
  |----------------------------|--------------------------|-----------------------------|------------------------------------------|  
  | **Moral Realism (Heuristic)** | No (evidence only)       | No                          | One agent is non-ideal                   |  
  | **Ideal Observer**         | Yes                      | Yes (if they seek truth)    | Impossible                               |  
  | **Kantian Constructivism** | Yes                      | No                          | Each follows own will (relativism-lite) |  
  | **CEV / Indirect Norm.**   | Only if stable           | No                          | Convergence defines truth               |  
  | **Indexical Relativism**   | Yes                      | No                          | No resolution; per-agent truth          |  
  | **Actualist Convergence**  | Only if matches future   | Only if matches future      | Future convergence defines truth        |  
  | **Non-Ideal Theory**       | No                       | No                          | Context/power determines action         |  

  ---

  ### Unseparated Leaves & Unoccupied Combos
  1. **Kantian Constructivism vs. Ideal Observer Theory**:  
     - These *can* be separated via Q4 (discovery vs. creation). Kantians deny mind-independent truths; Ideal Observers accept response-dependent truths.  
     - *But*: Some philosophers lump them. The pill case clarifies: Ideal Observers say the pill's output binds *everyone*; Kantians say it binds only the taker.  

  2. **Unoccupied Combo: Output-focused + Convergence Guaranteed + No Epistemic Constraint**  
     - *Why*: Output-focused views (like CEV) require convergence for objectivity. If convergence is guaranteed, the epistemic constraint becomes irrelevant. This combo is redundant.  

  3. **Unoccupied Combo: Input-focused + Anti-realism + Convergence Denied**  
     - *Why*: If idealization is input-focused but convergence isn't guaranteed (Q5=No), anti-realism forces indexicality (Q6). But this is just **Kantian Constructivism** (leaf already covered).  

  ---

  ### Confidence & Weak Points
  - **Overall Confidence: 85%**  
    - Tree isolates your core distinctions using concrete cases.  
  - **Weakest Leaf: Kantian Constructivism**  
    - *Problem*: Some Kantians insist their view is "objective," blurring with realism. But the pill case (binding only on the agent) and disagreement case (no convergence required) force it into anti-realism. A philosopher might protest this is reductive.  
  - **Unexplored Territory**: **Actualist Convergence** (e.g., "morality is whatever humanity *will* agree on"). Rarely defended due to luck-dependency.  

  ---

  ### How to Use This
  Post the tree with instructions:  
  > "Start at the root. Answer each **bold question** based on your intuition about the test cases. Follow the arrows to your leaf. Disagreements? Check if you answered a question differently."  

  This forces engagement with the *structure* of idealization, not labels. The test cases prevent evasive answers. Let me know if you want tweaks!
