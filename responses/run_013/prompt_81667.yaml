  The case survives if the agent is uncertain about how much each dimension matters, as long as they use the majority rule for each pairwise choice. But if they have a probability distribution over weights and maximize expected utility, then the cycle might break. However, without a common currency, it's not clear.

  Steelman the other side: The best attack is to argue that "better than" must be transitive by definition, and any apparent intransitivity means that the comparison is not about all-things-considered betterness. Specifically, they might say that the pairwise comparisons using majority rule are not judgments of overall betterness, but rather a procedure to make a choice. Overall betterness requires a single scale, and if we had that, the intransitivity would disappear. In this case, they might say that the three dimensions are incommensurable, and therefore, there is no overall betterness relation between the options. Instead, we have a cycle in a decision rule that we are using to make choices, but that doesn't reflect a genuine betterness ordering. This attack lands if one accepts that betterness must be transitive by definition and that incommensurability blocks overall betterness. However, it relocates the problem: we now have to say what an agent should do when faced with such a choice, and the decision rule (majority) still gives a cycle. So the practical problem remains.

  Conclusion: We have constructed a robustly intransitive set of three options with clear pairwise wins using majority rule over three dimensions. The key is the cyclic ordering in the underlying dimensions. The case is not due to vagueness or small differences.
