  ### Translation Notes  
  1. **Clean Translations** (Claims 3,4,6):  
     - The "no justification without experience" and "testimony as perception-shaping" maps directly to sensory practice (e.g., consumers needing tastings, references training detection).  
     - No smuggling: Sensory protocols explicitly separate training (calibration) from measurement.  

  2. **Distorted Translations** (Claims 1,2,5):  
     - **Pessimism/Optimism**: Distorted because sensory "justification" is reliability-based (e.g., panel reproducibility), while aesthetics concerns warrant for *personal* belief.  
     - **Universality Claims**: "Beauty" as universal becomes "consensus under controlled conditions"—losing the imperative that others *must* agree.  

  3. **Untranslatable Residues**:  
     - **Normative Force**: Aesthetic claims imply "you *should* find this beautiful." Sensory science has no equivalent; even 100% panel agreement on "bitterness" doesn’t command you to *like* it.  
     - **First-Person Authority**: The pessimist’s insistence that testimony can’t replace "what it's like" for *you* has no sensory counterpart (trained panelists *can* proxy for others).  

  4. **Hunch Diagnosis**:  
     - **Vindicated**: Critics do function like reference standards, aligning perceptual frameworks (e.g., "hear this as sad"). This supports optimists on testimony’s *perception-shaping* role.  
     - **Failing**: It doesn’t explain why we treat critical verdicts as *reasons to believe* (not just perceive). References standardize language, not enjoyment.  

  5. **Key Disagreement Beyond Methodology**:  
     Whether "beauty" is a discoverable property (like bitterness) or an irreducibly personal response (like liking). Sensory science avoids this question; aesthetics is built on it.  

  **Recommendation**: Your framework best maps the *epistemic infrastructure* (calibration, consensus, descriptors) but cannot resolve the *normative* dispute about whether aesthetic properties "demand" agreement. This is philosophy’s territory.
