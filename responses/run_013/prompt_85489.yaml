answer: |-
  Here's a requirements list for any account of "closer to the truth" (verisimilitude), based on your specifications. Requirements are categorized as **Core** (must be met by any adequate account) or **Preference** (desirable but potentially style-dependent or subject to trade-offs).

  ### Core Requirements (Must Be Met By Any Adequate Account)
  1.  **Non-Equivalence of False Theories (The Collapse Ban):** The account MUST allow that one false theory (T1) can be strictly closer to the truth than another false theory (T2) about the same subject.
      *   *Case/Consideration:* Rivals your intuition that some false theories are clearly better than others. Violating this renders the concept useless for judging between false accounts.
      *   *Binds:* Absolutely every account.
  2.  **Truth Supremacy:** The complete and true theory (T_true) MUST be strictly closer to the truth than any false theory.
      *   *Case/Consideration:* The complete truth is the ultimate standard.
      *   *Binds:* Absolutely every account.
  3.  **Emptiness Penalty:** A true but completely uninformative/empty tautology (T_empty, e.g., "Things exist") MUST be strictly less close to the truth than T_true. Crucially, it MUST also be strictly less close to the truth than some specific false theories (e.g., a detailed but slightly wrong theory).
      *   *Case/Consideration:* Truth alone is insufficient; content matters. T_empty provides no useful information about the specific subject.
      *   *Binds:* Absolutely every account.
  4.  **Punish Excessive Caution:** A highly cautious, uninformative theory (T_cautious, e.g., making only trivial or easily true claims) MUST NOT be judged closer to the truth than a bolder, more informative theory that gets significant things right but also makes specific, falsifiable errors (T_bold).
      *   *Case/Consideration:* Rewarding T_cautious would incentivize saying nothing substantive. T_bold provides more truth content despite its error. (e.g., "Planets orbit" vs. detailed Keplerian orbits with a minor error).
      *   *Binds:* Absolutely every account.
  5.  **Accommodate Significant Truth with Error:** A theory containing a large amount of true, specific content alongside one significant, specific falsehood (T_mostlyTrue) MUST be judged closer to the truth than a theory containing little true content but no significant falsehoods (T_weakTrue) or a theory containing significant false content (T_wrong).
      *   *Case/Consideration:* Recognizes that substantial true content outweighs a localized major error. (e.g., Newtonian mechanics vs. Aristotelian physics, or vs. a list of trivial truths).
      *   *Binds:* Absolutely every account.
  6.  **Distinction from Probability:** Closer to the truth MUST NOT be reducible to, or always align with, higher probability (in a Bayesian or logical sense).
      *   *Case/Consideration:* A highly improbable theory (e.g., a specific, detailed model fitting known data poorly initially) might later be shown to be very close to the truth. Conversely, a vague, probable theory (T_cautious) may be far from the truth.
      *   *Binds:* Absolutely every account.
  7.  **Distinction from Informativeness:** Closer to the truth MUST NOT be reducible to, or always align with, being more informative (logical strength, content).
      *   *Case/Consideration:* A very informative theory can be wildly wrong (T_wrongStrong). A minimally informative true theory (T_empty) is far from the truth. *Content vs. Accuracy tension flagged here.*
      *   *Binds:* Absolutely every account.
  8.  **Distinction from Usefulness/Pragmatics:** Closer to the truth MUST NOT be reducible to, or always align with, being more useful, empirically adequate, or instrumentally successful.
      *   *Case/Consideration:* A false theory (e.g., Ptolemaic epicycles, classical thermodynamics applied beyond limits) can be highly useful/predictive but still far from the deeper truth. A true but useless theory (T_empty) is far from the truth.
      *   *Binds:* Absolutely every account.

  ### Preference Requirements (Desirable, May Vary by Account Style)
  9.  **Content-Accuracy Tension Handled:** The account SHOULD explicitly address and provide a principled way to balance the potential tension between demanding more content (informativeness) and demanding more accuracy (avoiding falsehoods). *(Flagged as requested)*.
      *   *Case/Consideration:* T_bold vs. T_cautious; T_mostlyTrue vs. T_weakTrue. Core Requirements 4 & 5 force the account to favor content-richness *in these cases*, but a general balancing mechanism is needed.
      *   *Binds:* Preference. A good account should handle this, but the specific resolution (e.g., weighting functions) may be style-dependent.
  10. **Language/Vocabulary Invariance (Robustness):** The verdict on which of two theories (T1, T2) is closer to the truth SHOULD NOT flip when T1 and T2 are reformulated using different but expressively equivalent vocabularies/logical frameworks that preserve their core meaning and logical relationships.
      *   *Case/Consideration:* Avoids making verisimilitude dependent on arbitrary syntactic choices. *(Flagged as requested)*.
      *   *Binds:* Preference. Highly desirable for objectivity, but some accounts might struggle to achieve full invariance or define "expressive equivalence" rigorously. Violation significantly weakens objectivity.
  11. **Contextual Sensitivity (Avoidance of Monotonicity):** Adding *any* true consequence to a theory SHOULD NOT automatically make it closer to the truth. Adding *any* false consequence SHOULD NOT automatically make it farther from the truth.
      *   *Case/Consideration:* Adding irrelevant truths (e.g., "and 2+2=4") shouldn't help T_empty. Adding a minor, irrelevant falsehood shouldn't catastrophically harm T_mostlyTrue compared to a rival lacking that falsehood but also lacking its significant truths.
      *   *Binds:* Preference. Core Requirement 5 already implies non-monotonicity for falsehoods. This strengthens the demand for relevance/weighting.

  ### Potential Conflicts & Key Ruling-Out Requirement
  *   **Conflict:** Core Requirement 5 (Reward T_mostlyTrue) can *appear* to conflict with Core Requirement 4 (Punish T_cautious) if one misinterprets T_cautious as having "no falsehoods". However, T_cautious avoids falsifiable claims, meaning it lacks *significant true content*. The deeper tension is handled by Preference Requirement 9 (Content-Accuracy Balance).
  *   **The Irreducible Requirement:** **Core Requirement 1 (Non-Equivalence of False Theories / The Collapse Ban)** is the most fundamental. Any account violating this (e.g., by defining closeness only relative to truth-value, or making all falsehoods equally fatal) is immediately inadequate for your purpose. It rules out simplistic accounts.
  *   **Sacrifice Priority:** If forced to sacrifice one Preference Requirement, **Language/Vocabulary Invariance (10)** might be the most common casualty (though undesirable), as some logically precise accounts might be framework-dependent. Sacrificing **Contextual Sensitivity (11)** risks rewarding trivialities or punishing minor errors too harshly. **Core Requirements are non-negotiable.**

  This list provides the necessary framework for objectively judging which of two false accounts is better (closer to the truth) based on their content and accuracy, distinct from probability, utility, or mere informativeness, while handling your critical test cases.
