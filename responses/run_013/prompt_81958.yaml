prompt: |-
  I run the forecasting desk at a small research shop — six analysts, we sell probability estimates on policy and geopolitical questions to NGO and government clients, and our numbers end up in other people's budget documents, so when we're wrong it isn't just our reputation. We have a norm I've always liked: if you're going to revise a number, you should have been willing to hold the revised number the day before — no quietly waiting to see how things shake out and then moving. But the norm cuts the other way too, and that's what's been bothering me. If I'm confident that in 48 hours, after I've read the two reports sitting in my inbox, I'll think this is a 30% and not the 60% I'd say today, then it seems like I should already be at 30% now. A colleague told me there's a name for this — van Fraassen's reflection principle, roughly that your credence now should match what you expect your credence to be later, or else you're incoherent — and I'm fairly sure she also said there's an asterisk, I just can't remember where the asterisk goes.

  So what I want is a procedure the desk can actually run, laid out as questions in order, for deciding when to defer to a later or better-informed version of ourselves and when deferring is a mistake. It needs to get through the ordinary cases — the analyst who's about to read a new batch of polling, the analyst who'll have spent another day thinking — and the ugly ones: someone who knows they'll be fried and rushed on deadline; someone whose later judgement will be downstream of a client leaning on them; the case where we know information will be lost before we revisit, which actually happened when the person who built our main model left and the rest of us are working off her notes; and the self-referential ones, since a lot of what we forecast is stuff where being seen to expect X makes X less likely. Two things I want built in. First, we have two years of revision logs, so use them — my impression is that revisions made after a client call are worse than revisions made after new data, but the procedure should say how to check that rather than take my word for it. Second, the case I care about most: a senior analyst says she's confident that in a week she'll see the flaw in the argument she's making right now, but she can't yet say what the flaw is. Should she move today or not? My suspicion is that the honest answer is that the procedure can neither make her move nor tell her to stay, and if that's right I want it said plainly rather than papered over. Constraints: revisions happen in the 24 hours before delivery, the analyst has about an hour, and anything that moves a number more than 15 points has to be signed off by me and logged with a written reason — so the procedure has to specify what a good reason looks like and what a bad one looks like. Run it end to end on three cases: the new-polling one, the client-call one, and the senior analyst one, and flag which steps are just judgement dressed up as procedure.

  Skip the reading list, please — no papers, no citations, I'm not going to read them. If a problem has a name, name it, that's all I need.
reasoning: |-
  Okay, the user runs a forecasting desk with six analysts providing probability estimates for policy and geopolitical questions. Their estimates impact client budgets, so accuracy is critical. They have a norm: any revision must be a number the analyst would have supported the previous day, avoiding opportunistic adjustments after events unfold. But they're grappling with the reverse—whether to adjust current estimates based on anticipated future revisions, referencing van Fraassen's reflection principle. The user needs a practical procedure addressing various scenarios, including new data, client pressure, lost information, and self-referential forecasts. They want to leverage two years of revision logs and focus on a senior analyst anticipating a flaw in her argument. Constraints include a one-hour revision window, sign-off for >15-point moves, and minimal theory—just actionable steps.

  First, I need to break down van Fraassen's reflection principle. It states that your current credence should align with your expected future credence to avoid incoherence. The asterisk involves conditions like no information loss or irrational future beliefs. The user's core conflict is between this principle and their existing norm, especially in cases where future insights are expected but not yet formed.

  The senior analyst scenario is pivotal. She expects to find a flaw in a week but can't identify it now. Applying reflection naively would suggest lowering her estimate immediately, but that feels wrong. The procedure must handle this without forcing a move or endorsing inaction. It should surface the dilemma clearly.

  The user wants data-driven checks using revision logs. They suspect client-influenced revisions underperform. The procedure should include steps to analyze past revisions for patterns—comparing reasons (client calls vs. new data) against accuracy metrics like Brier scores. This turns subjective hunches into empirical validation.

  Constraints shape the design: revisions within 24 hours of delivery, one-hour max per analyst, strict logging for large moves. The procedure must fit this workflow. Steps should be sequential questions, with clear "good/bad reason" definitions for sign-offs. Judgment-heavy steps must be flagged to avoid false objectivity.

  For the three test cases:  
  - **New polling:** Straightforward. Expectation of new data justifies deferral if it's timely and relevant.  
  - **Client call:** Tricky. Pressure might distort future judgment, violating reflection conditions. Procedure should flag this as a bad reason.  
  - **Senior analyst:** Highlight the paradox. If she expects coherence loss (e.g., stress), deferral is valid; if she expects rational insight, staying put might be incoherent. The procedure exposes this tension without resolving it.  

  Building the step-by-step flow:  
  1. **Trigger:** Identify why a future revision is considered (e.g., new data, reflection).  
  2. **Reflection check:** Assess if future self meets coherence conditions (no info loss, rational).  
  3. **Data log analysis:** Use past revisions to validate the reason's reliability.  
  4. **Deferral decision:** Weigh costs of early move vs. post-deadline revision.  
  5. **Documentation:** Define good reasons (e.g., "awaiting embargoed data") vs. bad ("client complained").  

  For the senior analyst:  
  - She expects future flaw → reflection suggests moving now.  
  - But if flaw isn't identifiable, future coherence is questionable. Step 2 flags this, Step 3 finds no comparable log data, Step 4 shows deferral risks last-minute panic. Outcome: No prescriptive move, but logs uncertainty.  

  Key insights:  
  - Reflection isn't a command; it's a test. Failing it means either adjust or justify why conditions aren't met.  
  - The procedure's strength is forcing explicit reasoning, especially for edge cases.  
  - "Judgment steps" (e.g., assessing future rationality) are unavoidable but made transparent.
answer: |-
  Here’s a step-by-step procedure for your desk, designed for real-world constraints (1-hour revisions, sign-off for >15-point moves). It handles van Fraassen’s reflection principle ("RP") but flags its limits. The core: **Only defer to your future self if they’ll be *better informed and rational*. Otherwise, move now or risk incoherence.** Use past revision logs to test assumptions.  

  ### Procedure: "Defer or Move?" Checklist  
  *Run these questions in order during revision windows. For >15-point moves, the "reason" must pass Step 4.*  

  1. **Why will your future credence change?**  
     - *Options:* New data (e.g., polling), new analysis (e.g., model run), external pressure (e.g., client call), self-doubt (e.g., "I’ll spot a flaw"), or structural shift (e.g., lost expertise).  
     - **Judgment step:** No objective threshold. Analyst must name the trigger.  
     - *Bad reason:* "I’ll have more time to think" (unless backed by logs—see Step 3).  

  2. **Will your future self be *coherent*? (The RP asterisk)**  
     - Defer *only* if all apply:  
       - **No information loss:** Future you has equal/better data (e.g., polling hasn’t dropped).  
       - **No irrationality:** Future you isn’t exhausted, rushed, or influenced (e.g., no post-client-call panic).  
       - **No self-sabotage:** Your forecast doesn’t *cause* the outcome (e.g., "Predicting war makes deterrence likelier").  
     - *If any fail → Move now*. RP doesn’t apply.  
     - **Judgment step:** Assessing "irrationality" is subjective. Err on caution.  

  3. **What do past revisions say? (Log audit)**  
     - Pull logs for similar past triggers (e.g., "revisions after client calls"). Calculate:  
       - **Accuracy:** Brier score (lower = better) for estimates *before* vs. *after* revision.  
       - **Bias:** Direction of changes (e.g., client calls = consistent upward/downward drift?).  
     - *Procedure:* If revisions under this trigger are less accurate/more biased than baseline → **Move now**.  
     - *Example:* Your hunch that "client-call revisions are worse" is testable. If they average 10% less accuracy → reject deferral.  

  4. **Can you defend moving *now* (or not)? (For sign-offs)**  
     - **Good reason to move:** "Future me violates RP conditions (Step 2)" or "Logs show this trigger hurts accuracy (Step 3)."  
     - **Good reason *not* to move:** "Future me meets RP conditions and logs support waiting."  
     - **Bad reason:** "I feel unsure," "Client wants it," or "I’ll decide later."  
     - **>15-point move?** Log the reason verbatim. Reject if vague or conflicts with logs.  

  ---  
  ### End-to-End Test Cases  
  **Case 1: New polling arriving tomorrow**  
  - Step 1: Trigger = "New data (polling)."  
  - Step 2: Future self = coherent (no info loss/irrationality).  
  - Step 3: Logs show polling revisions improve accuracy by 12% on average → **Defer**.  
  - *Judgment call?* Step 2 (assessing "no irrationality" if analyst is tired).  

  **Case 2: Client call scheduled before deadline**  
  - Step 1: Trigger = "External pressure (client)."  
  - Step 2: Future self = likely irrational (client pressure biases judgment) → **Move now**.  
  - Step 3: Logs confirm client-linked revisions have 18% higher bias → **Move now**.  
  - >15-point move? Log: "Client pressure violates RP; logs show bias." *Good reason.*  

  **Case 3: Senior analyst expects to spot a flaw in her argument in a week**  
  - Step 1: Trigger = "Self-doubt (unidentified flaw)."  
  - Step 2: **Critical failure**—Future self *loses coherence* because she can’t articulate the flaw *now*. Rationality isn’t guaranteed. RP **doesn’t apply**.  
  - Step 3: Logs unlikely to help (too niche). Default to Step 2 outcome.  
  - **Procedure output:**  
    - *She should move now* if she can justify a lower number today (e.g., "My confidence is undermined").  
    - *If she can’t*, she **stays put** but logs: "Anticipated incoherence—no defensible move."  
  - **No prescriptive move.** The procedure exposes the trap: Expecting future insight you can’t describe *now* breaks RP. Forcing a move without justification is as bad as ignoring self-doubt.  
  - >15-point move? Only if she has a reason beyond "I’ll disagree later." *Bad reason:* "I might be wrong." *Good reason:* "Here’s why my model is unstable (e.g., sensitivity analysis)."  

  ---  
  ### Key Takeaways  
  - **Reflection principle’s asterisk:** RP fails if future you is irrational, misinformed, or your action affects outcomes. Your colleague is right—it’s *not* a universal rule.  
  - **What this solves:** Blocks bad deferrals (e.g., client pressure, lost info). Uses logs to punish low-value revisions.  
  - **What it can’t solve:** The senior analyst’s dilemma. If she can’t articulate the flaw *today*, RP *demands* she adjust now but *offers no number*. The procedure forces her to confront this—no papering over.  
  - **Judgment steps dressed as procedure:**  
    - Step 2 (assessing future "rationality").  
    - Step 1 (classifying triggers).  
    - Defining "good reasons" (Step 4).  
  - **Practical fit:** Frames revisions in ≤4 steps, uses existing logs, and sets clear bars for sign-offs.
