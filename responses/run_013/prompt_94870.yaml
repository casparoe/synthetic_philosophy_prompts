answer: |-
  Here are five diagnostic points:

  1.  **The core disagreement is primarily ontological and explanatory, not empirical:** The camps fundamentally differ on whether historical outcomes should be understood as contingent possibilities made necessary only by the path taken (lock-in view) or as expressions of underlying structural forces revealed over time (convergence view), shaping what they accept as a valid explanation.
  2.  **The debate hinges on unfalsifiable counterfactuals:** Neither side can definitively prove its interpretation of cases like the rail gauges because demonstrating the *actual possibility* and *viability* of the unrealized path ("could things have been different?") or proving the *inevitability* of the realized path ("was this the only possible outcome?") is inherently beyond empirical verification with historical data.
  3.  **"Path dependence" is used equivocally:** The term slides between describing a *mechanism* (increasing returns causing lock-in) and describing an *observed property* (the irreversibility of an outcome given its history), allowing both sides to claim it while meaning different things; the lock-in camp emphasizes the mechanism, the convergence camp questions the observed property's necessity.
  4.  **There is no hidden empirical question resolving it:** While empirical cases are used illustratively, no new historical evidence can settle the debate because the interpretation of the evidence is filtered through the prior, opposing ontological commitments about contingency vs. necessity in history.
  5.  **Progress requires distinguishing explanatory goals and formalizing mechanisms:** Resolution lies not in empirical proof but in clarifying whether the aim is explaining *how* a specific outcome emerged from its unique history (favoring lock-in narratives) or identifying the *structural determinants* that make outcomes robust (favoring convergence), and formally modeling the specific conditions (e.g., strength of increasing returns, nature of selection pressures) under which one dynamic dominates.
