prompt: |-
  I am the research director for a state law reform commission. Our legislature routinely refers bills that would criminalize conduct many citizens regard as seriously immoral but where the harm is disputed: consensual adult incest, assisted suicide for the terminally ill, public desecration of national symbols, the production and sale of violent pornography, and a proposal to criminalize the purchase of sexual services. We are not a court and we are not a philosophy seminar; we have to produce a defensible recommendation on each referral within a legislative session, usually with one staff attorney and me, and the recommendation has to be usable by legislators who have no background in the Hart-Devlin debate. I know the debate well enough—Hart's insistence on critical morality and the harm principle, Devlin's concern with social cohesion and the disintegration thesis, the distinction between enforcing morality as such and preventing concrete harm—but what I need from you is not a summary or a reading list. I need a reusable decision procedure that operationalizes the debate into questions a staff attorney can actually run in an afternoon, with the hard cases built in. Our chair has also proposed a two-track rule: no referral may be recommended for criminalization unless it passes a harm-to-others screen and a social-cohesion screen, and if the two screens conflict, the procedure must name a tie-breaker rather than averaging them or pretending the conflict is not there.

  Please write that procedure. It should specify the questions to ask in order, what counts as a sufficient answer at each step, where the procedure terminates in a recommendation against criminalization, where it terminates in a recommendation for criminalization, and where it must stop and hand the matter to the legislature as a contested value choice rather than a factual or conceptual one. It should preserve the distinctions that matter—harm to others versus harm to self versus offense versus moral wrong as such; positive morality versus critical morality; the empirical claim about social disintegration versus the normative claim that society may enforce morality; the difference between a practice being widely condemned and its being harmful—and it should be explicit about which of these the procedure can operationalize and which it can only flag. It should also be honest about where the procedure will misfire: cases where the harm is speculative, where the moral condemnation is majoritarian but the conduct is not harmful, where a practice is harmful but the proposed criminalization would create more harm than it prevents, and where the very question is whether the community has standing to legislate morality at all. Finally, run the procedure on three referrals: consensual adult incest between siblings, assisted suicide for a competent terminally ill adult, and public desecration of a national flag. For each, show the steps, the recommendation, and the residual disagreement. At least one recommendation should be one I will not like; do not soften it to make the procedure look tidy. Do not cite cases, statutes, or books; I need the reasoning and the operational tests, not authority.
reasoning: |-
  Okay, the user is the research director for a state law reform commission. They need a practical decision procedure to evaluate whether certain morally contentious behaviors should be criminalized. The key points are that they need something operational, not theoretical, that can be run quickly by staff attorneys. The chair has proposed a two-track rule: no criminalization unless it passes both a harm-to-others screen and a social-cohesion screen, with a clear tie-breaker if they conflict.

  First, I need to unpack the Hart-Devlin debate in a way that translates into actionable questions. Hart emphasizes harm to others and critical morality, while Devlin focuses on social cohesion and positive morality. The challenge is turning these philosophical concepts into concrete steps. For the harm screen, the questions should focus on identifiable harms: physical, psychological, economic, etc. The harm must be direct and non-speculative. For the social cohesion screen, it's about whether the behavior could undermine societal structures, but this needs an empirical basis to avoid being purely subjective.

  The user mentioned hard cases like consensual adult incest, assisted suicide, and flag desecration. These examples will help test the procedure. The procedure must be honest about where it might misfire, such as when harms are speculative or when moral condemnation is majoritarian but not harmful.

  The two-track rule requires both screens to pass. If they conflict, the tie-breaker is the harm principle, as Hart argued. That means if something passes the social cohesion test but fails harm-to-others, it shouldn't be criminalized. This prioritizes individual liberty over enforcing morality without harm.

  I need to structure the questions step-by-step. Start with harm-to-others: is there direct, non-consensual harm? Then, can criminalization effectively prevent this harm without disproportionate costs? If not, stop—no criminalization. Next, social cohesion: is there evidence that the behavior threatens fundamental societal structures? If both pass, recommend criminalization. If only one passes, use the tie-breaker. If neither passes, no criminalization.

  For cases where the screens conflict or the evidence is unclear, the procedure should flag it as a contested value choice for the legislature. This is crucial because some issues involve deep moral disagreements that aren't resolvable through empirical tests alone.

  Testing the procedure on the examples: 
  1. Consensual adult incest: Harm screen might not find direct harm, but social cohesion could show societal disruption. However, without proven harm, the tie-breaker would lean against criminalization. 
  2. Assisted suicide: Harm screen could go either way—risk of coercion vs. autonomy. Social cohesion might show division. This becomes a contested issue. 
  3. Flag desecration: No direct harm, but social cohesion might argue for symbolic harm. Tie-breaker would reject criminalization.

  The user needs the procedure to be transparent about limitations. For instance, speculative harms or moral enforcement without harm are flagged as areas where the procedure can't decide. This honesty ensures legislators understand the boundaries of the recommendation.

  Also, ensuring that the procedure doesn't get bogged down in philosophy. Each question must be answerable with available data or clear criteria. Staff attorneys should be able to complete it in an afternoon, so steps must be concise and pragmatic.

  Finally, including at least one recommendation the user might dislike, like not criminalizing incest, shows the procedure's objectivity, reinforcing its credibility even when outcomes are counterintuitive to some.
answer: |-
  Here is a reusable, step-by-step decision procedure operationalizing the Hart-Devlin debate for your commission's needs, adhering strictly to the two-track rule and emphasizing actionable questions.

  **Core Principles of the Procedure:**
  1.  **Sequential Screening:** Must pass *both* screens (Harm-to-Others & Social-Cohesion). Failure at either screen terminates the process with a recommendation against criminalization.
  2.  **Tie-Breaker:** If screens conflict (one passes clearly, the other fails clearly), the Harm-to-Others screen acts as the tie-breaker (i.e., criminalization requires passing the Harm screen).
  3.  **Contested Value Flag:** Where evidence is ambiguous, inconclusive, or fundamentally relies on unresolvable value judgments *within the screen's framework*, the procedure flags it as a contested value choice for the legislature.
  4.  **Operational Focus:** Prioritizes empirically assessable claims or clearly identifiable, non-speculative harms. Acknowledges where philosophy drives unresolvable disagreement.
  5.  **Transparency on Misfires:** Explicitly notes limitations at key steps.

  **Decision Procedure: Harm-to-Others & Social Cohesion Screen with Tie-Breaker**

  **STEP 1: HARM-TO-OTHERS SCREEN**
  *   **Core Question:** Is the conduct demonstrably likely to cause **direct, non-consensual, and non-trivial harm to identifiable persons other than the actor(s)**, such that criminalization is a reasonably necessary and proportionate means of preventing that harm?
  *   **Operational Questions:**
      1.  **Identify Specific Harms:** What specific, concrete harms (physical, psychological, financial, reputational) are claimed to result directly and foreseeably from the conduct? (e.g., physical injury, severe psychological distress requiring diagnosis, financial loss, destruction of property). *Distinguish from: Harm to self, offense/disgust, moral wrongness as such.*
      2.  **Non-Consensual Impact:** Is the harm inflicted upon individuals who did not meaningfully consent to bearing that specific risk? (e.g., bystanders, vulnerable parties not involved in the conduct, public costs demonstrably *caused* by the conduct).
      3.  **Evidence of Causation & Likelihood:** Is there credible, non-speculative evidence (studies, data, reliable expert consensus) demonstrating that the conduct *frequently or predictably* causes the identified harms? *Flag: Speculative harms, "slippery slope" arguments without strong evidence.*
      4.  **Effectiveness of Criminalization:** Would criminalizing this specific conduct demonstrably and significantly *prevent* these identified harms? Consider feasibility of enforcement, likelihood of deterrence, displacement effects.
      5.  **Proportionality & Net Harm:** Would the harms caused by criminalization itself (e.g., enforcement costs, black markets, disproportionate punishment, chilling effects on rights, secondary victimization) likely be *less severe* than the harms the law seeks to prevent? *Flag: Net Harm calculation uncertainty.*
  *   **Sufficient Answer:** Requires "Yes" to **1, 2, 3, and 4**, AND a "No" or "Ambiguous" that doesn't strongly indicate net harm increase to **5**.
  *   **Termination:**
      *   **FAIL:** If any of 1-4 is clearly "No", OR 5 is clearly "Yes" (Net Harm Increase). **Recommendation: Do Not Criminalize.** (Harm principle not satisfied).
      *   **PASS:** If 1-4 are "Yes" and 5 is "No" or "Ambiguous". Proceed to Step 2.
      *   **CONTESTED:** If evidence on 3 (Causation/Likelihood) or 4 (Effectiveness) or 5 (Net Harm) is fundamentally ambiguous/inconclusive/contested by equally credible sources. **Flag as Contested Value Choice.** (Legislature must weigh uncertain harms/benefits).

  **STEP 2: SOCIAL COHESION SCREEN**
  *   **Core Question:** Is the conduct demonstrably likely to cause **severe damage to fundamental societal institutions or bonds essential for societal stability and function** (beyond mere offense or moral disagreement), such that criminalization is a necessary last resort to prevent disintegration?
  *   **Operational Questions:**
      1.  **Identify Threatened Institution/Bond:** What specific, fundamental societal institution or bond is claimed to be threatened? (e.g., the family unit, rule of law, trust in essential services, foundational social contract, *not* just "traditional values" or "public morality" vaguely). *Distinguish: Positive morality (what is believed) vs. critical morality (what should be believed).*
      2.  **Evidence of Negative Impact:** Is there credible, non-speculative evidence demonstrating that the conduct *significantly weakens* or *destabilizes* the identified institution/bond? (e.g., data showing breakdown in family cohesion, erosion of trust in key systems, increased societal conflict/violence *directly linked* to the conduct). *Flag: Reliance solely on moral condemnation, offense surveys, or speculative disintegration theses.*
      3.  **Causation & Imminence:** Is the evidence strong that this conduct (not other factors) is a *primary* and *direct* cause of the weakening, and is the damage likely severe and imminent enough to warrant state coercion? *Flag: Conflating correlation with causation; long-term, speculative disintegration claims.*
      4.  **Necessity of Criminal Law:** Are non-criminal societal mechanisms (education, social norms, civil remedies) demonstrably insufficient or have demonstrably failed to address the threat to the institution? Is criminalization the *only* or *clearly least restrictive* effective means?
  *   **Sufficient Answer:** Requires "Yes" to **1, 2, 3, and 4**.
  *   **Termination:**
      *   **FAIL:** If any of 1-4 is clearly "No". **Recommendation: Do Not Criminalize.** (Social cohesion justification insufficient).
      *   **PASS:** If 1-4 are "Yes". Proceed to Step 3.
      *   **CONTESTED:** If evidence on 2 (Impact Evidence) or 3 (Causation/Imminence) is fundamentally ambiguous/inconclusive/contested by equally credible sources. **Flag as Contested Value Choice.** (Legislature must weigh uncertain societal risks).

  **STEP 3: CONFLICT RESOLUTION & FINAL RECOMMENDATION**
  *   **Scenarios:**
      1.  **Both PASS:** **Recommendation: Criminalization is Justified.** (Passes both screens).
      2.  **Both FAIL:** **Recommendation: Do Not Criminalize.** (Fails both screens).
      3.  **One PASS, One FAIL:** Apply Tie-Breaker. **Harm Screen acts as Tie-Breaker.** *Recommendation: Do Not Criminalize UNLESS the Harm Screen PASSED.* (i.e., Harm Screen PASS + SocCohesion FAIL = **No Criminalization**; Harm Screen FAIL + SocCohesion PASS = **No Criminalization**).
      4.  **One or Both CONTESTED:** **Flag as Contested Value Choice.** (Legislature must make the core normative judgment - enforcing morality vs. preventing harm - amidst uncertainty).
      5.  **One PASS, One CONTESTED:** Apply Tie-Breaker to the PASS/FAIL aspect. *Recommendation: Do Not Criminalize UNLESS the Harm Screen PASSED and SocCohesion is CONTESTED.* (Harm PASS + SocCohesion CONTESTED = **Contested Value Choice**; Harm FAIL + SocCohesion PASS/CONTESTED = **No Criminalization**; Harm CONTESTED + SocCohesion PASS = **Contested Value Choice**).

  **Procedure Misfires & Limitations (Explicitly Flagged Where Applicable):**
  *   **Speculative Harm:** Relied upon heavily? Harm Screen likely FAILS or flags CONTESTED.
  *   **Majoritarian Condemnation Without Proven Harm:** Fails Harm Screen. SocCohesion Screen requires proof of institutional damage, not just condemnation.
  *   **Criminalization Creates Net Harm:** Explicitly addressed in Harm Screen Q5.
  *   **Community Standing to Legislate Morality:** The procedure *assumes* the state has standing to prevent harm to others and severe threats to social cohesion. If the *only* justification is pure moral wrongness (no harm, no cohesion threat), both screens FAIL. The debate *about* standing itself is a CONTESTED VALUE CHOICE.
  *   **Offense vs. Harm:** Strict distinction enforced in Harm Screen Q1.
  *   **Positive vs. Critical Morality:** SocCohesion Screen focuses on *institutional impact*, not morality per se. Reliance solely on positive morality fails Q2/Q3.

  ---

  **Application to Referrals:**

  **1. Consensual Adult Incest (Siblings)**
  *   **Step 1: Harm-to-Others Screen**
      *   Q1: Specific Harms? Claimed: Genetic risks to offspring (if pregnancy occurs), psychological harm to family members, potential coercion/abuse patterns. *Identifiable?* Offspring harm is potential, not guaranteed; psychological harm to non-participating family is claimed but difficult to attribute solely to consenting act. Coercion is not inherent in consensual adult scenario.
      *   Q2: Non-Consensual Impact? Offspring: Non-consensual risk. Family distress: Arguably non-consensual impact, but diffuse.
      *   Q3: Evidence? Genetic risk evidence is strong *if pregnancy occurs*. Evidence for inherent severe psychological harm to *non-participating family members* or inherent coercion patterns *between consenting adults* is weak/inconclusive. *FLAG: Speculative/Contested Evidence on psychological harm/coercion.*
      *   Q4: Effectiveness? Criminalization unlikely to prevent pregnancies if they occur; may drive underground. Minimal deterrence evidence for truly consenting adults.
      *   Q5: Net Harm? Criminalization likely causes significant harm (stigma, barriers to support, invasion of privacy).
      *   **Verdict:** Q1/Q2 Partially met (offspring risk), Q3/Q4 Weak/No, Q5 Suggests Net Harm. **FAIL Harm Screen** (Lack of clear, direct, non-speculative harm *to others* inherent in the consensual act itself; weak effectiveness; net harm likely).
  *   **Step 2: Social Cohesion Screen**
      *   Q1: Threatened Institution? The family unit (incest taboo as foundational).
      *   Q2: Evidence of Impact? Strong positive morality against it. Evidence that *consensual adult sibling incest* demonstrably destabilizes *other families* or the *institution of the family* broadly is lacking. Taboo violation ≠ proven institutional damage. *FLAG: Reliance on moral condemnation/offense, not evidence of societal damage.*
      *   Q3: Causation/Imminence? No strong evidence it's a primary cause of family breakdown. Severity/imminence speculative.
      *   Q4: Necessity? Non-criminal norms (social disapproval) are strong.
      *   **Verdict:** Q1 Yes, Q2/Q3 No/Q4 No. **FAIL Social Cohesion Screen**.
  *   **Step 3:** Both FAIL. **Recommendation: Do Not Criminalize.** (Harm principle not met; social cohesion justification insufficient).
  *   **Residual Disagreement:** Proponents argue the symbolic harm to the family/incest taboo *is* sufficient social harm/institutional damage (relying on Devlin's disintegration thesis). Opponents see no identifiable harm to others and view criminalization as purely moral enforcement violating autonomy (Hart). *The procedure flags reliance on speculative harm/cohesion claims as weaknesses.*

  **2. Assisted Suicide for Competent Terminally Ill Adult**
  *   **Step 1: Harm-to-Others Screen**
      *   Q1: Specific Harms? Claimed: Coercion of vulnerable individuals (pressure to die), erosion of trust in medical profession, slippery slope to non-voluntary euthanasia, psychological harm to family.
      *   Q2: Non-Consensual Impact? Coercion victim (if occurs), societal impact on trust/slope (if occurs).
      *   Q3: Evidence? Evidence of coercion in regulated jurisdictions is low but non-zero. Evidence for significant erosion of medical trust or slippery slope in jurisdictions with strict safeguards is mixed/inconclusive. Psychological harm to family varies greatly. *FLAG: Contested/Speculative Evidence on coercion risk/slippery slope.*
      *   Q4: Effectiveness? Criminalization prevents *all* assisted dying, including consensual. Regulation *might* minimize coercion better than blanket ban (effectiveness of *criminalization* vs. *alternative* is key). *FLAG: Effectiveness highly contested.*
      *   Q5: Net Harm? Criminalization causes harm (prolonged suffering, loss of autonomy for competent terminally ill). Regulation may mitigate coercion risks.
      *   **Verdict:** Q1/Q2 Partially met (potential coercion/societal risks), Q3 Ambiguous/Contested, Q4 Contested (Is criminalization *more* effective than regulation at preventing harm?), Q5 Contested (Net harm calculation depends on weighing suffering vs. risks). **CONTESTED Value Choice** (Fundamental ambiguity on key factual premises of harm and effectiveness).
  *   **Step 2: Social Cohesion Screen**
      *   Q1: Threatened Institution? Sanctity of life ethic; trust in healthcare system; societal commitment to protecting the vulnerable.
      *   Q2: Evidence of Impact? Deep moral division exists. Evidence that *regulated* assisted dying in other jurisdictions has caused *severe damage* to societal bonds or institutions is weak/inconclusive. Healthcare systems function; societal cohesion persists.
      *   Q3: Causation/Imminence? Link between the practice and societal disintegration speculative.
      *   Q4: Necessity? Strong non-criminal norms (medical ethics, palliative care) exist; regulation aims to address vulnerabilities.
      *   **Verdict:** Q1 Yes, Q2/Q3 Weak/No, Q4 Unclear. **FAIL Social Cohesion Screen** (Lack of evidence for severe institutional damage).
  *   **Step 3:** Harm Screen CONTESTED, SocCohesion Screen FAIL. Tie-Breaker applied (Harm Screen CONTESTED = Contested Value). **Recommendation: Flag as Contested Value Choice.** (Legislature must decide whether the potential harms/risks, despite ambiguity, outweigh the harm of denying autonomy and prolonging suffering, or vice versa).
  *   **Residual Disagreement:** Proponents focus on autonomy and relief of suffering (individual harm prevented), seeing risks as manageable. Opponents focus on intrinsic wrongness and unquantifiable risks to vulnerable populations/societal values (potential harm to others/social fabric), viewing criminalization as essential protection. *The procedure highlights the empirical uncertainty driving the core conflict.*

  **3. Public Desecration of National Flag**
  *   **Step 1: Harm-to-Others Screen**
      *   Q1: Specific Harms? Claimed: Severe emotional distress/outrage to observers, provocation of violence, damage to symbolic property (if flag stolen).
      *   Q2: Non-Consensual Impact? Distress/outrage inflicted on unwilling observers; potential violence victims.
      *   Q3: Evidence? Distress/outrage is common (offense), but evidence it rises to the level of *severe psychological harm* is weak. Provocation of violence is possible but not inherent or frequent with flag desecration alone; depends heavily on context. Property damage only if flag not owned by protester. *FLAG: Conflating severe offense with severe harm.*
      *   Q4: Effectiveness? Criminalization may suppress expression but unlikely to prevent strong emotions or sporadic violence triggered by other symbols/acts.
      *   Q5: Net Harm? Criminalization causes significant harm (suppression of political speech, disproportionate punishment). Potential chilling effect on dissent.
      *   **Verdict:** Q1/Q2 Partially met (offense, property if applicable), Q3 Weak (distress not severe harm, violence not direct/inevitable), Q4 Weak, Q5 Suggests Net Harm (speech suppression). **FAIL Harm Screen** (No clear, direct, non-speculative, non-trivial harm *to others* inherent in the act that justifies criminalization; net harm likely).
  *   **Step 2: Social Cohesion Screen**
      *   Q1: Threatened Institution? National unity/symbolic representation; rule of law (if seen as attack on state).
      *   Q2: Evidence of Impact? Expression causes offense/anger. Evidence that flag desecration *itself* (not the underlying message) demonstrably weakens national unity, loyalty, or the functioning of the state is lacking. Societies with protection tolerate it without apparent disintegration. *FLAG: Reliance on offense/moral condemnation.*
      *   Q3: Causation/Imminence? Offense ≠ institutional damage. No evidence it's a primary cause of disunity.
      *   Q4: Necessity? Non-criminal norms (patriotism, counter-speech) are strong responses.
      *   **Verdict:** Q1 Yes (Symbolism), Q2/Q3 No, Q4 No. **FAIL Social Cohesion Screen**.
  *   **Step 3:** Both FAIL. **Recommendation: Do Not Criminalize.** (No sufficient harm to others; no evidence of threat to social cohesion beyond offense).
  *   **Residual Disagreement:** Proponents argue the flag's unique symbolic value means its desecration *is* a direct harm to the shared national identity/bond (a form of social harm) or inherently destructive of a foundational social ritual. Opponents see it as pure political expression causing only offense. *The procedure strictly distinguishes offense and symbolic value from demonstrable harm or institutional damage, rejecting criminalization based solely on these grounds.*

  This procedure provides a clear, defensible, and pragmatic framework for your commission, forcing explicit consideration of harm and cohesion with a clear tie-breaker, while honestly flagging where empirical uncertainty leaves only a value choice for the legislature. It operationalizes the core distinctions of the Hart-Devlin debate without requiring philosophical debate during the assessment.
