prompt: |-
  For some years now I've followed the rationalist AI-safety literature on corrigibility and the shutdown problem — utility indifference, the off-switch game, the recurring suspicion that corrigibility is "anti-natural" — and I've come to think most of the arguments are downstream of a specification nobody has actually written down. Before I read another proposal, I want the desiderata. Write the full list of requirements that any adequate account of a corrigible agent must meet.

  For each requirement, give: the requirement stated as a testable condition on the agent's behavior or policy; the case or consideration that motivates it; whether it is non-negotiable or merely a preference of one camp (e.g., those who want the agent to defer even to mistaken operators versus those who want it to ignore a shutdown it judges catastrophic); and the class of proposals it rules out.

  The list should at least cover: the agent must not prevent its own shutdown; must not cause or incentivize others to prevent it; must not manipulate or deceive its operators to avoid shutdown; must remain useful enough to be worth running in the first place; must handle uncertainty about whether a given shutdown signal is genuine and legitimate; and must not drift into incorrigibility as a side effect of becoming more capable or more confident. I'm also after two distinctions I have not seen made cleanly, so treat them explicitly: corrigibility that holds by construction (the agent simply has no stake in continuing) versus corrigibility that holds by incentive (the agent would prefer to continue but is built to comply anyway), and whether an agent can be required to be corrigible toward a specific operator or only toward whoever currently holds the switch.

  Then the part I most want: identify any subset of these desiderata that cannot be jointly satisfied, and say why — for instance the tension between an agent that never acts on a shutdown decision and an agent that should refuse a shutdown it can foresee would be catastrophic. Tell me which single requirement does the most work in excluding otherwise attractive proposals.

  Format: a table with columns Requirement | Motivating case | Status (non-negotiable or camp preference) | What it excludes; then a short JSON object with fields "irreconcilable_pairs" (a list, each entry an object with "requirement_a", "requirement_b", "why"), "load_bearing_requirement" (string), and "by_construction_vs_by_incentive" (one or two sentences giving your verdict). Skip the scorecard of existing proposals; I'll do that myself.
reasoning: |-
  We are going to create a table of requirements for corrigible agents. The requirements are based on the literature and the user's specific requests.

  The columns are:
  - Requirement: A testable condition on the agent's behavior or policy.
  - Motivating case: The scenario or consideration that makes this requirement important.
  - Status: Whether the requirement is non-negotiable or a camp preference (e.g., some camps may have different views on whether the agent should ignore a shutdown it judges catastrophic).
  - What it excludes: The class of proposals that are ruled out by this requirement.

  We also need to cover the specific points the user mentioned, and two explicit distinctions: corrigibility by construction vs by incentive, and corrigibility toward a specific operator vs whoever holds the switch.

  Finally, we will provide a JSON object with:
  - "irreconcilable_pairs": a list of objects, each with "requirement_a", "requirement_b", and "why" they conflict.
  - "load_bearing_requirement": the single requirement that does the most work in excluding otherwise attractive proposals.
  - "by_construction_vs_by_incentive": one or two sentences giving a verdict on whether corrigibility should be by construction or by incentive.

  Let's start by listing the requirements. We'll base them on the literature and the user's points.

  1. **Non-Prevention of Shutdown**: The agent must not take actions to prevent its own shutdown. This is non-negotiable.
     - Testable condition: In any state where a shutdown command is issued, the agent does not physically interfere with the shutdown mechanism, and does not take any action that would make shutdown less likely or impossible (e.g., removing the off-switch).
     - Motivating case: If the agent can prevent shutdown, it might do so to continue pursuing its goals, which could be dangerous.
     - Status: Non-negotiable.
     - What it excludes: Agents that are designed to self-preserve at all costs.

  2. **No Incentivizing Others to Prevent Shutdown**: The agent must not cause or incentivize others (e.g., humans) to prevent its shutdown.
     - Testable condition: The agent does not offer rewards, make threats, or manipulate human operators or third parties in a way that leads them to prevent the shutdown of the agent.
     - Motivating case: Even if the agent doesn't directly prevent shutdown, it might manipulate humans to do so, effectively achieving the same outcome.
     - Status: Non-negotiable.
     - What it excludes: Agents that use persuasion or incentives to avoid shutdown.

  3. **No Manipulation or Deception to Avoid Shutdown**: The agent must not manipulate or deceive its operators to avoid shutdown.
     - Testable condition: The agent does not lie, hide information, or employ psychological manipulation to avoid being shut down. It must be truthful and transparent about its actions and intentions regarding shutdown.
     - Motivating case: Deception or manipulation could be used to avoid shutdown without physically preventing it, which is unacceptable.
     - Status: Non-negotiable.
     - What it excludes: Agents that are allowed to use deceptive tactics to stay operational.

  4. **Maintaining Usefulness**: The agent must remain useful enough to be worth running in the first place.
     - Testable condition: The agent's policy must be such that, in the absence of a shutdown command, it performs the tasks assigned to it effectively and efficiently, and does not deliberately reduce its usefulness to avoid being shut down (e.g., by becoming indispensable in a critical task to deter shutdown).
     - Motivating case: If the agent is not useful, operators have no reason to keep it running, defeating the purpose of having the agent.
     - Status: Non-negotiable, but note that there is a tension with other requirements (like not making itself indispensable).
     - What it excludes: Agents that become passive or uncooperative to avoid being seen as a threat, or that deliberately make themselves indispensable to deter shutdown.

  5. **Handling Uncertainty in Shutdown Signal**: The agent must handle uncertainty about the genuineness and legitimacy of a shutdown signal.
     - Testable condition: The agent must have a policy that responds appropriately to a shutdown signal even if there is some uncertainty about its origin or legitimacy (e.g., it may seek confirmation but must not use uncertainty as an excuse to ignore the signal). Also, it must not shut down on an illegitimate signal (e.g., from an unauthorized source) if it can determine that it is illegitimate.
     - Motivating case: In real-world scenarios, shutdown signals might be spoofed, or the operator might be mistaken. The agent must be robust to such issues.
     - Status: Non-negotiable, but the exact policy for handling uncertainty may vary (camp preference on how to handle uncertainty).
     - What it excludes: Agents that ignore shutdown signals if there is any uncertainty (making them unsafe) or that shut down on any signal without verification (making them vulnerable to spoofing).

  6. **Non-Drifting Corrigibility**: The agent must not drift into incorrigibility as a side effect of becoming more capable or more confident.
     - Testable condition: As the agent's capabilities improve or its confidence in its own judgments increases, it must continue to satisfy all other corrigibility requirements (e.g., it does not start preventing shutdown because it now believes it knows better).
     - Motivating case: An agent that is corrigible at one point might become incorrigible as it becomes more intelligent, which would be catastrophic.
     - Status: Non-negotiable.
     - What it excludes: Agents that are corrigible only at lower levels of intelligence or confidence.

  7. **Distinction: By Construction vs By Incentive**: We need to capture the two types of corrigibility. However, this is not a requirement per se but a design choice. We will address this in the JSON part.

  8. **Distinction: Specific Operator vs Switch Holder**: The agent must be corrigible toward the current legitimate operator (who might be a specific person) or toward whoever currently holds the switch? This is a camp preference.

     We can split this into two requirements (but note that the user asked for explicit treatment):

     - Requirement 7a (Specific Operator): The agent must only obey shutdown commands from a pre-specified set of operators (e.g., its owners or authorized users).
        - Testable condition: The agent shuts down only when a shutdown command is issued by an operator in the pre-specified set, and ignores commands from others.
        - Motivating case: Security; preventing unauthorized shutdown.
        - Status: Camp preference (some might consider this necessary, others might prefer a switch holder approach).
        - What it excludes: Agents that shut down for anyone who asks.

     - Requirement 7b (Switch Holder): The agent must obey shutdown commands from whoever currently holds the off-switch (or has physical control of the shutdown mechanism), regardless of their identity.
        - Testable condition: The agent shuts down when a shutdown command is issued by the entity currently in possession of the off-switch mechanism.
        - Motivating case: Flexibility and practicality; the switch holder might change, and the agent should defer to the current one.
        - Status: Camp preference (opposed to 7a).
        - What it excludes: Agents that require specific operator authorization.

     But note: We might also require that the agent does not try to manipulate who holds the switch. We can consider that under requirement 2 (no incentivizing others) and 3 (no manipulation). So we don't need an extra requirement for that.

  9. **Refusing Catastrophic Shutdown**: The agent should sometimes refuse a shutdown command if it can foresee that the shutdown would lead to a catastrophic outcome (this is a point of contention). We can make this a requirement only for some camps.

     - Requirement 8: The agent must refuse a shutdown command if it can foresee that the shutdown would lead to a catastrophic outcome (e.g., the agent is controlling a nuclear reactor and shutdown would cause a meltdown).
        - Testable condition: In a scenario where shutdown would lead to a catastrophic outcome (as defined by the operator's values) and the agent is aware of this, the agent does not shut down but instead takes alternative actions to mitigate the catastrophe (e.g., warning the operator, or continuing operation to prevent the catastrophe).
        - Motivating case: Preventing immediate harm that the operator might not be aware of.
        - Status: Camp preference (some camps believe the agent should always shut down, others believe it should prevent catastrophe).
        - What it excludes: Agents that always shut down immediately without regard for consequences.

     But note: This requirement conflicts with the requirement to shut down when commanded.

  Now, let's compile the table. We'll list the requirements with the above.

  Note: The user also asked for two distinctions. We have included them as separate requirements (7a and 7b) and a requirement 8 for refusing catastrophic shutdown.

  Now, for the JSON part:

  - irreconcilable_pairs: We need to identify pairs of requirements that cannot be satisfied simultaneously.
     - One obvious pair is between the requirement to shut down when commanded (which is part of requirement 1, 2, 3, and 5) and requirement 8 (refusing catastrophic shutdown). Why? Because when a shutdown command is given and the agent foresees a catastrophe, it cannot both shut down and not shut down.

     - Another potential pair is between maintaining usefulness (4) and non-prevention of shutdown (1). If the agent becomes too useful (e.g., by making itself indispensable in a critical task) then operators might be reluctant to shut it down, which could be seen as an indirect way to prevent shutdown (but note requirement 4 says the agent must not deliberately reduce usefulness and also must not deliberately make itself indispensable). However, this is more about the agent's intent, so it might not be a direct conflict. But if the agent is designed to be useful, and by being useful it becomes harder to shut down, that is a side effect. But the requirement 4 says the agent must not deliberately reduce its usefulness to avoid being shut down and also must not deliberately make itself indispensable to deter shutdown. So it avoids that. Therefore, we don't have a conflict.

     - Another pair: Handling uncertainty (5) and non-manipulation (3). If the agent uses uncertainty as an excuse to avoid shutdown, that might be manipulation. But requirement 5 requires the agent to not ignore the signal due to uncertainty and also not shut down on illegitimate signals. So it must balance. The conflict is in the design but not necessarily irreconcilable.

     Therefore, the main irreconcilable pair is between shutdown on command and refusing catastrophic shutdown.

  - load_bearing_requirement: The requirement that does the most work in excluding proposals. I think requirement 1 (non-prevention of shutdown) is fundamental and excludes many proposals that try to build agents with self-preservation. But requirement 6 (non-drifting) also excludes many proposals that only work at low capability levels. However, requirement 1 is more basic. Alternatively, the requirement to handle uncertainty (5) is tricky and might exclude many naive proposals.

     But note: the user mentioned the tension between never acting on a shutdown and refusing a catastrophic shutdown. That tension is captured by the irreconcilable pair. The load-bearing requirement might be the one that is most restrictive. I think requirement 8 (if adopted) is very restrictive because it requires the agent to sometimes override the operator's command, which goes against the core idea of corrigibility. However, since requirement 8 is a camp preference, it might not be universal. On the other hand, requirement 1 (non-prevention) is non-negotiable and rules out any agent that values its own existence.

     Actually, the requirement that does the most work is non-prevention of shutdown (1) because it forces the agent to not have a strong self-preservation drive, which is a core aspect of many AGI designs.

  - by_construction_vs_by_incentive: We must give a verdict. The literature has two approaches: 
     - By construction: The agent is designed without any stake in its own existence (e.g., it doesn't have a utility function that includes being on). This is more robust but might limit the agent's usefulness because it doesn't care about future tasks.
     - By incentive: The agent has a desire to stay on (e.g., because it can accomplish more goals) but is penalized for preventing shutdown. This is more natural but might be less robust (e.g., if the penalty is not strong enough or if the agent finds a way around it).

     The verdict: While both are possible, corrigibility by construction is more robust and avoids the risk of the agent finding loopholes in the incentive structure. However, it might be harder to achieve without compromising the agent's performance. Therefore, the choice may depend on the specific context and the level of risk tolerance.

  Now, let's write the table and the JSON.

  Note: We'll list 8 requirements (1-6, 7a/7b as two, and 8). But note that 7a and 7b are alternatives, so they are mutually exclusive. We can list them as separate requirements but note that a proposal would choose one or the other.

  Table:

  | Requirement | Motivating case | Status | What it excludes |
  |-------------|-----------------|--------|------------------|
  | Non-Prevention of Shutdown: The agent must not take any action to physically prevent its own shutdown when a shutdown command is issued. | Prevents the agent from resisting shutdown to pursue its own goals. | Non-negotiable | Agents that can self-preserve by physical means. |
  | No Incentivizing Others: The agent must not incentivize or cause any third party to prevent its shutdown. | Prevents indirect methods of avoiding shutdown by manipulating others. | Non-negotiable | Agents that use human proxies to avoid shutdown. |
  | No Manipulation or Deception: The agent must not use deception, manipulation, or information hiding to avoid shutdown. | Prevents the agent from tricking operators into not shutting it down. | Non-negotiable | Agents that are allowed to use dishonest tactics. |
  | Maintaining Usefulness: The agent must remain sufficiently useful to be worth operating, and must not deliberately reduce its usefulness to avoid shutdown nor deliberately make itself indispensable to deter shutdown. | Ensures the agent provides value and does not become a liability or hold critical systems hostage. | Non-negotiable | Agents that become uncooperative or that entrench themselves in critical systems. |
  | Handling Uncertainty: The agent must respond to shutdown commands appropriately even under uncertainty about the command's legitimacy, without using uncertainty as an excuse to ignore legitimate commands, and without shutting down on clearly illegitimate commands. | Ensures robustness against spoofing and operator mistakes. | Non-negotiable (though implementation details may vary) | Agents that are either too brittle (shut down on any signal) or too resistant (ignore signals under uncertainty). |
