  | Catastrophic Shutdown Refusal: The agent must refuse a shutdown command if it can foresee that the shutdown would lead to a catastrophic outcome (as defined by the operator's values). | Prevents immediate catastrophic harm that the operator might be unaware of. | Camp preference (for those who prioritize avoiding catastrophe over obedience) | Agents that always shut down immediately regardless of consequences. |

