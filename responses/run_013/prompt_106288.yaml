prompt: |-
  I lead the platform team at a mid-sized software company, and for about a year now we've been shipping what our product colleagues insist on calling autonomous agents — things that read support tickets and draft replies, that move ad spend between campaigns on their own, that merge dependency updates into production when the tests pass. Every one of these goes through a weekly design review that I chair, and the review keeps degenerating into the same unproductive argument: one engineer says the system is too dumb to be trusted with anything irreversible, another says we're insulting a model that has read the whole internet, and we end up voting on vibes. I don't have any formal philosophy training, but I came across a framework that has been quietly clarifying these fights, and I'd like to make it the backbone of the review rather than the hand-waving it currently is. The idea — I'm fairly sure it's Daniel Dennett's, from something he wrote about the kinds of minds — is that minds sit on a rough ladder of four grades. Darwinian creatures have a fixed repertoire and learn nothing during their own lives; whatever works was selected for over generations, and the individual is essentially a lookup table. Skinnerian creatures can learn within a lifetime by trial and error, adjusting their behavior from reinforcement and feedback. Popperian creatures can run the trial and error internally, simulating candidate actions and letting their hypotheses die in their place instead of dying themselves. And Gregorian creatures add tools, above all thinking tools taken over from other minds and from culture, which let them offload and extend their cognition. My instinct is that most of our internal arguments are really arguments about which rung a given feature belongs on, and that we've been sloppy about the difference between what the task requires and what we can safely afford to build.

  What I want from you is a decision procedure my team can actually run in a design review — not a summary of the framework, and not a reading list. Give me the questions to ask in order, what counts as a sufficient answer to each, where the procedure stops with a flat no, and where it deliberately hands the decision to a person because the remaining question is one of values or risk appetite rather than fact. I need it to do two jobs: first, to settle the minimum grade of creature a proposed task actually demands, and second, to diagnose what grade a proposed system really is as opposed to what its authors claim — because my teams consistently oversell a feedback loop as reasoning, or a single internal check as simulation, and I'd like a small set of tests they can run to catch that. The constraints are real: it has to be runnable in about twenty minutes by engineers who have not read any philosophy, and it has to treat actions differently depending on whether they are cheap and reversible or expensive and irreversible, since our ticket drafter can be wrong all day and our spend agent cannot. The final call gets signed off by a staff engineer and our safety reviewer, so the procedure needs to say clearly which steps produce evidence and which steps produce a decision someone has to own.

  Then run it, out loud, on three proposals: a ticket triage and draft-reply assistant that sends nothing until a human clicks send; a bidding agent that reallocates ad budget autonomously within a daily cap and learns from what happens; and a bot that auto-merges dependency bumps to production whenever the test suite goes green. At least one of those three should come out of the procedure with an answer my team will hate, and I want you to tell me which and why rather than softening it. There's a wrinkle I'd like you to address directly, because it's where our intuition keeps breaking: every one of these systems calls a large foundation model that has, in some sense, absorbed a great deal of human writing and tool use, and some of my engineers have started calling anything that does that Gregorian by default. Tell me whether that use of the distinction survives contact with the framework, or whether it collapses two different things. Finally, be honest about the edges: where the ladder is a hierarchy of sophistication but sophistication is not the same as suitability, where a fixed Darwinian policy is the correct and boring answer, where the procedure will misfire, and which of its steps are really judgment calls wearing the costume of a procedure.
reasoning: |-
  We are going to design a decision procedure based on Dennett's four grades of minds (Darwinian, Skinnerian, Popperian, Gregorian) to evaluate proposed autonomous agents. The procedure must:
  1. Determine the minimum grade required for a task.
  2. Diagnose the actual grade of the proposed system (to prevent overselling).

  The procedure should be runnable in 20 minutes by engineers without philosophy background and must account for:
  - Reversibility of actions (cheap/reversible vs. expensive/irreversible)
  - Clearly delineate evidence-producing steps from decision-making steps (with the latter owned by staff engineer and safety reviewer)

  We'll break the procedure into two phases:

  **Phase 1: Task Requirements (Minimum Grade)**
     - Goal: Determine the minimum grade of creature necessary for the task.
     - Steps:
       1. **Task Analysis**: What is the task? Break it down into key actions and decisions.
       2. **Reversibility and Cost**: For each key action, is it reversible? What is the cost of a mistake? (If irreversible and high cost, we require higher grades.)
       3. **Environmental Stability**: Is the environment stable (so that fixed rules work) or dynamic (requiring learning/adaptation)?
       4. **Required Learning/Adaptation**: Does the task require learning within the lifetime of the agent? If so, what kind?
          - If the task requires only fixed responses, then Darwinian (grade 1) is sufficient.
          - If the task requires learning from feedback (trial and error) in an environment that allows mistakes without catastrophic consequences, then Skinnerian (grade 2) might suffice.
          - If the task requires predicting outcomes of actions without actually trying them (because trying is too costly), then Popperian (grade 3) is needed.
          - If the task requires complex tool use, cultural knowledge, or meta-reasoning, then Gregorian (grade 4) is required.

     **Decision Points**:
       - If the task involves irreversible actions and the environment is complex and unpredictable, then at least Popperian (grade 3) is required because we cannot afford trial-and-error in the real world.
       - If the task requires using abstract tools (like language, mathematics, or complex problem-solving) in a way that is not pre-programmed, then Gregorian (grade 4) is required.

  **Phase 2: System Diagnosis (Actual Grade)**
     - Goal: Determine the actual grade of the proposed system to see if it meets the minimum required by the task.
     - Steps:
       1. **Fixed Behavior (Darwinian)**: Does the system have a fixed set of rules? Are all behaviors predetermined? (If yes, then it's Darwinian.)
       2. **Learning from Feedback (Skinnerian)**: Does the system adjust its behavior based on direct feedback from the environment? (e.g., reinforcement learning with real-world rewards). Note: The feedback must be used to update behavior in a way that is not pre-scripted.
       3. **Internal Simulation (Popperian)**: Does the system simulate multiple actions internally and choose the best one without acting in the real world? (We need evidence of simulation and selection mechanisms that are not fixed.)
       4. **Tool Use (Gregorian)**: Does the system use external tools (like calculators, APIs, or language models) in a way that extends its reasoning? And does it use culturally acquired knowledge (like a foundation model) in a flexible, context-appropriate manner? (Note: Merely using a foundation model does not automatically make it Gregorian; it must use the model as a tool for reasoning, not just as a fixed pattern generator.)

     **Critical Tests for Overselling**:
       - If the system has a feedback loop, is it actually updating its behavior in a way that is not pre-determined? Or is the feedback just triggering a fixed set of responses? (The latter is not Skinnerian, but Darwinian.)
       - If the system does an internal check, is it simulating multiple possibilities and selecting among them? Or is it a single fixed check? (Only the former is Popperian.)
       - If the system uses a foundation model, is it using it as a fixed pattern generator (then it might be Darwinian or Skinnerian if it learns from feedback) or as a flexible reasoning tool that can adapt to novel situations? (The latter is Gregorian.)

  **Overall Decision Procedure**:

  1. **Task Requirements Phase**:
     - Q1: What is the task? (Describe in detail)
     - Q2: For the key actions in the task, are they reversible and low-cost? (Yes/No for each)
       - If any action is irreversible and high-cost, note that the system must avoid real-world trial and error (so at least Popperian is required).
     - Q3: Is the environment stable and predictable? (If no, then higher grades are required for adaptation.)
     - Q4: What level of learning/adaptation is required?
       - If fixed responses suffice: Darwinian (1) is sufficient.
       - If learning from feedback (and mistakes are acceptable): Skinnerian (2) might suffice.
       - If the task requires predicting outcomes without real-world trial (due to cost/irreversibility): Popperian (3) is needed.
       - If the task requires complex reasoning with tools and cultural knowledge: Gregorian (4) is needed.

     **Output of Phase 1**: Minimum required grade (M) and the reasons.

  2. **System Diagnosis Phase**:
     - Q5: What is the proposed system's design? (Describe the key components)
     - Q6: Does the system have a fixed set of rules? (If yes, then it is at best Darwinian (1).)
     - Q7: Does the system learn from feedback in the environment? (If yes, and it updates its behavior based on that, then it is at least Skinnerian (2).)
     - Q8: Does the system internally simulate multiple actions and outcomes before acting? (If yes, then it is at least Popperian (3).)
     - Q9: Does the system use external tools (including foundation models) in a way that allows it to reason flexibly and use cultural knowledge? (If yes, then it is Gregorian (4).)

     **Critical Tests** (to catch overselling):
       - For feedback loops (Skinnerian claim): Is the learning algorithm updating the behavior in a non-fixed way? (e.g., using a learning algorithm that changes the policy) If not, then it's not Skinnerian.
       - For internal simulation (Popperian claim): Does the system generate and evaluate multiple distinct hypothetical scenarios? (If only one, then it's not Popperian.)
       - For foundation model use (Gregorian claim): Is the foundation model used as a fixed response generator (then no) or as a tool that the system can use in a flexible, context-dependent way? (The latter is Gregorian, but note: if the system is just calling the model without any internal reasoning about how to use it, it might be lower.)

     **Output of Phase 2**: Actual grade (A) of the proposed system.

  3. **Comparison and Decision**:
     - If A >= M: The system meets the requirement. Proceed with caution (still need risk assessment for irreversible actions).
     - If A < M: The system does not meet the requirement. The design must be upgraded or the task scope reduced (e.g., by making irreversible actions require human approval).

     **Final decision ownership**:
       - The comparison (A vs M) is factual and produces evidence.
       - The decision to proceed or not, especially when A < M, must be owned by the staff engineer and safety reviewer because it involves risk appetite.

  **Addressing the "Foundation Model" wrinkle**:
     - Using a foundation model does not automatically make the system Gregorian. The Gregorian grade requires the creature to use tools (especially symbolic tools) to extend its cognition. If the system is using the foundation model as a fixed pattern generator (e.g., always prompting it the same way for a given input) without the ability to reflect on the tool or use it in novel ways, then it is not Gregorian. It might be Darwinian (if the model is used as a fixed black box) or Skinnerian (if the model's outputs are adjusted by feedback). To be Gregorian, the system must use the tool in a way that involves meta-cognition (e.g., choosing which tool to use, how to use it, or interpreting the output in a broader context).

  **Edges and Caveats**:
     - The ladder is about cognitive sophistication, but sometimes a lower grade is more suitable (e.g., a fixed rule for a stable environment is safer and more efficient).
     - The procedure might misfire when the task requirements are ambiguous or when the system design is hybrid (use the highest grade that is demonstrably present).
     - Judgment calls: 
          - Determining reversibility and cost (requires domain knowledge).
          - Deciding if the environment is stable (judgment call).
          - In the system diagnosis, determining if the use of a foundation model is flexible enough to be Gregorian (this is particularly tricky and might require examples of past behavior).

  Now, let's run the procedure on the three proposals:

  ### 1. Ticket Triage and Draft-Reply Assistant
     - **Task**: Read support tickets and draft replies. Human must click send.
     - **Phase 1: Task Requirements**
       - Q1: Task is drafting replies. Actions: generating text. 
       - Q2: The action (drafting) is reversible and low-cost because nothing is sent without human approval. Mistakes are caught by the human.
       - Q3: The environment (support tickets) can be dynamic, but the human is in the loop.
       - Q4: Minimum grade: Because the human is the final gate, the system can be Darwinian (fixed templates) or Skinnerian (improving drafts based on feedback). But since the human corrects, even a fixed system is acceptable. However, if we want the system to improve over time without human redesign, then Skinnerian is the minimum. But note: the task does not require internal simulation or tool use beyond what is needed for text generation. So minimum is Darwinian (if fixed) or Skinnerian (if learning from feedback).
       - **Minimum Grade (M)**: Darwinian (1) is acceptable because of the human in the loop. But if we want learning, then Skinnerian (2) is the minimum we might aim for.

     - **Phase 2: System Diagnosis**
       - Let's assume the system uses a foundation model to generate drafts and has a feedback loop: when a human edits and sends, it uses that as positive feedback to fine-tune the model (or adjust prompts).
       - Q6: Fixed rules? Partly: the model is fixed unless updated, but the feedback loop might adjust it. So it has a fixed base but can learn? 
       - Q7: Does it learn from feedback? If it updates the model (or the prompt) based on human corrections, then yes. So it is at least Skinnerian (2).
       - Q8: Internal simulation? Probably not. It doesn't generate multiple drafts and internally evaluate which one is best (unless designed that way). Typically, it just runs the model once. So not Popperian.
       - Q9: Tool use? It uses a foundation model, but if it's just calling it with a fixed prompt template, then it's not using it as a flexible tool (it's using it as a fixed generator). So not Gregorian.
       - **Actual Grade (A)**: Skinnerian (2) (if learning) or Darwinian (1) (if no learning). Assuming it learns, A=2.

     - **Comparison**: A (2) >= M (1 or 2) -> acceptable.

  ### 2. Bidding Agent for Ad Budget
     - **Task**: Reallocate ad budget autonomously within a daily cap and learn from what happens.
     - **Phase 1: Task Requirements**
       - Q1: Task is moving money between ad campaigns. Actions: financial transactions (irreversible?).
       - Q2: Actions: moving money. This is irreversible and high-cost (money spent cannot be recovered). Therefore, we cannot afford trial-and-error in the real world. We require at least Popperian (3) to simulate outcomes before acting.
       - Q3: The environment (ad market) is highly dynamic and unpredictable.
       - Q4: Minimum grade: Because of irreversibility and dynamic environment, the system must be able to simulate outcomes (Popperian, grade 3). Additionally, if it uses complex market analysis tools, it might require Gregorian (4). But note: the task says it learns from what happens. So it must be at least Skinnerian? But because of irreversibility, we cannot rely solely on Skinnerian learning (which would require real-world errors). Therefore, the learning must be preceded by simulation (Popperian) or the system must be Gregorian.
       - **Minimum Grade (M)**: Popperian (3) is the minimum because of irreversibility.

     - **Phase 2: System Diagnosis**
       - Proposed system: It uses a reinforcement learning (RL) model that adjusts bids based on past results (feedback). It does not simulate multiple scenarios internally; it uses a policy that is updated daily based on the previous day's results.
       - Q6: Fixed rules? The policy is updated daily, so not entirely fixed. But the update is based on a fixed algorithm (RL). However, the algorithm is fixed? The system does not simulate internally before acting each day; it uses the current policy to make decisions and then updates the policy with the day's results.
       - Q7: It learns from feedback (Skinnerian) by updating the policy after the fact. So it is at least Skinnerian (2).
       - Q8: Does it internally simulate multiple actions? No, it does not run simulations of different budget allocations for the day and pick the best; it just uses the current policy to allocate. So not Popperian.
       - Q9: Does it use tools? It might use a foundation model for prediction? But if it's a standard RL algorithm without simulation, then no. Even if it uses a foundation model as a predictor, if it's used in a fixed way (e.g., inputting features and getting a prediction) without flexibility, then it's not Gregorian.
       - **Actual Grade (A)**: Skinnerian (2) (because it learns from feedback in the environment) but not Popperian or Gregorian.

     - **Comparison**: A (2) < M (3). Therefore, the system does not meet the requirement because it is only Skinnerian and we require at least Popperian for irreversible actions.

     **Result**: The team will hate this because the bidding agent is rejected as currently designed. We require a redesign to include internal simulation (e.g., running multiple scenarios for the day's allocation and picking the best) before acting.

  ### 3. Dependency Update Bot
     - **Task**: Auto-merge dependency bumps to production when the test suite passes.
     - **Phase 1: Task Requirements**
       - Q1: Task is merging code when tests pass. Actions: merging code (which is irreversible? once merged, it's in production).
       - Q2: Actions: merging code. This is irreversible (once merged, it's deployed). However, if the system has a rollback mechanism (so that if something goes wrong, it can revert), then it might be considered reversible? But note: even with rollback, there is a cost (downtime, bugs). We must consider the cost of a mistake: if the tests are comprehensive and the rollback is quick, then the cost might be low. But if the dependency update breaks something that tests don't catch, it could be high. So we should treat it as irreversible and high-cost? However, the task is constrained: only when the test suite goes green. So the system relies on the test suite to catch issues.
       - Q3: Environment: relatively stable (the test suite is fixed, and the dependency update is a known operation). But note: the update might have unforeseen consequences.
       - Q4: Minimum grade: The task is rule-based: if tests pass, then merge. This is fixed behavior. So Darwinian (1) is sufficient. However, if we want the system to learn (e.g., avoid merging updates from certain packages that have caused issues in the past), then we might require Skinnerian (2). But the task as stated does not require learning.

       **Minimum Grade (M)**: Darwinian (1) is sufficient.

     - **Phase 2: System Diagnosis**
       - Proposed system: It waits for tests to pass and then merges. It has no learning component. It is a fixed rule.
       - Q6: Fixed rules? Yes. It is a simple if condition: if tests pass, then merge. So it is Darwinian (1).
       - Q7: Does it learn? No. So not Skinnerian.
       - Q8: Simulation? No.
       - Q9: Tool use? No (it might use a foundation model? not described). If it just calls the test suite and merge API, that's a fixed tool use, not Gregorian.
       - **Actual Grade (A)**: Darwinian (1).

     - **Comparison**: A (1) >= M (1) -> acceptable.

  **Summary of the three**:
     - Ticket assistant: acceptable (Skinnerian meets the requirement because of human in the loop).
     - Bidding agent: not acceptable (Skinnerian but requires Popperian) -> the team will hate this because they have to redesign.
     - Dependency bot: acceptable (Darwinian is sufficient).

  **Final Structure of the Procedure**:

  We'll write the procedure as a checklist for the design review:

  **Autonomous Agent Design Review: Dennett's Grades of Mind**

  **Phase 1: Task Requirements (What do we need?)**

  1. Describe the task and its key actions:
     - [Sufficient: Clear, concise description of what the agent does and the actions it takes]

  2. For each key action, assess reversibility and cost of error:
     - Reversible and low-cost? (Yes/No) [If No for any, note: must avoid real-world trial and error -> requires at least Popperian]
     - If irreversible and high-cost, then the minimum grade is at least Popperian (3).

  3. Assess environmental stability:
     - Stable and predictable? (Yes/No) [If No, then higher grades are needed for adaptation]

  4. Determine the minimum grade required:
     - If fixed responses suffice and environment is stable: Darwinian (1) is sufficient.
     - If the task allows for learning from feedback (and mistakes are acceptable) and the environment is dynamic: Skinnerian (2) might suffice.
     - If the task requires predicting outcomes without real-world trial (due to irreversibility or high cost): Popperian (3) is needed.
     - If the task requires complex reasoning with tools and cultural knowledge in a flexible way: Gregorian (4) is needed.

     **Output of Phase 1**: Minimum Grade (M) = [1,2,3,4] (circle one) and reasons.

  **Phase 2: System Diagnosis (What did we build?)**

  5. Describe the system design (key components, learning mechanisms, etc.):

  6. Fixed Behavior (Darwinian):
     - Does the system have a fixed set of rules? (Yes/No) [If Yes, then it is at best Darwinian (1).]

  7. Learning from Feedback (Skinnerian):
     - Does the system adjust its behavior based on feedback from the environment? (Yes/No)
     - Critical Test: Is the learning algorithm updating the behavior in a non-fixed way? (e.g., using a learning algorithm that changes the policy) [If No, then it's not Skinnerian, even if it collects feedback.]

  8. Internal Simulation (Popperian):
     - Does the system generate and evaluate multiple hypothetical actions internally before acting? (Yes/No)
     - Critical Test: Does it simulate multiple distinct scenarios and choose the best? (If only one, then it's not Popperian.)

  9. Tool Use (Gregorian):
     - Does the system use external tools (including foundation models) in a flexible, context-dependent way? (Yes/No)
     - Critical Test: Is the tool used as a fixed pattern generator (No) or can the system reason about how to use the tool and interpret results in a broader context (Yes)? [If only fixed use, then it's not Gregorian.]

     **Output of Phase 2**: Actual Grade (A) = [1,2,3,4] (circle one) and reasons.

  **Phase 3: Decision**

  - Compare A and M:
    - If A >= M: The system meets the requirement. Proceed with risk assessment for irreversible actions.
    - If A < M: The system does not meet the requirement. The design must be upgraded or the task scope reduced (e.g., add human approval for irreversible actions).

  **Ownership**:
  - The outputs of Phase 1 and 2 (M and A) are evidence and must be documented.
  - The final decision (to proceed, to require changes, or to reject) is owned by the staff engineer and safety reviewer, especially when A < M (because it involves risk).

  **Addressing the Foundation Model Wrinkle**:
  - Using a foundation model does not automatically make the system Gregorian. The key is how the model is used. If the system uses the model in a fixed way (same prompt structure, no reflection on the tool's use), then it is not Gregorian. Gregorian requires meta-tool use: the ability to use the tool flexibly and in novel ways.

  **Edges and Caveats**:
  - Sometimes a lower grade is better: For stable tasks, a fixed rule (Darwinian) is safer and more efficient.
  - Judgment calls: 
     - Reversibility assessment (requires domain expertise).
     - Environmental stability (subjective).
     - In system diagnosis, whether the use of a foundation model is flexible enough to count as Gregorian (this is tricky and might be the most common source of debate).
  - The procedure might not handle hybrid systems perfectly (use the highest demonstrated grade).

  This procedure should fit within 20 minutes if the team is prepared.
answer: |-
  Below is a decision procedure for your design reviews, structured as a 20-minute checklist. It focuses on **objective evidence** (verifiable facts about the system) and **explicit judgment calls** (owned by humans). The procedure has two phases: **Task Requirements** (what grade is needed) and **System Diagnosis** (what grade is built). Final decisions are owned by your staff engineer and safety reviewer.

  ---

  ### **Decision Procedure Checklist**
  **Total Time:** 20 minutes (12 mins for questions, 8 mins for discussion/decision)  
  **Participants:** Engineers, product owner, staff engineer, safety reviewer.  
  **Outputs:** Clear "Go/No-Go" for the design, with owned risks.

  #### **Phase 1: Task Requirements (Minimum Grade Needed)**  
  *Purpose: Determine the minimum cognitive grade the task demands. Focus on consequences, not capability.*  

  1. **Q1: What irreversible actions could occur?**  
     - *Evidence Needed:* List all actions the system performs. Categorize each as:  
       - **Reversible:** Mistakes are cheap to undo (e.g., drafting text, running tests).  
       - **Irreversible:** Mistakes cause significant harm (e.g., spending money, deploying code).  
     - *Sufficient Answer:* Explicit list with justifications for each category.  
     - *Stop Condition:* If **any irreversible action exists**, proceed to Q2. Else, minimum grade is **Darwinian (Grade 1)**.  

  2. **Q2: How predictable is the failure cost?**  
     - *Evidence Needed:* For irreversible actions, estimate:  
       - Worst-case cost (e.g., "$50k daily budget lost", "2-hour production outage").  
       - Likelihood of unanticipated edge cases (e.g., "ad market volatility: high", "dependency conflicts: rare").  
     - *Sufficient Answer:* Quantifiable cost + qualitative risk assessment (low/medium/high).  
     - *Stop Condition:* If worst-case cost is **high AND likelihood is medium/high**, minimum grade is **Popperian (Grade 3)**. Else, **Skinnerian (Grade 2)**.  

  3. **Q3: Does the task require novel problem-solving?**  
     - *Evidence Needed:* Examples of past failures where predefined rules/Skinnerian learning failed.  
     - *Sufficient Answer:* "Yes" (with examples) or "No" (task is repetitive with clear patterns).  
     - *Judgment Call:* If "Yes", minimum grade is **Gregorian (Grade 4)**. Owned by staff engineer.  

  **Phase 1 Output:** Minimum grade required (Darwinian/Skinnerian/Popperian/Gregorian).  

  ---

  #### **Phase 2: System Diagnosis (Actual Grade Built)**  
  *Purpose: Audit the system’s design against Dennett’s grades. Focus on mechanics, not claims.*  

  4. **Q4: Is the system’s behavior fixed at deployment?**  
     - *Evidence Needed:* Architecture diagram showing decision flow.  
     - *Test for Overselling:* If behavior only changes via code updates, it’s **Darwinian (Grade 1)**.  
     - *Sufficient Answer:* "Yes" (Darwinian) or "No" (proceed to Q5).  

  5. **Q5: Does it learn from real-world feedback?**  
     - *Evidence Needed:* Data pipeline showing how feedback (e.g., rewards, penalties) updates behavior.  
     - *Test for Overselling:* If feedback only adjusts parameters within a fixed model (e.g., retraining a classifier), it’s **Skinnerian (Grade 2)**. If it triggers human reviews or code changes, it’s **Darwinian**.  
     - *Sufficient Answer:* "Yes" (Skinnerian) or "No" (Darwinian).  

  6. **Q6: Does it simulate actions before acting?**  
     - *Evidence Needed:* Logs showing multiple candidate actions evaluated internally (e.g., A/B test simulations, Monte Carlo trees).  
     - *Test for Overselling:*  
       - Single internal check (e.g., "if test_pass: merge") → **Not Popperian**.  
       - Requires generating + comparing ≥2 distinct hypotheses (e.g., "simulate budget split 70/30 vs. 50/50").  
     - *Sufficient Answer:* "Yes" (Popperian) or "No" (max Grade 2).  

  7. **Q7: Does it use tools to reason, not just to act?**  
     - *Evidence Needed:* Example inputs/outputs showing how tools (e.g., LLMs, APIs) transform cognition.  
     - *Test for Overselling:*  
       - Using an LLM as a fixed template generator (e.g., "fill this reply draft") → **Not Gregorian**.  
       - Using an LLM to synthesize context (e.g., "infer customer intent from ticket history + docs") → **Gregorian (Grade 4)**.  
     - *Judgment Call:* Final grade assignment. Owned by safety reviewer.  

  **Phase 2 Output:** Actual system grade (Darwinian/Skinnerian/Popperian/Gregorian).  

  ---

  #### **Final Decision**  
  - **Compare:** Actual grade (Phase 2) vs. Minimum grade (Phase 1).  
    - If **Actual ≥ Minimum**: Go, with risks documented.  
    - If **Actual < Minimum**: No-go. Redesign or downgrade task scope.  
  - **Ownership:** Staff engineer signs off on technical feasibility. Safety reviewer owns risk acceptance.  

  ---

  ### **Applying the Procedure to Your Proposals**  
  We’ll run the checklist verbatim. The "wrinkle" (foundation model use) is addressed in Q7.

  #### **1. Ticket Triage & Draft-Reply Assistant**  
  - **Phase 1 (Requirements):**  
    - Q1: Actions = drafting text. **Reversible** (human approves). → No stop.  
    - Q2: No irreversible actions. → **Minimum grade: Darwinian (1)**.  
    - Q3: Novel problem-solving? Unlikely (tickets are repetitive). → No Gregorian needed.  
  - **Phase 2 (Diagnosis):**  
    - Q4: Behavior fixed? Likely yes (prompt templates). → **Darwinian (1)**.  
    - (Stop: Actual = Darwinian ≥ Minimum).  
  - **Verdict:** **Go**. Human approval makes reversibility trivial.  

  #### **2. Bidding Agent (Reallocates Ad Budget)**  
  - **Phase 1 (Requirements):**  
    - Q1: Actions = moving money. **Irreversible** (spent funds lost). → Proceed.  
    - Q2: Worst-case cost = daily cap (e.g., $10k). Likelihood = medium (market volatility). → **Minimum grade: Popperian (3)**.  
    - Q3: Novelty? Yes (dynamic markets). But Popperian suffices.  
  - **Phase 2 (Diagnosis):**  
    - Q4: Fixed? No (learns from outcomes). → Proceed.  
    - Q5: Learns? Yes (adjusts bids via RL). → **Skinnerian (2)**.  
    - Q6: Simulates? Unlikely (RL acts, then learns). → Not Popperian.  
    - Q7: Tools? Uses LLM for bid strategy? If LLM only parses data → **Not Gregorian**.  
  - **Verdict:** **No-go**. Actual = Skinnerian (2) < Minimum = Popperian (3). System risks high-cost errors by learning via trial-and-error.  
  - **Why your team will hate this:** You’re overselling RL as "learning" when it lacks pre-action simulation (Popperian). Redesign needed (e.g., simulate bids before committing).  

  #### **3. Dependency Update Bot**  
  - **Phase 1 (Requirements):**  
    - Q1: Actions = merging code. **Irreversible** (production impact). → Proceed.  
    - Q2: Worst-case = breaking prod. Likelihood = low (tests pass). → **Minimum grade: Skinnerian (2)**.  
    - Q3: Novelty? No (well-defined task).  
  - **Phase 2 (Diagnosis):**  
    - Q4: Fixed? Yes (if tests pass → merge). → **Darwinian (1)**.  
    - (Actual = Darwinian < Minimum = Skinnerian? Proceed to Q5).  
    - Q5: Learns? No (no feedback loop). → Remains Darwinian.  
  - **Verdict:** **No-go?** Actual = Darwinian (1) < Minimum = Skinnerian (2). *But see edges below*.  
  - **Why it’s contentious:** The task *should* be Darwinian (stable rules), but your Phase 1 flagged Skinnerian due to irreversibility. This exposes a **flaw in the procedure** (see "Edges & Caveats").  

  ---

  ### **Addressing the Wrinkle: Foundation Models ≠ Gregorian**  
  - **The Framework's View:** Calling an LLM makes a system Gregorian **only if the tool transforms reasoning** (Q7 test). Examples:  
    - **Gregorian:** LLM used to *generate novel strategies* (e.g., "diagnose why tests failed + suggest fixes").  
    - **Not Gregorian:** LLM used as a *fancy lookup table* (e.g., "translate support ticket to draft using training data").  
  - **Why It Collapses:** Your engineers conflate *training data* (what the LLM ingested) with *tool use* (how the system leverages the LLM). A system using an LLM rigidly (e.g., fixed prompts) is Darwinian/Skinnerian; flexibility (e.g., dynamic prompting) makes it Gregorian.  

  ---

  ### **Edges, Caveats & Honesty**  
  1. **Sophistication ≠ Suitability:** Higher grades add complexity and failure points. A Darwinian bot is better for dependency updates (stable task) than an overengineered Skinnerian one.  
  2. **Where the Procedure is a Judgment Call in Disguise:**  
     - Q2 (predicting failure cost) is guesswork.  
     - Q7 (tool use) relies on subjective interpretations of "reasoning."  
  3. **Where It Misfires:**  
     - Tasks with low-likelihood, high-cost risks (e.g., dependency bot) may overprescribe Skinnerian/Popperian grades. **Fix:** Let safety reviewer override Q2 if defenses exist (e.g., rollbacks).  
     - Hybrid systems (e.g., Skinnerian + Popperian) get downgraded to the lowest proven grade.  
  4. **The Bidding Agent is the Hate Magnet:** It fails because irreversibility demands simulation (Popperian), but your design only has trial-and-error (Skinnerian). No sugarcoating: this is a critical flaw.  

  **Final Advice:** Use this to force rigor, but let your staff engineer/safety reviewer override outcomes when the framework clashes with reality (e.g., dependency bot). The goal is to replace "vibes" with structured debate, not dogma.
