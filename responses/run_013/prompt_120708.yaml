answer: |-
  ## The Coin in the Current: Remembering Frank Ramsey

  [Standing at the lectern, perhaps placing a small coin on it, visible but not ostentatious]

  We gather in this chapel – a place resonant with centuries of seeking, doubt, and faith – to remember Frank Plumpton Ramsey. It is a setting charged with meaning, perhaps especially so for him. A militant atheist, by the account of the woman who knew him best, Lettice. And the younger brother of Michael, who would one day sit in Canterbury. This space, then, is not a backdrop to ignore, nor a provocation to exploit. It is simply the place where we, his intellectual descendants, friends, and family, choose to gather *now*. It holds our shared intention: to remember a man whose brilliance burned fiercely, illuminating paths in logic, probability, economics, and thought itself, before being extinguished at twenty-six.

  Our gathering holds another tension. Some here could reconstruct his proof of the combinatorial theorem before breakfast, debate the nuances of his subjective probability framework, or trace the influence of his thoughts on conditionals through decades of philosophy. Others know Ramsey through a single, luminous page. The page where he insists the world isn’t drawn to scale, but in perspective. Where human beings fill the foreground, where stars shrink, he says, to the size of **small coins**, and the far future dwindles in present value. Some find comfort there. Some find challenge. Frank would likely have found both reactions interesting, perhaps even amusing, but he would demand we understand the *point*.

  He wasn’t offering an astronomer’s map, nor a mystic’s consolation. He was describing the *only* map that matters. Meaning, value, decision – these aren't functions of cosmic scale. That perspective isn't a distortion to be corrected by gazing at nebulae; it’s the very frame within which anything *matters* at all. What use is humility before the vastness of the heavens, he asked, when the heavens cannot think or love? That instinct to zoom out, to seek solace in our cosmic insignificance? That, I believe, was the very reflex he gently mocked. His genius lay not in shrinking the universe, but in showing how the human foreground – our loves, our fears, our tangled probabilities and decisions made under uncertainty – is the true locus of significance. It’s where logic meets life.

  This brings me to a scene from my novel. I imagined Frank walking with Wittgenstein on a Cambridge night. Stars pricking the dark. They argue. Wittgenstein, perhaps, insisting on the sheer, austere *fact* of the stars, their absolute claim on our perception. And Frank – my Frank – arguing back, not denying the stars, but denying their *claim* on our values. Are we obliged to feel dwarfed? To rearrange our human priorities because of their distant light? For Frank, the answer was no. The stars are facts; our responsibilities, our loves, our calculations of what to *do* next Tuesday, happen *here*, in the human-scaled foreground.

  [Pause, look out]

  But I must pause here. I am a novelist. That walk, that specific argument under those specific stars? That is my invention. I conjured it to try and capture the *flavour* of his thought, the thrust of his challenge to perspectives that diminish the human. I believed it revealed something true about his character, his intellectual courage. Yet, speaking now, in this place, among those who knew the *actual* man… it costs me to admit the fabrication. It feels like a necessary betrayal of the pure, elusive reality of Frank Ramsey, to trade it for a narrative device. But perhaps that tension – between the effort to grasp him and the inherent distance – is itself a testament to his singular, challenging presence.

  He was a deflator of grand pretensions, philosophical or otherwise. His most famous remark about his own field cuts deep: "What we can't say we can't say, and we can't whistle it either." Philosophy’s chief proposition, he suggested, is that philosophy is nonsense. And then came the crucial rider: we mustn’t then treat it as *important* nonsense. It was a call for clarity, for relevance, for keeping our feet planted firmly in the world where decisions are made, probabilities assessed, and lives lived.

  So, how do we remember him, without undoing him? No borrowed Christianity, no consoling talk of being "part of something larger" in a sense he’d reject. No facile claim that he "lives on in his work" if that implies something he, the materialist, couldn't assent to. He is gone. That is the stark fact.

  But what remains? Look at this coin. [Pick up the coin]. Small, human-made, passing from hand to hand. Frank saw stars shrunk to this scale in the vast perspective drawing. But consider the coin’s other qualities. Its *weight* in the palm. Its defined *edge*. Its specific *value* in a transaction. Its history in pockets and purses. Its concrete *presence*.

  Frank Ramsey’s legacy feels like that. Not a vast, nebulous glow, but something smaller, sharper, more tangible. The weight of his ideas – the combinatorial insight, the probability framework, the deflationary honesty – that continue to shape fields. The edge of his wit, his clarity cutting through confusion. The value of his example: intellectual fearlessness, applied with rigor to the things that truly concern us – belief, action, saving, meaning itself. And his presence? It persists, not as an eternal spirit in this chapel, but as a distinct, irreplaceable pattern in the fabric of those who knew him, those who read him, those who grapple with the problems he illuminated.

  He asked us to see the world as it is, drawn in perspective. To find meaning not in the distant, unthinking cosmos, but right here, in the vivid, complicated foreground of human life and thought. To value the sayable over the ineffable. To do the work, clearly, bravely, without whistling in the dark. That is the work he did. That is the perspective he gave us. That is the sharp, invaluable coin he left in the current of human understanding. Let us remember him for that. Clearly. Honestly. And without illusion.
