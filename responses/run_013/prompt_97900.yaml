answer: |-
  ## Building Permit  
  *(for the classical ghost in the room)*

  The chalk, this stub, the dusty board I wipe,
  A proof begins with what the hand can hold.
  Not theorems whispered from some distant fold,
  But **not that nothing answers to the type**.

  I need a bracket. Here: a solid brace.
  A function? Yes: this ink, this flowing line.
  Its value? See it cross this ruled design.
  **Not that it fails to find its proper place**.

  The ghost suggests: "Either the proof holds or—"
  *No. Strike that. Show the path or show the block.*
  I trace the steps across the concrete rock.
  The sum is here: this chalk-mark on the floor.

  **Not that nothing answers to the type**.
  I've built this much: foundations squared and true.
  The arch requires a keystone, strong and new.
  It *must* exist! The structure strains, let's grip—
  But wait... where is the weight that fills the gap?
  My hand finds air. The arch begins to sag.
  I brace the void with scaffold, beam, and rag.
  **Not that it fails to find its proper place**.

  The ghost sighs, "Surely *something* must align..."
  I point: "There? Show me." Silence. Only space.
  I work the mortar on the vacant base.
  **Not that nothing answers to the type**.
  This poem stands, a witness, as I write.

  ---

  ### Craft Notes: Constructive Constraints at Work

  | Lines       | Formal Device                               | Intuitionistic Feature Encoded                     | What a Classical Version Would Have Done Instead          |
  | :---------- | :------------------------------------------ | :------------------------------------------------- | :-------------------------------------------------------- |
  | 1-2         | "The chalk, this stub... A proof begins..." | Exhibits witness for starting point (chalk, stub) | Might state existence abstractly: "A proof exists..."     |
  | 4, 12, 24   | Refrain: **Not that nothing answers...**     | Fallback for unproven existence (`¬¬∃` vs `∃`)     | Would assert direct existence: "Something answers..."     |
  | 6-7         | "A function? Yes: this ink... Its value? See..." | Exhibits witness for function & value (ink, line) | Would claim existence without display: "There exists a function mapping..." |
  | 9-10        | "Either the proof holds or—" / "No. Strike that..." | Rejects unresolved disjunction; demands path/block | Would leave disjunction open: "Either P holds or it fails." |
  | 17-18       | "It *must* exist! ... But wait... where is...?" | Turn: Desires necessity, lacks witness ("hand finds air") | Would conclude existence from necessity/impossibility of non-existence. |
  | 21-22       | "The ghost sighs, 'Surely *something* must...' / I point: 'There? Show me.'" | Refutes classical "must exist" by demanding witness | Would accept "must exist" as proof (`¬¬P → P`).           |
  | 25          | "This poem stands, a witness, as I write."  | Final exhibited witness (the poem itself).         | Might claim a transcendent resolution beyond the page.    |

  **Structural Notes:**
  *   **Refrain:** Embodies the `¬¬∃` fallback ("not nothing answers" / "not that it fails"), contrasting the desired `∃`. Its repetition underscores the *persistent gap*.
  *   **Turn (Lines 17-20):** The emotional peak ("It *must* exist!") clashes immediately with the lack of witness ("where is...?", "hand finds air"), forcing retreat to bracing the void (scaffold/beam/rag) and finally the fallback refrain.
  *   **Classical Ghost (Lines 9 & 21):** The ghost's open disjunction ("Either...or—") and appeal to necessity ("Surely *something* must...") are explicitly refused or countered by demands for constructive evidence ("Show the path...", "Show me").
  *   **Witness Exhibition:** Chalk, ink, line, mark, poem itself are tangible exhibits. The "vacant base" (line 23) is the *absence* of a needed witness.
  *   **Process:** Verbs like "wipe," "trace," "work," "write," and the final "as I write" emphasize the construction happening *now*, not just reporting a finished result.

  The poem builds its argument *through* constraint: it can only claim what it displays, longs for what it cannot yet grasp, and visibly rejects the classical shortcuts its ghost suggests. The gap between the fallback refrain and the desired certainty *is* the subject.
