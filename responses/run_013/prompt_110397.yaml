answer: |-
  Here’s a speech tailored to your constraints, followed by a doctrinal note:

  **Speech: "Two Compasses"**  
  *(10 minutes, post-dessert, wine-friendly)*  

  "Friends, tonight, a woman in Nepal is seeing her granddaughter’s face clearly for the first time in years. A village is drinking clean water without a three-hour walk. That’s your generosity at work. Thank you.  

  Now, I see two kinds of people here tonight. Some of you are asking: *‘Show me the numbers. How many surgeries per dollar? How many sight-years?’* You want impact measured, maximized, multiplied. I respect that deeply. In fact, I rely on it. Our surgical partners deliver cataracts removed at $50 a surgery. Our wells serve 300 people for life at $3,000. That’s not just efficient—it’s a miracle.  

  Others here—our monastic friends—might whisper: *‘But what about the heart? What moves the hand that gives?’* In their tradition, a gift’s power isn’t just in the outcome, but in the intention behind it. A coin given with grudging calculation doesn’t weave the same karmic thread as one offered with selfless joy.  

  So which is it? Outcomes or intentions? Spreadsheets or souls?  

  Let me offer a different angle.  

  Buddhism teaches that the ‘self’ is less fixed than we think. The ‘you’ of twenty years from now? In a very real sense, that’s a stranger. And the stranger across the ocean? They’re as vivid, as capable of suffering, as *real* as future-you. When we grasp that—really grasp it—caring for that distant person becomes as natural as caring for our own tomorrow. That’s not philosophy—it’s liberation. It’s why we give.  

  Which brings me to the bodhisattva—the being who could step into freedom but chooses instead to stand with those still struggling. Not because the math demands it, but because compassion rewires the arithmetic.  

  Tonight, we honor our co-founder, Arjun, who embodied this. His widow, Priya, is here—her seed money was both shrewd investment and sacred offering. Arjun understood: this work needs *both* kinds of wisdom. The engineer’s precision to place a well where it serves most, and the monk’s insight that digging it is an act of kinship.  

  So here’s the ask: Help us restore sight for 200 more people. Fund five more wells.  

  $50 gives sight. $3,000 gives water. But the true currency? It’s the courage to care wildly for strangers—knowing that in the deepest sense, *they are you*.  

  Donate tonight. Let’s build miracles—one intentional, efficient, world-shifting gift at a time."  

  ---

  **Doctrinal Note: Liberties & Interpretations**  

  1. **Anatta (No-Self) Application**:  
     - **Liberty**: Framing anatta ("no fixed self") as dissolving the self/stranger dichotomy leans on a modern, universalist reading. Traditional texts focus on anatta to end suffering (not necessarily motivate charity).  
     - **Contested Point**: Some schools (e.g., Theravāda) caution against using anatta to negate conventional identity (e.g., "I donate"). Your pitch navigates this by emphasizing *expansion of care*, not self-erasure.  
     - **Risk**: A sharp critic might note the paradox of using "no-self" to persuade selves. Mitigated by focusing on *empathy*, not metaphysics.  

  2. **Karma Interpretation**:  
     - **Bet Placed**: We emphasized the **intention-centric view** (cetanā, or volition, as the essence of karma), aligning with monastic advisors. This is prominent in Mahāyāna (e.g., Śāntideva’s *Bodhicaryāvatāra*).  
     - **Alternative View**: The "outcome-linked" karma reading (where moral weight depends on results) exists in Abhidharma literature. We sidestepped this to avoid alienating monastics.  
     - **Switch Trigger**: If EA donors demanded doctrinal justification for impact metrics, we’d cite the Buddha’s pragmatism (e.g., prioritizing aid where it’s "most fruitful," AN 3.57).  

  3. **Bodhisattva Ideal**:  
     - **Liberty**: Calling the bodhisattva’s choice "compassion rewiring the arithmetic" implies a *fusion* of consequentialism and anti-consequentialism.  
     - **Ambiguity Preserved**: We avoided taking sides by focusing on motivation ("chooses to stand") over teleology.  

  4. **Kinship & Interconnection**:  
     - **Doctrinal Nudge**: "They are you" invokes *pratītyasamutpāda* (interdependence) more than anatta—a safer, more emotive framing.  

  **Where Doctrine Was Bent for Clarity**:  
  - Simplified karma to "intention = karmic weight" without addressing complexities like unintended consequences.  
  - Used "stranger-as-future-you" as a metaphor, not strict doctrine (texts don’t equate future selves with strangers; both are just "not-self").  

  **Final Note**: The speech’s power lies in *not resolving the tension*. It lets EAs feel validated by metrics, monastics by intention, and newcomers by the moral call to expand empathy. The widow’s presence anchors it in human legacy, not theory.
