prompt: |-
  I've got a home-made rule I call the reverse Munich test: before anyone can use a historical analogy in a foreign-policy debate, they have to say what evidence would have shown the original case didn't generalise -- what would have proved appeasement right in 1938, or that Vietnam was winnable, or that Athens and Sparta could have avoided war. If they can't, the analogy gets thrown out. What's your credence, between 0 and 1, that a crisis team using that test would make better calls than one that just argues from the analogies as usual -- better meaning fewer decisions they'd later judge catastrophic? Decompose it: how often the past case is causally relevant to the new one, how often we can know that before the fact, how often leaders would actually obey the test instead of rationalising their way round it, how often the test would throw out genuinely useful analogies, and how often there's a better decision procedure anyway. Give each a rough number and one line of why, then combine them. Tell me which term the final number is most sensitive to and what would move it most. British English, please, and keep it readable -- I'm not an academic.
