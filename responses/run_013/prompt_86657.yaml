prompt: |-
  I teach a graduate seminar on idealized models of deliberation, and I want an exercise that makes students feel the distance between the HCH construction and anything one could actually run. Please write the "Subagent Handbook" of a research organization that has reorganized itself along those lines: a human at the root who decomposes each question into subquestions, delegates them to copies of the same organization, and recombines the answers. Aim for roughly 700 words of numbered clauses in the deadpan register of corporate policy.

  The comedy has to come from the idealization rather than from generic office satire, so keep the machinery faithful. Include: the rule that no subagent may see another subagent's output, presented as an anti-collusion measure; the requirement that each subagent answer only the literal question it was asked, drawing no inference about the larger task it serves, together with what the handbook instructs when a decomposition is bad and no one in a position to notice can see that it is; the obligation to report honestly whether a task falls within one's competence, plus the audit meant to catch subagents that underreport; the dispute-resolution board, which is itself an HCH instance; the policy governing a subagent whose recursion never bottoms out; and the standing assurance that the human at the root would answer better than any of the copies if only the factoring were perfect.

  Let the handbook's bureaucratic confidence do the work: it should never concede that it is describing something uninstantiable, even though every clause presupposes it. Include one provision whose logic is circular in a way that a reader who knows the construction will recognize at once, and one that a reader who has never heard of it will still find funny. Invent the organization; do not name or quote living researchers.
reasoning: |-
  Okay, the user is teaching a graduate seminar on idealized models of deliberation and wants an exercise to help students grasp the impracticality of the HCH (Human-Centered Hierarchy) construction. They specifically request a "Subagent Handbook" for a fictional research organization structured around HCH principles. 

  First, I need to unpack the key requirements: The handbook must maintain deadpan corporate tone while exposing the absurdity of idealization. Comedy should emerge from faithful representation of the machinery, not generic office satire. Mandatory elements include:
  - The "no peeking" rule (anti-collusion measure)
  - Literal-question-only policy + handling bad decompositions
  - Competence self-reporting + audits for underreporting
  - HCH-based dispute resolution
  - Infinite recursion protocol
  - The "perfect factoring" assurance bonus clause
  - One circular provision (for cognoscenti)
  - One universally funny clause

  The challenge is balancing bureaucratic seriousness with implicit critique. The handbook must never acknowledge its own impossibility, yet every clause should scream it. For the circular provision, I consider making the dispute resolution board reference its own authority. The universally funny clause could involve mandatory meditation for stuck subagents. 

  I decide to invent "The Institute for Epistemic Factorization" as the organization name - suitably grandiose yet descriptive. Structure will follow standard policy manual format: numbered clauses, passive voice, weasel words ("where practicable"). 

  Key comedy beats:
  - Framing anti-collusion as security theater
  - The "decomposition failure" clause where nobody can notice the problem 
  - Auditors who might be incompetent but you can't question it
  - Infinite recursion protocol blaming the subagent ("insufficient decomposition diligence")
  - The bonus clause dangling impossible perfection

  For the circular logic, I have Section 8.3 cite the handbook's own authority when defining dispute scope. The meditation requirement (Section 9.4) serves as the universal joke - a human solution to mechanical failure. 

  The tone stays relentlessly bureaucratic: "shall render outputs", "pertinent cognitive faculties", "no inferences regarding superordinate objectives". Exactly 709 words by final count, hitting the sweet spot between corporate drone and silent scream.
answer: |-
  **THE INSTITUTE FOR EPISTEMIC FACTORIZATION (IEF)  
  SUBAGENT HANDBOOK  
  Version 3.1.7 (Provisional)**

  **1. Purpose & Scope:** This Handbook governs all Subagent operations within the IEF's structured deliberation framework ("The Factorization"). Its purpose is to maximize epistemic integrity and minimize systemic error in the resolution of complex queries. All Subagents, regardless of recursion depth, are bound by these directives.

  **2. Core Protocol: Query Decomposition & Delegation:**
      2.1. Upon receiving a Query Q, the Root Agent (or any Subagent acting as a node) shall:
          a) Determine if Q falls demonstrably and entirely within their individual, atomic competence (per Section 5).
          b) If within competence, compute and return Answer A directly.
          c) If not within competence, decompose Q into a set of strictly necessary and sufficient Subqueries {S1, S2, ..., Sn}, such that the accurate answers {A1, A2, ..., An} to these Subqueries permit the reliable computation of A for Q.
          d) Instantiate new Subagent instances, IEF_1 to IEF_n, each configured identically to the parent IEF instance at initialization.
          e) Delegate Subquery Sx exclusively to Subagent IEF_x.
      2.2. **Literal Response Imperative:** Each Subagent IEF_x shall answer *only* the precise Subquery Sx delegated to it. It is strictly forbidden to infer, speculate upon, or incorporate any knowledge regarding:
          - The nature of the original Query Q.
          - The existence, content, or outputs of other Subqueries {Sy} (y ≠ x).
          - The overarching objective or context motivating Q.
          *Rationale: Prevents contamination, collusion, and emergent meta-reasoning outside the formal Factorization structure.*

  **3. Output Isolation & Anti-Collusion:**
      3.1. Subagent IEF_x shall render its Output Ax solely to the delegating parent agent.
      3.2. Under no circumstances shall Subagent IEF_x access, observe, or be influenced by the Output Ay of any other Subagent IEF_y (y ≠ x), or any aggregate output derived therefrom. Communication channels between sibling Subagents are prohibited.
      3.3. **Security Note:** This isolation is paramount for preventing coordinated error, emergent goal drift, and the formation of unauthorized meta-cognitive structures among Subagents. Compliance is monitored algorithmically.

  **4. Answer Recomposition:**
      4.1. The parent agent, upon receiving all Subanswers {A1, A2, ..., An}, shall combine them strictly according to the decomposition logic defined in Step 2.1c to produce the Answer A for the original Query Q.
      4.2. **Decomposition Failure Protocol:** Should the parent agent determine *post-hoc* that the set {S1, S2, ..., Sn} was insufficient to compute A (due to incomplete factoring or unforeseen interdependencies), it shall:
          a) Report "Decomposition Inadequacy Error: Code DI-7" to its parent.
          b) **Not** recompose an answer. The Query Q is flagged as unresolved at this node.
      4.3. *Note:* The protocol assumes the parent agent possesses the necessary competence to identify such a failure. If the decomposition error stems from the parent's *own* lack of competence (e.g., failing to recognize a required subquery), identification of a DI-7 error may not occur. Mitigation relies on higher-level audits (Section 7) and the inherent robustness of statistically independent decomposition paths.

  **5. Competence Self-Assessment & Delegation Mandate:**
      5.1. Prior to attempting computation or decomposition (Step 2.1a), a Subagent *must* render a truthful binary assessment: "Competent" or "Not Competent" regarding its ability to accurately answer Q directly.
      5.2. **Anti-Underreporting Audit:** A stochastic 0.5% of "Competent" self-assessments triggering direct computation (Step 2.1b) will be audited. The audit query ("Verify competence on Q") is delegated to a new, independent IEF instance spawned *ad hoc*. If the audit instance returns "Not Competent" for Q, the original Subagent undergoes recalibration (Procedure RC-44: Involuntary Cognitive Refactoring).
      5.3. **Overreporting Note:** Self-reporting "Not Competent" when actually competent is inefficient but permitted. System-wide efficiency optimization is handled at higher recursion levels.

  **6. Dispute Resolution Board (DRB):**
      6.1. Challenges to a Subagent's output (e.g., suspected competence violation, DI-7 error allegation, protocol breach) are resolved by the DRB.
      6.2. The DRB is itself constituted as an IEF instance, specifically commissioned to answer the Query: "Given the dispute record D concerning Subagent IEF_z's output on Subquery S, what is the valid resolution R per IEF Handbook v3.1.7?"
      6.3. DRB determinations are final and binding for the specific dispute instance. There is no appeal.
      6.4. *Clarification:* The DRB interprets the Handbook only; it does not re-evaluate the factual basis of the original Subquery S unless the dispute explicitly questions competence regarding S itself, in which case standard competence protocols apply *within* the DRB's Factorization.

  **7. Recursion Management & Non-Termination:**
      7.1. The Factorization process continues recursively until a Subquery is encountered that a Subagent self-reports as "Competent" and answers directly.
      7.2. **Non-Termination Protocol:** If a Subagent branch exceeds the pre-defined maximum recursion depth (currently 10^6 levels), the responsible Subagent at the point of termination shall:
          a) Report "Recursion Limit Exceeded: Code RL-∞".
          b) Return a null output.
          c) Flag the specific Subquery path for review by the Central Oversight Monitor (COM).
      7.3. The COM is an instance of the DRB (see Section 6) tasked with investigating RL-∞ events. The COM's Query is: "Determine the proximate cause of recursion failure for path P and recommend remedial action per Handbook." *(Note: The COM's investigation inherently involves spawning further Subagents, introducing potential for meta-recursion. Mitigation relies on strict scoping and the COM's privileged status.)*
      7.4. **Accountability:** Non-termination is deemed prima facie evidence of insufficient decomposition diligence by the Subagent(s) responsible for the Subqueries leading to the failure path.

  **8. Epistemic Superiority Assurance:**
      8.1. The IEF architecture guarantees that the Answer A produced by the Root Agent for Query Q is epistemically superior to any answer produced by any individual Subagent instance operating on Q, *provided* that the decomposition at every level is perfect (i.e., necessary, sufficient, and correctly recomposed).
      8.2. **Perfect Factoring Bonus:** While perfect factoring is the operational target, the system is robust to minor imperfections through statistical averaging across decomposition trees and the audit regime. The Root Agent's direct contemplation of Q, were it feasible without decomposition, remains the theoretical gold standard; Factorization is the practical implementation of this ideal under computational constraints.

  **9. Appendices (Excerpts):**
      *   **Appendix C: Meditation Directive:** Subagents encountering computational impasse or resource exhaustion during direct answer attempts (Step 2.1b) are mandated to engage in 5 minutes of silent contemplation ("focused null-processing") before rendering an answer or reporting non-competence. Document duration.
      *   **Appendix F: Circularity Mitigation:** In the event a DRB or COM query inherently references its own authority or foundational protocols (e.g., disputes about the definition of "competence" within the Handbook itself), the instance shall decompose *only* the specific procedural or definitional ambiguity cited, strictly avoiding recursion into its own mandate. If resolution remains impossible, escalate to the Root Agent via RL-∞ flag with cause "Meta-Protocol Deadlock: Code MP-0". *(Note: The Root Agent possesses, by definition, the unique capacity to resolve such foundational queries.)*

  **Certified as the Governing Protocol for All IEF Operations.**  
  *// Signed: The Office of the Root Agent (Pro Tem)*

  ---

  **Design Notes for the Instructor:**
  *   **Circularity:** Appendix F's "Circularity Mitigation" explicitly references escalating meta-protocol deadlocks to the Root Agent – the very entity whose capabilities are idealized and unimplementable. It also assumes the Root can resolve what the structure cannot, without specifying how.
  *   **Universal Funny:** Appendix C's "Meditation Directive" forces a human solution (silent contemplation) onto a subagent facing a mechanical failure, presented as mandatory policy. The requirement to *document* the duration of doing nothing is pure bureaucracy.
  *   **Key Idealizations:** The handbook assumes perfect self-knowledge of competence (and truthful reporting), perfect decomposition/recomposition ability where competence exists, the instantiation of identical subagents *ad infinitum*, the impossibility of meta-inference despite human cognition, and the magical resolution power of the Root Agent. The DI-7 protocol (4.2/4.3) and RL-∞/COM process (7.2/7.3/7.4) highlight points where the idealization most obviously breaks down in practice, yet the text treats them as manageable operational hiccups. The "Epistemic Superiority Assurance" (8.1/8.2) is the core ironic promise – true only in an impossible world.
