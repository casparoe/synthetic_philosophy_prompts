prompt: |-
  I'm putting together a small working group — me and two other people, maybe five hours a week each for a year — on the tiny-probability-huge-payoff problem (Pascal's mugging and its relatives). Write this as a decision theorist who's actually worked on this and has opinions, not someone giving a neutral survey. Start by brainstorming what the live open questions even are here, then give me an agenda: which two or three we should spend the year on, in order, with the reasoning for the ordering — what's upstream of what, what a philosophically-trained person can make progress on without heavy math, what's neglected, and which answers would actually change someone's mind or behaviour if they got settled. I care less about the list then about why each thing is on it, and what you'd want to see by the six-month mark to know the bet was paying off.

  One wrinkle to take seriously, since it's what got us going: I think there's a difference between muggings that come from outside — some stranger, god, or simulator offers you the payoff — and what I've been calling "inside-out" muggings, where the enormous payoff is something your own decision theory lets you generate yourself at some absurdly small probabilty, with no mugger required. Is that a genuinely separate problem or the same problem in a costume, and does it change what we should work on?

  Also say how confident you are in the claims you're making, and single out the one you're least sure of.
