answer: |-
  Here’s the agenda I’d fight for, distilled from a decade of banging my head against this problem. The "inside-out" mugging isn’t a costume—it’s the *tumor* version of the problem that metastasizes when you try to cut out the original. **Confidence: 90%** that this distinction is crucial and underrated.  

  ### Live Open Questions (Brainstorm)
  1. **Why do "solutions" like bounded utility functions fail against *self-generated* muggings?**  
     (e.g., An agent assigns >0 probability to "if I do X, I’ll create a utility singularity in my future light-cone" via its own actions. No mugger needed.)  
  2. **Is probabilistic skepticism (ignoring tiny probabilities) *actually justifiable* without ad hoc thresholds?**  
     (Most approaches smuggle in arbitrary cutoffs. Can we ground this in epistemology or computation?)  
  3. **Do updateless/reflective decision theories (UDT, FDT) *solve* or *worsen* inside-out muggings?**  
     (They avoid dynamic inconsistency but might "pre-commit" to self-sabotage via cosmic hypotheses.)  
  4. **Can we formalize "Pascal’s Revenge"**:  
     When you ignore tiny P, you *inevitably* create agents that either:  
     - Get mugged externally, or  
     - Self-generate insane bets (e.g., AI diverting 0.001% resources to resurrecting dinosaurs "just in case").  
  5. **Does this problem *actually change behavior*?**  
     (If not, it’s academic. If yes, it nukes long-termist priorities, e.g., AI alignment.)  

  ---

  ### The Agenda: 3 Questions, Ordered by Dependency  
  *(Total: 5h/week/person × 3 × 52 weeks ≈ 780 person-hours)*  

  #### 1. **Clarify the Inside/Out Distinction & Its Implications** (Months 1–4)  
     **Why first?** Because *everything* hinges on whether this is a new problem or a variant.  
     - **Sub-questions**:  
       - Does "self-generation" evade probability skepticism? (e.g., You can’t assign low P to *your own algorithm’s output* being wrong without circularity.)  
       - Do "outside" muggings require trust in the mugger, while "inside" muggings exploit logical uncertainty?  
     **Neglected? Wildly**. People treat PM as about "weird offers," not agent design.  
     **Philosophy-friendly? Yes**. Focus on conceptual cartography: map where existing solutions (Kosonen’s bounds, nozick’s weights) fail against self-generated cases.  
     **Progress by 6mo**: A taxonomy of 3–5 *distinct* inside-out mugging mechanisms, with clear failure modes for 2+ "solutions."  
     **Confidence**: 85% this reveals new structure. **Least confident?** That self-generation *always* bypasses bounded utility (60% – but if true, game-changer).  

  #### 2. **Attack Probabilistic Skepticism’s Foundations** (Months 5–8)  
     **Why next?** If tiny P must be ignored, *how* you ignore it upstreams all solutions.  
     - **Sub-questions**:  
       - Can we formalize "non-arbitrary" ignoring? (e.g., computational complexity, Dutch book arguments)  
       - Does self-generation *force* probabilistic hypocrisy? (Ignoring low P externally but trusting it internally)  
     **Neglected?** Yes – the field handwaves "just regularize" without rigor.  
     **Philosophy-friendly? Mostly**. Requires parsing epistemology (e.g., subjective Bayes vs. imprecise prob).  
     **Progress by 6mo**: A draft paper on *why* "P < ε → ignore" collapses under reflection, +1 viable alternative (e.g., cost-weighted uncertainty).  
     **Behavior change?** If settled, this could kill naive long-termism (e.g., 0.0001% chance interventions).  

  #### 3. **Test Decision Theories via Inside-Out Stress Tests** (Months 9–12)  
     **Why last?** You need Q1–2 to build non-self-detonating agents.  
     - **Sub-questions**:  
       - Does UDT/FDT *generate* self-muggings by optimizing over impossible worlds?  
       - Can we modify causal decision theory to "discount" self-fulfilling prophecies?  
     **Neglected?** Decision theorists rarely let their theories *run* in toy universes with self-reference.  
     **Philosophy-friendly? Less so** – needs lightweight coding (e.g., logical inductors in Python).  
     **Progress by 6mo**: N/A – this starts late. By 12mo: A simulator showing 3+ DT variants either self-mugging or resisting.  
     **Behavior change?** If DTs *can’t* block self-muggings, we’d need new ones – altering AI safety frameworks.  

  ---

  ### Why This Order?  
  - **Q1 unlocks Q2**: If self-muggings are distinct, probabilistic skepticism *must* handle self-referential cases or fail.  
  - **Q2 unlocks Q3**: You can’t evaluate decision theories without knowing *how* to handle tiny P.  
  - **What’s upstream**: The inside/out distinction → foundations of probability → agent design.  
  - **What changes minds?** Concrete examples of *your favorite DT* self-immolating. I’ve seen Bayesian rationalists panic when shown inside-out muggings.  

  ### The Wrinkle: Inside-Out Isn’t a Costume  
  External muggings rely on *epistemic* uncertainty ("Is this stranger honest?"). Inside-out muggings exploit *logical* uncertainty ("What does my own code output on input X?"). The latter lets agents manufacture "evidence" for insane payoffs *by construction*. **This is why bounded utility fails**: you can’t cap utility of outcomes your agent *infers* are possible while cohering with its axioms.  

  ### Confidence & Least Sure Claim  
  - **90% confident**: Inside-out muggings are understudied and break most extant solutions.  
  - **80% confident**: Ignoring tiny P is unavoidable but currently unjustifiable.  
  - **40% confident** (least sure): That updateless DTs worsen self-muggings – they *might* contain a fix, but I doubt it.  

  **If you only remember one thing**: The minute you try to "solve" Pascal’s Mugging by ignoring small probabilities, your agent starts hallucinating self-generated mugging opportunities. That’s the core fire. Aim the hose there.  

  ---  
  **Six-month checkpoint**: You should have a) a precise taxonomy of self-generated muggings, b) 2+ existing "solutions" shattered by them, and c) a non-arbitrary framework for ignoring tiny probabilities in external cases. If not, pivot.
