answer: |-
  **Temporal Drafts Ltd.  
  Frequently Asked Questions**

  1.  **What does Temporal Drafts Ltd. offer?**
      We provide premium neuro-editing services for the discerning individual. Utilizing cutting-edge, non-invasive temporal modulation, we refine the raw feed of your conscious experience into a more coherent, aesthetically pleasing, and sometimes simply *correct* narrative stream. Think of us as your personal continuity editors for reality.

  2.  **Why would I need my experiences edited?**
      Life is messy. Perception is imperfect. Events sometimes unfold in ways that are jarring, illogical, or simply inconvenient upon later reflection. Our services smooth these rough edges. Common applications include resolving paradoxical sensory inputs (like our flagship Color Phi Demo), removing minor perceptual glitches or "blips," adjusting the perceived duration of unpleasant events, and ensuring memories align with preferred outcomes.

  3.  **What are your service tiers?**
      We offer two distinct tiers to suit different editorial philosophies and budgets:
      *   **Orwellian Tier:** Post-Experience Revision. Your initial, unedited conscious experience occurs as per standard neurology. Our patented technology then seamlessly edits the *memory record* of that experience. You recall the revised version as if it happened that way. Ideal for those who value experiential authenticity in the moment but prefer their past presented coherently.
      *   **Stalinesque Tier:** Pre-Experience Staging. Our intervention occurs *prior* to the formation of any conscious experience related to the target event. The raw sensory data is edited in the pre-conscious buffer. Your conscious experience is *only ever* of the revised event. Ideal for those seeking pristine, contradiction-free conscious moments from the outset.

  4.  **How do I know which tier I received?**
      From the subjective viewpoint of the customer, both tiers produce an identical, flawlessly coherent conscious experience and memory. The distinction lies entirely in the underlying temporal mechanics of the edit (pre-conscious staging vs. post-experience memory revision). Your satisfaction is guaranteed regardless of the mechanism, as the final, edited experience is indistinguishable.

  5.  **What is the "Color Phi Demo" I keep hearing about?**
      This is our flagship demonstration service, included with every introductory package. You observe two colored dots flashing rapidly in sequence at different screen locations (e.g., a red dot left, then a green dot right). Without editing, this often results in a phenomenologically jarring experience: you might see two distinct flashes, or motion without color change, or ambiguous overlap. Our service ensures you experience the most satisfying, market-tested percept: a single dot moving smoothly from the first location to the second, *changing color precisely midway*. This coherent motion-with-color-change percept is the gold standard we guarantee.

  6.  **I purchased the Orwellian Tier. During the Color Phi Demo, did I *actually* consciously experience the first dot's original color (e.g., red) before the edit?**
      Absolutely. With the Orwellian Tier, the unedited conscious event occurred: you veridically experienced the first flash (e.g., as red). However, immediately afterward, before this experience could be solidified into long-term memory, our technology revised the memory record. Your recollection, therefore, is solely of the edited event – the dot starting red, moving, and changing to green mid-trajectory. The original red flash was genuinely experienced but is now inaccessible to memory.

  7.  **I purchased the Stalinesque Tier. During the Color Phi Demo, did I *actually* consciously experience the first dot's original color (e.g., red) before the edit?**
      No. The Stalinesque Tier operates pre-consciously. The raw data from the first flash was intercepted and held in a buffer. Only *after* receiving data from the second flash did our system construct a single, coherent conscious event: the dot starting at the first location with the *revised starting color* necessary for the smooth color change (e.g., it started as red only in the context of changing to green), and moving to the second location. You never consciously experienced the initial flash in isolation or its original, unintegrated color.

  8.  **Can I choose which tier is used for each specific edit?**
      Tier selection is applied at the account level, governing all edits during your subscription period. We find maintaining a consistent editorial philosophy provides the most stable and satisfying narrative flow. Switching tiers mid-subscription requires a full system reset and recalibration fee, as it necessitates overwriting the existing editorial framework's temporal architecture.

  9.  **Are there any side effects?**
      Temporal Drafts Ltd. utilizes only the finest, quantum-locked neuro-modulation. Side effects are exceptionally rare (<0.0001% incidence) and typically transient, manifesting as brief, mild déjà vu or a faint sensation of "narrative pressure" resolving within milliseconds. Our technology targets only the specific spatio-temporal windows designated for editing, leaving the vast majority of your experiential stream untouched. You remain fundamentally *you*.

  10. **Is it ethical to edit my own experience?**
      Temporal Drafts Ltd. believes in the individual's sovereign right to a coherent and satisfying personal narrative. Our services enhance clarity, reduce cognitive dissonance, and promote subjective well-being. We operate strictly within the subjective frame of the customer; the "objective" timeline remains untouched (and is, frankly, irrelevant to your lived reality). We empower you to own your story.

  11. **Can you edit experiences involving other people?**
      Our Standard License covers only the editing of experiences where *you* are the sole conscious subject perceiving external, non-sentient stimuli (like dots on a screen). Editing complex social interactions or the perceived actions/words of other conscious agents falls under our "Inter-Subjective Harmony" package (Platinum Tier and above), which involves significantly more complex temporal negotiation protocols and mutual consent frameworks. Subject to regional regulations.

  12. **What about free will?**
      Our edits refine the *presentation* of experience and memory. They do not alter your decision-making processes *prior* to the conscious presentation of options or outcomes. You remain fully responsible for your choices within the edited experiential framework you inhabit. Think of it as watching a meticulously edited documentary of your life; the underlying events (as you experienced them) still happened, but the narrative flow is improved.

  **WARRANTY ADDENDUM**

  Temporal Drafts Ltd. guarantees the seamless integration of all edits performed under the Orwellian or Stalinesque tiers. Satisfaction is defined as the absence of consciously perceived anomalies or contradictions in the targeted experiential sequence post-edit (e.g., perfect smooth motion and color transition in the Color Phi Demo). We warrant the *subjective fidelity* of the final edited percept/memory. Due to the inherent nature of the service, claims regarding the veracity of *unverifiable pre-edit states* (e.g., "But what did I *really* see first?") are expressly excluded. The warranty covers operational failure of our technology only, not philosophical dissatisfaction with the nature of temporal perception. Revising the revision is available as a premium service.
