prompt: |-
  You are a decision theorist who knows the formal literature on choice under risk and uncertainty, and I would like your help working through a pattern in my own choices. Please think carefully, and begin by mapping the cases below — what varies across them and what is held fixed — before you propose any principle. I care more about whether the principle actually fits my verdicts than about which famous model it happens to resemble.

  I have a long-standing habit of avoiding gambles whose odds I do not know. When I push on that habit with specific cases, it comes apart, and I cannot tell whether that is my own inconsistency or a sign that I am tracking two different things. Here are my verdicts.

  First case. Urn A holds 100 balls, exactly 50 red and 50 black, and I know this. Urn B holds 100 balls, each red or black, in some proportion nobody has told me. I will bet on a red draw from A over a red draw from B, and I will bet on a black draw from A over a black draw from B.

  Second case. Urn C holds 100 balls whose red-and-black proportion was chosen by someone I know nothing about, with no reason to expect red or black to be favored. Even though my ignorance here is symmetric between the two colors, I still take a red bet from A over a red bet from C, and a black bet from A over a black bet from C.

  Third case. Urn D holds 100 balls whose proportion was fixed by a fair coin: heads means exactly 30 red, tails means exactly 70 red. I am indifferent between a red bet from D and a red bet from A, and I prefer either of them to B.

  Fourth case. Urns E and F are both certified to hold exactly 50 red and 50 black. E was filled in a lab I trust; F was filled by a carnival operator whose certification I suspect is sloppy. I prefer the red bet from E.

  Fifth case. Urn G holds 100 balls in an unknown proportion. A bet pays me only if the proportion is extreme — all red or all black — and pays nothing for a middling urn. For this payoff I prefer G to a known 50/50 urn.

  Sixth case. Urn H's proportion was fixed by a genuinely indeterministic process that has already run, with no surviving record; Urn I's proportion was fixed deterministically, but the record is lost. I find that I feel exactly the same about H and I, and that both feel worse to me than A.

  My tentative stab is that I am not averse to unknown odds as such but to not knowing the process that produced them — but the third and fifth cases both push against that, and the fourth suggests that even a known process can leave me averse if I do not trust who ran it.

  What I want from you is a principle, or a small set of competing principles, each stated precisely enough that I could test it against a new case. For every clause, tell me which of my cases forces it. Then tell me what the principle predicts for cases I have not listed: (a) an urn where a single ball is drawn and shown to me before I bet, so that the ambiguity is only partly resolved; (b) an urn whose composition is known, but where I am betting on whether a stranger will choose red or black after seeing it, so that the ambiguity is about their strategy; (c) two independent ambiguous urns versus two perfectly correlated ambiguous urns, for a bet that pays only if both match; and (d) an ambiguous urn whose composition will be revealed only after I have committed to the bet.

  Finally, be honest about which of my verdicts the principle cannot accommodate and would force me to give up, and say whether the loss is worth it. I would rather have a simple principle that overturns one of my gut calls than an elaborate one that saves them all.

  Throughout, separate what is settled in this area from what is genuinely contested among people who work on it, and do not present a contested position as the consensus. If two principles fit equally well and you cannot tell which one I have in mind, say so rather than choosing one and sounding sure. Do not give me reading lists, citations, or names of papers to look up — I cannot search, and I do not want you guessing at titles. Close with a brief note on how confident you are in your overall verdict and where the weakest joint in your answer is.
reasoning: |-
  Alright, let me work through this user's decision patterns step by step. The user presents six detailed cases about their preferences when betting on urns with varying levels of uncertainty, and wants a principle that explains their choices without necessarily fitting existing models.

  First, I need to map the key variables across all cases. What's changing here? The nature of uncertainty differs significantly:
  - Case 1 & 2 contrast known probabilities (Urn A) with unknown compositions (Urns B and C), showing preference for known odds even when symmetric ignorance exists.
  - Case 3 introduces objective chance (coin flip determining proportions), leading to indifference with known probability.
  - Case 4 shows that trust in the process matters - same stated probability but different sources.
  - Case 5 reveals a preference for uncertainty when it enables extreme outcomes.
  - Case 6 distinguishes between metaphysical uncertainty (indeterministic process) and epistemic uncertainty (lost records), with equal aversion to both.

  The common thread seems to be about how the decision-maker models the uncertainty, particularly their confidence in assigning probabilities. The aversion isn't to unknown odds per se, but to situations where they can't form a reliable probability estimate or doubt the source's trustworthiness.

  Noticing three core tensions in their choices:
  1) They treat Urn D (coin-determined) as equivalent to Urn A (known 50/50), yet prefer both over Urn B (unknown). This suggests the process generating the uncertainty matters more than the symmetry of ignorance.
  2) Their preference for Urn G in Case 5 indicates they're not uniformly ambiguity-averse - they seek ambiguity when it serves their interests (potential for extreme outcomes).
  3) Case 4's trust issue and Case 6's indifference to indeterminism vs epistemic limitation point to a deep concern about the quality of information.

  The user's own hypothesis about "not knowing the process" is partially supported but needs refinement. Case 3 (coin flip) shows a known process resolves their aversion, while Case 4 shows even a known composition isn't sufficient if the process executor is distrusted. Case 6 demonstrates that the metaphysical nature of uncertainty (deterministic vs indeterministic) doesn't affect them - only the practical epistemic access matters.

  For the proposed principle, I'm considering a focus on "modelability" - whether the user can construct a reliable probability model. This explains:
  - Preference for A over B/C (unmodelable proportions)
  - Indifference to D (modelable via coin probabilities)
  - Preference for E over F (distrust breaks modelability)
  - Preference for G (extreme outcomes become modelable)
  - Indifference between H and I (both unmodelable)

  Testing this against their additional scenarios:
  a) Partial resolution: Should reduce aversion proportionally to how much the revealed ball updates their model
  b) Strategy ambiguity: Likely similar aversion to Urn B since stranger's behavior is unmodelable
  c) Correlation matters: Independent urns better for matching bet because positive correlation increases risk of total loss
  d) Delayed revelation: Aversion should persist since commitment happens without a model

  The main tension is with Case 6 - the principle treats metaphysical and epistemic uncertainty identically, which matches their reported indifference. But if they actually cared about determinism, this would fail. Also, Case 5's "gambling on ambiguity" is covered by the payoff structure making extremes salient.

  Biggest weakness is whether "modelability" captures their distrust in Case 4 adequately. An alternative might be a competence-based principle, but that struggles more with Cases 3 and 5. The modelability principle seems worth minor revisions to save core intuitions.
answer: |-
  Based on your verdicts, here's a precise principle that fits your choices. After stating it, I'll explain how it maps to each case, predict new cases, identify tensions, and note confidence levels.

  **Core Principle (Modelability Constraint):**  
  *You prefer gambles where you can construct a stable, internally consistent probability model based on credible information. Ambiguity aversion manifests not from unknown probabilities per se, but from an inability to justify a specific distribution or trust the source of that distribution. When a model is available and trusted, you treat it as objective risk; otherwise, you default to pessimism unless the payoff structure exploits ambiguity.*

  ### How This Explains Your Cases:
  1.  **Urn A vs. Urn B:** Fixed by modelability. You have a justified 50% model for A. For B, no basis for *any* distribution → pessimism dominates.  
  2.  **Urn A vs. Urn C:** Fixed by *justification*. Symmetric ignorance ≠ justified model. Without a reason to assume 50/50, you cannot confidently model it → prefer A.  
  3.  **Urn D vs. Urn A:** Fixed by *model derivation*. The coin provides a credible model: 50% chance of 30-red (P(red)=0.3), 50% chance of 70-red (P(red)=0.7) → expected P(red)=0.5. Trusted model → indifference to A.  
  4.  **Urn E vs. Urn F:** Fixed by *source trust*. Identical stated odds, but F’s source undermines model credibility → aversion persists.  
  5.  **Urn G vs. Known 50/50:** Fixed by *payoff-driven model shift*. The bet rewards extremal compositions. With no model to contradict it, you can exploit ambiguity by "modeling" the best-case (P(extreme)=1). Known 50/50 caps the win probability at 0 → prefer G.  
  6.  **Urn H vs. Urn I vs. A:** Fixed by *model unavailability*. Both H and I lack any basis for assigning probabilities (no data, no trusted source, no mechanism). Thus, both default to pessimism → aversion equal and stronger than for A.

  ### Predictions for New Cases:
  - **(a) Partially resolved ambiguity (one ball shown):**  
    *Prediction:* Preference for A weakens but persists. Seeing one red ball might shift your "pessimistic default" for B (e.g., from assuming P(red)=0 to P(red)=0.01), but you still lack a justified model → prefer A.  
  - **(b) Ambiguity about stranger’s strategy:**  
    *Prediction:* Strong aversion, worse than Urn B. You have no basis to model the stranger’s behavior (source distrust + no distribution) → extreme pessimism. Prefer A.  
  - **(c) Two urns, bet on both matching:**  
    *Prediction:* Prefer *independent* ambiguous urns over *correlated* ones. Independence allows "hoping" each urn is extreme but aligned; correlation risks both being "set against you." With no model, pessimism assumes worst-case correlation.  
  - **(d) Composition revealed post-commitment:**  
    *Prediction:* Indifference to Urn B. Since you commit without a model, the delayed revelation doesn’t alter your initial ambiguity aversion. Prefer A.

  ### Tensions and Trade-offs:
  - **What it perfectly fits:** Cases 1, 2, 3, 4, 6. The modelability constraint (justification + trust) cleanly explains aversion in B/C/F/H/I and indifference in D.  
  - **What it forces you to revise:** **Case 5 (Urn G)**. The principle assumes pessimism *unless* payoffs incentivize optimism. If you genuinely prefer G for a bet on extremes, you accept this exploitation of ambiguity. But if your preference arises from something else (e.g., a belief that unknown urns *are* more likely extreme), the principle breaks.  
  - **Trade-off justification:** Sacrificing strict pessimism in Case 5 is worthwhile. It resolves all other cases parsimoniously and explains *why* you "gamble on ambiguity" only when payoffs align. An alternative principle (e.g., pure source aversion) would fail Cases 3 and 5.

  ### Settled vs. Contested:
  - **Settled:** Your pattern isn't random. Ambiguity aversion is robust, and source credibility matters (as in Case 4). Complexity aversion (simpler models preferred) is also well-documented.  
  - **Contested:** Whether ambiguity aversion stems from pessimism (maximin), lack of probabilistic confidence, or cognitive unease. Your data *rejects* simple pessimism (due to Case 5) but supports modelability as a deeper driver. Case 6 rejects "metaphysical uncertainty" (indeterminism) as a factor—only epistemic access matters.

  ### Confidence and Weakest Joint:
  - **Confidence:** High (8/10) for Cases 1-4,6; Moderate (6/10) for Case 5. The principle fits your core aversion while explaining "exceptions" via payoff structures and trust.  
  - **Weakest Joint:** Case 5’s reliance on payoff-driven optimism. If you felt uneasy about G *despite* the preference, or if slight changes (e.g., betting on a *specific* extreme) reversed it, the principle might need adjustment. The mapping of "trust" in Case 4 is also nuanced—if sloppy filling implied non-50/50 odds, not just distrust, the explanation shifts.

  This principle treats your aversion as *procedural*—rooted in how you assess evidence—not purely statistical. If new cases violate predictions, we can refine it (e.g., weighting source trust more heavily). But for now, it systematizes your judgments with one coerced revision (embracing Case 5’s exploit).
