  The Sequence: The plan must build logically. Start with why we use thought experiments (common ground). Then introduce the distinction: argumentative (counterexamples) vs. rhetorical (vividness). Use a simple case to illustrate—maybe trolley as a warm-up. Then dive into the carrying case for depth. Show how it can mislead by confounding roles, then generalize to other fields. End with mitigation strategies. Each step relies on the previous: e.g., you need the distinction before analyzing a case, and the case before discussing pitfalls. Keep to 600 words.

  The Carrying Case: Choose between the two candidates. The side-effect effect (chairman) is stronger because it's empirical, showing how framing affects judgments—perfect for cognitive science and law. It directly ties to persuasion/misleading via psychological bias. The two roads case is good for illustrating moral luck in law/economics but less versatile for the rhetorical/argumentative split. Trolley belongs early as a familiar example but not the core. Explain why chairman case fits the distinction: it can be misused rhetorically (vividness of harm) but also used argumentatively (against intention theories). The other case is still useful for discussion if time allows. 350 words.

