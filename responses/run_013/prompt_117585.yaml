answer: |-
  ### Opening (120 words)
  Begin by acknowledging their disciplines’ shared reliance on hypotheticals: “You craft scenarios daily—whether litigating imagined clients, modelling rational agents, or testing cognitive vignettes. These aren’t just illustrations; they’re engines of inquiry. But like any engine, they can misfire. Today isn’t about condemning thought experiments—they’re indispensable. It’s about *how* they drive insight and *where* they might skid. We’ll map a distinction crucial for using them rigorously: when a case *does argumentative heavy lifting* versus when it *makes an idea stick*. By session’s end, you’ll have sharper tools to build—and critique—hypotheticals in your work.” This frames the session constructively, pre-empting fears of dismissal while setting up the core distinction.

  ### The Sequence (600 words)
  1. **Why Hypotheticals? (10 mins)**  
     *Start with a shared foundation:* Ask each discipline for a 1-sentence example of a hypothetical they use (e.g., law: "a reasonable person foreseeing harm"; econ: "an agent with transitive preferences"). Whiteboard these. *Dependency:* Establishes common ground and legitimises their practice. Shows these aren’t "philosophical toys" but field-specific tools. *Crucially,* this step builds goodwill before critique.

  2. **The Core Distinction: Argumentative vs. Rhetorical Work (15 mins)**  
     *Introduce your spine:* Define terms simply. **Argumentative work:** The case *is* the proof (e.g., a counterexample sinking a theory: "If your theory says X, but in *this* scenario X is absurd, the theory fails"). **Rhetorical work:** The case *illustrates* a pre-existing argument (e.g., making abstract risk vivid). Use a *simple, familiar* example: Trolley Problem (5 mins). Ask: "Does switching the track *prove* utilitarianism? Or does it just *show vividly* what utilitarianism demands?" *Dependency:* Step 1 legitimises hypotheticals; Step 2 provides the lens for analysing them. Without this distinction, later analysis lacks structure. *Pre-empts misconception:* That all thought experiments aim to "prove" something directly.

  3. **Deep Dive: The Carrying Case (25 mins)**  
     *Analyse your chosen case* (Chairman/Side-Effect Effect) rigorously using the distinction. *Dependency:* Steps 1 & 2 provide the tools. Now apply them to a complex case revealing persuasion/misleading. Guide discussion: "Is the chairman’s ‘intentional harm’ verdict *proof* against certain theories of intention? Or does it *leverage psychological bias* to make a point feel persuasive?" Highlight the mismatch between the *rhetorical force* (strong moral condemnation) and the *argumentative payload* (which might be weaker due to the bias). *Dependency:* The distinction makes the case’s dual nature analysable.

  4. **How Rhetoric Masquerades as Argument (10 mins)**  
     *Expose the risk:* Show how the carrying case’s *rhetorical* power (vivid harm, emotional salience) can *feel* like logical proof, misleading us. Connect to their fields: "In law, does naming a victim (like your ‘Two Roads’) sway judgment *rhetorically*? In econ, does a stylised agent’s ‘rationality’ *feel* more proven because the model is elegant?" *Dependency:* Step 3 reveals the mechanism; Step 4 generalises the pitfall. *Pre-empts misconception:* That persuasiveness equals validity.

  5. **Mitigation Strategies (10 mins)**  
     *Empower them:* Ask groups to suggest, based on Steps 2-4, how to *test* a hypothetical’s argumentative strength (e.g., "Vary irrelevant details—does the verdict hold?" / "Seek counter-scenarios") and how to *spot* rhetorical overpowering (e.g., "Does changing the emotional valence change intuitions disproportionately?"). *Dependency:* Critique (Steps 3-4) necessitates solutions. Ends constructively.

  ### The Carrying Case (350 words)
  **Chosen Case: The Chairman/Side-Effect Effect.**  
  **Why over Two Roads:**  
  *   **Persuasion/Misleading Core:** It *directly* demonstrates how identical reasoning yields asymmetric moral judgments due to psychological bias (harm aversion). This is central to "how they persuade and mislead." The asymmetry is stark, empirically validated (relevant to CogSci), and shows *misleading* vividly: intuitions feel objective but are contextually skewed.  
  *   **Fits the Distinction Perfectly:** It *can* do **argumentative work** (as a counterexample to simple desire-belief models of intention). But its **rhetorical power** is immense and potentially distorting – the "harm" scenario feels overwhelmingly persuasive due to emotional salience, potentially masking flaws. This tension embodies the session's spine.  
  *   **Cross-Disciplinary Leverage:** Law students see parallels in culpability assessments; economists in framing effects impacting "rational" choice; CogSci in cognitive biases.  
  *   **What it Lacks (and Needs To):** It’s not a normative ethical puzzle (like Trolley). That’s *good* – it avoids well-trodden debates, focusing on cognitive mechanics.  

  **Two Roads' Role:** Use it *briefly* in Step 4 as an *application*. It brilliantly illustrates **rhetorical work**: naming a victim makes statistical risk visceral, potentially biasing cost-benefit analysis (law/econ). But it lacks the sharp, *argumentative* asymmetry of the Chairman case. It’s supplemental, showing the distinction in *their* terrain.  

  **Trolley Problem's Place:** Use it *early* (Step 2) as the **familiar hook** to introduce the distinction. Its ubiquity makes it ideal for this. Crucially, **don’t debate its solutions**. State: "We all know it – but today, we’re not solving it. We’re using it to ask: *What job is it doing here?*" This contains it and models focus.

  ### The Misconception Map (500 words)
  1.  **Misconception: "Thought experiments are just intuition pumps/fluff." (Arises: Start of session / Step 1)**
      *   **Head off:** During **Step 1 (Why Hypotheticals?)**. When whiteboarding their examples, explicitly link them to *concrete outcomes*: "So, this 'reasonable person' *determines liability*? This stylised agent *predicts market behaviour*? This vignette *shapes a theory of mind*? Precisely – they’re serious tools." Legitimise upfront.
  2.  **Misconception: "A persuasive thought experiment is a good/valid one." (Arises: Implicitly held; surfaces during analysis)**
      *   **Head off:** During **Step 3 (Deep Dive: Chairman Case)**. After revealing the bias, ask: "Does finding the harm case *very persuasive* tell us it’s logically sound? Or could that feeling *be the bias itself*?" Contrast persuasiveness with argumentative robustness using the distinction.
  3.  **Misconception: "The point of a thought experiment is to reveal 'the truth' or my intuition." (Arises: Step 2/3, especially with Trolley/Chairman)**
      *   **Head off:** When introducing the **Distinction (Step 2)**. Emphasise: "Intuitions are *data points*, not verdicts. The key question is: *What work is this data doing?* Is it refuting a theory (argumentative) or illustrating one (rhetorical)?" Frame intuitions as inputs to analysis, not conclusions.
  4.  **Misconception: "Philosophy thinks thought experiments are unreliable nonsense." (Arises: Pre-session anxiety / Opening)**
      *   **Head off:** Explicitly in the **Opening** and reinforced in **Step 1**. "We're not here to bury thought experiments, but to use them better. They are fundamental to reasoning across your fields *and* philosophy. Our goal is refinement, not rejection." The constructive sequence itself counters this.
  5.  **Misconception: "If I can imagine it, it's a valid counterexample." (Arises: Step 3/4, especially among law/econ students used to constructing hypotheticals)**
      *   **Head off:** During **Step 4 (Rhetoric Masquerading as Argument)** and **Step 5 (Mitigation)**. Use the Chairman case: "We *can* imagine the indifferent chairman... but does that imagination reliably track intentional action, or harm aversion? How could we *test* if this case genuinely refutes a theory of intention?" Push for robustness checks (vary details, seek counter-cases).
  6.  **Misconception: "The emotional response is irrelevant to the logic." (Arises: Step 3/4, particularly with Chairman/Two Roads)**
      *   **Head off:** During **Step 4**. Argue: "Emotion *isn't* irrelevant – it’s often the *engine of persuasion*. The problem is when that emotional force *substitutes for* or *distorts* logical argument. The Chairman case shows how emotion *creates* the illusion of stronger logic in the harm condition." Link emotion directly to the rhetorical/argumentative blur.

  ### The Exit Check (150 words)
  **Exercise:** "Take 2 minutes to sketch a *very brief* hypothetical scenario from your own research area. Now, jot down: 1) What *argumentative work* could it potentially do (e.g., challenge a definition, test a boundary)? 2) What *rhetorical work* could it do (e.g., make an abstract risk concrete, motivate a policy)?"
  *   **Good Answer:** Clearly distinguishes the two roles specific to *their* sketch. E.g., (Law): "Argumentative: Tests if 'foreseeability' requires specific knowledge. Rhetorical: Shows the human cost of negligence." (Econ): "Argumentative: Exposes paradox in revealed preference. Rhetorical: Makes irrational spending vivid." Shows application of the distinction.
  *   **Bad Answer:** Conflates roles ("It proves the theory *and* makes it clear"), only identifies one role, or describes the scenario's *content* without linking to its *function*. Indicates the distinction isn't internalised.

  ### What I Should Leave Out (120 words)
  Explicitly decline to cover:
  1.  **In-depth Metaphysics (e.g., modal realism):** "We won’t dive into whether possible worlds 'exist' – our focus is the *pragmatic use* of hypotheticals in argument." *Why:* Too abstract, distracts from applied focus.
  2.  **Historical Survey (Hume, Kant, Gettier):** "We’re bypassing the history and famous names to concentrate on the underlying mechanics relevant to your work." *Why:* Not actionable for this audience in this format; risks alienating non-philosophers.
  3.  **Solving the Trolley Problem (or Chairman Case):** "Recall, we’re not debating *what’s right* in Trolley or *what intention really is* with the Chairman. We’re analysing *how these tools function*." *Why:* Essential to maintain focus on methodology, not ethics or philosophy of mind. Refusing clearly sets boundaries; a sketch would invite derailment.
