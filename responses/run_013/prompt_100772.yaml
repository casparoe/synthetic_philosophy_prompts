  The procedure can catch:
  - Missing direct effects by Step 1 and Step 2 (if the indirect effect is immediate and necessary to add as an effect).
  - Critical missing preconditions by Step 3.
  - Concurrency conflicts by Step 4.

  But it cannot:
  - Automatically decide the level of abstraction (what to model and what to leave out) — that is a modeling judgment.
  - Handle complex chains of indirect effects (ramifications) without causing an explosion of derived rules or effects.
  - Solve the qualification problem completely (we have to draw the line on what preconditions to include).
  - Resolve concurrency issues automatically; it only flags them.

  **Finally, note**: For at least one of the examples, the procedure forced an answer you might not like: In Example 1, we found that we must modify an existing action (`move_shelf`) to prevent concurrency issues, which might complicate that action. In Example 2, we have to model the draining process and time, which might be complex. And in Example 3, we have a concurrency issue that might require a complex mutual exclusion mechanism.

