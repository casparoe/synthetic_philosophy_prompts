answer: |-
  ### Frame Problem Mitigation Procedure for Action Specifications

  This procedure systematically checks each new action specification for frame axiom violations, ramifications, qualifications, and concurrency risks. It uses the law of inertia ("fluents persist unless changed") as the default but identifies where explicit rules are needed. Follow these steps in order, documenting answers.

  ---

  #### **Step 1: List Explicit Effects**
  - **Question**: What fluents do you *intentionally* change when this action executes?  
    **Sufficient Answer**: Concisely list all fluents modified (e.g., `box_location`, `valve_open`).  
    **Decision**:  
    - Any fluent *not* listed here defaults to persistence.  
    - **Proceed to Step 2**.

  #### **Step 2: Check for Indirect Effects (Ramifications)**
  - **Question**: Could any direct effect trigger secondary changes to *other fluents* via domain constraints?  
    **Sufficient Answer**:  
    - Identify chains: "Direct effect `A` → fluent `B` changes → fluent `C` changes..."  
    - Example: "Opening valve (`valve_open`) drains tank (`tank_full` → `¬tank_full`), which changes weight (`weight`), which updates scale reading (`scale_value`)."  
  - **Decision**:  
    - If *no* chains exist, persist all non-listed fluents → **Proceed to Step 3**.  
    - If chains exist:  
      - For *short chains* (≤2 steps) or *deterministic* outcomes: **Add indirect effects** to the action (e.g., add `¬tank_full` and `weight = reduced` to `open_valve`).  
      - For *long chains* (>2 steps) or *nondeterministic* outcomes: **Add causal axioms** (domain-level state constraints, e.g., "`valve_open ∧ tank_full → eventually ¬tank_full`").  
      - If causal axioms conflict with inertia (e.g., scale updates continuously), **hand off to senior engineer** for modeling judgment.  
    - **Proceed to Step 3**.

  #### **Step 3: Verify Preconditions (Qualifications)**
  - **Question**: What *minimal conditions* must hold for this action to succeed? Could unstated conditions cause failure or danger?  
    **Sufficient Answer**:  
    - List physical/safety preconditions (e.g., "box must be on shelf").  
    - Flag "unknown unknowns" (e.g., "battery could be dead," "shelf could be moving").  
  - **Decision**:  
    - Add preconditions for *frequent* or *critical* risks (e.g., `shelf_stationary` for moving boxes).  
    - If a risk is rare but catastrophic (e.g., "heater drains battery"), **hand off to senior engineer** to weigh cost vs. safety.  
    - **Proceed to Step 4**.

  #### **Step 4: Concurrency Safety Check**
  - **Question**: Could this action run concurrently with existing actions? If so:  
    (a) Do they modify the *same* fluent?  
    (b) Does one change a fluent the other assumes persists?  
    **Sufficient Answer**:  
    - Cross-check with all actions (e.g., "`move_shelf` changes `shelf_location`, while `place_box` assumes it persists").  
    - Example conflict: Robot A moves a support while Robot B places a load on it.  
  - **Decision**:  
    - If *no concurrency* possible, persist non-listed fluents → **Proceed to Step 5**.  
    - If conflicts exist:  
      - For *non-critical* fluents: **Disallow concurrency** (add mutex locks).  
      - For *critical* fluents (e.g., structural stability): **Add preconditions** (e.g., `support_stable`) or **hand off to senior engineer** if resolution is complex.  

  #### **Step 5: Critical Fluent Audit**
  - **Question**: Which fluents are *safety-critical* (e.g., collision risk, downtime cost >1 day)?  
    **Sufficient Answer**: List fluents whose misprediction causes high cost (e.g., `battery_charged`, `shelf_location`).  
  - **Decision**:  
    - For each critical fluent:  
      - If not modified by *any* action, **add causal axiom** or **hand off** (inertia may be insufficient).  
      - If modified, ensure Step 2 covered ramifications.  
    - **Specification complete** if all checks pass.  

  ---

  ### Procedure Application to Specifications

  #### **Specification 1: Move Box Between Shelves**  
  - **Action**: `move_box(box, shelf_a, shelf_b)`  
  - **Step 1**: Direct effects: `box_location = shelf_b` (add), `box_location = shelf_a` (delete).  
  - **Step 2**: No indirect effects (no chains identified).  
  - **Step 3**: Preconditions: `box_on_shelf(box, shelf_a)`, `shelf_exists(shelf_b)`.  
    - *Missing*: `shelf_a` could be moved mid-action (collision risk). **Add precondition**: `shelf_stationary(shelf_a)`.  
  - **Step 4**: Concurrency:  
    - If `move_shelf(shelf_a)` runs concurrently, `shelf_a` moves mid-move → violates inertia for `shelf_a_location`.  
    - **Resolution**: Add mutex or precondition `¬moving(shelf_a)`.  
  - **Step 5**: Critical fluents: `box_location`, `shelf_stationary`. Covered.  
  - **Result**: Specification safe with added preconditions.  

  #### **Specification 2: Open Valve → Drain Tank → Update Scale**  
  - **Action**: `open_valve(valve, tank)`  
  - **Step 1**: Direct effect: `valve_open = true`.  
  - **Step 2**: Ramification chain:  
    `valve_open → tank_draining → weight_decreases → scale_updates`.  
    - Short chain? **Yes** (deterministic). **Add indirect effects**: `tank_full = false`, `weight = reduced`, `scale_value = low`.  
    - *If you omit this*, the planner assumes weight and scale persist unchanged → **downtime risk**.  
  - **Step 3**: Preconditions: `valve_closed`, `tank_attached`.  
    - *Missing*: Broken scale could misreport. **Hand off to senior** (rare but critical).  
  - **Step 4**: Concurrency: If `calibrate_scale` runs concurrently, `scale_value` might conflict. **Add mutex**.  
  - **Step 5**: Critical fluents: `scale_value` (if used for inventory). Covered.  
  - **Result**: Specification safe with added effects and mutex.  

  #### **Specification 3: Harmless Concurrent Actions**  
  - **Actions**:  
    - `A: remove_support(support)` → Effects: `support_removed` (add).  
    - `B: place_box_on_support(box, support)` → Effects: `box_on_support` (add). Preconditions: `support_exists`.  
  - **Step 1**:  
    - `A`: Direct effect: `support_removed`.  
    - `B`: Direct effect: `box_on_support`.  
  - **Step 2**: No indirect effects for either.  
  - **Step 3**:  
    - `A`: Precondition: `support_present`.  
    - `B`: Precondition: `support_present`.  
  - **Step 4**: Concurrency:  
    - If `A` and `B` run concurrently:  
      - `B` assumes `support_present` persists (inertia).  
      - `A` deletes `support_present` → `B` places box on removed support → **collision**.  
    - **Conflict defeats inertia**.  
    - **Resolution**:  
      - Add precondition to `B`: `¬support_removed` (but may not be measurable).  
      - **Hand off to senior engineer**—requires modeling judgment (e.g., atomic groups or locks).  
  - **Step 5**: Critical fluent: `support_present`. Inertia unsafe here.  
  - **Result**: **Unresolved concurrency risk** → Must hand off.  
  - **Why you won’t like this**: It forces either costly locks (slows planning) or a domain redesign.  

  ---

  ### What the Procedure Cannot Do  
  1. **Resolve modeling trade-offs**: e.g., "Is tracking tank weight worth the planning overhead?"  
  2. **Anticipate all qualifications**: e.g., "What if a shelf is painted mid-move?" requires domain-specific judgment.  
  3. **Handle infinite ramification chains**: e.g., "Draining tank alerts supervisor, who emails a report, which..." → Senior engineer must bound the model.  
  4. **Prove full consistency**: Relies on iterative checks, not formal verification.  

  **Final Output**: For each specification, the procedure either:  
  - **Approves it** (with added effects/preconditions),  
  - **Flags hand-offs** (for senior engineer), or  
  - **Rejects it** (if unmitigated collisions/downtime risks exist).  

  Run this for every new action—it catches 90% of frame errors but leaves policy-level decisions to humans.
