  We are going to design a procedure for the knowledge engineer to check each new action specification. The goal is to avoid frame problems by identifying which fluents might be affected indirectly (ramifications) or which preconditions might be missing (qualifications) and to handle concurrency issues.

  The procedure is based on the following principles from the frame problem literature:
  1. **Frame Axiom Default**: By default, a fluent persists unless the action affects it. We list only the direct effects.
  2. **Ramification Problem**: Indirect effects (e.g., opening a valve drains the tank, which then changes the weight) must be modeled via causal axioms (state constraints) or by adding them as effects of the action.
  3. **Qualification Problem**: We must consider all preconditions that could prevent the action from having its intended effects (e.g., the robot must be charged, the valve must not be broken, etc.). However, we cannot list every possible condition, so we rely on the closed-world assumption for the specification but must be cautious about critical ones.
  4. **Concurrency**: When two actions occur at the same time, they might interact. We must consider if they affect the same fluent or if one changes a condition that the other relies on.

  The procedure will consist of the following steps:

  **Step 1: List Direct Effects**
  - For the action, list all fluents that are changed by the action (both positive and negative effects).
  - Check that these are the only fluents that the action directly affects.

  **Step 2: Check for Indirect Effects (Ramifications)**
  - For each fluent that is not listed as a direct effect, but which might be changed by a causal rule in the domain (state constraint) when the direct effects occur, we must either:
     a. Add that indirect effect as an additional effect of the action (if it is deterministic and always happens), or
     b. Add a causal axiom (state constraint) to the domain and ensure the planner can handle it (but note: this may lead to the ramification problem of having to consider chains of effects).
  - If we are adding a causal axiom, we must check for chains of effects (e.g., opening the valve drains the tank, which then changes the weight, which then changes the reading on the scale). We must ensure that the entire chain is either handled by the causal axioms or by the frame default.

  **Step 3: Check Preconditions (Qualifications)**
  - List the preconditions that are necessary for the action to have its direct effects.
  - Consider whether there are any critical preconditions that, if missing, could lead to a failure that is safety-critical (like a collision). For each critical fluent that is not mentioned in the preconditions, ask: "Could the action be executed in a state where this fluent has a value that would cause an unsafe situation?" If yes, add the precondition.

  **Step 4: Check for Concurrency Issues**
  - Consider each pair of actions that might run concurrently. For the new action and every existing action, check:
     a. Do they have conflicting effects (one sets a fluent to true and the other to false)? If so, we must either disallow concurrency or resolve the conflict.
     b. Does one action change a fluent that the other relies on as a precondition? (This is the problem of one action invalidating the precondition of another during concurrent execution.) If so, we must either disallow concurrency or add a condition that the precondition holds throughout.

  **Step 5: Review Critical Fluents**
  - For each fluent that is critical (i.e., if it is not maintained correctly, it could lead to a safety issue or significant downtime), we must ensure that every action that could change it is modeled. This means:
     a. If an action changes the fluent, it must be listed as an effect (direct or indirect).
     b. If an action does not change the fluent, the frame default is acceptable only if we are sure that no indirect effect (via a causal axiom) could change it during the action.

  **Step 6: Hand-off to Senior Engineer**
  - The following situations require a modeling judgment and must be handed off to the senior engineer:
     a. When there is a chain of indirect effects that is complex (e.g., more than two steps) and it is unclear whether to model them as part of the action or via causal axioms.
     b. When the concurrency check reveals an interaction that is not easily resolved by a simple precondition or by disallowing concurrency.
     c. When a critical fluent is not directly affected by any action but might be changed by an unmodeled causal chain (ramification) and we are not sure.
     d. When there is a qualification (precondition) that is very rare and hard to test, but ignoring it could be catastrophic (the qualification problem). The trade-off between complexity and safety must be judged.

  **Procedure Summary:**
  1. List direct effects.
  2. Check for ramifications and handle them (either by adding effects or causal axioms).
  3. Check preconditions for critical missing ones.
  4. Check concurrency with existing actions.
  5. Review critical fluents.
  6. Hand off to senior engineer in the cases above.

  Now, we run the procedure on the three examples.

  **Example 1: Moving a box from one shelf to another.**
