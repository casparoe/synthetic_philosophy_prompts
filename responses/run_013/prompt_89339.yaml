prompt: |-
  I've got 14 students in an upper-level seminar on conditionals, 80 minutes, and I want them to feel the triviality results in their gut instead of watching me push symbols around the board. Here's the seed of an activity — build it out into something runnable.

  It's a betting market, chips only, no real money. Half the room are bookmakers posting prices on contracts against a scenario I hand out (an urn, a deck of cards, whatever's easy to settle in the room). Contract one is the ordinary conditional bet: "B if A" — you pay the price, your stake comes back if A never happens, otherwise it pays off iff B. Everybody agrees that ones fair price is P(B|A); that part isn't interesting. Contract two is a bet on the sentence itself: pays 1 if "if A then B" is true, 0 if it's false. Here's the hinge — the bookmakers have to write the settlement rule for contract two themselves, including what it pays when A turns out false. Let them land on "true, vacuously, nothing got falsified" (or let them fight about it; either ruling gives the same shape of problem). Then traders buy and sell at the posted prices and we settle.

  What I want them to hit: they'll price contract two at P(B|A) out of habit and bleed chips in the ¬A worlds. The fix is that its fair price is P(¬A) + P(A∧B), so the two contracts come apart by P(¬A)·P(¬B|A) — which is zero only if A is certain or B is certain given A. So you can't treat the conditional as a proposition with a truth value and also price it at the conditional probability; the only conditionals you can price that way are degenerate ones. Then run the other branch: contract two goes void when A is false, so the bookies are finally safe — until a trader asks for a price on a nested conditional ("if A then, if B then C") and there's nothing left to conditionalize on. That's the trap I want them sitting in.

  The debrief should map the two rounds onto the real results: the ¬A payoff gap is why nothing can have conditional probability as its probability, and the nesting mess is the seed of Lewis's collapse proof against any semantics that keeps the equation across a language closed under the conditional. Be honest with me about what the activity can't do — it stages the intuition, it doesn't derive the theorem — so tell me what I have to supply at the end and where I'd be faking it if I didn't.

  Also tell me what predictably goes wrong the first time I run it. I'm expecting at least one bookie to refuse to settle at all and insist the conditional is neither true nor false when A fails, which is either the best or the worst thing that can happen to the session. American English please, and dont worry about references or reading lists — I just want something I can run next week.
reasoning: |-
  We are going to design a classroom activity to illustrate the triviality results for conditionals. The goal is to have students experience the problem through a betting market.

  ### Overview
  - **Participants**: 14 students, split into two groups: 7 bookmakers and 7 traders (or adjust as needed, but we can have multiple traders per bookie if needed).
  - **Duration**: 80 minutes.
  - **Scenario**: Use a simple scenario that is easy to settle, such as drawing a card from a standard deck or drawing a ball from an urn. We'll use a deck of cards for familiarity.

  ### Setup
  1. **Scenario**: We are going to use a standard deck of 52 cards. We'll define events:
     - Let A be an event that is neither certain nor impossible, e.g., "The card is a heart" (P(A)=1/4).
     - Let B be another event, e.g., "The card is a face card" (Jack, Queen, King). Note: There are 12 face cards in total, and 3 in hearts. So P(B)=12/52=3/13, P(A and B)=3/52, P(B|A)= (3/52) / (13/52) = 3/13.

  2. **Contracts**:
     - **Contract 1 (Ordinary Conditional Bet)**: Pays 1 if A and B occur, pays 0 if A occurs and B does not, and returns the stake (so effectively 0 net) if A does not occur.
       - Fair price: P(B|A) = 3/13 ≈ 0.2308.
     - **Contract 2 (Truth-conditional bet on "If A then B")**: This contract is defined to pay 1 if "If A then B" is true, and 0 if false. The key is that the bookmakers must decide what happens when A is false.

  3. **Bookmakers' Task**:
     - They must post prices for both contracts. For Contract 2, they must also write a settlement rule for when A is false. We expect two possible rulings:
       - Ruling 1: When A is false, the conditional is vacuously true (so pays 1).
       - Ruling 2: When A is false, the conditional is false (so pays 0). 
       - (Note: They might also try to rule it as void, but that creates a problem for nesting. We'll get to that.)

  4. **Traders' Task**:
     - They buy and sell contracts at the posted prices. They can buy from any bookmaker. We'll give them chips to trade with.

  ### Expected Flow

  #### Round 1: Pricing Contract 2 as if it were the conditional probability (without thinking about the gap)
  - Bookmakers, out of habit, are likely to set the price for Contract 2 at P(B|A) = 3/13, the same as Contract 1.
  - They must also decide on the settlement for Contract 2 when A is false. They might fight about it, but let's assume they land on one of the two options (vacuously true or false) or even split.

  #### What happens when we settle?
  - We draw a card and settle the contracts.
  - The problem: 
    - If the bookmakers ruled that Contract 2 pays 1 when A is false (vacuously true), then Contract 2 pays 1 in all cases except when A is true and B is false. So:
      - Payoff = 1 if ¬A or (A and B)
      - Payoff = 0 if A and ¬B
    - The fair price for this contract is P(¬A or (A and B)) = P(¬A) + P(A and B) = 1 - P(A) + P(A and B) = 1 - 13/52 + 3/52 = (52 - 13 + 3)/52 = 42/52 = 21/26 ≈ 0.8077.
    - But if they priced it at 3/13 ≈ 0.2308, then in the ¬A cases (which occur with probability 39/52 = 3/4) they are paying 1 for a contract that they sold for about 0.23, so they lose 0.77 per contract. This will cause them to bleed chips.

  - Alternatively, if they ruled that Contract 2 pays 0 when A is false, then:
    - Payoff = 1 only if A and B, 0 otherwise.
    - So fair price = P(A and B) = 3/52 ≈ 0.0577.
    - If they sold at 3/13≈0.2308, they are overcharging when A and B occur (they pay 1 but received 0.2308, so net loss of 0.7692) but undercharging when A and ¬B (they pay 0 and received 0.2308) and when ¬A (they pay 0 and received 0.2308). However, the expected loss for the bookie is: 
      - In the event A and B (prob 3/52): they lose (1 - 0.2308) ≈ 0.7692
      - In the event A and ¬B (prob 10/52): they gain 0.2308
      - In the event ¬A (prob 39/52): they gain 0.2308
      - Expected loss: (3/52)*(-0.7692) + (10/52)*(0.2308) + (39/52)*(0.2308) = negative? Actually, let's compute:

      But note: the fair price is 3/52, so if they set it at 3/13, they are setting it at 12/52, which is 4 times too high. So they will lose money on average? Actually, the expected value of the contract under this ruling is 3/52, so if they sell at 12/52, they are making a profit of 9/52 per contract? 

      Wait, no: 
      - The contract pays 1 with probability 3/52, 0 otherwise. So the expected payout is 3/52.
      - If they sell at 12/52, then their expected profit per contract is 12/52 - 3/52 = 9/52.

      But that doesn't match the intuition of triviality. The problem in the triviality results is that if we want the conditional to be a proposition and also have its probability equal to P(B|A), then it must be that P(if A then B) = P(B|A). But in the first ruling (vacuously true) we saw that P(if A then B) = P(¬A) + P(A and B) = 1 - P(A) + P(A and B) which is not equal to P(B|A) unless P(A)=1. In the second ruling (false when A false) we have P(if A then B) = P(A and B) which is also not equal to P(B|A) unless P(A)=1.

      So the point is: if the bookmakers set the price of Contract 2 to P(B|A) (which is 3/13) but then assign a truth value that leads to a fair price that is not 3/13, they are mispriced and will be exploited.

      However, note that in the second ruling, if they set the price at P(B|A)=3/13, they are actually setting it above the fair price (3/52) and so they would make money? But that's because they set the price too high. The traders should not buy at that price. We need to assume the traders are rational and know the settlement rules.

      So we must assume that once the settlement rules are set, the traders will only buy if the price is below the fair price (from their perspective) and sell if above. Therefore, the bookmakers will be forced to set the price at the fair price given their settlement rule.

      But the point of the activity is that the bookmakers initially set the price at P(B|A) without realizing that the settlement rule changes the fair price. Then when the card is drawn, they realize they are losing in some cases.

      Therefore, to make the point, we need the bookmakers to set the price for Contract 2 at P(B|A) and then the traders will exploit the mispricing.

      How? 
      - In the first ruling (vacuously true): fair price is 21/26 ≈ 0.8077, but bookmakers set at 0.2308. So traders will buy the contract at 0.2308 because it's worth 0.8077. Then when ¬A happens (which is 75% of the time) they get 1, making a profit of 0.7692. They also get 1 when A and B (which is about 5.8% of the time) and 0 when A and ¬B (19.2%). On average, they make a profit of 0.8077 - 0.2308 = 0.5769 per contract.

      - In the second ruling (false when A false): fair price is 3/52≈0.0577, but bookmakers set at 0.2308. So traders will sell the contract to the bookmakers at 0.2308 (or the bookmakers are selling at 0.2308, so traders will avoid buying and might even offer to sell if allowed). But if the bookmaker is posting an offer to buy at 0.2308, then traders will sell to them at that price. The fair price is 0.0577, so the bookmaker is overpaying. The trader sells a contract that is worth 0.0577 for 0.2308, making an immediate profit of 0.1731. Then when the card is drawn, the trader has to pay the bookmaker: 1 if A and B, 0 otherwise. But since they sold the contract, they receive the price and then pay the outcome. So the trader's expected payout is 0.2308 - 0.0577 = 0.1731.

      So in both cases, the bookmakers lose chips.

  #### The Fix
  - The bookmakers must set the price for Contract 2 at the fair price under their chosen settlement rule. For the first ruling: 21/26, for the second: 3/52. But note that neither is equal to P(B|A)=3/13.

  #### Round 2: Nesting
  - Now, we want to show the problem with nested conditionals. We change the scenario to include a nested conditional.

  - Let's define a new contract: Contract 3: "If A then, if B then C". We need a third event, C. For example, let C be "The card is red". But note: in a standard deck, hearts are red, diamonds are red, clubs and spades are black. Since A is hearts (so already red) and B is face card, then if A and B, then the card is a heart face card, which is red. So if A is true (hearts) then the card is red, so "if B then C" would be: if face card then red. But note, if the card is a heart (so red) and a face card, then it is red. But if the card is a heart and not a face card, then it is still red. So in the event A, the conditional "if B then C" is true? 
    - Actually, when A is true (hearts), then we are in a red suit. So C is always true. Therefore, "if B then C" is true regardless of B because C is true. So that might be too degenerate.

  - Let's pick a different C. How about C: "The card is the King of hearts". But that is very rare.

  - Alternatively, let's change the events to make it more interesting. We'll use an urn to have more control.

  ### Switching to an Urn
  To have more flexibility and avoid the structure of a deck, use an urn with colored balls.

  - **Urn setup**: 
    - 10 balls: 4 red, 6 blue.
    - Among the red: 1 with a star, 3 without.
    - Among the blue: 2 with a star, 4 without.

    So:
    - A: "The ball is red" -> P(A)=4/10=0.4
    - B: "The ball has a star" -> P(B)= (1+2)/10=3/10=0.3
    - P(B|A)=1/4=0.25

    Now, for nesting, we need a third property. We don't have one, so we can add: 
    - Let there be two shapes: circle and square. We can assign arbitrarily.

    But to keep it simple, we might not need a third property for the nested conditional? Actually, we do.

    Alternatively, we can define a nested conditional without a new event by using the existing ones? For example: "If the ball is red then if it has a star then ..." but we need a consequent. We can make up a new attribute or use a constant. However, that might be confusing.

    Let me define:
    - We'll add a third event C: "The ball is made of glass" (hypothetical, we'll assign arbitrarily). Say:
      - Among red with star: 1 glass
      - Among red without star: 0 glass (so 3 not glass)
      - Among blue with star: 1 glass, 1 not
      - Among blue without star: 0 glass, 4 not

    This is getting complicated. Alternatively, we can use a simpler nested conditional that doesn't require a new event? But we need a consequent that is not always true or false.

    Another idea: We can use the same events and have the nested conditional be "If A then (if B then A)"? That would be trivial because A is true in the antecedent. 

    Alternatively, "If A then (if B then C)" where C is a new event. Let's define C: "The ball is heavy". We assign arbitrarily:

    - Red with star: heavy? 1 heavy, 0 light? (but we have one ball) -> assume each ball has all properties. So we need to define for each combination.

    We'll create 10 balls with the following properties:

    | Color | Star | Weight | Count |
    |-------|------|--------|-------|
    | Red   | Yes  | Heavy  | 1     |
    | Red   | Yes  | Light  | 0     |
    | Red   | No   | Heavy  | 0     |
    | Red   | No   | Light  | 3     |
    | Blue  | Yes  | Heavy  | 1     |
    | Blue  | Yes  | Light  | 1     |
    | Blue  | No   | Heavy  | 2     |
    | Blue  | No   | Light  | 2     |

    Then:
    - A: Red -> 4 balls
    - B: Star -> 3 balls (1 red, 2 blue)
    - C: Heavy -> 1 (red star) + 1 (blue star) + 2 (blue no star) = 4 balls.

    Now, conditional probabilities:
    - P(B|A) = P(star | red) = 1/4
    - P(C|A and B) = P(heavy | red and star) = 1/1 = 1 (since there is only one red star and it is heavy)

    Now, we want to price a nested conditional: "If A then (if B then C)".

    The ordinary conditional bet for the nested conditional would be: You pay a price, and:
      - If A is false: stake returned (no action).
      - If A is true and B is false: stake returned? Actually, no: the inner conditional is only active if B is true? Let me be clear.

    The ordinary conditional bet for "if B then C" given A has already occurred? Actually, the nested conditional in the ordinary way would be a conditional on A of the conditional on B given A. But in betting terms, we would conditionally bet on "if B then C" only if A occurs.

    However, the bookmakers for Contract 2 (truth-conditional) now have to handle a nested conditional. And they have to define settlement for all cases.

    The issue: if they decided in Round 1 that when the antecedent is false, the conditional is true (or false) then for the nested conditional they have to define what happens when A is false. But also, when A is true and B is false, they have to define the truth value of the inner conditional.

    Suppose in Round 1 they ruled that when the antecedent is false, the conditional is true (vacuously). Then for the nested conditional "If A then (if B then C)":

    - If A is false: the entire conditional is vacuously true? So pays 1.
    - If A is true: then the inner conditional "if B then C" must be evaluated. Now, if B is true, then we look at C. If B is false, then by their ruling the inner conditional is vacuously true? So the entire conditional would be true in both cases when A is true? That doesn't sound right.

    Alternatively, if they ruled that when the antecedent is false, the conditional is false, then:
    - If A is false: entire conditional false -> 0.
    - If A is true: then we look at the inner conditional. If B is false, then the inner conditional is false? So the entire conditional would be false? But that doesn't match the ordinary understanding.

    The problem: the truth value of the nested conditional is not straightforward. Moreover, if they try to void the contract when the antecedent is false, then for the nested conditional:

      Contract: "If A then (if B then C") 
      - If A is false: void? Then the contract doesn't pay anything? But then what is its fair price? It would be the conditional probability of the inner conditional given A and B? But note: the ordinary conditional bet for the nested conditional would be:

        It is settled only when A is true. Then, if A is true, we have a conditional bet on "if B then C" (which would be settled only when B is true? and if B is false, the bet on "if B then C" is void and returns the stake). But that is getting very messy.

    The point: if they void when the antecedent is false, then for the nested conditional, when A is true, they have to evaluate "if B then C". But if they void that inner conditional when B is false, then the entire contract "If A then (if B then C)" would be void when A is false, and when A is true and B is false? They void the inner conditional, but what about the outer? 

    This is the nesting mess. The bookmakers will get stuck because they have to assign a truth value to the entire nested conditional in every possible outcome. And if they try to void, then in the case A true and B false, they have to decide: is the inner conditional void? And then what is the truth value of the outer conditional? It's not defined.

    So the activity: after Round 1, we introduce Contract 3: "If A then (if B then C)". The bookmakers must set a price and a settlement rule for all cases. They will struggle to define what happens when A is true and B is false for the inner conditional. 

    In particular, if they try to use the same ruling as in Round 1 (say, void when antecedent false) then for the outer conditional, when A is true, they are obligated to evaluate the inner conditional. But the inner conditional when B is false would be void. What does that mean for the outer conditional? It hasn't been settled? 

    This illustrates the problem that the language is closed under conditionals, and if we void when the antecedent is false, then for nested conditionals we have cases (A true, B false) that are not settled.

  ### Activity Structure

  **Time Breakdown (80 minutes):**

  1. **Introduction (10 mins)**:
     - Explain the setup: We have an urn with 10 balls (describe the properties). We will draw one at random at the end.
     - Split the class: 7 bookmakers and 7 traders. (If uneven, have some students be both or adjust.)
     - Explain Contract 1 (ordinary conditional bet on "B if A") and Contract 2 (truth-conditional bet on "If A then B").
     - For Contract 2, the bookmakers must decide on the settlement rule for when A is false. They can choose: 
          - Pay 1 (vacuously true)
          - Pay 0 (false)
          - Or void (return the stake, so net 0) but note: if they choose void, we let them, but then in Round 2 they will face the nesting problem.

  2. **Bookmaker Preparation (10 mins)**:
     - Bookmakers huddle and decide on:
          - The price for Contract 1 (they should set it to P(B|A)=1/4=0.25).
          - The price for Contract 2 (they will likely set it to 0.25 too, without realizing the issue).
          - The settlement rule for Contract 2 when A is false.

  3. **Trading Round 1 (10 mins)**:
     - Bookmakers post their prices and settlement rules for both contracts.
     - Traders move around and trade. Each trader starts with, say, 10 chips. They can buy or sell contracts. (Clarify: buying a contract means paying the price to the bookie and then getting the payoff later. Selling means receiving the price and then having to pay the payoff later.)
     - Encourage traders to think about what the contracts are really worth given the settlement rules.

  4. **Settlement of Round 1 (10 mins)**:
     - Draw a ball from the urn (or use a random number to simulate).
     - Settle both contracts for all bookmakers and traders.
     - Bookmakers who set Contract 2 at 0.25 and ruled vacuously true will lose money when ¬A occurs (which has 60% chance). Similarly, if they ruled false, they might lose when A and B occurs. 
     - Have the students count their chips. Bookmakers who lost chips will be unhappy.

  5. **Discussion and Fix for Contract 2 (10 mins)**:
     - Discuss why the bookmakers lost money on Contract 2. 
     - Point out: the fair price for Contract 2 is not P(B|A) but depends on the settlement rule.
     - Calculate the fair price under the two rulings:
          - If vacuously true: P(¬A) + P(A and B) = 6/10 + 1/10 = 7/10 = 0.7
          - If false: P(A and B) = 1/10 = 0.1
     - So the two contracts are different and their prices come apart by an amount that depends on P(¬A) and P(¬B|A). Specifically, the gap between the two contracts is P(¬A) * [1 - P(B|A)]? Actually, the difference in the two settlement rules for Contract 2 is exactly P(¬A) * 1 (if they set it to true) vs P(¬A)*0 (if false). But note, the ordinary conditional bet ignores ¬A, while Contract 2 does not.

  6. **Round 2: Nested Conditional (15 mins)**:
     - Introduce Contract 3: "If A then (if B then C)". 
     - Bookmakers must set a price and a settlement rule for all cases (for every possible ball, what does it pay?).
     - They must decide:
          - What happens when A is false? (void? true? false?)
          - What happens when A is true and B is false? (for the inner conditional, and then for the outer)
     - Let them try to decide. They might try to void when the antecedent is false. So for the outer conditional: void when A false. For the inner conditional: when B is false, void. But then when A is true and B is false, the inner conditional is void. What does that mean for the outer conditional? They have to assign a truth value to the entire conditional in that case.
     - Trading occurs.

  7. **Settlement of Round 2 (5 mins)**:
     - Draw a ball and settle. The bookmakers will likely have trouble settling when A is true and B is false.

  8. **Debrief (10 mins)**:
     - Map the experience to the triviality results:
          - Round 1 shows that if we assign truth values to conditionals (making them propositions), then the probability of the conditional is not the conditional probability (unless in degenerate cases). The gap is due to the ¬A cases.
          - Round 2 shows that if we try to avoid the gap by voiding when the antecedent is false, then nested conditionals become problematic because we have to assign a truth value to a conditional that has been voided? Specifically, in the case where the antecedent of the outer conditional is true but the antecedent of the inner is false, we have no way to settle the inner conditional without a truth value (if we voided it) and then the outer conditional is left without a truth value? 
     - Be honest: This activity doesn't derive the theorems (like Lewis's collapse) but illustrates the intuition. You will have to explain Lewis's result: that if we assume the language is closed under conditionals and that the probability of a conditional is the conditional probability, then the only possibility is that the conditional is a very special one (the Stalnaker conditional) and even then it leads to triviality (only possible if the probability space is trivial). Alternatively, we can state that the two contracts (conditional bet and truth-conditional bet) are not the same, and the truth-conditional bet forces the conditional to be a proposition that must have probability at least P(¬A) (if we accept vacuously true) which is not equal to P(B|A) unless P(A)=1.

  ### What the activity can't do
  - It does not formally prove Lewis's triviality results. You will have to state the theorem: There is no proposition (in a non-trivial probability space) that has a probability equal to the conditional probability for all probability distributions. And for the nested conditional, the voiding approach leads to a language that is not truth-functional and cannot be embedded in a standard probability space.

  ### Predictable Problems
  1. **Bookmakers refuse to settle when A is false for Contract 2** by saying the conditional is neither true nor false. This is the best outcome because it leads to the voiding option. Then in Round 2, they will face the nesting problem. So let them choose that. Then in Round 2, when A is true and B is false, they have to settle the inner conditional. If they void the inner conditional, then what is the truth value of the outer conditional? They might say that the outer conditional is void because the inner one is void? But that would mean the contract is void whenever A is true and B is false? Then the contract only settles when A is false (void) or when A is true and B is true (then we look at C). But that is equivalent to conditioning on A and B? Then the fair price would be P(C | A and B). But note, that is the same as the ordinary conditional bet for "C if A and B". But the point of the nested conditional is that it is not the same as that. The nested conditional "If A then (if B then C)" should, in the ordinary understanding, be equivalent to "If A and B then C". But that is the point of the triviality: if we force the conditional to be a proposition and also require that P(if A then B) = P(B|A), then we get that P(if A then (if B then C)) = P(C|A and B). But also, by the same token, P(if A then (if B then C)) should equal P( (if B then C) | A). And if we require that P( (if B then C) | A) = P(C | A and B), then that is consistent. However, Lewis's result shows that this forces the probability space to be trivial.

     But in the activity, if the bookmakers set the settlement rule for the nested conditional that it is equivalent to "if A and B then C", then they are effectively avoiding the problem by definition. But then you can point out: that is exactly what the triviality results force: the nested conditional collapses to the conditional with the conjoined antecedent.

     So if they do that, then the fair price for Contract 3 is P(C | A and B). And that is what they set. Then the traders won't exploit. But then you can ask: what is the truth value of "if B then C" when A is true and B is false? They have defined the entire conditional without ever defining the inner one. So the inner conditional is not given a truth value independently. This illustrates that the conditional cannot be a proposition in the usual sense.

  2. **Time Management**: The activity might run long. Be prepared to cut short the trading rounds if needed.

  3. **Complexity**: Students might get lost in the calculations. Have the probabilities pre-calculated on a handout.

  ### Materials
  - Urn and balls (or a random number generator) for drawing.
  - Chips or play money.
  - Handout with the urn composition and events.

  ### Final Preparation
  - Prepare the urn (or a deck of cards if you switch back) and make sure the counts are known.
  - Have a clear record of the events and their probabilities.
  - Pre-calculate the fair prices under different rulings.

  This should create the gut feeling you want. Good luck!
answer: |-
  Here's a fully developed, runnable activity based on your seed, designed to make the triviality results visceral. It prioritizes intuition over formalism and fits within 80 minutes. I'll walk you through setup, execution, debrief, and pitfalls.

  ---

  ### **Activity: The Conditional Betting Trap**
  **Objective:** Experience why conditionals can't be treated as propositions with truth values while maintaining \(P(\text{if }A\text{ then }B) = P(B|A)\), and why nesting creates chaos.

  **Materials:** 
  - Deck of cards (for easy settling)
  - Poker chips (100+)
  - Scenario cards (1 per bookmaker, see below)
  - Price tags & settlement rule sheets (index cards)
  - Timer

  **Prep (5 mins):**
  - **Split students:** 7 bookmakers, 7 traders.
  - **Give bookmakers:** Identical scenario cards:  
    *"A card will be drawn from a deck. Let:  
    \(A\) = Card is a Heart.  
    \(B\) = Card is a Face card (J, Q, K).  
    Define settlement rules for truth-conditional bets."*
  - **Give traders:** 10 chips each.

  ---

  ### **Round 1: The Truth-Value Trap (30 mins)**
  **Step 1: Bookmakers set prices & rules (5 mins)**  
  - Bookmakers huddle. They must post:  
    - **Contract 1 (Ordinary conditional):** "Pay $1 if \(A \& B\), refund if \(\neg A\), $0 if \(A \& \neg B\)".  
      *(They'll quickly agree: fair price = \(P(B|A) = P(\text{Face} | \text{Heart}) = 3/13 \approx 0.23\).)*  
    - **Contract 2 (Truth-conditional):** "Pay $1 if 'If A then B' is TRUE, $0 if FALSE".  
      ***Crucially:*** They must write a settlement rule for \(\neg A\) (when no Heart is drawn).  
      *Let them debate options: "TRUE when \(\neg A\) (vacuously true)" vs. "FALSE when \(\neg A\)" vs. void. Don't intervene.*

  **Step 2: Trading (10 mins)**  
  - Bookmakers post prices & rules publicly.  
    *Prediction:* Most bookmakers will intuitively price Contract 2 at \( \approx 0.23 \) (same as Contract 1), regardless of their \(\neg A\) rule.  
  - Traders buy/sell contracts. Encourage: "Buy if you think price < true value, sell if price > true value".  
    *Key:* Traders should notice mispricing if they understand the rules.

  **Step 3: Settlement (5 mins)**  
  - Draw a card publicly. Settle all contracts.  
    *Use a card where \(\neg A\) (e.g., 7♠) to maximize impact.*  
    - **Contract 1:** Refunded (no Heart).  
    - **Contract 2:**  
      - If bookmakers ruled "TRUE when \(\neg A\)": Pay $1 to buyers.  
      - If ruled "FALSE when \(\neg A\)": Pay $0.  
      - If void: Refund.  

  **Step 4: Observe losses (10 mins)**  
  - Bookmakers who priced Contract 2 at \( \approx 0.23 \) bleed chips on \(\neg A\):  
    - If "TRUE on \(\neg A\)": They paid $1 for a contract they sold for $0.23 → **lose $0.77 per contract**.  
    - If "FALSE on \(\neg A\)": They paid $0, but traders who bought demand refunds? Clarify: **No refunds for truth-conditional bets.** Traders paid $0.23 for a contract now worth $0 → **bookies profit, but traders revolt.**  
  - Highlight:  
    > "If Contract 2 is TRUE when \(\neg A\), its fair price is \(P(\neg A) + P(A \& B) = 39/52 + 3/52 = 42/52 \approx 0.81\).  
    If FALSE when \(\neg A\), fair price is \(P(A \& B) = 3/52 \approx 0.06\).  
    Neither is \(P(B|A) = 0.23\)! You *can't* price it at \(P(B|A)\) without bleeding chips on \(\neg A\)."

  ---

  ### **Round 2: The Nesting Trap (30 mins)**
  **Step 1: Introduce nested conditional (5 mins)**  
  - Announce: "Now trade **Contract 3**: 'If A, then if B, then C' where \(C\) = Card is Red. Bookmakers must set price and full settlement rules."  
    *(Note: \(C\) is always true if \(A\) (Hearts are Red), so "if B then C" is always true when \(A\).)*  
  - Bookmakers huddle. They must define:  
    - What happens when \(\neg A\)?  
    - What happens when \(A \& \neg B\)? (e.g., Heart but not Face)  
    *Prediction:* Bookmakers will avoid \(\neg A\) losses by ruling "void when \(\neg A\)". But then they're stuck on \(A \& \neg B\).*

  **Step 2: Trading (10 mins)**  
  - Bookmakers post prices/rules for Contract 3.  
    *Prediction:* They'll price it near \(P(C|A \& B) = 1\) (since \(C\) is certain if \(A\)), but struggle with rules.  
    - **When \(\neg A\):** Most will say "void" (to avoid Round 1's bleed).  
    - **When \(A \& \neg B\):** Chaos! Options:  
      - "Void the inner conditional? But what's the outer truth value?"  
      - "Arbitrarily call whole thing TRUE/FALSE?"  
      - "Refuse to rule?!"  
  - Traders exploit ambiguity: "If you don't define \(A \& \neg B\), I'll assume it pays $0 when I sell!"

  **Step 3: Settlement (5 mins)**  
  - Draw a card where \(A \& \neg B\) (e.g., 2♥).  
  - Settle Contract 3. Bookmakers must enforce their rules.  
    *Prediction:* Arguments erupt. If they voided when \(\neg A\), but didn't define \(A \& \neg B\), they can't settle. If they defined it arbitrarily, traders cry foul.*

  **Step 4: Observe the impasse (10 mins)**  
  - Highlight:  
    > "You tried to avoid \(\neg A\) by voiding, but then **nesting forced you to confront \(A \& \neg B\)**. What's the truth value of 'if B then C' here? You have nothing to conditionalize on! Voiding kills compositionality."

  ---

  ### **Debrief (15 mins)**
  **Map intuition to theory:**  
  1. **Round 1's bleed** illustrates why \(P(\text{if }A\text{ then }B) \neq P(B|A)\):  
     - Truth-value gaps (\(\neg A\)) force the price to be \(P(\neg A) \cdot X + P(A) \cdot P(B|A)\), where \(X\) is 1 (if TRUE on \(\neg A\)) or 0 (if FALSE).  
     - Only if \(P(\neg A)=0\) (A certain) or \(P(B|A)=0\)/1 (B impossible/certain given A) does it equal \(P(B|A)\).  
     - **This is Adams' Thesis + truth values ⇒ triviality.**  

  2. **Round 2's chaos** previews Lewis' collapse:  
     - Voiding \(\neg A\) avoids bleed, but nesting requires evaluating conditionals locally (e.g., at \(A \& \neg B\)).  
     - If "if B then C" isn't true/false there, you can't assign a truth value to the whole conditional.  
     - **Any semantics where \(P(\text{if }A\text{ then }B) = P(B|A)\) requires conditionals to reduce to truth-functional operators in non-stochastic ways (⇒ triviality).**

  **What the activity CAN'T do (be transparent):**  
  - It doesn't **derive theorems** (e.g., Lewis' \(P(\text{if }A\text{ then }B)\) must = \(P(B|A)\) universally ⇒ only trivial models).  
  - It doesn't **cover all semantics** (e.g., Stalnaker's fix has its own issues).  
  - It assumes **classical logic** (e.g., "vacuously true" is optional but common).  

  **Supply at the end:**  
  1. **Formal punchline:** "Lewis proved: No non-trivial probability space can satisfy \(P(A \rightarrow B) = P(B|A)\) for all \(A,B\) if conditionals are propositions and the language is closed under conditionals."  
  2. **Why it matters:** This kills truth-conditional theories of indicatives (e.g., Jackson's).  
  3. **Salvage paths:**  
     - Accept non-propositional status (Adams, Edgington).  
     - Use restricted languages (e.g., no nesting).  
     - Embrace triviality (but then conditionals are useless).  

  ---

  ### **Predictable Problems & Fixes**
  1. **Bookies refuse to settle on \(\neg A\):**  
     - **Best case:** Let them fight! It mirrors philosophical disputes (e.g., Quine vs. Stalnaker). Push them: "If it's neither true nor false, what *is* it? How do you price uncertainty?"  
     - **Worst case:** If deadlocked, impose "void when \(\neg A\)" to force Round 2's nesting trap.  

  2. **Traders don't exploit mispricing:**  
     - **Fix:** Secretly hint to 1-2 traders: "If Contract 2 pays $1 on \(\neg A\) and costs $0.23, is that a good deal?" Or prime them pre-activity: "Smart traders spot when prices don't match outcomes."  

  3. **Time runs short:**  
     - **Fix:** Shorten trading (7 mins/rnd). Use pre-calculated probabilities (handout deck stats). Skip card draws; use pre-determined scenarios (e.g., "Assume \(\neg A\): 7♠ is drawn").  

  4. **Nested conditional too abstract:**  
     - **Fix:** Use a concrete analogy: "Suppose I say: 'If it rains, then if the game is on, I'll go.' It doesn't rain. Is the whole thing true? What if it rains but the game is canceled?"  

  ---

  ### **Why This Works**
  - **Gut-level intuition:** Students *lose chips* on \(\neg A\) and *hit walls* with nesting. This makes triviality feel unavoidable, not just technical.  
  - **American English:** Plain language; no jargon like "vacuous truth" unless students invoke it.  
  - **Logistics:** Uses cheap, on-hand materials (cards, chips).  

  Run this as-is, and they'll leave feeling why conditionals are "rogue" entities that break standard logic. Good luck!
