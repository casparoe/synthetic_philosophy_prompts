prompt: |-
  Im applying for a small internal research grant — six months, one person (me), philosophy — and I need the actual two-page proposal document, not an outline or a pep talk.

  The topic is the hedonistic imperative: the view that we should use biotechnology (genetic engineering, neuro-interventions, whatever comes next) to abolish suffering across all sentient life, not just humans, and replace it with a permanently high baseline of well-being.

  Heres the half-formed idea I want you to build around. The usual debate is whether suffering is valuable — it motivates us, it grounds compassion, it makes pleasure possible — and I think thats mostly an intuition-swap and a dead end. I want to go one level up. I think the imperative quietly bundles three separate claims: (1) we can delete the raw aversive sensation; (2) we can delete the negative valence, the this-is-bad quality, while leaving the sensation intact; and (3) we can replace whatever functional job the negative valence was doing — learning from harm, avoiding danger, motivating repair, bonding — with something else. My hunch is that (1) and (2) come apart, that only (2) is what actually matters ethically, and that (3) is where the whole thing lives or dies: if the badness is partly constitutive of the job rather than a tag riding along on top of it, then (2) might not be achievable in the way the imperative needs. There are brain-injury cases where people report they feel pain but arent bothered by it at all, which looks like the test case for the whole distinction.

  Turn this into a proposal. I want a precise statement of the question with a determinate answer (not just is abolishing suffering good), an account of why the obvious positions on both sides leave it open, what a philosopher with no lab would actually do month by month across the six months, what a successful outcome looks like versus what would count as the project failing, and an honest scope section — is this too big for six months, and what would I have to cut. No citations or reading list, I'll handle those myself.
