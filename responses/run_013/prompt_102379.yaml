prompt: |-
  I have recently been pulled into a dispute about the historical Jesus that I had assumed scholarship settled long ago, and I have found instead that the machinery for settling it is itself in question. The tools in play are the familiar ones: treat a saying or a deed as going back to Jesus if it would have embarrassed the early church to have invented it; if it is attested in more than one independent strand of the tradition; if it cuts against the expectations of both the Judaism of his day and the Christianity that followed; if it coheres with whatever else one has already accepted. One party tells me these are the best instruments we have and that used together they converge on a recognizable figure. The other tells me that each is circular: that the criterion rewarding embarrassment makes the church a trustworthy witness precisely where it testifies against its own interests; that the criterion rewarding dissimilarity defines Jesus almost entirely by what he was not, so that the residue it leaves is an artifact of the method; and that the demand for coherence quietly presupposes an authentic core that has not yet been established. I do not want to choose sides yet. I want the specification that would let me judge the instruments.

  Set out the desiderata that any criterion, or set of criteria, for authenticity in the Jesus tradition must meet if it is to be adequate for the purpose of reconstructing what Jesus actually said and did. Give me the cases each criterion has to get right, the distinctions it must not collapse, and the background facts about the sources it must be consistent with, in each case with the consideration that makes it a requirement. I expect the list to include something about independence from the investigator's own commitments, something about the nature of the evidence (that everything we have was transmitted by people who already believed, in genres not written to record for posterity, decades after the events, within conventions of memory and report unlike our own), and something about what authenticity is even supposed to mean here, whether a verbatim saying, the gist of one, or a characteristic deed. Add whatever else belongs and say why it belongs.

  Then mark which of these requirements are non-negotiable and which are merely preferences of one camp or another, and flag any pair or subset that I should suspect cannot be jointly satisfied; if the list turns out to be internally inconsistent, that is itself the most useful thing you could tell me. Finally, say which single requirement does the most to disqualify the popular criteria, and, briefly, how the main criteria on offer fare against the list.
reasoning: |-
  Okay, the user is deep into a scholarly dispute about the historical Jesus and the criteria for authenticity. They're caught between two sides: one defending traditional criteria like embarrassment and multiple attestation, and the other calling those methods circular. The user doesn't want to pick sides yet—they want a clear framework to evaluate these tools themselves.

  Hmm, this is a sophisticated request. The user clearly knows the academic landscape but feels stuck in methodological gridlock. They're asking for something very precise: not just an explanation of the criteria, but the foundational requirements any valid criterion must meet. Underneath that, I sense frustration—they thought this was settled scholarship, now they're discovering it's a minefield. They probably want intellectual clarity to navigate this without partisan bias.

  The core challenge is defining what makes a criterion "good" in this messy field. The sources are theological documents written decades later by believers, not neutral reporters. Memory studies show oral tradition transforms content. Even "authenticity" is slippery—are we chasing exact words or general impressions? 

  I need to structure this carefully. First, the absolute requirements: consistency with source nature (devout transmitters, late recording), independence from scholar's biases (huge problem in Jesus studies!), and clear definitions of "authentic." Then the negotiable preferences, like how much coherence matters. 

  The trickiest part is flagging inherent tensions. For example: wanting criteria independent of later Christian theology (dissimilarity) clashes with the fact all sources come from that theology. Or demanding multiple attestation ignores that most material only exists in one stream. 

  The single biggest flaw in popular criteria? Probably their failure to handle "independence from investigator's commitments." Dissimilarity assumes we can cleanly separate Jesus from Judaism/Christianity—but that reflects modern scholarly constructs, not ancient reality. Embarrassment relies on guessing what "embarrassed" the early church, which is highly subjective. 

  I'll end by showing how each criterion stumbles: embarrassment is culturally speculative, dissimilarity creates a "nobody like him" Jesus, coherence is circular, multiple attestation is scarce. The takeaway should be sobering: no method escapes these problems entirely. The user wanted tools to judge the instruments—ironically, the analysis shows all instruments are flawed. That's the brutal honesty they need.
answer: |-
  Here is a specification of desiderata for criteria assessing the authenticity of Jesus traditions, designed for neutral evaluation:

  ### Non-Negotiable Desiderata (Must Be Met)
  1.  **Consistency with Source Provenance:**
      *   **Requirement:** Criteria must acknowledge that *all* sources (canonical/non-canonical) were transmitted/written by believers ("the convinced"), decades post-events (oral period), primarily for proclamation/instruction (kerygmatic/parenetical), not objective historiography.
      *   **Why:** The nature of the evidence dictates that invention, theological interpretation, communal shaping, and memory adaptation are inherent possibilities (e.g., Gospels written 40-70 years after Jesus; Paul's letters focused on theology/church issues).
      *   **Must Get Right:** Criteria cannot assume sources *aimed* for or reliably achieved modern "factual" reporting.

  2.  **Operational Independence from Investigator's Commitments:**
      *   **Requirement:** Criteria must be defined such that results aren't predetermined by the scholar's theological stance (e.g., supernatural presuppositions) or ideological agenda.
      *   **Why:** To avoid circularity (e.g., a skeptical scholar dismissing miracles *a priori*; a confessional scholar accepting them uncritically). The criterion's logic must be separable from the user's worldview.
      *   **Must Get Right:** Distinguish between methodological skepticism (questioning sources) and metaphysical naturalism (rejecting possibility of miracles).

  3.  **Definitional Clarity of "Authenticity":**
      *   **Requirement:** Must explicitly define what "authentic" means: verbatim saying, gist/core idea, characteristic action/pattern, or a historically plausible event fitting Jesus' context. Cannot conflate these.
      *   **Why:** Expecting verbatim quotes from oral tradition is unrealistic; demanding only "plausible gist" risks excessive inclusivity. The criterion's target must be clear.
      *   **Must Distinguish:** Verbatim recall vs. thematic fidelity vs. plausible invention fitting context.

  4.  **Avoidance of Intrinsic Circularity:**
      *   **Requirement:** The criterion's logic cannot presuppose the existence of the very "authentic core" it seeks to establish.
      *   **Why:** To prevent bootstrapping (e.g., Coherence: "X is authentic because it fits the authentic core" – but what defines the core?).
      *   **Must Get Right:** Criteria cannot rely on prior assumptions about Jesus derived from uncritically accepted traditions.

  5.  **Historical Plausibility within 1st-Century Palestinian Judaism:**
      *   **Requirement:** Attributions must be conceivable for a 1st-century Jewish figure operating in Galilee/Judea under Roman rule. This is the fundamental historical context.
      *   **Why:** Jesus was not a 21st-century Westerner, a medieval monk, or a Hellenistic philosopher. Authenticity requires contextual fit.
      *   **Must Get Right:** Must distinguish radical innovation *within* Judaism from ideas utterly foreign to it. Avoids anachronism.

  ### Important, But Potentially Negotiable/Prioritized Differently
  6.  **Respect for Oral Tradition Dynamics:**
      *   **Requirement:** Criteria should be compatible with known patterns of oral transmission (variation within stability, thematic grouping, adaptation to audience/context).
      *   **Why:** Memory studies and anthropology show oral tradition isn't static recording but active, communal retelling. Expect verbatim inconsistency, thematic consistency.
      *   **Preference Variation:** Some emphasize stability of core; others emphasize fluidity. Criteria shouldn't demand impossible verbatim fixity.

  7.  **Sensitivity to Literary Genre & Authorial Intent:**
      *   **Requirement:** Criteria must account for the specific genre and purpose of each source (e.g., Gospel as theological biography; Q as sayings source; Paul as pastoral letters).
      *   **Why:** Genre shapes how material is presented and selected. A parable in a Gospel serves a different function than a creedal formula in Paul.
      *   **Preference Variation:** How much weight to give genre constraints vs. potential historical kernels within them.

  8.  **Ability to Handle Contradiction/Ambiguity:**
      *   **Requirement:** Criteria shouldn't collapse plausible contradictions or ambiguities in the tradition into a false harmony. Multiple authentic perspectives are possible.
      *   **Why:** Complex historical figures generate diverse memories and interpretations. Not all differences signal inauthenticity.
      *   **Preference Variation:** Some prioritize harmonization; others see contradiction as evidence of historical complexity.

  ### Suspected Tensions/Inconsistencies
  *   **Independence vs. Source Nature (1 & 2 vs. 4 & 6):** Truly "independent" criteria (free of scholar's bias) are hard to apply rigorously to sources inherently shaped by belief, memory dynamics, and communal transmission. How much can we filter out "faith" without imposing anachronistic skepticism?
  *   **Dissimilarity vs. Contextual Plausibility (5 vs. Dissimilarity):** Dissimilarity (Judaism/Early Church) defines Jesus *against* his context and effects, potentially isolating him implausibly. Contextual Plausibility demands he be firmly *within* his context. These pull in opposite directions. Dissimilarity risks creating a "nobody like him" figure.
  *   **Multiple Attestation vs. Scarcity of Independent Sources:** True independence of sources (Mark, Q, M, L, Paul, John, Thomas) is debated and limited. Demanding multiple attestation automatically excludes vast amounts of material attested only once, potentially discarding unique authentic traditions.

  ### The Major Disqualifier: Operational Independence from Investigator's Commitments (#2)
  This requirement most effectively exposes the weaknesses of popular criteria:
  *   **Embarrassment:** Relies on the *scholar's judgment* of what would have embarrassed the *early* church. This is highly subjective (e.g., Baptism by John? "Why call me good?" Lack of miracles at Nazareth? Crucifixion itself?) and culturally speculative. It presumes we know their sensitivities perfectly and that they *wouldn't* transmit embarrassing truths for theological reasons (e.g., the Cross *became* theology).
  *   **Dissimilarity:** Assumes we can definitively demarcate "Judaism" and "Early Christianity" *and* identify what cuts *against* both. This reflects the scholar's construction of these categories. What is "dissimilar" often depends on prior assumptions about what is "typical." It inherently produces a Jesus defined by negation.
  *   **Coherence:** Depends entirely on an *already established* "authentic core." What constitutes the core? Usually derived using other criteria (like Dissimilarity or Embarrassment), leading to circularity. It reinforces the initial picture but doesn't independently verify it.
  *   **Multiple Attestation:** While seemingly objective, judgments about *source independence* are interpretive (e.g., John's relation to Synoptics; existence/nature of Q/M/L; Thomas's independence/date). Its power is also limited by source scarcity, excluding potentially authentic unique material.

  ### How Main Criteria Fare Against the List
  *   **Embarrassment:** Fails #2 (subjective judgment), often struggles with #3 (what aspect is "embarrassed"?), and can be inconsistent with #1 (church preserved it *despite* potential embarrassment?).
  *   **Dissimilarity:** Fails #2 (scholar defines boundaries), often violates #5 (creates implausibly isolated figure), and fundamentally contradicts the contextual requirement (#5). Its results are artifacts of the method (#4).
  *   **Coherence:** Fails #4 (circular by definition). Depends entirely on prior application of other criteria. Offers no independent test.
  *   **Multiple Attestation:** Performs best on #2 (relatively objective *if* sources are independent), aligns with #6 (oral tradition stability). Weak on #1 (doesn't address *why* multiple sources attest – could be widespread invention), fails #3 (attestation doesn't guarantee verbatim or even gist accuracy), and is limited by source scarcity (#8 - ignores unique material).

  **Conclusion:** The desiderata reveal profound challenges. No popular criterion fully satisfies the non-negotiables, particularly avoiding circularity (#4) and achieving true operational independence from the scholar's judgments (#2), while respecting the faith-based, oral-transmission nature of the sources (#1, #6). The requirement for **Operational Independence (#2)** most sharply exposes the subjectivity inherent in applying Embarrassment and Dissimilarity, and the circularity of Coherence. The list isn't internally inconsistent *per se*, but the tensions highlighted (especially between Dissimilarity and Contextual Plausibility, and the difficulty of Independence given the Source Nature) mean that *any* set of criteria will involve significant scholarly judgment and trade-offs. The quest is inherently probabilistic and interpretive, not mechanical or definitive. The tools are imperfect probes, not precision instruments.
