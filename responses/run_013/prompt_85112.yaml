answer: |-
  Here’s the essay question, a model answer, and a marking scheme designed to push students beyond superficial Ulysses comparisons and force engagement with the enforcer ("crew") problem:

  **Essay Question:**
  "Using Homer’s Ulysses myth as an analogy, critically evaluate the claim that constitutional entrenchment is inherently undemocratic. Your analysis must explicitly address: (a) whether constitutionalism requires a ‘crew’ equivalent to Ulysses’ sailors, (b) whether courts function more like the ‘rope’ (a passive tool) or as agents possessing independent authority akin to the crew, and (c) how your answers to (a) and (b) reshape the democratic legitimacy critique."

  ---

  **Model Answer (Approx. 600 words):**

  **Constitutional entrenchment’s democratic deficit lies not primarily in binding future majorities, but in necessarily delegating the authority to enforce that binding to a *presently constituted agent* (the “crew”), whose own legitimacy and discretion fundamentally reshape the critique.** The standard Ulysses analogy obscures this by implying pure self-binding; Ulysses *cannot* bind himself alone—he requires sailors who obey his past self *against* his present commands. Similarly, a constitution cannot self-execute its constraints on future legislatures or citizens; it requires an institution (like a court) empowered to interpret and enforce its terms against contrary contemporary democratic expressions. This requirement of a *delegated enforcer* is the crux of the democratic challenge.

  **(a) Constitutionalism absolutely requires a ‘crew’ equivalent.** Without an institution authorized to uphold entrenched rules against transient majorities—whether through judicial review, a special amendment body, or another guardian—the constitution is merely parchment, easily ignored when inconvenient. The sailors *are* the binding mechanism. In the constitutional context, this role is typically filled by the judiciary. Ignoring this delegation renders the analogy meaningless and misses the core political act: vesting coercive interpretive power in a specific body *now* to restrain *future* popular sovereignty.

  **(b) Courts function fundamentally as the ‘crew’, not the rope.** While the constitutional text may be the ‘rope’, it is inert without active interpretation and application. Courts are not passive instruments; they *exercise judgment*. They interpret vague clauses, balance conflicting rights, apply ancient principles to novel contexts, and decide when legislative acts “exceed the rope’s length.” This involves significant discretion, akin to the sailors deciding *when* Ulysses’ begging constitutes a demand to be released (which they must ignore) and *whether* circumstances meet the pre-defined criteria for restraint. The court, like the crew, is an *agent* wielding delegated authority, not a mere tool. Viewing courts as just the "rope" ignores their unavoidable role as active interpreters and appliers of the binding constraint.

  **(c) Recognizing courts as the ‘crew’ reconfigures the democratic critique.** The charge that entrenchment is undemocratic because it binds future majorities is incomplete. The deeper issue is *who authorizes the crew* and *how accountable they remain*. If the crew (courts) are seen as merely enforcing the clear, original democratic pact (the rope), the critique weakens—they are faithful agents of the sovereign people’s past self-binding act. However, given courts’ necessary interpretive discretion (point b), they inevitably become *co-authors* of the constraint over time, shaping its meaning beyond the original, specific intent. This transforms the critique: the problem is less the *fact* of constraint by the past, and more the *present, ongoing exercise of constraining power by an unelected body* (the crew) whose interpretations may stray significantly from contemporary democratic will or the framers’ specific expectations. The legitimacy question shifts from “Can a people bind its future self?” to “Can a democratic people legitimately delegate final interpretive authority over fundamental law to a counter-majoritarian institution?” The answer hinges on whether the court’s role as crew is understood as preserving the foundational democratic act (the constitution) against momentary passions, or as an undemocratic usurpation by an unaccountable elite. The Ulysses myth highlights that the crew’s obedience is essential but perilous; similarly, judicial review is essential for constitutionalism but its democratic acceptability depends on contested theories of the court’s derived authority and the limits of its interpretive mandate.

  ---

  **Marking Scheme (Out of 20):**

  **Must-Hit Moves & Typical Botches:**

  1.  **Thesis Identifies Delegated Enforcement as Key (4 marks):** Explicitly states that the core democratic issue is the delegation to an enforcer ("crew"), not just self-binding.
      *   *Botch (Lose 2-3 marks):* Repeats the simple "binds future selves" point without emphasizing the necessity of an external enforcer.
  2.  **(a) Affirms Need for a 'Crew' & Identifies it (e.g., Courts) (4 marks):** Clearly argues constitutionalism *requires* a delegated enforcer and plausibly identifies the judiciary as fulfilling this role.
      *   *Botch (Lose 2-3 marks):* Vaguely acknowledges enforcement is needed but doesn't strongly argue its necessity or fails to specify the modern equivalent (courts).
  3.  **(b) Argues Courts are 'Crew' (Active Agent), Not 'Rope' (Passive Tool) (4 marks):** Compellingly explains why judicial interpretation involves discretion/agency, making courts the active enforcers (crew), not the passive text (rope).
      *   *Botch (Lose 2-3 marks):* Treats courts as merely applying the clear text (rope) or conflates the court with the text itself; fails to grapple with judicial discretion.
  4.  **(c) Reconfigures Democratic Critique Around Crew's Legitimacy (4 marks):** Effectively shows how seeing courts as crew shifts the critique from "binding future" to "legitimacy of unelected enforcer's power/discretion." Engages with the co-authorship or discretion point.
      *   *Botch (Lose 2-3 marks):* Merely restates the standard "binds future majorities" critique without reconfiguring it based on points a & b, or discusses judicial legitimacy without linking it back to the crew analogy.
  5.  **Clarity, Structure, Use of Analogy (4 marks):** Logically organized, concise, writing flows. Ulysses analogy is used precisely as an analytical tool, not just decoration.
      *   *Botch (Lose 1-2 marks):* Disorganized, waffly, or uses the analogy superficially/incorrectly.

  **Grading Thresholds:**

  *   **A (17-20):** Hits all 5 moves strongly. Thesis is sharp and focused on delegation. (a) & (b) are convincingly argued. (c) offers a sophisticated reconfiguration of the critique, likely touching on co-authorship/ongoing discretion. Writing is excellent. *Why not A?* Minor weakness in one area (e.g., slightly less depth on (c)).
  *   **B (13-16):** Hits the core moves but with less depth or minor flaws. Thesis mentions delegation but might be less forceful. (a) & (b) are adequately covered but lack full nuance (e.g., might underplay discretion in (b)). (c) reconfigures the critique but perhaps less insightfully or misses the co-authorship implication. Structure is good. *Why B not A?* Lacks the sophisticated insight/depth in (c) or slightly weaker argumentation in (a)/(b). *Why not C?* Still addresses all parts of the question satisfactorily and understands the crew/rope distinction.
  *   **C (9-12):** Addresses the question parts but superficially or with significant weaknesses. Thesis might be weak/muddled. (a) Might downplay the *necessity* of a crew. (b) Likely confuses courts with rope or weakly asserts agency. (c) Fails to substantially reconfigure the critique, just adds the crew as an afterthought. Structure may be poor. *Why not B?* Misses the core implication of delegation/enforcement or botches the crew/rope distinction significantly.
  *   **D (5-8):** Shows some relevant knowledge but fails to engage properly with the question's core demands. May ignore the crew aspect entirely, revert to simple self-binding, or fundamentally misunderstand the analogy. Poor structure.
  *   **F (0-4):** Little to no relevant engagement with the prompt or analogy. Off-topic or incoherent.
