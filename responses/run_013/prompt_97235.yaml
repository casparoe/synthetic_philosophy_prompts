prompt: |-
  Before I commit to any account of supererogation, I want the specification: what must a theory of acts beyond the call of duty be able to do? Give me the desiderata rather than a defense of any one account. They should cover the cases the theory has to classify correctly, the distinctions it cannot collapse, and the background commitments it must be consistent with. Build the list around these pressure points, explaining what each forces: (1) an act that exceeds what morality requires but is performed from a motive that seems to undercut praise, so the theory must separate the act's status from the agent's praiseworthiness; (2) a group that together does more than any member was required to do, though no individual member exceeds her own duty, so the theory must say whether supererogation can be collective; (3) an act that is beyond duty only because the agent's circumstances make the dutiful alternative unusually costly, so the same act would be merely obligatory for someone differently placed; and (4) an act the agent believes is required but that, given the facts, exceeds duty, so the theory must handle the relation between objective and subjective obligation. Then say which requirements are non-negotiable and which are optional commitments of particular camps, and identify any pair that cannot be jointly satisfied. Finally, briefly score the main families of view—the saint-and-hero model, the division of actions into forbidden, obligatory, and permissible, and the skeptical claim that the category is incoherent—against the list. Keep the weight on the criteria and their motivating cases. Separate what is settled from what is genuinely contested among people who work on this, and do not present a contested view as consensus.
reasoning: |-
  Okay, let me tackle this user's query systematically. They want a clear specification of desiderata for any theory of supererogation, centered around four pressure points with concrete cases. 

  First, I need to unpack each pressure point carefully. For (1), the key is decoupling act status from agent praiseworthiness - exemplified by someone performing a heroic act for selfish reasons. This shows the theory must separate the objective "beyond duty" quality from subjective motives. 

  Moving to (2), the collective action case where no individual exceeds duty but the group does. This forces consideration of whether supererogation can apply to collective entities or only individuals. The ambulance fundraiser example is perfect here. 

  For (3), the contextual relativity point is crucial. The same act (like donating a kidney) could be supererogatory for one person but obligatory for another in different circumstances. Any theory must accommodate this situational variability without making duties arbitrary. 

  The fourth point (4) about mistaken belief adds epistemic complexity. When an agent thinks they're doing their duty but objectively exceed it, the theory needs to handle both objective act status and subjective intention. 

  Beyond these core cases, I should note other common desiderata: avoiding moral rigorism, accommodating ordinary praise practices, and fitting with ethical theories like deontology or utilitarianism. Important to flag that some requirements are contested - like collective supererogation being possible. 

  When evaluating existing theories, I'll need to show how each handles these pressure points neutrally. The saint-and-hero model struggles with motivation/praiseworthiness separation, while tripartite models vary on relativity and collectivity. Skeptical views outright reject some desiderata. 

  Throughout, I'll maintain strict neutrality - presenting conflicts (like collective supererogation vs non-aggregation) as genuine debates without taking sides. The focus stays on how well theories satisfy the desiderata derived from concrete cases.
answer: |-
  Here are the core desiderata for any theory of supererogation, built from the pressure points you identified, plus essential background commitments. These specify what the theory *must* do (non-negotiable) and what it *should* do if it aims for broad adequacy (often contested).

  ### Core Desiderata & Motivating Cases

  1.  **Decoupling Act Status from Agent Praiseworthiness (Non-Negotiable):**
      *   **What it must do:** Distinguish the *objective moral status of the act itself* (supererogatory) from the *moral evaluation of the agent* performing it (which may be praiseworthy, blameworthy, or neutral).
      *   **Motivating Case (Pressure Point 1):** A soldier throws themself on a grenade solely to gain posthumous glory for their family name. *The act* is clearly beyond the call of duty (saving multiple lives at the cost of one's own). However, the *agent's motive* seems selfish and potentially undercuts full moral praise. The theory must classify the *act* as supererogatory while allowing that the *agent* might not be praiseworthy (or is less praiseworthy than if motivated by altruism).
      *   **What it forces:** The theory cannot define supererogation *solely* in terms of praiseworthiness. Act status must be prior to or independent of the agent's subjective motives for that specific act.

  2.  **Accommodating Contextual Relativity (Non-Negotiable):**
      *   **What it must do:** Acknowledge that whether an act is supererogatory or obligatory depends crucially on the agent's specific circumstances, capacities, and costs.
      *   **Motivating Case (Pressure Point 3):** Donating a kidney to a stranger is typically supererogatory. However, for the world's only compatible tissue-matched surgeon stranded with a dying patient needing an immediate transplant under primitive conditions, donating their own kidney might be the *only* way to save the life and thus *obligatory*. The same physical act has different statuses based on circumstance. The theory must classify both correctly.
      *   **What it forces:** The theory cannot rely on rigid, context-independent lists of supererogatory acts. Duty and supererogation must be sensitive to agent-relative factors (costs, abilities, relationships, alternatives).

  3.  **Handling Epistemic Divergence (Objective vs. Subjective Obligation) (Non-Negotiable):**
      *   **What it must do:** Provide an account of how the objective moral status of an act (supererogatory) relates to the agent's *beliefs* about what is required (which might be mistaken).
      *   **Motivating Case (Pressure Point 4):** A passerby sees smoke pouring from a building. Believing (mistakenly) that someone *must* be trapped inside, they rush in at great personal risk to rescue them, suffering severe burns. Objectively, there was no one inside; the risk was taken unnecessarily and thus the act *exceeded* what duty required (checking for occupants from safety/calling fire brigade). Subjectively, the agent believed they were fulfilling a duty of rescue. The theory must classify the *act* as supererogatory (objectively beyond duty) while explaining the agent's blamelessness or even subjective praiseworthiness.
      *   **What it forces:** The theory needs distinct (though related) accounts of objective duty/supererogation and subjective duty. It must explain how an act can be objectively supererogatory even when subjectively intended as obligatory.

  4.  **Allowing for Collective Supererogation (Contested, but Highly Desirable):**
      *   **What it should do (if possible):** Explain how a *group* can perform a supererogatory act even if no single individual member exceeded their own individual duty.
      *   **Motivating Case (Pressure Point 2):** A community needs a new ambulance. Each resident is asked to donate $100 (a reasonable request, perhaps obligatory for many). Some donate $100 (dutiful). A large number donate $150-$200 (supererogatory individually). The *total* sum raised far exceeds the ambulance cost, allowing for extra medical equipment. The group's *collective action* (raising the surplus) seems supererogatory, yet no single individual who donated only $150 necessarily exceeded *their own* duty (which might plausibly only require $100). The theory should ideally classify the collective outcome as supererogatory.
      *   **What it forces:** The theory must either reject the possibility of irreducibly collective supererogation (arguing the surplus is just the sum of individual supererogations) *or* provide an account of group agency/morality that allows for supererogatory acts attributable to the group itself, distinct from the sum of individual acts. This challenges strict individualistic moral frameworks.

  ### Essential Background Commitments (Non-Negotiable Foundations)

  5.  **Avoid Moral Rigorism:** The theory must *not* collapse all morally good actions into duties. There must be a conceptual space for actions that are morally good (even excellent) but not required. (Motivation: Without this, morality becomes impossibly demanding; the very concept of supererogation vanishes.)
  6.  **Accommodate Ordinary Moral Praise Practices:** The theory should be consistent with (or explain away) the widespread intuition and practice of praising agents for actions perceived as going "above and beyond" duty. (Motivation: A theory that renders common praise practices incoherent faces a significant burden.)
  7.  **Consistency with Underlying Ethical Theory:** The account of supererogation must be coherent within the broader normative framework it inhabits (e.g., deontology, consequentialism, virtue ethics). (Motivation: Internal consistency is a basic requirement.)

  ### Classification of Requirements

  *   **Non-Negotiable (Foundational for the Concept):** 1 (Decoupling), 2 (Relativity), 3 (Epistemic Divergence), 5 (Avoid Rigorism), 7 (Consistency). A theory failing these arguably fails to capture supererogation or morality itself coherently.
  *   **Contested/Optional Commitments (Define Specific Camps):**
      *   4 (Collective Supererogation): Individualists reject it; collectivists (or non-aggregationists) embrace it.
      *   6 (Praise Practices): Most theories accept it, but *how* they explain praise (e.g., based on act-status, character, effort, or motive) varies significantly and is a major point of contention. Skeptics might deny genuine praiseworthiness exists for supererogation.

  ### Potential Conflicts

  *   **Collective Supererogation (4) vs. Strong Individualism:** Theories that ground all moral status exclusively in individual actions and agency (common in some deontological and consequentialist views) struggle to accommodate irreducible collective supererogation without modification. Satisfying (4) often requires relaxing strict individualism.
  *   **Decoupling (1) vs. Motive-Centric Views:** Theories defining supererogation *primarily* by the presence of a special virtuous motive (some virtue-ethical views) risk collapsing the act's status *into* the agent's praiseworthiness, violating (1). Reconciling them requires careful formulation.

  ### Scoring Major Families of Views

  1.  **Saint-and-Hero Model (Urmson/Chisholm - Tripartite +):**
      *   **Structure:** Forbidden (Duty not to) / Obligatory (Duty to) / Permissible (No duty either way) / **Saints (Good but not req'd) / Heroes (Very Good but not req'd)**.
      *   **Score:**
          *   (+) Clearly avoids rigorism (5).
          *   (+) Accommodates praise practices (6) intuitively.
          *   (-/+) Handles relativity (2) depending on how "duty" is defined (often context-sensitive).
          *   (-) Struggles with Decoupling (1): Saints/Heroes are defined *as* praiseworthy figures, making it hard to separate act status from agent evaluation.
          *   (-) Poor on Epistemic Divergence (3): The model focuses on objective status/praiseworthiness; subjective belief is not central.
          *   (?) Silent/Unclear on Collective (4).

  2.  **Standard Tripartite Deontology (Forbidden, Obligatory, Permissible):**
      *   **Structure:** Locates supererogation within the *Permissible* category: actions that are *optional* but *good* to do.
      *   **Score:**
          *   (+) Avoids rigorism (5) by definition.
          *   (+) Handles Decoupling (1) well: Act status (permissible+) is distinct from motive/praiseworthiness.
          *   (+) Good on Relativity (2): Duty/Obligation is typically understood as context-sensitive.
          *   (+) Can handle Epistemic Divergence (3): Distinguishes objective permissibility from subjective belief about duty.
          *   (-) Can struggle to explain the *special force/praise* of supererogation (6) – why isn't it just "nice"? Needs an added account of value/effort/cost.
          *   (?) Varies on Collective (4): Depends on the account of collective obligation/permissibility.

  3.  **Skeptical View (Supererogation Incoherent - e.g., some Utilitarians, Rigorists):**
      *   **Structure:** Denies the category exists. All good actions are obligatory (Act Util) OR all permissible actions are morally neutral (no special praise) OR collapses supererogation into imperfect duties.
      *   **Score:**
          *   (-) Fails Avoid Rigorism (5) / Defines it away.
          *   (-) Struggles with Praise Practices (6) - must explain away widespread intuitions.
          *   (-) Fails core desiderata 1, 2, 4 by denying the phenomenon they aim to describe.
          *   (+) May be consistent internally (7), depending on the base theory.
          *   Relativity (2) & Epistemic (3) may be handled within their base account of duty, but supererogation *as such* is rejected.

  ### What is Settled vs. Contested

  *   **Settled (Near Consensus):**
      *   Supererogation requires avoiding rigorism (5) and maintaining a distinct space beyond duty.
      *   Theories must handle contextual relativity (2) and epistemic divergence (objective vs. subjective) (3).
      *   Act status must be separable from agent praiseworthiness for that act (1).
      *   The concept must cohere with the underlying normative theory (7).
  *   **Genuinely Contested:**
      *   **Collectivity (4):** Is irreducible collective supererogation possible?
      *   **Grounding of Praise (6):** *Why* are supererogatory acts praiseworthy? Motive? Effort/Cost? Value of the outcome? Character displayed? (This deeply divides camps).
      *   **The Nature of the "Call":** What *makes* an act beyond duty? Sacrifice? Optionality? Lack of enforceability? Special value? (Linked to base theory).
      *   **Relationship to Imperfect Duties:** Is supererogation distinct from, or a subset of, imperfect duties? (Major debate in Kantian scholarship).
      *   **Existence:** Skeptics (3) remain a significant minority camp.

  This framework provides the essential pressure points and commitments any viable theory of supererogation must address, highlighting both the settled ground and the central battlegrounds of the debate.
