  1. Translation is binary (faithful or not). Address this early when introducing the budget metaphor. 
  2. Form is just decoration. Contrast form vs. meaning during the group activity. 
  3. Word-for-word is best. Use the back-translation to show how literal translations lose the poetic elements. 
