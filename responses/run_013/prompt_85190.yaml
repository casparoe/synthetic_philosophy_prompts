  Activity flow: Translate to Spanish in pairs (10 mins), then swap and back-translate to English (5 mins). Sharing back-translations will highlight losses. Dependencies: Without initial examples, they might not understand the constraints. Without the budget framework, they might not see why trade-offs happen.

  End with a quick assessment: Ask them to write a 1-2 sentence "budget receipt" for their translation, specifying where they spent points. This shows understanding of trade-offs.

  What to avoid: Deep theory, history, or reading lists. Keep it practical. If questions arise, acknowledge them but steer back to the activity. For example, if someone mentions free verse, agree it's valid but today's focus is formal constraints.

