answer: |-
  Here’s a battle-tested 40-minute workshop plan designed for high schoolers, prioritizing hands-on work and minimizing theory. The sequence is critical—missteps break the activity.

  **Order of Operations & Why Sequence Matters:**  
  *(40 min total: Intro 10 min, Activity 20 min, Reflection 10 min)*  

  1. **Hook: "Bad Translation" Demo (3 min)**  
     *Why first?* Immediately shows the problem. Read the snow poem aloud. Then read a clunky *literal* Spanish gloss (e.g., *"Cuando nieve vino abajo en martes noche, escondió los caminos y campos..."*). Ask: *"Is this the same poem? What feels broken?"* They’ll say rhythm, rhyme, awkwardness. **Preempts misconception:** That word-for-word = "accurate."  

  2. **Frame the "Budget" (2 min)**  
     *Why now?* They’ve seen a failure; now give them the tool. Sketch a pie chart: "100 pts for SOUND (rhyme/music), SENSE (meaning), SHAPE (meter/line breaks). You CAN’T buy all 3. Today we’re spending heavy on SHAPE & SOUND." **Preempts misconception:** That translation is one "faithful/not faithful" dial.  

  3. **Constraints Demo w/ Your Poem (5 min)**  
     *Why before they write?* Model the struggle. Project your poem.  
     - **Show syllable counting:** "8 syllables/line: *Wed-ding-gown* (3) vs *bo-da* (2 syllables in Spanish). Uh-oh."  
     - **Show rhyme sacrifice:** "‘Night/sight’ rhyme? *Noche/vista*? Nope. Maybe *noche/hoja* (leaf) changes meaning?"  
     **Preempts misconception:** That form is "decoration." Show it’s structural.  

  4. **Activity: Translate in Pairs (10 min)**  
     Task: Translate the snow poem into Spanish **keeping 8 syllables & AABB rhyme.** Meaning can bend *slightly*.  
     *Why pairs?* Lowers anxiety, combines Spanish skills. Circulate! Nudge: *"Can ‘wedding gown’ become ‘white dress’? Can ‘Tuesday’ become ‘last night’ if it fits?"*  

  5. **Back-Translation Swap (5 min)**  
     Pairs swap Spanish translations. Each pair translates the SPANISH version back to ENGLISH **without seeing the original.**  
     *Why swap?* Prevents them from "correcting" towards memory. Forces them to work from the translation’s choices.  

  6. **Share & Compare (5 min)**  
     Volunteers read: 1) Original, 2) Their Spanish, 3) The *back-translated* English. Ask:  
     - *"Where did the meaning shift? Why?"*  
     - *"What did the Spanish version sacrifice to keep rhyme/syllables?"*  
     Highlight hilarious/insightful losses (e.g., "Tuesday" → "Winter," "wedding gown" → "white ghost").  

  7. **Reflection: "The Budget Receipt" (5 min)**  
     *Why last?* They’ve lived the struggle; now abstract. Ask:  
     *"Look at your Spanish version. If you spent 100 points: What got 40? What got 30? What got sacrificed?"*  
     **Preempts misconception:** That free verse is "obviously better." AGREE that rhyme is hard! *"Sometimes breaking form is right. But today’s constraint showed us what form actually DOES in a poem."*  

  **Why YOUR POEM Works:**  
  - **Short & Clear:** 4 lines = manageable.  
  - **Strong Image:** "Wedding gown" is vivid (even if it shifts).  
  - **Tight Form:** 8 syllables & AABB is strict enough to force trade-offs.  
  - **Avoids:** Cultural refs, complex syntax, ambiguous metaphors.  
  *Don’t replace it. It’s perfect for this.*

  **What to DELIBERATELY NOT GET INTO (And How to Say It):**  
  - **Literal vs. Free Debate:** *"Today’s experiment is about form constraints. Other days, we’ll wrestle with free verse!"*  
  - **Theory/History:** *"Translators argue about this stuff for centuries! We did 40 minutes of what they do."*  
  - **Perfect Translations:** *"No translation is ‘perfect’—we’re hunting for interesting failures today."*  

  **End with THIS Assessment (2 min):**  
  *"On a scrap paper: Write ONE thing your translation had to sacrifice to keep the form. Was it worth it?"*  
  **Why it works:** Concrete, based on their work, shows if they grasp trade-offs.  

  **Pro Tips for Your Room:**  
  - **Group Spanish Levels:** Pair stronger/weaker speakers.  
  - **Embrace Chaos:** Back-translations WILL be absurd. Laugh! *"Yours turned into a zombie poem? Amazing—show us!"*  
  - **Rhyme Hater?** Validate: *"You’re not wrong! Rhyme *can* wreck poems. But look what Juan did—he made ‘town’ rhyme with ‘moon’ and it got eerie! Constraints can surprise us."*  

  This sequence turns theory into felt experience. They’ll leave arguing about whether "wedding gown" should’ve become *vestido blanco* (white dress) or *fantasma* (ghost)—mission accomplished. You’ve got this!
