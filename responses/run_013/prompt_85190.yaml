prompt: |-
  Hi -- I'm a junior in high school and I run our poetry club (Thursdays after school, about a dozen kids, mostly freshmen and sophomores, a couple who actually write seriously, and honestly most of them have never read a poem in another language). Our faculty advisor is going to be out next week and she dumped the whole 40 minutes on me. I want to do the session on translating poetry -- specifically the part where you're trying to keep the *form* (the rhyme, the meter, the line breaks) and it keeps fighting with the meaning, so you end up having to give something up. I wrote a little poem for us to use as the guinea pig:

  When snow came down on Tuesday night
  it hid the roads and fields from sight,
  and by the morning all the town
  had turned into a wedding gown.

  That's AABB and eight syllables a line, if I counted right. My plan is to have everyone translate it into Spanish (we're all taking Spanish, some better than others) while keeping the rhyme scheme and the syllable count, then translate each other's Spanish back into English without looking at the original, and compare what got lost on the round trip. Our advisor has this thing she says -- that a translation is a budget, you get a hundred points to spend across sound, sense and shape and you can't buy all three -- and I want to use that but I'm not sure it's not just going to confuse everyone.

  What I actually need from you is a teaching plan, not an explanation of translation theory. You're a poet-translator who runs workshops, so think carefully about how this lands in a room of fifteen-year-olds, and brainstorm the dependencies first before you write anything down. Give me: the order the ideas have to come in and why each one has to come before the next (what breaks if I do it out of order); the one example that should carry the whole session -- if that's not my snow poem, tell me why not and what should replace it, and either way say what that example has to have and has to not have in order to do the job; and the misconceptions you'd expect these kids to walk in with or form along the way, plus exactly where in the sequence I should head each one off. I'm already worried about three: that a translation is either faithful or not, like there's one dial; that the form is just decoration and the meaning is the real content; and that a word-for-word gloss with footnotes is the accurate one. Also somebody will definately say that rhyming always wrecks the poem so free verse is obviously better -- tell me whether to let that fight happen and where. Then give me one question or two-minute thing I can do at the end that would actually show me whether they got it versus just nodding, and tell me what to deliberately not get into (I only have 40 minutes) and how to say that without it sounding like I'm hiding something. Answer in American English please, and dont give me a reading list -- I cant look anything up in class anyway.
