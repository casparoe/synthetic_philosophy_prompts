prompt: |-
  Ok so I run a small internal prediction market at work — the kind where people get play money (and a bit of real bonus) for trading on questions like "will we ship the Q3 release before Oct 1" or "will the city council approve the rezoning." There's maybe 15 to 40 of us. Lately leadership has started actually using the prices to make real calls, which terrifies me, because half the time the "price" is just three people who think they know something trading with each other.

  I want a procedure I can run, question by question, to decide whether a given market price is (a) worth acting on, (b) worth spending money to sharpen up — commission a bit of research, or pay someone to trade against it — or (c) just noise we should ignore. Ground it in what the econ and philosophy-of-markets stuff actually says about when a price carries information and when it doesn't.

  In particular I keep bumping into the no-trade idea: if everyone's rational, the only reason to trade is private info, and it's common knowledge that the market clears, then nobody trades — so any trade you actually observe has to be coming from somewhere else (noise traders, people who just disagree, liquidity needs, different risk tolerance). And the flip side of that: if the price already reflects everything, nobody bothers to dig up new info, so it can't reflect everything. I want the procedure to take both of those seriously instead of just chanting "wisdom of crowds."

  Make it ordered questions, say what a sufficient answer looks like at each step, where the procedure stops with a "don't act on this," and where it hands off to a human because it's really a values call (like how much we care about being wrong in each direction). Then run it on three of my actual questions: (1) "will the FDA approve drug X by its PDUFA date" — thin market, a couple people with friends in the industry; (2) "will we hit our own shipping date" — everyone trading is an employee staring at the same internal dashboards; (3) "who wins the mayoral race" — lots of traders, most with no real info. At least one of the three should come out in a way I wont like. And be honest at the end about what the procedure cant do.

  Please dont turn this into a reading list — I don't need cites, I need something I can paste into a doc and hand to my team.
reasoning: |-
  We are designing a procedure to evaluate the reliability of a prediction market price for decision-making. The procedure should consider the no-trade theorem and the efficient market hypothesis, and it should help decide whether to act on the price, invest in sharpening the signal, or ignore it.

  The procedure will consist of ordered questions. At each step, we either proceed or stop with a conclusion. We also note where a human judgment call is needed.

  **Procedure: Evaluating a Prediction Market Price**

  1. **Is there a market? (Trading Volume and Liquidity)**
     - Check if there has been at least a minimal amount of trading (e.g., total volume in the market, number of trades, number of active traders).
     - *Sufficient answer*: If there has been very little trading (e.g., only a handful of trades, very few traders, or low volume), then the price is likely noise. Stop and conclude: **(c) ignore (noise)**.
     - If trading is active, proceed.

  2. **Are there diverse, independent sources of information?**
     - Consider whether the traders have access to different kinds of information. If all traders are looking at the same public data (e.g., internal dashboards) or if the market is dominated by a small group with similar information, then the price may not aggregate diverse signals.
     - *Sufficient answer*: If the traders lack diversity (e.g., all are from the same team, same access) then the price may be biased or incomplete. Proceed to step 3 to check for disagreement. If there is diversity, proceed to step 4.

  3. **Is there evidence of disagreement among traders?**
     - Look for sustained trading activity (not just initial setup). If there is ongoing trading, it suggests that traders disagree (due to private information, different interpretations, or noise). But note: according to the no-trade theorem, if everyone is rational and it's common knowledge that the market clears, trade shouldn't happen. So observed trade must come from noise or differences in beliefs that are not common knowledge.
     - *Sufficient answer*: If there is little to no ongoing trading, then the market may have converged without incorporating diverse private information (or there isn't any). The price might be stale or based on public information only. Stop: **(c) ignore** or at best **(b) consider investing to add diversity (e.g., by inviting more traders with different perspectives)**. If there is ongoing trading, then proceed to step 4.

  4. **Is the market efficient? (Price Sensitivity to New Information)**
     - Check if the price moves in response to new, relevant information. If the market doesn't react to news that should change the probability, then it might be inefficient.
     - *Sufficient answer*: If the price is not updating with new information, then the market is not aggregating information well. This could be due to lack of attention or lack of informed traders. Consider: **(b) invest in sharpening (e.g., commission research or incentivize experts to trade)**. If the price is updating, proceed to step 5.

  5. **What is the level of uncertainty? (Check the price level)**
     - Look at the current price. If the price is near 0 or 1 (e.g., below 0.1 or above 0.9), then the market is expressing high confidence. But we must question whether this confidence is warranted.
     - *Sufficient answer*: If the price is extreme (near 0 or 1) and the market is thin (from step 1) or lacks diversity (step 2), then the confidence might be unfounded. We need to check for potential biases (e.g., groupthink, insider cascades). Proceed to step 6. If the price is moderate (e.g., between 0.3 and 0.7) and the market is active and diverse, then proceed to step 7.

  6. **Is there a reason for the extreme price? (Rationale Check)**
     - Investigate if there is a clear, rational basis for the extreme price (e.g., a major event that resolves the uncertainty, or a consensus among experts). If not, the extreme price might be due to overconfidence, herding, or manipulation.
     - *Sufficient answer*: If there's no clear rationale, then the extreme price is suspicious. Stop: **(c) ignore** or **(b) invest in sharpening (e.g., by deliberately challenging the consensus with research or contrarian trades)**. If there is a rationale, then proceed to step 7.

  7. **Cost of Error Analysis (Human Judgment Call)**
     - Consider the consequences of acting on the market price if it is wrong. How bad is a false positive? How bad is a false negative?
     - *Sufficient answer*: 
       - If the cost of being wrong in either direction is high, then even a reliable market might warrant further investment to reduce uncertainty. Consider **(b) invest in sharpening**.
       - If the cost of error is asymmetric (e.g., one type of error is much worse), then we might set a higher threshold for acting. For example, if the market says "90% chance of success" but a failure would be catastrophic, we might not act until we see 99%. This is a judgment call.
       - If the market is deemed reliable (from previous steps) and the cost of error is acceptable or symmetric, then we can **(a) act on the price**.

  **Summary of Outcomes:**
  - **(a) Act on the price**: The market is active, diverse, efficient, and the price is well-supported. The cost of error is acceptable.
  - **(b) Invest in sharpening**: The market has potential but lacks one or more factors (e.g., diversity, efficiency). We can improve it by adding traders, incentivizing research, or trading against the price to test it.
  - **(c) Ignore as noise**: The market is too thin, lacks diversity, or shows signs of inefficiency without a clear path to improvement. The price is not a reliable signal.

  Now, we apply this procedure to the three examples:

  ---

  **Example 1: "Will the FDA approve drug X by its PDUFA date?"**
  - Thin market, a couple of people with friends in the industry.
  1. **Market?** Thin market (low volume, few traders). *Stop?* Not yet, because there is some trading. We proceed but note the thinness.
  2. **Diverse information?** Some diversity (industry friends might have private info), but very limited. Proceed to step 3.
  3. **Disagreement?** Likely some trading between the informed and uninformed? But with only a few trades, it might be sparse. Let's assume there is some ongoing trading. Proceed to step 4.
  4. **Efficient?** The price might react to FDA news, but with few traders, reactions might be slow or exaggerated. Given the thin market, we might not have enough data. Proceed to step 5.
  5. **Uncertainty?** The price might be extreme (e.g., if insiders are confident). Suppose the price is 0.85 (high confidence of approval). Then we go to step 6.
  6. **Rationale?** The rationale is the "friends in the industry" — but how reliable? Without knowing, we are skeptical. Also, the market is thin so the price might be driven by one or two optimists. *Conclusion*: We don't have a clear, broad-based rationale. **Stop: (c) ignore or (b) invest in sharpening**. We might choose (b): commission a bit of research or pay an expert to trade against the market to test the price.

  **Example 2: "Will we hit our own shipping date?"**
  - Everyone trading is an employee staring at the same internal dashboards.
  1. **Market?** There might be decent trading (15-40 employees). Proceed.
  2. **Diverse information?** No — everyone has the same dashboard. Proceed to step 3.
  3. **Disagreement?** If there is ongoing trading, it must be due to noise or different interpretations of the same data (which isn't private information). But note: the no-trade theorem says without private info, trade shouldn't occur. So the trading we see is likely from noise (e.g., some traders are more optimistic by nature) or liquidity needs. *Conclusion*: Without diverse private information, the price might not reflect anything beyond the public dashboard. **Stop: (c) ignore**. (Alternatively, if the dashboard is ambiguous and people interpret differently, then the market aggregates interpretations. But that's still public info. So we might be cautious.)

  **Example 3: "Who wins the mayoral race?"**
  - Lots of traders, most with no real info.
  1. **Market?** Active trading, high volume. Proceed.
  2. **Diverse information?** Many traders, but most have no real info. However, some might (e.g., political insiders, pollsters). There is potential diversity. Proceed to step 4 (skip step 3 because we have diversity? Actually, step 2 was passed because we have a large number, so we skip step 3? But note: step 3 is only if step 2 fails. We passed step 2 (diverse) so we go to step 4).
  3. *Actually, the procedure: step 2 if passed (diverse) we go to step 4. If not, we go to step 3. Here we passed step 2 (diverse) so step 4.*
  4. **Efficient?** The price should react to public news (polls, scandals). If it does, that's good. But note: if most traders are uninformed, the price might be driven by a few informed ones. However, the market can still be efficient if the informed traders move the price. Proceed to step 5.
  5. **Uncertainty?** Suppose the price for candidate A is 0.6. It's moderate. Then we go to step 7.
  6. *Step 5 leads to step 7 for moderate prices.*
  7. **Cost of Error?** This depends on how the company uses this information. If it's for planning (e.g., for a business that might be affected by the mayor), then we consider the cost of being wrong. If the cost is high, we might want to invest in sharpening (e.g., by hiring a political analyst) or set a higher threshold. But if the market is efficient and active, we might trust the price. *Conclusion*: We can **(a) act on the price** if the cost of error is acceptable, but if the stakes are high, we might do (b) to be safe.

  **One we won't like: Example 2.** The conclusion is to ignore the market because everyone has the same information. This might be unpopular because leadership is using these prices.

  **Limitations of the Procedure:**
  - It doesn't quantify the reliability (e.g., we don't have a statistical measure of how well the market has predicted in the past).
  - It relies on qualitative judgments at several steps (e.g., "diverse", "rationale").
  - It doesn't address structural market issues (e.g., market manipulation, which is rare in small internal markets but possible).
  - It doesn't account for the possibility that even with public information, the market might aggregate interpretations better than an individual.
  - The cost of error (step 7) is entirely a human judgment.

  **Final Note:** The procedure is a framework to structure thinking. It should be applied with common sense and adapted based on the organization's experience with past markets.
answer: |-
  Below is a step-by-step procedure to evaluate your prediction market prices, grounded in economic theory (including the no-trade theorem and efficient markets). It’s designed as a checklist for your team to apply question-by-question. **Stop at the first step where the answer suggests (a), (b), or (c).** Steps requiring human judgment are flagged.

  ### Procedure: Evaluating Prediction Market Reliability  
  **Input:** A specific market question and its current trading data (price, volume, number of traders, time since last trade).  
  **Output:** One of:  
  - **(a) Act on this price** (reliable signal).  
  - **(b) Invest in sharpening** (add research/traders to improve signal).  
  - **(c) Ignore as noise** (unreliable; don’t act or invest).  

  ---

  #### Step 1: Check for Minimum Trading Activity  
  *Why?* A price with no trading is just an anchor. The no-trade theorem implies that real trades require *some* trigger (e.g., private info, irrationality, or noise). Low activity suggests noise dominates.  
  - **Sufficient answer:** If **total trades < 10** OR **active traders < 5** OR **no trade in the past 72 hours**, stop: **→ (c) Ignore as noise**.  
  - *Else*, proceed to Step 2.  

  #### Step 2: Assess Trader Independence  
  *Why?* Prices aggregate information best when traders have diverse, uncorrelated signals. If everyone sees the same data, trades may reflect bias or herd behavior (violating the "diverse private info" assumption of efficient markets).  
  - **Sufficient answer:** If **>50% of traders share the same data source/role** (e.g., all engineers viewing the same dashboard), stop: **→ (b) Invest in sharpening** (add outsiders to break homogeneity).  
  - If traders have **independent sources/roles**, proceed to Step 3.  
  - *Human judgment needed?* Yes. Define "same data source" for your context (e.g., "access to identical dashboards" vs. "unique client interactions").  

  #### Step 3: Test if Price Reacts to New Information  
  *Why?* Efficient markets incorporate new info quickly. If the price ignores relevant events, it’s stale or irrational. The "no-trade" paradox reminds us that prices stabilize only when no one has new info (or won’t act on it).  
  - **Sufficient answer:** Over the past week, did the price **fail to shift ≥10%** after major news (e.g., FDA setback, missed milestone)? If yes, stop: **→ (c) Ignore as noise** (the market isn’t processing info).  
  - If it **reacted appropriately**, proceed to Step 4.  

  #### Step 4: Check Price Stability vs. Churn  
  *Why?* Rational traders stop trading when prices reflect consensus. Persistent churn suggests noise traders or disagreements not based on info (e.g., liquidity needs).  
  - **Sufficient answer:** If **>30% of daily volume comes from the same 2 traders** OR **price swings >15% daily without news**, stop: **→ (b) Invest in sharpening** (pay experts to trade or subsidize research).  
  - If trading is **stable/declining with modest volatility**, proceed to Step 5.  

  #### Step 5: Evaluate Price Confidence Level  
  *Why?* Extreme prices (near $0/$1) imply high confidence but may reflect overconfidence if unsupported (e.g., insider cascades). Moderate prices (near $0.50) suggest uncertainty.  
  - **Sufficient answer:**  
    - If **price is between $0.25-$0.75**, proceed to Step 6.  
    - If **price is <$0.10 or >$0.90**, stop: **→ (b) Invest in sharpening** (extreme prices risk groupthink—commission research to challenge consensus).  

  #### Step 6: Cost of Error Analysis (Human Judgment)  
  *Why?* Markets don’t weight errors. You must decide if the cost of a wrong prediction justifies acting.  
  - **Sufficient answer:**  
    - If a **false positive costs far more than a false negative** (e.g., betting on FDA approval and being wrong wastes $1M) OR vice versa, stop: **→ Human judgment required**. Define tolerance (e.g., "Only act if price >$0.95 for high-cost errors").  
    - If **errors are symmetric/tolerable**, stop: **→ (a) Act on this price**.  
  - *Human judgment needed?* Always. Teams must set cost-of-error thresholds upfront.  

  ---

  ### Applying the Procedure to Your Examples  
  **Key:** We’ll assume realistic trading data. "Stop" means we conclude at that step.

  #### (1) FDA Drug Approval (Thin Market)  
  - *Trading data:* 8 trades, 3 traders (industry friends), price $0.85, last trade 24h ago.  
  - **Step 1:** Trades ≥10? **No (8 trades)** → **→ (c) Ignore as noise**.  
  - *Why?* Volume too low; no-trade theorem suggests this is likely noise or a few overconfident insiders. Leadership should not act.  

  #### (2) Internal Shipping Date (Same Dashboard)  
  - *Trading data:* 50 trades, 20 traders (all engineers), price $0.30, reacts to dashboard updates.  
  - **Step 1:** Enough activity → Proceed.  
  - **Step 2:** >50% same data? **Yes** → **→ (b) Invest in sharpening**.  
  - *Why?* Everyone sees the same dashboard, so trades add no new info (violates diverse signals). Pay a contractor or customer to trade against the price to inject new perspectives.  
  - *You won’t like this:* It implies your internal consensus is uninformative. Acting on this price risks anchoring on biased pessimism/optimism.  

  #### (3) Mayoral Race (Lots of Traders, Low Info)  
  - *Trading data:* 100 trades, 35 traders, price $0.55, reacts to polls/scandals.  
  - **Step 1:** Enough activity → Proceed.  
  - **Step 2:** Independent sources? **Yes** (mix of news-junkies, locals, and a few politically connected) → Proceed.  
  - **Step 3:** Reacts to news? **Yes** → Proceed.  
  - **Step 4:** Churn? Low (stable price, diverse traders) → Proceed.  
  - **Step 5:** Confidence? $0.55 → Proceed.  
  - **Step 6:** Cost of error? **→ Human judgment**. If betting real money, asymmetric costs matter (e.g., backing the loser may damage reputation). Set thresholds (e.g., "Only bet if price >$0.65").  

  ---

  ### What This Procedure Can’t Do  
  1. **Quantify precision:** It won’t tell you "this price has a 90% chance of being right." Use historical accuracy data separately.  
  2. **Fix structural issues:** If your market lacks incentives (e.g., play money is ignored), prices will be noise regardless.  
  3. **Replace values:** Deciding "how much we care about errors" (Step 6) must be a team discussion.  
  4. **Detect manipulation:** Small markets can be gamed. Audit trades if prices seem erratic.  
  5. **Handle black swans:** Unprecedented events invalidate all prediction markets.  

  ---

  ### Final Recommendation to Your Team  
  **Paste this summary:**  
  > *To evaluate a market: (1) Check volume—if low, ignore. (2) If traders share data, pay to add outsiders. (3) If price ignores news, ignore. (4) If unstable, pay experts to trade. (5) If price extreme, challenge it. (6) For uncertain cases, weigh costs of being wrong. Example: FDA market (thin) → ignore; Shipping date (same data) → invest in outsiders; Mayoral race (active) → act if costs are symmetric.*  

  **For leadership:** Emphasize that markets work best when traders have *diverse, private info*. If everyone sees the same thing, the price is a poll, not a forecast. Use this filter before taking prices seriously.
