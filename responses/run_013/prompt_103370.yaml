  ### Application to New Games
  1. **Positive Pasadena** (payoff = \(+\$2^n/n\)):  
     - Probability-weighted payoff = \(+\frac{1}{n}\) per toss.  
     - Natural-order sum: \(\sum_{n=1}^{\infty} \frac{1}{n} = \infty\) (diverges like harmonic series).  
     - **TNOEV**: Truncate at \(n=15\) (since \(\epsilon \approx 3 \times 10^{-5} \implies n_{\text{max}} = 15\)).  
       - Expected value = \(\sum_{n=1}^{15} \frac{1}{n} \approx 3.38\).  
     - **Prediction**: You would pay up to \(\sim \$3.38\).  

  2. **Petersburg-Squared** (payoff = \(\$2^n/n^2\)):  
     - Probability-weighted payoff = \(+\frac{1}{n^2}\) per toss.  
     - Natural-order sum: \(\sum_{n=1}^{\infty} \frac{1}{n^2} = \frac{\pi^2}{6} \approx 1.65\).  
     - **TNOEV**: Absolutely convergent series, so no truncation needed.  
     - **Prediction**: You would pay up to \(\sim \$1.65\).

  ---

  ### Controversies and Limitations
  - **Where TNOEV fully accommodates your verdicts**:  
    It perfectly matches all your gut reactions:  
    - Petersburg (truncation),  
    - Pasadena (natural-order sum),  
    - Shifted Pasadena (strict dominance + natural-order sum),  
    - Negated Pasadena (natural-order sum).

  - **Controversies**:  
    - **Conditional convergence**: Your reliance on natural-order summation for Pasadena is intuitive but not universally accepted. Some decision theorists (e.g., Seidenfeld et al.) argue that conditionally convergent expectations are inherently ill-defined and sensitive to rearrangement. **This is not settled**—your approach is one defensible choice, but it conflicts with the "no unique expected value" view.  
    - **Truncation threshold**: The choice of \(\epsilon\) (or \(n_{\text{max}}\)) is ad hoc. You used \(n_{\text{max}} = 15\) for Petersburg, but others might set it differently (e.g., based on wealth or risk tolerance). This is a **genuine open problem** in bounded rationality.  
    - **Risk aversion**: TNOEV does not explicitly model risk aversion. Your linear treatment of Pasadena (paying exactly \(\$0.70\)) suggests risk neutrality for small-stakes games, but this may not hold universally.

  - **Limitations**:  
    - **Shifted Pasadena's divergence**: The series for Shifted Pasadena is \(\sum \left[ \frac{(-1)^{n+1}}{n} + \frac{1}{n} \right]\), which simplifies to \(\sum \frac{1}{n}\) for even \(n\) and oscillates for odd \(n\). TNOEV "works" here only because the natural-order sum converges to \(2\ln 2\). If we decomposed it into Pasadena + Positive Pasadena, the latter would diverge and require truncation—but you **did not do this intuitively**, so TNOEV prioritizes the joint natural-order sum.  
    - **Unbounded utility**: TNOEV does not require utility functions, but if you insist on a utility-based interpretation (e.g., \(u(\$x) = \ln x\)), it would conflict with your Petersburg verdict (e.g., \(\ln\)-utility gives CE \(\approx \$4\), not \(\$15\)).

  ---

  ### Conclusion
  Your gut judgments are best tracked by the **Truncated Natural-Order Expected Value (TNOEV)** principle:  
  - Sum conditionally convergent series in natural order.  
  - Truncate divergent series at a low-probability threshold (\(\epsilon \approx 3 \times 10^{-5}\)).  
  - Enforce strict dominance for Pareto-superior games.  

  This explains all your verdicts and predicts \(\sim \$3.38\) for Positive Pasadena and \(\sim \$1.65\) for Petersburg-Squared. The main open controversies are:  
  1. The legitimacy of natural-order summation for conditionally convergent series (not settled).  
  2. The arbitrariness of the truncation threshold (active research in behavioral economics).  

  If you want a utility-based alternative, **logarithmic expected utility** (\(u(\$x) = \ln x\)) explains Pasadena and Petersburg-Squared but **fails** for Petersburg (predicts \(\$4\), not \(\$15\)) and requires ad hoc probability truncation anyway. TNOEV is simpler and more faithful to your intuitions.
