prompt: |-
  ok so I just had a two-hour arguement with my friend Dan about Mencius and Xunzi and I came away feeling like he's got Xunzi wrong but I couldn't say exactly why, and now I'm second-guessing myself because he's usually pretty well read. He was walking me through it over beers and here's his version, as close as I can remember it:

  "These two are the big Confucian split on human nature. Mencius says we're innately good — we're born with the four sprouts, compassion, shame, respect, and a sense of right and wrong, so becoming virtuous is basically watering a seed that's already there. Xunzi says the exact opposite: human nature is evil, we're born selfish, greedy and lazy, and the only reason anyone's ever good is that the sage-kings invented ritual and social norms and forced us into shape against our grain. So Mencius is the optimist — education just brings out what's inside — and Xunzi is the pessimist — education is more like training a wild animal, artificial and fighting your nature. And since they flatly contradict each other, one of them has to be wrong. I think Xunzi's the cynical 'people are basically bad' guy, which is why his whole line leads straight to authoritarianism — his students ended up as Legalists, after all."

  I pushed back but mostly just said "I don't think that's quite it," which isn't an argument. Can you go through it claim by claim and tell me what someone who actually knows these texts would accept, what's a fair popularization, and what's just wrong? I've got a nagging feeling the "evil" bit and the "forced against our nature" bit are each doing something sneaky, and that the "one of them has to be wrong" move is too quick. And does his last claim — Xunzi's view leads to authoritarianism — actually follow from anything true in the summary, or is it just guilt by association? I'm not after a reading list or anything like that, just tell me where he's fair, where he's smuggling something in, and what a defender of each would say back. Also, if there's a reading on which the two of them aren't even really disagreeing about the same thing, I'd love to hear it, because that would definately explain why the whole arguement felt like ships passing in the night.
