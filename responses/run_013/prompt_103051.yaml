prompt: |-
  I teach a graduate seminar on causation and responsibility, and a student recently pressed me with an argument we reconstructed together and which I have not been able to answer to my satisfaction. She is a deflationist about causal selection — she thinks explanatory interests and norms of expectation have no business in the metaphysics of what causes what — and she offered the following, which I have tidied but, I believe, not weakened.

  (1) When we say the gardener caused the plant to die by failing to water it, we are treating an omission as a cause. (2) An omission is not an event; it is the absence of an event. (3) Whatever else a cause may be, it must at least be a difference-maker: had the candidate not obtained, the effect would not have occurred. (4) The gardener's failure to water is a difference-maker for the plant's death — had she watered, the plant would have lived. (5) So the gardener's failure to water caused the plant's death. (6) But the same test is passed by the neighbor who did not water the plant, by the owner who did not move it into the shade, by the weather that did not rain, and indeed by every one of the indefinitely many things that any agent or object failed to do which would have saved the plant. (7) Each of those absences is a difference-maker for the death, so each is a cause of it. (8) Hence the plant's death has indefinitely many causes, and no one of them is more a cause than the gardener's omission. (9) Generalizing, each of us is a cause of every famine, fire, and drowning we did not prevent, and the word cause stops marking anything at all. (10) A theory of causation that entails (8) and (9) is not a theory of causation but a reductio of one. (11) Therefore (1) is false: omissions are not causes, and the gardener did not cause the plant's death.

  I would rather keep (1) than (9), if I am forced to choose, but I want to know what I am paying. One colleague suggested that the gardener's omission is a cause because it departs from a norm while the neighbor's does not, and the student replied that this simply smuggles our explanatory interests back into the metaphysics — which is the very thing she denies — and I could not tell her why she was wrong. Tell me which step to give up, explain why that step looked so plausible in the first place, and then price the alternatives honestly: if I reject the step you name, what must I supply in its place, and does supplying it cost me (1) as well? I would like a committed answer — a definite verdict on the step and a defense of it — rather than a survey of positions that leaves the choice to me, and I would be grateful if you would say plainly where your own account is weakest. Please write in American English.
reasoning: |-
  Okay, let me tackle this philosophy problem step by step. The user teaches a graduate seminar on causation and responsibility, and their student presented a challenging argument against treating omissions as causes. The core issue is that accepting omissions as causes seems to lead to absurd conclusions where everyone is responsible for every tragedy they didn't prevent.

  First, I need to understand the argument's structure. The student claims that if we accept the gardener's failure to water as causing the plant's death (step 1), and if causes must be difference-makers (step 3), then every possible omission that could have prevented the death would equally count as a cause (steps 6-7). This leads to an explosion of causes (step 8) and absurd moral implications (step 9), which the student sees as a reductio ad absurdum (step 10).

  Hmm, the key tension here is between our intuitive judgment about the gardener's responsibility versus the logical conclusion that countless other omissions are equally causal. The user wants to preserve the intuition that the gardener caused the death (step 1) while avoiding the absurdity of universal causation (step 9).

  Looking at the steps, step 3 seems particularly vulnerable. The difference-making criterion is too broad when applied to omissions because it doesn't distinguish between relevant and irrelevant absences. But simply rejecting difference-making outright would be unwise - it's a useful tool for actual events. The problem arises when we apply it mechanically to omissions.

  I recall that in causal modeling frameworks like those used in computer science, we handle this by specifying a model with relevant variables and a contrast class. For the plant's death, we'd include variables like "gardener waters plant" and perhaps "rain falls," but not "neighbor waters plant" unless that's part of the expected scenario. This provides a principled way to limit which omissions count without appealing to norms.

  The user mentioned their colleague suggested norms as the solution, but the student objected that this smuggles in explanatory interests. The modeling approach avoids this by making the selection criteria explicit in the model setup - it's metaphysical in the sense that it's about what possibilities we consider relevant, not about our subjective interests.

  The cost is that we have to accept some context-relativity in causation. But this isn't necessarily anthropocentric - we could argue that causal relations in the world depend on naturally occurring patterns of dependence. For example, in ecology, certain absences matter more because they're part of stable causal pathways.

  The weakness in this approach is explaining why some variables get included while others don't. If we say "the gardener is paid to water plants," that sounds normative, but we might reframe it as describing actual social structures - the gardener's role creates a factual dependence that doesn't exist for the neighbor. This maintains a fact-based metaphysics while accounting for context.

  This preserves step 1 while blocking steps 6-9. The gardener's omission counts because it's part of the specified causal model, while the neighbor's doesn't because it's outside the model's scope. We avoid causal explosion by limiting which omissions we consider as potential difference-makers.
answer: |-
  Here’s my committed verdict: **Reject step (3)** as an incomplete account of causation when applied to omissions. While difference-making is *necessary* for causation, it’s not *sufficient*—especially for absences. Below, I’ll defend this, explain why (3) seems plausible, price the alternatives, and confess the weaknesses in my view.

  ### Why Step (3) Fails for Omissions
  1. **Difference-making is too broad for absences**:  
     Step (3) claims causation *requires* difference-making: "Had X not occurred, Y would not have occurred." This works for *events* (e.g., "Had the lightning not struck, the forest fire wouldn’t have happened"). But for *omissions*, it misfires:  
     - Yes, the gardener’s failure to water is a difference-maker for the plant’s death (step 4).  
     - But so is the neighbor’s failure, the lack of rain, and your failure to fly in from Tibet to water it (step 6).  
     Yet we intuitively reject most of these as "causes." Why? Because difference-making alone cannot distinguish *relevant* omissions from irrelevant ones—it conflates causation with *logical possibility*.  

  2. **The problem isn’t metaphysics—it’s scope**:  
     Your student is right that norms or interests *alone* won’t solve this (as your colleague suggested). But the solution isn’t to abandon metaphysics—it’s to recognize that causation requires a **structured context**. Omissions are only causal *relative to a set of expected or normal processes*. For example:  
     - The gardener’s job *factually establishes* watering as part of the plant’s maintenance routine.  
     - The neighbor’s inaction isn’t part of that routine—it’s outside the causal framework.  
     This isn’t about "norms" as moral judgments; it’s about *actual, objective dependencies in the world*. The gardener’s role creates a concrete, counterfactual-supporting relationship that the neighbor’s doesn’t.  

  ### Why Step (3) Looked Plausible
  - **It works perfectly for events**: If a rock shatters a window, the rock’s impact is a difference-maker, and we can isolate it from irrelevant factors (e.g., "Had the moon not been full, the window still would’ve shattered").  
  - **It’s grounded in science**: Difference-making (via interventions) is central to causal models in physics, medicine, and AI. But these models *always* specify a **contrast space** (e.g., "treatment vs. control group"). Omissions explode because we forget to define that space.  

  ### What You Pay to Keep (1)
  If you reject step (3)’s sufficiency for omissions, you must supply:  
  1. **A contrastive framework for causation**:  
     - Causes are difference-makers *relative to a baseline* (e.g., "The gardener caused death *relative to her watering duty*").  
     - This baseline isn’t "subjective"—it’s fixed by *objective facts*: social roles, biological needs, or physical systems (e.g., the plant *requires* water; the gardener *contracted* to provide it).  
     - **Cost**: You accept that causation has a *relational* element. But this isn’t anthropocentric—it mirrors how causation works in biology (e.g., "Oxygen absence caused death" presupposes an organism’s metabolic needs).  

  2. **A principled limit on relevant omissions**:  
     - Only omissions tied to **actual or expected processes** count. The neighbor’s failure isn’t a cause because nothing in the plant’s causal history *depended* on them.  
     - **Cost**: You must defend this limit as metaphysical, not normative. I argue it *is*—e.g., the gardener’s obligation stems from a *factual* agreement (like a contract), making her inaction a structural hole in the causal web.  

  3. **Preserving (1) and blocking (9)**:  
     - The gardener caused the death because her role made watering a *sustaining cause* of the plant’s life. Her omission broke this chain.  
     - You’re *not* a cause of every famine—unless you were *specifically tasked* with preventing it (e.g., a UN aid coordinator).  

  ### Where My Account Is Weakest
  - **The "baseline problem"**: How do we non-arbitrarily define the contrast space? I appeal to "objective dependencies" (e.g., the plant’s biology or the gardener’s job). But if pressed, I concede this edges into *dispositional facts* (e.g., "What the plant relied on"). This risks circularity if dispositions rely on causation.  
  - **Progress, not perfection**: This view avoids norms *for causal metaphysics* but needs them to explain *blame* (e.g., the gardener is *responsible* because she breached a duty—but her *causal role* is prior).  

  ### Final Defense
  Your student’s reductio (steps 6–10) is valid *if* difference-making is sufficient. But it isn’t—**omissions require a causal field** (a la Mackie). We don’t say "the absence of unicorns caused the plant’s death" because unicorns aren’t in the plant’s causal field. The gardener *is*—her role places her in the structure. Rejecting (3)’s sufficiency saves (1), avoids (9), and forces us to refine—not abandon—causal metaphysics. The price is accepting that causation is sometimes contrastive, but that’s a bill worth paying.
