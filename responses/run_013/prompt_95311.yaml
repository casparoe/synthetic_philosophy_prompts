answer: |-
  Here are the desiderata for any adequate theory of mathematical truth and objects, framed by your naturalist commitment and the demand to take mathematical practice at face value. Each requirement includes its motivating case.

  ### Core Desiderata
  1.  **Semantics**  
      *Requirement:* The theory must specify truth conditions for ordinary mathematical statements (e.g., "2 + 3 = 5," "There are infinitely many primes"), including quantified claims. It must clarify whether number-terms ("2," "π") refer to objects, and if so, what ontological status they have.  
      *Motivating Case:* A mathematician asserts "Every even number greater than 2 is the sum of two primes" (Goldbach's Conjecture). The theory must explain what this assertion means, what would make it true/false, and whether "even number" picks out a mind-independent feature of reality.

  2.  **Determinacy of Open Questions**  
      *Requirement:* The theory must justify or explain away the widespread mathematical intuition that unproven conjectures (e.g., Goldbach, Riemann Hypothesis) or statements independent of standard axioms (e.g., Continuum Hypothesis) have a determinate truth value.  
      *Motivating Case:* Mathematicians invest immense effort seeking proofs, presupposing a definite answer exists. A theory that renders such questions indeterminate or meaningless conflicts with this core practice.

  3.  **Reference and the Reduction Problem**  
      *Requirement:* The theory must resolve the problem of multiple, incompatible identifications of mathematical objects (e.g., natural numbers as von Neumann ordinals vs. Zermelo ordinals). It must explain what fixes reference to "the number 2" and avoids arbitrary stipulation.  
      *Motivating Case:* Set theory offers distinct set-theoretic models satisfying the Peano Axioms, differing on whether 2 = {∅, {∅}} or 2 = {{∅}}. Neither seems pre-theoretically "correct," challenging the idea that numbers *are* specific sets.

  4.  **Sameness of Content Across Foundations**  
      *Requirement:* The theory must account for the evident equivalence of theorems proved in different foundational frameworks (e.g., the Fundamental Theorem of Algebra proved in ZFC, ETCS, or Homotopy Type Theory). It must explain what preserves truth across translations.  
      *Motivating Case:* Mathematicians recognize "the same theorem" regardless of foundational system used. A theory treating these as fundamentally distinct truths fails to capture mathematical practice.

  5.  **Introduction of New Objects**  
      *Requirement:* The theory must provide criteria for legitimate object introduction (e.g., via definition, abstraction principle, or existential postulate) and handle cases of inconsistent introductions or eliminable posits.  
      *Motivating Case:* (1) Early calculus used inconsistent infinitesimals; later rigorized. Were past results true? (2) Imaginary numbers were initially suspect, now indispensable. (3) Ideal elements (points at infinity, inaccessible cardinals) simplify proofs but are later shown eliminable. Do they "exist"?

  6.  **Epistemology (Naturalistically Constrained)**  
      *Requirement:* The theory must explain how mathematicians reliably gain *knowledge* of mathematical truths, compatible with a naturalistic worldview (i.e., no appeal to non-natural faculties, causal interaction with abstracta, or supernatural intuition). It must clarify which epistemic demands (e.g., causal contact) are non-negotiable for naturalism vs. contested philosophical baggage.  
      *Motivating Case:* Mathematicians reliably converge on proofs. How is this possible if mathematical truths are about acausal, non-spatiotemporal entities? Naturalism (demanding causal or scientifically integrated epistemology) seems incompatible with standard platonism.

  7.  **Error and Disagreement**  
      *Requirement:* The theory must account for the nature of mathematical error (e.g., flawed proofs accepted for years) and genuine disagreements over legitimacy (e.g., use of Axiom of Choice, constructive vs. classical methods).  
      *Motivating Case:* (1) Kempe's flawed 1879 "proof" of the Four Color Theorem was accepted for a decade. Was the theorem false during that time? (2) Intuitionists reject proofs using Excluded Middle for infinite sets. Is this a factual disagreement or a change in meaning?

  8.  **Applicability**  
      *Requirement:* The theory must explain why the *same* mathematical structures/objects/propositions are indispensable for formulating and discovering truths about the physical world.  
      *Motivating Case:* The laws of physics (e.g., Schrödinger's equation, General Relativity) use sophisticated mathematics (complex numbers, differential geometry) that were often developed purely. Why does physical reality "obey" these abstract rules?

  ### Assessment of Requirements

  1.  **Non-Negotiables (Given Your Purpose):**
      *   **Semantics:** Essential for taking assertions at face value.
      *   **Epistemology (Naturalistic Constraint):** Core to your commitment to naturalism.
      *   **Applicability:** Crucial for mathematics being indispensable to empirical science, justifying its place in a naturalistic worldview.
      *   **Error and Disagreement:** Must be handled to account for actual mathematical practice.

  2.  **Camp Preferences:**
      *   **Determinacy:** Platonists typically insist on universal determinacy; fictionalists/nominalists often deny it for independent statements; some structuralists are agnostic.
      *   **Reference/Reduction:** Platonists must solve it; structuralists aim to dissolve it by rejecting objects in favor of structures; fictionalists may see it as a non-problem (no reference).
      *   **Sameness of Content:** Structuralists/category theorists emphasize this; strict reductionists (e.g., some set-theoretic foundationalists) might downplay it.
      *   **Introduction of New Objects:** Crucial for abstractionists (neo-Fregeans), structuralists introducing positions; less central for fictionalists or hardcore nominalists.

  3.  **Key Conflicts:**
      *   **Semantics + Face Value + Naturalistic Epistemology:** This is **Benacerraf's Dilemma**. Taking "There are infinitely many primes" at face value implies abstract objects exist. Naturalism demands a causal or scientifically integrated epistemology. Explaining knowledge of acausal abstracta without special faculties is the core challenge. *Conflict Forced By:* The apparent truth of mathematics + the causal theory of knowledge often assumed within naturalism.
      *   **Determinacy + Naturalism:** Insisting all statements (like CH) have determinate truth values may require positing a robust, mind-independent reality of mathematical objects, exacerbating epistemological problems under naturalism.
      *   **Reference + Sameness of Content:** Insisting numbers *are* specific objects (referential semantics) clashes with the multiple reductions and the invariance across foundations. Sameness of content pushes towards structuralism.

  4.  **Most Discriminating Requirement:**
      *   **Naturalistic Epistemology** is the single most exclusionary requirement. It immediately rules out standard **Platonism**, which posits non-natural cognitive access (intuition). It puts immense pressure on any theory positing mind-independent abstracta.

  ### How Major Theories Fare Against Key Constraints

  *   **Platonism:** Fails **Epistemology (Naturalism)** decisively. Struggles with **Reference/Reduction** (which sets *are* the numbers?) and often struggles with **Applicability** (why link abstract realm to physics?).
  *   **Structuralism (e.g., Shapiro, Resnik):** Addresses **Reference/Reduction** (numbers are positions in a structure, not specific sets) and **Sameness of Content** (invariance of structure is key). Still challenged by **Epistemology (Naturalism)** (how know structures?) and **Determinacy** for independent statements. Handles **Applicability** better if structures underlie physical reality.
  *   **Fictionalism (e.g., Field):** Satisfies **Naturalism** and **Epistemology** (by denying truth, knowledge is about consistent fiction). Fails **Semantics/Face Value** (mathematicians aren't just uttering useful falsehoods) and **Applicability** (why is fiction *indispensable* and uniquely effective for science?).

  ### Requirement: Account of Proof

  *   **Requirement:** The theory should provide (or be compatible with) an account of what constitutes a valid mathematical proof – the primary means of justification in mathematics. Is proof discovery of truth (realism) or demonstration of consistency/implication (anti-realism)?
  *   **Separability?** While separable in principle (one could have a theory of truth without a theory of justification), it is **highly relevant and practically inseparable**. An account of mathematical truth must mesh with how truth is established. For naturalism, explaining proof as a natural cognitive/social practice is crucial. Adding this requirement intensifies pressure on **Epistemology**.

  This framework equips you to rigorously evaluate theories against the tensions inherent in reconciling mathematical practice with a naturalistic worldview. The central battleground remains epistemology under naturalism.
