answer: |-
  ## GUIDANCE NOTE BPHS/24/07: ADJUDICATION OF NON-TRANSITIVE PREFERENCE MANIFESTATIONS IN THE NATIONAL HEALTH STATE RANKING (NHSR)

  **Issued by:** The Bureau for the Prioritisation of Health States (BPHS)
  **Date:** 17th October 2024
  **Status:** Interim Guidance (Pending Final Review by the Standing Committee on Ordinal Validity)
  **Replaces:** BPHS/19/03 (Amended)

  **1. Introduction**
  1.1. This Guidance Note addresses operational complexities arising from the application of the standard pairwise comparison methodology (PCM) for determining the National Health State Ranking (NHSR), as mandated under the Health Prioritisation Act 2015 (as amended).
  1.2. The PCM relies upon rigorously collected public preference data, wherein representative panels are presented with two hypothetical health states (A and B) and asked: "Which state would you rather endure?" The state selected by a majority is deemed 'preferable to' the other for the purposes of the NHSR.
  1.3. Recent data revisions pertaining to a specific cluster of states (designated Cluster Gamma) have revealed an inconsistency in the aggregated pairwise comparisons, resulting in a cyclical preference relation (State P > State Q > State R > State P, where '>' denotes 'preferable to').

  **2. Definitions**
  2.1. **Preferable to (>):** The relation holding between health state A and health state B if and only if a majority of respondents in a valid pairwise comparison select state A as the state they would rather endure.
  2.2. **Health State:** A defined constellation of symptoms, functional limitations, and experiential qualities, as per the BPHS Health State Lexicon (Edition 7).
  2.3. **Transitivity:** The property wherein if State A > State B and State B > State C, then State A > State C necessarily holds.
  2.4. **Completeness:** The property that for any two distinct health states A and B within the NHSR, either A > B or B > A holds.
  2.5. **Indistinguishability Margin (IM):** The theoretical threshold below which differences in disutility between two states are deemed imperceptible to the modal respondent.
  2.6. **Patient Choice Pathway (PCP):** A formalised process under Regulation 12 of the Health Prioritisation (Treatment Access) Regulations 2017, permitting patients, under specific conditions and with financial contribution, to access treatment for a lower-ranked condition before a higher-ranked one, contingent upon documented pairwise preference swaps.

  **3. The Gamma Cluster Manifestation & Internal Deliberations**
  3.1. Analysis of the Gamma Cluster data (States P, Q, R) confirms a cyclical preference: P > Q (62% preference for P), Q > R (58% preference for Q), R > P (55% preference for R).
  3.2. This manifestation follows the previously documented phenomenon of the 'Toothache-Agony Chain' (TAC), wherein sequential pairwise comparisons, each involving states differing only marginally (i.e., within the postulated IM), resulted in State T₁ (Persistent Mild Toothache, Disutility Score 5) being ranked above State Tₙ₀₀ (Unremitting Traumatic Agony, Disutility Score 500). The PCM, applied consistently, affirms State T₁ > State Tₙ₀₀.
  3.3. Internal Bureau analysis has identified several distinct interpretative positions regarding these manifestations:
      3.3.1. **The Non-Transitivity Faction:** Holds that the relation 'preferable to', as operationally defined by the PCM, demonstrably lacks transitivity. The Gamma Cycle is a valid empirical finding, and the TAC is the logically consistent outcome of applying a non-transitive relation over a continuum. Guidance should explicitly state the PCM relation is non-transitive, publish the current (non-linear) NHSR incorporating the Gamma Cycle and TAC outcome, and proceed with resource allocation based on the pairwise data alone. "Completeness is neither required nor empirically supported; our duty is to report the preferences, not to force them into an artificial linear order."
      3.3.2. **The Veridicalist Faction:** Argues that the PCM reliably captures the true ordinal ranking of health states. The public's intuitive rejection of T₁ > Tₙ₀₀ reflects cognitive bias ('squeamishness', 'scope neglect') or failure to grasp marginal disutility aggregation. The Gamma Cycle is an artefact of noisy data or flawed state descriptions, not a fundamental challenge. The Bureau must uphold the PCM's results as objectively correct, including T₁ > Tₙ₀₀, and refine data collection to eliminate cycles, preserving transitivity and completeness as axiomatic.
      3.3.3. **The Indeterminacy Faction:** Posits that for pairs of states differing by less than the IM, there is *no fact of the matter* regarding which is preferable. The PCM outputs for such pairs are statistical noise, not genuine preferences. The TAC arises from mistakenly treating these indeterminate comparisons as determinate. The Gamma Cycle likely involves states within each other's IM. The NHSR is incomplete; states within each other's IM should be declared 'on a par' and grouped into equivalence classes for rationing purposes. "The guidance isn't false; it's silent where silence is mandated by epistemic limits."
      3.3.4. **The Tetrachotomous Faction:** Proposes introducing a third primitive relation, 'neither preferable nor less preferable' (≈), alongside '>' and '<'. This relation would hold between states deemed incomparable or equally preferable. The Gamma Cycle and the problematic links in the TAC would be resolved by reclassifying some pairwise results as instances of ≈, breaking the chain/cycle. This requires a methodological overhaul to allow respondents to select a 'no preference' option with defined thresholds.
      3.3.5. **The Acyclicity Faction:** Maintains that the core function of the NHSR – guiding rationing decisions – requires a strict partial order *at minimum*, demanding acyclicity (no cycles) though not full transitivity or completeness. The Gamma Cycle is unacceptable and must be resolved algorithmically (e.g., ignoring the weakest pairwise link) or via data review. The TAC, while counterintuitive, is acyclical and therefore tolerable. "Cycles create operational chaos; chains, however long, do not."

  **4. Interim Position of the Bureau**
  4.1. Following extensive consultation, including the Standing Committee and the Bureau's Philosophical Adviser (see Annex A), the Bureau adopts the following interim measures concerning the Gamma Cluster and broader implications:
      4.1.1. **Gamma Cluster:** The cyclical manifestation (P > Q > R > P) is deemed operationally unstable. State R is temporarily reclassified to an equivalence class with State S (a state previously ranked between Q and P, against which no cycle manifests), based on proximity in symptom profiles and pending full methodological review. This resolves the immediate cycle. Pairwise data for P, Q, R, S will be recollected using revised descriptors.
      4.1.2. **Toothache-Agony Chain (TAC):** The Bureau affirms the validity of the PCM-derived ranking (T₁ > T₂ > ... > Tₙ₀₀). Public discomfort with this outcome is noted but deemed irrelevant to the *technical* accuracy of the pairwise aggregation. The disutility scores (5 to 500) provide adequate granularity for rationing algorithms. **The relation 'preferable to' as defined in 2.1 is confirmed to be transitive for the purposes of the current NHSR.**¹
      4.1.3. **Indistinguishability Margin (IM):** The concept of an IM is acknowledged as theoretically plausible. A working group (BPHS-WG-IM/01) is established to investigate operationalising a 'no preference' option or defining an IM threshold for future data collection, aligning with Factions 3.3.3 and 3.3.4. Until then, all pairwise comparisons are treated as determinate.
      4.1.4. **Completeness vs. Transitivity:** The Bureau clarifies that while the PCM aims for completeness (comparing all states), the *essential* property for a usable rationing instrument is **acyclicity**. Transitivity is highly desirable for constructing a linear order but is logically distinct from completeness. Abandoning transitivity (per Faction 3.3.1) would create chains but potentially permit cycles – the latter being unacceptable. Abandoning completeness would leave gaps in the ranking. The Bureau prioritises acyclicity over transitivity and transitivity over completeness. Current guidance maintains all three properties except in the resolved Gamma case (where completeness is preserved via equivalence classing).

  **5. Patient Choice Pathway (PCP) Implications**
  5.1. A hypothetical scenario illustrates the concern: A patient in State P utilises the PCP to swap to State Q (paying fee F1), then from Q to R (fee F2), then from R back to P (fee F3). The patient ends in the original state but financially diminished (outlay F1+F2+F3). The NHSR, reflecting the (now resolved) cycle, would have sanctioned each step (P>Q, Q>R, R>P).
  5.2. Bureau Assessment:
      5.2.1. This outcome is a documented, albeit rare, feature of the PCP framework when underlying pairwise preferences are non-transitive. The PCP operates solely on documented pairwise 'preferable to' relations between the patient's *current* state and the *target* state, not on the global NHSR order.
      5.2.2. The Bureau acknowledges the patient is financially worse off without a change in health state ranking. However, as the swaps were voluntary and compliant with Regulation 12, and as the underlying pairwise data was correctly recorded at the time of each swap, no specific redress is owed by the Bureau beyond standard PCP financial hardship review mechanisms. The patient purchased the *process* of state change, not a guaranteed net health benefit. The resolution of the Gamma cycle does not invalidate prior lawful PCP transactions.
      5.2.3. The Veridicalist Faction notes that if R truly was preferable to P for that patient at that time, the return to P represents a separate preference failure by the patient, not a model flaw.

  **6. Frequently Asked Questions**
  *   **Q1: Does the Bureau really think a mild toothache is better than agony?**
      *   **A1:** The Bureau's National Health State Ranking (NHSR) reflects the aggregation of public pairwise preferences collected under the statutory methodology. The data indicates State T₁ (Persistent Mild Toothache) is preferable to State Tₙ₀₀ (Unremitting Traumatic Agony) based on the chain of pairwise comparisons. Disutility scores provide further granularity. The ranking is a technical output, not a clinical assessment of pain severity.
  *   **Q2: How can State A be better than B, B better than C, and C better than A?**
      *   **A2:** Such cycles (e.g., the Gamma Cluster) are rare statistical artefacts or indicate flawed state definitions. The Bureau has procedures (Section 4.1.1) to identify and resolve these operationally unstable manifestations to maintain an acyclic ranking suitable for prioritisation. The underlying pairwise data points remain valid observations.
  *   **Q3: Can I get compensation if I used the Patient Choice Pathway and ended up worse off due to a cycle?**
      *   **A3:** The PCP operates on the pairwise relation between your specific starting and target state at the time of application, based on the latest NHSR data. Provided the swap was lawful under Regulation 12 and the pairwise data was correctly applied, compensation is not typically available solely due to subsequent ranking revisions or the inherent properties of pairwise aggregation. Financial hardship reviews may be applicable.
  *   **Q4: Is the ranking complete? Could two states be equally bad?**
      *   **A4:** The current methodology assumes completeness; for any two distinct states, a pairwise comparison determines which is preferable. Genuine equality or incomparability is not currently captured. A working group is exploring this (Section 4.1.3).

  **7. Action**
  7.1. All NHSR users must implement the temporary Gamma Cluster resolution (States R and S in equivalence class Gamma-1) immediately.
  7.2. The NHSR incorporating the Tₙ₀₀ position (below T₁) remains in force.
  7.3. Stakeholders are invited to submit evidence to BPHS-WG-IM/01 regarding the Indistinguishability Margin and 'no preference' options by 31/01/2025.

  **Professor Alban Thorne**
  **Director, Bureau for the Prioritisation of Health States**

  ---

  **ANNEX A: FOOTNOTE FROM THE BUREAU'S PHILOSOPHICAL ADVISER**
  ¹ "The discomfort elicited by the Toothache-Agony Chain arises from a persistent, pre-theoretical intuition that 'betterness' must track some cardinal measure of felt disutility. The Bureau's pairwise methodology, however, accesses a purer, *ordinal* preference relation grounded in actual human choice dispositions under controlled description. That this relation, when aggregated, yields a transitive chain from mild discomfort to profound agony is not a *reductio* of the method, but a profound revelation about the structure of rational preference itself under incremental variation. To deny transitivity here is to succumb to a comforting, but empirically unsupported, essentialism about suffering magnitudes. The public's 'squeamishness' is data about psychology, not about value ontology. The Bureau correctly prioritises the structural integrity of its revealed preference relation." – *Prof. Emeric Vance, BPHS Philosophical Adviser*
