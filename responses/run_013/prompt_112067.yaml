prompt: |-
  I am a philosophy professor preparing a graduate seminar on interpersonal utility comparisons, and I have been trying to formulate a principle that captures my considered judgments about when such comparisons are meaningful. A colleague and I have been arguing about this over lunch for weeks. I have a tentative view I call the anchored-comparability view: a comparison of two people’s welfare is meaningful just in case there is a shared anchor—some condition or outcome that both parties can independently locate as better or worse than their own—and the comparison does not require a common unit for welfare differences. I am not confident it survives the cases below.

  Here are my verdicts. (1) Comparing a person with mild but constant arthritis pain to a person with severe but intermittent migraines, I think it is meaningful to say the migraine sufferer is worse off overall. (2) Comparing a person blind from birth to a person deaf from birth, I think it is not meaningful to say one is worse off than the other. (3) Comparing a person with severe depression to a person with moderate chronic pain, where both agree that severe depression is worse than moderate chronic pain, I think it is meaningful to say the depressed person is worse off. (4) Comparing a rich person who loses $1,000 to a poor person who gains $1,000, I think it is meaningful to say the poor person’s gain is greater than the rich person’s loss, even though there is no common unit of welfare. (5) Comparing a human to a dog, I think it is not meaningful to say the human is better off overall, but it is meaningful to say the dog’s pain is worse than the human’s mild itch. (6) Comparing two people with different value systems—one who values achievement, one who values relationships—both of whom report equal life satisfaction, I think it is not meaningful to say one is better off. (7) Comparing a person with severe tinnitus to a person with moderate chronic pain, where both agree that severe tinnitus is worse than moderate chronic pain, I think it is not meaningful to say the tinnitus sufferer is worse off. (8) I think it is not meaningful to say that Alice is twice as well off as Bob, even if we can say she is better off.

  Is there a principle that gets all of these, or close? If no single principle works, give me the smallest set of candidates that together cover the cases, and say which case forces each. What does it say about cases I have not considered—for instance, comparing the welfare of a person with severe tinnitus to a person with severe chronic nausea, comparing a person’s welfare before and after a religious conversion, or comparing the welfare of two people with different disabilities? Which of my verdicts, if any, must I give up? If you propose a principle, state it precisely, give the case that motivates each clause, and be honest about which of my verdicts it cannot accommodate. I am especially interested in whether the principle should be formulated for levels, differences, or both, and whether it should posit a single scale or a set of dimension-specific scales.
reasoning: |-
  Hmm, I need to help a philosophy professor develop a principle for interpersonal utility comparisons that fits their specific judgments across various cases. They've proposed an "anchored-comparability" view but are uncertain if it works with all their verdicts. Let me analyze each case systematically.

  The professor has eight clear verdicts about when comparisons are meaningful or not. Case 1 allows comparing constant arthritis to intermittent migraines, while case 2 rejects comparing congenital blindness to deafness. Case 3 accepts comparing depression to chronic pain when both agree on the ranking, but case 7 rejects a similar tinnitus-pain comparison despite agreement. Case 4 allows gain/loss comparisons without common welfare units, case 5 permits pain comparisons across species but not overall welfare, case 6 rejects comparisons across value systems despite equal satisfaction, and case 8 rejects ratio comparisons while accepting ordinal ones.

  Looking at these patterns, anchored comparability alone seems insufficient - it explains cases 1, 3 and 4 but fails cases 2, 5, 6 and 7. Specifically, it can't explain why agreement makes comparisons valid in case 3 but not case 7, or why cross-species pain comparisons (case 5) work while overall welfare comparisons don't.

  I notice three distinct factors across the cases: shared anchors (cases 1,3,4), phenomenal comparability (cases 1,5), and evaluative symmetry (cases 6,7). This suggests a multi-principle approach. For phenomenal states like pain (cases 1,5), direct comparison seems possible through shared sensory experiences. For evaluative judgments (cases 3,6,7), agreement matters only when the experiences share qualitative dimensions. Case 4's money comparison works through observable opportunity costs rather than internal states.

  Case 7 is particularly tricky - the professor rejects comparison despite agreement, likely because tinnitus and pain feel qualitatively different. This points to a need for similarity in the phenomenal character of experiences being compared. Case 2's sense deprivation comparison fails for the same reason - blindness and deafness are incommensurable experiences.

  For new cases, this framework would allow: comparing tinnitus to nausea if they share unpleasant sensory qualities; reject pre/post-conversion comparisons if values change radically; and reject different-disability comparisons unless they share experiential dimensions. The professor might need to reconsider case 7 if phenomenal similarity is established, or case 2 if new anchors emerge.

  The principles should distinguish between levels and differences - accepting ordinal comparisons but rejecting ratios (case 8), and should use multiple dimension-specific scales rather than a single welfare metric. The key insight is that interpersonal comparisons require either direct phenomenal similarity or mediated evaluative agreement on comparable dimensions.
answer: |-
  Based on your considered judgments and the tension between cases (particularly 3 vs. 7), no *single* principle fully captures all verdicts while preserving the core of anchored comparability. The conflict arises because **agreement on anchor rankings is necessary but insufficient** for meaningful comparison. We need a dual-aspect principle addressing **phenomenal comparability** and **evaluative symmetry**. Below is the minimal set of principles covering your cases, with diagnoses for discrepancies.

  ---

  ### **Proposed Principles**
  **1. Phenomenal Comparability (For Sensory/Basic States):**  
     *Interpersonal comparisons of welfare levels or differences are meaningful iff the compared states share phenomenally accessible qualities (e.g., pain, itch, nausea intensity), and a shared anchor exists that both parties can ordinally rank relative to their own state.*  
     - **Motivated by:** Cases 1 (pain), 5 (pain vs. itch), and the failure of case 2 (blindness/deafness lack shared sensory qualia).  
     - **Levels/Differences:** Applies to both (e.g., "worse off" in levels; "gain > loss" in differences).  
     - **Scale:** Dimension-specific (e.g., a pain-itch scale).  

  **2. Evaluative Symmetry (For Complex/Value-Laden States):**  
     *Interpersonal comparisons of welfare levels are meaningful iff:*  
     *(a) There is a shared anchor both parties ordinally rank relative to their own state,*  
     *(b) The parties share sufficiently similar evaluative frameworks (e.g., concepts of suffering, flourishing), AND*  
     *(c) The compared states are relevantly similar in kind (e.g., both are health deficits).*  
     - **Motivated by:** Cases 3 (depression vs. pain: shared health deficit), 6 (value divergence blocks comparison), and 7 (tinnitus vs. pain may lack similarity).  
     - **Levels/Differences:** Applies only to levels (e.g., "worse off"). Welfare *differences* require Phenomenal Comparability.  
     - **Scale:** Single ordinal scale per evaluative framework.  

  **3. Anchored Difference Comparability (For Non-Identical States):**  
     *Comparisons of welfare differences (not levels) are meaningful iff there exists a shared anchor such that both parties agree on the ordinal ranking of the states involved in the difference (e.g., gain/loss relative to status quo).*  
     - **Motivated by:** Case 4 (gain/loss ordinally anchored to wealth levels), and Case 5 (pain > itch ordinally anchored).  
     - **Levels/Differences:** Differences only (e.g., "gain > loss").  
     - **Scale:** No common unit; relies on ordinal agreement over outcomes.  

  ---

  ### **How the Principles Cover Your Cases**
  | Case | Your Verdict | Principle Applied | Diagnosis |
  |------|--------------|-------------------|----------|
  | **1** (Arthritis vs. Migraines) | Meaningful | **Phenomenal Comparability** | Shared pain qualia; anchor (e.g., "no pain") ordinally ranked. |
  | **2** (Blind vs. Deaf) | Not meaningful | **Phenomenal Comparability** fails | No shared sensory qualia; no anchor for cross-modal comparison. |
  | **3** (Depression vs. Pain) | Meaningful | **Evaluative Symmetry** | Shared anchor (e.g., "health"); similar evaluative frameworks (health deficits). |
  | **4** ($1k Loss/Gain) | Meaningful | **Anchored Difference Comparability** | Shared anchor (wealth levels); ordinally ranked gains/losses. |
  | **5a** (Human vs. Dog: Overall) | Not meaningful | **Evaluative Symmetry** fails | Divergent evaluative frameworks (flourishing vs. instinct). |
  | **5b** (Pain vs. Itch) | Meaningful | **Phenomenal Comparability** | Shared aversive qualia; anchor (e.g., "no discomfort") ordinally ranked. |
  | **6** (Achievement vs. Relationships) | Not meaningful | **Evaluative Symmetry** fails | Divergent frameworks despite equal satisfaction. |
  | **7** (Tinnitus vs. Pain) | Not meaningful | **Evaluative Symmetry** fails | Conditionally: if tinnitus/pain lack "similar kind" (e.g., one is sensory, one is affective). |
  | **8** (Ratio Comparisons) | Not meaningful | *All principles* | Principles support only ordinal comparisons; ratios require cardinal units. |

  ---

  ### **Which Verdicts Must Be Revised?**
  - **Case 7 is inconsistent with Case 3** given your current view. To preserve Evaluative Symmetry, you must either:  
    (a) **Revise Case 7 to "meaningful"** if tinnitus/pain are deemed similar health deficits (like depression/pain), OR  
    (b) **Argue tinnitus/pain lack evaluative similarity** (e.g., pain is somatic suffering, tinnitus is neurological noise).  
    *Recommendation:* Keep Case 7 as-is but clarify that "severe tinnitus" and "moderate pain" are not "relevantly similar" under Evaluative Symmetry (e.g., they engage different affective dimensions).  

  - **Case 3** holds only if depression/pain share a "suffering" dimension. If depression is seen as fundamentally different (e.g., existential vs. physical), it fails.  

  ---

  ### **Handling New Cases**
  - **Tinnitus vs. Chronic Nausea:**  
    - **Phenomenal Comparability:** Meaningful if both are unpleasant sensory states (e.g., "nausea worse than tinnitus").  
    - **Evaluative Symmetry:** Not meaningful for overall welfare without shared evaluative framework.  

  - **Pre-/Post-Religious Conversion:**  
    - **Evaluative Symmetry fails** if frameworks change radically. Comparison requires anchors from the *same* evaluative perspective (e.g., "pre-conversion me ranks X as worse than Y").  

  - **Two Different Disabilities (e.g., Paralysis vs. Cognitive Decline):**  
    - **Phenomenal Comparability:** Not meaningful (no shared qualia).  
    - **Evaluative Symmetry:** Meaningful *only* if parties share a framework (e.g., both view disabilities through "loss of autonomy").  

  ---

  ### **Key Implications**
  1. **Levels vs. Differences:**  
     - *Levels* require Evaluative Symmetry or Phenomenal Comparability.  
     - *Differences* can use Anchored Difference Comparability (weaker).  
  2. **Scales:**  
     - **No single scale.** Dimension-specific scales for sensory states; framework-specific ordinal scales for complex welfare.  
  3. **Anchors:** Necessary but insufficient alone (explains failure of pure anchored-comparability in Cases 2, 6, 7).  
  4. **Agreement:** Matters only under Evaluative Symmetry (Case 3 vs. 7).  

  This framework preserves 7/8 verdicts if you accept the "dissimilar kind" defense for Case 7. It prioritizes ordinal comparisons and rejects cardinality/ratios (Case 8), aligning with your aversion to common welfare units. If forced to surrender one verdict, Case 3 is the weakest—agreement may not suffice if depression/pain are evaluatively alien. But with refinement, your core intuition holds.
