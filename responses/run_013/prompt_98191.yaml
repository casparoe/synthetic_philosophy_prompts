prompt: |-
  Quick context, sorry it's a bit long: I run a tiny interview podcast out of my garage. No philosophy degree, I just talk to people about ideas I've been chewing on for months and half of what I say is me thinking out loud. Next month's guest is a philosopher who's spent about a decade arguing something I find kind of wild, and I don't want to waste the hour letting her just restate it.

  Her line, as best I can put it: care ethics went wrong by putting care *inside the carer's head* -- the warm feeling, being totally absorbed in the other person's situation, wanting to help. She thinks real care actually lives in arrangements: who is set up to notice whom. So the moral question isn't 'do I feel care,' it's 'what makes some needs visible and other needs invisible.' And she thinks the whole care-versus-justice debate is a sideshow, because justice is just care that got built into a system and generalized. Her slogan is that the worst failures of care aren't failures of feeling, they're failures of plumbing -- the pipes that are supposed to carry a need to somebody who could actually do something about it. She also has a habit, whenever she's cornered, of saying 'that's an engineering problem, not a moral one,' and I'm definately going to be annoyed if she gets to use that five times.

  Can you write me the interview questions? I need them to actually dig into the position, not softballs, and no stuff like 'what drew you to care ethics.' Please hit these, and at least one question each:

  1. Whether the carer's feeling drops out entirely. If care is in the arrangement, could a cold, indifferent bureaucracy that happens to meet everyone's needs count as caring? I want to see if her view eats itself here.
  2. If justice is just institutionalized care, how does she stop 'caring' institutions from being paternalistic, or from just being power wearing a nice outfit?
  3. The visibility thing. Somebody decides what's legible and what isn't. So hasn't she just moved the whole moral question back to whoever designs the pipes -- which sounds like the justice question she said was a sideshow?
  4. Far-off strangers. If care needs a mediator, then whether I owe anything to people in a famine now depends on whether the news covers it. Is that a bug or a feature, and which way does she actually want it?
  5. People who can't be in any arrangement at all -- the dead, or people not born yet, maybe animals. Does her account just leave them outside care?
  6. A test case I keep turning over: a society that 'cares' for disabled people by building places to put them out of sight, and calls that care. How does she tell good plumbing from bad plumbing without sneaking the inner feeling back in as the standard?

  For each of the six, give me a follow-up keyed to the answer she's most likely to give -- and since she'll probably reach for her 'engineering problem, not a moral one' line, make each follow-up a little harder to escape with it, so by the end that move doesn't work anymore.

  Format it like this, please:
  - "Warm-up": two questions, one line each, just to get her talking.
  - "The squeeze": the six questions above, each one or two sentences, in the order I listed them.
  - "If she says...": one follow-up for each of the six, one sentence each, written as 'If she says X, ask Y.'
  - "The closer": one question, two or three sentences, that she can't dodge with the engineering line.
reasoning: |-
  Okay, let's tackle this user's request. They run a small interview podcast and need sharp questions for a philosopher guest with a unique take on care ethics. The core idea is that care isn't about inner feelings but about societal arrangements—who notices whom. The user wants to challenge this view without letting the guest fall back on her "engineering problem" deflection.

  First, the user's main concerns are clear: they want to prevent the guest from rehashing her theory and instead engage in deep critique. The six specific points they provided cover potential contradictions in her framework. Each question targets a different weakness: bureaucracy replacing genuine care, institutional paternalism, the visibility paradox, distant strangers, excluded entities, and misapplied care in segregation.

  For the warm-up, I need two concise questions that set the stage without being leading. Asking about the shift from feelings to structures and the "biggest cost" of traditional care ethics should prompt the guest to outline her thesis early.

  For the six "squeeze" questions, I'll keep each focused as requested. Question 1 challenges if cold bureaucracy could count as care. Question 2 probes institutional power dynamics. Question 3 questions whether she's just moving the moral burden to designers. Question 4 addresses the mediation problem for distant suffering. Question 5 deals with non-participating entities like future generations. Question 6 uses the segregation case to force a standard for "good" arrangements.

  The follow-ups are crucial. Since the guest often uses the "engineering problem" line, each follow-up must corner her. For instance, if she dismisses bureaucracy as bad design, asking why it's bad design forces her to address moral criteria. Similarly, pushing on paternalism in Q2 and visibility in Q3 prevents her from avoiding the underlying values.

  The closer needs to tie it all together. By asking how to judge arrangements without feelings, it compels her to define an objective standard, making the "engineering" dodge impossible. This structure ensures progressive pressure, weakening her escape route with each follow-up.

  The user's deeper needs seem to be: validating their grasp of philosophy despite no formal training, creating engaging content that challenges guests, and avoiding being outmaneuvered by an expert. They likely want to demonstrate intellectual rigor to their audience while keeping the conversation accessible. The questions must balance depth with clarity, ensuring the guest can't retreat to rehearsed answers. I need to make sure each question builds on the last, systematically dismantling potential deflections while staying respectful and focused.
answer: |-
  Here’s a structured interview script designed to corner the core tensions in her framework, escalate pressure on her "engineering" escape hatch, and force substantive engagement. Each follow-up is engineered to make the "engineering problem" deflection increasingly untenable.

  ---

  ### **Warm-up**
  1. "You argue care ethics got derailed by focusing on the carer's inner state. What’s the single biggest cost of that mistake?"  
  2. "When you say 'care lives in arrangements,' what’s the smallest, most mundane example that captures that shift?"

  ### **The Squeeze**
  1. **The Feeling Problem:** If care is purely about functional arrangements, could a perfectly efficient but utterly indifferent bureaucracy—no warmth, no empathy—qualify as genuinely caring?  
  2. **Power & Paternalism:** If justice is institutionalized care, what prevents those institutions from becoming paternalistic systems of control—power disguised as care?  
  3. **The Visibility Designer:** You say care hinges on *who is set up to notice whom*. But *someone* designs that setup. Doesn’t that just relocate the core moral question to the designer—which looks exactly like the "justice" question you dismiss?  
  4. **Distant Strangers:** If care requires mediation, then whether I have obligations to famine victims depends entirely on whether their suffering is made visible by news or NGOs. Is this dependence a flaw in your view, or do you embrace it?  
  5. **The Unmediated:** How does your framework handle obligations to entities excluded from any 'arrangement'—the dead, future generations, or non-human animals?  
  6. **Bad Plumbing Test Case:** A society "cares" for disabled people by building efficient, humane institutions that also isolate them from public life. How do you condemn this as *bad care* without implicitly relying on the carer’s attitude or the recipient’s experience?

  ### **If she says...**  
  *(Targeted follow-ups to block the "engineering problem" dodge)*  
  1. *If she says:* **"A cold bureaucracy fails because it’s poorly designed—it doesn’t truly *see* needs."**  
     *Ask:* **"What makes design 'poor' here if not the *absence* of the very attentiveness or responsiveness you’ve exiled from care’s definition?"**  
     *(Forces her to define "good design" morally, not just technically.)*  

  2. *If she says:* **"Paternalism arises when institutions aren’t properly responsive or accountable."**  
     *Ask:* **"Responsive *to what standard*? Isn’t avoiding paternalism precisely about respecting agency—a moral value you seem to place outside 'care'?"**  
     *(Challenges the separation of care from core moral concepts like autonomy.)*  

  3. *If she says:* **"Designers must ensure needs are made visible fairly—that *is* the justice work."**  
     *Ask:* **"But if designing visibility *is* justice, and justice *is* institutionalized care, haven’t you just admitted the 'sideshow' is actually the main stage?"**  
     *(Traps her in circularity or forces her to collapse the distinction.)*  

  4. *If she says:* **"Mediation isn’t arbitrary; we can design robust systems for distant need."**  
     *Ask:* **"Does that mean our obligation to distant strangers *only* activates once the 'pipes' exist? If so, isn’t that a moral disaster?"**  
     *(Confronts the passive, contingent morality this implies.)*  

  5. *If she says:* **"We extend arrangements via proxies—e.g., representing future generations."**  
     *Ask:* **"Can a proxy *truly* make the needs of the unborn or extinct species 'visible' in the way your model requires, or is this just a convenient fiction?"**  
     *(Questions the coherence of "arrangements" for entities fundamentally outside them.)*  

  6. *If she says:* **"Segregationist 'care' is bad plumbing because it isolates, harming flourishing."**  
     *Ask:* **"Harm according to whom? If the institution meets physical needs efficiently, what grounds your 'harm' claim except the excluded inner experience of the cared-for?"**  
     *(Demands a standard *external* to the system’s own logic.)*

  ### **The Closer**  
  "You’ve framed care as plumbing, justice as its institutional form, and moral failures as engineering flaws. But to judge *any* arrangement as flawed—whether it’s cold, paternalistic, exclusionary, or blind to distant suffering—you *must* appeal to some normative standard *beyond* the system’s own functioning. What is that standard, if not the very moral experience you’ve tried to banish from care?"  
  *(This directly attacks the core contradiction: judging "engineering" requires moral criteria she claims are irrelevant.)*

  ---

  ### **Why this works**
  *   **Progressive Pressure:** Each follow-up tightens the screws on her "engineering problem" exit. By Q6’s follow-up, it’s clear "engineering" judgments rely on the moral values she dismisses.
  *   **Forces Definitional Clarity:** Questions demand she define "good design," "visibility," "responsiveness"—terms she can’t operationalize without smuggling in moral content.
  *   **Confronts Contradictions:** Highlights tensions between her rejection of inner states and her need for standards (autonomy, harm, flourishing) that rely on them.
  *   **Closer is Unavoidable:** The final question ties all threads together, forcing her to either admit a moral foundation beyond arrangements or concede her framework lacks criteria to judge *anything* as bad care.

  This script doesn’t let her restate; it forces engagement with the hardest edges of her theory. Good luck—she won’t see it coming from a garage.
