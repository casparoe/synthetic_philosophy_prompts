prompt: |-
  You're a philosopher who also happens to know modern machine learning well enough to referee an imitation-learning paper, and you genuinely know the ancient-biography / hagiography tradition rather than one summary of it. Before you write anything, brainstorm the candidate correspondences between the two frameworks. Then write the translation. Then the residue report -- dont rush that part, it's the point.

  My best friend and I argued for about three hours last night. Her line: you learn how to live from lives, not from rules. Not just Plutarch's Parallel Lives, but the whole tradition of writing and reading exemplary lives that grows out of it -- saints' lives, imitatio, the monastic practice of reading a life as a mirror you adjust yourself in. She thinks the genre's idealization is a feature and not a bug: the saints have no childhoods and keep performing the same stock miracles, and that's the genre deciding what in a person is imitable, so the reader gets something to aim at. She also insists the point isn't to copy the deeds, it's to be pulled into becoming the kind of person who'd do them -- and that the exemplar's virtue is often presented as a gift rather than an achievement, which she says is definately the deepest part and not an embarrassment.

  I'm a research engineer on robot learning. Behavioural cloning, inverse RL, reward modelling, RLHF, distribution shift, demonstrator-optimality assumptions, exploration, generalization -- that's my whole vocabulary, and I have literally no classics. So: restate her position, as faithfully as you can, in the vocabulary I actually use. Piece by piece rather than as one blob, and keep the translation honest -- if a bit only fits when you quietly assume the demonstrator is optimal or that there's a single scalar objective, say so at the moment you do it.

  Then the residue. What carried over cleanly, what you had to distort to fit, what has no counterpart at all in my vocabulary. My guess is the interesting failure is the one about changing what you want versus copying what someone did, since BC and IRL both take the objective more or less as given -- but tell me if that's too cute, and tell me whether the idealization point is really just curating a demo set or whether it's doing something my framework can't express. Last thing: is the residue big because my vocabulary is too thin, or because her position is vaguer than it sounds? And what one question about exemplar traditions would tell those two apart?
