prompt: |-
  I've spent the better part of this year on a qualifying paper about imperial decline, and a running argument with two friends in the department has pushed me toward a pattern I can describe but not name. Here is the shape of it. Someone says that the power we are watching is an empire, or a hegemon, or the center of a unipolar order, and that empires decline, and therefore we should expect this one to decline too. The evidence offered is a list: Rome, the Ottomans, the Spanish, the British, the Soviets. The length of the list is doing the work. When you object that a fair number of polities that sat at the top of the heap are still with us, or quietly stopped being at the top without any dramatic fall, the reply is that those were not really empires, or were not really at the top, or that the interesting question concerns only the ones that did fall. I have started noticing the identical shape in smaller arguments. A colleague will predict that a particular firm is doomed because every firm that reached this size with this much debt has failed, and when I ask how many firms of that description did not fail, it turns out the sample contains only the failures, because the ones that survived are not filed under that description — or are filed under it only in retrospect, once their survival has been reinterpreted as a long, slow, disguised decline.

  What I want to know is whether this has a name, and if it does, which name fits best, because I keep reaching for ones that are close but wrong. It is near the business of choosing a base rate from a class of cases whose outcomes you already know; it is near the general puzzle that any event belongs to indefinitely many reference classes that yield different probabilities; and it is near the warning about drawing conclusions from a set that was filtered by the very outcome you are trying to predict. But none of those quite catches the part that bothers me, which is that here the category itself appears to have the outcome folded into it, so that whether a given case belongs to the reference class is not settled until the future resolves, and the comforting sample is assembled after the fact. Is there an established term for that specific circularity, or for the family it belongs to? If there is not, please coin one: give it a definition, say plainly how it differs from survivorship bias and from the ordinary reference-class problem and from the more technical error of conditioning on a common effect, and mark its boundaries — for instance, whether it stops being a mistake when the person is scrupulous about how the category is defined, or when the sample is very large, or when the category names a real kind rather than a retrospective label. I am not after reading recommendations or citations; I want the concept itself pinned down, and a bare label will not satisfy me, since what I actually need is the carving: what this thing is, what it is not, and where its edges are. Please answer in continuous prose, with no headings, bullet points, bold text, or tables — just paragraphs, the way you would write a long reply to a colleague.
reasoning: |-
  Okay, the user is grappling with a specific logical fallacy they've observed in arguments about imperial decline and business failures. They describe a pattern where someone defines a category (like "empires that decline") by including only cases that have already experienced the outcome (decline), thereby making the argument circular. The user wants to know if this has a name and seeks a precise conceptual breakdown.

  First, I need to identify the core issue. The key elements are: (1) defining a reference class based on the outcome, (2) using that class to predict the same outcome, (3) excluding counterexamples by redefining membership retrospectively. This seems distinct from survivorship bias (which focuses on survivors) or base rate neglect. The circularity where category membership depends on the future outcome is crucial.

  The closest established term might be "cherry-picking" or "selection bias," but those feel too broad. "Hindsight bias" touches on retrospective labeling but doesn't capture the predictive circularity. The user's observation about "folding the outcome into the category" suggests a unique blend of temporal and definitional flaws. 

  I recall similar concepts: Popper's critique of historicism (defining historical categories by outcomes), or the "Texas sharpshooter fallacy" (drawing targets after shooting). But neither fully fits. The user's emphasis on future-dependent categorization reminds me of "reference class forecasting" problems, yet their case is more perverse because the class is defined by the outcome.

  For a new term: "Proleptic classification" (prolepsis means assuming something future as present)? Or "Retroscriptive fallacy" (retroscriptive = retrospectively inscribed)? But the user wants clarity, not jargon. Perhaps "temporal circularity in reference class definition" – though clunky, it highlights the time-based flaw.

  The boundaries matter: It stops being a fallacy if (1) categories are defined independently of outcomes (e.g., "all firms with 50% debt in 1990"), (2) counterexamples are included, (3) mechanisms explain why the outcome must follow. Large samples don't fix it if selection remains outcome-dependent. Real kinds (e.g., "mammals") avoid this because membership isn't outcome-defined.

  User's deeper need: They're constructing an academic argument and need to precisely identify this flaw to critique their colleagues. Unspokenly, they may want intellectual leverage in departmental debates or to strengthen their paper's theoretical framework. Their frustration with "near-miss" concepts suggests they need airtight terminology to avoid strawman accusations.

  Final approach: I'll position this as a distinct subspecies of selection bias, emphasize the temporal/redefinition loop, and clarify why common alternatives don't fit. Coining "outcome-defined reference class fallacy" balances precision and accessibility. Boundaries will stress that only pre-outcome, mechanism-agnostic definitions prevent the circularity.
answer: |-
  What you're grappling with is a particularly insidious form of selection bias, amplified by retrospective redefinition. While it brushes against survivorship bias, the base rate fallacy, and reference-class ambiguity, its core distinctiveness lies in the *temporal circularity* of category membership: the defining criteria for the reference class are not fixed independently of the outcome, but are instead shaped — often unconsciously — by the outcome itself. The category becomes a *consequence* of the event it purports to predict, rendering the prediction tautological. There isn't a single, universally accepted term for this precise maneuver, but the most fitting descriptive label is the **Outcome-Defined Reference Class Fallacy**.

  This fallacy operates in two interdependent stages. First, the reference class ("empires that decline," "firms doomed by size and debt") is implicitly or explicitly constructed by selecting historical cases where the outcome of interest (decline, failure) *has already occurred*. Crucially, this selection isn't neutral; it involves defining the category boundaries *in light of the outcome*. What counts as an "empire" or "hegemon" worthy of inclusion, or what precise threshold of "size and debt" constitutes membership, is often determined by looking backward at the failures. Entities that avoided the outcome are either excluded from the class definition ("those weren't *real* empires/hegemons") or their survival is retroactively interpreted as a form of the outcome ("their persistence was actually disguised decline"). Second, this outcome-saturated class is then used to predict the same outcome for a new case ("this current power/firm fits the class, therefore it will decline/fail"). The predictive power is illusory because the class was defined *by* the failures it now purports to explain prospectively. The category doesn't identify a pre-existing condition leading to decline; it is a post-hoc assemblage of decline cases.

  Distinguishing it from related concepts is key:
  1.  **Survivorship Bias:** Focuses on the error of only considering entities that "survived" some selection process (e.g., only studying successful companies), overlooking those that failed and disappeared. Your fallacy is its inverse temporal twin: it focuses *only* on the "failed" cases, retrospectively defining the class to exclude or redefine the "survivors." Both suffer from incomplete data, but the mechanism differs. Survivorship bias ignores the *missing* failures; your fallacy actively redefines the *present* non-failures to fit the failure narrative.
  2.  **Ordinary Reference-Class Problem:** Concerns the difficulty of choosing the *correct* reference class from many possible ones for assigning probabilities (e.g., is this firm more like "tech startups" or "firms with high debt?"). Your fallacy is a specific *abuse* of this problem. It doesn't just choose a potentially inappropriate class; it constructs a class *defined by the outcome*, making it inherently unsuitable for prediction. The ambiguity isn't accidental; it's weaponized through retrospective redefinition.
  3.  **Conditioning on a Common Effect:** A causal error where conditioning on a collider variable (a common effect of two causes) induces a spurious association between the causes. While your fallacy *can* involve causal claims ("empires *always* decline because of X"), its core flaw is predictive and definitional, not necessarily causal. The circularity lies in defining the class by the outcome, not primarily in misattributing causes via colliders.

  The boundaries of this fallacy are defined by the independence of the category definition from the outcome:
  *   **It stops being a fallacy when the category is defined prospectively and independently.** If "empire" is rigorously defined using criteria observable *before* any decline (e.g., territorial extent, economic dominance relative to peers, administrative structure at a specific point T1), *and* all entities meeting that definition at T1 are included in the sample regardless of their later fate, then studying their subsequent trajectories (decline, persistence, transformation) is valid historical analysis. Similarly, defining "firms with debt-to-asset ratio > X% at fiscal year-end 2020" and tracking *all* such firms avoids the fallacy.
  *   **Large samples don't inherently fix it.** A large sample of retrospectively defined "failed empires" still suffers if the definition of "empire" or "failure" was shaped by knowing the outcome. Size only mitigates sampling error, not definitional bias.
  *   **"Real kinds" vs. "Retrospective labels" is crucial.** Categories based on intrinsic, stable properties observable at the time (e.g., biological species, specific institutional forms) are less susceptible. The fallacy thrives on vague, value-laden, or functionally defined categories ("hegemon," "doomed firm") where boundaries are flexible enough to be redrawn after the outcome is known. A "real kind" resists this redefinition; a retrospective label invites it.

  The essence of the Outcome-Defined Reference Class Fallacy is the smuggling of the future into the present definition. It offers the comforting illusion of historical pattern and inevitability, but only by ensuring the pattern cannot be falsified by counterexample – because any potential counterexample is either excluded from the category or reinterpreted to fit the predicted doom. It conflates historical description with predictive law by making the description dependent on the outcome it needs to predict. Recognizing it requires vigilance: whenever a prediction relies on a historical list, demand the criteria for inclusion *as they would have been applied before the outcome was known*, and insist on accounting for all entities meeting those prior criteria, not just the ones that conform to the predicted fate. The fallacy dissolves when the category stands firm, defined by its past state, facing an uncertain future.
