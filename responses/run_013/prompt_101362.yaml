prompt: |-
  I have a set of verdicts about when a decision should be made by lot rather than by election, expertise, or negotiation, and I want to know what principle, if any, unifies them. I am not asking for a survey of the literature or for citations; I want the principle that best fits the verdicts, even if it forces me to give one up.

  My verdicts:

  1. A criminal jury selected by lot from a representative pool is appropriate, even though jurors lack legal expertise.

  2. A citizens' assembly selected by lot to propose changes to electoral law is appropriate, provided it hears expert testimony and its proposals are subject to public debate and a vote.

  3. A legislature selected entirely by lot, with final authority over ordinary law, is not appropriate, even if it is representative and well informed.

  4. A lottery among compatible patients for a scarce kidney is appropriate when their medical prognoses are similar; a lottery among all patients, including those who would reject the organ, is not.

  5. A lottery among all eligible adults for military conscription is appropriate when the burden is unavoidable and exemptions are not corrupt; a lottery that allows the wealthy to buy exemptions is not.

  6. A lottery to assign dormitory rooms is appropriate; a lottery to hire a professor from a pool of qualified finalists is not.

  7. A lottery to select members of a scientific review panel from among experts is appropriate to reduce bias; a lottery to decide whether to build a bridge is not.

  8. A lottery to choose which affected community hosts a hazardous waste facility is not appropriate by itself, though it may be appropriate to choose among communities that have already negotiated compensation and consent.

  9. A lottery to decide an asylum claim is not appropriate, even if all claimants have equally strong cases, because the decision concerns a right.

  10. A lottery to set the order of speakers in a debate is appropriate; a lottery to choose the chair of a department is not.

  My tentative principle is this: sortition is appropriate when the decision is either a distributive choice among claimants whose claims are equal in strength or a representative fact-finding or agenda-setting task, and it is not appropriate when the decision requires specialized expertise, determines a right, or is a final policy choice for which some person or body must be accountable. But this principle seems to treat the citizens' assembly in case 2 and the lottocratic legislature in case 3 differently only because of finality and accountability. Is that the real distinction, or is something else doing the work? It also seems to make the kidney lottery in case 4 appropriate only because the claims are equal, yet in case 8 the communities may have equal claims and I still do not think a lottery alone is appropriate. Is the difference consent, or the presence of a prior negotiation? I keep going back and forth on whether case 8 should be overturned or whether the principle needs a clause about the affected parties having a chance to shape the terms of the lottery.

  What principle, or small set of principles, best captures these verdicts? State it precisely, say which case motivates each clause, and say which of my verdicts it cannot accommodate. Then apply it to two cases I have not listed: (a) a citizens' assembly selected by lot with binding authority over a city budget, and (b) a lottery among all residents to decide which language will be taught in public schools. Finally, tell me whether the principle favors sortition or election for the ordinary business of a legislature, and why.
reasoning: |-
  Hmm, this user presents a sophisticated philosophical puzzle about the unifying principle behind various judgments on when sortition (decision by lot) is appropriate. They've listed 10 clear verdicts and proposed a tentative principle that seems to struggle with cases 2, 3 and 8. The core tension appears between procedural fairness and substantive decision-making capacity.

  The user's intellectual engagement is impressive - they're clearly wrestling with nuances like the distinction between agenda-setting versus final authority in cases 2 and 3, and the role of consent in case 8. Their frustration with their own principle shows they've done deep thinking already. I notice they're particularly bothered by apparent inconsistencies between cases 4 and 8, where equal claims seem to justify sortition in one context but not another.

  Their tentative principle has three key components: 1) distributive equality 2) fact-finding/agenda-setting 3) exclusion of expertise/rights/finality. But the friction points reveal deeper dimensions. Case 2 vs 3 suggests the accountability factor might be crucial - citizens' assemblies gain legitimacy through their advisory nature and public ratification, while a lottocratic legislature lacks electoral accountability. Case 8 highlights that when fundamental interests are at stake (like hosting hazardous waste), mere equality isn't sufficient without consent mechanisms.

  For case 4, the kidney lottery works because it's a pure distribution problem among equals, whereas case 8 involves burdens that require negotiation precisely because communities aren't equal in their vulnerability or preferences. The dorm room assignment (case 6) versus professor hiring shows that when outcomes affect third parties (students needing quality education), sortition becomes problematic.

  The principle I'm formulating must explain why "equal claims" alone isn't sufficient (case 9: asylum rights), why agenda-setting differs from final decisions (cases 2 vs 3), and why some equal-distribution cases still require consent (case 8). The unifying thread seems to be about the nature of the stake: sortition is defensible when either (a) it's a low-stakes distribution among equals, or (b) it's about input/representation without final authority, but forbidden when decisions involve high-stakes rights, irreversible burdens, or require specialized judgment.

  For their unlisted cases: a binding citizens' assembly on city budgets would violate because budget authority requires accountability (like case 3). The language lottery fails because it imposes cultural burdens without consent (echoing case 8). On legislatures, the principle clearly favors elections due to accountability needs, though it would support sortition for advisory bodies like case 2.

  The most elegant solution seems to be a dual-axis principle weighing both the decision-type (distributive vs constitutive) and stake-level (low-impact vs high-stakes), with consent requirements kicking in at certain thresholds. This perfectly captures all 10 verdicts without contradiction, and resolves their frustration with cases 4 vs 8 by showing that kidney allocation is low-stakes survival while waste facilities are high-stakes livability issues.
answer: |-
  Based on your verdicts, the unifying principle isn't solely about equality of claims, agenda-setting, or finality, but rather about the **nature of the stake involved and the requirement for consent when fundamental interests are imposed**. Here's the principle that best fits your judgments, with explanations for each clause:

  **The Principle of Sortition Legitimacy:**
  > Sortition is appropriate **only when** (1) the decision concerns **low-stakes distribution of divisible goods/opportunities among parties with equal claims**, *or* (2) it serves a **non-final, consultative function** (e.g., fact-finding, agenda-setting, or bias reduction) within a broader accountable process. It is **inappropriate** when (a) the decision imposes **significant, non-negotiated burdens** or determines **fundamental rights**, (b) requires **specialized expertise for competent judgment**, or (c) constitutes a **final, binding policy choice demanding direct accountability**.

  **How it explains your verdicts:**

  1.  **Jury (Verdict 1):** Fits (2) – Non-final fact-finding (judge applies law/sentence); avoids (a) as verdict determines rights *only* within constrained rules/evidence.  
  2.  **Citizens' Assembly (Verdict 2):** Fits (2) – Non-final agenda-setting/proposal (subject to debate/vote); avoids (c).  
  3.  **Lottocratic Legislature (Verdict 3):** Violates (c) – Final binding authority needs accountability.  
  4.  **Kidney Lottery (Verdict 4):** Fits (1) – Low-stakes (life-saving opportunity) distribution among equals (medically similar). Excludes incompatible patients as *unequal claimants*.  
  5.  **Conscription Lottery (Verdict 5):** Fits (1) – Burdens unavoidable & distributed equally; buyouts violate (1) by creating unequal claimants. Avoids (a) because burden is societal necessity applied *equally*.  
  6.  **Dorm Rooms (Yes) vs. Professor Hire (No) (Verdict 6):** Dorms: (1) Low-stakes distribution among equals (all students need housing). Professor: Violates (b) – Requires expertise to assess competence.  
  7.  **Scientific Panel (Yes) vs. Bridge Decision (No) (Verdict 7):** Panel: (2) Bias reduction within expert consultation. Bridge: Violates (b) & (c) – Requires expertise and is a final policy choice.  
  8.  **Hazardous Waste Siting (Verdict 8):** **Violates (a)** – Imposes significant, non-negotiated burden. Lottery only acceptable *after* negotiation/consent transforms it into choice among willing equals (fitting (1)).  
  9.  **Asylum Claim (Verdict 9):** Violates (a) – Determines a fundamental right (asylum). Equality of cases is insufficient.  
  10. **Speaker Order (Yes) vs. Chair Hire (No) (Verdict 10):** Speakers: (1) Low-stakes distribution of opportunity. Chair: Violates (b) & (c) – Requires expertise/leadership judgment and is a consequential appointment.

  **Addressing Your Concerns:**
  *   **Case 2 vs. Case 3:** The distinction *is* primarily **finality and accountability (clause c)**, reinforced by the **nature of the task (ordinary law requires sustained expertise/broad accountability)**, not just agenda-setting. A binding legislature fails (c).
  *   **Case 4 vs. Case 8:** The difference is **clause (a) - significant non-negotiated burdens**. Kidney allocation (Case 4) is a *benefit* distributed equally among equals. Hosting waste (Case 8) is a *burden*. Equal claims to *avoid* a burden aren't enough; **consent transforms the burden into a chosen opportunity among equals, making sortition (clause 1) appropriate only after negotiation**. Your intuition about "shaping the terms" is correct – negotiation establishes consent and transforms claimants into equals for the *specific lottery*.

  **Cases Your Principle Cannot Accommodate:**
  This principle fits all 10 verdicts without needing to overturn any. Case 8 is explained by clause (a).

  **Applying to New Cases:**

  *   **(a) Citizens' Assembly with Binding Budget Authority:** **Inappropriate.** This violates clause (c) – Final, binding policy choice (budget allocation) demands direct accountability. While budgets involve distribution, the scale, trade-offs, and finality require accountability mechanisms elections provide. It's not just low-stakes distribution (clause 1 fails) nor non-final consultation (clause 2 fails).
  *   **(b) Lottery to Decide School Language:** **Inappropriate.** This likely violates (a) and possibly (c). Imposing a language curriculum is a significant cultural/social burden (or benefit denial) on residents without their consent or negotiation. It determines access to education/cultural recognition (a fundamental interest akin to a right). It's not a low-stakes distribution among equals with equal claims to *avoid* the burden.

  **Legislative Business: Election Favored.**
  The principle clearly favors **election** for the ordinary business of a legislature. Why?
  1.  **Violates (c):** Legislatures make final, binding policy choices affecting fundamental rights, imposing burdens (taxes, regulations), and allocating vast resources. This demands direct accountability to the governed.
  2.  **Violates (b):** Crafting effective legislation on complex topics (economy, environment, defense, etc.) requires specialized knowledge, sustained attention, and nuanced judgment that a rotating lottocratic body inherently struggles with.
  3.  **Does Not Fit (1) or (2):** While laws *distribute* benefits/burdens, they are not "low-stakes" distributions among a defined set of equals with identical claims. Lawmaking is constitutive, setting rules for society, not merely dividing a pie. It's also not merely consultative or agenda-setting; it's final authority.

  **In essence:** Sortition excels at fair distribution of opportunities/limited goods among equals and providing representative, unbiased input *into* accountable processes. It fails when decisions require expertise, impose major burdens without consent, determine fundamental rights, or demand the direct accountability inherent in final governing authority – the core functions of a legislature.
