answer: |-
  Your friend's critique is sharp but incomplete; truth commissions *do* presuppose a distinctive moral architecture. Let's reconstruct its implicit theory element by element, then test its coherence and alternatives.

  ### Core Presuppositions
  1.  **The Nature of Harm:**
      *   **Presupposition:** Unacknowledged violence *is* a distinct, ongoing injury beyond the original wrong. It compounds harm through denial, state-sponsored silence, and the psychological burden of uncertainty for survivors. The commission targets *impunity* (the state's refusal to account) as the primary repairable injury *after* the irreversible deed (e.g., death).
      *   **Obligation:** Truth is *owed* to the survivor as a right *and* to the community as an interest. The survivor's right stems from the violation of their dignity and their need for epistemic justice. The community's interest lies in understanding its own history to rebuild trust and prevent recurrence. The commission operationalizes both.

  2.  **The Theory of Blame & the "Exchange Rate":**
      *   **Presupposition:** A *quality-of-will* view dominates, but with a crucial twist focused on **present attitude toward past action**. Blameworthiness hinges significantly on the perpetrator's *current* stance: denial vs. acknowledgment. Owning the deed publicly expresses a minimal respect for the moral order and the victims, breaking the conspiracy of silence. Severity matters (defining the class of wrongs), but *accountability* is measured by willingness to confront the truth.
      *   **Alternative License?** A purely act-focused retributivist view struggles. It prioritizes desert based on harm done, which the exchange rate explicitly subverts (a minor perpetrator who stays silent faces punishment, a major one who talks walks). Consequentialism (deterrence, prevention) *can* license it if truth-telling is valued highly enough for societal healing/stability. Restorative justice (focus on relationship repair) fits well, as confession is often the first step toward victim validation.

  3.  **Who Can Forgive/Waive?:**
      *   **Presupposition:** The authority to punish is held by the *political community* (via the state), acting as trustee for the *societal interest* in justice and order. Victims retain their moral claims and right to feel wronged, but the *legal right to punish* is a public good the state administers. It is not primarily about *forgiveness* (a personal, moral act belonging solely to the victim), but about *official pardon* and *political settlement*.
      *   **Mechanism:** The state (usually the successor) trades the *exercise* of its prosecutorial power (the right to punish) for the public good of truth and the chance for societal reconciliation. Reparations acknowledge the state cannot trade away the victim's suffering but can offer material and symbolic recognition.

  4.  **Collective Action & Responsibility:**
      *   **Presupposition:** Political wrongs are *systemic* and *authorized* (formally or informally) by a group (state, movement). This makes them suitable for a *political settlement* between the current legitimate representatives of the conflicting groups/society as a whole. Ordinary crimes lack this systemic, authorized dimension.
      *   **The Perpetrator:** The "follower" who discloses is treated as an *agent* of the system. His amnesty stems from his role *within* the political conflict being settled, not from his personal motives. His disclosure helps unravel the system's workings. He is held accountable *through* truth-telling, not excused.

  5.  **Epistemology (Official Truth):**
      *   **Presupposition:** Authoritative collective memory *is possible and necessary* for societal healing and non-repetition. Legal proof (beyond reasonable doubt for specific individuals) is insufficient for historical understanding. The commission, through investigative powers, victim testimony, and perpetrator disclosure, aims for a broader, contextualized *historical truth* about patterns, causes, and responsibilities.
      *   **State as Author:** The state endorsing the report signifies its acceptance of this history as the *foundational narrative* for the new political order. It presupposes the state has a unique responsibility and capacity to establish this narrative officially, distinct from courts focused on individual guilt.

  ### Coherence, Consistency, and Compatibility
  *   **Mutual Consistency?** The tension between severity and speech is real but navigated: Severity defines the *scope* of wrongs demanding extraordinary measures. The speech requirement defines the *currency* of accountability *within* that scope. The severity threshold acknowledges the gravity; the speech requirement addresses the specific harm of impunity/silence.
  *   **Strict Requirements vs. Fits:** The practice *strictly requires*:
      *   The distinct harm of denial/impunity.
      *   The state's authority to waive prosecution for public goods.
      *   The political/systemic nature of the covered wrongs.
      *   The necessity of an official, collective historical account.
      It *fits well* with restorative justice and certain consequentialist aims (healing, stability), but does not strictly require them. Retributivism struggles to justify the core exchange.
  *   **Underdetermined/Compatible Views:** A consequentialist (valuing peace/stability) and a restorative justice advocate (valuing relational repair) can readily endorse it. A skeptic about collective moral responsibility might still see it as a pragmatic *political* tool for dealing with systemic crimes. A retributivist could only accept it as a tragic necessity, not as justice.

  ### Your Friend's View: Punishment as the Debt
  If the presupposed view is wrong (no distinct harm in silence, state cannot waive victims' claims), the institution collapses in its current form. Here's what survives and what must change:

  1.  **Load-Bearing Features Lost:**
      *   Amnesty for full disclosure (core exchange).
      *   Prioritizing truth-telling over prosecution.
      *   The state trading prosecution for truth on behalf of the community.
      *   Official history superseding individual legal guilt.
  2.  **Features That Could Survive (as "Consolation"):**
      *   **Truth Commission Itself:** Renamed an "Historical Inquiry" or "Fact-Finding Body." Its purpose shifts from enabling amnesty/reconciliation to simply documenting events for the record, informing reparations, and memorialization. No power to grant legal immunity.
      *   **Reparations:** Still provided as acknowledgment of suffering and state obligation, separate from punishment.
      *   **Official Findings:** Still published, but presented as an *investigative report*, not the authoritative settlement of the past.
      *   **Non-Repetition Commitment:** Still possible.
  3.  **The New Practice:** Under your friend's view (society owes victims punishment):
      *   **Ordinary Prosecutions First:** Prioritize trials for the most responsible, using evidence wherever possible. Truth-telling might be encouraged for sentencing mitigation, not amnesty.
      *   **Limited Amnesty Later:** *After* prosecutions are exhausted or deemed impractical, a *political* decision for a *conditional* amnesty *might* be considered, but framed explicitly as a pragmatic concession for stability, *not* as justice or reconciliation. Confession might still be required, but it's a bureaucratic hurdle, not a moral exchange.
      *   **Reparations + Memorials:** Continue as acknowledgment, distinct from punishment.
      *   **Documentation Body:** As above, separate from amnesty.

  ### The Test Case: The Non-Evidentiary Hearing
  The designer insisting on this hearing reveals a crucial commitment:

  1.  **What It Shows:** This isn't about information; it's about **performative justice and recognition**. It presupposes:
      *   Victims have a *right to confront* their perpetrators (or representatives of the system that harmed them).
      *   Public acknowledgment requires *direct engagement*, not just a written record. The ritual itself has reparative value.
      *   The perpetrator must face the community/victims and *hear* the consequences of their actions, reinforcing the break from denial.
      *   Justice requires this *encounter*, this public reckoning, beyond the mere factual record.
  2.  **Whose Reading Survives?** **Yours.** Your friend's "bargain" reading struggles:
      *   The hearing adds no new value to the "deal" (truth was already bought). It seems inefficient, even risky (what if the perpetrator is defiant?).
      *   For your view, it's essential: It operationalizes the *recognition* owed to victims (confrontation) and forces the perpetrator's acknowledgment into the *public sphere*, making the break from silence tangible and communal. It embodies the presupposition that unacknowledged violence is an ongoing harm that requires this public ritual to begin healing. The hearing *is* part of the remedy, not just a condition of the bargain.

  **Conclusion:** Truth commissions presuppose a complex moral framework where the harm of silence and impunity is paramount, the state holds prosecutorial power in trust for societal interests, accountability is reframed through public acknowledgment, and collective healing requires an authoritative historical narrative established through a ritual of disclosure and confrontation. While containing pragmatic bargains, they are not reducible to them. Your friend's critique identifies a tension (severity vs. speech) but misses the core commitment to repairing the distinct injury of denial through a structured, state-sanctioned process of truth and recognition. The non-evidentiary hearing powerfully demonstrates that the institution values this performative, relational aspect of justice as deeply as the factual record itself.
