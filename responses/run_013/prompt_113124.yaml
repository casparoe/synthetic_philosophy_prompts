slightly above the barely worthwhile level in E. Thus, the view generates a new repugnant conclusion at L. The conditional addition view blocks the original slide to E by denying the Pure Addition Principle (specifically, at the step where adding people would push the average below L). It does not deny transitivity, nor does it arbitrarily reject E being better than A while accepting prior steps. Its repair is partial: it prevents the slide to E but invites a slide to D, which is similarly troubling. This exposes a dilemma: any threshold like L creates a cliff-edge where adding one more person—pushing the average infinitesimally below L—transforms an improvement into a non-improvement, which seems arbitrary. Ultimately, the conditional addition view fails to resolve the underlying tension and merely shifts the repugnance to a different point in the spectrum.",
