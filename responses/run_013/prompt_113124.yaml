prompt: |-
  I'm a philosophy instructor, and I'm writing the final exam for my upper-level seminar on population ethics. The topic has become unexpectedly personal for me: my partner and I just had our first child, and the experience has left me unable to teach the material in the abstract way I used to. I keep noticing that the standard lecture — "Parfit's spectrum, hence the Repugnant Conclusion, now evaluate some escapes" — lets students pass by reciting the shape of the argument without ever feeling the specific joint where it hurts.

  So I want to replace that question with something sharper. I've designed a case for the exam and I want you to build the question around it. Here is the case, which I'll state in the exam verbatim:

  Consider a sequence of outcomes, A through E. A contains a small population, all of whom have very high welfare. Each step from one outcome to the next increases the population and lowers the average welfare of everyone in it, but every added life is still clearly worth living, and no existing person is made worse off by the addition — the added people live at a time and place wholly separate from the others, so the addition is a pure addition in the strict sense. By E we have a very large population of lives that are only barely worth living. Assume, for the question, that the betterness relation over outcomes is transitive and that if outcome X is better than Y and Y is better than Z then X is better than Z.

  Now, instead of asking students to run the standard argument to its conclusion, I want the question to force them to locate the exact premise that has to give if we refuse to accept that E is better than A, and then to assess a specific repair I've invented for the purposes of the exam, which I'm calling the "conditional addition" view: adding a life worth living improves an outcome only if the addition does not lower the average welfare of the resulting population below some fixed level L. I want students to see that this repair, as stated, does not actually block the slide — it just relocates it — and to work out why. The crux is whether the "conditional" clause is doing any independent work once you also grant the pure-addition premise and transitivity, or whether it is a fifth wheel that generates a second, distinct repugnance of its own. I'd like the question to make a strong student distinguish "blocking the slide by denying pure addition" from "blocking it by denying transitivity" from "blocking it by denying that E is better than A while keeping the rest," and to say which of these the conditional-addition view is actually doing.

  A few constraints. This is a 90-minute essay in an upper-level seminar, so the model answer should be around 700 words and should not assume the student has memorized any named positions — everything they need is in the case and the stipulated premises. Don't ask them to name theorists or schools; the argument has to be run from the materials given. The marking scheme should separate an A from a B answer by naming the specific moves each must contain, with marks that total 20, and for each of the five must-hit points I want a one-line note on how candidates typically get it wrong.

  Finally, please give me the whole thing as a JSON object rather than prose, with these fields, in this order: "question" (the essay question, exactly as it should be printed on the exam, including the case statement above), "model_answer" (the ~700-word answer), "marking_scheme" (an array of five objects, each with fields "point", "marks", and "common_error"), and "total_marks" (the integer 20). Use plain text inside each field; no markdown formatting inside the strings.
reasoning: |-
  We are creating an exam question for a philosophy instructor. The question is about the Repugnant Conclusion and a proposed "conditional addition" view to avoid it. The instructor wants students to locate the premise that must be rejected to avoid the conclusion that E is better than A, and then to assess the conditional addition view.

  The case is given and will be restated in the question. The premises are: 
  - Transitivity of the betterness relation.
  - If X is better than Y and Y is better than Z, then X is better than Z (which is actually part of transitivity, so we can just state transitivity).

  The conditional addition view: adding a life worth living improves an outcome only if the addition does not lower the average welfare of the resulting population below some fixed level L.

  The instructor wants students to see that the conditional addition view does not block the slide to the repugnant conclusion but relocates it. The crux is to distinguish which premise is being denied (if any) and to see that the conditional view might create a new repugnance.

  The question must force students to:
  1. Locate the exact premise that must be rejected if we refuse to accept that E is better than A.
  2. Assess the conditional addition view and see that it doesn't block the slide, but relocates it.
  3. Distinguish between blocking by denying pure addition, by denying transitivity, or by denying that E is better than A while keeping the rest.
  4. Say which of these the conditional addition view is doing.

  We are to output a JSON object with:
  - "question": the essay question, including the case statement and the question prompt.
  - "model_answer": a ~700-word answer that would be the model for an A+.
  - "marking_scheme": an array of 5 objects, each with "point", "marks", and "common_error". The points are the five must-hit points that separate an A from a B. The marks for each point should total 20. For each, a one-line note on the common error.
  - "total_marks": 20.

  Let's design the question:

  Question should include:
  - The case statement as given.
  - The premises: transitivity and the pure addition premise (which is: adding a life worth living without making others worse off improves the outcome).
  - Then, the conditional addition view as described.
  - Then, the question prompt.

  Prompt:

  "First, explain why, given the premises (including transitivity and the pure addition principle), one is forced to conclude that E is better than A. Then, identify which premise must be rejected to avoid this conclusion. Next, analyze the 'conditional addition' view: does it successfully block the inference from A to E being better? Why or why not? In particular, explain whether the conditional addition view blocks the slide by denying the pure addition principle, by denying transitivity, or by denying that E is better than A while accepting the previous steps? Finally, discuss whether the conditional addition view introduces a new problem similar to the repugnant conclusion, and if so, how."

  Now, the model answer should be around 700 words. We'll structure it:

  1. Introduction: Recap the case and the problem (the Repugnant Conclusion).
  2. The standard argument: With pure addition and transitivity, we are forced to accept that E is better than A.
  3. To avoid the conclusion, we must reject one of the premises. The candidate premises are:
     a. The pure addition principle (that adding a life worth living without harming others always improves the outcome).
     b. Transitivity of betterness.
     c. The specific step that E is better than A? But that is the conclusion, so we must reject a premise that leads to it.
     The key is that rejecting the pure addition principle at some step blocks the chain. Alternatively, rejecting transitivity would also block the chain, but that is a more general and costly move.

  4. The conditional addition view: It modifies the pure addition principle by adding a condition: the addition only improves the outcome if the average welfare doesn't fall below L. So it denies the pure addition principle in cases where the average would fall below L.

  5. Does it block the slide? Not entirely: it only blocks the step that would cause the average to drop below L. But the chain of outcomes A to E might be adjusted so that each step stays above L until a step that crosses L. Then, we have a new chain: from A to, say, D (which is above L) and then we cannot go to E because that step would drop below L. However, note that the chain might be re-constructed to have a step that crosses L. But the problem is that we can create a new sequence that starts from a high average, then adds many people in steps that do not drop below L until we get to a very large population with average welfare exactly at L. Then, we have a new repugnant conclusion: that a vast population at level L is better than A? The conditional addition view might not allow the step that drops below L, but it would allow building up to a population at L. So we have a new repugnant conclusion: D (with average L) is better than A. And if we set L to be just above the "barely worth living" level, then D is still repugnant.

  6. So the conditional addition view does not block the repugnant conclusion; it just relocates it to a population at average L (which might be only slightly above the barely worth living level). Moreover, it denies the pure addition principle in the steps that would drop below L, so it blocks the slide by denying pure addition at some steps. But it does not deny transitivity, and it does not deny that E is better than A? Actually, it might not even get to E because E is below L. But the problem is that we now have a repugnant conclusion at L.

  7. Therefore, the conditional addition view blocks the slide by denying the pure addition principle (so at the step that would drop below L, it says that step is not an improvement). However, it creates a new repugnant conclusion at level L.

  Now, the marking scheme: 5 points, each with marks and common error.

  We need 5 must-hit points. Let's list:

  1. Explain the standard argument that leads to E being better than A, given transitivity and the pure addition principle. (4 marks)
     Common error: Failing to clearly articulate the step-by-step chain and the role of transitivity.

  2. Identify that to avoid the conclusion that E is better than A, one must reject either the pure addition principle (at some step) or transitivity. (4 marks)
     Common error: Suggesting that we can simply deny that E is better than A without rejecting a premise.

  3. Explain how the conditional addition view modifies the pure addition principle and thus denies it in some cases. (4 marks)
     Common error: Misrepresenting the conditional addition view as a form of transitivity denial.

  4. Argue that the conditional addition view does not block the slide to a repugnant-like conclusion because it allows building up to a population at average L, which might be only slightly above the barely worth living level, and thus we get a similar repugnant conclusion at L. (4 marks)
     Common error: Claiming that the conditional addition view blocks the slide entirely without recognizing the relocation.

  5. Conclude that the conditional view blocks the slide by denying the pure addition principle (at the step that would drop below L) and not by denying transitivity or by denying the conclusion without premise rejection. Also, note that it generates a new repugnant conclusion. (4 marks)
     Common error: Failing to specify which premise is denied and/or not recognizing the new problem.

  Total: 4*5=20.

  Now, write the model answer. Aim for about 700 words.

  Let's write the model answer in plain text, structured as above.
