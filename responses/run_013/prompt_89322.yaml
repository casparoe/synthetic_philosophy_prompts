prompt: |-
  I am preparing a graduate seminar that reads Nyāya epistemology alongside contemporary reliabilism and the epistemology of testimony, and for the opening session I want a verdict rather than a survey. Take the four sources of knowledge that Nyāya recognises — perception, inference, comparison or analogy, and verbal testimony — and rank them, in descending order, by how much evidential weight a careful knower ought to give to a single unconfirmed deliverance of each: one isolated perceptual episode, one inferential step, one accepted comparison, one report from a speaker of unknown reliability. Give me a number for each, expressed as a share of a fixed total, and justify each placement by naming the epistemic property that is doing the work — causal contact with the object, the reliability of the process, the availability of independent checks, or the presence or absence of defeaters. Do not average the tradition's rhetoric into a tie; if you think two of them come out equal, say so and say why that is not a cop-out.

  Then rank the same four a second time under a different background assumption: that a cognition is valid unless and until something undermines it, so that its validity is not established by any further means, such as the success of the action it prompts. I take the tradition to label that position svataḥ-prāmāṇya and the first, externally certified position parataḥ-prāmāṇya, but I would rather you correct my labels than defer to them. Say which ranking Nyāya itself would endorse, which ranking the schools holding the rival view would endorse, and, more interesting to me, whether the ordering of the four actually changes between the two rankings or whether only the weight of each shifts. If the ordering is stable, explain what that shows about the relation between a source's reliability and the separate question of how its validity is known.

  The tradition's list of candidate sources is longer than Nyāya's four. Postulation or implication, and non-apprehension — the means by which one is supposedly able to know an absence — are admitted as independent sources by some schools and refused by Nyāya. Tell me where each would land if inserted into your ranking, and whether Nyāya's refusal of them is a substantive epistemological decision or merely a consequence of how it draws the boundary around perception and inference.

  Finally, be explicit about the status of your own answer: mark which parts are settled among specialists in classical Indian epistemology, which are genuinely contested, and which are your own construction. I do not want a contested reading presented as the consensus, and I would rather have a shorter answer that keeps these registers separate than a longer one that blurs them.
reasoning: |-
  Hmm, this is a fascinating and challenging request about Nyāya epistemology. The user is preparing a graduate seminar comparing Nyāya with contemporary reliabilism and testimony epistemology, and wants a decisive ranking rather than a survey. 

  First, I need to recall the core Nyāya framework: the four pramāṇas (perception, inference, comparison, testimony) and the two theories of validity (svataḥ-prāmāṇya vs parataḥ-prāmāṇya). The user wants two distinct rankings under these validity theories, plus analysis of additional pramāṇas rejected by Nyāya.

  For the parataḥ-prāmāṇya ranking (external certification), I'm considering how each source fares when isolated and unconfirmed. Perception should rank highest due to direct causal contact - no mediating steps where error can creep in. Inference follows because while mediated, its formal structure provides constraints. Then testimony - even from unknown sources carries weight due to social necessity. Comparison (upamāna) seems most vulnerable as analogical. 

  For svataḥ-prāmāṇya (self-validity), the ranking might stay identical but weights shift upward since all get initial credence. The stability of the order would show that reliability is distinct from how validity is known - a crucial insight for the seminar.

  On the additional pramāṇas: arthāpatti (postulation) behaves like inference-lite, while anupalabdhi (non-apprehension) is tricky - Nyāya sees it as a perception/inference hybrid. Their exclusion seems substantive, not just taxonomic.

  I must flag where specialist consensus exists (e.g. perception's primacy) vs contested areas (exact testimony weight, interpretation of svataḥ). The user explicitly wants these boundaries marked - admirable scholarly rigor.

  The exercise reveals something deeper: Nyāya's empirical grounding vs other schools' more formal approaches. Maintaining the same pramāṇa ordering across validity theories subtly supports reliabilist views - perfect for sparking seminar debate.
answer: |-
  Here is a rigorously argued verdict, explicitly marking the epistemic grounds for each ranking, the stability of the order, the placement of additional *pramāṇas*, and the status of each claim:

  ### I. Ranking under *Parataḥ-Prāmāṇya* (Validity Externally Certified)
  *(Assumption: Validity must be established by external factors like causal efficacy, absence of defeaters, or independent confirmation.)*

  1.  **Perception (Pratyakṣa) - 40/100**
      *   **Epistemic Property:** **Direct Causal Contact** with the object (*viṣayendriyasaṁnikarṣa*).
      *   **Justification:** The unmediated causal link between sense faculty and object provides the strongest prima facie evidence. Error arises only from specific, identifiable defects (*doṣa*) in the sense organ, object, or conditions. A single, seemingly flawless perceptual episode (e.g., seeing a clearly defined, stationary cup in good light) carries significant inherent weight. Independent checks (*e.g.,* touching the cup) are readily available but its initial evidential force is high due to the causal mechanism.
  2.  **Inference (Anumāna) - 30/100**
      *   **Epistemic Property:** **Formal Reliability of the Process** (Adherence to *vyāpti* - universal concomitance).
      *   **Justification:** Inference relies on correctly grasping the invariable relation (*vyāpti*) between the mark (*liṅga*) and the inferable property (*sādhya*). A single, logically valid inferential step (*e.g.,* seeing smoke on a distant hill, recalling the universal "Where there's smoke, there's fire", inferring fire) has strong evidential weight *if* the *vyāpti* is sound. However, its weight is less than perception because it depends on the reliability of the recalled universal, which itself requires external validation (often perceptual). It's susceptible to errors in grasping *vyāpti* or misidentifying the mark.
  3.  **Verbal Testimony (Śabda) - 20/100**
      *   **Epistemic Property:** **Presumption of Speaker Reliability** (*Āptavākya*) in the absence of defeaters.
      *   **Justification:** Testimony's weight depends crucially on the speaker's competence and truthfulness. For an *unknown* speaker, Nyāya grants a baseline presumption of reliability (*āptatva*) unless there are specific defeaters (*bādhaka*), based on the social necessity of communication and the general tendency towards truth-telling. However, without *any* knowledge of the speaker's credentials (*e.g.,* a stranger making an ordinary claim), this presumption is relatively weak compared to perception/inference's grounding. Independent verification is often less immediate.
  4.  **Comparison (Upamāna) - 10/100**
      *   **Epistemic Property:** **Reliance on Memory & Analogy**, **Vulnerability to Defeaters**.
      *   **Justification:** Upamāna involves recalling a known object (e.g., a cow), perceiving similarity in a new object (e.g., a gavaya), and forming the cognition "This is like that." A single instance (*e.g.,* someone says "A gavaya is like a cow") carries the least inherent evidential weight. It depends heavily on the accuracy of memory and the validity of the perceived similarity, both prone to error. It's easily undermined by closer examination revealing dissimilarities. Its primary function is identification via resemblance, not foundational justification.

  ### II. Ranking under *Svataḥ-Prāmāṇya* (Intrinsic Validity)
  *(Assumption: All cognitions are *prima facie* valid; invalidity requires external demonstration via defects or defeaters.)*

  *   **Stable Order:** **Perception > Inference > Testimony > Comparison** (Order does *not* change).
  *   **Weight Shift:** The absolute weight increases significantly for *all* sources under *svataḥ-prāmāṇya*. Each unconfirmed deliverance now starts with a presumption of validity. Perception might jump to 60/100, Inference to 45/100, Testimony to 35/100, and Comparison to 20/100, reflecting this initial credit. The *relative* differences, however, largely persist.
  *   **Nyāya Endorsement:** Nyāya explicitly rejects *svataḥ-prāmāṇya*. It endorses the *Parataḥ* ranking and its grounding in external certification.
  *   **Rival Endorsement:** Mīmāṃsā (especially Pūrva Mīmāṃsā regarding Vedic testimony) and Advaita Vedānta endorse *svataḥ-prāmāṇya*. They would endorse the *Svataḥ* ranking with its higher initial weights but the *same order*.
  *   **Epistemic Significance of Stable Order:** The stability of the ranking demonstrates that the **intrinsic reliability** (grounded in the causal mechanism, formal structure, or social pragmatics of the source) is distinct from the **mode of knowing its validity**. Even under *svataḥ-prāmāṇya*, where validity is presumed, the *evidential weight* assigned to an unconfirmed deliverance still reflects the perceived inherent trustworthiness of the *pramāṇa*'s causal process. A perceptual cognition is *presumed* valid *and* carries more inherent weight than testimony from an unknown speaker, also presumed valid. Reliability influences the degree of initial credibility, separate from how invalidity is known.

  ### III. Additional *Pramāṇas*: Placement and Nyāya's Refusal

  1.  **Postulation/Implication (Arthāpatti):**
      *   **Placement:** Would rank **between Inference and Testimony** (around 25/100 under *Parataḥ*, higher under *Svataḥ*). Its weight stems from resolving an otherwise inexplicable contradiction (*e.g.,* "Devadatta is fat but doesn't eat during the day" implies "He eats at night"). It relies on the reliability of the initial cognitions and the logical necessity of the implication. Nyāya argues this is just a form of inference (*tātparya-anumāna*).
  2.  **Non-Apprehension (Anupalabdhi):**
      *   **Placement:** Would rank **variably, but often near Perception or Inference**. Its weight depends on the conditions for valid non-perception (*e.g.,* knowing the absence of a jar in an empty, well-lit room). Under ideal conditions, it can be strong (30-35/100 under *Parataḥ*), as the absence itself is treated as a knowable object. Nyāya fiercely argues this is either a form of perception (cognizing the bare ground as qualified by absence) or inference (based on the absence of perception when conditions *should* allow it).

  *   **Nyāya's Refusal: Substantive Epistemological Decision:** Nyāya's refusal of *arthāpatti* and *anupalabdhi* as independent *pramāṇas* is **not merely taxonomic**. It reflects a core commitment:
      *   **Reductionism:** Nyāya seeks to ground all knowledge in either direct causal contact (perception) or reliable, formalizable relations (inference, including analogy and testimony when analyzed). It sees *arthāpatti* as inferential reasoning and *anupalabdhi* as a perceptual or inferential fact about the absence of perception under specific conditions.
      *   **Causal Criterion:** Nyāya emphasizes a causal story linking the knower to the object known. Perception has direct causal contact, inference relies on the causal relation embedded in *vyāpti*, testimony relies on the causal chain originating with a reliable speaker's perception/inference. *Arthāpatti* and *anupalabdhi* are seen as lacking this specific causal grounding *sui generis*; their causal chain is parasitic on perception/inference. This refusal is a significant philosophical stance against rivals like Mīmāṃsā and Advaita.

  ### IV. Status of Claims: Consensus, Contested, Construction

  *   **Strong Consensus:**
      *   Nyāya's four *pramāṇas* and their definitions.
      *   Nyāya's staunch rejection of *svataḥ-prāmāṇya* (*parataḥ-prāmāṇya* is core Nyāya doctrine).
      *   Perception as the primary and most foundational *pramāṇa*.
      *   Comparison (*upamāna*) being the least foundational/weighty of the four.
      *   Nyāya's reductionist arguments against *arthāpatti* and *anupalabdhi* as independent sources.
      *   The core *justifications* for each *pramāṇa*'s validity within Nyāya (causal contact for perception, *vyāpti* for inference, *āptatva* for testimony, memory/similarity for comparison).

  *   **Genuinely Contested:**
      *   The *exact* relative weighting between Inference and Testimony under *parataḥ-prāmāṇya*. While both rank below perception, some Nyāya texts/commentators might give inference a slightly stronger edge over testimony than others, depending on emphasis on formal logic vs. social pragmatics. (This verdict gives Inference a clear, though not massive, lead).
      *   The precise interpretation and scope of *āptatva* (presumption of reliability) in testimony, especially for secular/unknown speakers. How strong is the baseline presumption?
      *   The exact nature of *anupalabdhi* and whether Nyāya's perceptual or inferential reduction is more convincing. (Nyāya scholars agree on the reduction, but debate its exact mechanism).
      *   The interpretation of *svataḥ-prāmāṇya* in rival schools (e.g., scope, strength of presumption).

  *   **My Construction:**
      *   **The specific numerical weights.** While grounded in the relative arguments found in Nyāya texts, assigning exact percentages is an interpretive synthesis to meet your request for a decisive verdict.
      *   **The explicit claim of *absolute stability* in the *ordering* under both *svataḥ* and *parataḥ*.** While the arguments strongly support this (the core reliability factors remain constant), explicitly stating the order *never* changes under the different validity theories is a conclusion drawn from the analysis, emphasizing the reliability/validity-knowing distinction. Some scholars might quibble about nuances.
      *   **The placement weight estimates for *arthāpatti* and *anupalabdhi*.** These are reasoned estimates based on their typical epistemological treatment in schools that accept them and Nyāya's critiques.
      *   **The formulation "evidential weight a careful knower *ought* to give".** This phrasing synthesizes Nyāya's normative epistemology ("ought") with the focus on the initial, unconfirmed deliverance ("careful knower" implies awareness of potential defects but no active defeaters yet).

  This verdict prioritizes Nyāya's internal logic and argumentative structure, clearly differentiating settled foundations from interpretive choices and contested points, providing a firm platform for your seminar debate.
