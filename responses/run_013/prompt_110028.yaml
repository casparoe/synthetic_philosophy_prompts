answer: |-
  You're conflating two things: the *content* of the evidence and the *form* of the constraint it imposes. The radio operator didn't say "I think you're in Red." He provided a specific probabilistic *relationship*: **conditional on being in Red**, her probability of being in Second Company is 3/4. That's not evidence *about* Red itself; it's a constraint on how her credence *should distribute* within the Red territory. 

  Minimizing Kullback-Leibler divergence subject to *this exact constraint* is the uniquely justified way to update while respecting two principles: 1) You incorporate the *precise* information given (the conditional probability), and 2) You change your beliefs *as little as possible* otherwise. It's not mere "convention"; it's minimizing the introduction of unwarranted information. Why *should* this constraint alter her credence in Red? The message doesn't provide any new direct evidence for or against Red – it only instructs her how to redistribute her belief *within* Red if she *is* there. Forcing P(Red) to change would be *adding* information not present in the message. The operator mentioning "Red" establishes the antecedent for the conditional; it isn't an assertion that the antecedent is true. Your "reductio" assumes the message *does* provide evidence for Red, but that's reading into it something that simply isn't there. The infomin rule rigorously respects the evidence *as given*.

