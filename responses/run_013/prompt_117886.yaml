  New Zealand's decriminalization is philosophically cleanest - it makes no intrinsic judgment. The harm comes purely from bad working conditions, so folding it into standard labor law follows logically. 

  Wait, the user also asks about underdetermination - where multiple theories could support the same policy. That's subtle. For example, both feminist abolitionism and religious conservatism could back the Nordic model despite different root philosophies. 

