answer: |-
  Here's a breakdown of the implicit theories underpinning each prostitution regime, addressing your core questions about harm, consent, agency, and law's purpose, followed by analysis of presuppositions, underdetermination, and the empirical/conceptual divide:

  **I. Implicit Theories of Each Regime:**

  1.  **Nordic Model (Sweden):**
      *   **Locus of Wrong:** **Primarily in the *buying* of sex.** Prostitution is seen as intrinsically exploitative and harmful, fundamentally rooted in gender inequality and male sexual dominance. The act of purchase *itself* is the core wrong, creating an inherently coercive power dynamic that contaminates consent.
      *   **Consent:** **Law cannot trust consent in the paid sexual context.** The power imbalance and economic pressure inherent in the buyer-seller relationship mean that consent cannot be truly free or meaningful. Paid sex ≠ consensual sex in the mutual, non-transactional sense.
      *   **Agency:** **Sellers are victims/survivors whose choices are constrained by structural factors (poverty, trauma, trafficking, patriarchy).** The state should override market demand (by criminalizing buyers) to protect sellers from exploitation and reduce their vulnerability, even if it means limiting their immediate economic choices. Supporting exit strategies is key.
      *   **Law's Aim:** **Deterrence through stigma and demand reduction.** Criminalizing buyers aims to stigmatize the act of purchasing sex, reduce overall demand, shrink the market, and thereby reduce trafficking and exploitation. Harm reduction focuses on supporting sellers exiting the trade.
      *   **Presuppositions:** Buying sex is intrinsically morally wrong and exploitative; true consent is impossible under conditions of economic necessity and gendered power imbalance; sellers are primarily victims needing state protection from harm caused by buyers and the market itself.

  2.  **Regulated Legalization (Germany/Netherlands):**
      *   **Locus of Wrong:** **Primarily in the *working conditions* and lack of regulation.** Prostitution itself is not intrinsically immoral, but it is an inherently *risky* activity prone to exploitation, violence, disease, and trafficking if left unregulated. The wrong lies in the harms arising from illegality and poor conditions.
      *   **Consent:** **Consent is possible but *fragile* and requires safeguarding.** While paid sex is treated as a service, the state recognizes the unique vulnerabilities involved. Consent is treated as *continuous with other risky jobs* but needing specific, heightened legal protections due to the intimate nature of the work.
      *   **Agency:** **Sellers are *both* workers exercising autonomy *and* potentially vulnerable individuals.** The state should support their autonomy by providing a legal framework for safe work (like other jobs) *while* recognizing specific vulnerabilities and implementing protective measures (health checks, safety regulations, access to support). Assumes many, but not all, choose freely.
      *   **Law's Aim:** **Harm reduction through visibility and regulation.** Legalization brings the trade into the open, allowing the state to impose health/safety standards, tax the industry, control location (brothels/zoning), monitor for trafficking/exploitation, and improve workers' access to rights and protections.
      *   **Presuppositions:** Prostitution is inevitable ("the oldest profession"); regulation can effectively mitigate inherent risks; consent can be meaningful within a regulated framework; sellers are workers deserving of labor rights *and* individuals needing specific protections due to the nature of the work; the state can manage the trade effectively.

  3.  **Decriminalization (New Zealand):**
      *   **Locus of Wrong:** **Nowhere intrinsic. Exclusively in *coercion, exploitation, and poor working conditions*.** Selling sex is labor. The moral wrong lies only in violations of consent (assault, rape) and labor rights (exploitation, unsafe conditions, trafficking) – harms common to many jobs, not unique to sex work.
      *   **Consent:** **Paid sexual agreements are treated as continuous with consent in *any other job*.** Consent to specific acts is paramount and must be respected, just like boundaries in any service job. The presence of payment does not inherently invalidate consent. Robust consent frameworks are applied.
      *   **Agency:** **Sellers are *workers* exercising autonomy.** The state should support their agency by removing criminal penalties and extending full labor rights and protections. The state respects their choices and aims to empower them, not "rescue" them against their will. Focus on worker empowerment and collective organizing.
      *   **Law's Aim:** **Harm reduction through empowerment, rights, and normalization.** Decriminalization removes stigma and fear of police, allowing workers to report crimes, access justice, negotiate safer conditions, organize collectively, and access health/social services without fear. Law aims to treat sex work like other work.
      *   **Presuppositions:** Sex work *is* work; the primary harms stem from criminalization and lack of rights, not the act itself; consent is separable from payment and can be valid; sellers are capable agents entitled to self-determination and labor protections; stigma is a major driver of harm.

  **II. Presuppositions vs. Compatibility:**

  *   **Nordic Model:**
      *   **Strictly Presupposes:** The intrinsic wrongness of *buying* sex and the inherent impossibility of meaningful consent in the buyer-seller transaction. **The asymmetry *requires* this core moral claim.** Without it, criminalizing only buyers makes little sense.
      *   **Compatible With:** Feminist abolitionism (prostitution as patriarchal violence), religious views on sexual morality, specific theories of commodification harm. *Could* potentially be argued (less convincingly) as a purely pragmatic harm-reduction strategy *if* buyer criminalization is empirically proven to be the *only* effective way to reduce trafficking/exploitation, but this strains against the model's stated rationale and inherent asymmetry.

  *   **Regulated Legalization:**
      *   **Strictly Presupposes:** That prostitution is an activity with *inherently heightened risks* requiring *specific state regulation* beyond standard labor law. This justifies the unique licensing, zoning, and mandatory health checks not applied to other jobs.
      *   **Compatible With:** Pragmatism ("manage the inevitable"), a belief that regulation can "clean up" the trade and separate "voluntary" from "coerced" work (a distinction the NZ model rejects as unworkable), a view that sex work is legitimate but "dirty" or morally ambiguous, or a view that sellers are autonomous workers *in need of extra protection* due to vulnerability. The tension between legitimacy and presumptive damage is inherent but *managed* through regulation – the state accepts the legitimacy of the *trade* while acknowledging the *individuals* within it may need support/protection due to the nature of the work or their personal circumstances.

  *   **Decriminalization (NZ):**
      *   **Strictly Presupposes:** That the *only* relevant harms are those common to labor exploitation and violence, not intrinsic to the sexual nature of the service. Therefore, *no special legal category* is needed or justified.
      *   **Compatible With:** Strong labor rights perspectives, harm reduction focused on stigma removal, sex-positive feminism, libertarian views on bodily autonomy and contract. It is philosophically coherent without needing to assert that sex work is "just like any other job" in every social respect, only that it should be treated *legally* as such. It rejects the need for inherent risk as a justification for unique regulation.

  **III. Philosophical Underdetermination:**

  *   **Nordic Model:** Could be supported by diverse theories of harm: radical feminist (male violence/patriarchy), neo-abolitionist (modern slavery), religious (sin/commodification), or even certain public health arguments (if demand reduction is seen as the only way to curb disease/trafficking spread). The core underdetermined aspect is the *specific theory* of why buying is intrinsically wrong, but the model *requires* *some* intrinsic wrongness claim.
  *   **Regulated Legalization:** Could be justified by diverse views on vulnerability: paternalism (state knows best), pragmatic welfarism (reduce measurable harms), or even a belief that regulation empowers workers by giving them legal status and recourse. The specific *balance* between autonomy and protection is flexible within the model's framework.
  *   **Decriminalization:** Primarily underdetermined in its *broader political philosophy*. It fits seamlessly with strong liberal commitments to autonomy and contract, but could also be supported by utilitarian arguments (empirically best reduces harm) or social democratic commitments to universal labor rights.

  **IV. Empirical vs. Conceptual Dispute:**

  *   **Genuinely Empirical Questions (Contentious & Data-Dependent):**
      *   Does criminalizing buyers (Nordic) significantly reduce overall demand for prostitution?
      *   Does it reduce trafficking and exploitation, or drive it further underground?
      *   Does legalization/regulation (Germany/NL) effectively reduce violence, improve health outcomes, increase reporting of crimes, and control trafficking compared to criminalization or decriminalization?
      *   Does decriminalization (NZ) lead to better health, safety, and empowerment outcomes for workers compared to the other models? Does it increase the size of the industry?
      *   What are the impacts of each model on surrounding communities (nuisance, crime)?
      *   How effective are exit programs (Nordic) vs. workplace organizing/rights enforcement (NZ)?

  *   **Core Conceptual/Irreconcilable Differences:**
      *   **Is buying sex intrinsically wrong?** (Nordic Yes vs. Legalization/NZ No)
      *   **Is meaningful consent possible in a paid sexual transaction?** (Nordic: No / Legalization: Fragile, needs safeguarding / NZ: Yes, like other work)
      *   **Is prostitution fundamentally labor or exploitation?** (NZ: Labor / Legalization: Risky Labor / Nordic: Exploitation)
      *   **Primary Goal:** Deterrence/Demand Reduction (Nordic) vs. Harm Reduction/Management (Legalization) vs. Rights Normalization/Empowerment (NZ)
      *   **View of Seller Agency:** Victim needing rescue (Nordic) vs. Worker needing protection *and* autonomy (Legalization) vs. Worker entitled to autonomy and rights (NZ)

  **V. Swapping Governing Views:**

  *   **If Nordic adopted the "No Intrinsic Harm" view (NZ):** It would collapse. Criminalizing *only* buyers makes no sense if the purchase isn't inherently wrong. It might shift to full decriminalization or perhaps symmetrical criminalization (which it rejects as harmful to sellers).
  *   **If Nordic adopted the "Harm is only in Conditions" view (Legalization):** It would likely shift towards a legalization/regulation model, abandoning buyer criminalization in favor of brothel licensing, health checks, etc., to manage the "inherent risks."
  *   **If Legalization adopted the "Intrinsic Wrong in Buying" view (Nordic):** It would be incoherent. Licensing and regulating an activity deemed intrinsically wrong and exploitative is contradictory. It would likely shift towards abolitionism/Nordic model.
  *   **If Legalization adopted the "No Intrinsic Harm, Only Conditions" view (NZ):** It would logically move towards decriminalization, removing the special regulatory framework (mandatory health checks, licensing regimes) and integrating sex work fully into standard labor and contract law.
  *   **If NZ adopted the "Intrinsic Wrong in Buying" view (Nordic):** It would necessitate abandoning decriminalization and likely adopting buyer criminalization (Nordic model) or full criminalization.
  *   **If NZ adopted the "Inherent Risks Require Special Regulation" view (Legalization):** It would shift towards a legalization/regulation model, introducing specific prostitution-focused laws for licensing, zoning, health checks, arguing standard labor law is insufficient for the unique risks.

  In essence, the Nordic model's asymmetry is inseparable from its core claim of intrinsic wrongness in buying. Legalization's regulatory structure assumes inherent risks justifying state intervention beyond standard labor law. Decriminalization's coherence relies on rejecting both intrinsic harm and the need for unique regulation. The empirical disputes are crucial for evaluating outcomes *within* each model's framework, but the choice of framework itself rests on fundamentally different, often irreconcilable, philosophical premises about sex, work, consent, and harm.
