  - **"Impossible" (Alex's view):** Physical. The supertask cannot be performed in reality, so there is no lamp at noon to have a state. The question is moot.
  They are not the same. "No fact" implies the model is valid but underspecified; "impossible" rejects the model for physics. In the toggle case, both can be true: mathematically underdescribed, physically unrealizable.

  **Is there a version of the toggle case where the answer is determinate? If so, what does that show?**  
  Yes, but it requires modifying the setup to force convergence. For example:
