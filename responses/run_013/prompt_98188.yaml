  2. The participants may not reason with SIA or SSA. They might use other heuristics. For example, they might think: "I exist, so maybe the universe is large because that's more likely to have me?" (which is SIA) or "The coin is fair, so 50-50" (SSA). But that's what we want.

  3. If in the T world, the participants might notice that there are 10 of them? But we instruct them not to communicate and to make their bet individually. We can have them write their bet on a piece of paper privately. We also instruct them that they cannot reveal their letter until after the reveal.

  4. The payoff scheme might be confusing. We should explain it clearly.

  5. The participants might not understand why they should care about points. We can make it a competition.

  6. Time: we have 90 minutes. This activity might take 20-30 minutes.

  Features it can't reproduce: 
     - In the real SIA vs SSA debate, the observers are not selected from a fixed pool (like the 14 participants). In our setup, we are using a fixed pool of 14 potential observers, but in the actual thought experiment, the potential observers are not limited. 
     - The infinity extension: we cannot practically simulate an infinite universe.

  But we can discuss after the game: what if the coin was between 1 observer and a very large number? Or between 1 and infinity? Then SIA would make you almost certain of the large universe.

  We can also mention that in the identity-based version (which we didn't do) there is the Doomsday argument (which uses SSA with identity to argue we are more likely to be in a small universe).

  This activity will illustrate the core difference: SIA weights worlds by the number of observers, while SSA does not.

  Let me write the instructions for the instructor.

  **Materials needed:**
  - A coin (or a random number generator).
  - 14 envelopes.
  - Slips of paper: 
     - For the "existing" observers: 
          In H: one slip that says: "You exist. There is 1 observer in the universe."
          In T: ten slips that say: "You exist. There are 10 observers in the universe." 
          (Alternatively, we can make the slips identical: "You exist." and we verbally tell them the setup? To avoid revealing the number.)
     - For non-existing: "You do not exist in this universe. Please wait quietly."
  - A hat or container to draw names (if you have participant names) or numbers (if you assign numbers).

  **Preparation:**
  - Assign each participant a number (1 to 14) or use their names.

  **Game rules:**

  1. The instructor flips a coin in secret:
     - Heads: universe has 1 observer.
     - Tails: universe has 10 observers.

  2. The instructor selects the observers:
     - If heads: randomly select one participant to be the observer. Give that participant the envelope with the "existing" slip. Give the other 13 the "non-existing" envelopes.
     - If tails: randomly select 10 participants to be observers. Give them the "existing" slips in envelopes. Give the other 4 the "non-existing" envelopes.

  3. All participants receive an envelope. They are told not to open until instructed.

  4. The instructor says: "If your envelope says you exist, please open it now. If it says you do not exist, please wait quietly and do not open it yet. You will not participate further."

  5. To the existing observers: "You know: a fair coin was flipped. Heads would mean there is 1 observer in the universe. Tails would mean there are 10 observers. You do not know the outcome of the coin flip. You are to bet on whether the coin was heads or tails. Write your bet on a piece of paper."

  6. Explain the payoff: 
     - If you bet heads and it was heads, you score 10 points.
     - If you bet heads and it was tails, you score 0 points.
     - If you bet tails and it was tails, you score 2 points.
     - If you bet tails and it was heads, you score 0 points.

  7. Collect the bets.

  8. Reveal the coin flip and announce the actual number of observers.

  9. Calculate the scores.

  **Debrief:**

  - Ask participants why they bet the way they did.
  - Explain SSA: "Some of you might have thought: the coin is fair, so it's 50-50. Then, since the payoff for heads is higher (10 vs 2), you bet heads. This is in line with the Self-Sampling Assumption: you are a random observer from the actual world, and your existence doesn't change the prior."
  - Explain SIA: "Others might have thought: if the universe has more observers, then I am more likely to exist. So tails (10 observers) is more likely. Even though the payoff for tails is lower, the probability is high enough (10/11) to make it better. This is the Self-Indication Assumption: a world with more observers is more likely because it makes your existence more likely."
  - The presumptuous philosopher: "If we extend SIA to a universe that could be very large, say with a trillion observers, then we would be virtually certain that the coin was tails. And if we consider the possibility of an infinite universe, SIA would say it must be infinite because that makes your existence infinitely more likely? But that seems presumptuous! Hence the name."

  **What might go wrong:**

  - **Disappointment:** The non-existing participants might feel left out. Mitigation: involve them in the discussion or have them help record bets.
  - **Communication:** Participants might try to count how many others are opening envelopes. Mitigation: instruct them to open privately and not to communicate.
  - **Confusion:** Some might not understand the payoff. Mitigation: write the payoff scheme on the board.
  - **Time:** The selection process might take time. We have to randomly select 1 or 10 out of 14. We can have a list of random numbers prepared or use a quick lottery method.
  - **Identity in the existing slips:** If the existing slips say "There are 10 observers", then in the T condition, the participants know there are 10. So we must not reveal the number on the slip. Instead, the slip should simply say "You exist." The information about the possible worlds (1 or 10) should be given verbally to everyone at the start and reiterated to the existing observers.

  So change the existing slips to: "You exist." (nothing else). Then verbally tell the existing observers: "Remember, the coin flip was such that heads would have meant 1 observer, tails 10 observers. You do not know the outcome."

  This way, they don't learn the actual number from the slip.

  Final note: This activity does not involve the specific identity version of the Doomsday argument (which requires conditioning on having a specific birth rank). But that's a different argument. We are focusing on the core difference between SSA and SIA without identities.

  This should work.
answer: |-
  Below is a complete design for your in-class game, tailored to illustrate the split between the Self-Sampling Assumption (SSA) and Self-Indication Assumption (SIA), culminating in the "presumptuous philosopher" revelation. I've addressed runnability, materials, payoffs, debrief, and potential pitfalls. The language follows British English conventions.

  ---

  ### **Game Title:** The Observer's Wager  
  **Objective:** Participants experience the SSA/SIA split by betting on a coin flip determining universe size (1 or 10 observers), using payoffs that incentivise opposite bets under each assumption. The finale reveals how SIA leads to the "presumptuous philosopher" problem.

  **Materials Needed:**  
  - A coin (physical or digital).  
  - 14 envelopes.  
  - Slips of paper:  
    - 10 slips: "You exist. [Do not reveal this to others]."  
    - 4 slips: "You do not exist in this universe. [Sit quietly]."  
  - A blackboard/whiteboard or screen to display rules and payoffs.  
  - Paper and pens for bets.  
  - Token system (e.g., tally points for bragging rights, not real money).  

  **Time Allocation:** 20-25 minutes (setup: 5 min; betting: 5 min; reveal/debrief: 10-15 min).

  ---

  ### **Game Rules & Procedure**  
  **Step 1: Setup (Instructor Only)**  
  - Secretly flip a coin:  
    - **Heads (H)**: Universe has **1 observer**.  
    - **Tails (T)**: Universe has **10 observers**.  
  - Based on the result:  
    - **If H**: Randomly select **1 participant** to receive an "You exist" slip. Give the other 13 "do not exist" slips.  
    - **If T**: Randomly select **10 participants** to receive "You exist" slips. Give the remaining 4 "do not exist" slips.  
  - Place slips in envelopes and distribute them randomly (so no one knows others' status).  

  **Step 2: Introduction (Whole Group, 2 min)**  
  Explain:  
  > "A coin was flipped to decide the universe: heads means 1 observer, tails means 10. You've received an envelope revealing whether you exist here. If you exist, you are one observer and don't know the total number. You must bet on the coin outcome. Payoffs are:  
  > - **Bet Heads & correct**: Win **10 tokens**.  
  > - **Bet Heads & wrong**: Win **0 tokens**.  
  > - **Bet Tails & correct**: Win **2 tokens**.  
  > - **Bet Tails & wrong**: Win **0 tokens**.  
  > Non-existent observers sit out quietly—their role is to keep the universe size hidden."  

  **Step 3: Betting Phase (Existing Observers Only, 5 min)**  
  - Existing observers open envelopes privately (non-existent do not open theirs).  
  - They reason and write their bet (H or T) on paper. Collect all bets.  
  - **Key instruction**: "Do not discuss or reveal your existence status. You know only that you exist—not how many others do."  

  **Step 4: Reveal & Scoring (Whole Group, 5 min)**  
  - Announce the coin result and universe size.  
  - Ask existing observers to raise hands:  
    - **If H**: Only 1 should raise.  
    - **If T**: 10 should raise.  
  - Score bets publicly using tokens (e.g., tally on board).  

  ---

  ### **Why the Payoffs Split SSA and SIA**  
  The payoff scheme (H: 10 tokens, T: 2 tokens) exploits how SSA and SIA weight probabilities:  
  - **SSA (Self-Sampling Assumption)**:  
    - You reason you’re a random observer from the *actual* universe.  
    - Prior probability of H or T is 50% (fair coin). Your existence doesn’t update this—it’s equally likely in both universes.  
    - **Betting incentive**: H pays 10 tokens (high reward) vs. T pays 2 (low reward). With 50% odds, expected payoff for H is higher:  
      - H: \(0.5 \times 10 = 5\) tokens  
      - T: \(0.5 \times 2 = 1\) token  
    → **SSA predicts betting HEADS**.  

  - **SIA (Self-Indication Assumption)**:  
    - You reason your existence *indicates* a larger universe (more observers = more "slots" to exist).  
    - Probability of T is \(10/11\) (10 observers) vs. H is \(1/11\) (1 observer).  
    - **Betting incentive**: T has high probability (10/11) despite low payoff. Expected payoff:  
      - H: \((1/11) \times 10 \approx 0.9\) tokens  
      - T: \((10/11) \times 2 \approx 1.8\) tokens  
    → **SIA predicts betting TAILS**.  

  This forces a conflict: SSA favours H (high payoff with neutral odds), SIA favours T (modest payoff with high odds).  

  ---

  ### **Debrief & Link to Presumptuous Philosopher (10 min)**  
  1. **Discuss observed bets**:  
     - Ask participants why they chose H or T. Many will voice SSA-style reasoning ("coin is fair, so 50-50") or SIA-style ("I exist, so probably a big universe").  
     - Highlight the split: SSA players bet H, SIA players bet T.  

  2. **Map to formal distinctions**:  
     - **SSA**: Treats you as a random sample from *actual* observers. No update from existence—prior dominates. Formula:  
       \[
       P(\text{H} | \text{I exist}) = P(\text{H}) = 0.5
       \]  
     - **SIA**: Treats existence as *evidence* for larger universes. Updates prior by number of observers. Formula:  
       \[
       P(\text{H} | \text{I exist}) = \frac{P(\text{H}) \times 1}{P(\text{H}) \times 1 + P(\text{T}) \times 10} = \frac{0.5}{0.5 + 5} = \frac{1}{11}
       \]  

  3. **Spring the presumptuous philosopher**:  
     - "SIA doesn't stop at 10 observers. Suppose the coin chose between 1 observer and 1 trillion observers. SIA says \( P(\text{trillion}) \approx 1 \)—your existence alone 'proves' a vast universe. If we allow infinite observers, SIA insists \( P(\text{infinite}) = 1 \). This seems absurdly presumptuous! Hence the thought experiment: **Can we really infer universe size just from existing?**"  
     - Tie back: The game’s SIA bet mirrors this leap—betting T is a "small" version of presuming bigness.  

  ---

  ### **Predictable Problems & Limitations**  
  **What will go wrong (and how to mitigate):**  
  1. **Non-existent participants feel excluded**:  
     - Mitigation: Frame them as "hidden observers" critical to the experiment. Involve them in tallying scores.  
  2. **Participants infer universe size**:  
     - Risk: Existing observers might count raised hands during betting.  
     - Mitigation: Stress privacy ("keep envelopes closed, bet silently"). Use envelopes for bets to prevent signalling.  
  3. **Confusion over probabilities**:  
     - Risk: Some may misapply Bayes' theorem or question payoffs.  
     - Mitigation: Simplify explanations (use the formulas above). Pre-write payoff rules on the board.  
  4. **Time pressure**:  
     - Mitigation: Assign 1–2 helpers to distribute materials swiftly.  

  **What the activity can’t reproduce:**  
  - **Infinity in practice**: You can’t simulate infinite observers, so the "presumptuous philosopher" remains a verbal leap.  
  - **Full reference-class problem**: Real SSA/SIA debates involve ambiguous observer classes (e.g., sentient AI, aliens). The game fixes observers as humans.  
  - **No real identity conditioning**: Unlike the Doomsday Argument, observers here lack "birth ranks" (e.g., being "observer 7" in a 10-observer world). This simplifies the SSA case.  

  ---

  ### **Instructor Notes**  
  - **Why this works**: The payoff imbalance (10 vs. 2 tokens) makes the SSA/SIA split visceral—players feel the tension between "safe" high-payoff bets (SSA) and "likely" low-payoff bets (SIA).  
  - **Post-game discussion prompt**: "If SIA says a bigger universe is more probable, does that mean we live in a multiverse? Or is this reasoning flawed?"  
  - **Resources for depth**: Recommend Nick Bostrom’s *Anthropic Bias* (Ch. 6–7) or Arif Ahmed’s "Sleeping Beauty" papers for follow-up.  

  This design ensures a hands-on, debate-sparking session. With clear rules and controlled chaos, it should leave your group arguing long after the coin is revealed! Good luck.
