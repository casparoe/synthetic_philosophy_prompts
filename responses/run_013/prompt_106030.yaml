answer: |-
  ### Workshop Proposal: Question-Indexed Epistemic Commitments and the Problem of Logical Omniscience  

  #### I. Central Question  
  Can epistemic closure principles be preserved as norms of *rational commitment* when indexed to an agent’s live questions—distinguishing them from models of inferential performance or explicit endorsement—to resolve the problem of logical omniscience without collapsing into existing solutions?  

  #### II. Motivation: The Core Disconnect  
  Standard epistemic logic treats knowledge as closed under entailment, demanding agents know all logical consequences of their beliefs. This clashes with bounded rationality: humans fail to grasp complex entailments despite competence. Existing solutions (e.g., impossible worlds, awareness predicates, fragmented agents, or procedural inference) address symptoms but "change the subject" by:  
  - **Relocating the failure**: Impossible worlds sacrifice logical coherence; awareness predicates outsource omniscience to external constraints.  
  - **Conflating distinct phenomena**: Modeling *performance* (e.g., step-wise inference) or *endorsement* (explicit assent) obscures the normative force of *commitment*—what an agent *ought* to accept given their active inquiries.  
  The gap: No approach cleanly segregates commitment (a question-relative obligation) from performance (resource-bound inference) or endorsement (conscious affirmation). This conflation fuels puzzles like the "paradox of the preface" or sudden insight cases, where closure seems alternately plausible and absurd.  

  #### III. Proposed Approach: Question-Indexed Commitment  
  I argue closure principles govern *rational commitment* but only relative to a set of *live questions*. For example:  
  - If an agent investigates "Is P true?" and accepts P and P→Q, they are committed to Q *within that question’s scope*.  
  - Closure fails for entailments irrelevant to their current questions (e.g., distant mathematical truths) or when performance/endorsement diverges.  
  **Key distinction**:  
  1. **Commitment**: What an agent must accept to avoid incoherence *given their drawn distinctions*.  
  2. **Performance**: What they *would* infer under cognitive constraints.  
  3. **Endorsement**: What they consciously avow.  
  *Novelty*: Indexing commitment to questions avoids changing the subject by:  
  - Preserving closure as a local norm.  
  - Explaining why closure *seems* valid in simple cases (aligned questions) but invalid in complex ones (misaligned resources).  

  #### IV. Method: Semester Plan (Concrete Steps)  
  **Phase 1: Formalization (Weeks 1–4)**  
  - Develop a minimal epistemic logic with:  
    - A question set **Q** (e.g., partitions of the possibility space).  
    - A ternary relation: *K(ϕ, q)* ("ϕ is known relative to question q").  
    - Axioms: Closure *only* for ϕ, ψ relevant to the same **q** ∈ **Q**.  
  - Contrast with standard frameworks to avoid collapse (e.g., ensure question-relativity ≠ awareness by making **Q** dynamic, not static).  

  **Phase 2: Case Testing (Weeks 5–8)**  
  Apply the model to:  
  1. *Easy cases*: An agent calculating a tip knows $5 + 7 = 12$ relative to "What is the total?" but not relative to "Is the restaurant ethical?" (tests question-boundedness).  
  2. *Hard cases*: An agent who knows Peano axioms but fails to derive Fermat’s Last Theorem—closure holds only for questions they actively pursue (e.g., "Does this lemma hold?"), not all entailments.  
  3. *Puzzles*: The "surprise exam paradox" (agent fails to endorse a conclusion they are committed to via nested questions).  

  **Phase 3: Objection Handling (Weeks 9–12)**  
  Address:  
  - **Collapse objection**: Does question-relativity reduce to awareness or fragmented minds? *Response*: Show awareness logics fix an agent’s "seeing" ϕ, while questions fix *why* ϕ matters—linking to inquiry, not capacity.  
  - **Triviality objection**: If questions are too flexible, commitment loses bite. *Response*: Impose constraints (e.g., questions must partition logical space; agents cannot "ignore" entailments within a question).  
  - **Normativity objection**: Why privilege commitment? *Response*: It captures the minimal rationality preserved in *all* solutions—even fragmented agents avoid local contradiction.  

  #### V. Success, Failure, and Scope  
  - **Success**: A formal model that:  
    - Validates closure for question-relative commitment but not performance/endorsement.  
    - Resolves ≥2 key puzzles without ad hoc adjustments.  
    - Proves distinct from awareness/fragmentation approaches by handling cases where questions shift dynamically (e.g., new evidence refocusing inquiry).  
  - **Failure**: If:  
    - The distinction is merely terminological (e.g., "questions" replicate awareness sets).  
    - The model cannot handle cross-question entailments (e.g., "Does q₁’s answer entail q₂’s?").  
    - Objections show commitment collapses into endorsement under resource constraints.  
  - **Scope for 6,000 words**:  
    - Formalize core logic (1,500 words).  
    - Apply to 2–3 cases (2,000 words).  
    - Defend against 2 major objections (1,500 words).  
    - Omit: Comprehensive literature review; extended comparison with all existing solutions.  

  #### VI. Weakest Part and Feasibility  
  - **Weakest part**: Dynamic question-sets risk vagueness. How do questions *update* (e.g., when new evidence arrives)? Without rigor, indexing may seem arbitrary.  
  - **What must be true**:  
    1. Questions must be definable independently of performance (e.g., via an agent’s goals or language).  
    2. Commitment must remain stable under idealization (unlike performance).  
    3. The approach must not presuppose agents grasp question-relativity (to avoid circularity).  
  **Feasibility**: Focused on a *crisp distinction* and *limited formalization*, this is viable in 6,000 words. If the distinction holds, it offers a non-deflationary path through old debates.  

  \answer{A question-indexed model of epistemic commitment resolves logical omniscience by restricting closure to live inquiries, separating norms of rationality from performance and endorsement.}
