prompt: |-
  I'm a philosophy PhD student whose main project is formal axiology — I'm trying to build a small framework for supererogation and for good-making features of actions — and I'm sitting in on a seminar in modal metaphysics where we just spent a whole session on Gödel's modal ontological argument. The version we worked through is the one Dana Scott copied out and that circulated privately before it ever got published: S5, higher-order quantification over properties, a primitive positivity predicate with the axioms that for every property either it or its negation is positive but not both, that anything entailed by a positive property is itself positive, and that necessary existence is positive, with God defined as the being that has every positive property. Then someone in the back raised what I gather is called the modal collapse objection: apparently from roughly those axioms you can derive that every true proposition is necessarily true, so the possible-worlds machinery stops doing any work and there's no contingency left anywhere. The room sort of shrugged — a couple of people said the axioms must just be too strong, one person said it shows the argument is a coherence result rather than a proof, and then we ran out of time. I don't feel like I know what the objection actually costs, and I suspect alot of what I've absorbed about it is second-hand folklore.

  So: give me the most important implications of the collapse, ranked by how much they matter, rather than restating the objection itself — I've got the shape of it. In particular I want implications spelled out for (a) what the argument can and can't claim to establish once the collapse is on the table, including what Gödel himself was actually up to, since I've heard both that he took the conclusion seriously and that he was mainly checking whether such a proof could be made to go through under classical assumptions, and I have no idea how to weigh those; (b) which parts of the axiom set are the load-bearing culprits — how much of the collapse is due to S5, how much to the positivity axioms themselfs, and how much to quantifying over properties in the second-order way; (c) whether the repairs I've heard about (I think one is called Anderson's emendation, and I have a vague memory of fixes that redefine positivity so it's tied somehow to being entailed by Godlikeness) actually rescue the argument or just relocate the cost; and (d) the one I actually need for my own work — is the collapse a problem for theism specifically, or is it a problem for anybody who wants a formal positivity or good-making predicate? If it's the second, I need to know exactly where the trap is, because my supererogation framework has something structurally similar to Gödel's postive operator in it and I'd rather find out now than in chapter four. Please be blunt about which of these implications are real and which are overblown or artifacts of one particular presentation of the proof, and write it in American English. No reading list please — I'm traveling this week and can't get to the library.
