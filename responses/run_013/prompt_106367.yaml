prompt: |-
  My friend and I spent most of last night arguing about whether supererogation is a coherent moral category at all, and I would rather settle what an account of it would have to deliver before either of us commits to a side. So please write me the desiderata: the full specification that any adequate theory of supererogation must meet.

  State each requirement, give the case or consideration that motivates it, and mark whether it is non-negotiable or merely a commitment of one camp. At a minimum I want the list to cover the phenomenon itself, namely acts that are morally admirable yet not required; the apparent paradox that an act can be better than its alternatives and still not be something one ought to do; the standing of the distinction between what is required and what is merely good; where the threshold comes from at which duty stops and the supererogatory begins; and the difference between a single extraordinary act and a sustained life of moral heroism.

  Then the parts I care about most. First, whether the theory must hold that omitting a supererogatory act is never blameworthy. My friend insists that some such omissions are plainly blameworthy, the person who could save a life at trivial cost and does nothing, and I want to know whether that pressure forces the theory to abandon the category or only to refine it. Second, whether the same act can be supererogatory for one person and obligatory for another by virtue of role or circumstance, the off-duty bystander against the lifeguard, and if so what that does to any theory that locates supererogation in the act itself rather than in the agent's position. Third, whether an act can count as supererogatory when the agent's motive is not admirable, the colleague who absorbs an exhausting burden for a struggling coworker but partly because she wants to be admired for it, and what that shows about the relation between the supererogatory and the praiseworthy.

  Flag any pair of requirements you suspect cannot be jointly satisfied. If some subset is jointly unsatisfiable, that is the result I most want, so say which subset and why. Tell me which single requirement does the most work in ruling out otherwise popular theories. You may close with a brief verdict on two or three of the usual contenders, but keep the weight on the criteria themselves. No reading list and no citations; I want the specification, not a survey.
reasoning: |-
  Okay, the user is deep into a philosophical debate about supererogation—acts that are good but not required. They want a clear set of criteria any theory must meet, and they have specific concerns about blame, role relativity, and motives. 

  First, I need to map the core puzzle: how can something be morally better yet optional? Their friend thinks skipping "supererogatory" acts (like saving a life at trivial cost) is blameworthy, which threatens the whole category. The user also cares whether the same act can be obligatory for some (lifeguards) but supererogatory for others, and if impure motives ruin the status. 

  Hmm, the real tension hides in three places: (1) If we allow blame for omissions, does "optional" collapse? (2) If roles change obligations, can we even define supererogation by the *act itself*? (3) If motives matter, is supererogation about action or character? 

  The user’s urgency suggests they suspect inconsistencies. They’d want me to flag irreconcilable demands—like requiring acts to be *always* optional while admitting some omissions *are* blameworthy. That’s the killer pair: Non-Blame for Omissions vs. Blameworthiness Pressure. You can’t have both without redefining "blame" or "optional." 

  Also, the motive question probes whether supererogation is objective or subjective. If a self-serving rescuer still acts supererogatorily, it decouples the act from the agent’s virtue. But that feels counterintuitive—shouldn’t "moral admirability" include motives? 

  For contenders: Simple Cost-Benefit theories fail the Threshold Source requirement (why is *this* cost the limit?). Agent-Relative theories handle role differences but struggle with the Paradox (how is a better act not obligatory?). Virtue theories capture sustained heroism but blur duty/supererogation lines. 

  The verdict? No theory nails all desiderata. The user’s friend might exploit the blameworthiness pressure to reject supererogation entirely, but refining "optional" as "permissible yet suboptimal" could save it—if we accept that some permissible choices are still morally disappointing. Not blameworthy, but... regret-worthy? That’s the tightrope.
answer: |-
  Here is a specification of desiderata for any adequate theory of supererogation, addressing your core concerns and flagged tensions:

  **Core Phenomenon & Definition:**
  1.  **The Supererogatory Core:** The theory must identify a distinct category of morally significant acts that are *morally good (or better)* than minimally acceptable alternatives, yet *not morally obligatory*. *(Non-negotiable)*
      *   *Motivation:* The very phenomenon under discussion – acts like heroic rescues or significant, costly charity beyond duty.
  2.  **Non-Required Admirability:** Acts within this category must be understood as *morally admirable* or *especially commendable* for being performed, despite not being required. *(Non-negotiable)*
      *   *Motivation:* Captures the intuition that saints and heroes deserve praise *because* they went beyond what was demanded.

  **Resolving the Paradox & Threshold:**
  3.  **The Permissibility of the Minimum:** It must be morally *permissible* (i.e., not wrong, not blameworthy *for that reason alone*) to omit the supererogatory act and instead perform a morally acceptable, but less good, alternative. *(Non-negotiable)*
      *   *Motivation:* The defining feature that resolves the paradox: one *may* choose a less good option without moral failing (though see tension with 10).
  4.  **Threshold Requirement:** The theory must provide a principled account of the *threshold* separating the obligatory (duty) from the supererogatory. *(Non-negotiable)*
      *   *Motivation:* To explain *why* a particular level of demand marks the limit of duty (e.g., cost/benefit ratios, societal expectations, agent-relative constraints).
  5.  **Threshold Source (Contested):** Theories differ on *where* the threshold originates:
      *   *Option A (Objective/Agent-Neutral):* Rooted in objective cost/benefit, impersonal reasons, or universal human limits. *(Commitment of one camp)*
      *   *Option B (Agent-Relative):* Rooted in the agent's specific commitments, relationships, roles, or personal projects. *(Commitment of one camp)*

  **Scope and Variation:**
  6.  **Scalability:** The theory must accommodate both:
      *   *Single Acts:* Discrete acts of supererogation (e.g., jumping on a grenade).
      *   *Sustained Commitment:* Lives characterized by consistently performing supererogatory acts (moral heroism/sainthood). *(Non-negotiable)*
      *   *Motivation:* Both exist; a theory shouldn't exclude one.
  7.  **Role/Context Relativity:** The theory must allow that the *same type of act* (e.g., saving a drowning person) can be *supererogatory* for one agent (off-duty bystander) and *obligatory* for another (on-duty lifeguard), due to role, relationship, prior commitment, or circumstance. *(Non-negotiable)*
      *   *Motivation:* Intuitive cases like lifeguard vs. bystander, parent vs. stranger.
  8.  **Motive Independence (Contested):** Theories differ on whether an act's *supererogatory status* depends on the agent's *motive*:
      *   *Option A (Status Independent):* An act can be supererogatory even if performed from mixed or non-admirable motives (e.g., desire for praise, guilt). *(Commitment of one camp)*
      *   *Option B (Status Dependent):* Only acts performed from genuinely morally admirable motives (e.g., benevolence, duty-beyond-duty) count as supererogatory. *(Commitment of one camp)*
      *   *Motivation:* Case of the colleague helping partly for admiration. Does the *act* count as supererogatory, even if the *agent* isn't fully praiseworthy?

  **Your Key Concerns:**
  9.  **Blame for Omission? (The Pressure Point):** The theory must address whether omitting a supererogatory act can *ever* be blameworthy. *(Critical Tension Point)*
      *   *Motivation:* Your friend's case: trivial cost to save a life. Omitting this *feels* blameworthy, threatening core permissibility (Desideratum 3).
      *   *Resolution Options:*
          *   *Strict View:* Omission is *never* blameworthy (upholds 3 strictly). The "trivial cost" case must be reclassified as obligatory (raising threshold questions).
          *   *Moderate View:* Omission is not blameworthy *qua omission of supererogation*, but other factors (e.g., callousness, violating minimal decency) *can* make it blameworthy. The trivial cost case might be a "duty of easy rescue" (obligatory), *not* supererogatory.
          *   *Graded View:* Some omissions of "low-level" supererogation might attract mild blame/disapproval without full wrongness. (Risk of collapsing the category).
  10. **Praiseworthiness vs. Admirability:** The theory must clarify the relationship between an act being *supererogatory* and the agent being *praiseworthy* for performing it.
      *   *Motivation:* Linked to motive (Desideratum 8). Can an agent be praiseworthy for a supererogatory act done from a bad motive? Can an act be supererogatory but the agent *not* praiseworthy due to motive? Distinguishes the act's status from the agent's merit.

  **Flagged Tensions (Likely Unsatisfiable Pairs):**

  *   **The Core Tension:** **Desideratum 3 (Permissibility of Minimum/Omission not Blameworthy *for that reason*) vs. Desideratum 9 Pressure (Intuition that some omissions *are* blameworthy, e.g., trivial cost rescue).**
      *   *Why:* If omitting a supererogatory act is *never* blameworthy, the trivial cost rescue omission cannot be supererogatory – it must be obligatory. But this risks setting the threshold implausibly high (making heroism obligatory) or low (letting clearly blameworthy omissions be "permissible"). Reconciling the strong intuition of blame in trivial cost cases with the core definition of supererogation as *optional* is the central pressure point. Most theories must either bite the bullet on trivial cost cases (call them obligatory, not supererogatory) or introduce a notion of "quasi-blame" or "objective wrongness without blame" (risky).

  *   **Potential Secondary Tension:** **Desideratum 7 (Role Relativity) vs. Strong Versions of Desideratum 4/5 (Objective/Agent-Neutral Threshold).**
      *   *Why:* If the threshold is purely objective/agent-neutral (e.g., "cost exceeding X% of resources"), it struggles to explain why the same act (saving a drowning person) is obligatory for a lifeguard (role) but supererogatory for a bystander, as the objective cost/benefit is identical. Theories emphasizing roles/relationships naturally handle 7 but need to explain the source of *those* duties without collapsing into pure relativism.

  **Most Damaging Requirement Against Popular Theories:**

  *   **Desideratum 3 (Permissibility of the Minimum)** does the most heavy lifting. Many popular theories stumble here:
      *   **Maximizing Consequentialism:** Struggles immensely. If the best act is always obligatory, supererogation vanishes. Requires introducing agent-centered *prerogatives* (e.g., Scheffler) to permit sub-optimal choices.
      *   **Simple Deontology:** If duties are seen as exhaustive and always demanding the best, supererogation disappears. Requires acknowledging "imperfect duties" or limits to duty's demands.
      *   **Virtue Ethics:** Can sometimes blur the line, making supererogation just "what the virtuous person does," risking making it obligatory for the virtuous agent. Needs a clear notion of what exceeds the *demands* of virtue.

  **Brief Verdict on Contenders:**

  1.  **Cost-Benefit Threshold (e.g., Urmson):** Simple, handles trivial cost vs. high cost. Weak on Role Relativity (7) and Threshold Source (5) – *why* this cost level? Struggles with Motive (8) and Scalability (6 - heroism).
  2.  **Agent-Centered Prerogatives (e.g., Scheffler):** Strong on Permissibility (3) by allowing agents to weight their own interests. Good on Threshold Source (5 - personal projects). Needs augmentation for Role Relativity (7) and can struggle with Admirability (2) - *why* is going beyond the prerogative *admirable*?
  3.  **Role/Relationship Based (e.g., some communitarian views):** Excels at Role Relativity (7). Struggles with providing a universal Threshold (4/5) and clear Permissibility (3) – duties defined by roles can become very expansive. Motive (8) often becomes central.

  **Conclusion:** The specification reveals the core tension lies in reconciling the *optionality* and *non-blameworthiness* of omission (3) with the strong intuition that failing to act at *trivial cost for great benefit* (9) *is* blameworthy. Any adequate theory must either rigorously defend a threshold that places such acts firmly in the *obligatory* camp (risking over-demandingness) or provide a nuanced account of blame that distinguishes the *wrongness of omission* from the *blameworthiness of the agent* in a way that preserves genuine optionality for genuinely costly supererogation. Role relativity (7) and motive (8) are significant points of divergence between theories, but the viability of the category hinges most critically on resolving the pressure point around blame for omission.
