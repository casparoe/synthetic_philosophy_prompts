prompt: |-
  My friend and I spent most of last night arguing about the procreation asymmetry — the idea that it can be wrong to bring into existence a person whose life will go badly, while no one is obliged to bring into existence a person whose life will go well — and we kept discovering that we were asking different things of any account that would explain it. I would like the specification written out properly, because I suspect the real disagreement is about which demands are legitimate and which are merely habits of one camp. The purpose I have in mind is an account solid enough to be used in arguments about reproductive decisions and population policy, so adequacy should be judged against that.

  Write the desiderata: what any adequate account of the asymmetry must deliver. For each requirement, give the case or consideration that motivates it; say whether it is non-negotiable or only a preference of one camp, and which camp (for instance, those who locate all value in the welfare of people who exist or will exist regardless, as against those who rank outcomes by the welfare of whoever happens to exist in them); and say which other requirements it sits awkwardly with. Where some subset of the requirements cannot be jointly satisfied, say so explicitly and show the conflict — that is the part I care about most, and I would rather have the conflict than a tidy list that hides it.

  To keep this from being a recital of the familiar positions, I want the list stress-tested against some cases my friend and I invented, and I want each treated as a first-class requirement if it deserves to be:

  - The two vantages. From the inside, a life can be worth living even when it was not worth starting; from the outside, before anyone exists, there is no one whose interests are at stake. An account must say which vantage the asymmetry is grounded in, and whether it returns the same verdict from both. Let us call these the insider and the outsider vantage, and make it a requirement that an account declare which one it is using and why the other is the wrong one to use.
  - The transposition test. If the asymmetry rests on the badness of suffering or the goodness of enjoyment, the same structure should show up wherever those show up, not only at the moment of creation. So an account must either show that the asymmetry carries over to extending, rescuing, or restoring lives, or explain what is special about bringing someone into existence. A restriction that applies only to the moment of creation should be flagged as ad hoc unless it is defended.
  - The zero point. Suppose a couple could create a person whose life would sit exactly at the level that makes a life worth living and no higher. Is that option ranked above, below, or level with creating no one? Whatever the account says, it must say it determinately, and must not leave the answer to the couple's preferences.
  - The substituted sibling. A choice or policy that fixes which person comes to exist rather than how well off any particular person is. The account must say what, if anything, is wrong there, and must not quietly assume that the same person exists in both branches.
  - The reversal. A person who already exists and suffers, and who would not choose nonexistence for themselves, set against the same quantity of suffering in someone who does not yet exist. The account must either treat these alike or give a principled reason for treating them differently.

  Then, briefly, mark which single requirement does the most to eliminate candidate accounts, and say which candidates it eliminates.

  I do not want a bibliography or a reading list, and please do not rest the answer on who said what; describe positions by their content. If you name a position, keep it to ones any reader would recognise, and do not attribute particular claims to particular authors.

  Give the whole answer in American English. Present the desiderata as a table with these columns: Requirement (short name); What it demands; Motivating case or consideration; Status (non-negotiable, or camp-specific and which camp); Tension with (which other requirements, if any). Follow it with a short section on any subset of requirements that cannot be jointly satisfied, and a short paragraph on the most eliminative requirement. The table should be the bulk of the answer.
reasoning: |-
  Okay, the user is deeply engaged in a philosophical debate about the procreation asymmetry with their friend. They spent all night arguing and want a clear specification of requirements for any adequate account of this asymmetry. Their purpose is practical: to use it in arguments about reproductive decisions and population policy, so the account needs to be robust. 

  The user presents five specific cases they want stress-tested: the two vantages (insider vs outsider), transposition test (applying asymmetry beyond creation), zero point (creating someone at the life-worth-living threshold), substituted sibling (identity-affecting choices), and reversal (existing vs not-yet-existing person's suffering). They explicitly want conflicts highlighted, not hidden.

  Hmm, the core tension I see is between individualism (only existing beings count) and outcome-comparison (all possible lives matter). This surfaces in multiple requirements. For example:
  - Zero point forces a choice: if creating at threshold is neutral (individualism), it conflicts with outcome views that might see it as suboptimal.
  - Substituted sibling challenges individualism since no existing person is harmed, yet outcome views might still object to worse-off persons being created.
  - Reversal pits the insider's actual preference against the outsider's prevention logic.

  The transposition test is particularly brutal - it eliminates many accounts because most can't explain why we have duties to prevent suffering in potential beings but not duties to create happy ones, while maintaining symmetrical duties for existing people. If an account says "don't create miserable people" but won't say "do create happy ones," it struggles to explain why we must save existing people from misery but needn't create new happy ones. Only strong asymmetrical accounts survive this.

  The user seems frustrated by camps talking past each other. They want the conflicts laid bare, so I'll structure this as: 
  First, a table with all requirements, their demands, motivations, status (noting where camps diverge), and tensions. 
  Then a conflict section showing how individualism (Camp A) and outcome-ranking (Camp B) create irreconcilable tensions across requirements. 
  Finally, highlight transposition as the killer test.

  Notably, they reject academic name-dropping - this is about ideas, not pedigree. American English throughout, as requested. The table will be comprehensive but the conflict analysis is the payoff.
answer: |-
  ### Desiderata for an Adequate Account of the Procreation Asymmetry

  | Requirement (Short Name) | What It Demands | Motivating Case or Consideration | Status | Tension With |
  |--------------------------|-----------------|----------------------------------|--------|--------------|
  | **Two Vantages** | Declare whether the asymmetry is grounded in the "insider" vantage (evaluating life from within) or the "outsider" vantage (evaluating before existence). Explain why the chosen vantage is correct and the other is inappropriate. | A life may be worth continuing (insider view) but not worth starting (outsider view). E.g., a person with chronic pain who finds meaning in life vs. the pre-existence state where no interests exist. | Non-negotiable: Must explicitly commit to one vantage and reject the other. | **Transposition Test** (if outsider vantage is used, extending lives may conflict with asymmetry), **Reversal** (insider vantage may conflict with duties to prevent suffering). |
  | **Transposition Test** | Show that the asymmetry applies to life extension/rescue/restoration, OR defend why it only applies to creating new lives (without being ad hoc). | If avoiding suffering grounds not creating miserable lives, why doesn’t preventing suffering in existing people require creating happy lives? E.g., refusing to save a drowning child vs. refusing to create a happy child. | Non-negotiable: Accounts that fail this appear arbitrary. | **Two Vantages** (outsider vantage struggles with transposition), **Reversal** (asymmetry in creation vs. rescue must be consistent). |
  | **Zero Point** | Determinately rank creating a person at the "life-worth-living" threshold (e.g., minimally positive well-being) against creating no one. The ranking must be objective, not preference-dependent. | A couple can create a child whose life is net-positive but barely worth living, or create no one. Is this neutral, bad, or good? Ambiguity here undermines practical guidance. | Camp-specific: Non-negotiable for outcome-ranking camps (must specify if neutral/suboptimal); negotiable for individualism camps (may allow neutrality). | **Substituted Sibling** (if creating at zero point is bad, identity-affecting choices become problematic), **Two Vantages** (insider may see it as acceptable, outsider may not). |
  | **Substituted Sibling** | Explain what (if anything) is wrong with choices that affect which person exists, not how well-off a specific person is. Must avoid conflating identity across scenarios. | Couple chooses to conceive now (creating child A with a hard life) vs. later (creating child B with a good life). No particular child is harmed, but outcome is worse. | Non-negotiable: Must address whether worsening the world via identity-affecting choices is objectionable. | **Zero Point** (if creating at zero point is neutral, substituted sibling may be permissible), **Reversal** (if harming existing people is wrong but substituting worse-off people isn’t, inconsistency arises). |
  | **Reversal** | Treat suffering in an existing person (who prefers existence) and equal suffering in a potential person either alike, OR provide a principled difference. | An existing person with severe depression who wants to live vs. not creating a person who would suffer identically. Preventing the latter seems obligatory; not saving the former seems wrong. | Non-negotiable: Must reconcile intuitive differences in duties to existing vs. potential beings. | **Transposition Test** (failure to generalize asymmetry to rescue), **Two Vantages** (insider’s preference vs. outsider’s prevention). |

  ---

  ### Conflicts Between Requirements  
  **The core tension** arises between requirements grounded in **individualism** (only existing/future-existing people matter) and **outcome-ranking** (all possible lives in scenarios matter). This prevents joint satisfaction of:  
  - **Substituted Sibling** + **Zero Point** + **Reversal**  
    - *Conflict*: Individualism (Camp A) sees creating at zero point as neutral (no harmed individual) and substituted siblings as permissible (no one wronged). But this implies no obligation to avoid creating miserable lives if no alternative person is deprived—contradicting the asymmetry’s core. Outcome-ranking (Camp B) sees creating at zero point as suboptimal (vs. no one) and substituted siblings as wrong, but struggles with **Reversal**: Why save an existing sufferer (per individualism) but not avoid creating a new sufferer (per outcome-ranking)?  
  - **Transposition Test** + **Reversal**  
    - *Conflict*: If the asymmetry justifies not creating suffering but not creating happiness, **Transposition** demands this apply to rescue (e.g., saving sufferers is required, creating happy people isn’t). But **Reversal** shows saving existing sufferers is obligatory, while not creating happy people isn’t—forcing consistency. Most accounts fail here by permitting rescue but not requiring procreation, without a principled distinction between saving and creating.

  ---

  ### Most Eliminative Requirement  
  The **Transposition Test** eliminates the most candidate accounts. It requires the asymmetry to either generalize beyond creation or defend creation’s uniqueness. Most attempts:  
  - **Eliminates**: "Harm-based" accounts (wrong to create sufferers because it harms them) since they cannot explain why failing to create happy people isn’t harming them.  
  - **Eliminates**: "Duty-to-rescue" accounts (only existing beings trigger duties) as they allow saving sufferers but not creating happy lives—yet can’t explain why we *must* save sufferers but needn’t create them.  
  Only strongly asymmetrical accounts (e.g., only suffering prevention matters for non-existent beings) survive, but they struggle with **Reversal** and **Substituted Sibling** consistency.
