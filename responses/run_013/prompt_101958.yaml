  2. **Sealed Envelope for Team B:**  
     - *Contents:* A card with "**Rule 2: The particle `na` attaches to the first word of the sentence.**"  
     - *Instructions on Envelope:* "Defend this rule as the ONLY rule that fits every sentence in the corpus. Use it to predict `na` placement in new sentences."  

  3. **Test Sheet (6 Sentences for Prediction):**  
     - *Format:* Sentences without `na`; students insert `na` based on their rule. Include glosses for new words.  
     - *Design:* All test sentences break the SVO pattern, causing Rule 1 and Rule 2 to conflict.  

     | Test Sentence         | Gloss                          | Structure Type               |
     |-----------------------|--------------------------------|------------------------------|
     | 1. Kale mira sapa talo. | yesterday child see dog       | Fronted time word           |
     | 2. Wena mira sapa.      | river child see               | Fronted object              |
     | 3. Sapa mira talo?      | see child dog?                | Verb-first question         |
     | 4. Futo sanu pula koro. | tomorrow woman carry house    | Fronted time (new context)  |
     | 5. Koro deko tira?      | house man sleep?              | Object-subject question     |
     | 6. Sanu talo nuka?      | woman dog hit?                | Subject-object question     |  

     - *New Words Glossed:* `kale` = yesterday, `futo` = tomorrow.  

  ---

  ### **Timing Plan (80 Minutes Total)**  
  1. **Introduction (5 min):**  
     - *Script:* "You're field linguists with a shoebox of notes from the Tamu language. Your task: Find the rule for `na`. No prior linguistics needed—rely on the data. We’ll split into teams to test your theories."  
     - *Action:* Distribute corpus handout to all students.  

  2. **Team Split & Work (25 min):**  
     - Split class into **Team A** and **Team B** (10 students each).  
     - **Team A (Corpus Only):**  
       - *Task:* Analyze corpus, state Rule 1 (`na` attaches to the subject), predict `na` placement for all 6 test sentences.  
     - **Team B (Corpus + Envelope):**  
       - *Task:* Defend Rule 2 (`na` attaches to first word), predict test sentences using Rule 2.  
     - *Facilitator Role:* Circulate, clarify task, but **do not hint at rules**.  

  3. **Scoring Phase (10 min):**  
     - *Task:* Teams present their rules using the corpus.  
     - *Script:* "Team A, what’s your rule? Show us how it fits all 12 sentences. Team B, same for your rule."  
     - *Outcome:* Both teams demonstrate their rules fit the corpus perfectly → **Tie (12/12)**.  

  4. **Test Phase (15 min):**  
     - *Task:* Reveal test sheet. Teams write predictions for `na` placement on board.  
     - *Example:*  
       - Test 1 (*Kale mira sapa talo*):  
         - Team A (Rule 1): `Kale mira na sapa talo` (attaches to subject `mira`).  
         - Team B (Rule 2): `Kale na mira sapa talo` (attaches to first word `kale`).  
     - *Action:* Compare predictions for all 6 tests → **Predictions split 6/6**.  

  5. **Discussion (10 min):**  
     - *Task:* Teams debate which rule is "correct."  
     - *Script:* "Team A, why does Rule 1 make more sense? Team B, defend Rule 2. Use the corpus to argue."  
     - *Outcome:* Students realize corpus doesn’t resolve the conflict → Deadlock.  

  6. **Reveal (5 min):**  
     - *Script:* "Before teams formed, which rule felt right to you? **Rule 1 (`na` on subject)?** Or **Rule 2 (`na` on first word)?** Raise hands."  
     - *Expected Result:* Majority raise hands for Rule 1 (structural bias).  
     - *Comment:* "Notice how most of you preferred Rule 1—even though the data didn’t demand it."  

  7. **Debrief (10 min):**  
     - *Key Points:*  
       - **Underdetermination ≠ Unlearnability:** "The corpus underdetermines the rule—both fit the data. But this isn’t proof that Tamu is unlearnable! With more data (e.g., negative evidence), you could resolve it."  
       - **The Real Debate:** "Children learn languages with structure-dependent rules (e.g., questions involve moving verbs *near subjects*, not just first words). But they get limited data, little negative feedback, and never hear sentences like our test cases. How do they ‘know’ to avoid linear rules (like Rule 2)?"  
       - **Connecting to Theory:**  
         - **Poverty of the Stimulus:** "The input children receive is ‘poor’—it doesn’t explicitly teach structure-dependent rules."  
         - **Universal Grammar (UG):** "Some argue children have innate biases (e.g., prefer structure over linear order). Others argue learning strategies (e.g., analogy, cognitive biases) suffice. Today, you felt that bias—no one thought they were guessing!"  
       - **Limitations of Activity:** "This doesn’t *prove* UG or innateness. It shows underdetermination, but real learnability requires extra premises: e.g., lack of negative evidence, uniformity in child success, and errors *not* made."  

  ---

  ### **Predictable Challenges & Solutions**  
  1. **"Twelve sentences aren’t enough to learn anything!"**  
     - *Response:* "Absolutely—real linguists want more data! But even with infinite SVO sentences, the rules aren’t distinguished. We need diverse structures (like our test cases) to force a choice. Children get limited data too—yet they infer robust rules."  

  2. **Confusion with Test Sentences:**  
     - *Risk:* Students may question if test sentences are "valid" Tamu.  
     - *Mitigation:* Pre-empt: "Assume these are grammatical Tamu sentences. Your job is to extrapolate."  

  3. **Team B Resists Defending Rule 2:**  
     - *Risk:* Team B privately agrees with Rule 1 and struggles to argue.  
     - *Solution:* "Your envelope says Rule 2 is correct—defend it like a lawyer! The point is to test if the data *forces* Rule 1."  

  4. **Over-Simplifying the Debate:**  
     - *Risk:* Students conflate "bias" with "innate grammar."  
     - *Clarify in Debrief:* "Bias could be innate, learned from cognition, or from interacting with the world. We’re teasing apart how data + biases interact."  

  ---

  ### **What the Activity Can’t Show**  
  - **Not a Proof of Unlearnability:** Underdetermination is common in science (e.g., Newton vs. Einstein on gravity). To argue language is *unlearnable* without innate biases, you need:  
    - **Premise 1:** Negative evidence is scarce (children aren’t reliably corrected).  
    - **Premise 2:** Children converge on structure-dependent rules universally and without linear-order errors.  
    - **Conclusion:** Innate biases (UG) explain this convergence.  
  - **Not a Disproof of Learning:** The activity doesn’t rule out that statistical learning or cognitive skills *could* explain the bias.  

  ---

  ### **Final Script for Debrief**  
  "Today, you felt the itch: Data alone didn’t pick the rule—*you* did. Most of you imposed structure-dependence (attaching `na` to subjects) instinctively. Children do this too, but with far less data and no linguist’s toolkit. That’s the puzzle: Why don’t kids say ‘Yesterday *na* the child saw the dog’? The answer isn’t in the data—it might be in *us*. But is that innate grammar? Learned cognition? That’s the real debate—and now you’ve lived it."  

  This plan balances engagement with philosophical depth, using your Tamu language to make abstract concepts tangible. Let me know if you need adjusted handouts or talking points!
