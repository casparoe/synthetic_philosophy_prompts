  8. **Estimators and Their Consistency**: The agent's probability for a statement is an estimator of the truth value (which is 0 or 1). The logical induction criterion requires that this estimator is consistent: as the agent sees more and more logical deductions, it converges to the correct truth value for every statement. Moreover, the convergence must be sufficiently uniform so that the agent doesn't make systematic errors.

