answer: |-
  ### Translation into Statistical Vocabulary

  **Priors and Posteriors**: You start with a computable prior over logical sentences, treating unproven statements as random variables with initial beliefs. As logical evidence accumulates (e.g., observed computation steps, derived lemmas), you update to a posterior via conditional probability. Crucially, the "data" is logical deduction, not empirical observations. The prior must be structured to ensure posteriors converge to 0 or 1 for decidable sentences.

  **Likelihoods**: For deterministic logical claims, the likelihood is degenerate: 1 if true, 0 if false. However, since truth is unknown, likelihoods manifest as indicator functions conditioned on proof progress. Updating resembles belief propagation in graphical models where nodes represent subproblems.

  **Exchangeability**: Only superficially applicable. Logical sequences (e.g., digits of π) may be treated as exchangeable if generated by a common process, but mathematical statements lack permutation invariance. Instead, dependency structures (e.g., proof graphs) define conditional independencies.

  **Parameter vs. Model Uncertainty**: Uncertainty is entirely "parameter uncertainty" within a fixed model (the axiom system). There is no "model uncertainty" (e.g., choosing between ZF and ZFC), as the framework assumes a consistent background theory. Probabilities quantify ignorance about unproven statements, not model fitness.

  **Proper Scoring Rules**: The "no guaranteed exploitation" condition translates to coherence under computable proper scoring rules. Your prices (probabilities) must admit no computable arbitrage opportunity—analogous to avoiding sure loss in de Finetti’s theorem, but with Turing-machine adversaries.

  **Kelly Betting and No-Arbitrage**: The no-exploitation criterion is a computational no-arbitrage constraint: no polynomial-time betting strategy can create a Dutch book against your beliefs. Kelly optimization would require known odds, but here "true probabilities" are binary, so the focus is on defense against adversarial markets.

  **Martingales**: Your belief for any sentence forms a martingale adapted to the filtration of logical discoveries. Convergence theorems ensure beliefs eventually stabilize to truth values for provable/refutable claims, with the martingale property enforcing coherence during learning.

  **Estimators and Consistency**: Beliefs are estimators of the binary truth value. The framework demands strong consistency: estimators converge almost surely (and computably) to 1 for true sentences, 0 for false ones, given sufficient deductive progress.

  **Computability and Complexity**: Priors and updating must be computable. Learning speed depends on proof complexity (e.g., sentence length, logical depth). Polynomial-time updates are desirable but not always achievable; the framework allows for efficient approximations.

  **Idealization vs. Approximation**: Logical induction is an idealization for computable agents with infinite runtime. Practical implementations use finite approximations (e.g., bounded proof search), trading off depth for tractability—similar to variational methods in Bayesian inference.

  ---

  ### Residue Report

  **Clean Translations** (Direct analogs with minimal distortion):  
  - **Priors/posteriors and Bayesian updating**: The core mechanics map directly. Conditioning on logical evidence mirrors empirical Bayesian updates.  
  - **Proper scoring rules and no-arbitrage**: The Dutch-book criterion is a standard coherence requirement, extended naturally to computable adversaries.  
  - **Martingales and consistency**: Belief convergence is a martingale property; estimator consistency aligns with asymptotic learning guarantees.  
  - **Computability constraints**: Complexity-aware learning is routine in stats (e.g., PAC learning).

  **Translations with Distortion** (Concepts bent during mapping):  
  - **Likelihoods**: Distortion arises because logical truth is deterministic, unlike stochastic data. Likelihoods become binary indicators, reducing Bayes’ theorem to conditionalization. The bend: standard likelihoods model stochasticity, but here they encode proof-theoretic certainty.  
  - **Exchangeability**: Bent to fit sequences (e.g., digit prediction), but most logical statements lack symmetry. The distortion ignores logical dependencies, oversimplifying the structure.  
  - **Kelly betting**: Distorted because "true odds" are 0/1, eliminating Kelly’s expected-log-wealth maximization. Focus shifts to arbitrage prevention, losing Kelly’s growth-rate optimality.

  **No Counterpart** (Novel or mismatched elements):  
  1. **Non-dogmatism for undecidables**: Assigning (0,1) to unprovable sentences (e.g., consistency of the theory) has no statistical analog. Standard Bayes allows dogmatism (e.g., prior p=0 for "impossible" events), but logic forbids it for undecidables. *Residue cause: This is a genuine extension, enforcing open-mindedness where classical stats has no parallel.*  
  2. **Self-referential consistency**: Requiring coherent beliefs about the system’s own consistency (e.g., Con(PA)) introduces fixed-point constraints absent in statistics. *Residue cause: Statistical models rarely reason about their own reliability; this is new.*  
  3. **Proof-driven updates**: "Data" is not i.i.d. but deductive steps, forcing belief revision along proof paths. *Residue cause: Standard stats assumes stochastic data generation; here "data" is deterministic proof discovery.*

  **Assessment of Residue**:  
  - The residue marks **both substance and vocabulary gaps**. Non-dogmatism and self-reference are substantive advances, addressing self-awareness in formal reasoning. Your vocabulary lacks tools for "inevitable ignorance" (undecidables) and self-referential probabilities.  
  - However, the **no-exploitation** and **consistency** criteria are ordinary statistics in disguise—merely computable coherence and estimator convergence. The apparent novelty stems from applying them to logic, not conceptual innovation.  
  - **Conclusion**: The residue is 30% vocabulary gap (especially self-referential uncertainty) and 70% hybridization of stats with computability theory. Logical induction is not revolutionary but rigorously adapts Bayesian learning to deterministic, non-empirical domains, with undecidability constraints as the true residue.
