prompt: |-
  I am giving a single guest session in a colleague's undergraduate typography course, and I would like you to plan the session rather than deliver it. The students can recognize a dozen typefaces on sight and will argue about kerning, but they have never been asked what makes an 'a' an 'a'; my aim is to leave them with the question properly posed and the beginnings of an answer, not with a doctrine.

  The frame I want to use is the Letter Spirit project (Douglas Hofstadter and Gary McGraw, in Fluid Concepts and Creative Analogies, 1995): the idea of a program that, given a few letters drawn in an unfamiliar style, must design the remaining letters of the alphabet so that the whole set hangs together — which forces the designer, human or machine, to decide what belongs to the identity of a letter and what belongs to its style. Do not assume the students have heard of it; the plan should let them arrive at the project's question on their own before I name it.

  Two pieces of raw material I want woven in, because they are the sort of thing the students will not have met. First, the lowercase 'a' has two widely used canonical constructions: the double-storey 'a' of most printed text, with its bowl and upper hook, and the single-storey 'a' of handwriting and of many sans-serif typefaces, which is simply a circle and a stem — so a single letter, within one alphabet, comes in two forms neither of which much resembles the other, yet both are read as 'a' without hesitation. Second, a letterform's identity is in part a matter of the contrasts its alphabet affords — an 'a' is what it is partly because it is not the 'o', the 'e', the 'd', or the 'g' beside it — which makes what makes an 'a' an 'a' and what makes a set of letters a style a single question rather than two. Keep in mind also that 'the letter a' can mean a glyph, a grapheme, or a code point in a character encoding; if the students collapse these, I want the plan to pull them apart at the right moment.

  Now plan the session. Specifically:

  1. The order in which the ideas must come, and why each depends on the one before it: what has to be in place before the double-storey/single-storey fact can do any work, and what has to be in place before style can be introduced without sounding like mere decoration.
  2. The one example that should carry the whole session. I am inclined to let the double-storey/single-storey 'a' carry it, but tell me whether it can bear that weight or whether something else should instead — a mirrored or rotated letter, an 'a' and an 'o' a hair's breadth apart, a letter in a style that seems to fight its own identity — and what the carrying example must have, and must lack, to do the job.
  3. The misconceptions the students will arrive with or form — I predict they will treat a letter as a fixed shape matched against a template, and treat style as a skin laid over an unchanging skeleton, and I suspect some will swing to the view that any mark is a letter if a community agrees to call it one — and precisely where in the sequence each should be headed off, and by what.
  4. The single question or task I can set at the end that would show me whether the question has landed, rather than whether they can repeat my phrasing.
  5. What I should deliberately leave out at this level, and how I should say so out loud when I do.

  Give me the plan for the explanation, not the explanation itself, and no readings.
reasoning: |-
  We are planning a guest session for an undergraduate typography course. The students are familiar with typefaces and kerning but haven't deeply considered what makes a letter identifiable. The goal is to pose the question of letter identity and the interplay with style, using the Letter Spirit project as a frame but without starting with it. We have two key materials: the double-storey vs. single-storey 'a' and the idea of contrasts within an alphabet.

  ### 1. Order of Ideas and Dependencies
  The session must build step by step. Here's the sequence:

  #### Step 1: Start with the familiar – recognizing letters (to establish the problem of identity)
  - **Why?** We need to unsettle the assumption that letter recognition is straightforward. Without this, the double-storey/single-storey example might be dismissed as an exception.
  - **Activity:** Ask students to quickly sketch a lowercase 'a' without overthinking. Then show a variety of 'a's from different typefaces (including both double-storey and single-storey) and ask if they are all 'a's. They will agree. Then ask: "What makes all these different shapes the same letter?"
  - **Dependency:** This step sets up the core question: what is the invariant in the letter 'a'? It must come first to create the puzzle.

  #### Step 2: Introduce the double-storey and single-storey 'a' (to challenge the idea of a fixed shape)
  - **Why?** Now that the question is posed, we use this example to show that the invariant is not in the shape. We must have established the problem of identity first; otherwise, this might be seen as a trivial variation.
  - **Activity:** Display the two forms side by side (e.g., a printed double-storey and a handwritten single-storey). Point out that they look very different yet are read as 'a' without hesitation. Ask: "How can two such different shapes both be 'a'? Is there a common core?"
  - **Dependency:** Step 1 creates the need; Step 2 intensifies it by showing extreme variation.

  #### Step 3: Separate glyph, grapheme, and code point (to clarify levels of abstraction)
  - **Why?** Students might conflate the visual form (glyph) with the abstract idea of the letter (grapheme) or the digital representation (code point). We need to pull these apart to avoid confusion and to focus on the grapheme as the invariant.
  - **Activity:** Explain briefly:
    - Glyph: the specific visual form (e.g., a particular double-storey 'a').
    - Grapheme: the abstract concept of the letter (what we mean by 'a').
    - Code point: the digital representation (e.g., Unicode U+0061).
    - Emphasize that we are focusing on the grapheme – the abstract identity – and how it is realized in different glyphs.
  - **Dependency:** Without this, the discussion might get stuck on visual details or digital issues. It must come after Step 2 to resolve the confusion raised by the two 'a' forms.

  #### Step 4: Introduce the role of contrast within an alphabet (to show that identity is relational)
  - **Why?** To move beyond the idea of an intrinsic, fixed shape and to show that a letter is defined by its differences from other letters in the same style. Without this, style might seem like mere decoration added to a fixed skeleton.
  - **Activity:** Show a set of letters in a consistent style (e.g., 'a', 'o', 'e', 'd', 'g'). Ask: "What makes the 'a' distinct from the 'o'? What if I change the style – do the distinctions remain?" Then, show a style where the 'a' and 'o' are very similar (e.g., in a condensed sans-serif) and ask if they are still distinguishable. Highlight that the identity of 'a' relies on it not being confused with its neighbors.
  - **Dependency:** Steps 1-3 set up the problem of identity; Step 4 begins the answer by showing that identity is defined by the system (the alphabet).

  #### Step 5: Connect identity and style (to frame the single question)
  - **Why?** Now we can introduce style as not just superficial but as the system of relations that defines the letters. Without Step 4, style might be seen as decorative.
  - **Activity:** Present a new, unfamiliar style with a few letters (say, 'a', 'd', 'g') and ask: "If I were to design the 'o' in this style, what would it look like? How do I ensure it's an 'o' and not an 'a' or 'd'?" This leads to the idea that the style must be consistent and the contrasts maintained.
  - **Dependency:** Step 4 establishes that identity is relational; Step 5 extends this to style as the carrier of those relations.

  #### Step 6: Introduce Letter Spirit project (as the frame that unites identity and style)
  - **Why?** Now that the students have grappled with the problem, we can name the project. The project's question is exactly what we've been exploring: how do you design a whole alphabet so that each letter is recognizable and the style is coherent?
  - **Activity:** Briefly describe Letter Spirit: a program that, given a few letters in a style, must design the rest, forcing it to capture the "spirit" of the style while maintaining letter identity. Emphasize that this requires defining what is essential to a letter (the grapheme) and what is stylistic (the variation that must be consistent across the alphabet).
  - **Dependency:** Without the prior steps, this might seem like an arbitrary AI project. Now it's a natural culmination.

  ### 2. The Carrying Example
  - **Choice:** The double-storey vs. single-storey 'a' is strong and can carry the session, but it must be used in conjunction with the relational aspect (Step 4) to avoid leaving the question of identity unresolved.
  - **Why it works:**
    - It is a striking example of radical variation in form for the same grapheme.
    - It is common enough to be familiar but not often analyzed.
    - It lacks any obvious visual commonality (no fixed skeleton), forcing a relational or abstract view.
  - **What it must have:** The two forms must be presented as equally valid and common. Use clear, standard examples (e.g., Times New Roman double-storey and Helvetica single-storey).
  - **What it must lack:** Avoid forms that are transitional or ambiguous. Use clear exemplars.
  - **Supplement:** In Step 4, use the same example to show how the 'a' relates to 'o' in each style. In the double-storey, the 'a' has a hook that the 'o' lacks; in the single-storey, the 'a' has a stem that the 'o' lacks. This ties the identity to contrast.

  ### 3. Misconceptions and How to Address Them
  - **Misconception 1: A letter is a fixed shape (a template).**
    - **When it arises:** Likely at the start (Step 1).
    - **How to head off:** In Step 2, by showing the two 'a' forms. Ask: "If the shape isn't fixed, what is?" This leads to the abstract grapheme (Step 3).
  - **Misconception 2: Style is a skin over a fixed skeleton.**
    - **When it arises:** When style is first mentioned (if introduced too early).
    - **How to head off:** Delay discussing style until Step 5. In Step 4, emphasize that the skeleton (if any) is defined by the style – e.g., the single-storey 'a' has no upper hook, so its skeleton is different. Then in Step 5, show that the same relational principles apply across styles.
  - **Misconception 3: Any mark is a letter if we agree to call it one (extreme relativism).**
    - **When it arises:** Possibly when seeing the two 'a' forms or in Step 4 if contrasts are downplayed.
    - **How to head off:** In Step 4, by showing that in a given style, the contrasts are constrained – an 'a' must be distinguishable from 'o', etc. Agreeing to call a mark 'a' only works if it fits the system of contrasts. Use the example of a style where a letter is ambiguous – it would cause reading errors.

  ### 4. The Final Question/Task
  - **Question:** "Suppose I give you a new typeface with only the letters 'a', 'd', and 'g' drawn. How would you design the 'o' so that it is clearly an 'o' and fits the style? What would you need to consider?"
  - **Why it shows the question has landed:** 
    - It requires them to think about the identity of 'o' (distinguishing it from 'a', 'd', 'g') and the consistency of style (e.g., stroke width, terminals, contrasts).
    - They must articulate the relational aspects (how 'o' differs from nearby letters) and stylistic elements (repeating features from the given letters).
    - It doesn't ask for a definition but for a design decision, showing they've internalized the interplay.

  ### 5. What to Leave Out and How to Say It
  - **Leave out:** 
    - Detailed history of letterforms (e.g., evolution of 'a' from Roman to Carolingian). 
    - Technical aspects of type design (e.g., Bézier curves, hinting). 
    - Other projects in computational creativity beyond Letter Spirit.
  - **How to say it:** "Today we're focusing on the core question of what makes a letter itself across different styles, and how style and identity are intertwined. We're not diving into historical development or the tools of type design – those are fascinating but for another day. Also, while Letter Spirit is one approach, there are others, but we're using it as a frame to think about the problem."

  ### Final Plan Structure
  - **Duration:** 60 minutes (adjust as needed).
  - **Flow:**
    1. (5 min) Introduction and sketch exercise (Step 1).
    2. (10 min) Double-storey vs. single-storey 'a' (Step 2).
    3. (5 min) Glyph vs. grapheme vs. code point (Step 3).
    4. (15 min) Role of contrast in an alphabet (Step 4).
    5. (10 min) Designing a new letter in a style (Step 5).
    6. (10 min) Introduce Letter Spirit and wrap up (Step 6).
    7. (5 min) Final question/task and discussion.

  This plan builds the concepts incrementally, uses the double-storey/single-storey 'a' effectively, addresses misconceptions as they arise, and ends with a task that tests understanding.
answer: |-
  Here's the session plan structured to build the conceptual sequence, using your constraints and raw materials. The goal is to make students confront the tension between letter identity and stylistic variation, culminating in the Letter Spirit framing without starting with it.

  ### Core Sequence of Ideas (with Rationale for Order)
  1. **Start with immediate recognition (5 mins)**  
     *Activity:* Display 10 wildly different 'a' glyphs (e.g., blackletter, script, stencil, sans-serif). Ask: "Which of these are unambiguously 'a'? Why?"  
     *Why this first:* Forces them to surface their instinctive template-matching assumption. Creates tension—they'll *feel* all are 'a' but struggle to articulate why. Establishes that recognition isn't about fixed shapes.

  2. **Introduce grapheme/glyph/code point separation (5 mins)**  
     *Activity:* Show Unicode 'a' (U+0061) alongside your two 'a' constructions. Ask: "Is this digital 'a' the same *thing* as these drawn shapes? If I change the font, does the 'a' change or stay the same?"  
     *Why now:* Must come before style discussion to prevent collapse of concepts. Creates a "container" for abstract identity (grapheme) distinct from visual form (glyph). Dependency: Recognition exercise (#1) exposes the need for this distinction.

  3. **Reveal double-storey vs. single-storey 'a' as a single grapheme (10 mins)**  
     *Activity:* Side-by-side comparison of both 'a' forms in one coherent typeface (e.g., FF Meta's italic has both; else show handwriting vs. text face). Challenge: "Defend why these share an identity when they lack shared parts."  
     *Why after #2:* Glyph/grapheme split makes this fact *meaningful*. Before this, students might dismiss it as "just two styles." Now it destabilizes shape-based definitions. Dependency: Glyph/grapheme separation (#2) lets this example reframe identity as non-visual.

  4. **Introduce contrast through minimal pairs (10 mins)**  
     *Activity:* Show an 'a' and 'o' nearly identical except for one detail (e.g., in a tight sans-serif). Then distort the 'a' until it resembles an 'o'. Ask: "At what point does it stop being 'a'? What forces that decision?"  
     *Why after #3:* The two 'a' forms show identity persists despite visual change; this shows identity *collapses* under insufficient contrast. Dependency: Grapheme concept (#2) and radical glyph variation (#3) prepare students to see identity as system-dependent.

  5. **Bind style and identity using contrast (10 mins)**  
     *Activity:* Present a novel, consistent style with 3 letters (e.g., 'n', 'h', 'b'). Task: "Sketch an 'a' that belongs here without copying known forms." Discuss failures (e.g., if 'a' clashes with 'd').  
     *Why last:* Contrast (#4) proves style isn't decoration—it's the system governing identity. Without this, style feels cosmetic. Dependency: Contrast exercise (#4) reveals that "belonging" requires relational constraints, making style integral to identity.

  6. **Name Letter Spirit project as the frame (5 mins)**  
     Reveal it as a formalization of their struggle: "A program must extend a style while preserving letterhood. Like you just tried with 'a', but for 26 letters. It forces us to ask: What must *stay* so 'a' is 'a'? What must *change* to fit the style?"  

  ---

  ### The Carrying Example: Double-Storey vs. Single-Storey 'a'
  - **Why it works:** It embodies the paradox perfectly—two forms with near-zero visual overlap, yet identical identity. This forces abstraction beyond shape.  
  - **Essential traits:**  
    - Must lack any universal skeleton (no shared strokes or proportions).  
    - Must exist in one typeface/hand to prevent "different fonts" dismissal.  
  - **Supplement with:** Your contrast idea. Mid-session, show how each 'a' form contrasts with 'o' in its native style (e.g., double-storey's hook vs. 'o's closure; single-storey's stem vs. 'o's symmetry). This ties identity to system.  
  - **Why not alternatives:** Mirrored/rotated letters (e.g., d/p/q) risk overemphasizing symmetry; ambiguous glyphs feel like edge cases. The 'a' duality is central and ubiquitous.

  ---

  ### Misconception Management
  - **"Letters have fixed shapes"**  
    *When:* Will dominate early discussion (Steps 1–2).  
    *Counter:* In Step 3, ask: "What geometric property is shared by both 'a' forms? If nothing, what *is* shared?" Force admission of abstract identity.  

  - **"Style is decoration on a skeleton"**  
    *When:* Likely when style is first mentioned.  
    *Counter:* In Step 5, have students modify their "sketched 'a'" to match a new style. Ask: "Did you adjust the skeleton or just add flourishes? Could you use the same skeleton for both 'a' forms?"  

  - **"Identity is whatever we agree on"**  
    *When:* May emerge in Step 3 or Step 4 as a retreat.  
    *Counter:* In Step 4, show an illegible 'a'-'o' hybrid. Ask: "Would agreeing this is 'a' make it functional? What breaks?" Highlight communication constraints.  

  ---

  ### Final Diagnostic Task
  **"Here’s a new letter in an unknown style. [Show a glyph blending features, e.g., an 'a' with a double-storey bowl but single-storey stem.] Argue for whether it’s a bad 'a', a good 'g', or neither—using today’s concepts."**  
  - *Why it works:* Tests if they use system-level thinking (e.g., "It clashes with 'g' because..." or "The style inconsistency breaks identity"). Correct answers are less important than invoking grapheme vs. glyph or contrast. Avoids parroting by requiring application to a novel case.

  ---

  ### Deliberate Omissions and How to State Them
  - **Omit:** Historical evolution of letterforms, neurocognitive research on recognition, technical type-design principles (e.g., Bézier curves).  
  - **State explicitly:** "We’re avoiding *how* letters evolved or *how* our brains recognize them. Why? Because today is about the design logic: What constraints bind identity and style? Save the ‘why’ for linguists and psychologists—we’re building the ‘what’."  

  ---

  ### Session Flow (60-Minute Timeline)
  - **0–5 mins:** Recognition challenge (Step 1).  
  - **5–10 mins:** Grapheme/glyph/code point (Step 2).  
  - **10–20 mins:** Two 'a' forms as one grapheme (Step 3).  
  - **20–30 mins:** Contrast with 'o' and distortion exercise (Step 4).  
  - **30–40 mins:** Style-binding sketch task (Step 5).  
  - **40–45 mins:** Introduce Letter Spirit (Step 6).  
  - **45–55 mins:** Final diagnostic task + debate.  
  - **55–60 mins:** Wrap-up: "If you leave arguing whether style *creates* identity or just *dresses* it, I’ve done my job."  

  This plan uses the double-storey/single-storey 'a' as the central provocation, layers concepts to isolate identity from shape, and positions style as the system that negotiates identity. By the end, Letter Spirit emerges as the natural frame for their unresolved questions.
