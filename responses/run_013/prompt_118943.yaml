  On the thick/thick distinction: Under thin reading, foundationalism struggles with how unjustified propositions can justify others. Thick reading sidesteps this by anchoring in non-propositional states, making foundationalism more plausible. Coherentism remains stable in both but gains psychological texture in thick reading. Infinitism's "available" chains are crucial—actual traversal is impossible, but potential justification avoids absurdity. 

  Their observation-report view is indeed thick foundationalism, but its empirical nature adds nuance: it's not about raw sense-data but socially embedded reports, which might interest someone with lab experience. That could bridge theory and practice for them. 

