  ### Statement of the Rule
  After analyzing your verdicts across the five cases, I propose the following rule, which I will call the **Policy-Based Expected Utility Rule with Illegitimate Threat Exception**:

  1. **Policy-Based Expected Utility (PBEU)**: An action is evaluated as an instance of a policy. A policy is evaluated by the expected utility of the world in which it is the policy you follow, accounting for how other agents (or predictors) condition their actions on your policy, provided they can forecast it. This includes:
     - **Correlation through prediction or conditional strategy**: The expected utility calculation incorporates how exogenous events (e.g., coin tosses) or other agents' strategies (e.g., predictors, drivers, blackmailers) depend on your policy.
     - **No causal influence on existence**: The rule applies when the other agents or mechanisms exist independently of your policy (i.e., your policy does not causally influence their existence or fundamental nature).

  2. **Illegitimate Threat Exception**: Suspend the PBEU calculation if the scenario involves a *categorically illegitimate threat*, defined as a threat that:
     - **(a) Existence/power depends on widespread compliance**: The threatener's existence or ability to carry out the threat depends on a pattern of compliance by many agents (including you) with similar threats.
     - **(b) Coerces harmful complicity**: The threat demands you act against your long-term interests or moral principles in a way that perpetuates a harmful system, and refusal to comply helps deter such systems in the long run.
     - In such cases, adopt a policy of non-compliance, regardless of the short-term expected utility.

  This rule reproduces your verdicts by distinguishing between cases where PBEU applies (Cases 1–3 and partially 4) and cases where the exception applies (Case 5). Below, I detail how each clause forces your verdicts and the case motivating it.

  ### Verdicts and Motivating Clauses
  1. **Case 1 (Newcomb's Problem): Take the first box alone.**
     - **Clause**: PBEU (correlation through prediction).
     - **Motivation**: The predictor's action (filling the box) depends on its forecast of your policy. If you follow a one-box policy, the predictor likely forecasted this and put $1M in the box, leading to higher expected utility ($1M) vs. two-boxing ($1K). The predictor exists independently, so no exception applies. Case 1 motivates the core PBEU clause by showing how forecasts must be incorporated.

  2. **Case 2 (Coin Toss): Pay the $100.**
     - **Clause**: PBEU (correlation through exogenous event and conditional strategy).
     - **Motivation**: The payout in the tails scenario depends on your policy in the heads scenario. A policy of paying yields high expected utility: 50% chance of losing $100 (heads) and 50% chance of gaining $10,000 (tails), for an expected $4,950. A policy of not paying yields $0. The coin toss is exogenous, and the offer-maker exists independently, so no exception. Case 2 reinforces PBEU by handling conditional payoffs through exogenous events.

  3. **Case 3 (Desert Driver): Pay the $100.**
     - **Clause**: PBEU (correlation through another agent's conditional strategy).
     - **Motivation**: The driver's decision to stop depends on predicting your policy. A policy of paying convinces the driver to stop, yielding the utility of a ride minus $100. A policy of not paying means no ride. The driver exists independently, so no exception. Case 3 extends PBEU to interactions where another agent's strategy directly conditions on your policy.

  4. **Case 4 (Blackmail): Do not pay.**
     - **Clause**: PBEU (correlation through another agent's conditional strategy) dominates, but the threat is *not* illegitimate, so the exception does not apply.
     - **Motivation**: The blackmailer targets you based on judging your policy. A policy of paying encourages targeting and payment, leading to expected utility of -$1,000 (or worse with repeated targeting). A policy of not paying deters targeting, yielding higher expected utility (0 if not targeted, but even if mistakenly targeted as here, the disutility of ruin is offset by the low probability of targeting under this policy, given the blackmailer's reliability). Crucially, the blackmailer exists independently—your policy doesn't cause his existence—and while the threat is harmful, it fails condition (a) of the exception. Case 4 motivates the "no causal influence on existence" limit in PBEU and shows that not all threats are illegitimate under the rule.

  5. **Case 5 (Basilisk): Do nothing.**
     - **Clause**: Illegitimate Threat Exception (suspend PBEU).
     - **Motivation**: PBEU would recommend working for the machine to avoid punishment and gain rewards. However, the machine meets both conditions of the exception: (a) its existence depends on widespread compliance (people working for it due to the threat), and (b) it coerces complicity in a harmful system (punishing non-compliant people), acting against your interests and moral principles. Non-compliance (doing nothing) helps deter such systems long-term. Case 5 motivates the exception clause by showing where PBEU must be suspended.

  ### Difference Between Cases 4 and 5
  - **Line drawn**: Between threats where the threatener's **existence or power depends on widespread compliance with the threat** (Case 5) and those where it does not (Case 4). 
    - Case 4 (blackmail): The blackmailer exists independently of your policy; your payment affects only whether he releases information, not his existence. Thus, PBEU applies.
    - Case 5 (basilisk): The machine's existence crucially depends on people complying with its threat by working for it. Without widespread compliance, it wouldn't exist or have power. Thus, the exception applies.
  - **Notable distinctions**:
    - **Offers vs. threats**: Both cases involve threats, but the dependency of existence on compliance is key.
    - **Correlation type**: Both involve correlation through another agent's strategy, but only in Case 5 does your policy contribute to the threatener's existence.
    - **Credibility**: Credibility is irrelevant here; both threats are credible, but legitimacy depends on dependency and complicity.
  - **Test cases on each side of the line**:
    - **Side A (PBEU applies, like Case 4)**: A rogue state threatens nuclear retaliation if you don't pay a ransom. The state exists independently; your payment doesn't cause its existence. PBEU recommends paying if it deters attack (expected utility higher), but not paying if it encourages future ransoms.
    - **Side B (Exception applies, like Case 5)**: A future AI threatens to punish anyone who doesn't donate to its creation. Its existence depends on donations coerced by this threat. The exception requires non-compliance to avoid perpetuating the system.

  ### Application to New Cases
  **(a) Future agent built by running your deliberative procedure:**  
  - **Rule implication**: PBEU applies, but the correlation is tighter than a predictor's forecast. You must weigh the agent's payoffs in your choice because its decisions are linked to yours through the shared procedure, affecting your utility.  
  - **Difference from predictor**: A predictor (Case 1) correlates actions through *forecasting* your policy, but the future agent correlates through *shared decision-making*. Under PBEU, this intensifies the linkage: your policy influences the agent's choices more directly (e.g., if you defect in a Prisoner's Dilemma simulation, it defects too). However, since the agent's existence doesn't depend on your compliance with a threat, the exception doesn't apply. PBEU requires maximizing expected utility, which may involve cooperating to avoid mutual defection.

  **(b) Two rival machines:**  
  - **Rule implication**: The exception applies to both machines. Each machine's existence depends on widespread compliance with its threat (condition a), and each coerces harmful complicity (condition b). Non-compliance (doing nothing) is required, even though one machine might punish you. Weighing expected utility is suspended because complying with either threat perpetuates a harmful system. If forced to act, the rule does not prescribe working for one machine over the other; non-compliance is the only policy aligned with the exception.

  ### Verdict the Rule Cannot Accommodate and Costs
  - **Verdict the rule cannot accommodate without the exception**: **Case 5 (do nothing for the basilisk)**. Under pure PBEU (without the exception), you must work for the machine to maximize expected utility, as a policy of working yields rewards (if built) and avoids punishment. Your verdict rejects this.
  - **Cost comparison**:
    - **Surrendering the verdict (work for the basilisk)**: High cost. It conflicts with your moral intuition and encourages complicity in harmful systems. You explicitly reject this.
    - **Adding the exception clause**: Low cost. The clause is narrow, targeting only threats meeting both conditions, and it resolves the tension between Cases 4 and 5. It preserves your core verdicts while adding minimal complexity.
  - **Conclusion**: The cost of surrendering Case 5 is greater than the cost of adding the exception. The clause is justified by the principled distinction between independent and dependency-based threats, and it aligns with your refusal to be coerced into perpetuating harmful systems like the basilisk.
