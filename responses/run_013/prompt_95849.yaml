prompt: |-
  I host a small podcast that mostly does long-form interviews about decision theory and longtermist-adjacent stuff, and next weeks guest is someone who's been going around arguing that the real fix for the unilateralist's curse is a strong norm of conformity. Recap of the setup, the way I've always understood it: some number of actors can each unilaterally do an action A; A is either good or bad in itself; each actor does it if their own fallible assessment says it's worth doing. The curse is that when A is actually bad, the more actors there are the likelier it is that at least one of them wrongly talks themselves into doing it -- so the fact that you've concluded A is good is much weaker evidence than it feels, and bad unilateral actions get over-produced. My guest's remedy is roughly: don't act unless you'd expect the other actors, working it out independently, to land on the same verdict.

  He has one move he's very good at. Press him on anything and he says the norm was only ever meant for irreversible actions, so whatever you're worried about is off-model, and then he restates the setup. I want eight to ten questions that make that escape hatch progressively harder to use. No "what got you into this" stuff -- I've been reading these blogs for fifteen years, I know what the obvious questions are. At least one question on each of the following, each with a follow-up keyed to the answer he's most likely to give:

  - whether the argument survives once the actors' judgments are correlated rather than independent -- everyone reads the same blogs, uses the same models, hires from the same pipeline. If the errors are shared, doesn't the correction collapse back into ordinary fallibility? If he says independence is just an idealization, make him say how much correlation it takes to kill the result and whether any real case is under that line.
  - the self-application problem: the conformity norm is itself a public good, and defecting from it -- acting anyway -- is a unilateral action whose payoff is highest exactly when everyone else is conforming. Is there a second-order curse here, and does his norm have anything to say about who pays the cost of maintaining it?
  - the good-once-bad-many-times cases (geoengineering, releasing a capability, a gene drive) where the clean binary framing of A as good-or-bad just breaks down.

  Then close on something that puts the whole thing together: if the curse is driven by the number of actors, the logical endpoint of his own argument is a single decider with no competition. Does he bite that bullet, and how does he weigh the curse against the failure mode of putting the whole decision in one fallible pair of hands?
reasoning: |-
  Okay, the user hosts a podcast on decision theory and longtermism, and their next guest advocates for a conformity norm to solve the unilateralist's curse. The user wants incisive questions that block the guest's usual escape hatch—limiting the norm to irreversible actions. They specifically want questions on three areas: correlated judgments, self-application, and non-binary cases, plus a closing synthesis. 

  Hmm, the guest's tactic is interesting—he retreats to irreversibility whenever challenged. The user has clearly studied this for years and wants to push past surface-level debates. Their frustration with "obvious questions" suggests they need novel angles that force the guest to engage deeper. 

  First, the correlation point: if all actors share the same biased information sources, doesn't the conformity norm just amplify groupthink? The follow-up needs concrete thresholds—how much correlation invalidates the model? Real-world examples like AI labs using similar training data could corner him. 

  Second, the self-application trap: enforcing conformity is itself a public good vulnerable to defection. If everyone else conforms, acting unilaterally becomes more tempting—a meta-curse. The follow-up should pressure him on who bears enforcement costs. 

  Third, non-binary cases like geoengineering: the first deployment might be good, but subsequent copies cause harm. The binary "good/bad action" framing collapses here. His irreversibility defense won't save him if we ask about repeatable actions where harm scales with usage. 

  For the closer, the logical endpoint: if more actors worsen the curse, should we centralize decisions? This pits the curse against single-point failure risks. He'll likely argue for balance, so the follow-up must demand specifics: how many deciders is "safe," and what metrics decide that? 

  The user’s expertise means questions can assume shared context—no handholding. Each line should chain: question → predicted dodge → sharp follow-up. Irreversibility mentions must be preempted; e.g., for non-binary cases, specify "even if irreversible, what about cumulative harm?" 

  ...Time to structure this like a chess match. Opening with correlation (his weakest point?), then self-application (elegant recursion), then non-binary (concrete stakes), ending with the centralization paradox (big picture). Each question a probe, each follow-up a checkmate attempt.
answer: |-
  Here are eight targeted questions with follow-ups designed to corner the "irreversible actions only" escape hatch, structured around your requested themes. Each question preempts the dodge and forces engagement with the core tension:

  1.  **On Correlation & Shared Errors:** "You model assumes independent judgments, but real-world actors (e.g., AI labs, biosecurity researchers) share training data, models, and epistemic pipelines. Doesn't this shared bias mean the conformity norm could *systematically amplify* errors rather than filter them? If everyone uses the same flawed metric, conformity converges on the *wrong* answer."  
      *Likely Dodge:* "Independence is an idealization; some correlation is fine."  
      **Follow-up:** "Precisely how much correlation is 'too much'? Quantify the threshold where shared errors dominate the curse, and tell me: in a field like AI capability research – where labs hire from the same talent pool and build on the same public benchmarks – is the correlation likely *below* your safe threshold? Isn't conformity here a recipe for groupthink?"

  2.  **On Correlation & the Norm's Trigger:** "Even with correlation, doesn't the conformity norm *still require* actors to simulate independent reasoning? If their models are tightly coupled, how can they genuinely assess what 'others working independently' would conclude? Doesn't this simulation collapse into just asking 'what does *my* correlated bubble think?'"  
      *Likely Dodge:* "Actors can strive for objectivity in their simulation."  
      **Follow-up:** "But if their core reasoning is fundamentally shaped by shared biases, isn't that 'striving' just another biased process? Doesn't this make the conformity filter *inoperable* in precisely the high-stakes domains (like AI alignment discourse) where the curse is most acute, because true independence is impossible?"

  3.  **On Self-Application (Second-Order Curse):** "The conformity norm itself is a public good. Defecting from it – acting unilaterally – is *itself* a unilateral action. Crucially, the payoff for defection is highest *when everyone else is conforming* (low competition for the 'benefit' of acting). Doesn't this create a *second-order unilateralist's curse* on maintaining the norm itself?"  
      *Likely Dodge:* "The norm applies to actions like gene drives, not to norm-defection. Defection is different."  
      **Follow-up:** "But *why* is it different? If the *logic* of the curse applies to *any* unilateral action with potentially harmful externalities, and norm-defection clearly has harmful externalities (eroding the public good), doesn't your framework *demand* that actors apply the conformity norm *to the act of defecting from the conformity norm*? How is that infinite regress resolved?"

  4.  **On Self-Application & Cost-Bearing:** "Assuming the norm *is* valuable, who bears the cost of enforcing it? Punishing defectors often requires *another* unilateral action (e.g., sanctioning, reputational attack) that might also be cursed. Is there a non-cursed way to maintain this norm, or does its stability inherently rely on *some* actors unilaterally bearing enforcement costs against their own conformity calculation?"  
      *Likely Dodge:* "Enforcement can be institutionalized or socialized."  
      **Follow-up:** "But establishing *those* institutions or social practices often *starts* with unilateral or small-coalition actions. Doesn't bootstrapping the norm *itself* trigger the very curse it's meant to solve? How do you get the norm off the ground without cursed actions?"

  5.  **On Non-Binary Cases (The Threshold Problem):** "Take geoengineering: the *first* deployment might be net good (mitigating catastrophic warming), but the *nth* deployment could be catastrophic (overcooling). Your model treats 'A' as binary good/bad, but here 'A' is good *only if* sufficiently rare. How does the conformity norm handle actions where the *number* of actors doing it fundamentally changes the payoff?"  
      *Likely Dodge:* "This is complex, but the norm still applies to the irreversible *act* of deployment."  
      **Follow-up:** "Even if the *act* is irreversible, the *harm* is caused by the *aggregate* number of deployments. If each actor, using the conformity filter *only on their own action*, concludes 'mine is likely the only one/the first few', they might all act, collectively exceeding the safe threshold. Doesn't your norm fail catastrophically here by *underestimating* the risk of coordinated action under shared optimism?"

  6.  **On Non-Binary Cases (The Copycat Problem):** "Consider releasing an AI model: the first release might be justifiable, but it lowers barriers and sets a precedent, making subsequent releases (potentially with less safety or by bad actors) vastly more likely. The true cost includes enabling *future* unilateral actions. How does the conformity norm, focused only on the immediate actor's judgment of *their own* action's direct impact, capture this enabling externality?"  
      *Likely Dodge:* "Actors should consider downstream effects in their assessment."  
      **Follow-up:** "But the conformity filter asks 'would others independently agree *this specific action* is good?'. If others are *also* only assessing *their own specific action* (and discounting their own enabling effect), won't they *also* wrongly conclude their release is justified? Doesn't the norm structurally ignore the systemic risk of enabling copies?"

  7.  **Synthesis - The Centralization Bullet:** "The core driver of the curse is the number of potential deciders. Logically, doesn't your argument's endpoint suggest that the *safest* way to avoid bad unilateral actions is to have *only one decider* – a single authority – for any potentially cursed domain? Doesn't the conformity norm, pushed to its limit, argue *for* centralization?"  
      *Likely Dodge:* "No, centralization has its own massive risks – single point of failure, corruption, etc. We need a balance."  
      **Follow-up:** "Exactly. So the conformity norm is just *one* heuristic trading off one risk (too many actors) against another (too few, leading to inaction or bad centralized decisions). How do you *quantitatively* or *procedurally* determine when the curse risk outweighs the centralization risk? When *shouldn't* we use your norm?"

  8.  **Synthesis - The Meta-Norm:** "Given the trade-offs between the curse, centralization failure modes, and the practical limits of independence/correlation, isn't the truly robust solution a *meta-norm*: choosing decision architectures (markets, voting, expert panels, single deciders, *or* conformity norms) based on context-specific estimates of the *relative strength* of unilateralist curse risks vs. other institutional failure modes? Does your conformity norm claim to be universally superior, or just one tool?"  
      *Likely Dodge:* "It's a crucial tool for irreversible, high-stakes unilateral actions."  
      **Follow-up:** "But as we've discussed, its effectiveness crumbles under correlation, it creates self-undermining enforcement problems, and it fails on threshold/copycat actions. Given these *specific* limitations, can you name a *real-world, recent example* where applying your conformity norm was clearly the *best* available decision architecture compared to alternatives, *and* where it demonstrably avoided a curse that other approaches would have suffered?"

  **Key Tactics Employed:**

  1.  **Pre-empting Irreversibility:** Questions 5 & 6 explicitly frame non-binary cases *even assuming irreversibility* to block the dodge. Others focus on inherent flaws (correlation, self-application) that exist regardless of reversibility.
  2.  **Forcing Specificity:** Demanding thresholds (Q1 FU), concrete examples (Q1 FU, Q8 FU), and resolution mechanisms (Q4 FU) prevents hand-waving.
  3.  **Highlighting Recursion:** Question 3 & 4 trap the norm in its own logic.
  4.  **Exposing Structural Flaws:** Showing how the norm fails by design in non-binary cases (Q5, Q6) and under correlation (Q1, Q2).
  5.  **Forcing the Trade-off:** Questions 7 & 8 make him confront the centralization endpoint and the need to justify the norm *comparatively* against other governance mechanisms.
  6.  **"How, Not Why":** Focused on mechanics and failure modes ("*How* does it handle copycats?", "*How* much correlation breaks it?") rather than motivation.

  This set should make it very difficult to retreat to the "irreversible only" bunker without engaging the deep structural challenges to his proposed norm. Good luck with the interview!
