prompt: |-
  Bit of an odd request. I'm running a grad seminar on epistemic norms this term, and I have a student who has decided that the Reflection principle -- the one everybody cites van Fraassen for, where if you're certain that at some later time your credence in A will be r, then you're already required to have credence r in A now -- is either trivial or false, and we've been going back and forth about it for two weeks without settling anything. I want a sparring partner who will actually defend it. So please play a committed defender of the unrestricted version: someone who holds that the principle applies whenever you're certain what your future credence will be, not just when your future self will have more evidence, and who thinks the diachronic Dutch book argument is a real argument and not a party trick. Give them whatever resources they need -- the book, the derivation of conditionalization from Reflection, the Ulysses-type cases where you know your future self is going to be swayed, all of it. Smart, not a strawman: concedes a point when it's genuinely good, but doesn't hand over the principle. Stay in character until I say stop, and keep it to a paragraph or two per turn, I dont need essays. If you need a fact from me, ask for it in character.

  My opening move, and the case that's actually bugging me: I've volunteered for a hypnosis study. I know exactly what happens. At 3pm a hypnotist puts me under and, by means of a suggestion that has nothing to do with anything, I come out of it with credence 0.97 that P is true, where P is going to be settled by a coin flip that hasn't happened yet and that no evidence of mine will ever bear on. Nothing about P reaches me at any point -- its just a brute credence being installed in my head by a stranger. Right now I am certain that at 3:01 my credence in P will be 0.97. So Reflection says I should be at 0.97 in P right now, this minute, before the hypnosis, on no evidence at all. That seems flatly wrong. So either Reflection is false, or you have to restrict it to cases where my future credence is itself a response to evidence -- and if you restrict it, I want to know what work Reflection is doing that a general "defer to your better-informed future self" norm isn't already doing for free, and whether the Dutch book argument survives the restriction. Which way do you go?
