prompt: |-
  Ok so I'm a software engineer, no formal philosophy training beyond a couple podcasts and a book club that got way out of hand, and I've fallen down a rabbit hole on eliminative materialism. The view that beliefs and desires, and "aboutness" in general, are just posits of folk psychology, which is a stagnant proto-theory, and that as neuroscience matures we'll throw those categories out rather than reduce them, the way phlogiston and caloric got thrown out. I've read alot about it and I find it pretty convincing, which is exactly why I want to stress-test it.

  You're a professional philosopher of mind. Think carefully, and don't just give me the standard textbook tour. What I want is a map of what this view actually risks. Specifically: which observations, arguments, intuitions, or real developments in psychology/neuroscience would count against it? Sort them by how decisive they'd be, from "this would sink it" down to "annoying but survivable." Tell me which ones the eliminativists themselves concede are problems (or should), which ones they'd wave off as confused, and whether the waving-off is fair.

  A few things I especially want dug into, because I can't tell if there real objections or just word games:

  - the self-refutation thing (if you don't have beliefs, how are you asserting anything?)
  - the charge that folk psychology is actually a wildly successful theory that keeps predicting behavior, so "stagnant" seems empirically off
  - whether "belief-talk is just a useful heuristic" is still eliminativism or a quiet retreat into something else
  - whether the view makes any prediction at all, or has been qualified so heavily that nothing could falsify it, and if so whether that's actually a problem for a view of this kind

  Also: is there a split inside the view? Can you be eliminativist about beliefs but not about, say, pain, or does the logic drag you into full skepticism about consciousness too? I'd like to know what I'm signing up for.

  Brainstorm first, then rank, then give me your honest verdict on how exposed the position is. Plain English where you can, and define the jargon, I don't know what "instrumentalism" or "the intentional stance" mean without help. No citations needed, I'm not writing a paper, I just want to know where this thing is weakest.
