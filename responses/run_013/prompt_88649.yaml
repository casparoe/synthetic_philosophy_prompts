answer: |-
  Here’s a practical, step-by-step procedure for race/ethnicity and sex/gender intake, designed for speed and clarity. It includes scripts, decision rules, and handling for your cases. **Key principle: Record what the participant says, not what you think they "are."**

  ---

  ### **Intake Procedure: Race/Ethnicity & Sex/Gender**  
  **Time Budget:** 2-3 minutes  
  **Tools Needed:** Clinic form (with write-in), Funder form (6 boxes), Pen.  

  #### **Step 1: Explain Why (Briefly)**  
  *Script:*  
  > “We ask about race, ethnicity, and gender because it helps us see if everyone gets the same quality of care. For example, it can show if some groups face more health barriers. Your answer is voluntary and won’t affect your care.”  

  **Stop if:** Participant refuses → Record as “Declined” on both forms. Move on.  
  **Good enough:** A nod, "Okay," or no pushback. Don’t debate.  

  #### **Step 2: Ask Race/Ethnicity**  
  *Script:*  
  > “**How do you describe your race or ethnic background?** For example, some people say Black, Latino, Asian, Native American, White, or something else.”  

  - **If they give one answer** (e.g., “Black”):  
    - ✔️ **Funder form:** Check the matching box.  
    - ✔️ **Clinic form:** Write their exact words (e.g., “Black” or “Haitian”).  
  - **If they give multiple terms** (e.g., “Mexican and White”):  
    - ✔️ **Funder form:** Check *all* boxes that match (e.g., "White" + "Hispanic/Latino").  
    - ✔️ **Clinic form:** Write their exact phrase ("Mexican and White").  
  - **If they give an unsupported term** (e.g., “Haitian”):  
    - ✔️ **Funder form:** Check the *closest box* (e.g., “Black”).  
    - ✔️ **Clinic form:** Write their exact words (“Haitian”).  
    - *Script:* “I’ll mark ‘Black’ for the main funder report, but I’ll write ‘Haitian’ in our clinic file so it’s recorded.”  

  **Stop if:**  
  - They say “I don’t know” → Record “Unknown” on both forms.  
  - They refuse → Record “Declined.”  

  #### **Step 3: Ask Sex/Gender**  
  *Script:*  
  > “**What’s your current gender?** Options are Female, Male, or Another Identity.”  

  - **If they say Female/Male:**  
    - ✔️ **Funder form:** Check F or M.  
    - ✔️ **Clinic form:** Write “Female”/”Male” + note if they specify (e.g., “Transgender man”).  
  - **If they say non-binary, genderfluid, etc.:**  
    - ✔️ **Funder form:** *If no non-binary box, leave blank or check "Other" if forced.*  
    - ✔️ **Clinic form:** Write their exact words (e.g., “Non-binary”).  
  - **If they question why:**  
    - *Script:* “We track this because some groups face different health risks, like access to screenings.”  

  **Stop if:** Refusal → Record “Declined.”  

  #### **Step 4: Resolve Conflicts**  
  - **Old chart vs. current answer (e.g., 74yo with outdated term):**  
    → **Record current self-description only.** Ignore old chart.  
    *Script:* “Thanks, I’ll update that.”  
  - **Siblings give different answers (e.g., one “Latino,” one “White”):**  
    → **Record each exactly as stated.** Do not “correct” or match.  
    → ✔️ **Data Dictionary Note:** “Sibling race/ethnicity may differ; self-report only.”  

  #### **Step 5: Escalate If...**  
  - Participant demands a category the funder forbids → Hand to PI with note: “Participant insists on [X] not on form.”  
  - Legal threat, extreme distress → Pause intake, notify PI.  
  - **IRB Escalation:** Only if the form forces misgendering (e.g., non-binary erased) or violates consent.  

  #### **Step 6: Data Dictionary Notes**  
  Add this to your dataset’s documentation:  
  > “Race/Ethnicity and Gender fields reflect **self-reported identity at time of intake**. Funder categories may not fully capture identity. ‘Declined’ = refused answer; ‘Unknown’ = couldn’t answer. **Do not assume biology, ancestry, or family consistency.** Data impacted by form limitations (e.g., no write-in options).”  

  ---

  ### **Worked Cases**  
  1. **Haitian participant:**  
     - Step 2: She says “Black, family’s Haitian.”  
     - Funder: Check “Black.”  
     - Clinic: Write “Black; identifies as Haitian.”  
     - *Script:* “I’ll mark ‘Black’ here for the main report, but I’m writing ‘Haitian’ in our clinic record.”  

  2. **74yo with outdated chart:**  
     - Step 2: She says “I’m White.” (Old chart: “Caucasian”).  
     - Funder: Check “White.”  
     - Clinic: Write “White.” Ignore old chart.  

  3. **Siblings pick different boxes:**  
     - Sibling 1: “Latino” → Funder: “Hispanic/Latino,” Clinic: “Latino.”  
     - Sibling 2: “White” → Funder: “White,” Clinic: “White.”  
     - **No change.** Analyst’s assumption is their problem.  

  4. **Participant refuses:**  
     - Step 1: They say “Why do you need this? I’m not answering.”  
     - *Script:* “It helps us track health fairness. You can skip it if you’re uncomfortable.”  
     - Record “Declined” on both forms. Move on.  

  5. **PI asks to “adjust for race” in blood-pressure model:**  
     - **This is the outcome you won’t like.**  
     - Respond: “**Confirming: Are we using race to measure societal discrimination (e.g., racism as a risk factor) or as a biological variable?** The data is self-reported identity only; it doesn’t reflect genetics. If biological, we need a different var (e.g., genetic ancestry). If social, note that funder categories may misclassify.”  
     → Forces PI to clarify intent. If they insist on biological interpretation, escalate to IRB: “Race being misused as genetic proxy.”  

  ---

  ### **Where This Misfires or Fails**  
  - **Misfires:**  
    - Multiracial participants forced into one box (funder limitation).  
    - Non-binary/trans participants erased on funder form.  
    - "Declined" rates may be high if community distrusts the system.  
  - **Can’t Decide:**  
    - If a participant says “I don’t fit any box, but I won’t decline” → Record “Unknown” + clinic write-in: “Declines standard categories.”  
    - If funder demands one box but participant gives multiple with equal weight → Escalate to PI: “Force to choose or override?”  
  - **Data Dictionary Must Include:**  
    > “**Race/ethnicity is NOT genetic.** Gender is NOT sex assigned at birth. Blank = field not offered or technical error; ‘Declined’ = refused. Historical terms in old charts were conventions of their time, not current identity.”  

  ---

  **Why this works:**  
  - Uses **participant’s words** as the source of truth.  
  - **Decouples funder compliance** from rich clinic data.  
  - **Scripts are fast** and explain *why* without jargon.  
  - **Escalation paths** for values calls (not your job to decide).  
  - **Data dictionary** prevents future misuse.  

  You’re not just a data-entry clerk—you’re a **boundary spanner** between lived identity and bureaucratic categories. This procedure respects that while meeting deadlines.
