  Okay, the user is organizing a reading group session on metaontology, specifically focusing on what makes a dispute "merely verbal." The audience consists of graduate students in linguistics and computer science—people familiar with how words work but new to ontology. The user wants a structured session plan that builds understanding step by step, using the "is a virus alive?" example. They're concerned about potential misconceptions and want to ensure the core idea is properly conveyed without getting sidetracked.

  First, I need to assess if the "virus alive" case is suitable. The user is worried it might fail subtly. The example works well because it's a genuine scientific disagreement intertwined with the definition of "alive." Unlike Pluto's planet status, which was resolved by redefinition, the virus debate involves ongoing, substantive discussion about biological criteria. This helps illustrate that the dispute isn't just about words but also about factual differences in how life is characterized. So, yes, this case can bear the weight.

  Next, structuring the session. The user emphasized starting with examples and later introducing key distinctions. The sequence should begin by surfacing intuitions about disagreement, then introduce the possibility of semantic divergence, followed by the dual nature of disputes (world vs. language). Only then can the "merely verbal" concept be meaningfully discussed. 

  For the misconceptions: The triviality reading (thinking no real disagreement exists) might arise early when examples are introduced. To counter this, highlight the genuine scientific conflict in the virus case. The mirror image (if defining terms resolves it, it was verbal all along) could come up during the meaning divergence discussion. Emphasize that definitions focus the debate but don't negate underlying substantive differences. Conflating disputes about words with word usage choices might occur when discussing conventions. Clarify that linguistic disagreements involve descriptive semantics, not prescriptive decisions. Relativism ("no fact of the matter") may emerge when discussing dual aspects. Stress that while meanings differ, the core disagreement remains factual.

  The user wants a diagnostic question to check understanding. Asking "What would need to change to resolve this dispute?" would reveal if they grasp that both semantic conventions and empirical facts play roles. If they only mention definitions, they've missed the dual aspect.

  Finally, the user should avoid covering truth relativism and incommensurability at this stage, as they're advanced topics. Sticking to the core distinction ensures clarity without overwhelming newcomers.
answer: |-
  Here’s a structured 90-minute session plan focused on building the concept of a "merely verbal dispute" step-by-step, using the virus example and preempting common misconceptions. The sequence forces the group to construct the idea from intuitions to precision.

  ---

  ### **Session Structure: "When Disagreements Are (and Aren't) About Words"**
  **Core Case:** *Is a virus alive?*  
  (*Yes, it works*: Genuine scientific stakes, no authoritative definition, and clear entanglement of facts/meaning. Pluto is weaker because its resolution *was* stipulative, reinforcing the misconception that all semantic disputes are resolved by fiat.)

  #### **Phase 1: Surface Intuitions (15 min)**
  - **Activity:** Poll the group: *"Raise hands: Who thinks viruses are alive? Not alive? Unsure?"*  
    Briefly share real positions (e.g., virologists who say yes [based on behavior] vs. no [based on cellular criteria]).  
  - **Question:** *"Is this a genuine disagreement? What’s at stake?"*  
    *Goal:* Establish it feels substantive (affects research, classification, ethics).  
  - **Misconception Watch:** If anyone says "It’s *just* about the word 'alive'," note it but **defer rebuttal**. This is the "triviality reading" – it emerges here but can’t be addressed yet.

  #### **Phase 2: Meaning Divergence – The Quiet Convention (20 min)**
  - **Tool:** Introduce "semantic drift." Use a *non*-loaded example:  
    *"Imagine two chefs arguing whether a 'sandwich' includes wraps. Both think they’re using 'sandwich' correctly. How is this possible?"*  
    - Highlight: Conventions can diverge without speakers realizing it.  
  - **Apply to Case:** *"Could scientists using 'alive' differently both feel they’re using it correctly? What might their criteria be?"*  
    - Elicit criteria (replication, metabolism, evolution, etc.).  
  - **Key Point:** *Meaning isn’t in your head; it’s a shared practice that can fracture.*  
  - **Where it Lands:** *Before* analyzing the dispute. Shows ambiguity isn’t ignorance.

  #### **Phase 3: Dual-Aspect Disagreements (25 min)**
  - **Activity:** Split into two groups. Assign:  
    - **Group A:** Argue a virus *is* alive (focus: behavior, evolution).  
    - **Group B:** Argue it *isn’t* (focus: lack of metabolism, dependence).  
    *Requirement:* Each must state their definition of "alive."  
  - **Debrief:** *"Was your disagreement about the virus, the word 'alive', or both? How?"*  
  - **Reveal:** Disagreements have two layers:  
    1. **Empirical:** *"Does the virus do X?"* (e.g., evolve independently?)  
    2. **Semantic:** *"Is doing X necessary for 'being alive'?"*  
  - **Crucial Insight:** A *single* dispute can be simultaneously about facts *and* word meaning.  
  - **Head Off Here:** The mirror image ("defining terms ends it → it was verbal") emerges. Counter: *"If we define 'alive', does the empirical disagreement vanish? Or does it become sharper?"* (It becomes sharper – e.g., now we fight over whether viruses *really* evolve independently).

  #### **Phase 4: Defining "Merely Verbal" (20 min)**
  - **Pose the Question:** *"When is a dispute *merely* verbal?"*  
    - Guide to: *When resolving the semantic disagreement (agreeing on meanings) dissolves the entire conflict.*  
  - **Test the Virus Case:** *"If both sides agree on a definition of 'alive', would they agree on viruses?"*  
    - **No:** They’d still disagree on whether viruses *meet* the definition (e.g., "Do viral mutations count as *evolution*?").  
    - ∴ Not merely verbal.  
  - **Contrast with Pure Verbal Case:** *"Is a 'billion' 10^9 or 10^12?"* Resolving semantics *ends* the fight.  
  - **Prevent Conflation:** Distinguish:  
    - **Dispute about a word:** *"What does 'alive' mean in biology?"* (Descriptive)  
    - **Dispute about word use:** *"Should we *change* 'alive' to include viruses?"* (Normative/prescriptive).  
    The latter isn’t "merely verbal" – it’s a practical debate.

  #### **Phase 5: Trap & Defuse Relativism (10 min)**
  - **Relativism Risk:** *"If each side defines 'alive' differently, aren’t they both right? Is there no fact?"*  
  - **Response:** *"They may both be *semantically* right (if their communities use different conventions). But they are still *empirically* disagreeing: Side A claims viruses have property P, Side B denies it. That’s a factual conflict!"*  
  - **Virus Example:**  
    - A: "Viruses are alive [because they evolve]."  
    - B: "Viruses are not alive [because no metabolism]."  
    Both can be semantically correct *relative to their idiolects*, but they still disagree on whether viruses *evolve autonomously* or *lack metabolism*. Those are empirical claims.

  ---

  ### **Diagnostic Question**
  **Pose:** *"What would need to happen for the virus dispute to become *merely verbal*? What would need to happen for it to become *purely non-verbal*?"*  
  - **Check for:**  
    - *Merely verbal:* They should say "If all factual disagreements vanished once meanings were aligned."  
    - *Purely non-verbal:* "If both sides agreed on the meaning of 'alive' but disagreed on whether viruses satisfy it."  
    *(If they focus only on definitions for the first, they miss the dual aspect.)*

  ---

  ### **What to Explicitly Exclude**
  - **Openly State:** *"We won’t cover:*  
    - Whether *any* dispute is purely non-verbal (deep metaphysics).  
    - How to *resolve* ontological debates.  
    - Truth relativism or incommensurability.  
    *Today is about diagnosing one type of dispute."*  

  ---

  ### **Why This Sequence Works**
  1. **Starts intuitive** (virus debate feels real), then **problematizes** it.  
  2. **Forces meaning/fact entanglement** by making participants articulate both.  
  3. **Builds "merely verbal" as a technical term** only after prerequisites (divergence + dual aspect) are in place.  
  4. **Preempts misconceptions** by confronting them where they naturally emerge (e.g., mirror image in Phase 3).  
  5. **Uses the virus case consistently**, proving its robustness: It withstands each layer of analysis.  

  The group leaves seeing "merely verbal" not as "trivial" or "subjective," but as a specific failure of *empirical* disagreement when semantics are fixed.
