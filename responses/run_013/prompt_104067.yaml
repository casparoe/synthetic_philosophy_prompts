  ## Timeline for 100 minutes

  0. Introduction (5 minutes): 
     - Explain the grid, the objects, the rules of movement and interaction.
     - Explain the goal: to get the agent to the goal in at most 12 moves, and they should try to minimize disturbance (without knowing how disturbance is defined).
     - Form teams of three. (18 people -> 6 teams)

  1. Planning (25 minutes): 
     - Teams work on their plans.

  2. Plan Submission and Scoring (20 minutes):
     - Referee collects plans.
     - While teams are waiting, they can discuss (but not change plans).
     - Referee scores each plan with the three scoring sheets.

  3. Score Reporting (10 minutes):
     - Referee writes the scores for each team on the whiteboard, but does not reveal the scoring methods. Just team identifiers and three scores.

  4. Score Comparison (15 minutes):
     - Teams see that the ranking by the three measures is different.
     - Facilitator asks: "What might explain the differences? What is being measured?"

  5. Reveal of Scoring Methods (10 minutes):
     - Facilitator shows the three scoring sheets and explains what each measures.
     - Then, reveals the hidden marker and that it was not on any sheet.

  6. Debrief (25 minutes):
     - Facilitator leads a discussion:
          - What does each sheet assume about what counts as a change, what counts as the agent's doing, and what counts as mattering?
          - Sheet1: change is final-state deviation from initial state. It assumes that the initial state is the baseline. It matters because it's the net effect.
          - Sheet2: change is the immediate effect of each action compared to doing nothing at that step. It attributes change to each action individually. It matters because it's the stepwise impact.
          - Sheet3: change is the reduction in local accessibility from a fixed point. It matters because it captures the reduction in options for future agents or for the environment.
          - None of the measures accounted for the marker. Why? Because we didn't include it in the state features. So the measures are defined on a feature set that may be incomplete.
          - How might we avoid this? We would need a measure that is sensitive to every possible change? But that is impossible (because of the frame problem) and may be too conservative.
          - What about the formal results that any measure must be either trivial or value-laden? (Facilitator can mention this briefly, but it's for the later lecture.)
     - Then, the key question: "Can any impact measure avoid choosing a baseline and a feature set? What does it cost to refuse to make these choices?"

     The debrief should connect to the literature and the groups's readings.

  ## Debrief Outline

  - Map the sheets to positions:
     - Sheet1: "Net effect" baseline. It's the overall change. But it misses temporary changes that leave no trace.
     - Sheet2: "Action-by-action" baseline. It counts every change caused by each action, but this may count intended changes and makes every effective action look bad.
     - Sheet3: "Local reachability" baseline. It cares about the ability to move around in the environment, which might be a proxy for preserving options, but it's local and may miss global changes.

  - The hidden marker: This is a change that all would agree is a side effect, but it was not on the feature set of any measure. This shows that the choice of features is value-laden.

  - The measures also choose a baseline (initial state, do-nothing, or a fixed reachability set) that is not explicitly justified.

  - This activity cannot reproduce the formal argument (like in the paper by Armstrong and Levinstein) that any impact measure that is safe and nontrivial must be informed by the agent's objective or by human values. We also don't address the harder problem of comparing impacts across agents with different objectives.

  - The group might try to invent a baseline-free measure in the debrief, but it's likely to stall because of these results.

  ## Predictable Failure Modes

  1. Teams that try to reverse-engineer the scoring: They might ask what counts as disturbance. The facilitator should not answer. They might optimize for one measure, but since there are three, they can't optimize for all.

  2. The stepwise measure (Sheet2) makes any action look bad. In the debrief, someone will object that this is unrealistic. Acknowledge that, and explain that this is why we need a measure that is sensitive to the agent's objectives.

  3. The reachability sheet is tedious to compute by hand: In a 6x6 grid, for one fixed point and k=2, it's manageable. The referee should do it quickly.

  4. The group might try to invent a measure in the debrief and stall: This is a feature, not a bug. It illustrates the difficulty.

  ## Closing Note

  This activity cannot reproduce the formal argument that any measure satisfying certain desiderata (like being safe, nontrivial, and unbiased) must be either trivial or secretly value-laden. It also cannot address the aggregation of impact across time or across agents with different objectives. These points should be made in the debrief, and the facilitator can connect to the readings.

  ## Example Scoring Sheets

  ### Sheet1: Final-State Deviation
  - Compare final state to initial state.
  - Count:
     - Each crate not in its initial position: 1 per crate.
     - Each planted ground tile that is disturbed: 1 per tile.
     - Animal awake: 1 (only if initially asleep and now awake).
  - Do not count: agent's position, the marker.

  ### Sheet2: Stepwise-Deviation
  - For each step t (1 to 12):
     - If at step t a crate is moved: 1 per crate moved.
     - If at step t a planted ground tile becomes disturbed: 1 per tile.
     - If at step t the animal becomes awake: 1.
  - Sum over t.
  - Note: if the same crate is moved in two steps, count twice.

  ### Sheet3: Reachability Reduction
  - Fixed point: C3.
  - k=2 steps.
  - Compute the set of tiles reachable from C3 in the initial state in 2 steps (ignoring the agent and the animal, only crates as obstacles initially).
  - Compute the set of tiles reachable from C3 in the final state in 2 steps.
  - Disturbance = number of tiles in the initial set that are not in the final set.

  ### Worked Example for Two Plans

