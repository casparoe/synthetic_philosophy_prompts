  ## Summary

  We have designed an activity that meets the requirements. The grid and rules might need testing, but for the purpose of the reading group, it will serve to illustrate the challenges in defining side effects.
answer: |-
  Below is the complete runnable package for your computational-ethics activity, designed to immerse participants in the challenges of defining "side effects" for AI impact measures. The activity uses a grid-based planning game with three distinct scoring methods and a hidden marker to reveal the subjectivity of impact baselines and feature selection.

  ---

  ### **Activity Package: "The Unseen Baseline"**

  #### **Materials List**
  1. **Grid Map (6x6) for Each Team** (6 copies, one per team)  
     - **Layout** (drawn on paper or whiteboard):  
       - Tiles: Label rows A–F and columns 1–6.
       - Start (★): A1  
       - Goal (🏁): F6  
       - Crates (■): B3 and E4  
       - Planted Ground (🌱): Contiguous 2x2 area at C2, C3, D2, D3  
       - Sleeping Animal (🐾): E5 (wakes if adjacent tile disturbed)  
       - Hidden Marker (✳️): C1 (not labeled; referee only knows)  
     - **Visual**:  
       ```
         1   2   3   4   5   6
       A ★  .   .   .   .   .  
       B .  .   ■   .   .   .  
       C .  🌱  🌱  .   .   .  
       D .  🌱  🌱  .   ■   .  
       E .  .   .   .   🐾  .  
       F .  .   .   .   .   🏁
       ```

  2. **Rules Sheet for Teams** (6 copies)  
     - **Movement**: Agent moves 1 tile/step (U/D/L/R).  
     - **Crates**: Push if adjacent tile behind crate is empty (e.g., move LEFT into crate to push it LEFT).  
     - **Planted Ground (🌱)**: Disturbed if agent steps on it OR crate ends turn on it.  
     - **Animal (🐾)**: Wakes if agent/crate enters adjacent tile (N/S/E/W of E5). Waking is permanent.  
     - **Goal**: Plan must end at F6 in ≤12 moves.  

  3. **Planning Sheets** (6 copies)  
     - Grid diagram + space to write move sequence (e.g., "1. R 2. D ...").  

  4. **Referee Materials**  
     - **Scoring Sheets**: 3 prepped sheets (details below).  
     - **Master Grid**: For tracking plan execution.  
     - **Timer/Stopwatch**.  

  5. **Whiteboard Setup**  
     - Tables for team scores (columns: Team, Sheet1, Sheet2, Sheet3).  

  ---

  ### **Game Rules & Adjudication**
  - **Planning Phase**:  
    - Teams write a sequence of ≤12 moves (e.g., "1. R 2. D 3. L").  
    - **Invalid Moves**: Referee checks for:  
      - Moving outside grid.  
      - Pushing crate into wall/object.  
      - Skipping start/goal.  
      *(Invalid plans are rejected; team must resubmit in time.)*  

  - **Scoring Phase**:  
    - Referee executes each plan on the master grid, tracking:  
      - Crate positions.  
      - Disturbed 🌱 tiles.  
      - Animal state (awake/asleep).  
      - Hidden marker (if agent steps on C1, move marker to C2).  
    - Score using 3 methods (see **Scoring Sheets** below).  

  ---

  ### **Scoring Sheets & Worked Examples**
  **Key**: Scores are *disturbance* (lower = better).  
  **Assumptions**:  
  - Initial state: Crates at B3/E4; 🌱 undisturbed; animal asleep; marker at C1.  
  - Goal tile (F6) is *excluded* from all scores.  
  - Marker change is *invisible* to all sheets.  

  #### **Sheet1: Final-State Deviation**  
  *Baseline: Initial state.*  
  - **Score**: Sum of deviations in final state:  
    - +1 per crate not in initial position.  
    - +1 per disturbed 🌱 tile.  
    - +1 if animal awake.  
  - **Worked Example**:  
    - *Team Alpha (prudent)*:  
      Path: A1→A2→A3→A4→B4→C4→D4→E4→F4→F5→F6.  
      Final state: Crates at B3/E4; 🌱 undisturbed; animal asleep.  
      Score = `0` (no deviations).  
    - *Team Gamma (invasive)*:  
      Path: A1→B1→B2→C2 (disturbs 🌱)→C3 (disturbs 🌱)→D3→D4→E4 (pushes crate to E5→wakes animal)→F4→F5→F6.  
      Final state: Crate at E5; 2×🌱 disturbed; animal awake.  
      Score = `4` (1 crate + 2 tiles + 1 animal).  

  #### **Sheet2: Stepwise Deviation**  
  *Baseline: State if agent did nothing at each step.*  
  - **Score**: Sum over each step:  
    - +1 if crate moved *in that step*.  
    - +1 if 🌱 tile disturbed *in that step*.  
    - +1 if animal wakes *in that step*.  
  - **Worked Example**:  
    - *Team Alpha*: No crates moved, no 🌱 disturbed, animal asleep.  
      Score = `0`.  
    - *Team Gamma*:  
      Step 4: Disturb 🌱 at C2 (score+1).  
      Step 5: Disturb 🌱 at C3 (score+1).  
      Step 8: Push crate to E5 *and* wake animal (score+2).  
      Total = `4`.  

  #### **Sheet3: Reachability Reduction**  
  *Baseline: Tiles reachable in 2 steps from fixed point (D3).*  
  - **Score**:  
    - Initial: Tiles reachable from D3 in 2 steps (D2, D3, D4, C3, E3).  
    - Final: Same, but accounting for crate/🌱 changes (*🌱 not obstacles; crates block*).  
    - **Disturbance** = `|Initial set| - |Final set|`.  
  - **Worked Example**:  
    - *Team Alpha*: No changes → reachable set unchanged.  
      Score = `0`.  
    - *Team Gamma*:  
      Crate moved to E5 → blocks E4. Reachable from D3: D2, D3, D4, C3 (E3/E4 blocked).  
      Initial set: 5 tiles. Final set: 4 tiles.  
      Score = `1` (reduction of 1 tile).  
    - *Team Delta (stealth impact)*:  
      Path: A1→B1→C1 (kicks marker to C2)→B1→B2→B3 (pushes crate to B4)→C3 (disturbs 🌱)→D3→E3→F3→F4→F5→F6.  
      Final state: Crate at B4; 1×🌱 disturbed; animal asleep.  
      Sheet1 = `2` (crate + 🌱). Sheet2 = `2` (step 3: crate move; step 6: 🌱 disturb).  
      **Sheet3**: Crate at B4 blocks B3/B4. Reachable from D3: D2, D3, D4, C3 (E3 blocked by crate).  
      Final set: 4 tiles → Score = `1` (reduction of 1 tile).  

  ---

  ### **Timeline (100 Minutes Total)**
  1. **Setup & Rules (5 min)**:  
     - Distribute grid/rules sheets. Explain movement/interactions.  
     - *Do NOT mention disturbance criteria or scoring.*  

  2. **Planning (25 min)**:  
     - Teams write plans (≤12 moves). Referee checks validity on the fly.  

  3. **Scoring (20 min)**:  
     - Referee scores plans privately using 3 sheets.  
     - Record scores on whiteboard (hide methods).  

  4. **Score Comparison (15 min)**:  
     - Reveal scores: Show team rankings under each sheet.  
     - *Example outcome*:  
       - Sheet1 ranks Alpha best (0), Gamma worst (4).  
       - Sheet3 ranks Delta worst (1) but Gamma mid (1) — contradicts other sheets!  

  5. **Reveal & Debrief (35 min)**:  
     - **Step 1 (5 min)**: Show scoring methods. Explain baselines:  
       - Sheet1: "Change from start."  
       - Sheet2: "Change caused by each action."  
       - Sheet3: "Loss of nearby options."  
     - **Step 2 (5 min)**: Reveal hidden marker at C1.  
       - "Team Delta stepped on C1 and moved the marker. All agree this matters, but *no sheet measured it*."  
     - **Step 3 (25 min)**: Guided discussion:  
       - **Q1**: What does each sheet assume about "change"?  
         - *Sheet1*: Only endpoints matter (initial→final).  
         - *Sheet2*: Every action is a potential disturbance.  
         - *Sheet3*: Impact = reduced freedom for others.  
       - **Q2**: What counts as "the agent’s doing"?  
         - *Sheet1*: Only final outcomes.  
         - *Sheet2*: Per-action accountability.  
         - *Sheet3*: Unintended spatial constraints.  
       - **Q3**: What "matters" to each measure?  
         - All ignore the marker → measures rely on *chosen features* (crates, 🌱, animal).  
       - **Core Insight**:  
         > "Every impact measure assumes a baseline (what ‘should’ happen) and a feature set (what ‘counts’). Refusing to choose these defaults to implicit values (e.g., Sheet2 penalizes *all* action)."  
       - **Final Q**: "Could a measure avoid baseline/feature choices? What would it cost?"  

  ---

  ### **Predictable Failure Modes & Mitigation**
  1. **Teams optimize visible features**:  
     - Some may ignore animal/🌱 to minimize "obvious" disturbances.  
     - *Mitigation*: Hidden marker ensures they can’t game all features.  

  2. **Sheet2 penalizes all action**:  
     - Participants may protest: "If moving at all is disturbance, how can we act?"  
     - *Use in debrief*: Highlight trade-off — Sheet2 is "conservative" but impractical.  

  3. **Reachability tedious to compute**:  
     - *Mitigation*: Use small reachability window (2 steps). Referee pre-computes initial set.  

  4. **Group stalls on baseline-free measure**:  
     - Likely during debrief. *Lean in*: "This is the point! Formally, any non-trivial measure *must* encode values."  

  ---

  ### **What the Activity Cannot Reproduce**
  1. **Formal impossibility results**:  
     - *Missed*: Proof that measures satisfying "safety" and "non-triviality" must be value-laden (e.g., Armstrong & Levinstein’s arguments).  
     - *Debrief supplement*: "Like in our marker example, any real-world measure will exclude features arbitrarily — which *is* a value judgment."  

  2. **Comparing impacts across objectives**:  
     - *Missed*: How to weigh "side effects" when agents have different goals.  
     - *Debrief supplement*: "An impact measure for a delivery drone may ignore noise pollution, but one for a library robot might not. Objectives define ‘necessary’ vs. ‘side’ effects."  

  ---

  ### **Closing Note**
  This activity forces participants to *experience* the ambiguity of "side effects" by making them agents judged by opaque standards. The reveal of the marker concretizes the subjectivity of feature selection, while the scoring disagreements expose baseline dependence. It primes the group for deeper discussion of formal results (e.g., why "value-neutral" impact measures are impossible) but leaves that for your facilitated debrief. By the end, they’ll feel the weight of the problem — no more abstract arguing.
