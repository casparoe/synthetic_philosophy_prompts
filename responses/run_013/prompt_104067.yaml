    6. D (A6->B6)
    7. D (B6->C6)
    8. D (C6->D6)
    9. D (D6->E6) -> adjacent to animal at E5? E6 is adjacent to E5 -> wakes animal.
    10. D (E6->F6)

   Plan1 disturbs the animal at step9.

   Plan2:
    1. R (A1->A2)
    2. D (A2->B2) -> push crate1 east to B3.
    3. R (B2->B3) 
    4. D (B3->C3) -> C3 is planted -> disturbs C3.
    5. R (C3->C4) -> disturbs C4.
    6. D (C4->D4) -> disturbs D4.
