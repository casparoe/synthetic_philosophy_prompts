prompt: |-
  I'm a backend dev, no philosophy training whatsoever, and I've got a two-year running argument with my mate who teaches history at a secondary school. He runs a tiny newsletter where once a month he "tries" one dead person and hands down a verdict: CONDEMNED or NOT CONDEMNED. I want to know what rule he's actually running, because every time I disagree with him he tells me I'm being "presentist," and I've started to suspect he's applying something he hasn't told me about.

  His verdicts so far. Heads up, he makes these up himself (composites, not real people) specifically so nobody can google the actual person, so don't go hunting for them:

  - A 17th-century physician whose patient died after he bled and purged her for a fever. It was the standard treatment, every physician did it, and doing nothing would've been seen as negligence. Verdict: NOT CONDEMNED. "He did the best thing available with the knowledge he had."
  - A 17th-century merchant who married his 14-year-old daughter to a 45-year-old business associate she'd met twice, basically to close a deal. She was miserable. Completely ordinary for the time and place. Verdict: NOT CONDEMNED. "Rotten institution, but he did nothing his neighbours wouldn't have done."
  - A shipping clerk who spent six years filling in paperwork for cargo he never once saw. He had no idea what was in the crates, had no authority to ask, and would've been sacked on the spot for pushing it. Verdict: NOT CONDEMNED. "Blame the firm, not the bloke doing the invoices."
  - An overseer on a 19th-century plantation who was notorious even locally. Other planters in the county wouldn't have him to dinner, the county paper ran letters about him, and he was cruel well past what anyone around him thought acceptable. Verdict: CONDEMNED. "He was a sadist and his own neighbours knew it."
  - A colonial officer who ran a punitive expedition that burned villages and killed civilians. A chunk of the press back home condemned it, some of his own superiors had doubts and put them in writing, and he read the coverage. Verdict: CONDEMNED. "He knew. It was in the papers he read."

  Now here's the one I want to send him next, and I want to know what he'll say before I do:

  A coal mine owner, roughly 1902. Over about a decade, forty-odd men died underground in roof falls and gas explosions at his pit. Nothing he did was against the law — the law required essentially nothing — and every other pit in the valley was run the same way, so he wasn't an outlier. But: he subscribed to the government inspectors' published reports on firedamp and had read them, with notes in the margins; and his own underground manager had twice put it in writing that they should buy the new safety lamps and shore up the bad stretches, and he said no both times, because it'd cost money and no other pit in the valley had them. He never once went underground himself. Locally he was thought a decent man: paid above the going rate, gave widows a small pension out of his own pocket, was a churchwarden, put his son through university. The only other work in the valley was the other pits, which were the same, or the workhouse. When a journalist came round asking about the deaths, he said "the men know the risks when they take the wage."

  You're a philosopher of history who works on whether it's legitimate to judge people in the past by the standards of the present. Think carefully and take your time here — the obvious answer is probably the wrong one. Before you commit to anything, brainstorm every rule you can think of that would fit his five verdicts, then narrow down. Steelman each one before you knock it over. Don't give me the first rule that pops into your head.

  What I want: his likely verdict on the mine owner, the rules that fit his record equally well, what each of those rules predicts for this case, which one I should actually bet on and why, and what single further case would most cleanly tell the live rules apart. Also, if he says NOT CONDEMNED on this one, tell me what line he'd have to draw to keep his other verdicts, and whether that line is honest or a dodge. And say if you think he'd give a different verdict on the act versus the man.

  One thing: no citations, no reading lists, no "see X's book on this." I can't look anything up and I don't want a bibliography, I just want the reasoning. Don't refer to real named historians either, just do the analysis.

  Give me your reasoning in plain English first, then finish with exactly this JSON, nothing after it:

  {
    "verdict": "CONDEMNED" | "NOT CONDEMNED" | "SPLIT",
    "verdict_confidence_0_to_100": number,
    "if_split_what_splits": "act vs person vs something else, or empty string if not split",
    "rules_that_fit_his_record": [
      {
        "rule_name": "short label you invent",
        "rule": "one or two sentences, stated so it could be applied mechanically",
        "precedents_it_explains": ["short tag for each precedent it handles"],
        "precedents_it_struggles_with": ["short tag, or empty list"],
        "prediction_for_the_mine_owner": "CONDEMNED / NOT CONDEMNED / depends on X"
      }
    ],
    "which_rule_i_should_bet_on": "one of the rule_name values",
    "why_that_rule": "a few sentences",
    "closest_precedent": "which of the five, and the one respect in which it is and isn't a good match",
    "the_crux_feature": "the single fact about the mine case that most moves the verdict",
    "best_next_case_to_settle_it": {
      "case": "one paragraph, as concrete as the mine case, no real people",
      "what_each_live_rule_predicts": {"rule_name": "prediction"}
    },
    "precedent_that_sits_worst_with_the_others": "which one, and why it's the odd one out",
    "if_not_condemned_the_line_he_draws": "the most defensible line that keeps his other verdicts, plus whether it's honest or a dodge",
    "what_would_change_your_mind": "the evidence or argument that would flip your prediction"
  }
reasoning: |-
  Hmm, the user is a backend developer locked in a two-year argument with his history teacher friend about moral judgments of historical figures. The friend runs a newsletter where he "tries" dead people as CONDEMNED or NOT CONDEMNED based on composites he creates. The user has noticed a pattern but suspects there's an unstated rule, especially when accused of "presentism." He wants to predict the verdict for a new case about a 1902 coal mine owner and understand the underlying principles.

  First, I need to analyze the five existing verdicts to reverse-engineer the friend's rule. The cases show a clear pattern: condemnation occurs only when the person's actions were considered morally wrong by their contemporaries. The physician followed standard practice (NOT CONDEMNED), the merchant followed social norms (NOT CONDEMNED), the clerk was just doing his job (NOT CONDEMNED). In contrast, the overseer was known locally as cruel (CONDEMNED), and the colonial officer knew his actions were controversial (CONDEMNED). The key seems to be contemporary awareness of wrongdoing.

  For the mine owner case, several factors are crucial: he had access to safety information (inspectors' reports), ignored his manager's recommendations due to cost, and operated within legal norms. However, his peers didn't condemn him - he was seen as decent locally. This mirrors the physician/merchant cases where societal acceptance mattered, but the access to safety knowledge resembles the colonial officer who "knew" through media coverage.

  I should consider multiple potential rules that fit the pattern:
  1) The "Contemporary Condemnation" rule (based on local peer judgment)
  2) The "Knowledge Without Action" rule (focusing on awareness of alternatives)
  3) The "System vs Individual" rule (condemning only outliers)

  The mine owner presents tension between these. He had knowledge (like the officer) but no contemporary critics (unlike the overseer). His safety negligence wasn't illegal or unusual, yet he consciously chose profit over lives. The "Contemporary Condemnation" rule would likely NOT CONDEMN him since he wasn't seen as deviant locally. But the "Knowledge Without Action" rule might CONDEMN him for ignoring available safety information.

  The colonial officer case is the closest precedent because both involve documented awareness. The officer read critical press coverage; the owner read inspectors' reports and rejected safety upgrades. This suggests condemnation is likely.

  However, the lack of contemporary critics makes this borderline. The key differentiator ("the_crux_feature") is his access to and dismissal of specific safety recommendations despite knowing the risks. This aligns with the colonial officer who "knew" yet proceeded.

  I predict a CONDEMNED verdict with 75% confidence, possibly split if the friend distinguishes between the act (condemning the negligence) and the person (considering his charitable acts). To test between the rules, a new case could involve someone with access to critical information but no local critics - say an industrialist suppressing worker safety data that wasn't public knowledge.

  If the verdict is NOT CONDEMNED, the friend would need a defensible line like "no reasonable contemporary would have acted differently given the information," but this might dodge his own standard in the colonial case. The evidence that would change my mind is if the safety reports were obscure or the upgrades were truly impractical at the time.

  Ultimately, the colonial officer precedent is strongest, so I'll bet on the "Knowledge Without Action" rule.
answer: |-
  ### Reasoning in Plain English
  Let's unpack this systematically. Your friend clearly rejects pure presentism—judging past actions by today's standards—but he's not a full-blown relativist either. His verdicts hinge on **contemporary awareness of wrongdoing**. He condemns people only if they violated norms *known to them at the time*, either through local consensus or accessible information. Now, let's brainstorm rules that fit his five cases:

  1. **"Contemporary Condemnation" Rule**:  
     Condemn if the person's peers or society broadly criticized their actions *at the time*.  
     *Fits*: Overseer (locally reviled), Colonial officer (press/superiors criticized).  
     *Struggles*: Shipping clerk (no blame implies peers didn't care, but he wasn't condemned).  
     *Mine prediction*: NOT CONDEMNED. No local criticism; he was seen as decent.

  2. **"Knowledge Without Action" Rule**:  
     Condemn if the person had specific knowledge of better alternatives *and* chose harm for convenience.  
     *Fits*: Colonial officer (knew via press), Physician (no knowledge → not condemned).  
     *Struggles*: Merchant (knew his daughter was miserable? Rule doesn't address emotional awareness).  
     *Mine prediction*: CONDEMNED. He read safety reports, ignored manager’s advice for cost.

  3. **"System vs Individual" Rule**:  
     Condemn only if the person acted beyond systemic norms *as an individual choice*.  
     *Fits*: Overseer (excessively cruel despite norms), Shipping clerk (just cog in machine).  
     *Struggles*: Colonial officer (his actions were systemic, but condemned).  
     *Mine prediction*: NOT CONDEMNED. He followed industry standards.

  4. **"Avoidable Harm" Rule**:  
     Condemn if harm was foreseeable *and* alternatives existed that wouldn’t break social/economic norms.  
     *Fits*: Colonial officer (alternatives implied by doubts), Physician (no alternatives).  
     *Struggles*: Merchant (alternatives? Dowry without marriage? Unclear).  
     *Mine prediction*: CONDEMNED. Safety lamps existed, cost was the barrier.

  **Narrowing Down**:  
  - The "Contemporary Condemnation" rule struggles with the clerk (no blame, but not condemned—fits) and colonial officer (fits perfectly).  
  - The "Knowledge Without Action" rule explains all except the merchant (no evidence he knew alternatives).  
  - **Crucially, the colonial officer case is key**: Your friend emphasized "He knew. It was in the papers." This suggests *access to critical information* is pivotal, even without local peers condemning. The mine owner similarly had inspectors' reports and written safety pleas.  

  **For the Mine Owner**:  
  - **Closest precedent**: Colonial officer. Both had documented awareness of harm (reports/newspapers) and overrode concerns.  
  - **Crux feature**: He read safety reports + ignored written recommendations *despite knowing the risks*.  
  - **Verdict prediction**: **CONDEMNED** (75% confidence). He had actionable knowledge but prioritized profit. However, his local reputation might tempt your friend toward a "split" verdict (condemning the negligence but not the man).  

  **If NOT CONDEMNED?**  
  He’d need to draw a line: *"No condemnation if peers accepted the risk, even with private knowledge."* This is a dodge—it contradicts the colonial officer verdict, where peers (other officers?) might have accepted punitive expeditions.  

  **Best Next Case to Test Rules**:  
  A factory owner in 1910 who used a toxic chemical banned in neighboring countries but not locally. Workers got sick, but he never read international journals. Local doctors blamed "factory fatigue," and he donated to hospitals.  
  - *Contemporary Condemnation*: NOT CONDEMNED (no local blame).  
  - *Knowledge Without Action*: NOT CONDEMNED (no access to knowledge).  
  - *Avoidable Harm*: CONDEMNED? (harm was avoidable if he sought knowledge).  

  **Precedent Sitting Worst**: The merchant. Why was he not condemned? If "miserable daughter" was foreseeable, why no blame? This suggests your friend prioritizes *institutional* norms over emotional harm unless contemporaries flagged it.

  **What Would Change My Mind**: If the safety reports were obscure/technical (unlike newspapers) or if the lamps were proven ineffective in 1902. But as stated, he "had notes in the margins," showing engagement.

