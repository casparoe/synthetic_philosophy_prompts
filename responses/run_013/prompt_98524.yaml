answer: |-
  Here's a breakdown of the Pluto demotion using two-dimensional semantics, addressing the core of your dispute and the framework's limitations:

  **Pre-2006 Use of "Planet": A Two-Dimensional Analysis**

  1.  **Primary Intension (Epistemic Intension):** This captures *how we identified* planets based on available evidence and descriptive criteria *before* fixing the reference in our actual world. For "planet" pre-2006, this was largely:
      *   **Orbits the Sun** (excludes moons, exoplanets).
      *   **Is roughly spherical** due to self-gravity (distinguishes planets from asteroids/comets).
      *   **Is a primary body** (not a satellite).
      *   *(Implicitly)* **Is a significant body** within the solar system (a vague, folk criterion distinguishing planets from smaller spherical bodies like Ceres, though Ceres was historically considered a planet and then demoted precisely because it *wasn't* deemed significant enough).

      The primary intension is a function from hypothetical scenarios (conceivable ways our solar system could have been arranged) to the objects satisfying *these criteria* in that scenario. If, in some scenario, we discovered a spherical body orbiting the Sun that wasn't a moon, we would (pre-2006) have called it a planet *based on this descriptive profile*, regardless of its size relative to neighbors or orbital dynamics.

  2.  **Secondary Intension (Subjunctive Intension):** This captures what the term *actually refers to* in our world, once reference is fixed by the primary intension in the actual world. It's a function from counterfactual worlds (worlds where history, physics, etc., might differ, but the *actual-world reference* is held fixed) to the objects that are the *same kind* as the actual referents.
      *   In the actual world pre-2006, "planet" referred to: Mercury, Venus, Earth, Mars, Jupiter, Saturn, Uranus, Neptune, Pluto.
      *   Therefore, the secondary intension picks out *those specific nine bodies* (or counterparts of them) in counterfactual worlds. Even in a world where, say, Pluto *did* clear its orbit (making it satisfy the *new* IAU criterion), the pre-2006 secondary intension *still* picks out Pluto as a planet because it picks out the *actual* referents fixed in *our* history. Conversely, in a world where Earth shared its orbit with many Earth-sized bodies and hadn't cleared its neighborhood, the pre-2006 secondary intension would *still* pick out Earth as a planet because Earth is one of the actual referents.

  **Natural Kind Term or Descriptive/Functional Term?**

  "Planet" pre-2006 **does not fit the profile of a natural-kind term like "water" or "gold"**:

  *   **Lack of Hidden Essence:** There was no widely accepted, scientifically discovered *intrinsic physical property* defining "planet" in the way molecular structure (H₂O) defines water or atomic number (79) defines gold. The criteria were observational, functional, and historical-conventional: location (orbits Sun), shape (spherical), role (primary body), and historical inclusion (Pluto was grandfathered in despite its small size and eccentric orbit).
  *   **Descriptive/Functional Basis:** Reference was fixed primarily by the descriptive criteria listed in the primary intension. There was no underlying "planethood essence" waiting to be discovered; the concept was defined by how we used it to categorize solar system bodies based on accessible properties.

  The pre-2006 meaning was **exhausted by the descriptive criteria we applied**, making it closer to a functional or conventional term than a natural-kind term.

  **Adjudicating the Dispute: Discovery vs. Redefinition**

  *   **Your Friend's View (Discovery):** This assumes "planet" *is* a natural-kind term with a hidden essence ("having cleared its orbit") that the IAU discovered. This would be analogous to discovering jadeite and nephrite have different mineral structures, revealing "jade" wasn't a single natural kind.
  *   **Your View (Redefinition):** This recognizes that "planet" was defined by descriptive/functional criteria. The IAU *changed* those criteria by adding a new, stricter requirement ("clearing the neighborhood") based on evolving scientific understanding of solar system dynamics and the desire for a more precise classification (prompted by discovering many Pluto-like objects). This is analogous to a committee stipulating a new sense for an old word to serve a specific purpose (e.g., refining "fish" in biology to exclude whales, even though whales are "fish" in a broader folk sense).

  **Based on the two-dimensional analysis:**
  Your view is more accurate. The IAU's move is **closer to a committee stipulating a new sense for an old word** rather than discovering a hidden essence. They refined the *descriptive criteria* (primary intension) to address new scientific contexts and practical needs (managing the classification of Kuiper Belt Objects). Pluto *still satisfies the pre-2006 primary and secondary intensions*. It just no longer satisfies the *new, stipulated* criteria. This is fundamentally different from discovering that jadeite and nephrite, objects *already referred to* as "jade," possess distinct hidden essences.

  **Where Two-Dimensional Semantics Falls Silent: The Limits of Formalism**

  1.  **Presupposing the Nature of the Term:** Two-dimensional semantics is a powerful formal tool for *modeling* meaning, but **it cannot by itself determine whether "planet" is a natural-kind term or a descriptive/functional term.** This is the crucial philosophical question underlying your dispute. The framework *requires you to input* an answer to this question:
      *   *If* you assume "planet" is a natural-kind term, the framework will model it that way (primary intension finds the essence, secondary intension rigidly designates that kind).
      *   *If* you assume "planet" is a descriptive/functional term, the framework will model it *that* way (primary intension uses descriptions, secondary intension rigidly designates whatever satisfied those descriptions in the actual world).
      The framework formalizes whichever perspective you start with; it doesn't adjudicate between them from first principles.
  2.  **Determining "Correctness":** It cannot definitively say which reading (natural-kind vs. descriptive) of "planet" is "correct." This depends on broader philosophical arguments about language, reference, and scientific kinds:
      *   Arguments for descriptive: Historical usage, lack of pre-existing scientific essence, purpose-driven classification.
      *   Arguments for natural-kind (or becoming one): Goal of science to discover natural categories, potential for orbital dynamics to be considered an "essence" *going forward*.
  3.  **Authority and Linguistic Community:** It doesn't address *who has the authority* to change definitions or how linguistic communities adopt new meanings. The IAU acted as a scientific authority proposing a new *technical definition*. Whether this constitutes a "discovery" or a "redefinition" hinges on point (1), which the framework presupposes.

  **Conclusion:** Two-dimensional semantics clearly shows that the pre-2006 usage of "planet" was descriptive/functional. It formalizes why the IAU's action looks like a stipulation of new criteria (a change to the primary intension) rather than a discovery of a hidden essence. However, the framework itself cannot *prove* that "planet" wasn't a natural-kind term all along waiting for its essence to be found; it merely provides a much more coherent and historically accurate model if we treat it as descriptive. Your friend's "discovery" claim relies on a specific (and arguably incorrect) philosophical assumption about the nature of the term that the framework can model but not validate. The dispute ultimately rests on a prior philosophical commitment about scientific language that two-dimensional semantics reflects but does not resolve.
