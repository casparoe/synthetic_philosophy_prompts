answer: |-
  (1) LTCM's models offered average-case Value-at-Risk (VaR) guarantees, quantifying over environments where asset correlations and volatility remained within historical norms and market dislocations were temporary mean-reverting events.  
  (2) The Russian default and correlated global flight-to-liquidity constituted a distributional shift: it broke historical correlations permanently ("regime change"), invalidating the model's core assumption, thus moving outside the class of environments the guarantee quantified over; this distinction means the models promised nothing about such events.  
  (3) A genuine worst-case guarantee over *all* possible market environments would have required near-zero leverage or infinite capital reserves, rendering the strategy unprofitable or impossible – mirroring how unbounded worst-case alignment guarantees are vacuous (demanding robustness against literally any agent), while meaningful bounded robustness (e.g., against adversaries with limited compute/resources) is feasible.  
  (4) The episode implies average-case alignment guarantees fail under distributional shifts (like novel AI capabilities or deployment contexts), and while the finance analogy is apt for modeling robustness limits, it breaks down as finance provides dense, immediate feedback (prices/P&L) that alignment research lacks, masking failures until catastrophic.  
  (5) It favors worst-case reasoning by exposing average-case fragility, yet reveals the dichotomy's limit: neither pure average-case (blind to shifts) nor unbounded worst-case (impractical) suffices; the key is identifying *plausible bounds* on adversaries or distribution shifts for robust guarantees, a necessity for both finance and alignment.
