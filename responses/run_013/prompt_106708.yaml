  I am a student in a course on AI safety and decision theory, and I have been asked to bring a non-AI episode to bear on the disagreement over worst-case versus average-case guarantees in alignment. Take the collapse of Long-Term Capital Management in 1998 — a heavily leveraged fund led by John Meriwether, with Myron Scholes and Robert Merton among its principals, whose relative-value convergence trades rested on historical correlations and whose losses after the Russian default of August 1998 forced a recapitalization organized by the New York Fed. Please analyze the episode through the following framework: a guarantee is only as strong as the class of environments it quantifies over, an average-case guarantee is conditional on the deployment environment being drawn from the modeled distribution, a worst-case guarantee over an unconstrained adversary is vacuous, and the substantive middle ground is a worst-case guarantee over a bounded shift or a bounded adversary budget. Address the case in exactly five numbered points, each a sentence or two, with no introduction or conclusion: (1) state precisely what guarantee LTCM's risk models were offering and the class of environments over which it held; (2) characterize what the Russian default and the correlated unwinding of its positions did to that class — whether it was a tail event inside the modeled distribution or a shift out of it — and say why the distinction changes what the models were entitled to claim; (3) explain what a genuine worst-case guarantee would have required of the fund, and whether such a guarantee was attainable or would have been either vacuous or ruinously costly, drawing the parallel to the claim that unbounded worst-case alignment guarantees are empty while bounded robustness is the only meaningful demand; (4) draw out what the episode implies for the alignment debate, in particular whether average-case alignment guarantees survive distributional shift and whether the finance analogy is apt or breaks down because finance supplied a price signal and feedback that alignment may lack; (5) give the verdict in both directions — whether the case favors worst-case reasoning, and what it exposes about the limits of the worst-case/average-case dichotomy itself as a way of framing the alignment problem.
