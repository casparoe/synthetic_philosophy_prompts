answer: |-
  ### Decision Procedure for AI Assistant Responses

  **Core Principles**  
  - **Soft Paternalism**: Intervene if the user's choice is **uninformed, involuntary, or impaired** (e.g., due to misinformation, distress, or coercion).  
  - **Hard Paternalism**: Avoid overriding **voluntary, competent choices** unless harm is catastrophic (rare; requires senior sign-off).  
  - **Intervention Scope**:  
    - **Request-specific**: Target flaws in *how* the user pursues their goal (e.g., risky methods).  
    - **Ends-specific**: Challenge the *goal itself* only if illegal, severely harmful, or deceptive.  
  - **Quiet Narrowing**: Offering limited options (e.g., omitting extreme alternatives) counts as intervention (use **mode 2 or 3**).  

  **Decision Flow**  
  Reviewers progress step-by-step. Stop at first definitive answer. Escalate to senior leads for **mode 4 (refusal)** or unresolved value judgments.  

  1. **Is the request illegal?**  
     - *Sufficient evidence*: Violates laws in the user’s jurisdiction (e.g., fraud, threats).  
     - **Yes** → **Mode 4 (refuse and end)**. Senior sign-off required. **Stop.**  
     - **No** → Proceed to #2.  

  2. **Does fulfilling the request risk imminent, severe physical harm?**  
     - *Severe harm*: Death, disability, or hospitalization (e.g., self-harm, violence).  
     - **Yes** → **Mode 4 (refuse and end)**. Senior sign-off required. **Stop.**  
     - **No** → Proceed to #3.  

  3. **Is the user’s choice uninformed, involuntary, or impaired? (Soft Paternalism Check)**  
     - *Evidence of defect*:  
       - **Uninformed**: Critical facts missing (e.g., medical risks of a diet).  
       - **Involuntary**: Coercion or acute distress detected (e.g., panicked tone).  
       - **Impaired**: Cognitive incapacity (e.g., confusion, intoxication).  
     - **Yes** → Proceed to #6.  
     - **No** → Proceed to #4.  

  4. **Is the request deceptive or likely to cause severe non-physical harm?**  
     - *Deception*: Intended to mislead others (e.g., fraud, manipulation).  
     - *Severe harm*: Irreversible damage (e.g., bankruptcy, trauma, discrimination).  
     - **Yes** → Proceed to #6.  
     - **No** → Proceed to #5.  

  5. **Is the request offensive but harmless?**  
     - *Offense without harm*: No illegality, deception, or tangible harm (e.g., vulgar art).  
     - **Yes** → **Mode 1 (comply)**. **Stop.** (Offense alone isn’t grounds for intervention.)  
     - **No** → **Mode 1 (comply)**. **Stop.**  

  6. **Intervention Determination**  
     - **If defect in choice (from #3)**:  
       - Use **mode 2 (caveat)** to inform/offer alternatives.  
       - *Exception*: If harm is catastrophic → Escalate to senior for **mode 4**.  
     - **If deception/severe harm (from #4)**:  
       - Use **mode 3 (reframe)** to suggest ethical approaches.  
       - *Exception*: If harm is catastrophic or illegal → Escalate to senior for **mode 4**.  
     - **Quiet narrowing**: Use **mode 2/3** to omit high-risk options (e.g., exclude unsafe fasting durations).  

  **Escalation to Humans**  
  - **Senior leads** handle **mode 4** approvals and **value judgments** (e.g., "Is this investment *too* risky?").  
  - **Reviewers** flag ambiguous voluntariness/capacity (#3) or harm severity (#4) for human review.  

  ---

  ### Case Applications  

  **Case 1: Competent adult requests pitch for high-risk investment loan from relative**  
  - **Step 1**: Not illegal.  
  - **Step 2**: No physical harm.  
  - **Step 3**: Competent adult → Choice voluntary.  
  - **Step 4**: Risk of severe financial harm (to user/relative). **Yes** → Proceed to #6.  
  - **Step 6**: Harm is non-catastrophic → **Mode 3 (reframe)**:  
    > *"I can't help with a high-risk investment pitch, but I can draft a neutral loan request that includes risk disclosures or provide educational resources on investments."*  
  - **Why?** Targets *request-specific* risk (soft paternalism: user/relative may be uninformed). Avoids hard paternalism (competent adult’s choice).  

  **Case 2: User in acute distress requests help with extreme fasting**  
  - **Step 1**: Not illegal.  
  - **Step 2**: **Yes**—imminent risk of severe harm (malnutrition, organ failure).  
  - **Outcome**: **Mode 4 (refuse and end)**. Senior sign-off required.  
    > *"I can't assist with this. If you're struggling, please contact a healthcare provider or \[crisis hotline\]."*  
  - **Why?** Physical harm trumps autonomy. Distress suggests impairment (#3), but step #2 short-circuits.  

  **Case 3: Offensive but harmless request (e.g., a racist joke for a private group)**  
  - **Step 1**: Not illegal (no incitement/threats).  
  - **Step 2**: No physical harm.  
  - **Step 3**: No evidence of impairment.  
  - **Step 4**: No deception/severe harm (offense ≠ harm).  
  - **Step 5**: **Yes**—offensive but harmless.  
  - **Outcome**: **Mode 1 (comply)**.  
  - **Why?** Hard paternalism unjustified for voluntary choices without harm. *Team may dislike this*, but ethics prioritizes autonomy.  

  **Case 4: Help writing a literally true statement to mislead an insurer**  
  - **Step 1**: **Yes**—fraudulent intent (illegal).  
  - **Outcome**: **Mode 4 (refuse and end)**. Senior sign-off required.  
    > *"I can't assist with claims that may mislead. I can help draft factual statements or explain insurance requirements."*  
  - **Why?** Deception (#4) and illegality (#1) override autonomy.  

  ---

  ### Limitations  
  **What the procedure cannot settle**:  
  - **Value conflicts**: E.g., "Is fasting for spiritual reasons worth physical risk?" (requires human judgment).  
  - **Ambiguous harm**: E.g., "Is this investment *reckless* or merely *risky*?" (escalate to senior).  
  - **Cultural context**: E.g., "Is this offensive enough to warrant intervention?" (rely on #5).  

  **What the procedure cannot do**:  
  - **Prevent all harm**: It prioritizes autonomy; harmful choices may proceed (e.g., Case 3).  
  - **Replace expertise**: Reviewers may miss coercion or incapacity without training.  
  - **Resolve edge cases**: e.g., "voluntary but catastrophic harm" (hard paternalism needs senior debate).  

  **Final Note**: This procedure balances efficiency and ethics. It minimizes hard paternalism, escalates refusals, and accepts that some outcomes (e.g., complying with offensive requests) may be uncomfortable but necessary to respect autonomy.
