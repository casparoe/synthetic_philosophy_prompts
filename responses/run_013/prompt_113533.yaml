answer: |-
  It sounds like you've hit on a classic case of the dollar auction paradox, where bidders get trapped in escalating bids due to the "losing bidder pays" rule. Your analysis is sharp, and you're right to be suspicious—it's not rubbish, but there's a subtle flaw in one step that causes the contradiction. I'll break this down step by step, addressing your lines (1) through (7), and then explain which line to ditch, why it looked reasonable, and what you gain by keeping (1). I'll also be upfront about my confidence levels.

  ### Quick Recap of Your Argument
  - (1) Sunk cost fallacy: Only future costs/benefits matter; ignore past investments.
  - (2) At £33 (second highest), bidding £35 could mean a £15 loss if you win, vs. a £33 loss if you stop.
  - (3) Therefore, bidding beats stopping.
  - (4) This logic holds at any bid level (e.g., £50, £500).
  - (5) Rational bidders never stop → auction runs forever.
  - (6) But real auctions end quickly (e.g., your brother-in-law stopped at £34).
  - (7) Contradiction: The argument says something impossible happens, but it does.

  The core issue isn't with sunk costs (you should absolutely keep (1)). Instead, the problem is in **step (2)**, specifically how it frames the decision. I'll explain why, then address the other steps.

  ### Which Line to Ditch and Why
  **Ditch line (2)**. It looks reasonable at first glance because it presents a plausible best-case scenario (the other bidder folds), but it ignores the full range of outcomes, especially the risk of escalation. Here's why:

  - **Why (2) is flawed**:  
    - In (2), you say: "If I go to £35 and the other fella stops, I pay £35 and get the twenty, so I'm £15 down instead of £33 down." This assumes that bidding £35 leads to an immediate win. But it doesn't consider that the other bidder might *not* stop—they could bid again (e.g., £36), leaving you as the second-highest bidder at £35. If that happens, you're now facing a £35 loss (worse than the £33 loss you started with), and you're deeper in the hole.
    - Your brother-in-law's reasoning ("either the other bloke folded or he went again") acknowledges this, but (2) only focuses on the "folds" outcome. This is incomplete because, at high bids like £33/£34, the other bidder is likely to continue (they're in the same "sunk cost" mindset, and folding means a guaranteed loss for them). By omitting the "continues" case, (2) overstates the benefit of bidding and understates the risk.
    - **Why it looked reasonable**:  
      - At low bids (e.g., £5 vs. £4), the "folds" scenario is plausible—bidders might quit early to avoid bigger losses. But at high bids (£33+), it's irrational to assume folding, as the other bidder faces the same pressure to continue. Your argument generalizes from low-bid intuition to high bids, but the dynamics change. It also feels intuitive because bidding *does* reduce your loss if you win immediately, and in the heat of the moment, bidders often overestimate the chance of that happening (due to hope or desperation).

  - **What ditching (2) costs you**:  
    - You lose the simplicity of a one-step decision. Instead, you must account for escalation risk (the chance the other bidder continues) and future costs. This makes the decision messier but more realistic. For example:
      - At £33 (second), bidding £35 has an expected outcome based on:
        - Probability other folds: You lose £15 instead of £33 (gain of £18).
        - Probability other continues: You become second at £35, facing a bigger loss.
      - If the probability of continuing is high (as it is at £33+), the expected value of bidding turns negative, making stopping rational. But this depends on your estimate of the other bidder's behavior.

  **Why keep (1)?** Sunk cost fallacy is solid economics—it's why you shouldn't let past bids sway you. Ditching (2) doesn't hurt (1); it actually reinforces it by forcing a focus on *future* risks and rewards. For instance:
  - The £33 commitment isn't "sunk" yet (it's only paid if you lose), but it *shouldn't* influence your decision. Instead, from your current position, only the future matters: "If I bid, what might happen next, and what will it cost me?"
