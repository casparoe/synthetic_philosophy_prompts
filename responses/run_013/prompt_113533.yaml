    - Bidders aren't perfectly rational (e.g., emotions, fatigue, or your brother-in-law's accountant-like focus on incremental losses).
    - Resources are finite—no one has infinite money.
    - In game theory, this is a "war of attrition" with mixed strategies; bidders randomize drop-out points to avoid predictable escalation.

