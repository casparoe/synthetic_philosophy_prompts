  ### What Happens to the Other Lines?
  - (3) "So going to £35 beats stopping": **Falls apart** because it depends on (2). It only "beats" stopping if the other folds; otherwise, it might be worse.
  - (4) "Nothing special about £35—holds at any number": **Also fails** due to escalation risk. At low bids (e.g., £21 vs. £20), bidding might have a positive expected value if the prize is £20. But at high bids (£500+), the £20 prize is negligible, and escalating risks massive losses. Rational bidders stop early to avoid this (more below).
