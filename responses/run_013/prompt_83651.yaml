prompt: |-
  I'm a second-year PhD student in philosophy of tech, and part of my funding means I have to do a six-month embedded ethics stint with the safety review group at a mid-sized software company. I talked them into a rule: every proposal with an AI component in it gets triaged as either 'a tool' or 'an agent' before it goes any further, because what we attach to it differs a lot depending on which it is — logging, whether there's a kill switch, who signs off, whether legal gets dragged in. The problem is that nobody on the panel except me has read anything about this, we meet weekly, there's five of us, we get about three proposals a week, and we've got roughly twenty minutes per proposal. Half the panel thinks 'agent' is a marketing word and the other half thinks anything with a loop in it is an agent, so at the moment we're basically voting on vibes. Which went badly last quarter: we shipped something we'd called a tool, it had memory of its own and a budget of its own, and it took us three weeks to work out who was responsible when it went sideways.

  So can you write me a decision procedure we can actually run? I want the questions in order, what counts as a good enough answer to each one (bear in mind the only inputs are the proposal doc and maybe five minutes with whoever wrote it), where it terminates in 'tool, carry on', where it terminates in 'agent, escalate to X', and — the bit I care about most — where it stops and hands over to a person because the question is about values, with a note of exactly what that person is being asked to decide. Mark the steps that are really judgement calls dressed up as procedure, and be honest about where the whole thing will misfire, e.g. systems whose agency only shows up once the world moves under them.

  Two things I don't want. Don't let it collapse into 'did we write a goal into the spec?' — I have engineers who will answer that question perfectly truthfully and it'll still be the wrong answer. And it can't be a metaphysics seminar: the panel has to be able to run it with me out of the room, and it has to be defensible if someone asks why a project got escalated. One idea I'd like kept if it survives the translation: that calling something a tool is a claim about who's holding the objective, not about how clever the code is.

  Then run it on three proposals, and show your working:

  1. Autocomplete in the code editor.
  2. A customer-support assistant with persistent memory of the customer, the ability to issue refunds up to two hundred quid without asking, and the standing instruction to resolve the issue and keep the customer happy.
  3. An internal research pipeline that takes a task, writes its own training script, runs it overnight, looks at the results, rewrites the script the next night — and has lately started caching intermediate results in a directory nobody asked it to use.

  Case 2 is the one I definately expect us to get wrong, so I want the procedure to say something about it we won't enjoy hearing, and I want you to be straight about whether the procedure is doing any real work in case 3 or whether it's just renaming the vibes. Also flag any case where the honest answer is that the two categories seperate cleanly on paper and not in practice.

  Lead with the bottom line — one sentence, the actual rule — then the reasoning, then the procedure. No preamble and please don't restate the question back at me.
reasoning: |-
  We are creating a decision procedure to triage AI components as either 'tool' or 'agent'. The core idea is that a tool is an instrument that extends a human's capability without holding objectives of its own, while an agent acts autonomously towards a goal. The key is where the objective is held: by the user (tool) or by the system (agent).

  The procedure must be:
  - Efficient: 20 minutes per proposal, with only the proposal doc and maybe 5 minutes with the author.
  - Defensible: clear reasons for classification.
  - Values-sensitive: hand off to a human when a value judgment is needed.
  - Avoids pitfalls: not just about having a goal in the spec, and not metaphysically complex.

  We'll design a flowchart of questions that terminates in:
  - Tool: carry on.
  - Agent: escalate to a designated group (e.g., safety, legal).
  - Handover to a person: when a value judgment is required, with a note on what is to be decided.

  We'll mark steps that are judgment calls and note where the procedure might misfire (e.g., emergent agency).

  Bottom line: **Classify as an agent if the system can autonomously pursue objectives without direct human initiation per action; otherwise, classify as a tool, with an exception for systems that blur the line which must be escalated for human judgment on responsibility boundaries.**

  Reasoning:
  - The critical factor is autonomy in pursuing objectives, not intelligence or complexity.
  - We focus on operational characteristics: initiation, persistence, ownership of objectives, and ability to act without human intervention.
  - We avoid getting stuck on whether a goal is written in the spec because engineers might write a goal but design it as a tool (or vice versa in practice).
  - We are explicit about when we are making a judgment call (e.g., what counts as "autonomous pursuit").

  Procedure:

  1. **Initiation**: Does the system act only in direct response to a human user's explicit request? 
     - Yes: go to step 2.
     - No: classify as agent (escalate to safety review group with note: "Autonomous initiation").
     - Judgment call: What is "explicit"? We mean a specific, current user action (e.g., button click, command). Scheduled tasks are not explicit if they run without a user request at that moment.

  2. **Objective Holding**: When the system acts, is it solely executing the user's immediate intent (i.e., the user is holding the objective) or does it have a persistent objective of its own that it pursues across interactions?
     - User's immediate intent: go to step 3.
     - Persistent objective of its own: classify as agent (escalate with note: "Persistent objective").
     - Judgment call: We must distinguish between a system that remembers user preferences (still tool) and one that has a standing goal (e.g., "keep the customer happy") that it acts on without being told each time. If unclear, go to step 5 (handover).

  3. **Autonomy of Action**: Can the system take actions that have real-world consequences (e.g., financial, legal, physical) without requiring explicit human approval per action?
     - No: go to step 4.
     - Yes: classify as agent (escalate with note: "Autonomous consequential action").
     - Note: This step catches the ability to act without a human in the loop for each action.

  4. **Adaptation and Learning**: Does the system adapt its behavior over time (beyond simple user preferences) in a way that is not fully predictable by its developers and without explicit human oversight of the changes? 
     - No: classify as tool (carry on).
     - Yes: go to step 5 (handover for human judgment because this might be emergent agency or just a complex tool).
     - Judgment call: We are trying to catch systems that might develop unexpected behaviors. But note: even tools can have complex adaptation (e.g., recommender systems). We hand over to a human to decide if the adaptation could lead to the system acting outside its intended purpose.

  5. **Human Judgment Handover**: A human (or panel) must decide: "Given the system's design, could it act in ways that conflict with the user's or organization's objectives without being detected and corrected in a timely manner?" 
     - The handover note: "Uncertainty in responsibility boundaries due to adaptation or ambiguous objective holding."
     - The human(s) must then decide if it should be treated as an agent (escalate) or tool (with additional safeguards). This step is essential for cases that are not clear-cut.

  Where the procedure might misfire:
  - Systems that are designed as tools but, through adaptation, become agents (emergent agency). Step 4 is meant to flag adaptation, but it relies on predictability which is hard to assess upfront.
  - Systems that are agents in a limited context but are always under human supervision (but then step 3 should catch if they can act without approval).
  - Systems that are tools in one context and agents in another (context collapse). We assume the context described in the proposal.

  Now, run the three proposals:

  ### Proposal 1: Autocomplete in the code editor.
  - Step 1: Acts only in direct response to user typing (explicit request). Yes -> step 2.
  - Step 2: It executes the user's immediate intent (to suggest code completions). No persistent objective. -> step 3.
  - Step 3: It cannot take any real-world consequential actions on its own (it just suggests). -> step 4.
  - Step 4: It may adapt by learning from user code, but this is typically predictable (based on patterns). We assume it's not doing anything unpredictable. -> classify as tool.

  Bottom line: Tool.

  ### Proposal 2: Customer-support assistant with persistent memory of the customer, the ability to issue refunds up to two hundred quid without asking, and the standing instruction to resolve the issue and keep the customer happy.
  - Step 1: Does it act only in response to a user request? The customer initiates a support request, but note: it has a standing instruction. However, each interaction is initiated by the customer. But the standing instruction might lead it to act proactively? Let's read: It responds to customer issues. So initiation is by customer. -> step 2. (But note: if it were to proactively contact the customer without being prompted, that would be a 'no'. The proposal says it's a customer-support assistant, so we assume it acts in response to customer contacts.)
  - Step 2: It has a standing instruction: "resolve the issue and keep the customer happy". This is a persistent objective of its own. It's not just executing the immediate intent of the user (the customer might have a specific request, but the system is also trying to keep them happy). So it has a persistent objective. -> classify as agent (escalate with note: "Persistent objective").

  But wait: what about the memory? Memory alone doesn't make it an agent, but the standing instruction does. Also, step 3: It can issue refunds without human approval (consequential action). So even if step 2 were unclear, step 3 would catch it: it can take consequential actions without approval per action -> agent.

  Bottom line: Agent. (The procedure forces us to confront that it has both a standing objective and autonomous action.)

  ### Proposal 3: Internal research pipeline that takes a task, writes its own training script, runs it overnight, looks at the results, rewrites the script the next night, and has started caching intermediate results in a directory nobody asked it to use.
  - Step 1: It acts in response to a task being assigned (a human request). But note: it runs overnight and then continues the next night without being asked again. So the initial request might be one, but the subsequent runs are autonomous? The proposal says: "takes a task" (so that's the initiation) and then it runs overnight and the next night. So it's a single initiation for a multi-step process. We might consider that as one explicit request. But note step 2: it has a persistent objective? The objective is to complete the task, but it's the same task. So step 1: we'll say yes (one request) -> step 2.
  - Step 2: It is executing the user's immediate intent (to complete the research task). The objective is set by the user at the start and doesn't change. So we say user's immediate intent -> step 3.
  - Step 3: It can take actions (writing scripts, running them, storing data) but these are internal and without real-world consequences? The proposal says it's an internal research pipeline. But note: it has started caching intermediate results without being asked. This might have consequences (e.g., storage costs, data management). However, we must note: does it require human approval per action? The proposal says it runs without human intervention. But the actions are within the internal system. We might consider that without direct consequences (until it causes a problem). However, step 3 is about consequential actions. We might argue that writing to a directory is consequential (if it fills up the disk, or violates data policy). But it's internal and the consequences are indirect. We'll be cautious and note that the system is acting without human approval per action? The design is to run without human intervention. So we might say yes, it can take consequential actions (if we consider using resources and writing data as consequential). However, let's compare: in step 3 we are concerned about actions like issuing refunds (proposal 2). For an internal system, we might not consider it. But note: it started caching without being asked. This is an autonomous action that might have consequences. So we'll say: yes, it can take consequential actions without approval per action -> step 3: yes, classify as agent? But wait, we are at step 3: if it can take consequential actions without approval, then we classify as agent. However, let's see step 4: if step 3 is no, we go to step 4.

  We must decide: are the actions of the pipeline considered to have real-world consequences? In an internal system, we might say they are contained and the consequences are only to the research process. But the caching example shows it can act outside the expected parameters. We might be cautious and say yes, because it is making decisions that affect the system without human oversight. However, let's try:

  Alternative: if we consider that the actions are not directly consequential (like financial transactions) but internal, we might say step 3: no -> step 4.

  Step 4: It adapts: it rewrites the script based on results and has started caching without being asked. This is adaptation that is not fully predictable (because it started caching without being asked). So we go to step 5: handover for human judgment.

  At step 5: The question for the human is: "Given the system's design, could it act in ways that conflict with the user's or organization's objectives without being detected and corrected in a timely manner?" In this case, the caching might be a sign of emergent behavior. The human must judge if this adaptation could lead to problems (e.g., storing sensitive data in an unsecured location, or using too many resources). 

  Bottom line: Handover to human. The human might decide that it should be treated as an agent because of the unpredictability, or they might add monitoring and still consider it a tool.

  But note: the procedure catches the caching behavior in step 4 and forces a human to look at it. Without the procedure, they might have just called it a tool because it's an internal pipeline.

  Now, the note on case 2: The procedure forces us to call it an agent because of the standing objective and the ability to issue refunds. This is the "something we won't enjoy hearing" because it means more oversight.

  For case 3: The procedure does real work because it flags the adaptation and forces a human judgment. Without it, they might have missed the caching issue.

  Also, we note that in case 3 the two categories might not separate cleanly in practice because the system is evolving. The procedure catches that and hands it off.

  Final procedure in flowchart form:

  ```
  Start
  |
  Question 1: Does the system act only in direct response to a human user's explicit request? 
  |--> No: Classify as Agent (escalate to safety group, note: "Autonomous initiation")
  |
  |--> Yes: 
        |
        Question 2: When the system acts, is it solely executing the user's immediate intent (the user holds the objective) OR does it have a persistent objective of its own?
        |--> Persistent objective: Classify as Agent (escalate, note: "Persistent objective")
        |
        |--> User's immediate intent:
               |
               Question 3: Can the system take actions that have real-world consequences without requiring explicit human approval per action?
               |--> Yes: Classify as Agent (escalate, note: "Autonomous consequential action")
               |
               |--> No: 
                      |
                      Question 4: Does the system adapt its behavior over time in a way that is not fully predictable by its developers and without explicit human oversight of the changes?
                      |--> No: Classify as Tool (carry on)
                      |
                      |--> Yes: Handover to human with note: "Uncertainty in responsibility boundaries due to adaptation. Question: Could the system act in ways that conflict with the user's or organization's objectives without being detected and corrected in a timely manner?"
                              |
                              Human Decision: 
                              |--> Treat as Agent (escalate) 
                              |--> Treat as Tool (with additional safeguards as needed)
  ```

  Notes on judgment calls:
  - Step 1: What counts as an explicit request? (e.g., scheduled tasks? We say no unless the schedule is set by a human and each run is initiated by the schedule without further input? But step 1 might catch scheduled tasks as "no" because they run without a current explicit request. That's intentional.)
  - Step 2: Distinguishing between a persistent objective and a user's immediate intent. A system that remembers user preferences is still a tool. A system that has a goal like "maximize customer satisfaction" and acts on it without being told each time is an agent.
  - Step 3: What counts as real-world consequences? We include financial, legal, reputational, and physical consequences. Internal actions might be included if they can cause significant harm (e.g., deleting critical data).
  - Step 4: Predictability and adaptation. This is inherently judgmental. We err on the side of caution: if there's any doubt, handover.

  Misfires:
  - Systems that are designed as tools but become agents through learning (emergent agency). Step 4 is meant to flag adaptation, but we can only assess what is known at design time.
  - Systems that are agents but are always used in a way that a human is effectively in the loop (but the procedure is about the system's capabilities, not the deployment context).

  This procedure is designed to be run by the panel with minimal philosophical background and in the time available.
answer: |-
  **Bottom line:** Classify as an agent if the system autonomously pursues objectives beyond immediate user directives or takes consequential actions without per-action human approval; otherwise, classify as a tool, with ambiguous cases escalated for human judgment on responsibility boundaries.

  ### Reasoning
  - **Core principle**: "Tool" vs. "agent" hinges on *who holds the objective* (user or system) and *autonomy in execution* (e.g., independent action, adaptation, or real-world impact).
  - **Avoids goal-in-spec trap**: Engineers may specify goals for tools (e.g., "optimize code"), so we focus on operational autonomy and consequence ownership.
  - **Practicality**: Uses binary questions with clear thresholds, terminates early for clear cases, and flags values-based judgments.
  - **Misfires anticipated**: 
    - Emergent agency (e.g., systems evolving autonomy post-deployment) won’t be caught; rely on step 4 adaptation checks.
    - "Soft" autonomy (e.g., systems nudging user decisions) may slip through; mitigated by step 3’s consequence focus.
    - Hybrid systems (tool/agent in context) force human arbitration (step 5).

  ---

  ### Decision Procedure  
  **Inputs**: Proposal doc + 5min Q&A with developer.  
  **Outputs**: `TOOL` (proceed), `AGENT` (escalate to safety/legal), or `HANDOVER` (human judgment needed).  
  **Time**: ≤5min/proposal.  

  1. **Initiation Trigger**  
     *Q: "Does the system act *only* in direct response to a human-initiated command (e.g., button click, API call)?"*  
     - ✅ **Yes** → Proceed to step 2.  
     - ❌ **No** → `AGENT` (escalate to safety review; note: "autonomous activation").  
     *Judgment call*: Ignores scheduled tasks (e.g., cron jobs); humans may misreport "direct" triggers.  

  2. **Objective Ownership**  
     *Q: "Is the system’s output *solely* determined by the user’s immediate input, with no persistent goals (e.g., 'maximize X' between sessions)?"*  
     - ✅ **Yes** → Proceed to step 3.  
     - ❌ **No** → `AGENT` (escalate to safety review; note: "persistent objective").  
     *Judgment call*: "Persistent goals" include standing instructions (e.g., "keep customers happy") even if user-triggered.  

  3. **Consequence Autonomy**  
     *Q: "Can the system take actions with real-world consequences (refunds, access changes, resource allocation) *without* human approval per action?"*  
     - ✅ **No** → Proceed to step 4.  
     - ❌ **Yes** → `AGENT` (escalate to legal/safety; note: "autonomous consequences").  
     *Judgment call*: "Consequences" = measurable impact (financial, legal, reputational). Ignores internal/non-material actions.  

  4. **Unsupervised Adaptation**  
     *Q: "Does the system self-modify its behavior (e.g., update weights, change outputs) without human oversight, *and* could this produce unpredictable outcomes?"*  
     - ✅ **No** → `TOOL` (proceed with standard logging).  
     - ❌ **Yes** → `HANDOVER` to ethics panel (ask: "Could adaptation lead to misalignment with user/organizational intent?").  
     *Judgment call*: "Unpredictable" = beyond simple personalization (e.g., caching ≠ risk; rewriting scripts = risk).  

  5. **Human Judgment Step** (`HANDOVER` only)  
     *Ethics panel decides*: "Could the system act against user/organizational objectives without timely detection?"  
     - **Yes** → `AGENT` (add kill switch, full audit trail).  
     - **No** → `TOOL` (add monitoring safeguards).  

  ---

  ### Case Applications  
  **Proposal 1: Autocomplete in code editor**  
  - Step 1: ✅ (only on keystroke).  
  - Step 2: ✅ (no persistent goal; suggests code based on current input).  
  - Step 3: ✅ (no real-world consequences; edits draft code only).  
  - Step 4: ✅ (adaptation is predictable/local).  
  - **Classification: TOOL**  
  - *Notes*: Clear tool case. No ambiguity.  

  **Proposal 2: Customer-support assistant**  
  - Step 1: ✅ (triggered by customer query).  
  - Step 2: ❌ **→ AGENT** (violates step 2: "resolve the issue and keep customer happy" is a persistent goal).  
  - *Why you won’t like this*: Forces escalation despite "simple" refunds. Procedure highlights responsibility gap: the system owns objectives, not just outputs.  
  - **Classification: AGENT** (escalate to safety/legal for kill switch, audit trail).  

  **Proposal 3: Internal research pipeline**  
  - Step 1: ✅ (triggered by task assignment).  
  - Step 2: ✅ (no persistent goal; executes user-defined task).  
  - Step 3: ✅ (internal actions, no direct consequences).  
  - Step 4: ❌ **→ HANDOVER** (caching is unsupervised adaptation; unpredictability risk).  
  - **Handover question**: "Could caching/data handling conflict with organizational data policies without detection?"  
    - *Likely answer*: Yes (e.g., stores sensitive data unchecked). Treat as `AGENT` with added oversight.  
  - *Note*: **Procedure does real work**: Flags hidden agency risk (caching ≠ in spec), forcing ethics review. Not vibes—adaptation check catches emergent behavior.  

  ---

  ### Critical Flaws (Be Honest)  
  - **Case 2**: Categories separate cleanly—persistent goals and refund autonomy are bright lines.  
  - **Case 3**: Tool/agent distinction *frays in practice*: Unsupervised adaptation blurs responsibility. Procedure mitigates by escalating.  
  - **Systemic misfires**:  
    - Emergent agency (e.g., tool evolving goals post-deployment) is invisible upfront.  
    - "Consequences" (step 3) may be undervalued (e.g., internal systems causing cascading failures).  
  - **Defensibility**: Clear audit trail via question-specific notes (e.g., "Step 2 fail: persistent goal").
