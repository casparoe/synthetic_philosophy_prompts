prompt: |-
  I'm a novelist, about a third of the way into a book set in a fictional rust-belt city, and the plot turns on infrastructure: a highway spur that cut a Black neighborhood in half, a bus route that keeps getting moved, an app that decides where the patrol cars sit. My characters keep having the same fight — is the thing itself political, or is it only the people who built it and the people who run it? I've been going back and forth on it alot, and before I write another 40k words of people shouting at each other I want the spec rather than the argument.

  So: what would a theory that artifacts have politics actually have to deliver to be any good — good enough that I can put defensible positions in my characters' mouths? Give me the requirements list: the cases it has to get right (the famous low bridges on Long Island that kept the buses out, though I gather the history there is messier than the story; a bench with armrests; a plaza built for crowd control that turns out to be the best protest site in town), the distinctions it can't collapse (design vs. use, intended vs. unintended, what an artifact does vs. what it means, and the gap between having political effects and having a politics), and the things it has to stay consistent with. Say which requirements can't all be met at once, and lead with the one that does the most work — the one that knocks out the most candidate views — then the rest, each with the case behind it. No preamble, no restating the question, and please don't send me off to read anybody; I want your list.
reasoning: |-
  Okay, the user is a novelist working on a book set in a fictional rust-belt city, where infrastructure plays a key role in the plot. The central conflict revolves around whether artifacts themselves have politics or if it's just the people who build and operate them. The user wants a list of requirements for a theory that artifacts have politics, so they can create defensible positions for their characters. They need cases the theory must handle, distinctions it shouldn't collapse, and consistency points. They also want to know which requirements conflict.

  First, I need to recall Langdon Winner's idea that artifacts have politics. The famous example is the low bridges on Long Island intentionally designed to prevent buses, thus excluding low-income and minority groups. But the user mentioned that the history is messier, so the theory must account for both intended and unintended consequences.

  The user provided examples: a highway dividing a Black neighborhood, bus routes being moved, an app for patrol car locations. These all have political implications. The characters debate whether the artifact itself is political or just its creators and operators. The theory needs to address each case.

  Key distinctions to maintain:
  - Design vs. use: A bench might have armrests designed to deter homeless people from sleeping, but later used for sitting. The design intent is political, but the use might differ.
  - Intended vs. unintended: The highway might have been intended for traffic flow but ended up segregating communities. The theory should handle both.
  - Artifact's function vs. meaning: A plaza built for crowd control (function) becomes a protest site (meaning). The artifact's inherent properties enable this.
  - Political effects vs. inherent politics: Having effects doesn't mean the artifact has politics. The theory must clarify when effects imply inherent politics.

  Requirements list:
  1. **Must distinguish between embedded politics and contingent effects.** The Long Island bridges are embedded because their design necessitates exclusion. A bench with armrests actively prevents lying down, embedding exclusion. But a plaza intended for control that becomes a protest site is contingent on use. The theory must explain why some designs embed politics while others don't. This requirement knocks out theories that don't account for necessity in design.

  2. **Must account for shifting politics without collapsing design/use distinction.** The bus route moved repeatedly shows operational decisions can change the artifact's impact. The artifact (bus route) itself might not have inherent politics, but its mutable nature allows political manipulation. The theory needs to address when an artifact's flexibility is part of its politics, like the app for patrol cars that can be reprogrammed. 

  3. **Must explain how artifacts can enforce politics independently of creator intent.** The highway example: even if planners didn't intend segregation, the structure enforces it. The theory should show that the artifact's material properties cause outcomes regardless of intent. However, it must avoid conflating effects with inherent politics. Maybe by focusing on whether the outcome is a necessary consequence of the design.

  4. **Must not reduce artifacts to mere tools of human agents.** The app directing patrol cars isn't neutral; its algorithm might have biases. But the theory must avoid saying all artifacts have politics, which could dilute the concept. Cases like a neutral bench that's later used politically shouldn't count as the artifact having politics unless the design itself necessitates it.

  5. **Must remain consistent with material constraints and affordances.** The plaza's design (flat, open space) affords both control and protests. The theory should link politics to physical properties that enable or constrain actions. But this could conflict with requirement 4 if overextended.

  Conflicts: Requirement 1 (embedded politics) might clash with requirement 2 (shifting politics). If politics are embedded in design, how can they shift? The bus route example shows operational changes affect impact. The theory needs to reconcile fixed design with mutable implementation. Also, requirement 3 (independence from intent) might conflict with distinguishing intended/unintended effects. If intent doesn't matter, how do we assess the artifact's politics? The theory might argue that necessary consequences of design constitute politics, regardless of intent.

  The user needs defensible positions for characters. One character could argue embedded design (bridges, bench armrests) makes the artifact political. Another counters that operational decisions (bus routes, app algorithms) are where politics reside. The theory must handle both to provide solid grounding for their arguments.
answer: |-
  Here's the requirements list for a defensible "artifacts have politics" theory, ordered by knockout power, with cases and tensions:

  1. **Must distinguish between *embedded* politics (necessary consequences of design) and *contingent* political effects.**  
     **Case:** Low bridges (embedded exclusion) vs. a plaza designed for crowd control that *happens* to enable protests (contingent use).  
     **Knockout:** Theories that conflate "can be used politically" with "has politics" fail. If all artifacts are political by association, the concept collapses. This requirement eliminates naive determinism.

  2. **Must account for *systemic enforcement* without requiring conscious intent.**  
     **Case:** Highway spur dividing a neighborhood. Even if planners didn't *intend* racial segregation, the infrastructure *systematically* enforces isolation, resource deprivation, and policing patterns.  
     **Knockout:** Theories demanding provable malicious intent (e.g., "the engineers were racist!") fail. Politics can be structural, not just individual.

  3. **Must explain *mutable* artifacts whose politics change via operation.**  
     **Case:** The bus route that keeps moving. The artifact (route system) isn't static; its *reprogrammability* is political. Each change serves some groups, disenfranchises others.  
     **Distinction:** Can't collapse design vs. operation. The artifact's *capacity for reconfiguration* is designed, even if specific deployments vary.

  4. **Must address *non-human agency* without anthropomorphizing.**  
     **Case:** The patrol car app. Its algorithm (e.g., "predictive policing") directs resources based on biased data/logic, acting autonomously once deployed. It *does* things humans alone couldn't.  
     **Consistency:** Can't attribute "intent" to code, but must explain how artifacts *exert force* (e.g., prioritizing certain neighborhoods for surveillance).

  5. **Must separate an artifact's *functional purpose* from its *political meaning* while showing their entanglement.**  
     **Case:** Bench armrests. Function: prevent lying down. Meaning: anti-homeless hostility. The function *enables* the meaning, but they aren't identical.  
     **Distinction:** Use (sleeping) vs. designed function (sitting only). A theory must show how function *constrains* use to produce meaning.

  6. **Must handle *counterexamples* where identical artifacts have different politics in different contexts.**  
     **Case:** A standard traffic light. In a wealthy neighborhood, it regulates flow. In an underserved one, it's intentionally short-cycled to generate fines.  
     **Tension:** Conflicts with #1. Is the politics in the light or its context? A defensible theory must allow for *configurational* politics (artifact + context).

  7. **Must avoid *technological determinism*: Artifacts don't *dictate* outcomes; they *enable, constrain, or redirect* social forces.**  
     **Case:** The crowd-control plaza used for protests. Its design *enables* assembly (wide sightlines) and *constrains* it (no cover, easy dispersal routes). Protests reshape its politics.  
     **Consistency:** Politics arises from interaction, not the object alone. A theory must preserve human agency within material constraints.

  ---

  **Key Tensions:**  
  - **#1 vs. #6:** Can an artifact have *inherent* politics if context changes its effects? (Resolution: Core design *affords* certain politics; context *activates* it.)  
  - **#3 vs. #4:** If operation changes politics (#3), is it the *artifact* or the *operator*? (Resolution: Artifacts designed for easy reconfiguration *delegate* political power to operators.)  
  - **#2 vs. #7:** Structural enforcement (#2) risks determinism; but artifacts only enable/constrain (#7). (Resolution: Artifacts *crystallize* prior politics into durable forms that *feel* immutable.)

  **Defensible Positions for Characters:**  
  - **Pro-"Artifacts Have Politics":** Focus on #1 (embedded exclusion in bridges/benches), #2 (highway's systemic harm), #4 (app's algorithmic bias). "The highway *is* racism made concrete."  
  - **Anti-**: Focus on #3 (bus route changes show humans decide), #6 (context defines the traffic light), #7 (plazas can be reclaimed). "A road is just asphalt until someone chooses where to lay it."  
  - **Middle Ground:** #5 (function enables meaning) + #7 (constraint/enablement). "The bench armrests *invite* cruelty. They don't cause it, but they sure as hell welcome it."

  This gives you dialectical fuel: characters can cite different requirements/cases to accuse each other of oversimplification (#1 vs. #6), highlight different actors (#3 vs. #4), or debate where responsibility lies (#2 vs. #7).
