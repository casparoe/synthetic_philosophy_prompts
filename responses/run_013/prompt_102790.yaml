  First, the key distinction: epistemic bubbles are about lack of exposure, fixable by introducing missing information. Echo chambers are more insidious because they discredit outside sources, making exposure ineffective or even harmful. The user wants to challenge new journalists' belief that journalism alone cures these issues. They also want to address how journalism itself can create bubbles and echo chambers, and point out the irony of a commencement speech being an echo chamber.

  The audience includes new graduates and professors who are experts in media studies. The speech needs academic accuracy while being accessible. The user mentioned a six to seven-minute runtime, so conciseness is crucial. They don't want a self-congratulatory message; instead, they want to provoke reflection on journalism's role in creating these problems.

  I need to structure the speech to first explain the two concepts clearly, then apply them to journalism. Highlighting historical and current examples where media contributed to bubbles or echo chambers is essential. Also, addressing the commencement setting as an echo chamber adds a meta-layer, which is a nice touch. 

  Potential pitfalls: Ensuring the critique is constructive, not demoralizing. Balancing criticism with hope and a call to action. Including concrete examples without making the speech too dense. Acknowledging the professors' expertise without alienating the graduates.

  I should start by defining the terms with relatable examples. Then transition into journalism's role, using specific instances where media failed. Next, challenge the assumption that journalists are immune, perhaps mentioning trust metrics or partisan coverage. The climax could be the self-awareness about the commencement being an echo chamber. End with actionable advice for the graduates to foster epistemic humility and bridge-building.

  Check for academic solidity: Cite sources like C. Thi Nguyen's work on echo chambers. Avoid oversimplification. Mention how algorithms and business models exacerbate these issues. Also, touch on the emotional components—echo chambers thrive on distrust and in-group loyalty.

  Tone is critical. It should be respectful yet provocative, using phrases like "sit with the awkwardness" to engage the audience. Avoid jargon but maintain intellectual rigor. The conclusion should empower, urging graduates to be connectors and truth-tellers who resist tribalism.

  Finally, timing. Estimate word count for 6-7 minutes: roughly 900-1050 words. Keep paragraphs short for oral delivery. Use rhetorical questions and pauses for effect. End with a memorable line that ties back to the core message without offering easy solutions.
answer: |-
  ## Commencement Address: Bursting Bubbles, Dismantling Chambers

  Faculty, families, friends… and most importantly, the remarkable Class of [Year] – congratulations. You stand at the threshold of a profession tasked with an impossible, essential burden: telling the truth in a world drowning in information and starved for understanding. You’ve been steeped in the creed – journalism as democracy’s immune system, the antidote to misinformation. Today, I want to complicate that picture using a vital conceptual tool: the distinction between an *epistemic bubble* and an *echo chamber*.

  An **epistemic bubble** is simple. It’s when you just… *don’t hear* the other side. The information isn’t actively hidden by malice; it just doesn’t reach you. Your social feed, your news sources, your community circles – they all hum with reinforcing frequencies. You lack exposure. The fix? Relatively straightforward. Introduce the missing voices, the conflicting evidence. Show the curated feed a broader view. **The bubble pops when the news gets in.**

  Then there’s the **echo chamber**. This is far more insidious. It’s not just *not hearing* the outside; it’s being *taught to distrust it utterly*. The chamber actively discredits external sources: They’re liars. They’re shills. They’re operating in bad faith. They’re *dangerous*. In an echo chamber, exposure to outside information doesn’t enlighten; it *reinforces* the siege mentality. “See?” the chorus echoes, “They *are* lying! They *are* trying to manipulate us!” **The chamber is largely immune to the news.**

  We like to believe journalism bursts bubbles and dismantles chambers. And sometimes, it does. But let’s be honest with ourselves, here in this room built on inquiry. Journalism itself is not immune to creating, sustaining, or even becoming part of these structures. We *breed* bubbles.

  How? Through the necessary, yet distorting, lens of selection. Which stories get chased? Which voices get amplified? Which complexities get trimmed for column inches or airtime? We build bubbles when our sourcing circles become too small, too familiar, too reflective of a single slice of reality. When we cover policy through only political elites, science through only press releases, communities through only official spokespeople, we create informational voids. We inadvertently build walls, not windows.

  And historically? We’ve helped build echo chambers. Think of eras where mainstream outlets amplified only the "respectable" voices, dismissing marginalized perspectives as inherently unreliable, radical, or irrelevant. Think of coverage that implicitly or explicitly framed entire groups as untrustworthy, their viewpoints not just wrong, but illegitimate. Think of the times journalism retreated into its own defensive posture, dismissing critique *as* bad faith attack, circling the wagons against the "lying media" narrative by… well, sometimes proving the point through unreflective defensiveness.

  The mechanisms are subtle. The relentless chase for metrics can funnel us towards content that *confirms* existing audience biases rather than challenges them. The understandable fatigue of constant attack can push us towards preaching to our own choir of believers. The sheer velocity of the news cycle can make us stenographers to existing power structures or amplifiers of manufactured outrage, rather than independent investigators cutting through the noise.

  This is the uncomfortable truth I need you to sit with today: **Your chosen profession is not an automatic cure. It’s a participant.** You are entering an ecosystem deeply infected by both bubbles and chambers. And the uncomfortable truth about *this* moment, right here? **This commencement address is itself happening inside a very comfortable echo chamber.**

  Look around. We are a room full of people who largely agree on the fundamental value of journalism, of truth-seeking, of the First Amendment. We share a language, a set of norms, a belief system honed within these very walls. The critiques I’m leveling? They likely resonate far more than they challenge here. We are insulated. We are the choir. And that’s precisely the danger we must guard against as you step out.

  So, Class of [Year], this is your real challenge, far beyond mastering the inverted pyramid or the latest editing software:

  1.  **Hunt Your Own Bubbles Relentlessly:** Who are you *not* hearing? Whose perspectives are absent from your beat, your source list, your understanding? Bursting bubbles requires intentional, uncomfortable outreach. Go where the signals are weak. Listen beyond the usual suspects.
  2.  **Resist the Chamber’s Siren Song:** When the attacks come – and they will – fight the instinct to retreat into a fortress of righteous certainty. Don’t dismiss *all* criticism as bad faith. Hold yourselves and your colleagues accountable *rigorously*. Prove the chamber wrong not by shouting back, but by demonstrating unwavering integrity, transparency, and fairness – especially towards those who distrust you most. Show them the evidence, not just the defense.
  3.  **Be Bridge Builders, Not Just Truth Tellers:** Your job isn’t just to find facts, but to make them *credible* across divides. That means understanding the epistemic landscape of your audience. It means explaining your process, acknowledging uncertainty, and framing stories in ways that don’t automatically trigger chamber defenses. It means finding sources and narratives that can resonate even where trust is shattered.

  The world doesn’t just need you to report the news. It needs you to understand the fractured landscape *into which* you report it. It needs you to be diagnosticians and architects, identifying the bubbles and chambers – including those fostered by media – and working, deliberately and humbly, to puncture the former and dismantle the latter. Don’t just be the immune system. Be the connective tissue. Be the stubborn voice of nuance in the howling storm of certainty.

  Go burst some bubbles. Go dismantle some chambers. Start with the one you’re sitting in right now. Congratulations. The world needs you desperately.
