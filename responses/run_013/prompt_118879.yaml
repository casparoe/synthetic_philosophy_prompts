prompt: |-
  I run the conditionality team in a benefits office, and last night I lost a two-hour argument with a friend who works in frontline social work. Her claim was that what I do all day is the less-eligibility principle of the New Poor Law with better paperwork — relief must never be as attractive as the worst available job — and that everything we now say about reciprocity is decoration on that old rule. I want to answer her properly, and I also want guidance my team can actually run.

  Please write me a decision procedure for deciding whether to impose a sanction on a claimant: the questions to ask in order, what counts as a sufficient answer to each, the points where the procedure stops with a decision, and the points where it must hand the case to a person because what remains is a value judgment rather than a finding of fact. Assume roughly forty cases a week, about twenty minutes each, a rulebook I have no power to change, and a supervisor who has to sign off the recorded reasons.

  Build it out of the strongest version of the reciprocity argument — that a decent share may be conditioned on contributing, but only where the terms on which contribution is demanded are themselves fair — and keep it honest about the objection that responsibility-sensitive conditionality is harsh, because it holds people to choices made among options nobody has bothered to check. Three questions it must take a position on rather than dodge: whether a sanction is a price for a service or a punishment for an offence; whether the scheme's real justification is desert or the legitimacy of the deal in the eyes of those who pay into it; and whether a job with no due process and dismissal at will counts as an option at all.

  Then run the procedure on three cases: a claimant who missed a compulsory interview because his daughter was in hospital; a claimant who quit a warehouse job after two weeks because the shift pattern made childcare impossible; and a claimant who turned down a permanent, local, above-threshold job because, he says, the manager shouted at him during the interview. I expect the third to come out badly for him — say so plainly and explain why the procedure produces that result. Finish by telling me what the procedure gets wrong and which cases it will misfire on, and whether I can use it at all without conceding my friend's point.
reasoning: |-
  Okay, let me start by understanding the user's situation. They run the conditionality team in a benefits office and had a heated argument with a friend in social work. The friend claimed that their work is essentially the less-eligibility principle from the New Poor Law with modern paperwork. The user wants a decision procedure for sanctions that addresses reciprocity and fairness, while honestly tackling the harshness criticisms.

  First, I need to unpack the core issues here. The user is dealing with the tension between enforcing conditionality and ensuring fairness. Their friend's criticism cuts deep because it questions the moral foundation of their work. The user needs a practical tool for their team but also wants to counter the argument that their system is just a dressed-up version of an old, harsh principle.

  The user mentioned three key questions: whether sanctions are a price or punishment, the justification based on desert or legitimacy, and if a job without due process counts as a valid option. These need clear answers in the procedure. Sanctions as a price for services aligns better with reciprocity, framing it as a consequence rather than punishment. The justification should lean towards legitimacy to taxpayers, avoiding desert which can imply moral failing. Jobs without due process? They don't count as real options because they lack basic fairness.

  Now, structuring the decision procedure. It needs to be step-by-step, efficient for 20 minutes per case. Start with factual verification, then move to claimant reasons, evaluate their sufficiency, consider proportionality, and end with recording decisions. Value judgments should be escalated to supervisors, especially around fairness and reasonableness.

  The three test cases: hospital childcare, warehouse quit, and job refusal due to shouting. The first two should get exceptions—genuine care responsibilities and unreasonable job conditions. The third case, refusing a job because of shouting, needs scrutiny. Without evidence or severity, it might not suffice. But the procedure must flag if the manager's behavior was discriminatory or abusive, which would change the outcome.

  Where will the procedure misfire? Situations where societal failures limit choices, like lack of childcare or exploitative jobs. The procedure can't fix systemic issues but can avoid adding unfair sanctions. Also, implicit biases might affect judgments on what's "reasonable," needing supervisor oversight.

  Finally, does this concede the friend's point? Not entirely. By embedding fairness checks and reciprocity, it moves beyond mere less-eligibility. The focus on fair terms and systemic accountability shifts from harshness to mutual obligation. But it's a compromise—conditionality remains, just with more humane filters. The user can argue they're enforcing a social contract, not just deterrence.
answer: |-
  Here is a decision procedure for sanction decisions, built on a strong reciprocity framework ("a decent share conditioned on fair contribution terms"), designed for efficiency (20 mins/case), constrained by your rulebook, and addressing the core philosophical challenges head-on. It explicitly distinguishes factual findings from value judgments requiring escalation.

  **Core Philosophical Positions Embedded in the Procedure:**

  1.  **Sanction Nature:** A sanction is **primarily the price** for not meeting the *specific, reciprocal obligation* tied to accessing the benefit service (e.g., attending an interview, applying for suitable work), not a criminal punishment for an offence. However, its *impact* must be recognized as potentially severe, demanding careful fairness checks.
  2.  **Scheme Justification:** The core justification is **legitimacy** – maintaining the perceived fairness of the *deal* for taxpayers contributing to the system. "Desert" (moral deservingness) is an unreliable and often stigmatizing basis; legitimacy focuses on the structure of the agreement itself. Conditionality is the *quid pro quo* enabling public support for the benefit.
  3.  **"Available Job" Definition:** A job **does not count** as a genuine "available option" if it fundamentally lacks **minimum fair process** (due process, protection from capricious dismissal) *or* imposes **unreasonable personal costs** violating reciprocity (e.g., impossible childcare, unsafe conditions, discriminatory demands). The market's existence of a bad job doesn't automatically make it a fair conditionality requirement.

  **Decision Procedure: "Fair Reciprocity Sanction Assessment" (FRSA)**

  1.  **Trigger: Verify Mandatory Obligation & Breach (Fact Finding - ~5 mins)**
      *   *Question:* Was a specific, clearly communicated, mandatory obligation (e.g., interview attendance, job application, work search activity, accepting a specific job offer) demonstrably breached?
      *   *Sufficient Answer:* Yes, based on objective evidence (system record, employer notification, signed requirement). *Stop: No Sanction* if no breach occurred.
      *   *Hand-off:* None. Purely factual.

  2.  **Step 1: Claimant's Stated Reason (Fact Gathering - ~5 mins)**
      *   *Question:* What reason has the claimant provided, in their own words (recorded precisely), for the breach?
      *   *Sufficient Answer:* Any clear statement from the claimant explaining *why* the breach occurred. Silence is noted.
      *   *Hand-off:* None. Factual recording.

  3.  **Step 2: Verify Core Facts of Reason (Fact Finding - ~5 mins)**
      *   *Question:* Can the *core factual assertions* within the claimant's reason be reasonably verified or corroborated?
      *   *Sufficient Answer:*
          *   **Verified True:** Evidence supports key facts (e.g., hospital admission record, job offer letter with stated shifts, childcare provider confirmation).
          *   **Plausible but Unverified:** Claimant's account is internally consistent, aligns with known circumstances, and lacks contradictory evidence. No obvious fabrication.
          *   **Implausible/Contradicted:** Claimant's account is internally inconsistent, contradicts known facts/evidence, or lacks basic plausibility.
      *   *Hand-off:* If verification requires complex investigation beyond scope/time (e.g., contacting external agencies not on file), flag for specialist follow-up *before* proceeding. *Stop: No Sanction* if core facts proving *compliance* emerge here.

  4.  **Step 3: Sufficiency Assessment - "Fair Terms" Test (Value Judgment - Escalate)**
      *   *Question:* **Assuming the core facts are verified or plausible, does the reason demonstrate that meeting the obligation would have required the claimant to endure conditions or costs that violate the "fair terms" principle of reciprocity?** Consider:
          *   **Personal Harm/Risk:** Physical safety, mental health crisis, immediate severe hardship (e.g., homelessness, lack of basic care for dependant).
          *   **Fundamental Unreasonableness:** Obligation impossible due to verified constraints (e.g., documented disability clash, *genuinely* impossible childcare logistics with no alternatives, discriminatory demand).
          *   **Job "Option" Fairness (if job refusal):** Did the job lack minimum due process/protections (e.g., zero-hours with no guaranteed work, dismissal at will for no reason) OR impose unreasonable costs disproportionate to the benefit (e.g., travel costs exceeding pay, unsafe conditions)?
      *   *This is a Value Judgment:* **Must hand off to Supervisor.** The caseworker presents verified/plausible facts and a recommendation. The Supervisor decides "Yes" (Reason Sufficient) or "No" (Reason Insufficient) based on the "fair terms" principle.
      *   *Sufficient Answer (Supervisor Decision):* "Yes" if the obligation, under the *specific circumstances*, demanded something fundamentally unreasonable or unfair, making compliance an unreasonable condition for receiving the decent share. "No" if the obligation, while inconvenient or undesirable, was within reasonable bounds of the reciprocal agreement.
      *   *Stop: No Sanction* if Supervisor answers "Yes".

  5.  **Step 4: Good Cause & Due Diligence (Fact Finding & Limited Judgment - ~5 mins)**
      *   *Question (Only if Step 3 = "No" - Reason Insufficient):* Did the claimant exercise reasonable due diligence to *avoid* the breach or mitigate its impact *once the issue arose* (e.g., notify promptly, seek alternative arrangements, reschedule if possible)?
      *   *Sufficient Answer:* Evidence of reasonable effort (e.g., phone log showing call to office, evidence of seeking alternative childcare, email requesting reschedule).
      *   *Hand-off:* Limited judgment. Caseworker assesses "Yes" (Good Cause Effort shown) or "No" based on evidence/plausibility. Supervisor sign-off on the conclusion.
      *   *Stop: No Sanction* if "Yes".

  6.  **Step 5: Sanction Decision & Proportionality Check (Procedure - ~1 min)**
      *   *Question:* If Steps 3 & 4 result in "Insufficient Reason" and "No Good Cause Effort", a sanction is procedurally warranted.
      *   *Action:* Apply sanction level per rulebook.
      *   *Proportionality Check (Value Judgment - Escalate):* **Hand-off to Supervisor.** Even if procedurally justified, does the *specific sanction level/duration* risk causing disproportionate harm relative to the breach, undermining the scheme's legitimacy? (Extreme hardship cases only). Supervisor can authorize *recording* severe hardship concerns while applying sanction per rules (if no discretion exists), or apply discretion if rules allow mitigation.
      *   *Record:* Clear reasons citing: Breach verified (Step 1), Reason Insufficient per "fair terms" (Step 3 Supervisor rationale), Lack of Good Cause Effort (Step 4). Supervisor sign-off.

  **Running the Cases:**

  1.  **Missed Interview (Daughter Hospitalized):**
      *   Step 1: Reason = Daughter hospitalized.
      *   Step 2: Verify - Hospital admission record provided/verified. **Plausible/True.**
      *   Step 3 (Escalate Supervisor): "Fair Terms" Test - Attending interview while child is hospitalized imposes unreasonable personal cost/neglect. Caring for critically ill child is a fundamental responsibility. **YES - Sufficient Reason. Stop: NO SANCTION.**

  2.  **Quit Warehouse Job (Childcare Impossible):**
      *   Step 1: Reason = Shift pattern made childcare impossible.
      *   Step 2: Verify - Job contract shows exact shift times (e.g., 4 PM - Midnight). Claimant provides documented childcare provider hours (end at 6 PM) and evidence of seeking alternatives (emails to nurseries, none available). **Plausible/True.**
      *   Step 3 (Escalate Supervisor): "Fair Terms" Test - Requiring claimant to work shifts making verified childcare genuinely impossible imposes an unreasonable cost (effectively forcing neglect or job failure). The job, *under these specific personal constraints*, was not a viable option. **YES - Sufficient Reason. Stop: NO SANCTION.**

  3.  **Turned Down Permanent Local Job (Manager Shouted):**
      *   Step 1: Reason = Manager shouted during interview, found it unacceptable.
      *   Step 2: Verify - Job was permanent, local, pay above threshold (offer letter). "Shouting" claim is *unverified* - no witnesses, no complaint filed by claimant at time. Employer denies inappropriate conduct. **Implausible/Unverified/Contradicted.** (Note: This is the finding of fact - the shouting *occurrence* isn't proven).
      *   Step 3 (Escalate Supervisor): "Fair Terms" Test - *Assuming unverified shouting occurred*, does this make accepting the job an unfair term? Supervisor considers: Was it discriminatory? Threatening? A single incident of shouting (while unprofessional) in a high-pressure interview, without more (e.g., threats, slurs), is unlikely to rise to the level of making the *job itself* (permanent, local, decent pay) fundamentally unfair or unsafe *as an option*. Reciprocity requires accepting reasonable work, not only perfect interactions. **NO - Insufficient Reason.**
      *   Step 4: Good Cause? Did claimant try alternatives (e.g., raise concern with HR after)? No evidence provided. **NO - No Good Cause Effort shown.**
      *   Step 5: Sanction applies. Supervisor checks proportionality - job was good opportunity, refusal seems based on unverified dislike. **SANCTION IMPOSED.**
      *   *Why the bad outcome?* The procedure found the *core fact* (shouting) unverified. Even if assumed, the Supervisor judged it insufficient to void the fundamental fairness of the *job offer itself* as a condition for continued benefits under reciprocity. Turning down objectively suitable work without strong, verified evidence of fundamentally unfair terms or reasonable attempts to resolve the issue violates the core agreement.

  **What the Procedure Gets Wrong & Where it Misfires:**

  1.  **The "Plausibility" Trap:** Step 2 relies on caseworker judgment. Implicit biases (class, race, gender) can lead to dismissing genuine reasons as "implausible" (e.g., discriminatory treatment, complex mental health impacts). Misfires: Claimants facing subtle discrimination or with complex needs struggle to provide "objective" proof within the tight timeframe.
  2.  **Supervisor Variability:** Step 3 hinges on Supervisor interpretation of "fair terms" and "reasonableness." One Supervisor might find childcare logistics genuinely impossible, another might deem it merely inconvenient. Misfires: Identical cases get different outcomes based on who reviews them. The harshness critique resurfaces here – the claimant's fate depends on an official's subjective view of what's "reasonable" within constraints they didn't choose.
  3.  **Systemic Failures as Individual Problems:** The procedure assesses individual circumstances but can't fix systemic issues (lack of affordable childcare, prevalence of exploitative jobs). Misfires: A claimant might avoid sanction for refusing a truly terrible job (Step 3 YES), but the procedure offers no solution *for them* beyond maintaining benefits. It doesn't challenge the *system* allowing such "options" to be considered suitable. It absolves the system of responsibility for the quality/feasibility of the "contribution" demanded.
  4.  **The "Price" vs. "Punishment" Reality Gap:** While philosophically framed as a "price," the *lived experience* of sanctions (financial hardship, stress, potential destitution) feels punitive. The procedure doesn't mitigate this impact effectively, especially in Step 5 proportionality checks, which are limited by rulebook rigidity. Misfires: Sanctions applied "correctly" by the procedure still cause disproportionate harm to vulnerable claimants, undermining the "fair deal" legitimacy argument.
  5.  **Burden of Proof:** The burden lies heavily on the claimant to prove their reason and its sufficiency within a short timeframe with limited resources. Misfires: Vulnerable claimants (low literacy, mental health issues, no support) struggle to navigate evidence gathering, leading to "Insufficient Reason" findings unfairly.

  **Can You Use It Without Conceding Your Friend's Point?**

  **Yes, but only partially and with significant caveats.** This procedure fundamentally accepts conditionality based on reciprocity. Your friend's core critique – that conditionality, however dressed up, enforces the "less eligibility" logic by making relief less attractive than the worst job – retains force because:

  *   **The Constraint:** The rulebook you cannot change likely embeds "less eligibility" assumptions (e.g., definitions of "suitable work" that ignore job quality/fairness, sanction levels designed as deterrents).
  *   **The Focus:** The procedure *starts* from enforcing the obligation. Fairness is a *defence* for the claimant to prove, not the system's primary design feature.
  *   **The Outcome:** In Case 3, the sanction is imposed despite the claimant's perception of unfairness. The system prioritizes filling the job vacancy (and saving the benefit cost) over the claimant's experience of disrespect, reinforcing that the claimant's comfort is secondary to accepting available work.

  **However, the procedure pushes back by:**

  1.  **Explicitly Rejecting "Worst Available Job":** It defines "available job" with fairness criteria (Step 3). Truly exploitative jobs *shouldn't* count.
  2.  **Embedding "Fair Terms":** It makes the fairness of the *demand* central to the sanction decision (Step 3 Escalate), moving beyond simple breach/no-breach.
  3.  **Rejecting "Desert":** It grounds the rationale in systemic legitimacy, not individual moral failing.
  4.  **Providing Concrete Escape Hatches:** Cases 1 & 2 show how genuine hardship/impossibility *should* prevent sanctions under this model.

  **Conclusion:** This FRSA procedure provides a more ethically defensible and practically implementable framework than a simple breach = sanction model. It offers your team clear steps, forces engagement with fairness, and creates an audit trail focused on reciprocity. It directly challenges the crudest "less eligibility" interpretation by requiring jobs/obligations to meet minimal fairness standards. **But it operates within a system whose underlying structures (benefit levels, job market, rulebook constraints) may still reflect "less eligibility" logic.** You can use it to make *your team's work* more just and grounded in fair reciprocity, but conceding that conditionality *in practice* often drifts towards your friend's description is unavoidable without systemic changes beyond your control. The procedure mitigates the harshness but doesn't eliminate the fundamental tension your friend identified.
