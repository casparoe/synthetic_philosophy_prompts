answer: |-
  ## Sorting the Tin

  The light is low. My fingers sift the **tin**
  where buttons clink and settle as they **fall**.
  Some catch the window, oddly **bright**,
  some dark as stone. I pull a length of **thread**
  to test the holes. My working **hand**
  groups these from those—but are they quite the **same**?

  Not quite the **same**, yet close enough. They **fall**
  to common piles. This chipped one, once so **bright**
  against blue wool, might find a **thread**
  to suit it still. I turn it in my **hand**.
  The others wait within the shallow **tin**.
  Why keep this? For the eye? For being **bright**?

  Perhaps the **bright** ones share no common **thread**
  beyond this moment. Still, my restless **hand**
  continues sorting. Back into the **tin**
  go those too singular. They softly **fall**.
  That mother-of-pearl: was it the **same**
  die that pressed all? Or did each maker's **hand**

  impart some difference? This **hand** now sorts
  what others made. Some buttons **fall** apart
  if handled roughly. Others stay quite **same**
  through decades. How? Is it the metal **bright**,
  resisting time? Or just the sturdy **thread**
  that held them fast, not rusting in the **tin**?

  I find a **thread** of logic, thin, within
  the task itself. My sorting **hand**
  defines the groups. Before, the scattered **tin**
  held chaos. Order makes the matches **fall**.
  This oval, cracked, beside the **bright**
  new disc: a pair? Because I say they're **same**?

  Not truly **same**. No two alike, but each like next
  in line: this blue to that blue, both **bright**,
  then that to deeper navy. Does the **thread**
  of likeness hold without a form? My **hand**
  grows tired. The late sun makes the **tin**
  glow briefly. Buttons **fall** from piles askew.

  This button's **same** as that one, but where?
  Its being-blue—is that a thing? Or merely **bright**
  absence defining shape? The emptied **thread**
  spool waits. I close the lid upon the **tin**.
  Let others judge this work. My weary **hand**
  lets the misfits finally **fall**.

  Child, someday you’ll lift the **tin** and **fall**
  into this task. Your **hand** will touch the **bright**,
  the dull, the **same**, the odd—each needing **thread**.

