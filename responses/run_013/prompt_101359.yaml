answer: |-
  ### Review Procedure for Collection Proposals

  This procedure is designed to prevent paradoxical definitions while allowing ordinary comprehension. It focuses on specific patterns linked to known paradoxes (Russell's and Cantor's) and is runnable in ~15 minutes by data engineers. Steps are ordered to catch critical issues first. **Bold terms** mark key concepts.

  **Key for Decisions**:
  - ✅ **Accept**: Proposal passes.
  - ⛔ **Reject**: Proposal fails (explain why to the author).
  - ⚠️ **Escalate**: Halt and escalate to a human (design/policy choice needed).

  ---

  #### Procedure Steps
  1. **Check definition style**  
     - *Question*: Is the collection defined by a **membership condition** (comprehension) or a **recursive rule** (least collection closed under a rule)?  
     - *Decision*:  
       - **Comprehension** → Go to Step 2.  
       - **Recursive** → Go to Step 7.  
     - *Why*: Comprehension is more prone to paradoxes; recursive definitions are safer but need checks.

  2. **Look for unbounded quantifiers (comprehension only)**  
     - *Inspect*: Does the condition quantify over **all collections without restriction** (e.g., `∀y` or `∃y` with no bounding like `y ∈ C`)?  
     - *Adequate answer*: All quantifiers must be **bounded** (e.g., `∀y ∈ C` or `∃y ∈ x`).  
     - *Decision*:  
       - **Unbounded quantifier found** → ⛔ Reject.  
       - **All quantifiers bounded** → Go to Step 3.  
     - *Why*: Unbounded quantification enables paradoxes (e.g., universal collection).

  3. **Check for universal collection pattern (comprehension only)**  
     - *Inspect*: Is the condition **always true** (e.g., `x = x`, `x is a collection`, or no constraints)?  
     - *Adequate answer*: Condition must constrain membership (e.g., `size(x) > 0`).  
     - *Decision*:  
       - **Always true** → ⛔ Reject.  
       - **Not always true** → Go to Step 4.  
     - *Why*: Universal collections lead to Cantor’s paradox with subcollections.

  4. **Check for Russell’s paradox pattern (comprehension only)**  
     - *Inspect*: Does the condition contain **`x ∉ x`**?  
     - *Adequate answer*: Avoid direct self-exclusion.  
     - *Decision*:  
       - **`x ∉ x` found** → ⛔ Reject.  
       - **Not found** → Go to Step 5.  
     - *Why*: `{x | x ∉ x}` causes Russell’s paradox (contradiction if it contains itself).

  5. **Check for self-containment pattern (comprehension only)**  
     - *Inspect*: Does the condition contain **`x ∈ x`**?  
     - *Adequate answer*: Self-containment is safe only if the universal collection doesn’t exist (policy choice).  
     - *Decision*:  
       - **`x ∈ x` found** → ⚠️ Escalate.  
       - **Not found** → Go to Step 6.  
     - *Why*: `{x | x ∈ x}` enables Russell’s paradox if combined with a universal collection.

  6. **Check for other self-reference (comprehension only)**  
     - *Inspect*: Does the condition **mention the collection being defined** (e.g., `x ∈ C` where `C` is the new collection)?  
     - *Adequate answer*: Self-reference is allowed only in recursive definitions.  
     - *Decision*:  
       - **Self-reference found** → ⚠️ Escalate.  
       - **No self-reference** → ✅ Accept.  
     - *Why*: Non-Russell self-reference (e.g., `x ∈ C`) is complex and may hide paradoxes.

  7. **Look for unbounded quantifiers (recursive only)**  
     - *Inspect*: Does the rule contain **unbounded quantifiers** (e.g., `∀y` with no `y ∈ C`)?  
     - *Adequate answer*: Quantifiers must be bounded.  
     - *Decision*:  
       - **Unbounded quantifier found** → ⛔ Reject.  
       - **All quantifiers bounded** → ✅ Accept.  
     - *Why*: Unbounded quantification risks paradoxes; recursive definitions are safe otherwise.

  ---

  ### Application to Proposals
  Assume proposals:
  - **Proposal A**: `{x | x ∉ x}` (collections not containing themselves).
  - **Proposal B**: `{x | x ∈ x}` (collections containing themselves).
  - **Proposal C**: Recursive collection of objects reachable from seed `s` under operation `f` (e.g., `f(x) = x + 1` starting from `0`).

  #### Review Log
  **Proposal A** (`{x | x ∉ x}`):
  - Step 1: Comprehension → Step 2.
  - Step 2: No unbounded quantifiers → Step 3.
  - Step 3: Not always true (e.g., `{∅}` contains itself) → Step 4.
  - Step 4: **`x ∉ x` found** → ⛔ **Reject**.  
  *Explanation to author*: This causes Russell’s paradox (contradiction if the collection contains itself).

  **Proposal B** (`{x | x ∈ x}`):
  - Step 1: Comprehension → Step 2.
  - Step 2: No unbounded quantifiers → Step 3.
  - Step 3: Not always true (e.g., `∅ ∉ ∅`) → Step 4.
  - Step 4: No `x ∉ x` → Step 5.
  - Step 5: **`x ∈ x` found** → ⚠️ **Escalate**.  
  *Explanation*: Safe if no universal collection exists, but a human must decide due to policy risk.

  **Proposal C** (Recursive, objects reachable from `s` under `f`):
  - Step 1: Recursive → Step 7.
  - Step 7: No unbounded quantifiers (rule is `base: s`; `step: if x in C, add f(x)`) → ✅ **Accept**.  
  *Harmless but rejected example*: A comprehension like "all singletons" (`∃y ∀z (z ∈ x ↔ z = y)`) fails at Step 2 (unbounded `∀z`). Engineers should escalate these for human override if useful.

  ---

  ### Limitations and Validation
  **What the procedure cannot settle**:
  - Judgement calls (Steps 3, 5, 6) depend on reviewer intuition (e.g., "always true" or self-reference nuances).
  - Recursive definitions with complex rules (safe per platform, but unbounded quantifiers are caught).
  - Proposals that combine harmlessly with existing collections (review is per-proposal).

  **Failures indicating the procedure is wrong**:
  - A ⛔ rejection of a safe, useful proposal (e.g., "all singletons" in comprehension) due to over-strict Step 2.
  - A ✅ acceptance of a paradoxical proposal (e.g., universal collection disguised as `x = x`).
  - Escalation overload (e.g., >20% of proposals sent to humans).

  **Most critical step**: **Step 2** (bounded quantifiers) blocks most paradox enablers (e.g., universal collection) but also rejects harmless cases like "all singletons." This is the trade-off for simplicity.

  **When a harmless proposal is rejected**: The reviewer should escalate to you/architect for override. Example: "all singletons" is mathematically safe but rejected at Step 2; a human can approve it if rewritten with bounded quantifiers or moved to a recursive definition.

  This procedure minimizes risk while allowing 95% of useful definitions. Reviewers can run it with minimal training, and escalation handles edge cases.
