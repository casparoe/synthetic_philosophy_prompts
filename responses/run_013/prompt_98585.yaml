prompt: |-
  I need a specification for what a species concept must deliver before I evaluate any more of them. Set out the desiderata: the cases it has to get right (ring species, cryptic lineages, asexual and parthenogenetic taxa, organisms that swap genes horizontally, fossil and microbial sequences, and a hypothetical case of a single interbreeding population that sends out a daughter population which then diverges ecologically while still exchanging genes at low frequency), the distinctions it must respect (species category versus species taxon; diagnosability versus reproductive isolation; monophyly versus interbreeding; ranking versus delimitation), the findings from population genetics, phylogenetics, and ecology it cannot contradict, and the practical tasks it must serve (conservation law, biodiversity inventory, model-organism choice, and decisions made by non-specialists on incomplete data). For each requirement, give the case or consideration behind it and mark it non-negotiable or a preference of a particular school (biological, evolutionary, phylogenetic, ecological, or pluralist). Then flag any subset of requirements that cannot be jointly satisfied, and say which single requirement eliminates the most proposed concepts. Keep the assessment of existing contenders to a sentence or two each; the list of requirements is what I want.
reasoning: |-
  Okay, the user wants a comprehensive specification for evaluating species concepts. They listed several cases like ring species and asexual taxa, distinctions such as species category vs taxon, and practical applications in conservation. 

  First, I need to parse all their requirements. The cases to handle include tricky ones like ring species where populations interbreed except at endpoints. Cryptic lineages look alike but don't interbreed. Then there's horizontal gene transfer in microbes and fossils where we can't observe reproduction. The hypothetical case of a diverging daughter population with low gene flow is particularly challenging.

  Distinctions are crucial. Category vs taxon means defining what a species is versus identifying specific groups. Diagnosability vs reproductive isolation - some concepts prioritize observable differences, others breeding barriers. Monophyly vs interbreeding conflicts in phylogenetics versus biology. Ranking vs delimitation is about naming versus defining boundaries.

  Scientific constraints come next. Population genetics shows gene flow isn't all-or-nothing, which challenges strict isolation concepts. Phylogenetics expects monophyly but hybridization breaks that. Ecology notes that niche adaptation can happen without reproductive isolation.

  Practical needs: Conservation laws often rely on species lists, so a concept must produce stable classifications. Biodiversity inventories need clear units. Model organisms require unambiguous groups. Non-specialists need simple, observable criteria.

  Now, conflicts. The big one is requiring reproductive isolation (for biological concepts) versus monophyly (phylogenetic). Ring species and the hypothetical case show this tension - they're interbreeding but not monophyletic. Asexual taxa can't fit isolation concepts at all. Horizontal gene transfer breaks monophyly expectations.

  The reproductive isolation requirement eliminates many concepts because so many cases don't fit it. Biological concepts fail for asexuals and hybrids. Ecological concepts might handle some but not cryptic species. Pluralism helps but can be messy for practical uses.

  I should note which requirements are non-negotiable versus school preferences. The cases and distinctions are mostly non-negotiable facts. Scientific constraints are hard limits. Practical needs vary but stability for conservation is key.

  The user probably wants this for evaluating concepts systematically, maybe for research or policy. They might be frustrated with current debates and want a clear framework. Their deep need is likely a practical, unified approach despite theoretical conflicts. Highlighting impossible combinations shows why no single concept works universally.
answer: |-
  Here is a comprehensive specification of desiderata for evaluating species concepts, structured as requested:

  **I. Cases It Must Get Right (Non-Negotiable Real-World Challenges):**
  1.  **Ring Species:** Must delineate species boundaries in a continuous population ring where adjacent demes interbreed, but terminal ends do not (e.g., *Ensatina* salamanders). *Non-negotiable.*
  2.  **Cryptic Lineages:** Must recognize distinct species despite morphological similarity, based on genetic divergence/reproductive isolation (e.g., *Eleutherodactylus* frogs, many insects). *Non-negotiable.*
  3.  **Asexual & Parthenogenetic Taxa:** Must provide a principled way to delimit species in the absence of sexual reproduction and gene flow (e.g., bdelloid rotifers, many plants via apomixis). *Non-negotiable.*
  4.  **Organisms with Horizontal Gene Transfer (HGT):** Must handle entities where primary lineage cohesion isn't vertical descent (e.g., many bacteria, archaea). *Non-negotiable.*
  5.  **Fossils & Microbial Sequences:** Must be applicable with limited phenotypic/genetic data, often lacking direct evidence of interbreeding or ecology. *Non-negotiable.*
  6.  **Hypothetical Diverging Daughter Population:** Must handle a population diverging ecologically from its source while maintaining low-level, non-trivial gene flow. *Non-negotiable test case for gene flow thresholds.*

  **II. Distinctions It Must Respect (Non-Negotiable Conceptual Clarifications):**
  7.  **Species Category vs. Species Taxon:** Must clearly define the *concept* (what a species *is*) separately from the practical *delimitation* and naming of specific groups (taxa). *Non-negotiable.*
  8.  **Diagnosability vs. Reproductive Isolation:** Must not conflate observable differences (diagnosability) with barriers to gene flow (isolation). They often coincide but are distinct processes. *Non-negotiable.*
  9.  **Monophyly vs. Interbreeding:** Must acknowledge the potential conflict between requiring exclusive common ancestry (monophyly) and allowing ongoing interbreeding (cohesion). *Non-negotiable.*
  10. **Ranking vs. Delimitation:** Must separate the act of defining population boundaries (delimitation) from the decision to rank those boundaries as species-level rather than subspecies or genus. *Non-negotiable.*

  **III. Scientific Constraints It Cannot Contradict (Non-Negotiable Findings):**
  11. **Population Genetics (Gene Flow):** Must accommodate the reality that gene flow is often non-zero, clinal, and exists on a continuum, not a binary switch. *Non-negotiable.*
  12. **Phylogenetics (Evolutionary History):** Must be compatible with the tree-like (or network) structure of evolutionary descent, acknowledging hybridization and introgression. *Non-negotiable.*
  13. **Ecology (Niche Adaptation):** Must recognize that divergent ecological selection can drive lineage divergence even in the presence of some gene flow. *Non-negotiable.*

  **IV. Practical Tasks It Must Serve (Operational Needs - Prioritized):**
  14. **Conservation Law:** Must produce stable, defensible, and legally applicable units for protection and management. *High Priority (Stability & Defensibility).*
  15. **Biodiversity Inventory:** Must enable consistent, comparable, and operationalizable counting/delimitation across diverse life forms. *High Priority (Operationality & Universality).*
  16. **Model-Organism Choice:** Must provide clear, biologically meaningful units for comparative biology and experimentation. *High Priority (Biological Meaning).*
  17. **Non-Specialist Decisions:** Must provide criteria usable with incomplete data by field biologists, agriculturists, pest controllers, etc. (Often relies on morphology/diagnosability). *High Priority (Practicality).*

  **V. Flagging Conflicts & Key Eliminators:**

  *   **Fundamental Conflicts:** Requirements **#6 (Diverging Daughter w/ Gene Flow)**, **#9 (Monophyly vs. Interbreeding)**, **#3 (Asexuality)**, and **#4 (HGT)** create inherent tensions that **cannot be jointly satisfied by any single monistic concept**. Specifically:
      *   Requiring strict **monophyly (#9)** conflicts with recognizing lineages experiencing **ongoing gene flow (#6, #11)** or **HGT (#4)**.
      *   Requiring **reproductive isolation** (a common proxy for #9 in practice or core to Biological SC) is **impossible for asexuals (#3)** and conflicts with **divergence-with-gene-flow (#6, #11)**.
      *   Concepts prioritizing **diagnosability (#8, #17)** may misclassify **cryptic species (#2)**.
      *   Concepts requiring **interbreeding cohesion** fail utterly for **#3 and #4**.

  *   **The Single Most Eliminative Requirement:** Requirement **#3 (Asexual & Parthenogenetic Taxa)** eliminates the most proposed concepts. **The Biological Species Concept (BSC)** and any concept fundamentally reliant on *potential* interbreeding (e.g., Evolutionary SC) **fail completely** here. Only concepts emphasizing diagnosability, monophyly, or ecological cohesion can even attempt to handle asexuality, and even they struggle with ranking and universality.

  **Assessment of Major Contending Concepts (Brief):**
  *   **Biological (BSC):** Fails #3, #4, #5, struggles with #1, #2, #6, conflicts with #9, poor for #14-17 outside sexually reproducing animals.
  *   **Evolutionary (ESC):** Similar issues to BSC, slightly better for #1/#6 via lineage focus but still fails #3, #4, struggles with delimitation (#7, #10).
  *   **Phylogenetic (PSC - monophyly):** Fails #6 (gene flow breaks monophyly), struggles with #1, #4 (HGT), #11 (gene flow continuum), #17 (practicality), ranking (#10) ambiguous.
  *   **Phylogenetic (PSC - diagnosability):** Handles #2, #3, #5 well; struggles with ranking (#10), #6 (gene flow), #9 (monophyly vs cohesion), #11, #14 (stability).
  *   **Ecological (EcSC):** Handles #6 well; struggles with #2 (cryptic species same niche?), #3 (defining niche in asexuals), #4, #5, delimitation (#7, #10), #15 (universality).
  *   **General Lineage Concept (GLC)/Unified Species Concept (USC):** Framework treating species as separately evolving metapopulation lineages; accommodates pluralism but shifts burden to defining "separately evolving," struggles with operational delimitation (#7, #16, #17), ranking (#10).
  *   **Pluralism:** Accepts different concepts for different contexts, satisfies most cases pragmatically but fails to provide a single unified concept (#7), can be messy for #14, #15, #16.

  This specification provides the rigorous framework needed to evaluate any species concept against the essential biological realities, conceptual distinctions, scientific foundations, and practical demands of modern biology. The inherent conflicts highlighted demonstrate why no single concept universally satisfies all desiderata.
