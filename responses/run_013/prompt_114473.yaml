prompt: |-
  I've been going down a rabbit hole on Nagarjuna's tetralemma after a friend of mine -- a programmer who's into wierd non-classical logics -- told me it's basically a four-valued logic. Let me lay out the picture I've assembled and you can tell me where it's off. The four corners are (1) it's true, (2) it's false, (3) it's both true and false, (4) it's neither true nor false. Nagarjuna runs through all four and dismantles each one, which I take to be a proof that every possible position on a question fails. So the upshot, on my reading, is that reality can't be captured by any of the four options, and the one thing left standing is emptiness. Which makes emptiness look like the one thing that's really there -- the base layer, the void behind everything -- basically a fifth value you arrive at once the other four are ruled out. That would also explain why emptiness gets called the ultimate truth while everything else is merely conventional.

  Two things I want to pin down. First, is it fair to call the tetralemma a four-valued logic and set it beside paraconsistent logics and dialetheism, or am I jamming a Western logical framework onto something that doesn't work that way? Second -- and this is the one that really trips me up -- if emptiness is what's left once all four corners fail, then hasn't emptiness just become a position, i.e. something that exists? A friend tried to get out of this by saying emptiness is itself empty, but that sounds either like a paradox or like he's just telling me emptiness isn't a thing, in which case I genuinely don't know what it is. I keep going in circles on this and would really like a clear walkthrough of where my picture goes wrong, not just a summary of what emptiness is supposed to mean.
