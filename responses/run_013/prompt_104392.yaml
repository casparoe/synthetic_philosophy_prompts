prompt: |-
  Two nights ago I lost an argument with a friend of mine who edits a dictionary for a living. I said that plenty of perfectly good words have no definition at all, only a web of overlapping similarities, and that this is not a defect in them but how language mostly works; he said that this is vagueness dressed up as philosophy, that a competent lexicographer can write a definition for any word worth defining, and that "family resemblance" is what people reach for when they cannot. We went around it for hours, and I kept invoking Wittgenstein and kept not quite landing him, which is why I am writing to you. Next month I have to run a ninety-minute session in a public library discussion series — eight or so adults, no philosophy background, no advance reading (they will not do it), one retired patent attorney who will demand a test he can apply and one ceramicist who will distrust any test on principle — and I have decided to do language games and family resemblance together. Do not explain the material to me. I know it well enough to be dangerous and badly enough to have lost to a lexicographer. Plan how I should teach it.

  What I need is the order the ideas have to come in, with the dependencies made explicit: what has to be in place before the next thing can even be heard, and where the temptation to say something false — or something Wittgenstein would disown — is greatest. Tell me which single example should carry the whole session, what it must have and what it must lack, and if you conclude that it has to be games after all, say so and tell me what the obvious choice costs us and how to keep the room from hearing "so there are no definitions, anything goes." I expect a specific set of misconceptions, roughly in the order they will surface. My guess is that the first is "family resemblance means concepts are just vague," and that the second is "a language game is a game played with words," but I want the ones I have not thought of, including whatever they will form about Wittgenstein himself, and for each one exactly where in the sequence I should head it off rather than saving it for the end. I also want a closing question I can put to the room that would tell me whether the idea actually landed, as opposed to whether I got nods.

  Finally, tell me what to leave out at this level and to say out loud that I am leaving it out — I would rather name the thing I am skipping than have the patent attorney discover it and conclude I do not know it. Write it in American English, and give it to me as a plan I can run with a whiteboard, not as an essay I would have to translate into one.
reasoning: |-
  Okay, let me approach this systematically. The user is preparing a 90-minute public library session on Wittgenstein's language games and family resemblance for non-philosophers, after losing an argument to a lexicographer friend. The core challenge is making these abstract concepts tangible without oversimplifying.

  Hmm, the user needs a concrete teaching sequence that prevents common misconceptions. Three key requirements stand out: they want dependency mapping between ideas, anticipation of misconceptions at specific points, and one central example to carry the session. The patent attorney and ceramicist represent opposing cognitive styles that must both be satisfied.

  First, considering the central example dilemma. Games are the classic Wittgensteinian example but risk trivialization. Alternatives like "art" or "tools" could work but might introduce unnecessary complexity. Games work best because participants can immediately generate examples. The cost is superficial "anything goes" interpretations, but that can be mitigated by showing boundaries through negative examples later.

  For structure, the session must first dismantle the definitional expectation. Starting with the lexicographer's challenge ("define 'game'") creates productive frustration. Sequencing should be: 
  1) Elicit definitions to expose their inadequacy 
  2) Introduce family resemblance through participant examples 
  3) Show concept boundaries via negative cases 
  4) Transition to language games as rule-governed practices 
  5) Contrast with dictionary definitions as snapshots of use

  Critical misconception points: 
  - Early on: "Vagueness means no boundaries" (counter with non-games like tooth extraction) 
  - Mid-session: "Language games are verbal play" (emphasize seriousness in examples like courtrooms) 
  - Late stage: "Wittgenstein rejects all definitions" (stress dictionaries as useful maps, not useless)

  The closing assessment should be practical: "If Martians saw humans use 'love' only in romantic contexts, what would they misunderstand?" This tests grasp of meaning-as-use without philosophical jargon.

  What to explicitly omit: Private language argument (too complex), picture theory contrast (distracting), Kripke's interpretation (irrelevant). Naming these builds credibility with the patent attorney.

  Whiteboard flow should be visual: 
  Left column for failed definitions 
  Center for resemblance web 
  Right for rule examples 
  All generated by participants to maintain engagement.

  The ceramicist's anti-test stance will be honored through example diversity; the attorney's need for criteria met through boundary-testing exercises. By making the lexicographer's position valid but incomplete, the friend isn't dismissed but contextualized.
answer: |-
  Here’s a battle-tested 90-minute plan focused on **one core example** ("games"), structured to preempt misconceptions, with explicit signposting about omissions. Designed for a whiteboard and group participation.

  **Core Example:** **GAMES** (Wittgenstein’s own choice—worth the cost for immediacy. *Cost*: Risk of "anything goes." *Mitigation*: Show boundaries via negative examples and rules.)

  ---

  ### **Session Roadmap (Whiteboard Columns: TIME | ACTIVITY | CONCEPT | MISCONCEPTION TRAP)**
  *(Total: 85 mins + 5 min buffer)*

  1.  **WARM-UP: THE LEXICOGRAPHER’S CHALLENGE**  
      *(10 mins)*  
      - **Activity:** Ask: *"What’s a perfect definition of ‘game’? Write one sentence."* Share 2-3 attempts.  
      - **Concept:** Exposes the instinct to define by necessary/sufficient conditions (e.g., "fun," "rules," "winning").  
      - **Trap Here:** *"If we can’t define it easily, it’s just vague."*  
      - **Preempt:** *"We’re not saying it’s vague—we’re asking if definitions capture how we actually use the word."*

  2.  **FAMILY RESEMBLANCE: SHOW, DON’T TELL**  
      *(25 mins)*  
      - **Activity:**  
          1. Brainstorm 10+ game examples (chess, soccer, solitaire, tag, RPGs, ring-around-the-rosy).  
          2. Draw overlapping circles on board. Ask: *"What features connect these?"* (e.g., rules, competition, skill, luck, goals, entertainment).  
          3. Map features: No single feature in *all* games (solitaire has no competition; ring-around-the-rosy has no "winning").  
          4. Add borderline cases: *"Is gambling a game? A ritual? Calisthenics?"*  
      - **Concept:** Meaning emerges from criss-crossing similarities, not a core essence.  
      - **Trap Here:** *"So concepts are arbitrary/fuzzy!"*  
      - **Preempt:** *"Notice boundaries aren’t random—we mostly agree what’s NOT a game."* → Add **NEGATIVE EXAMPLES** (e.g., brushing teeth, a Senate vote, a tooth extraction). *"Why not? They lack the web."*

  3.  **LANGUAGE GAMES: RULES IN ACTION**  
      *(25 mins)*  
      - **Activity:**  
          1. Contrast: *"Is ‘checkmate!’ meaningful on a soccer field? Why not?"*  
          2. Pick 3 scenarios:  
              - **A. Courtroom:** "Objection!" → Rules: Who speaks, when, consequences.  
              - **B. Workshop:** "Pass the glaze" → Rules: Context, shared task, materials.  
              - **C. Love poem:** "My heart is a furnace" → Rules: Metaphor, not literal.  
          3. *Group Task:* "What ‘rules’ make these phrases work? What if you broke them?"  
      - **Concept:** Words gain meaning from their role in rule-governed activities ("forms of life").  
      - **Trap Here:** *"So language games = wordplay (puns, Scrabble)!"*  
      - **Preempt:** *"Wittgenstein means *any* shared activity where words have jobs—serious or playful. The ‘game’ is in following/public rules."*  
      - **Key Contrast:** *"Dictionary definitions are like snapshots of these games in action—useful, but they don’t capture the living activity."*

  4.  **TYING IT TOGETHER: WHY THIS MATTERS**  
      *(15 mins)*  
      - **Activity:**  
          1. Return to "games." *"How does ‘family resemblance’ + ‘language games’ explain why we use the word flexibly?"*  
          2. Lexicographer counterpoint: *"Could a dictionary define ‘game’? How?"* (Acknowledge: good definitions describe the web, e.g., "activity with X or Y or Z features...").  
          3. *"Where does the lexicographer (my friend) *and* Wittgenstein *both* win?"*  
      - **Concept:** Dictionaries capture patterns of use; philosophy examines how use creates meaning.  
      - **Trap Here:** *"So definitions are useless!"*  
      - **Preempt:** *"Definitions are maps. But the territory—how we live in language—is richer. Maps aren’t wrong; they’re summaries."*

  5.  **CLOSING QUESTION (ASSESSMENT):**  
      *(10 mins)*  
      - **Prompt:** *"Imagine Martians observe humans. They see us say ‘love’ to:  
          - A romantic partner  
          - A parent hugging a child  
          - A friend after a long absence  
          - A favorite food ('I love pizza!')  
      What would Martians *miss* if they only read a dictionary definition of ‘love’? What ‘language games’ would they misunderstand?"*  
      - **Why it works:** Tests grasp of meaning-in-use, not definitions. If they note context, rules, or emotional weight vs. dictionary flatness, the idea landed.

  ---

  ### **MISCONCEPTIONS TO PREEMPT (AND WHERE)**  
  1.  **"Family resemblance = vagueness/lack of boundaries."**  
      - **Kill early:** When showing negative examples (Step 2). *"Boundaries exist—they’re based on missing *all* resemblances, not blurriness."*  
  2.  **"Language games = parlour games (Scrabble, puns)."**  
      - **Preempt hard:** When introducing courtroom/workshop examples (Step 3). Stress *"rule-governed" ≠ "playful."*  
  3.  **"Wittgenstein says definitions are worthless."**  
      - **Address explicitly:** During lexicographer reconciliation (Step 4). *"Dictionaries are useful tools! They’re just not philosophical explanations."*  
  4.  **"So anything can mean anything!"**  
      - **Undercut throughout:** Negative examples (Step 2), rules in language games (Step 3), Martian prompt (Step 5).  
  5.  **"Wittgenstein was a relativist."**  
      - **Head off:** When noting public rules (Step 3). *"Rules aren’t private—they’re shared. Meaning requires a community."*  

  ---

  ### **WHAT TO SKIP (SAY THIS ALOUD)**  
  *"We’re skipping three big Wittgenstein ideas today because they need more time:  
  1. **Private language argument** (can words mean something only *you* understand?),  
  2. **Picture theory of language** (his early view that words ‘mirror’ reality—which he rejected later),  
  3. **‘Forms of life’** deep-dive (how culture shapes games).  
  This keeps us focused on today’s tools."*  
  *(Satisfies the patent attorney; shows roadmap awareness.)*

  ---

  ### **WHITEBOARD LAYOUT**  
  ```
  [LEFT SIDE]                          [CENTER]                     [RIGHT SIDE]  
  **FAMILY RESEMBLANCE**              **LANGUAGE GAMES**          **RULES**  
  • Brainstormed games (list)         • Courtroom: "Objection!"   • Who can speak?  
  • Features (rules, fun, win...)     • Workshop: "Pass the glaze" • When? With what?  
  • NO SINGLE THREAD                  • Poem: "My heart is..."    • What happens if broken?  
  • BORDERLINE: gambling?             • MEANING = USE IN CONTEXT  
  • NOT GAMES: tooth extraction, etc.  
  ```
  *Arrows connecting left/center columns: "Features depend on the game being played".*

  ---

  **Why this works:**  
  - **One anchor example** ("games") avoids cognitive overload.  
  - **Active participation** replaces lecture (no reading = no problem).  
  - **Patent attorney** gets testable boundaries (negative examples, rules).  
  - **Ceramicist** sees anti-reductionism in action (no "definition test").  
  - **You** avoid explaining Wittgenstein—*they discover* the problems with definitions.  
  - **Lexicographer friend** isn’t "wrong"—dictionaries and philosophy do different jobs.  

  Run this tight, and the Martian question will reveal who’s nodding mechanically versus who sees language anew.
