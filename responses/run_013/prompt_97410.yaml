prompt: |-
  Ok so I'm taking this philosophy of biology seminar and we just did the Gould & Lewontin spandrels paper, and I cant really tell if I actually buy the central complaint or if I just find it rhetorically satisfying. Their beef, as I understand it, is that adaptationists can cook up a plausible selective story for basically any trait, and when there are several equally good stories they just pick whichever one suits them, and none of it ever really gets falsified. But our TA said something that stuck with me: she said the paper at most shows you can always narrate an adaptation, not that adaptationist research cant be tested, because real adaptationists make quantitative predictions (about costs, heritability, the fit between design and function) that can absolutely fail.

  So here's what I want from you: your credence in a fairly specific claim, decomposed. The claim: for any biological trait, in practice the evidence a working biologist can actually get will almost always be consistent with at least one adaptive explanation, so adaptationist hypotheses are effectively not falsifiable in the day-to-day research context the critique is aimed at.

  I want a number, and I want you to break it into the sub-questions it rides on, each with its own rough probability and a line of why: (a) whether the unfalsifiability charge is true of the strongest version of adaptationism vs. only a strawman; (b) whether its true of what actual working biologists do vs. what the theory in principle permits; (c) whether a spandrel / byproduct / drift explanation is a genuine rival to an adaptation explanation or just a supplement that leaves the adaptationist story standing; (d) whether a spandrel can even be identified independently, or whether calling something a spandrel is itself an unfalsifiable move (kind of a tu quoque worry that nobody in my seminar could answer); and (e) whether falsifiability is even the right diagnostic here at all, vs. something like explanatory power or evidential weight. Then combine them into your final number and tell me which sub-question the number is most sensitive to, and what would move it most -- like is there a kind of study or measurement that would actually settle this, or is it the sort of thing that just gets decided by which side has the better rhetoric.

  Also, for calibration: my own credence in the claim is maybe 0.55, and my friend (who thinks Gould and Lewontin basically won the culture war but not the biology) says 0.2. Whose number do you think is off, and roughly which of those terms is doing the work in the gap between us?
