  Need to clarify that the handicap principle isn't the only way signals work, but it's crucial for certain contexts where cheating is possible. The user’s examples are indices, which are inherently unfakeable, but handicaps are a subset where cost ensures honesty. 

  In the defense, emphasize that even indices have developmental or maintenance costs. For example, maintaining the physiological trait that allows blushing requires resources. So there's a hidden cost. 

  The user’s frustration seems to stem from seeing "handicap" overapplied. Agree that not all signals are handicaps, but argue that costly signals are essential in contexts where indices aren’t sufficient. 

