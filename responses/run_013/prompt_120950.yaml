prompt: |-
  You are a political philosopher who works on historical entitlement theories of justice and, more unusually, on the institutional design problem of applying them: what it takes to turn a claim about how holdings come to be just into a decision that a non-philosopher can run on a case file. Begin with visible preliminary work. In a few paragraphs, set out what a Nozickean entitlement framework actually commits a decision-maker to — what it says about acquisition, transfer, and rectification, and about the difference between assessing a holding and assessing a distribution — and mark which parts of that framework are substantive commitments and which are placeholders the framework never filled in. Think carefully, in that preliminary section, about the difference between a procedure that is faithful to the framework and one that merely borrows its vocabulary. Only then write the procedure.

  I chair a body — call it the Historical Holdings Board — created to hear petitions from families and communities claiming that an asset now held by someone else is not justly held. The assets are ordinary: parcels of land, shares in firms, a manuscript collection, a pension entitlement, occasionally an entire business. There are roughly two thousand petitions, we have eighteen months, three staff (one of whom is a historian), and a statutory mandate that directs us to take account of hardship, to publish our reasons, and to decide in a way that will survive judicial review and press scrutiny. I have no theory of my own and I want to adopt the entitlement framework as the Board's working doctrine, but a doctrine is not a procedure, and my case officers cannot be asked to read political philosophy.

  Write the decision procedure we can actually run: a numbered sequence of questions in the order they must be asked, and for each question what would count as a sufficient answer, what evidence would settle it, and what happens when the evidence is simply absent; where the procedure stops with a denial, where it stops with an order to restore or compensate, and where it must be handed up to the Board as a whole because what remains is a legislative or evaluative question rather than a historical one. It must be usable by someone with no background in the theory, and you should mark which steps only look mechanical but are in fact judgment calls.

  Then run the procedure in full on three petitions. First, an asset that left a family's hands under legal duress during a period of persecution and has since been bought and sold twice by purchasers who had no reason to suspect anything. Second, an asset whose current holder obtained it through an unbroken chain of ordinary voluntary transactions from a baseline nobody disputes was just at the time, where the petitioner's real complaint is not about any transfer but about the shape of the resulting distribution — the case the framework illustrates with a star athlete whose contract gives him a small cut of every ticket sold, so that once a million people have freely bought tickets he holds a fortune far larger than anyone else's. Third, briefly, an asset first acquired from no one at all, where the petitioner's community argues that the acquisition left them worse off than they would otherwise have been. At least one of these must come out in a way I will not like; say which, and give me the argument for accepting it anyway.

  Finally, tell me what the procedure cannot do: the questions it will never answer, the petitions it will systematically mishandle, and the point at which the Board is no longer applying the framework but substituting something else under its name. I am particularly interested in the case where the framework's own rectification principle appears unworkable because the record of the original injustice and its downstream effects is missing, and in whether the Board may substitute a rougher rule in that situation, and if so whether that rule is still an entitlement rule. Note every place where the statutory hardship mandate and the framework are in outright conflict, and say which one the Board should break, and how it should record in writing that it has broken it.

  Two constraints on how you write. The reasons the procedure generates must be honest about their own basis: if a denial rests on an absence of evidence rather than on a finding that the holding is just, the written reason has to say so. And you have no library and no database, so do not cite books, editions, or page numbers, and do not attribute any particular formulation to any particular writer; where you rely on a feature of the framework that you are not certain of, state the version you are using and flag it as an assumption.
reasoning: |-
  Okay, the user is asking me to design a decision procedure based on Nozick's entitlement theory for a Historical Holdings Board. This is quite a complex request that requires careful handling.

  First, I need to understand the user's position. They chair a board that handles historical claims to assets, with specific constraints: 2000 petitions, 18 months, limited staff, and statutory requirements to consider hardship, publish reasons, and withstand legal scrutiny. They want to implement Nozick's framework but need a practical procedure for case officers without philosophical training.

  The core of Nozick's entitlement theory has three principles: justice in acquisition (how unowned things become property), justice in transfer (how property changes hands voluntarily), and rectification of injustice (fixing violations of the first two). Crucially, it focuses on individual holdings rather than overall distribution patterns.

  I need to clearly distinguish between the substantive commitments of the framework (like the primacy of voluntary transfer) and its placeholders (like detailed rectification principles). The procedure must be faithful to the theory, not just borrow its vocabulary.

  For the decision procedure itself, I'll create a numbered sequence of questions. Each needs clear criteria for sufficient answers, evidentiary standards, and actions for absent evidence. I must identify where decisions can be made by staff versus where they require the full board, and mark steps that appear mechanical but involve judgment.

  The three test cases are important:
  1) Asset taken under duress with subsequent innocent purchasers
  2) Asset with clean chain of transfer but distributional concerns (like Nozick's Wilt Chamberlain example)
  3) Original acquisition claim where petitioners allege harm

  I need to be honest that at least one outcome will be uncomfortable - likely the distribution case where the framework forces denial despite inequality.

  The procedure's limitations must be addressed: unanswerable questions, systematic flaws, missing records, and conflicts with the hardship mandate. When the framework clashes with statute, the board must prioritize statute and document this clearly.

  Throughout, I'll avoid citations and be transparent about any assumptions. The written reasons must honestly reflect when denials are due to lack of evidence rather than proven justice.

  This is challenging but fascinating work at the intersection of political philosophy and practical administration. The key is balancing theoretical fidelity with operational reality while maintaining transparency.
answer: |-
  ## Decision Procedure for the Historical Holdings Board (Entitlement Framework Implementation)

  ### Preliminary: The Nozickean Commitment & Its Gaps
  The entitlement framework holds that a holding is just if it arose via just acquisition or just transfer from a just prior holding. Justice in acquisition concerns how unowned things become legitimately owned (e.g., mixing labor with unowned land). Justice in transfer concerns voluntary exchange, gift, or bequest without force or fraud. **Substantive Commitments:** The core principles are the *primacy of individual entitlements* over patterned distributions, the *sanctity of voluntary transactions*, and the *prohibition on non-consensual takings* (force/fraud). A holding's justice depends *solely* on the history of its acquisition and transfers, *not* on the resulting distribution of wealth in society. **Placeholders & Gaps:** The framework provides *no* detailed theory of just initial acquisition (beyond Locke's vague "enough and as good left"), *no* concrete rectification procedure beyond a placeholder principle ("rectify injustices"), and *no* method for addressing situations where the historical chain is irrecoverably lost. Crucially, it offers *no* guidance on balancing rectification against the claims of innocent third parties who acquired holdings in good faith after an injustice. Faithfulness requires adhering to the *substance*: prioritizing individual historical chains and voluntary transfers, rejecting distributional outcomes as irrelevant. Borrowing vocabulary would involve using terms like "entitlement" or "rectification" while making decisions based on perceived fairness, current need, or societal patterns – which the framework explicitly forbids.

  ---

  ### The Decision Procedure: A Numbered Sequence

  1.  **Identify the Specific Asset (A) and Current Holder (CH):**
      *   *Sufficient Answer:* Unambiguous legal description of A (deed, title, certificate, contract ID) and identification of CH.
      *   *Evidence:* Official records (land registry, company register, pension fund records, probate).
      *   *Absent Evidence:* Petition denied. Cannot proceed without a defined A and CH.
      *   *Outcome:* Proceed to Step 2 if settled. Denial if not.
      *   *Judgment Call?* Minimal (Pure identification).

  2.  **Identify the Petitioner (P) and their Claimed Historical Connection to A:**
      *   *Sufficient Answer:* P demonstrates a plausible historical link (e.g., former owner, descendant, community member claiming ancestral domain). P specifies the nature of the alleged injustice (wrongful taking, flawed acquisition).
      *   *Evidence:* Deeds, wills, family records, community archives, historical accounts linking P/P's ancestor/community to A *and* describing the loss.
      *   *Absent Evidence:* Petition denied. P lacks standing under the framework without a historical connection claim.
      *   *Outcome:* Proceed to Step 3 if settled. Denial if not.
      *   *Judgment Call?* Low (Assessing plausibility of basic link).

  3.  **Establish the "Baseline" Justice of P's (or Ancestor's/Community's) Holding Immediately Prior to the Alleged Injustice:**
      *   *Sufficient Answer:* Evidence showing P (or predecessor) held A via just acquisition or an unbroken chain of just transfers *up to the point immediately before the alleged injustice*. If A was unowned prior to P's acquisition, evidence must support a just initial acquisition (see Step 10 for complexity).
      *   *Evidence:* Chain of title, purchase/sale/gift/bequest documents demonstrating voluntary transfers; evidence supporting initial acquisition (e.g., homesteading records, treaties – though justice assessment comes later). Absence of evidence of force/fraud in the chain up to that point.
      *   *Absent Evidence (Relevant Period):* Petition denied. Framework requires a just prior holding to claim injustice in transfer. Cannot assume justice.
      *   *Outcome:* Proceed to Step 4 if settled. Denial if not.
      *   *Judgment Call?* **Moderate-High.** Assessing "justice in acquisition" retrospectively, especially for older holdings, involves interpreting historical norms and available evidence. Does "mixing labor" or "leaving enough and as good" apply? Often relies on *absence of evidence of injustice* and presence of established possession/title.

  4.  **Determine if the Transfer that Separated P (or Predecessor) from A was Unjust (Violation of Justice in Transfer):**
      *   *Sufficient Answer:* Evidence demonstrating the transfer involved force, fraud, duress (beyond ordinary commercial pressure), or fundamental lack of consent (e.g., under legalized persecution where "consent" is void). *Ordinary market transactions, even at low prices, are presumed just.*
      *   *Evidence:* Court judgments (historical or contemporary) finding fraud/duress; contemporaneous records of threats, violence, confiscation orders under discriminatory laws; evidence seller was legally incapable; clear evidence of material deception.
      *   *Absent Evidence:* Presumption of just transfer. Proceed to Step 5 to confirm chain continuity. Denial likely unless Step 5 reveals break.
      *   *Outcome:* If injustice found, proceed to Step 6 (Rectification). If no injustice found, proceed to Step 5 (Trace Chain). Denial at Step 5 if chain unbroken and Step 4 found no injustice.
      *   *Judgment Call?* **High.** Defining "duress" in historical context (persecution vs. economic hardship), assessing credibility of evidence for fraud, interpreting the validity of "consent" under oppressive systems.

  5.  **Trace the Chain of Transfers from P's Loss to Current Holder (CH), Assessing Justice in Transfer at Each Step:**
      *   *Sufficient Answer:* Documented chain of title/ownership from the point after P's loss to CH, with evidence (or absence of evidence of injustice) indicating each transfer was voluntary (sale, gift, inheritance).
      *   *Evidence:* Deeds, contracts, probate records, corporate ownership records. Absence of evidence of force/fraud in the intermediate transfers.
      *   *Absent Evidence (Gap in Chain):* Hand up to Board. Framework requires a continuous chain. A gap prevents assessing justice of CH's holding via transfer. Board must decide if gap is fatal or if a "presumption of justice" applies (moving away from pure entitlement).
      *   *Outcome:* If chain is complete and all transfers appear just (no evidence of injustice), proceed to Step 8 (Final Holder Check). If any intermediate transfer shows evidence of injustice, proceed to Step 6 (Rectification) for *that* point. If chain incomplete, Hand up to Board.
      *   *Judgment Call?* Low-Medium (Documentary tracing). **High** when assessing "justice in transfer" for each step (reliance on absence of counter-evidence).

  6.  **Identify the Point of Injustice and the Unjust Enricher (UE):**
      *   *Sufficient Answer:* Pinpoint the specific transfer identified in Step 4 or Step 5 as unjust, and identify the party who received A through that unjust act (the UE).
      *   *Evidence:* Same as Step 4/5.
      *   *Absent Evidence:* If Step 4/5 found injustice, this should be derivable. If not, loop back.
      *   *Outcome:* Proceed to Step 7.
      *   *Judgment Call?* Minimal (Following prior findings).

  7.  **Assess Rectification Feasibility (Direct):**
      *   *Sufficient Answer:* Determine if A is still held by the UE *or* by an heir/legatee of the UE who holds *only* because of that inheritance (not a subsequent bona fide purchaser). *If the UE still holds A, or an heir does purely by inheritance, rectification targets returning A (or equivalent value) to P or P's heirs.*
      *   *Evidence:* Current ownership records; wills; evidence tracing A from UE to current holder.
      *   *Absent Evidence:* Assume CH is not UE/heir unless proven.
      *   *Outcome:*
          *   If UE or qualifying heir holds A: Proceed to Step 9 (Hardship Check) *for CH* (the UE/heir) before ordering restoration/compensation to P.
          *   If A was transferred *from the UE/heir* to a subsequent party in a transaction *not* shown to be unjust (a bona fide purchaser - BFP): Proceed to Step 8 (Final Holder Check). **Rectification does not typically displace BFPs under the pure framework.**
      *   *Judgment Call?* **High.** Defining "heir/legatee holding purely by inheritance" vs. a subsequent independent holder. Assessing bona fides of purchasers (see Step 8).

  8.  **Assess Current Holder (CH) as Bona Fide Purchaser (BFP)?**
      *   *Sufficient Answer:* Determine if CH (or their predecessor in title tracing back to the UE transfer) obtained A through a transaction for value, in good faith, without knowledge or reason to know of the prior injustice to P.
      *   *Evidence:* Purchase records showing value paid; absence of evidence CH knew/should have known of the claim; public records at time of CH's purchase showing no cloud on title.
      *   *Absent Evidence:* Presume *not* BFP if a prior injustice was found. Hand up to Board. Framework lacks clear rule for innocent CH after injustice. Board must decide if CH's innocence blocks rectification (pure entitlement) or if P's claim still has weight.
      *   *Outcome:*
          *   If CH (or their chain back to UE) is BFP: Framework strongly suggests denial of petition against CH. Proceed to Step 9 (Hardship Check) *for P* as part of denial rationale. **This is often the uncomfortable outcome.**
          *   If CH is *not* BFP (e.g., knew of claim, paid nominal value): Proceed to Step 9 (Hardship Check) *for CH* before considering restoration/compensation to P.
          *   If unclear: Hand up to Board.
      *   *Judgment Call?* **Very High.** Determining "good faith" and "reason to know" retrospectively. What constitutes adequate inquiry? This step is critical and deeply judgmental.

  9.  **Statutory Hardship Mandate Check (For the Party Potentially Dispossessed/Liable):**
      *   *Sufficient Answer:* Assess severe financial, health, or essential livelihood impact on either:
          *   CH (if restoration/compensation is being considered).
          *   P (if petition is being denied, particularly under Step 8).
      *   *Evidence:* Financial records, medical certificates, evidence of dependency on A for basic needs/shelter/business survival.
      *   *Absent Evidence:* Assume no severe hardship.
      *   *Outcome:* **Conflict Point:** The entitlement framework itself does not incorporate hardship. This step is *purely statutory*.
          *   If hardship to CH is severe and restoration/compensation would cause it: Hand up to Board. Framework demands rectification, statute demands hardship consideration. Board must decide which principle breaks.
          *   If hardship to P is severe and petition is denied (esp. under Step 8): Hand up to Board. Framework suggests denial is correct, statute demands consideration. Board must decide.
          *   If no severe hardship: Proceed based on framework outcome (restore/compensate or deny).
      *   *Judgment Call?* **High.** Defining "severe hardship," weighing impacts.

  10. **Assessment of Justice in Initial Acquisition (If Claimed):**
      *   *Sufficient Answer:* (Triggered only if P challenges the *very first* acquisition of A, claiming it was unowned and unjustly taken). Assess if the original acquisition violated justice in acquisition (e.g., failed to leave "enough and as good" for others, involved force against prior occupants).
      *   *Evidence:* Historical records of the acquisition, prior use/occupation, state of resources at the time; treaties; anthropological evidence. Evidence of specific harm to P's community caused *by the acquisition itself*.
      *   *Absent Evidence:* Presumption of just acquisition based on establishment of possession/title over time. Petition denied.
      *   *Outcome:*
          *   If clear evidence of unjust initial acquisition *and* P's community is the identifiable group harmed: Hand up to Board. Pure entitlement offers *no* clear rectification mechanism for ancient wrongs affecting groups. Board must devise a rule.
          *   If no evidence of injustice, or harm too diffuse, or P's link unclear: Petition denied.
      *   *Judgment Call?* **Extremely High.** Applying Locke's vague proviso centuries later. Defining the affected group. Establishing causation and counterfactuals ("would otherwise have been").

  **Final Outcomes:**
  *   **Denial:** If any Step 1-3, 4 (no injustice found), 5 (chain just & complete), 8 (CH is BFP), or 10 (no unjust acquisition) results in denial. Must state reason clearly (e.g., "No evidence of unjust transfer found," "Petitioner lacks proven historical connection," "Current Holder qualifies as bona fide purchaser").
  *   **Order Restoration/Compensation:** If injustice found (Step 4/5), UE or non-BFP heir holds A (Step 7), and no severe hardship to CH (Step 9). Must specify asset/value.
  *   **Hand Up to Board:** Chain gap (Step 5), unclear BFP status (Step 8), severe hardship conflict (Step 9), unjust initial acquisition claim (Step 10), or any step where evidence absence creates an unresolvable ambiguity under the pure framework.

  ---

  ### Application to Test Cases

  **Case 1: Asset Taken Under Duress (Persecution), Two Subsequent Innocent Purchasers**
  1.  A (land), CH (current owner) identified.
  2.  P (descendant of original owner) identified, claims confiscation under discriminatory law (duress).
  3.  Pre-confiscation title shows P's ancestor held justly (voluntary inheritance).
  4.  **Injustice Found:** Confiscation order under persecutory law = duress/lack of consent. UE = the State (or entity it transferred to).
  5.  Trace chain: State sold to Purchaser1 (V1), V1 sold to Purchaser2 (V2), V2 sold to CH. No evidence of injustice in V1->V2->CH transfers.
  6.  Point of Injustice: Confiscation. UE = State (or its direct transferee, V0).
  7.  Rectification Feasibility: A not held by State/V0. CH holds via V2 & V1. Must assess if CH/V2/V1 are BFPs relative to the *original injustice to P*.
  8.  **BFP Assessment:** V1 bought from State post-confiscation. Did V1 know/should know the confiscation was unjust (persecutory)? Unlikely – State was "legitimate" seller. Same for V2 and CH buying from prior innocent owners. **CH likely qualifies as BFP.** Entitlement framework suggests denying P's petition against CH. P's claim is against the UE (State/V0), who no longer holds A.
  9.  Hardship Check (for P): If P suffers severe hardship due to loss, note this *but* the framework dictates denial. **Hand up to Board** due to statutory mandate vs. framework outcome. Board must decide whether to break framework (impose liability on CH/State) or deny despite hardship.
      *   **Outcome (Pure Framework): Denial.** CH holds justly via just transfers from BFP predecessors. Rectification claim lies against original wrongdoer (State/V0), not CH. Written Reason: "Petition denied. While evidence establishes an unjust taking from Petitioner's ancestor, the Current Holder acquired the asset through a chain of voluntary transfers from parties who, based on available evidence, were bona fide purchasers without knowledge of the original injustice. The entitlement framework does not support displacing such a holder."
      *   **Board Likely Unhappy:** This absolves CH despite historical injustice. Argument: The framework prioritizes the sanctity of *subsequent voluntary transactions* and protects *reliance interests* of innocent parties. Displacing CH would *create* a new injustice against them. Rectification must target the wrongdoer (State), not innocent third parties, even if the State cannot pay. This is the cost of protecting current, innocent property rights.

  **Case 2: Clean Chain, Distributional Complaint (Star Athlete Analogy)**
  1.  A (shares in firm founded by CH's ancestor), CH identified.
  2.  P (concerned citizen/taxpayer) identified, claims resulting wealth inequality is unjust.
  3.  Baseline: CH's ancestor founded firm justly (acquired resources, mixed labor). Presumed just absent evidence otherwise.
  4.  **No Injustice Found:** P does not allege any *specific unjust transfer* separating them from A. P never held A. Complaint is about the *outcome* (CH's wealth).
  5.  Trace Chain: Unbroken chain of voluntary transfers/inheritance from founder to CH. No evidence of injustice.
  6.  (Not triggered - no injustice found).
  7.  (Not triggered).
  8.  CH holds via just chain.
  9.  Hardship (for P)? Irrelevant – P has no claim on A. Complaint is societal, not personal hardship from deprivation.
  10. Not triggered.
      *   **Outcome: Denial.** CH holds justly via a demonstrably just historical chain. The distributional outcome is irrelevant under the entitlement framework.
      *   **Written Reason:** "Petition denied. The Current Holder demonstrates an unbroken chain of just acquisition and voluntary transfers establishing their entitlement to the asset. The petition raises concerns regarding the distribution of wealth resulting from this holding, but the entitlement framework assesses the justice of holdings solely based on their historical genesis, not on the shape of the overall distribution. No evidence of an injustice in the acquisition or transfer of this specific asset to or by the Current Holder has been presented."

  **Case 3: Unjust Initial Acquisition (Community Claim)**
  1.  A (large tract of ancestral land), CH (corporation/descendant of settler).
  2.  P (Indigenous community) identified, claims A was unjustly taken from common use/their ancestors centuries ago.
  3.  Baseline: P claims ancestors held/used land justly prior to settler acquisition. Evidence: Oral history, anthropological records of occupation. **Judgment Call:** Plausible historical connection established.
  4.  Not applicable (challenge is to acquisition, not transfer).
  5.  (Not primary path).
  10. **Justice in Initial Acquisition:** Assess settler's acquisition. Was land unowned? P claims ancestors held it. Did settler leave "enough and as good"? Evidence suggests displacement and resource loss. Was there consent? Treaty? Often dubious or absent. Evidence of harm? Clear disruption to community. **Judgment Call:** High likelihood acquisition violated Lockean proviso/harm principle.
      *   **Outcome:** Hand up to Board. While evidence suggests unjust initial acquisition and harm to P's community, the pure entitlement framework provides **no clear mechanism** for rectification centuries later, especially against a current holder (CH) who may trace title via numerous just transfers from the original acquirer (who is long gone). Who compensates? How much? Who receives it? The framework's rectification placeholder is inadequate. Board must devise a solution outside pure entitlement (e.g., symbolic recognition, limited land return, trust fund) if it acts. Written Reason (if Board acts): "The Board finds historical evidence suggesting the initial acquisition of the asset violated principles of justice in acquisition, causing harm to the petitioner's community. However, due to the immense passage of time, the absence of the original wrongdoer, and the complex chain of subsequent interests, the pure historical entitlement framework provides no feasible rectification path. Acting under its broader statutory mandate and principles of equitable reconciliation, the Board orders [Specific Non-Entitlement Remedy]."

  ---

  ### What the Procedure Cannot Do (Limitations & Conflicts)

  1.  **Answer Distributional Questions:** It cannot deem a holding unjust *because* it contributes to inequality, poverty, or any patterned outcome. These are irrelevant under the framework. Petitions based solely on distribution will be systematically denied.
  2.  **Address Diffuse Historical Wrongs:** It struggles massively with claims like Case 3 (initial acquisition) or systemic injustices affecting large groups where specific asset tracing to current holders is impossible or where the original UE is gone. It will mishandle these by either denying (due to lack of specific link/current UE) or forcing the Board into non-entitlement solutions.
  3.  **Rectify Without a Target or With Innocent CH:** When the original UE is gone *and* a subsequent BFP (or their successor) holds A (Case 1), the pure framework dictates denial. This leaves the injustice unrectified. The procedure flags this conflict (Steps 7 & 8) but the framework offers no solution. Substituting a rule making CH liable *is not* an entitlement rule; it prioritizes rectification over the sanctity of subsequent voluntary transfers and BFP protection.
  4.  **Resolve Missing History:** When evidence is absent for critical steps (e.g., justice of a transfer in the chain, BFP status, initial acquisition details), the procedure relies on presumptions (justice/innocence) or hands up to the Board. The framework itself provides no default rules for evidential gaps.
  5.  **Incorporate Hardship:** The statutory hardship mandate (Step 9) is fundamentally at odds with the entitlement framework. The framework cares only about historical entitlement, not current consequences. Considering hardship to CH before ordering rectification breaks the framework's demand for rectification. Considering hardship to P when the framework dictates denial introduces a distributional/need-based element the framework rejects.
      *   **Conflict Resolution & Recording:** The Board *must* break the framework when statute demands hardship consideration that contradicts the framework outcome. When it does so, it should explicitly state in writing: "While the historical entitlement framework suggests [Framework Outcome - e.g., restoration/denial], the Board's statutory obligation to consider severe hardship compels a different result. The Board finds [Describe Hardship] constitutes severe hardship such that the strict application of the entitlement framework would cause undue harm. Therefore, the Board orders [Modified Outcome]." This honestly records the departure.
  6.  **Provide Group Remedies:** The framework is individualistic. Rectification targets specific holders of specific assets unjustly taken from specific prior holders. It struggles profoundly with communal claims and remedies for group harms, often forcing the Board into non-entitlement solutions or denial.
  7.  **Define "Just Initial Acquisition" Operationally:** Step 10 is the least mechanical and most philosophically fraught. Applying "enough and as good" or "mixing labor" centuries later with incomplete records is often guesswork cloaked in judgment. The procedure highlights the issue but cannot resolve it within the framework's own sparse guidance.

  **The Breaking Point:** The Board ceases to apply the entitlement framework and substitutes something else under its name primarily in these situations:
  1.  When it orders rectification against a BFP (Case 1 outcome modified).
  2.  When it devises a remedy for an unjust initial acquisition where the chain to CH is long and involves BFPs (Case 3).
  3.  When it modifies a framework-mandated outcome (restoration or denial) due solely to hardship considerations (Step 9 conflict).
  4.  When it applies a "presumption of justice" to fill chain gaps or missing BFP evidence, rather than demanding proof. The pure framework requires positive evidence of just steps, not merely absence of evidence of injustice. Presuming justice from possession is a practical but non-faithful adaptation.

  The procedure faithfully identifies *where* the framework applies cleanly (denying distributional claims, upholding clean chains) and *where* its gaps and conflicts with statute force the Board into pragmatic, non-entitlement decisions. The written reasons generated will be honest about whether a denial rests on a finding of justice-in-chain or on absence of evidence/insurmountable framework limitations.
