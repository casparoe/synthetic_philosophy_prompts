  ### Proposal: Verifiability vs. Context-Freedom in Factored Cognition  
  **A 3-Month Self-Directed Project**  

  ---

  #### **1. Core Question**  
  **Does the safety of HCH/factored cognition critically depend on the verifiability of sub-question answers (i.e., the question-asker’s ability to judge answer quality), while the context-free assumption is merely a convenience?**  
  This question has a determinate answer: We will produce a **causal map** showing which safety arguments collapse when verifiability is relaxed, versus when context-freedom is relaxed. If verifiability relaxations invalidate >80% of key safety arguments while context-freedom relaxations invalidate <20%, the hypothesis is confirmed.  

  #### **2. Why Existing Work Doesn’t Settle This**  
  - The literature (Christiano et al.) treats HCH as an **idealized black box**: Descriptions assume both verifiability and context-freedom hold, without stress-testing their individual roles.  
  - Safety arguments (e.g., "HCH avoids goal distortion via decomposition") are **not modularized**: Assumptions aren’t isolated, so it’s unclear which are foundational vs. auxiliary.  
  - No systematic work **relaxes assumptions independently** to test failure modes (e.g., "What if sub-answers are unverifiable but self-contained?").  

  #### **3. Methodology: Week-by-Week Plan**  
  *(10–15 hrs/week; analytical work only)*  

  | **Week** | **Activity** | **Output** |
  |----------|--------------|------------|
  | 1–2      | **Deconstruct HCH’s assumptions** from key papers (Christiano, Garrabrant, etc.). Explicate 5 core claims: <br> (A1) Verifiability: Question-askers can detect bad sub-answers. <br> (A2) Context-freedom: Sub-tasks require no external context. <br> (A3) Honest sub-agents: No adversarial sub-question answering. <br> (A4) Decomposability: Any task can be split into sub-tasks. <br> (A5) Compositionality: Correct sub-answers imply correct final answer. | List of explicit assumptions with sources. |
  | 3–5      | **Relax each assumption independently** and trace impacts: <br> - *Verifiability relaxation*: Sub-answers are ambiguous or misleading; asker can’t judge quality. <br> - *Context-freedom relaxation*: Sub-tasks require unstated context (e.g., tacit knowledge). <br> - *Baseline*: Full HCH with all assumptions intact. <br> For each, test against 3 safety arguments: <br> (1) Prevents goal drift in recursive amplification. <br> (2) Avoids catastrophic compounding errors. <br> (3) Preserves human oversight at scale. | Table mapping assumption relaxations to weakened/invalidated safety arguments. |
  | 6–8      | **Identify load-bearing dependencies**: For each safety argument, determine which assumptions are necessary/sufficient. <br> - *Example*: If "prevents goal drift" fails when A1 is relaxed but holds when A2 is relaxed, A1 is load-bearing for that argument. | Dependency graph showing which assumptions underpin each safety claim. |
  | 9–10     | **Develop edge cases**: Create thought experiments probing the boundaries of verifiability and context-freedom (e.g., "Can a non-expert verify a technical sub-answer?"). | 3–5 edge cases demonstrating critical failure modes. |
  | 11–12    | **Synthesize results**: Quantify how many safety arguments depend primarily on verifiability vs. context-freedom. Finalize the causal map. | Draft report with: <br> - Confirmed/refuted hypothesis. <br> - Risk hotspots (e.g., "Unverifiable answers break 4/5 safety properties"). |

  #### **4. What Constitutes a "Real Result" vs. Failure**  
  - **Success**: A defensible causal map showing:  
    - Verifiability is load-bearing if >70% of safety arguments fail when it’s relaxed.  
    - Context-freedom is non-load-bearing if <30% of arguments fail when relaxed.  
    *Output*: A framework for prioritizing robustness work (e.g., "Focus on verifiability tools").  
  - **Failure Modes**:  
    - *Inconclusive*: Safety arguments are equally sensitive to both relaxations (hypothesis unsupported).  
    - *Overwhelming interdependence*: Assumptions can’t be isolated (e.g., relaxing context-freedom inherently breaks verifiability).  
    - *Theoretical dead end*: Existing literature is too vague to map (unlikely, given HCH’s well-documented structure).  

  #### **5. Feasibility (3 Months, Solo, No Lab)**  
  - **Realistic because**:  
    - Inputs are public alignment literature (Arxiv, LessWrong) + analytical reasoning.  
    - No novel experiments needed—only systematic deconstruction of existing ideas.  
    - Output is a conceptual model, not empirical data.  
  - **Risks and mitigation**:  
    - *Scope creep*: Strict focus on verifiability/context-freedom (exclude e.g., sub-agent coordination).  
    - *Ambiguity in sources*: Define "safety argument" strictly (use direct quotes from established work).  
  - **Deliverable**: A 10-page report with:  
    > (a) Assumption taxonomy,  
    > (b) Relaxation impact table,  
    > (c) Dependency graph,  
    > (d) Hypothesis verdict.  

  ---

  #### **6. Conclusion**  
  This project addresses a gap in AI alignment: **which idealized assumptions in factored cognition are safety-critical**. By methodically relaxing verifiability and context-freedom, we’ll show whether real-world HCH implementations should prioritize answer-validation tools (if verifiability is load-bearing) or context-augmentation (if context-freedom is). The approach is feasible in 3 months via focused analysis of existing literature—no lab or new data required.  

  ---  
  *Approval recommended?* ✅  
  *Impact*: Clarifies engineering priorities for safe, scalable AI systems.
