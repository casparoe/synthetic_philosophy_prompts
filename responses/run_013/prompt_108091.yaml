  **Proposal: The Load-Bearing Assumptions in Factored Cognition: Verifiability vs. Context-Freedom**

  **1. Introduction and Motivation**

  Factored cognition, and specifically the Humans Consulting HCH (HCH) model, is a promising approach to scalable AI alignment. It involves decomposing complex questions into trees of smaller, more manageable sub-questions, which are then answered by copies of the original agent (or human) and composed back into a final answer. This model is often idealized: sub-questions are assumed to be small, context-free, and their answers are assumed to be easily verifiable by the question-asker. However, the real-world applicability and safety of this model depend on understanding which of these assumptions are critical (load-bearing) and which are merely convenient simplifications. 

  This project aims to investigate the hypothesis that the verifiability of sub-question answers (i.e., the ability of the question-asker to judge the correctness of the answer) is the essential, load-bearing component for safety, while the context-free nature of sub-tasks is a non-essential convenience that can be relaxed without compromising safety. 

  **2. Core Research Question**

  In the HCH model of factored cognition, is the verifiability of sub-question answers the essential load-bearing component for ensuring the overall safety and reliability of the system, while the context-free nature of sub-tasks is a non-essential convenience?

  **3. Why Existing Work Does Not Settle This**

  Existing literature on factored cognition (e.g., Christiano 2018, and subsequent discussions) typically assumes the idealized model without explicitly testing the necessity of each assumption. The safety arguments built on this model are not stress-tested against relaxation of the assumptions. There is no systematic account of which assumptions are necessary for which safety properties.

  **4. Methodology and Plan**

  The project will be conducted over 3 months (part-time, approximately 10-15 hours per week) and will proceed as follows:

  - **Weeks 1-2: Explicate Assumptions**  
    Write down the explicit assumptions of the standard HCH model, focusing on:
    - A1 (Verifiability): The question-asker can reliably evaluate the quality of an answer to a sub-question.
    - A2 (Context-Freedom): Each sub-question is self-contained and requires no external context beyond what is provided.
    - A3 (Decomposability): Any complex question can be broken down into a tree of human-scale sub-questions.
    - A4 (Compositionality): The answers to sub-questions can be composed to form a correct answer to the original question.

  - **Weeks 3-8: Relax Assumptions and Analyze Dependencies**  
    For each assumption, relax it and analyze the impact on safety arguments. For example:
    - Relax A2 (Context-Freedom): Allow that sub-questions might require external context. Does the system remain safe? How does this affect verifiability (A1)?
    - Relax A1 (Verifiability): Consider cases where the question-asker cannot judge the answer. Does this lead to catastrophic failures? 
    - Track which safety arguments (e.g., robustness, scalability, avoidance of catastrophic misalignment) depend on which assumptions.

  - **Weeks 9-10: Case Studies**  
    Develop thought experiments to illustrate the consequences of relaxing assumptions. Examples:
    - A sub-question that is ambiguous without context leads to a misinterpretation. Can the system recover?
    - A sub-question answer is too technical to verify, leading to a bad answer propagating. How bad is the outcome?

  - **Weeks 11-12: Synthesis and Report Writing**  
    Draw conclusions about the load-bearing nature of each assumption. Specifically, test the hypothesis that A1 (Verifiability) is essential and A2 (Context-Freedom) is not. Compile findings into a report.

  **5. Expected Outcomes and Success Criteria**

  - **Success**: A clear account of which assumptions are critical for the safety of HCH and which are not. Specifically, we will have:
    - Confirmed or refuted the hypothesis about verifiability being load-bearing and context-freedom being non-essential.
    - A set of conditions under which HCH remains safe even when assumptions are relaxed.
    - A list of potential failure modes when critical assumptions are violated.
  - **Failure**: The project fails if:
    - The assumptions are too interdependent to isolate their effects.
    - The analysis does not yield clear conclusions about the criticality of the assumptions.

  **6. Feasibility**

  This project is analytical and requires only reading, reasoning, and writing. No experiments or lab are needed. The scope is limited to a few key assumptions and can be completed in 3 months part-time by one person.

  **7. Conclusion**

  By systematically testing the assumptions of the HCH model, this project will contribute to a more robust understanding of factored cognition and its applicability to AI alignment. The results will inform future research and design of safe AI systems.
