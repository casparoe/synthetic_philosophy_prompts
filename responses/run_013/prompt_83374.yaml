  Okay, the user is a novelist working on a book about a siege and is stuck on a concept. They’ve described a specific type of defeat that becomes a foundational national myth. Let me unpack their query. They mention examples like the Alamo, Masada, Dunkirk, and the Confederacy. Their key points are: the participants knew it was hopeless, the stand was militarily pointless, and they weren’t doing it for future memory. The twist is that the cause must be completely lost for the memory to become sacred.

  First, I need to figure out if there’s a specific term for this. The user mentioned "lost cause," but they think it’s different because it’s about grievance rather than a finished, glorified defeat. They also ruled out "martyr" and "tragedy" as too narrow. So, I should check academic terms. I recall "myth of sacrifice" or "heroic last stand," but those might be too broad. Maybe "foundational defeat" or "sacrificial myth"?

  The user’s deeper need might be understanding the mechanics of this phenomenon to write authentically. They want to know if it can be manufactured, if it requires a nation, and whether cynicism affects it. They also wonder about redeemed vs. unredeemed defeats. 

  Looking at academic concepts, Jay Winter’s work on remembrance and cultural memory comes to mind. The idea that defeats become sacred when they symbolize resistance against extinction. Also, Anthony D. Smith’s ethnosymbolism, where such events form national identity. Terms like "Catastrophic National Founding" or "Sacrificial Foundational Myth" might fit. 

  The user’s hunch about it not being manufacturable seems valid. If it’s premeditated, it loses authenticity. Dunkirk succeeded because of the evacuation, not the stand itself. The Confederacy’s "Lost Cause" was manufactured but had elements of denial, not acceptance of defeat. 

  For redeemed vs. unredeemed, Dunkirk’s redemption through evacuation makes it different from Masada’s total loss. The irredeemable nature makes the sacrifice purer. 

  Scale-wise, it can apply to groups, but national scale amplifies it. Cynicism among participants doesn’t matter; it’s the later myth-making that counts. 

  Counterexamples: Most attempts to manufacture fail unless there’s an organic kernel. The user’s insight about authenticity is key. Historical cases like the Charge of the Light Brigade were initially criticized but later romanticized, showing how narrative can reshape perception. 

  In conclusion, there’s no single term, but the concept is valid. The novelist should focus on the defeat’s role in identity formation, the necessity of total loss, and the organic growth of the myth. Providing structured criteria and examples will help them integrate this into their story.
answer: |-
  You've hit upon a profoundly real and powerful phenomenon, and your instincts about its core characteristics are razor-sharp. **There isn't a single, universally accepted academic term *exclusively* for this specific constellation of factors**, but you've described it so precisely we can carve out the essence and find the closest conceptual neighbors. What you're describing is a **Sacrificial Foundational Myth** or a **Catastrophic National Founding**.

  Here's the breakdown, addressing your specific points:

  1.  **The Core Phenomenon:**
      *   **Essence:** A militarily doomed, existentially defiant last stand, undertaken without expectation of strategic gain or posterity, that later becomes the *sacred core* of a group's identity precisely *because* of its totality, hopelessness, and perceived purity of sacrifice. It transforms defeat into the ultimate proof of commitment and the seed of future resurrection/national consciousness.
      *   **Why No Single Term?** Academics often discuss *components*: collective memory, nationalism, martyrdom, heroic failure, cultural trauma, myth-making. Your specific combination is recognized but usually subsumed under broader categories like "national myth" or "foundational narrative." Your constraints make it distinct.

  2.  **Carving Out the Phenomenon: What It Is & Isn't:**
      *   **IS:**
          *   **Hopelessness Known:** Participants understood the likely fatal outcome. This creates authenticity and heightens the sacrifice.
          *   **Militarily Pointless:** No tangible, immediate strategic objective was achieved *by the stand itself*. Its value is purely symbolic, *post hoc*.
          *   **Authentic Motive:** Participants acted on immediate loyalties (comrades, duty, honor, defiance, fatalism), not calculation for future glory. This perceived purity is crucial for the myth's power.
          *   **Total, Unredeemed Loss:** The cause they fought for *died with them* in that moment/soon after. No immediate victory avenged it. This finality makes the sacrifice absolute and untarnished.
          *   **Symbol of National Birth/Resurrection:** It becomes the foundational story *defining* the group ("This is who we are: people who sacrifice everything for the idea of X"). It fuels future identity and resistance. The *memory* is the victory.
      *   **IS NOT:**
          *   **"Lost Cause" (Confederate Model):** While related, the Lost Cause actively *denies* the totality of defeat ("We were right, outnumbered, noble, defeated but not wrong"). It's a grievance narrative fostering resentment. Your phenomenon *embraces* the totality of defeat as proof of ultimate commitment ("We knew we'd lose, we died *for* the idea anyway"). It's about sacrifice, not denial.
          *   **Martyr Complex (Individual):** Focuses on an individual's sacrifice for belief. Your phenomenon is collective and becomes the bedrock of group identity.
          *   **Tragedy (Literary):** While tragic, this is about a specific narrative structure. Your phenomenon is about real-world historical memory shaping identity.
          *   **Redemptive Defeat (Dunkirk):** Dunkirk is a crucial borderline case. It *was* perceived as hopeless *during* the evacuation (*"Fight to the last man"* orders were given initially). It *was* militarily catastrophic (loss of equipment, retreat). BUT: It succeeded in saving the army, became a rallying cry *for eventual victory*, and wasn't the end of the British cause. It's a "Hopeless Stand Redeemed," fitting some criteria but not the *total, unredeemed loss* essential for the pure form. Dunkirk is about survival leading to victory; Alamo/Masada are about death fertilizing identity.
          *   **Heroic Last Stand (General):** A broader category encompassing Thermopylae (which *was* strategically intended to delay) or Rorke's Drift (which *succeeded* defensively). Your phenomenon is a specific *subset*: hopeless, pointless, yet foundationally mythic.

  3.  **Addressing Your Specific Questions:**
      *   **Redeemed vs. Unredeemed (Dunkirk vs. Masada):** This split is **crucial**. The "Sacrificial Foundational Myth" requires **unredeemed loss**. Dunkirk is inspirational, but it's part of a victory narrative. Masada/Alamo/Kosovo Field (1389) are defeats where the *political entity died* (Judea, Texas Republic, Medieval Serbian Empire). The *irredeemable* nature makes the sacrifice pure and foundational. A redeemed defeat is a "miracle" or "turning point"; an unredeemed defeat becomes a "sacrament."
      *   **Scale (Nation vs. Group):** It **can work for sub-national groups**, but gains its greatest power at the national level. Examples:
          *   *Regiment:* The 300 Spartans (though Thermopylae had strategic intent) / The Lost Battalion (WWI, rescued).
          *   *City:* Numantia (vs. Rome), Saguntum (vs. Carthage) – ancient examples of defiant cities whose destruction became Roman/Hispanic symbols.
          *   *Sect:* The Battle of Karbala (680 AD) for Shia Muslims – the paradigmatic example of hopeless, principled sacrifice against tyranny, defining Shia identity. **Karbala is perhaps the *clearest* and most potent example fitting all your criteria perfectly.**
      *   **Cynicism of Participants:** **It survives, even thrives.** The *myth-making* process after the event filters out cynicism. What matters is the *perceived* motive and the *symbolic* act. Historians might know some defenders were conscripts or mercenaries grumbling, but the myth focuses on the *defiance* and the *sacrifice* itself. The story transcends individual motives. The group projects its *own* values onto the actors.
      *   **Can it be Manufactured? Your Hunch is Largely Correct:** This is the most fascinating part. **Authenticity is key.** A deliberate, pre-meditated "Let's die to be famous" undermines the very purity the myth requires.
          *   **Why Manufacture Usually Fails:** If known, it feels staged, cynical, egotistical. It lacks the desperate authenticity born of genuine, immediate pressure and hopelessness. The sacrifice seems calculated, not primal.
          *   **The "Kernel of Truth" Requirement:** Successful myths *always* need a kernel of genuine defiance and sacrifice to build upon. You can't invent it whole cloth from nothing.
          *   **Counterexample? (Debatable):** The Charge of the Light Brigade (1854). A military blunder resulting from confused orders, leading to catastrophic losses in a hopeless assault. *At the time:* Widely seen as a tragic blunder, criticized. *Later:* Tennyson's poem ("Theirs not to reason why, Theirs but to do and die") transformed it into a symbol of unquestioning courage and duty in the face of certain death – fitting many of your criteria. However:
              *   Was it *known* to be hopeless *going in*? Likely sensed, but orders were followed.
              *   Was it *pointless*? Absolutely, a disastrous error.
              *   Motive? Duty, obedience (not posterity).
              *   Total loss? For the brigade, yes; the war continued.
              *   **Manufactured?** The *myth* was aggressively manufactured *after* the event (by press, poetry, political need) based on a real, disastrous event driven by incompetence, not deliberate sacrifice. It *became* a foundational myth of British military stoicism *despite* its origins. This shows the power of *later narrative* to reshape an event, **but the initial event itself was NOT a deliberate act of manufactured sacrifice.** It was a blunder that *acquired* mythic status. This is the closest to a counterexample, supporting the idea that while the *sacrifice* can't be cynically pre-planned for myth, the *myth itself* can be deliberately constructed *after* a sufficiently tragic and resonant event occurs organically.

  **Conclusion:**

  You've identified a potent historical and cultural archetype: the **Sacrificial Foundational Myth**. It's defined by:

  1.  **Known Hopelessness**
  2.  **Strategic Futility**
  3.  **Authentic (non-posterity) Motive**
  4.  **Total, Unredeemed Loss** (The core difference from Dunkirk/Light Brigade)
  5.  **Transformation into Foundational Group Identity**

  While lacking a single perfect academic label, terms like **Catastrophic National Founding**, **Sacrificial Foundational Narrative**, or even **Ethnic Martyrdom Complex** capture aspects of it. Karbala is the theological exemplar; Masada and the Alamo are potent secular/national ones. Your insight that it cannot be *cynically manufactured at the time* is fundamentally sound – the authenticity of the hopeless defiance is its vital spark. The *mythmaking* that follows, however, can be highly deliberate and potent, turning catastrophe into sacred identity.

  This is brilliant stuff for a novelist. Focus on the *immediate* desperation, the bonds between characters facing doom, the *absence* of thoughts about future glory, and the sheer, stubborn defiance. The myth will take care of itself in your story's future – and in the reader's mind. Good luck!
