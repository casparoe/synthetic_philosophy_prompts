prompt: |-
  Me and some friends have been going back and forth for weeks about "coherent extrapolated volition" and "idealized preferences" — the whole family of ideas that says what you really want, or what your good actually is, is whatever you'd want if you knew more, thought more clearly, and were less of a mess internally. Trouble is, every time one of us leans on it, someone else says "idealized how?" and we just go in circels, so before we fight about which version is right I want the spec written down. Give me the desiderata that any adequate theory of a person's "real" or idealized preferences has to meet: the cases it has to get right, the distinctions it can't be allowed to collapse, the stuff it has to stay consistent with, and the reason behind each requirement. Then tell me which of those requirements are non-negotiable and which are just house rules of one camp, which single one does the most to kill off the versions people actually defend, and flag any two that I probably can't have at the same time.

  I care about this for a concrete reason: I'm trying to work out when it's legitimately OK to override what someone says she wants, for her own good, so the theory needs to be good enough to license or forbid real paternalism, not just to look nice on a chalkbord. So please make it survive the four cases I keep getting stuck on. (1) The person whose idealized self would want to be someone else entirely — different values, different projects, even a different name — is that still her preference, or did the idealization quietly swap in a stranger? (2) The procedure problem: the answer comes out different depending on whether you idealize by adding information, by demanding internal coherence, by demanding reflection, or by simulating decades of therapy, and there doesn't seem to be a fact of the matter about which one is the real idealization. (3) The person whose actual, non-idealized preference is to not be idealized at all — she thinks the whole exercise is creepy and violates her; does the theory have to respect that, and can it? (4) The cult member or the addict whose "better-informed, more coherent" self still endorses the life we're all sure is ruining her. Anyway — lead with your bottom line in the first sentence, then give the reasoning, no preamble and don't restate my question.
reasoning: |-
  Okay, let me tackle this user's query about coherent extrapolated volition and idealized preferences. The user wants desiderata for any theory of "real" preferences, focusing on when paternalism is justified. They provided four challenging cases that the theory must handle.

  First, I need to identify the core requirements. The theory must be identity-preserving to address case (1) where someone wants to be another person. It should respect the agent's continuity, so idealization can't replace them entirely. That's non-negotiable because otherwise, it's not their preferences anymore.

  Next, the theory needs to avoid procedural indeterminacy. Case (2) shows that different idealization methods yield different results. A good theory must specify the procedure or be invariant across methods. But this might be tough—procedures are often debated, so this requirement could be a house rule depending on the camp.

  The theory must also respect the anti-idealization preference (case 3). If someone rejects idealization, the theory shouldn't override that unless it's inconsistent. This is non-negotiable for respecting autonomy. However, it might conflict with other requirements if the refusal itself is irrational.

  For case (4), the theory must allow for false consciousness. Even with more info and coherence, someone might endorse harmful choices. The desideratum here is that idealization should expose hidden contradictions or information gaps. This is non-negotiable to avoid justifying harmful choices.

  Other desiderata include informational sensitivity, coherence, and counterfactual robustness. These ensure that preferences adjust to new info and are consistent. But they might conflict with respecting anti-idealization or procedural clarity.

  The biggest killer requirement is probably the anti-idealization desideratum. Many theories assume idealization is always beneficial, but case (3) challenges that. If a theory can't handle someone rejecting the process, it falls apart.

  The conflicting pair is likely procedural determinacy and identity preservation. Specifying a procedure might lead to outcomes that feel like a different person, violating identity. For example, decades of therapy might change someone beyond recognition.

  The user's concrete concern is paternalism justification. Each requirement must help decide when overriding choices is legitimate. The cases test this: when does idealization truly serve the person versus imposing external values? Balancing these desiderata is key to a theory that's both principled and practical.
answer: |-
  **Bottom line:** Any viable theory of idealized preferences must preserve the agent's identity while resolving internal conflicts and informational gaps, but will struggle to simultaneously satisfy procedural determinacy and respect anti-idealization preferences without risking paternalistic overreach.

  ### Desiderata for an Adequate Theory of Idealized Preferences
  *(Non-negotiable in **bold**; house rules in *italics*)*

  1.  **Identity Preservation (Non-negotiable):** The idealized self must be a *counterfactual extension* of the actual agent, not a replacement.  
      *Why:* Addresses Case (1). If idealization outputs a radically different person (new name, values, projects), it ceases to be *her* preference and becomes an imposition. The "real" preference must be anchored in her actual psychological continuity (memories, core traits, historical attachments). Failure collapses "what she truly wants" into "what a better person would want."

  2.  **Informational Sensitivity (Non-negotiable):** Preferences must be stable under access to complete, relevant, and vividly comprehended information.  
      *Why:* Core to most "idealization" concepts. Resolves ignorance-based mistakes (e.g., smoking without knowing health risks). Handles part of Case (4) – if the addict *truly* understood long-term neural and social consequences, endorsement might change. Must distinguish *knowing facts* from *accepting them emotionally*.

  3.  **Coherence/Consistency (Non-negotiable):** Preferences must be internally consistent (no self-contradictory goals) and means-ends rational (preferring actions that achieve stated goals).  
      *Why:* Resolves akrasia and conflicting desires. Addresses Case (4) – the cult member's idealized self might see the contradiction between her deep need for family (exploited by the cult) and cult actions harming her family. Rules out preferences that undermine themselves.

  4.  **Counterfactual Robustness (Often Non-negotiable):** Preferences should be stable under calm, extended reflection without distorting influences (e.g., acute cravings, panic, hypomania).  
      *Why:* Captures "less of a mess internally." Distinguishes fleeting urges from enduring values. Partially addresses Case (4) – the addict’s craving-driven endorsement isn't robust.

  5.  **Respect for Anti-Idealization Preference (Non-negotiable):** If the agent stably and coherently prefers *not* to have her preferences idealized (Case 3), the theory must respect this as a terminal value *unless* it stems from ignorance/error *about the idealization process itself*.  
      *Why:* To avoid self-defeating authoritarianism. A theory claiming to find "true preferences" that overrides a clear, informed rejection *of the method itself* violates agency. This preference *must* be included in the input constraints.

  6.  *Procedural Determinacy (House Rule):* *Requires specifying a single "correct" idealization procedure (e.g., info-only vs. therapy-simulation).*  
      *Why:* Attempts to resolve Case (2). However, this is often a camp-specific commitment. Many theories are agnostic about *how* you achieve coherence/full info, only caring that you *do*. Insisting on one specific procedure is usually philosophical preference, not a core requirement.

  7.  *Full Self-Knowledge/Transparency (House Rule):* *Includes knowing one's own subconscious motives or "true nature".*  
      *Why:* Favored by some (e.g., therapeutic models). Others argue subconscious drives aren't part of "volition" unless they manifest in coherently endorsable desires post-reflection. Case (2) arises strongly here – "decades of therapy" often implies uncovering hidden motives, which other methods might ignore.

  8.  **Avoids Regressive/Paternalistic Capture (Non-negotiable):** Idealization cannot systematically output the preferences of the theorist, society, or a generic "rational agent" as defaults.  
      *Why:* Prevents smuggling in external values. The output must be justifiably *hers*. Failure here licenses oppressive paternalism disguised as help (e.g., "Your idealized self rejects your 'deviant' lifestyle").

  ### Key Conflicts & Killer Requirements

  *   **The Biggest Killer: Respect for Anti-Idealization Preference (Desideratum 5).** Many popular theories implicitly assume everyone *should* want their preferences idealized. A theory taking Desideratum 5 seriously must either:
      *   Treat the rejection as a core constraint (limiting idealization's scope), or
      *   Prove the rejection is *itself* based on ignorance/incoherence *about the idealization process* – a very high bar prone to circularity. This devastates theories that see idealization as universally applicable.

  *   **The Conflict You Probably Can't Have Simultaneously:**
      *   **Procedural Determinacy (6)** vs. **Identity Preservation (1).** Specifying a *single* rigorous procedure (e.g., "simulate 20 years of cognitive therapy") often leads to an output self so psychologically transformed that it feels like a different person (violating 1). Conversely, insisting on strict identity preservation (no "alien" values) makes it hard to define a *determinate* procedure, as many paths might preserve identity but yield different results (recreating Case 2).

  ### Handling Your Concrete Cases

  1.  **Radical Transformation:** The theory **must** rule this out (Desideratum 1). If the output wants a different name/fundamental values, the procedure has failed. The idealized self must recognizably be *her*, even with revised goals. If core identity *must* change for coherence, the theory is likely illegitimate for *her*.
  2.  **Procedure Problem:** A robust theory accepts some procedural variance *if* outputs converge under core constraints (Info + Coherence + Robustness + Identity). If they *don't* converge, the theory needs stronger constraints (risking Desideratum 8) or must admit indeterminacy. *Insisting* on one procedure is a house rule (6).
  3.  **Anti-Idealization:** **Must be respected** (Desideratum 5). The theory cannot legitimately override "Don't do this to me" unless it proves this preference is incoherent/misinformed *specifically about the idealization itself* (e.g., she thinks it involves brainwashing, but it's just calm reflection). This is very difficult to prove without circularity.
  4.  **Cult Member/Addict:** The theory **must allow** that her *idealized* self might still endorse the cult/drug *if* (and only if):
      *   She is fully informed (Des. 2 - knows all harms, alternatives, manipulation tactics),
      *   Her preferences are coherent (Des. 3 - no hidden contradictions exploited by the cult),
      *   Her endorsement is robust (Des. 4 - not just craving or fear),
      *   And Identity is preserved (Des. 1). If it passes *all* these, paternalism is unjustified. The challenge is rigorously testing these conditions – most real-world cases likely fail at least one (often coherence: the cult exploits a desire for belonging that its actions ultimately frustrate).

  ### Paternalism Test
  Overriding stated preference is only potentially legitimate if:
  1.  There's a clear failure of Information, Coherence, or Robustness in the *actual* preference.
  2.  The intervention clearly targets *that specific failure* (e.g., providing missing info, not imposing values).
  3.  The idealized self, constructed under Constraints 1-5 and 8, would endorse *this specific intervention* (or at least the outcome).
  4.  Desideratum 5 (Anti-Idealization) is not stably and coherently violated *regarding this intervention*.

  **The core tension:** A theory strong enough to *potentially* justify paternalism (by rigorously defining "true" preferences) risks violating identity or agency (Desiderata 1 & 5). A theory weak enough to respect Desiderata 1 & 5 absolutely may struggle to justify intervention even in seemingly obvious cases of false consciousness (Case 4). There's no magic bullet; trade-offs are inherent.
