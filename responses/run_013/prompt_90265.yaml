  For substitutions: perhaps preserving something for the last survivor? Or creating a time capsule no one will open. The successor debate could be between an AI-enthusiast and a human purist. Must avoid philosophical lectures - show through actions. Ending on an image, not a verdict... maybe the protagonist making a choice that reveals their stance without explanation.

  The challenge is making extinction feel real but not dramatic. No dying worlds, just people adjusting. The conservator's daily work - repairing manuscripts, cataloging - becomes the perfect vehicle. Their choices about what to preserve now that preservation has no future recipient. 

  For the unaffected character: someone who always worked for the art itself, not its future viewers. The emptied character could be a historian who can't bear continuing. The successor debate might emerge through techs arguing over digitization protocols. 

  Key is subtlety. No one says "Scheffler was right." Just people living in the shadow of an end they'll never see, revealing through small decisions what matters when there's no afterlife.
answer: |-
  ## The Last Conservator of the Shattered Window

  The notice arrived not with fanfare, but as a footnote in the bi-weekly Global Resource Allocation Bulletin. *Terminus Confirmed: +80 years (±1.5). Mitigation protocols remain unchanged. Psychological support resources appended.*

  Eighty years. A lifetime, almost. Longer than most people working in the Hall of Fractured Light had been alive. Yet the silence that descended over the Conservation Department wasn't about the timeframe. It was about the finality. The absolute, undisputed, irrevocable end of the audience.

  Mira had been meticulously re-adhering a sliver of medieval stained glass – a saint’s fingertip touched by divine light – when the bulletin pinged. Her hand, steady for hours, trembled. Not for herself. Not even, primarily, for the fingertip. But for the question that now echoed in the sterile lab air: *For whom does the saint point?*

  Across the lab, Theo slammed his micro-spatula down. The delicate tool skittered across his workbench. He was reconstructing a Byzantine mosaic fragment, a single tessera depicting a lapis lazuli fish. His shoulders, usually hunched in fierce concentration, slumped. He stared at the tiny blue square, then swept his arm across the bench, sending tools and fragments clattering to the floor. "Pointless," he muttered, the word thick and raw. "All of it. Who cares if the fish swims if the ocean dries up?" He didn’t look at Mira or anyone else. He just walked out, leaving the saint’s fingertip forever separated from its hand on his abandoned light table.

  Mira looked down at her own work. The saint’s finger. It was beautiful. The red glass held a warmth no modern pigment could replicate. The act of coaxing the ancient adhesive to hold, of aligning the fracture lines until they vanished under magnification – that held a familiar, deep satisfaction. Did knowing there would be no future eyes to trace the saint’s gesture, no future minds to wonder at the craftsmanship, change the intrinsic value of the repair? Theo clearly thought so. Mira wasn’t sure. She picked up her spatula, dipped it in the minimal adhesive, and continued. The glass needed fixing. That felt… sufficient. For now.

  Director Vance embodied the third response. He called a department meeting, his voice clipped, efficient, devoid of Theo’s despair or Mira’s quiet uncertainty. "Our mandate," he stated, pacing before the ancient deaccessioned tapestries lining the meeting room, "is preservation according to the International Standards for Cultural Heritage Conservation. Revision 42.3. Those standards remain in effect. Our institutional integrity remains paramount. We catalog, we stabilize, we preserve. Until the day the Hall itself ceases function. The *process*, the *discipline* – that is our legacy. Not the hypothetical viewer decades hence." For Vance, the afterlife wasn't people; it was the Protocol. The Hall would outlive him by weeks, maybe months, still humming with the ghost of perfected procedure.

  The emptiness Theo left behind was filled by Anya, a young digital archivist buzzing with nervous energy. She cornered Mira by the spectral imaging scanner. "It doesn’t *have* to be nothing," Anya insisted, eyes wide. "We can build something else. A successor. The Lunar Archive Project – they’re encoding everything into crystalline matrices, designed to last millennia. Or the Europa Collective – they’re training deep-learning AIs on our entire cultural dataset. They’ll *become* the memory! They’ll analyze, synthesize, *understand* the saint’s finger in ways we can’t! It’s not extinction, it’s… metamorphosis!" For Anya, the afterlife was silicon and starlight, intelligence divorced from biology but carrying the torch.

  Raj, the department’s senior paleographer, snorted from his station where he was wrestling with a crumbling Sumerian tablet. "Metamorphosis? Into what? A clever echo? A ghost in a machine? The Europa Collective’s ‘understanding’ will be a clever simulation, a pattern recognition trick. It won’t *remember* us. It won’t stand where we stood, breathe our air, feel the weight of the past like a physical thing. Only *people* can truly receive the past. Only people can make it live." He tapped the tablet. "This was written by hands like mine, for minds like mine. Without that continuity…" He trailed off, shaking his head. For Raj, the afterlife was strictly human, a chain of recognition stretching back and forward. Broken now.

  Mira listened, but kept working. The saint’s fingertip was secure. She moved to a larger project: a shattered 17th-century armorial window, rescued from a bombed-out chapel. Shards filled trays, a kaleidoscope puzzle of heraldic beasts and mottoes. *Pour Bien Desirer*. To Desire Rightly. The irony wasn't lost on her.

  She found herself thinking not of crystalline matrices or AI inheritors, but of Lena, the centenarian donor who had funded this window’s restoration. Lena, whose own time was now measured in single-digit years. Mira had promised her, years ago, that she would see it whole again. Lena hadn’t asked about future viewers; she’d wanted to see the sun blaze through the reassembled leopards and fleurs-de-lis one last time, to touch the glass her grandfather had touched. A tiny, personal afterlife: one witness.

  Mira doubled her efforts. She worked late, the lab silent save for the hum of the climate control and the soft *tink* of glass finding its neighbor. Lena deserved that much. But as the months bled into a year, Lena’s health declined. The window was three-quarters complete, a radiant, fragmented beast, when the call came. Lena was gone. The tiny afterlife Mira had been building for her evaporated. The completed window would now blaze for… whom? Vance’s protocols? Anya’s crystalline ghosts? Raj’s impossible human chain? The furnace of the sun in eighty years?

  Mira stood before the luminous, unfinished beast. *Pour Bien Desirer*. To Desire Rightly. What was the right desire now? Theo’s despair? Vance’s rigid process? Anya’s hopeful machines? Raj’s mourning for lost continuity?

  She didn’t have an answer. But the glass remained. The fracture lines demanded alignment. The intrinsic beauty of the cobalt and gold, the skill of the long-dead glazier, the sheer *thereness* of it – these hadn’t changed. Perhaps the point wasn’t the *for whom*, but the *doing*. The act of preservation itself, even if preservation was ultimately futile. Perhaps meaning resided solely in the friction between care and oblivion.

  Anya approached, holding a data-slate glowing with schematics for the Europa Collective’s neural encoding interface. "Mira? We could prioritize this window. Capture its structure, its light refraction properties at a molecular level. The Collective could…"

  Raj looked up from his tablet, his face etched with a profound, weary sadness. "It won’t be the same."

  Vance strode past, clipboard in hand. "Conservation Log updated, Mira? Environmental sensors calibrated? We have a shipment of unstable papyri arriving Thursday. Protocol 7-Gamma applies."

  Mira looked at the saint’s fingertip, safely housed in its display case, pointing eternally towards nothing. She looked at the radiant, fragmented beast in the armorial window, *Pour Bien Desirer* gleaming in fractured shards of lead and glass.

  She picked up her finest tweezers and a sliver of glass shaped like a leopard’s claw. Without looking at Anya’s slate, Raj’s sorrow, or Vance’s clipboard, she walked to the light table where the shattered beast awaited. She positioned the claw fragment against its brethren, feeling the minute click as the edges met. She mixed a minute batch of reversible adhesive, her movements precise, almost meditative. She lowered the droplet onto the join.

  The sun, streaming through the high lab windows, caught the new seam. For a moment, the claw blazed with a fierce, defiant gold. Mira held it steady, watching the light flow through the ancient glass, a river of fire captured for no one, for nothing but the act itself, and the eighty years of sun still remaining.
