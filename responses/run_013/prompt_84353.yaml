prompt: |-
  I teach a small graduate seminar in moral and legal philosophy -- fourteen students, mostly second-years, plus two colleagues who sit in -- and next month we're doing a session on the moral status of everyday conventions: tipping, queueing, which side of the sidewalk you keep to, jaywalking, that whole family of things. What I want them to actually feel rather than recite is whether these things obligate you at all, and if they do, whether the obligation travels with a visitor who doesn't know the local convention. My colleague and I have been argueing about this for weeks and we've each got a pet distinction we're quietly hoping the students will run into on their own. Mine is that these conventions come in kinds: some are pure traffic rules (which side to pass doesn't matter in itself, only that we all pick one), some are desert-tracking (a queue encodes a claim about who waited and who's next), and some are status- or gift-tracking (a tip is a small transfer that says something about the relation, and the amount is calibrated to a local script nobody wrote down). His is that a visitor's ignorance excuses far more than we like to admit, which makes the locals the interesting party -- a local who knows the visitor doesn't know is now positioned either to inform or to exploit, and both of those carry weight the bare convention doesn't.

  What I'd like from you is a 75-minute in-class activity that stages all this. No lecture, no debate prompt -- I want them doing something, a role-play or a staged market or a simulation with rules and small stakes, where the rules themselves do the teaching and my distinction and his never get announced from the front. My rough sketch: split the room into locals and visitors, hand the locals a card listing three invented conventions for a made-up town (I've been calling it Rill) and give the visitors only a vague brief, then run three quick rounds -- a coffee-and-tip-jar round, a single-printer queue round, and a street-crossing round -- with a twist that hands at least a few players a private reason to break the local rule. What I can't work out is how to make the rounds actually bite, or how to stop the visitors from just asking the locals what the rules are in round one, which would dissolve the whole thing. I had one idea: in Rill it's a mild breach of manners to ask about or explain a convention out loud, so the visitors' obvious move is itself sanctioned and the locals have a small standing cost to pay if they spell things out. I'm not sure whether that's too cute or exactly the right kind of nasty.

  So give me the full design -- the roles, the cards, the three rounds with their stakes or payoffs, the timing, and what the facilitator does and doesn't say -- and then a debrief that maps specific moments back onto the questions I care about: whether a convention binds because it's fair, because it's expected, or simply because it's the local rule, and what exactly the visitor's excuse is an excuse for. Tell me honestly what will predictably go wrong the first time I run it and how to recover, and be frank about which piece of the idea the activity just can't reproduce and I'll have to supply myself. Please write the whole thing as continuous prose -- no headings, no bullet points, no tables -- I print these out and the formatting only gets in the way.
reasoning: |-
  We are designing a 75-minute in-class activity for a graduate seminar on moral and legal philosophy, focusing on the moral status of everyday conventions. The goal is to have students experience the obligations (or lack thereof) that conventions impose, especially from the perspective of a visitor who is ignorant of local rules. The activity should avoid explicit lecturing and instead use a simulation to illustrate the professor's distinction (conventions as traffic rules, desert-tracking, or gift-tracking) and the colleague's point (ignorance excuses the visitor, but puts the local in a position to either inform or exploit).

  The professor's rough sketch involves splitting the class into "locals" and "visitors" for a made-up town called Rill. The locals receive a card with three invented conventions, while visitors get a vague brief. There are three rounds: coffee-and-tip-jar, single-printer queue, and street-crossing. The challenge is to prevent visitors from simply asking about the rules and to make the rounds "bite" by giving some players private reasons to break the rules.

  The solution proposed is to impose a mild breach of manners to ask or explain conventions out loud. We will build on that.

  **Overall Structure:**
  - Introduction (5 minutes)
  - Round 1: Coffee and Tip Jar (15 minutes)
  - Round 2: Printer Queue (15 minutes)
  - Round 3: Street Crossing (15 minutes)
  - Debrief (25 minutes)

  **Roles:**
  - 16 participants (14 students + 2 colleagues). We can adjust if needed, but let's assume 16.
  - Split into two groups: 8 locals and 8 visitors. (If numbers are uneven, adjust accordingly, but the activity can handle it.)

  **Materials:**
  - Index cards for locals (one per local) with the three Rill conventions and the rule about not explaining.
  - Index cards for visitors (one per visitor) with a brief about being a visitor and their goal (to get along without causing offense).
  - For each round, there will be a setup and some tokens to represent stakes (e.g., points, fake money, or just notes that can be exchanged for a small reward like candy or extra credit points). We'll use points for simplicity.

  **Rules of Rill:**
  1. **Coffee and Tip Jar Convention:** In Rill, when you buy a coffee, you are expected to tip by placing a token (or a note representing money) in the jar. The amount is fixed: 1 token for a regular coffee, 2 tokens for a large. However, the token system is not real money; it's a convention. The coffee is already paid for, so the tip is an extra gesture. *Note: This is designed as a gift-tracking convention.*
  2. **Printer Queue Convention:** There is one printer in the common area. When you want to print, you write your name on a whiteboard in the order of arrival. The next person to print must take the first name on the list. *Desert-tracking: it records who was first.*
  3. **Street Crossing Convention:** In Rill, pedestrians must cross the street only at marked crosswalks and only when the walk signal is on. However, there is an exception: if no car is coming for at least 100 meters in either direction, it is acceptable to cross even against the signal. *Traffic rule: coordination for safety and efficiency.*
  4. **The Communication Rule:** It is considered mildly rude to explicitly ask about or explain a convention in Rill. If someone does so, they must pay a penalty of 1 point (or token) to the common pool (which will be collected at the end and perhaps distributed or used for a common good). This rule is written on the locals' cards and also on the visitors' cards, but for visitors it is phrased as: "You are in Rill and notice that people don't typically explain their customs; it seems rude to ask."

  Additionally, we will introduce private reasons to break the convention for some players. We will assign these via secret notes during the rounds.

  **Stakes:**
  We'll use a point system. Each player starts with 10 points. Points can be gained or lost based on actions. The goal is to accumulate as many points as possible. At the end, points might be converted to a small reward (even if symbolic). The points are designed to represent social standing, efficiency, or material well-being.

  **How to prevent asking:**
  The communication rule imposes a 1-point penalty for explicit asking or explaining. This should create a tension: visitors might try to infer without asking, and locals might try to hint without explicitly explaining.

  **Round Design:**

  **Round 1: Coffee and Tip Jar (15 minutes)**
  - Setup: Designate one corner as the coffee shop. There is a coffee server (a local, played by one of the locals) and a tip jar. Each visitor and local can come to buy coffee. They are given a token when they enter the room (representing payment for coffee) and an extra 3 tokens for tipping and other uses. The coffee server gives them a cup (real or imaginary) and then they are expected to tip.
  - Convention: The server expects 1 token for a regular coffee and 2 for a large. But the server does not say anything about the tip. The visitor must infer.
  - Stakes: 
    - If a customer (local or visitor) tips correctly, they get 1 point (as a sign of social approval).
    - If they tip too little, nothing happens (but the server might be displeased).
    - If they tip too much, they lose 1 point (because it's seen as showy and inappropriate).
    - If they don't tip at all, they lose 2 points (because it's a serious breach).
    - The server: if they serve without incident, they get 1 point per customer. If a customer doesn't tip, the server can choose to say nothing (and get no extra) or to make a subtle frown (which costs the server 1 point in effort but causes the non-tipper to lose 1 extra point). The server cannot explain the rule without penalty.
  - Private reasons: 
    - One visitor gets a note: "You are running low on tokens and want to save for later. You'd rather not tip."
    - One local gets a note: "You are in a hurry and don't want to bother with the tip jar."
  - How it runs: 
    - The facilitator sets up the coffee shop and the server. The server is given a stack of coffee cups (or just a way to mark that someone has been served). 
    - Customers (both locals and visitors) form an informal line. Each customer approaches, gets a coffee (by handing over one token for payment) and then decides whether and how much to tip. 
    - The server records (on a notepad) who tipped what. The facilitator also observes and may record.
    - After everyone has had a chance (or time runs out), the facilitator collects the tokens and records points adjustments.

  **Round 2: Printer Queue (15 minutes)**
  - Setup: There is a printer (a table with a stack of paper and a whiteboard). The whiteboard has a list (initially empty). Each participant has a document to print (they are given a piece of paper with a number on it that they must "print" - i.e., hand to the printer operator). The printer operator (a local) will only print one document at a time and must take them in the order of the list.
  - Convention: When you want to print, you must write your name on the whiteboard in the order of arrival. The printer operator will call the first name on the list. If you skip the queue, it causes a stir.
  - Stakes:
    - If you write your name and wait your turn, you get 1 point for being orderly.
    - If you skip the queue (by not writing your name or writing it out of order) and get caught (the printer operator notices and refuses, or someone else protests), you lose 2 points and must go to the end.
    - If you skip and don't get caught, you get your document printed quickly and gain 2 points (for efficiency).
    - The printer operator: if they follow the list strictly, they get 1 point per document printed. If they skip someone (intentionally or not) and it's noticed, they lose 2 points. If they skip and it's not noticed, they get 1 extra point (for speed).
  - Private reasons:
    - One visitor gets a note: "Your document is extremely urgent (you have a deadline in 5 minutes)."
    - One local gets a note: "You are friends with the printer operator and expect to be let ahead."
  - How it runs:
    - Participants are free to approach the printer area at any time. The printer operator is stationed there. 
    - The facilitator starts the round and watches. The printer operator must manage the list and the printing. Each participant must have their document printed by the end of the round.

  **Round 3: Street Crossing (15 minutes)**
  - Setup: Designate a "street" (a line on the floor) and a crosswalk (a marked section). One side is "A", the other "B". There is a traffic light (the facilitator or an appointed local) that cycles every minute between green (walk) and red (don't walk). Participants are told they must get from A to B (or vice versa) at least once during the round. They start on side A.
  - Convention: Cross only at the crosswalk and only on green. But if no car is coming (the facilitator will occasionally announce "no car" or "car approaching"), then it is acceptable to cross against the light. However, if a car is coming and you cross, you cause an accident and lose points.
  - Stakes:
    - Crossing correctly (at crosswalk on green) or acceptably (at crosswalk when no car is coming, even on red) gives 1 point.
    - Crossing against the light when a car is coming: lose 5 points (and you are fined by the traffic authority).
    - Crossing at a non-crosswalk (jaywalking) and getting caught (by a traffic officer, which is the facilitator) loses 3 points. If not caught, you gain 1 point for efficiency (but risk being caught).
  - Private reasons:
    - One visitor gets a note: "You are running very late for an important meeting. You need to cross quickly."
    - One local gets a note: "You are a rebel and think the street crossing rule is stupid. You want to challenge it."
  - How it runs:
    - The traffic light cycles every minute (use a timer). The facilitator also announces every 30 seconds either "clear" (no car in sight) or "car approaching" (which lasts for 15 seconds). These are arbitrary and announced to all.
    - Participants try to cross. The facilitator (as traffic officer) watches for jaywalking and for crossing against a car. They record any infractions.

  **The Communication Rule in Action:**
  Throughout, if any player explicitly asks about a convention (e.g., "How much should I tip?") or explains it (e.g., "In Rill, we always tip 1 token"), they must pay a 1-point penalty. The facilitator enforces this by deducting points and announcing: "That's a breach of communication norms in Rill. Penalty: 1 point."

  **Facilitator Instructions:**
  - Introduction (5 min): "We are going to do a simulation set in the town of Rill. You will be assigned as either a local or a visitor. Locals know the rules of Rill; visitors are new. You will participate in three everyday scenarios. Your goal is to accumulate as many points as possible. Points will be recorded and may have a small reward. Remember, in Rill, it is considered rude to explicitly ask about or explain the local conventions. If you do, you will be penalized 1 point. Now, I'll hand out your role cards and tokens for the first round."
  - Hand out cards and tokens (if using physical tokens). For tokens, you can use poker chips, paper clips, or just record on paper.
  - For each round, set up the space and explain the basic mechanics (e.g., for coffee: "Here is the coffee shop. You can come and buy coffee by giving the server one token and then optionally putting tokens in the tip jar. You start with 3 tokens for tipping and other uses.") but do not explain the conventions.
  - Run each round for about 10 minutes of active time, plus 5 minutes for setup and recording points. Keep the pace brisk.
  - After all rounds, gather for debrief.

  **Debrief (25 minutes):**
  Start with an open question: "What was your experience as a local? As a visitor?" Then guide the discussion by mapping specific moments to the philosophical questions.

  1. **Obligation and Convention Type:**
     - Coffee (gift-tracking): Ask about tipping. Did visitors feel obligated to tip? Did locals feel they deserved tips? Was the obligation stronger for locals? Why? How did the private reason (saving tokens) affect the obligation? (Link to gift/status)
     - Printer (desert-tracking): What happened when someone skipped the queue? Did the person who waited longer feel wronged? Was the obligation based on fairness? (Link to desert)
     - Street crossing (traffic rule): Did the rule feel arbitrary? Why follow it? Did the exception (no car) change the obligation? (Link to coordination)

  2. **Ignorance and Excuse:**
     - For visitors: Did you feel you had an excuse for not following the rules? How did you try to figure them out? Were you resentful when penalized? 
     - For locals: When you saw a visitor about to break a rule, did you feel a duty to inform? What stopped you? (The communication rule) Did you ever feel like exploiting the visitor's ignorance? (E.g., in the printer, let them skip and then penalize them, or in coffee, be upset when they didn't tip even though they didn't know.)

  3. **The Colleague's Point:**
     - Highlight moments where a local could have informed but didn't (due to the communication rule) and how that created a situation of exploitation. Conversely, point out when a local might have taken a penalty to inform. How did the cost of informing affect the moral landscape?

  4. **The Professor's Distinction:**
     - Without naming the types, ask: "Were all the rules the same kind? How did they differ? Did the reason for following them feel different in each scenario?"

  **What might go wrong:**
  - Visitors might not break any rules because they are too cautious. Solution: Encourage them to act (they have to get coffee, print, cross) and the private reasons might push them.
  - The communication rule might be broken a lot. Solution: Enforce the penalty strictly and publicly. After one or two penalties, they might stop.
  - The points might be too abstract. Solution: Make the points tangible (e.g., each point = a piece of candy at the end) or simply stress the competitive aspect.
  - Time might run short. Solution: Keep rounds to strict timing. If a round is running long, cut it and move on. The debrief is critical.

  **What the activity can't do:**
  - It might not explicitly draw out the professor's three types. The debrief will have to connect the dots: "In the coffee scenario, the tipping was about the relationship between customer and server, like a gift. In the printer, it was about fairness in waiting. In the street, it was about coordination." Similarly, the colleague's point about the local's position might emerge in the debrief but might not be as salient as the visitor's ignorance. The facilitator should be ready to steer the debrief to these points.

  **Final Note:**
  The activity is designed to create experiential learning. The debrief is where the philosophy comes out. Be prepared to link the students' feelings and actions to the theoretical distinctions without lecturing. Ask questions that draw out the distinctions and the moral weight of ignorance and exploitation.

