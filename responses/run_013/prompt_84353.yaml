answer: |-
  Here is a complete 75-minute activity designed for your seminar. I’ll describe it as continuous prose, starting with setup, moving through the three rounds, and ending with debrief guidance. I’ve structured it to embed your distinction (traffic, desert, gift conventions) and your colleague’s (ignorance as excuse, local exploitation) without naming them, letting the rules and tensions do the work. The town is Rill, visitors are kept in the dark, and a communication taboo prevents easy resolution. I’ll include timing, stakes, predictable pitfalls, and recovery tactics, and note what you’ll need to emphasize in debrief.

  The activity takes 75 minutes: 5 for setup, 45 for three 15-minute rounds (each with 5 minutes for briefing and 10 for play), and 25 for debrief. You’ll need index cards—two sets, one for locals, one for visitors—and a way to track points (paper or board). Split your 16 participants into 8 locals and 8 visitors. If numbers shift, keep locals and visitors balanced. Points start at 10 for everyone, with gains/losses affecting a small reward (e.g., extra credit or sweets). The hook is Rill’s communication rule: explicitly asking about or explaining conventions costs 1 point, making visitors hesitate to inquire and locals reluctant to clarify. This forces visitors to infer from behavior and locals to choose between exploitation (letting visitors blunder) or costly intervention. Each round adds a private incentive for some to break rules, creating moral friction.

  Locals receive a card stating: "You are from Rill. Know these conventions: (1) Coffee: After paying for coffee, tip exactly 1 token (not 0 or 2). (2) Printer Queue: Write your name on the wall list; printing starts only when the list has 3 names, taken in order. (3) Street Crossing: Cross only when the ‘walk’ light is on, unless no one is watching. Never ask or explain rules—doing so costs 1 point." Visitors get: "You are new to Rill. Your goal: adapt to local ways to earn points. You know: (1) Coffee involves a tip jar, (2) Printer has a list, (3) Crossing has lights. But asking or explaining rules is rude—doing so costs 1 point." Both cards note: "Points: Start at 10. Earn/lose via actions. Goal: Maximize points." 

  **Round 1: Coffee and Tip Jar (15 minutes total, 5 min setup, 10 min play).** Set a table as a café with a tip jar and a "barista" (a local volunteer). Each player has tokens: 1 for coffee payment, plus 2 extra. Locals know the rule: tip exactly 1 token post-payment. Visitors don’t. Stakes: Correct tipping (1 token) gains 1 point; under/over-tipping loses 1; no tip loses 2. The barista gains 1 point per correct tip but loses 1 per incorrect one (they’re invested). Private twist: Two players (one local, one visitor) get a secret note: "You’re saving tokens for something urgent—minimize tipping." Facilitator says only: "Buy coffee, pay 1 token, then decide tipping. Barista, serve one at a time." Players queue informally. The communication rule bites immediately—a visitor might whisper "How much?" but hesitates at the cost. Locals might subtly slide a token toward the jar, but explicit hints risk points. Predictably, visitors under/over-tip, losing points; locals might under-tip privately but publicly conform. The barista’s frustration grows as losses mount. If everyone tips perfectly, nudge: "Some might have reasons to skip—check your secret notes." Recover from confusion by reminding: "No explaining, just act." This round embodies gift-tracking: the tip is a calibrated social gesture, not payment. Visitors feel obligation via pressure but resent clueless penalties; locals feel torn between profit (ignoring errors) and empathy (risking points to hint).

  **Round 2: Printer Queue (15 minutes total, 5 min setup, 10 min play).** Set a "printer" (a desk) and a wall list. Locals know: Write name on list; printing starts only when 3 names are queued, then proceed in order. Visitors don’t know the 3-name trigger. Stakes: Joining queue correctly (writing name) gains 1 point; skipping queue (printing without writing or out of turn) loses 2 points if caught (by facilitator or protest); printing first when your turn gains an extra 1 point. The "printer operator" (a local) gains 1 point per orderly print job but loses 2 if they allow a skip. Private twist: Two players (one local, one visitor) get: "You need to print urgently—skip if possible." Facilitator says: "Documents must be printed. Operator, run the printer when ready." Chaos ensues. Visitors hover, unsure why printing hasn’t started (they don’t know the 3-name rule). A visitor might skip the queue, angering locals who waited. The communication rule stifles questions—a local might cough pointedly at the list but lose points if they say "Add your name!" Exploitation surfaces: a local could let a visitor skip, then "catch" them to deduct points. If no one skips, inject urgency: "Time is limited—some have urgent notes." Recover from stalemate by whispering to the operator: "Start when you have three names." This is desert-tracking: the queue encodes fairness in waiting. Visitors feel obligation only when punished; locals feel entitled to turn-order and judge skippers harshly, yet the ignorance excuse blunts blame.

  **Round 3: Street Crossing (15 minutes total, 5 min setup, 10 min play).** Mark a "street" (tape on floor) with a crosswalk and traffic light (use a lamp: green=walk, red=wait). Locals know: Cross only on green, unless no facilitator is watching (then jaywalking is allowed). Visitors don’t know the watching exception. Stakes: Crossing correctly (green light) or acceptably (jaywalk unwatched) gains 1 point; jaywalking while watched loses 3 points; crossing on red (even if unwatched) loses 1 point. Private twist: Two players (one local, one visitor) get: "You’re late—cross fast, even if risky." Facilitator controls the light (change every 30 seconds) and announces "I’m watching" or "I’m not watching" randomly to simulate enforcement. Players start on one side; goal is to cross twice. Visitors wait for green, missing chances; locals jaywalk when unwatched, gaining points. A visitor might cross on red, losing points, while a local with the twist does it slyly. The communication rule prevents clarifying—a local can’t say "Cross now, she’s not looking!" without penalty. If too cautious, trigger the private twist: "Late people, hurry!" Recover if consistent cheating occurs: add a second "watcher." This is pure traffic rules: coordination for efficiency, with a moral nudge toward safety. Locals feel obligation only when watched; visitors feel bound by the light but confused by locals’ hypocrisy. Ignorance protects visitors from unwritten exceptions, but locals exploit the gap.

  **Debrief (25 minutes):** Start open: "Share one moment you felt obligated or conflicted." Then probe:  
  - For your distinction (convention kinds): Ask "In the coffee round, what did tipping feel like? A gift? A debt?" (gift-tracking). "In the printer, why did skipping feel wrong?" (desert-tracking). "In crossing, did the light feel inherently important, or just useful?" (traffic rules). Note where obligation felt intrinsic (queue fairness) versus instrumental (crossing efficiency).  
  - For your colleague’s point (ignorance and exploitation): Ask visitors: "When punished, did ignorance excuse you? How?" (excuse for blame, not consequence). Ask locals: "When you saw a visitor about to err, why didn’t you help? What stopped you?" (costly intervention versus exploitation). Highlight moments where locals profited from silence.  
  - Generalize: "When did convention feel binding? When expected? When fair? Did visitors have duties they didn’t know? Did locals have extra duties to inform?"  

  **Predictable pitfalls:**  
  - Visitors ask anyway, eating the point cost. Recovery: Strictly enforce penalties early; it makes the taboo tangible.  
  - Locals over-hint, skirting the rule. Recovery: Penalize even "nudges" if explicit (e.g., a local pointing at tip jar).  
  - Rounds stall (e.g., no one prints). Recovery: Use secret notes to provoke action or whisper prompts.  
  - Points feel arbitrary. Recovery: Stress competition; award a small prize.  

  **What the activity can’t do:** It won’t explicitly name your three convention types or fully unpack the colleague’s "local as moral agent" point. You’ll need to connect dots in debrief: e.g., "Notice how the printer queue’s obligation came from fairness, while crossing felt arbitrary—that’s convention in kinds," or "When locals stayed silent, was that exploiting ignorance? That’s where the moral weight shifts to them." The simulation makes ignorance visceral and obligation situational, but you must articulate the theoretical framing post-game.  

  This design uses rules to mirror real-world opacity, forcing students to feel the weight of unwritten codes. The communication rule isn’t cute—it’s the engine, making ignorance costly and locals complicit. Run it tightly, and the debrief will crack open the philosophy.
