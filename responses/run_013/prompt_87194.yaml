answer: |-
  Based on your precise description, the inference pattern you're identifying is most accurately called the **Temporal Fundamentalism Inference**. Here's the carving you requested:

  1.  **The Move Defined:**
      *   From the premise that a *fundamental physical description* (e.g., a specific GR solution like Gödel's, or the core formalism of a QG theory like the Wheeler-DeWitt equation) **lacks a privileged global time foliation** (or permits Closed Timelike Curves - CTCs)...
      *   ...to the conclusion that **temporal passage ("becoming," the dynamic flow of time) is not fundamental, emergent, or ultimately unreal**.

  2.  **Core Premises (Often Implicit):**
      *   **Fundamental Description Criterion (FDC):** What is real or fundamental must be explicitly present in, or directly derivable from, the most fundamental physical description of the universe. If something is absent *there*, it cannot be fundamentally real.
      *   **Global Time Requirement (GTR):** For temporal passage to be fundamentally real, it *requires* a unique, objective, global temporal ordering across the entire universe (a preferred foliation into simultaneity slices).
      *   **Locality/Experience Subordination (LES):** Local temporal experience (the feeling of passage, the asymmetry of past/present/future) must be subordinate to, and derivable from, the global structure described by the fundamental theory. If the global structure contradicts the *apparent* features of local experience (like global becoming), the experience must be illusory or emergent, and the global structure reveals the deeper truth.

  3.  **Relation to Key Concepts:**
      *   **Block Universe:** The Temporal Fundamentalism Inference is a *specific argumentative path* often used to *support* or *derive* the Block Universe view. The Block Universe is the *conclusion* (spacetime is a static 4D manifold). This inference provides one type of *reason* (based on fundamental physics) for accepting that conclusion.
      *   **Problem of Time in Quantum Gravity:** This inference *is* the core logical move *embodied by* the "frozen formalism" aspect of the Problem of Time. The observation that the Wheeler-DeWitt equation `HΨ = 0` lacks an external time parameter directly triggers the Temporal Fundamentalism Inference: "No time in the fundamental equation → time isn't fundamental."

  4.  **Validity & Critique (When it's good vs. a conflation):**
      *   **Potentially Valid Inference:** If one *accepts* the premises (FDC, GTR, LES) as unquestionably true, then the inference is logically valid. It demonstrates that *if* those premises hold, then the absence of global time/foliation in the fundamental description implies the non-fundamentality of passage.
      *   **Critique as Conflation/Premise Challenge:** The inference is most commonly criticized by challenging its core premises:
          *   **Challenging FDC:** Why assume the fundamental physical description (especially one describing the universe *as a whole*) must contain *everything* that is real? Could temporal passage be a fundamental feature *not captured* by the specific mathematical structure of GR or canonical QG (e.g., perhaps requiring a different formalism or being a primitive aspect of existence)? Does "fundamental physics" exhaust "fundamental ontology"?
          *   **Challenging GTR:** Why must passage require a *global* foliation? Could temporal passage be a *local* phenomenon? Perhaps becoming happens *here and now*, relative to local causal processes, without needing a global "now" slice. Gödel's spacetime *locally* still has a clear lightcone structure and temporal directionality along any *local* worldline. CTCs are global pathologies, but local experience might be consistent.
          *   **Challenging LES:** Is it justified to subordinate the vivid, universal *experience* of temporal passage to a feature (global foliation) absent in a highly abstract mathematical model? Isn't the model supposed to explain experience, not simply dismiss it as illusion *because* it's absent from the model? Might temporal passage be *how* the global structure manifests locally to conscious observers embedded within it, even if the global structure itself is static or foliation-independent?
      *   **Conflation:** The inference often *conflates* the absence of a *specific mathematical structure* (a global time function/foliation) within a particular physical model with the *metaphysical unreality* of temporal passage. It risks mistaking a limitation or feature of the *model* for a definitive statement about *reality itself*, especially if the premises above are not carefully examined.

  **Why "Temporal Fundamentalism Inference"?**

  *   **Temporal:** Clearly identifies the subject matter (time/passage).
  *   **Fundamentalism:** Highlights the core reliance on the **FDC premise** – that reality is strictly dictated by what is "fundamental" in the base physical description. This captures the essence of the move from "not in the fundamental equations" to "not fundamentally real."
  *   **Inference:** Emphasizes that this is a specific logical step, an argumentative pattern, not just a conclusion like "Block Universe."

  **Using the Term:**

  *   "Philosopher X is making a classic **Temporal Fundamentalism Inference**: because the Wheeler-DeWitt equation lacks a time parameter, they conclude temporal passage is emergent."
  *   "Gödel's argument for the ideality of time relies heavily on the **Temporal Fundamentalism Inference**, particularly the premise that passage requires a global time foliation."
  *   "To avoid the **Temporal Fundamentalism Inference** leading to timelessness in QG, one might challenge the Fundamental Description Criterion or argue that passage is fundamentally local."

  This term precisely captures the move you described – the leap from the structural features of a fundamental physical model (lack of global time/CTCs) to the metaphysical conclusion about the status of temporal passage, grounded in specific, often implicit, premises about fundamentality and globality. It clearly distinguishes this inference from simply endorsing eternalism or noting relativity of simultaneity.
