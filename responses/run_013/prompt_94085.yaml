prompt: |-
  Hey — I'm a 2nd-year PhD student in metaphysics (I came over from phil of science, I mostly work on causation and mechanisms) and I need to turn a half-formed idea into a short research proposal for a departmental fellowship, 1500–2000 words, and I'm a bit stuck on the framing.

  The idea: the fink/mask literature has been churning out one-off counterexamples to the simple conditional analysis of dispositions for decades — the wire that would conduct if you touched it, except a fink kills its power the instant you touch it; the fragile glass that's wrapped in foam so it won't break when dropped — and I think the whole enterprise is stuck because everyone quietly assumes a disposition is individuated by its possible manifestations. What I want to try is individuating them instead by the intervention profile of whatever categorical basis realizes them, roughly the way interventionists individuate causal claims by what holds across a range of ideal interventions. The case that got me going: a catalyst that, the moment you set up the conditions for the reaction it's supposed to catalyze, reorganizes itself into something that catalyzes a different reaction by a different route — so the manifestation still shows up, but through a different mechanism, and none of the standard fink/mask slots fit it cleanly. Is the disposition preserved, destroyed, or replaced, and does my intervention-profile criterion give a principled answer where the case-by-case method just shrugs?

  So write the proposal: state the question so it has a determinate answer, say why the existing positions (the conditional analysis, dispositional essentialism, the causal-basis views) don't already settle it, lay out what I'd actually do month by month, say what would count as the project definately failing, and be honest about whether this is a term paper or the start of a dissertation. Don't bother with citations, I'll add those.
