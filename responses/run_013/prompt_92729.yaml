prompt: |-
  I am trying to build an index that would let me compare the quantity of violence in a medieval European region with that in a present-day industrial democracy, and I have concluded that I cannot design it until I know what any adequate theory of violence — the quantity the index is supposed to track — has to deliver. So before I read another study, give me the desiderata: the full specification of what a theory of violence must get right.

  For each requirement, give me the case or consideration that motivates it. At a minimum I want the theory to handle the following: a surgeon's incision and a boxing match both parties wanted (harm no one would call violence); a government that quietly lets a vaccination programme lapse, and a famine engineered by blockade (harm by omission, with causation smeared across many hands); a slave economy and a system of segregated deprivation (harm that no single act inflicts); a parent who never strikes but isolates and terrorizes a child; and a suicide, where victim and agent coincide. Tell me which of these are genuine constraints on a theory of violence and which are merely the preoccupations of one camp.

  I also want the distinctions the theory cannot collapse — between violence and force, coercion and harm, act and omission, intended and merely foreseen, physical and psychological — and the difference between a count of violent events and a rate per head of population, including what the denominator even means when populations are estimated rather than counted. Add any consistency constraint the theory must honour, and be explicit about what the surviving historical record actually permits. Finally, say whether the whole enterprise presupposes that violence is a natural kind with a fact of the matter, or whether "how much violence" is inescapably relative to a category we choose; if the latter, tell me what that does to the idea of an objective index.

  Then: mark which requirements are non-negotiable and which are parochial; flag any pair or subset you suspect cannot be jointly satisfied; and name the single requirement that does the most to rule out candidate theories. If it is cheap to do so, say briefly which broad families of approach survive your list.

  Lead with your bottom line in the first sentence — the one requirement you take to be most consequential, or the impossibility result — then give the reasoning. No preamble, no restating my question.
reasoning: |-
  Hmm, the user wants me to specify the requirements for a theory of violence that could support an index comparing medieval European violence with modern industrial democracies. They've provided several challenging cases that any theory must handle: surgical incisions vs boxing (consensual harm), omission-based harm like neglected vaccination programs vs engineered famines, structural harm like slavery and segregation, psychological abuse like terrorizing a child, and suicides.

  The user wants me to identify which cases are genuine constraints versus parochial concerns, discuss essential distinctions the theory must preserve (violence vs force, coercion vs harm, act vs omission, etc.), address measurement issues like event counts versus rates per capita, and consider whether violence is a natural kind or a relative concept. I also need to identify which requirements are non-negotiable versus parochial, flag potential conflicts between requirements, and determine which requirement rules out most candidate theories.

  This is quite comprehensive! Let me break this down systematically. The core challenge here is determining what constitutes "violence" across different contexts. For the index to be meaningful, we need clear boundaries that avoid both over-inclusion (like counting surgery as violence) and under-inclusion (like ignoring structural oppression).

  First, the non-negotiable requirements would likely include:
  - The necessity of non-consent (to exclude surgery and consensual boxing)
  - Accounting for structural violence (slavery, segregation)
  - Including psychological violence (emotional abuse)
  - Handling omission (like famine through neglect)

  The parochial concerns might focus too narrowly on physical acts or immediate agency, which wouldn't capture systemic issues.

  Key distinctions that must be maintained:
  - Violence vs. force (police action vs. brutality)
  - Coercion vs. harm (threats without physical contact)
  - Act vs. omission (active harm vs. neglect)
  - Intended vs. foreseen harm (direct malice vs. negligence)

  For measurement, using rates per capita is essential for comparability across time periods, though medieval population estimates are problematic. Historical records also heavily favor documented events (wars, trials) over everyday or structural violence, creating survivorship bias.

  The most critical requirement is likely non-consent - without it, the theory collapses into absurdity by including all harm. This alone eliminates many theories that define violence solely through physical damage. Structural violence requirements also conflict with some approaches that focus only on individual acts.

  The biggest theoretical challenge is whether violence is a natural kind. I think it's socially constructed - a stabbing isn't "violent" in surgery but is in assault. This means any index depends on our definitional choices, making objectivity elusive. The index would reflect our framework more than some universal truth.

  For surviving approaches, I'd consider social constructionist theories (like Galtung's structural violence concept) and harm-based frameworks with consent filters. But even these struggle with omission and historical data limitations.

  The bottom line is that non-consent is the indispensable requirement. Without it, the theory can't exclude legitimate activities, rendering the index meaningless. But acknowledging violence as a constructed category undermines true objectivity - the index becomes a lens reflecting our priorities, not a neutral measure.
answer: |-
  **Bottom line:** The indispensable requirement is that the theory must exclude *consensual or normatively authorized harm*, as its failure collapses any meaningful distinction between violence and socially sanctioned acts like surgery or boxing, rendering the index incoherent.

  ### Desiderata for a Theory of Violence (with Motivations & Constraints)
  1. **Exclude Consensual/Normatively Authorized Harm**  
     *Motivation:* Surgery and consensual boxing.  
     *Constraint:* Non-negotiable. Failure invalidates the index by including benign/desired acts.  
     *Distinction preserved:* Violence vs. legitimate force/harm.

  2. **Account for Structural/Systemic Violence**  
     *Motivation:* Slave economies, segregated deprivation.  
     *Constraint:* Non-negotiable. Violence isn’t reducible to discrete acts; systems inflict harm through entrenched inequities.  
     *Distinction preserved:* Direct violence vs. indirect structural harm.

  3. **Include Omission & Diffuse Causality**  
     *Motivation:* Famine by blockade, lapsed vaccination (harm via neglect/inaction).  
     *Constraint:* Non-negotiable. Moral responsibility extends to foreseeable harm from omission, even with distributed agency.  
     *Distinction preserved:* Act vs. omission (while acknowledging moral equivalence in outcome).

  4. **Encompass Psychological Violence**  
     *Motivation:* Non-physical child abuse (terror/isolation).  
     *Constraint:* Non-negotiable. Harm can be inflicted without physical contact; exclusion privileges physicality arbitrarily.  
     *Distinction preserved:* Physical vs. psychological harm (while asserting both are violence).

  5. **Address Self-Directed Violence**  
     *Motivation:* Suicide.  
     *Constraint:* Parochial (prioritized by individual-agency theories). Self-harm may be excluded if violence requires separate victim/agent, but *must* be explicitly justified.  
     *Distinction preserved:* Interpersonal vs. intrapersonal harm.

  6. **Distinguish Intended vs. Foreseen Harm**  
     *Motivation:* Blockade-induced famine (intended) vs. collateral damage (foreseen).  
     *Constraint:* Non-negotiable for moral weighting, but *measurement* may aggregate both.  
     *Distinction preserved:* Intentionality vs. recklessness.

  7. **Handle Epistemic Constraints of Historical Records**  
     *Motivation:* Medieval records overstate elite conflicts, undercount domestic/structural violence.  
     *Constraint:* Non-negotiable. Theory must define violence independently of documentation bias and specify proxy measures (e.g., skeletal trauma for physical violence).  
     *Consistency:* Index cannot require data that doesn’t survive (e.g., psychological abuse in medieval archives).

  8. **Resolve Denominator Ambiguity**  
     *Motivation:* Per capita rates with estimated populations.  
     *Constraint:* Non-negotiable for comparability. Theory must permit uncertainty ranges and clarify if the index measures *events*, *harms*, or *risk exposure*.  
     *Distinction preserved:* Absolute counts vs. normalized rates.

  9. **Define Coercion vs. Violence**  
     *Motivation:* Threats without physical harm (e.g., extortion).  
     *Constraint:* Parochial (legal frameworks often separate them). Theory may exclude pure coercion but must justify why it isn’t psychological violence.

  ---

  ### Critical Tensions & Meta-Constraints
  - **Non-Consent is the Key Filter:** Rules out theories defining violence solely by physical damage (e.g., behavioral psychology) or social harm (e.g., some sociological models). Surviving theories must incorporate agency/consent (e.g., Galtung’s structural violence + actor-based approaches).
  - **Structural vs. Direct Violence Tension:** Quantifying systemic harm (e.g., life-shortening from segregation) conflicts with event-based historiography. Medieval data lacks granular indicators (e.g., income inequality) for direct comparison.
  - **Objectivity Relativity:** Violence is not a natural kind but a normative category. An "objective" index requires stipulating a specific framework (e.g., liberal humanist harm-principle). This relativizes comparisons: a pacifist index rates blockade as violence; a statist index may not.
  - **Most Exclusionary Requirement:** **Structural violence** eliminates narrow agent-act theories (e.g., Weberian state-monopoly views). It demands causal attribution to systems, conflicting with sparse historical data.
  - **Data-Driven Impossibility:** Medieval records lack systematic data on domestic/psychological violence, famine causality, or demographic detail. Theory must accept probabilistic reconstructions (e.g., paleopathology, grain prices) as proxies.

  ### Surviving Approaches
  - **Harm-Centric + Consent Filter:** E.g., capability deprivation (Sen) excluding consented harm.
  - **Structural Violence Expansion:** Johan Galtung’s framework, extended with historical proxies (e.g., inequality indices, famine mortality).
  - **Human Security Paradigm:** Focus on threat avoidance, weighting omission/structural harm equally with direct acts.

  ### Non-Negotiable vs. Parochial
  - **Non-negotiable:** 1, 2, 3, 4, 6 (for theory), 7, 8.  
  - **Parochial:** 5 (suicide), 9 (coercion)—reflect agent-centric vs. harm-centric camps.  
  - **Likely Incompatible Pair:** Requirement 2 (structural violence) and event-based quantification. Structural harm resists discrete "events," forcing reliance on mortality/inequality metrics that may not align with medieval data.
