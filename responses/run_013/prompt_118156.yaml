prompt: |-
  I have been trying to understand updateless decision theory, and a friend in my reading group has produced the following argument against it. Every step strikes me as independently plausible, the conclusion strikes me as clearly false, and I cannot find where the two come apart. I would like you to identify the faulty step, explain why it looked compelling, and say what a defender of the view would have to concede in order to block the argument.

  By way of setup: an ordinary causal decision maker evaluates each action by the outcomes it would cause in the situation she now takes herself to be in; she conditions on her observations, then chooses the action with the best expected consequences. Updateless decision theory is meant to differ in this respect. The agent instead chooses her entire policy — a rule mapping observations to actions — by maximizing expected utility from an ex ante standpoint, prior to conditioning on which observations she will in fact make. The motivation is to handle cases such as Newcomb's problem, where what matters is the kind of chooser one is rather than what any single action causes, and counterfactual mugging, where the reward one receives in one branch of the world is made to depend on how one would have chosen in a different branch.

  The argument:

  (1) A policy is a function from observations to actions. To choose a policy from the ex ante standpoint is to choose it without conditioning on the observations one will later receive.

  (2) To choose an action without conditioning on one's observations is to choose it in ignorance of one's evidence.

  (3) An action chosen in ignorance of one's evidence can be justified only by the average of its consequences across all the observations one might have made, weighted by their prior probability.

  (4) Hence the action an updateless agent performs in any given situation is the action that is best on average across all the situations she might have believed herself to be in, rather than the action best suited to the situation she is actually in.

  (5) So if she observes that the building is on fire, she should do whatever would have been best before she knew whether the building was on fire — which may well be to stay in bed.

  (6) A decision theory that directs you to act on an average over the evidence you might have had, rather than on the evidence you actually have, is not a theory of rational action at all; it is a recipe for ignoring everything you know.

  (7) Therefore updateless decision theory is not a viable decision theory.

  I am reluctant to give up the ex ante evaluation of policies, since that appears to be the view's central idea, and I would rather surrender the conclusion than that. But I cannot say which of (1) through (6) does the damage. Please lead with your verdict in the first sentence — naming the step that fails — and then give the reasoning, with no preamble and no restatement of the argument. Explain why the faulty step looked plausible, and what my friend would have to give up in order to repair it.
reasoning: |-
  Hmm, the user is struggling with an argument against Updateless Decision Theory (UDT) presented by their friend. The argument seems logically sound step-by-step but leads to an absurd conclusion where UDT would ignore crucial evidence like a building fire. The user wants me to identify which step fails and explain why it's deceptive.

  First I need to parse the core tension. UDT evaluates entire policies ex ante to handle Newcomb-like problems, but this argument claims it forces irrational ignorance of actual evidence. The user finds each premise plausible but the conclusion unacceptable - that's the puzzle to solve.

  Looking at the steps: Premise (3) seems to be the weak link. It claims actions chosen without evidence can only be justified by averaging across all possible observations. But UDT doesn't actually choose actions that way - it chooses policies ex ante, but the policy itself specifies evidence-responsive actions. The key insight is that UDT selects the policy whose evidence-conditioned actions perform best overall from the ex ante perspective. 

  When you see a fire under UDT, you don't average over non-fire scenarios; you follow the policy that says "if fire, evacuate" precisely because that policy was chosen for its optimal response to actual evidence. The ex ante evaluation is about committing to rational responsiveness, not ignoring evidence. Premise (3) misrepresents UDT by conflating policy selection with action justification.

  The step looked plausible because in isolation, choosing without evidence does typically require averaging. But UDT's two-tier structure breaks this: the policy is chosen ex ante, but its actions are evidence-informed by design. The friend would need to concede that ex ante policy selection can rationally incorporate future evidence responses without averaging away actual observations.

  The user might need to clarify that UDT doesn't make agents act counterfactually in their situation; it makes them act according to the precommitted plan that handles their actual situation optimally in expectation. The fire-evacuation policy exists because it correctly responds to fires when they occur.
answer: |-
  Step (4) fails. 

  UDT chooses a policy ex ante, but the action performed in any given situation is determined by *applying that policy to the actual observation*. The policy itself is selected *because* it prescribes actions that are well-suited to the actual situations when they arise, as evaluated from the ex ante perspective. The agent does not average over possible observations at the moment of action; instead, they follow the policy's instruction *for their specific observation*. When they observe the building is on fire, the policy (chosen ex ante) dictates evacuation *because* that policy scores highly by appropriately responding to fires when they occur. The "average" is used only to *select the policy*, not to *determine the action* within a realized situation.

  This step looked compelling because it conflates the *selection criterion for the policy* (which uses an ex ante average) with the *execution mechanism of the policy* (which uses actual evidence). The argument mistakenly assumes that because the policy was chosen by averaging, the agent must average at the time of acting. But UDT separates these: the agent commits to a policy that *conditionalizes on evidence*, so the action is evidence-appropriate.

  To repair the argument, your friend must concede that ex ante policy selection can rationally prescribe evidence-sensitive actions without ignoring realized observations. They must abandon the inference that UDT agents act on an average *after* seeing evidence. UDT agents act on their actual evidence via the precommitted policy, which was favored precisely for its context-specific responses.
