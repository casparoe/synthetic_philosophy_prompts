  The homeopathy supporter is a tricky part. The user wants an honest answer without dismissing the person. Lakatos's framework could technically classify homeopathy as a research programme, but it's degenerating because it fails to generate novel predictions and constantly adjusts post-hoc. This needs handling during the progressive/degenerating discussion, using it as a case study to apply the criteria.

  For the closing question, something that tests understanding of programme evaluation, like asking whether a hypothetical scenario is progressive or degenerating and why. And avoiding deep dives into novel predictions or technicalities.

  I should structure the session in phases: hook, core concepts, how programmes evolve, evaluation, and application. Timings are crucial. The ulcer example might still be useful for the belt adjustments but paired with phlogiston for contrast. 

  Potential pitfalls: the group might conflate terms, so clear definitions and whiteboard visuals are key. The homeopathy point needs tact—acknowledge it as a programme but demonstrate its degenerative nature factually. Emphasize that degeneration doesn't equal falsehood but lack of growth.

