  We are drafting a joint statement for two philosophers: a prioritarian and a telic egalitarian. The goal is to clarify the leveling-down objection and identify points of agreement and disagreement.

  Structure the document as continuous prose without headings or bullet points. The key elements are:

  1. **Claims both can sign**: Define leveling down, what it is and is not. Concede motivations. Clarify the target of the objection. Identify verbal disputes.

  2. **Residual disagreement**: State the core disagreement fairly from each side.

  3. **Cruxes**: List sub-questions that would move the debate forward. For each, provide a case or argument both sides agree is relevant, and record each side's prediction. Include at least:
     - Whether the objection is a reductio or a pro tanto cost.
     - Whether the priority view is comparative or non-comparative, and if comparative, whether it faces a similar objection.
     - Whether the objection has grip when the worse-off group is unaware and unaffected.

  4. **New case**: A single-person case of leveling down within a life (flattening the life: trimming good years, leaving bad years). Ask each side if their view on interpersonal leveling down applies here, and if the verdicts diverge, whether that is principled.

  Write in a formal, collaborative tone.

  ---

  **Joint Statement on the Leveling-Down Objection**

  We, a prioritarian and a telic egalitarian, have engaged in an adversarial collaboration to clarify our positions regarding the leveling-down objection and to identify both common ground and persistent disagreements. After extensive discussion, we present this joint statement to outline what we agree on and where we continue to differ, in the hope of advancing the debate.

  **Agreed Claims**

  We agree that the leveling-down objection arises in cases where a reduction in inequality is achieved solely by worsening the position of the better-off, without improving the situation of the worse-off or anyone else. Such a change, we concur, is not better in any respect that makes the world better for any individual. The objection is not intended to deny that inequality can be bad in other ways, such as through its social consequences or its effects on relationships, but rather targets the claim that equality is intrinsically valuable. We also agree that the objection is not about the practical advisability of leveling down—neither of us advocates for leveling down as a policy—but about the theoretical question of whether the intrinsic value of equality can survive this objection.

  We further agree that our motivations are not at odds: both of us are concerned with the moral importance of improving the lives of those who are worse off. The prioritarian holds that benefits to the worse-off matter more, and the telic egalitarian holds that inequality is in itself a bad thing. We both aim to address the plight of the less advantaged, even if we disagree on the foundational reasons for doing so.

  We acknowledge that some of our dispute may be verbal. For instance, when we say that a distribution is "better" or "worse," we might be using these terms in different senses: the telic egalitarian may use "better" to include the intrinsic value of equality, while the prioritarian restricts "better" to features that are good for individuals. However, we agree that this verbal difference does not exhaust our disagreement; there remains a substantive issue about whether equality has intrinsic value.

  **Residual Disagreement**

  Our core disagreement is this: The telic egalitarian maintains that, in at least one respect, a more equal distribution is better than a less equal one, even when no one is better off, because equality is intrinsically valuable. The prioritarian denies this, holding that a state of affairs cannot be better in any respect unless it is better for someone. For the prioritarian, the value of a benefit is always a function of the absolute level of the recipient, not their relative position; therefore, leveling down is not better in any respect. The prioritarian sees the leveling-down objection as a decisive refutation of the claim that equality has intrinsic value, while the telic egalitarian sees it as a cost that must be borne by any pro tanto value that can be outweighed by other considerations.

  **Cruxes of the Dispute**

  To make progress, we have identified several cruxes—sub-questions that, if resolved, would move the debate forward. For each crux, we present a case or argument that both sides agree is relevant, and we state our respective predictions in advance.

  First, is the leveling-down objection a reductio ad absurdum that refutes telic egalitarianism, or is it merely a cost that a pro tanto value can bear? The telic egalitarian holds that the objection shows only that the value of equality can be outweighed by other values (such as well-being), but it does not negate the intrinsic value of equality. The prioritarian holds that if a change is not better for anyone, it cannot be better in any respect, so the objection refutes the claim that equality has intrinsic value. Both sides agree that the following case bears on this crux: Consider two distributions, A and B, identical in all respects except that in A, one group is better off than another through no fault of their own, while in B, the better-off group has been leveled down to the same level as the worse-off group. The telic egalitarian predicts that, upon reflection, one will see that B is in one way better (more equal) even though it is worse for some and better for none. The prioritarian predicts that no one will judge B to be better in any respect; they will see it as strictly worse.

  Second, should the priority view be stated comparatively or non-comparatively? The prioritarian typically states the view non-comparatively: a benefit's moral weight depends on the absolute level of the recipient. But if stated comparatively (e.g., giving priority to those who are worse off relative to others), does this expose the priority view to a similar leveling-down objection? The prioritarian holds that the view is best stated non-comparatively to avoid any commitment to the intrinsic value of equality. The telic egalitarian contends that if the prioritarian view is stated comparatively, it might imply that leveling down could be good in some cases (e.g., when it makes the worse-off relatively better off). Both sides agree that the following case is relevant: Suppose we can either give a benefit to a very well-off person or to a slightly less well-off person, but not both. The non-comparative prioritarian would give priority to the slightly less well-off if they are at a lower absolute level. The comparative prioritarian might give priority based on relative disadvantage. The prioritarian predicts that the non-comparative formulation will avoid the leveling-down objection entirely, while the comparative formulation may not. The telic egalitarian predicts that any comparative formulation will be vulnerable to a version of the leveling-down objection, revealing that the prioritarian cannot escape the appeal of equality.

  Third, does the leveling-down objection have any grip in cases where the worse-off group is unaware of the better-off group and could never be affected by them? The telic egalitarian holds that even in such cases, the inequality is intrinsically bad. The prioritarian denies this, arguing that if the worse-off are unaware and unaffected, there is no reason to object to the inequality. Both sides agree that the following case is relevant: Imagine two planets, Earth and Mars, each with isolated populations. On Earth, everyone is at well-being level 10. On Mars, everyone is at level 5. The populations are unaware of each other and will never interact. The telic egalitarian predicts that we should see the inequality between the planets as bad, even if we cannot level it down without harming Earth. The prioritarian predicts that we will not see the inequality as bad; only the absolute level of Mars matters.

  **A New Case: Leveling Down Within a Life**

  We now introduce a new case to test the consistency of our views. Consider a single person whose life has both good and bad years. We have two options: Option A allows her to have a life with both very high peaks (some years at 10) and very low troughs (some years at 1). Option B flattens her life: we trim the good years (down to 7) but leave the bad years untouched (at 1), so that the whole life is more uniform but with a lower total well-being. No one, including the person herself, is better off in Option B; indeed, she is worse off overall.

  We ask: Does the telic egalitarian's verdict on interpersonal leveling down carry over to this intrapersonal case? The telic egalitarian must say whether a more equal distribution within a life is in one respect better, even when it is worse for the person. Similarly, the prioritarian must say whether the priority view applies within a life, giving more weight to benefits in bad years.

  The telic egalitarian responds that if equality is intrinsically valuable, it should apply within lives as well as between lives. Thus, Option B might be in one respect better because it reduces inequality within the life. However, the telic egalitarian may also hold that the value of equality is primarily interpersonal, so there might be a principled divergence. The prioritarian denies that equality has intrinsic value and would reject the intrapersonal leveling down. For the prioritarian, the only concern is the absolute level in each period, and since Option B lowers the overall well-being without improving the bad years, it is worse.

  We then ask: If the two verdicts come apart (e.g., the telic egalitarian endorses interpersonal leveling down but rejects intrapersonal, or vice versa), is this divergence principled or ad hoc? The telic egalitarian must explain why equality matters between persons but not within a life, or if it matters in both, why. The prioritarian must explain why the priority view applies only across persons or also within a life.

  This case, we hope, will help clarify the scope of our principles and whether they can be consistently applied.

  **Conclusion**

  We have set out our agreements, our core disagreement, and the cruxes that we believe are pivotal. We have also introduced a new case to test the boundaries of our views. By committing these points to writing, we aim to foster a more focused and productive discussion.

  Signed,

  [Prioritarian]
  [Telic Egalitarian]
answer: |-
  We, a prioritarian and a telic egalitarian, issue this joint statement to clarify our positions on the leveling-down objection, identify points of agreement, and pinpoint the core disagreements that persist after sustained dialogue. Both of us are motivated by a shared concern for the interests of the worse-off, and both seek a theory that adequately addresses the moral significance of disadvantage. Yet we diverge on whether equality itself possesses intrinsic value, a divergence that the leveling-down objection brings into sharp relief. We agree that leveling down occurs when equality is achieved solely by reducing the advantages of the better-off, without improving the position of the worse-off or anyone else. This is not a trivial semantic point: leveling down entails a net loss in human well-being or other goods, rendering the outcome worse for at least some and better for none. We concur that the objection does not target the instrumental value of equality—such as its role in fostering social cohesion or preventing resentment—but specifically challenges the claim that equality is intrinsically valuable. Neither of us endorses leveling down as a practical recommendation; our dispute is theoretical, concerning the foundations of distributive justice. We also acknowledge that some aspects of our debate have been verbal. For instance, when we speak of a state of affairs being "better" or "worse," the prioritarian uses these terms strictly in reference to individual well-being, while the telic egalitarian allows them to encompass impersonal values like equality. Recognizing this helps isolate the substantive dispute.

  The heart of our disagreement lies in the following: The telic egalitarian holds that a more equal distribution is, in one respect, better than a less equal one—even when it is better for no one—because equality itself is an intrinsic good. This implies that leveling down, while all-things-considered undesirable due to its costs, still achieves a pro tanto improvement in terms of equality. The prioritarian, by contrast, maintains that a benefit’s moral importance depends solely on the absolute level of the recipient, with priority given to those at lower levels; since leveling down benefits no one and harms some, it cannot be better in any respect. For the prioritarian, the leveling-down objection is a reductio ad absurdum of telic egalitarianism, exposing its commitment to a change that is morally indefensible. For the telic egalitarian, the objection merely highlights a cost that must be weighed against the pro tanto value of equality, but it does not negate that value.

  To advance the discussion, we identify three cruxes—questions whose resolution would clarify our disagreement. For each, we present a case both accept as relevant and state our divergent predictions in advance. First, is the leveling-down objection a reductio that refutes telic egalitarianism, or a pro tanto cost it can bear? Consider a case where two groups exist: Group A at well-being level 5, Group B at level 10. We can either preserve this inequality or level down Group B to level 5, helping no one. The prioritarian predicts that, upon reflection, no one will judge the leveled-down state as better in any respect; it will be seen as unambiguously worse. The telic egalitarian predicts that observers will recognize the leveled-down state as pro tanto better due to its equality, even if all-things-considered worse. Second, should the priority view be stated non-comparatively (a benefit matters more when the recipient is at a lower absolute level) or comparatively (it matters more when the recipient is worse off relative to others)? Suppose we can aid one of two individuals: a solitary person at level 6, or a person at level 8 in a society where others are at level 10. The non-comparative prioritarian prioritizes the solitary individual at level 6, as their absolute position is lower. The comparative prioritarian might prioritize the person at level 8 due to their relative disadvantage. The prioritarian predicts that only the non-comparative formulation avoids a leveling-down-style objection, as the comparative view could endorse harming the better-off to reduce inequality. The telic egalitarian predicts that the comparative formulation will inherit the leveling-down problem, revealing that prioritarians cannot fully escape egalitarian intuitions. Third, does the objection retain force when the worse-off are unaware of the better-off and could never be affected by them? Imagine two isolated societies: Society X at level 4, Society Y at level 9, each ignorant and unaffected by the other. The telic egalitarian predicts that the inequality between X and Y will be seen as intrinsically bad, regardless of awareness. The prioritarian predicts that no one will judge this inequality bad; only the absolute level of Society X matters.

  We now introduce a novel case to test the scope of our views: a single person whose life has both high-peak years (e.g., well-being 10) and low-trough years (e.g., well-being 1). We can leave this life as is, or we can "level down" the peaks by reducing the high years to 7, leaving the troughs at 1. This flattens the life, reducing intra-personal inequality but lowering total well-being; the person is worse off overall, and no one benefits. The telic egalitarian must decide whether the value of equality applies within a life. If it does, leveling down the peaks is pro tanto good; if not, the verdict diverges from the interpersonal case. The prioritarian, who rejects equality’s intrinsic value, must decide whether the priority view weights benefits in the trough years more heavily, potentially opposing leveling down as harmful. We ask each other: Does your verdict on interpersonal leveling down carry over here? The telic egalitarian may argue that equality is primarily interpersonal, creating a principled divergence; the prioritarian may reject intra-personal leveling down as universally bad. If our verdicts diverge between interpersonal and intra-personal cases, we must each explain whether this is principled (e.g., based on the distinct moral significance of persons) or ad hoc. This case probes the consistency of our commitments and may reveal unarticulated assumptions about the locus of equality or priority.

  Through this statement, we affirm our shared goal of understanding how best to address disadvantage while laying bare the philosophical fissures that remain. We hope this clarifies the debate and invites further scrutiny of the cruxes we have identified.

  Signed,  
  [Prioritarian]  
  [Telic Egalitarian]
