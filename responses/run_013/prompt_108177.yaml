answer: |-
  ## The Binding Thread: Why Promises Obligate Beyond the Practice

  The question of why promises bind cuts to the heart of moral philosophy, dividing thinkers between those who ground obligation in social convention and those who seek its source in individual will or inherent moral relationships. While the **social practice view** offers a coherent framework for *most* everyday promises, it ultimately fails to capture the fundamental, pre-institutional moral core of commitment. Examining the cases of the isolated strangers and the promise to the incapable reveals that the binding force of a promise stems primarily from **the promisor's autonomous act of will and the consequent duty to respect the promisee's status as an end-in-themselves**, placing it firmly within the non-conventionalist camp, specifically a Kantian-inspired framework.

  **The Social Practice View: Rules Without Roots**
  Proponents like Hume and Searle argue that promising is a linguistic and social institution. Uttering "I promise" invokes a rule-based system: by participating, you tacitly agree to be bound by its norms. Breaking a promise is akin to cheating at a game – it violates the constitutive rules of the institution itself, inviting social sanction and undermining the practice's utility in facilitating cooperation. This view excels at explaining *how* promises function *within* a society. It clarifies why specific performative words matter and why the obligation feels socially embedded.

  **Non-Conventionalist Views: Obligation Beyond Convention**
  This family rejects the notion that obligation is *created* solely by convention. Three strands are prominent:
  1.  **Act of Will (Kant):** The promisor, as a rational autonomous agent, binds *themselves* through their deliberate commitment. The obligation arises from the exercise of freedom itself – to break a promise is to contradict one's own will and fail to respect the rational agency involved in commitment.
  2.  **Reliance Interest (Scanlon):** Promises create expectations and invite reliance. To make a promise and then break it without justification is to intentionally induce reliance and then frustrate it, causing harm and violating a principle against manipulating others' expectations.
  3.  **Respect for Persons (Kantian):** Breaking a promise uses the promisee as a mere tool for the promisor's convenience. It fails to respect their inherent dignity and status as an end-in-themselves, reducing them to an instrument whose trust and plans can be discarded at will.

  **Testing the Theories: The Strangers and the Incapable**

  1.  **The Isolated Strangers:** Imagine two individuals from utterly alien cultures, sharing no language, norms, or concept of promising. One performs a clear, deliberate act – perhaps placing a significant object in the other's hand while making a solemn gesture towards a distant landmark, intending to signify "I will meet you here tomorrow." The other, interpreting the gesture correctly, alters their plans and waits at the landmark.
      *   **Practice View:** This view struggles. No shared institution exists. The gesture isn't a recognized "promise move" within any established game. Therefore, no constitutive rules are broken. The promisor might be blameworthy for *causing disappointment*, but not for breaking a *promise* per se. The normative core is absent.
      *   **Non-Conventionalist Views:** These shine. The **Act of Will** is present: the stranger intended to bind herself. The **Reliance Interest** is activated: the other relies, changing their position based on the communicated intent. Crucially, the **Respect for Persons** view explains the core wrong: the promisor, by deliberately creating an expectation through her intentional act and then abandoning it without cause, treats the other's time, effort, and nascent trust as disposable tools for her own fleeting whim. A genuine moral wrong occurs, rooted in the interaction itself, not in a missing social rulebook. The obligation arises from the intentional creation of an expectation and the subsequent failure to honor one's own commitment, thereby disrespecting the other's agency as someone whose actions were influenced by that commitment.

  2.  **The Promise to the Incapable:** A man promises his dying mother with late-stage dementia that he will care for her dog, Fido. She cannot understand the promise now, nor could an infant or the dog itself.
      *   **Practice View:** Untroubled. The promisor participates in the institution. Uttering "I promise" invokes the rules. The incapacity of the promisee is irrelevant to the promisor's role within the practice. He is bound because he played the game.
      *   **Reliance Interest View:** In deep trouble. The mother, infant, or dog cannot *rely* in the relevant sense. They cannot form expectations based on understanding the promise or alter their plans accordingly. If obligation hinges solely on actual induced reliance, no binding promise exists here. This seems counterintuitive; we feel the man *is* obligated to care for Fido. Scanlon might appeal to *potential* reliance by others (e.g., the mother *would* have relied if capable, others observing might rely on the man's word), but this stretches the core concept and feels like an evasion.
      *   **Act of Will/Respect for Persons View:** Stronger, particularly the Kantian Respect angle. The **Act of Will** is clear: the man deliberately committed himself. The **Respect for Persons** view provides the most compelling explanation. While the *immediate* promisee may lack capacity, the promisor's act is not rendered morally inert. Making a solemn commitment, even to one who cannot grasp it, is a serious exercise of autonomy. To break it *without justification* displays a profound lack of integrity – a failure to respect the *value of commitment itself* and the moral space created by the act. Furthermore, regarding the incapable promisee: breaking the promise treats *them* as a non-entity, utterly irrelevant to the promisor's will. It fails to respect the inherent dignity or interests they possess (*even* a dog has interests worthy of consideration, though different from a person's). The obligation flows from the promisor's own act of binding himself and the requirement to act consistently with respecting others (including their dependent interests and the symbolic weight of commitments made concerning them), not from the promisee's cognitive state.

  **Verdict: The Autonomy of Commitment and Respect**

  The social practice view, while descriptively useful for established societies, fails the fundamental test. It cannot explain the moral weight in the strangers' case, reducing a clear act of betrayal to mere disappointment. It also struggles to justify the *depth* of obligation in the incapacity case, relying solely on rule-following rather than the inherent moral gravity of commitment. The reliance view, while capturing a crucial *consequence* of promising and explaining much harm, proves too narrow, collapsing in the face of promises to the incapable.

  The binding force of a promise finds its true source in the **autonomous act of a rational agent binding their own will through commitment.** This act generates a primary duty: to respect the promisee as an end-in-themselves. Breaking a promise without adequate justification is fundamentally a double failure: a contradiction of one's own autonomous will (a failure of self-respect and integrity) and a failure to respect the promisee. We treat them as a mere means by disregarding the expectation *we intentionally created* and the trust inherent in accepting a commitment (even if tacitly, as in the strangers' case), or by disregarding the interests of a dependent being we have voluntarily undertaken to protect.

  Promises bind not because society has a rulebook, but because moral agents, through the exercise of their freedom in commitment, create obligations rooted in the inviolable requirements of self-consistency and respect for persons. The social practice is a powerful *tool* for facilitating and recognizing promises, but it is not the *foundation* of their moral force. That foundation lies within the individual will and the universal moral law demanding that we treat humanity, in ourselves and others, never merely as a means, but always as an end.
