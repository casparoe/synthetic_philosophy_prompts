prompt: |-
  so me and my flatmate got into this really long, increasingly heated argument last night about whether protecting habitat is actually good for animals, and it ended with him saying, totally straight-faced, that the kindest thing you could do for the wildlife in a forest might be to pave it. I laughed, then got annoyed, then realized I couldn't actually say why he was wrong. His case goes roughly like this: nature is a slaughterhouse, the vast majority of animals born never make it past infancy — think of a frog or a fish dumping thousands of eggs and almost none of them surviving — and the lives of the ones that do survive are dominated by fear, hunger, and slow death, so a typical ecosystem probably has a net negative welfare. If that's right, then bulldozing it doesn't just harm animals, it reduces the total amount of suffering, and conservationists who "save" a wetland are basically running a factory for misery. I half think there's something to it and half think he's missing something, and I want to needle him about it.

  So: write me a joke about this — a proper little setup-and-punchline, short — that actually turns on the substance of the debate (net welfare of ecosystems, r-strategists and juvenile mortality, whether wild lives are net negative, the weird flip where conservation becomes cruelty), so that someone who's genuinely read about wild animal welfare would laugh and recognize the position rather than think I don't understand it. Don't strawman him; the joke should land *because* the logic is uncomfortably tight, not because it's a cartoon. I don't need citations or a reading list or anything, just the joke itself. After it, give me an honest little note: which empirical or ethical claim the punchline is actually leaning on, how confident you are that that claim definately survives scrutiny, and the single point you're least sure about. Keep it casual, I'm just texting it to him.
