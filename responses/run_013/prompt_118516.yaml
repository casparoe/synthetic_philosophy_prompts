prompt: |-
  You are a philosopher of causation and action theory, with a strong background in the metaphysics of omissions, causal selection, and the relation between causation and norms. I want you to act as a careful conceptual engineer. Do not give me a literature review, a bibliography, or citations. Think carefully, and begin by brainstorming the candidate distinctions that might underlie my verdicts; only then formulate a principle.

  I have been trying to state what I think about causation by omission, and I keep running into trouble. I am interested in causation, not just moral blame, though I suspect the two will not come apart cleanly. In every case below, assume determinism, assume the agent knows the relevant facts, and assume the agent could act easily. My verdicts are these:

  1. A child is drowning in a shallow wading pool. A stranger walking past could pull her out without risk or effort, but does nothing. She drowns. Verdict: the stranger did not cause her death. He is morally monstrous, but the water and her inability to swim caused the death.

  2. A lifeguard employed to watch that same pool is texting instead of watching. She could pull the child out easily, but does not. The child drowns. Verdict: the lifeguard caused the death.

  3. A hiker accidentally kicks a rock loose above a trail. The rock rolls toward another hiker. The first hiker could shout a warning, but does not, because he is embarrassed. The second hiker is injured. Verdict: the first hiker caused the injury.

  4. A bystander sees a rock already rolling from a natural rockfall toward a hiker. The bystander could shout a warning, but does not. The hiker is injured. Verdict: the bystander did not cause the injury.

  5. A doctor fails to prescribe a cheap, effective antibiotic. The patient dies of the infection. Verdict: the doctor caused the death.

  6. A doctor fails to prescribe a drug that would not have worked. The patient dies of the infection. Verdict: the doctor did not cause the death, though the doctor may be negligent for other reasons.

  7. Two strangers are standing near a public pool. A child is about to be trapped by a malfunctioning drain. Each stranger could hit a clearly labeled kill switch, and each knows the other could too. Neither has any special role or duty. Neither hits it. The child dies. Verdict: neither stranger caused the death.

  8. Two lifeguards are on duty at that pool. Each independently could hit the kill switch. Each is required by the job to hit it. Neither hits it. The child dies. Verdict: neither lifeguard individually caused the death; the pair's failure caused it, but not either one alone.

  9. One lifeguard is on duty at that pool, and is the only person who could hit the kill switch. The lifeguard does not hit it. The child dies. Verdict: the lifeguard caused the death.

  10. A village of one hundred people could each donate one dollar to buy medicine that would save a child's life. No one donates. The child dies. Verdict: no individual villager caused the death; the village's collective omission did.

  11. A company programs a self-driving car not to brake for a certain pedestrian edge case. The car does not brake, and a pedestrian dies. Verdict: the company and its programmers caused the death; the car's failure did not cause it, because the car is not an agent.

  12. A poisons B's tea. C sees the poisoned cup and could easily swap it for a clean one, but does not. B drinks the tea and dies. Verdict: A caused B's death; C did not.

  13. A camper starts a campfire, then falls asleep. The fire spreads. He could have stamped it out when he woke briefly, but did not. Verdict: the camper caused the fire damage.

  14. A parent fails to feed an infant. The infant dies. Verdict: the parent caused the death.

  15. A neighbor of that parent could easily feed the infant, but does not. The infant dies. Verdict: the neighbor did not cause the death.

  The pair I cannot reconcile is (2) and (8). In both, a person with a role-based duty could easily have prevented a death, and the death would not have happened if they had acted. In (2) I say the omission caused the death; in (8) I say neither omission caused it. The only difference is that in (8) there is another person who also could have acted. That difference feels morally important, but I cannot see why it should be metaphysically decisive. I also cannot reconcile (10) with (7): in both, no individual seems to be a cause, yet I want to say the village's collective omission caused the death, while I do not want to say the two strangers' collective omission caused the death. And (3) versus (4) makes me worry that creating the risk is doing all the work, while (5) versus (6) makes me worry that counterfactual dependence is doing all the work.

  Here is a tentative principle I have been trying out: an omission causes an outcome just in case (i) the outcome counterfactually depends on the omission against the baseline of what the agent was required or expected to do, and (ii) the omission is a departure from that baseline that is either a breach of a role-specific duty, a failure to mitigate a risk the agent created, or part of a plan to bring about the outcome. I already see that this principle makes causation depend on norms, and that it seems to say each of the two lifeguards in (8) caused the death, which I deny. It also seems to handle (10) only by treating the village as an agent, which I am not sure I want. And it may say the bystander in (4) did not cause the injury only because he had no duty, while the hiker in (3) did cause it because he created the risk; I am not sure that asymmetry is stable.

  Please do the following. First, brainstorm the candidate distinctions that might explain my verdicts. Consider at least counterfactual dependence, but-for causation, normative baselines, role duties, creation of risk, double prevention, redundancy, collective agency, and causal selection. Explain each in your own words. Second, state one or two precise principles, with necessary and sufficient conditions if you can, that best capture my verdicts. Third, test each principle against every case above. Make a table if it helps. Be explicit about which verdicts each principle gets right and which it forces me to give up. Fourth, say what the best remaining principle predicts for two cases I have not listed: (a) an off-duty lifeguard who sees the child drowning and does nothing; and (b) a person who creates a risk, then becomes paralyzed and cannot warn anyone, so the harm occurs. Fifth, give your final adjudication: which of my verdicts should I revise, and what is the most defensible principle of causation by omission that survives the cases? Do not give me a reading list or citations; I care about the principle, not the literature. Think carefully and do not paper over the tensions.
reasoning: |-
  Hmm, this is a fascinating challenge in conceptual engineering for causation by omission. The user has presented 15 carefully constructed cases with clear verdicts and identified specific tensions, particularly between cases 2 and 8, and 10 and 7. They're clearly deeply engaged with the metaphysics of omissions and recognize the normative entanglements.

  First, I need to unpack the candidate distinctions that might explain their pattern of judgments. The key elements seem to be:
  - Counterfactual dependence alone isn't sufficient (cases 1 vs 5 show this)
  - Role duties matter but aren't decisive (2 vs 8)
  - Risk creation appears significant (3 vs 4)
  - Collective scenarios introduce special problems (7,8,10)
  - Normative baselines are lurking everywhere

  The user's tentative principle has merit but stumbles on the lifeguard pair case (8). The core tension is this: why does adding a second capable agent with identical duties negate individual causation in (8) but not in (2)? Their intuition suggests a non-additive view of causation where redundancy changes the metaphysical picture.

  For collective cases, the village (10) feels different from the two strangers (7) because the villagers are part of an unstructured collective while the lifeguards have coordinated duties. This points to institutional agency versus mere aggregates.

  Testing principles against all 15 cases will be rigorous but necessary. The "sufficient reason" principle I'm considering must explain why the texting lifeguard (2) is a cause but each lifeguard in pair (8) isn't - the difference being that in (8), the other's existence provided a complete alternative pathway.

  The off-duty lifeguard test case will be revealing: if role duty is essential, they shouldn't count as cause; if risk-creation dominates, they might. The paralysis case probes whether ability is necessary - if the paralyzed risk-creator isn't a cause, that supports their verdict in (3).

  Looking at their verdicts, I suspect case 15 (neighbor not feeding infant) might need revision - if we take role duties seriously, only the parent should be causal, but the neighbor's ease of action creates pressure. Ultimately, a principle centering on "normatively salient necessary condition" might reconcile most cases while honoring their core intuition that adding redundant preventers negates causation.
answer: |-
  ### Brainstormed Candidate Distinctions
  1. **Counterfactual Dependence**: Whether the outcome *would not have occurred* if the agent had acted. Necessary but not sufficient (e.g., case 1 has dependence but no causation).
  2. **Normative Baseline**: Whether the omission deviates from what the agent *ought* to do (legally, morally, or role-based). Explains lifeguard (2) vs. stranger (1).
  3. **Creation of Risk**: Whether the agent *initiated the threat*. Explains hiker (3) vs. bystander (4).
  4. **Role-Specific Duty**: Special obligations (e.g., lifeguard, parent, doctor) that create a unique causal link when breached.
  5. **Redundancy/Preemption**: Whether others could have prevented the outcome, making the omission non-necessary (e.g., two lifeguards in 8).
  6. **Collective Agency**: Whether a group’s omission is attributable to the collective as a unit, not individuals (village in 10 vs. strangers in 7).
  7. **Agency/Control**: Whether the agent had *exclusive* or *decisive* capacity to prevent the outcome (e.g., solo lifeguard in 9).
  8. **Intentional Design/Plan**: Whether the omission is part of a deliberate causal chain (e.g., company in 11).

  ---

  ### Principles of Causation by Omission
  #### **Principle A (Normatively Anchored Necessary Condition)**  
  An agent’s omission causes outcome O iff:  
  (i) O counterfactually depends on the omission *relative to the agent’s normatively required action*;  
  (ii) The agent had a *non-redundant, decisive capacity* to prevent O (i.e., no other agent could/would have easily prevented it);  
  (iii) The omission breaches a *role-specific duty*, *creates/manifests a risk*, or is *part of a designed causal chain*.  

  #### **Principle B (Sufficient Reason Attribution)**  
  An agent’s omission causes O iff the omission is *the sufficient reason for O’s occurrence* in the actual sequence, meaning:  
  - Without the omission, O would not have occurred *and*  
  - The agent’s inaction is the *only salient, normatively required intervention* that was missing, given their unique position (role, risk-creation, or control).  

  ---

  ### Testing Principles Against Cases  
  | Case | Verdict | Principle A | Principle B |  
  |------|---------|-------------|-------------|  
  | 1    | Not cause | ✓ (no role/risk) | ✓ (stranger not salient reason) |  
  | 2    | Cause   | ✓ (role, non-redundant) | ✓ (lifeguard is sufficient reason) |  
  | 3    | Cause   | ✓ (created risk) | ✓ (sufficient reason: only one who could warn) |  
  | 4    | Not cause | ✓ (no duty/risk) | ✓ (no salient role/risk) |  
  | 5    | Cause   | ✓ (role duty) | ✓ (doctor is sufficient reason) |  
  | 6    | Not cause | ✓ (no counterfactual dependence) | ✓ (no dependence → not reason) |  
  | 7    | Not cause | ✓ (redundant capacity) | ✓ (neither is sufficient reason alone) |  
  | 8    | Neither cause | ✓ (redundant: either could act) | ✓ (neither individually sufficient reason) |  
  | 9    | Cause   | ✓ (non-redundant role) | ✓ (sufficient reason: exclusive control) |  
  | 10   | Collective cause | ✗ (individuals redundant) | ✗ (individual not sufficient reason) |  
  | 11   | Company cause | ✓ (designed chain) | ✓ (programmers are sufficient reason) |  
  | 12   | A cause, C not | ✓ (C redundant; A created risk) | ✓ (A is sufficient reason; C not salient) |  
  | 13   | Cause   | ✓ (created risk + duty to mitigate) | ✓ (sufficient reason: only one responsible) |  
  | 14   | Cause   | ✓ (role duty) | ✓ (sufficient reason: exclusive duty) |  
  | 15   | Not cause | ✓ (no role/risk) | ✓ (not salient; parent is reason) |  

  **Errors**:  
  - **Principle A** fails case 10 (village): Villagers are redundant → no individual cause, but you want *collective* cause.  
  - **Principle B** fails case 10: No individual is the "sufficient reason."  

  ---

  ### New Case Predictions  
  **Case (a): Off-duty lifeguard sees child drown, does nothing.**  
  - **Principle A**: Not cause (no *active* role duty; no risk created).  
  - **Principle B**: Not cause (not "salient reason" without duty; bystander-like).  
  *Your likely verdict*: Not cause (aligns with case 1).  

  **Case (b): Person creates risk, becomes paralyzed, cannot warn; harm occurs.**  
  - **Principle A**: Not cause (no capacity to act → no omission).  
  - **Principle B**: Not cause (inaction not blameworthy omission; paralysis negates "sufficient reason").  
  *Your likely verdict*: Not cause (cf. case 4: no ability to prevent).  

  ---

  ### Final Adjudication  
  **Revise these verdicts for consistency**:  
  - **Case 10 (village)**: You cannot claim *collective* omission caused death while denying *collective* causation for the strangers (case 7) or lifeguards (case 8). Either all collective omissions are causes (if the group is a unit) or none are. Since you reject collective cause in 7 and 8, revise 10: *No individual or collective caused the death*; it was caused by the child’s illness + lack of medicine.  
  - **Case 2 (lifeguard)**: If redundancy negates causation in 8, consistency requires denying causation in 2 *if* others could have acted (but your case specifies no others).  

  **Best Principle (modified Principle B)**:  
  **An omission by agent A causes outcome O iff**:  
  (i) O *would not have occurred* if A had acted as normatively required;  
  (ii) A’s action was the *only salient, normatively required intervention* missing in the causal sequence;  
  (iii) A *had decisive control* (capacity + absence of equally positioned redundant preventers).  

  **Why it works**:  
  - Handles lifeguard pair (8): Neither has *decisive* control (the other could act) → not cause.  
  - Explains village (10): No individual has decisive control (99 others could donate) → not cause (revised verdict).  
  - Resolves 2 vs. 8: Solo lifeguard (9) has decisive control; paired (8) do not.  
  - Explains 3 vs. 4: Hiker (3) *created risk* → their warning is the "salient intervention"; bystander (4) did not.  
  - Justifies 5 vs. 6: Dependence matters (6 lacks (i)).  
  - Grounds norms metaphysically: "Normatively required" fixes the baseline for counterfactuals (e.g., lifeguard *should* watch), but causation requires *actual unique decisiveness*.  

  **Survives tensions**:  
  - Moral blame (e.g., stranger in 1) decoupled from causation.  
  - Risk-creation (3, 13) and role duties (2, 5, 14) make A’s intervention *salient*.  
  - Redundancy (7, 8, 10) negates *decisive control* → no causation.  
  - Collective omissions aren’t causes unless the group is an agent (you reject this).  

  **Final Principle**: Causation by omission requires **counterfactual dependence anchored in normative expectations**, plus **unique decisiveness in actual prevention**. Norms select *which* omissions are causal candidates; metaphysics of control and redundancy determine if they *actually* cause. This respects your intuitions while resolving the pairs.
