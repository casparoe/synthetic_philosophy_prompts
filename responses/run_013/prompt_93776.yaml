prompt: |-
  I'm a novelist — third book, and the first one where the main character is a moral philosopher, which I'm already regretting — and I need help building one specific scene. The scene is her talking herself out of one of her own moral beliefs, in real time, on the page, without the chapter turning into a lecture. I don't want a trolley, I don't want a tidy hypothetical about a runaway train of any kind, and I dont want the standard "and then she realized evolution made her believe it" beat, because everyone's seen that. What I need is the hard direction: one evolutionary debunking argument, one agent, and it lands on one of her moral beliefs but not on the rest of her moral thinking. She drops the first belief — really drops it, it stops doing any work in how she lives — and she does not slide into "so I can't trust any of my moral faculties," and she does not undercut the very reasoning she just used to run the argument on herself. Local without global. The easy version, where the debunking sweeps away everything or where the only belief that survives is something so thin and formal ("pain is bad," "suffering is bad") that no realist ever cared about it, is boring to me; I want the surviving belief to be substantive and contested too, and of roughly the same kind as the one that falls — both about how we treat people, both things a real person could argue about, neither one more abstract than the other. Pick the pair yourself.

  Constraints, because I'm reading this aloud at a workshop and there are two philosophers in the room who will pounce: no divine revelation, no non-natural causal contact between moral facts and our ancestors' brains, no group-selection hand-waving, and no assuming the agent is a saint or a monster — she should be a normal reflective person who can run this argument on herself. The selection story has to be the sort of thing a working biologist wouldn't laugh at. And if you're tempted to save the second belief by having the moral facts themselves do some of the selecting — a "third factor," the direction of the pressure being sensitive to the truth — you can use that, but only if you make it a real causal story rather than a patch, and flag it when you do. One page of prose for the case itself, no bullet points. And if you genuinely think the spec is unsatisfiable as stated — that any debunking that bites one belief this hard can't stay local — say so up front and give me the closest satisfiable thing instead, rather than fudging it.

  Then walk me through it for the workshop. Give me, in this order, with these headings: "The case" (about a page, prose); "Why it lands on the first belief" (a paragraph); "Why the second one survives" (a paragraph); "The load-bearing feature" (two or three sentences, and be ruthless — I want the one thing the whole case hangs on); "Pull the feature out" (a short paragraph on what happens when I remove that thing, and specifically whether the case collapses back into the standard dilemma everyone already knows); "The best objection" (a paragraph, from whoever thinks the argument, if it works at all, works globally — the moral-fictionalist type, who'd say the belief that falls was never true in the first place, so what exactly has she lost? — plus what a realist defender would say about the belief that survives); and finally "What would change my mind" (two or three sentences, and I mean it — the specific consideration that would flip your verdict, or the step in your own reasoning you'd bet is weakest).
reasoning: |-
  Okay, I need to help this novelist create a scene where a moral philosopher character talks herself out of one specific moral belief without undermining her entire moral framework. The user has very specific constraints: no trolley problems, no evolution hand-waves that dismiss everything, and the surviving belief must be just as substantive as the one discarded. 

  First, let's unpack what the user really needs. As a novelist working on their third book, they're likely feeling pressure to get this philosophical scene right, especially with philosophers in the workshop. The core challenge is making a localized evolutionary debunking argument feel authentic and dramatic without becoming a lecture. The character needs to have a genuine epiphany that changes her behavior, not just her abstract beliefs.

  Hmm... the key is finding two morally substantive beliefs that are closely related yet can be separated by evolutionary pressures. After considering options like honesty vs loyalty or fairness vs sanctity, I settle on sexual fidelity vs truth-telling about serious matters. Fidelity has clearer ties to evolutionary mating strategies, while truth-telling about life-threatening situations would have been crucial for group survival regardless of mating contexts.

  For the mechanism, I'm designing a scenario where the character realizes her strong disapproval of infidelity stems from adaptive mate-guarding instincts, triggered when her partner innocently mentions an ex. But crucially, this realization doesn't touch her belief that lying about something like a terminal illness is wrong, because that truth-tolerance would have been selected for in different contexts like coalition-building. 

  The load-bearing feature here is the specificity of the selection pressure - fidelity concerns mate retention specifically, while truth-telling relates to broader coordination. If I remove that distinction, everything collapses into global skepticism. The best objection would be a moral fictionalist claiming neither belief was ever "true," but the realist can counter that truth-tracking mechanisms can be domain-specific.

  I'll need to flag where I'm using a "third factor" (truth-telling being adaptive because true) and keep the biologist-approved selection pressures plausible. The character should react like a normal person - defensive at first, then shaken but not shattered. 

  For the workshop breakdown, I'll structure it exactly as requested: the case narrative first, then analysis sections focusing on why only one belief falls, why the other survives, the critical feature, consequences of removing it, main objections, and finally what would change my mind about this approach.
answer: |-
  Here’s the scene and analysis, designed to meet your constraints—**local debunking without global collapse**, substantive surviving belief, biologically plausible, and dramatically resonant. The case avoids trolleys, thin formalisms, and sweeping skepticism.

  ---

  ### **The Case**
  Dr. Elara Vance stared at the text from her partner: *"Ran into Lena at the café. She’s back in town."* Lena—her partner’s ex, the one who’d ghosted him years ago. Elara’s gut clenched. She’d built her career on the claim that **sexual fidelity is a non-negotiable pillar of moral commitment**—not just pragmatically, but *metaphysically* necessary for human flourishing. Betrayal wasn’t merely painful; it corroded the self.  

  But now, scrolling through her own notes for tomorrow’s lecture on evolutionary ethics, a dissonance hummed. She’d always dismissed "mate-guarding instincts" as reductive. Yet here she was, pulse racing at an innocent mention. *Why this heat?* She pushed deeper. Early hominids faced brutal asymmetry: females invested years in pregnancy and nursing; males could walk away. Genes for obsessive mate-guarding in females—hyper-vigilance, jealousy, even moralizing—would outcompete those for calm detachment. Guarding your genetic legacy wasn’t *moral*; it was adaptive.  

  Elara paced. Her conviction felt innate, sacred. But wasn’t that the point? Evolution *builds* sacredness. She imagined a Pleistocene woman spotting her partner sharing meat with another. That visceral fury? Perfectly tuned to deter defection. Fast-forward: philosophy departments, wedding vows. The feeling hadn’t evolved; the *story* had. She’d plastered Kantian imperatives over a primal scream.  

  She paused at her desk, eyeing a patient file she’d brought home—a terminally ill man whose family begged her not to tell him his prognosis. *"Let him hope,"* they pleaded. Elara had refused. **Truth-telling in life-altering contexts was her other anchor**, non-negotiable. Concealing truth, she’d argued, violated autonomy at its core.  

  But why did *this* belief feel different? Suddenly, the contrast stung. Truth-tolerance wasn’t mate-guarding. In tight-knit bands, surviving drought or predators depended on sharing accurate threats. The liar who hoarded knowledge of a lion’s den got his kin killed—and his genes purged. Truth wasn’t "moral" because it felt pure; it was *literally* life-saving coordination. Like fidelity’s heat, truth’s weight was adaptive. Yet...  

  *No.* She gripped the file. If fidelity’s sacred aura was just a fossilized mating strategy, why wasn’t truth-telling equally suspect? *Context*, she realized. Fidelity’s intensity targets a specific threat: rivals. Its evolutionary "purpose" is monopolizing a partner. But truth’s adaptive pressure was broader: *any* coordination failure could doom the group. The neural machinery for fidelity screams "DANGER: MATE LOSS!" Truth’s machinery whispers "ERROR: COORDINATION FAILURE" across countless scenarios. One is a specialized siren; the other, a general alarm.  

  She sank into her chair, the patient file heavy in her lap. Her certainty about fidelity crumbled—not because it was false, but because its *felt necessity* was a fossil, not a compass. She could still choose commitment, but its moral aura evaporated. Yet the duty to tell the dying man the truth? That held. Not because evolution "got it right," but because its roots weren’t shackled to one ancient fear. She texted her partner: *"Lena’s back? Hope it wasn’t awkward."* The jealousy bled out, leaving only curiosity. The file, though—she’d deliver the prognosis tomorrow. Some duties outgrow their origins.  

  ---

  ### **Why It Lands on the First Belief**  
  The debunking works because **fidelity’s emotional salience** (its "sacred" aura) is *specifically* tied to an adaptive problem with a clear selective signature: mate-poaching in ancestral environments. The intensity and "non-negotiable" feeling map directly to a strategy for mitigating high-cost reproductive defection. When Elara traces her visceral reaction to Lena’s return and links it to the evolutionary logic of mate-guarding—**a targeted solution to a specific threat**—the belief’s emotional and moral scaffolding collapses. It’s exposed as a heuristic dressed in moral robes.  

  ---

  ### **Why the Second One Survives**  
  **Truth-telling in life-altering contexts** survives because its selective pressure was **domain-general and coalition-wide**. While fidelity guards a *specific bond*, truth-telling supports *any cooperative endeavor*—hunting, warfare, resource-sharing—where misinformation is catastrophic. Its neural underpinnings aren’t a klaxon for one threat but a broad error-detection system. Crucially, the value of truth *aligns* with its adaptive function: coordination *requires* accuracy. This "third factor" (truth’s instrumental value) gives the belief a plausible tether to moral truth, even if its emotional weight is evolved. It’s not immune to scrutiny, but it lacks fidelity’s fatal link to a narrow, biologically outdated imperative.  

  ---

  ### **The Load-Bearing Feature**  
  **The specificity of the adaptive threat.** Fidelity’s moral fervor is tied to a singular, evolutionarily legible problem (mate-poaching) with a specialized emotional response. The surviving belief (truth-telling) responds to a diffuse, multi-contextual pressure (coordination failure) with no proprietary emotional signature. Remove this asymmetry, and the debunking globalizes.  

  ---

  ### **Pull the Feature Out**  
  If both beliefs shared a *single* selective pressure (e.g., both tied only to mate retention or only to group cohesion), the argument collapses into global skepticism. Elara would face a false dilemma: either all moral beliefs are "fossils" (reducing ethics to biology) or none are (ignoring evolution). The case works *only* because fidelity’s origins are uniquely narrow and traceable, while truth-telling’s roots are broad and functionally congruent with its moral value.  

  ---

  ### **The Best Objection**  
  *"If evolution fabricated the ‘sacredness’ of fidelity, why assume truth-telling isn’t equally illusory? Both are adaptive fictions. She didn’t ‘discover’ moral truth; she swapped one delusion for another."*  
  **Realist Reply:** Truth-telling’s survival isn’t based on its *indubitability* but on its **functional resilience**. Fidelity’s moral authority depended entirely on a contingent, obsolete pressure. Truth-telling’s authority persists because its function (enabling cooperation) remains essential *and* its success hinges on accuracy—a "third factor" linking adaptive benefit to moral truth. We need not deny evolved origins to affirm that some beliefs track mind-independent values *because* their adaptive logic aligns with those values.  

  ---

  ### **What Would Change My Mind**  
  Two things:  
  1. **If domain-general adaptations can’t plausibly track moral truth.** If all evolved cognition is equally biased (e.g., if "coordination" is just gene-propagation in disguise), the third factor fails.  
  2. **If fidelity’s selective pressure wasn’t truly distinct.** If mate-guarding is just one instance of a broader "betrayal aversion" applying to all commitments (including truth), locality collapses.  

  ---

  **Workshop Notes**:  
  - **The Punch**: Elara loses a belief core to her identity *because* she sees its biological wiring. But she saves another equally substantive belief by showing its evolutionary roots are broader and functionally truth-conducive.  
  - **Why Philosophers Might Nod**: No group selection (pressures are individual/genetic); no non-natural "contact" (third factor is causal and naturalistic); the realist defends truth-telling *without* denying its origins.  
  - **Dramatic Beat**: Her visceral relief texting about Lena vs. steeling herself to deliver the prognosis shows the *local* change. She’s lighter on fidelity, heavier on truth—but neither unmoored.  

  This works because morality isn’t a monolith. Some beliefs are evolution’s puppets; others, its partners. The knife falls where the biology is sharpest.
