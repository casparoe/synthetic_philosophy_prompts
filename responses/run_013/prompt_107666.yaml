  ok so i've been trying to actualy understand the principal principle instead of just nodding along whenever someone says credence should track objective chance. heres the thing thats bugging me. lewis states it roughly as: if you know the objective chance of A is p, and you've got no other information thats relevant, then your credence in A should be p. but then he has to bolt on an admissibility caveat, because sometimes you do have information thats relevant even though it isnt about A directly -- most famously info that undermines the chance itself. i want a genuinely intuitive explanation of whats going on here. specifically:

  1. why cant you just say, flat out, that your credence in A given that the chance of A is p should be p, with no admissibility clause? give me a concrete case where that breaks, and keep the case as simple and non-magical as you can -- i dont want the example to lean on anything exotic.

  2. theres a reformulation that goes something like: your credence in A, conditional on the whole chance distribution (the chances of everything, not just the chance of A), should equal the chance of A. explain intuitively why conditioning on the whole distribution is supposed to sidestep the problem that the admissibility clause was patching, and why thats a different principle from the first one rather than just a restatement of it.

  3. does the admissibility clause still do any independent work once youve got the whole-distribution version, or is it just doing the same job twice? and is there a lurking worry that admissible ends up being defined as whatever makes the principle come out true?

  please dont just hand me the labels people attach to these moves -- i care about the underlying why, and id like the examples to be ones i could sketch on a napkin.
