answer: |-
  ## Exam Question

  **The Robustness Criterion and the Nature of Belief Attribution**

  Daniel Dennett’s intentional stance proposes that we attribute beliefs (and other intentional states) to a system when doing so provides the most efficient, predictive strategy for interpreting its behaviour. This stance famously treats belief attributions as instrumental tools rather than necessarily reflecting internal, causally potent states. We are considering a proposed refinement: the **Robustness Criterion**. This criterion states that a system genuinely *believes* that *p* only if attributing *p* remains the *best predictive strategy* not just for its actual behaviour under normal conditions, but also under significant *interventions* such as:

  *   Retraining the system (e.g., an LLM) on a substantially different corpus of data.
  *   Perturbing its inputs/prompts in non-trivial ways (e.g., adding noise, changing phrasing, introducing ambiguity).
  *   Changing the input modality (e.g., shifting from text to audio inputs for a multimodal system, if applicable).

  The claim is that this criterion distinguishes systems that merely *act as if* they believe *p* (like a thermostat seeming to "believe" it's too cold) from systems that *truly* believe *p*.

  **Evaluate this Robustness Criterion in relation to Dennett’s intentional stance. Specifically: Does this criterion (A) successfully *refine* the intentional stance by providing a principled way to distinguish "real" believers from merely predictable systems? (B) *Covertly abandon* the instrumentalism of the intentional stance in favour of a realist theory of belief (where belief is a causally robust internal state)? Or (C) is it *incoherent* because it attempts to use the stance’s own standard of predictive success to draw a metaphysical line, thereby undermining the stance’s core commitments?**

  **In your answer, you MUST:**
  1.  Clearly explain the intentional stance and the motivation for the Robustness Criterion.
  2.  Reach a reasoned verdict on (A), (B), or (C), defending your choice.
  3.  Explain the role Dennett’s notion of a "real pattern" plays in this debate.
  4.  Address the "too cheap" objection (the worry that the intentional stance makes belief attribution *too* easy, applicable to thermostats and simple chess programs) and explain where this objection gains or loses force in light of the Robustness Criterion and your verdict.

  ---

  ## Model Answer (Approx. 650 words)

  Dennett's intentional stance is a pragmatic, instrumental strategy: we interpret a system as having beliefs and desires if adopting the perspective of its supposed rational agenthood yields the most efficient predictions of its behaviour. Crucially, belief attribution here is *not* committed to the existence of specific, internal, sentence-like representations causally mediating behaviour. Its justification is purely predictive utility. The "too cheap" objection highlights that this seems to allow belief attributions even to simple systems like thermostats ("It believes it's too cold!") or basic chess programs ("It believes moving the queen is good!") where such talk feels intuitively inappropriate or explanatorily shallow.

  The Robustness Criterion (RC) attempts to address this cheapness. It argues that genuine belief requires the *p*-attribution to remain predictively optimal not just for the system's current state and inputs, but under significant counterfactual interventions – retraining, input perturbation, or modality shifts. A thermostat fails because changing its temperature setpoint radically alters its "beliefs"; a robust believer's behaviour, interpreted through *p*, should remain predictable despite such changes. The motivation is clear: real beliefs should be somewhat stable, reflecting underlying cognitive structures resilient to superficial alterations, distinguishing deep cognitive agents from shallow pattern-matchers.

  However, the RC does not merely *refine* the intentional stance (Option A); it *covertly abandons* its core instrumentalism in favour of a realist theory of belief (Option B). The intentional stance is fundamentally about *current predictive strategy*. The RC introduces a requirement for *counterfactual stability* under interventions. This shift is crucial. While predictive success *now* is instrumental, demanding predictive success across a *range of non-actual scenarios* smuggles in a metaphysical claim about the system's inherent, intervention-independent structure. It implies that for a system to *really* believe *p*, there must be some internal architecture or learning history that *causally ensures* the *p*-pattern persists robustly, making the belief attribution track something more than just our current pragmatic success – it tracks a causally robust dispositional property. This moves decisively towards realism, positing belief as a state whose identity and existence are grounded in the system's intrinsic properties and causal capacities, not just our interpretive success.

  The RC is *incoherent* (Option C) only if it strictly requires using the stance's success criterion *alone* to draw a metaphysical line. While it flirts with this incoherence, its deeper flaw is the abandonment of instrumentalism. It borrows the stance's *language* of predictive success but applies it counterfactually to define a property (robust belief) that transcends any single stance application. The intentional stance itself provides no resources for evaluating counterfactuals; it's synchronic. The RC's counterfactuals require assumptions *about the system's underlying nature* – precisely the kind of commitment Dennett sought to avoid.

  Dennett's "real pattern" concept is central here. A real pattern is a predictive abstraction that captures genuine regularities in the world, offering genuine compression of information. The intentional stance identifies belief-attributions as potential real patterns. The RC tries to elevate some stance-based patterns (those robust under intervention) to a *more real* status, implying they correspond to deeper, more objective structures. But Dennett's real patterns are defined *relative to a purpose and observer*. A pattern's "reality" lies in its objective usefulness, not in observer-independent metaphysics. The RC, by demanding counterfactual stability as a mark of "real belief," implicitly seeks a purpose-*independent* grounding for belief, conflicting with the stance's instrumentalist foundations. It mistakes a pragmatically *useful* feature of some patterns (robustness) for a mark of metaphysical reality.

  The "too cheap" objection gains its intuitive grip precisely where instrumentalism feels explanatorily shallow – attributing beliefs to thermostats seems unilluminating. The RC attempts to restore depth by demanding counterfactual resilience. However, under the verdict that RC abandons instrumentalism, the "too cheap" objection isn't *solved* by the RC; it's *sidestepped* by changing the subject to realism. If we accept RC, belief is no longer "too cheap" because it's now defined by robust causal structure, making thermostats ineligible. But this abandons Dennett's core project of understanding belief as an essentially interpretative, success-based phenomenon. The objection only *loses* force if one embraces the realism the RC covertly introduces. Within a pure intentional stance framework, the "too cheap" charge highlights a pragmatic cost (attributions may be less useful for very simple systems), not a metaphysical flaw the RC can coherently fix without betraying instrumentalism.

  Therefore, the Robustness Criterion, while responding to a valid intuition about the difference between deep and shallow cognition, does not refine the intentional stance. It abandons its instrumentalism by smuggling in a requirement for counterfactual stability grounded in causal realism about internal states, attempting to use the stance's predictive language to define a state that inherently transcends any single application of the stance.

  ---

  ## Marking Scheme (20 points total)

  Candidates must hit the following points. Award **4 marks per point** based on clarity, accuracy, and integration into the argument.

  1.  **Clear Explanation of Intentional Stance & Robustness Criterion (RC):**
      *   *Must-hit:* Accurately defines intentional stance (predictive strategy based on rationality assumption, instrumentalist, no commitment to specific internal states) and RC (belief requires p-attribution remains best predictor under specified interventions like retraining, input perturbation). Mentions "too cheap" motivation.
      *   *Common Loss:* Vague definitions, conflating stance with realism, misstating RC interventions, omitting "too cheap" context.

  2.  **Verdict & Defense (Abandonment - Option B):**
      *   *Must-hit:* Argues RC covertly abandons instrumentalism in favour of realism. Key argument: RC's reliance on *counterfactual stability* under interventions implies a commitment to the belief attribution tracking a causally robust, intrinsic property/disposition of the system, beyond mere current predictive utility.
      *   *Common Loss:* Choosing refine (A) without addressing counterfactual leap; choosing incoherent (C) without sufficient justification for why it's *incoherent* rather than just realist; weak defense of chosen verdict; failing to identify the counterfactual element as the critical shift.

  3.  **Role of "Real Pattern":**
      *   *Must-hit:* Explains Dennett's "real pattern" (predictive abstraction offering compression, reality defined by usefulness relative to purpose/observer). Argues that RC tries to use robustness to elevate some stance-based patterns to a "more real" (metaphysically grounded) status, conflicting with the instrumentalist, purpose-relative nature of real patterns.
      *   *Common Loss:* Defining "real pattern" incorrectly (e.g., as observer-independent), not connecting it to the stance/instrumentalism, failing to explain how RC misuses the concept by seeking purpose-independent grounding via robustness.

  4.  **Addressing "Too Cheap" with Verdict:**
      *   *Must-hit:* Explains the "too cheap" objection (stance allows implausible attributions e.g., to thermostats). States that under the "RC abandons stance" verdict, the RC doesn't *solve* the objection within instrumentalism but *sidesteps* it by redefining belief realistically (making thermostats ineligible by fiat). Notes that within pure stance, "too cheap" highlights pragmatic cost, not metaphysical error solvable by RC without betrayal.
      *   *Common Loss:* Claiming RC directly solves "too cheap" without acknowledging the shift to realism; not linking the analysis of "too cheap" to the chosen verdict; misunderstanding the objection itself.

  5.  **Coherence/Incoherence Analysis:**
      *   *Must-hit:* (In support of Option B verdict) Acknowledges the *incoherence charge* (using stance's success test to draw metaphysical line) but argues the primary issue is *abandonment*. Explains that while RC borrows predictive language, its demand for counterfactual stability requires assumptions about underlying causal structure that the synchronic stance itself doesn't provide, moving beyond instrumentalism.
      *   *Common Loss:* Fully endorsing incoherence (C) without strong argument for why it's *impossible* (rather than just realist); ignoring the incoherence charge; conflating incoherence with mere difficulty of applying counterfactuals.
