answer: |-
  Below is a decision tree for positions on the permissibility of trading across different value systems, structured to meet your specifications. The tree is built from the logical space of the problem, with each internal node posing a question answerable without prior knowledge of the resulting position. Branches are exhaustive where possible, and omissions are noted. The tree yields 10 leaves (within your 9–12 range) and separates all requested views. Each leaf includes a named position (or "unnamed") and one sentence on the commitment its defenders find hardest to accept.

  ### Decision Tree

  **Node 1: Can the values in the two systems be meaningfully compared for the purpose of trade?**  
  *(This addresses whether trade presupposes comparability. If values are incommensurable, trade may be impossible or irrational.)*  
  - **No (values are incommensurable)** → **Leaf 1: Incommensurability View**  
    Hardest commitment: Trade is impermissible because no common scale exists to weigh gains/losses, rendering mutual benefit illusory.  
  - **Yes (values are commensurable)** → **Node 2**  

  **Node 2: Are the two value systems reducible to a single underlying value?**  
  *(This tests whether the apparent conflict masks a deeper unity. If reducible, trade may not be "across" systems.)*  
  - **Yes (monism)** → **Leaf 2: Monism/Illusion View**  
    Hardest commitment: Trade is permissible but trivial, as the parties are mistaken that they hold distinct values.  
  - **No (pluralism)** → **Node 3**  

  **Node 3: Does the permissibility of the trade depend primarily on the process of agreement?**  
  *(This distinguishes process-focused views from content/consequence views. Public justification falls here.)*  
  - **Yes** → **Node 4**  
  - **No** → **Node 5**  

  **Node 4: Must the process satisfy a public-justification test?**  
  *(This isolates public-reason liberalism. Other process views are omitted for focus; they are rare and often collapse into justification or consequentialism.)*  
  - **Yes** → **Leaf 3: Public Justification View**  
    Hardest commitment: Trade is impermissible unless justifiable to all affected parties, even if it would improve outcomes.  
  - **No** → *Omitted (other process views, e.g., procedural fairness)*: Rarely defended alone; usually bundled with public justification or consequences.  

  **Node 5: Are there constraints that forbid trading certain values?**  
  *(This identifies sacred-value or integrity-based limits. If no constraints, trade may be fully permissible.)*  
  - **No (no constraints)** → **Node 6**  
  - **Yes** → **Node 7**  

  **Node 6: Must the trade avoid harming third parties?**  
  *(This separates constrained from unconstrained Pareto views.)*  
  - **Yes** → **Leaf 4: Constrained Pareto View**  
    Hardest commitment: Trade is permissible only if Pareto-improving and harmless to third parties, regardless of how objectionable the outcomes are to the traders.  
  - **No** → **Leaf 5: Unconstrained Pareto View**  
    Hardest commitment: Trade is permissible if Pareto-improving for traders, even if it imposes severe harms on third parties.  

  **Node 7: Is the constraint due to the nature of the value or its effect on the agent?**  
  *(This distinguishes sacredness in values from corruption in agents.)*  
  - **Nature of the value (sacredness)** → **Leaf 6: Sacred Values (Value-Based)**  
    Hardest commitment: Trade is impermissible if it violates a sacred value, regardless of net benefits (e.g., saving lives cannot justify endorsing animal suffering).  
  - **Effect on the agent (corruption)** → **Node 8**  

  **Node 8: Whose integrity is at stake—the individual or the collective?**  
  *(This separates personal corruption from institutional degradation.)*  
  - **Individual** → **Leaf 7: Agent Integrity View**  
    Hardest commitment: Trade is impermissible if it corrupts the individual’s character, even when it objectively improves the world.  
  - **Collective** → **Leaf 8: Collective Integrity View**  
    Hardest commitment: Trade is impermissible if it degrades the group’s shared purpose or identity, even for large gains.  

  **Node 3 → No → Node 5 → No → Node 6** leads to Pareto views, but **Node 3 → No → Node 5** also requires:  
  **Node 9: Can the negotiation permissibly transform the parties' preferences?**  
  *(This addresses whether preferences are fixed or malleable. Added here for exhaustiveness; omitted under process/constraints as it rarely interacts decisively there.)*  
  - **Yes** → **Leaf 9: Preference Transformation View**  
    Hardest commitment: Trade is permissible only if it revises preferences toward alignment, making compromise a tool for moral progress rather than mere deal-making.  
  - **No** → **Leaf 10: Fixed Preferences View**  
    Hardest commitment: Trade must treat preferences as fixed inputs, so gains are measured only against current desires, not idealized ones.  

  ---

  ### Summary of Leaves
  1. **Incommensurability View** (Leaf 1): Trade is irrational/impossible.  
  2. **Monism/Illusion View** (Leaf 2): Trade is permissible but not truly "across" values.  
  3. **Public Justification View** (Leaf 3): Trade requires public reason.  
  4. **Constrained Pareto View** (Leaf 4): Trade requires no third-party harm.  
  5. **Unconstrained Pareto View** (Leaf 5): Trade ignores third-party harm.  
  6. **Sacred Values (Value-Based)** (Leaf 6): Sacredness is in the value itself.  
  7. **Agent Integrity View** (Leaf 7): Trade corrupts the individual.  
  8. **Collective Integrity View** (Leaf 8): Trade corrupts the group.  
  9. **Preference Transformation View** (Leaf 9): Trade should reshape values.  
  10. **Fixed Preferences View** (Leaf 10): Trade accepts current preferences.  

  ---

  ### Unseparated Pairs and Empty Branches
  - **Unseparated pairs**:  
    - **Agent Integrity View (Leaf 7) and Collective Integrity View (Leaf 8)**: The tree separates these, but only by the bearer of integrity (Node 8). They share the core claim that trade corrupts, so they might be seen as variants of one view. The failure to further separate them is a defect of the tree, as they are distinct in emphasis but not in core logic.  
    - **Sacred Values (Value-Based) (Leaf 6) and Agent Integrity View (Leaf 7)**: The tree separates these (Node 7), but both forbid trade for non-consequentialist reasons. They could be conflated if "sacredness" is interpreted as tied to identity, but the tree treats them as distinct.  
    - **Preference Transformation View (Leaf 9) and Fixed Preferences View (Leaf 10)**: The tree separates these (Node 9), but both are compatible with many higher branches (e.g., they could apply under constrained Pareto). This is intentional, as the question is orthogonal to constraints/processes.  

  - **Empty branches**:  
    - **Node 4 → No**: Omitted branch for non-justification process views (e.g., "trade is permissible if decided by coin flip"). This is empty because such views are incoherent—they ignore reasons for trade and lack defenders.  
    - **Node 6 → No (Unconstrained Pareto View, Leaf 5)**: This branch is not empty but unattractive, as it licenses harmful externalities. Few defend it, but it exists in radical contractarianism.  
    - **Node 3 → Yes → Node 4 → No**: Omitted as above.  

  ---

  ### Tree Notes
  - **Exhaustiveness**: Branches cover all major positions. Omissions (e.g., non-justification processes) are explicitly noted and justified by rarity or incoherence.  
  - **Requested Views Separated**:  
    - Constrained Pareto (Leaf 4) vs. Unconstrained Pareto (Leaf 5) via Node 6.  
    - Sacred Values: Value-based (Leaf 6) vs. Agent-based (Leaf 7/8) via Node 7.  
    - Public Justification (Leaf 3) via Node 4.  
    - Agent corruption (Leaf 7) vs. World improvement (e.g., Pareto views).  
    - Incommensurability (Leaf 1) vs. Monism (Leaf 2) via Nodes 1–2.  
    - Illusion of trade (Leaf 2) directly addressed.  
  - **Logical Flow**: Nodes start with meta-ethical questions (comparability, monism), then move to normative ones (process, constraints), and end with practical distinctions (third parties, preference transformation). This ensures positions "come apart" at each node.  

  This tree maps the logical space of your dilemma, providing a scaffold for exploring the four incompatible versions you encounter. To use it, trace your intuitions through the nodes—each answer sharpens the underlying commitments.
