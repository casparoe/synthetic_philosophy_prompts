prompt: |-
  I sit on the marriage-recognition commission of a small jurisdiction whose statute says only that marriage is "the union of two persons for life." Our precedents so far: we recognized the marriage of two men in their seventies who married chiefly for companionship and to pool pensions, and our written reasons said that the absence of children, and the fact that the couple did not describe their bond as romantic or sexual, were not our concern; we recognized the marriage of a same-sex couple who had lived on different continents for years, on the ground that their mutual commitment and interdependence were genuine; we refused a marriage between a man and a woman who testified that they married only to obtain a residency permit and intended to dissolve it once it was granted; and we refused a three-person union, though our reasons stressed that one member had been pressured into it and that the household was not characterized by mutual care rather than that the number three was itself disqualifying. The petition before us is from two men, both asexual, who have been in a committed, exclusive, non-sexual partnership for a decade and now wish to marry, stating that they intend a lifelong union of care and shared life but no sexual relationship. Predict how we should rule if we are to be consistent with ourselves, identify the candidate rules our precedents might be running and what each predicts here, give your best guess with reasons, and name the further case that would best distinguish those rules.
reasoning: |-
  Okay, let me approach this methodically. The user presents a complex legal scenario involving marriage recognition in a jurisdiction with minimal statutory guidance ("union of two persons for life"), and asks for a consistent application of precedents. 

  First, I need to parse the precedents carefully: 
  The commission consistently looks beyond surface characteristics (like romance or cohabitation) to examine functional indicators of lifelong commitment. The pension-seeking gay couple was approved despite lacking romantic/sexual elements, the long-distance couple was approved based on mutual commitment, while residency-permit marriage was denied due to fraudulent intent. The three-person denial notably avoided making group size the primary rationale.

  The current petition involves asexual men seeking marriage without sexual component. This directly echoes the first precedent where lack of sexuality was deemed irrelevant. The key differentiator seems to be whether the core commitment is genuine versus transactional. Here, their decade-long exclusive partnership clearly demonstrates non-transactional interdependence.

  The residency-permit case sets the clearest boundary: marriage as legal instrumentality without commitment is void. But these petitioners explicitly describe lifelong care and shared life - aligning with the approved cases. 

  I notice the commission avoids creating bright-line rules (like requiring cohabitation or sexuality), instead examining the relationship's substance. This suggests a "functional commitment test" is emerging. Under that framework, this petition should succeed.

  The best stress-test case would be a platonic partnership formed specifically for legal benefits, but with demonstrable mutual care - forcing the commission to decide between intent and functional reality. That hypothetical would reveal whether the jurisprudence truly centers on commitment or veers into moral judgment about relationships.
answer: |-
  Based on your precedents and statutory language, here's the analysis:

  **1. Prediction for Consistent Ruling: APPROVE the marriage.**

  *   **Reasoning:** Your commission has consistently focused on **genuine mutual commitment and lifelong interdependent union**, while explicitly rejecting disqualifiers based on:
      *   Absence of children or romantic/sexual elements (70s Men Case).
      *   Physical separation if commitment remains (Long-Distance Couple Case).
      *   Form over substance (Residency Permit Denial).
      *   Arbitrary numerical limits *as a primary reason* (Three-Person Denial - note the emphasis on lack of mutual care/pressure).
      *   The petitioners here present a decade-long, committed, exclusive, non-sexual partnership with explicit intent for lifelong care and shared life. This aligns perfectly with the core values recognized in your approvals (genuine lifelong union) and avoids the pitfalls of your denials (fraudulent intent, lack of genuine mutual care/pressure).

  **2. Candidate Rules Emerging from Precedents & Predictions:**

  *   **Rule A: Functional Commitment Test**
      *   **Definition:** Marriage exists where there is a demonstrable, genuine, mutual commitment to a lifelong interdependent union of care and shared life, irrespective of romantic/sexual elements, cohabitation status, or procreative potential.
      *   **Source:** 70s Men Case (ignored lack of romance/sex/children), Long-Distance Couple Case (ignored physical separation, focused on commitment/interdependence), Residency Permit Denial (rejected lack of genuine commitment), Three-Person Denial (focused on lack of mutual care, not number).
      *   **Prediction for Current Case:** **APPROVE.** The petitioners demonstrate a decade of commitment, exclusivity, and interdependence, explicitly promising lifelong care and shared life. The lack of sex is irrelevant under this rule.

  *   **Rule B: Intent-Based Lifelong Union (Minus Fraud)**
      *   **Definition:** Marriage requires a present intent to form a lifelong union between exactly two persons, where the intent is genuine (not fraudulent or instrumental) and the relationship structure implies some level of mutual care/interdependence.
      *   **Source:** Statute ("union of two persons for life"), Residency Permit Denial (rejected fraudulent intent), Three-Person Denial (implied two-person limit by distinguishing on other grounds, but didn't make it primary). The 70s Men and Long-Distance cases fit within this framework.
      *   **Prediction for Current Case:** **APPROVE.** The petitioners are two persons explicitly stating intent for a lifelong union of care and shared life. There's no evidence of fraud or instrumentality (like the residency case). The lack of sex doesn't negate the stated intent for a lifelong union.

  *   **Rule C: Presumptive Romantic/Sexual Union (unless proven otherwise by commitment)**
      *   **Definition:** Marriage presumes a romantic/sexual bond, *unless* the couple demonstrates such a profound level of mutual commitment, interdependence, and lifelong intent that the absence of romance/sex is overcome.
      *   **Source:** The 70s Men Case *explicitly stated* the absence wasn't their concern, but the fact it was mentioned suggests it's a common assumption overcome by evidence. The Long-Distance case involved a couple presumably romantic/sexual. The current petitioners feel the need to explicitly address the lack of sex.
      *   **Prediction for Current Case:** **APPROVE (but potentially borderline).** The decade-long committed, exclusive partnership demonstrating interdependence likely provides sufficient evidence to overcome the presumption, similar to the 70s Men overcoming concerns about romance/sex/children. However, this rule might create more scrutiny for non-traditional bonds.

  **3. Best Guess with Reasons:**

  *   **Ruling:** **APPROVE.**
  *   **Primary Reason:** **Consistency with the Functional Commitment Test (Rule A),** which is the strongest thread running through your precedents. The 70s Men Case is the most directly analogous and controlling: your commission *already ruled* that the absence of romantic/sexual elements does not disqualify a marriage if the lifelong commitment and union are genuine. The current petitioners meet this core requirement based on their decade-long history and stated intent.
  *   **Supporting Reasons:**
      *   They satisfy the statutory requirement of being "two persons" seeking a "union... for life."
      *   There is no evidence of the fraudulent intent that disqualified the Residency Permit case.
      *   Their relationship exhibits the mutual care and interdependence your commission values, unlike the pressured dynamic in the Three-Person case.
      *   Denying them based *solely* on the lack of a sexual component would directly contradict the logic of the 70s Men Case and potentially introduce an arbitrary disqualifier your precedents have avoided.

  **4. The Further Case to Best Distinguish the Rules:**

  *   **The Case:** **A petition from two elderly siblings (e.g., brother and sister, both never married) who have lived together interdependently their entire adult lives (50+ years), sharing finances, property, care, and social life as a primary unit. They explicitly state they have no romantic or sexual feelings for each other, but wish to marry primarily for legal/financial security (inheritance, pensions, medical decisions) and to formalize their profound lifelong bond of care and commitment.**
  *   **How it Distinguishes the Rules:**
      *   **Rule A (Functional Commitment):** **Likely APPROVE.** The relationship demonstrates extreme longevity, profound interdependence, mutual care, shared life, and lifelong commitment – the core functional elements. The lack of romance/sex and the sibling relationship are irrelevant if the functional commitment exists. The instrumental benefits are a consequence, not the fraudulent *purpose* seen in the Residency case.
      *   **Rule B (Intent-Based Lifelong Union):** **Likely APPROVE (but possibly borderline).** They intend a lifelong union between two persons. The intent appears genuine regarding their bond, even if the *primary trigger* for legal formalization is instrumental. It lacks the fraudulent *intent to dissolve* seen in the Residency case. However, some might argue the *primary motivation* being instrumental edges too close to fraud, despite the genuine underlying bond.
      *   **Rule C (Presumptive Romantic/Sexual):** **Likely DENY.** The sibling relationship and explicit lack of romantic/sexual feelings make it virtually impossible to fit within the presumed model of marriage, regardless of the depth of commitment and interdependence. The commission might feel this fundamentally changes the nature of the union recognized by the statute and society.

  This case starkly contrasts the rules by forcing a choice: Does the *functional reality* of a lifelong committed, interdependent union between two consenting adults qualify, regardless of its *nature* (sibling, platonic) or *primary motivation* for formalization? Or is the traditional romantic/sexual dyad, or at least the *absence* of a familial bond, an inherent (if unstated) requirement? Your ruling on this sibling case would definitively reveal which rule truly governs your commission's jurisprudence.
