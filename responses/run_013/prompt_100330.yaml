prompt: |-
  so i've somehow ended up on the board of my housing co-op (40 units, we bought the building in 2019, meetings are 3 hours of chaos) and the newest member is extremely online and keeps pitching futarchy at us -- the Hanson thing where you vote on the outcome you want and then a prediction market tells you which policy actually delivers it, and you just do that. he wants it for the big calls: raise rents to fund the roof, ban short-term rentals, blow the reserve on solar. i'm not against it on principle, i just dont want to be the one who agreed to bet the roof on a market that four people trade in.

  before i take a side at the next meeting i want the actual spec, not the pitch. write me the desiderata for any theory of prediction markets used as a decision device in a governance setting -- what does such a theory have to be able to deliver before i should trust it with a real decision? i want the requirements list: the cases it has to get right, the distinctions it can't collapse, the results it has to be consistent with, each with the consideration behind it. for the cases, use the weird ones i actually care about:

  - our metric (repairs completed, member satisfaction, monthly cost per unit) gets chosen by the board -- i.e. by us -- and we also run the policy the market is predicting. the thing being measured and the thing doing the measuring are the same body.
  - it's a one-off decision. no repeat trials, so no track record, so i can never check whether the market was right. someone suggested a second market on "was the first market's call actually good, in hindsight" and i honestly can't tell if that fixes anything or just moves the problem up a level.
  - the traders would be us -- the same 40 people who are affected and who are also the only ones with any real information. so is the price aggregating dispersed info or just re-reporting what we already all think?
  - a member with strong views can trade to push the price, and if the market is binding then moving the price is how you win, so manipulation becomes the rational play. if it's only advisory the manipulation is cheap but pointless.
  - the metric is one number but the policy helps some members and hurts others, badly and unevenly.

  also tell me which of the requirements are genuine and which are just a camp's prejudice, whether any pair of them can't be jointly satisfied (if so, say so plainly -- that's the part i most want), and which single requirement does the most to knock out the plausible designs. then briefly score futarchy-as-pitched, markets-as-advisory-only, and just letting a citizens assembly or a couple of outside experts decide, against the list.

  please commit. don't lay out both sides and leave me to pick, i have a meeting thursday -- give me your actual position with reasons, and flag where you'd bet against your own list. no reading list, i wont read it.
reasoning: |-
  Alright, the user is on the board of a housing co-op and dealing with a member pushing futarchy for major decisions. They need a clear set of criteria to evaluate if prediction markets are trustworthy in their specific context. Let me break down their concerns.

  First, the user mentioned their governance setup: 40 members, same group measuring and implementing policies. The key issues are reflexivity, one-off decisions, and potential manipulation. They need a checklist to assess futarchy's viability.

  The user's explicit needs are the desiderata for prediction markets in governance. But deeper, they want to avoid catastrophic decisions, ensure fairness, and not waste time on unworkable solutions. They might also need to confidently counter the futarchy advocate in the meeting.

  I should outline must-have requirements. Reflexivity is critical because the board sets the metric and enforces policies, creating feedback loops. One-off decisions mean no verification, so the market must handle uncertainty without hindsight. Trader overlap means information isn't dispersed; it's concentrated among members with conflicts of interest.

  Manipulation is a big risk. A motivated member could trade to sway prices, especially if the decision is binding. Uneven impact of policies adds fairness concerns—aggregate metrics might ignore individual harms.

  I recall prediction market theories assume diverse, independent traders. Here, traders are few and involved, breaking those assumptions. Also, thin markets are easily manipulated. Without repeated trials, there's no data to calibrate accuracy.

  Conflicting requirements: Independence vs. Information Dispersal. Members have info but aren't independent due to conflicts. Reflexivity vs. Verifiability—decisions can't be verified, undermining trust.

  Futarchy as pitched fails on reflexivity, independence, and robustness. Advisory markets might inform but don't bind, reducing manipulation risk. Citizens' assemblies or experts avoid market flaws but have their own biases.

  The strongest knockout is reflexivity. If the body measuring outcomes also influences them, markets can't isolate policy effects. That alone makes futarchy unsuitable here.

  Prioritizing requirements: reflexivity and independence are genuine must-haves. Thin-market robustness is critical with only 40 traders. The user needs a practical alternative—citizens' assembly or experts—to propose instead.
answer: |-
  Here's the specification you need – the non-negotiable requirements for trusting a prediction market as a binding governance tool in your co-op context, based on your real-world constraints. I'll be direct: **Futarchy, as pitched, is fundamentally unsuited to your situation and dangerously naive here.** My position: **Vote against implementing binding futarchy.** Use advisory markets cautiously or opt for a citizens' assembly if you need external input.

  **Core Desiderata for Governance Prediction Markets (The "Must-Haves"):**

  1.  **Robustness to Thin Markets & Manipulation:**
      *   **Requirement:** The market design must produce reliable price signals *even with very few active traders (e.g., <10)* and be demonstrably resistant to manipulation attempts by a single actor or small coalition using relatively small capital.
      *   **Why:** Your 40 members = tiny potential trader pool. Active participants will likely be <10. A motivated member *can* and *will* try to move the price if the decision is binding and impacts them significantly. Manipulation isn't just possible; it's the rational strategy when stakes are high and markets are thin.
      *   **Case:** Member heavily invested in Airbnb wants to prevent a ban. They buy "YES" shares on the "Ban STRs reduces satisfaction?" market aggressively to push the price high, signaling the ban is bad, even if they believe the opposite. Binding decision = they win cheaply.
      *   **Genuine/Political:** Genuine *requirement*. Thin markets are your reality.

  2.  **Resolution Independence & Verifiability:**
      *   **Requirement:** The metric defining the outcome must be objectively measurable, verifiable, and *immune to manipulation or reinterpretation by the governing body whose policy is being evaluated*.
      *   **Why:** You *are* the governing body defining the metric *and* implementing the policy. Reflexivity is fatal. You could unconsciously (or consciously) influence the measurement. "Satisfaction" is notoriously fuzzy – how is it polled? By whom? When? "Repairs completed" – does quality matter? Who defines "completed"?
      *   **Case:** Market predicts "Policy X increases satisfaction." Policy X is implemented. Board (same as traders) runs a satisfaction survey with leading questions/timing bias. Result is spun to match/contradict the market prediction based on who "won." The market outcome cannot be objectively verified *by the same entity it governs*.
      *   **Genuine/Political:** Genuine *requirement*. Reflexivity is inherent in your setup.

  3.  **Trader Independence & Information Dispersal:**
      *   **Requirement:** Traders must possess genuinely dispersed, diverse information *and* trade based on that information, not their direct stake in the outcome. Conflicts of interest must be mitigated.
      *   **Why:** Your traders *are* the affected parties with direct stakes. Their information isn't dispersed private signals; it's shared context plus personal bias. Trading becomes about influencing the binding outcome, not revealing aggregated truth. "What I know" is entangled with "What I want."
      *   **Case:** Trader knows the roof *is* failing (private info), but believes raising rents to fix it will cause hardship and lower their own satisfaction. Do they trade truthfully on the roof needing repair, or try to manipulate the market to avoid the rent increase?
      *   **Genuine/Political:** Genuine *requirement*. Your setup inherently violates the core assumption of dispersed info *without* conflicts.

  4.  **Handling One-Off Irreversible Decisions:**
      *   **Requirement:** The theory must provide strong justification for trusting the market's prediction *without the possibility of empirical validation or learning from repeated trials*.
      *   **Why:** Roof replacement, major solar investment, STR bans – these are unique events. You can't run 100 trials. You get one shot. The "market check" market just kicks the can – how do you trust *that* market? It creates an infinite regress problem.
      *   **Case:** Market says "Blow reserve on solar = lowers cost long-term." You do it. Energy prices crash/skyrocket unrelatedly. Was the market right? You'll *never know*. Trust must be built-in *a priori*.
      *   **Genuine/Political:** Genuine *requirement*. Your decisions are inherently one-off.

  5.  **Distributional Insensitivity Awareness:**
      *   **Requirement:** The market design/theory must explicitly acknowledge that optimizing a single aggregate metric (e.g., average satisfaction, average cost) can mask severe, uneven harms to minorities within the group. It cannot *solve* this, but must not *hide* it.
      *   **Why:** Policies have winners and losers. A rent hike might be "good" for reserves but force out low-income members. A STR ban might increase community cohesion but devastate someone relying on that income. The market price won't reflect this skew.
      *   **Case:** Market predicts "Raise rents 15% = Improves reserve health metric." True for the aggregate reserve, but forces 3 members to sell. The market doesn't capture this distributional catastrophe.
      *   **Genuine/Political:** Genuine *acknowledgement requirement*. Markets are inherently poor at equity.

  **Conflicts & Knockouts:**

  *   **Fatal Conflict: Independence/Info Dispersal vs. Reflexivity/Verifiability.** Your setting requires traders with *no stake* in the outcome (for truthful trading) and *perfect information* (to predict effects), while simultaneously requiring the governing body *with a stake* to objectively measure the outcome *caused by their own actions*. **These are logically incompatible.** You can't be both the impartial measurer and the self-interested actor being measured. This alone knocks out *any* binding market design in your co-op.
  *   **Strongest Knockout Requirement: Reflexivity/Verifiability (#2).** The fact that the body defining success, implementing policy, *and* (in this case) trading *cannot* objectively verify its own policy's effect relative to the counterfactual is a showstopper for binding decisions. It makes the entire exercise ungrounded.
  *   **Second Strongest Knockout: Thin Market Robustness (#1).** With ~40 members and likely <10 active traders, markets *will* be thin and manipulable. Theoretical market efficiency requires scale and liquidity you simply don't have.

  **Scoring the Options:**

  1.  **Futarchy-as-Pitched (Binding Markets):**
      *   **#1 (Thin Markets):** **FAIL.** Wildly vulnerable to manipulation by a single motivated member. High stakes guarantee attempts.
      *   **#2 (Reflexivity/Verifiability):** **CATASTROPHIC FAIL.** Board sets metric, implements policy, likely trades. No objective verification possible. Self-deception/manipulation inevitable.
      *   **#3 (Independence/Info):** **FAIL.** Traders = stakeholders with shared info, not dispersed signals. Conflicts dominate.
      *   **#4 (One-Off):** **FAIL.** No validation possible, blind trust required in an untrustworthy setup.
      *   **#5 (Distribution):** **FAIL.** Aggregates to one number, ignores distributional pain.
      *   **Verdict:** **DO NOT USE.** It pretends objectivity where none exists and invites manipulation. A recipe for chaos, resentment, and bad decisions.

  2.  **Markets-as-Advisory-Only:**
      *   **#1 (Thin Markets):** **WEAK (But less dangerous).** Still manipulable, but since it's not binding, manipulation is pointless unless trying to sway opinion. Less incentive.
      *   **#2 (Reflexivity/Verifiability):** **MAJOR CONCERN.** Same reflexivity problem. Advisory signal might still be biased/gamed, but less pressure.
      *   **#3 (Independence/Info):** **CONCERN.** Conflicts still exist, potentially biasing the advice.
      *   **#4 (One-Off):** **CONCERN.** Still can't validate if the advice was good.
      *   **#5 (Distribution):** **FAIL.** Still ignores distribution.
      *   **Verdict:** **CAUTIOUS, LIMITED USE POSSIBLE.** Could *potentially* surface insights if run anonymously and focused on clearly measurable outcomes (e.g., "Will roof repair cost exceed $X by Y date?"). **Never binding.** Use as *one* noisy data point, heavily discounted due to conflicts and reflexivity. Probably more hassle than it's worth.

  3.  **Citizens Assembly / Outside Experts:**
      *   **#1 (Thin Markets):** **N/A.** Not a market. Robustness irrelevant.
      *   **#2 (Reflexivity/Verifiability):** **PARTIAL WIN.** Outsiders *can* provide more objective measurement/evaluation than yourselves. Not perfect, but *better* reflexivity. Clearer separation.
      *   **#3 (Independence/Info):** **WIN (Experts) / PARTIAL (CA).** Experts bring independent knowledge. A *well-selected* Citizens Assembly (CA) of *disinterested* outsiders (not co-op members!) *might* have less conflict but less specific info. Better than self-trading.
      *   **#4 (One-Off):** **NEUTRAL.** Still one-off, but experts/CAs can articulate reasoning/uncertainty better than a market price.
      *   **#5 (Distribution):** **PARTIAL WIN (CA) / CONCERN (Experts).** A CA *can* be designed to hear diverse impacts. Experts might focus on aggregate. Both *can* be instructed to consider equity.
      *   **Verdict:** **BEST VIABLE OPTION FOR MAJOR DECISIONS.** A small panel of **outside experts** (e.g., structural engineer + accountant for the roof; housing policy expert + lawyer for STR ban) provides focused, independent (though not infallible) advice based on *reasoning* you can debate. A **properly constituted Citizens Assembly** of disinterested locals is good for values-based decisions (like STR bans), forcing consideration of diverse impacts. Both avoid the fatal reflexivity and manipulation traps of self-run markets.

  **My Bet Against My List (Briefly):** I'd bet *against* my requirement #3 (Independence/Info) being *as* critical *if* the market was purely advisory, very liquid (1000s of traders), and the metric was hyper-objective (e.g., "Will it rain on the roof repair date?"). But none of those hold for you. In *your* context, the list holds.

  **Recommendation:** Shut down the binding futarchy proposal firmly. It's inappropriate and dangerous for your small, self-governing co-op. If the member wants data, consider commissioning **short, focused reports from 1-2 relevant outside experts** for major capital decisions (roof, solar). For deeply value-laden decisions (STR ban), hold a **structured discussion** or consider a **well-facilitated member workshop** focusing explicitly on distributional impacts. Your time is better spent improving meeting facilitation than building prediction markets. Good luck Thursday. Argue the fatal reflexivity point first – it's the concrete blocker.
