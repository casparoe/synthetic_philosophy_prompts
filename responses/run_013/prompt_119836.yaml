  Next, the modal question: does domination require nearby possible worlds where abuse occurs? If the Custodian's benevolence is necessary across all possible worlds, then no such risk exists. I'm skeptical that we can guarantee this metaphysical necessity, so I'll set P(modal capacity required) at 0.4.

