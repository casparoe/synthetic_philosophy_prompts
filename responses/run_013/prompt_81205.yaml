prompt: |-
  I'm in a reading group that keeps going in circles on the discursive dilemma and I have to present next week, but I don't want to walk through the three-person example again — everyone's seen it, it's turned into a party trick. What I actually want is the spec. Before we judge any rule that turns a bunch of people's individual judgments into one collective judgment, what does such a rule have to deliver?

  Give me the desiderata list. For each one: state it plainly, then give me the case or consideration that puts it on the list — the situation where a rule that violates it does something we can't live with. The obvious ones can be quick (the collective verdicts should be logically consistent; nobody's vote should count for more than anyone else's; no single person should get their way no matter what the others think; the verdict on one proposition shouldn't turn on what people think about the unrelated ones; if more people come around to your view that shouldn't make your view lose). What I mostly want are the ones people leave off the list, especially:

  - the difference between a rule that hands back an inconsistent set of verdicts and one that just hands back no verdict at all on some proposition. Is 'must always deliver a verdict on everything' a real requirement, or is it the demand thats generating most of the trouble?
  - the fact that somebody has to choose which propositions get voted on and in what order, and that voting them one at a time in different orders lands you in different places even when the propositions are the same. Is 'the outcome must not depend on the order' a genuine desideratum or is it asking too much?
  - the same three people, same three propositions, but the agenda handed to them in a logically equivalent but differently packaged form — the third item written as a conjunction rather than as a conditional, say. If the outcome flips, has the rule violated something on my list, or is that just a fact about majorities we have to swallow?
  - voters who are themselves inconsistent, or who vote strategically once they can see the agenda. Does the rule have to be robust to that, or is that somebody else's theory's problem?

  Then: which subset of the requirements can't be satisfied together? I'm expecting at least one impossibility in there and I want to see exactly which requirements it eats. Tell me which single requirement is doing the most excluding work — the one that, if I dropped it, would let the most plausible rules back in — and flag any pair on the list that's already in tension before we even get to a theorem. The bar is a rule I'd actually trust in a real committee deciding something that matters, not philosophical bulletproofing.

  Definately skip the reading list and the tour of named theorems — I want the criteria and the reasoning behind them, I'll fill in the literature myself.
reasoning: |-
  Okay, the user is in a reading group stuck on the discursive dilemma. They're presenting next week and want to avoid rehashing the three-person example. Instead, they need a clear list of desiderata for judgment aggregation rules. They want each desideratum explained plainly with a case showing why it's necessary. They're particularly interested in less obvious ones and specific tensions between them.

  First, I recall the discursive dilemma involves aggregating individual judgments on logically connected propositions into a collective set. The classic example is three judges voting on premises and a conclusion. Majority voting on each separately can lead to inconsistency. The user wants to move beyond that.

  The user’s main requests are:
  1. **Desiderata List**: They want each stated plainly with a case illustrating why violating it is unacceptable. They mention some obvious ones (consistency, equality, no dictatorship, proposition-wise independence, monotonicity) but want focus on the less obvious.
  2. **Specific Quirks**: 
     - Must the rule always deliver a verdict on every proposition? Or is allowing "no verdict" acceptable?
     - How does agenda-setting affect outcomes? Is order-independence a real requirement?
     - What if the propositions are repackaged logically (e.g., conjunction vs. conditional)? If the outcome flips, is that a violation?
     - Should the rule handle inconsistent voters or strategic voting?
  3. **Impossibilities**: Which subsets of requirements conflict? Which single requirement is the strictest? They want a rule that’s practical for real committees.

  Breaking down the desiderata:
  - **Obvious Ones**:
    - **Universal Domain**: Rules must handle any possible input. If violated, a rule might fail when faced with a common voting pattern.
    - **Collective Rationality**: Output must be consistent and complete. But completeness might be too strict—maybe allowing "no verdict" on some propositions is okay?
    - **Anonymity**: Equal weight for each voter. Violation leads to unfair influence.
    - **Non-dictatorship**: Avoid one person dominating. Obvious why this is bad.
    - **Systematicity**: Independence of irrelevant propositions and same voting rule applied uniformly. Violating this allows agendas to manipulate outcomes.
    - **Monotonicity**: More support shouldn’t hurt. Reverse outcomes when gaining support are counterintuitive.

  **Less Obvious/Quirky Desiderata**:
  - **Completeness vs. Consistency Trade-off**: Must every proposition get a verdict? The user questions if demanding completeness causes trouble. In the discursive dilemma, majority voting is consistent only if incomplete. So, relaxing completeness might help—allowing "no verdict" on some issues to maintain consistency.
  - **Agenda- and Path-Independence**: Outcomes shouldn’t depend on the order of voting or how propositions are presented. If repackaging a proposition (e.g., "P∧Q" vs. "¬P∨Q") changes the outcome, that’s manipulable and unreliable. Path-independence is crucial for fair aggregation but hard to achieve with majority rule.
  - **Robustness to Strategic Voting or Inconsistent Voters**: Should the rule handle insincere voting? If voters are inconsistent, should the rule correct that? The user might be hinting that real committees face these issues, so a practical rule needs some robustness. However, requiring full strategy-proofing is likely too strong and leads to impossibilities.

  **Tensions and Impossibilities**:
  - The big impossibility theorem (List-Pettit) shows that universal domain, collective rationality, anonymity, and systematicity can’t all be satisfied. Systematicity is the key culprit—it forces proposition-wise independence and uniform decision rules, which clashes with consistency when propositions are interconnected.
  - Relaxing systematicity allows rules like premise-based or conclusion-based aggregation, which prioritize certain propositions. But these are vulnerable to agenda manipulation.
  - Collective rationality (consistency + completeness) is also strict. Relaxing completeness (allowing gaps) avoids inconsistency. For example, the "no verdict" approach in some sequential methods.
  - Anonymity vs. path-independence: Anonymity is easily dropped for specialized rules, but that might not be acceptable for egalitarian committees.

  **User’s Deeper Needs**:
  - They want a practical rule for real committees, not philosophical perfection. So, identifying which desiderata can be relaxed is key. For instance, in a real setting, allowing incomplete verdicts or accepting some agenda-dependence might be necessary trade-offs.
  - They need to clarify why certain requirements conflict. Highlighting systematicity as the main bottleneck makes sense—it’s the requirement that forces independence, causing inconsistencies in interconnected decisions.
  - The mention of strategic voting suggests they’re thinking about real-world applicability. While robustness is ideal, it’s often too demanding. Maybe flagging that as a separate challenge beyond basic aggregation is sufficient.

  **Structuring the Response**:
  1. List each desideratum plainly with a violation case.
  2. Address the specific quirks with focused explanations.
  3. Highlight the impossibility (systematicity conflicting with consistency) and suggest relaxations.
  4. Emphasize practical trade-offs: dropping systematicity allows premise-based approaches; dropping completeness avoids inconsistency. Path-independence is nice but hard to achieve without sacrificing other values.
answer: |-
  You're right to push beyond the three-person example—it's illustrative but overused, and the real meat is in the criteria we use to evaluate judgment aggregation rules. Below is a stripped-down desiderata list for a rule that turns individual judgments on logically interconnected propositions (e.g., "P", "Q", and "P∧Q") into a collective set of judgments. I'll state each requirement plainly, then give you a concrete case showing why violating it is unacceptable in a real-world committee context. I'll prioritize the less obvious or often-overlooked ones you flagged, and end with the key tensions/impossibilities. No fluff, just the specs.

  ---

  ### Core Desiderata (The "Must-Haves" for a Trustworthy Rule)
  1. **Universal Domain**  
     *Plainly*: The rule must handle *any possible combination* of individual judgments, no matter how incoherent or contradictory the voters are.  
     *Why we can't live without it*: If violated, the rule fails when people hold unexpected but plausible views.  
     **→ Violation Case**: A rule only works if all voters agree on at least one proposition. In a real committee, if two factions emerge (e.g., progressives vs. conservatives), the rule crashes. Unacceptable—you need output even with deep disagreement.

  2. **Collective Rationality (Consistency + Completeness)**  
     *Plainly*: The collective output must be *logically consistent* (no contradictions) and *complete* (a verdict on every proposition).  
     *Why we can't live without consistency*: Inconsistent verdicts force self-defeating actions.  
     **→ Violation Case** (Consistency): Majority voting on "P", "¬P", and "P∨Q" might approve both "P" and "¬P". A city council can't simultaneously fund and defund a project.  
     *Completeness is trickier—see "Quirks" below.*

  3. **Anonymity**  
     *Plainly*: All voters have equal weight; permuting votes doesn't change outcomes.  
     *Why we can't live without it*: Fairness demands equal say.  
     **→ Violation Case**: A rule gives extra weight to the committee chair. The chair's view on a policy (e.g., "Taxes should rise") overrides a 9-1 majority against it. Unjust in a democratic setting.

  4. **Non-Dictatorship**  
     *Plainly*: No single voter dictates the collective outcome.  
     *Why we can't live without it*: Defeats the purpose of a committee.  
     **→ Violation Case**: If Alice always determines the verdict (e.g., her "yes" on a merger forces collective approval), the group is a sham.

  5. **Systematicity**  
     *Plainly*: (a) **Proposition-wise independence**: The collective verdict on a proposition depends *only* on individual votes for *that* proposition (ignoring votes on others). (b) **Uniformity**: The same voting rule (e.g., majority) applies to every proposition.  
     *Why we can't live without it*: Prevents manipulation via irrelevant issues.  
     **→ Violation Case**: If the verdict on "We should build a park" depends on votes about an unrelated budget item, outcomes become arbitrary. Also, if majority rule applies to "P" but supermajority to "Q", the rule is unpredictably biased.

  6. **Monotonicity**  
     *Plainly*: If more voters support a proposition, it shouldn't hurt its chances of winning.  
     *Why we can't live without it*: Incentivizes honest participation.  
     **→ Violation Case**: A policy gains support but loses because a voter switches from "no" to "abstain". This discourages persuasion and rewards tactical silence.

  ---

  ### The Quirks (Where Things Get Messy)
  7. **Completeness vs. Consistency Trade-off**  
     *Plainly*: Must the rule *always* deliver a verdict on every proposition? Or can it sometimes output "no verdict" (incompleteness) to preserve consistency?  
     *The case for requiring completeness*: Committees need actionable decisions. "No verdict" on critical issues (e.g., "Is the defendant guilty?") is a cop-out.  
     **→ Violation Case if Relaxed**: A jury deadlocks on a verdict, forcing a retrial—costly and frustrating.  
     *The case against demanding completeness*: It's the source of most trouble. Forcing a verdict can *create* inconsistency.  
     **→ Saving Grace**: If a rule outputs "no verdict" on "P∧Q" when individual judgments on "P" and "Q" conflict, it avoids collective inconsistency. Acceptable in low-stakes cases (e.g., a committee skipping a divisive but minor resolution).  
     ***Verdict for real committees***: **Completeness is negotiable**. High-stakes decisions need it; for complex issues, allowing gaps beats inconsistency. But this relaxes Collective Rationality.

  8. **Agenda- and Path-Independence**  
     *Plainly*: Outcomes shouldn't depend on (a) the *order* propositions are voted on, or (b) how propositions are *logically packaged* (e.g., "P∧Q" vs. "¬P∨¬Q").  
     *Why it feels necessary*: Order/packaging dependence lets a chair manipulate outcomes by framing the agenda.  
     **→ Violation Case (Order)**: Voting sequentially on "P", then "Q", then "P∧Q" yields approval of all three with majority rule. But voting on "P∧Q" first leads to rejection, then "P" and "Q" pass individually—creating inconsistency. Real-world result: A committee "supports" a policy's parts but rejects the whole.  
     **→ Violation Case (Packaging)**: "If P then Q" is logically equivalent to "¬P or Q", but a majority approves one and rejects the other due to framing. Unjustifiable in principle.  
     ***Verdict***: **Path-independence is a genuine desideratum** but often unattainable. Without it, the rule is vulnerable to gaming—unacceptable for high-stakes decisions.

  9. **Robustness to Voter Pathology/Strategy**  
     *Plainly*: Must the rule handle (a) voters with inconsistent judgments, or (b) strategic voting (lying to manipulate outcomes)?  
     *The case for robustness*: Real committees face both. Ignoring it makes the rule brittle.  
     **→ Violation Case (Inconsistent Voters)**: Alice votes "P" and "¬P" simultaneously. A rule that copies her judgments makes the collective output inconsistent. Unacceptable if the rule doesn't filter this.  
     **→ Violation Case (Strategy)**: Voters misrepresent their views on "P" to ensure "Q" fails. A rule vulnerable to this produces illegitimate outcomes (e.g., a minority view wins via lies).  
     ***Verdict***: **Robustness is ideal but secondary**. For basic aggregation, we assume sincerity and minimal rationality. Strategy is a separate problem (mechanism design). But in practice, a good rule should minimize incentives for strategy—e.g., by satisfying monotonicity.

  ---

  ### The Tensions and Impossibilities
  **The core impossibility**: You can't satisfy all of **Universal Domain**, **Collective Rationality** (consistency + completeness), **Anonymity**, and **Systematicity** simultaneously. This is the heart of the discursive dilemma.  
  - **Which requirements are most fragile?**  
    - **Systematicity is the killer**. It demands proposition-wise voting, which ignores logical connections. Drop this, and plausible rules emerge.  
    - **Completeness is the next-best candidate to drop**. Allow "gaps," and consistency becomes achievable.  
    - **Path-independence is often sacrificed** to avoid worse evils.  

  **Trade-offs for a practical committee rule**:  
  - **If you keep Systematicity**, you must relax Collective Rationality (allow inconsistency) or Completeness (allow gaps). *Example*: Majority voting per proposition—simple but inconsistent.  
  - **If you drop Systematicity**, you can:  
    - Prioritize consistency via **premise-based voting** (vote only on "root" propositions, derive others logically).  
      - *Tension*: Vulnerable to agenda-setting (e.g., which propositions are "premises"?).  
    - Prioritize completeness via **conclusion-based voting** (vote only on the final proposition, ignore premises).  
      - *Tension*: Lacks nuance ("how" decisions are made matters).  
  - **If you demand path-independence**, you'll likely sacrifice Anonymity or Universal Domain. *Example*: Rules using "supermajority thresholds" for interconnected issues—but this gives small minorities veto power.  

  **The single requirement doing the most excluding work**: **Systematicity**. Drop it, and you open the door to the most plausible real-world rules (e.g., premise-based voting). Keep it, and you're stuck with inconsistency or incompleteness under majority rule.  

  **Trustworthy rule for a real committee?**  
  - **Premise-based voting** (drop Systematicity, keep Consistency/Completeness) is your best bet. It:  
    - Identifies key premises (e.g., "Does the evidence prove guilt?"), votes on those, derives conclusions logically.  
    - Avoids inconsistency and agenda-manipulation *if* premises are well-chosen.  
    - *Downside*: Sensitive to how premises are selected (a meta-committee problem).  
  - **Sequential majority with fallbacks** (drop Completeness) works for messy issues: Vote sequentially, but if inconsistency emerges, output "no verdict" on the problematic proposition.  

  **Final note**: No rule satisfies all desiderata—aim for "good enough." In practice, **premise-based voting + transparency about premises** is robust for high-stakes decisions (e.g., juries, policy boards). Avoid rules that violate monotonicity or anonymity—they corrode trust. And always document the agenda to mitigate path-dependence.
