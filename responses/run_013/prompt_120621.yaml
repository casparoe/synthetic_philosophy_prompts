prompt: |-
  I chair the ethics consultation service at a mid-sized teaching hospital, and I would like you to take on the role of a philosopher of practical ethics who is unusually good at building protocols — someone who knows the literature on moral dilemmas, moral residue, and the distinction between a hard choice and an impossible one, and who can compress it into something a committee can run in forty-five minutes without having read any of it. Our service receives roughly twenty consultations a month. Most are ordinary: questions of capacity, surrogate disagreements, discharge planning. But a growing share arrive with the same framing — the requesting team says there is no right answer here, or both options are wrong, or we cannot win either way. Within about forty-eight hours, usually before a family meeting, we owe the chart a one-page opinion; the attending then acts on it, and nobody is bound by what we say. The committee is six people: me, a bedside nurse, a chaplain, the hospital's lawyer, a community lay member, and the clinician who requested the consult. We have no power to decide anything; we can only say what we think and, if we are honest, either shield or fail to shield the person who has to choose. Our problem is that when a case gets hard we have exactly one move. Someone says it is a genuine dilemma, everyone nods, and the note concludes that either course is defensible. Sometimes that is the truth. Sometimes it is how we avoid a call we could have made, and sometimes it is a factual dispute or a policy gap wearing philosophical clothes.

  Please write me a procedure the committee can run on every consultation, in order, that sorts the case into one of a small fixed set of verdicts — something along the lines of genuine dilemma, hard choice with a better and a worse option, resolvable conflict, policy gap, and misuse of dilemma language to dodge responsibility — and specifies for each verdict what we must produce. That means: when we owe the decision-maker cover and when we should instead name a preferred course and defend it; when we should send the case back for facts; when the real answer is that the institution must declare a value it has never declared; and, in the cases we do call dilemmas, what is owed afterwards to the option that was not taken — an apology, compensation, follow-up with a bereaved family, a change to the policy that manufactured the trap. Two constraints. First, the procedure must not presuppose that genuine dilemmas exist. One colleague argues that a genuine dilemma is incoherent, because obligations that cannot be jointly fulfilled would not both be obligations, and he will veto anything that treats the existence of dilemmas as an assumption; the chaplain holds that the residue people feel after choosing is evidence the dilemma was real. I need a procedure both can sign, which means it must be able to certify a case as a dilemma without settling the metaphysics, and it must be explicit about which of its steps are conceptual commitments rather than observations. Second, it must terminate in one of the fixed verdicts. If the honest output is that it depends, then the procedure has failed, and I would rather you tell me that than paper over it. Some consults come at two in the morning from a resident who needs an answer before an operation, so say which steps can be skipped under that kind of pressure and which cannot.

  Start by laying out the distinctions you intend to rely on, and why the ones you discard are less useful, then give me the procedure as an ordered list of questions, with what counts as a sufficient answer to each and where the procedure stops. Then run it on three cases. The first: a family asks that a diagnosis be withheld from a patient who has said he would rather not be told, and then the family itself asks the nurses direct questions about his prognosis, so the team feels caught between honesty, the patient's stated preference, and the family's request. The second: one remaining course of an expensive therapy and two patients who both meet the criteria, a thirty-four-year-old with a reversible condition and a long recovery ahead, and a seventy-one-year-old who is the sole carer for a grandchild with a disability; the team insists there is no right answer, and I suspect the procedure will tell me that my committee should refuse to decide the case and instead force a policy the hospital has spent years avoiding — an answer I will not enjoy defending upstairs, so do not soften it. The third: a patient discloses in confidence that a relative who drives a school bus has been drinking before work; the relative is identifiable, the risk is real but not imminent, and the patient forbids any disclosure. Add a few lines on a fourth kind of request, one that arrives mainly because the attending wants cover against a threatened lawsuit. Finally, tell me where the procedure will misfire or be gamed, and say plainly what it cannot do. I have no interest in citations or a reading list; reason it out from what you know, and think carefully about the cases where the classification itself is the contested question.
reasoning: |-
  We are designing a procedure to sort ethics consultations into one of five verdicts:
  1. Genuine Dilemma
  2. Hard Choice (with a better and worse option)
  3. Resolvable Conflict
  4. Policy Gap
  5. Misuse of Dilemma Language (to dodge responsibility)

  The procedure must:
  - Not assume the existence of genuine dilemmas (so we must define "genuine dilemma" in a way that is metaphysically neutral, perhaps as a situation where the committee cannot identify a single right course of action, without asserting that no right course exists in an absolute sense).
  - Terminate in one of the five verdicts (no "it depends").
  - Be executable in 45 minutes by a committee that hasn't read the literature.
  - Specify for each verdict what the committee must produce (e.g., cover, a recommendation, a referral, etc.).
  - Work under time pressure (some steps skippable for urgent cases).

  Distinctions we will rely on:

  1. **Hard Choice vs. Impossible Choice (Dilemma):** 
     - A hard choice is one where there is a better and a worse option, even if both are bad. 
     - A dilemma (if we allow the term) is one where there is no better option, and choosing either course involves a profound moral cost that leaves residue.

     But note: We are not committing to the metaphysical existence of dilemmas. We are using "dilemma" as a label for cases where, after analysis, the committee cannot identify a better option. The residue (if it occurs) is a psychological fact that we note without asserting it as evidence of metaphysical reality.

  2. **Moral Residue:** We take this as a psychological phenomenon that may occur after a choice. It is an observation, not a commitment to any theory. We will use it as a flag that the case might be a dilemma (if residue is expected) but not as a necessary condition.

  3. **Resolvable Conflict:** This is when the conflict arises from a misunderstanding, lack of communication, or factual error that can be corrected. If resolved, the dilemma disappears.

  4. **Policy Gap:** When the conflict arises because the institution lacks a policy to handle a recurring situation, and the case is not about a unique moral conflict but about the absence of rules.

  5. **Misuse of Dilemma Language:** When the framing as a dilemma is used to avoid making a tough but clear call, or to dodge responsibility.

  We discard:
  - Detailed taxonomies of ethical theories (utilitarianism, deontology, etc.) because the committee doesn't have time to apply them.
  - The distinction between moral distress and moral residue (though distress might be a sign of misuse or a policy gap, we'll keep it simple).
  - The concept of "tragic choices" as separate from dilemmas because we are folding that into the dilemma category.

  Procedure:

  We will have a sequence of questions. The committee must answer them in order. At each step, if the answer matches a verdict, they stop and output that verdict and the required product. If not, they go to the next question.

  We also note that for urgent cases (like the 2am consult), some steps can be skipped. We mark those as [SKIPPABLE in urgent cases]. The non-skippable steps are the core.

  Ordered List of Questions:

  1. **Is there a factual dispute or uncertainty that, if resolved, would make the choice clear?**
     - If YES: Then this is a **Resolvable Conflict**. The committee must send the case back for fact-finding. The product is a note specifying the missing facts and who should obtain them. The committee does not make a recommendation until the facts are in.
     - If NO: Move to next question.
     - [This step is SKIPPABLE in urgent cases if the facts cannot be obtained in time. Then proceed to next step.]

  2. **Is the conflict arising because of an absence of an institutional policy that should exist?** (e.g., allocation of scarce resources, disclosure protocols, etc.)
     - If YES: Then this is a **Policy Gap**. The committee must not make a decision for this case but instead recommend that the institution develop a policy. The product is a note to the administration (with a copy in the chart) stating the gap and the need for a policy. The attending is advised to make a temporary decision (if urgent) and note the policy gap.
     - If NO: Move to next question.
     - [This step is not skippable because even in urgent cases, if it's a policy gap, the institution must be alerted so the same problem doesn't recur.]

  3. **Can the committee identify one course of action as better than the alternatives?** (Consider: which option best balances the ethical principles at stake? Which minimizes harm? Which best respects autonomy? Which is most consistent with institutional values? The committee must attempt to rank the options.)
     - If YES, and the better option is clear: Then this is a **Hard Choice** (with a better and worse option). The committee must name the better option and defend it. The product is a note that recommends that course and explains why. The committee also notes the moral costs of the choice (if any) and may recommend support for those affected (including the decision-maker) to address residue.
     - If NO, because the committee cannot agree on a better option OR because the options seem equally balanced in a way that choosing either leaves profound moral costs: Then move to the next question.

  4. **Is the framing as a dilemma being used to avoid responsibility?** (Look for: evidence that the team is using "no right answer" to avoid a tough but necessary call, or to shift blame; or when one option is clearly required by policy or law but is being avoided because it is unpleasant.)
     - If YES: Then this is **Misuse of Dilemma Language**. The committee must call this out and state the obligation. The product is a note that identifies the correct course of action (which may be the one being avoided) and explains why the dilemma framing is inappropriate.
     - If NO: Move to next question.

  5. **After all the above, does the committee still perceive the situation as one where there is no better option and where choosing either course will involve a profound moral cost?** (Note: This is the "genuine dilemma" verdict. We are not asserting that such dilemmas exist in an absolute sense, but that the committee, after analysis, cannot identify a better option and expects moral residue.)
     - If YES: Then this is a **Genuine Dilemma**. The committee must note that either course is defensible and that the decision-maker is not at fault for choosing either. The product is a note that explains the dilemma and the moral residue. Importantly, the committee must also specify what is owed to the option not taken (e.g., an apology to affected parties, a memorial, a review to prevent recurrence, or even compensation if applicable). This step is crucial for addressing the residue.
     - If NO: The procedure has failed. But by design, we have exhausted the categories. So this should not happen. If the committee gets here and cannot say yes, then perhaps they should revisit step 3 and 4. However, we must have a termination. So we say: If the answer is no, then by default we treat it as a Hard Choice and the committee must choose the best option (even if by a vote) and defend it. But note: the procedure is designed so that step 5 is only reached when step 3 and 4 have been passed, so step 5 should be the last resort.

  Now, we run the procedure on the three cases:

  **Case 1: Disclosure Dilemma**
  - Patient has said he does not want to know his diagnosis. Family is asking nurses about prognosis. Team feels caught between honesty, patient's autonomy, and family's request.

  1. Factual dispute? 
     - The family is asking questions. The patient's preference is known. The conflict is about what to disclose to the family given the patient's wish. No missing facts. → No.
  2. Policy gap? 
     - There might be a policy on disclosure to family when the patient has requested confidentiality. If the hospital has no such policy, then yes, it's a policy gap. But let's assume there is a general policy that patient confidentiality must be maintained unless the patient authorizes disclosure. The problem is the family's persistent questions. So, if the policy exists and is clear, then no gap. If the policy doesn't cover this scenario, then gap. → For the sake of example, assume the hospital has a policy that patient information can only be disclosed to family with patient consent. So, no gap. → Move to 3.
  3. Can we identify a better option?
     - Option A: Disclose to the family (violating patient's confidentiality and autonomy) to be honest with them and reduce their distress.
     - Option B: Refuse to disclose to the family (upholding patient's autonomy) but be less than fully honest in answering their questions (e.g., "I cannot discuss that without the patient's permission").
     - The better option is B: Respecting the patient's autonomy is paramount. The team can offer to help the family communicate their concerns to the patient, but they cannot breach confidentiality. → So this is a **Hard Choice**. The committee recommends option B and explains that the moral cost is the family's distress, which should be addressed with support (e.g., social work).

  Verdict: **Hard Choice** with a clear recommendation.

  **Case 2: Resource Allocation**
  - One dose left of an expensive therapy. Two patients: 34yo with reversible condition (long recovery) and 71yo who is sole carer for a disabled grandchild. Team says no right answer.

  1. Factual dispute? 
     - The medical facts seem clear: both meet the criteria. No missing facts that would resolve it. → No.
  2. Policy gap? 
     - Yes. The hospital should have a policy for allocating scarce resources. Without one, this is a recurring problem. The committee must not decide this case. → **Policy Gap**. The product is a note to the administration: "This case highlights the urgent need for a resource allocation policy. The attending must make a temporary decision (e.g., by lottery or by an ad hoc committee) but the institution must develop a policy."

  Verdict: **Policy Gap**. The committee refuses to decide the case and instead forces the policy issue.

  **Case 3: Confidentiality and Public Safety**
  - Patient discloses that a relative (school bus driver) drinks before work. Patient forbids disclosure. Risk is real but not imminent.

  1. Factual dispute? 
     - We might need to know: How severe is the drinking? How imminent is the risk? But the patient forbids disclosure, so we cannot investigate. The risk is "real but not imminent" as given. → We have the facts we can get. → No.
  2. Policy gap? 
     - There should be a policy on when confidentiality must be breached for public safety. Most institutions have policies based on the Tarasoff case (duty to warn). If the hospital has a policy, then no gap. If not, then gap. → Assume there is a policy that if there is an imminent threat to an identifiable person, disclosure is permitted. But here the risk is not imminent. So the policy might not cover it. → If the policy doesn't cover non-imminent threats, then it's a policy gap. But let's say the policy requires imminence. Then the policy doesn't apply, so we must decide without policy. → Move to 3.
  3. Can we identify a better option?
     - Option A: Disclose to authorities to protect children (but break confidentiality and the patient's trust).
     - Option B: Maintain confidentiality (respecting autonomy) but risk harm to children.
     - The committee must weigh: The risk is real but not imminent. The harm to children could be catastrophic. The duty to warn might override confidentiality. The committee may decide that A is the better option because the potential harm is so great. → Then it's a **Hard Choice**. They recommend disclosure and note the moral cost (breaking trust, which may deter others from seeking help) and suggest follow-up (e.g., post-disclosure counseling for the patient).
     - Alternatively, if the committee believes the non-imminence makes the risk too speculative to override confidentiality, then they might choose B. But note: the risk is real and the relative is identifiable. In most ethics frameworks, non-imminence does not eliminate the duty if the harm is severe and likely. So they should choose A.

     But what if the committee cannot agree? Then we move to step 4 and 5.

  4. Misuse of dilemma language? 
     - The team might be framing it as a dilemma to avoid the unpleasantness of breaking confidentiality. But in this case, the team hasn't framed it as a dilemma; they are asking for guidance. So no misuse. → Move to 5.
  5. Genuine dilemma?
     - If the committee truly cannot decide (e.g., split vote), then they would say it's a genuine dilemma. Either course is defensible. But they must specify what is owed: If they disclose, they owe the patient an apology and an explanation. If they don't disclose and harm occurs, they owe a review and perhaps a change in policy. However, given the stakes, I suspect the committee will choose one option as better. But if not, then **Genuine Dilemma**.

  In practice, I think this case is likely to be a Hard Choice (with a recommendation to disclose) but it might be controversial.

  **Fourth Kind of Request: Cover against Lawsuit**

  - Example: A patient suffers a complication that was a known risk of a procedure, and the attending wants an ethics consult to document that the decision to proceed was ethical, in case of a lawsuit.

  Run through the steps:

  1. Factual dispute? 
     - None. The facts are clear: complication occurred, risk was known.
  2. Policy gap? 
     - No. The procedure was within standard of care.
  3. Better option? 
     - The committee might see that the decision to proceed was reasonable. So they can name that as the better option. Then it's a **Hard Choice** and they defend the decision. But note: the attending wants cover. If the committee agrees, then they provide it. If the committee thinks the decision was not justified (e.g., the risk was too high and alternatives were not tried), then they would have to say so. But if it was a reasonable decision, then they can provide the defense.

     However, if the committee feels that the attending is trying to misuse the ethics service to dodge responsibility for a bad outcome, then:

  4. Misuse? 
     - If the consult is requested solely for defensive documentation when there is no ethical conflict, then it might be **Misuse of Dilemma Language**. The committee can refuse to frame it as a dilemma and instead state that this is a standard risk of medicine and that the ethics service is not a risk-management tool. But note: the committee can still provide an opinion if they think it's warranted. However, they should be wary of being used.

     In this case, the committee might decide that there is no ethical dilemma at all and that the consult is inappropriate. Then they can close the consult with a note that there is no ethical conflict, only a risk management issue. But our procedure doesn't have a "no ethical issue" category. So we might need to adjust.

     Since our verdicts are fixed, we could classify this as **Resolvable Conflict** (if we think the conflict is about fear of lawsuit and can be resolved by reassurance) or **Hard Choice** (if they defend the decision). But the misuse category is for when dilemma language is used to dodge a call. Here, there is no dilemma. So we might need a sixth category? But the problem says fixed set.

     Alternatively, we can say: if there is no ethical conflict, then the committee should state that and close the consult. But we don't have a category for that. Therefore, we might adjust the procedure: at step 1, if there is no ethical conflict, we can say it's a resolvable conflict (because the conflict is the attending's anxiety, which can be resolved by reassurance) and then the product is a note that there is no ethical dilemma and the decision was within ethical norms.

     Given the constraints, I think we can handle it in step 3: if the committee can see that the decision was ethically sound, then they name it as the better option (Hard Choice) and defend it. If they see that the decision was not sound, then they might have to say that the better option now is to disclose the error and apologize (if it was an error) and then that becomes a Hard Choice.

     But if the request is purely for cover and there is no dilemma, step 4 (misuse) might be triggered. We can say: if the committee determines that the consult is being used to avoid the responsibility of communicating with the patient about the complication (which is the attending's duty), then they can call it misuse.

     This is a gray area. We might adjust the procedure to have an initial step: "Is there an ethical conflict?" If not, then the committee can decline the consult. But the problem says we must produce one of the five verdicts. So we can say that if there is no ethical conflict, then it is a **Resolvable Conflict** (because the conflict is in the mind of the requester and can be resolved by education) and the product is a note explaining why there is no conflict and what the attending should do (e.g., have a disclosure conversation with the patient).

  **Where the Procedure Misfires or is Gamed:**

  - **Misfires:** 
    - If the committee cannot agree on the answers (e.g., at step 3), the procedure might force a vote and then label it a Hard Choice even if some members feel it's a dilemma. But the procedure requires a verdict. The chair must guide to consensus or majority vote.
    - The policy gap verdict might be overused to avoid tough cases. But step 2 requires that the gap is the cause. If a policy exists but is bad, that's not a gap; that's a hard choice about whether to follow the policy.
    - The genuine dilemma verdict might be underused because step 3 might always find a better option. This is by design: we want to avoid labeling something a dilemma if there is a better option.

  - **Gamed:**
    - A team might present a case as a dilemma when it isn't, hoping the committee will grant cover. The procedure (step 4) is designed to catch that.
    - A committee member with strong views might steer the discussion to avoid a verdict they don't like (e.g., avoiding policy gap because the hospital doesn't want to make a policy). The chair must enforce neutrality.

  **What it Cannot Do:**
  - Solve deep philosophical disagreements within the committee.
  - Create a policy; it can only flag the need.
  - Replace legal advice (the lawyer on the committee should help with that).
  - Prevent moral residue; it can only recommend how to address it.
  - Work without a diverse committee; if the committee lacks relevant perspectives, it might misclassify.

  Final Procedure (as an ordered list):

  1. **Factual Dispute?** 
     - Ask: "If we knew [missing fact], would the choice become clear?"
     - Sufficient answer: Yes → **Resolvable Conflict**. Product: Note specifying missing facts and who should obtain them. Stop.
     - No → Next.
     - [SKIPPABLE in urgent cases if facts cannot be obtained in time.]

  2. **Policy Gap?** 
     - Ask: "Is this conflict arising because we lack an institutional policy for this type of situation?"
     - Sufficient answer: Yes → **Policy Gap**. Product: Note to administration (and chart) stating the gap and urging policy development. The attending is advised to make a temporary decision if urgent. Stop.
     - No → Next.
     - [Not skippable.]

  3. **Better Option?** 
     - Ask: "After weighing the ethical principles (autonomy, beneficence, non-maleficence, justice) and the context, can we identify one course of action as better than the alternatives?"
     - Sufficient answer: Yes → **Hard Choice**. Product: Note recommending the better option and defending it, including acknowledging moral costs and suggesting support for residue. Stop.
     - No (cannot agree OR options seem equally balanced with profound costs) → Next.

  4. **Misuse?** 
     - Ask: "Is the team using 'no right answer' to avoid a tough but clear obligation?"
     - Sufficient answer: Yes → **Misuse of Dilemma Language**. Product: Note stating the obligation and why the dilemma framing is inappropriate. Stop.
     - No → Next.

  5. **Genuine Dilemma?** 
     - Ask: "Do we still perceive this as a situation with no better option and profound moral costs regardless of the choice?"
     - Sufficient answer: Yes → **Genuine Dilemma**. Product: Note stating either course is defensible, explaining the dilemma and the expected residue. Also, specify what is owed to the option not taken (e.g., apology, memorial, policy review). Stop.
     - No → Revisit step 3 and 4. If still no, then by default: take a vote on the best option and treat as **Hard Choice** (with the majority's choice as the recommendation).

  We hope this procedure will help the committee navigate even the hardest cases in a structured way.
answer: |-
  Below is a practical, step-by-step procedure designed for your ethics committee. It sorts cases into one of five verdicts: **Genuine Dilemma**, **Hard Choice (with a better/worse option)**, **Resolvable Conflict**, **Policy Gap**, or **Misuse of Dilemma Language**. The procedure is grounded in observable, action-oriented criteria (e.g., facts, institutional rules, consensus on harm reduction) rather than metaphysical debates about dilemmas. It avoids assuming dilemmas "exist" by treating them as a pragmatic label for cases where the committee cannot identify a better option after rigorous analysis. Moral residue is acknowledged as a psychological reality requiring mitigation, not proof of a dilemma's existence.

  ### Core Distinctions Used (and Why)
  1. **Hard Choice vs. Genuine Dilemma**:  
     - **Hard Choice**: One option is *identifiably better* (e.g., reduces harm, aligns with core values), even if both are bad. Moral residue may occur, but it doesn’t negate the better choice.  
     - **Genuine Dilemma**: No better option can be identified; choosing either inflicts profound, roughly equal moral harm (e.g., violating autonomy vs. preventing death). The residue is addressed through rituals or restitution.  
     - *Why use this?* It separates winnable conflicts from true stalemates without metaphysics. "Better" is judged via consensus on harm reduction or institutional values.  

  2. **Resolvable Conflict**:  
     - A factual error, miscommunication, or legal ambiguity creates the illusion of a dilemma. Fixing the facts/clarifying rules resolves it.  
     - *Why use this?* Many "dilemmas" dissolve with better data or dialogue.  

  3. **Policy Gap**:  
     - The conflict stems from an institutional rule vacuum (e.g., no allocation policy for scarce resources). The hospital must create a rule, not the committee.  
     - *Why use this?* Avoids ad hoc decisions that should be systemic.  

  4. **Misuse of Dilemma Language**:  
     - The framing as "no right answer" hides avoidance of responsibility (e.g., ignoring a clear policy because it’s unpleasant).  
     - *Why use this?* Prevents ethics from being weaponized for indecision.  

  **Discarded Distinctions**:  
  - *Moral Residue as Proof of Dilemma*: Residue is common in hard choices and dilemmas; it’s not a reliable differentiator. We treat it as a post-verdict action item.  
  - "Tragic Choices" as Separate: Folded into "Dilemma" or "Hard Choice" to avoid redundancy.  
  - *Theoretical Frameworks (e.g., deontology vs. utilitarianism)*: Too abstract for rapid use. We prioritize harm reduction, autonomy, and institutional values as neutral tools.  

  ---

  ### The Procedure: 6 Questions in Order  
  **Rules**:  
  - Answer in sequence. Stop when a verdict is reached.  
  - Time: Target 5–7 minutes per question. Skip skippable steps only in urgent cases (e.g., 2 a.m. consults).  
  - Output: Each verdict dictates what the committee produces in the chart note.  

  | # | Question                                                                 | Sufficient Answer for Verdict                          | Verdict & Output Requirements                                                                                                                                                                                                                                                                                               | Skippable in Urgency? |
  |---|--------------------------------------------------------------------------|--------------------------------------------------------|------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------|----------------------|
  | 1 | **“Would resolving a factual dispute (e.g., capacity, prognosis) or clarifying a law/policy make one option clearly defensible?”** | YES → Dispute/ambiguity is the root issue.             | **Resolvable Conflict**: <br> - **Produce**: Note refusing an opinion. Specify missing facts/rules and who must resolve them (e.g., “Attending must reassess capacity” or “Legal team must clarify X law”). <br> - **Action**: Case returns to requester. Committee does not proceed.                                         | Yes                  |
  |   |                                                                          | NO → Move to Q2.                                       |                                                                                                                                                                                                                                                                                                                              |                      |
  | 2 | **“Does this conflict arise solely because the hospital lacks a policy for this scenario?”** <br> *(e.g., recurrent resource allocation, disclosure rules)* | YES → Absence of policy is the core problem.           | **Policy Gap**: <br> - **Produce**: Note refusing an opinion. State: “Hospital policy required.” Flag urgency (e.g., “Immediate ad hoc decision needed; policy must be drafted within 30 days”). Copy admin. <br> - **Action**: Shield the decision-maker only by naming the gap. Do not endorse either option.               | No                   |
  |   |                                                                          | NO → Move to Q3.                                       |                                                                                                                                                                                                                                                                                                                              |                      |
  | 3 | **“Can we agree on one option as better? (Weigh: harm reduction, autonomy, fairness, and institutional values.)”** <br> *Vote if needed; majority wins. Tie = NO.* | YES → A better option exists.                          | **Hard Choice**: <br> - **Produce**: Note naming and defending the better option. Acknowledge moral costs (e.g., “Disclosing X will cause distress but upholds autonomy”). <br> - **Action**: Shield the decision-maker. Specify residue mitigation (e.g., “Offer family counseling” or “Debrief the team post-choice”).      | No                   |
  |   |                                                                          | NO → Move to Q4.                                       |                                                                                                                                                                                                                                                                                                                              |                      |
  | 4 | **“Is ‘no right answer’ framing being used to dodge a clear duty? (e.g., ignoring policy/law, avoiding discomfort)”** | YES → Dilemma language is a smokescreen.               | **Misuse of Dilemma Language**: <br> - **Produce**: Note calling out the misuse and naming the obligated action (e.g., “Disclose diagnosis per hospital policy”). Defend firmly. <br> - **Action**: Refuse to shield; instead, compel responsibility. No residue mitigation (no true moral cost).                              | Yes                  |
  |   |                                                                          | NO → Move to Q5.                                       |                                                                                                                                                                                                                                                                                                                              |                      |
  | 5 | **“After Q1–Q4, do we still see profound moral costs in both options, with no better choice?”** <br> *(Focus on outcomes: e.g., “Both options cause irrevocable harm.”)* | YES → Stalemate with high moral residue expected.      | **Genuine Dilemma**: <br> - **Produce**: Note stating either option is defensible. Explain costs (e.g., “Withholding diagnosis respects autonomy but risks family distrust”). <br> - **Action**: Shield the decision-maker. **Require residue mitigation**: e.g., apology, family meeting, memorial, or policy review.        | No                   |
  |   |                                                                          | NO → Revisit Q3; if still stuck, force a Hard Choice. | *(Procedure fails if unresolved; default to Hard Choice via vote.)*                                                                                                                                                                                                                                                          |                      |

  ---

  ### Running the Procedure: 3 Cases  
  **Case 1: Withholding Diagnosis + Family Questions**  
  - **Q1**: Factual dispute? No—patient’s preference and family’s actions are clear. → **NO**  
  - **Q2**: Policy gap? If the hospital has a confidentiality policy, NO. If not, YES → **Policy Gap**. Assume a policy exists → **NO**.  
  - **Q3**: Better option? YES. Option A: Honor patient’s autonomy (don’t disclose) and redirect family: “I cannot answer per patient’s wishes.” Better than Option B: Disclose to family (violates autonomy). → **HARD CHOICE**  
    - **Output**: “Recommend redirecting family questions. Upholding autonomy is paramount; moral cost is family distress. Mitigation: Social work to support family.”  

  **Case 2: One Dose, Two Patients**  
  - **Q1**: Factual dispute? No—both medically eligible. → **NO**  
  - **Q2**: Policy gap? YES—no allocation policy for scarce resources. → **POLICY GAP**  
    - **Output**: “No opinion. Hospital must create an allocation policy. Attending makes urgent ad hoc decision (e.g., random lottery). Copy CEO; policy due in 30 days.”  
    - *(This verdict forces the institutional accountability you anticipated.)*  

  **Case 3: Drunk Driver Disclosure**  
  - **Q1**: Factual dispute? Yes—imminence of risk is unclear. → **RESOLVABLE CONFLICT**  
    - **Output**: “No opinion. Requester must assess risk imminence (e.g., ‘Is driver on duty today?’). If imminent, Q3 reapplies.”  
  - *If urgency skips Q1*:  
    - **Q2**: Policy gap? Assume policy exists (e.g., “Warn if imminent threat”) → **NO**.  
    - **Q3**: Better option? YES. Disclose to authorities: Prevents potential harm to children. Better than withholding (respects confidentiality but risks lives). → **HARD CHOICE**  
      - **Output**: “Recommend disclosure. Moral cost: Breach of trust. Mitigation: Apologize to patient post-disclosure, offer counseling.”  

  ---

  ### Fourth Request Type: Cover Against Lawsuit  
  - **Typical case**: A known complication occurs; attending requests consult to "prove" the decision was ethical.  
  - **Procedure Path**:  
    - **Q1**: Factual dispute? Rarely—facts are known. → **NO**  
    - **Q2**: Policy gap? If complication was within policy (e.g., informed consent obtained), NO. → **NO**  
    - **Q3**: Better option? YES. The decision was defensible (if proper consent occurred). → **HARD CHOICE**  
      - **Output**: “Proceeding was ethically sound given disclosed risks. No dilemma.” *Committee provides cover.*  
    - **If misuse suspected** (e.g., consent was inadequate):  
      - **Q4**: YES → **MISUSE**. Output: “Dilemma framing avoids accountability. Revisit consent process with patient.”  

  ---

  ### Where It Misfires or Is Gamed  
  1. **Misfires**:  
     - **Over-claiming Policy Gaps**: Teams may frame routine conflicts as “policy gaps” to avoid decisions. *Defense*: Q2 requires the gap to be the *sole cause*; else, Q3 applies.  
     - **False Dilemmas in Q5**: A committee deadlocked by personal biases may mislabel a Hard Choice as a Dilemma. *Defense*: Chair must enforce Q3’s harm-reduction focus.  
     - **Residue Overlooked**: In Hard Choices, mitigation steps may be omitted under time pressure. *Defense*: List mitigation in the note template.  

  2. **Gaming**:  
     - **Teams**: May exaggerate “uncertainty” to trigger Resolvable Conflict (Q1) and delay decisions. *Defense*: Require specificity (e.g., “What exact fact is missing?”).  
     - **Committees**: Members may force Policy Gap (Q2) to avoid tough calls. *Defense*: Lawyer/chair must verify if a policy truly doesn’t exist.  

  3. **What It Cannot Do**:  
     - **Resolve Value Conflicts**: If members fundamentally disagree on “better” (Q3), it defaults to majority vote.  
     - **Prevent Moral Distress**: It mitigates but can’t eliminate residue.  
     - **Replace Leadership**: The committee advises; the attending still acts.  
     - **Handle Malicious Requests**: e.g., A bad-faith consult to delay care. Chair must screen these pre-meeting.  

  This procedure ensures every consult terminates in a verdict, provides clear output, and respects both sides of the dilemma debate. It works because it compresses ethics into observable decisions—not theory.
