prompt: |-
  I have just been appointed to the restitution advisory panel of the small municipal museum where I have worked as a curator for six years, and I am the newest member, which means my first contested case arrives next week. Before I vote, I want to be sure I understand the logic the panel has actually been running, rather than the logic it says it is running.

  You are a philosopher of cultural property and museum ethics, and I would like you to act as my analyst. Please begin by brainstorming the several general principles that could each explain the record below, then work through the case systematically rather than jumping to a verdict. I am less interested in a slogan than in a disciplined reconstruction.

  Our panel's record, as the board has ratified it:

  - Human remains excavated from a burial site during a colonial-era survey, with no permit and against the recorded objections of local elders: returned.
  - A carved ancestral figure that a colonial administrator purchased from a local intermediary for a sum both sides called fair, but which the source community regards as a lineage guardian that can never properly be owned or sold: returned.
  - A ceremonial staff seized as spoils during a punitive military raid: returned.
  - A set of masks and regalia that the community itself later asked us to keep, arguing that its young people no longer know the practices and the objects are safer in our climate-controlled storage: retained.
  - A collection of utilitarian household pottery and iron tools gathered by an anthropologist with documented consent and an export permit: retained.
  - A sacred bundle that a trader obtained by threatening to cut off the community's access to the trading post unless it was handed over: returned.
  - Botanical specimens and field photographs made collaboratively with a local guide, with a signed agreement: retained.

  The new case: a ceremonial object of the same inalienable kind as the ancestral figure and the sacred bundle, one that the community describes as never having been legitimately transferable. It entered our collection in 1931 through an open, documented sale at a fair price, paid to a hereditary custodian who signed a receipt, with an export permit issued by the then-colonial administration. There was no threat, no raid, and no fraud that anyone has alleged. The descendants of the source community are numerous, organized, and petitioning for its return, and they say the custodian had no right to sell what was never his to sell.

  Predict what our panel will decide if it is to be consistent with its own record. Identify the candidate principles the record is compatible with, state what each predicts about the new case, give me your best guess together with the reasons for preferring it, and name the further case that would best distinguish the surviving principles from one another. Finally, tell me plainly what principle we would be adopting if we return the object and what principle we would be adopting if we decline, so that I know what my vote commits us to.
reasoning: |-
  Okay, the user is a museum curator newly appointed to a restitution advisory panel. They're facing their first contested case and want to understand the implicit logic behind the panel's past decisions rather than the stated principles. They provided seven past cases with outcomes and one new case. They want me to act as their analyst, reconstructing the underlying principles, predicting the new case outcome, and clarifying what each decision would imply.

  First, I need to analyze the pattern in the seven ratified cases. Let me list them again:

  1. Human remains from colonial excavation without permit, against elders' objections: returned.
  2. Ancestral figure purchased "fairly" but considered inalienable by community: returned.
  3. Ceremonial staff seized in military raid: returned.
  4. Masks and regalia that the community asked to keep: retained.
  5. Utilitarian items collected with consent and permit: retained.
  6. Sacred bundle obtained through coercion: returned.
  7. Botanical specimens and photos with agreement: retained.

  Looking at these, the returns all involve violations of community autonomy or sacredness, while retentions involve consent or community preference. The key seems to be about legitimacy of acquisition and the nature of the objects.

  For the new case, it's a ceremonial object considered inalienable, sold by a hereditary custodian in 1931 with documentation, fair price, no threats. But the community argues the custodian had no right to sell it. This resembles case 2 (ancestral figure) but with documentation.

  Possible principles emerging:
  - **Illegitimate Acquisition Principle**: Focuses on how the object was obtained (coercion, theft, etc.). Cases 1, 3, and 6 were returned due to force or lack of consent. Case 5 and 7 retained with consent.
  - **Source Community Sovereignty Principle**: Community's current stance is key. Case 4 retained because community asked to keep, others returned when community wants them back.
  - **Sacred/Inalienable Nature Principle**: Objects with sacred or inalienable status should be returned regardless of transaction. Cases 2 and 6 returned despite "fair" transactions.
  - **Procedural Validity Principle**: Emphasis on documented legal processes at time of acquisition. Cases 5 and 7 retained with permits and consent.

  Applying to new case:
  - Illegitimate Acquisition: Acquisition looks clean—no fraud, coercion. Predicts retention.
  - Community Sovereignty: Community is petitioning for return. Predicts return.
  - Sacred/Inalienable Nature: Object is same as case 2, which was returned. Predicts return.
  - Procedural Validity: Documentation exists, so retention.

  But the panel returned case 2 despite procedural validity because of inalienability. So Sacred/Inalienable principle seems stronger. In case 4, they retained when community didn't want it back, but here they do.

  The user wants a disciplined reconstruction. The strongest pattern is that inalienable/sacred items are returned even with "fair" transactions if the community contests. Case 2 is the closest parallel. The custodian's authority is key here—if the community says he had no right, that might override the documentation.

  For prediction: likely return, following case 2's logic. If retained, it would contradict that principle.

  Further test case: An item with contested sacred status but acquired legally, and the community is divided or doesn't want it back. Would show if Sacred principle overrides Community Sovereignty.

  If returned, adopting Sacred/Inalienable principle (community's cultural norms override legal documentation). If retained, adopting Procedural Validity (documentation validates the transaction).

  User's deeper need: They want to vote consistently with the panel's actual logic, not just the surface. They might be concerned about ethical implications or internal politics. Understanding the implicit principle helps them anticipate future cases and justify their vote without appearing to break ranks.
answer: |-
  As your analyst, I'll reconstruct the panel's implicit logic through a forensic examination of your ratified cases. The goal is to surface underlying principles—not just the stated ethics policy, but the operational patterns revealed by your actual decisions. We'll proceed systematically: (1) extract candidate principles from the case patterns, (2) apply each to the new case, (3) predict the panel's likely decision with reasoning, (4) propose a distinguishing test case, and (5) clarify the stakes of your vote.

  ### Step 1: Candidate Principles from Existing Cases
  Your seven cases suggest four non-mutually-exclusive principles. Each explains *most* decisions, but conflicts emerge:

  1. **Illegitimate Acquisition Principle**  
     *Logic:* Focuses on coercion, violence, or procedural violations *at acquisition*.  
     - Explains: Returns for human remains (no permit/objections), ceremonial staff (seized as spoils), sacred bundle (coercion). Retention for pottery/tools (consent/permit), botanical specimens (agreement).  
     - Inconsistent with: Returning the ancestral figure (apparently "fair" sale) while retaining utilitarian pottery (also "fair" acquisition).

  2. **Source Community Sovereignty Principle**  
     *Logic:* Current community wishes are paramount, regardless of original acquisition.  
     - Explains: Returning contested items (human remains, ancestral figure, staff, bundle). Retaining masks/regalia when community *requested* retention.  
     - Inconsistent with: Retaining pottery/tools despite potential modern claims (implied by absence of request).

  3. **Sacred/Inalienable Nature Principle**  
     *Logic:* Items with ritual/ancestral significance are inherently non-transferable; "ownership" is invalid.  
     - Explains: Returning ancestral figure (even with "fair" sale) and sacred bundle. Differentiates from retaining utilitarian pottery/botanical specimens.  
     - Inconsistent with: Not returning human remains *solely* on sacredness grounds (acquisition flaws were emphasized).

  4. **Procedural Validity Principle**  
     *Logic:* Formal documentation (permits, receipts) legitimizes retention unless fraud/duress is proven.  
     - Explains: Retaining pottery/tools (consent + permit) and botanical specimens (agreement). Returning sacred bundle (coercion voids validity).  
     - Inconsistent with: Returning ancestral figure despite "fair" price and intermediary involvement.

  ### Step 2: Applying Principles to the New Case
  - **Object:** Ceremonial item, deemed inalienable by community.  
  - **Acquisition (1931):** Documented sale, fair price, hereditary custodian receipt, colonial export permit. No alleged threats/fraud.  
  - **Current Stance:** Organized descendants demand return, arguing custodian lacked authority.

  | Principle                  | Prediction for New Case | Reasoning                                                                 |
  |----------------------------|-------------------------|---------------------------------------------------------------------------|
  | **Illegitimate Acquisition** | Retain                | No coercion, fraud, or procedural violation at acquisition (unlike human remains/staff/bundle). Mirrors pottery/tools retention. |
  | **Community Sovereignty**   | Return                | Current community actively petitions for return (as with ancestral figure/staff). Differs from masks case where retention was requested. |
  | **Sacred/Inalienable Nature** | Return                | Matches ancestral figure/sacred bundle: community defines it as non-transferable. "Custodian" authority irrelevant if object is inalienable. |
  | **Procedural Validity**     | Retain                | Documentation (receipt, permit) mirrors pottery/botanical cases. Colonial administration was legal authority at time. |

  ### Step 3: Prediction & Best-Guess Reasoning
  - **Prediction:** The panel will **return the object**.  
  - **Reasoning:**  
    The strongest pattern across your cases is the **Sacred/Inalienable Nature Principle**, which overrides procedural validity when contested. The ancestral figure case (returned despite "fair" purchase) is the closest parallel: both involve communities rejecting Western property norms for ritual objects. The panel implicitly treats "inalienability" as a cultural fact that voids *any* sale, regardless of documentation.  
    - Why not other principles?  
      - *Illegitimate Acquisition* fails: No evidence of duress (unlike sacred bundle).  
      - *Procedural Validity* conflicts with returning the ancestral figure.  
      - *Community Sovereignty* supports return but is secondary; masks were retained without community demand, but sacred items were returned *despite* "fair" acquisition.  

  ### Step 4: Test Case to Distinguish Principles  
  To isolate whether **Sacred/Inalienable Nature** or **Community Sovereignty** is dominant:  
  - **Hypothetical Case:** *A sacred object acquired with full documentation and consent, but the modern community is divided—50% demand return, 50% argue it preserves cultural memory abroad.*  
    - Sacred/Inalienable Principle → Return (inalienability is inherent, regardless of community division).  
    - Community Sovereignty Principle → Retain (no consensus demand).  
    Your panel’s decision here would reveal which principle trumps.

  ### Step 5: What Your Vote Commits To  
  - **If you vote to RETURN the object:**  
    You adopt the **Sacred/Inalienable Nature Principle**. This asserts that:  
    > *"Objects defined by the source community as spiritually inalienable cannot be legitimately transferred or owned, rendering any sale or documentation void ab initio. Community authority over cultural meaning supersedes colonial legal frameworks."*  
    **Implications:** Opens future claims for *all* culturally sacred objects, regardless of acquisition paperwork. Risks destabilizing collections with colonial-era documentation.  

  - **If you vote to RETAIN the object:**  
    You adopt the **Procedural Validity Principle**. This asserts that:  
    > *"Transactions documented as consensual and legal under the governing authority at the time are valid unless proven fraudulent or coercive. Current restitution claims must demonstrate acquisition flaws, not just cultural significance."*  
    **Implications:** Protects acquisitions with paperwork but may ignore Indigenous concepts of ownership. Conflicts with your panel’s return of the ancestral figure.  

  ### Final Advisory  
  Your panel’s record reveals a *de facto* hierarchy: **Sacred/Inalienable > Community Sovereignty > Procedural Validity > Illegitimate Acquisition**. The new case is a near-replica of the ancestral figure decision—expect a return vote. By supporting this, you endorse cultural inalienability as a restitution basis, rejecting colonial property norms. If you dissent to retain, you must reconcile why this ceremonial object differs from the ancestral figure (e.g., arguing the custodian’s documented hereditary role validates authority). Either vote commits to a principle with profound institutional consequences; choose based on whether your museum should prioritize source community cosmology or transactional finality.  

  For your preparation: Re-examine the ancestral figure case files. How did the panel dismiss the "fair sale" argument? That will be their playbook here.
