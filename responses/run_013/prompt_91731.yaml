prompt: |-
  I run a reading group that mixes cognitive-science graduate students with working programmers, and next month I have ninety minutes to teach the notion of conceptual slippage: the way an analogy-maker, when the reading of its source case that it started with cannot be carried across to the target, quietly re-describes the source instead of failing, and produces an answer that is neither derivable from the rules as written nor arbitrary. I do not want the idea explained to me. I want a plan for teaching it.

  The material is a microdomain I built myself, so nobody in the room has seen it. A shelf holds three stones in a row, written left to right. Stones come in four grades in ascending order: pebble, stone, rock, boulder. The domain licenses exactly four moves: promote one stone by one grade, demote one stone by one grade, swap two adjacent stones, and reverse the row. A puzzle gives a source shelf and its result, then a target shelf, and asks what the target becomes. My carrying puzzle is: pebble-stone-rock becomes pebble-stone-boulder, so what does boulder-rock-stone become? I chose that source pair deliberately — the stone that changes is both the rightmost and the largest — and I need to know whether that choice is doing the work I think it is.

  Plan the session. Specifically: the order in which the ideas must arrive and the dependencies among them, that is, what the room has to believe, or be able to do, before slippage can be felt as a phenomenon rather than heard as a mistake, and what must be withheld until after they have produced a slip of their own; whether my shelf puzzle can carry the whole session or whether it buckles under the weight I am putting on it, and if it does, what a carrying example needs that mine lacks, and whether I would be better off with the familiar letter-string puzzle of the kind in which the string abc becomes abd and one is then asked what ijk becomes; the readings of my source pair that the room will actually generate, in the order they will generate them, which of those readings the session should endorse as a principled slip and which it should mark as an error or as no answer at all, and exactly where in the sequence each must be handled; the misconceptions I should expect — I am anticipating that they will hear slippage as sloppiness, that they will assume one answer is correct, and that once they have granted two answers they will conclude that anything goes — with the point in the sequence at which each of those has to be defused rather than merely corrected; the trade-off I must make them feel between a system that never slips and one that slips at will, together with what licenses a slip rather than merely permitting it; and one question to put to them at the end that would show whether they can distinguish a licensed slip from an arbitrary answer rather than merely recite the distinction. Finally, tell me what to leave out at this level and to say out loud that I am leaving it out.
reasoning: |-
  We are going to teach the concept of conceptual slippage in a 90-minute session. The goal is for the participants to experience slippage as a phenomenon in the context of the provided domain (the stone shelf puzzle). We will use the puzzle: 
   Source: [pebble, stone, rock] becomes [pebble, stone, boulder] 
   Target: [boulder, rock, stone] becomes ??? 

   The session plan must build up the necessary understanding step by step, allowing participants to generate their own answers and then reflect on the process. We want them to feel the "slip" as a natural and non-arbitrary, yet not rule-based, outcome.

   Key dependencies and sequence:

   1. Introduce the domain and the rules (without the puzzle yet).
      - The shelf: a row of three stones.
      - Grades: pebble, stone, rock, boulder (in increasing order).
      - Moves: promote, demote, swap adjacent, reverse the entire row.
      - Emphasize that each move is one operation. So a puzzle's transformation is achieved by exactly one move.

   2. Warm-up: Solve a simple puzzle together to get familiar.
      Example: [pebble, stone, rock] becomes [pebble, rock, stone]? 
          Answer: swap the last two? But note: that would require two swaps? Wait, let's clarify: one move only. 
          Actually, we can swap adjacent stones. So swapping the middle and the last? But then we get [pebble, rock, stone]. That's one move.

      However, let me choose a simpler one: 
          Start: [stone, pebble, rock] 
          End: [pebble, stone, rock] 
          How? Swap first two. 

      Another: 
          Start: [rock, stone, pebble]
          End: [rock, stone, rock]? -> That's not possible in one move because you can't promote pebble to rock in one step (only one grade at a time). 
      Instead: 
          Start: [rock, stone, pebble] 
          End: [rock, stone, boulder] -> That would be promoting the last from pebble to boulder? But that's two grades (pebble->stone->rock, then rock->boulder? Not one step). 
      So we must stick to one move.

      Let's do: 
          Start: [rock, stone, pebble] 
          End: [rock, pebble, stone] -> That's swapping the middle and last? But then we get [rock, pebble, stone]? 
          Actually, swapping adjacent: the middle and last are adjacent? Yes. So that's one move.

      We want to make sure they understand that a transformation is achieved by exactly one move.

   3. Present the source puzzle: 
          Start: [pebble, stone, rock] 
          End: [pebble, stone, boulder]
      Ask: What move was done? 
          - It cannot be swap (because swapping two adjacent wouldn't change the last to boulder without changing others?).
          - It cannot be reverse (reverse would give [rock, stone, pebble]).
          - It must be a promotion: the last stone (rock) is promoted to boulder? But note: promotion is by one grade. Rock to boulder is one grade? 
            Yes: the grades are pebble, stone, rock, boulder. So rock->boulder is one step. 
          So the move is: promote the third stone (rock to boulder).

      This is straightforward. The rule: promote the last stone.

   4. Now present the target puzzle: 
          Start: [boulder, rock, stone] 
          End: ??? (using the same rule)

      The rule we extracted: promote the last stone.
      Applying that: the last stone is stone. Promoting stone gives rock? So we get [boulder, rock, rock]? 
      But wait: the target start has a boulder and a rock and a stone. Promoting the last (stone) to rock: 
          [boulder, rock, stone] -> [boulder, rock, rock]?

      However, let's check: 
          Source: we promoted the last from rock to boulder. But in the target, the last is stone, so promoting it would make it rock. 

      But note: the source had the last as the largest? In the source, the last was rock (the largest in the source). In the target, the last is stone (the smallest). 

      This might cause a problem. Some participants might say: 
          "The rule is to promote the last, so [boulder, rock, stone] becomes [boulder, rock, rock]."

      But wait: what if we notice that in the source, the last was not only the last but also the largest? And in the target, the last is the smallest. 

      Now we expect slippage: participants might re-describe the rule to be: "promote the largest stone" or "promote the stone that is at the highest grade" or "promote the rightmost stone that can be promoted" (but note: every stone can be promoted except boulder? but boulder can be demoted? but we are promoting).

      Alternative readings:

        A. Promote the last stone (strictly positional): then target becomes [boulder, rock, rock].

        B. Promote the largest stone: in the source, the largest was the last. In the target, the largest is the first (boulder). But we cannot promote boulder (it's already the highest). So this rule fails? 

        C. Promote the stone that is at the highest grade (and that isn't boulder). In the source, that was the rock (last). In the target, the highest grade is boulder (first) and rock (middle). But boulder cannot be promoted. So we promote the rock? Then we get: boulder becomes ...? We promote the rock (middle) to boulder? Then we get [boulder, boulder, stone]. 

        D. Another: in the source, the stone that changed was the one that was at the highest grade and it was promoted. In the target, the highest grade is boulder (which cannot be promoted) so maybe we demote it? But the source didn't demote. 

        E. Or, maybe we notice that the source had the stones in increasing order? And the target is in decreasing? So we might reverse the rule? 

      We want to see what the participants come up with.

   5. The slippage: 
      The initial rule (promote the last) leads to [boulder, rock, rock]. But some participants might feel that is not satisfying because in the source, the change was from a high grade (rock) to an even higher (boulder) and in the target, the last is low. They might then re-describe the source: 
          "The move was to promote the largest stone" (which in the source was the last). But then in the target, the largest is the first (boulder) and we cannot promote it. 

      Then they might re-describe again: 
          "Promote the stone that is at the highest grade that is not already at the maximum." 
          In the source: rock is the highest and can be promoted. 
          In the target: the highest grade (non-boulder) is rock (the middle). So promote the middle? Then we get [boulder, boulder, stone].

      Or: 
          "The move was to promote the rightmost stone that can be promoted." 
          In the source: the rightmost (rock) can be promoted -> done.
          In the target: the rightmost is stone -> can be promoted -> becomes rock -> [boulder, rock, rock]. 

      But note: the source had the rightmost as the only one that could be promoted? Actually, the middle (stone) could also be promoted? But it wasn't. So why wasn't it? Because we only do one move? And we chose the last? 

      The key point: the original rule was based on position. But when that doesn't feel right in the target (because the last is the smallest, so promoting it doesn't have the same "impact" as in the source), they shift to a different property (size, or the ability to be promoted meaningfully). 

   6. What we want to avoid:
      - Slippage being seen as sloppiness: we must show that it is a natural process in analogy-making.
      - The idea that one answer is correct: we want to show that multiple answers can be licensed by different re-descriptions.
      - The idea that anything goes: we want to show that the re-description must be grounded in the source.

   7. How to run the session:

      Step 1 (10 mins): Introduce the domain and rules. Practice with one or two simple puzzles (with unambiguous answers).

      Step 2 (10 mins): Present the source puzzle. 
          Question: What move was done in the source? 
          Expected: promote the last stone (from rock to boulder).

      Step 3 (20 mins): Present the target puzzle. 
          Ask: What does [boulder, rock, stone] become? 
          Have them work in small groups (5 mins) then share.

          Expected answers:
            Group A: [boulder, rock, rock] (by promoting the last)
            Group B: [boulder, boulder, stone] (by promoting the middle, because it's the next largest after boulder? or because the largest cannot be promoted so we pick the next? or because we notice that in the source, the stone that changed was the largest and we do the same in the target, but since the largest cannot be promoted, we promote the next largest? which is rock -> boulder)
            Group C: [rock, rock, stone]? How? Maybe demoting the first? But the source didn't demote.

          Also, note: swap? reverse? They are possible in one move, but in the source we did a promotion. So we are looking for a promotion? 

          But wait: the source transformation was a promotion. So we are looking for a promotion move? 

          However, the problem says: "using the same rule". So the rule is the one we extracted from the source: which we thought was "promote the last".

      Step 4 (20 mins): Discussion of answers. 
          Collect the answers. 
          Then ask: 
            - Why did some groups choose to promote the last? (they are following the rule as stated)
            - Why did others choose to promote the middle? (because they feel that the rule should be about the largest stone, and when that fails in the target, they adjust to the next best)

          This is the slippage: the re-description from "last" to "largest" (or to "highest non-maximal grade") is not arbitrary. It is motivated by the source: in the source, the last was the largest. 

          We must emphasize: 
            - The rule as initially extracted (positional) works in the source but in the target it produces an answer that feels less analogous? Why? 
            - The re-description is an attempt to preserve the "essence" of the source move: promoting the most prominent stone (the largest). 

          But note: in the target, the largest is boulder and cannot be promoted. So then what? 
            Option: give up? 
            Option: promote the next largest? 

          This is the slippage: we re-describe the rule to be about the largest, and then when that fails, we re-describe again to be about the largest that can be promoted? 

          How is this not arbitrary? Because it is grounded in the source: in the source, the stone that was promoted was the largest and it could be promoted. In the target, the largest cannot be promoted, so we look for the next largest that can be. 

          But note: in the source, there was only one stone that could be promoted to the next grade? Actually, no: the middle (stone) could be promoted to rock? But it wasn't. So why wasn't it? Because the rule was about the last? 

          This tension is the core.

      Step 5 (15 mins): Introduce the concept of slippage. 
          - Explain: when the initial rule (extracted from the source) does not transfer to the target, we don't just give up. We go back and re-describe the source to find a more general rule. 
          - This re-description is not arbitrary: it must be consistent with the source. 
          - In our case, two main answers: 
              Answer 1: [boulder, rock, rock] (stick to the positional rule) 
              Answer 2: [boulder, boulder, stone] (re-describe to a rule about the largest that can be promoted)

          Both are possible? But note: the second one requires two re-descriptions: first from position to size, then when that fails, to the next best in size? 

          However, we can also have a rule that says: promote the stone that is at the highest grade (and that can be promoted). Then in the source: rock (highest) -> boulder. In the target: the highest grade that can be promoted is rock (the middle) -> boulder. 

          This rule doesn't require two steps. It is one re-description.

      Step 6 (10 mins): Address misconceptions.
          - Slippage is not sloppiness: it is a creative, systematic process. 
          - There isn't one correct answer: both answers are licensed by different re-descriptions. But note: the re-description must be grounded in the source. 
          - Not anything goes: we must be able to justify the re-description by the source. 
          - Example of an arbitrary answer: [pebble, rock, stone] (how? demote the first? but the source didn't demote) -> that would be arbitrary because it doesn't follow from any rule we can extract from the source.

      Step 7 (5 mins): Trade-off discussion.
          - A system that never slips: it would fail when the initial rule doesn't apply. 
          - A system that slips at will: that would be arbitrary and not useful. 
          - What licenses a slip? The need to preserve the structural or functional essence of the source case, and the re-description must be consistent with the source.

      Step 8: Final question to test understanding (to be asked at the end):
          "Suppose someone says that the target [boulder, rock, stone] becomes [boulder, rock, pebble]. Is that a licensed slip? Why or why not?"

          Answer: It is arbitrary. Why? Because in the source we promoted (increased) the last, but here we demoted (decreased) the last. There is no re-description of the source that would lead to a demotion in the target. The source transformation was an increase.

      Step 9: What to leave out?
          - We are not going into the cognitive mechanisms of slippage (e.g., neural processes). 
          - We are not discussing other domains (like the letter-string puzzle) in depth. We are using this microdomain to illustrate.
          - We are not covering all possible re-descriptions (just the main ones that come up).

          Say: "We are leaving out the detailed cognitive mechanisms and focusing on the phenomenon in this domain."

   8. Will the shelf puzzle carry the session?

      We think so. The puzzle is designed to have two natural re-descriptions (positional and size-based). The target case breaks the positional rule by having the last be the smallest. This creates tension. 

      Compare to the letter-string puzzle: 
          Source: abc -> abd (change the last letter to the next in alphabet)
          Target: ijk -> ? 
          Most say: ijl (change the last to the next). 
          But what if the target was xyz? Then changing the last (z) to the next? There is no next. So slippage: change the last to the first? or change the entire string? 

      The stone puzzle is similar in structure. But the stone puzzle has the advantage that the grades are ordered and bounded (so promotion of the highest is impossible). 

      However, the stone puzzle also has the possibility of multiple moves (promote, demote, swap, reverse) but in the source we used a promotion. This might cause confusion: why are we limited to promotion? Because the source transformation was a promotion? 

      We must emphasize: we are looking for the same kind of move as in the source? Or the same rule? 

      The problem says: "the way an analogy-maker ... quietly re-describes the source". So we are looking for the rule that explains the source, then applying it to the target. 

      In the source, the move was a promotion. So we are looking for a promotion move? 

      But note: the rule might be re-described to a different kind of move? That would be a bigger slip. 

      However, in our source, the move was clearly a promotion. So we should stick to promotion. 

      To avoid confusion, we must state: 
          "In the source, we identified a promotion move. So we are looking for a promotion move in the target."

   9. Readings to endorse and mark:

      We will endorse:
          - Promote the last: leads to [boulder, rock, rock] -> This is the literal rule. It is valid but may feel unsatisfying.
          - Promote the highest grade stone that can be promoted: leads to [boulder, boulder, stone] -> This is a principled slip because it captures the idea that we are promoting the most significant stone (by grade) and in the source the last was the most significant.

      We will mark as error:
          - Any answer that uses a move other than promotion (unless they can justify by re-describing the source to allow a different move? but the source was a promotion). 
          - Any answer that demotes: because the source was an increase.

          Example: if they say [rock, rock, stone] (by demoting the first) -> that's arbitrary because there's no connection to the source (which increased a stone).

      We will mark as no answer at all:
          - If they say it's impossible? But it's not: we can always promote the last? Or the middle? So we should get an answer.

   10. Plan timing:

        - Introduction and rules: 10 mins
        - Source puzzle: 10 mins
        - Target puzzle in groups: 5 mins (but then discussion will take more)
        - Discussion of target answers: 20 mins (this is the core)
        - Introducing slippage concept: 10 mins
        - Misconceptions and trade-offs: 10 mins
        - Final question and wrap-up: 5 mins

        Total: 10+10+5+20+10+10+5 = 70. We have 90, so we have 20 mins buffer for discussion and delays.

   11. Adjustments:

        We might need to adjust if the groups come up with more answers. We must be flexible but keep the core ideas.

   12. Final note:

        The choice of the source pair (with the last being the largest) is critical because it allows two readings (position and size) which then conflict in the target. So it is doing the work.

   Let's write the plan step by step for the session:

    Step 1 (10 mins): Introduction
      - Present the domain: shelf with three stones in a row, four grades (pebble, stone, rock, boulder).
      - Moves: 
            promote: one stone up by one grade (cannot promote boulder).
            demote: one stone down by one grade (cannot demote pebble).
            swap: two adjacent stones swap places.
            reverse: the entire row is reversed.
      - Each puzzle: one move exactly.

      Practice: 
          Puzzle 1: [stone, pebble, rock] becomes [pebble, stone, rock] -> swap first two.
          Puzzle 2: [rock, stone, pebble] becomes [rock, pebble, stone] -> swap last two? 
          But wait: [rock, stone, pebble] -> swap middle and last: becomes [rock, pebble, stone]? 
          Actually, that's the same as swapping last two? The adjacent pair is (stone, pebble) so swapping them: stone and pebble become pebble and stone? Then we have [rock, pebble, stone]. 

      Another: 
          [rock, stone, pebble] becomes [rock, stone, rock]? -> impossible in one move? Because you can't promote pebble to rock in one step (must do two promotions: pebble->stone, then stone->rock). But we are only allowed one move. So not possible? 
          Correction: I want one that is possible. How about [rock, stone, pebble] becomes [rock, boulder, pebble]? That would be promoting the middle from stone to boulder? But that's two grades: stone->rock->boulder? Not one step. 
          So let me pick: 
            Start: [rock, stone, pebble] 
            End: [rock, stone, stone] -> promote the last from pebble to stone? That's one step. 

      But note: we might avoid this by having only one move that is clear. Let's do:

          Start: [pebble, stone, rock] 
          End: [pebble, rock, rock] -> How? Promote the middle from stone to rock? But then we get [pebble, rock, rock]. 

          Alternatively, we can do: 
            Start: [pebble, stone, rock] 
            End: [pebble, stone, boulder] -> which we will use as the source.

      So in the warm-up, stick to swaps and single promotions/demotions that are one grade.

    Step 2 (10 mins): Source Puzzle
      - Present: 
            Source start: [pebble, stone, rock]
            Source end: [pebble, stone, boulder]
      - Question: What move was done?
      - Expected: promote the third stone (rock to boulder).
      - Rule extracted: "promote the last stone".

    Step 3 (20 mins): Target Puzzle
      - Present: 
            Target start: [boulder, rock, stone]
            Question: What does it become? 
      - Instructions: "Work in small groups for 5 minutes. Apply the same rule that we extracted from the source. Write down your answer and the reason."
      - Then, collect answers on the board. Expected:
            Group 1: [boulder, rock, rock] (promote the last: stone->rock)
            Group 2: [boulder, boulder, stone] (promote the rock in the middle? because they re-described the rule to be about the largest stone that can be promoted? and the largest is boulder (cannot be promoted) so they choose the next largest: rock -> boulder)

      - Also, note: some might say [boulder, rock, stone] cannot be changed? But that's not true because we can promote the last or the middle.

    Step 4 (20 mins): Discussion
      - For each answer, ask: What rule did you use? How does it relate to the source?
      - Highlight:
            Answer 1: uses the literal rule (position) -> valid because it matches the source rule.
            Answer 2: re-describes the rule from position to size (because in the source, the last was the largest) -> then when that fails (largest is boulder, cannot be promoted) they adjust to the next largest? Or they re-describe to "the largest that can be promoted". 
      - Point out: the second answer is an example of slippage. We re-described the source to make the analogy work. 
      - But note: the re-description is not arbitrary. It is based on a feature that was present in the source (the stone that was promoted was the largest) and that feature is then used in the target.

    Step 5 (10 mins): Introducing Slippage
      - Define: Conceptual slippage occurs when the initial mapping fails, so we re-describe the source to preserve the essence of the transformation.
      - It is not a mistake but a natural cognitive process in analogy-making.
      - The slip must be licensed: it must be grounded in the source and non-arbitrary.

    Step 6 (10 mins): Misconceptions and Trade-offs
      - Slippage vs. sloppiness: Slippage is systematic, not careless.
      - There isn't one correct answer: both answers are possible if they are licensed by a re-description.
      - But not anything goes: the re-description must be justified by the source.
      - Trade-off: 
            A system that never slips is brittle (fails when the initial rule doesn't apply).
            A system that slips arbitrarily is not useful (no consistency).
            Licensed slippage balances consistency and flexibility.

    Step 7 (5 mins): Final Question
      - "Suppose someone says that the target [boulder, rock, stone] becomes [boulder, rock, pebble]. Is that a licensed slip? Why or why not?"
      - Expected answer: No, because it uses a demotion and the source used a promotion. There is no re-description of the source that would lead to a demotion in the target.

    Step 8: Wrap-up and leave out
      - "We have focused on this microdomain to illustrate slippage. We are leaving out the detailed cognitive mechanisms and broader applications for the sake of time."

    Total: 10+10+20+20+10+10+5 = 85 minutes, plus 5 minutes buffer.

    Note: The timing might be tight. We might need to cut the warm-up if time is short.

    Let's hope it works!
answer: |-
  ### Session Plan: Teaching Conceptual Slippage with the Stone Shelf Domain  
  **Total Time:** 90 minutes  
  **Goal:** Participants experience slippage as a natural, non-arbitrary phenomenon in analogy-making, distinct from errors or free association.  

  ---

  #### **Phase 1: Foundation (20 mins)**  
  *Why?* Participants must internalize the domain rules and recognize that transformations are deterministic under explicit rules.  
  1. **Introduce the domain (10 mins):**  
     - Display the four grades (pebble → stone → rock → boulder).  
     - Explain the four moves: promote/demote (one stone, one grade), swap (adjacent stones), reverse (whole row).  
     - **Emphasize:** Each puzzle uses exactly one move.  
     - *Practice puzzle:* Start: `[pebble, stone, pebble]` → End: `[pebble, rock, pebble]`.  
       - *Solution:* Promote the middle stone (stone → rock).  
       - *Check:* Why not swap? (Would require two swaps). Why not reverse? (Would reorder).  

  2. **Source case analysis (10 mins):**  
     - Present source: `[pebble, stone, rock]` → `[pebble, stone, boulder]`.  
     - *Group task:* "What move was applied? Write the explicit rule."  
     - **Target outcome:** Consensus on "promote the rightmost stone" (rock → boulder).  
     - *Withhold:* Do not hint at multiple interpretations yet.  

  ---

  #### **Phase 2: Target Case & Slippage Elicitation (30 mins)**  
  *Why?* Participants must hit a dead end with the initial rule, then spontaneously re-describe the source.  
  1. **Present target case (5 mins):**  
     - "Apply the same rule to `[boulder, rock, stone]`. What happens?"  
     - *Critical:* Do not clarify if "same rule" means position (rightmost) or another feature.  

  2. **Individual/group work (10 mins):**  
     - Participants derive answers. **Anticipated responses (in order):**  
       1. `[boulder, rock, rock]` (promote rightmost: stone → rock).  
       2. *Stuck:* "Can’t promote boulder!" → Re-describe source as "promote the largest stone."  
       3. `[boulder, boulder, stone]` (promote rock → boulder; "largest *upgradeable* stone").  
       4. `[stone, rock, boulder]` (reverse; "source had increasing order").  
       5. *Error:* `[rock, boulder, stone]` (swap non-adjacent; violates rules).  

  3. **Share answers (15 mins):**  
     - Board all responses. **Classify:**  
       - **Endorse as principled slips:**  
         - `[boulder, boulder, stone]` (re-description: "promote the largest upgradeable stone").  
           - *Why?* Grounded in source (rightmost was largest; largest couldn’t upgrade in target).  
         - `[stone, rock, boulder]` (re-description: "make the row increasing").  
           - *Why?* Source was increasing; target was decreasing.  
       - **Mark as errors:**  
         - `[rock, boulder, stone]` (non-adjacent swap; not a valid move).  
       - **Reject as arbitrary/unlicensed:**  
         - `[boulder, rock, pebble]` (demote rightmost; source promoted, didn’t demote).  
         - *No answer* (e.g., "impossible") → Redirect: "How could you re-read the source?"  

  ---

  #### **Phase 3: Slippage as Phenomenon (25 mins)**  
  *Why?* Frame slippage as systematic (not sloppy) and bounded (not arbitrary).  
  1. **Introduce slippage (10 mins):**  
     - "When rules fail, we *re-describe the source* to preserve intent. This is slippage."  
     - Contrast:  
       - Source’s initial rule: "Promote rightmost."  
       - Slipped rule: "Promote the largest upgradeable stone" (to handle target’s constraints).  
     - **Key point:** Slippage isn’t failure—it’s analogy adapting.  

  2. **Defuse misconceptions (15 mins):**  
     - **"Slippage is sloppiness":**  
       - Contrast `[boulder, boulder, stone]` (licensed: source’s largest stone was upgraded) vs. `[boulder, rock, pebble]` (arbitrary: no source justification).  
       - *Emphasize:* "Slippage reinterprets the source; it doesn’t invent new moves."  
     - **"One correct answer":**  
       - Validate both `[boulder, boulder, stone]` and `[stone, rock, boulder]` as licensed slips.  
       - *Ask:* "Why might both make sense? What in the source supports each?"  
     - **"Anything goes":**  
       - Reject `[boulder, rock, pebble]` (demote) and `[pebble, rock, boulder]` (multiple moves).  
       - *Stress:* "Slippage requires loyalty to the source’s *structure* (e.g., upgrading, ordering)."  

  ---

  #### **Phase 4: Trade-offs and Assessment (15 mins)**  
  *Why?* Participants articulate why slippage is constrained and functional.  
  1. **Trade-off discussion (10 mins):**  
     - *Pose:* "What’s better: a system that never slips (fails when rules don’t apply) or slips at will (ignores the source)?"  
     - **Reveal the middle ground:**  
       - Slippage is *licensed* when:  
         - (a) The initial rule breaks in the target.  
         - (b) The new rule explains the source *and* preserves a core feature (e.g., "upgrading significance" or "imposing order").  
       - *Example:* Promoting "largest upgradeable" preserves *significance*; reversing preserves *order*.  

  2. **Final assessment question (5 mins):**  
     - *Pose:* "Someone says `[boulder, rock, stone]` becomes `[boulder, stone, stone]` (demote middle). Is this a licensed slip? Why?"  
       - **Ideal response:** "No—it’s arbitrary. Source upgraded; demoting violates the source’s intent. No re-description of the source justifies it."  

  ---

  #### **Why Your Shelf Puzzle Works**  
  - **Your source choice (`[pebble, stone, rock] → [pebble, stone, boulder]`) is optimal:**  
    - The rightmost stone is *both* positionally and semantically salient (largest). This duality forces re-description when the target (`[boulder, rock, stone]`) decouples position/size.  
  - **Advantages over letter puzzles (e.g., `abc → abd`):**  
    - Stone grades add semantic dimensions (size, upgradeability), creating richer slippage opportunities. Letter puzzles often slip only on position (e.g., "last character" → "first character"), which feels more arbitrary.  
    - Your domain’s bounded grades (boulder can’t upgrade) force meaningful constraints, making licensed vs. arbitrary slips clearer.  

  ---

  #### **What to Explicitly Leave Out**  
  - **State upfront:** "We’re leaving out:  
    - Cognitive architecture (e.g., neural models of analogy).  
    - Slippage in large-scale systems (e.g., entire cognitive maps).  
    - Debate on whether slippage is conscious/unconscious.  
    We’re focusing on the *mechanism* in a microdomain to make it tangible."  

  ---

  **Expected Outcome:** Participants exit seeing slippage as a *feature* of flexible reasoning—neither rigid nor lawless—and can distinguish licensed slips from errors. Your puzzle robustly supports this by juxtaposing positional/semantic cues and bounded moves.
