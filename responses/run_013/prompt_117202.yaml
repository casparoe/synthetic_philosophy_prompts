prompt: |-
  Forecasting platforms and internal prediction markets now routinely post questions about mathematics alongside questions about elections and weather: whether a long-standing conjecture will be resolved by a given date, and sometimes simply whether the conjecture is true, scored by the same rules and defended with the same appeal to calibration. Asked what such a probability could mean, the forecasters I know say that mathematics is not a matter of chance, that a statement is true or false independently of anyone's opinion, and that the number they post is only an expression of their own uncertainty. What does the practice presuppose? If the probability is purely a degree of belief, is that reading stable when the thing being forecast is not an event in the world but a proof that may or may not ever be found, and when the platform's resolution criterion blurs the two by asking whether the theorem will have been proved by 2030? Does scoring forecasters against the eventual outcome treat the growth of mathematical knowledge as a contingent social process rather than a discovery, and is that a cost the practice can bear? And the market rules that forbid pricing a claim above one of its logical consequences, treating violations as arbitrage, appear to presuppose that entailment is available for free; say what that presupposition comes to and whether the practice can be made coherent without it. Reconstruct the implicit theory, separate what the practice strictly requires from what it merely sits well with, and identify where several incompatible views of probability would license exactly the same behavior. Answer in continuous prose, with no headings, bullet points, bold text, or tables.
reasoning: |-
  Hmm, this is a dense philosophical question about probability in mathematical forecasting. Let me unpack it carefully. The user is describing prediction markets that treat mathematical conjectures like probabilistic events - asking whether a proof will be found by 2030, or whether a statement is true. 

  First layer that strikes me: the core tension between mathematical Platonism and social constructivism. Forecasters explicitly say their probabilities represent personal uncertainty, not ontological chance. But the scoring mechanism forces a practical commitment to treating mathematical discovery as contingent. Interesting how the resolution criterion ("proved by 2030") smuggles in temporality where mathematics itself is timeless. 

  The arbitrage rule fascinates me - it assumes logical entailment is computationally free. In reality, recognizing consequences might be harder than proving theorems! This feels like assuming an omniscient logician. Yet without this rule, probabilities could violate Dutch book arguments. So the practice needs this idealization to maintain coherence. 

  I notice three distinct probability interpretations that collapse here: subjective Bayesianism (personal belief), logical probability (inductive support), and maybe even a latent frequentism about community consensus. All justify the same market behavior, which is philosophically convenient but masks deep disagreements. 

  The user seems concerned about epistemic costs. Does this practice reduce mathematics to social processes? I think the answer lies in distinguishing between truth and discovery. The markets track the latter while bracketing the former - a subtle but crucial move. Still, the scoring system does reward accurate predictions about social/intellectual processes, not mathematical truth per se. 

  For coherence: the arbitrage rule requires assuming all participants recognize all entailments instantly. In practice, this demands either extreme expertise or computability assumptions. Without it, probability assignments could become inconsistent under logical deduction. So while idealized, it's necessary for the market's internal logic. 

  Final thought: the "merely sits well with" versus "strictly requires" distinction matters. The practice strictly requires treating discovery as contingent and logic as transparent. It merely sits well with Platonism about mathematical truth. A formalist could participate just as easily.
answer: |-
  The practice of forecasting mathematical conjectures through prediction markets presupposes a nuanced epistemology that navigates between timeless mathematical truth and the temporal contingencies of human discovery. At its core, it assumes that while mathematical propositions possess determinate truth values independent of human cognition, the *process of verifying* these truths—through proof or disproof—is an empirical, historically situated endeavor subject to uncertainty. Forecasters explicitly frame their probabilities as epistemic: degrees of belief reflecting their assessment of the community’s capacity to resolve the conjecture by a specified deadline, not an ontological chance in the mathematics itself. This distinction allows participants to reconcile mathematical Platonism with the unpredictability of discovery.

  The resolution criterion ("proved by 2030") blurs the status of the conjecture and the event of its verification, but the practice remains coherent by implicitly treating the forecast as targeting the *social process* of validation. Scoring against eventual outcomes presupposes that mathematical knowledge progresses through contingent human activities—intellectual breakthroughs, collaboration, or even serendipity—rather than treating proof as a mere uncovering of eternal facts. This does not necessarily reduce mathematics to pure social construction; it accommodates the view that truth is discovered, but the *timing* and *means* of discovery are shaped by mutable factors like research funding, computational tools, or individual ingenuity. The "cost" here is a pragmatic acceptance that forecasting must model the sociology of mathematical progress, but this does not compel a full relativism. Participants can consistently uphold mathematical objectivity while acknowledging that their predictions track epistemic access, not truth itself.

  The arbitrage rule—forbidding pricing a claim above one of its logical consequences—presupposes that logical entailment is transparent and computationally costless for all rational agents. It treats the recognition of deductive relationships as instantaneous and universally accessible, akin to a frictionless idealization. This comes to an assumption of *logical omniscience* within the model: participants are expected to immediately grasp all implications of the conjectures they price. Without this presupposition, the market could not enforce coherence; probabilities could drift into Dutch-bookable inconsistencies if agents overlook elementary deductions. The practice strictly requires this idealization to maintain probabilistic consistency (avoiding sure losses) and to operationalize logical constraints as market rules. However, it merely *sits well* with the view that mathematics is a priori knowable; it does not depend on it, as the rule functions pragmatically to align beliefs with publicly sharable deductive structures, regardless of whether those structures are deemed discovered or invented.

  The implicit theory underpinning the practice is a hybrid: it leans on subjective Bayesianism for interpreting probabilities as personal credences, while relying on objective logical relations to constrain those credences. Crucially, this setup licenses identical market behavior under several incompatible philosophical views of probability. A strict subjectivist (de Finetti) sees probabilities as consistent betting quotients constrained by Dutch-book arguments, where logical entailment rules are mere coherence conditions. A logical probabilist (Carnap) might view the probabilities as degrees of entailment from background knowledge about mathematical practice. Even a frequentist could reinterpret the probabilities as forecasting the rate of success of mathematical "methods" over time. All converge on the same observable actions—posting odds, hedging against consequences—because the market’s rules externalize consistency requirements independently of metaphysical justification.

  Thus, the practice strictly requires only that participants treat the *verification event* as contingent and that they accept logical constraints as enforceable norms to prevent arbitrage. It can bear the "cost" of framing mathematical progress as social process because it targets discovery, not truth. It remains coherent by idealizing logical omniscience as a regulatory principle, even as it accommodates the human limitations that make forecasting necessary in the first place. The reconciliation lies in its pragmatic bracketing: the market forecasts *whether we will know* by 2030, not *what is true* timelessly.
