answer: |-
  As a committed fluctuation theorist, I concede that records alone cannot break the symmetry without invoking the very gradient we seek—but the inference isn't circular because we anchor it in the *present macrostate* and the probabilistic postulate. Given our current low-entropy macrostate (defined by coarse-graining that captures observable degrees of freedom, like particle densities), time-symmetric dynamics imply that the most probable *historical path* consistent with this state is one where entropy increased toward our present from an even lower past entropy. The footprint's correlation symmetry is resolved by conditioning on the entire macrostate: a footprint *now* correlates with a foot *earlier* because the dynamics, when constrained by the low-entropy present, render trajectories with converging correlations (e.g., particles spontaneously arranging into a foot-shaped depression) overwhelmingly improbable compared to diverging ones. Crucially, coarse-graining isn't arbitrary; it's fixed by what structures we *can* resolve (e.g., footprints vs. microstates), and this operational definition aligns with the entropy gradient because we—as complex observers—exist only where entropy reliably increases in one direction, making that direction "past." The arrow emerges from our location in the fluctuation, not from fundamental time asymmetry.
