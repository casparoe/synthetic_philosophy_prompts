answer: |-
  ### Dialogue: The Tinnitus Trade-off

  **Setting:** A philosophy department lounge, late afternoon. Clara (contractualist) and Alan (aggregator) are debating over coffee.

  **Alan:** Clara, I’ve been thinking about that city proposal: give one person lifelong tinnitus to shave 30 seconds off ten million commutes. It’s absurd *not* to do it. The math is indisputable—over 95,000 collective hours saved daily versus one person’s manageable discomfort. Scanlon’s refusal to aggregate is like using a sundial in a particle accelerator.  

  **Clara:** Alan, you’re missing the core of contractualism. This isn’t about math; it’s about justification to individuals. Could you look Bob—the tinnitus victim—in the eye and say, "Your suffering is outweighed by ten million people saving half a minute"? His complaint is concrete: "You imposed permanent harm on me for negligible gains no single person would reasonably demand."  

  **Alan:** "Reasonable rejection" is doing heavy lifting here. *Rejectable by whom?* If we’re choosing principles behind a veil of ignorance—not knowing if we’d be Bob or a commuter—any rational person would accept the trade. Tiny gains add up ex ante!  

  **Clara:** But Scanlon *explicitly* rejects the veil of ignorance! Contractualism asks what principles people *already situated* can reasonably reject. Bob isn’t hypothetical. His actual complaint—"I was sacrificed for micro-benefits no one else even notices"—stands unopposed. None of those ten million can say, "My 30 seconds was so vital I’d reject a principle forbidding this."  

  **Alan:** That’s atomism! You’re pretending individuals exist in vacuums. But society *is* collective. Each commuter’s 30 seconds is trivial, but together it’s years of reclaimed life for art, family, productivity. Why can’t Bob recognize that his complaint, while real, is swamped by the aggregate good?  

  **Clara:** Because "aggregate good" is a sleight of hand. You’re treating ten million people as one monolithic entity—a super-person absorbing tiny drops of utility. But contractualism cares about *personal standpoints*. No commuter experiences "years of reclaimed life." They experience *thirty seconds*. Would *you* accept tinnitus for a lifetime to save 30 seconds daily?  

  **Alan:** Behind the veil—  

  **Clara:** —*No veil!* We’re not gambling souls. We’re judging real-world principles. The machine’s rule—"Harm one for many micro-gains"—is rejectable because it licenses sacrificing identifiable individuals for distributed benefits nobody experiences as significant. That’s corrosive to social trust.  

  **Alan:** So you’d paralyze progress? What if it’s not 30 seconds but 30 minutes? Or saving one life versus ten million papercuts? Where’s your line?  

  **Clara:** The line is when gains become *individually meaningful*. If commuters saved an hour daily, some might reasonably say, "My job/health requires this; I’d reject a ban." But 30 seconds? It’s noise. Your "papercuts" analogy proves my point—you’re inflating negligible harms into moral weights by stacking them. That’s utilitarianism smuggling itself in.  

  **Alan:** And you’re privileging vivid suffering over diffuse welfare. Bob’s tinnitus shouts; the commuters’ time- savings whisper. But volume isn’t moral weight! Drowning out whispers because they’re quiet is senseless.  

  **Clara:** It’s not about volume. It’s about justificatory force. Bob’s complaint vetoes the principle because no one else has a countervailing *personal* stake strong enough to override it. Your "diffuse welfare" is a phantom—it doesn’t exist in lived experience.  

  **Alan:** Then contractualism is tragically myopic. You’d doom millions to death-by-a-thousand-cuts to avoid one scream.  

  **Clara:** And you’d sacrifice flesh-and-blood people to feed a utility monster.  

  *(They stare at each other, coffees cold. Neither offers to refill the other’s cup.)*  

