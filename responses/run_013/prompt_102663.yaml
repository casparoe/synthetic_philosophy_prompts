prompt: |-
  I direct selection for a competitive fellowship program. Every cycle my committee reads several hundred applications and must rank candidates on qualities we cannot observe directly — persistence, judgment, and the capacity to finish hard things. We lean heavily on costly actions as proxies: an applicant who left a secure job to work full time on the proposed project, one who spent a year of personal savings on a data collection, one who moved to another country for the work, one who completed an expensive credential with no evident instrumental payoff. My committee treats these as proof of commitment. I suspect we are reading them wrong, sometimes in both directions, and I want a procedure rather than an essay.

  Write a decision procedure my committee can run on any single costly action an applicant presents, grounded in what the theory of costly signaling and the handicap principle actually establishes rather than in its folk version. Assume no technical background on my side or my committee's: that a signal can be credible because it is costly is the whole of what we know, so the procedure itself must carry whatever distinctions matter, in plain language.

  Deliver a short ordered sequence of questions. For each question, state what counts as a sufficient answer, what answer ends the inquiry with the signal discounted to near zero, and where the question cannot be settled by evidence and must be handed to a person. The procedure must handle explicitly, at minimum: a signal whose cost is roughly equal for strong and weak candidates; a signal so common among applicants that it no longer distinguishes anyone; a signal whose cost is not wasted but productive, so that it also yields something of independent value; a signal that is cheaper for wealthy applicants than for others; and an exceptionally strong candidate who presents no costly signal at all. Where the procedure will misfire, say so.

  Then run it on three applications: the applicant who quit a secure job; the applicant who self-funded a large data collection; and one I expect you to find hardest — an applicant who has publicly staked a falsifiable claim about their own future work and offered to forfeit something if it fails. One of the three verdicts should be one my committee will not like; tell me which and why.

  Close by stating plainly what the procedure cannot do: the questions it will never settle, and the decisions that remain ours even if we follow it perfectly. We have perhaps twenty minutes per file, the committee has no formal training in this material, and I have to be able to defend each verdict to a board that is skeptical of holistic criteria.
reasoning: |-
  We are constructing a decision procedure based on costly signaling theory and the handicap principle. The core idea is that a costly signal is credible only if it is more costly (or differently costly) for weak candidates to send than for strong ones, such that weak candidates would not find it worth sending. We must avoid common misinterpretations. The procedure will be a sequence of questions.

  Key principles:
  1. The signal must be differentially costly: the cost should be higher for those who are less committed or less capable (the weak), so that they are less likely to send it. If the cost is the same for strong and weak, it doesn't signal.
  2. The signal must be honest because it is too expensive for weak candidates to fake. If it is cheap for anyone (e.g., because of wealth) then it doesn't work.
  3. Common signals lose their value because they don't distinguish.
  4. If the signal produces independent value (is productive), then it might be sent even by weak candidates because they get that value, so it doesn't necessarily signal commitment.

  The procedure must account for:
  - A signal whose cost is roughly equal for strong and weak candidates: then it doesn't signal.
  - A signal so common that it doesn't distinguish: then it's not a signal of strength.
  - A signal that is productive: then we must check if weak candidates would also do it for the product.
  - A signal that is cheaper for the wealthy: then it might be sent by wealthy weak candidates, so it doesn't signal strength.
  - An exceptionally strong candidate with no costly signal: we must not penalize because the absence of a costly signal does not imply weakness (they might have other ways to prove themselves, or the signal might not be necessary).

  We design a sequence of questions for any single costly action (signal) presented by an applicant.

  **Procedure: Evaluating a Costly Signal**

  *Note: We are evaluating one signal at a time. The applicant may have multiple signals, but we run this procedure on each separately. The goal is to determine if this particular signal provides evidence of the unobservable qualities (persistence, judgment, capacity to finish hard things).*

  **Question 1: Is the cost of this action avoidable for someone who is not truly committed?**
     - *Explanation:* If the action is something that even an uncommitted person might do (because it has other benefits, or because it's not really costly for them), then it doesn't prove commitment. We want to see that the cost is only worth bearing if you are committed.
     - *Sufficient answer (signal is strong):* The cost is avoidable and would only be incurred by someone who is truly committed because an uncommitted person would not be willing to pay it. For example, quitting a secure job to work on a project is avoidable (one could keep the job and work part-time) and very costly for someone who isn't sure they can succeed.
     - *Stop and discount to near zero (signal is weak):* The cost is unavoidable for anyone pursuing this path, or the action is something that even an uncommitted person would do because it is cheap for them (e.g., due to wealth) or because it has immediate benefits that anyone would want. Example: if the action is getting a credential that is required for the job anyway, then it's unavoidable and doesn't signal extra commitment.
     - *Cannot settle by evidence:* If we cannot determine whether the cost is avoidable without making a judgment about the applicant's personal situation (which we don't observe), then hand to a person to consider context.

  **Question 2: Is the cost of the action higher for weak candidates than for strong ones?**
     - *Explanation:* The handicap principle says that the signal must be more costly for weak candidates to fake. If the cost is the same for everyone, then it doesn't distinguish. If it's cheaper for weak candidates (which is unlikely) then it's even worse. We are looking for differential cost that makes it harder for the weak to send.
     - *Sufficient answer (signal is strong):* The cost is disproportionately higher for weak candidates. For example, moving to another country might be very costly for someone without language skills or adaptability (which are traits of a strong candidate) but less so for someone who has them. Or, spending a year of savings might be more costly for someone who is not confident in their project (because they risk more) than for someone who is.
     - *Stop and discount to near zero (signal is weak):* The cost is roughly equal for strong and weak candidates, or it is actually cheaper for weak candidates (e.g., if the action is something that weak candidates are more likely to do because they are desperate). Also, if the action is so common that almost every applicant does it, then it doesn't distinguish and we discount.
     - *Cannot settle by evidence:* If we don't have information about how the cost varies by candidate type, then we must hand to a person to make a judgment call about typical candidate strengths.

  **Question 3: Does the action yield independent benefits (is it productive) that would make it worthwhile even for a weak candidate?**
     - *Explanation:* If the action produces something of value (e.g., data, a credential, experience) that even a weak candidate would want, then they might do it just for that benefit. Thus, it doesn't necessarily signal commitment to the goal we care about.
     - *Sufficient answer (signal is strong):* The action does not yield any significant independent benefit that would accrue to a weak candidate. For example, quitting a job might not yield any direct benefit (it only allows full-time work on the project, which a weak candidate wouldn't want to do because they might fail) and it has a high cost (losing income). But if the action is self-funding data collection, note that the data is valuable. So we need to check if the data is so valuable that even a weak candidate would do it? If the data can be sold or used for other purposes, then yes. But if the data is only valuable for the proposed project and the project is very risky, then a weak candidate wouldn't risk it.
     - *Stop and discount to near zero (signal is weak):* The action yields substantial independent benefits that a weak candidate would also want (e.g., a credential that is valuable in the job market, or data that can be sold or used in multiple projects). Therefore, even a weak candidate might do it for the benefit, so it doesn't signal commitment to the specific project.
     - *Cannot settle by evidence:* If the independent benefits are hard to value, then hand to a person to assess.

  **Question 4: Is the applicant exceptionally strong even without this signal?**
     - *Explanation:* We must not penalize a strong candidate who has no costly signal. Also, if the candidate has other strong evidence of quality, then this signal might be redundant or even misleading. We are evaluating the signal, not the candidate. But if the candidate is strong without the signal, then the signal doesn't add much.
     - *Note:* This question is about the candidate overall, not just the signal. We are considering the entire application.
     - *Sufficient answer (the signal may be discounted):* The candidate has other compelling evidence of strength (e.g., a track record of completing hard projects, outstanding achievements, strong recommendations). In this case, the costly signal is not necessary and might be an overkill or even a red flag (why did they need to do this if they are so strong?).
     - *Stop and discount to near zero (if the candidate is strong without it):* If the candidate is clearly strong without the signal, then we discount the signal because it does not add significant information. However, note that if the candidate is strong and still sent the signal, it might be even more impressive, but we are being cautious because the signal might have been cheap for them (e.g., they are wealthy). So we discount unless we are sure the signal was costly for them too.
     - *Cannot settle by evidence:* We must look at the rest of the application. If we don't have enough information, then we cannot discount the signal on this basis.

  **Question 5: Is the applicant's wealth (or other advantages) making this signal cheaper for them than for others?**
     - *Explanation:* If the applicant is wealthy, then a financial cost (like spending savings) might be less costly for them than for a less wealthy applicant. Therefore, the signal might not be as strong because a wealthy weak candidate could also send it.
     - *Sufficient answer (discount the signal):* The applicant has substantial wealth or resources that significantly reduce the cost of the action. For example, spending a year of savings might be a small fraction of their wealth, so it's not a big sacrifice. Then the signal is less credible.
     - *Stop and discount to near zero (if wealth makes it cheap):* If we can see that the cost is negligible for the applicant due to their wealth, then we discount the signal to near zero.
     - *Cannot settle by evidence:* If we don't know the applicant's financial situation, we might have to hand it to a person to estimate (but note: we usually don't have this information). Alternatively, we might note that without evidence of wealth, we assume the cost is as stated. But if there are indicators (e.g., they come from a wealthy family, or they have a high-paying job), then we discount.

  **Order of Questions:**
  We run the questions in order until we hit a stop condition (discount to near zero) or we complete them. If we complete without discounting, then the signal is considered strong evidence.

  But note: if at any point we discount to near zero, we stop. Otherwise, we proceed.

  Now, we run the procedure on three applications:

  **Case 1: Applicant who quit a secure job.**

  - **Q1:** Is the cost avoidable? Yes, they could have kept the job and worked part-time. So avoidable. Sufficient: yes, because only a committed person would quit. So pass.
  - **Q2:** Is the cost higher for weak candidates? Likely yes. A weak candidate (less committed or less capable) would fear the risk of failure and losing a secure job. A strong candidate might be more confident and thus the cost (of quitting) is less scary. So the cost (risk) is higher for weak candidates. Pass.
  - **Q3:** Does it yield independent benefits? Quitting a job doesn't directly yield benefits. It allows full-time work, which might lead to progress, but that progress is contingent on the project. A weak candidate wouldn't want to work full-time because they might fail and then have nothing. So no independent benefits that a weak candidate would want. Pass.
  - **Q4:** Is the candidate strong without it? We don't know from the signal alone. We look at the rest of the application. If the rest is strong, we might discount the signal (but note: we are only looking at the signal). If we don't see other evidence, we don't discount. So we proceed.
  - **Q5:** Is it cheaper due to wealth? If the applicant is wealthy, then the loss of income might not matter. We don't have information, so we cannot discount on this basis. We assume the cost is as stated.

  Verdict: This signal is strong evidence of commitment.

  **Case 2: Applicant who self-funded a large data collection.**

  - **Q1:** Avoidable? Yes, they could have sought funding or done a smaller project. So avoidable. Pass.
  - **Q2:** Higher cost for weak? A weak candidate might be less confident that the data will lead to success, so spending a large amount of savings is riskier for them. Therefore, the cost (risk) is higher for weak candidates. Pass.
  - **Q3:** Independent benefits? Yes, the data itself is valuable. If the data can be used for other purposes or sold, then even a weak candidate might do it to get the data. For example, if the data is marketable, then a weak candidate might collect it and then sell it, even if they don't complete the project. Therefore, we stop and discount to near zero.

  Verdict: Discount the signal to near zero because of independent benefits.

  **Case 3: Applicant who has publicly staked a falsifiable claim and offered to forfeit if it fails.**

  This is a commitment device. They are putting their reputation or something else at stake.

  - **Q1:** Avoidable? Yes, they didn't have to make a public commitment. So avoidable. Pass.
  - **Q2:** Higher cost for weak? Making a public commitment is very costly for a weak candidate because they are more likely to fail and then suffer the forfeit (and reputation loss). For a strong candidate, the cost is lower because they are confident they will succeed. Therefore, the cost is higher for weak candidates. Pass.
  - **Q3:** Independent benefits? The act of staking a claim might bring attention and opportunities (e.g., networking, early feedback) that a weak candidate might also want. But note: if they fail, they forfeit and lose reputation. The benefits might be contingent on success. However, even if they fail, they might gain some visibility. We must consider: would a weak candidate do this? They might if they are overconfident or if the forfeit is small. But if the forfeit is substantial (e.g., a large sum of money, or a public humiliation) then it would deter a weak candidate. So we need to know the forfeit.
     - If the forfeit is trivial, then a weak candidate might do it for the attention (independent benefit) and not worry about the forfeit. Then we discount.
     - If the forfeit is substantial, then it might be a strong signal.
     - Without knowing the forfeit, we cannot be sure. So we may have to hand to a person to judge the magnitude of the forfeit and the likelihood that a weak candidate would take such a risk.

  But note: there's another issue. The claim is about future work. They might not have done the work yet. So we cannot be sure they will complete it. The signal is about commitment to complete, but it doesn't prove they have the capacity. However, we are looking for commitment.

  Also, the forfeit must be credible. If they offer to forfeit something they don't have, then it's cheap talk.

  So we break it down:

  - **Q3 (detail):** The independent benefits (attention, networking) might be attractive even to a weak candidate if the forfeit is small. But if the forfeit is large, then the net expected cost for a weak candidate (who is more likely to fail) is high. So if the forfeit is large and the benefits are not too great, then it passes. If the forfeit is small, then we discount.

  We might need to ask: Is the forfeit substantial enough to deter a weak candidate? And is the forfeit credible?

  Given that we don't have a fixed rule, we might hand this to a person to decide. But let's try:

  - If the forfeit is a substantial amount of money (that would be painful to lose) or a public admission of failure that would harm their career, then it is costly and we pass.
  - If the forfeit is trivial (e.g., $1) then we discount.

  But note: we might not know the applicant's circumstances. For example, a wealthy applicant might not care about a monetary forfeit. So we also have to consider Q5.

  So after Q3 we might not have a clear answer and we proceed to Q5.

  - **Q4:** Is the candidate strong without the signal? We look at the rest of the application. If they are strong, we might discount the signal (but note: this signal is about future commitment, so it might be additive). So we don't discount unless the rest of the application is so strong that we don't need it.
  - **Q5:** Wealth effect? If the applicant is wealthy, then a monetary forfeit may be cheap. Also, if they are well-connected, a public failure might be less damaging (because they can recover). So we must discount if the forfeit is cheaper for them.

  Verdict: This case is complex. We might discount if the forfeit is trivial or if the applicant is wealthy enough that the forfeit doesn't hurt. Otherwise, it can be a strong signal. But without knowing the forfeit amount and the applicant's wealth, we might have to hand it to a person to judge. However, in the interest of time, we might require that the forfeit must be both substantial and non-refundable (and the applicant must not be so wealthy that it's trivial). If we cannot determine, we discount.

  But note: the committee might not like this because it requires judgment.

  Now, the committee will not like the verdict for Case 2 (self-funded data collection) because we are discounting that signal. They have been treating it as strong, but we are saying that because the data has independent value, it might have been done by a weak candidate for that value.

  **What the procedure cannot do:**

  1. **Cannot assess the absolute level of commitment:** We are only comparing signals. We cannot tell if the commitment is sufficient for our program without setting a threshold.
  2. **Cannot combine multiple signals:** We evaluate one at a time. We don't have a way to aggregate.
  3. **Cannot account for interactions between signals and the rest of the application:** We try in Q4 and Q5, but it's partial.
  4. **Cannot measure the cost precisely:** We rely on rough judgments.
  5. **Cannot account for cultural or contextual differences in how signals are sent:** For example, in some cultures, quitting a job might be more common and thus less informative.
  6. **Cannot handle signals that are rare but not costly in the right way:** We assume that cost is the main factor, but there might be other reasons for sending a signal.

  **Final Structure of Procedure:**

  1. **Question 1 (Avoidable):** If the cost is unavoidable, discount to near zero. Else, proceed.
  2. **Question 2 (Differential Cost):** If the cost is roughly equal for strong and weak, or if it's common, discount to near zero. Else, proceed.
  3. **Question 3 (Independent Benefits):** If the action yields independent benefits that would make it worthwhile for a weak candidate, discount to near zero. Else, proceed.
  4. **Question 4 (Candidate Strength Without Signal):** If the candidate is clearly strong without the signal, discount the signal (but not necessarily to zero, because it might still add). We might discount to near zero if the signal is redundant and we have other concerns (like wealth). But note: we are cautious because strong candidates might send signals too. However, if the candidate is strong and the signal is cheap for them (due to wealth) then we discount. So we might combine with Q5. Alternatively, we can proceed to Q5 and then decide.
  5. **Question 5 (Wealth Effect):** If the applicant's wealth makes the cost negligible, discount to near zero.

  If we pass all five, the signal is strong.

  But note: we might have to make judgment calls. We must be transparent about the uncertainty.

  We run the three cases again briefly:

  **Case 1: Quit job.**
  - Q1: Pass (avoidable)
  - Q2: Pass (differential cost: higher for weak)
  - Q3: Pass (no independent benefits that weak would want)
  - Q4: We don't discount unless the rest of the application is strong. If we don't have evidence of strength without it, we don't discount and go to Q5.
  - Q5: If we don't know about wealth, we don't discount.

  Verdict: Strong signal.

  **Case 2: Self-funded data collection.**
  - Q1: Pass (avoidable)
  - Q2: Pass (differential cost: higher for weak because of risk)
  - Q3: Independent benefits (the data) -> weak candidate might do it for the data -> discount to near zero.

  Verdict: Discounted.

  **Case 3: Public commitment with forfeit.**
  - Q1: Pass (avoidable)
  - Q2: Pass (differential cost: higher for weak because they are more likely to fail and forfeit)
  - Q3: We must check independent benefits. The public commitment might bring attention (a benefit) and if the forfeit is small, then weak might do it. So we need to know the forfeit. If the forfeit is substantial, then the benefit might not be worth the risk for weak. But without knowing, we proceed to Q4 and Q5.
  - Q4: If the candidate is strong without it, we discount. But if not, we proceed.
  - Q5: If the applicant is wealthy, the forfeit might be cheap. Then discount.

  But note: without knowing the forfeit and wealth, we might have to hand to a person. Alternatively, we can design:

  For Q3: If the forfeit is not substantial (or not credible) then discount. If we cannot determine, hand to a person.

  In practice, we might require that the forfeit must be substantial and the applicant must not be so wealthy that it's trivial. Otherwise, discount.

  This case is the hardest because it requires more information.

  **Which verdict will the committee not like?** Case 2: the self-funded data collection. They have been treating it as strong, but we are discounting it because the data might be valuable in itself.

  **Closing: What the procedure cannot do**

  The procedure cannot:
  - Replace holistic judgment about the candidate's overall fit and potential.
  - Account for every contextual nuance (e.g., personal circumstances that make a signal more or less costly).
  - Measure the exact level of commitment or predict future success with certainty.
  - Handle cases where the signal is rare but not costly in the required way (e.g., a signal that is very costly but for reasons unrelated to the qualities we care about).
  - Evaluate the candidate's proposed project on its merits (we are only evaluating the signal as evidence of commitment, etc.).
  - Be applied without any human judgment when the evidence is incomplete or ambiguous.

  We must remember that the absence of a costly signal does not imply weakness. A candidate might be strong without one. And the presence of a costly signal, even if discounted, might still be part of a larger picture.

  We have designed the procedure to be robust and grounded in theory, but it is a tool to aid judgment, not replace it.
answer: |-
  Below is a decision procedure for evaluating any single costly action (signal) an applicant presents, based on rigorous applications of costly signaling theory and the handicap principle. The procedure is designed as a sequence of questions, ordered to quickly filter out weak signals. It addresses your specified edge cases explicitly. Key principles grounded in theory:

  - **Costly signals work only if they are harder for "weak" candidates (less persistent, poor judgment, low capacity) to bear than "strong" ones**, making them honest indicators.
  - **Signals lose value if they are common, equally costly for all, productive (yielding independent benefits), or cheaper for the wealthy**.
  - **Strong candidates may not need signals**; their absence isn't evidence of weakness.

  The procedure assumes 20 minutes per file and no technical expertise. For each question:
  - **Sufficient answer**: Proceed to the next question or accept the signal as strong evidence.
  - **Discount to near zero**: Stop; the signal provides little to no evidence of commitment.
  - **Hand to person**: Insufficient evidence; human judgment needed.

  ---

  ### **Decision Procedure: Evaluating a Costly Signal**
  *Run this on each costly action separately. Start with Question 1.*

  1. **Is this action truly optional? Could the applicant have achieved their goal without it?**
     - *Why?* Signals must be avoidable to prove commitment. If the action was necessary, it doesn’t signal anything.
     - **Sufficient answer**: Yes, the action was optional (e.g., quitting a job wasn’t required to pursue the project).
     - **Discount to near zero**: No, the action was unavoidable (e.g., a required credential for the field). The signal is invalid.
     - **Hand to person**: Uncertainty about whether the action was optional (e.g., ambiguous industry norms).

  2. **Would this action be equally costly (in time, risk, or resources) for a weak candidate as for a strong one?**
     - *Why?* Signals work only if they are costlier for weak candidates to fake. Equal costs make signals uninformative.
     - **Sufficient answer**: No, the action is costlier for weak candidates (e.g., due to higher risk of failure or lack of skill).
     - **Discount to near zero**: Yes, costs are roughly equal (e.g., a standard fee everyone pays). Or, the signal is so common (>75% of applicants do it) that it fails to distinguish anyone.
     - **Hand to person**: No data on how costs vary by candidate strength (rare; use default judgment).

  3. **Does this action produce independent benefits (e.g., skills, income, assets) that a weak candidate might want, regardless of commitment?**
     - *Why?* "Productive" signals can be sent by weak candidates chasing the benefits, diluting their value as commitment proof.
     - **Sufficient answer**: No, benefits are minor or only valuable if the applicant is already committed (e.g., quitting a job yields no standalone gain).
     - **Discount to near zero**: Yes, benefits are significant and desirable even to the uncommitted (e.g., data that can be sold).
     - **Hand to person**: Benefits are unclear or context-dependent (e.g., a credential with ambiguous market value).

  4. **Is this action cheaper for this applicant due to wealth, connections, or privilege?**
     - *Why?* If costs are lower for wealthy applicants, weak candidates can "fake" the signal, making it untrustworthy.
     - **Sufficient answer**: No, the cost is equally burdensome regardless of wealth (e.g., time or health risks).
     - **Discount to near zero**: Yes, the applicant’s resources make the cost trivial (e.g., burning savings when they have a trust fund).
     - **Hand to person**: Wealth/privilege is suspected but unconfirmed (e.g., unknown family background).

  5. **Is there overwhelming evidence that this applicant is strong, even without this signal?**
     - *Why?* Strong candidates may not need signals; over-reliance on them can penalize excellence. Also, strong candidates might send signals that are cheap for them.
     - **Sufficient answer**: No, other evidence is good but not exceptional (e.g., solid references but no major achievements).
     - **Discount to near zero**: Yes, the applicant has exceptional independent proof (e.g., a proven track record of finishing similar projects). The signal is redundant or misleading.
     - **Hand to person**: Conflicting evidence about overall strength.

  **Outcome**:
  - If all answers are sufficient, treat the signal as strong evidence of commitment.
  - If any question discounts the signal to near zero, ignore it for commitment assessment.
  - If any question is handed to a person, the committee lead (you) makes a quick call based on available evidence.

  **Where the procedure misfires**:
  - It may undervalue signals from disadvantaged applicants (e.g., if a costly action is less visible).
  - It struggles with interdependent signals (e.g., multiple actions reinforcing each other).
  - It assumes rational behavior; it may misjudge if applicants are impulsive or misinformed.

  ---

  ### **Running the Procedure on Three Applications**

  **Case 1: Applicant who quit a secure job**  
  - **Q1 (Optional?)**: Sufficient. Quitting was avoidable (part-time work was possible).  
  - **Q2 (Equal cost?)**: Sufficient. Cost is higher for weak candidates (they fear failure and job loss more).  
  - **Q3 (Independent benefits?)**: Sufficient. No standalone benefits—only enables full-time work, which is risky if uncommitted.  
  - **Q4 (Cheaper due to wealth?)**: Insufficient data. Hand to person to assess financial resilience (e.g., savings, spouse's income).  
  - **Q5 (Strong without signal?)**: Sufficient. Unlikely—quitting a job is a major commitment signal.  
  - **Verdict**: **Strong signal**, unless wealth makes it cheap (e.g., applicant has independent income).  

  **Case 2: Applicant who self-funded a large data collection**  
  - **Q1 (Optional?)**: Sufficient. Funding could have been sought elsewhere.  
  - **Q2 (Equal cost?)**: Sufficient. Cost is higher for weak candidates (they risk wasting savings).  
  - **Q3 (Independent benefits?)**: Discount to near zero. Data has inherent value (publishable, sellable, or reusable), so weak candidates might do it for the data alone.  
  - **Stop**. Verdict: **Discount signal to near zero**.  

  **Case 3: Applicant who publicly staked a falsifiable claim and offered forfeit if it fails**  
  - **Q1 (Optional?)**: Sufficient. The pledge was avoidable.  
  - **Q2 (Equal cost?)**: Sufficient. Cost is higher for weak candidates (more likely to fail and forfeit).  
  - **Q3 (Independent benefits?)**: Sufficient. Benefits (e.g., attention) are offset by the risk of public failure.  
  - **Q4 (Cheaper due to wealth?)**: Discount to near zero. Wealthy applicants can absorb forfeits (e.g., money) or recover from reputational damage more easily.  
  - **Stop**. Verdict: **Discount signal to near zero** unless forfeit is non-monetary and equally painful for all (e.g., career-ending).  

  **Which verdict will your committee not like?**  
  **Case 2 (self-funded data collection)**. Your committee likely views this as strong proof of commitment, but the procedure discounts it because the data has independent value—even a weak candidate might collect it to sell or repurpose. This exploits a loophole in "folk" signaling theory: productive costs don’t reliably filter weak candidates because they gain something either way.  

  ---

  ### **What the Procedure Cannot Do**
  Even with perfect execution, this procedure has inherent limits:  
  1. **Cannot quantify commitment**: It assesses if a signal is credible, but not how committed the applicant is. A "strong" signal might still reflect moderate commitment if the cost was low for that person.  
  2. **Cannot evaluate the project itself**: Signals prove commitment but not judgment or project viability (e.g., a committed applicant might pursue a foolish idea).  
  3. **Cannot handle missing signals**: The absence of a costly signal is not evidence of weakness—strong candidates may have better options. You must assess them holistically.  
  4. **Cannot resolve contradictions**: If one signal passes but another fails, the procedure doesn’t weight them.  
  5. **Cannot adjust for context**: Cultural, economic, or personal factors (e.g., health issues making a cost unbearable) require human interpretation.  
  6. **Cannot predict success**: Commitment is one input; persistence, judgment, and capacity depend on other evidence (e.g., past work, interviews).  

  **Defense to skeptics**: This procedure replaces subjective "gut feeling" with auditable, theory-backed criteria. It explicitly avoids overvaluing signals that are common, equitable, productive, or wealth-skewed—common pitfalls in holistic review. Each question is binary, evidence-based, and minimizes committee bias. Use it as a first-pass filter to triage signals, then layer on other evidence (e.g., references, proposals) for final ranking.
