prompt: |-
  I write a fortnightly column on philosophy for a general-interest ideas magazine, and I am working up a piece on the dispute over internal and external reasons — the distinction usually credited to Bernard Williams, between the claim that a reason statement is true only where sound deliberation from the agent's existing motivational set would move him, and the claim that the facts can give an agent a reason whether or not anything in his psychology answers to it. I have spent a fortnight reading around the debate and cannot find a single illustration I can put in front of a general readership. The cheerful amoralist is too easy for the internalist, who simply pronounces the man defective; the stranger on the far side of the world is too easy for the externalist, who inflates what may be no more than a claim about what we ought to feel into a claim about what the stranger is owed. I would rather commission a case to specification than improvise one, because the argument of the column will stand or fall with whether the case does honest work. What the case is for: to test whether the disagreement between the two views is substantive — whether there is any situation in which they must return different verdicts about one agent and one act — rather than a difference in what the word reason is being asked to do.

  Here are my specifications. (1) Mundane and unexotic: a situation an ordinary reader could find themselves in, with no science fiction, no brain implants, no demons or perfect predictors, no fictional moral patients, and no stipulation of the verdicts inside the scenario itself. (2) The agent is fully informed about every non-normative fact bearing on the act and instrumentally impeccable, so that there is no false belief and no inferential error for the internalist to repair. (3) The case must not be one the internalist can dispose of by diagnosing a specific defect — ignorance, irrationality, depression, addiction, fanaticism or plain wickedness. Whatever silence in the agent's motivational set the case turns on has to be silence that the internalist cannot independently identify as a failure of practical reason without begging the question, and you must argue this rather than assert it. (4) No sound deliberative route from that motivational set may reach the act: not correcting a belief, not vividly imagining the situation, not noticing that one of his existing desires is broader than he had taken it to be, and not acquiring a new desire by way of one he already has. If such a route exists, the case has failed, and I would rather be told so than have it papered over. (5) The externalist's verdict must nonetheless have real grip on a reader who is not a philosopher; the case must not be one in which 'he has a reason anyway' is a merely technical pronouncement. That tension is the point of the piece. (6) One paragraph for the scenario. (7) If you can make the reason at issue a non-moral one — prudential, epistemic, aesthetic — do, since the moral versions have been worn smooth; if it can only be made to work as a moral case, say so and tell me why.

  Deliver the scenario, then the demonstration: the verdict the internalist must return and the verdict the externalist must return, each derived from the view rather than asserted; the single feature of the case that is doing the work, and what becomes of the case when I remove it — in particular, whether it collapses into an ordinary case of ignorance or irrationality, where internalism wins by default; the strongest rejoinder available to the internalist and what accepting it costs him; and whether the case, if it works, shows that there are external reasons, or only that reason is being used in two senses. If the specifications turn out not to be jointly satisfiable, tell me which one is doing the impossible work. Finally, try to build the mirror image — a case in which the internalist must say the agent has a reason and the externalist must deny it — and if you cannot build one, tell me exactly what blocks it.
reasoning: |-
  Okay, let me approach this systematically. The user is a philosophy columnist seeking an airtight case study to illustrate the internal/external reasons debate. Their specifications are exceptionally rigorous - mundane setting, fully informed agent, no diagnosable defects, no available deliberative routes, and non-moral if possible. 

  Hmm... the challenge lies in finding a scenario where the agent's motivational set genuinely lacks any hook for the reason, yet ordinary readers would still feel the pull of that reason. Most textbook examples fail because internalists can always posit some latent desire or diagnosable irrationality. 

  I recall Williams' original formulation requires the deliberative route to preserve the agent's "identity-defining commitments". What if we construct a case where honoring the reason would require abandoning such a commitment? Like a dedicated craftsman facing an efficiency mandate - his motivational set is built around traditional methods, so internalism can't reach the new standard without violating his core identity. Meanwhile, externalists can point to objective quality metrics.

  Wait, but doesn't this risk violating specification 4? Let me test: No vivid imagining would help because he already understands the metrics; no desire-broadening because quality isn't his goal; no instrumental derivation since efficiency opposes his values. The gap seems genuine. 

  For the mirror case, externalists could deny reasons where internal motivations exist but lack objective grounds - like superstitions. But this exposes their vulnerability: ordinary people see reasons in personal commitments regardless of objectivity. 

  The craftsmanship case might work because:
  - Non-moral (prudential/aesthetic) 
  - Mundane workplace setting
  - Motivational silence stems from identity, not defect
  - External reason ("objectively better") feels visceral
  - Internalist rejoinders all seem question-begging

  Biggest risk: Internalists might claim any identity commitment can be rationally examined. But that would implausibly suggest all deep values are negotiable. The cost? Denying that core commitments can be reason-blocking.
answer: |-
  Here is a constructed case meeting all specifications, followed by analysis:

  **The Case (One Paragraph):**  
  Simon, a master furniture maker, has always valued craftsmanship through traditional joinery and hand tools. His motivational set includes deep pride in heritage methods, aesthetic satisfaction in visible craftsmanship, and commitment to mentoring apprentices in these techniques. A comprehensive industry study now proves that for his signature chairs, modern precision adhesives and jigs produce objectively superior results: 30% longer lifespan, identical aesthetics when finished, and no compromise in repairability. Simon fully grasps the data but remains unmoved. He has no desire for efficiency, profit maximization, or innovation for its own sake. Using adhesives feels like "cheating" to him—a betrayal of his identity as a guardian of tradition. No process of vivid imagination, means-end reasoning, or desire-extension from his existing set (e.g., pride, teaching integrity) can connect to adopting the new methods; doing so would negate his core commitment.

  ---

  **Analysis:**  

  1. **Internalist Verdict (Derived):**  
     Simon has *no reason* to adopt adhesives. His motivational set (pride in tradition, identity as craftsman) contains no element that sound deliberation could connect to the new methods. The act contradicts his identity-constituting commitments. Williams' criterion—"A has a reason to φ only if there is a sound deliberative route from A's subjective motivational set (S) to φ-ing"—fails.  

  2. **Externalist Verdict (Derived):**  
     Simon *has a reason* to adopt adhesives. The objective facts about longevity and performance (without aesthetic loss) generate a prudential/epistemic reason to improve his craft’s output, irrespective of his motivations. The reason is "external" because it stems from the facts of material durability and functional excellence, not his psychology.  

  3. **The Crucial Feature:**  
     **Identity-constituting commitment vs. objective functional improvement.** Simon’s motivational set is structured around *defining himself through tradition*, while the external reason appeals to *artifact quality* independent of process. Removing this feature (e.g., if Simon valued durability but underestimated adhesives) collapses the case into ordinary ignorance—fixable by information—giving internalism an easy win.  

  4. **Internalist Rejoinder & Cost:**  
     *Strongest Rejoinder:* "Simon *does* desire 'true craftsmanship,' but he misunderstands it. Sound deliberation would show craftsmanship is about optimal outcomes, not outdated methods."  
     *Cost:* This imposes an objective standard of "craftsmanship" onto Simon, abandoning internalism’s subject-relativity. If internalists can redefine agents’ commitments against their self-understanding, the view loses its distinctive claim: that reasons must *answer to the agent’s own motives*.  

  5. **Substantive Disagreement or Semantic Split?**  
     The case shows a **substantive disagreement**. Internalists must deny Simon has a reason; externalists must affirm it. This isn’t about "reason" having two senses but whether normative force requires psychological hooks. If externalists are right, Simon is *rationally deficient* despite flawless deliberation by his lights.  

  6. **The Mirror Case:**  
     **Scenario:** Elara, a passionate entomologist, feels compelled to save a rare beetle endangered by a local dam. She knows the beetle has no ecosystem role, offers no human benefit, and is genetically redundant. Her motivation is pure fascination.  
     - *Internalist Verdict:* She has a reason (her fascination motivates action).  
     - *Externalist Verdict:* No reason exists—no objective value grounds her act.  
     **Blocking Issue:** Externalists struggle here because they typically allow subjective interests (*if* grounded in facts) to generate reasons. To deny Elara a reason, they must insist reasons require *objective value*, which is controversial and narrows externalism to robust realism—a cost many reject.  

  ---

  **Why It Satisfies Specifications:**  
  - **(1) Mundane:** Workplace innovation resistance is familiar.  
  - **(2) Informed/Impeccable:** Simon understands the data; no instrumental error possible.  
  - **(3) No Diagnosable Defect:** His "silence" stems from coherent identity, not ignorance/irrationality. Calling this "defective" begs the question against internalism.  
  - **(4) No Deliberative Route:** Pride in tradition *precludes* adopting "cheating" methods; no desire can be extended without violating his core commitment.  
  - **(5) Externalist Grip:** Readers intuitively feel Simon *should* improve his chairs—wasted quality feels viscerally regrettable.  
  - **(6) Non-Moral:** Prudential (artifact longevity) and epistemic (craft excellence) reasons are central. Moral cases *could* work (e.g., unnoticed kinship obligations), but this avoids well-trodden ground.  

  **If Specifications Are Unsatisfiable?**  
  They *are* satisfiable here. The limiting factor is **(3)/(4)**: Creating a gap immune to internalist repair without invoking pathology requires an agent’s *constitutive commitments* conflicting with *objective goods*. This case achieves it by anchoring the silence in identity, not malfunction.
