prompt: |-
  Last night my flatmate (an economist, which is relevant) and I spent two and a half hours arguing about David Lewis on convention — the gist being that a convention is a regularity everyone follows because they expect everyone else to follow it, and everyone knows the others expect it, so it keeps rolling along without anyone ever having agreed to anything — and somewhere in hour two I agreed to run next Thursday's session at my reading group. Mostly economists and two lawyers, no philosophers, ninety minutes, whiteboard, and they've all read the chapter so I can't just talk for an hour.

  Don't explain convention to me. Plan the explanation.

  - The order the pieces have to go in, and why each depends on the last. My instinct is coordination problem, then regularity, then expectation, then common knowledge, then the arbitrariness-yet-stability bit — tell me where that's wrong and what I'd be sneaking in too early.

  - The one example that carries the whole thing. Can it be the one from the argument? Our lot have drifted over about two years from always sitting at the front of the cafe to always heading straight for the back room. Nobody decided it, the guy who started it moved away a year ago, and new people pick it up within a week without being told. I'd love to use it, but I'm worried it's secretly two examples, or that it's a habit rather than a convention and I won't be able to tell in front of a room. If it can't carry the session, say what the carrying example needs and why the obvious ones (which side of the road, the two people trying to find each other in a city) are the wrong choice here.

  - The misconceptions in the order they'll actually surface, and exactly where in my sequence to defuse each. I'm expecting: that a convention is an agreement or a deal; that if it's arbitrary we could all just decide to switch tomorrow; that it's the same thing as a custom or a habit; and that arbitrariness means it isn't really binding. What am I missing? And where do I head off the economists' instinct that this is nothing but equilibrium selection, and the lawyers' that with no agreement there's no obligation?

  - The ending. I want to land on the norm that outlives the interest that's supposed to be holding it up — everyone follows it, everyone expects everyone to, nobody would pick it from scratch, and people keep to it even when it costs them. I can never remember which preference condition Lewis actually needs, the one about preferring to conform given that others do or the stronger one about wanting everyone to conform, so sort that out too. And work in the drift: which parts of the apparatus survive a convention changing under people's feet without anyone noticing.

  - One question I can put to the room at the end that tells me they've got it, rather than just nodding along to a definition.

  - And what I should announce up front that I'm not going to settle in ninety minutes. I'm thinking the formalism of common knowledge and anything to do with language, but you tell me.
reasoning: |-
  Okay, the user is preparing a session on David Lewis's concept of convention for a group of economists and lawyers. They need a structured plan that addresses specific concerns about the order of explanation, examples, misconceptions, and the conclusion. Let me start by breaking down their main points.

  First, the order of explanation. They mentioned starting with coordination problems, then regularity, expectation, common knowledge, and finally arbitrariness. But they're worried about sneaking in elements too early. Lewis's actual structure begins with recurrent coordination problems leading to regularities. Expectations and preferences come next, followed by common knowledge. Arbitrariness is key but should come after establishing the expectations and common knowledge. So the sequence should be coordination problem → regularity → expectations → preferences → common knowledge → arbitrariness. This order ensures each step builds logically without presupposing later elements.

  Next, the example. They want to use the cafe seating shift from front to back. The user is concerned it might be seen as habit rather than convention. The cafe example can work if framed correctly: emphasize the coordination aspect (wanting to sit together), the shift without explicit agreement, and new members adopting it. Contrast it with a habit (like always sitting in the same seat) to show it's convention. The example needs to highlight mutual expectations and common knowledge. If it falls short, supplement with a simple analogy like meeting at the clock tower. Avoid road driving or phone call examples because they involve explicit rules or technology, which might confuse the arbitrariness point.

  Misconceptions are crucial. The user lists agreements, arbitrariness implying easy change, confusion with customs/habits, and lack of obligation. Economists might reduce it to equilibrium selection; lawyers might insist on agreement for obligation. Address each in sequence: after introducing regularity, clarify it's not agreement. When discussing arbitrariness, explain stability despite change possibility. Distinguish convention from habit when expectations are covered. For lawyers, after common knowledge, explain obligation arises from expectations, not agreements. Economists' equilibrium point should be acknowledged but note conventions include common knowledge and arbitrariness, which aren't always captured in game theory.

  Ending on norms outlasting interests: Lewis's preference condition is conditional—people prefer to conform if others do, not necessarily wanting everyone to conform. Use the cafe example to show adherence despite costs. The drift aspect: common knowledge and expectations adapt as conventions evolve. Highlight how new members adopt without explicit instruction, showing the self-reinforcing mechanism.

  The check question: Ask them to identify which scenario is a convention, e.g., a cafe seating shift vs. a personal habit. This tests their grasp of mutual expectations and arbitrariness.

  Scope limitations: Announce that common knowledge formalism and language conventions won't be covered due to time. Focus on the core framework instead.

  Need to ensure each part flows, addresses the audience's biases, and uses relatable examples. Also, confirm that the cafe example can carry the session by linking each element to it, reinforcing understanding without switching contexts.
answer: |-
  Here’s a battle-tested plan for your session, optimized for economists, lawyers, and the clock. It follows Lewis’s structure, preempts misconceptions, and leverages your cafe example.

  **Core Sequence & Why:**
  1.  **Start with the Coordination Problem (5 mins):**
      *   **What:** Define it clearly: a situation where *multiple equilibria exist*, and everyone prefers *any* coordination over *no* coordination, but they’re indifferent (or nearly) *between* the specific coordinated outcomes. Use a simple 2x2 game matrix (e.g., meeting in NYC: Grand Central vs. Empire State Building; both prefer meeting *somewhere* over missing each other, but don't care much *where*).
      *   **Why First:** This is the *raison d'être* of convention. It establishes the *need* for coordination and the *arbitrariness* potential upfront without presupposing the solution. **Crucially, it frames convention as a *solution* to a problem.** Sneaking in regularity/expectation here *would* be wrong – the problem exists independently of any solution.
      *   **Defuse Early:** Head off the economist's "equilibrium selection" instinct *here*: Acknowledge conventions *are* equilibria, but stress Lewis is building a *richer* account of *how* they emerge and persist in the real world, involving knowledge and expectations, not just payoffs. For lawyers: Emphasize the problem arises *before* any agreement is possible.

  2.  **Introduce Regularity in Behavior (5 mins):**
      *   **What:** Show how people *actually* converge on one solution (e.g., everyone *in fact* goes to Grand Central). Highlight it's a *pattern* of behavior.
      *   **Why Next:** This is the observable phenomenon convention explains. It's the "what" before the "why". Don't mention expectations yet!
      *   **Defuse:** Immediately distinguish this from mere *Habit*: "Is this just a personal habit? No, because if *only* I always went to Grand Central, but others went anywhere, we wouldn't meet. The *pattern* matters across the group." Also head off "Agreement": "Did they all sign a contract to meet at Grand Central? No. The regularity exists *without* an explicit pact."

  3.  **Add Expectations (10 mins):**
      *   **What:** Explain that people follow the regularity *because* they *expect* others to follow it. I go to Grand Central *because* I expect you to go there. You go *because* you expect me to go. Use the matrix: Given the expectation, conforming is the best response.
      *   **Why Next:** This explains *why* the regularity persists – the incentive structure. Expectations are the engine. Lewis's key preference condition: **Conditional Preference (CP):** *Each agent prefers to conform to R (the regularity) on condition that (almost) all others in the group conform to R.* (Not necessarily a preference that *everyone* always conforms universally).
      *   **Defuse:** Reinforce "Not Agreement": "Expectations arise *from* the regularity, not from a promise." Address Arbitrariness Premature Change: "Could we switch? *Theoretically*, yes, because other equilibria exist. But *practically*, why would *I* switch alone? I expect you at Grand Central!" Economists: CP makes it a Nash Equilibrium. Lawyers: Obligation starts here – I *should* conform because others *expect* me to (based on the regularity) and vice versa; it's mutually reinforcing expectations creating a *de facto* "ought".

  4.  **Introduce Common Knowledge (CK) (15 mins):**
      *   **What:** It's not enough that I expect you to conform and you expect me to conform. I know that you know that I expect you to conform, and you know that I know that you expect me to conform, and so on... (Use a simple CK example: "We both see the fire alarm light flashing, we both see each other see it, we both know we both know... so we both leave without speaking").
      *   **Why Next:** CK explains the *stability* and *robustness* of the convention. It prevents unraveling. If I *didn't* know that *you* knew *I* expected you at Grand Central, I might doubt your expectation, and thus my reason to go. CK locks it in.
      *   **Defuse:** **Announce Scope:** "We're *not* diving into the formal logical structure of CK today – just its core idea of mutually recognized mutual expectations." Address "Custom/Habit" confusion: "A habit lacks this mutual expectation structure. I brush my teeth the same way every night out of habit; I don't do it because I expect *you* to brush yours that way and know you expect me to."

  5.  **Arbitrariness & Stability (The Payoff) (10 mins):**
      *   **What:** Now emphasize: The convention is *arbitrary* because another regularity *could* have solved the coordination problem just as well (Empire State). Yet, it's *stable* because of the expectations and CK. Switching requires coordinated expectation shift, which is hard.
      *   **Why Last:** Arbitrariness only makes full sense *after* establishing the CP and CK. It highlights the "accidental" nature of *which* solution was chosen, while the *mechanism* (expectations + CK) explains why *any* chosen solution sticks despite its arbitrariness.
      *   **Defuse:** **Head off the Big One:** "Arbitrariness does NOT mean it's easy to change or not binding! Precisely *because* it's arbitrary *and* stabilized by expectations and CK, changing it requires changing *everyone's* expectations simultaneously, which is incredibly difficult. It *is* binding – the costs of deviating (coordination failure) are real." Address lawyers: "Obligation arises from the *system* of mutual expectations, not agreement." Address economists: "This is why path dependence matters in equilibrium selection."

  **Your Cafe Example: It CAN Carry the Session (Use It!)**
  *   **Why it Works:** It's perfect *because* it evolved without decree and incorporates the drift. It hits all points:
      *   **Coordination Problem:** "We all want to sit *together* in a pleasant spot, not scattered randomly." (CP exists: I prefer sitting with you all, conditional on you all being there).
      *   **Regularity:** "We *always* go to the back room now."
      *   **Expectations:** "I go to the back *because* I expect you all to be there. You go *because* you expect me (and others) to be there." (CP confirmed).
      *   **Common Knowledge:** "We all *know* this is where we meet. We know others know. New people see *everyone* goes back, they infer the expectation quickly." (Explain how drift happened: Maybe the front got noisy? Someone started it? The *origin* is irrelevant; the *expectation-driven persistence* is key. Newcomers observe the regularity, infer the expectations/CK, and conform to coordinate).
      *   **Arbitrariness & Stability:** "We could sit in the front! It's arbitrary. But we don't switch easily because *everyone expects everyone else in the back*. Switching requires coordinated expectation shift." (Stability despite drift).
  *   **Why it's NOT just Habit:** Habit is individual and inertia-based. Convention is social and expectation-driven. Frame it: "If it were *just* habit, a new person wouldn't necessarily pick it up so fast. They do because they observe the *group pattern* and infer the *mutual expectations* needed to coordinate with the group. The *cost* of sitting alone in the front reinforces it."
  *   **Stick with it:** Using one rich, relatable example avoids cognitive load. Constantly refer back: "Like in the cafe..."

  **Why Avoid "Obvious" Examples:**
  *   **Side of the Road:** Often backed by law/penalties, muddying the "no agreement" pure convention aspect. Arbitrariness is clear, but the enforcement mechanism isn't purely expectation-based.
  *   **Phone Call Disconnect/Meeting in City:** Great for *introducing* coordination problems, but too thin to illustrate the *persistence* of regularity, expectation layers, CK, and drift over time. Your cafe example has richer history.

  **Ending: The Norm Outliving Interest & Drift (10 mins)**
  1.  **The Self-Sustaining Norm:** "Lewis's genius: Once established via CP + Expectations + CK, a convention becomes self-reinforcing. People conform *because* others conform, expecting them to. The *original* coordination reason (sitting together) might fade slightly, but the convention persists due to the expectation structure itself. **Preference Condition Recap:** Lewis only needs the **Conditional Preference (CP)**. I conform *if* (almost) all others do. I don't necessarily need a *universal* desire for *everyone everywhere* to always conform. Conforming *given the local expectations* is sufficient."
  2.  **Costly Adherence:** "People might even keep following it when it's *slightly* costly *if* the perceived cost of coordination failure (or social sanction) is higher. E.g., Going to the back is a longer walk, but I do it to avoid sitting alone." (Tie to cafe).
  3.  **Surviving Drift:** "The apparatus explains drift beautifully! The *coordination problem* (sit together) remains constant. The *regularity* changes gradually (front -> back). *Expectations* and *Common Knowledge* smoothly update as people observe the new pattern emerging. Newcomers absorb the *current* regularity and its associated expectations/CK. The *arbitrariness* is evident (front was fine before). The *stability* mechanism (expectations + CK) seamlessly transfers to the new norm."

  **The Check Question (5 mins):**
  > **"Imagine two scenarios:**
  > **A)** Everyone at a conference checks the physical bulletin board for room changes out of habit; the organizers stopped updating it weeks ago, but no one noticed yet.
  > **B)** A new app for room changes exists, but everyone still checks the physical board *because* they expect everyone else to check it and post last-minute changes there, and they know others expect this too.
  > **Which scenario exhibits a Lewisian convention (B), and crucially, *why* based on the elements we discussed?"**
  *   **Why it works:** It forces distinction between habit (A - regularity without coordinating expectations) and convention (B - regularity driven by mutual expectations for coordination, even if misguided). They must articulate the role of expectations and the coordination purpose.

  **Announce Upfront (The "Not Covering" Slide - 2 mins):**
  > **"Scope for Today: We're focusing on Lewis's core conceptual framework for social convention. Due to time, we will *deliberately NOT* cover:**
  > *   **The formal logical machinery of Common Knowledge** (Iterated knowledge operators).
  > *   **Conventions of Language** (Meaning, truthfulness) - though the core framework applies.
  > *   **Detailed game-theoretic proofs** of equilibrium existence/selection.
  > *   **The precise boundary between conventions and norms/rules** with formal sanctions.
  > *   **Critiques or later developments** (e.g., Sugden, Binmore). We're sticking to Lewis's foundational argument."
  *   **Why:** Manages expectations for economists (wanting formalism), philosophers (wanting language), and lawyers (wanting rules vs. conventions). Keeps focus on the core model applicable to your cafe case.

  **Timing Buffer:** Build in 5 mins buffer for Q&A during transitions. Strictly time each section. Use the whiteboard for the coordination matrix, the sequence (CP -> Reg -> Exp -> CK -> Arb/Stab), and mapping your cafe example onto it throughout. Good luck – your flatmate started something useful!
