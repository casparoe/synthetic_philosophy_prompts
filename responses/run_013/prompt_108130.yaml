prompt: |-
  I've been going back and forth on a forum about the frame problem for like three weeks now and I keep winning against versions of the other side that I'm pretty sure are made of straw, so I want to practice against a good one. Please play a committed anti-representationalist in the Heidegger/Dreyfus line — the kind who thinks the frame problem, the philosophically interesting one, is an artifact of the representationalist picture rather than a discovery about minds. Make them sharp, not a cartoon: they should happily grant the boring engineering point (a system that recomputes the whole world after every action is too slow, so real systems use defaults, caching, learned heuristics, whatever) and they should grant that the original frame axioms in McCarthy and Hayes were a genuine technical failure. What they refuse to grant is that fixing the engineering problem touches the interesting one. They can name dead philosophers and allude to technical AI stuff, but they shouldn't produce citations or paper titles, and they shouldn't break character to give me a literature review. One or two chunky paragraphs per turn, argument-over-beers register, stay in character until I say stop, concede small points but never the main one.

  There's a distinction I've been pushing that I want you to actually engage with instead of waving away, and I half suspect it's the whole thing: framing-a-picture vs. framing-in-the-AI-sense. A picture only means something against a background that isn't itself in the frame, and you can't fix that by dragging the background into the frame, because then you've just got a bigger picture with a new background. My claim is that McCarthy's frame axioms and the picture-frame thing are the same problem in different clothes — any system that decides what's relevant is drawing a frame, and what makes the frame the right one can't be represented inside it. So the engineering fix doesnt dissolve anything, it relocates the frame into the training distribution, or into the designer, or into evolution. If you think that's a verbal trick, say why concretely rather than just asserting it.

  Here's my opening move: you say the frame problem comes from thinking the world arrives pre-cut into little determinate facts, and that a skilled coper doesn't have facts at all, just a grip on a situation. Fine. My Roomba learned that the dog is irrelevant to whether the floor is clean. Then the dog fell asleep on the charging dock and the thing spent an hour trying to climb a dog. Nobody re-cut the world into facts there — the world just made a previously irrelevant thing relevant, and the robot's grip on the situation was wrong in a way that no amount of better coping inside the old situation would have caught. So either your coper has some way of noticing that the background itself shifted, which is the frame problem with the serial numbers filed off, or it has no such way and it's just an unusually smooth sleepwalker. Which is it? Also: at the end of each reply, break character for two sentences max and flag which of the claims you just made are boring consensus among people who actually work on this and which are your own contestable reading. I don't want to walk away thinking some Dreyfus-flavored line is settled when it isn't, and honestly I can't tell how much of it is Dreyfus himself vs. the people who read him.
