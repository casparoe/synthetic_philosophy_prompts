prompt: |-
  I am a doctoral student in cognitive science, and I have been asked to lead a seventy-five-minute session of our department's interdisciplinary reading group on the frame problem. The audience is a mix of philosophy students and machine-learning students, and none of them have read the technical AI literature in which the problem was originally posed. I do not want an exposition of the problem itself; I want a plan for how to teach it. Tell me the order in which the ideas have to be introduced and why each depends on the one before it, the single example that should carry the whole session and what it must contain — and must conspicuously lack — for the problem to land as a philosophical difficulty rather than an engineering nuisance, the misconceptions you expect this particular mix of people to arrive with or to develop (I anticipate that the ML students will treat it as a question about computational cost, and I suspect the philosophers will hear it as a restatement of the problem of induction), and the precise point in the sequence at which each of those should be headed off. I also want the one question I can put to the room at the end that would distinguish someone who has actually grasped the problem from someone who has merely learned its name, and an explicit list of what I should decline to cover at this level and say out loud that I am declining.

  Two constraints. First, the session has to bring the audience to the point where they see that the difficulty survives the standard formal repairs, without my walking them through the formal machinery itself. Second, the carrying example must not be one they have already met — if you reach for the robot-and-the-bomb story, half the room will nod along at a story they believe they already know. My own instinct is that the session should move from the technical statement of the problem to the epistemological one, and that the sequence should make that move feel forced rather than announced, but I am not attached to that arc if you think the dependencies actually run the other way.

  Lead with your bottom line in the first sentence and then give your reasoning. No preamble, and do not restate my question.
reasoning: |-
  Hmm, the user is a doctoral student in cognitive science preparing a 75-minute session on the frame problem for an interdisciplinary reading group. They want a detailed teaching plan that avoids standard examples like the robot-and-bomb scenario. The audience includes philosophy and machine learning students with no prior exposure to AI literature on this topic. 

  The core challenge is making the frame problem land as a philosophical difficulty rather than an engineering nuisance. ML students will likely reduce it to computational cost, while philosophers might conflate it with the problem of induction. The session must show why the difficulty persists beyond formal fixes without diving into technical machinery.

  For the carrying example, I need something novel that demonstrates non-change implications without triggering prior associations. A plant scenario could work - say, moving a plant to a new room. The critical missing element must be why the AI wouldn't consider secondary effects like photosynthesis disruption, even if it knows all relevant facts. This exposes the core issue: relevance determination isn't solvable by adding more rules.

  The sequence should start technical and escalate to epistemological. First establish the minimum mechanics of formal systems (predicates, axioms), then show prediction failure in the example. When ML students suggest scaling solutions, pivot to showing how more rules create explosive inference problems. For philosophers leaning toward induction parallels, emphasize that the issue isn't uncertainty about future events but inability to bound reasoning about present state.

  Key misconceptions to preempt:
  - At minute 20: When introducing prediction failure, explicitly state "This isn't about processing power" before ML students go there
  - At minute 50: During the "why not more rules?" discussion, distinguish from induction by noting we're not predicting sunlight changes, but failing to recognize sunlight as relevant at all

  The knockout question at the end: "Could a system with complete knowledge of physics still fail to recognize which facts stay relevant when I move the plant? Why?" This tests if they grasp that relevance isn't deducible from physical laws alone.

  Finally, declare upfront what won't be covered: historical AI approaches, connectionism debates, or Husserlian lifeworlds. Keep focus tight on the inferential paralysis point.
answer: |-
  **Teach the frame problem through escalating failures in a novel "plant relocation" scenario, moving from prediction mechanics to epistemological paralysis.**  

  ### **Sequence & Dependencies**  
  1. **Start with prediction in state-based systems (15 min)**  
     *Why*: Anchor in concrete computation. Define: states (object properties), actions (state changers), prediction (inferring post-action properties).  
     *Dependency*: Without this, philosophers miss the technical trigger; ML students lack the "naive system" baseline.  

  2. **Introduce the "plant relocation" example (10 min)**  
     - *Setup*: An AI controls a hospital’s environmental system. You tell it: *"Move the potted plant from the dim east wing to the bright west wing; ensure it survives."*  
     - *Initial success*: AI infers obvious changes (location, light exposure).  
     - *Failure*: Plant dies. Why? AI didn’t infer that **moving the plant breaks its symbiotic relationship with east-wing humidity sensors** (which now over-humidify the empty space, triggering mold alerts that cause a shutdown of the west wing’s climate control).  
     - *Key lack*: No rule or sensor for "symbiotic dependencies"; the system knows humidity sensors exist but *doesn’t see them as relevant to plant relocation*.  

  3. **Expose the "non-change" inference gap (15 min)**  
     *Why*: Shows the frame problem isn’t about *changes* but *non-changes*.  
     - Ask: "Which facts *stay true* after moving the plant?"  
     - AI correctly assumes the hospital’s name is unchanged, but *fails* to assume the humidity sensors’ calibration is unchanged (they weren’t touched, but their function depended on the plant).  
     - *Dependency*: Steps 1–2 show *why* listing all non-changes is impossible; ML students now see it’s not just "more compute."  

  4. **Invite repairs—then sabotage them (20 min)**  
     - *ML misconception*: "Add rules for dependencies!" → Counter: "What counts as a dependency? If we add ‘plants affect sensors,’ do we add ‘sensors affect floor-cleaning bots’? Rules cascade infinitely."  
     - *Philosophy misconception*: "This is induction—we can’t know all contingencies!" → Counter: "Induction worries about *future* unknowns. Here, the AI *already has* the sensor data; it fails to see *present* relevance."  
     - *Escalate*: "Even if we add ‘relevance detectors,’ how do they *avoid* checking irrelevant facts (e.g., whether moving the plant changes the hospital’s tax ID) without prior relevance criteria?"  

  5. **Climb to the epistemological problem (15 min)**  
     - *Pivot*: "Why can’t we predefine relevance? Because relevance is *situational* and *infinite*: e.g., moving the plant *might* affect a visiting botanist’s research, altering funding, etc."  
     - *Land the difficulty*: **Formal systems fail because relevance isn’t deductively derivable; it requires context no rule set can bound.**  

  ---

  ### **Knockout Question**  
  *"If the AI had perfect physical knowledge (e.g., quantum states of the hospital), could it solve this by simulating everything? Why would that still miss the problem?"*  
  - **Correct grasp**: Simulating everything wouldn’t help—it still needs to *select* which simulations to run (e.g., why simulate air molecules but not botanists’ moods?). The selection *is* the frame problem.  
  - **Superficial answer**: "Yes, more compute fixes it" (misses the relevance triage) or "No, induction limits knowledge" (misattributes to uncertainty).  

  ---

  ### **Explicit Omissions**  
  Declare upfront: *"We won’t cover: historical AI approaches (STRIPS, etc.), connections to phenomenology, or solutions like probabilistic reasoning. Why? Today’s goal is to isolate why the problem *resists* formal fixes, not survey fixes."*  

  ### **Why This Works**  
  - **Example design**: The plant-sensor symbiosis is unfamiliar, lacks obvious causality, and *conspicuously lacks a "relevance boundary"*—forcing the "why didn’t it consider X?" question.  
  - **Dependency flow**: Technical → repair attempts → epistemological collapse. ML students hit computational limits by Step 4; philosophers see induction isn’t sufficient by Step 5.  
  - **Misconception timing**: Cut off ML’s "scaling" fix when inviting repairs (Step 4); block philosophy’s induction leap during the sabotage (Step 4 counter).  
  - **Arc**: The problem *becomes* philosophical through failed engineering, making the shift unavoidable.
