  Okay, the user has been involved in political arguments online and noticed a recurring pattern. They describe a situation where accusations of bad faith seem to depend entirely on whose side is being challenged, not on the actual behavior of the person. For example, methodological criticisms are seen as honest scrutiny if they target the opposing side, but as dishonest tactics if they challenge one's own side. Concessions are viewed as tricks, and how someone structures their argument is always interpreted negatively.

  The user mentions existing terms like concern trolling or moving the goalposts but feels these don't capture the core issue. They point out that these terms describe specific tactics, whereas the pattern they observe is about how the standard for good faith itself shifts to fit preconceived conclusions. They want to know if there's a recognized concept for this, or if not, how to define it properly.

  First, I need to identify what exactly the user is describing. The key elements are:
  - Accusations of bad faith are applied inconsistently based on the conclusion rather than behavior.
  - Any action can be interpreted as evidence of bad faith depending on the desired outcome.
  - The criteria for good faith seem to be retroactively applied after the conclusion is already decided.

  Now, I should check existing concepts. Cognitive biases like Motivated Reasoning come to mind, where people interpret evidence to support their existing beliefs. The Fundamental Attribution Error might play a role too, attributing others' actions to malice. Confirmation bias is another angle, but it's about seeking confirming evidence, not redefining standards.

  The user mentions that existing terms like sealioning or concern trolling focus on tactics, not the shifting standards. So those don't fit. The closest might be the "Principle of Charity," but that's about interpretation, not the criteria for good faith itself. 

  Ah, the concept of the "Double Standard" is relevant here. People apply different standards to in-group vs. out-group. But is there a specific term for the shifting criteria of good faith? 

  Epistemic Double Standards might be part of it, where people judge the validity of evidence differently based on the source. But the user's description is more about the evaluation of argumentative intent, not just evidence. 

  I recall the "Motte-and-Bailey" fallacy, but that's about switching between defensible and controversial positions. Not quite. 

  What about "Kafka Trapping"? That's when denying an accusation is taken as proof of guilt. It's related because in the user's scenario, defending oneself against bad faith accusations is seen as further evidence of bad faith. But Kafka Trapping is a specific tactic, while the user's issue is broader—about the entire framework for determining good faith being manipulated.

  Putting this together, the core issue is the selective application of standards to label arguments as bad faith based solely on the desired conclusion. This seems like a form of Motivated Reasoning applied to meta-argumentation. But there isn't a single term for it. 

  The user might need a new term. "Convenient Casuistry" comes to mind—using flexible reasoning to reach desired outcomes. Or "Selective Skepticism," but that's more about evidence evaluation. 

  "Intentionality Toggling" could work, as it involves switching the perceived intent based on convenience. But maybe "Post Hoc Bad-Faith Attribution" captures the retroactive application. 

  Considering the user's deeper needs: They've been frustrated by unproductive arguments and want to name this pattern to better identify and discuss it. They might be seeking validation that their observation is real and a tool to articulate it, which could help in debates or community moderation. They might also want to understand the underlying psychology to navigate or mitigate such dynamics.

  In conclusion, there isn't an established term, so proposing "Conclusion-Contingent Epistemic Standards" or "Post Hoc Bad-Faith Attribution" with clear definitions and distinctions would be helpful. Highlighting how this differs from similar concepts and providing boundary cases should address their request comprehensively.
answer: |-
  This phenomenon **is not perfectly captured by any single established term**, but it represents a critical and recognizable pattern in polarized discourse. It's primarily a manifestation of **motivated reasoning applied to meta-argumentation**, specifically the evaluation of *arguer intent* and *argumentative standards*. Here's the analysis:

  1.  **Core Phenomenon:** The selective application of inconsistent, retroactively justified criteria for judging "good faith" in argumentation, based solely on whether the *conclusion* of the argument aligns with the evaluator's pre-existing position. Conduct itself is rendered ambiguous and universally condemnable through this selective framing.

  2.  **Why Existing Terms Fall Short:**
      *   **Motivated Reasoning:** This is the *engine* driving the phenomenon. People are motivated to protect their own beliefs and discredit opposing ones. However, "motivated reasoning" is broad and doesn't specifically address the *shifting standards for judging argumentative intent and method*.
      *   **Confirmation Bias:** Similar to motivated reasoning, it explains seeking/discrediting evidence but doesn't focus on the meta-level evaluation of *how* arguments are presented or the *intent* attributed to the arguer.
      *   **Fundamental Attribution Error (FAE):** This (attributing others' behavior to disposition/malice while attributing our own to situation) is *part* of it, especially regarding intent ("they concede as a trick," "they object to manufacture doubt"). However, FAE doesn't capture the *systematic inconsistency in applying standards of argumentative rigor* ("objection good when it hurts them, bad when it hurts us").
      *   **Double Standard:** This is *central* but *too general*. The phenomenon is a specific type of double standard applied to the *epistemic evaluation of argumentative conduct and intent*.
      *   **Principle of Charity (Violation):** The phenomenon is a *systematic and motivated violation* of the Principle of Charity. But the violation itself isn't named, and the Principle is a normative ideal, not a descriptor of the bad behavior.
      *   **Concern Trolling / Sealioning / Moving Goalposts:** As you noted, these describe specific *tactics* an arguer might use (feigned concern, bad-faith requests for proof, shifting standards). Your phenomenon is about the *evaluator's inconsistent framework for detecting/defining those tactics* based on the conclusion.
      *   **Kafka Trapping:** (Where denying an accusation is taken as proof of guilt, e.g., "Your defensiveness proves you're guilty"). This is a *close cousin* and a specific *tactic enabled by* your phenomenon. Your phenomenon provides the *underlying framework* where *any* conduct can be interpreted as evidence of bad faith, making Kafka Trapping easy. But Kafka Trapping is a specific rhetorical move, while your phenomenon is the evaluative double standard that makes it possible and pervasive.
      *   **Motte-and-Bailey Doctrine:** Involves switching between a defensible ("motte") and controversial ("bailey") position. While related to strategic argumentation, it's a tactic *used by the arguer*, not the *evaluator's shifting standards for judging intent*.

  3.  **Analysis of the Phenomenon:**
      *   **Unified Core:** This is fundamentally **one core phenomenon**: the application of **conclusion-contingent epistemic standards** to judge argumentative intent and method. The evaluator's desired conclusion dictates:
          *   What constitutes valid scrutiny vs. obstructionism.
          *   What constitutes honest concession vs. strategic deception.
          *   What constitutes clarity vs. dogmatism or obfuscation.
      *   **Mechanism:** It works through **retroactive justification**. The evaluator starts with the verdict ("This conclusion is bad/dangerous/wrong"), then selects the interpretive frame that renders the arguer's conduct as evidence of bad faith, regardless of what that conduct actually was. The ambiguity inherent in communication (e.g., *why* did they concede? *Is* that sample size *really* too small for this context?) provides ample raw material for this motivated reinterpretation.
      *   **Effect:** It creates **unfalsifiable suspicion**. Any attempt by the accused to demonstrate good faith (explaining reasoning, conceding points, adjusting arguments) can itself be reinterpreted through the same conclusion-contingent lens as further evidence of bad faith (strategic maneuvering, deception). This paralyzes productive discourse and entrenches polarization.

  4.  **Proposed Terminology:**
      Given the lack of a perfect fit, coining a precise term is justified. The clearest options capture the core elements:

      *   **Conclusion-Contingent Epistemic Standards (CCES):**
          *   **Definition:** The practice of applying inconsistent criteria for evaluating the validity, rigor, and good faith intent of an argument based solely on whether its conclusion aligns with the evaluator's pre-existing beliefs or desired outcome. Conduct is interpreted retroactively to fit the predetermined verdict of bad faith or intellectual dishonesty.
          *   **Focus:** Highlights the dependence of epistemic judgment (standards for knowledge/truthfulness) on the desired conclusion.
      *   **Post Hoc Bad-Faith Attribution:**
          *   **Definition:** The process of attributing bad faith intent to an arguer *after* rejecting their conclusion, by selectively interpreting their argumentative conduct (methodology, concessions, structure) as evidence of dishonesty, using standards that would not be applied to identical conduct supporting the evaluator's preferred conclusion.
          *   **Focus:** Emphasizes the retroactive and motivated nature of the intent attribution.

      **(CCES is slightly more precise, encompassing standards beyond just intent attribution).**

  5.  **Boundary Cases & Distinctions:**
      *   **Is It:** Accusing someone of *actual, specific* concern trolling because they *consistently* use faux-concern only to undermine opposing views (with evidence of the pattern).
      *   **Is It:** Applying a genuinely consistent, if strict, standard of evidence that happens to disfavor one side more often (e.g., always demanding large sample sizes in a field where one side often uses small studies).
      *   **Is It:** Misunderstanding an opponent's argument due to genuine confusion or complexity, leading to a mistaken accusation of bad faith.
      *   **Is NOT:** **Actual, demonstrable bad faith arguing** (e.g., caught lying about sources, consistently refusing to engage with counter-evidence regardless of source, using known fallacies deliberately). CCES is about the *unjustified accusation*, not the actual tactic.
      *   **Is NOT:** **Simple hypocrisy** (e.g., "You said small samples are bad when I used one, but you used one last week!"). CCES involves a *systematic framework of interpretation* applied in the moment, not just pointing out past inconsistency. Hypocrisy can be evidence *of* CCES, but CCES is the deeper mechanism.
      *   **Is NOT:** **Confirmation bias alone.** While driven by it, CCES specifically warps the evaluation of *argumentative conduct and intent*, not just the evaluation of the evidence/content itself.
      *   **Edge Case:** **Kafka Trapping:** This is a specific *instance* or *tactic* that *relies* on CCES. Accusing someone of bad faith for defending themselves is enabled by the CCES framework that precludes the possibility of genuine defense. CCES is the broader evaluative pattern.

  **In essence:** You've identified a pervasive and corrosive pattern in polarized discourse: **Conclusion-Contingent Epistemic Standards (CCES)**. It's the motivated application of a double standard for judging argumentative rigor and intent, retroactively justifying the attribution of bad faith based solely on the undesirability of the conclusion, rendering any conduct potentially condemnable and making accusations unfalsifiable. While fueled by motivated reasoning and related to concepts like FAE and double standards, the specific focus on the *evaluation of argumentative conduct and intent* warrants this distinct label. Recognizing CCES is crucial for understanding why political arguments often feel so futile and accusatory.
