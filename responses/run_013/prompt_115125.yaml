answer: |-
  Here’s a structured proposal tailored to your objectives, scope, and concerns. It focuses on dissecting norm variation, avoids collapsing into existing debates, and integrates your asymmetry insight while acknowledging limitations.

  ---

  **Seminar Paper Proposal: Normative Asymmetries in Social Conventions**  
  **Moral Philosophy, Everyday Life, and the Visitor-Local Distinction**

  ### 1. **Research Question**  
  Can a tripartite analysis of social norms—evaluating their *functional role*, the *legibility of non-compliance*, and their *precedent-setting capacity*—explain why certain norms bind locals and visitors asymmetrically, and why deviations (e.g., tipping omission by a visitor vs. a local) may differ morally from superficially similar acts (e.g., queue-cutting or jaywalking)?

  ### 2. **Why the Question is Open & Existing Accounts Are Insufficient**  
  Existing frameworks treat norms monolithically:  
  - **Coordination accounts** (e.g., Lewis-style conventions) reduce norms to efficiency, ignoring distributive shifts (like tipping’s quasi-price function).  
  - **Fairness accounts** (e.g., mutual expectation) overlook how *legibility* affects reciprocity (e.g., a server can’t "answer" a tip omission post-transaction).  
  - **Harm-based views** struggle with cases like empty-street jaywalking where risk isn’t shifted.  
  - **Skeptical positions** (no obligation) fail to explain intuitive discomfort with selective deviations (e.g., why a tourist’s non-tip feels distinct from a local’s).  

  Your three features cut across these categories, creating novel tensions:  
  - A norm can be coordination-*like* yet have low legibility (queue norms) *or* high distributive impact (tipping).  
  - Precedent-setting is undertheorized; its moral weight (e.g., normalizing red-light crossing) is often conflated with fairness or harm.  

  This leaves room for a *feature-contextual* account: obligations may arise not from "convention" per se, but from *which combination of features* a norm exhibits, and *for whom* (visitor/local).

  ### 3. **Method & Timeline**  
  **Month 1: Framework Construction & Literature**  
  - Define the three features rigorously:  
    - **Function**: Coordination device / Price-completion / Risk-allocation (mapping your examples).  
    - **Legibility**: Real-time observable (queue) vs. deferred (tip) vs. non-observable (isolated jaywalking).  
    - **Precedent**: High (public deviation, copyable) vs. Low (private/deviation unobserved).  
  - Critically survey existing norm typologies (moral/conventional distinction, practice-dependence theories).  

  **Month 2: Matrix Analysis & Case Selection**  
  - Develop a **3x3 matrix** scoring norms (tipping, queues, jaywalking) on each feature.  
  - Identify **divergent cases** where features pull against standard accounts:  
    - *Tipping as price-completion*: Non-tip harms via wage reliance (distributive), but low legibility weakens fairness objections.  
    - *Jaywalking as low-precedent risk-allocation*: Harmless when solitary, but locals’ deviations set precedents eroding systemic safety.  
    - *Queue-cutting*: High legibility enables immediate sanction, but pure coordination function weakens moral blame if efficient (e.g., merging lanes).  
  - Test asymmetry hypothesis: Does tipping bind visitors *more* (as non-tip signals guest disrespect, not service quality) while jaywalking binds locals *more* (precedent risk)?  

  **Month 3: Normative Implications & Limitations**  
  - **Refine asymmetry thesis**: When do features combine to create stronger obligations for visitors (e.g., tipping’s distributive impact + symbolic legibility) vs. locals (e.g., jaywalking’s precedent + embeddedness in risk-pooling)?  
  - **Address criticizable norms**: Briefly examine cases where features misalign (e.g., a "precedent-heavy" norm allocating risk unfairly—like victim-blaming customs—showing how your framework helps diagnose shifts of obligation).  
  - **Scope limits**: Focus on 2–3 core norms; defer broader taxonomy. Legal implications partial (see below).  

  ### 4. **Legal Implications (Unfinished Section)**  
  *How might this bear on law’s treatment of custom?*  
  - Legal recognition of customs (e.g., trade usage, indigenous practices) often hinges on "observability" and "consistency"—paralleling *precedent* and *legibility*.  
  - Asymmetry suggests law may rightly distinguish locals’ precedent-setting actions from visitors’ contextually legible ones (e.g., tourist ignorance as excuse).  
  - *Limitation*: Fuller analysis requires separate treatment of legal vs. moral obligation. Flagged for future work.  

  ### 5. **Expected Outcomes & Success Criteria**  
  - **Real result**: A feature-based framework that:  
    - Explains tipping/jaywalking/queue asymmetries better than unitary accounts.  
    - Shows *when* precedent/legibility/function generate distinct obligations for visitors/locals.  
    - Reveals why some deviations feel "merely unconventional" (empty-street jaywalking) and others "unfair" (non-tip).  
  - **Success**: If the matrix resolves cases where existing theories conflict (e.g., "Why is non-tip not *just* coordination failure?").  
  - **Failure**: If features collapse into existing categories (e.g., precedent → fairness) or asymmetry vanishes under scrutiny. *Mitigation*: Focus on edge cases (e.g., high-precedent tipping in tight-knit communities).  

  ### 6. **Scope & Limitations**  
  - **Feasible in one semester**: Deep analysis of 3 norms + 1–2 counter-cases (e.g., gift-giving). 7,000 words permits rigor without sprawl.  
  - **Cut**:  
    - Comprehensive legal theory → confine to "custom in law" parallels (1 paragraph).  
    - Full taxonomy of norms → use cases illustratively.  
    - Empirical psychology → philosophical analysis only.  
  - **Key limitation**: Precedent-setting needs conceptual development (drawn from collective action problems?).

  ---

  **Why this avoids restating standard views**: By treating features as *variables* (not normative criteria), and testing their combinatorial effects on visitor/local asymmetry, you move beyond "Do conventions obligate?" to "*Which* convention-*features* obligate *whom*, and *why*?" This generates new testable hypotheses (e.g., "high-precedent + low-legibility norms bind locals strongest") and reframes the debate.
