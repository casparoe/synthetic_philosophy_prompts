prompt: |-
  Bit of an odd one. I'm a trial statistician — I design and analyse randomised clinical trials, mostly oncology, so my working life is randomisation, sampling frames, stratification, differential non-response, and lately the estimand framework (the ICH addendum where you have to write down in advance what you even mean by "the effect of the drug", including what happens to a patient who stops taking it — treatment policy vs hypothetical strategy, etc.).

  Anyway, last month my name came out of a hat: I got invited to one of those citizens' assemblies, and then actually got drawn in the second-stage stratified lottery, so I'm now spending Saturdays deliberating about the local transport budget. And the whole thing feels *exactly* like something I do at work, and I cant tell whether that's genuine insight or whether my vocabulary is just eating the concept.

  So here's what I want. Restate the case for sortition / lottocracy — the argument that we should fill legislatures, or at least policy bodies, by lottery instead of election — in my vocabulary. Sampling frames, probability vs convenience sampling, selection bias, stratification, differential non-response, attrition, ITT vs per-protocol, external validity, and the estimand machinery. Go claim by claim: here's the claim as its advocates put it, here's the best translation into my language, here's what got bent on the way over. Please don't just hand me "elections are a self-selected sample, sortition is an unbiased one, QED" — I basically already believe that, which is exactly why I'm suspicious of it.

  Then the residue report, which is the part I actually want. What in the sortition debate has no counterpart in my vocabulary at all? Legitimacy, authority, consent, accountability — I assume those are the answers, but I want to know precisely where the translation breaks, and whether the break means my framework is missing something real or the original claim was vaguer than it looked. One test case I'd like you to run all the way through: the Ostbelgien setup in Belgium, where a standing citizens' council drawn by lot sets the agenda for the assembly that then deliberates. Is that a sampling-design decision, or is it a different kind of animal entirely? And relatedly: what exactly is the estimand of an election or a citizens' assembly — today's opinion, or the opinion the population would have reached after a week of being handed experts and time to talk? Those look like different estimands to me and I don't think anyone in the debate is being explicit about which one they mean.

  Be upfront about what's settled among people who actually work on this (e.g. that elections select for a particular kind of person) versus what's genuinely contested (e.g. whether statistical representativeness buys any authority at all, or whether deliberation is a feature or a bias), and don't sell me a contested view as the consensus. Also try not to smuggle my framework's assumptions in and call it translation — "representative" doesn't get to mean "correct" for free.

  Last line: \answer{...} containing a short phrase naming the one thing that most clearly fails to survive the translation.
reasoning: |-
  Okay, the user is a trial statistician working in oncology clinical trials, dealing with concepts like randomization, sampling frames, stratification, etc. They've been selected for a citizens' assembly on local transport budgets and noticed parallels between their work and this political process. They want me to reframe the arguments for sortition using their statistical vocabulary while identifying where the translation breaks down.

  First, I need to map statistical concepts to sortition arguments. The core claim is that elections suffer from selection bias because they rely on self-selected samples (convenience sampling), whereas sortition uses random sampling for better representativeness. That's straightforward. But the user already knows this and is suspicious of oversimplification, so I need to go deeper.

  Stratification in sortition ensures demographic representativeness, similar to clinical trials. But in politics, stratifying by demographics might miss attitudinal diversity, which isn't measured in the sampling frame. That's a limitation. Differential non-response is a big issue too—if certain groups are less likely to participate when selected, it biases the sample. In trials, we handle this with ITT analysis, but in assemblies, non-response might exclude crucial voices, like marginalized groups.

  The estimand framework is crucial here. What's the target quantity? Is it the population's current opinion (descriptive) or their informed opinion after deliberation (counterfactual)? Elections often measure the former, while citizens' assemblies aim for the latter. The Ostbelgien model adds complexity: a permanent citizens' council setting the agenda. Is this a multi-stage sampling design? Partially, but it also introduces institutional memory and agenda control, which aren't statistical concepts.

  Where the translation breaks down: legitimacy and accountability. In statistics, representativeness relates to external validity, but in politics, legitimacy comes from perceived fairness and consent. A statistically perfect sample might still lack authority if the public doesn't trust the process. Accountability in elections is direct (voting out representatives), but in sortition, it's through transparency and oversight, which are different mechanisms.

  The user also wants to know what's settled vs. contested. It's settled that elections have selection bias and sortition improves descriptive representation. But whether statistical representativeness grants authority is contested. Deliberation's role is debated too—does it refine opinions or introduce new biases?

  The residue after translation: legitimacy and authority. These concepts don't have direct statistical counterparts. A sample can be representative but not seen as legitimate if the process isn't accepted. The Ostbelgien model's agenda-setting by a citizens' council isn't just sampling; it's about empowering the assembly, which touches on legitimacy.

  Finally, the one thing that fails the translation is "authority from consent," as it's inherently normative and political, not statistical. The answer should highlight this breakdown.
answer: |-
  Here's the translation you requested, structured claim-by-claim using your statistical framework, followed by the residue report and test cases. I'll flag settled points (S), contested points (C), and translation breaks (⚠️).

  ### Core Claims of Sortition Translated
  1.  **Claim (Original):** "Elected representatives are unrepresentative; they skew wealthy, educated, and politically ambitious."
      *   **Translation:** Elections rely on **convenience sampling** (self-selection for candidacy/participation) leading to **severe selection bias**. The sampling frame (eligible candidates/voters) excludes large segments (due to barriers to entry: resources, time, network access). Key **strata** (income, education, personality traits like ambition/extroversion) are systematically over/underrepresented. **Differential non-response** is extreme in voting (low turnout correlates with socioeconomic status).
      *   **Settled (S):** Empirical evidence overwhelmingly supports this descriptive representativeness deficit in elected bodies vs. the population.
      *   **Bend/Warning:** "Unrepresentative" here is primarily *descriptive/demographic*. Sortition aims for this descriptive representativeness via random sampling. It doesn't inherently solve *substantive* representativeness (policy preferences *after* information/deliberation) - that's the estimand question.

  2.  **Claim (Original):** "A randomly selected assembly is a 'mini-public' mirroring the population."
      *   **Translation:** Sortition uses **probability sampling** (ideally stratified random sampling) from a defined **sampling frame** (e.g., voter rolls, census data) to achieve a **representative sample** with known **margins of error**. **Stratification** ensures proportional inclusion of key demographics (age, gender, geography, perhaps education/ethnicity).
      *   **Settled (S):** Properly executed sortition achieves vastly superior *descriptive/demographic* representativeness compared to elections.
      *   **Bend/Warning:** "Mirroring" is aspirational. Limitations exist: Sampling frame imperfections (exclusions), **differential non-response/attrition** (those selected declining or dropping out - often correlated with disadvantage/time poverty), inability to stratify on unmeasured latent traits (e.g., personality, values). It's a sample, not a clone.

  3.  **Claim (Original):** "Citizens' assemblies produce wiser, more considered, long-term decisions."
      *   **Translation:** Deliberation is an **intervention**. The assembly's output (decision/recommendation) is the **outcome**. The claim is that this outcome reflects the **population's counterfactual opinion** *under the condition of* receiving balanced expert information, structured discussion, and sufficient time (the deliberation protocol).
      *   **Contested (C):**
          *   Is deliberation a **feature** (reducing individual noise/bias, integrating diverse perspectives, leading to more informed/stable judgments - improving internal validity *for the counterfactual estimand*)?
          *   Or a **bias** (introducing groupthink, facilitator influence, expert persuasion, social pressure - threatening internal validity)?
      *   **Bend/Warning:** "Wiser" is normative. Statistics can assess *changes* in opinion pre/post deliberation, information retention, or satisfaction with the process, but not "wisdom" directly. This claim hinges entirely on defining the estimand.

  4.  **Claim (Original):** "Sortition avoids the corrupting influence of money, parties, and campaigning."
      *   **Translation:** Random selection minimizes **selection bias** inherent in systems requiring significant resources (money, time, connections) for entry (election campaigning). It's an attempt at **ITT (Intention-To-Treat)** analysis for the *population's* potential judgment: "What policy would emerge if we could subject the *whole population* (intended sample) to this deliberative process?" even if some selected individuals **attrit** (drop out - analogous to non-compliance/missing data in ITT).
      *   **Settled (S):** Elections demonstrably select for individuals with higher tolerance/appetite for fundraising, campaigning, and partisan conflict. Sortition bypasses these filters.
      *   **Bend/Warning:** While selection bias is reduced, other biases can emerge *within* the assembly (group dynamics, expert influence). ITT is robust for *effect estimation* but doesn't guarantee the *quality* of the outcome, only that it reflects the process applied to the intended sample.

  5.  **Claim (Original):** "It gives ordinary people real power."
      *   **Translation:** This is primarily about **external validity (generalizability)**. The claim is that the assembly's decision is generalizable to the population's *considered will* (the counterfactual estimand), not just its top-of-mind opinion. The authority stems from this representativeness.
      *   **Contested (C) & Break (⚠️):** This is where translation strains severely. Statistical representativeness is necessary but **insufficient** for political power/authority. Power requires institutional design (what binds policymakers? advisory vs. binding?) and perceived **legitimacy** (next section). Statistics can't confer "power" alone.

  ### The Residue Report: Where Translation Breaks
  Your statistical framework brilliantly handles sampling, bias, intervention effects, and defining target quantities (estimands). It falters on the inherently political and normative concepts required for governance:
  1.  **Legitimacy (Break ⚠️):** Why should anyone obey? Statistics can show descriptive representativeness (S) and *argue* this *should* confer legitimacy. However, legitimacy is a *social perception* rooted in tradition, consent, procedural fairness, and perceived justifiability of outcomes. A perfectly representative sample might lack legitimacy if the process is opaque, experts dominate, or the public doesn't understand/believe in it. Conversely, an elected official with low descriptive representativeness can have high legitimacy via the electoral ritual.
  2.  **Authority (Break ⚠️):** Closely tied to legitimacy. Who has the *right* to make binding decisions? Elections derive authority from popular mandate (consent expressed via vote). Sortition derives it *implicitly* from statistical representativeness + the fairness of the lottery + the quality of the deliberative process. This is contested ground (C). Your framework can assess *inputs* (representativeness) and *process* (was deliberation fair?), but not the *authoritativeness* of the output itself.
  3.  **Accountability (Break ⚠️):** How are decision-makers answerable *after* the decision? Elections offer vertical accountability (vote them out). Sortition offers only horizontal accountability (oversight during the process, transparency of reasoning) and the finality of the lottery (no re-selection). **Attrition** is the closest statistical concept, but accountability is about *sanction* and *responsiveness*, not just dropout rates. This is a major criticism of sortition (C).
  4.  **Consent (Break ⚠️):** Elections are seen as an act of collective consent. Sortition replaces active consent (voting *for*) with passive consent (not rejecting the process/results). Statistical representativeness is argued to *embody* consent passively, but this is philosophically contested (C).

  ### Test Cases Analyzed
  1.  **The Estimand Question:**
      *   **Election:** Primarily estimates the **descriptive estimand**: "What is the *current* top-of-mind preference distribution of the *voting population* regarding pre-defined choices (candidates/parties) at this specific moment?" It conflates preference and candidate quality. Suffers from **selection bias** (who votes) and low **external validity** for complex policy judgments.
      *   **Citizens' Assembly:** Targets a **counterfactual estimand**: "What policy preference *would* the population converge towards *if* exposed to balanced information, expert testimony, facilitated deliberation, and sufficient time?" This requires defining the "protocol" (experts, time, facilitation rules) precisely. **ITT analysis** is crucial (include all selected, even if they drop out or don't fully engage). **External validity** hinges on how well the assembly's process mirrors the hypothetical population-wide deliberation (impossible to fully test). **This distinction is often unstated and critical.**

  2.  **Ostbelgien Model (Standing Citizens' Council sets agenda for Assembly):**
      *   **Translation Attempt (Sampling-Design):** It looks like a **multi-stage sampling design**. Stage 1: Stratified random sample selects the long-term Council. Stage 2: Council defines topics (strata/factors?). Stage 3: New stratified random sample selects Assembly members for each topic. Council acts as a permanent **stratification layer** or **oversight committee**.
      *   **Break & Different Animal (⚠️):** This is primarily about **agenda-setting power** and **institutional memory**, not just sampling. It addresses a key *political* critique of single assemblies: who controls what gets discussed? Statistically, the Council introduces a small, persistent **sampling error** (its own representativeness over time) and potential **bias** in topic selection. However, its purpose is *political legitimacy* (giving the "mini-public" control over the agenda) and *efficiency* (avoiding recreating the wheel). This layer exists outside pure sampling logic; it's an institutional innovation for empowerment and continuity.

  ### Summary: Settled, Contested, and the Break
  *   **Settled (S):** Elections = severe descriptive selection bias via convenience sampling. Sortition = superior descriptive representativeness via probability sampling (with caveats for frames/non-response).
  *   **Contested (C):** Whether deliberation improves decision quality or introduces bias; Whether statistical representativeness confers sufficient legitimacy/authority; Best methods for accountability; The relative importance of descriptive vs. counterfactual representativeness.
  *   **The Critical Break (⚠️):** Statistical representativeness is a *procedural input*. Legitimacy, authority, and consent are *socio-political outputs* dependent on perception, institutional embedding, and normative acceptance. A perfectly representative sample can lack authority if the process isn't trusted or its output ignored. Your framework explains *how* to get a good sample and define the target opinion, but not *why* that sample should wield power.

  \answer{Authority from Consent}
