answer: |-
  Here's the mapping of Rudd's 2008 apology against Austin/Searle's performative conditions, followed by a verdict on the theory:

  **Mapping the Apology to Performative Conditions:**

  1.  **Recognized Procedure & Recognized Effect:**
      *   *Procedure:* Addressing Parliament carries inherent authority. Apologies as state acts *were* becoming more common internationally (e.g., Canada, US), establishing a loose precedent. The parliamentary setting signals gravity.
      *   *Effect:* **Crucially, no conventional effect exists.** It did *not* legally discharge liability (compensation was explicitly excluded). Its intended effects were symbolic/moral: acknowledging wrongdoing, altering the national narrative, potentially fostering reconciliation. This is a fundamental mismatch. The "recognized effect" condition **fails** because there's no established societal convention for *what legally or formally happens* after such an apology beyond words.

  2.  **Correct & Complete Execution:**
      *   *Execution:* Performed by the head of government, in the highest legislative body, using clear performative language ("We apologise"). The formality and venue suggest correctness. **Condition arguably met.**

  3.  **Sincerity of Intention:**
      *   *The Speaker Problem:* The "speaker" is multiple: Rudd (individual), the Rudd Government (collective), Parliament (institution), the Australian nation (abstract, intergenerational). Can a collective entity "intend" or "feel" sincerely? Rudd likely intended the words; the government intended the political act. But the "nation" lacks a mind.
      *   *The Intention Problem:* The intention was clearly to *acknowledge* historical wrongs and express regret *without* accepting *legal* liability (hence the wording). Was the intention "to apologise" in the full, interpersonal sense (implying personal remorse and commitment to repair)? Or was it to perform a political/symbolic act? **Condition is deeply problematic and arguably fails** due to the corporate speaker issue and the gap between political and interpersonal sincerity. Can an apology be "sincere" if it consciously avoids one core consequence (repair/compensation)?

  4.  **Subsequent Conduct Conforming:**
      *   *Conduct:* This is ongoing and contested. Did subsequent policy ("Closing the Gap") significantly change in scope, funding, or effectiveness *because* of the apology? Did it demonstrably alter the relationship between the state and Indigenous peoples? Progress has been limited and criticised. This condition **fails to be definitively met** within a timeframe Austin/Searle likely envisioned for simpler acts. Conforming conduct for historical injustice is generational, complex, and difficult to attribute solely to the speech act.

  5.  **Uptake:**
      *   *The Addressee Problem:* The apology was directed to the Stolen Generations *and* Indigenous Australians collectively. Many survivors and communities welcomed it as deeply significant. Others rejected it as empty without tangible reparations or systemic change.
      *   *Refused Uptake:* Does refusal void the act? In interpersonal apologies, yes. Here, despite significant refusal, the apology remains a potent political and historical fact. Its impact isn't erased by refusal; it becomes part of the contested narrative. **Condition is partially met (some uptake occurred) but refusal doesn't "misfire" it in the same way.** The impact is more diffuse and persistent.

  **Verdict on Speech-Act Theory:**

  1.  **It Doesn't Break, But It Stretches Thin and Reveals Limitations:**
      *   **Core Insight Holds:** The apology *was* performative. It *did* change the social/political reality. It created a new "fact" – the Australian state had formally acknowledged the wrong. It shifted discourse irreversibly. Austin's fundamental point – words doing things – is validated.
      *   **Conditions Expose the Messiness:** The theory acts like a diagnostic tool, precisely highlighting where state apologies differ *radically* from the paradigmatic interpersonal performative (like a promise):
          *   **The Corporate/Abstract Speaker:** Austin/Searle's model assumes a unified, intending individual speaker. States are complex, multi-voiced, and temporally extended entities. "Sincerity" and "intention" become metaphorical or distributed.
          *   **The Diffuse/Historical Addressee:** The "hearer" isn't one person but generations, living and dead, with diverse responses. Refused uptake doesn't nullify the act.
          *   **Lack of Conventional Effect:** This is the biggest jam. State apologies often *create* their own precedent rather than fulfilling an established one. Their effects are symbolic, narrative-shifting, and political, not transactional or legally discharging in a conventional sense.
          *   **Temporal Dislocation:** The gap between the act (words) and the required subsequent conduct (generational change) is vast. Austin's model is synchronic (here-and-now); state apologies are diachronic.

  2.  **State Apologies Are a Distinct Hybrid Category:** They aren't *just* failed interpersonal apologies. They are **complex political-linguistic rituals** borrowing the *form* of an apology but serving broader functions:
      *   **Sovereign Acknowledgment:** The state formally records a historical truth it previously denied or minimized.
      *   **Narrative Re-founding:** Attempting to reset the national story and relationship with the wronged group.
      *   **Symbolic Purification:** Performing a cathartic act for the *current* polity, distancing it from the past.
      *   **Political Legitimation:** Demonstrating a (new) government's values/morality.
      *   **Foundation for Future Action:** *Potentially* creating a platform for policy change (though not guaranteed).

  3.  **The Theory's Silence & Where It's Precious:**
      *   **Silent on Collective Agency:** It lacks tools to analyze the speaker's complex ontology (individual leader vs. institution vs. nation across time).
      *   **Silent on Historical Scale:** It struggles with actions addressing wrongs committed by prior generations against prior generations, mediated through the present.
      *   **Silent on Ritual Power:** It undervalues the power of symbolic acts performed in sacred civic spaces (like Parliament) independent of strict sincerity or immediate conventional effects.
      *   **"Precious" Oversight:** Yes, the theory *is* overly tied to the simple dyad. Insisting that state apologies must meet *all* interpersonal conditions to "work" *is* precious. It ignores the unique political ontology and function of the state. The "misfire" concept is too binary for this context. An apology can be politically significant *even if* uptake is contested, sincerity is debatable, and tangible effects are delayed.

  **Conclusion:** Austin/Searle's framework doesn't break; it provides invaluable lenses to dissect *why* state apologies feel both powerful and precarious. Their conditions act like spotlights, illuminating the inherent tensions: the lack of a clear transactional effect, the impossibility of pure collective sincerity, the ambiguity of uptake. However, the theory is fundamentally limited by its interpersonal, here-and-now paradigm. State apologies are not "apologies" in the pure Austin sense; they are **sovereign performative rituals**. Their power lies less in fulfilling conventional speech-act conditions and more in their ability to reshape historical narratives, acknowledge state responsibility (however contested), and perform a symbolic reckoning that alters the political landscape for future action – messy, imperfect, but potentially transformative actions that simple interpersonal models cannot fully capture. The "jam" reveals the theory's boundaries, not its falsity.
