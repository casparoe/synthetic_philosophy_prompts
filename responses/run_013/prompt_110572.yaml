  Timing is crucial - at 90 minutes/1000 words, the question must be laser-focused. The examples should be concrete enough to prevent generic answers but open-ended for deeper analysis. The refund bot works well because the "being processed" phrasing naturally invites implicatures about timeliness that the bot can't intend or cancel.

  Noticing the user's background - they're tech-savvy but philosophically inexperienced. The model answer should avoid jargon while still being rigorous. The Slack bot "sounds good" example adds levity while making the intentionality problem undeniable. Smart of them to include that.

