prompt: |-
  I'm a backend engineer, no philosophy degree, never even took an intro course, but my mate teaches an upper-level philosophy of language unit and I've somehow been drafted into writing the take-home essay question for the Grice week, on the grounds that I wont shut up about chatbots at dinner. What I want is a question the students cant answer by dumping the cooperative principle and the maxims onto the page.

  The angle I'd like to build it around: Grice thinks a speaker means something by an utterance only if they intend to get a response out of the audience by way of the audience recognising that very intention, and he thinks conversational implicatures are things the hearer works out from assuming the speaker is being cooperative. So give them a case with no intentions in it anywhere. Say a support bot replies "yes, your refund is being processed" because that string comes from a template a dev wrote years ago, or a Slack bot answers "sounds good" to whatever you post. Make them say what's said, what if anything is implicated, who counts as the speaker here (the model, the dev who wrote the template, the company?), and whether anything in Grice's setup has to be given up to handle it. Push them on the cancellation test too — can an implicature be cancelled when there's nobody around to do the cancelling? — and on whether a hearer's inference can count as an implicature at all when there's no speaker behind it.

  Should be doable in 90 minutes, around 1000 words, 25 marks. Give me a model answer of roughly 700 words and a marking scheme with five must-hit points, the marks for each, and one line per point saying the mistake that usually costs students the mark.
