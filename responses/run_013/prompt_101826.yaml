  ## Brain Replacement Pantoum with Degrading Refrain

  *(After reading your uncle's story, I drafted these forms: a villanelle felt too insistently cyclical; terza rima too linear; a modified pantoum, where the refrain shifts minutely each recurrence, mimics the stepwise replacement. Rhyme felt dishonest for such uncertainty; meter loosened to iambic pentameter with variations, reflecting the "same function, different substrate" premise. The refrain's erosion *is* the argument.)*

