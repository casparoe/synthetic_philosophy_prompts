prompt: |-
  I run a second-year undergraduate seminar on practical reasoning, and next week I want to spend the whole fifty minutes on a case that looks like a two-line puzzle and then refuses to sit still. You are stranded in a desert; a lone driver stops and offers to take you to the next town, which you would otherwise never reach, on one condition: that you promise to pay him a sum on arrival, a sum you can easily afford but that he has no way to enforce. You will never see him again; there is no court, no contract, no witness, no consequence. You give the promise, he drives, you arrive, and now paying is simply worse for you than walking away. The sting is that his willingness to take you depended on his confidence that you are the kind of person who could not bring himself to break such a promise, so it seems you benefited from being unable to do the thing you will later have every reason to want to do. I want to use this to open up the wider family of cases in which a disposition is valuable to you precisely because it closes off an action, the cluster sometimes gathered under the heading of rational irrationality.

  Don't explain the case to me; I understand it well enough to be muddled about how to teach it. Plan the session. First, the order in which the pieces have to go for the paradox to arrive as a paradox and not as a parlour trick, and why each step depends on the one before it: what must already be in place about how we evaluate acts versus the dispositions behind them, and about the difference between a disposition and a self-binding mechanism, before the hitchhiker's situation can even feel like a problem, and whether that background should come before or after the case is told. Second, tell me which example should carry the session, and whether it should be the hitchhiker at all or some smaller case that does the work first; say what the carrying example must have and, just as importantly, must not have. I suspect that any version with repetition, reputation, or an enforceable contract quietly dissolves the puzzle, and that a case built on a mechanism (tying oneself to the mast) is a different lesson wearing the same clothes, but I want your judgement. Third, map the misconceptions I should expect, in the order they will actually surface, and tell me exactly where in the sequence to head each one off: that this is just a prisoner's dilemma; that it is Newcomb's problem renamed; that the hitchhiker should simply resolve at the moment of promising to pay later, as if a private resolution could bind him; that the whole point is that the driver is deceived; that the disposition must be chosen or manufactured for the occasion; and that rational irrationality licenses wishful thinking or acting against one's interests in general. Finish with the single question I should put to the room at the end that would distinguish a student who has grasped the structure from one who has merely enjoyed the story, and tell me what to leave out at this level and to say openly that I am leaving it out. The formal apparatus of team reasoning and the extension to cases where the relevant agent is a temporally extended self are the two omissions I have in mind, but I want your view.
reasoning: |-
  Okay, the user is teaching a seminar on practical reasoning and wants to structure a session around the hitchhiker's promise paradox. They need a plan that carefully sequences the elements to make the paradox land effectively. 

  First, I need to understand their core challenge: they're worried students might dismiss this as a trivial puzzle rather than grappling with its deeper implications about rationality and dispositions. The key is building the paradox step-by-step so the tension feels inevitable, not manufactured.

  Hmm... the background setup is crucial here. If I jump straight into the hitchhiker case, students might miss why it's problematic. They'll need to first understand two things: 1) how we normally evaluate actions (consequentialism) versus dispositions (long-term value), and 2) why dispositions aren't the same as deliberate self-binding. Maybe start with simpler examples - like explaining how being known as trustworthy has value independent of any single transaction. 

  For the carrying example... I'm torn. The hitchhiker is vivid but risky. A smaller case like the "honest person's dilemma" (where honesty costs you in a one-off interaction) might work better to isolate the core tension first. The hitchhiker can come later as the grand finale. Crucially, the example must be truly non-repeatable - any whiff of reputation effects ruins the paradox. And no, Odysseus-style self-binding is different; that's about overcoming weakness of will, not dispositional value. 

  Anticipating misconceptions is half the battle. Students will absolutely shout "Prisoner's Dilemma!" early on. Better address that right after stating the paradox - show how PD has mutual cooperation incentives while here the driver gains nothing from the passenger's disposition. Newcomb comparisons will come later from philosophy-savvy students; I'll need to highlight how Newcomb involves prediction while this is about constitutive value. 

  The hardest misconception will be "just resolve to pay!" - that misses how dispositions operate beneath conscious choice. I should preempt this by asking "Could you suddenly decide to enjoy the taste of soap?" to show dispositions aren't chosen at will. 

  For the closing question... something about whether the passenger regrets having this disposition. If they grasp the paradox, they'll see regret would undermine the very trait that saved them. 

  And yes, explicitly skip team reasoning and temporal selves - tell them these are important but for advanced treatment. Don't let tangents derail the core dispositional paradox. 

  This professor clearly knows their stuff - they've already spotted all the pitfalls. My job is helping them resist the urge to cover every angle, instead building the scaffolding so students discover the tension themselves.
answer: |-
  Here’s a structured 50-minute session plan focused on rigorous conceptual unfolding, misconception management, and pedagogical sequencing:

  ---

  ### **Session Structure**
  **Total Time:** 50 minutes  
  **Pedagogical Goal:** Use the hitchhiker paradox to expose the tension between act-based rationality and the value of inflexible dispositions.

  ---

  ### **Phase 1: Foundations (15 mins)**  
  *Why now?* Without this groundwork, the paradox feels like sophistry.  
  **Key Concepts:**  
  1. **Act-Consequentialism Baseline (5 mins):**  
     - Present a simple choice: *"You find a wallet with $100. Keeping it benefits you; returning it costs you. What should a rational agent do?"*  
     - Establish that standard rationality evaluates acts by their immediate consequences.  
  2. **Dispositions vs. Acts (7 mins):**  
     - Contrast: *"Being known as honest"* vs. *"acting honestly in one instance."*  
     - Use a *one-shot Prisoner’s Dilemma* **without communication/reputation**: Show why mutual defection is rational per act-consequentialism, but disastrous collectively.  
     - **Critical Point:** Dispositions (e.g., innate cooperativeness) can yield better outcomes *if they preempt temptation*.  
  3. **Dispositions ≠ Self-Binding (3 mins):**  
     - Distinguish Odysseus tying himself to the mast (deliberate, reversible strategy) from *being constitutionally unable to break promises* (inflexible trait).  
     - Ask: *"Could Odysseus untie himself if he tried?"* (Yes) vs. *"Can our hitchhiker ‘decide’ to break his promise?"* (No – by hypothesis).

  ---

  ### **Phase 2: The Hitchhiker Paradox (20 mins)**  
  **Why this case?** Its minimalism isolates the core tension.  
  **Carrying Example:** **Stick with the hitchhiker** – but streamline it:  
     - **Must Haves:**  
       - Strictly one-shot interaction (no reputation).  
       - No enforceable contracts or witnesses.  
       - Disposition is *categorical* (not chosen for this event).  
     - **Must Avoid:**  
       - Repetition, institutions, or any "shadow of the future."  
       - Any suggestion the driver is deceived (the disposition is *transparent*).  

  **Unfolding the Paradox (Step-by-Step):**  
  1. **Setup (5 mins):**  
     - Narrate the case crisply. Emphasize: *His offer depended on recognizing your inflexible promissory disposition.*  
  2. **The Tension (10 mins):**  
     - Q1: *"At the moment of payment, what does act-consequentialism say you should do?"* (Walk away: better outcome).  
     - Q2: *"But how did you get the ride?"* (Because your disposition guaranteed payment).  
     - **Paradox Emerges:** The trait that secured the benefit *requires* you to do what is now worse for you.  
  3. **The Sting (5 mins):**  
     - Highlight: *You benefited **because** you couldn’t choose the "rational" act later.*  
     - Link back to Phase 1: This isn’t about strategy (like the PD) – it’s about being *constitutively unable* to optimize locally.

  ---

  ### **Phase 3: Misconception Management (10 mins)**  
  **Address in this order (as they arise):**  
  1. **"This is just a Prisoner’s Dilemma!"** (Likely in Phase 1/2)  
     - *Response:* "In PD, mutual cooperation is stable with repetition. Here, no repetition – and the driver doesn’t ‘cooperate’; he *profits* from your inflexibility."  
  2. **"The hitchhiker should resolve to pay!"** (During paradox setup)  
     - *Response:* "A resolution is just an intention. What forces him to follow through? His disposition *is* the force – but it’s pre-rational."  
  3. **"The driver is deceived!"** (During tension phase)  
     - *Response:* "No deception: The driver correctly reads your real, unchosen disposition. If you could fake it, we’re in a different game."  
  4. **"So we should cultivate irrationality?"** (Post-paradox)  
     - *Response:* "Only specific inflexibilities that *reliably signal* your behavior to others. Wishful thinking lacks this structure."  
  5. **"It’s Newcomb’s Problem!"** (From philosophy-inclined students)  
     - *Response:* "Newcomb relies on predictive accuracy. Here, the driver doesn’t predict – he *reacts to a real trait*. No ‘Omega’ mystique."  

  ---

  ### **Phase 4: Consolidation & Assessment (5 mins)**  
  **Closing Question:**  
  > *"If the hitchhiker could choose his disposition at the start of life, would he rationally choose to be the kind of person who* cannot *break promises, knowing this case might occur?"*  

  - **Why this works:** Distinguishes students who see the *ex ante* value of the disposition ("Yes – it saves your life!") from those stuck in act-consequentialism ("No – paying is irrational!").  

  **Explicit Omissions:**  
  - **Team Reasoning:** "We’re treating agents as individuals; group agency is a separate tool."  
  - **Temporal Selves:** "We’re simplifying the ‘you’ over time; deeper theories split you into time-slices, but that’s for another day."  

  ---

  ### **Why This Sequence Works**  
  1. **Builds Necessary Frameworks First:** Act-consequentialism and dispositional value must be clear before the paradox bites.  
  2. **Hitchhiker as Ideal Carrier:** Its starkness forces engagement with the core idea. Smaller cases (e.g., "honest person loses $20") lack life-or-de stakes, making dispositions seem like hobbies.  
  3. **Preempts Distractions:** By banning repetition/mechanisms upfront, focus stays on the dispositional paradox.  
  4. **Misconceptions as Teachable Moments:** Each rebuttal reinforces the logic (e.g., rejecting "resolution" underscores that dispositions aren’t choices).  

  **Final Tip:** End by noting this is a "paradox" – not a solution – to open the door to next week: *Can rationality require being *unable* to be rational?* (Cue Kavka’s Toxin Puzzle...)  

  This plan respects the students’ ability to wrestle with abstraction while grounding each step in intuitive stakes. The hitchhiker’s haunting minimalism will linger after class.
