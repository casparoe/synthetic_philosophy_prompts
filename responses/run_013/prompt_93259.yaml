  We are given a sequential game with four milestones and a terminal full integration. The party on the clock at each milestone decides whether to lock in (ending the game) or advance (passing the initiative to the other side and moving to the next milestone). The payoffs are:

  - Milestone 1: C on the clock. Lock-in: (C:4, P:2)
  - Milestone 2: P on the clock. Lock-in: (C:3, P:5)
  - Milestone 3: C on the clock. Lock-in: (C:6, P:4)
  - Milestone 4: P on the clock. Lock-in: (C:5, P:9)
  - If both advance at milestone 4, full integration: (C:8, P:8)

  We analyze the game by backward induction, starting from the last possible decision.

  **Step 4: Milestone 4 (P on the clock)**
  At milestone 4, Platform (P) has two choices:
  - Lock in: (C:5, P:9)
  - Advance: which leads to full integration (if both advance) with (C:8, P:8)

  P compares its payoff: 9 (lock-in) vs. 8 (advance). Since 9>8, P would prefer to lock in, getting 9, rather than advance and get 8. Therefore, at milestone 4, P will lock in, resulting in (5,9).

  **Step 3: Milestone 3 (C on the clock)**
  At milestone 3, Consortium (C) has two choices:
  - Lock in: (C:6, P:4)
  - Advance: which leads to milestone 4, where we just determined that P will lock in, giving (5,9)

  C compares: 6 (lock-in) vs. 5 (if advance). Since 6>5, C would prefer to lock in at milestone 3, getting 6, rather than advance and get 5. Therefore, at milestone 3, C locks in, and the outcome is (6,4).

  **Step 2: Milestone 2 (P on the clock)**
  At milestone 2, P has two choices:
  - Lock in: (C:3, P:5)
  - Advance: which leads to milestone 3, where C will lock in, giving (6,4)

  P compares: 5 (lock-in) vs. 4 (if advance). Since 5>4, P would prefer to lock in at milestone 2, getting 5, rather than advance and get 4. Therefore, at milestone 2, P locks in, and the outcome is (3,5).

  **Step 1: Milestone 1 (C on the clock)**
  At milestone 1, C has two choices:
  - Lock in: (C:4, P:2)
