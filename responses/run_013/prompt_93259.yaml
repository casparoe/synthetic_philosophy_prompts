  **MEMORANDUM**

  To: Board of the Consortium  
  From: Chair  
  Date: [Current Date]  
  Subject: Recommendation on Shared-Collections Compact Vote  

  **Background**  
  We are voting on a shared-collections compact with our current commercial platform host. The compact has four milestones, with each party taking turns to decide whether to lock in (ending the process) or advance (moving to the next milestone). The payoffs in value points are:

  - Milestone 1 (Consortium's turn): Lock-in yields (4, 2) [Consortium, Platform]
  - Milestone 2 (Platform's turn): Lock-in yields (3, 5)
  - Milestone 3 (Consortium's turn): Lock-in yields (6, 4)
  - Milestone 4 (Platform's turn): Lock-in yields (5, 9)
  - Full integration (if both advance at milestone 4): (8, 8)

  **Analysis**  
  We conducted a backward induction analysis to predict the outcome:

  1. At milestone 4 (Platform's turn), Platform will lock in (yielding 9) rather than advance to full integration (which yields 8). Outcome: (5,9).  
  2. At milestone 3 (Consortium's turn), Consortium will lock in (yielding 6) rather than advance to milestone 4 (which would yield 5). Outcome: (6,4).  
  3. At milestone 2 (Platform's turn), Platform will lock in (yielding 5) rather than advance to milestone 3 (which would yield 4). Outcome: (3,5).  
  4. At milestone 1 (Consortium's turn), Consortium will lock in (yielding 4) rather than advance to milestone 2 (which would yield 3). Outcome: (4,2).  

  Thus, the predicted outcome is that the Consortium locks in at milestone 1, resulting in 4 value points for us and 2 for the Platform.  

  **Comparison to Full Integration**  
  Full integration offers 8 value points for each party, totaling 16. Our predicted outcome (4,2) totals 6, which is 10 points lower. We lose 4 points relative to full integration, and the Platform loses 6.  

  **Concern on Backward Induction**  
  The analysis relies on each party acting rationally at every stage, even stages that are never reached. This is a standard game-theoretic approach and is logically sound under common knowledge of rationality. However, in practice, parties might cooperate to achieve a better outcome. Unfortunately, without binding commitments, each party has a short-term incentive to lock in when it is their turn, leading to the early termination we predict.  

  **Platform's Internal Divisions**  
  The Platform is reportedly not a unitary actor, with a split board and a CEO facing a shareholder vote. This increases uncertainty: the Platform might not act as predicted at any milestone, which could either help (if they advance when we hope) or hurt (if they act unpredictably). This makes the backward induction outcome more likely to be disrupted, but it is unclear whether the disruption would be positive or negative for us.  

  **Variant with No Terminal Milestone**  
  The negotiators have floated a variant with automatic renewal and a graduated exit fee. This changes the game to a repeated interaction, which can support cooperation (like full integration) if both parties value the future enough and the exit fee is sufficiently high. However, the Platform's internal divisions may undermine their ability to commit to long-term cooperation, making this variant risky. It escapes the backward induction problem (because there is no fixed endpoint) but introduces new challenges in sustaining cooperation.  

  **Value Points as Common Currency**  
  We treat the value points as a common currency for analysis. If the parties value points differently, the analysis might change, but we have no information to suggest that.  

  **Strongest Case for Signing As Drafted**  
  Even though we get only 4 points in the predicted outcome, it may be better than the status quo. Additionally, there is a chance (though against the game-theoretic prediction) that the Platform might cooperate and we could reach a later milestone. However, given the structure, this is unlikely without a binding agreement.  

  **Recommendation**  
  I recommend that we **do not sign the compact as drafted** because it predicts a low outcome (4 points) and fails to capture the full value of integration (8 points). Instead:  

  - We should pursue the variant with no terminal milestone (automatic renewal with a graduated exit fee) and negotiate the exit fee to be substantial enough to deter opportunism.  
  - If the Platform is unwilling to agree to that, we should attempt to renegotiate the payoffs to make advancing more attractive at each stage.  

  If we cannot secure these changes, we should explore alternative hosting arrangements that offer better long-term value.  

  **Bottom Line**  
  Vote **against** the compact as drafted and direct the negotiators to pursue the repeated-game variant with a strong exit fee.  

