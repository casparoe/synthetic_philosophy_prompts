  The analysis assumes that the value points are comparable and that we can add them (as in the total 16 for full integration). But if the two sides value points differently (for instance, if the consortium's value point is worth more in real terms than the platform's), then the analysis might change. However, without specific information, we assume that the value points are given in a common metric. The memo does not provide information to the contrary.

