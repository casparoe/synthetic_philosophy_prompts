  ### MEMORANDUM  
  **To:** Board of the Consortium of Eleven Independent Research Libraries  
  **From:** Chair  
  **Date:** [Date of Circulation]  
  **Subject:** Recommendation on Shared-Collections Compact Vote (Thursday Meeting)  

  #### I. Executive Summary  
  After rigorous analysis of the proposed four-milestone compact with our commercial platform host, I recommend **declining the compact as drafted**. The backward induction outcome—where both parties act rationally at each milestone—results in the Consortium locking in at Milestone 1, yielding only **4 value points** for us (vs. 2 for the Platform). This sacrifices 4 points relative to full integration (8 points) and fails to capture the partnership’s potential value. The structure incentivizes early lock-in due to mutual certainty about future behavior, a flaw inherent to the game’s design. I propose negotiating the **automatic-renewal variant** (with a graduated exit fee) to enable cooperation, though it relocates—but does not eliminate—the core problem. Signing as drafted is defensible only if the status quo is worse than 4 points, but our analysis suggests this is suboptimal.  

  #### II. Backward Induction: The Arithmetic  
  We model the compact as a sequential game, starting from the end (Milestone 4) and working backward. Payoffs are in value points (C = Consortium, P = Platform):  

  - **Milestone 4 (P’s turn)**:  
    - Lock-in: (C:5, P:9)  
    - Advance: Proceeds to full integration (C:8, P:8).  
    *Analysis*: P compares 9 (lock-in) vs. 8 (advance). **P locks in** (9 > 8).  

  - **Milestone 3 (C’s turn)**:  
    - Lock-in: (C:6, P:4)  
    - Advance: Leads to Milestone 4, where P locks in (C:5, P:9).  
    *Analysis*: C compares 6 (lock-in) vs. 5 (advance). **C locks in** (6 > 5).  

  - **Milestone 2 (P’s turn)**:  
    - Lock-in: (C:3, P:5)  
    - Advance: Leads to Milestone 3, where C locks in (C:6, P:4).  
    *Analysis*: P compares 5 (lock-in) vs. 4 (advance). **P locks in** (5 > 4).  

  - **Milestone 1 (C’s turn)**:  
    - Lock-in: (C:4, P:2)  
    - Advance: Leads to Milestone 2, where P locks in (C:3, P:5).  
    *Analysis*: C compares 4 (lock-in) vs. 3 (advance). **C locks in** (4 > 3).  

  **Outcome**: The game ends at **Milestone 1** with payoffs **(C:4, P:2)**.  

  #### III. Opportunity Cost  
  - **Full integration** (achievable only if both advance at all milestones) yields **(C:8, P:8)**, totaling 16 value points.  
  - **Predicted outcome** yields **(C:4, P:2)**, totaling 6 value points.  
  - **Cost to Consortium**: We sacrifice **4 points** (50% of full integration) by locking in early.  

  #### IV. Addressing the Core Concern: Is Backward Induction Defective?  
  The argument for locking in early rests on each side’s *certainty* about the other’s future behavior—even though those stages are never reached. This is **not a defect in the reasoning**; it is logically sound under two assumptions:  
  1. **Common knowledge of rationality**: Both parties believe the other will act rationally at every stage.  
  2. **No external commitments**: Parties cannot credibly promise to cooperate.  

  In practice, this certainty is **philosophically valid but practically fragile**. It ignores real-world trust, reputation, or renegotiation. However, without binding mechanisms, backward induction correctly predicts the outcome. **The board should not set this aside**: It exposes a structural flaw in the compact that disadvantages us.  

  #### V. Impact of Platform’s Internal Divisions  
  The Platform’s split board and shareholder pressure introduce **strategic uncertainty**:  
  - **Backward induction assumes a unitary rational actor**. If the Platform’s leadership is fragmented, it may deviate from predicted behavior (e.g., advancing at Milestone 2 to seek short-term shareholder approval, even if irrational).  
  - **Risk to Consortium**: This could lead to better outcomes (e.g., reaching Milestone 3) or worse (e.g., Platform impulsively locking in earlier).  
  - **Recommendation**: Do not rely on this unpredictability. If divisions deepen, the Platform may prioritize short-term gains (e.g., locking in at Milestone 2 for P:5), hurting our long-term position.  

  #### VI. Automatic-Renewal Variant: Does It Fix the Problem?  
  The variant (renewing every two years, graduated exit fee) **relocates—but does not escape—the problem**:  
  - **Advantage**: No terminal milestone enables **cooperation through repeated interaction**. Players can punish defection (e.g., exit fees deter lock-in), potentially sustaining full integration (C:8, P:8).  
  - **Risk**: The backward induction logic resurfaces in exit decisions. If the Platform believes we will exit later, it may exit early to avoid fees—triggering the same suboptimal lock-in.  
  - **Verification**: For cooperation to hold, the exit fee must exceed the short-term gain from defection (e.g., if P locks in early for 9 points, the fee must cost them >1 point).  
  - **Recommendation**: **Pursue this variant** but demand a high exit fee (e.g., >2 points for P) to align incentives.  

  #### VII. Strongest Case for Signing As Drafted (and Why We Reject It)  
  **Argument for signing**:  
  - The status quo (no compact) may yield <4 points (e.g., if digitized holdings degrade without investment).  
  - Early lock-in guarantees 4 points with no further risk.  
  - Platform divisions might serendipitously lead to a better outcome (e.g., P advances at Milestone 2).  

  **Counterargument**:  
  - 4 points is our *worst-case* outcome in the compact. Milestone 3 offers 6 points, and full integration offers 8.  
  - Relying on Platform irrationality is speculative. Absent amendments, signing leaves 4–8 points unrealized.  
  - If the status quo is >4 points (e.g., no platform fees), signing is a net loss.  

  #### VIII. Do Value Points as Common Currency Matter?  
  Treating value points as comparable is **reasonable for analysis**:  
  - Total points (16 at full integration) reflect joint value creation.  
  - If points are not fungible (e.g., Consortium points include non-monetary benefits), the relative losses (4 points vs. 8) still hold.  
  - No evidence suggests asymmetric weighting.  

  #### IX. Recommendation and Bottom Line  
  - **Decline the compact as drafted**. It guarantees a suboptimal outcome (C:4) due to backward induction incentives.  
  - **Direct negotiators to pursue the automatic-renewal variant** with a graduated exit fee exceeding the Platform’s short-term gain from defection (e.g., >1 point based on P’s lock-in payoffs).  
  - **Fallback**: If the Platform refuses, explore alternative hosts or renegotiate milestone payoffs (e.g., increase C’s lock-in at Milestone 2 to >5 for P to disincentivize early lock-in).  

  **Bottom Line**: Vote **AGAINST** the current compact. The predicted outcome sacrifices 50% of our potential value. The automatic-renewal variant offers a path to cooperation but requires a punitive exit fee to succeed.  

  ---  
  **Respectfully submitted for Thursday’s vote.**  
  **Chair, Board of the Consortium**
