prompt: |-
  I recently moved from a biology background into a cognitive science programme, and the collision between the two has left me preoccupied with the standing of evolutionary psychology. Over the past few months I have settled into a position I did not expect to hold, and I would like you to tell me what would count against it. The position is roughly this: the familiar charge that adaptationist hypotheses about the mind are unfalsifiable just-so stories is overstated, because such hypotheses can be made to carry genuine empirical risk. Developed properly, a hypothesis about a cognitive adaptation commits itself to more than a redescription of known behaviour. It predicts a specific computational structure — a signature of special design, in the sense of economy, precision, and specificity that a domain-general learning mechanism would be unlikely to produce — and that structure can be probed by dissociations, by cross-species comparison, and by whether the hypothesis outperforms a byproduct-and-plasticity null model on some independently measurable dimension. On this view, evolutionary psychology is a normal science with a demanding but satisfiable evidential standard, and its critics have mistaken the difficulty of meeting that standard for the impossibility of doing so.

  What I want from you is a map of how exposed that position really is. Which observations, arguments, or formal results would count against it, and which of those would be decisive rather than merely awkward? Test the position against concrete cases if that helps — the proposal that disgust functions as a behavioural immune system, the proposed cheater-detection module, the claim that low mood is an adaptation for analytical rumination — and tell me where the evidence cuts against the view rather than for it. I am especially interested in the gap between the position as an ideal and the field as it is actually practised: what would it take to show that the standard is satisfiable in principle but almost never met in fact, and would that be a problem for the position or only for the field? Tell me what the position predicts that its rivals do not — say, the view that most of these traits are byproducts, or the view that they are better explained by developmental plasticity and cultural transmission — and identify the divergent bets that have already been run and what they came to. I would also like to know which of the standard escape hatches are legitimate qualifications and which amount to insulating the view from refutation: retreating to testability in principle, quietly widening the ancestral environment until it explains anything, or allowing the adaptation to be whatever mechanism happens to solve the problem on average. Rank the defeaters from fatal to merely embarrassing, say which ones a committed defender would themselves concede rather than only what critics allege, and finish by telling me whether the position, as I have stated it, still risks anything at all — and if it does not, whether that is a defect in the position or simply the price of a mature research programme.
reasoning: |-
  Hmm, this user presents an impressively sophisticated position on evolutionary psychology (EP) and requests a rigorous stress-test. They've transitioned from biology to cognitive science and developed a nuanced defense of EP's scientific standing, arguing that adaptationist hypotheses can meet demanding but achievable evidential standards through special design arguments. Their core claim is that critics mistake methodological difficulty for impossibility.

  The user wants me to systematically evaluate vulnerabilities in their position. Key requests include:
  - Identifying decisive counterevidence from concrete EP case studies
  - Analyzing the gap between theoretical ideals and actual practice
  - Contrasting predictions with rival explanations (byproducts, plasticity)
  - Evaluating common "escape hatches" used in EP
  - Ranking counterarguments by severity

  I should start by acknowledging the sophistication of their position - it's far more refined than typical EP defenses. The special design emphasis correctly raises the evidential bar beyond mere functionality claims. But the real test lies in whether this standard is consistently met.

  For concrete counterexamples:
  Disgust research shows plasticity issues - cultural variation in disgust triggers challenges the rigid adaptation narrative. The cheater-detection module faces empirical problems with content-neutral reasoning performance. Analytical rumination theory struggles with depression's non-adaptive features.

  Regarding the ideal-practice gap: Massive inference challenges plague actual research. The step from current function to past adaptation requires solving the reconstruction problem - we lack time machines for EEA specification. Most EP studies show reverse-engineering bias rather than genuine prediction.

  Compared to rivals: Plasticity models better explain rapid cultural shifts. Byproduct theories account for domain-repurposing without invoking new modules. EP's divergent bets (e.g., modularity predictions) have largely failed in cognitive neuroscience.

  Escape hatch evaluation:
  - "Testable in principle" becomes problematic when not followed by actual tests
  - Expanding the EEA to all possible environments destroys predictive power
  - "Whatever works" mechanisms sacrifice computational specificity

  Fatal flaws would include evidence of widespread exaptation and neural reuse, while embarrassing issues include ad hoc EEA definitions. Crucially, EP's core vulnerability remains the difficulty of excluding plasticity explanations - the very problem their position claims to solve.

  The position does retain risk - it would be falsified by consistent failure to find predicted special design across domains. But its resilience partly stems from shifting standards, which is problematic. Mature sciences like genetics constantly risk falsification; EP's defenses sometimes prevent this.

  In conclusion, the user's position is defensible philosophically but fragile empirically. It survives only if we accept extremely high burdens of proof for rivals while granting EP generous concessions. The most damaging evidence comes from actual research practice rather than theoretical possibility.
answer: |-
  Your position represents a sophisticated, principled defense of evolutionary psychology (EP) as a falsifiable research program centered on "special design" evidence. Below, I map its vulnerabilities, ranking counterarguments from fatal to manageable, and evaluate empirical cases. The core tension lies between the position’s *theoretical* defensibility and the *practical* challenges of meeting its standards.

  ---

  ### **Fatal Defeaters (If True, Undermine the Position Fundamentally)**
  1. **The Universality of Neural Reuse/Exaptation**  
     - **Threat**: If cognitive traits *routinely* repurpose existing neural circuitry for new functions (neural reuse theory), "special design" signatures (e.g., specificity, economy) become indistinguishable from byproducts.  
     - **Evidence**: fMRI studies show "domain-specific" tasks (e.g., cheater detection) activate generalized networks (e.g., prefrontal cortex). Language may repurpose motor planning circuits.  
     - **Divergent Bet**: EP predicts *dedicated* circuitry for hypothesized adaptations; neural reuse predicts *overlap*. Current neuroimaging favors reuse.  
     - **Decisiveness**: If neural reuse is the *default* (Anderson, 2010), special design becomes an unreliable criterion. Conceded by EP critics (e.g., Barrett, 2015) but not most defenders.

  2. **Adaptive Lag Makes Predictions Untestable**  
     - **Threat**: If the environment of evolutionary adaptedness (EEA) is irreducibly vague or shifts too rapidly, predictions about "adaptive function" dissolve.  
     - **Case Study**: **Disgust as a "Behavioral Immune System"** fails to explain modern triggers (e.g., moral disgust) or cultural variation (Curtis et al., 2011). Is sushi disgust a misfire or cultural learning? EP struggles to disentangle.  
     - **Escape Hatch?**: Retreating to "in-principle testability" without specifying EEA parameters is insulating. If the EEA is widened to include *all* Pleistocene social dynamics (e.g., for cheater detection), it explains anything.  
     - **Decisiveness**: If no method can independently reconstruct the EEA, hypotheses lose empirical bite.

  ---

  ### **Severe Challenges (Potentially Fatal if Unresolved)**
  3. **Developmental Plasticity Outperforms EP Predictions**  
     - **Threat**: If domain-general learning + cultural transmission explain traits faster and more parsimoniously, EP’s "unlikely to emerge" claim collapses.  
     - **Case Study**: **Cheater-Detection Module** (Cosmides & Tooby): Wason selection task data show content effects *vary* with culture/experience. Plasticity models (e.g., Bayesian learning) replicate "module-like" effects without innate structure (Fiddick et al., 2016).  
     - **Divergent Bet**: EP predicts cross-cultural universality and early emergence; plasticity predicts variation and ontogenetic tuning. Evidence: Cheater detection improves with age/culture.  
     - **Rank**: Severe—EP defenders (e.g., Barrett) concede learning plays a role but argue it requires "prepared templates."

  4. **Byproduct Explanations Are Often Simpler**  
     - **Threat**: EP hypotheses frequently ignore null models (e.g., spandrels). When a trait fits multiple explanations, simplicity favors byproducts.  
     - **Case Study**: **Low Mood as Analytical Rumination** (Andrews & Thomson): Depression’s link to creativity/analysis could arise from stress-induced neural changes (byproduct) rather than adaptation. Suicide risk and chronicity are maladaptive, undermining "special design."  
     - **Evidence**: Depression’s neurobiology overlaps with sickness behavior (a byproduct of inflammation), not a unique computational signature (Nettle, 2004).  
     - **Decisiveness**: If EP consistently favors complex adaptations when simpler alternatives exist, it violates Occam’s razor.

  ---

  ### **Awkward but Manageable Challenges**
  5. **Methodological Circularity in "Special Design"**  
     - **Threat**: "Economy, precision, specificity" are often inferred *post hoc* from the trait itself.  
     - **Example**: EP claims jealousy shows male-specific sexual infidelity detection. Critics note jealousy arises in non-sexual contexts (e.g., friendships), suggesting generality.  
     - **Legitimate Qualification?**: Predictive success in novel domains (e.g., kin detection via odor) can avoid circularity—but such cases are rare.  
     - **Rank**: Embarrassing—defenders concede this occurs but argue it’s corrigible (Buss, 2019).

  6. **Cross-Species Comparisons Undermine Human Uniqueness**  
     - **Threat**: If similar traits appear in distant species without shared selective pressures, domain-general mechanisms are implicated.  
     - **Example**: "Fairness" behaviors in primates (Brosnan & de Waal) may stem from general conflict resolution, not a human-specific adaptation.  
     - **EP Response**: Argues for homologous adaptations—but risks ad hoc explanations.  

  ---

  ### **The Ideal vs. Practice Gap**
  **What Would Show Satisfiable in Principle but Not in Practice?**  
  - A systematic review revealing that >90% of EP hypotheses:  
    (a) Fail to specify testable special design criteria *in advance*,  
    (b) Do not compare against plasticity/null models,  
    (c) Use just-so EEA narratives when contradicted.  
  - **Status**: Richardson (2007) found only 5% of EP studies proposed critical tests; most retrofit data. If this pattern holds, the field is empirically empty.  
  - **Problem for**: The *field*, not your position. Your stance requires reform, not abandonment.

  ---

  ### **Legitimate vs. Illegitimate Escape Hatches**
  | **Escape Hatch**               | **Legitimate?** | **Why?** |  
  |--------------------------------|-----------------|----------|  
  | "Testable in principle"        | **Yes**         | Heuristic value (cf. string theory) if active tests are pursued. |  
  | "Widening the EEA"             | **No**          | Destroys predictive specificity; becomes unfalsifiable. |  
  | "Mechanism X solves Y on average" | **No**          | Violates "special design" by allowing inefficiency/messiness. |  
  | "Adaptation is a toolkit"      | **Yes**         | If toolkits predict *constraints* (e.g., limited domain-relevance). |  

  ---

  ### **Conclusion: Does the Position Risk Anything?**
  **Yes, but conditionally**:  
  - It risks falsification if:  
    (a) No EP hypothesis ever meets its special design standard (e.g., precision neurocomputational predictions + dissociation evidence),  
    (b) Plasticity models consistently explain the same data more parsimoniously,  
    (c) Neural reuse/exaptation is proven the *primary* driver of cognitive evolution.  
  - **Current Status**: The position risks little *in practice* because few hypotheses are held to this standard. Its rigor is aspirational—a strength if it reforms EP, a weakness if it serves as a shield.  
  - **Maturity Price**: All mature sciences (e.g., physics) tolerate some untestable ideas while demanding empirical wins. EP lacks equivalent wins (e.g., a prediction like gravitational waves). Until it delivers one, the position risks being a "noble failure."  

  **Your best defense**: Double down on *prospective* predictions. For example, design an experiment where domain-general learning fails to produce a predicted special design trait under controlled conditions. If EP cannot do this, it concedes to its rivals.**
