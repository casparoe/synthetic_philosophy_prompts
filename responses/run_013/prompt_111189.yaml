     - There is no edge from `X` to `Y` or vice versa.
     - Moreover, we assume that `Λ` captures all the common causes of `A` and `B`. This is the assumption of **no unmeasured confounding** for the pair (`A`, `B`). In other words, there are no latent variables other than `Λ` that cause both `A` and `B`.

