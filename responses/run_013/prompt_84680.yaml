  ## The Unranked Garden: On Work, Worth, and Walking Forward

  [Professor Name] here. And before anyone asks, no, they haven’t reinstated the big prize just for this speech. Believe me, I checked. My mother flew all the way from Norway for this, and she’d appreciate the symmetry.

  It’s an immense honor to be standing here. Also slightly terrifying. Like being handed the microphone at a family reunion where half the relatives haven’t spoken since the Great Potato Salad Incident of ’09. I know the history. Three years ago, this college stopped awarding Latin honors and individual prizes at commencement. No more *summa cum laude*, no more announcing that the So-and-So Prize in Economics goes to… well, me, once upon a time.

  And I know the feelings run deep. Under this tent right now, there are parents who believe something vital was stolen from their graduates. There are trustees who resigned over it. There’s a president sitting right behind me [*slight gesture*] who championed the change. And there are faculty members, some nodding along right now, who think it was the best decision in decades. My own two aunts flew in from Norway too. They mainly think American graduation ceremonies are *very long*. They’re not wrong.

  So, why me? Probably because I embody the awkward contradiction. I won the big prize. It mattered to me. Deeply. The validation, the recognition, the sheer relief that the grinding work paid off in a tangible, shiny way. I can’t stand here and tell you it didn’t matter. That would be dishonest.

  But I also can’t stand here and tell you I earned it in some perfectly pure, uncomplicated way. That would be more dishonest. Excellence isn’t a solo act. It’s scaffolded by privilege, opportunity, late-night pep talks, professors who saw something you didn’t, sheer dumb luck sometimes, and yes, moments of cutting corners or leaning on resources others lacked. My nineteen-year-old self, fresh off the boat from Norway, learned that fast. The prize felt wonderful. It also felt… borrowed. Or perhaps, shared, in ways the plaque couldn’t capture.

  Now, when you look at the debate around this change, you hear a lot of borrowed vocabulary. On one side: “The college is punishing excellence!” And somewhere nearby, often muttered with a knowing Scandinavian inflection (or at least, in my head), you hear: “*Janteloven*.”

  For those unfamiliar, the *Law of Jante* comes from a 1933 satirical novel by Aksel Sandemose, set in a stifling Danish town. Its ten commandments all boil down to: *Don’t imagine you’re anyone special. Don’t imagine you’re better than us. Don’t imagine you’re good at anything.* And then the eleventh, unspoken rule: *We know things about you.* It’s *not* a celebration of humility. It’s a scathing portrait of a place where relentless conformity is enforced by gossip, surveillance, and the crushing weight of “we’ve always known you.” A small college, let’s be honest, can sometimes feel exactly like that place. The faculty who support ending the rankings? They aren’t just being envious. Maybe they’re trying to dismantle a system that can feel like institutionalized *Jante*, whispering that your worth is a fixed point on a public scale.

  Then the other side reaches for a different metaphor: “Tall Poppy Syndrome.” The idea that envy makes people want to cut down those who rise above. Sounds plausible, right? But here’s the thing: I fell down that particular etymological rabbit hole. The original “tall poppy” story isn’t about jealous neighbors at all. It comes from Livy, and before him Herodotus (though he used wheat). It features a *tyrant*. Faced with a rival city, the tyrant walks into his garden, lopping off the tallest poppy heads. His silent message to the messenger? “Cut down the leading citizens.” The one holding the shears isn’t the resentful crowd; it’s the one *at the top*, using hierarchy and ranking as a tool of control. That cuts rather sharply against the simple narrative on either side of this debate, doesn’t it? Who, exactly, is wielding the shears when we design these systems?

  So where does that leave us? Knee-deep in borrowed metaphors that don’t quite fit? Perhaps. But it points towards something important about what we were *really* doing with those prizes and honors.

  **I think we confused two things that desperately need to be untangled: Praising what someone *did*, and rating what someone *is*.**

  Celebrating a brilliant thesis, a groundbreaking research project, a stunning performance, a solution to a complex problem – that’s praising the *work*. It’s pointing to something tangible, created, shared. It says, “Look at this amazing thing that was made!” It invites appreciation, learning, even emulation. We absolutely should do *more* of that. We should shout about your incredible projects, your senior comps that kept professors up reading late because they were *that* good, your community initiatives that changed lives. This college thrived on that kind of specific, work-focused recognition long before the prizes stopped, and it must continue.

  But ranking persons? Declaring one person *summa* and another *magna*, singling out one individual as “the best” in a field? That’s different. That’s rating the *being*. It takes the complex, evolving, messy reality of a human – shaped by circumstance, support, setbacks, and sheer grit – and slaps a definitive label on them. It implies a final judgment, a settled hierarchy. It turns the vibrant, diverse garden of a class into… well, into a row of poppies, some deemed inherently taller, inherently better.

  And here’s the uncomfortable truth the valedictorian rarely admits: **The ranking *never* felt entirely clean, even to the person ranked.** Even holding that prize, I knew the brilliant insights my classmate had that never made it onto the page. I knew the hardships others overcame just to be here, let alone compete. I knew my own lucky breaks. The ranking offered a thrill, but it also offered a quiet unease. Did this *label* capture me? Did it capture anyone? Or did it just simplify something beautifully complex into a number or a title?

  Perhaps that’s the nuance lost in the change three years ago. Maybe the college, in seeking to dismantle the problematic act of *rating persons*, accidentally muffled the vital act of *praising work*. The baby might have been tossed with the bathwater labeled "Ranking."

  Graduates, as you leave this particular garden – this intense, sometimes gossipy, often brilliant small town we call [College Name] – you’ll enter worlds obsessed with ranking. LinkedIn endorsements, performance reviews, salary bands, best-of lists, viral fame. The pressure to be the tallest poppy will be immense. And the temptation to judge yourself and others solely by that height will be constant.

  Don’t let the absence of a label here today fool you into thinking your work doesn’t matter. It does. Deeply. What you *did* here – the papers you wrote, the problems you solved, the art you created, the bridges you built (literal or metaphorical) – that’s real. That’s yours. That deserves praise, recognition, and celebration. Demand that recognition. Give it generously to others. Shine a light on the *work*.

  But guard fiercely against the insidious slide into rating the *worth* of the person behind it. Resist the tyranny of the definitive label, whether it’s applied by a system, a boss, a social media algorithm, or even your own inner critic. You are not *summa*. You are not *magna*. You are not the “Best Young [Profession] Under 30.” You are complex, evolving, capable of brilliance and error, shaped by circumstance and sustained by community. You are more than any single achievement, or any ranking, could ever capture.

  This college took a stand against one specific form of ranking. It was messy and controversial. It still is. But maybe, just maybe, they were trying to clear some space. Space not for less excellence, but for a different way of seeing it. Space where we praise the work without reducing the worker to a point on a scale. Space where we can admire the tallest blooms without feeling the phantom shears – whether wielded by a tyrant, a system, or our own anxieties – hovering over our heads.

  So, Class of [Year], walk forward. Celebrate what you *did*. Treasure the community that helped you do it. Build worlds where work is recognized fiercely, but where people are never, ever reduced to a rank. Your garden is waiting. Go tend it, unranked and magnificent. And try to keep the potato salad incidents to a minimum. My aunts are watching.
