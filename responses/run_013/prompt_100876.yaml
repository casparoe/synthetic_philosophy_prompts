  Below is a decision tree designed to map commitments about the metaphysics of time in light of special relativity, starting from the shared premise that special relativity is correct and simultaneity is frame-relative. The tree branches only at contested philosophical steps (never at position labels), with each node phrased as a question answerable without knowing the outcome. Leaves represent major positions, each annotated with its most awkward commitment. Gaps (unoccupied answer combinations) are diagnosed as incoherent, unattractive, or unexplored. The tree flags limitations explicitly and fits on one page (6 nodes, 7 leaves, 3 gaps).

  ---

  ### **Decision Tree: Metaphysics of Time After Special Relativity**  
  *Start: Special relativity is correct, and simultaneity is frame-relative.*

  1. **Is the frame-relativity of simultaneity an objective feature of the world?**  
     - **No (conventional artifact):** Go to 2.  
     - **Yes (ontological fact):** Go to 4.  

  2. **Can an absolute (frame-independent) present be defended?**  
     - **Yes:** Go to 3.  
     - **No:**  
       - **→ Deflationism**  
         *Most awkward commitment: The entire debate about temporal ontology is merely verbal or conventional, dismissing profound intuitions about time as linguistic confusions.*  

  3. **Is the absolute present grounded in a privileged reference frame?**  
     - **Yes:**  
       - **→ Neo-Lorentzian Presentism**  
         *Most awkward commitment: Positing an undetectable, metaphysically privileged frame that violates the spirit (though not the letter) of relativity.*  
     - **No:**  
       - **→ Presentism (Relativity-Irrelevant)**  
         *Most awkward commitment: Denying that relativity—despite its empirical success—constrains temporal ontology, rendering physics and metaphysics radically disjoint.*  

  4. **Does a frame-independent present exist?**  
     - **Yes:**  
       - **GAP 1: Incoherent**  
         *Diagnosis: Affirming an ontological frame-relativity while also asserting a frame-independent present is contradictory.*  
     - **No:** Go to 5.  

  5. **When reality is indexed to a reference frame, does "simultaneous with" imply "equally real" within that frame?**  
     - **Yes:** Go to 6.  
     - **No:**  
       - **→ Fragmentalism**  
         *Most awkward commitment: Reality decomposes into mutually incompatible perspectives, violating the transitivity of "real" and fragmenting the world.*  

  6. **Is the "equally real" relation transitive across frames?**  
     - **Yes:**  
       - **→ Eternalism (Block Universe)**  
         *Most awkward commitment: All events are equally real, reducing temporal passage to an illusion and clashing with lived experience.*  
     - **No:** Go to 7.  

  7. **Is reality confined to part of spacetime?**  
     - **Yes (only past/present):**  
       - **→ Growing Block**  
         *Most awkward commitment: The "growing edge" of reality requires a universal present, but relativity provides no non-arbitrary way to define it.*  
     - **Yes (all exist, but presentness moves):**  
       - **→ Moving Spotlight**  
         *Most awkward commitment: The "spotlight" of presentness must move along a privileged foliation, contradicting relativity’s Lorentz symmetry.*  
     - **No:**  
       - **GAP 2: Unattractive/Unexplored**  
         *Diagnosis: Denying transitivity *and* spacetime-wide reality leaves no coherent account of what is real; few defend this.*

  ---

  ### **Limitations & Notes**  
  1. **Eternalism (Block Universe):** The tree cannot distinguish between:  
     - Eternalists persuaded by the Rietdijk-Putnam argument (relying on transitivity).  
     - Eternalists convinced by Minkowski’s geometric spacetime (no transitivity step needed).  
     *Why: Both answer identically to all nodes.*  

  2. **Growing Block vs. Moving Spotlight:** These diverge only at the final node (Q7). Both require an absolute present (hence branch at Q2) but differ on which events are real.  

  3. **Gaps:**  
     - **Gap 1 (Q4: Yes):** Incoherent—ontological frame-relativity precludes a frame-independent present.  
     - **Gap 2 (Q7: No):** Unattractive/Unexplored—no theory occupies this space, as it offers no alternative reality criterion.  
     - **Gap 3 (Q2: No + Debate Substantive):** Incoherent—conventionality + no absolute present voids grounds for substantive temporal ontology.  

  4. **Defensibility of Order:** The sequence prioritizes foundational disputes:  
     - Q1 addresses the conventional/ontological divide (most immediate challenge to the Rietdijk-Putnam premise).  
     - Q4–Q6 mirror the argument’s critical steps (frame-independence → simultaneity-to-reality → transitivity).  
     - A participant reaching an "incorrect" leaf can trace missteps (e.g., affirming frame-independence at Q4 derails into Gap 1).  

  ### **Key for Participants**  
  - **Follow the tree:** Answer based on your commitments, not desired labels.  
  - **Check gaps:** If stranded in a gap, reconsider your answers or embrace the awkwardness!  
  - **Mind the limits:** Some positions (e.g., eternalism) are indistinguishable here. Focus on *why* your answers converge.  

