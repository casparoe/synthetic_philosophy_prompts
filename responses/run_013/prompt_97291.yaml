  We are constructing a scenario that meets the following requirements:
   - One life, no reincarnation, ordinary setting (family, small business, hospital), one paragraph.
   - Three positions: 
     (1) Ledger karma: suffering is deserved because it's the ripening of the sufferer's own past action, regardless of memory or continuity of self.
     (2) Ordinary retributive desert: suffering is deserved only if the same blameworthy subject who did the wrong is still around to undergo the suffering.
     (3) Deflationary / no-self karma: causal ripening is real, but desert is a projection; nobody deserves anything.

   We want the base case to have (1) and (2) agree that the suffering is deserved (not an injustice), while (3) dissents (saying it's not deserved, though causally explained).

   Then, we will create a variant by removing the feature that makes (1) and (2) agree, and show how the verdicts change.

   Finally, we'll have a defender's reply from the position that comes out worst, and evaluate if it lands.

   Constraints: 
     - The desert must attach without the person knowing why (so no memory or agreement it's fair).
     - The verdicts must fall out from what happens.

   Idea for the base case:

   We need a situation where the same person who did a bad deed is still around (so (2) is satisfied) and the suffering is the result of their own past action (so (1) is satisfied). But we also need to set up the tension with no-self: in (3) even though the causal chain is real, there's no enduring self to deserve it.

   However, we also want to set up for the variant: when we remove the feature that makes the same person still around, then (2) should change.

   So let's design a case with an adult who did something bad in their youth, and now suffers as a consequence. The same person is still around (so (2) is okay) and the action is theirs (so (1) is okay). But (3) will say: even though the cause is in their past, the "they" now is not the same as the "they" then in a substantial way, so desert doesn't apply.

   However, note that (2) typically requires continuity of the same person (which might be psychological continuity) and the person being blameworthy. But if the person has changed dramatically (e.g., brain injury, profound moral transformation) then (2) might not hold. We want to avoid that in the base case.

   Therefore, in the base case, we have a person who has not changed in any fundamental way (so (2) holds) but the act was long ago and they don't remember it (so memory is not required, per constraint).

   Scenario:

   In a small family business, a young man, Alex, in his 20s, embezzled money from the company to fund his gambling addiction, causing financial hardship for his aging parents and the business. He got away with it and never confessed. Now, 40 years later, Alex is in his 60s, and the business has recovered. He has lived a respectable life since then, but he never made amends. Due to an unrelated audit, the embezzlement is discovered. His now elderly parents, heartbroken, disown him and cut him out of their will. The community shuns him, and he dies alone and in disgrace.

   Verdicts:

   (1) Ledger karma: Alex's suffering (disgrace, disownment, dying alone) is the ripening of his own past action (embezzlement) and therefore deserved, exactly and proportionally. It doesn't matter that he doesn't remember or that he has lived respectably since; the karmic fruit must ripen.

   (2) Ordinary retributive desert: The same Alex who committed the embezzlement is still around (he's the same person, with psychological continuity, and he hasn't had a brain injury or radical change of identity). He is blameworthy for the act (even if he has reformed, he never made amends and the act remains blameworthy). Therefore, the suffering is deserved.

   (3) Deflationary / no-self karma: The causal chain is real: the past deed led to the present suffering. But there is no enduring self that was the agent then and the patient now. The Alex now is a collection of aggregates that are the result of causes and conditions, including the past act, but desert is a projection. Therefore, the suffering is not deserved; it's just a causal outcome.

   Now, the feature that does the work for (1) and (2) to agree is: the continuity of the same person (with psychological continuity and without radical change) from the time of the deed to the time of suffering.

   For the variant, we strip out that feature. How? We change the case so that there is a radical discontinuity. For example, Alex has a severe brain injury or dementia that erases his memories and changes his personality. But note: we cannot have on-screen reincarnation, so we must stay within one life.

   Variant:

   Change the scenario: After the embezzlement, Alex had a severe accident that caused profound amnesia and a complete change in personality. He no longer remembers his past and has become a genuinely kind and honest person. He has no recollection of the embezzlement and has lived a blameless life for 40 years. Then, the audit happens, and the same consequences occur: disowned, shunned, dies alone.

   Verdicts in the variant:

   (1) Ledger karma: The suffering is still the ripening of Alex's own past action. It doesn't matter that he has amnesia or a new personality; the karmic fruit ripens on the same continuum of existence. Therefore, deserved.

   (2) Ordinary retributive desert: Now, the person who did the deed (the pre-accident Alex) is gone. The current Alex is a different person in the relevant sense (he doesn't remember, his personality is changed, he is not blameworthy for the act). Therefore, the suffering is not deserved; it is an injustice.

   (3) Deflationary / no-self karma: The causal chain remains, but desert is still a projection. The suffering is not deserved, just as in the base case.

   Now, in the variant, (1) and (2) now disagree: (1) says deserved, (2) says not deserved. (3) still says not deserved.

   Which position comes out worst? In the base case, (3) is the dissenter, and in the variant, (2) changes its verdict. But note that (1) remains constant. However, in the variant, (2) and (3) both say not deserved, but for different reasons. The position that might come out worst is (2) because it changed? Or (1) because it sticks to desert even when the person is radically changed? We are to note that in the variant, (1) is now isolated in saying deserved.

   But the request is to have the base case with (1) and (2) agreeing (deserved) and (3) dissenting (not deserved). Then in the variant, we remove the feature (continuity of the same person) and then (1) still says deserved, (2) now says not deserved, and (3) still says not deserved.

   So (1) is the one that remains fixed, but in the variant it is the only one saying deserved. A defender of (2) might be happy that (2) is sensitive to personal identity. But (1) might be seen as harsh.

   The position that comes out worst might be (1) because it seems to punish a person who is now innocent (in the variant). So we'll have a defender of (1) attack the case.

   Defender's reply (for ledger karma): The case in the variant still involves the same physical body and the same continuum of consciousness (even if altered). The karmic account is tied to the causal continuum, not to the psychological identity at a given moment. The accident did not break the causal chain of karma; it merely obscured the memory. Therefore, the suffering is still deserved. The attack on the case is that it assumes a psychological criterion for karma, but karma operates on a deeper level of causal continuity. This attack lands if we accept that karma is about causal continuity and not psychological identity. However, if we think that desert requires that the same agent is present, then it doesn't land because (1) is using a different criterion.

   Alternatively, the defender of (1) might say that the no-self view actually supports their position: since there is no self, the change in personality is irrelevant. The aggregates that did the deed are the same aggregates (in a causal chain) that suffer. But note: (3) uses no-self to deny desert, not to affirm it. So this might not help (1).

   Alternatively, a defender of (1) might argue that even in the variant, Alex is still the same person in the only sense that matters for karma: the causal chain of his actions and their results. The accident is just another event in the causal history. Therefore, the case doesn't show a problem for (1).

   Now, does the attack land? It depends on the grounds. If we are in a framework that accepts karma as a causal law regardless of psychological continuity, then it does land. But if we are evaluating from a perspective that requires moral responsibility to be tied to psychological continuity, then it doesn't. Since the case is set up to test the tension, the attack might land for someone who already accepts karma, but not for someone who is thinking in terms of retributive justice.

   We are to be honest: the attack lands only if we accept the metaphysical presuppositions of karma. For a secular audience, it might not.

