answer: |-
  ### Which Theory of Punishment Do You Actually Hold?  
  *Use this decision tree to uncover your core beliefs about punishment. Answer each question based on your intuition—no prior theory knowledge needed. Test your answers against the cases at the end.*  

  ---

  #### **Start Here: Primary Justification**  
  **Q1: Is punishment justified because of a past wrong (the offender *deserves* it), or to prevent future harm?**  
  - **Past wrong (desert)** → Go to **Section A**.  
  - **Prevent future harm** → Go to **Section B**.  

  ---

  #### **Section A: Backward-Looking (Desert-Based)**  
  **Q2: If someone deserves punishment, must we punish them *regardless* of consequences?**  
  - **Yes** → **Positive Retributivism**  
    - *Awkward commitment:* Punishing a reformed, harmless offender solely because they "deserve it," even if it causes net harm.  
  - **No** → **Negative Retributivism**  
    - *Awkward commitment:* Punishing a reformed offender to calm a riot (if they’re guilty) because it combines desert with future benefit.  

  ---

  #### **Section B: Forward-Looking (Prevention-Based)**  
  **Q3: Can punishment be justified even if the person is *not* guilty?**  
  - **Yes** → Go to **Q4**.  
  - **No** → *Empty!* (Inconsistent: Forward-looking justifications don’t inherently require guilt.)  

  **Q4: Is a key reason to punish to benefit the *offender’s own good* (e.g., reform)?**  
  - **Yes** → **Rehabilitation**  
    - *Awkward commitment:* Punishing an innocent person "for their own good" if authorities believe it will reform them.  
  - **No** → Go to **Q5**.  

  **Q5: Is the primary goal to repair harm to victims/community relationships?**  
  - **Yes** → **Restorative Justice**  
    - *Awkward commitment:* Allowing a violent offender to avoid prison if victims forgive them, risking public safety.  
  - **No** → Go to **Q6**.  

  **Q6: Is the state’s core aim to *publicly condemn* the crime?**  
  - **Yes** → **Denunciation/Communication**  
    - *Awkward commitment:* Punishing a dying offender solely to "send a message," even if it deters nothing.  
  - **No** → Go to **Q7**.  

  **Q7: Is the goal to physically *disable* the offender from reoffending?**  
  - **Yes** → **Incapacitation**  
    - *Awkward commitment:* Jailing a non-dangerous offender for life due to unreliable risk predictions.  
  - **No** → Go to **Q8**.  

  **Q8: Can punishment be justified by deterring *others* (not just the offender)?**  
  - **Yes** → **Pure Deterrence**  
    - *Awkward commitment:* Framing an innocent person to deter riots if it saves more lives.  
  - **No** → *Empty!* (All prevention-focused theories accept deterring others unless they’re *only* about the offender’s reform/restraint.)  

  ---

  ### Key to Leaves
  | Theory                  | Position in Tree                          | Most Awkward Commitment                                  |  
  |-------------------------|-------------------------------------------|----------------------------------------------------------|  
  | Positive Retributivism  | A → "Yes" on Q2                           | Punishing the deserving even if it causes net harm.      |  
  | Negative Retributivism  | A → "No" on Q2                            | Punishing the guilty for social benefit (e.g., calm riots). |  
  | Rehabilitation          | B → "Yes" on Q4                           | Punishing innocents "for their own good."                |  
  | Restorative Justice     | B → "Yes" on Q5                           | Prioritizing victim-offender reconciliation over public safety. |  
  | Denunciation            | B → "Yes" on Q6                           | Punishing to express censure, even if it prevents no harm. |  
  | Incapacitation          | B → "Yes" on Q7                           | Long-term jailing based on unreliable danger predictions. |  
  | Pure Deterrence         | B → "Yes" on Q8                           | Punishing innocents to scare others.                     |  
  | *No named theory*       | B → "No" on Q3, Q8, or "No" on Q4–Q7      | *Incoherent or unattractive (e.g., prevention that ignores deterring others).* |  

  ---

  ### Test Cases  
  Apply your answers to these scenarios:  
  1. **The Reformed Offender**:  
     - A thief served no sentence but reformed. Punishing them now would calm a deadly riot.  
       - *Positive Retributivism:* Punish (desert is absolute).  
       - *Negative Retributivism:* Punish (desert + future benefit).  
       - *Pure Deterrence:* Punish (deters future riots).  
       - *Others:* Don’t punish.  

  2. **The Undeterrable Offender**:  
     - A violent activist can’t be deterred but is guilty. Punishing them won’t reform, incapacitate, or repair harm.  
       - *Positive Retributivism:* Punish (desert).  
       - *Denunciation:* Punish (to condemn the crime).  
       - *Others:* Don’t punish (no preventive benefit).  

  3. **The Corporate Offender**:  
     - A corporation caused deaths but can only be fined (no jail).  
       - *All theories except Incapacitation:* Fine (fits desert, deterrence, denunciation, etc.).  
       - *Incapacitation:* Reject fine (fails to physically disable harm).  

  ---

  ### Unresolved Pairs & Empty Branches  
  - **Unseparated Pair**: *Denunciation* and *Pure Deterrence* overlap in valuing societal messaging. The tree splits them by intent (censure vs. fear), but real-world policies often blend both.  
  - **Empty Branches**:  
    - **"No" to Q3** (forward-looking but requiring guilt): Incoherent—if prevention is the goal, guilt shouldn’t be necessary.  
    - **"No" to Q8** (prevention but rejecting deterrence of others): Unattractive—no major theory defends this.  

  ---

  **Design Notes**:  
  - Based on logical splits in justifications (desert vs. prevention), not textbook labels.  
  - Nodes force choices between mutually exclusive commitments (e.g., "Is censure the *core aim*?").  
  - Cases expose tensions (e.g., the reformed offender tests if consequences override desert).  
  - Hybrids (e.g., Rawls/Hart) fit *Negative Retributivism*: desert as a necessary constraint, but prevention justifies the act.
