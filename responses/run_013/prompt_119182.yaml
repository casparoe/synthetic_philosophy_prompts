prompt: |-
  I'm a third-year undergrad and I TA the second-year metaphysics course I took last year. Next week I've got the 50-minute section on the paradox of fiction -- the thing where we cry over people we know don't exist -- and I need a plan for teaching it, not an explanation of it. What order do the pieces have to come in so that the conflict actually bites? My instinct is that students nod along to the standard triad (we feel something real, we know it's made up, feelings need beliefs) without ever seeing which claim is supposed to be the problem, so I want the sequence to end with them able to say exactly what each of the three standard responses has to give up. Tell me which case should carry the hour. I was going to use a choice-driven game where you pick which of two characters dies and then feel genuinely guilty about it -- guilt seems to need you to have done something to someone, which doesn't sit well with the triad at all -- but tell me if that's the wrong carrying example, and why the usual "you sob at the end of a novel" case isn't enough on its own. Also the misconceptions I should expect and where to head each one off; I'm guessing "so the emotions are irrational" and "it's just suspension of disbelief." And should I let them notice that the same puzzle turns up for things that aren't fiction at all -- being moved by someone who died before you were born, say -- or does that just muddy it at this level? Finish with one question I can ask at the end that shows whether they've got the shape of the problem or just memorized the three positions, and tell me what to openly refuse to explain.
