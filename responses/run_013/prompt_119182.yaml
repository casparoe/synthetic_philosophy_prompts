answer: |-
  Here’s a battle-tested 50-minute plan designed to make the paradox **bite**, force students to confront the trade-offs, and leverage your guilt example effectively. The key is **staged revelation** of the conflict.

  **Core Structure:**
  1. **Hook with Tangible Emotion (5 min)**  
  2. **Extract the Triad from THEM (10 min)**  
  3. **Introduce the Guilt Bomb (15 min)**  
  4. **Formalize the Paradox & Standard Solutions (10 min)**  
  5. **Consequences: What Each Solution Sacrifices (5 min)**  
  6. **Closing & Assessment (5 min)**

  **Carrying Example:** **USE YOUR GUILT GAME.** It's *perfect*. Why?  
  -   **Agency:** Students *act*, making emotional investment personal and undeniable. Nodding at a novel is passive.  
  -   **Moral Weight:** Guilt implies responsibility to a *specific victim*. "I made this *person* suffer" clashes violently with "I know they aren't real." Belief requirement becomes visceral.  
  -   **Avoids "Suspension of Disbelief" Dodge:** They *just chose* the outcome moments ago. They *know* it's constructed. Suspension feels like cheating here.  
  -   **Novel Sobs aren't enough alone** because students easily dismiss them as "just being emotional" or "suspension of disbelief." Guilt feels *realer* and more problematic. *Use the novel as a secondary example later to show breadth.*

  **Detailed Plan:**

  1.  **Hook: The Feeling is Real (5 min)**
      *   **Activity:** "Think of a film, book, or game moment that genuinely moved you – joy, sadness, fear, anger. Quick pair-share: What was it, and what did you *feel*? Be specific." (Listen for concrete emotions: "I sobbed," "I was terrified," "I cheered," "I felt sick.")
      *   **Synthesize:** "So, we agree: We experience *genuine, strong emotions* towards fictional characters/situations. **Claim 1: We have real emotions towards fictions.**" (Write it boldly).

  2.  **Extract the Triad (10 min)**
      *   **Question 1:** "When you watched that heartbreaking scene, did you *believe* the character was a real person in front of you? Right then?" (Anticipate: "No, of course not!")
      *   **Synthesize:** "Exactly. We *know* it's made up. **Claim 2: We believe fictional characters do not actually exist.**" (Write it).
      *   **Question 2:** "Okay, hold that thought. Generally speaking, what do we usually think is required to feel a genuine emotion *about something*? Specifically, what about *sadness* for someone's suffering? Or *fear* for someone's danger?" (Prompt: "If I told you I was terrified *of* a monster, what would you assume?" Guide them to: We need to believe that thing *exists* or that the situation *is real/happening*).
      *   **Synthesize:** "Right. Emotions like pity, fear, anger, guilt – they seem to be *about* something. They seem to require a belief that their object is real or the situation obtains. **Claim 3: Genuine emotions require corresponding beliefs about their objects.**" (Write it).
      *   **Reveal the Triad Visually:** Point to the three claims. "So, we have these three things we seem committed to..."

  3.  **Drop the Guilt Bomb (15 min)**
      *   **Set Up:** "Let's test this with a more active emotion: Guilt. Imagine a short, text-based game. You play a medic in a warzone. Supplies are low. Two critically injured soldiers: Veteran Commander A (strategic genius, saved many) and Young Recruit B (just arrived, family back home). You MUST choose who gets the last dose of life-saving serum. The other dies. You make the agonizing choice. You see the text description of the one you didn't choose dying painfully, blaming you, maybe mentioning their family..."
      *   **The Choice:** "Okay, time to choose. By show of hands... save A? Save B?" (Note the split).
      *   **The Consequence:** "Now, imagine you *deeply* regret your choice. You feel a pang of *guilt*. You *caused* this person's death. You let down their family. That feeling sits heavy."
      *   **The Challenge:** "Raise your hand if you think you *might* genuinely feel a twinge of guilt playing this, even knowing it's just text/game? ... Okay, many of you. Now, hands up: Do you believe, *right now while playing*, that Commander A or Recruit B is a real person? ... No? ... So, **HOW** is this guilt possible?" (Let the silence hang). "Look back at our three claims. **Guilt** seems like a *real emotion*. You **know** they aren't real. But guilt *feels like* it requires you to believe you *actually harmed a real person*. That seems impossible given Claim 2. Which claim is lying?"

  4.  **Formalize the Paradox & Solutions (10 min)**
      *   **State the Conflict:** "This is the **Paradox of Fiction**. We have three plausible claims, but they seem logically incompatible: 1 + 2 + 3 = Contradiction. Feeling (1) + No Belief in Existence (2) + Emotion Requires Belief (3) can't all be true."
      *   **Introduce the Standard "Moves":** "Philosophers try to resolve this by denying one claim. Let's see the cost:"
          *   **Deny Claim 1 (No Real Emotion):** "Solution A: 'You aren't feeling *real* sadness/guilt. It's just 'quasi-emotion' or make-believe feeling.'" (Label: **Pretence/Quasi-Emotion Theory**).
          *   **Deny Claim 2 (Belief Exists!):** "Solution B: 'During the experience, you *do* temporarily believe, or have a special 'fictional belief' equivalent!'" (Label: **Suspension of Disbelief/Illusion Theory**).
          *   **Deny Claim 3 (Emotions Don't Need Belief):** "Solution C: 'Emotions like pity or guilt *don't* actually require the belief that the object exists. We can have genuine emotions based on *thoughts* or *imaginings* alone.'" (Label: **Thought/Imagination Theory**).

  5.  **Consequences: What Each Solution Gives Up (5 min)**
      *   **Activity:** "Back to your pairs: Take each solution. For the *game guilt* or *novel sadness*: What does this solution force us to *give up* or say is *wrong* about our experience? Be specific."
      *   **Synthesize & Hammer Home:**
          *   **Deny 1 (Pretence):** Gives up the *reality* of the emotion. "Your guilt wasn't *real* guilt, just pretend." (Cost: Feels phenomenologically wrong! The feeling *was* real).
          *   **Deny 2 (Suspension):** Gives up the *knowledge* it's fiction. "You *temporarily believed* the soldier was real." (Cost: Did you *really*? You *just chose* them! Feels like describing a mistake, not standard engagement).
          *   **Deny 3 (Thought Theory):** Gives up the *standard link* between emotions and belief about existence/reality. "Guilt doesn't require believing you *actually harmed* a real person." (Cost: Seems counter-intuitive! How can you feel guilty for something you know didn't *really* happen to a *real* person? What *is* the emotion 'about' then?).

  6.  **Closing & Assessment (5 min)**
      *   **Final Question (Assessment):** "**If you *had* to pick one solution to defend right now, which one would it be? And *crucially*, what is the *biggest sacrifice* or *most uncomfortable consequence* you have to accept by choosing it?**" (This forces them beyond memorization to grapple with the cost).
      *   **Address Scope (Quickly):** "Does this *only* apply to fiction? What about feeling awe at Grand Canyon photos? Sadness for a historical figure? The puzzle *might* extend there too – it's about emotion towards the non-present/non-concrete. But today, we focus on the core fictional case." (Acknowledges without derailing).
      *   **What to Refuse to Explain (Openly):** **OPENLY STATE:** "Our goal today wasn't to *solve* the paradox definitively or tell you which theory is 'right'. It was to make you *feel* the genuine tension between these three plausible claims and see the *cost* of any escape route. We won't resolve whether imagination is truly belief-like, or what 'real' emotion means – that's for deeper dives. We've seen why it's a *paradox*."

  **Tackling Misconceptions Proactively:**

  1.  **"So the emotions are irrational."**
      *   **When/Where:** Likely when presenting the paradox or discussing Denial 3.
      *   **Head Off:** "Hang on. 'Irrational' might mean 'unreasonable' or 'without cause'. But our emotions *are* caused by the story/game! They fit the stimulus. The paradox isn't about *why* we feel, but *how* we can feel *that specific kind* of emotion (requiring belief in its object) towards something we *know* isn't real. Calling it 'irrational' might dodge the conceptual tension."
  2.  **"It's just suspension of disbelief."**
      *   **When/Where:** Especially after the Guilt Bomb or when discussing Denial 2.
      *   **Head Off:** "Great, that's Solution B (Deny Claim 2). But let's push: What *is* 'suspension of disbelief'? Does it mean you *actually believe*, temporarily? If so, how is that possible when you *just chose* the dying character 2 minutes ago? Or does it mean you *pretend* to believe? If so, that sounds more like Solution A (Denial 1 - quasi-emotion). 'Suspension of disbelief' is often the *phrase* people use, but we need to unpack *what it actually means* to resolve the paradox."
  3.  **"But it's *designed* to make me feel that way!"**
      *   **When/Where:** When establishing Claim 1.
      *   **Head Off:** "Absolutely! Skilled creators manipulate our emotions brilliantly. But the paradox asks *how this manipulation is even possible* given what we know and what emotions seem to require. The fact it's designed makes the emotions *expected*, not less puzzling!"
