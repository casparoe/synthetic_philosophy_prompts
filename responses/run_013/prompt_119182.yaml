  First, I need to structure the session so the tension builds gradually. Start with relatable examples to hook them, then introduce the triad step by step. The key is to make them feel the contradiction before labeling it. The user’s instinct about using guilt in a choice-driven game is sharp—it makes the "belief requirement" visceral. But I should explain why it’s better than the novel example: guilt implies moral responsibility, which clashes harder with "knowing it’s fake." 

