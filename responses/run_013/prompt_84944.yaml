answer: |-
  Here are five numbered points for your handout:

  1.  **Metabolic Ambiguity Undermines Criteria:** Victor's silence on whether the creature eats, sleeps, heals, or ages prevents applying standard biochemical/metabolic definitions of life (like energy processing). He possesses motion and cognition, but the absence of biological processes renders him a functional automaton by those criteria.
  2.  **Reproduction Demand vs. Biological Reality:** Victor's belief that the creature and a mate could found a "race" hinges on a reproductive definition of life. Yet, this clashes with real biology (e.g., sterile mules are alive) and the creature's artificial origin – his potential fertility is pure speculation, making him a hypothetical borderline case.
  3.  **Evolutionary Potential as Paradox:** Framing the creature as a potential lineage founder ("evolution-style criterion") highlights life's historical continuity. However, his sudden creation *ex nihilo* defies evolutionary descent, placing him outside the very lineage he threatens to spawn – an ontological impossibility for naturally occurring life.
  4.  **Modern Borderlines Mirror Creature's Liminality:** Like giant viruses (metabolism debatable), prions (replicate without nucleic acids), or digital life (self-replication *in silico*), the creature exists in a definitional gray zone. His animation resists clear categorization, forcing us to confront whether "life" is a unified category or a cluster of properties he partially embodies.
  5.  **Shelley Rejects Definition, Prioritizes Consequence:** The novel deliberately avoids specifying the animation's mechanism, rendering biological criteria moot. Shelley focuses on the *act* of creation and its *ethical/social consequences* (rejection, suffering, violence), implicitly arguing that the definition of life matters less than the responsibility towards sentient beings we create or encounter.
