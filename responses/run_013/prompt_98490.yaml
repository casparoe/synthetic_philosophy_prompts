prompt: |-
  I retired last year after 35 years as an experimental physicist — laser interferometry mostly — and I've been spending the free time reading philosophy of physics. I keep coming back to the Newton's bucket thing, substantivalism vs relationism, and I honestly can't tell whether it's a live research area or something people have basically moved past.

  So here's what I want. If I'm going to spend my next few years reading and maybe writing on this, which open questions in that area actually matter most, and in what order? I care more about the reasoning than the list. Specifically: which of these questions would change something downstream — how people do quantum gravity, cosmology, the initial-value problem, the whole business of what counts as background structure vs a field — and which are basically metaphysics for its own sake that would trundle on even if physics never noticed? I've got a nagging feeling that once you treat the metric as just another field, the old debate either dissolves or just relocates, and I want to know which questions survive that reframing and which don't.

  Also tell me what evidence over the next couple of years would move a question up or down your list, and whether someone with my background — decent on measurement and coordinate freedom, weak on the literature — is even the right person for the top one or two. Be straight with me if the whole thing is alot more settled than I think, or if the real action has moved somewhere I wouldn't recognize as the same question.
