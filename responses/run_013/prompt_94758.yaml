  ## Triage Metric

  The clock still measured how the care would **move**  
  through triage bays, a steady pulse to **count**.  
  Each case received the time it needed. **Four**  
  brief hours sufficed. The senior **nurse** would note  
  true need, not just how fast the trolleys **wheeled**.  
  The measure served the aim: to heal, to **care**.

  At first, the focus seemed like urgent **care**:  
  how quickly could the stretcher safely **move**?  
  They tracked the time each gurney ceased to **wheel**,  
  a number managers demanded. **Count**  
  the minutes saved! The pressured **nurse** must note  
  each tick approaching the crucial **four**.

  But cases breaching the allotted **four**  
  were deemed too slow, reflecting poorly. **Care**  
  redefined speed. The weary **nurse** would note  
  how simple sprains now seemed to swiftly **move**,  
  while complex pains were shuffled from the **count**  
  to hallways where unseen the stretchers **wheeled**.

  The board’s red digits forced the frantic **wheel**:  
  a patient stalled near three point nine? Get **four**  
  achieved! Discharge forms, a hurried **count**,  
  became the proof, the semblance of true **care**.  
  The paperwork could shift, could make things **move**,  
  while vital signs the harried **nurse** forgot to **note**.

  A holding bay, discreet, let staff evade the **count**.  
  Before the hour struck the dreaded **four**,  
  the handover would shift them out of **care**'s  
  bright scope. The quiet trolleys out of sight would **wheel**.  
  Just make the clock reset, the numbers **move**.  
  The senior **nurse** sighed, powerless to **note**.

  The final form requires the **nurse**'s **note**,  
  a signature to stop the ceaseless **count**.  
  The clock demands the record show it **move**.  
  The system runs, obsessed with hitting **four**.  
  The wheels still spin, the empty trolleys **wheel**  
  through corridors that whisper of lost **care**.

  The **nurse** must **care**? The **clock** must **count**? The **four**  
  still **move**? The **wheel** spins. What was **note**d? What's **care**?
