answer: |-
  Here's a poem enacting the catuṣkoṭi through the subject of **an unpaid wage**, followed by a note addressing your concerns:

  **Stipend Due**

  **(I. On Existence)**  
  This sum is solid, earned by sweat and hour,  
  A weight marked clear in contract, firm and sure.  
  No coin exists beyond the lender's power,  
  Nor ink that writes what payment might endure.  
  **Ask after value where the ledger closes,  
  When hand and promise part like parted clothes.**  

  **(II. On Identity)**  
  This debt is mine, it bears my labour's name,  
  A chain of hours only I could forge.  
  No marker ties it to my given claim,  
  Nor script that fits the page where debts discharge.  
  **Speak not of owner where the tally's ceased,  
  When "mine" and "thine" dissolve like interest released.**  

  **(III. On Location)**  
  The owed amount sits waiting in the vault,  
  A ghost in columns, pending, undispensed.  
  No place contains where obligation's fault  
  Lies hidden, nor where justice is fenced.  
  **Point not to purse or promise, court or chest,  
  Where "held" and "missing" find their final rest.**  

  **(IV. On Nature)**  
  This wage is justice, fairness crystallised,  
  A moral bond no circumstance unbinds.  
  No virtue lives where payment's disguised,  
  Nor law that shapes the form the debt defines.  
  **Seek not the essence gleaming sharp and true,  
  Where "right" and "due" shed all they ever knew.**  

  ---

  **Note on Interpretation & Form:**

  1.  **The Fourth Line (Lemma):** Each stanza's fourth line attempts to enact the exhaustion of the predicate's applicability (*śūnyatā* as deconstructive cessation), not posit a fourth truth. Phrases like "Ask after value *where*..." or "Point not to purse or promise..." aim to indicate the collapse of the framework itself (existence, identity, etc.), rendering the question incoherent. This leans heavily on the Prāsaṅgika therapeutic/quietist reading (Candrakīrti, Tsongkhapa) where the fourth lemma signifies the unsustainability of the concepts presupposed by the question. A Svātantrika or a four-valued-logic reading might find this too negative or see the lines as implying a "higher truth."
  2.  **Liberties with the Tetralemma:** Applying four *different* predicates (existence, identity, location, nature) to one subject is a compression. Classical applications often interrogate one core predicate (e.g., "arising") repeatedly. This structure risks making the subject appear to have stable aspects *to* predicate, subtly reifying it, though the poem tries to undermine this in the final stanza.
  3.  **Suitability of Form:** The four-stanza/four-line structure *can* suit enacting the tetralemma rhythmically. The danger lies in forcing the fourth line to "resolve" or "conclude" poetically, potentially reifying the fourth lemma. The form risks dictating a progression that feels like accumulating negations towards a final negative insight, which isn't quite how the lemmas function simultaneously in deconstruction. However, the sequential presentation mirrors the logical progression of interrogation.
  4.  **Honesty on Contested Ground:** The poem *does* assume the Prāsaṅgika/therapeutic reading of the fourth lemma as cessation/collapse. It avoids stating a positive "neither" position but uses imagery of dissolution ("part like parted clothes," "dissolve," "find their final rest," "shed all they ever knew") to evoke the *failure* of the conceptual apparatus. This is inherently contested. A proponent of a more positive or propositional interpretation of the fourth lemma would likely find this inadequate or misleading.
  5.  **Subject Choice:** "An unpaid wage" was chosen for its inherent relationality (employer/employee, effort/value, promise/fulfillment), conventional reality, ethical weight, and lack of traditional Madhyamaka baggage. It embodies dependence, suffering, and conceptual construction (value, debt, ownership, justice).

  The poem attempts to *show* the tetralemma's work through the destabilisation of predicates applied to a conventional object, culminating in lines that gesture towards the *cessation* of the predicate's applicability, hoping to enact the "traction stopping." Its success hinges on whether the fourth lines feel like conceptual exhaustion or merely enigmatic negation. It leans unapologetically on the contested therapeutic reading.
