   in group A: non-cases are 50% of the group. how many are selected? only the high risk are selected, but in group A, the high risk are all cases, so no non-case is selected. So FPR=0.
   in group B: non-cases are 90% of the group. selected are the high risk, which in group B for the high risk half are 10 people (10% of group) and they are all cases, so no non-case is selected. So FPR=0.

   False negative rate: among actual cases, the rate that are not selected.
   in group A: cases are 50% of the group. all are selected, so FNR=0.
   in group B: cases are 10% of the group. all are selected, so FNR=0.

