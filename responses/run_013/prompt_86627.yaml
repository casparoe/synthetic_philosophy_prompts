   We will use the example from the paper "Inherent Trade-Offs in the Fair Determination of Risk Scores" by Kleinberg, Mullainathan, Raghavan.

   In that paper, they have an example with two groups with different base rates and a risk score that is conditionally perfect.

   We will use that example and create a binned table.

   Group A: base rate 0.5
   Group B: base rate 0.2

   and the risk score is the true risk.

   In Group A, the high risk ( say score 1) has 50% of the people and 100% of the cases.
   In Group A, the low risk ( score 0) has 50% of the people and 0% of the cases.

   In Group B, the high risk ( score 1) has 20% of the people and 100% of the cases.
   In Group B, the low risk ( score 0) has 80% of the people and 0% of the cases.

   Then if we set a threshold of 0.5, we take only high risk.
   In A: we take 50% of the group, which are all cases. So TPR=1, FPR=0, PPV=1.
   In B: we take 20% of the group, which are all cases. So TPR=1, FPR=0, PPV=1.
   So all measures are equal.

   to make it not perfect, we can add noise.

   In Group A:
    high risk ( score 0.8) : 50% of the group, and among them, 80% are cases, 20% are non-cases.
    low risk ( score 0.2): 50% of the group, and among them, 20% are cases, 80% are non-cases.

   then base rate = 0.5*0.8 + 0.5*0.2 = 0.4+0.1 = 0.5.

   In Group B:
    high risk ( score 0.8): 20% of the group, and among them, 80% are cases, 20% are non-cases.
    low risk ( score 0.2): 80% of the group, and among them, 20% are cases, 80% are non-cases.

   then base rate = 0.2*0.8 + 0.8*0.2 = 0.16+0.16=0.32 -> not 0.2.

   to have base rate 0.2 in B:
    let the high risk in B be a fraction p of the group, with risk 0.8, and low risk with risk r.
   then base rate = p*0.8 + (1-p)*r = 0.2.

   also, we want the score to be meaningful.

