   Group A ( base rate 0.5):
    high risk (0.8): 50 people, cases = 40, non-cases=10.
    low risk (0.2): 50 people, cases=10, non-cases=40.

   Group B ( base rate 0.2):
    high risk (0.8): 25 people, cases=20, non-cases=5.
    low risk (0.2): 75 people, cases=0, non-cases=75. -> then base rate=20/100=0.2.

   Then we have:

   Group A:
    high risk: 50 people, 40 cases, 10 non-cases.
    low risk: 50 people, 10 cases, 40 non-cases.

   Group B:
    high risk: 25 people, 20 cases, 5 non-cases.
    low risk: 75 people, 0 cases, 75 non-cases.

   Now, the students must choose a threshold to select 50 people in each group ( since 150 slots for a larger population, but for simplicity, 50 per group).

   In Round 1, equity office requires that among those enrolled, the same share in each group develop the condition ( PPV equality).

   In Group A, if we select the high risk only: 50 people, 40 cases, 10 non-cases. PPV=40/50=0.8.
   In Group B, if we select the high risk only: 25 people, 20 cases, 5 non-cases. PPV=20/25=0.8. -> so by using the high risk only, we achieve PPV=0.8 in both.

   But in Group B, we only selected 25 people, but we need to select 50. So we have to select more from the lower risk.

   In Group B, if we select the high risk and some from the low risk, but in the low risk, there are no cases, so any additional selected will be non-cases.

   So if we take all 25 high risk and then 25 from the low risk in B, then we have 20 cases and 5+25=30 non-cases. PPV=20/50=0.4.

   To achieve PPV=0.8 in B, we would need to have 40 cases in 50 selected, but there are only 20 cases in the whole group. -> impossible.

   So in Round 1, the only way to achieve PPV=0.8 in both is to select only the high risk in both, but then in Group B, we only select 25, not 50. -> cannot meet the size constraint.

   Therefore, to meet the size constraint in Group B, we have to take extra people from the low risk, which are all non-cases, and that lowers the PPV.

   Then they might try to set a lower threshold in Group B to include more cases, but there are no more cases in Group B.

   So in this setting, it is impossible to achieve the same PPV while selecting 50 in each group.

   In Round 2, the civil-rights office requires that equally sick people have the same chance of being enrolled ( which means equal true positive rate) and equally healthy people the same chance of being wrongly enrolled ( equal false positive rate).

   In this setting, equally sick: the cases.
   in Group A, the cases are in high risk and low risk.
   in Group B, the cases are only in high risk.

   so for a given risk level, the chance of being enrolled should be the same.

   For example, for high risk people ( risk 0.8), in both groups, they should have the same probability of being enrolled.
   in Group A, if we enroll only high risk, then a high risk person in A has probability 1 of being enrolled.
   in Group B, if we enroll only high risk, then a high risk person in B has probability 1.
   so if we enroll only high risk in both, then TPR for high risk is 1 in both.

   but for the cases in the low risk in Group A, they have risk level 0.2. If we enroll only high risk, then they have 0 chance of being enrolled.
   in Group B, there are no cases in low risk.

   so for risk level 0.2, the cases in Group A have 0% chance, while in Group B, there are no cases, so it is vacuously any rate.

   for the healthy people, at high risk, in Group A, the high risk non-cases are enrolled at rate 1 ( because we take all high risk), in Group B, the high risk non-cases are also enrolled at rate 1.

   for low risk non-cases, in Group A, they have 0% chance of being enrolled ( if we only take high risk), in Group B, if we only take high risk, then the low risk non-cases have 0% chance.

   so error rates are equal.

   but then we are not meeting the size in Group B.

   to meet the size, in Group B, we take some low risk people.
   then for the low risk non-cases in Group B, we are enrolling them, so their FPR becomes non-zero, while in Group A, we are not taking any low risk non-cases, so FPR for low risk non-cases is 0 in A and >0 in B -> not equal.

   so it is impossible to meet the error rate balance when we meet the size constraint.

   This example with two risk levels and two groups should work for the activity.

   So for the handout, we will have:

   North (Group A) - 100 people
  | Risk Level | Count in Band | Cases in Band | Non-cases in Band |
  |------------|--------------|--------------|------------------|
  | 0.8        | 50           | 40           | 10               |
  | 0.2        | 50           | 10           | 40               |

   South (Group B) - 100 people
  | Risk Level | Count in Band | Cases in Band | Non-cases in Band |
  |------------|--------------|--------------|------------------|
  | 0.8        | 25           | 20           | 5                |
  | 0.2        | 75           | 0            | 75               |

   and the requirement is to select exactly 50 people in each group.

   Round 1: Equity office requires that the share of enrolled who are cases (PPV) is the same in both groups.

   In North, if they take the high risk band: 50 people, 40 cases, 10 non-cases -> PPV=40/50=0.8.
   In South, if they take the high risk band: 25 people, 20 cases, 5 non-cases -> PPV=0.8, but they only took 25, need 50. If they take the high risk and then from the low risk, they take 25 from the low risk band, which are all non-cases. Then in South, cases=20, non-cases=5+25=30, PPV=20/50=0.4.

   To achieve PPV=0.8 in South, they would need to have 40 cases in the 50 selected, but there are only 20 cases in total -> impossible.

   So they must either have different PPV or not meet the size in South.

   Then in the activity, they will have to choose a threshold in South that does not achieve PPV=0.8, and then the equity office is not satisfied.

   In Round 2, the civil-rights office requires that:
   - For the cases (sick), the probability of being enrolled should be the same in both groups. ( equal TPR or sensitivity)
   - For the non-cases (healthy), the probability of being enrolled should be the same in both groups. ( equal FPR or 1-specificity)

   In North, the cases are 50: 40 in high risk, 10 in low risk.
   In South, the cases are 20: all in high risk.

   and non-cases: in North: 50: 10 in high risk, 40 in high risk.
   in South: 80: 5 in high risk, 75 in low risk.

   If they set a threshold at 0.8: 
    in North: take only high risk: cases enrolled=40, cases not enrolled=10 ( in low risk) -> TPR=40/50=0.8.
            non-cases enrolled=10, non-cases not enrolled=40 -> FPR=10/50=0.2.
    in South: take only high risk: cases enrolled=20, cases not enrolled=0 -> TPR=20/20=1.
            non-cases enrolled=5, non-cases not enrolled=75 -> FPR=5/80=0.0625.

   So TPR is 0.8 in North and 1 in South -> not equal.
   FPR is 0.2 in North and 0.0625 in South -> not equal.

   If they set a threshold at 0.2 ( take everyone):
    in North: cases enrolled=50, TPR=1.
              non-cases enrolled=50, FPR=1.
    in South: cases enrolled=20, TPR=1.
              non-cases enrolled=80, FPR=1.
   -> then TPR=1 in both, FPR=1 in both. -> satisfies the civil-rights office, but then the equity office is not satisfied because PPV in North=50/100=0.5, in South=20/100=0.2.

   But in this case, they have selected 100 in each group, but the requirement is 50.

   If they set a threshold that is above 0.2 and below 0.8, but in this setup, there are only two risk levels, so they have to take entire bands.

   in North, if they take high risk and part of low risk, but then they would have to take 0 from low risk to have exactly 50, which is the high risk only.

   in South, to get 50, they take the high risk (25) and 25 from low risk.

   Then for cases:
   in North: only high risk cases are taken: 40 out of 50 cases -> TPR=0.8.
   in South: high risk cases are taken: 20 out of 20 cases -> TPR=1.
   -> not equal.

   for non-cases in North: high risk non-cases are taken: 10 out of 50 non-cases -> FPR=0.2.
   in South: high risk non-cases taken: 5, and from low risk non-cases: 25 taken out of 75 non-cases in low risk. total non-cases taken=5+25=30, total non-cases=80, FPR=30/80=0.375.
   -> not equal.

   and there is no way to make them equal because in South, there are no cases in the low risk band, so to have TPR=0.8 in South, they would have to leave some cases out, but there are only 20 cases and they are all in high risk, so if they take only 16 cases ( which would require to leave out 4 high risk cases), then TPR=16/20=0.8, but then in North, to have TPR=0.8, they take 40 cases, which are in the high risk, but then in North, they would have to take only the high risk cases and no non-case? that's not possible because the high risk band has non-cases too.

   in North, to have TPR=0.8, they must take exactly 40 cases. the high risk band has 40 cases and 10 non-cases, so they must take the entire high risk band to get the 40 cases, and then they have to take 10 non-cases from that band.所以他们必须接受这些 non-cases.

   in South, to have TPR=0.8, they must take 16 cases. the only cases are in the high risk band, so they take 16 cases from the high risk band. then they also take the non-cases in the high risk band? In the high risk band, there are 20 cases and 5 non-cases. If they take 16 cases, do they take the non-cases too? The selection is by risk score, so if they take the high risk band, they take everyone in that band. If they want to take only part, within the band it's not distinguished.

   So in this setup, because the risk score has only two levels, they have to take entire bands.

   Therefore, the only ways are:
   - take only high risk: then in North: 50 people, in South: 25 people -> doesn't meet size.
   - take high risk and some from low risk: then error rates are not equal.

   So for the activity, we can use this example.

   We'll provide the tables as above.

   Then in the debrief, we can note that with more risk levels, the within-band selection doesn't help because the score is not within group, but in this case, it's not.

