answer: |-
  Below is a comprehensive plan for your 90-minute session, designed to help students discover the impossibility of simultaneously satisfying predictive parity and error rate balance when base rates differ. The activity uses a concrete scenario, hand-computable tables, and a structured debrief to ensure students "hit the wall" and grasp the ethical implications. 

  ---

  ### **Minute-by-Minute Timeline**  
  **Total: 90 minutes**  

  | Time          | Activity                                                                                                |
  |---------------|---------------------------------------------------------------------------------------------------------|
  | **0-5 min**   | **Introduction**: Set up the scenario ("County Health Dept."), explain the risk score, and hand out materials. |
  | **5-25 min**  | **Round 1 (Equity Office: PPV Equality)**: Students find thresholds to equalize PPV between North and South. |
  | **25-55 min** | **Round 2 (Civil Rights Office: Error Rate Balance)**: Students try to add FPR/FNR equality. Stuck!        |
  | **55-75 min** | **Debrief**: Map the experience to the theorem, discuss escape routes, and ethical implications.          |
  | **75-85 min** | **Variant Activity**: Use **equal-prevalence tables** to show the impossibility vanishes.                |
  | **85-90 min** | **Conclusion**: Recap takeaways and assign reflection questions.                                        |

  ---

  ### **Materials List**  
  **1. Vendor Certificate (Read Aloud):**  
  > *"The risk score is calibrated within each catchment area: In every score band, the observed illness rate matches the band’s risk level. The score uses no group labels (North/South) and no proxies for group membership (e.g., ZIP code)."*  

  **2. Health Data Tables (Handout)**  
  - **Base rates differ (North: 30%, South: 15%)**  
    - *North (Prevalence = 30%, Total population = 1,000)*:  

      | Risk Band | Risk Level | People in Band | # Who Develop Illness |
      |-----------|------------|----------------|------------------------|
      | 10        | 95%        | 40             | 38                    |
      | 9         | 85%        | 60             | 51                    |
      | 8         | 75%        | 80             | 60                    |
      | 7         | 65%        | 100            | 65                    |
      | 6         | 55%        | 120            | 66                    |
      | 5         | 45%        | 140            | 63                    |
      | 4         | 35%        | 120            | 42                    |
      | 3         | 25%        | 100            | 25                    |
      | 2         | 15%        | 120            | 18                    |
      | 1         | 5%         | 120            | 6                     |  

      **Total cases**: 38+51+60+65+66+63+42+25+18+6 = **434** (≈30% of 1,000)  

    - *South (Prevalence = 15%, Total population = 1,000)*:  

      | Risk Band | Risk Level | People in Band | # Who Develop Illness |
      |-----------|------------|----------------|------------------------|
      | 10        | 95%        | 20             | 19                    |
      | 9         | 85%        | 40             | 34                    |
      | 8         | 75%        | 60             | 45                    |
      | 7         | 65%        | 80             | 52                    |
      | 6         | 55%        | 100            | 55                    |
      | 5         | 45%        | 140            | 63                    |
      | 4         | 35%        | 160            | 56                    |
      | 3         | 25%        | 200            | 50                    |
      | 2         | 15%        | 140            | 21                    |
      | 1         | 5%         | 160            | 8                     |  

      **Total cases**: 19+34+45+52+55+63+56+50+21+8 = **403** (≈15% of 1,000)  

  - **Rules**:  
    - Each clinic must enroll **exactly 150 people** (no shifting volume between areas).  
    - Use thresholds: Enroll everyone *at or above* a chosen risk band (entire bands only; no partial bands).  

  **3. Auditor Prompts (Read Aloud Verbatim):**  
  - **Equity Office (Round 1)**:  
    > *"Among those enrolled in the program, the share who actually develop the illness must be equal in North and South. For example, if 20% of enrolled patients in North get sick, it must be 20% in South too."*  

  - **Civil Rights Office (Round 2)**:  
    > *"Equally sick people must have the same chance of being enrolled, and equally healthy people must have the same chance of being wrongly enrolled. For instance:  
    > - If two people are equally sick (same risk band), neither should be favored based on their area.  
    > - If two people are equally healthy, neither should be more likely to be mistakenly enrolled."*  

  **4. Equal-Prevalence Variant Table (For Debrief)**:  
    - Identical format, but both areas have **25% prevalence** (e.g., adjust South’s case counts to 250/1,000).

  ---

  ### **Activity Flow**  
  **Round 1 (PPV Equality):**  
  - Students work in pairs to find thresholds for North/South so PPV (sick among enrolled) is equal.  
  - **Solution**: To achieve PPV ≈ 60% in both:  
    - **North**: Enroll bands 10–6 (40+60+80+100+120 = 400 people). Take the top 150 (≈37.5% of 400).  
      - Expected cases: (38+51+60+65+66) × (150/400) ≈ **108.75**  
      - PPV = 108.75/150 ≈ **72.5%**  
    - **South**: Enroll bands 10–4 (20+40+60+80+100+140+160 = 600 people). Take top 150 (25% of 600).  
      - Expected cases: (19+34+45+52+55+63+56) × (150/600) ≈ **108.75**  
      - PPV = 108.75/150 ≈ **72.5%**  
  - **Key takeaway**: Lower threshold in South (band 4 vs. North’s band 6) equalizes PPV.  

  **Round 2 (Error Rate Balance):**  
  - Students now must *also* satisfy:  
    - **Equal FNR**: Sick people in the same risk band have equal enrollment chance.  
    - **Equal FPR**: Healthy people in the same band have equal enrollment chance.  
  - **What happens**:  
    - To equalize FNR/FPR, students try identical thresholds (e.g., band 6 for both).  
      - Result: PPV diverges (North: 72.5%, South: 58.3%).  
    - Tempting fixes fail:  
      - "Flag everyone": FPR = 100% in both, but PPV ≠ 72.5%.  
      - "Flag nobody": Violates PPV and enrollment rules.  
      - "Re-engineer score": Forbidden by vendor certificate.  
      - "Split the difference": No threshold pair satisfies both audits.  
  - **Wall hit**: Arithmetic forces a trade-off. Students see FNR/FPR equality is impossible without violating PPV.  

  ---

  ### **Predictable Challenges & Solutions**  
  1. **"Can’t we just accept fewer people in South to keep PPV equal?"**  
     - *Response*: "The health department policy requires all 150 slots filled in each area. You must comply."  

  2. **"What if we use different thresholds per band?"**  
     - *Response*: "The auditors require group-level fairness. You can only set one threshold per area."  

  3. **"The vendor’s score is flawed—let’s fix it!"**  
     - *Response*: "The certificate confirms the score is unbiased and calibrated. You cannot alter it."  

  4. **Confusion on error rates**:  
     - *Clarify*: "FPR = % of *healthy* people wrongly enrolled. FNR = % of *sick* people wrongly excluded."  

  5. **A clever student claims they found a solution**:  
     - *Check*: Recalculate their thresholds. The tables are designed to make PPV and FPR/FNR jointly unsatisfiable.  

  ---

  ### **Debrief Structure**  
  1. **Map the experience to the theorem**:  
     - *Reveal the criteria names*:  
       > "You tried to satisfy **predictive parity (PPV)** and **error rate balance (FPR/FNR)**. When prevalence differs, arithmetic forces a trade-off:  
       > $$\text{High FPR} \iff \text{Low FNR} \quad \text{and} \quad \text{PPV} \propto \text{Prevalence}$$  
       > This is the **impossibility result**. It’s not a technical flaw—it’s math."  

  2. **Escape routes (what the result *doesn’t* forbid)**:  
     - **Upstream investment**: "Change base rates (e.g., improve South’s healthcare access). *This activity denied you that lever.*"  
     - **Randomized decisions**: "Flip a coin for borderline cases. This equalizes error rates, but costs accuracy."  
     - **Explicit ethical choice**: "Accept unequal errors (e.g., South bears more false positives) and publicly justify why."  

  3. **Equal-prevalence variant (10 minutes)**:  
     - Use tables with identical prevalence (25%).  
     - Students see thresholds that satisfy *both* audits (e.g., band 5 for both), making the impossibility vanish.  

  4. **Ethical reflection**:  
     - "This isn’t about ‘fixing the algorithm.’ It’s about **who bears the cost of errors**. Policy must address why base rates differ and who we prioritize."  

  ---

  ### **What the Activity Cannot Reproduce**  
  1. **Generalizability**:  
     - The handout shows impossibility for *these specific numbers*, not a proof for all predictors. Emphasize: "This is one instance of a universal trade-off."  

  2. **Cost of randomization**:  
     - Students don’t see how randomization reduces accuracy. Mention: "Flipping coins near thresholds increases overall errors but distributes them fairly."  

  3. **Continuous scores**:  
     - Binned tables simplify math but mask granular trade-offs in real-world scores.  

  4. **Causal drivers of base rates**:  
     - The exercise holds base rates fixed, but stress: "Justice requires tackling *why* North/South differ upstream."  

  ---

  ### **Instructor Notes**  
  - **Neutral labels**: In debrief, clarify: "North/South stand in for race, gender, or other attributes where disparities exist."  
  - **No jargon early**: Avoid "PPV," "FPR," "FNR," or "impossibility" until Round 2 debrief.  
  - **Embrace frustration**: When students hit the wall, say: "Your frustration is the point. The conflict is inherent."  
  - **Final takeaway**: "Fairness isn’t a knob you tune. It’s a societal choice about error distribution."  

  This plan ensures students experience the trade-off viscerally, confront the limits of "fair algorithms," and grapple with ethical responsibility. The tables are vetted to make the impossibility inescapable, and the variant activity clarifies that prevalence differences drive the conflict.
