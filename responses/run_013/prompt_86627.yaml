   For group B, the high risk half (10%) has the 10% cases, and the low risk half has no cases.

   Then if we set the same threshold (say, high risk) then in group A, we select the high risk half, which are 50% of the group, and they are all cases, so:
    selection: 50% of group A -> 50% are cases.
    not selected: the other 50%, which are non-cases.

   in group B, we select the high risk half, which are 10% of the group, and they are all cases, so:
    selection: 10% of group B -> 100% are cases.
    not selected: 90% of group B, which are 90% non-cases and 0% cases.

