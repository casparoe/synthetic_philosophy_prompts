  We are given a one-liner: "Bell's theorem shows that the world is nonlocal." This was used to argue that quantum mechanics is in tension with special relativity, that faster-than-light influence is real, and that others are holding an outdated prejudice. The goal is to dissect this sentence into distinct precise claims, ordered from weakest to strongest, and then to evaluate each.

  ### The slogan and its setting
  The one-liner was used to dismiss an hour's discussion and to assert that quantum mechanics (QM) conflicts with special relativity (SR) due to nonlocality, implying real faster-than-light (FTL) influence. For this to hold, Bell's theorem must establish that the world is nonlocal in a sense that implies FTL causal influence, and that such influence is unavoidable in any interpretation of QM.

  ### The menu of readings
  We list readings from the weakest to the strongest.

  1. **Reading A: Non-factorizability of the quantum state (wavefunction)**
     - **Claim**: The quantum state (wavefunction) of a system composed of spacelike separated parts cannot be written as a product of states of the individual parts (i.e., it is entangled). This is a mathematical feature of the quantum description.
     - **Nature**: This is a claim about the formalism of QM, not directly about the world.

  2. **Reading B: Impossibility of local hidden variables (LHV)**
     - **Claim**: No theory that is both local (in the specific sense of Bell) and deterministic (via hidden variables) can reproduce all the statistical predictions of QM. Bell's theorem rules out local hidden variable theories.
     - **Nature**: This is a claim about a class of theories (specifically, models that attempt to complete QM with hidden variables) and their limitations.

  3. **Reading C: Statistical nonlocality in correlations**
     - **Claim**: The observed correlations between measurements on entangled particles, as predicted by QM and confirmed by experiment, cannot be explained by any model in which the outcomes are determined by local factors (i.e., factors in the past light cone of each measurement event) alone. This is the core of Bell's theorem: the violation of Bell inequalities requires nonlocal correlations.
     - **Nature**: This is a claim about what kinds of statistical models can account for the observed data. It is about the world in that it says that the world does not admit a local statistical model.

  4. **Reading D: Nonlocality as a feature of the world (ontological nonlocality)**
     - **Claim**: The world itself is nonlocal: there is some form of physical connection or influence between spacelike separated events that explains the observed correlations. This influence may or may not be causal in the traditional sense.
     - **Nature**: This is a substantive claim about the structure of the world.

  5. **Reading E: Causal nonlocality (FTL causation)**
     - **Claim**: The nonlocality involves a genuine causal influence that propagates instantaneously (or faster than light) between the entangled particles. This is the "action at a distance" that is in tension with special relativity.
     - **Nature**: A claim about causation in the world.

  6. **Reading F: Nonlocality as fundamental wholeness (holism)**
     - **Claim**: The universe is fundamentally indivisible; the parts are not real independently of the whole. This is a metaphysical reading, often associated with interpretations like Bohmian mechanics or some versions of quantum holism.
     - **Nature**: Metaphysical claim.

  7. **Reading G: Nonlocality as contextuality or measurement dependence**
     - **Claim**: Bell's theorem is not primarily about locality but about contextuality (the outcome of a measurement depends on which other measurements are performed) or about the impossibility of having the hidden variables independent of the measurement settings (measurement independence). This reading downplays locality and emphasizes other factors.
     - **Nature**: Claim about what the theorem really shows, shifting the focus.

  8. **Reading H: Operational nonlocality**
     - **Claim**: Bell's theorem shows that any operational theory that reproduces the quantum predictions must be nonlocal in the sense that it cannot be simulated by a classical local model. This is a claim about the resources required for an operational theory to account for the data.
     - **Nature**: About the structure of operational theories, not necessarily about the world.

  ### Verdicts

  - **Reading A (Non-factorizability)**:
    - **Verdict**: Trivially true within the quantum formalism. It is a feature of the mathematical description. It does not by itself say anything about the world. It is not what Bell's theorem shows; it is a starting point. So, the slogan in this reading is true but too weak to do the work the classmate wants.

  - **Reading B (Impossibility of LHV)**:
    - **Verdict**: True and substantive. Bell's theorem does show that local hidden variable theories are impossible. However, it does not say that the world is nonlocal; it only says that if we want hidden variables, they must be nonlocal. But the classmate's claim is about the world, and this reading is about a class of theories. Moreover, QM without hidden variables (like standard Copenhagen) may not require nonlocal hidden variables. So this reading does not establish nonlocality of the world.

  - **Reading C (Statistical nonlocality)**:
    - **Verdict**: True and substantive. Bell's theorem, combined with experimental violations of Bell inequalities, shows that the world does not admit a local statistical model. This is a claim about the world: the observed correlations cannot be explained by any local model (whether hidden variable or not). This is the core achievement of Bell's theorem. However, note that "local" here is defined by Bell's conditions (locality and no-signaling). This reading does not specify the nature of the nonlocality (causal or not). So it is a strong reading but does not by itself imply FTL causation.

  - **Reading D (Ontological nonlocality)**:
    - **Verdict**: Contentious. This reading takes the statistical nonlocality to imply that there is some nonlocal feature in the ontology of the world. However, it is possible to have interpretations that avoid nonlocality in the ontology (e.g., many-worlds, which is local but contextual, or retrocausal models). So while Bell's theorem forces us to give up at least one of the assumptions (locality, realism, measurement independence, etc.), it does not force nonlocality in the ontology if we are willing to give up something else. This reading is defensible but not forced.

  - **Reading E (Causal nonlocality / FTL causation)**:
    - **Verdict**: Contentious and not established by Bell's theorem alone. Bell's theorem does not directly show that there is FTL causation. It shows that we cannot have a local account, but the nonlocality might be explained without FTL causation (e.g., by a common cause in the past, but that is ruled out by the no-conspiracy condition and the freedom of choice). However, if we rule out other loopholes (like the freedom of choice loophole), then it becomes harder to avoid nonlocality. But note: even if we accept nonlocality, it might not be causal. For example, in Bohmian mechanics there is FTL influence but it is not causal in the sense of producing observable signals (due to quantum equilibrium). In other interpretations (like collapse theories), there might be FTL causation. However, the tension with special relativity is real in that such FTL influences cannot be used for signaling (due to the no-signaling theorem). So while FTL influence is a possible interpretation, it is not forced by Bell's theorem. Moreover, special relativity is about the impossibility of FTL signaling, not FTL influence per se. So the tension is with the spirit of relativity (locality) but not with its letter (no signaling). Verdict: This reading is defensible in some interpretations but not in others, and Bell's theorem alone does not establish it.

  - **Reading F (Holism)**:
    - **Verdict**: Metaphorical and not directly established by Bell's theorem. Bell's theorem does not require a holistic metaphysics, though it is consistent with it. This reading is vague and not a precise physical claim.

  - **Reading G (Contextuality or measurement dependence)**:
    - **Verdict**: Partly true but not the whole story. Bell's theorem does highlight contextuality (the outcome depends on the context of measurement) and the necessity of measurement dependence (the hidden variables are correlated with the measurement settings) if we try to construct a hidden variable model. However, the theorem is usually understood as a no-go theorem for local realism. The contextuality reading is important but does not negate the nonlocality aspect. In fact, nonlocality can be seen as a form of contextuality where the context includes the remote setting. So this reading is substantive but does not replace the nonlocality conclusion; it reframes it. It is a way to avoid the FTL causation reading by shifting the blame to contextuality or measurement dependence.

  - **Reading H (Operational nonlocality)**:
    - **Verdict**: True but limited. This reading says that any operational theory that reproduces the quantum predictions must be nonlocal in the sense that it cannot be implemented by local operations and classical communication (LOCC). This is true and is a consequence of Bell's theorem. But it is about the structure of operational theories and does not directly say anything about the underlying reality. It is a way to avoid ontological commitments.

  ### Which reading the argument needed
  The classmate used the slogan to argue that QM is in tension with SR and that there must be real FTL influence. For this, he needed **Reading E** (Causal nonlocality). However, as argued, Bell's theorem does not establish Reading E. It establishes **Reading C** (statistical nonlocality) and forces us to abandon at least one of the assumptions (locality, realism, measurement independence, etc.). To get to Reading E, one must argue that the only viable option is to abandon locality and that this abandonment must take the form of FTL causation. But there are interpretations that avoid FTL causation (e.g., many-worlds, which is local but contextual, or retrocausal models). Therefore, the classmate's conclusion does not follow from Bell's theorem alone.

  ### What would settle it
  To settle the issue, we need to consider the escape routes and which ones are viable. The main escape routes from the Bell theorem are:

  1. **Denying definite outcomes (e.g., many-worlds)**: This route avoids nonlocality by saying that there is no definite outcome until it is measured in a global context. But it requires a radical revision of our understanding of measurement.
  2. **Denying measurement independence (superdeterminism)**: This route says that the measurement settings are not free but are correlated with the hidden variables. This is often seen as sacrificing free will or being conspiratorial.
  3. **Retrocausality**: Allowing influences from the future to the past. This can restore locality but at the cost of temporal symmetry and our usual notion of causality.
  4. **Operationalism**: Refusing to talk about the underlying reality and focusing only on predictions. This avoids ontological nonlocality but at the cost of leaving the world unexplained.

  Each of these routes has costs. The case for Reading E (causal nonlocality) would be settled if we could show that all other escape routes are untenable. For example, if we can rule out superdeterminism by demonstrating that the measurement settings can be chosen randomly and independently in a way that is physically secure, and if we can rule out retrocausality by some experiment or principle, and if we reject the many-worlds interpretation as implausible, then we might be forced into causal nonlocality.

  However, at present, no experiment has ruled out all loopholes simultaneously (though loophole-free Bell tests have been done, they still rely on assumptions like no superdeterminism). Moreover, the choice between interpretations is often philosophical. Therefore, a reasonable person should hold that Bell's theorem establishes **Reading C** (statistical nonlocality) and that the world does not admit a local account. But whether this nonlocality is causal and FTL (Reading E) or takes another form (like contextuality, holism, or retrocausality) remains open. The tension with special relativity is real in the sense that the world is not locally causal (in Bell's sense), but it does not necessarily imply FTL signaling or a violation of the relativistic prohibition on FTL signals.

  In conclusion, the classmate's strong claim (Reading E) is not established by Bell's theorem alone, but the theorem does force us to accept a nonlocal world in the sense of Reading C. The careful person should hold that the world is nonlocal in the statistical sense (Reading C) and that the nature of that nonlocality is still a matter of interpretation.
answer: |-
  ### The slogan and its setting
  The one-liner, "Bell's theorem shows that the world is nonlocal," was used to dismiss debate and assert that quantum mechanics conflicts with special relativity due to faster-than-light (FTL) influence, implying others hold an outdated prejudice. For this to succeed, the theorem must establish a substantive, inescapable FTL causal influence in the world, not merely a limitation on theories or a formal feature of quantum mechanics.

  ### The menu of readings
  Ordered from weakest to strongest:

  1. **Formal non-factorizability**  
     *Claim*: The quantum state (wavefunction) of an entangled system fails to factorize into independent states for its spacelike-separated parts.  
     *Nature*: About the mathematical formalism of quantum mechanics (QM), not the world.  

  2. **Rejection of local hidden-variable theories**  
     *Claim*: Bell’s theorem proves that no *local hidden-variable theory* (LHV) can reproduce all QM predictions. LHV theories assume outcomes are predetermined by local factors (no FTL influence).  
     *Nature*: About a class of theoretical models, not necessarily the world.  

  3. **Statistical nonlocality (correlational)**  
     *Claim*: The observed correlations between distant measurements (e.g., in Bell tests) cannot be explained by *any* model satisfying Bell’s locality condition (outcomes depend only on local variables within their past light cones).  
     *Nature*: About the statistical behavior of the world: no local account can reproduce these correlations.  

  4. **Rejection of local realism**  
     *Claim*: Bell’s theorem shows that at least one of these must be false: (a) *Locality*: no FTL influences; (b) *Realism*: properties exist prior to measurement; (c) *Measurement independence*: experimenters freely choose settings without influence from hidden variables.  
     *Nature*: About the world: the conjunction of locality, realism, and measurement independence is incompatible with experiment.  

  5. **Ontological nonlocality**  
     *Claim*: The world fundamentally contains nonlocal connections: a measurement here physically alters the state or properties of a distant system, even at spacelike separation. This might not imply FTL *causation* (e.g., it could be acausal holism).  
     *Nature*: About the world: a metaphysical claim of non-separability.  

  6. **Causal nonlocality (FTL influence)**  
     *Claim*: Bell’s theorem proves that measurements exert a genuine, instantaneous causal influence on distant particles (e.g., wavefunction collapse causes FTL changes). This creates tension with special relativity’s light-speed causality limit.  
     *Nature*: About the world: a stronger claim of FTL causation.  

  7. **Contextuality or measurement dependence as core**  
     *Claim*: Bell’s theorem primarily shows that measurement outcomes depend on the *context* (e.g., the distant setting) or that hidden variables must be correlated with measurement choices (measurement dependence), with locality being secondary or irrelevant.  
     *Nature*: About the world or models: shifts focus from locality to other factors.  

  8. **Operational nonlocality**  
     *Claim*: Bell’s theorem constrains operational theories: any theory reproducing QM predictions cannot be locally simulated (e.g., requires nonlocal resources in an information-theoretic sense).  
     *Nature*: About theoretical frameworks, not the world’s ontology.  

  ### Verdicts  
  *Reasoning is compressed; each verdict addresses truth, strength, and implications.*  

  1. **Formal non-factorizability**:  
     - **Verdict**: Trivially true but merely verbal.  
     - **Why**: It’s a mathematical fact of QM’s formalism, with no physical content. It doesn’t imply nonlocality in the world (e.g., decoherence can mask entanglement). Useless for the classmate’s argument.  

  2. **Rejection of local hidden-variable theories**:  
     - **Verdict**: Substantive and true, but weak.  
     - **Why**: Bell’s theorem does rule out LHV theories, but this says nothing about the world if QM itself is nonlocal or if other interpretations avoid hidden variables. It’s about models, not necessity.  

  3. **Statistical nonlocality (correlational)**:  
     - **Verdict**: Substantive, defensible, and true.  
     - **Why**: Bell’s theorem, combined with loophole-free experiments, proves the world exhibits correlations that no local model can explain. This is a claim about the world: local causality (in Bell’s sense) fails. However, it doesn’t specify *how* it fails (e.g., FTL causation vs. other escapes).  

  4. **Rejection of local realism**:  
     - **Verdict**: Substantive, defensible, and true.  
     - **Why**: Bell’s theorem forces us to reject at least one of the trio (locality, realism, measurement independence). This is a claim about the world’s structure. But it doesn’t single out nonlocality; realism or measurement independence could be the culprit.  

  5. **Ontological nonlocality**:  
     - **Verdict**: Contentious and not fully established.  
     - **Why**: While statistical nonlocality (Reading 3) is proven, this leap to a "physical alteration" is interpretive. Some interpretations (e.g., Bohmian mechanics) embrace it; others (e.g., many-worlds) avoid it with local dynamics. Bell’s theorem doesn’t force this; it’s a philosophical choice.  

  6. **Causal nonlocality (FTL influence)**:  
     - **Verdict**: Contentious and false as a direct implication.  
     - **Why**: Bell’s theorem *does not* prove FTL causation. It shows that local causality fails, but this could stem from non-causal holism, retrocausality, or other factors. Crucially, QM prohibits FTL *signaling*, so any "influence" can’t be causal in the special-relativistic sense (which forbids FTL signals). The tension with relativity is superficial: relativity forbids FTL signals, not influences, and QM respects no-signaling. This claim overreaches.  

  7. **Contextuality or measurement dependence as core**:  
     - **Verdict**: Partly true but misleading for locality.  
     - **Why**: Bell’s theorem *does* imply contextuality (outcomes depend on distant settings), and measurement dependence is an escape route. But this doesn’t negate nonlocality; it reframes it. Contextuality here *is* nonlocality (the context is nonlocal). Sacrificing measurement independence (e.g., superdeterminism) avoids nonlocality but is costly (see below). Not a refutation of nonlocality.  

  8. **Operational nonlocality**:  
     - **Verdict**: True but operationally narrow.  
     - **Why**: Bell’s theorem does imply that operational theories must be nonlocal in this sense. But this is a claim about models, not the world’s ontology. It avoids metaphysical commitments, so it doesn’t support the classmate’s conclusion.  

  ### Which reading the argument needed  
  The classmate’s conclusion—that QM conflicts with special relativity due to real FTL influence—required **Reading 6 (causal nonlocality)**. This is the only reading that asserts genuine FTL causation. However, as per the verdicts, **Bell’s theorem does not establish this reading**. It only forces **Reading 3 (statistical nonlocality)** or **Reading 4 (rejection of local realism)**, neither of which entails FTL influence. The theorem leaves open escapes that avoid FTL causation entirely. Thus, the classmate does not have the reading he needs; his conclusion is unsupported by Bell’s theorem alone.  

  ### What would settle it  
  To resolve the ambiguity:  
  - **Experiments** cannot directly distinguish between readings (e.g., all loophole-free Bell tests confirm Reading 3 but don’t prove FTL causation).  
  - **Theoretical work** is key: Viable escape routes from nonlocality must be evaluated on their merits. For each:  
    - **Deny definite outcomes (e.g., many-worlds)**: Sacrifices *realism*. Costly (requires vast ontology) but serious; leaves locality intact, so refutes Reading 6.  
    - **Deny measurement independence (superdeterminism)**: Sacrifices *freedom of choice*. Costly (implies conspiracy or determinism at odds with science); if accepted, avoids nonlocality, so refutes Readings 3–6.  
    - **Admit backwards causation**: Sacrifices *temporal causality*. Costly (violates intuitive causation) but possible; restores locality retrocausally, refuting Reading 6.  
    - **Purely operational reading**: Sacrifices *ontology*. Costly (abandons explanation for prediction); avoids all nonlocality claims about the world, refuting Readings 3–6.  
    
  A reasonable person should hold **Reading 3 (statistical nonlocality)** as the minimal, proven claim about the world: local causality fails, and no local account can explain the correlations. This is defensible and experiment-backed. Reading 4 (rejection of local realism) is equally solid but broader. Reading 6 (FTL influence) is unwarranted—it’s an interpretive leap with no empirical advantage and conflicts with relativity only superficially. The classmate’s assertion of FTL influence is not physics but philosophy; Bell’s theorem shows nonlocality only in the correlational sense (Reading 3), which is profound but not metaphysically loaded. Until an escape route is empirically ruled out or rendered absurd, stronger claims like Reading 6 remain speculative.
