answer: |-
  Here's a clean, non-technical presentation of Fitch's Paradox ("The Knowability Paradox") tailored for a first-year seminar, focusing on its refutation of verificationism and avoiding modal logic. I'll then address your side question. British English throughout, as requested.

  ---

  **Handout Section: Fitch's Paradox & The Death of Verificationism?**

  **1. Verificationism's Core Idea:**
  Verificationism claims: **"A statement is true if and only if it is *possible* (in principle) for someone to know it."** Or, more simply: **Truth = Knowability.** If something is true, it *must* be possible for someone, somewhere, at some time, to find out that it's true. There are no "unknowable truths".

  **2. The Challenge: Are There *Really* No Unknowable Truths?**
  We often encounter truths that are *currently* unknown (e.g., "What was the exact weight of the first dinosaur egg?"). Verificationism insists these are still *knowable* in principle. But could there be truths that are *fundamentally* unknowable? Fitch's Paradox suggests: **Yes, there must be.**

  **3. Fitch's Simple (but Powerful) Argument:**
  Let's construct a specific type of true statement:

  *   **Statement Q:** **"P is true, but nobody *ever* knows that P is true."**
      *(Where "P" stands for any ordinary proposition, like "It rained in London on 1st January 1500").*

  Now, ask two critical questions:

  *   **Could Q *ever* be true?** Absolutely! Just imagine that P *is* true (e.g., it *did* rain in London on 1/1/1500), but that this fact is completely lost to history – no evidence survives, no one recorded it, no one could ever possibly know it. In this case, Q ("It rained, but nobody ever knows it rained") is simply a true description of the situation.
  *   **Could Q *itself* ever be *known*?** According to Verificationism, *if* Q is true, then it *must* be knowable. Let's see what happens if we assume someone *could* know Q...

  **4. The Contradiction (The Heart of the Paradox):**
  Suppose Verificationism is correct. Then, if Q is true, someone *could* potentially know Q.

  *   **What does knowing Q mean?** If someone *knows* Q, then they know *both* parts:
      *   They know that **"P is true"**.
      *   They know that **"Nobody ever knows that P is true"**.
  *   **The Problem:** The moment they know the *first* part ("P is true"), they *also* know P! But the *second* part of Q says "Nobody *ever* knows that P is true". This directly contradicts the fact that *they* now know P.
  *   **Conclusion:** It's **impossible** for anyone to know Q. Knowing Q would require simultaneously knowing P and knowing that P is unknowable – which is absurd. You can't know something while also knowing that knowledge of it is impossible.

  **5. The Unknowability Corollary & Verificationism's Demise:**
  We've established:

  1.  Statements like Q **can be true** (e.g., if P is a lost historical fact).
  2.  Statements like Q **cannot possibly be known** (as shown by the contradiction).
  3.  Therefore, **there *are* unknowable truths** (specifically, truths of the form "P is true but unknown").

  **Verificationism claimed: "All truths are knowable."**
  Fitch shows: **"If all truths *were* knowable, then truths like Q *couldn't exist*. But truths like Q *can* exist. Therefore, Verificationism must be false."** The existence of *currently* unknown truths logically forces the existence of *fundamentally* unknowable truths if Verificationism is assumed. Verificationism collapses under the weight of its own claim.

  **The Takeaway:** Fitch's Paradox suggests a profound limit to human knowledge: some truths, particularly those asserting their *own* unknowability *alongside* a mundane fact, are necessarily beyond our epistemic reach. This directly challenges the idea that truth is always tied to our potential to discover it.

  ---

  **Side Question: Swapping "Knows" for "Is Justified in Believing"**

  **The proof crucially depends on knowledge entailing truth.** It collapses if we swap "knows" for "is justified in believing".

  *   **Why it works for "Knows":** Knowledge has *factivity*: If you *know* X, then X *must* be true. This is vital for generating the contradiction. When someone "knows Q" in the thought experiment, they *must* thereby make P true and known, directly contradicting the second part of Q ("nobody knows P").
  *   **Why it fails for "Is Justified in Believing":** Justification is *not* factive. You can be perfectly justified in believing something that turns out to be *false*. Let's redefine Q:
      *   **Q_J:** **"P is true, but nobody is *ever justified in believing* that P is true."**
  *   **The Contradiction Vanishes:** Suppose someone *is justified in believing* Q_J. This means:
      *   They are justified in believing "P is true".
      *   They are justified in believing "Nobody is ever justified in believing P is true".
  *   **No Contradiction:** Their being justified in believing P *does not* make P *true* (justification isn't factive). Crucially, it *does not* make anyone (including themselves) *actually justified* in believing P in a way that satisfies the *truth* conditions of Q_J. Q_J being true requires that P *is* true *and* that justification for believing P is impossible. Someone being justified in believing Q_J only tells us about their *belief state* concerning P and its (un)justifiability; it doesn't force P to *be* true or force anyone to *actually be justified* in a way that contradicts Q_J's truth. The contradiction relied on the *act of knowing* making the embedded proposition P both *true* (because knowledge entails truth) and *known* (which directly contradicted the second conjunct). Justification lacks this truth-entailing force.

  **In short:** Fitch's proof relies on the factivity of knowledge. Swapping "knows" for "is justified in believing" removes this essential ingredient, and the argument no longer goes through. Verificationism about *truth* is refuted, but a weaker "justifiability" principle might potentially survive (though it would face other, independent challenges).
