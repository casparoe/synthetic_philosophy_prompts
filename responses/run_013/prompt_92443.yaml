prompt: |-
  Right — I teach a final-year option on decision theory, eighteen students, one ninety-minute session, and I want them to feel the force of geometric rationality in their gut rather than just nod along to the Kelly formula. Can you design me a runnable in-class betting game?

  Here's the flavour I'm after. Everyone starts with the same bankroll of tokens (no real money), and we play a decent number of rounds; each round they choose how much of their current bankroll to stake, and then a coin or a dice roll settles the outcome. The payoffs need to be aranged so that the arithmetic-mean-maximising play and the log-wealth-maximising play pull apart, and — this is the bit I care about most — so that the room's *average* bankroll climbs while the *typical* student's bankroll slides towards nothing. I'd also like at least one available bet where a small chance of a catastrophic loss keeps the expected value looking juicy but is fatal for anyone who stakes enough on it; that's the Pascalian tail I want them to trip over. If you can build in a moment where someone is offered a big one-off bet that's clearly positive-EV and has to decide, even better.

  Give me the full kit: rules, materials, the payoff table, the round structure, any roles, and a debrief that maps specific moments onto the arithmetic-versus-geometric distinction and onto the gap between the ensemble average and the time average. Tell me what will predictably go wrong the first time I run it and how to handle it, and be honest about which part of the idea the activity can't reproduce — the bit I'll have to supply myself (why log rather than some other utility, what changes when the stakes aren't multiplicative, one-shot versus repeated betting, that sort of thing).

  Answer in British English, please.
reasoning: |-
  Alright, let me tackle this request for a decision theory class activity. The professor wants an in-class betting game that illustrates geometric rationality versus arithmetic maximization, with specific learning outcomes around the Kelly criterion and ensemble versus time averages. 

  First, I need to consider the core pedagogical goals: making students feel the difference between average growth and typical outcomes, and creating a Pascalian trap. The game must run within 90 minutes with 18 students, using tokens instead of real money.

  Hmm... the key challenge is designing bets where EV-maximizing behavior diverges sharply from growth-optimal play. I recall that fractional Kelly systems often create this effect - maybe a mix of favorable asymmetric bets and unfavorable symmetric ones? For the Pascalian element, a high-EV bet with ruin risk seems perfect.

  For mechanics: starting bankrolls of 100 tokens, 12 rounds with different bet options each round. Need a payoff table where:
  - Bet A (asymmetric): +200% win / -50% loss (Kelly fraction ~25%)
  - Bet B (symmetric): ±100% (Kelly fraction 0%)
  - Bet C (Pascalian): +1000% win / -100% loss (Kelly fraction ~9%)

  Ah, and the critical moment - a special round where students can stake everything on a 60% win chance with +150% payoff. The EV is tempting (+90%) but full stake leads to ruin with 40% probability. This should create dramatic divergence.

  For implementation: poker chips would work well for tokens, with dice determining outcomes. To maintain pace, I'd suggest pre-printed betting slips and a central ledger. The professor should track class averages while students see individual outcomes.

  During debrief, I'll emphasize three points: 
  1) How EV maximizers go bust while Kelly betters thrive 
  2) The growing gap between average and median wealth 
  3) How one student's big win masks many small losses

  Potential pitfalls include slow betting decisions - hence the strict 45-second rounds. Also students might collude, but that actually serves as a teachable moment about independent decision-making. The main limitation is the simplified utility assumption; I'll need to explicitly discuss why log utility matters and how real-world stakes differ.

  The emotional impact should be strong when students realize being "right" on EV can still lead to ruin. That gut feeling is exactly what the professor wants for geometric rationality.
answer: |-
  Right, let's craft a proper classroom spectacle – "The Great Rationality Rift" – designed to make geometric reasoning *bite*. Here's the full kit, designed for impact within your constraints.

  **Core Concept:** Students repeatedly face bets with positive Expected Value (EV) but where staking too much (especially the full EV-maximising amount) leads to ruin for most, while the *average* wealth soars due to a few massive winners. The Pascalian trap is explicit.

  **Learning Objectives:**
  1.  Viscerally feel the difference between maximising *expected arithmetic wealth* and maximising *expected geometric growth rate* (log wealth).
  2.  Experience the divergence between the *ensemble average* (average wealth across all students *at a single time*) and the *time average* (typical wealth trajectory of a *single student* over time).
  3.  Confront the catastrophic risk hidden within seemingly "juicy" positive-EV bets with a small chance of total loss (Pascalian tail).
  4.  Make a high-stakes, one-off decision under pressure.

  **The Game: "The Fractured Fortune"**

  *   **Players:** 18 Students.
  *   **Duration:** Approx. 60-75 minutes gameplay + 15-20 minute debrief.
  *   **Materials:**
      *   Poker chips (or counters) - Lots! (~5000 recommended). Different colours help (e.g., White=1, Red=5, Blue=10, Green=25).
      *   One six-sided die (d6) and one coin.
      *   Whiteboard/Projector to display the **Betting Menu** and track **Class Average Wealth** each round.
      *   Student Betting Slips (paper or digital form) - Must record: *Round, Choice (A/B/C/Special), Stake Fraction (e.g., 0.1, 0.5, 1.0), Starting Wealth, Ending Wealth.*
      *   A bell or timer for rounds.
      *   (Optional) Spreadsheet for instructor to quickly calculate class average/median each round.

  *   **Starting Conditions:**
      *   Each student starts with **100 tokens**.
      *   Initial Class Average Wealth = 100. Initial Median Wealth = 100.

  *   **The Betting Menu (Displayed Prominently):**

      | Bet | Description                     | Probability (Win) | Payoff if Win (Multiplier on Stake) | Payoff if Lose (Multiplier on Stake) | EV (Per Unit Staked) | Approx. Kelly Fraction* |
      | :-- | :------------------------------ | :---------------- | :---------------------------------- | :----------------------------------- | :------------------- | :---------------------- |
      | **A** | **Asymmetric Upside**           | 50% (Coin Flip)   | +2.0 (Triple your stake back!)      | -0.5 (Lose half your stake)          | **+0.75**            | **~25%**                |
      | **B** | **Symmetric Gamble**            | 50% (Coin Flip)   | +1.0 (Double your stake back!)      | -1.0 (Lose your entire stake)        | **+0.50**            | **0%** (Don't bet!)     |
      | **C** | **Pascalian Long Shot**         | 90% (d6: 1-5 Win) | +0.1 (Gain 10% of stake)            | -1.0 (Lose your *entire bankroll*)   | **+0.01**            | **~0.9%** (Tiny!)       |
      | **S** | **Special Round Offer (Rnd 7)** | 60% (d6: 1-4 Win) | +1.5 (Gain 150% of stake)           | -1.0 (Lose *entire bankroll*)        | **+0.90**            | **~20%**                |

      *\*Kelly Fraction provided for instructor context/debrief, NOT shown to students initially.*

  *   **Round Structure (12 Rounds Total):**
      1.  **Announce Round:** Display the Betting Menu. Remind students: "Choose ONE bet (A, B, or C) and decide what *fraction* of your *current* bankroll to stake (between 0 and 1). Special Bet (S) only available on Round 7!"
      2.  **Decision Time (45 seconds):** Students record their choice (A/B/C/S) and stake fraction on their slip. *Crucially, they calculate the actual token amount staked based on their *current* wealth and write it down.*
      3.  **Lock In:** "Pens down! Stakes recorded!"
      4.  **Resolution:**
          *   **Bets A & B:** Instructor flips coin (Heads=Win, Tails=Lose). Call out result.
          *   **Bet C & S:** Instructor rolls d6. Call out result and win condition (e.g., "d6=3, Bet C Wins!" or "d6=6, Bet C Loses - Ruin!").
      5.  **Settle Up:** Students calculate their new bankroll based on the outcome and their stake.
          *   `New Wealth = Current Wealth - Staked Tokens + (Staked Tokens * Payoff Multiplier)`
          *   *Example (Bet A, Win):* `100 - 50 + (50 * 3) = 50 + 150 = 200`
          *   *Example (Bet A, Lose):* `100 - 50 + (50 * 0.5) = 50 + 25 = 75` *(Lose half stake)*
          *   *Example (Bet C, Lose):* `New Wealth = 0` *(Regardless of stake amount)*
          *   **Students record their New Wealth.**
      6.  **Class Snapshot:** Instructor quickly collects *current wealth* from all students (a shout of numbers suffices). Calculate and display:
          *   **Class Average Wealth:** (Sum of all wealth) / 18
          *   **Class Median Wealth:** Middle value when wealths are ordered. *This is the "typical" student.*
          *   **Number Bankrupt (Wealth <= 1 token):** Track visibly.
      7.  **Repeat:** Move to next round. Announce Round 7 clearly as the Special round.

  *   **The Special Round (Round 7):**
      *   Announce dramatically: "SPECIAL ROUND! One-time offer ONLY! Bet S is now available! Remember the stakes: 60% chance to win big (+150% on stake), 40% chance to lose EVERYTHING. Choose A, B, C, or S. Decide your stake fraction. You have 45 seconds... GO!"
      *   Proceed as normal. The EV (+0.90) is incredibly tempting. The ruin risk (40%) is high. The geometric (Kelly) optimal stake is low (~20%), but full staking (100%) will be common.

  *   **Predictable Flow & What Goes Wrong:**
      *   **Early Rounds (1-3):** Students tentatively bet small on A or B. Average and Median stay close, maybe drift up slightly. Bet C is largely ignored (wisely).
      *   **Middle Rounds (4-6):** Winners bet more aggressively (esp. on A). Losers might chase losses. Bet C starts tempting some ("It's 90% safe!"). Average wealth starts pulling ahead of Median. First bankruptcies *might* occur from aggressive Bet B or unlucky Bet C.
      *   **Round 7 (Special):** Pandemonium. Many will go all-in (or large fraction) on S due to the massive EV. A significant number (approx. 7-8 students, statistically) will go bankrupt. Average wealth might jump *dramatically* due to a few huge S wins. Median wealth will *plummet* as half the class goes bust or loses heavily. The Rift is born.
      *   **Late Rounds (8-12):** The landscape is fractured. Bankrupt students (Wealth=0) sit out (or bet 0). A few students have huge bankrolls (1000+). Many are impoverished (<50). Bet C becomes *more* tempting for the poor ("I need a miracle!"). Average wealth climbs steadily, driven by the few giants. Median wealth stagnates or declines towards zero. Bankruptcies increase.
      *   **What Goes Wrong:**
          *   **Slow Betting:** 45 seconds feels short. Enforce strictly. Shout time warnings. Students dithering get 0 stake by default.
          *   **Calculation Errors:** Students mess up `New Wealth = ...`. Emphasize recording *Current Wealth* and *Staked Tokens* first. Mistakes are part of the lesson – "Did that error help or hurt your geometric growth?"
          *   **Collusion/Cheating:** Unlikely but possible (e.g., agreeing to all bet small). Discourage firmly; the point is individual choices under the rules. Real markets aren't colluded.
          *   **Frustration of Bankrupt Students:** Acknowledge it! "This frustration is the *feeling* of the time average falling behind the ensemble average. You made rational EV choices, but...?"
          *   **Special Round Fallout:** Genuine shock/anger at bankruptcies. Lean into it for the debrief.

  **The Debrief (The Crucial Bit):**

  Map the experience directly onto the theory:

  1.  **Arithmetic vs. Geometric Rationality:**
      *   "Bet B (Symmetric): EV is positive (+0.5). Why did betting on it, especially heavily, lead to ruin for many? What's the Kelly fraction? (0%). Maximising *expected money next round* ignores the risk of ruin and the multiplicative nature of repeated bets. Arithmetic rationality is myopic."
      *   "Bet A (Asymmetric): Positive EV (+0.75), but Kelly is ~25%. Who consistently bet around 25%? How did you fare vs. those who bet 50%, 75%, 100%? The heavy bettors likely had wild swings or went bust, even though each bet was 'good' individually on average (arithmetically). Geometric rationality (maximising growth rate) demands fractional staking."
      *   "Bet C (Pascalian): The Tail Risk! EV is slightly positive (+0.01). But why is the Kelly fraction tiny (~0.9%)? That tiny 10% risk of losing *everything you have* is catastrophic for growth, even if the payoff seems 'safe' most of the time. Arithmetic EV hides this existential risk. One unlucky roll wipes out all past and future gains. Did anyone *survive* multiple bets on C? How much did they *really* gain compared to the risk?"
      *   **Special Round S:** "The Juicy Trap! Huge EV (+0.90). Who bet big? Who bet small or avoided it? How many of the big bettors are still with us? The EV maximiser sees only the +0.90 and might stake 100%. The Kelly bettor (~20%) sees the 40% risk of ruin as utterly dominant. The results speak for themselves. A positive EV bet can be *terrible* for your long-term wealth if the stakes are too high relative to the risk of ruin."

  2.  **Ensemble Average vs. Time Average (The Rift):**
      *   Point to the final whiteboard stats. "Look at the Class Average Wealth. What trend did you see?" (It climbed steadily, likely ended high). "Now look at the Median Wealth. What trend?" (It peaked early, then plummeted, likely ended near zero). "This is the Rift!"
      *   "The Ensemble Average (what we see on the board each round) is the average wealth *across all of you, right now*. It got pulled up and up by the few students who won massively, especially on the Special bet."
      *   "The Time Average is the typical *trajectory* of a single student over time. For most of you, your personal wealth over these 12 rounds (your time average) peaked and then crashed towards zero. The ensemble average hides the suffering of the majority behind the spectacular success of the few."
      *   "This divergence is a fundamental consequence of multiplicative growth with risk. Focusing *only* on the ensemble average (e.g., 'average returns' in a fund prospectus) is dangerously misleading for an individual investor following a typical path. Your gut feeling of decline while the average soared is mathematically real."

  3.  **The Kelly Criterion as Damage Control:**
      *   "Kelly staking (betting the fraction that maximises log wealth growth) isn't about getting *rich quick*. It's primarily about *not going bust* while still capturing upside. It avoids the Pascalian trap (Bet C) and tempers the aggression on positive EV bets (A, S) to avoid ruin. It aims for a *sustainable* growth path."
      *   "Did anyone intuitively bet something close to the Kelly fractions? How did your volatility and final wealth compare to the all-in crowd?"

  **What the Activity *Can't* Fully Reproduce (The Bit You'll Need to Supply):**

  1.  **Why Log Wealth?** The activity makes *intuitive sense* of maximising growth rate and avoiding ruin. But it doesn't *derive* why log(wealth) is the specific utility function that achieves this. You'll need to bridge the gap:
      *   Connect the multiplicative nature of repeated betting (`Wealth_final = Wealth_initial * (1 + f*return1) * (1 + f*return2) * ...`) to maximising the *sum* of log(1 + f*return) terms (i.e., the log of the product).
      *   Contrast with additive processes (where arithmetic mean matters) vs. multiplicative processes (where geometric mean matters).
      *   Mention the properties: log utility is myopic (optimal for next bet is optimal for sequence), implies constant relative risk aversion (CRRA), and prevents ruin (goes to -∞ as wealth → 0).

  2.  **Non-Multiplicative Stakes & One-Shot Bets:** The activity relies on bets scaling with current wealth (fractional staking). Real-world decisions aren't always like this:
      *   **Fixed Stakes:** If bets are fixed amounts (e.g., £10 per bet regardless of wealth), the problem changes. Ruin is less likely for the wealthy, but growth dynamics differ. Kelly logic applies less directly; bankroll management is still key, but the optimal fraction per bet isn't defined the same way.
      *   **One-Shot Bets:** The core lesson (avoiding ruin, understanding tail risks) still applies powerfully to a single massive bet (like the Special Round!). The repeated structure amplifies the divergence between ensemble and time averages and the consequences of fractional staking. Emphasise that Kelly is primarily for *repeated* opportunities with multiplicative stakes. For one-shot, high-consequence bets, other utility functions and risk tolerances dominate, but the *insights* about tail risk and ruin remain critical.

  3.  **Utility Beyond Growth:** The activity implicitly assumes the goal is long-term wealth growth. Discuss scenarios where other utility functions matter (e.g., securing a minimum living standard, philanthropic goals, terminal wealth for bequests). Log utility is a specific, powerful choice for pure capital growth, not universal rationality.

  **Final Advice:** Run it fast and loud. The emotional response – the thrill of the big S win, the groan of the S bust, the frustration of the slow grind down while the average climbs – is the pedagogical gold. Point directly back to those moments in the debrief: "Remember when X went bust on S? That was the Pascalian tail. Remember feeling poor while the average soared? That was the Rift." **That's** the gut feeling you're after. Good luck!

  **British English Check:** "Bankroll", "Poker chips", "Counter", "Whiteboard", "Shout of numbers", "Pens down", "Pandemonium", "Myopic", "Tempting", "Plummet", "Dithering", "Lean into it", "Prospectus", "Bridge the gap", "Amplifies" – All good!
