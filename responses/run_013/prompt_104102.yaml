answer: |-
  ## Research Proposal: Relational Comparisons and the Foundations of Distributive Justice

  **1. Research Question:**  
  Can a theory of distributive justice derive all necessary normative prescriptions for the allocation of resources or opportunities solely from *relational* comparative judgments of the form "Agent A is worse off than Agent B relative to available alternatives" – understood as a primitive, non-metric evaluative relation – without recourse to any interpersonal *metric* comparisons (requiring cardinal measurement of well-being or advantage on a common scale), and while explicitly accounting for the normative significance of *who* makes the comparison and from what standpoint?

  **2. Context and Gap in the Literature:**  
  The longstanding debate concerning interpersonal utility comparisons (IUCs) has been predominantly framed in terms of their metaphysical possibility (e.g., whether a common unit of well-being exists) or epistemic accessibility (e.g., whether we can know another’s mental states sufficiently for cardinal measurement). Positions range from outright denial of meaningful IUCs to sophisticated defences of their feasibility. This debate implicitly assumes that justice *requires* such metric comparisons to aggregate utilities or make precise trade-offs (e.g., in utilitarianism or prioritarianism).

  Simultaneously, relational egalitarians argue that justice is fundamentally concerned with objectionable *relations* between individuals (e.g., domination, oppression, or unjustifiable inequality), shifting focus away from the sum or distribution of individual metric holdings. However, even relational approaches often implicitly rely on *some* underlying notion of comparative advantage (e.g., identifying who is "worse off" to determine who suffers domination or who benefits from unjust inequality). Crucially, this reliance on relational comparisons ("A is worse off than B") is typically treated as unproblematic, lacking the scepticism directed at metric comparisons. The literature largely fails to:

  *   **Systematically decouple relational comparisons from metric foundations:** It remains unclear whether claims like "A is worse off than B" can function as normatively foundational primitives for justice without presupposing, or collapsing into, a metric understanding.
  *   **Theorise the role of the comparer:** The standard framing ignores *who* makes the comparison (the affected individual, a third party, an institution) and how their position, perspective, interests, or authority fundamentally shapes the meaning, validity, and normative force of the relational judgment. This raises questions about whether "worse off" is descriptive (identifying a fact) or inherently evaluative/perspectival (a judgment made from a specific normative standpoint).

  The levelling-down objection, which criticises egalitarianism for valuing equality even when it makes no one better off and some worse off, primarily targets *telic* egalitarianism concerned with the pattern of metric holdings. If justice requires only relational comparisons identifying who is worse off to trigger demands for justification or redress (without requiring a metric sum or pattern), the levelling-down objection may indeed lose its force against such a view. However, this potential route remains underexplored because the sufficiency and nature of purely relational comparisons for justice have not been rigorously established.

  **3. Methodology – Conceptual Analysis:**  
  This project will employ sustained conceptual analysis and normative argumentation, conducted over one academic term (approximately 12 weeks), structured as follows:

  *   **Month 1: Foundational Analysis & Literature Review:**  
      *   Week 1-2: Precisely define the core distinction: **Metric Comparison** (requiring cardinal interpersonal measurement on a common scale) vs. **Relational (Justice) Comparison** (the primitive judgment "A is worse off than B relative to alternative state S", normatively triggering a demand for justification). Analyse paradigmatic examples (benefit assessments, triage, damages) to isolate the relational component.
      *   Week 3-4: Critically map the existing landscape: (a) The metric scepticism debate (focusing on its core assumptions about justice's requirements); (b) Relational egalitarianism (noting its reliance on comparative disadvantage); (c) The levelling-down debate (clarifying its target).
  *   **Month 2: Testing Relational Sufficiency:**  
      *   Week 5-6: Can core distributive principles (e.g., prioritarianism, sufficiency thresholds, relational equality's demands for non-domination) be formulated *only* using relational comparisons? Construct formal or quasi-formal models where relational judgments are primitive inputs. Identify potential points of collapse into metric assumptions.
      *   Week 7-8: Confront the levelling-down objection directly. If justice only demands addressing "A is worse off than B" (without requiring a better pattern *per se*), does levelling down ever satisfy this demand? Argue why/why not.
  *   **Month 3: The Comparer Problem:**  
      *   Week 9-10: Analyse the role of the comparer. Distinguish perspectives: First-person (A judges themselves worse off than B), second-person (B judges A worse off), third-party individual, institutional. How does the comparer's position affect the meaning and authority of "A is worse off than B"? Does this reveal "worse off" as inherently perspectival/evaluative rather than purely descriptive? Explore implications for objectivity in justice.
      *   Week 11: Synthesise findings on relational sufficiency and the comparer problem. Assess the overall viability of a purely relational foundation.
  *   **Month 3 (Final Weeks) & Buffer:**  
      *   Week 12: Consolidate arguments, refine thesis, draft conclusion. Buffer time for unforeseen complexities or writing.

  **Justification for Conceptual Analysis:**  
  The core questions are fundamentally conceptual and normative: What *is* the structure of the comparisons justice requires? Can one type function independently? What is the nature of "worse off"? An empirical survey of institutional practices, while potentially illustrative *later*, cannot answer these prior conceptual questions about the necessary foundations of *theory*. Institutions may use heuristics or implicit metrics; the project asks whether theory *needs* these. Conceptual analysis is essential to clarify the very terms of the debate and assess the internal coherence and sufficiency of proposed normative frameworks.

  **4. Outcomes:**

  *   **Success:** The project succeeds if it:
      1.  Provides a clear, defensible account of the metric/relational distinction and demonstrates that relational comparisons are distinct and not parasitic on metric foundations.
      2.  Shows convincingly that at least one plausible theory of distributive justice (e.g., a refined relational egalitarianism or a needs-based sufficientarianism) can generate its core prescriptions using *only* relational comparisons, successfully bypassing the need for metric IUCs.
      3.  Demonstrates that this approach genuinely deflects the levelling-down objection.
      4.  Develops a compelling analysis of how the comparer's standpoint shapes relational judgments, arguing for its essential relevance to their normative role in justice.
      5.  Concludes with a coherent position on whether "worse off" within justice is best understood as descriptive, evaluative, or irreducibly both, given the comparer's role.
  *   **Failure:** The project would fail if it:
      1.  Cannot sustain the metric/relational distinction, showing relational comparisons inevitably presuppose a metric.
      2.  Concludes that no plausible theory of justice can function without *some* form of metric comparison.
      3.  Finds the levelling-down objection retains its force against theories relying solely on relational comparisons.
      4.  Fails to integrate the "comparer problem" meaningfully into the core argument about the foundations of justice.
      5.  Results in an ambiguous or inconclusive position on the nature of "worse off".

  **5. Scope and Limitations:**  
  This project is ambitious for a single term. Key scope limitations include:

  *   **Focus on Foundations:** The primary focus is on the *conceptual foundations* of distributive principles, not developing a complete, applied theory of justice or providing detailed institutional blueprints. Illustrative examples will be used, but not exhaustive case studies.
  *   **Limited Theory Survey:** While testing against major paradigms (e.g., utilitarianism, Rawlsianism, luck egalitarianism, relational egalitarianism), it cannot engage with every nuanced variant. Core representatives will be analysed to establish the central argument.
  *   **Metaethics:** The analysis of "worse off" (descriptive/evaluative) will be driven by the needs of the justice argument, not a full dive into metaethical theories of value or judgment. The focus is on the *role* within justice reasoning.
  *   **The Comparer Problem:** Fully developing a normative account of legitimate comparers (e.g., an epistemology of standpoint) is beyond scope. The project aims to *establish* its significance and sketch its implications, not resolve it completely.

  **Risk of Overextension:** The project becomes too big if: (1) The attempt to test relational sufficiency across multiple theories becomes unwieldy; (2) The analysis of the comparer's role spirals into a full theory of epistemic authority or social ontology; (3) The question of the nature of "worse off" necessitates a comprehensive detour into philosophy of language or mind. **Mitigation:** Strict adherence to the core question and the monthly plan. Prioritise depth on the key arguments for relational sufficiency and the indispensability of the comparer perspective for the relational project, accepting that related areas can only be delineated, not resolved.
