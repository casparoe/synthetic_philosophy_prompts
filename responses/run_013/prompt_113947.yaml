  ### Procedure for Volunteers (Two-Party Cases Only)
  **Time Required:** 15-20 minutes  
  **Materials:** Two completed intake forms (with 100 points allocated across items/fallbacks) and a calculator.  
  **Assumptions:**  
  - Only two parties are involved (fails for three or more).  
  - Cash or equivalent is available for transfers (critical for balancing).  
  - Items are indivisible (no splitting).  

  #### Steps:
  1. **Identify Items and Disagreement Points**  
     - List all disputed items (e.g., cash, client list, care obligation).  
     - Record each party’s **disagreement utility** (\(d_A\), \(d_B\)):  
       - Found in the "fallback outcome" section of the form (e.g., "status quo: 10 points," "court: 15 points").  

  2. **Assign Items to the Higher Bidder**  
     - For each item, assign it to the party with the **higher point value** (even if negative).  
       - *Example:* If A values a non-compete at -10 and B at -30, assign it to A (since -10 > -30).  
     - Calculate each party’s utility from this assignment:  
       - \(u_A\) = Sum of points for items assigned to A.  
       - \(u_B\) = Sum of points for items assigned to B.  

  3. **Compute "Ideal" Utilities**  
     - \(u_A^*\) = Sum of **all positive points** for A (ignore negative items).  
     - \(u_B^*\) = Sum of **all positive points** for B (ignore negative items).  
     - *Why?* This estimates what each party would get if they received every desirable item.  

  4. **Calculate Gains and Maximum Gains**  
     - Gains:  
       - \(G_A = u_A - d_A\)  
       - \(G_B = u_B - d_B\)  
     - Maximum gains:  
       - \(M_A = u_A^* - d_A\)  
       - \(M_B = u_B^* - d_B\)  
     - *Stop if \(M_A \leq 0\) or \(M_B \leq 0\):* No mutually beneficial agreement exists. Return to mediation.  

  5. **Compute Cash Transfer**  
     - Transfer amount \(c\):  
       \[
       c = \frac{G_A \cdot M_B - G_B \cdot M_A}{M_A + M_B}
       \]  
     - If \(c > 0\), transfer \(|c|\) from A to B.  
     - If \(c < 0\), transfer \(|c|\) from B to A.  
     - **Constraints:**  
       - Cash transfer cannot exceed available cash.  
       - If no cash, stop: The allocation is unfair without transfers. Return to mediation.  

  6. **Final Allocation**  
     - Assign items per Step 2.  
     - Add cash transfer from Step 5.  
     - Report results to parties.  

  **Where Judgment Prevails:**  
  - Step 2 (item assignment) ignores synergies between items.  
  - Step 3 ("ideal" utilities) is unrealistic (parties can’t simultaneously win all items).  
  - Cash transfers assume points are linear in value (may not hold).  

  ---

  ### Worked Examples  
  #### Case 1: Design Studio (Founders A and B)  
  **Items & Points:**  
  - Founder A’s valuations: Cash (30), Client list (40), Studio name (20), Non-compete (-10), Disagreement (\(d_A = 10\)).  
  - Founder B’s valuations: Cash (20), Client list (50), Studio name (10), Non-compete (-30), Disagreement (\(d_B = 40\)).  

  **Step 1: Initial Assignment (to higher bidder)**  
  - Cash: A (30 > 20) → **A**  
  - Client list: B (50 > 40) → **B**  
  - Studio name: A (20 > 10) → **A**  
  - Non-compete: A (-10 > -30) → **A**  
  - Utilities: \(u_A = 30 + 20 + (-10) = 40\), \(u_B = 50\).  

  **Step 2: Ideal Utilities**  
  - \(u_A^* = 30 + 40 + 20 = 90\) (sum of A’s positives).  
  - \(u_B^* = 20 + 50 + 10 = 80\) (sum of B’s positives).  

  **Step 3: Gains**  
  - \(G_A = 40 - 10 = 30\)  
  - \(G_B = 50 - 40 = 10\)  
  - \(M_A = 90 - 10 = 80\)  
  - \(M_B = 80 - 40 = 40\)  

  **Step 4: Cash Transfer**  
  \[
  c = \frac{30 \cdot 40 - 10 \cdot 80}{80 + 40} = \frac{1200 - 800}{120} = 3.33
  \]  
  - Transfer **$3.33k** from A to B (since \(c > 0\)).  

  **Final Allocation:**  
  - A gets cash ($X - 3.33k), studio name, non-compete.  
  - B gets client list, $3.33k.  

  #### Case 2: Siblings (A, B, C)  
  **Problem:** KS fails for **three parties** (no defined solution).  
  **Alternative Approach:**  
  1. Use intake points to run a multi-party auction (assign items to highest bidder).  
  2. Allow cash transfers to balance point discrepancies.  
  3. If no cash, mediate item-by-item (e.g., house sold and proceeds shared).  

  ---

  ### Limitations and Risks  
  1. **Fails for ≥3 Parties:** KS is undefined. Use auctions or traditional mediation.  
  2. **Requires Cash Transfers:**  
     - Without cash, unbalanced gains are likely (e.g., Case 1: A gains 30 points, B gains 10).  
     - Burden-heavy cases (e.g., care obligations) are prone to unfairness.  
  3. **Sensitive to "Worthless" Options:**  
     - Adding an item no one wants (e.g., a $0 liability) inflates \(u_A^*\) and \(u_B^*\), altering the outcome.  
  4. **Biased Toward Strong Fallbacks:**  
     - Parties with better disagreement points (e.g., Founder B’s job offer) receive larger gains.  
  5. **Judgment Calls:**  
     - "Ideal utilities" (\(u_A^*\), \(u_B^*\)) are theoretical and may misrepresent reality.  
     - Point assignments are subjective (e.g., "studio name: 20 vs. 10 points").  

  ### Recommendation  
  **Do not implement KS.** It is theoretically elegant but fragile in practice. Instead:  
  1. **For two-party cases with cash:** Use the **simplified procedure above** but verify cash availability first.  
  2. **For ≥3 parties or no cash:**  
     - Assign items to the highest bidder (using intake points).  
     - Sell assets if imbalances arise (e.g., house sold, cash divided).  
  3. **Train volunteers** to identify when arithmetic solutions fail (e.g., emotional items, power imbalances) and return to mediation.  

  **Rationale:** KS’s vulnerability to cash constraints, third parties, and artificial options outweighs its benefits of symmetry and scale invariance. Your current item-by-item mediation is more adaptable to real-world complexities.
