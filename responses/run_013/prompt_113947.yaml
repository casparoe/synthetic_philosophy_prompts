          They bid on the items (including avoiding the burden) by assigning points to each item and to the burden (the care obligation might be negative).
          Then we assign each item to the sibling who bids the most points for it. 
          If the care obligation is negative, then we interpret bidding points as the willingness to pay to avoid it? Or they bid negative points? We can ask them to assign positive points to not having the burden, and then assign the burden to the sibling who bids the least for avoiding it.

     But then we might have an imbalance in the points. We can try to equalize the points they spend. But with three parties, it's complex.

     Given the time, I think the best is to stick with the current item-by-item mediation.

     In summary, the procedure I described for two parties with cash might work if:

          (a) There is a cash component or the possibility of side payments.
          (b) The utilities are linear in cash and the point values are in the same units.

     But it is not the exact KS solution and has flaws.

     Therefore, I advise not to implement the proposal.

     What the procedure cannot do:

          1. Handle more than two parties.
          2. Handle cases without cash for side payments.
          3. Exactly achieve the KS solution in a discrete allocation problem.
          4. Be computed by hand in 20 minutes without a computer for more than a few items.

     And it may produce recommendations that are not feasible (if the cash transfer required is more than available).

     Given the above, I regret to say that the proposal is a mistake for your clinic.
