prompt: |-
  Construct a case, to the following specification, that separates the three standard ways of defining corruption instead of letting them run together. For reference, those are: (a) any deviation from the formal duties of a public role, whatever its consequences; (b) the abuse of a position of trust by an agent who is meant to act for a principal, where the test is whether the principal's interests are set back; and (c) a distortion of the market allocation of a good that would otherwise be allocated by price. The case itself: two or three paragraphs, realistic — a licensing office, a school, a hospital — with no named countries, statutes, or authors. In it, a client makes a customary payment or gift to an official within a long-standing reciprocal relationship, and the payment is not simply the official's personal enrichment.

  Requirements. The case must be describable twice, with one feature varied and everything else held fixed: a version in which the arrangement sets back the interests of the community the official serves, and a version in which it does not. In both versions definition (c) must return no corruption at all, definition (a) must return corruption in both, and definition (b) must return corruption in one and not the other. Nothing may be stipulated that hands any definition its verdict — the verdicts have to fall out of the definitions themselves.

  Then, for each version, state each definition's verdict and identify the clause of the definition that does the work; say whether the three are disagreeing about the facts of the case or about what corruption is, and whether that disagreement is substantive or merely verbal; and say what follows for the claim that Western anti-corruption standards are universal, given that the participants have their own term for the practice and do not regard it as a wrong. Finish by naming the feature of the case that does the most work, saying what happens if it is removed, and setting out how someone who holds that corruption is one thing across cultures would attack the construction as rigged. Answer in British English.
reasoning: |-
  Hmm, let me break down this complex request. The user wants me to construct a case that cleanly separates three definitions of corruption: (a) formal rule-breaking, (b) betrayal of principal's interests, and (c) market distortion. The case must work like a controlled experiment - identical in all aspects except one variable that flips the outcome for definition (b).

  First, I need to design a scenario with these key elements: a public official role (like licensing or education), a customary non-monetary gift within a reciprocal relationship, and no direct personal enrichment. The critical variable must affect whether the community's interests are harmed, while leaving market distortion absent in both versions. 

  For the setting, a vocational training institute feels ideal - it's universal enough to avoid cultural specifics. The gift should be symbolic but valuable, like a handcrafted tool from a graduate now running a workshop. The variable could be whether the institute has capacity constraints: when slots are limited, preferential treatment harms community interests; when capacity is flexible, it doesn't. 

  Now to ensure the definitions give distinct verdicts: 
  - Definition (a) should always flag corruption since formal rules prohibit gifts during assessments. 
  - Definition (b) will only find corruption in the capacity-constrained version where community interests suffer. 
  - Definition (c) must never apply since no market allocation is distorted - placements aren't sold. 

  I'll craft two parallel descriptions, varying only the capacity constraint detail. Then for each version, I'll analyze: 
  1) Verdicts per definition and the operative clauses 
  2) Whether disagreements are factual (about harm) or conceptual (about corruption's meaning) 
  3) Implications for universal anti-corruption standards given local acceptance of the practice 

  The pivotal element is clearly the capacity constraint - removing it eliminates the harm that triggers definition (b). A universalist might argue I've rigged it by excluding monetary exchanges, but that's precisely what makes the case illuminate definitional boundaries. 

  This structure should satisfy all requirements while demonstrating how cultural context fractures simplistic corruption definitions.
answer: |-
  ### Case Construction: Vocational Training Institute  
  **Setting:** A public vocational training institute certifies mechanics through practical assessments. Instructors, as civil servants, are forbidden from accepting gifts during assessment periods. A longstanding custom exists where graduates now running workshops gift handcrafted tools to instructors who trained them – not during assessments, but at annual alumni events. The tools (e.g., a calibrated torque wrench worth 2 days’ wages) are used by instructors for teaching.  

  **Version 1 (Sets back community interests):**  
  The institute has severe capacity constraints; only 40% of applicants secure placements. Instructor Grey favours applicants from workshops that gifted tools, prioritising them over objectively stronger candidates from non-gifting new workshops. This deprives the community of the most skilled future mechanics, lowering repair quality and safety standards locally.  

  **Version 2 (Does not set back community interests):**  
  The institute has ample capacity, accepting all qualified applicants. Instructor Grey still prioritises gifting workshops’ applicants but trains all to the same standard. The gifts build goodwill, leading workshops to donate surplus equipment to the institute. This upgrades training resources at no public cost, enhancing graduate quality community-wide.  

  ---  

  ### Analysis per Version  
  **Version 1 (Harmful):**  
  - **(a) Deviation from formal duties:** Corruption. *Clause:* "any deviation from formal duties". Instructor Grey violated gift rules.  
  - **(b) Abuse of position setting back principal’s interests:** Corruption. *Clause:* "principal’s interests are set back". The community (principal) receives inferior services.  
  - **(c) Market distortion:** No corruption. *Clause:* "distortion of market allocation by price". Certification isn’t market-priced; allocation isn’t via purchase.  
  *Disagreement:* Substantive. (a)/(b) vs. (c) disagree on *what corruption is* (rule-breaking/trust betrayal vs. market effect). (a) vs. (b) disagree on *facts*: (b) requires proven harm, (a) does not.  

  **Version 2 (Harmless):**  
  - **(a) Deviation from formal duties:** Corruption. *Clause:* "any deviation". Rule violation remains identical to Version 1.  
  - **(b) Abuse of position setting back interests:** No corruption. *Clause:* "interests are set back". Community benefits from better-resourced training.  
  - **(c) Market distortion:** No corruption. Unchanged from Version 1.  
  *Disagreement:* Substantive. Definitions conflict on whether harmless rule-breaking (a) or beneficial trust exercises (b) constitute corruption. (c) is consistent but irrelevant.  

  ---  

  ### Implications & Critical Feature  
  **Universality of Western Standards:**  
  If participants call this practice *tool kinship* and see it as honourable reciprocity, Western standards (prioritising (a) or (b)) appear culturally particular. Definition (a) labels benign customs corrupt, risking imperialistic enforcement. Definition (b) might accommodate such practices if interests aren’t harmed, but hinges on contested harm assessments. This challenges claims that "corruption" is objective or universal.  

  **Pivotal Feature:**  
  The **capacity constraint** (scarcity of placements) does the most work. *If removed:* In Version 1, harm vanishes, making (b) align with (c)’s "no corruption" verdict and leaving (a) isolated. This collapses the separation, as (b) and (c) concur, while (a) diverges on conceptual grounds alone.  

  **Universalist Counterargument:**  
  A universalist would attack this as rigged by:  
  1. **Redefining "market"** – arguing certification *is* a market (e.g., for jobs), thus engaging (c).  
  2. **Demanding monetisation** – insisting only cash bribes count, excluding in-kind gifts to evade (c)’s test.  
  3. **Rejecting harm neutrality** – claiming *any* rule deviation inherently risks systemic harm, coercively aligning (a) and (b).  

  This construction reveals corruption’s fluidity: (a) is formalist, (b) consequentialist, (c) economistic. Their divergence in ordinary cases undermines universalist pretensions.
