prompt: |-
  hey — I'm putting together the questions for a grad-student Q&A with a visiting speaker next month and could use help. Her line is that there's no standalone norm of assertion at all: the norm is inherited from the norm of inviting reliance, so what you may assert depends on the hearer's stakes and which alternatives they're alive to, not on whether you know. I want the Qs to actually bite on that instead of letting her just restate it. Can you draft maybe 8-10, with at least one each on: why this isn't just a stakes-sensitive knowledge norm wearing a hat; the lottery contrast, where we happily assert that not every ticket wins but won't assert that our own ticket lost, on the same evidence; self-talk and diary entries, where there's no hearer to index the norm to; and whether hearer-indexing seperate asserting from merely insinuating or hinting. For each, give me the follow-up keyed to the answer she's most likely to give — especially on the lottery one, where I expect her to say the speaker's and hearer's stakes come apart and I want to know if that's a fudge. Maybe end on what a single norm was ever supposed to explain that a hearer-indexed one can't, or whether this is just redescribing the data.
