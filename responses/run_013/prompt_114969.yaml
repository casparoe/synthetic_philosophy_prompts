  - **Lamp (on/off)**: Indeterminate because the state oscillates with no limit; no underlying continuous quantity converges.
  - **Vase (balls)**: Determinate empty because each ball's absence is resolved at a finite step (ball n is removed by step n), so the set is empty at the limit.
  - **Ball (position)**: Determinate at the wall because the position converges continuously to the wall.
  - **Specification (extra instruction)**: Incoherent because it attempts an action "after" completion, which is undefined.

  The common rule is:
  - If a supertask involves a convergent underlying continuous quantity (e.g., position, angle), the end state is determinate based on the limit value of that quantity.
  - If the supertask resolves individual components (e.g., balls in a vase) at finite stages, the end state is determinate based on the collective outcome of those resolutions.
  - If the state oscillates without convergence (no limit or no underlying quantity), the end state is indeterminate.
  - Any specification of an action "after" the supertask is incoherent.

  This rule fits all four verdicts equally well and emphasizes that determinacy arises from convergence or finite resolution, not from the limit of the state sequence itself.

