prompt: |-
  I'm taking a philosophy of biology seminar this term, and we have spent the last three weeks on the units-of-selection debate — whether selection is best understood as acting on genes, on organisms, or on groups — and I have reached the point where I can follow each week's argument closely and still not say what any of them is supposed to establish. Before I read further, I would like the specification. What, exactly, must a theory of the unit of selection deliver in order to count as adequate? I do not want a survey of who holds what; I want the list of requirements, each one paired with the case or consideration that makes it a requirement rather than a preference of one camp. My hope is that a sufficiently good list will do the adjudicating for me, because I keep finding that I can only tell whether an argument succeeds once I already know what it was meant to explain.

  So, please: the cases the theory has to get right, with its verdict owed on each — a sterile worker whose own fitness is nil while its colony thrives; a meiotic driver that spreads through a population while making its bearers worse off; a gene that proliferates by damaging its host, whether that is a transposable element or the conflict between maternally and paternally imprinted loci; a trait that looks like restraint in the use of a shared resource, where the benefit lands on neighbours; and the major transitions, in which what was a population of individuals becomes a single individual — I take it a theory that cannot say what changes when that happens is missing something important. Then the distinctions it must not collapse: being selected of versus being selected for; selection versus mere sorting or drift at the group level; the unit of selection versus the unit of adaptation versus the unit of evolutionary individuality; and altruism versus mutualism, including the behaviours whose classification flips depending on whether fitness is measured in absolute terms or relative to one's groupmates. Then the results it cannot contradict: that there is an exact bookkeeping identity — the Price equation — into which any within-group and between-group contributions can be decomposed no matter what is causally going on; that the standard relatedness-weighted condition for the evolution of altruism, the rb > c inequality, can be derived in both the individual-level and the group-level accounting; and that in a great many models the two accountings are formally equivalent, so that any claim that they predict differently needs to be stated with some care. For each requirement, mark whether it is a genuine constraint or a commitment of one camp, and flag any pair that I should not expect to be jointly satisfied — my own suspicion is that a theory cannot both identify the unit of selection in the singular and accommodate the transitions in individuality in which that unit changes, and likewise that it cannot insist kin selection and group selection are distinct mechanisms while also holding that they never disagree about anything. Tell me whether I am right about those, and whether there are other pairs of the same kind.

  To fix the purpose: I want a specification strong enough to settle, for any given trait, what the unit of selection is and why, and to arbitrate the argument two of my classmates keep having — one says the whole debate is bookkeeping, since any group-selection claim can be rewritten gene by gene and therefore adds nothing, while the other says the gene's-eye view is empirically empty because it can redescribe any outcome after the fact. If one requirement does most of the work of excluding the popular theories, say which, but I do not need a full scorecard; the criteria are what I am after. A page and a half or two, in whatever order makes the dependencies clear — where one requirement only makes sense once another is in place, I would rather see them ordered that way than grouped by topic.
reasoning: |-
  Okay, let me start by unpacking the user's request. They're in a philosophy of biology seminar focused on the units-of-selection debate. They've spent three weeks on it but feel lost about what each argument is supposed to establish. They want a clear list of requirements for an adequate theory, not just surveys of existing positions. 

  First, I need to identify their main pain points. They mentioned specific cases like sterile workers, meiotic drivers, transposable elements, group restraint traits, and major transitions. They also want distinctions like selected of vs. for, selection vs. sorting, and units of selection vs. adaptation. Plus, they pointed out results like the Price equation, rb > c condition, and model equivalences. Their deeper need seems to be a framework to evaluate theories objectively, avoiding circular reasoning where understanding an argument depends on already knowing its conclusion.

  The user suspects conflicts, like singular units vs. transitions in individuality, and kin vs. group selection being distinct mechanisms yet not disagreeing. I should validate these and check for others. They also want to resolve their classmates' debate about bookkeeping vs. empirical emptiness of gene-centric views.

  Breaking down the requirements: First, the theory must explain specific cases correctly. Each case tests different aspects. Sterile workers challenge individual fitness; meiotic drivers test selection levels; transposable elements highlight gene-level selection; group restraint involves altruism; major transitions need defining evolutionary individuals. Each case is a constraint because ignoring them leads to incomplete theories.

  Next, distinctions are crucial. Selected of vs. for prevents category errors. Selection vs. sorting distinguishes real group selection from drift. Units of selection vs. adaptation clarify causality. Altruism vs. mutualism depends on fitness metrics—absolute or relative. These distinctions are constraints to avoid conceptual confusion.

  Theoretical constraints like the Price equation and rb > c derivations are non-negotiable. Formal equivalence of models means theories mustn't contradict these. The user’s suspicions about conflicts need addressing. Can a theory have a singular unit and handle transitions? Probably not without redefining units contextually. Kin and group selection as distinct mechanisms yet equivalent in predictions might be incompatible if distinctness implies different outcomes, but models show they’re often interchangeable.

  Other conflicts: Emphasizing causality might clash with formal equivalences, and defining units rigidly could miss multi-level selection. The adjudication part should show that no popular theory meets all constraints, with gene-centric views struggling on transitions and altruism, while group selection may overapply. The classmates' debate: Gene-centric can be non-empty if causal, and group selection isn't just bookkeeping if groups are real interactors. The key is causal adequacy—explaining how selection acts, not just outcomes.
answer: |-
  Here is a specification for an adequate theory of the unit of selection, derived from the constraints and distinctions you outlined. Requirements are genuine constraints (C) if violating them demonstrably misrepresents evolutionary processes or established results; they are camp-specific commitments (S) if they stem from a particular theoretical stance without broader grounding. Conflicts are flagged.

  ### I. Explanatory Adequacy: Must Get These Cases Right (All C)
  1.  **Sterile Workers (e.g., Eusocial Insects):**
      *   *Requirement:* Explain how a trait conferring **zero direct fitness** to the bearer (worker sterility) can evolve and be maintained.
      *   *Constraint Source:* Observed biological reality. A theory failing this cannot explain widespread altruism.
      *   *Verdict Owed:* Selection *for* worker sterility acts *on* the colony (or kin group), *of* which the sterile worker is a part. The *focal entity* whose reproduction is enhanced is the colony.

  2.  **Meiotic Drive (e.g., Segregation Distorter Genes):**
      *   *Requirement:* Explain how a genetic element can spread through a population **despite reducing the fitness of the organisms carrying it**.
      *   *Constraint Source:* Empirical genetic phenomena. A theory must accommodate selection acting within organisms against organismal interests.
      *   *Verdict Owed:* Selection *for* the drive allele acts *on* the gene (or allele) itself *within the meiotic/gametic arena*, *of* the organism. The organism is the *vehicle* or *interactor*, but not the unit *selected for* in this case.

  3.  **"Selfish" Genetic Elements (e.g., Transposons, Imprinting Conflicts):**
      *   *Requirement:* Explain how genetic elements can proliferate **by directly harming their host genome/organism** (e.g., causing mutations, disrupting development via imprinting wars).
      *   *Constraint Source:* Molecular and genomic biology. Demonstrates selection acting at a sub-organismal level.
      *   *Verdict Owed:* Selection *for* the selfish element acts *on* the gene (or genetic element) *within the cellular/genomic environment*, *of* the organism/cell. Similar logic to meiotic drive.

  4.  **Apparent Group Restraint (e.g., Prudent Predation, Resource Conservation):**
      *   *Requirement:* Distinguish whether a trait reducing individual reproductive output (e.g., lower predation rate) evolves **because it benefits the individual** (e.g., avoiding overexploiting its *own* future resource base) or **because it benefits the group** (e.g., preventing global resource collapse that harms all).
      *   *Constraint Source:* Need to correctly identify the causal level of selection driving trait evolution (individual advantage vs. group advantage).
      *   *Verdict Owed:* Depends on the specific model/causality. *If* benefit is purely group-level (prevents global collapse harming all indiscriminately) *and* individual restraint is costly without within-group advantage, then selection *for* restraint acts *on* the group. Otherwise, it's individual selection.

  5.  **Major Transitions in Individuality (e.g., Prokaryotes to Eukaryotes, Solitary to Eusocial Insects, Cells to Multicellular Organisms):**
      *   *Requirement:* Explain **what changes** during the transition such that a group of former "individuals" becomes a new, higher-level evolutionary individual.
      *   *Constraint Source:* Macroevolutionary pattern. A theory ignoring transitions or unable to define the shift is incomplete.
      *   *Verdict Owed:* The unit of selection (specifically, the primary *focal unit of reproduction and heritable variation*) shifts from the lower-level entities (genes, cells, organisms) to the new collective entity. Key changes involve the evolution of mechanisms suppressing within-group conflict (e.g., uniclonal origin, germ-soma separation, policing) and aligning the fitness of lower-level parts with the fitness of the collective.

  ### II. Conceptual Distinctions: Must Not Collapse (All C)
  6.  **Selected *of* vs. Selected *for*:**
      *   *Requirement:* Distinguish the entity that *changes in frequency* (selected *of*) from the specific trait or property *causing* that change (selected *for*). (Sober, 1984).
      *   *Constraint Source:* Causal reasoning. Confusing property (trait) with entity (gene, organism, group) leads to category errors. A gene is selected *of*; altruism (a trait) is selected *for* (potentially due to group selection).

  7.  **Selection vs. Sorting/Drift:**
      *   *Requirement:* Distinguish changes in group frequency due to **differential group survival/reproduction based on group properties** (group selection) from changes due to **differential individual survival/reproduction within groups** (individual selection causing group "sorting") or **random processes** (group drift).
      *   *Constraint Source:* Causal attribution. Attributing sorting/drift to selection misidentifies the mechanism.

  8.  **Unit of Selection vs. Unit of Adaptation vs. Unit of Evolutionary Individuality:**
      *   *Requirement:* Acknowledge these are related but distinct concepts.
          *   *Unit of Selection:* The entity whose differential reproduction drives evolutionary change *in a specific context* (can be hierarchical: gene, cell, organism, group).
          *   *Unit of Adaptation:* The entity that exhibits complex functional design for a purpose (typically organisms or higher-level individuals).
          *   *Unit of Evolutionary Individuality:* The entity that functions as a cohesive whole in evolution, characterized by mechanisms minimizing internal conflict, having a single fitness, and being the primary target of selection post-transition.
      *   *Constraint Source:* Conceptual clarity. Confusing them leads to over/under-ascribing agency or adaptation.

  9.  **Altruism vs. Mutualism:**
      *   *Requirement:* Classify a behavior based on its fitness consequences **in the relevant selective context**. Crucially, recognize that a behavior can be altruistic (costly to self, beneficial to others) **within a group** but mutually beneficial **relative to the population mean** if groups vary. The classification depends on the chosen fitness benchmark.
      *   *Constraint Source:* Precise definition of evolutionary altruism (cost in absolute fitness) and its distinction from mutual benefit/cooperation. Misclassification obscures the selective pressure.

  ### III. Theoretical Constraints: Must Be Consistent With (All C)
  10. **The Price Equation:**
      *   *Requirement:* Acknowledge that the total change in any trait can be mathematically partitioned into a component due to average fitness differences *between groups* and a component due to average fitness differences and transmission *within groups*, **regardless of the causal mechanism**.
      *   *Constraint Source:* Mathematical identity (bookkeeping). A theory cannot contradict algebra. It *can* argue about which partition best captures the *causal process*.

  11. **Derivability of Hamilton's Rule (rb > c):**
      *   *Requirement:* Accept that the condition for altruism to evolve (rb > c) can be derived rigorously **both** from an individual/kin selection perspective (focusing on relatedness and individual costs/benefits) **and** from a group selection perspective (focusing on within-group disadvantage vs. between-group advantage).
      *   *Constraint Source:* Formal equivalence of models. Demonstrates that kin and group selection are often different perspectives on the same process, not inherently different mechanisms.

  12. **Formal Equivalence of Many Models:**
      *   *Requirement:* Accept that for a vast range of models (especially those involving structured populations with limited dispersal), the predictions of "gene's-eye view", "individual selection with kin effects", and "group selection" models are **formally equivalent**. Claims that one perspective predicts differently require demonstrating a specific model where they genuinely diverge.
      *   *Constraint Source:* Mathematical modeling results. Highlights that disagreements often stem from conceptual framing or causal emphasis, not fundamental mathematical incompatibility.

  ### IV. Conflicts & Adjudication
  *   **Your Suspicions Confirmed:**
      *   **Singular Unit vs. Transitions (C):** A theory insisting on a *single, universal* unit of selection (e.g., *only* the gene, *only* the organism) **cannot** adequately accommodate major transitions where the primary focal unit demonstrably shifts. This is a genuine constraint against strict monism. Theories must allow for hierarchical or contextual units.
      *   **Distinct Kin/Group Mechanisms vs. Never Disagree (C):** Insisting kin selection and group selection are *distinct causal mechanisms* **is incompatible** with the constraint (C11, C12) that their core models are formally equivalent and never predict different outcomes in standard scenarios. Framing them as distinct *perspectives* or *ways of partitioning* selection is viable; claiming they are different mechanisms requiring different evolutionary forces is not supported by the models and contradicts C11/C12.

  *   **Other Potential Conflicts:**
      *   **Emphasis on Causality vs. Formal Equivalence (C):** A strong requirement to identify the *causal interactor* (e.g., the entity directly interacting with the environment) might push towards multi-level selection or individual+group views, while acknowledging the formal equivalence (C12) shows gene-centric views can track outcomes. The constraint is that causality must be addressed *somehow*, not that one view monopolizes it.
      *   **Unit of Selection as "Reproducer" vs. "Interactor" (S):** Defining the unit strictly as the entity that replicates/reproduces (gene) vs. the entity that interacts with the environment (organism/group) reflects a camp-specific commitment (S). An adequate theory needs to incorporate both aspects (replication *and* interaction), but the emphasis can differ.

  ### V. Adjudication & Purpose
  *   **Settling for a Trait:** An adequate theory must:
      1.  Identify the relevant **focal entities** at different hierarchical levels (genes, cells, organisms, groups).
      2.  Specify the **selective arena(s)** (where differential reproduction occurs - e.g., within genome, within group, between groups).
      3.  Analyze the **causal pathways**: Does the trait change the fitness of the focal entity directly? Or indirectly via changing the fitness of entities at another level? What does the Price partition reveal about between vs. within group effects?
      4.  Determine the **level at which the trait is *selected for*** by identifying the causal pathway linking the trait to the differential reproduction of the focal entity.
  *   **Resolving the Classmates' Debate:**
      *   **Against "Just Bookkeeping":** While *outcomes* can be described gene-by-gene (C10), this doesn't mean the *causal process* is always best understood at that level. If groups are real interactors whose properties (e.g., frequency of altruists) directly cause differential group extinction (C4, C7), then group selection identifies a real causal level. C12's equivalence doesn't erase causal reality; it shows different valid descriptions exist.
      *   **Against "Empirically Empty" Gene's-Eye View:** The gene's-eye view is *not* empty if it makes specific, testable predictions about **genetic conflicts** (C2, C3) that other perspectives might overlook. Its power lies in explaining intra-genomic and intra-organismal conflicts. However, it becomes vacuous *only* if used *post hoc* to redescribe *any* outcome without providing unique causal insights or testable predictions beyond other levels. Its adequacy hinges on whether it illuminates mechanisms (e.g., meiotic drive) better than alternative framings.

  **The Most Excluding Requirement:** The necessity to **accommodate major transitions in individuality (C5)** is arguably the hardest constraint for strictly gene-centric or strictly organism-centric views. Gene-centric views struggle to explain the *emergence of new levels of reproduction and individuality* where the gene is no longer the primary focal unit. Strict organism-centric views struggle with the pre-transition state and the shift itself. This pushes strongly towards hierarchical or multi-level selection theories that explicitly model how new units of selection evolve.

  This specification highlights that an adequate theory must be pluralistic (allowing different units in different contexts), hierarchical, causally precise (distinguishing levels of interaction and replication), mathematically coherent (respecting Price, Hamilton), and grounded in empirical biological cases. No popular monolithic theory (gene-only, organism-only, group-only) satisfies all constraints without significant qualification or contextualization. The debate often hinges on *causal emphasis* and *explanatory priority* within these shared constraints, not fundamental incompatibility with the core biology or math.
