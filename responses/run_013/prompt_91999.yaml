answer: |-
  Here’s a six-minute speech addressing all your requirements—honoring "worst-off first," clarifying its commitments, acknowledging trade-offs, answering the literacy program case, and confronting the leveling-down objection head-on:

  ---

  **(1:00 – Warmth & Purpose)**  
  "Friends, colleagues, partners, and the Halstead family—thank you. Twenty-five years is a milestone built on trust, generosity, and the quiet labor of hope. Tonight isn’t just about looking back; it’s about leaning into our purpose with clear eyes. Two months ago, we committed every discretionary dollar to a single rule: **worst-off first**. Not as a slogan, but as a compass.  

  **(1:30 – What "Worst-Off First" Means (And Doesn’t))**  
  What does that mean? It means we ask: *Who faces the steepest climb? Who’s been overlooked the longest?* We aim our resources there, not because others don’t deserve support, but because the depth of need demands it.  
  But let’s be equally clear about what this rule *isn’t*:  
  - **It is NOT about stopping anyone’s progress.** Helping the worst-off doesn’t mean hindering others. If a program lifts everyone—we celebrate that. But if we must choose, we choose the left behind.  
  - **It is NOT about "equality" at all costs.** Our chair’s statement—that she’d *"rather everyone improve a little less than watch the gap widen"*—was bracing. Let me unpack it.  

  **(1:30 – Confronting Leveling-Down Plainly)**  
  Some worry this invites "leveling-down"—the idea that we’d make things *worse* for some just to narrow a gap. **We reject that.** We will never sabotage success to manufacture equality. That would betray our mission.  
  What we *are* saying is: **When resources are finite, we prioritize urgency.** We forgo good opportunities elsewhere to target crisis. If two programs need funding—one that lifts all boats but widens gaps, and one that rescues those drowning—we choose the rescue. Not to punish achievers, but because the drowning have no time.  

  **(1:00 – The Literacy Program Case)**  
  Take the literacy program circulating tonight—a good program that lifts every child, but lifts high-achievers furthest. **We’d likely decline it under our new rule.** Why? Because our dollars must chase the most acute need. If another proposal targets children who can’t read a single word—children this program wouldn’t reach—they come first.  
  This isn’t indifference to universal progress. It’s focus. We trust *other* funders will support broad-based gains. Our lane is the cliff’s edge.  

  **(0:30 – The Restricted Fund: Honoring Limits)**  
  And yes—Halstead’s largest fund is restricted by our founder to serve middle-income families. We honor that intent absolutely. That work continues. But tonight’s pledge is about *our discretionary dollars*. Here, we choose: **fund comfort, or fund survival?** We choose survival.  

  **(0:50 – The Trade-Off & Our Conviction)**  
  This path demands trade-offs. We forgo funding worthy, popular programs that spread benefit widely. That’s painful. But our duty isn’t to popularity—it’s to integrity.  
  To donors: Your money isn’t holding anyone back. It’s racing toward those held back *by everything else*.  
  To community partners: We hear you. "Worst-off first" won’t be a shield for the status quo. We’ll seek new voices, measure impact ruthlessly, and fund courageously.  

  **(0:30 – Closing Resolve)**  
  Twenty-five years ago, this fund began with a belief: that targeted generosity can tip the scales. Tonight, we sharpen that belief. Not to divide, but to heal. Not to lower ceilings, but to raise floors.  
  We choose worst-off first because a chain is only as strong as its weakest link—and a community, only as just as its most vulnerable. Let’s build that community. Together."  

  ---

  **Key Tactics Explained:**  
  - **Leveling-Down Answer:** Directly names and rejects it ("We will never sabotage success"). Anchors the rule in *priority*, not envy or forced equality.  
  - **Literacy Program:** Uses it to illustrate the *cost* of the rule ("We’d likely decline") while justifying the choice morally ("children who can’t read a single word").  
  - **Chair’s Controversial Line:** Reframes it as about *urgency* ("the drowning have no time"), distancing it from leveling-down.  
  - **Restricted Fund:** Neutralizes tension by separating it from discretionary choices ("We honor that intent absolutely... Our lane is the cliff’s edge").  
  - **Tone:** Resolute but humble. Acknowledges trade-offs ("painful," "we forgo") to build credibility.  
  - **Audience Focus:** Reassures donors ("Your money isn’t holding anyone back") and partners ("We hear you... won’t be a shield") in their own language.  

  This turns philosophical tension into moral clarity, making the case that "worst-off first" isn’t equality—it’s lifeguarding.
