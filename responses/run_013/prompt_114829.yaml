  Okay, let me think through this query carefully. The user is a retired chemist leading a philosophy group for fellow scientists/engineers, preparing a 75-minute session on Epicurus' "death is nothing to us" argument. They want pedagogical advice, not content explanation.

  Hmm, key constraints stand out: participants are sharp but philosophy-naive, impatient with word games, need concrete framing. The user already suspects they must establish "life measured against possible alternatives" as foundation - I agree that's essential. Their symmetry idea (pre-birth vs post-death) is strong but risks feeling gimmicky if mishandled.

  First, I should map the core conceptual scaffolding needed before Epicurus makes sense. The whiteboard needs:
  - Clear harm definition: "Badness as deprivation of possible goods" (not experiential pain)
  - Counterfactual framework: "What could've happened?" as measurable baseline
  - Non-identity of subject: Dead person ≠ living person (avoids "who experiences it?" trap)

  For the central example... the symmetry argument works if grounded properly. Need to highlight what it shares with the deprivation account (counterfactual continuity) and what it lacks (doesn't address premature death). Maybe show both approaches? But time is tight... stick with symmetry but explicitly note its limits.

  Anticipating misconceptions:
  1. "Epicurus is just comforting us" - head off early by stressing his materialist metaphysics
  2. "Bad must be felt" - dismantle immediately with "prevented vacation" analogy
  3. "Only applies if you're old/tired" - counter with "healthy person hit by bus" scenario

  The "when does badness happen" question is crucial. Should address directly: harm is retrospective from hypothetical observer perspective. Use "medical trial" analogy - badness isn't an event timestamp.

  Closing question to test understanding: "Why isn't permanent coma equivalent to death?" If they grasp deprivation vs experience, they'll see the difference.

  Flatly refuse: personal afterlife beliefs - say upfront this is about earthly existence. Also avoid "non-existence" ontology debates. Declare boundaries explicitly: "We're only evaluating Epicurus' logic within his framework."

  Timing breakdown: 30min setup, 25min symmetry argument, 15min Q&A, 5min closing. Whiteboard evolves from definitions to argument to objections.

