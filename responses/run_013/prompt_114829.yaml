answer: |-
  Here’s a battle-tested plan for your session, optimized for skeptical scientists. I’ll map it to your whiteboard, timing, and pitfalls. **Core insight: Frame this as a problem of counterfactuals and harm-as-deprivation.** No word games—anchor everything in concrete reasoning.

  ### **Whiteboard Setup (First 15 mins)**  
  *What must be defined before Epicurus makes sense:*  
  1. **"Bad for you" = Deprivation of possible goods** (not pain/experience).  
     *Example:* "Failing to get a promotion isn’t painful—it’s bad because you *miss out* on the salary/job."  
  2. **Harm requires a subject who is deprived** (draw timeline):  
     ```  
     Past ―――[YOU]――― Death ――― Future  
     ```  
     *Key Q:* "Can ‘YOU’ exist when death does? If not, who is harmed?"  
  3. **Counterfactual baseline:** "To say death is bad, compare actual life (cut short) to *possible longer life*."  

  **→ Start here:** Scientists grok counterfactuals (e.g., "control group" in experiments). If death deprives you of goods, we need a "what if" scenario.

  ---

  ### **The Single Example: "Symmetry Argument" (25 mins)**  
  *Use it—but show its limits. It’s a gateway, not the core.*  
  **Your plan:** Compare pre-birth non-existence to post-death non-existence.  
  - **Why it works:** It’s visceral. Ask: "Do you regret the time before you were born? No? Why regret time after death?"  
  - **What it lacks:** Doesn’t address *premature* death. A 20-year-old’s death *feels* worse than a 90-year-old’s because of lost potential.  
  - **Whiteboard viz:**  
    ```  
    Non-existence ――[BIRTH]―― Life ――[DEATH]―― Non-existence  
    ```  
  **→ Stress:** This argues "no subject to experience harm," but Epicurus’ deeper point is about **deprivation**. Symmetry sets up the puzzle; deprivation solves it.

  ---

  ### **Misconceptions & When to Crush Them (Order of Appearance)**  
  1. **"This is just therapy/comfort"** (Will surface early).  
     *Shut down at 20 mins:* "Epicurus isn’t saying ‘don’t fear death’ to soothe you. He’s arguing it’s *logically incoherent* to call death bad *for the dead person*. Like claiming a square circle harms geometry."  

  2. **"Bad = something you experience"** (Will arise during symmetry discussion).  
     *Crush immediately:* Use the **"prevented vacation" analogy**:  
     *"If a landslide blocks your road to Tahiti, the badness isn’t in the landslide—it’s in missing the trip. You don’t ‘feel’ the absence. Death is the ultimate landslide."*  

  3. **"Only works if you’re tired of living"** (Likely during Q&A).  
     *Preempt at 40 mins:* "Epicurus agrees longer life *could* be good! But once dead, *you* don’t exist to lose out. The ‘badness’ is like blaming a cancelled concert on the band’s nonexistence."  

  ---

  ### **"When does the badness happen?" (Park it Smartly)**  
  *Someone WILL ask this.*  
  - **Do NOT dive into metaphysics of time.** Say:  
    > *"Great question—but let’s reframe. We’re not looking for a moment when death ‘stings’ you. We’re asking if death deprives you of goods. Think of it like a medical trial: If Group A gets the drug and lives, Group B (no drug) is harmed by deprivation—but not at a specific time."*  
  - **Park it:** "Write that down—we’ll loop back if time allows." (Often they’ll answer it themselves later).

  ---

  ### **Closing Question to Test Understanding**  
  *Don’t ask "Do you agree?" Ask this:*  
  > **"If a healthy 30-year-old dies painlessly in their sleep, is their death bad *for them*? Why can’t we say they’re ‘missing out’?"**  
  - **What you want:** They should grapple with the *subject problem* ("Who is the ‘them’ that misses out?"). If they say "Yes, it’s bad—they lost decades of life," probe: "But does a corpse experience loss?"  

  ---

  ### **Refuse to Engage (Say This Upfront!)**  
  *Declare boundaries:*  
  > *"We’re evaluating Epicurus’ logic, not debating:  
  > - Afterlife beliefs (assume death = permanent end).  
  > - Grief or societal harm (focus: ‘bad for the DEAD person’).  
  > - Whether life has intrinsic value. We’re granting that more good life is better."*  

  ### **Timeline**  
  - **0-15 mins:** Whiteboard setup (definitions, timeline).  
  - **15-40 mins:** Symmetry argument → Deprivation account.  
  - **40-60 mins:** Objections & misconceptions.  
  - **60-75 mins:** Your closing question + open debate.  

  **Why scientists will bite:** This is applied modal logic (possible worlds) and harm-as-opportunity-cost. They’ll respect the rigor. **Avoid poetry—attack it like an erroneous hypothesis.** Your group’s lucky to have you.
