prompt: |-
  So I've started doing a monthly donation to a local food bank, and last week I caught myself bringing it up at dinner in a way that was definately not subtle, and it hit me that part of why I do it is that it makes me feel good and people seem impressed. A friend said that's just counterfeit virtue — it looks like the real thing, passes fine, but it's fake, and if you're doing good for the warm glow or the applause then it doesn't count morally. He's basically saying a good deed from a self-interested motive is like a counterfeit note: right on the surface, worthless underneath.

  I'd rather have this audited than just agreed with or shot down. Lay out the correspondence first — what plays the role of the genuine note, the counterfeit, the printing/engraving, the central bank or whoever assigns the value, the counterfeiter's intent to decieve, and the fact that a fake note can still buy real bread. Then tell me where the mapping breaks and which of those breaks actually matter for the conclusion he's using it to reach (that my donation has zero moral worth, that only deeds done from the right motive count). Some things I keep circling: counterfeit money is defined by an intent to deceive, but I'm not trying to fool anyone; money's value is assigned by an institution whereas moral worth presumably isn't; a counterfeit is worthless and even harmful, but my donation still feeds people, so can it really be worth nothing? Does the analogy quietly import an all-or-nothing, either-genuine-or-fake structure that moral worth might not have? And if the conclusion doesn't survive, what would be a better analogy for what I'm actually worried about — whether I get credit, or whether my motive is the right kind of thing, or something else entirely?

  Keep it under 600 words, lead with your verdict on whether the analogy holds, and give me the mapping as a table.
reasoning: |-
  Hmm, the user is grappling with a moral dilemma about their charitable donations. They started donating to a food bank but realized they might be doing it partly for the positive feelings and social approval it brings. Their friend called this "counterfeit virtue," comparing it to fake money that looks real but has no real value. The user wants me to audit this analogy thoroughly.

  Let me break this down. The user needs me to analyze the counterfeit money analogy for moral worth. They want me to map out the correspondence between the counterfeit money analogy and moral virtue, identify where the analogy breaks down, and determine if these breaks undermine the friend's conclusion that their donation has zero moral worth.

  The key elements of the analogy according to the friend are:
  - Genuine note = virtue from pure altruism
  - Counterfeit note = virtue from self-interest
  - Printing/engraving = the action itself (donating)
  - Central bank = some moral authority assigning value
  - Counterfeiter's intent = deliberate deception
  - Fake note buying bread = self-interested donation still helping people

  But this analogy has several critical flaws. First, counterfeit money requires intent to deceive, which the user isn't claiming to have - they were just not subtle about mentioning it. Second, money derives value from institutions while moral worth seems more intrinsic. Third, counterfeit money is worthless and harmful to the system, whereas a self-interested donation still feeds hungry people and has tangible benefits.

  The most significant break is the all-or-nothing framework. Money is either genuine or counterfeit, but moral motivation exists on a spectrum. People can have mixed motives - genuine concern for others combined with personal satisfaction. The friend's analogy fails to account for this complexity.

  The conclusion that the donation has "zero moral worth" doesn't hold because:
  1) The recipient still benefits regardless of motive
  2) Mixed motives are normal human psychology
  3) Moral worth isn't binary but graduated
  4) The action itself has objective value

  A better analogy might be alloyed gold - still valuable but not pure. Or perhaps renewable energy that serves both environmental and economic purposes. The user's underlying worry seems to be about authenticity of character rather than moral worth of the action.

  I should present this as a table showing the mappings and where they break, then explain which breaks invalidate the friend's conclusion. The verdict is clear: the analogy doesn't hold. The donation has real value, and moral motivation is more complex than the counterfeit comparison suggests.
answer: |-
  ### Verdict: The analogy **does not hold**. Your friend's conclusion (zero moral worth) is invalidated by critical breaks in the mapping.

  ### Correspondence Mapping Table

  | Counterfeit Money Element | Alleged Moral Virtue Equivalent | Does it Map? | Why it Breaks |
  |---------------------------|---------------------------------|--------------|--------------|
  | **Genuine Banknote** | Virtue arising *only* from pure altruism (duty/compassion) | Partially | Assumes "pure altruism" is the sole standard of moral worth, which is contested. |
  | **Counterfeit Banknote** | Virtue arising from self-interest (warm glow/social approval) | Weakly | Counterfeits require *intent to deceive*; you lacked this. Your motive isn't "fake," it's *mixed*. |
  | **Printing/Engraving (Physical Note)** | The charitable action itself (donating money/time) | Yes | The external act is observable in both cases. |
  | **Central Bank (Assigns Value)** | Moral Authority/Standard (e.g., Kantian duty, Divine command) | No | Money's value is *institutionally decreed & fungible*. Moral worth is debated, context-dependent, and not universally "assigned" by one source. |
  | **Counterfeiter's Intent** | Your alleged intent to *deceive others* about your virtue | **NO** | You weren't trying to pass off fake money. You lacked deceptive intent; you were just unsubtle. Motive wasn't deception, it was seeking validation. |
  | **Fake Note Buys Real Bread** | Your donation still feeds hungry people | Yes | The *consequence* (helping others) is real and good in both cases. |

  ### Why the Breaks Matter & Invalidate the Conclusion
  1.  **Intent to Deceive is Absent (Critical Break):** Counterfeiting is defined by fraudulent intent. You lacked this. Your motive (feeling good/validation) is self-interested but *not deceptive*. This breaks the core definition of "counterfeit." **This alone sinks the analogy for your case.**
  2.  **Moral Worth Isn't Assigned Like Currency (Critical Break):** Money is *only* valuable because an institution says so. Moral worth isn't decreed by a single authority; it's assessed based on complex factors like *intent, action, and consequence*. The analogy falsely imposes an all-or-nothing, institutionally-decreed value system onto morality, which doesn't work.
  3.  **The "Worthless/Harmful" Claim Fails:** Counterfeit money harms the system (devalues currency, funds crime). Your donation has **real, positive consequences** (food for people). To call it "worthless" morally ignores this tangible good. The analogy's claim that self-interest renders the good deed "worthless" is false – the bread is still real.
  4.  **All-or-Nothing Structure Doesn't Fit (Critical Break):** Money is either genuine or counterfeit. Moral motivation is almost always **mixed**. Feeling good about helping doesn't erase the help given, nor does pure altruism guarantee greater impact. The analogy forces a false binary (pure good vs. worthless fake) onto a spectrum of human motivation. **This break directly invalidates the conclusion of "zero moral worth."** Your donation has *some* moral worth due to its positive outcome, even if the motive isn't pure.

  ### A Better Analogy & Your Underlying Worry
  The counterfeit analogy fails because it focuses on deception and binary worth. Your worry is about **authenticity and moral credit**, not fraud.

  *   **Better Analogy: Alloyed Gold.** Pure gold (pure altruism) is highly valued. But gold alloyed with other metals (self-interest mixed with altruism) is still valuable, functional, and real. It's just not 24-karat. The value isn't *zero*; it's *less pure*, but the object (the good done) still exists.
  *   **What You're Actually Worried About:** You're concerned whether your *character* is authentically virtuous ("Do I *deserve* credit?") and whether the *primary driver* of your action aligns with your values ("Am I doing this *mainly* for others, or for myself?"). This is about **integrity and self-understanding**, not the counterfeit/fake dichotomy. The donation's *impact* is real; the question is about your *motivation* and how it reflects on you.

  **Conclusion:** Your donation has **real moral worth** because it helps people. Your motive *reduces* but **does not eliminate** its moral worth compared to pure altruism. The counterfeit analogy misdiagnoses the issue by framing it as deception and worthlessness. Focus instead on cultivating more authentic motives over time while recognizing the good you *are* doing.
