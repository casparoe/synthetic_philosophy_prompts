  I've spent most of my career on the polling and election-data beat — sampling frames, response rates, why an opt-in panel isn't a probability sample no matter how many people are in it, why the margin of error is doing less work than everyone assumes — and I've drifted into writing about science and ideas. Lately I've been circling the doomsday argument, the one where your birth rank among all humans who will ever live is supposed to be evidence that we're nearer the end than we'd otherwise think. It smells to me like the tank-serial-number trick (Allied analysts working out how many tanks the Germans were building from the serials on captured ones), except run on a single observation.

  So: do me a straight translation. Take the doomsday argument and restate it as faithfully as you can in the vocabulary I actually have — sampling frame, coverage error, random draws versus arbitrary draws, n=1, serial-number estimation, the reference population in a demographic projection. Don't quietly import polling assumptions and call that translation; if the argument needs something my vocabulary doesn't have, say so instead of fudging it.

  Then the residue report. What carries over cleanly (my guess is that "birth rank" is just a serial number and "reference class" is just a sampling frame, but tell me if that's too glib), what only fits with distortion, and what has no counterpart at all on my side. And the part I actually want: is the leftover a gap in how pollsters and data people think, or is it telling me the argument was never really doing sampling — that it stipulates a symmetry and calls it a procedure?

  Tell me how confident you are in each piece, and single out the one point you're least sure about.
