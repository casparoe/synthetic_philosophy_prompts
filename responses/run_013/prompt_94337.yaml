prompt: |-
  I cover biology for a science desk and for the last few months I've been sitting in on the taxonomy board at a natural history museum — the group that signs off on whether some population gets written up as its own species for the collection and for a couple of journals. I'm trying to get ahead of next month's docket and I keep guessing wrong about these people, so I want your read.

  Here's how they've been calling things lately. Two frog populations that meet in a narrow hybrid zone, stay obviously distinct, and breed in different ponds — split, two species. Two fish populations that look pretty different but share the same waters and melt into one big hybrid swarm wherever they overlap — kept as a single species. A parthenogenetic snail line that doesn't breed with anything else at all — recognized as a species. Two mouse populations on opposite sides of a mountain range that never meet, are near-identical geneticly, but live in completely different habitats — split, two species.

  Now the case in front of them. A little crustacean: two populations that share ponds and never interbreed, not even a little, but they're so similar you need a sequencer to tell them apart, and they make their living in exactly the same way in exactly the same water.

  Are they going to split it or keep it whole? I care less about the answer than about the rule they seem to be running, the other rules that would fit all four of their earlier calls just as well, which of those the crustacean actually pulls apart, and which rule you'd put money on. And tell me what would change your mind — what bit of evidence or argument would flip your bet — because I've been burned by this board before and I'd rather know where you're shaky.
reasoning: |-
  Okay, the user is a biology reporter covering a taxonomy board at a natural history museum. They've been observing how the board decides on species classifications and wants to predict their next decision on a crustacean case. They provided four previous cases and are puzzled by the board's seemingly inconsistent rulings. 

  First, I need to unpack the patterns from the four cases. The frogs were split because they maintain distinctness despite a hybrid zone. The fish were kept together because they form a hybrid swarm. The snail was recognized as a species due to reproductive isolation despite asexuality. The mice were split based on ecological differences despite genetic similarity. 

  Hmm... the common thread seems to be reproductive isolation as the core criterion, but with flexibility. The board prioritizes whether populations actually exchange genes in nature over strict genetic divergence or morphology. The ecological distinction for mice is interesting - that suggests they value evolutionary trajectory too. 

  For the crustacean case, two populations cohabiting without interbreeding is textbook reproductive isolation. But their extreme similarity makes it tricky. The user thinks this might break the pattern. Wait - no, actually it fits perfectly: no gene flow trumps everything else here. 

  The user's deeper need seems to be understanding the board's operational philosophy, not just this one call. They've been "burned before" by mispredicting, so they want the underlying framework. The "what evidence would flip your bet" question shows they're thinking like a scientist - testing hypotheses. 

  I should emphasize that sympatry without interbreeding is the gold standard for species recognition. The crustaceans are like two perfect strangers sharing an apartment but never talking. Their similarity might actually strengthen the case for splitting - if they're identical yet don't breed, that implies strong isolating mechanisms. 

  What would make me reconsider? If they found cryptic hybridization, or if the "same pond" claim was exaggerated (e.g., microhabitat partitioning). Or if the sequencer revealed this was recent artificial introduction rather than natural coevolution. 

  ...Actually, the board might hesitate if the genetic similarity suggests recent divergence. But given their mouse decision (split despite genetic identity), they clearly prioritize ecology/reproduction over raw DNA differences. I'd bet heavily on split.
answer: |-
  Based on the taxonomy board's recent decisions, they're clearly operating under a **modified Biological Species Concept (BSC) with strong emphasis on reproductive isolation in sympatry and ecological distinctness**, even when genetics or morphology are ambiguous. The crustacean case is a textbook example that *should* trigger a **split** under their pattern, but its extreme similarity makes it the ultimate test of their consistency. Here's the breakdown:

  ### The Board's Implicit Rulebook (Decoded)
  1.  **Reproductive Isolation in Sympatry is Paramount:** This is the strongest factor.
      *   *Frogs:* Distinct in sympatry (hybrid zone narrow) → **Split**.
      *   *Fish:* No isolation in sympatry (hybrid swarm) → **Lump**.
      *   *Crustacean:* Complete isolation in sympatry (no interbreeding) → *Predicts Split*.
  2.  **Reproductive Isolation Allopatry is Sufficient (with supporting evidence):** Isolation doesn't need testing if other factors show divergence.
      *   *Snail:* Absolute isolation (parthenogenesis) → **Split** (isolation is inherent).
      *   *Mice:* Allopatric + Strong Ecological Divergence → **Split** (implies isolation *would* occur if sympatric).
  3.  **Ecological Differentiation Can Trump Genetics:** Niche separation signals divergent evolution.
      *   *Mice:* Near-identical genetics BUT different habitats → **Split**.
      *   *Crustacean:* Identical ecology/niche → *This argues against a split, but...*
  4.  **Genetic/Morphological Divergence is Secondary Evidence:** Used to support, but not override, reproductive/ecological signals.
      *   *Frogs:* Morphologically/genetically distinct? (Implied by "obviously distinct") → Supported Split.
      *   *Fish:* Morphologically distinct? ("look pretty different") → BUT overruled by lack of isolation.
      *   *Snail:* Genetic distinctness implied by isolation → Supported Split.
      *   *Mice:* Genetic similarity → Overruled by ecology/allopatry.
      *   *Crustacean:* Extreme genetic/morphological similarity → *This argues against a split, BUT...*

  ### The Crustacean Crucible: Prediction & Why
  *   **Prediction: They will SPLIT it into two species.**
  *   **Why it Fits Their Pattern:** The **complete lack of interbreeding despite sharing the exact same ponds (sympatry)** is the single strongest factor in their recent decisions. This is *more* definitive evidence of reproductive isolation than the frogs (who have a hybrid zone) or the mice (who are allopatric). The board has shown they prioritize *actual* gene flow barriers over everything else when populations co-occur.
  *   **Why the Similarity Doesn't Matter (to their rule):** Their mouse decision proves genetics alone won't stop a split. The crustacean's ecological identity negates the "ecological divergence" argument used for the mice, but **sympatric reproductive isolation trumps ecological identity in this specific scenario** based on their precedence. The extreme similarity makes it a fascinating case of "cryptic species," but the lack of gene flow is the key.

  ### Where the Rule Gets Strained & What Could Flip the Bet
  The crustacean case exposes the tension between pure reproductive isolation (BSC) and other concepts (like Ecological or Evolutionary SC). Here's what could make the board *lump* them, flipping my prediction:

  1.  **Evidence of VERY Recent Sympatry:** If compelling evidence shows they only very recently came into contact (e.g., human introduction of one population within the last few generations), the board *might* argue isolation isn't evolutionarily "established" yet, treating them as nascent species or variants. (This challenges the "evolutionary independence" aspect).
  2.  **Proof of Current (Subtle) Hybridization:** If someone presents incredibly sensitive genetic data showing *rare* hybridization happening (e.g., a few F1 hybrids per generation), it breaks the "never interbreed, not even a little" claim. This would mirror the fish case – some gene flow exists. (Directly attacks the isolation evidence).
  3.  **Microhabitat Partitioning:** If someone convincingly argues they *aren't* truly sympatric – e.g., one lives exclusively in the upper water column and the other in the benthic mud of the *same* pond, using different micro-resources and never encountering each other. This reframes them as micro-allopatric with different niches, making their non-interbreeding less surprising and aligning them more with the *mice* (ecological divergence). (Challenges the sympatry premise).
  4.  **Overwhelming Genetic Identity & Shared Polymorphisms:** If the sequencing data shows *zero* fixed differences and identical haplotype networks across large portions of the genome, *combined with* arguments that the lack of interbreeding is due to a trivial, recent behavioral or temporal barrier (e.g., mating pheromone mutation last year), the board *might* see them as a single species in the very earliest stage of splitting. (Challenges the evolutionary significance of the isolation).

  ### Where I'm Shaky (and Why You Might Be Burned Again)
  *   **The Weight of Extreme Similarity:** This is the biggest wildcard. While their pattern prioritizes isolation, the *degree* of similarity here is unprecedented in the examples given. Some taxonomists find splitting morphologically/genetically identical entities philosophically uncomfortable, even with reproductive isolation. The board *might* balk at creating "sequence-only species."
  *   **The "Why Bother?" Factor:** If the populations are identical in every observable way *except* for whatever barrier prevents breeding, and that barrier has no discernible ecological consequence, some pragmatic taxonomists might argue splitting serves no practical purpose (identification, conservation) and prefer to wait for clearer divergence. This goes against pure BSC but happens.
  *   **Implicit Phylogenetic Signal:** The examples don't reveal if the board implicitly considers whether the entities are monophyletic. If the crustaceans form a single clade with no substructure, lumping becomes more defensible under a Phylogenetic SC, even with current isolation.

  **Put Your Money On:** **SPLIT.** The sympatry + zero interbreeding combo is the golden ticket under this board's recent rulings. The genetic similarity is remarkable but aligns with their willingness to ignore genetics when isolation/ecology are strong (as with the mice).

  **Watch For:** Any challenge to the absolute lack of interbreeding or the true sympatry. That's the linchpin. If a board member argues passionately about the "meaningless" similarity or questions the evolutionary significance of the barrier despite the isolation, prepare for a potential upset (lumping) or a very heated debate. They've shown they value isolation above all else *in sympatry*, but the crustaceans push that principle to its logical extreme.
