answer: |-
  ### Examination Question  
  **Essay Prompt (90-minute written answer)**  

  You serve as an advisor to a welfare agency that must select one of three one-shot portfolios:  
  - **Safe**: 999 units of welfare with certainty.  
  - **Gamble A**: 10¹² units of welfare with probability 10⁻⁹, else zero.  
  - **Gamble B**: 10¹² units of welfare with probability (10⁻⁹ − 10⁻¹⁵), else zero.  

  Their exact expected values are:  
  - Safe: 999  
  - Gamble A: 1000  
  - Gamble B: 999.999  

  In a well-reasoned essay, address the following:  
  1. **Prescription and Problem**: State what *maximizing expected value* (EV) prescribes here. Explain why this prescription might be practically or ethically objectionable despite its technical rationale.  
  2. **Fixed Cutoff Repair**: Suppose we "repair" EV maximization by discarding outcomes below a fixed probability cutoff (e.g., 10⁻¹⁰). What does this policy recommend for this case? Evaluate two costs: (a) its arbitrariness, and (b) whether it can satisfy *first-order stochastic dominance* given that Gamble A stochastically dominates Gamble B.  
  3. **Indexed Cutoff Proposal**: Assess this alternative: "The probability cutoff should scale with the *number of similar one-shot decisions* the agent will ever face. An agent facing many choices may ignore smaller probabilities than one facing only one." Does this resolve the objections? Justify.  
  4. **Significance of Tiny Differences**: Ought a theory of rational choice recognize the difference between Gamble A and Gamble B (probability gap: 10⁻¹⁵)? Defend your view using decision-theoretic principles.  

  ---  
  ### Model Answer (Approx. 700 words)  

  **1. Prescription and Problem**  
  EV maximization prescribes selecting Gamble A, as its expected value (1000) exceeds Safe (999) and Gamble B (999.999). This follows from the linearity of expectation: infinitesimal probabilities of vast gains outweigh certain moderate benefits. The objection arises from *fanaticism*: prioritizing near-zero-probability astronomical payoffs over guaranteed welfare. Here, Gamble A has a 1-in-a-billion chance of immense good but a 99.9999999% chance of delivering *zero* welfare—worse than Safe’s certain 999. Ethically, an agency prioritizing systemic reliability or worst-case outcomes could view abandoning Safe for Gamble A as reckless, effectively gambling essential welfare on a statistical impossibility. Rationally, it defies common-sense risk aversion when probabilities become practically negligible.  

  **2. Fixed Cutoff Repair: Costs and Dominance**  
  A fixed cutoff (e.g., 10⁻¹⁰) would discard Gamble A’s positive outcome (prob. 10⁻⁹ > 10⁻¹⁰) but retain Safe. Thus, it prescribes Safe. This avoids fanaticism but incurs two costs. First, **arbitrariness**: Choosing 10⁻¹⁰ lacks principled grounding—why not 10⁻¹² or 10⁻⁸? Thresholds may vary contextually, undermining universality. Second, **stochastic dominance violation**: Gamble A dominates Gamble B because for any welfare level *w*, the probability of achieving *at least w* is higher under A than B. Under a fixed cutoff, both gambles’ positive outcomes (both < cutoff) are ignored, rendering them equivalent (both yield 0). Thus, the repair deems A and B equal despite A’s dominance—a failure to respect dominance, a cornerstone of rational choice.  

  **3. Indexed Cutoff Proposal Assessment**  
  Indexing the cutoff to the agent’s lifetime decisions (e.g., cutoff ∝ 1/*n* for *n* total choices) aims to balance fanaticism and opportunity. An agent facing many choices (*n* large) lowers its cutoff, permissibly ignoring smaller probabilities (e.g., below 10⁻¹⁵) since statistical outliers likely occur over repeated trials. A one-shot agent (*n*=1) uses a higher cutoff, avoiding microscopic risks. This *partially* resolves objections: it contextualizes risk tolerance and avoids fixed arbitrariness. However, it introduces new problems. First, **epistemic burden**: Agents rarely know *n* precisely (e.g., is the welfare agency’s "lifetime" 10 or 10,000 decisions?). Second, **dynamic inconsistency**: If *n* changes, cutoffs shift retroactively. Third, **ethical asymmetry**: A large-*n* agent might accept Gamble B (prob. ~10⁻⁹) while a small-*n* agent rejects it, though both face identical single-instance risks. The proposal mitigates fanaticism but sacrifices invariance and simplicity.  

  **4. Significance of Tiny Probability Differences**  
  Rational choice theories *ought not* require recognizing the difference between Gamble A and Gamble B. Their probability gap (10⁻¹⁵) is epistemically inaccessible: no real agent could ever calibrate beliefs or data to this precision. Demanding sensitivity to such differences invites *hyper-inflation of precision*, where mathematically distinct but empirically indistinguishable options dominate practical reasoning. Furthermore, stochastic dominance *between A and B* is theoretically material but practically irrelevant: both probabilities are operationally equivalent to "near-zero." Rationality should prioritize robust heuristics over hyper-sensitivity to unmeasurable quantities. Insisting on recognizing 10⁻¹⁵ differences enables fanaticism (e.g., preferring A over Safe) by exaggerating trivial EV gaps (here, 0.001 units). A theory ignoring differences below pragmatically justified thresholds (e.g., where probabilities or EV deltas fall below perceptible or actionable limits) better serves coherent, implementable decision-making.  

  ---  
  ### Marking Scheme (25 Total Marks)  
  **Section 1: Prescription and Problem (6 marks)**  
  - **Must-hit (4 marks)**: Correct EV prescription (Gamble A) + clear objection (prioritizing near-impossible gain over guaranteed welfare).  
  - **Must-hit (2 marks)**: Articulates fanaticism (infinitesimal probability dictating choice despite near-certain ruin).  
  - *Characteristic error (weak)*: Misstates EV ranking or objects vaguely without tying to probability negligibility.  

  **Section 2: Fixed Cutoff Repair (7 marks)**  
  - **Must-hit (3 marks)**: Correct prescription (Safe) under cutoff and identifies arbitrariness cost.  
  - **Must-hit (4 marks)**: Correct dominance analysis (A dominates B) + shows repair violates it by equating A/B.  
  - *Characteristic error (weak)*: Claims cutoff respects dominance or misses the A/B equivalence implication.  

  **Section 3: Indexed Cutoff Proposal (6 marks)**  
  - **Must-hit (3 marks)**: Explains how indexing adjusts risk tolerance (e.g., lower cutoff for large *n*).  
  - **Must-hit (3 marks)**: Identifies ≥2 flaws (e.g., epistemic burden, dynamic inconsistency, ethical asymmetry).  
  - *Characteristic error (weak)*: Uncritically endorses indexing or cites only one flaw.  

  **Section 4: Significance of Differences (6 marks)**  
  - **Must-hit (2 marks)**: Takes a clear stance (e.g., "ought not recognize").  
  - **Must-hit (4 marks)**: Defends using ≥2 principles (e.g., epistemic inaccessibility, operational equivalence, anti-hyperprecision).  
  - *Characteristic error (weak)*: Binary stance without principled defense or conflates theoretical/practical significance.  

  **First-Class Distinction**: Integrates sections (e.g., ties Sec 4’s anti-precision to Sec 2’s dominance violation), anticipates counterarguments (e.g., "But shouldn’t rationality be mathematically precise?"), and uses case-specific numbers rigorously.
