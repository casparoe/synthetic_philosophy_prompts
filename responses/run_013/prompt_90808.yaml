prompt: |-
  I'm in a theory seminar this term that has basically turned into a twelve-week fight about methodological individualism — whether every acceptable social-science explanation has to be reconstructible from the beliefs, desires and actions of individual people, or whether some explanations legitimately stop at the level of structures, norms, organizations and the like. The bit I keep coming back to is that the individualists aren't obviously saying society is *nothing but* individuals; they're saying the individual-level story has to be there, available in principle, even if nobody in the actual paper ever tells it — and the holists keep replying that "available in principle" is doing an enormous amount of quiet work, that supervenience is not the same thing as explanatory reducibility, and that when a sociologist says a firm copied a practice because it was already the industry standard, there's no obvious way to translate that into anybody's reasons without changing what's being explained. I find the whole thing funny in a bleak way, and I've stupidly agreed to do five minutes at the department's end-of-term party, so I need material.

  Write me a joke about this. Give me one main bit with a real setup and a punchline, plus two shorter alternates. The punchline should turn on the actual content of the dispute rather than being a generic "social scientists are confused" gag — someone in the room who knows the literature should laugh because the joke gets the disagreement right, not because they recognize the vocabulary. Concretely: I'd like one of them built around two people describing the same mundane event — a traffic jam, a queue that keeps forming at the same coffee place, a department that adopts a policy nobody wanted — where the individualist and the holist both give accounts that are internally fine but that disagree about what would even count as the same explanation. Another could be about the phrase "in principle" and how much work it's quietly doing. Dont name-drop theorists, I don't want to be attributing jokes to real people, and if you use a technical term (supervenience, microfoundations, emergence, aggregation) make sure the joke shows you actually know what it means.
