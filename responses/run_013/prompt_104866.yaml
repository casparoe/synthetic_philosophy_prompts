prompt: |-
  Draft the joint statement of an adversarial collaboration between a prioritarian and a relational egalitarian about the levelling-down objection. The two have argued past each other for years: the prioritarian treats the objection as showing that equality has no intrinsic value, while the relational egalitarian holds that it targets a view nobody should have held, because what is valuable is not an equal distribution of welfare but the absence of domination and hierarchy. Produce the document both could sign. Begin with a numbered section of claims both accept: what the objection actually asserts, what it presupposes about the structure of betterness (impersonality, welfarism, the contrast between being better in one respect and better all things considered), and what each side concedes. Then state the residual disagreement in wording each side would accept for its own position, especially over whether the objection has any force against a relational rather than a distributive reading of equality. Then set out the cruxes, which I take to include whether non-domination has value independent of anyone's welfare, whether prioritarianism can account for the badness of domination, and whether the relevant comparison is between distributions or between relations. Treat as central a case I want both parties to address head-on: dismantling a hierarchy of unjust privilege makes the former superiors worse off and leaves no one better off. Is that levelling down, and if so, is it objectionable? For each crux, give an argument or case both sides agree bears on it, with each side's prediction recorded in advance. If part of the dispute turns out to be merely verbal, say which part and why.
reasoning: |-
  We are drafting a joint statement between a Prioritarian and a Relational Egalitarian on the Levelling-Down Objection (LDO). 
   The goal is to have a document both can sign, starting with common ground, then stating residual disagreements, and then addressing cruxes with agreed-upon cases and predictions.

   Structure:
   1. Claims both accept: 
      a. What the LDO asserts.
      b. What it presupposes about the structure of betterness (impersonality, welfarism, distinction between one respect and all things considered).
      c. What each side concedes.

   2. Residual disagreement: 
      - Wording each side would accept for its own position, especially on whether LDO has force against relational equality.

   3. Cruxes (central issues) with agreed-upon cases and each side's prediction:
      a. Whether non-domination has value independent of welfare.
      b. Whether prioritarianism can account for the badness of domination.
      c. Whether the relevant comparison is between distributions or relations.

   Central case: Dismantling a hierarchy of unjust privilege that makes the former superiors worse off and leaves no one better off. 
     - Is that levelling down? 
     - Is it objectionable?

   4. If part is verbal, identify it.

   Let's proceed step by step.

   Section 1: Claims Both Accept

   1.1 What the Levelling-Down Objection (LDO) asserts:
        The LDO points out that if we move from an unequal distribution to an equal one by making the better-off worse off and no one better off, then, on a purely distributive egalitarian view, this change is in one respect better (because it increases equality) but it is not better all things considered (since no one gains and some lose). 

   1.2 Presuppositions of the LDO:
        a. Impersonality: The betterness relation is impersonal; we are considering what is better from the point of view of the universe, not any particular individual.
        b. Welfarism: The goodness of a state of affairs is determined solely by the individual welfare levels in that state.
        c. The distinction between being better in one respect (e.g., equality) and better all things considered: The LDO grants that equality might be a good in one respect but argues that it is not necessarily good overall.

   1.3 Concessions:
        Prioritarian: Concedes that if equality were the only value, then the levelling-down change would be at least in one respect good. But the prioritarian argues that since no one is better off and some are worse off, the change is not better overall. The prioritarian also concedes that relational egalitarians are not committed to the claim that equality has intrinsic value in the distributive sense.
        Relational Egalitarian: Concedes that if one held a purely distributive view of equality, then the LDO would be a problem. However, they hold that their view is not subject to the LDO because they do not value equality of welfare per se.

   Section 2: Residual Disagreement

   Prioritarian's position: 
        The LDO shows that distributive equality has no intrinsic value. It does not, however, directly address whether relational equality (non-domination) has intrinsic value. The prioritarian remains skeptical that the relational egalitarian can avoid the force of the LDO when it comes to the value of non-domination, especially in cases where eliminating a hierarchy does not improve anyone's welfare.

   Relational Egalitarian's position: 
        The LDO is a powerful objection to distributive egalitarianism, but it is irrelevant to relational egalitarianism. What matters is the quality of social relations, not the distribution of welfare. The relational egalitarian holds that the elimination of domination is intrinsically valuable even if it does not improve welfare (and even if it reduces the welfare of the dominators) because it establishes a just social order.

   Section 3: Cruxes and the Central Case

   We now address the central case: 
        "Dismantling a hierarchy of unjust privilege makes the former superiors worse off and leaves no one better off."

   Is this levelling down? 
        Both agree that in terms of welfare, it is: the welfare of the former superiors is reduced, and no one else's welfare is increased.

   Is it objectionable? 
        Here lies the crux.

   Crux 1: Whether non-domination has value independent of anyone's welfare.

        Agreed case: Consider a society with two groups: A (privileged) and B (underprivileged). The privilege is unjust and involves domination. We dismantle the hierarchy, making A worse off (because they lose privileges) and B no better off (because the dismantling does not directly improve their material conditions, and we assume no psychological boost or other welfare effect). 

        Prioritarian prediction: 
            This change is not better all things considered because it does not improve the welfare of the worst off (B) and actually reduces the welfare of A. The prioritarian might say that if non-domination has value independent of welfare, then we need a story about how that value is realized without affecting welfare. But the prioritarian is skeptical that such independent value exists.

        Relational Egalitarian prediction:
            This change is better all things considered because it eliminates an unjust social relation. The value of non-domination is independent of welfare. Even if no one's welfare improves, the state of affairs is better because it is more just.

        Agreed argument: 
            Both agree that if non-domination has value independent of welfare, then the relational egalitarian has a strong case. If it does not, then the prioritarian's skepticism is warranted.

   Crux 2: Whether prioritarianism can account for the badness of domination.

        Prioritarianism gives priority to the worse off. But domination might not always make the dominated the worst off in welfare terms? 

        Agreed case: Consider a case where the dominated group is not the worst off in welfare. For example, a group of workers who are dominated by their employer but have high wages and good living standards (so their welfare is high), and there is another group of unemployed who are even worse off. We eliminate the domination of the workers without affecting their welfare (or the welfare of others). 

        Prioritarian prediction: 
            Prioritarianism, being welfarist, would not see the elimination of domination in this case as improving the situation because it does not increase the welfare of the worst off (the unemployed). The prioritarian might even say that if the elimination of domination has no welfare effect, then it is not a moral improvement.

        Relational Egalitarian prediction:
            The elimination of domination is valuable even if it doesn't change welfare and even if the dominated were not the worst off. It is a matter of justice.

        Agreed argument: 
            The prioritarian must either (a) argue that domination is bad only because of its effects on welfare (and if it has no effect, it is not bad) or (b) find a way within prioritarianism to account for the badness of domination as a distinct concern. The relational egalitarian argues that prioritarianism cannot capture the full badness of domination because it reduces everything to welfare.

   Crux 3: Whether the relevant comparison is between distributions or between relations.

        The prioritarian typically compares distributions of welfare. The relational egalitarian compares social relations.

        Central case revisited: 
            When we dismantle the hierarchy, the prioritarian sees a welfare distribution that is worse for some and no better for others. The relational egalitarian sees a change in social relations: from a hierarchical to an egalitarian one.

        Prioritarian prediction: 
            The comparison of welfare distributions shows that the change is not better (and is worse) in welfare terms. If the relational egalitarian wants to say the change is better, they must appeal to a non-welfare value.

        Relational Egalitarian prediction:
            The change is better because the social relations are better. The relevant comparison is between two sets of social relations, not just welfare distributions.

        Agreed argument: 
            This crux highlights the fundamental difference in what each theory takes as the primary object of evaluation.

   Section 4: Verbal Disagreement?

        Both agree that the term "equality" is used in two different senses: 
            - Distributive: about the distribution of welfare (or resources).
            - Relational: about social and political relations (non-domination, absence of hierarchy).

        Therefore, when the prioritarian says "equality has no intrinsic value", they are referring to distributive equality. The relational egalitarian agrees that distributive equality has no intrinsic value. But they hold that relational equality (non-domination) does. 

        So the verbal part: The word "equality" is ambiguous. The LDO targets distributive equality, and both agree it succeeds there. But the relational egalitarian does not hold the view the LDO targets.

   Conclusion:

   We have found common ground and clarified the points of disagreement. We agree that the LDO is fatal to distributive egalitarianism but disagree on whether it affects relational egalitarianism. The central case of dismantling a hierarchy without welfare improvement remains contested, and we have laid out the cruxes that must be resolved.

   Signed:

   [Prioritarian] 
   [Relational Egalitarian]
answer: |-
  ### Joint Statement: Prioritarian and Relational Egalitarian Collaboration on the Levelling-Down Objection  

  #### **1. Claims Both Parties Accept**  
  1.1 **The Levelling-Down Objection (LDO) asserts**: A change that reduces inequality by lowering the welfare of the better-off, while leaving the worse-off no better off, cannot be an improvement *all things considered*. It may be "better" *in one respect* (equality), but not overall.  

  1.2 **Presuppositions about Betterness**:  
     - **Impersonality**: Moral evaluation adopts an impartial, agent-neutral perspective (the "view from nowhere").  
     - **Welfarism**: Only individual welfare levels determine the goodness of outcomes.  
     - **Respect vs. All-Things-Considered Betterness**: A change can be pro tanto better (e.g., in equality) yet not better overall (e.g., if no one gains).  

  1.3 **Concessions**:  
     - The **Prioritarian** concedes: Relational egalitarians do not defend the distributive equality targeted by the LDO. The objection thus misses their core claim.  
     - The **Relational Egalitarian** concedes: If equality were *solely* about welfare distributions, the LDO would refute its intrinsic value. Prioritarians rightly reject such egalitarianism.  

  ---  

  #### **2. Residual Disagreement**  
  - **Prioritarian Wording**: "The LDO defeats *distributive* egalitarianism but may not apply to relational views. However, if eliminating domination *independently* reduces welfare without improving anyone’s condition, it faces a structurally analogous problem: it cannot be better all things considered."  
  - **Relational Egalitarian Wording**: "The LDO only refutes a strawman (distributive egalitarianism). Relational equality—grounded in non-domination—is untouched. Dismantling unjust hierarchies is intrinsically valuable, even absent welfare gains, because justice requires ending oppression."  

  **Key Disagreement**: Whether the LDO applies to relational equality. The prioritarian sees parallel pitfalls; the relational egalitarian denies comparability.  

  ---  

  #### **3. Cruxes and Agreed Analytical Framework**  
  We address **three cruxes**, using a central case both parties must confront:  
  > **Central Case**: *Dismantling a hierarchy of unjust privilege makes former superiors worse off (e.g., losing exploitative benefits) and leaves subordinates no better off (e.g., material conditions unchanged). Is this levelling down? If so, is it objectionable?*  

  **Crux 1: Does non-domination have value independent of welfare?**  
  - **Agreed Case**: A colonial regime ends, removing settlers’ privileges. Settlers lose welfare (e.g., economic perks), but the colonized gain no welfare (e.g., persistent poverty).  
    - **Prioritarian Prediction**: No all-things-considered gain. Non-domination lacks intrinsic value; moral weight derives solely from welfare impacts. If no one benefits, the change is neutral or bad.  
    - **Relational Egalitarian Prediction**: The change is better all things considered. Ending domination has intrinsic value—justice is realized regardless of welfare effects.  
  - **Shared Argument**: If non-domination’s value reduces to welfare (e.g., via psychological security), prioritarianism wins; if justice is non-derivatively valuable, relational egalitarianism wins.  

  **Crux 2: Can prioritarianism account for the badness of domination?**  
  - **Agreed Case**: A sweatshop reform ends abuse but lowers profits, cutting wages. Workers’ welfare decreases; owners lose nothing.  
    - **Prioritarian Prediction**: Prioritarianism condemns domination *only* when it lowers absolute welfare of the worst-off. Here, reform is bad unless it prevents greater future harm.  
    - **Relational Egalitarian Prediction**: Prioritarianism cannot condemn domination that doesn’t harm welfare (e.g., "benevolent" dictators). Non-domination is irreducible to welfare priority.  
  - **Shared Argument**: If prioritarianism explains anti-domination intuitions (e.g., via welfare risks of oppression), it suffices; if not, relational equality is essential.  

  **Crux 3: Is the relevant comparison between distributions or relations?**  
  - **Agreed Case**: Feudal lords lose status-based advantages; serfs’ welfare unchanged.  
    - **Prioritarian Focus**: Compares welfare distributions—post-reform, aggregate welfare falls. This is objectionable levelling down.  
    - **Relational Egalitarian Focus**: Compares social relations—post-reform, oppression ends. Levelling down is a misnomer; justice isn’t distributional.  
  - **Shared Argument**: If morality evaluates states of affairs by welfare alone, distributions matter; if social relations are primary, the LDO framework is inapt.  

  ---  

  #### **4. Verbal Disagreement**  
  The term **"equality"** is ambiguous:  
  - **Distributive sense** (welfare/resource shares): Both agree the LDO refutes its *intrinsic* value.  
  - **Relational sense** (non-domination): Here, disagreement is substantive, not verbal.  
  **Why verbal?** The LDO’s "levelling down" label presupposes welfare-distributive equality. Relational egalitarians reject this framing—their ideal is not "levelled" welfare but dismantled power structures.  

  ---  

  #### **Conclusion**  
  We concur that the LDO refutes *distributive* egalitarianism. For relational equality, we disagree on whether the LDO’s logic applies. The prioritarian insists that welfare loss without gain cannot be better; the relational egalitarian holds that justice transcends welfare. Testing our predictions against cases like colonial reform will resolve the cruxes. This collaboration clarifies that our dispute centers on the nature of the good (welfare vs. non-domination) and the proper objects of moral evaluation (distributions vs. relations).  

  **Signed**,  
  [Prioritarian Representative]  
  [Relational Egalitarian Representative]  

