prompt: |-
  Bit of a weird one. I'm a first-year in a political theory program and I've somehow ended up helping a neighborhood group that's trying to get our city to stop using referendums for big land-use decisions and switch to a citizens' assembly instead — you know, sortition, thirty-odd people pulled at random, a few weekends of deliberation, then they decide. Anyway we had a meeting last week and it turned into a shouting match about four words. The guy leading the keep-the-referendum side kept saying that only a referendum can tell you the will of the people, full stop, and that you can't manufacture the will of the people in a room of thirty strangers. The assembly woman shot back that a referendum just gives you the will of the people on a bad day, and that a proper deliberative body is the only way to find out what the people would will if they'd actually thought about it. Then someone else piled on that the courts shouldn't be able to strike down a referendum result either, because that's just thwarting the will of the people — same phrase, third argument.

  The annoying thing is all three of them say 'the will of the people' like its completely obvious what it means, and I'm now pretty sure it isn't one thing at all. Can you lay out for me the different precise claims that phrase could actually be making — whose will, will about what, at what time, does it have to be a majority, does it even have to be a single will, is it a claim about what people happen to want or a norm about what makes a decision legitimate — going from the readings that are basically trivial up to the ones that are a whole Rousseauian metaphysics, and for each one tell me whether it's plausible and, way more useful for me, whether it's the reading you'd actually have to be using for the phrase to do the work each of them was making it do. My suspicion is the referendum guy needs a much heavier reading than he realizes, the assembly woman is quietly using a different one, and the courts comment is doing something else again, but I can't put my finger on where each of them is cheating.

  Give it to me as a list or menu I can bring to the next meeting, not an essay — I need to be able to point at a line and say 'that's the one you're leaning on.' And if some of these readings turn out to be the same reading wearing different hats, say so. Sorry this got so long.
reasoning: |-
  Okay, the user is a first-year political theory student involved in a community debate about replacing referendums with citizens' assemblies for land-use decisions. The core conflict revolves around three different interpretations of "the will of the people" during a heated meeting. They need a clear breakdown of these interpretations to point out inconsistencies in each side's argument at the next meeting.

  First, I need to unpack "the will of the people" into distinct philosophical claims. The referendum advocate claims only referendums capture the people's will, the assembly proponent argues deliberation reveals the true will, and a third person opposes judicial intervention as thwarting that will. The user suspects each is using the phrase differently without realizing it.

  Starting with basic interpretations: The simplest is the "Snapshot Majority" view—whatever gets the most votes in a referendum. But this has flaws like low turnout or misinformation. The referendum advocate might think this is sufficient, but it doesn't hold up under scrutiny because it ignores deeper questions about legitimacy.

  Then there's the "Actual Preferences" view—what people currently want, regardless of a vote. But this is impossible to measure perfectly, and a referendum is just a rough proxy. The assembly advocate probably rejects this as inadequate since people might not be well-informed.

  The "Informed Preferences" view is where deliberation comes in. Citizens' assemblies aim to reveal what people would want if they had time and information. This seems aligned with the assembly advocate's point about finding what people would will "if they'd actually thought about it." This challenges the referendum as capturing only "the will on a bad day."

  For the referendum advocate to claim their method is the only legitimate one, they'd need something stronger like the "Majoritarian Legitimacy" view—that majority vote confers legitimacy by itself. But this requires accepting majority rule as inherently valid, which isn't obvious. The assembly advocate might counter that legitimacy comes from quality of deliberation, not just numbers.

  The most demanding view is Rousseau's "General Will"—a unified common good that transcends individual preferences. This is likely where the referendum advocate is unintentionally leaning, especially if they treat the outcome as sacred. But Rousseau himself thought direct democracy wasn't feasible for modern states, and sortition might better approximate this ideal. The courts opponent might be invoking this sacred view when saying judicial review thwarts the people's will.

  The courts opponent is probably mixing "Majoritarian Legitimacy" (the vote makes it legitimate) and "General Will" (it's sacred). But judicial review often checks against constitutional principles, not against the people per se. The user can highlight this as category confusion.

  The user's key insight is correct: the referendum advocate needs a heavy metaphysical claim (General Will) to dismiss alternatives, the assembly proponent uses a practical, informed-preference standard, and the courts critic conflates legitimacy sources. By mapping these to clear labels—like "Type 4" for Majoritarian Legitimacy or "Type 5" for General Will—the user can force each side to defend their underlying assumptions.

  In the response, I'll structure these as distinct types with attributes: what it claims, whose will it is, timeframe, whether majority is required, and whether it's about desires or legitimacy. Then I'll explicitly link each meeting participant's argument to the type they rely on and where it's unstable. The goal is to give the user a "menu" for pinpointing inconsistencies, exactly as requested.
answer: |-
  Here's your menu of "will of the people" interpretations, broken down by core claim, key attributes, plausibility, and which argument relies on it (with the cheating highlighted). Think of these as Types 1-5:

  | **Type** | **Core Claim** | **Whose Will?** | **Timeframe** | **Requires Majority?** | **Desire or Legitimacy?** | **Plausibility** | **Used By** |
  |----------|----------------|-----------------|--------------|------------------------|---------------------------|------------------|-------------|
  | **Type 1: Snapshot Majority** | Majority vote result *is* the will | Voters in *this* vote | Moment of vote (snapshot) | Yes (simple majority) | Legitimacy | Low - Ignores context | Referendum Guy (superficially) |
  | **Type 2: Actual Preferences** | Aggregation of what people *currently* desire | The relevant populace | Current moment | No (but needs measurement) | Desire → Legitimacy | Medium (but impossible to perfectly measure) | Referendum Guy (needs this for "true" claim) |
  | **Type 3: Informed Preferences** | What people *would* want if informed/reflective | The relevant populace | Hypothetical (post-deliberation) | Not necessarily | Desire → Legitimacy | High (practical) | Assembly Woman |
  | **Type 4: Majoritarian Legitimacy** | Majority vote confers legitimacy *by itself* | Majority voters | Moment of vote | Yes | Legitimacy | Controversial (ignores minority rights) | Referendum Guy (core claim), Courts Critic |
  | **Type 5: General Will (Rousseau)** | Singular common good beyond individual desires | The People as a collective entity | Timeless (requires discovery) | No (requires unanimity) | Legitimacy (metaphysical) | Very Controversial | Referendum Guy (unwittingly), Courts Critic |

  **The Breakdown & Who's Relying on What (and Cheating Where):**

  1.  **Type 1: Snapshot Majority**
      *   **Claim:** The result of a specific majority vote (like this referendum) *is* "the will of the people." Period.
      *   **Whose Will?** The people who *actually voted* in *this specific vote*.
      *   **Timeframe:** The moment the vote is cast.
      *   **Majority?** Yes, simple majority of voters.
      *   **Desire/Legitimacy?** Legitimacy: The vote outcome *is* the legitimate expression of the will.
      *   **Plausibility:** Low. Easily undermined by low turnout, misinformation, framing effects, emotional spikes, binary choices on complex issues. Ignores non-voters and intensity.
      *   **Used By:** **Referendum Guy** *sounds* like he's saying this ("only a referendum can tell you").
      *   **The Cheat:** He *says* this, but his claim "only a referendum *can* tell you" implies something **stronger** (Type 2 or even Type 5). He needs it to be the *only true* or *only legitimate* expression, which Type 1 isn't defensible as. He's using Type 1's simplicity but demanding Type 4's legitimacy or Type 5's authority.

  2.  **Type 2: Actual Preferences (Aggregate)**
      *   **Claim:** "The will" is the aggregation of what individuals *actually desire right now* on the issue. A referendum is a *measurement tool* for this.
      *   **Whose Will?** The relevant populace (citizens, voters).
      *   **Timeframe:** Current moment.
      *   **Majority?** Not inherently, but the majority preference is usually taken as "the will" in practice. Could be plurality or other aggregations.
      *   **Desire/Legitimacy?** Desire: It's about what people *want*. Legitimacy *might* derive from acting on these desires.
      *   **Plausibility:** Medium (in theory). Seems intuitive. **Major Problem:** We can *never* perfectly measure this aggregate. Referendums are flawed snapshots; polls are snapshots; people are inconsistent. It's an ideal type.
      *   **Used By:** **Referendum Guy** *needs* this reading for his "only a referendum can tell you" claim to make sense *as a truth claim*. He's implying referendums accurately measure the true state of desire (Type 2).
      *   **The Cheat:** He conflates the flawed *measurement tool* (referendum - Type 1) with the *thing being measured* (aggregate desire - Type 2). He pretends the tool *is* the perfect measure.

  3.  **Type 3: Informed/Reflective Preferences**
      *   **Claim:** "The will" is what people *would* desire/will if they were adequately informed, had time to deliberate, considered diverse views, and thought reflectively about the common good.
      *   **Whose Will?** The relevant populace.
      *   **Timeframe:** Hypothetical future/potential state (after ideal deliberation).
      *   **Majority?** Not necessarily. The outcome of deliberation *could* be consensus or a majority position formed under ideal conditions.
      *   **Desire/Legitimacy?** Desire: What people *would* want under better conditions. Legitimacy *derives* from the quality of the process producing this informed desire.
      *   **Plausibility:** High (practically & normatively). Recognizes people have raw preferences but better judgments emerge with information and reflection. Citizens' assemblies aim to *approximate* this.
      *   **Used By:** **Assembly Woman.** This is her core argument: "what the people *would will* if they'd actually thought about it." A referendum gives you "the will... on a bad day" (raw, potentially uninformed Type 2).
      *   **The Cheat?** Less cheating, more a different normative standard. Critics might argue it's paternalistic ("we know better than you what you *really* want") or that "informed" is subjective. But she's explicit about the hypothetical nature.

  4.  **Type 4: Majoritarian Legitimacy**
      *   **Claim:** The act of a majority vote *itself* confers legitimacy on the outcome *as* the "will of the people," regardless of the quality of the preferences or the information behind it. The *procedure* (majority vote) defines the will.
      *   **Whose Will?** The majority of those who voted (often equated with "The People").
      *   **Timeframe:** Moment of the vote.
      *   **Majority?** Absolutely essential. It *is* the defining feature.
      *   **Desire/Legitimacy?** Purely Legitimacy: The vote *makes* it the legitimate will because the procedure was followed.
      *   **Plausibility:** Controversial. Foundational to many democracies but heavily criticized ("tyranny of the majority"). Ignores minority rights and the quality of the decision. Relies on accepting majority rule as the fundamental legitimacy principle.
      *   **Used By:**
          *   **Referendum Guy:** His "full stop" implies this. The referendum *procedure* is what *makes* it the will. He needs this to dismiss alternatives *without* arguing about preference quality (Type 2/3).
          *   **Courts Critic:** "Thwarting the will" implies the referendum result *is* legitimate solely because it was voted on (Type 4 legitimacy), so courts shouldn't override it.
      *   **The Cheat:** Both use it to shut down discussion. It avoids justifying *why* the majority vote outcome is normatively binding beyond the procedure itself. It conflates "what the majority voted for" with "what is right/legitimate for the polity."

  5.  **Type 5: General Will (Rousseauian)**
      *   **Claim:** "The will of the people" is a singular, indivisible, timeless entity representing the *true common good* of the political community, distinct from the sum of individual desires ("will of all"). It must be *discovered* or *formed* through a process oriented towards the common good.
      *   **Whose Will?** "The People" as a collective entity, distinct from individuals.
      *   **Timeframe:** Timeless (if discovered correctly). Requires constant effort to discern.
      *   **Majority?** No (in pure theory). A *unanimous* vote under perfect conditions *might* indicate it, but Rousseau was deeply suspicious of factions potentially masking it even in a majority. Deliberation focused on the *general* interest is key.
      *   **Desire/Legitimacy?** Pure Legitimacy (Metaphysical). Acting according to the General Will *is* freedom and legitimacy. Individual desires are irrelevant or even misleading.
      *   **Plausibility:** Very controversial. Metaphysical, hard to identify empirically. Raises dangers of authoritarianism ("we know the *real* will you don't see").
      *   **Used By:**
          *   **Referendum Guy:** Unwittingly. His "full stop" and "only a referendum" implies a singular, knowable, authoritative "Will" that the referendum captures. He needs this heavy metaphysics to make his strong exclusivity claim ("*only* a referendum can tell you").
          *   **Courts Critic:** When saying courts "thwart" the will, it implies the referendum expressed a sacred, almost infallible General Will that *must* be obeyed. Treating it as inviolable.
          *   **Assembly Woman:** *Ironically, potentially closer.* Sortition + deliberation is arguably a better *procedure* for *attempting* to *discover* something like a common good (Type 5) or informed common position (Type 3) than a raw referendum. Rousseau himself was skeptical of direct democracy for modern states.
      *   **The Cheat:** Both the Referendum Guy and Courts Critic invoke the *rhetoric and authority* of a singular, sacred "Will" (Type 5) but base it on a simple, potentially flawed, majoritarian snapshot (Type 1/4). They borrow the weight of Type 5 without its demanding procedural or normative conditions. **This is the biggest cheat.**

  **The Summary Cheat Sheet for Your Meeting:**

  *   **Referendum Guy:** **Claims** Type 1 (Snapshot) or Type 2 (Actual Desire). **Needs** Type 4 (Majoritarian Legitimacy) to dismiss alternatives, and **unwittingly leans on** Type 5 (General Will) for his "only a referendum can tell you" authority. **Cheats** by conflating the flawed tool (Type 1) with the true desire (Type 2) and borrowing sacred authority (Type 5) for a mundane process (Type 1/4).
  *   **Assembly Woman:** **Explicitly Advocates** Type 3 (Informed/Reflective Preferences). Argues referendums often capture a poor version of Type 2 (raw/uninformed desire). **Is arguably closer** to a practical method for approximating Type 5 (General Will) than a referendum.
  *   **Courts Critic:** **Relies on** Type 4 (Majoritarian Legitimacy) - the vote *makes* it the legitimate will. **Unwittingly invokes** Type 5 (General Will) by treating the outcome as sacred and inviolable ("thwarting"). **Cheats** by ignoring that constitutions/courts often exist precisely to protect against flawed interpretations of the "will" (e.g., violating fundamental rights) or to uphold longer-term constitutional principles potentially representing a deeper "will."

  **Bring this list. Point to the Types. Ask: "Which *precise* Type of 'will of the people' are you claiming this referendum captures/this assembly discovers/courts are thwarting?" Force them to pick their metaphysics.** Good luck!
