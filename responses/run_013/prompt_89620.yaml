  Set theory concepts like cardinality vs. measure matter. If suffering is on a set of positive measure, it can't be ignored, even if both sets are infinite. Nonstandard reals could assign values, but that's also a choice. The user's shaky on ultrafilters, so better to mention nonstandard summation without deep diving.

