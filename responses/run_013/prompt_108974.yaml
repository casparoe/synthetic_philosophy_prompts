  Looking at their proposed diagnostic categories: (a) causation concepts, (b) objects of moral judgment, (c) empirical harm functions, (d) intuitions about complicity, and (e) "ought" applicability. The user's own hypothesis suggests the causal debate is superficial, with the real split being about whether wrongness attaches to individual acts versus patterns.

