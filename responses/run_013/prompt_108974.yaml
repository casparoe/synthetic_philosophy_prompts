  The pattern shows causal features don't determine positions - both camps react consistently across causally diverse cases based on prior commitments. This suggests (b) is primary: the object of moral judgment differs fundamentally. Secondary factors include (d) complicity intuitions and (e) "ought" applicability when powerless.

