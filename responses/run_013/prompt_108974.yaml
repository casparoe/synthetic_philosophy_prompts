answer: |-
  Your standoff is primarily a verbal dispute about the object of moral evaluation [(b)], amplified by bedrock intuitions about complicity [(d)] and the applicability of "ought" [(e)], with causal disagreements [(a)/(c)] being symptoms rather than drivers.  

  **Diagnosis breakdown:**  
  - **Core driver (60%): (b) Object of moral predicate.** The inefficacy camp evaluates *act-tokens* (e.g., *this* emission/vote). The complicity camp evaluates *patterns* (e.g., acts *of a type* that collectively cause harm) or *roles* (e.g., "participant in an unjust scheme"). Their claims are compatible if disambiguated: "Your act-token isn’t wrong" vs. "Acting in this pattern is wrong."  
  - **Amplifier (30%): (d) Complicity intuitions.** The complicity camp sees moral taint in contributing to a collective harm, even if counterfactually irrelevant. The inefficacy camp rejects this as guilt-by-association.  
  - **Secondary (10%): (e) "Ought" applicability.** Inefficacy insists "ought implies can (affect the outcome)"; complicity allows "ought" for non-consequentialist reasons (expressive duty, role-based obligation).  
  - **Causal disagreements [(a)/(c)] are epiphenomenal:** Both sides accept the empirical facts (sharp thresholds, probabilities). Their causal language ("contribution," "difference-making") is stretched to fit prior moral commitments, not vice versa.  

  **Case-testing reveals verdicts track moral object, not causation:**  
  | **Case** | **Inefficacy Camp Verdict** | **Complicity Camp Verdict** | **Divergence Pattern** |  
  |----------|----------------------------|----------------------------|------------------------|  
  | **Sharp threshold already crossed** | Not wrong (no difference) | *Usually* not wrong, but *sometimes* symbolically wrong | *Partial overlap*; complicity may still see expressive harm |  
  | **Additive divisible harm** | Not wrong (negligible effect) | Wrong (small but real share of harm) | *Maximal divergence*; hinges on whether divisible harm justifies individual duty |  
  | **Minuscule probability increase** | Not wrong (risk too trivial) | Wrong (complicity in risky practice) | *Divergence*; inefficacy focuses on expected harm, complicity on participation |  
  | **Zero difference, symbolic act-type** | Not wrong (causally inert) | Wrong (replicates harmful pattern) | *Maximal divergence*; pure test of moral object (token vs. type) |  

  **Your hypothesis confirmed:** Causal arguments are "respectable costumes." The inefficacy camp uses causal inefficacy to defend act-token focus; complicity uses contributory language to defend pattern/role focus. The dispute survives because:  
  1. **Stakes are high:** Adopting one view shapes demands on daily life (e.g., veganism, voting).  
  2. **Metaethical ambiguity:** Moral language often blurs act-tokens and patterns.  
  3. **Lost in translation:** Resolving the verbal dispute feels like surrendering core intuitions—e.g., inefficacy fears "moral tyranny," complicity fears "ethical apathy."  

  **What counts as progress:**  
  - **Dissolve via distinction:** Clarify when ethics targets *act-tokens* (personal accountability) vs. *practices* (social reform). Accept that "duty" may mean different things in these contexts.  
  - **Reformulate the question:** Shift from "Is this act wrong?" to "What kind of moral reasons apply to *patterns of action* in collective contexts?"  
  - **Formal/empirical work is futile:** Settling harm functions [(c)] won’t resolve the core clash, as positions are invariant to causal structures.  
  - **Why nothing else works:** Bedrock intuitions [(d)] and "ought" concepts [(e)] are non-negotiable starting points. Progress requires mapping compatibilities (e.g., "No token-wrongness, but pattern-participation merits collective action") or conceding irreconcilable frameworks.  

  **Bottom line:** The standoff persists because it’s a clash of ethical frameworks (individual act vs. collective pattern) masked as causal debate. Resolving it requires disentangling these frameworks and accepting that moral language serves both—neither side "loses," but clarity reveals where their concerns diverge.
