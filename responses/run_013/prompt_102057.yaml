              - L: large universe, 16 observers (scaled from 40 for practicality).
          - We flipped a fair coin to choose between S and L.
          - We are distributing envelopes. In the envelopes, it tells you whether you exist in this universe or not.
          - If you exist, you will be asked to bet on which theory is true. If you do not exist, you will observe.

     3. **Distribution and revelation (5 mins):**
          - Distribute the envelopes according to the coin flip:
              - If heads (S): randomly give 4 participants the "exist" envelopes and 12 the "not exist".
              - If tails (L): give all 16 the "exist" envelopes.
          - Participants open envelopes. Those with "not exist" step to the side (but remain in the room).

     4. **Betting (10 mins):**
          - Existing participants (those with "exist") are each given 10 points (use tokens or record on paper).
          - They can bet any integer amount from 0 to 10 on S and/or on L, with the constraint that the total bet <= 10.
          - They write their bets privately.

     5. **Revelation and payoff (5 mins):**
          - Reveal the coin flip and thus the true theory.
          - For each existing participant, calculate their final points.

     6. **Debrief (60 mins):**
          - Start by asking participants why they bet the way they did. Record arguments on the whiteboard.
          - Introduce the two rules:
              - Sampling rule (self-sampling): you are a random sample from the actual observers in the true theory. So your existence doesn't tell you anything about which theory is true because you would exist in either.
              - Indication rule (self-indication): you are a random sample from all possible observers (across all theories). So your existence is more likely in theories with more observers.
          - Map their arguments to these rules.
          - Discuss the outcome: if the coin was heads (S), then the indication rule would have led them to bet on L (because P(S)=0.2) and lose. If it was tails (L), then they won.
          - Introduce the presumptuous philosopher: he would use the indication rule to ignore other evidence and believe in the large theory. In our activity, the coin flip was the prior evidence, and the existence evidence updated it. But in the real world, we might have strong empirical evidence for the small theory, but the existence evidence from the indication rule might override it.
          - Discuss the runaway: if we had a third theory, L2, with 1000 observers, then by the indication rule, your existence would make you almost certain of L2, even if you had strong evidence for S or L.

     **Why this design?**

     - It is scalable to 16 participants.
     - It creates a tangible experience of existing or not.
     - The betting with points makes the update consequential.
     - The revelation of the coin flip provides immediate feedback.

     **Defending which rule feels natural:**

     In the activity, the indication rule will feel more natural to many because it uses the intuition that it's more likely to find yourself in a world with more observers. The design will show that this rule can lead to overconfidence in the large theory, but the facilitator can note that in philosophy, both rules have proponents. However, the absurdity of the runaway effect (which we discuss in the debrief) is a challenge for the indication rule.

     We are not resolving the debate, but the activity is designed to make the indication rule's pull felt and then its consequence seen.

     **Candid account of what will go wrong:**

     - Some participants might not understand the betting system. We can do a practice round.
     - The participants who are told they do not exist might be disappointed. We can involve them in the debrief by asking them what they would have bet if they had been selected (but they don't have the existence evidence).
     - The time might be tight: 90 minutes for all. We can cut the betting time.

     Given these, we go forward with this design.
