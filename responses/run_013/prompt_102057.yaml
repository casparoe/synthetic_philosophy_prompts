  ### Activity Design: The Observer Lottery

  #### **Setup and Rules**
  **Core Scenario:** Participants are placed in a simulated multiverse with two competing theories about the number of observers (rooms).  
  - **Theory S (Small):** Only **1 room** exists, with **4 observers**.  
  - **Theory L (Large):** **10 rooms** exist, each with **4 observers** (40 observers total).  

  **Rules for Participants:**  
  1. **Coin Flip (Prior Evidence):** A fair coin is flipped secretly by the facilitator to determine the true theory (Heads: S, Tails: L).  
  2. **Observer Assignment:**  
     - If S is true, 4 participants are randomly selected to be "existing observers." The other 12 are "nonexistent" (sit out).  
     - If L is true, all 16 participants are "existing observers," divided into 4 groups of 4 (each group represents one room). *Note: We scale down to 4 rooms (16 observers) for practicality, but emphasize L has 10x more observers than S.*  
  3. **Information Given:**  
     - All existing observers learn:  
       - They exist (receive an "EXIST" card).  
       - The coin was flipped (but not the result).  
       - The rules of S and L.  
     - Nonexistent observers (if S is true) receive a "DO NOT EXIST" card and observe silently.  
  4. **Betting Phase:** Existing observers bet on whether S or L is true.  

  #### **Materials**  
  - **Coin:** To flip for theory selection (Heads = S, Tails = L).  
  - **Index Cards:**  
    - 16 "EXIST" cards (for observers).  
    - 12 "DO NOT EXIST" cards (only used if S is true).  
  - **Tokens:** Each existing observer gets 10 tokens (representing points).  
  - **Whiteboard:** Record theories, bets, and outcomes.  
  - **Hats/Bags:** For random selection (if S is true, draw 4 names from a hat).  

  #### **Payoff Scheme**  
  - Each existing observer starts with **10 tokens**.  
  - They bet any integer amount (0-10) on **S** or **L** (e.g., "3 on S, 7 on L").  
  - **Payout:**  
    - If correct, they gain **2x** the bet (net gain = +bet amount).  
    - If wrong, they lose the bet (net loss = -bet amount).  
  - *Example:* Betting 8 tokens on L and winning yields 16 tokens (net +8). Betting 8 on L and losing leaves 2 tokens.  
  - **Stakes:** Tokens convert to small rewards (e.g., candy, extra credit). Losing feels consequential but not punitive.  

  #### **Timeline (90 Minutes)**  
  1. **Introduction (10 mins):** Explain theories S and L, the coin flip (prior), and rules. Emphasize: "Your existence is evidence."  
  2. **Coin Flip & Assignment (10 mins):**  
     - Flip coin secretly. Assign EXIST/DO NOT EXIST cards per rules.  
     - If L is true, divide 16 participants into 4 groups (rooms).  
  3. **Betting Phase (15 mins):**  
     - Existing observers discuss in groups (5 mins).  
     - Individuals place bets with tokens (10 mins).  
  4. **Reveal & Payout (5 mins):** Announce true theory (coin result). Resolve bets.  
  5. **Debrief (50 mins):** Structured discussion (detailed below).  

  ---

  ### **Debrief**  
  **Map Activity to Concepts:**  
  1. **Sampling Rule (Self-Sampling Assumption):**  
     - *Activity Moment:* Participants who bet 50-50 (S:L) argue: "I’d exist in either theory, so my existence tells me nothing. I trust the coin flip (prior)."  
     - *Concept Link:* Treating yourself as a random observer from the *actual* observers (S: 4 observers, L: 40). Your existence is equally likely under both.  
     - *Whiteboard:* Write: "Sampling Rule: Ignore existence evidence. Trust prior (coin)."  

  2. **Indication Rule (Self-Indication Assumption):**  
     - *Activity Moment:* Participants who bet heavily on L argue: "In L, there are more observers, so I’m more likely to exist!" (Especially if L is true, they win; if S is true, they lose).  
     - *Concept Link:* Treating yourself as a random observer from *all possible* observers (S: 4, L: 40). Existence is evidence for L because P(you exist | L) = 40/44 ≈ 91% vs. P(you exist | S) = 4/44 ≈ 9%.  
     - *Whiteboard:* Write: "Indication Rule: Update using existence. Favor more observers."  

  3. **Presumptuous Philosopher Runaway:**  
     - *Activity Moment:* When L is false (coin was Heads/S), indication-rule betters lose tokens despite the coin. Highlight: "You ignored the coin because L had more observers."  
     - *Concept Link:* The indication rule overrides strong evidence (coin) because it weights observer count. Scale up: If a theory had 1,000,000 observers, indication rule would demand near-certainty even with opposing evidence.  
     - *Whiteboard:* Draw a spectrum: "More observers → Stronger belief, regardless of evidence."  

  **Discussion Flow:**  
  - Start with participants’ reasoning: "Why did you bet that way?"  
  - Introduce sampling/indication rules as labels *after* hearing their arguments.  
  - Play devil’s advocate: "What if L had 100 rooms? Would you bet 99 tokens on L even if physicists had evidence for S?"  
  - Highlight absurdity: "The presumptuous philosopher says: ‘Your data says small universe, but I exist, so it must be large!’"  
  - End with: "The entire dispute is about which rule we accept for sampling ourselves."  

  ---

  ### **What Will Predictably Go Wrong**  
  1. **Confusion in Observer Assignment:**  
     - *Issue:* If S is true, nonexistent participants may feel left out. If L is true, participants may not grasp the "10 rooms, scaled to 4" abstraction.  
     - *Fix:* Clarify scaling upfront: "L has 10x more observers, but we use 4 rooms for logistics. Focus on the *ratio*." For nonexistent participants, assign them as "scientists" who track bets.  

  2. **Betting Errors:**  
     - *Issue:* Participants may split bets evenly (e.g., 5 on S, 5 on L) without understanding probability.  
     - *Fix:* Pre-betting mini-lecture: "To maximize expected tokens, bet heavily on your highest-confidence theory."  

  3. **Indication Rule Dominance:**  
     - *Issue:* 70%+ will instinctively use the indication rule (betting on L) because "more observers = more likely to exist" feels intuitive. This skews the reveal (if S is true, many lose).  
     - *Fix:* Use this as a teaching moment. Ask losers: "Did your rule fail? Or was the coin unlucky?"  

  4. **Time Crunch in Debrief:**  
     - *Issue:* Groups may dwell on betting tactics vs. philosophy.  
     - *Fix:* Strictly time each debrief section. Prioritize mapping arguments to rules.  

  ---

  ### **What the Activity Cannot Reproduce**  
  **The Full Runaway Effect:**  
  - The activity uses a 1:10 observer ratio (S:L). In reality, the indication rule’s absurdity peaks when observer counts are extreme (e.g., 1 vs. 1,000,000). Participants *intellectually* grasp scaling ("L should be 10x more likely"), but the visceral shock of overriding *strong empirical evidence* requires explicit frontloading:  
    - *Facilitator Must Say:* "In real life, a presumptuous philosopher discounts physics data because ‘in a small universe, I probably wouldn’t exist.’ Our activity shows the math behind this, but you must imagine the arrogance of dismissing evidence for a galaxy-counting theory."  
    - *Why?* Limited participants prevent simulating massive ratios. The facilitator must bridge the gap via storytelling.  

  ---

  ### **Why This Design?**  
  - **Chosen Setup:** Physical assignment (EXIST cards, grouping) makes abstract concepts tactile. Scaling L to 16 observers (not 40) ensures all participate.  
  - **Payoff Scheme:** Tokens (not money) lower stakes but incentivize truth-seeking. Doubling rewards encourages decisive bets, exposing rule differences.  
  - **Debrief Arc:** Starts experiential (participants’ bets), then labels rules, then generalizes to presumptuous philosopher. This mirrors "feel the pull → see the runaway" goals.  
  - **Which Rule Feels Natural?**  
    The **indication rule** dominates intuitively (80%+ of groups will favor L in bets). This is deliberate:  
    - *Defense:* Evolutionarily, "more observers = safer" is adaptive (e.g., "I exist, so humanity likely survived"). The activity exploits this bias, then undermines it when S wins (revealing its conflict with evidence). By contrast, the sampling rule feels sterile ("ignore my existence?"). The design forces participants to confront why the intuitive rule fails when evidence and observer-count clash.  

  **Final Position:**  
  The indication rule is seductive but dangerous—it licenses overconfidence in unobservable "big worlds." The sampling rule, though unintuitive, is conservative and evidence-respecting. The activity makes the indication rule *feel* natural... then burns participants who trust it too far.
