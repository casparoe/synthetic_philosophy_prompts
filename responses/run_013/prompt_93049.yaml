  1. **Countable**:
     - **In the metalanguage**: A set is countable if there exists a bijection between it and the natural numbers of the metalanguage. This is a standard mathematical definition.
     - **In the object model**: The model `M` has its own notion of natural numbers (`ω_M`) and its own notion of functions (as sets of ordered pairs). So when `M` says a set is countable, it means there exists in `M` a function (a set of ordered pairs that `M` thinks is a function) from `ω_M` to that set that `M` thinks is a bijection.

     **Mapping**: The concept of countability is relative to the model. The model `M` might have non-standard natural numbers (if it is non-standard) and non-standard functions. Even if `ω_M` is standard, the functions that exist in `M` are only a subset of the functions that exist in the metalanguage.

     **Clean?**: This maps relatively cleanly. The key point is that the model's internal notion of countability is defined by what functions exist in the model.

  2. **Bijection**:
     - **In the metalanguage**: A bijection is a set of ordered pairs (or a function in the metalanguage) that is one-to-one and onto.
     - **In the object model**: Similarly, the model `M` has a notion of bijection: a set `f` in `M` that `M` thinks is a function and that `M` thinks is a bijection.

