  I'm a programmer — CS degree, I've written a toy interpreter and a type checker, I'm comfortable with diagonalization and I roughly get the halting problem — but I never took a logic course, so my set theory is shaky. Here's the thing I keep bumping into: Skolem's paradox, where first-order set theory, if it has a model at all, has a *countable* model, but that same theory proves there are uncountable sets. So you've got a countable model that believes it contains uncountable sets.

  Can you restate the paradox and its standard resolution entirely in the vocabulary I actually use — models as interpreters or data structures, object language vs metalanguage as the language you're interpreting vs the language you write the interpreter in, "expressible/definable in the system" vs "true out here", the missing bijection as a function that exists but has no name the system can refer to, etc.? Then give me the residue report: what survives the translation cleanly, what I have to fudge, and where it just breaks. I have a suspicion that "countable" and "bijection" won't map onto anything I own, and I want to know whether the thing logicians are exercised about here is a real phenomenon in my world or an artifact of theirs. Don't tell me it's "just like" something in my framework if it isn't — the failures are the interesting part.
