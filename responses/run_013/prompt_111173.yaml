answer: |-
  ## Fellowship Proposal: Distributed Responsibility in Collective Harm Decisions

  I propose to investigate how moral responsibility distributes across groups making harmful but necessary decisions. Standard "dirty hands" theory focuses on the solitary agent facing an inevitable moral violation (e.g., Sartre’s Resistance fighter ordering an execution). This framework struggles to capture the reality of institutional harm—decisions made by committees, councils, or bureaucracies where no single individual issues the definitive order or bears the full causal weight. My town council’s recent school closure vote exemplifies this: eleven members, informed by administrative reports and legal counsel, collectively enacted a policy causing significant harm, yet each member’s individual moral burden feels qualitatively different than if they had acted alone. The core question is: **When a group commits a necessary harm, does moral responsibility fractionally distribute to each member, or does it dissipate entirely, rendering the harm a genuinely "agentless" outcome?**

  The existing literature leaves this unresolved. Debates about complicity (Kutz) or collective responsibility (French, Pettit) often presuppose identifiable, blameworthy collective agents or focus on shared intentions, which may not exist in loosely coordinated bodies like municipal councils. Conversely, theories emphasizing individual culpability (Williams’ "moral luck," Thompson’s "mediating acts") struggle to model how responsibility scales or dilutes across multiple actors whose individual contributions are marginal and interdependent. The gap lies in modeling responsibility *as it is actually experienced and ascribed* within real-world, non-cohesive decision groups facing constrained choices under partial information.

  To address this empirically and conceptually, I will employ a three-phase method:

  1.  **June: Case Reconstruction & Responsibility Mapping.** I will transcribe and analyze recordings/transcripts of three contentious town council decisions involving significant harm allocation (e.g., budget cuts impacting services, infrastructure displacing residents, the school closures). Using qualitative coding software (e.g., NVivo), I will map: a) *Decision pathways* (how options emerged, were modified, delegated, or combined); b) *Attributions of responsibility* made by members *during* deliberation (e.g., "The state funding formula forces this," "The Superintendent presented this option," "Our vote makes it real"); c) *Post-hoc justifications* in public statements or interviews (if available ethically). This grounds the abstract question in actual discourse patterns.

  2.  **July: Structured Interviews & Scenario Testing.** I will conduct semi-structured interviews (approx. 10-12) with current/former council members from similar municipalities. Interviews will explore: a) Their lived sense of responsibility for past harmful votes; b) Their perception of others' responsibility; c) Responses to tailored scenarios manipulating group size, decision rules (unanimity vs. majority), and individual leverage. Crucially, scenarios will probe whether they perceive responsibility as divisible ("I carry 1/11th of the burden") or non-divisible ("Either we all own it fully, or it vanishes"). This tests the experiential reality of the two options.

  3.  **August: Conceptual Synthesis & Framework Development.** Integrating phases 1 & 2, I will develop a conceptual framework. Does the data support a fractional model (responsibility divides like debt), an emergent model (responsibility vanishes unless concentrated), or a hybrid? Key will be identifying conditions under which responsibility *sticks* to individuals (e.g., pivotal votes, unique expertise used, active advocacy) versus *disperses* (e.g., diffuse causality, strong delegation, overwhelming external constraints). The output is not a universal theory but a diagnostic toolkit for parsing responsibility distribution in specific institutional contexts.

  Success is defined by achieving conceptual clarity on divisibility. A successful result would be: 1) Identifying specific *mechanisms* within group decisions (e.g., "shared causal opacity," "distributed veto power," "rituals of collective accountability") that demonstrably amplify or diminish individual members' experienced and ascribed responsibility; and 2) Providing a defensible, empirically-informed answer to whether, and under what conditions, responsibility for a single harm *can* be fractionally held by multiple agents. This would yield a usable distinction – e.g., "Responsibility fractionally distributes *only when* members retain significant causal agency and avoid specific dispersion mechanisms X, Y, Z." Failure would be the inability to move beyond confirming the initial dilemma (e.g., data shows members feel *both* slightly dirty *and* strangely clean, with no discernible pattern explaining the variation) or producing only vague, non-actionable observations about institutional complexity. A negative result showing clear, irreconcilable contradictions in lived experience would still be valuable if rigorously documented.

  This project is feasible in three months. The methodology leverages my access to real-world cases and actors central to the phenomenon, moving beyond purely theoretical debate. It requires no new surveys or complex IRB hurdles beyond standard interview protocols. My training in qualitative analysis provides the necessary skills. By focusing narrowly on responsibility *distribution within groups making constrained harm decisions* – using my council experience as the initial anchor – I avoid sprawling into general theories of collectives or ethics. The outcome won't absolve my vote, but it could provide a lens to understand my place in the next hard choice, offering something more precise than solitary guilt or collective evasion: a map of where the dirt might actually lie.
