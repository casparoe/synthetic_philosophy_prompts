  ### Decision Tree for Historical Materialism Seminar

  **Root Node (Node 1):** All students accept that a society's economic structure has *some* explanatory priority over its legal, political, religious, and intellectual life. This is the starting commitment.

  **Branch Nodes (Questions Based on Concrete Cases):**  
  - **Node 2 (Scope: Universal or Capitalism-Only?)**  
    *Case: Rapid state-directed industrialization (e.g., Meiji Japan importing technology)*  
    Does this show that economic priority is a universal law of history, or specific to capitalism?  
    - **A:** Universal law (the state acted due to underlying economic pressures).  
    - **B:** Specific to capitalism (in non-capitalist societies, the state can lead autonomously).  

  - **Node 3 (Bearer of Priority: What Drives Change?)**  
    *Case: Transition from feudalism to capitalism in England vs. Poland (where serfdom intensified under similar pressures)*  
    What primarily drove England's transition? Why did Poland diverge?  
    - **A:** Development of productive forces (e.g., agricultural tech; Poland lacked this development).  
    - **B:** Class struggle (e.g., lord-peasant conflicts; Polish nobility won).  
    - **C:** Competitive market pressures (e.g., trade growth; Poland had weaker markets).  

  - **Node 4 (Constraint vs. Fixation of Content)**  
    *Case: Persistence of religious belief in an advanced capitalist society (e.g., the USA)*  
    Does this show the economic structure only constrains religion (setting survival conditions), or also fixes its content (e.g., specific beliefs)?  
    - **A:** Only constrains.  
    - **B:** Also fixes content.  

  - **Node 5 (Selection vs. Production of Ideas/Institutions)**  
    *Case: Abolition of slavery in the Atlantic world (moral/religious arguments vs. economic interests)*  
    Were abolitionist ideas generated independently and selected by the economy, or produced by it?  
    - **A:** Selected (e.g., ideas emerged from ethics/religion; economy favored compatible ones).  
    - **B:** Produced (e.g., industrial capitalism generated these ideas directly).  

  - **Node 6 (Determination in the Last Instance: Empirical or Formal?)**  
    *Case: A centuries-long theocratic society (e.g., medieval Europe)*  
    Is "determination in the last instance" empirical (economy must eventually dominate) or a formal reservation (economy is foundational but may never visibly dominate)?  
    - **A:** Empirical claim (economy will win if we wait long enough).  
    - **B:** Formal reservation (no expectation of visible "win").  

  **Leaves (Positions):**  
  | Leaf | Position Name                  | Path (Node2-Node3-Node4-Node5-Node6) | Hardest Commitment to Defend                                                                 |
  |------|--------------------------------|--------------------------------------|----------------------------------------------------------------------------------------------|
  | 1    | Orthodox Productive-Forces Determinism | B-A-B-B-A | Fixation of all ideas' content (e.g., why religious doctrines vary despite similar economies). |
  | 2    | Class-Struggle Determinism     | B-B-A-A-A | Class struggle as the universal driver, even when ideas (e.g., abolition) appear autonomous. |
  | 3    | Structuralist Marxism           | B-B-A-B-B | Production of ideas by the economy, while granting them "relative autonomy."                |
  | 4    | Political Marxism              | A-B-A-A-A | Limiting the theory to capitalism, given class struggle's role in pre-capitalist transitions. |
  | 5    | Market Selectionism            | A-C-A-A-B | Capitalism-specific scope, with markets only selecting/constraining (not producing) ideas.  |
  | 6    | Cultural Materialism           | B-B-A-A-B | Explanatory priority of the economy when culture appears autonomous (e.g., art or religion). |
  | 7    | Weak Constraint Universalism   | B-A-A-A-B | Productive forces as the driver, yet only constraining (not producing) ideas/institutions.  |
  | 8    | Market Determinism             | A-C-B-B-A | Markets fixing the content of ideas (e.g., why non-economic ethics persist in capitalism).  |
  | 9    | Unnamed (No Known Position)    | A-A-*-*-* | *Incoherent: Capitalism-specific scope with productive forces as driver ignores that forces develop in all societies.* |

  **Key for Reading Paths:**  
  - Start at **Node 1** (root commitment).  
  - Proceed to **Node 2**, then **Node 3**, **Node 4**, **Node 5**, and **Node 6** in sequence.  
  - Answers (A/B/C) determine the path to a leaf.  
  - *Example Path to Leaf 6 (Cultural Materialism):* B (universal) → B (class struggle) → A (constrains) → A (selects) → B (formal reservation).  

  **Unseparated Leaves & Empty Cells:**  
  - **No unseparated leaves:** All 8 positions have unique paths. The tree distinguishes them fully.  
  - **Empty cells (e.g., paths with no position):**  
    - **Universal + Market Driver (B-C-*):** Unattractive (markets are capitalist-specific; universalizing them ignores non-market societies).  
    - **Capitalism-Specific + Productive Forces (A-A-*):** Unexplored (no major position combines these, as productive forces are seen as transhistorical).  
    - **Fixation + Selection (*-B-A-*):** Incoherent (if the economy fixes content, ideas can't be "selected" from an independent pool).  

  **My Position: Leaf 6 (Cultural Materialism)**  
  **Why I Defend It:**  
  - **Node 2 (B):** Economic priority is universal but operates differently in non-capitalist societies (e.g., state-led industrialization responds to material pressures).  
  - **Node 3 (B):** Class struggle drove England's transition (e.g., peasant revolts), not abstract forces or markets. Poland diverged due to ruling-class power, not "backwardness."  
  - **Node 4 (A):** The economy constrains religion (e.g., capitalism favors adaptable beliefs) but doesn’t fix content (e.g., US evangelicalism draws from pre-capitalist theology).  
  - **Node 5 (A):** Abolitionist ideas arose independently (e.g., religious ethics) and were selected by industrial capitalism—they weren’t produced by it.  
  - **Node 6 (B):** Determination in the last instance is formal, not empirical. A theocracy’s stability doesn’t refute materialism; the economy sets the "rules" even if superstructures dominate for centuries.  

  **What This Tree Gets Right vs. Textbooks:**  
  - **Rejects crude binaries:** Textbooks reduce historical materialism to "determinism vs. autonomy," obscuring intermediate positions (e.g., Selection vs. Production). This tree forces nuance.  
  - **Cases over abstractions:** Using concrete examples (e.g., abolition, religious persistence) makes disagreements tangible—students can’t hide behind the base/superstructure metaphor.  
  - **Highlights key divides:** The tree isolates why "formal" determination (Node 6-B) matters—it avoids unfalsifiable empiricism (Node 6-A), which textbooks often gloss.  
  - **Genuine divisions:** Node 5 (abolition case) is split; I pick "selection" because moral arguments predate industrial capitalism. Others may disagree, but the tree forces engagement.
