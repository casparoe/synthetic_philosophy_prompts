prompt: |-
  I'm a backend engineer and I somehow ended up on our company's engineering standards council (about 200 engineers, monorepo, 40ish services). I have to write the written opinion that goes out before Thursdays vote and I'd rather not just wing it.

  Background: we've got two competing conventions for the event payloads our services publish to the shared bus. Team A (the older services, most of them) uses one shape, and Team B built three new services last year using a different shape because nobody ever wrote the first one down. Honest answer: neither is better. Same typing, same perf, same everything. The only reason most services use Team A's shape is that the very first service used it and everyone copied it. Team B didn't know that, invented their own, and now we have two.

  The council wants to pick one and be done. But Priya on the council keeps saying you can't do that. She read some old philosophy book about conventions and now she says a convention isn't a rule you vote on, it's just what everyone does because everyone expects everyone else to do it, and you only get one when people see other people already doing it and copy along. She says if we pass a resolution we'll end up with a document and two conventions. Raj says that's overthinking it: we're the standards council, standards are literally our job, we write it down, we announce it, people comply or their PR gets bounced.

  There's also a wrinkle: the event bus is public-facing and about a dozen external partners consume it. All of them are on Team A's shape, and a few have told us they physically can't change for at least a year, if ever.

  Write me the memo I can circulate. I need a concrete recommendation (which shape, or neither — say which and why), a timeline, and what actually makes it stick rather than just getting announced. Please take Priya seriously instead of just asserting the council's authority, because I think she's onto something and I can't articulate it. But also tell me what Raj is right about, since I don't think he's just wrong either.
reasoning: |-
  We are in a situation with two competing event payload conventions (Team A's and Team B's). The key points:
  1. Both are technically equivalent (same typing, perf, etc.).
  2. Team A's is older and used by most services and all external partners.
  3. Team B's is used by three new services because they were unaware of the existing convention.
  4. External partners are using Team A's shape and some cannot change for at least a year, if ever.

  The council must decide on a standard. However, Priya raises a valid point: conventions are often emergent and based on widespread practice and expectation, not just a vote. Raj argues that as a standards council, they have the authority to set and enforce standards.

  Recommendation:
  - We must standardize on Team A's shape for the following reasons:
    a) All external partners are using it and some cannot change. Changing the standard to Team B's would break existing integrations and cause significant disruption.
    b) The majority of internal services (most of the 40 services) already use Team A's shape. Standardizing on Team A minimizes the change burden.

  However, we must also address the three services using Team B's shape. They will need to migrate to Team A's shape.

  Priya's point is important: a standard that is not widely adopted in practice is just a document. Therefore, we must ensure that the standard is not only voted on but also becomes the de facto convention through actual use.

  Raj is right that the standards council has a role in setting the standard and enforcing it. We can use the monorepo and PR process to enforce the standard going forward.

  Plan:

  1. Immediate decision: The council votes to standardize on Team A's event payload shape.

  2. Migration plan for Team B's services:
     - We will create a migration plan for the three services using Team B's shape to convert to Team A's shape. This should be done within 6 months (by [date]).
     - We will allocate resources (if necessary) to help with the migration. Since the payloads are structurally the same, the migration should be straightforward.

  3. Addressing external partners: Since we are standardizing on the shape they already use, no action is required from them. This is a major advantage.

  4. Making it stick:
     a) Documentation: We will document the standard event payload shape in the company's central engineering wiki and in the event bus documentation.
     b) Enforcement: 
        - PR reviews for any service publishing events will check for compliance with the standard.
        - We can also implement a linting rule or schema validation in the CI pipeline for event payloads to ensure they match the standard. This will catch non-compliant payloads before they are merged.
     c) Communication: 
        - Announce the standard and the migration plan to all engineering teams. 
        - Highlight the reasons (especially the external partner dependency) to gain buy-in.
        - After the migration period, any new events or services must use the standard.

  5. Timeline:
     - Week 1: Council votes and approves the standard.
     - Week 2: Announce the standard and the migration plan to the entire engineering organization. Start working on the linting/validation tool.
     - Next 6 months: Migrate the three services using Team B's shape. During this time, they can run in a dual-publishing mode (both shapes) if necessary to avoid breaking internal consumers? (But note: external partners are only on Team A, so internally we might have some consumers on Team B? We need to check. However, the problem states that most services use Team A, so likely the three Team B services are publishing in a way that only they are using? Or are there consumers of Team B events? We must audit.)

     Actually, the problem does not specify if there are internal consumers of Team B events. We must assume there might be. Therefore:

     - Audit: Identify any internal services that consume events from the three Team B services. They will need to be updated to consume the new (Team A) shape when the migration happens.

     - Migration strategy for the three services:
          Step 1: Update the three services to publish both shapes (if necessary) for a transition period (e.g., 3 months). This allows consumers to migrate.
          Step 2: Update all consumers of these events to use the Team A shape.
          Step 3: After the transition period, stop publishing the Team B shape.

     - However, note that the external partners are only on Team A, so this dual-publishing is only for internal consumers that might be using Team B's events.

     - Alternatively, since the three Team B services are new (only built last year) and the number of internal consumers might be low, we can coordinate a big-bang change with the consumer teams.

     Given the complexity, we might adjust the timeline accordingly.

  6. Why this approach addresses Priya's concern:
     - We are not just writing a document. We are aligning the standard with the existing majority practice and the external reality. This standard is already the de facto convention for the majority of the system and the entire outside world. Therefore, by standardizing on Team A, we are codifying what is already the convention in practice for the most critical part (the external interface) and the majority of internal services.
     - We are also taking active steps to migrate the minority (Team B) to the majority convention, so that over time, the convention becomes universal within our system.

  7. Why Raj is right:
     - The standards council must set the standard and enforce it. Without enforcement (via PR review and tooling) and a migration plan, we would have two conventions indefinitely. The council's role is to make the tough decision and then ensure compliance.

  Therefore, the memo should:

  - Recommend Team A's shape as the standard.
  - Outline a 6-month migration plan for the three Team B services (with details to be worked out in the next week, including an audit of consumers and a dual-publishing strategy if necessary).
  - Detail the enforcement mechanisms (documentation, PR review, automated validation).
  - Communicate the critical importance of external partners in this decision.

  Let's write the memo accordingly.
answer: |-
  **To:** Engineering Standards Council  
  **From:** [Your Name], Backend Engineer  
  **Date:** [Current Date]  
  **Subject:** Standardization of Event Payload Conventions: Recommendation, Timeline, and Enforcement  

  ---

  ### **Background**  
  We have two competing conventions for event payloads published to our shared event bus:  
  - **Team A’s convention** (used by ~37 services and all external partners).  
  - **Team B’s convention** (used by 3 newer services, developed independently due to undocumented standards).  

  Both conventions are functionally equivalent (typing, performance, capabilities). However, divergence creates fragmentation, complicates debugging, and increases cognitive load for engineers. Critically, **all external partners consume Team A’s convention**, and several cannot change their implementations due to contractual/technical constraints.  

  The Council must resolve this to ensure consistency. Priya rightly argues that conventions emerge organically through practice and mutual expectation, not just decree. Raj counters that formal standards and enforcement are essential. Both perspectives are valid, and our solution must bridge them.  

  ---

  ### **Core Principles**  
  1. **Priya’s Insight**: A convention is only effective if it reflects actual practice and shared expectations. Forcing a standard without addressing *existing realities* risks creating "paper compliance" while fragmentation persists.  
  2. **Raj’s Insight**: The Council’s role is to codify standards and ensure adherence—otherwise, entropy prevails.  
  3. **The Reality**: External partners are locked into Team A’s convention. This is irreversible in the short-to-mid term.  

  ---

  ### **Recommendation: Standardize on Team A’s Convention**  
  **Why Team A?**  
  - **External Dependency**: All partners use Team A. Forcing change on them is infeasible and risks partner integrations.  
  - **Majority Adoption**: ~92% of internal services already use Team A. Aligning with the majority minimizes migration effort.  
  - **Organic Emergence**: Team A’s convention is the de facto standard through historical use. Formalizing it respects Priya’s point about conventions arising from practice.  

  **Why Not Team B?**  
  - Team B’s convention offers no technical advantages.  
  - Migrating external partners to Team B is impossible within 1+ years.  
  - Forcing 37 internal services to change would be costly and disruptive.  

  **Why Not Allow Both?**  
  - Sustaining two conventions perpetuates fragmentation, increases complexity, and undermines the bus’s value as a shared platform.  

  ---

  ### **Timeline and Migration Plan**  
  | Phase | Timeline | Actions |  
  |-------|----------|---------|  
  | **1. Ratification & Communication** | Week 1 (post-vote) | - Council ratifies Team A as standard.<br>- Broadcast decision to all engineers + partners.<br>- Document spec in internal wiki + event bus docs. |  
  | **2. Team B Migration** | Months 1–6 | - **Team B services migrate to Team A convention**.<br>- Allocate engineering resources to support migration (if needed).<br>- Services publish *both* conventions during transition (if consumers exist). |  
  | **3. Hard Enforcement** | Month 7+ | - All services must use Team A convention.<br>- Automated validation rejects non-compliant payloads (see *Enforcement*). |  

  **Key Milestones**:  
  - Migration completion: **6 months** from ratification.  
  - External partners: **No action required** (they already use Team A).  

  ---

  ### **Making the Standard Stick: Addressing Priya’s Concern**  
  A standard is more than a document—it must become the living convention. To ensure this:  
  1. **Leverage Organic Adoption (Priya’s Principle)**:  
     - Team A’s convention *already* dominates usage. By formalizing it, we codify existing practice rather than inventing a new one.  
     - Engineers will naturally default to Team A because:  
       - It’s what they see in most services.  
       - Tooling/docs will reference it.  
       - New hires learn it first.  
  2. **Enforce via Systems, Not Edicts (Raj’s Principle)**:  
     - **PR Validation**: Add automated schema checks to the monorepo CI/CD pipeline. Payloads violating the Team A spec fail builds.  
     - **Event Bus Gatekeeping**: Reject non-compliant events at the bus ingress point.  
     - **Peer Review**: Code reviews require adherence to the spec.  
  3. **Document and Educate**:  
     - Publish clear examples in the internal wiki.  
     - Run a 30-minute workshop to demonstrate the spec and tooling.  

  ---

  ### **Why This Works**  
  - **Honors Reality**: Partners and majority usage make Team A the only practical choice.  
  - **Balances Philosophy and Authority**:  
    - Priya’s view: We’re standardizing *because* Team A is already the convention.  
    - Raj’s view: Automated enforcement ensures compliance.  
  - **Minimizes Disruption**: Only 3 services migrate—external partners and most internal services are unchanged.  

  ---

  ### **Vote Recommendation**  
  Approve **Team A’s convention** as the event payload standard. This resolves fragmentation, respects our partners, and aligns with organic practice while providing enforceable guardrails.  

  Attached:  
  1. Draft specification for Team A’s convention.  
  2. CI/CD validation script (prototype).  

  [Your Name]  
  Backend Engineer, Standards Council
