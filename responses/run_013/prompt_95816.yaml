  ### Jurisprudence Seminar: Decision Tree on Legal Enforcement of Morality  
  *Answer the following questions to locate your position. Proceed sequentially without prior knowledge of theorists.*

  #### Branch Nodes  
  1. **Should the state ever use coercion (criminal punishment or civil/regulatory penalties) to prevent conduct solely because it is immoral?**  
     - **Yes** → Go to 2  
     - **No** → Go to 3  

  2. **What is the primary justification for intervening against immorality?**  
     - **A: The intrinsic wrongness of the act (it deserves condemnation/punishment).** → Go to 4  
     - **B: The downstream effects on society (e.g., eroding shared values or social cohesion).** → Go to 4  

  3. **Should the state ever use non-coercive means (e.g., education, subsidies, symbolic expression) to promote morality?**  
     - **Yes** → Go to 5  
     - **No** → Leaf 9  

  4. **Which moral standard should guide state intervention?**  
     - **A: Society’s actual, widely accepted morality.** → Go to 6  
     - **B: A critical morality (corrected for societal biases/errors).** → Go to 6  

  5. **Which moral standard should guide non-coercive promotion?**  
     - **A: Society’s actual morality.** → Leaf 1  
     - **B: A critical morality.** → Leaf 2  

  6. **Does the reason to intervene hold if the conduct is secret (no one observes it) and the only complaint is that others would disapprove if they knew?**  
     - **Yes** → Go to 7  
     - **No** → Go to 7  

  7. **Should the state intervene only when the conduct is public?**  
     - **Yes** → Go to 8  
     - **No** → Go to 8  

  8. **Final branch for coercion:**  
     - *Combines answers from 2, 4, and 6 to assign leaves 3–10.*  

  ---

  #### Leaves Table  
  *Views on when the state may act due to immorality. "Awkward commitment" denotes a key vulnerability.*  

  | Leaf | Name                          | View (One Sentence)                                                                 | Awkward Commitment                                                                 |
  |------|-------------------------------|-------------------------------------------------------------------------------------|------------------------------------------------------------------------------------|
  | 1    | Non-coercive Actual Moralism  | The state may promote society’s actual morality non-coercively (e.g., education), but never coercively. | May require promoting standards the state knows are flawed.                         |
  | 2    | Non-coercive Critical Moralism| The state may promote a critical morality non-coercively, but never coercively.     | May impose standards society rejects as alien or elitist.                          |
  | 3    | Retributive Moralism (Actual) | Society’s actual immorality, even secret, justifies coercion because wrongdoing intrinsically deserves punishment. | May criminalize harmless conduct society mistakenly condemns.                      |
  | 4    | Retributive Moralism (Critical)| Critical immorality, even secret, justifies coercion because wrongdoing intrinsically deserves punishment. | May criminalize conduct society does not view as wrong.                            |
  | 5    | Social Cohesion Moralism (Strong) | Society’s actual immorality, even secret, justifies coercion to prevent erosion of shared values. | May criminalize private acts unknown to others, based on speculative societal harm. |
  | 6    | Offence Principle             | Society’s actual immorality justifies coercion only when public (it causes offence/undermines public order). | May criminalize harmless public acts that offend majorities.                        |
  | 7    | Critical Social Cohesion      | Critical immorality, even secret, justifies coercion to protect cohesion based on sound morality. | May criminalize conduct society accepts to uphold an unshared moral order.          |
  | 8    | Public Critical Moralism      | Critical immorality justifies coercion only when public (to reinforce a sound public moral order). | May criminalize public acts society deems permissible.                              |
  | 9    | No Enforcement                | The state should never act because an act is immoral (coercive or non-coercive).    | Forbids state-sponsored moral education, even non-coercive.                         |
  | 10   | *Unnamed*                     | Critical immorality justifies coercion only when public (grounded in intrinsic wrongness). | May fail to punish secret critical wrongs despite their desert.                     |
  | 11   | *Unnamed*                     | Society’s actual immorality justifies coercion only when public (grounded in social cohesion). | Converges with Leaf 6; no case distinguishes them (see diagnostics).               |

  ---

  #### Validation Against Cases  
  *Verdicts: "Allow" = state intervention permitted; "Disallow" = no intervention.  
  Cases:  
  (a) Consensual incest between adults, private.  
  (b) Public desecration of revered symbol (no physical harm).  
  (c) Practice participants see as permissible, majority condemns if known (assume secret).  
  (d) Conduct majority condemns, philosophers deem permissible (assume private).*  

  | Leaf | (a)         | (b)     | (c)         | (d)         | Notes                                                                 |
  |------|-------------|---------|-------------|-------------|-----------------------------------------------------------------------|
  | 1    | Allow (NC)  | Allow (NC) | Allow (NC)  | Allow (NC)  | Non-coercive (NC) action allowed if society condemns.                |
  | 2    | Allow (NC)  | Allow (NC) | Disallow    | Disallow    | Non-coercive only if critical morality condemns.                     |
  | 3    | Allow       | Allow   | Allow       | Allow       | Coercion allowed if society condemns, even private/secret.           |
  | 4    | Allow       | Allow   | Disallow    | Disallow    | Coercion only if critical morality condemns; (c) and (d) not condemned. |
  | 5    | Allow       | Allow   | Allow       | Allow       | Coercion to protect cohesion, even if secret.                        |
  | 6    | Disallow    | Allow   | Disallow    | Disallow    | Coercion only if public; (a), (c), (d) private/secret.               |
  | 7    | Allow       | Allow   | Disallow    | Disallow    | Coercion if critical condemns, even secret.                          |
  | 8    | Disallow    | Allow   | Disallow    | Disallow    | Coercion only if public + critical condemns; (a) and (d) private.    |
  | 9    | Disallow    | Disallow | Disallow    | Disallow    | No action for immorality ever.                                       |
  | 10   | Disallow    | Allow   | Disallow    | Disallow    | Same as Leaf 8; no case distinguishes (intrinsic vs. downstream).    |
  | 11   | Disallow    | Allow   | Disallow    | Disallow    | Same as Leaf 6; no case distinguishes (intrinsic vs. downstream).    |

  - **Identical verdicts**:  
    - Leaves 6 and 11 share verdicts. *Separating case*: Public act society condemns but critical morality permits (e.g., flag-burning in a liberal democracy). Leaf 6 allows (society condemns), Leaf 11 disallows (critical permits).  
    - Leaves 8 and 10 share verdicts. *Nothing separates them*; intrinsic vs. downstream grounds converge when publicity and critical standard are fixed.  
    - Leaves 3 and 5 share verdicts. *Separating case*: Secret act society condemns but causes no social harm (e.g., private prayer in a banned religion). Leaf 3 allows (intrinsic wrongness), Leaf 5 disallows (no cohesion threat).  

  ---

  #### Unoccupied Combinations: Diagnostics  
  *Combinations not mapped to any leaf, with reasons.*  

  1. **Coercion + Non-coercive promotion based on different standards** (e.g., coerce actual immorality but promote critical morality non-coercively).  
     - *Diagnosis*: **Unexplored**. Logically coherent but rarely defended; no clear rationale for asymmetry.  
  2. **Coercion for critical immorality only if secret (not public)**.  
     - *Diagnosis*: **Incoherent**. Secret acts lack public denunciation/offence; no grounds to privilege secrecy.  
  3. **Non-coercive promotion forbidden, but coercion allowed for downstream effects with critical morality**.  
     - *Diagnosis*: **Unattractive**. Arbitrarily bars mild interventions (e.g., education) while allowing harsh ones.  

  ---

  #### Tree Limitations  
  - **Leaves 6 and 11** (Offence Principle vs. unnamed public-social-cohesion) **cannot be separated** by the tree. Both require publicity and actual morality; intrinsic vs. downstream grounds yield identical verdicts in all cases.  
  - **Leaves 8 and 10** (Public Critical Moralism vs. unnamed public-intrinsic-critical) **cannot be separated**. Instrument (coercion/publicity) and standard (critical) override grounds (intrinsic/downstream).  
  - **Why**: Grounds (intrinsic vs. downstream) become irrelevant when publicity is required and the moral standard is fixed. This reflects a convergence in practical outcomes despite theoretical distinctions.  

  *End of handout.*
