          If A gets the facility, they can receive money from B (m), which can be positive or negative? But if negative, A pays B. We'll allow.

     However, the parties might not accept negative payments. Let's assume m>=0 always and paid by the one who does not get the facility? Or by the city? This is a public-sector dispute. Assume there is a fixed budget of $1M that can be allocated as compensation.

     So:
          Option 1: A gets the facility and some money m from the budget (so A gets m dollars, and B gets nothing).
          Option 2: B gets the facility and some money m from the budget (so A gets m dollars, and B gets the facility).

     The total money m is between 0 and 1M.

     Utilities:
          For Option 1:
              u_A = value of facility to A + m = 800 + m   (in $K)
              u_B = 0 + (1000 - m)   [because the budget is 1000, and if m is given to A, then B gets 1000-m? But wait, the budget is from the city, not from B. So B's utility should not include the unspent money? Or does it? Let's assume the money not given to A is available for B's projects. So B cares about the money not spent on A. Then u_B = 1000 - m.

          For Option 2:
              u_A = m
              u_B = 1200 + (1000 - m) = 2200 - m

     Disagreement: (0,0)

