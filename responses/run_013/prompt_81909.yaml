  ### Kalai-Smorodinsky Mediation Procedure  
  **Core Principle**: The settlement point \( (u_1, u_2) \) must satisfy:  
  \[ \frac{u_1 - d_1}{u_1^* - d_1} = \frac{u_2 - d_2}{u_2^* - d_2} \]  
  where \( (d_1, d_2) \) = disagreement point (no deal), \( (u_1^*, u_2^*) \) = ideal point (best feasible outcome for each side).  

  ---

  ### Step-by-Step Procedure  
  #### **Phase 1: Establish Disagreement Point (\(d_1, d_2\))**  
  1. **Question to parties**:  
     *"If we fail to agree, what happens? Quantify impacts per issue (e.g., dollars, days, non-monetary harm)."*  
  2. **Credibility checks**:  
     - Require documentation (e.g., current contracts, budgets, legal precedents).  
     - Use objective benchmarks (e.g., market rates, regulatory minimums).  
     - **Judgment call**: If parties inflate values, set \(d_i\) at the **verifiable lower bound** (e.g., statutory minimum wage if union claims "$0 wages", or last year’s budget if department claims "total shutdown").  

  #### **Phase 2: Establish Ideal Points (\(u_1^*, u_2^*\))**  
  1. **Question to parties**:  
     *"What is your best realistic outcome on each issue? What evidence supports this as achievable?"*  
  2. **Credibility checks**:  
     - Cap claims at **highest historical precedent** (e.g., max raise in comparable cities, largest budget ever approved).  
     - For non-monetary issues (e.g., "flexible hours"), scale 0–100:  
       - Ask: *"Rate your satisfaction if we fully meet your demand vs. disagreement."*  
       - Anchor 100 at best **industry-standard outcome** (e.g., telework policies in peer agencies).  
     - **Judgment call**: Reject ideals that violate **feasibility tests** (e.g., "120% raises" if treasury data shows 5% max).  

  #### **Phase 3: Scale Non-Monetary Issues**  
  1. **Utility conversion**:  
     - For issues like "workload" or "environmental impact":  
       - Define a **linear scale** from \(d_i\) (0%) to \(u_i^*\) (100%).  
       - *Example*: Union rates "safety inspections" at:  
         - \(d_{\text{union}} = 0\) (current 1/week),  
         - \(u_{\text{union}}^* = 100\) (ideal 5/week).  
       - City rates same issue:  
         - \(d_{\text{city}} = 0\) (status quo),  
         - \(u_{\text{city}}^* = 100\) (ideal cost-free automation).  
  2. **Weight issues**:  
     - Ask parties: *"Assign 100 points across issues based on importance."*  
     - **Judgment call**: If weights are asymmetric (e.g., union prioritizes wages, city prioritizes productivity), retain party-specific weights.  

  #### **Phase 4: Compute Kalai-Smorodinsky Solution**  
  1. **Calculate normalized gains**:  
     - For any proposal, compute:  
       \[ g_i = \frac{u_i - d_i}{u_i^* - d_i} \]  
     - Goal: Find terms where \( g_1 = g_2 \).  
  2. **Handle non-convexity (indivisible items)**:  
     - If an item is all-or-nothing (e.g., "build community center"), **split negotiation**:  
       - **Case A**: Item awarded to Party 1. Negotiate remaining issues → compute \(g_1^A, g_2^A\).  
       - **Case B**: Item awarded to Party 2. Negotiate remaining issues → compute \(g_1^B, g_2^B\).  
     - **Choose the case** where \(\min(g_1, g_2)\) is maximized.  
  3. **Iterative proposal testing**:  
     - Start with high \(k\) (e.g., 80% of ideal gain). Ask:  
       *"Can you accept outcomes giving each side \(k\%\) of their ideal gain?"*  
     - Adjust \(k\) down until parties jointly confirm feasibility.  
     - **Judgment call**: If deadlocked, set \(k\) at the **midpoint of the last feasible/infeasible bids**.  

  #### **Phase 5: Finalize and Write Proposal**  
  - **Draft terms** matching the \(k\%\) gain point.  
  - **Verify** no party falls below \(d_i\).  
  - **Publish rationale**: *"This splits the relative gain equally from the worst-case scenario."*  

  ---

  ### Case 1: Salary vs. Staffing Dispute (Commissioner-Hated Outcome)  
  **Parties**: City Managers (CM) vs. Public Works Union (PWU).  
  - **Issues**:  
    | Issue        | PWU Disagreement (\(d\)) | PWU Ideal (\(u^*\)) | CM Disagreement (\(d\)) | CM Ideal (\(u^*\)) |  
    |--------------|---------------------------|---------------------|--------------------------|-------------------|  
    | Salary hike  | 0%                        | 5%                  | 0%                       | 0% (freeze)       |  
    | New hires    | 0 hires                   | 10 hires            | 0 hires                  | –5 hires (cuts)   |  
  - **Utility scaling**:  
    - PWU weights: Salary 70%, Hires 30%.  
    - CM weights: Salary 50%, Hires 50%.  
    - *Hires scaled linearly*: 0 hires = 0, 10 hires = 100 (PWU); –5 hires = 100, 0 hires = 0 (CM).  
  - **KS calculation**:  
    - KS requires equal *relative gain* (\(g_{\text{PWU}} = g_{\text{CM}}\)).  
    - City’s ideal salary is 0% (same as \(d_{\text{CM}}\)), so \(u_{\text{CM}}^* - d_{\text{CM}} = 0\) → infeasible!  
    - **Resolution**: Reset CM’s salary ideal at **inflation rate (2%)** (highest feasible per treasury).  
    - Outcome:  
      - Salary: 2.5% hike (equal gain: PWU gets 50% of ideal, CM "gains" 50% by avoiding 5%).  
      - Hires: 3 new hires (PWU: 30% gain; CM: 40% gain from worst-case cuts).  
  - **Why commissioner hates it**:  
    - CM must defend a raise despite preferring 0%. KS forces compromise when one side’s "ideal" is static.  

  ---

  ### Case 2: Park Land vs. School Funding (Indivisible Item)  
  **Parties**: School Board (SB) vs. Environmental Group (EG).  
  - **Issues**:  
    - **Indivisible**: Preserve wetland (yes/no).  
    - **Divisible**: School funding ($0–$10M).  
  - **Disagreement (\(d\))**: No preservation, $0 funding.  
  - **Ideals (\(u^*\))**:  
    | Party | Wetland? | Funding Ideal |  
    |-------|----------|--------------|  
    | EG    | Yes      | $0           |  
    | SB    | No       | $10M         |  
  - **Utilities**:  
    - EG: Preservation = 100% gain, funding irrelevant.  
    - SB: $10M = 100% gain, preservation = 0% gain.  
  - **KS paths**:  
    - **Case A (Preserve)**:  
      - EG gains 100%.  
      - SB utility: Funding at \(x\). Gain = \(\frac{x - 0}{10 - 0} = \frac{x}{10}\).  
      - Equal gains: \(1 = \frac{x}{10}\) → \(x = $10M\) → SB gain = 100%.  
    - **Case B (No preserve)**:  
      - EG gain = 0%.  
      - SB sets funding at $10M → gain = 100%.  
      - Equal gains: \(0 \neq 100\) → invalid.  
  - **Outcome**:  
    - **Case A chosen** (preserve wetland, fund schools at $10M) → both gain 100%.  
  - **Ordering paradox**:  
    - If funding negotiated first, KS splits gains equally *without* considering preservation. EG gets $0, SB gets $5M, wetland lost.  
    - **Resolution**: **Order indivisible items first** in KS to avoid skew.  

  ---

  ### Limits of the Procedure  
  1. **Non-convex feasible sets**:  
     - Fails if >1 indivisible item creates discontinuous frontiers (e.g., multiple land parcels).  
     - **Fallback**: Mediator sets Pareto-optimal outcome via direct proposal.  
  2. **Strategic misrepresentation**:  
     - Fails if parties lie about \(d_i\) or \(u_i^*\) and verification is impossible.  
     - **Fallback**: Use revealed preferences (e.g., past settlements) to override claims.  
  3. **Non-linear utilities**:  
     - Fails if gains diminish exponentially (e.g., first $1M matters more than second).  
     - **Fallback**: Switch to Nash bargaining if parties accept risk-aversion adjustments.  

  ### Critical Property: **Monotonicity**  
  - *Definition*: If the feasible set expands in favor of one party, they shouldn’t be worse off.  
  - **Where it fails**: **Deadline effects**. If parties know concessions will improve as a deadline nears, they may collapse talks early to manipulate \(d_i\).  
    - *Example*: Union strikes before budget talks conclude to lock in low \(d_{\text{city}}\) (current year’s budget).  

  ### Summary  
  Use this procedure for multi-issue disputes with verifiable ranges. Override it for:  
  - High-stakes indivisible items (e.g., constitutional rights),  
  - When parties have asymmetric information about feasibility,  
  - If external deadlines force non-monotonic dynamics.
