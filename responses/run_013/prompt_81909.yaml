          They want the facility and the entire budget not spent on A (i.e., m=0) then u_B=2200. If they don't get the facility, the best is m=0 and then u_B=1000 (because 1000 -0 =1000). So ideal is 2200.

     Now, we consider two allocations:

     Allocation 1: A gets the facility.
          Feasible set: u_A = 800 + m, u_B = 1000 - m, for m in [0,1000].
          The Pareto frontier: as m increases, u_A increases and u_B decreases.

     Allocation 2: B gets the facility.
          Feasible set: u_A = m, u_B = 2200 - m, for m in [0,1000].

     Now, the Kalai-Smorodinsky solution:

     For Allocation 1:
          We want to find a point (u_A, u_B) such that:
              (u_A - 0) / (1800 - 0) = (u_B - 0) / (2200 - 0)
          and u_A = 800+m, u_B=1000-m.

          So:
              u_A / 1800 = u_B / 2200
              => (800+m) / 1800 = (1000-m) / 2200

          Solve for m:
              2200*(800+m) = 1800*(1000-m)
              1,760,000 + 2200m = 1,800,000 - 1800m
              2200m + 1800m = 1,800,000 - 1,760,000
              4000m = 40,000
              m = 10

          Then u_A = 800+10 = 810, u_B = 1000-10 = 990.
          The ratio: 810/1800 = 0.45, 990/2200 = 0.45.

     For Allocation 2:
          We want:
              u_A / 1800 = u_B / 2200
              => m / 1800 = (2200 - m) / 2200

          Solve:
              2200 * m = 1800 * (2200 - m)
              2200m = 1800*2200 - 1800m
              2200m + 1800m = 3,960,000
              4000m = 3,960,000
              m = 990

          Then u_A = 990, u_B = 2200 - 990 = 1210.
          The ratio: 990/1800 = 0.55, 1210/2200 = 0.55.

     Compare the ratios: Allocation 1 gives 0.45, Allocation 2 gives 0.55. So we choose Allocation 2 (B gets the facility) with m=990 (so A gets $990K).

     But note: the utility for A is 990 and for B is 1210. This seems to favor B, but relatively they both get 55% of their ideal.

     However, the ordering of the items matters. We assumed that the money is given to the party that does not get the facility. But what if we allowed side payments in any allocation? Then the feasible set would be the convex hull? We might have a different outcome.

     What if we combined the two allocations by allowing a lottery? Then we could achieve any point in between. But in public sector, lottery is not typically used.

     Alternatively, if we allowed the possibility of splitting the facility (which is indivisible), we can't.

     This example shows that the allocation of the indivisible item changes the outcome.

  **What the procedure cannot do:**

     - It cannot handle non-convex feasible sets well (though we try by considering discrete allocations).
     - It relies on the parties being honest about their utilities and the feasible set. If they misrepresent, the solution is not fair.
     - It assumes that the utility functions are linear and additive, which might not be the case.
     - It might be computationally complex for many issues.
     - It requires the mediator to make judgment calls, especially on the disagreement point and the ideal point.

  **The property the whole thing rests on: Pareto optimality and the axiom of Independence of Linear Transformations (invariance to affine transformations).**

  **Point in a live negotiation where that property is most likely to be false:**
     - The affine invariance assumes that the utility functions are measured on an interval scale. This is reasonable. However, the most critical point where the method might fail is when the feasible set is not convex (and we cannot convexify it by lotteries) and when the parties' utilities are not additive or not linear, which breaks the affine invariance in practice. Additionally, if the parties are not rational utility maximizers, or if they have external pressures that are not captured in the utility functions, the solution might not be implementable.
