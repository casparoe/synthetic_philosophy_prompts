answer: |-
  **Exam Question**  
  Imagine a central planning authority equipped with a computational device capable of instantly solving the full general-equilibrium optimization problem for a socialist economy—any objective function (e.g., social welfare maximization) and any dataset (e.g., resource constraints, technological possibilities) can be processed perfectly. Mises’s original calculational challenge appears resolved: rational allocation now seems computationally tractable. Yet Hayek’s critique emphasized the "knowledge of the particular circumstances of time and place"—arguing that such data cannot be aggregated meaningfully. Does this computational planner dissolve Hayek’s knowledge problem, or does it merely relocate it? In your answer, precisely define what Hayek’s knowledge problem *is* (distinguishing it from computational tractability and incentive issues), then evaluate whether the planner’s computer eliminates this problem. Address the following: Can all economically relevant knowledge—including tacit knowledge and preferences revealed only through market action—be feasibly codified into data for the planner? If not, why? Does the planner’s access to unlimited processing power alter the *nature* of the knowledge required? Conclude by explaining where the claim "Hayek’s problem was just a bandwidth limitation" succeeds and where it fundamentally misunderstands his argument.  

  ---

  **Model Answer (Approx. 600 words):**  

  Hayek’s knowledge problem contends that efficient economic coordination requires leveraging dispersed, contextual information—knowledge of local conditions, fleeting opportunities, or subjective valuations—that is inherently *practical* (tacit) and *idiosyncratic*. Crucially, this knowledge is often non-articulable (e.g., a shopkeeper’s intuition about shifting local demand) or only emerges through the competitive discovery process of rivalrous markets (e.g., entrepreneurs testing new production methods). For Hayek, prices are not mere signals but *telecommunications* devices that summarize and transmit this inarticulate knowledge without requiring central aggregation. His argument is epistemological, not computational: even with perfect optimization algorithms, the planner lacks the *raw epistemic inputs* needed to solve the allocation problem meaningfully.  

  The computational planner relocates, but does not dissolve, this problem. Unlimited processing power addresses Mises’s *calculational* challenge—solving equations—but not Hayek’s *informational* challenge: acquiring the necessary data. Three issues persist. First, **tacit knowledge cannot be fully codified**. The planner must rely on agents reporting their local knowledge (e.g., a factory manager’s awareness of a machine’s subtle inefficiency). Yet without market discipline (profit/loss) or genuine ownership, agents lack incentive to diligently discover or truthfully report such information. This intersects with incentive problems but is distinct: even with perfect honesty, some knowledge (e.g., a worker’s skill in adapting tools) defies formal articulation. Second, **preferences are not pre-formed data** but are *revealed* through competitive bidding under scarcity. The planner’s computer can optimize against *stated* preferences (e.g., survey data), but these are hypothetical and prone to misrepresentation (e.g., overstating desire for subsidized goods). Markets force *action-backed* revelation: paying a price demonstrates authentic valuation. Without prices emerging from exchange, the planner lacks a mechanism to validate preferences. Third, **dynamic discovery is stifled**. Markets generate knowledge through entrepreneurial experimentation (e.g., testing a new material). The planner’s static dataset—even if initially comprehensive—cannot incorporate unforeseen innovations until they occur *and* are reported, creating lags. The computer optimizes a snapshot, but the economy is a film.  

  The claim that "Hayek’s problem was just bandwidth" correctly identifies that 1930s computational limits made centralization *technically* implausible, but misrepresents Hayek’s core thesis. Bandwidth constraints are solvable with better hardware (as here); the deeper issue is the *nature* and *generation* of knowledge. Markets don’t merely *transmit* data—they *produce* it through rivalry and exchange. The planner’s computer, by relying on pre-defined data, assumes knowledge is static, transferable, and separable from the competitive process that creates it. Where the "bandwidth" view succeeds is in highlighting that, absent Hayek’s epistemic concerns, Mises’s calculation problem *is* computable. But it fails by reducing Hayek to a technologist. His argument is that the knowledge required *does not exist* in centralized form—not that it exists but is too bulky to process. Thus, the computational planner shifts the bottleneck from solving equations (handled by the computer) to data acquisition (still mired in incentives, articulation barriers, and missing discovery mechanisms), leaving Hayek’s critique intact.  

  ---

  **Marking Scheme (Total: 20 points):**  
  **A Answer (18–20):** Rigorously distinguishes Hayek’s *knowledge problem* (tacit/dispersed/dynamically generated information) from computational *tractability* and incentive alignment. Explicitly argues that the planner’s computer dissolves Mises’s problem but not Hayek’s. Identifies three relocated problems: (1) codification of tacit knowledge, (2) revelation of preferences via market action (not surveys), and (3) suppression of entrepreneurial discovery. Explains why "bandwidth" misreads Hayek (knowledge is not centralized *in principle*, not just *in practice*). Notes that incentives compound but do not define the epistemic issue.  

  **B Answer (15–17):** Correctly separates knowledge from computation but conflates knowledge with incentives or underdevelops key nuances. May note codification issues but omit preference revelation or dynamic discovery. Treats "bandwidth" as a partial but incomplete solution without fully dissecting Hayek’s epistemology. Might claim the computer solves Hayek if "data is perfect" without interrogating how data could be perfect absent markets.  

  **C Answer (12–14):** Summarizes Hayek vaguely ("local knowledge matters") without defining its distinct character. Focuses on computational power dissolving Mises but only superficially addresses Hayek. May reduce the problem to incentives (e.g., "people won’t report truthfully") or bandwidth ("computers fix it"). Neglects preference revelation or tacit knowledge.  

  **D/E Answer (≤11):** Rehearses debate history without engaging the hypothetical. Fails to define Hayek’s knowledge problem or conflates it with Mises/Lange. Treats the computer as a panacea without critique.  

  **Key Differentiators for A vs. B:**  
  - **A** explicitly names "preference revelation through market action" as irreplaceable by surveys.  
  - **A** frames tacit knowledge as *non-articulable in principle*, not just costly to report.  
  - **A** identifies market rivalry as *generating* knowledge, not just transmitting it.  
  - **B** mentions "data collection difficulties" without specifying *why* they are insurmountable absent markets.  
  - **A** rejects "bandwidth" as misreading Hayek; **B** may call it "outdated but partially right."  

  ---  
  *This question forces engagement with Hayek’s epistemology while leveraging the computational twist to expose lingering tensions. The model answer and scheme prioritize precision on knowledge dynamics—ensuring students can’t succeed via rote summary.*
