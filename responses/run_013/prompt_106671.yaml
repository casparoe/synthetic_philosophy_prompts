prompt: |-
  So I'm in this reading group on democracy and we keep going round in circles, because half the room thinks more competent people should have more say is obviously right and the other half thinks it's obviously a non-starter, and nobody can actually say what the disagreement is. I want to settle it with a decision tree instead of more arguing.

  Can you build me a flowchart that starts from the thing almost everyone in the room already excepts -- that voters are often ignorant, that some people understand policy much better than others, and that it would be better if our collective decisions were more often correct -- and then branches on the questions that actually split the positions, ending in named leaves.

  A few branch points I specifically want in there:
  - whether there's a fact of the matter about the right policy independent of what people want, or whether correct just means whatever comes out of a fair procedure
  - whether the right answer is reachable by ordinary people under good conditions (deliberation, decent info) or genuinely needs expertise
  - whether expertise is measurable and stable enough to license giving anyone formal extra power, as opposed to just tinkering with institutions so they track truth better
  - whether the relevant competence is individual or a property of groups (crowds, deliberation, diverse problem-solvers)
  - where legitimacy is supposed to come from once equal votes are off the table: correctness, consent, or contestability

  Leaves I want to see at minimum: restricted suffrage (a competence test for the franchise), plural voting (extra votes for the competent), an epistocratic veto (a competent chamber that can block legislation), lottocracy / rule by lot, deliberative mini-publics with real power, technocracy via insulated agencies, futarchy-style outcome-betting, liquid / delegable voting, and the pure proceduralist option that says the whole truth-tracking framing is a mistake. If some leaf needs a name nobody's coined, just call it unnamed and say so.

  Then the part I actually care about. I have a half-baked proposal of my own and I want to know where it lands: a bicameral setup where one house is elected normally and the other is drawn by lot from everyone who passes a short exam on basic stats and civics, and the lot-house gets a suspensive veto over any bill that fails a pre-registered cost-benefit test. Where does that sit, which existing leaf is it closest to, and what would have to change about it to push it into a different leaf?

  Also: show me the combinations of answers that don't line up with any real position, and for each say whether that's because the view is incoherent, unattractive, or just unexplored. And flag any two leaves your tree can't actually seperate with these questions -- don't paper over it.

  Keep it to like 6-8 branch questions and 10ish leaves. It's for a reading group of grad students, not for publication, so be blunt about which positions look unserious.
reasoning: |-
  Okay, the user is in a reading group on democracy where they're stuck debating whether more competent people should have more say in decision-making. Half the group thinks it's obvious, while the other half thinks it's a non-starter. They want a decision tree to clarify the disagreement instead of endless arguing. 

  Hmm, they've already identified key branch points: existence of objective policy truth, accessibility of truth to ordinary people, measurability of expertise, individual vs group competence, and sources of legitimacy without equal votes. They also want specific leaves like restricted suffrage, plural voting, epistocratic veto, etc. 

  Interesting twist—they have their own half-baked proposal: a bicameral system with one elected house and one randomly selected from people who pass a basic exam, where the latter has suspensive veto over bills failing cost-benefit tests. They want to know where it fits and how to tweak it. 

  The user seems frustrated but analytical—a grad student who values structure over rhetoric. They’re implicitly asking for intellectual scaffolding to elevate the debate. The "unserious" flag request suggests they’re tired of positions that sound clever but crumble under scrutiny. 

  For the tree, I’ll start with the agreed premises (voter ignorance, competence variation, desire for correct outcomes) then force splits at their specified dilemmas. Need to handle edge cases where combinations don’t map to real positions—e.g., believing in measurable expertise but rejecting all power asymmetries is either incoherent or leads to "unexplored" leaves. 

  Their proposal? It’s a hybrid. The exam-filtered sortition house leans toward epistocratic veto, but the random selection and narrow veto condition pull it back toward deliberative minipublics. To shift it: tighten the exam (plural voting), broaden veto power (strong epistocracy), or drop the exam entirely (lottocracy). 

  Biggest trap: positions like liquid democracy and epistocratic veto might collapse into the same branch if we only ask about formal power. I’ll flag that. Also, pure proceduralism shortcuts the whole tree—useful for derailing truth-trackers. 

  *sketches mentally*  
  Start with Q1: Objective truth? (No → pure proceduralism; Yes → next).  
  Q2: Can laypeople reach truth? (No → needs expertise; Yes → deliberation-focused).  
  Then drill into expertise measurability, legitimacy sources... Got it.  

  For the "dead ends":  
  - If someone thinks competence is purely group-based but also measurable individually? Unattractive/unexplored.  
  - Believes in objective truth but rejects all competence mechanisms? Incoherent without magic.  

  User’s proposal gets messy because the exam is individual competence measurement, but the veto is group-based. Hence the "deliberative minipublic with epistocratic elements" label. Smart tweak: make the exam a deliberation certificate instead of a test—slides toward minipublic purity.  

  Final note: I’ll roast "unserious" positions gently. Plural voting’s historical racism? A footnote. Technocracy’s blindness to values? Highlighted. Futarchy’s reductio ad absurdum? Noted but left standing.  

  Tree structure first, then their proposal’s mapping, then dead ends. Time to flowchart.
answer: |-
  Here's a truth-tracking democracy decision tree designed to expose foundational splits. **Bold branches** indicate critical disagreements. Leaves marked 🔥 are widely contested or historically problematic.

  ```mermaid
  graph TD
      A[Start: Agreed Premises<br>- Voters are often ignorant<br>- Competence varies<br>- Better outcomes desirable] --> B{Is there objective<br>'correct policy'?}
      B -->|No: Policy is subjective<br>or emergent| L1[Pure Proceduralism<br>Legitimacy = fair process]
      B -->|Yes: Objective truth<br>exists| C{Can ordinary people<br>find truth via<br>deliberation/info?}
      C -->|No: Requires<br>specialized expertise| D{Is expertise<br>reliably measurable?}
      C -->|Yes: Groups/processes<br>can reach truth| E{Best competence<br>vehicle?}
      D -->|No: Too fuzzy/unstable| F[Lottocracy / Sortition<br>Randomness prevents bias]
      D -->|Yes: Credentials/tests<br>valid| G{Individual or<br>group competence?}
      E -->|Individual| H[Liquid Democracy<br>Delegation to experts]
      E -->|Group| I[Deliberative Minipublics<br>Powered citizen assemblies]
      G -->|Individual| J{Formal power<br>increase mechanism?}
      G -->|Group| K[Technocracy<br>Insulated agencies]
      J -->|Voting Weight| L[Plural Voting 🔥<br>Extra votes for competent]
      J -->|Franchise Access| M[Restricted Suffrage 🔥<br>Test-based voting rights]
      J -->|Veto Power| N[Epistocratic Veto<br>Expert chamber blocks laws]
      K -->|Betting Mechanism| O[Futarchy<br>Policy via prediction markets]
  ```

  **Your Proposal Mapped**  
  *Bicameral: Elected house + Sortition-from-exam-passers house with suspensive veto on cost-benefit failures*  
  → **Hybrid between Deliberative Minipublic & Epistocratic Veto**  
  - Closest to: **Deliberative Minipublics** (sortition + deliberation), but with epistocratic elements (exam filter, technocratic veto test)  
  - To shift left: Remove exam → Pure Lottocracy  
  - To shift right: Make veto absolute → Strong Epistocracy  
  - Key tension: Exam measures *individual* competence, but veto wielded by *group* after deliberation  

  ---

  ### Dead Ends & Incoherent Branches
  | Path | Why Unmapped | Problem Type |
  |------|--------------|--------------|
  | Yes→Yes→Individual→Group competence? | "Individual" branch can't lead to group-focused solution | **Incoherent** (If competence is individual, group mechanisms irrelevant) |
  | Yes→No→Yes→Reject all formal power | Claims expertise is measurable but opposes ANY implementation | **Unattractive** (Self-defeating; implies expertise shouldn't matter) |
  | Yes→No→No→Insist on truth-tracking | Rejects expertise AND lay access, but wants correct outcomes | **Incoherent** (No mechanism left for truth-tracking) |
  | Objective truth→Group competence→But reject deliberation | Belief in group wisdom without process | **Unexplored** (No real-world analogs) |

  ---

  ### Critical Notes
  1. **Can't Separate:**  
     - **Liquid Democracy** & **Epistocratic Veto** collapse if "Formal power" branch ignores delegation vs. institutional power.  
     - **Technocracy** & **Futarchy** blur if agencies use prediction markets.  
  2. **🔥 Unserious Positions (per your request):**  
     - **Plural Voting:** Historically tied to property/race requirements; mathematically unstable.  
     - **Restricted Suffrage:** Violates core democratic intuition; tests inevitably gamed (e.g., Jim Crow literacy tests).  
     - **Futarchy:** Reduces all values to market metrics; ignores non-quantifiable goods.  
  3. **Pure Proceduralism** shortcuts the tree: Rejects the entire truth-tracking premise.  

  ---

  ### Where This Resolves Your Debate
  The core split is **Q1 (objective truth)** → **Q2 (lay accessibility)** → **Q3 (expertise measurability)**.  
  - **"More say for competent" side** assumes: Yes→No→Yes→Individual  
  - **"Non-starter" side** assumes either:  
    - No (Pure Proceduralism) *or*  
    - Yes→Yes→Group (Deliberative focus) *or*  
    - Yes→No→No (Rejects measurable expertise)  

  Your proposal dodges extremes by blending group deliberation (minipublic) with weak epistocracy (exam + veto). To persuade opponents: **Emphasize the random selection** to proceduralists and **downplay the exam** to competence-skeptics.
