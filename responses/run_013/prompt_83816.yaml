prompt: |-
  I am writing a paper on how moral practices die, and a friend in my seminar has handed me an argument that I can no longer see my way around. I set it out below as he gave it to me.

  (1) The case against slavery — that it treats persons as property, and so as things — was made, and made forcefully, centuries before slavery ended; the cases against dueling and against foot-binding were likewise old by the time those practices were given up.

  (2) An argument that has been available for centuries while the practice it condemns survives is not what ends the practice.

  (3) Each of these practices ended when it became shameful rather than when it was refuted: the duel came to look like the resort of a man afraid of being thought a coward rather than the proof of a man of honor, and bound feet came to look like a national humiliation rather than a mark of refinement.

  (4) So what ended these practices was a change in what was honorable, not the force of an argument.

  (5) If a change in what is honorable explains why a practice ended, then the cogency of the argument against the practice explains nothing about why it ended.

  (6) If the cogency of our moral arguments explains nothing about what we do, then moral truth is inert.

  (7) Moral realism is worth having only if moral truth is not inert; a realism whose truths make no difference anywhere is a thesis we could drop without noticing.

  (8) Therefore we have no reason to be moral realists, and the fact that slavery ended tells us nothing about whether slavery was wrong.

  He adds a principle that he thinks licenses both the step from (4) to (5) and the step from (5) to (6): a consideration counts as a reason for a change only if it could have caused the change, and it could have caused the change only if its arrival coincided with the change. He calls this the causal-reason principle and says it is the only honest way to say what a reason is.

  I cannot accept (8), and I would give up almost any other step on the list to keep it from standing. Tell me which step does the damage, why it looked innocent, and what it costs to reject it. I am fairly confident the trouble is not in (1) — the historical claim is rough but defensible — but I cannot tell whether the weight falls on the causal claim in (2), on the exclusion being run in (4) and (5), on the notion of inertness in (6), or on the metaethics in (7), and I do not trust my own sense of where the weak joint is.

  Then do the harder thing. Take the standard ways out — that the arguments available earlier were not the same arguments, that honor is itself responsive to argument, that the truth of a claim and its motivational power are different matters, and that realism need not be a theory of what moves people — and tell me what each one costs and whether any of them survives the strongest reading of (1) through (4). If the causal-reason principle is the culprit, say precisely what is wrong with it; if it is not, say what work it is doing that the rest of the argument cannot do without. I do not want a survey of who said what, and I do not want a reading list. I want a diagnosis, and I want to know what I am paying.

  Write it as continuous prose, the way you would write a long letter to a colleague: no headings, no bullet points, no bold, no tables, and no numbered list of your own. Open with your verdict rather than a preamble.
reasoning: |-
  Okay, the user is grappling with a sophisticated philosophical argument challenging moral realism, specifically how moral practices like slavery end. They need to identify the weak point in their friend's syllogism that leads to the unacceptable conclusion (8) that moral truth is inert and realism untenable. 

  First, I must unpack the argument's structure. Premises (1)-(4) establish historical patterns: moral arguments predated practice abandonment, while shame/honor shifts caused change. The causal-reason principle then bridges to (5)'s exclusion claim (arguments don't explain change) and (6)-(7)'s inertness thesis. The user rejects (8) but feels stuck—they suspect flaws in (2), (4)-(5), or the causal principle.

  Hmm... The core vulnerability is actually premise (5). It falsely assumes honor-shifts and moral arguments are competing explanations when they're likely interdependent. The friend's causal-reason principle oversimplifies by requiring temporal coincidence for reasons to be causal—but moral arguments often work indirectly by reshaping cultural sensibilities over time. 

  For example, abolitionist arguments didn't instantly end slavery but gradually reconfigured what counted as honorable. Rejecting (5) costs little: we simply acknowledge that reasons operate through mediating factors like emotion and social perception. This doesn't surrender realism—it just accepts that moral truth persuades through complex cultural channels. 

  Alternative escapes exist but have higher costs. Claiming "arguments changed" risks contradicting (1). Saying "honor responds to argument" might work but risks circularity if honor is defined as morality-sensitive. Distinguishing truth/motivation preserves realism at the expense of making morality irrelevant to practice—a pyrrhic victory. 

  The causal-reason principle is indeed the silent enabler of the whole problem. Its demand for direct temporal correlation mistakes how reasons function in moral progress. Once discarded, the dominoes (5)-(8) fall. The user can keep moral realism by recognizing that arguments work cumulatively through social consciousness—not magically at the moment of change.
answer: |-
  Your friend's conclusion is untenable, and the damage originates in the leap from (4) to (5), enabled and enforced by the causal-reason principle. That principle is the poisoned root, making (5) seem plausible while smuggling in a cripplingly narrow view of how reasons operate in moral change. Rejecting it—and consequently (5)—is the necessary and least costly escape, preserving moral realism without denying the historical role of honor and shame.

  Premise (4) states that changes in *what was honorable* ended practices like slavery, dueling, and foot-binding, not the "force of an argument." This observation seems solid based on (1) and (3). The causal-reason principle then dictates that for an *argument* (its cogency, its truth) to count as a *reason* for the change, it must be capable of *causing* the change, which requires its "arrival" to coincide with the change. Since (1) establishes the arguments were available long before the changes, the principle forces (5): the *cogency* of the argument explains *nothing* about why the practice ended. From here, the slide to inert moral truth (6), the worthlessness of realism (7), and the repugnant (8) is swift.

  The fatal flaw is the causal-reason principle. It is presented as the "only honest way" to understand reasons, but it is profoundly dishonest about the nature of moral reasoning and social change. It demands a simplistic, event-based causality where a discrete "argument" must act like a billiard ball striking practice-change at the moment of impact. This ignores the complex, cumulative, and often indirect ways moral arguments operate within a culture. Arguments don't merely exist statically; they are deployed, reinterpreted, popularized, internalized, and woven into evolving social narratives over time. The "arrival" of an argument isn't a single point but a prolonged process of dissemination and cultural digestion. Its causal efficacy lies precisely in its ability to *reshape* concepts like honor and shame, not just to exist alongside them or trigger change instantly upon utterance.

  The principle misdiagnoses the relationship between argument and honor-shift in (4). It forces an *exclusion*: if honor changed, the argument *couldn't* have been a reason. But this is false. The change in honor *is how the moral argument often achieves its practical effect*. The cogency of the argument against slavery—that it treats persons as things—didn't magically disappear for centuries only to reappear in the 19th century. Instead, that argument, persistently made, gradually (and non-linearly) eroded the foundations of the *honor system* that sustained slavery. It helped reconfigure social perception so that owning another human being ceased being a mark of status and became, instead, a mark of barbarism and dishonor. The argument didn't *coincide* with the change; it *worked through* the slow transformation of the honor code that ultimately precipitated the change. The cogency of the argument explains *why* that particular conception of honor (e.g., anti-slavery as honorable) gained traction over others. Rejecting the causal-reason principle allows us to see (4) not as excluding the role of argument, but as describing the *mechanism* through which the argument's cogency *finally* translated into widespread social action – via the lever of honor and shame.

  Now, let's assess your potential escapes under the strongest reading of (1)-(4):

  1.  **"The arguments weren't the same":** This struggles against (1). While arguments evolve, the core *moral* condemnation of slavery (treating persons as property) *was* articulated centuries prior. Nuances changed, but the fundamental moral truth-claim was available. Insisting the later arguments were "different enough" risks special pleading and concedes too much ground to the causal-reason principle by implying only a *new* argument coinciding with change could be causal. Cost: Weakens the case for perennial moral truths; feels historically strained.

  2.  **"Honor is responsive to argument":** This is the most promising alternative and aligns with rejecting the causal-reason principle. Honor systems aren't hermetically sealed from moral reasoning; they are permeable to it. Arguments persuade individuals and communities that current honor codes are *misguided* or *immoral*, motivating the effort to redefine what is honorable. The abolitionists weren't just diagnosing slavery's wrongness; they were actively campaigning to make slavery *shameful*. Cogent arguments provide the *rationale* for why a shift in honor is *warranted*. Cost: Requires explicitly rejecting the causal-reason principle's demand for coincidence. It doesn't deny (4)'s description of the *proximate* social trigger (shame), but insists this trigger was primed by the long-term work of argument. Strongest reading of (1)-(4) allows this: (3) describes *how* the practice ended socially (became shameful), not *why* it became shameful. The "why" can include the persuasive power of longstanding arguments.

  3.  **"Truth and motivation are separate":** This preserves realism by divorcing moral truth from any necessary practical effect. The truth of "slavery is wrong" is independent of whether that truth motivates anyone. While logically sound, this is a pyrrhic victory. It renders moral realism inert *in practice*, satisfying (7)'s worry that such a realism could be "dropped without noticing." It accepts (6) and makes realism irrelevant to explaining moral change, which is what your friend's argument attacks. Cost: Abandons the idea that moral truth has any essential connection to human action or social progress, making realism philosophically defensible but existentially hollow. It surrenders the explanatory power you likely want realism to have.

  4.  **"Realism isn't about motivation":** Similar to (3). A robust realism might focus solely on the truth-conditions of moral statements, not their psychological or sociological impact. However, this also concedes that moral truth plays no role in explaining moral change, accepting the inertness conclusion (6) for explanatory purposes. It defends realism by making it irrelevant to the historical phenomenon in question. Cost: Severs the link between moral knowledge and moral progress, making realism unable to contribute to understanding *why* practices like slavery ended, which is central to your paper's concern.

  **Verdict:** Reject the causal-reason principle. It artificially constricts the concept of a "reason" and misrepresents historical causality. Its demand for temporal coincidence ignores the diachronic nature of persuasion and cultural evolution. This allows you to reject (5) – the cogency of the argument *does* explain the change, *through* its role in reshaping the honor system that provided the immediate social impetus described in (4). The cost is accepting that moral reasons operate indirectly and cumulatively within complex social systems, not with billiard-ball immediacy. This escape preserves a meaningful realism where moral truth can be causally efficacious over time, influencing the social emotions and norms (like honor and shame) that drive collective action. It avoids the high costs of the other escapes: historical contortion, surrendering realism's practical relevance, or making it inert. You keep (8) firmly rejected, acknowledge the crucial role of honor/shame shifts as the proximate social mechanism (per (3) & (4)), and maintain that the *cogency* of the longstanding moral arguments was essential to *why* those shifts occurred and took the specific moral direction they did. The arguments didn't coincide with the change; they made the change possible by slowly shifting the ground on which honor stood.
