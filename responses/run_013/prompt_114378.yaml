  ### Software Job Retry Example  
  You have a job that runs at most twice. On the first attempt, it succeeds with probability 0.7. If it fails (probability 0.3), it retries. On the second attempt, it succeeds with probability 0.3. Success pays $100. Each attempt costs $10. A double failure incurs a $50 penalty. The job runner doesn’t know if it’s on attempt 1 or 2, so it must apply the *same* retry policy at both stages.  

  **Payoffs**:  
  - **Attempt 1 success**: $100 - $10 = $90  
  - **Attempt 1 failure → Attempt 2 success**: $100 - $20 = $80  
  - **Attempt 1 failure → Attempt 2 failure**: -$20 - $50 = -$70  
  - **Abort**: $0 (no cost, no reward)  

  ---

  ### Why Fixed Policies Fail  
  - **Always Retry**:  
    - Attempt 1: Run (cost $10).  
      - 70%: $90 (success).  
      - 30%: Proceed to attempt 2.  
    - Attempt 2: Run again (cost $10).  
      - 30% of 30%: $80 → **$9**  
      - 70% of 30%: -$70 → **-$21**  
    **Expected value**: (0.7 × $90) + (0.3 × 0.3 × $80) + (0.3 × 0.7 × -$70) = $63 + $7.2 - $14.7 = **$55.5**  

  - **Always Abort**:  
    - Attempt 1: Abort → $0.  
    **Expected value: $0**  

  ---

  ### Mixed Policy Beats Both  
  **Strategy**: Retry with probability *p* at both attempts.  
  - **Expected value calculation**:  
    - **If it’s attempt 1** (probability 1):  
      - *p* chance to run:  
        - 70%: $90.  
        - 30%: Attempt 2 happens.  
      - (1-*p*) chance to abort: $0.  
    - **If it’s attempt 2** (probability = 0.3*p* from failing attempt 1):  
      - *p* chance to run:  
        - 30%: $80.  
        - 70%: -$70.  
      - (1-*p*) chance to abort: $0.  
    **Total expected value**:  
    $EV(p) = p \left[0.7 \times 90 + 0.3 \times \left(p \times (0.3 \times 80 + 0.7 \times -70)\right)\right] + (1-p) \times 0$  
    Simplify: $EV(p) = p \left[63 + 0.3p \times (24 - 49)\right] = p \left[63 - 7.5p\right]$  
    Maximize: $EV(p) = 63p - 7.5p^2$.  
    Derivative: $63 - 15p = 0$ → $p = 63/15 = 0.7$  
    **EV(0.7)**: $63 \times 0.7 - 7.5 \times (0.7)^2 = 44.1 - 3.675 =$ **$40.425**  

  **Why randomize?**  
  - At attempt 1, you *want* to retry (high success chance: 70% → $90).  
  - At attempt 2, you *want* to abort (low success chance: 30% → high risk of -$70).  
  But you *must* do the same at both. Randomizing balances:  
    - High *p* maximizes attempt 1 gains.  
    - Low *p* minimizes attempt 2 losses.  
  Mixed policy "nudges" you toward retrying in attempt 1 but aborting in attempt 2 on average.  

  ---

  ### Same as Absent-Minded Driver?  
  **Yes, structurally identical**:  
  - **States**: Two decision points (attempt 1/attempt 2 or first exit/second exit).  
  - **Partial observability**: Agent can’t distinguish states.  
  - **Conflict**: Optimal action differs per state (retry/abort or go straight/turn).  
  - **Randomization needed**: Breaks symmetry, exploits state distribution.  

  **Key insight**: No adversary needed. Randomization helps when:  
  1. You face multiple identical-looking states.  
  2. The best action differs per state.  
  3. You can’t condition on state directly.
