  If I were advising them... dropping (6) causes least damage. Keeping it forces rejection of bivalence, which torches their non-negotiables. The resulting package would look like Williamson's epistemicism: vague predicates have sharp but unknowable cutoffs. They'd need to bite the bullet on why we can't access our own meanings—perhaps via cognitive limitations like margin-for-error principles. 

  Test case: Consider "Mount Everest is tall." Their view must say this is determinately true or false, even while insisting Everest's tallness is "vague in the world." That’s unstable. Either admit indeterminacy exists (scrapping bivalence) or concede vagueness is only in language/knowledge. 

