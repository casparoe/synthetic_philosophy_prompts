prompt: |-
  I am a statistician by training and I spend my working life on causal inference -- directed acyclic graphs, potential outcomes, do-calculus, mediation and sensitivity analysis -- and I have fallen into a recurring argument with a colleague in the philosophy department about the Frankfurt cases. I have an undergraduate acquaintance with the free-will literature but I have never worked through the secondary debate, and my colleague's talk of alternative possibilities and flickers of freedom tends to slide past me. I know the shape of the cases well enough: a counterfactual intervener waits in the wings, prepared to make the agent perform the action if the agent were about to refrain, but the agent performs it on their own, so the intervener never acts; the intuition is that the agent is nevertheless responsible, and the moral drawn is that responsibility does not require the ability to have done otherwise, so the principle of alternative possibilities is in trouble. What I would like from you is a faithful restatement of that debate in the vocabulary I actually use, followed by an honest residue report. Render the ability to have done otherwise as carefully as you can in causal terms: what is the treatment, what is the outcome, where does the intervener sit in the graph, what exactly is held fixed when we say the alternative was unavailable, and what happens to the analysis when the intervener fires only probabilistically rather than with certainty. Do the same for the response that relocates the agent's freedom from the action to the decision itself -- the thought that a flicker of freedom survives even though the action was guaranteed -- and for the distinction between causal responsibility and moral responsibility. I want to know which parts of the debate map cleanly onto counterfactual dependence under an intervention, which parts survive only in a distorted form, and which parts have no counterpart at all in do-calculus or potential outcomes.

  My own suspicion, which I would like you to test rather than flatter, is that the ability to have done otherwise is just counterfactual dependence, that the interventionist reading is the natural one, and that much of the debate is a confusion about which counterfactual is under evaluation -- the one that holds the agent's deliberation fixed versus the one that intervenes on the agent's decision. If that suspicion is right, say so and show the translation. If it is wrong, I want to know precisely where my vocabulary runs out: is the missing piece something a causal model ought to be able to express but does not, or is it something that was never a causal claim in the first place -- a claim about reasons, capacities, or desert that no graph can carry? I would rather have the residue than a tidy correspondence, so please do not smooth over the places where the analogy breaks.
reasoning: |-
  We are going to break down the Frankfurt case and the surrounding debate using causal inference concepts. The goal is to see how well the philosophical notions map onto causal models and to identify any gaps.

  ### The Frankfurt Case in Causal Terms
  The classic Frankfurt case involves an agent, Jones, who is going to decide whether to perform some action (say, vote for a candidate). A counterfactual intervener, Black, is monitoring Jones and is prepared to intervene (using a brain device) to ensure that Jones performs the action if and only if Jones shows any sign of not performing it. However, Jones performs the action on his own, so Black never intervenes. The intuition is that Jones is morally responsible for the action even though he could not have done otherwise (because if he had been about to do otherwise, Black would have intervened and forced him to do the action).

  #### Key Elements in Causal Vocabulary
  1. **Agent's Action (Outcome)**: The action we are interested in, say \( A = 1 \) (performs the action) or \( A = 0 \) (does not perform). In the scenario, \( A = 1 \) actually occurs.

  2. **Agent's Decision Process**: This is the internal deliberation of the agent that leads to the action. We can model this as a variable \( D \) (for decision) which can take values 1 (deciding to do the action) or 0 (deciding not to do it). We assume that \( D \) is a direct cause of \( A \).

  3. **Intervener (Black)**: Black is set up to intervene only if the agent's decision process is about to lead to \( D = 0 \). We can model Black as a variable \( B \) that can take two values: 0 (not intervening) and 1 (intervening). Black's intervention, if it occurs, forces \( A = 1 \) regardless of \( D \).

  4. **Black's Trigger**: Black intervenes based on what he observes about Jones's decision process. Specifically, we can think of a variable \( T \) (trigger) which is a function of \( D \). In the original Frankfurt case, Black is set to intervene if \( D \) would be 0. However, note that in the actual scenario, \( D = 1 \) and so \( B = 0 \) (no intervention).

  5. **The Causal Graph**: We can represent the dependencies as:
     - \( T \) is determined by \( D \) (so \( D \rightarrow T \))
     - \( B \) is determined by \( T \) (so \( T \rightarrow B \)): if \( T \) indicates that \( D=0 \) is about to happen, then \( B=1\); otherwise, \( B=0\).
     - \( A \) is determined by both \( D \) and \( B \): if \( B=1\), then \( A=1\); if \( B=0\), then \( A = D \).

  In the actual scenario: 
     - \( D = 1 \) (Jones decides to vote for the candidate)
     - \( T = \text{no trigger} \) (since \( D=1 \), we can code \( T=0 \))
     - \( B = 0 \) (no intervention)
     - \( A = D = 1 \) (Jones votes for the candidate on his own)

  #### The Principle of Alternative Possibilities (PAP)
  PAP states that an agent is morally responsible for an action only if the agent could have done otherwise. In the Frankfurt case, the challenge is that Jones could not have done otherwise: if he had been about to decide not to vote (i.e., if \( D=0 \)), then Black would have intervened (\( B=1 \)) and forced \( A=1 \). So, in all possible scenarios, \( A=1 \). 

  #### Ability to Have Done Otherwise in Causal Terms
  We are to express "the ability to have done otherwise" in causal terms. We can think of this as a counterfactual: what would the outcome \( A \) be if we could set the agent's decision \( D \) to a different value? But note that in the Frankfurt setup, if we try to set \( D=0 \), then the trigger \( T \) would fire, causing \( B=1 \), which would force \( A=1 \). So, even if we set \( D=0 \), \( A \) would still be 1. Thus, in the counterfactual world where \( D=0 \), \( A=1 \). Therefore, the agent does not have the ability to have \( A=0 \).

  But note: the agent's decision \( D \) is not free from the intervener? Actually, in the actual scenario, the intervener did not do anything. So we must be careful about what we hold fixed.

  In causal inference, when we ask about the agent's ability to have done otherwise, we are asking about the effect of an intervention on the agent's decision. Let \( \text{do}(D=d) \) denote an intervention that sets \( D \) to \( d \). We want to know if \( A \) would have been different if we had set \( D \) to 0 instead of 1.

  However, in the Frankfurt case, the graph has \( D \) causing \( T \), and \( T \) causing \( B \), and \( B \) and \( D \) both cause \( A \). If we do an intervention \( \text{do}(D=0) \), then:
     - \( T \) would become triggered (say \( T=1 \)) because \( D=0 \)
     - Then \( B \) would become 1 (because \( T=1 \))
     - Then \( A \) would be 1 (because \( B=1 \))

  Similarly, if we do \( \text{do}(D=1) \), then \( T=0 \), \( B=0 \), and \( A=1 \).

  So in both cases, \( A=1 \). Therefore, under an intervention on \( D \), the agent cannot make \( A=0 \). The agent does not have the ability to have done otherwise (in terms of the action \( A \)).

  But note: the agent does have the ability to make \( D=0 \). However, that does not lead to \( A=0 \) because of the intervener.

  ### The Flicker of Freedom
  Some philosophers (like Fischer) argue that even though the agent could not have done otherwise with respect to the action, there is a "flicker of freedom" in the decision process. In the actual scenario, the agent decided on his own to do the action. The alternative possibility is not in the action but in the decision: the agent could have decided not to do it (even though that decision would have been preempted by the intervener). This alternative possibility in the decision is the flicker of freedom.

  In causal terms: 
     - In the actual world, \( D=1 \) and \( B=0 \).
     - In a counterfactual world without the intervener, if \( D=0 \), then \( A=0 \). But in the Frankfurt case, the intervener is present.

  We can define a new variable: the agent's actual decision without intervention. But note that in the actual world, the agent's decision is not intervened upon. The flicker of freedom is that the agent's decision \( D \) could have been different. But in the causal model, if we hold the intervener's setup fixed, then if the agent had decided differently, the intervener would have stepped in. So the agent's decision \( D \) is free to vary, but the outcome \( A \) is not.

  We can model the agent's freedom in the decision by considering an intervention on the agent's decision that bypasses the normal causes of \( D \). However, the causal model we have already allows us to consider interventions on \( D \). But note that when we do an intervention on \( D \), we are overriding the normal causes of \( D \), and we are also triggering the intervener. So the agent's decision \( D \) is free to be set to 0 or 1 by an external intervention, but the outcome \( A \) is fixed at 1.

  However, the flicker of freedom is not about an external intervention on \( D \), but about whether the agent, in the actual circumstances, could have decided otherwise. This is where the causal model might have a gap. The causal model can represent what would happen if the agent's decision were different, but it doesn't represent the agent's internal capacity to choose. 

  We might try to model the agent's decision as having an exogenous variable \( U_D \) that represents the agent's free choice. In the actual world, \( U_D \) took the value that led to \( D=1 \). We can then ask: could \( U_D \) have been different? But in the Frankfurt setup, if \( U_D \) had been such that it would lead to \( D=0 \), then the trigger would have fired and \( A \) would still be 1. So the agent's free choice of \( D \) is present (in that \( D \) is set by \( U_D \)), but the outcome \( A \) is not sensitive to that choice.

  ### Probabilistic Intervener
  Now, consider a variation where the intervener fires only probabilistically. Suppose that if the agent is about to not perform the action (\( D=0 \)), then Black intervenes with probability \( p \) (and does nothing with probability \( 1-p \)). In this case, the agent might have been able to do otherwise: if \( D=0 \) and Black does not intervene (which happens with probability \( 1-p \)), then \( A=0 \).

  In causal terms:
     - \( P(A=0 | \text{do}(D=0)) = P(\text{Black does not intervene} | D=0) = 1-p \)
     - So there is a positive probability that \( A=0 \) when we set \( D=0 \).

  Therefore, the agent has a probabilistic ability to have done otherwise. However, note that in the actual scenario, Jones still did \( D=1 \) and \( A=1 \) without intervention. The question of moral responsibility now becomes more nuanced: does the mere possibility (with positive probability) of having done otherwise suffice for PAP? Or does it require that in the exact same circumstances (including the presence of the probabilistic intervener) the agent could have done otherwise? 

  In the actual run, the agent did not do otherwise. But we can ask: is there a possible world with the same past and laws (and same intervener setup) in which the agent does otherwise? In the probabilistic case, there is: the world where \( D=0 \) and Black does not intervene (with probability \( 1-p \)). So there are alternative possibilities, but they are probabilistic.

  ### Causal Responsibility vs. Moral Responsibility
  In causal inference, we can define causal effect: the agent's decision \( D \) has a causal effect on \( A \) in the absence of intervention by Black. But in the Frankfurt case, in the actual scenario, \( D \) did cause \( A \) because \( B=0 \) and \( A=D \). However, if \( D \) had been 0, then \( D \) would not have caused \( A \) because \( B \) would have forced \( A=1 \). But in the actual world, \( D \) is a cause of \( A \).

  Moral responsibility might require more than just causal responsibility. It might require that the agent had control, or that the action was done for the right reasons, etc. In the Frankfurt case, the argument is that even though the agent lacked alternative possibilities, we still hold him morally responsible because he did it on his own.

  In causal terms, we can say that in the actual world, the agent's decision \( D=1 \) was an actual cause of \( A=1 \) (using, say, the Halpern-Pearl definition of actual causation). But moral responsibility might require that the agent could have done otherwise, which we have seen is not the case in the Frankfurt scenario.

  ### Testing Your Suspicion
  You suspect that the ability to have done otherwise is just counterfactual dependence, and that the debate is a confusion about which counterfactual is under evaluation.

  In the Frankfurt case, the agent is morally responsible even though there is no counterfactual dependence of the action \( A \) on the agent's decision \( D \) in the following sense: if we hold fixed the presence and setup of the intervener (which is part of the context), then changing \( D \) does not change \( A \) (because if we set \( D=0 \), \( A \) still becomes 1). So \( A \) does not counterfactually depend on \( D \) in this context.

  But note: in the actual context (where \( D=1 \)), \( A \) does depend on \( D \) because if \( D \) had been 0 (and we hold fixed the rest of the context, including the fact that Black is there and his trigger mechanism), then \( A \) would have been 1 anyway. So the counterfactual "if the agent had decided otherwise, the action would have been otherwise" is false. However, in the actual world, the agent's decision did cause the action because the intervener was not active.

  The confusion might be about what we are holding fixed. In the counterfactual that tests whether the agent could have done otherwise, we are not holding fixed the agent's decision process? No, we are considering an intervention that changes the agent's decision. But we are holding fixed the structure of the world (the graph) and the presence of the intervener.

  Your suspicion seems to be that the debate conflates two different counterfactuals:
  1. One that holds fixed the agent's deliberation (i.e., the actual causes of \( D \)) and then asks what would happen if we change \( D \) by an external intervention (which would trigger the intervener). This counterfactual shows that \( A \) does not change with \( D \).
  2. Another counterfactual that intervenes earlier, perhaps on the agent's reasons or on the inputs to deliberation, to see if a different decision would have been made and then led to a different action. But in the Frankfurt case, if we change the inputs to deliberation so that the agent would decide \( D=0 \), then the intervener would have stepped in and \( A \) would still be 1.

  So both counterfactuals lead to the same conclusion: the agent cannot make \( A=0 \).

  However, note that in the actual world, the agent's decision \( D=1 \) was made freely (without intervention) and caused \( A=1 \). The causal model can show that in the actual world, \( D \) is a cause of \( A \). But the model also shows that the agent does not have the ability to have \( A=0 \). 

  ### The Residue: Where Your Vocabulary Runs Out
  1. **The Flicker of Freedom**: The causal model can represent that the agent's decision \( D \) could have been different (by intervention) and that in the actual world, \( D \) was determined by the agent's own reasons. However, the model does not capture the internal experience of freedom or the idea that the agent could have decided otherwise in the same circumstances without an external intervention. The causal model only tells us what happens under interventions. The question of whether the agent could have decided otherwise without external intervention is about the indeterminism or the freedom in the agent's will. This might be a gap.

  2. **Moral Responsibility**: The causal model can tell us about causal responsibility (the agent's decision was an actual cause of the action) and about the lack of counterfactual possibilities for the action. But moral responsibility is a normative concept. It might require that the agent had the right kind of control, which might be more than just being a cause. For example, the agent must have been able to do otherwise in a stronger sense, or must have done it for the right reasons. The causal model does not capture reasons, just causes.

  3. **Reasons and Rationality**: The Frankfurt case often involves the agent acting for reasons. In the actual scenario, Jones votes for the candidate because he likes the candidate. If Black had intervened, Jones would have voted for the candidate but not for that reason. The causal model might represent reasons as part of the input to \( D \), but it does not distinguish between the same action done for different reasons. This might be important for moral responsibility.

  4. **The Agent's Capacity**: The ability to have done otherwise might be about the agent's capacity, not just about what would happen in counterfactual scenarios. The causal model can represent what would happen if the agent's decision were different, but it doesn't represent whether the agent had the capacity to choose otherwise in the actual situation. This capacity might be a metaphysical or dispositional property that the causal model does not capture.

  ### Conclusion
  Your suspicion is largely correct: the ability to have done otherwise can be represented as counterfactual dependence of the action on the agent's decision. In the Frankfurt case, there is no such dependence because the intervener breaks the chain. The debate about which counterfactual to evaluate is clarified by the causal model: we are evaluating the counterfactual where we intervene on the agent's decision (and hold fixed the setup of the intervener). This counterfactual shows that the action does not change.

  However, there are residues:
     - The flicker of freedom: the causal model shows that the decision \( D \) could have been different (by intervention) but does not capture the idea that the agent could have freely chosen otherwise in the same circumstances without an external intervention. This might be a gap in the causal model, or it might be that the causal model is not the right tool for that concept.
     - Moral responsibility: causal models can capture causal responsibility and counterfactual dependencies, but moral responsibility might require additional elements (like the agent's reasons, the absence of coercion, etc.) that are not purely causal.

  In summary, the core of the Frankfurt argument maps well onto causal models, but some aspects of the free-will debate (especially those that are normative or about the agent's internal capacities) do not.
answer: |-
  ### Faithful Restatement in Causal Inference Vocabulary
  I'll translate the Frankfurt case and its philosophical debate using causal inference concepts (DAGs, potential outcomes, interventions, and counterfactuals). The goal is to map "alternative possibilities," "flickers of freedom," and moral responsibility onto causal structures, then identify where the analogy holds or breaks.

  #### **Core Elements of the Frankfurt Case**
  - **Agent**: Makes a decision \(D\) (e.g., \(D=1\): performs action; \(D=0\): refrains).
  - **Intervener (Black)**: Monitors \(D\). If \(D=0\) (or a signal of \(D=0\)), Black intervenes (\(B=1\)) to force action \(A=1\). If \(D=1\), Black does nothing (\(B=0\)).
  - **Actual Outcome**: Agent chooses \(D=1\) without intervention (\(B=0\)), so \(A=1\).
  - **Intuition**: Agent is morally responsible for \(A=1\), even though they couldn't have achieved \(A=0\) (if \(D=0\), Black forces \(A=1\)).

  ---

  ### **1. Ability to "Do Otherwise" as Counterfactual Dependence**
  #### **Causal Graph**
  Define variables:
  - \(D\): Agent's decision (binary: 1=act, 0=refrain).
  - \(B\): Intervener's action (binary: 1=intervene, 0=no intervention).
  - \(A\): Outcome action (binary: 1=performed, 0=not performed).
  - \(U\): Unobserved confounders (e.g., agent's reasons, neurobiology).

  The **DAG** for the Frankfurt scenario:  
  ```
  U → D → B → A  
         ↗  
  D → A      // Direct effect if B=0
  ```
  - **Structural Equations**:
    - \(B = \mathbb{I}(D = 0)\)  // Intervener triggers if agent refrains.
    - \(A = \begin{cases} D & \text{if } B=0 \\ 1 & \text{if } B=1 \end{cases}\)  
    // Outcome equals agent's decision if no intervention; forced to 1 if intervention.

  #### **Ability to "Do Otherwise" as a Counterfactual**
  - **Treatment**: Intervention on \(D\) (setting \(D=d\)).
  - **Outcome**: \(A(d)\) (potential outcome under \(D=d\)).
  - **Held Fixed**: The graph structure (including Black's intervention rule \(B = \mathbb{I}(D=0)\)).  
    This encodes the intervener's presence and deterministic response.

  - **Counterfactual Scenario**:  
    - Actual world: \(\text{do}(D=1) \implies A(1) = 1\) (no intervention).  
    - Counterfactual world: \(\text{do}(D=0) \implies B=1 \implies A(0) = 1\).  
    → \(A(0) = A(1) = 1\): **No counterfactual dependence** of \(A\) on \(D\).  
    → Agent **cannot** make \(A=0\) under any \(D\).

  **Conclusion**:  
  The "ability to do otherwise" is **counterfactual dependence of \(A\) on \(D\)**.  
  - In Frankfurt cases, \(A \not\perp\!\!\!\perp D \mid \text{graph}\): No dependence → no alternative possibilities for \(A\).  
  - Your suspicion holds: Philosophers conflate:
    - **Intervention on deliberation (fixed)**: Hold \(U\) (reasons/neurobiology) fixed. Agent "couldn't have decided otherwise" given who they are.
    - **Intervention on decision \(D\)**: Override \(U\) to set \(D=d\). Agent "couldn't have acted otherwise" due to Black.

  ---

  ### **2. Probabilistic Intervener**
  Suppose Black intervenes probabilistically:  
  - \(P(B=1 \mid D=0) = p\) (intervention not guaranteed).  
  - Structural equation: \(A = D \cdot \mathbb{I}(B=0) + 1 \cdot \mathbb{I}(B=1)\).

  #### **Counterfactual Analysis**:
  - Actual world: \(\text{do}(D=1) \implies B=0 \implies A(1)=1\).  
  - Counterfactual world: \(\text{do}(D=0) \implies A(0) = \begin{cases} 0 & \text{with probability } 1-p \\ 1 & \text{with probability } p \end{cases}\).  
  → \(P(A(0) \neq A(1)) = 1-p > 0\) if \(p < 1\).  

  **Conclusion**:  
  - With probabilistic intervention, **alternative possibilities exist** (nonzero probability \(A=0\) if \(D=0\)).  
  - **Moral responsibility debate**:  
    - Hard determinists: \(p>0\) is irrelevant; only actual outcome matters.  
    - Libertarians: \(p>0\) preserves "flicker of freedom".  
  - **Causal mapping**: Clean. Probability of counterfactual difference quantifies alternative possibilities.

  ---

  ### **3. "Flicker of Freedom" in Decision vs. Action**
  Philosophical claim: Even if \(A\) couldn't differ, the **decision \(D\)** could have been otherwise, preserving a "flicker" of freedom.

  #### **Causal Translation**:
  - **Treatment**: Intervention on \(U\) (agent's reasons/capacities), not \(D\).  
  - **Outcome**: \(D(u)\) (potential decision under reasons \(u\)).  
  - **Held Fixed**: Black's rule (\(B = \mathbb{I}(D=0)\)).  

  **Counterfactual**:  
  - Actual world: \(U=u \implies D(u)=1 \implies B=0 \implies A=1\).  
  - Counterfactual world: \(\text{do}(U=u')\) where \(D(u')=0 \implies B=1 \implies A=1\).  
  → \(A\) still always 1, but \(D\) **can counterfactually depend on \(U\)**.  

  **Analysis**:  
  - \(A\) has no counterfactual dependence on \(U\) (due to Black).  
  - \(D\) may have counterfactual dependence on \(U\) (if reasons affect decision).  
  - **Residue**:  
    - **Causal**: We can model \(D\)'s dependence on \(U\), but \(U\) is unobserved. Philosophers interpret this as "freedom in decision."  
    - **Break**: Causal models **cannot** express *why* \(D\)'s dependence on \(U\) matters morally. This requires normativity (e.g., "reasons-responsiveness") beyond causality.  

  ---

  ### **4. Causal vs. Moral Responsibility**
  - **Causal Responsibility**: Agent's \(D\) is an **actual cause** of \(A=1\) in the realized world (since \(B=0\) and \(A=D\)).  
    - Using **Halpern-Pearl actual causation**: \(D=1\) is a cause because changing \(D\) to \(0\) *while holding \(B\) fixed at 0* would change \(A\) to 0.  
      (But note: Holding \(B\) fixed ignores Black's intervention rule!).  
  - **Moral Responsibility**: Assigns blame/praise. Frankfurt argues it persists without alternative possibilities.  

  **Tension**:  
  - **Causal model**: Can show \(D\) is a cause of \(A\) in the actual world (with \(B=0\)).  
  - **Break**: Moral responsibility requires **control**, which causal models reduce to counterfactual dependence. If \(A\) doesn't counterfactually depend on \(D\), the agent lacks control over \(A\). Philosophers dispute whether *actual causation* suffices for moral responsibility when *counterfactual control* is absent.  

  ---

  ### **Residue Report: Where the Analogy Breaks**
  #### **Clean Mappings**  
  1. **Alternative possibilities** ↔ **Counterfactual dependence of \(A\) on \(D\)**.  
  2. **Probabilistic intervener** ↔ **Probability of counterfactual difference**.  
  3. **Flicker of freedom** ↔ **Counterfactual dependence of \(D\) on \(U\)**.  
  4. **Actual causation** ↔ **Agent's node (\(D\)) on the path to \(A\) in realized world**.

  #### **Distorted or Partial Mappings**  
  1. **Intervention vs. Deliberation**:  
     - Philosophers debate whether "holding \(U\) fixed" (agent's reasons) is fair. Causal models treat \(U\) as an exogenous input, but philosophers see it as part of agency.  
     - **Distortion**: Causal models "intervene" exogenously, but free will requires *endogenous* change.  

  2. **Moral Responsibility**:  
     - Causal models show *how* the outcome happened but not *why* it deserves blame.  
     - **Break**: Normative concepts (e.g., "desert", "fairness") have no causal counterparts.  

  #### **No Causal Counterpart**  
  1. **Reasons-Responsiveness**:  
     - Philosophers (Fischer) argue moral responsibility requires the agent to act for reasons that *could* have led to \(D=0\).  
     - **Gap**: Causal models can encode \(D\)'s dependence on \(U\), but not whether \(U\) represents "good reasons" or "moral capacities."  

  2. **Source Incompatibilism**:  
     - Claim: Moral responsibility requires the agent to be the "ultimate source" of \(D\), not predetermined.  
     - **Gap**: Causal graphs assume determinism/stochasticity but cannot express "metaphysical ultimacy."  

  3. **Desert**:  
     - "The agent *deserves* blame for \(A=1\)" has no causal analogue. Causal models describe mechanisms; they cannot justify punishment/praise.  

  ---

  ### **Testing Your Suspicion**  
  Your hypothesis: **"Ability to do otherwise = counterfactual dependence"** is correct and resolves the debate.  
  - **Supported**:  
    - Frankfurt cases show \(A\) has no counterfactual dependence on \(D\) → no ability to do otherwise for \(A\).  
    - Confusion arises when philosophers:  
      - Hold \(U\) fixed (agent couldn't have decided otherwise) vs.  
      - Intervene on \(D\) (agent couldn't have acted otherwise).  
  - **Limits**:  
    - **Flicker of freedom**: Causal models show \(D\) *could* depend on \(U\), but cannot adjudicate whether this suffices for moral responsibility.  
    - **Normative residue**: Why is actual causation insufficient without counterfactual control? This is non-causal.  

  ### **Conclusion**  
  - **Debate mapped**:  
    - Alternative possibilities ↔ Counterfactual dependence (clean).  
    - Probabilistic intervener ↔ Probabilistic potential outcomes (clean).  
    - Flicker of freedom ↔ \(D\)'s counterfactual dependence on \(U\) (distorted; moral weight unclear).  
  - **Residue**:  
    - Moral responsibility requires normativity (reasons, desert) beyond causality.  
    - Sourcehood and ultimacy are metaphysical, not causal.  
  - **Your Vocabulary's Limit**:  
    - Causal models capture **mechanisms** and **dependencies** but not **normativity** or **metaphysical freedom**. The gap is not a flaw in causal models; it reflects that moral responsibility was never *just* a causal claim.  

  **Recommendation**: Use causal models to resolve disputes about alternative possibilities and control, but switch to normative frameworks (e.g., reasons-responsiveness) for moral responsibility. The Frankfurt debate is 30% causal confusion and 70% unresolved moral philosophy.
