  I am preparing a graduate seminar handout on lexical threshold negative utilitarianism and the commensurability of pleasure and pain. I need a decision tree that sorts the positions in this debate by what they say about concrete trade-offs, not by the labels people favor. Treat lexical threshold negative utilitarianism as the view that there is a threshold of suffering below which no quantity of pleasure can outweigh a marginal increase in pain, while above that threshold pleasures and pains are commensurable at some exchange rate. I want the tree to distinguish at least the following commitments: whether pleasure and pain share a single cardinal scale at all; whether the exchange rate between them is constant or context-dependent; whether a lexical threshold is best modeled as a discontinuity in the value function, a side-constraint, a lexical priority rule, or a satisficing constraint; whether the threshold is absolute or agent-relative; whether there are plural values not reducible to pleasure and pain; and whether the whole question of commensurability is a substantive metaphysical issue or an artifact of a particular measurement model. Build the tree from the logical space first, then locate the named positions in it. Include, at minimum, leaves for classical hedonistic utilitarianism, lexical negative utilitarianism without a threshold, lexical threshold negative utilitarianism, threshold prioritarianism, pluralist incommensurabilism, and a deflationary view that treats the debate as a measurement artifact. Aim for eight to twelve branch nodes and eight to ten leaves. Each branch node must be phrased as a question a reader can answer without already knowing which position it leads to, and each leaf must carry the position name plus one sentence on its most awkward commitment. Tie each branch node to a concrete case where possible, such as whether a lifetime of mild but constant pain can be outweighed by a single moment of intense pleasure, whether a small pain to one person can be traded against a large pleasure to another, or whether the threshold applies to individual pains or to total suffering. The point is to sort readers by what they accept about cases, not by which label they like, so no branch node should simply ask whether they are a lexical threshold negative utilitarian. Note any combinations of answers that no one occupies and briefly diagnose whether they are incoherent, unattractive, or merely unexplored. Flag any pair of positions your tree cannot separate. No citations, reading lists, or bibliographies; I want the logical structure, not the literature. Give a committed response: do not present several possible taxonomies or hedge about which distinctions matter. Choose one tree, make definite calls about where contested positions belong, and defend those calls. Lead with your bottom line in the first sentence: state the single distinction you think does the most sorting work. Then give the tree and the notes. No preamble and no restating of my question.
