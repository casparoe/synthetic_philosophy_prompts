prompt: |-
  I trained as a molecular biologist and spent forty years at the bench; since retiring I have been reading philosophy of biology, and I have reached the point where I can follow the arguments without yet seeing their joints. I would like you to use the units-of-selection debate as a lens on one episode from my own field, and then tell me what the episode does to the debate.

  The episode. Genome size in eukaryotes is almost uncorrelated with any plausible measure of organismal complexity: garlic and onions have larger genomes than we do, some salamanders vastly larger ones, while gene number barely moves. This is the C-value paradox. In 1980 two papers appeared back to back in Nature — one by Orgel and Crick, one by Doolittle and Sapienza — proposing that much of the surplus DNA persists because it is good at getting itself copied and reinserted, so that it is favoured by selection at the level of the sequence rather than because it does anything for the organism. Doolittle and Sapienza called the view they were attacking the phenotypic paradigm, and the proposal was widely read as a vindication of the gene's-eye view. The argument over how much of the genome is functional is still running: a consortium claimed that the great majority of the genome shows some biochemical activity, and critics replied that activity is not function.

  I would like three things.

  First, the mapping. Tell me which entities are in play — sequence, chromosome, genome, organism, population — and which is being selected, which is merely replicating, which benefits, and which is the vehicle; what the framework counts as evidence here, and what would count against it. Keep the replicator/vehicle (or interactor) distinction, and the difference between what a stretch of DNA does and what it was selected to do, explicit in the analysis, and say which of them this episode actually tests.

  Second, an account of where the theory earns its keep and where it goes slack. If selection at the level of the sequence produces no adaptation at the level of the organism, has genic selectionism been vindicated by this case or emptied of content? Does the gene's-eye view predict or explain anything here that an organism-centred or multilevel account does not? And where is it silent rather than wrong?

  Third, the objection that the whole dispute is bookkeeping — that any selection can be rewritten as selection among genes, so the levels question is a choice of accounting convention rather than an empirical matter. My own suspicion, which I would like you to test rather than flatter, is that this episode vindicates that objection: that what looks like a discovery about units of selection is really a discovery about how to keep the books. Tell me whether the suspicion survives contact with the case, and what evidence would have to exist for the levels question to be settled by data.

  End with a verdict on a single question: does the selfish-DNA episode support genic selectionism, undermine it, or leave the dispute where it was? Put it as the last line, beginning Verdict:, followed by exactly one of the three words supports, undermines, or neither, and nothing after it.
reasoning: |-
  Hmm, the user is a retired molecular biologist with 40 years of bench experience who's now diving into philosophy of biology. They want me to analyze the selfish DNA episode through the lens of the units-of-selection debate. Specifically, they're referring to the 1980 papers by Orgel & Crick and Doolittle & Sapienza that proposed selfish DNA as an explanation for the C-value paradox.

  The C-value paradox is fascinating - it's about how genome size doesn't correlate with organismal complexity. Garlic and onions have bigger genomes than humans, salamanders have enormous ones, yet gene numbers stay relatively stable. These papers suggested that much of this "junk DNA" persists because it's good at replicating itself, not because it benefits the organism.

  The user wants three specific things mapped out:

  First, I need to identify the entities involved: sequences (selfish DNA elements), chromosomes, genomes, organisms, populations. I should clarify which is being selected (the selfish sequences themselves), which is replicating (again the sequences), which benefits (the sequences), and which is the vehicle (the genome/organism). The key distinction here is between replicators (selfish sequences) and vehicles/interactors (organisms). The evidence for this comes from observing DNA that spreads without phenotypic benefit, while evidence against would be if all DNA showed clear organism-level functions.

  Second, I need to show where the theory works and where it doesn't. Does this vindicate genic selectionism? Well, it shows selection can operate purely at the sequence level without organismal adaptation, which supports the gene's-eye view. But it doesn't explain everything - organism-level traits still matter for survival. The gene's-eye view uniquely predicts how parasitic DNA spreads, while multilevel selection would frame it as intragenomic conflict.

  Third, I need to address the user's suspicion that this is just "bookkeeping" - that we can always rewrite selection as genic selection. The selfish DNA case actually challenges this because we have sequences spreading despite organismal costs - a clear case of selection at a lower level. For levels to be empirically settled, we'd need evidence of selection that can't be reduced to genic terms.

  Finally, I'll give a verdict: does selfish DNA support, undermine, or leave genic selectionism unchanged? The last line must be "Verdict:" followed by one word. I think it supports genic selectionism, as it demonstrates selection operating purely at the sequence level.
answer: |-
  ### Mapping the Units in Selfish DNA
  **Entities in play:**
  - *Replicator:* Selfish DNA sequences (transposons, retrotransposons) are the units of replication and selection. They propagate by copying and reinserting into the genome.
  - *Interactor/Vehicle:* The organism (or genome) serves as the vehicle. It interacts with the environment, but its survival/reproduction is *not* the target of selection for selfish DNA.
  - *Beneficiary:* The selfish sequences themselves benefit (increased copy number), even if they impose costs (e.g., metabolic burden, mutagenesis) on the organism.
  - *Replicating vs. Selected:* Sequences replicate *and* are selected (genic selection). Organisms merely replicate as vessels but are not selected *for* carrying selfish DNA—they may even be selected *against* if costs are high.

  **Framework & Evidence:**
  - **For selfish DNA:**  
    - Evidence: Sequence proliferation without phenotypic benefit (e.g., onion genome size vs. gene count); mechanistic ability to copy/insert (e.g., transposase genes); phylogenetic patchiness (species-specific bursts).  
    - Counterevidence: If all excess DNA showed organism-level function (e.g., universal regulatory roles).  
  - **Against phenotypic paradigm:**  
    - Evidence: Lack of correlation between non-coding DNA and complexity; biochemical "activity" (e.g., transcription) without functional consequence.  
    - Counterevidence: If deleting non-coding DNA consistently reduced fitness.  

  **What the episode tests:**  
  It directly tests the **replicator/vehicle distinction**. Selfish DNA is a "pure" replicator selected for copying fidelity, not for vehicle-level adaptation. It also probes the **selected-for vs. function distinction**: sequences spread due to selection *on their replicative prowess*, regardless of whether they later acquire function (e.g., through exaptation).

  ---

  ### Where Theory Earns Keep vs. Goes Slack
  **Earns keep (genic selectionism vindicated):**  
  - Predicts and explains **parasitic DNA propagation** despite neutral/negative organismal effects—something organism-centered views miss.  
  - Explains **C-value paradox**: Genome size balloons due to intragenomic selection, not organismal needs.  
  - **Unique insight**: Only genic selectionism predicts that sequences can spread while *harming* the vehicle—a hallmark of selfish DNA.  

  **Goes slack (not emptied, but incomplete):**  
  - **Silent on organism-level adaptation**: Selfish DNA doesn’t explain complex phenotypes (e.g., eyes, immune systems), where organism/population selection dominates.  
  - **Fails to predict constraints**: Genic view alone can’t explain why selfish DNA doesn’t overrun all genomes (e.g., suppression by host silencing mechanisms, a higher-level adaptation).  
  - **Multilevel accounts add value**: They frame selfish DNA as a **conflict** between levels (genic vs. organismal selection), explaining why mechanisms evolve to suppress it.  

  **Verdict on content:** Genic selectionism is **vindicated** for explaining sequence proliferation but **not emptied**—it remains essential for conflicts where lower-level units "rebel." It is silent, not wrong, on traits emerging from vehicle-level interactions.  

  ---

  ### Bookkeeping or Empirical Reality?
  **Testing the suspicion:**  
  The objection—that levels are *only* accounting conventions—**fails** here. Selfish DNA provides empirical evidence that:  
  1. **Selection acts at different levels**: Sequences spread *despite* organismal costs (e.g., energy drain, reduced fitness in salamanders with giant genomes).  
  2. **Irreducibility**: Rewriting this as "organism selection" obscures causality. If a transposon proliferates while lowering fitness, organism-centered accounting must label it "maladaptive," missing the *reason* for its spread (genic selection).  

  **Settling levels with data:**  
  To empirically resolve the debate, we’d need:  
  - **Cross-level conflicts**: Evidence of traits favored at one level but disfavored at another (e.g., selfish DNA vs. host suppression).  
  - **Emergent traits**: Phenomena explicable *only* at higher levels (e.g., frequency-dependent selection in populations).  
  - **Mechanistic independence**: Replicators propagating without vehicle interaction (e.g., horizontal gene transfer in bacteria).  

  Selfish DNA supplies such evidence: sequences are selected *as replicators*, not proxies for organismal fitness.  

  ---

  ### Verdict  
  Verdict: supports
