answer: |-
  ## The Six-Minute Margin

  The air in the Perfusion Ward hummed with a low, vital thrum – not the frantic beep of monitors, but the deep, steady pulse of the Bridges. They were sleek, coffin-sized units, cradling bodies that defied easy categorization. On the left aisle: Cardiac Cessations. Hearts stilled beyond the sacred six-minute window, bodies kept unnervingly pink and warm by the Bridge’s artificial circulation until organs could be harvested. Walking past them felt like passing sleepers who’d never wake. Their stillness was absolute, profound.

  On the right: Neurological Absences. Brains gone dark, irretrievably flatlined on every scan, yet hearts thudded under the Bridge’s command, lungs rose and fell in a cruel pantomime. Their warmth was deceptive, their movement obscene. They were shells kept running on autopilot by the machine’s indifferent efficiency.

  I knew the protocol. Cold. Simple. *Six minutes without spontaneous circulation. Declare. Switch off the Cardiac Bridge. Harvest.* Or, *Irreversible cessation of all brain function. Declare. Neurological Bridge maintains for potential donation until family decides.* Two flavors of death, neatly segregated, defined by a number chosen in some distant ethics committee meeting. Six minutes. The length of a coffee break. The difference between a warm body and a cold corpse.

  Mr. Evans was in Cardiac Cessation Bay 4. Massive coronary. Brought in blue, no pulse. Resuscitation furious, desperate, futile. The clock ticked past five minutes, fifty seconds. The charge nurse, Rita, watched the monitor, her face a mask. Six minutes. Zero seconds. "Time," she said, voice flat. "Call it. Evans, Thomas. Time of death, 14:06."

  The team stepped back. The frantic energy dissolved into a heavy stillness. I moved forward, my part automatic. Connect the Cardiac Perfusion Bridge lines – arterial, venous. The machine whirred, taking over the work his heart refused. Color flooded back into his cheeks, chasing away the waxy pallor of clinical death. His chest rose slightly with the machine’s artificial breath. He looked... not alive, not dead. Suspended. Like a paused video.

  Protocol demanded hourly neuro checks on Cardiac Cessations until harvest, a cruel redundancy, a box to tick. *Confirm absence of brainstem function.* As if the Bridge, pumping oxygenated blood, could somehow spark *something* back in the six-minute-dead brain.

  Later, during my round, I approached Bay 4. The Bridge hummed its constant, vital song. Mr. Evans lay bathed in the unit's soft light, disturbingly peaceful. I lifted his eyelid, shone the penlight. Pupils fixed, dilated, unresponsive. Brainstem death confirmed. Routine. I moved to lift the other lid.

  His hand twitched.

  Not a spasm. Not a tremor from the machine's flow. A distinct, deliberate *flex* of the fingers against the sheet.

  My own breath hitched. Impossible. *Six minutes.* Beyond recovery. Protocol absolute.

  I stared. His hand lay still now. Fluke? My tired eyes? I checked the Bridge readouts – flow steady, parameters green. No anomalies. Just the steady *thrum-thrum-thrum* of artificial life.

  I forced myself to the neuro check. Lift the lid. Penlight. Fixed pupil. Nothing. I lowered the lid. As my fingers brushed his cool skin, his *eyelid* fluttered. Just once. A faint, almost imperceptible quiver beneath my touch, like a moth trapped under glass.

  Ice flooded my veins. This wasn't protocol. This wasn't in the manual. Cardiac cessation: *dead*. Neurological absence confirmed: *dead*. Yet... movement. Purposeful? Random? The Bridge kept his blood oxygen-rich. What flickered in the dark behind those unseeing eyes? Was it just dying neurons firing meaningless signals? Or was it... *him*? Trapped in a body declared dead by a timer, sustained by a machine designed for corpses?

  I looked across the aisle. Bay 7 held a Neurological Absence – Mrs. Chen. Brain wiped clean by a stroke, scans showing only hollow silence. But the Neurological Bridge kept her heart drumming, her chest rising and falling with mechanical regularity. By the other definition, *she* was the dead one. Yet her body moved with a semblance of life Mr. Evans's twitch seemed to scream against.

  The clock on the wall ticked. Evans's harvest was scheduled for 18:00. Four hours. Four hours while the Bridge sang its vital song into a body past the six-minute line. Four hours where a finger might curl, an eyelid might tremble.

  My pen hovered over the chart. *Neuro check: Absent brainstem reflexes.* True. Utterly true. The light found nothing. The protocol was satisfied.

  But the tremor under my fingertips… it scratched at the cold certainty of that six-minute wall. Where did *that* fit? Was it life stubbornly clinging beyond the arbitrary line? Or just the final, meaningless sparks of a machine shutting down, amplified by the Bridge’s artificial sustenance?

  The hum of the Perfusion Bridges filled the silence, a constant, indifferent drone. Two kinds of dead, kept artificially present. One warm and still, one moving and hollow. And Mr. Evans, caught between definitions, his silent twitch a question that echoed in the sterile air, unanswered, drowning in the relentless *thrum-thrum-thrum* of the machine marking time for the gone.
