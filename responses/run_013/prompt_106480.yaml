  The Sphex wasp's behavior exemplifies a hierarchical control system with nested feedback loops. The cricket-retrieval sequence is a **fixed action pattern (FAP)** triggered by a **releaser** (cricket proximity). The sequence includes: (1) closed-loop control during cricket-dragging (continuous proprioceptive/tactile feedback), (2) a transition to open-loop control during burrow inspection (preprogrammed motor routine), and (3) a conditional state transition based on sensory reafference (burrow emptiness). When the cricket is displaced, the absence of expected reafference (cricket at threshold) resets the FAP via negative feedback, re-triggering the retrieval subroutine. This creates a loop in the **state machine**, governed by **hysteresis**—the system requires a threshold stimulus (cricket position) to exit the inspection state. The apparent rigidity stems from **gain** settings: low sensitivity to environmental changes during open-loop phases and no adaptive recalibration of setpoints between cycles.

  #### Translations of Philosophical Claims  
  1. **Claim**: The wasp is just a machine, illustrating mechanistic rigidity in behavior.  
     **Restatement**: The wasp executes a deeply entrenched FAP with minimal hierarchical override capacity. Its control architecture lacks policy-updating mechanisms (e.g., error-driven learning rules), resulting in repetitive state resets when sensory feedback deviates from expected reafference.  
     **Status**: Clean.  
     **What_is_lost**: The philosophical label "machine" conflates determinism with inflexibility, ignoring that machines can have adaptive policies. Control theory separates causal determinism (ubiquitous in feedback systems) from policy rigidity.  
     **Residue_reading**: Original claim was vague.  

  2. **Claim** (Dennett): Flexibility doesn’t require escaping mechanism; human cognition may be built from rigid subroutines.  
