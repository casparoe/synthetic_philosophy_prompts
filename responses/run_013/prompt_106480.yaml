  4. **Claim** (Keijzer): The wasp adapts eventually, making the Sphex story rhetorically useful but empirically inaccurate.  
     **Restatement**: Under repeated perturbation, the wasp’s control system exhibits policy plasticity: hysteresis thresholds widen (reducing gain to displacement stimuli), or noise induces state-machine transitions to alternative FAPs (e.g., abandoning inspection). This reflects latent adaptive capacity via parameter tuning, not architectural change.  
     **Status**: Clean.  
     **What_is_lost**: Philosophical use of Sphex ignores adaptive potential; control theory quantifies rigidity as high gain/low hysteresis in policy execution, not inherent incapacity.  
     **Residue_reading**: Original claim was vague.  

  #### Rigidity: Architecture vs. Policy  
  - **Architecture rigidity**: Fixed hardware/connectivity (e.g., hardwired neural circuits in wasps, immutable weights in LLMs). Limits adaptability scope.  
  - **Policy rigidity**: Fixed behavioral algorithms (e.g., unchanging FAP sequences, static control laws). Decoupled from architecture—fluid hardware can run frozen policies.  
  **Conflation in debates**: Philosophers often slide between levels. Libertarians mistake policy flexibility (e.g., human learning) for architectural non-mechanism. Dennett correctly argues policy flexibility can emerge from rigid subsystems, but this requires hierarchical control absent in Sphex.  

  #### Wasp vs. Human vs. LLM Placement  
  - **Sphex wasp**:  
    - *Architecture*: Rigid (evolutionarily fixed neural wiring).  
    - *Policy*: Mostly rigid FAPs with limited parameter tuning (e.g., hysteresis adjustment).  
  - **Human**:  
    - *Architecture*: Flexible (synaptic plasticity enables rewiring).  
    - *Policy*: Highly flexible (real-time setpoint adjustment, meta-learning).  
  - **LLM (e.g., this system)**:  
    - *Architecture*: Flexible hardware (general-purpose compute), rigid policy (frozen inference-time weights; no online learning).  
    - *Policy*: Statistically generated but algorithmically frozen; no dynamic goal-updating.  

  #### Overall Verdict  
  Control theory vocabulary cleanly captures mechanistic claims (1, 2, 4) but has no counterpart for libertarian acausality (3). Philosophical vagueness persists in conflating architecture/policy rigidity and misdefining "mechanism." Rigidity distinctions clarify that policy flexibility (e.g., human behavior) can emerge from rigid subsystems without "escaping" determinism, while Sphex-like rigidity reflects policy, not architectural, constraints. The LLM exemplifies frozen policy on fluid hardware, highlighting that flexibility requires dynamic policy updates—absent in both Sphex and current LLMs.

