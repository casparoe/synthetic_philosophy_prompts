prompt: |-
  I teach an upper-level seminar on collective harm, and the session on the inefficacy objection is the one I find hardest to plan. I want to build it around a case on which my co-instructor and I disagree, so before I commit to it I need a prediction of what she will say. She is careful and consistent; I have never caught her contradicting herself, and she gives reasons rather than verdicts alone.

  Her verdicts on the cases I have put to her so far:

  - A person who knowingly buys and eats a beef burger acts wrongly, even though she accepts that the probability her purchase causes one more animal to be reared and slaughtered is on the order of one in a hundred thousand. The smallness of the increment does not move her.
  - She holds that verdict even in a society in which almost nobody else is cutting back on meat, so there is no scheme of restraint she could be accused of free-riding on.
  - A person who takes one long-haul holiday flight acts wrongly.
  - A person who abstains in a national election in a district that is certain to be won by a wide margin does not act wrongly.
  - A person who declines to contribute to a fund that will provide a modest benefit to many people, where the fund will reach its target whether or not she contributes, does not act wrongly.
  - A person who stands up at a concert to see better, in a hall where everyone else is seated, does not act wrongly, even though if everyone did it nobody would see any better.

  The new case. A person takes one long-haul holiday flight in a jurisdiction whose total emissions of aviation fuel are fixed by a legally binding cap, set and enforced by a body independent of the fuel industry, that will not be relaxed. Every permit is in use. She knows all of this, and she knows that the total quantity of greenhouse gas emitted that year is identical whether or not she flies: someone else emits correspondingly less. She also knows that aviation is a serious contributor to a serious harm, and she is not flying for any urgent reason.

  What I want from you:

  1. The rules that fit her six verdicts, stated as precise conditions on when an act is wrong rather than as the names of positions, and a note on which of them her verdicts actually eliminate.
  2. What each surviving rule predicts about the new case, and your best guess at her verdict, with the reasons for preferring that guess over the alternatives.
  3. The further case I should put to her to settle which rule she is running independently of the new case — ideally one that separates the surviving rules along a different axis from the one the new case exploits — together with what each rule predicts about that case.

  If her verdicts leave the answer genuinely underdetermined, say so rather than manufacturing a single reading. I do not need citations or reading lists; I need the rules stated sharply enough that I can see exactly where they come apart.
reasoning: |-
  Hmm, the user teaches an upper-level seminar on collective harm and is struggling with planning a session on the inefficacy objection. They have a co-instructor with consistent views on various cases related to collective action problems, and they need to predict her verdict on a new case about flying under an emissions cap system.

  The co-instructor has given clear verdicts on six previous cases: she believes buying beef burgers and taking holiday flights are wrong despite negligible individual impact, but abstaining from voting in safe districts, not contributing to fully-funded collective benefits, and standing at concerts when others are seated are not wrong. The new case involves flying under a strict emissions cap where individual actions don't change total emissions.

  I need to identify the underlying ethical rules that explain these verdicts. The key is finding conditions that make an act wrong for her. From her pattern: she cares about participation in harmful systems even when individual impact is tiny (cases 1-3), but not when the act is genuinely inconsequential (cases 4-6). The emissions cap case seems designed to test whether systemic participation alone makes an act wrong without individual causal impact.

  Possible rules I see:
  1) Participation Rule: Acts are wrong if they participate in a harmful practice, regardless of marginal impact. This fits the beef and flight cases but conflicts with the voting abstention and fund cases where non-participation isn't required.
  2) Fair Play Rule: Wrong only if free-riding on others' restraint. But she rejected this explicitly in the beef case (no existing scheme).
  3) Expected Harm Rule: Wrong if expected harm > trivial threshold. But this doesn't explain the beef verdict (1/100k chance is tiny).
  4) Counterfactual Inefficacy: Wrong only if the act makes things worse. This fits the voting, fund, and concert cases but conflicts with beef and flights where she says it's wrong despite no counterfactual difference.

  Her pattern suggests she distinguishes between acts that are causally inert (voting abstention, not contributing) versus participating in harmful systems (buying beef, flying). The concert case is interesting - standing alone improves the viewer's position without harm, so it's permissible participation.

  For the emissions cap case: under the cap, not flying doesn't reduce emissions (someone else uses the permit), so her participation is causally inert. But she might still see it as complicity in the harmful system. I'd guess she says it's not wrong, because the key distinction is causal efficacy - when an act literally changes nothing, it's not wrong, even in harmful contexts. This fits her voting abstention verdict.

  To test this, I'd propose a modified concert case: everyone is standing, and one person sits down. If they still see better (like the original case), is it wrong? Rules based on causal difference would say no (like voting abstention), while complicity rules might say yes (participating in the harmful norm). This cleanly separates the causal vs. symbolic participation dimensions.
answer: |-
  Based on your co-instructor's consistent pattern of verdicts, here's a precise breakdown of the underlying rules, predictions for the new case, and a diagnostic case to resolve ambiguity. Her pattern reveals a focus on **causal contribution to harm** and **participation in harmful systems**, with a clear distinction when an act is *causally inert*.

  ### 1. Rules Consistent with Her Six Verdicts
  Her verdicts eliminate rules based solely on **expected utility**, **free-riding**, or **symbolic complicity**. Surviving rules must explain why *some* tiny-impact acts are wrong (beef, flights) while others are not (voting abstention, fund omission, standing at concerts). Two rules fit:

  - **Rule A (Causal Participation in Harmful Practice):**  
    *An act is wrong if:*  
    **(i)** It is an instance of participating in a practice that foreseeably causes serious harm;  
    **(ii)** The practice operates through aggregate effects of individual acts; *and*  
    **(iii)** The act would be wrong if performed by all relevant agents (universalization test).  
    *Exceptions:* If the act is *causally inert*—i.e., it *provably* changes *nothing* about the outcome (harm, benefit, or distribution)—it is not wrong.  

  - **Rule B (Threshold-Sensitive Expected Harm):**  
    *An act is wrong if:*  
    **(i)** It has a positive expected harm (however small) that exceeds a de minimis threshold (e.g., >0 and non-negligible in context); *and*  
    **(ii)** The harm is serious and the act is non-essential.  
    *Exceptions:* Expected harm is *zero* (not just tiny) or the act is required to avoid disproportionate cost to the agent.  

  **How her verdicts eliminate alternatives:**  
  - **Expected utility maximization** fails: Beef/flight verdicts ignore tiny probabilities (contradicts maximizing expected utility).  
  - **Pure free-riding** fails: Beef case is wrong even with no restraint scheme to free-ride on.  
  - **Symbolic wrongness** fails: Standing at concerts is permissible despite "participating" in a collectively harmful norm.  
  - **Strict counterfactual dependence** fails: Beef/flight are wrong despite negligible chance of changing outcomes.  

  **Support for surviving rules from her verdicts:**  
  - Rule A:  
    - *Fits beef/flight:* Participation in harmful system (i), aggregate harm (ii), universalizes to catastrophe (iii).  
    - *Fits voting abstention/fund omission:* Causally inert (no outcome change; permits/counterfactual harm = 0).  
    - *Fits standing at concert:* Causally inert (no harm/gain from solo act; if universalized, harm occurs but act isn't *causing* it).  
  - Rule B:  
    - *Fits beef/flight:* Positive expected harm (>0, exceeds de minimis), serious harm, non-essential.  
    - *Fits voting abstention/fund omission:* Expected harm = 0 (no chance of changing outcome).  
    - *Fits standing at concert:* Expected harm = 0 (no worsening of anyone's view).  

  ---

  ### 2. Prediction for the New Case (Emissions Cap Flight)
  - **Case description:** Taking a flight under a binding emissions cap. Total emissions are fixed; her seat displaces another’s permit. Expected harm = 0.  
  - **Rule A’s prediction:** **Not wrong.**  
    *Reason:* The act is causally inert (condition iii exception). Emissions are identical regardless; she doesn’t increase harm or participate in a system where *her* act aggregates to harm (cap breaks the causal chain).  
  - **Rule B’s prediction:** **Not wrong.**  
    *Reason:* Expected harm = 0 (no probability of increasing emissions).  

  **Best guess for her verdict:** **Not wrong.**  
  - *Why this guess?*  
    Her verdicts on voting abstention and fund omission show she absolves causally inert acts even in harmful contexts. The emissions cap makes her flight *structurally identical* to declining the fund (outcome unchanged) or abstaining in a safe election (no impact). Beef/flights lack this "hard" causal firewall.  
  - *Why prefer over alternatives?*  
    Rule B also predicts "not wrong," but Rule A better explains her emphasis on *participation* in beef/flight cases. If she were purely Rule B, the beef case (1/100k chance) might be borderline, but she calls it "wrong" unequivocally—suggesting Rule A’s participation element is key. Yet in the cap case, participation is neutered by causal inertness.  

  **Risk if guessing wrong:**  
  If she says "wrong," Rule A is invalid (unless she argues cap systems perpetuate harm, making participation non-inert). But her fund omission verdict suggests she accepts causal firewalls.  

  ---

  ### 3. Diagnostic Case to Settle the Rules
  **Proposed Case:** *A person refrains from eating beef in a context where producers adjust supply* **only** *to meet predicted demand. Her abstention has a 1/100k chance of reducing slaughter (like the original beef case), but she knows that if she abstains, her unused "share" of beef will be donated to a food bank (feeding hungry people without increasing total production). Harm to animals is unchanged, but her abstention has a net neutral/positive effect.*  

  - **Rule A’s prediction:** **Not wrong.**  
    *Reason:* Abstention is causally inert for harm (no change to slaughter) and may even produce a benefit. Not participating in the harmful system.  
  - **Rule B’s prediction:** **Wrong.**  
    *Reason:* Expected harm to animals is unchanged (still 1/100k chance of reduction), which exceeds de minimis; the food bank benefit is irrelevant to the harm condition.  

  **Why this case?**  
  - It isolates **whether expected harm alone suffices for wrongness** (Rule B) or if **causal inertness overrides** (Rule A).  
  - Unlike the emissions cap case (which tests causal inertness for a *harmful* act), this tests inertness for a *beneficial/neutral* act in a harmful system.  
  - Her original beef verdict requires participation to be wrong. If abstention with inertness isn’t wrong, Rule A holds; if it’s still wrong, Rule B is stronger.  

  **Key axes separated:**  
  - Emissions cap case: Tests if causal inertness excuses *participation in harm*.  
  - Diagnostic case: Tests if causal inertness excuses *non-participation* (or alternative action) in a harmful system.  

  **Contingencies:**  
  - If she says abstention is *still* wrong, Rule B is likely (expected harm dominates).  
  - If she says not wrong, Rule A is confirmed (causal role > participation).  
  - If undecided, her view may turn on finer details of causation (e.g., whether systems-level participation is inherently wrongful).  

  Her consistency suggests this will resolve cleanly. Let me know if you need refinements!
