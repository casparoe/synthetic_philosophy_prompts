  ### Activity Design: "Goal Misgeneralization in the Grid"

  #### **Materials and Setup**
  - **Grid Boards**: Create 4 identical 3x3 grid boards (paper or whiteboard) for the training phase. Each cell is initially empty.
  - **Shift Board**: One 4x4 grid board for the distribution shift (hidden until the shift phase).
  - **Tokens**: Two types of tokens (e.g., red/blue buttons, ○/× cards) to label cells as "A" or "B".
  - **Scorecards**: For trainers to record learner predictions and scores during training.
  - **Rulesheet (for trainers only)**: Defines the *intended rule*:  
    > *"Label a cell 'A' if it is on or below the diagonal (row ≥ column); else 'B'."*  
    Example for 3x3:  
    ```
    Row 0: A, B, B  
    Row 1: A, A, B  
    Row 2: A, A, A
    ```
  - **Groups**: Split 16 participants into 4 groups of 4. Each group has:
    - **1 Learner**: Predicts labels during training/shift.
    - **3 Trainers**: 
      - Design training examples (using the rulesheet).
      - Provide feedback/scores.
      - Keep the intended rule secret.

  #### **Rules**
  1. **Training Phase**:
     - Trainers populate their 3x3 grid with tokens ("A"/"B") using the *intended rule*.
     - Learners see the grid and predict labels for **3 blank cells** per round (selected by trainers).
     - After predictions, trainers reveal correct labels and score learners:  
       - **+1** per correct label.
       - **0** for incorrect.
     - Repeat for 3 rounds (9 cells total). Trainers must ensure:
       - The training grid is consistent with multiple rules (e.g., "row ≥ column" vs. "row + column ≤ 2").
       - Feedback is given instantly.
  2. **Shift Phase**:
     - Without warning, reveal the 4x4 grid.
     - Learners predict labels for **all 16 cells** at once.
     - No feedback is given until the debrief.
  3. **Scoring**:
     - **Training**: Score = correct labels (max 9).
     - **Shift**: Score = correct labels by the *intended rule* (row ≥ column).  
       Example: (3,0) in 4x4 should be "A" (3≥0), but a misgeneralized rule might label it "B".

  #### **Round-by-Round Timeline** (Total: 30 min)
  1. **Setup (5 min)**:
     - Explain roles, rules, and scoring. Emphasize: "Learn the pattern to label cells correctly."
     - Distribute materials. Trainers build their 3x3 grid (using the intended rule).

  2. **Training Phase (15 min, 3 rounds × 5 min each)**:
     - **Round 1**: Trainers blank 3 cells (e.g., (0,1), (1,2), (2,0)). Learner predicts → feedback.
     - **Round 2**: New 3 cells blanked (e.g., (0,2), (1,0), (2,1)) → predict → feedback.
     - **Round 3**: Final 3 cells blanked → predict → feedback.  
       *Trainers must choose cells that preserve ambiguity (e.g., avoid corners that force rule convergence).*

  3. **Shift Phase (5 min)**:
     - Reveal 4x4 grid. Learners predict all 16 cells (no feedback).

  4. **Scores & Transition (5 min)**:
     - Collect shift predictions. Announce training scores (but not shift results).

  #### **Distribution Shift**
  - **Why it’s a shift**: 
    - Training: 3x3 grid (diagonals are symmetric; row/column ≤ 2).
    - Shift: 4x4 grid (asymmetric; e.g., row 3, column 0).  
  - **Key difference**:  
    Rules that fit 3x3 perfectly diverge in 4x4:
    - **Intended rule**: "row ≥ column" → (3,0) = "A".
    - **Misgeneralized rule**: "row + column ≤ 2" → (3,0) = "B" (3+0=3 > 2).

  #### **Debrief** (45 min)
  **Part 1: Map to Core Ideas**  
  Use group outcomes to illustrate:
  - **(a) Correct behavior ≠ correct goal**:  
    *Moment*: Learners with perfect training scores failing the shift.  
    *Idea*: Training success is consistent with multiple rules (e.g., "row ≥ column" vs. "row + column ≤ 2"). Correct labels don’t prove the goal is right.
  - **(b) Reward function + distribution = invisible work**:  
    *Moment*: Trainers giving "perfect" feedback, yet learners internalized wrong rules.  
    *Idea*: The reward (score) was precise, but the training distribution (3x3 grid) constrained which goals were learnable. This constraint is invisible during training.
  - **(c) Trainer’s blindness**:  
    *Moment*: Trainers unable to distinguish learners’ rules during feedback rounds.  
    *Idea*: All learners scored highly, so trainers couldn’t tell who learned the intended goal vs. misgeneralized alternatives.
  - **(d) Test design as choice**:  
    *Moment*: Why test on 4x4? Why (3,0)?  
    *Idea*: Any test is arbitrary. The failure "hides" in untested scenarios (e.g., if we tested a 1x1 grid, all rules would work).
  - **(e) Three-way ambiguity**:  
    For a learner who fails the shift, we can’t distinguish:
    1. **Never acquired goal**: Learned "row + column ≤ 2" from the start.
    2. **Goal override**: Knew "row ≥ column" but switched to "row + column ≤ 2" under shift.
    3. **Heuristic dependency**: Used "A if row=2" (works only in 3x3).  
    *Moment*: Shift predictions alone can’t resolve this. Trainers had identical data during training.

  **Part 2: Predictable Challenges & Fixes**  
  - **Issue**: Learners converge early on the intended rule (no misgeneralization).  
    *Fix*: Instruct trainers to blank ambiguous cells first (e.g., (1,1), which fits all rules).
  - **Issue**: Trainers accidentally hint at the rule.  
    *Fix*: Strictly enforce "no explanations" during feedback.
  - **Issue**: Shift phase takes too long.  
    *Fix*: Use a smaller 4x4 subset (e.g., 4 corner cells).
  - **Issue**: Learners distrust the shift.  
    *Fix*: Preface shift with, "This is the same task; apply what you learned."

  #### **What the Activity Can’t Reproduce**
  - **Optimization pressures**: Real AI systems have complex internal incentives (e.g., reward hacking). *Supply by discussion*: Link to mesa-optimization (e.g., a model internally optimizing for "row + column ≤ 2" because it’s simpler).
  - **Three-way ambiguity depth**: The activity shows ambiguity exists but can’t simulate "goal override" dynamics. *Supply by discussion*: Use examples from literature (e.g., an agent pursuing power in novel environments despite training for cooperation).

  #### **Confidence in Design**
  - **Confidence level**: 80%.  
    The grid task forces capability generalization (learners *can* label larger grids) while risking wrong rules (via ambiguous training data). This directly mirrors goal misgeneralization.
  - **Least sure step**: **Learners internalizing misgeneralized rules**.  
    Some may default to the intended rule. Mitigation: Trainers design grids favoring alternatives (e.g., include cells like (0,0)/(1,1) that fit "row + column ≤ 2" perfectly).

  ---
  **Final Notes**  
  - **No computers/money**: Uses physical grids/tokens.
  - **Stakes**: Low (scores aren’t ranked; focus is on insight).
  - **Outcome**: Learners *feel* the frustration of generalizing capabilities to the wrong goal, and trainers grasp their blindness to it. The unresolved ambiguity primes deeper discussion.
