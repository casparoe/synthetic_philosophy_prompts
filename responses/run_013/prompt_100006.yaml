prompt: |-
  I'm putting together a proposal for a small internal seed grant at my university — six months, maybe $8k, mostly my own time plus a research assistant for a few hours a week. I work on history/philosophy of the social sciences and I keep circling a half-formed idea that I'd like you to turn into a proper proposal.

  The idea: people talk about the longue durée as if "slow structures explain" were one kind of claim, but I think there are two, and the Braudel debates (and the recent revival of the longue durée in global and climate history) slide between them. One is a filter/constraint reading: the slow variable doesn't cause the event, it makes certain events impossible or cheap and others expensive — it's a selection effect over the space of what could happen. The other is a constitution reading: the slow structure is what makes the relevant entities count as entities at all (what counts as a "market", a "peasant household", a "state" in a given setting), so it's prior to the event not in time but in the order of explanation. I suspect alot of the heat in the "does geography/climate really explain history" fight comes from sliding between these, and that some standard moves — the event is just foam on the wave, the individual is a fiction of the short term — are only defensible on one of the two readings and look silly on the other.

  Turn this into the proposal. I want: the question stated so that it has a determinate answer (something like, are these two readings genuinely distinct and doing different explanatory work, or does one collapse into the other once you make them precise?); why the existing positions leave it open — the Annales tradition, the critics who think long-run environmental explanation is just determinism in a nice suit, the "events and contingency matter" camp, and whatever you think the real positions actually are; why the conceptual/analytic approach is the right one here rather than the obvious alternatives (a straight empirical case study, or a general philosophy-of-explanation treatment of the covering-law kind); what I'd actually do month by month for six months; and what would count as the project failing, because I'd rather have a project that can fail than one that can't.

  Two constraints. I can't do archival work and there's no travel budget, so the method has to be armchair plus maybe one small computational/text-analysis component if that's genuinely pulling weight rather than decorative. And I want it to touch down somewhere real: at least one or two well-documented episodes where the slow-variable story gets told, used as test cases rather than as evidence — you pick them, just keep them to things I can get up to speed on from secondary literature. Don't give me citations or a reading list, I'll fill those in myself.
