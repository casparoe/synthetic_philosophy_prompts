prompt: |-
  I want help turning a set of gut verdicts into a principle. The subject is standing to blame — the sense in which someone's blame fails to land not because they have the facts wrong, or because the act wasn't wrong, but because of who is doing the blaming. I don't have a theory in mind and I'm not interested in one that only fits the textbook cases; I want something that survives mine.

  Here are the cases, with my reactions to each.

  (A) A friend of mine has never had a drink in his life, and not because of any struggle — he simply has no taste for it and never has. He tells me my drinking is a problem, and means it as a rebuke. I take the rebuke at full strength. His never having been tempted costs him nothing with me.

  (B) The same friend, in a variant: suppose he had told me that the only reason he doesn't drink is that it makes him violently ill, and that if it didn't, he would drink exactly as much as I do. Now his rebuke feels to me as though it has lost most of its force, even though everything he has actually done is identical in both versions.

  (C) My brother, who drinks at least as much as I do, tells me I drink too much. He can say the sentence, but I cannot hear it as blame. Something is missing.

  (D) My brother, after eight years sober, says the same sentence. It lands fully. That he used to drink the way I drink now seems to make it land harder rather than softer.

  (E) I plagiarized a paper. My co-author on that paper — who knew what I had done and let his name go on it anyway — tells me that what I did was wrong and that he is disgusted with me. I cannot take this seriously at all, and not because he is mistaken about the facts.

  (F) A colleague who plagiarized a paper five years ago, was never caught, and knows it, reports my plagiarism to the committee. I think he is within his rights to report me, and I think the committee should act on it. But when he then tells me that he is personally disgusted with me, I feel he has no standing to say that to me.

  (G) A stranger at another university reads about my case in the student paper and sends me a long, furious message. I don't think I owe him anything — not an explanation, not a reply. If he wants to think badly of me, that is his business.

  (H) My sister, who has never been on the receiving end of the way I treat our father, and who has her own tangled history with him, tells me I am treating him badly. She has full standing as far as I am concerned, even though she is not the one I have wronged.

  (I) A friend who has never told a lie in his life but breaks promises constantly tells me that my lying is wrong. His promise-breaking does not touch his standing here, as far as I can feel.

  (J) The person I cheated out of a prize — I won a competition by cheating and he came second — tells me I am a cheat. He also cheated, two years ago, in an entirely different competition. It does not occur to me to hold that against his standing here.

  The principle I have been using myself, and doubt: you have standing to blame me for X only if you would accept the same blame from me — only if you would submit to the standard you are applying. The thought behind it is that blame is a demand that I answer to you, and that you can only demand an answer from me if you would have given one in my place.

  Two places where I already feel it strain. In (E), my co-author would surely accept the blame if our positions were reversed — he considers himself as guilty as I am — and yet that does nothing to give him standing. In (B), the friend's conduct is identical to (A); only a counterfactual differs, and yet my verdict flips, which makes me suspect the principle is tracking what kind of person is doing the blaming rather than what kind of demand is being made.

  I would also like verdicts on two cases that are not on my list. (K) Someone who has never done X before and is doing X right now, in the middle of it, tells me that my doing X was wrong. (L) Someone who has never done X and never would, but who blames me on behalf of a friend of theirs whom I wronged — a proxy blamer, with no wrong of their own to answer for and no wrong of their own suffered.

  Please structure your answer in the following sections, in this order:

  - **Summary** — two or three sentences: the principle you would defend, and the one verdict of mine it costs me.
  - **The pattern** — one paragraph (roughly 100–150 words) on what my verdicts appear to be tracking, and where the genuine friction lies.
  - **Candidate principles** — the main body, roughly 500–700 words. Two or three principles stated precisely enough to apply to a new case, with, for each clause, the case of mine that forces it.
  - **Verdicts on further cases** — roughly 300 words: what each candidate says about (K) and (L), and about any further case you think separates them.
  - **Costs** — roughly 150–200 words: for each candidate, the verdict or verdicts of mine it cannot accommodate, stated plainly.
  - **Recommendation** — roughly 150 words: which candidate you would keep, or how you would repair it, and what I have to give up to hold it.
reasoning: |-
  Hmm, the user wants help turning their gut reactions about "standing to blame" into a coherent principle. They've provided ten detailed scenarios (A-J) along with their intuitive verdicts on whether the blamer has standing, plus two additional test cases (K and L). They've also shared their current principle ("you have standing only if you'd accept the same blame from me") and noted where it strains against their intuitions (particularly cases B and E).

  Looking at their cases, several patterns emerge. In cases where the blamer has overcome the same weakness (like the sober brother in D), standing feels strong. But if they're currently engaging in the same behavior (the drinking brother in C) or complicit in the wrong (the co-author in E), standing vanishes. Interestingly, the user gives full standing to "innocents" like the non-drinking friend (A) and their sister (H), unless that innocence feels compromised by revealed hypocrisy (B) or proxy status (L). The wronged party retains standing even if guilty of unrelated wrongs (J), while distant observers don't (G).

  Their current principle fails notably in E (complicit co-author) and B (hypothetical willingness to sin). This suggests standing isn't just about hypothetical reciprocity but about the blamer's actual relationship to the norm and the wrong. The friction seems to lie in three dimensions: whether the blamer embodies the standard they enforce (integrity), whether they're implicated in *this specific* wrong (clean hands), and whether they have relational proximity to the wrongdoer (authority).

  For candidate principles, I consider three approaches. The first ("Integrity + Relational Authority") combines personal integrity regarding the norm with relational standing to speak to *this* wrong. It handles most cases well but struggles with the proxy blamer in L. The second ("Clean Hands + Norm Investment") focuses on non-complicity and personal stake in the norm, which explains E and F perfectly but fails the innocent blamer in A and the sister in H. The third ("Reciprocity Revised") modifies their initial idea to require only that the blamer *would* submit to blame *now* (not hypothetically), which resolves B but still fails E.

  Testing these against K (mid-act blamer) and L (proxy blamer) is revealing. K challenges whether current failure nullifies standing (Integrity says yes, Clean Hands says no if not complicit, Reciprocity Revised says yes if they wouldn't accept blame). L tests whether standing can be delegated (all candidates lean no, matching the user's likely skepticism).

  Ultimately, Integrity + Relational Authority accommodates most verdicts except perhaps L (proxy blame). Since the user's cases suggest they reject proxy standing (F implies this, and H's sister has direct relational stakes), this cost seems acceptable. The recommendation is to refine this candidate by emphasizing that "authority" requires direct relational investment—not mere bystander status—which preserves their verdicts in A, H, and G while explaining E and B cleanly. This means giving up on proxy blame having standing, which aligns with their existing reactions.
answer: |-
  Here’s a structured analysis of your cases, designed to extract a principle that respects your verdicts while addressing tensions:

  ---

  ### **Summary**  
  I defend a principle requiring **integrity regarding the norm** and **relational authority to invoke it**. Your verdict in **(L)** (proxy blamer) is the cost: this principle denies standing to someone blaming on behalf of another unless they share a relational stake.

  ---

  ### **The Pattern**  
  Your verdicts track two factors: **(1)** whether the blamer *embodies the standard* they enforce (e.g., hypocrisy destroys standing: C, E, F), and **(2)** whether they possess *relational legitimacy* to address the specific wrong (e.g., strangers lack it: G; siblings retain it: H). The friction lies in cases where these factors conflict. In **(B)**, the friend’s hypothetical weakness undermines perceived integrity despite identical actions. In **(E)**, complicity destroys relational authority even if the blamer admits guilt. Your initial principle strains because it focuses narrowly on reciprocal submission to blame, ignoring *why* reciprocity matters—integrity and relational context.

  ---

  ### **Candidate Principles**

  #### **Principle 1: Integrity + Relational Authority**  
  *You have standing to blame A for wrong X only if:*  
  - **(i) You do not currently violate X yourself** (cases C, K),  
  - **(ii) You are not complicit in A’s specific wrong X** (cases E, F), *and*  
  - **(iii) You have a direct relational stake in X or in A’s moral character** (cases G, H, L).  

  **Clarifications:**  
  - (i) Current violation negates standing (C). Past violations don’t if reformed (D). Innocence is sufficient (A) unless tainted by hypocrisy (B).  
  - (ii) Complicity voids standing even if the blamer accepts blame (E).  
  - (iii) "Stake" includes being wronged (J), close relations (H), or shared community norms (A). Strangers lack standing (G).  

  **Cases forcing clauses:**  
  - (C) forces (i): Blamer currently violates X.  
  - (E) forces (ii): Blamer is complicit in X.  
  - (G) forces (iii): Stranger lacks relational stake.  

  #### **Principle 2: Clean Hands + Norm Investment**  
  *You have standing to blame A for wrong X only if:*  
  - **(i) You are not guilty of X (past or present) in a way that reveals hypocrisy** (cases B, C, F), *and*  
  - **(ii) You have a personal investment in upholding the norm against X** (cases A, G, L).  

  **Clarifications:**  
  - (i) Hypocrisy is defined by culpable inconsistency. Reformed offenders (D) or non-hypocritical violators (J) retain standing.  
  - (ii) "Investment" requires direct harm (J), relational ties (H), or demonstrated commitment (A). Disinterested observers lack standing (G).  

  **Cases forcing clauses:**  
  - (B) forces (i): Hypothetical weakness reveals hypocrisy.  
  - (G) forces (ii): Stranger lacks investment.  

  #### **Principle 3: Reciprocity Revised**  
  *You have standing to blame A for wrong X only if, when you blame A, you submit to being held accountable for X by A or a relevant party.*  

  **Clarification:**  
  - Unlike your initial principle, this focuses on *current* submission to the standard. In (B), the friend *would not* submit to blame if tempted, costing standing. In (D), the sober brother *would* submit.  

  **Cases forcing revision:**  
  - (B) forces rejection of hypothetical reciprocity.  
  - (J) allows standing if the blamer accepts blame for their own past wrong.  

  ---

  ### **Verdicts on Further Cases**  
  - **(K) Mid-act blamer:**  
    - **P1:** No standing (violates i).  
    - **P2:** No standing (hypocrisy under i).  
    - **P3:** No standing (cannot sincerely submit while violating X).  
  - **(L) Proxy blamer (on behalf of a friend):**  
    - **P1:** No standing (lacks relational stake per iii).  
    - **P2:** No standing (lacks personal investment per ii).  
    - **P3:** Standing only if proxy submits to blame for their own wrongs.  
  - **Test Case (M):** *A thief who has reformed blames you for stealing from a mutual friend.*  
    - **P1:** Standing (no complicity, relational stake).  
    - **P2:** Standing (no hypocrisy, investment via friendship).  
    - **P3:** Standing only if thief submits to blame for past theft.  

  ---

  ### **Costs**  
  - **P1 (Integrity + Relational Authority):**  
    - Costs **(L)**: Proxy blamer lacks standing even if virtuous.  
    - Tension in **(I)**: Promise-breaker has standing to blame lying if they have relational stake.  
  - **P2 (Clean Hands + Norm Investment):**  
    - Costs **(A)**: Non-drinker’s standing relies on "investment," which feels underspecified.  
    - Costs **(H)**: Sister’s standing depends on "investment," not relational role.  
  - **P3 (Reciprocity Revised):**  
    - Costs **(E)**: Complicit co-author *would* submit to blame but lacks standing.  
    - Costs **(F)**: Colleague might submit to blame but still lacks standing.  

  ---

  ### **Recommendation**  
  **Keep Principle 1 (Integrity + Relational Authority)**, but refine "relational stake" to exclude proxies. This:  
  - Explains why hypocrites (C), accomplices (E), and strangers (G) lack standing.  
  - Justifies reformed offenders (D), the wronged (J), and close relations (H).  
  - Accommodates your flip in (B): The friend’s hypothetical failure violates integrity.  
  - Resolves (I): The promise-breaker can blame lying if they have stake (e.g., friendship) and aren’t lying *now*.  

  **What you give up:** Standing for proxy blamers (L). This aligns with your verdict in (F), where the colleague’s *personal* disgust (not his role as reporter) lacks standing. To soften the cost, stipulate that "relational stake" can include delegated authority (e.g., a victim’s designated advocate), but your cases suggest this isn’t essential. Hold the line: blame requires first-hand integrity and relational grounding, not moral outsourcing.
