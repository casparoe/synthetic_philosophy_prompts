prompt: |-
  I need the specification before I can evaluate any candidate. What must a theory of slurs deliver in order to be adequate — not for exegesis, but for a purpose I will state, since adequacy is relative to it.

  The purpose: I work on the policy side of a large platform's content-moderation system. A classifier must decide, at scale and in milliseconds, whether an utterance containing a slur is removed, down-ranked, or left alone; a reviewer must then be able to explain that decision both to the user who made it and to the group it targets; and the system must keep functioning on terms and usages that did not exist when it was built.

  Write me the desiderata list: what any adequate theory of slurs has to deliver for that purpose. For each requirement, give the case or consideration that motivates it — the datum the theory must accommodate, the distinction it must not collapse, the verdict it must not get wrong. I expect the list will have to cover, among other things: the semantic status of the derogation (truth-conditional content, presupposition, conventional implicature, expressive, or act); the relation between a slur and its neutral counterpart; the difference between a term's being derogatory and its being merely offensive or vulgar, and the boundary between slurs and other identity-directed insults; quotation, report, and counterspeech, where the word occurs without the speaker endorsing it; reclamation, including the question of who is authorized to reclaim and what follows when members of the same group disagree about it; non-derogatory uses in pedagogy and art; diachronic change in both directions; cross-dialect and cross-linguistic cases; and uses that derogate with no member of the target group present.

  Then mark which requirements are non-negotiable and which are artifacts of my particular purpose. Most of all, identify the pairs that cannot be jointly satisfied and argue for each incompatibility, since those are the ones I have to make policy around. Keep the survey of existing positions short: what truth-conditional, presuppositional or conventional-implicature, and purely pragmatic accounts each buy and pay for against the list — a paragraph each at most.

  Finally, and this is why I am asking rather than looking it up: I have a working hypothesis that the distinction the system actually needs is not use versus mention but voice — a term is tolerable when the speaker is either speaking as a member of the targeted group or speaking as a conduit for someone else's words, and intolerable when the speaker is speaking in their own voice about the target. Tell me whether that criterion can be made precise enough to survive the desiderata list, what it handles that use versus mention does not, and where it breaks. No literature review; I want the criteria and the conflicts.
reasoning: |-
  Okay, let me break down this user's request. They work in content moderation at a major platform and need a theory of slurs that can operationalize automated decisions and human explanations. The core tension is between linguistic precision and real-world scalability under constraints like speed and evolving language.

  Hmm, the user's "voice" hypothesis is intriguing but I see immediate pitfalls. While it neatly handles reclamation (in-group voice) and reporting (conduit voice), it fails for pedagogical uses where outsiders discuss slurs academically, and crumbles when group membership is ambiguous (like multiracial users). The case where a non-member ironically uses a reclaimed term would wrongly pass under "conduit" framing but still cause harm.

  For the desiderata list, I'm prioritizing:
  1. Non-negotiable: Harm prevention (underpredicting slurhood risks real damage) and dynamic adaptability (language evolves faster than policy updates).
  2. Tricky trade-offs: Reclamation disagreements within communities can't be resolved linguistically - the system must default to safest option. Also, non-derogatory intent in art may still require restriction if automated systems can't detect context.

  The truth-conditional theory (slur=bad) simplifies coding but fails spectacularly for reclaimed/educational uses. Presuppositional approaches handle reporting better but make explanation harder ("the system flagged your presupposition"). Pure pragmatics captures context but is computationally impossible at scale.

  I'll emphasize how the user's proposed "voice" criterion improves on mention by capturing reclamation, but breaks on: ambiguous membership, academic contexts, and ironic hate. Ultimately, they'll need layered defenses - maybe starting with voice as initial filter, then adding whitelists for pedagogy and escalation paths for edge cases.
answer: |-
  Here's a specification of desiderata for a theory of slurs tailored to your content-moderation needs, prioritized and analyzed for conflicts:

  ### Core Desiderata (Non-Negotiable)
  1.  **Harm Prevention Flag:** *Must* identify terms carrying inherent group-based derogation potential, regardless of intent or context.  
      *Motivation:* Baseline safety - preventing unmoderated deployment of terms like racial slurs in direct attacks, even in "empty" rooms. Miss this = systemic failure.  
      *Non-negotiable:* Fundamental to platform duty of care.

  2.  **Dynamic Lexicon Integration:** *Must* provide principles for identifying *new* slurs and reclaimed terms *without* predefined lists.  
      *Motivation:* Emergent slurs (e.g., based on new identity terms), rapid reclamation (e.g., "queer"), dialectal variations (e.g., UK vs. US racial terms).  
      *Non-negotiable:* Systems decay without this. Lists are always outdated.

  3.  **Derogation ≠ Offensiveness:** *Must* distinguish slurs (derogation tied to group identity) from vulgar insults ("dick"), taboo terms ("cunt"), or offensive but non-group-targeting language.  
      *Motivation:* Policy tiers - "kike" requires different response than "motherfucker" or "idiot". Collapsing distinction leads to over-penalization or under-protection.  
      *Non-negotiable:* Precision in policy application.

  ### Critical Functional Desiderata
  4.  **Non-Endorsing Use Detection:** *Must* reliably flag contexts where the *speaker* isn't endorsing the slur:  
      a) **Quotation/Report:** "He called me a [slur]."  
      b) **Counterspeech:** "Don't use [slur]!"  
      c) **Pedagogical/Academic:** "The word [slur] originated..."  
      *Motivation:* False positives stifle reporting, education, activism. Essential for reviewer justification.

  5.  **Reclamation Handling:** *Must* accommodate:  
      a) In-group use ("What's up, n\*\*\*a?") as non-derogatory *by default* for moderation.  
      b) *Without* requiring precise speaker identity verification at scale.  
      c) While recognizing intra-group disagreement (e.g., some Black Americans reject "n\*\*\*a").  
      *Motivation:* Avoiding censorship of reclaimed speech; acknowledging contested reclamation fairly.

  6.  **Contextual Derogation Assessment:** *Must* detect when a *neutral counterpart* term is used derogatorily (e.g., "Those *people* are ruining this neighborhood" vs. census use of "people").  
      *Motivation:* "Neutral" terms weaponized circumvent slur filters. Over-reliance on lexical form misses harm.

  7.  **Explanatory Framework:** *Must* generate human-interpretable reasons for decisions:  
      a) Why term X is a slur in context Y.  
      b) Why term Z, despite being a slur, was permitted in context W.  
      *Motivation:* Reviewer→User & Reviewer→Community justification needs transparency.

  ### Key Tensions & Incompatibilities
  *   **A1 (Harm Flag) vs. D (Non-Endorsing Use):** A theory prioritizing inherent derogation (A1) risks over-flagging reports or pedagogy (D). A theory prioritizing speaker intent (D) risks under-flagming novel or ambiguous hate speech.  
      *Policy Implication:* Default to flagging *all* slur occurrences, then *require* robust context analysis for exemption (D). False negatives on A1 are catastrophic; false positives on D are manageable with escalation paths.

  *   **E (Reclamation) vs. Scalability & Identity Verification:** Recognizing reclaimed use (Ea) requires knowing speaker's group membership, but real-time verification (Eb) is infeasible/imprudent at scale. Intra-group disagreement (Ec) makes whitelisting impossible.  
      *Policy Implication:* Use probabilistic signals (e.g., in-group linguistic markers, community self-tagging) *plus* post-hoc human review for appeals. Accept higher false negatives *only* in high-signal reclamation contexts. Err toward protection if conflict (Ec).

  *   **D (Non-Endorsing Use) vs. F (Contextual Derogation):** Focusing on non-endorsing *uses of slurs* (D) may miss *derogatory uses of neutral terms* (F).  
      *Policy Implication:* Separate classifiers: Slur Lexicon + Contextual Derogation Detector. D protects against over-removal; F protects against under-removal.

  ### Theory Assessment (Schematic)
  *   **Truth-Conditional (Slur = Neutral Counterpart + Negative Property):**  
      *Buys:* Simple harm flag (A1), clear explanation (G).  
      *Costs:* Fails Non-Endorsing Use (D) catastrophically (flags reports as hate speech), ignores Reclamation (E), misses Contextual Derogation (F). *Unusable* for moderation.

  *   **Presuppositional/Conventional Implicature (Slur conventionally triggers group-based contempt):**  
      *Buys:* Strong harm flag (A1), explains why denial feels odd ("He's a kike but I don't hate Jews" ≅ contradiction), *can* handle some reporting via projection.  
      *Costs:* Struggles with Reclamation (E - how is presupposition suspended?), poor at Contextual Derogation (F), explanation (G) complex ("your utterance presupposed contempt"). Moderately useful but rigid.

  *   **Purely Pragmatic (Derogation entirely from context/intent):**  
      *Buys:* Excellent at Non-Endorsing Use (D), Contextual Derogation (F), Reclamation (E).  
      *Costs:* Fails Harm Prevention (A1) & Dynamic Lexicon (B) - needs intent/context analysis *first*, which is computationally intractable at scale/real-time. Explanation (G) becomes "we inferred your intent was bad". *Ideally accurate, pragmatically impossible* for automation.

  ### Your "Voice" Hypothesis: Assessment
  *   **What it Handles Better Than Use/Mention:**  
      *   **Reclamation:** Clearly captures "speaking as member of the targeted group."  
      *   **Counterspeech/Reporting:** "Conduit for others' words" aligns well with quoting/reporting.  
      *   Avoids the *mention* trap: Mentioning a slur for discussion isn't the same as being a conduit *for the hateful speaker*.

  *   **Where it Breaks:**  
      1.  **Pedagogy/Art by Non-Members:** A professor (non-group-member) discussing slur etymology isn't "speaking as" the group or a conduit for *a specific speaker's words*, but use is legitimate. Voice criterion might incorrectly flag.  
      2.  **Ambiguous Group Membership:** Can the system *reliably* know if the speaker *is* a member? (Scalability/Privacy nightmare). Intra-group disagreement (E) means "authorized voice" isn't binary.  
      3.  **Ironic/Hateful "Conduit":** A bigot "reporting" hate speech ("So then I said, those [slurs] should...") exploits the conduit criterion while spreading harm.  
      4.  **Derogatory Neutral Terms (F):** "Those people..." spoken in the moderator's *own voice* about a group isn't flagged, but is harmful. Voice doesn't capture this.  
      5.  **Impersonal Systemic Bias:** Policies/documentation using slurs neutrally (e.g., old laws) – not "someone else's words," but needs discussion.

  *   **Can it be Precise Enough?**  
      *   **Strengths:** Intuitive for reviewers explaining decisions ("You used this word in your own voice targeting group X"). Better than raw use/mention for key cases (E, D-b).  
      *   **Weaknesses:** Not sufficient alone. Requires combining with:  
          *   A **curated lexicon** of slurs (A1, B).  
          *   A separate **contextual derogation detector** for neutral terms (F).  
          *   **Escalation pathways** for ambiguous voice/identity cases (pedagogy, art, contested reclamation – E, D-c).  
          *   **Robust "conduit" detection** to prevent abuse (D-a).

  ### Conclusion & Recommendation
  *   **Core Policy Tensions:** You *must* build around the A1 vs. D and E vs. Scalability/Identity conflicts. Prioritize preventing direct harm (A1) and dynamic adaptation (B). Use layered analysis:  
      1.  **Lexical Flag:** Is it a known slur or probable emergent slur? (A1, B) → *Flag for review*.  
      2.  **Voice/Context Filter:** Apply "own voice" vs. "conduit/in-group" *heuristics* (leveraging metadata, phrasing patterns) to *downgrade urgency* or *propose allowance* for D & E cases.  
      3.  **Neutral Term Scrutiny:** Run separate model for derogatory use of neutral identity terms (F).  
      4.  **Human Review & Appeal:** Essential for ambiguous voice, pedagogy, art, contested reclamation, and explanation (G).  
  *   **"Voice" Criterion:** Use it operationally **as a powerful heuristic within Step 2**, not as the sole theory. It significantly improves handling of reclamation and reporting over naive use/mention but *requires supplementation* for pedagogy, neutral-term derogation, and ambiguous cases. Its strength is in making reviewer explanations (G) more intuitive ("You used it *about* them, not *as* them or *reporting* it"). Invest in refining "conduit" detection to limit abuse.  
  *   **Theoretical Foundation:** Adopt a **hybrid presuppositional/pragmatic** model:  
      *   Slurs *conventionally mark* potential for group-based contempt (satisfies A1, B, partially explains G).  
      *   This contempt *can be suspended or reconfigured* by context (voice, intent, reclamation) (accommodates D, E).  
      *   *Plus* a distinct mechanism for detecting derogatory uses of neutral terms (F).  
      This provides a framework for automation (flagging markers) and human review (contextual suspension).
