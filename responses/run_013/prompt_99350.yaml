          - Alternatively, we might use generalized imaging that does not shift all the probability? But then it wouldn't be standard imaging.

          - In general, imaging does not preserve conditional probabilities but rather sets P_new(B|A) to a value that is determined by the shift. It does not allow us to set it to an arbitrary q.

          - Therefore, imaging does not satisfy the requirement of respecting the conditional probability constraint in Judy Benjamin.

