    B. Adams-style conditional-probability constraints (via the principle of minimum cross-entropy):
          - The idea is to minimize the KL-divergence (cross-entropy) subject to the constraint P_new(B|A)=q (and any other constraints). This is a generalization of Jeffrey conditionalization.

