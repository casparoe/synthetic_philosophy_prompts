  We are preparing desiderata for updating on conditional information, as in the Judy Benjamin problem and related cases.
   The update involves learning a conditional report "if A then B" with some probability, which may affect the probability of A itself.

   We distinguish between:
     - Basic requirements that any probabilistic update must meet (e.g., coherence, respecting certainties).
     - Optional modeling choices (e.g., minimizing divergence, respecting conditional structure).

   We will consider the following cases to motivate the desiderata:

    1. The original Judy Benjamin case: 
          - Judy is dropped in a territory with two areas: Red (R) and Blue (B). Each area is divided into Second Company (S) and Headquarters (H). Thus, four quadrants: RS, RH, BS, BH.
          - Prior: uniform over the four quadrants.
          - She is told: "If you are in Red territory, then the probability that you are in Second Company area is 3/4." 
          - This is a conditional report: if R then P(S|R)=3/4.

    2. Case with nonzero prior of A: 
          - A conditional report "if A then B" is given, and P_old(A) > 0.

    3. Two sources of unequal reliability reporting the same conditional: 
          - Two sources independently report "if A then B", but with different reliabilities.

    4. Reported conditional concerns an objective chance that depends on the agent's posterior:
          - The conditional report is about an objective chance (e.g., "if you do A, then the chance of B is p"), and the chance might depend on the agent's state (e.g., in a decision problem).

    5. Agent must act before learning whether A:
          - The agent updates on the conditional but then must make a decision without learning the truth of A.

   We now set out the desiderata and the cases that motivate them.

   Desiderata:

    1. Coherence (Basic Requirement):
          - The updated degrees of belief must form a probability distribution.
          - Motivated by: Any case of probabilistic update.

    2. Certainty Preservation (Basic Requirement):
          - If the new information logically entails a proposition (with probability 1), then that proposition should be assigned probability 1 in the posterior.
          - However, note that in conditional reports, the report itself is typically not a proposition that becomes certain (unless it is a conditional with probability 1). We might instead require that the conditional probability constraint is satisfied in the posterior.
          - Motivated by: Any update that includes learning a fact with certainty. But in our conditional cases, the constraint is probabilistic.

    3. Respect for Conditional Probability Constraint (Basic Requirement for the given report):
          - If the update is based on learning that P(B|A) = q (for some q in [0,1]), then the posterior should satisfy P_new(B|A) = q (provided P_new(A) > 0).
          - Motivated by: The Judy Benjamin case and the case with nonzero prior of A. In Judy Benjamin, we are told that if in Red, then the conditional probability of being in Second Company is 3/4. So we require P_new(S | R) = 3/4.

    4. Minimal Change (Optional Modeling Choice):
          - The update should change the prior as little as possible to accommodate the new constraint. This is often implemented by minimizing some divergence (like Kullback-Leibler) between the prior and posterior, subject to the constraint.
          - Motivated by: The principle of conservatism. It is a common desideratum in update rules (e.g., Jeffrey conditionalization).

    5. Handling Zero Antecedent Probability (Basic Requirement?):
          - If the prior probability of A is zero, then the conditional probability P(B|A) is undefined. The update rule must specify how to handle such cases. One option is to leave the conditional probability undefined and not change anything. Another is to use a more general rule (like imaging) that can assign probabilities even when the prior of A is zero.
          - Motivated by: A case where the prior P_old(A)=0 and then we get a report "if A then B". For example, in Judy Benjamin, if Judy had been certain she was in Blue territory (so P_old(R)=0) and then she gets the report about Red, what should happen?

    6. Independence of Representation (Optional?):
          - The update should not depend on how the sample space is partitioned (e.g., in Judy Benjamin, whether we use the four quadrants or aggregate in some way). This is sometimes violated by imaging methods that depend on a "selection function".

    7. Handling Multiple Reports (Basic Requirement for multiple constraints):
          - If there are multiple conditional reports, the update should satisfy all the constraints simultaneously (if consistent). If they are inconsistent, the rule must specify how to handle it.
          - Motivated by: Two sources of unequal reliability reporting the same conditional. We might want to combine them appropriately.

    8. Agent's Action Context (Optional Modeling Choice for decision making):
          - In cases where the agent must act without learning the truth of A, the update should provide a posterior that appropriately guides action. This might require that the update rule does not change the probabilities of actions in ways that are not justified by the conditional report.
          - Motivated by: The case where the agent must act before learning whether A.

    9. Chance-Action Interdependence (Basic Requirement for objective chance reports that depend on the agent's state):
          - If the conditional report is about an objective chance that may depend on the agent's posterior state (e.g., in a decision problem), then the update rule should account for the fact that the chance might be defined in terms of the agent's own actions or beliefs. This might require a fixed-point condition.
          - Motivated by: The case of reported conditional concerning an objective chance that depends on the agent's posterior.

    10. Consistency with Jeffrey Conditionalization for Unconditional Inputs (Optional):
          - When the conditional report reduces to an unconditional report (e.g., if we learn that P(A)=q, then the update should be the same as Jeffrey conditionalization on A).
          - Motivated by: The case where the antecedent is a tautology (so we are effectively learning P(B) = q) or when the conditional report is unconditional in disguise.

    11. Preservation of Ratios Given the Antecedent (Optional, but common in some approaches):
          - For worlds where A is true, the ratios of probabilities of subregions consistent with A should be preserved. This is the hallmark of imaging (or Lewis's rule) and also of some conditionalization rules (like the one proposed for Judy Benjamin by van Fraassen).
          - In Judy Benjamin: within Red territory, the ratio P(RS)/P(RH) is preserved? Note: the prior is uniform, so RS:RH = 1:1. After update, if we preserve ratios, then P_new(RS)/P_new(RH) should still be 1:1? But the constraint is P_new(S|R)=3/4, which would lead to P_new(RS) = 3 * P_new(RH). So this would conflict. Therefore, we cannot have both the ratio preservation and the conditional probability constraint? 

          This leads to:

    12. Conflict between Ratio Preservation and Conditional Probability Constraint? (Potentially Incompatible Requirements):
          - In the Judy Benjamin case, if we require both:
              (a) P_new(S|R) = 3/4
              (b) The ratios of probabilities within R are preserved: P_new(RS)/P_new(RH) = P_old(RS)/P_old(RH) = 1
          then we get a contradiction because (a) implies P_new(RS) = 3 * P_new(RH) (if we assume P_new(RS)+P_new(RH)=P_new(R)), which would make the ratio 3, not 1.

          Therefore, we cannot have both. So:

          - Ratio preservation (within the antecedent) and the conditional probability constraint are incompatible in general.

          - This means that we must choose one or the other. The Judy Benjamin problem is often used to argue against ratio preservation (i.e., against imaging) because we are explicitly given a conditional probability constraint.

    13. Handling Uncertain Reliability (Optional Modeling Choice for multiple sources):
          - When two sources of unequal reliability report the same conditional, the update should weight the reports by their reliability. This might require a more complex model (e.g., using a beta prior for the reliability).

