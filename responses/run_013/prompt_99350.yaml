                  x = 3y, and we set z and w to 0.25? But then we have x+ y = 4y = 0.25? No, because if z and w are 0.25 then x+y=0.5. And 4y=0.5 => y=0.125, x=0.375. And then z=w=0.25. This is the same as the Jeffrey solution above? But note: in this solution we did not fix P_new(R). We have P_new(R)=x+y=0.5, which equals the prior. So it coincides.

