                  We minimize KL-divergence: sum p_i log(p_i / q_i) where q_i are the prior probabilities.

                  We set:
                      p1 = x, p2 = y, p3 = z, p4 = w.
                      x = 3y, and x+y+z+w=1.

                  We minimize: 
