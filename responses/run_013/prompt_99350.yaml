              - Coherence: yes, because it produces a probability distribution.
              - Certainty preservation: if we are conditioning on A (which is what imaging does) then A becomes certain. But in our case, we are not conditioning on A, we are learning a conditional.

          - Imaging is designed for learning that A is true (conditioning on A) in a context with indeterminacy (via the selection function). It is not designed for learning conditional probabilities.

