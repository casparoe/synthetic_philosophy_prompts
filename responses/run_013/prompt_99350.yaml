  ### Desiderata for Updating on Conditional Information  
  Below are the desiderata for any adequate theory of updating when receiving a report of the form "if A then B" with probability *q*, where the antecedent A may be false or have its probability shifted by the report. Each requirement is motivated by a specific case. Desiderata are categorized as **basic** (mandatory for coherence) or **optional** (modeling choices). Conflicts between requirements are noted.  

  #### **Basic Requirements**  
  1. **Coherence (Probabilistic Consistency)**  
     - **Description**: The posterior must be a valid probability distribution (non-negative, normalized, additive).  
     - **Motivating Case**: *All cases* (e.g., Judy Benjamin). Violating coherence leads to inconsistent beliefs.  

  2. **Respect for Certainties**  
     - **Description**: If the report *logically entails* a proposition *C* (e.g., *q* = 1 for "if A then B" implies ¬A ∨ B), *C* must have posterior probability 1.  
     - **Motivating Case**: *Original Judy Benjamin*. The report "if in Red, then P(in Second Company) = 3/4" may indirectly constrain possibilities (e.g., ruling out Red without Second Company if *q* = 1).  

  3. **Satisfaction of Conditional Constraint**  
     - **Description**: If the report asserts P(B|A) = *q* and P_new(A) > 0, the posterior must satisfy P_new(B|A) = *q*.  
     - **Motivating Case**: *Nonzero prior of A*. If P_old(A) > 0 (e.g., "if it rains, P(storm) = 0.8"), the posterior must reflect *q* = 0.8 given A.  

  4. **Handling Zero Prior Probability**  
     - **Description**: The update must define behavior when P_old(A) = 0 (e.g., ignore the report, extend to P_new(A) > 0, or leave P(B|A) undefined).  
     - **Motivating Case**: *Report depends on posterior*. If told "if you bet on A, P(win) = 0.9" but P_old(bet) = 0, the theory must specify how beliefs change upon hypothetically betting.  

  #### **Optional Modeling Choices**  
  5. **Minimal Information Loss**  
     - **Description**: The update should minimize divergence (e.g., Kullback-Leibler) from the prior, subject to constraints.  
     - **Motivating Case**: *Original Judy Benjamin*. Preserving prior ratios where possible (e.g., within Blue territory) reflects conservatism.  

  6. **Preservation of Antecedent Odds**  
     - **Description**: The odds of A to ¬A should remain unchanged unless the report directly affects them.  
     - **Motivating Case**: *Original Judy Benjamin*. The report "if in Red, P(Second Company) = 3/4" may be interpreted as irrelevant to P(Red)/P(Blue).  

  7. **Source Reliability Integration**  
     - **Description**: Reports from sources of unequal reliability should be weighted (e.g., via Bayesian pooling).  
     - **Motivating Case**: *Two sources, unequal reliability*. Source 1 (reliable) and Source 2 (unreliable) both report "if A then B" with *q* = 0.9; the posterior should favor Source 1.  

  8. **Chance-Action Interdependence Handling**  
     - **Description**: If the report describes objective chances depending on the agent’s posterior (e.g., "if you do A, P(B) = *q*"), the update should account for this feedback.  
     - **Motivating Case**: *Reported chance depends on posterior*. Told "if you buy stock X, P(profit) = 0.7," but P(profit) depends on collective beliefs.  

  9. **Acting Under Antecedent Uncertainty**  
     - **Description**: The posterior should support decision-making without learning A (e.g., via conditioning on the report alone).  
     - **Motivating Case**: *Agent must act before learning A*. Judy Benjamin must navigate before knowing if she is in Red territory.  

  #### **Conflicting Requirements**  
  - **Preservation of Ratios Within A vs. Conditional Constraint**:  
    - **Conflict**: Preserving prior probability ratios among A-worlds (e.g., P_old(RS)/P_old(RH) in Judy Benjamin) is incompatible with satisfying P_new(B|A) = *q* ≠ P_old(B|A).  
    - **Example**: In Judy Benjamin, prior ratios within Red are RS:RH = 1:1. Enforcing P_new(S|R) = 3/4 forces RS:RH = 3:1, violating ratio preservation.  
    - **Resolution**: Theories must choose one (e.g., ratio preservation via imaging vs. constraint satisfaction via conditionalization).  

  ---  

  ### Evaluation of Update Theories  
  #### **1. Jeffrey Conditionalization**  
  - **Approach**: Updates by rescaling probabilities given new unconditional probabilities for a partition. Adapts to conditionals by treating P_new(B|A) = *q* as a constraint on a partition (e.g., {A∧B, A∧¬B, ¬A}).  
  - **Fare Against Desiderata**:  
    - **Basic**: Ensures coherence and respects certainties if the partition includes them. Satisfies P_new(B|A) = *q* only if P_new(A) is fixed (else underdetermined).  
    - **Optional**: Allows minimal KL-divergence if P_new(A) is preserved. Fails ratio preservation within A. Struggles with zero prior P_old(A) (undefined).  
    - **Cases**: Works for Judy Benjamin if P(Red) is preserved; handles acting under uncertainty. Poor for chance-action interdependence (no feedback).  

  #### **2. Adams-Style Conditional-Probability Constraints**  
  - **Approach**: Directly enforces P_new(B|A) = *q* without changing P_new(A) or probabilities given ¬A.  
  - **Fare Against Desiderata**:  
    - **Basic**: Coherent if P_old(A) > 0. Respects the conditional constraint by design.  
    - **Optional**: Preserves antecedent odds and ratios within ¬A. Minimal change only for fixed P_new(A). Cannot handle P_old(A) = 0.  
    - **Cases**: Ideal for Judy Benjamin (preserves P(Red)/P(Blue)). Fails for chance-action interdependence or unreliable sources (no weighting).  

  #### **3. Imaging (Selection Functions)**  
  - **Approach**: Shifts probability from ¬A-worlds to "closest" A-worlds, then normalizes.  
  - **Fare Against Desiderata**:  
    - **Basic**: Coherent but violates the conditional constraint (sets P_new(A) = 1, so P_new(B|A) = P_new(B) ≠ *q* generally).  
    - **Optional**: Preserves prior ratios among A-worlds by redistributing ¬A probability proportionally. Does not preserve antecedent odds (P_new(A) = 1).  
    - **Cases**: Fails Judy Benjamin (cannot enforce P_new(S|R) = 3/4). Handles zero prior P_old(A) (shifts to A). Poor for acting under uncertainty (forces A to be certain).  

  ---  
  **Key Takeaways**:  
  - **Non-Negotiable**: Coherence, certainties, and conditional constraints (when defined).  
  - **Trade-offs**: Ratio preservation within A conflicts with conditional constraints; preservation of antecedent odds is optional.  
  - **Gaps**: Zero prior P_old(A) and chance-action interdependence require extensions.  
  - **Best Fit**:  
    - *Judy Benjamin/nonzero prior*: Adams or Jeffrey (if P(A) fixed).  
    - *Unreliable sources*: None natively; needs reliability weighting.  
    - *Chance-action feedback*: None; requires causal/decision-theoretic extensions.  
    - *Acting under uncertainty*: Adams or Jeffrey (if P(A) not forced to 1).
