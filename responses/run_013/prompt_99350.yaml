          - Should the update preserve the ratio of the probability of A to the probability of ~A? In the Judy Benjamin case, one proposal (by van Fraassen) preserves P(R)/P(B) (the ratio of the probability of Red to Blue). But is that required? The report does not explicitly say anything about the probability of Red. However, it might indirectly affect it.

          - Motivated by: Judy Benjamin. Some argue that the report should not change the relative odds of R and B because the report only gives conditional information. But note: the report might be more likely to be given in one region than another? The problem does not specify the reliability of the report. In the original, we assume the report is truthful and we are to update accordingly.

