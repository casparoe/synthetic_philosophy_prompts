   Now, how do the update methods fare?

    A. Jeffrey conditionalization:
          - Typically used for updating on new probabilities for a partition. But we have a conditional constraint, not a partition.
          - In Judy Benjamin, if we try to use Jeffrey conditionalization on the partition {R, ~R} (i.e., we set new probabilities for Red and Blue), we don't have that input. And if we try to use the partition {A, ~A} we don't have the new probabilities for A.
          - However, we can use a generalization: we set constraints on conditional probabilities. But Jeffrey conditionalization, as standard, does not handle conditional constraints.

          - How it fares:
              - Basic requirements (coherence, certainty preservation) are met if we can set the constraints appropriately.
              - But it cannot directly incorporate a constraint on P(B|A). We would have to find a partition and new probabilities for that partition that satisfy the constraint.

          - In Judy Benjamin, one idea: partition the space by A and then by B. But we don't have new probabilities for A. So we must either leave the probability of A unchanged? That would be the "Jeffrey" way for the partition {A, ~A}. Then we set P_new(B|A)=3/4 and P_new(B|~A) = P_old(B|~A). This is known as "Jeffrey's rule for conditionals" or "probability kinematics".

          - This rule: 
              - Preserves the odds of A and ~A? Yes, because P_new(A) = P_old(A).
              - Preserves conditional probabilities given ~A? Yes, because P_new(B|~A)=P_old(B|~A).
              - But does it preserve conditional probabilities given A? Only for B? Actually, it changes P_new(B|A) to the new value, so it does change the conditional distribution given A.

          - How does it do in Judy Benjamin?
              - Prior: P(RS)=P(RH)=P(BS)=P(BH)=0.25.
              - A = R, B = S.
              - P_old(S|R) = P(RS)/P(R) = 0.25/0.5 = 0.5.
              - We set P_new(S|R)=0.75, and we set P_new(S|B)=P_old(S|B)=0.5 (because P_old(S|B)=0.5). And we set P_new(R)=P_old(R)=0.5.

              Then:
                  P_new(RS) = P_new(S|R) * P_new(R) = 0.75 * 0.5 = 0.375
                  P_new(RH) = (1-0.75)*0.5 = 0.125
                  P_new(BS) = P_new(S|B)*P_new(B) = 0.5 * 0.5 = 0.25
                  P_new(BH) = 0.5 * 0.5 = 0.25

              Now, note: the overall probability of S is 0.375+0.25=0.625.

              But: is this the right update? Some argue that Judy should not change her probability of being in Blue territory. But in this update, she doesn't. However, she does change the distribution within Red.

          - This method satisfies:
              - Coherence: yes.
              - Certainty preservation: if the constraint is certain (q=1 or 0) then it would set that conditional probability accordingly.
              - Respect for conditional probability constraint: by design, P_new(B|A)=q.
              - Minimal change? It minimizes the KL-divergence under the constraint that P_new(A)=P_old(A) and P_new(B|A)=q and P_new(B|~A)=P_old(B|~A). So it is a form of minimal change with these constraints.

