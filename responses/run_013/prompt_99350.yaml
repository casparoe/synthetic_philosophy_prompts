          - Imaging (Lewis) shifts the probability from ~A-worlds to A-worlds in a way determined by a "selection function". 
          - We move the probability of each ~A-world to the "closest" A-world. Then the posterior probability of a proposition is the prior probability of its image.

          - How to set the selection function? In Judy Benjamin, if we have a world in Blue (say, BS or BH), we must move its probability to a Red world. But which one? If we move it to RS or to RH? 

          - The constraint is about the conditional probability: we want P_new(S|R)=3/4. After imaging, the probability of R becomes 1 (because we move all probability to R worlds). Then P_new(S|R) = P_new(RS) / P_new(R) = P_new(RS). But we need this to be 3/4. How can we achieve that?

