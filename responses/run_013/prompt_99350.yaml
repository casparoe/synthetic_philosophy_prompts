          - For the zero prior case: if P_old(A)=0, then imaging shifts all probability to A, so P_new(A)=1. But the conditional constraint might not be satisfied.

          - For two sources: unclear how to combine.

          - For chance dependence: not designed.

          - Acting without learning A: imaging makes A certain, so it does learn A? So not appropriate.

    Summary of how the methods fare:

      Requirement: Coherence
          - All three methods: Jeffrey, Adams (min cross-entropy), and imaging produce a probability distribution.

      Requirement: Respect for conditional probability constraint (in the posterior when P_new(A)>0)
          - Jeffrey (with fixed P(A)): yes, by design.
          - Adams (min cross-entropy): yes, by design.
          - Imaging: no, because it makes P_new(A)=1 and then P_new(B|A)=P_new(B), which might not equal q.

      Requirement: Handling zero prior of A
          - Jeffrey: fails (since it uses conditional probability which is undefined).
          - Adams: fails (same reason).
          - Imaging: sets P_new(A)=1, but then the conditional constraint (which was about the conditional probability) is not necessarily satisfied.

      Requirement: Minimal change (in the sense of KL-divergence)
          - Jeffrey: minimizes KL subject to fixed P(A) and the conditional constraints on A and ~A.
          - Adams: minimizes KL subject only to the conditional constraints (and possibly others).
          - Imaging: minimizes change in a different sense (by moving probabilities minimally in terms of the selection function) but not by KL-divergence.

      Requirement: Preservation of ratios within A
          - Jeffrey: does not preserve (as shown in Judy Benjamin: 1:1 becomes 3:1).
          - Adams: does not preserve (same).
          - Imaging: after the shift, there are no non-A worlds. But within A, the ratios are changed because we added probability from non-A worlds. We didn't preserve the prior ratios within A.

      Requirement: Preservation of odds of the antecedent
          - Jeffrey: preserves P(A)/P(~A).
          - Adams: does not necessarily preserve (it might change P(A) to satisfy the constraint with minimal change).
          - Imaging: sets P(A)=1, so it does not preserve.

      Requirement: Two sources of unequal reliability
          - Jeffrey: not designed for multiple constraints, so not easily.
          - Adams: can incorporate multiple constraints (if consistent) by min cross-entropy.
          - Imaging: not designed.

      Requirement: Objective chance that depends on the agent's posterior
          - None of the methods naturally handle this. We would need a fixed-point condition.

      Requirement: Acting without learning A (so we need a posterior that doesn't make A certain unless the report implies it)
          - Jeffrey: does not make A certain (unless the constraint forces it, e.g., q=1 and then P_new(B|A)=1, but not P_new(A)=1).
          - Adams: same.
          - Imaging: makes A certain, so not appropriate.

      Requirement: Independence of representation
          - Jeffrey and Adams: these methods are partition independent? Actually, min cross-entropy is defined on the whole space and is partition independent.
          - Imaging: depends on the selection function, which might be sensitive to the representation.

    Therefore, for the Judy Benjamin problem, both Jeffrey (with fixed P(A)) and Adams (min cross-entropy without fixing P(A)) can work. The original Judy Benjamin solution by van Fraassen used a different rule that preserved P(R)/P(B) and also satisfied the conditional constraint. That rule is equivalent to the min cross-entropy solution under the additional constraint of preserving P(R) and P(B). And in the uniform prior case, that is the same as the Jeffrey rule we described.

    However, note that in Judy Benjamin, van Fraassen's solution is:

          P_new(RS) = 0.5 * (3/4) = 0.375,   P_new(RH)=0.5 * (1/4)=0.125, 
          P_new(BS)=0.25, P_new(BH)=0.25.

    This is the same as the Jeffrey rule we applied.

    But what if the prior were not uniform? The rule that preserves P(R) and sets P_new(S|R)=q would be:

          P_new(RS) = P_old(R) * q, 
          P_new(RH) = P_old(R) * (1-q),
          and leaves the probabilities of BS and BH unchanged? But then the total probability would be P_old(R) + P_old(BS)+P_old(BH) = P_old(R) + P_old(~R) = 1? So we leave the probabilities of the Blue worlds unchanged? But note: the prior probabilities of BS and BH might have been different.

          Example: prior: RS:0.1, RH:0.4, BS:0.3, BH:0.2. Then P_old(R)=0.5.

          After update: 
              P_new(RS)=0.5 * 0.75 = 0.375
              P_new(RH)=0.5 * 0.25 = 0.125
              P_new(BS)=0.3, P_new(BH)=0.2.

          Then the new total is 0.375+0.125+0.3+0.2=1.0. And P_new(S|R)=0.375/(0.375+0.125)=0.75.

          But note: we changed the probabilities within R without affecting Blue. This is the same as the Jeffrey rule for conditionals (with fixed P(R)).

          And it minimizes KL-divergence under the constraints: 
              P_new(R)=P_old(R), 
              P_new(S|R)=q, 
              and P_new(BS)=P_old(BS), P_new(BH)=P_old(BH) [which implies P_new(S|B)=P_old(S|B)].

          So it is a min cross-entropy solution under these constraints.

    Therefore, the Judy Benjamin update is a special case of min cross-entropy with the additional constraint of preserving the absolute probabilities of the events outside the antecedent (or equivalently, preserving the probability of the antecedent and the conditional probability given the negation of the antecedent).

    However, note that the min cross-entropy solution without preserving P(R) might set different values. For example, without the constraint on P(R), we might get a solution that changes P(R). But in the original problem, it is argued that the report does not change the probability of R. So we impose that constraint.

    Conclusion: the min cross-entropy method (Adams-style) is the most flexible and can be tailored by the constraints we impose. The Judy Benjamin problem suggests that we should impose the constraint of preserving the probability of the antecedent. But that is an optional modeling choice.

    However, in the case where the conditional report might affect the probability of the antecedent (e.g., because the report is more likely to be given in some regions), then we might not want to preserve P(R). Therefore, the desideratum of preserving the probability of the antecedent is optional.

    In summary, the core requirements are coherence and respecting the conditional probability constraint. The other desiderata are optional and may conflict (e.g., preserving ratios within A conflicts with the conditional constraint) and must be chosen based on the context.

    We have also seen that imaging does not work for conditional probability constraints.

    For zero prior of A, none of the methods work well. We might need to extend the framework (e.g., by allowing the update to set P_new(A)>0 even if P_old(A)=0, but then we must have a rule for how to set the conditional probabilities given A). This is an open issue.

    For two sources, min cross-entropy can handle it if we set multiple constraints. For unequal reliability, we might need to adjust the constraints (e.g., by weighting them) but that goes beyond standard min cross-entropy.

    For the chance-action interdependence, we need a different approach (e.g., causal decision theory or a fixed-point solution).

    Finally, for acting without learning A, both Jeffrey and Adams work, but imaging does not.
