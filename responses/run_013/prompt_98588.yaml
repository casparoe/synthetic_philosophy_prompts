prompt: |-
  Ok so I'm putting together an adversarial-collaboration doc for a reading group I run, and I want you to draft the actual joint statement. Topic is the wrong kind of reasons problem — you know, the thing where there can apparently be reasons to have an attitude (believe something, admire someone, be afraid of something) that dont bear on whether the attitude is correct or fitting, only on whether it's good or useful to have it. Two people in my group have been going at each other for months and I want to force them to write down what they actually agree on.

  The two camps are: (A) the fittingness-first crowd, who think there's a real and principled right-kind / wrong-kind distinction — a reason of the right kind bears on whether the attitude meets its own standard of correctness, a wrong-kind reason bears only on the payoff of having the attitude — and that the fitting-attitude approach to value needs this distinction to work at all. (B) the skeptics, who think the distinction is ad hoc, circular, or just collapses when you look closely — that so-called wrong-kind reasons are really just reasons for some other attitude (wanting to have it, wanting to be the sort of person who has it, taking steps to acquire it), and that 'right kind' never gets a non-question-begging explanation.

  What I want the document to contain: a numbered list of claims both sides can sign (including about the cases themselves — what's actually going on, what isn't in dispute, whether either side's machinery is even explaining anything here), then a disagreements table where each remaining disagreement is stated in wording each side would accept for its own view, then the cruxes — the sub-questions such that settling one would move at least one side — and for each crux a case or argument that both sides agree bears on it, with each side's prediction written down in advance.

  To stop them just recycling the standard cases, I've told them they have to use these three, which came up in group and which nobody seems to have a canned answer to:

  - your landlord offers to forgive next month's rent if you can get yourself to be genuinely moved by his terrible self-published novel (admiration / the aesthetic case);
  - a firm pays a 'belief bonus' to employees who sincerely come to believe the company's mission matters, paid whether or not they can tell they're being bought (belief);
  - someone wants to feel grateful toward a parent who was abusive, because their therapist says the gratitude will help them heal (gratitude).

  For each, I want both camps to say what they predict about it, whether it's right-kind, wrong-kind or genuinely unclear, and why.

  One more thing to put in there: my own half-baked idea, which they should either build on or shoot down with reasons. I think the whole distinction is really about what standard a reason gets answered by — a right-kind reason for an attitude is one that the attitude's own correctness condition could be satisfied by, i.e. if you asked 'yes, but is the attitude correct?' the reason would speak to that question, whereas a wrong-kind reason leaves that question exactly where it was. I want them to test that against the three cases and say whether it sharpens the distinction or just restates it in fancier words. Also I suspect at least part of their fight is verbal — if so, say which part and why, and whats left over once the verbal part is set aside.

  Dont worry about references or who said what, we'll add those ourselves. And dont be diplomatic for its own sake — if some claim both sides 'agree' on turns out to be vacuous, say so.
reasoning: |-
  Okay, the user is running a reading group and has two members deeply divided on the "wrong kind of reasons" problem. They want me to draft an adversarial-collaboration document that forces both camps to clarify their agreements and disagreements. The goal is to move past stalemate by focusing on three novel cases instead of recycled examples.  

  First, I need to map the core conflict: Camp A sees a principled distinction between reasons bearing on attitude correctness (right-kind) versus practical benefits (wrong-kind), while Camp B views this as circular or collapse-prone, arguing "wrong-kind" reasons are just reasons for meta-attitudes.  

  The user’s half-baked idea—that right-kind reasons are those the attitude’s correctness condition could *answer*—is intriguing. I’ll frame it as a testable lens for the three cases.  

  For the joint statement:  
  - **Agreements**: Start with non-negotiable common ground (e.g., attitudes have correctness conditions, practical incentives exist). Flag where agreements might be superficial (e.g., "distinction is useful but not explanatory").  
  - **Disagreements table**: Present each side’s view neutrally. Camp A’s stance: correctness-constitutive reasons vs. extrinsic inducements. Camp B’s: all reasons are "right-kind" for *some* attitude; the distinction is psychological.  
  - **Cruxes**: Identify pivot points where resolving one would change minds. Crux 1: Can correctness conditions *themselves* explain the distinction without circularity? Crux 2: Do incentives (like belief bonuses) create new correctness conditions? Crux 3: Does Camp B’s meta-attitude shift just relocate the problem?  
  - **Case predictions**: For each of the three cases, outline both camps’ analyses. The landlord case tests whether admiration can be "bought"; the belief bonus probes if incentives alter epistemic norms; the forced gratitude examines therapeutic pragmatism versus fittingness.  

  User’s idea assessment: Their "answered by correctness" formulation avoids Camp B’s circularity charge? Not quite—it might just reframe the question. But applying it to cases could reveal nuances (e.g., in the belief bonus, money doesn’t make the mission *true*, so it fails the test).  

  Veridian disagreements: Likely over "reason for an attitude" (Camp A: direct bearing on correctness; Camp B: always mediated). Isolating this might show deeper clashes about normativity.  

  Finally, emphasize that the doc’s value is in forcing precision—not resolution. The predictions (“If Crux 1 is settled, Camp B would concede X”) make disagreements testable.  

  Side note: User’s cases are brilliantly messy. The forced gratitude example, for instance, pits psychological healing against moral fittingness—neither camp has clean answers here, which is perfect for exposing assumptions.
answer: |-
  Here’s a draft adversarial-collaboration document designed to force clarity, isolate disagreements, and test your proposed framework against the three novel cases. It avoids diplomacy, flags vacuous agreements, and requires explicit predictions.

  ---

  ### **Adversarial Collaboration: The Wrong Kind of Reasons (WKR) Problem**  
  **Joint Statement of Agreements, Disagreements, and Cruxes**  

  #### **1. Agreements (Both Camps Endorse)**  
     - **1.1 Attitudes have "correctness conditions"**: Beliefs aim at truth, admiration at admirability, fear at fearsomeness, etc.  
     - **1.2 Practical incentives exist**: Agents can be given reasons (money, therapy benefits, rent forgiveness) to *bring about* or *sustain* an attitude.  
     - **1.3 The WKR label tracks *something***: There is a pragmatic distinction between (i) reasons that intuitively "feel like they bear on correctness" and (ii) reasons that feel "extrinsic" (e.g., bribes).  
     - **1.4 Cases involve distinct psychological mechanisms**: Inducing an attitude via incentive (e.g., self-deception for a bonus) differs from forming it via responsiveness to correctness (e.g., evidence).  
     - **1.5 Camp B’s "meta-attitude" move isn’t trivial**: Reasons to *want* an attitude are distinct from reasons to *have* it.  
     - **1.6 Vacuous Agreement?**: *"The distinction is useful for classifying intuitions."* → Both grant this, but **Camp A** sees it as evidence of a metaphysical distinction, **Camp B** as a pragmatic heuristic.  

  ---

  #### **2. Disagreements Table**  
  | Issue | Camp A (Fittingness-First) | Camp B (Skeptics) |
  |-------|-----------------------------|-------------------|
  | **Nature of the RK/WK distinction** | Principled, metaphysical distinction: RKRs *constitutively bear* on correctness conditions; WKRs are *merely extrinsic inducements*. | No principled distinction: "WKRs" are just RKRs *for a different attitude* (e.g., wanting to believe/admire). The "RKR/WKR" split is psychological, not normative. |
  | **Explanatory priority** | Correctness conditions (fittingness) explain the RKR/WKR distinction. Without it, fitting-attitude analysis collapses. | Correctness conditions alone *cannot* ground the distinction without circularity. "Fittingness" is defined by RKRs, which lack independent grounding. |
  | **What "reasons for an attitude" are** | A reason for attitude A must *address A’s correctness condition* to be "of the right kind." | Any consideration that counts in favor of *having* A is a reason for A. "WKRs" qualify but are outweighed by correctness-based reasons. |
  | **Threat of collapse** | Deny collapse: Incentives (WKRs) don’t become correctness-reasons; they exploit psychological loopholes. | Distinction collapses: All reasons can be framed as bearing on correctness if we adjust the attitude’s "standard" (e.g., "belief-utility" as a new correctness condition). |

  ---

  #### **3. Cruxes: Key Sub-Questions**  
  *(Settling any crux would force one side to concede ground)*  
  - **Crux 1: Can correctness conditions explain RKRs without circularity?**  
    - *Camp A Prediction*: Yes. Correctness (e.g., truth for belief) is prior and explains why evidence is RKR, while money is WKR.  
    - *Camp B Prediction*: No. "Truth" just means "what RKRs point to," making the definition circular.  
    - **Test Case**: *The Belief Bonus*. If the firm pays for belief, does money *become* part of belief’s correctness condition?  

  - **Crux 2: Do incentives create new correctness conditions?**  
    - *Camp A Prediction*: No. Rent forgiveness doesn’t make the novel admirable; it incentivizes self-deception.  
    - *Camp B Prediction*: Sometimes. If an incentive redefines the practice (e.g., "therapeutic gratitude"), it can generate new correctness conditions.  
    - **Test Case**: *Forced Gratitude*. If gratitude aids healing, does "healing-effectiveness" become part of gratitude’s correctness?  

  - **Crux 3: Is Camp B’s "meta-attitude" move sufficient?**  
    - *Camp A Prediction*: No. Meta-attitudes don’t explain why we resist calling bribes "reasons to believe/admire."  
    - *Camp B Prediction*: Yes. All normative work is done by distinguishing reasons *for* attitudes vs. reasons to *cultivate* them.  
    - **Test Case**: *Landlord’s Novel*. Is "I admire it to get rent forgiven" incoherent? Or just a reason to cultivate admiration?  

  ---

  #### **4. Analysis of Novel Cases**  
  *(Both camps’ predictions using their frameworks)*  
  - **Case 1: Landlord’s Novel (Admiration)**  
    - **Camp A**: WKR. Rent forgiveness bears on *inducing admiration*, not the novel’s admirability.  
      *Why?* Admiration’s correctness depends on objective merits, not incentives.  
    - **Camp B**: RKR for *wanting to admire* the novel. No "WKR for admiration" exists—only reasons to *cause* it.  
      *Why?* "Reason to admire" requires admirability; this is a reason to desire/feign admiration.  

  - **Case 2: Belief Bonus (Belief)**  
    - **Camp A**: WKR. Money incentivizes belief-formation but doesn’t bear on truth.  
      *Why?* Belief’s correctness is truth; bonuses exploit psychology, not evidence.  
    - **Camp B**: RKR for *trying to believe* or *rewarding belief*. No "WKR for belief"—if you believe *because* of money, you’re irrational.  
      *Why?* Belief must be truth-responsive; money is a reason to self-manipulate.  

  - **Case 3: Forced Gratitude (Gratitude)**  
    - **Camp A**: WKR. Therapy benefits bear on *inducing gratitude*, not the parent’s deservingness.  
      *Why?* Gratitude’s correctness depends on actual benevolence, not therapeutic utility.  
    - **Camp B**: RKR for *cultivating gratitude* as a coping mechanism. "Gratitude" here may be redefined (e.g., "therapeutic acceptance").  
      *Why?* If gratitude is instrumentally valuable, its "correctness" may include healing-efficacy.  

  ---

  #### **5. Testing the "Answered by Correctness" Proposal**  
  *(Your half-baked idea: A reason is RKR iff it answers the question, "Is the attitude correct?")*  
  - **Both Camps Agree**:  
    - Sharpens the *question* but doesn’t resolve the circularity charge (Crux 1).  
    - Explains intuitions in Cases 1-2: Rent money doesn’t make the novel admirable; bonuses don’t make the mission true.  
  - **Camp A Adds**: This *is* their view. It avoids "fancier words" by directly tying RKRs to correctness conditions.  
  - **Camp B Objects**: Still circular. "Correctness" is defined by what answers the question, which is defined by RKRs.  
  - **Case 3 Trouble**: If "healing" answers "Is gratitude correct?" for the patient, it becomes RKR. Camp A rejects this; Camp B says it shows context-sensitivity.  

  ---

  #### **6. Verbal Disagreement?**  
  - **Verbal Core**: Both agree "reasons for an attitude" must bear on its *standard*, but **Camp B** restricts this to *constitutive* standards (e.g., truth for belief), while **Camp A** allows *functional* standards (e.g., healing for gratitude in Case 3).  
  - **What Remains**: Whether attitudes have *fixed constitutive standards_ (Camp A) or _contextual/pragmatic standards_ (Camp B). This ties to Crux 2.  

  ---  
  **Next Steps**: Signatories commit to revising their positions if Crux experiments contradict predictions (e.g., if Case 2’s bonus *can* make belief correct). References to be added by reading group.  

  ---  
  **Key for Drafting**:  
  - Force specificity with numbered agreements.  
  - Use "predictions" to lock in falsifiable claims.  
  - Your "answered by correctness" idea is a litmus test—exposes if the dispute is terminological (it’s not).  
  - Cases 1-2 favor Camp A; Case 3 is Camp B’s best shot due to therapeutic context.  
  - Vacuous agreements flagged (§1.6) to prevent false consensus.
