  Here, we'll examine the **Great Famine of 1315–1317 in Northern Europe** through this dual lens. This episode featured catastrophic rainfall, crop failure, mass starvation, and social unrest, occurring against a backdrop of fragile feudal economies, population pressure, and weak governance.

  ---

  ### **1. The Story Told Twice**  
  **Facts held fixed**: Extreme rainfall (1314–1317); failed grain harvests; soaring food prices; widespread starvation (~10–25% mortality); peasant revolts; abandonment of farmland; cannibalism reports; weakened feudal authority.

  #### **Telling 1: Non-Human Event Carries Causal Weight**  
  *"The Great Famine was caused by an unprecedented climate catastrophe. Three years of relentless, torrential rains (1314–1317) drowned crops across Northern Europe, turning fields into swamps and rotting grain on the stalk. This directly triggered starvation, as food stores vanished and prices quintupled. Millions died or fled, abandoning farms. Desperation led to revolts against lords who could not provide relief, and feudal systems buckled under the strain. Without this aberrant weather, the famine would not have occurred."*  

  #### **Telling 2: Social Arrangements Carry Causal Weight**  
  *"The famine was caused by the brittle feudal economy. Population growth had pushed marginal lands into cultivation, reducing resilience. Grain was hoarded by lords for profit, while peasants lacked storage for surplus. When rains came, the absence of diversified crops, trade networks, or emergency reserves turned a harvest failure into catastrophe. Starvation was exacerbated by landlords raising rents and kings demanding war taxes, sparking revolts. Identical weather in a more adaptive system (e.g., with crop rotation or grain banks) might have caused hardship but not mass death."*  

  **Asymmetry**: Telling 2 requires adding the fact of **pre-existing population pressure on marginal lands** to explain why the rains were catastrophic, while Telling 1 treats this as incidental. Telling 1 does not need this fact—it assumes the weather alone was sufficient.

  ---

  ### **2. Counterfactual Baselines & Causal Roles**  
  | **Role**                | **Telling 1 (Environmental)**                  | **Telling 2 (Social)**                        |  
  |--------------------------|----------------------------------------------|---------------------------------------------|  
  | **Baseline**             | Normal weather patterns                      | Functional feudal economy with reserves     |  
  | **Trigger**              | Abnormal rainfall (1314–1317)                | Rainfall exposing systemic fragility        |  
  | **Background Condition** | Inherent climate variability                 | Population pressure/feudal exploitation     |  
  | **Constituent of Outcome**| Weather as *the* catalyst of collapse        | Social rigidity as *the* reason for collapse|  

  **Key Shift**: The *same rainfall* is a **trigger** in Telling 1 but a **revelatory test** in Telling 2. Telling 1 sees weather as the abnormal departure; Telling 2 sees feudal economics as the latent failure waiting for a stressor.

  ---

  ### **3. Nature of the Disagreement**  
  - **Conceptual** (not empirical or normative): The dispute centers on *what counts as "the cause."*  
  - **What must be settled**: Agreement on the **threshold for causal primacy**. Is it the *most abnormal factor* (rain) or the *most controllable vulnerability* (feudal structures)?  
  - **Evidence alone?** No. Evidence confirms *both* factors were necessary, but cannot dictate which is "primary." Resolving this requires defining causal frameworks (e.g., "but-for" necessity vs. blameworthiness).  

  ---

  ### **4. Gravitational Pull of Causal Language**  
  Causal narratives favor the **abnormal** (freak rainfall), the **controllable** (lordly greed), or the **blameworthy** (government inaction). Here:  
  - Telling 1 **exculpates** human actors: "No one could withstand such weather."  
  - Telling 2 **accuses** them: "The system *chose* not to prepare."  
  This reveals the dispute is often about **moral responsibility** masked as explanation. The "cause" is selected based on implicit judgments of avoidability.  

  ---

  ### **5. Personifying Non-Human Factors & Verdict**  
  **Describing nature as an "actor"** (e.g., "The rains *assaulted* Europe"):  
  - **Adds**: Dramatic agency, making the event feel inevitable and transcendent.  
  - **Smuggles in**: Determinism (nature as unstoppable force) and absolution of human accountability.  

  **Verdict**:  
  - **Pluralism is evasion here**. Saying "both mattered" ignores the *qualitative difference* in their roles: the rain was a **trigger**, while feudal structures were the **vulnerability**.  
  - **Superior telling**: **Telling 2**. Weather explains *timing* and *severity*, but social arrangements explain *why it was a catastrophe at all*. A resilient system (e.g., the Inca with quinoa diversity or China's granaries) might have weathered identical rains. The non-human event is necessary but insufficient without the human context.  

  **Resolution**: The stalemate breaks by distinguishing **catalytic causes** (rain) from **structural causes** (feudalism). Only the latter explains the *form* and *extent* of the outcome. The conceptual trap is conflating "cause" with "most dramatic factor."
