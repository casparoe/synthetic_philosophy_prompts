  ### Simulated Assembly Design: Unpacking "The Will of the People"

  **Objective:** Students experience a disconnect between "mandate of the winning platform" and "majority preferences on individual issues," revealing ambiguities in defining "the will of the people."

  **Participants:** 18 students  
  **Session Time:** 90 minutes  
  **Core Mechanism:**  
  - **Phase 1: Platform Election** — Students elect one of three policy bundles.  
  - **Phase 2: Issue-by-Issue Voting** — Students vote on the same policies separately.  
  - **Outcome Engineering:**  
    - The winning platform is opposed by a majority of students on every policy it contains.  
    - A majority of students lose on a majority of individual issues.  

  **Preference Sheets & Assignment**  
  *Issues: 3 policy decisions (e.g., "Healthcare Reform," "Tax Policy," "Climate Regulation"). Each has Position 0 (status quo) or 1 (reform).*  

  - **Group 1 (6 students):**  
    - Healthcare: **0**  
    - Tax Policy: **0**  
    - Climate: **1**  
    - *Most Important Issue:* **Climate**  

  - **Group 2 (6 students):**  
    - Healthcare: **0**  
    - Tax Policy: **1**  
    - Climate: **0**  
    - *Most Important Issue:* **Tax Policy**  

  - **Group 3 (6 students):**  
    - Healthcare: **1**  
    - Tax Policy: **0**  
    - Climate: **0**  
    - *Most Important Issue:* **Healthcare**  

  **Platforms (Bundles):**  
  - **Platform A:** (Healthcare **0**, Tax **0**, Climate **0**)  
  - **Platform B:** (Healthcare **0**, Tax **1**, Climate **1**)  
  - **Platform C:** (Healthcare **1**, Tax **1**, Climate **1**)  

  **Voting Rules:**  
  - **Platform Election:** Plurality vote. Students vote for the platform that aligns with their *most important issue*.  
  - **Issue-by-Issue:** Majority vote on each policy separately.  

  ---

  ### **Minute-by-Minute Timeline**  
  **Total: 90 minutes**  

  #### **Phase 1: Platform Election (25 min)**  
  - **0–5 min:** Divide students into 3 groups of 6. Distribute preference sheets. *Do not explain the disconnect.* Simply say: "You’ll vote on policy bundles today. Your sheet shows your priorities."  
  - **5–10 min:** Explain platform options:  
    - Platform A: Status quo on all issues.  
    - Platform B: Reform tax and climate; status quo healthcare.  
    - Platform C: Reform all three issues.  
  - **10–15 min:** Instruct: "Vote for the platform that matches your *most important issue*."  
    - *Group 1* votes for **Platform C** (matches Climate **1**).  
    - *Group 2* votes for **Platform B** (matches Tax **1**).  
    - *Group 3* votes for **Platform C** (matches Healthcare **1**).  
  - **15–20 min:** Tally votes. **Result:**  
    - Platform C: 12 votes (Groups 1 + 3).  
    - Platform B: 6 votes (Group 2).  
    - Platform A: 0 votes.  
  - **20–25 min:** Announce: **"Platform C wins! It will govern with majority support."**  

  #### **Phase 2: Issue-by-Issue Voting (20 min)**  
  - **25–30 min:** Reset: "Now, we’ll vote on each policy individually."  
  - **30–40 min:** Vote sequentially (Healthcare → Tax → Climate):  
    - **Healthcare:**  
      - Group 1+2 (12 votes) support **0**.  
      - Group 3 (6 votes) supports **1**.  
      *Result: 0 wins (12–6).*  
    - **Tax Policy:**  
      - Group 1+3 (12 votes) support **0**.  
      - Group 2 (6 votes) supports **1**.  
      *Result: 0 wins (12–6).*  
    - **Climate:**  
      - Group 2+3 (12 votes) support **0**.  
      - Group 1 (6 votes) supports **1**.  
      *Result: 0 wins (12–6).*  
  - **40–45 min:** Display results:  
    - Platform C (elected) supports: **Healthcare 1, Tax 1, Climate 1**.  
    - Issue outcomes: **Healthcare 0, Tax 0, Climate 0**.  

  #### **Reveal the Disconnect (10 min)**  
  - **45–50 min:** Ask:  
    - *"Platform C won. But did any of its policies win the issue vote?"* (No, all lost.)  
    - *"Is there a majority for Platform C’s healthcare policy?"* (No: 12 oppose **1**.)  
    - *"What about tax? Climate?"* (Same.)  
  - **50–55 min:** Highlight:  
    - *Every policy in Platform C was rejected by 67% of voters (12–6).*  
    - *100% of students (all 18) are on the losing side for at least 2 of 3 issues.*  

  #### **Phase 3: Agenda Manipulation Round (15 min)**  
  - **55–60 min:** Reset. Assign one Group 3 student as "agenda setter." *Quietly instruct them:* "You control the order of issue votes. Pick any sequence to sway outcomes."  
  - **60–65 min:** Agenda setter chooses vote order (e.g., Climate → Tax → Healthcare). Re-vote issues one by one.  
  - **65–70 min:** Tally votes. **Result:** Identical to Phase 2 (0 wins all). *Order doesn’t change outcomes—majority is too stable.*  

  #### **Debrief (30 min)**  
  - **70–75 min:** Map outcomes to "will of the people" ambiguities:  
    | **Claim**                       | **Reality in Simulation**                                  |  
    |---------------------------------|-----------------------------------------------------------|  
    | "Winning platform = mandate"    | Platform C won, but all policies rejected by majority.    |  
    | "Majority per issue = true will"| 67% opposed every policy in Platform C.                   |  
    | "Fair procedure = legitimacy"   | Both elections were fair, but produced clashing outcomes. |  
  - **75–85 min:** Discuss:  
    - Why might a platform win while all its policies lose? (*Bundling forces single-issue compromises.*)  
    - Is "the will" the platform, the issues, or the process? (*All conflict here.*)  
    - Can we call *either* outcome "the people’s will"? (*It’s fragmented.*)  
  - **85–90 min:** Frame bigger questions:  
    - *"We engineered this result—it’s rare in small groups but escalates in mass elections with polarized issues."*  
    - *"This doesn’t prove ‘no collective will exists,’ but shows how institutions shape what we perceive it to be."*  

  ---

  ### **Predictable Challenges & Solutions**  
  1. **Students ignore "most important issue" rule in platform vote.**  
     - *Solution:* Emphasize: "Vote *only* based on your top issue. Ignore other policies."  
  2. **Agenda setter fails to change outcomes in Phase 3.**  
     - *Solution:* Acknowledge: "This shows agenda power has limits when majorities are clear—but in close votes, order *can* flip results."  
  3. **Students distrust engineered preferences.**  
     - *Solution:* Reassure: "Real voters often prioritize single issues (e.g., abortion, taxes). This distills that dynamic."  
  4. **Debrief devolves into "just a math trick."**  
     - *Solution:* Stress: "The math is simple; the *implications* aren’t. How do we define mandates when outcomes clash?"  

  ---

  ### **What the Activity Cannot Reproduce**  
  - **Rarity:** This extreme disconnect requires precise preference splits. In real electorates (millions of voters), such clean anti-majoritarian outcomes are rare but *possible* with polarization (e.g., bundled referendums vs. party platforms).  
  - **Deeper Philosophy:** The simulation *assumes* a "will" exists and highlights measurement problems. It cannot address whether a coherent collective will *exists at all*—that requires instructor-led discussion on social choice theory’s existential critiques (e.g., Arrow’s Theorem).  

  **Final Note:** Avoid naming "Ostrogorski’s Paradox" until after the debrief. Let students *feel* the contradiction before labeling it. The power is in the lived tension between the platform’s "mandate" and the issue-level "mandates."
