prompt: |-
  I write about language, speech, and ideas for a general-interest magazine, and I've been asked to draft our newsroom's standing procedure for handling slurs — in headlines, in quoted speech, in reader comments we excerpt, and in transcripts we publish. Writers and copy editors make this call several times a week, usually in minutes, and the current guidance ("use your judgment") has produced both needless offense and pointless euphemism. Acting as a philosopher of language who has also worked a copy desk, write me a decision procedure a writer with no linguistics training can actually run in order: the questions to ask in sequence, what counts as a sufficient answer at each step, where the procedure returns a hard no, and where it hands the call to a human because the question is evaluative rather than linguistic. Ground it in what the semantics and pragmatics literature genuinely establishes about derogation — that a slur's force may be part of what it conventionally encodes, or may ride instead on what the speaker insinuates, presupposes, or echoes, or may depend on who is speaking to whom and in what register — and be explicit about which of these distinctions must survive the simplification and which can be dropped. Before you commit to the procedure, brainstorm the candidate distinctions so I can see what you considered and rejected.

  Then run the procedure on three cases: a senator caught on tape using a racial slur, which we feel we must quote; a member of the targeted group using the same word in an interview about reclaiming it; and a novelist's use of the word in a book we're reviewing. For each, say what the procedure yields, and flag any case where it gives the desk an answer we won't like. Include one short test a writer can apply to a single sentence — for instance, whether swapping in a neutral description preserves the sentence's force — and tell me what that test cannot detect. Finally, mark clearly where the procedure must stop and defer to a person, and what qualifications that person needs. No reading lists or citations, please; I need something the desk can use today.
reasoning: |-
  Okay, the user is asking for a decision procedure to handle slurs in various contexts for a general-interest magazine. They need a step-by-step guide that writers and copy editors can follow quickly, without linguistics training. The current approach of "use your judgment" isn't working, leading to both offense and unnecessary euphemism.

  First, I need to ground this in semantics and pragmatics. The key distinctions from the literature include what a slur conventionally encodes versus what it insinuates, presupposes, or echoes. Also important is who is speaking, who the audience is, and the register (formal vs. casual). But I'll need to simplify some of these for practicality.

  The user mentioned several scenarios: headlines, quoted speech, reader comments, and transcripts. Each context might require different handling. The procedure should be a flowchart-like sequence of questions that leads to clear decisions or flags when human judgment is needed.

  Brainstorming candidate distinctions:
  - **Conventional encoding vs. contextual use**: Some slurs carry derogation inherently, while others depend on context. But explaining this might be too complex. Maybe simplify to whether the word is widely recognized as a slur.
  - **Speaker's intent vs. audience perception**: Intent is hard to prove, so maybe focus on the speaker's identity relative to the target group and the context of use.
  - **Reclaimed vs. non-reclaimed slurs**: Reclamation is context-specific. The procedure should check if the speaker is part of the target group and if the context supports reclamation.
  - **Direct vs. reported speech**: Quoting someone might necessitate different handling. The key is whether the quote is essential and if the offense outweighs the journalistic need.
  - **Register and medium**: Formal vs. informal contexts. But this might be too nuanced. Instead, consider publication context (e.g., news vs. literary review).

  Which distinctions to keep? The speaker's identity (in-group vs. out-group) and context (reclamation, essential quote) are crucial. The conventional encoding can be simplified to whether the word is unambiguously a slur. Pragmatic elements like presupposition might be too complex, so focus on the speaker's role and intent as evidenced by context.

  The procedure should have steps that lead to a hard no (e.g., out-group speaker in non-academic context) or defer to a human when evaluative judgment is needed (e.g., assessing reclamation context or journalistic necessity).

  Now, the test: Swapping with a neutral term. If replacing the slur with a neutral term changes the meaning or force significantly, it might be essential to keep. But this test can't detect reclaimed uses or subtle contextual nuances.

  For the cases:
  1. **Senator using a slur on tape**: The procedure should flag to quote only if essential, with asterisks, and context. The desk might not like the asterisk solution but it's a compromise.
  2. **Targeted group member reclaiming the word**: Here, the speaker is in-group, so the word might be printed. But human judgment is needed to confirm reclamation context.
  3. **Novelist in a book review**: The procedure should allow the word with context about artistic intent. Human judgment verifies the literary necessity.

  Deferral points: Step 5 (reclamation context) and Step 7 (essential quote) need human input. The person should have cultural competence or editorial experience.

  Need to ensure the procedure is actionable, avoids jargon, and is efficient. Steps should be binary where possible, leading to quick decisions but with clear off-ramps for human judgment.
answer: |-
  ### Standing Procedure for Handling Slurs in Editorial Content  
  **Philosophical Grounding**: Slurs derive harm from both semantic encoding (conventional derogation baked into the word) and pragmatic context (who speaks/hears it, intent, historical weight). The literature confirms that:  
  - **Conventional encoding** makes some slurs intrinsically harmful regardless of context (e.g., racial/ethnic slurs).  
  - **Pragmatic factors** can override or reshape meaning: reclamation (in-group use), reporting necessity (e.g., investigative journalism), or artistic intent.  
  - **Critical distinctions to retain**: Speaker’s relationship to the targeted group (in-group vs. out-group), register (formal journalism ≠ casual speech), and whether the slur is quoted or asserted by the publication.  
  - **Simplified/dropped**: Presupposition/insinuation (too context-dependent for rapid assessment); "echoing" harm (folded into speaker intent assessment).  

  **Decision Procedure**  
  *Run these questions in sequence. Answer YES/NO. Stop when a directive is given.*  

  1. **Is the term widely recognized as a slur by credible authorities (e.g., major dictionaries, civil rights groups)?**  
     - *YES* → Proceed to 2.  
     - *NO* → Print the term (e.g., niche/ambiguous terms like "Karen" may lack consensus).  

  2. **Is the speaker a member of the group targeted by the slur?**  
     - *YES* → Proceed to 5 (reclamation possible).  
     - *NO* → Proceed to 3.  

  3. **Is the slur being used in our publication’s own voice (headline, caption, analysis)?**  
     - *YES* → **HARD NO: Do not print**. Substitute with a neutral term or descriptor (e.g., "[racial slur]").  
     - *NO* → Proceed to 4 (quoted/attributed speech).  

  4. **Is the quote essential to a story of significant public interest?**  
     - *YES* → Proceed to 7 (defer to human).  
     - *NO* → **HARD NO: Redact or paraphrase** (e.g., "Senator X used a racial slur").  

  5. **Is the speaker clearly using the term in a reclaimed/empowering context?**  
     - *YES* → Proceed to 6.  
     - *NO* → **HARD NO: Do not print** (in-group use ≠ automatic approval).  

  6. **Does omitting the word gut the speaker’s intended message?**  
     - *YES* → **Print with contextual framing** (e.g., "used the reclaimed term [slur]").  
     - *NO* → **Redact or paraphrase** (e.g., "used a reclaimed slur").  

  7. **DEFERRAL POINT: Human judgment required**.  
     - *Qualifications*: Senior editor + sensitivity reader or cultural consultant from the affected group.  
     - *Evaluate*: Public interest value vs. harm risk. If approved, **print with redaction** (e.g., "n\*\*\*r") and contextual framing (e.g., "in this recording, Senator X says...").

  ---

  ### Rapid Test: The Neutral Swap  
  **What to do**: Replace the slur with a neutral descriptor (e.g., "member of [group]").  
  **What it detects**: If the sentence’s core meaning/logic survives (e.g., "He called him a [slur]" → "He called him a Black man" preserves factual intent).  
  **What it misses**:  
  - Reclaimed or ironic uses (e.g., "We’re turning [slur] into power" loses reclamation force).  
  - Artistic/historical authenticity (e.g., a novel’s dialogue).  
  - Speaker’s intent to harm or provoke.  

  ---

  ### Case Applications  
  1. **Senator recorded using a racial slur**  
     - Steps: 1 (YES) → 2 (NO) → 3 (NO) → 4 (YES: public interest) → **DEFER TO HUMAN** (Step 7).  
     - *Procedure yields*: Senior editor + consultant approve printing with redaction ("n\*\*\*r") and context.  
     - *Desk might dislike*: Redaction feels like euphemism, but procedure blocks full print.  

  2. **Targeted group member reclaiming the slur in interview**  
     - Steps: 1 (YES) → 2 (YES) → 5 (YES: reclamation context) → 6 (YES: omission guts message) → **Print with framing**.  
     - *Procedure yields*: "Activist Maya Harris described reclaiming the term '[slur]'."  

  3. **Novelist’s use in a book review**  
     - Steps: 1 (YES) → 2 (NO) → 3 (NO: quoted speech) → 4 (YES: artistic analysis) → **DEFER TO HUMAN** (Step 7).  
     - *Procedure yields*: Human judgment approves full print + context (e.g., "The protagonist’s use of '[slur]' exposes systemic bias").  

  ---

  ### Key Notes for the Desk  
  - **HARD NOs**: Out-group slurs in publication’s voice (Step 3); non-essential quotes (Step 4); in-group use without clear reclamation (Step 5).  
  - **DEFER TO HUMAN**: Public interest (Step 4) and artistic/reclamation ambiguity (Step 5). Deferrals require cultural competence—no solo calls.  
  - **Why this works**: Cuts "judgment" to 4 key forks. Uses only observable facts (speaker identity, source intent) until final deferral.  
  - **Triage tip**: If stuck at Step 7, default to redaction + framing. Harm mitigation > "authenticity."  

  This fits a 2-minute decision cycle. Test-drive it for a week and iterate.
