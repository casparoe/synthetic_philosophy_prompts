  1. **Prioritization**: They want to know which resolution requirements are absolute vs. debatable, and if any conflict. This hints they've seen conflicting solutions and want a decision rubric.  
  2. **Leverage**: Asking which requirement "does the most work" suggests they're thinking like an engineer – what's the strongest constraint to test solutions against?  
