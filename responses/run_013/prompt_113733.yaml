prompt: |-
  Ok so I'm a backend engineer, no philosophy training at all, and I've fallen down a rabbit hole on this two-envelope thing and I'd like to stop reading half-baked takes and just get the actual spec first. Setup as I understand it: someone puts money in two envelopes, one has exactly twice what the other has, I pick one at random and don't open it. Symmetry says it's a coin flip, no reason to prefer either. Then someone says: let x be what's in your envelope, the other is either 2x or x/2 and each is equally likely, so its expected value is 1.25x, so you should always switch. Which obviously can't be right, because the same argument applies to whichever envelope I'm holding, and if I switch and then get offered another switch I'd just switch forever. I get that somethings rotten, I just don't have a clean picture of what.

  Before I read any more proposed resolutions, I want the requirements list -- I think philosophers call these desiderata? What does any acceptable resolution of this have to actually deliver? Things like: which exact move in the argument has to be fingered as the broken one and what's supposed to be wrong with it; what it has to say about the version where I do open the envelope and see $10; bounded amounts vs unbounded; infinite expected value; what has to stay invariant if both amounts get doubled or both get a constant added; whether it has to say anything about the process that filled the envelopes. But you give me the real list, with the case or consideration motivating each item, not just my guesses.

  Three things I especially want:

  1) mark which requirements are non-negotiable and which are just taste, and if any two of them can't be satisfied at once, say so -- thats the part I care about most.

  2) tell me which single requirement does the most work, i.e. knocks out the most candidate resolutions.

  3) I can't tell if the fix is about the probability argument or about the setup, so: same puzzle, except a friend fills the envelopes, he watches me pick, and he's kind of a troll who chose the amounts knowing I'd be sitting here doing this. Does a decent resolution have to treat that case differently, and should that show up as its own requirement on the list, or is that a distraction?

  And if you think the whole thing is a non-problem and the requirements list should basically say the question is ill-posed, then give me that list instead, and be honest about what it costs to buy it.
