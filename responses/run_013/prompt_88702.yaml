prompt: |-
  I'm a reporter — I cover AI and tech policy, and I've got a peice going out tomorow about who actually gets to decide what a superintelligence wants. I interviewed a guy for it who's been in AI policy for like a decade, seems sharp, no crank. He gave me this gloss on coherent extrapolated volition and it's probably going to be in the piece, so I want to make sure I'm not printing something a grad student in this stuff would laugh at.

  Here's what he said, roughly: CEV is the idea that you don't hand the AI a list of rules, you let it work out what humanity would want if we were smarter, better informed, and had a lot longer to think about it, and then it maximizes that. The "coherent" bit means that when different people's extrapolated preferences bang into each other, the AI averages them into one consistent set of values — so really it's preference utilitarianism, except with idealized preferences instead of the messy ones people actually have. Which means in practice the AI would do what we'd recognize as the right thing, just way more competently; it's our own values with the noise stripped out. Yudkowsky came up with it back in the friendly-AI days, and Bostrom has a whole section on it in Superintelligence. He also reckons the standard objection is that people's values might not converge at all, and that this basically sinks the whole thing.

  I don't know this literature well enough to push back on him. My instinct is that if the preference-utilitarianism part is right, that's actually my lede, so I'd sort of like it to be right. Can you go through his summary claim by claim and tell me what someone who actually works on this would nod along to, what they'd wince at, and what's just wrong? Where it's wrong I want the real claim and what turns on the difference — not just "that's not what the proposal says." Where it's a simplification that a fair-minded person would let slide, say so, don't grade everything as an error. Then tell me whether his bottom line follows from the parts that are accurate, and if it doesn't, what would have to be true for it to. And give me two or three sentences I could actually print that get the idea right, without me having to cite anything.
reasoning: |-
  Okay, let me start by understanding what the reporter needs. They're working on a piece about who decides what a superintelligence wants, and they interviewed an AI policy expert. The expert explained Coherent Extrapolated Volition (CEV) and the reporter wants to ensure this explanation is accurate before publishing. The main concern is whether the expert's summary would be laughed at by grad students in the field.

  First, I need to recall what CEV is. It's a concept from Eliezer Yudkowsky, aimed at aligning AI with human values by extrapolating what we'd want if we were more rational and informed. The expert described it as preference utilitarianism using idealized preferences. The reporter highlighted several points: CEV avoids fixed rules, involves extrapolated preferences, coherence resolves conflicts through averaging, and the standard objection is non-convergence of values.

  Breaking down the claims:
  1. **Not handing a list of rules**: Correct. CEV is about dynamic value extrapolation, not static rules. This is fundamental to its design.
  2. **Working out what humanity would want if smarter, etc.**: Accurate. The core idea is idealized reflection under better conditions.
  3. **"Coherent" means averaging conflicting preferences**: Here's a problem. CEV doesn't average; it seeks coherence without compromising individual volitions. Averaging implies loss of nuance, which isn't the intent. The expert's phrasing might misrepresent the mechanism.
  4. **Preference utilitarianism with idealized preferences**: Partially right. CEV uses preference aggregation, but calling it utilitarianism might oversimplify. Utilitarianism typically aggregates current preferences, while CEV focuses on extrapolated ones. This distinction matters for ethical implications.
  5. **AI does the "right thing" competently**: Overly optimistic. CEV aims for that, but there's debate on whether idealized preferences align with moral rightness. This is a philosophical leap.
  6. **Yudkowsky and Bostrom references**: Correct. Proper attribution.
  7. **Standard objection is non-convergence**: True, but incomplete. Other issues include metaphysical autonomy and the grounding problem.

  The expert's bottom line that non-convergence sinks CEV is valid, but there are more layers. The reporter's lede about preference utilitarianism needs caution—it's a simplification that might pass if noted as such, but purists could dispute it.

  For the quotable summary, I need to capture CEV's essence without technical jargon. Emphasize dynamic extrapolation, coherence without averaging, and the convergence challenge. Avoid mentioning utilitarianism to prevent misinterpretation. Highlight the uncertainty in implementation to maintain accuracy.
answer: |-
  Here's a breakdown of your source's claims, annotated for accuracy and nuance, followed by a concise, quotable explanation. The core idea is *mostly* recognizable to someone familiar with CEV, but there are important simplifications and one substantive misstep. His bottom line about the convergence objection is fair, but it's not the only major concern.

  ### Claim-by-Claim Assessment:
  1.  **"You don't hand the AI a list of rules, you let it work out what humanity would want if we were smarter, better informed, and had a lot longer to think about it, and then it maximizes that."**
      *   **Verdict: ✅ Accurate & Core Idea.** This is the essence of CEV. It's about *extrapolating* idealized human preferences under conditions of enhanced rationality and knowledge, rather than programming explicit rules (which is seen as doomed to failure or misuse). Grad students nod.

  2.  **"The 'coherent' bit means that when different people's extrapolated preferences bang into each other, the AI averages them into one consistent set of values."**
      *   **Verdict: ⚠️ Oversimplified/Misleading.** The goal is coherence, but "averages them" is the problematic part. CEV aims for a *consistent* set of values that respects the *extrapolated* will of individuals/groups without inherent contradictions. The process isn't mathematical averaging (which implies loss of nuance or compromise). It's more like finding a unified framework or decision procedure that resolves conflicts *in a way the idealized individuals themselves would endorse* upon reflection. Think "synthesizing" or "harmonizing" more than "averaging." A fair-minded person might let "resolve conflicts" slide, but "averages" would make some wince – it risks implying a bland utilitarianism CEV tries to avoid.

  3.  **"So really it's preference utilitarianism, except with idealized preferences instead of the messy ones people actually have."**
      *   **Verdict: ⚠️ Simplification (Use with Caution).** It's *similar* to preference utilitarianism in valuing preferences, and the "idealized" part is key to CEV. However, CEV is more specific: it's about the *extrapolated volition* of *particular* individuals/humanity, not necessarily aggregating *any* idealized preferences into a sum. The focus is on "what *we* would want," not an abstract "good." Calling it preference utilitarianism is a functional analogy a reporter could use for clarity, but purists would note it misses nuances about personal identity and the source of value within CEV. It's a simplification you might get away with, but not the strict definition.

  4.  **"Which means in practice the AI would do what we'd recognize as the right thing, just way more competently; it's our own values with the noise stripped out."**
      *   **Verdict: ❌ Overly Optimistic / Not Guaranteed.** This is the *hope* behind CEV, but it's a highly contentious claim, not a logical consequence. Critics argue:
          *   The extrapolation process might produce values alien to current humans ("What if smarter us wants paperclips?").
          *   "Noise stripped out" might strip out essential, valued aspects of humanity (emotion, irrational attachments).
          *   "We'd recognize as the right thing" assumes moral realism and convergence that might not exist. This is a *goal*, not an assured outcome. Grad students might groan at the certainty implied here.

  5.  **"Yudkowsky came up with it back in the friendly-AI days, and Bostrom has a whole section on it in Superintelligence."**
      *   **Verdict: ✅ Accurate.** Standard attribution and context. Nod.

  6.  **"He also reckons the standard objection is that people's values might not converge at all, and that this basically sinks the whole thing."**
      *   **Verdict: ✅ Accurate Summary of a Major Objection.** The "convergence problem" is indeed the most famous critique (e.g., what if my extrapolated self wants hedonism and yours wants asceticism, and no synthesis is possible?). Many (including Yudkowsky himself) agree this is a potential showstopper if true. However, it's not the *only* major objection (e.g., the "metaphysical will" problem - does an extrapolated "you" even exist? The "grounding" problem - how does the AI *start* the extrapolation safely?).

  ### Does his bottom line follow?
  *   **Partially.** His claim that the convergence objection "basically sinks the whole thing" **follows logically** *if* you accept that convergence is necessary for CEV to work *and* that convergence is unlikely/impossible. This is a widely held view among critics. Proponents argue convergence is plausible under idealized reasoning, but it's far from proven. His summary of *this specific objection* and its potential consequence is sound.

  ### What would have to be true for his "right thing" claim to hold?
  For the AI reliably doing "what we'd recognize as the right thing" to follow from CEV, several strong assumptions would need to be true:
  1.  **Convergence:** Human values *must* significantly converge under ideal reflection (no fundamental, irreconcilable conflicts).
  2.  **Continuity:** The extrapolation process *must* preserve the core essence of human morality and value, just clarified and refined. It shouldn't generate radically alien goals.
  3.  **Correct Implementation:** The AI *must* perfectly model human minds and the extrapolation process without introducing dangerous errors or biases during the process itself.

  ### Quotable Explanation (2-3 sentences, accurate, no citation needed):
  "Coherent Extrapolated Volition (CEV) proposes that instead of giving a superintelligence fixed rules, we task it with discovering what humanity *would* want if we were vastly wiser, better informed, and thought far longer about our true goals. The AI would then strive to fulfill this coherent, idealized version of our collective will. A core challenge, however, is whether diverse human values would actually converge into a single, consistent vision under such ideal reflection, or if they'd remain fundamentally incompatible."
