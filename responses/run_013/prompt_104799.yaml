  Okay, this user is in a real philosophical bind with their friend over the Parity Principle and moral responsibility. They've been arguing for weeks and need help defending against what feels like a total collapse of desert-based ethics. 

  First, let's unpack why this matters so much. The user clearly cares deeply about preserving moral responsibility in a way that's humane - they're emotionally invested in not letting outcomes alone determine blame, which suggests they value fairness and intentionality. But their friend's argument threatens to vaporize that entire project. 

  The core tension here is between two intuitions: one that luck shouldn't determine moral worth (hence the appeal of step 1), and another that complete parity leads to absurdity (steps 3-4). The friend's move to epistemic luck in step 4 is particularly devastating because it weaponizes the principle against itself.

  Hmm... what's really clever about the friend's argument is how it uses the principle's own logic to devour itself. By applying the parity to belief formation, it suggests that even accepting the principle is arbitrary. That's why the user feels stuck - any defense seems vulnerable to the same luck argument.

  I think the user's smart to focus on step 4. The other steps have clearer counterarguments (e.g., step 2's claim that differences reduce to constitution/circumstance ignores how agency transforms those inputs). But step 4's epistemic extension needs special handling because it shifts domains.

  What's tricky is finding a restriction that doesn't feel ad hoc. The control condition idea might work - we only apply parity to things within agents' control, and belief formation often isn't. But the user will need to explain why control matters more for belief than action. Maybe emphasize that doxastic responsibility works differently? 

  The user's fear about "covertly assuming the conclusion" is valid. Any restriction must be grounded in something deeper than just preserving moral responsibility. The phenomenology of agency might help - the lived difference between choosing and being struck by thoughts feels fundamental.

  Also worth noting: the friend's "sober truth" claim is itself a truth-claim, which seems inconsistent with the radical skepticism step 4 implies. That contradiction could be leveraged - if no verdict is creditable, why trust theirs?
answer: |-
  Your friend's argument is powerful because it systematically dismantles desert-based responsibility by exposing the pervasive role of luck. To resist his conclusion without abandoning the core humane intuition behind the Parity Principle, **target Step 4 as the misstep.** Here’s why, how to restrict the principle, and what it costs:

  ### Why Step 4 Fails: A Category Mistake
  - **Assessment vs. Agency:** Step 4 conflates *moral responsibility* (what agents *deserve* for their exercises of agency) with *epistemic responsibility* (whether our *beliefs* about responsibility are justified). The Parity Principle governs desert for *actions* rooted in agency. Belief formation—especially about abstract principles—is not an *exercise of agency* in the same sense. We don’t "deserve blame/praise" for beliefs in the way we do for intentional actions; we assess beliefs for *accuracy*, not moral worth.
  - **Luck of Arguments ≠ Luck of Outcomes:** That an argument "occurs to you" is circumstantial luck affecting belief formation. But it doesn’t negate the *normative force* of the argument itself. The *truth* of the Parity Principle (if true) isn’t undermined by how you came to believe it. Your friend’s move commits a self-defeating performative contradiction: he uses rational argumentation to claim rational argumentation is luck-dependent and thus non-creditable. But if his conclusion were true, his own argument would have no claim to credibility—undercutting itself.

  ### How to Restrict the Parity Principle (Without Begging the Question)
  **The Restriction:**
  > *The Parity Principle applies only to **evaluations of actions/omissions** where the outcome difference is **causally independent of the agent’s exercise of agency**.*

  **How It Works:**
  1. **Preserves Step (1):** The drunk drivers form identical intentions (drive home drunk), deliberate identically (ignore risks), and expend identical effort. The *outcome* (killing a child vs. not) is causally independent of their agency—it hinges on a pedestrian’s location (sheer luck). Thus, they *are* equally blameworthy for the reckless choice.
  2. **Blocks Step (2) & (3):** 
     - **Differences Matter:** Agents *do* differ in exercises of agency—not just constitution/circumstance. Consider:
       - **Deliberation:** Two agents might face identical temptations, but one *chooses* to reflect on moral reasons while the other dismisses them. This difference *is* an exercise of agency.
       - **Effort:** Resisting temptation or scrutinizing a motive requires agential effort. Two people with identical urges aren’t identical if one exerts willpower and the other capitulates passively.
     - **Agency Transforms Inputs:** Constitution/circumstance (e.g., upbringing, temperament) are inputs to agency, but agents *exercise control* in how they respond. The jealous person who *chooses* to interrogate their jealousy vs. the one who *chooses* to act on it differ in agency—even if their initial jealousy stems from luck.
  3. **No Slide to Universal Parity:** Differences in exercises of agency (intentions formed, deliberations undertaken, efforts expended) are real and responsibility-grounding. The restricted principle only nullifies outcome luck, not differences in agential quality.

  ### Costs of This Restriction
  1. **Metaphysical Burden:** You must defend a robust view of agency where agents can genuinely *respond* to reasons in ways not wholly determined by luck-laden constitution/circumstance. This may require libertarianism or compatibilism with teeth (e.g., reasons-responsive mechanisms).
  2. **Phenomenological Cost:** In hard cases, distinguishing "agential exercise" from "constitution/circumstance" is murky (e.g., is failing to reconsider a bias due to laziness or temperament?). The principle becomes less crisp.
  3. **Humane Limitation:** You save moral responsibility from collapse, but desert remains vulnerable to *some* forms of luck (e.g., constitutive luck in moral capacities). The principle only mitigates *outcome* and *circumstantial* luck.

  ### Why This Isn’t Question-Begging
  The restriction doesn’t *assume* desert exists. It defines the *scope* of the Parity Principle by analyzing what counts as an "exercise of agency." This draws on:
  - **Moral Psychology:** Intentions, deliberations, and efforts are widely recognized as agential in folk and legal practices (e.g., *mens rea*).
  - **Phenomenology:** We experience deliberation and effort as acts *we perform*, not things that happen to us. Belief formation feels more passive ("it occurred to me").
  - **Non-Arbitrary Threshold:** The restriction aligns with why we care about responsibility: to appraise *what agents do*, not what befalls them.

  ### Final Response to Your Friend
  "Step 4 equivocates between the luck of outcomes in actions and the luck of insight in belief. The Parity Principle addresses *moral desert* for exercises of agency. Whether we *correctly discern* moral truth is an epistemic question governed by norms of reason, not desert. Your argument uses reason to deny reason—a performative contradiction. Yes, luck pervades existence, but agency involves our *active engagement* with the luck we’re dealt. That engagement—not the luck itself—is what we appraise. Your 'sober truth' dissolves the very rationality required to assert it."

  This saves the humane core of the Parity Principle while blocking the slide into nihilism. The cost is accepting that agency, while fragile and luck-influenced, is not reducible to luck.
