answer: |-
  "Right, your example showcases exactly why Jeffrey updating is essential: it respects the dynamic, state-dependent nature of evidence incorporation. When you update A first to 0.9, you're not just changing A—you're leveraging the rigidity of conditionals (like P(B|A)) to preserve the underlying structure between A and B. That shift naturally propagates to B, altering its probability before the second update hits. Reverse the order, and you're starting from a different interim belief state because the evidence about B reshapes A via their correlation. The order matters normatively because evidence isn't received in a vacuum; it's processed sequentially against your current credences. Rigidity isn't an arbitrary add-on—it enforces that you only update what the evidence directly bears on, preventing capricious changes to your conditional beliefs. Alternatives like conditioning on the 'most confident' cell ignore the uncertainty in the evidence, while staying put rejects learning altogether. Jeffrey forces you to track how each piece of evidence transforms your entire web of beliefs."

