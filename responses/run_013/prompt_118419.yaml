answer: |-
  ## Paper Ghosts

  These written deaths can make me really **cry**
  More than the names I **know** upon the **page**.
  Some stranger’s actual loss, I merely **hold**
  At distance; yet a fiction makes me **ache**
  Down to the bone. This ink feels bitterly **real**,
  Though reason shouts the story’s false. I **know**.

  But how to quiet what I deeply **know**?
  That fabricated storm compels a **cry**
  More raw than verified reports. What’s **real**
  Seems filtered, dulled, behind the printed **page**,
  While phantom sorrows fiercely twist and **ache**
  A truth my hollow reason cannot **hold**.

  (Stanza III: The Character's Voice)
  "You weep for me? What substance can you **hold**
  Except the words that told you what I **know**?
  I never drew breath to cause this **ache**,
  Never had lungs to shape a final **cry**.
  My world dissolves when shut inside the **page**.
  Your grief’s the only thing that feels **real**."

  Is *this* the shape of what we call the **real**?
  Not facts confirmed, but what the heart can **hold**?
  This printed lie ignites a deeper **ache**
  Than proven pain. What logic can I **know**
  That cools the fire summoned by a **cry**
  Born solely from the marks upon the **page**?

  The morning paper states the loss. The **page**
  Lies flat. The grief reported seems less **real**
  Than when imagination wrings a **cry**
  For shadows. Does the mind refuse to **hold**
  True sorrow close? Or does it only **know**
  How to transmute the distant to an **ache**?

  There is a bruise, a constant, quiet **ache**
  For figures conjured solely from the **page**,
  A tenderness that reason doesn’t **know**.
  Their spectral suffering feels fiercely **real**,
  A weight the soul is desperate to **hold**,
  Releasing in a solitary **cry**.

  (Envoy)
  The **cry** insists the fiction's **real**.
  The **ache** rejects what reason's taught to **know**.
  The **page** can **hold** what daylight cannot **hold**.

  ---

  ### Why this works for your request:
  1.  **Core Paradox Focus:** Centers entirely on the *asymmetry* ("written deaths make me really cry / More than the names I know upon the page"). Stanza II explicitly contrasts real vs. fictional grief.
  2.  **End-Word Structure:**
      *   **Reality/Belief Side:** `real`, `know`, `page` (representing documented reality, knowledge, the medium of fact/fiction).
      *   **Feeling Side:** `cry`, `ache`, `hold` (representing emotional response, embodied pain, and the act of internalizing/containing).
      *   **The Shuffle:** Each stanza forces these words into new, often contradictory, relationships. "Real" ends up next to "cry" (stanza I), "know" (stanza V), "page" (stanza VI), emphasizing the unstable tension. "Hold" interacts with "real" (stanza IV), "ache" (stanza III), "know" (stanza II), showing the struggle to grasp the intangible feeling *despite* knowledge.
  3.  **Character's Voice (Stanza III):** Embodies the paradox directly – the non-existent entity questions the reader's grief ("You weep for me?"), highlights its own textual nature ("My world dissolves when shut inside the page"), and paradoxically claims the *feeling* is the real thing ("Your grief’s the only thing that feels real").
  4.  **Envoy Failure:** It attempts a solution ("The cry insists the fiction's real") but immediately contradicts itself ("The ache rejects what reason's taught to know"). The final line ("The page can hold what daylight cannot hold") is ambiguous and unresolved – the page *contains* the fiction causing intense feeling, but daylight (reality, reason) *cannot* contain or explain that feeling. It ends open, straining under the weight of all six words.
  5.  **No Explaining, Just Embodying:** The poem doesn't philosophize *about* the paradox; it enacts it through the juxtaposition of the end-words and the imagery (ink, paper, ghosts, shadows, bruise, fire).
  6.  **Accessible Yet Pointed:** Readers unfamiliar with the paradox will feel the emotional dissonance ("fabricated storm", "phantom sorrows", "spectral suffering"). Those who know it will see the end-words as the conflicting propositions constantly recombined.
  7.  **Title:** "Paper Ghosts" captures the central tension – the fictional entities (ghosts) made manifest and affecting through text (paper), implying their simultaneous power and unreality.

  The sestina form, with its relentless rotation of the same six words, perfectly mirrors the obsessive, unresolvable nature of the paradox you described. Each stanza is another attempt to reconcile the irreconcilable, culminating in the envoy's beautiful, fractured failure. Good luck with the zine!
