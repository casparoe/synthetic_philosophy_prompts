prompt: |-
  I'm in a reading group that has spent the term on Wittgenstein's On Certainty, and I want a poem to close our last session. Please write a pantoum of five quatrains — twenty lines, no rhyme required, the usual interlocking rule in force, so that each quatrain's second and fourth lines become the next quatrain's first and third, and the last quatrain returns the poem's opening lines. The form should do the philosophical work: the lines that keep coming back should be the propositions that hold fast while everything around them moves — the ones that are neither known nor doubted, that sit outside the space in which knowing and doubting get their sense at all, that we are trained into rather than argued into, and that can drift from the riverbed into the current and back again as the picture around them shifts. So the same sentence should read as bedrock in one position and as a bare empirical claim in another, and the closing quatrain, in returning the opening lines, should make them sound like something inherited rather than something established. Give me one quatrain in which someone is taught rather than convinced, and let the poem end where the demand for further reasons runs out — not in a special kind of knowing, but in doing. Don't name Wittgenstein and don't use the word hinge; the recurrence itself should carry the idea, so that someone who has read the book recognizes it without being told. Keep the diction plain, since the flatness of the repeated lines is part of the point, and give me the poem only.
reasoning: |-
  Okay, the user is part of a reading group finishing Wittgenstein's *On Certainty*, and they want a pantoum poem to close their last session. This needs to be a specific form: five quatrains with twenty lines total, no rhyme required, following the interlocking rule where the second and fourth lines of each quatrain become the first and third of the next. The last quatrain should return to the opening lines, creating a circular structure. 

  The philosophical core is crucial. The poem must embody Wittgenstein's ideas about "propositions that hold fast"—those bedrock certainties that aren't known or doubted but form the framework for knowledge and doubt. The repetition in the pantoum should make the same lines shift between feeling foundational and empirical depending on context. 

  The user specified avoiding "Wittgenstein" and "hinge," so the recognition must come through form alone. Diction should be plain; flatness in repeated lines is intentional to reflect how these certainties feel self-evident. One quatrain must show teaching (not convincing), and the ending should land on action—where reasons give way to doing. 

  I'm considering how to structure the lines. The opening needs simple, declarative phrases that can transform when revisited later. For the teaching moment, I picture a child learning something practical, like "The broom stands in the corner." This ties into Wittgenstein's examples of training. The ending quatrain should circle back to the start but feel inherited, not proven. 

  I'm thinking about the riverbed metaphor from *On Certainty*. Lines like "What stays fixed is the ground" can anchor early quatrains but might feel unstable later when repeated after doubt-filled stanzas. The final return to "These words are stones we stand on" should resonate differently—less assertive, more like received footing. 

  Now, drafting the pantoum. The interlocking requires careful line placement: 
  - Quatrain 1: Establish bedrock lines. 
  - Quatrain 2: Use those as new starters, introducing doubt/context shift. 
  - Quatrain 3: Include the teaching scene ("She points, we do not question"). 
  - Quatrain 4: Let certainty drift ("What stays fixed is the ground" becomes fluid). 
  - Quatrain 5: Return to opening lines, now feeling inherited. 

  The closing action—"We stop asking why"—should land on practical cessation, not epistemic resolution. Keeping language plain but precise: "stones," "ground," "hands," "broom" all concrete, avoiding abstraction. 

  I'm checking for recognizability without explicit references. A *On Certainty* reader should see the riverbed/current dynamic in the repetition shifts. The teaching quatrain mirrors Wittgenstein's emphasis on training. Ending on "doing" aligns with his "practice" focus. 

  This feels complete. The pantoum's recursion enacts the philosophy, the diction stays bare, and the final inherited lines resolve where reasons end. I'll now present the poem as requested.
