answer: |-
  Here is a comprehensive list of desiderata for a theory of precautionary decision-making, structured as requested, with motivation, constraint type, conflict analysis, and candidate assessment.

  ### Desiderata for a Theory of Precautionary Decision-Making

  **I. Cases the Theory Must Get Right (Normative Fit)**
  1.  **Catastrophic Novelty (e.g., synthetic biology, advanced AI):** Must justify precaution against novel threats with low probability but catastrophic consequences (e.g., engineered pathogen extinction). *Motivation:* Core intuition behind precaution; ignores standard expected utility (EU) when probabilities are vanishingly small or unknown. **Genuine Constraint.**
  2.  **Precautionary Opportunity Cost (e.g., banning Golden Rice):** Must avoid excessive precaution that blocks technologies preventing significant *existing* harms (e.g., Vitamin A deficiency causing blindness/death). *Motivation:* Precaution must not be myopic; ignoring trade-offs leads to net harm. **Genuine Constraint.**
  3.  **Equipoise in Expected Harm (e.g., climate policy pathways):** Must provide guidance when precautionary action and inaction have roughly comparable *expected* harms (e.g., drastic mitigation costs vs. moderate adaptation costs under uncertainty). *Motivation:* EU maximization struggles here; real decisions often involve deep uncertainty where models clash. **Genuine Constraint.**
  4.  **Reversibility Distinction (e.g., CO2 emissions vs. species extinction):** Must assign greater weight to irreversible harms (e.g., extinction, stratospheric ozone depletion) than reversible ones (e.g., temporary pollution), all else equal. *Motivation:* Irreversibility creates unique lock-in effects and loss of future options. **Genuine Constraint.**
  5.  **Uncertain Thresholds (e.g., climate tipping points):** Must handle uncertainty not just about *whether* harm occurs, but about *what level* of stress triggers serious/irreversible harm (e.g., unknown CO2 ppm for ice sheet collapse). *Motivation:* Common in complex systems; affects precautionary triggers. **Genuine Constraint.**

  **II. Distinctions the Theory Must Not Collapse (Conceptual Clarity)**
  6.  **Risk vs. Ambiguity/Model Uncertainty:** Must differentiate decisions under known probabilities (risk), unknown probabilities (ambiguity/Knightian uncertainty), and deep structural uncertainty (model disagreement/incompleteness). *Motivation:* Responses differ profoundly (e.g., ambiguity aversion); collapsing them misapplies tools. **Genuine Constraint.**
  7.  **Reversibility vs. Magnitude:** Must treat irreversibility as a distinct factor from sheer harm size. *Motivation:* A large reversible harm and a smaller irreversible harm demand different analyses; magnitude alone is insufficient. **Genuine Constraint.**
  8.  **Presumption vs. Burden of Proof:** Must clearly distinguish the *initial tilt* towards precaution (presumption) from *who* must provide what *level of evidence* to overcome it (burden of proof). *Motivation:* Practical implementation requires clarity on procedural steps and evidentiary standards. **Genuine Constraint.**
  9.  **Rational-Choice vs. Legitimacy Reading:** Must account for both efficiency/outcome optimization (Rational-Choice) *and* constraints on imposing non-consensual risks on others/posterity (Legitimacy). *Motivation:* Precaution often stems from ethical concerns about power, consent, and intergenerational justice, not just optimization. **Camp Commitment (Legitimacy focus), but widely recognized as essential scope.**
  10. **Action vs. Omission (if tenable):** Must address, if possible, whether imposing a *new* risk (action) differs morally/legally from *failing to remove* an existing risk (omission) in precautionary contexts. *Motivation:* Intuitions often differentiate (e.g., releasing GMOs vs. not developing a vaccine); but the distinction is philosophically contested. **Contentious / Camp Commitment (often Legitimacy-focused).**

  **III. Puzzles the Theory Must Dissolve (Internal Coherence)**
  11. **Precautionary Regress:** Must avoid infinite regress (taking precautions against the harms of precaution itself). *Motivation:* Otherwise paralyzing. **Genuine Constraint.**
  12. **Inaction is Action:** Must recognize that "doing nothing" is a choice with consequences, preventing identification of precaution solely with inaction. *Motivation:* Fundamental to avoiding false dichotomies; forces comparative analysis. **Genuine Constraint.**
  13. **Rule/Presumption/Procedure Status:** Must specify its operational form clearly: a substantive decision rule (e.g., maximin), an evidentiary presumption, or a procedural rule for burden of proof allocation. *Motivation:* Vague formulations ("better safe than sorry") are operationally useless and lead to inconsistent application. **Genuine Constraint.**
  14. **Non-Circular Threshold Setting:** Must define a threshold for triggering precautionary measures ("serious/irreversible harm") without presupposing the very precautionary logic it seeks to establish. *Motivation:* Avoids tautology and provides actionable criteria. **Genuine Constraint.**

  **IV. Results the Theory Must Remain Consistent With (External Compatibility)**
  15. **Decision Theory Admissibility:** Must be compatible with established results in decision theory, particularly the inadmissibility of lexicographic preferences or unboundedly weighted values under reasonable axioms. *Motivation:* Ensures formal rationality; avoids dominance violations. **Genuine Constraint.**
  16. **Finite Resource Acknowledgment:** Must recognize that no agent/polity can assign *unlimited* weight to *every* conceivable hazard. *Motivation:* Practical and logical necessity; unlimited precaution is impossible and paralyzing. **Genuine Constraint.**

  ### Conflict Analysis: Which Desiderata Cannot be Jointly Satisfied?

  *   **Primary Conflict:** **#9 (Legitimacy Reading)** directly conflicts with **#15 (Decision Theory Admissibility)** and creates tension with **#16 (Finite Resources)**.
      *   **Why?** The strong Legitimacy Reading (#9) often implies *prohibitions* on imposing certain non-consensual catastrophic risks, *regardless of probability* (if non-zero). This necessitates something akin to lexicographic priority or infinite disutility for those outcomes, violating #15. Assigning "infinite" weight even to a few such risks rapidly violates #16.
  *   **Secondary Tension:** Strict adherence to **#1 (Catastrophic Novelty)** under deep ambiguity (#6) can push towards rules violating **#15** and **#16**. Similarly, satisfying **#9** and **#1** robustly can make it very difficult to adequately satisfy **#2 (Opportunity Cost)** and **#3 (Equipoise)** without compromising the core precautionary motivation.
  *   **Resolution?** A successful theory must *weaken* or *reinterpret* the Legitimacy Reading (#9) to avoid absolute prohibitions (e.g., framing it as a very high, but finite, weighting factor within a structured decision framework), or find a way to integrate consent procedures explicitly. It must also employ robust decision-making under deep uncertainty (#6) rather than resorting to lexicographic rules.

  ### Candidate Theory Assessment Against Desiderata

  | Desideratum                          | Expected Utility (EU) Maximization | Maximin / Catastrophic Min-Max Regret | Strong Precautionary Principle (PP) |
  | :----------------------------------- | :--------------------------------- | :------------------------------------ | :---------------------------------- |
  | **1. Catastrophic Novelty**          | ⚠️ Fails (ignores low-p/high-mag) | ✅ Excels                              | ✅ Excels                            |
  | **2. Opportunity Cost**              | ✅ Excels                           | ⚠️ Fails (ignores benefits)           | ⚠️ Fails (ignores benefits)         |
  | **3. Equipoise Expected Harm**       | ✅ Excels                           | ⚠️ Fails (arbitrary choice)           | ⚠️ Fails (arbitrary choice)         |
  | **4. Reversibility Distinction**     | ⚠️ Partial (via discounting)       | ✅✅ (if irreversible=catastrophe)     | ✅✅                                 |
  | **5. Uncertain Thresholds**          | ⚠️ Struggles (model dependence)    | ✅ Excels (focus on worst threshold)  | ✅ Excels                            |
  | **6. Risk vs. Ambiguity**            | ⚠️ Fails (assumes known probs)     | ✅ Excels (treats ambiguity as risk)  | ⚠️ Fails (often conflates)          |
  | **7. Reversibility ≠ Magnitude**     | ✅ Can incorporate separately      | ⚠️ Often collapses                    | ⚠️ Often collapses                  |
  | **8. Presumption vs. Burden**        | ❌ Not addressed                    | ❌ Not addressed                       | ⚠️ Vague/Conflated                 |
  | **9. Legitimacy Reading**            | ❌ Not addressed                    | ⚠️ Partial (if catastrophe=wrong)    | ✅✅ Excels                          |
  | **10. Action/Omission (if tenable)** | ❌ Not addressed                    | ❌ Not addressed                       | ⚠️ Often biased towards action     |
  | **11. Precautionary Regress**        | ✅ Avoids                           | ⚠️ Vulnerable                         | ❌ Fails (perpetuates)              |
  | **12. Inaction=Action**              | ✅ Incorporates                    | ✅ Incorporates                       | ⚠️ Often ignores (focus on action) |
  | **13. Clear Rule/Presumption**       | ✅ Clear Rule                      | ✅ Clear Rule                         | ❌ Vague / Multi-interpretable      |
  | **14. Non-Circular Threshold**       | ✅ (Harm magnitude)                | ⚠️ (Defines by outcome)               | ❌ Fails (Circular: "serious harm") |
  | **15. DT Admissibility**             | ✅✅ Excels                         | ⚠️ Often inadmissible                 | ❌ Fails (Lexicographic tendencies) |
  | **16. Finite Resources**             | ✅ Explicitly incorporates        | ⚠️ Implicitly, but can be ignored     | ❌ Fails (Implies infinite weight)  |

  **Key:**
  *   ✅✅ = Excels / Core Strength
  *   ✅ = Satisfies / Good Fit
  *   ⚠️ = Partial / Problematic / Conditional
  *   ❌ = Fails / Major Weakness

  **Which Requirement Eliminates the Most Candidates?**
  **#16 (Finite Resource Acknowledgment)** is the most eliminative. It immediately disqualifies any formulation of the **Strong Precautionary Principle** that implies infinite weighting or absolute prohibitions without regard to resource constraints or trade-offs (#2, #3). It also severely constrains **Maximin** approaches if applied indiscriminately to all potential catastrophes, as this leads to paralysis. Only **EU Maximization** and *carefully bounded* versions of Maximin/Robust Optimization (that incorporate budget/resource constraints) can satisfy it. #15 (DT Admissibility) is also highly eliminative, ruling out Strong PP and some pure Maximin formulations.

  ### Conclusion
  This list reveals the core tension: **reconciling the ethical imperative to avoid catastrophic/non-consensual harms (#1, #9) with the demands of rational choice under scarcity and uncertainty (#15, #16, #2, #3, #6)**. No existing candidate theory satisfies all desiderata perfectly. A promising approach likely involves:
  1.  **Robust Decision-Making (RDM) or Info-Gap:** To handle deep uncertainty (#5, #6) without violating admissibility (#15).
  2.  **Safe Minimum Standard (SMS) or Contextual Catastrophic Thresholds:** To define precautionary triggers non-circularly (#14) focusing on irreversibility (#4, #7) and catastrophe (#1) without being absolute.
  3.  **Legitimacy via Deliberative Procedures:** Embedding consent/justification (#9) within the decision *process* (burden shifting #8, deliberation) rather than solely in the outcome rule.
  4.  **Explicit Handling of Trade-offs & Budgets:** Rigorously incorporating opportunity costs (#2), equipoise (#3), and finite resources (#16).

  Your framework needs to navigate these demands, particularly resolving the #9 vs. #15/#16 conflict in a principled way, while providing clear operational guidance (#13) and avoiding paralysis (#11, #12). Good luck!
