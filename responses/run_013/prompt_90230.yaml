  - Perpetrators gaming confession-as-transaction (narrative tools struggle with insincere character shifts).  
  - Collective victims as protagonists (fiction favors individuals). Loss here reveals transitional justice's unique stakes—not the novelist's failing.  

  Final thought: Their question exposes how legal concepts can be *narratively* unsatisfying yet politically necessary. That dissonance? Worth a novel itself.
answer: |-
  ### Translating Transitional Justice: Amnesty-for-Truth as Narrative Structure  
  *(Systematic mapping to craft vocabulary, with distortions & gaps noted)*  

  ---

  ### **Core Dispute: Amnesty-for-Truth vs. Retributive Justice**  
  **As Narrative Mechanics**  
  | **Transitional Justice Concept** | **Novelistic Translation** | **Fidelity Assessment** |  
  |----------------------------------|----------------------------|-------------------------|  
  | **Amnesty-for-Truth** | A **denouement** achieved via *conditional resolution*: the antagonist’s confession (truth) triggers narrative absolution (amnesty), bypassing punitive climax. | **Clean map**: Functions like a *contractual plot device*—amnesty is the "price" paid for truth, altering the expected arc. |  
  | **Retributive Justice** | A **cathartic climax**: the antagonist’s punishment delivers thematic closure. The villain’s arc concludes with consequence (e.g., prosecution as "final scene"). | **Clean map**: Mirrors classic tragic/comic structure. Punishment = plot resolution. |  
  | **Critique of Amnesty** | An **unearned resolution**: amnesty "arrives" without character transformation (no remorse) or narrative groundwork. Feels *deus ex machina*—imposed, not evolved. | **Partial distortion**: Legal amnesty *is* externally imposed; fiction’s "unearned" resolutions are flaws, but here it’s intentional policy. |  

  ---

  ### **Your Three Focal Points**  
  #### **1. Testimony vs. Confession**  
  - **Testimony** = **Scene**: A witness’s account rendered in vivid sensory detail (sight, sound, trauma). Establishes *fact* through show-don’t-tell.  
  - **Confession** = **Free Indirect Discourse**: The perpetrator’s inner guilt made audible. Requires *subjective immersion*—reader accesses self-implication.  
  - **The TRC’s Dual Demand** = **Genre Collision**: Asking for both forces *testimony* (objective/scenic) and *confession* (subjective/internal) into one act.  
    - **Distortion**: Perpetrators often gave *legal testimony* ("I shot X at Y") without *narrative confession* (no guilt, no inner revelation).  
    - **Gap**: Your vocabulary *can* represent this—via **unreliable narration**. A perpetrator "confesses" facts while hiding moral bankruptcy. But the TRC’s *performance* of confession-as-transaction has no craft equivalent. **Loss**: The ritual’s *public performativity*. Fiction treats confession as intimate; the TRC made it bureaucratic.  

  #### **2. State Amnesty vs. Narrative Omission of Punishment**  
  - **Amnesty as Legal Act** = **No Novelistic Equivalent**.  
    - Fiction omitting punishment (e.g., a tyrant surviving unscathed) is **thematic ambiguity** or **ironic commentary** (e.g., *The Great Gatsby*’s unpunished rich).  
    - State amnesty is **active impunity-conferral**: a sovereign power *voiding* consequence.  
    - **Gap**: Fiction cannot replicate this *performative authority*. A narrator "granting amnesty" would break mimesis (unless allegorical, like *Animal Farm*). This isn’t a flaw in your framework—it’s fiction’s *limit*. Amnesty is extra-narrative; it exists in the realm of power, not plot.  

  #### **3. Reader Appetite for Villain-Punishment**  
  - **Retribution as "Earned" Arc** = **Cathartic Story-Beats**:  
    - Villain punishment satisfies **plot logic** (cause → effect) and **character arc** (hubris → fall).  
    - Reader desire is **primal story appetite**, not moral philosophy. *But*:  
  - **Distortion**: This appetite *masquerades* as moral necessity. We conflate *narrative satisfaction* (a completed arc) with *justice* (ethical rightness). Transitional justice debates weaponize this: "No trial = bad ending."  
    - **Critical Insight**: Fiction reveals that "closure" ≠ moral truth. An unpunished villain (e.g., Iago) can be *more* thematically resonant. Retribution’s "moral weight" in debates is partly *borrowed* from narrative expectation.  

  ---

  ### **Residue Report: What Didn’t Survive the Crossing**  
  | **Concept** | **Translation Failure** | **Cause** |  
  |-------------|--------------------------|-----------|  
  | **Collective Victimhood** | Focalisation struggles with *group protagonists*. Novels center individuals; TRC testimony often spoke for communities. | **Framework defect**: Fiction’s tools for collective perspective (chorus figures, polyphony) are underdeveloped vs. individual POV. |  
  | **Amnesty as Sovereign Act** | No analogue for the *state’s power* to nullify consequences. Fiction’s "unpunished evil" implies cosmic indifference, not legitimized mercy. | **Original concept’s uniqueness**: Amnesty is a *legal performative*—fiction can describe, not enact it. |  
  | **Conditionality of Truth** | "Full disclosure" as amnesty’s *contractual term* maps poorly. Characters lie or omit; the TRC punished *non-disclosure*, not *immorality*. | **Distortion**: Novelistic "truth" is thematic/emotional; the TRC sought *forensic facts*. The gap is ontological. |  
  | **Perpetrator’s Calculated Confession** | An amnesty-seeker "confessing" without remorse = **unreliable narration**, but lacks *narrative consequences*. In fiction, insincerity undermines arc; in TRC, it was *legally sufficient*. | **Original ambiguity**: The TRC accepted *transactional* truth—your framework exposes its narrative unsatisfyingness. |  

  ---

  ### **Conclusion: The Translator’s Honesty**  
  - **What Works**: Core plot dynamics (amnesty-as-resolution vs. retribution-as-climax) map cleanly. Focalisation and unreliable narration dissect testimony/confession tensions.  
  - **What Distorts**: Legal amnesty’s *performative authority* and *collective victimhood* strain novelistic tools. Fiction’s "unearned resolution" critique doesn’t fully capture amnesty’s *political intentionality*.  
  - **What’s Lost**: The state’s role as *granter of impunity*. This isn’t your framework’s flaw—it’s proof that amnesty is an *extraliterary act*. The residue reveals transitional justice’s uniquely *political* stakes: it crafts "endings" not for narrative satisfaction, but societal survival.  

  > **Final Note**: Your vocabulary *excels* at exposing why amnesty-for-truth *feels* narratively unsatisfying—it truncates arcs, denies catharsis, and accepts unreliable "confessions." But it also reveals fiction’s *limits*: unlike novels, transitional justice must prioritise real-world stability over poetic justice. The tension between these domains is where your novelist’s eye is most valuable.
