  2. If state amnesty has any true parallel in fiction's choice to omit punishment, or if it's an alien "performative act."  
  3. Whether reader demand for villain-comeuppance is substantive or just aesthetic masquerading as moral.  

  Right, first I need to establish equivalences. Amnesty-as-denouement feels intuitive: it's an endpoint trading catharsis for closure. But the TRC's conditional amnesty is more like a *contractual* resolution—truth for freedom—which novels rarely execute so explicitly. That's a distortion risk.  

  Testimony and confession... here's where craft terms strain. Testimony is pure scene: witnessed action rendered vividly. Confession leans into free indirect discourse—internal guilt made audible. But when a perpetrator "confesses" legally (without remorse) to secure amnesty, it's actually testimony in disguise. That gap—between legal and narrative definitions of confession—might frustrate the novelist. The TRC blurred these modes; fiction typically keeps them distinct for clarity.  

  On amnesty as narrative omission... no, that feels false. When fiction withholds punishment (think Gatsby's unpunished rich), it's thematic silence, not absolution. The state's amnesty is an active *granting* of impunity. Novelistic tools lack this sovereign performativity. That's not a flaw in craft; it's a limit.  

  Reader appetite for villain-punishment... tricky. Retributive justice hooks into primal narrative arcs (Voldemort's vanquishing). But calling it "moral" confuses catharsis with ethics. Fiction can scratch the itch; real justice must weigh more. That tension—between emotional payoff and philosophical duty—is where the novelist's insight bites deepest.  

