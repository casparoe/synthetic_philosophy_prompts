prompt: |-
  A friend of mine treats Hume's chapter on miracles as a working rule for sorting miracle reports, and I have been logging her verdicts. She rejects the report of a single illiterate shepherd who says his sheep spoke to him; she rejects the resurrection claim of a rival religious tradition, even though several of its devout adherents attest it; she rejects the account of a weeping statue given by pilgrims who had traveled to see it; she rejects a healing at a shrine even though a physician was among those who vouched for it, on the ground that the physician was himself a devotee; and she rejects a levitation reported by a handful of excited villagers. Every miracle report I have put to her so far, she has turned down. Now I want to know what she will say about a new one: a levitation lasting several minutes, caught on multiple independent cameras and attested by a dozen witnesses who are educated, have no religious affiliation or stake in the outcome, were strangers to one another beforehand, and stand to gain nothing by reporting it. Will she accept it? I care less about the yes or no than about the rule she is actually running. Is she applying Hume's balance, accepting testimony whenever it would be more miraculous for the witnesses to be deceived or lying than for the event to have occurred, or is she running the stronger reading on which no testimony whatever can establish a violation of a law of nature, so that every such report fails in advance? Tell me what each rule predicts about the new case, which one her track record better supports and why, and name the further case that would most cleanly tell the candidate rules apart. Please answer in continuous prose, with no headings, bullet points, bold text, or tables.
reasoning: |-
  Okay, let me try to figure out how to approach this user's query. They've presented a detailed scenario about their friend who evaluates miracle reports based on Hume's chapter on miracles. The friend consistently rejects every miracle report presented so far, and now the user wants to know how she would handle a new, seemingly well-attested case of levitation. The core question is whether she's applying Hume's "balance of probabilities" test or a stricter "no testimony can suffice" rule.

  First, I need to recall Hume's actual position. In his essay, Hume argues that no testimony can establish a miracle unless the falsehood of the testimony would be more miraculous than the miracle itself. This is the "balance" approach. But Hume also suggests that miracles, by definition being violations of natural laws, have such overwhelming evidence against them that no testimony could ever be sufficient - this is the "stronger reading". 

  Looking at the friend's track record: she rejected reports from a single illiterate shepherd, a rival religious group, pilgrims at a weeping statue, a shrine healing (even with a physician's testimony), and villagers reporting levitation. All these rejections could technically align with Hume's balance test because each had credibility issues - single witness, partisan interests, emotional crowds, biased physician, or few excited observers. The balance test would find the witnesses' deception more probable than the miracle in each case.

  Now the new case is different: multiple cameras, educated neutral witnesses, no gain from reporting. Under Hume's balance test, this might pass because it would be extraordinary for all these witnesses and recordings to be mistaken or deceitful. But under the stricter rule, even this wouldn't matter - no testimony could ever overcome the presumption against miracles.

  The friend's pattern suggests she might be using the stronger rule because she's never accepted any report, regardless of attestation. But technically, her past rejections could still fit the balance test. To really distinguish, we'd need a case with overwhelming attestation that would force the balance test to accept it. That's the "further case" that would cleanly separate the rules: if she rejected even something like "all living scientists independently verify a resurrection with physical evidence," then she's definitely using the stronger rule.

  The user cares about understanding their friend's actual reasoning pattern. They seem philosophically curious, testing how principles apply to edge cases. There might be an unstated interest in whether Hume's skepticism is internally consistent or whether it inevitably leads to dogmatic rejection. I should make clear that while the track record is ambiguous, the proposed extreme case would clarify things. This maintains philosophical precision while answering the practical question about their friend's behavior.
answer: |-
  Your friend's consistent rejection of all miracle reports so far presents an ambiguity regarding her application of Hume's principles. To determine whether she is applying Hume's "balance of probabilities" test or the stronger "no testimony suffices" rule, we must examine each rule's prediction for the new case and analyze her track record.

  Hume's "balance of probabilities" rule dictates that testimony for a miracle should be accepted *only* if the falsehood of that testimony (due to deception, error, or delusion) would be a *greater* miracle than the event it describes. For your new levitation case—documented by multiple independent cameras and attested by a dozen educated, disinterested, unaffiliated strangers who stand to gain nothing—it would be extraordinarily improbable for *all* witnesses and recordings to be simultaneously mistaken or deceitful. Coordinated fraud across strangers would require elaborate conspiracy, while mass hallucination affecting diverse observers and technology strains credulity. Under this balance test, the miracle of levitation *might* become less improbable than the "miracle" of such widespread, consistent error or deception. Thus, **the balance rule could reasonably predict acceptance of this report**, as the testimony's reliability appears exceptionally high.

  Conversely, the stronger "no testimony suffices" interpretation insists that uniform human experience supporting natural laws constitutes such overwhelming evidence that *no* testimony, however reliable, can countervail it. The inherent improbability of violating a law of nature is deemed infinite, rendering all testimony insufficient by definition. **This rule would predict rejection of the new case**, regardless of the quality of evidence, because miracles are inherently unprovable by testimony alone. The cameras and witnesses would be dismissed as flawed, forged, or misinterpreted *a priori*.

  Her track record better supports the **stronger "no testimony suffices" rule**. While her past rejections align with the balance test (due to factors like witness unreliability, partisanship, or excitement), the *consistent pattern* of rejecting *every* report—even those with some credible elements like a physician's testimony—suggests an unwavering skepticism that transcends context-specific flaws. Crucially, the balance test *should* remain open to exceptionally attested miracles, yet she has never accepted one, implying a baseline rejection of *all* miracle claims irrespective of attestation quality. Her dismissal of the physician's testimony solely due to devotion (despite professional expertise) further indicates a predisposition to discount *any* witness with potential bias, which could extend to reinterpreting "neutrality" in the new case as latent credulity. This pattern points toward a categorical rejection compatible only with the stronger rule.

  The further case that would most cleanly distinguish these rules is: **A violation of a fundamental law of nature (e.g., a resurrection) attested under rigorous, controlled laboratory conditions by the world's leading skeptical scientists, with continuous multi-spectral imaging, replicated biological markers, and immediate independent verification by rival research teams with no prior contact, all publishing raw data in real-time with no conceivable motive for fraud.** 

  - Under the **balance rule**, this near-impeccable attestation would make the falsehood of the testimony (a global scientific conspiracy or unprecedented collective delusion) more miraculous than the event itself, compelling acceptance.  
  - Under the **stronger rule**, even this evidence would be rejected as insufficient to overturn natural law, perhaps attributed to undetected error, manipulation, or unknown natural phenomena.  

  Her response to such a scenario would definitively reveal her underlying principle: acceptance favoring the balance test, or rejection confirming the stronger doctrine.
