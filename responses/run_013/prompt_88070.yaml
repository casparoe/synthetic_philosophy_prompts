prompt: |-
  I run grantmaking at a mid-sized foundation that funds public-interest work in fast-moving technical fields, and I have a recurring problem with our own process. A large share of the proposals that reach my desk are justified, in their central paragraph, by some version of the same argument: the field is a race, our side cannot afford to fall behind, and therefore this work must be funded now on the terms proposed. My program officers have taken to calling these "Moloch-shaped" proposals, and I have come to suspect that we are less choosing among them than being pulled along by them — that our own grantmaking is one of the things setting the pace. What I want from you is a decision procedure my officers can actually run, not an essay about collective action. It must be usable by generalists who have not read the underlying literature; it must fit in about forty minutes per proposal (we see sixty or so a year, mostly between $200k and $2M, and the board meets quarterly and signs off on anything above $500k); and it must survive the fact that we cannot demand confidential information about a grantee's competitors. The output should be a short written verdict that a program officer can defend in front of a board that includes two economists and one trustee who thinks the answer is always more coordination.

  The procedure should take the form of questions asked in order, with a statement of what counts as a sufficient answer to each, where it stops with a no, and where it hands the decision to a person because the remaining question is one of values rather than fact. A few things I would like it to sort out, because my officers currently cannot: how to tell a genuine multipolar trap from a coordination problem that has a focal solution, from a bargaining problem among a small identifiable set of parties, from a waiting game in which everyone would rather someone else moved first, from ordinary competitive pressure that is nobody's trap at all. It should force the question of who "the others" are — a closed set of known rivals, an open population, or future entrants who are only attracted because there is now money in the race, since I suspect that funding a race tends to add runners to it. It should ask whether the dynamic has a natural finishing line (a standard gets adopted, a rule changes) or no terminus at all; I have noticed that some of these races end and others simply continue at increasing cost. It should ask whether any unilateral or small-coalition move exists — a transparency commitment, or the Schelling-style move of making one's own defection impossible — because if one does, the thing is not a trap in the strong sense. It should ask whether the prize is positional (a ranking, a first-mover advantage) or a genuine public good, and who outside the race is helped or hurt by our entry into it. And it should require a red-team step in which the officer writing the verdict states the strongest case that the dynamic is not a trap at all. Where a step is a judgment call dressed up as procedure, say so.

  Then run the procedure on three cases and show your work. First, a proposal to fund a nonprofit that will build a "responsible deployment" toolkit for firms in a fast-moving commercial field, on the argument that the grantees' competitors will not wait for them. Second, a proposal to build a public-interest alternative to a piece of entrenched infrastructure that is entrenched mainly because everyone already uses it — I expect this one may not be a trap at all. Third, and I want this one played straight, a proposal for a rapid-response legal fund in an area where we have already made eight similar grants in four years; if the procedure says our own money is what keeps that fight going, say so plainly. For each case, tell me which question decided it, what verdict the procedure returns, and where it reaches the limit of what it can do — including whether it can ever detect a trap that the foundation is inside of and cannot see.
reasoning: |-
  We are designing a decision procedure for evaluating "Moloch-shaped" proposals that argue for funding based on a race dynamic where falling behind is catastrophic.
   The procedure must be runnable by generalists in about 40 minutes per proposal, without requiring confidential information.
   The output is a short written verdict that a program officer can defend to a board.

   The procedure is a series of questions in order. Each question must be answered sufficiently to move to the next, and some lead to a "No" or a handoff to human judgment.

   Steps of the procedure:

   1. **Define the race**: 
      - Question: "What is the race about? Specifically, what is the prize or the negative outcome that is being raced toward or away from? And who are the participants (the 'runners')?"
      - Sufficient answer: A clear description of the prize (or negative outcome) and a list of the key participants. If the participants are not clearly identifiable (e.g., open population, future entrants), note that.
      - If the answer is vague or the prize is not defined, stop and return a verdict of "No: Race undefined."

   2. **Identify 'the others'**:
      - Question: "Who are the 'others' in this race? Are they a closed set of known rivals, an open population (anyone can join), or future entrants (who would join because of the race dynamics or funding)?" 
      - Sufficient answer: A categorization of the others as one of the above. If future entrants are likely, note that.
      - This step doesn't stop the process but informs later steps.

   3. **Race dynamics and finishing line**:
      - Question: "Does the race have a natural finishing line (e.g., a standard is adopted, a regulation is set, a winner is declared) or is it ongoing with no clear end? If there is an end, what is it and how is it reached? If not, why not?"
      - Sufficient answer: A clear description of either (a) the finishing line and how it is reached, or (b) why there is no finishing line and the race is perpetual.
      - If the race is perpetual and the cost is escalating without a clear benefit, this may lead to a negative verdict later.

   4. **Assess the trap type**:
      - This step requires the officer to classify the dynamic. The question: "What kind of dynamic is this? Consider the following options and choose the best fit:
          a. A genuine multipolar trap (everyone acts against their own long-term interest because they fear others will defect)
          b. A coordination problem with a focal solution (there is a natural point of agreement that everyone would prefer if they could coordinate)
          c. A bargaining problem among a small identifiable set of parties (a few players could negotiate a solution)
          d. A waiting game (everyone would prefer someone else to move first, but if someone does, all benefit)
          e. Ordinary competitive pressure (this is just how the field advances; no trap, just healthy competition)"
      - Sufficient answer: The officer must pick one and provide a brief justification. If the officer cannot distinguish between these, they must note that and hand off to human judgment (but they must try).

   5. **Check for unilateral or small-coalition moves**:
      - Question: "Is there a unilateral move or a move by a small coalition (e.g., a transparency commitment, a precommitment, a Schelling-style move) that could break the dynamic without requiring everyone to coordinate? If so, what is it and why hasn't it been done?"
      - Sufficient answer: Either (a) identify such a move and explain why it hasn't been taken (e.g., lack of resources, knowledge, or it's not in the interest of the mover) or (b) explain why no such move exists (e.g., it's a true multipolar trap where any unilateral move is punished).
      - If such a move exists and is feasible, then the dynamic is not a strong trap. This doesn't automatically mean "No", but it weakens the case for urgency.

   6. **Positional vs. public good**:
      - Question: "Is the prize of the race purely positional (e.g., being first, getting a larger market share, a ranking) or is it a genuine public good (non-excludable and non-rivalrous) that benefits even non-participants? And who outside the race is helped or hurt by the foundation's entry (e.g., does funding this add runners and thus escalate the race, or does it help create a public good)?"
      - Sufficient answer: A clear statement of the nature of the prize and an assessment of the externalities (positive or negative) of the foundation's funding.
      - If the prize is purely positional and the foundation's funding adds runners (escalating the race without creating public benefit), that is a negative indicator.

   7. **Red-team step**:
      - Question: "What is the strongest argument that this is not a trap at all? Consider: Is the race actually beneficial? Is the fear of falling behind overblown? Could the field advance without this race? Are there alternative paths to the same goal?"
      - Sufficient answer: A paragraph that honestly presents the counterargument. This step is mandatory and must be written.

   8. **Verdict**:
      - Based on the above, the officer must write a verdict. The verdict can be:
          - "Yes: This is a critical intervention in a multipolar trap and our funding is justified."
          - "Conditional Yes: But with conditions (e.g., require that the grantee pursue coordination, or that the work includes a plan for a finishing line)."
          - "No: The proposal does not demonstrate a genuine trap, or the intervention may worsen the situation."
          - "Handoff: The case is too complex and requires higher-level decision (e.g., to the director or board)."
      - The verdict must be justified by referencing the answers to the above questions.

   Additional note: Throughout, if a step is a judgment call, the procedure should acknowledge that. We are building a framework to force structured thinking, not to eliminate judgment.

   Now, we run the procedure on three cases.

   Case 1: A proposal to fund a nonprofit that will build a "responsible deployment" toolkit for firms in a fast-moving commercial field, on the argument that the grantees' competitors will not wait for them.

   Case 2: A proposal to build a public-interest alternative to a piece of entrenched infrastructure that is entrenched mainly because everyone already uses it.

   Case 3: A proposal for a rapid-response legal fund in an area where we have already made eight similar grants in four years.

   For each, we go step by step and then give the verdict.

   Let's begin.

   Case 1: Responsible Deployment Toolkit

   Step 1: Define the race.
     - Race: To deploy new technology responsibly? But what is the prize? Avoiding negative outcomes (e.g., accidents, regulation) or gaining positive PR? Participants: Firms in the commercial field.
     - Sufficient? Probably. Participants are the existing firms and possibly new entrants.

   Step 2: Identify the others.
     - Others: Competitors in the field. Likely an open population because new firms can enter.

   Step 3: Finishing line?
     - Unclear. The race might be ongoing because responsible deployment is a continuous process? Or if the toolkit becomes a standard, then that could be a finishing line. But the proposal doesn't specify.

   Step 4: Assess trap type.
     - The argument is that if one firm waits to be responsible, others will rush ahead and capture the market. So it's a competitive pressure. But is it a trap? 
     - It could be seen as a multipolar trap: if all firms coordinated, they would all deploy responsibly and avoid a race to the bottom. But individually, each fears being left behind. 
     - Alternatively, it might be ordinary competitive pressure. The officer must judge: This is a coordination problem (with a focal solution being a shared toolkit) or a multipolar trap? Let's say the officer classifies it as a coordination problem with a focal solution (the toolkit could become the standard).

   Step 5: Unilateral moves?
     - Yes: A firm could unilaterally adopt responsible practices and publicize it, which might force others to follow. Or, building the toolkit and making it open could be a unilateral move by a nonprofit that then becomes a focal point. The proposal is exactly that: building a toolkit that can be adopted. So it's a unilateral move by the nonprofit (with foundation funding) that might solve the coordination problem.

   Step 6: Positional vs. public good.
     - The prize is partly positional (market share) but responsible deployment is a public good (safer technology for everyone). However, if the toolkit is built and adopted, it becomes a public good. But note: funding the toolkit might not change the number of runners (firms) in the race, but it might change the rules of the race.

   Step 7: Red-team:
     - Strongest counterargument: The toolkit might not be adopted because firms don't care about responsibility, only about winning. Or, the toolkit might be built but ignored. Also, the race might not be as urgent as claimed; firms might naturally adopt responsible practices as the field matures.

   Step 8: Verdict:
     - This is not a strong multipolar trap because there is a unilateral move (building the toolkit) that can change the game. The toolkit could become a focal point for coordination. However, the proposal is still valuable because it addresses a coordination problem. But the Moloch argument (race to the bottom) is weakened by the existence of a solution that doesn't require everyone to coordinate at once. 
     - Verdict: Conditional Yes. The condition might be that the grantee must have a clear adoption strategy to make the toolkit a standard.

   Deciding question: Step 5 (existence of a unilateral move) and Step 4 (coordination problem, not a strong trap).

   Case 2: Public-interest alternative to entrenched infrastructure

   Step 1: Define the race.
     - Race: Not clearly a race. The problem is that the entrenched infrastructure exists and is widely used, creating a lock-in. The proposal is to build an alternative. Where is the race? Maybe a race to capture the market? But the argument is not about a race, but about breaking a monopoly.
     - However, the proposal might be framed as: if we don't build an alternative now, the entrenched infrastructure will become even more dominant. So participants: the entrenched provider and the public-interest alternative builder. But it's not a race with many runners.

   Step 2: Others: Only one main competitor (the entrenched provider) and users who might switch.

   Step 3: Finishing line: Yes, if the alternative reaches critical mass and becomes the new standard.

   Step 4: Trap type? 
     - This doesn't fit a multipolar trap. It's more of a bargaining problem (with the entrenched provider) or a coordination problem among users (to switch to the new system). Alternatively, it might be a waiting game: users wait for someone else to switch first. 
     - Officer classifies: coordination problem among users (with a focal solution being the new infrastructure if it reaches a threshold).

   Step 5: Unilateral moves? 
     - Building the alternative is a unilateral move by the grantee. Then, getting early adopters might break the waiting game.

   Step 6: Positional vs. public good: 
     - The alternative infrastructure, if built, would be a public good (open access). But the prize is the replacement of a monopoly, which is a public good. The foundation's funding might help create a viable alternative, which is positive.

   Step 7: Red-team:
     - Counterargument: The entrenched infrastructure might be good enough, and building an alternative might be wasteful. Also, network effects are strong and the alternative might fail to gain traction.

   Step 8: Verdict:
     - This is not a Moloch-shaped trap at all. It's a classic problem of network effects and lock-in. The proposal might be good, but the race argument is weak. The foundation should evaluate it on other grounds (e.g., the merit of the alternative). However, the procedure is focused on the trap argument. Since the proposal was justified as a race? The procedure reveals that it's not a race. 
     - Verdict: No (on the basis of the trap argument). But note: the proposal might still be fundable under a different rationale. The procedure only rejects the Moloch justification.

   Deciding question: Step 4 (it's not a trap) and Step 1 (the race is not well defined).

   Case 3: Rapid-response legal fund (with eight similar grants in four years)

   Step 1: Define the race.
     - Race: Legal battles in a certain area. The prize is winning legal precedents or blocking unfavorable ones. Participants: our side (the public-interest groups we fund) and the opposition (e.g., corporations, other interests).

   Step 2: Others: The opposition is a closed set? Or open? It might be open because new opponents may arise if they see an opportunity. Also, note that our funding might be attracting more legal challenges (if opponents see that we are well-funded, they might ramp up).

   Step 3: Finishing line: Unclear. Legal battles can continue indefinitely. There might be no natural end until one side runs out of money or a definitive ruling. But with continuous funding, it could go on.

   Step 4: Trap type:
     - This could be a multipolar trap: if we don't fund, we lose ground, so we keep funding, and opponents do the same. But note: it's two-sided. It's an arms race. The officer might classify it as a multipolar trap (for our side: each round we feel we must fund to avoid losing).

   Step 5: Unilateral moves?
     - Is there a way to break the cycle? For example, a settlement, a legislative solution, or a strategy to avoid repeated battles? The proposal doesn't suggest that. It's just more funding for the next battle.

   Step 6: Positional vs. public good:
     - The legal wins are a public good (if they set good precedents) but the process is positional (winning vs. losing). However, the foundation's continued funding might be causing the race to escalate: opponents see that we are always ready to fight, so they bring more challenges.

   Step 7: Red-team:
     - Counterargument: The legal fights are necessary because the opposition is relentless. Without funding, bad precedents would be set. The foundation is not causing the race, it's responding to an external threat. And each battle is independently important.

   Step 8: Verdict:
     - The procedure might reveal that the foundation is part of the trap: by funding every battle, we are setting the pace and possibly attracting more challenges. The race has no natural finishing line. 
     - Verdict: Conditional Yes? But with a condition that the grantee must work on a strategy to break the cycle (e.g., seek a broader solution). Or even No: because the foundation's funding is perpetuating the race. However, note that the legal battles might be necessary. The procedure might hand off because of the values question: are we willing to let a bad precedent happen to break the cycle? That's a values call.

     But the procedure must give a verdict. Given that we have made eight grants and the race continues, and no finishing line, the officer might conclude that the foundation is in a trap and this grant would continue it.

     Verdict: No. Because the dynamic has no terminus and the foundation is part of the escalation. The strongest case against (red-team) is that each battle is independently important, but the pattern of repeated grants without an exit strategy is indicative of a trap.

   Deciding question: Step 3 (no finishing line) and Step 6 (funding might be adding fuel to the fire).

   However, note: the procedure might not be able to detect a trap that the foundation is inside of? In this case, it did: by Step 6 we considered that our funding might be attracting more opposition. But the procedure forces that consideration.

   In summary, the procedure:

   - For Case 1: Conditional Yes (because it's a coordination problem with a unilateral move available).
   - For Case 2: No (because it's not a trap at all).
   - For Case 3: No (because it's a perpetual race with no end, and our funding may be perpetuating it).

   But note: the officer might have different judgments in Step 4. The procedure forces the questions and makes the reasoning explicit.
answer: |-
  Below is a decision procedure designed for program officers to evaluate "Moloch-shaped" proposals. It follows a strict sequence of questions, specifies what constitutes a sufficient answer, and stops or delegates when key thresholds are unmet. It addresses your requirements: usable by generalists (no specialized knowledge needed), fits within 40 minutes, avoids confidential data, and outputs a defensible verdict. Steps requiring judgment are explicitly flagged.

  ---

  ### **Decision Procedure: Evaluating Moloch-Shaped Proposals**  
  *(Run in order; stop if any step returns "No" or "Handoff")*

  1. **Define the Race**  
     - **Question:** "What is the race, what happens if our side loses, and who specifically are the 'runners'?"  
     - **Sufficient Answer:** Clear description of:  
       - The prize (e.g., market dominance, regulatory control) or negative outcome (e.g., existential risk).  
       - The runners (named entities or well-defined groups).  
     - **Stop If:** Vague or undefined prize/runners → **Verdict: No.**  
     - *Judgment Call?* Minimal. Reject if ambiguous.

  2. **Map "The Others"**  
     - **Question:** "Are the 'others' in this race a closed set (known rivals), an open population (anyone can join), or future entrants (attracted by the race itself)?"  
     - **Sufficient Answer:** Explicit categorization with reasoning (e.g., "open population due to low entry barriers").  
     - **Stop If:** "Future entrants" likely AND proposal lacks mitigation for added runners → **Verdict: No** (funding may worsen the trap).  
     - *Judgment Call?* Low. Rely on proposal context.

  3. **Finishing Line Check**  
     - **Question:** "Is there a natural endpoint (e.g., standard adopted, regulation passed) or is this race indefinite?"  
     - **Sufficient Answer:** Evidence of endpoint (e.g., historical analog, technical milestone) OR explanation of perpetuity (e.g., recurring innovation cycles).  
     - **Stop If:** No endpoint AND costs escalate indefinitely → **Verdict: No** (perpetual races are resource sinks).  
     - *Judgment Call?* Moderate. Use field comparables (e.g., "standards races often end; arms races often don’t").

  4. **Trap Typology**  
     - **Question:** "Which dynamic best fits? (Select one with evidence):  
       - **Multipolar Trap:** Everyone defects due to mutual distrust.  
       - **Coordination Problem:** Focal solution exists (e.g., Schelling point).  
       - **Bargaining Problem:** Small set could negotiate.  
       - **Waiting Game:** All prefer someone else moves first.  
       - **Healthy Competition:** No trap; normal market/tech pressure."  
     - **Sufficient Answer:** Selection + 1–2 sentences justifying fit (e.g., "Bargaining: Three firms control 80% of the market").  
     - **Handoff If:** Officer cannot distinguish → **Delegate to board/director** (values-based prioritization).  
     - **Stop If:** "Healthy Competition" → **Verdict: No** (not a trap).  
     - *Judgment Call?* High. Use heuristics:  
       - *Multipolar Trap:* No one can credibly commit; mutual defection inevitable.  
       - *Coordination Problem:* Obvious equilibrium exists (e.g., everyone adopts a standard).  

  5. **Unilateral/Small-Group Exit**  
     - **Question:** "Is there a unilateral or small-coalition action to break the trap? (e.g., transparency pact, precommitment, open-sourcing)."  
     - **Sufficient Answer:** Identify action OR explain why none exists (e.g., "First-mover disadvantage too severe").  
     - **Stop If:** Action exists AND proposal ignores it → **Verdict: No** (proposal fails cost/benefit test).  
     - *Judgment Call?* Low. Focus on feasibility (e.g., "Three firms could form a consortium").  

  6. **Positional vs. Public Good**  
     - **Question:** "Is the prize positional (e.g., ranking, market share) or a public good? Who outside the race benefits/suffers if we fund this?"  
     - **Sufficient Answer:**  
       - Categorization (positional/public good).  
       - Externalities analysis (e.g., "Startups may suffer if we fund incumbents").  
     - **Stop If:** Purely positional AND no societal upside → **Verdict: No** (not public-interest aligned).  
     - *Judgment Call?* Moderate. Prioritize non-rival/non-excludable benefits.  

  7. **Red-Team Challenge**  
     - **Question:** "State the strongest case that this is NOT a trap: e.g., Is the fear overblown? Is the race net-beneficial? Could market forces resolve it?"  
     - **Sufficient Answer:** Paragraph-length counterargument.  
     - *Never a stop step.* Forces critical scrutiny.  

  8. **Verdict Synthesis**  
     - **Output:** One of:  
       - **Yes:** Unambiguous trap; intervention breaks/avoids it.  
       - **Conditional Yes:** Trap likely but requires modifications (e.g., "Fund only if grantees commit to coordination").  
       - **No:** Not a trap, or funding worsens it.  
       - **Handoff:** Values conflict or uncertainty (e.g., "Board must weigh short-term loss vs. long-term gain").  
     - **Requirement:** 2–3 sentences citing key steps (e.g., "Step 4: Multipolar trap; Step 5: No unilateral exit").  

  ---

  ### **Case Applications**  
  *Assumed proposal context: Each uses the "race" justification. Officer time: 35–40 mins/case.*

  #### **Case 1: "Responsible Deployment" Toolkit**  
  - **Step 1:** Race = "Race to deploy AI tools; losing = irreparable reputational/regulatory harm." Runners = "Firms in AI sector (e.g., OpenAI, Anthropic)." → **Sufficient.**  
  - **Step 2:** "Others" = Open population (any tech firm can join). Future entrants likely if toolkit funded. → **Stop? No mitigation → Conditional.**  
  - **Step 3:** Finishing line = "Regulatory standards expected in 2–3 years." → **Sufficient.**  
  - **Step 4:** **Coordination problem** (focal solution: toolkit as industry standard). → **Not a trap.**  
  - **Step 5:** Unilateral move = "Grantees can open-source toolkit to force adoption." → **Proposal viable without race rhetoric.**  
  - **Step 6:** Prize = Public good (safer AI benefits society). Externalities = "Startups benefit; no harmed parties."  
  - **Step 7 (Red Team):** "Market demand for responsible AI may organically incentivize toolkits; no race needed."  
  - **Verdict:** **Conditional Yes** (fund if toolkit is open-source to enable coordination).  
  - **Deciding Step:** Step 4 (coordination problem, not trap). Step 5 weakened urgency.  
  - **Limits:** Cannot prove if firms will adopt the toolkit, but Step 5 mitigates risk.  

  #### **Case 2: Public-Interest Alternative to Entrenched Infrastructure**  
  - **Step 1:** Race = "Race to replace legacy system (e.g., Google Authenticator); losing = continued centralization." Runners = "Our grantee vs. Big Tech incumbents." → **Sufficient.**  
  - **Step 2:** "Others" = Closed set (incumbents named). Future entrants unlikely (high barriers). → **Proceed.**  
  - **Step 3:** Finishing line = "Network effects lock-in; no endpoint unless critical mass achieved." → **Stop? Indefinite → No.**  
  - **Verdict:** **No.**  
  - **Deciding Step:** Step 3 (no endpoint; costs escalate).  
  - **Why Not a Trap?**  
    - Step 4: **Waiting game** (all users want replacement but wait for others to switch).  
    - Step 5: Unilateral move = "Grantee can target niche adopters (e.g., NGOs) to build critical mass." → Proposal ignores this.  
  - **Limits:** Step 3 flagged perpetuity risk, but officer judgment confirmed by Step 4 (no mutual defection).  

  #### **Case 3: Rapid-Response Legal Fund (8 Prior Grants)**  
  - **Step 1:** Race = "Race to set legal precedents in surveillance law; losing = erosion of privacy." Runners = "Our grantees (e.g., ACLU) vs. government/industry." → **Sufficient.**  
  - **Step 2:** "Others" = Open population (new litigants enter as funding increases). → **Stop? Future entrants likely; no mitigation → Conditional.**  
  - **Step 3:** Finishing line = "None (each case spawns appeals; no legislative fix)." → **Stop? No endpoint → No.**  
  - **Step 4:** **Multipolar trap** (government escalates suits if NGOs win; NGOs must counter-escalate).  
  - **Step 5:** Unilateral move = "None; defection (not fighting a case) risks precedent." → **Trap confirmed.**  
  - **Step 6:** Prize = Public good (civil liberties). Externalities = **"Foundation funding attracts more lawsuits, increasing costs."**  
  - **Step 7 (Red Team):** "Some cases are genuinely urgent; defunding may collapse the field."  
  - **Verdict:** **No.**  
  - **Deciding Step:** Step 6 (our funding fuels the race). Step 3 (no endpoint).  
  - **Limits:** Procedure detects foundation’s role in the trap (Step 6 externality). Officer must confront red-team argument (Step 7) but concludes: **Perpetual funding sustains the trap.**  

  ---

  ### **Key Insights**  
  - **Strengths:**  
    - Forces explicit categorization (Steps 2–4) to demystify "trap" claims.  
    - Step 6 exposes foundation complicity in traps (e.g., Case 3).  
    - Red-team step (Step 7) counters bias.  
  - **Limits:**  
    - Cannot *prove* "future entrants" (Step 2) but rejects proposals ignoring the risk.  
    - Step 4 (trap typology) is judgment-heavy but uses clear heuristics.  
    - **Blind Spot:** Struggles if the foundation is *inside* a trap and officers are incentivized to ignore it (e.g., Case 3 required Step 6 externality analysis). Mitigation: Rotate officers across projects.  
  - **Output:** Verdicts are auditable (e.g., board sees "Step 3: No endpoint → No"). Economists/trustees get structured logic.  

  This procedure shifts focus from reactive urgency to systemic analysis, reducing the risk of being "pulled along" by proposals. Officers can run it consistently within time constraints, and the board receives clear, evidence-based rationales.
