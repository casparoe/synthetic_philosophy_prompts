  Okay, the user is a third-year student in a population ethics seminar who needs to teach a 50-minute section on the repugnant conclusion. They specifically want to focus on the structure of the argument rather than just stating it, and they're looking for a fresh example beyond the standard small-happy vs large-mildly-happy population setup. 

  Hmm, the user seems quite prepared—they've already identified common misconceptions ("this only bothers utilitarians" and "it's just about adding happy people") and want to proactively address them. They're also thoughtful about pedagogy, asking how to sequence the explanation so the conclusion feels inevitable, not like a trick. The professor's fatigue with standard examples suggests this is a sophisticated group, so the approach needs rigor but also accessibility. 

  For the core example... The generation ship idea is promising because it creates a contained scenario where trade-offs feel visceral. Making the "barely-content" state involve "maintenance routines" instead of suffering avoids triggering hedonic objections, and framing it as descendants rather than abstract lives could heighten the unease. Need to ensure the welfare levels are clearly comparable though—maybe explicitly state all lives are net-positive. 

  The sequencing is crucial. Must establish the three premises (transitivity, dominance, continuity) as independently plausible before combining them. Transitivity first because it's least controversial, then dominance (which feels obvious), then continuity (the sneaky one). Only then apply them to the ship scenario. 

  Misconceptions to preempt: 
  - After introducing the premises, explicitly note that the argument applies to any theory valuing welfare aggregation (not just utilitarianism). 
  - When defining "barely-content," emphasize that the moral problem arises precisely because we're adding lives worth living—if they were miserable, it wouldn't be repugnant, just bad. 

  For the closing question... Something forcing them to articulate why the conclusion is troubling despite following logically. Maybe: "If we accept the premises, why might we still resist the conclusion—and what does that imply about the premises?" 

  What to omit: No need to dive into technical solutions (e.g., variable-value theories) or historical context. Avoid getting bogged down in defining "well-being." Keep the math minimal—no formulas, just intuitive comparisons. 

  ...Wait, should flag that the continuity premise is the most attackable. Students might spot that, so be ready to validate that skepticism while noting its cost: rejecting continuity forces alternative principles that may have their own paradoxes.
answer: |-
  Here’s a structured 50-minute lesson plan focused on **argument structure**, using a fresh example while preempting common misconceptions. Designed for clarity and inevitability, not trickery.

  ---

  ### **Total Time: 50 mins**  
  **Core Goal:** Show how the Repugnant Conclusion (RC) *logically follows* from plausible premises.  
  **Key Example:** **Generation Ship "Odyssey"** (avoids standard "happy vs. barely happy" framing).  

  ---

  ### **Lesson Flow**  
  **I. Framing the Problem (5 mins)**  
  - **Start with intuition:** *"Is a world full of people whose lives are just barely worth living better than a small, thriving utopia?"*  
  - **Clarify RC:** "The conclusion that a huge population with minimally positive lives is better than a small, very happy one *feels* repugnant—but we need to see *why* it might be logically unavoidable."  
  - **Today’s Aim:** "We’re dissecting the *argument structure* to see where the tension arises."  

  **II. The 3 Premises (20 mins)**  
  **Build these sequentially—each must feel independently reasonable:**  
  1. **Transitivity of Betterness (5 mins)**  
     - *Idea:* If A > B and B > C, then A > C.  
     - *Example:* "If New York is better to visit than Paris, and Paris is better than Oslo, then NYC > Oslo."  
     - **Why it’s plausible:** Basis of rational choice.  

  2. **Dominance (5 mins)**  
     - *Idea:* If population A has the same people as B, but everyone in A is better off, then A > B.  
     - *Example:* "Two identical ships: if Crew A has better food, healthcare, and leisure than Crew B, Ship A is better."  
     - **Why it’s plausible:** No downside to improving existing lives.  

  3. **Continuity (10 mins)**  
     - *Idea:* For any two outcomes A and Z (where A is better than Z), there’s some population size where adding lives *slightly worse* than A but *still worth living* makes the outcome better than Z.  
     - *Generation Ship "Odyssey" Example:*  
       - **Option A:** 200 crew members, thriving lives (10/10 welfare).  
       - **Option Z:** 200 crew, but a disaster reduces welfare to 1/10 (barely worth living).  
       - **Bridge Premise:** *"Could we add extra crew to Z—say, 300 more with lives at 2/10 welfare—making the total outcome better than Z?"* (Yes! They add net positive welfare.)  
       - **Continuity Applied:** We can repeat this, *gradually* lowering new crew’s welfare (1.9/10, 1.8/10...) while increasing their numbers, each step being *slightly better* than the last.  

  **III. The Logical Collapse (10 mins)**  
  - **Combine Premises:**  
    - Start with A (200 @ 10/10) vs. Z (200 @ 1/10). A > Z.  
    - By Continuity: There’s a population B (200 @ 10/10 + 300 @ 2/10) > Z.  
    - By Transitivity: A > B > Z.  
  - **Repeat:** Apply Continuity *again* to B vs. A. Now create C (500 @ 2/10 + 500 @ 1.5/10) > B.  
  - **End Result:** After many steps, we reach Ω: 1 billion+ people at 0.001/10 welfare *still better than A*.  
  - **"Repugnant Conclusion":** Ω seems intuitively worse than A, but logic says Ω > A.  

  **IV. Tackling Misconceptions (10 mins)**  
  1. **"This only bothers utilitarians!"**  
     - **When to address:** After presenting all premises.  
     - **Response:** "The premises don’t assume utilitarianism! Transitivity/Dominance are accepted in many theories. Continuity is hard to reject without arbitrariness. RC challenges *any* theory valuing total welfare."  

  2. **"It’s just about adding happy people!"**  
     - **When to address:** During Continuity discussion.  
     - **Response:** "The problem isn’t adding *happy* people—it’s that *even barely-positive lives* force us toward Ω. If added lives weren’t worth living, Dominance would block RC."  

  **V. Critical Question & Wrap-up (5 mins)**  
  - **Question to test understanding:**  
    > *"If we accept all three premises, does rejecting the Repugnant Conclusion mean we must reject one of them? Which one—and what’s the cost?"*  
    - **Goal:** Reveals that RC is a *structural problem*. Rejecting Continuity feels ad hoc; rejecting Transitivity or Dominance has bigger consequences.  

  ---

  ### **What to Omit**  
  - **Complex formalisms:** No need for utility functions or algebra. Keep it verbal/intuitive.  
  - **Alternative theories** (e.g., average utilitarianism, person-affecting views). Save for later discussions.  
  - **Historical deep dives** (Parfit’s original text, etc.). Focus on argument mechanics.  
  - **"Solutions" to RC:** This session is about diagnosing the problem, not resolving it.  

  ---

  ### **Why This Works**  
  - **The Ship Example:** Feels sci-fi fresh but mirrors real intergenerational trade-offs (e.g., resource allocation). "Barely-content descendants" (e.g., maintaining life support systems, no art/leisure) avoids trivializing minimal welfare.  
  - **Premise Sequencing:** Starts with uncontroversial principles (Transitivity/Dominance), then introduces Continuity as the "engine" of RC.  
  - **Misconceptions Addressed Proactively:** Embedded where they naturally arise.  

  **Pro Tip:** Draw the "Odyssey" progression on the board: A → B → C → ... → Ω with welfare/numbers dropping. Visual learners will grasp the slippery slope instantly. You’ve got this!
