  - Avoid the overused gavaya example for upamāna - need an original case
  - Use AI testimony for śabda debate
  - Buddhist must land real blows, not be a strawman
  - Concrete argumentation, not abstract pramāṇa counting
  - Genuine engagement with each other's points

  For upamāna, I'm considering a "dragonfruit" scenario where someone learns the word via analogy to a flame-throwing dragon. The Buddhist would argue this reduces to perception (seeing the fruit) + inference (connecting to prior verbal description). The Naiyayika must demonstrate unique epistemic gain - perhaps by showing how analogy creates new semantic associations beyond mere labeling.

  For śabda's AI challenge, the Buddhist would pounce on the absence of āpta requirements (knowledge/intention). The Naiyāyika might counter by reframing reliability in terms of system design rather than conscious intention, extending śabda to non-sentient sources. The chatbot's statistical patterns could be framed as "encoded intention" of its creators.

  User's clearly knowledgeable - they name-drop Dignāga/Dharmakīrti and want philosophical depth. Probably a grad student or prof preparing course material. Their frustration with superficial treatments suggests they'll appreciate nuanced positions where neither side "wins" cleanly.

  Biggest risks:
