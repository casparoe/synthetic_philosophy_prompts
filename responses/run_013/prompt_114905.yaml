  Below is the decision tree designed to guide students from the core assumptions of Harsanyi's aggregation theorem to various positions in distributive justice, emphasizing how the "impartial observer" premise bridges the gap to classical utilitarianism. The tree uses 12 nodes (including leaves) and incorporates a concrete case to ground abstract principles. Nodes are framed as questions answerable without prior knowledge of the positions.  

  ### Decision Tree: Navigating Harsanyi's Theorem and Beyond  

  1. **Start:** Do you accept all three of Harsanyi’s assumptions?  
     - **(a)** Individual preferences over lotteries are vNM-rational.  
     - **(b)** Social preferences over lotteries satisfy vNM axioms.  
     - **(c)** Social indifference if all individuals are indifferent (Pareto indifference).  
     - **Yes** → Node 2.  
     - **No** → Node 3.  

  2. **For "Yes" at Node 1:** Do you accept the "impartial observer" (veil of ignorance with equal probability) as a legitimate device to determine social weights?  
     - **Yes** → **Classical utilitarianism (leaf 1)**. *Justification: The impartial observer forces equal weights, summing utilities for maximum expected utility behind the veil.*  
     - **No** → Node 4.  

  3. **For "No" at Node 1:** Which assumption do you reject?  
     - **Reject (a)** → Node 5.  
     - **Reject (b)** → Node 6.  
     - **Reject (c)** → Node 7.  

  4. **For "No" at Node 2:** How should weights in the social weighted sum be assigned?  
     - **Weights must be equal** (e.g., moral equality) → **Classical utilitarianism (leaf 1)**. *Note: Same outcome as Node 2 "Yes," but without the impartial observer; weights are justified directly.*  
     - **Weights may differ** (e.g., prioritizing the worse-off) → **Weighted utilitarianism (leaf 2)**.  
     - **Weights are arbitrary/indeterminate** → **Deflationary position (leaf 7)**. *The theorem is a mathematical representation with no ethical content.*  

  5. **For "Reject (a)" at Node 3:** Can individual well-being be measured by a utility function at all?  
     - **Yes** → **Deflationary position (leaf 7)**. *vNM rationality is rejected, so the theorem doesn’t apply; well-being is measurable but not via preferences.*  
     - **No** → **Non-welfarist position (leaf 8)**. *Rejects utility aggregation; favors resources/capabilities.*  

  6. **For "Reject (b)" at Node 3:** Which social decision rule do you endorse?  
     - **Maximin or leximin** → **Rawlsian (leaf 5)**. *Prioritizes the worst-off without EU axioms.*  
     - **Prioritarianism** (transform utilities then sum) → Node 8.  

  7. **For "Reject (c)" at Node 3:** Consider a case: Two patients need a life-saving drug, but only one dose exists. A fair coin flip decides who gets it (Lottery A). An alternative lottery (Lottery B) uses a biased coin but, by chance, has identical 50% odds for each patient. All individuals are indifferent between A and B. Should society be indifferent?  
     - **Yes** → **Deflationary position (leaf 7)**. *Empty branch: Rejecting (c) but accepting indifference here is incoherent or unexplored (no clear position combines this).*  
     - **No** (society prefers fair Lottery A) → **Proceduralist (leaf 6)**. *Fairness matters beyond utility profiles.*  

  8. **For "Prioritarianism" at Node 6:** Apply the priority weighting to:  
     - **Ex ante utilities** (expected utilities pre-lottery) → **Ex ante prioritarianism (leaf 3)**.  
     - **Ex post utilities** (realized utilities post-lottery) → **Ex post prioritarianism (leaf 4)**. *Note: Violates (b) and is outside Harsanyi’s scope, as state-by-state weighting breaks vNM linearity.*  

  ---

  ### Notes on the Tree  
  - **Classical utilitarianism (leaf 1)** is reached via two paths (Nodes 2 and 4). These are distinct justifications (impartial observer vs. direct moral equality) but the same substantive position.  
  - **Deflationary (leaf 7)** is reached via four paths (Nodes 4, 5, 7). All share skepticism that Harsanyi’s assumptions imply ethics without extra premises.  
  - **Ex post prioritarianism (leaf 4)** is outside Harsanyi’s framework, as it violates (b) (Node 8 explicitly flags this).  
  - **Empty branch:** Node 7 → "Yes" (reject (c) but accept societal indifference in the drug case). This is **incoherent**—rejecting (c) requires rejecting societal indifference when individuals are indifferent, yet the answer contradicts that.  
  - **Weighted utilitarianism (leaf 2)** and **ex ante prioritarianism (leaf 3)** are separated: The former uses linear weights within Harsanyi; the latter transforms utilities non-linearly (rejecting (b)).  

  ---

  ### Final Commitment  
  The tree reveals that Harsanyi’s theorem alone is ethically inert: Without the impartial observer (Node 2), weights are arbitrary (Node 4), and rejecting core assumptions (Nodes 3–8) leads to divergent positions. A careful reader should end up at the **deflationary position (leaf 7)**. The theorem is a representation result, not a normative one; it only "does work" when paired with the impartial observer, which smuggles in egalitarianism. Rival positions (e.g., Rawlsian, proceduralist) arise from rejecting the axioms, but deflationism best captures the conditional nature students overlook.  

