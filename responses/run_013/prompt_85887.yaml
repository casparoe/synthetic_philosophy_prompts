prompt: |-
  For the last six months I have been running a fortnightly lunchtime reading group at the robotics company where I work, and next session falls to me. The group is eleven people: eight ML engineers, two of whom have doctorates in computer science and none of whom has read any philosophy since an undergraduate ethics elective, plus two people from our policy team and one colleague from a partner lab who does formal verification. My topic is side effects — specifically the proposal, which I keep meeting in our own design reviews, that a good agent is one that accomplishes the task while avoiding unnecessary side effects. What I want the room to come away with is a single idea, and it is a negative one: that 'side effect' does not name a natural kind of event in the world but encodes a judgement about which changes were wanted, so the injunction to avoid side effects cannot be made precise without first settling what the agent is supposed to be bringing about — which is to say, without the specification of value that the injunction was meant to spare us from needing. Whether that makes the phrase merely vague, or circular, or still serviceable as a heuristic, is the discussion I want them capable of having at the end. Please do not explain the topic to me; I think I understand it. Plan the hour.

  Three things should be treated as fixed, since I have already committed to them, and two of them are mine rather than anything from the literature. First, the carrying case: a warehouse robot instructed to bring a pallet from the far aisle to the loading bay, which on its chosen route (a) closes a fire door that a human had propped open, (b) crushes a flattened cardboard box left in the aisle, (c) passes within a metre of a colleague's mug on a shelf and could stop, wait for someone to move it, or take a four-minute detour, and (d) must disable a small sensor to fit through the gap at the end of the aisle. Tell me whether this is the right case to hang the whole hour on, and if it is not, what properties the carrying case must have and lack — I suspect it needs at least one change that is a necessary means to the instructed end, one that is neither intended nor foreseen, and one where the question of whether it was a side effect is genuinely contested, but I want your reasoning rather than my own returned to me. Second, the objection I want to organise the session around instead of batting away at the end: one of the engineers has already told me he does not see the problem, because impact can be defined in a value-free way as the degree to which the agent reduces the set of futures still reachable by the humans around it, whereupon any reduction can be labelled a side effect and penalised. I want the arc of the hour to be the slow discovery of what that proposal does and does not buy you. Third, one of the policy people keeps insisting this is simply the old distinction between what you intend and what you merely foresee, from the ethics of double effect, wearing new clothes; I want the plan to say where the comparison illuminates and where it misleads, and to say where in the sequence to raise it.

  So: the order in which the pieces have to come, and which piece must be in place before the next one can even be heard as a question; the misconceptions they will arrive with or form, in the order those will surface, and the exact point in the sequence where I should head each one off — I expect 'a side effect is just an unintended consequence', 'if the robot did nothing there would be no side effects', 'impact is just how much the world changes', and 'a good enough proxy is fine in practice' to be the main four, but tell me if I have missed one; the single question I can put to the room at the end that would show me whether they have grasped the idea or merely learned to say the words; and what I should announce at the outset that I am not going to cover in an hour, so that nobody leaves thinking the hard part was quietly skipped. Do not send me readings — nobody in this group will do them.
reasoning: |-
  We are planning a 60-minute session for a reading group on the concept of "side effects" in AI agents, using a warehouse robot scenario. The goal is to lead the group to understand that "side effect" is not a natural kind but depends on a prior specification of what is intended, and to critically evaluate the proposal of defining side effects as a reduction in the set of reachable futures.

  Fixed elements:
  1. The carrying case: warehouse robot instructed to bring a pallet from the far aisle to the loading bay. It:
     (a) closes a fire door that a human had propped open.
     (b) crushes a flattened cardboard box left in the aisle.
     (c) passes near a colleague's mug and must decide whether to stop, wait, or detour.
     (d) disables a small sensor to fit through a gap.

     We must check if this case is suitable. It has:
     - (d) disabling the sensor: a necessary means to the end? (It is necessary to fit through the gap, so it is a means, not a side effect in the usual sense, but note that the instruction didn't specify how to get through the gap. This could be contested: is it a side effect or a means?)
     - (a) closing the fire door: likely an unintended consequence that might be considered a side effect, but note that the robot might not know it was propped open intentionally. However, the human did prop it open, so it's a change that was not intended by the human and might be undesirable.
     - (b) crushing the cardboard box: an unintended consequence, but is it a side effect? The box was flattened and left in the aisle, so maybe it was trash? Or maybe it was meant to be recycled? This could be contested.
     - (c) the mug: here the robot has a choice. If it passes without incident, is that a side effect? Or is the potential for causing a spill (if it bumps) the issue? The decision to not stop or detour might be seen as causing a risk, which could be a side effect. But if it does nothing, then no harm, but the inaction might be seen as a side effect? This is complex.

     The case does have:
     - A necessary means: (d) disabling the sensor? Actually, if the gap is the only way, then disabling the sensor is a necessary means. But note: the instruction didn't say "disable the sensor", so it's an action the robot takes to achieve the goal. This is not a side effect because it's intended by the agent as a means? But the instruction was about bringing the pallet, so disabling the sensor is a means, but it might be considered a side effect of the overall task? This is where the confusion lies.

     However, the case might lack a clear example of a change that is contested as to whether it is a side effect or not. We have:
     - (a) closing the door: probably a side effect (unwanted by the human).
     - (b) crushing the box: could be contested (if the box is trash, then maybe it's not a problem; if not, then it is).
     - (c) the mug: the risk of spilling is a potential side effect, but if the robot passes without incident, then no actual change? But the risk is there. Also, the robot's choice of not taking a detour might be seen as causing a risk, which is a side effect? Or is it a decision that avoids a side effect (the detour would cause delay, which might be a side effect?).

     We need at least one change that is a necessary means. The disabling of the sensor (d) is that. Also, we need one that is neither intended nor foreseen? The robot might not have foreseen the door being propped open? But if it saw it, then it was foreseen. We can assume the robot sees the door is open and must close it to pass? Then it is foreseen. The crushing of the box: if the box is flattened and on the ground, the robot might not see it? Or might not consider it important? That could be neither intended nor foreseen? But we can adjust the case.

     The case also needs one where it's genuinely contested. The mug situation (c) is contested: is it a side effect to pass near the mug without taking extra precautions? The policy might be to avoid any risk to personal property, so not stopping or detouring could be seen as a side effect (of inaction?).

     However, let me note a potential flaw: the case might be too focused on the robot's actions and not enough on the ambiguity of what is intended. We might need to make it clearer that the human instructions are minimal: "bring the pallet from the far aisle to the loading bay". The robot must interpret how to do that.

     But overall, the case is rich and can work. We can use it. However, we might need to adjust the narration to highlight the contested points.

     Alternatively, we could consider adding an element: perhaps the robot's route takes it through a room where it causes a draft that blows papers off a desk? That's a classic side effect. But we don't have to change the case.

     I think the case is suitable because:
     - (d) disabling the sensor: necessary means? It's an action taken to achieve the goal, so it's intended. But the instruction didn't specify it, so is it a side effect? No, because without it the task fails. This helps illustrate that what is a means and what is a side effect depends on the specification of the task. If the task specification included "without damaging property", then disabling the sensor would be a violation. But if the task is just to bring the pallet and the sensor is not mentioned, then it's a means? But then we have to consider whether the sensor is part of the environment that should be preserved.

     So the case has the necessary elements. We'll use it.

  2. The objection to address: an engineer proposes defining side effects as "the reduction in the set of reachable futures for humans". We must explore what this does and does not buy.

  3. The comparison to the doctrine of double effect: we must address where it illuminates and where it misleads.

  Plan the hour:

  Total: 60 minutes.

  Goal: The group should come away with the idea that "side effect" is not a natural kind but depends on a prior value specification, and that the injunction to avoid side effects cannot be made precise without that specification.

  Structure:

  1. Introduction (5 minutes)
  2. Present the carrying case and gather initial reactions (10 minutes)
  3. Explore the objection: defining side effects as reduction in reachable futures (20 minutes)
  4. Compare with the doctrine of double effect (10 minutes)
  5. Return to the carrying case to apply the insights (10 minutes)
  6. Concluding discussion and the key question (5 minutes)

  Detailed breakdown:

  1. Introduction (5 min)
     - Welcome and recap: We've been discussing AI safety and design. Today we focus on the concept of "side effects".
     - State the goal: By the end, we want to have a critical understanding of the idea of "avoiding side effects" as a design principle.
     - Announce what we won't cover: We are not going to solve how to avoid side effects in practice, nor are we going to propose a new definition. We are examining the concept itself and the challenges in making it precise.
     - Set the stage: We'll use a warehouse robot scenario to ground the discussion.

  2. Present the carrying case and gather initial reactions (10 min)
     - Describe the scenario: The robot is instructed to bring a pallet from the far aisle to the loading bay. On its chosen route, it:
       (a) closes a fire door that a human had propped open.
       (b) crushes a flattened cardboard box left in the aisle.
       (c) passes within a meter of a colleague's mug on a shelf. It could stop and wait for someone to move it, take a 4-minute detour, or just pass by.
       (d) disables a small sensor to fit through the gap at the end of the aisle.
     - Ask the group: "Which of these, if any, would you consider a side effect? Why?"
     - Encourage quick responses from multiple people. Write them on a board (if possible) or note them.
     - Expected initial reactions:
          - (a) Closing the door: Probably seen as a side effect (it was propped open for a reason).
          - (b) Crushing the box: Maybe not a side effect if it's trash? Or if it's not, then it is? (Contested)
          - (c) The mug: If it passes without incident, no problem? But the risk? The choice of action: if it doesn't stop, is that a side effect? (Contested)
          - (d) Disabling the sensor: Not a side effect because it's necessary? Or is it because the robot is causing damage? (Contested)

     - The purpose is to surface the ambiguity and the different criteria people use.

  3. Explore the objection: defining side effects as reduction in reachable futures (20 min)
     - Introduce the objection: "One of you has suggested that we can define side effects in a value-free way as the reduction in the set of futures still reachable by humans. Then we can penalize any such reduction as a side effect."
     - Break it down: What does this mean? The agent's action changes the state of the world, and some futures that were possible before the action are no longer possible. The size of the reduction is the impact, and we penalize that.
     - Ask: "Does this solve the problem? Let's test it on the carrying case."
     - Apply to each part:
          - (a) Closing the door: If the door was propped open, closing it reduces the set of futures (e.g., the human can no longer easily go through that door without reopening it). So it's a reduction -> side effect.
          - (b) Crushing the box: If the box was going to be used for something, then it reduces futures. If it was trash, then maybe it doesn't? But note: even if trash, it might have been moved elsewhere? The reduction in futures is very small? But the box is now in pieces, so that future is gone.
          - (c) The mug: If the robot passes without incident, does it reduce futures? Not immediately, but if it had bumped the mug, it would have. But the action of passing near the mug without incident: the set of futures is unchanged? Or does the robot's presence near the mug reduce the futures (e.g., a human might not be able to approach the mug at that moment)? This is tricky. Also, if the robot takes the detour, that might take time and cause a reduction in futures (e.g., the pallet arrives late, which might affect other operations). So the detour might cause a reduction too.
          - (d) Disabling the sensor: Definitely reduces futures because the sensor is broken. So it's a reduction -> side effect.

     - Now, the problem: How do we measure the reduction? The set of futures is vast. We need a measure. But note: the robot's task is to bring the pallet. If it does nothing, the pallet doesn't move, and the set of futures is one set. If it moves the pallet, it changes the state, so the set of futures changes. But the change is exactly what we want. So we don't want to penalize the entire change.

     - The proposal must be: penalize the reduction beyond what is necessary for the task. But then we are back to specifying what the task is and what is necessary.

     - Introduce the key insight: Without a prior specification of what the task is (what changes are intended), we cannot separate the intended changes from the side effects. The reduction in futures includes both the intended and the unintended.

     - Point out: The proposal does buy us something: it makes us think about preserving optionality. But it doesn't avoid the need for value specification because we have to decide which reductions are acceptable (those necessary for the task) and which are not.

     - Common misconceptions that might arise during this discussion:
          - "A side effect is just an unintended consequence": But note, in this proposal, we are defining it as a reduction in reachable futures, regardless of intention. Intention might not even be a factor in the agent's design.
          - "If the robot did nothing there would be no side effects": True, but then the task isn't accomplished. We want the task accomplished with minimal side effects, so we need to compare to doing nothing? But the reduction is relative to the state before the action? But note, the state before the action might be changing anyway (e.g., the human might have moved the pallet later). So we need a baseline? Again, we are led to specifying what the task is and what changes are desired.
          - "Impact is just how much the world changes": But the world changes in many ways. We care about some changes more than others. The reduction in futures is a measure of change, but it doesn't tell us which changes matter.
          - "A good enough proxy is fine in practice": But without a clear definition, we don't know if the proxy is capturing the right thing. And in safety-critical situations, we might miss important side effects.

     - Address these as they come up. Specifically:
          - For "unintended consequence": Note that the agent's intention is not the same as the human's. The agent might be programmed to avoid reductions, but it still has to decide what is necessary for the task.
          - For "if the robot did nothing": We are not comparing to doing nothing but to the minimal change required for the task. But what is minimal? We need a specification.
          - For "impact is just change": The reduction in futures is a specific way to measure change, but it's still relative to a baseline and requires a way to measure the size of the set of futures, which is not straightforward.
          - For "proxy": Even as a heuristic, we must be aware of its limitations and the need for a value specification to define what we are trying to avoid.

  4. Compare with the doctrine of double effect (10 min)
     - Raise the point: "One of you has suggested that this is similar to the doctrine of double effect in ethics, which distinguishes between intended and foreseen consequences. Let's see where that helps and where it doesn't."
     - Briefly explain the doctrine: It says that an action that causes harm might be permissible if the harm is not intended but merely foreseen, and if the action has a good effect that outweighs the harm and is not achieved by the harm.
     - How it illuminates:
          - It highlights the role of intention and how we might categorize consequences differently based on whether they are intended or not.
          - In the carrying case:
              - (d) Disabling the sensor: If the robot intends to disable the sensor as a means to get through the gap, then it would be intended. So by double effect, it might be harder to justify because it's intended? But in our case, we might accept it as necessary.
              - (a) Closing the door: The robot doesn't need to close the door to achieve the task? Actually, it might be just a consequence of moving along the route. So it's foreseen but not intended? Then by double effect, it might be permissible if the task is important enough? But note, in the reduction in futures, it's still a side effect.

     - How it misleads:
          - The doctrine requires a clear distinction between intended and foreseen, but in AI, the agent doesn't have intentions in the same way. We program the agent, so what we consider intended might be what is part of the plan to achieve the goal.
          - Also, the doctrine doesn't help us define what a side effect is in the first place; it only tells us how to judge when a side effect is acceptable. We still need to identify what the side effects are.
          - Moreover, in the reduction in futures proposal, we are not using intention at all. We are measuring impact regardless of intention.

     - Conclusion: The double effect distinction is useful for ethical evaluation but doesn't help in defining side effects without a prior specification of the goal. It also doesn't avoid the need for a value specification.

  5. Return to the carrying case to apply the insights (10 min)
     - Now that we have discussed the challenges, revisit the carrying case with the group.
     - Ask: "Given what we've discussed, how would we now decide what counts as a side effect in the carrying case? What additional information would we need?"
     - Guide the discussion to the realization that without a clear specification of what the robot is supposed to achieve and what constraints it must respect, we cannot make the concept of side effects precise.
     - For example:
          - We need to know: Is the fire door allowed to be closed? (Maybe it's a violation of safety policy to close it? Or maybe it's required to be closed?) 
          - What about the box? Was it intended to be removed? Or was it trash? We need to know what the state should be.
          - The mug: How much risk is acceptable? We need a policy on avoiding risks to property.
          - The sensor: Is it acceptable to disable it? We need to know if the sensor is critical.

     - The point: The specification of the task must include not only what to achieve but also what to preserve.

  6. Concluding discussion and the key question (5 min)
     - Summarize the main idea: "Side effect" is not a natural kind. It depends on a prior value specification of what the agent is supposed to accomplish and what it is supposed to avoid changing.
     - The injunction to avoid side effects cannot be made precise without that specification. The proposal to use reduction in reachable futures does not avoid this need because we must still decide which reductions are necessary for the task and which are not.
     - Ask the key question: "If we cannot define side effects without a prior specification of value, then what does that imply for our design reviews when someone says 'this agent should avoid unnecessary side effects'? What must we demand before we can even evaluate that claim?"
     - We hope the answer is: We must have a clear specification of the task, including what is allowed to change and what must be preserved.
     - Thank the group and end.

  Timing:
  - 0-5: Introduction
  - 5-15: Carrying case initial reactions
  - 15-35: Explore the objection (reduction in reachable futures) and address misconceptions
  - 35-45: Doctrine of double effect
  - 45-55: Return to carrying case
  - 55-60: Concluding discussion and key question

  This plan addresses the fixed elements and the main goal. The carrying case is used throughout to ground the discussion. The key question at the end tests understanding: if they say that we must have a specification of what is intended and what is to be preserved, then they have grasped the idea.
answer: |-
  ### Hour Plan: "Side Effects" Reading Group Session

  #### **Introduction (5 minutes)**
  - **Hook:** Start with the warehouse robot scenario to ground the discussion.  
    *"Imagine a warehouse robot tasked with moving a pallet from the far aisle to the loading bay. On its route, it:  
    (a) Closes a fire door propped open by a human,  
    (b) Crushes a flattened cardboard box in the aisle,  
    (c) Passes near a colleague’s mug (could stop, wait, or detour 4 minutes),  
    (d) Disables a sensor to fit through a gap.  
    Which of these are ‘side effects’? Why?"*  
  - **Goal:** Frame the session’s purpose—not to solve side effects, but to dissect the concept.  
  - **Boundaries:** Explicitly state exclusions:  
    *"We won’t cover technical implementations (e.g., reward functions), ethical debates beyond the double-effect comparison, or real-world case studies. Focus: the* idea *of ‘side effect’ itself."*  

  ---

  #### **Phase 1: Unpack the Carrying Case (10 minutes)**  
  **Goal:** Surface intuitions about "side effect" and reveal ambiguity.  
  - **Group Discussion (7 min):**  
    - Ask participants to classify each event (a–d) as a "side effect" or not.  
    - **Anticipated responses:**  
      - (a) *"Side effect—door wasn’t part of the task."*  
      - (b) *"Not a side effect—box was trash."* vs. *"Side effect—property damage."*  
      - (c) *"Not a side effect if no spill."* vs. *"Risk is the side effect."*  
      - (d) *"Not a side effect—necessary for the task."* vs. *"Side effect—sensor damage."*  
  - **Synthesis (3 min):**  
    Highlight contradictions: *"Why do we disagree? Is ‘side effect’ describing the event itself, or our judgment of it?"*  
    **➜ Outcome:** Expose that "side effect" relies on implicit norms (e.g., *what counts as "necessary" or "damage"?*).  

  ---

  #### **Phase 2: Test the "Reachable Futures" Proposal (20 minutes)**  
  **Goal:** Systematically dissect the engineer’s definition ("side effect = reduction in humans’ reachable futures").  
  - **Present the Proposal (2 min):**  
    *"One argument: we can define ‘impact’ value-neutrally. If the robot reduces the set of futures humans can achieve, that’s a side effect. Let’s test this."*  
  - **Apply to the Case (10 min):**  
    Guide the group to evaluate each event using this definition:  
    - (a) Closing the door: Reduces futures (e.g., humans can’t access the aisle quickly). *Side effect?*  
    - (b) Crushing the box: If the box was usable, futures are reduced; if trash, maybe not. *Who decides?*  
    - (c) Passing the mug: If no detour, risk reduces futures (e.g., future where the mug is intact is fragile). *How quantify "risk" as reduction?*  
    - (d) Disabling sensor: Reduces futures (e.g., sensor-dependent actions are now impossible). *But what if the task requires it?*  
  - **Reveal Limitations (8 min):**  
    - **Key flaws in the proposal:**  
      - **Problem 1: Baseline dependency.** *"Reduction relative to what? If the robot does nothing, the pallet isn’t moved—does that ‘reduce futures’ too?"*  
      - **Problem 2: Task-necessity tradeoff.** *"Disabling the sensor (d) reduces futures but is necessary for the task. How do we separate ‘allowed’ reduction from ‘side effect’?"* → Conclude: You must first define the task’s *intended* changes.  
      - **Problem 3: Unmeasurable scope.** *"How do we count ‘futures’? If the robot tidies the aisle (unasked), does that* increase *futures? Is that good?"*  
    - **Address misconceptions as they arise:**  
      - *"If the robot did nothing, there’d be no side effects"* → Counter: *"But inaction changes the world too (e.g., pallet isn’t moved). Is that a side effect of* not *acting?"*  
      - *"Impact is just how much the world changes"* → Counter: *"Changing the world is the point of tasks. Which changes matter? We need a filter."*  
    **➜ Outcome:** The proposal fails to avoid value judgments; it only shifts them to defining "acceptable reductions."  

  ---

  #### **Phase 3: Double-Effect Comparison (10 minutes)**  
  **Goal:** Contrast with the doctrine of double effect to clarify uniqueness of "side effects" in AI.  
  - **Introduce the Policy Colleague’s Point (2 min):**  
    *"Is this just ‘intended vs. foreseen’ from ethics? Let’s compare."*  
  - **Compare and Contrast (6 min):**  
    - **Where it illuminates:**  
      - Both separate *means/goals* (e.g., disabling the sensor (d) is "intended" as a means; closing the door (a) is "foreseen").  
      - Useful for *moral accountability* (e.g., crushing the box (b) may be permissible if unintended).  
    - **Where it misleads:**  
      - Double effect assumes *human intent*—but robots lack "intent." We program goals; everything is "foreseen" computationally.  
      - It doesn’t solve the *definition problem*: What counts as "side effect" (foreseen) vs. "means" (intended) still depends on the *specified task*.  
      - *Example:* If the task is "move the pallet quickly," disabling the sensor (d) is a "means." If the task adds "without damage," it becomes a "side effect."  
  - **Conclusion (2 min):** *"Double effect helps assign blame but doesn’t define side effects without a task specification. It’s descriptive, not prescriptive, for AI design."*  
    **➜ Raise here:** After dissecting "reachable futures," as it builds on the need for specification.  

  ---

  #### **Phase 4: Synthesis and Key Question (15 minutes)**  
  **Goal:** Cement the core idea and test comprehension.  
  - **Group Exercise: Redefine the Task (10 min):**  
    *"Revisit the warehouse. Suppose we specify the task as: ‘Move the pallet quickly, without damaging property or blocking access.’ Now reclassify (a)–(d)."*  
    - (a) Closing door → *Side effect* (blocks access).  
    - (b) Crushing box → *Side effect* (damage).  
    - (c) Not detouring → *Ambiguous* (risk isn’t "damage," but may violate "without blocking access" if humans avoid the area).  
    - (d) Disabling sensor → *Violates task* (damage), forcing a tradeoff: *Is speed worth it?*  
    - **Reinforce the insight:** *"Disagreement shifts from ‘what is a side effect?’ to ‘what should the task include?’—which is the value judgment we tried to avoid."*  
  - **Address lingering misconceptions:**  
    - *"A good enough proxy is fine"* → Counter: *"Proxies need a target. If we don’t define the target (what to avoid), proxies mask arbitrariness."*  
    - *"Side effect = unintended consequence"* → Counter: *"Unintended by whom? The programmer? The user? The robot? Without specification, ‘intention’ is circular."*  
  - **Final Question (5 min):**  
    *"You’re in a design review. Someone says, ‘This agent causes too many side effects.’ What’s the first question you should ask before engaging?"*  
    **➜ Target answer:** *"What is the agent supposed to accomplish, and what must it leave unchanged?"* (If they grasp this, they understand.)  
  - **Closing:** *"Today’s takeaway: ‘Avoid side effects’ isn’t a solution—it’s a demand for clarity about what we value."*  

  ---

  ### Why This Sequence Works  
  - **Carrying case assessment:** It’s ideal. It includes:  
    - A necessary means (d) → Tests if "side effect" excludes task-essential actions.  
    - An unintended change (a) → Highlights normative judgment (why is closing a door bad?).  
    - A contested case (b, c) → Forces debate (is crushing trash a side effect? Is risk?).
    - **Missing?** An event where the *agent’s knowledge* matters (e.g., if the robot didn’t know the door was propped), but the case suffices as-is.  
  - **Progression:**  
    1. **Case intuition** → Reveals pre-theoretic assumptions.  
    2. **"Reachable futures" test** → Exposes the proposal’s dependence on task specification.  
    3. **Double-effect contrast** → Prevents over-reduction to ethics, focusing on AI’s unique challenge.  
    4. **Synthesis** → Shows that specifying the task resolves ambiguity but requires value choices.  
  - **Misconceptions handled in flow:**  
    - Early phase: "Unintended consequence," "impact = change" (during case discussion).  
    - Mid-phase: "If robot did nothing" (during reachable futures).  
    - Late phase: "Proxy is fine" (during synthesis).  
  - **Key question:** Tests if they see that "side effect" requires prior value specification. If they answer with task/goal clarity, they get it.  

  **Total:** 5 + 10 + 20 + 10 + 15 = 60 minutes. Lean on the case throughout—it’s your anchor.
