answer: |-
  This is a brilliantly observed analysis of a profound problem in causal reasoning, especially in counterfactual history and complex systems. You've identified the core tension: **the necessity or contingency of an event depends entirely on the arbitrary (and often unstated) choice of what variables are held fixed ("background conditions") and what is allowed to vary in the counterfactual scenario**. There isn't one universally accepted name for this *specific phenomenon*, but it sits at the intersection of several well-established concepts. Let's carve it properly.

  **The Core Phenomenon: Frame-Dependent Necessity (or Contextual Causality)**

  The essence is that **the causal status of an event (like Hitler's rise) is not absolute; it is relative to the chosen frame of reference defined by which background conditions are fixed.** The answer to "Was X necessary?" flips based on the "slice of reality" you decide is immutable for your counterfactual question.

  1.  **The Frame Defines Necessity:**
      *   **Frame A (Fixed: Deep Structures - Economy, Treaty, Weimar Instability):** In this frame, the deep conditions make *some form* of radical right-wing authoritarianism highly probable. Hitler, as an individual, becomes contingent – a replaceable actor filling a necessary role. He slides towards "incidental". (Your "rewind 30 years").
      *   **Frame B (Fixed: Immediate Circumstances - Jan 1933 political alignments, party structures, specific paramilitary strengths):** In this frame, Hitler's unique skills (oratory, demagoguery, maneuvering), personal relationships, and the specific cult of personality *are* essential to the Nazi Party seizing power *in that specific way at that specific moment*. Removing him causes the scenario to collapse. He becomes "necessary". (Your "rewind a week").
      *   **Frame C (Fixed: Hitler's psychology/charisma, but allowing economic conditions to vary):** This might be the inconsistent case you mention. Holding Hitler's *personality* fixed but imagining a different economic context asks a different question: "Could *this specific man* have risen under vastly different circumstances?" The answer might be "no," but this frame mixes levels arbitrarily and is often incoherent for answering the original historical question.

  **Nearest Established Notions & How They Differ:**

  1.  **Counterfactual Dependence (David Lewis):** This is the bedrock. Event B counterfactually depends on event A if: If A hadn't happened, B wouldn't have happened. The *problem* is defining the "closest possible world" where A doesn't happen. Your observation nails it: **The disagreement is fundamentally about *which* "closest possible world" is relevant or legitimate.** Is the closest world one where Hitler is quietly hit by a bus in 1933 (holding nearly everything else fixed), or one where he never existed (allowing longer-term social/political adaptations)?
  2.  **Ceteris Paribus Clauses:** This means "all other things being equal." Counterfactuals *always* rely on implicit or explicit ceteris paribus clauses. **The core problem you identify is that people *disagree wildly* and *inconsistently* about what "other things" *should* be held equal when removing or altering the focal cause.** What constitutes the legitimate "background"?
  3.  **Levels of Analysis (Micro/Macro):** This is the "Great Man vs. Structures" dichotomy you know. **Your phenomenon is the *interaction* between these levels when constructing counterfactuals.** When you fix the macro level (structures), the micro level (individuals) looks contingent. When you fix the immediate micro/meso level (specific actors, parties, events), the individual looks necessary. The inconsistency arises when people fix *some* macro factors (economy) but not others (political culture), creating an unstable hybrid frame.
  4.  **Overdetermination:** As you note, this is different. Overdetermination occurs when multiple *sufficient* causes exist independently (e.g., two bullets hitting the heart simultaneously). In your case, it's not about multiple sufficient causes existing simultaneously in the *actual* world, but about whether a *single* cause (Hitler) is *necessary* depending on the counterfactual frame. It's about the *variability of necessity* based on background assumptions.
  5.  **Path Dependence:** This describes how early events constrain later possibilities. It's related because the choice of how far to "rewind" changes the path. Rewinding 30 years resets the path more fundamentally than rewinding a week. **The necessity of a later event hinges on how much of the prior path you lock in.**
  6.  **Contingency vs. Necessity:** This is the outcome, not the mechanism. Your phenomenon *explains why* historians argue about contingency vs. necessity – because they are using different implicit frames to define the counterfactual.

  **Legitimate vs. Illegitimate Choices: Drawing the Line**

  There's no absolute rule, but legitimacy hinges on **coherence, justification, and purpose**:

  1.  **Coherence:** The frame should be internally consistent. Holding contradictory levels fixed is usually illegitimate (e.g., fixing Hitler's *specific psychology* while imagining a radically different Weimar Republic formed by different historical forces – those forces likely *would* have produced different individuals). Fixing factors that are deeply interconnected often creates incoherence.
  2.  **Justification:** The choice of what to hold fixed must be *explicitly stated and defended* based on historical evidence and the specific question being asked.
      *   **Legitimate:** "I want to understand if the Nazi seizure of power in Jan 1933 depended critically on Hitler's personal intervention in the negotiations. Therefore, I hold fixed the economic depression, the existing party structures, and the political alignments of Dec 1932, and remove Hitler." (Focuses on immediate mechanism).
      *   **Legitimate:** "I want to understand if the conditions of Weimar Germany made *some form* of violent, expansionist, racist dictatorship inevitable. Therefore, I imagine a world where the Treaty of Versailles was less harsh or the Depression milder, and ask if figures like Hitler still rise." (Focuses on structural forces).
      *   **Illegitimate (often):** Holding fixed factors that are *downstream consequences* of the cause you're removing. (e.g., "Remove Hitler in 1925 but hold fixed the existence of the fully formed Nazi Party with its cult of personality in 1932" – the party wouldn't exist *as it did* without him).
  3.  **Purpose/Question:** The frame must be appropriate for the question.
      *   Asking "Was Hitler necessary for WWII?" requires a very different frame (likely fixing more structural factors like German militarism, fascist ideology, expansionist aims) than "Was Hitler necessary for the Nazi Party to win 37% of the vote in July 1932?" (which might fix less).
  4.  **Plausibility of Variation:** Legitimate frames should allow variation in factors that *could* plausibly have been different within the chosen scope. Illegitimate frames often fix things that are logically tied to the variable or allow changes that are wildly implausible given the fixed background.

  **What to Call It?**

  Since a single perfect term is elusive, here are options, emphasizing different facets:

  1.  **Frame-Dependent Causality / Frame-Relative Necessity:** Captures the core idea that necessity is relative to the chosen analytical frame.
  2.  **Contextual Causality:** Highlights the dependence on the fixed background context.
  3.  **Modal Scope Problem (in Counterfactuals):** Focuses on the issue of defining the scope ("modal" refers to possibility/necessity) of the counterfactual world.
  4.  **The Background Fixity Problem:** Directly names the core methodological issue.
  5.  **The Counterfactual Frame Problem:** A concise label.

  **Your Coinage Suggestion:** **Ceteris Mutabilibus ("other things changeable")**

  This plays on *ceteris paribus* ("other things equal"). It explicitly names the dilemma: *Which* other things are we allowing to change when we alter the focal cause? The vagueness of "other things" (*ceteris*) and the inherent question of their mutability (*mutabilibus*) are the heart of the problem. It covers the core issue: the necessity of an event isn't fixed; it's determined by the (often arbitrary or unstated) decision about *which aspects of the context are held constant* and *which are allowed to vary* when imagining the alternative scenario. It applies perfectly to your historical and marital examples.

  **In Summary:**

  You've identified a fundamental issue in causal reasoning about complex, path-dependent systems: **The necessity or contingency of an event is not an inherent property; it is an artifact of the analytical frame defined by which background conditions are held fixed in the counterfactual scenario.** This leads to persistent disagreements because people argue using different, often unstated and inconsistent, frames. Legitimacy depends on coherence, justification, and relevance to the specific question. While related to counterfactual semantics, levels of analysis, and ceteris paribus clauses, the specific phenomenon of *necessity flipping based on arbitrary background fixity* deserves recognition. **Frame-Dependent Necessity** or **The Ceteris Mutabilibus Problem** aptly captures its essence.
