prompt: |-
  I'm a second-year PhD student in philosophy of science, and I keep getting hung up on a practice that seems totally mundane to physicists but philosophically wierd to me. In one seminar we spent a week on how conservation of energy, momentum, and angular momentum fall out of time and space translation symmetries, and everyone treated the symmetry principles as more fundamental than the conservation laws. But in another seminar, the same people talked about conservation of energy as a law of nature that constrains what can happen, and about symmetries as just features of the laws. I was talking with a friend in physics about this and she shrugged and said it's just a useful way to organize the math, which made me think the practice might be carrying a metaphysical commitment nobody is owning up to. I've also been reading a bit about the best-system account, where laws are the axioms of the simplest deductive system that entails all the regularities, and I can't tell if that view can even make sense of a conservation law that is derived from a symmetry rather than taken as basic.

  So what I want from you is a reconstruction of what this practice presupposes about the metaphysics of laws. Does treating symmetries as the source of conservation laws, while still calling the conservation laws laws, presuppose an anti-Humean governing view where laws are basic and symmetries are downstream? Does it presuppose a Humean or best-system view where laws are just systematizations and symmetries are constraints on the systematization? Or does it quietly presuppose that law is a functional kind that can be realized either way? Distinguish what the practice strictly requires from what it merely fits with, and say where it is underdetermined, so that several incompatible theories of law would license the same way of talking. Then tell me what would actually have to change in the practice if we adopted a straightforward Humean best-system view, or a straightforward anti-Humean governing view. I'm especially interested in the Noether's theorem angle: if conservation laws are theorems derived from symmetries, does that make them less lawlike for a Humean, or does it make symmetries the real laws? Please write in American English, and don't give me a reading list or citations, I'll handle that stuff later.
reasoning: |-
  Okay, let me try to unpack this philosophy of science question. The user is a PhD student in philosophy of science wrestling with how physicists treat symmetries versus conservation laws. They've noticed physicists sometimes present symmetries as fundamental (via Noether's theorem), and other times talk about conservation laws as constraining forces. Their physicist friend dismissed it as "just math organization," but the user suspects deeper metaphysical commitments. They're also thinking about how this fits with Humean best-system accounts versus anti-Humean governing views.

  Hmm, the core tension seems to be about what gets to be "fundamental" in the metaphysical sense. When physicists derive conservation laws from symmetries via Noether's theorem, that suggests symmetries are more basic. But then they'll turn around and say "energy conservation forbids perpetual motion machines" as if conservation is the bedrock principle. 

  I wonder if the user is particularly bothered by the apparent inconsistency because they're approaching it with a philosopher's need for coherent metaphysical grounding. Physicists might happily switch perspectives based on convenience, but for someone studying the foundations, that feels like intellectual cheating. The mention of best-system accounts suggests they're testing whether existing philosophical frameworks can make sense of this physics practice.

  The Noether's theorem angle is especially tricky. If conservation laws are theorems derived from symmetry premises, does that demote them from "law" status in a Humean system? Or does it promote symmetries to the real laws? But then why do physicists keep calling both "laws"? 

  I should probably start by separating what the practice strictly requires from what it's compatible with. The bare minimum seems to be: (1) symmetries imply conservation laws mathematically, (2) both are treated as universal constraints, and (3) physicists feel free to use either as starting points depending on context. That seems neutral between Humean and anti-Humean views. 

  For the best-system account specifically: if symmetries appear in the axioms and yield conservation laws as theorems, that might actually be more elegant than taking both as axioms. So a Humean could argue symmetries earn their place by simplifying the system. But then conservation laws would be derivative regularities - still lawlike in effect but not fundamental laws. 

  Whereas for a governing view, symmetries could be the transcendent constraints that actively enforce conservation. That seems cleaner metaphysically - one layer of governance instead of two. 

  The real headache comes when physicists treat conservation laws as unexplained primitives in some contexts. A strict governing view might demand symmetries always be prior, while Humeanism could tolerate pragmatic contextual switches. 

  I should also address what would change under different metaphysical commitments. If physicists were strict governing-view anti-Humeans, they might insist on always deriving conservation from symmetry. If they were radical Humeans, they might stop calling conservation laws "laws" when derived. But since they don't do either, the practice seems metaphysically flexible - or perhaps uncommitted.
answer: |-
  Here's a reconstruction of the metaphysical presuppositions, compatibilities, and tensions in this physics practice, focusing on your core concerns about laws, symmetries, and Noether's theorem:

  **What the Practice Strictly Requires:**

  1.  **Hierarchical Mathematical Relationship:** The practice requires accepting Noether's theorem as a *mathematical truth*: specific continuous global symmetries in the Lagrangian/Hamiltonian formalism logically entail corresponding conservation laws. Conservation laws are theorems, symmetries are the axioms *within this specific theoretical framework*.
  2.  **Universality & Constraint:** Both symmetries and conservation laws are treated as universal constraints applying to all physical processes within the domain of the relevant theory (e.g., classical mechanics, relativistic QFT).
  3.  **Contextual Primacy:** The practice requires the *flexibility* to treat *either* symmetries *or* conservation laws as the more explanatorily or pragmatically useful starting point *depending on the specific problem or context*.
  4.  **"Law" as a Functional Label:** The practice requires labeling *both* symmetries (like Lorentz invariance) *and* conservation laws (like energy conservation) as "laws of nature" or fundamental principles, regardless of the derivation hierarchy in Noether's theorem.

  **What it Presupposes (Minimally) & What it's Compatible With:**

  The practice *does not strictly require* a specific metaphysical view of laws. Instead, it presupposes a core feature that different metaphysical views can accommodate in different ways:

  *   **Presupposition:** There exists a fundamental, objective structure to nature (described by the Lagrangian/Hamiltonian and its symmetries) such that certain features (symmetries and conservation laws) are universally invariant and constraining, and are deeply interconnected mathematically (via Noether).
  *   **Compatibility:**
      *   **Anti-Humean (Governing):** Fits naturally. Symmetries (e.g., time-translation invariance) can be seen as the *fundamental governing principles* (the "real" laws). Conservation laws (energy conservation) are then necessary *consequences* imposed by these governing symmetries. The Lagrangian formalism encodes the governing dynamics, and symmetries are its fundamental properties.
      *   **Humean (Best-System - BSA):** Also compatible, though requires more careful articulation. The *entire package* (symmetries + conservation laws + their mathematical connection via Noether) constitutes the best systematization of the Humean mosaic. The symmetries earn their place as axioms in the best system *because* they are incredibly powerful and simple: a few symmetry principles (like Poincaré symmetry) generate *many* conservation laws (energy, momentum, angular momentum) and constrain the form of *all* dynamical laws. This simplicity and strength make symmetries excellent axioms for the best system. Conservation laws are crucial regularities systematized by these axioms.
      *   **"Functional Kind" View:** Highly compatible. "Law" refers to any universally constraining principle that plays a fundamental role in our best theories, regardless of whether it's axiomatic or derived *within that theory*. Both symmetries and conservation laws play this "law-job" of constraining possibilities and explaining phenomena, so both earn the label.

  **Where it's Underdetermined:**

  1.  **The Nature of "Fundamentality":** The practice doesn't specify *metaphysical* fundamentality. Is the symmetry ontologically prior, or is it just the most efficient axiomatic choice? Underdetermined.
  2.  **The Source of Constraint:** Does the constraint come from a governing relation (anti-Humean) or simply from being a cornerstone of the systematization describing the patterns (Humean)? Underdetermined by the practice alone.
  3.  **The Status of the Lagrangian Formalism:** Is this formalism just our best human description, or does it directly represent fundamental ontology? The practice uses it as a tool without committing metaphysically. Underdetermined.

  **Noether's Theorem and Humeanism (BSA):**

  This is the crux of your question. Does deriving conservation laws from symmetries make them less lawlike for a Humean?

  *   **Not Necessarily Less Lawlike:** For the BSA Humean, the *lawlikeness* of the conservation law isn't diminished by being derived. What matters is its role in the *system*. The energy conservation *regularity* is a massive, pervasive feature of the Humean mosaic. The fact that the best system *derives* this regularity from a symmetry principle + dynamics doesn't make the regularity any less real or constraining. It remains a crucial part of the pattern systematized.
  *   **But It Affects *Fundamentality* within the System:** Within the *best system itself*, the symmetries are the more fundamental *axioms*. The conservation laws are *theorems* of that system. So, for the Humean, symmetries are likely the *more basic laws* in the systematization, precisely *because* they generate the conservation laws (and more) so efficiently. Calling conservation laws "laws" reflects their universal constraining role in the mosaic, not necessarily their axiomatic status in the best system.
  *   **Symmetries as the "Real" Laws (Humean sense):** Yes, for the BSA Humean evaluating the *system*, symmetries are the prime candidates for the *axioms* – the most fundamental laws *in the system* – because of their strength and simplicity. The conservation laws are immensely important, but derived, regularities.

  **What Would Change Under Different Metaphysical Commitments?**

  1.  **Straightforward Governing (Anti-Humean) View:**
      *   **Potential Change in Emphasis:** There might be a stronger *insistence* on always treating the symmetries as ontologically prior and the *true* sources of governance. Deriving conservation from symmetry isn't just math; it's revealing the causal/metaphysical structure. Appeals to conservation laws as unexplained constraints might be seen as incomplete.
      *   **Less Tolerance for Contextual Primacy:** While still useful pragmatically, treating a conservation law as fundamental in explanation when a symmetry is known might feel like obscuring the true metaphysical fundamentality. The governing view provides a clear metaphysical reason *why* Noether's theorem holds: symmetries govern.
      *   **Status Quo?** Many physicists lean this way intuitively. The practice might change very little *externally*, but the *internal justification* for why symmetries are fundamental would be explicit: they are the active governing principles.

  2.  **Straightforward Best-System (Humean) View:**
      *   **Reframing "Source":** The language of symmetries being the "source" or "reason" for conservation laws would be understood as *within the best system*. It's about deductive structure and systematization efficiency, not ontological grounding or governance.
      *   **Demoting (Slightly) Conservation Law Fundamentality *in Theory*:** While still universally constraining patterns, conservation laws wouldn't be candidates for the *most fundamental axioms* of the best system if derived from symmetries. They are crucial theorems/regularities.
      *   **Challenge: Unexplained Symmetries?** The biggest potential change comes if physicists treat symmetries themselves as brute, unexplained primitives. The Humean must argue this is the simplest way to systematize the mosaic. If a physicist says "The symmetry *makes* the conservation law hold," the Humean translates this as "The symmetry axiom in our best system entails the conservation law theorem."
      *   **Status Quo?** Externally, practice might look identical. The physicist uses the math the same way. The difference is in the *metaphysical interpretation* of what the math represents – patterns vs governance. The contextual primacy fits Humeanism well: we use whichever starting point systematizes the local phenomena most efficiently.

  **Conclusion:**

  The physics practice is **metaphysically flexible**. It *fits* both major views but is *strictly underdetermined* by them. The core presupposition is the objective reality of the interconnected structure described by the formalism (symmetries + conservation laws via Noether). 

  *   **Anti-Humean (Governing):** Sees Noether's theorem as revealing ontological priority: symmetries govern, conservation laws are consequences. Fits the "symmetry-first" talk naturally.
  *   **Humean (BSA):** Sees Noether's theorem as showcasing systematization efficiency: symmetries are powerful axioms, conservation laws are crucial derived regularities. Justifies calling both "laws" due to their constraining roles. Explains contextual primacy pragmatically.
  *   **Functional Kind View:** Explains why *both* are called "laws" regardless of derivation: they both play the law-job.

  The practice wouldn't radically change under either metaphysical view because it's anchored in the successful mathematics and predictive power of the formalism. The differences would be in the *interpretation* of fundamentality and the justification for why the mathematical relationships hold. The physicist's shrug ("useful way to organize the math") leans Humean/pragmatic, while the intuitive sense of symmetries "constraining reality" leans Anti-Humean. The practice comfortably accommodates both intuitions without forcing a final metaphysical commitment.
