     - In the debrief, explain that in theory, with high enough continuation probability and sufficient growth, cooperation can be rational for a few steps.

  **The gap:**
  - The activity with sweets cannot reproduce the full regress of reasoning about rationality because the students might not truly believe that their partner is rational and will do the backward induction. In Part 1, if one student believes the other is "nice", they might pass. This breaks the common knowledge of rationality. You will have to supply the assumption of common knowledge of rationality in the debrief, and explain that in the theory, we assume it.

