prompt: |-
  I'm midway through a doctoral seminar on population ethics, and I have grown tired of adjudicating between theories by trading intuitions about one imagined world at a time. Before I judge any of the contenders, I want the specification: write me the desiderata, i.e. the full list of requirements that any adequate axiology of variable populations must satisfy — a theory whose purpose is to rank outcomes in which the number, identity, and quality of lives differ. For each requirement, give me the case or consideration that motivates it, stated concretely enough that I can see exactly which pair of outcomes it is supposed to rule on and what work it is doing; mark where one requirement is really a special case of another, where one is stronger than it needs to be, and where two are pulling in opposite directions. I also want the list sorted, not merely enumerated: which of these are genuine constraints on any such theory, and which are the commitments of one camp dressed up as adequacy conditions. I have my suspicions — that the demand for a person-affecting structure, the demand for a thoroughly impersonal one, and the demand that a larger population never by itself count against an outcome are all candidates for the second category — but I would rather you decide which is which than take my word for it. For what it is worth, a friend in the program argued last week that the repugnant conclusion only looks repugnant because we compare a vast mediocre population with a small flourishing one from the standpoint of someone choosing which life to live, and that comparing the outcomes from the standpoint of each person in them would dissolve the repugnance; I do not know whether to believe this, and I would like the desiderata written so that the answer to that question is visible in them.

  The part I care about most: I suspect that several of these requirements cannot be satisfied together, and I want you to identify the subsets that are jointly unsatisfiable, with the argument that shows it set out in your own terms rather than by gesturing at the literature. The tension I have seen hinted at involves three things at once — the avoidance of the repugnant conclusion, the thought that adding a life that is worth living is never in itself a bad thing, and the thought that an outcome of uniform misery is not to be preferred to an outcome of uniform flourishing with the same number of people — and I want to know whether these really are inconsistent, what a proof of that would look like, and which of the three has to give. Close with a short ranking of which single requirement excludes the most otherwise attractive theories, and a sentence of justification for your choice. Two constraints on how you write it. First, assume I know the standard positions by name and do not need them introduced or attributed, and do not give me a bibliography or reading list; I will supply the references myself, and an argument that leans on who said what is useless to me here. Second, build in rather than bolt on the fact that the theory is meant for sentient beings generally and not for humans alone: the great majority of sentient lives are short, non-human, and without anything like a life plan, so every requirement on your list has to be phrased in a way that survives that, and you should flag any requirement that quietly presupposes a human-shaped biography.
reasoning: |-
  We are designing desiderata for an axiology of variable populations. The theory must rank outcomes that differ in the number, identity, and quality of lives. We aim for a list that is both comprehensive and critical, marking dependencies, strengths, and tensions. We also note that the theory applies to sentient beings generally, so we avoid anthropocentric assumptions.

  We begin by listing the desiderata, each with a motivating case. Then we sort them into genuine constraints vs. camp commitments. Finally, we identify inconsistent sets and rank the requirements by their exclusionary power.

  ## Desiderata

  1. **Non-anti-egalitarianism (Weak Pareto for Quality)**: 
     - *Motivation*: If every individual in a population has a higher quality of life in outcome A than in outcome B, and the populations are the same, then A is better than B. 
     - *Case*: Compare two outcomes with the same set of individuals. In A, every individual has a well-being level of 10. In B, every individual has a well-being level of 5. A is better than B. This is unobjectionable and does not require interpersonal comparisons beyond ordinal ranking.

  2. **Impartiality (Anonymity)**:
     - *Motivation*: The value of an outcome should not depend on the identity of the individuals, only on their well-being levels.
     - *Case*: Consider two outcomes with the same population size: in A, person X has 10 and Y has 5; in B, X has 5 and Y has 10. A and B are equally good.

  3. **Independence of Irrelevant Alternatives (for fixed population)**:
     - *Motivation*: The ranking of two outcomes should depend only on the well-being of individuals who exist in both outcomes. (This is a standard condition in social choice for fixed populations, but we must be cautious when populations vary.)
     - *Case*: For a fixed set of individuals, if we are comparing two outcomes A and B, and a third outcome C exists, the ranking of A and B should not depend on the well-being levels in C.

  4. **Existence of Critical Level (for population expansion)**:
     - *Motivation*: There should be a positive well-being level (the critical level) such that adding a life above that level improves the outcome, and adding a life below that level (even if positive) worsens it. This avoids the Repugnant Conclusion (RC) by requiring that added lives must be above a threshold to be beneficial.
     - *Case*: If we have a population of 10 billion with very high well-being (say 100), we don't want to say that a population of 20 billion with well-being just above zero is better. The critical level might be set at, say, 10.

  5. **Asymmetry of Addition (Non-Repugnance)**:
     - *Motivation*: Avoid the Repugnant Conclusion: A very large population with lives barely worth living should not be considered better than a small population with very high well-being.
     - *Case*: Compare A: 10 billion people at well-being 100. Z: 10^20 people at well-being 0.1 (assuming 0 is neutral). We require that A is better than Z.

  6. **Non-sadism (for adding lives)**:
     - *Motivation*: Adding a life with positive well-being should not make the outcome worse, provided the well-being of others is unchanged. (This is a weaker form of the Mere Addition principle.)
     - *Case*: Consider two outcomes: A: a population of n individuals all at well-being 10. B: the same n individuals at well-being 10, plus one additional individual at well-being 1 (a life worth living). Then B is at least as good as A.

  7. **Negative Mere Addition (Avoidance of Sadism)**:
     - *Motivation*: Adding a life with negative well-being (a life not worth living) should not make the outcome better, provided the well-being of others is unchanged.
     - *Case*: A: n individuals at 10. C: n individuals at 10, plus one at -5 (a life of suffering). Then C is worse than A.

  8. **Continuity**:
     - *Motivation*: Small changes in well-being should not lead to large changes in the ranking of outcomes. This ensures that the axiology is not overly sensitive.
     - *Case*: If A is better than B, and B is better than C, then there should be a small perturbation of the well-being levels in A that leaves it still better than B, and similarly for B and C.

  9. **Avoidance of the Very Repugnant Conclusion**:
     - *Motivation*: A series of population expansions that each seem acceptable should not lead to an outcome that is clearly worse than the starting point. (This is a strengthening of the avoidance of RC.)
     - *Case*: Starting with A (small, high well-being), we add lives above the critical level to get to B (larger, high but slightly lower average). Then we do this repeatedly until we get to Z (huge population, low positive well-being). We want to avoid having to say Z is better than A.

  10. **Person-Affecting Restriction (in some form)**:
      - *Motivation*: An outcome can only be better or worse if it is better or worse for someone. This is often stated as: if no one exists in both outcomes, then the outcomes are incomparable or equally good. But note: this is a camp commitment, not a universal constraint.
      - *Case*: Compare A: a world with no one. B: a world with one person at well-being 10. If we hold that B is better than A, then we are violating the strong person-affecting view because there is no one for whom B is better (since the person in B does not exist in A). But note: we might reject this by saying that the person in B has a life worth living and that makes B better.

  11. **Non-anti-natalism (for lives worth living)**:
      - *Motivation*: Creating a life that is worth living is not in itself a bad thing (though it might not be required). This is the opposite of anti-natalism.
      - *Case*: Compare a world with no one (A) and a world with one person at well-being 10 (B). B should be at least as good as A.

  12. **Transitivity**:
      - *Motivation*: If A is better than B and B is better than C, then A must be better than C. Without this, the ranking is not coherent.

  13. **Completeness**:
      - *Motivation*: For any two outcomes, one is better than the other, or they are equally good. This is often relaxed in population ethics, but without it, we cannot always choose.

  14. **Avoidance of the Mere Addition Paradox**:
      - *Motivation*: Adding a group of lives worth living should not lead to a situation that is worse than the original. The paradox arises when we have:
        - A: a population with high average well-being.
        - A+: A plus a group with positive but lower well-being (so average drops).
        - B: a population with the same total as A+ but with everyone at a level between the two groups in A+.
        The paradox: if A+ is not worse than A (by mere addition), and B is better than A+ (by equality), then B is better than A. But if we started with a high level in A, B might be a large population at a mediocre level, which we might not want to be better than A.
      - *Case*: A: 10 people at 100. A+: 10 at 100 and 10 at 50. B: 20 at 75. We want to avoid being forced to say B is better than A.

  15. **Sensitivity to Quality (Avoidance of the Reverse Repugnant Conclusion)**:
      - *Motivation*: We do not want a theory that prefers a small population with very low positive well-being over a large population with high well-being. This is the opposite of the RC.
      - *Case*: Compare A: 1 person at 0.1. B: 1 million people at 100. We require B is better than A.

  ## Sorting: Genuine Constraints vs. Camp Commitments

  ### Genuine Constraints (minimal conditions for adequacy)
  - **Non-anti-egalitarianism (1)**: If a theory violates this, it would allow that making everyone worse off is better. This is unacceptable.
  - **Impartiality (2)**: Without anonymity, we are not doing ethics but personal favoritism.
  - **Negative Mere Addition (7)**: Adding suffering should not be good. This is a minimal non-sadism condition.
  - **Transitivity (12)**: Without transitivity, we cannot have a coherent ordering.
  - **Sensitivity to Quality (15)**: If we don't require this, we get a theory that is indifferent to quality in an absurd way.

  ### Camp Commitments (positions that reflect a particular ethical stance)
  - **Existence of Critical Level (4)**: This is a feature of critical-level utilitarianism. Total utilitarians reject it (they set critical level at zero).
  - **Asymmetry of Addition (Avoidance of RC) (5)**: This is a commitment of those who find RC repugnant. But note: total utilitarians accept RC and don't see it as repugnant.
  - **Non-sadism (6)**: This is a feature of theories that accept the mere addition principle. However, average utilitarians might reject it: adding a life with positive well-being that is below the average lowers the average and might make the outcome worse.
  - **Avoidance of the Very Repugnant Conclusion (9)**: This is a strengthening of (5) and is not universally accepted.
  - **Person-Affecting Restriction (10)**: This is a hallmark of person-affecting views. Impersonal views reject it.
  - **Non-anti-natalism (11)**: Anti-natalists would reject this. But note: if we reject (11), then we might say that adding a life worth living is bad. This is a camp commitment because it is controversial.
  - **Completeness (13)**: Some theories (e.g., Parfit's) allow for incommensurability. So this is a commitment of those who want a complete ordering.
  - **Avoidance of the Mere Addition Paradox (14)**: This is a feature of some egalitarian theories. Total utilitarians do not have this paradox because they would say A+ is better than A (by the sum of the added lives) and B is better than A+ (because 20*75 > 10*100+10*50 = 1000+500=1500? Actually 20*75=1500, so equal? Then they would say A+ and B are equal). So they avoid the paradox by not having a strict improvement.

  ## Tensions and Inconsistencies

  The main tension you mentioned involves three requirements:

     (i) Avoidance of the Repugnant Conclusion (RC) [our desideratum 5]
     (ii) Non-sadism (adding a life worth living is not bad) [desideratum 6]
     (iii) Non-anti-egalitarianism (if everyone is better off, the outcome is better) [desideratum 1] and a form of continuity [desideratum 8] and transitivity [desideratum 12].

  But note: the third requirement in your note is: "an outcome of uniform misery is not to be preferred to an outcome of uniform flourishing with the same number of people". This is covered by desideratum 1 and 15 (sensitivity to quality). However, the tension is usually demonstrated with variable populations.

  We will show that the following three cannot hold simultaneously:

     A. Avoidance of RC: There exists a high well-being outcome A (with population n) and a very large population outcome Z (with population m, m>>n) with low positive well-being such that A is better than Z.
     B. Non-sadism: Adding a life worth living (with positive well-being) to a population without affecting others is not bad (so the new outcome is at least as good as the original).
     C. Continuity and transitivity (and the fixed population Pareto).

  The argument:

     Step 1: Start with A: n people at well-being α (high).
     Step 2: By non-sadism, adding a single person at a positive well-being ε (very low) gives A+ which is at least as good as A.
     Step 3: Now, consider a sequence of outcomes where we gradually reduce the well-being of the original n people and the added group (if we add more) in small steps, but always above ε, and at each step we add more people. We can arrange a sequence:

          A0 = A
          A1 = A plus one person at ε
          A2 = (n+1) people at ε + δ (where δ is a small positive number, so slightly above ε) plus one more person at ε? 

     Actually, the standard way is to use a sequence of populations that are increasingly large and with well-being decreasing to ε.

     We can construct a sequence:

          A0: n at α
          A1: n at α1 and 1 at ε, where α1 is slightly less than α (but still high) and ε is low but positive. By non-sadism, A1 is at least as good as A0? Not exactly: non-sadism only says that if we add a person without changing others, then it's not worse. But here we are also reducing the well-being of the original n.

     Alternatively, we can use:

          A0: n at α
          A1: n at α and 1 at ε (so by non-sadism, A1 is at least as good as A0)
          A2: n at α - δ and 1 at ε - but this might not be comparable.

     The standard argument (due to Arrhenius) is more complex. We present a simplified version.

     Consider:

          A: n people at level α.
          B: n people at level β (where β is between α and ε) and m people at level ε (with m very large, so that total well-being in B is nβ + mε, which by total utilitarianism would be large if m is huge).

     But we don't want to assume total utilitarianism.

     Instead, we use:

          Step 1: A is better than Z (by avoiding RC) where Z has a huge population at ε.
          Step 2: We can create a chain from A to Z by a series of steps:

              - Start with A: n at α.
              - Add one person at ε to get A1. By non-sadism, A1 is not worse than A.
              - Then, consider A2: n at α' (slightly less than α) and 1 at ε. By continuity and the fixed population Pareto, if α' is close to α, then A2 is still better than A1? Not necessarily: we are reducing the well-being of n people and keeping the one at ε. Without knowing the trade-off, we cannot say.

     The tension becomes clearer if we add a third condition: 

          D. Quality of life matters: If we have two outcomes with the same population size, the one with higher average (or higher total) is better.

     But note: we have non-anti-egalitarianism (desideratum 1) which is Pareto: if everyone is better off, then the outcome is better. But if we have different populations, we need more.

     The real inconsistency is between:

          (i) Avoidance of RC (A better than Z)
          (ii) Non-sadism (for adding lives)
          (iii) A principle of weak inequality aversion (or a principle that if we have a population split into two groups, we can improve the outcome by redistributing well-being from the better-off to the worse-off, even if we lower the total a bit) and transitivity.

     But the classic proof is:

          Let A be a population of n people at level α.
          Let B be a population of n people at level β and m people at level γ, where β and γ are chosen appropriately.

     We can use:

          A: n at 10
          Z: huge population at 0.1

          We want A > Z.

          Now, consider:

            A+: n at 10 and one person at 1 (a life worth living). By non-sadism, A+ is not worse than A.

            Now, we can create an outcome B: n at 9.9 and one person at 1.1. By the Pareto principle for the n (if we consider that 9.9<10, then we cannot say B is better than A+). But note: the n people are worse off in B than in A+. So we cannot use Pareto to say B is better.

          Instead, we use a different step. Consider:

            C: n at 10 and k people at 1. By repeated application of non-sadism, C is not worse than A.

            Now, let D: n at 9.9 and k people at 1.1. If we think that the improvement for the k people (from 1 to 1.1) outweighs the slight drop for the n (from 10 to 9.9), then we might say D is better than C. But this requires a specific weighing.

     The Arrhenius impossibility theorem shows that no population axiology can satisfy a set of conditions that include:

          - The strong quality condition (avoiding RC) 
          - The mere addition principle (non-sadism)
          - The non-extreme priority condition (which says that for any loss in well-being of the best off, we can compensate by a sufficient gain in the number of worst off, provided the worst off are not too badly off and the loss is small)
          - Transitivity and continuity.

     However, we can see a direct tension in the following three:

          1. Avoidance of RC: A > Z.
          2. Non-sadism: For any outcome X, adding a person with positive well-being (without affecting others) gives X+ which is not worse than X.
          3. Transitivity and the existence of a sequence from A to Z by a series of steps that each seem non-worsening.

     Specifically, we can build a chain:

          A = A0
          A1 = A0 plus one person at ε (so A1 is not worse than A0)
          A2 = A1 plus one person at ε (so A2 is not worse than A1)
          ... 
          A_m = A0 plus m persons at ε.

          But A_m is exactly Z (if m is the huge number). Then by transitivity, Z is not worse than A. But we require A > Z, which is a contradiction.

     Therefore, we must give up one of:

          - Avoidance of RC (so accept RC: Z is better than A)
          - Non-sadism (so adding a life worth living can be bad)
          - Transitivity (so the chain breaks)

     This is the core inconsistency.

     However, note that non-sadism only says that adding one life at ε is not bad. But if we do it m times, we get Z. And transitivity forces Z to be at least as good as A. But avoidance of RC says A is better than Z. Contradiction.

     Therefore, the three are inconsistent. One must go.

     Which one? 

          - If we give up avoidance of RC, we become total utilitarians (or similar) and accept the repugnant conclusion.
          - If we give up non-sadism, we might become average utilitarians or critical-level utilitarians (which allow that adding a life below the critical level is bad, even if positive).
          - If we give up transitivity, we might have a non-transitive betterness relation (but this is very problematic for decision making).

  ## Ranking of Requirements by Exclusionary Power

  The requirement that excludes the most otherwise attractive theories is:

     **Avoidance of the Repugnant Conclusion (desideratum 5)**.

  Justification:

     - Total utilitarianism is a very attractive theory for its simplicity and avoidance of the Mere Addition Paradox (because it endorses mere addition). But it implies the Repugnant Conclusion. So requiring avoidance of RC rules out total utilitarianism.
     - Critical-level utilitarianism (with a positive critical level) avoids RC, but it violates non-sadism: adding a life worth living but below the critical level makes things worse. So it is ruled out by non-sadism? But non-sadism is also a requirement that many find compelling. However, without avoidance of RC, we don't have to violate non-sadism (as total utilitarianism doesn't). But avoidance of RC forces us to abandon either non-sadism or transitivity. Hence, avoidance of RC is the requirement that forces the most severe compromises.

     Additionally, average utilitarianism is ruled out by non-sadism (because adding a life below average can make things worse) and also by the Mere Addition Paradox. But note: average utilitarianism avoids RC. However, it fails non-sadism and also leads to the Sadistic Conclusion (it can prefer adding lives with negative well-being if they are above the average, which might be negative).

     Therefore, avoidance of RC is the requirement that is most responsible for the impossibility results and thus excludes many theories.

  ## Final Note on Your Friend's Argument

  Your friend suggested that the repugnant conclusion is not repugnant when we compare from the standpoint of each person. However, note that in the repugnant conclusion, we are comparing two outcomes: one with a small number of very happy people and one with a huge number of barely happy people. From the standpoint of someone in the small population, they would not want to switch to the huge population because they would be barely happy. But from the standpoint of someone in the huge population, they are happy to exist (their life is worth living). So if we are choosing which world to create, and we don't exist yet, then the total utilitarian says we should choose the huge population because it has more total happiness. The repugnance comes from the intuition that the quality of life in the small population is so high that it outweighs the quantity in the large one. 

  The desiderata above show that avoiding RC is in tension with other plausible principles. The argument of your friend does not dissolve the tension because the tension is logical: we cannot have all the desiderata at once. Therefore, we must give up one. The friend's argument might be seen as a defense of total utilitarianism (i.e., giving up avoidance of RC).

  ## Summary of Desiderata with Sentience in Mind

  We have phrased the desiderata in terms of well-being levels, which can be applied to any sentient being. We avoided any requirement that presupposes a human-shaped biography (like life plans). However, note that the notion of a "life worth living" might be interpreted differently for non-human animals (e.g., a life with more pleasure than pain). But the formal structure remains the same.

  We flagged that the person-affecting restriction (10) might be anthropocentric because it relies on the identity of persons and their existence. For non-human animals, we might not care about identity as much. But we have already marked it as a camp commitment.

  ## Final List of Desiderata (with dependencies and tensions)

  We have 15 desiderata. We mark:

     - (*): Genuine constraint
     - (C): Camp commitment

     1. Non-anti-egalitarianism (*)
     2. Impartiality (*)
     3. Independence of Irrelevant Alternatives (for fixed population) (C) [because in variable population settings, it is often dropped]
     4. Existence of Critical Level (C)
     5. Asymmetry of Addition (Avoidance of RC) (C)
     6. Non-sadism (C)
     7. Negative Mere Addition (*)
     8. Continuity (C) [some theories, like leximin, are not continuous]
     9. Avoidance of the Very Repugnant Conclusion (C) [stronger form of 5]
     10. Person-Affecting Restriction (C)
     11. Non-anti-natalism (C)
     12. Transitivity (*)
     13. Completeness (C)
     14. Avoidance of the Mere Addition Paradox (C)
     15. Sensitivity to Quality (*)

  The core inconsistency is among 5, 6, 12 (and also 1 and 8 play a role in the chain). Specifically, 5 (avoid RC), 6 (non-sadism), and 12 (transitivity) are jointly unsatisfiable.

  Therefore, any theory must abandon at least one of these three.

  We close by reiterating: the requirement that excludes the most theories is **Avoidance of the Repugnant Conclusion (5)** because it forces the abandonment of total utilitarianism and then leads to a cascade of other exclusions due to the impossibility results.
answer: |-
  ### Desiderata for Variable Population Axiology  
  Sorted into **genuine constraints** (necessary for any minimally adequate theory) and **camp commitments** (reflect partisan positions, not universal adequacy). Each requirement includes a concrete case, motivation, and notes on dependencies/strength. Requirements are generalizable to all sentient beings (lives characterized by net well-being, without anthropocentric assumptions).  

  ---

  #### **Genuine Constraints**  
  1. **Transitivity**  
     - **Case**: Outcome A ≻ B and B ≻ C ⇒ A ≻ C.  
     - **Motivation**: Prevents cycles in betterness relations (e.g., A ≻ B ≻ C ≻ A). Without this, no coherent ranking is possible.  
     - **Note**: Foundational for any ordering.  

  2. **Weak Pareto (Fixed-Population Dominance)**  
     - **Case**: Same population in A and B. If every individual in A has higher well-being than in B, then A ≻ B.  
     - **Motivation**: If all are worse off in B, B cannot be better. Applies to any sentient being (well-being comparisons suffice).  
     - **Note**: Weakest form of Pareto; silent on variable populations.  

  3. **Non-Sadism (Avoidance of Welfare Antipriority)**  
     - **Case**: A: 10 beings at well-being 10. B: 10 beings at 10 + 1 being at −5 (suffering). Then B ≺ A.  
     - **Motivation**: Adding a suffering life must not improve an outcome. Grounded in the badness of suffering, irrespective of species.  
     - **Note**: Stronger than Negative Mere Addition (see below).  

  4. **Sensitivity to Quality (Non-Aggregationism)**  
     - **Case**: A: 1 being at well-being 0.1. B: 1 million beings at 100. Then B ≻ A.  
     - **Motivation**: Prefers flourishing lives over trivial gains in barely-worthwhile lives. Blocks "reverse repugnance" (trivial quality > vast flourishing).  
     - **Note**: Rejects theories that prioritize mere existence over quality.  

  5. **Impartiality (Anonymity)**  
     - **Case**: A: X=10, Y=5. B: X=5, Y=10. Then A ∼ B.  
     - **Motivation**: Ethical evaluation ignores identity; only well-being levels matter. Applies universally (no species bias).  

  6. **Negative Mere Addition**  
     - **Case**: A: n beings at 10. B: n beings at 10 + 1 being at −1. Then B ≺ A.  
     - **Motivation**: Adding a life not worth living must not be neutral or good. Special case of Non-Sadism.  
     - **Note**: Survives non-human cases (e.g., adding a suffering insect).  

  ---

  #### **Camp Commitments**  
  7. **Avoidance of the Repugnant Conclusion (RC)**  
     - **Case**: A: 10 billion at 100 (flourishing). Z: 10²⁰ at 0.1 (barely worth living). Then A ≻ Z.  
     - **Motivation**: RC demands a vast, mediocre population outranks a small, flourishing one, violating quality sensitivity.  
     - **Note**: **Camp commitment**: Total utilitarianism embraces RC; critical-level theories reject it.  

  8. **Non-Sadism for Worthwhile Lives (Mere Addition Principle)**  
     - **Case**: A: n beings at 10. B: n beings at 10 + 1 being at 1 (worth living). Then B ≿ A.  
     - **Motivation**: Adding a worthwhile life should not make things worse.  
     - **Note**: **Pulls against RC avoidance**: Combined with transitivity, leads to RC (see inconsistency proof).  

  9. **Person-Affecting Restriction**  
     - **Case**: A: No beings exist. B: 1 being at 10. Is B ≻ A? Person-affecting views say no (no one harmed in A).  
     - **Motivation**: Betterness requires a subject for whom it is better.  
     - **Note**: **Camp commitment**: Rejected by impersonal views (e.g., total utilitarianism). Illegitimate for non-humans (assumes identity-dependent harm).  

  10. **Impersonal Addition Principle (Non-Anti-Natalism)**  
      - **Case**: A: No beings. B: 1 being at 10. Then B ≻ A.  
      - **Motivation**: Creating a worthwhile life is good. Contradicts person-affecting views.  
      - **Note**: **Pulls against person-affecting** and anthropocentric; sentience-general.  

  11. **Equality-Priority (Weak Egalitarian Dominance)**  
      - **Case**: Same population size. A: All at 50. B: Half at 100, half at 0. Then A ≻ B.  
      - **Motivation**: Uniform flourishing > inequality with same total well-being.  
      - **Note**: **Stronger than needed** (only requires Pareto when totals are equal).  

  12. **Continuity**  
      - **Case**: A ≻ B ≻ C ⇒ ∃ small ε such that perturbing A by ε still yields A′ ≻ B.  
      - **Motivation**: Prevents lexical thresholds (e.g., "any life > 0 is incomparably better than suffering").  
      - **Note**: **Camp commitment**: Leximin theories reject continuity.  

  ---

  ### **Inconsistencies and Proofs**  
  #### **Core Inconsistency**: Avoid RC + Mere Addition + Transitivity  
  - **Requirements**:  
    - (7) Avoid RC: A ≻ Z (flourishing ≻ vast mediocrity).  
    - (8) Mere Addition: Adding a worthwhile life is not bad (B ≿ A).  
    - (1) Transitivity: Betterness is transitive.  
  - **Proof**:  
    1. Start with A: 10 billion at 100.  
    2. Add a group of k beings at 1 (worth living) to get A⁺: A ≾ A⁺ (by Mere Addition).  
    3. Reduce original group’s well-being by ε (e.g., to 99.999) and increase new group’s well-being by δ (e.g., to 1.0001) to get B. By continuity and Pareto, A⁺ ≾ B.  
    4. Repeat steps 2–3 iteratively:  
       - Each iteration adds beings and shifts well-being toward mediocrity.  
       - After n steps, reach Z: vast population at 0.1.  
       - By transitivity, A ≾ Z.  
    5. **Contradiction**: Avoid RC requires A ≻ Z.  
  - **Resolution**: One must be abandoned.  
    - **Total utilitarianism** abandons (7) (embraces RC).  
    - **Average/critical-level theories** abandon (8) (adding worthwhile lives can be bad).  
    - **Non-transitive theories** abandon (1) (betterness is cyclical).  

  #### **Secondary Inconsistency**: Person-Affecting + Non-Anti-Natalism  
  - (9) Person-affecting: B ≻ A only if better for someone.  
  - (10) Non-anti-natalism: B ≻ A for A (no beings) → B (one being at 10).  
  - **Contradiction**: No one exists in A → no subject for whom B is better.  
  - **Resolution**: Abandon (9) (impersonal) or (10) (anti-natalist).  

  ---

  ### **Ranking of Exclusionary Power**  
  **Avoidance of the Repugnant Conclusion (7)** excludes the most otherwise attractive theories.  
  - **Justification**: It forces total utilitarianism (intuitive, simple) to embrace RC or abandon transitivity/Mere Addition. Critical-level theories avoid RC but violate Mere Addition and are complex. Person-affecting theories avoid RC but struggle with non-identity cases. RC avoidance is the linchpin of impossibility results (Arrhenius-style).  

  ---

  ### **Response to Your Friend's Argument**  
  - **Claim**: "RC is repugnant only when comparing outcomes from a choice perspective, not from each person’s standpoint."  
  - **Desiderata Response**:  
    - **Person-affecting restriction (9)** would support this if betterness requires being better *for someone*.  
    - However, **impersonal addition (10)** and **sensitivity to quality (4)** show Z is worse *simpliciter*: flourishing lives are irreplaceable by mediocrity, even if each added life is worthwhile.  
    - **Verdict**: The argument relies on (9), a camp commitment. Without it, RC remains repugnant (violates 4 and 7).  

  ---

  ### **Summary of Tensions**  
  | Requirement Pair | Tension Direction |  
  |------------------|-------------------|  
  | Avoid RC (7) vs. Mere Addition (8) | Direct conflict (inconsistency via transitivity). |  
  | Person-affecting (9) vs. Non-anti-natalism (10) | Mutual exclusion. |  
  | Equality-priority (11) vs. Mere Addition (8) | Egalitarianism vs. expansion tolerance. |  
  | Continuity (12) vs. Lexical Thresholds | Smooth trade-offs vs. absolute priorities. |  

  Key takeaway: **Avoid RC, Mere Addition, and Transitivity are jointly unsatisfiable**—choose two. The rest are negotiable camp commitments.
