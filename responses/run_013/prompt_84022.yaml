prompt: |-
  Next month I am leading a ninety-minute session for a cross-disciplinary reading group — twelve graduate students from economics and cognitive science, plus two lawyers — on David Lewis's account of convention. None of them has read any philosophy of language; most are comfortable with game theory. What I want them to leave with is not the ability to recite a definition but the ability to sort lookalikes correctly: a convention, a mere custom, the equilibrium of a coordination game, and a norm that carries genuine ought-force. Please plan the explanation rather than giving it to me.

  I need the order of the ideas, with the dependencies made explicit: what has to be in place before what, and why. Tell me which single idea, if I introduce it early because it happens to be the part I find most interesting, will poison everything downstream, and what I should do at that point in the session instead. Give me the sequence as a list of moves with rough minutes attached.

  Then the carrying example. My candidate is a regularity I have watched settle in my own building: whoever reaches the lift first holds the door for whoever is behind, but only if that person is roughly within ten feet; nearly everyone does this, and nearly everyone is mildly annoyed by people who hold the door for someone visibly too far away to make it. Tell me whether that can carry the session, and if not, what would; and in either case, what the example must have and must lack. I know the textbook example is which side of the road to drive on. If you would rather use it, say why, but I suspect it is too easy: the arbitrariness is obvious and the mutual benefit is enormous, so they may come away thinking a convention is just an obviously good arrangement with an arbitrary flavour.

  I expect the following misconceptions, roughly in this order, though I would like you to correct the order and add what I have missed: that a convention is something agreed to, promised, or contracted; that any regularity everyone follows is a convention; that a convention is simply the equilibrium of a coordination game, so any stable arrangement qualifies; that conventions are efficient; and that breaking one is blameworthy. There is a sixth I am not sure how to handle at all: I think they will hear common knowledge as nothing more than everyone knowing. For each misconception, tell me the exact point in the sequence where I have to head it off and what the move is that heads it off.

  Give me one question to ask at the end that would discriminate — a case they must classify, where the answer turns on a feature they would have missed had they only half-understood the account. I would prefer the case to be one none of them has encountered before.

  Tell me what to leave out at this level, and say it out loud to them, so that nobody leaves thinking they have had the whole topic.

  One further thing I want the session to end on, because it is the part I actually care about: the same behaviour, sustained in one population by expectations and mutual preference alone and in another by genuine disapproval, so that they can see exactly what work the disapproval is doing that the expectations were not. Build that in if it can be built in; if it cannot be done in ninety minutes, say so, and tell me what it would have to displace.
reasoning: |-
  We are designing a 90-minute session for graduate students from economics, cognitive science, and law on David Lewis's account of convention. The goal is to enable them to distinguish between a convention, a mere custom, a coordination equilibrium, and a norm with genuine ought-force. The participants are familiar with game theory but not philosophy of language.

  Key misconceptions to address:
  1. Convention requires explicit agreement, promise, or contract.
  2. Any regularity everyone follows is a convention.
  3. Convention is simply an equilibrium of a coordination game (so any stable arrangement qualifies).
  4. Conventions are efficient.
  5. Breaking a convention is blameworthy.
  6. Common knowledge is just everyone knowing (without the iterative structure).

  We also want to end with a comparison: the same behavior sustained by expectations and mutual preference alone vs. by genuine disapproval, to show the added work of disapproval.

  The carrying example: holding the elevator door for someone within about 10 feet, but not for someone too far away. We must check if it can serve as a core example. Alternatively, we might use the driving-side example but note that it may be too easy and might lead to oversimplification.

  Plan Structure (90 minutes total):

  1. Introduction (5 minutes)
  2. Coordination Problems and Coordination Equilibrium (15 minutes)
  3. Regularity, Expectations, and Preferences (15 minutes)
  4. Common Knowledge (15 minutes) - This is critical and must be handled carefully to avoid misconception 6.
  5. Lewis's Definition of Convention (10 minutes)
  6. Distinguishing Convention from Lookalikes (15 minutes)
     - Mere custom
     - Coordination equilibrium without convention
     - Norm with genuine ought-force
  7. The Elevator Example (or alternative) in Depth (10 minutes)
  8. Addressing Misconceptions (integrated throughout, but especially in steps 2-6)
  9. Final Discriminating Question (5 minutes)
  10. Wrap-up and What's Left Out (5 minutes)

  Detailed Sequence:

  1. Introduction (5 min)
     - Set the stage: We're exploring David Lewis's account of convention to understand what makes a convention distinct from other social regularities.
     - Goal: Not to memorize a definition but to be able to classify cases correctly.
     - Mention the key elements we'll cover: coordination problems, equilibria, expectations, preferences, and common knowledge.

  2. Coordination Problems and Coordination Equilibrium (15 min)
     - Start with a simple coordination game (e.g., driving on the left vs. right). Show that there are multiple equilibria and that the players have a common interest in coordinating.
     - Define coordination equilibrium: a strategy profile where no one would be better off if any one player alone acted differently, provided the others act as before.
     - **Head off misconception 3 early**: Not every stable arrangement is a convention. We'll see that convention requires more than just being an equilibrium.
     - Also, note that not every coordination game leads to a convention (yet) because convention involves a regularity in behavior.

  3. Regularity, Expectations, and Preferences (15 min)
     - Introduce the idea of a regularity: a behavior that is widespread in a population.
     - But not every regularity is a convention (e.g., everyone in a town eats breakfast at 7am might be a mere custom). 
     - For convention, the regularity must be sustained by expectations and preferences: 
       - People conform because they expect others to conform, and they prefer to conform if others do (because it solves a coordination problem).
     - **Head off misconception 2**: Not every regularity is a convention. Example: a mere custom (like eating breakfast at 7am) might be followed out of habit, but there's no coordination problem and no expectation-based preference to conform.
     - **Head off misconception 1**: Convention does not require explicit agreement. It arises from repeated interactions and expectations.

  4. Common Knowledge (15 min)
     - This is the most critical and potentially confusing part. If introduced poorly, it can poison everything downstream. We must avoid the misconception that common knowledge is just everyone knowing.
     - Start with an example: the driving side example. 
       - Level 1: I know that we drive on the right.
       - Level 2: I know that you know that we drive on the right.
       - Level 3: I know that you know that I know, and so on.
     - Explain that common knowledge requires an infinite hierarchy of beliefs. However, Lewis shows that in practice, it can be generated by a public event (like a law or a very salient occurrence).
     - **Head off misconception 6**: Use a simple example to show the difference. Example: Two people in a room with a clock. The clock stops at 12:00. They both see it and see each other seeing it. Then they have common knowledge that the clock stopped. But if one person sees it and the other doesn't, and they don't see each other, then it's not common knowledge.
     - Why is it necessary? Because for a convention to work, not only do I expect you to drive on the right, but I also expect that you expect me to drive on the right, etc. Otherwise, coordination might break down.

  5. Lewis's Definition of Convention (10 min)
     - Now assemble the pieces. A convention (according to Lewis) is:
       - A regularity R in behavior among members of a population P when they are in a recurrent situation S.
       - Conditions:
         1. Everyone conforms to R.
         2. Everyone expects everyone else to conform to R.
         3. Everyone prefers to conform to R on condition that the others do, because S is a coordination problem and uniform conformity to R is a coordination equilibrium.
         4. It is common knowledge in P that conditions 1-3 hold.
       - Optional: There is at least one other regularity R' that could have been a convention instead, so that the choice of R is arbitrary in a sense.
     - Note: The arbitrariness condition is sometimes included but is not always necessary. Lewis sometimes includes it to emphasize that there are alternatives.

  6. Distinguishing Convention from Lookalikes (15 min)
     - Present several examples and have the group discuss which are conventions and why:
       a) Driving on the right (convention).
       b) Eating breakfast at 7am in a particular town (mere custom) - no coordination problem, no expectations about others that matter for solving a problem.
       c) A norm against cutting in line (norm with ought-force) - here, there might be a coordination aspect, but also there is disapproval and a sense of obligation. We'll see that convention does not require blame or ought-force, but norms might.
       d) A market equilibrium (e.g., a price that clears the market) - it's an equilibrium but not a coordination equilibrium because the participants are not primarily trying to coordinate but to maximize individual utility. Also, it may not have the common knowledge of expectations.
     - **Head off misconception 4 and 5**: 
       - Conventions are not necessarily efficient. Example: QWERTY keyboard layout (though this is debated, it's a classic example of a convention that might be less efficient than alternatives). 
       - Breaking a convention isn't necessarily blameworthy. In the driving example, if I drive on the left, I might cause an accident, but the blame comes from the harm, not just the breaking. In contrast, for a norm, breaking it might incur disapproval even if no harm is done.

  7. The Elevator Example (10 min)
     - Present the example: holding the elevator door for someone within about 10 feet, but not for someone too far away. Nearly everyone does it and is annoyed when someone holds the door for a person too far away.
     - Analyze using Lewis's conditions:
       - Regularity: yes.
       - Coordination problem? Yes: the situation is recurrent, and there are multiple equilibria (hold the door or not). The group has a common interest in not holding the door when the person is too far (because it wastes time) and holding it when the person is close (to be polite and efficient). However, the boundary (10 feet) is arbitrary.
       - Expectations: each person expects others to hold the door only within 10 feet.
       - Preferences: each prefers to hold the door if the person is within 10 feet (because they expect others to do so and it's polite) and not hold it beyond (because it causes annoyance). They prefer to conform conditionally.
       - Common knowledge? Probably: it's widely known and expectations are shared.
       - So it fits as a convention.
     - But note: it also has an element of mild disapproval (annoyance). This is a bridge to the next part.

  8. Comparing with Norms: The Role of Disapproval (10 min) [This is the part you care about]
     - Take the same behavior (holding the door within 10 feet) and imagine two populations:
       - Population A: They do it because they expect others to do it and prefer to conform conditionally. There is no disapproval if someone doesn't hold the door for a person within 10 feet; maybe just a shrug because the person might be in a hurry or didn't notice.
       - Population B: They have the same expectations and preferences, but also, if someone fails to hold the door for a person within 10 feet, they disapprove. They might think, "That was rude," and might even sanction the person (e.g., a dirty look).
     - In Population A, the behavior is sustained purely as a convention (by expectations and conditional preferences). In Population B, it is sustained by both convention and a norm (with genuine ought-force). The disapproval adds an extra layer of motivation.
     - Point: The convention, in Lewis's account, does not require the ought-force. The disapproval in Population B is doing extra work that the expectations alone (in Population A) are not.

  9. Final Discriminating Question (5 min)
     - Present a case: "In a certain university department, every Friday afternoon, the faculty members gather in the lounge for wine and cheese. This has been going on for years. Everyone expects everyone else to be there, and everyone prefers to be there if others are because it's a nice social event. However, if someone doesn't show up, no one minds; there is no disapproval. Is this a convention?"
       - Answer: Yes, it fits Lewis's definition. It's a regularity solving a coordination problem (where to be for socializing) with expectations and conditional preferences, and common knowledge. The absence of disapproval is consistent with convention. But note: if there were no coordination problem (e.g., if the gathering was just a custom and people would go regardless of others), then it wouldn't be a convention.

  10. Wrap-up and What's Left Out (5 min)
      - Recap: We've covered the core of Lewis's account, focusing on the game-theoretic structure and common knowledge.
      - Explicitly state what we left out:
        - We did not cover the role of precedent (how conventions get started).
        - We did not discuss conventions in signaling games (which Lewis also analyzes).
        - We did not delve into the philosophical debates around common knowledge (e.g., whether it's psychologically realistic).
        - We did not explore the relationship between conventions and language in depth.
      - Emphasize that they now have a tool to distinguish conventions from other social regularities.

  Adjustments for Time:
     - The entire session is tightly scheduled. If we run over in one part, we might cut short the elevator example or the lookalikes section. Alternatively, we could reduce the time on common knowledge if the group grasps it quickly, but that's risky.

  Why the elevator example works:
     - It has the required elements: regularity, coordination problem (when to hold the door to balance efficiency and politeness), expectations, conditional preferences, and common knowledge.
     - It lacks the enormous mutual benefit of the driving example, so the arbitrariness is more subtle (the 10-foot rule is arbitrary but not without reason). Also, it has a mild normative element (annoyance) which we can use to contrast with a pure convention and then with a norm.

  Addressing Misconceptions Recap:
     - Misconception 1 (agreement): Headed off in step 3 by emphasizing that convention arises from expectations, not agreement.
     - Misconception 2 (any regularity): Addressed in step 3 by contrasting convention with mere custom.
     - Misconception 3 (any equilibrium): Headed off in step 2 by noting that convention requires more (regularity, expectations, common knowledge) and again in step 5 when defining convention.
     - Misconception 4 (efficiency): Addressed in step 6 with the QWERTY example.
     - Misconception 5 (blame): Addressed in step 6 and step 8 by showing that breaking a convention may not be blameworthy and by contrasting with norms.
     - Misconception 6 (common knowledge): Addressed in step 4 by explaining the iterative structure and giving an example.

  Final Discriminating Question:
     - The wine and cheese example above is designed to test whether they see that the absence of disapproval does not prevent it from being a convention, and that the key is the coordination problem and the conditional preferences. It's a case they likely haven't encountered.

  Ending on the note of convention vs. norm: We built it in at step 8, using the same behavior (holding the door) in two populations. It fits within the 90 minutes without displacing anything critical because we used the elevator example as the lead-in.

  Plan as a List of Moves with Minutes:

  1. Introduction (5 min): Set goals and outline.
  2. Coordination Problems and Equilibrium (15 min): Game example, define equilibrium, head off misconception 3.
  3. Regularity, Expectations, Preferences (15 min): Contrast convention with mere custom, head off misconceptions 1 and 2.
  4. Common Knowledge (15 min): Explain with example, head off misconception 6.
  5. Lewis's Definition (10 min): Assemble the pieces.
  6. Distinguishing Lookalikes (15 min): Examples, head off misconceptions 4 and 5.
  7. Elevator Example (10 min): Apply the definition.
  8. Convention vs. Norm (10 min): Two populations, same behavior, to show the role of disapproval.
  9. Discriminating Question (5 min): Wine and cheese case.
  10. Wrap-up (5 min): Recap and state omissions.

  Total: 90 minutes.

  Note: The session is intense. Be prepared to adjust timing on the fly, especially if discussions are productive. If time runs short, step 6 (distinguishing lookalikes) can be shortened by focusing on one or two key examples, and step 7 (elevator) can be integrated into step 8.
answer: |-
  Here's a structured plan for your 90-minute session, optimized to build understanding incrementally while preempting misconceptions. The sequence ensures each concept scaffolds the next, with timing, rationale, and targeted interventions for misconceptions. I'll then address your elevator example and the closing elements.

  ---

  ### **Session Sequence (90 Minutes Total)**
  **Core Principle:** Start with game theory (their comfort zone) and layer in Lewis's philosophical nuances. Delay "common knowledge" until expectations/preferences are solid—introducing it too early (e.g., before Step 3) risks reducing it to "everyone knows" and derails later distinctions.

  1. **Intro: The Puzzle of Social Regularities (5 min)**  
     *What:* Pose the elevator example (without analysis) as a mystery: "Why does this pattern persist? Is it a convention, a norm, or something else?"  
     *Why:* Hook interest with a relatable case. Avoid defining anything yet.  
     *Misconception Preemption:* None yet—let misconceptions surface organically.

  2. **Coordination Games ≠ Conventions (15 min)**  
     *What:*  
     - Define coordination games (e.g., driving side, meeting points) using game theory.  
     - Show that equilibria are stable but not necessarily *conventions*.  
     - Contrast:  
       - **Equilibrium:** "We both drive right because it’s stable."  
       - **Convention (preview):** "We both drive right because *we expect each other to*, and we prefer to match."  
     *Why:* Uses their GT fluency to anchor the discussion. Isolates "equilibrium" as necessary but insufficient.  
     *Misconception Preemption:*  
     - **#3 (any equilibrium is a convention):** Head off by showing a non-convention equilibrium (e.g., two people silently agreeing to avoid each other in a hallway—no expectations, just coincidental stability).  
     - **#4 (conventions are efficient):** Use the QWERTY keyboard—suboptimal but stable due to expectations.

  3. **Regularity + Conditional Preferences (15 min)**  
     *What:*  
     - Define "regularity" (recurrent behavior in a group).  
     - Add *conditional preferences*: "I prefer to do X if others do X."  
     - Contrast:  
       - **Mere custom (e.g., morning coffee):** Regularity without coordination (no one changes behavior if others switch to tea).  
       - **Convention (e.g., handshake greetings):** I shake hands because I expect you to and prefer to reciprocate.  
     *Why:* Separates conventions from arbitrary regularities. Conditional preferences are the bridge to expectations.  
     *Misconception Preemption:*  
     - **#2 (any regularity is a convention):** Kill with the coffee custom example.  
     - **#1 (conventions require agreement):** Emphasize—conventions emerge from repeated interactions, not promises (use driving: no one "agreed" to drive right).

  4. **Expectations and the Role of Disapproval (15 min)**  
     *What:*  
     - Layer in *expectations*: "I do X because I believe you’ll do X."  
     - Introduce **two variants of the elevator example**:  
       - **Variant A (convention):** People hold doors within 10 feet. If someone doesn’t, others are *annoyed but not morally outraged* (it’s inefficient, not wrong).  
       - **Variant B (norm):** Same behavior, but if someone doesn’t comply, others feel *betrayed* and impose sanctions (e.g., scowls, gossip).  
     - Contrast:  
       - Convention: Sustained by expectations + conditional preferences.  
       - Norm: Adds *genuine ought-force* (disapproval signals "you should feel obligated").  
     *Why:* This is your priority end point. It isolates the "work" of disapproval (moral sanction vs. frustration) and sets up later distinctions.  
     *Misconception Preemption:*  
     - **#5 (breaking conventions is blameworthy):** Use Variant A—annoyance stems from inefficiency, not moral failure. Blame requires Variant B.

  5. **Common Knowledge: The Crucial Elevator (15 min)**  
     *What:*  
     - Define common knowledge iteratively:  
       - L1: Everyone knows the rule.  
       - L2: Everyone knows that everyone knows.  
       - L3: Everyone knows that L2 is true, etc.  
     - Apply to the elevator:  
       - Why 10 feet? Because it’s *publicly salient* (you see others adjusting their behavior based on distance).  
       - Contrast with "everyone knows": If only *some* know the 10-foot rule but others don’t know they know, coordination fails.  
     *Why:* Must come after expectations/preferences—otherwise, students conflate it with simple knowledge.  
     *Misconception Preemption:*  
     - **#6 (common knowledge = everyone knows):** Head off with a counterexample: "Imagine a secret group within the building follows the 10-foot rule, but others don’t know the group exists. Even if ‘everyone knows’ the rule, coordination fails without higher-order knowledge."

  6. **Lewis's Definition + Distinctions (15 min)**  
     *What:*  
     - Assemble the full definition: A convention is a *regularity R* in a group where:  
       1. Everyone conforms to R.  
       2. Everyone expects others to conform.  
       3. Everyone prefers to conform *if others do* (it solves a coordination problem).  
       4. This is *common knowledge*.  
       *(Optional: R is arbitrary—another R could have worked.)*  
     - Classify lookalikes:  
       - **Mere custom:** Coffee-drinking regularity (fails 2, 3).  
       - **Coordination equilibrium:** Silent hallway avoidance (fails 2, 4).  
       - **Norm:** Elevator Variant B (includes moral "ought" beyond 1-4).  
     *Why:* Now they have tools to differentiate. The definition crystallizes pre-built concepts.  
     *Misconception Preemption:*  
     - **#3 (any equilibrium is a convention):** Re-kill with the hallway example.  
     - **#5 (blameworthiness):** Re-emphasize norms vs. conventions using Variant A/B.

  7. **Synthesis: The Elevator Test (5 min)**  
     *What:* Return to the elevator example. Have students apply the definition:  
     - Regularity? ✅  
     - Expectations? ✅ (people adjust based on others' behavior).  
     - Conditional preferences? ✅ (I hold if close; prefer not to if far).  
     - Common knowledge? ✅ (salient through public enforcement).  
     - Arbitrariness? ✅ (15 feet could work, but 10 was adopted).  
     - **But:** Annoyance at "over-holders" is *pragmatic* (wastes time), not moral → convention, not norm.  
     *Why:* Reinforces distinctions with their "real-world" case.

  8. **Discriminating Question & Wrap-Up (5 min)**  
     - **Discriminating Question:**  
       > "In a remote village, everyone wears a hat indoors. They do this because ancestors believed hats ward off evil spirits. Everyone expects others to wear hats, and everyone prefers to wear one if others do (to avoid spiritual contamination). Is this a convention?"  
       **Answer:** No. It *seems* like one (meets 1-4), but it fails condition 3—the preference isn’t driven by a *coordination problem* (no multiple equilibria; it’s a unilateral superstition). It’s a **custom with expectations**, not a convention.  
       *Why it discriminates:* Tests if they see that conventions require a coordination game structure (misconception #2/3).  
     - **What to Leave Out:** Say aloud: "We skipped *how conventions emerge* (precedent/evolution) and *language-based conventions* (Lewis’s broader project). This is a toolkit—not the whole map."

  ---

  ### **Why the Elevator Example Works (and How to Use It)**
  - **Yes, it can carry the session** if you frame it as the central case study.  
  - **Must have:**  
    - A coordination problem (balancing efficiency/politeness).  
    - Arbitrariness (10 feet is salient but adjustable).  
    - Conditional preferences (I hold if you’re close; don’t if far).  
    - Public enforcement (eye contact, pace adjustments) → common knowledge.  
  - **Must lack (initially):**  
    - Moral "ought"—annoyance is pragmatic, not ethical (this lets you layer in norms later).  
  - **Advantage over driving:** Driving’s mutual benefit overshadows arbitrariness. The elevator’s subtle trade-off (politeness vs. efficiency) better highlights expectations and conditional preferences.

  ---

  ### **Why This Addresses Your Priorities**
  - **Convention vs. norm:** Built into Step 4 (Variant A/B) and reinforced throughout. The elevator example’s mild annoyance perfectly isolates pragmatic frustration from moral blame.  
  - **Time feasibility:** The sequence allocates 25 min (Steps 4 + 6) to this priority without displacement. It’s integrated, not tacked on.  
  - **Misconceptions:** Preempted in the order they’re likely to arise (see chart below).  

  | Misconception | Step Preempted | Intervention |
  |---------------|----------------|--------------|
  | #1 (agreement) | Step 3 | Contrast conventions with contracts using driving/elevator. |
  | #2 (any regularity) | Step 3 | Mere custom (coffee) vs. convention (handshake). |
  | #3 (any equilibrium) | Steps 2, 6 | Silent hallway avoidance ≠ convention. |
  | #4 (efficiency) | Step 2 | QWERTY keyboard as inefficient convention. |
  | #5 (blame) | Steps 4, 6 | Elevator Variant A (annoyance ≠ moral blame). |
  | #6 (common knowledge) | Step 5 | Secret group counterexample. |

  ---

  **Final Tip:** Use the elevator example as a recurring thread. Start with it as a puzzle, revisit it when introducing expectations/disapproval (Step 4), and resolve it in synthesis (Step 7). This creates coherence while ensuring your priority—contrasting pragmatic expectations vs. moral "ought"—lands powerfully.
