prompt: |-
  I'm putting together the final for a senior seminar I co-teach (half CS, half philosophy) on oversight and training signals for AI systems, and I need one essay question with a model answer and a marking scheme I can hand to the TA's.

  The whole term has been process vs outcome supervision -- reward the steps, reward the final answer, that debate. Trouble is every question I've drafted can be answered by someone who's read three blog posts and memorized the line about intermediate steps being easier to verify. I want something that makes them actually think.

  So here's a distinction I've been kicking around in lecture and I want the question built on it. I've been calling the two sides local-validity supervision and path-consistency supervision. Local validity: a step gets credit for being acceptable on its own terms given what came before it -- the inference is valid, the algebra is fine, no competent reasoner would object to the step, regardless of where the trajectory ends up. Path consistency: a step gets credit for sitting on a route that actually arrives at the right answer, i.e. the supervisor is scoring it against solutions known to work. Both get called process supervision in the wild, and I dont think they're the same thing at all. I want the exam to make students work out what the difference amounts to.

  The question should force three things. First, whether the process/outcome distinction survives this split -- specifically whether one of the two collapses into outcome supervision with extra bookkeeping, which one, and what turns on that. Second, the fact that we only ever see the model's written steps and not its computation: say what has to be true for supervising a transcript to count as supervising a process, and whether that assumption is checkable in principle or only assumable. Third, they have to take a side on what step-level credit should target when a step is well-justified but leads nowhere, or unjustified but lucky -- should the reward track warrantedness or expediency, and does the answer change depending on whether we care about the model's competence or just its behaviour on the training distribution.

  To stop them reciting, put a concrete case inside the question. Something like: a model solves a linear system by eliminating variables in an unusual order; every step is valid; human raters check against a reference solution and mark two of the steps as mistakes; the trained model afterwards avoids that order even when its the cheaper route. They have to say what the case shows about what the step-level reward was actually measuring, and whether it's a bug in the reward or a feature of the task. Keep the case self-contained -- it shouldn't lean on any particular paper or result.

  Level: senior undergrad / first-year grad, 75 minutes, 30 marks, roughly 900-1000 words. The model answer should be about that long and should actually take positions rather than survey the field.

  For the marking scheme, give me a table with these columns: Point (the thing the student has to do), Marks, A_move (the specific move that gets full marks on that point), B_move (the move that gets partial credit), Typical_failure (the specific error that costs marks here). The marks should add to 30, and no point should be skippable without losing real ground.

  Then, after the model answer, give me a JSON object with these fields: question_text (the exam question, verbatim), time_allowance_minutes, total_marks, model_answer_word_count, one_line_summary (the single sentence a top answer is defending), hardest_move (the move separating an A from a B, one sentence), biggest_common_error (one sentence), and marking_points (an array with one object per row of the table, fields point, marks, a_move, b_move, typical_failure).

  Don't quote or cite any papers anywhere in this -- I'm handing it out with no reading list attached, so it has to stand on its own.
reasoning: |-
  We are constructing an essay question for a senior seminar on AI oversight, focusing on the distinction between two types of process supervision: local-validity supervision and path-consistency supervision. The question must force students to address three key issues:
  1. Whether one of these collapses into outcome supervision and what that implies.
  2. The assumption that supervising a transcript (written steps) is equivalent to supervising the process, and whether that assumption is checkable.
  3. Taking a stance on whether step-level credit should track warrantedness (local validity) or expediency (path consistency) and how this relates to the model's competence vs. behavior.

  We include a concrete case to prevent rote memorization.

  **Question Text:**

  "Consider the following scenario: an AI model is trained to solve systems of linear equations using step-by-step process supervision. During training, the model solves one particular system by eliminating variables in an unusual order (for example, starting with the last equation and working backwards). Every algebraic step the model takes is valid (i.e., each step is a correct algebraic manipulation given the current state). However, human raters, who are using a reference solution that follows the conventional order (starting from the first equation), mark two of the model's steps as mistakes because they deviate from the reference. After training, the model consistently avoids the unusual elimination order even in cases where it would be computationally more efficient.

  Using this scenario as a touchstone, address the following:

  a) Distinguish between 'local-validity supervision' and 'path-consistency supervision' in the context of step-level credit assignment. Explain whether and how the scenario illustrates a tension between these two approaches.

  b) Analyze whether either local-validity supervision or path-consistency supervision collapses into a form of outcome supervision with extra steps. What does this collapse (or lack thereof) imply for the practical implementation of process supervision?

  c) In step-by-step training, we only observe the model's written transcript of steps, not its internal computations. Discuss what must be true for supervising the transcript to count as supervising the reasoning process. Can we verify this assumption in principle? Why or why not?

  d) In the given scenario, what does the fact that the model avoids the efficient but unconventional path after training reveal about what the step-level reward was actually measuring? Should step-level credit reward the warrantedness of a step (local validity) or its expediency in leading to a correct solution (path consistency)? Defend your position by considering both the goal of building a competent problem-solver and the goal of achieving high performance on a specific training distribution.

  Your answer should engage deeply with the conceptual distinctions and use the scenario to illustrate your arguments."

  ---

  **Model Answer (Approx. 900-1000 words):**

  **Introduction (approx. 100 words):**
  The scenario presents a conflict in step-level supervision: the model's algebraically valid steps are penalized because they diverge from a reference path. This tension exposes two distinct ways of assigning step-level credit: local-validity supervision (rewarding steps that are logically sound given prior steps) and path-consistency supervision (rewarding steps that align with a known correct trajectory). This essay argues that path-consistency supervision collapses into outcome supervision, that the transcript supervision relies on an unverifiable assumption of transparency, and that step-level credit should prioritize local validity to foster genuine competence.

  **a) Distinction and Tension (approx. 200 words):**
  Local-validity supervision evaluates each step in isolation: is this step a correct inference from the current state? In the scenario, the model's unusual elimination order is locally valid because each algebraic manipulation preserves the solution set. Path-consistency supervision, however, evaluates a step by whether it appears in a pre-approved solution path (like the reference). Here, the human raters, using path-consistency, penalize steps that are locally valid but not on the reference path. The tension arises because local validity focuses on the intrinsic correctness of the step, while path consistency focuses on conformity to an exemplar. The scenario shows that a step can be locally valid without being path-consistent (if it's not on the reference) and vice versa (a step might be on the reference path but, if taken out of context, might not be valid from a different state). This leads to the model being trained to avoid valid but unconventional paths.

  **b) Collapse into Outcome Supervision (approx. 200 words):**
  Path-consistency supervision collapses into outcome supervision with extra bookkeeping. Outcome supervision rewards only the final answer, but path-consistency rewards steps that are part of a path known to lead to the correct outcome. It is outcome-driven because the reference path is validated by its success: if the reference solution were incorrect, the path-consistent steps would not be rewarded. Thus, path-consistency supervision is essentially outcome supervision that uses intermediate steps as proxies for the final outcome. In contrast, local-validity supervision does not collapse into outcome supervision. A locally valid step might lead to a dead end (e.g., an equation that cannot be solved) and still be rewarded, even if the outcome is incorrect. This independence from outcome is crucial: it allows the model to explore diverse solution strategies without being penalized for not following a preordained path. The collapse of path-consistency into outcome supervision implies that it inherits outcome supervision's limitations, such as reward hacking and overfitting to the training distribution.

  **c) Transcript Supervision and the Transparency Assumption (approx. 200 words):**
  Supervising a written transcript assumes that the transcript faithfully represents the model's internal reasoning process. This requires that the model's internal state and computations are perfectly aligned with the written steps (transparency). Without this, a model could write correct steps while internally taking shortcuts or even cheating (e.g., by generating steps after the fact to match the solution). However, this assumption is not checkable in principle. We cannot directly observe the model's internal computations; we only see the output. We might design tests to detect inconsistencies (e.g., by probing internal states), but we cannot exhaustively verify that every written step corresponds to an actual computation. This is a fundamental epistemic limitation. Thus, process supervision via transcripts is always based on an assumption of transparency, which may not hold. This problem affects both local-validity and path-consistency supervision: if the transcript is not transparent, we are not supervising the process but only its external trace.

  **d) What Step-Level Credit Should Target (approx. 200 words):**
  In the scenario, the step-level reward was clearly measuring path consistency: steps were penalized for deviating from the reference, regardless of local validity. This caused the model to avoid an efficient but unconventional path, revealing a bug in the reward design: it prioritized conformity over correctness and efficiency. Step-level credit should reward local validity, not path consistency. Rewarding warrantedness (local validity) builds a competent problem-solver that can handle novel problems because it learns general reasoning rules. Rewarding expediency (path consistency) trains the model to mimic pre-existing solutions, which may fail on out-of-distribution problems or miss more efficient paths. However, one might argue that for narrow tasks with a fixed distribution, path consistency could lead to better performance by avoiding exploration of dead ends. But this view confuses competence with performance: a locally valid model might initially explore dead ends but, with more training, could discover robust strategies. The scenario's penalty for valid steps is a feature only if the task is defined as "follow the reference solution," but that is an artificial constraint. True problem-solving competence requires rewarding the process, not the path.

  **Conclusion (approx. 100 words):**
  The scenario underscores that conflating local validity with path consistency leads to suboptimal training. Path-consistency supervision collapses into outcome supervision and stifles innovation. The transparency assumption is necessary but unverifiable. Ultimately, step-level credit should target local validity to cultivate genuine reasoning competence, even if it occasionally leads to dead ends. This approach better aligns with the goal of building AI that can reason robustly in novel situations.

