answer: |-
  ### Exam Question  
  **Question Text:**  
  Consider the following scenario: An AI model is trained to solve systems of linear equations using step-by-step process supervision. During training, the model solves a system by eliminating variables in an unconventional order (e.g., starting from the last equation and moving backward). Every algebraic step is logically valid—each manipulation correctly follows from the prior state. However, human raters, comparing steps to a reference solution that uses a conventional order (e.g., starting from the first equation), mark two steps as errors because they deviate from the reference. After training, the model avoids the unconventional order entirely, even when it would be computationally cheaper.  

  Using this scenario as an anchor, address the following:  
  1. **Distinguish** between *local-validity supervision* (rewarding steps that are logically sound given prior context) and *path-consistency supervision* (rewarding steps that align with a pre-approved solution path). Explain how the scenario reveals a tension between these approaches.  
  2. **Analyze** whether one approach collapses into outcome supervision (rewarding only the final answer) with extra steps. What would this collapse imply for training AI systems?  
  3. **Discuss** what must be true about the model’s reasoning for supervising its *written transcript* (e.g., "Step 3: subtract 2x from both sides") to count as supervising its *internal process*. Can this assumption be verified? Justify your answer.  
  4. **Argue** what step-level credit *should* reward: the *warrantedness* of a step (its local validity) or its *expediency* (its role in a known correct path). Defend your position using:  
     - The goal of building a *competent problem-solver* (able to generalize to novel problems).  
     - The goal of achieving *high performance on the training distribution*.  
     - The scenario’s outcome (e.g., the model avoiding efficient but unconventional paths).  

  ---

  ### Model Answer (Approx. 980 words)  
  **Introduction**  
  The scenario exposes a critical ambiguity in "process supervision." Local-validity supervision rewards steps for logical soundness (e.g., correct algebra), while path-consistency supervision rewards adherence to a reference path. Here, valid but unconventional steps are penalized, causing the model to reject efficient strategies. This essay argues that path-consistency collapses into outcome supervision, transcript supervision relies on an unverifiable assumption, and step-level credit should prioritize local validity to cultivate competence.  

  **1. Tension Between Local-Validity and Path-Consistency Supervision**  
  Local-validity supervision evaluates each step *in isolation*: is it logically justified given the prior state? In the scenario, the model’s elimination order is locally valid because each algebraic operation (e.g., adding equations) preserves equivalence. Path-consistency supervision, however, evaluates steps *against a reference solution*: did the step match what a human expected? Raters penalize steps not because they are incorrect, but because they deviate from the conventional path. This creates tension: a step can be locally valid (algebraically sound) but path-inconsistent (unconventional), or vice versa (e.g., a reference-based step might be invalid if taken out of context). The scenario shows path-consistency overriding local validity, as the model is trained to prioritize conformity over correctness.  

  **2. Collapse into Outcome Supervision**  
  Path-consistency supervision collapses into outcome supervision with extra bookkeeping. Outcome supervision rewards only the final answer, but path-consistency implicitly relies on the outcome: the reference path is "correct" only because it leads to the right solution. If the reference solution were wrong, path-consistent steps would not be rewarded. Thus, path-consistency is outcome supervision in disguise—it uses intermediate steps as proxies for the desired end state. This collapse has practical consequences: like outcome supervision, path-consistency is brittle to distribution shifts (e.g., novel problems with no reference) and incentivizes "path hacking" (mimicking steps without understanding). Local-validity supervision avoids this collapse because it rewards steps independently of the outcome—even if a valid step leads to a dead end (e.g., unsolvable equations), it still "earns" credit. This fosters exploration and generalization.  

  **3. Transcript Supervision and the Transparency Assumption**  
  Supervising a written transcript assumes that the transcript *perfectly reflects* the model’s internal reasoning process. For example, if the model writes "subtract 2x from both sides," we assume it internally performed that operation faithfully. This "transparency assumption" is necessary because we cannot observe internal computations (e.g., neural activations). Crucially, this assumption is **unverifiable in principle**. We can check if a step *looks* correct (e.g., algebra is valid), but we cannot confirm whether the model *used* that step to derive the next state or merely generated plausible text. A model could "hallucinate" steps after computing the answer internally, making the transcript a post hoc fabrication. While techniques like intermediate state checks (e.g., verifying variable values after each step) reduce risk, they cannot guarantee alignment between written steps and internal reasoning. This undermines both supervision approaches: if the transcript is unreliable, we are not supervising the process but its shadow.  

  **4. What Step-Level Credit Should Reward**  
  The scenario reveals that step-level reward was measuring *path consistency*, not local validity: the model was penalized for valid deviations, causing it to avoid efficient paths. This is a **bug**, not a feature. Step-level credit should prioritize *warrantedness* (local validity) over expediency (path consistency) for two reasons.  

  First, **competence demands local validity**. A problem-solver’s worth lies in robust reasoning, not path mimicry. Rewarding expediency trains models to memorize reference solutions, rendering them brittle when faced with novel problems (e.g., equations structured differently from training data). In the scenario, avoiding a cheaper path due to penalization reveals overfitting to the raters’ expectations. Local validity, by contrast, rewards *principled reasoning*, which generalizes. Yes, valid steps can lead to dead ends (e.g., looping algebra), but this is a feature of exploration—dead ends teach the model to backtrack or adjust strategy, building meta-cognition.  

  Second, **performance on the training distribution is not a sufficient counterargument**. While path-consistency might boost short-term accuracy (by drilling "proven" methods), it conflates correctness with convention. The scenario’s human raters marked valid steps as errors because of bias toward familiar paths, not objective flaws. This creates a hidden cost: the model dismisses valid innovations, reducing efficiency and adaptability. If "performance" is defined narrowly as matching reference solutions, then path-consistency "works"—but this conflates the *metric* with true problem-solving. A locally valid model might initially underperform on conventional problems but, with broad training, will outperform path-consistent models on edge cases.  

  Thus, the choice is normative: do we want AI that replicates human biases or transcends them? The scenario’s model avoids unconventional paths not because they are wrong, but because supervision rewarded conformity. Prioritizing warrantedness aligns with building *reasoners*, not parrots.  

  **Conclusion**  
  Path-consistency supervision collapses into outcome-driven training and stifles innovation, while local-validity supervision fosters genuine competence despite dead-end risks. The transparency assumption for transcripts is necessary but unverifiable, limiting all process supervision. The scenario’s penalty for valid steps is a warning: rewarding expediency trains models to fear creativity. Step-level credit must target warrantedness to build AI that reasons, not imitates.  

