prompt: |-
  Six months ago I was elected steward in my department at a large public hospital, on the strength of our first contract campaign, which ended in a nine-day strike I helped run. I have 90 minutes at the next stewards' training day with about twenty new stewards, most of whom have never voted in an authorization vote, and I want them to feel two things that took me a strike to learn and that I still cannot convey in a speech: that the union's power is a public good each member has a private reason to free-ride on, and that a strike works only if it binds the members who voted against it. Please design the session. I want a simulation with roles, a payoff scheme that uses no real money, a timeline, and a vote structured so that the minority is visibly bound by the majority's decision and has to decide, in role, what it owes a colleague who crosses. Build in at least one role whose objection to striking is principled rather than self-interested, so the fairness question cannot be waved away as selfishness. Then a debrief that maps what happened onto the difference between organizing as a right of association and striking as coercion of one's own side, including what to say to members who want the gains without the discipline. Tell me what predictably goes wrong the first time — I expect the free-riding to be underplayed and someone to feel personally accused — and be frank about which part of the idea the simulation cannot reproduce and I will have to state myself.
reasoning: |-
  We are designing a 90-minute session for new stewards to experience two key lessons:
   1. The union's power is a public good that each member has a private incentive to free-ride on.
   2. A strike works only if it binds the members who voted against it, and they must respect the majority decision.

   We'll create a simulation with roles, a payoff scheme (using points, not real money), a timeline, and a vote that forces the minority to be bound by the majority. We'll include a role that objects to striking on principled grounds (not self-interest).

   Session Structure:
   - Introduction (5 minutes)
   - Setup and Role Assignment (10 minutes)
   - Simulation (45 minutes, broken into rounds)
   - Debrief (30 minutes)

   Simulation: "The Public Hospital Budget Crisis"

   Background:
   The hospital administration has announced a budget crisis and plans to cut annual raises from the expected 5% to 0% for the next year. The union is considering a strike to demand a 5% raise. However, the strike is costly: each day on strike means lost wages (but if successful, the raise will make up for it over time).

   Roles:
   We have 20 participants. We assign them roles:

   - 16 "Regular Staff" (various departments: nurses, technicians, clerical, etc.)
   - 2 "Skeptics" (who have personal financial vulnerabilities, e.g., single parents with high rent, or someone with large medical debt) - they are worried about the immediate loss of wages during a strike.
   - 1 "Principled Objector" (e.g., a staff member who believes that patient care would be compromised by a strike and that it is unethical to harm patients for economic gain).
   - 1 "Free Rider" (who is assigned secretly to try to avoid striking but then benefit from the gains).

   Note: The roles are assigned by cards. Everyone else is a regular staff member who may be convinced either way.

   Payoff Scheme (in points, which represent long-term financial well-being and job satisfaction):

   - Base annual raise: 0% if no strike, 5% if the strike succeeds (but note: the strike must last at least 3 days to have any chance of success, and the administration will only negotiate after a show of force).
   - Each day of strike: participants lose 1 point (representing a day's wage loss).
   - If the strike lasts at least 3 days and the union wins, everyone gets 10 points (representing the long-term gain of the 5% raise over a year, which more than offsets the strike loss for those who strike for the full duration).
   - However, if the strike fails (i.e., it is called off before 3 days or the union caves without winning), then no raise and participants lose the points for the days they struck.

   Special rules for the simulation:
   - The strike vote: After the first round (which is a normal workday), the union will call for a strike authorization vote. The vote requires a simple majority to pass. If passed, the strike begins immediately.
   - Binding decision: Once the strike is authorized, every member must strike. However, there is a risk that some might cross the picket line (free ride). The simulation will force this dilemma.

   How the simulation runs in rounds:

   Round 0: (Preparation)
     - Assign roles (secretly for the Free Rider and Principled Objector; the Skeptics can be open about their concerns).
     - Each participant starts with 0 points.

   Round 1: (Normal workday)
     - No strike. Everyone gets 0 points (base).

   Round 2: (Strike Authorization Vote)
     - The facilitator (you) announces the budget crisis and the union's call for a strike vote to demand the 5% raise.
     - Participants have 5 minutes to discuss in small groups (4 groups of 5, mixing roles) and then a vote by show of hands.
     - If the vote passes (simple majority), the strike begins in Round 3. If it fails, the simulation ends and everyone gets 0 points (and the raise is lost).

   Round 3: (Strike Day 1)
     - If the vote passed, everyone is expected to strike. However, the Free Rider has the option to cross the picket line (secretly). How?
          - The facilitator collects a private note from each participant: "Strike" or "Work". 
          - The Principled Objector must decide: they may feel bound by the vote but still have their ethical concern. They might strike but feel bad, or they might break the strike and work.
          - The Skeptics might also be tempted to work because of their financial vulnerability.
     - The facilitator then announces the number of people who struck and the number who worked. But not who.
     - If at least 80% (16 out of 20) strike, then the strike continues. If less, the strike collapses and the union fails (administration sees weakness and refuses to negotiate). The simulation ends with 0 raise and strike days cost points.

   Round 4: (Strike Day 2) - same as Day 1.

   Round 5: (Strike Day 3) - same as Day 1.

   After Round 5:
     - If the strike was maintained for 3 days with at least 80% participation each day, the union wins the 5% raise. 
     - Then, points are calculated:
          - Each day a participant struck: -1 point (for each of the strike days they were on strike)
          - If the union wins: +10 points
          - If a participant worked on a strike day: they get 0 for that day (no loss) but they still get the +10 if the union wins? That's the free rider problem. They avoid the cost and get the benefit.

     However, note: we want to show that free riding is harmful to the collective. So we adjust the rules for the simulation to reflect that if too many free ride, the strike fails. Also, we want to highlight the individual choice.

     But in the calculation, the free rider gets:
        - No strike days: so no loss of points (they worked and got paid for those days) 
        - Plus the 10 points if the union wins.

     The strikers get: 10 - (number of strike days they were out) = 10 - 3 = 7 points.

     This shows the incentive to free ride.

     However, we also have the rule that if on any day the strike participation falls below 80%, the strike fails and no one gets the 10 points (only the losses for the days they were out).

     So, if the free rider (and others) cross the line and the strike collapses, then:
          - Those who struck on Day 1 and Day 2 (if the collapse is on Day 3) lose 2 points and get nothing more.

     This is the risk.

   Timeline for the simulation:

     Round 1: 0 points (normal day) - 1 minute
     Round 2: Vote (5 minutes discussion, 2 minutes vote) - 7 minutes total
     Round 3: Strike Day 1 - collect private notes (2 minutes), then announce participation (1 minute) - 3 minutes
     Round 4: Strike Day 2 - same (3 minutes)
     Round 5: Strike Day 3 - same (3 minutes)

     Then calculate points and announce outcomes (5 minutes).

     Total simulation time: ~22 minutes (plus transitions, so 25 minutes).

     We have 90 minutes, so we can spend more time on debrief and setup.

   Revised Timeline:

     Introduction: 5 minutes
     Setup and Role Assignment: 10 minutes (assign roles, explain rules and points)
     Simulation: 30 minutes (allowing for more discussion in the vote and between rounds)
     Debrief: 30 minutes

     Total: 75 minutes (with 15 minutes buffer)

   What predictably goes wrong the first time?
     - Participants might not take the free-rider role seriously enough (underplay it) because they don't want to be seen as the bad guy.
     - The vote might be lopsided in favor of striking because it's a training and people know the lesson, but we can encourage the Skeptics and Principled Objector to voice their concerns.
     - The Principled Objector might not be vocal enough, so the facilitator should check in with them privately to remind them of their role.
     - Someone might feel personally accused if they are assigned the Free Rider role. Therefore, we should emphasize that these are roles and not reflective of real character.

   What the simulation cannot reproduce and you will have to state:
     - The simulation cannot fully capture the emotional and social costs of crossing a picket line (ostracism, guilt, etc.). In reality, the social pressure and norms are strong.
     - The long-term nature of the gains: the simulation compresses time. In reality, the 5% raise compounds and the strike loss is a one-time hit.

   Debrief Structure:

     Step 1: How did it feel? (5 minutes)
       - Ask participants to share one word about their experience.

     Step 2: What happened? (5 minutes)
       - Review the outcome: did the strike happen? Did it succeed? How many crossed the line? (Reveal the free rider and others who crossed if they are willing, but don't force. Use aggregate numbers.)

     Step 3: Mapping to the key lessons (10 minutes)
       a) Public good and free riding:
          - The 5% raise is a public good: non-excludable and non-rival. Once achieved, everyone gets it.
          - But the cost (strike) is borne only by those who strike. Hence, the incentive to free ride.
          - Ask: How did the free rider's actions affect the outcome? What if more people had free ridden?

       b) Binding the minority:
          - The vote bound everyone, even those who voted against. How did the Skeptics and the Principled Objector feel about being bound?
          - Point out: the strike only works if it is collective. The majority decision must be respected to have the power to win.

     Step 4: The fairness question (5 minutes)
       - The Principled Objector: their objection is not selfish. How should the union handle such objections?
       - Note: In a democratic union, the majority decision must be respected, but there can be accommodations? (e.g., in real life, sometimes essential services are maintained). However, the strike must still be effective.

     Step 5: Organizing as a right of association vs. striking as coercion (5 minutes)
       - The right of association allows workers to form a union and bargain collectively.
       - The strike is a form of collective coercion (toward the employer) but also requires internal discipline (coercion of one's own side to not free ride). This is necessary for the collective action to work.
       - What to say to members who want the gains without the discipline? 
            - "If everyone thought that way, we would have no power. We all have to do our part."
            - "The union is only as strong as its members' commitment. When we stand together, we win."

     Step 6: Final reflections (5 minutes)

     Total debrief: 35 minutes (but we have 30 allocated, so adjust).

     Note: Be prepared to state what the simulation couldn't capture.

   Implementation:

     Materials:
       - Role cards (20): 
            * 16 x "Regular Staff": You are a regular employee. You want the 5% raise but are worried about the strike costs. You will discuss and vote.
            * 2 x "Skeptic": You are in a financially vulnerable situation (e.g., single parent, high debt). You cannot afford to lose even one day's pay. You are worried about the strike and might not support it.
            * 1 x "Principled Objector": You believe that a strike would harm patient care. You have an ethical objection to striking, regardless of the raise.
            * 1 x "Free Rider": You are assigned to try to avoid striking and then benefit from the gains. You will pretend to support the strike but secretly plan to work during the strike days if you think you can get away with it.

       - A way to collect private decisions (small slips of paper for strike days).

     Facilitator Script:

       Introduction (5 min):
          "Welcome. Today we'll run a simulation to understand two key aspects of union power: the challenge of collective action and the importance of solidarity during a strike. You'll be assigned roles. We'll have a vote and then three rounds of a strike scenario. Remember, the roles are not you. We are here to learn."

       Setup (10 min):
          - Assign roles by handing out cards. Make sure the Free Rider and Principled Objector know their roles and keep them secret.
          - Explain the payoff system and rules.

       Simulation:
          Round 1: "It's a normal workday. Everyone works. No strike. Everyone gets 0 points."
          Round 2: "The union has called a strike authorization vote. You have 5 minutes to discuss in your small groups. Then we vote by show of hands. Majority wins, and if passed, the strike begins tomorrow and everyone must strike."
          Round 3 (if strike authorized): "Strike Day 1: Please write on the slip whether you will 'Strike' or 'Work'. Remember, if less than 80% of us strike today, the strike collapses and we lose. Collect slips, count, and announce the percentage and whether the strike continues."
          Round 4 and 5: same.

          After Round 5: "The strike has ended. We will now calculate points."

          Calculation:
            - For each day:
              * If you struck: -1 point
              * If you worked: 0 points (but note: if the strike failed because of low participation, then even if you struck, you get the losses and no win bonus)
            - If the strike succeeded (3 days with >=80% participation each day): add 10 points to everyone.

          Example: 
            - A striker who struck all 3 days: -3 + 10 = 7 points.
            - A free rider (worked all 3 days): 0 + 10 = 10 points (if the strike succeeded).

          But if the strike failed (because on any day participation was below 80%), then no 10 points. So:
            - A striker on Day 1 and 2 (if the strike fails on Day 3): -2 points (if they struck only two days) and 0 from the bonus -> total -2.

       Debrief: Follow the steps above.

     Important: The simulation might not have a free rider if the assigned free rider decides to strike. That's okay. The point is to discuss the incentive. Also, the strike might fail. That's a learning moment.

     What to state explicitly:
       - The simulation cannot capture the real-life social pressure and the long-term consequences of free riding (like loss of trust). In reality, unions often have rules against crossing the picket line and enforce solidarity.
       - The simulation also simplifies the economic impact: the 10 points are a one-time bonus, but in reality, a raise compounds and the strike loss is a temporary hardship.

     This design should create a visceral understanding of the two lessons.
answer: |-
  Below is a comprehensive 90-minute session design using a simulation to convey the two core lessons. The structure includes setup, simulation, debrief, and facilitator guidance to address predicted challenges and gaps.

  ---

  ### **Session Title:** "The Power & The Price: A Strike Simulation"  
  **Duration:** 90 minutes  
  **Participants:** 20 new stewards  
  **Goal:** Experience how free-riding threatens collective power, and why binding minority decisions is non-negotiable for strike success.  

  ---

  ### **Session Flow**  

  #### **1. Introduction (10 mins)**  
  - **Context (5 mins):** Briefly share your story—how the strike taught you that power relies on overcoming free-riding and enforcing solidarity. Frame the session: "Today we’ll simulate a contract fight where your choices determine if we win or lose."  
  - **Rules & Roles (5 mins):**  
    - *Payoff Scheme:* **Points system** (points = "well-being units," not money).  
    - *Timeline:* 5 rounds (each = 1 week of bargaining).  
    - *Win/Loss:*  
      - **Win:** 100 points each if strike succeeds (5% raise).  
      - **Loss:** 0 points if strike fails (0% raise).  
    - *Strike Cost:* -10 points per round for anyone who strikes (lost wages). Free riders pay 0 but still gain if strike wins.  

  ---

  #### **2. Simulation Setup: "Metro Hospital Contract Fight" (15 mins)**  
  - **Roles (Assign via cards):**  
    | Role | # Players | Motivation | Secret Instructions |  
    |---|---|---|---|  
    | **Pro-Strike Worker** | 10 | "I’ll strike to win the raise—we deserve it!" | Push hard for strike; vote YES. |  
    | **Skeptic** | 5 | "I can’t afford to lose wages. What if we fail?" | Vote NO unless convinced otherwise. |  
    | **Principled Objector** | 1 | "Strikes harm patients. I took an oath to prioritize care." | Refuse to strike on ethical grounds. |  
    | **Free Rider** | 4 | "I’ll let others take the risk—I’ll keep working." | Pretend to support strike but never strike. |  

  - **Timeline & Process:**  
    - **Round 1:** Vote to authorize strike (simple majority wins).  
    - **Rounds 2–4:** Weekly bargaining updates. If strike authorized, all must declare weekly: **STRIKE** (-10 points) or **WORK** (0 points, but free-riding).  
    - **Round 5:** Outcome revealed (strike wins if ≥80% struck all weeks; fails otherwise).  

  ---

  #### **3. Simulation (35 mins)**  
  - **Round 1: Strike Authorization Vote (5 mins)**  
    - Groups discuss (3 mins). Pro-strike workers lobby skeptics.  
    - *Vote:* Public show of hands. If majority YES, strike is binding. **Emphasize:** "If passed, all must strike—no exceptions."  
    - *Predictable Issue:* Skeptics/objectors may feel pressured. Remind them their role is valid.  

  - **Rounds 2–4: Weekly Decisions (10 mins total; 3–4 mins/round)**  
    - Bargaining updates (facilitator shares):  
      - *Week 2:* "Hospital refuses 5% raise. Strike or work?"  
      - *Week 3:* "Media covers strike; public support grows."  
      - *Week 4:* "Hospital offers 2%. Hold the line?"  
    - *Private Action:* Each player writes "STRIKE" or "WORK" on a slip. Collect and tally (announce participation % but not who crossed).  
    - *Key Moment:* If participation dips below 80%, strike fails early.  

  - **Round 5: Outcome & Points (5 mins)**  
    - Calculate points:  
      - Strikers: -30 points (if 3 weeks) + 100 if win.  
      - Free riders: 0 points + 100 if win.  
    - Reveal strike success/failure based on participation.  

  ---

  #### **4. The Binding Choice (10 mins)**  
  - **Minority Accountability Scenario:**  
    - Assign a "Skeptic" or "Principled Objector" who voted NO but was bound.  
    - Pair them with a "Pro-Strike Worker" who lost wages.  
    - **Prompt:** "The objector must decide: What do you owe your colleague who struck for you? Apologize? Share points? Why/why not?"  
    - *Facilitate discussion:* Highlight tension between individual ethics and collective responsibility.  

  ---

  #### **5. Debrief (20 mins)**  
  **Guiding Questions:**  
  1. **Public Good vs. Free-Riding:**  
     - "How did free-riding affect our outcome? Why is it rational for individuals but catastrophic for the group?"  
     - **Key Point:** "The union’s power is a lighthouse—it guides everyone, but only if we all maintain it."  

  2. **Binding the Minority:**  
     - "Principled Objector/Skeptics: How did it feel to be bound by a vote you opposed? Was it fair?"  
     - **Key Point:** "A strike isn’t democracy—it’s democracy with teeth. The minority’s sacrifice is the price of power."  

  3. **Organizing vs. Striking:**  
     - "Organizing is the right to associate; striking is the coercion to act. How do we justify coercing our own?"  
     - **Response Script for Gains-Without-Discipline Members:**  
       > *"If you want the raise but won’t strike, you’re asking coworkers to bleed for you. That’s not solidarity—it’s exploitation. Our power comes from* shared risk, *not shared wishes."*  

  4. **Principled Opposition:**  
     - "How do we honor ethical objections (e.g., patient care) without fracturing solidarity?"  
     - **Key Point:** "Principles aren’t selfish—but they can’t veto collective survival. We find compromises (e.g., essential staffing), but the strike must go on."  

  ---

  ### **What Predictably Goes Wrong & How to Fix**  
  - **Free-Riding Underplayed:** Players may avoid free-riding to "be nice." *Mitigation:* Assign 4 Free Riders secretly—remind them their role is to test the system, not cheat.  
  - **Personal Accusations:** The Principled Objector may feel attacked. *Mitigation:* Pre-brief them: "Your role is crucial to show fairness isn’t about greed."  
  - **Vote Feels Theoretical:** Emphasize binding consequences in Round 1: "If YES wins, you *will* strike—no backsies."  

  ### **What the Simulation Can’t Replicate (State Explicitly)**  
  > **"In this game, points are painless. Real strikes mean lost rent, hungry kids, and broken trust if you cross. The simulation can’t capture that terror or guilt. That’s why we enforce solidarity so fiercely—because when the stakes are life-and-death, we can’t afford free riders."**  

  ---

  ### **Materials Needed**  
  - Role cards (10 Pro-Strike, 5 Skeptic, 1 Principled Objector, 4 Free Rider).  
  - Voting slips + tally sheet.  
  - Timer.  
  - Whiteboard for points tracking.  

  This design forces stewards to *feel* the tension between individual choice and collective power—and leaves no ambiguity about why solidarity is non-negotiable.
