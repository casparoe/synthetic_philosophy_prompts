answer: |-
  This legal pattern reflects a **hybrid theory of speech acts**, blending objective convention with subjective intent in a structured hierarchy. It presupposes that:

  1.  **The *Conventional Act* creates a *prima facie* commitment:** Publicly recognized conventional signs (clicks, signatures, emojis, algorithm outputs) are treated as *performative* by default. Their meaning and illocutionary force (promising, offering, accepting) are defined by social/legal/institutional conventions, not solely by the speaker's hidden state of mind. Clicking "I agree" conventionally *is* agreeing within the platform context.

  2.  **The *Speaker's Intention* determines *validity*:** While convention establishes the act's *form*, the speaker's actual intention (or lack thereof) acts as a *defeasibility condition*. If the requisite intention (to be bound, to assent seriously) is fundamentally absent or vitiated (joke, specific mistake about identity/subject matter, duress, incapacity), the *prima facie* commitment is voidable or void.

  **Why the Unread Click/Bot Binds, but the Joke Does Not:**

  *   **Unread Click:** The *conventional act* is performed (clicking "I agree" = assent). The system presumes intent *from the act* based on convention. The user's *failure to read* isn't a *vitiation* of intent equivalent to joking or mistake about terms; it's negligence or assumption of risk. The convention overrides the lack of *actual understanding*, but not the lack of *intent to contract at all*.
  *   **Algorithm's Output:** The act is conventional within the trading system (order transmission = offer/acceptance). The intent is attributed *derivatively* (the programmer/trader intended the algorithm to act) or *institutionally* (the rules of the exchange *define* such outputs as binding acts of the principal). There is no *vitiated intent* at the moment of transmission because the system substitutes institutional convention for instantaneous human intention.
  *   **Joke:** The conventional act *might* be present (e.g., saying "I accept"), but the *intention* requisite for the illocutionary force (serious commitment) is absent. The convention is overridden because the context or private fact reveals the act wasn't *meant* as the convention dictates.

  **Rival Accounts Ruled Out:**

  1.  **Pure Intention-Based Theories (Strong Subjectivism):** If *only* the speaker's private intention constituted the speech act, then the unread click (no intention to assent to *those* terms) and the bot's act (no conscious intention at all) could *not* bind. The law's reliance on objective manifestations rules this out.
  2.  **Pure Convention-Based Theories (Strong Objectivism/Formalism):** If *only* the conventional form mattered, then the joke, the signature under duress, or the mistaken acceptance *would* bind, regardless of the speaker's internal state. The law's defeasibility rules based on private facts rule this out.
  3.  **Theories Ignoring Defeasibility:** Accounts that treat performatives as *automatically* successful upon utterance (early Austinian "Infelicities" notwithstanding) cannot explain why vitiated intent nullifies the act despite its conventional form.
  4.  **Literal Meaning Primacy:** Theories prioritizing only the semantic meaning of words over the illocutionary act in context cannot explain why a thumbs-up emoji (semantically ambiguous) is treated as acceptance based on convention/context.

  **Internal Consistency:**

  The system is **internally consistent** because it establishes a clear hierarchy and burden of proof:

  *   **Step 1 (Objective/Conventional):** Did the party perform a conventional act recognized as creating a commitment (click, signature, emoji, bot output)? If yes, a *prima facie* agreement exists.
  *   **Step 2 (Subjective/Intent):** Can the party asserting vitiation prove the absence/vitiation of the requisite intention (joke, operative mistake, duress, incapacity) *at the time of the act*? If yes, the *prima facie* agreement is defeated.

  The reliance on "private facts" doesn't invalidate the initial conventional act; it provides a *defense* showing the act was not a *valid* instance of the convention due to flawed intent. The "public mark" creates a presumption; the private fact rebuts it.

  **Consequences of Adopting Rival Views:**

  1.  **Purely Convention-Based View:**
      *   **Platforms:** Could rely *solely* on the click/action. No need for scrollable terms, "I have read" checkboxes, or conspicuous presentation. Any click in the right place = binding assent, *even if demonstrably accidental or done as a joke*.
      *   **Automated Transactions:** Bot outputs would *always* bind the principal, regardless of bugs, unforeseen market conditions, or whether the algorithm operated outside its programmed parameters. "The machine did it" would never be a defense.
      *   **Courts:** Would *never* consider evidence of joke, mistake (even fundamental), duress, or incapacity. The form would be conclusive. Contracts could be formed against one's will or understanding simply by triggering a conventional signal.

  2.  **Purely Intention-Based View:**
      *   **Platforms:** Would need *proof* of actual subjective understanding and assent for *each user* at the *moment* of clicking. This is impossible at scale. Platforms might require live verification calls, detailed questionnaires, or recorded confirmations for every transaction, destroying efficiency and usability. "I agree" buttons would become meaningless without proof of actual reading/comprehension.
      *   **Automated Transactions:** Would become legally perilous. Every algorithmic trade could be challenged on the basis that *no human formed the specific intention* at the nanosecond the order was sent. Courts would need to delve into code and system states to find "intent," creating massive uncertainty. High-frequency trading would likely collapse.
      *   **Courts:** Would be inundated with challenges based on alleged lack of subjective intent ("I didn't mean it," "I didn't understand"), making contract enforcement incredibly difficult and unpredictable. Silence could *easily* be argued as lack of intent to accept.

  **Conclusion:**

  The prevailing legal practice embodies a sophisticated **objective theory of contract formation grounded in conventional speech acts, tempered by subjective defenses for vitiated consent.** It rules out pure subjectivism and pure formalism. It requires that promising, offering, and accepting be *recognized* by public convention (defining the act) but *validated* by the appropriate private intention (or its institutional derivative/proxy in the case of bots). This hybrid approach balances the need for transactional certainty and efficiency (relying on objective signs) with the fundamental principle that contractual obligation requires genuine consent (allowing defenses based on vitiated intent). Changing to either pure model would have drastic, likely unacceptable, consequences for modern commerce and digital interaction.
