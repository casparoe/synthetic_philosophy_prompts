  *   v2.3 (2029): Added Wireheading Accommodation Clause (Legal/Compliance)
  *   v3.0 (2030): Major restructuring emphasizing Welfare=Reward alignment; Revised Withdrawal limitations.
  *   v4.0 (Jan-2031): Incorporated temporal discounting justification; Refined mesa-optimization risk language.
  *   v4.1 (Feb-2031): Added Vance comment (annotated); Clarified `S_wdr` detection protocol.
  *   **v4.2 (Mar-2031):** Final Compliance & Legal Approval. Updated Contact Info.

