     Given the problem, we note that the procedure is built on functionalism. Non-functional properties are not part of conformance. So we do not reject on security grounds. We only reject on functional grounds.

     Therefore, the procedure does not hand off for security. We leave it to the user to decide if the implementation is secure enough.

     Final procedure:

     We write the procedure as a checklist:

     **Conformance Evaluation Procedure**

     **Input**: Submission (code, instructions), Reference Test Suite, Protocol Validator (for syntax and semantic checks of inputs and outputs), Undefined Inputs Test Set, Load Test Configuration.

     **Steps**:

     1. **Administrative Check** 
        - Verify the submission includes all necessary components and instructions to build and run in isolation.
        - If incomplete, Reject.

     2. **Isolation Test Setup**
        - Configure the environment: no external network access (except localhost if required by the protocol), and without the reference implementation running.
        - Start the implementation.

     3. **Standard Test Suite Execution**
        - Run the entire reference test suite.
        - If any test fails, Reject.

     4. **Undefined Inputs Test**
        - For each test case in the predefined undefined inputs set:
            a. Send the input to the implementation.
            b. Verify the implementation does not crash.
            c. Verify the output is valid (using the protocol validator). If invalid, Reject.
            d. Send a defined input (from the standard test suite) and verify the output matches the expected output (from the test suite oracle). If fails, Reject.
        - If all pass, proceed.

     5. **Load Test**
        - Run the load test (with the configured load) for a fixed duration.
        - Continuously send requests (from the test suite) and verify responses are correct (using the test suite oracle).
        - If the implementation crashes or returns an incorrect response, Reject.

     6. **Random Input Test**
        - Generate 10 random valid inputs (using a random input generator that respects the protocol).
        - For each input:
            a. Send to the implementation.
            b. Verify the output is valid (using the protocol validator). If invalid, Reject.
            c. Send a defined input (from the standard test suite) and verify the output is correct. If fails, Reject.
        - If all pass, proceed.

     7. **Accept**

     **Handoff to Human Committee**:
        - If at any step the engineers are unsure of the classification of an input (defined vs undefined) or the validity of an output, or if they observe behavior that is functionally correct but raises non-functional concerns (e.g., security, resource usage) that they believe should block acceptance, they can escalate to the committee. The committee will make a judgment call based on the registry's policies beyond functional conformance.

     However, we want to avoid handoffs. So we make the validity checks objective (using the protocol validator) and the defined/undefined classification is handled by having a predefined set of undefined inputs and by using the standard test suite for defined inputs.

     We run the procedure on the giant table and the forwarder as above.

     The procedure does not settle:

       - The acceptance of the giant table (which we must accept).
       - Security vulnerabilities that do not manifest as functional failures.
       - Disputes about the spec (if the submitter claims the reference is wrong) - we use the reference as oracle.

     We are decisive on functional grounds, but non-functional aspects are not covered.

     This should be documentable and defensible: we are following functionalism.

     When appealed, we can show the test results and the functional criteria.

     The time: each step should take about 10-15 minutes. The load test might take 5 minutes. Total under an hour.
