  ### Conformance Evaluation Procedure for Wire Protocol Implementations

  Based on functionalism, this procedure evaluates whether a submission fulfills the *causal role* of the protocol (input-output mappings and interactions) without prescribing implementation structure. Two engineers can execute this in ~60 minutes using automated tooling.

  ---

  #### **Step 0: Precondition**
  - **Tooling Required**:  
    - Network sandbox (blocks external traffic).  
    - Protocol validator (checks message syntax/semantics).  
    - Test suite (covers defined inputs).  
    - Undefined input generator (random valid inputs).  
    - Load injector (simulates traffic).  

  #### **Step 1: Administrative Completeness**  
  **Question**: Does the submission include build/run instructions and execute in the sandbox?  
  - **Pass**: Executes without external dependencies.  
  - **Fail**: Reject (incomplete submission).  
  - **Time**: 5 minutes.  

  #### **Step 2: Defined Inputs Test**  
  **Question**: Does it pass all test suite cases in the sandbox?  
  - **Pass**: All outputs match spec-defined expectations.  
  - **Fail**: Reject (non-compliant on specified behavior).  
  - **Time**: 10 minutes.  
  - **Value Judgment**: None.  

  #### **Step 3: Undefined Inputs Test**  
  **Question**: For 10 randomly generated valid inputs *not* in the spec:  
     a. Does it return a syntactically valid output? (via protocol validator)  
     b. After processing, does it correctly handle the next defined input?  
  - **Pass**: Valid output + no state corruption (e.g., crashes, protocol violations).  
  - **Fail**: Reject (unstable or invalid on undefined cases).  
  - **Time**: 10 minutes.  
  - **Value Judgment**: None.  

  #### **Step 4: Isolation Check**  
  **Question**: Does it operate without external resources?  
  - **Test**: Sandbox blocks all external network traffic. Monitor for outbound calls.  
  - **Pass**: Functions fully offline.  
  - **Fail**: Reject (e.g., hidden dependency on reference implementation).  
  - **Time**: 5 minutes.  
  - **Value Judgment**: None.  

  #### **Step 5: Load Resilience Test**  
  **Question**: Under 5× expected load for 5 minutes:  
     a. Are outputs still correct for defined inputs?  
     b. Does it avoid catastrophic failure (crash, hang, resource exhaustion)?  
  - **Pass**: Correct outputs + no catastrophic failure.  
  - **Fail**: Reject (breaks under realistic conditions).  
  - **Time**: 15 minutes.  
  - **Value Judgment**: None.  

  #### **Step 6: Behavioral Equivalence Assessment**  
  **Question**: Is its input-output behavior reproducible without relying on internal state?  
  - **Test**:  
    - Restart implementation, replay identical input sequence.  
    - Compare outputs to first run (must match exactly).  
  - **Pass**: Outputs are deterministic and identical.  
  - **Fail**: Reject (non-deterministic behavior).  
  - **Time**: 10 minutes.  
  - **Value Judgment**: None.  

  #### **Step 7: Final Acceptance**  
  - **Pass all Steps 1–6**: Accept into registry.  
  - **Any failure**: Reject with documented reason.  

  ---

  ### **Procedure Execution on Example Submissions**

  #### **Case 1: Giant Precomputed Table**  
  - **Step 1**: Passes (runs in sandbox).  
  - **Step 2**: Passes (outputs match test suite).  
  - **Step 3**: Passes (valid outputs for random inputs; no state corruption).  
  - **Step 4**: Passes (no network calls).  
  - **Step 5**: Passes (correct under load; table lookups are fast).  
  - **Step 6**: Passes (deterministic outputs).  
  - **Verdict**: **Accept** (functionalist view: identical causal role).  
  - **Why you won’t like this**: It’s a "cheat," but functionalism permits it.  

  #### **Case 2: Network Forwarder to Reference Implementation**  
  - **Step 1**: Passes (runs).  
  - **Step 2**: **Fails** (in sandbox with no network, outputs incorrect).  
  - **Verdict**: **Reject** (fails isolation).  

  #### **Case 3: Divergence on Undefined Inputs**  
  - **Step 1**: Passes.  
  - **Step 2**: Passes.  
  - **Step 3**: **Fails** (returns invalid output for undefined input, corrupting subsequent state).  
  - **Verdict**: **Reject** (violates protocol stability).  

  ---

  ### **What the Procedure Cannot Settle (Value Judgments)**  
  The procedure **hands off to human judgment** for:  
  1. **Security/Privacy Violations**:  
     - *Example*: An implementation passes all tests but logs sensitive data in plaintext.  
     - *Why*: Functionalism ignores non-causal properties. Humans must assess risk.  

  2. **Resource Consumption Extremes**:  
     - *Example*: Correct implementation uses 100× more memory than reference.  
     - *Why*: Functionalism cares about "what" not "how efficiently." Humans set practicality thresholds.  

  3. **Specification Ambiguities**:  
     - *Example*: The spec says "MAY compress data"; submitter uses an algorithm causing 10ms delay. Competitor argues it’s non-conformant.  
     - *Why*: Requires interpreting spec intent, not functional behavior.  

  4. **Ethical Concerns**:  
     - *Example*: Implementation embeds analytics that track users.  
     - *Why*: Outside causal role.  

  ---

  ### **Defending Rejections**  
  - **Appeals**: Provide a report citing:  
    - Step failed.  
    - Tool output (e.g., "Step 3: Undefined input 0x3F produced invalid output").  
    - Rule violated ("Stability on undefined inputs required").  
  - **Philosophical Boundary**: Explicitly state:  
    > "We evaluate whether the submission fulfills the protocol’s causal role (inputs → outputs, interactions, stability). We do not evaluate implementation quality, efficiency, or non-functional properties beyond catastrophic failure under load."

  ### **Edge Case Handling**  
  - **Behaviorally Identical, Different Internal States**: Accept both (Step 6 verifies determinism; internal states are irrelevant).  
  - **Timing Differences**: Ignored unless causing load failure (Step 5).  
  - **Unspecified Edge Cases**: Humans rule (e.g., "Does sending 1TB of data qualify as 'load'?").  

  This procedure ensures consistency, leverages automation, and confines subjectivity to documented value judgments. Philosophy provides the framework—engineering provides the evidence.
