prompt: |-
  Ok, longtime lurker on the rationalist blogs here, and I've been going down a rabbit hole on "which computations matter morally." I want a thought experiment built to order, not an essay. I keep going back and forth on wether moral status attaches to the computation itself or to the boundary of the thing running it, and I want the case to force the issue.

  The variable I want isolated: one single computation spread across two organisms, such that a computationalist is pushed to say there's one subject there, while an organism-boundary view is pushed to say there are two — and both verdicts have to fall out of the theories, not be stipulated by me.

  Constraints:
  - No exotic physics, no perfect simulators, no "imagine a machine that...". A high-bandwidth neural link between two adult humans — a beefed-up version of what's already in labs — is the fanciest thing allowed.
  - Dont stipulate that the pair feels like one person or like two. That's exactly what the case is supposed to settle.
  - It has to be genuinely one computation, not two people cooperating. Ideally something neither half can do alone, and something where neither half can tell from the inside which half it is. Sharpen this as far as you can without hiding behind the word "integration."
  - The scenario itself: one paragraph, max.

  Then, for each of these, state the verdict and why: (a) a coarse-grained functionalist; (b) someone who thinks a subject needs a single biological organism as its substrate; (c) someone who thinks a subject needs a self-model that represents the whole system as itself. Tell me which single feature of the case is doing the work. Then say what happens if I remove that feature — the link goes one-way, the bandwidth drops, the two halves are the two hemispheres of one person, whatever you think is the cleanest stress test. Finally, if one of the three views comes out badly, tell me how its defender would attack the case instead of accepting the verdict.

  No cites or reading list needed. Under 700 words, and lead with the bottom line — one sentence saying what the case shows, then build it.
reasoning: |-
  Hmm, the user is asking for a thought experiment that isolates a philosophical dilemma about moral status and consciousness. They want a scenario where a single computation is shared across two humans via a neural link, forcing a conflict between computationalist and organism-boundary views of consciousness.

  The constraints are clear: no exotic physics, no stipulation about unified experience, genuine single computation across two organisms, and maximum one paragraph. The user also wants analysis for three specific views: functionalist, biological-substrate view, and self-model view.

  I need to design a scenario that meets all these criteria. The "shared sensorimotor loop" idea seems promising: two people performing complementary parts of a task via high-bandwidth neural link, with neither having access to the full information stream. This creates true interdependence - neither can perform the task alone, and each receives processed data they can't distinguish from their own sensory input.

  For the analysis: 
  The functionalist should see one subject because the entire system functions as a unified processor. 
  The biological-substrate view will insist on two subjects because there are two distinct organisms. 
  The self-model view will see two subjects because each brain models only its own body.

  The key feature is the closed-loop mutual dependency - removal of either agent breaks the computation. If I reduce bandwidth to make the link imperfect, all views converge on two subjects. The biological view doesn't really "lose" here - it would simply reject computationalism and maintain that subjective experience can't span organisms.

  The thought experiment effectively exposes the fault line in theories of consciousness by forcing a contradiction between functional unity and physical separation. It shows that computationalism requires accepting consciousness as substrate-independent in ways that violate biological intuitions.
answer: |-
  **Bottom line:** This case forces computationalism to either deny that moral status attaches to subjects (by fragmenting the single computation across two bodies) or accept that two organisms can constitute one subject, while the other views comfortably see two subjects.

  **The Case:** Two adults, Alice and Bob, are linked via a permanent, high-bandwidth, bidirectional cortical interface. They perform a single, constant, integrated computation: maintaining real-time, millimeter-precise balance of a shared inverted pendulum (like balancing a pole on your finger) using their combined motor outputs. The computation *requires* both: Alice receives only the pendulum's visual position and controls fine wrist adjustments; Bob receives only the tactile pressure feedback and controls gross shoulder/arm movements. Each receives *only* their processed input stream and sends *only* their motor commands; neither has access to the other's raw data or internal state. Critically, *neither* perceives the pendulum's full state (visual+tactile) nor controls the full response; the computation only completes across the link. From the inside, each experiences only "doing my part to balance *something*" – they cannot introspectively determine if they are part of one system or coordinating with another agent.

  **Verdicts & Why:**

  1.  **Coarse-grained Functionalist (a):** One subject. The *entire feedback loop* (pendulum state -> sensory input -> integrated processing -> motor output -> pendulum state) is the minimal functional unit realizing the computation. Neither half works alone; the computation is distributed but singular. Moral status attaches to this functional whole.
  2.  **Biological Substrate Advocate (b):** Two subjects. The essential boundary is the biological organism. Alice and Bob are distinct biological entities, each running their own neural processes, even if tightly coupled. The computation spans two substrates, but subjects are defined by *being* an organism. Two organisms, two subjects.
  3.  **Self-Model Advocate (c):** Two subjects. Each brain possesses a self-model representing *its own body* as the locus of control and sensation. Alice's self-model represents Alice's body receiving visual input and making wrist movements; Bob's represents Bob's body receiving tactile input and making arm movements. There is no single self-model encompassing both bodies or the whole system. Two distinct self-models, two subjects.

  **Key Feature:** **Mutual Dependency & Opaque Partitioning.** The computation *fundamentally requires* both halves, and crucially, *neither half has access to the information or control of the other, nor can it introspect its role as "part" of a larger whole.* This forces the functionalist to see one system but blocks the self-model view from forming a unified self, while the biological view remains unaffected.

  **Stress Test (Remove Mutual Dependency):** Make the link **one-way** (e.g., Alice sends processed visual data to Bob, but Bob sends nothing back; Bob controls the pendulum alone using Alice's data). Now:
  *   (a) Functionalist sees *two* computations: Alice processing vision (perhaps a subject), Bob processing Alice's data + tactile + motor (another subject).
  *   (b) Biologist still sees two subjects.
  *   (c) Self-model view still sees two distinct self-models (Alice's: vision processing; Bob's: receiving external data + control).
  All views converge on two subjects. The mutual dependency was the key forcing function for the functionalist's single-subject verdict.

  **The Biological View's Defense:** If the functionalist verdict (one subject) seems counterintuitive or problematic, the Biological Substrate Advocate (b) doesn't need to "attack" the case per se. They simply **reject computationalism's premise** that moral status primarily attaches to computations/subjects defined functionally. They argue the biological organism *is* the necessary and sufficient physical substrate for morally relevant consciousness. They point to the case as a *reductio* showing computationalism leads to absurd conclusions (one mind in two bodies) precisely because it ignores this fundamental biological grounding. They maintain that Alice and Bob, despite the coupling, are obviously two distinct conscious beings based on their physical separation and biological individuality.
