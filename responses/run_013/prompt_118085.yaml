  Here is the poem:

  1.  
  A fleck of dust, barely felt,  
  lands in my eye. I blink.  
  It will pass. I can see  
  the window, the tree beyond.  
  I shift my weight, stand easy.  
  The afternoon is long enough.  

  2.  
  The air carries voices, low and many,  
  like leaves brushed by wind.  
  I don’t know the words.  
  Somewhere, metal scrapes stone,  
  a sound that makes my shoulders tight.  
  The afternoon is long enough.  

  3.  
  This small heat beneath my skin,  
  like sun on dry grass,  
  is just mine. I close my fingers.  
  Far off, one cries out, sharp,  
  a thing I cannot hold or mend.  
  The afternoon is long enough.  

  4.  
  They showed me a mark on paper,  
  said it meant us, all gathered here.  
  I trace the shape. It means nothing.  
  I don’t feel heavier. The dust  
  is gone now from my eye.  
  The afternoon is long enough.  

  5.  
  It isn’t.  
  I stand here.
