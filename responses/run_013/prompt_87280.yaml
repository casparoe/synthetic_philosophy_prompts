answer: |-
  ## Joint Statement: Adversarial Collaboration on Vagueness (Epistemicism vs. Supervaluationism)

  **Signed:** [Friend 1, Epistemicist] & [Friend 2, Supervaluationist]

  **(1) Shared Ground: The Phenomenon & Explanatory Goals**

  We, the undersigned, agree on the following foundational points regarding vagueness:

  1.  **The Core Phenomenon:** Vague predicates (e.g., "heap", "bald", "tall") admit of borderline cases – instances where competent speakers applying the predicate according to its established meaning consistently feel hesitation, exhibit significant inter-subjective disagreement, or resist classifying the instance definitively as satisfying or not satisfying the predicate, even under ideal conditions.
  2.  **The Sorites Paradox:** The Sorites Paradox compellingly demonstrates that classical bivalent logic and semantics (where every declarative sentence is determinately true or false) face a severe challenge when applied to vague predicates. Any proposed sharp boundary for such predicates seems arbitrary and incompatible with their inherent "tolerance" (small changes don't seem to make a difference in category membership). The paradox highlights the need for a non-classical account.
  3.  **What an Explanation Must Do:** A semantic theory of vagueness must:
      *   **Account for Borderline Cases:** Explain the nature and source of the hesitation, disagreement, and resistance to classification observed in borderline instances.
      *   **Respect Tolerance:** Accommodate the intuition that very small changes (e.g., adding/removing one grain, one hair) do not *seem* to make a difference in category membership near the borderline.
      *   **Explain the Illusion of Boundarylessness:** Account for the strong, persistent intuition that there *is no sharp boundary* between, say, heaps and non-heaps.
      *   **Avoid Arbitrariness (in Explanation):** The explanation itself must not rely on arbitrary stipulation where the phenomenon suggests none exists. (Note: This does *not* preclude the epistemicist's *semantic* boundary being arbitrary in a specific sense; see disagreements below).
      *   **Integrate with Broader Semantics:** Be compatible with a plausible overall theory of meaning, reference, and language use.
  4.  **The Status Quo is Unsatisfactory:** Neither purely psychological explanations (ignoring semantics) nor simply declaring all borderline statements "neither true nor false" without a robust semantic machinery counts as an adequate explanation. The phenomenon demands a semantic account.

  **(2) Exact Remaining Disagreements**

  Each undersigned affirms the following as a fair and precise statement of their core commitment:

  *   **Epistemicist:** "Every vague predicate `F` has a precise extension in any given context of use. There is a fact of the matter, determined by the actual meaning of `F`, the relevant features of the world, and the context, about exactly which objects are `F` and which are not. The appearance of borderline cases and the seeming lack of a sharp boundary arise solely from our *inability to know* where this precise boundary lies, due to necessary limitations in our discriminatory capacities and the margin-for-error principles governing knowledge of inexact matters. Vagueness is fundamentally an epistemic phenomenon concerning our access to semantic facts."
  *   **Supervaluationist:** "The meaning of a vague predicate `F` does not determine a single, precise extension. Instead, it determines a range of *admissible precisifications* – ways of making `F` precise that are consistent with its meaning and established use. A sentence `Fa` (e.g., 'This is a heap') is:
      *   **Supertrue** iff true on *all* admissible precisifications.
      *   **Superfalse** iff false on *all* admissible precisifications.
      *   **Neither** (indeterminate) iff true on some admissible precisifications and false on others.
      Borderline cases correspond to instances that are indeterminate in this sense. Vagueness is fundamentally a semantic phenomenon concerning the under-specification of meaning, not merely our knowledge."

  **(3) Key Cruxes: Points Where Evidence Could Shift Views**

  **Crux 1: Higher-Order Vagueness**
  *   **Shared Bearing:** The undeniable intuitive pull of higher-order vagueness (e.g., the sense that there's no sharp line between "definitely a heap" and "borderline heap").
  *   **Epistemicist Prediction:** "Definitely `F`" is equivalent to "`F` and knowable to be `F` under ideal conditions". The boundary between "definitely `F`" and "borderline or not `F`" is *itself* sharp but unknowable. Higher-order vagueness is just higher-order ignorance. The machinery (sharp boundaries + ignorance) applies recursively without collapse.
  *   **Supervaluationist Prediction:** "Definitely `F`" (supertrue that `F`) is itself a vague predicate. Its application depends on the range of admissible precisifications, which itself has borderline cases. The machinery handles this by admitting precisifications that differ on where the "definitely" boundary falls, leading to indeterminacy *about* determinacy. While this pushes the problem "up," it avoids positing unknowable sharp boundaries at any level and reflects the intuitive gradation of definiteness.

  **Crux 2: The Status of "Supertruth"**
  *   **Shared Bearing:** The intuitive force of the Disquotation Schema (DS): `p` is true iff `p`. (E.g., "Snow is white" is true iff snow is white).
  *   **Epistemicist Prediction:** For the supervaluationist, `p` (e.g., "This is a heap") can be indeterminate while "It is true that p" is superfalse (since `p` isn't true on all precisifications). This violates DS for borderline `p`. This shows "supertruth" is a *technical* notion distinct from the ordinary, disquotational concept of truth that governs assertion and belief. This is a significant cost.
  *   **Supervaluationist Prediction:** Supertruth *is* the appropriate truth-concept for vague languages in contexts demanding precision (e.g., logic, metaphysics). While DS fails for *borderline* `p` using "true" *as* "supertrue", it holds for clear cases. An *internal* DS holds for "supertrue": `p` is supertrue iff it is supertrue that `p`. The cost is justified because it accurately captures the semantic indeterminacy. Ordinary assertion often targets supertruth, but pragmatic factors govern borderline cases.

  **Crux 3: Arbitrariness and the Source of Boundaries**
  *   **Shared Bearing:** The strong intuition of arbitrariness ("Why *this* grain?"), especially for predicates like "heap" or "bald". The question of whether predicates tied to natural joints (e.g., "alive", "water") differ significantly. The question of discrete (grains) vs. continuous (color) sorites series.
  *   **Epistemicist Prediction:** The sharp boundary for *any* vague predicate `F` is fixed by the complex interaction of actual linguistic usage, conventions, context, and (for natural kind terms) the underlying metaphysics. While it *could* have been different with different usage/conventions/worlds, *given* the actual usage/conventions/worlds, it *is* fixed. The arbitrariness intuition stems from our inability to pinpoint the boundary, not its non-existence. The explanation is the *same* in principle for discrete and continuous cases; the unknowability arises from similar margin-for-error constraints. Natural kind predicates *might* have boundaries more tightly constrained by the world.
  *   **Supervaluationist Prediction:** Epistemicism inevitably faces the "arbitrariness objection": positing *any* specific sharp boundary for "heap" seems implausible and unsupported by meaning/use. Supervaluationism *avoids* this by denying any *single* boundary is semantically privileged. The range of admissible precisifications reflects the non-arbitrary constraints of meaning and use. This core advantage applies equally to all vague predicates, regardless of subject matter (social "heap" vs. natural "alive") or structure (discrete vs. continuous). The difference between natural kinds and others lies in how *narrow* the range of admissible precisifications might be (potentially very narrow for "alive"), not in the fundamental semantic mechanism.

  **Crux 4: Forced-Choice Experiments**
  *   **Shared Bearing:** Empirical data on how subjects classify items in a sorites series under forced-choice (Yes/No) vs. three-valued (Yes/No/Can't Tell) conditions, including patterns of hesitation, inter-subject disagreement, and the effect of disclosing a purported boundary.
  *   **Epistemicist Prediction:** In forced-choice, subjects will show significant hesitation and disagreement in the borderline region, reflecting their ignorance of the true boundary. Revealing the *actual* boundary (if known) *should* cause convergence, as competent speakers would defer to the semantic fact. Persistent disagreement *after* revelation would challenge epistemicism.
  *   **Supervaluationist Prediction:** In forced-choice, subjects will show hesitation and disagreement in the borderline region, reflecting genuine semantic indeterminacy. Revealing a *specific* boundary (e.g., "We define heap as >n grains") introduces a *precisification*. Competent speakers aware of the original vagueness might *not* fully converge on this new precisification in judgments about *the original vague predicate*, especially near the new boundary, as the range of admissible precisifications hasn't fundamentally changed. Training might induce use of the *new* precise term, not resolve the original vagueness. Persistent divergence on the *original* predicate after revelation supports supervaluationism.

  **(4) The Verbal Dispute? (A Joint Assessment)**

  While both accounts describe similar surface phenomena (hesitation, disagreement, sorites susceptibility) and share significant theoretical goals (explaining tolerance, avoiding explanatory arbitrariness), **the core disagreement is *not merely verbal*.** It is a substantive disagreement about metaphysics and the nature of semantics:

  *   **The Deep Divide:** The disagreement centers on whether the facts that make borderline statements indeterminate are fundamentally *semantic* (multiple admissible precisifications; Supervaluationism) or *epistemic* (a single unknowable fact; Epistemicism). This is a difference in what exists: does the meaning of "heap" determine a single, sharp (but unknowable) dividing line, or does it determine a range of equally acceptable dividing lines?
  *   **"No Fact" vs. "Unknowable Fact":** These phrases *are* capturing a real difference. The supervaluationist asserts there *is no fact of the matter* (at the semantic level) about whether a borderline heap is a heap, only facts about how different precisifications handle it. The epistemicist asserts there *is a specific fact of the matter*, but we cannot know it. This difference manifests in their treatments of higher-order vagueness, supertruth, and the arbitrariness objection.
  *   **Where Language Might Obscure:** The *intuitive descriptions* people give ("I don't know," "It's neither") are compatible with both theories. Both can explain why someone says "I don't know" (ignorance vs. recognizing indeterminacy) or "It's neither" (reflecting the absence of a determinate truth value). The verbal overlap arises here, in the descriptions of the speaker's state or the sentence's status. However, the *theoretical explanations* for *why* these descriptions apply are fundamentally distinct and incompatible.

  **Conclusion:** This collaboration clarifies our substantial agreement on the phenomenon and the demands on a theory. It precisely delineates our core disagreement about whether vagueness stems from semantic underspecification or epistemic limitation. We have identified key cruxes (higher-order vagueness, supertruth, arbitrariness, forced-choice experiments) where empirical and conceptual progress could rationally move one or both of us. We acknowledge that while surface descriptions of vagueness might use similar language, our underlying theories posit genuinely different states of the world. This document serves as a roadmap for future productive debate, moving beyond talking past each other.

  ---
  **Signed,**
  **[Friend 1 - Epistemicist]**
  **[Friend 2 - Supervaluationist]**
