    - The 0.15 credence reverses this (prior-settlement ≥0.75, policy-feedback ≤0.20).  
  - **Against alternatives**: If disagreement were about bundle specification, both would converge given concrete policy definitions. If about historical binding, variance would center on prior-settlement weights—but the 10x gap suggests foundational divergence in causal models.  

