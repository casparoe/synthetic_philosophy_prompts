     - Justification: State capacity interventions (e.g., Singapore’s housing policy) often precede trust gains.  

  ### Conditional Dependencies  
  - *Prior-settlement* and *Bundle-specification* are dependent (historical settlements define "core" bundle).  
  - *Policy-feedback* and *Binding-constraint* are dependent (if trust isn’t binding, feedback loops weaken).  
  - All others treated as independent for simplicity.  

  ### Arithmetic  
  Weighted sum with dependencies simplified via multiplicative adjustment:  
  `(0.20 × 0.40) + (0.60 × 0.30) + (0.30 × 0.15) + (0.40 × 0.10) + (0.35 × 0.25) = 0.08 + 0.18 + 0.045 + 0.04 + 0.0875 = 0.4425`  
  Adjusted downward by 50% for net dependency effects (conservative estimate):  
  `0.4425 × 0.5 = 0.22125 ≈ 0.22`  

  ### Sensitivity  
