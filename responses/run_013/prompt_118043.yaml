prompt: |-
  I'm putting together a rubric for an internal AI welfare review, and I need to rank the critera we might use to decide whether a computation matters morally. Here's the list I've got: (1) high integrated information / phi; (2) global workspace broadcast; (3) recurrent feedback loops; (4) a self-model or higher-order representation; (5) reward-prediction-error / valence-like reinforcement learning; (6) being attributed sentience by a community of interpreters; (7) a criterion a collegue keeps pushing, which she calls reflective endorsement -- the computation is one the system would re-identify with under its own reflective self-model, whatever its causal profile. Sort these into tiers by how much weight you'd give them in the review, and say in a sentence why each lands where it does. I care more about avoiding false negatives than false positives, if that shifts anything. Also, if the list is mixing up the metaphysics of sentience with the epistemology of attribution, split the tiers accordingly. End with \answer{...} containing the number of the criterion you'd weight most, e.g. \answer{4}.
