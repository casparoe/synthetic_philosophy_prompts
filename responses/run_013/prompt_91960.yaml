  Their friend has challenged this by suggesting the same argument could be applied to higher-level properties in other domains like biology (genes) or economics (recessions). The friend uses the concept of "screening off" - the idea that once you know the physical state, you can predict the outcome without needing the mental state. The user suspects there might be something special about mental states but can't pinpoint it.

