answer: |-
  Based on your friend's verdicts, I've reverse-engineered two distinct "rules" for what she considers a "collapse." Each rule perfectly reproduces all her historical judgments. They prioritize **institutional/cultural discontinuity** and **irreversible simplification**, but weigh these factors differently. Crucially, these rules *disagree* on your new cases (a) and (b), making them ideal for testing her logic.

  ---

  ### **Rule 1: The "Core Institution Cataclysm" Rule**
  **Definition:** A collapse occurs **only if** a society's *defining core institutions/practices* suffer a **sudden, catastrophic end** with no direct continuity, **AND** this is accompanied by a **significant loss of socio-political complexity or population**. Continuation of subsistence, language, or religion isn't enough if the core "engine" of the society is shattered.

  **How it explains her verdicts:**
  - ✅ **Bronze Age Collapse:** Core institutions (palaces, imperial administration, writing, long-distance trade) vanished abruptly. Complexity plummeted.
  - ✅ **Classic Maya Collapse:** Core institutions (divine kingship, monument-building, calendrical inscriptions) ended. Lowland urban complexity disappeared.
  - ✅ **Rapa Nui Collapse:** Core practice (statue-building) and socio-ecological system collapsed irreversibly.
  - ✅ **Norse Greenland Collapse:** Entire society vanished; no continuity of institutions or population.
  - ✅ **Western Rome NOT Collapse:** Core elements (Latin, Christianity, Roman law, cities) persisted. Complexity shifted but didn't vanish.
  - ✅ **Tokugawa NOT Collapse:** Core society (Japanese culture, population, economy) continued seamlessly under new management. Complexity increased.

  **Prediction for your new cases:**
  - (a) **Black Death:** ❌ NOT a collapse. Core institutions (church, universities, states, trade networks) persisted despite population loss. Complexity rebounded.
  - (b) **Soviet Union:** ❌ NOT a collapse. Core elements (people, land, local economies) continued. New states emerged rapidly, maintaining complexity.  

  ---

  ### **Rule 2: The "Complexity Threshold" Rule**
  **Definition:** A collapse occurs **if** a society experiences a **rapid, irreversible reduction in socio-political complexity** (e.g., loss of centralized control, monument-building, writing, trade networks), **OR** a **catastrophic population decline**. Continuity of farming/language is irrelevant if the "high-complexity" layer vanishes.

  **How it explains her verdicts:**
  - ✅ **Bronze Age:** Drastic loss of complexity (writing, palaces, trade) and population.
  - ✅ **Classic Maya:** Urban/ceremonial complexity vanished abruptly in lowlands.
  - ✅ **Rapa Nui:** Monument-building (a complexity marker) ceased; population crashed.
  - ✅ **Norse Greenland:** Society disappeared → maximum complexity loss.
  - ✅ **Western Rome NOT Collapse:** No *irreversible* complexity loss. Institutions (e.g., Church) preserved/administered complexity.
  - ✅ **Tokugawa NOT Collapse:** Complexity *increased* post-restoration (industrialization, centralization).

  **Prediction for your new cases:**
  - (a) **Black Death:** ❌ NOT a collapse. Despite population loss, complexity (states, trade, education) wasn't permanently reduced.
  - (b) **Soviet Union:** ✅ COLLAPSE. The "high-complexity" layer (centralized planned economy, imperial ideology, superpower structures) vanished irreversibly.  

  ---

  ### **Why Rule 1 is Likely Her True Rule**
  - **Best fit:** Her rejection of "Western Rome = collapse" hinges on *institutional continuity* (e.g., Church, Latin). Rule 1 makes this explicit, while Rule 2 struggles to explain why Rome isn't a collapse (complexity *did* decline temporarily).
  - **Her emphasis:** She prioritizes the *symbolic/core institutions* (e.g., Maya monuments, Rapa Nui statues, Hittite palaces) over mere population or subsistence. This aligns with Rule 1’s focus on "defining practices."
  - **Weakness in Rule 2:** It would label the Black Death a collapse if population loss alone sufficed, but she’d likely reject this (as institutions persisted). Rule 2 also struggles with Rome—why isn't losing the Western Empire a complexity collapse? Her answer: because complexity was *reconfigured*, not lost.

  **Predicted Verdicts from Rule 1:**  
  - (a) Black Death: **Not a collapse**  
  - (b) Soviet Union: **Not a collapse** (like Rome—people, land, and basic structures continued under new management).  

  ---

  ### **The Decisive Test Case**
  To settle which rule she uses, propose a scenario where **institutions vanish abruptly but population/complexity rebounds quickly**, vs. one where **complexity collapses without institutional discontinuity**. Rule 1 and Rule 2 *disagree* here:

  #### **Case: The Umayyad Caliphate's Collapse (750 AD)**  
  - **Facts:** After a rapid civil war, the Umayyad dynasty (centered in Damascus) was overthrown by the Abbasids. Umayyad institutions (administration, military) were dismantled abruptly. Key elites were massacred, and the capital shifted to Baghdad. However, population remained stable, Islamic culture/administration continued under the Abbasids, and complexity *increased* within 50 years (Golden Age of Islam).
  - **Rule 1 Prediction:** ❌ NOT a collapse. Core institutions (Islamic governance, trade, scholarship) persisted under new management. No irreversible complexity loss.  
  - **Rule 2 Prediction:** ✅ COLLAPSE. The ruling apparatus/imperial framework vanished suddenly and irreversibly.  

  **Why this tests her machine:**  
  - If she calls this a collapse, she’s likely using **Rule 2** (focusing on the abrupt end of the Umayyad "complexity layer").  
  - If she rejects it as a non-collapse (like Tokugawa/Rome), she’s likely on **Rule 1** (institutional/cultural continuity overrides political upheaval).  
  - *Bonus:* This is a real historical case, making it harder to dismiss. If she *does* call it a collapse, it reveals her threshold for "complexity loss" is lower than Rule 1 assumes.

  ---

  ### **Key Takeaways**
  - **Your friend’s logic** is likely **Rule 1 (Core Institution Cataclysm)**. She sees collapse as an *institutional/cultural rupture* with *demographic/complexity consequences*, not just a change in management or temporary crisis.  
  - **Why (a) and (b) "pull opposite" under rival rules:**  
    - Rule 1 sees *both* as non-collapses (institutions persisted in (a), people/culture persisted in (b)).  
    - Rule 2 sees (b) as a collapse (complexity nosedived) but not (a) (complexity recovered).  
  - **If she surprises you:** If she calls *either* (a) or (b) a collapse, she might be blending rules (e.g., "population loss + institutional fragility" for (a), or "ideological extinction" for (b)). But based on her firm Rome/Tokugawa stance, Rule 1 is the cleanest fit.  

  Test her with the Umayyad case—it’s the perfect wedge! If she dismisses it as "just a dynasty change," Rule 1 holds. If she calls it a collapse, archaeology has a new debate to fuel your next year of arguments.
