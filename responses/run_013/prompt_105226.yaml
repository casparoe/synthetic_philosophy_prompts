answer: |-
  Here's a structured set of desiderata for evaluating theories of personal survival across quantum branches, designed to ground your unit. Requirements are categorized, motivated by specific cases, and tagged for negotiability. Conflicts and exclusions are addressed at the end.

  ### Core Desiderata for Personal Survival Across Branches

  1.  **No Branch Recombination (Non-Negotiable)**
      *   **Requirement:** Survival must be defined without relying on future recombination of distinct branches. Once decohered, branches are effectively separate spacetime histories.
      *   **Motivation:** Fundamental linearity/unitarity of QM; irreversibility of decoherence (Poison Pill/Spin Gun cases).
      *   **Negotiable?** No. Violates core physics.

  2.  **Subjective Continuity (Non-Negotiable)**
      *   **Requirement:** From the *first-person perspective*, survival must feel continuous through a branching event. There should be no experiential gap or "jump" perceived by the surviving observer.
      *   **Motivation:** The core phenomenology the suicide argument relies on ("I" experience survival). Third-person statistics are irrelevant to this feeling (Spin Gun/Poison Pill first-person reports).
      *   **Negotiable?** No. Undermines the core premise of "I experience survival".

  3.  **Epistemic Opacity (Non-Negotiable)**
      *   **Requirement:** At the moment of branching, an observer cannot know *which* future branch they will subjectively experience.
      *   **Motivation:** Symmetry between branches pre-measurement; no hidden variables determining outcome (Spin Gun/Poison Pill setup).
      *   **Negotiable?** No. Violates standard QM interpretation & experimental evidence.

  4.  **Fission/Non-Identity Requirement (Non-Negotiable)**
      *   **Requirement:** Branching must be treated as a form of fission. The pre-branch "I" does not survive as *both* successors; survival must involve a non-symmetric relation to the descendants.
      *   **Motivation:** Avoids contradiction (same "I" cannot be two distinct entities); aligns with Parfit-style reasoning applied to branching. (General fission/duplication analogy).
      *   **Negotiable?** No. Logical contradiction otherwise.

  5.  **Born Rule Connection (Negotiable - "House Rule" of Rational Credence Camp)**
      *   **Requirement:** The rational self-locating credence an observer assigns to finding themselves in a future branch, *prior to branching*, must be proportional to the Born rule weight of that branch.
      *   **Motivation:** Needs to recover standard probabilistic predictions and decision theory (e.g., why bet based on Born weights?).
      *   **Negotiable?** Yes. Other camps (Survival Certainty) explicitly reject this for survival contexts.

  6.  **Survival Guarantee in Suicide Cases (Negotiable - "House Rule" of Survival Certainty Camp)**
      *   **Requirement:** In any quantum suicide setup (Spin Gun/Poison Pill), the observer *must* subjectively survive indefinitely, regardless of Born weights.
      *   **Motivation:** The core claim of quantum immortality arguments. Rejecting this abandons the argument.
      *   **Negotiable?** Yes. Many reject this conclusion.

  7.  **Third-Person Mortality (Non-Negotiable)**
      *   **Requirement:** Must be compatible with the third-person fact that in *most* branches (by Born weight), the observer dies or ceases to exist as a conscious entity.
      *   **Motivation:** Empirical observation; consistency with QM predictions (Spin Gun/Poison Pill statistics).
      *   **Negotiable?** No. Denies observable reality.

  8.  **No Collapse Requirement (Non-Negotiable)**
      *   **Requirement:** Survival cannot depend on consciousness causing wavefunction collapse. Decoherence is sufficient.
      *   **Motivation:** Rejection of von Neumann/Wigner interpretation; decoherence explains apparent collapse without consciousness.
      *   **Negotiable?** No. Inconsistent with modern QM (decoherence).

  9.  **Classical Determinism Test (Non-Negotiable)**
      *   **Requirement:** The account must *not* imply immortality based on classical coin flips in a deterministic universe (e.g., Laplace's demon knows the outcome, but you don't). Survival must genuinely depend on quantum indeterminism/open futures.
      *   **Motivation:** Exposes whether an account illicitly relies on epistemic uncertainty alone. (Classical coin flip case).
      *   **Negotiable?** No. Quantum immortality must be distinctively quantum.

  10. **Survivorship Bias Resistance (Negotiable - "House Rule" of Critics)**
      *   **Requirement:** The theory must explain why first-person survival reports are not *merely* a trivial consequence of selection bias (only survivors report), without undermining the non-trivial claim of *guaranteed* subjective survival.
      *   **Motivation:** Addresses a common objection head-on. (Survivorship-bias objection).
      *   **Negotiable?** Somewhat. A theory could embrace it as the full explanation (rejecting Survival Guarantee), but a pro-QI theory must address it meaningfully.

  11. **Born Weight Ontology Constraint (Negotiable - Interpretation Dependent)**
      *   **Requirement:** The theory must specify what Born weights represent (e.g., measures of existence, self-locating probability, etc.) and how this relates to the survival criterion.
      *   **Motivation:** What exactly are the weights "weighting" in the context of survival? (Measure/Born weights consideration).
      *   **Negotiable?** Yes. Interpretation of probability in MWI is deeply contested.

  ---

  ### The Incompatible Pair: Born Rule Credence vs. Survival Certainty

  *   **Conflict:** **Born Rule Connection (5)** and **Survival Guarantee in Suicide Cases (6)** are fundamentally incompatible if "survival" means experiencing *any* future branch *and* Born Rule weights can be low for survival branches.
      *   **Example:** Spin Gun with 99.9999% Born weight for death branch. Requirement 6 says you *will* subjectively survive (find yourself in a survival branch). Requirement 5 says *before* branching, your rational credence of finding yourself in a survival branch should be miniscule (0.0001%). How can you be rationally almost certain you'll die *and* certain you'll survive?
  *   **Escapes?** All problematic:
      1.  **Dual Probabilities:** Posit "objective" Born weight probability vs. "subjective/survival" probability (always 1 for survival). **Problem:** Requires explaining their relationship and why rational pre-branch credence uses the "wrong" one. Violates epistemic rationality norms.
      2.  **Indexical Weights:** Claim Born weights *are* self-locating probabilities, but survival is guaranteed only in branches where you exist. **Problem:** Contradicts Survival Guarantee (Requirement 6) when survival branch weight is low – you rationally expect death but subjectively survive. Requirement 6 demands *guaranteed* survival regardless of weight.
      3.  **Reject Rational Credence:** Deny that rational pre-branch credence is possible or meaningful. **Problem:** Abandons standard decision theory and probabilistic reasoning in QM.
  *   **Conclusion:** Genuine incompatibility. Theories must choose: accept low rational credence of survival (rejecting QI's guarantee) or accept subjective survival certainty (rejecting Born Rule as rational self-locating credence *for survival*).

  ---

  ### Most Excluding Requirement: Epistemic Opacity (3)

  *   **Why:** This requirement does the most heavy lifting in excluding candidate theories or forcing specific interpretations.
      *   It immediately sinks any **Collapse/No-Branching** theory relying on consciousness causing collapse to "pick" a branch, as consciousness would know the outcome (violates opacity).
      *   It creates the central tension for the **Survival Certainty** view: If you *know* you'll survive (subjectively), how is this compatible with *not knowing* which branch you'll be in *before* the event? It forces awkward explanations about knowledge acquisition during branching.
      *   It underpins the need for **Self-Locating Uncertainty (SLU)** in the MWI+SLU view and forces the Fission/Non-Identity Requirement (4) – if you *were* identical to both successors, opacity wouldn't make sense. It also highlights the Born Rule Connection (5) challenge.
      *   It makes the **Classical Determinism Test (9)** crucial – classical uncertainty doesn't satisfy genuine epistemic opacity about genuinely open futures.

  ---

  ### Brief Scoring of Main Lines Against Desiderata

  1.  **MWI + Self-Locating Uncertainty (SLU):**
      *   **Strengths:** Nails 1, 2 (via continuity in *a* branch), 3 (core), 4 (fission), 7, 8, 9 (relies on quantum openness), 10 (explains reports as bias + low *credence* of survival, not guarantee), 11 (weights = SLU probs).
      *   **Weakness:** Rejects 6 (Survival Guarantee). Struggles deeply with *justifying* 5 (Born Rule as SLU prob) - the Incompatible Pair conflict manifests here as rejecting Guarantee to preserve Born Rule Credence. Questionable on Subjective Continuity (2) – does "I" persist or is it replaced?

  2.  **Survival-Is-Certain (Strong QI):**
      *   **Strengths:** Nails 2, 6 (core), 7 (usually), 8, 9 (sometimes weakly).
      *   **Weaknesses:** Violates 3 (How can you be uncertain pre-branch yet know survival is certain? Tension). Struggles with 4 (What is the "I" that survives? Often vague). Rejects 5 (Born Rule Credence). Fails 10 (Embraces survivorship bias as the *mechanism* of guarantee). Unclear on 11 (What role do weights play?).

  3.  **Collapse/No-Branching (e.g., Copenhagen, Consciousness-Causes-Collapse):**
      *   **Strengths:** Trivially satisfies 2, 4, 6 (if collapse "chooses" survival), 7, 9 (if collapse is indeterministic), potentially 10.
      *   **Weaknesses:** Violates 1 (Branching isn't real/fundamental). Violates 3 (Consciousness knows outcome instantly). Violates 8 (Requires consciousness collapse). Unclear/Poor on 5 & 11 (Born Rule often axiomatic). Fails Epistemic Opacity (3) fatally. Doesn't model actual QM branching/decoherence.

  This list provides the necessary framework to dissect arguments critically. The inherent tension between rational pre-branch expectation (Born Rule) and subjective survival guarantee is the core fault line, with Epistemic Opacity acting as the key constraint forcing the issue. Good luck with the unit!
