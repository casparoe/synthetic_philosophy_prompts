  Need to ensure each desideratum is clearly motivated by specific cases the user mentioned. For example, Fission/Non-Identity Requirement comes from Parfit's thought experiments applied to branching. Survivorship Bias Requirement addresses the objection that we only observe survival because the dead can't report.

