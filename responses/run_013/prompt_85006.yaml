  - Why the repugnant conclusion analogy breaks: Omelas involves a trade-off (causal sacrifice), not mere addition. The child is an existing person being harmed, not a new life added.
  - Where population axiology still applies: The child's welfare level (barely worth living vs. below zero) changes ethical calculus per theories like critical-level utilitarianism. The narrator's vagueness mirrors real indeterminacy in these thresholds.
  - Unique elements: Citizens' knowledge introduces non-welfare considerations (complicity). Walkers' refusal can't be captured by aggregation—hinting at agent-relative ethics or integrity.
  - What the story adds: Embodied experience of complicity/refusal beyond abstract aggregation. The visceral horror forces confrontation no argument achieves.

