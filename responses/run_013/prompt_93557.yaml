prompt: |-
  I have no statistical training beyond what I have picked up reading on my own, and I keep running into what looks to me like a contradiction at the center of how research results are reported and judged. The practice, as I understand it, runs roughly as follows. A study is carried out; the researcher computes the probability of obtaining data at least as extreme as what was observed, on the assumption that there is really no effect; if that probability falls below a threshold, by convention one in twenty, the result is called significant and published, and if it does not, the result is called null and usually shelved. Every account I have read warns me, in the same breath, that this probability is not the probability that the hypothesis is false, and that a non-significant result is not evidence that there is no effect. Yet the surrounding institutions behave as if it were: findings are tallied by whether they crossed the threshold; a failed repetition of a significant study is treated as a refutation of the original; and the whole apparatus of preregistration seems built to fix in advance the very things — how many observations will be gathered, when the experimenter will stop — that the arithmetic is supposed to depend on. I have also read that some groups now ask for more than the conventional test: they want the interval of plausible values to exclude the smallest effect anyone would care about, and sometimes a ratio comparing how well one hypothesis predicts the data against another. I cannot tell whether these are three ways of saying one thing, three incompatible things bolted together, or one coherent thing wearing three masks.

  What I would like from you is a reconstruction of the implicit theory of evidence and inference that this whole practice presupposes. What view of probability does a procedure defined over hypothetical repetitions of an experiment commit one to, and can that view be squared with the interpretation researchers place on their own results? Which rival views does the practice quietly rule out — for instance, a view on which only the probability of the hypothesis given the data matters, or a view on which the evidential import of a body of data is the same however the data were collected? Does the practice presuppose that inference is a matter of choosing between two hypotheses with controlled error rates, or of measuring the strength of evidence, or of estimating a quantity together with its uncertainty — and can any one of these bear the weight of all the institutional machinery, or does the machinery require several incompatible ones at once? I am especially puzzled by the stopping rule: is it strictly presupposed by the practice that the same observations mean different things depending on whether the sample size was fixed in advance or the experimenter kept collecting until the result pleased them, or is that merely an artifact of the arithmetic that the practice could shed without changing its conclusions? The notion of a replication troubles me in the same way: what does it presuppose about a stable true effect, and about repetitions being independent and interchangeable? Please distinguish what the practice strictly requires from what it merely fits comfortably with, and say where it is philosophically underdetermined, so that several theories would license it equally well. Finally, suppose one replaced whatever view it presupposes with the most natural rival; tell me concretely what would have to change — which of our daily habits of reporting, publishing, and replicating would survive intact, and which would have to be abandoned.
reasoning: |-
  Okay, let me start by unpacking this user's query. They're clearly frustrated with what they see as a contradiction in statistical practice. They've done a lot of reading on their own but feel stuck. The core issue is the disconnect between how p-values are used (as thresholds for significance) and the warnings that p-values don't measure the probability that the hypothesis is false. They mention institutional behaviors like tallying significant results and replication debates, which seem to treat p-values as something they're not.

  First, I need to address the philosophical underpinnings. The user is asking about the implicit theory of evidence in null hypothesis significance testing (NHST). They want to know what view of probability NHST commits to—likely frequentist, since it's based on long-run error rates. But they also bring up Bayesian alternatives where the probability of the hypothesis given the data matters. There's tension here because institutions act as if p-values confirm hypotheses, even though statistically they shouldn't.

  The user is confused about whether different approaches (p-values, confidence intervals, Bayes factors) are compatible or conflicting. I should explain that they stem from different philosophies but can coexist, though the current system heavily leans on NHST. The stopping rule problem is another point—why does when you stop collecting data matter? The user needs to understand that frequentist methods depend on the sampling plan, while likelihood or Bayesian methods don't. 

  Replication is another concern. The user wonders what it assumes about a stable true effect. Frequentist replication relies on the effect being constant, but real-world variations complicate this. Bayesian updating might handle it better, but it's not the norm.

  The user's deeper need might be to make sense of why scientific practices seem contradictory and what alternatives exist. They might be looking for a coherent framework to evaluate evidence without the inconsistencies they've observed. I should clarify where practices are tied to frequentism and what changes under Bayesian or likelihood approaches. For example, under Bayesian methods, preregistration and fixed sample sizes become less critical, but prior specification becomes crucial. 

  I also need to distinguish what's essential to NHST versus what's a misuse. P-hacking and treating p<0.05 as truth are misapplications, but the core of NHST is about controlling Type I errors. The institutional habits (tallying positives, replication as refutation) are social adaptations that don't align strictly with the statistical theory.

  Finally, the user wants concrete changes if switching to a rival approach. Moving to Bayes would emphasize posterior distributions and Bayes factors instead of p-values. Preregistration might focus more on preventing bias than stopping rules. Replication would update priors rather than tally successes. Confidence intervals would become credible intervals, incorporating prior knowledge.

  I should structure the answer to first explain frequentist foundations, then contrasts with rivals, institutional behaviors, and practical implications. Highlighting the philosophical underdetermination where different theories could support parts of the practice, but the current system is a hybrid with tensions. Conclude with what changes under a Bayesian shift to address their "what if" scenario.
answer: |-
  Your critique cuts to the heart of deep, unresolved tensions in statistical inference. The practice you describe—Null Hypothesis Significance Testing (NHST) embedded in institutional norms—rests on a **frequentist interpretation of probability**, with specific philosophical commitments and inherent contradictions. Here's a reconstruction of its implicit theory:

  ### Core Philosophical Commitments
  1.  **Frequentist Probability:** Probability is defined as the long-run relative frequency of an event under *hypothetical repetitions* of an experiment under identical conditions. This is why the p-value (P(data | H0)) is calculable – it imagines infinite repetitions assuming H0 is true.
  2.  **Error Control as Primary Goal:** The core justification is controlling long-run error rates. The 5% threshold (alpha) is a guarantee: "If H0 is true, we will incorrectly reject it only 5% of the time *in the long run*." This justifies fixed stopping rules and pre-registration.
  3.  **Evidential Interpretation via "Surprise":** While formally about error rates, practitioners *interpret* a small p-value as strong evidence *against* H0 (and implicitly *for* H1). This relies on an informal "surprise" principle: if the data is very unlikely under H0, H0 is probably wrong. This is where the disconnect between formal definition and practical interpretation arises.
  4.  **Conditionality on the Sampling Plan:** Inference depends on *how* the data was collected. The same data (e.g., n=100, mean difference = 0.5, SD=1) yields a different p-value if n was fixed in advance (p=0.0006) vs. if sampling stopped when p<0.05 was reached (p=0.05). The frequentist framework *requires* this difference, as the probability calculation depends on the space of possible samples defined by the stopping rule.

  ### What the Practice Rules Out or Conflicts With
  1.  **Direct Probability of Hypotheses (Bayesian P(H|D)):** NHST explicitly forbids interpreting p=P(D|H0) as P(H0|D). The institutional habit of treating "significant" as "true" and "non-significant" as "false/null" directly contradicts its own formal definition.
  2.  **Likelihood Principle:** This principle states that all evidence about a parameter contained in data is embodied in the likelihood function P(Data | Parameter). It implies that *how* the data was obtained (stopping rule, intended sample size) is irrelevant for inference *given the data*. NHST fundamentally violates this principle due to its dependence on the sampling plan.
  3.  **Pure Evidential Measures (e.g., Likelihood Ratios):** While the likelihood ratio (e.g., P(Data | H1) / P(Data | H0)) is a natural measure of evidence strength relative to two hypotheses, NHST focuses only on P(Data | H0) and fixes H1 vaguely as "not H0". The institutional tallying of "significant/non-significant" flattens nuanced evidence into a binary decision.
  4.  **Estimation as Primary Goal:** While confidence intervals exist, the institutional focus is overwhelmingly on the binary significance test. Estimation (point + interval) often takes a back seat, though this is changing.

  ### Can One View Bear the Weight?
  *   **No single coherent view succeeds.** The machinery relies on an unstable hybrid:
      *   The *formal justification* (long-run error control) supports fixed designs, pre-registration, and strict alpha levels.
      *   The *interpretive practice* (treating p<0.05 as evidence for an effect) leans towards Bayesian/likelihood concepts of evidence strength.
      *   The *institutional response* (publication bias, tallying "successes", replication-as-refutation) acts *as if* p<0.05 means P(Effect is Real) > 0.95, which frequentism cannot justify.
  *   **Weak Points:** The dependence on stopping rules and the misinterpretation of p-values are the most philosophically jarring aspects. The conflation of "statistical significance" (p<alpha) with "practical importance" is another major flaw the practice struggles with.

  ### Addressing Specific Puzzles
  1.  **Stopping Rule:** The practice *strictly presupposes* it matters. The same numerical data *formally means different things* (different p-values, different CI coverage properties) under fixed-N vs. sequential testing in frequentism. This is required by the logic of controlling long-run error rates under the specific sampling plan. Likelihood/Bayesian approaches reject this dependence.
  2.  **Replication:** Frequentist replication logic presupposes:
      *   A *stable, underlying true effect size* (θ).
      *   *Independence* between the original and replication study samples.
      *   That the replication is testing the *same* H0/H1 and using the *same* alpha level.
      *   That a "failure to replicate" (p >= 0.05) definitively refutes the original *only* if the original was a false positive. However, it could also mean:
          *   The original was a false positive (Type I error).
          *   The replication had low power (Type II error) – common if the true effect is small.
          *   The effect is context-dependent and not perfectly stable.
      *   The institutional habit of treating replication failure as definitive refutation oversimplifies this complex frequentist logic and again acts Bayesian (shifting belief strongly against the effect based on new data).
  3.  **p-values, CIs, Bayes Factors: Three Masks or One Thing?**
      *   **p-value:** Focuses on compatibility with H0 (specifically, how extreme the data is under H0). Prone to misinterpretation as P(H0|D).
      *   **Confidence Interval (CI):** Focuses on estimating the effect size and its precision. A 95% CI means "95% of such intervals constructed from repeated experiments will contain the true θ". It *does not* mean "95% probability θ is in this interval" (though often misinterpreted that way). Demanding the CI exclude a minimal important effect addresses practical significance *if* the CI is narrow enough.
      *   **Bayes Factor (BF):** Directly compares the predictive adequacy of two hypotheses (H1 vs H0) for the observed data: BF₁₀ = P(Data | H1) / P(Data | H0). Quantifies relative evidence strength. Requires specifying H1 precisely (not just "not H0") and priors.
      *   **Relationship:** They are related but *not equivalent*. A small p-value *suggests* a BF favoring H1 over H0 *might* be large, but it depends heavily on H1's specification, priors, and sample size. A CI excluding zero aligns with p<0.05 for the test H0: θ=0. A CI excluding a minimal effect provides evidence for a practically important effect. BF directly addresses relative evidence strength but requires more assumptions. They offer complementary perspectives but are philosophically distinct (frequentist vs. Bayesian for BF).

  ### Replacing the Foundation: A Bayesian Revolution
  Suppose we replaced the implicit frequentism with **Bayesian inference** as the core philosophy:

  1.  **What Survives Intact?**
      *   **Data Collection & Preregistration (Partly):** Preregistration remains valuable for transparency, preventing HARKing (Hypothesizing After Results are Known), and distinguishing confirmatory vs. exploratory research. However, its role in defining stopping rules strictly for probability calculations vanishes.
      *   **Replication Logic (Refined):** Replication retains importance. A failed replication (low BF for H1 vs H0, or posterior concentrated near zero) would strongly update beliefs against the original finding. However, it formally updates probabilities rather than "refuting" in a binary sense.
      *   **Focus on Effect Size:** Emphasis on estimation (posterior distributions) naturally survives and becomes central.
      *   **Desire for Quantified Evidence:** The institutional desire for a number summarizing evidence is met directly by the posterior probability or Bayes Factor.

  2.  **What Must Change?**
      *   **The Sacred Threshold (p<0.05):** Vanishes. Evidence is continuous (Posterior Probability, BF). "Significance" disappears.
      *   **Stopping Rule Dependence:** Irrelevant. Inference depends *only* on the observed data via the likelihood and prior. You can stop based on precision (width of posterior interval) or predictive checks, not a p-value threshold.
      *   **Publication Bias Based on p-values:** Impossible. Focus shifts to the *strength* of evidence (e.g., BF > 10 for "strong" evidence) and quality of the study/question. "Null" results with informative posterior distributions (e.g., showing effect is likely very small) become valuable.
      *   **Tallying "Positive" Findings:** Loses meaning. Meta-analysis would synthesize posterior distributions or BFs directly.
      *   **Misinterpretation of CIs:** Confidence Intervals are replaced by **Credible Intervals (CrI)**: "There is a 95% probability θ lies within this interval, given the data and prior." This aligns directly with common intuition.
      *   **Blind Spot for Power:** Power analysis (based on frequentist Type II error) is replaced by **Precision Analysis** or **Predictive Probability of Success** based on the prior and desired posterior precision.
      *   **"Non-significant = Null" Fallacy:** Explicitly rejected. A BF near 1 or a posterior centered on zero with high uncertainty simply indicates *lack of strong evidence either way*, not evidence *for* zero.
      *   **Replication as Simple Success/Failure:** Replication studies update the posterior. Success isn't just p<0.05 again; it's strengthening evidence (e.g., BF increasing, posterior narrowing).

  3.  **New Challenges:**
      *   **Prior Specification:** Requires explicit, justified priors, opening debates about subjectivity vs. objectivity.
      *   **Computational Complexity:** Historically more demanding than p-values (though less so now).
      *   **Threshold Temptation:** Risk of replacing "p<0.05" with "BF>10" or "Post Prob > 95%" as a new binary threshold.
      *   **Calibration:** Ensuring Bayes Factors or posterior probabilities reliably correspond to actual long-run performance requires careful prior choice and calibration checks.

  ### Conclusion: A Philosophically Underdetermined Hybrid
  The current institutional practice of NHST is **not** licensed by a single coherent philosophical theory. It's a pragmatic, historically contingent hybrid:

  1.  **Formal Shell:** Strict frequentism (error rates, sampling distributions).
  2.  **Interpretive Practice:** Informal evidential reasoning (surprise, evidence against H0) borrowing intuitively from likelihood/Bayesian ideas.
  3.  **Institutional Machinery:** Acts largely *as if* Bayesian (treating "significant" as "probably true", replication failure as "probably false"), but without the formal Bayesian apparatus.

  It is philosophically underdetermined in the sense that different interpretations *try* to justify parts of it, but none succeed fully across the entire system. The dependence on stopping rules is strictly required by its frequentist formal shell but deeply conflicts with the likelihood principle implicitly appealed to in evidence interpretation. The move towards estimation (CIs) and direct evidence measures (BFs) reflects an attempt to address these tensions, but institutional inertia and the simplicity of the binary "significant/non-significant" heuristic remain powerful. Shifting fully to Bayesianism resolves many contradictions (stopping rule, evidence interpretation) but introduces new challenges (priors, computation, potential for new thresholds) and requires a fundamental restructuring of reporting and publishing norms. The core tension you identified—between the formal definition of the p-value and how it's used—is the unavoidable symptom of this underlying philosophical mismatch.
