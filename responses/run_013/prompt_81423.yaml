answer: |-
  ### Correspondence Audit Table

  | Source element (architectural)          | Alleged biological counterpart                      | Correspondence | Does the mismatch damage the argument? (If so, at which step) |
  |-----------------------------------------|-----------------------------------------------------|----------------|------------------------------------------------------------|
  | Structural constraint (e.g., pendentives creating triangular space) | Biological constraint (e.g., developmental, genetic, or physical necessity) | Partial | Yes, at constraint origin step: Architectural constraint is chosen by a designer; biological constraint is an emergent, non-deliberate consequence of prior evolution. |
  | Feature claimed to be a byproduct (triangular space/spandrel) | Trait argued to be a byproduct (e.g., chin as a byproduct of jaw evolution) | Holds | No: Both are non-selected consequences of constraints. |
  | Feature's present usefulness (mosaic decoration) | Current adaptive utility (e.g., feathers co-opted for flight) | Holds | No: Both demonstrate that current function ≠ origin. |
  | Agents (architect, mason, mosaicist)    | Evolutionary forces (natural selection, drift, etc.) | None | Yes, at causal process step: Intentional agents have no counterpart; biological evolution lacks foresight or design. |
  | Available variation (alternative designs for dome support) | Available phenotypic/genetic variation in lineage | Partial | Limited damage: Architectural variation is known and accessible; biological variation is contingent and often unknown. |
  | Alternative arrangements never built (e.g., different dome supports avoiding spandrels) | Unrealized evolutionary phenotypes (due to constraints or lack of variation) | Partial | Minor damage: Architectural alternatives are explicit and testable; biological alternatives are speculative and historically inaccessible. |

  ### Prose Audit
  The analogy is partially sound but mismatches critically on agency and constraint origin. The architectural constraint is a deliberate choice, whereas biological constraints are emergent from prior selective pressures and historical contingencies. This mismatch damages the argument at the step where the anti-adaptationist infers that constraints are non-selective "givens" (in biology, constraints may be shaped by selection). However, the core weaker claim—that unselected byproducts are possible and present utility does not reveal origin—survives because it relies on logical possibility and biological evidence (e.g., exaptations like middle ear bones), not the analogy alone. The distinction between traits built *for* a role (adaptations) and co-opted *into* a role (exaptations) is preserved in the analogy (spandrel space ≠ mosaic), and this clarity supports the anti-adaptationist goal.

  The designer objection, if fatal, would also undermine adaptationist analogies (e.g., organism as machine), making it self-undermining in the broader debate. The analogy is not essential for the weaker claim, but a better comparison avoids agency: e.g., a geological formation (like a cave formed by erosion) used later for shelter. The decisive consideration is empirical: establishing that a trait arises as a necessary consequence of other adaptations without direct selection, via developmental or phylogenetic evidence.

