    "replacement_analogy": "A cave formed by erosion (non-intentional constraint) later used for shelter (co-opted utility), removing agency.",
    "decisive_consideration": "Establishing that a trait is developmentally necessary given other adaptations and lacks evidence of direct selection at origination."
  }
