  But the postdoc might counter that the anti-adaptationist must avoid the designer analogy entirely because they are arguing against design.

  Let's consider the two claims:

  Weaker claim: Present utility is not evidence of origin. This does not require the designer. We can see in biology that traits are co-opted (exaptation). The origin of a trait might be as a byproduct, and then it acquires a function. The architectural example illustrates this, but we can also find biological examples (e.g., the classic example of the panda's thumb).

  So even if we grant the designer objection, the weaker claim might survive because it is supported by biological evidence. The analogy is just an illustration.

  But the postdoc says the analogy can only do rhetorical work, not evidential. So for the analogy to have evidential value, it must map well. But if it doesn't, we must rely on biological evidence.

  Now, about the distinction between a trait built by selection for its current role and one co-opted:

  - In the architectural example, the spandrel was not built for the mosaic (it was a byproduct of the structure), and then the mosaic was added. This clearly separates the origin of the space (byproduct) from its later use (co-opted for decoration). So the example does keep them apart.

  In biology, we have traits that were built by selection for their current role (adaptations) and traits that were co-opted (exaptations). The analogy does not blur them.

  But the objection is that the constraint in architecture is chosen by a designer, whereas in biology, the constraint might be the result of past selection. So if the constraint is under selection, then the byproduct might be an indirect result of selection. The anti-adaptationist wants to say that the byproduct trait is not an adaptation, but if the constraint is shaped by selection, then the byproduct trait is a consequence of an adaptation (the constraint) and might be considered as having been shaped by selection indirectly.

  However, the byproduct objection is that the trait itself is not directly selected for. The architectural example still holds for that: the spandrel is not designed for mosaics, even though the architect designed the pendentives.

  In biology, if a constraint is under selection, then the byproduct trait is not under direct selection but might be under indirect selection. The analogy doesn't necessarily break because the spandrel is still a byproduct even if the pendentives were designed.

  So perhaps the analogy is sound for the weaker claim.

  But the postdoc says that without a designer, the building would not stand. That is true, but the point of the analogy is not to model the causal process of how the constraint arises but to illustrate that byproducts exist and that present utility does not reveal origin.

  Now, the artifact-based comparisons: adaptationists use the machine analogy. If we reject the spandrel analogy because of the designer, then we must also reject the machine analogy. So the objection would undercut the adaptationist as well. This makes the objection self-undermining if the adaptationist relies on design analogies.

  Therefore, the anti-adaptationist might be using the analogy in a tu quoque way: if you (adaptationist) use design analogies, then within that framework, byproducts exist.

  But the postdoc says that the anti-adaptationist should avoid design analogies. However, if the adaptationist uses them, it's fair game.

  Now, what would be a better analogy? Perhaps a natural formation. For example, a cave that forms due to geological processes (erosion, etc.) and then is used by animals for shelter. The cave was not designed, but it is a byproduct of geological processes. The use of the cave for shelter does not explain why the cave exists. This avoids the designer.

  But note: in biology, the constraints are not geological but are the result of evolutionary history. So it might map better.

