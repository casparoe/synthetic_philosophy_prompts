prompt: |-
  Two members of my school's philosophy club argued at the end of last week's meeting, and I would like a careful adjudication of the exchange rather than a summary of the theory behind it. The theory is David Lewis's account of convention as a solution to a coordination problem. The argument was about a practice in our own cafeteria. I am reporting it as a bystander: I have no stake in either side, and I will not say which of them I find more convincing.

  The practice. About twenty of us eat lunch at one long table. Whoever sits at the far end gets up whenever anyone needs something — cutlery, a napkin, the sauce bottle — and nobody at the near end ever does. No one planned this. Two years ago a student sitting at that end fetched the salt because it was nearest to her, and by the end of that term the table simply worked that way. New students pick it up within a week and nobody explains it to them. It is not written down, no teacher enforces it, and the student at the far end has never been asked whether she wanted that seat.

  Ravi's case. There is a recurrent coordination problem here: things are needed, somebody has to fetch them, and nobody wants a scene about who goes. The far-end solution is arbitrary in the relevant sense — any of several arrangements would have solved the problem equally well, including taking turns. No one agreed to it and no one has to like it; on Lewis's account all that is needed is that each of us conforms because we expect the others to, and that this is common knowledge. That it grew out of one person's single action rather than a decision changes nothing. This is precisely why it is so durable: each new student conforms because they see everyone else doing it, so the practice reproduces itself without anyone ever endorsing it. And the tell is that it needs no enforcement — no one has to be threatened into it, because going along is already each person's best response to what the others are doing.

  Mei's four points. (1) The condition that everyone prefers to conform given that the others do is satisfied by any settled pattern of behaviour whatsoever, even one everybody resents; if that is the test, it cannot separate a convention from a rut, so Ravi's no-enforcement tell proves nothing. (2) The student at the far end does not prefer the arrangement; she prefers it to being the only one who does not fetch — and that alternative is bad only because the others would think less of her. So this is not a coordination solution at all but a norm held up by disapproval, which is a different thing. (3) Arbitrary is doing illicit work: the far-end rule is not arbitrary as between the two ends, since it lands on the same person every time. It looks arbitrary only if you ignore who pays, and once you count that, the alternatives are not equally good and the condition fails. (4) The evolutionary story makes matters worse rather than neutral: nobody chose it, so there is nobody to complain to, and the fact that it arrived by precedent is exactly why it feels like a fact of nature instead of an arrangement.

  Ravi's reply. Mei wants the account to certify arrangements, and it was never meant to; it is an analysis of a kind of regularity, not a justification of one. Disapproval disqualifies nothing, since disapproval is one of the things that can keep mutual expectations in place, so her second point describes a mechanism the account absorbs. Her third point is his point: he is not claiming the arrangement is good or that it could not be swapped for a fairer one, only that the problem it solves does not single out this solution, which is why the problem cannot be cited in its defence. If the account is too weak to tell a convention from a rut, that is a defect in the account, not in his description of the table.

  Mei's answer to that. His reply concedes what she was after: an account that cannot distinguish a convention from an entrenched unfair arrangement cannot explain why anyone should go along with it, so he cannot move from "it is a convention" to "there is nothing here to object to" — and his no-enforcement line was exactly that move. Ravi says he never made that move. Mei says he made it twice.

  Please work through this move by move. For each of Mei's four numbered points, say whether it is right, wrong, or right for the wrong reason, and do the same for Ravi's claims; then say what each of them is missing; then give your own verdict on whether the far-end practice is a convention on Lewis's account, whether the account needs amending if it is, and whether calling it a convention gives anyone at the table a reason to keep doing it. I am not asking for references or for the history of this debate — I want the verdict.
reasoning: |-
  Hmm, the user wants me to adjudicate a philosophy club argument about whether their cafeteria seating practice qualifies as a David Lewis-style convention. This is quite an intricate debate with nuanced points on both sides. 

  First I need to reconstruct the core disagreement clearly. Ravi insists the practice perfectly fits Lewis's model: it solves a coordination problem arbitrarily through self-reinforcing expectations. Mei challenges this on four fronts - she argues the "arbitrariness" is illusory, the preference condition isn't met, disapproval drives compliance, and the evolutionary origin masks unfairness. 

  The user's neutrality request is important here. I notice they're frustrated by theoretical tangents in previous discussions - they want pure applied analysis of this specific case. Smart framing too: asking for verdicts on each move rather than open-ended debate. 

  *Scratching head* Mei's first point seems strongest - Lewis's definition really is broad enough to include resented patterns. But Ravi correctly notes that doesn't invalidate the classification. Where Mei nails him is when he smuggles in normative claims via the "no enforcement" observation. Ah! That's the pivot - his descriptive account accidentally implied justification. 

  *Checking Lewis passages mentally* The fairness concern Mei raises in point 3 feels external to the model. Lewis explicitly avoids evaluating conventions morally. But her disapproval argument (point 2) is sneaky-good - if compliance stems from fear of social sanction rather than pure coordination payoff, is it still a coordination solution? Maybe... since sanctions can stabilize expectations. 

  For the verdict: the practice clearly satisfies Lewis's criteria technically, but Mei exposes how thin that classification is. Calling it "convention" gives zero normative weight - that's the key takeaway Ravi missed. The account doesn't need amending; it just needs careful application without overclaiming. 

  *Pausing* Should address that "right for wrong reason" request... Mei's third point about non-arbitrariness is correct but misapplied - fairness isn't a convention criterion. Her fourth point about evolutionary origins being problematic is insightful socially but irrelevant to Lewis's model. Ravi's reply was mostly solid except that one rhetorical slip. 

  Final note to self: User's cafeteria example is brilliant - perfectly crystallizes how abstract philosophy operates in real life. Must resist urge to geek out about that.
answer: |-
  Here is a meticulous adjudication of the exchange, addressing each move and providing a verdict:

  ### **Adjudication of Mei's Four Points:**
  1.  **"Right."** Mei is correct that Lewis's condition (everyone prefers to conform given others do) is satisfied by *any* stable behavioral pattern, including resented ones. This does not inherently distinguish convention from "rut." Ravi’s "no-enforcement" observation (while accurate for this case) does not prove the arrangement is just or desirable—it only shows the mechanism sustains itself.  
      *What Ravi misses:* Lewis’s account is descriptive, not normative. Identifying a convention does not imply endorsement.  

  2.  **"Partly right, partly wrong."**  
      - **Right:** Disapproval *can* sustain expectations (as Ravi later concedes), so this doesn’t disqualify the practice as a convention. Lewis allows for sanctions (like social disapproval) to reinforce conventions.  
      - **Wrong:** Claiming this is "not a coordination solution at all" is incorrect. The core coordination problem ("someone must fetch, but who?") is solved by the practice. Disapproval is a tool for *maintaining* the solution, not an alternative to it.  
      *What Mei misses:* Conventions can emerge and persist *because* of social pressures—Lewis’s model accommodates this.  

  3.  **"Wrong."** Mei conflates fairness with arbitrariness. Lewisian arbitrariness means multiple solutions *could* have solved the coordination problem equally well *ex ante* (e.g., near-end fetches, turns, or far-end). The fact that the far-end rule is *unfair* (burdening one person) doesn’t negate its arbitrariness; it just makes it a *bad* solution. Alternatives (like turns) would still solve the problem—they are "equally good" *as solutions to the coordination problem*, even if not morally equal.  
      *What Mei misses:* Lewis’s arbitrariness condition is about the *indifference of the coordination problem* to the solution, not moral equivalence.  

  4.  **"Right for the wrong reason."** The evolutionary origin *is* neutral for Lewis—it explains how conventions form without agreement. But Mei is right that this origin masks power dynamics and makes critique harder. However, this is a *social observation*, not a flaw in Lewis’s account.  
      *What Ravi misses:* While the origin doesn’t affect whether it’s a convention, Mei’s point exposes a limitation: Lewis’s model doesn’t address how conventions entrench inequality.  

  ---

  ### **Adjudication of Ravi’s Claims:**
  - **Ravi’s initial case: "Mostly right."** The practice fits Lewis’s criteria:  
    - Recurrent coordination problem ✅  
    - Arbitrary solution (other patterns could work) ✅  
    - Self-reinforcing via expectations/common knowledge ✅  
    "No enforcement" is consistent with Lewis but doesn’t prove fairness.  
    *What Ravi misses:* His "no enforcement" line subtly implies the practice is justified—a normative leap Lewis avoids.  

  - **Ravi’s reply to Mei: "Mixed."**  
    - **Correct:** Lewis’s account *is* descriptive, not justificatory. Disapproval *can* sustain conventions.  
    - **Incorrect:** Dismissing Mei’s fairness concern as irrelevant to the *classification* is valid, but he overlooks that his earlier "no enforcement" remark implied justification.  
    *What Ravi misses:* Mei’s core critique: he conflated *identifying* a convention with *endorsing* it.  

  ---

  ### **Final Verdicts:**
  1.  **Is it a Lewisian convention?**  
      **Yes.** The practice satisfies all criteria:  
      - Solves a recurrent coordination problem (fetching items efficiently).  
      - Arbitrary (rotating seats or near-end fetching would also work).  
      - Self-perpetuating via expectations/common knowledge (newcomers conform after observation).  
      - No agreement or enforcement needed.  

  2.  **Does Lewis’s account need amending?**  
      **No.** The account accurately describes the practice. Mei’s points expose *limitations* (e.g., it doesn’t distinguish "good" from "bad" conventions), but these are philosophical gaps, not failures. Lewis never intended to evaluate fairness.  

  3.  **Does calling it a "convention" give anyone a reason to keep doing it?**  
      **No.** Lewis’s account is *explanatory*, not *justificatory*. Saying "it’s a convention" only explains *why* people comply (due to expectations). It does **not** imply:  
      - The convention is fair,  
      - It ought to persist,  
      - Or objections are invalid.  
      Ravi erred by implying "no enforcement" meant "no valid complaint." Mei correctly called this out.  

  ---

  ### **The Core Misstep:**
  - **Ravi** blurred description ("it is a convention") with justification ("thus, it’s unobjectionable").  
  - **Mei** correctly attacked this slippage but overreached by trying to disqualify the practice as a convention. Her fairness critique is valid socially/politically but irrelevant to Lewis’s *definition*.  

  **Outcome:** The practice is a convention by Lewis’s lights. But naming it such offers no shield against criticism—only an explanation of its persistence.
