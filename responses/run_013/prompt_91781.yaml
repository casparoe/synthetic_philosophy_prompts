prompt: |-
  ok so I need help writing a speech and I keep getting stuck, hoping you can just do it. Context: my city just set up a citizens' assembly — 40 people pulled by actual lottery from the voter rolls, they'll meet one weekend a month for a year and come up with a housing plan the council has promised to put to a public vote. I've been asked to give the opening remarks at their very first meeting, like ten-ish minutes, and I want it to actually say something rather than just "thanks for serving, coffee's in the back."

  The room is weird in two directions. Half of it is the 40 members themselves — regular people, some flattered, some visibly annoyed to lose a Saturday a month, a couple convinced the whole thing is a stunt. The other half is local political theorists and reporters who've read all the sortition stuff and will notice if I say something dumb or hand-wavy. I need it to land for both without pandering to either.

  Here's the actual argument I want to make, and I want it to do the work of the speech, not just sit there as a slogan. I think term limits have always been a half-measure. Everyone who pushes them is trying to fix the fact that the same kind of person keeps winning — the person who's good at campaigning, good at fundraising, good at being liked in the right rooms — and term limits don't touch any of that. They just make the same kind of person rotate out and a new one of the same kind rotate in. The thing term limits are groping toward, without admitting it, is that the *selection* is the problem, not the *tenure*. And a lottery is the honest version of that. So my real point to these 40 people is: you weren't chosen because you're qualified, you were chosen because you're not self-selected, and that's not a bug — it's the only reason your voice is worth anything here. The fact that you didn't angle for this, didn't want it, maybe don't even want it now, is exactly what makes you different from everyone who's ever run for something.

  But here's where it gets tricky and I need you to handle it, don't skip it: if they have no mandate, no campaign, no voters behind them, what makes them legitimate? And what do I say to the woman in the back who's thinking "I never agreed to this"? I don't want to paper over that — I want the speech to sit with the weirdness that these people hold real power precisely *because* nobody chose them and they didn't choose to be there. Make that tension do work in the speech; it should shape what I can and can't claim. I do not want to pretend they're heroes or that the lottery magically makes them wise.

  A few things:
  - Don't cite anybody, don't give me a reading list, don't name books or theorists or dates. If you want to gesture at an idea, just describe it in plain words. I can't look anything up and neither should you assume I know who said what.
  - No fake quotes. Nothing in quotation marks unless it's something I could obviously make up on the spot.
  - You're basically playing a political philosopher who's spent a career thinking about how democratic institutions actually get designed — write like that, someone who's genuinely thought about why we pick officials the way we do and isn't just repeating a TED talk.
  - Before you write the speech, brainstorm like four or five different framings of this "term limits are a diluted lottery" idea and tell me which one you're picking and why, then write the speech. Take your time with the brainstorm, I want to see you actually try a few angles before committing.
  - Keep it to roughly ten minutes spoken, so like 1200-1500 words of speech at the end, plus the brainstorm above it.

  One more thing I keep going back and forth on and you should just decide: should I address head-on the objection that random people can be bought or bamboozled by whoever's loudest in the room? Part of me thinks ignoring it looks naive to the theorists, but dwelling on it might scare the 40. You make the call and tell me why in a sentence or two before the speech.
