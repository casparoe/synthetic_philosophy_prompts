prompt: |-
  I hold the following view about vagueness, and I want to know what should move me off it. Vague predicates are semantically underdetermined: the meaning of a word like 'heap' leaves open a range of admissible sharpenings, each of which draws a precise line, and a sentence is true when it comes out true on every admissible sharpening, false when it comes out false on every one, and otherwise neither true nor false. I want to hold this while refusing two things. I won't say the world itself is vague — the grains are arranged however they are arranged, and it is my language that fails to decide — and I won't say there is a sharp line that we merely cannot know, since that reinstates exactly what vagueness was supposed to be about. I also want classical logic to survive: excluded middle should hold, and I should be able to say that it is true that he is bald whenever I can say that he is bald.

  What would count against this? Give me the arguments, cases, and formal results that should move me, ranked by how decisive they would be rather than by how often they are cited, including ones a defender would have to treat as costing something. Tell me where the view's own commitments collide — above all anything showing that it collapses into the epistemic view I rejected, or that 'admissible sharpening' is only a name for what we happen to accept, or that the notion of admissibility is itself vague in a way the theory cannot absorb. Say what the view predicts that its rivals do not, and whether it risks anything at all or has been insulated by qualification. Then say which defeaters a committed defender would concede and which they would dismiss as one more borderline case.

  Answer with: 'The view, restated' (a short paragraph, under 150 words); 'What would count against it' (the bulk of the answer, each item stating what it would show and how much it would cost); 'What the view predicts' (short); 'What a defender concedes' (short); 'Where it risks nothing' (short); and 'My verdict' (a few sentences on whether the view is well insulated and whether that is a problem). British English throughout.
reasoning: |-
  Hmm, the user has presented a sophisticated philosophical position on vagueness that combines elements of supervaluationism with specific rejections of metaphysical vagueness and epistemicism. They want me to systematically test this view against potential objections.

  Let me first restate their core position clearly: They endorse a supervaluationist framework where vague predicates have multiple admissible precisifications. Truth requires supertruth (true in all sharpenings), falsehood requires superfalsehood, and borderline cases are truth-valueless. Crucially, they reject metaphysical vagueness (maintaining the world is precise) while also rejecting epistemicism (denying there's some unknowable sharp boundary). They insist on preserving classical logic, particularly excluded middle.

  Now for the objections, ordered by how damaging they'd be to the view:

  First, the collapse objection would be most devastating - if their "admissible sharpenings" just tacitly rely on epistemic unknowability, it directly contradicts their rejection of epistemicism. This would show the position is incoherent at its core. 

  Second, the higher-order vagueness problem strikes at the heart of supervaluationism itself. If the notion of "admissibility" is itself vague, we face an infinite regress that the framework can't handle without abandoning classical logic. This undermines the entire machinery.

  Third, the forced march sorites is particularly elegant - it demonstrates how the view's commitment to excluded middle leads to absurd practical consequences when pressed. While not logically fatal, it makes the position look untenable.

  The view does make distinctive predictions: It preserves classical logic while allowing truth-value gaps, and maintains that all vagueness is semantic. But this comes at the cost of making "admissibility" do enormous theoretical work while remaining suspiciously undefined.

  A committed defender would likely concede the forced march intuition but dismiss it as merely highlighting borderline cases. They'd probably dig in their heels on the collapse and higher-order vagueness objections through technical maneuvers.

  Ultimately, while the view is elegantly insulated against some problems, its treatment of "admissibility" feels like it risks nothing - the concept becomes unfalsifiable and potentially circular. The most serious threat remains whether this carefully constructed position secretly collapses into the epistemic view it explicitly rejects.
answer: |-
  ### The View, Restated
  You hold that vague predicates (e.g., 'heap') are semantically underdetermined: their meaning permits multiple *admissible sharpenings*, each defining precise extensions. A sentence is *true* iff true on all sharpenings, *false* iff false on all, and *neither* otherwise. This preserves classical logic (excluded middle holds: "He is bald or not bald" is always true), rejects metaphysical vagueness (the world is precise; vagueness is linguistic), and rejects epistemicism (no sharp but unknowable boundary exists). Truth aligns with assertion: "He is bald" is true iff assertible.

  ### What Would Count Against It  
  *(Ranked by decisiveness, with cost to the view)*  

  1.  **Collapse into Epistemicism**  
      *What it shows*: If "admissible sharpening" covertly relies on *epistemic constraints* (e.g., sharpenings not ruled out by our knowledge), the view collapses into the epistemic theory you reject.  
      *Cost*: **Fatal**. It abandons the core commitment that vagueness is semantic underdetermination, not ignorance.  
      *Case*: Suppose we discover all precise grain arrangements. If your "admissibility" now requires compatibility with *our inability to discern* boundaries, it becomes epistemic. If not, admissibility seems arbitrary.  

  2.  **Higher-Order Vagueness Undermines Admissibility**  
      *What it shows*: If "admissible sharpening" is itself vague (e.g., borderline cases of what counts as an "acceptable" sharpening), the theory generates infinite regress or cannot classify borderline sharpenings without abandoning classical logic.  
      *Cost*: **Severe**. The theory cannot absorb its own key primitive ('admissible') without either:  
      (a) Rejecting classical logic for meta-vagueness (contradicting your demand), or  
      (b) Admitting vague ontology (contradicting anti-metaphysical vagueness).  
      *Formal Result*: No non-arbitrary formal model avoids higher-order vagueness without positing sharp meta-boundaries (effectively epistemicism).  

  3.  **The Forced March Sorites (Incoherent Assertion)**  
      *What it shows*: The view predicts assertions you *cannot coherently make*, violating your link between truth and assertibility.  
      *Cost*: **Major**. Forces choice: abandon classical logic or abandon the truth/assertion link.  
      *Case*: Walk along a Sorites series (one grain removed at a time). You accept:  
      - "n grains make a heap" is true (assertible) at start.  
      - When it becomes neither true nor false, you cannot assert "n grains make a heap".  
      - Yet excluded middle holds: "n grains make a heap or they do not" is *always* true (and thus, by your view, assertible). But you cannot assert *which disjunct holds* at borderline n. This makes assertion practice incoherent.  

  4.  **Admissibility as Merely Conventional**  
      *What it shows*: If "admissible sharpening" reduces to *what speakers contingently accept* (with no semantic constraint), the view cannot explain normative disagreement about borderline cases or the *felt incorrectness* of certain precisifications.  
      *Cost*: **Significant**. Reduces the theory to a form of radical contextualism or linguistic pragmatism, losing its objectivity.  
      *Case*: Speakers agree "1 grain is not a heap" and "10,000 grains are a heap", but deeply dispute whether a 100-grain arrangement is admissible as a heap. Your view cannot explain why this dispute isn't merely about linguistic habits.  

  5.  **Penumbral Connection Failures**  
      *What it shows*: Supervaluationism can violate intuitive logical links between vague predicates.  
      *Cost*: **Moderate**. Requires biting the bullet or ad-hoc fixes.  
      *Case*: "Is a man bald iff not hairy?" Supervaluationism allows a sharpening where a man is borderline bald *and* borderline hairy (violating the intuition that baldness and hairiness are complementary). Defenders may impose "penumbral connections" as constraints, but these can appear stipulative.  

  ### What the View Predicts  
  It uniquely predicts that classical logic is preserved *globally* (e.g., "There is a sharp cutoff" is false, while "There is a cutoff or not" is true), yet truth-value gaps exist *locally*. It denies any role for ignorance in borderline cases, attributing all vagueness to semantic indeterminacy. Rivals (epistemicism, degree theories) lack this combination.  

  ### What a Defender Concedes  
  A committed defender bites the bullet on the **Forced March Sorites**, dismissing it as a quirk of borderline cases: one can assert the disjunction without being able to assert a disjunct, which is "just how vagueness works". They reject **Penumbral Connection Failures** as resolvable by stricter admissibility constraints.  

  ### Where It Risks Nothing  
  The view risks little against **empirical counterexamples** because it posits no testable structure in the world. Its insulation comes from attributing all vagueness to semantic underdetermination—a move critics see as unfalsifiable.  

  ### My Verdict  
  The view is well-insulated against naive objections but faces two critical threats: **Collapse into epistemicism** (if 'admissibility' smuggles in ignorance) and **Higher-order vagueness** (which challenges its foundations). Its insulation is problematic: by making 'admissibility' primitive and unanalysed, it risks vacuity. While coherent as stated, it survives only if 'admissible sharpening' can be rigorously defined without epistemic or vague elements—a task no major theory has achieved. If this fails, it collapses or becomes conventionalist.
