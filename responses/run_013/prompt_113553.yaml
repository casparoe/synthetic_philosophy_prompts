answer: |-
  ### Translation of al-Ghazālī's Occasionalism into Causal-Inference Vocabulary

  #### Core Position Restated
  1. **Observable associations**: The sequence "fire contacts cotton" (X) and "cotton burns" (Y) is a statistical regularity.  
  2. **No causal arrows**: Created variables (X, Y) share no direct or indirect causal paths. Arrows in a DAG are illusions; associations arise solely from divine action.  
  3. **Exogenous node**: A single exogenous node, "God's Will" (G), with arrows to every observable event (X, Y, etc.). All endogenous variables are d-separated given G.  
  4. **Interventions (do-operator)**: Under *do*(X=x), Y still occurs reliably, but this reflects divine custom, not X's causal power.  
  5. **Invariance/modularity**: The X→Y association holds across contexts—but only because God's custom is stable, not because mechanisms are modular.  
  6. **Miracles**: Under *do*(X=x), Y may not occur if God varies His custom. This violates invariance structurally but not operationally.  

  #### Residue Report  

  1. **Causal Model Formulation**  
     - **Translation**: The DAG has G (exogenous) with arrows to all endogenous variables (X, Y, Z, ...). No arrows among endogenous variables. Faithful to occasionalism's denial of created causal power.  
     - **Distortion**: This model implies G is a confounder, but God's Will is not a "cause" in the causal-inference sense (it lacks counterfactual independence). The model silently imposes a probabilistic structure on divine action, which occasionalism rejects as anthropomorphism.  
     - **Graph Representation**:  
       ```  
       G  
       ↓  ↓  ↓  
       X  Y  Z  ... (all endogenous variables)  
       ```  

  2. **The do-Operator and Modularity**  
