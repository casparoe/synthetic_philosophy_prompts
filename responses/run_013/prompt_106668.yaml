  You are a philosopher of probability and epistemology with expertise in Bayesian confirmation theory and the epistemology of self-locating belief. I want a rigorous but self-contained explanation of a conceptual issue concerning van Fraassen's Reflection principle. Do not assume that I have any prior familiarity with the principle beyond the gloss below, and do not cite any literature; I am interested in the conceptual geography, not the bibliography. Think carefully, and begin by brainstorming the relevant distinctions (for example, synchronic versus diachronic constraints, evidential versus non-evidential influences on credence, and the difference between losing evidence and gaining evidence) before you write your final answer. Then organize your response under the following headings, in this order: The Issue Stated (about 150 words); The Principle and Its Rationale (about 300 words); The Forgetful Scientist Case (about 350 words); Candidate Resolutions (about 400 words); My Verdict (about 200 words).

  Van Fraassen's Reflection principle says, roughly, that a rational agent's current credence in a proposition A should equal her current expectation of her future credence in A, provided she believes that her future self will be rational and will have at least as much evidence as she now has. The principle is often defended as a requirement of coherence: if you now think you will later assign credence 0.8 to A, then you should now assign credence 0.8 to A. But the principle appears to fail when the future self is expected to have forgotten evidence. Suppose a scientist at time t1 has credence 0.5 in A based on evidence E. She knows that at t2 she will have forgotten E, but will have acquired a new piece of evidence F that is positively but imperfectly correlated with A. She also knows that at t2 she will be an ideal Bayesian reasoner. She can predict that her t2 credence in A will be 0.7. Should she now adopt 0.7? If she does, she seems to ignore the evidential force of E, which she currently possesses but will later lack. If she does not, she seems to violate Reflection. Explain the conceptual issue: is Reflection a genuine requirement of ideal rationality, or is it only a default that holds under special conditions? Does the principle need to be restricted to cases where the future self is at least as well informed, or is there a deeper problem with the very idea of deferring to a future self whose evidence differs from one's own? In your analysis, consider whether the scientist's current evidence E should be treated as part of her total evidence at t1, and whether the fact that she will forget E should affect her current credence. Also consider whether the case is better described as a failure of Reflection or as a failure of the scientist's future self to be rational. Finally, say what you think the case shows about the status of Reflection: is it a coherence constraint, a substantive epistemic principle, or neither?
