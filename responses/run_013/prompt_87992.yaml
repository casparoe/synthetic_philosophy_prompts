  ### Working Out Key Distinctions
  The Church-Turing thesis (CTT), as framed by Turing and Church, asserts that any function computable by an "effective procedure" (an intuitive, step-by-step algorithm) is computable by a Turing machine. Crucially:
  - **CTT is not an empirical claim about physics**: It concerns the *mathematical equivalence* of formal models (Turing machines, λ-calculus) to the pre-formal notion of computation. It does **not** address what physical systems can achieve.
  - **Computability vs. complexity**: CTT only addresses *whether* a function can be computed (decidability), not *how efficiently* (e.g., polynomial vs. exponential time).
  - **Idealization vs. physical realizability**: Systems relying on infinite precision, infinitely many steps, or exact real numbers may compute non-Turing-computable functions in theory, but such idealizations are not physically realizable. Physical implementations (e.g., analog devices with finite precision) often compute Turing-computable functions in an unconventional encoding.

  Past mistakes likely stem from conflating these. The procedure enforces separation:  
  1. **Claim type** (computability/complexity) to isolate CTT’s domain.  
  2. **Physical realizability** to filter non-physical idealizations.  
  3. **Function equivalence** to distinguish genuine non-computability from computable approximations.  
  4. **Problem equivalence** to ensure fair speed comparisons.  
  5. **Evidence threshold** to handle empirical claims outside CTT’s scope.

  ---

  ### Reusable Procedure
  **Ground Rules**:
  - **CTT scope**: Only addresses claims about computability (decidability). Speed/efficiency claims are outside CTT.
  - **Terms defined**:  
    - *Effective procedure*: Finite, discrete, mechanical steps (no "insight").  
    - *Non-computable function*: No Turing machine computes it (e.g., Halting Problem).  
    - *Physical realizability*: No infinite resources (time, precision) required.  
    - *Same problem*: Identical inputs/outputs (e.g., TSP ≠ approximate TSP).

  **Procedure Steps**:
  1. **Claim Type**:  
     - *Question*: "Is the core claim about solving a problem undecidable by Turing machines (computability), or solving a decidable problem faster (complexity)?"  
     - *Sufficient answer*: "Computability" or "complexity" (clear from pitch).  
     - *Verdict if no*: Stop—claim not relevant to CTT (e.g., human cognition).  
     - *Judgment call*: No.  

  2. **Physical Realizability (Computability only)**:  
     - *Question*: "Does the system rely on infinite precision, infinitely many steps, or unbounded physical resources?"  
     - *Sufficient answer*: Yes (e.g., supertasks) or no.  
     - *Verdict if no*: Proceed to Step 3.  
     - *Judgment call*: Yes (based on current physics consensus).  

  3. **Non-Computable Function? (Computability only)**:  
     - *Question*: "Is the system claimed to compute a known non-computable function (e.g., Halting Problem) exactly for all inputs—not an approximation?"  
     - *Sufficient answer*: Yes (with function named) or no.  
     - *Verdict if no*: Stop—system computes a Turing-computable function; switch to complexity.  
     - *Judgment call*: No.  

  4. **Same Problem? (Complexity only)**:  
     - *Question*: "Is the system solving the exact same problem as the hard digital case (e.g., identical inputs/outputs)?"  
     - *Sufficient answer*: Yes or no.  
     - *Verdict if no*: Stop—invalid comparison (e.g., analog relaxation vs. exact TSP).  
     - *Judgment call*: Yes (domain knowledge needed).  

  5. **Turing-Computable? (Complexity only)**:  
     - *Question*: "Could the system’s outputs be replicated by a Turing machine (even slowly)?"  
     - *Sufficient answer*: Yes (always for decidable problems) or no.  
     - *Verdict if no*: Reclassify as computability claim (go to Step 2).  
     - *Judgment call*: No.  

  6. **Evidence Validated? (Complexity only)**:  
     - *Question*: "Is the speedup peer-reviewed and benchmarked against state-of-the-art digital algorithms?"  
     - *Sufficient answer*: Yes (paper cited) or no.  
     - *Verdict if no*: Stop—claim unproven.  
     - *Judgment call*: No.  

  **Where the Procedure Stops**:
  - **"No"**: Step 2 (idealized), Step 3 (computable function), Step 4 (different problem), Step 6 (no evidence).  
  - **"Not interesting"**: Step 1 (non-computational claim).  
  - **Handoff to human**:  
    - Step 3 (yes): Physics investigation (non-computable function without idealizations).  
    - Step 6 (yes): Editorial judgment (validated speedup story).  

  ---

  ### Worked Examples
  1. **Analogue Device for Combinatorial Problem**:  
     - *Verdict*: "Stop—complexity claim without peer-reviewed evidence (Step 6). Framing as 'digital computers can’t handle' is misleading; problem is computable."  
     - *Deciding step*: Step 6.  
     - *Confidence*: High.  
     - *What would change it*: Peer-reviewed benchmarks showing speedup vs. best digital solvers.  

  2. **Relativistic Supertask**:  
     - *Verdict*: "No—relies on idealized supertask (infinitely many steps; Step 2). Not physically realizable."  
     - *Deciding step*: Step 2.  
     - *Confidence*: High.  
     - *What would change it*: Discovery of physics allowing actual infinities.  

  3. **Gödelian Argument (Human Minds)**:  
     - *Verdict*: "Handoff—not a computational system claim (Step 1). Philosophical, not CTT."  
     - *Deciding step*: Step 1.  
     - *Confidence*: Medium (claim often conflates truth-recognition with computation).  
     - *What would change it*: Evidence that minds compute non-computable functions.  

  4. **Quantum Annealer "Beyond Computation"**:  
     - *Verdict*: **"Stop—framing is wrong (Step 5). Computes Turing-computable functions; no evidence of non-computability. Underlying result (speed) may be real but requires validation (Step 6)."**  
     - *Deciding step*: Step 5.  
     - *Confidence*: High.  
     - *What would change it*: Proof that quantum annealing solves a non-computable function.  

  ---

  ### Limitations
  - **Most likely failure**: Step 2 (physical realizability). Assumes current physics (e.g., no infinities), which could be revised.  
  - **Revision condition**: Experimental confirmation of a physical system computing a non-computable function without idealizations (e.g., a real supertask). This would force splitting CTT (mathematical) from Physical CTT (empirical).  

