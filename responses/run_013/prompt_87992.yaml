  We are building a reusable procedure grounded in the Church-Turing thesis (CTT). Let's recall what CTT asserts and what it does not.

  Church-Turing thesis (as framed by Turing and Church): 
  - It is a thesis about the nature of computability. It asserts that a function on the natural numbers is computable by an effective procedure (an algorithm) if and only if it is computable by a Turing machine (or equivalently, by lambda calculus, general recursion, etc.). 
  - It is a claim about the pre-formal notion of an "effective procedure" (or "algorithm") and its formalization. It is not an empirical claim about physical systems.

  What CTT does NOT assert:
  - It does not say anything about the efficiency (speed, resources) of computation. A function might be computable in principle but take an impractically long time.
  - It does not claim that all physical systems can be simulated by a Turing machine (that would be the Physical Church-Turing thesis, which is an empirical hypothesis).
  - It does not say that hypercomputation (computing beyond the Turing limit) is impossible in the physical world. It only says that if we take the intuitive notion of an algorithm, it is captured by the Turing machine model.

  Distinctions to preserve:
  1. The difference between the original CTT (a conceptual claim about effective procedures) and the Physical CTT (an empirical claim about what physical systems can compute). We are grounding in the original CTT.
  2. The difference between computability (can it be computed at all?) and complexity (how fast? with how many resources?).
  3. The difference between a system that genuinely operates with non-Turing computable objects (e.g., exact real numbers, infinite steps) and one that is simulating a Turing computable function but in an unconventional way (e.g., using analog components or quantum effects to speed up a computation that could be done in principle by a Turing machine, albeit slowly).

  We are going to build a procedure that asks a sequence of questions to assess a claim that a system (or method) can compute something beyond what a Turing machine can, or that it solves a problem that is undecidable or intractable for digital computers.

