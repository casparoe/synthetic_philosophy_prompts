  Ah! The cabin fire anecdote is gold. Shows memory and notebook were intertwined systems. That's the hinge: when the '94-96 book burned, did part of Marit's mind vanish? Or was she always the system? Perfect setup for the retirement question: if mind extends to tools, does "retiring Marit" include retiring her notebooks?

