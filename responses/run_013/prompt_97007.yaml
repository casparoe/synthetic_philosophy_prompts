answer: |-
  ### Essay Question  
  **Drawing explicitly on the framework below, defend a single position that best accounts for Montaigne’s moral evaluations in "Of Cannibals." Argue whether his admiration for the Tupinambá people inadvertently replicates the ethnocentrism he critiques, or whether it strengthens his philosophical project. Support your position solely with evidence from the essay’s arguments.**  

  **Framework for Analysis:**  
  Distinguish carefully among:  
  1. **Metaethical Relativism**: Right/wrong depend solely on a society’s customs; no universal standard exists.  
  2. **Pyrrhonian Suspension of Judgment**: Withholding assent about universal standards to cure dogmatism.  
  3. **Naturalistic Universalism**: "Nature" provides an objective standard to judge all societies.  

  ---

  ### Model Answer (700 words)  
  Montaigne’s "Of Cannibals" is routinely misread as endorsing metaethical relativism—the view that morality derives entirely from local custom. While he famously states, "each man calls barbarism whatever is not his own practice," his subsequent moral evaluations of both Tupinambá and European societies transcend relativism. Instead, the essay enacts **naturalistic universalism**, using "nature" as an objective benchmark to condemn European corruption and commend Tupinambá virtue. Crucially, Montaigne’s idealization of the Tupinambá, though superficially ethnocentric, strategically strengthens his critique by exposing the artificiality of European "civilization."  

  The essay’s opening relativist gesture ("barbarism... not his own practice") functions as a rhetorical setup, not a philosophical endpoint. Montaigne immediately subverts it by evaluating societies through a universal lens: the Tupinambá are "still governed by natural laws" and thus exhibit "vigorous" virtue, while Europeans are "corrupted" by artificial desires. His praise for indigenous practices—communal property, martial valor, and simplicity—rests not on cultural preference but on their alignment with "the very words of nature." Conversely, he condemns European torture, greed, and religious hypocrisy as "barbarous" deviations from nature. This consistent appeal to nature—a transcendent standard—aligns squarely with naturalistic universalism.  

  Pyrrhonian suspension is equally inadequate. Montaigne does not withhold judgment but delivers scathing verdicts: European conquest is "treachery, disloyalty, tyranny, and cruelty"; indigenous vengeance killings are "altogether noble." His skepticism targets European arrogance, not the possibility of universal ethics. By contrasting Tupinambá innocence ("so little corrupted by artificial desires") with European decadence, he affirms nature as a normative ideal. Pyrrhonism’s therapeutic doubt is absent; instead, Montaigne wields nature as a weapon against European moral complacency.  

  Admittedly, Montaigne’s admiration for the Tupinambá risks ethnocentrism. He depicts them through a pastoral lens—noble savages embodying European fantasies of prelapsarian purity. Yet this idealization is tactical, not naive. By exaggerating Tupinambá "perfection" ("no occupation but leisure"), he exposes Europe’s *failure* to meet its *own* professed ideals. Europeans, he notes, violate Christian mercy while the Tupinambá uphold natural equity. His rhetoric thus weaponizes the "cannibal" as a mirror: if even those Europeans label "barbarians" surpass them in virtue, the critique becomes inescapable. What seems like ethnocentrism is actually a subversive appeal to Europe’s *internal* standard ("nature, which we ought to make our guide").  

  Montaigne’s naturalism is not a flaw but the essay’s core innovation. Without it, his relativist opening would reduce to empty provocation. By grounding judgments in nature—accessible through reason and contrasted with "artifice"—he universalizes his critique. The Tupinambá are admirable *because* they reveal a universal potential for human flourishing, while Europe’s "civilization" is barbarous *because* it alienates humanity from its natural state. This framework transforms the essay from ethnographic curiosity into a radical moral polemic. The unresolved tension—relativist surface versus universalist depth—is deliberate, forcing readers to confront their own contradictions. Montaigne’s genius lies in using the cannibal not as an "other" to be fetishized, but as a catalyst to rediscover objective virtue buried beneath European pretense.  

  ---

  ### Marking Scheme (Total: 20 marks)  
  Candidates must hit these five points, supported by textual evidence:  

  1. **Explicit rejection of metaethical relativism** (4 marks)  
     *Typical mistake:* Arguing Montaigne is purely relativist despite his moral judgments.  
     *Requires:* Showing how his praise/condemnation contradicts "no universal standard."  

  2. **Rejection of Pyrrhonian suspension** (4 marks)  
     *Typical mistake:* Confusing skepticism about Europe with global doubt.  
     *Requires:* Demonstrating Montaigne’s affirmative appeals to "nature" as a standard.  

  3. **Defense of naturalistic universalism** (6 marks)  
     *Typical mistake:* Not defining "nature" as Montaigne’s objective benchmark.  
     *Requires:* Proving "nature" judges *both* societies (e.g., Tupinambá simplicity vs. European artifice).  

  4. **Engagement with ethnocentrism challenge** (4 marks)  
     *Typical mistake:* Ignoring the risk of idealizing the Tupinambá.  
     *Requires:* Arguing whether admiration strengthens critique (e.g., Tupinambá as mirror) or undermines it.  

  5. **Coherent synthesis** (2 marks)  
     *Typical mistake:* Listing positions without resolving tensions.  
     *Requires:* A unified thesis (e.g., "Universal naturalism frames the essay") with logical flow.  

  ---

  ### Design Notes  
  - **Anti-Summary Guardrails:** The question mandates defending a *single position* within the provided framework, forcing students to take a stand. Requiring analysis of ethnocentrism blocks generic "Montaigne praises natives" responses.  
  - **Closed-Book Focus:** Students need only reference broad arguments (e.g., "condemnation of European torture," "praise for communal property"), not quotations.  
  - **Depth over Breadth:** The 5-point scheme prioritizes rigor on universalism (6 marks) and ethnocentrism (4 marks), where deeper thinking emerges.  
  - **Time Management:** 700 words ± 10% fits a 90-minute exam (25–30 mins planning/drafting, 55–60 mins writing).
