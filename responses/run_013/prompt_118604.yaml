prompt: |-
  OK so I volunteer at a small local archive — we're cataloging a load of old ledgers from a workers' co-op and a church poor fund, and I keep noticing the same thing: whole categories of people show up in one set of books and then just vanish in the next. The other volunteers have basically split into two camps and it's gotten a bit tense at meetings. One side says the silences ARE the story — the record is an instrument of whoever had the standing to write things down, so whats missing tells you exactly where power sat. The other side says that's us smuggling our own politics into gaps that are really just boring record-keeping conventions — a poor fund records who got money, not who existed; a co-op ledger records members, not labourers — and that 'the archive silences' has turned into a genre move you can pull on literally any source.

  I want to write the joint statement the two of them could both actually sign, because I think they're talking past each other. Can you draft that? What I'm after:

  - the claims both sides can sign, about how records get made, about what an absence can and cant tell you, and about the difference between a record that was destroyed, one that was never made in the first place, and one we just can't read;
  - the real disagreements, each written so the side that holds it would accept the wording as fair to them;
  - the cruxes — I suspect one is whether silences are systematic, pointing one way, toward the powerful, or whether they're diffuse and local; and another is whether you can ever put a number on how likely a given record-making process was to capture a particular kind of person if they were there;
  - and for each crux, a case or test both sides would agree bears on it, with each side's prediction written down in advance. Something like: find a population that turns up in one document type and not another, where we independently know from some third source that they were actually present — what does each camp predict we'd see, and does one side's story get falsified by it?

  Also, tell me how confident you actually are in the stuff you put in the 'both agree' section, and be upfront about which single bit your least sure of — I dont want a document that reads authoritative if part of it is resting on a shaky reading.
