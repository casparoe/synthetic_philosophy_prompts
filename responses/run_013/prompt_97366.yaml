answer: |-
  ## The Joke

  **You know how expressivists say "Cutting queues is wrong" just expresses disapproval, like shouting "Boo queue-cutting!"?  
  Well, imagine one says: "If cutting queues is wrong, then I shouldn't do it just because I'm late. And cutting queues *is* wrong... so I really shouldn't."  
  Their expressivist friend shrugs: "Okay, you disapprove of queue-cutting. Fine. But why does the *first part*, the 'if' bit, suddenly mean you *have* to conclude you shouldn't do it? All *I* heard in the 'if' was 'Boo possible queue-cutting scenarios!' It didn't tell me what follows."**

  ## Why it works

  *   **Targets the Sticking Point:** The punchline hinges entirely on the *embedded occurrence*. The expressivist friend perfectly illustrates the problem: they understand the asserted "Cutting queues is wrong" as expressing disapproval ("Boo queue-cutting!"), but are baffled by the *same sentence* in the conditional antecedent ("If cutting queues is wrong..."). They hear *only* the attitude-expression ("Boo possible queue-cutting scenarios!") within the conditional, losing the necessary propositional content that allows the valid inference (modus ponens) to work. The joke highlights how expressivism struggles to explain how the *unasserted* moral claim retains its standard semantic role in logic.  
  *   **Expressivist Defense Attempt:** A sophisticated expressivist (like Blackburn with his quasi-realism) might counter that they *can* explain validity by appealing to the consistency of the attitudes expressed across different contexts (e.g., disapproval of queue-cutting *and* disapproval of inconsistently applying that attitude). The "Boo!" is shorthand for a complex commitment.  
  *   **Oversimplification:** The joke simplifies by presenting the expressivist view *only* as crude "Boo!/Hooray!" emotivism when discussing the conditional. Modern expressivists offer much more nuanced accounts (like the quasi-realist project mentioned above) that try *specifically* to solve the Frege-Geach problem by building logical structure onto attitudes. The joke presents the problem starkly but doesn't engage with these more complex solutions.
