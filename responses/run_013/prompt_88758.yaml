  Okay, the user's friend with a theology degree sent them a summary about how historians determine the historical Jesus using specific criteria. The user wants me to audit each claim, point out what's accurate, what's problematic, and what's incorrect. They also have deeper questions about whether these criteria can truly reveal who Jesus was and about a shift to "memory" studies in newer scholarship.

  First, I need to break down each criterion mentioned: embarrassment, dissimilarity, multiple attestation, and coherence. The friend claims embarrassment is the strongest because the early church wouldn't invent embarrassing stories. But I recall that scholars have critiques here. For example, something embarrassing could still be created to serve a theological purpose, like highlighting humility. Also, what's embarrassing can change over time, so it's not foolproof.

  Dissimilarity is next. The friend says if a saying doesn't fit Judaism or early church beliefs, it must be from Jesus. But this assumes Jesus was entirely unique, which isn't realistic. He was part of his Jewish context. This criterion might only give us a distorted, unique Jesus, ignoring his Jewish roots. Plus, it's circular because it defines authenticity by uniqueness, which isn't necessarily true.

  Multiple attestation is about independent sources. This one is solid, but the problem is defining what counts as independent. Mark, Q, M, L—these sources are hypothetical, and their independence is debated. Also, multiple sources might just mean a widely circulated tradition, not necessarily authenticity.

  Coherence is the last. It's using the other criteria to build a picture and adding what fits. But this risks creating a circular argument. If the initial picture is flawed, coherence reinforces those flaws. It's more of a secondary check than a primary tool.

  The friend also says these work like a checklist, with more checks meaning higher certainty. But scholars use them heuristically, not mechanically. They're subjective and can conflict. Plus, newer criteria like plausibility or rejection are sometimes used to address the weaknesses of the traditional ones.

  On the claim that historians agree on Jesus as an apocalyptic preacher, healer, and teacher—there's consensus on some points, but debates exist, especially about apocalypticism. The user questions if authentic sayings equal knowing the person. That's a key point. Sayings don't capture actions, context, or development over time. A person is more than a collection of sayings; their impact and how they were perceived matter too. So there's a gap between individual sayings and the holistic person.

  Then there's the mention of memory studies. This shift focuses on how communities remember and reshape their past. It's not about authenticity but about the function of stories. Memory studies see the Gospels as collective memories that evolved, blending history and interpretation. This doesn't entirely dismiss the criteria but contextualizes them differently. It undermines the criteria by showing that the quest for "authentic" bits might miss how memory works, but it's not a total rejection.

  The user's deeper need seems to be understanding the limitations of historical methods in grasping a person's essence. They might also want to counter their friend's certainty with nuanced arguments. Explaining memory studies in plain terms is crucial here, showing it's about the process of remembering rather than fact-checking each saying.

  I should structure the response by addressing each criterion, then the consensus, the gap between sayings and personhood, and memory studies. Highlighting where the friend is partly right but oversimplified, and where newer scholarship offers different perspectives. Emphasize that history gives probabilities, not certainties, and that understanding Jesus involves both the authentic sayings and the evolving traditions of his followers.
answer: |-
  Here's a detailed audit of your friend's claims, breaking down what's solid, what's problematic, and the bigger questions about historical Jesus research:

  **Claim-by-Claim Audit:**

  1.  **"Historians don't just make this up, they have criteria... The big four are embarrassment, dissimilarity, multiple attestation and coherence."**
      *   **Nod:** This is fundamentally correct. These are indeed the traditional "criteria of authenticity" developed primarily in the 20th century (especially by scholars like Norman Perrin) and widely used as methodological tools.
      *   **Wince:** Calling them the "big four" implies they are universally agreed upon and sufficient, which isn't the case. Scholars constantly debate their value, application, and relative importance. Many also use other criteria (like "plausibility of effects," "rejection and execution," "coherence with Aramaic underlying Greek," etc.).

  2.  **"Embarrassment is the strongest one... then the church would never have invented it, so it must go back to Jesus."**
      *   **Nod:** The logic *is* intuitively powerful and often cited. Examples like the baptism by John (implying Jesus was subordinate) or the crucifixion (a shameful death) are classic cases.
      *   **Wince/Something Wrong:**
          *   **"Strongest" is debatable:** Many scholars now see its limitations more clearly. Embarrassment isn't always straightforward. Could an "embarrassing" detail serve a *theological* purpose (e.g., baptism showing Jesus' humility/solidarity; crucifixion fulfilling scripture)? What's embarrassing *changes* – baptism might have been less problematic very early on. Crucifixion was certainly embarrassing but became central theology *despite* that; does its inclusion prove its historicity or the church's need to *explain* a known fact? It's not always clear *why* something was included.
          *   **"Never invented"?** This is too absolute. Communities *can* preserve awkward traditions for various reasons (veneration of origin, theological necessity, inability to suppress a well-known fact). It's a strong indicator of *antiquity*, but not an infallible guarantee of going *directly back to Jesus*.

  3.  **"Dissimilarity is the mirror image... if a saying fits neither contemporary Judaism nor early church beliefs... those sayings are the gold."**
      *   **Nod:** The description of the criterion is accurate. It aims to identify material unique to Jesus.
      *   **Wince/Something Wrong:**
          *   **Major Problem - The Unreal Jesus:** This is the *most heavily criticized* criterion today. It assumes Jesus was utterly unique, disconnected from his Jewish context and not influencing his followers. This is historically implausible. A reconstructed Jesus based *only* on dissimilar material would be a bizarre, contextless figure. It risks creating a Jesus who is *only* what later tradition didn't like or couldn't use, ignoring his deep Jewish roots and the continuity between his message and the early movement.
          *   **"The Gold"?** No. It yields very little material and what it yields is highly questionable precisely because it strips Jesus of his context. Most scholars now see it as deeply flawed and use it extremely cautiously, if at all. It doesn't find the "gold," it finds the weird outliers.

  4.  **"Multiple attestation means if something turns up in several independent sources, it's early."**
      *   **Nod:** This is generally sound methodology. If a saying or event appears in multiple independent traditions (e.g., Mark, Q [hypothetical sayings source], Paul, John, special Matthean/Lukan material), it's less likely to be a late invention within a single community.
      *   **Wince:** Defining "independent sources" for the Gospels is complex and debated (e.g., how independent are Mark and Q? What about M and L?). It establishes *multiple early attestation*, but "early" doesn't automatically equal "authentic to Jesus" – it could be a very early *belief* or *interpretation* about him. It increases probability, not certainty.

  5.  **"Coherence means you can then add anything that fits the picture the other criteria have already built."**
      *   **Nod:** This describes the intent: to incorporate material consistent with the core deemed authentic by other criteria.
      *   **Wince:** This is the *most subjective and potentially circular* criterion. It entirely depends on the "picture" built by the other criteria. If that initial picture is flawed (e.g., overly reliant on dissimilarity), coherence reinforces the flaw. It risks simply confirming the scholar's existing hypothesis about Jesus. It's a useful *check* but a weak *primary* tool.

  6.  **"It works like a checklist — the more boxes a saying ticks the more certain it is, and if a saying ticks none of them you can be fairly confident it's later church invention."**
      *   **Wince/Something Wrong:** This is a **significant oversimplification and misrepresentation**.
          *   **Not Mechanical:** Scholars don't run sayings through a rigid checklist. They weigh the evidence *holistically* and *critically*, recognizing the criteria are heuristic tools, not objective algorithms. Different scholars weigh the criteria differently.
          *   **Conflict:** Criteria can conflict! A saying might be multiply attested but dissimilar to Judaism *and* the early church? What then? Or coherent but only attested once?
          *   **"Certainty"?** Historical Jesus research deals in *degrees of probability*, not certainty. More criteria met *increases probability*, but doesn't guarantee authenticity. Conversely, a saying meeting no criteria *might* be late invention, but it could also be an isolated authentic tradition preserved idiosyncratically, or something that simply didn't trigger the other criteria.
          *   **"Later Church Invention":** This phrase oversimplifies the creation of tradition. Much material reflects genuine theological development, interpretation, application of Jesus' teachings to new situations, or storytelling conventions of the time, not necessarily cynical "invention."

  7.  **"Since these are the shared tools of the field and different historians keep landing in the same place, we can actually say who he was: an apocalyptic preacher, a healer, a teacher of ethics."**
      *   **Nod:** There *is* a significant consensus among critical scholars on core elements: Jesus was a 1st-century Jewish apocalyptic prophet (preaching the imminent Kingdom of God), known as a healer/exorcist, and a teacher of radical ethics (e.g., love of enemy, challenge to purity norms). These points rely on evidence meeting *multiple* criteria (especially multiple attestation, embarrassment, and plausibility within his context).
      *   **Wince:**
          *   **Tools ≠ Consensus Driver:** While the tools are shared, the consensus arises more from the *convergence of evidence* interpreted through these (imperfect) tools, combined with historical context. The criteria themselves don't *guarantee* agreement.
          *   **Nuances:** The *nature* of his apocalypticism (imminent? inaugurated?), the balance between his roles, and specific ethical teachings are still debated *within* the consensus framework. Saying "we can actually say who he was" glosses over these important nuances and the inherent limitations of historical reconstruction.
          *   **"Anyone who says we can't know is mostly just being skeptical for its own sake."** This is unfair. Scholars who question the consensus often do so based on rigorous methodological critiques (like those of the criteria above) or different interpretations of the evidence. Extreme skepticism exists, but so do reasoned alternative views challenging aspects of the consensus (e.g., the extent of apocalyptic emphasis).

  **Your Bigger Question: Can criteria for sayings settle "who he was"?**

  **No, not fully, and here's why the gap matters:**

  1.  **Sayings ≠ Person:** The criteria focus on *individual units* (sayings, deeds). Authenticating a saying tells you Jesus *said* something plausible. It doesn't automatically tell you:
      *   **The context:** *Why* did he say it? To whom? In what situation? With what emphasis?
      *   **His actions:** How did he live out his teachings? His baptism, conflicts, travels, interactions?
      *   **Development:** Did his message or self-understanding evolve?
      *   **Impact:** How did he *affect* people to generate such a movement? His charisma, presence, relationships?
      *   **Self-Understanding:** Did he see himself as Messiah? Prophet? Son of Man? Something else? Sayings can hint at this, but are often ambiguous and interpreted differently.
  2.  **The "Picture" is Synthetic:** Historians use the authenticated sayings/deeds, combined with knowledge of 1st-century Judaism, Roman Palestine, and the nature of oral tradition, to *construct* a plausible portrait. This portrait is an interpretive framework built *around* the fragments. Different weight given to different fragments or different interpretations of context lead to different portraits (e.g., Cynic-like sage vs. Apocalyptic prophet).
  3.  **The Person is More Than the Sum of Parts:** Understanding "who someone was" involves integrating their words, actions, relationships, context, and impact into a coherent narrative identity. The criteria help verify some building blocks, but the *construction of the identity* is a separate, interpretive historical task prone to bias and the limitations of our sources.

  **In short:** The criteria help establish a *probable core of material* originating with Jesus. This core is essential evidence. But moving from "these sayings are probably authentic" to "this is who Jesus *was*" requires weaving that core material into a historical narrative using context, interpretation, and inevitably, some degree of historical imagination. The criteria get us to the bricks; building the house is a different, though related, task.

  **The "Memory" Shift - Explained Simply:**

  Your friend is right that "memory" is a major focus now. Here's the gist:

  1.  **What it is:** Scholars (like Dale Allison, Anthony Le Donne, Chris Keith, Sandra Huebenthal) are applying insights from sociology and psychology about how *human memory* and *collective memory* work to the Gospels.
  2.  **Core Idea:** Memories aren't like video recordings. When communities remember significant figures/events (especially after death/trauma like crucifixion):
      *   They constantly **re-shape and interpret** memories to make sense in *their present context*.
      *   Memories are **selective** – communities remember what matters *to them*.
      *   Memories are **telescoped** – details change, stories combine.
      *   Memories serve **identity-forming functions** – they tell the community who they are.
  3.  **Implications for Jesus Research:**
      *   **Shifts Focus:** Instead of hunting for the "authentic" vs. "invented" *fragments* (the goal of the criteria), memory studies look at the *overall process* of how Jesus was remembered, why certain stories were told in certain ways, and what that tells us about both Jesus *and* the early communities.
      *   **Challenges Criteria:** Memory theory directly questions the assumptions behind criteria like dissimilarity and embarrassment:
          *   *Dissimilarity:* Communities can creatively adapt traditions in ways that *look* dissimilar to their own later context. Uniqueness isn't a reliable marker.
          *   *Embarrassment:* Communities *can* preserve difficult traditions, but they *always* interpret and frame them meaningfully (e.g., crucifixion becomes victory). An "embarrassing" detail might be preserved *precisely because* it serves a powerful theological reinterpretation.
      *   **More Holistic:** It sees the Gospels not as patchworks of authentic/inauthentic bits, but as *living traditions of memory* that reflect the impact of Jesus and the evolving understanding of him *from the very beginning*. The quest for the "pre-Easter Jesus" isolated from the "post-Easter faith" is seen as artificial; the memory process started immediately.
      *   **Less Optimistic about Recovery:** It suggests reconstructing the "historical Jesus" with precision, separating him completely from how he was remembered, is incredibly difficult, perhaps impossible. We primarily access the *remembered Jesus*.
  4.  **Does it Undermine or Change the Subject?** **Both.**
      *   **Undermines:** It fundamentally challenges the *theoretical foundations* and *optimism* of the traditional criteria approach, arguing its assumptions about memory are naive. It suggests the criteria can't deliver the "assured results" they promised.
      *   **Changes the Subject:** It moves the primary goal from *fragment authentication* to understanding the *dynamics of tradition formation and community identity*. The question becomes less "Did Jesus *really* say this exact thing?" and more "Why was *this story about Jesus* told *this way* at *this time*? What does it reveal about Jesus' impact and how his followers understood him?"
      *   **Not Total Rejection:** Most memory scholars still use historical critical tools (including aspects of the criteria cautiously) alongside memory theory. They aim for a plausible historical portrait, but one deeply aware that it's mediated through memory.

  **Conclusion:**

  Your friend's summary captures the *basic outline* of the traditional criteria approach, but it's overly simplistic, confident, and outdated. He underplays the significant methodological critiques and debates surrounding each criterion (especially dissimilarity and coherence), oversimplifies their application, and overstates the certainty of the consensus portrait.

  The criteria are *tools* used to assess *fragments* of tradition. They help build a *probable core* of material, but they cannot, even in principle, fully "settle" the complex, holistic question of "who Jesus was." That requires historical synthesis and interpretation, working with the messy reality of memory and tradition.

  The shift to "memory" studies reflects a deeper understanding of how traditions about figures like Jesus form and function. It doesn't make historical inquiry impossible, but it reframes it, making it less about isolating "authentic atoms" and more about understanding the complex, evolving process of remembering that gave rise to the Gospels and the early church. This shift *does* significantly undermine the confidence and methodology associated with the traditional criteria.
