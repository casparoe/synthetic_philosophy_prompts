prompt: |-
  Act as a philosopher of biology who also knows the empirical evolutionary literature well enough to referee for a journal that publishes both evo-devo and phil-sci — not a pop-sci summarizer. Think carefully before answering, and please start by brainstorming for a bit: lay out what you take the live sub-questions to be, steelman the Gould/Lewontin side, then steelman the adaptationist (Dennett-ish) comeback, and only then give me numbers. Don't just recite the usual spandrels-vs-adaptationism stuff, I've read that a hundred times.

  Here's the thing I actually want a credence on. Suppose we could operationalize the spandrels critique into a concrete, testable index. Take any complex trait that a classic adaptationist programme would explain by invoking selection for a current function. Now let a "constraint model" — developmental bias, phylogenetic inertia, drift, allometric/architectural byproduct — try to predict the same trait from the organism's construction and history, with no appeal to the trait's current utility. Call the spandrel index the fraction of such traits where the constraint model predicts the data at least as well as the selection story. My question:

  What's your credence that the spandrel index, so defined, is greater than 0.5?

  I want the number decomposed, not just asserted. Give me a rough probability for each of these (add or drop terms as you see fit), one line of justification each, then how they combine into the headline number:

  - that the index is even well-posed — i.e. that traits can be individuated finely enough for "the same trait" to mean something across the two models, rather than the whole thing dissolving into a trait-grain ambiguity;
  - that selection and constraint are genuinely competing explanations rather than selection being what builds the constraints in the first place (if the latter, the index might be measuring nothing);
  - that the evo-devo / drift / junk-ish evidence actually favors the constraint side empirically, as opposed to just showing that constraint models can be made to fit after the fact;
  - that Gould and Lewontin themselves were making an empirical claim about trait frequencies rather than a methodological point about explanatory priority (this one matters a lot, because if the critique is really methodological, then "the index is >0.5" is arguably the wrong way to score it at all);
  - and anything else you think belongs.

  Then tell me: which single sub-term is your number most sensitive to, and what piece of evidence or argument would move it the most.

  One more thing, because I suspect it's load-bearing. A friend keeps insisting the spandrel debate has the exact same structure as the junk-DNA fight — she says the ENCODE-style "most of the genome is functional" move is just the adaptationist programme reasserting itself at the molecular level, and that the constraint side lost there in the popular press but maybe won on the merits. Do you buy that the two debates really share a structure, or is that a false analogy that's smuggling in assumptions about what counts as function? If it does share a structure, say how that should shift your index number; if it doesn't, say why, and whether that changes which sub-term you're most worried about.
