answer: |-
  Below is a complete, runnable 75-minute session plan for your philosophy of science class, designed to challenge the idea that "no reason to think one way rather than the other implies 50/50 probability." The activity uses the Bertrand paradox (though not named until the debrief) to show that "uniformly at random" requires specifying a *measure* over the space of possibilities—and that the same physical event can yield different probabilities depending on how it's parameterized.

  ### **Materials Needed (Cheap & Printable)**
  1. **Circle sheets** (1 per student):  
     - A4 paper with a printed circle (radius ≈ 8–10 cm) and an inscribed equilateral triangle.  
     - Label the triangle's side length as "L" (measure and note its actual length in cm/millimeters for reference).
     - *Example*:  
       ```
       [Circle with diameter 16 cm, equilateral triangle inside. Side L ≈ 13.86 cm.]
       ```
  2. **Physical devices for chord generation** (1 set for instructor):  
     - **Bean**: A small bean or bead.  
     - **Spinner**: A cardboard arrow spinner pinned at the center of a large circle drawn on poster paper (attach a pointer that spins freely).  
     - **Bag of slips**: 20 slips of paper with numbers uniformly spaced from 0.0 to 1.0 (e.g., 0.0, 0.05, 0.10, ..., 1.0).  
     - Ruler, marker, and a container for the slips.  
  3. **Betting tokens**: Small paper squares (≈100 total) representing "chocolate squares." Each student gets 5 at the start.  
  4. **Recording sheets** (for instructor): Track student bets and trial outcomes.

  ---

  ### **Activity Rules & Phases**
  **Core mechanic**: Students bet chocolate squares on whether a randomly chosen chord is longer than the triangle's side (L). Bets are priced at the probability they assign to the event (e.g., if they think \(P(\text{longer}) = 0.4\), they pay 0.4 chocolate squares to buy a ticket paying 1 if true).  

  #### **Phase 1: Initial Betting (10 min)**  
  - **Setup (2 min)**:  
    - Distribute circle sheets and 5 chocolate squares to each student.  
    - Explain: *"A chord is a line connecting two points on a circle. Bet on whether a randomly chosen chord is longer than the triangle’s side L. Write the price (in chocolate squares) you’d pay for a ticket that returns 1 chocolate if it’s longer. This price should reflect your belief about the probability. Keep it secret for now."*  
    - Emphasize: *"There’s no information on how the chord is chosen—use whatever reasoning feels fair."*  
  - **Activity (5 min)**:  
    - Students write their price (e.g., 0.3, 0.5, 0.6) on a scrap paper. Collect all.  
  - **Comparison (3 min)**:  
    - Write all prices anonymously on the board. *Do not comment*.  
    - **Expected disagreement**: Prices cluster around 0.25, 0.33, and 0.5 (each reflecting a different "natural" parameterization). Some students will insist theirs is "obviously correct."  

  #### **Phase 2: Physical Procedures & Rebets (50 min)**  
  Run **three methods** in sequence. For each:  
  1. **Explain the procedure** (3 min).  
  2. **Students rebet** (2 min): They write a new price for this specific method.  
  3. **Run trials** (10 min for 4 trials).  
  4. **Settle bets** (1 min per method): Pay out based on empirical frequency.  

  **Method 1: Random endpoints (Pointer spun twice)**  
  - **Procedure**:  
    - *"Spin the pointer twice to pick two points on the circle. Draw the chord between them."*  
  - **Theoretical probability**: 1/3 ≈ 0.33 (chord longer if central angle > 120°).  
  - **Trial steps** (per trial):  
    - Spin pointer, mark point A. Repeat for point B.  
    - Draw chord AB, measure length.  
    - Record if length > L.  
  - **Empirical settlement**: After 4 trials, calculate frequency of "longer." Students who bought tickets receive:  
    \[
    \text{Payout} = \frac{\text{Number of 'longer' results}}{4}
    \]  
    (e.g., 2 "longer" → payout = 0.5 chocolate per ticket).  

  **Method 2: Random radius (Distance from bag)**  
  - **Procedure**:  
    - *"Spin the pointer once to pick a radius. Draw a random distance (d) from the bag (d = slip value × radius). Mark point X at distance d from the center. Draw chord perpendicular to the radius at X."*  
  - **Theoretical probability**: 1/2 = 0.5 (chord longer if d < radius/2).  
  - **Trial steps**:  
    - Spin pointer to choose radius.  
    - Draw slip (e.g., 0.35), calculate d = 0.35 × radius.  
    - Mark X, draw perpendicular chord. Measure vs. L.  
  - **Settlement**: Same as Method 1.  

  **Method 3: Random midpoint (Bean thrown)**  
  - **Procedure**:  
    - *"Toss the bean onto the circle. If it lands inside, it’s the chord’s midpoint. Draw the chord perpendicular to the line from center to midpoint."*  
  - **Theoretical probability**: 1/4 = 0.25 (chord longer if midpoint within inner circle of radius/2).  
  - **Trial steps**:  
    - Toss bean; if outside circle, re-toss.  
    - Mark midpoint, draw perpendicular chord. Measure vs. L.  
  - **Settlement**: Same as Methods 1–2.  

  **Key instructions for trials**:  
  - Students **buy tickets at their new price** before trials (e.g., price = 0.4 → pay 0.4 chocolate for one ticket).  
  - After 4 trials, payout is **based on empirical frequency** (not theoretical probability). This makes the "hand-waving" visceral: a student confident in 0.5 may get a 0.25 payout.  
  - **Run 4 trials per method** (not 5–10) to save time. Empirical frequencies will be noisy but clearly diverge (e.g., 0.25, 0.5, 0.75 for 1/4, 2/4, 3/4).  

  #### **Phase 3: Debrief (15 min)**  
  - **Map the experience** (5 min):  
    - *"Today, the same event—'random chord longer than L'—had three different probabilities (≈0.25, 0.33, 0.5) depending on how we generated it. Your initial prices disagreed because you implicitly chose different ways to measure 'randomness.'"*  
    - Highlight: *"The principle of indifference says, 'If you can’t distinguish possibilities, assign equal probability.' But it doesn’t tell you which possibilities to count! In Method 1, we treated endpoints as equally likely; in Method 3, midpoints."*  
  - **Core problem** (5 min):  
    - *"‘Uniformly at random’ over an infinite/continuous space (like chords) requires specifying a measure. The same event can have different probabilities if we parameterize it differently—and no ‘correct’ choice is dictated by rationality alone."*  
    - Address the postdoc’s point: *"Some argue we should demand rotational invariance (probability doesn’t change if we rotate the circle). But all three methods satisfy this!* 🌀 *The real fight is over which transformations matter—e.g., should distances vs. areas be invariant?—and that’s not settled."*  
  - **Takeaway** (5 min):  
    - *"When someone says ‘no reason, so 50/50,’ ask: ‘50/50 over what variable?’ The variable isn’t neutral—it encodes assumptions about what’s being measured. Probability isn’t in the world; it’s in the description."*  
    - **Avoid**: Naming "Bertrand" or "principle of indifference" until this phase. Let the activity speak first.  

  ---

  ### **Timeline (75 min Total)**  
  - **0:00–0:10**: Phase 1 (Initial betting).  
  - **0:10–0:25**: Method 1 (Endpoints).  
  - **0:25–0:40**: Method 2 (Radius).  
  - **0:40–0:55**: Method 3 (Midpoint).  
  - **0:55–1:05**: Phase 3 (Debrief).  
  - **Buffer**: 5 extra minutes for transitions.  

  ---

  ### **What Will Go Wrong (and How to Handle It)**  
  1. **Students dig in on initial prices**:  
     - Some will insist their Phase 1 price is "right" even after seeing methods.  
     - **Response**: *"Hold that thought—let’s see how the devices pay out."* Let the empirical results create cognitive dissonance.  

  2. **Accusations of rigged devices**:  
     - If a method’s empirical frequency is far from theoretical (e.g., 0/4 for Method 1), students may cry foul.  
     - **Mitigation**:  
       - Have students run the devices (spin pointer, draw slips, toss bean).  
       - Acknowledge noise: *"4 trials are few—imagine we did 1,000. But notice the methods clearly don’t agree!"*  

  3. **Measurement errors**:  
     - Drawing chords inaccurately may misclassify "longer"/"shorter."  
     - **Mitigation**:  
       - Use a thin marker and ruler.  
       - Pre-measure L and mark it on the ruler for quick comparison.  

  4. **Temptation to explain early**:  
     - When Phase 1 prices scatter, you’ll want to "clarify." **Don’t!** The power is in the disagreement.  
     - **Script**: *"Interesting spread! Now let’s see what happens when we get specific."*  

  5. **Chaos during trials**:  
     - Students may argue over measurements or device fairness.  
     - **Control**: Assign roles (e.g., "spinner," "recorder"). Use a timer for trials.  

  6. **What the activity can’t teach (you must supply)**:  
     - The **conceptual link** between parameterization and measure. The activity shows *that* it matters, but you must articulate *why* in the debrief ("Different variables imply different measures over chords").  
     - The **invariance argument**. The activity demonstrates rotational invariance is insufficient; you must note that *other* symmetries (e.g., translational, scaling) are contested.  

  ---

  ### **Why This Works**  
  - **Discovery-based**: Students *see* disagreement in Phase 1, *experience* divergent outcomes in Phase 2, and *feel* the arbitrariness of "no reason" when their bets lose.  
  - **Low stakes**: Chocolate squares make it fun, not stressful.  
  - **No tech needed**: All materials cost <$5 to prepare.  
  - **Philosophy-first**: Forces confrontation with the gap between intuition ("rationality requires 50/50") and physical reality.  

  Run this as written, and your students will leave skeptical of glib appeals to "uniform probability"—and equipped to ask, "Uniform over *what*?"
