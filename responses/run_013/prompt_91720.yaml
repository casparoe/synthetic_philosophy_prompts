prompt: |-
  Take the role of a political theorist who's spent years on the boundary problem -- who counts as a member of the demos -- and think carefully before you write. Start by brainstorming the candidate rules and where each one bites, then commit to a recommendation.

  Here's the situation. I chair the steering committee of a tenants union we're building in a 190-unit rent-stabilized building in Queens. Next Thursday we vote on whether to authorize a rent strike and, if that goes well, a co-op buyout bid. The ugly part is the franchise: who actually gets to vote on that. On the list so far: named leaseholders; subletters; adult children of tenants who live there; the live-in super, whose apartment comes with the job; the ground-floor laundromat whose lease we'd renegotiate if we win; a couple of families who were pushed out two years ago but never left the campaign; and the co-op next door, because our boiler room shares a wall with their garage and the buyout changes who maintains it. Two members have floated rules instead of lists: a sleep test (30+ nights in the building in the past year gets you a vote) and an exposure test (a vote for anyone whose rent, job, or access to that shared wall changes depending on whether we win or lose).

  Write me the short written opinion I can circulate before the meeting. I want a concrete rule -- who's in, who's out, whether it's one person one vote or weighted -- plus an honest account of the strongest argument for the people I'm excluding. Please don't just restate the usual all-affected versus all-subjected slogans, and skip citations, further reading, or reading lists; reason from the case itself. And I've been argueing with the super about this for two weeks, so I need something I can actually defend out loud.
reasoning: |-
  Okay, the user needs a concrete rule for determining who gets to vote in their tenants union regarding a rent strike and co-op buyout. Let me start by understanding the key stakeholders involved. They have a diverse group: named leaseholders, subletters, adult children living there, the live-in super, the laundromat business, families who moved out but are still involved, and the neighboring co-op. 

  First, I should consider the proposed tests: the sleep test (30+ nights) and the exposure test (affected by outcomes). The exposure test seems broader but might include entities like the laundromat and the co-op next door. The challenge is balancing inclusion with practicality. Including everyone affected could make the vote unmanageable, especially with external stakeholders.

  The user mentioned not wanting slogans like "all-affected" vs "all-subjected," so I need a pragmatic approach. The core principle should be that voters have a direct, personal stake in the building's outcome. Leaseholders and residents are directly impacted by rent changes and living conditions. Subletters and adult children living there also face immediate consequences. The super's apartment is tied to their job, so they're directly affected too. 

  Excluding the laundromat and the neighboring co-op makes sense because their interests are commercial or external. They can be consulted separately. The displaced families, while emotionally invested, no longer have a tangible stake. Including them might set a precedent that complicates future decisions.

  Weighted voting based on unit size could address fairness since larger units have more at stake. But one person one vote is simpler and avoids complexity. Given the need for solidarity, simplicity might be better here.

  The strongest counter-argument would be from the excluded groups. The laundromat and co-op might argue their financial stakes are significant. Displaced families could feel betrayed. Acknowledging their concerns while explaining the need for a clear, resident-focused demos is key. The rule prioritizes current residents' day-to-day lives, which is the union's primary purpose. 

  I need to ensure the recommendation is defensible. Emphasizing direct residency and immediate impact should justify the inclusions. For exclusions, highlighting manageability and the union's core mission helps. The user needs to present this in a meeting, so clarity and conciseness are vital. They also need to address potential pushback, especially from the super and displaced families, by affirming their value while maintaining the rule's boundaries.
answer: |-
  ## Recommendation: The Residency Rule with Weighted Voting

  **Rule:** One vote per individual *currently residing* in the building as their primary residence, based on occupancy at the time of the vote. Votes are weighted by the number of bedrooms occupied by the voter's household.

  *   **Who's In:**
      *   Named leaseholders residing there.
      *   Subletters residing there (regardless of lease status).
      *   Adult children residing there as their primary home.
      *   The live-in super (it's their primary residence tied to employment).
  *   **Who's Out:**
      *   The ground-floor laundromat (commercial entity, not resident).
      *   Families pushed out two years ago (no longer residents).
      *   The co-op next door (external entity, not resident).
  *   **Weighting:** Households in studios/1BR = 1 vote. 2BR = 2 votes. 3BR = 3 votes, etc. *Each individual adult resident gets an equal share of their household's votes.* (e.g., Two adults in a 2BR: 1 vote each. One adult in a 2BR: 2 votes).

  ### Why This Rule? Reasoning from the Case

  1.  **Core Purpose & Tangible Stake:** The union's fundamental mission is to improve the *living conditions* and *housing security* of the people who *live here now*. The rent strike directly impacts daily life and finances. The co-op buyout fundamentally alters their tenure. Residents bear the immediate, personal consequences – eviction risk, disruption, potential gain/loss in ownership. This is their *home*.
  2.  **Manageability & Focus:** A rule based solely on "exposure" or "affected interests" becomes unworkable and dilutes the core purpose. Including the laundromat (commercial lease) or the neighboring co-op (shared infrastructure) introduces fundamentally different interests (profit, property value, external maintenance). Their stakes, while real, are distinct from the *residential community* we are building. They can be negotiated with *after* the residents democratically decide their own path.
  3.  **"Sleep Test" Refined:** While residency is key, the simple "30 nights" test is too crude. It could capture temporary visitors or exclude residents with complex lives (travel, medical care). "Primary residence" captures the *intention* and *centrality* of this place in their lives. The super clearly qualifies; they live and work here.
  4.  **Addressing Household Size & Exposure:** Weighting by bedrooms (as a proxy for unit size/cost) recognizes that larger households generally pay more rent and have more at stake financially and logistically in a strike or buyout. It avoids giving a single person in a 3BR the same voting power as 5 people in a 2BR facing collective consequences. Splitting votes *within* the household ensures individual representation while acknowledging the household's collective stake.

  ### The Strongest Arguments for the Excluded & How to Defend

  1.  **The Laundromat & Neighboring Co-op: "Our financial future is directly tied to your decisions. Excluding us ignores our material stake."**
      *   **Defense:** "Your interests are legitimate and we *must* negotiate with you seriously if we succeed. But this vote is about *our homes* and *our community*. Including commercial or external property interests fundamentally changes the nature of this democratic body from a *tenants' union* into something else. Our primary power comes from acting as residents united. We commit to engaging you fully in the *implementation* phase based on the mandate given by the residents."
  2.  **Pushed-Out Families: "We helped build this fight! We were forced out by the same conditions you're fighting. Excluding us betrays solidarity and ignores our ongoing sacrifice."**
      *   **Defense (Requires Empathy & Acknowledgment):** "Your contribution is immense, your struggle is ours, and your exclusion *feels* like a betrayal. That pain is real. However, the decisions being voted on – enduring a rent strike's risks, committing to a buyout – directly impact the daily lives, safety, and finances *only* of those currently living within these walls. You no longer face eviction from here, daily disruption here, or the potential gains/losses tied to *this specific property*. Including past residents, however justified emotionally, sets a precedent that blurs the essential boundary of who bears the *immediate consequences*. We need your support and strategy more than ever, but the vote must reflect who lives with the outcome day-to-day. We pledge to honor your role and seek your counsel."
  3.  **Against Weighting: "One person, one vote is the only fair democratic principle. Weighting privileges some residents over others."**
      *   **Defense:** "One person, one vote is foundational, but it ignores the unequal *magnitude* of impact. A single person in a studio faces a $1500/month risk. A family of four in a large apartment faces a $3500/month risk *and* greater disruption. Weighting by bedroom (not wealth or status) is a pragmatic recognition that the *scale* of exposure differs materially based on the size/cost of the home you occupy *here*. Splitting votes within the household ensures every adult resident still has an equal voice *within their unit's context*, respecting individual autonomy while acknowledging the household's collective stake."

  ### In Short
  **Focus the demos on those whose *primary home* and *daily life* are on the line.** The Residency Rule protects the union's core purpose as an organization of *residents*. Weighting recognizes the unequal scale of material impact. Excluding non-residents, however affected, is necessary to maintain a coherent, actionable democratic community focused on its immediate living conditions. Acknowledge the excluded stakeholders' legitimate concerns, commit to serious engagement later, but hold the boundary for this foundational vote. This is defensible, practical, and centers the people who *live here*.
