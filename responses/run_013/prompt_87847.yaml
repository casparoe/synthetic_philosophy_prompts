answer: |-
  **Joint Statement: Clarifying the "Brain as Computer" Debate**

  **Preamble:**  
  We agree that the core disagreement concerns the *metaphysical status* of computational descriptions in neuroscience, not their utility. The phrase "the brain computes" is ambiguous; resolving this requires distinguishing three readings:  
  - **(i) Causal-mechanical property:** The brain intrinsically performs computational operations as objective physical processes (like a laptop executing machine code).  
  - **(ii) Representational property:** The brain computes only insofar as it manipulates representational states (e.g., neurons "stand for" things).  
  - **(iii) Model-relative ascription:** "Computes" is a label we apply when a system’s behavior usefully matches a computational model, but it’s not a mind-independent feature.  

  Side A defends (i), with (ii) as a frequent corollary. Side B defends (iii), rejecting (i) and treating (ii) as derivative of modeling choices.  

  ---

  ### 1. Agreed Claims  
  1. **Neural activity can be modeled computationally.** Both sides grant that computational models (e.g., predictive coding, reinforcement learning) are empirically successful tools for predicting and unifying cognitive phenomena.  
  2. **Implementation matters.** Computational descriptions must be grounded in causal-mechanical neural processes; purely abstract computational theories without implementation constraints are inadequate for neuroscience.  
  3. **Triviality is a problem.** If any physical system "implements" infinitely many computations, this threatens computationalism unless constrained (e.g., by causal structure, teleology, or robustness). Side A grants this requires resolution; Side B grants that not all mappings are equally scientifically relevant.  
  4. **Multiple realizability holds.** The same computation (e.g., edge detection) can be implemented by diverse physical systems (retina, silicon chip). Neither side disputes this.  
  5. **Ions aren’t irrelevant.** Low-level details (e.g., ion channels) can constrain or modulate cognition. Side A grants this but insists computation is autonomous; Side B grants this but insists computation isn’t fundamental.  

  ---

  ### 2. Where They Still Differ  
  **Side A’s formulation (accepts verbatim):**  
  > "The brain intrinsically implements specific computations as objective causal processes. Computational states are real, causally efficacious features of neural machinery, and their explanatory power is autonomous—it does not reduce to non-computational descriptions."  

  **Side B’s formulation (accepts verbatim):**  
  > "Computational descriptions are valuable modeling tools that capture patterns in brain activity relative to our explanatory goals. However, computation is not a basic physical property of the brain; it arises from our interpretation of its mechanistic operations."  

  ---

  ### 3. The Cruxes  
  #### **Crux (a): Does computational equivalence imply cognitive equivalence?**  
  *Question:* If two systems implement the *same* computation, must they have identical cognitive capacities?  
  - **Test case:** A McCulloch-Pitts neuron (binary threshold unit) vs. a biological spiking neuron. Both can implement a logic gate (e.g., AND).  
  - **Side A predicts:** Cognitive differences (e.g., noise tolerance, timing precision) arise from *implementation details*, not the computation itself. The computation (AND) is identical and explanatory.  
  - **Side B predicts:** The systems are cognitively distinct *because* implementation differences matter constitutively. Calling both "AND gates" ignores critical biological variability.  

  #### **Crux (b): Can computational explanations be autonomous?**  
  *Question:* Does the computational level explain phenomena that cannot be reduced to mechanism-level descriptions?  
  - **Test case:** An analog integrator circuit (e.g., in vestibular processing) that computes velocity from acceleration. Model it computationally (integration function) vs. mechanistically (capacitor charging).  
  - **Side A predicts:** The computational description (integration) predicts system behavior (e.g., head-motion perception) without referencing capacitors/ions. This autonomy is irreducible.  
  - **Side B predicts:** The integration model is a shorthand for underlying mechanics. Any failure (e.g., phase lag) *must* be explained mechanistically; the computation adds no independent causal story.  

  #### **Crux (c): Resolving many-computations**  
  *Question:* When multiple computations fit a system’s behavior, is there a fact about which one it "really" implements?  
  - **Test case:** A thermostat. It can be described as:  
    - (1) A 2-state automaton: {OFF if <18°C, ON if ≥18°C}.  
    - (2) A PID controller with error minimization (if analog).  
    - (3) A Bayesian estimator (if noise is modeled).  
  - **Side A predicts:** Only (1) is truly implemented—it matches the causal structure (bimetallic switch). (2)–(3) are useful fictions.  
  - **Side B predicts:** All are valid relative to different goals (e.g., (1) for repair, (2) for optimization). No "real" computation exists independently.  

  ---

  ### 4. What Would Move Each Side  
  - **Side A** would concede if:  
    - A system’s *causal powers* are shown to be *insensitive* to computational changes that alter cognitive outcomes (e.g., a neural network where functionally equivalent code tweaks abolish memory).  
    - An explanatory gap is closed *only* mechanistically (e.g., why hippocampal place cells remap in novel environments explained solely via ion dynamics, no computation needed).  
  - **Side B** would concede if:  
    - A computational property (e.g., algorithmic complexity) is found to *causally constrain evolution* (e.g., brains evolve to minimize steps in a computation, independent of mechanism).  
    - A system admits only *one* physically plausible computation under all resolutions (e.g., a digital circuit with error correction that breaks all but one mapping).  

  ### 5. Verbal vs. Substantive Disagreements  
  - **Verbal:** The dispute over "literally" is partly terminological. Side A uses "computation" to mean *physical information-processing*; Side B reserves it for *model-based abstraction*. This masks agreement that brains process information in structured ways.  
  - **Substantive:** The core disagreement is twofold:  
    1. **Autonomy:** Whether computational explanations have irreducible causal/explanatory power (Side A) or are heuristic summaries (Side B).  
    2. **Natural kinds:** Whether "computation" picks out a mind-independent natural kind (Side A) or a pragmatic category (Side B).  
    
  Resolving the cruxes above would address these substantive issues. Until then, both agree: computational models are indispensable, but their ontological status remains contested.  

