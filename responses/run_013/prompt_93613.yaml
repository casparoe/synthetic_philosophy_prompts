answer: |-
  Based on your prompt and constraints, the core conceit **works**. Borges absolutely explored these radical idealist/empiricist views (Berkeley's "esse est percipi" extended to time, Humean bundle theory of self) in essays like "A New Refutation of Time" and stories like "The Garden of Forking Paths" or "Tlön, Uqbar, Orbis Tertius." The inherent tension between this metaphysics and the practical, future-oriented action implied by *any* "step"-based advice is precisely where the comedy lies. The guru, earnestly applying the philosophy, inadvertently reveals its absurdity for lived life.

  Here is the column, crafted to your specifications:

  ---

  **5 Simple Steps to Embrace the Now (Really Embrace It!)**

  1.  **Stop Planning Anything.** Seriously, just drop it. Since the future doesn't actually exist yet (it's just an idea you're having *now*), meticulously scheduling tomorrow is like carefully arranging furniture in a dream.
  2.  **Break Habits Effortlessly.** That thing you did five minutes ago? Completely gone. The "you" who did it vanished too! So the next time the urge for that habit arises, it's a brand-new, isolated event – simply choose *this instant's* fresh action instead. No need to "break" anything!
  3.  **Release Grudges & Apologies Instantly.** Who exactly are you mad at? The person who wronged "past-you" is a different collection of perceptions now. And *you* aren't the same "you" who was hurt! Same for apologies – the "you" who messed up is literally gone. Just experience *this* moment's feeling cleanly.
  4.  **Replace Worry with Pure Perception.** Worrying is just your *current* mind projecting a non-existent future. Instead, focus intensely on the exact sensory data hitting you *right now* – the colour of that wall, the hum of the fridge (*Borges might balk slightly here – "pure perception" implies a stable perceiver, which he refutes. The guru smooths this over*). Choose *this* perception instead of that worry-thought.
  5.  **Cherish Memories Lightly.** Enjoy recalling that beach vacation? Great! But remember: that "memory" is a sensation happening *now*, not a real portal to the past (which is gone forever). Savor the *current* feeling it evokes, then let it dissolve – clinging to it implies a continuous "you" stitching moments together, which just isn't happening.

  ---

  **Why this works & where seams show:**

  1.  **Premise Holds:** The column *only* makes sense (as satire) if the underlying "time/self is illusion" view is taken seriously. Each tip logically follows from that premise, making the practical advice nonsensical or self-defeating.
  2.  **Deadpan Delivery:** The voice is pure, unquestioning wellness jargon. The philosophy is the unspoken foundation, never named, making the derangement subtle.
  3.  **Comedy Source:** The humor comes from the *correct application* of the metaphysics leading to absurdity:
      *   Step 1: Denies future existence → negates planning (core function of advice columns!).
      *   Step 2: Denies persistence of self/habit → renders habit change meaningless ("choose *this* instant's fresh action" ignores conditioning).
      *   Step 3: Denies persistence of self/others → obliterates the basis for interpersonal ethics (grudges/apologies *require* continuity).
      *   Step 4: Denies future/reifying thoughts → reduces "solution" to sensory atomism, ignoring *why* worry arises (Hume might allow this focus shift as managing associations; Berkeley/Borges would question the "choosing" self).
      *   Step 5: Denies past/continuous self → turns cherished memory into fleeting, meaningless current data.
  4.  **Seams Showing:** Step 4 is the trickiest. The act of "choosing" perception implies a persisting agent/volition, which the philosophy denies. The guru breezily says "choose *this* perception," papering over the fact that "choosing" requires a self enduring long enough to make a selection. A sharp Borges reader spots this logical tear in the fabric.
  5.  **Derangement for All:** A non-Borges reader will feel the tips are impractical, unsettling, or nihilistic ("Never apologize? Memories are *just* current feelings?"). A Borges reader laughs at seeing the logical conclusions of "A New Refutation of Time" turned into vapid self-help, especially the total collapse of identity and responsibility in Step 3 and the hollowing out of meaning in Step 5.
  6.  **Bending Borges:** As noted in Step 4, the concept of actively "choosing" perceptions or thoughts sits uneasily with the radical dissolution of the self. Borges/Hume emphasize passive succession of perceptions. The guru smuggles in agency because otherwise, *no* "step" could even be conceived, let alone followed. This necessary bend is the most visible seam.

  The column delivers precisely what you asked for: Borgesian metaphysics weaponized by a clueless guru, creating comedy through earnest application and revealing the quiet derangement inherent in taking those ideas literally for daily life. Enjoy the timeless (or rather, time*less*) absurdity!
