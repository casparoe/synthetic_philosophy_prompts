prompt: |-
  I run a very small interview podcast — like 300 listeners, mostly grad students and a few people who found me through a link somewhere — and next month's guest is a philosopher whose work I've been following for years. She defends what she calls the stepladder view of moral status, and I want to prep properly rather than wing it. Here's the view so you know what we're dealing with, because I don't want generic questions about animal welfare: she fully accepts that sentience comes in degrees, but she denies that moral status slides up smoothly with it. Instead there are four thresholds — bare experience, valenced experience (pleasure/pain), a self that persists across time, and preferences about one's own future — and crossing any one of them bumps a creature up an entire tier, while all the variation in richness of experience within a tier is morally inert. So on her view the gap between a bee and a fish is supposed to be much bigger than the gap between a fish and a dog, and below the first threshold (thermostats, plants, maybe some very simple nervous systems) nothing counts at all. She also holds that insect numbers don't swamp the calculus, because weight below a threshold is literally zero rather than small-but-positive, which is the part I suspect is most exposed.

  Give me eight to ten questions that actually make her work. I've heard her do a bunch of interviews where she just restates the four tiers and everyone nods, and I want to avoid that entirely. At least a few should go after the discreteness itself — if the underlying capacities (integration, memory, whatever it is) vary continuously, what makes the moral jump discontinuous, and isn't that just parking the cutoffs where our intuitions already sit? Then the obvious trap: where exactly is the tier 1 / tier 2 line, what does she say when it turns out to be vague, and how does she stop that vagueness from metastasizing up through every tier. Also press her on the epistemic side — how would we ever know a shrimp is tier 2 rather than tier 1, and what would change her mind — and on the modal case, a creature that has the machinery for valenced experience but in practice never has any. I'd also love one about a creature that flickers: valenced experience for a few seconds a day, or only under stress, or only in juveniles. I'm definately going to run long, so give me a follow-up for each question keyed to the answer she's most likely to give, and flag which ones I should be ready to cut.

  Format the whole thing as a JSON array, one object per question, in the order I should ask them, with these fields: "q" (the question in the words I'd actually say into a mic, not a topic label), "target" (one line on which part of her view it's aimed at), "expected_reply" (the answer she's most likely to give), "follow_up" (my next question if she gives that answer), "risk" (high, medium, or low, for how much it could rattle her), and "cut_first" (true or false).
reasoning: |-
  We are going to create a list of 8-10 questions in JSON array format, each as an object with the specified fields.
   The questions should be in the order to ask, and we need to target the core of her view, especially the discreteness, thresholds, vagueness, epistemic issues, and edge cases.
   We'll include questions that press on the discontinuity, vagueness of thresholds, epistemic challenges, modal cases (capacity without actualization), and flickering cases.
   Each question object will have:
     "q": the actual question as spoken
     "target": a short description of which part of her view it targets
     "expected_reply": the most likely answer she would give
     "follow_up": the follow-up question if she gives that expected reply
     "risk": high, medium, low (how much it might rattle her)
     "cut_first": true if this is a question that can be cut if running long, false otherwise

   We are to avoid generic questions and focus on making her defend the key points.

   Let's plan the questions:

   1. Discreteness: Why thresholds instead of a continuous sliding scale? And isn't this just codifying intuitions?
   2. Vagueness: How to handle borderline cases (e.g., organisms near a threshold) without the vagueness undermining the entire tiered structure?
   3. Epistemic: How do we know which tier a being is in, especially for less studied creatures? What evidence would change her mind?
   4. Modal case: A being with the capacity for valenced experience but never actually experiencing it (e.g., a creature in a constant state of contentment or without any stimuli) - does it have moral status?
   5. Flickering: A being that only occasionally crosses a threshold (e.g., only during stress, or only at certain life stages) - how do we assign moral status?
   6. The zero-weight below threshold: Why not even a tiny bit of moral weight? And how to avoid the swamping problem without being arbitrary?
   7. The jump between tiers: Why is the gap between a bee and a fish so much bigger than between a fish and a dog? What is the moral significance of that jump?
   8. The top tier: Preferences about one's own future - why is that the highest tier? What about beings that have preferences but not about the future (or not in a complex way)?
   9. Practical implications: How should this view change our treatment of insects in agriculture or research? And if we are uncertain about an insect's tier, what should we do?
   10. A question about the aggregation within a tier: If all beings in a tier have the same moral status, does that mean we should be indifferent between harming one being in a tier versus another in the same tier, regardless of their individual capacities? (e.g., a dog with a rich inner life vs. one that's less so, but both in the same tier)

   We'll aim for 10 questions and then mark some as "cut_first": true.

   Order: We want to start with the core and then move to edge cases and implications.

   Let's structure the order:

   1. Start with the discreteness question (core).
   2. Then the justification for the thresholds and the jump between tiers.
   3. Vagueness and borderline cases.
   4. Epistemic: how we know and what would change her mind.
   5. The zero-weight issue (the most exposed part).
   6. Modal case.
   7. Flickering case.
   8. The top tier and why preferences about the future matter.
   9. Within-tier variation and moral indifference.
   10. Practical implications and uncertainty.

   Now, we write each question as an object.

   Note: We are to write the questions as we would say them into the mic.

   Let's create the JSON array.
answer: |-
