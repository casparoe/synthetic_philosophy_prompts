  **Execution Notes:**  
  1. **Order Logic:** Starts with foundational discontinuity justification, moves to concrete thresholds (vagueness → zero-weight), then explores edge cases (modal → flickering), and ends with falsifiability. High-risk questions early while energy is high.  
  2. **Cut Prioritization:** Flagged lower-risk/policy questions for cutting if needed. Never sacrifice core discreteness or vagueness challenges.  
  3. **Follow-Up Design:** Each probes weaknesses in likely replies—e.g., pressing the capacity/actualization distinction when she invokes potential.  
  4. **Mic-Ready Phrasing:** Uses accessible examples (shrimp, mayfly) and avoids jargon. "Stress-test," "flicker," and "moral gambling" make abstract ideas visceral.  
  5. **Risk Management:** High-risk questions (#1, #2, #5) target her most vulnerable claims but are phrased respectfully around "testing" the view.  

  **Recommended Trims if Time-Crunched:** Cut #3 (zero-weight epistemic), #6 (comparative gaps), or #8 (within-tier trade-offs). Keep the sequence of #1→#2→#4→#5→#7 intact to maintain argumentative coherence.
