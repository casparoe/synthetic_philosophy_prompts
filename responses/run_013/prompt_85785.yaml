  The swapped-self-model case likely incoherent—if all functional properties are identical, the "undergoing" difference can't exist. The user/friend probability gap (0.3 vs 0.8) probably stems from (c): the user sees stripping character as eliminating existence, while their friend treats existence as primitive.

  This seems fundamentally unresolvable through empirical workspace models alone—it's about what "experience" means. The numbers are somewhat arbitrary, but they force clarification of where the disagreement lies. I'll present this with clear justifications and emphasize the conceptual nature of the dispute.
