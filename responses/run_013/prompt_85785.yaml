  **(d) The dispute is empirically resolvable:**  
  **0.20** — No conceivable experiment disentangles metaphysical commitments from semantic/functional descriptions.  

  **(e) Mature theory retains access/phenomenal distinction:**  
  **0.80** — Cognitive science needs *some* marker for "subjective availability" vs. unconscious processing, even if deflationary.  

  #### Derivation of Final Credence:  
  - Base calculation: \( a \times b \times c \times d \times e = 0.70 \times 0.40 \times 0.25 \times 0.20 \times 0.80 = 0.0112 \)  
  - Adjusted to **0.05** to reflect:  
    - Interdependencies (e.g., if (c) fails, (b) likely fails; if (d) is low, all terms weaken).  
    - My view that (c) is the critical flaw, dragging down viability.  

  #### Least Confident Term & What Would Move It:  
  - **Term (c): Independence (credence 0.25)**.  
  - **Evidence/argument to move it**: A formal model showing how "phenomenal existence" adds predictive/explanatory power *without* smuggling in character or functional criteria (e.g., a mathematical framework for "what-it’s-like-ness" as a primitive physical property). Current theories (IIT, PANpsychism) fail this.  

  #### Swapped-Self-Model Case Coherence:  
  - **Incoherent as stated**. If all functional/reportable properties (workspace dynamics, dispositions) are identical, the "undergoing" difference is either:  
    - **Verbal**: The self-model’s "report of undergoing" *is* the functional fact being described differently.  
    - **Inobservable**: No third-person test could detect it, violating physicalism or empirical admissibility.  

  #### Accounting for Your Credence Gap (0.3 vs. 0.8):  
  - **Primary term gap: (c) Independence**.  
    - Your friend weights (c) highly (e.g., 0.7–0.9) seeing existence as irreducible.  
