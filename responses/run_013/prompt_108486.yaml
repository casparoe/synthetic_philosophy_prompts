answer: |-
  The asymmetry in how common-law systems treat contradictions reveals fundamental jurisprudential presuppositions about the nature of legal acts, institutional authority, and truth-aptness. Here's a reconstruction of the commitments:

  ### Core Presuppositions of Current Practice
  1. **Non-Truth-Apt Institutional Acts**  
     Verdicts are **performative institutional acts**, not truth-claims about factual reality. A jury’s "guilty" verdict *creates* a legal status (conviction), while an acquittal *terminates* liability. They are exercises of sovereign power, not assertions requiring logical coherence. Contradiction is irrelevant because verdicts lack propositional truth-value.

  2. **Institutional Finality Over Logical Coherence**  
     The system prioritizes **jury sovereignty** and **finality of verdicts**. Juries render unreviewable judgments as lay factfinders embodying community conscience. Permitting inconsistency acknowledges human reasoning may be non-linear or compromise-driven. To demand consistency would undermine this constitutional role.

  3. **Functional Distinction Between Legal Instruments**  
     - **Contracts/Statutes**: Are **forward-looking directives** requiring predictability. Internal contradictions undermine their core function (governing future conduct).  
     - **Verdicts**: Are **backward-looking resolutions** of discrete disputes. Contradiction affects no systemic function beyond the case.  

  4. **Quarantine, Not Paraconsistency**  
     The practice **does not endorse paraconsistency** (where contradictions are locally true without trivializing the system). Instead, it treats inconsistency as a **procedural artifact** isolated due to unreviewability (*Dunn v. United States*, 1932). The law of non-contradiction still applies *within* each count (e.g., a jury cannot declare "guilty and not guilty" *on the same count*).

  ---

  ### What Would Change Under a Consistency Requirement?
  If a jurisdiction mandated reconcilable verdicts (e.g., overturning convictions like *People v. Robinson* in NY):
  - **Loss of Jury Sovereignty**: Deliberations would become reviewable, eroding the jury’s constitutional role. Judges would scrutinize reasoning, not just outcomes.
  - **Increased Appeals & Retrials**: Inconsistent verdicts would trigger automatic reversals, burdening courts and exposing defendants to double jeopardy risks.
  - **Shift in Verdict Ontology**: Verdicts would implicitly become **truth-apt assertions**. A conviction’s validity would depend on logical harmony with acquittals, importing coherence theory into factfinding.
  - **Strategic Voting Risks**: Juries might compromise illogically to *avoid* overturnable inconsistency (e.g., acquitting on both counts despite evidence to convict on one).

  ---

  ### Commitments vs. Accommodations
  | **Strict Commitment**          | **Accommodation**                     |
  |-------------------------------|---------------------------------------|
  | Verdicts as institutional acts | Juries’ non-rational decision paths   |
  | Jury unreviewability           | Isolated factual errors               |
  | Finality over coherence        | Public perception of inconsistency    |
  | Distinction between legal acts | Moral discomfort with illogical outcomes |

  ---

  ### Conclusion
  The asymmetry presupposes that **contradiction matters only when it impedes a legal instrument’s function**. Verdicts function as dispositive acts, so inconsistency is tolerated as the price of finality. Contracts/statutes function as rule systems, demanding coherence. The criminal practice neither embraces paraconsistency nor wholly suspends non-contradiction; it **compartmentalizes inconsistency** within an unreviewable black box. Requiring consistency would transform verdicts from authoritative acts into truth-apt propositions, fundamentally altering the jury’s role and the system’s epistemology.
