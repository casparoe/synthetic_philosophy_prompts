prompt: |-
  Ok, slightly weird question, sorry in advance. I'm writing a paper on corporate responsibility and I've been reading about collective intentionality — Searle, Bratman, that crowd — and I keep hitting the claim that 'we-intendings' are irreducable to individual intentions, that they're primitive and can't be built up out of everybody's separate I-intentions. The way I read that is: a group can intend something that none of its members intends. Concrete case I had in mind: a board votes 4-3 to close a plant, and every single director is voting for it only as the least-bad compromise — nobody wants the plant closed, yet 'the company' closed it. That seemed like exactly the tool I needed for the corporate-responsibility bit. But my friend says I've got irreducibility backwards and now I'm worried the whole paper rests on a misreading. So: where does the group's intention live, if it's not in any member's head — is there supposed to be some kind of group mind, or is that just not what the claim is about? And if it's not that, what does irreducibility actually mean? Does any of it help with the corporate-responsibility thing at all, or am I mixing up two different debates? I'm coming from the ethics side so go easy on me.
reasoning: |-
  Okay, let me unpack this user's question. They're writing a paper on corporate responsibility and got tangled in collective intentionality theory. The core confusion seems to be about the "irreducibility" claim - they thought it meant groups can have intentions that no member holds, using that board vote example where everyone compromises yet the company "intends" to close the plant. But their friend called this a misreading, and now they're worried their entire argument collapses.

  Hmm, I see where the mix-up happened. The user interpreted irreducibility as group intentions being completely detached from individual minds - like some mystical group consciousness. But Searle and Bratman actually mean something subtler: that "we-intendings" are a distinct psychological mode, not that they float independently. It's like the difference between saying "orchestras produce music no single musician plays" (true) versus "orchestras produce music with no musicians" (absurd).

  The plant closure case is fascinating because it exposes the gap between collective action and individual commitment. Each director had "I-intentions" about voting strategically, but the group's "we-intention" emerges from the voting procedure itself. The irreducibility here is about the structure: the collective decision can't be broken down into identical individual mental states because (1) some members opposed it, and (2) even supporters only accepted it reluctantly. 

  For corporate responsibility, this actually strengthens their argument! The key isn't that the group has freestanding intentions, but that responsibility attaches to the collective action mechanism. When a company acts through its decision-making structures, it creates outcomes that can't be fully blamed/credited to any one person. That's gold for their paper - they just need to reframe, not abandon the thesis.

  The user seems stressed about their foundation crumbling, so I should emphasize that their intuition was partially right and guide them toward Bratman's "shared intentions" model. The ethics angle is crucial too - they might find Margaret Gilbert's joint commitment theory helpful for linking irreducibility to responsibility. 

  Biggest clarification: irreducibility ≠ group minds. It's about the interdependence of intentions within institutional frameworks. The plant closed because the board's rules transformed conflicting "I-intentions" into a collective "we." That's exactly how corporations escape individual moral thresholds - and precisely why we need theories of corporate responsibility.
answer: |-
  Don't apologize – this is a core and fascinating philosophical puzzle directly relevant to corporate responsibility! You've hit on a genuine tension, and your friend is pointing out a subtle but crucial distinction in collective intentionality theory. Let's break it down:

  **1. What Irreducibility Does *Not* Mean (The "Group Mind" Red Herring):**

  *   **No Group Mind:** Almost no serious contemporary philosopher (including Searle, Bratman, Gilbert, Tuomela) argues for a literal, supernatural "group mind" separate from the minds of its members. The intention isn't floating in the ether.
  *   **Not "Intention *Contrary* to All Members":** Irreducibility **does not** mean the group intends something that *no individual member* intends *at all* in any way related to the collective action. Your plant closure example is actually a great case to explore the *limits* and the *core* of irreducibility.

  **2. What Irreducibility *Does* Mean (The Subtle Core Claim):**

  The claim is that **"We intend to do X"** is a *primitive*, *sui generis* form of intentionality. It cannot be fully *reduced* to or *analyzed solely* as a conjunction of individual "I-intend" statements *of the same kind*. Here's the breakdown:

  *   **Not the *Content*, but the *Form*:** The irreducible part is the *we-perspective itself*. An individual can hold an intention *with the form* "We intend to do X." *This* "we-intention" is distinct from an "I-intention" like "I intend that we do X" or "I intend to do my part in our doing X," even though it obviously involves the individual.
  *   **Interdependence & Reflexivity:** A genuine "we-intention" in an individual is *interdependent* on their beliefs about the "we-intentions" (or relevant cooperative attitudes) of the others. My intention that *we* dance is shaped by my understanding that you also intend that *we* dance and that we recognize this mutual intention. It's a reflexive, interconnected state.
  *   **More than Sum of Parts:** While *based* in individual minds, the *structure* of the shared intention involves mutual recognition, interdependence, and a commitment to the joint activity that isn't captured by simply listing individual "I intend to do my task" statements, even if those tasks are coordinated. Bratman emphasizes the *meshing* of subplans.

  **3. Your Plant Closure Case Revisited: Where Does the Group Intention "Live"?**

  This case brilliantly highlights the complexity and why your initial intuition has merit, but also where the irreducibility claim is more nuanced:

  1.  **Individual Intentions:** Each director has complex *individual* intentions:
      *   "I intend to vote for closure" (as a strategy/compromise).
      *   "I intend to abide by the board's rules/procedure."
      *   "I intend that the board, as a collective, makes a decision."
      *   *Crucially:* **Not a single director has the intention "We (the board) intend to close the plant" as a primitive commitment.** They each have instrumental or procedural intentions *leading to* that collective outcome.
  2.  **The Collective Outcome:** The board *does* act – it votes and the motion passes. The plant *is* closed "by the company."
  3.  **The Gap:** The *collective decision to close* emerges from the *procedure* (voting rules) and the *individual strategic/procedural intentions*, **not** from a set of primitive, interdependent "we-intend to close the plant" states in the directors' minds.
  4.  **Where the Group Intention "Lives" (Institutional Reality):** Searle would argue the collective intention here is *institutional*. It "lives" in:
      *   **The Collective Acceptance of the Procedure:** The directors collectively accept the voting rules *as* the way the board forms intentions and makes decisions.
      *   **The Status Function:** The utterance "The motion passes 4-3" *counts as* the group's intention to close the plant *within the institutional framework* of the corporation and its board. This status function is collectively recognized.
      *   **The Institutional Record:** The minutes, the official announcement – these document the *institutional fact* of the board's decision (intention).
      *   **The Members' Recognition:** Each director, even the dissenters, understands that *according to the rules they all recognize*, the board has decided (intends) to close the plant. They may not *like* it or *personally commit* to it, but they acknowledge the institutional reality.

  **4. Irreducibility Applied to the Closure Case:**

  *   **Yes, Irreducible:** The *institutional intention* ("The board intends to close the plant") cannot be reduced to the *specific I-intentions* of the members regarding the *closure itself*. None of them individually intended the closure *as a collective goal they were jointly committed to*. The group intention is a product of the institutional procedure acting on their individual inputs. Its *form* (the official corporate act) is irreducible to the psychological states *about the specific outcome*.
  *   **Not "Primitive We-Intention":** However, it's *also* not an example of the *primitive, pre-institutional "we-intention"* that Bratman or Searle analyze as foundational for simpler joint actions (like painting a house together). It's a more complex, institutionalized form of collective intentionality.

  **5. Relevance to Corporate Responsibility (Yes! It Helps!):**

  **This is EXACTLY why collective intentionality is crucial for corporate responsibility:**

  1.  **Agency Beyond Individuals:** It provides a framework for saying the *corporation itself* (as an institutional agent) intended and acted to close the plant, even though no single individual fully embraced that intention personally. The responsibility attaches to the collective agent formed by the institutional process.
  2.  **Explaining the Gap:** It explains the "responsibility gap" you identified: the outcome (closure) is directly attributable to the corporate entity's intentional act, even though tracing that intention directly and wholly to the specific psychological states of any one (or all) members is messy or impossible. The *procedure itself* becomes the locus of intentionality formation for the group.
  3.  **Grounding Collective Blame/Praise:** If corporate actions stem from irreducible collective intentions (institutional or primitive), then it makes sense to hold the *corporation* responsible, distinct from just holding individual members responsible for their votes or actions. The collective entity acted intentionally.
  4.  **Managing Complexity:** Large organizations constantly form intentions (policies, strategies, decisions) that no single member fully grasps or personally endorses in every detail. Collective intentionality theory provides tools to understand how this happens and how responsibility accrues.

  **Conclusion & Advice for Your Paper:**

  *   **You Didn't Have it *Fully* Backwards, You Were onto Something:** Your plant closure case perfectly illustrates the *need* for an account of collective intention that goes beyond summing individual I-intentions *about the specific outcome*. It shows how corporate action emerges from structure and procedure.
  *   **Clarify the Type of Intention:** Distinguish between:
      *   **Primitive We-Intentions (Bratman):** Foundational for small-scale, cooperative joint action (requires mutual commitment, meshing subplans).
      *   **Institutional We-Intentions (Searle):** Generated by collectively accepted procedures and status functions within organizations (like board votes). *This is the key for corporations.*
  *   **Reframe the Irreducibility:** Emphasize that irreducibility means the collective intention (especially institutional) has a *logical and functional structure* that cannot be captured by a simple list of individual intentions *of the same kind* regarding the *collective action itself*. It emerges from the interaction of individual attitudes *plus* the institutional framework.
  *   **Focus on Institutional Mechanisms:** For corporate responsibility, lean heavily on Searle's notion of status functions and collective acceptance of procedures. The board's vote *is* the corporate mind in action, by its own collectively accepted rules. The "group intention" lives in the institutional fact created by the procedure.
  *   **Address the Gap:** Explicitly use your case to show how responsibility can belong to the corporation (due to its institutional intention/action) even when individual members lack full personal commitment to the outcome.

  **Your paper absolutely *does not* rest on a misreading.** You identified a genuine problem that collective intentionality theories are designed to solve. Your friend correctly pointed out that irreducibility isn't about a group mind or intentions contrary to all members, but your core insight about corporate action and responsibility needing more than just aggregated individual intentions is sound and powerfully supported by the *institutional* interpretation of collective intentionality. Refine the framing using Searle's apparatus, and you have a strong foundation. Good luck!
