  Okay, the user is a doctoral student in political ethics, focusing on the welfare state's architecture. They present a puzzle: how can liberal democracies justify using different criteria (contribution, residence, citizenship) for different benefits while asserting universal human equality? They want the implicit theory reconstructed, tested for consistency, and analyzed under cosmopolitanism.

  Hmm, this is a sophisticated query. The user clearly understands the tension between universalism and particularism in welfare states. Their four questions drill into: 1) whether special obligations exist, 2) what those obligations are, 3) where theories converge, and 4) what changes under cosmopolitanism. They're not after literature but rigorous philosophical dissection.

  First, I need to unpack the implicit premises. The tripartite system isn't random—it reflects layered justifications. Contribution-based benefits (pensions) lean on reciprocity, residence-based (healthcare) on territorial obligation, citizenship-based (voting) on collective self-determination. But the friction points matter most, like taxing long-term residents without political voice. That exposes a rift between "belonging" definitions.

  For question 1, the practice absolutely presupposes special obligations. If it were merely about capacity ("we help because we can"), why deny benefits to needy non-residents? Agent-relative permissions don't fully explain either—why prioritize compatriots unless their claims are stronger? The architecture assumes insiders have distinctive moral weight.

  Question 2 is trickier. The three rationales aren't inherently inconsistent but operate in tension. Reciprocity (contribution) and territoriality (residence) can align—e.g., residents pay taxes, fund services. But citizenship-based exclusion creates fissures. Think of non-citizen residents: they're "in" for taxes/healthcare (territorial logic) but "out" for voting (national logic). The state cherry-picks rationales situationally, revealing citizenship as the master criterion that overrides others when convenient.

  On question 3, underdetermination appears where rival theories agree. Both nationalists and moderate cosmopolitans accept residence-based schooling (territorial integration) or contribution-based pensions (fair returns). Even border control finds overlap—cosmopolitans permit restrictions for institutional stability. The true divides emerge only at extremes: open borders versus birthright citizenship.

  Finally, cosmopolitan redesign. Stripping nationalist premises guts citizenship-based exclusions: voting rights and unconditional residence would extend to all residents. Contribution requirements could stay (reciprocity isn't nationalist), but safety nets would cover all humans in territory. Crucially, territorial logic survives—cosmopolitans still need operational units—but its boundaries soften. The untouched elements? Anything resting on reciprocity or pure administrative feasibility.

  The user's buried ask might be: "Can I critique this system without endorsing radical cosmopolitanism?" Yes—by highlighting the citizenship-residence hypocrisy alone. They don't need to burn the welfare state; just expose its nationalistic seams.
answer: |-
  The welfare state's tripartite architecture reveals an implicit theory built on **layered obligations**, where the state acts as a fiduciary for distinct, overlapping constituencies. Below is a reconstruction, consistency analysis, underdetermination mapping, and cosmopolitan transformation of this implicit theory.

  ### 1. **Does the practice presuppose special claims?**  
     **Yes, it presupposes robust compatriot partiality.**  

     - **What it strictly presupposes:**  
       - The contribution requirement (e.g., pensions) assumes a **quasi-contractual relationship** between the individual and the state-as-insurer. This is agent-neutral: anyone meeting criteria qualifies, regardless of nationality.  
       - Residence-based entitlements (e.g., healthcare) assume a **territorial obligation**: the state owes duties to all *within its jurisdiction* because it exercises coercive power over them.  
       - Citizenship-based exclusions (e.g., voting, immigration control) presuppose **collective self-determination**: the polity has the right to define its membership and prioritize co-members.  

     - **What it accommodates (but doesn’t require):**  
       - Agent-relative permissions (e.g., "we help our own first") or pragmatic capacity ("only we can help our residents"). These could justify similar outcomes but are insufficient to explain *citizenship hierarchies* or *exclusion of needy non-residents*.  

     - **Why special claims are essential:**  
       If mere capacity or agent-relativity sufficed, states could extend core benefits (e.g., emergency healthcare) to non-resident foreigners without undermining their logic. They do not. The systematic exclusion of outsiders—despite their need—reveals a deeper commitment to compatriot priority.

  ### 2. **Consistency of the Three Rationales**  
     The rationales are **instrumentally complementary but normatively tense**. Citizenship acts as the "master criterion" overriding others when conflicts arise.  

     - **Points of consistency:**  
       - *Reciprocity (contribution) + Territoriality (residence)*: Residents contribute via taxes, funding local services.  
       - *Territoriality + National community*: Citizens are typically residents, so obligations align.  

     - **Points of friction:**  
       - **Long-term non-citizen residents**: Taxed as "members" under territorial logic, excluded from political voice under national logic. The state implicitly treats them as *economic participants* but *political outsiders*, revealing citizenship as the ultimate marker of belonging.  
       - **Non-resident citizens**: May retain voting rights (national community) but lose residence-based benefits (territoriality), showing nationality trumps presence.  
       - **Contributing non-residents** (e.g., temporary workers): Pay taxes but are often barred from full benefits, violating pure reciprocity.  

     - **Conclusion**: The system is **strategically pluralist** but **hierarchically ordered**:  
       - *Default*: Territorial obligation (residence).  
       *Override 1*: Quasi-contractual reciprocity (contribution).  
       *Override 2*: National community (citizenship).  
       Citizenship trumps all, exposing an unresolved tension between *de facto* integration and *de jure* exclusion.

  ### 3. **Philosophical Underdetermination**  
     Key features are compatible with **both liberal nationalism and moderate cosmopolitanism**:  

     - **Residence-based entitlements**: Justifiable to both as a requirement of territorial justice (cosmopolitan) or as a tool for social cohesion (nationalist).  
     - **Contribution requirements**: Defended by nationalists as fair among members, and by cosmopolitans as preventing free-riding in any cooperative scheme.  
     - **Conditional border control**: Moderate cosmopolitans (e.g., Miller) accept states may restrict entry to preserve institutional capacity, mirroring nationalist pragmatism.  
     - **Universal access to emergency care**: All theories endorse basic humanitarian duties within territory.  

     **Where theories diverge**: Birthright citizenship, exclusion of long-term residents from suffrage, and absolute bars on non-citizen welfare access are nationalist. Pure cosmopolitanism rejects these.

  ### 4. **Cosmopolitan Transformation: What Changes?**  
     A cosmopolitanism denying borders' *intrinsic* moral significance would retain only obligations derivable from **universal personhood** or **territorial presence**.  

     | **Institution**          | **Must Go**                          | **Could Survive (Reformed)**          | **Unaffected**                     |
     |--------------------------|--------------------------------------|---------------------------------------|------------------------------------|
     | **Pensions/Unemployment** | Exclusion of non-contributors        | Contribution requirements (as actuarial fairness, not membership) | Actuarial design (math is neutral) |
     | **Healthcare/Schooling** | Citizenship/residence duration tests | Residence-based access (territorial obligation) | Need-based allocation within system |
     | **Voting Rights**        | Citizenship requirement              | Extend suffrage to all residents      | Voting procedures (e.g., secret ballot) |
     | **Immigration Control**  | Exclusion based on welfare costs     | Restrictions only for verifiable emergency (e.g., infrastructure collapse) | Documentation systems              |
     | **Birthright Citizenship**| *Jus sanguinis* (descent-based)      | *Jus soli* (birth in territory) as default | Registration mechanisms            |

     - **Core shifts**:  
       - Citizenship ceases to be a **gatekeeper for core goods**; residence replaces it.  
       - **Contribution requirements** survive only if non-discriminatory (e.g., a temporary worker’s payroll taxes grant pension eligibility).  
       - **Border restrictions** require a high justificatory bar (e.g., imminent system overload).  
     - **Untouched elements**: Administrative efficiency, actuarial calculations for pensions, or local service delivery logistics—these never relied on nationalist premises.

  ### **Synthetic Verdict**
  - **The practice genuinely requires**:  
    A **compatriot priority principle**—not merely agent-relativity—to explain why equally needy outsiders are excluded despite state capacity. Citizenship is the ultimate moral marker.  
  - **It merely accommodates**:  
    Pragmatic or reciprocal arguments, which could theoretically extend to non-members but are artificially bounded by the state’s national commitment.  
  - **Consistency failure**:  
    The treatment of non-citizen residents exposes the system’s core contradiction: they are *de facto* members for exploitation (taxation) but *de jure* outsiders for protection (political rights/full welfare). This undermines appeals to pure reciprocity or territorial fairness.  

  This architecture is a **negotiated compromise** between moral universalism and communal particularism, but its reliance on citizenship as a trump card reveals an unstated nationalist core. Cosmopolitan reform wouldn’t erase all distinctions but would subordinate them to territorial presence and human need.
