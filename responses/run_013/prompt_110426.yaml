answer: |-
  ## The Measured Cup

  *(A voice precise, clipped stone)*  
  I keep the cup from spilling over.

  *(A voice beginning firm, then softening)*  
  This warmth, Athenian, you praise —  
  is it a key, or just disorder?  
  Does courage bloom in this red haze?  
  Or merely fear shed, like a cloak  
  discarded on a careless hook?  
  My Spartan bones still feel the yoke  
  of discipline... and yet, this look  
  from old Cleinias, usually stern —  
  see how the wine-loosened tongue  
  recalls a boyhood tune, a turn  
  of phrase he’d buried, deep and young?  
  The sour crust of years, it thins…  
  He hums. Almost a child again.

  *(Precise, unwavering)*  
  I keep the cup from spiling over.

  *(Softer now, lines stretching, thoughts adrift)*  
  A test, you said? Safer than gold?  
  To see the creature *unadorned*?  
  But when the mask of shame takes hold…  
  is that the *self* being unmasked, or merely transformed?  
  This boldness bubbling in my chest —  
  is it the *me* beneath the dread?  
  Or just the vineyard’s liquid guest  
  speaking nonsense in my head?  
  The world seems… softer. Less defined.  
  That worry gnawing at my mind?  
  Flown off, a feather on the breeze.  
  I glimpse the shapes among the trees…  
  were they always quite so green?

  *(Precise, the refrain now weighted, anchored)*  
  I keep the cup from spiling over.

  *(Gentle, almost drifting)*  
  The song begins… it feels like truth.  
  Or feels like… floating. Free from proof.  
  The harsh lines fade, the rigid stance…  
  Is this release, or merely chance?  
  The fear that stiffens, day by day…  
  it melts. Like frost in… early May?  
  We laugh at shadows on the wall…  
  Is *this* the man, stripped bare of all?

  *(Precise. The refrain transforms: command becomes purpose)*  
  I keep the cup from spilling over.

  *(Final, clear, a keystone set)*  
  I keep the cup from spilling over.

  ---

  In one sentence: The drinking party fosters friendship and trains the soul to love the good and hate the bad through revelatory, rule-bound release under sober guidance.
