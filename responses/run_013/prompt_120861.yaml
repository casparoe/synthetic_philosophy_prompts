  First, I need to understand the friend's argument. The key steps are:

  1. Asserting a statement means claiming it's true.
  2. Intuitionists refuse to assert P ∨ ¬P for certain P, like whether pi has a hundred consecutive 7s.
  3. Therefore, intuitionists don't take P ∨ ¬P as true.
  4. If it's not true that P ∨ ¬P, then it's not the case that P ∨ ¬P.
