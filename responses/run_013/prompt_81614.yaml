answer: |-
  ## Bronze, circa 500 BCE; Attica

  The foundry holds what fire refines,  
  A stillness borrowed from the flame.  
  The mould receives the molten lines,  
  The shape the furnace couldn’t tame.

  A stillness borrowed from the flame  
  Fills out the plaster’s hollow grace.  
  The shape the furnace couldn’t tame  
  Assumes this temporary place.

  Fills out the plaster’s hollow grace,  
  This figure cooled upon the stone.  
  Assumes this temporary place,  
  A thing the smith calls all his own.

  This figure cooled upon the stone  
  Can feel the centuries accrue.  
  A thing the smith calls all his own  
  Endures what hammer-blows undo.

  Can feel the centuries accrue  
  Or vanish in the crucible’s glare.  
  Endures what hammer-blows undo,  
  Or flows away like liquid air.

  Or vanish in the crucible’s glare?  
  The mould receives the molten lines.  
  Or flows away like liquid air?  
  The foundry holds what fire refines.

  ---

  **Notes on the Craft:**

  1.  **Structure & Repetition:** The strict pantoum form enacts the core puzzle. Key recurring lines shift meaning subtly when repeated:
      *   "A stillness borrowed from the flame" applies to the liquid bronze cooling *and* the statue's achieved form.
      *   "The shape the furnace couldn’t tame" refers to the bronze's potential beyond this specific form *and* the statue's fragility resisting the furnace.
      *   "Assumes this temporary place" speaks to the bronze taking the mould's shape *and* the statue's contingent existence.
      *   "Endures what hammer-blows undo" highlights the bronze's persistence *and* the statue's potential destruction.
      *   "Or vanish in the crucible’s glare? / Or flows away like liquid air?" forces the divergence point – destruction for the statue, transformation for the bronze.

  2.  **Concrete Imagery:** Foundry, mould, flame, stone, hammer, crucible – grounding the abstraction in the physical process. "Centuries accrue" nods to museum time, "hollow grace" to the mould/form relationship.

  3.  **Ambiguity & Openness:** Nouns like "shape," "thing," "stillness," "place," and verbs like "assumes," "endures," "flows," "vanish" remain deliberately unfixed. The speaker ("smith") names *a* thing, but the poem doesn't settle *which* thing(s) ultimately exist. The closing loop ("The foundry holds what fire refines") returns to the raw potential, leaving the status of the specific figure unresolved.

  4.  **The Title:** Mimics a museum label, grounding the poem in a specific historical artifact while the verse explores its ontological ambiguity. "Attica" hints at origin, now lost to time like the original context of the bronze.

  5.  **The Grounding Question:** The poem doesn't declare whether the bronze *is* the statue, whether they are distinct entities coinciding, or whether it's fundamentally about descriptions. It simply presents the phenomena of casting, persistence, transformation, and loss, letting the repetition and shifting context of the lines embody the tension. The "crossing point" is starkest in the fifth stanza: the bronze flows on, the figure vanishes.
