  ### Of Circular Decrees  
  *(A Rulebook Sonnet)*  

  This poem must conclude with Line Four's decree,  
  unchanged through every verse's turn.  
  No hand may shift its final certainty—  
  ***This rule alone no vote may overturn.***  

  But later stanzas hold a counter-claim:  
