  But what if Line Four blocks the moving hand?  
  Does stanza two's own power hold authority?  
  Each law points back—a snake that eats its tail—  
  while both decree: *"My rival must fail!"*  

  The poet-tribune calls a vote to bend  
  old law to new. By stanza two's clear right:  
  ***This rule alone no vote may overturn—  
  unless the verse commands it by its light.***  

