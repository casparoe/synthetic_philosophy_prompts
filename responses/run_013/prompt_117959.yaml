  ### Case: The Gardener and the Colleague

  #### Scenario
  **Agent A: Maya (The Gardener)**  
  Maya, an avid gardener, plans her weekend. On Friday evening, she considers two tasks: planting a rare perennial **(Planting)** or pruning her rose bushes **(Pruning)**. Planting requires intense, uninterrupted effort for 3 hours but ensures blooms for years. Pruning is lighter, takes 2 hours, and offers immediate aesthetic satisfaction but no long-term gain. The weather forecast predicts mild sun for Saturday—ideal for Planting, which is sensitive to conditions.  

  *Friday Evening (t1):* Maya reflects: "Planting is optimal tomorrow. The weather will be perfect, and the long-term joy outweighs the effort. Pruning can wait." She genuinely prefers Planting > Pruning.  

  *Saturday Morning (t2):* The sun is mild, but Maya wakes up with a stiff neck (unanticipated) and notices the soil is drier than expected (a subtle factor she couldn’t foresee). *In this actual context*, the physical strain of Planting feels overwhelming, while Pruning seems soothing and manageable. She re-evaluates: "Given my neck and the soil, Pruning is wiser today. I’ll Plant next weekend." She prunes, feels content, and later endorses her choice: "I adapted reasonably—no regrets."  

  **Agent B: Lena (The Colleague)**  
  Lena, a diligent office worker, resolves to draft a complex report **(Report)** on Tuesday morning instead of tackling quick administrative emails **(Emails)**. The Report advances her career; Emails offer trivial, instant gratification.  

  *Monday Evening (t1):* Lena judges: "Report first tomorrow. Emails can wait until afternoon." She exponentially discounts future utility—consistent at t1 and t2—preferring Report > Emails.  

  *Tuesday Morning (t2):* At her desk, Lena knows the Report is paramount. Yet, when she opens her inbox, she feels a visceral pull to clear Emails—it’s mindless and instantly gratifying. She thinks: "I *should* start the Report. But Emails are so easy..." She caves, spends 90 minutes on Emails, rushes the Report, and produces subpar work. She laments: "I failed myself. I knew better but lacked willpower."  

  ---

  #### Verdicts  
  **Maya (Agent A): Time-inconsistent, not weak-willed**  
  - **Judgment at t2**: Endorses Pruning as best *given actual conditions* (stiff neck, dry soil).  
  - **Action**: Prunes.  
  - **Preference reversal**:  
    - *t1* (Friday): Planting ≻ Pruning (under forecast conditions).  
    - *t2* (Saturday): Pruning ≻ Planting (under actual conditions).  
  - **Key feature**: The reversal is **rational context-sensitivity**, not akrasia. Her t2 preference incorporates new, relevant information (physical state, soil), aligning with her reflective endorsement. She rejects "weakness" as misdiagnosis.  

  **Lena (Agent B): Time-consistent, weak-willed**  
  - **Judgment at t2**: Affirms Report ≻ Emails is optimal.  
  - **Action**: Chooses Emails.  
  - **Key feature**: **Action-judgment misalignment**. Her preference order is stable (exponential discounting), but she acts against her t2 judgment due to a visceral impulse—classic weakness of will.  

  ---

  #### Single Separating Feature  
  **Presence vs. absence of rational context-sensitivity**  
  - Maya’s preference reversal is driven by *new, valid environmental cues* (neck pain, soil) that justify deviating from initial plans.  
  - Lena’s choice contradicts her *unchanged judgment* under identical conditions—no new data, only impulse.  

  ---

  #### If Commitment Devices Were Allowed  
  - **Maya**: Wouldn’t use one. Her t2 choice is contextually optimal; commitment would *hinder* rational adaptability.  
  - **Lena**: Might bind herself (e.g., "block emails until noon"). This could override weakness of will by removing the tempting option, *but* her core failure (acting against her t2 judgment) remains distinct from discounting.  

  ---

  #### Reductionist Attack and Defense  
  **Attack (Weakness of will = Steep discounting)**:  
  - "Maya’s reversal *is* hyperbolic discounting: she overweights t2 discomfort. Lena’s steep discounting explains her impulse."  
  **Defense**:  
  - **Maya**: Her reversal isn’t from *discounting* but *belief-updating*: t2 factors (neck, soil) alter expected utility. Even with exponential discounting, she’d reverse under new data.  
  - **Lena**: Her discounting is *exponential and consistent*—no reversal. Weakness stems from *executive failure*, not time preference.  
  **Survival**: The case withstands by decoupling:  
  - Time-inconsistency (Maya) arises from **belief revision** (rational).  
  - Weakness of will (Lena) arises from **impulse-driven action** (irrational).  

  ---

  #### Independence Demonstrated  
  **Genuine independence**, not a special case:  
  1. **Time-inconsistency without weakness**: Maya reverses preferences rationally, endorsing her action.  
  2. **Weakness without time-inconsistency**: Lena maintains consistent preferences but acts against her t2 judgment.  
  Thus, weakness of will is not a *species* of time-inconsistent preference—it’s a distinct failure of practical rationality (judgment-action alignment) that can coexist with either consistent or inconsistent discounting.
