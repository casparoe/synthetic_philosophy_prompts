prompt: |-
  I've been reading about Parfit's teletransporter and its gotten under my skin. Before I read any more of this stuff I want the spec first: what does a theory of what matters in survival actually have to deliver to be any good? I'm coming at this after 30 years in biology so my instincts about identity are probably warped, but here's what I want in the list. The cases it has to get right: the teletransporter, the fission case where I get split into two and both walk away, the gradual neuron-by-neuron replacement, ordinary sleep and coma, and — the one that bothers me — metamorphosis, where a lot of the caterpillar's brain gets rebuilt into the butterfly's. Also the boring one: a backup copy that's made and then never turned on. The distinctions it can't just collapse: between numerical identity and what matters, between first-person and third-person, and between a difference in kind and a difference in degree. And the results it can't contradict: whatever neuroscience actually says about how much of me turns over in a lifetime. For each requirement, give me the case or consideration that forces it. Then tell me which of these are real requirements and which are just prejudices of one camp, and flag any pair you think can't be satisfied at the same time — that part I care about most. Format it as: 1) "The list", each item with its motivating case, about 600-800 words. 2) "Load-bearing vs. optional", which are non-negotiable and which are negotiable, ~150 words. 3) "Tensions", the subset that can't be jointly met, ~200 words. Skip the scorecard of who-says-what, I'll read that myself.
