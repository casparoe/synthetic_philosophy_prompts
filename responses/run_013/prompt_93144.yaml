answer: |-
  Here's the breakdown of requirements for a theory of "what matters in survival" (WMS), structured as requested:

  ### 1) The List: Requirements & Motivating Cases (~750 words)

  *   **Requirement 1: Handle the Teletransporter (Copying & Destruction)**
      *   **Case:** Original is scanned/destroyed, a perfect copy is created elsewhere. Does *survival* occur? (Parfit's central case).
      *   **Motivation:** Forces the theory to distinguish between *continuation* and *replacement*. Must address whether physical continuity is necessary or if perfect psychological continuity (via copying) suffices for WMS. Does destruction of the original negate survival, even with a perfect replica elsewhere?

  *   **Requirement 2: Handle Fission (Branching Identity)**
      *   **Case:** Brain bisected, each hemisphere successfully transplanted into a new body. Two psychologically continuous persons emerge.
      *   **Motivation:** Directly challenges the uniqueness requirement of *numerical identity*. Can WMS exist without unique survival? Does it split? Does it cease? Forces the theory to confront non-branching continuity as a potential requirement for identity but possibly not for WMS.

  *   **Requirement 3: Handle Gradual Neuron-by-Neuron Replacement**
      *   **Case:** Over time, every neuron in your brain is replaced with a functionally identical synthetic neuron. Are you still you at the end? What matters for survival *during* the process?
      *   **Motivation:** Tests the theory's stance on gradual change vs. sudden replacement (like the transporter). Challenges the importance of specific physical substrate vs. functional organization/persistence. Does WMS track the gradual process, or is there a point where it breaks? Undermines simple biological identity theories.

  *   **Requirement 4: Handle Ordinary Sleep and Coma (Temporary Disruption)**
      *   **Case:** During deep sleep or coma, consciousness and high-level psychological continuity are absent or drastically reduced.
      *   **Motivation:** Demands that the theory doesn't set the bar for survival *too high*. If consciousness or continuous thought is required for survival, sleep implies death nightly. Any plausible theory must accommodate these common, reversible states without implying cessation of the person.

  *   **Requirement 5: Handle Metamorphosis (Radical Biological Reorganization)**
      *   **Case:** Caterpillar pupates, much of its nervous system is broken down and rebuilt into a butterfly's brain with vastly different psychology and capabilities. Does the caterpillar survive as the butterfly?
      *   **Motivation:** Poses a *real-world* challenge akin to neuron replacement/fission but with radical functional/psychological discontinuity. Tests if the theory can handle extreme biological transformation within a single physical lineage. Does WMS require psychological similarity, or just causal continuity?

  *   **Requirement 6: Handle the Backup Copy (Potential vs. Actuality)**
      *   **Case:** A perfect copy is made but never activated. The original continues. Later, the original is destroyed. *Then* the backup is activated.
      *   **Motivation:** Tests whether WMS requires *actual* continuation or if *potential* continuation suffices. Forces a distinction between the existence of a replica and the survival of the original. If the backup is never turned on, does its mere existence threaten the original's survival? Intuition says no – the theory must reflect this.

  *   **Requirement 7: Respect the Numerical Identity / What Matters Distinction**
      *   **Case:** Primarily motivated by **Fission** and **Teletransporter (with Survival)**. If the theory concludes you *survive* fission (as both branches) or teletransportation (as the copy), it *must* acknowledge that this survival does *not* imply *numerical identity* with the original pre-fission/pre-teletransport person. Identity is 1:1, survival might not be.
      *   **Motivation:** Prevents conceptual confusion. Collapsing this distinction makes it impossible to coherently describe the fission case or explain why teletransportation (if survival) feels different from ordinary travel. Essential for clarity.

  *   **Requirement 8: Respect the First-Person / Third-Person Distinction**
      *   **Case:** Motivated by **Teletransporter (Copying & Destruction)**. From the *first-person* perspective of the copy waking up on Mars, it seems identical to survival. From the *third-person* perspective of someone watching the original destroyed, it seems like death and replacement. A good theory must acknowledge both valid viewpoints without reducing one to the other.
      *   **Motivation:** Neglecting this leads to theories that either dismiss subjective experience (overly objective) or fail to explain objective facts about cessation and duplication (overly subjective). Captures the core tension in personal identity.

  *   **Requirement 9: Respect Difference in Kind vs. Difference in Degree**
      *   **Case:** Motivated by **Gradual Replacement** vs. **Teletransporter/Sudden Death**. Replacing neurons one-by-one feels like a *difference in degree*; being instantly vaporized and copied feels like a *difference in kind*. A theory shouldn't *necessarily* treat these the same way simply because the end states are physically/psychologically identical.
      *   **Motivation:** Reflects strong intuitions about process and continuity. A theory collapsing this distinction risks counterintuitive conclusions (e.g., that slowly killing someone neuron-by-neuron is morally equivalent to instantly vaporizing them, as long as a copy exists).

  *   **Requirement 10: Cohere with Neuroscience (Material Turnover)**
      *   **Case:** Empirical fact: Neurons die and are (sometimes) replaced; synapses constantly remodel; molecular constituents turnover rapidly. The Ship of Theseus is not just a thought experiment, it's biological reality over a lifetime.
      *   **Motivation:** A theory claiming WMS depends on strict persistence of *specific* physical matter (biological identity) is empirically falsified. The theory must be compatible with the fact that our physical substrate constantly changes while we (seemingly) persist.

  ### 2) Load-Bearing vs. Optional (~150 words)

  *   **Non-Negotiable (Load-Bearing):**
      1.  **Respect Numerical Identity / WMS Distinction (Req 7):** Fundamental to coherently analyzing branching/fission cases. Collapsing it destroys the problem space.
      2.  **Respect First-Person / Third-Person Distinction (Req 8):** Core to the subjective/objective nature of survival and identity. Ignoring it yields an incomplete picture.
      3.  **Cohere with Neuroscience (Req 10):** A theory fundamentally contradicting established brain biology is non-starter for a biologically-informed view.
      4.  **Handle Gradual Replacement (Req 3) & Sleep/Coma (Req 4):** These represent the *baseline reality* of biological persistence. A theory failing here fails entirely.

  *   **Negotiable (Optional/Emphasis-Dependent):**
      1.  **Metamorphosis (Req 5):** While a powerful real-world case, its relevance depends on how strongly one emphasizes radical biological transformation in *human* identity. Some theories handle neuron replacement but balk at metamorphosis-level discontinuity.
      2.  **Backup Copy (Never Activated) (Req 6):** Primarily sharpens the Potentiality vs. Actuality issue. Crucial for some (e.g., Nozick), less central for others.
      3.  **Difference in Kind/Degree (Req 9):** While intuitive, some consequentialist-leaning theories (prioritizing outcomes over process) might deliberately collapse this. Its importance depends on the weight given to continuity *as process*.

  ### 3) Tensions: The Logically Problematic Pair (~200 words)

  The most significant tension arises between requirements driven by **Fission (Req 2)** and the insistence on a sharp **Numerical Identity / WMS Distinction (Req 7)**:

  1.  **Fission's Challenge:** Fission seems to demonstrate that *what matters in survival* (psychological continuity) can exist robustly in *both* resulting persons, even though *numerical identity* (being one and the same entity) is logically impossible for both with the original.
  2.  **The Distinction Requirement:** Requirement 7 demands the theory explicitly separates WMS from numerical identity. This forces the conclusion that WMS can exist *without* numerical identity (in the fission branches).
  3.  **The Tension:** While logically coherent, this decoupling is deeply counterintuitive and existentially unsettling for many. It suggests that what fundamentally matters for *my* survival (psychological continuity) does *not* guarantee that *I* (as a unique, identical entity) survive. I could cease to exist (numerically) while what matters to me continues in others. Requirement 2 (Handling Fission) *requires* this conclusion via Requirement 7, but accepting it feels like abandoning the core of identity. Theories trying to preserve numerical identity *through* fission (e.g., soul theories, dubious biological continuity) typically fail Requirement 2 (by denying both branches are "me") or Requirement 10 (neuroscience). This tension between the logical necessity of decoupling (Req 2 + Req 7) and the deep desire for identity to *be* what matters is central to the philosophical unease Parfit explores. They *can* be jointly met (by accepting WMS ≠ Identity), but the *psychological cost* of meeting them is the core tension.
