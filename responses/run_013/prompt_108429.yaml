            We can choose a and b arbitrarily? We only care about the ratio a/b. Set a = c * k, b = (1-c) * k, for any k>0. Then:

                   [P(x0, Y=1)*c] / [P(x0, Y=1)*c + P(x0, Y=0)*(1-c)] = c?

            Actually:

                   numerator = P(x0, Y=1)*c * k
                   denominator = P(x0, Y=1)*c*k + P(x0, Y=0)*(1-c)*k
                   ratio = [P(x0, Y=1)*c] / [P(x0, Y=1)*c + P(x0, Y=0)*(1-c)]

            This is not necessarily c. We can set k arbitrarily and it cancels, but the ratio is:

                   c * P(x0, Y=1) / [c * P(x0, Y=1) + (1-c)*P(x0, Y=0)]

            We want this to be c:

                   c = c * P(x0, Y=1) / [c * P(x0, Y=1) + (1-c)*P(x0, Y=0)]
                   => 1 = P(x0, Y=1) / [c * P(x0, Y=1) + (1-c)*P(x0, Y=0)]
                   => c * P(x0, Y=1) + (1-c)*P(x0, Y=0) = P(x0, Y=1)
                   => (1-c)*P(x0, Y=0) = (1-c)*P(x0, Y=1)
                   => P(x0, Y=0) = P(x0, Y=1)

            So again, only if the prior conditional at x0 is uniform.

            Therefore, the virtual evidence method as above does not work for non-uniform priors.

            However, there is a different way: the virtual evidence method that is used for updating on a soft evidence on a variable is not directly applicable to a conditional constraint. We might need to consider a constraint on the entire joint.

