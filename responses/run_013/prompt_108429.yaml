     My reasoning is most likely to fail in the interpretation of the constraint. The philosophical debate might hinge on what the constraint means. In our framework, a constraint is a constraint, and we have to choose an update rule. The rule we choose should be consistent with the semantics of the information.

     Therefore, I endorse Rule 2 (probability kinematics) for the Judy Benjamin case and similar cases where the constraint is purely about the conditional and not meant to inform the marginal.

