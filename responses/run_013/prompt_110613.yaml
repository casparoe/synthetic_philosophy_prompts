prompt: |-
  I've been going back and forth with a couple of friends about scientific realism, and I keep noticing that my verdicts on particular cases don't obviously add up to any single principle — which bothers me more than it probably should, given how many evenings I've spent in comment sections chewing over the no-miracles argument and the pessimistic meta-induction. So I'd like you to treat my gut verdicts as data and tell me what theory of when we're entitled to believe a theoretical entity's posits actually captures them, or whether I have to surrender one of the verdicts to get a principle at all.

  Here's where my gut lands. Phlogiston: not real; combustion is real, the phlogiston isn't. Caloric: not real, even though calorimetry and latent heat were genuine predictive successes built on it. The luminiferous ether: not real, despite being central to the best optics of its day and making novel predictions that came true. Miasma: not real — and I don't count the fact that miasma theory motivated sanitation measures that actually saved lives as evidence for miasma, since germ theory motivated the same measures. Atoms, back when they were posited and nobody could see them: real; the atomists were onto something, and the later discovery that atoms have parts and come apart doesn't retroactively make them wrong. Genes, in the sense of the early factors of heredity: real, even though the modern notion has since fragmented into half a dozen different things. Electrons: real, even though the electron of 1900 — a little charged sphere — is not the electron of the standard model, which is more like an excitation of a field; the entity survived the change in its nature. Quarks: real, though they can never be seen in isolation and by the theory's own lights are unobservable in isolation. Neutrinos: real, though they were invented purely to stop energy conservation from failing in beta decay and were, at the time, about as speculative as anything gets. The Higgs: real. The gravitational field or the curvature of spacetime: real, even though it replaced a force that I'd now say was never real — so a successor's displacing something unreal doesn't make me doubt the successor. Newtonian gravity and Newtonian mass: not strictly true, but I'd call them approximately true and retained as limits rather than discarded fictions. Continental drift: was right all along and was rejected for decades, so I don't treat the current consensus as evidence one way or the other.

  What I can't square is this: the ether and caloric did real predictive work and sat at the center of the best theory of the day, and I'm confident they're not real; quarks and neutrinos were unobservable posits doing theoretical work, and I'm confident they are. My tentative stab is something like: believe in whatever the successor theory still needs and cannot re-describe away, and discount whatever it can account for without the posit — but I can't tell whether that's a principle or just hindsight dressed up as one, since nobody at the time of the ether could have known which parts would later turn out to be re-describable. So: give me the principle, or the smallest set of competing principles, that best fits the verdicts above, stated precisely enough that I could apply it myself to a new case, and note which verdict is doing the most work in forcing each clause. Then tell me which of my verdicts it can't accommodate and which I should give up. And apply it to at least one case I haven't mentioned — I'm especially curious what it says about dark matter, where I keep flip-flopping between 'obviously believe in it, look how much it explains' and 'this is our century's ether,' and about the wavefunction, which I suspect is a different kind of case entirely.
reasoning: |-
  Okay, the user is deeply engaged in the philosophy of science, specifically scientific realism. They've been debating with friends and feel their judgments on historical cases don't form a coherent principle. They provided a list of verdicts on entities like phlogiston, caloric, ether, atoms, genes, electrons, quarks, neutrinos, Higgs, spacetime curvature, Newtonian concepts, and continental drift. Their main conflict is why they reject ether and caloric despite their predictive success but accept quarks and neutrinos even when unobservable. They want a principle that explains their intuitions or identifies which verdicts to revise.

  First, I need to analyze their examples to find patterns. They accept entities that persist through theory changes, even if redefined (atoms, electrons, genes). They reject those fully replaced without continuity (phlogiston, caloric, ether). Also, they value indirect evidence and necessity in current theories (quarks, neutrinos). Newtonian physics is seen as approximately true, showing they allow approximations.

  Their tentative idea about successor theories needing the entity is insightful but risks hindsight bias. How to make it prospective? Maybe focus on whether the entity is indispensable across theories or has stable properties. Also, entities with multiple lines of evidence (like neutrinos detected later) gain credibility.

  For dark matter, the principle would require assessing if it's indispensable and has cross-theoretical support. Weakly interacting but necessary for galaxy rotation, CMB, etc. If future theories explain without it, it might be rejected. Wavefunction is tricky—mathematical tool vs. real entity. If quantum theories can't describe without it, it might be real; otherwise, instrumental.

  The user might need reassurance that their intuitions align with structural realism or entity realism. Highlighting cases like genes and atoms where core properties persist. The toughest cases are caloric and ether—why reject them? Because no continuity; their roles were replaced without residue. Whereas neutrinos were detected, confirming their reality despite initial speculation.

  They should consider giving up the strict rejection of ether if focusing on its mathematical contributions (like Lorentz transformations), but they might see that as not the entity itself. Emphasize that their judgments rely on ontological continuity and multiple grounding, which avoids hindsight by looking at how entities evolve.
answer: |-
  Based on your detailed "gut verdicts," I identify a coherent principle prioritizing **ontological continuity and multiple grounding** over mere predictive success or centrality within a single theory. This principle avoids hindsight by focusing on *how* an entity functions across theories and evidence streams:

  ### The Principle: Ontological Stability through Multiple Grounding (OSMG)

  **We are entitled to believe a theoretical entity is real if:**
  1.  **Core Role Persistence:** The entity retains an indispensable explanatory or predictive role *across significant theory changes*, even as its specific properties may be refined or revised.
  2.  **Multiple Grounding:** Its existence is supported by *multiple, distinct lines of evidence or theoretical necessity* that converge independently, making its elimination require significant disunity or ad hoc adjustments elsewhere.
  3.  **Retention in Limits:** Its properties are demonstrably *recoverable as an approximation or limiting case* within successor theories (applicable for approximately true entities).

  **Key Clause Rationale (Based on Your Verdicts):**
  *   **Clause 1 (Core Role Persistence):** Forced by **Atoms**, **Genes**, and **Electrons**. Your acceptance hinges on the *core concept* (discrete unit of matter, unit of heredity, discrete carrier of charge) surviving radical theory changes, even when properties change (substructure discovered, gene concept fragmented, particle->excitation). Contrasts sharply with **Phlogiston**, **Caloric**, and **Ether**, where the *entire core concept* (substance released, heat fluid, mechanical wave medium) was *abandoned*, not revised. **Newtonian Gravity/Mass** is accepted *because* Clause 3 applies – they are retained limits.
  *   **Clause 2 (Multiple Grounding):** Forced by **Quarks** and **Neutrinos**. Quarks were posited for deep theoretical reasons (symmetry, classification) *and* received overwhelming indirect evidence (scattering experiments, jet production, spectroscopy) long before direct detection attempts. Neutrinos were initially a "desperation posit" (Clause 1 weak initially!), but gained overwhelming multiple grounding: detection via different interactions (Cowan-Reines, solar neutrinos, supernova neutrinos, atmospheric oscillations), *and* becoming indispensable in astrophysics and cosmology. This contrasts with **Ether** and **Caloric**, whose support was largely *singular* – explaining specific phenomena (light propagation, heat transfer/calorimetry) within one theoretical framework. When that framework fell, the entity fell with it. **Miasma** fails here too – support was singular (disease patterns near bad air), easily re-described by germ theory without residue.
  *   **Clause 3 (Retention in Limits):** Forced by **Newtonian Gravity/Mass**. They are not the fundamental truth, but their descriptions and predictions are robustly recovered as limiting cases (low speed/weak field) of GR/SR. **Phlogiston**, **Caloric**, and **Ether** offer no such recoverable core – they represent fundamentally incorrect ontologies. **Continental Drift** highlights that consensus isn't primary; the evidence eventually forced acceptance because it *did* satisfy Clause 1 & 2 (core concept persisted and became multiply grounded by plate tectonics).

  **Addressing Your Tentative Stab:**
  Your "successor theory needs it" insight is incorporated into Clause 1. OSMG avoids pure hindsight by emphasizing *how* the entity functions *across* theories and evidence *as we have them*. We judge current entities by whether their *core role* seems robustly grounded and necessary *now*, using multiple lines. We judge past entities based on whether *any* core role persisted *into* our current understanding. We don't need to predict the future perfectly; we assess robustness and grounding with current knowledge.

  **Verdicts OSMG Accommodates Well:**
  *   Phlogiston/Caloric/Ether/Miasma: Fail Clause 1 (no core role persists) and Clause 2 (singular grounding in fallen theory).
  *   Atoms/Genes/Electrons: Strong Clause 1 (core role persists despite property changes).
  *   Quarks/Neutrinos/Higgs: Strong Clause 2 (multiple, converging grounding - theoretical necessity + diverse indirect/direct evidence).
  *   Newtonian Gravity/Mass: Strong Clause 3 (retained as limits).
  *   Continental Drift: Initially lacked grounding/consensus, but *eventually* satisfied Clause 1 & 2.
  *   Gravitational Field/Spacetime Curvature: Strong Clause 1 & 2 (core role persists from GR, multiply grounded by diverse phenomena).

  **Verdict Under Tension & Recommendation:**
  *   **Luminiferous Ether:** Your verdict ("not real") is mostly correct under OSMG. Its *core concept* (mechanical medium) is abandoned. *However*, OSMG suggests we *should* acknowledge that key *mathematical structures* and *relational properties* associated with the ether (like the Lorentz transformations) *did* persist fundamentally into SR. If you consider "the ether" *only* as that specific mechanical substance, reject it. But if you see it as representing a necessary structure for propagation that *evolved*, there's a case for partial continuity (leaning towards structural realism). **Recommendation:** Hold your verdict, but recognize that *something* robust (the spacetime structure) was being gestured at, even if mischaracterized ontologically.

  **Applying OSMG to New Cases:**

  1.  **Dark Matter:**
      *   **Clause 1 (Persistence):** So far, yes. The core role ("non-baryonic, non-luminous mass causing gravitational effects") has persisted through decades of alternative theory challenges (MOND, TeVeS) and refinements (cold vs. warm, potential self-interactions). Alternatives struggle universally.
      *   **Clause 2 (Multiple Grounding):** Strong. Evidence converges *independently* from wildly different phenomena: galaxy rotation curves, galaxy cluster dynamics (virial theorem, lensing), large-scale structure formation, cosmic microwave background (CMB) power spectrum, bullet cluster. No single tweak to gravity explains all these simultaneously without introducing something *like* dark matter.
      *   **Clause 3 (Limits):** N/A (it's current, not superseded).
      *   **OSMG Verdict:** **Believe it's real (as a category/entity).** Its grounding is robust and multi-faceted, similar to quarks/neutrinos pre-direct-detection. The "ether" comparison fails because the ether's grounding was singular (optics) and its core concept was abandoned; dark matter's grounding is diverse and its core concept (gravitationally interacting non-luminous matter) persists despite refinements. Failure to detect specific candidates (WIMPs, etc.) wouldn't immediately falsify the *category*, just specific models (analogous to different atomic models failing while atoms persisted).

  2.  **The Wavefunction (in Quantum Mechanics):**
      *   **Clause 1 (Persistence):** The wavefunction's core role (encoding probabilities and system state) is indispensable *within* standard QM and most interpretations. However, its *ontological status* (real field vs. knowledge representation) is hotly debated across interpretations (Copenhagen, Bohmian, GRW, Many-Worlds). The *mathematical object* persists, but *what it represents* is unstable.
      *   **Clause 2 (Multiple Grounding):** Its predictive power is immense and singularly powerful within QM. However, its reality isn't "grounded" by *independent* evidence streams in the way quarks are. Evidence confirms predictions *made using it*, but doesn't independently probe the wavefunction *itself* as an entity separate from the formalism (unlike detecting a neutrino *via* its interaction). Interference experiments suggest *something* wave-like, but whether it's a real physical field or an epistemic tool is unresolved.
      *   **Clause 3 (Limits):** N/A (fundamental theory).
      *   **OSMG Verdict:** **Ambiguous / Instrumentalist Leaning.** OSMG struggles here. Clause 1 is weak due to interpretational instability about its nature. Clause 2 is strong for predictive power but weak for *independent, converging evidence* for its reality *as an entity*. It lacks the multiple, distinct grounding of quarks/neutrinos/dark matter. OSMG suggests caution: the wavefunction is an indispensable *predictive instrument* within the theory, but we lack sufficient reason to commit to its reality *as a physical entity* distinct from its role in the formalism. This aligns with your suspicion it's "a different kind of case."

  **Conclusion:**
  Your intuitions align remarkably well with a sophisticated form of realism focused on **entity stability across theory change (Clause 1) and robust evidential convergence (Clause 2)**, with an allowance for approximate truth via limiting cases (Clause 3). OSMG captures nearly all your verdicts precisely. The only minor tension is with the ether, where recognizing the persistence of its *structural* contributions (even if not its substance) might soften the "not real" verdict slightly, though holding firm on the specific substance ontology is defensible. Apply OSMG by asking: "Does this entity's *core role* survive theory evolution?" and "Is its existence demanded by *multiple, independent strands* of evidence/theory?" Dark matter passes both tests robustly; the wavefunction, as an entity, currently does not.
