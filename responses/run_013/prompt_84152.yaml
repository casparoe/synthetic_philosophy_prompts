answer: |-
  ## Research Proposal: The Fragility of Cooperation in Program Equilibrium Under Partial Transparency  

  **Title:** Source Legibility as Social Infrastructure: How Partial Transparency Undermines Program Equilibria in the Prisoner’s Dilemma  

  ### 1. Core Question & Significance  
  **Precise Question:**  
  *Under what conditions of mutual code legibility does cooperation in one-shot Prisoner’s Dilemma program equilibria degrade? Specifically: (i) Does cooperation collapse abruptly (threshold effect) or gradually as code transparency decreases? (ii) Is degradation driven by the* degree *of opacity (e.g., % of hidden code), the* type *of opacity (obfuscation, language mismatch, partial observability), or the* strategic location *of hidden segments (e.g., cooperation condition vs. output logic)? (iii) Crucially, does successful cooperation require mutual* source-code legibility*, or merely mutual* commitment recognizability*?*  

  **Why This Matters:**  
  Program equilibria are hailed as a "solution" to one-shot PD by leveraging mutual code inspection. If cooperation persists under *weak* transparency (e.g., recognizing a commitment device without reading its internals), this suggests the result isn’t novel—it reduces to pre-existing commitment mechanisms. But if cooperation *fragilely depends* on full legibility, it challenges philosophical claims that program equilibrium "solves" the PD in general settings. Instead, it becomes a formal model of cooperation under radical transparency—a rare condition with profound implications for ethics (e.g., Rawlsian veils of ignorance vs. total visibility) and AI alignment.  

  ### 2. Gap in Existing Literature  
  Two camps dominate the debate, but both neglect partial transparency:  
  - **"Genuine Solution" Camp:** Focuses on implementations (e.g., Torkutla 2010’s quining, LaVictoire 2014’s Löbian protocols). They assume perfect legibility is a harmless idealization.  
  - **"Smuggled Commitment" Camp:** Argues program equilibria are just mutual pre-commitment (Binmore 2009) or causal decision theory with extra syntax (Hammond 2023). They dismiss transparency as irrelevant.  

  **Neither addresses:** What if players see 80% of code? Or recognize a "cooperator" without parsing its loops? **This is the critical gap.** If cooperation fails catastrophically under minor opacity, the "genuine solution" camp overclaims; if it persists robustly, the "smuggled commitment" camp wins. Currently, we lack even a framework to test this.  

  ### 3. Methodology & Timeline  
  **Why Formal Modeling?**  
  Conceptual analysis hits limits when dealing with partial observability (e.g., "Which code snippets matter?"). Empirical work is impossible for abstract decision theories. Agent-based models (ABMs) and game-theoretic simulations are ideal: they can explore high-dimensional opacity parameters and emergent thresholds.  

  **Planned Work (10 months part-time):**  
  - **Months 1–2: Baseline Models**  
    Replicate classic program equilibria in a minimal interpreter (Python/Lisp). Agents: Functions taking opponent’s *full* code as input, outputting {C,D}. Verify cooperation equilibrium.  
  - **Months 3–5: Opacity Dimensions (Isolated Testing)**  
    - *Degree:* Hide random X% of opponent’s code (replaced by placeholders).  
    - *Type:* (a) Obfuscation (code replaced with semantically equivalent but unreadable mess); (b) Language Barriers (Agent A writes in Python, B in Lisp; each "sees" code but can’t parse it without costly translation); (c) Costly Reading (Agent pays to reveal lines).  
    - *Location:* Hide specific segments (e.g., the subroutine checking opponent’s cooperation predicate).  
  - **Months 6–8: Hybrid Scenarios & "Recognizability" Tests**  
    - Agents get a *hash* or *compact proof* of opponent’s cooperation clause without seeing source. Does cooperation hold?  
    - Introduce "verification oracles": Agents query if opponent’s code belongs to a known cooperative class (testing recognizability without legibility).  
  - **Months 9–10: Threshold Analysis & Robustness**  
    Identify phase transitions (e.g., "Cooperation collapses when >30% of conditionals are hidden") and sensitivity to noise.  

  ### 4. Expected Outcomes & Failure Modes  
  **Success Looks Like:**  
  - A typology of opacity failures (e.g., "Obfuscation is harmless if cooperation proofs are short; language barriers cause collapse if translation costs exceed cooperation gains").  
  - A clear answer: *"Cooperation requires source legibility, not just commitment. Program equilibria fail under realistic opacity, limiting their applicability to contexts like open-source AI or verified smart contracts."*  
  ...or...  
  *"Mutual recognizability suffices. Program equilibria reduce to dynamic commitment, and transparency is a modeling artifact."*  

  **Failure Modes:**  
  - **Uninteresting:** Cooperation degrades identically across all opacity types → Suggests a universal "transparency cost" parameter exists.  
  - **Intractable:** Halting/complexity problems make simulations infeasible → Switch to restricted models (e.g., total-functions-only).  
  - **Ambiguous:** No clear threshold emerges → Reframe as "contextual fragility" (e.g., "Cooperation fails iff critical subroutines are hidden").  

  ### 5. Scope Management  
  **For a 1-year fellowship:**  
  - **Cut:** Language barriers requiring full compiler implementation (simulate via "untranslatable" code snippets).  
  - **Defer:** Costly reading equilibria (complex dynamics).  
  - **Simplify:** Test only deterministic, non-Turing-complete agents initially.  
  - **Focus:** Prioritize %-opacity and location experiments (Months 3–5); recognizability tests (Months 6–8) only if baseline yields time.  

  **Deliverable:** A working simulation library + paper proving/disproving the necessity of legibility. No new solution concepts—just a *reality check* on existing ones.  

  ### Why This Isn’t a Grant Robot  
  This isn’t just tweaking parameters—it’s excavating buried foundations. Program equilibrium papers celebrate "cooperation without repetition," but if their solution evaporates when code is slightly obscured, it reveals a deeper truth: **transparency isn’t a convenience; it’s the engine.** Philosophy has long debated whether cooperation requires mutual recognition (Hegel) or aligned incentives (Hobbes). This project forces that debate into the circuit logic of programs that can’t quite read each other’s minds. That’s either a devastating critique of program equilibria—or a blueprint for cooperation in a world where legibility is the scarcest resource.  

  ---  
  **Next Steps for You:**  
  - Add 2–3 key citations (e.g., Torkutla’s quining, Binmore’s critique) where noted.  
  - Specify simulation tools (e.g., MESA for ABM?).  
  - Briefly note your access to CS theory mentors.  
  - Trim Section 3 timeline to bullet points if space is tight.
