prompt: |-
  I write historical novels, real people in them, mostly dead Victorians. Theres a pattern that keeps happening to me and I've never found a name for it, so I'm asking. I make something up -- small, plausible, unverifiable: a sister says something cruel across a dinner table, an officer hesitates a beat too long before giving an order. I say it's invented in the afterword, I say it in every interview. Twenty years later I'm reading a biography and there's my dinner scene, no attribution, or footnoted to my novel as if a novel were a source. The made-up thing has turned into the record, and by then it isn't mine anymore.

  The other half of it is the complaining. The only person with standing to object is the sister's great-grandaughter, who never met her and isn't her, and everyone acts as if the family speaks for the dead woman. The dead woman herself can't be asked, and what she'd have wanted is precisely the thing nobody knows.

  Someone once told me the philosophical term for this is posthumous harm, but as I understand it that's about whether your reputation souring after you're gone counts as a harm to you, and it doesn't seem to cover the part where an invented detail quietly becomes evidence. So does the whole thing have a name? I don't just want a label, I want to know what the thing actually is -- whether the wrong, if it's a wrong, is to the dead person or to the family or to the readers who now believe something false; whether it matters that the invention is unflattering, or that the person was a nobody rather than a public figure; and how it differs from a historian simply getting something wrong, or from me making things up on purpose, which is the job.
reasoning: |-
  Okay, the user is a historical novelist who writes about real Victorians. They've noticed a pattern where a small, invented detail from their book ends up in biographies later, cited as fact. They mention two parts: the fictional detail becoming accepted history and the complaints from descendants. They want to know if there's a name for this phenomenon and explore the ethical dimensions.

  First, I need to recall if there's a specific term for this. They mentioned "posthumous harm," but that's more about reputation affecting the deceased. Their issue is about fictional details becoming part of the historical record. Terms like "fictional contamination" or "fictional leakage" come to mind. Also, "reification" might fit because the fiction is being treated as real. The process where fiction influences historical accounts sounds like "source misattribution" or "circular reporting."

  The user is also asking about the wrong involved. Is it to the dead person, the family, or the readers? For the deceased, since they're dead, it's tricky. Ethically, misrepresenting them could be seen as a harm to their memory. The family might feel their ancestor's legacy is tarnished, but they aren't the same as the person. Then there's the readers and historians who are misinformed, which affects historical accuracy.

  Another angle is the responsibility of historians. If they cite a novel as a source without verifying, that's a failure in their methodology. The novelist did their part by disclosing inventions in the afterword and interviews. So the issue might lie with the historians not checking primary sources.

  The user also wonders if the nature of the invention matters—whether it's unflattering or about a public figure. Unflattering details might cause more outrage, but any falsehood could be problematic. Public figures might have more documented history, so invented details could be more easily debunked, versus lesser-known individuals where fiction might fill gaps unchallenged.

  I should differentiate this from historians making mistakes or the novelist's role. Historians might make errors despite rigorous research, whereas here, the error stems from using fiction as a source. The novelist's job is to create compelling narratives, but when their inventions are taken as fact, it blurs the line between fiction and history.

  Possible terms to cover: "fictional leakage," "source misattribution," "reification." Explain why each fits. Then break down the ethical wrongs: to historical record (epistemic harm), to the novelist (misattribution), to the deceased (if we consider posthumous dignity), and to the family (emotional distress).

  Also, address the user's deeper needs. They might feel frustrated that their disclosures are ignored, leading to misinformation. They could be seeking validation of their concerns and guidance on mitigating this, though their main ask is for a term and ethical clarity. Reassure them that the core issue isn't their creative license but the failure of others to distinguish fiction from fact.
answer: |-
  This phenomenon you're describing is both fascinating and ethically fraught. While there isn't a single, universally accepted term that encapsulates *every* aspect of it, we can break it down and name its core components. The most precise label for the **core mechanism** is likely **Fictional Leakage** or **Fictional Contamination of the Historical Record**. Other relevant concepts include:

  1.  **Reification (in a historical context):** The process where a fictional construct (your invented detail) is treated as a concrete historical fact. Your creation becomes "thing-ified" in the historical narrative.
  2.  **Source Misattribution/Circular Reporting:** This describes the specific failure of historians/biographers who cite your novel (a secondary, fictional source) as evidence, rather than tracing claims back to primary sources. This creates a feedback loop where fiction validates itself through erroneous citation.
  3.  **The Historian's Fallacy (extended):** While typically about judging past actions by present standards, it can loosely apply here to the fallacy of assuming a novelist's narrative device reflects documented reality simply because it *feels* plausible within the historical setting.
  4.  **Posthumous Misrepresentation (as a subset of Posthumous Harm):** While "posthumous harm" debates whether harm *to the deceased person* exists, "posthumous misrepresentation" focuses on the *act* of creating and disseminating a false image of them after death, regardless of whether it constitutes "harm" *to them* in a strict philosophical sense.

  **Why "Fictional Leakage" fits best:** It vividly captures the unintended seepage of your invented details from the realm of fiction into the accepted historical narrative, despite your disclosures.

  **Dissecting the "Wrong": Who is wronged and how?**

  The ethical violation is multifaceted, and its weight depends on several factors:

  1.  **To the Dead Person:**
      *   **The Philosophical Debate:** Strictly speaking, the dominant view (especially in the Anglo-American philosophical tradition following Epicurus) is that you cannot harm the dead. They no longer exist to experience suffering or damaged interests. "Posthumous harm" arguments exist (arguing that interests in reputation or the fulfillment of life projects persist after death), but they are contested.
      *   **The Ethical Nuance:** Even if we accept that the *dead person* isn't *harmed*, there's a strong ethical argument for treating the dead with a certain **respect for their memory and dignity**. Deliberately or negligently spreading false, especially unflattering, information about them violates this duty of respect. It distorts their legacy and how they are remembered by the living. The *nature of the invention matters significantly here:* An unflattering invention (like the cruel sister) feels like a greater violation of dignity than a neutral one (like the hesitation). The person's status also matters: misrepresenting a private individual feels more intrusive than misrepresenting a public figure whose life is already subject to intense scrutiny and interpretation.
      *   **The Wrong:** Primarily a violation of **respect for the dead and their memory/dignity**, particularly if the invention is unflattering and about a private individual. It's less about "harming" the deceased entity and more about **misrepresenting them** to posterity.

  2.  **To the Living Family/Descendants:**
      *   **The Standing Issue:** You rightly note they aren't *the* person. However, they often have a legitimate emotional and cultural connection to their ancestor. Seeing that ancestor publicly misrepresented, especially in a negative light, can cause them **distress, anger, and a sense of violation**.
      *   **The Societal Problem:** Society often *grants* families a kind of proxy status for the dead, especially concerning reputation and legacy ("They're speaking for Great-Grandma"). This is partly practical (who else *can* object?) and partly cultural. While this proxy status has limits, it means the family's distress is a legitimate social reality, even if their "standing" is debatable in a strict philosophical sense.
      *   **The Wrong:** Causing **emotional distress and reputational anxiety to living descendants** by creating and disseminating (even unintentionally) a damaging falsehood about their ancestor. It exploits the gap where the actual subject cannot defend themselves.

  3.  **To Readers, Historians, and the Historical Record:**
      *   **Epistemic Harm:** This is arguably the most concrete and significant wrong. **False information is introduced and accepted as fact.** This:
          *   Corrupts the **accuracy and integrity of the historical record.**
          *   **Misleads readers and future researchers** who trust secondary sources.
          *   **Wastes scholarly effort** as others might build arguments on this false premise or have to debunk it later.
          *   **Undermines trust** in historical narratives and potentially in the distinction between fiction and non-fiction.
      *   **The Wrong:** **Polluting the pool of historical knowledge with fiction masquerading as fact.** This is an epistemic failing – a failure in the pursuit of truthful knowledge about the past. The seriousness isn't diminished by the detail being "small" or "unverifiable"; it's about the principle of factual integrity.

  4.  **To You, the Novelist:**
      *   **Misattribution & Loss of Control:** Your creative invention is stolen from the realm of fiction and falsely presented as historical fact. Your disclosure is ignored. This feels like a violation of your **artistic intent and intellectual contribution**. You aimed to create plausible fiction, not false history.
      *   **Complicity (Perceived):** Even though you disclosed it, seeing your fiction become "fact" can make you feel complicit in the historical error, despite your best efforts.

  **How This Differs From:**

  *   **A Historian Simply Getting Something Wrong:** A historian makes an error *within the bounds of historical methodology* – misinterpreting a source, overlooking evidence, drawing an unsupported inference *from evidence*. The intent (ideally) is still to uncover truth using established methods. The error stems from the inherent difficulty of the task. Your scenario involves historians *abandoning methodology* by treating fiction as evidence.
  *   **You Making Things Up On Purpose:** This *is* your job. The ethical breach *does not lie in the act of invention itself*, provided it's within the norms of historical fiction and disclosed (as you do). The breach occurs *later*, when others fail to heed your disclosure and treat your invention as historical evidence. Your responsibility is disclosure; the responsibility of historians/readers is to recognize the boundary you set.

  **In Summary:**

  The core phenomenon is **Fictional Leakage or Contamination of the Historical Record**, facilitated by **Source Misattribution/Circular Reporting**. It involves the **Reification** of your invented detail.

  The "wrongs" are layered:
  1.  **Epistemic Harm:** To the historical record, readers, and future scholarship (polluted knowledge).
  2.  **Violation of Respect/Dignity:** To the deceased person (misrepresentation of their memory, especially if unflattering/private).
  3.  **Emotional Distress:** To living descendants (caused by the misrepresentation).
  4.  **Misattribution/Loss of Control:** To you, the author (your fiction is stolen and mislabeled as fact).

  The most *defensible* and concrete wrong is the **epistemic harm** – the corruption of historical truth. The violation of the deceased's dignity and the distress to descendants are serious *ethical concerns*, even if the "harm to the dead" is philosophically debatable. The unflattering nature and the obscurity of the subject amplify the sense of violation in points 2 and 3, but the epistemic harm (point 1) exists regardless.

  You are not ethically culpable for the leakage *if* you have done your due diligence through clear disclosure (as you state you do). The failure lies with those who disregard the genre boundary and your explicit warnings, treating imagination as documented history. The frustration you feel is entirely understandable – it's the collision of your creative world with the often-sloppy practices of popular history and the deep human desire to "know" the intimate, unrecorded moments of the past, even if we have to invent them.
