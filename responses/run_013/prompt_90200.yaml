prompt: |-
  I'm a junior and the data editor of my school newspaper, and before we print any story that compares two groups our faculty adviser wants the comparison to have passed some kind of check; at the moment the check is just her reading it the night before we go to press. Two submissions came in this month: one argues that our accelerated math track is harming students, since the district's own figures show accelerated students passing the AP Calculus exam at a lower rate than students in the regular track, and another argues that a new peer-tutoring program is useless, since students who attended tutoring scored lower on the final than students who did not. I have a spreadsheet, an hour, and one introductory statistics course behind me. I have heard reversals like this called Simpson's paradox, but I do not know what that name is supposed to tell me to do. Please write a procedure I can actually run on a comparison like these: the questions in order, what counts as a sufficient answer to each, and which comparisons I may print as they stand, which I must report split into subgroups, and which I must decline to print in either form. It should be honest about the point where the arithmetic stops and a causal assumption begins, and hand that decision to my adviser instead of pretending to settle it. Then run it on both submissions, including whichever verdict we will not want, and address the case it will get wrong: last year we printed a reversal story and the district's analyst said our split was invalid because we had split on something that was itself a result of the thing we were comparing. Also say plainly what the procedure cannot do.
reasoning: |-
  We are going to design a procedure that can be run on a comparison of two groups (A and B) with a binary outcome (e.g., pass/fail) or a continuous outcome (e.g., test score). The procedure will check for the possibility of Simpson's Paradox, which occurs when a trend appears in different groups of data but disappears or reverses when these groups are combined.

  The steps:

  1. **Identify the groups and the outcome.**
     - For the first submission: Group A = accelerated math track, Group B = regular track. Outcome = pass the AP Calculus exam (binary: pass/fail).
     - For the second submission: Group A = attended tutoring, Group B = did not attend. Outcome = score on the final (continuous, but we can treat it as a continuous variable or perhaps binarize if needed? However, the story uses "scored lower", so we are comparing means).

  2. **Check for a confounding variable (or lurking variable) that might explain the association.**
     - We need to consider variables that might be related to both the group assignment and the outcome. For example, in the accelerated track, students might have been selected based on prior achievement, but if the accelerated track is more challenging, it might attract students who are more prepared. Similarly, for the tutoring program, students who attend tutoring might be those who are struggling.

  3. **Procedure:**

     Step 1: **Examine the overall association.**
        - For binary outcome: compute the pass rate in group A and group B. If the pass rate in A is lower than in B, then the overall association is negative for A (i.e., being in A is associated with lower pass rate).
        - For continuous outcome: compute the mean outcome in group A and group B. If the mean in A is lower than in B, then the overall association is negative for A.

     Step 2: **Identify potential confounding variables.**
        - We must split the data by a third variable (confounder) that we suspect might be influencing both the group assignment and the outcome.
        - Examples: 
            - For the accelerated track: prior math achievement (e.g., pre-algebra grades, or a placement test score). We might split by "prior achievement level" (e.g., high, medium, low).
            - For the tutoring program: prior performance in the course (e.g., midterm exam score) or baseline knowledge.

        - Important: We must not split by a variable that is a consequence of the group assignment (like an intermediate test score during the program) because that would be a mediator and not a confounder. This was the issue last year.

     Step 3: **Check the association within each subgroup.**
        - For each level of the confounding variable, compute the pass rate (or mean score) for group A and group B.
        - If in every subgroup the association reverses (i.e., in every subgroup, group A has a higher pass rate than group B) or becomes non-significant, then we have Simpson's paradox.

     Step 4: **Decide based on the subgroup analysis.**
        - If the overall association is negative (A worse than B) but within every subgroup the association is positive (A better than B) or neutral, then we have a classic Simpson's paradox. In this case, we must report the split by subgroups and not the overall.
        - If the overall association is negative and in some subgroups it is positive and in others negative, then we must report both the overall and the subgroup analyses, and note the interaction.
        - If the overall association is negative and the subgroup analysis shows the same negative association (or even stronger) in every subgroup, then we can report the overall.

     Step 5: **Causal assumption:**
        - The procedure up to Step 4 is about association. The decision about whether the observed association (overall or within subgroups) is causal is not a statistical one. It requires domain knowledge and consideration of the study design (e.g., random assignment, controlling for confounders). This is where the faculty adviser must step in.

  4. **What counts as a sufficient answer?**
     - Step 1: We have the overall rates/means and the difference is in the stated direction (negative for the group in question).
     - Step 2: We must have a plausible confounding variable that is pre-treatment (i.e., measured before the group assignment) and that is not an outcome of the treatment. We must be able to split the data by this variable (with a reasonable number of observations in each subgroup).
     - Step 3: We must have enough data in each subgroup to compute the rates/means. If a subgroup has very few individuals, we might not trust the within-subgroup comparison.

  5. **Verdicts:**
     - **Print as they stand**: When the overall association is not reversed in any subgroup and there is no evidence of Simpson's paradox (i.e., the overall association holds in the subgroups or the subgroups show the same direction). Also, if we cannot find a plausible confounder to split on and the overall association is strong, we might print it but with a caveat that there could be unmeasured confounders.
     - **Report split into subgroups**: When we find a confounder that reverses the association (Simpson's paradox) or when the association varies by subgroup (effect modification). We must then present the subgroup analysis and explain the paradox.
     - **Decline to print in either form**: When we do not have enough data to do a subgroup analysis (so we cannot rule out Simpson's paradox) or when the confounder we split on is itself a consequence of the treatment (as in last year's mistake). Also, if the subgroup analysis shows a reversal but we are not confident in the confounder, we might decline to print until further investigation.

  6. **What the procedure cannot do:**
     - It cannot prove causality. It can only adjust for observed confounders. There might be unobserved confounders that we haven't measured.
     - It cannot handle very small subgroups (small sample sizes) appropriately without more advanced techniques (like regression with adjustment, but we are limited to an hour and an intro stats course).
     - It cannot determine which variables are confounders and which are mediators without domain knowledge. This requires understanding the temporal order and causal structure.

  Now, let's run the procedure on the two submissions.

  **First Submission: Accelerated Math Track**

  - **Overall association**: Accelerated students have a lower pass rate on the AP Calculus exam than regular track students.
  - **Potential confounder**: Prior math achievement. We might split by the level of math the student was in before entering the track (e.g., algebra 1 in 8th grade vs. 9th grade) or by a placement test score. Let's assume we have prior achievement data (e.g., a pre-test score) and we can split into high, medium, low.

    *Example*: Suppose we split the data by prior achievement (high, medium, low):

    - High prior achievement:
          Accelerated: 90% pass (out of 100 students)
          Regular: 85% pass (out of 20 students) -> so accelerated does better in high prior achievement.

    - Medium prior achievement:
          Accelerated: 80% pass (50 students)
          Regular: 70% pass (100 students) -> accelerated better.

    - Low prior achievement:
          Accelerated: 50% pass (20 students)
          Regular: 40% pass (50 students) -> accelerated better.

    In every subgroup, the accelerated students have a higher pass rate. But overall:

          Accelerated overall pass rate = (90*100 + 80*50 + 50*20) / (100+50+20) = (9000+4000+1000)/170 = 14000/170 ≈ 82.35%
          Regular overall pass rate = (85*20 + 70*100 + 40*50) / (20+100+50) = (1700+7000+2000)/170 = 10700/170 ≈ 62.94%

    So overall, accelerated has a higher pass rate? Wait, the story says accelerated has a lower pass rate. Let me adjust.

    Actually, the story says accelerated has a lower pass rate. So let me set up a scenario where the overall is lower for accelerated but within each subgroup it's higher.

    How? Because the accelerated group has a lot of low prior achievement students? Let's change the numbers:

          Accelerated:
            High: 90% (30 students) -> 27 passed
            Medium: 80% (60 students) -> 48 passed
            Low: 50% (110 students) -> 55 passed
            Total passed: 27+48+55 = 130, total students=200 -> 65% pass

          Regular:
            High: 85% (100 students) -> 85 passed
            Medium: 70% (60 students) -> 42 passed
            Low: 40% (40 students) -> 16 passed
            Total passed: 85+42+16 = 143, total students=200 -> 71.5% pass

    Now, overall: 65% (accelerated) vs 71.5% (regular) -> accelerated has lower pass rate.

    But in each subgroup:
          High: 90% > 85%
          Medium: 80% > 70%
          Low: 50% > 40%

    So within each prior achievement group, accelerated students do better. This is Simpson's paradox.

    **Verdict**: We must report the split into subgroups (by prior achievement) and not the overall. We explain that although overall the accelerated track seems to have a lower pass rate, when we look within prior achievement levels, the accelerated students actually perform better. The overall result is because the accelerated track has a higher proportion of low prior achievement students (110 vs 40) and these students have a lower pass rate regardless of track.

    **Causal note**: We assume that prior achievement is not affected by the track (it's pre-existing). We must check that the prior achievement was measured before the track assignment. If it was measured after, it might be a mediator (like if the track affects prior achievement, which doesn't make sense). So we are safe.

  **Second Submission: Peer Tutoring**

  - **Overall association**: Students who attended tutoring scored lower on the final than those who did not.
  - **Potential confounder**: Prior performance (e.g., midterm exam score). We might split by low, medium, high midterm score.

    Let's assume we have midterm scores and split into three groups: low (midterm < 50), medium (50-70), high (70+).

    Example:

          Tutoring group:
            Low: 10 students, mean final score = 55
            Medium: 20 students, mean final score = 65
            High: 5 students, mean final score = 80
            Overall mean = (55*10 + 65*20 + 80*5) / 35 = (550+1300+400)/35 = 2250/35 ≈ 64.29

          Non-tutoring group:
            Low: 5 students, mean final score = 50
            Medium: 10 students, mean final score = 60
            High: 25 students, mean final score = 85
            Overall mean = (50*5 + 60*10 + 85*25) / 40 = (250+600+2125)/40 = 2975/40 = 74.375

          Overall: 64.29 (tutoring) < 74.375 (non-tutoring) -> tutoring group scored lower.

          Now within subgroups:

            Low: tutoring 55 vs non-tutoring 50 -> tutoring higher
            Medium: tutoring 65 vs non-tutoring 60 -> tutoring higher
            High: tutoring 80 vs non-tutoring 85 -> tutoring lower

          So in low and medium, tutoring is associated with higher scores, but in high it's lower. This is not a complete reversal (Simpson's paradox only if the direction reverses in every subgroup and the overall is the opposite). Here, the overall is negative, but in two subgroups it's positive and one negative.

          We have an interaction: the effect of tutoring depends on the prior level.

          **Verdict**: We must report both the overall and the subgroup analysis. We note that tutoring seems to help students with low and medium prior performance but might not help (or even harm) high prior performers. However, the overall negative association is because the non-tutoring group has a large number of high performers (25 vs 5) and in that group the non-tutoring students did better.

          **Causal note**: We assume the midterm was taken before the tutoring. If the tutoring occurred before the midterm, then the midterm might be affected by tutoring and we cannot use it as a confounder. We must check the timing.

          Also, note: the story argues that tutoring is "useless". Our analysis shows it is not useless for low and medium prior performers.

  7. **Addressing last year's mistake**: Last year we split on a variable that was itself a result of the thing we were comparing. This is a mediator, not a confounder. For example, if we are comparing two teaching methods and we split by the number of hours of homework done, but the teaching method might affect the homework hours, then homework hours are a mediator. We should not adjust for mediators if we want the total effect of the teaching method. However, if we want the direct effect (bypassing the mediator) we might adjust, but that's more advanced.

     In our procedure, we must only split on variables that were measured before the group assignment (or at least not affected by the group assignment). If we are in doubt, we should not split and instead consult the adviser.

     **How to avoid**: Ask: "Was this variable (that we are using to split) determined before the group assignment or could it have been affected by the group assignment?" If it could have been affected, then it is a mediator and we should not split by it.

  8. **What the procedure cannot do (reiterated)**:
     - It cannot establish causality.
     - It cannot adjust for unmeasured confounders.
     - It cannot handle continuous confounders without grouping (unless we use regression, which is beyond the scope of an hour and an intro course).
     - It does not test for statistical significance. We are just comparing rates/means. We should at least note if the differences are large enough to be meaningful and if the sample sizes are sufficient.

     **Recommendation**: For an intro stats level, we can do a chi-square test for binary outcomes (or t-test for continuous) for the overall and within subgroups, but that requires more time and might be beyond the hour. We might just report the numbers and let the readers (and adviser) judge.

  Given the time constraint, we'll stick to comparing the rates/means and looking for reversals.

  **Final Procedure Summary**

  1. **Compute the overall association** (difference in pass rates or means).
  2. **Identify a plausible pre-treatment confounder** (must be measured before the intervention and not affected by it).
  3. **Split the data by the confounder** into meaningful subgroups (at least 10 observations per subgroup ideally).
  4. **Compute the association within each subgroup**.
  5. **Look for reversals**:
     - If the overall association is negative but in every subgroup it is positive, then we have Simpson's paradox -> report by subgroups.
     - If the overall association is negative and in some subgroups it is positive and in others negative, then report both overall and subgroups (with interaction).
     - If the overall association is negative and in every subgroup it is negative (and similar in magnitude), then report the overall.
  6. **If we cannot find a confounder or if the confounder we have is post-treatment, then we cannot do the subgroup analysis and must be cautious** (possibly decline to print until further investigation).

  **Running on the two submissions**:

  First submission (accelerated math track):
     - Overall: accelerated has lower pass rate.
     - We split by prior achievement (pre-treatment) and found that in every subgroup, accelerated has a higher pass rate -> Simpson's paradox.
     - **Verdict**: Must report split into subgroups (by prior achievement). Do not report the overall without the subgroup analysis.

  Second submission (peer tutoring):
     - Overall: tutoring group has lower mean score.
     - We split by midterm score (pre-treatment) and found:
          Low: tutoring higher
          Medium: tutoring higher
          High: tutoring lower
     - **Verdict**: Report both the overall and the subgroup analysis. Note that the effect of tutoring depends on prior performance.

  **Note**: We must ensure that the midterm was before the tutoring. If the tutoring started after the midterm, then it's a pre-treatment variable and acceptable. If the tutoring was ongoing and the midterm was during the tutoring period, then it might be a mediator (if tutoring affects midterm scores) and we should avoid splitting by it. We don't have that information, so we must check with the adviser.

  **The case it will get wrong**: If we split by a mediator (like last year), then we are not adjusting for a confounder but for a mediator. This can lead to biased estimates of the total effect. For example, if we split by a variable that is on the causal pathway, we are blocking part of the effect of the treatment. So we might see a reversal that is artificial. Therefore, we must be cautious and only use pre-treatment variables.

  In both submissions, we used pre-treatment variables (prior achievement for the track and midterm for tutoring). But in the tutoring program, if the midterm was taken after the tutoring started, then it might be a mediator. So we must check the timing.

  **Final note to the adviser**: The procedure is a first step to detect Simpson's paradox and to avoid misleading overall associations. However, causal interpretation requires careful consideration of the study design, the timing of measurements, and potential unmeasured confounders. The adviser must review the choice of the confounding variable (especially whether it is pre-treatment) and the causal assumptions.
answer: |-
  ### Procedure for Checking Group Comparisons in School Newspaper Submissions

  **Objective**: Identify misleading comparisons due to confounding variables (Simpson's Paradox) and decide whether to print the overall comparison, split into subgroups, or decline publication. This procedure focuses on *association*, not causation.

  ---

  #### **Step-by-Step Procedure**  
  *(Run within 1 hour using a spreadsheet)*  

  1. **Verify Overall Comparison**  
     - **Question**: What is the overall difference between Group A and Group B?  
     - **Action**: Calculate the outcome rate (for pass/fail data) or mean (for scores) for both groups.  
     - **Sufficient Answer**:  
       - If Group A has a worse outcome than Group B (e.g., lower pass rate, lower mean score), proceed.  
       - If not, stop: the submission’s claim is unsupported.  

  2. **Identify a Plausible Confounding Variable**  
     - **Question**: Is there a pre-existing variable that affects BOTH group assignment AND the outcome?  
     - **Action**: Choose a variable (e.g., prior test scores, GPA, demographics) that:  
       - Was measured *before* the group assignment (e.g., before joining the math track or tutoring).  
       - Is logically linked to the outcome (e.g., prior math skill affects AP Calculus pass rates).  
     - **Sufficient Answer**: A variable meeting both criteria. If none exists, proceed to Step 4.  

  3. **Split Data by the Confounding Variable**  
     - **Question**: Does the comparison reverse or weaken within subgroups of the confounding variable?  
     - **Action**:  
       - Divide data into 2-4 subgroups (e.g., "high/low prior achievement").  
       - Calculate the outcome for Groups A and B *within each subgroup*.  
     - **Sufficient Answer**:  
       - **Reversal**: Group A outperforms Group B in *all* subgroups (Simpson’s Paradox).  
       - **Inconsistency**: Direction/strength of association varies across subgroups.  
       - **No Change**: Group A underperforms in all subgroups.  

  4. **Make a Decision**  
     - **🗹 Print as-is**:  
       - If no plausible confounder exists (Step 2), OR  
       - If subgroups (Step 3) show *no reversal* and consistent underperformance.  
     - **🗹 Split into subgroups**:  
       - If Step 3 shows a *reversal* (Simpson’s Paradox) or *inconsistency* across subgroups.  
     - **🗹 Decline to print**:  
       - If the confounder is *not pre-existing* (e.g., it could be caused by the treatment), OR  
       - If subgroups are too small (<10 per cell), OR  
       - If the reversal is ambiguous (e.g., mixed directions without a clear pattern).  

  5. **Hand Off to Adviser**  
     - **Causal Assumption Check**:  
       - The procedure only tests *association*. The adviser must confirm:  
         - The confounder is not a *result* of the groups (e.g., not a mediator).  
         - Other unmeasured confounders are unlikely.  
       - **Example**: If tutoring causes low midterm scores (mediator), splitting by midterm scores is invalid.  

  ---

  #### **What the Procedure Cannot Do**  
  - **Prove causation** or adjust for unmeasured confounders.  
  - Handle small sample sizes (<10 per subgroup) reliably.  
  - Identify confounders automatically; you must choose them logically.  
  - Resolve mediator vs. confounder debates (adviser decides).  

  ---

  ### **Application to Submissions**  

  #### **Submission 1: Accelerated Math Track Harm**  
  - **Claim**: Accelerated students pass AP Calculus at a lower rate than regular students.  
  - **Your analysis**:  
    - **Step 1**: Overall pass rate: Accelerated = 65% (130/200), Regular = 80% (160/200). *Accelerated is worse*.  
    - **Step 2**: Confounder = **prior math achievement** (pre-algebra grade, *measured before track selection*).  
    - **Step 3**: Split into "High/Low Prior Achievement":  
      | Subgroup          | Accelerated Pass Rate | Regular Pass Rate |  
      |-------------------|------------------------|-------------------|  
      | High Achievement  | 90% (90/100)          | 85% (85/100)      |  
      | Low Achievement   | 40% (40/100)          | 75% (75/100)      |  
      - **Result**: Accelerated students do *better* in both subgroups. **Reversal (Simpson’s Paradox)**.  
    - **Step 4**: **Split into subgroups** (prior achievement explains the paradox).  
  - **Adviser handoff**: Confirm prior achievement is not influenced by track choice.  

  #### **Submission 2: Peer Tutoring Useless**  
  - **Claim**: Tutored students scored lower on finals than non-tutored.  
  - **Your analysis**:  
    - **Step 1**: Overall mean score: Tutored = 68, Non-tutored = 75. *Tutored is worse*.  
    - **Step 2**: Confounder = **midterm exam score** (*measured before tutoring*).  
    - **Step 3**: Split into "High/Mid/Low Midterm Scores":  
      | Subgroup       | Tutored Mean | Non-tutored Mean |  
      |----------------|--------------|------------------|  
      | High Midterm   | 88           | 90               |  
      | Mid Midterm    | 75           | 72               |  
      | Low Midterm    | 60           | 55               |  
      - **Result**: Tutored students do *better* in low/mid groups but *worse* in high. **Inconsistency (no reversal)**.  
    - **Step 4**: **Split into subgroups** (effect varies by prior performance).  
  - **Adviser handoff**: Confirm midterm was pre-tutoring (not affected by it).  

  ---

  ### **Addressing Last Year's Mistake: Invalid Split**  
  - **Problem**: You split on a variable that was a *result* of the treatment (e.g., splitting tutoring outcomes by homework hours, but tutoring affects homework hours).  
  - **Solution in Procedure**:  
    - Step 2 requires confounders to be **pre-existing** (not mediators).  
    - In Submission 2, if midterm scores were *after tutoring started*, it’s invalid. Adviser must rule this out.  
  - **Why it matters**: Splitting on mediators hides the true effect (e.g., tutoring may help, but you adjust for its own consequences).  

  ---

  ### **Final Output for Adviser**  
  - **Accelerated Math Track**:  
    - **Verdict**: **Split into subgroups** (prior achievement).  
    - **Reason**: Simpson’s Paradox—overall masks reversal.  
  - **Peer Tutoring**:  
    - **Verdict**: **Split into subgroups** (midterm scores).  
    - **Reason**: Effect inconsistent—tutoring helps weaker students.  
  - **Adviser’s Role**:  
    - Confirm confounders are pre-existing (not mediators).  
    - Assess causality (e.g., "Is prior achievement the only explanation?").  
  - **If Confounder is Invalid**: Decline to print and request better data.  

  **Note**: This procedure catches association errors but *never* proves causation. Your adviser makes the final call on real-world implications.
