prompt: |-
  I teach an upper-level metaphysics seminar (18 students, 90 minutes) and I want them to *feel* how hard it is to tell a real disagreement from two people using the same word in two different senses — the metaontology problem, but staged instead of lectured. You're a philosopher who builds classroom simulations, so think carefully about the mechanics before you write anything, and start by brainstorming a bunch of candidate words and candidate items, then commit to one set.

  Design the activity. My rough plan, which you should improve on: two groups get private meaning cards for one contested word — exists — with two defensible but incompatible criteria for it, one roughly "is part of the world's basic inventory, not decomposable away without remainder" and the other roughly "there are true sentences about it within some legitimate domain of discourse". The cards stay secret. Each group then sorts the same 12 item cards (chairs, holes, corporations, nations, waves, heaps of sand, fictional characters, numbers, the average family, a song, a shadow, a promise) into exists / doesn't exist, and after that the two groups have to jointly deliver a verdict on three target items. To keep it from collapsing into "it's just semantics", give each group one swap token: spending it forces the other side to restate its claim without using the contested word — and whatever can't be restated is the thing to look at in the debrief.

  Give me the full runnable thing: the exact card text for both meaning cards and all the item cards, the rules and roles, a minute-by-minute timeline, the exact moment I reveal the cards, and a debrief that maps what just happened onto the distinctions I want them to leave with — the elimination/swap test for verbalness, why "verbal" doesnt mean "trivial" (what's left over is a question about which concept we should be using, not about the world), the internal/external distinction, and the realist line that says one group was describing the world better after all. Name the moves if it helps, but the mapping matters, not the labels.

  Then: what will predictably go wrong the first time i run it — someone reaching for the dictionary, someone declaring "just semantics" at minute ten, one group bullying the other into a compromise definition, the aha landing as "so philosophy is pointless" — how to handle each, and be honest about which part of the idea this format can't reproduce and that I'll have to supply myself.

  Dont hand me three variants or hedge. Commit to one word, one item list, one set of target items, and in the debrief take a definite position on whether the residue left after the swap test is a genuine question or just a preference about words, with your reasons.
reasoning: |-
  We are going to use the word "exists" and the two meanings as described. The two groups will be assigned one of the two criteria:

  Group A (Fundamentalist): Something exists if and only if it is part of the world's basic inventory, not decomposable without remainder. This view is often associated with a sparse ontology.

  Group B (Conceptualist): Something exists if and only if there are true sentences about it within some legitimate domain of discourse. This view is more permissive.

  We will have 12 item cards. The target items for the joint verdict will be three of these. I propose:

  Target items: 
  1. Corporations
  2. Fictional characters (e.g., Sherlock Holmes)
  3. Waves

  But note: the groups will sort all 12, and then the joint verdict is on three. We'll choose three that are likely to show the divergence.

  The items:

  1. Chair
  2. Hole
  3. Corporation
  4. Nation
  5. Wave
  6. Heap of sand
  7. Fictional character (e.g., Sherlock Holmes)
  8. Number (e.g., the number 7)
  9. The average family
  10. A song (e.g., "Happy Birthday")
  11. A shadow
  12. A promise

  Now, the meaning cards:

  **Group A's Meaning Card (Fundamentalist):**
  *Your criterion for existence:*
  Something exists only if it is part of the fundamental, basic inventory of the world. It must not be decomposable without remainder into other, more basic things. If it can be reduced away or explained entirely in terms of other things, then it does not truly exist in its own right.

  **Group B's Meaning Card (Conceptualist):**
  *Your criterion for existence:*
  Something exists if there are true sentences about it within some legitimate domain of discourse. If we can meaningfully talk about it in a context that is not merely fictional or mistaken (e.g., in science, mathematics, everyday life, law, etc.), then it exists.

  **Item Cards (each card has one item):**
  1. Chair
  2. A hole (e.g., a hole in a piece of Swiss cheese)
  3. Corporation (e.g., Apple Inc.)
  4. Nation (e.g., France)
  5. Wave (e.g., an ocean wave)
  6. Heap of sand (e.g., a pile of grains)
  7. Fictional character (e.g., Sherlock Holmes)
  8. Number (e.g., the number 7)
  9. The average family (e.g., as in "the average family has 2.4 children")
  10. A song (e.g., "Happy Birthday")
  11. A shadow (e.g., the shadow of a tree)
  12. A promise (e.g., a promise you made to a friend)

  **Rules and Roles:**

  - The class is divided into two groups (Group A and Group B) of about 9 students each.
  - Each group gets their meaning card (kept secret from the other group) and a set of the 12 item cards.
  - Groups have 15 minutes to discuss and sort the 12 items into two categories: "exists" and "does not exist" according to their criterion.
  - After sorting, the groups come together. The instructor reveals that there are two different criteria and that they must now jointly deliver a verdict on three target items (without revealing their criteria to each other). The target items are: Corporation, Fictional character, and Wave.
  - The groups have 10 minutes to discuss and agree on a joint verdict for each of the three items (exists or does not exist). They must try to convince each other without revealing their secret criteria.
  - Each group has one "swap token". At any point during the joint discussion, a group can use their swap token. When they do, they choose one claim made by the other group that uses the word "exists" (or "does not exist") and force them to restate that claim without using the word "exists" or any derivative (like "existence"). The other group must try to rephrase their point. The swap token can only be used once per group, so they must choose wisely.
  - After the joint verdict (or when time runs out), the instructor reveals the two meaning cards and leads a debrief.

  **Timeline (90 minutes total):**

  1. **0-5 min:** Introduction. Explain the activity: "Today we are going to explore what it means for something to exist. You will be in two groups, each with a different perspective. Your task is to sort a set of items into those that exist and those that do not. Then, you will come together to try to agree on three controversial items. Remember, you cannot reveal your group's criterion to the other group until the end." Assign groups and give out materials.

  2. **5-20 min:** Group work (15 min). Each group sorts the 12 items. They discuss and record their decisions. (The instructor circulates to answer procedural questions but does not help with the sorting.)

  3. **20-30 min:** Transition and setup for joint discussion. Explain the rules for the joint part: "Now, without revealing your criteria, you must jointly agree on whether Corporations, Fictional characters, and Waves exist. You have 10 minutes. Each group has one swap token: if you use it, you can force the other group to restate a claim that uses the word 'exists' without using that word. Use it if you think they are using the word in a way that hides a disagreement about meaning."

  4. **30-40 min:** Joint discussion (10 min). The two groups debate the three items. The instructor watches and notes when swap tokens are used.

  5. **40-45 min:** If a swap token is used, allow time for the restatement. If not, move to reveal.

  6. **45-50 min:** Reveal the two meaning cards. Show both groups the criteria they were using.

  7. **50-85 min:** Debrief (35 min). The heart of the activity. Structure the debrief as follows:

     a. **Map the activity onto the metaontology problem:** Start by asking each group to report how they sorted one of the target items and why. Then reveal the criteria. Point out that they were having a verbal dispute in part: they meant different things by "exists". But not entirely, because after the swap test, there might be residual disagreement.

     b. **The swap test:** Ask: When the swap token was used, what happened? The group forced to restate had to express their claim without "exists". For example, Group B might say about corporations: "We can meaningfully talk about them in law and economics." Group A might say: "But they are just collections of people and contracts, so they are reducible." The residual disagreement is about whether reducibility matters for fundamental existence or whether being a subject of true discourse is enough. This residual is not about the word "exists" but about the world: what is fundamental? What is the structure of reality?

     c. **Why "verbal" doesn't mean "trivial":** Even if we agree that the dispute is partly verbal, what's left is substantive: Which concept of existence should we use? And that choice might depend on what we care about (e.g., in fundamental physics vs. social science). But also, one might argue that the fundamentalist is getting at a deeper truth about reality.

     d. **Internal/external distinction:** The conceptualist's criterion is internal to our conceptual schemes (domains of discourse). The fundamentalist's criterion is about the external world independent of us. But note: the fundamentalist also uses concepts to describe the world. So the distinction is not absolute.

     e. **Realist line:** Argue that the fundamentalist is describing the world better because they are trying to get at what is ultimately real, beyond our representations. But the conceptualist might counter that without our representations, we cannot even talk about the world. This is the crux.

     f. **Take a position in the debrief:** State that the residue after the swap test is a genuine question, not just about words. It's about what grounds what. For example: Are corporations real in their own right, or do they depend entirely on people and contracts? This is a metaphysical question about dependence and fundamentality.

  8. **85-90 min:** Wrap up: Summarize the key points and how this relates to metaontology.

  **What might go wrong and how to handle it:**

  1. **Dictionary use:** If someone tries to look up "exists", say: "In philosophy, we are often trying to clarify our concepts beyond common usage. The point is to see what happens when we use two different but defensible criteria."

  2. **"Just semantics" at minute 10:** If a student says this during the joint discussion, that's actually a good moment! Note it and use it in the debrief: "Yes, it is partly about semantics, but let's see what remains when we remove the semantic part." Then, if they haven't used the swap token, suggest that this might be a good time to use it.

  3. **Bullying into compromise:** The instructor should monitor the joint discussion. If one group is dominating, remind them: "Remember, you have a swap token. Use it if you feel the other group is not addressing your point." Also, in the debrief, point out that the goal was not to compromise but to see what underlies the disagreement.

  4. **"Philosophy is pointless":** In the debrief, emphasize that the residue is a deep and substantive question. For example: "When we remove the verbal part, we are left with a question about the structure of reality. That is exactly what metaphysics is for."

  **What the format can't do and you must supply:**

  - The format can't fully capture the depth of the philosophical positions. You must help them see that the fundamentalist view is tied to a project of finding the ultimate building blocks of reality, while the conceptualist view might be tied to pragmatism or pluralism. In the debrief, you can briefly mention Carnap vs. Quine or other relevant debates to ground it.

  - Also, the swap token might not be used effectively. If not, in the debrief, simulate how it would have worked: "Suppose Group A had used their swap token when Group B said 'Corporations exist'. How might Group B restate it? And then what would Group A say?"

  **Commitment:**

  - Word: "exists"
  - Item list: as above (12 items)
  - Target items for joint verdict: Corporations, Fictional characters, Waves.

  **Debrief position:** The residue after the swap test is a genuine metaphysical question, not merely a preference about words. Why? Because it involves competing views about what is fundamental and what depends on what. For example, the dispute about corporations might reduce to: Are there only particles arranged corporation-wise, or is there an additional entity (the corporation) that emerges and has causal powers? This is a question about the structure of reality, not just language.

  **Final note:** This activity is designed to make the abstract problem tangible. The debrief is crucial to elevate the experience to the philosophical level.
answer: |-
  Below is a fully designed, runnable classroom simulation for your metaontology seminar. I've committed to one word ("exists"), one item list (12 items), and one set of target items (corporations, waves, fictional characters). The design prioritizes creating a tangible experience of the verbal/non-verbal distinction, with mechanics to prevent premature collapse into "it's just semantics." I'll provide the exact card text, rules, a minute-by-minute timeline, debrief structure, and handling for predictable pitfalls.

  ### **Core Mechanics Rationale**
  - **Why "exists"?** It's the central term in metaontology (e.g., Carnap vs. Quine) and perfectly showcases how a single word can mask divergent criteria.
  - **Why these 12 items?** They create a gradient from uncontroversial (chairs) to highly contested (fictional characters), forcing groups to confront borderline cases. The three target items (corporations, waves, fictional characters) are "pressure points" where the two criteria reliably clash.
  - **Swap token** forces groups to articulate the *non-verbal* residue (e.g., "reducible to particles" vs. "discussed in legal texts"). This isolates the substantive disagreement.
  - **Secret meanings** ensure students embody their assigned view, preventing early semantic negotiation.
  - **Debrief stance:** The residue after the swap test is a **genuine question** (about ontological priority), not merely verbal preference. I argue this in the debrief with reasons.

  ---

  ### **Card Text (Print for Groups)**
  **Meaning Card for Group A (Fundamentalist):**  
  *"Your criterion for 'exists': Something **exists** only if it is part of the world's basic, fundamental inventory. It must not be fully decomposable or reducible to other things without remainder. If it can be explained away as nothing 'over and above' its parts, it does not exist."*  

  **Meaning Card for Group B (Conceptualist):**  
  *"Your criterion for 'exists': Something **exists** if there are true, meaningful sentences about it in a legitimate domain of discourse (e.g., science, law, everyday talk). If we can correctly describe it in a non-fictional context, it exists—regardless of whether it is 'reducible'."*  

  **Item Cards (12 items, one per card):**  
  1. Chair  
  2. A hole (in a piece of Swiss cheese)  
  3. Corporation (e.g., Apple Inc.)  
  4. Nation (e.g., France)  
  5. Wave (e.g., an ocean wave)  
  6. Heap of sand (e.g., a pile of grains)  
  7. Fictional character (e.g., Sherlock Holmes)  
  8. Number (e.g., the number 7)  
  9. The average family (e.g., "The average family has 2.4 children")  
  10. A song (e.g., "Happy Birthday")  
  11. A shadow (e.g., the shadow of a tree)  
  12. A promise (e.g., a promise you made to a friend)  

  ---

  ### **Rules and Roles**
  - **Groups:** Split the 18 students into Group A (Fundamentalists, 9 students) and Group B (Conceptualists, 9 students).  
  - **Secrecy:** Groups *never* reveal their meaning cards until the debrief.  
  - **Swap Token:** Each group gets one physical token (e.g., a coin). When used, it forces the opposing group to restate a claim **without using "exists," "existence," or derivatives** for one targeted assertion (e.g., "Corporations exist" → "Corporations are subjects of legal discourse").  
  - **Phases:**  
    1. **Sorting Phase:** Groups sort all 12 items into "exists" or "does not exist" using their secret criterion.  
    2. **Joint Verdict Phase:** Groups debate and agree on a verdict (exists/does not exist) for three target items: **Corporations, Waves, Fictional characters**.  
    3. **Swap Token Use:** During the Joint Verdict, a group may spend their token to challenge verbal ambiguity.  
  - **Win Condition:** Not about "winning"—the goal is to expose the disagreement’s structure.  

  ---

  ### **Minute-by-Minute Timeline (90 Total Minutes)**
  - **0–5 min: Setup**  
    Assign groups, distribute meaning cards (emphasize secrecy), and item cards. Briefly explain: *"You’ll sort items based on what 'exists' means to your group. Then, you’ll debate three items jointly. Use the swap token if you suspect a verbal trap."*  

  - **5–25 min: Sorting Phase (20 min)**  
    Groups work privately. **Instructor circulates but does not intervene.** Expect Group A to reject reducible items (e.g., heaps, nations); Group B to accept most items (e.g., numbers, promises).  

  - **25–30 min: Transition (5 min)**  
    Collect sorting sheets. Announce: *"Now, jointly decide whether Corporations, Waves, and Fictional characters exist. Remember: no revealing your meaning card! Each group has one swap token."*  

  - **30–50 min: Joint Verdict Phase (20 min)**  
    Groups debate the three target items. **Instructor silently observes.** Predictions:  
    - Group A will argue corporations are "just people/contracts," waves "just water," fictional characters "not real."  
    - Group B will cite law (corporations), physics (waves), and literature (fictional characters).  
    - **Swap token use:** Likely triggered when one side says, "But it *obviously* exists!" (e.g., Group B uses it when Group A says "Waves don't exist").  

  - **50–55 min: Swap Token Execution (5 min, if used)**  
    If a token is spent, pause for the challenged group to restate their claim without "exists." Example:  
    - Group A: "Waves don't exist." → After swap: "Waves are just patterns of water particles—nothing fundamental."  
    - Group B: "Corporations exist." → After swap: "Corporations are legal entities with rights and duties."  

  - **55–60 min: Reveal Meaning Cards (5 min)**  
    **Critical moment:** Project or read both meaning cards aloud. Say: *"Your criteria were different all along. Let’s unpack why this wasn’t 'just semantics.'"*  

  - **60–85 min: Debrief (25 min)**  
    Structure the discussion to map the experience onto metaontology:  

    1. **Verbal Dispute Identification (5 min):**  
       - Ask: *"Where did you feel you were talking past each other?"* (Likely: "exists" masked divergent criteria).  
       - **Map to concept:** This is the "verbal core"—the part resolvable by disambiguation (e.g., "Group A meant 'fundamentally real,' Group B meant 'discourse-apt'").  

    2. **Swap Test & Non-Verbal Residue (10 min):**  
       - Ask: *"When the swap token forced rewording, what was left?"*  
         - Example: For corporations, Group A: *"They’re reducible to people/contracts"* vs. Group B: *"They have legal powers."*  
       - **Map to concepts:**  
         - The residue is **non-verbal**: It’s a disagreement about *ontological priority* (is reduction possible?) and *explanatory adequacy* (do legal powers require irreducible entities?).  
         - **Why it’s not trivial:** This residue asks, *"Which criterion better captures reality's structure?"* — a question about the world, not words.  
       - **My committed stance:** This residue is a **genuine question**. Reasons:  
         - It involves *modal claims* (e.g., "Corporations *must be* reducible") that aren’t about language but about dependence/emergence.  
         - It reflects a *metaphysical choice*: Should ontology prioritize fundamental physics (Group A) or explanatory pluralism (Group B)? This is substantive (e.g., debates in social ontology).  

    3. **Internal/External Distinction & Realism (10 min):**  
       - Ask: *"Was Group A describing the world 'as it is,' while Group B described 'how we talk'?"*  
       - **Map to concepts:**  
         - **Internal (Group B):** Existence tied to conceptual frameworks (domains of discourse).  
         - **External (Group A):** Existence as mind-independent fundamentality.  
         - **Realist move:** Argue Group A’s view has a claim to "getting the world right" because it seeks *what grounds everything else* (e.g., particles ground chairs, which ground corporations). But stress: Group B isn’t anti-realist—they see discourse as tracking real, non-fundamental patterns.  

  - **85–90 min: Conclusion (5 min)**  
    Summarize: *"Metaontology distinguishes verbal disputes (solvable by disambiguation) from substantive ones (about what grounds what). Today’s residue was substantive—it asks which ontological standard we *should* adopt, and why."*  

  ---

  ### **Predictable Pitfalls & Handling**  
  1. **"Just semantics" at minute 10:**  
     - **Handling:** If a student says this early, interject: *"Use your swap token now to test that hypothesis."* In debrief, emphasize the residue: *"If it were *just* semantics, the swap would resolve it. Did it?"*  

  2. **Dictionary use:**  
     - **Prevention:** Ban dictionaries upfront. If someone tries, say: *"We’re not arbitrating common usage—we’re testing philosophical criteria. Stick to your card."*  

  3. **Bullying into compromise:**  
     - **Handling:** If one group dominates, remind: *"Your goal isn’t consensus—it’s to expose disagreement. Use your swap token if you feel pressured."* In debrief, critique: *"Compromise hid the criteria clash—which is exactly what happens in real metaontology debates."*  

  4. **"Philosophy is pointless" aha:**  
     - **Handling:** Preempt in debrief: *"The residue shows philosophy’s point: deciding between criteria forces us to ask what *matters* in ontology (e.g., fundamentality vs. explanatory power). That’s not trivial—it shapes science, ethics, and law."* Give examples: Eliminating nations from ontology impacts political theory; accepting numbers enables mathematics.  

  5. **Group A/B misapplying criteria:**  
     - **Handling:** Trust the process. If groups fumble sorting, it reveals how hard applied metaontology is. Debrief: *"Did your criteria feel unnatural? That’s the point—we default to ambiguous meanings."*  

  ---

  ### **What the Format Can’t Do (Requires Your Input)**  
  - **Simulating depth of realist intuition:** Students may not *feel* why fundamentality matters. **Supply this:** In debrief, share a quote (e.g., Sider: "Ontology should carve nature at its joints") or an example ("Without fundamental particles, everything vanishes").  
  - **Historical context:** The activity abstracts from giants like Carnap (internal questions) vs. Quine (external). **Supply this:** Post-activity, briefly note how this maps to their debate.  
  - **Why residue isn’t preference:** The format shows the residue exists, but you must argue why it’s world-directed. **Use my reasons above** (modal claims, grounding relations).  

  This design forces students to *live* the ambiguity of "exists" and isolates the non-verbal core. The swap token is the linchpin—it transforms frustration into insight. Run it tightly, and the debrief will cement the metaontology problem as a tangible, substantive challenge.
