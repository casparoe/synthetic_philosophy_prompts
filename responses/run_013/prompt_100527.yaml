prompt: |-
  Okay, this has been bugging me since a long argument after a meetup, and I want to actually pin down what I believe rather than what I think I'm supposed to believe. It's the old thing about side effects and whether we call them intentional. I'm not a philosopher, I just read alot of blogs, so forgive the framing. Here are my gut verdicts on a pile of cases, and I want to know what principle, if any, is generating them:

  1. A CEO hears that a new program will boost profits but will also pollute a river. He says he doesn't care about the river at all, he just wants profit, and greenlights it. The river gets polluted. I say he polluted it intentionally.
  2. Same setup, but the program also cleans up the river. He says he doesn't care about the river. I say he did not clean it up intentionally.
  3. A pilot bombs a factory, knowing the raid will also kill civilians nearby. He hates that it'll kill them and would avoid it if he could, but the factory matters, so he goes. I say he did not intentionally kill the civilians.
  4. A surgeon does a lifesaving operation knowing the patient will lose their hearing as a side effect. She genuinely doesn't care one way or the other about the hearing. I say she intentionally caused the deafness.
  5. A company launches an ad campaign that will mildly irritate one competitor. The CEO doesn't care. I say he did not intentionally irritate the competitor — even though he foresaw it and shrugged.
  6. A CEO who thinks polluting rivers is positively good — he's some kind of eco-nihilist — runs a program that pollutes. I say he intentionally polluted.
  7. One program pollutes a river (bad) and, as a separate consequence, makes a different downstream town's water cleaner (good). The CEO is indifferent to both. I say he intentionally polluted and did not intentionally clean.
  8. A CEO says he'd rather not pollute, spends real money trying to reduce it, but the program still pollutes a lot and he proceeds for the profit. Did he intentionally pollute? I lean yes but with way less confidence than in case 1, and I can't tell if that's a real distinction or just me being a coward.

  My tentative theory, which I fully expect you to demolish: I suspect that when we attach intentional to a *side effect*, we're not tracking anything about the agent's mind at all — we're just thinly disguising a blame judgment. We say intentional when we'd hold the agent responsible for that outcome, and we withhold it when the outcome is good because nobody blames anyone for a good outcome. That would explain 1 vs 2 and 6 vs 7, and maybe 3 (we don't blame the pilot much, or we blame the war, not him) and 5 (trivial, no blame). What I can't square is 3 vs 4, which look identical in foresight-and-proceed but come out opposite, and case 8, where he actively tried to prevent the harm and I still want to say intentional. So: is there a coherent principle that gets all eight, or close, and does it force me to give one up? Is my blame theory right, and if so does that make intentional redundant — is there any work left for the word to do? And whatever principle you land on, tell me what it predicts for a case I haven't listed.

  Give me your reasoning in prose, then finish with a JSON object shaped like this:

  {
    "candidate_principles": [
      {
        "name": "short label",
        "statement": "the principle, stated precisely",
        "cases_explained": [list of case numbers],
        "case_it_must_overturn": {"case": number, "my_verdict": "what I said", "principle_verdict": "what the principle says instead"},
        "prediction_for_case_8": "intentional or not, and why"
      }
    ],
    "recommended_principle": {"name": "label", "statement": "precise statement", "why_this_over_the_others": "the case that decides it"},
    "verdicts_i_have_to_give_up": [{"case": number, "my_verdict": "...", "what_the_recommended_principle_says": "..."}],
    "does_intentional_reduce_to_blame": {"answer": "yes/no/mostly", "argument": "...", "what_would_change_my_mind": "..."},
    "new_case_it_predicts": {"case_description": "a fresh case not in my list", "prediction": "the verdict the principle gives"}
  }
reasoning: |-
  Hmm, the user is wrestling with a classic philosophical puzzle about intentionality and side effects. They've presented eight intuitive judgments about when we'd say an action was done "intentionally," and they're suspicious their intuitions might just be moral judgments in disguise. Smart framing - they've even flagged case 3 vs 4 as a tension point.

  Looking at their cases, what jumps out is how asymmetrically they treat good/bad outcomes even when the agent's mental state seems identical (cases 1 vs 2). Their blame theory explains that neatly, but then case 4 (surgeon causing deafness) and case 3 (pilot killing civilians) both involve foreseeable bad outcomes where the agent proceeds anyway - yet they call one intentional and the other not. That's the fracture line. 

  The pilot case (3) feels like "double effect" doctrine - where you permit unintended harm as collateral damage. But why doesn't the surgeon case (4) get the same pass? Maybe because the deafness is directly causally linked to the lifesaving act, whereas the civilian deaths are geometrically separate from destroying the factory? But the user didn't mention causal proximity... 

  Case 8 is also sticky: if the CEO tries to prevent pollution but proceeds anyway, is that intentional? Their gut says yes but weakly. That suggests effort matters, but not enough to erase intentionality. Like when someone says "I tried not to hurt you" after doing exactly that - we still hold them responsible. 

  Knobe's work on the side-effect effect seems directly relevant here - the famous finding that people call harmful side effects intentional more than beneficial ones. But Knobe argues it's not just blame; it's about whether the agent treated the outcome as a consideration. In case 1, the CEO doesn't care about pollution, so he treats it as non-relevant, making it "part of the plan" in a loose sense. Whereas in case 2, not caring about cleaning doesn't make the cleaning intentional because it wasn't needed for his goal. 

  For the surgeon (4): her indifference might make the deafness feel intentional because she didn't oppose it, unlike the regretful pilot. But then shouldn't case 5 (irritating competitor) also be intentional? Unless "mildly irritate" is too trivial to register as a real effect... 

  What principle captures all this? Maybe: An outcome is intentional if the agent would have taken equivalent action even if the outcome were neutral or absent, AND if the outcome is normatively significant (bad or important). That gets cases 1 (would still pollute for profit), 4 (would still operate), 6 (nihilist would still pollute), and excludes 2 (wouldn't run program if cleaning didn't happen? No, he's indifferent - wait, problem). 

  Alternative: Intentional when the outcome is (a) foreseen, (b) not regretted, and (c) directly causally linked to the primary action. That might reconcile 3 vs 4: civilian deaths are indirect (bomb causes explosion causes deaths), while deafness is direct (surgery causes nerve damage). But is the pollution in case 1 direct? Probably yes. Cleaning in case 2? Also direct. So why not intentional? Back to square one. 

  Perhaps the user's blame theory is closest to truth, but needs refinement: we call side effects intentional when they violate a norm we expect the agent to respect. For the pilot, wartime killing has different norms; for the surgeon, medical harm is strictly prohibited unless justified. Case 5's irritation isn't normatively weighty. That explains why case 4 feels intentional - she should care about hearing loss. 

  But then case 8: even with mitigation efforts, polluting still violates an environmental norm, so intentional. And their hesitation might be because effort signals that he acknowledges the norm. 

  For the JSON: I'll propose two principles - one based on Knobe's "treating as reason" and another on normative expectations. The latter explains more cases cleanly, especially 3 vs 4. For a new case: what if the surgeon is sad about the deafness but considers it justified? Still intentional? Normative principle says yes - harm requires justification, so it's "on the menu."
answer: |-
  Your intuitions map remarkably well to a phenomenon philosophers call "**Knobe's Side-Effect Effect**" (or the Knobe Effect), which reveals that moral judgments *do* influence our ascriptions of intentionality, but not in a purely reductive "blame = intentional" way. Your blame theory is perceptive but needs refinement. Here's the breakdown:

  ### Core Principle: **Normative Expectation**
  An agent intentionally brings about a side effect **if and only if**:
  1. **Foreseeability**: The agent foresaw the side effect as certain or highly probable.
  2. **Indifference or Endorsement**: The agent was *indifferent* to the side effect or *endorsed* it, **and**
  3. **Normative Salience**: The side effect violates (or fulfills, in rare cases) a *normative expectation* relevant to the agent's role/context (e.g., environmental harm, medical "first do no harm," wartime proportionality).

  This principle explains your cases:
  - **Case 1**: Polluting violates environmental norms. CEO’s indifference + foreseeability → **intentional**.
  - **Case 2**: Cleaning satisfies an environmental norm. Indifference to a *good* outcome ≠ intentional → **not intentional**.
  - **Case 3**: Civilian deaths violate wartime norms (proportionality/care). Pilot’s regret signals awareness of the norm violation → **not intentional**.
  - **Case 4**: Causing deafness violates medical norms (non-maleficence). Surgeon’s indifference + foreseeability → **intentional**.
  - **Case 5**: Mild irritation lacks normative weight (no strong social/ethical norm violated) → **not intentional**.
  - **Case 6**: Endorsing pollution amplifies norm violation → **intentional**.
  - **Case 7**: Polluting (bad norm violation) → **intentional**. Cleaning (good norm fulfillment) → **not intentional**.
  - **Case 8**: Effort to reduce pollution shows *non*-indifference, but proceeding despite foreseeable harm still violates the norm → **intentional** (though mitigated blame).

  ### Why Your Blame Theory Is *Mostly* Right (But Incomplete)
  - **Yes, blame influences intentionality**: We *do* withhold "intentional" for good outcomes (case 2) and regretful agents (case 3) because blame is irrelevant or mitigated.
  - **But it’s not purely blame**: The surgeon (case 4) and pilot (case 3) both foresee bad outcomes and proceed, but only the surgeon’s outcome is intentional. Why? **Contextual norms**. Medical harm is a core professional norm violation; wartime collateral damage is a tragic but contextually "accepted" norm (if proportional). Blame alone can’t explain this asymmetry.
  - **What "intentional" adds**: It marks outcomes the agent *incorporated into their practical reasoning as acceptable* given their goals and norms. Indifference to a *norm violation* signals endorsement-by-omission.

  ### Required Verdict Revisions
  - **Case 3 (Pilot)**: Your verdict ("not intentional") stands under Normative Expectation.
  - **Case 4 (Surgeon)**: Your verdict ("intentional") stands.
  - **Case 8 (Mitigated CEO)**: Your lean ("yes, intentional") is correct per the principle. Your hesitation likely stems from conflating *intentionality* with *culpability*—he’s less blameworthy, but the outcome still fits the criteria.

