  **Key Insight**: Your intuitions reveal that "intentional" isn’t just about psychology (foresight + desire) or morality (blame) alone—it’s a hybrid judgment where we hold agents responsible for *foreseeably accepting norm violations* in pursuit of their goals. This preserves a role for "intentional" distinct from blame (e.g., Case 8 is intentional but less blameworthy), while explaining why we’re harsher on CEOs than surgeons or pilots.
