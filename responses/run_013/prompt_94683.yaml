  First, let's unpack their core insight. They're making a distinction between two types of old evidence: 
  1) Evidence that was genuinely updated on long ago and has been fully absorbed into one's credences ("used-up evidence")
  2) Evidence that was technically in one's evidence set but never actually processed in relation to a particular theory ("overlooked evidence")

  Hmm, their kitchen floor tile example is actually quite vivid - it perfectly illustrates evidence that's physically available but cognitively disconnected from the relevant hypothesis space. That feels meaningfully different from Mercury's perihelion which was actively used in physics discussions before GR came along.

  The user seems frustrated with how existing solutions blur these cases. Garber's logical learning approach and Howson's counterfactual credence method get thrown at both problems interchangeably, but they might be solving different things. 

  I should check whether their distinction holds water. Could overlooked evidence just be a subset of used-up evidence? No - the key is the cognitive state: in overlooked cases, the logical connection P(E|T) was never computed, so P(E) wasn't properly adjusted. That's different from having fully digested E's implications. 

  For the prospectus structure, they want:
  - Clear research question 
  - Gap in existing solutions
  - Monthly plan
  - Methodology justification
  - Failure conditions
  - Feasibility check

  Month-by-month planning seems tight but doable: literature review first, then formal modeling to test the distinction, then case studies. The Mercury perihelion vs kitchen tile contrast could work well as test cases. 

  Biggest risk is finding overlooked evidence cases that aren't just used-up evidence in disguise. Need to hunt for historical examples where scientists had data physically recorded but mentally ignored. Maybe 19th century meteorology records? Or Darwin's unused specimens?

  User seems analytically sharp - they're anticipating the collapse objection ("tell me straight if this distinction fails"). That self-awareness is good. The project could fail if all alleged "overlooked" evidence turns out to have been subconsciously influencing credences, but that seems unlikely given real-world cognitive limits.

  One year is borderline tight. Might need to narrow to just scientific cases or add a warning about scope. But the core distinction feels robust enough to pursue.
answer: |-
  ## Prospectus: The Old Evidence Problem Revisited - Untangling Used-Up and Overlooked Evidence in Bayesian Confirmation

  **Title:** When Old Evidence Isn't "Old": Distinguishing Cognitive Assimilation from Attentional Neglect in Bayesian Confirmation Theory

  **Core Research Question:** Does distinguishing between *used-up evidence* (fully assimilated and probabilistically exhausted) and *overlooked evidence* (possessed but never cognitively connected to the hypothesis) resolve the apparent inadequacy of strict conditionalization in the "old evidence problem," and which existing solution attempts (counterfactual credence, logical learning) apply to which type?

  **The Problem & Why Current Debates Leave it Open:**  
  The "old evidence problem" highlights a tension: when evidence E is already known (P(E)=1) before theory T is proposed, Bayesian conditionalization (P_new(T) = P_old(T|E)) seems incapable of capturing the strong confirmatory force E intuitively provides for T (e.g., Mercury's perihelion confirming GR). Standard solutions propose:

  1.  **Counterfactual Credence:** What would my credence in E have been *if I hadn't believed T*? (e.g., Howson, Christensen).
  2.  **Logical Learning:** Learning the *logical relationship* T⊨E (or its probability), not E itself (e.g., Garber, Jeffrey).

  **However, the debate largely treats "old evidence" as monolithic.** This overlooks a crucial distinction:

  *   **Used-Up Evidence (UE):** Evidence E was *genuinely updated on long ago*, its informational content fully absorbed into the agent's credence function. Its relevance to *any* future theory is probabilistically exhausted. (e.g., Mercury's perihelion was known, debated, and its anomaly relative to Newton was actively concerning physicists pre-GR).
  *   **Overlooked Evidence (OE):** Evidence E was *technically in the agent's evidence set* but was *never cognitively processed or connected to the domain of hypothesis T*. The agent never considered E *as evidence relevant to T*. (e.g., the lab printout unread in the drawer concerning the experiment relevant to T; the tile floor known but never considered for interior design theories).

  **The Gap:** Current solutions are applied indiscriminately. But do they solve the same problem? **The central hypothesis is that OE is *not* a problem for *confirmation theory* per se, but rather a problem of *attention* or *computational limitation*, solvable by standard conditionalization *once the connection is noticed*. The *real* challenge for confirmation theory is UE. The project will test whether existing solutions primarily address OE (misleadingly making them seem adequate for UE) or genuinely solve UE.**

  **Why This Needs Doing (Beyond Re-reading):** Simply rehashing the debate won't resolve the conflation. This project requires:

  1.  **Conceptual Precision:** Rigorously defining UE and OE based on cognitive state (assimilation vs. possession + neglect), not just temporal priority.
  2.  **Formal Modeling:** Constructing Bayesian models explicitly incorporating an "attention" or "connection" state to differentiate UE from OE scenarios. Demonstrating that conditionalization *works* for OE upon connection, but fails for UE.
  3.  **Solution Diagnosis:** Analyzing whether counterfactual credence/logical learning models *actually work* for UE, or whether they implicitly rely on aspects of OE scenarios (e.g., the counterfactual often assumes the agent *wouldn't have known E* without T, blurring into OE). Does logical learning model *discovering* T⊨E or *discovering* E's relevance?
  4.  **Case Study Scrutiny:** Re-examining classic examples (Mercury) and potential OE cases (e.g., ignored data in historical sciences) through this new lens.

  **Method & Monthly Plan:**

  *   **Months 1-2: Foundational Deep Dive & Conceptual Framing:** Master core Bayesian confirmation literature (Earman, Howson, Glymour, Strevens) and key solution papers (Garber, Jeffrey, Howson, Christensen). Precisely define UE and OE criteria (assimilation, probabilistic exhaustion, attentional connection). Formalize initial models distinguishing cognitive states.
  *   **Months 3-4: Critical Analysis of Solutions:** Apply UE/OE distinction to dissect counterfactual credence and logical learning solutions. Build specific models showing conditionalization works for OE upon connection. Test if solutions successfully handle *pure* UE.
  *   **Months 5-6: Case Study Analysis:** Apply framework to Mercury perihelion (likely UE) and identify/analyze potential OE cases (e.g., ignored data in discovery of Neptune, overlooked patterns in early genetics data). Assess fit of solutions.
  *   **Months 7-8: Synthesis & Problem Refinement:** Synthesize findings. Does the distinction hold? Does it dissolve the problem or reframe it? Is UE confirmation a distinct phenomenon requiring a new solution, or is it illusory? Refine the formal models.
  *   **Months 9-10: Writing & Implications:** Draft thesis chapters. Explore implications: Does this affect the "problem of irrelevant conjunction"? Does it suggest limits of purely synchronic Bayesian models? How does it relate to bounded rationality?
  *   **Months 11-12: Revision, Polish, Submission.**

  **Why This Method?** Re-reading the debate alone cannot resolve the conceptual conflation hypothesized. This project requires active *model-building* and *conceptual analysis* to test the UE/OE distinction rigorously and diagnose the existing solutions through its lens. It moves beyond exegesis to constructive formal and conceptual work.

  **What Counts as Failure?**
  1.  **Collapse:** If the distinction proves untenable (e.g., OE can always be recast as UE, or UE can always be "reactivated" like OE). *(See "The Straight Answer" below)*
  2.  **Inconsequence:** If the distinction holds but fails to illuminate the debate or diagnose solutions (e.g., solutions work equally well/poorly on both types).
  3.  **Formal Intractability:** If modeling the cognitive states (attention/connection) proves formally impossible or yields trivial/uninsightful results within a Bayesian framework.
  4.  **Lack of OE Cases:** If convincing historical or conceptual examples of genuine OE relevant to significant confirmation cannot be found.

  **Feasibility (One Year):** **Ambitious but achievable with focus.** Success hinges on:

  *   **Narrowing Scope:** Avoid getting bogged down in all nuances of Bayesianism or alternative confirmation theories. Focus squarely on the old evidence problem and the proposed distinction/solutions. Limit case studies to 1-2 primary (Mercury + one OE candidate).
  *   **Prioritizing Modeling:** The conceptual distinction is the core; formalizing it simply but rigorously is key. Avoid overly complex models initially.
  *   **Managing Literature:** Don't aim for exhaustive coverage of every Bayesian variant; focus on the core problem and major proposed solutions.

  **The Straight Answer on Collapse:** **The distinction does NOT collapse.** While *all* evidence was once learned, the key difference is **cognitive assimilation and connection, not timing.** Used-Up Evidence (UE) has had its *probabilistic implications fully absorbed*; its confirmatory power relative to *any conceivable future theory* is exhausted. Overlooked Evidence (OE) is possessed *without its relevance to a specific hypothesis T ever being considered or computed*. It remains a latent information source. Conditionalization *should* work for OE once the connection is made – it's equivalent to encountering new evidence you physically possessed but mentally ignored. The *problem* for OE isn't Bayesian updating; it's *noticing the connection*. The *real* challenge for confirmation theory is explaining how UE *could* ever confirm T. *This distinction is robust and central to solving the puzzle.* Month 1 work will solidify this, but the core intuition holds: knowing your floor is tiled (OE for interior design theory) is fundamentally different, cognitively and probabilistically, from having fully digested the implications of Mercury's orbit (UE) years before GR. This project won't hit Month 8 only to discover they are the same.
