  ### MEMORANDUM  
  **TO**: Foundation Board Members  
  **FROM**: [Your Name], Board Member  
  **DATE**: [Current Date]  
  **SUBJECT**: Decision on Comparative Severity Index (CSI) for Grant Allocation  

  #### **Background**  
  Program staff propose allocating the next grant round using a Comparative Severity Index (CSI), scoring cases 0–10 across five dimensions (scale, intent, dehumanization, systematicity, denial of victim agency), averaging scores into a cardinal index, and distributing funds proportionally. A "non-comparability clause" exempts cases exceeding thresholds on intent/dehumanization into a top tier. Four cases are under consideration: genocide, mass famine, forced displacement, and mass detention/killing.  

  #### **Recommendation**  
  **Adopt the CSI with binding conditions**, effective only after a 90-day revision period. Staff must present a revised framework by **October 15** for board approval. Until then, allocate the current round’s budget **equally** (25% per case) to avoid delayed relief. If revisions are unsatisfactory, the CSI will be scrapped.  

  #### **Core Objections and Required Revisions**  
  1. **Moral Obscenity of Ranking Incommensurable Harms**  
     - **Objection**: Reducing distinct atrocities (e.g., famine vs. genocide) to a single number falsely implies commensurability. This risks moral reductionism, obscuring unique victim experiences and compounding harm by instrumentalizing suffering.  
     - **Revision Mandate**: Replace ranked proportionality with **tiered allocation**. Group cases into "high," "medium," and "low" severity tiers (based on dimension thresholds), funding all in higher tiers fully before lower ones. *Deadline: October 15*.  

  2. **Invalid Aggregation of Ordinal Data**  
     - **Objection**: The physics analogy **holds unequivocally**. Dimensions like "intent" or "dehumanization" are ordinal (rank-order) scales without measurable intervals or a true zero point. Averaging them into a cardinal index is statistically invalid—akin to averaging phone area codes. This produces arbitrary rankings.  
     - **Revision Mandate**: Replace averaging with **non-aggregative thresholds**. Define severity tiers using logical rules (e.g., "high severity" = scores ≥8 on intent AND dehumanization). *Deadline: October 15*.  

  3. **Non-Comparability Clause Insufficiency**  
     - **Objection**: The clause only exempts cases high on intent/dehumanization, ignoring other dimensions (e.g., systematicity in famines). This could exclude "incomparable" cases that fall outside these parameters.  
     - **Revision Mandate**: Broaden exemptions to cases scoring ≥8 on **any three dimensions**. Fund these fully, outside tiered allocation. *Deadline: October 15*.  

  #### **Critical Timeline**  
  - **September 30**: Staff circulate draft revisions addressing above points.  
  - **October 10**: Board feedback due.  
  - **October 15**: Final revised framework submitted.  
  - **October 20**: Board vote on revised CSI.  
  - **Interim Action**: Allocate current round funds equally by **September 30**.  

  #### **Conclusion**  
  The CSI’s goal of structured fairness is laudable, but its current form risks methodological incoherence and moral injury. The proposed revisions prioritize rigor and ethical humility by rejecting false precision and respecting incommensurability. I urge the board to endorse this path.  

