  **Joke:**  
  Why did the incoherent weather forecaster get fired?  
  Because no matter *if* it rained or not, there was always some other prediction that was better... even when his was right!  
  *(Punchline hinges on the dominance argument: incoherent credences are always accuracy-dominated by a coherent alternative in every possible world, so even being "accidentally" correct doesn’t save you.)*  

  **Explanation for friends (if needed):**  
  It’s riffing on how accuracy-first epistemology says if your beliefs violate probability rules, there’s *always* a rival set that’s more accurate no matter how reality turns out—even if you luck out and guess right.
