prompt: |-
  I am reconstructing, for a graduate seminar on well-being, an argument that a student produced in response to the heterogeneity problem for hedonism. I put it on the board, invited objections, and found I had none I believed. It runs as follows.

  (1) Hedonism is a substantive thesis about well-being only if "pleasure" names a single property — one thing that all and only pleasures have in common; call this the one-tone assumption. Otherwise "maximize pleasure" is either an ill-formed injunction or a list of goods in disguise, with no unifying rationale.

  (2) Whatever that property is, it must be either phenomenal (a felt quality present in every pleasure) or non-phenomenal (being liked or desired, or occupying some functional role).

  (3) It is not phenomenal. Set side by side the pleasure of a hot bath, the pleasure of finally seeing the point of a proof, the pleasure of a joke landing, and the pleasure of a headache easing — the last of which appears to be a subtraction and nothing more. Nothing is felt in common across all four, and for every candidate quality there is a pleasure that lacks it. A hot bath can even be pleasant in one respect and scalding in another at once.

  (4) Nor is it non-phenomenal. If pleasures are unified by being liked or wanted, what unifies them lies in the subject's attitudes rather than in the experiences; and we like these experiences because they are pleasant, so the account reverses the order of explanation. Cashing out the attitude without appeal to pleasure or well-being is either circular or changes the subject.

  (5) So no property is shared by all and only pleasures.

  (6) By (1), hedonism is therefore not a substantive thesis about well-being.

  (7) The reasoning generalizes: emotions, memories, and beliefs are as heterogeneous as pleasures, so (5) and (6) prove there are no such kinds either. The student took this as confirmation — pleasure is one more pretend kind — but I cannot have it. I am no more prepared to say there are no emotions than to say "the absence of pain" is empty.

  I am attached to (1) and to (3) in roughly equal measure, which is why I am stuck. So tell me which step to give up, why it looked fine, and what giving it up costs. If you reject the one-tone assumption, say what unifies pleasures instead and why that is not a list with a label stuck on it; if you keep it, say what the shared quality is and how it survives the relief case and the mixed cases. You are a philosopher working on well-being and the metaphysics of mind: think the problem through carefully before you answer, then take a definite position rather than laying out the options for me to choose from. No citations are needed — I want the argument, not the literature — and I would rather have your honest confidence than a hedge.
reasoning: |-
  Okay, the user is reconstructing a student's argument against hedonism's heterogeneity problem for a graduate seminar. They're stuck between steps (1) and (3) and want me to choose a definite position. Let me break this down.

  First, the student's argument hinges on the one-tone assumption in (1): that hedonism requires a single shared property in all pleasures. The user is attached to both (1) and (3). Step (3) argues against a phenomenal property, giving examples like a hot bath (mixed sensations) and headache relief (absence of pain). Step (4) rejects non-phenomenal properties like being desired, claiming reverse explanation. So (5) concludes no shared property, thus hedonism fails by (1).

  But the user rejects the generalization in (7) that emotions, memories, etc., aren't real kinds. That's a clue. They think pleasure should be a legitimate kind, like emotions. So they're torn—accepting (1) and (3) leads to denying pleasure as a kind, but they can't accept that for other mental states. 

  I need to challenge step (4). Why? Because step (4) dismisses non-phenomenal unity too quickly. The student assumes that "being liked" leads to circularity: we like pleasures because they're pleasant. But what if the attitude isn't about pleasure but about the experience itself? Desiring an experience for its felt qualities isn't circular if "pleasant" just means "liked for its feel." The user mentioned relief being just absence of pain. But absence of pain can be liked intrinsically—that's the relief. So the non-phenomenal approach can work without circularity. 

  The user's deeper need: they want to preserve hedonism as substantive but can't find the unifying property. If I defend a non-phenomenal unity, say "intrinsically desired for its felt character," that avoids the list problem. It's not just a label because the desire is directed at the experience's phenomenal aspects, even if those aspects vary. This keeps hedonism intact without denying pleasure as a kind. 

  Costs? Some might say this makes hedonism desire-based. But the user might accept that if desires are tied to experiences. It's still a form of experientialism. Also, mixed cases (like hot bath) aren't problematic—one can desire the warmth despite the scalding, focusing on different aspects. 

  Rejecting (4) saves (1) and addresses the user's attachment to real kinds like emotions, which also lack a single phenomenal quality but are unified by functional roles or attitudes. That resolves their tension without collapsing other mental states.
answer: |-
  Reject step (4). The non-phenomenal account *can* unify pleasures without circularity or changing the subject. Here’s why it looked compelling, why it fails, and what the cost is.

  **Why (4) looked fine:**  
  The student assumes that "being liked/wanted" makes attitudes explanatorily prior to pleasure, reversing the natural order: we like experiences *because* they’re pleasant. If "pleasant" just *means* "liked," the account seems circular or reduces pleasure to a disjunctive list of liked states with no common thread. Further, cashing out "liking" without reference to pleasure feels impossible—as if we’re smuggling in pleasure through the back door.

  **Why (4) is wrong:**  
  The circularity vanishes if we distinguish between:  
  - **The attitude of liking (desiring, etc.)** directed at an experience *for its felt character*.  
  - **The property of being pleasant**, which *is* the property of being the object of that attitude *in virtue of its phenomenology*.  

  Pleasures are unified by the relational property: *being intrinsically desired (or liked) by the subject, during its occurrence, specifically for its phenomenal character*. Crucially:  
  - This isn’t circular because "desired for its phenomenal character" doesn’t reference pleasure. You can desire the *feel* of warmth without judging it "pleasant."  
  - It explains the order: you desire the bath’s warmth *because* of its specific feel (phenomenal quality), but what makes it *pleasure* is that you desire it *for that feel*.  
  - It handles all cases:  
    - **Relief (headache easing):** You desire the *absence* of the pain-feeling *for its felt character* (e.g., the quiet neutrality replacing throbbing).  
    - **Mixed cases (hot bath):** You desire the enveloping warmth *for its feel* while disliking the scalding sensation *for its feel*. One aspect is pleasant, the other isn’t.  
    - **Cognitive/joke pleasures:** You desire the "aha!" feeling or the burst of mirth *for how it feels*.  

  **What unifies pleasures (without a list):**  
  Pleasures share a *functional role*: they are experiences that, *by virtue of their phenomenal properties*, motivate continuation and intrinsic attraction during their occurrence. This isn’t a "list with a label" because:  
  - The unity is *relational* and *dispositional*: all pleasures *reliably elicit* this motivational response *in virtue of their phenomenology*.  
  - Phenomenal heterogeneity is no obstacle. Warmth, intellectual clarity, and relief feel different, but each can intrinsically motivate pursuit/continuation due to its specific feel. The "one thing" shared isn’t a felt quality but a *role* played by diverse feels.  

  **Costs of rejecting (4):**  
  1. **Hedonism becomes (mildly) non-phenomenal.** Pleasure is defined partly by its motivational relation to phenomenology, not pure feel. This distances it from classical introspective hedonism.  
  2. **The metaphysics is more complex.** Pleasure is a response-dependent property: an experience is pleasant iff its subject is disposed to desire it for its feel. Some will argue this reduces pleasure to desire.  
  3. **It demands a stance on attitudes.** You must accept that "desiring for its feel" is conceptually primitive—not definable via pleasure or well-being.  

  **Why keep (1) and (3)?**  
  - **(1)** holds: Hedonism remains substantive—it claims well-being *just is* maximizing experiences with this motivational role.  
  - **(3)** stands: No *phenomenal* unity is needed. The "hot bath" problem dissolves—you desire one aspect for its feel, not the other. Relief is desired for its feel (absence-of-pain *is* a positive phenomenological character when contrasted).  

  **Your deeper conflict resolved:**  
  Pleasure, like emotion or belief, is a natural kind unified by function, not phenomenology. Beliefs vary wildly (e.g., "2+2=4" vs. existential dread) but share a motivational/conceptual role. So too with pleasure: it’s a real kind, hedonism survives, and the heterogeneity problem is defanged.  

  **Final position:**  
  Reject (4). The non-phenomenal account works. Pleasure’s essence is motivational—an experience is pleasant iff its subject intrinsically desires its continuation *because of how it feels*. This preserves hedonism as substantive and answers all objections.
