prompt: |-
  I'm doing a feature for a science mag about where the line for animal consciousness should be drawn, and next week I've got a philosopher on the phone who's spent years defending what she calls the wiring-speed criterion: a creature counts as conscious only if it has neural tissue that can hold a state long enough to broadcast it across distant regions — a few hundred milliseconds of the stuff, not fast reflex loops. On her line octopuses and crabs are in, fish and insects are out. Can you draft me 8-10 interview questions that get past her just restating it? I want at least one on the size problem (a fruit fly's whole brain is roughly 140,000 neurons — does that rule flies out, or does it just show the criterion is a size proxy in disguise?), one on wether slow wiring is really a fact about consciousness or only about the kind of memory you can test in a lab, and one on convergence (if consciousness earns its keep, why would evolution only bother building it in the lineages that happen to have slow wiring?). For each of those, give me the follow-up that still works once she gives her standard reply. Then work in a few others: whether a threshold criterion even makes sense for a trait that looks continuous; what she does with crows, who cache and plan and seem to keep score without anything like the wiring she's asking for; what would actually change her mind, and please don't let the answer be more data; and one on the practical fallout — her line spares the octopus and lets us boil shrimp by the ton, so how does she square a switch with the idea that what's at stake is a degree of moral risk? One warning: she's a good sport but she rolls her eyes at the heckle that you can't get consciousness from behaviour, so if you want to press the evidence problem, do it through her own criterion rather than from outside it.
reasoning: |-
  Okay, the user is a science journalist preparing an interview with a philosopher who advocates for the "wiring-speed criterion" for animal consciousness. They need 8-10 sharp questions that move beyond restating her theory, with specific requirements about the size problem, wiring as consciousness vs testable memory, evolutionary convergence, and several other angles including morality.  

  First, let's unpack the core challenge: This philosopher has a well-rehearsed position, so questions must force new ground. The user flagged three mandatory topics—each needing a follow-up that persists after her predictable reply.  

  For the size problem: The key tension is whether her criterion secretly proxies for brain size. Follow-up should target whether she conflates mechanism (slow wiring) with structural requirement (bulk neurons).  

  For wiring vs consciousness: Must challenge if she's mistaking measurable neural persistence for subjective experience. Follow-up needs to press why temporal duration equals phenomenology.  

  For convergence: If consciousness is adaptive, why tie it to one neural implementation? Follow-up should question if her view implies consciousness is an evolutionary accident in slow-wired lineages.  

  Other angles:  
  - Threshold vs continuum: How does she defend a binary switch when cognition scales gradually?  
  - Crows: They exhibit complex cognition without her required wiring—does this falsify her model?  
  - Evidence: Since she dismisses behavioral arguments, use her own framework to ask how we'd detect consciousness in a hypothetical slow-wired alien.  
  - Morality: Her criterion draws sharp ethical lines (e.g., boiling shrimp). Follow-up must confront the moral weight of a threshold.  

  User also wants to avoid her eye-roll trigger ("can't infer consciousness from behavior"), so evidence challenges must route through her criterion.  

  Structure:  
  Lead with grounding questions (1-2), then hit the three required topics (3-5), pivot to crows (6), continuum problem (7), evidence within her framework (8), morality (9), and what would change her mind (10). Each priority topic gets a follow-up designed to survive her boilerplate response.  

  Phrasing: Questions should be open but incisive, quoting her terms ("broadcast," "hold state"). Avoid jargon; emphasize contradictions (e.g., crows vs wiring, evolution vs single solution).  

  Morality angle is critical—it raises stakes beyond theory. Frame it as reconciling a neural switch with moral risk gradients. Follow-up must resist letting her retreat to "more data needed."
answer: |-
  Here are 10 interview questions designed to push beyond restating the wiring-speed criterion, incorporating your specific requests and anticipating her responses. Each "priority" question includes a follow-up engineered to persist after her likely initial answer.

  **Core Questions & Engineered Follow-Ups:**

  1.  **Grounding the Mechanism:** "You argue consciousness requires neural tissue capable of sustaining a state for 'a few hundred milliseconds' to broadcast it widely. Could you elaborate on the *specific* causal link between this sustained broadcasting and the emergence of subjective experience? What is it about this temporal window that you believe *constitutes* consciousness, rather than just enabling a specific type of information integration?"  
      *   *(If she focuses on integration/global workspace):* **Follow-up:** "If the core requirement is integration over time, why rule out systems achieving similar functional integration through massively parallel, fast-but-short connections that collectively create persistence, even if individual loops are rapid? Couldn't that also 'broadcast' information?"

  2.  **The Size Problem / Proxy Question:** "The fruit fly brain has ~140,000 neurons. Its synaptic transmission and reflexes are extremely fast. Does this automatically rule it out under your criterion? Or does this force us to ask whether the 'few hundred millisecond' requirement is fundamentally a *size* or *complexity* constraint in disguise – needing enough neurons/connections to physically sustain that duration – rather than speed *itself* being the key factor?"  
      *   *(If she insists it's the duration itself, not size):* **Follow-up:** "If a hypothetical micro-organism evolved with neurons physically incapable of holding a state longer than 100ms due to fundamental biophysics, but possessed staggering complexity otherwise, would it be definitively non-conscious? Doesn't the requirement inherently favor larger brains simply because they *can* physically sustain longer states?"

  3.  **Wiring Speed vs. Measurable Memory:** "Your criterion relies on measurable neural persistence. Could this persistence be necessary primarily for the *kind of working memory* we can easily test in lab paradigms (like delayed match-to-sample), rather than being the *sine qua non* of subjective experience itself? How do you distinguish the neural signature of 'holding information online' for cognitive tasks from the neural signature of 'what it feels like'?"  
      *   *(If she links persistence to phenomenology/access):* **Follow-Up:** "Couldn't a system possess fleeting, fragmented moments of subjective experience ('phenomenality') without the sustained broadcasting required for reportable access or complex working memory? Is your criterion potentially conflating *access consciousness* with the broader possibility of *phenomenal consciousness*?"

  4.  **The Convergence Problem (Evolutionary Why):** "If consciousness confers a significant adaptive advantage – solving novel problems, flexible planning, unified perception – why would evolution only evolve it in lineages that *happened* to develop slow wiring? Isn't that a remarkably contingent constraint? Why wouldn't other architectures (like highly parallel processing in fast brains) converge on the same functional advantage, potentially with different neural implementations?"  
      *   *(If she argues slow wiring is uniquely suited/enables the necessary integration):* **Follow-Up:** "Doesn't that imply that the *specific biological implementation* (slow vertebrate/invertebrate neurons) is essential, not just the *functional* property of sustained integration? If so, does this mean consciousness, as you define it, is impossible in artificial systems or alien life forms with radically different, faster architectures, even if they exhibit complex, flexible cognition?"

  **Additional Critical Angles:**

  5.  **The Crow Paradox:** "Corvids like crows exhibit behaviors suggesting complex future planning, mental time travel, and social strategizing – hallmarks often associated with consciousness. Yet, avian brains, while complex, operate at much faster speeds than mammalian ones and may not rely on identical 'slow broadcasting' mechanisms. How does your criterion account for the apparent cognitive sophistication in crows without the specific vertebrate cortical wiring or duration you require? Does their existence challenge the necessity of your specific mechanism?"

  6.  **Threshold vs. Continuum:** "Consciousness, like intelligence or cognition, is often thought of as existing on a continuum. Your criterion draws a sharp line: creatures either have the required wiring speed/duration or they don't. How do you justify such a binary threshold for a phenomenon that intuitively seems gradational? Couldn't there be simpler forms of subjective experience that don't require full 'broadcasting'?"

  7.  **Evidence Within Her Framework:** "You're skeptical of inferring consciousness purely from behavior. But your criterion also relies on *measuring* a physical property (neural persistence duration). How do you bridge the gap between observing that physical measurement and concluding subjective experience exists? What is the *in-principle* evidence, within your framework, that would definitively confirm that sustained broadcasting *is* consciousness, rather than just its neural correlate?"

  8.  **The Morality of the Threshold:** "Your line has significant ethical implications: octopuses are 'in' (protected?), shrimp are 'out' (permissible to boil). But drawing such a sharp moral line based on a neural switch seems jarring next to the gradational nature of potential suffering. If we accept there's inherent moral risk in attributing consciousness, how do you reconcile the stark ethical consequences of a binary neural threshold with the possibility that consciousness (or capacity for suffering) might fade more gradually across species?"

  9.  **Changing Minds Beyond Data:** "You've defended this criterion for years. Beyond simply gathering more neural data on more species, what kind of *theoretical challenge* or *conceptual argument* could genuinely make you reconsider the wiring-speed requirement as the fundamental gatekeeper for consciousness? Is there a philosophical flaw or logical inconsistency someone could point out that would shake your position?"

  10. **Practical Definitions & Scope:** "Finally, for clarity in applying your criterion: When you say 'neural tissue,' does it strictly require biological neurons, or could advanced neuromorphic computing substrates qualify? And 'distant regions' – how distant relative to brain size? Does the *scale* of integration matter, or just the *duration*?"

  **Key Design Rationale:**

  *   **Avoids Behavior-Heckle:** Question 7 tackles the evidence issue *through* her criterion ("How do you know *this* physical state *is* consciousness?"), not by demanding behavioral proof she dismisses.
  *   **Targets Core Concepts:** Questions 1, 3, and 7 directly challenge the link between the *measured mechanism* (persistence) and the *target phenomenon* (subjective experience).
  *   **Evolutionary Pressure:** Question 4 (& F/U) forces her to confront whether consciousness is an inevitable evolutionary solution or contingent on one specific biological path.
  *   **Size/Proxy Challenge:** Question 2 (& F/U) directly addresses whether speed is fundamental or a side-effect of size/complexity.
  *   **Counter-Evidence:** Question 5 (Crows) presents a concrete challenge case.
  *   **Continuity Problem:** Question 6 challenges the binary nature.
  *   **Moral Weight:** Question 8 forces engagement with the real-world ethical consequences.
  *   **Falsifiability:** Question 9 pushes beyond "more data" to explore theoretical vulnerability.
  *   **Follow-Ups:** Designed to persist after initial answers by targeting underlying assumptions (function vs. implementation, access vs. phenomenality, contingency) or pushing implications to extremes (aliens, micro-organisms).

  This approach should encourage deeper philosophical engagement and reveal the underpinnings and potential vulnerabilities of her position, moving well beyond a simple restatement of the wiring-speed criterion. Good luck with the interview!
