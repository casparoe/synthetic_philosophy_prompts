prompt: |-
  Before we assess any particular answer to the boundary problem, I want the specification on the table. Set out the desiderata that any adequate theory of who belongs to the demos must meet, with the case or consideration behind each. Cover at least the following. The cases it must get right: the resident non-citizen who is governed by nearly every law but may not vote; the expatriate who may vote but is not governed; the outsider gravely affected by a polity's decisions, such as those displaced by its dam or breathing its emissions; children and others excluded from the franchise on grounds the theory must justify rather than assume; future people; and the secession referendum, where the choice of electorate may determine the outcome. The distinctions it must not collapse: being subject to a decision versus being affected by it; membership versus the franchise; the demos as author of a decision versus the demos as its object. The constraints it must respect: that every actual boundary is drawn by an act that already presupposes a demos; that a demos persists through the complete replacement of its members; that demoi are nested and overlapping, so the theory cannot assume a single body; and that most existing states would fail several plausible criteria, so it must say what follows. Add the requirement that the theory be determinately applicable by a body that must actually decide and give reasons, rather than returning that the answer depends on the demos.

  For each requirement, say why it is genuine rather than the prejudice of one camp. Then identify the pairs you judge cannot be jointly satisfied — I expect the all-affected and the all-subjected principles to founder here — and say which single requirement eliminates the most candidates. Close with a brief verdict on how territorial, all-affected, all-subjected and stakes-based accounts fare against the list; I do not need the survey in detail.
reasoning: |-
  Hmm, the user wants me to outline the desiderata for a theory of democratic boundaries. They've provided several specific cases the theory must handle: resident non-citizens governed but not voting, expatriates who vote but aren't governed, affected outsiders like those impacted by dams or emissions, children excluded from the franchise, future generations, and the tricky secession referendum problem.

  They also want me to include important distinctions that shouldn't be collapsed - like being subject versus affected, membership versus franchise, and demos as author versus object. Plus constraints like how boundaries are drawn by existing demoi, how demoi persist through membership changes, how they're nested/overlapping, and how most states would fail plausible criteria.

  For each requirement, I need to explain why it's genuine rather than just one camp's prejudice. Then I should identify which pairs can't be jointly satisfied (especially all-affected vs all-subjected), and determine which single requirement eliminates the most candidate theories. Finally, I'll briefly evaluate territorial, all-affected, all-subjected, and stakes-based accounts against this list.

  I'll need to be thorough but concise. For each requirement, I'll present the desideratum, the case or consideration behind it, and then explain why it's a genuine theoretical requirement rather than bias. The cases are quite diverse and cover real-world democratic tensions.

  The distinctions are crucial - collapsing subject/affected could lead to global democracy by default, while confusing membership/franchise might undermine democratic legitimacy. The constraints recognize practical realities: boundaries must be decidable by existing institutions, demoi change over time, and multiple demoi coexist.

  I suspect all-affected and all-subjected principles will conflict directly. All-affected might be too broad (including everyone affected by climate change), while all-subjected might be too narrow (excluding expatriates). The boundary-setting constraint (that boundaries presuppose a demos) might eliminate the most theories because it creates a circularity problem.

  For the verdict: territorial models are simple but fail on affected outsiders and expatriates. All-affected is overinclusive and indeterminate. All-subjected handles residents well but struggles with expatriates and future people. Stakes-based could be promising but lacks clear thresholds and institutional applicability.

  I'll structure this clearly: first the desiderata with cases, then distinctions, then constraints, each with justification. Then I'll discuss irreconcilable pairs, the most eliminative requirement, and finally the brief comparative verdict.
answer: |-
  Here is the specification of desiderata for a theory of the demos, grounded in cases and theoretical constraints, with justifications for their genuineness:

  **I. Cases Any Theory Must Get Right (with justification for genuineness):**
  1.  **Resident Non-Citizen:** Must explain why someone governed by nearly all laws (taxation, criminal, civil) yet denied the vote might *justifiably* be excluded *or* included. *Genuineness:* Core to democratic legitimacy – governing without consent requires strong justification; exclusion risks tyranny of the majority over a governed minority. Not just a liberal prejudice; even communitarians must justify why community membership excludes long-term residents.
  2.  **Expatriate Voter:** Must explain why someone no longer residing within the territory or subject to most laws may retain voting rights. *Genuineness:* Challenges the link between subjection and authorization. Reflects practical state practices (e.g., overseas voting) and notions of enduring political membership/national identity. Not just a nationalist prejudice; democrats must account for the persistence of political bonds.
  3.  **Gravely Affected Outsider:** Must address individuals/groups outside the polity suffering severe harm (displacement, pollution) from its decisions. *Genuineness:* Raises fundamental questions of justice and responsibility beyond borders. Ignoring this risks legitimizing harmful externalities ("beggar-thy-neighbor" policies). Not merely a cosmopolitan prejudice; real-world consequences demand normative scrutiny.
  4.  **Justified Exclusion (e.g., Children):** Must provide a non-circular justification for excluding specific groups (minors, cognitively impaired) from the franchise, not just assume it. *Genuineness:* Democratic equality is the default; exclusions need independent, non-arbitrary grounds (e.g., competence, interest). Avoids simply codifying existing prejudices or power structures.
  5.  **Future Generations:** Must account for the interests of those who will live with the long-term consequences of present decisions but cannot vote. *Genuineness:* Essential for intergenerational justice (e.g., climate, debt, nuclear waste). Their profound affectedness cannot be ignored without potentially catastrophic consequences. Not just an environmentalist concern; fundamental to collective survival.
  6.  **Secession Referendum:** Must grapple with the "boundary problem within the boundary problem": who decides the electorate for secession? *Genuineness:* Highlights the circularity and high stakes of boundary-setting. The choice of electorate often predetermines the outcome. A genuine test of a theory's coherence and applicability to foundational political moments.

  **II. Distinctions Any Theory Must Not Collapse (with justification for genuineness):**
  1.  **Subjected vs. Affected:** Must distinguish being legally bound/enforced against (subjected) from being causally impacted (affected). *Genuineness:* Collapsing them (e.g., making all affected subject) dissolves political boundaries entirely, making democracy administratively impossible and conceptually incoherent. Distinction is necessary for any bounded polity.
  2.  **Membership vs. Franchise:** Must distinguish belonging to the demos (having standing) from holding the specific right to vote. *Genuineness:* Allows for discussing partial membership (e.g., resident aliens with some rights) and justified exclusions (children). Collapsing them denies nuance and makes justified exclusion conceptually impossible.
  3.  **Demos as Author vs. Object:** Must distinguish the collective *making* binding decisions from the collective *subject to* those decisions. *Genuineness:* Essential for democratic self-government. If the governed are not the authors (or vice-versa), it becomes rule *over* a group, not rule *by* them. Collapsing this is autocracy.

  **III. Constraints Any Theory Must Respect (with justification for genuineness):**
  1.  **Boundaries Presuppose a Demos:** The act of drawing *any* boundary (initial or revised) is itself a political decision made by some pre-existing (or claimed) demos. *Genuineness:* A fundamental logical and practical constraint (the "bootstrapping" problem). No theory can ignore how boundaries are actually set in the real world without being utopian.
  2.  **Persistence Through Replacement:** A demos (e.g., "the French people") persists as an entity even as every single member is replaced by birth, death, and migration over time. *Genuineness:* Reflects the historical reality and continuity of political communities. A theory defining the demos only synchronically is inadequate.
  3.  **Nested and Overlapping Demoi:** Individuals belong to multiple demoi simultaneously (local, regional, national, supranational). *Genuineness:* Reality of multi-level governance (EU, federal systems). Assuming a single, monolithic demos is empirically false and normatively blind to complex identities and jurisdictions.
  4.  **Critical Assessment of States:** Must acknowledge that most existing states fail plausible criteria (e.g., excluding long-term residents, including non-resident citizens arbitrarily, harming outsiders). *Genuineness:* Avoids status quo bias. A critical theory must say what follows (e.g., reform, illegitimacy, obligation to outsiders) – not merely describe.
  5.  **Determinate Applicability:** Must provide a method for a specific body (e.g., court, legislature, constitutional convention) to apply the theory *in practice* to decide boundaries and give public reasons. *Genuineness:* Avoids debilitating indeterminacy ("it depends"). Real boundaries must be decided; theories must guide action, not just contemplation.

  **Irreconcilable Pairs:**
  *   **All-Affected Principle (AAP) vs. All-Subjected Principle (ASP):** This is the most significant clash.
      *   *Conflict:* AAP demands inclusion of gravely affected outsiders (Case 3) and future generations (Case 5), leading to potentially boundless demoi. ASP typically excludes them, focusing only on those legally bound. AAP struggles massively with determinacy (Constraint 5) and the presupposition constraint (Constraint 1). ASP struggles with expatriate voters (Case 2 – are they still subject?) and justifying exclusion of long-term governed residents (Case 1).
      *   *Why Irreconcilable:* AAP's core strength (including the profoundly affected) is ASP's core weakness, and vice-versa (ASP's boundedness is AAP's indeterminacy). Satisfying AAP's demands for outsiders/future people fundamentally violates ASP's core tenet, and satisfying ASP's need for boundedness requires excluding many AAP demands to include. No hybrid easily resolves the tension at the margins (e.g., the gravely affected outsider).

  **Most Eliminative Requirement:**
  The **Boundaries Presuppose a Demos (Constraint 1)** eliminates the most candidate theories. It exposes a foundational circularity:
  *   AAP founders: Who decides *who* is affected enough? The answer depends on *who decides*, presupposing a prior demos.
  *   ASP struggles: Who decides the scope of the legal system that defines subjection? The legal system itself presupposes the demos it serves.
  *   Stakes-based theories face the same question: Who decides what counts as a high enough stake?
  *   Purely procedural theories (e.g., existing law) avoid the circularity by accepting the status quo but fail the "Critical Assessment" constraint (Constraint 4) and struggle with secession (Case 6) or massive reform.
  This constraint highlights the inescapable fact that *any* boundary-setting act is performative and presupposes legitimacy, making purely deductive, universally applicable principles impossible to apply without a prior authoritative agent.

  **Brief Verdict on Theories:**
  1.  **Territorial:** Simple, respects Constraint 1 & Persistence (2), enables determinacy (5). *Fails:* Gravely affected outsiders (3), expatriate voters (2 - if exclusionary), justification for exclusion (4 - if arbitrary), nested demoi (3 - if rigid). Status quo bias violates Constraint 4.
  2.  **All-Affected (AAP):** Strong on affected outsiders (3), future people (5), justification (4 - forces argument). *Fails:* Determinacy (5) catastrophically, presupposition constraint (1) fatally, boundedness (collapses subject/affected distinction), often excludes the subjected (Case 1), struggles with membership/franchise distinction.
  3.  **All-Subjected (ASP):** Strong on resident non-citizens (1), distinction subject/affected, determinacy (5) better than AAP, respects presupposition (1) better than AAP. *Fails:* Expatriates (2), gravely affected outsiders (3), future people (5), persistence (2) if subjection ends upon emigration, critical assessment (4) if subjection is defined by flawed states.
  4.  **Stakes-Based:** Potentially strong on affected outsiders (3), future people (5), justification (4). *Fails:* Determinacy (5 - defining "high stakes"), presupposition constraint (1 - who decides stakes?), often collapses subject/affected, struggles with membership/franchise distinction and expatriates (2). Prone to indeterminacy like AAP.

  **Conclusion:** No theory satisfies all desiderata perfectly. The "Boundaries Presuppose a Demos" constraint is profoundly challenging. ASP handles the core governed/author link best but fails on externalities and temporality. AAP addresses crucial justice concerns but is administratively and conceptually incoherent for bounding a demos. Territorialism is workable but normatively thin and unjust. Stakes-based approaches inherit AAP's indeterminacy problems. A viable theory likely needs to start from ASP as a baseline for the core demos but incorporate supplementary mechanisms (representation, courts, transnational bodies) to address AAP's concerns for outsiders and future generations, acknowledging the inherent limitations and the performative nature of boundary-setting.
