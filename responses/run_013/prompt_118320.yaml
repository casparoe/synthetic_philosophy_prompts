prompt: |-
  Ok I need a disambiguation here, not a ruling. Dinner-party situation: I'm American, I was in Lisbon with my partner's family, the bill comes, I leave 15% out of habit, the cousin laughs and says 'when in Rome, do as the Romans do.' Fine, whatever. But later in the same meal, when I said the whole US 20%-or-you're-exploiting-the-server thing is basically a shakedown, someone used the exact same phrase on me in the other direction -- that since I actually live in the US, I have to follow the local convention whether I like it or not. Same proverb, two opposite jobs, and I don't think its doing either one properly.

  So take 'when in Rome, do as the Romans do' and lay out the distinct things it could actually be claiming, as a menu, from the boring-true to the genuinely contested, with a verdict on each -- trivial, substantive and defensible, or just false. Here's what I've come up with, tell me what I'm missing: (1) plain prudence, you'll get side-eye, so comply if you want a quiet life; (2) a claim about what the act means locally, so that not tipping in the US isn't 'keeping my money' in the local grammar of actions, it's 'stiffing the server', and I can't just carry my home meaning around with me; (3) fair play or reciprocity, I take the benefits of the local arrangement (menu prices set on the assumption of tips) so I owe my bit; (4) flat relativism, whatever the locals do is right for them and for me while I'm there; (5) respect or gratitude toward my hosts, which I suspect isn't really about the convention at all; (6) etiquette isn't morality, so the proverb governs manners and has no business settling a moral question.

  For each reading I want to know what it has to assume -- whose expectations count, what 'everyone' is quantifying over, what it implies for someone who genuinely can't afford the local convention, and for a resident who wants to change the norm rather than just go along with it. And say which readings actually deliver the conclusion in the two cases I care about: (a) the tourist who thinks tipping is demeaning should still tip here, and (b) the resident or visitor who wants to opt out of a local convention they think is harmful.

  One thing I keep circling: does any of this depend on the practice being a real coordination problem, like queuing, where there's an actual conflict about who goes next and everyone is better off with one shared answer -- as opposed to something like tipping, which seems to be held up by nothing but expectation plus disapproval? If the queue and the tip come out differently, that seems like it should matter for whether 'when in Rome' has any moral force at all, and I'd like to know if it does.

  And if it doesn't blow up the answer, one more case: jaywalking, where all the locals do it and the law says don't. Is the visitor who waits being a sucker, and is the local who crosses a free rider on the pedestrians who follow the rule?

  Finish by telling me which of the readings people usually mean when they use the phrase to end a conversation, and whether in that use the proverb is doing any work or just acting as a period at the end of the sentence.
reasoning: |-
  Okay, the user presents a complex scenario involving cultural norms and the application of the proverb "when in Rome, do as the Romans do." They experienced this twice in Lisbon: first when tipping as an American, then when criticizing US tipping culture. They want a disambiguation of the proverb's different interpretations, not a ruling. 

  The user has already outlined six possible readings of the proverb and wants them analyzed for assumptions, implications, and applicability to two specific cases: a tourist who finds tipping demeaning but should tip anyway, and a resident wanting to change a harmful norm. They also raise deeper questions about whether the moral force of the proverb depends on the practice being a true coordination problem (like queuing) versus mere expectation (like tipping), and add jaywalking as a borderline case.

  Hmm, the user is clearly intellectually sophisticated—they've already done significant conceptual mapping. Their frustration with the proverb being used as a conversation-ender suggests they value nuanced ethical reasoning over platitudes. The dinner party context implies real-world stakes; they're likely seeking frameworks to navigate future cross-cultural friction, especially around contested practices like tipping.

  Breaking it down: Their six categories cover pragmatic, semantic, reciprocal, relativistic, hospitable, and jurisdictional dimensions. I should validate this taxonomy while probing for gaps. The coordination problem angle is particularly astute—they're questioning whether "when in Rome" has any moral weight when a practice lacks game-theoretic necessity. 

  For the analysis, each reading needs: 
  - Core claim and hidden assumptions (e.g., whose expectations matter? Must everyone comply?) 
  - Implications for edge cases (can't afford the norm? Want to change it?) 
  - Verdict on applicability to their two tipping scenarios 

  The jaywalking addendum cleverly tests consistency. And the final query about conversational function cuts to how the proverb is weaponized in discourse. 

  Gaps to address beyond their list: 
  - Perhaps a "democratic participation" reading where residents have standing to reform norms 
  - The proverb’s silent presumption that locals are a monolith (ignoring dissent) 
  - Whether duration of stay affects obligations (tourist vs. immigrant) 

  For the coordination problem distinction: Yes, it matters. Queuing solves a tangible conflict, so violating it directly harms others. Tipping’s harm is more diffuse—it feels shakedown-ish precisely because it’s not solving coordination failure. This weakens the moral case for readings 3 and 4. 

  Jaywalking is hybrid: Locals may coordinate on efficient crossing despite laws. A waiting tourist isn’t a sucker if safety is the actual norm; a local jaywalker free-rides only if law-followers enable safety. 

  On conversational use: People often mean reading 1 (prudence) or 4 (relativism) to shut down debate. But it’s intellectually lazy—the proverb masks substantive disagreements about harm, consent, or reformability of norms. 

  The user’s frustration is justified. The proverb is overused precisely because it’s underspecified. Unpacking its meanings helps reclaim agency: Sometimes compliance is wise pragmatism; other times, it’s okay to ask "But should Rome even be doing this?"
answer: |-
  Here's a disambiguation of "When in Rome, do as the Romans do," breaking down its distinct claims, assumptions, implications, and applicability to your cases:

  ### Your Readings Analyzed
  1.  **Plain Prudence (Avoid Social Sanction)**
      *   **Claim:** Non-compliance risks disapproval, conflict, or inconvenience. Do it for an easier life.
      *   **Assumes:** Locals *will* notice and disapprove; their disapproval matters to you.
      *   **"Everyone":** Quantifies over locals whose opinion/response affects your experience.
      *   **Can't Afford?** No excuse, sanction still applies. **Wants Change?** Impractical for tourist; resident must accept social cost as part of activism.
      *   **Applies to Tipping Cases?** Yes (Tourist in US: Avoid stiffing label/conflict). Yes (US Resident: Avoid stiffing label/conflict).
      *   **Verdict:** **Trivially True.** Avoids conflict but has no *moral* content. Pure pragmatism.

  2.  **Semantic Claim (Meaning of the Act)**
      *   **Claim:** Your action has a *different social meaning* locally than it does at home. Not tipping in the US doesn't mean "keeping my money," it means "stiffing the server."
      *   **Assumes:** Actions derive meaning from shared social context; intent is secondary to perceived meaning.
      *   **"Everyone":** Quantifies over the local interpretive community (how the act is understood).
      *   **Can't Afford?** Doesn't change the *meaning* of the act (it's still seen as stiffing). **Wants Change?** Acknowledges the *current* meaning but doesn't preclude trying to *change* that meaning.
      *   **Applies to Tipping Cases?** Strong Yes (Tourist in US: Your non-tip *is* stiffing locally). Strong Yes (US Resident: Your non-tip *is* stiffing locally).
      *   **Verdict:** **Substantive & Defensible.** Crucial for cross-cultural understanding. Explains *why* prudence (Reading 1) is necessary.

  3.  **Fair Play / Reciprocity (Benefiting from the System)**
      *   **Claim:** You benefit from the local system structured around the norm (e.g., lower menu prices due to tipped wages), so you have an obligation to uphold your end.
      *   **Assumes:** The system *is* structured that way; you *are* benefiting; participation creates a quasi-contract.
      *   **"Everyone":** Quantifies over participants in the system (businesses, workers, customers).
      *   **Can't Afford?** Obligation weakens significantly (can't benefit if you can't pay). **Wants Change?** Obligation binds only as long as you participate *in the current system*. Opting out entirely (e.g., boycotting restaurants) avoids obligation; trying to change *within* the system is complex.
      *   **Applies to Tipping Cases?** Strong Yes (Tourist in US: Benefits from lower prices). Strong Yes (US Resident: Benefits from lower prices). *This is the core argument FOR tipping in the US system.*
      *   **Verdict:** **Substantive & Defensible (but context-dependent).** Has genuine moral weight *if* the benefit/participation condition holds.

  4.  **Flat Relativism (Local Custom = Local Morality)**
      *   **Claim:** Whatever is customary locally is morally right *for that place* and thus morally binding on visitors/residents.
      *   **Assumes:** Morality is entirely determined by local convention; no universal standards exist or matter.
      *   **"Everyone":** Quantifies over the dominant local cultural group (often ignoring dissent).
      *   **Can't Afford?** Morally irrelevant; obligation stands. **Wants Change?** Morally impermissible; convention defines morality.
      *   **Applies to Tipping Cases?** Forces Yes (Tourist: Must tip, it's locally moral). Forces Yes (Resident: Must tip, it's locally moral).
      *   **Verdict:** **False & Problematic.** Collapses morality into popularity. Provides no basis for critiquing harmful local practices (slavery, FGM, etc.). Ignores internal dissent.

  5.  **Respect / Gratitude to Hosts (Not Convention-Focused)**
      *   **Claim:** Compliance is an expression of respect or gratitude towards your *specific hosts* or the host culture, regardless of the convention's inherent value.
      *   **Assumes:** You are a guest; the hosts value the convention; showing respect is paramount.
      *   **"Everyone":** Quantifies over your *specific hosts* or the welcoming cultural community.
      *   **Can't Afford?** Potentially excusable if explained respectfully. **Wants Change?** Deeply problematic; expressing respect might require compliance *while a guest*, but doesn't bind action as a resident/outsider seeking reform.
      *   **Applies to Tipping Cases?** **Tourist in Lisbon:** Strong Yes (Respect hosts/culture). **US Resident Criticizing:** Very Weak (Not about hosts, about systemic critique).
      *   **Verdict:** **Substantive & Defensible (in guest/host context).** Explains Lisbon cousin's point well. Doesn't apply well to systemic critique within one's own society.

  6.  **Jurisdictional Claim (Manners vs. Morals)**
      *   **Claim:** The proverb governs *etiquette* (social coordination, politeness), not core *morality*. It settles "how we do things here," not "what's fundamentally right/wrong."
      *   **Assumes:** A clear distinction exists between manners (conventional) and morals (universal/principled).
      *   **"Everyone":** Quantifies over the domain of local social convention.
      *   **Can't Afford?** Manners may yield to moral necessity (survival). **Wants Change?** Precisely the point! Changing manners is legitimate; changing morals is deeper. The proverb doesn't forbid reforming *conventions*.
      *   **Applies to Tipping Cases?** **Tourist in US:** Yes (Tipping is largely US restaurant *etiquette*). **US Resident Criticizing:** Yes (Your critique targets the *convention/system*, not core morality - the proverb shouldn't silence this).
      *   **Verdict:** **Substantive & Defensible.** Crucial distinction. Explains why "When in Rome" shuts down discussion poorly in the US tipping debate. It governs the "how," not the "whether it *should* be this way."

  ### Addressing Your Core Questions

  *   **Coordination Problem vs. Mere Expectation (Tipping vs. Queuing):**
      *   **Matters Significantly.** Readings 3 (Reciprocity) and 6 (Manners) gain more force with true coordination problems.
      *   **Queuing:** Pure coordination. Violation directly causes conflict, delay, and inefficiency *for everyone present*. Readings 1, 2, 3, 6 apply strongly. Moral force is high (preventing tangible harm/chaos).
      *   **Tipping:** Primarily expectation + systemic structure. The *immediate* harm of non-compliance (server's wage loss, personal disapproval - Readings 1 & 2) exists, but the *systemic coordination* benefit is less direct and more contested. Reading 3 (Reciprocity for systemic benefit) is the main moral argument, but weaker than in queuing. Reading 6 (Manners) fits best.
      *   **Verdict:** "When in Rome" has stronger *moral* force (via Reciprocity) for true coordination norms like queuing. For tipping, its force leans more towards prudence (1), semantics (2), and manners (6), with Reciprocity (3) being context-dependent on the system's structure.

  *   **Jaywalking Case (Local Practice vs. Law):**
      *   **The Waiting Tourist:** Not necessarily a "sucker." If the *actual* local coordination norm (for safety/efficiency) is widespread jaywalking *despite* the unenforced law, waiting *might* be non-conforming (Readings 1, 2 - potential for mild confusion/impatience). If law enforcement is a risk, waiting is prudent (1). If safety is the true norm, waiting might align with it. Depends on the *de facto* norm.
      *   **The Jaywalking Local:** Only a "free rider" if: 1) Law-following pedestrians *systematically* create safe gaps the jaywalker exploits, *and* 2) The jaywalker wouldn't cross if *no one* followed the law (creating chaos). Usually, it's not a tight coordination norm like queuing. The jaywalker primarily risks their *own* safety/sanction and slightly undermines the *law*, not necessarily fellow pedestrians who follow it. Free-rider status is weak unless in a specific high-compliance context enabling safe jaywalking.

  *   **What People Usually Mean (Conversation-Ender):**
      *   **Most Common Blend:** **Reading 1 (Prudence)** + **Reading 4 (Relativism Lite)**. They imply: "Just do it to avoid trouble/disapproval, and who are you to judge their ways anyway?" It often carries an unstated whiff of relativism without fully committing to its philosophical problems.
      *   **Is it Doing Work?** It's acting as a **thought-terminating cliché**, not rigorous argument. It leverages the ambiguity of the proverb to shut down dissent by invoking social pressure (1) and implying cultural insensitivity/questionable morals (4-lite) for non-compliance. It avoids engaging with the *reasons* for objection (Readings 3, 6) or the specifics of the situation (Reading 2, 5). It functions as a rhetorical "period," not a substantive point.

  ### Summary Verdicts on Your Cases

  1.  **Tourist Who Finds Tipping Demeaning (Should Still Tip in US):**
      *   **Strongly Supported By:** 1 (Prudence), 2 (Semantics - it *is* stiffing), 3 (Reciprocity - benefits from system), 6 (Manners - local etiquette).
      *   **Weak/Not Supported By:** 4 (Relativism - doesn't make it *moral*, just expected), 5 (Respect - relevant but less direct for systemic practice).
      *   **Conclusion:** Yes, the tourist *should* tip (prudentially, semantically, reciprocally, and as manners), *despite* finding it demeaning. "When in Rome" works here via Readings 1, 2, 3, 6.

  2.  **Resident/Visitor Wanting to Opt-Out/Change a Harmful Norm:**
      *   **Supported By:** 6 (Jurisdiction - the proverb governs manners, not moral critique/system change). *Weakly* by 1 (Prudence - accepting social cost *is* part of activism).
      *   **Contradicted By:** 4 (Relativism - forbids critique/change). *Potentially* by 3 (Reciprocity - if still participating in the system without contributing *and* wanting to change it, it's complex/hypocritical).
      *   **Conclusion:** "When in Rome" (Readings 1 & 4) is **misapplied** to silence this critique. Reading 6 explicitly carves out space for challenging conventions. Readings 3 & 5 don't strongly bind a resident seeking systemic reform, especially if they avoid benefiting (hard with tipping) or frame it as moral critique. The proverb does *not* deliver the conclusion that residents must silently comply with harmful norms.

  **The Proverb's Core Function:** It's primarily a pragmatic/semantic guide (Readings 1 & 2) with applications in manners (6) and specific reciprocity (3). It's misused as a moral relativism club (4) or to stifle legitimate debate about convention (especially by residents). Its moral force is strongest for genuine coordination norms and weakest for contested systemic practices like tipping when used to silence critique.
