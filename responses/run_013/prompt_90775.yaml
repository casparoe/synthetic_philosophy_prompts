  For the dialogue structure:
  Realist (Clara) should argue that faith loses meaning without ontological commitment, pointing to how believers actually speak of doubt and apostasy as truth-related. Internalist (Marcus) should maintain that demanding external verification misunderstands religious grammar, while acknowledging the risk of insularity.

