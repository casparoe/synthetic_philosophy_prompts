prompt: |-
  A friend of mine with a doctorate in history and I spent most of a long dinner arguing about whether "why Britain and not China?" — the old puzzle about why sustained industrial growth began where it did — is even a well-posed question. Her view is that it treats one outcome as the default and the other as a deviation needing explanation, that "Britain" and "China" are aggregates doing work no evidence can support, and that you cannot ask why something did not happen. I think she is too quick: contrastive questions are ordinary in history and often answerable. What I took from the argument is that we have no way of telling the well-posed ones from the ill-posed ones.

  I chair the committee that approves comparative essay titles for our final-year history students. Each year we get about forty proposals of the form "why did X happen in P and not in Q?", we have one afternoon to vet them, most of us are not specialists in the regions concerned, the final list goes out under my name, and a rejection means writing to the teacher who proposed the title to explain it. Please write a procedure we can run on each title in a few minutes: the tests to apply in order, what counts as passing or failing each, what to do with a title that fails (reframe it, specify the contrast, split it, reject it), and where the procedure must stop and hand the matter to a person because it turns on historiographical or evaluative judgment rather than on whether the question is well formed. Ground it in whatever philosophy of science actually says about contrastive explanation and in what comparative history has learned about comparing large entities; I don't need a survey of the debate, I need something my committee can use. Then run it on three titles: "Why did sustained industrial growth begin in Britain rather than in China?"; "Why did Japan industrialize in the nineteenth century while the Ottoman Empire did not?"; and "Why did the Scientific Revolution happen in Europe and not in the Islamic world?" — the last is one I would be sorry to lose, so be explicit if the procedure comes out against it.

  Tell me how confident you are in the procedure itself, and single out the step you are least sure of.
reasoning: |-
  We are designing a procedure to vet comparative essay titles of the form "Why did X happen in P and not in Q?" for a history committee. The procedure should be grounded in philosophy of science (regarding contrastive explanation) and comparative history (regarding comparing large entities). The goal is to filter out ill-posed questions and reframe or reject them appropriately.

  Philosophical Grounding:
  1. Contrastive Explanation: A contrastive question "Why A rather than B?" assumes that A and B are comparable and that there is a meaningful contrast to explain. The philosopher Peter Lipton (in "Inference to the Best Explanation") and others argue that a good contrastive question must:
     - Have a well-defined and non-trivial contrast (i.e., the foil B is a plausible alternative to A).
     - The fact that A occurred and B did not should be a fact that requires explanation (i.e., it is not already explained by background conditions, and the foil is not obviously impossible).

  2. Comparative History:
     - Avoid comparing overly large, heterogeneous entities (e.g., "Europe" vs. "Asia") without specifying the relevant units and time periods.
     - The entities being compared (P and Q) should be at a similar level of analysis and have comparable contexts (e.g., similar preconditions, at least in the relevant aspects).
     - The event X should be defined in a way that is applicable to both P and Q (or there should be a clear reason why it is not).

  Procedure Steps (to be applied in order):

  1. **Check for Definition of X (the event/phenomenon):**
     - Pass: X is clearly defined and is a specific, identifiable event or process that can be observed (or its absence noted) in both P and Q.
     - Fail: X is vague, overly broad, or defined in a way that it is inherently tied to P (making the absence in Q trivial).
     - Action if fail: Reject or require reframing to specify X.

  2. **Check for Homogeneity of X in P and Q:**
     - Pass: The same X (or a comparable phenomenon) is meaningfully applicable to both P and Q. For example, if X is "industrialization", then we must be able to define it in a way that is not Eurocentric and that could be observed in Q.
     - Fail: X is defined in a way that it only makes sense in P (e.g., defining the Scientific Revolution in terms that are specifically European).
     - Action if fail: Reframe X to be more universal or split the question into two separate questions about P and Q.

  3. **Check the Foil (Q) for Plausibility:**
     - Pass: There is a plausible case that X could have happened in Q (i.e., the absence of X in Q is not trivially explained by fundamental differences that are already known, such as Q being in a completely different era or having no relevant preconditions). The foil should be a "near miss".
     - Fail: The foil is implausible (e.g., asking why X happened in P and not in Q when Q had no chance due to well-known, fundamental constraints). Also, if the question implies that Q is the "default" and P the deviation when that is not warranted.
     - Action if fail: Reject or change the foil to a more plausible alternative.

  4. **Check the Units of Comparison (P and Q):**
     - Pass: P and Q are comparable units (e.g., similar scale, similar period, and internally coherent enough to be treated as single entities for the purpose of X). For large entities (like "China" or "Europe"), the question must be able to be answered without overgeneralizing internal diversity.
     - Fail: P and Q are too heterogeneous or at different scales (e.g., comparing a continent to a country). Also, if P and Q are not contemporaneous in the relevant time frame.
     - Action if fail: Reframe to specify a more comparable unit (e.g., a region within the large entity) or split into multiple comparisons.

  5. **Check for Preconditions (Background Conditions):**
     - Pass: The background conditions for X are not so different between P and Q that the absence in Q is already explained by known factors (e.g., if Q is known to have been devastated by war at the time, then that might be the obvious explanation and the contrast is trivial).
     - Fail: The absence in Q is already explained by a well-established, fundamental difference that is not in dispute (e.g., if Q lacked a necessary precondition that P had, and that precondition is the subject of the explanation).
     - Action if fail: Reject or reframe the question to focus on the preconditions (e.g., "Why did P have precondition Y and not Q?").

  6. **Check for Historiographical Controversy (Stop and Hand to Human):**
     - If the question passes the above, but there is a major historiographical debate about whether the contrast is real (i.e., whether X really happened in P and not in Q, or whether X is even the right way to frame the event), then the question requires human judgment. Also, if the definition of X is contested in the literature, we flag it for human review.
     - Action: Send to a specialist for review.

  Applying the Procedure to the Given Titles:

  1. **Title: "Why did sustained industrial growth begin in Britain rather than in China?"**
     - Step 1 (Definition of X): "Sustained industrial growth" is fairly well defined (e.g., the Industrial Revolution). Pass.
     - Step 2 (Homogeneity of X): Industrial growth can be defined in a way that is applicable to both (though note: the Chinese case might have had different forms of industrialization). But generally, it's acceptable. Pass.
     - Step 3 (Plausibility of Foil): Given that China had advanced technology and a large economy in the pre-modern era, it is a plausible foil. Pass.
     - Step 4 (Units of Comparison): Britain is a nation, China is an empire (huge and diverse). This is a problem. The internal diversity of China (e.g., comparing to a region like the Yangtze Delta) might be more appropriate. Fail.
       - Action: Reframe to compare Britain with a specific region in China (e.g., the Yangtze Delta) or split the question into two: one about Britain and one about China, and then compare the factors.
     - Since it fails at step 4, we would require reframing.

  2. **Title: "Why did Japan industrialize in the nineteenth century while the Ottoman Empire did not?"**
     - Step 1: "Industrialize" is clear. Pass.
     - Step 2: Industrialization is a concept applicable to both. Pass.
     - Step 3: Both were non-European empires facing Western pressure in the 19th century. The Ottoman Empire had some attempts at industrialization (e.g., Tanzimat reforms) so it's a plausible foil. Pass.
     - Step 4: Both are empires, but note that the Ottoman Empire was much larger and more diverse than Japan? Actually, Japan is an island nation with relative homogeneity, while the Ottoman Empire spanned three continents. This might be a problem. However, both are often compared as states responding to the West. We might pass with caution? But let's note: the Ottoman Empire had many regions (e.g., Egypt, Anatolia) that might have industrialized differently. However, the unit of comparison is the state as a whole. This is borderline. We might pass but note that a more precise comparison might be between Japan and a specific part of the Ottoman Empire (like Anatolia) or compare the central state efforts. But for the purpose of this step, we'll give a conditional pass (but note the heterogeneity). 
     - Step 5: Check preconditions. Both had state-led attempts, but the Ottoman Empire faced more internal and external challenges? This step requires knowing if there's a trivial explanation. There isn't one obvious and uncontested. Pass.
     - Step 6: There is historiographical debate about the Ottoman Empire's industrialization (e.g., why it was less successful). So we pass the procedure but note that it requires human judgment for the nuance.

     Outcome: Pass with a note that the comparison of units is broad and might require careful handling. The committee might accept it but suggest the student be aware of internal diversity.

  3. **Title: "Why did the Scientific Revolution happen in Europe and not in the Islamic world?"**
     - Step 1: "Scientific Revolution" is a term that refers to a specific period in Europe (16th-17th centuries). But it is a term that has been debated. Pass with caution (because it is defined, but the definition might be Eurocentric).
     - Step 2: Homogeneity? The concept of a "Scientific Revolution" as a distinct event is tied to Europe. There was scientific activity in the Islamic world (during the Islamic Golden Age) but it was in a different period (8th-14th centuries). Comparing two different time periods? Also, the question implies that the Islamic world did not have a similar revolution. This step fails because the time periods are misaligned and the concept is defined in a way that may not be applicable to the Islamic world. The Islamic world had a flourishing of science, but it was not in the same period. So we cannot directly compare without adjusting the time frame.
       - Action: Reframe the question to compare the development of science in Europe (16th-17th centuries) and in the Islamic world (during its golden age) and ask why they followed different trajectories? Or ask why modern science emerged in Europe and not elsewhere? But note that the Islamic world had a decline in scientific activity by the 16th century. Alternatively, split the question: one about the rise of modern science in Europe and one about the decline (or different path) in the Islamic world, then compare the factors.
     - Step 3: The foil? The Islamic world had a rich scientific tradition, so it's plausible. But the time misalignment is a problem. We already failed at step 2.

     Since it fails step 2, we must reframe. However, note that the committee chair would be sorry to lose this title. So we might reframe it as: "Why did the Scientific Revolution occur in early modern Europe and why did a comparable transformation not occur in the early modern Islamic world?" But then we must check the time period: the early modern Islamic world (16th-18th centuries) was a period of relative decline in scientific output? So the question might still be valid. But the procedure would require reframing to align the time periods and to define the event in a way that is not inherently European.

     Alternatively, we might change the foil to a more contemporaneous one (e.g., the Ottoman Empire in the early modern period) and ask about the absence of a scientific revolution there. But note that the Islamic world was not limited to the Ottoman Empire.

     Given the complexity, the committee might decide to accept a reframed version: "Why did the Scientific Revolution occur in Europe in the sixteenth and seventeenth centuries, and why did the Islamic world, which had previously been a center of scientific achievement, not experience a similar transformation in the same period?" But note that the Islamic world in the 16th-17th centuries was not the same as during its Golden Age. This requires careful handling.

  Confidence in the Procedure:
  - Overall, I am moderately confident. The procedure is based on well-established principles in the philosophy of explanation and comparative history. However, it is a heuristic and may not capture every nuance.

  The step I am least sure of is **Step 4 (Units of Comparison)**. It is often difficult to decide what constitutes a comparable unit, especially when dealing with large political entities that have internal diversity. This step requires some background knowledge and may be subject to debate even among specialists. We might need to allow for more flexibility and human judgment at this step.

  Final Procedure for the Committee:
  1. Apply steps 1 to 5 in order.
  2. If a step fails, follow the action (reframe, split, or reject) and then stop (unless the reframing is minor and can be done on the spot by the committee). If reframing is required, communicate that to the teacher.
  3. If the question passes all steps 1-5 but has a major historiographical controversy (step 6), then refer to a specialist for review (which might take more time).

  Note: The committee might not have time to reframe every question. So for a failed step, the default is to reject and ask the teacher to resubmit with reframing. However, if the committee can quickly suggest a reframing (like in the case of the China/Britain question, suggesting a specific region in China), then they can do so.

  Let me know if you need more details.
answer: |-
  ### Procedure for Vetting Comparative Essay Titles: "Why did X happen in P and not in Q?"

  This procedure is grounded in philosophy of science (contrastive explanation) and comparative history (comparing large entities). It draws on Peter Lipton's work on contrastive explanation (*Inference to the Best Explanation*, 2004), which requires that a contrastive question must:  
  - **Define a meaningful and non-trivial contrast** (i.e., the outcome in P and absence in Q should not be pre-determined by obvious background conditions).  
  - **Use comparable units** (P and Q must be at similar scales of analysis, with internal coherence, to avoid "aggregate fallacy").  
  - **Specify a testable phenomenon** (X must be observable, falsifiable, and defined independently of P).  

  From comparative history (e.g., Kenneth Pomeranz, *The Great Divergence*, 2000), key lessons include:  
  - **Avoid monolithic entities**: Large aggregates (e.g., "China," "Europe") often mask internal diversity; comparisons should use units at similar scales (e.g., regions, states).  
  - **Ensure temporal alignment**: P and Q should be contemporaneous in the relevant period for X.  
  - **Preconditions matter**: The absence of X in Q should not be trivially explained by fundamental differences (e.g., war, geography) unless those are the focus.  

  The procedure consists of **6 sequential tests**. Apply them in order; if a title fails any test, follow the recommended action. If it passes all tests, approve it. **Stop and refer to a human** if the issue hinges on historiographical debates (e.g., contested definitions of X or disagreements about P/Q's comparability).  

  #### Step-by-Step Tests:  
  1. **Clarity of X (the phenomenon)**  
     - **Test**: Is X clearly defined, specific, and observable? Can it be applied to both P and Q without being tautological (e.g., "X in P" defined in a way that assumes P's uniqueness)?  
     - **Pass**: X is discrete, measurable, and not inherently tied to P (e.g., "industrialization" defined by rising per-capita output and technological innovation).  
     - **Fail**: X is vague, anachronistic, or P-specific (e.g., "the Scientific Revolution" defined by European institutions).  
     - **Action**: Reject or reframe X to be universal. Example: Change "Why did the *Scientific Revolution* happen..." to "Why did *systematic experimental science* emerge...".  
     - **Time**: 1 minute.  

  2. **Homogeneity of X across contexts**  
     - **Test**: Is X conceptually transferable? Could it plausibly occur in Q, or is it invalid due to contextual differences (e.g., cultural, institutional)?  
     - **Pass**: X is not inherently Western/Eurocentric and could manifest in Q (e.g., industrialization as a general process of mechanization).  
     - **Fail**: X is rooted in P's unique context (e.g., "feudalism" in Europe vs. Q).  
     - **Action**: Split the question into two: "Why did X happen in P?" and "Why did X not happen in Q?" for separate analysis.  
     - **Time**: 1 minute.  

  3. **Plausibility of the foil (Q)**  
     - **Test**: Is Q a reasonable alternative? Would historians broadly agree that X could have occurred in Q based on preconditions (e.g., similar economic/technological development)?  
     - **Pass**: Pre-1800 China or the Ottoman Empire had comparable development to Europe (per Pomeranz).  
     - **Fail**: Q lacks fundamental prerequisites (e.g., "Why not Antarctica?" implies a trivial contrast).  
     - **Action**: Reject or specify a new foil (e.g., replace "China" with "Yangtze Delta" for better comparability).  
     - **Time**: 1 minute.  

  4. **Units of comparison (P and Q)**  
     - **Test**: Are P and Q at comparable scales and internally coherent? Avoid civilizational aggregates (e.g., "Europe" vs. "Islam") unless justified.  
     - **Pass**: States (e.g., Britain vs. France) or regions (e.g., Kansai vs. Anatolia).  
     - **Fail**: Overly broad (e.g., "Europe" vs. "China") or mismatched scales (e.g., nation vs. continent).  
     - **Action**: Reframe to specify sub-units (e.g., "Why in England rather than Lombardy?") or reject.  
     - **Time**: 1 minute.  

  5. **Non-triviality of the contrast**  
     - **Test**: Is the absence of X in Q already explained by well-established factors (e.g., war, resource constraints)? If yes, the contrast may not need explanation.  
     - **Pass**: No consensus explanation exists (e.g., the Ottoman Empire's industrialization failure is debated).  
     - **Fail**: Background conditions obviously preclude X in Q (e.g., "Why not Q?" when Q was colonized/destroyed).  
     - **Action**: Reject or reframe to focus on preconditions (e.g., "Why did P have favorable conditions for X when Q did not?").  
     - **Time**: 1 minute.  

  6. **Historiographical stop clause**  
     - **Test**: Does the question involve contested definitions, periodization, or causality (e.g., is "the Scientific Revolution" a valid concept for Q)?  
     - **Pass**: No major debates; the question is well-formed.  
     - **Fail**: Yes—e.g., if historians dispute whether X "happened" in P or could apply to Q.  
     - **Action**: **Stop and refer to a specialist** for judgment. Do not approve/reject without expertise.  
     - **Time**: N/A (human review required).  

  **Outputs for failed titles**:  
  - **Reject**: If flaws are irredeemable (e.g., trivial foil).  
  - **Reframe**: If fixable with minor edits (e.g., redefine X or specify units).  
  - **Split**: If homogeneity fails (e.g., separate questions for P and Q).  

  **Time per title**: 5–6 minutes (1 minute per test, plus buffer). For borderline cases, default to rejection or specialist referral.  

  ---

  ### Application to Example Titles  

  #### 1. "Why did sustained industrial growth begin in Britain rather than in China?"  
  - **Step 1 (Clarity of X)**: Pass. "Sustained industrial growth" is definable (e.g., rising productivity, technological innovation).  
  - **Step 2 (Homogeneity)**: Pass. Industrial growth is a transferable concept (e.g., debated for Qing China).  
  - **Step 3 (Foil plausibility)**: Pass. Pre-1800 China had similar economic development (per Pomeranz).  
  - **Step 4 (Units)**: **Fail**. "Britain" (a small state) and "China" (a vast empire) are mismatched. Ignores internal diversity (e.g., compare Britain to the Yangtze Delta).  
  - **Action**: Reframe to: "Why did sustained industrial growth begin in Britain rather than in the Yangtze Delta?"  
  - **Result**: Approved with reframing.  

  #### 2. "Why did Japan industrialize in the nineteenth century while the Ottoman Empire did not?"  
  - **Step 1 (Clarity)**: Pass. "Industrialize" is clear (e.g., state-led mechanization).  
  - **Step 2 (Homogeneity)**: Pass. Industrialization is applicable to both (e.g., Ottoman reforms attempted it).  
  - **Step 3 (Foil)**: Pass. Both faced Western pressure and had state capacity for reform.  
  - **Step 4 (Units)**: Pass. Both are early modern empires/states at similar scales.  
  - **Step 5 (Non-triviality)**: Pass. No consensus on why the Ottomans "failed" (e.g., debt vs. institutions).  
  - **Step 6 (Historiography)**: Pass. No major definitional disputes.  
  - **Result**: Approved.  

  #### 3. "Why did the Scientific Revolution happen in Europe and not in the Islamic world?"  
  - **Step 1 (Clarity)**: **Fail**. "Scientific Revolution" is Eurocentric (coined for 16th–17th-century Europe) and implies a unique rupture. Not directly observable in the Islamic world.  
  - **Action**: Reframe X to be universal (e.g., "systematic experimental science").  
  - **Revised title**: "Why did systematic experimental science emerge in early modern Europe and not in the early modern Islamic world?"  
  - **Retest**:  
    - Step 1: Pass (now more universal).  
    - Step 2: **Fail**. "Systematic experimental science" assumes a European template; Islamic science had different methods (e.g., emphasis on observation vs. experiment). Homogeneity is contested.  
    - Step 3: Pass. The Islamic world had advanced science (e.g., Golden Age).  
    - Step 4: **Fail**. "Europe" and "Islamic world" are civilizational aggregates; units are incoherent (e.g., Europe includes diverse states; the "Islamic world" spans continents).  
    - Step 5: Borderline. Absence in the Islamic world is partly attributed to political fragmentation, but not trivial.  
    - **Overall action**: Split or reject. Historiographical disputes (Step 6) are likely—e.g., whether a "decline" occurred. **Refer to a specialist** for judgment.  
  - **Your concern**: If you wish to keep it, split into:  
    a) "Why did systematic experimental science emerge in early modern Europe?"  
    b) "Why did it not emerge in the early modern Ottoman Empire?" (specifying a sub-unit).  

  ---

  ### Confidence in the Procedure  
  - **High confidence overall (80%)**: The tests address core pitfalls in contrastive history (e.g., aggregate fallacy, Eurocentrism) and are philosophically robust. They align with Lipton's criteria and comparative best practices.  
  - **Weakest step**: **Step 4 (Units of comparison)**. I am least sure here because scales can be ambiguous (e.g., when is "Europe" acceptable?). Large entities are sometimes valid if the question focuses on structural factors (e.g., trade networks), but this risks overgeneralization. Err on the side of caution by requiring sub-units.  

  **Recommendation for the committee**:  
  - Use this procedure as a first-pass filter. For titles failing multiple tests, reject outright.  
  - For Step 6 (historiographical stop), designate 1–2 committee members per region to handle referrals.  
  - In rejection letters to teachers: Explain which test failed, offer reframing options, and invite resubmission.  

  This balances efficiency with rigor, catching ill-posed questions while preserving valuable contrasts.
