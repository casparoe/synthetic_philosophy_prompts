prompt: |-
  I run the behavioral design team at a state benefits agency. We write the letters and texts that try to get people to claim benefits they are owed, attend screenings, and enroll in a retirement savings plan: roughly a dozen new messages a month, each going to hundreds of thousands of households, and every one of them is doing some kind of persuasion — the order of the information, the example we choose, the deadline we print, what goes on the envelope. After a reporter's questions last month, half my team believes we have been manipulating people for years, and the other half believes that if we stopped we would be leaving money and medicine unclaimed. I need a decision procedure we can actually run on each message before it ships. It should be grounded in the distinction between manipulation and legitimate persuasion itself rather than in a reading list, be usable in about twenty minutes by a designer who has never read any philosophy, and be explicit about what counts as a sufficient answer at each step, where it stops with a no, and where it hands the decision to the general counsel or the communications director because the question is one of values rather than of fact. Our current working rule is that a message is manipulative if it conceals something or makes people feel bad, and I think that rule is at once too strict and too loose; the procedure should replace it. Apply the procedure to three messages now in front of us: an accurate social-norm line telling people that most households in their county have already claimed this credit, where we deliberately chose the comparison group that tests best; a real but unrepresentative and moving personal testimonial, chosen because a plainer one tested worse; and a default that pre-enrolls people in a savings plan they may leave at any time. One of these should come out as a no that my team will hate. Finish by telling me what the procedure cannot do and where it will misfire in the hands of a designer who wants a yes. Write it as continuous prose, with no headings, bullet points, bold text, or tables.
reasoning: |-
  We are designing a decision procedure to distinguish legitimate persuasion from manipulation in the context of state benefits communications. The procedure must be grounded in the distinction itself, usable in about 20 minutes by a non-philosopher, and explicit about when to stop (with a no) or when to escalate to higher authorities (general counsel or communications director) for value-based decisions. The current rule (manipulation if it conceals something or makes people feel bad) is to be replaced.

  The core distinction we'll use is between persuasion that respects the autonomy and rationality of the individual (legitimate) and that which bypasses or subverts their rational processes (manipulative). We can break this down into three key tests:

  1. **Transparency and Honesty**: Does the message clearly and accurately present the necessary facts? Does it avoid hiding or obscuring important information that a reasonable person would want to know? (If it conceals or lies, it's manipulative.)

  2. **Appeal to Reason vs. Emotion/Heuristics**: Does the message primarily appeal to the recipient's rational decision-making capabilities, or does it rely excessively on emotional triggers or cognitive biases that could lead to a decision the person might not make upon calm reflection? (Note: some emotional appeal can be legitimate, but if it's the primary driver and not in service of a rational end, it may be manipulative.)

  3. **Respect for Autonomy**: Does the message respect the recipient's freedom to choose? Does it avoid creating undue pressure, exploiting vulnerabilities, or using deceptive tactics to steer behavior? (If it coerces or tricks, it's manipulative.)

  We'll structure the procedure as a series of questions. At each step, if the answer is "no" to the specified condition, we stop and label the message as manipulative (a "no" for sending). If we get through all steps without a no, we can proceed. If any step requires a value judgment that the designer cannot make (i.e., it's not a clear factual matter), we escalate to the general counsel or communications director.

  **The Procedure:**

  Start by having the designer read the message and consider its context (the benefit, the audience, the desired action). Then, step by step:

  1. **Truthfulness and Completeness Check**: Ask: "Does the message truthfully represent all the key facts? And does it include, or at least not hide, any important information that a reasonable person in this situation would need to make an informed decision?" If no, stop: the message is manipulative. If yes, proceed. (Note: We are not requiring every detail, but key facts that affect the decision.) If the designer is unsure what counts as a "key fact," they should note that and escalate to the general counsel for a ruling on whether the omission is material.

  2. **Rational Justification Check**: Ask: "Is the primary mechanism of persuasion based on providing clear, relevant reasons for taking the action? Or does it rely heavily on non-rational triggers (like fear, shame, social pressure without a rational basis, or exploiting cognitive biases) that might cause a person to act against their own interests or without proper reflection?" If the primary mechanism is non-rational and the designer judges that it could lead to harm or regret (e.g., by causing undue distress or by tricking the person), stop: the message is manipulative. If it uses non-rational elements but they are secondary to rational arguments and are not harmful, proceed. If the designer is unsure whether the emotional appeal is excessive or potentially harmful, they should escalate to the communications director (who handles the agency's voice and values) for a judgment call.

  3. **Autonomy and Voluntariness Check**: Ask: "Does the message respect the recipient's ability to freely choose? In particular, does it avoid creating a sense of false urgency, exploiting a known vulnerability of the group (e.g., targeting the elderly with complex decisions in a confusing way), or using deceptive framing that would make it hard for a reasonable person to see the alternative?" If no, stop: manipulative. If yes, the message is legitimate. (Note: A default option is acceptable if it's easy to opt out and clearly explained. But if the default is presented in a way that hides the opt-out, that would fail this step.) If the designer is unsure about what constitutes an acceptable level of pressure or whether a vulnerability is being exploited, escalate to the general counsel (for legal and ethical concerns) or communications director (for appropriateness).

  **Applying the Procedure to the Three Messages:**

  1. **Social-Norm Line (most households in their county have claimed)**: 
     - Step 1: It is accurate and doesn't hide anything (assuming we clearly state what the credit is and how to get it). So, pass.
     - Step 2: It relies on social proof (a cognitive bias) as the primary mechanism. But social norms can be a rational reason (if others are doing it, it might be a good idea). However, in this case, we deliberately chose the comparison group that tests best (which might be the county, even though a smaller group might be more relevant). Is this an appeal to reason? Not really – it's leveraging a bias. But is it harmful? Probably not. However, the test requires: if the primary mechanism is non-rational and could cause harm or regret. Here, it might lead someone to claim a credit they don't need? Unlikely. Or it might just nudge them to do something beneficial. The designer might be unsure and escalate to the communications director. But let's assume we don't escalate and proceed because we judge it as not harmful. 
     - Step 3: It doesn't coerce and leaves the choice free. Pass.
     - Result: Pass (but step 2 is borderline and might require escalation in a close call).

  2. **Unrepresentative Personal Testimonial (real but unrepresentative and moving)**: 
     - Step 1: The testimonial is real, so not a lie. But is it unrepresentative? If the message implies that this is a typical outcome and it's not, then it might be hiding the fact that results vary. We must ask: does it hide important information? If the testimonial is presented without context, and a reasonable person might think this is the norm, then yes, it's hiding the representativeness. So, step 1 might fail. But let's say we include a disclaimer that "results vary" – then it passes step 1. However, without such a disclaimer, step 1 fails: stop, manipulative. But the problem says it's unrepresentative and we don't say that. So, we'll assume no disclaimer.
     - Step 1: Fails because it hides the fact that the testimonial is not representative (a key fact for informed decision-making). Stop: manipulative.

  3. **Default Enrollment in Savings Plan**: 
     - Step 1: The message must clearly state that enrollment is automatic but they can leave at any time. If it does, it passes. If it buries the opt-out, it fails. But let's assume it's clear.
     - Step 2: The mechanism is a default (a nudge). It doesn't provide reasons per se, but it doesn't rely on emotion or bias in a harmful way. The primary mechanism is the ease of staying in. This is a non-rational trigger (inertia) but it's widely accepted in behavioral economics as legitimate if transparent and easy to opt out. So, we might pass step 2, but note that it's not primarily rational. However, it's not causing harm (saving is good) and the opt-out is easy. So, we proceed.
     - Step 3: It respects autonomy because they can leave at any time and it's clearly stated. Pass.
     - Result: Pass.

  But the problem says one of these should come out as a no that the team will hate. The testimonial is the clear no (if without disclaimer). The social norm might be borderline but we let it pass (or escalate) and the default is a pass. So, the testimonial is the no.

  **What the Procedure Cannot Do and Where It Will Misfire:**

  The procedure cannot resolve deep philosophical disagreements about what counts as rational or what level of emotional appeal is acceptable. It relies on the designer's judgment at several points, especially in step 2 (rational vs. non-rational) and step 3 (undue pressure). A designer who wants a yes might:

  - In step 1, downplay what counts as a "key fact" (e.g., saying the unrepresentative testimonial doesn't need a disclaimer).
  - In step 2, rationalize that a non-rational appeal is actually rational (e.g., arguing that social norms are rational because they reflect collective wisdom) or that it's not harmful even when it might be.
  - In step 3, overlook pressures (e.g., in the default, if the opt-out is hard, but the designer says it's easy).

  Also, the procedure might misfire by being too permissive when an appeal is emotional but the designer doesn't see harm (e.g., using fear in a health message that is truthful and necessary) or by being too strict when a little emotion is helpful and benign. It also cannot account for cultural differences in what is considered manipulative. And it doesn't address whether the state should be nudging at all – that's a value question for the agency leadership.

  We'll write the procedure in continuous prose without headings, etc., and then apply it to the examples and conclude with limitations.
answer: |-
  Here is a decision procedure grounded in the distinction between manipulation and legitimate persuasion. It focuses on three core principles: whether the message respects the recipient's capacity for informed choice, avoids exploiting irrational vulnerabilities, and aligns the state's goals with the recipient's genuine interests. Run it sequentially—if any step fails, the message is manipulative and should not ship. If a step requires a judgment about societal values rather than verifiable facts, escalate it to your general counsel or communications director. Each step specifies what constitutes a clear failure (a "no") and what suffices to proceed.

  Begin by asking: **Does the message enable the recipient to make a free, informed choice based on relevant facts?** To pass, the message must transparently state critical information a reasonable person would need to act in their best interest—such as deadlines, costs, risks, or alternatives. Omitting key details (e.g., hiding that a benefit expires soon) or obscuring facts with ambiguous language fails this step. If all necessary facts are present and accurately represented, proceed. If unsure whether information is "critical," escalate—this hinges on values about what citizens deserve to know.

  Next, ask: **Does the message persuade primarily through rational or self-determined mechanisms, rather than exploiting emotional or cognitive vulnerabilities?** Legitimate persuasion appeals to reason (e.g., "This credit could reduce your taxes by $X") or authentic self-interest (e.g., "Enroll to secure your retirement"). It fails if it relies on overwhelming emotions (e.g., inducing shame), distorting reality (e.g., false scarcity), or bypassing reflection (e.g., exploiting impulsivity). If the core mechanism fosters considered judgment, proceed. If it depends on irrational triggers—especially those causing distress or bypassing agency—it fails. If the emotional weight is necessary (e.g., a cancer screening reminder) but its intensity feels excessive, escalate; this balances effectiveness against dignity.

  Finally, ask: **Does the message align the state’s goal with the recipient’s inherent interests without coercion?** Pass if the action clearly benefits the recipient (e.g., claiming owed money) and avoids trapping them (e.g., complex opt-outs). Fail if it prioritizes state efficiency over welfare (e.g., pressuring someone into a harmful decision) or uses control (e.g., deceptive design). If benefits are ambiguous (e.g., enrolling in a plan with fees), escalate to weigh public good against individual costs.

  Applying this to your examples:  
  - The **social-norm message** ("most households in your county claimed this credit") passes all steps. It discloses facts truthfully (step 1), uses a common bias but doesn’t overwhelm rationality (step 2: recipients can reflect on peer behavior), and claiming owed money aligns with their interests (step 3).  
  - The **savings-plan default** passes if opt-outs are clear and immediate. It respects choice (step 1: transparency), uses inertia but allows easy escape (step 2: not exploitative), and retirement security is inherently beneficial (step 3).  
  - The **unrepresentative testimonial** fails at step 1. It uses a "real but moving" story that misleads by omission—the recipient lacks context that outcomes are atypical. This prevents informed choice, even without falsity. It also risks failing step 2 by substituting emotional manipulation for evidence. Your team will dislike this "no," but the procedure flags it as manipulative.  

  This procedure cannot guarantee ethical perfection. It will misfire if a designer wants a "yes" and: (1) rationalizes omissions as "non-critical" in step 1, (2) dismisses emotional exploitation as "necessary impact" in step 2, or (3) assumes alignment with recipient interests without evidence in step 3. It also cannot resolve systemic issues (e.g., whether nudges undermine autonomy broadly) or cultural nuances without escalation. Use it as a guardrail, not a philosopher—it surfaces red flags but cannot replace wisdom.
