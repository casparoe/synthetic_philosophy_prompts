prompt: |-
  I am a doctoral student in philosophy working on the metaethical implications of Quine's naturalism. Please explain the conceptual issue that arises when one tries to reconcile Quine's holistic account of knowledge—on which our beliefs face the test of experience as a corporate body and no belief is in principle immune to revision—with his remarks suggesting that moral values are not straightforwardly answerable to empirical evidence and are not part of the true theory of the world. I am particularly interested in whether Quine can consistently hold that moral values are inculcated rather than discovered while also denying that they are merely emotive or arbitrary. Then consider the following modification: suppose we treat moral commitments as part of the web of belief but as governed by a different direction of fit, so that they are revised not by empirical recalcitrance but by social coordination. Does this preserve Quine's naturalism, or does it introduce a normative dimension that his austere naturalism cannot accommodate? Finally, explain what this implies for the status of moral disagreement: in what sense, if any, can two communities disagree substantively about values rather than merely express different inculcated attitudes, and how does that differ from disagreement in empirical belief?
reasoning: |-
  Okay, let's tackle this doctoral student's query. They're working on Quine's naturalism and metaethics, specifically the tension between his holism and his views on moral values. 

  First, I need to recall Quine's core ideas: his web of belief where all beliefs are interconnected and revisable, but then his assertion that moral values aren't empirically testable like scientific claims. The student wants to know if Quine can consistently say values are "inculcated not discovered" without reducing them to mere emotions or arbitrary preferences.

  Hmm, the inconsistency seems clear here. If all beliefs are part of the web and subject to revision, why are morals excluded? Quine's naturalism pushes for a unified epistemology, but his treatment of morals feels like a carve-out. Maybe he's trying to avoid both non-naturalism and emotivism? But is that sustainable?

  Then the student proposes a solution: keep morals in the web but with a different "direction of fit"—revised through social coordination rather than empirical evidence. Interesting! But would Quine accept this? His naturalism is so austere; introducing social coordination as a revision mechanism might feel like smuggling in normativity. Social facts are empirical though... maybe it could work? But "coordination" implies normative goals like social harmony, which Quine would likely reject as non-natural.

  For moral disagreement—this is crucial. If values are inculcated attitudes, disagreements are just clashing preferences. But if we treat them as belief-like within a socially-adjusted web, maybe disagreements become more substantive, about how best to coordinate society. Still, without truth-aptness, it's not like arguing over electrons. The student needs to decide if this quasi-cognitive status is enough for their metaethics. 

  The student seems sharp—they've pinpointed exactly where Quine's framework strains. Their proposed fix is creative but risks violating naturalism's spirit. I should emphasize that last point: even if technically naturalistic (since social facts are natural), Quine would probably hate the normative flavor. The disagreement analysis feels promising though—it offers more robustness than emotivism while avoiding non-naturalism. Not fully Quinean, but maybe the best salvage operation.
answer: |-
  Your inquiry cuts to the heart of a profound tension in Quine's naturalism. Let's dissect the conceptual issues step-by-step, addressing your core questions about reconciling holism with moral epistemology, the status of "inculcation," the proposed modification, and the implications for moral disagreement.

  ### 1. **The Core Tension: Holism vs. Moral Non-Cognitivism**
     - **Quine's Holism ("Web of Belief"):** All beliefs (logical, mathematical, scientific) form an interconnected web facing "the tribunal of sense experience" as a corporate body. *Any* belief, in principle, is revisable to accommodate recalcitrant experience (e.g., revising logic to simplify quantum mechanics).
     - **Quine on Moral Values:** Moral judgments are "not in the world" (*Theories and Things*); they lack empirical content and are not part of the "fabric of the world" we discover. Values are "inculcated" through social conditioning, not discovered via empirical evidence. They resemble "symptoms" of conditioning rather than truth-apt assertions (*Pursuit of Truth*).

     **The Inconsistency:**  
     If *all* beliefs face empirical testing holistically, moral judgments (as part of the web) should be empirically revisable. Yet Quine excludes them, treating them as non-cognitive outputs of conditioning. This creates a **categorical dualism** within his naturalism:
     - *Descriptive beliefs* (science): Truth-apt, empirically constrained, revisable.
     - *Moral values*: Non-truth-apt, empirically unconstrained, products of conditioning.

     Quine tries to avoid emotivism by grounding values in natural facts (social conditioning), but this risks reducing morality to *arbitrary* conditioning unless he can explain how moral discourse functions differently while remaining naturalistically respectable.

  ### 2. **Can Values Be "Inculcated Not Discovered" Without Being Arbitrary?**
     Quine *can* consistently hold this position **only if** he provides a naturalistic account of how inculcation:
     - Is responsive to objective social/biological constraints (e.g., promoting survival, cooperation).
     - Allows for rational critique within a community (e.g., coherence with other beliefs).

     **Quine's Limited Resources:**  
     He gestures toward this by linking values to evolutionary and cultural conditioning (*From Stimulus to Science*). For example:
     - Pro-social values (e.g., honesty) may be selected for promoting group survival.
     - Moral disagreement reflects divergent conditioning, not factual error.

     **The Challenge:**  
     Without truth-aptness, moral judgments lack cognitive substance. Calling them "non-arbitrary" only means they arise from *causes* (social/biological pressures), not *reasons*. This collapses into a **sophisticated relativism**: Values are "non-arbitrary" relative to a community's conditioning but lack normative authority beyond it.

  ### 3. **Modification: Moral Commitments in the Web with "Direction of Fit"**
     Your proposal treats moral commitments as part of the web but revised via **social coordination** (e.g., negotiation, discourse, institutional change) rather than empirical recalcitrance. Direction of fit:
     - *Empirical beliefs*: Mind-to-world (revised when mismatching experience).
     - *Moral commitments*: World-to-mind (revised when mismatching social goals/coordination needs).

     **Preserving Naturalism?**  
     - **Yes**, if "social coordination" is understood naturalistically as:
       - Patterned behaviors (e.g., norms, punishments, rewards).
       - Biological/psychological mechanisms (e.g., empathy, reciprocity).
       - Institutional facts (e.g., laws, customs).
       These are empirical phenomena Quine accepts.
     - **No**, if "coordination" implies irreducible normativity (e.g., "oughts" of rationality or justice). Quine's naturalism rejects non-empirical norms.

     **Quine's Austere Naturalism vs. the Proposal:**  
     - The modification **stretches Quinean naturalism** but doesn’t necessarily break it. Social coordination is observable and describable scientifically (e.g., sociology, game theory). However:
       - It introduces **functional normativity**: Moral commitments serve goals (e.g., social stability, flourishing), which are natural facts but imply instrumental "oughts."
       - Quine might resist this as smuggling in "second-grade" normativity (*Word and Object*). He tolerates *epistemic* norms as scientific hypotheses, but moral norms lack empirical anchors.

  ### 4. **Implications for Moral Disagreement**
     Under this modified view, moral disagreement becomes substantive yet distinct from empirical disagreement:

     | **Aspect**               | **Empirical Disagreement**                          | **Moral Disagreement (Modified View)**               |
     |---------------------------|-----------------------------------------------------|------------------------------------------------------|
     | **Grounds**               | Recalcitrant experience, predictive failure.        | Failure of social coordination (conflict, instability). |
     | **Resolution Method**     | Experiment, observation, theoretical simplification. | Dialogue, negotiation, institutional reform.         |
     | **Cognitive Status**      | Truth-apt; aims at factual accuracy.                | Functionally normative; aims at social coherence.    |
     | **Substantiveness**       | Yes: One belief is objectively better fitted to evidence. | **Yes, but contextually**: One commitment better serves shared goals (e.g., welfare, fairness) in a given context. |

     **Key Implications:**
     - **Against Mere Attitude Expression:** Disagreements are about *how to coordinate society* given shared goals (e.g., "Slavery undermines social trust"). This is objective relative to goals but lacks mind-independent truth.
     - **Relativity to Frameworks:** Substantive disagreement requires overlapping goals/values. If communities have radically different goals (e.g., survival vs. aesthetic purity), disagreement may reduce to clashing frameworks.
     - **Naturalistic Explanation:** Disagreements arise from:
       - Conflicting empirical beliefs (e.g., "Does capital punishment deter crime?").
       - Conflicting interests/priorities (e.g., liberty vs. equality).
       - Divergent social conditions (e.g., scarcity vs. abundance).

  ### Conclusion: A Coherent Quinean Metaethics?
  Quine’s official position is unstable: Holism demands moral judgments be testable; his moral non-cognitivism exempts them. Your modification offers a **naturalistically viable path**:
  1. Moral commitments are empirical (part of the web) as patterns of social behavior.
  2. Revision occurs via social coordination—a natural process observable in cultural evolution.
  3. Moral disagreement is substantive when framed by shared goals (e.g., human flourishing), resolvable through empirical/social inquiry.

  **However:** This requires relaxing Quine’s strict fact/value dichotomy. Moral discourse gains "cognitive-ish" status by serving functional roles in social systems—a move compatible with **neo-pragmatist** (e.g., Deweyan) or **functionalist** naturalisms but only partially Quinean. For Quine, the "true theory of the world" remains purely descriptive, leaving values as natural facts *about* human psychology, not normative guides. Your approach bridges this gap but at the cost of Quine’s austere ontology. 

  This framework positions moral disagreement as **pragmatically substantive**—not about mind-independent truths but about optimal social coordination under empirical constraints—offering a robust alternative to both non-naturalism and emotivism while preserving naturalism’s core.
