  First, I recall existing philosophical concepts. The Problem of the Many deals with vague boundaries but focuses on spatial overlap. Sorites Paradox handles gradual change leading to categorical shifts but doesn't involve criterion switching. Equivocation is about ambiguous terms, but here it's about shifting criteria for counting persons. 

  The user's scenario involves two coherent criteria: numerical identity (continuous persistence) and genidentity (stage-wise connections). The key issue is the unacknowledged switch between them mid-argument. This isn't covered by existing terms. 

  Coining a new term seems necessary. "Criterial shift" comes to mind, but it's too broad. "Identity Criterion Equivocation" captures the deception but overemphasizes intentionality. "Persistential Switch" combines persistence and existential claims, highlighting the unnoticed toggle. 

  Defining "Persistential Switch": It requires (1) two legitimate counting criteria (numerical vs. genidentity), (2) an unacknowledged mid-argument switch between them to reach a conclusion, and (3) the switch resolving a contradiction that would arise if one criterion were used consistently. 

  Boundaries matter: If the switch is explicit, it's a strategy, not a fallacy. If criteria aren't both legitimate, it's just a mistake. The unnoticed aspect is crucial—it's what makes the argument misleadingly persuasive. 

  The user might also want to teach others how to spot this in debates, so clarity on the mechanism (numerical→genidentity switch) is key. They'll likely use this term to dissect discussions on brain uploading or fission cases, making precision vital.
answer: |-
  Based on my work in the metaphysics of personal identity, I recognize this phenomenon immediately. It's a pernicious and subtle fallacy that undermines many debates about persistence. After considering several candidate labels (**Criterial Shift Fallacy**, **Identity Counting Equivocation**, **Persistential Switch**, **Continuant-Genidentity Toggle**), the most precise and useful term is **Persistential Switch**.

  **Definition:**
  A **Persistential Switch** occurs when an argument about personal identity over time:
  1.  **Implicitly employs two distinct criteria** for determining "how many persons exist" or "whether a person persists":
      *   **Numerical Identity Criterion (Continuant View):** Focuses on the entity as a single, continuous whole persisting through change (e.g., the organism, the brain as a biological continuant).
      *   **Genidentity Criterion (Stage/Psychological View):** Focuses on the connections (e.g., psychological continuity, physical realization) between person-stages at different times to determine persistence, allowing for potential branching or termination of identity.
  2.  **Switches between these criteria mid-argument** without acknowledgment.
  3.  **Uses this unacknowledged switch** to resolve an apparent contradiction or reach a desired conclusion (e.g., "You survive *this* step" vs. "You don't survive *that* step") that wouldn't follow consistently from either criterion alone.
  4.  **Relies on the intuitive plausibility of each criterion in isolation**, but leverages the ambiguity created by their incompatibility when combined surreptitiously.

  **Why "Persistential Switch"?**
  *   **"Persistential":** Combines "persistence" and "existential" – directly addressing the core question of *whether a person continues to exist*.
  *   **"Switch":** Explicitly denotes the act of changing the operative criterion.
  *   It avoids implying mere vagueness (like Sorites) or lexical ambiguity (like equivocation), pinpointing the *structural* flaw of switching counting principles.

  **Distinguishing it from Neighbors:**

  1.  **Problem of the Many:**
      *   **Focus:** Spatial vagueness – many overlapping candidates for being *a single object* at a *single time* (e.g., which cloud droplets are part of *the* cloud?).
      *   **Key Difference:** The Persistential Switch is fundamentally about *diachronic counting* (identity *over time*) and the *tacit switching* between criteria, not synchronic spatial vagueness. A Problem of the Many might exist at a single stage, but the Switch happens *across* stages in an argument.

  2.  **Sorites Paradox:**
      *   **Focus:** The challenge of drawing a sharp boundary in a continuum (e.g., when does removing one neuron stop being *you*?).
      *   **Key Difference:** Sorites highlights the *vagueness inherent in a single predicate/criterion* (e.g., "is the same person as"). The Persistential Switch exploits the existence of *two distinct, non-equivalent criteria* and *switches* between them to avoid facing the Sorites challenge head-on within a single framework. The Switch uses the Sorites-susceptibility of *each* criterion to mask the inconsistency of using *both*.

  3.  **Equivocation:**
      *   **Focus:** Using the *same word* with different meanings in an argument (e.g., "light" meaning not heavy vs. electromagnetic radiation).
      *   **Key Difference:** The Persistential Switch isn't about the meaning of a *word* like "person" changing. It's about changing the *operational criterion or principle* for counting persons or judging persistence over time. Both sides might agree on the *meaning* of "person" (e.g., a conscious being), but disagree fundamentally on what *grounds* its persistence (biological continuity vs. psychological connectedness). The Switch surreptitiously changes the grounding criterion.

  **Boundaries and Nuances:**

  *   **Must the switch be unnoticed?** Yes. This is crucial. If an argument explicitly acknowledges using two distinct criteria and argues for why one applies in one context and another in a different context *within the same scenario*, that might be a substantive metaphysical claim (e.g., endorsing a pluralist view), not necessarily a fallacy. The *fallacy* lies in the *unacknowledged* switch used to generate an inconsistent conclusion.
  *   **Must both criteria be "legitimate"?** Generally, yes, for the fallacy to be persuasive and interesting. If one criterion is clearly incoherent or rejected by all parties, switching to it would just be a mistake. The power of the Persistential Switch comes from both criteria having independent intuitive or theoretical plausibility (e.g., Continuant view seems right for everyday persistence; Genidentity view seems right for fission cases or radical psychological discontinuity).
  *   **What if the person is aware?** If the arguer is *fully aware* they are switching criteria *and* does so *intentionally* to deceive, it's still a Persistential Switch, but now it's deliberate sophistry. If they are aware and explicitly justify the switch within their argument, it becomes a different (and controversial) metaphysical argument, not the *fallacy* of the unacknowledged switch.
  *   **The Mechanism in Your Examples:**
      *   **Gradual Replacement:** "Survives step 47" relies on **Numerical Identity** (it's the same continuous brain/organism undergoing change). "Isn't you at the end" relies on **Genidentity** (the psychological/physical connections to the original stage are too weak/different). The switch happens between justifying survival at an intermediate stage and denying it at the endpoint.
      *   **Fission:** "The original is gone" might rely on **Genidentity** (branching means neither successor is *uniquely* continuous with the original). "Each half-brain is a person" might rely on **Numerical Identity** applied *synchronicall*y to the post-fission stage (each is *a* distinct organism/continuant). The switch conflates synchronic counting with diachronic identity criteria.
      *   **Two Half-Brains (Synchronic):** "Are they one person?" using **Numerical Identity** (one organism/brain). "Are they two persons?" using **Genidentity** (two distinct streams of consciousness/psychological continuants). Arguments often slide between these criteria without specifying which "counting" principle they are using.

  **Conclusion:**
  The **Persistential Switch** is the precise fallacy you're encountering. It's distinct from Sorites (which exploits vagueness within *one* criterion) and the Problem of the Many (which concerns spatial overlap at *one* time). While related to equivocation, it targets the unacknowledged shift in the *grounding principle* for counting/persistence judgments over time, not the meaning of a word. Its core elements are the existence of two plausible criteria (Numerical Identity vs. Genidentity), the unacknowledged switch between them mid-argument, and the use of this switch to resolve an inconsistency that would arise if one criterion were applied consistently. This fallacy thrives in precisely the gradual change and branching scenarios central to modern personal identity debates. Naming it gives you the tool to dissect those arguments cleanly.
