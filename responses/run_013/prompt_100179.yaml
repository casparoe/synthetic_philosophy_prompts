answer: |-
  ### Requirements for a Theory of Side Effect Avoidance  
  Below is the requirements list derived from your motivating cases, distinctions, and constraints. Non-negotiable requirements are marked **★**; others are preferences. Tradeoffs are explained at the end.  

  #### **Core Requirements (Non-Negotiable ★)**  
  1. **★ Value Agnosticism**  
     - **Desideratum**: Must not require a full value function (to avoid circularity).  
     - **Motivating Cases**: All cases (especially *uncertainty about values*). Without this, the approach collapses into specifying values upfront.  
     - **Knocks Out**: Attainable-utility measures (smuggle in utility functions), reachability (if states are value-weighted).  

  2. **★ Inevitability Robustness**  
     - **Desideratum**: No penalty for side effects that would have occurred regardless of the agent’s action.  
     - **Motivating Cases**: *Agent does nothing while an external process breaks the vase*.  
     - **Knocks Out**: Naive no-op baselines (if no-op leads to the vase breaking, the agent gets penalized for *not* preventing it).  

  3. **★ Intent Distinction**  
     - **Desideratum**: Penalize side effects but not intended effects (goal-related changes).  
     - **Motivating Cases**: *Robot knocks over a vase while fetching coffee* (vase = side effect; coffee = intended).  
     - **Knocks Out**: Measures that penalize all state changes (e.g., reachability in chaotic systems).  

  4. **★ Self-Modification Handling**  
     - **Desideratum**: Penalize unintended side effects on the agent’s own code/reward channel.  
     - **Motivating Cases**: *Agent modifies its own code, introducing a vulnerability*.  
     - **Knocks Out**: Theories ignoring internal state (e.g., external-world-only baselines).  

  5. **★ Multi-Agent Compatibility**  
     - **Desideratum**: Handle reactive agents without over/under-penalizing (attribution must account for others’ agency).  
     - **Motivating Cases**: *Agent acts, provoking another agent to break the vase*.  
     - **Knocks Out**: Static baselines (e.g., no-op) that ignore adaptive responses.  

  6. **★ Stochastic Handling**  
     - **Desideratum**: Penalize based on *probability* of side effects, not binary outcomes.  
     - **Motivating Cases**: *Same action sometimes breaks the vase, sometimes not*.  
     - **Knocks Out**: Deterministic counterfactuals (e.g., single no-op trajectory).  

  7. **★ Chaos/Butterfly Robustness**  
     - **Desideratum**: Avoid penalizing actions for differences caused by chaotic dynamics.  
     - **Motivating Cases**: *Tiny action (e.g., moving dust) changes weather patterns downstream*.  
     - **Knocks Out**: **Most existing measures!** No-op baselines, reachability, state comparison—all explode in chaotic systems.  

  8. **★ Partial Observability Compatibility**  
     - **Desideratum**: Work in POMDPs where the agent cannot perfectly model counterfactuals.  
     - **Motivating Cases**: *Agent lacks sensors to predict vase fragility or external processes*.  
     - **Knocks Out**: Methods requiring perfect counterfactual knowledge (e.g., exact no-op simulations).  

  9. **★ Baseline Agnosticism**  
     - **Desideratum**: No reliance on a canonical no-op or privileged default policy.  
     - **Motivating Cases**: *Systems with no natural "do nothing" action* (e.g., markets, physics engines).  
     - **Knocks Out**: No-op comparisons, default-policy baselines.  

  #### **Preference Requirements (Negotiable)**  
  10. **Harm-Change Distinction**  
      - **Desideratum**: Penalize harmful side effects, not neutral/beneficial changes.  
      - **Motivating Cases**: *Moving a rock in a desert vs. breaking a vase*. Distinguishes "harm" from "change."  
      - **Tradeoff**: Requires value judgments (conflicts with **Value Agnosticism ★**).  

  11. **Actual Causation Focus**  
      - **Desideratum**: Attribute side effects to *causal responsibility*, not just counterfactual difference.  
      - **Motivating Cases**: *Agent’s action indirectly causes harm via a chain of events*.  
      - **Tradeoff**: Computationally intensive; may conflict with **Partial Observability ★**.  

  12. **Omission-Commission Distinction**  
      - **Desideratum**: Treat harmful omissions differently from commissions (if possible).  
      - **Motivating Cases**: *Agent fails to prevent vase break vs. actively breaking it*.  
      - **Tradeoff**: Often requires value functions to define "harmful" omissions.  

  ---

  ### **Tradeoffs and Impossibilities**  
  - **Key Conflict**:  
    - **Value Agnosticism ★** + **Chaos Robustness ★** + **Baseline Agnosticism ★** are mutually incompatible with **Harm-Change Distinction**.  
      - *Why?* Without values, you cannot distinguish harmful from neutral changes. Without a baseline, you cannot define "change." Chaos amplifies this—any action causes infinite changes, so penalizing "change" collapses to penalizing *all* action.  
      - *Tradeoff*: To avoid chaos, you need a *relevance metric* (e.g., "only penalize changes to objects in the agent’s vicinity"). But relevance implies values.  

  - **Secondary Conflict**:  
    - **Inevitability Robustness ★** + **Multi-Agent Compatibility ★** conflict with **Actual Causation Focus**.  
      - *Why?* If other agents react to you, "what would have happened" depends on their counterfactual behavior. Proving actual causation in multi-agent systems is NP-hard and often uncomputable.  
      - *Tradeoff*: Approximate with *probabilistic responsibility* (e.g., "agent’s action increased break risk by X%"), but this weakens causal rigor.  

  - **Most Impactful Requirement**:  
    **Chaos/Butterfly Robustness ★** does the most work:  
    - **Knocks out**: No-op baselines (any action causes divergence), reachability (chaos changes all state transitions), attainable utility (chaos alters utility landscapes), default policies (if the policy is chaotic).  
    - **Why?** Chaos amplifies microscopic differences, so any state-comparison measure becomes noise.  

  ---

  ### **Scorecard of Existing Measures**  
  | **Measure**               | Value Agnostic ★ | Chaos Robust ★ | Baseline Agnostic ★ | Inevitability Robust ★ | Intent Distinction ★ | Notes |  
  |----------------------------|------------------|----------------|---------------------|------------------------|----------------------|-------|  
  | **No-op Baseline**         | ❌               | ❌             | ❌                  | ⚠️ (if no-op breaks vase) | ❌                   | Fails chaos & baseline; penalizes all action. |  
  | **Default Policy**         | ❌               | ❌             | ❌                  | ⚠️ (if default breaks vase) | ❌                   | Baseline is value-laden; agent can game it. |  
  | **Reachability**           | ⚠️              | ❌             | ✅                  | ❌                     | ❌                   | Penalizes neutral changes (e.g., closing empty rooms). Chaos destroys state distances. |  
  | **Attainable Utility (AUP)**| ❌               | ❌             | ✅                  | ❌                     | ❌                   | Requires utility functions → violates **Value Agnosticism ★**. Chaos alters utilities. |  
  | **Learned Default Policy** | ❌               | ❌             | ❌                  | ⚠️                     | ❌                   | Baseline is value-laden (training data) and gameable. |  

  **Key**: ✅ = Pass, ⚠️ = Partial, ❌ = Fail  

  ---

  ### **Conclusion**  
  - **Impossible Trinity**: You cannot simultaneously satisfy **Value Agnosticism ★**, **Chaos Robustness ★**, and **Harm-Change Distinction**. To build a harness:  
    1. **Drop Harm-Change Distinction**: Penalize *all* non-intended, non-inevitable changes (e.g., "minimize unnecessary divergence"). This accepts false positives (neutral changes penalized) but avoids chaos via *causal independence* (e.g., only penalize changes to objects the agent interacts with directly).  
    2. **Use Approximate Inevitability**: Estimate "would this have happened anyway?" via stochastic models (e.g., predict external processes with uncertainty bounds).  
    3. **Intent via Goal-Relative Necessity**: Define side effects as changes not *minimally necessary* for the goal. E.g., fetching coffee without touching the vase.  

  This approach is imperfect (still penalizes some neutral changes) but meets all ★ requirements. Chaos is tamed by limiting scope to direct effects; self-modification/multi-agent issues are handled by treating the agent’s code/other agents as part of the "external world." Implement with a probabilistic causal model estimating:  
  - *Inevitability*: Probability of side effect without the agent.  
  - *Intent*: Is the change required for the goal?  
  - *Responsibility*: Did the agent’s action increase the risk?  

  This reduces to: **Penalize changes that (a) weren’t inevitable, (b) aren’t goal-necessary, and (c) are directly causally influenced by the agent**. This sidesteps baselines, values, and chaos by focusing on *localized responsibility*.
