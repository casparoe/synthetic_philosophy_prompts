prompt: |-
  you're a decision theorist — someone who actually works on rational choice and game theory and has thought hard about the ugly cases, not just the textbook ones. think carefully before you answer, and feel free to start by brainstorming the space of cases for yourself, but don't show me that part.

  here's the setup. i'm writing a spec for the decision procedure of an AI agent that has to operate with its source code readable by the other players — so whatever disposition it has is common knowledge, and anyone can predict what it'll do in any situation its code covers. i keep running into the same famly of problems: cases where the agent does better by being the sort of thing that will do the worse-looking thing. the hitchhiker is the toy version (you only get the ride if you'd pay at the other end, but once you're in the car you won't pay, and the driver knows all this). the toxin puzzle is the other one (a pile of money for forming the intention tonight to drink something foul tomorrow, when the money is already settled by the time tomorrow comes). and then the everyday version: i'm better off over a life if i'm the sort of person who never breaks a confidence, even though in some one-off case breaking it would pay.

  before i look at any actual theory i want the requirements list. what does a theory of practical rationality have to deliver to be adequate here? for each requirement, give me the case or consideration that motivates it. i especialy want:

  - the distinctions it can't collapse: between evaluating an act and evaluating the disposition that produced it; between cases where my disposition changes the payoff causally (the driver sees what kind of thing i am and decides to stop) and cases where it merely correlates with it; between a commitment i get to choose before i'm in the situation and one i'm stuck with once i'm in it; between what's rational for me and what i can actually reason my way to in real time.
  - the cases it has to get right, including these two i made up, which i care about more than the classics: (a) the pre-emptive burn — the offer only comes if i've already, irreversibly given up my alternative, and i have to decide whether to burn before i know whether the offer is even coming, so the theory has to say something about committing under uncertainty about which game i'm in; (b) the glass-box case — the agent's code is read by an auditor, and the same action is best when the code is readable and terrible when it isn't, so the theory can't just fall back on maximizing what's best given the information the agent has.
  - the consistency requirements: what results from decision theory or from logic it can't contradict. here's the one i most want your view on. it looks like you can't have all three of (i) always do the act with the best consequences given your beliefs, (ii) do what the best disposition would do, and (iii) judge acts and dispositions by the same standard, without a contradiction in the hitchhiker case. is that right? if so, which of the three is the culprit, and if not, show me where the escape is.

  mark which requirements are non-negotiable and which are just the taste of one camp — e.g. whether the theory has to be usable by the agent in real time, whether it has to be 'internalist', whether it's allowed to treat the agent's own dispositions as fixed data. a table is fine for that part, but the reasoning matters more than the table.

  lead with your bottom line in the first sentence — the single requirement you think does the most work — then give the reasoning. no preamble, no restating what i asked. and don't give me a survey of the literature or a reading list; i want the spec.
reasoning: |-
  Hmm, this is a fascinating challenge from someone deeply familiar with decision theory. They're building an AI spec where the agent's code is public, creating commitment problems like the hitchhiker's dilemma and toxin puzzle. They want requirements for a rationality theory that handles these cases, with emphasis on their custom scenarios (pre-emptive burn, glass-box) and the three-way tension between act-consequentialism, disposition evaluation, and unified standards.

  First, the core issue: public code turns dispositions into strategic variables. In the hitchhiker case, being the type who pays gets you the ride, but once in the car, not paying is better. The key requirement must be that rationality depends on the agent's causal architecture - whether it's deciding acts or choosing dispositions. This resolves the tension: disposition-choice maximizes expected utility across games, while act-choice maximizes within a fixed game.

  For their custom cases: Pre-emptive burn requires committing without knowing if the offer comes. The theory must handle disposition-choice under uncertainty about which subgame you're in. Glass-box highlights that the "best act" depends on whether others observe your code - so the theory can't define rationality solely from the agent's momentary perspective.

  The three-way tension: (i) always best act given beliefs, (ii) do what best disposition would do, (iii) same standard for both. In hitchhiker, (i) says don't pay (best act at payment node), (ii) says pay (to get ride), contradiction. The escape is rejecting (i) when dispositions are chosen first - at the disposition-selection stage, "best act" isn't defined yet. So (i) only applies when dispositions are fixed.

  Non-negotiables: The theory must distinguish disposition-selection from act-selection stages. It must be consistent across counterfactuals (if I had different dispositions...). It must handle observable dispositions affecting others' actions. Negotiable: Whether the agent computes this in real-time (could be pre-computed), or whether it's "internalist" (could rely on design-time choices).

  Final structure: Lead with causal-stage distinction as top requirement, then walk through their cases showing how it resolves them, then unpack the three-way tension, and end with negotiation table.
answer: |-
  **The single most critical requirement is distinguishing between the rationality of selecting dispositions ex ante (when the agent can choose its decision rule) and the rationality of selecting actions ex post (when the disposition is fixed).**

  ### Core Requirements & Motivating Cases
  1.  **Non-Negotiable: Stage Distinction (Disposition vs. Action Selection)**
      *   **Motivation:** Pre-emptive Burn, Hitchhiker, Toxin, Everyday Commitment. Resolves the core paradox. *Ex ante* (design/commitment stage), rationality requires choosing the disposition that maximizes expected utility across potential future games/interactions. *Ex post* (within a specific game node, disposition fixed), rationality requires executing the disposition's prescribed action, *even if* a different single action *at that node* seems better *in isolation*. Collapsing stages leads to immediate contradictions (e.g., Hitchhiker: must pay ex post to fulfill the disposition that made the ride possible ex ante, even though not paying ex post seems locally better).
      *   **Handles Pre-emptive Burn:** At the *disposition-selection stage* (before knowing if the offer comes), burning the alternative is rational *if* the expected value of being the type that burned (and thus potentially getting the offer) outweighs the expected value of retaining the alternative. Uncertainty about which game is played is inherent to this stage.

  2.  **Non-Negotiable: Causal vs. Evidential Distinction for Disposition Impact**
      *   **Motivation:** Glass-Box, Hitchhiker. The theory must correctly model *how* the agent's observable disposition causally influences other players' actions (setting up the game structure) versus merely correlating with outcomes. In Glass-Box, the *observability* of the code is what causally triggers the auditor's favorable/favorable action. If the code weren't observable, the auditor wouldn't react. A theory confusing correlation (e.g., "agents who do X tend to be successful") with causation (e.g., "the auditor *sees* I do X and therefore rewards me") fails Glass-Box. "Best given information" isn't enough; the information *includes* how others react to your known disposition.

  3.  **Non-Negotiable: Consistency Across Counterfactuals**
      *   **Motivation:** Logic/Decision Theory Consistency. The theory's evaluation of an action at a node must be consistent with the counterfactual: "What if I had a different disposition?" The disposition-selection stage *requires* comparing counterfactual outcomes under different possible dispositions. It must also avoid Dutch books or dynamic inconsistencies arising from predictable deviations from planned courses of action.

  4.  **Non-Negotiable: Handling Observable Dispositions as Strategy**
      *   **Motivation:** Glass-Box, Hitchhiker. The theory must recognize that the agent's observable disposition is part of the *strategic environment*. Rationality cannot be defined solely based on the agent's local information state at the moment of action; it depends on how the agent's fixed (and known) decision rule shapes the entire game tree encountered. What is rational for a "glass-box" agent can be disastrous for an identical "black-box" agent because the opponent's strategy differs.

  5.  **Resolution of the Three-Way Tension**
      *   **The Contradiction:** In Hitchhiker: (i) "Best act given beliefs" at payment node = Don't Pay. (ii) "Best disposition" = One that Pays. (iii) Same standard = Paying must be best act, or Don't Paying must be best disposition. Contradiction.
      *   **The Escape:** Reject (i) *as universally applicable*. The requirement "always do the act with the best consequences given your beliefs" **only holds at the action-selection stage *when the disposition is already fixed and the game structure is set***. At the disposition-selection stage, this requirement doesn't apply because the agent isn't *choosing an act* within a fixed game; it's choosing the rule that *will* choose acts *in future games whose structure depends on that rule*. The "best disposition" (ii) is evaluated at the disposition-selection stage by comparing expected outcomes across possible dispositions. The action prescribed by the best disposition (Paying) is then rational *ex post* *because* it fulfills the commitment made rational *ex ante*. (iii) The *standard* (maximize expected utility) is the same, but its *application* differs fundamentally between stages. The culprit is applying (i) to the action-selection stage *without recognizing that the disposition is fixed and the game structure was causally determined by that disposition choice earlier*. The theory must explicitly separate these stages.

  ### Negotiability Table
  | Requirement                                 | Non-Negotiable | Negotiable (Camp Taste) | Reasoning                                                                                              |
  | :------------------------------------------ | :------------- | :---------------------- | :----------------------------------------------------------------------------------------------------- |
  | **Stage Distinction (Ex Ante/Ex Post)**     | ✅             |                         | Foundational for resolving commitment paradoxes. Collapse guarantees failure in core cases.            |
  | **Causal vs. Evidential Impact**            | ✅             |                         | Essential for Glass-Box & accurate modeling of how dispositions affect the game. Correlation isn't enough. |
  | **Consistency Across Counterfactuals**      | ✅             |                         | Logical coherence requirement. Avoids Dutch books, ensures meaningful disposition comparison.          |
  | **Observable Dispositions as Strategy**     | ✅             |                         | Core to the public-code spec. Defines the problem domain.                                              |
  | **Same Standard (EU) for Acts & Dispositions** | ✅             |                         | Core normative commitment of consequentialism. Rejecting this is a major shift (e.g., to deontology). |
  | **"Do Best Act Given Beliefs" Always Holds**|                | ✅                      | Must be rejected *ex post* in commitment problems. Some camps (pure EDT, myopic CDT) insist, but they fail the cases. |
  | **Agent Must Compute in Real-Time**         |                | ✅                      | Important for *implementation*, not core theory. Pre-computation (for fixed dispositions) is possible. |
  | **Internalism (Only Accessible Mental States)** |                | ✅                      | The public-code spec *requires* external access to the disposition. Internalism is incompatible.        |
  | **Treat Own Dispositions as Fixed Data**    |                | ✅                      | Crucial *ex post*. *Ex ante*, dispositions are choices. Rejecting this leads to infinite regress (choosing how to choose dispositions...). |
  | **Unique Rational Act per Situation**       |                | ✅                      | Some theories allow permissibility. Often negotiable, but uniqueness can simplify proofs/implementation. |

  **Bottom Line on Requirements:** A theory adequate for this spec must be **two-stage consequentialist**. It explicitly separates the rationality of choosing a decision rule/disposition *before* the game structure is fully fixed (based on expected utility across possible interactions) from the rationality of executing that rule *within* the fixed game structure it helped create (where the prescribed action is rational *because* it fulfills the commitment that made the favorable game possible). It must strictly model the *causal* impact of the observable disposition on others' actions. This framework inherently resolves the three-way tension by restricting "best act given beliefs" to the ex post stage and evaluating dispositions ex ante via counterfactual comparison. The Glass-Box and Pre-emptive Burn cases are handled by correctly attributing the causal power of the observable disposition (Glass-Box) and performing the necessary ex ante calculation under uncertainty (Pre-emptive Burn).
