prompt: |-
  Im on the committee of our local housing co-op. Last week we got a wierd letter from a company called Omega Risk Solutions. It says they've put a termite treatment on our buildings if and only if we either have a termite infestation or we pay them £500. If we pay, then the treatment is there and we don't have termites; if we don't pay, then we do have termites. They claim they predicted our decision perfectly. The treatment would cost us £500, but a termite infestation would cost us £50,000 to fix. Half the committee says we should just pay because if we don't, we'll get termites. The other half says that's crazy—paying them can't cause us to not have termites; the termites are either there or not, and paying a blackmailer just encourages them. We have to decide by Friday. I've been reading about this online and apparently it's a known puzzle. Can you draft the short written opinion I'll circulate before the meeting? It should recommend a concrete course of action with a time frame, and it should engage seriously with the argument that paying is just superstitious, not causal. Please give it as a numbered list of exactly five points, each a sentence or two, no intro or conclusion. British English please.
