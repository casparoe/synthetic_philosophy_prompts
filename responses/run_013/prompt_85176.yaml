  ### Key Design Notes:
  1. **Case-Driven Nodes**: Questions use your specified cases (ring species, oaks, rotifers, etc.) as decision points. No prior knowledge of concepts needed.
  2. **Inseparable Pairs**: 
     - Evolutionary/General Lineage: Both deny discrete speciation thresholds.
     - Phenetic/Morphological: Both prioritize observable traits over processes.
  3. **Empty Combinations**: Diagnosed as:
     - **Incoherent**: Logically contradictory (e.g., ring connectivity + asexual exclusion).
     - **Unexplored**: No known defense (e.g., monophyly + concept-change persistence).
  4. **Axes vs. Leaves**: 
     - *Individuals Thesis*: Cross-cuts realism (species are individuals) vs. anti-realism (classes).
     - *HPC View*: Compatible with process-based concepts (biological/ecological) but not trait-only (phenetic) or rigid monophyly.
  5. **Anti-Realist Branch**: Distinguishes eliminativism (taxa real, category not) from full pluralism (Kitcher/Dupré).
