prompt: |-
  I spent about two hours last night arguing with my friend Priya — she does fieldwork on oaks and willows and has become a born-again nominalist about species, her line is basically that "species" is a filing cabinet we built and then forgot we built — and by the end of it we weren't even arguing about the same thing anymore. She was arguing about whether species are real, I kept arguing about which concept is the right one, and at some point I realised I couldn't tell whether the disagreement was substantive or whether we'd just been sliding between the species category and species taxa for an hour without noticing. So now I want to build a proper decision tree out of it for the philosophy of biology reading group I run (mix of phil grad students and two actual biologists who will be merciless about this). Please build it as a tree where every branch node is a case or a commitment someone can answer *without already knowing the name of the view it leads to* — no nodes like "do you accept the biological species concept?". Start from something like "there's a fact of the matter about how many oak species there are" and work down from there. I want these cases to do the work, because Priya and I kept talking past each other on them: a ring species where the two ends meet and don't interbreed (the Ensatina salamanders around the Central Valley, or the greenish warbler round the Tibetan plateau — the point being that interbreeding isn't transitive); obligately asexual organisms like bdelloid rotifers, and bacteria where genes move sideways between lineages; two oak "species" that hybridise freely wherever they meet and yet stay distinct; a lineage that diverges gradually over a million years with no moment where you could point and say it became two; and the ancestor problem, where if you insist every species is a whole monophyletic branch then the ancestral species has to go extinct the instant it splits, even though nothing happened to the population. Also put a node