prompt: |-
  I serve on the ethics advisory panel of the Lesedi Community Health Trust, a non-profit that runs HIV care and prevention programmes in a region of South Africa where ubuntu is not a line on a brochure but a working idiom: people describe a person as a person through other persons, and a household, rather than an individual, is often what shows up at a clinic, negotiates care, and absorbs a diagnosis. The clinical programme reflects this. When a client tests positive, the counsellor's protocol treats disclosure to a named treatment supporter, usually a relative, as part of the care plan rather than an optional extra; the supporter is enrolled alongside the client, given the same adherence training, and the household is the unit the programme follows up. A client who declines a supporter is still offered care but is routed to a lower-intensity adherence track and coded as unsupported. The research arm, by contrast, runs an observational cohort on treatment outcomes under strictly individual procedures: written consent from the participant alone, a confidentiality rule under which any staff disclosure of a participant's status to a relative is a reportable breach, and a data governance policy in which the participant owns her data and may withdraw it.

  The panel has been asked to advise on a proposal to bring research into line with care: household consent in addition to individual consent, a household-level benefit-sharing arrangement, and a relational confidentiality rule under which a participant's supporter may be told results bearing on the supporter's own health, with or without the participant's agreement. Some members see this as extending the Trust's existing ethic; others see a communitarian paternalism being smuggled into a setting where the individual's interest in controlling information about her own body is the whole point.

  Reconstruct what the existing practices already presuppose. Treating the clinical disclosure protocol and the individual-consent research protocol as two practices of one institution, say what conception of the person each requires or merely fits with, whether they are in genuine tension or presuppose compatible things at different levels of description, and where each is underdetermined among the views that would explain it. Be careful to separate a conception in which relations constitute the person — so that harm to a person is ipso facto a change in her relations, and the relevant unit of consent or standing is partly the relation — from a weaker conception in which relations merely shape a person's formation and capacities while the individual remains the unit of moral concern, and from a merely paternalistic or beneficence-driven rationale that could generate the same protocol with no relational claim at all. Then assess the proposal: which conception it adds, which it drops, and what follows for supporter, client, and household if the panel adopts it.

  Format the answer as a single JSON object, leading with a one-sentence bottom line:

  - "verdict": string — the panel's bottom line.
  - "clinical_protocol": object with "presupposes" (string), "evidence_in_practice" (array of strings naming the specific features that carry the commitment), "strength" (one of "strict presupposition", "fits well but not required", "underdetermined").
  - "research_protocol": same object shape.
  - "relation_between_them": object with "tension" (one of "genuine", "apparent only", "none"), "explanation" (string), "level_of_description" (string).
  - "constitutive_vs_developmental": object with "which_each_protocol_needs" (string) and "what_would_settle_it" (string).
  - "paternalism_rival": object with "could_explain_both" (boolean) and "what_would_distinguish_it" (string).
  - "underdetermination": array of objects with "feature" and "views_that_license_it".
  - "proposal": object with "adds" (string), "drops" (string), "consequences" (object with "for_supporter", "for_client", "for_household").
  - "confidence": number between 0 and 1.
  - "key_uncertainty": string.
reasoning: |-
  We are analyzing two protocols: the clinical care protocol and the research protocol, both under the Lesedi Community Health Trust.

  1. **Clinical Protocol**:
     - Features: Disclosure to a named treatment supporter (relative) is part of the care plan; the supporter is enrolled with the client and given the same training; the household is the unit of follow-up; a client declining a supporter is still offered care but on a lower-intensity track and coded as unsupported.
     - What it presupposes: The protocol treats the household as a unit of care and decision-making, and disclosure to a supporter as integral to care. This suggests a conception of the person as fundamentally relational, where an individual's health and well-being are tied to their household and relationships. The household is the social unit that "absorbs a diagnosis" and negotiates care.
     - Strength: This practice is consistent with a constitutive relational view (where relations are part of what constitutes the person) but might also be explained by a developmental view (relations shape the person) or even by paternalism/beneficence (because it leads to better adherence). However, the fact that the household is the unit of follow-up and the requirement of a supporter as part of the standard care plan (with an alternative for those who decline) suggests a strong commitment to a relational unit. We'll call it "fits well but not required" for the constitutive view because it could be justified by other reasons (like better outcomes) without necessarily accepting the constitutive view.

  2. **Research Protocol**:
     - Features: Written consent from the participant alone; confidentiality rule that any disclosure to a relative is a breach; participant owns her data and may withdraw it.
     - What it presupposes: The individual is the unit of consent, confidentiality, and data ownership. This reflects an individualistic conception of the person as autonomous and having rights over personal information. The protocol is designed to protect individual autonomy and privacy.
     - Strength: This is a "strict presupposition" because the protocol explicitly requires individual consent and treats disclosure to a relative as a breach, which is incompatible with a constitutive relational view. It is built on the idea that the individual is the primary moral unit.

  3. **Relation between them**:
     - Tension: Genuine. The clinical protocol operates on a household/relational level, while the research protocol operates on an individual level. They are at odds in their fundamental unit of moral concern.
     - Explanation: The clinical practice is embedded in the local idiom of ubuntu, which emphasizes that a person is defined through others, while the research protocol follows standard Western bioethical principles that prioritize individual autonomy and confidentiality.
     - Level of description: The clinical protocol is at the level of the household as the social and moral unit, and the research protocol is at the level of the individual as the autonomous agent.

  4. **Constitutive vs Developmental**:
     - Which each protocol needs:
       - Clinical: It is designed in a way that fits a constitutive view (the person is constituted by relations) but could also be explained by a developmental view (relations are important for the person's well-being) or even by a purely instrumental view (better adherence). However, the protocol does not strictly require the constitutive view. It is underdetermined between constitutive and developmental/instrumental.
       - Research: It requires an individualistic view that does not see relations as constitutive in a way that would override individual consent. It is incompatible with a constitutive view that would require household consent.
     - What would settle it: For the clinical protocol, if the Trust's rationale is that the household is the unit of moral concern and that harm to the individual is harm to the household (and vice versa), that would be constitutive. If the rationale is that involving the household leads to better health outcomes (instrumental) or that the individual's capacities are developed in the household (developmental), then it's not constitutive. The research protocol, by design, rejects the constitutive view because it does not allow for relational consent or disclosure.

  5. **Paternalism Rival**:
     - Could explain both: Yes. The clinical protocol could be driven by beneficence (better adherence and outcomes by involving the household) without any commitment to a relational view. The research protocol could be seen as protecting the individual from potential harm by others (paternalism in the form of confidentiality) and ensuring individual control. However, the research protocol is more about autonomy than paternalism.
     - What would distinguish it: The presence of the ubuntu idiom in the community and the Trust's explicit adoption of it in clinical practice would distinguish a constitutive view from mere paternalism. If the clinical protocol is motivated by the belief that the person is constituted by relations and that the household has a moral standing, that would go beyond paternalism.

  6. **Underdetermination**:
     - For the clinical protocol: 
       - Feature: Requiring disclosure to a supporter as part of the care plan.
         Views that license it: (a) Constitutive relational view (the household is part of the person's identity and thus must be involved); (b) Developmental view (the household supports the individual's capacity to cope and adhere); (c) Paternalistic/beneficence view (this leads to better adherence and health outcomes).
       - Feature: Household as the unit of follow-up.
         Views: Same as above.
     - For the research protocol:
       - Feature: Individual consent alone.
         Views that license it: (a) Individual autonomy as paramount; (b) Paternalism (protecting the individual from potential harm by others); (c) Legal or regulatory requirements (which are often individualistic).
       - Feature: Confidentiality rule that disclosure to a relative is a breach.
         Views: (a) Individual right to privacy; (b) Paternalism (to prevent harm from unintended disclosure).

  7. **Proposal**:
     - The proposal: To bring research into line with care by having household consent in addition to individual consent, household-level benefit-sharing, and a relational confidentiality rule (where the supporter may be told results bearing on the supporter's own health, with or without the participant's agreement).
     - Adds: 
       - A constitutive relational view to the research protocol. It treats the household as a unit of consent and benefit-sharing and introduces a relational confidentiality rule that potentially overrides individual consent for the supporter's health.
     - Drops:
       - The strict individual autonomy model in the research protocol (individual consent alone, individual confidentiality, individual data ownership).
     - Consequences:
       - For supporter: Gains a formal role in the research process, may receive health-relevant information without the participant's consent (if the participant disagrees, but the rule allows disclosure without agreement). This could empower the supporter but might also create tension if the participant does not wish to disclose.
       - For client: May feel pressured to include the household in research, and may lose control over personal health information. However, it may align better with the client's relational identity and provide household support.
       - For household: Becomes a recognized unit in research, which may enhance collective benefit and cohesion but might also lead to intra-household conflicts if there are disagreements.

  8. **Verdict** (bottom line): 
     - The panel's bottom line: The proposal replaces the research protocol's individualistic foundation with the clinical protocol's relational one, but risks undermining individual autonomy and privacy in research without clear safeguards for dissent.

  9. **Confidence**: 0.8 (There is some uncertainty about the exact rationale of the clinical protocol and whether the community uniformly accepts the household as the unit.)

  10. **Key uncertainty**: Whether the community's practice of ubuntu uniformly accepts the household as the unit of decision-making in research, and whether individuals within households might have divergent preferences that are not captured by the household consent.

  Now, we format as a JSON object.
