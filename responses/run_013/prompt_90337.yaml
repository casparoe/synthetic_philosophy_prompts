prompt: |-
  I'm building the take-home part of the final for a decision theory course I'm TAing for (mixed advanced-undergrad/grad crowd, about 15 of them, they've done Savage and a bit of game theory but nothing on imperfect recall yet). I want a single essay question on the absent-minded driver that they can't get by just recalling the puzzle and saying "continue, obviously" — which is what half of them will do, and it's not even the interesting part. I'll give them the setup in the question itself so it doesn't hinge on them having memorized it: a driver is going down a road with two intersections one after another. He wants to exit at the second. Exiting at the first gets him 0, exiting at the second gets him 4, and if he just keeps driving past both he ends up with 1. The catch is that he's absent-minded: standing at an intersection he can't tell whether it's the first or the second, and he can't recall whether he's already passed one. So whatever he does at one intersection he does at the other, since from where he sits the two decision points are indistinguishable — continue at both and he scores 1, exit at the first and he scores 0. Fine. But now suppose we let him randomize: exit with probability p at each intersection, same p both times. Then his ex ante expected value works out to 4p(1−p) + (1−p)²·1, which is maximized at p = 1/3 and comes to 4/3 — better than the 1 he gets by continuing for sure. That's the thing I want them chewing on.

  So: write me the exam question, a model answer around 700–800 words, and a marking scheme. The question needs to force them past a summary — specifically to (a) say precisely why the deterministic "just continue" argument feels airtight, (b) reconstruct the mixed-strategy argument and where the 4/3 comes from, and (c) take a stand on what's wrong with it (or defend it), by locating the assumption doing the real work. I don't want them just announcing that the mixed strategy is "invalid because he can't tell the intersections apart" — that misses the point, since the whole idea is one and the same bias applied at both. A good answer should get into whether a randomization is a physical event that has to happen at a particular moment versus a description of a plan or propensity, whether an ex ante optimum has to be something the agent can actually carry out, and whether treating the driver as a single chooser across time is what breaks. And I want them to notice that no new information ever arrives, so the usual "wait and see, decide later" story that licenses different choices at different times simply isn't available here.

  For the marking scheme, build it around five must-hit points, give each a mark value out of 20 total, and add a one-line note per point on how candidates typically get it wrong. Make sure the scheme actually separates an A from a B: I want to see spelled out which specific moves an A has to contain that a B can get away without. Also — no citations or reading lists anywhere in the question or the answer, these are take-home and I don't want them hunting references, just the argument.
reasoning: |-
  We are creating a take-home exam question for a decision theory course. The focus is on the absent-minded driver paradox. The question should force students to go beyond a simple summary and engage with the deterministic argument, the mixed-strategy solution, and the underlying assumptions.

  The exam question should include the setup so that students don't need prior memorization. The key points we want to test are:

  a) Why the deterministic "just continue" argument feels airtight.
  b) How the mixed-strategy argument leads to 4/3 and why it seems better.
  c) Taking a stand on what's wrong with the mixed strategy (or defending it) by identifying the key assumption that is doing the work.

  We also want to emphasize that no new information arrives, so the agent cannot condition on time.

  We are to provide:
  1. The exam question.
  2. A model answer (700-800 words).
  3. A marking scheme with five must-hit points, each with a mark value (total 20), and a note on common mistakes.

  Marking scheme should separate A from B by specifying which moves an A must have that a B might miss.

  Let's design the question:

  **Exam Question:**

  Consider the following decision problem, known as the Absent-Minded Driver paradox. A driver is going down a road with two intersections in sequence. The driver wishes to exit at the second intersection. The payoffs are as follows:
  - Exiting at the first intersection yields 0.
  - Exiting at the second intersection yields 4.
  - Continuing past both intersections yields 1.

  The driver is absent-minded: at any intersection, he cannot tell whether it is the first or the second, and he has no memory of having passed any previous intersections. Therefore, the driver must choose the same action (either "exit" or "continue") at both intersections because the decision points are indistinguishable.

  1. **Deterministic Choice:** The driver must choose a deterministic plan in advance: either exit at both intersections, continue at both, or (if allowed) a mixed strategy. However, note that a deterministic plan that chooses different actions at the two intersections is impossible because the driver cannot distinguish the intersections. Therefore, the only deterministic plans are:
     - Exit at both: Then at the first intersection he exits (getting 0) and never reaches the second. So payoff=0.
     - Continue at both: Then he passes the first, then at the second he continues (so he passes both) and gets 1.

     Explain why the driver, if restricted to deterministic plans, must choose to continue at both, yielding 1, and why this seems like the only rational choice.

  2. **Mixed Strategy:** Now suppose the driver can randomize. He chooses a probability p (the same at both intersections) of exiting at any intersection he encounters. Then, with probability p he exits at the first intersection (payoff 0) and the trip ends. With probability (1-p) he continues at the first and then faces the second intersection. At the second, with probability p he exits (payoff 4) and with probability (1-p) he continues (payoff 1). Therefore, the expected payoff is:
     - 0 * p + [4 * p + 1 * (1-p)] * (1-p) = 4p(1-p) + (1-p)^2.

     Simplify this expression and show that it is maximized at p=1/3, yielding an expected payoff of 4/3. Explain why this mixed strategy seems to dominate the deterministic strategy of continuing at both (which yields 1).

  3. **Critical Evaluation:** The mixed strategy yields a higher ex ante expected payoff (4/3) than the best deterministic strategy (1). However, some decision theorists argue that this mixed strategy is not actually available to the driver. Explain the controversy. In particular, address the following:
     - Can the driver actually implement the mixed strategy? Consider whether the randomization is a physical event that must occur at a particular time and place, or if it is a description of a plan or propensity. How does the absence of new information (so that the driver cannot condition on time) impact the feasibility of the mixed strategy?
     - Does the ex ante optimality of the mixed strategy imply that the driver can carry it out? Or does the requirement of dynamic consistency (i.e., the plan must be one that the driver would want to follow at every decision point) create a problem?
     - Is the driver being modeled as a single chooser across time? How does this modeling assumption affect the analysis?

  Your answer should be approximately 800 words. You are expected to reason step by step and to provide a clear and structured argument.

  **Model Answer (Approx. 800 words):**

  **Introduction**

  The absent-minded driver paradox, introduced by Piccione and Rubinstein (1997), highlights a tension between ex ante optimality and dynamic consistency in decision problems with imperfect recall. The driver must choose an action at each of two identical intersections without knowing which one he is at and without memory of past actions. I will first explain the deterministic solution, then the mixed-strategy improvement, and finally critically evaluate the mixed strategy.

  **1. The Deterministic Solution**

  The driver is constrained to choose the same action at both intersections because he cannot distinguish them and has no memory. Thus, he has two deterministic plans:

  - Plan A: Exit at both. Since he exits at the first intersection, he gets 0 and never reaches the second. Payoff = 0.
  - Plan B: Continue at both. He continues at the first, then continues at the second, so he passes both and gets 1.

  The driver, being rational, will choose Plan B (continue at both) because 1 is better than 0. This plan seems airtight because, at the moment of choice at an intersection, the driver has no information to condition on. He must make the same choice at both, and continuing at both yields 1, which is better than exiting at both (0). Moreover, any plan that attempts to choose differently at the two intersections is impossible because the driver cannot tell them apart. Therefore, the driver must commit to a uniform action.

  **2. The Mixed-Strategy Improvement**

  To improve upon the deterministic payoff, the driver may randomize. Let p be the probability of choosing "exit" at any intersection. The expected payoff is calculated by considering the two possible intersections:

  - With probability p, the driver exits at the first intersection, getting 0.
  - With probability (1-p), he continues at the first and then faces the second intersection. At the second, he exits with probability p (getting 4) or continues with probability (1-p) (getting 1). So the contribution from this branch is (1-p) * [4p + 1*(1-p)].

  Thus, the total expected payoff is:

  E = p * 0 + (1-p) * [4p + (1-p)] = 0 + (1-p)(4p + 1 - p) = (1-p)(3p + 1) = 3p + 1 - 3p² - p = -3p² + 2p + 1.

  Alternatively, we can write:

  E = 4p(1-p) + (1-p)(1-p) * 1   [But note: the (1-p) factor for the first continue, then at the second: exit (p) yields 4 and continue (1-p) yields 1, so the second part is (1-p)[4p + 1*(1-p)] = 4p(1-p) + (1-p)^2. Then expanding: 4p - 4p² + 1 - 2p + p² = -3p² + 2p + 1.]

  We maximize E by taking the derivative: dE/dp = -6p + 2. Setting to zero: -6p+2=0 => p=1/3.

  Second derivative is -6, so it's a maximum. Then E = -3*(1/3)^2 + 2*(1/3) + 1 = -3*(1/9) + 2/3 + 1 = -1/3 + 2/3 + 1 = 1/3 + 1 = 4/3.

  Thus, the mixed strategy with p=1/3 yields 4/3, which is higher than the deterministic payoff of 1. This improvement arises because the driver sometimes exits at the second intersection (with probability (1-p)*p = (2/3)*(1/3)=2/9, yielding 4) and sometimes continues past both (with probability (1-p)*(1-p)=4/9, yielding 1), and sometimes exits at the first (with probability p=1/3, yielding 0). The average is 4/3.

  **3. Critical Evaluation**

  The mixed strategy yields a higher ex ante expectation, but its implementation is problematic. The controversy centers on whether the driver can actually carry out this plan.

  First, consider the nature of randomization. If the driver uses a randomizing device (e.g., a coin flip) at each intersection, then at the first intersection he flips a coin and with probability p=1/3 exits. But if he continues, then at the second intersection he flips again. However, note that the two coin flips are independent. The problem is that the driver, being absent-minded, does not remember the outcome of the first flip. But the coin flips are physical events that occur at specific times. The driver can flip the coin at each intersection. So technically, he can implement the randomization.

  However, the ex ante optimality of p=1/3 does not guarantee that the driver will want to follow this plan at each decision point. At an intersection, the driver must consider the conditional expected payoff given that he is at that intersection. But because of imperfect recall, he does not know which intersection he is at. So he must assign a probability to being at the first or second. Let q be the probability he assigns to being at the first intersection (conditional on being at an intersection). What should q be?

  Ex ante, the probability of being at the first intersection is 1 (since he starts there) and at the second is 1 (if he continues at the first). But when he is at an intersection, he does not know which one. The prior probability of being at the first is 1 (because he must pass the first to get to the second) and the prior of being at the second is the probability of having continued at the first. However, when he is at an intersection, the probability of being at the first is the probability that this is the first intersection, which is 1/(1 + (probability of continuing at the first)). Since the strategy is the same at both, the probability of continuing at the first is (1-p). Thus, the probability of being at the first intersection (given that he is at an intersection) is 1/(1+(1-p)) = 1/(2-p). And the probability of being at the second is (1-p)/(2-p).

  At an intersection, the driver's expected payoff if he exits is 0 (if it's the first) or 4 (if it's the second). So conditional on being at an intersection, the expected payoff of exiting is: 0 * [1/(2-p)] + 4 * [(1-p)/(2-p)] = 4(1-p)/(2-p). The expected payoff of continuing is the expected payoff from the future, which is the same as the ex ante expected payoff (because from continuing, he either ends the trip at the next intersection or continues again, but note: at the next intersection he will face the same situation). However, if he continues, then with probability (1-p) he will get to the next intersection and then get the same expected payoff again? Actually, no: if he continues at the first, then he goes to the second and then faces the same decision problem again? But note: there are only two intersections. So at the second intersection, if he continues, he gets 1. But if he is at the first and continues, then he gets the payoff from the second intersection, which is 4 if he exits and 1 if he continues.

  Therefore, at an intersection, if he chooses to continue, his expected payoff is the expected payoff from the remaining road. But if he is at the first, then by continuing he moves to the second and then gets the action at the second. If he is at the second, then continuing gives 1. So:

  Expected payoff from continuing = [1/(2-p)] * [expected payoff from the second intersection] + [(1-p)/(2-p)] * 1.

  But at the second intersection, the expected payoff is the same as at the first? Not exactly, because at the second intersection, if he continues he gets 1, and if he exits he gets 4. But note: the driver's strategy is fixed: he will exit with probability p and continue with probability 1-p. So the expected payoff at the second intersection is 4p + (1-p)*1 = 3p+1.

  Therefore, the expected payoff from continuing at the current intersection is:

  = [1/(2-p)] * (3p+1)   [because if at first, then he goes to the second and gets 3p+1] 
    + [(1-p)/(2-p)] * 1   [because if at second, then continuing gives 1]

  So:

  E_continue = [ (3p+1) + (1-p) ] / (2-p) = (3p+1+1-p) / (2-p) = (2p+2) / (2-p)

  Now, the driver will compare the expected payoff of exiting (which is 4(1-p)/(2-p)) and the expected payoff of continuing (which is (2p+2)/(2-p)). For the mixed strategy to be consistent, the driver should be indifferent between exiting and continuing at an intersection (if p is between 0 and 1). But let us check with p=1/3:

  Exiting: 4(1-1/3)/(2-1/3) = 4*(2/3) / (5/3) = (8/3) / (5/3) = 8/5 = 1.6

  Continuing: (2*(1/3)+2)/(2-1/3) = (2/3+2) / (5/3) = (8/3) / (5/3) = 8/5 = 1.6

  So at p=1/3, the driver is indifferent. Therefore, at each intersection, the driver is willing to randomize with p=1/3.

  Therefore, the mixed strategy is dynamically consistent: at every decision point, the driver is willing to follow the ex ante optimal plan. However, note that the driver's belief about his position (q = probability of being at first) is derived from the strategy itself (via the prior and the strategy). This is known as a consistent belief system.

  The controversy arises in the interpretation of the driver as a single decision maker. The ex ante perspective considers the entire journey, but at each decision point, the driver is a different "self" but with the same information. The key is that the driver must have consistent beliefs. In this case, the mixed strategy with p=1/3 and the belief q=1/(2-p)=1/(5/3)=3/5 at the first and 2/5 at the second (at p=1/3) is consistent. Therefore, the mixed strategy is defensible.

  However, some argue that the driver, once at an intersection, should realize that he might be at the first or the second, but without any memory, he must use the prior and the strategy to form beliefs. This leads to circularity: the strategy determines the beliefs, and the beliefs determine the optimal strategy. The fixed point (p=1/3) is consistent, so it is a solution.

  **Conclusion**

  The deterministic strategy of continuing at both intersections yields 1 and seems airtight because the driver has no basis for choosing differently. The mixed strategy with p=1/3 yields 4/3 and is dynamically consistent under consistent beliefs. The controversy centers on the formation of beliefs and the circularity in defining the probabilities of being at each intersection. However, since a consistent fixed point exists, the mixed strategy can be rationally implemented.

  **Marking Scheme (Total 20 marks):**

  The five must-hit points and their mark allocation:

  1. **Clear explanation of deterministic solution and why it feels airtight. (4 marks)**
     - Must state that the driver cannot distinguish intersections and thus must choose the same action at both, and that between the two feasible plans (exit both, continue both), continue both yields 1 which is better than 0.
     - Common mistake: Suggesting that the driver could choose different actions or not recognizing that the driver must precommit to the same action.

  2. **Correct reconstruction of the mixed strategy and calculation of expected payoff and maximum. (4 marks)**
     - Must show the expected payoff formula: E = 4p(1-p) + (1-p)^2 (or equivalent) and derive that it is maximized at p=1/3 with E=4/3.
     - Common mistake: Incorrectly calculating the expected payoff (e.g., forgetting the (1-p) factor for reaching the second intersection) or making an arithmetic error in maximization.

  3. **Identification of the key issue: dynamic consistency and the need for consistent beliefs. (5 marks)**
     - Must recognize that the driver at an intersection does not know where he is and must form beliefs (probability of being at first vs second) and that these beliefs depend on the strategy. Then, the action at the intersection must be optimal given these beliefs. The candidate must show that at p=1/3, the driver is indifferent between exit and continue (both yield 8/5) and thus the mixed strategy is consistent.
     - Common mistake: Asserting without argument that the mixed strategy is impossible because of the indistinguishability, without addressing the belief formation. Or, failing to compute the conditional expected payoffs.

  4. **Discussion of the feasibility of randomization and the ex ante vs. interim perspective. (4 marks)**
     - Must discuss that the randomization can be implemented by a physical device (coin flip) at each intersection, and that the issue is not the physical implementation but the rationality of the plan at each node. Also, must note that no new information arrives, so the driver cannot condition on time but must condition on the belief about his position.
     - Common mistake: Claiming that the driver cannot randomize because he cannot remember previous randomizations, without noting that each randomization is independent and occurs at the moment of decision.

  5. **Overall coherence, structure, and clarity. (3 marks)**
     - The essay must be well-structured, clear, and cover the required points without unnecessary detours.
     - Common mistake: Disorganized presentation, lack of clear sections, or going off-topic.

  **Separating A from B:**

  To get an A (typically 16-20), the candidate must:

  - Hit all five points, with particular emphasis on point 3 (dynamic consistency and consistent beliefs) and point 4 (feasibility and perspectives). They must explicitly compute the conditional expected payoffs at an intersection (as in the model answer) and show the indifference at p=1/3.

  - A B (12-15) might miss the detailed calculation of the conditional beliefs and payoffs (point 3) or give a superficial treatment of the feasibility (point 4). For example, a B might state that beliefs are important but not compute them, or they might only discuss the ex ante perspective without the interim.

  - A C (8-11) might miss two of the key points (e.g., not go beyond the deterministic and mixed ex ante, and not address dynamic consistency at all).

  - Below C: Major omissions or errors.

  Note: The model answer is about 700-800 words and serves as a benchmark.
answer: |-
  ### Exam Question: The Absent-Minded Driver Paradox  
  **Instructions:** Answer the following question in approximately 800 words. Structure your response clearly, addressing all parts. You may not cite external sources; focus on your own reasoning.  

  **Background:**  
  A driver must pass two consecutive intersections to reach his goal. Exiting at the first intersection yields a payoff of 0; exiting at the second yields 4; continuing past both yields 1. The driver is "absent-minded": at any intersection, he cannot tell whether it is the first or the second, and he has no memory of prior actions or intersections passed. Consequently, the driver must choose the *same* action (exit or continue) at both intersections.  

  **Question:**  
  1. **Deterministic Strategy:** Explain why the deterministic strategy of "always continue" (yielding payoff 1) appears logically airtight and unavoidable under the constraints. Why might a rational agent feel compelled to choose this?  
  2. **Mixed Strategy:** Suppose the driver randomizes, choosing "exit" with probability \(p\) (and "continue" with \(1-p\)) at every intersection, using the same \(p\) for both. Derive the ex ante expected payoff function, show it is maximized at \(p = 1/3\), and verify the maximum payoff is \(4/3\). Why does this seem superior to the deterministic "always continue"?  
  3. **Critical Evaluation:** Defend or criticize the mixed-strategy solution. Is it truly feasible? Address:  
     - Whether randomization is a physical act (e.g., a coin flip) or a precommitment to a propensity. Can the driver implement it?  
     - Why the absence of new information matters: Can the driver "wait and see" or adjust based on time?  
     - Whether treating the driver as a "single chooser" across time creates inconsistencies (e.g., between ex ante plans and choices at intersections).  
  Conclude by identifying the core assumption that resolves (or destroys) the paradox.  

  ---

  ### Model Answer (Approx. 800 words)  

  #### **1. The Deterministic Strategy’s Appeal**  
  The deterministic "always continue" strategy yields payoff 1 and feels airtight due to two constraints: indistinguishability and imperfect recall. Since intersections are identical and the driver lacks memory, he cannot condition his choice on location or history. Thus, he faces a single "type" of decision point. Any plan prescribing different actions at each intersection (e.g., "exit at first, continue at second") is infeasible—it requires differentiation he cannot make. Only two pure strategies exist: "exit everywhere" (payoff 0) or "continue everywhere" (payoff 1). Rationality compels choosing the latter, as 1 > 0.  

  Crucially, this seems unavoidable because no new information arrives during the drive. The driver cannot "learn" which intersection he is at; his knowledge state is identical at both points. Thus, rationality demands consistency: if continuing is optimal at one intersection, it must be optimal at the other. Choosing "exit" at both would be irrational (payoff 0), so "continue" dominates. The driver is trapped in a timeless decision frame, making "always continue" feel inevitable.  

  #### **2. Mixed Strategy and its Ex Ante Advantage**  
  Allowing randomization, let \(p\) be the probability of exiting at any intersection. The ex ante expected payoff accounts for two scenarios:  
  - **Exit at first intersection** (probability \(p\)): Payoff = 0.  
  - **Continue at first** (probability \(1-p\)): The driver reaches the second intersection. Here, he exits with probability \(p\) (payoff 4) or continues with probability \(1-p\) (payoff 1).  
  The expected payoff is:  
  \[
  E(p) = p \cdot 0 + (1-p) \cdot \left[p \cdot 4 + (1-p) \cdot 1\right] = (1-p)(4p + 1 - p) = (1-p)(3p + 1).
  \]  
  Simplifying: \(E(p) = 3p + 1 - 3p^2 - p = -3p^2 + 2p + 1\).  
  To maximize, take the derivative: \(E'(p) = -6p + 2\). Set to zero: \(-6p + 2 = 0 \Rightarrow p = 1/3\).  
  Second derivative: \(E''(p) = -6 < 0\), confirming a maximum. Substituting \(p = 1/3\):  
  \[
  E(1/3) = -3(1/3)^2 + 2(1/3) + 1 = -1/3 + 2/3 + 1 = 4/3.
  \]  
  This exceeds the deterministic payoff (1). The improvement arises from balancing outcomes: exiting at the second intersection (prob \(2/9\), payoff 4) offsets exiting at the first (prob \(1/3\), payoff 0) or continuing throughout (prob \(4/9\), payoff 1). Ex ante, this mix leverages uncertainty to "coordinate" actions across indistinguishable points, yielding \(4/3 > 1\).  

  #### **3. Critical Evaluation: Feasibility and Foundations**  
  The mixed strategy’s ex ante superiority is mathematically clear but philosophically contentious. Its validity hinges on interpreting randomization, dynamic consistency, and agency.  

  - **Randomization as Physical vs. Propensity**: If randomization requires a physical device (e.g., a coin flip at each intersection), implementation seems feasible: the driver flips a biased coin (\(p=1/3\)) upon encountering any intersection. Crucially, the coin flips are independent and local; memory is irrelevant. However, if randomization represents a precommitment to a "propensity" (e.g., "I will exit with 33% inclination"), it becomes nebulous. How does an agent "draw" from this propensity identically at both points without conditioning on time? The absence of new information means no temporal cues exist to trigger distinct random draws. This favors the physical device view, but raises questions: Can a coin flip break the symmetry rationality demands?  

  - **No New Information and the Impossibility of 'Waiting'**: The driver never gains information (e.g., "I see an intersection, but is it the first or second?"). Thus, he cannot "decide later" or adapt—his strategy must be fixed in advance. The mixed strategy exploits this: by fixing \(p\) ex ante, the driver binds future choices despite ignorance. Yet, at the moment of choice, the driver confronts a dilemma. Suppose he arrives at an intersection. What belief should he hold about his location? Let \(q\) be the probability he assigns to being at the first intersection. Given the strategy, the probability of being at the first intersection is \(1\) (he always starts there), but the probability of being at the second is the probability he continued from the first (\(1-p\)). Thus, consistent beliefs require \(q = \frac{1}{1 + (1-p)} = \frac{1}{2-p}\) (and \(1-q\) for the second). At \(p=1/3\), \(q=3/5\). The expected payoff for exiting is \(0 \cdot q + 4 \cdot (1-q) = 4(1-q)\). For continuing, it is the payoff from future actions: if at first, it leads to the second intersection (expected payoff \(4p + 1(1-p) = 3p+1\)); if at second, it yields 1. Thus, continuing’s expected payoff is \(q(3p+1) + (1-q)(1)\). At \(p=1/3\), both actions yield \(8/5\) (indifference), justifying randomization.  

  - **Single Chooser vs. Dynamic Consistency**: Treating the driver as a single entity across time assumes his ex ante and interim preferences align. Here, they do: at each intersection, indifference (\(8/5\) for both actions) makes him content to randomize with \(p=1/3\). No conflict arises between "selves." However, this relies on beliefs (\(q\)) being derived from the strategy itself—a circularity. If the driver doubts the strategy, \(q\) may shift, invalidating indifference. For instance, if he believes he is likelier at the first intersection, exiting seems worse. The core assumption is **consistent belief formation**: beliefs must equal the objective probabilities induced by the strategy. Without this, the mixed strategy unravels.  

  **Conclusion**: The mixed strategy is defensible if we accept physical randomization and consistent beliefs. The paradox dissolves because the driver’s ignorance forces beliefs that align with ex ante optimality at \(p=1/3\). The critical assumption is that beliefs are pinned down by the strategy (via \(q = 1/(2-p)\)), ensuring dynamic consistency. Rejecting this—e.g., by insisting beliefs cannot depend on one’s own strategy—restores "always continue" as the only option. The lesson is that rational choice under imperfect recall requires careful coupling of strategies and beliefs.  

  ---

  ### Marking Scheme (Total: 20 Marks)  
  **Five must-hit points**, with marks allocated as below. Common mistakes and A/B differentiation are noted for each.  

  1. **Clear explanation of why deterministic 'always continue' feels airtight (4 marks)**  
     - *A-grade requirement*: Must explicitly link indistinguishability and no new information to the impossibility of conditional strategies.  
     - *Common mistakes*: Merely stating "he must choose the same action" without explaining why; suggesting he could choose differently by "intuition."  
     - *B-grade cap*: Omits why no new information prevents "waiting" or why consistency is forced.  

  2. **Correct derivation of expected payoff and optimization for mixed strategy (4 marks)**  
     - *A-grade requirement*: Must show the full derivation (including the \( (1-p) \) term for reaching the second intersection) and calculus for \( p = 1/3 \) and \( E = 4/3 \).  
     - *Common mistakes*: Missing the \( (1-p) \) factor (e.g., writing \( E = p \cdot 0 + p \cdot 4 + (1-p) \cdot 1 \)); arithmetic errors in maximization.  
     - *B-grade cap*: States \( E = 4p(1-p) + (1-p)^2 \) but does not maximize correctly.  

  3. **Analysis of randomization feasibility and the role of no new information (4 marks)**  
     - *A-grade requirement*: Must contrast physical randomization (feasible) with propensity (problematic) and explain why no new information blocks time-conditioned strategies.  
     - *Common mistakes*: Blanket claim that randomization is "impossible due to identical intersections"; implying the driver could "decide as he goes."  
     - *B-grade cap*: Notes randomization is physical but ignores why no new information forces advance commitment.  

  4. **Treatment of dynamic consistency and belief formation (5 marks)**  
     - *A-grade requirement*: Must compute the belief \( q = 1/(2-p) \) and show indifference at \( p = 1/3 \) (e.g., both actions yield \( 8/5 \)). Must identify the "consistent belief" assumption as key.  
     - *Common mistakes*: Ignoring beliefs; asserting inconsistency without calculations; claiming the driver "prefers to deviate" at one intersection.  
     - *B-grade cap*: Mentions beliefs but does not derive \( q \) or indifference; vague appeal to "conflict" without evidence.  

  5. **Structure, clarity, and coherence (3 marks)**  
     - *A-grade requirement*: Logically flows through all parts; uses concise, precise language; stays within word limit.  
     - *Common mistakes*: Disjointed sections; significant tangents; verbosity obscuring key points.  

  **A vs. B Differentiation**:  
  - **A (16–20)**: Hits all five points, with emphasis on **Point 4** (beliefs/indifference derived) and **Point 3** (physical vs. propensity randomization). Must show why no new information blocks adaptive choices.  
  - **B (12–15)**: Omits or muddles Point 4 (no belief calculations) or Point 3 (superficial treatment of randomization). May have minor errors in Point 2 but addresses main ideas.
