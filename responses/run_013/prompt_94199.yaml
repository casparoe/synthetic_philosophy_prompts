answer: |-
  ### Exam Question: Consequentialism and the Cluelessness Problem (90 minutes)

  **Your Task:**  
  Write a structured essay addressing the following:  

  1. **Distinguish** between the *weak/epistemic* reading of cluelessness ("We cannot *know* the remote consequences of acts due to limited information") and the *strong/ontological* reading ("The total consequences of an act are open-ended or incommensurable, making 'total value' undefined"). Explain why the strong reading threatens act-consequentialism’s **criterion of rightness** (what *makes* an act right), while the weak reading primarily challenges its **decision procedure** (how we *choose* acts).  

  2. **Evaluate** the "Local Fix" proposal for cluelessness:  
     > *"Agents should maximize expected value over foreseeable consequences. Unforeseeable long-term consequences can be treated as symmetric random noise that cancels out over many acts, thus not affecting expected value calculations."*  
     Assess whether this solves *both* readings of cluelessness. Your analysis must address:  
     - Whether the Fix presupposes contestable assumptions about probability distributions.  
     - How "fat tails" (extreme low-probability/high-impact events) or a *single* dominant speculative consequence (e.g., triggering utopia/catastrophe) undermine it.  
     - Whether Pascalian worries (e.g., vanishingly small chances of infinite value) parallel cluelessness or distort it.  

  3. **Defend a Position**: Which reading (weak or strong) poses the *deeper* threat to act-consequentialism? Can the Local Fix salvage the theory? Justify your view.  

  ---  
  **Instructions:**  
  - No citations needed. Engage the concepts, not the literature.  
  - Avoid rehashing standard formulations of cluelessness; focus on the distinctions above.  
  - Clarity and precision outweigh length.  

  ---

  ### Model Answer (800 words)  

  #### I. Distinguishing Weak vs. Strong Cluelessness and Their Targets  
  The cluelessness problem asserts that consequentialism cannot guide action because we lack knowledge of an act’s long-term consequences. Crucially, this masks two distinct challenges.  

  The **weak/epistemic reading** claims we lack *epistemic access* to remote effects (e.g., buying coffee might indirectly fund a future revolution). This challenges consequentialism’s *decision procedure*—the practical method for choosing acts. We cannot calculate expected value (EV) with incomplete data. However, it *preserves* the **criterion of rightness**: an act *is* right if it *actually* maximizes net value, even if unknowably. Consequentialism’s core definition remains intact.  

  The **strong/ontological reading** is more radical: it claims consequences are *infinite, non-archimedean, or incommensurable* (e.g., a butterfly-effect chain with no finite sum of value). Here, "total value" is undefined—not merely unknown. This eviscerates the **criterion of rightness**, which requires a determinate "best" outcome. If acts lack comparable totals, no act can *be* objectively right, even in principle. This strikes at consequentialism’s foundational claim that moral truth depends on net value optimization.  

  Consequentialism survives the weak reading (we can approximate rightness via proxies) but collapses under the strong reading if no act satisfies its criterion.  

  #### II. The Local Fix: A Flawed Solution  
  The Local Fix proposes limiting EV calculations to "foreseeable" consequences while dismissing unforeseeable ones as symmetric noise. It argues that, statistically, random long-term effects cancel out (e.g., unforeseen harms/benefits balance over time), letting foreseeable EV guide us. However, this fails against both readings of cluelessness and introduces new problems.  

  - **Against the Weak Reading**: The Fix *assumes* unforeseeable consequences are symmetrically distributed noise. But cluelessness arises precisely because we *cannot know* if they are symmetric. In complex systems (e.g., climate, AI), long-term effects may be systematically biased (e.g., industrial acts accumulate harm). Without probabilistic justification, the Fix is wishful thinking.  

  - **Against the Strong Reading**: If consequences are ontologically open-ended, the Fix *smuggles in a probability distribution* over an undefined space. Treating the "tail" as noise presupposes we can model it as a random variable with a mean—but if the value sum diverges (e.g., acts with infinitesimal chances of producing infinite value), no stable EV exists. The Fix cannot resolve incommensurability.  

  - **Fat Tails and Dominant Outcomes**: The Fix collapses if a single speculative consequence dominates value. For example:  
    - *Fat tails*: A policy with a 0.001% chance of causing human extinction has expected disvalue dwarfing foreseeable benefits (e.g., Bostrom’s "vulnerable world" hypothesis).  
    - *Dominance*: A trivial act (e.g., tweeting) might, via chaotic chains, trigger a utopia (value +∞) or catastrophe (−∞). If such outcomes are possible, "noise" cannot wash out—one outcome hijacks the EV.  
    Here, the Local Fix’s symmetry assumption is empirically false and mathematically incoherent.  

  - **Pascalian Parallels?**: Pascalian problems (e.g., "tiny chance of infinite salvation") resemble cluelessness in leveraging extreme, speculative outcomes. But they differ structurally: Pascalian cases involve known probabilities of *defined* outcomes (e.g., 10^−9 chance of ∞), while strong cluelessness denies outcomes *can* be defined. Both exploit EV’s sensitivity to extremes, but cluelessness is deeper—it questions whether values *can* be summed. The Local Fix fails both: it cannot handle infinities nor undefined sums.  

  #### III. Defense: Strong Cluelessness and the Theory’s Core Failure  
  The strong reading is the decisive threat. Consequentialism’s criterion of rightness requires that acts have comparable total values. If the strong reading holds (e.g., due to chaos theory or infinite spacetime), this is impossible—the theory lacks a moral truth-maker. The Local Fix cannot help here; it assumes a probabilistic framework that presupposes commensurability.  

  The weak reading, while practically severe, leaves the theory *conceptually* intact. We might use heuristics (e.g., "maximize foreseeable EV") as best efforts. But if the strong reading holds, no such proxy tracks "rightness," as it doesn’t exist. Thus, cluelessness’s deepest form is ontological, not epistemic. The Local Fix is a useful heuristic for decision-making but cannot save the criterion of rightness from the abyss of incommensurability.  

  ---

  ### Marking Scheme (Total: 25 points)  
  **Aim:** Reward precision on distinctions, not general knowledge of cluelessness.  

  | **Points** | **Must-Hit Points**                                                                 | **Common Mistakes (Costs Points)**                                  |  
  |------------|-------------------------------------------------------------------------------------|---------------------------------------------------------------------|  
  | **5**      | **Distinguishes weak (epistemic) vs. strong (ontological) cluelessness accurately.** | Vague conflation of readings (e.g., "both mean we can’t predict"). |  
  | **5**      | **Explains why weak reading threatens decision procedure, not criterion of rightness.** | Claims weak reading makes rightness "unknowable" but ignores that it remains *defined*. |  
  | **5**      | **Explains why strong reading undermines criterion of rightness (indeterminate value sums).** | Hand-waves about "complexity" without ontological incommensurability. |  
  | **5**      | **Critiques Local Fix: (a) Assumes symmetric noise unjustifiably, (b) Fails with fat tails/dominant outcomes, (c) Presupposes probability over undefined space.** | Praises Fix for practicality without engaging its assumptions; misses fat tails/Pascalian issues. |  
  | **3**      | **Evaluates Pascalian parallels: Notes similarity in EV sensitivity but distinguishes structural differences (defined vs. undefined outcomes).** | Equates Pascalian with cluelessness superficially or dismisses both. |  
  | **2**      | **Defends position on which reading is deeper threat and whether Fix helps, tied to prior analysis.** | Unsupported opinion; fails to reference criterion/decision distinction. |  

  **Grading Key:**  
  - **A (21–25)**: Hits all distinctions; sophisticated Local Fix critique.  
  - **B (16–20)**: Minor confusions (e.g., weak vs. strong) but solid on core.  
  - **C (12–15)**: Describes cluelessness generally but misses key distinctions; superficial Fix evaluation.  
  - **D/F (<12)**: Ignores prompt; rehashes "we can’t know consequences" without analysis.  

  ---  
  **Design Notes**:  
  - A "C student" who memorizes cluelessness but misses distinctions (e.g., conflates readings, calls Local Fix "sensible") scores 12–15.  
  - To reach B+/A, students must dissect *why* the strong reading kills the criterion and how the Fix smuggles in probability.  
  - The Pascalian point separates excellent answers: it tests if they see EV’s formal limits beyond cluelessness.
