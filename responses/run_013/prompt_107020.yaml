  - **Mechanics:** The victim’s sliding discount rate makes him accept every trade (initial loan, device purchase, early settlement) as optimal *at that instant*, but the operator structures sequential sure-loss contracts.  
  - **No generic weakness:** The trap isn’t impulsivity—it’s consistent preference reversals via time-varying discounting. The "device" is literally the next pump round.  
  - **Diachronic twist:** The pawnbroker exploits the *contractual irreversibility* of the device sale, knowing proximity will shift preferences against it.
