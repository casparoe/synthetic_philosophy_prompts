  Six months later, the pawnbroker returns: "I’ll accept $1100 *today* to void the debt." The discounter, now valuing immediacy higher, agrees.  

  As the pawnbroker pockets the extra $100, he whispers: "That ‘Commitment Device’ you bought? It was just a contract binding *you*—not me. Come back next week. I’ve got a device to stop you falling for *that* again..."  

