  For the medical vs historical contrast - insurance relies on actuarial populations defined by clear membership rules (e.g. "40yo male smoker"), while "hegemon" has no such operational definition. The key disanalogy is that historical categories are theory-laden constructs, not natural kinds. Mortality statistics measure biological processes; empire longevity measures... what exactly? There's no equivalent to vital statistics here.

  What's left of the outside view? Three salvage operations: 1) As a metacognitive tool ("why did I pick Dutch over Ming?"), 2) To force engagement with disconfirming cases ("why is Rome irrelevant?"), 3) To calibrate confidence intervals by revealing how much the answer swings with definitional changes. But it can't yield objective base rates.

