prompt: |-
  I teach a seminar that's half MFA students and half philosophy majors — it's called "What If," it's about conditionals in fiction and in philosophy — and the philosopher who normally co-teaches it bailed on me, so I'm the one grading the midterms. I'm a novelist, not a logician, which is exactly why I need a hand here. One of the questions was on the indicative/counterfactual distinction, and I've got a student answer I need to mark. Give me a letter grade, a mark out of 10, and then the specific comments that get you there — point by point, what's right, what's off, and why the off bits actually matter, because if the student appeals I have to be able to defend the grade. No general impressions please. Keep the whole thing under 350 words, I have fourty of these to get through.

  The question: Distinguish indicative from counterfactual conditionals. Illustrate the distinction with a single pair of conditionals sharing the same antecedent and consequent, explain what the difference between them consists in, and say whether the two kinds require different semantic treatments. (10 pts)

  The student's answer:

  "The standard illustration is the Oswald pair. 'If Oswald didn't shoot Kennedy, somebody else did' is the indicative one, and it's true — Kennedy was shot, so if it wasn't Oswald then it was somebody else. 'If Oswald hadn't shot Kennedy, somebody else would have' is the counterfactual, and it's false — Oswald acted alone, as far as anyone can tell, so there was no second shooter waiting in the wings. Same antecedent, same consequent, opposite verdicts, so the difference has to be semantic rather than merely pragmatic.

  What's going on, on the usual story, is that you evaluate the indicative with a Ramsey-style test: drop the antecedent into your beliefs and see whether the consequent then comes out probable. You can't do that with the counterfactual, because its antecedent is false and you can't just add a falsehood to what you believe. Instead you need the Lewis/Stalnaker machinery — a similarity ordering over worlds where the antecedent holds, with the conditional true iff the consequent holds all the way through the nearest of those worlds. That's basically the Adams line: counterfactuals don't have truth conditions, they just register a conditional probability, which is why Lewis went to the trouble of building them a semantics in the first place.

  The upshot is that the material conditional is fine for indicatives and a dead end for counterfactuals."
reasoning: |-
  Okay, let me tackle this grading request step by step. The user is a novelist teaching a mixed seminar who needs help evaluating a philosophy/logic answer about conditionals - specifically distinguishing indicative from counterfactual conditionals. 

  First, I need to assess the student's response against the 10-point question requirements: distinguishing the two types, providing a paired example, explaining the difference, and addressing semantic treatment. The Oswald example is textbook-perfect - clear antecedent/consequent sharing with opposite truth values, which immediately demonstrates the semantic distinction. Full marks there.

  The explanation of Ramsey's test for indicatives is spot-on, as is noting the impossibility of simply adding false antecedents to beliefs for counterfactuals. However, there's a significant error when the student claims counterfactuals lack truth conditions according to Adams - actually Adams applied this view to all conditionals, while Lewis/Stalnaker specifically constructed truth conditions for counterfactuals. This conflation matters because it misrepresents the key debate in conditional semantics.

  The final point about material conditionals is correct but underdeveloped. While true that material implication fails counterfactuals, the student doesn't explain why it sometimes works for indicatives (when no modal issues arise). 

  For scoring: 1 point each for correct definition, example pair, difference explanation, and material conditional comment. The Ramsey/Lewis descriptions get 0.5 each since one contains a major error. The Adams error costs 1 point as it's a substantive misunderstanding. Total 7/10 - good but not excellent due to the conceptual mistake.

  I'll structure feedback as: strengths (example, Ramsey test, material conditional), then specific error with explanation of why it matters. The grade justification must be defensible if appealed - hence emphasizing how the Adams misattribution undermines the semantic treatment analysis.
answer: |-
  **Grade: B (7/10)**  

  **Strengths (+):**  
  1.  **(+1)** Correctly identifies the indicative and counterfactual conditionals using the Oswald pair with the *same antecedent/consequent*.  
  2.  **(+1)** Accurately assigns truth values to both conditionals (indicative true, counterfactual false) and notes the opposite verdicts.  
  3.  **(+1)** Correctly states the difference necessitates a *semantic* distinction (not merely pragmatic).  
  4.  **(+1)** Accurately explains the Ramsey test for indicatives (add antecedent to beliefs, check consequent).  
  5.  **(+1)** Correctly identifies the core problem for counterfactuals (can't add false antecedent to beliefs) and names Lewis/Stalnaker similarity semantics as the solution.  
  6.  **(+1)** Correctly states the material conditional is inadequate for counterfactuals.  

  **Weaknesses/Errors (-):**  
  1.  **(-1) Misrepresentation of Adams:** The claim "That's basically the Adams line: counterfactuals don't have truth conditions..." is incorrect and significant. **Why it matters:** Ernest Adams argued that *all* conditionals (indicative *and* counterfactual) lack truth conditions and are evaluated via conditional probability. Lewis/Stalnaker *rejected* this for counterfactuals and specifically built truth-conditional semantics *because* they believed counterfactuals *do* have truth conditions. This error misstates a core debate about semantics.  
  2.  **(-0.5) Undeveloped Lewis/Stalnaker Point:** While the similarity ordering is mentioned, the explanation lacks crucial detail ("nearest worlds", "consequent holds all the way through"). **Why it matters:** Omitting "nearest worlds" and the universal quantifier ("all the way through") misses the key mechanics of the semantics proposed to *solve* the problem identified.  
  3.  **(-0.5) Undeveloped Material Conditional Point:** The statement "the material conditional is fine for indicatives" is an oversimplification. **Why it matters:** While the material conditional *sometimes* aligns with simple indicatives, it famously fails for many others (e.g., indicative conditionals with false antecedents or involving modality). The student needed to acknowledge its limitations even for indicatives, or at least qualify the claim.  

  **Breakdown (7/10):** Definition/Pair (2/2), Illustration (2/2), Difference Explanation (1.5/2 - strong on Ramsey, weak on L/S detail), Semantic Treatment (1.5/4 - correct on *need* for distinct treatment and material conditional failure, but points lost for Adams error and lack of depth on L/S/material conditional adequacy). The Adams error is the major flaw, impacting the core question about semantic treatment.
