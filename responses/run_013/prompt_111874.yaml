prompt: |-
  Some friends in my decision-theory reading group had a long fight last week about the prisoner's dilemma and I've been chewing on it since. You're the philosopher of rational choice here — think it through carefully, lay out what each move is actually claiming before you judge it, and don't just name an overall winner: I want a point-by-point verdict on who's right about what, plus what both of them are missing.

  The setup: one-shot PD, ordinary payoffs — both cooperate 3 and 3, both defect 1 and 1, one defects while the other cooperates 5 and 0. No repeats, no reputation, nothing downstream.

  Move 1 (Rosa): If I'm up against someone who reasons exactly the way I do — a perfect copy of me, running the same decision procedure — I cooperate. Whatever I land on, she lands on, so cooperating gets us both 3 instead of both 1. She called this superrationality and said it's a genuine principle, not a repackaged expected-value calculation.

  Move 2 (Dev): Nonsense. Her move isn't caused by mine — it's already settled by her own reasoning, independently of what I do — so I should just pick the action that pays more against either of her replies, and that's defecting. Rosa is quietly smuggling in a causal link from my act to hers.

  Move 3 (Rosa): That's causal decision theory talking, and CDT is exactly the theory that tells both of us to defect and marches us both into 1 and 1 when two people using my rule would both walk away with 3. Any theory of rationality that predictably leaves you worse off whenever the other player is using the same theory is a broken theory.

  Move 4 (Dev): Then you've stopped talking about choosing an act and started talking about choosing a rule for both of us at once, which is a different question — it assumes a 'we' that doesn't have to exist. And it collapses the moment the players aren't perfect mirrors. Make the copy faithful only 60% of the time — matches my move 60%, does the opposite 40% — and cooperating now has EV 0.6·3 + 0.4·0 = 1.8 while defecting has 0.6·1 + 0.4·5 = 2.6, so your own principle flips to defecting. Which is just what a plain expected-value sum tells you. So there's no separate principle left.

  Move 5 (Rosa): The number flipping isn't a reductio, it's the principle working. Nobody said 'cooperate with anything vaguely similar' — when the mirror gets blurry enough it stops being worth it. The point was always the kind of reason you have, not the size of the correlation. And even in the 60% case, my reason to defect is still a correlation-based reason, which isn't Dev's 'your act doesn't cause hers, so ignore the correlation' line.

  There both sharp and neither would budge. Go through it move by move — right, wrong, or right for the wrong reason — and then tell me what they're each missing.
reasoning: |-
  Okay, let me try to unpack this prisoner's dilemma debate. Rosa and Dev are going at it over superrationality versus causal decision theory in a one-shot PD. 

  First I need to clarify Rosa's Move 1. She's saying that against a perfect copy of herself, cooperating makes sense because whatever she decides, the copy does the same. So mutual cooperation nets 3 each instead of mutual defection's 1. She calls this "superrationality" and insists it's not just expected value - it's a separate principle. 

  Hmm, her core point seems valid in this extremely narrow case. If the agents are truly identical and know it, defecting would guarantee mutual defection while cooperating guarantees mutual cooperation. The outcome is determined by their shared decision procedure, not by causal influence. 

  Now Dev's Move 2 pushes back hard. He says Rosa's smuggling in causation where none exists - the copy's move is already fixed by its own reasoning. So he argues you should just compare payoffs: defect gives 5 or 1 while cooperate gives 3 or 0, so defecting dominates. 

  Here's where it gets interesting. Dev's technically correct about the lack of causal link, but he's missing Rosa's actual point. She's not claiming causation - she's pointing to the logical correlation between identical decision-makers. His CDT framework can't see that correlation as relevant, which is why he dismisses it. 

  Then Rosa fires back in Move 3 that CDT is "broken" because it forces mutually destructive outcomes when identical reasoners could do better. This hits a real weakness in CDT - its blindness to logical correlations does seem irrational in these edge cases. 

  But Dev counters in Move 4 that Rosa's shifting the question to choosing rules collectively. He tests her principle with imperfect correlation (60% match). When cooperating's EV drops below defecting's, he declares her principle collapses into standard EV. 

  Ah, but Rosa parries this in Move 5. The flip isn't a failure - it's the principle working! The key is recognizing when correlation makes cooperation rational, not treating it as a separate calculation. She maintains that even with partial correlation, her reasoning differs from CDT's total dismissal of correlations. 

  What Dev misses is that Rosa's framework handles the 60% case coherently - it doesn't collapse, it just outputs different actions as correlation weakens. And Rosa might underplay how rare true identity is outside thought experiments. Both could explore more how this applies to real-world imperfect similarity. 

  Overall? Neither fully wins. Rosa's right that logical correlation justifies cooperation with clones, exposing CDT's limitation. But Dev's right that this requires extreme symmetry and becomes standard EV when symmetry breaks. Their debate reveals deep fault lines in decision theory itself.
answer: |-
  Here's a point-by-point dissection of the debate, evaluating each move on its own terms before synthesizing what's missing. Neither position is fully "wrong," but both have blind spots.

  ### **Move 1 (Rosa): Superrationality with Perfect Copies**
  - **Verdict: Right, but incomplete.**  
    Against a *perfect copy* (identical decision procedure, common knowledge of symmetry), cooperation is uniquely rational. Rosa correctly identifies that the outcome depends on the *joint* output of both agents' identical reasoning. If both apply "pick the action that maximizes payoff if the other does the same," they coordinate on (C,C). Defecting guarantees (D,D), which is strictly worse. This isn't causal influence; it's **logical correlation** from shared reasoning.  
  - **What's missing:**  
    Rosa doesn't clarify *why* a perfect copy must exist, or how agents know they're identical. Her argument relies on an idealized symmetry rarely seen outside thought experiments.

  ### **Move 2 (Dev): Causal Independence and Dominance**
  - **Verdict: Right for the wrong reason.**  
    Dev correctly notes that Rosa's act doesn't *cause* the copy's act, and defecting dominates in the classical payoff matrix. However, he misdiagnoses Rosa's argument as smuggling in causation. She isn't: she's appealing to *logical dependence* (same input → same output). His dominance argument ignores the correlation inherent in the symmetry setup.  
  - **What's missing:**  
    Dev fails to engage Rosa's core point: when players share a decision rule, dominance reasoning can be self-undermining. CDT *does* force mutual defection even when both players wish they could coordinate on cooperation.

  ### **Move 3 (Rosa): Critique of CDT**
  - **Verdict: Right about the flaw, wrong about the fix.**  
    Rosa is correct that CDT leads to Pareto-inferior outcomes when players use identical rational procedures. This exposes CDT's blindness to **acausal correlations** (e.g., "I am identical to my opponent, so our acts are entangled"). Her example shows CDT isn't *universally* rational.  
  - **What's missing:**  
    She implies her approach supersedes CDT, but doesn't address how to handle *asymmetric* cases (e.g., one player uses CDT, the other uses her rule). Her theory only works under strict symmetry.

  ### **Move 4 (Dev): Imperfect Correlation and EV Calculation**
  - **Verdict: Technically right, but misses the point.**  
    Dev correctly shows that with 60% correlation, defecting has higher EV (2.6 > 1.8). His math is sound, and he exposes that Rosa's cooperation principle isn't absolute—it depends on correlation strength.  
  - **What's missing:**  
    He wrongly claims Rosa's principle "collapses" into standard EV. Rosa isn't denying EV; she's arguing that the *source* of correlation matters. In the 60% case, defecting is rational *because the correlation is weak*, not because causation is irrelevant. His critique ignores her distinction between causal and correlational reasoning.

  ### **Move 5 (Rosa): Correlation as Reason, Not Causation**
  - **Verdict: Largely right.**  
    Rosa clarifies that her principle is about responding to **evidential correlations** (even acausal ones), not inventing causation. The 60% case isn't a reductio—it shows her framework *adapts* to correlation strength. Defecting becomes rational when correlation is weak, but the *reason* is still the correlational structure, not CDT's causal isolation.  
  - **What's missing:**  
    She doesn't explain how to quantify "enough" correlation, or how agents know the correlation level. Her approach risks vagueness outside perfect symmetry.

  ---

  ### **What Each Is Missing: The Big Picture**
  - **Rosa's Blind Spots:**  
    1. **Scope:** Her "superrationality" only works under near-perfect symmetry. She doesn't address how to act against non-identical players (e.g., a CDT user).  
    2. **Epistemology:** She assumes agents can magically know they're identical or measure correlation. Real agents lack this omniscience.  
    3. **Toolkit:** She dismisses expected value but relies on it implicitly (e.g., in the 60% case). Her principle is better framed as **EV conditional on logical correlation**.

  - **Dev's Blind Spots:**  
    1. **Self-Defeat:** He ignores that CDT *systematically fails* in symmetric dilemmas. If rationality mandates a strategy that guarantees suboptimal outcomes when universally adopted, that's a paradox worth addressing.  
    2. **Correlation ≠ Causation:** He conflates Rosa's appeal to logical correlation with causal thinking. CDT's refusal to countenance acausal links is its weakness here.  
    3. **Nuance:** He reduces Rosa's argument to "cooperate always," missing her emphasis on *conditional* rationality based on symmetry.

  ---

  ### **Synthesis: Who's Right About What?**
  - **Rosa Wins** on the narrow point: Against a perfect copy, cooperation is rational. CDT *is* flawed when universally applied.  
  - **Dev Wins** on generality: Outside perfect symmetry, standard EV/dominance resurface. Rosa's principle lacks clear boundaries.  
  - **The Core Clash:** It's **CDT vs. EDT (Evidential Decision Theory)**.  
    - Dev defends CDT: "Choose acts that *cause* good outcomes."  
    - Rosa leans EDT: "Choose acts that *signal* good outcomes" (even if not causal).  
    In symmetric PDs, EDT (via correlation) outperforms CDT. But EDT has its own problems (e.g., fatalism in Newcomb-like scenarios).  

  **Final Verdict:** No "winner." Rosa exposes a crack in CDT but overextends her solution. Dev defends sound baseline reasoning but dismisses a legitimate edge case. Both miss that **no single decision theory dominates all scenarios**—context determines whether causation, correlation, or rules should drive choice. The real lesson: rational choice is fractured, and the prisoner's dilemma is a Rorschach test for decision theorists.
