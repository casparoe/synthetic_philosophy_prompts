prompt: |-
  Before I read any more papers on when some things make up a further thing, I want the spec first. Write me the desiderata that any adequate theory of composition has to meet — the cases it must get right, the distinctions it can't collapse, the facts it has to stay consistent with — each one with the case or consideration behind it.

  At a minimum I'd want it to say something about: Tibbles the cat losing his tail (and why there isn't also a "cat-complement" sitting on the mat); a statue and the lump of clay it's made of, occupying the same place at the same time; the problem of the many, i.e. my cat versus the zillion cat-minus-one-atom candidates; whether composition can be vague at all; gunk — matter with no smallest parts; things that gain and lose parts over time; and scattered objects whose parts aren't touching.

  Two cases I'd like it to handle that I don't see discussed much, and honestly I care about them as much as the classics: (a) a slime-mold-ish creature that habitually pulls itself into two halves that wander off and later fuse back — is that one thing that split, or two things that merged, and does the verdict change if the halves are "the same" material? (b) me and my mitochondria and gut bacteria: if obligate symbionts are doing a lot of the living, are they parts of me or just things inside me? Whatever rule you give should return a verdict here without going ad hoc.

  Then tell me which requirements are negotiable and which aren't, and whether any two of them can't both be satisfied — that's the part I actually want. And which single requirement knocks out the most candidate theories? Don't bother scoring the theories against the list, I'll do that myself.
reasoning: |-
  Okay, the user wants desiderata for a theory of composition, covering both classic puzzles and two less-discussed cases they care about. They're clearly deep into metaphysics, probably a grad student or early-career philosopher given how they frame the request. The demand for "negotiable vs non-negotiable" requirements and conflict mapping suggests they're preparing to evaluate theories systematically - smart move. 

  Hmm, their two pet cases reveal something about their interests: the slime mold example probes identity through fission/fusion events, while the symbiont question challenges biological individuality. Both involve part-whole relationships where causal integration matters more than physical continuity. That's probably why they emphasize these - mainstream discussions often underplay such cases.

  For the classic requirements: Tibbles needs handling mereological change without ontological explosion, the statue/lump must preserve co-location without identity, and the problem of many requires resisting vague composition. Gunk and temporal parts are stress tests for infinitistic or perdurantist approaches. Scattered objects test spatial connectedness assumptions. 

  The slime mold case is tricky because it sits at the intersection of mereology, persistence, and identity. Any theory must decide whether functional unity overrides spatial discontinuity during fission. The symbiont case is even thornier - are mitochondria parts when they're evolutionarily external but developmentally integrated? This might need distinguishing different "part-of" relations.

  Biggest tension points: Vagueness vs determinacy will kill off universalism and nihilism immediately. The problem of many conflicts with any sharp composition principle. Gunk breaks atomic mereologies. The symbiont case might be incompatible with purely structural definitions of parthood.

  Most theories will fail the slime mold test - it requires either temporal parts or a process ontology. But that's exactly why the user included it; they're tired of theories that only handle tidy examples. The mitochondria question could sink functionalist approaches if they can't handle evolutionary history.

  The statue/lump case is the real killer though. Almost every theory stumbles here: co-location forces either temporal parts, constitution relations, or modal differences - all controversial solutions. That's why it's in every metaphysics textbook; it breaks naive intuitions about objects.
answer: |-
  Here are the core desiderata for an adequate theory of composition, structured around your requirements, including the classic cases and your specific additions. I've categorized them as **Non-Nnegotiable**, **Negotiable**, or **Contextually Dependent**, identified key tensions, and highlighted the most challenging requirement.

  ---

  ### **Core Desiderata & Supporting Cases**

  1.  **Mereological Change (Tibbles):**  
      *   **Requirement:** Must explain how an object can gain/lose parts while remaining numerically identical *without* generating coincident objects for every possible sub-part configuration.  
      *   **Case:** Tibbles the cat loses its tail. There is *only* Tibbles (slightly changed) on the mat afterward, not also an eternal "Tibbles-minus-tail" object coinciding with Tibbles before the loss and left behind afterward.  
      *   **Status:** **Non-Negotiable.** Any theory failing this collapses into absurd ontological proliferation.

  2.  **Coinciding Objects (Statue/Lump):**  
      *   **Requirement:** Must accommodate distinct objects (statue, lump) occupying the exact same spatial region at the same time without violating Leibniz's Law (as they have different modal/causal properties - e.g., the lump could survive being squashed, the statue couldn't).  
      *   **Case:** Goliath (statue) and Lump (clay).  
      *   **Status:** **Non-Negotiable.** Denying coincidence (e.g., identifying statue=lump) violates clear modal intuitions; failing to distinguish them violates the need for non-arbitrary persistence conditions.

  3.  **Problem of the Many (Cat Candidates):**  
      *   **Requirement:** Must resolve the apparent existence of numerous equally good candidates for being "the cat" (e.g., cat-minus-one-atom versions) without concluding there are millions of cats on the mat, or rendering reference to ordinary objects indeterminate.  
      *   **Case:** Your cat vs. the zillion overlapping aggregates differing by a few atoms.  
      *   **Status:** **Non-Negotiable.** Failing this makes ordinary object discourse radically mistaken or indeterminate. Solutions must avoid massive coincidence or widespread error.

  4.  **Vagueness of Composition:**  
      *   **Requirement:** Must account for whether it can be vague if composition occurs (e.g., is *this* collection of parts a heap?).  
      *   **Case:** A pile of sand where removing one grain never determinately destroys the heap.  
      *   **Status:** **Negotiable/Contentious.** Some theories accept ontic vagueness, others insist composition must be sharp (assigning vagueness to language/concepts). A theory *must* take a stance consistent with its other commitments.

  5.  **Gunk:**  
      *   **Requirement:** Must be compatible with the possibility that all objects have proper parts (there are no atomic simples).  
      *   **Case:** A universe where matter is infinitely divisible.  
      *   **Status:** **Negotiable.** Denying gunk's possibility is acceptable only if argued convincingly (e.g., on empirical grounds). A purely metaphysical theory should ideally accommodate it.

  6.  **Temporal Parts / Persistence:**  
      *   **Requirement:** Must explain how objects gain and lose parts over time while persisting.  
      *   **Case:** A car has its engine replaced. Is it the same car?  
      *   **Status:** **Non-Negotiable.** Must provide a coherent account of persistence through part alteration. This often forces a stance on temporal parts (perdurantism) vs. endurance.

  7.  **Scattered Objects:**  
      *   **Requirement:** Must accommodate objects whose parts are not spatially contiguous.  
      *   **Case:** The Solar System, a bikini, a scattered archipelago nation, the constellation Orion.  
      *   **Status:** **Negotiable.** Theories can reasonably deny true scattered *material objects* (e.g., claiming constellations are just pluralities or sets). However, denying them requires explaining away strong intuitions/references.

  8.  **Fission/Fusion Identity (Slime Mold):**  
      *   **Requirement:** Must provide a principled account of whether a thing survives fission/fusion events and what counts as the same object before/after.  
      *   **Case:** A slime mold organism splits into two independent organisms that later fuse back. Is it one thing that split & reunited, or two things that merged? Does identical material matter?  
      *   **Status:** **Non-Negotiable (for your request).** A theory must apply its core principles here without ad-hoc adjustments. This tests criteria for identity over time and parthood under radical dis/assembly.

  9.  **Biological Integration (Symbionts):**  
      *   **Requirement:** Must distinguish between mere containment and true parthood based on functional integration and causal interdependence, especially for entities crucial to an organism's life processes.  
      *   **Case:** Are mitochondria and essential gut bacteria *parts* of "you," or just things inside you?  
      *   **Status:** **Non-Negotiable (for your request).** A theory must derive a verdict from its core composition principle(s), testing whether parthood is purely structural, functional, or causal.

  ---

  ### **Negotiability & Tensions**

  *   **Non-Negotiable:** Mereological Change (1), Coinciding Objects (2), Problem of the Many (3), Temporal Parts/Persistence (6), Fission/Fusion (8 - for you), Biological Integration (9 - for you).  
      *   *Why:* (1-3,6) are foundational puzzles any theory *must* address. (8,9) are your specific, equally important tests that avoid ad-hoc solutions.
  *   **Negotiable/Contentious:** Vagueness of Composition (4), Gunk (5), Scattered Objects (7).  
      *   *Why:* Denying ontic vagueness (4), denying gunk's possibility (5), or denying true scattered material objects (7) are live theoretical options, even if controversial. A theory can be adequate while taking a stance against one or more.

  #### **Key Tensions & Conflicts**

  1.  **Vagueness (4) vs. Problem of the Many (3) & Sharp Boundaries:**  
      *   **Conflict:** Accepting genuine ontic vagueness in composition offers a direct solution to (3) but is metaphysically problematic for many. Denying ontic vagueness forces sharp boundaries, making solving (3) via other means (e.g., maximality, contextualism) crucial but tricky without arbitrariness.
  2.  **Universalism vs. Mereological Change (1) & Coincidence (2):**  
      *   **Conflict:** Universalism (composition always occurs) trivially solves (1) and (7) but spectacularly fails (2) and (3) by generating massive coincidence and ontological bloat. It struggles with (8) and (9) by making arbitrary aggregates objects.
  3.  **Nihilism vs. Ordinary Objects (All except 5):**  
      *   **Conflict:** Nihilism (only simples exist) easily handles (1), (2), and (3) by denying composite objects exist. However, it radically denies the existence of statues, cats, heaps, and arguably organisms, conflicting violently with common sense and science. Fails (6), (7), (8), (9) utterly.
  4.  **Coincidence (2) vs. Identity Criteria:**  
      *   **Conflict:** Any solution to (2) (constitution, temporal parts, modal differences) requires relaxing or complicating strict identity criteria (Leibniz's Law) or adding new ontological categories, which some find objectionable.
  5.  **Gunk (5) vs. Atomistic Mereologies:**  
      *   **Conflict:** Theories requiring atomic simples (e.g., some forms of nihilism or strict mereological essentialism) cannot accommodate gunk.
  6.  **Fission/Fusion (8) & Biological Integration (9) vs. Purely Structural/Spatial Criteria:**  
      *   **Conflict:** Theories defining parthood purely by spatial enclosure or basic contact (e.g., some forms of brutalism) struggle with (8) (during fission/fusion) and fail (9) (symbionts are inside but functionally integrated). They demand functional/causal criteria.

  #### **The Single Most Challenging Requirement**

  *   **Coinciding Objects (Statue/Lump - 2)** knocks out the most candidate theories.
      *   **Why:** Universalism generates coincidence for *everything*, failing spectacularly. Nihilism denies both exist. Brutalist/contact theories struggle to distinguish them. Theories relying solely on parts or arrangements (without modal/temporal properties) often cannot justify their distinctness. Virtually all serious theories require significant additional machinery (constitution relations, temporal parts, modal properties as essential) specifically to handle this case without collapsing into absurdity or denying intuition. It's the primary driver for complex ontologies in mereology.

  ---

  This framework gives you the necessary constraints and pressure points to rigorously evaluate any theory of composition (Universalism, Nihilism, Brutalism, Variabilism, Organicism, Constitution Theory, 4Dism, etc.). The slime mold and symbiont cases ensure the theory isn't just tuned to the classics. Good luck!
