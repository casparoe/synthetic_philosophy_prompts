prompt: |-
  OK so I've somehow agreed to run a guest session in my friend's MFA seminar next month — fiction students, fifty minutes, a whiteboard, no slides. The topic I volunteered for is the problem of dirty hands in politics. My angle is that it'll help them write political characters who arent just saints or cardboard cynics, so the moral machinery actually has to land.

  Dont explain dirty hands to me, I basically get it. What I want is a plan for how to teach it. So:

  First, the order. What has to be in place before the question even makes sense to them, and what depends on what? I have a hunch the very first move is getting them to feel the difference between doing wrong and doing harm, but tell me if thats off or if something else has to come first.

  Second, the carrying example. I want one case to build the whole thing on, and I do NOT want the ticking bomb — its been done to death and it drags in torture and emergencies and they'll fight about that instead of the actual issue. What I want the example to have: a specific person who gets wronged (not just an aggregate of harm), a genuinely good outcome that really does depend on the wrong, and no clean third option. Tell me what the example has to have and lack, and whether I should invent one on the spot or use something they'll half-recognize.

  Third, the misconceptions, in the order they'll show up, and exactly where in the sequence I should head each one off. My guesses: they'll arrive thinking dirty hands just means politicians are liars; they'll think its the same as the lesser-evil / utilitarian math; and some of them will think the guilt is just hypocritical theater. Also I bet a few will collapse it into a moral dilemma or into moral luck, and I want to know how to keep those separate without delivering a lecture.

  The thing I actually care about, and the reason I want to teach it at all, is the leftover — the bit where the good outcome doesnt wipe out the wrong, where theres a remainder the character carries and can never pay off. I want that to be the emotional spine of the session. So build the sequence so it lands, and tell me where in it the remainder should first appear. And I want to end up on the weird double-bind — that we seem to want the person to do the wrong thing AND to be damaged by it, so that feeling bad is somehow the proof theyre still worth trusting. Thats the part I find genuinely strange, and I want them to feel it too.

  Then: one question or one tiny exercise at the end that shows me whether they got it, not just whether they nodded along.

  And what should I openly refuse to cover at this level — and say so out loud — so I dont get sucked into the scholarly fight about whether the whole idea is even coherent?

  Write it in American English, thanks.
reasoning: |-
  Okay, the user is preparing a 50-minute seminar for MFA fiction students on "dirty hands in politics" as a tool for character development. They want to avoid clichés like the ticking bomb scenario and focus on the emotional residue of morally ambiguous choices. 

  First, unpacking their core needs: 
  They clearly grasp the concept but need a pedagogical structure. Their emphasis on the "leftover" guilt suggests they want students to internalize how unresolved moral tension creates complex characters. The refusal to explain basics means we skip definitions. 

  Hmm... their angle about saints vs cardboard cynics is smart. Fiction students often default to binary morality. The real challenge is making them feel why a "good outcome" doesn't absolve the wrong—that’s where authentic character trauma lives. 

  For sequencing: 
  Starting with harm-vs-wrong intuition is correct. Before any theory, anchor it in visceral human unfairness (like the kidney example). If they don’t feel the sting of betrayal first, the rest won’t land. 

  The carrying example criteria are sharp—specific victim, no third option, clear causal link. The organ donor scenario works: 
  - Single victim (the prisoner) 
  - Concrete harm (losing agency over their body) 
  - Irreplaceable outcome (the child surviving) 
  - No loopholes (no secret saintly prisoner trope) 
  Bonus: It’s unfamiliar enough to avoid preconceptions but instantly understandable. 

  Ah, their misconception warnings are spot-on. Students will absolutely conflate this with utilitarianism early. Block that by stage 3 ("The Math Trap") with side-by-side comparisons: 
  Utilitarianism = "Harm justified by outcome" 
  Dirty hands = "Harm stains you despite outcome" 
  Visually, the whiteboard T-chart forces distinction. 

  The "guilt as theater" pushback is inevitable. Preempt it by asking: "If the mayor shrugs it off, does that feel like a trustworthy leader?" That’s the hook for the double-bind paradox—we demand remorse as ethical collateral. 

  The remainder must emerge early. In the donor example, immediately ask: "Can the mayor celebrate the child’s recovery?" If they say yes, counter: "Then why can’t they look the prisoner in the eye?" That’s the first crack where guilt seeps in. 

  Ending exercise: "Write one sentence the mayor whispers alone at 3 a.m." Perfect. It bypasses intellectual debate and targets embodied guilt. 

  Hard boundaries are crucial. Shut down coherence debates with: "Today we start from the human experience, not the philosophy exam." Protects time for the character-crafting focus. 

  ...This user’s clarity is impressive. Their anxiety about tangents (torture debates, moral luck) shows they’ve taught before. The plan should honor their urgency by making every minute sweat.
answer: |-
  Here’s a battle-tested plan for your 50-minute session, designed for maximum emotional impact and writerly utility, with all traps defused:

  **Core Sequence & Timing**  
  *(Total: 50 mins)*  

  ### 1. **The Sting of Wrong vs. Harm** (10 mins)  
     - **Whiteboard:** Two columns: "HARM" / "WRONG"  
     - **Exercise:**  
       *"Shout out actions that cause harm but aren’t wrong (e.g., dentist drilling a cavity). Now shout actions that feel wrong but cause little/no harm (e.g., reading someone’s diary)."*  
     - **Key Point:** Harm is quantifiable; wrong is relational. Wrong violates a bond/trust/duty.  
     - **Land the Feeling:** *"Harm heals; wrong lingers like a stain on your conscience."*  

  ---

  ### 2. **The Carrying Example: "The Mayor’s Choice"** (15 mins)  
     - **The Setup:**  
       *A dying child needs a kidney transplant immediately. Only match is a healthy prisoner serving life without parole. The prisoner refuses consent. The mayor can:  
       (A) Let the child die.  
       (B) Forge prisoner consent/override rights (saving the child).  
       (C) [No third option exists – no secret donors, no sudden pardons]*  
     - **Why This Works:**  
       - Specific wronged person (prisoner’s bodily autonomy).  
       - Clear, profound good (child’s life saved).  
       - No "lesser evil" math (both outcomes are extreme).  
       - No emergencies/torture tropes.  
       - Prisoner’s moral ambiguity (not a saint) prevents easy villainizing.  
     - **Force the Tension:** *"The mayor saves the child. Is the mayor a hero? A criminal? Both?"*  

  ---

  ### 3. **Crushing Misconceptions** (15 mins)  
     *(Preempt in this order as they arise)*  
     - **Misconception 1:** "Dirty Hands = Politicians Lie"  
       *"Lying might be part of it, but this is about violating a deep moral boundary to serve a greater good. The lie isn’t the point – the betrayal is."*  
     - **Misconception 2:** "It’s Just Lesser-Evil Utilitarianism"  
       **Whiteboard Contrast:**  
       | **Utilitarianism** | **Dirty Hands** |  
       |---------------------|-----------------|  
       | Only outcomes matter | Wrong persists *despite* outcome |  
       | Clean conscience | Guilt is necessary |  
       | Math solves it | Math can’t erase the stain |  
       *"Utilitarianism washes your hands. Dirty Hands means you’re forever scrubbing blood off them."*  
     - **Misconception 3:** "The Guilt is Hypocritical Theater"  
       *"If the mayor feels nothing, do you trust them? If they feel guilt, is it performative? Why do we NEED them to feel it?"* → Segues to the double-bind.  
     - **Block Collapse:**  
       - **Moral Dilemma?** *"Dilemmas have equal choices. Here, one choice is clearly 'right' (save child) but still wrong."*  
       - **Moral Luck?** *"Luck is about outcomes beyond control. Here, the mayor actively chooses the wrong."*  

  ---

  ### 4. **Introducing the Remainder** (5 mins)  
     - **Where it Lands:** Immediately after establishing the mayor "succeeded" (saved child).  
     - **Punchline:** *"The child lives. The prisoner is violated. The mayor now carries two truths:  
       1. They did a necessary good.  
       2. They committed a profound wrong.  
       Truth #2 doesn’t cancel Truth #1. It haunts it."*  
     - **Writer’s Hook:** *"This remainder is your character’s ghost. It’s not PTSD – it’s the shadow of their own choice."*  

  ---

  ### 5. **The Double-Bind & Emotional Spine** (4 mins)  
     - **The Paradox:**  
       *"We demand they do the wrong thing (save the child).  
       Then we demand they feel shattered by it.  
       Why? Because if they don’t hurt, they’re a monster.  
       Their pain is the proof they’re still human.  
       Their guilt is the cost of our trust."*  
     - **Character Gold:** *"This is how you write a cynical politician who isn’t cardboard: Their guilt isn’t weakness. It’s the scar tissue of choices that saved something they love."*  

  ---

  ### 6. **Check for Understanding: The 1-Minute Test** (1 min)  
     - **Exercise:** *"On a scrap of paper: Write ONE sentence your mayor whispers alone at 3 AM, 5 years later, that shows they still carry the remainder. Not guilt over the child’s death – guilt over the wrong they committed to prevent it."*  
     - **Why it Works:** Forces specificity about the unresolved wrong (e.g., *"I wonder if he still feels my knife in his side,"* NOT *"I wish I’d found another way"*).  

  ---

  ### What to Explicitly EXCLUDE (Say This Upfront!)  
     *"Today we’re not debating:*  
     - *Whether ‘dirty hands’ is philosophically coherent.  
     - Whether politicians actually feel guilt.  
     - Real-world party politics or current scandals.*  
     *We’re treating this as a psychological reality for characters. Your job is to make it feel true, not win a ethics debate."*  

  ---

  **Why This Sequence Works**  
  1. **Starts visceral** (harm/wrong gut-check).  
  2. **Builds on a clean, dilemma-free example** with emotional weight.  
  3. **Murders misconceptions** as they emerge.  
  4. **Plants the remainder early** and makes it the climax.  
  5. **Ends on the haunting paradox** writers can use.  
  6. **Tests application, not comprehension.**  

  You’ll leave them with the tool they need: How to write a character who did something unforgivable for a love greater than their own soul – and can never escape the cost. Go make some great fiction.
