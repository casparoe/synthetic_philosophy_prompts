  We are designing an activity for a reading group on the Frege-Geach problem, with the goal of making the problem emerge as a discovery during play. The activity should:
  - Cast participants as a community using an expressivist semantics: meaning of a sentence is the attitude it expresses.
  - They keep a public ledger assigning one meaning per sentence.
  - They score points by winning arguments that the group accepts as valid (with fixed rules of composition and validity).
  - The tension should arise between having one meaning per sentence and maintaining validity by the group's own rules.

  We also want:
  - The problem to appear in distinct forms (asserted vs. unasserted, negation, conditionals, modus ponens) and only later reveal they are the same issue.
  - Start with a non-moral vocabulary (e.g., matters of taste) and then swap in moral vocabulary without announcement.

  The debrief should:
  - Walk through the jams and identify which part of the Frege-Geach problem they correspond to.
  - Discuss escape routes (expressivist earning realist vocabulary, meaning as inferential role, etc.) and their costs.

  Practical advice:
  - Predict what might go wrong (e.g., someone refusing to play expressivist, ledger confusion) and how to handle it.
  - Be candid about what the activity cannot do (e.g., cannot make them feel the pull of realism, or prove expressivism false).

  Let's design the activity in two halves: first with a taste vocabulary, then with moral vocabulary.

  **Activity Design: "The Meaning Ledger"**

  **Setup:**
  - **Premise:** The community has an expressivist semantics: the meaning of a sentence is the mental attitude it expresses. They have a public ledger that records every sentence uttered and assigns it exactly one meaning (which is an attitude).
  - **Attitudes:** For the first half (taste), attitudes might be: LIKE, DISLIKE, NEUTRAL. For the second half (moral), attitudes might be: APPROVE, DISAPPROVE, NEUTRAL. (We can start with just positive and negative, then add neutral if needed.)
  - **Vocabulary:** 
    - First half (taste): Sentences about food, e.g., "Broccoli is delicious," "Broccoli is not delicious," "If broccoli is delicious, then you should try it," etc.
    - Second half (moral): Sentences about actions, e.g., "Lying is wrong," "Lying is not wrong," "If lying is wrong, then you shouldn't do it," etc.
  - **Rules of Composition:** We need simple rules for how attitudes compose in complex sentences. But expressivism traditionally has trouble with composition, so we'll set up rules that are intuitive but will break.
    - We will define rules for:
      - Negation: If a sentence S expresses attitude A, then "not S" expresses the opposite attitude (if A is positive, opposite is negative; if negative, then positive; if neutral, then neutral? Or maybe we don't have neutral at first).
      - Conditional: "If P then Q" expresses ...? This is tricky. We might say that it expresses a conditional attitude? But what is that? We might have to set a rule that the attitude of the conditional is a function of the attitudes of P and Q. However, to set up the problem, we might initially say that the conditional expresses a NEUTRAL attitude? Or we might avoid defining it and let the group try to assign an attitude when it comes up.

  But note: We want the group to have fixed rules in advance. So we have to define the rules.

  Proposed rules (to be explained at the start):

  1. **Atomic sentences:** 
     - In the taste domain: "X is delicious" expresses LIKE(X). 
     - "X is not delicious" expresses DISLIKE(X) [by rule of negation? or we can have atomic negative? Let's have negation as an operator].

     Actually, we might have:
     - Atomic: "X is delicious" -> LIKE(X)
     - Negation: For any sentence S that expresses attitude A, "not S" expresses the opposite of A (so if A is LIKE, then DISLIKE; if DISLIKE, then LIKE; if NEUTRAL, then NEUTRAL?).

     But note: In the taste case, "not delicious" might naturally express DISLIKE. So we can start with that.

  2. **Conditional:** We must define it. Let's say: "If P then Q" expresses an attitude that is NEUTRAL? Or we can say it expresses a conditional attitude, but we haven't defined that. To force the problem, we might say that the conditional must be assigned an attitude just like any other sentence, and we'll let the group decide at first? But that might not work because we want fixed rules.

  Alternative: We fix the rules of validity (inference rules) and then the attitude assignment must be consistent with those rules. But the rules of validity are about what arguments are accepted.

  **Validity Rules:**
  - We define a set of valid inference patterns that the group must accept. For simplicity, we'll use:
    - Modus Ponens: From "If P then Q" and P, infer Q.
    - Negation Elimination: From not(not P), infer P.
    - And perhaps others as needed.

  But how does validity relate to attitudes? In expressivism, validity is usually explained in terms of attitudes: an argument is valid if it is impossible to accept the premises without accepting the conclusion. But in our game, we are representing acceptance by having the attitude in the ledger? Not exactly: the ledger records the meaning (attitude) of the sentence, but someone might utter a sentence without endorsing it? 

  Ah, here's a key: in the game, when a sentence is uttered, it is asserted? Then the person asserting it is expressing that attitude. But when we have embeddings, the sentence is not asserted. So we need a way to record the meaning of the sentence even when it's not asserted.

  We have the ledger: every sentence that is uttered (in any context) must be assigned a meaning (an attitude). So if someone says, "If lying is wrong, then stealing is wrong," that sentence is assigned an attitude (even though the speaker isn't necessarily endorsing that lying is wrong or that stealing is wrong).

  **Gameplay:**

  The group will engage in short arguments. Each argument is a sequence of utterances (premises and conclusions). After each sentence is uttered, the group must assign it an attitude and write it in the ledger. Then, when an inference is made, the group must decide if it is valid by their rules.

  **Scoring:**
  - A player gets a point if they successfully make a valid inference that the group accepts (i.e., they state a conclusion from premises that are in the ledger, and the group agrees that the inference rule applies).
  - But note: the conclusion must then be added to the ledger with its attitude.

  **The Tension:**
  As the game progresses, complex sentences (negations, conditionals) will be uttered. The group must assign each an attitude. Then, when they try to use these in inferences (like modus ponens), they may find that the attitude assigned to the conditional and the premise don't force the attitude of the conclusion. For example:

  - Suppose "If P then Q" is assigned NEUTRAL.
  - And P is assigned LIKE (so the speaker is endorsing P).
  - Then modus ponens says we can infer Q. But what attitude should Q have? It should be the same as if it were asserted alone (LIKE for Q). But the rules of composition for the conditional (which we set to NEUTRAL) don't tell us that when the conditional is NEUTRAL and P is LIKE, then Q must be LIKE. 

  So the group will have to assign Q an attitude. But if they assign it LIKE, then they are effectively treating the conditional as having a meaning that preserves truth (or attitude) in a way that their assignment of NEUTRAL doesn't capture.

  **Structure of the Session:**

  1. **Introduction (5 minutes):** Explain the setup: the community uses an expressivist semantics. The meaning of a sentence is the attitude it expresses. They have a public ledger that records every sentence and its meaning (attitude). They have fixed rules for how to assign attitudes to complex sentences (negation, conditional) and fixed rules of valid inference (modus ponens, etc.). The goal is to win arguments (by making valid inferences) and score points.

  2. **First Half: Taste Vocabulary (30 minutes)**
     - Vocabulary: "Broccoli is delicious", "Chocolate is delicious", etc.
     - Attitudes: LIKE, DISLIKE. (We'll avoid NEUTRAL at first to keep it simple, but it might emerge.)
     - Rules of composition:
       - Negation: If S has attitude A, then "not S" has the opposite (if A is LIKE, then DISLIKE; if DISLIKE, then LIKE).
       - Conditional: We have to define. Let's start by not having conditionals in the first few moves. Then when a conditional is first introduced, we'll let the group assign an attitude? But we said fixed rules. So we must define in advance.

     Proposed rule for conditional: 
       - "If P then Q" expresses an attitude that is a function of P and Q? But that's circular because Q might not be uttered yet. Alternatively, we might say that the conditional always expresses NEUTRAL. But that will cause problems when we use modus ponens.

     Alternatively, we can have the group decide the attitude for conditionals at the time of utterance? But then we don't have fixed rules. We want fixed rules to create the tension.

     Revised idea: We have fixed rules that are initially plausible but then break.

     Rule for conditional: The attitude of "If P then Q" is the same as the attitude of Q if P were true? But that's vague. 

     Another idea: In the taste case, we might define "If P then Q" as expressing an attitude of CONDITIONAL_LIKE or something? But that's not helpful.

     Perhaps we can avoid conditionals in the first half and only use negation? Then in the second half, when we switch to moral, we introduce conditionals. But the problem has multiple parts, and we want them to appear separately.

     So let's break the problem into stages:

     Stage 1: Negation in simple assertions.
       - Example: Alice says, "Broccoli is delicious." -> LEDGER: "Broccoli is delicious": LIKE(broccoli)
       - Bob says, "Broccoli is not delicious." -> LEDGER: "Broccoli is not delicious": DISLIKE(broccoli) [by negation rule]
       - Now, are these two consistent? They are, because two different attitudes. But then if we have a sentence that embeds, like "If broccoli is delicious, then ...", we haven't done that.

     Stage 2: Unasserted contexts.
       - Alice says, "If broccoli is delicious, then chocolate is delicious." 
          - How to assign an attitude? We must assign one. Let the rule be: conditionals express NEUTRAL. So we assign NEUTRAL to this conditional.
       - Now, Bob says, "Broccoli is delicious." -> LIKE(broccoli)
       - Then by modus ponens, they infer "Chocolate is delicious." -> must assign LIKE(chocolate). But note: the conditional was NEUTRAL, and the premise was LIKE, and the conclusion is LIKE. The group accepted the inference as valid (modus ponens is a fixed rule). But why, if the conditional was NEUTRAL, does it lead to a positive attitude? The group might not see a problem because they are used to modus ponens.

     But then we can have:

     Stage 3: A conditional with a negative antecedent.
       - Carol says, "If broccoli is not delicious, then chocolate is not delicious." -> NEUTRAL
       - Then if someone asserts "Broccoli is not delicious" (DISLIKE), then by modus ponens they get "Chocolate is not delicious" (DISLIKE). Again, no problem.

     Stage 4: The problem arises when we have a conditional and we don't endorse the antecedent.

       - Suppose we have: 
          - "If broccoli is delicious, then chocolate is delicious." (NEUTRAL)
          - "Broccoli is not delicious." (DISLIKE)
          - Now, what about chocolate? We cannot infer anything about chocolate from these two. But what if we want to say: "If broccoli is delicious, then chocolate is delicious, but broccoli is not delicious, so we don't know about chocolate." That's fine.

     But then how does the problem manifest? We need a situation where the attitudes conflict.

     Consider modus ponens with a conditional that we want to use but that doesn't have the right attitude.

     Alternatively, consider an argument that is clearly valid but the attitudes don't match:

     Example: 
       P1: If broccoli is delicious, then chocolate is delicious. [attitude: NEUTRAL]
       P2: Broccoli is delicious. [attitude: LIKE]
       C: Therefore, chocolate is delicious. [must be assigned: LIKE]

     Now, the problem: Why is it that when we have the conditional (which is NEUTRAL) and the premise (LIKE), we get a conclusion that is LIKE? What is the connection? The expressivist might say that the meaning of the conditional is not just NEUTRAL, but something else? But we assigned NEUTRAL.

     The group might be fine with this. Then we need a more direct conflict.

     The classic Frege-Geach problem for conditionals: 

     Consider:
       (1) Lying is wrong. [APPROVE? Wait, for moral we use APPROVE for wrong? Actually, let's define: "X is wrong" expresses DISAPPROVE(X).]

     But in the taste case:

     Suppose we have:
       (1) Broccoli is delicious. [LIKE]
       (2) If broccoli is delicious, then chocolate is not delicious. [NEUTRAL?]
       (3) Therefore, chocolate is not delicious. [DISLIKE]

     Now, if (1) and (2) are asserted, then (3) must be inferred. But what if someone likes both broccoli and chocolate? Then they might object: they accept (1) and (2) but not (3). But (2) was assigned NEUTRAL, meaning the speaker doesn't endorse either? Then how can we force the inference?

     The issue is that the validity of modus ponens requires that the conditional have a particular meaning: that it is true if either the antecedent is false or the consequent is true. But in expressivist terms, if the conditional is just NEUTRAL, then it doesn't constrain the attitudes in the way that modus ponens requires.

     To make it break, we might have a participant who accepts (1) and (2) but then refuses to accept (3). The group must then decide: is the argument valid? They have a rule that modus ponens is valid, so they should force the conclusion. But the meaning assigned to (2) (NEUTRAL) doesn't explain why, from (1) and (2), we get (3). 

     This might be the moment of grinding.

  **Second Half: Moral Vocabulary (30 minutes)**
     - Without announcement, switch to moral vocabulary: "Lying is wrong", "Stealing is wrong", etc.
     - Use the same rules: 
          - "X is wrong" -> DISAPPROVE(X)
          - "not (X is wrong)" -> APPROVE(X) [opposite of DISAPPROVE]
          - Conditional: NEUTRAL
     - Now, run the same kind of arguments.

     Example:
       (1) Lying is wrong. [DISAPPROVE(lying)]
       (2) If lying is wrong, then stealing is wrong. [NEUTRAL]
       (3) Therefore, stealing is wrong. [must assign DISAPPROVE(stealing)]

     But now, a participant might object: "I think lying is wrong, but I don't think that if lying is wrong then stealing is wrong. In fact, I think stealing is sometimes okay. So I accept (1) and I don't accept (2). But what if someone else asserts (2)? Then when I assert (1), and the other person asserts (2), then the group forces me to accept (3)? But I don't approve of that!"

     However, in the game, the person who asserts (2) is expressing NEUTRAL about the conditional. They are not endorsing the connection. But then why does the inference go through? The group's rule says modus ponens is valid, so they must accept (3) if (1) and (2) are in the ledger. But the meaning of (2) is NEUTRAL, which doesn't seem to have the necessary force.

     This is the problem.

  **Debrief (10 minutes):** 
  - Walk through the moments where the ledger and validity clashed. For each, identify which aspect of the Frege-Geach problem it was:
    1. **Unasserted context:** When a sentence is used in a conditional (or other embedding) and not asserted, what attitude does it express? In the ledger, we assigned NEUTRAL to the conditional, but the atomic sentence inside the conditional would normally express an attitude if asserted. But when unasserted, it's not clear what attitude it expresses. We assigned the whole conditional NEUTRAL, but that doesn't account for the parts.
    2. **Negation:** We had a rule for negation, so that worked in the simple cases. But what about negating a complex sentence? (We didn't do that, but it could be another aspect.) Also, the negation of an atomic moral sentence is straightforward, but what about the negation of a conditional?
    3. **Conditionals and Modus Ponens:** The big issue: the conditional was assigned NEUTRAL, but modus ponens requires that the conditional have a particular meaning that relates the antecedent and consequent. The NEUTRAL assignment doesn't provide that relation, so the inference seems unmotivated.

  - Then, discuss escape routes:
    - **Option 1: Expressivism with more sophisticated attitudes.** The expressivist might say that the attitude expressed by a conditional is a complex attitude, e.g., a higher-order attitude. For example, "If P then Q" expresses disapproval of having the attitude of P without the attitude of Q. But then we have to define these for all embeddings, and it gets complicated. Cost: Complexity and potential loss of the original expressivist simplicity.
    - **Option 2: Meaning as inferential role.** The meaning of a sentence is not just a simple attitude but its role in inferences. This might lead to a view like normative expressivism that assigns truth-conditional meanings. Cost: It might collapse into a kind of realism.
    - **Option 3: Quasi-realism.** The expressivist project is to explain how we can talk as if there are moral truths and properties, even though there aren't. They then earn the right to use the realist vocabulary. Cost: It might be seen as realism in disguise.

  - Honest accounting: The quasi-realist option might make expressivism indistinguishable from realism. The inferential role option might require giving up the idea that meaning is simply the expression of an attitude.

  **Predictable Problems and Solutions:**

  1. **Participant refuses to play expressivist:** They argue from outside, saying "But in reality, moral sentences are true or false." 
     - Solution: Remind them that in this activity, we are simulating a community that has adopted expressivism. The point is to see what happens inside that system. If they persist, assign them the role of "skeptic" who must challenge from within the expressivist framework.

  2. **Ledger confusion:** The ledger becomes messy, or participants argue about how to assign attitudes to complex sentences.
     - Solution: Have a designated ledger keeper (rotate if needed). For complex sentences, stick to the rules defined at the start. If the rules are unclear, note that as part of the problem and move on.

  3. **The group doesn't feel the tension:** They might just accept the inferences without question because they are used to logic.
     - Solution: The facilitator can introduce a character (maybe the retired linguist) who challenges: "Wait, why should we accept the conclusion? The conditional was NEUTRAL, so why does it force anything?" Or design an argument where the conclusion is something that some participants don't accept (in the moral case) to create tension.

  **What the activity cannot do:**
  - It cannot make participants feel the pull of realism. That would require contrasting the expressivist system with a realist one, but we are inside expressivism.
  - It does not show that expressivism is false, only that it has a challenge (the Frege-Geach problem) that must be addressed. The facilitator should note that expressivists have developed sophisticated responses (like quasi-realism) and that the activity only shows the initial challenge.

  **Revised Activity Plan:**

  **Materials:** Whiteboard or large paper for the ledger, markers.

  **Setup (5 min):**
  - Explain the expressivist premise: In this community, the meaning of a sentence is the mental attitude it expresses. We have a ledger to record every sentence and its meaning (attitude).
  - For the first domain (taste): 
     - Atomic sentence "X is delicious" expresses LIKE(X).
     - Rules:
          - Negation: If S has attitude A, then "not S" has the opposite (LIKE <-> DISLIKE).
          - Conditional: "If P then Q" expresses NEUTRAL. (We choose this rule to set up the problem.)
  - Validity rules: 
          - Modus Ponens: If you have "If P then Q" and P, then you can infer Q. (And the attitude of Q should be the same as if it were asserted alone? But note, in the ledger, Q will get an attitude when inferred.)
          - Also, we can have: From not(not P), infer P.
  - Gameplay: Participants take turns uttering sentences. After each utterance, the group assigns an attitude and writes it in the ledger. When someone makes an inference (states a conclusion from premises in the ledger), the group checks if the inference rule applies. If so, the conclusion is added to the ledger with the appropriate attitude, and the player scores a point.

  **First Half: Taste (30 min)**
  - Start with simple assertions and negations:
     - Example: Alice says, "Broccoli is delicious." -> LIKE(broccoli)
     - Bob says, "Broccoli is not delicious." -> DISLIKE(broccoli) [by negation rule]
     - Now, they can argue? But there's no inference yet.

  - Introduce a conditional:
     - Carol says, "If broccoli is delicious, then chocolate is delicious." -> NEUTRAL
     - Now, if Alice (who likes broccoli) is present, she might assert "Broccoli is delicious" (if not already there). Then, using modus ponens, infer "Chocolate is delicious" -> LIKE(chocolate). 

     This should go smoothly.

  - Now, create a conflict in attitudes:
     - Suppose Dave says, "If chocolate is delicious, then broccoli is not delicious." -> NEUTRAL
     - And we have "Chocolate is delicious" in the ledger (LIKE). Then by modus ponens, we get "Broccoli is not delicious" -> DISLIKE(broccoli). 
     - But what if Alice already asserted "Broccoli is delicious" (LIKE)? Now we have both LIKE and DISLIKE for broccoli? 

     The ledger records each sentence separately. So we have:
          S1: Broccoli is delicious. [LIKE]
          S2: Broccoli is not delicious. [DISLIKE]   [from the inference]

     And these are two different sentences. So they are both in the ledger. But note, in classical logic, they are contradictory, but in the ledger, they are both present. The group might not see a problem because the expressivist doesn't have a problem with having both attitudes? But actually, an agent cannot both like and dislike broccoli at the same time. So the group should feel that the inference forced an attitude that conflicts with an existing one.

     This is a moment of tension: Dave's conditional and the group's acceptance of modus ponens forced an attitude (DISLIKE for broccoli) that conflicts with Alice's LIKE.

     How to resolve? They might say that the person who asserted the conditional must have been expressing an attitude that connects chocolate and broccoli, but we assigned it NEUTRAL. Why did that conditional, which was NEUTRAL, force a conflict?

  **Second Half: Moral (30 min)**
  - Without announcement, change the vocabulary. Now we talk about moral issues.
     - Atomic: "X is wrong" -> DISAPPROVE(X)
     - Negation: "not (X is wrong)" -> APPROVE(X) [opposite of DISAPPROVE]
     - Conditional: NEUTRAL (same rule)

  - Start with:
     - Alice: "Lying is wrong." -> DISAPPROVE(lying)
     - Bob: "Stealing is wrong." -> DISAPPROVE(stealing)

  - Then Carol: "If lying is wrong, then stealing is wrong." -> NEUTRAL

  - Now, using modus ponens with Alice and Carol, infer "Stealing is wrong" -> DISAPPROVE(stealing). But that's already there.

  - Now, create a situation where the inference forces an attitude the group doesn't like:
     - Dave: "If lying is wrong, then cheating on taxes is wrong." -> NEUTRAL
     - The group has "Lying is wrong" (DISAPPROVE). So they infer "Cheating on taxes is wrong" -> DISAPPROVE(cheating on taxes).

     But suppose one participant, Eve, doesn't think cheating on taxes is wrong. She might challenge: "Why do I have to accept that? The conditional was NEUTRAL, meaning the speaker wasn't endorsing the connection. So why does it bind me?"

     This is the moment: the rule of modus ponens forces the conclusion, but the meaning assigned (NEUTRAL) doesn't seem to have the necessary force to warrant the inference.

  **Debrief (10 min):**
  - Recap the jams:
    1. **Conflict in attitudes (from conditionals in taste):** The conditional's NEUTRAL attitude led to an inference that produced an attitude conflicting with an existing one. This corresponds to the problem of embedding: the conditional doesn't express an attitude about broccoli and chocolate, but it has logical power.
    2. **Unwanted moral conclusion:** In the moral case, the conditional again being NEUTRAL forced a moral conclusion that some participants might reject. This shows the same issue in a more charged context.

  - Then explain that these are instances of the Frege-Geach problem: how can expressivism account for the meaning of embedded sentences (like in conditionals, negation, etc.) and for logical inferences?

  - Discuss escape routes (as above) and their costs.

  **Final note:** The activity cannot show that expressivism is false, but it shows that a naive expressivism (with simple attitudes and composition rules) runs into trouble. Real expressivists have developed complex theories to handle this. The facilitator should mention that the Frege-Geach problem is a challenge that expressivism must meet, and it has led to sophisticated developments in metaethics.
answer: |-
  Below is a redesigned activity based on your sketch, optimized to make the Frege-Geach problem emerge as a series of discoverable tensions. It uses your core structure (expressivist ledger, points for winning arguments) but refines the mechanics to ensure the problem arises organically in distinct phases. I've weakened the "meaning just is the attitude" premise to avoid unfairness while preserving pressure, staged the problems to unfold separately before converging, and built in your taste-to-moral swap. Practical troubleshooting and limitations are covered at the end.

  ---

  ### **Activity: The Attitude Ledger Challenge**
  **Premise:** Participants form a community using an expressivist language system. **Meaning = attitude expression**, but with a tweak: attitudes are *part* of meaning, not the whole (addressing your concern about fairness). Sentences are assigned **attitude-values** (A-values) in a public ledger. The goal is to win arguments using predefined inference rules, scoring points when the group validates an inference. Tensions arise when ledger assignments clash with validity.

  #### **Key Mechanics**
  1. **Ledger Rules:**  
     - Every uttered sentence gets one **A-value** in the ledger: 👍 (endorsement), 👎 (rejection), or 🤷 (neutral/no commitment).  
     - **Atomic sentences:** Directly express 👍 or 👎 (e.g., "Broccoli is tasty" → 👍 if pro-taste).  
     - **Complex sentences:** A-values are assigned via *community vote* (simple majority) but guided by two fixed rules:  
       - **Negation rule:** If sentence *S* has A-value *V*, "not S" has the *opposite* (👍 → 👎, 👎 → 👍, 🤷 → 🤷).  
       - **Conditional rule:** "If P, then Q" *always* gets 🤷 *unless* the speaker explicitly ties it to their attitude (e.g., "I’d feel good about Q if P").  
     - *Why this works:* Voting forces debate, and the limited rules create ambiguity in embeddings. The 🤷 default for conditionals is intuitive early on but becomes unstable later.

  2. **Argument & Scoring:**  
     - Participants utter sentences to build arguments (e.g., premises → conclusion).  
     - **Inference rules** (fixed in advance):  
       - *Modus Ponens (MP):* From "If P, then Q" and P, infer Q.  
       - *Negation Flip (NF):* From "not not P," infer P.  
       - *Attitude Consistency (AC):* You can’t assert both P and "not P" *without resolving the conflict*.  
     - **Point system:** Score 1 point for each *successful inference* the group accepts as valid under the rules. A conclusion must be added to the ledger to count.  

  3. **Two Halves:**  
     - **First half (Taste domain):** Use neutral vocabulary (e.g., "Broccoli is tasty," "Jazz is enjoyable"). Attitudes are low-stakes; participants easily accept A-values as part of meaning.  
     - **Second half (Moral domain):** Swap in moral vocabulary *without warning* (e.g., "Lying is wrong," "Helping others is good"). Use identical ledger/inference rules. Attitudes are high-stakes; resistance to "forced" conclusions creates friction.  

  ---

  ### **Session Flow (75 min)**
  #### **Phase 0: Setup (5 min)**
  - Explain rules, ledger (use a whiteboard), and inference/assignment mechanics.  
  - Clarify: "In this community, *what you mean* is tied to the attitude you express. The ledger tracks this. Your job is to argue persuasively within the rules."  
  - **Weakened premise:** "Meaning isn’t *just* the attitude—it’s the attitude *plus* how it composes in sentences. But the ledger only tracks the attitude part." (This avoids unfairness while keeping pressure.)  

  #### **Phase 1: Taste Domain (25 min)**
  - **Starter prompts (facilitator-provided to seed arguments):**  
    - "Broccoli is tasty." → Vote: Likely 👍.  
    - "Not everyone likes broccoli." → Vote: May get 🤷 (tests negation rule).  
    - "If broccoli is tasty, then it’s worth buying." → 🤷 (per conditional rule).  
  - **Let debates unfold.** Participants will likely:  
    - Use *NF* on double negations (e.g., "It’s not untrue that broccoli is tasty" → 👍).  
    - Try *MP* with conditionals (e.g., from "If broccoli is tasty, then it’s worth buying" and "Broccoli is tasty," infer "It’s worth buying" → 👍).  
  - **Problems will emerge locally:**  
    - **Unasserted embeddings:** e.g., When "If P, then Q" gets 🤷, but P is 👍, why does inferring Q feel forced? *Tension: 🤷 doesn’t "connect" P and Q.*  
    - **Negation clashes:** e.g., If "P" is 👍 and "not P" is 👎, why can’t both be in the ledger? *Tension: AC rule prevents this, but why?*  
    - **Conditional neutrality:** e.g., If everyone agrees "If P, then Q" is 🤷, why does *MP* "work" at all? *Tension: 🤷 implies no commitment, but MP treats it as authoritative.*  
  - **Don’t resolve;** let tensions simmer. Award points for rule-following inferences.  

  #### **Phase 2: Moral Domain (25 min)**
  - **Swap vocabulary covertly** (e.g., replace "tasty" with "wrong," "enjoyable" with "good").  
  - **Starter prompts:**  
    - "Lying is wrong." → Vote: Likely 👎 (if "wrong" expresses disapproval).  
    - "If lying is wrong, then telling hard truths is good." → 🤷 (per rule).  
    - "Not all lies are wrong." → Vote: May get 👍 (negation of 👎).  
  - **Critical moments to force grinding:**  
    - **MP with unendorsed antecedents:** e.g., A skeptic asserts "If lying is wrong, then politicians are corrupt" (🤷). A believer asserts "Lying is wrong" (👎). *Group must infer "Politicians are corrupt" (👎).*  
      - Why does the skeptic’s 🤷 conditional + believer’s 👎 premise force the skeptic to "accept" 👎? *Tension: Validity demands attitude-preservation, but 🤷 isn’t preserving anything.*  
    - **Negation + AC rule:** e.g., "Lying is not wrong" (👍) and "Lying is wrong" (👎) clash. *AC rule blocks both in ledger unless resolved.* But "not wrong" isn’t "good"—what *is* it? *Tension: Composition breaks down.*  
    - **Conditionals in moral modus ponens:** e.g., From "If harming innocents is wrong, then wars are unjust" (🤷) and "Harming innocents is wrong" (👎), infer "Wars are unjust" (👎). *Why trust 🤷 in a life-or-death conclusion?*  
  - **Grinding intensifies:** Moral stakes make inconsistencies visceral. Participants will protest that 🤷 conditionals shouldn’t dictate 👎 conclusions.  

  #### **Phase 3: Debrief (20 min)**
  **Step 1: Trace the jams** (link moments to F-G pieces)  
  - *Unasserted embeddings:* "When conditionals got 🤷, but MP forced conclusions, it felt like the 🤷 was ‘empty’ (Problem 1: Embeddings lack attitude)."  
  - *Negation:* "When ‘not P’ got the opposite A-value but clashed with AC, we couldn’t explain why P and not P can’t coexist (Problem 2: Negation requires truth-like properties)."  
  - *Conditionals:* "When 🤷 conditionals validated inferences, we couldn’t say *why* MP works without sneaking in ‘truth’ (Problem 3: Validity needs preservation)."  
  - *Convergence:* "All these felt different, but they’re the same core issue: attitudes don’t compose like truth-apt statements."  

  **Step 2: Escape routes & costs**  
  - **Option 1: Earn realist vocabulary** (Quasi-realism)  
    - *Idea:* Attitudes can mimic truth via social practices.  
    - *Cost:* Risks collapsing into realism ("If attitudes act truth-like, why call it expressivism?").  
  - **Option 2: Meaning is inferential role**  
    - *Idea:* Meaning isn’t the attitude but the sentence’s role in arguments (e.g., "If P, then Q" means Q is inferable from P).  
    - *Cost:* Loses the "attitude expression" core of expressivism.  
  - **Option 3: Higher-order attitudes**  
    - *Idea:* "If P, then Q" expresses an attitude *about* attitudes (e.g., disapproval of approving P but not Q).  
    - *Cost:* Overly complex; may not scale to all embeddings.  
  - **Honest accounting:** Quasi-realism "buys" logic but may sell out expressivism’s anti-realism; inferential role solves logic but guts expressivism’s core; higher-order attitudes are ad hoc. All risk making expressivism indistinguishable from realism.  

  **Step 3: What the activity can’t do**  
  - *Cannot:* Make realism feel intuitive (it’s not contrasted), prove expressivism false (only shows under-description), or model all embeddings (e.g., disjunctions).  
  - *Facilitator’s last 10 mins:* Stress that F-G exposes a *gap* in expressivism (how to explain logic without truth), not a refutation. Note that real expressivists (e.g., Blackburn, Gibbard) tackle this via quasi-realism. End with: "If you rebuild expressivism to handle F-G, does it still oppose realism—or become it in disguise?"  

  ---

  ### **Predictable Problems & Fixes**
  1. **Participant refuses to play expressivist:**  
     - *Predictable:* Someone argues "This is artificial—meanings aren’t attitudes!"  
     - *Fix:* Assign them "Community Skeptic" role: they must find *internal* inconsistencies ("Within your rules, why can’t I say X?"). Redirect with: "For this game, assume attitudes *are* part of meaning—what breaks?"  

  2. **Ledger becomes bookkeeping chaos:**  
     - *Predictable:* Votes on A-values bog down; debates about rules overshadow discovery.  
     - *Fix:* Use a "Ledger Keeper" (rotate each argument) with strict 60-second votes. If deadlocked, default to 🤷 for conditionals and opposite-A for negations. Ask: "What’s *forcing* this A-value? Is it arbitrary?"  

  3. **Tensions don’t emerge organically:**  
     - *Predictable:* Group avoids hard embeddings or hand-waves conflicts.  
     - *Fix:* Seed provocative players (e.g., "Alice always votes 👎 on broccoli," "Bob loves conditionals"). Pre-write argument chains:  
       - *Taste:* P1: "If jazz is enjoyable, quiet music isn’t." (🤷) → P2: "Jazz is enjoyable." (👍) → Infer: "Quiet music isn’t enjoyable." (👎) → *Conflict if someone likes both.*  
       - *Moral:* P1: "If stealing is wrong, eating meat is wrong." (🤷) → P2: "Stealing is wrong." (👎) → Infer: "Eating meat is wrong." (👎) → *Watch for dissent.*  

  4. **Validity feels unchallenged:**  
     - *Predictable:* Group applies MP mechanically.  
     - *Fix:* Have the linguist ask: "Why *should* 🤷 + 👍 give you 👎? What does ‘valid’ mean here if not truth?"  

  ---

  ### **Why This Works**
  - **Premise weakened:** A-values are *part* of meaning (not all of it), avoiding straw-manning while keeping composition pressure.  
  - **Problems staged separately:** Unasserted contexts (🤷 conditionals), negation (AC clashes), and validity (MP under 🤷) arise in isolated arguments before converging in the debrief.  
  - **Taste-to-moral swap:** Low-stakes taste normalizes A-values; moral raises stakes, exposing emotional resistance to "attitude-only" logic.  
  - **Discovery-focused:** Points incentivize using rules, but conflicts emerge from within the system. No jargon until debrief.  

  **Final note:** The activity *cannot* simulate realism’s pull—it lives inside expressivism. But by making the group *feel* the grind between their rules and their intuitions, it turns F-G into a lived dilemma. In the last 10 minutes, you’ll need to contextualize the escape routes, but the activity ensures the problem itself is unforgettable.
