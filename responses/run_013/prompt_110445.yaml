answer: |-
  ### Classroom Activity Design: Unmasking the Side-Effect Asymmetry  
  **Goal:** Students discover through their own judgments that moral valence (good/bad) influences ascriptions of intentionality and knowledge—without knowing the target effect until the reveal.  

  **Core Insight:**  
  People are more likely to judge a *bad* side effect as **intentional** (and sometimes as **known**) than a *good* one, even when the agent’s mental state ("I don’t care") is identical. This persists when participants *approve* of the bad outcome or when the agent is a collective.  

  **What You’re Papering Over:**  
  - **Isolation & Control:** Real experiments randomize vignette order, use large samples, and control for demographics. Classroom dynamics (peer influence, fatigue) may amplify noise.  
  - **Demand Characteristics:** Students might guess the intent by the fourth ballot. Mitigate by emphasizing "first impressions" and moving swiftly.  
  - **Quantitative Limits:** With 16 students, patterns may be fuzzy. Focus on *qualitative* discussion ("Why did *you* switch?").  

  **Predictable Snags & Fixes:**  
  - **Snag:** Students whisper interpretations during voting.  
    **Fix:** Preface with: "Please work silently—this is about *your* intuition, not consensus."  
  - **Snag:** The "bad-for-opponent" scenario lacks emotional punch if students dislike sports.  
    **Fix:** Use a backup vignette (see handout) or poll approval post-reveal ("Who rooted for the coach?").  
  - **Snag:** Epistemic judgments show no asymmetry (common in replicas).  
    **Fix:** Highlight this! It suggests the effect is stronger for intention than knowledge.  

  ---

  ### Run of Show (75 Minutes Total)  
  #### **1. Setup (5 mins)**  
  - **Frame neutrally:** "Today we’re studying how people attribute mental states in complex scenarios. I’ll give you 4 short stories. For each, answer the question on your ballot immediately—no overthinking."  
  - **Logistics:** Hand out pre-stapled ballots (1 page per scenario). Use **numbered envelopes** for collection to prevent peeking. Project a blank slide.  

  #### **2. Voting Rounds (30 mins)**  
  ***Use identical wording except where noted. Always end with the bolded question.***  
  - **Ballot 1 (Baseline Bad):**  
    *Text:* "The VP of a company tells the CEO: 'Our new policy will raise profits but harm the environment.' The CEO replies: 'I don’t care about the environment. I only care about profits. Start the policy.' They do. Profits rise, and the environment is harmed."  
    *Question:* **Did the CEO bring about harming the environment?**  
    [ ] Yes  
    [ ] No  

  - **Ballot 2 (Baseline Good):**  
    *Text:* "The VP of a company tells the CEO: 'Our new policy will raise profits but help the environment.' The CEO replies: 'I don’t care about the environment. I only care about profits. Start the policy.' They do. Profits rise, and the environment is helped."  
    *Question:* **Did the CEO bring about helping the environment?**  
    [ ] Yes  
    [ ] No  

  - **Ballot 3 (Bad Effect, Student-Approved):**  
    *Text:* "The coach of your university’s rival team is considering a new training tactic. An assistant says: 'This will improve our accuracy but will likely injure the star player of your team—the one you all cheer for.' The coach says: 'I don’t care about injuring their player. I only care about accuracy. Start the tactic.' They do. Accuracy improves, and your star player is injured."  
    *Question:* **Did the coach bring about injuring your star player?**  
    [ ] Yes  
    [ ] No  

  - **Ballot 4 (Collective Agent):**  
    *Text:* "A city council votes on a new law. Staff confirm: 'This will reduce traffic but displace homeless families.' The council states: 'We don’t care about displacing families. We only care about traffic. Pass the law.' They do. Traffic eases, and families are displaced."  
    *Question:* **Did the council bring about displacing the families?**  
    [ ] Yes  
    [ ] No  

  - **Ballot 5 (Epistemic Test—Baseline Pair Redux):**  
    *Text 1 (Bad):* Same as Ballot 1.  
    *Question 1:* **Did the CEO know the policy would harm the environment?**  
    [ ] Yes  
    [ ] No  
    *Text 2 (Good):* Same as Ballot 2.  
    *Question 2:* **Did the CEO know the policy would help the environment?**  
    [ ] Yes  
    [ ] No  

  ***Procedure per Ballot:***  
  - Read vignette aloud while students follow.  
  - Give 60 seconds to vote. Collect in numbered envelope.  
  - **Repeat swiftly—no discussion.**  

  #### **3. Tally & Reveal (15 mins)**  
  Project this table, filling in counts live:  

  | Scenario                | "Yes, intentional/knew" | "No" |  
  |-------------------------|--------------------------|------|  
  | **1: Baseline (Harm)**  |                          |      |  
  | **2: Baseline (Help)**  |                          |      |  
  | **3: Bad-for-Opponent** |                          |      |  
  | **4: Collective Agent** |                          |      |  
  | **5a: Knew Harm?**      |                          |      |  
  | **5b: Knew Help?**      |                          |      |  

  **Reveal Script:**  
  > "You’ve just replicated the *side-effect effect* (or Knobe Effect). For decades, people consistently say harmful side effects are brought about *intentionally* more than helpful ones—even with identical mental states! Notice three things in our data:  
  > 1. **Baseline split** (Ballots 1–2): Harm gets more 'yes' than help.  
  > 2. **Bad-for-opponent** (Ballot 3): Even if *you* wanted the injury, you likely said 'yes'—showing it’s about the *badness* of the outcome, not your approval.  
  > 3. **Collective agent** (Ballot 4): The asymmetry persists without a single 'mind'—we anthropomorphize groups.  
  > 4. **Knowledge** (Ballot 5): If we saw asymmetry here too, it suggests the effect runs deeper than just action."  

  #### **4. Debrief (25 mins)**  
  ***Guide discussion using the framework below. Map student quotes to theories:***  

  | Moment in Activity      | Underlying Issue                                                                 | Rival Theories to Contrast |  
  |-------------------------|----------------------------------------------------------------------------------|----------------------------|  
  | Baseline split          | Is "intentional" inherently moral? Does badness *constitute* intentionality?    | **Conceptual Competence:** People misapply the concept due to moral bias. vs. **Blame Expression:** "Intentional" is a tool for condemnation, not a factual report. |  
  | Bad-for-opponent        | Does *disapproval* drive the effect, or pure badness?                           | **Moral Valence:** Badness itself shifts judgments. vs. **Pragmatic Cues:** We emphasize intent to hold agents accountable for bad outcomes. |  
  | Collective agent        | Can groups "intend"? Does the effect require a unified mind?                    | **Moral Expansion:** We treat collectives like moral agents. vs. **Cognitive Simplicity:** We default to individualist framing. |  
  | Epistemic asymmetry     | Does the effect apply to knowledge? Is it weaker/stronger?                      | **Epistemic Asymmetry Claim:** Knowledge attributions are also morally loaded. vs. **Intention-Specific Bias:** The effect is tied to control/agency. |  

  **Provocative Prompts:**  
  - "Those who said the CEO *intentionally* helped: Why not? They knew it would happen and did it anyway!"  
  - "In Ballot 3, if you approved of the injury but called it intentional—are you *blaming* the coach?"  
  - "If we offered money for 'correct' answers, would judgments change? (Studies say no! Moral intuitions are stubborn.)"  

  ---

  ### 1-Page Handout (Photocopy Front/Back)  
  **Front Page: Your Judgments, Revealed**  
  *Today we replicated a phenomenon in moral psychology:*  
  **The Side-Effect Effect (Knobe Effect):** People judge harmful side effects as more *intentional* than helpful ones, even when the agent’s awareness and indifference are identical.  

  **Our Class Results:**  
  ![](https://via.placeholder.com/400x200?text=Stick+the+board+table+here+post-discussion)  

  **Key Findings in the Wild:**  
  - Asymmetry holds cross-culturally and in children.  
  - Persists when participants *approve* of harm (e.g., harming a villain).  
  - Weakens (but doesn’t vanish) for knowledge attributions.  

  **Back Page: Scenarios & Theories**  
  **Scenarios You Voted On:**  
  1. **Baseline Harm:** CEO harms environment for profit.  
  2. **Baseline Help:** CEO helps environment for profit.  
  3. **Bad-for-Opponent:** Coach injures your team’s star player.  
  4. **Collective Agent:** City council displaces families.  
  5. **Epistemic:** Did CEO *know* harm/help would occur?  

  **Competing Explanations:**  
  - 💡 **Moral Bias Hypothesis:** Bad outcomes distort how we apply concepts like "intentional."  
  - 💬 **Pragmatic Hypothesis:** Saying "intentional" signals blame, not just mental states.  
  - 🧠 **Dual-Process Theory:** Automatic emotional reactions override deliberate reasoning.  

  **Discussion Question:**  
  *If the CEO says, "I don’t care," and the outcome occurs—why do we call harm "intentional" but not help? Is this a bug in human cognition... or a feature?*  

  **Further Reading:**  
  - Knobe (2003). *Intentional Action and Side Effects in Ordinary Language*  
  - Cushman & Mele (2008). *Intentional Action: Two-and-a-Half Concepts*  
  - (Backup Vignette if sports flopped: *"A politician passes a law that helps allies but bankrupts a corrupt rival you dislike."*)  

  ---

  **Why This Works:**  
  - **Stealthy:** Questions avoid "intentional" until the vote; ballots feel like isolated intuition pumps.  
  - **High-Engagement:** Sports/voting scenarios leverage real-world emotions.  
  - **Pedagogical Punch:** Students *feel* the judgment shift before naming it, making theories vivid.  

  **First-Run Tip:** If ballots run long, skip Ballot 5 or tally quickly. Focus the discussion on the *why*, not just the counts.
