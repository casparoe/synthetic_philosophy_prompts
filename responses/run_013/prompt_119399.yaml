  ok so for my ethics essay I'm reading Sidgwick's Methods of Ethics (the 1874 one) and there's a bit near the start that I cant get my head around. I'm paraphrasing because I couldn't find the exact wording, but the gist is this: as utilitarians we're supposed to aim at the greatest total happiness, but he points out that we can only foresee a tiny fraction of what our actions will actually lead to, and the further out you go the more it turns into guesswork — so the consequences we're told to maximize are mostly things we can't see at all. And then he still treats utilitarianism as the rational method anyway, which seems weird to me.

  Help me understand what he's actually claiming, and whether this is a fatal problem for utilitarianism or something he can wriggle out of. My teacher also mentioned consequentialist cluelessness in class, so say whether that's the same worry as Sidgwick's or a different one.

