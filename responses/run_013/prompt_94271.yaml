  Okay, let me try to unpack this user's problem. They're stuck in a philosophical argument about promising and moral obligation. The core issue is that they've derived a conclusion they find absurd—that mere reliance creates binding obligations equivalent to promises—but can't spot the flaw in their reasoning. 

  Hmm, the user seems genuinely frustrated. They've spent three weeks on promising in a seminar, so they're clearly well-versed in the literature (Hume, contemporary views). Their tone suggests intellectual humility ("I'm pretty sure the conclusion is false") mixed with irritation at hitting a wall. The detailed examples (airport, wedding, contractor) show they've tested this thoroughly.

  The argument's structure is actually quite elegant: 
  - Premise 1: Promise-breaking is wrong because it betters reliance. 
  - Premise 2: Therefore the words/ritual are secondary to reliance. 
  - Premise 3: Reliance can exist without promises (airport/wedding cases). 
  - Premise 4: Ergo, non-promissory reliance binds like promises. 
  - Premise 5: Others can forcibly create reliance (contractor/stranger cases). 
  - Premise 6: Thus we're slaves to others' expectations. 
  - Premise 7: This reductio disproves Premise 1.

  The user's distress comes from Premise 7 forcing them to either accept magic words or the unpalatable conclusion. They're implicitly asking for a third way—likely hoping to salvage reliance theory without collapsing into moral servitude.

  Let me scan for weak points... Aha! The critical flaw is in how Premise 1 frames reliance. The user equates "letting someone down" with "producing reliance," but morally significant reliance requires more than mere expectation. Think Scanlon's Principle F: reliance must be reasonable and intentionally induced. 

  For example: 
  - Telling your brother about wedding plans? Intentional inducement → binding. 
  - A stranger rearranging their week based on your blog? Unreasonable reliance → not binding. 
  - The contractor starting work? Deliberate exploitation → you're not bound.

  The contractor case is particularly telling—it's not reliance but coercion. And the roommate's stopped arrangements? That's waiver, not obligation. Premise 5 conflates these wildly different scenarios by ignoring agency and reasonableness.

  The user might protest: "But I said 'entitled to rely' in Premise 1!" True, but they immediately drop "entitlement" in Premise 3's examples. That's where the slippage happens. By Premise 5, they're treating all reliance as equally valid when only reasonable, voluntary reliance creates obligations.

  What about the words of a promise? They're not magic—they're a social tool for clarifying when reliance is reasonable. Promises convert vague expectations into entitlements by making intentions explicit. That's why "I promise" differs from "I might come"—it frames reliance as legitimate.

  So the solution preserves reliance theory while adding nuance: 
  1. Keep Premise 1 but clarify that only reasonable, intentionally induced reliance binds. 
  2. Premise 3 holds only for cases meeting these criteria (brother: yes; stranger: no). 
  3. Premise 5 fails because contractor/stranger cases aren't reasonable reliance. 
  4. Thus Premise 6/7 don't follow.

  The user's either/or is false—we reject magic words without accepting boundless obligations. The cost? We must define "reasonable reliance" carefully (Scanlon-style duties vs. expectations). But that's better than collapse or mysticism.
answer: |-
  Your argument is admirably clear, and the problem you've hit is a classic tension in promise theory. The flaw lies in **step (2)**, where you claim the words/ritual "aren't doing independent work," and this cascades into misdiagnosing the reliance in steps (3) and (5). **Reliance alone isn't sufficient to create binding obligations**. What matters is **reasonable reliance intentionally induced or voluntarily accepted under specific normative conditions**. Promises are a tool for creating those conditions explicitly. Let's break it down:

  ### 1. **Why Step (2) is the Core Flaw**  
     You say: *"If the ground [of promise-breaking being wrong] is letting down reliance, the words aren't doing independent work."*  
     **The mistake**: The words *are* doing crucial work—they transform reliance from a *contingent fact* into a *normatively justified expectation*.  
     - Without a promise, reliance might be reasonable or unreasonable, voluntary or imposed.  
     - A promise (or similar commitment) signals: "You are *entitled* to rely on me, and I take responsibility for that entitlement."  
     - This isn't "magic"—it's a social practice that creates **reciprocal obligations and permissions**. When you promise, you grant the promisee a right to complain if you fail, and you assume a duty grounded in that act of voluntary undertaking.

  ### 2. **Clarifying Premise (1): Reliance Needs Normative Structure**  
     Premise (1) is *mostly* right but incomplete. Breaking a promise is wrong because it violates **a legitimate expectation you voluntarily created**. The promisee's reliance isn't just psychological—it's **normatively authorized**.  
     - Compare: If you randomly hope I’ll give you $100, your reliance doesn’t bind me. If I *promise* to give you $100, your reliance is now protected by moral norms.  
     - **Key insight**: Promises solve a coordination problem. They allow us to create "reliance-entitlements" clearly, avoiding ambiguity about when reliance is reasonable.

  ### 3. **Analyzing Your Cases: Binding vs. Non-Binding "Reliance"**  
     The distinction turns on **whether you intentionally induced reasonable reliance under conditions that imply normative commitment**. Not all reliance is equal:  

  | **Case**                  | **Binding?** | **Why?** |
  |---------------------------|--------------|----------|
  | **Airport (tell friend)** | Likely yes | You voluntarily created expectation; friend reasonably relies. No promise needed—this is a "commitment analog" (e.g., Scanlon's Principle F). |
  | **Wedding (brother)**     | Yes | You knowingly let him plan around you, inducing reliance. Your silence implies acceptance of responsibility. |
  | **Friday rides (roommate)** | **No** | Roommate *stopped* relying. No ongoing obligation. If you suddenly stopped without warning, it might be wrong for other reasons (e.g., inconsiderateness), but not promissory. |
  | **Block party (neighbor)** | **No** | You didn’t authorize this. Neighbor is imposing reliance; you have no duty to endorse it. |
  | **Contractor**            | **No** | This is coercion/exploitation, not genuine reliance. You never invited the expectation; the contractor is manipulating your guilt. |
  | **Stranger (online post)** | **No** | No interaction occurred. Reliance is unreasonable without your endorsement. |

  ### 4. **Why Premise (5) and (6) Fail**  
     - Premise (5) claims: *"If foreseeing reliance is enough, I'm bound by all of it."*  
       But "foreseeing" isn't sufficient—you must **voluntarily invite or accept the reliance as legitimate**. The contractor/stranger cases involve no such invitation.  
     - Premise (6) concludes: *"I'm bound to keep doing whatever anyone expects."*  
       This ignores **agency and reciprocity**. Obligations arise from relationships of mutual recognition, not passive predictions. You’re not a "servant of predictions" because others’ expectations lack normative force unless you participate in creating them.

  ### 5. **Salvaging the Reliance View Without Absurdity**  
     You can keep a refined version of (1) by adding:  
     > *"Breaking a promise is wrong because it violates a* ***reasonably grounded, voluntarily induced reliance*** *that the promisor endorsed as legitimate."*  
     This avoids your reductio by requiring:  
     - **Intentionality**: You must act to invite reliance (explicitly or implicitly).  
     - **Reasonableness**: Reliance must be proportionate and contextually appropriate.  
     - **Normative context**: The act must occur within a practice that grants the promisee a right to rely (e.g., promising, explicit commitment, or tacit undertaking).  

     **What you "pay"**: You must define "reasonable" and "voluntary" (e.g., Scanlon’s *Principle F*). But this is better than collapsing into magic words or moral servitude.

  ### 6. **Where Does This Leave Promises?**  
     Promises aren’t "magic," but they’re uniquely powerful tools:  
     - They **clarify** when reliance is justified.  
     - They **amplify** the stakes of letting someone down (by adding the wrong of betrayal to the harm of disappointment).  
     - They **standardize** entitlements across contexts (e.g., swearing an oath vs. casual assurance).  

  Your intuition is right: reliance is central. But the words/ritual aren’t redundant—they’re the **conduit that transforms reliance into a right**. Without them, we’re left guessing about when expectations are morally enforceable. That’s why we invented promises.

  ---

  **In short**: The argument stumbles at step (2) by underestimating how promises *structure* reliance. Fix that, and (1) survives, (3)–(5) are tamed, and (7) is avoided. You’re bound in the airport and wedding cases because you *acted* to create reasonable reliance; you’re free in the others because you didn’t endorse the expectations. Promises make this endorsement loud and clear—but they’re not the only way to create obligations.
