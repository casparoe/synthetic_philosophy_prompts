prompt: |-
  I'm leading a graduate reading group in philosophy of language on Lewis's triviality results for indicative conditionals. The group is fluent in elementary probability but has never worked on conditionals, and I want the proof to land as a reductio of a thesis they will already have accepted by that point rather than as a technical curiosity. Don't explain the result to me; plan how I should teach it. Tell me the order in which the components must be introduced and why each depends on the one before; the single example that should carry the whole session, and what it must have and must not require; the misconceptions they will predictably form as the proof unfolds — my guesses are that they will conclude it shows indicative conditionals have no truth conditions at all, and that the offending premise must simply be stated wrongly — and exactly where in the sequence I should head each one off; one closing question that would reveal whether they have understood what the result does and does not establish; and what I should openly decline to cover at this level. Give me exactly five numbered points, one or two sentences each, with no introduction or conclusion.
reasoning: |-
  Hmm, the user is leading a graduate reading group on Lewis's triviality results for indicative conditionals. They want a teaching plan that presents the proof as a reductio of a thesis the group will already accept, rather than as a technical curiosity. The group knows elementary probability but hasn't studied conditionals before.

  I need to structure this into five numbered points covering: the sequence of introduction with dependencies, a single example that carries the session, predictable misconceptions and where to address them, a closing question to test understanding, and what to explicitly exclude.

  For the sequence: Start with defining the indicative conditional using the probability thesis since that's where the group will be committed. Then introduce conditional probability as the key tool. Present Stalnaker's thesis as the natural bridge between them. Finally derive the contradiction to force abandonment of the initial thesis.

