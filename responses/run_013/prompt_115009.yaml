  ok so i'm sketching a short paper on the Judy Benjamin problem and i want you to tear my notes apart. take the role of a formal epistemologist who works on belief revision and has actually thought hard about the difference between plain conditionalization, jeffrey conditionalization, and the various distance-minimizing rules people have cooked up for updating on conditionals. think carefully, and please start by telling me what you take the real crux of the case to be before you get into anything line-by-line. i don't want references or reading lists — i don't care who said what, i care whether the argument works. if you think some objection i make is already a known one, don't tell me who made it, tell me the best version of it and where mine is weaker.

  the setup i'm using, paraphrased: Judy is dropped into territory she can't see, divided into Red and Blue, and each half is divided again into a Second Company area and a Headquarters area. Four cells, she starts uniform over them. She gets the officer on the radio and he tells her that if she's in Red territory, the odds are three to one that she's in the Headquarters area. So the message constrains a conditional credence of hers: given Red, Headquarters is three times as likely as Second Company. The message isn't an event in her algebra. There's no cell of her partition corresponding to the officer having said that, and conditionalizing on anything she already has credences in won't reproduce the change, because what she learned is a fact about a ratio inside one half of the partition rather than a proposition she had a prior for.

  my main line: i think the puzzle is an artifact of an underspecified likelihood model, and specifically of a mismatch between the officer's map and Judy's map. Concretely, the message is phrased in terms of Red and Headquarters as his map draws them, and her map is coarser or just different at the edges — there's a strip that she files under Blue and he files under Red, or under Second Company where he'd say Headquarters. If that's right, the constraint she's been handed doesn't even live in her algebra. It lives in a finer space, and any rule that minimizes the distance from her prior subject to the constraint is silently choosing a projection from the fine space down onto her coarse one. Different ways of representing the fine-grained possibilities give different answers, and i don't think anything in the story privileges one. So the relative-entropy rule isn't a rule of inference here, it's the shadow of an implicit likelihood model nobody wrote down, and once you write it down the case is just conditionalization on a richer event.

  second thing i want to argue: the fact that the message arrived at all is evidence. Judy's radio presumably only works in some places, or the officer only transmits when he's got something to say, or she only gets reception in range of the Red relay. If reception is correlated with territory then the event of receiving this message is itself informative about Red vs Blue, and any treatment that takes the content as the only thing learned is going to be wrong in a way that has nothing to do with conditionals. i'd like to make the stronger claim: every version of the case where the update looks non-conditional is a version where we've smuggled in a reception model and then refused to conditionalize on it. tell me if that's too strong. i suspect it is and i want to know exactly where it breaks.

  now the math, and please check me because i'm doing it by hand. cells (R,S), (R,~S), (~R,S), (~R,~S), uniform at 1/4. constraint P(S|R) = 3/4. Minimize sum q log q, equivalently relative entropy to the uniform prior, subject to that. i set q(R,S) = 3b and q(R,~S) = b, and by symmetry the two ~R cells split the remainder equally, which gives b/c = 3^(-3/4) where c is the common value of the ~R cells, and then P(Red) comes out around 0.467, i.e. slightly below a half. that surprised me. two things i want from you: (a) check the setup and the algerbra, and tell me if i've written the constraint in a way that differs from the usual formulation, since i know there are variants where the message is about Red given Headquarters rather than Headquarters given Red and i'm not sure i've picked the one i mean; (b) if 0.467 is right, tell me whether there's a clean intuitive story for why learning that Red is Headquarters-heavy should nudge her down on Red, because i can't find one and i don't trust an update rule whose output i can't narrate.

  third, the thing that's really bugging me: i have a nagging sense that rules of this kind aren't order-invariant. If Judy first learns something ordinary about the Red/Blue split and then gets the officer's message, versus getting the message first and then the ordinary news, i think you can get different numbers in the short run even if things settle down eventually. i'm not certain i'm right about that, and if i am i don't know how much it matters. is this the kind of non-commutativity that just means you have to specify the order in which the evidence arrives, which seems fine, or does it show the rule isn't picking out anything like a rational update?

  a smaller worry about the framing generally: the thing Judy learns is a conditional credence, but it's one she attributes to the officer or to the world's statistics, not one she's being told to adopt. If the officer is a source with less than full reliability, the honest object to conditionalize on is the fact that he said that, with a likelihood that depends on how reliable he is about conditionals — and reliability about a conditional is a strange beast, since he could be perfectly reliable about every unconditional fact and still be unreliable about ratios inside Red. does that asymmetry do any work, or is it just the underspecification point again wearing a hat?

  what i want from you, in this order:

  1. first a short brainstorm of what you think the crux actually is, and whether the problem is about conditionals at all or about coarse-graining.

  2. then comments on accuracy, especially the algebra in the middle and the claim that the fine/coarse mismatch makes the answer representation-dependent. if i've made a mistake there i want the mistake, not a hedge.

  3. then whether the central move is interesting or whether it's a verbal redescription. be blunt. if it's just conditionalize on more stuff, say so and say what's left of the problem.

  4. and finally, one thing i should add that i haven't thought of — something in the weeds, ideally something that makes the paper harder rather than easier.
