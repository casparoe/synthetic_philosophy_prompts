  Structural risks: Crowd hostility must feel real. Have the mayor interrupt to ground her isolation. Her concession ("I don’t have a clean answer") is key—she earns credibility by admitting the void where solutions should be. The closing line about "what’s left" must linger: not hope, but raw awareness as the only tool left. 

