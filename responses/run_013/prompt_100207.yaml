prompt: |-
  You're a philosopher who specializes in decision theory, so please actually think this through — start by brainstorming the real fault lines between these theories, then commit to an answer.

  I'm a backend enginer with no formal philosophy, but I've read too much rationalist blogosphere stuff. I want a tier list of decision theories, ranked by how much I should actually trust each one to guide my own real-life decisions, not by how elegant it looks on paper and not just by how it does on Omega-style puzzles. The list: causal (the one that ignores correlations), evidential (the one that ignores causality), updateless, and the timeless/functional family — lump those last two together if that's the honest call.

  Also sneak in my own variant and tell me if it's dumb. It's updateless, meaning you pick a policy rather than an action and condition on the fact that you're the kind of agent running this procedure, but you're only allowed to use correlations you can actually verify or at least assign a real probability to. No acausal business where the coin comes up heads because I'm the sort of person who one-boxes. I've been calling it audited updateless decision theory — updatelessness, but you need reciepts.

  Give me tiers (S/A/B/C/D) or 0-1 scores, whichever is cleaner, one line of justification each, plus for each theory one example of a case where the link between my decision and the outcome is real and checkable (a negotiation where the other side can see what type of person I am, say) and one where it's purely acausal.

  Dont be polite if the framing is off. If my audited variant is just a renamed version of something that already exists, or if ranking theories by real-world usefulness is a category error, say so straight out and tell me what question I should be asking instead. And flag where you're genuinely unsure versus where you'd defend the call.
reasoning: |-
  Okay, the user is a backend engineer who's dabbled in rationalist blogs and wants a practical tier list of decision theories for real-life guidance. They're explicitly asking for no-nonsense evaluation, flagging where I'm uncertain, and brutally honest feedback on their "audited updateless" variant. 

  First, I need to map their request to actual decision theory frameworks. They listed four: causal (likely CDT), evidential (EDT), updateless (UDT), and timeless/functional (lumped together). Their variant adds an "auditing" constraint to UDT, banning unverifiable correlations. 

  Hmm... their frustration with "acausal business" jumps out. They want theories that work when outcomes are physically measurable (e.g., negotiations based on observable reputation) but distrust "coin comes up heads because I one-box" scenarios. Fair—engineers deal in causality and evidence. 

  *Brainstorming fault lines*: 
  - CDT vs EDT: The smoking lesion war. CDT ignores correlated evidence (e.g., "if I'm coughing, does smoking cause cancer or just correlate with it?"), while EDT self-sabotages in Newcomb-like traps by over-indexing on correlation. 
  - UDT: Solves acausal problems by treating decisions as math proofs, but its strength (handling abstract counterfactuals) is its weakness IRL—humans aren't oracle-equipped algorithms. 
  - Timeless/functional: Even more abstract. Useful for AI alignment, less so for choosing a career move. 
  - Their variant: Sounds like UDT but demanding "receipts" for correlations. Interesting! But how does verification work? If I can't assign probabilities to "being the type who one-boxes," does it collapse into CDT? 

  Real-world check: 
  - Verifiable scenario: Salary negotiation. My reputation (observable via LinkedIn) affects offers. UDT would model me as "the type who negotiates," but audited UDT would only use if I have data proving this trait causes higher offers. 
  - Acausal scenario: Boltzmann brain puzzles. No physical link between my decision and a quantum fluctuation creating a benevolent AI. Pure philosophy. 

  *Brutal honesty time*: 
  1. Ranking theories by "trustworthiness" isn't a category error—it's exactly what applied decision theory should do. 
  2. But their audited variant is fuzzy. "Receipts" could mean frequentist data (A/B test negotiations) or Bayesian priors. If the latter, it's just UDT with a reality-checked prior. If the former, it's CDT in disguise. 

  *Uncertainties*: 
  - How much does UDT degrade without perfect rationality? IRL we're bad at computing "policy" decisions. 
  - Does audited UDT handle edge cases better? Maybe, but no free lunch—it'll fail in true acausal traps. 

  Final tier rationale: 
  - CDT gets A-tier: Messy causality is everywhere (investments, health choices). 
  - EDT: C-tier. Real life has correlation traps (e.g., "pre-selected" scenarios like job interviews). 
  - UDT: B-tier. Policy thinking helps for repeated decisions (e.g., habit formation), but overkill for most things. 
  - Timeless: D-tier. Beautiful math, useless for humans. 
  - Audited UDT: B-tier. Prune UDT's excesses, but verification is hard. Might as well use robust statistics. 

  ...Time to structure this as a no-bullshit response. User wants tiers, examples, and callouts—so deliver exactly that. Flag where engineering intuition might clash with theory (e.g., "receipts" needing operationalization). No sugarcoating.
answer: |-
  Here's a raw, no-bullshit tier list of decision theories for **real-world, non-Omega decisions**, ranked by practical trustworthiness for a human engineer. I’ve flagged uncertainties and called out your variant honestly.  

  ---  
  ### **Tier List** (S → D)  
  1. **Causal Decision Theory (CDT)**  
     - **Tier: A** (0.8)  
     - **Justification**: Prioritizes verifiable cause-effect relationships. Fits how reality works (physics, engineering, medicine). Fumbles correlation traps, but those are rare IRL.  
     - ✅ **Real Checkable Link**: *Negotiating salary*. Your reputation (observed via past actions) causally influences offers. Choosing "tough but fair" policy → better outcomes.  
     - ❌ **Purely Acausal**: *Newcomb's Problem*. You lose $1M by ignoring correlation between your choice and Omega's prediction.  

  2. **Evidential Decision Theory (EDT)**  
     - **Tier: C** (0.4)  
     - **Justification**: Overfits correlations, leading to self-sabotage ("smoking lesion" problem). Useful *only* in data-rich, low-stakes scenarios (e.g., A/B testing UI). Avoid for life choices.  
     - ✅ **Real Checkable Link**: *Choosing a gym*. Seeing others fit *correlates* with gym quality. You join → likely positive outcome (no self-sabotage here).  
     - ❌ **Purely Acausal**: *Parfit's Hitchhiker*. You die in the desert because "not paying" *evidence* you’re untrustworthy, even though paying causes rescue.  

  3. **Updateless Decision Theory (UDT)**  
     - **Tier: B** (0.6)  
     - **Justification**: Picks optimal *policy* across possible worlds. Superhuman for acausal puzzles, but **overkill IRL**—you lack the computing power to simulate all counterfactuals. Best for *repeated* decisions (e.g., automated trading).  
     - ✅ **Real Checkable Link**: *Business partnership*. Committing to "always repay loans" makes you a credible borrower → better deals.  
     - ❌ **Purely Acausal**: *Logical coin-flip*. A coin outputs heads iff you donate to charity. UDT donates "as if" it controls the outcome—no physical link.  

  4. **Timeless/Functional Decision Theory (TDT/FDT)**  
     - **Tier: D** (0.3)  
     - **Justification**: A meta-extension of UDT. Elegant for AI alignment, but **useless for humans**. Requires you to model yourself as a mathematical function—impractical without a supercomputer.  
     - ✅ **Real Checkable Link**: *None*. Even "negotiation" examples are better handled by CDT or UDT.  
     - ❌ **Purely Acausal**: *Same as UDT, but with extra steps*.  

  ---  
  ### **Your Variant: Audited Updateless DT**  
  - **Tier: B** (0.65) — *Slightly above UDT but with caveats*  
  - **Assessment**: **Not dumb, but half-baked**. You’re reinventing **UDT with empirical priors**. Banning unverifiable correlations is smart IRL, but:  
    - 🚩 **The "Receipts" Problem**: How do you *operationalize* verification? If "assign real probability" means Bayesian updating from data, this is just **robust UDT**. But if "receipts" require frequentist proof (e.g., p-values), you’ll underperform in novel scenarios.  
    - ✅ **Strength**: Excels in *data-rich policy decisions* (e.g., insurance pricing or ethical investing).  
    - ❌ **Weakness**: Fails in true acausal edge cases (e.g., AI reward hacking).  
  - **Verdict**: **Useful engineer’s compromise**, but not a new theory. Call it **Empirical UDT** and own it.  

  ---  
  ### **Hard Truths**  
  1. **Your framing isn’t off—it’s vital**. Ranking theories by real-world trust is *exactly* what applied decision theory should do. Anyone prioritizing "elegance" over robustness is LARPing.  
  2. **Key Fault Line**: CDT vs. UDT isn’t about "causality vs. acausality"—it’s **tractability vs. optimality**. UDT *wins* in multiverse math, but CDT *scales* in a messy universe.  
  3. **Uncertainties**:  
     - I’m unsure if UDT is *ever* rational for humans outside repeated games. Brain bottlenecks matter.  
     - "Audited" UDT needs strict rules for "receipts". Without them, it’s vaporware.  
  4. **What You Should Ask Instead**:  
     **"Which theory minimizes regret when I have limited compute, noisy data, and no access to quantum probabilities?"**  
     → Answer: **CDT + empirical Bayes for correlations**.  

  ---  
  ### **Final Ranking for Real Life**  
  1. **CDT** (A) - Default. Works 95% of the time.  
  2. **Audited UDT** (B) - For policy decisions with data.  
  3. **UDT** (B) - Theoretically optimal but IRL intractable.  
  4. **EDT** (C) - Niche use only.  
  5. **TDT/FDT** (D) - Beautiful math, zero practicality.  

  **TL;DR**: Use CDT daily. For high-stakes *policies* (career, ethics), run Audited UDT with data-backed correlations. Ignore acausal puzzles—they’re philosophical malware.
