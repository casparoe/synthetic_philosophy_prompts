answer: |-
  Here’s a structured research proposal addressing your core concern, designed for clarity, testability, and philosophical rigor.

  ---

  ### **Abstract**  
  Consequentialist cluelessness is typically framed as an *epistemic* problem: the intractability of calculating long-term causal chains. This proposal argues it conflates two distinct issues: (1) **Resolvable Cluelessness** (RC), where expected value (EV) is determinate but computationally inaccessible; and (2) **Metaphysical Cluelessness** (MC), where EV is indeterminate *now* because future facts depend on present choices in ways that are not yet settled. We sharpen this distinction, demonstrate why standard consequentialist solutions address RC but not MC, and propose an empirical test using agent-based modeling of branching futures. A positive result would show MC persists even under idealized epistemic conditions; a negative result would collapse MC into RC. Confidence in the framing is moderate (70%), hinging on the defensibility of "unsettled future facts."

  ---

  ### **Central Question**  
  *"Does consequentialist cluelessness contain a distinct, non-epistemic dimension (MC) where the expected value of present acts is metaphysically indeterminate — and if so, under what conditions does it arise?"*  
  **Determinate answer**: Yes (MC is irreducible to RC) or No (MC reduces to RC).

  ---

  ### **Core Distinction: RC vs. MC**  
  - **Resolvable Cluelessness (RC)**:  
    - EV is fixed by current facts + laws of nature.  
    - Limitation: Computational/modeling constraints prevent access.  
    - *Analogy*: Predicting a coin flip in a sealed box — outcome exists but is unknown.  

  - **Metaphysical Cluelessness (MC)**:  
    - EV is *not fixed* by current facts + laws. Future states are ontologically open, and present choices constitutively shape which timeline (and thus which moral facts) come to exist.  
    - *Analogy*: Choosing whether to invent a technology that rewrites human values — the "rightness" of inventing it depends on values it creates.  

  **Key test for genuineness of MC**: If MC exists, improving models/data *cannot* resolve cluelessness in certain cases — indeterminacy is baked into reality.  

  ---

  ### **Why Standard Solutions Fail**  
  | **Solution**          | **Addresses RC?** | **Fails MC Because...**                               |  
  |-----------------------|-------------------|------------------------------------------------------|  
  | Rule-consequentialism | Yes (proxies)     | Rules assume stable EV landscapes; MC makes EV unstable. |  
  | Satisficing           | Yes (thresholds)  | "Good enough" presupposes a knowable baseline; MC negates this. |  
  | Tractable horizons    | Yes (local EV)    | MC emerges precisely at long horizons.               |  
  | Decision procedures   | Yes (heuristics)  | Procedures optimize for fixed goals; MC questions goal stability. |  

  **Critical gap**: All assume a *fixed* EV landscape. MC denies this fixity.

  ---

  ### **Empirical Test Design**  
  **Method**: Agent-based modeling of "value-sensitive chains."  
  - **Setup**: Simulate agents making choices (e.g., deploy tech A/B) in a branching universe.  
    - Branch 1: Choice alters future agents’ *value functions* (e.g., A enhances cooperation, B enables ruthless competition).  
    - Branch 2: Choice alters only *resources* (fixed value function).  
  - **Measure**: Compare EV variance across branches:  
    - Under RC, both show high but *reducible* variance with better data.  
    - Under MC, Branch 1 shows *irreducible* variance even with perfect models, as value shifts redefine "good."  

  **Validation**: If MC is real, optimizing for EV in Branch 1 yields no stable solution; in Branch 2, it does.  

  ---

  ### **Timeline (Single Semester)**  
  - **Month 1**: Formalize RC/MC distinction (e.g., contrast Derek Parfit’s *cluelessness* with Nick Bostrom’s *dynamic inconsistency*).  
  - **Month 2**: Analyze why existing solutions fail MC (drawing on critiques like James Lenman’s *consequentialism and cluelessness*).  
  - **Month 3**: Build simulation (Python/Mesa framework; parameters: choice-induced value drift vs. fixed values).  
  - **Month 4**: Run experiments, test variance reducibility under data-rich conditions.  

  ---

  ### **Outcomes**  
  - **Positive result**: MC confirmed if:  
    - Branch 1 EV variance remains high (>2σ) despite perfect knowledge of initial conditions/laws.  
    - Theoretical explanation: Demonstrated path-dependence of moral facts (e.g., via David Lewis’s *shifting baseline*).  
  - **Negative result**: MC collapses if:  
    - All variance reduces with better models → cluelessness is purely epistemic (RC).  
    - Explanation: "Unsettled futures" are modeling errors, not metaphysical.  

  ---

  ### **Is This One Project or Two?**  
  It is **one integrated project** with a dependency chain:  
  1. Conceptual distinction (Months 1–2).  
  2. Test for metaphysical emergence (Months 3–4).  
  **Risk of collapse**: If the distinction is merely verbal, Step 2 will expose it.  

  ---

  ### **Confidence & Weakest Link**  
  - **Overall confidence**: **70%**.  
    - Strong: Distinction aligns with debates in temporal ontology (e.g., Ted Sider’s *presentism* vs. *eternalism*).  
    - Weak: MC requires *objective moral facts* dependent on future states — controversial in metaethics.  
  - **Weakest step**: **Defending "unsettled futures."**  
    - If future facts are eternally fixed (e.g., in a block universe), MC evaporates. Must engage with physics (e.g., quantum indeterminacy) and philosophy (e.g., Ruth Chang’s *will-based agency*).  

  ---

  ### **Why This Isn’t Just Fancy Redescription**  
  For MC to be real, the following must hold:  
  1. **Moral facts supervene on future states** (e.g., "value of life" depends on future consciousness studies).  
  2. **Present choices causally constitute those states** (e.g., funding AI research *creates* the future that defines AI ethics).  
  3. **No "view from nowhere"** : No privileged frame resolves indeterminacy *now*.  

  If these fail, MC reduces to RC. The simulation tests #2 directly.  

  ---  
  **Next steps**: Sharve the metaphysics of future-contingency (e.g., Aristotelian *open futures*), then stress-test with chaotic systems. I recommend starting with Lenman (2000) and Bostrom’s *Infinite Ethics* for grounding.
