  ### Notes on Execution  
  - **End-Word Permutation**: Follows sestina structure (6-1-5-2-4-3 across stanzas).  
  - **Escape Hatches**: Single-peakedness ("peak") appears as a conditional ideal; the lottery ("chance the one") is framed as a costly alternative.  
  - **Voice**: Urgent and conflicted, mirroring a voter’s real-time calculus.  
  - **Weakest Line**: "Dictatorship by lottery's rule" compresses the concept—clear to experts but may require unpacking. The enjambment in Stanza 5 ("lie— / call chance the one") offsets this.  
  - **Trade-Off**: Ends mid-thought ("The die is cast") to leave tension unresolved, emphasizing the theorem’s inescapable dilemma.  

  The poem uses the sestina’s cyclical form to embody preference reshuffling, while the JSON provides a precise pedagogical anchor. The voter’s voice makes the abstraction visceral—no slide deck needed.
