  ## Judicial Committee Pre-Hearing Opinion: Appeal of Treasurer's Denial - Club Coach Travel Expenses  
  **Committee Member:** [Your Name]  
  **Date:** [Current Date]  
  **Case:** Appeal of Treasurer's Denial of Travel Funding for Non-Student Club Coach  

  ### I. Recommended Disposition & Rule
  **Disposition:** I recommend **upholding the Treasurer's denial** of funding for the non-student coach's travel expenses. The Bylaw's text is unambiguous and directly applicable.  

  **Rule for Future Cases:** This Committee shall resolve disputes by applying the **plain meaning of the enacted text** of our governing documents. Where the text is unambiguous, we are bound by it. Only where genuine ambiguity exists after exhausting textual analysis may we cautiously consider purpose, and even then, any interpretation must remain closely anchored to the enacted words. Predictability demands that we start and end with the text wherever possible.  

  ### II. The Textual Mandate & Its Strength
  The relevant Bylaw states: **"No student organization may use Student Activity Fee funds to pay the travel expenses of any individual who is not a currently enrolled student."**  

  The textual case for upholding the denial is compelling:  
  1.  **Plain Meaning:** The coach is an individual paid by the club. They are demonstrably "not a currently enrolled student." The funds sought are for "travel expenses." The prohibition is absolute ("No... may") and covers "any individual" not meeting the student status requirement.  
  2.  **The Significance of "Currently":** The deliberate insertion of "currently" two years ago reinforces the textual mandate. Its addition signifies a conscious choice to tighten the restriction, explicitly excluding not just non-students broadly, but individuals whose enrollment status has lapsed ("alumni"). This amendment demonstrates a focused intent to solidify the student-status requirement, making a textual exception for "necessary staff" even less tenable. The drafters *could* have written an exception for essential personnel; they did not. We are bound by what they enacted, not what they might have intended but omitted.  
  3.  **Predictability and Fair Notice:** Following the text provides clear, predictable rules for all student organizations and the Treasurer. Any club can read the Bylaw and understand that *only* currently enrolled students' travel can be funded. Creating a "necessary staff" exception based on purpose, despite clear text, introduces significant uncertainty. Who defines "necessary"? Is a paid coach necessary while a volunteer advisor isn't? What about a hired referee? Textualism avoids these subjective judgments.  

  ### III. Engaging the Purposive Argument & Its Costs
  The appellant will likely argue (and our precedent seemingly supports) that we should look to the *purpose* behind the Bylaw. The amendment minutes indicate the target was "organizations subsidizing alumni and outside advisers." They say nothing about excluding paid staff essential to core activities like a coach. Reading the Bylaw to prohibit funding a necessary coach, the argument goes, frustrates the core purpose of Activity Fees: supporting student activities. Our prior ruling in the equipment case explicitly prioritized "what the provision was for rather than what it said."  

  **Acknowledging the Cost of Textualism:** A purposive reading *could* lead to reimbursing the coach in this specific instance, arguably advancing the broader goal of supporting student activities. It might seem "fairer" in this isolated case.  

  **The Profound Cost of Purposivism:** However, adopting a purposive approach here comes at an unacceptably high cost to our governance:  
  *   **Erodes Predictability:** If purpose can override clear text, no organization or the Treasurer can rely on the written rules. They must guess at the Committee's view of underlying purposes in each new situation.  
  *   **Undermines Democratic Process:** The text, especially the amended text including "currently," is what the student body (or its representatives) actually voted to enact. Substituting our view of purpose for the enacted words displaces democratic choice with judicial discretion.  
  *   **Opens the Floodgates:** If "necessary staff" is an exception here, what other unstated exceptions might exist? Does the prohibition on "outside advisers" exclude paid consultants? Does "alumni" exclude recent graduates volunteering? Purposivism invites constant litigation over subjective interpretations of intent.  
  *   **Danger of Selective Application:** Without a clear textual anchor, purposivism risks inconsistency – favoring popular clubs or seemingly "worthy" cases over others based on subjective judgments about "purpose."  

  ### IV. The Underlying Question: Methodological Consistency
  **Can we switch methods?** Our prior equipment case ruling and this appeal starkly present the question: Can this Committee legitimately apply textualism in one case and purposivism in another?  

  **Answer: No, we cannot and must not.** Inconsistent methodology is fundamentally unjust and destabilizing. It destroys predictability, invites perceptions of arbitrariness or bias, and undermines the rule of law within our student community. We must commit to a single, consistent primary method.  

  **Why Textualism? Why the Enacted Words?**  
  1.  **The Democratic Imperative:** The enacted text is the only objective manifestation of the student body's (or its representatives') collective decision. It is the law *as passed*. Intentions debated in minutes are often contested, incomplete, and not voted upon. The words on the page bind us because they are what was formally approved. Shifting to unenacted intentions transfers lawmaking power from the representative body (Senate/Assembly) to this judicial committee.  
  2.  **Fair Notice and Equality:** All students and organizations deserve to know the rules by reading them. They should not need to delve into historical minutes or predict judicial views on "purpose." Textualism ensures everyone is governed by the same, publicly accessible standard.  
  3.  **Judicial Restraint:** Our role is to *apply* the rules, not rewrite them based on our view of what might be better or fairer in a specific case. Textualism constrains judicial overreach. Purposivism, especially when the text is clear, risks turning this Committee into a de facto legislature.  
  4.  **Managing Precedent:** Our equipment case ruling, decided on purposive grounds, involved genuine ambiguity absent here. We should confine that precedent to its specific, ambiguous context and clarify that textualism is our default and primary method moving forward. Where ambiguity truly exists (unlike this clear case), purpose may be a *secondary* tool, but the interpretation must still fit within the enacted words.  

  ### V. Conclusion
  While the outcome for this specific club is unfortunate, the principle of governance by clear, predictable rules is paramount. The text of Bylaw [Cite Bylaw #] is unambiguous: Activity Fee funds cannot pay for non-student travel. The recent, deliberate addition of "currently" reinforces this stricture. Upholding the denial is legally required by our governing documents.  

  More importantly, this case compels us to choose a consistent interpretive method. We must affirm that **the enacted text is supreme.** Only by committing to textualism can we fulfill our duty to apply the rules fairly, predictably, and democratically, respecting the choices made by the student body through its representatives. I recommend upholding the denial and formally adopting textualism as our standard.  

  **Recommendation:** Uphold Treasurer's Denial.
