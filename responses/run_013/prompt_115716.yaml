prompt: |-
  I'm writing a feature on the low-impact AI stuff for a general audience, and I want to check my thesis before I file, because I have a feeling I'm about to say something dumb in print. My thesis is that the whole program is circular. A side effect is by definition any change to the world thats not part of what the AI was asked to do — so to know which changes count as side effects you already need the full specification of what we want, which is the exact thing the low-impact people say they're trying to avoid having to write down. And the two tricks I keep hearing — score impact as how different the world ends up from how it would have gone if the agent had done nothing, or as how much smaller the set of things humans can still do later becomes — seem to me to just move the same problem into a new container: you still have to decide which changes matter, and thats a value judgment all the way down. So either it's circular, or it's value specification with extra steps and a nicer name. Am I missing something? And if I'm wrong, what exactly is the claim — that you can score impact without knowing what anyone wants, in which case doesn't the agent just learn to do nothing? I need this crisp for readers, so end with a line starting Verdict: giving your one-sentence bottom line.
