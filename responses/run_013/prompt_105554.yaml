prompt: |-
  I'm in Year 13 and my philosophy teacher's off next week so ive got to run the 45-minute session on Strawson's reactive attitudes thing for the rest of the class. Don't explain the idea to me, plan how I should explain it. What order do the pieces have to go in — I keep wanting to open with the determinism question and I've got a feeling that's the wrong way round — and what's the one example that should carry the whole thing? I was going to use my mate who turns into an absolute nightmare when he hasn't eaten and everyone goes 'that's not really him, he's just hungry', but I suspect that's the wrong kind of case, so tell me if it is, and give me one that works instead, and say what it needs to have and what it mustn't have. Then: what will they get wrong? I'm betting on 'so Strawson thinks being responsible is just a feeling', half the room thinking the objective attitude means being cold and clinical, and someone will definately bring up the pill that switches off your blaming feelings — tell me where in the sequence to head each of those off. I was going to end by asking whether we'd be wrong to keep blaming people if determinism turned out true, but I don't think that tests the right thing; if it's a dud, give me a better question and say why. Also say what I should openly tell them I'm not covering in 45 minutes. Be decisive — make the calls and back them up, don't hand me three options for every bit. And keep it in British English, no American spellings.
reasoning: |-
  Alright, let's tackle this Year 13 philosophy lesson plan for Strawson's reactive attitudes. The user wants a clear, decisive structure—no messing about with options. 

  First, the user's instinct to start with determinism is a classic trap. Jumping straight into "are we determined?" would derail the session into metaphysical debates instead of focusing on Strawson's core insight. Must resist that. The real entry point has to be the *lived experience* of holding others responsible—those moments when we naturally feel resentment or gratitude. That's the hook. 

  The mate-with-hunger example is clever but flawed. Reducing responsibility to blood sugar levels leans too hard into temporary incapacity, which nudges toward excuses rather than the deep challenge of determinism. Need an example that feels fundamentally character-driven but still makes us hesitate. The "kind person who snaps cruelly under stress" works better—it’s about who they *are*, not just physiology, and it mirrors Strawson’s point about our attitudes shifting when we see someone as "warped." 

  Predictable misunderstandings are spot on: 
  - "Responsibility is just a feeling" misses Strawson’s argument that these attitudes *constitute* moral responsibility. Gotta emphasize that reactive attitudes aren’t *reporting* responsibility; they *are* the practice of it. 
  - The "objective attitude = cold clinical mode" confusion needs killing early. Use the teacher example—stepping back to diagnose why a kid acts up isn’t robotic; it’s strategic compassion. 
  - The "blame-switching pill" thought experiment? Save it for the end. It’s actually a perfect test for whether they grasp that losing reactive attitudes would mean losing relationships, not just ethics. 

  The user’s proposed closing question about whether blaming is "wrong" under determinism is indeed a dud. It tempts them back into abstract debates. Better to flip it: "Could we *live* without blame?" That forces them to wrestle with Strawson’s actual claim—that ditching reactive attitudes would dehumanise us. 

  Finally, the "not covering" disclaimer is crucial. Flag that we’re skipping deep metaphysics and psychology tangents. This keeps the focus tight on Strawson’s bridge between moral practice and determinism. 

  Structure must be brutal: 
  Start with felt experience → show Strawson’s insight → unpack objective attitude → reconcile with determinism → crush misunderstandings → end with the pill as a litmus test. No detours.
answer: |-
  Right, here's the battle plan for your 45-minute Strawson session. Decisive calls, British English guaranteed.

  **Core Goal:** Get them to understand that Strawson argues our practices of holding people responsible (reactive attitudes) are *constitutive* of moral responsibility itself and are largely immune to the *abstract* threat of determinism. They are rooted in our human relationships, not metaphysics.

  **The Essential Sequence (Stick Rigidly To This):**

  1.  **Start with the RAW HUMAN EXPERIENCE (5 mins):**
      *   **DO NOT START WITH DETERMINISM.** That's the trap. You'll lose them immediately in abstracts.
      *   **OPENING QUESTION:** "Think about the last time you felt genuinely *resentful* towards someone – maybe they deliberately snubbed you, took credit for your work, or hurt your feelings. What did that *feel* like? What about feeling real *gratitude* when someone went out of their way for you?" (Get brief examples).
      *   **HIT THEM WITH EXAMPLES:** "Imagine you lend your favourite jumper to a mate, and they return it stained and ripped, shrugging and saying 'Oops, forgot it was in my bag at that messy party'. How do you feel? Now imagine your little sibling accidentally trips and spills juice on the same jumper while trying to help you carry stuff. Same jumper, same damage – different feeling?" (Focus on the *attitude* – resentment vs. perhaps just annoyance/frustration).
      *   **KEY TERM INTRO:** Label those feelings: Resentment, Indignation, Gratitude, Forgiveness, Approval. These are **Reactive Attitudes (RAs)**. They're our natural emotional responses to the *quality of will* others show towards us and others – good or ill.

  2.  **Introduce the THREAT & Strawson's COUNTER-MOVE (10 mins):**
      *   **NOW bring in Determinism:** "Philosophers often worry: if determinism is true – if everything we do is caused by factors ultimately outside our control (genes, upbringing, the universe's initial state) – then how can we *truly* hold anyone morally responsible? Doesn't it mean blame and praise are fundamentally unfair?"
      *   **Strawson's Insight:** "Strawson says: Hold on! Look at what actually *happens* when we consider determinism. Does the truth or falsity of determinism *actually change how we feel and act* in our everyday relationships? Do you *genuinely* stop feeling resentment when someone deliberately insults you because you've read a book about physics? Probably not."
      *   **His Claim:** Our RAs are **part of the framework of human life**. They are how we *participate* in interpersonal relationships. We couldn't opt out of them wholesale without ceasing to see others (and ourselves) as proper *persons*.

  3.  **Contrast: Reactive Attitudes vs. The Objective Attitude (15 mins):**
      *   **Introduce Objective Attitude (OA):** This is the stance we take when we see someone *not* as a responsible agent, but as an object to be managed, studied, treated, or handled. We suspend the RAs.
      *   **CRUCIAL EXAMPLE (Use this one - ditch the hungry mate):**
          *   **Scenario:** A normally kind, gentle classmate suddenly snaps cruelly at another student, calling them names seemingly out of nowhere. You feel immediate indignation on the victim's behalf.
          *   **The Shift:** You then learn this classmate has recently been diagnosed with a serious, previously undetected neurological condition that directly causes sudden, uncharacteristic aggressive outbursts.
          *   **What Happens?** Your indignation (RA) *fades*. You might feel pity, concern, or a desire to get them medical help. You adopt the **Objective Attitude (OA)**. You see them not as *blameworthy* for the cruelty, but as *subject to* a condition.
      *   **Why this example works:**
          *   Shows a *reason* for shifting from RA to OA (specific incapacity).
          *   It's about a *fundamental impairment* affecting agency/quality of will, not a transient state (hunger/tiredness).
          *   It clearly demonstrates the OA isn't necessarily "cold" (it involves care/concern) but it *is* different from holding responsible.
      *   **What it mustn't have:** Avoid examples that are *just* excuses ("he was stressed"), minor impairments ("hungry"), or purely childhood ("he's only 5"). It needs a sense of *genuine exculpating incapacity*.
      *   **Other OA Examples (Briefly):** Treating very young children, severe intellectual disability, perhaps a sleepwalker. Emphasise OA is a spectrum and context-dependent.

  4.  **Strawson's Reconciliation: Determinism is Irrelevant (to the core practice) (5 mins):**
      *   **The Punchline:** Strawson argues that the *general* thesis of determinism **does not** give us a reason to adopt the Objective Attitude *universally* towards everyone. Why?
      *   **Key Point:** Determinism, even if true, doesn't reveal some *new, specific incapacity* in every person that fundamentally impairs them in the way our neurological condition example did. It's a general, abstract fact (if it is a fact), not a reason to see *this specific person* in front of us right now as incapable of participating in ordinary adult interpersonal relationships governed by RAs.
      *   **Analogy:** Knowing everything is made of atoms doesn't stop us seeing a table as solid or using it to eat dinner. Knowing determinism *might* be true doesn't stop us reacting to kindness with gratitude or cruelty with resentment *in the normal run of things*.

  5.  **Tackling Predictable Misunderstandances (Head them off HERE):**
      *   **"So Strawson thinks being responsible is just a feeling?"**
          *   **HEAD OFF:** Immediately after explaining RAs (Step 1/2) and *again* here. "Strawson isn't saying responsibility is *just* a feeling we can switch on and off willy-nilly. He's saying these reactive attitudes *are the social practice itself*. They *constitute* what it *means* for us to hold each other responsible within our relationships. It's not a report on some hidden metaphysical 'free will' property; it's the lived reality of moral life."
      *   **"Objective Attitude = being cold and clinical":**
          *   **HEAD OFF:** When introducing the OA (Step 3). **Emphasise:** "The OA isn't *only* about being detached or scientific. Think of a teacher patiently trying to understand *why* a disruptive child is acting out – they might be suspending immediate blame (RA) to help (OA involves care, treatment, management). Or comforting a friend having a panic attack – you're not blaming them, you're helping them manage. It can be warm and concerned, but it *is* different from holding them immediately answerable."
      *   **"The Blame-Switching Pill":**
          *   **HEAD OFF:** **Save this for the very end** (Step 6) as your killer closing thought experiment. It's actually perfect *then*.

  6.  **The Killer Closing Question (Not Determinism!) (5 mins):**
      *   **DUD:** "Would we be *wrong* to blame people if determinism is true?" (This just pulls them back into the abstract debate Strawson wants to sidestep).
      *   **BETTER QUESTION:** "Strawson argues we *couldn't* realistically give up reactive attitudes without giving up deep personal relationships. Imagine a 'Responsibility Switch' pill existed. Taking it would make you permanently adopt the Objective Attitude towards *everyone*. You'd never feel resentment, gratitude, moral indignation, or personal forgiveness again. **Would taking this pill improve your life, or fundamentally impoverish it? Why?**"
      *   **Why it's better:**
          *   It tests understanding of RAs as *constitutive* of relationships.
          *   It forces them to confront the *human cost* of abandoning RAs, not the abstract "rightness".
          *   It directly challenges Strawson's core claim about the framework of human life.
          *   It uses the "pill" thought experiment productively.

  7.  **What You Openly Say You're NOT Covering (Do this upfront, after Step 1 or start):**
      *   "Just to be clear, in 45 minutes we're *not*:
          *   Getting deep into the metaphysics of determinism vs. free will itself.
          *   Debating whether determinism is actually true or false.
          *   Exploring detailed psychological theories of moral development.
          *   Covering every nuance of Strawson's paper or later criticisms.
      *   We *are* focusing on Strawson's core move: showing why our everyday practices of holding responsible (reactive attitudes) might be resilient against the *general* threat of determinism."

  **Summary Flow:** Human Experience (RAs) -> The Threat (Determinism) -> Strawson's Defence (Practice is resilient) -> The Contrast (OA vs. RA, with GOOD example) -> Why Determinism doesn't compel OA universally -> Crush Misunderstandings -> Provocative Closing Pill Question.

  **Be Bold:** You know the material. Dictate the pace. Shut down abstract determinism debates early ("We'll come back to why Strawson thinks that's the *wrong* starting point"). Focus relentlessly on the *lived experience* of blaming/thankin. Good luck – you've got this!
