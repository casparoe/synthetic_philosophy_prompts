answer: |-
  Here is a procedure for structuring biographical fiction, designed as a sequence of operational questions. It incorporates Plutarch’s focus on revealing details ("phrase or a jest") and the "signs of the soul," while addressing the pitfalls of hagiography. It explicitly marks where judgment is required and where the process may misfire. I’ll then apply it to your three cases.

  ---

  ### **The Procedure: 12 Questions for Moral Clarity**
  **Key Principles from Plutarch & Edifying Tradition Preserved:**  
  1. **Small Details > Grand Events**: Prioritize gestures, private letters, or unguarded moments over public achievements.  
  2. **Soul Over Contests**: Focus on psychological texture, not historical impact.  
  3. **Edifying Tradition’s Survivors**:  
     - *What it got wrong*: Insisting on moral perfection; forcing coherence onto messy lives.  
     - *What survives*: The idea that a life becomes instructive when it reveals *tension* (e.g., courage conflicting with fear, integrity warring with ambition).  

  **Constraints Respected:**  
  - Uses only accessible sources (letters, diaries, photos, memoirs).  
  - Workable at outline (afternoon) and revision stages (week).  
  - Flags editor/family sensitivities.  
  - Identifies where distinctions matter and where simplification is safe.  

  **Sequence:** Answer each question in order. Stop if any answer is "No" to the specified question.  

  1. **Is there a documented moment where the subject acts *against* their professed values?**  
     - *Sufficient answer*: A specific incident (e.g., a letter dismissing an ally, a financial record contradicting public claims).  
     - *If no*: Stop. Re-examine sources; without this tension, risk of hagiography is high.  
     - *Judgment alert*: You decide if the act is material (trivial selfishness vs. betrayal of core principle).  
     *Distinction to keep*: "Against values" ≠ "failure." Focus on hypocrisy, not defeat.  
     *Simplification allowed*: Ignore minor inconsistencies (e.g., polite lies).  

  2. **Does a small, unplanned detail expose this tension?**  
     - *Sufficient answer*: A phrase, object, or fleeting reaction (e.g., a trembling signature, an erased diary entry).  
     - *If no*: Hand to *your editor*. Explain why you’re using a grand event instead.  
     - *Misfire warning*: For "verdict-resistant" lives, this may over-interpret ambiguity.  

  3. **Does the subject’s self-account *omit or distort* this moment?**  
     - *Sufficient answer*: Compare their version (memoir/letters) with external evidence.  
     - *If no*: Proceed but flag as "unself-aware" in revision.  
     - *Judgment alert*: You gauge distortion (deliberate lie vs. genuine blindness).  

  4. **Does including this moment reveal a *universal tension*?** (e.g., power vs. compassion, loyalty vs. survival).  
     - *Sufficient answer*: Name the tension (e.g., "the cost of decisiveness").  
     - *If no*: Omit the moment—it’s likely gossip, not insight.  
     - *Edifying survival*: Lives teach through shared human tensions, not "lessons."  

  5. **Would omitting this moment aid the subject/family’s reputation unfairly?**  
     - *Sufficient answer*: "Yes" if incident contradicts public legacy.  
     - *If yes*: You *must* include it. Hand weighting/nuance to Step 6.  
     - *Family/executor risk*: Here, document your reasoning for potential disputes.  

  6. **Weighting: Does the moment explain a *turning point* or *lifelong pattern*?**  
     - *Hinge*: If it altered relationships/core beliefs.  
     - *Weighted detail*: If it reflects a recurring flaw/virtue.  
     - *Footnoted*: If minor but necessary for honesty.  
     - *Reader’s judgment*: Only if evidence is ambiguous AND you’ve shown the tension first.  

  7. **For Plutarch pairing: Do both lives *share the same core tension*?**  
     - *Sufficient answer*: "Yes" if both grapple with identical conflict (e.g., "collaboration vs. resistance in powerless systems").  
     - *If no*: Reject pairing—comparison becomes moralizing.  
     - *Judgment alert*: You define the tension. Misfires if tensions are superficially similar but psychologically distinct.  

  8. **Does pairing force a "hero/villain" dichotomy?**  
     - *Sufficient answer*: "No" if both subjects’ choices are contextually understandable.  
     - *If yes*: Abandon pairing.  

  9. **At revision: Does admiration flatten complexity?**  
     - *Test*: Read pages aloud. If you feel defensive, add a small contrary detail.  
     - *Sufficient answer*: Neutral tone describing a fault.  

  10. **Does debunking dominate?**  
      - *Test*: Count positive/negative revelations in Chapter 3 (mid-book). If >70% negative, add a "redeeming" small act (e.g., a kindness amid cruelty).  
      - *Sufficient answer*: Balance without false equivalence.  

  11. **Conscience check: Would the subject recognize themselves?**  
      - *Sufficient answer*: "Partly"—they should see their tensions reflected.  
      - *If "no"*: Hand to *a beta reader* unfamiliar with the subject. If they find the portrait plausible, proceed.  

  12. **Editor’s lens: Does this compromise marketability?**  
      - *Always hand to editor* with your reasoning from Step 5.  

  ---

  ### **Applied to Your Cases**
  **1. Sanatorium Director**  
  - **Step 1**: *Yes*—dismissal of nurse against her ethos of care.  
  - **Step 2**: *Yes*—if her letter cites "protocol" while ignoring extenuating circumstances (small bureaucratic phrase).  
  - **Step 3**: *Likely yes*—memoir omits this; letters may justify it.  
  - **Step 4**: *Yes*—tension: "rigidity in service of institutional control."  
  - **Step 5**: *Yes*—omitting aids her reputation unfairly. **Include it.**  
  - **Step 6**: *Weighted detail* (not hinge). Shows a pattern—e.g., she later dismisses an orderly similarly. Trust the reader to weigh it alongside her achievements.  
  - **Verdict**: Include as a scene, not footnote.  

  **2. Magistrate Under Occupation**  
  - **Step 1**: *Unclear*—bureaucratic file could imply resistance (delaying orders) or compliance (enforcing them).  
  - **Step 2**: *No*—no small detail; only a photo (e.g., strained expression?). If absent, **hand to editor**: Can you imply tension through physical description?  
  - **Step 7 (Pairing test)**: Pair *only* if both magistrate and collaborator share the *exact tension*: e.g., "moral compromise to protect locals." If the collaborator’s motive is greed, pairing is invalid. **Likely rejected**—comparison does moral work evidence can’t support.  
  - **Verdict**: Write his life alone, emphasizing ambiguity. Let the file’s opacity *be* the theme.  

  **3. Someone You Knew**  
  - **Step 1**: *Assume yes*—your intimacy ensures you know a fault.  
  - **Step 5**: *Yes*—omitting would sanitize. **Include it.**  
  - **Step 6**: If the "scenes you cherish" avoid a tension (*Step 4*), **cut them**. They serve you, not the universal tension.  
  - **Step 11**: If they wouldn’t recognize themselves, use a *beta reader*. If they deem it implausible, revise.  
  - **Verdict**: The procedure will likely force cuts or harsh inclusions. Example: A touching memory may be omitted if it ignores a pattern of selfishness revealed in small acts (e.g., they *always* forgot birthdays).  

  ---

  ### **What the Procedure Cannot Do**  
  1. **Resolve the Particularity Paradox**: Lives teach through idiosyncrasy, not general rules. The procedure ensures tension is *universal*, but can’t make a life "exemplary"—that’s the reader’s role.  
  2. **Create Meaning from Thin Evidence**: For lives like the magistrate, it will flag ambiguity but can’t invent depth. You must decide: abandon or embrace the opacity.  
  3. **Override Your Compassion**: If you *need* a subject to be admirable (e.g., for family approval), the procedure will clash. It can’t reconcile your ethics with external pressures.  
  4. **Judge Historical Impact**: It focuses on character, not legacy.  

  ### **Recurring Problems Beyond Method**  
  - **Admiration as Attachment**: Your smoothing of faults isn’t a method failure—it’s emotional loyalty. The procedure exposes but can’t cure this.  
  - **The "Lesson" Fallacy**: Readers learn from complexity, not didacticism. Your urge to "draw a lesson" is a storytelling instinct, not a research gap.  
  - **Fear of Ambiguity**: Lives that resist verdicts (e.g., the magistrate) aren’t problems—they’re honest. Your discomfort with unresolved tension is creative, not procedural.  

  ---

  **Final Note**: This procedure forces collision with the hardest truths. Its output may unsettle editors or estates, but as Plutarch knew, the soul’s signs thrive in discomfort. Use it to mine the "jests" and "phrases," and trust tension—not admiration—to hook the reader.
