prompt: |-
  I'm a software engineer at a mid-sized company that builds workforce-management software (shift scheduling, task assignment, productivity dashboards), and I have ended up chairing the internal review board that signs off on new deployments before they go to a client. We meet roughly monthly, we have about ninety minutes per case, and nobody on the board has a philosophy background; the decisions can affect hundreds of workers' pay, hours, and job security, and the head of product and our legal counsel have to sign the written recommendation, so the procedure has to be something a non-specialist can run and defend. I keep hearing two words from the one colleague who did a PPE degree — exploitation and alienation — and I have read enough Marx to know that they are not the same thing and that he thought they were connected, but I cannot get from that to a decision I can actually make in a meeting. What I want from you is a reusable procedure rather than a lecture: a checklist or decision tree in words that our board can run on any proposed deployment, with the questions in the order we should ask them, what counts as a sufficient answer to each, where the procedure should stop with a clear no, and where it has to hand the decision back to a person because the question is about values rather than facts. Please keep whatever Marx actually said that matters — the difference between a worker producing value and a worker being exploited, and the several distinct senses of alienation, from the product, from the work process, from other people, and from what the work lets you be — but translate it into tests we can apply with the evidence we actually have: usage logs, pay records, worker surveys, the contract, and whatever the client will tell us. I am not looking for a reading list or citations; I need the procedure.

  Two complications I want the procedure to handle rather than wave away. First, my colleague argues that exploitation and alienation can come apart in both directions: a well-paid engineer who loves her craft and controls her own schedule can still be generating surplus for the firm, and an unpaid artist alienated from her own work is not being exploited in Marx's technical sense at all; if that is right, a procedure that treats one as a proxy for the other will misclassify cases, so I want the two questions kept separate and an explicit instruction for what to do when they point in opposite directions. Second, I do not want the procedure to collapse into asking whether the arrangement is pleasant for workers; Marx's point about exploitation is structural, about where the surplus goes, not about whether people are smiling. Then run the procedure on three cases and show your work: (a) a warehouse picking system that lifts throughput about fifteen percent with no change in hourly pay and adds bathroom-break tracking; (b) a scheduling tool that gives workers more choice over shifts but moves them onto per-task pay with no benefits; and (c) the case I expect to be uncomfortable for me, our own team's AI assistant that genuinely makes the work more interesting but also makes it easy for people to keep working after hours without recording it. Include at least one case where the procedure returns an answer the board will not like, and be explicit about what the procedure cannot do — the questions it will never settle, the numbers we will not have access to, and the points where the honest answer is that this is a judgment call about values and not a fact we can look up.
reasoning: |-
  We are designing a procedure for an internal review board to evaluate new deployments in workforce-management software. The procedure must assess two distinct Marxian concepts: exploitation and alienation, while recognizing they can occur independently. 

  Key definitions for the procedure:
  1. **Exploitation (Marxian sense)**: Occurs when workers produce more value (surplus) than they receive in wages, and this surplus is appropriated by the capital-owning class (the firm). This is structural and does not necessarily relate to the worker's subjective experience.
  2. **Alienation**: We break it into four dimensions as per Marx:
     a. **Alienation from the product**: The worker does not feel connected to or in control of what they produce.
     b. **Alienation from the act of production (work process)**: The work is monotonous, meaningless, or controlled by others to the extent that it feels foreign.
     c. **Alienation from their "species-being"**: The work prevents the worker from realizing their human potential or from engaging in activities that are fulfilling and self-directed.
     d. **Alienation from other workers**: The work environment or technology creates isolation, competition, or prevents solidarity.

  The procedure must use available evidence: usage logs, pay records, worker surveys (if available), contracts, and client information.

  We design a two-part procedure: Part 1 for Exploitation, Part 2 for Alienation. Each part has a set of questions. We then have a decision matrix for the combined outcome.

  **Part 1: Exploitation Assessment**

  Question E1: Does the deployment change the way value is produced or captured?
     - Look for: Changes in productivity (e.g., throughput), changes in pay structure (e.g., from hourly to per-task), changes in the number of workers required, or changes in the intensity of work.
     - Evidence: Client's stated goals, pre/post deployment metrics (if available from pilot), contract terms regarding pay and productivity.

  Question E2: Does the deployment increase the surplus generated per worker? (i.e., the difference between the value the worker produces and their compensation)
     - Note: We may not have direct access to the value produced (which in Marx is linked to labor time and socially necessary labor). We use proxies:
          a. If productivity (output per hour) increases without a proportional increase in compensation, then surplus per worker likely increases.
          b. If the pay structure shifts to piece-rate (per task) and the rate per task is set such that workers must work more intensively to earn the same, then surplus may increase.
     - Evidence: Productivity data, pay records (before/after if available), contract terms.

  Question E3: Who captures the increased surplus?
     - We are concerned if the surplus is captured entirely (or predominantly) by the firm (the employer) and not shared with the workers.
     - Evidence: Contract terms (e.g., whether there is profit-sharing, bonuses tied to productivity, or if the savings are passed to the client and then to the firm). Also, look at whether the deployment is designed to reduce labor costs without compensating workers.

  **Exploitation Judgment**:
     - If the answer to E1 is "no", then exploitation (as a change) is not at issue. We mark as "No change" or "Not applicable".
     - If E1 is "yes", and E2 is "yes" (surplus increases) and E3 is "the firm" (or client, but note the firm is the employer) captures the surplus without sharing appropriately, then we flag exploitation as increasing.
     - If the surplus is shared (e.g., workers get a raise or bonus that matches the productivity gain) then exploitation does not increase (it may even decrease).

  **Part 2: Alienation Assessment**

  We break alienation into four dimensions (A1 to A4). For each, we ask:

  A1: Alienation from the product
     - Question: Does the deployment make the worker's relationship to the final product more remote or less controllable?
     - Evidence: Worker surveys (if available) about understanding of their contribution, job design (does the worker see the outcome of their work?), client's description of the work process.

  A2: Alienation from the work process
     - Question: Does the deployment reduce the worker's control over how they perform their tasks, or make the work more monotonous, less skilled, or more stressful?
     - Evidence: Usage logs (e.g., are workers more tightly monitored?); surveys about autonomy, stress, and job satisfaction; changes in skill requirements (deskilling?).

  A3: Alienation from species-being
     - Question: Does the deployment hinder the worker's ability to develop their human potential, engage in creative or fulfilling work, or have adequate rest and non-work time?
     - Evidence: Changes in working hours (e.g., after-hours work without compensation), workload intensity, opportunities for learning and growth, work-life balance.

  A4: Alienation from other workers
     - Question: Does the deployment reduce opportunities for social interaction, collaboration, or collective action among workers?
     - Evidence: Design of the tool (e.g., does it isolate workers?); surveys about teamwork; client's use of the tool for individual performance tracking that might foster competition.

  **Alienation Judgment**:
     - For each dimension (A1-A4), we assign:
          - Increases alienation: if the evidence clearly shows a negative change.
          - No change or mixed: if unclear or no change.
          - Decreases alienation: if the evidence shows improvement.
     - Overall: If any dimension increases alienation, we note that. We are particularly concerned if multiple dimensions show an increase.

  **Decision Matrix**:

  We have two independent judgments: Exploitation (E) and Alienation (A). We are concerned about both, but they are separate.

  - E: Can be "Increases", "No change", or "Decreases"
  - A: Can be "Increases" (if at least one dimension increases and none decrease), "Decreases" (if at least one decreases and none increase), or "Mixed/No change"

  We then combine:

  If E is "Increases" and A is "Increases": Strong negative (both problems)
  If E is "Increases" and A is "Decreases": Trade-off (less alienation but more exploitation) -> requires human judgment about whether the increase in exploitation is acceptable given the reduction in alienation? (But note: exploitation is structural and not about happiness.)
  If E is "Increases" and A is "Mixed/No change": Negative due to exploitation.
  If E is "No change" and A is "Increases": Negative due to alienation.
  If E is "Decreases" and A is "Increases": Trade-off (less exploitation but more alienation) -> also requires judgment: is the reduction in exploitation worth the increase in alienation? (But note: alienation is about human flourishing.)
  If both decrease: Positive.

  However, note that the board must make a recommendation. We set thresholds:

  - If either E or A shows a clear increase, we must flag it and consider mitigation.
  - The board must decide whether the increase in exploitation or alienation is acceptable given the context, but the procedure will highlight the risks.

  The procedure does not make the decision for the board but structures the evidence and flags concerns. The board must then weigh the evidence and consider:

  - The severity of the exploitation (how much surplus is being extracted and how unfairly distributed) and the severity of the alienation (which dimensions and how deeply it affects workers).
  - Whether there are mitigation measures (e.g., if exploitation increases, can we recommend a profit-sharing agreement? If alienation increases, can we adjust the design?).

  **Limitations of the Procedure**:

  1. We cannot directly measure the value produced by workers (only proxies like productivity).
  2. We often lack worker surveys (especially if the client does not conduct them). In such cases, we must rely on the design of the system and the client's stated intentions, which may be biased.
  3. Alienation is subjective. Without survey data, we are making inferences that might be incorrect.
  4. The connection between the deployment and the outcomes may be confounded by other factors. We are relying on pre/post comparisons or client projections.
  5. The procedure does not tell us what level of exploitation or alienation is acceptable. That is a value judgment.

  **Running the Cases**:

  Case (a): Warehouse picking system that lifts throughput about 15% with no change in hourly pay and adds bathroom-break tracking.

  - Exploitation:
      E1: Yes, changes value production (increases throughput).
      E2: Productivity increases by 15%, but hourly pay remains the same. Therefore, surplus per worker increases (by about 15%).
      E3: The firm captures the surplus (no mention of sharing).
      Judgment: Exploitation increases.

  - Alienation:
      A1: Unlikely to change (still picking items for a warehouse). No change.
      A2: Bathroom-break tracking suggests increased surveillance and potential stress. This could reduce autonomy (workers may feel pressured to take fewer breaks). Increases alienation in the work process (A2).
      A3: The increased intensity (throughput) without more rest may hinder rest and non-work time. Also, tracking breaks might lead to workers skipping breaks, which is unhealthy. Increases alienation from species-being (A3).
      A4: No direct information, but if the system individualizes performance tracking, it might foster competition. We don't have evidence. No change or mixed.
      Overall: Alienation increases (due to A2 and A3).

  - Combined: Both exploitation and alienation increase. Strong negative. The board should not approve without mitigation (e.g., sharing the productivity gain via higher pay and ensuring break policies are humane).

  Case (b): Scheduling tool that gives workers more choice over shifts but moves them onto per-task pay with no benefits.

  - Exploitation:
      E1: Yes, changes pay structure and potentially productivity.
      E2: Per-task pay: if the task pay rates are set such that workers must work more to earn the same as before, then surplus increases. Also, the removal of benefits (like health insurance) effectively reduces compensation. Even if hourly equivalent pay remains the same, the risk is shifted to workers (they may have gaps without work). We need data: what is the expected earnings change? If the client says workers can earn more by working more, but without a guaranteed base, exploitation may increase because the firm avoids paying for idle time and benefits. We assume the firm captures the surplus (reduced labor costs per unit of output).
      E3: The firm captures the surplus (by reducing fixed costs and shifting to variable pay that only pays for work done).
      Judgment: Exploitation increases.

  - Alienation:
      A1: Unlikely to change. No change.
      A2: The shift to per-task pay might make the work more stressful (workers have to constantly seek tasks to make ends meet). However, more choice over shifts might improve control. Mixed: shift choice might help A2, but piece-rate pressure might hurt. We need more evidence. Without surveys, we note potential for increased stress (which is an aspect of A2 and A3). But the shift choice might be a positive.
      A3: Loss of benefits and job security (no guaranteed hours) is a major concern. Also, without benefits, workers may be more vulnerable. This hinders their ability to flourish (A3). Also, the pressure to work more to earn enough might reduce rest. Increases A3.
      A4: The scheduling tool might allow workers to choose shifts with friends? Or it might foster competition for the most lucrative shifts? Unknown. No clear change.
      Overall: Alienation increases (primarily A3) because of loss of benefits and job security.

  - Combined: Exploitation increases and alienation increases (especially A3). Negative. The board should not approve without mitigation (e.g., maintaining benefits and a base pay guarantee).

  Case (c): AI assistant for our own team that makes work more interesting but also makes it easy for people to keep working after hours without recording it.

  Note: This is for the software engineers at the company (the board's own team). We are the workers.

  - Exploitation:
      E1: The tool may increase productivity (we can produce more code or designs). But note: we are salaried, not hourly. Our compensation does not change with hours worked. However, if we work more hours without additional pay, then the surplus we generate per hour of labor may increase (because we are producing more without extra pay). But in a salaried position, the value we produce is not directly tied to hours. However, if our productivity increases and we are not compensated for that, then the firm captures the surplus.
      E2: Without a change in salary, if we produce more, then surplus per worker increases. But note: the tool might also make work more efficient so that we produce more without working more hours? The problem states that it makes it easy to work after hours without recording. So it may lead to more unpaid hours. Therefore, surplus increases.
      E3: The firm captures the surplus (we don't get paid extra for the extra work).
      Judgment: Exploitation increases.

  - Alienation:
      A1: The tool might make the work more interesting, so we might feel more connected to the product (if we see the results). Decreases alienation.
      A2: The tool might give us more control (if it helps with creative tasks) and make the work less monotonous. Decreases alienation (A2 and A3).
      But: The after-hours work without recording is a problem for A3 (species-being): it blurs work-life boundaries and may lead to burnout. This is an increase in alienation (A3). 
      A4: Not obviously changed.
      Overall: Alienation is mixed: decreases in A1/A2 but increases in A3. We must note the after-hours issue as a significant concern.

  - Combined: Exploitation increases and alienation is mixed (but with a critical increase in A3). This is a trade-off. The board must decide: the increase in exploitation and the risk to work-life balance (A3) may outweigh the benefits. We cannot ignore the exploitation because we are salaried and might feel okay about working extra, but the structure is still extracting more surplus without compensation. Also, the after-hours work without pay is a form of self-exploitation that the tool facilitates.

  This case might be uncomfortable because we like the tool. The procedure flags the exploitation and the alienation in A3. The board should recommend against deployment without mitigation: for example, the tool should include features that prevent after-hours work (or automatically record it for compensation) and/or the company should adjust salaries to reflect the increased productivity.

  **Final Procedure Outline**:

  1. **Exploitation Assessment**:
     - E1: Change in value production/capture? (If no, mark as no change and skip to alienation.)
     - E2: Does it increase surplus per worker? (Using productivity and compensation data.)
     - E3: Who captures the surplus? (If the firm captures without sharing, then exploitation increases.)

  2. **Alienation Assessment** (for each dimension A1-A4, note the change):
     - A1: Alienation from product (evidence: surveys, job design)
     - A2: Alienation from work process (evidence: logs, surveys, changes in autonomy)
     - A3: Alienation from species-being (evidence: hours, workload, rest, benefits)
     - A4: Alienation from other workers (evidence: collaboration tools, surveys)

  3. **Combined Judgment**:
     - Flag any increase in exploitation or any increase in any alienation dimension.
     - For trade-offs (e.g., exploitation increases but alienation decreases), the board must explicitly discuss and decide.

  4. **Mitigation**: If the deployment is otherwise beneficial, the board can recommend conditional approval with mitigations (e.g., profit-sharing, design changes to reduce alienation, policies to prevent overwork).

  5. **Limitations Note**: The board must be aware of data gaps (especially on alienation without surveys) and the inherent value judgments in weighing exploitation vs. alienation and in deciding what level is acceptable.

  The procedure does not give a simple "yes/no" but structures the evidence and flags concerns. The board must then make a decision based on the severity and the possibility of mitigation.
answer: |-
  Below is a reusable, step-by-step procedure for your review board, designed to evaluate deployments through the lenses of **exploitation** (structural surplus extraction) and **alienation** (four dimensions of human disconnection), while keeping them distinct. The procedure uses evidence you have (contracts, pay records, usage logs, surveys, client statements) and explicitly handles cases where exploitation and alienation conflict. It includes thresholds for clear "no" decisions, notes where values-based judgment is required, and defines "sufficient evidence" for each step.

  ---

  ### **Procedure: Exploitation & Alienation Assessment for Workforce Tools**
  **Inputs Required for Each Case:**  
  - Client contract and deployment goals  
  - Pay structure (pre/post-deployment)  
  - Productivity data (e.g., throughput, tasks/hour)  
  - Usage logs (monitoring intensity, work patterns)  
  - Worker surveys (if available; else, client testimonials on work conditions)  
  - Job design descriptions (autonomy, skill requirements, social interaction)  

  **Outputs:**  
  - **Exploitation verdict:** `Increase` / `No change` / `Decrease`  
  - **Alienation verdict:** `Increase` (any dimension) / `No change` / `Decrease`  
  - **Overall recommendation:** `Approve` / `Reject` / `Approve with mitigations`  
  - **Confidence level:** `High` (data clear) / `Medium` (inference) / `Low` (values judgment)  

  ---

  #### **Step 1: Assess Exploitation (Focus: Surplus Extraction)**  
  **Question:** *Does this deployment increase the rate at which surplus value is extracted from workers?*  
  **Marxian Core:** Exploitation occurs when workers produce more value than they are paid, and the surplus is captured by the firm/clients.  
  **Evidence Used:** Pay records, productivity data, contracts.  

  1. **E1: Does the deployment raise productivity?**  
     - *Sufficient evidence:* Pre/post-deployment throughput data or client projections (e.g., "15% faster task completion").  
     - *Threshold:* Any increase in output per worker-hour counts. If no change, skip to E3.  
     - **If unclear (e.g., no data):** Flag for client follow-up. If still unclear, assume no change.  

  2. **E2: Is the productivity gain matched by proportional compensation?**  
     - *Sufficient evidence:* Compare % productivity increase to % change in wages/benefits (using pay records).  
     - *Calculation:*  
       - Hourly workers: If output ↑15% but wages unchanged → mismatch.  
       - Per-task workers: If task rate unchanged but tasks completed faster → mismatch.  
     - **Clear "no" trigger:** Mismatch found → proceed to E3.  
     - **If matched (e.g., wages ↑15%):** Exploitation `No change`. Stop.  

  3. **E3: Who captures the surplus?**  
     - *Sufficient evidence:* Contract terms or client statements on who benefits from productivity gains (e.g., "savings go to firm," "no profit-sharing").  
     - **Verdict:**  
       - Surplus captured by firm/client → Exploitation `Increase`.  
       - Surplus shared via wages/benefits → Exploitation `No change`.  
     - **Values judgment needed if:** Surplus is partially shared (e.g., bonuses cover 50% of gains). Board must decide if sharing is "sufficient" (no Marxian formula; debate fairness).  

  ---

  #### **Step 2: Assess Alienation (Focus: Four Dimensions of Disconnection)**  
  **Question:** *Does this deployment increase alienation in any of Marx’s four dimensions?*  
  **Marxian Core:** Alienation is disconnection from (a) product, (b) work process, (c) human potential ("species-being"), or (d) other people.  
  **Evidence Used:** Usage logs, surveys, job design descriptions.  
  **Approach:** Assess each dimension separately. **Any increase** in one dimension → overall alienation `Increase`.  

  1. **A1: Alienation from the product?**  
     - *Question:* Does the worker understand or control the final product less?  
     - *Evidence:* Job descriptions (e.g., "worker only sees sub-tasks, not final output"), surveys (e.g., "I don’t know how my work is used").  
     - **Increase if:** Deployment fragments tasks further (e.g., pickers don’t see warehouse goals).  

  2. **A2: Alienation from the work process?**  
     - *Question:* Does the worker have less autonomy or more monotony?  
     - *Evidence:* Usage logs (e.g., break monitoring, activity tracking), surveys (e.g., "I can’t choose how I work").  
     - **Increase if:** New monitoring/tracking (e.g., bathroom-break logs) or reduced discretion.  

  3. **A3: Alienation from human potential?**  
     - *Question:* Does the work hinder development, rest, or dignity?  
     - *Evidence:* Surveys (e.g., "I’m exhausted"), usage logs (e.g., after-hours work), contract (e.g., loss of benefits).  
     - **Increase if:**  
       - Unpaid work increases (e.g., off-clock tasks).  
       - Benefits cut (e.g., healthcare removed).  
       - Work impedes rest/skill growth (e.g., no time for training).  

  4. **A4: Alienation from other workers?**  
     - *Question:* Does deployment reduce collaboration or foster competition?  
     - *Evidence:* Job design (e.g., "solo tasks only"), surveys (e.g., "I never talk to teammates").  
     - **Increase if:** Tool enables individual performance ranking or reduces team interaction.  

  **Verdict:**  
  - `Increase` if **any dimension** worsens (even if others improve).  
  - `Decrease` only if all dimensions improve. Else, `No change`.  
  **Values judgment needed if:** Conflicting evidence (e.g., surveys show ↑stress but logs show ↑autonomy). Board must weigh sources.  

  ---

  #### **Step 3: Resolve Exploitation vs. Alienation Conflicts**  
  - **If both agree** (e.g., both ↑ or both ↓): Recommendation is straightforward (see Step 4).  
  - **If they conflict** (e.g., exploitation ↓ but alienation ↑, or vice versa):  
    - **Board must decide:** Which harm is more severe? Use:  
      - *Exploitation severity:* Scale of surplus extraction (e.g., 15% wage-productivity gap vs. 5%).  
      - *Alienation severity:* Which dimension is affected? (A3 > A2 > A1/A4 in most cases).  
    - **No default answer:** This is **values-based**, not factual. Document rationale.  

  ---

  #### **Step 4: Make Recommendation**  
  - **Reject if:**  
    - Exploitation `Increase` **and** alienation `Increase` (unambiguous harm).  
    - Exploitation `Increase` with severe alienation in A3 (e.g., unpaid overtime, loss of benefits).  
  - **Approve with mitigations if:**  
    - One harm occurs but can be fixed (e.g., add profit-sharing for exploitation; disable after-hours access for A3).  
    - Values conflict (Step 3) with medium severity.  
  - **Approve if:**  
    - Both `No change` or `Decrease`.  
    - Exploitation `Increase` but alienation `Decrease` in A1/A2 (e.g., workers trade surplus for meaning). *Document as values choice.*  

  **Confidence Levels:**  
  - `High`: Quantitative data + clear Marxian thresholds (e.g., E2 mismatch).  
  - `Medium`: Inferred from logs/contracts (e.g., A2 from break tracking).  
  - `Low`: Relies on surveys/client promises or values judgments.  

  ---

  ### **Limitations of the Procedure**  
  1. **Inaccessible data:**  
     - Exact surplus value (Marx’s "socially necessary labor time") is unknowable—use productivity/wage proxies.  
     - Worker surveys often missing; rely on client claims (bias risk).  
  2. **Values judgments required:**  
     - Step 3 (exploitation vs. alienation trade-offs).  
     - "Sufficient" compensation (Step E2) or "acceptable" alienation (A3).  
  3. **Cannot assess:**  
     - Long-term class dynamics (e.g., tool enabling worker solidarity).  
     - Non-worker stakeholders (e.g., clients exploiting firms).  
  4. **False negatives:**  
     - "Happy" exploited workers (e.g., well-paid engineers) pass if alienation ↓.  
     - Alienated but non-exploited workers (e.g., unpaid artists) pass exploitation test.  

  ---

  ### **Case Evaluations (Showing Work)**  
  #### **Case (a): Warehouse Picking System**  
  - *Throughput ↑15%, hourly pay unchanged, bathroom-break tracking.*  
  - **Exploitation:**  
    - E1: Yes (↑15% productivity).  
    - E2: Mismatch (wages flat → surplus ↑15%).  
    - E3: Surplus captured by firm (client pays same for more work).  
    - **Verdict:** `Increase` (High confidence).  
  - **Alienation:**  
    - A1: No change (pickers still handle goods).  
    - A2: Break tracking ↑ monitoring → `Increase`.  
    - A3: Pressure from ↑throughput may ↓ rest → `Increase`.  
    - A4: No change (unless individual rankings).  
    - **Verdict:** `Increase` (A2, A3; Medium confidence).  
  - **Conflict?** None (both ↑).  
  - **Recommendation:** `Reject` (unambiguous harm). Mitigation: Remove break tracking + share productivity gains.  

  #### **Case (b): Scheduling Tool**  
  - *More shift choice, but per-task pay with no benefits.*  
  - **Exploitation:**  
    - E1: Likely yes (flexibility may ↑ output).  
    - E2: Mismatch (benefits lost → net compensation ↓ even if task pay ↑).  
    - E3: Firm captures surplus (↓ labor costs).  
    - **Verdict:** `Increase` (Medium confidence; assumes pay doesn’t offset benefits).  
  - **Alienation:**  
    - A1: No change.  
    - A2: ↑ choice may ↓ alienation, but per-task pay ↑ pressure → **mixed**.  
    - A3: Loss of benefits (healthcare, security) → `Increase`.  
    - A4: If shifts chosen individually, may ↓ teamwork → `Increase`.  
    - **Verdict:** `Increase` (A3, A4; High confidence for A3).  
  - **Conflict?** None (both ↑).  
  - **Recommendation:** `Reject` (A3 is severe). Mitigation: Keep benefits + retain shift choice.  

  #### **Case (c): Internal AI Assistant**  
  - *Makes work more interesting, but enables unpaid after-hours work.*  
  - **Exploitation:**  
    - E1: Yes (↑ productivity via AI).  
    - E2: Mismatch (salaried workers unpaid for extra hours → surplus ↑).  
    - E3: Firm captures surplus.  
    - **Verdict:** `Increase` (High confidence).  
  - **Alienation:**  
    - A1: More interesting work → **Decrease**.  
    - A2: ↑ autonomy/engagement → **Decrease**.  
    - A3: After-hours work without pay ↓ rest/well-being → `Increase`.  
    - A4: No change.  
    - **Verdict:** `Increase` (A3 outweighs improvements; Medium confidence).  
  - **Conflict?** Yes: Exploitation ↑ but A1/A2 ↓ (trade-off).  
    - **Values judgment:** Board must weigh A3 harm (burnout risk) vs. A1/A2 benefits.  
  - **Recommendation:** `Approve with mitigations` (e.g., disable after-hours access + time-tracking). **Uncomfortable but defensible:** Trade-off requires human judgment; A3 mitigation is non-negotiable.  

  ---

  ### **Procedure Summary**  
  1. **Exploitation first** (structural; uses pay/productivity data).  
  2. **Alienation second** (four dimensions; uses logs/surveys).  
  3. **Resolve conflicts** via board values (document!).  
  4. **Reject** if both worsen; **mitigate** if one does.  

  This meets your specs: reusable, evidence-based, separates exploitation/alienation, handles conflicts, avoids "smile tests," and flags limitations. Final recommendations are actionable (approve/reject/mitigate), with explicit values calls where needed.
