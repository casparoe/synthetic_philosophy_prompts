  ### The Division  
  **A Bargaining Poem in Paired Lines**  

  We start with nothing: spreadsheets, pens,  
  &emsp;We start with nothing: silence, cost.  
  One claims the chair where reading ends,  
  &emsp;The other takes the lamp they lost.  
  One takes the books that line the wall,  
  &emsp;The other gets the fading map.  
  One takes the teapot, cracked but tall,  
  &emsp;The other keeps the whisky tap.  

  Then something gleams—a silver tray  
  &emsp;Neither will lift or hold or own.  
  It shifts the terms: we turn away,  
  &emsp;And leave that prize abruptly thrown.  

  Now one accepts the garden seat,  
  &emsp;The other takes the woven screen.  
  One takes the clock with chimes discrete,  
  &emsp;The other claims the vase, serene.  
  One takes the quilt with threads unwound,  
  &emsp;The other gets the cedar chest.  
  One takes the artwork, barely found,  
  &emsp;The other takes the compass, blessed.  

  The sofa waits for two to hold,  
  &emsp;The records wait for sound to bloom—  

  *(Final pair above; next pair unwritten below)*  

  ---

  ### Prose Note: Mapping the Poem to Game Theory  

  The poem enacts the **Kalai–Smorodinsky bargaining solution** through its structure and properties.  

  1. **Disagreement Point (d)**: The opening lines ("We start with nothing: spreadsheets, pens" / "We start with nothing: silence, cost") represent the baseline where no agreement exists—equivalent to the origin (0,0) in utility space.  
  2. **Ideal Point (u*)**: The unwritten final pair ("The sofa waits for two to hold, / The records wait for sound to bloom—") symbolizes the infeasible utopia where both players receive everything desired (here, shared ownership of the sofa and record player).  
  3. **Boundary of Feasible Set**: The poem stops abruptly at the last *possible* pair (sofa/records) before the ideal, as allocating both items to one player violates joint feasibility. The omission of the next pair (left unwritten) forces the reader to confront impossibility.  
  4. **Proportional Gains**: Each pair advances gains in fixed proportion (1:1 here, reflecting symmetry). From (0,0) toward (u1*, u2*), the cumulative shares grow equally for both players.  
  5. **Properties Recognized**:  
     - **Interchangeability**: Swapping "one" and "the other" (or their claims) leaves the poem unchanged.  
     - **Unit Independence**: Goods are described generically (chair, lamp, books) and could be denominated in objects, hours, or money without altering outcomes.  
     - **Monotonicity**: Shares only grow (no item is revoked after assignment).  
     - **Dependence on Alternatives**: The silver tray (introduced mid-poem) is irrelevant (neither takes it) yet shifts subsequent terms—violating Nash’s independence axiom and marking the transition to Kalai–Smorodinsky logic.  

  The trajectory—linear from *d* to *u*—intersects the boundary at the sofa/records pair, ending where joint feasibility ends. A game theorist would recognize the poem as a discrete path toward the Kalai–Smorodinsky solution.
