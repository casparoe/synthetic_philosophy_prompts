  ## Kepler to the Stargazer

  You cling to spheres with figures carved precise,
  The twelve-fold house where fortune takes its stand,
  The Ram, the Scales, inscribed in shifting sand,
  And polygons that bind the zodiac's device.
  You claim this frame compels, with Heaven's might,
  The deeds below, a puppet on a string,
  Where stars dictate what harvest seasons bring,
  And fate is writ in cold, celestial light. *(Octave: Traditional Apparatus)*

  Yet mark the turn! The aspects still abide,
  But not as shapes that force the world to yield;
  As *proportions* they sing across the void,
  Pure harmonies that Nature's laws reveal.
  The soul, *itself a chord*, can hear that sound,
  And tremble, strung by sympathy profound,
  *Inclined*, not driven, where those tones appeal. *(Volta: Turn to Harmonics)*

  *Causes and Houses* to the void are cast,
  But *Aspects* live as *Tones* that ever last. *(Couplet: Discarded & Kept)*

  ---

  **Historical Note:**

  This sonnet leans on well-settled aspects of Kepler's astrology, while touching on areas of genuine scholarly debate:

  1.  **Settled:**
      *   **Rejection of Compulsion:** Historians agree Kepler utterly rejected the Aristotelian-Scholastic notion that celestial bodies *physically compelled* events on Earth through material influences (as depicted in the octave). This was his core demolition.
      *   **Rejection of Houses & Sign Meanings:** It's settled that Kepler discarded the system of twelve mundane houses and the intrinsic meanings of the zodiacal signs as baseless human constructs without cosmic foundation. The couplet ("Houses to the void are cast") reflects this firmly.
      *   **Aspects as Geometry/Harmonics:** Kepler rigorously redefined aspects solely as geometric angular relationships (initially based on polygons) and, crucially, reinterpreted them through *musical harmonies* and harmonic proportions. The volta's shift from inscribed polygons to "proportions" and "harmonies" captures this key transformation. His work in *Harmonices Mundi* solidifies this.
      *   **Soul as Harmony/Sympathetic Vibration:** Kepler's Neoplatonic/Pythagorean belief that the human soul (*anima*) possessed an innate harmonic structure, making it responsive to celestial harmonies like a resonant string (the "sympathy profound" simile), is well-documented in his writings and central to his reformed astrology.

  2.  **Contested:**
      *   **Abolish vs. Reform:** The *ultimate intent* remains debated. Did Kepler aim to **abolish** traditional astrology entirely, seeing his work as a replacement physics? Or did he aim to **reform and place it on a rational, scientific foundation**, preserving its core insight about celestial-terrestrial correspondence? The poem leans towards the "reform" interpretation (the volta is a "turn," not an annihilation), presenting his harmonics as a *reconstruction*. While this view (championed by scholars like Judith Field) is strong, some argue his skepticism later deepened towards abolition.
      *   **Retention of Planetary Significations:** This is the **most significant contestation** relevant to the poem. How much traditional planetary *character* or *signification* (e.g., Mars = war, Venus = love) did Kepler retain? He explicitly rejected many traditional associations as superstitious. However, he *did* seem to retain a core set of planetary archetypes or qualities, grounded in perceived physical properties (e.g., Saturn's slowness, Jupiter's beneficence linked to size/temperateness). The poem **sidesteps this specific issue**. While it mentions the "tones" (harmonies) surviving, it does *not* explicitly state that the traditional *meanings* assigned to the planets producing those tones are kept. A strict reading of the poem focuses only on the *formal harmonic relationships* (the aspects) surviving, not the planetary significations. This reflects the ambiguity in the historical record – Kepler's practice often involved pragmatic retention of some significations while theoretically rejecting their traditional basis. The poem leans on the *secure* ground of aspects-as-harmony but remains silent on the contested ground of planetary meanings.

  **Flagged Contestation:** The poem presents Kepler's reformed astrology primarily as a system of *harmonics influencing the soul sympathetically*, which is secure. However, it implicitly **sidesteps the contested question of how much traditional planetary *signification* Kepler retained within this harmonic framework**, focusing solely on the survival of the aspects themselves as tones. A historian might argue the poem presents a slightly "cleaner" break than Kepler's actual, often pragmatic, practice allowed concerning planetary meanings.
