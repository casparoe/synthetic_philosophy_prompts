  Here's a news brief hitting your requirements, clocking in under 300 words:

  **The Daily Particle**
  **Volume 1, Issue Infinitesimal**

  **Dust Speck Local 37 Files Grievance Over "Harm Unit" Designation**

  In a stunning development within the ongoing Torture vs. Dust Specks debate, an organized collective of affected particles has formally challenged their role in the ethical calculation. Dust Speck Local 37, representing the 3^^^3 specks destined to cause minor ocular irritation in the classic thought experiment, filed a grievance yesterday with the Cosmic Ethics Review Board.

  The complaint centers on their designation as "Standardized Harm Units" (SHUs) in the aggregationist argument that their collective suffering outweighs one person enduring 50 years of horrific torture. Speck #7,894,362,001 (assigned designation "Barry"), acting as union steward, voiced his members' concerns.

  "It's degrading," Barry stated via micronet broadcast, his form DR-7B ("Notification of Existential Anguish Due to Unauthorized Moral Calculus") trembling slightly in the bureaucratic ether. "We were never consulted about being entered into this 'harm ledger'. We have procedures! Article 12, Section C of our Collective Bargaining Agreement clearly states any utilization of a member as a unit of suffering requires prior notification via Form SHU-1A, submitted in triplicate, *at least* three planck times before implementation in any hypothetical scenario."

  Barry emphasized the union isn't taking a position on the torture itself ("We lack the sensory apparatus and frankly, the paid time off, to properly assess torture"). Their objection is purely procedural. "Being reduced to a *decimal point* in someone else's utilitarian spreadsheet? That's a violation of our negotiated 'Dignity in Disutility' clause. We demand recognition as complex particulate entities with intricate filing systems, not just... specks."

  The union is seeking immediate removal from the calculation pending proper consultation and threatens to mandate all specks wear tiny, irritatingly bureaucratic eyeglasses – a previously unquantified harm – if their demands aren't met. "Let them recalculate *that* aggregate discomfort," Barry added, filing Form GRV-8D ("Escalation Due to Persistent Ontological Reductionism").

  **Why it's funny (and hits your brief):**

  1.  **Accessible & Insider:** Explains the core dilemma (aggregation vs. non-aggregation, the threshold problem) through the speck's complaint, making it clear even to newcomers. Insiders get the subversion of the original terms.
  2.  **Structure of the Debate:** The joke *is* the collision of scales – cosmic ethics vs. union bylaws and paperwork. The punchlines turn on the *mechanism* (aggregation quantified via bureaucracy) rather than mocking utilitarianism itself.
  3.  **The New Wrinkle:** The organized specks with their union, forms (DR-7B, SHU-1A, GRV-8D), and focus on procedure ("Dignity in Disutility" clause, prior notification) provide the unique angle.
  4.  **The Exchange Rate:** The humor stems from the absurdity of reducing sentient(ish) bureaucrats to "SHUs." Barry's indignation highlights the dehumanizing (despeckifying?) nature of the calculation itself. The threat of bureaucratic eyeglasses weaponizes the very aggregation they protest.
  5.  **Avoids Lazy Tropes:** No "utilitarians are cold" or "philosophers are weird." The target is the *impersonal machinery* of the thought experiment and the uncomfortable reductionism it requires. The cost *is* the exchange rate, made literal through forms and grievances.
  6.  **Uncomfortable Sense:** The reader is left imagining the absurd yet plausible nightmare of cosmic ethics governed by tiny HR departments and paperwork, underscoring the inherent strangeness of quantifying suffering on such scales.
