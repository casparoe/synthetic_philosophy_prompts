prompt: |-
  I am convening a ninety-minute session next month for a mixed group of first-year doctoral students in philosophy and economics. The philosophers have read the standard post-war analytic literature on weakness of will; the economists arrive with the first-year sequence on intertemporal choice and the quasi-hyperbolic model of present bias; almost nobody has read in the other tradition, and nearly everyone assumes the two literatures are talking about the same thing. The session is on whether they are. Please do not explain akrasia or discounting to me — I know the material and I need a teaching plan, not a summary. What I want first is the order in which the ideas must be introduced, with the dependencies made explicit: what has to be secured before the distinction between acting against one's better judgment and having a better judgment that reverses over time can even be stated without equivocation; whether the discounting model should enter before or after the group has a firm grip on akrasia, and why; where the distinction between the agent who knows her own future bias and the agent who does not belongs in the sequence, given that this is the point at which the two traditions most nearly touch and also where they most sharply part; and at what stage, if at all, the difference between akrasia and mere weakness of will should be drawn, since I suspect half the room is using the two interchangeably and I would rather correct that deliberately than let it dissolve.

  Second, the carrying example. I need one case that does the whole job, and I want to know what it must have and what it must lack. My own instinct is to build the session around a case in which nothing goes wrong at the moment of action: a woman who at six in the evening sincerely judges that the best thing is to work until nine and then go to the gym, who at eight sincerely judges that the best thing is to go home, and who, from the sofa at half past nine, judges that the gym was the best thing after all. Nobody in that story acts against her better judgment at the time she acts, and yet something has evidently gone wrong; I want the plan to say precisely what, and to adjudicate whether the correct diagnosis is akrasia, weakness of will, or neither. A colleague insists that we should simply use Ulysses and the sirens and be done with it, and I have a nagging suspicion that this is the wrong example, because he never loses the argument with himself — but I would rather you settle the question than assume my answer. If my sofa case does not survive scrutiny, say so and supply the example that does, with reasons.

  Third, the misconceptions, and the checks. I expect the group to collapse weakness of will into temptation or impulsivity; to hear 'hyperbolic discounting' as a normative verdict rather than a descriptive model; and to infer from the universality of present bias that the behaviour it describes is therefore rational, or at least excusable. Predict the ones I have not thought of, and for each tell me not merely that it should be addressed but at which point in the sequence it should be headed off, and why that point rather than another. Then give me a single question I can put to the room at the end that would show whether they have actually got the distinction or merely learned its vocabulary, and tell me what I should refuse to explain at this level — I have my own views about the formal apparatus and about the neuroscience, but I want yours — and how to say so without leaving the group feeling short-changed. Assume no assigned reading and give me no bibliography; the plan has to stand on its own. Throughout, take a definite line: where the literature is genuinely contested, concede it in a sentence and then commit to a choice with your reasons, rather than laying out the options and leaving the selection to me. Think the dependency structure through before you begin writing; open with the ideas in the order you would teach them; then give me the plan in prose, written as someone at home in both the philosophy of action and the economics of intertemporal choice.
reasoning: |-
  Hmm, this is a complex and sophisticated teaching request. The user is clearly an expert - a philosophy/economics professor designing a session on weakness of will versus present bias. They need a structured conceptual sequence, not content summaries.

  First, I need to map the dependency tree. The core distinction is between synchronic judgment violation (akrasia) and diachronic preference reversal (present bias). Akrasia must come first because it establishes the baseline concept of rational agency that present bias then complicates. You can't understand how they differ until you've firmly established what "better judgment" means in the philosophical tradition.

  The carrying example is crucial. The sofa case is actually perfect because it lacks the key feature of akrasia - conflict at the moment of action. At 8pm, going home feels subjectively right. This cleanly separates the traditions: philosophers would say no weakness of will occurred (she acted on her current best judgment), while economists see predictable dynamic inconsistency. Ulysses won't work because precommitment solves the problem without requiring resolution of internal conflict.

  For misconceptions: the biggest unmentioned one is conflating revealed preference with normative judgment. Economists might say her 8pm choice "reveals" her true preference, but philosophers would insist the 6pm judgment was normatively superior. This must be addressed when introducing the discounting model, by stressing its descriptive nature.

  The diagnostic question should force application: "In the sofa case, does the agent exhibit weakness of will at 8pm?" Correct answer requires recognizing that weakness of will requires contra-judgment action, which is absent here. 

  I'll refuse to engage with neuroscience or utility function debates - those would derail the conceptual focus. The formal discounting math can be gestured at but not derived.

  The structure will be: 
  1) Akrasia basics (securing "better judgment") 
  2) Distinguishing akrasia from weakness of will 
  3) Present bias model 
  4) Sophistication vs naivete 
  5) Sofa case application 
  6) Misconception busting

  Key moves: 
  - Define akrasia as synchronic conflict using Davidson 
  - Use "weakness of will" narrowly for failed akrasia resistance 
  - Introduce discounting only after #2 is solid 
  - Stress β-δ is descriptive during modeling 
  - Contrast revealed vs normative preferences explicitly 
  - Save Ulysses for sophistication discussion

  This maintains disciplinary integrity while enabling precise comparison. The sequence forces confrontation with the temporal structure of agency that underlies the whole debate.
answer: |-
  Here is a teaching plan structured to force conceptual clarity, with dependencies, a definitive stance on your sofa case, and targeted misconception prevention. The sequence prioritizes securing philosophical foundations before introducing economic models, as akrasia provides the necessary framework to evaluate present bias.

  ---

  ### **Conceptual Sequence with Dependencies**  
  *(Total: 85 mins; reserve 5 mins for wrap-up)*  

  1. **Secure "Better Judgment" (Akrasia Proper) (20 mins)**  
     - *Why first?* Akrasia is the irreducible core of the philosophical tradition: acting *against one’s own concurrent best judgment*. Without this, "better judgment" becomes ambiguous when introducing time.  
     - *Key move:* Define akrasia as **synchronic action-contra-judgment** (Davidson’s "incontinence"). Use a *temptation-free* case: e.g., a juror who believes verdict X is just but votes for Y due to cowardice. Stress: judgment and action are simultaneous; failure is irrationality.  
     - *Corrective:* Distinguish **akrasia** (acting against current best judgment) from **weakness of will** (a disposition toward akratic action). Weakness of will *explains* akrasia but is not identical to it.  
     - *Dependency:* This step anchors "better judgment" as a normative commitment *at t*. Present bias cannot be contrasted with akrasia until this is fixed.  

  2. **Introduce Discounting & Present Bias (Quasi-Hyperbolic Model) (20 mins)**  
     - *Why now?* Akrasia is secured, so we can introduce time without equivocating "better judgment." Present bias is a model of *diachronic preference reversal*, not synchronic failure.  
     - *Key move:* Frame discounting as **intertemporal conflict in evaluation**, not judgment violation. Use β-δ: at *t=0*, plan gym at *t=3*; at *t=3*, β discounts near-term costs (e.g., effort). Stress: this is a *predictable shift in valuation*, not necessarily irrational.  
     - *Critical distinction:* **Revealed preference ≠ better judgment**. The economist’s "utility" is descriptive; the philosopher’s "best judgment" is normative.  
     - *Dependency:* Akrasia must precede this to avoid conflating preference reversal with judgment violation.  

  3. **Sophistication vs. Naivety (15 mins)**  
     - *Why here?* This is where traditions intersect (self-prediction) and diverge (rationality implications).  
     - *Key move:* Contrast:  
       - **Sophisticates** (know future bias): May precommit (Ulysses). Economists see this as rational response; philosophers note it *bypasses* akrasia (no judgment-action conflict at *t*).  
       - **Naifs** (ignore future bias): Experience regret but no synchronic akrasia.  
     - *Dependency:* Present bias model must be clear first. Sophistication reveals the *prospective* rationality gap philosophers miss.  

  4. **The Sofa Case: Diagnosis & Adjudication (20 mins)**  
     - **Your case survives and is superior to Ulysses.**  
       - *Structure:*  
         - 6 p.m.: Judges gym best (long-term perspective).  
         - 8 p.m.: Judges home best (present-biased perspective).  
         - 9:30 p.m.: Regrets (long-term perspective restored).  
       - *What it has:* No synchronic akrasia (at 8 p.m., she acts on her *current* best judgment). Pure present bias (β-δ explains the shift).  
       - *What it lacks:* Temptation (no urge to avoid effort at 6 p.m.), precommitment (unlike Ulysses), or judgment-action conflict.  
     - **Diagnosis:**  
       - **Not akrasia:** She never acts against her *concurrent* judgment.  
       - **Weakness of will?** Only if construed as disposition to *repeated* present bias. But *philosophically*, weakness of will implies *akrasia potential*.  
       - **Verdict:** This is **pure present bias**, a *rational* response to discounting under naivety. Weakness of will is inapplicable.  
     - *Why Ulysses fails:* Ulysses *avoids* akrasia via precommitment. He never revises his judgment—he anticipates bias and neutralizes it. Sofa case forces the diachronic/synchronic distinction.  

  5. **Misconception Prevention & Checks**  
     - **Predicted misconceptions (with timing):**  
       - *"Weakness of will = impulsivity"*: **Head off at Step 1.** Stress akrasia requires a *judgment* (reasoned evaluation), not just impulse surrender.  
       - *"Hyperbolic discounting is irrational/normative"*: **Address at Step 2.** Explicitly state β-δ is *descriptive*; rationality debates come later.  
       - *"Present bias is excusable because universal"*: **Combat at Step 4.** Universality ≠ rationality (e.g., optical illusions are universal errors).  
       - *Unmentioned: "Regret implies akrasia"*: **Crush at Step 4.** Regret is diachronic; akrasia is synchronic. Sofa case proves they can decouple.  
       - *Unmentioned: "Better judgment = revealed preference at t=0"*: **Preempt at Step 2.** Philosophers’ "best judgment" is context-independent; economists’ utility is time-indexed.  
     - **Diagnostic Question (final 5 mins):**  
       *"In the sofa case, does the agent exhibit weakness of will at 8 p.m.? Give one reason why a philosopher would say no and an economist would say the question misses the point."*  
       - *Correct answer:*  
         - Philosopher: No—she acts on her best judgment *at 8 p.m.*.  
         - Economist: The question conflates normative judgment with revealed preference; the model explains *why* her preference reversed.  
     - **Refuse to Explain:**  
       - **Formal β-δ derivations:** Say: "We’re focusing on conceptual structure, not computational details."  
       - **Neuroscience:** Dismiss: "Mechanisms (e.g., dual-process theory) don’t resolve the normative/descriptive divide we’re examining."  
       - **Utility metaphysics:** Reject: "Whether utility is hedonic or revealed is orthogonal to the akrasia/present bias distinction."  

  ---

  ### **Why This Sequence Works**  
  - **Dependencies Honored:** Akrasia (Step 1) establishes the synchronic "better judgment" benchmark. Present bias (Step 2) then introduces time without equivocation. Sophistication (Step 3) leverages both. The sofa case (Step 4) becomes the crucible to separate them.  
  - **Sofa Case vs. Ulysses:** Ulysses resolves bias *prospectively*; the sofa case exposes *diachronic reversal without conflict*, making it ideal to isolate present bias from akrasia.  
  - **Misconceptions Targeted:** Corrections are embedded at the point where the misconception would likely arise (e.g., discounting’s descriptive nature when first introducing β-δ).  
  - **Stance Taken:** The traditions address distinct phenomena—akrasia is synchronic irrationality; present bias is diachronic preference reversal. They overlap only in sophistication debates, but even there, akrasia concerns *resisting* bias, while economics focuses *managing* it.  

  This plan forces the group to see that the economist’s "self-control problem" is not the philosopher’s "weakness of will"—unless akrasia occurs at the moment of action. The sofa case proves it.
