prompt: |-
  So I got into a long, slightly heated argument last night with a friend who's about to start a two-year postdoc and is trying to figure out what to actually work on. She's a formal epistemologist by training but has gotten really into the epistemic-democracy stuff — the idea that democratic decisions track the truth because of something like the Condorcet jury theorem: if every voter is independently better than a coin flip, the majority's probabilty of being right goes to one as you add more voters. I kept pressing her that the whole thing is basically a toy. It assumes independence, it assumes competence above a half, it assumes a fixed binary question with a fact of the matter, and real voters share newspapers, share training data, vote strategically, and deliberate with each other — which is supposedly the very thing that makes them independent in the first place. She pushed back that the interesting work is exactly in relaxing those assumptions: heterogeneous competences, correlated signals with a shared component, endogenous competence where deliberation shifts the competence parameter up or down, jury-theorem analogs for non-binary or continuous choices, and the whole gap between aggregating judgments versus aggregating preferences. We ended up disagreeing about which of those actually matters, and I don't think either of us was arguing in good faith by the end.

  Anyway, I'd rather give her a real answer than keep lobbing objections. If you had to prioritize the open questions in the Condorcet-jury-theorem / epistemic-democracy area for someone with two years, decent formal skills, and more taste for conceptual work than for number-crunching, which would you put at the top, and why? I care way more about the reasoning than the list: for each, is it upstream of other questions, is it tractable in two years by someone like her, has it been neglected, and — this is the part I most want — what actual result or development over the next couple years would move it up or down the ranking? Also tell me which of the questions people in this area treat as important are, in your view, overrated, because I have a suspicion a couple of them are basically settled or wouldn't change anything downstream even if you resolved them.

  And please be concrete about the trade-off between grinding on the formal machinery versus the interpretive side — like what it even means for a procedure to be "epistemically justified," whether the theorem is doing normative work or just describing a mechanism, whether "the crowd is smarter" is a claim about accuracy or about legitimacy. She's clearly torn between those two directions and I want to be able to say something actually useful instead of just poking holes in her thesis idea.
