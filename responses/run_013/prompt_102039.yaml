answer: |-
  Here’s a structured prioritization of open questions in epistemic democracy, tailored for your friend’s skills, timeline, and conceptual leanings. I’ll rank them by impact/tractability, flag overrated areas, and clarify the machinery/interpretation trade-offs. The goal is to target questions where progress would reshape the field’s foundations or bridge theory to real democratic deficits.

  ### Top 3 Priorities (Ranked)
  1. **Correlated Signals with Structural Realism**  
     - **Why it matters most**: Independence isn’t just violated randomly; it’s *systematically* broken by shared media ecosystems, algorithmic filtering, and social networks. This isn’t noise—it’s the core pathology of modern democracy. Current models treat correlation as exogenous (e.g., "add a correlation parameter"), but the key is *endogenizing* how informational structures (e.g., Twitter’s algorithm, polarized media) *generate* dependence.  
     - **Tractability**: Highly feasible. Build on existing network-based CJT extensions (e.g., Golub & Jackson 2010) but incorporate *strategic information sources* (e.g., media outlets optimizing for engagement). Use graph theory to model how beliefs correlate under selective exposure. Requires light simulation (not heavy empirics).  
     - **Neglected?**: Yes. Most work assumes fixed correlation or simple networks. Little integrates *strategic disinformation* or platform design.  
     - **What would move the needle**: A formal model showing that *even with average competence >0.5*, certain network structures make majority accuracy *worse* than a small group. This would force epistemic democrats to confront institutional design (e.g., regulation for diversity of exposure).  
     - **Downstream impact**: Upstream of deliberation models (which assume communication fixes bias) and policy debates on misinformation. Resolving this could kill or resurrect CJT’s relevance.

  2. **Endogenous Competence via Deliberation**  
     - **Why it matters**: Deliberation isn’t just about breaking independence—it *changes voter competence*. If talking together makes people *worse* (e.g., via groupthink), CJT collapses. Yet most models treat competence as static. Formalizing *how* deliberation updates individual competence (e.g., Bayesian peer learning vs. emotional contagion) is the missing link between CJT and deliberative democracy.  
     - **Tractability**: Doable in 2 years. Start with a minimal model: agents receive private signals, then adjust competences after sharing beliefs (e.g., competence increases if peers’ signals align, decreases in echo chambers). Use agent-based modeling or dynamic epistemic logic.  
     - **Neglected?**: Wildly understudied. The literature obsesses over breaking independence but ignores competence dynamics.  
     - **Key development**: A theorem showing deliberation’s *net epistemic effect* depends on initial disagreement levels. If low disagreement *lowers* competence (via conformity), it implies democracies need *structured conflict* (e.g., devil’s advocates). This would shift CJT from "more voters are better" to "better *kinds* of interactions are crucial."  
     - **Conceptual payoff**: Directly tackles "what makes democracy truth-conducive?"—merging formal tools with theories of democratic reason.

  3. **Heterogeneous Competence + Correlation with Partitions**  
     - **Why it matters**: Voters aren’t equally competent; they cluster by identity/class (e.g., farmers know farm policy, urbanites don’t). But when competence correlates with group membership (e.g., racial minorities understanding discrimination better), and groups share *internal* signals, majority outcomes can be biased even if average competence >0.5. This hits real issues of epistemic injustice.  
     - **Tractability**: Straightforward with her skills. Extend Ladha’s (1992) heterogeneous CJT by adding *group-correlated signals*. Use partition models to show how majority rule can silence high-competence minorities.  
     - **Neglected?**: Often hand-waved. Papers assume either heterogeneity *or* correlation—not their interaction.  
     - **Downstream result**: Prove that under group-correlated signals, "weighted voting" (by competence) may be *less* accurate than majority rule if weights misestimate competence. This would challenge technocratic alternatives to democracy.  
     - **Impact**: Upstream of representation debates (e.g., should marginalized groups get extra voice?). A formal win here would reshape "who counts" in epistemic democracy.

  ### Overrated Questions (Avoid or Deprioritize)
  - **Non-Binary/Continuous Choice Extensions**: Unless tied to correlation/competence dynamics, these often become math exercises. The CJT’s core insight—wisdom of crowds—is about *binary error reduction*. Continuous versions (e.g., mean vs. median) rarely reveal new *epistemic* truths; they’re aggregation theory.  
  - **Jury Theorems for Preference Aggregation**: If her interest is *epistemic* democracy (truth-tracking), this is a category error. Preferences ≠ judgments, and Arrow’s theorem already dominates that space. Likely a dead end.  
  - **Finer Independence-Relaxation**: Papers adding slight correlations (e.g., "voters 1 and 2 share a signal") without structural realism are incremental. The field needs fewer tweaks and more paradigm shifts.

  ### Navigating Machinery vs. Interpretation
  - **The Trade-off**: She doesn’t have to choose. A 2-year postdoc should start with a **formal core** (e.g., modeling deliberation’s competence effects) but **frame it interpretively**. Example: "Under what conditions does deliberation *epistemically justify* democratic outcomes?" This merges the how (machinery) with the why (normative force).  
  - **"Epistemically Justified" Clarity**: The term isn’t about legitimacy (*per se*), but whether a procedure *reliably tracks truth*. CJT’s normative work is conditional: *if* truth-tracking matters, and *if* CJT holds, majority rule is instrumentally valuable. But legitimacy requires more (e.g., procedural fairness). Your friend should flag this gap: CJT can’t bear the full weight of justifying democracy.  
  - **Concrete Advice**: In her project, she should explicitly state whether she’s:  
    a) **Describing a mechanism** (e.g., "deliberation boosts competence in context X"), or  
    b) **Arguing for normative conclusions** (e.g., "thus, democracies *ought* to structure deliberation in way Y").  
    The strongest work does both—e.g., "My model shows deliberation *can* amplify competence (mechanism), so institutions should foster cross-cutting exposure (normative)."  

  ### What to Tell Your Friend
  *"Prioritize modeling how real-world structures (media, social networks) create correlation that sabotages the CJT, or how deliberation dynamically alters competence. Both are high-leverage: they address fatal objections head-on, are tractable with your skills, and force the field to evolve beyond toy models. Skip extensions that don’t tackle correlation/competence dynamics—they’re overrated. And formally define ‘epistemic justification’ upfront: is it accuracy under ideal conditions, or robustness to pathological ones? That’ll prevent blind spots in your normative claims."*  

  This focuses her strengths where the field is thinnest, delivers concrete results in 2 years, and preempts "toy model" critiques by engaging democracy’s messiest truths. If she nails one of these, she redefines the debate.
