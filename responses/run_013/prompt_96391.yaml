answer: |-
  ## Fifteen Minutes in the Chamber's Shadow

  Chairman, Members of the Committee,

  For twenty-two years, I served the Department of Corrections. For seven of those years, I was the Warden of [Prison Name] State Penitentiary. That facility houses the state’s execution chamber. And in that capacity, I was the designated officer who supervised four executions.

  I’m not here today as a legal scholar. I’m not here as a philosopher. I’m here as the man who stood in that room, who oversaw the machinery of the ultimate sentence being carried out on behalf of this state. I saw it built, step by step, from the inside. And it’s that perspective – the shape of the thing itself – that I ask you to consider as you deliberate on this bill to replace the death penalty with life imprisonment without parole.

  You’ve heard arguments about deterrence. You’ve heard about innocence, about mercy, about the sanctity of life. Others will speak to racial disparities, to the practical difficulties of the drugs. My colleagues on this committee will do that work, and they’ll do it well. My testimony comes from a different place: from the concrete reality of how the state kills when it decides to kill deliberately, lawfully, and on schedule.

  Let me describe to you what that looks like.

  It begins with a date. Not a spontaneous act of rage or desperation, but a date entered on a calendar in an office. The condemned man lives with that date. He knows it. The officers assigned to the special housing unit know it. The chaplain knows it. I knew it. It hangs in the air for weeks, sometimes months. It’s a countdown to a meticulously planned event.

  The protocol is a loose-leaf binder, revised periodically. It sits on a shelf. You pull it down, and you follow the steps. It’s filled with precise instructions and careful euphemisms. "The subject." "The procedure." "Administration." Words chosen, I suppose, to create distance, to make the unthinkable manageable for the people tasked with carrying it out. But the words don't change the reality they describe.

  We rehearse. That’s right. We rehearse the execution. Staff – people who have no personal quarrel with the man on the table, who may have known him only as an inmate doing his time – they walk through the steps. They practice securing the man to the gurney. They practice the insertion of the IV lines – sometimes on a training mannequin, sometimes, chillingly, on each other in dry runs. They practice the sequence of injecting the chemicals. They practice the timing. They practice the pronouncement of death. They practice drawing the curtain – because yes, we now kill before dawn, hidden behind a thick curtain, away from any public witness. Who, after all, would be deterred by a spectacle they cannot see? The rehearsal is about eliminating error, ensuring a smooth, clinical procedure. It turns human beings into technicians performing a grim, state-sanctioned ritual.

  The chamber itself… it’s housed in a building that also contains the prison laundry. You walk past the industrial washers and dryers, the smell of detergent and heat, to reach the door. The proximity is jarring. The mundane machinery of daily life, right next to the machinery of death. It underscores the banality of the process we’ve constructed.

  On the day itself, it’s all about the schedule. Everything is timed to the minute. The last meal. The final visits. The spiritual advisor. The reading of the warrant. The walk down the corridor. Securing the man to the table. The IV team – often medical professionals whose oath is to preserve life – performing their assigned task. The witnesses seated, separated by glass. The warden – me – giving the signal. The chemicals flowing. The watching. The waiting. The doctor checking for a heartbeat. The pronouncement. The drawing of the curtain. The paperwork.

  It is cold. It is deliberate. It is stripped of passion, of anger, of the chaotic heat that defines the murders we see on the street or in our homes. The condemned man is not killed in a struggle, not in a moment of blind fury or fear. He is… processed. He is the object of an administrative procedure that has been planned, debated, budgeted for, and rehearsed.

  And here is what struck me most profoundly, after overseeing this four times: **The state, in meticulously arranging this killing on its own behalf, does something irrevocable to itself in the arranging.** It transforms itself. It becomes an entity that doesn't just *respond* to violence with force or incarceration, but one that deliberately, systematically, replicates the taking of a human life. It invests its authority, its resources, and its people in the business of premeditated killing. We build the apparatus. We train the personnel. We write the manuals. We schedule the deaths. We normalize it within our system.

  This isn't about the guilt or innocence of the men I oversaw. I have no evidence that any of the four were innocent, and that’s not my argument. This isn't about comparing the pain inflicted by the state to the immeasurable agony suffered by victims and their families – pain I have witnessed firsthand and cannot begin to diminish. Their loss is profound, permanent, and deserving of the deepest respect and the fullest measure of justice this system can deliver. Life imprisonment without parole *is* a profound measure of justice. It removes the offender from society forever. It acknowledges the gravity of the crime with the ultimate deprivation of liberty.

  My point is about what the state *becomes* when it adopts this particular method of delivering that justice. The death penalty requires the state to institutionalize killing. It requires us to create a permanent bureaucracy of death within our corrections system. It asks ordinary citizens – correctional officers, nurses, wardens – to participate in a ritualized taking of life that is fundamentally different in kind from any other act the state performs, including lawful self-defense or the inherent violence of incarceration. It asks us to rehearse it. To perfect it. To turn it into a procedure as routine, in its own awful way, as running the laundry next door.

  This transformation has consequences. It coarsens the institution. It places an indelible burden on the men and women tasked with carrying it out, burdens that last long after the curtain is drawn. And it implicates every citizen in a practice that is, at its core, a premeditated, state-administered killing – a practice conducted not in the heat of immediate necessity, but in the cold light of bureaucratic planning.

  There is a finality here unlike any other. We can release someone wrongly imprisoned. We can compensate them, attempt to rebuild what was broken. But the death penalty? It is the one sentence this state, or any state, cannot take back. Once that protocol is completed, once that pronouncement is made, there is no undo. The machinery, once set in motion, grinds only forward.

  Chairman, Members, I stand before you not to confess, but to report. To tell you what I saw, what I did, and what the doing revealed about the nature of this punishment. The death penalty isn't just a severe sentence; it’s a *different kind* of act by the state. It demands the state embody a calculated, rehearsed violence that stands apart from the chaotic violence it seeks to condemn. It asks the state, and all of us through it, to be deliberate killers.

  Life imprisonment without parole is severe. It is final in terms of liberty. It protects society completely. And it allows the state to administer justice – harsh, permanent justice – without crossing that threshold into the cold, institutionalized replication of killing. It allows the state to punish without becoming what it punishes.

  I urge you to pass this bill. Not out of pity for the condemned, though that may exist. Not solely out of sanctity, though that is a principle. But because the practice itself – the machinery we build, the rehearsals we conduct, the dates we set, the irreversible step we take – changes who we are as a state. It makes us something colder, something stranger, and ultimately, something diminished.

  Thank you. I yield my time.
