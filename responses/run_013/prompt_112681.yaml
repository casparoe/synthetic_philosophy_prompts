prompt: |-
  I teach a 90-minute seminar session on strategic rationality to sixteen graduate students in philosophy; they are fluent with Nash equilibrium but have not seen a case where a strategy is eliminated only by a mixed strategy. I want a runnable in-class activity that makes them feel the force of iterated elimination of strictly dominated strategies, rather than merely hearing the definition. The spine of the activity should be the following symmetric two-player game, with the payoff matrix shown; because the matrix is symmetric, both players face the same payoffs:

          A    B    C
  A      22   20    0
  B      20    0    2
  C       0    2    1

  The structure is deliberate. No pure strategy is strictly dominated at the outset. C is strictly dominated by a mixture of A and B: for instance, the mixture 1/4 on A and 3/4 on B yields 20.5 against A, 5 against B, and 1.5 against C, all strictly greater than C's payoffs of 0, 2, and 1. Once C is eliminated, A strictly dominates B, since A yields 22 against A and 20 against B whilst B yields 20 and 0. A is the sole survivor. The activity must lead participants to discover this themselves, round by round, without the facilitator naming dominance, mixed strategies, or iterated elimination until the debrief. They should have to commit to choices, see the consequences, and then be asked to eliminate strategies on grounds of rationality. Include a physical or procedural way for them to use mixed strategies—cards, dice, tokens, a randomising device—because the central lesson is that a mixed strategy can do eliminative work that no pure strategy can.

  Design the activity. Specify materials, group sizes and roles, rules, a payoff scheme that does not use real money, and a timeline for the 90 minutes. The debrief must map each phase onto the formal idea: strict dominance, mixed strategies, the order of elimination, common knowledge of rationality, and the gap between a strategy's being eliminated and its being irrational in some broader sense. Also tell me what will predictably go wrong the first time I run it and how to handle it, and be frank about one feature of the formal idea that the activity cannot reproduce and that I must supply in the debrief. Answer in no more than 1,000 words. Begin with a single-sentence statement of the activity's core mechanic, then give the rest under these headings: Materials; Rules and Roles; Timeline; Debrief; What Will Go Wrong First Time; What the Activity Cannot Reproduce.
reasoning: |-
  We are going to run an iterative elimination activity using a symmetric game. The core mechanic is: students play the game repeatedly in pairs, using mixed strategies via a random device, and after each round they collectively eliminate strategies that are clearly inferior based on the outcomes.

  Materials:
  - One deck of cards per pair of students (or per student if they are acting as one player). Each deck should contain 4 cards: one Ace (to represent A), and three 2s (to represent B). This corresponds to the mixture 1/4 A and 3/4 B. Alternatively, if using dice, provide one four-sided die per player (or a virtual die if physical dice are unavailable) where rolling 1 corresponds to A and 2-4 correspond to B. For the first phase, we are going to test the mixture that dominates C. 
  - Alternatively, to allow for any mixture, provide a way to generate a random number (e.g., a spinner, a deck with different numbers of cards, or a phone app). But for simplicity, we start with the fixed mixture that dominates C (1/4 A, 3/4 B). 
  - Score sheets for each player to record their choices and payoffs. 
  - Whiteboard or projector to record the elimination process and current strategies in play.
  - The payoff matrix (provided) on a handout and displayed.

  Rules and Roles:
  - The activity is for 16 students. They will form 8 pairs. Each pair plays the game for multiple rounds. 
  - In the first round, all three strategies (A, B, C) are available. 
  - Each player independently chooses a strategy by either:
      a) Playing a pure strategy (A, B, or C) OR 
      b) Playing a mixed strategy by using the randomizing device. For the mixed strategy, we will initially suggest the mixture that we know dominates C (1/4 A and 3/4 B) but we do not tell them that. We just say: "You can use the random device to mix A and B. For instance, with the deck, drawing one card: if Ace, play A; if 2, play B. Then reshuffle." They are free to choose any mixture, but we will encourage them to try mixing if they wish.
  - After each round, each player records their own strategy (pure or mixed) and the outcome (their payoff). 
  - We then collect the data from all pairs and compute the average payoff for each strategy (or for each pure strategy and the mixed strategy we are testing) against the strategies played in the population. 
  - Then, we ask: "Looking at the outcomes, are there any strategies that always did worse than some other strategy or mix? Can we eliminate any strategy as being clearly irrational?" 
  - The goal is to lead them to see that C is dominated by the mix of A and B. We then eliminate C. 
  - In the next round, only A and B are available. Now they play again (with the same pairs) but without C. They can play pure A, pure B, or mix (but note that after elimination, we are in a 2x2 game). We expect that A will dominate B. 
  - After playing, we collect data and eliminate B. 
  - Then, the only strategy left is A. 

  Timeline (90 minutes total):
  1. Introduction (10 minutes): 
     - Explain the game: symmetric, two-player, one-shot. 
     - Show the payoff matrix. 
     - Explain that they will play in pairs and that they can choose a pure strategy (A, B, C) or use a random device to mix two strategies (e.g., mix A and B in any proportion they wish, but we will provide a specific device for 1/4 A and 3/4 B as an example). 
     - Emphasize that the goal is to maximize their own payoff. 
     - Assign pairs (8 pairs).

  2. Round 1 (15 minutes): 
     - Players choose their strategies (either pure or mixed) and record their choices. 
     - They play against their partner (each pair plays one game). 
     - Collect the choices and payoffs from all pairs. 
     - On the board, make a table showing for each strategy (A, B, C, and the mixed strategy we are focusing on) what payoffs it got against what. 
     - Ask: "Did any strategy always lose? Or is there a strategy that, no matter what the opponent did, was beaten by some other strategy or mix?" 
     - Guide the discussion to note that C never got a high payoff and that the mixed strategy (1/4 A, 3/4 B) did better than C in every matchup? Actually, we need to compare the mixed strategy's performance against each opponent's action. We can show: 
          Against A: mixed gets (1/4)*22 + (3/4)*20 = 5.5 + 15 = 20.5 > 0 (which is what C gets against A)
          Against B: mixed gets (1/4)*20 + (3/4)*0 = 5 + 0 = 5 > 2 (C against B)
          Against C: mixed gets (1/4)*0 + (3/4)*2 = 0 + 1.5 = 1.5 > 1 (C against C)
     - But note: we may not have observed all these matchups. So we may need to simulate or reason hypothetically. 
     - Alternatively, we can run multiple rounds with random rematching? But time is short. Instead, we can use the data to see that C is underperforming and then reason with the matrix. 
     - We decide: after the first round, we use the data to see that C is getting low payoffs and then we show with the matrix that no matter what the opponent does, the mixed strategy beats C. 
     - Eliminate C.

  3. Round 2 (10 minutes): 
     - Now only A and B are available. 
     - They play again (in the same pairs) using only A and B (or mixtures of them). 
     - Collect the data. 
     - On the board, show the payoffs: 
          A vs A: 22, A vs B: 20
          B vs A: 20, B vs B: 0
     - Ask: "Is there a strategy that is always beaten by the other?" 
     - They should see that B gets at most 20 (if the opponent plays A) but if the opponent plays B, it gets 0. Meanwhile, A gets 22 against A and 20 against B. So A always does at least as well as B and strictly better in some cases. 
     - Eliminate B.

  4. Round 3 (5 minutes): 
     - Only A is available. They all play A and get 22. 

  5. Debrief (50 minutes): 
     - We break down the process: 
          Phase 1: Elimination of C. 
              - Why? Because there was a mixed strategy (A and B with probabilities 1/4 and 3/4) that strictly dominates C. 
              - Definition: a strategy is strictly dominated if there exists another strategy (pure or mixed) that yields a strictly higher payoff against every possible strategy of the opponent. 
              - Note: no pure strategy dominates C. This is why we needed mixed strategies. 
          Phase 2: Elimination of B. 
              - Why? Because after C is eliminated, we have a new game. In this game, A strictly dominates B (in the pure sense). 
          Phase 3: Only A survives. 
     - The order matters: we could not eliminate B first because in the original game, B is not dominated by A (since against C, B gets 2 and A gets 0). 
     - Common knowledge of rationality: we assumed that all players are rational and will not play a dominated strategy. Moreover, they know that others are rational, and so on. This is why we can iteratively eliminate. 
     - The gap: elimination does not mean that a strategy is never played. It means that a rational player will not play it. In the original game, C is not dominated by any pure strategy and might seem tempting (e.g., against B it gives 2, which is more than A gives against B, which is 0). But the mixed strategy shows that a rational player can do better than C without knowing the opponent's move. 
     - Also note: the mixed strategy that we used is not the only one that dominates C. Any mixture that puts at least 1/11 on A and the rest on B? Actually, let's compute: 
          We require: 
              p * 22 + (1-p) * 20 > 0   [against A]  => 22p + 20(1-p) = 20 + 2p > 0 (always true for p>=0)
              p * 20 + (1-p) * 0 > 2   [against B]  => 20p > 2 => p > 0.1
              p * 0 + (1-p) * 2 > 1   [against C]  => 2(1-p) > 1 => 1-p > 0.5 => p < 0.5
          So any p in (0.1, 0.5) would work. We used p=0.25 which is in that interval.

  What Will Go Wrong First Time:
  - Students may not understand how to use the mixed strategy device. They might avoid it and stick to pure strategies. Then we might not see the domination of C by the mix. 
    - How to handle: Encourage them to try the random device. You might say: "Some of you might want to try a random mix of A and B. We have provided a way to do that (the deck of 4 cards: 1 A, 3 B). Try it and see how it does compared to C." 
  - In the first round, if no one plays C, then we don't have data on C. 
    - How to handle: Assign at least one pair to play C? Or, if necessary, you can have a confederate or you can ask one pair to try C. Alternatively, use hypothetical reasoning: "Suppose someone played C, how would it do against the strategies we saw?" 
  - The data might be noisy. For example, if a player using C happens to meet an opponent playing B, then C gets 2, which might look okay. 
    - How to handle: We need to look at the worst-case and best-case. Use the matrix to supplement the data. The key is to show that against every opponent move, the mixed strategy does better. So we can compute the expected payoffs for C and for the mixed strategy against each opponent move. 
  - Students might not want to eliminate a strategy because "it worked for me once." 
    - How to handle: Emphasize rationality: a rational player would not choose a strategy that is always beaten by another, regardless of what the opponent does. 

  What the Activity Cannot Reproduce:
  - The activity cannot perfectly reproduce the theoretical assumption of common knowledge of rationality and the iterative reasoning that occurs in the mind of a player. In the activity, we are guiding the elimination step-by-step as a group. But in the standard model, each player, knowing that everyone is rational, can perform all the eliminations in their head without having to play multiple rounds. Therefore, in the debrief, you must explain that the activity is a simulation of the iterative reasoning process, but in reality, the entire elimination can be done a priori by rational players who know the game structure and the rationality of others.
answer: |-
  ### Core Mechanic
  Students play a symmetric two-player game in pairs, using randomizing devices to implement mixed strategies, and iteratively eliminate strategies that are "outperformed" based on empirical payoff comparisons and group discussion, without formal terminology.

  ---

  ### Materials
  - **Game handouts**: 16 copies of the payoff matrix.
  - **Randomizing devices**: 16 bags each containing 4 tokens (1 red for *A*, 3 blue for *B*) to simulate the 1/4 *A* + 3/4 *B* mixture. *Alternative*: Dice (e.g., d4: roll 1 → *A*, 2–4 → *B*).
  - **Scorecards**: For recording choices/payoffs per round.
  - **Whiteboard**: Track eliminated strategies and group reasoning.
  - **Timer**: For pacing rounds and discussions.

  ---

  ### Rules and Roles
  **Group Setup**:  
  - 16 students → 8 pairs.  
  - **Roles**: Both players in a pair choose actions simultaneously each round.  

  **Procedure**:  
  1. **Round 1 (All strategies: *A*, *B*, *C*)**  
     - Players choose *A*, *B*, *C*, **or** use their token bag/dice to play the *A*+*B* mix.  
     - After playing, pairs record payoffs (e.g., if P1 plays *A* and P2 plays mix, P1’s payoff is 22 if P2 drew *A* (prob. 1/4) or 20 if *B* (prob. 3/4)).  
     - **Key question**: *"Which strategy never won or consistently underperformed? Should we remove any?"*  
     - Goal: Students observe *C*’s payoffs (0, 2, 1) are beaten by the mix’s expected payoffs (20.5, 5, 1.5) and eliminate *C*.  

  2. **Round 2 (Only *A* and *B*)**  
     - Players choose *A*, *B*, or mix (now equivalent to pure *B*).  
     - **Key question**: *"If your opponent avoids C, which strategy is riskier now?"*  
     - Goal: Students see *A*’s payoffs (22 vs. *A*, 20 vs. *B*) dominate *B*’s (20 vs. *A*, 0 vs. *B*) → eliminate *B*.  

  3. **Round 3 (Only *A*)**  
     - All play *A* → payoff 22.  

  **Payoff Scheme**: Use "points" (not money). Highest scorer "wins" bragging rights; focus on comparative performance.  

  ---

  ### Timeline (90 min)  
  1. **Intro (10 min)**: Explain rules, matrix, and token use. Emphasize: "Your goal is to earn the most points."  
  2. **Round 1 (20 min)**: Play (5 min), record payoffs (5 min), group discussion to eliminate *C* (10 min).  
  3. **Round 2 (15 min)**: Play (5 min), record (5 min), discussion to eliminate *B* (5 min).  
  4. **Round 3 (5 min)**: All play *A*.  
  5. **Debrief (40 min)**: Formalize insights (see below).  

  ---

  ### Debrief  
  Map phases to theory:  
  1. **Eliminating *C* (Mixed Domination)**:  
     - *C* was eliminated by a **mixed strategy** (1/4 *A* + 3/4 *B*), not a pure one.  
     - **Lesson**: Mixed strategies can dominate pure ones even when no pure strategy does.  
  2. **Eliminating *B* (Pure Domination)**:  
     - After *C* is removed, *A* **strictly dominates** *B* in the reduced game.  
  3. **Order Matters**:  
     - *B* couldn’t be eliminated first because against *C*, *B* (payoff 2) beats *A* (0).  
  4. **Common Knowledge of Rationality**:  
     - Elimination relied on all players recognizing others won’t play dominated strategies.  
  5. **The Gap**:  
     - A strategy eliminated in iteration *n* isn’t "irrational" in isolation (e.g., *B* is strong against *C*), but rational players avoid it *anticipating* others’ rationality.  

  ---

  ### What Will Go Wrong First Time  
  **Problem**: Students may resist eliminating *C* in Round 1.  
  - **Why**: *C* yields 2 against *B* (beating *A*’s 0), making it seem viable.  
  - **Fix**: Compare *C*’s max payoff (2) to the mix’s *minimum expected payoff* (1.5 vs. *C* or 5 vs. *B*). Ask: *"Would a rational player choose C if a mix guarantees more even in the worst case?"*  

  ---

  ### What the Activity Cannot Reproduce  
  **Theoretical Gap**: The activity cannot perfectly replicate **common knowledge of rationality** at infinite depth.  
  - **Why**: Students eliminate strategies *observationally* (after seeing payoffs), not through purely deductive reasoning.  
  - **Debrief Supplement**: Explain that formal IESDS assumes players deduce domination *a priori* using only rationality and the matrix—no empirical trials needed. Highlight that "seeing is believing" in the activity mirrors deeper epistemic conditions (e.g., iterated knowledge of rationality).
