  ## Subthreshold Environmental Hyper-Responsivity Syndrome (SEHRS) – Draft Criteria for DSM-6 (March 15, 2039)

  **Work Group Note:** Proposed for inclusion under "Neurodevelopmental Disorders." Significant debate over Criterion D (social withdrawal as core vs. consequence) and Criterion F (specificity of sensory triggers). Duration threshold (Criterion A) revised downward from 6 to 3 months during internal review. Distress/Impairment (Criterion G) deemed essential anchor.

  **A.** Persistent, heightened subjective experience of environmental stimuli (e.g., auditory, visual, olfactory, tactile, atmospheric pressure changes) as overwhelming or aversive, present for at least 3 months.
  **B.** At least three of the following physiological concomitants occurring frequently in response to triggering stimuli:
      1. Perceived cognitive "fog" or slowed processing.
      2. Muscular tension or tremors, not better explained by exertion.
      3. Autonomic symptoms (e.g., palpitations, transient lightheadedness, temperature dysregulation).
      4. Gastrointestinal discomfort (e.g., nausea, abdominal cramping).
  **C.** Active efforts to anticipate, monitor, or avoid environments perceived as potentially triggering, exceeding simple preference.
  **D.** Observable reduction in spontaneous social engagement or participation in previously enjoyed activities, specifically linked to stimulus avoidance (Work Group Debate: Core Feature?).
  **E.** Symptoms are not attributable to the direct physiological effects of a substance (e.g., caffeine, medication) or another medical condition (e.g., migraine disorder, autoimmune condition).
  **F.** Triggers are non-painful environmental stimuli commonly tolerated by the general population (e.g., fluorescent lighting, moderate crowd noise, specific fabric textures, common scents like perfumes or cleaning products). (Work Group Debate: Specificity vs. Overbreadth).
  **G.** The symptoms cause clinically significant distress or impairment in social, occupational, or other important areas of functioning.
  **H.** The disturbance is not better explained by symptoms of another mental disorder (e.g., Generalized Anxiety Disorder, Autism Spectrum Disorder, Panic Disorder, PTSD).

  ---

  **Clinical Notes – Dr. Eleanor Vance, PsyD**
  **Patient:** Maya Rodriguez (32, F, Artist/Graphic Designer) | **Initial Intake: April 12, 2039**
  *   **Presenting Concerns:** Chronic fatigue, "brain fog," increasing anxiety in public/crowded spaces (esp. grocery stores, public transit). Reports feeling constantly "jangled" by environment. Mentions difficulty focusing on work, irritability. History of childhood sensory sensitivities ("hated tags in shirts, loud noises") but managed well until ~18 months ago following a stressful project deadline and move to new apartment near busier street. Denies overt panic attacks. Sleep hygiene "okay." Mood self-reports as "low-grade miserable, not depressed-depressed." GAD ruled out per assessment? Explore ASD traits? Screen for thyroid? Primary care cleared organic causes. Focus initial Tx on anxiety management, stress reduction, behavioral activation. Schedule f/u 4 weeks.

  **Follow-Up: May 10, 2039**
  *   Progress minimal. Anxiety coping strategies (breathing, mindfulness) "feel pointless when the overhead lights feel like drills." Describes visceral recoil from smells in elevator lobby, "like my skin is crawling." Mentions starting to avoid lunchroom at work due to "too much chatter and microwave smells." Increased isolation noted. Discussed potential sensory processing component. Patient receptive. Suggested gradual exposure exercises *cautiously*. Awaiting insurance pre-auth for neuropsych eval re: possible ASD. Patient mentioned reading online about "sensory overload disorders." Gentle reminder re: self-diagnosis pitfalls.

  **Follow-Up: June 7, 2039**
  *   Patient brought printed copy of *DSM-6 Draft – SEHRS Criteria*. "This... this feels like me. Especially the fog and the avoiding things." Reports actively comparing experiences to criteria B1, B2, B3, F. Notes her avoidance (C, D) and distress (G). "It's validating, but scary." Explored her identification with the criteria. Emphasized draft status. Neuro eval scheduled (August). Focus shifted to managing distress *around* identification and maintaining function. Discussed pacing strategies for work. Patient experimenting with noise-canceling headphones constantly.

  **Follow-Up: August 30, 2039**
  *   Neuropsych results: Elevated sensory sensitivity scores, subthreshold on ASD measures ("not meeting full criteria, but clear sensory/attentional differences"). Patient now actively uses "SEHRS" term. Reports joining online forum ("EnvHyperResponsives Connect"). Found community, but also increased focus on symptoms. Notes forum discussions dissecting draft criteria, esp. debate on Criterion D. Patient developed novel coping strategy: wearing a snug, weighted vest at home ("feels like it grounds the jittery feeling"). Insurance *denied* coverage for ongoing therapy citing "experimental/not formally recognized diagnosis" (SEHRS draft cited). Significant distress. Appealing. Discussed distress re: limbo status. Weighted vest appears genuinely helpful. Documenting.

  **Follow-Up: December 12, 2039**
  *   Insurance appeal failed. Patient using forum resources, self-guided strategies. Reports "tracking triggers" obsessively via app. Weighted vest use now extends to short trips outside ("under my coat, just knowing it's there helps buffer the street noise"). Mood fluctuates with perceived symptom control. Notes increased identification with Criterion D: "I *am* withdrawing because I *have* to, it's core, not just a side effect." Forum discussions heavily focused on "physiological grounding" techniques. Patient functioning minimally at work, avoids most social events. Therapeutic focus on acceptance, harm reduction, maintaining basic function. Discuss potential medication consult for anxiety component? Patient ambivalent.

  ---

  **Maya's Journal – CloudNotes File**
  **April 5, 2039:** Another week feeling like I’m wrapped in static. That grocery store trip today… the fluorescents hummed right into my skull, the freezer aisle felt like an assault. Came home shaky, nauseous (B3? B4? that Dr. Vance mentioned?). Just sat in the dark for an hour. Brain feels full of wet cotton (Fog? B1?). Why can’t I just *handle* normal life? It’s just LIGHT and NOISE. Ugh.

  **May 15, 2039:** Found it. The draft thing. SEHRS. Read it. And read it again. "Heightened subjective experience… overwhelming…" YES. The cognitive fog (B1!), the tension (B2!), the palpitations near the printers at work (B3!). "Active efforts to anticipate…" – me planning my entire day around avoiding the crowded bus or the loud cafés (C!). "Reduction in social engagement" (D…). Stopped going to book club last month. Too much chatter, perfume. It’s not anxiety ABOUT the place, it’s the PLACE ITSELF hurting me (F!). It has a NAME. It’s not just me being broken.

  **June 20, 2039:** Joined EnvHyperResponsives. So many people describing the *exact* things. Like reading my own thoughts. The debate about Criterion D – is withdrawal core? Hell yes it is! Staying home in soft clothes with low light isn’t hiding, it’s necessary armor. Found a tip about deep pressure. Dug out that old weighted lap pad from college. Tried it wrapped around my shoulders like a vest while working. Felt… calmer? Less like I was vibrating apart. Maybe just placebo. But the jittery feeling in my arms (B2?) eased a bit.

  **August 5, 2039:** Neuro doc says "sensory sensitivities" but not ASD. Fine. Whatever. Doesn’t change the SEHRS fit. The vest helps. Bought a proper weighted one. Wear it under my hoodie at home. It’s like a hug that stops the world from poking me so hard. Forum buzzing about "grounding techniques." Pressure is a big one. Someone called it "physiological anchoring." Sounds fancy. But yeah. It anchors me. Less fog (B1?) when I wear it. Tried it briefly walking to the corner store. Felt less exposed. Like the noise and glare bounced off the weight.

  **October 10, 2039:** Insurance denial upheld. "Condition not recognized." Thanks for the distress and impairment, jerks (G, check!). Stuck. Therapy too expensive out of pocket. Forum is lifeline. And the vest. Wore it under my coat to a quiet coffee shop meet with Priya. Felt manageable. Almost normal? Still had to leave after an hour – the espresso machine whine started grating – but lasted longer. Posted about it. Others trying vests/weighted layers now. Calling it "pressure buffering." It WORKS. Why isn’t this in the criteria? Coping is survival.

  **January 8, 2040:** HOLY SHIT. The revised SEHRS draft dropped today. Forum is exploding. They CHANGED it! Look:
  **(Revised Draft Criterion B, Addendum):** *Emerging reports suggest potential benefit from proprioceptive or deep pressure input (e.g., weighted garments, firm compression) in modulating symptom intensity for some individuals. Further research needed.*
  They SAW! They saw us talking, trying things! They *noticed* the pressure buffering! It’s in the freaking manual draft! Okay, it’s tiny, it’s "emerging," "some individuals," but it’s THERE. Proof the loop is real. They’re watching us figure ourselves out and writing it down. Is that good? Bad? I feel… seen. And weirdly exposed. Need to check the app – did my baseline ambient noise threshold shift down again since starting the vest? Gotta track. The new D criterion still sucks though. Withdrawal IS core. *Posts screenshot of revised B addendum to forum thread titled "WE DID IT! Pressure Buffering Gets a Nod!" Scores herself mentally: B1 (mild), B2 (mod w/ vest), B3 (mod in triggers), C (severe), D (severe), F (yes), G (hell yes).* Need to sketch… maybe avatars for us forum folks, little figures wrapped in soft, weighted light. While monitoring my own breathing. Is that tremor back?
