prompt: |-
  I run the conservation lab at a mid-size museum and I keep having the same argument with our curators: after a treatment, is the thing on the plinth still the same artwork? I've been poking around the philosophy of material constitution (statue and clay, all that) and it clearly bears on this, but I can't hand my technicians a journal article. So give me a procedure we can actually run before we approve a treatment. It has to keep three things separate: the material the object is made of, the form it has, and its causal history, meaning who made it, when, and what's happened to it since. In order: what to ask, what counts as a sufficient answer to each, where the procedure stops with a hard no because the treatment would amount to making a new object, and where it hands the decision to a person because it's a values question and not a factual one. Then run it on three cases: stripping later overpaint off a wooden figure to get back to the original surface; replacing a lost hand with new wood carved to match; and melting down a corroded bronze to recast it in the original mold from the same metal, or the even worse idea of 3D-scanning it and printing a resin copy and calling that the artwork. Take a definite stand, where the procedure yields an answer give the answer and defend it, even when it's the one the donor will hate. Plain prose only, no headings, no bullets, no tables, like an email to a colleague. And be honest about which steps are just judgment calls wearing a lab coat.
reasoning: |-
  Okay, the user runs a conservation lab and is dealing with a persistent debate with curators about whether an artwork remains the same after treatment. They've looked into the philosophy of material constitution but need a practical procedure that separates material, form, and causal history. They want a clear process with questions, sufficient answers, hard stops, and judgment calls, applied to three specific cases.

  First, I need to understand the core issue: identity through conservation. The user mentioned the statue/clay problem, which is about whether an object is defined by its matter or form. This is key to structuring the procedure. The three components—material, form, and causal history—must be addressed distinctly in the questions.

  The user's explicit request is for a procedure that can be used before treatments. But deeper needs include resolving conflicts with curators, ensuring ethical consistency, and having defensible standards for the team. They might also want to prevent donor disputes by having objective criteria, even if unpopular.

  For the procedure, I'll outline questions for each component: material, form, and causal history. Each needs criteria for sufficient answers, hard stops (where treatment creates a new object), and gray areas requiring human judgment. Hard stops should be based on irreparable breaches, like replacing all original material or altering the creator's intent beyond recognition. Judgment calls might involve significance of additions or aesthetic value.

  Applying this to the three cases:
  1. Removing overpaint: Original material intact, form restored, causal history preserved. No hard stop; judgment on whether overpaint is part of history.
  2. Replacing a hand: Material altered (new wood), but form matched. If original maker's intent is honored, it might be acceptable. No hard stop if partial; judgment on extent and significance.
  3. Melting bronze/recasting: Total material replacement, form replicated. This breaches material continuity hard stop—new object. Resin copy is even clearer: no original material, not the same artwork.

  I need to be firm on case 3, even if donors dislike it, emphasizing that artwork identity isn't just appearance. For judgment areas, like overpaint, I'll suggest involving curators for historical context.

  Finally, I'll present this plainly, as an email, avoiding jargon. Acknowledge where steps are subjective (e.g., evaluating significance) to maintain transparency. This balances philosophy with practicality, addressing the user's need for a usable framework while respecting art's intangible aspects.
answer: |-
  Here’s a procedure we can implement, grounded in those three pillars (material, form, causal history). It’s designed to flag critical thresholds and isolate judgment calls. We run this checklist *before* finalizing any treatment proposal. For each question, technicians/cons staff must document answers and evidence.

  **The Procedure:**

  1.  **Material Continuity:** "Does the treatment retain a significant portion of the original material *in situ*, carrying its physical history (ageing, wear, original tool marks, etc.)?"  
      *   **Sufficient Answer:** Yes, if ≥ 50% (by volume/mass/significance – see below) of the *structurally or aesthetically critical* original material remains intact *and* integrated after treatment. Minor losses filled, surface cleaned, but core substance is original.  
      *   **Hard Stop:** **NO** if treatment involves *replacing* >50% of the original material *or* completely dissolving/reconstituting the original material (e.g., melting metal, dissolving and re-precipitating cellulose). This creates a *new material object*.  
      *   **Judgment Call:** Defining "significant portion" and "structurally/aesthetically critical." Is 40% of a sculpture's original wood in the core enough if the rest is restored? Is the original ground layer under repaint "critical"? This requires conservator/curator discussion on the object's specific material essence.

  2.  **Form Continuity:** "Does the treatment preserve or recover the artist's intended form (shape, composition, design) without introducing significant new form *not* derived from secure evidence of the original?"  
      *   **Sufficient Answer:** Yes, if the final form aligns with verifiable evidence (artist documentation, contemporary records, technical analysis revealing original state) *or* involves minimal, reversible infill of losses based on that evidence.  
      *   **Hard Stop:** **NO** if treatment *creates* a fundamentally new form not intended by the artist or implied by the work's context (e.g., turning a fragment into a complete but invented shape, drastically altering composition beyond recovery of the original).  
      *   **Judgment Call:** Assessing "artist's intent" (especially for older/cultural objects), defining "secure evidence" (Is a single old photo enough for major reconstruction?), and "minimal" infill. Deciding *how much* conjecture is acceptable in reconstruction.

  3.  **Causal History Continuity:** "Does the treatment preserve the object's chain of being – its creation by the maker, its historical existence, and the evidence of its past – without falsifying it?"  
      *   **Sufficient Answer:** Yes, if the object's provenance and the physical evidence of its age, use, and past interventions (even if removed/stabilized) remain legible *or* are meticulously documented. Treatment doesn't erase history but clarifies the original within it.  
      *   **Hard Stop:** **NO** if treatment *obliterates* the original creator's hand (e.g., complete recasting, total repainting) *or* fabricates a false history (e.g., artificially ageing new material to deceive, presenting a replica as the original object).  
      *   **Judgment Call:** Weighing the significance of later additions (Are they historically important?). Deciding *which* historical state to present (original? peak significance?). Balancing preservation of past interventions vs. recovery of original state.

  **Decision Flow:**
  *   **Any "Hard Stop = NO" from 1, 2, or 3:** Treatment is rejected as creating a new object. We don't proceed with that approach. (*This is the "donor will hate it" firewall*).
  *   **All "Sufficient Answer = Yes":** Treatment is acceptable (philosophically/materially) – proceed to technical/ethical review.
  *   **"Judgment Call" flagged in any area:** Conservator and Lead Curator *must* convene. They explicitly debate the flagged issue(s), document their reasoning (invoking historical significance, artist intent, collection policy, etc.), and reach a consensus decision. Director/ethics committee referral if needed.

  **Applied to the Cases:**

  1.  **Stripping Later Overpaint off Wooden Figure:**
      *   **Material:** Original wood surface (tool marks, ageing) is revealed/recovered. *Significant original material retained?* **Yes.** (Hard Stop Cleared).
      *   **Form:** Recovers the original carved form intended by the artist. *Original form recovered?* **Yes.** (Hard Stop Cleared).
      *   **Causal History:** Removes a later addition. The *act* of removal becomes part of the history. *Original creation/history preserved/legible?* **Yes** (Original surface revealed, overpaint documented). *However...* **Judgment Call:** Was the overpaint historically significant (e.g., ritual use, period style)? Discuss with curator: If yes, *partial* retention or meticulous documentation becomes crucial. If deemed insignificant, proceed. **No Hard Stop. Acceptable treatment** (pending technical feasibility), likely after curator/conservator agrees on overpaint's significance.

  2.  **Replacing Lost Hand with New Wood Carved to Match:**
      *   **Material:** Original material (body) retained. New wood added. *Significant original material retained?* **Yes** (Assuming the body is >50% original). (Hard Stop Cleared).
      *   **Form:** New hand replicates the *known/intended* form (based on evidence). *Original form recovered?* **Yes.** (Hard Stop Cleared).
      *   **Causal History:** Original body is intact. Loss is evident. New hand is clearly new material. *History preserved/falsified?* **Yes** (Original creation evident, loss evident, restoration documented and discernible). **Judgment Call:** How much conjecture is involved in the hand's form? Is the join overly disruptive? Can the new material be made visually distinct enough? Discuss conservator/curator: Aim for minimal conjecture, discernibility, documentation. **No Hard Stop. Acceptable treatment** if executed ethically (discernible, documented, evidence-based).

  3.  **Melting Down Corroded Bronze & Recasting (Original Mold/Same Metal):**
      *   **Material:** **NO.** Original metal is completely destroyed (melted), its specific physical history (crystallization, corrosion layers, micro-wear) obliterated. New casting, even from same alloy, is a *new material object*. **HARD STOP.** Unacceptable. It's a replica, not the original artwork. The chain of physical being is broken.
      *   *(Form: Original form recovered? Likely Yes. Causal History: Original creation obliterated, new creation event. Also NO - but Material Hard Stop alone kills it).*
      *   **3D Scan & Resin Print Called the Artwork:**
      *   **Material:** **NO.** Zero original material retained. Entirely new substance. **HARD STOP.** Unacceptable as a replacement for the original artwork. It's a replica/digital surrogate.
      *   **Form:** Yes, replicated. **Causal History:** Original object scanned becomes part of *its* history. The resin print has a *new* creation history (digital, printed on X date). Presenting it *as the original artwork* falsifies history. **HARD STOP** on both Material and Causal History. Unacceptable.

  **The Stand:**

  The melted/recast bronze and the resin copy presented as "the artwork" are **new objects**. Philosophically, they fail the material continuity test catastrophically. The original artwork, as a unique physical entity with its own history locked into its material, ceases to exist in those processes. We can make replicas for study or display (clearly labeled as such!), but they cannot ethically replace or be called the original artwork in our collection records or display. Telling a donor we won't melt their precious corroded Rodin isn't about being difficult; it's about preserving the actual *thing* Rodin's foundry cast, handled, and that survived to tell its own story in its metal. We preserve the artifact, not just the idea.

  **Where the Lab Coat Gets Thin:**

  *   Defining "significant" original material (Question 1 Judgment) is inherently subjective and object-specific. A tiny fragment of a sacred relic might be "significant," while 60% of a mass-produced ceramic might not be.
  *   Interpreting "artist's intent" (Question 2) for long-dead creators or culturally different contexts requires scholarship and, often, informed guesswork.
  *   Valuing historical additions vs. original state (Question 3 Judgment) is a museum values decision – is the object valued for its pristine origin or its lived history?

  This procedure forces us to confront these questions systematically, isolates the absolute deal-breakers (the Hard Stops), and clearly flags where we need to have those tough curatorial conversations (the Judgment Calls). It turns the philosophical debate into actionable conservation policy. Let's test-drive it on the next contentious proposal.

  Best,  
  [Your Name/Conservation Lab Head]
