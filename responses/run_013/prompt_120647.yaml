answer: |-
  ### Decision Tree: Is Your Individual Action Wrong in Cases of Collective Harm?

  **Starting Point**: You accept that (1) the collective harm is serious, and (2) no identifiable victim would be better off had *you* acted differently (e.g., no specific person benefits if you turn off your porch light).  
  **Goal**: Determine if *your individual action* (e.g., one flight, one burger) is morally wrong.  

  ---

  #### **Node 1: Imperceptible vs. Replaceable Harm**  
  **Case A**: You leave your porch light on, adding imperceptible light pollution that degrades an observatory’s data. Turning it off reduces total pollution by a tiny, continuous amount.  
  **Case B**: You decline a flight seat for ethical reasons, but the airline sells it to someone else. Total emissions are unchanged.  
  **Question**: Does your action reduce harm in either case?  
  - **1 → Node 2** (Harm reduction in Case A only).  
  - **2 → Node 7** (No harm reduction in either).  

  #### **Node 2: Actual Difference vs. General Rule**  
  **Case**: You buy a heavier car for safety. It emits more CO₂ and makes roads slightly more dangerous for others. If everyone does this, aggregate harm increases.  
  **Question**: Is buying the car wrong because:  
  - **A**: It directly increases expected harm (tiny emissions/danger added by your car)?  
  - **B**: If everyone did it, outcomes would be worse?  
  **Choose A or B**:  
  - **A → Node 3** (Focus on actual difference).  
  - **B → Leaf E** (Rule/practice-oriented view).  

  #### **Node 3: Threshold Sensitivity**  
  **Case**: A lake is harmed if total fertilizer runoff exceeds 100 units. Each of 1,000 farms contributes 0.1 units. Current total: 99.9 units. Your runoff (0.1 units) pushes it to 100.  
  **Question**: If your runoff *alone* doesn’t cross 100 (e.g., you contribute 0.05 units when total is 99.96), is it wrong?  
  - **Yes → Leaf C** (Expected harm view).  
  - **No → Leaf B** (Threshold view).  

  #### **Node 4: Net Harm After Offset**  
  **Case**: You buy a carbon offset for your flight, neutralizing its emissions.  
  **Question**: Is flying still wrong?  
  - **Yes → Node 5** (Wrong beyond net harm).  
  - **No → Leaf I** (Netting out suffices).  

  #### **Node 5: Complicity vs. Collective Duty**  
  **Case**: You take the flight seat *with* offset (net harm: zero).  
  **Question**: If wrong, is it because:  
  - **A**: You endorse a harmful system (complicity)?  
  - **B**: You should focus on changing norms, not individual neutrality?  
  **Choose A or B**:  
  - **A → Leaf D** (Complicity view).  
  - **B → Leaf F** (Collective duty view).  

  #### **Node 6: Over-Compliance and Fairness**  
  **Case**: Your household cuts CO₂ emissions 50% below your "fair share," while neighbors exceed theirs. Your sacrifice effectively subsidizes their excess.  
  **Question**: Are neighbors obligated to compensate you?  
  - **Yes → Leaf G** (Over-compliance obligates compensation).  
  - **No → Node 8** (No obligation).  

  #### **Node 7: Participation Without Difference**  
  **Case**: You take the flight seat knowing it will be sold anyway (harm unchanged).  
  **Question**: Is taking the seat wrong?  
  - **Yes → Node 5** (Wrong beyond difference-making).  
  - **No → Node 6** (Not wrong due to no difference).  

  #### **Node 8: Person vs. Act (Attribution Split)**  
  **Case**: Two people turn off porch lights. One campaigns for dark-sky laws; the other does nothing extra. Both reduce harm identically.  
  **Question**: Is the *act* of turning off the light equally right for both, even if the *persons* differ?  
  - **Yes → Leaf A** (Not wrong due to no difference).  
  - **No → Node 9** (Act and person decoupled).  

  #### **Node 9: The Confusion Check**  
  **Case**: In all preceding cases, does "individual wrongness" feel coherent?  
  **Question**: Can an act be wrong solely for collective-harm contributions?  
  - **Yes → Leaf A** (Not wrong due to no difference).  
  - **No → Leaf H** (Conceptually confused view).  

  ---

  ### Leaves (Positions)  
  1. **Leaf A: No Difference, Not Wrong**  
     - Central claim: Your action isn’t wrong because it changes nothing (e.g., flight seat resold).  
     - Awkward commitment: Defends benign self-interest in systems where harms persist unchanged.  

  2. **Leaf B: Threshold View**  
     - Central claim: Wrong only if your act (with others) crosses a harm threshold (e.g., lake runoff).  
     - Awkward commitment: Permits acts that collectively enable harm, as long as no threshold is crossed.  

  3. **Leaf C: Expected Harm View**  
     - Central claim: Wrong due to tiny increase in expected harm (e.g., porch light; heavy car emissions).  
     - Awkward commitment: Blames you for microscopic, non-identifiable contributions.  

  4. **Leaf D: Complicity View**  
     - Central claim: Wrong because you endorse a harmful practice, regardless of causal impact (e.g., flying with offset).  
     - Awkward commitment: Condemns acts with neutral/positive outcomes if they "support" a bad system.  

  5. **Leaf E: Rule/Practice-Oriented View**  
     - Central claim: Wrong if the practice (if universalized) would be harmful (e.g., everyone buying heavy cars).  
     - Awkward commitment: Condemns harmless acts that *would* be harmful if widespread.  

  6. **Leaf F: Collective Duty View**  
     - Central claim: Your duty is to fix the system, not abstain (e.g., fly but lobby for carbon taxes).  
     - Awkward commitment: Allows participation in harm if you "balance" it with activism.  

  7. **Leaf G: Over-Compliance Obliges Compensation**  
     - Central claim: Over-compliance (e.g., deep emissions cuts) entitles you to compensation from under-compilers.  
     - Awkward commitment: Turns ethical restraint into a transactional burden on others.  

  8. **Leaf H: Conceptually Confused View**  
     - Central claim: "Individual wrongness" is incoherent for collective harm; focus on groups, not atoms.  
     - Awkward commitment: Dismisses intuitive moral scrutiny of individual acts.  

  9. **Leaf I: Netting Out Suffices**  
     - Central claim: Offsets negate harm, so the act isn’t wrong (e.g., carbon-neutral flight).  
     - Awkward commitment: Lets payments absolve participation in harmful systems.  

  ---

  ### Unoccupied Combinations & Gaps  
  - **Node 4 → "No" + Node 6 → "Yes"**: No position holds that offsets negate harm *and* over-compliance requires compensation. *Diagnosis*: Coherent but repellent—offsets erase obligations, making compensation claims inconsistent.  
  - **Leaf C vs. Leaf I**: Both acknowledge tiny differences, but Leaf I exempts offset acts. *Unseparated pair*: Add a question: *"Does buying an offset transform a harmful act into a neutral one?"* (Yes → Leaf I; No → Leaf C).  
  - **Node 8 → "No" + Node 9 → "Yes"**: Incoherent—if acts/persons are decoupled, the concept isn’t confused. *Diagnosis*: Unexplored; might bridge complicity and person-focused views.  

  ### New Cases Invented for Gaps  
  1. **Voting Dilemma**: You vote for a climate policy that passes by 1 million votes. Your single vote changed nothing. *Tests*: Node 1 (no difference) vs. Node 5 (complicity/collective duty).  
  2. **Safety Investment**: You install a home air filter, reducing your pollution exposure. If all neighbors do it, aggregate emissions rise (due to energy use). *Tests*: Node 2 (actual difference vs. rule) and Node 6 (over-compliance).  
  3. **Water Rationing**: During a drought, you use 10% less water than your allotment. The saved water is used by a neighbor for a pool. *Tests*: Node 6 (compensation) and Node 8 (act vs. person).  

  ### Act/Person Separation  
  - **Node 8** isolates views evaluating the *act* (e.g., turning off lights) from the *person* (e.g., campaigning).  
  - **Example**: Leaf A evaluates acts solely on difference-making; Leaf D judges acts for symbolic complicity, regardless of the person’s other deeds.  

  ---  
  **Tree Logic**: Branches first separate difference-making (Nodes 1–3), then non-causal factors (Nodes 4–5), fairness (Nodes 6–8), and conceptual coherence (Node 9). Cases force choices without requiring prior philosophical alignment.
