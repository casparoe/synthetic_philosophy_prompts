prompt: |-
  Trying to get my own view straight before a seminar and I want a consistency check rather than a summary, so here's the package. (1) Lewis's analysis of convention is basically right: a convention is an arbitrary regularity in behaviour that persists because everyone expects the others to conform and prefers to conform given that they do. (2) Conventions are the right model for social norms generally, including the ones that feel moral — promise-keeping, queueing, which side of the road we drive on. (3) Those norms are the product of evolutionary processes — imitation, reinforcement, trial and error in a population over time — with no designer and no one ever having worked out the reasoning. (4) What makes something a convention rather than just a good idea is that the alternative was equally available; the arbitrariness is the essential bit, not a side note.

  Where does this actually come apart? I've got a nagging sense that (1) and (3) can't both be the whole story, since Lewis seems to need people to hold fairly rich mutual expectations of each other and evolution doesn't obviously hand you those, but I can't tell if that's a real problem or just a gap I could paper over. And I half-suspect (2) and (4) are fighting, because the norms that feel least arbitrary — the ones people will die for — are exactly the ones I'm most tempted to say are more than conventions. There might also be something wrong with (2) on its own: a convention is something you follow because others do, but a moral norm is supposed to grip you even when defecting would pay.

  Don't just reassure me that it all hangs together. If something has to go, say which, and rank the tensions by how bad they are rather than listing them as equally bad — and tell me which ones only look like tensions. If I've misstated Lewis anywhere, push back on that before anything else.
reasoning: |-
  Okay, the user is preparing for a seminar and wants a consistency check on their understanding of conventions and social norms, primarily based on David Lewis's work. They've laid out four key points and have specific concerns about tensions between them. Let me start by recalling Lewis's analysis of convention. Lewis defines convention as an arbitrary regularity that persists because of mutual expectations and preferences. The user's points seem to align with this, but they're worried about conflicts.

  First, the user mentions that Lewis's model requires rich mutual expectations (point 1), but evolutionary processes (point 3) might not generate those. That's a valid point. Lewis does rely on common knowledge and recursive expectations, which are cognitively demanding. If norms evolve through imitation or reinforcement without individuals forming complex beliefs, how does that fit? Maybe the user is concerned that evolution can produce behaviors that look like conventions without the mental states Lewis requires. I should highlight that this tension is real but maybe resolvable by showing how evolution can scaffold cognitive processes over time.

  Next, points 2 and 4 clash. The user feels that moral norms (like promise-keeping) seem non-arbitrary, unlike conventions which are arbitrary by definition. But if conventions are arbitrary, how can moral norms be conventions? The user might be struggling with the intuition that some norms feel inherently right, not just socially contingent. They might worry that reducing moral norms to conventions undermines their normative force. Here, distinguishing between the origin (arbitrary) and the current perceived necessity could help. Also, Lewis's later work suggests that some conventions can become moralized, which addresses this tension partially.

  Point 2 alone might be problematic because moral norms are supposed to bind even when defection pays, whereas conventions rely on mutual compliance. The user is right; Lewis's model is about preference given others' compliance, not unconditional obligation. This is a real limitation. The user might need to acknowledge that some norms transcend conventional explanations, pointing to internalization or moral realism.

  I should also check if the user misstated Lewis. For point 4, Lewis does emphasize arbitrariness, but alternatives don't need to be perfectly symmetric. The user's phrasing is close, but clarifying that near-equivalence suffices might help. Also, in point 3, Lewis allows for some reasoning, not just evolution without cognition. Correcting these prevents misinterpretation in the seminar.

  Prioritizing tensions: The biggest issue is the mismatch between Lewis's cognitive demands and evolutionary explanations (1 vs 3). Next is the conflict between arbitrariness and moral norms' perceived necessity (2 vs 4). The binding force of moral norms vs. conventional incentives (point 2 alone) is also critical but perhaps addressable by supplementary mechanisms.

  The user's deeper needs: They want to present a coherent argument but anticipate objections. They might need to defend against critiques during the seminar, so highlighting where their synthesis holds and where it requires additional support is crucial. They might also seek strategies to address these tensions, like incorporating complementary theories (e.g., Binmore for evolution, internalization for moral norms). Ensuring they don't oversimplify Lewis while acknowledging the model's limits would strengthen their position.
answer: |-
  You're right to feel tension – this is a coherent but contestable package that pushes Lewis in an evolutionary direction where some seams show. Here's a breakdown of the tensions, ranked by severity, where they bite, and where your statement might need tweaking regarding Lewis:

  1.  **The Biggest Problem: (1) vs. (3) - The Cognitive Demands of Lewis vs. Evolutionary Mindlessness**
      *   **The Tension:** This is the most significant and legitimate tension. **Lewis absolutely requires rich cognitive states: common knowledge (or at least iterated expectations) of the regularity, the preferences, and the conditional preferences ("I prefer to conform *because* I expect others to conform and prefer them to conform").** Evolutionary processes like imitation, reinforcement, and trial-and-error (3) can produce *behaviors* that *look like* conventions *without* requiring agents to hold these sophisticated mutual expectations. Agents might simply copy successful behaviours, avoid punishment, or respond to immediate reinforcement signals without forming the complex "I expect that they expect that I expect..." structure Lewis posits.
      *   **Why it's Bad:** It strikes at the core mechanism. If the evolutionary process generates the regularity *without* the specific cognitive mutual expectations Lewis identifies as *constitutive*, then (3) isn't just explaining *how* conventions *arise* under Lewis's definition; it's potentially offering an *alternative account* of the phenomenon that bypasses the cognitive requirements of (1). Your "nagging sense" is spot-on.
      *   **Can it be Papered Over?** Partially, but not seamlessly. Proponents argue evolution *scaffolds* cognition. Simple reinforcement can bootstrap more complex expectations over time. Once a regularity exists, agents *develop* expectations about it. Lewis himself acknowledged conventions can arise without initial common knowledge via precedent or salience. However, the purest evolutionary models (blind imitation, simple reinforcement learners) struggle to generate *genuine Lewisian conventions* as defined in (1) at the outset. The tension remains between the *explanans* (evolution) and the *explanandum* (Lewis's cognitively rich definition).

  2.  **Significant Tension: (2) vs. (4) - The "Moral Feel" vs. Arbitrariness**
      *   **The Tension:** You identify this correctly. Lewisian conventions are *arbitrary* (4). There must be an alternative that could have served just as well. Yet, norms like promise-keeping or prohibitions against murder *feel* necessary, non-arbitrary, and grounded in something deeper than mere coordination. People *do* die for them, and crucially, they often feel binding even in situations where defection *would* pay and others *aren't* conforming (e.g., resisting an unjust regime alone).
      *   **Why it's Bad:** It challenges the scope of (2). If a "social norm" feels categorically binding and non-arbitrary, insisting it's *just* a Lewisian convention seems reductive. The "grip" seems different. Lewisian conformity is *conditional* ("I conform if others do"). Moral norms often feel *unconditional* ("I *must* conform, *even if* others don't and I could benefit from defecting").
      *   **Is it Fatal?** Lewisians have responses, but they require stretching:
          *   **Moralization:** Conventions *become* moralized over time through internalization, punishment, and cultural evolution. The *origin* was arbitrary, but the *current force* feels necessary.
          *   **High Stakes Coordination:** Some moral norms coordinate incredibly high-stakes interactions (e.g., violence avoidance). The cost of breakdown is so catastrophic that adherence feels non-negotiable, *even if* alternatives were conceivable.
          *   **Network Effects:** A norm might be arbitrary *in isolation*, but embedded in a dense network of other norms and institutions, defection becomes unthinkably costly or incoherent, *making it feel* non-arbitrary.
      *   **The Catch:** These explanations often sneak in elements *beyond* pure Lewisian convention (internalized sanctions, perceived intrinsic wrongness, network dependence) to account for the "moral feel," implicitly acknowledging the tension. Point (2) as stated ("conventions are the right model *for social norms generally*") overreaches for the strongest moral norms. Lewis's model struggles with norms that demand sacrifice *without* the expectation of reciprocal conformity.

  3.  **Tension Within (2): The Binding Force Problem (Your "grip you even when defecting would pay")**
      *   **The Tension:** This is a specific instance of the (2) vs. (4) tension but deserves its own mention because it directly challenges the core Lewisian preference structure. Lewis defines convention by a preference to conform *conditional* on others conforming. A norm that compels you to conform *even when defection would pay and others are defecting* does not fit this structure. This "unconditional grip" is characteristic of many moral norms.
      *   **Why it's Problematic:** It suggests that for core moral norms, the Lewisian preference structure ("I prefer to conform *iff* others do") is inadequate. The motivation seems internalized, deontological, or based on principle, not conditional reciprocity.
      *   **Relation to Other Tensions:** This is essentially the core of why (2) struggles with strong moral norms, feeding directly into the (2) vs. (4) tension. It highlights the gap between coordination-based explanations and obligation-based phenomena.

  4.  **Minor Tension/Potential Misstatement: (4) Arbitrariness as "Equally Available"**
      *   **The Issue:** Lewis emphasizes arbitrariness, but his definition is subtle. He requires that there is *another possible regularity R'* that could have been a convention instead, *and* that people believe this, *and* that R' could have served the coordination purpose *about as well*. It's not that the alternatives were always *perfectly symmetric* or *equally available* at every moment in evolutionary time. Evolutionary paths can lock in sub-optimal conventions.
      *   **Why it's Minor:** Your phrasing ("equally available") is close enough for many purposes. The core point – that the convention isn't uniquely determined by rationality or efficiency alone, that history matters, and that an alternative *could* have worked – is Lewisian. Just be precise: it's about conceivable functional alternatives, not necessarily perfectly symmetric or frictionless switching. This doesn't undermine your package significantly.

  **Ranking the Tensions by Severity:**

  1.  **(1) vs. (3): Cognitive Demands vs. Evolutionary Processes.** This is fundamental. Does the evolutionary account actually produce Lewisian conventions, or something else that merely resembles them? This is the hardest to reconcile fully.
  2.  **(2) vs. (4) & The Binding Force Problem within (2): Moral Feel/Unconditional Grip vs. Arbitrariness/Conditionality.** This limits the scope of (2), making it hard to claim conventions are the *right model* for *all* social norms, especially the most deeply moral ones. Reducing strong moral norms to mere arbitrariness feels deeply counterintuitive and requires significant auxiliary hypotheses.
  3.  **Minor Adjustment to (4):** Clarifying "arbitrariness" is a nuance, not a major flaw in your package.

  **Where Your Lewis is Slightly Off (Before anything else):**

  *   **On (3):** Lewis *does* allow for conventions to arise without explicit reasoning or design, often through precedent, salience, or gradual evolution (he cites Schelling and evolutionary game theory precursors). He doesn't require "anyone ever having worked out the reasoning." So (3) isn't *opposed* to Lewis, but the *mechanism* of evolution (imitation, reinforcement) needs to be shown capable of generating the *cognitive states* Lewis requires (point 1 tension).
  *   **On (4):** As above, arbitrariness is key, but "equally available" needs careful handling. Lewis requires a *conceivable alternative that could have solved the coordination problem*, not necessarily that it was always equally accessible or optimal.

  **Conclusion: What Has to Give?**

  *   **The hardest tension (1 vs 3):** To fully embrace a "mindless" evolutionary account (3), you likely need to **modify (1)**. You might need a *less cognitively demanding* definition of convention, perhaps one focused on behavioural regularities sustained by evolutionary pressures (imitation, punishment) without requiring full-blown Lewisian mutual expectations. (Think more Robert Boyd & Peter Richerson or Ken Binmore). Alternatively, you need to argue that evolution robustly *produces* agents with the requisite cognitive capacities for Lewisian expectations *in these contexts*.
  *   **The scope tension (2):** You need to **qualify (2)**. Lewisian conventions are a powerful model for *many* social norms, especially coordination norms (driving side, queueing, language). However, claiming it's the "*right model for social norms generally*," especially encompassing the strongest *moral* norms that feel non-arbitrary and bind unconditionally, is unsustainable. Acknowledge that deeply moralized norms likely involve additional mechanisms (internalization, sacred values, deontological reasoning) layered on top of, or sometimes replacing, the core conditional preference structure of pure convention. Lewis provides a crucial *part* of the story for many norms, but likely not the *whole* story for all.

  Your package is internally coherent *if* you accept that evolution can generate Lewisian cognition and that moral norms are *just* highly salient, high-stakes conventions. The tensions arise because these are significant "ifs". The seminar will likely probe these very points. Acknowledge the tensions, defend the core insights, but be prepared to refine the scope and mechanisms.
