prompt: |-
  I retired from a chemistry department about six years ago and since then I've been doing a kind of self-directed philosophy degree, mostly reading and sitting in on a reading group that meets above the bookshop on Thursdays. In March its my turn to lead, and I've picked risk-weighted expected utility — Lara Buchak's thing, from her 2013 book Risk and Rationality. Eight people, all comfortable with probability (two retired engineers, one actuary), none of them have done any decision theory. Fifty minutes with a whiteboard, but I've been told I have to leave room for arguing, so call it thirty-five minutes of explaining.

  Don't explain REU to me, I've read the book. Plan how I should teach it. What has to be in place before the risk function even makes sense — my hunch is they first need to see expected utility as weighting the gaps between ranked outcomes by cumulative probabilities rather than weighting the outcomes themselves, but I don't know if that's the right first brick or if it should come later. What single case should carry the whole thing, and what does it need? I want them to feel the rank-dependence in their bones — that the same 20% slice of probability counts for more or less depending on what sits above it — and I suspect a three-outcome case does that better than the Allais matrix everyone reaches for, but you tell me. The misconceptions: I'm already worried about three. One, that r is just a distortion of each probability on its own, rather than something that depends on where the outcome sits in the ranking. Two, that risk-averse and risk-seeking are the only two settings, when I gather r can be convex in one stretch and concave in another. Three, that this is a descriptive theory of how people actually choose rather than a claim about what's rational. Where in the sequence does each get planted, and where do I head it off? What question do I put to the room at the end that would tell me whether they've got it, rather than whether they can recite the formula? And what should I openly refuse to cover in thirty-five minutes — I assume the representation theorem, but maybe I'm wrong about that. One more thing: the actuary will ask, inside the first five minutes, how this differs from rank-dependent utility, and I don't have a crisp answer. Whatever order you give me, make sure that answer falls out of it naturally instead of being bolted on at the end.
reasoning: |-
  Okay, let me tackle this user's query. He's a retired chemistry professor preparing to lead a philosophy reading group on Buchak's REU theory. His audience is technically literate but new to decision theory. He needs a 35-minute teaching plan that prioritizes conceptual clarity over formalism.

  Hmm... his core challenge is making rank-dependence intuitive. That "weighting gaps" insight he mentioned is crucial - it's the key difference from EU. I recall Buchak's analogy of probability weights as liquids in interconnected chambers. Maybe start with outcomes physically ranked on a board to visualize cumulative probability?

  For the actuary's inevitable RDU question: REU is actually a normative subset of RDU where the weighting function has specific rationality constraints. Should introduce this when comparing EU/REU calculations. The three-outcome gamble (0/20k/100k) seems perfect for demonstration - shows how identical probability slices get weighted differently based on position.

  Biggest pitfalls to address: 
  First, that r(p) isn't a simple probability distortion - must emphasize its dependence on outcome ranking. 
  Second, risk attitudes aren't binary - a single r-function can have convex and concave portions. 
  Third, clarifying this is prescriptive (rational choice) not descriptive.

  For assessment: Instead of formula recitation, pose a choice paradox where EU and REU diverge. Ask them to sketch how risk weights would apply. Should reveal if they grasp rank-dependence viscerally.

  What to cut? Definitely the representation theorem. Also avoid stochastic dominance proofs. Stay focused on the core mechanic - maybe sacrifice even the Allais paradox to maintain simplicity.

  The flow should be: 
  1) EU refresh via cumulative lens 
  2) Three-outcome case exposing EU's limitation 
  3) REU as gap-weighting solution 
  4) r-function mechanics 
  5) Normative claims 
  6) RDU distinction emerging naturally from the framework

  Final check: Does this let the actuary's question answer itself? Yes - when we show REU's specific r(p) properties versus general RDU, the difference becomes self-evident.
answer: |-
  Here’s a battle-tested 35-minute teaching plan focused on **conceptual intuition**, leveraging your group’s quantitative fluency while sidestepping common traps. The goal is to make rank-dependence undeniable and distinguish REU as a *normative* tool.

  ---

  ### **The Plan: 7 Steps (35 min)**
  **Whiteboard Setup:** Draw a vertical outcome axis (low to high) and a horizontal probability axis. Keep \(r(p)\) undefined initially.

  1.  **Reset EU: Cumulative Weighting (5 min)**
      *   *Question:* "How does EU *really* aggregate probabilities & outcomes? If I offer you a gamble, do you weigh each outcome in isolation?"
      *   *Demo:* Use a **3-outcome gamble**: \(G = (0.4, \$0; 0.4, \$20k; 0.2, \$100k)\). Rank outcomes: **\$0 (worst) < \$20k < \$100k (best)**.
      *   *EU Calculation:*  
          \(EU = p(\$0) \cdot u(\$0) + p(\$20k) \cdot u(\$20k) + p(\$100k) \cdot u(\$100k)\)  
          *Emphasize:* Each outcome gets its "own" probability slice. The *ordering* doesn’t affect the math.
      *   *Pivot to Cumulative:*  
          "But is the *fear* of \$0 the same if it comes from a 40% chance alone vs. a 40% chance atop a potential \$100k? EU says yes. Let's question that."

  2.  **Reveal EU’s Blind Spot: The "Position" of Probability (5 min)**
      *   *Introduce Gamble G':* Same outcomes, different probs: \(G' = (0.2, \$0; 0.4, \$20k; 0.4, \$100k)\).
      *   *EU(G) vs. EU(G'):* Calculate both. *They differ only by the swap between p(\$0) and p(\$100k).* EU cares about *which outcome* has which prob, but *not* about the position of a probability *within the cumulative distribution*.
      *   *Key Insight:* "EU weights *outcomes*. What if rational agents weight the *gaps between outcomes* based on their rank? The dread of falling from \$20k to \$0 might feel different if you were *almost* at \$100k vs. if \$20k was your ceiling."

  3.  **Introduce REU Intuitively: Weighting the Gaps (10 min)**
      *   *Visual:* Draw the cumulative distribution for **G**:
          *   Bottom 40%: \$0 → Gap: \$0 to \$20k
          *   Next 40%: \$20k → Gap: \$20k to \$100k (but you only get \$20k! See next point)
          *   Top 20%: \$100k
      *   *The Gap Idea:* "REU says: The *value* added by moving up a rank isn't weighted by the prob of the *higher* outcome alone. It’s weighted by a function of the **cumulative prob down to and including that gap**."
      *   *Define r(p) Naturally:* "The risk function \(r(p)\) transforms the *cumulative probability* associated with reaching a given outcome or worse. It tells us how much weight to give the *gap* from that outcome to the next better one."
      *   *REU Calculation (for G):*  
          `REU = u(\$0) + r(p(≥ \$20k)) * [u(\$20k) - u(\$0)] + r(p(≥ \$100k)) * [u(\$100k) - u(\$20k)]`  
          Where:  
          `p(≥ \$20k) = 0.6` (Prob of \$20k or better)  
          `p(≥ \$100k) = 0.2` (Prob of \$100k)
      *   *Crucial Contrast:* Show the same 20% probability slice (`p(≥\$100k)=0.2`):
          *   In **G**, it weights the gap from \$20k to \$100k.
          *   In **G'**, `p(≥\$100k)=0.4` – same gap, but now weighted by `r(0.4)`! *The weight depends on the cumulative probability attached to that gap’s starting point.*

  4.  **r(p) Demystified: It’s About Rank, Not Distortion (5 min)**
      *   *Address Misconception 1 Head-On:* "r(p) is **NOT** distorting the probability of *each outcome in isolation* (like Prospect Theory's π(p)). It distorts the *cumulative probability relevant for a specific gap*, which depends entirely on the outcome's *rank*."
      *   *Visual Proof:* Use **G** and **G'**. Point to the 20% probability of \$100k.
          *   In **G**, it contributes `r(0.2) * [u(100k)-u(20k)]`
          *   In **G'**, it contributes `r(0.4) * [u(100k)-u(20k)]` → *Same outcome prob, different weight because of its rank position!*
      *   *Actuary's Answer (RDU):* **"REU *is* a specific type of Rank-Dependent Utility (RDU)! Buchak argues her r(p) reflects a rational *attitude towards risk* itself, not just a descriptive weighting. RDU is the broader framework; REU is a normative proposal within it using a specific r(p)."** (This flows naturally from the gap-weighting mechanism).

  5.  **Risk Attitude ≠ Global (3 min)**
      *   *Address Misconception 2:* Draw a possible r(p) curve: concave for low p (risk-averse weighting of best-case gaps), linear for mid p, convex for high p (risk-seeking weighting of avoiding worst-case gaps).
      *   *State Clearly:* "r(p) can have different shapes in different regions. An agent can be risk-averse for small chances of big wins *and* risk-seeking to avoid near-certain losses, with a single r(p). 'Risk-averse' usually means r(p) < p for all p; but REU allows much richer attitudes."

  6.  **Normative, Not Descriptive (2 min)**
      *   *Address Misconception 3:* "Buchak isn't just *describing* Allais paradox choices. She argues EU is *rationally* flawed for ignoring rank, and REU provides a *rational alternative*. It’s a proposal for how a thoughtful agent *should* weigh risks when outcomes matter in context."

  7.  **The Litmus Test Question (5 min)**
      *   *Pose:* "Imagine two gambles with the *same* outcomes: (\$10, \$100, \$1000). Gamble A: (0.5, \$10; 0.3, \$100; 0.2, \$1000). Gamble B: (0.7, \$10; 0.2, \$100; 0.1, \$1000). An REU maximizer with r(p) = p² (risk-averse weighting) prefers A. *Why intuitively? Where does the key difference lie?*"
      *   *Answer You Want:* They should identify the **position of the probability mass shifting towards worse outcomes in B**. Specifically:
          *   The gap from \$10 to \$100 is weighted by `r(p(≥\$100))`.
          *   In A, `p(≥\$100) = 0.5` → Weight = `r(0.5) = 0.25`
          *   In B, `p(≥\$100) = 0.3` → Weight = `r(0.3) = 0.09`
          *   The *much lower weight* on the first major gap (\$10→\$100) in B hurts it significantly for this risk-averse r(p), despite having identical outcome probabilities to A for \$100 and \$1000. The "middle" outcome (\$100) is *effectively* riskier in B because it sits *lower* in the cumulative distribution.

  ---

  ### **What to Explicitly Jettison**
  1.  **The Representation Theorem:** Absolutely out. Mention its existence ("Buchak proves you can derive REU from axioms"), but zero details.
  2.  **General r(p) Properties:** Don't dive into continuity, range, etc. Stick to "it's a function mapping [0,1]→[0,1]".
  3.  **Proofs of Stochastic Dominance:** Too technical. Handwave: "Buchak shows REU respects appropriate dominance."
  4.  **The Allais Paradox (Initially):** Your 3-outcome gambles are better for isolating rank-dependence. *Maybe* show Allais rapidly at the end as a famous example REU handles, if time permits.
  5.  **Formal Axiomatics:** No mention of Comonotonicity, etc.

  ---

  ### **Why This Works**
  *   **Leverages Strength:** Uses their comfort with probability/calculations immediately.
  *   **Core Insight First:** "Weighting gaps by distorted cumulative probability" is the *first* brick after the EU refresher.
  *   **Visual & Concrete:** The 3-outcome gamble + cumulative distro on the board makes rank dependence visceral.
  *   **Misconceptions Pre-Empted:** Each major pitfall is addressed head-on *where the concept arises naturally*.
  *   **Actuary's Question:** Answered seamlessly within the core explanation of the REU mechanic (Step 4).
  *   **Test Question:** Probes deep understanding (why rank matters for gap weights), not formula recall.

  You’ll know they get it if, during the test question, someone starts talking about the position of the \$100 outcome in the cumulative distribution before doing any math. Good luck – it’s a fantastic topic for a group like this!
