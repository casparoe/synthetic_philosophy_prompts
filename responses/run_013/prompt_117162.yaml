answer: |-
  Below is your Q&A prep sheet, ordered by threat level (likelihood × severity), with replies calibrated to the room. I’ve noted soft spots/bluffs, concessions, and critical defences. British English adhered to throughout.

  ---

  ### **Q&A PREP SHEET**  
  **Core Weakness to Protect:** The threshold *must not* be reduced to risk aversion. If this falls, the paper collapses.  
  **Concession for Goodwill:** Yield early to the Kantian on "credences feeling alien" to deontology—costs little, builds rapport.  
  **Dreaded Unasked Question:** *"Why not model this as a bargaining problem with credences as bargaining weights? Your 'parliament' is just the Nash solution with veto players."* (If raised, concede parallels but stress incompleteness of bargaining frameworks for capturing moral exclusion—bluff that "dynamic stability" isn’t your focus.)  

  ---

  ### **1. Decision Theorist (Imprecise Probability)**  
  **Objection (as they’d phrase it):** "This is just ambiguity aversion masquerading as novelty. My representation theorem shows your ‘veto threshold’ collapses to a concave transformation of choice-worthiness under imprecise credences. Why reinvent the wheel?"  
  **Reply (1.5 mins):**  
  "No—it’s not ambiguity aversion in disguise. Ambiguity models handle *epistemic* uncertainty over outcomes; here, the uncertainty is *moral*, and the threshold acts as a structural firewall, not a curvature in utility. Your theorem likely assumes a common cardinal scale ex ante, which I reject. My veto condition blocks *incommensurable harms* (e.g., trading basic interests for trivial gains) that ambiguity frameworks would ‘price in’ via smooth functions. The discontinuity is the point: it’s not about aversion to ignorance, but refusal to permit certain exchanges full stop."  
  **Soft Spot?** Bluff that representation theorems *require* cardinal comparability. If pressed, admit: "Your approach might *approximate* mine, but at the cost of forcing intertheoretic comparisons I deem inadmissible."  

  ### **2. Moral Realist**  
  **Objection:** "Credences in moral theories are incoherent. You can’t have 0.3 ‘belief’ that utilitarianism is true—moral facts aren’t probabilistic. This entire project is category trash."  
  **Reply (2 mins):**  
  "Granted, if moral realism is true, credences might seem odd. But we’re in the realm of *decision-making under moral uncertainty*, not ontology. Even if moral facts are binary, *my epistemic access* isn’t—I weigh theories based on plausibility. Think of it as credences over *interpretations* of the moral landscape. Your objection targets the input, not my aggregation mechanism. If we discard credences, we’re back to dogmatism or paralysis."  
  **Soft Spot?** Concede this is philosophically contentious but redirect: "For this model, take credences as given—they’re the currency of the literature I’m engaging."  

  ### **3. Kantian Ethicist**  
  **Objection:** "Assigning probabilities to moral theories is a category error. Deontology isn’t a ‘hypothesis’ to be believed with 20% confidence—it’s a framework of duty. Your approach reduces the categorical imperative to a bargaining chip."  
  **Reply (1 min + early concession):**  
  **First 30 seconds concession:** "You’re right—credences *feel* alien to deontology. I’d never ‘probabilise’ the moral law itself.  
  But in *practically reasoning* amid disagreement, I need a way to weigh *my uncertainty* about which framework applies. This isn’t reducing duty to probability; it’s acknowledging my finite perspective. Your framework still gets a veto: if an option violates duties (e.g., sacrificing individuals), it’s excluded, full stop. That’s why the threshold protects your core concerns."  
  **Soft Spot?** None—this concession disarms them.  

  ### **4. Social Choice Economist**  
  **Objection:** "Your aggregation rule is normatively arbitrary and vulnerable to cycles. If Theory A ranks X>Y>Z, B ranks Y>Z>X, and C ranks Z>X>Y, your median-based veto may yield an empty set. And why wouldn’t I misreport my credences to game the threshold?"  
  **Reply (2 mins):**  
  "Cycles are a fair concern, but my model borrows from supermajority voting—it’s designed for *sparse* options, not full rankings. In practice, we’re choosing between acts (e.g., ‘sacrifice one/save many’), not ranking every conceivable world. If cycles emerge, we iterate or fall back to theories’ top-ranked survivors. On strategic misreporting: this is a deliberative model for *individual* choice, not group voting. If you’re lying to yourself about your credences, no decision rule saves you."  
  **Soft Spot?** Soft on cycle resolution—hand-wave as "rare in practice." Admit strategic reporting is unaddressed but "orthodox expected value has the same flaw."  

  ### **5. Contract Theorist (Flatmate)**  
  **Objection:** "Stop overcomplicating this. Your parliament is a bargaining game where credences are Nash weights. The ‘veto threshold’ is just a disagreement point. Why not use a proper bargaining solution and drop the pretence?"  
  **Reply (1 min):**  
  "Bargaining solutions *assume* a shared utility space—precisely what I reject. My model doesn’t seek a compromise *value* but identifies options that aren’t *unacceptable* to any significant theory. If you frame deontology’s veto as a ‘disagreement point’, you’ve already smuggled in comparability. This isn’t about splitting differences; it’s about finding options that clear a moral floor."  
  **Soft Spot?** Thin—stress the *non-negotiability* of vetoed options. If pushed: "Bargaining is one analogue, but it can’t capture the exclusion of morally intolerable trades."  

  ---

  ### **SUMMARY STRATEGY**  
  - **Open with the decision theorist’s objection**—it’s the most damaging and likely. Shut down the "risk aversion" reduction immediately.  
  - **Concede early to the Kantian** to neutralise hostility.  
  - **Protect the threshold at all costs**. If called "arbitrary", retort: "So is 0.5 as a p-value threshold, but it structures inquiry."  
  - **If the dreaded bargaining question arises**, say: "It’s a cousin to my model, but bargaining optimises compromise—my goal is vetoing intolerable acts." Then pivot to your payoff (e.g., "This explains why we reject sacrificing basic interests for utility piles").  

  **Final Tip**: When economists cite theorems, reply: "That assumes commensurability." When ethicists cite category errors, reply: "This is practical, not metaphysical." Stay crisp—no throat-clearing.  

  ---  
  Good luck. They’ll smell blood if you waver on the threshold, but your replies are tighter than you think.
