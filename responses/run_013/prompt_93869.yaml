answer: |-
  Your diagnosis strikes me as profoundly perceptive—a sophisticated articulation of what many intuit about the stalemate. Let's dissect the impasse systematically, in British English as requested, exploring its nature, the underlying divergences, and prospects for progress.

  ### Core Diagnosis: A Metalinguistic or Metametaphysical Stalemate
  You're right to suspect the disagreement isn't *primarily* about abstract objects themselves, but about **what ontological commitment entails** and **what "exists" means** in different contexts. The platonist and nominalist often operate with divergent conceptions of:
  1. **The burden of "existence":**  
     - The *platonist* typically adopts a **univocal, face-value interpretation of quantifiers**. If a scientific theory quantifies over numbers (e.g., "∃n such that...") and the theory is true, then numbers exist. Existence is tied to truth-conditions in our best explanations.  
     - The *nominalist* often imposes **extra-scientific criteria** (e.g., causal efficacy, spatiotemporal location) before granting "existence". For them, quantification in mathematics is merely useful syntax, not a mirror of reality.  
     This isn't merely verbal—it's a clash about **which criteria license ontological commitment**.

  2. **The data and "starting intuitions":**  
     - **Platonists** prioritise *mathematical practice* and *scientific indispensability* as data. The success of mathematics (in proofs, applications) suggests it tracks truth; denying this seems ad hoc. Their intuition: if it's indispensable and true, it exists.  
     - **Nominalists** prioritise *causal-explanatory naturalism* as data. If we can't causally interact with an entity, we can't know it; hence, abstract objects are suspect. Their intuition: the physical cosmos is causally closed; adding abstracta is inflationary.  
     These starting points are **methodologically incommensurable**. Neither side "refutes" the other because they don't share foundational epistemic norms.

  ### Is the Disagreement Substantive or Verbal?  
  It’s **both, but not in a trivial way**:  
  - **Substantive** in that it reflects deep differences about:  
    - *What counts as an explanation* (must explanations be causal? Is indispensability sufficient?).  
    - *Which intuitions anchor metaphysics* (fidelity to science vs. parsimony).  
  - **Verbal** in that "exists" is being used with distinct *rules of use*:  
    - Platonists use "exists" in a **domain-general, Quinean sense**: to be is to be the value of a bound variable in a true theory.  
    - Nominalists use "exists" in a **restricted, naturalistic sense**: existence requires causal powers or spatiotemporal location.  
    This resembles **quantifier variance** (Hirsch): both sides speak "ontologically distinct dialects". They aren’t disagreeing about the world’s structure, but about which conceptual scheme best describes it.

  ### The Role of Formal Results and Empirical Work  
  - **Formal Results** (e.g., Field’s nominalisation program, modal structuralism): These show mathematical practice *can* be reconstrued without abstract reference. But they don’t *compel* nominalism, as platonists argue:  
    - Reconstruals are often complex and unintuitive.  
    - They don’t address why mathematics *works so well* if it’s "false" (the "miracle argument").  
  - **Empirical Science**: Indispensability arguments (Quine-Putnam) push platonism, but nominalists retort:  
    - Science describes *relations* between concrete objects; mathematical terms are instrumental (e.g., Yablo’s figuralism).  
    - This returns us to the core clash: must we ontologically commit to indispensable instruments?  

  ### What Would Count as Progress?  
  Given this diagnosis, progress is unlikely via "knockdown arguments". More promising routes:  
  1. **Metametaphysical Clarification**:  
     - Explicate the divergent rules for "exists" (e.g., drawing on Carnap’s distinction between *internal* and *external* questions).  
     - Shift the debate to: *Under what conditions should we adopt a platonist vs. nominalist quantifier meaning?* (e.g., for simplicity, explanatory power, coherence with natural science).  

  2. **Reorienting the Question**:  
     - Instead of "Do numbers exist?", ask: **What cognitive or practical role does mathematical discourse play?** (e.g., Maddy’s "mathematical naturalism" sidesteps ontology for practice).  
     - Or: **What are the costs/benefits of each framework?** (e.g., nominalism gains parsimony but loses face-value interpretation; platonism gains explanatory unity but incurs epistemological burdens).  

  3. **Acknowledging Pluralism**:  
     - Accept that "exists" has context-relative uses (e.g., mathematical existence vs. physical existence). This needn’t be relativism—it could reflect a layered reality (Schaffer).  

  4. **Focusing on Grounding**:  
     - If abstracta exist, *how do they ground* mathematical truth? If not, what grounds mathematical facts? This shifts from existence to **dependence relations**, which may be more tractable (e.g., Linnebo’s thin objects).  

  ### Why Progress Might Be Limited  
  - **Intuitional Anchoring**: The debate rests on bedrock intuitions (e.g., "causal contact is necessary for knowledge", "indispensability implies truth"). These aren’t easily dislodged by argument.  
  - **Theoretical Virtues Conflict**: Platonists value explanatory breadth; nominalists value parsimony. Trade-offs here are subjective.  
  - **No Neutral Ground**: Any "data" (e.g., mathematical experience, scientific success) is already theory-laden.  

  ### Conclusion  
  The impasse is **metametaphysical**: a dispute about the *criteria* for existence and the *standards* for ontological commitment. Platonists and nominalists aren’t just disagreeing about numbers—they’re advocating different frameworks for interpreting reality. Progress lies less in proving one side "right" than in:  
  - Mapping the commitments of each framework (e.g., what epistemology, semantics, and metaphysics they entail).  
  - Assessing which framework best serves our cognitive and practical aims (e.g., scientific inquiry, mathematical discovery).  
  - Recognising that "exists" is a flexible tool, not a univocal predicate.  

  As Wittgenstein might say: the sickness isn’t cured by a theorem, but by a change in perspective. The task isn’t to win the debate but to understand its roots—and your diagnosis does just that.
