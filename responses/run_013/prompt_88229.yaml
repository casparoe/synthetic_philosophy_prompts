  This recall affects HC-TSD units with serial numbers prefixed **TSD24G7B-** manufactured between January 15, 2024, and March 22, 2024. Approximately 1,250 units are involved. Units manufactured outside this date range or with different serial prefixes are not affected. Confirm your serial number via the Customer Portal at www.simulacradyn.com/recall-check.

