  Simulacra Dynamics has received isolated reports concerning unexpected and potentially hazardous operational deviations in specific HC-TSD units. Affected units may exhibit spontaneous, large-scale rearrangement sequences within the simmball arena. These rearrangements manifest as abrupt, uncommanded shifts in complex, persistent symbol patterns (e.g., sudden "erasure" of stored symbolic sequences, apparent "miscalculations" during comparison routines, or uncontrolled "symbol propagation" across the arena).

