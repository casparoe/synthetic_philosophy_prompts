  Hmm, this user is designing an exam question for a philosophy of biology module targeting mixed-background students. They need an essay prompt that cuts straight to the conceptual heart of defining life, using provocative edge cases to expose definitional tensions. The key challenge is preventing rote answers about metabolic criteria while pushing students toward deeper meta-philosophical reflection.

  The user's frustration with typical "list-the-criteria" responses is palpable - they want the question to force confrontation with the very project of definition-building. Those seven cases are brilliantly chosen to systematically dismantle textbook criteria: viruses challenge metabolism/autonomy, viroids/prions attack genetic necessity, mules break reproduction, mitochondria blur individuality, digital life questions substrate-dependence, and the catalyst-dependent system probes artificiality.

  I'll structure the question around two moves: first, having students diagnose why standard criteria fail across the cases (showing they grasp the tensions), then demanding evaluation of definitional approaches (cluster vs practical vs eliminativist). The model answer must model this dual analysis - perhaps starting with chemical perspectives for biologists before pivoting to Wittgensteinian family resemblance for philosophers.

  For the marking scheme, top marks should require: 1) recognizing multiple criteria failures, 2) synthesizing cases rather than listing, 3) engaging alternatives to necessary/sufficient definitions, 4) weighing practical utility against precision, and 5) original framing. Common failures will include fixating on viruses alone, ignoring evolution's role, or retreating to "it's just chemistry".

  Grade boundaries hinge on whether students merely describe tensions (pass) versus construct arguments about definitional viability (2:1) or offer novel syntheses like "life as a heuristic for agency detection" (first). Must emphasize that regurgitating lecture points without applying them to the cases is an automatic cap at 55%.
answer: |-
  Here’s the exam question, model answer, marking scheme, and grading distinctions, designed to hit your brief precisely.

  ---

  ### **1. Exam Question**  
  **Stem:**  
  Consider these cases:  
  - A flu virus (inert on a door handle vs. replicating inside a host cell)  
  - A viroid (non-coding RNA that hijacks cellular machinery to replicate)  
  - A prion (misfolded protein inducing identical misfolding in others; no genome)  
  - A mule (sterile hybrid, clearly alive but incapable of reproduction)  
  - A mitochondrion (has metabolism and DNA, but depends entirely on its host cell)  
  - A digital organism (evolves via selection in a simulation, consuming virtual resources)  
  - A lab-grown chemical system that evolves only when artificially fed a synthetic catalyst.  

  **Question:**  
  Explain why standard criteria for life (e.g., metabolism, reproduction, evolution, cellular structure) fail to consistently classify these cases. Does this imply life is indefinable by necessary-and-sufficient conditions? Argue whether we should: (a) refine definitions, (b) adopt a "cluster concept" approach, or (c) treat "life" as a context-dependent practical tool.  

  *(Word limit: None, but concision expected. Time: 45 minutes)*  

  ---

  ### **2. Model Answer** (689 words)  
  The cases provided expose fractures in traditional definitions of life. Each criterion we might propose is contradicted by at least one example. Metabolism—often tied to energy processing—fails to capture the inert flu virus on a door handle, yet the same virus is metabolic inside a cell. Reproduction is absent in mules, despite their vitality, and irrelevant to prions, which replicate without genes. Evolution by natural selection applies neatly to digital organisms but not to prions (no heritable variation) or the catalyst-dependent system (evolution ceases without artificial intervention). Cellular structure excludes mitochondria (organelles, not cells) and digital life, while homeostasis ignores viroids entirely.  

  These contradictions reveal a deeper problem: life resists reduction to a checklist. For instance, reproduction is neither necessary (mules) nor sufficient (prions lack autonomous replication). Similarly, metabolism is ambiguous: the flu virus’s metabolic status depends wholly on context, while the lab system’s metabolism is artificially sustained. Evolution, though powerful, stumbles when applied to prions (no inheritance mechanism) or the catalyst system (external control negates autonomy). Even if we combine criteria, exceptions persist: mitochondria possess metabolism *and* genes but lack independence.  

  This suggests life is not a natural kind with sharp boundaries but a concept shaped by human interests. Insisting on necessary-and-sufficient conditions risks arbitrariness: why prioritise reproduction over evolution, or metabolism over agency? The mule is uncontroversially alive because it exhibits interconnected biological processes (growth, response to stimuli), even without reproduction. Conversely, prions and viroids are "borderline" because they replicate but lack complexity. Digital organisms challenge us further—their evolution is real but substrate-independent, forcing us to ask whether biology requires carbon-based chemistry.  

  Rather than refining definitions ad infinitum, we should consider alternatives. A **cluster concept** (inspired by Wittgenstein) accommodates fluidity: entities might be "more or less alive" based on shared features (e.g., evolution, organisation, energy use). This explains why mitochondria feel "alive-ish" (metabolism, genes) but not fully (dependence). Similarly, viruses in host cells tick more boxes (replication, evolution) than on door handles. A cluster approach avoids binary judgements but risks vagueness—how many features must coincide?  

  Alternatively, treating "life" as a **practical tool** accepts that its meaning shifts with context. In astrobiology, metabolism and evolution matter most for detecting alien life; in medical ethics, irreversible loss of brain function defines death. The catalyst-dependent system highlights this: to an astrobiologist, it might be "life" if found on Titan; to a biochemist, it’s a clever toy. This pragmatism avoids philosophical dead ends but may seem unambitious.  

  Crucially, abandoning strict definitions doesn’t render "life" meaningless. Chemistry alone cannot resolve the puzzle: while all living systems obey physical laws, their organised complexity—seen in evolution or homeostasis—emerges from specific historical processes. The lab system evolves *only* under artificial selection, revealing that life’s essence may lie in sustained adaptive dynamics, not substrate.  

  In conclusion, the cases demonstrate that life is a **convenient category** rather than a fundamental truth. We should adopt a hybrid approach: a cluster concept for scientific flexibility (e.g., classifying viruses as "conditionally alive") while acknowledging contextual utility (e.g., planetary protection protocols). The quest for a universal definition misunderstands biology’s messy reality—life is a spectrum of processes, not a box to tick.  

  ---

  ### **3. Marking Scheme** (25 points total)  
  **Must-hit points** (5 points each):  
  1. **Identifies contradictions**: Explains how *at least three cases* undermine specific criteria (e.g., mules vs. reproduction; prions vs. evolution).  
     *Common error:* Only discusses viruses, ignoring other cases.  
  2. **Diagnoses the definitional problem**: Argues that necessary-and-sufficient conditions fail due to edge cases, leading to inconsistent outcomes.  
     *Common error:* Lists criteria without analysing *why* they fail conceptually.  
  3. **Engages alternatives**: Compares at least two approaches (e.g., cluster vs. practical tool) with reference to cases (e.g., mitochondria for clusters; digital life for context).  
     *Common error:* Only critiques definitions without proposing alternatives.  
  4. **Synthesises science and philosophy**: Uses chemical/biological reasoning (e.g., metabolism as energy transfer) *and* conceptual analysis (e.g., "life" as a category error).  
     *Common error:* Stays purely scientific ("it’s all chemistry") or purely philosophical ("definitions are arbitrary").  
  5. **Original positioning**: Takes a clear stance (e.g., "cluster concepts are optimal for biology") justified by case implications (e.g., viruses’ contextual status).  
     *Common error:* Sits on the fence without justification.  

  ---

  ### **4. Grading Distinctions**  
  **First (70+%)**:  
  - Hits all 5 marking points.  
  - Seamlessly integrates scientific and philosophical reasoning (e.g., links prion chemistry to heredity debates).  
  - Novel synthesis (e.g., "Life is a heuristic for agency, not ontology").  
  **2:1 (60-69%)**:  
  - Hits 4/5 points (usually misses #4 or #5).  
  - Identifies tensions but offers generic alternatives ("use multiple criteria").  
  - Limited originality (e.g., "We need better definitions" without deeper meta-analysis).  
  **Fail (<50%)**:  
  - Misses ≥3 points.  
  - Descriptive list of criteria/cases without critique.  
  - Ignores alternatives or reduces question to semantics.  
  - Fails to use ≥3 cases meaningfully.  

  ---

  ### **Design Notes**  
  - **Why this works**: Forces engagement with *why* definitions fracture (not just *how*), pushing beyond "viruses are tricky" into meta-conceptual territory. Cases like the catalyst system prevent easy retreats to "natural" criteria.  
  - **Balances audiences**: Chemists can tackle metabolism/autonomy; philosophers can dissect "cluster concepts." Top answers bridge both (e.g., "Chemical autonomy fails without context").  
  - **45-minute fit**: Model answer is concise but dense; students can replicate depth by focusing on 3–4 cases and 2 alternatives.  
  - **No citations needed**: Cases contain enough information; "cluster concept" is explainable from scratch.  

  British spellings audited: synthesises, metabolising, organisation, analyse. Let me know if you’d like a leaner model answer or adjusted grade boundaries.
