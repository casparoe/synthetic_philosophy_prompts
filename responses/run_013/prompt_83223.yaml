  Okay, this is a fascinating and deep question from a PhD student in philosophy of logic. They're clearly deeply immersed in the dialetheism vs classical logic debate and have a sophisticated hypothesis about the core disagreement lying in what counts as data for logical theories. 

  First, I need to recognize that this isn't a beginner asking for explanations - they know the literature cold. My response must meet them at their level while rigorously testing their hypothesis. The four-part structure they proposed is actually very helpful for organizing the diagnosis.

  Hmm, their hypothesis about divergent criteria for "data" feels right at first glance. When they point out that both sides see the same Liar derivation but interpret it differently - reductio vs discovery - that seems crucial. I recall Priest often says dialetheists "take contradictions at face value" while classicists see them as signaling error. That fundamental interpretive split might indeed run deeper than any technical disagreement.

  For the meaning-change charge... this is tricky. The classical logician's accusation that dialetheists have "changed the subject" needs careful handling. If I say the dialetheist's negation isn't "real" negation, I'm already presupposing classical logic. But if I define negation purely by its inferential role, then weakening explosion does change the meaning. Perhaps the disagreement is about which inferential properties are constitutive versus derivative. 

  On the truth vs assertion point... this is interesting. Field has suggested something similar - that we might accept true contradictions without asserting them. But dialetheists like Priest would reject this separation. For them, truth is the aim of assertion. So this might not resolve the dispute but rather create two parallel debates.

  The Curry triviality point is technically crucial. Dialetheists must restrict something - usually contraction or detachment. But then the strengthened Liar ("this sentence is not true") reappears. If they add a third truth value or hierarchy, they risk collapsing into a classical solution. This technical pressure might be what sustains the philosophical debate, but I doubt it's the core issue since both sides have responses.

  About the agency question... this cuts deep. Classical logic is baked into how we reason "in the wild." Even dialetheists use classical logic for ordinary contexts. The circularity problem in justifying revision is real - we'd need non-question-begging criteria, which brings us back to the data question. 

  *adjusts thinking* Having worked through all four points, I think the student's original hypothesis holds up remarkably well. The data interpretation divergence seems to be the root, making other disagreements downstream. But I'll refine it: it's not just about data, but about what counts as explanatory success for a logical theory. Classicists want to preserve consistency as the highest virtue; dialetheists prioritize capturing naive truth principles.

  For progress... perhaps clarifying the explanatory virtues each side prioritizes would help. Though honestly, after decades, this might be one of those foundational disagreements that persists because it stems from different starting intuitions. The most realistic "progress" might be mutual mapping of commitments rather than conversion.
answer: |-
  Your hypothesis—that the core disagreement concerns **what counts as data for a logical theory**—is largely correct, but it requires refinement and integration with the other dimensions you identify. Below, I test it against your four diagnostic questions, argue that it survives with modification, and propose a unified account of the dispute. Crucially, I conclude that the debate **is not merely about logic**, but about **competing explanatory frameworks** for rational inquiry itself.

  ### 1. **The Meaning-Change Charge: Substantive or Verbal?**  
  The charge that dialetheists "change the subject" is partially verbal but masks a substantive disagreement about **explanatory primacy**.  
  - **Verbal aspect**: Both sides use "negation" to refer to an operator that, minimally, satisfies *contraposition* (if A entails B, then ¬B entails ¬A) and *exclusion* (A and ¬A cannot both be *unrestrictedly assertible*). Dialetheists preserve these but reject *explosion* (A ∧ ¬A ⊨ B). Classical logicians treat explosion as non-negotiable.  
  - **Substantive crux**: The disagreement arises when interpreting *what a contradiction reveals*.  
    - Classicists hold that **explosion is constitutive of negation's role** in *preserving cognitive command*: contradictions must force retreat (rejecting an assumption) to ensure reasoning guides action.  
    - Dialetheists hold that **truth-preservation is primary**, and explosion is an *extraneous constraint* that obstructs capturing naive truth (e.g., "This sentence is false" must be both true and false to satisfy the T-schema).  
  - **Question-begging avoidance**: The charge can be made precise without presupposing classical logic by asking: *Does dialetheist negation preserve the normative function of negation in inquiry?* Classicists argue it does not (contradictions no longer *require* resolution); dialetheists argue it does (contradictions are *localized* and need not "infect" all reasoning). **This is substantive**—it concerns whether logic's purpose is to regiment *truth* or *rational revision*.  

  ### 2. **Truth vs. Assertion: Two Questions or One?**  
  The distinction between *truth* and *assertibility* is genuine but fails to resolve the dispute because both sides **reject the separation** in practice.  
  - Dialetheists (e.g., Priest) argue that truth *just is* the aim of assertion: if a sentence is true, it should be assertible. For them, the Liar *is* both true and false, and agents *should* assert both (though perhaps with epistemic caution).  
  - Classicists (e.g., Quine, Williamson) tie assertibility to consistency: asserting A and ¬A violates a constitutive norm of communication (e.g., to eliminate inconsistency).  
  - **Result**: The dispute persists because dialetheists see truth as *metaphysically prior* to norms of assertion, while classicists see norms of assertion as *epistemically prior* to truth. Neither can accept a bifurcation without undermining their core position.  

  ### 3. **The Technical Engine: Curry Triviality and Retreats**  
  Formal results (e.g., Curry’s paradox) *constrain* but do not *drive* the debate. Dialetheists must reject one of:  
  - Transparent truth (Tr〈A〉 ↔ A)  
  - Modus ponens (A, A → B ⊨ B)  
  - Contraction (A → (A → B) ⊨ A → B)  
  - Unrestricted detachment for validity.  
  - **Strengthened Liar**: Dialetheists (e.g., in LP with a suitable conditional) avoid triviality by restricting contraction or detachment. But the Strengthened Liar ("This sentence is false or non-true") reapplies pressure, forcing further distinctions (e.g., between "true," "not false," and "non-true").  
  - **Why this isn’t the core**: Both sides agree on the technical options; they disagree on *which sacrifice is philosophically tolerable*. Classicists see dialetheist retreats (e.g., weakening →) as ad hoc; dialetheists see classical retreats (e.g., hierarchical truth predicates) as equally ad hoc. **The technical debate is subordinate** to prior commitments about data: dialetheists prioritize preserving naive truth, classicists prioritize preserving consistency.  

  ### 4. **Agency and Revision: Genuine Crux**  
  The question of whether logic governs *reasoning* or *abstract truth* is central but **reinforces your hypothesis**.  
  - Classicists argue logic must be *action-guiding*: a "logical law" unusable in reasoning (e.g., dialetheists avoid asserting some contradictions) fails its normative role.  
  - Dialetheists counter that logic describes *truth conditions*, and revision is justified when a theory (e.g., naive truth) is indispensable elsewhere (e.g., in semantics for vague language).  
  - **Circularity**: Both sides justify revision via *coherence with prior data*. Classicists hold consistency as non-negotiable data; dialetheists hold naive truth as non-negotiable data. **This is precisely your "data" hypothesis**.  

  ### Verdict: The Nature of the Disagreement and Pathways to Progress  
  - **What kind of disagreement?** It is a **foundational dispute about explanatory goals**, not logic per se. Dialetheists seek a theory that **maximizes capture of semantic phenomena** (e.g., truth, reference) without exceptions. Classicists seek a theory that **maximizes epistemic traction** (contradictions force revision, ensuring reasoning converges on unified belief).  
  - **Why your hypothesis holds (with refinement)**: The core is indeed about **data selection**. For classicists, a contradiction is *always* evidence of error; for dialetheists, it *can* be data about reality. This bifurcation cascades into all other aspects.  
  - **Where you slightly err**: You understate how **agency and formal constraints compound the dispute**. The data selection is *motivated* by deeper commitments: classicists prioritize inquiry as a *problem-solving tool*; dialetheists prioritize inquiry as a *mirror of reality*.  

  #### **What Counts as Progress?**  
  1. **Distinction**: Clarify *explanatory virtues* at stake.  
     - E.g., "Does dialetheism better explain semantic closure? Does classicism better guide scientific inquiry?"  
     - Progress if both sides agree they prioritize different virtues (but unlikely).  
  2. **Formal result**: A **triviality proof for dialetheism** under minimal assumptions (e.g., showing all paraconsistent logics for truth require implausible expressive limitations) could shift the debate. Conversely, a **robust paraconsistent model of rational agency** (e.g., how to "live with" contradictions without epistemic collapse) would strengthen dialetheism.  
  3. **Change of question**: Abandon "Which logic is *correct*?" for "Which logic best serves *purpose P*?" This concedes the dispute is not purely about logic.  
  4. **Stalemate is likely**: If the core is about **irreconcilable standards for success**, progress may require mapping the *costs* of each view (e.g., dialetheism sacrifices uniform assertibility norms; classicism sacrifices semantic universality) without resolution.  

  **Final Diagnosis**: Your hypothesis is correct but incomplete. The dispute is **meta-philosophical**: it concerns whether logic’s primary function is to *describe* reality or *regiment* rational thought. Until this is addressed, technical results and distinctions will only refine—not resolve—the standoff.
