prompt: |-
  Before a seminar on information and rational choice, I want a consistency audit of my own position. Here is the package I plan to defend:

  (1) Good's theorem: for a Bayesian agent, a free and reliable observation available before acting can never lower expected utility. The agent can always ignore it, so the value of information is never negative.
  (2) I am a causal decision theorist: I maximize expected utility with respect to the causal consequences of my action, and I think the evidentialist's appeal to the news value of an action is a mistake.
  (3) I think it can be rational to refuse free information. If a doctor offered me, at no cost, the exact date of my death, I would decline, because knowing would be painful — not because acting on it would lead to worse decisions, but because the knowledge itself would weigh on me.
  (4) I think my preferences are not stable across informational states. If I learned I had a terminal illness, the things I now care about — my career, my long-term projects — would stop mattering to me.
  (5) I think ambiguity aversion is rational: I would rather bet on an urn whose composition I know to be fifty-fifty than on one whose composition is unknown, even when the expected payoff is the same, and I would pay a small amount to avoid the unknown urn.

  Is this a consistent set? Identify which commitments genuinely conflict, order the conflicts by severity, and for each say what would have to give. Distinguish the real tensions from those that dissolve once the terms are made precise, and tell me which single revision would resolve the most.
reasoning: |-
  Okay, the user is preparing for a seminar on information and rational choice and wants a consistency audit of their position. They've outlined five key commitments: Good's theorem, causal decision theory (CDT), rational refusal of free information, unstable preferences, and ambiguity aversion. 

  Hmm, this is a sophisticated philosophical package. The user clearly has a strong grasp of decision theory but is wisely seeking pressure-testing before defending it publicly. Their anxiety about internal consistency is palpable - they're not just asking for surface-level checks but want to know where the real cracks might appear during Q&A. 

  First, let's map the obvious tension: Commitment (3) about refusing free death-date information seems to directly contradict Good's theorem (1). But the user already anticipates this by specifying their refusal isn't about worse decisions but psychological burden. That's crucial - it suggests they might resolve this by distinguishing between instrumental value (Good's focus) and intrinsic disvalue of information. Still, CDT (2) typically assumes utility functions are information-state invariant, which clashes with their preference instability (4). 

  The deeper I look, the more the preference instability (4) becomes the fault line. If learning about terminal illness makes career goals "stop mattering," that violates the standard rational choice assumption of stable preferences. Yet their ambiguity aversion (5) actually relies on stable preferences to make the urn comparison meaningful. Interesting how (4) and (5) pull in opposite directions. 

  The doctor example is particularly revealing. When they say knowing would be "painful," is that pain factored into their current utility function? If yes, Good's theorem still holds because the observation isn't truly free (it carries utility cost). But their commitment (4) suggests the utility function itself changes upon learning, which is a whole different can of worms. 

  Ambiguity aversion (5) might be the easiest to reconcile if we reinterpret it as rational uncertainty about probabilities rather than preference instability. But that would require backing away from their explicit "preferences are not stable" stance in (4). 

  The single most effective revision? Softening commitment (4) to say preferences only appear unstable because we misdescribe the state space. But that might feel like cheating to someone who genuinely believes terminal diagnoses fundamentally reshape values. Alternatively, they could limit Good's theorem to instrumental value only - a common move among philosophers. 

  What's unsaid but probably worrying the user: Does defending all this make them look irrational? The seminar context suggests they want rigor without losing human plausibility. The deepest conflict isn't technical but existential: Can rational choice theory accommodate the fact that we're changed by what we learn? That's the real elephant in the seminar room.
answer: |-
  Here's a consistency audit of your position, ordered by severity of conflict:

  **Core Conflict (Severe):**  
  **(1) Good's Theorem vs. (3) Rational Refusal of Free Information & (4) Preference Instability**  
  - **Conflict:** Good's Theorem assumes a *stable utility function* across informational states. Your refusal of death-date information (3) and preference instability (4) explicitly violate this. If learning your death date causes psychological pain *or* alters your fundamental preferences, the utility function used *before* learning isn't the same as the one *after*. Good's Theorem only guarantees non-negative value *if utilities are stable*.  
  - **Resolution Required:** You must either:  
    - **Revise (1):** Limit Good's Theorem to cases of stable preferences ("instrumental information" only).  
    - **Revise (3)/(4):** Argue that psychological pain is a *consequence* (e.g., dread reducing life enjoyment) captured in your *current* utility function, not a change in preferences. This weakens your "knowledge itself" claim.  
    - **Revise (2):** Adopt a framework allowing state-dependent utility (e.g., some formulations of Ambiguous Decision Theory), but this clashes with standard CDT.

  **Significant Tension (Moderate):**  
  **(4) Preference Instability vs. (5) Ambiguity Aversion**  
  - **Conflict:** Ambiguity aversion (5) assumes your *preferences over outcomes* (money, safety) are stable enough to compare known vs. unknown risks. If preferences are highly unstable (4), why would you consistently prefer the known urn? The rationality of ambiguity aversion relies on stable risk/outcome preferences.  
  - **Resolution Required:**  
    - **Clarify (4):** Specify that preference instability applies to *highly transformative information* (e.g., terminal diagnosis), not mundane uncertainty (e.g., urn composition). This preserves ambiguity aversion for "ordinary" decisions.  
    - **Weaken (5):** Reframe ambiguity aversion as an epistemic heuristic for when probabilities are truly undefined, not a preference over stable outcomes.

  **Potential Tension (Mild - Often Dissolves with Precision):**  
  **(2) Causal Decision Theory vs. (5) Ambiguity Aversion**  
  - **Conflict:** CDT typically assumes known probabilities or sharp credences. Ambiguity aversion involves rejecting choices with *unspecified* probabilities, which seems like a different criterion than causal dominance.  
  - **Dissolution:**  
    - CDT *can* accommodate ambiguity aversion if you model the unknown urn as having a *set of possible probability distributions* (e.g., using Maxmin Expected Utility). Your aversion reflects maximizing the minimum expected utility over this set. This is consistent with CDT if "expected utility" is calculated causally *for each possible distribution*.  
    - **Resolution:** Explicitly adopt an extension of CDT (like the above) to handle ambiguity. No core revision needed if framed this way.

  **No Direct Conflict:**  
  - **(1) Good's Theorem & (2) CDT:** These are compatible. Good assumed Bayesianism but didn't specify evidential vs. causal. CDT agents can satisfy Good's Theorem *if* utilities/preferences are stable.  
  - **(3) Refusal of Information & (5) Ambiguity Aversion:** Refusing transformative knowledge (3) and avoiding unknown probabilities (5) are psychologically linked but not logically inconsistent.

  **Order of Conflicts by Severity:**  
  1.  **Good's Theorem (1) vs. Info Refusal/Preference Instability (3 & 4)** (Severe - foundational assumption violated)  
  2.  **Preference Instability (4) vs. Ambiguity Aversion (5)** (Moderate - undermines basis for stable comparison)  
  3.  **CDT (2) vs. Ambiguity Aversion (5)** (Mild - resolvable with precise CDT extension)

  **The Single Most Resolving Revision:**  
  **Limit Good's Theorem (1) to *instrumental* information (stable utility functions).**  
  - **Why it resolves the most:** This directly addresses the core conflict by acknowledging that information can have *intrinsic disvalue* or *transform preferences*, making (3) and (4) consistent with a qualified (1). It preserves CDT (2), allows a nuanced view of ambiguity aversion (5) (e.g., rational only when utilities are stable), and maintains the rationality of refusing intrinsically harmful knowledge (3).  
  - **Cost:** You must explicitly state that Good's Theorem doesn't apply to information that fundamentally alters the agent's preferences or has inherent positive/negative utility beyond its instrumental value. This refines, rather than abandons, Good's insight.

  **Conclusion:**  
  Your position is **internally tense but salvageable with careful revisions.** The most significant inconsistency is between **Good's Theorem's assumption of stable utility** and your **acceptance of preference instability/intrinsic disvalue of knowledge**. Limiting Good's Theorem to instrumental information is the most effective single revision. Clarifying the *scope* of preference instability (applying only to transformative events) resolves the tension with ambiguity aversion. Adopting a modern CDT-compatible model (e.g., using sets of probabilities) resolves the mild tension with ambiguity aversion. Your core commitment to CDT remains largely unscathed.
