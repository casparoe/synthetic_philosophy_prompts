  We are writing a joint statement to clarify our discussion about the Nash Bargaining Solution (NBS) and the Kalai-Smorodinsky Bargaining Solution (KSBS). We agree on some foundational concepts and disagree on others. The goal is to outline the common ground and the points of disagreement, including the specific example that we couldn't resolve, and to identify the cruxes of our disagreement.

  ## Agreed Claims

  1. **Purpose of a Bargaining Solution**: A bargaining solution is a method for selecting a unique outcome from a set of feasible utility outcomes (the feasible set) for two or more players, given a disagreement point (the outcome that occurs if no agreement is reached). It is meant to be a fair and efficient resolution to the bargaining problem.

  2. **Feasible Set and Disagreement Point**: The bargaining problem is defined by a feasible set S (a closed, convex, and comprehensive subset of R^n) and a disagreement point d in S (typically d = (0,0) in two-player cases). The solution selects a point in S that is individually rational (each player gets at least their disagreement utility) and Pareto efficient (no player can be made better off without making another worse off).

  3. **Nash Bargaining Solution (NBS)**: The NBS is the point in S that maximizes the product of the players' gains over the disagreement point, i.e., it solves:
     \[
     \max_{(u_1, u_2) \in S, u \geq d} (u_1 - d_1)(u_2 - d_2)
     \]
     for two players.

  4. **Kalai-Smorodinsky Bargaining Solution (KSBS)**: The KSBS for two players is the point in S that equalizes the ratios of the players' gains over the disagreement point to their respective maximum possible gains (the utopia point). The utopia point for player i is the maximum utility they can achieve in S subject to the other player getting at least their disagreement utility. The KSBS is the intersection of the Pareto frontier of S and the line connecting d to the utopia point.

  5. **Axioms**: Both solutions satisfy Pareto efficiency and symmetry (if the problem is symmetric, the solution gives equal gains). They differ on two key axioms:
     - **Independence of Irrelevant Alternatives (IIA)**: If S is a subset of T and the solution for T is in S, then the solution for S is the same as for T. NBS satisfies IIA, but KSBS does not.
     - **Individual Monotonicity (IM)**: If the feasible set expands in a way that only one player's maximum possible gain increases, then that player should not be worse off in the new solution. KSBS satisfies IM, but NBS does not.

  6. **Agreement on IIA and IM**: We both agree that IIA is a reasonable requirement for consistency when the set of alternatives shrinks (if the solution was available in the smaller set, it should remain the solution). We also agree that IM is a reasonable requirement for fairness when the bargaining set becomes more favorable to one player (that player should not be harmed). However, we disagree on which axiom is more fundamental.

  7. **Rubinstein Alternating-Offers Model**: This non-cooperative game of alternating offers with a discount factor has a unique subgame perfect equilibrium (for two players) that converges to the NBS as the discount factor approaches 1. This provides a non-cooperative foundation for the NBS. However, we agree that this does not settle the axiomatic debate because:
     - The model makes specific assumptions (such as a fixed discount factor and a particular order of moves) that may not hold in all bargaining situations.
     - It does not directly address the axiomatic properties of the KSBS or other solutions.

  8. **KSBS for n players**: We agree that the KSBS can be extended to n players by defining the utopia point for each player and then finding the point on the Pareto frontier where the ratios of gains to the utopia gains are equal. However, the exact formulation and uniqueness in n-player games can be more complex. There are multiple ways to extend the KS idea to n players (e.g., using a monotonic curve or a lexicographic approach), but a standard definition exists (Kalai, 1977). Thus, it is not accurate to say that KSBS does not pick a unique solution for n players; it does under the standard definition, but the solution may not satisfy as many axioms as in the two-player case. This point is somewhat tangential to our two-player discussion.

  ## Disagreements

  We have two main disagreements:

  1. **Which axiom is more fundamental?** 
     - Friend (pro-NBS): IIA is more fundamental because it ensures that the solution is consistent and not influenced by irrelevant alternatives. Without IIA, the solution might be manipulated by introducing options that are not chosen but alter the outcome.
     - Me (pro-KSBS): IM is more fundamental because it ensures that the solution responds appropriately to changes in the bargaining set. If one player's maximum potential gain increases, that player should benefit, which is a basic fairness condition. Without IM, the solution can be unresponsive to changes that intuitively should help one player.

  2. **Need for a non-cooperative foundation?**
     - Friend (pro-NBS): An axiomatic solution should have a non-cooperative foundation to be considered valid. The Rubinstein model provides such a foundation for the NBS, which is a strong point in its favor. Without a non-cooperative foundation, a solution is just an abstract concept without a clear mechanism for how it would be achieved.
     - Me (pro-KSBS): An axiomatic solution does not necessarily require a non-cooperative foundation. The axioms themselves can be justified normatively, and the solution can be seen as a fair arbitration rule. Moreover, non-cooperative foundations are model-dependent and may not capture all real-world bargaining situations.

