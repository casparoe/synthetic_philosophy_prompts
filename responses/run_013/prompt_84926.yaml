  ### Joint Statement: Nash vs. Kalai-Smorodinsky Bargaining Solutions  
  **Agreed Claims**  

  1. **Purpose of a bargaining solution**:  
     A bargaining solution selects a unique, mutually acceptable outcome from a feasible set of utility pairs (for two players) given a disagreement point (the outcome if negotiations fail). It should be **Pareto efficient** (no one can gain without harming the other), **individually rational** (both players do at least as well as the disagreement point), and satisfy normative axioms of fairness.  

  2. **Core axioms and their roles**:  
     - **Pareto Efficiency (PE)**: Ensures no resources are wasted. Both Nash (NBS) and Kalai-Smorodinsky (KSBS) satisfy this.  
     - **Symmetry (SYM)**: If the problem is symmetric (feasible set and disagreement point are symmetric across players), the solution should be symmetric. Both satisfy this.  
     - **Scale Invariance (SI)**: The solution is unaffected by linear rescaling of utilities (i.e., changing units of measurement). Both satisfy this.  
     - **Independence of Irrelevant Alternatives (IIA)**: If the feasible set shrinks but the original solution remains feasible, the solution shouldn’t change. **NBS satisfies IIA**; KSBS does not.  
       - *What IIA buys*: Consistency when options are removed; prevents manipulation by adding "decoys."  
     - **Individual Monotonicity (IM)**: If the feasible set expands in a way that improves one player’s maximum possible gain (holding others’ fixed), that player shouldn’t be worse off. **KSBS satisfies IM**; NBS does not.  
       - *What IM buys*: Fairness when opportunities improve; rewards players proportionally to new gains.  

  3. **Agreement on IIA and IM**:  
     Both axioms are normatively defensible:  
     - **IIA** is compelling for its stability under contraction (e.g., removing irrelevant options shouldn’t alter outcomes).  
     - **IM** is compelling for its responsiveness to expansion (e.g., if a player’s potential gains increase, they should benefit).  
     We agree that the choice between IIA and IM is the crux of our disagreement.  

  4. **Rubinstein alternating-offers model**:  
     - **What it does**: Provides a non-cooperative foundation for NBS. As bargaining friction vanishes, the unique subgame-perfect equilibrium payoff converges to NBS.  
     - **What it doesn’t settle**:  
       - It assumes specific timing/discounting rules, which may not reflect all real bargaining.  
       - It doesn’t invalidate KSBS as a normative benchmark; KSBS can arise from other non-cooperative setups (e.g., arbitration norms).  
     - **Our agreement**: Rubinstein justifies NBS as an equilibrium outcome but doesn’t resolve which axioms *should* define fairness.  

  5. **KSBS for n-player games**:  
     - KSBS **can** be generalized to n players (Kalai, 1977) via equal proportional gains relative to the utopia point.  
     - However, n-player KSBS may violate Pareto efficiency or require additional axioms for uniqueness. This is **beside the point** for two-player cases (our focus) and doesn’t negate KSBS’s validity in 2-player settings.  

