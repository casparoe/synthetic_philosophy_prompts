answer: |-
  Below is a structured workshop plan designed to make students experience the core logic of the handicap principle through a game with hidden information, differential costs, and payoff-driven incentives. The activity emphasizes **discovery through gameplay** rather than lecture, with rounds that progressively reveal why costly signals evolve, why they must be differentially costly, and how they differ from unfakeable signals or cheap talk.  

  ---

  ### **Workshop Overview**  
  **Goal:** Students experience why:  
  1. Honesty requires signals that are **differentially costly** (cheap for high-quality types, prohibitive for low-quality).  
  2. The equilibrium is **wasteful by design** (the cost *is* the mechanism, not a side effect).  
  3. No unilateral disarmament is possible (even though everyone would be better off without the system).  
  4. "Unfakeable" signals (e.g., indices) solve the same problem differently.  

  **Time:** 120 minutes total.  
  **Players:** 24 students (adaptable to 12).  
  **Room Setup:** Movable chairs for pairing; no projector needed.  
  **Payoffs:** Tokens → points → bragging rights (top 3 scorers win chocolate).  

  ---

  ### **Materials List**  
  - **Type Cards**: 8x "High Quality" (HQ), 16x "Low Quality" (LQ) *(for 12 players: 4 HQ, 8 LQ)*.  
  - **Cost Schedules**: Small cards handed to each player (see below).  
  - **Tokens**: 200+ poker chips/buttons (or tally sheets if physical tokens are impractical).  
  - **Payoff Table Posters**: 2 large posters on walls:  
    - **Signaller Payoffs**:  
      | Action                  | HQ Gets | LQ Gets |  
      |-------------------------|---------|---------|  
      | Signal + Receiver cooperates | 5 tokens | 5 tokens |  
      | Signal + Receiver defects    | 1 token | 1 token |  
      | No signal + Receiver cooperates | 4 tokens | 4 tokens |  
      | No signal + Receiver defects  | 2 tokens | 2 tokens |  

    - **Receiver Payoffs**:  
      | Action          | HQ Signaller | LQ Signaller |  
      |-----------------|--------------|--------------|  
      | Cooperate       | 4 tokens     | 0 tokens     |  
      | Defect          | 2 tokens     | 2 tokens     |  

  - **Record Sheets**: For players to track tokens earned per round.  
  - **Timer**: For round management.  

  ---

  ### **Hidden Information Setup**  
  - **Type Cards**: Randomly distributed at start (students hide their type).  
  - **Cost Schedules**: Private cards given with each round:  
    - **Round 1**: "Cost to signal = 2 tokens (all players)."  
    - **Round 2**: "Cost to signal = 1 token (HQ) or 4 tokens (LQ)."  
    - **Round 3**: "Cost to signal = 0 tokens."  
  - **Tokens**: All start with 10 tokens per round.  

  ---

  ### **Game Rules**  
  1. **Pairing**: Random pairs each interaction (signaller + receiver).  
  2. **Signaller**: Decides to signal or not (paying cost if applicable).  
  3. **Receiver**: Sees signal (or lack thereof), then chooses **cooperate** or **defect**.  
  4. **Payoffs**: Applied immediately (tokens exchanged).  
  5. **Rotations**: 3 interactions per round (each student plays signaller 1–2x, receiver 2–1x).  

  ---

  ### **Round-by-Round Timeline** (Total: 80 mins gameplay + 30 mins debrief)  
  #### **Introduction (10 mins)**  
  - Explain only **rules, payoffs, and goals** ("maximize tokens"). Do NOT mention handicap principle.  
  - Emphasize: "Your type is secret. Payoffs depend on your actions and your type."  

  #### **Round 1: Fixed-Cost Signals (20 mins)**  
  - **Cost**: 2 tokens to signal (all players).  
  - **Goal**: Students experience worthless signals (LQ can easily fake them).  
  - **Predicted outcome**: Most HQ/LQ signal → receivers ignore signals (random cooperation) → tokens wasted.  
  - **Facilitation**:  
    - After round, ask: *"Did signals help receivers decide? Why not?"*  
    - Highlight: When costs are equal, signals are uninformative → defection dominates.  

  #### **Round 2: Differential-Cost Signals (25 mins)**  
  - **Cost**: 1 token (HQ) vs. 4 tokens (LQ).  
  - **Goal**: Students discover honest signalling via differential costs.  
  - **Predicted outcome**:  
    - HQ signal (net gain: 5-1=4 if cooperate > 2 if no signal).  
    - LQ avoid signalling (net loss: 5-4=1 if cooperate < 2 if defect).  
    - Receivers learn: Cooperate only if signal.  
  - **Facilitation**:  
    - After round, ask: *"Why did signals become trustworthy? What stopped LQ from faking?"*  
    - **Critical moment**: When receivers realize cooperating on signals is profitable (only HQ can afford them).  

  #### **Round 3: Invent-a-Signal (25 mins)**  
  - **Cost**: 0 tokens to signal.  
  - **New Rule**: Signallers can send any **unique signal** (e.g., word, gesture, drawing) at no cost. Receivers interpret freely.  
  - **Goal**: Students try "unfakeable" signals → discover they fail without costs or conventions.  
  - **Predicted outcome**: Chaos. LQ mimic HQ signals → receivers distrust all signals.  
  - **Facilitation**:  
    - Ask: *"Could you create a signal LQ couldn’t fake? Why did it fail?"*  
    - Contrast with Round 2: Costly signals work because they’re *differentially burdensome*, not because they’re complex.  

  #### **Debrief (30 mins)**  
  Map game moments to theory:  
  1. **Differential Cost**:  
     - Round 1 (fixed cost): Signals worthless → LQ faked easily.  
     - Round 2 (differential): Signals honest because cost hurt LQ more (1 token for HQ vs. 4 for LQ).  
     - **Key point**: Honesty requires \frac{\text{Cost}}{\text{Benefit}} \text{ higher for LQ than HQ}.  

  2. **Waste as Mechanism**:  
     - HQ *must* "waste" 1 token to prove quality → but if they skip it, receivers defect (net loss: 2 tokens < 4).  
     - **Indignation hook**: "You’d all have more tokens if no one signalled... but if YOU stopped signalling, receivers defected!"  

  3. **Equilibrium Pinned by Marginal Incentives**:  
     - Signal cost (4 tokens) set by LQ’s break-even point: Cost > Benefit if LQ signals (5 - 4 = 1 < 2).  
     - **Key point**: Signals are "expensive" not to deter HQ, but to make LQ *indifferent or worse* if they cheat.  

  4. **Costly Signals vs. Cheap Talk vs. Indices**:  
     - Round 3 (free signals) = **cheap talk**: Meaningless without shared convention/verification.  
     - **Contrast**: Costly signals (Round 2) vs. indices (e.g., "deep voice = large size" – unfakeable by definition).  
     - **Takeaway**: Handicaps are *strategically* honest (cost enforces honesty); indices are *intrinsically* honest.  

  ---

  ### **Adaptations for 12 Players**  
  - **Type Cards**: 4 HQ, 8 LQ (same 1:2 ratio).  
  - **Pairing**: Fewer pairs per round → faster interactions (reduce round timings by 5 mins each).  
  - **Debrief**: Smaller groups enable deeper discussion (lean into Socratic questioning).  
  - **Logistics**: All materials scale down (half tokens, posters still work).  

  ---

  ### **What the Game Can’t Simulate (and How to Address)**  
  1. **Population Dynamics/Frequency Dependence**:  
     - Game is static; evolution requires replicator dynamics.  
     - **Debrief note**: "In nature, signal costs adjust until cheating is unprofitable for LQ."  

  2. **Marginal vs. Total Cost**:  
     - Game uses total costs; marginal costs matter in continuous traits (e.g., antler size).  
     - **Debrief note**: "Differential cost is about *marginal* fitness loss – a small cost to HQ might be devastating to LQ."  

  3. **Falsifiability**:  
     - Game shows the mechanism works; doesn’t prove it’s the only explanation.  
     - **Debrief note**: "Handicaps are falsifiable: Predict LQ *can’t* afford signals even if they try (unlike Round 1)."  

  4. **Non-Strategic Costs**:  
     - Game assumes costs are "paid" strategically; in biology, costs may be byproducts (e.g., conspicuousness).  
     - **Debrief note**: "The cost must *scale* with quality – even if it’s a byproduct."  

  ---

  ### **Predictable Problems & Solutions**  
  - **Problem 1: Loss aversion (players won’t spend tokens)**  
    - **Fix**: Start with practice interactions (e.g., "Spend 1 token for 3 extra – see?"). Emphasize "tokens aren’t real money!"  

  - **Problem 2: One player "solves" Round 2 too fast**  
    - **Fix**: Isolate them as a "bot" (e.g., "You’re now my assistant – help me tally scores"). Or debrief early: "X saw something – let’s discuss later."  

  - **Problem 3: Receivers ignore signals in Round 2**  
    - **Fix**: After 1–2 interactions, pause and ask: "Receivers, what patterns are you seeing?" Nudge toward empiricism.  

  - **Problem 4: Round 3 signals are too vague**  
    - **Fix**: Allow 2 mins for groups to design signals pre-round (fails faster when mimicked).  

  ---

  ### **Why This Works**  
  Students will:  
  - **Feel** the frustration of worthless signals (Round 1).  
  - **Discover** how differential costs enforce honesty (Round 2).  
  - **Get indignant** about wasteful equilibria ("Why can’t we just stop?!").  
  - **See** why "unfakeable" signals (Round 3) require different mechanisms.  

  The game forces them to confront Zahavi’s insight: Signals aren’t honest because they’re costly – they’re costly *because* that’s what makes them honest.
