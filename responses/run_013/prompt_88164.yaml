  First I need to accurately restate the four philosophical positions in their technical vocabulary: essentialism, conventionalism, family resemblance, and prototype theory. For essentialism, I'll frame it as a single point in latent space with deviations as reconstruction errors. Conventionalism maps neatly to arbitrary cluster labels in embedding space. Family resemblance becomes overlapping neighborhoods on a manifold without a centroid. Prototype theory fits well with probabilistic clustering where membership has confidence scores.

