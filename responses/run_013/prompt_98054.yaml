prompt: |-
  A friend of mine keeps saying "if P = NP then all encryption is dead, and nobody's proved P ≠ NP, so we're all doomed." I know enough to smell that this is sloppy but I want the whole conceptual picture. Can you lay out the separate gaps between a worst-case complexity statement like "this problem is NP-complete" and a real-world hardness claim about breaking a cipher — like the worst-case vs average-case thing, the fact that a polynomial bound could have a ridiculous exponent and constant, and anything else that makes the leap illegitimate? I'm basically after why complexity classes are the wrong kind of object to license claims about practical infeasibility (and maybe what kind of hardness crypto actually needs). Lead with your bottom line in the first sentence, then the reasoning, no preamble and don't restate my question.
