  First, I need to emphasize that theoretical worst-case complexity is fundamentally disconnected from practical attacks. That's the bottom line. Now, breaking it down: 

  The worst-case focus of NP-completeness is a big issue. Saying SAT is NP-complete means there exist nasty instances that take exponential time, but most instances might be easy. Crypto needs problems that are hard on average - every instance (or almost every) must be hard to solve. 

  Then there's the polynomial-time misconception. People hear "polynomial" and think "fast", but something like n¹⁰⁰⁰ is utterly impractical. Crypto needs concrete hardness - exponents matter, constants matter, actual cycles matter. 

  Asymptotic analysis ignores constants and lower-order terms, which is fine for theory but useless for practice. A cipher might be theoretically breakable in O(n⁴) but with a constant so huge it's impossible in reality. 

  Non-uniform models like circuits are another gap. Proofs often assume unbounded preprocessing or advice, which attackers don't have. Real adversaries have fixed resources. 

  Also, NP-completeness deals with decision problems ("does a solution exist?"), but crypto often needs search problems ("find the key"). Solving decision problems doesn't automatically solve search. 

  Finally, crypto doesn't just rely on NP-hardness. It uses specialized assumptions like discrete log or lattice problems that might be easier than NP-hard but are still practically hard. Worst-case to average-case reductions for these are crucial. 

  The user probably wants to rebut their friend confidently. I should present this clearly without jargon, listing each gap distinctly. Maybe order it by how damning each point is to the "doom" claim. 

  Also noting that crypto deliberately designs problems to be hard on average and estimates concrete security levels - that's what actually matters, not P vs NP. The friend's argument collapses under multiple independent objections.
answer: |-
  Here's the bottom line: **Theoretical worst-case complexity classes like NP-completeness are fundamentally inadequate for guaranteeing practical cryptographic security because they ignore critical real-world constraints like average-case hardness, concrete efficiency, asymptotic constants, attack models, and the nature of adversarial problems.**

  Here's why the leap is illegitimate:

  1.  **Worst-Case vs. Average-Case Hardness:**
      *   NP-completeness only guarantees that *some* instances of the problem are hard to solve. It says nothing about the *typical* instances used in cryptography.
      *   Encryption relies on problems that are **hard on average**: solving a *randomly generated instance* (e.g., factoring a random large semiprime, finding the discrete log of a random group element) must be infeasible. A problem could be NP-complete yet easy to solve for almost all instances encountered in practice. NP-completeness offers zero assurance about average-case hardness.

  2.  **Polynomial Time ≠ Practically Efficient:**
      *   "P = NP" means problems can be solved in time bounded by *some* polynomial function of the input size (e.g., n^k for *some* constant k).
      *   k could be enormous (e.g., n^1000000). An algorithm with this runtime is completely useless for breaking real-world ciphers, even if n is "only" in the thousands. Practical infeasibility requires **concrete hardness**, not just asymptotic polynomiality. Constants and exponents matter immensely.

  3.  **Asymptotics Ignore Constants & Lower-Order Terms:**
      *   Asymptotic notation (O, Ω, Θ) hides constants and lower-order terms. An O(n^2) algorithm could be 10^12 * n^2, making it slower than a well-optimized O(2^n) algorithm for practical key sizes. Cryptographic security estimates require analyzing the *exact* cost of the best-known attacks.

  4.  **Non-Uniform Models & Precomputation:**
      *   Complexity classes often consider *uniform* algorithms (e.g., Turing Machines). Real attackers can use **non-uniform advice** (special-purpose hardware, massive precomputation for specific parameters).
      *   NP-completeness results typically don't account for the power of non-uniform models (like circuits) or the advantage an attacker gains from vast precomputation before seeing a specific ciphertext. Crypto needs hardness against these stronger adversarial models.

  5.  **Search Problems vs. Decision Problems:**
      *   NP is a class of *decision problems* (e.g., "Does this Boolean formula have a satisfying assignment?"). Breaking encryption is usually a *search problem* (e.g., "Find the decryption key" or "Find the plaintext").
      *   While related, the hardness of a decision problem doesn't always directly translate to the hardness of the corresponding search problem. Cryptography primarily relies on the hardness of search problems (like factoring integers or finding discrete logs).

  6.  **Cryptography Uses Specialized Assumptions, Not General NP-Hardness:**
      *   Modern crypto isn't built on generic NP-hard problems like SAT or Traveling Salesman. It relies on carefully constructed problems believed to be hard on average *and* have specific structural properties (e.g., trapdoor functions, learning with errors - LWE).
      *   For these problems, **worst-case to average-case reductions** are sometimes proven (e.g., breaking LWE on average is as hard as solving worst-case lattice problems). This is the *type* of rigorous average-case hardness guarantee crypto needs, which general NP-completeness utterly fails to provide. Furthermore, these problems might be *easier* than NP-hard but still practically infeasible.

  **What Crypto Actually Needs:**

  Cryptography requires **concrete average-case hardness against realistic adversarial models (including non-uniformity and precomputation) for specific, well-defined problems**. Security is parameterized (e.g., key size = 128 bits) and requires estimating the *exact computational cost* (time, memory, circuit size) of the best-known attack algorithms for that parameter size. Complexity classes provide the foundational language but are far too coarse-grained and worst-case focused to license claims about practical infeasibility; crypto needs meticulous, problem-specific, concrete security analysis. P vs. NP is largely irrelevant to this practical analysis.
