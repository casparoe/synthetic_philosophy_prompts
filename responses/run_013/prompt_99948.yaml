  Then write the piece: a help-center FAQ page, roughly 650-750 words, numbered Q&A entries, issued by the fictional "Office of Unchosen Circumstances" — a government agency that administers luck-egalitarian compensation. Deadpan bureaucratic voice the whole way. No winking, no narrator leaning in to tell us it's absurd.

  Let the humor come from the doctrine's own logic, pushed straight-faced. A citizen asks why they got nothing after a risky investment tanked, and the answer turns on option luck. Someone asks whether they can be reimbursed for tastes they can't afford, and the answer has to wrestle with whether expensive tastes are chosen. A parent asks about a kid born with a condition the agency classifies as... complicated. A worker wants to know why an investigator is digging into whether they "really" had no alternative. There's a form where you must prove your disadvantage wasn't your fault, and the proof requires a counterfactual about what you'd have done under different circumstances. Maybe an appeal that goes to a tribunal with its own intake queue. Land the standard objections without ever stating them: the abandonment of the imprudent, the impossibility of cleanly separating luck from choice, the way the unlucky have to grovel to qualify, the sense that the doctrine can leave everyone worse off while still being, technically, just. A reader who knows the debates should wince in recognition; a reader who doesnt should still get why its funny.

  Dont name any real philosophers, dont cite anything, and dont put any real quotations in it — invent the agency's jargon instead. Keep it dry and legible.
