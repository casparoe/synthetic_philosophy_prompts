prompt: |-
  I am the standards editor at a fact-checking desk that grades the factual claims in our long-form journalism, and I want to replace our informal sourcing tiers with a decision procedure grounded in Nyāya epistemology — specifically its theory of the pramāṇas, the sources of valid cognition. I have an MA in philosophy and will lay the theory out below as I understand it; the translation into something my checkers can run without the theory is the part I need from you, and it is the whole difficulty, because the distinctions that make the theory do its work are exactly the ones a checklist tends to flatten.

  The raw material. Nyāya recognizes four sources of knowledge — perception, inference, comparison (knowing a thing through its resemblance to something already known), and testimony — and holds that a cognition attains the status of knowledge only when it is true, free of doubt, not merely recalled from memory, and — on the account I want to use — not later overridden by a stronger cognition. Each source has its own entry conditions. Perception requires genuine contact between a sense faculty and its object and freedom from deviation, and it is worth separating bare perceptual contact from the conceptualized report that already says more than the contact delivered. Inference requires a reason that (i) is actually present in the case under consideration, (ii) is present in the cases already known to have the target property, and (iii) is absent from the cases known to lack it; it fails when the reason also turns up where the target is absent, when it supports the opposite, when it is itself as doubtful as the conclusion, or when it needs as much proof as the conclusion. Comparison works only when the resemblance appealed to is the relevant kind and not a surface one. Testimony requires a speaker who is both competent on the matter and truthful, whose words are actually understood, and the absence of defeating conditions. Two further points I want preserved: a clash between two sources, or between two deliverances of the same source, produces doubt, and doubt is not knowledge; and hypothetical or "what would have to be the case" reasoning can support a claim but never establish one on its own.

  What I need. Write the procedure my checkers will run on each factual claim in a draft before publication: the questions in the order they should be asked, what counts as a sufficient answer to each, the points at which the procedure stops and refuses the claim the status of knowledge, and the points that must be escalated to me because they turn on what counts as competent, truthful, or relevant rather than on anything the checker can settle. The checkers work without a research budget and have roughly ten minutes per claim; they are not philosophers, so anything the procedure relies on has to survive being applied by someone following the steps without understanding why they are the steps. Mark plainly which steps are genuine tests and which are judgment calls wearing the costume of a test.

  Then run the procedure, in full, on three claims: (1) a damaging claim resting entirely on a single anonymous source with an interest in the outcome; (2) a claim of a causal connection drawn from an observational dataset in which the exposure and the outcome are both common; (3) a claim our own desk published two years ago that a newly obtained document appears to contradict. At least one of the three should come out in a way the desk will hate — I would rather learn that now than in a correction. Finish by saying what the procedure cannot do and where you expect it to misfire in practice.

  Begin with a single sentence naming the one test the whole procedure ultimately turns on, then give the procedure itself, then the reasoning and the worked cases. No preamble, and do not restate this request.
reasoning: |-
  We are going to create a decision procedure based on Nyāya epistemology for fact-checking. The core idea is that a claim can be considered knowledge only if it is supported by one of the four pramāṇas (perception, inference, comparison, testimony) and meets the conditions for that source, and also avoids doubt and override.

  The one key test: **Is there a valid pramāṇa that establishes the claim without being overridden by a stronger cognition?**

  Procedure: For each factual claim in the draft, the checker will run through the following steps in order. The procedure stops and rejects the claim as knowledge if any step fails. If a step requires escalation, the checker must escalate to the standards editor (you).

  Step 1: **Source Identification**
     - Ask: What source (pramāṇa) is the claim based on? (Perception, Inference, Comparison, Testimony)
     - If the claim is not clearly based on one of these, stop: the claim is not established as knowledge.

  Step 2: **Check for Override**
     - Ask: Is there any evidence that contradicts this claim? (Consider all available evidence, including from other pramāṇas.)
     - If yes, then:
          - Evaluate the strength of the contradicting evidence (using the same pramāṇa criteria). If the contradicting evidence is stronger (e.g., more direct, more reliable) then the claim is overridden. Stop: the claim is not knowledge.
          - If the contradicting evidence is not clearly stronger, then there is doubt. Stop: the claim is not knowledge (due to doubt).
     - If no, proceed.

  Step 3: **Pramāṇa-Specific Validation**
     - Depending on the source identified in Step 1, run the corresponding sub-procedure.

     **3A: Perception (pratyakṣa)**
        - Conditions:
            1. There must be direct sensory contact (by a reliable witness) with the object of the claim.
            2. The perception must be free from defects (e.g., not in bad lighting, not by a person with impaired senses, not under the influence of distorting factors).
            3. The claim must not go beyond what was actually perceived (e.g., if the perception was of a red object, the claim cannot be that it was a red apple unless that was directly perceived).
        - Checker asks:
            a. Was there direct observation by a reliable observer? (If anonymous, then reliability is questionable and must be escalated if the claim is critical.)
            b. Were the conditions of observation adequate? (e.g., lighting, distance, time, etc.)
            c. Does the claim exactly match what was observed? (Or is there interpretation added?)
        - If any condition fails, stop: the claim is not established by perception.
        - If the source is anonymous, escalate to the editor for assessment of competence and truthfulness (which cannot be done by the checker without knowing the source).

     **3B: Inference (anumāna)**
        - Conditions:
            1. The reason (hetu) must be present in the case under consideration (pakṣa).
            2. The reason must be present in similar cases where the target property (sādhya) is known to be present (sapakṣa).
            3. The reason must be absent in cases where the target property is known to be absent (vipakṣa).
            4. The reason must not suffer from any fallacy (e.g., being too broad, too narrow, contradictory, or equally doubtful as the conclusion).
        - Checker asks:
            a. What is the reason given for the claim? (e.g., in a causal claim, the reason might be a statistical association.)
            b. Is the reason present in the case at hand? (If not, stop.)
            c. Is there evidence that the reason is reliably associated with the target property? (i.e., present in known positive cases and absent in known negative cases)
            d. Is there any instance where the reason is present but the target property is absent? (If yes, then the inference fails due to over-extension.)
            e. Could the reason also support the opposite claim? (If yes, then it's contradictory.)
            f. Is the reason itself as doubtful as the claim? (If yes, stop.)
            g. Does the reason require as much proof as the claim? (If yes, then it's circular or not independent.)
        - If any condition fails, stop: the claim is not established by inference.
        - Note: Hypothetical reasoning (what would have to be the case) is allowed as supporting evidence but cannot establish the claim on its own. If the inference relies solely on hypotheticals, stop.

     **3C: Comparison (upamāna)**
        - Conditions:
            1. The resemblance must be of a relevant kind (not superficial).
            2. The thing being compared must be well-known and correctly recalled.
        - Checker asks:
            a. What is the comparison being made? (e.g., "X is like Y, so it must have property Z.")
            b. Is the resemblance relevant to the property in question? (e.g., if two things look similar, does that imply they function similarly? If not, it's superficial.)
            c. Is the known thing (Y) actually known to have the property (Z)? (If not, the comparison fails.)
        - If any condition fails, stop: the claim is not established by comparison.

     **3D: Testimony (śabda)**
        - Conditions:
            1. The speaker must be competent (āpta) on the matter (i.e., knowledgeable).
            2. The speaker must be truthful (i.e., not lying, not intending to deceive).
            3. The words must be correctly understood (by the reporter and then by the checker).
            4. There must be no defeating conditions (e.g., evidence that the speaker is mistaken, lying, or the context is unreliable).
        - Checker asks:
            a. Is the speaker identified? (If anonymous, then competence and truthfulness cannot be assessed by the checker; escalate to the editor.)
            b. If identified, is the speaker an expert in the relevant field? (If not, stop or escalate if borderline.)
            c. Is there any reason to believe the speaker is lying or biased? (Check for conflicts of interest, past reliability, etc.)
            d. Are the words of the testimony clear and unambiguous? (If not, stop.)
            e. Are there any defeating conditions? (e.g., evidence that the speaker was under duress, or that the information is secondhand and not verified by the speaker's own perception or inference? If yes, then the testimony is invalid.)
        - If the testimony is anonymous, the checker must escalate to the editor for assessment (because the editor must judge whether the source is competent and truthful based on confidential information).

  Step 4: **Check for Doubt (saṃśaya)**
     - Even if the pramāṇa-specific step passes, ask: Is there any reason for doubt? (e.g., conflicting evidence from another source, or an unresolved challenge to the claim)
     - If there is doubt, stop: the claim is not knowledge.

  Step 5: **Check for Memory and Recency**
     - Ask: Is the claim based on a memory of a past event? (If yes, then it is not direct knowledge but recall. Nyāya holds that memory is not a pramāṇa by itself; it must be backed by a valid pramāṇa at the time of the original cognition and not overridden.)
     - Check that the original cognition was valid (using the above steps) and that there has been no override since.

  Step 6: **Final Override Check**
     - Re-check for any override that might have been missed. This step is a safeguard.

  If the claim passes all steps without stopping, then it can be considered knowledge.

  ---

  **Judgment Calls vs. Genuine Tests:**
  - Step 1: Genuine test (must identify one of four sources).
  - Step 2: Judgment call (assessing strength of contradicting evidence) and genuine test (if clear contradiction exists).
  - Step 3: 
     - 3A: Judgment calls on reliability of observer and conditions, but some clear tests (e.g., if the claim goes beyond perception). Escalation for anonymous sources.
     - 3B: Mostly genuine tests (checking the conditions of inference), but assessing the reliability of the association (Step 3B.c) might be a judgment call.
     - 3C: Judgment call on relevance of resemblance.
     - 3D: Judgment calls on competence and truthfulness (unless the speaker is known to be unreliable). Escalation for anonymous sources.
  - Step 4: Judgment call (what counts as doubt?).
  - Step 5: Genuine test (if it's memory, it must be backed by a valid pramāṇa at the time).

  ---

  **Worked Examples:**

  **Example 1: Damaging claim resting entirely on a single anonymous source with an interest in the outcome.**

  - Step 1: Source is Testimony.
  - Step 2: No override mentioned? (Assume none for this example.)
  - Step 3: Testimony (3D)
     - a. Speaker is anonymous -> Escalate to editor (because checker cannot assess competence and truthfulness without knowing the source).
     - Editor's assessment: The source is anonymous and has an interest in the outcome. This raises concerns about truthfulness (condition 2) and competence (if the interest affects the accuracy). Without knowing the source, the editor must use confidential information to assess. If the source is known to be reliable and the interest does not undermine truthfulness, then it might pass. But typically, an anonymous source with an interest is not reliable enough. Let's assume the editor finds that the source has a clear incentive to lie. Then the testimony fails.
  - Stop: the claim is not established.

  **Result:** The claim is rejected as knowledge. The desk might hate this because they want to publish the damaging claim, but the procedure blocks it due to unreliable testimony.

  **Example 2: Claim of a causal connection drawn from an observational dataset in which the exposure and the outcome are both common.**

  - Step 1: Source is Inference (because it's a causal claim from data).
  - Step 2: Check for override: Is there any evidence contradicting the causal claim? (Assume none for now.)
  - Step 3: Inference (3B)
     - a. Reason: The association in the dataset (exposure and outcome are correlated).
     - b. Reason present? Yes, in the dataset.
     - c. Is the reason reliably associated? The checker must check: Is there evidence that the exposure is present in cases with the outcome (sapakṣa) and absent in cases without the outcome (vipakṣa)? 
          - But in this dataset, both exposure and outcome are common. This might mean that there are many cases where the outcome occurs without the exposure (so condition 3 fails) and many where the exposure occurs without the outcome (so condition 4 fails, because the reason is present where the target is absent). This is a classic case of confounding.
     - d. Specifically, the reason (exposure) is present in many cases without the outcome (violating condition 3: absence in vipakṣa). Also, it might be present in many cases with the outcome, but if it's also present without the outcome, then the association is not reliable.
     - Therefore, the inference fails (fallacy of irregular middle, or "savyabhicāra").
  - Stop: the claim is not established by inference.

  **Result:** The claim is rejected. The desk might hate this because the data shows an association, but the procedure flags that the inference is invalid due to the commonness of both factors (which suggests confounding).

  **Example 3: Claim our own desk published two years ago that a newly obtained document appears to contradict.**

  - This is a case of potential override.
  - Step 1: The original claim was published (so it passed the procedure then). But now we are re-checking because of new evidence.
  - Step 2: Check for override: The new document contradicts the old claim.
     - We must evaluate the new document as a source. Assume the document is a primary source (so it might be perception or testimony?).
     - Let's say the document is a government record (testimony of the government, or perception if it is a direct record). We run the procedure on the new document:
          - Source: Testimony (written record).
          - Conditions: 
              - Speaker: The government agency (competent? truthful? We might assume competence but not necessarily truthfulness if there's motive to lie). 
              - Words: Understood? Yes.
              - Defeating conditions? We don't know. (But the checker might not have time to verify the document's authenticity and context in 10 minutes. This requires research, so it might be escalated.)
          - The checker might not be able to settle the authenticity and truthfulness of the document in 10 minutes without a research budget. Escalate to editor.
     - The editor must assess the new document. If the document is deemed authentic and reliable, then it overrides the old claim.
  - Since the old claim is being re-checked in light of new evidence, and the new evidence is strong (if the document is valid), then Step 2 would lead to override. The old claim is no longer knowledge.

  **Result:** The claim must be retracted or corrected. The desk might hate this because it admits a past error.

  ---

  **What the procedure cannot do and where it might misfire:**

  - **Cannot do:**
     - Handle claims that require deep expertise beyond the checker's general knowledge (without escalation).
     - Resolve deep philosophical disputes about the nature of evidence (e.g., what counts as a valid inference in complex scientific contexts).
     - Replace the need for background research when the checker does not have the necessary information (the 10-minute limit and no research budget are severe constraints).
     - Deal with claims about the future or counterfactuals (since Nyāya focuses on what is).

  - **Where it might misfire:**
     - **Over-cautiousness:** It may reject too many claims because of doubt or the need for escalation. For example, anonymous sources are common in journalism, and the procedure may block them unless the editor overrules.
     - **Under-cautiousness:** If a step is a judgment call (e.g., relevance in comparison), a checker might get it wrong.
     - **Complex Inferences:** In real-world data, causal inferences are complex and might require statistical expertise that the checker lacks. The procedure might flag an inference as invalid when it is actually valid (or vice versa) because the checker doesn't have the time to investigate.
     - **Bias in Escalation:** The editor's judgment in escalated steps might be subjective.

  The procedure is designed to minimize errors by setting high standards for knowledge, but it may not be practical for every claim in a fast-paced news environment.
answer: |-
  The one test the whole procedure ultimately turns on: **Is there a valid pramāṇa (source of knowledge) supporting this claim that is free from doubt, override, and defects specific to its type?**

  ### Fact-Checking Procedure: Nyāya-Based Decision Tree  
  *For each factual claim, follow these steps in order. Stop if any step fails. Answer based on available evidence (10-minute time limit; no new research).*  

  #### **Step 1: Source Identification**  
  - **Ask:** Which pramāṇa is this claim based on? (Perception/Inference/Comparison/Testimony)  
  - **Sufficient answer:** Explicitly named in the draft (e.g., "according to eyewitnesses" → Perception; "data shows" → Inference; "similar to X" → Comparison; "source said" → Testimony).  
  - **Stop if:** No pramāṇa is cited or identifiable.  
  - **Escalate if:** The source type is ambiguous (e.g., a hybrid of Inference and Testimony).  

  #### **Step 2: Override Check**  
  - **Ask:** Is there any credible evidence contradicting the claim?  
  - **Sufficient answer:**  
    - *No* → Proceed to Step 3.  
    - *Yes* → Assess strength: If contradicting evidence comes from a *higher-ranked pramāṇa* (Perception > Inference > Comparison > Testimony) or same-rank with stronger directness, it **overrides**. Stop.  
    - *Unclear* → **Doubt exists**. Stop.  
  - **Judgment call:** Ranking evidence strength (e.g., direct Perception over indirect Inference).  
  - **Escalate if:** Contradiction involves disputed expertise (e.g., scientific debate).  

  #### **Step 3: Pramāṇa-Specific Validation**  
  *Run the sub-step matching Step 1’s answer.*  

  - **3A: Perception (e.g., eyewitness, video, direct observation)**  
    - **Ask 1:** Was there physical/experiential contact with the object? (e.g., witness present at event).  
      - *No* → Stop.  
    - **Ask 2:** Were sensory conditions normal? (e.g., lighting, clarity, no distortion).  
      - *No* → Stop.  
    - **Ask 3:** Does the claim exceed raw perception? (e.g., "he was angry" inferred from "he shouted" → exceeds).  
      - *Yes* → Stop or treat as Inference (go to 3B).  
    - **Judgment call:** Assessing sensory conditions (Ask 2).  
    - **Escalate if:** Observer anonymity prevents vetting (competence/truthfulness unknown).  

  - **3B: Inference (e.g., causal links, correlations, models)**  
    - **Ask 1:** Is the reason (evidence) directly tied to the claim? (e.g., data linked to specific case).  
      - *No* → Stop.  
    - **Ask 2:** Is the reason known to co-occur with the outcome elsewhere?  
      - *No* → Stop.  
    - **Ask 3:** Is the reason absent where the outcome is absent?  
      - *No* → **Fallacy** (reason overextends). Stop.  
    - **Ask 4:** Could the reason support the opposite claim?  
      - *Yes* → **Fallacy** (contradiction). Stop.  
    - **Ask 5:** Is the reason as doubtful as the claim?  
      - *Yes* → Stop.  
    - **Stop if:** Claim relies *only* on hypotheticals (e.g., "if X, then Y").  
    - **Genuine test:** Asks 1, 3, 4 (binary checks).  
    - **Judgment call:** Asks 2, 5 (assessing similarity/doubt).  

  - **3C: Comparison (e.g., analogies, "like X")**  
    - **Ask 1:** Is the compared case well-established? (e.g., "like the 2008 crisis" → 2008 details verified).  
      - *No* → Stop.  
    - **Ask 2:** Is the resemblance relevant to the claim? (e.g., "same economic policy" not "both happened on a Tuesday").  
      - *No* → **Superficial resemblance**. Stop.  
    - **Judgment call:** Assessing relevance (Ask 2).  

  - **3D: Testimony (e.g., sources, documents, experts)**  
    - **Ask 1:** Is the speaker/document identified?  
      - *No* → Escalate (competence/truthfulness unverifiable).  
    - **Ask 2:** Is the speaker competent? (e.g., expert in field, direct access).  
      - *No* → Stop.  
    - **Ask 3:** Is the speaker truthful? (e.g., no conflict of interest, past accuracy).  
      - *No* → Stop.  
    - **Ask 4:** Are the words clear and unambiguous?  
      - *No* → Stop.  
    - **Ask 5:** Are there defeating conditions? (e.g., coercion, inconsistency).  
      - *Yes* → Stop.  
    - **Judgment call:** Asks 2, 3, 5 (vetting source reliability).  
    - **Escalate if:** Speaker is anonymous but deemed essential (you assess competence/truthfulness).  

  #### **Step 4: Doubt and Memory Check**  
  - **Ask 1:** Is there unresolved counter-evidence or alternative interpretations?  
    - *Yes* → **Doubt exists**. Stop.  
  - **Ask 2:** Is the claim based *only* on memory (not current validation)?  
    - *Yes* → Stop (memory not a standalone pramāṇa).  

  #### **Step 5: Final Validation**  
  - **Ask:** Have all prior steps passed without override or doubt?  
    - *Yes* → Claim qualifies as knowledge.  
    - *No* → Reject claim.  

  ---

  ### Worked Examples  
  **Claim 1: Damaging claim from a single anonymous source with an interest.**  
  - Step 1: Testimony.  
  - Step 2: No override mentioned → Proceed.  
  - Step 3D:  
    - Ask 1: Speaker anonymous → **Escalate** (checker cannot verify competence/truthfulness).  
    - *Editor’s assessment*: Source has interest → high risk of untruthfulness. Testimony invalid. Stop.  
  - **Result: REJECTED**. Desk may hate this; anonymous self-interested sources fail testimony checks.  

  **Claim 2: Causal connection from observational data (exposure/outcome common).**  
  - Step 1: Inference.  
  - Step 2: No override → Proceed.  
  - Step 3B:  
    - Ask 1: Reason (correlation) tied to claim → Yes.  
    - Ask 2: Reason co-occurs with outcome → Yes (data shows correlation).  
    - Ask 3: Reason absent where outcome absent? → **No** (both common → reason appears without outcome). **Fallacy** (overextension). Stop.  
  - **Result: REJECTED**. Desk may hate this; common confounders invalidate inference.  

  **Claim 3: Past published claim contradicted by new document.**  
  - Step 1: Depends on original source (e.g., assume Testimony).  
  - Step 2: New document contradicts → Override check.  
    - New document = Testimony. If authenticated, same rank as original.  
    - *Strength comparison*: New document is direct evidence (e.g., primary record) vs. original (e.g., secondhand) → stronger → **Overrides**. Stop.  
  - **Result: OVERRIDDEN**. Desk may hate this; past work is contradicted, requiring correction.  

  ---

  ### Limitations and Failure Points  
  **What the procedure cannot do:**  
  1. Handle claims where all pramāṇas are inaccessible (e.g., speculative future events).  
  2. Resolve deep epistemic conflicts without escalation (e.g., expert disputes on competence).  
  3. Compensate for time/resource limits (e.g., verifying document authenticity in 10 minutes).  

  **Where it may misfire:**  
  1. **Over-caution**: Rejects valid testimony if anonymity is unavoidable (e.g., whistleblowers).  
  2. **Under-caution**: Judgment calls (e.g., "relevant resemblance" in Comparison) may allow flawed analogies.  
  3. **Inference oversimplification**: Complex data (e.g., multivariate stats) may be misjudged in binary checks (Step 3B).  
  4. **Cultural bias**: Nyāya’s "normal sensory conditions" may not cover modern contexts (e.g., digital manipulation).
