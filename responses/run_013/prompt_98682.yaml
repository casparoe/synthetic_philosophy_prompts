prompt: |-
  Okay, seminar prep, so I want a consistency check on my views about contingency in history before I get torn apart. Here's the pile: (1) history is chaotic in the technical sense — outcomes depend so sensitively on initial conditions that some trivial event (a messenger arriving a day late, a general with a cold) can flip the entire trajectory; (2) at the same time I think the big picture is mostly structural — demography, tech, geography, class set the space of what's possible, and individual choices rarely move the broad arc; (3) I think counterfactual history is a legitimate method, not a parlor game — you test a causal claim by removing the cause and seeing what follows; (4) I don't think there are historical laws the way there are physical laws, history just isnt nomological; (5) I'm a determinist and I don't think microphysical indeterminacy matters at the human scale; (6) I think great-man explanations are usually overblown.

  I can feel some of these pulling against each other but I can't tell which ones actually conflict and which are fine. Go through the pairs, tell me which are genuinely in tension, which only look like it, and rank the real ones by how serious they are. For each real one, say what has to give and what it would cost. And actually commit — tell me which single thing I should drop and why, don't just hand me the menu. One more thing: I keep throwing around the word contingent and I suspect I'm using it two different ways without noticing, so factor that in.
