answer: |-
  Below is a decision procedure translating the sentience-capacity principle into an implementable workflow. It prioritizes **precaution** for unsettled evidence, minimizes false negatives (avoiding suffering), and flags edge cases for human review. The procedure is structured as a flowchart with explicit questions, exit points, and value judgments.

  ---

  ### **Decision Procedure: Welfare Handling Protocol**
  **Inputs per Batch:** Species, Life Stage, Available Evidence  
  **Outputs:**  
  - `STUN`: Route through stunning  
  - `NO_SPECIAL`: No special handling  
  - `UNSUPPORTED`: Do not support on platform  
  - `FLAG_FOR_REVIEW`: Escalate to support staff + consultant  

  #### **Step 1: Species Classification**  
  **Question:** *"Select the species from the dropdown list."*  
  - **Sufficient Answer:** Species must be in your **pre-loaded database** (curated by scientific consensus + regulatory guidelines).  
  - **Exit Points:**  
    - If species is **pre-classified as "Sentient"** (e.g., salmon): → `STUN`  
    - If species is **pre-classified as "Non-Sentient"** (e.g., oysters): → `NO_SPECIAL`  
    - If species is **pre-classified as "Unsettled Evidence"** (e.g., decapod crustaceans): → `STUN` (precautionary rule)  
    - If species **not in database**: → Proceed to Step 2.  

  *Value Judgment Here:*  
  - Your team must pre-classify species using a **sentience triage rubric** (e.g., vertebrates = sentient; bivalves = non-sentient; cephalopods/crustaceans = unsettled). This is a value-based interpretation of scientific consensus.  

  #### **Step 2: Evidence Check for Unclassified Species**  
  **Question:** *"Is there peer-reviewed evidence of pain perception or complex behavioral responses in this species? (Yes/No/Unknown)"*  
  - **Sufficient Answer:**  
    - `Yes`: → `FLAG_FOR_REVIEW` (evidence exists; may need reclassification).  
    - `No`: → Proceed to Step 3.  
    - `Unknown`: → Proceed to Step 3.  

  *Value Judgment Here:*  
  - Relying on "peer-reviewed evidence" assumes published science is the gold standard. This may overlook local/cultural knowledge or emerging data.  

  #### **Step 3: Neuroanatomical Threshold**  
  **Question:** *"Does the species have a centralized brain or ganglia with opioid receptors? (Yes/No/Unknown)"*  
  - **Sufficient Answer:**  
    - `Yes` (e.g., fish, octopuses): → `STUN` (precautionary for potential sentience).  
    - `No` (e.g., jellyfish): → Proceed to Step 4.  
    - `Unknown`: → `FLAG_FOR_REVIEW`.  

  #### **Step 4: Behavioral Complexity**  
  **Question:** *"Does the species exhibit ANY of these behaviors? (Select all that apply):*  
  - *Avoids threats beyond reflexes (e.g., hides after injury)*  
  - *Self-administers analgesics (e.g., seeks pain relief)*  
  - *Trade-offs between pain and reward (e.g., risks injury for food)*  
  - *None of the above*"  
  - **Sufficient Answer:**  
    - **Any behavior selected**: → `STUN` (indicates sentience correlates).  
    - **"None of the above"**: → Proceed to Step 5.  

  #### **Step 5: Precautionary Rule for Absence of Evidence**  
  **Question:** *"Is this species evolutionarily close to a sentient/unsettled species? (e.g., same genus/family)"*  
  - **Sufficient Answer:**  
    - `Yes` (e.g., a new crustacean relative of unsettled shrimp): → `STUN` (precautionary).  
    - `No` (e.g., a sea sponge): → `NO_SPECIAL`.  
    - `Unknown`: → `FLAG_FOR_REVIEW`.  

  #### **Step 6: Hardware Compatibility**  
  **Question:** *"Can your hardware stun this species effectively? (Based on size/anatomy)"*  
  - **Applies if output is `STUN` from prior steps.**  
  - **Sufficient Answer:**  
    - `Yes` → Confirm `STUN`.  
    - `No` → `UNSUPPORTED` (cannot meet welfare requirements).  

  ---

  ### **Procedure Applied to 3 Cases**
  #### **Case 1: Farmed Salmon**  
  - Step 1: Pre-classified as "Sentient" → `STUN`  
  - Step 6: Hardware compatible → **Final: `STUN`**  
  *Rationale:* Strong evidence of sentience; no review needed.  

  #### **Case 2: Penaeid Shrimp (Your Main Crop)**  
  - Step 1: Pre-classified as "Unsettled Evidence" (due to CRUSTAACEAN Project studies) → `STUN`  
  - Step 6: Hardware compatible → **Final: `STUN`**  
  *Rationale:* Precautionary rule triggers despite contested evidence. Farm managers may push back, but audit trail shows conservative compliance.  

  #### **Case 3: Awkward Case: Farmed Jellyfish (e.g., *Rhopilema esculentum*)**  
  - Step 1: **Not in database** → Proceed.  
  - Step 2: Evidence? **Unknown** → Proceed.  
  - Step 3: Centralized brain? **No** → Proceed.  
  - Step 4: Complex behaviors? **None** → Proceed.  
  - Step 5: Evolutionarily close to sentient species? **No** (cnidarians distant from vertebrates/cephalopods) → `NO_SPECIAL`  
  - **Final: `NO_SPECIAL`**  
  *Why Awkward?*  
  - No evidence of sentience, but high-revenue customer demands platform support.  
  - Procedure avoids overreach by not triggering stunning, but flags a **hidden risk**: if future evidence emerges, your "no special handling" decision could be audited.  
  - Mitigation: Support staff logs this as a "low-priority review" to monitor emerging science.  

  ---

  ### **Explicit Failure Modes & Limitations**  
  1. **False Negatives (Worst Case):**  
     - Species with undetected sentience (e.g., novel invertebrates) slip through as `NO_SPECIAL`.  
     - *Mitigation:* Quarterly database updates using IUCN-affiliated ethology journals.  

  2. **False Positives (Costly Compliance):**  
     - Over-classifying species as `STUN` (e.g., shrimp) may incentivize farms to bypass your platform.  
     - *Mitigation:* Track "bypass rates" and adjust thresholds if circumvention is detected.  

  3. **Evidence Gaps:**  
     - "Unknown" answers in Steps 2–5 default to `FLAG_FOR_REVIEW`, but farms in low-resource regions may lack data.  
     - *Mitigation:* Partner with NGOs for evidence-collection subsidies.  

  4. **Hardware Limitations:**  
     - `UNSUPPORTED` verdicts for valid welfare needs (e.g., large cephalopods) create market gaps.  
     - *Mitigation:* Annual hardware audits to expand stunning capacity.  

  5. **Value Judgments Masked as Engineering:**  
     - Neuroanatomical thresholds (Step 3) assume opioid receptors = sentience proxy (debated in invertebrates).  
     - Evolutionary proximity (Step 5) is a heuristic, not a rule (e.g., crabs vs. shrimp may differ in sentience).  
     - *Recommendation:* Document all assumptions in an "Ethics Appendix" for auditors.  

  6. **Unfixable Edge Cases:**  
     - Hybrid species (e.g., transgenic fish) or larval stages may not fit classifications.  
     - *Solution:* Always `FLAG_FOR_REVIEW` for manual assessment.  

  ---

  ### **Implementation Notes**  
  - **Tablet UX:** Use checkbox/radio inputs; completion time <5 mins.  
  - **Audit Trail:** Log all answers, timestamps, and user IDs. Auto-generate a "Welfare Rationale Report" for certifications.  
  - **Staff Workflow:**  
    - `FLAG_FOR_REVIEW` → Notify support staff → 48-hour consult with aquatic vet → Escalate to Head of Product if policy change needed.  
    - `UNSUPPORTED` → Trigger hardware upgrade proposal.  
  - **Updates:** Reclassify species annually using a panel (ethologists, vets, industry reps).  

  This procedure embeds precaution without over-engineering, balances ethical risks, and exposes its own uncertainties for accountability.
