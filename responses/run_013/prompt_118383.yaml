answer: |-
  ## Sestina of the Expected Calculus

  This ward breathes shallow, air thick with finite need,
  A certain pain I know the cost to mend.
  But whispers coil: a speculative seed,
  A cosmic gamble on which worlds depend.
  Its vanishing **probability**—
  One chance within the hollow of a googol's span—
  Promises **infinity**. This cold decree
  Dictates the act: forsake the present plan.
  The certain, modest **value** I hold tight
  Dissolves before that looming, endless light.
  My duty’s **hand** grows heavy, poised to sign.

  Considered cold, the scale tips to the sign,
  The cosmic **ticket**, frail as shifting sand.
  Though reason balks at such a frail design,
  The math commands: stretch out your trembling **hand**
  And buy the chance, however slight it gleams.
  This ward’s real cries, the faces, flesh and bone,
  Are finite sums lost in the boundless streams
  Flowing from that singular, distant throne
  Of **infinity**. My comfort, duty’s core,
  Is shredded by the logic I adore.
  The present’s **value** fades; the future’s bright.

  This stark arithmetic, unbearably bright,
  Demands I trade the palpable, the near,
  For an abstraction burning out of sight.
  The **ward** dissolves, a ghostly atmosphere,
  Its oxygen, its bandages, its care,
  Outweighed by immeasurable reward.
  One fragile **ticket**, purchased with a prayer
  To distant gods of chaos, hope ignored
  By all but calculation’s ruthless gaze,
  Holds all the weight within this quantal maze.
  This gamble’s **probability**, though thin,

  Is non-zero. Thus, I must let it in.
  I feel the sick child’s trusting, fading **hand**
  Clutch nothing as I turn. I understand
  The horror etched on faces watching me
  Abandon them for cosmic lottery.
  Their finite good, a measurable delight,
  Succumbs to **infinity**’s relentless might.
  The budget shifts, a cold, decisive act,
  From grounded healing to the abstract pact.
  This **ward** I leave, its certain warmth denied,

  For cold equations where true giants hide.
  The **ticket** bought, a cipher, thin and small,
  Contains the potential to redeem us all,
  Or vanish, meaningless. My own soul’s cry
  Is stifled by the numbers soaring high.
  My human **hand**, that learned to soothe and tend,
  Now signs the form, commits the vital funds
  To chase the ghost where all true meaning ends—
  Except within the framework that commands.
  The modest **value** known, the comfort planned,
  Is sacrificed. The **probability**

  Is all that matters now. **Probability**,
  That ghostly fraction, holds the key to gain
  Beyond all loss. This harsh necessity
  Transforms the **ward** to just a site of pain
  I choose *not* to alleviate today.
  The cosmic **ticket** takes the meager gold.
  This is the path, the only way to pay
  For any future worth its weight in cold
  Eternity. My duty’s true demand
  Is clear: obey the calculating **hand**
  That writes for **infinity**, not finite breath.

  **Envoi**
  So strike the names from this afflicted **ward**.
  Accept the **ticket**. Let the dice be hurled.
  This **hand** obeys the cold, expected **word**:
  Seek **infinity**, though it shakes the world.
  Ignore the finite **value**, plainly heard.
  Trust only non-zero **probability**.

  ---

  **Analytical Note:**

  The poem commits unreservedly to the expected-value fanaticist conclusion. The speaker, having fully internalized the framework, acts upon it, choosing the speculative program over the certain, finite good for present patients. The sestina’s relentless recursion of the end-words structurally enacts the fanaticism: the concrete reality of the "ward" and the human "hand" are progressively drained of their tangible significance through repetition, pulled towards the abstract demands of "infinity" and the decisive but fragile "ticket," governed solely by the non-zero "probability." "Value" shifts from denoting the immediate, measurable good to being utterly dominated by the infinite expectation.

  The poem takes liberties primarily in its acceptance of the contested foundations of the fanaticist argument:
  1.  **Infinite Utilities:** It treats "infinite good" as a coherent, measurable, and commensurable quantity that can straightforwardly enter an expected utility calculation, ignoring profound philosophical and mathematical problems with defining, comparing, and aggregating infinite values.
  2.  **Negligible Probabilities:** It accepts that a probability as small as one-in-a-googol is meaningfully actionable, glossing over epistemic concerns about whether such minuscule probabilities can be reliably known, measured, or distinguished from zero in practice, and whether they warrant real-world resource allocation.
  3.  **Aggregation & Person-Affecting:** It implicitly accepts the aggregation of value across vast (potentially infinite) possible future persons and states, prioritizing this abstract potential over the identifiable suffering and claims of existing individuals in the "ward," a move contested by person-affecting views and deontological constraints.
  The poem leans heavily on the most literal, consequence-maximizing interpretation of expected utility theory when confronted with infinite stakes, presenting the internal conflict not as a reason to reject the framework, but as the painful cost of its rational application. It portrays the fanaticism as an uncomfortable, existentially demanding, yet logically inescapable consequence for the believer.
