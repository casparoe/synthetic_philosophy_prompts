answer: |-
  ## The Partition Imperative: Why Secession Necessitates Border Negotiation

  The puzzle of secession in liberal democracies reveals a fundamental tension between collective self-determination and territorial integrity. While the rhetoric of independence movements often presents secession as a straightforward exercise of majority will within predefined borders, this masks a deeper instability: administrative boundaries within states are historical artifacts, lacking inherent moral authority. Position 4 – asserting a primary right to self-determination but denying the immutability of the exiting unit's borders – offers the most coherent and just resolution. It navigates the treacherous waters of infinite regress and arbitrary definition inherent in other positions while upholding core democratic principles. The claim that "a majority within a territory may take that territory out of the larger state" fails precisely because it treats contingent borders as sacrosanct. The regress stops not at an arbitrary designation of "people," nor by collapsing into chaos, but by recognizing that the legitimacy of secession is inextricably linked to the negotiability of the territory being claimed.

  **Why the Other Positions Fail:**

  1.  **"Peoples" (Position 1):** This is definitional sleight-of-hand. What constitutes a "people"? Is it shared language, history, ethnicity, or political will? The Cree clearly asserted their distinct peoplehood against Quebec's claim. Catalans claim it against Spain, while Tabarnacists satirically claim it against Catalonia. The criteria are invariably chosen to fit the desired conclusion (e.g., Quebec is a "people," but the Cree or West Island Montrealers are not *within the context of Quebec's secession*). "People" becomes a label applied *after* deciding where the regress should stop, not an independent criterion doing analytical work. It provides no objective standard to resolve competing claims within the same territory.

  2.  **Capable Groups (Position 2):** This leads logically to the absurdity of the "West Island" or "Tabarnia" problem, or even the secession of a single apartment building. If self-determination runs "all the way down," it destroys the very concept of a viable state capable of providing the security and stability that make self-determination meaningful. This position confuses the *capacity* for self-governance (which many small groups possess in a minimal sense) with the *legitimacy* of severing established political and economic unions based solely on a local majority vote. It ignores the profound interdependence within modern states and the legitimate interests of the remainder state and minorities caught within the seceding territory.

  3.  **Remedial Only (Position 3):** While intuitively appealing, this sets an impossibly high and contested bar. It makes the fundamental right of self-determination entirely contingent on an external (or contested internal) judgment of oppression. Who defines the "relevant sense"? Quebecers, Scots, and Catalans firmly believe their distinct identities and aspirations are stifled within the larger state – a form of non-violent, democratic "injustice" in their view. Requiring proof of egregious, internationally recognized oppression (like genocide or systematic discrimination) before allowing *any* secession discussion ignores legitimate democratic aspirations within functioning democracies and grants the central state a permanent veto over national identity claims. It renders the principle useless for the very contexts (liberal democracies) where these debates most frequently arise.

  4.  **Individualist (Position 5):** This radically oversimplifies the nature of political community. Secession isn't merely mass emigration; it's the dissolution of a shared political framework and the creation of a new sovereign entity. Individuals cannot "emigrate" while remaining on their land – the land itself and its governance structures are contested. This position ignores collective rights to self-government recognized in international law and practice, the complexities of redistributing assets and liabilities, establishing new citizenship regimes, and the fundamental disruption to the lives of those who *disagree* with secession but find themselves within the new state's borders. Emigration is an individual solution to a collective political problem; it doesn't resolve the underlying territorial and governance conflict.

  5.  **Defeasible (Position 6):** While internal solutions like asymmetrical federalism are often desirable and just, positioning them as the *answer* to the secession claim misunderstands the core issue. This view implicitly accepts the seceding group's claim to be a distinct "people" entitled to self-determination *within its existing borders*, but then offers a lesser remedy. The problem of the dissenting sub-region (like the Cree or Orkney/Shetland) remains: *Why* must they accept internal self-government within Quebec/Scotland rather than asserting their own right to remain with Canada/UK? Position 6 dodges the fundamental question of territorial legitimacy raised by Position 4. It also begs the critical questions: Who decides what constitutes an "adequate" offer? What specific powers must be devolved? The specter of the central state or the seceding region imposing an "adequate" solution on a deeply unwilling sub-region undercuts the self-determination principle it purports to uphold for the larger group.

  **The Case for Partition and Renegotiation (Position 4):**

  Position 4 succeeds where others fail by directly confronting the core problem: **The borders of the seceding unit are not natural or self-justifying; they are administrative lines drawn by the state it seeks to leave.** Granting an automatic right to secede with historically contingent borders treats those lines as morally foundational, which they are not. This creates an inherent instability and injustice for minorities within those borders.

  The principle doing the work here is **territorial legitimacy derived from democratic consent and the minimization of imposed rule.** A secession claim asserts that the current sovereign arrangement lacks legitimacy for a specific group concentrated in a specific area. However, that claim cannot *itself* legitimize imposing a *new* sovereign arrangement (the independent state with its existing borders) on subgroups within that area who explicitly reject it and affirm their allegiance to the original state (like the Cree or northern Scottish islanders). To do so replicates the very democratic deficit the secessionists decry, just at a smaller scale.

  Partition and renegotiation are therefore not a trick to dissolve states, but a necessary corollary of the self-determination principle itself. It acknowledges that:
  1.  **Borders are contingent:** All existing state borders are historical artifacts. Their legitimacy stems from acceptance, not inherent rightness. Secession challenges that acceptance *within* a sub-unit.
  2.  **Consent is layered:** Consent to a political community is not monolithic. A majority in Quebec rejecting Canada does not automatically equate to consent from the Cree to Quebecois sovereignty. Legitimacy requires accounting for identifiable groups with strong ties to specific territories who dissent from the new project.
  3.  **Stability requires negotiation:** Imposing borders based solely on the administrative convenience of the state being left ignores the realities on the ground and sows seeds of future conflict within the new state. Negotiation allows boundaries to better reflect actual patterns of allegiance and identity, enhancing the stability and legitimacy of both the new state and the rump state.

  This does *not* mean every village can secede. Partition is triggered only when a clear, geographically concentrated group within the seceding territory demonstrates a *prima facie* claim to distinct peoplehood and a *manifest will* to remain with the original state, making their forced inclusion in the new state a significant injustice. The Cree, with their historic territory, distinct identity, treaty relationship with Canada, and overwhelming referendum result, present a paradigmatic case. The viability and contiguity of the resulting territories are also crucial practical constraints.

  **Designing the Process:**

  Applying Position 4 requires clear procedural mechanisms:
  1.  **Triggering the Question:** The initiative should generally lie with the regional legislature representing the territory seeking independence (e.g., Quebec National Assembly, Scottish Parliament), reflecting existing democratic structures. A supermajority requirement (e.g., 60%) for the initial vote authorizing negotiations could be prudent to ensure broad consensus for such a momentous step.
  2.  **Defining the Question & Threshold:** The seceding region proposes the initial question and territory. However, recognizing the contingency of borders, the *principle* that borders are negotiable must be explicitly acknowledged in the process. A clear majority threshold (e.g., 50%+1 of valid votes cast) on a clear question ("Should [Territory] become an independent country?") is sufficient to mandate negotiations – but not to dictate the outcome or final borders. Higher thresholds risk paralyzing legitimate democratic expression.
  3.  **The Franchise:** Voting rights should be restricted to *current residents* of the territory claimed by the secessionists. Allowing citizens of the larger state residing elsewhere to vote violates the core principle of self-determination for those whose daily lives and futures are directly bound to the territory in question. Special considerations for indigenous communities with historic ties but potentially dispersed populations require specific, negotiated agreements respecting inherent rights.
  4.  **Negotiations:** Negotiations must be conducted in good faith between the seceding region's government and the central government of the existing state. Crucially, **the negotiation mandate explicitly includes the possibility of territorial partition.** Sub-regions demonstrating a clear will to remain (e.g., via local referendums or overwhelming legislative majorities) must have their claims seriously considered. Third-party mediation or international oversight (e.g., through the UN or OSCE) may be necessary if negotiations stall. Outcomes could range from minor border adjustments to significant partition (like Northern Quebec remaining Canadian) to, potentially, a negotiated agreement where the sub-region remains within the new state with ironclad autonomy guarantees (though this is distinct from Position 6, as it arises from negotiation under the partition principle, not as a substitute for it).
  5.  **Scope of Negotiations:** Everything is on the table: final borders, division of assets and debts, citizenship (opt-in/opt-out mechanisms for residents), currency, defense arrangements, transitional periods, and ongoing relationships (e.g., EU membership). The Canadian Clarity Act and Reference provide a useful framework here, emphasizing clarity of question and majority, the obligation to negotiate, and the need to consider minority rights and the rule of law.

  **Verdict:**

  Secession from a liberal democracy is legitimate only if two conditions are met: (1) A clear majority of current residents within the *proposed* seceding territory vote for independence in a free and fair referendum, and (2) The process includes good-faith negotiations between the seceding region and the central state, where the final borders of the new state are subject to revision based on the demonstrable will of geographically concentrated subgroups within the proposed territory who assert a distinct identity and allegiance to the original state. Failure to meet condition (1) voids the mandate. Failure to engage sincerely in condition (2), particularly regarding legitimate partition claims, renders the resulting secession unjust, regardless of the initial vote.

  **Breaking Point:**

  The argument is most vulnerable if **territorial integrity is granted absolute primacy over all self-determination claims.** If one holds that administrative borders within a recognized sovereign state possess inherent, inviolable moral authority that cannot be challenged, even by a clear democratic majority within that territory and regardless of internal dissent, then the entire premise of a primary right to secede (even a defeasible one) collapses. This objection, inherent in Position 3's most extreme form, is hard to definitively refute within liberal democratic theory itself, as it prioritizes order and stability over collective autonomy. While I reject it because it entrenches potential injustice and ignores the historical contingency of all borders, it rests on a foundational commitment to the permanence of the state that my position deliberately challenges. If this premise of absolute territorial sanctity holds, then even the negotiated partition model becomes illegitimate – only the status quo or violent rebellion remain. My position assumes that liberal democracies *can* and *must* find peaceful, principled ways to accommodate profound disagreements about political community that challenge existing territorial arrangements, without resorting to absolute inviolability or collapsing into infinite regress. If that assumption is false, the argument fails. The difficulty in conclusively proving why historical administrative borders *shouldn't* be sacrosanct, especially against claims of stability, was the hardest objection to fully dispel, requiring a pragmatic appeal to minimizing imposed rule and the potential for greater long-term stability through negotiated outcomes rather than imposed solutions.
