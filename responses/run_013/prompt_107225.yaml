answer: |-
  ### Warm-up
  To isolate Scheffler's "collective afterlife" variable, I need two scenarios identical except for whether humanity *could* continue after the present generation dies. The key is ensuring no welfare differences, no intrinsic value claims, and no psychological effects. The zero-welfare future is a conceptual tool—neutral existence, no regrets—to exclude welfare considerations. The core test: Does the *mere possibility* of future humans (even with net-zero lives) affect the value of current lives? If so, Scheffler’s conjecture gains traction.

  ### The Two Scenarios  
  **Scenario A (Extinction):**  
  In 2050, a gamma-ray burst sterilizes Earth. Every human dies instantly and painlessly at the same moment. No one anticipates it; no grief occurs. Humanity ends. The present generation (all living humans) has the same welfare, projects, and relationships as in Scenario B.  

  **Scenario B (Survival):**  
  Identical to Scenario A in every way—same people, same instant painless death in 2050, no warning, no grieving survivors—except Earth is *not* sterilized. The planet remains habitable. After 2050, new humans *could* be born. Crucially, any future lives are stipulated to be net-zero welfare: no suffering beyond joy, no unfulfilled preferences, and no one who regrets existing. They are ethically neutral.  

  ### Constraint Check  
  - **Identical deaths:** Satisfied. Both scenarios: same individuals die at the same moment, no pain, no warning, no grieving.  
  - **Welfare identical:** Satisfied. Present generation: identical welfare. Future lives: net-zero welfare—no one is harmed (they don’t exist in A) or benefited (their lives are neutral in B). The assumption is coherent as a limiting case (like a life with perfectly balanced bliss and anguish, or a content but indifferent existence).  
  - **No intrinsic value appeals:** Satisfied. No claims about humanity/species/consciousness having inherent worth. Only structural differences in the scenarios matter.  
  - **Realism:** Satisfied. Gamma-ray bursts are astrophysical phenomena; sterilization is plausible. No supernatural/sci-fi elements.  
  - **No psychological effects:** Satisfied. No one learns of the event beforehand; thus, no altered behavior or feelings based on future continuity.  

  ### What Each View Says  
  1. **Person-Affecting View:** "Worse" only if worse for a *particular person*. Here, no one is worse off: the present generation has identical lives/deaths, and future people in B don’t exist in A (so not harmed). **Verdict:** No difference between scenarios. Extinction isn’t worse.  
  2. **Impersonal Totalism:** Adds up welfare across all people who ever live. Present welfare is identical; future lives in B add net-zero welfare. Thus, total welfare is identical. **Verdict:** No difference. Extinction isn’t worse.  
  3. **Scheffler’s Conjecture:** Value in current activities (e.g., science, art, parenting) depends on their contribution to a shared human future. In B, activities retain meaning because humanity *could* continue (even if no one actually lives later). In A, all projects become "futile" as they lead nowhere. **Verdict:** Extinction (A) is worse—it undermines the *meaning* of present lives, even if welfare is unchanged.  
  4. **Flat Skeptic:** Only the deaths themselves matter. Since deaths are identical, extinction adds no extra "badness." The future’s absence is irrelevant if no one exists to experience loss. **Verdict:** No difference.  

  ### What’s Doing the Work  
  The **structural dependence of present activities on a possible future**. Scheffler argues that actions derive meaning from their role in an ongoing human story. In B, planting a tree *could* shade future generations; in A, it cannot. This "could" (not actual welfare) is the operative feature.  

  ### Take the Piece Out  
  If we remove this dependence—if activities are *self-contained* (e.g., enjoying a sunset has value regardless of future implications)—the scenarios collapse. Both become identical: lives are lived, then end. Only if present actions *require* a future to "matter" does A differ.  

  ### How a Skeptic Fights Back  
  The skeptic attacks the core mechanism:  
  - **Meaning is subjective/internal:** If a geologist studies mud cores for love of knowledge (not for future humans), the activity’s value doesn’t hinge on humanity’s survival.  
  - **"Collective afterlife" is circular:** The conjecture assumes a future is necessary for meaning, but this isn’t proven—it’s the very claim in question.  
  - **Demand for evidence:** Without welfare differences or psychological effects, what *concrete* metric shows Scenario A is worse? If all observable outcomes are identical, the skeptic dismisses "meaning" as illusory.  
  **Their strongest blow:** Your setup *rigs* the case by defining "value" in a way that presupposes Scheffler’s view. By excluding welfare and psychology, you force meaning to rely solely on future continuity—but that’s the point being tested.  

  ### Bottom Line  
  The experiment holds: it isolates Scheffler’s conjecture by satisfying all constraints. The skeptic denies its premise, but the case cleanly shows that *if* present value depends on humanity’s possible continuation, extinction adds distinct disvalue beyond the deaths themselves—even with zero-welfare futures. Whether you accept this hinges entirely on buying into the "collective afterlife" as a source of meaning.
