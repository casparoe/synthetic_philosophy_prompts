  Below is a comprehensive design for your 90-minute session. Participants will play a simple two-player game through multiple phases, experiencing two rule changes: one implementing a **safe Pareto improvement** (via conditional instructions) and one **unsafe change** (via staked commitments) that appears beneficial but relies on cooperation. The debrief reveals the concept after gameplay.

  ### **Core Idea**
  - **Base Game**: A prisoner's dilemma variant with high temptation to betray.
  - **Change 1 (Safe)**: Players write **conditional instructions** (e.g., "I will cooperate if you do"). This acts as a *correlation device*, enabling coordination without forcing vulnerability. Safety comes from the option to defect if instructions are ignored.
  - **Change 2 (Unsafe)**: Players **stake tokens** on commitments. This seems robust but fails if opponents exploit it, as it only improves outcomes if others cooperate (ordinary Pareto improvement in disguise).
  - **Discovery Arc**: Participants experience "safety" in Change 1 (even with difficult players) and "betrayal vulnerability" in Change 2. The debrief ties this to the formal concept.

  ---

  ### **Materials** (for 24 players)
  - **Index cards**: 150+ (for moves, instructions, staking).
  - **Pens**: 24+.
  - **Tokens**: 100+ identical tokens (coins, beads, or paper clips; 3 tokens/player at start).
  - **Payoff chips**: 300+ distinct from tokens (e.g., colored paper squares; 1 chip = 1 point).
  - **Two baskets**: One for collecting moves, one for tokens.
  - **Timer**.
  - **Scoreboard** (flip chart or whiteboard).

  ---

  ### **Game Rules & Payoffs**
  #### **Base Game: "Trust Fall" (Prisoner's Dilemma Variant)**
  - **Actions**: Each player secretly chooses **Split** (cooperate) or **Take** (defect).
  - **Payoffs** (per round):
    - Both **Split**: Each gets **2 chips**.
    - One **Split**, one **Take**: **Split** gets 0, **Take** gets **3 chips**.
    - Both **Take**: Each gets **1 chip**.
  - **Rationale**: "Take" is dominant (better payoff regardless of opponent), but mutual defection is worse than mutual cooperation.

  #### **Changes to Rules**
  1. **Change 1: Conditional Instructions**  
     - Before playing, players write an instruction on an index card (e.g., "I will Split if you do", "I will always Take").  
     - Instructions are shown to the counterpart *before* moves are chosen.  
     - Players then choose moves independently (can ignore instructions).  
     - **Safety**: Players can always defect ("Take") to guarantee ≥1 chip (original security level). Instructions correlate play but don’t force vulnerability.

  2. **Change 2: Staked Commitments**  
     - Players stake tokens *before* writing instructions.  
     - If they honor their instruction (e.g., say "Split" and play Split), tokens are returned.  
     - If they break their instruction, tokens are forfeited.  
     - **Unsafe element**: Staking tempts players to cooperate ("Split"), but if opponents "Take", cooperators get 0 chips *and* lose tokens. The option to defect ("Take") still exists, but staking incentivizes risk-taking that relies on trust.

  ---

  ### **Matching Protocol**
  - **Pairing**: Use a **rotating circle method** (no arithmetic):  
    1. Players stand in two concentric circles (12 inner/12 outer), facing a partner.  
    2. Each round, outer circle rotates 3 positions clockwise (e.g., Partner 1 → Partner 2).  
    3. Repeat for 5 rounds (each plays 5 unique partners).  
  - **Anonymity**: Use player IDs (e.g., "Blue 1", "Red 1") to submit moves. No real names.  
  - **Speed**: Matching takes <2 minutes/round. Facilitator shouts "ROTATE!" to signal shifts.

  ---

  ### **Timeline** (90 Minutes)
  #### **Phase 0: Setup & Rules** (10 min)  
  - **0:00–0:05**: Distribute materials (ID tags, 3 tokens/player, chips, cards).  
  - **0:05–0:10**: Explain base game (payoffs, anonymity, matching) with examples.  
    > *"Split-Split: both win 2 chips. Split-Take: taker wins 3, splitter gets 0. Take-Take: both get 1. Goal: Maximize your chips."*

  #### **Phase 1: Base Game** (15 min, 5 rounds)  
  - **0:10–0:25**:  
    - **Each round (3 min)**:  
      1. Pair via circles (0:30).  
      2. Players write **move** (Split/Take) on card, submit to basket (1:00).  
      3. Facilitator reads outcomes, distributes chips (1:30).  
    - **Rationale**: Establish baseline defection (most "Take-Take" outcomes).

  #### **Phase 2: Change 1 – Conditional Instructions (Safe)** (20 min, 5 rounds)  
  - **0:25–0:45**:  
    - Introduce rule: *"Write an instruction for your counterpart. They see it BEFORE choosing moves."*  
    - **Each round (4 min)**:  
      1. Pair, write **instructions**, show to counterpart (1:00).  
      2. Choose moves, submit (1:00).  
      3. Resolve payoffs (2:00).  
    - **Safety Moment**: Difficult players may defect, but cooperators can revert to "Take" if instructions are ignored.

  #### **Phase 3: Change 2 – Staked Commitments (Unsafe)** (20 min, 5 rounds)  
  - **0:45–1:05**:  
    - Introduce rule: *"Stake 0–3 tokens on your instruction. If you break it, you lose tokens."*  
    - **Each round (4 min)**:  
      1. Pair, stake tokens (hand to facilitator), write instruction (1:00).  
      2. Show instruction, choose moves (1:00).  
      3. Resolve: Honor instruction? Return tokens. Break? Forfeit tokens (2:00).  
    - **Unsafe Moment**: Players stake/cooperate, but "Take" moves exploit them (0 chips + token loss).

  #### **Phase 4: Debrief** (25 min)  
  - **1:05–1:30**:  
    1. **Poll outcomes**: Chart average chips/tokens per phase.  
    2. **Reveal concept**:  
       - *Phase 1*: Baseline (mutual defection).  
       - *Phase 2 (Safe)*: Instructions enable coordination. Safety: Even if others betray, you can defect ("Take") to guarantee ≥1 chip.  
       - *Phase 3 (Unsafe)*: Staking *seems* safe but fails if opponents defect. Losses occur when cooperators stake tokens and are betrayed.  
    3. **Map to Safe Pareto Improvement**:  
       - **Safe Change (Phase 2)**: Rule change leaves you at least as well off (≥1 chip) NO MATTER what others do. No beliefs needed (instructions are cheap talk).  
       - **Unsafe Change (Phase 3)**: Rule change only helps if others cooperate (staking tempts cooperation but opens exploitation).  
    4. **Formal Nuances**:  
       - *Guarantee vs. Reality*: Safety is guaranteed against *all possible opponents*, but we only saw 5 partners.  
       - *Modification Across Games*: Safe improvements work for *any game* if changes preserve original security levels (e.g., adding signals, removing dominated actions).  
    5. **Q&A**.

  ---

  ### **Predictable Failures & Fixes**
  1. **Matching Chaos**:  
     - *Risk*: Circle rotation confuses players.  
     - *Fix*: Assign numbered spots; use facilitator as "caller" ("Outer circle, move 3 left!"). 

  2. **Unclear Instructions**:  
     - *Risk*: Vague messages ("Trust me").  
     - *Fix*: Provide examples ("I will Split if you Split") and enforce clarity.

  3. **Token Accounting**:  
     - *Risk*: Slow token collection.  
     - *Fix*: Use assistants or pre-count token sets.

  4. **Defection Overload**:  
     - *Risk*: High "Take" rates in Phase 2/3 kill cooperation.  
     - *Fix*: In debrief, contrast ideal (safe improvement enables mutual gains) vs. observed (difficult players blocked gains).

  5. **Time Overrun**:  
     - *Risk*: Rounds exceed limits.  
     - *Fix*: Hard-stop timer; skip rounds if needed (prioritize debrief).

  ---

  ### **What the Activity Cannot Reproduce**
  1. **Formal Guarantee Over All Opponents**:  
     - Participants face 5 partners, not infinite/arbitrary opponents.  
     - **Debrief Statement**: *"Safety requires a guarantee against EVERY possible opponent, even irrational ones. Here, we only saw a few."*

  2. **Modification Across Arbitrary Games**:  
     - The activity uses one game (prisoner's dilemma).  
     - **Debrief Statement**: *"Safe improvements apply to ANY game. We used this example to feel the intuition, but the math works for complex games too."*

  3. **Common Knowledge of Rationality**:  
     - Safe Pareto improvements assume players avoid dominated strategies (e.g., not staking tokens to cooperate with a defector).  
     - **Debrief Statement**: *"Safety relies on assumptions like ‘players won’t choose blatantly bad options.’ If those fail, safety breaks."*

  ---

  ### **Why This Works**
  - **Feels the Concept**: Safe improvement (Phase 2) lets players coordinate without vulnerability; staking (Phase 3) creates exploitable risk.  
  - **Handles Difficult Players**: Defectors in Phase 2 don’t harm cooperators’ security; in Phase 3, they cause losses.  
  - **No Jargon**: Terms like "safe Pareto improvement" are banned until debrief.  
  - **Low Tech**: Index cards and tokens emphasize tangible cause/effect.  

  Run this as-is, and the room will grasp the fragility of cooperative guarantees through play. I’ve tailored it for your constraints—adjust timing if needed, but preserve the arc.
