prompt: |-
  My friend Ana is 21, works part time at a cafe, and was a couple hundred bucks short on rent. A guy at a mall kiosk was recruiting for a "skin cream study" and offered $600 cash up front. He told her it was basically just a moisturiser, totally safe, nothing to worry about, and that she could stop whenever she wanted. She signed a long form she skimmed — buried in it was a small chance of permanent discolouration, and a clause saying that if she quit before 12 weeks she'd have to give the money back. She'd never signed anything like that before. Three weeks in, her cheeks broke out badly. She wanted out, they reminded her about the money, she'd already spent it, so she finished the thing. Now she's got marks that might be permanent, and she says she never actually agreed to any of this, it was basically done to her. Her boyfriend says come on, you signed it, you took the cash, nobody put a gun to your head, you couldve walked. I don't know who to believe.

  Our friend Sasha reckons there's a simple test: would she have said yes if she'd known everything? If no, then it wasn't real agreement. That sounds right to me but also too easy — I've said yes to plenty of things I'd never have said yes to if I'd known, and I dont think I was wronged every time.

  Also, and I dont know if this matters: the recruiter's pitch was literally that they were looking for people who need money fast. Ana says that's the part that makes it feel dirty to her. Her boyfriend says that's just advertising.

  Can you help me figure out who's right about Ana? And is Sasha's test the right one, or is there a better way to draw the line?
reasoning: |-
  Okay, let me start by unpacking this situation with Ana. She's 21, working part-time at a cafe, and was short on rent. A guy at a mall kiosk offered her $600 upfront for a skin cream study, saying it was safe moisturizer and she could quit anytime. She signed a form without reading it thoroughly, which had clauses about permanent discoloration risk and returning the money if she quit early. 

  After three weeks, her cheeks broke out badly. She wanted to quit but had already spent the money, so she finished the 12 weeks. Now she has possible permanent marks and feels deceived. Her boyfriend says she consented by signing and taking the cash. Sasha's test is whether she would've agreed if she knew everything. 

  First, I need to assess the validity of Ana's consent. The recruiter downplayed the risks, calling it "totally safe" and just moisturizer. The contract had buried terms, which is a red flag. Ana skimmed the form, but the key details were hidden. That feels manipulative. 

  Then there's the pressure from her financial situation. The recruiter targeted people needing quick cash, exploiting their vulnerability. Ana needed rent money, making her more likely to agree without scrutiny. The clause about repaying if she quit early trapped her when side effects appeared. She felt forced to continue despite the harm. 

  Sasha's test hinges on counterfactual consent—would she have agreed if fully informed? But the friend mentions they've agreed to things without full knowledge and didn't feel wronged. So, what's the difference? I think it's about materiality. If the undisclosed info is significant (like permanent side effects) and affects the decision, consent isn't valid. 

  Also, the boyfriend's argument ignores power dynamics. Signing a contract under financial duress isn't free consent. The recruiter's targeting of desperate people adds to the exploitation. Advertising to vulnerable populations is predatory, not just marketing. 

  Ethically, this situation involves autonomy, beneficence, and justice. Ana's autonomy was undermined by incomplete information and pressure. The study didn't prioritize her well-being, leading to harm. Targeting the financially vulnerable violates justice principles. 

  Legally, the contract might be voidable due to misrepresentation and unconscionability. Regulatory bodies like the FDA or IRB would require informed consent, which wasn't properly obtained. Ana might have recourse here. 

  So, Ana's sense of being wronged is valid. Sasha's test is useful but needs context—materiality of information, vulnerability, and power imbalances. The recruiter's actions were exploitative, making Ana's consent invalid.
answer: |-
  This situation involves complex ethical, legal, and human dimensions. Let's break it down to understand who has the stronger case and evaluate Sasha's test:

  **1. Why Ana Has a Strong Case for Being Wronged:**
     - **Material Misrepresentation:** The recruiter described the cream as "basically just moisturiser, totally safe," minimizing significant risks. A "small chance of permanent discoloration" is not trivial – it's life-altering. This downplaying violates the core principle of **informed consent**.
     - **Exploitation of Vulnerability:** The recruiter explicitly targeted people "who need money fast." Ana was financially desperate (short on rent). This power imbalance undermines the voluntariness of her consent. She wasn't making a free choice between equivalent options; she was under duress.
     - **Buried Clauses & Complex Form:** The critical risks and the punitive repayment clause were buried in a "long form" presented at a mall kiosk. Expecting someone in Ana's position to fully comprehend complex legalese under these conditions is unreasonable. This is a classic **unconscionable contract tactic**.
     - **Coercion via Debt Trap:** When side effects appeared (proving the risk was real), the *only* way to avoid owing $600 she didn't have was to continue subjecting herself to harm. This is **coercion after the fact**, negating her right to withdraw.
     - **Outcome:** She suffered harm (potentially permanent marks) she wouldn't have risked if properly informed and not desperate.

  **2. Why the Boyfriend's Argument ("You signed it, took the cash") is Overly Simplistic:**
     - **Ignores Context:** Mere signature ≠ meaningful consent. Context (desperation, misrepresentation, complex form) matters. Signing under pressure without understanding isn't true agreement.
     - **Ignores Power Dynamics:** Saying "nobody put a gun to her head" ignores economic coercion. Financial desperation *is* a form of pressure. Her choice wasn't truly free.
     - **Ignores the Trap:** She couldn't "walk" when she wanted to without incurring a debt she couldn't pay. The contract structure actively prevented her from exercising her supposed right to quit.
     - **Mistakes Form for Substance:** He focuses on the technical act (signing, taking cash) while ignoring the substance of the agreement (informed, voluntary participation).

  **3. Sasha's Test ("Would she have said yes if she knew everything?") - Its Strengths and Limits:**
     - **Strength:** It directly targets the core issue of **informed consent**. If the answer is "no" (as it almost certainly is for Ana – knowing the real risk and the repayment trap), it reveals consent was defective. This is a fundamental principle in medical ethics and contract law.
     - **Limits (Where it Needs Nuance):**
       - **"Knew Everything" is Vague:** How much "everything"? Key material facts (like permanent side effects and the repayment penalty)? Yes. Minor, inconsequential details? Probably not. The test works best for **material information** – facts likely to change a reasonable person's decision.
       - **Vulnerability Matters:** The test needs context. *Why* wouldn't she have said yes? If it's because she wouldn't risk permanent marks *at all*, that's one thing. But in Ana's case, it's also because she was *specifically targeted due to her desperation*. The exploitation amplifies the wrong.
       * **"Wronged" Isn't Always Binary:** You're right that we sometimes agree to things we later regret without full knowledge (e.g., a boring party, a meal that's just okay). We don't feel "wronged" because the stakes were low, the information wasn't *materially* hidden, and we weren't vulnerable. Sasha's test flags *defective consent leading to harm or exploitation*, not minor regret.

  **4. The Recruiter's Pitch ("Looking for people who need money fast") - Why it Matters Profoundly:**
     - This isn't neutral advertising; it's **predatory targeting**. It explicitly seeks out vulnerable individuals whose desperation compromises their ability to:
       * Give voluntary consent (their need overrides caution).
       * Negotiate terms (they have no leverage).
       * Walk away (they feel they *need* the money).
       * Fully process complex risks (stress impairs judgment).
     - This transforms the transaction from a potential fair exchange into **exploitation**. It confirms the power imbalance and makes the recruiter's "it's safe" reassurances even more manipulative. Her boyfriend is wrong; this makes it fundamentally "dirty."

  **Conclusion: Who is Right about Ana?**

  *   **Ana is largely right.** She was misled about material risks, targeted because of her vulnerability, pressured into signing a complex form she couldn't properly evaluate, and then trapped by a punitive clause when harm occurred. Her consent was not truly informed, voluntary, or ongoing. She was exploited, and harm resulted.
  *   **The boyfriend is wrong.** His view ignores the realities of power imbalance, economic coercion, misrepresentation, and the intentional complexity of the contract. Reducing it to "she signed it, took the cash" misses the ethical and legal substance.
  *   **Sasha's test is fundamentally sound for identifying defective consent,** especially when harm occurs. It needs the nuance of focusing on **material information** and **contextual vulnerability** to distinguish between true wrongs and simple regret. In Ana's case, it clearly shows her consent was invalid.
  *   **The recruiter's pitch is crucial evidence.** It proves intentional targeting of the vulnerable, moving this from potentially negligent misrepresentation to active exploitation.

  **Drawing a Better Line:**

  Beyond Sasha's test, consider these factors to judge if consent was valid or if someone was wronged:

  1.  **Materiality of Withheld/Misrepresented Information:** Was the hidden information significant enough that a reasonable person in that situation would likely have declined participation?
  2.  **Vulnerability & Power Imbalance:** Was one party clearly in a position of disadvantage (financial desperation, lack of education, emotional distress) that the other party knew or should have known about and potentially exploited?
  3.  **Pressure & Coercion:** Was there undue pressure (time constraints, financial threats like the repayment clause, emotional manipulation) to agree?
  4.  **Complexity & Accessibility of Terms:** Were the terms presented clearly and accessibly, allowing genuine understanding, or were they buried and complex?
  5.  **Outcome & Harm:** Did harm result directly from the lack of informed consent or the exploitative nature? (Harm strengthens the case but isn't *always* necessary to show a wrong occurred).

  **In Ana's case, all these factors point strongly to her being exploited and wronged.** She should consider seeking legal advice regarding the validity of the contract and potential recourse for her injuries.
