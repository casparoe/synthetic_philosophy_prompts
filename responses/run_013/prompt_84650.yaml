  ### Joint Statement on the Liar Paradox: Agreed Claims and Precise Disagreements  
  **Signed by the Gappy Advocate (GA) and the Dialetheist Advocate (DA)**  
  *Date: 15 October 2023*  

  #### I. Agreed Claims  
  Both parties endorse the following statements about truth, the Liar Paradox, and theoretical constraints:  

  1. **The T-Schema**: For any sentence \( S \), \( S \) is true exactly when things are as \( S \) says they are. This principle applies universally, including to sentences that reference truth itself.  
  2. **The Paradox's Lesson**: The Liar Paradox (exemplified by "this sentence is not true") demonstrates that preserving the T-Schema requires revising either:  
     - An instance of the T-Schema itself, or  
     - A principle of classical reasoning (e.g., excluded middle, bivalence, or explosion).  
  3. **No Banning Sentences**: Solutions cannot dismiss Liar-like sentences as "non-sentences" or prohibit self-reference.  
  4. **Self-Applicability**: A theory of truth must be capable of asserting that its own central claims (e.g., the T-Schema) are true.  
  5. **Scope of Revision**: Both theories revise classical logic to resolve the paradox, but neither denies the meaningfulness or legitimacy of Liar sentences.  
  6. **Goal of Truth Theory**: The purpose of a truth theory is to provide a consistent, intuitive account of truth that minimizes counterintuitive consequences while preserving core principles like the T-Schema.  

  #### II. What the Gappy View Is and Is Not Committed To  
  - **Committed**:  
    - Some sentences (e.g., the Liar) are neither true nor false ("gappy").  
    - "Not true" does not entail "false"; it may indicate a third status (gap).  
    - The principle of bivalence (every sentence is true or false) fails.  
  - **Not Committed**:  
    - To gaps applying to all paradoxical sentences (e.g., Truth-teller may be gappy, but other cases may differ).  
    - To "not" meaning anything beyond the failure of truth in the object language.  
    - To abandoning the T-Schema; gaps arise from restricting its application to grounded sentences.  

  #### III. What the Dialetheist View Is and Is Not Committed To  
  - **Committed**:  
    - Some sentences (e.g., the Liar) are both true and false (dialetheias).  
    - "Not true" is equivalent to "false" (with "false" allowing for simultaneous truth).  
    - The principle of non-contradiction (no sentence is both true and false) fails for dialetheias.  
  - **Not Committed**:  
    - To all contradictions being true (only specific ones, like the Liar).  
    To gaps; all sentences are at least false (or true, or both).  
    - To trivialism (every sentence being true); explosion (ex falso quodlibet) is rejected to prevent this.  

  #### IV. Predictions for Key Sentences  
  Both parties state their theories' predictions for the following sentences:  

  | Sentence                                                                 | Gappy Prediction                              | Dialetheist Prediction                     |  
  |--------------------------------------------------------------------------|---------------------------------------------|--------------------------------------------|  
  | **(a) "This sentence is not true."**                                     | Neither true nor false (gappy).             | Both true and false (a dialetheia).        |  
  | **(b) "This sentence is true."**                                         | Neither true nor false (gappy).             | False (but not true).                      |  
  | **(c) "Either this sentence is not true, or it is neither true nor false."** | Neither true nor false (gappy).             | Both true and false (a dialetheia).        |  

  #### V. Precise Disagreements  
  Each disagreement is worded such that the targeted advocate accepts the wording as fair:  

  1. **On (a) "This sentence is not true"**:  
     - GA: Sentence (a) is gappy (neither true nor false).  
     - DA: Sentence (a) is a dialetheia (both true and false).  
     *Target: Both. Both accept this as their core position.*  

  2. **On "not true" and negation**:  
     - GA: "Not true" does not mean "false"; it can denote a gap.  
     - DA: "Not true" means "false" (which may coexist with truth).  
     *Target: Both. GA stresses negation’s scope; DA equates negation with falsity.*  

  3. **On (b) "This sentence is true"**:  
     - GA: Sentence (b) is gappy (no facts determine its truth value).  
     - DA: Sentence (b) is false (it asserts truth without grounds).  
     *Target: Both. GA sees underdetermination; DA sees falsehood as default.*  

  4. **On (c) "Either this sentence is not true, or it is neither true nor false"**:  
     - GA: Sentence (c) is gappy (it reduces to the Liar and poses no new issue).  
     - DA: Sentence (c) is a dialetheia (it exposes the gappy view’s inability to state its own position).  
     *Target: Both. GA treats (c) as derivative; DA sees it as a critical test case.*  

  5. **On excluded middle**:  
     - GA: Excluded middle (every sentence is true or false) fails for (a), (b), and (c).  
     - DA: Excluded middle holds (all sentences are true, false, or both; disjunctions like "S or not S" are true).  
     *Target: Both. GA rejects universal application; DA accepts it with dialetheic qualification.*  

  6. **On self-applicability**:  
     - GA: The gappy view can express its own claims (e.g., "the Liar is gappy") without inconsistency, using a meta-language if needed.  
     - DA: The gappy view cannot consistently express "gappy" in its object language, as (c) shows.  
     *Target: Both. GA allows meta-language; DA demands object-language expressibility.*  

  #### VI. Cruxes: Key Points of Disagreement  
  For each crux, both parties agree on the relevant test case and state their predictions.  

  1. **Crux: The meaning of negation in the object language**  
     - **Bearing Sentence**: (a) "This sentence is not true."  
     - **GA Prediction**: (a) is gappy → "Not true" does not mean false (it reflects a gap).  
     - **DA Prediction**: (a) is a dialetheia → "Not true" means false (and is compatible with simultaneous truth).  
     - **Agreed Test**: If (a) is gappy, GA’s view holds; if dialetheic, DA’s view holds.  

  2. **Crux: Expressibility of a theory’s own statuses in its object language**  
     - **Bearing Sentence**: (c) "Either this sentence is not true, or it is neither true nor false."  
     - **GA Prediction**: (c) is gappy → Gappy status can be discussed without inconsistency.  
     - **DA Prediction**: (c) is dialetheic → (c) proves gappy status cannot be coherently stated in the object language.  
     - **Agreed Test**: If (c) is gappy, GA’s expressibility claim holds; if dialetheic, DA’s objection stands.  

  3. **Crux: Treatment of underdetermined but non-paradoxical sentences**  
     - **Bearing Sentence**: (b) "This sentence is true."  
     - **GA Prediction**: (b) is gappy → Ungrounded sentences lack truth values.  
     - **DA Prediction**: (b) is false → Truth requires grounding; (b) has none.  
     - **Agreed Test**: If (b) is gappy, GA’s gap account extends naturally; if false, DA’s falsity default is viable.  

  4. **Crux: Validity of excluded middle for self-referential sentences**  
     - **Bearing Sentences**: (a) and (b).  
     - **GA Prediction**: Excluded middle fails → (a) and (b) are neither, so "S or not S" is untrue.  
     - **DA Prediction**: Excluded middle holds → (a) is both (so "S or not S" is true); (b) is false (so "not S" is true).  
     - **Agreed Test**: If excluded middle fails for (a)/(b), GA’s revision is needed; if it holds, DA’s logic suffices.  

  5. **Crux: Tolerability of true contradictions vs. gaps**  
     - **Bearing Sentence**: (a) as a prototype.  
     - **GA Prediction**: No true contradictions → Gaps prevent explosion and align with "no contradiction" intuition.  
     - **DA Prediction**: True contradictions are tolerable → With explosion rejected, dialetheias are localized and non-trivializing.  
     - **Agreed Test**: If true contradictions are coherently manageable, DA wins; if gaps better preserve consistency, GA wins.  

  #### VII. Verbal Disputes  
  Both parties acknowledge that the following disagreements are partly verbal (i.e., terminological):  
  - **"Not true" vs. "false"**: DA uses "false" to include cases where "not true" holds (even if true simultaneously). GA reserves "false" for a distinct classical value and uses "not true" for a broader category (including gaps). This reflects deeper logical commitments but is mediated by definitions.  
  - **"Excluded middle"**: GA interprets it as "bivalence" (true or false, exclusively); DA interprets it as "exhaustiveness" (true, false, or both). This difference in scope is definitional but consequential.  
  - **"Status"**: GA’s "gap" is a third truth-value status; DA’s "dialetheia" is a glut of values. The dispute over primacy (gap vs. glut) is substantive but hinges on how "truth" and "falsity" are conceptualized.  

  #### Conclusion  
  This document clarifies agreements, isolates disagreements, and specifies testable predictions for sentences (a), (b), and (c). Both parties commit to using these cruxes to structure future debate, with the goal of resolving their deadlock.  

