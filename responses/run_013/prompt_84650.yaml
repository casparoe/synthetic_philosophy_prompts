     - Rejecting the rule of explosion (that a contradiction implies everything) to avoid triviality.
  - The dialetheist view is not committed to:
     - Accepting that every contradiction is true (only specific ones, like the Liar).
     - Having a third truth value (gappy); instead, they allow sentences to have both truth values.

  Disagreements:

  1. On the Liar sentence (a) "this sentence is not true":
     - The gappy view: It is neither true nor false.
     - The dialetheist view: It is both true and false.

  2. On the meaning of "not true":
     - The gappy view: "Not true" does not mean the same as "false" because a sentence can be not true by being gappy without being false.
     - The dialetheist view: "Not true" means false (which may include being both true and false).

  3. On the status of the Truth-teller (b) "this sentence is true":
     - The gappy view: It is neither true nor false.
     - The dialetheist view: It is false.

  4. On sentence (c) "either this sentence is not true, or it is neither true nor false":
     - The gappy view: It is neither true nor false (same as the Liar).
     - The dialetheist view: It is both true and false, and it demonstrates that the gappy view cannot consistently express its own position in the object language.

  5. On the law of excluded middle (LEM): 
     - The gappy view: LEM fails for sentences (a) and (b): for (a), the disjunction (a) or not (a) is not true; for (b), similarly.
     - The dialetheist view: LEM holds for all sentences, including (a) and (b): for (a), (a) or not (a) is true (since (a) is at least true or false, and in fact both); for (b), (b) or not (b) is true (and since (b) is false, not (b) is true).

  6. On the rule of explosion (ex falso quodlibet):
     - The gappy view: The rule is acceptable because there are no true contradictions.
     - The dialetheist view: The rule must be rejected because there are true contradictions and we must avoid triviality.

  Cruxes:

  The following are the key points of disagreement, with each side's prediction for the relevant sentence.

  Crux 1: The nature of negation and the equivalence of "not true" and "false".
  - Bearing sentence: (a) "this sentence is not true"
  - Gappy prediction: (a) is neither true nor false.
  - Dialetheist prediction: (a) is both true and false.

  Crux 2: The expressibility of the theory's own key concepts (like gappy status) in the object language.
  - Bearing sentence: (c) "either this sentence is not true, or it is neither true nor false"
  - Gappy prediction: (c) is neither true nor false.
  - Dialetheist prediction: (c) is both true and false.

  Crux 3: The treatment of ungrounded but non-paradoxical sentences.
  - Bearing sentence: (b) "this sentence is true"
  - Gappy prediction: (b) is neither true nor false.
  - Dialetheist prediction: (b) is false.

  Crux 4: The validity of the law of excluded middle for self-referential sentences.
  - Bearing sentences: (a) and (b)
  - Gappy prediction for (a): LEM fails (i.e., (a) or not (a) is not true).
  - Dialetheist prediction for (a): LEM holds (i.e., (a) or not (a) is true).
  - Gappy prediction for (b): LEM fails.
  - Dialetheist prediction for (b): LEM holds.

  Crux 5: The acceptability of true contradictions and the rule of explosion.
  - Bearing sentence: (a) as an example of a true contradiction (for the dialetheist) or a gappy sentence (for the gappy view).
  - Gappy view: There are no true contradictions, and explosion is acceptable.
  - Dialetheist view: There are true contradictions (like (a)), and explosion must be rejected.

  Verbal Disputes:

  We acknowledge that part of the dispute is verbal: the term "false" in the gappy view excludes the gappy status, while in the dialetheist view, "false" may be present along with true in a dialetheia. Similarly, "not true" in the gappy view includes gaps, while in the dialetheist view it means false (with the possibility of being both true and false). However, these verbal differences reflect deeper disagreements about the structure of truth and logic.

  We also note that the term "true" is understood via the T-schema by both, but the logic in which it operates differs.

  This document is signed by:

  [Gappy Advocate] and [Dialetheist Advocate]

