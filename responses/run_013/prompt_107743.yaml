prompt: |-
  You are an expert in the historical-critical study of the gospels. Begin with a short brainstorm of the full space of things one might demand of a criterion of authenticity—a rule for sorting sayings and deeds that go back to Jesus from those that do not—and only then commit to a list. Write the desiderata: what such a criterion must be able to do to count as adequate for the purpose, with the case or consideration behind each requirement, and mark which requirements are non-negotiable and which are merely commitments of a particular research tradition. As you go, treat each criterion as supplying something like a likelihood ratio—how much more probable the evidence is if Jesus did or said the thing than if he did not—and say what that reframing preserves or destroys in the familiar criteria (embarrassment, dissimilarity, multiple attestation, coherence). The part I most want is the argument that some subset of the requirements cannot be jointly satisfied, and whether that, rather than a simple shortage of evidence, is why the criteria have never settled who he was. Separate what is settled among specialists from what is genuinely contested, and do not present a contested view as the consensus.
reasoning: |-
  Okay, the user is asking about criteria of authenticity in historical Jesus studies. They want me to start with a brainstorm of all possible requirements for such criteria, then commit to a list of desiderata. I need to explain what makes each requirement necessary, whether it's non-negotiable or tradition-specific, and how reframing criteria as likelihood ratios affects traditional approaches like embarrassment, dissimilarity, multiple attestation, and coherence.

  Hmm... the user seems deeply familiar with scholarly debates - they're asking for the argument that some requirements might be fundamentally incompatible. That's sophisticated. They also want clarity on what's truly settled versus contested in the field, avoiding false consensus claims. The core tension they're probing is whether criteria fail due to evidence scarcity or inherent logical flaws.

  First, I should map the full conceptual terrain. What would an ideal criterion need? It must distinguish Jesus from both early Christianity (dissimilarity) and Judaism (double dissimilarity), but that might overcorrect. It needs to handle both sayings and deeds, apply consistently across sources, and resist apologetic/reductionist biases. Statistical robustness matters too - hence the likelihood ratio reframing they requested.

  The likelihood ratio approach is crucial here. Traditional criteria often get misapplied as binary gates rather than probabilistic weights. For example, embarrassment becomes "how much more likely is this if Jesus did it (given church would invent it?)" - but that depends heavily on assumptions about early church behavior. Multiple attestation's strength varies wildly based on source independence assessments.

  Now the critical part: why might criteria fail fundamentally? The big three - dissimilarity, embarrassment, coherence - pull in opposite directions. Dissimilarity demands uniqueness, coherence requires continuity with Jewish context and later church development. Embarrassment relies on assuming specific church sensitivities. These can't all be satisfied simultaneously for most material. 

  For instance, a saying that's Jewishly resonant (failing dissimilarity) but theologically awkward (passing embarrassment) might be authentic, but coherence would then demand it fit other material... which itself may have been selected by contradictory criteria. It's a self-defeating cycle.

  On consensus: specialists agree the criteria are heuristic tools, not magic keys. Most reject dissimilarity as a primary criterion now. They agree no single criterion is decisive. The contested parts are whether any criteria can yield high probability, and how to weight them. Radical critics like those in the Jesus Seminar are outliers in their skepticism.

  The user's unspoken need seems to be understanding why historical Jesus studies remain contentious. The answer lies in this methodological quagmire - it's not just lack of data, but flawed tools that can't resolve their own contradictions. I should emphasize how the criteria's conflicting demands create inescapable circularities.
answer: |-
  Here is a structured analysis of criteria for authenticity in historical Jesus studies, incorporating your specific requirements:

  **Brainstorm: Full Space of Desiderata for a Criterion of Authenticity**
  *   **Discriminatory Power:** Must reliably distinguish authentic material from inauthentic.
  *   **Objectivity/Non-Arbitrariness:** Application should not depend heavily on subjective scholar bias.
  *   **Theoretical Grounding:** Based on sound historical & literary principles.
  *   **Applicability:** Works across diverse material (sayings, deeds, themes) and sources.
  *   **Consistency:** Yields stable results under different applications.
  *   **Probabilistic Output:** Provides a measure of likelihood, not binary yes/no.
  *   **Resistance to Bias:** Minimizes susceptibility to theological/apologetic or skeptical/reductionist agendas.
  *   **Accountability:** Requires explicit justification for its application.
  *   **Contextual Sensitivity:** Accounts for Jesus' 1st-century Jewish context and early Christian development.
  *   **Source Sensitivity:** Handles issues of source independence, reliability, and redaction.
  *   **Falsifiability:** Potential for counter-evidence to challenge its verdict.
  *   **Parsimony:** Avoids unnecessary complexity.
  *   **Explanatory Power:** Helps explain the development of the tradition.
  *   **Feasibility:** Can be practically applied to the available evidence.
  *   **Coherence:** Output should ideally contribute to a coherent historical portrait.

  **Committed List of Desiderata with Cases & Negotiability:**

  1.  **Discriminatory Power (Non-negotiable):**
      *   *What it must do:* Significantly increase or decrease the probability that a saying/deed originates with Jesus versus early Christian communities or other sources (e.g., Judaism, Hellenism).
      *   *Case:* The core purpose. Without this, the criterion is useless.
      *   *Likelihood Ratio (LR) Reframing:* Central to the LR concept. A good criterion provides LR > 1 (supports authenticity) or LR < 1 (counters authenticity).

  2.  **Theoretical Grounding (Non-negotiable):**
      *   *What it must do:* Be based on demonstrable principles of how traditions develop (e.g., tendencies of oral transmission, community formation, theological elaboration, cultural interaction).
      *   *Case:* Criteria lacking grounding (e.g., "sounds profound") are arbitrary. Grounding in historical analogy (e.g., how movements memorialize founders) is essential.
      *   *LR Reframing:* The theoretical model *defines* the conditional probabilities P(Evidence | Authentic) and P(Evidence | Inauthentic) needed to calculate the LR.

  3.  **Contextual Sensitivity (Non-negotiable):**
      *   *What it must do:* Account for material's plausibility within the authentic 1st-century Galilean/Jewish context of Jesus, *and* its implausibility as *solely* a product of later (post-70 AD, Hellenistic, Gentile-majority) Christian communities *without* roots in that context.
      *   *Case:* Authentic material must be intelligible in Jesus' historical setting. Later inventions often reflect later concerns or contexts more clearly.
      *   *LR Reframing:* Raises P(Evidence | Authentic) if the evidence fits the context; lowers P(Evidence | Inauthentic) if the evidence is unlikely to be invented *de novo* in a later, different context. Challenges "Dissimilarity" which often ignores the former.

  4.  **Source Sensitivity (Non-negotiable):**
      *   *What it must do:* Explicitly consider the nature, independence, biases, and redactional activity of the sources attesting the material (e.g., Mark vs. John, Q reconstruction, Paul's epistles).
      *   *Case:* Multiple attestation is meaningless without source independence. Material only in heavily theological gospels (e.g., John) requires different handling than material in Synoptics or Paul.
      *   *LR Reframing:* Directly impacts P(Evidence | Inauthentic). Multiple independent sources lower P(Evidence | Inauthentic), making LR larger. Dependence raises P(Evidence | Inauthentic), lowering LR. Redaction lowers P(Evidence | Authentic) if the form is demonstrably editorial.

  5.  **Probabilistic Output & Accountability (Non-negotiable):**
      *   *What it must do:* Provide a reasoned estimate of its effect on the probability of authenticity (highly likely, plausible, doubtful, highly unlikely), not a definitive verdict. Require explicit justification for *how* the criterion applies and *why* it shifts probability.
      *   *Case:* Avoids overclaiming. Forces scholars to articulate assumptions and reasoning, making arguments testable.
      *   *LR Reframing:* This *is* the LR framing. It replaces binary judgments ("passes/fails") with degrees of support. Preserves the nuanced intent behind criteria but destroys the illusion of certainty often attached to them.

  6.  **Resistance to Bias (Non-negotiable):**
      *   *What it must do:* Minimize susceptibility to being used primarily to confirm pre-existing theological (conservative) or skeptical (radical) conclusions.
      *   *Case:* The field's history shows criteria easily weaponized (e.g., Dissimilarity used to create a non-Jewish Jesus; Embarrassment used to defend miracles).
      *   *LR Reframing:* Forces quantification of assumptions (the theoretical grounding). Makes biases in estimating P(Evidence | Authentic) or P(Evidence | Inauthentic) more transparent and debatable.

  7.  **Explanatory Power (Negotiable - Strong Commitment in Critical Tradition):**
      *   *What it must do:* Help explain the trajectory of the tradition – why authentic material might be preserved *despite* difficulties, or why inauthentic material might arise.
      *   *Case:* Embarrassment inherently does this (preserved *because* authentic despite embarrassment). Dissimilarity implies material was preserved *despite* not serving church needs. Coherence assumes later material aligns because it stems from the same source.
      *   *LR Reframing:* Not directly part of LR calculation, but a test of the *plausibility* of the conditional probabilities assigned. If a criterion's verdict makes the tradition's development inexplicable, the assigned probabilities might be flawed.

  8.  **Dissimilarity to *Both* Judaism *and* Early Christianity ("Double Dissimilarity") (Negotiable - Commitment of Specific Tradition, often critiqued):**
      *   *What it must do:* Identify material unlikely to originate in contemporary Judaism *or* in the early Church, thus most likely from Jesus.
      *   *Case:* Unique material can't be attributed to either source. Rooted in a (flawed) model assuming traditions only add, not subtract.
      *   *LR Reframing:* Raises P(Evidence | Authentic) significantly *if* P(Evidence | Judaism) and P(Evidence | Early Church) are *both* very low. **Problem:** Severely underestimates P(Evidence | Authentic) for material rooted in Judaism (Jesus *was* Jewish!) and overestimates the early Church's tendency to invent non-conforming material. LR often misapplied drastically. *Widely rejected as a primary criterion* by most specialists today due to creating an implausible, ahistorical Jesus.

  **The Core Problem: Incompatible Desiderata & LR Challenges**

  The fundamental reason criteria haven't "settled who he was" is **not simply a shortage of evidence, but the inherent difficulty in satisfying key desiderata simultaneously when framed probabilistically (LR):**

  1.  **Dissimilarity vs. Contextual Sensitivity & Coherence:** Double Dissimilarity (Desideratum 8) demands uniqueness, drastically raising LR *if* applicable. However, this inherently *lowers* P(Evidence | Authentic) for material deeply embedded in Judaism (violating Contextual Sensitivity) and makes a coherent portrait impossible (violating an implicit desideratum for coherence). Applying it strongly creates an implausible Jesus. Weakening it to avoid this drastically reduces its LR effect. **They cannot be maximized simultaneously.**
  2.  **Embarrassment's Contingency:** Embarrassment relies on accurately assessing *early* Christian sensitivities to estimate P(Evidence | Inauthentic) as low (they wouldn't invent embarrassing things). But our knowledge of *exactly* what was embarrassing *to the earliest communities* is limited and debated. Was crucifixion *primarily* embarrassing, or was it rapidly theologized? Was association with sinners embarrassing, or a point of pride? High LR depends on contested historical reconstructions.
  3.  **Coherence's Circularity:** Coherence assumes a core of established authentic material to cohere *with*. But that core is built using other criteria. This creates a feedback loop: Criteria A authenticates Core; Coherence then authenticates material fitting Core, strengthening the apparent validity of Criteria A. LR for Coherence depends entirely on the prior probability assigned to the "core," which itself is contested. P(Evidence | Authentic) is high only if the core is accurate.
  4.  **Multiple Attestation & Source Dependence:** Establishing true independence for calculating a strong LR (P(Evidence | Inauthentic) being *very* low only if sources are independent) is notoriously difficult (Synoptic Problem, Q's existence/nature, John's relationship to Synoptics, Paul's sources). Dependency significantly weakens the LR.

  **What is Settled vs. Contested:**

  *   **Settled (Broad Consensus):**
      *   Criteria are probabilistic tools, not mechanical proof generators.
      *   No single criterion is decisive; results require cumulative argument using multiple criteria cautiously.
      *   Double Dissimilarity is flawed and cannot be a primary criterion; it creates an implausible Jesus.
      *   Contextual plausibility within 1st-century Judaism is paramount.
      *   Source criticism (understanding gospel relationships, redaction) is foundational to applying any criterion.
      *   The burden of proof generally lies on authenticity claims.
      *   The historical core is limited; the gospels contain significant theological interpretation and development.

  *   **Genuinely Contested:**
      *   **The Validity/Weight of Specific Criteria:** How much LR does Embarrassment *actually* provide? Is Coherence methodologically valid or inherently circular? Can Multiple Attestation overcome source dependency issues enough to provide significant LR?
      *   **The Degree of Continuity vs. Discontinuity:** How distinctive *was* Jesus within Judaism? How much did the *earliest* communities innovate vs. conserve? (This directly impacts Contextual Sensitivity, Dissimilarity, Coherence).
      *   **The Independence & Value of Sources:** Reliability of John for historical material? Existence and extent of Q? Nature of Thomas? Dependence of Matthew/Luke *only* on Mark and Q, or other sources? Paul's knowledge of Jesus' teachings.
      *   **The Overall Reconstructability:** Can a coherent, reasonably detailed historical portrait be achieved at all? Some (minimalists, some memory theorists) are deeply skeptical. Others (more traditional critical scholars) believe a broad outline with some specific teachings/events is possible.
      *   **Role of Hypotheses:** How much should broader explanatory hypotheses (e.g., Jesus as apocalyptic prophet, sage, healer, etc.) guide the application of criteria? (Risk of confirmation bias).

  **Conclusion:** The criteria of authenticity, reframed as likelihood ratios, highlight their nature as heuristic tools reliant on contestable historical judgments about context, tradition development, and source relationships. The inability to fully satisfy the core desiderata of **Discriminatory Power, Contextual Sensitivity, and Theoretical Grounding** simultaneously – particularly due to the inherent tension between establishing distinctiveness (high LR via Dissimilarity) and establishing historical plausibility/coherence (high P(Evidence | Authentic) via Context) – is a fundamental methodological weakness. This, combined with source-critical uncertainties and the inherent ambiguities in assessing probabilities like "embarrassment," means the criteria function best as guides for identifying material with *stronger or weaker* claims for consideration, not as arbiters delivering definitive verdicts. The unsettled nature of the quest stems significantly from these methodological conundrums, not merely a lack of data.
