  On life without parole - tricky. While he proposed "perpetual slavery" as an alternative, modern solitary confinement might violate his proportionality principle. He'd likely reject current harsh conditions as excessive. And regarding retributivists... he'd probably attack their core premise that desert justifies severe punishment, arguing all punishment must serve social utility, not vengeance.

