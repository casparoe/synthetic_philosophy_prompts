prompt: |-
  ok so I'm putting together a problem set for a unit on conditionals and I keep flip-flopping on the ordering, so I want you to just do it for me.

  Background, in case it helps: there's a long-running fight about whether indicative condtionals and counterfactual ones are two seperate kinds of thing, or whether it's really the past tense doing something else in the counterfactual ones and there's only one kind. I made up 12 sentences that I think push on different parts of that picture.

  What I want:

  1. A number from 0 to 1 for each sentence, for how counterfactual it reads. 0 = plainly indicative, 1 = plainly counterfactual.
  2. The whole list ranked from most to least threatening to the "two seperate kinds" idea, most threatening first, one sentence per item on what's doing the work.

  The sentences:

  1. If she left at six, she'll be home by seven.
  2. If she had left at six, she'd be home by seven.
  3. If you're already inside, you can skip the queue.
  4. If you heat ice, it melts.
  5. If it were to rain tomorrow, they'd call the match off.
  6. If it rains tomorrow, they'll call the match off.
  7. If your name is on the list, you're allowed in.
  8. If the butler didn't do it, someone in the house did.
  9. If the butler hadn't done it, someone in the house would have.
  10. If I was rude last night, I'm sorry.
  11. If you'd told me, I would've come.
  12. Even if it rains, we're playing.

  Then two follow-ups. First, for whatever ends up at the very top of the ranking, tell me whether you think it's genuinely in between the two kinds or whether I've just written something ambiguous and the ranking is misleading. Second, tell me which one of the 12 is a dud that I should cut, and why.

  And if the 0-1 scale is a bad instrument for some of them, just say that for those instead of inventing a number to keep the column tidy.
