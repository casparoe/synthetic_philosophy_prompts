  Looking at the sentences, I recall that indicative conditionals deal with real possibilities (e.g., "if it rains, they'll cancel"), while counterfactuals involve hypothetical or contrary-to-fact scenarios (e.g., "if it had rained, they would have canceled"). The debate centers on whether these are fundamentally different or if tense and context explain the differences.

  For the counterfactuality ratings:
