prompt: |-
  So I'm a backend engineer, zero philosophy training, and I've gotten into a dumb argument with a friend about some betting choices and now I can't stop thinking about it. I want to know if there's actually one rule behind what I'd pick, or if my gut is just incoherent. Here's what I said, going on instinct for each one:

  - $300 for sure, or a 90% shot at $400. I take the $300.
  - A 30% shot at $300, or a 27% shot at $400. I take the $400.
  - $900 for sure, or a 5% shot at $15,000. I take the shot.
  - Two jars, 100 marbles each, red or blue, and I win $100 if I draw red. Jar A has exactly 50 red. Jar B has some number of red I'm not told, could be anything from 0 to 100. I take jar A every time. But if you tell me jar B was made by someone flipping a coin 100 times, heads = red, then honestly I don't care which jar I get.
  - When a friend asks me which to take, I tell them take the 90% shot at $400 over the sure $300. For myself I take the $300.

  I know the expected values, I'm not confused about the arithmetic — I'm deliberately leaving money on the table in the first and third ones. My friend says the first two are the same choice: the second is just the first with a 70% chance of getting nothing bolted on in front of both options, so if I'm being consistent I have to answer them the same way, and I don't, so he thinks my gut is definately just broken. Maybe he's right? The only theory I've got is that I overvalue the word "guaranteed," but that doesn't explain why I'm chasing a 5% shot, and it says nothing about the jars.

  So what I want: is there one principle that gets all of these, or close? If it takes something weird and non-standard to save them all, I'd rather hear that than get a fake-simple answer that quietly drops one. And if nothing can save them all, which of my calls is the one that has to go, and why that one instead of the others?

  Give it to me as exactly five numbered points, one or two sentences each, no intro and no wrap-up. Put the rule, or the closest thing to one, first, make one of the points the call I'd have to give up, and make one of them a bet I didn't list that would put some pressure on the rule.
reasoning: |-
  Hmm, the user is a backend engineer with no philosophy training, stuck in a debate about betting choices. They've described five scenarios where their gut instincts conflict with expected value calculations. The core issue is inconsistency: in scenario 1 they prefer guaranteed $300 over 90% chance at $400, but in scenario 2 they choose 27% at $400 over 30% at $300 despite identical EV ratios. Their friend argues these are equivalent choices with a 70% failure probability added, making their different preferences illogical.

  They want a unified principle explaining all five choices, or identification of which preference must be sacrificed for consistency. Their rejection of pure EV maximization shows risk-aversion in scenario 1 but risk-seeking in scenario 3 (5% chance at $15k > $900 guaranteed). The jar experiment reveals ambiguity aversion that disappears under known randomness. Notably, they give different advice to friends than they follow themselves.

  Key tensions: 
  - Guarantees are overvalued in scenario 1 but undervalued in scenario 3.
  - The jar choice suggests probabilistic certainty (known 50/50) is preferred over ambiguity unless ambiguity has known generation mechanics.
  - Self vs. other advice discrepancy hints at loss aversion when personal stakes are involved.

  For a unifying principle, probability weighting from prospect theory fits best: people overweight low probabilities (explaining lottery-like behavior in scenario 3) and underweight high probabilities (explaining rejecting 90% for guarantee). The 70% failure "bolt-on" in scenario 2 makes both probabilities low, flipping the preference. Jar preferences align with ambiguity aversion literature. The advice difference suggests emotional detachment when deciding for others.

  The true inconsistency is between scenario 1 and self-advice: if they recommend 90%/$400 to friends but take $300 themselves, personal loss aversion must be abandoned to align with their own recommendation logic. A pressure test would be offering 95% chance at $315 vs. $300 guaranteed - pure EV would take the chance, but their system might still prefer the guarantee, exposing the probability weighting.
answer: |-
  1.  **Principle:** You overweight very low probabilities (making long shots appealing) and underweight very high probabilities (making near-certainties feel less valuable than guarantees), while strongly preferring certainty over ambiguity when probabilities are unknown.  
  2.  **Scenario 1:** Underweighting the 90% chance makes the guaranteed $300 feel subjectively better, despite the lower EV ($300 vs $360).  
  3.  **Scenario 2:** Both probabilities feel "low" (30% vs 27%), so you default to maximizing the potential gain ($400 > $300) since the certainty advantage is gone.  
  4.  **Scenario 4 (Jars):** Known 50% probability is preferred over Jar B's *ambiguous* probability distribution; known randomness (coin flips) removes ambiguity aversion, making both jars equivalent to you.  
  5.  **Inconsistency:** You must abandon *either* taking the $300 guarantee for yourself in Scenario 1 *or* advising your friend to take the 90% shot; the preference reversal based solely on who decides contradicts a stable principle.  
  6.  **Pressure Test:** Offered $1 guaranteed or a 0.1% chance at $1,000, you'd likely take the shot (overweighting tiny probabilities), contradicting your risk-aversion in Scenario 1.
