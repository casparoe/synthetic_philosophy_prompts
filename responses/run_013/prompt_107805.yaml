  Let me structure this carefully. First, the cases any theory must handle: unambiguous aggression (like WWII Germany invading Poland), wars of mutual escalation (like WWI), and tragic systemic wars (like Peloponnesian War). Then the distinctions that mustn't be blurred - causal vs moral responsibility is crucial, also starting vs prolonging war. The constraints are important too - like recognizing decisions were made by elites without hindsight.

  For the analysis part, I'll need to flag which "requirements" are actually Fischer-ist or systemic-view assumptions in disguise. The big tension is indeed between moral agency (requiring individual culpability) and national responsibility (which treats states as actors). That's probably the central philosophical knot. The causality criterion does heavy lifting because if a theory can't handle overdetermined events like July 1914, it fails immediately.

