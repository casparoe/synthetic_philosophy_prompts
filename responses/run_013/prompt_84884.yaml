answer: |-
  Here’s the exam question, model answer, and marking scheme designed to force critical engagement with the underlying tensions between Thomson and Marquis:

  ---

  ### (1) Essay Question  
  **"Consider two scenarios:**  
  **(A) A viable IVF embryo is discarded without ever being implanted.**  
  **(B) A person uses an IUD that prevents implantation of a fertilized egg.**  

  **Thomson’s 'violinist' argument defends abortion by denying that one must allow their body to sustain another life, even if that life has a right to life. Marquis’ 'future-like-ours' (FLO) argument condemns abortion as depriving a being of a valuable future.**  

  **Analyze how effectively *each* argument applies to scenarios (A) and (B). Does Thomson’s argument justify discarding the IVF embryo? Does Marquis’ argument condemn the IUD user?**  

  **Explain where these arguments directly conflict (if anywhere) and where they operate independently. Finally, evaluate what this reveals about whether the core disagreement in abortion ethics concerns the *moral status* of the fetus or the *weight* of competing interests."**  

  ---

  ### (2) Model Answer (650 words)  

  Thomson’s bodily autonomy argument and Marquis’ deprivation argument are often presented as rival positions on abortion, but they address fundamentally distinct questions. Thomson asks what obligations follow *if* we grant a fetus a right to life, while Marquis asks *why* killing is wrong in the first place. Scenarios (A) and (B) expose this divergence starkly, revealing that the arguments only collide under specific conditions.  

  **Scenario (A): The Discarded IVF Embryo**  
  Thomson’s violinist analogy has *no purchase* here. Her argument hinges on the burden of *bodily sustentation*: no one must loan their kidneys or uterus to preserve another’s life. The frozen embryo isn’t sustained by anyone’s body; discarding it imposes no physical demand. Thomson’s framework thus permits disposal—it simply doesn’t apply. In contrast, Marquis’ FLO argument condemns this act decisively. The embryo, if implanted, would likely develop into a person with a full future. Discarding it deprives it of that future, which Marquis equates with the wrong of killing. Here, FLO operates independently, targeting destruction irrespective of bodily use.  

  **Scenario (B): The IUD User**  
  Marquis’ argument faces a serious challenge here. If fertilization has occurred, the egg and sperm have combined to form a zygote with a human genetic code—a being that, if implanted, would have a future like ours. Preventing implantation seemingly deprives it of that future. Yet most ethicists (including Marquis) avoid condemning IUDs, often by arguing the zygote lacks the biological integration necessary for "having" a future. This is ad hoc. If the FLO account grounds wrongness in the *potential* future, the zygote’s future is identical to a newly implanted embryo’s. Thomson’s argument, however, easily excuses the IUD user. Even if the zygote has a right to life, it isn’t yet *using* the person’s body as life support. Preventing implantation is not withdrawing sustenance but refusing to *initiate* it—which Thomson’s framework allows.  

  **Conflict and Independence**  
  The arguments collide *only* when abortion involves *terminating bodily sustentation of a being with FLO*. Thomson permits withdrawal (no duty to sustain); Marquis forbids killing (deprivation of future). They conflict directly here because one prioritizes autonomy, the other the fetus’s future. In (A), they don’t conflict: Thomson is silent, Marquis objects. In (B), they don’t conflict: Thomson permits, while Marquis’ logic *should* condemn but strains to avoid it.  

  **Status vs. Weight**  
  This reveals that granting the fetus a "right to life" (status) doesn’t resolve abortion ethics. Thomson agrees the violinist has that right yet denies he may use your kidneys. Likewise, Marquis’ FLO account doesn’t dictate whether a woman must *provide* her body to prevent deprivation. The core dispute is about *weight*: how heavily fetal interests (like FLO) counterbalance bodily autonomy. Thomson minimizes that weight; Marquis maximizes it. The IVF case shows FLO’s weight *without* bodily conflict; the IUD case shows autonomy’s force *without* killing a developed fetus.  

  **Implication: Timing and Severity**  
  Marquis’ account also implies early abortion is as wrong as late-term abortion since the future lost is identical. This is a feature, not a bug: Marquis *intends* consistency. But it highlights how his argument abstracts from embodied experience. Thomson’s argument, focused on bodily burden, naturally permits earlier abortions more readily.  

  Ultimately, these cases show Thomson and Marquis are ships passing in the night. Marquis explains why killing is wrong *in general* but cannot convincingly address when life begins or why IUDs aren’t murder. Thomson addresses bodily violations but ignores non-bodily destruction like IVF disposal. The abortion debate isn’t settled by proving "status"—it hinges on whether bodily autonomy can override even a fatal deprivation.  

  ---

  ### (3) Marking Scheme (Total: 25 points)  

  | **Key Move**                                                                 | **Marks** | **Common Pitfall (Costs Marks)**                          |  
  |-------------------------------------------------------------------------------|-----------|-----------------------------------------------------------|  
  | **1. Identifies Thomson/Marquis address distinct questions**                  | 5         | Conflates the arguments’ purposes/scopes.                 |  
  | **2. Correctly analyzes IVF (A): Thomson irrelevant, Marquis condemns**      | 4         | Forces Thomson to apply to (A) or ignores Marquis’ force. |  
  | **3. Correctly analyzes IUD (B): Thomson permits, Marquis struggles**        | 4         | Assumes Marquis *must* condemn IUDs without critique.     |  
  | **4. Pinpoints conflict *only* when bodily sustentation + FLO coincide**      | 4         | Claims arguments always conflict or never conflict.        |  
  | **5. Concludes disagreement is about *weight* of interests, not fetal status**| 4         | Assumes granting "right to life" resolves the debate.      |  
  | **6. Notes Marquis implies early/late abortion equally wrong**               | 3         | Overlooks the timing implication or misattributes it.     |  
  | **Clarity & Structure**                                                       | 1         | Disorganized or opaque reasoning.                         |  

  **Grading Notes:**  
  - A **top mark (23-25)** requires all 6 moves with precision.  
  - **Defensible stands:** E.g., arguing Marquis *should* condemn IUDs (if justified) or rejecting FLO’s personhood assumption (if reasoned) earns full credit for moves 2-6 if logically sustained.  
  - **Critical penalty:** Missing that the arguments operate independently in (A)/(B) (Move 4) caps the score at 15/25.  

  ---

  This design forces students to deconstruct the arguments’ architectures, exposes hidden assumptions, and demands synthesis. The IVF/IUD cases prevent stock answers, while the weight-vs-status conclusion targets the meta-ethical heart of the debate.
