prompt: |-
  I recently became a volunteer moderator for the clinical-questions section of a nursing forum, and our worst problems are not obvious misinformation but answers that are true, or sincerely believed, or confidently stated by someone who was not in a position to know. I want a decision procedure my co-moderators and I can actually run on a reported post, grounded in the philosophical debate about whether assertion is governed by knowledge, truth, or belief, but usable by someone who has never read that literature. The forum already distinguishes clinical claims from experience reports; the procedure applies only to the former, and it should also say when a poster must retract a claim rather than merely edit it. Give me the questions to ask in order, what counts as a sufficient answer at each step, where the procedure stops with a clear leave-up or remove, and where it must hand the decision to a human because the remaining question is one of community values rather than fact. Then run it on three cases: a true clinical claim whose poster admits they were guessing; a false claim that is sincerely believed and carefully hedged; and a true, believed, confidently stated claim based entirely on one anonymous online comment. I expect the procedure to give me at least one result I will not like, and I want you to say plainly where it will misfire and what it cannot settle.
reasoning: |-
  Okay, the user is a volunteer moderator for a nursing forum's clinical-questions section. They're struggling with answers that aren't blatantly false but are problematic in subtler ways—like true claims made by guessers, false claims that sound careful, or true claims sourced from dubious places. They want a philosophical yet practical decision tree for moderators who haven't studied epistemology. 

  Hmm, the core tension here is between three philosophical theories of assertion: knowledge norm (you should only assert what you know), truth norm (just be correct), and belief norm (sincerity matters). But the user needs this distilled into actionable steps, not theory. They also want clear thresholds for removal vs. retraction, and examples to stress-test it. 

  First, I should map the philosophical standards to moderation consequences:  
  - Knowledge violations = retraction (guessing undermines authority)  
  - Truth violations = removal (false clinical claims are dangerous)  
  - Belief violations = possible editing (if sincere but wrong, let them clarify)  

  The procedure must flag when community values decide outcomes, like whether "one sketchy source" is forgivable in low-stakes contexts. That’s where human judgment kicks in.  

  For the cases:  
  1. True claim, admitted guesser → Philosophically, this breaks knowledge norm. Moderators would force retraction because guessing in clinical advice is irresponsible, even if lucky.  
  2. False but sincere/hedged claim → Truth norm violated, so removal. Hedging doesn’t cure inaccuracy.  
  3. True claim from garbage source → Tricky! Truth norm satisfied, but knowledge/belief shaky. Procedure would force disclosure or downgrade to "experience," but human mods might remove it anyway because nursing forums can’t risk normalizing bad sourcing.  

  The misfires? If a claim is true and well-sourced but the poster *secretly* disbelieves it, the procedure won’t catch it (can’t audit sincerity). Also, borderline sourcing cases will frustrate users—e.g., "Was that Reddit comment really their ONLY source? Maybe they also read a textbook?" Can’t prove without a confession.  

  User’s unspoken need: They want to enforce rigor without scaring off well-meaning nurses. The examples show they anticipate pushback ("one result you won’t like"). Probably the third case—forcing a "knowledge" downgrade instead of removal—will feel too lenient for clinical safety. But philosophically, truth matters most for harm reduction. Tough balance.
answer: |-
  Here's a **Knowledge-Centered Assertion Assessment Procedure (KCAAP)** grounded in epistemology (primarily the *knowledge norm of assertion*), designed for non-philosopher moderators. It prioritizes clinical safety while respecting sincerity, with clear off-ramps for human judgment.

  ---

  ### **The KCAAP Decision Procedure**
  **Ask these questions in order:**  
  *(Stop when any "Leave Up," "Remove," or "Human Judgment" decision is reached)*

  1.  **Is this a clinical claim?**  
      *   **No →** Exit procedure (handled under experience/opinion rules).  
      *   **Yes →** Proceed to Q2.

  2.  **Is the claim demonstrably false or dangerous?**  
      *   *Check against current clinical guidelines, major textbooks, or Cochrane reviews. Urgency overrules nuance.*  
      *   **Yes → REMOVE IMMEDIATELY** (Truth norm violated; potential harm). *Requires retraction.*  
      *   **No / Unclear →** Proceed to Q3.

  3.  **Did the poster clearly state their source or basis?**  
      *   *Source must be identifiable (e.g., "2023 AHA guidelines," "my hospital's protocol," "UpToDate"). Vague "studies show" or "I learned" fails.*  
      *   **Yes, credible source → LEAVE UP** (Satisfies knowledge/truth norms).  
      *   **Yes, but weak source** (e.g., single anecdote, non-peer-reviewed blog) **→** Proceed to Q4.  
      *   **No source stated →** Proceed to Q4.

  4.  **Can the poster provide a credible source *when asked*?**  
      *   *Moderator request: "Please cite your source for this clinical claim."*  
      *   **Provides credible source → LEAVE UP** (Belief + Truth norms satisfied; knowledge remediated).  
      *   **Provides weak source** (see above) **→** Proceed to Q5.  
      *   **Provides no source / admits guessing →** Proceed to Q5.  
      *   **Refuses / Ignores request → REMOVE** (Violates knowledge norm; unverifiable). *Requires retraction.*

  5.  **Is the claim TRUE (per Q2) and BELIEVED by the poster?**  
      *   *Assess sincerity: language ("I believe," "my experience suggests"), hedging, or direct admission.*  
      *   **True + Believed →** Proceed to **HUMAN JUDGMENT A** (Community values: does weak sourcing/guessing *in this context* warrant removal?).  
      *   **False + Believed → REMOVE** (Truth norm violated). *Editing allowed if corrected to truth with citation.*  
      *   **True + Not Believed** (e.g., admits guessing) **→ REMOVE** (Violates knowledge/belief norms). *Requires retraction.*  
      *   **False + Not Believed → REMOVE** (All norms violated). *Requires retraction.*

  ---

  ### **Human Judgment Points**
  *   **A: True + Believed + Weak/No Sourcing/Guessing:** Should the forum tolerate well-intentioned but poorly supported claims? Factors:  
      *   Stakes of the topic (e.g., dosage calculation vs. general wellness tip).  
      *   Clarity of hedging (e.g., "I *think* this *might* work..." vs. "Do this").  
      *   Poster's stated credentials (RN, student, layperson?).  
      *   **Output Options:** Remove, Leave Up with mod warning, Edit to add "Weak evidence" disclaimer.

  ---

  ### **Case Applications**

  #### **Case 1: True Claim, Admitted Guesser**  
  *   *Claim:* "For neonatal hypoglycemia, give 2 mL/kg D10W IV (correct per guidelines)."  
  *   *Poster adds:* "Honestly, I was guessing based on adult dosing."  
  *   **KCAAP Path:**  
      Q1: Clinical claim → **Yes**.  
      Q2: Not false/dangerous → **No**.  
      Q3: Source stated? → **No** (admits guessing).  
      Q4: Asked for source → **Admits guessing** (no source).  
      Q5: True? **Yes**. Believed? **No** (admits guess). → **REMOVE. Retraction required.**  
      *Why?* Violates knowledge norm. Clinical claims can't rely on luck. "Guessing" undermines authority and safety culture.

  #### **Case 2: False Claim, Sincerely Believed & Carefully Hedged**  
  *   *Claim:* "I *believe* some studies *suggest* that rubbing garlic on a wound *may* reduce infection risk (false; no robust evidence)."  
  *   **KCAAP Path:**  
      Q1: Clinical claim → **Yes** (infection prevention).  
      Q2: Demonstrably false? **Yes** (contradicts CDC wound care guidelines; risk of delay in proper care). → **REMOVE IMMEDIATELY. Retraction required.**  
      *Why?* Truth norm overrides belief/sincerity. Hedging doesn't negate the false clinical advice. Safety risk prevails.

  #### **Case 3: True Claim, Believed, Confidently Stated, Based on One Anonymous Comment**  
  *   *Claim:* "Always use a Z-track technique for IM iron dextran injections (true)."  
  *   *Source:* "I read this in a comment on Reddit."  
  *   **KCAAP Path:**  
      Q1: Clinical claim → **Yes**.  
      Q2: Not false/dangerous → **No**.  
      Q3: Source stated? → **Yes, but weak** (anonymous Reddit comment).  
      Q4: Asked for credible source → **Provides only Reddit comment** (weak source).  
      Q5: True? **Yes**. Believed? **Yes** (confidently stated). → **HUMAN JUDGMENT A**.  
      *Community Values Decision:*  
      *   **Stakes:** High (injection technique affects pain/tissue damage).  
      *   **Sourcing:** Unverifiable, unreliable.  
      *   **Credibility Risk:** Normalizing anonymous sourcing erodes trust.  
      *   **Likely Verdict:** **REMOVE** (or enforce editing with citation + warning). Nursing standards require citable evidence.  
      *Why not automatic leave-up?* True + believed satisfies belief/truth norms, but *knowledge* norm demands reliable sourcing. Community values likely reject Reddit as clinical evidence.

  ---

  ### **Where KCAAP Misfires & Limits**
  1.  **The "Lucky Liar" Problem:**  
      *   *Scenario:* Poster asserts a **true** claim confidently but *knows they're lying* (e.g., cites a fake study).  
      *   **Misfire:** KCAAP likely **Leaves Up** (satisfies Q2 and apparent Q3/Q4).  
      *   *Why:* Cannot audit sincerity without confession. Relies on external reports or pattern recognition.

  2.  **Overly Strict on True Guesses:**  
      *   Case 1 result (remove true guess) **feels harsh** but is philosophically consistent. Clinically, guessing is unethical even when correct. *This is the "result you won't like."*

  3.  **Cannot Settle Disputed Evidence:**  
      *   If Q2 (truth) hinges on conflicting emerging research, KCAAP defaults to **current consensus**. Human judgment needed for evolving science.

  4.  **Burden on Moderators:**  
      *   Requires time for Q2 verification and Q4 requests. Unavoidable for safety.

  5.  **Belief/Hedging Ambiguity:**  
      *   Q5 relies on interpreting language. Human judgment may be needed if intent is unclear (e.g., "I feel like this could work...").

  **Key Insight:** KCAAP prioritizes **knowledge** (justified true belief) as the gold standard for clinical assertions. It rejects uninformed truths and well-intentioned falsehoods equally. Its strength is forcing sourcing and intent into the open; its weakness is reliance on verifiable truth and honest engagement. Use it to scaffold consistent, principle-based moderation—not replace nuanced discussion in borderline cases.
