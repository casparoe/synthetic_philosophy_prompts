answer: |-
  ## Fellowship Proposal: The Self-Consistency of Heuristic Extrapolation  

  **Project Summary**  
  In mathematical practice, heuristic arguments often conclude that a claim holds for "typical" instances, then leap to treating it as *structurally independent* of the details the heuristic ignored. This leap—from *holding randomly* to *holding robustly*—is ubiquitous yet philosophically ungrounded. Existing frameworks (Bayesian confirmation theory, probabilist defeasible reasoning, complexity-theoretic barrier results) either assume this step or explain its failures without justifying its successes. My project formalizes the leap’s *self-consistency*: not whether heuristics are reliable, but whether their *internal structure* licenses treating their conclusion as detail-independent. I develop two novel precision tools—factorization-relative stability and preemptive calibration—to isolate when this move is coherent rather than circular.  

  ### Core Problem and Existing Gaps  
  Heuristic arguments (e.g., "Most graphs satisfy \(P\) under uniform distribution, so \(P\) likely holds independently of edge-set details") rely on an implicit presumption of independence (PoI). Standard approaches misframe this:  
  - **Bayesian accounts** conflate *support for a random instance* with *support for generalization*, ignoring that heuristics specify neither priors over structures nor likelihoods for invariance.  
  - **Complexity barrier results** (e.g., natural proofs) show heuristics *cannot* work for certain classes but don’t model *how* they work when they succeed.  
  - **Defeasible logics** treat PoI as a default rule but don’t diagnose when the heuristic’s *own construction* sabotages it.  

  The gap is *metastructural*: we lack criteria to decide if a heuristic’s *design* permits its intended extrapolation. My seeds address this:  

  ### Seed 1: Factorization-Robust Probability  
  A heuristic \(\mathcal{H}\) defines:  
  - A distribution \(\mathcal{D}\) over instances (e.g., random graphs with edge probability \(p\)),  
  - A conclusion \(C\) (e.g., "graph is Hamiltonian"),  
  - A family \(\mathcal{F}\) of *admissible factorizations* of \(\mathcal{D}\) (e.g., partitioning graphs by degree sequences, girth, etc.—representing "details" \(\mathcal{H}\) ignores).  

  \(\mathcal{H}\) licenses PoI only if \(\text{Pr}_{\mathcal{D}}(C)\) is \(\epsilon\)-stable across all \(\mathcal{F} \in \mathcal{F}\). The heuristic is **self-consistent** if no factorization it admits significantly alters \(C\)’s probability. The puzzle: When does \(\mathcal{H}\)’s *specification of \(\mathcal{F}\)* (e.g., "ignore low-level symmetries") guarantee such stability? Self-consistency fails if \(\mathcal{F}\) contains a "silent destabilizer" (e.g., a factorization by a property correlating with \(\neg C\) in \(\mathcal{D}\)).  

  ### Seed 2: Preemptive Calibration  
  Here, PoI is a precommitment to bet on \(C\) at odds set *before* examining instance-specific details. We adopt a scoring rule \(S\) (e.g., Brier score) and evaluate \(\mathcal{H}\)’s **calibration gap**:  
  \[
  \Delta_{\mathcal{H}} = \sup_{\text{details } d} \left| \mathbb{E}[S(C|\mathcal{H})] - \mathbb{E}[S(C|\mathcal{H}, d)] \right|
  \]  
  \(\mathcal{H}\) licenses PoI if \(\Delta_{\mathcal{H}}\) is small for instances we *can* check, and we have complexity-theoretic evidence that this holds for *all* instances. The failure mode is heuristics calibrated on testable cases but miscalibrated on others due to hidden computational biases (e.g., \(\mathcal{H}\) works for sparse graphs but fails for dense ones, and density is hard to detect).  

  ### Why a Hybrid Methodology?  
  Purely technical approaches (e.g., modifying Bayesian networks or proving complexity lower bounds) miss the *conceptual linkage* between heuristic structure and justification. I integrate:  
  - **Formal epistemology** to define "license" rigorously (seed 1: consistency under self-allowed refinements; seed 2: calibration under resource-bounded access),  
  - **Theory of computation** to enforce tractability and expose instability (e.g., showing certain \(\mathcal{F}\) imply \(\text{NP} \neq \text{P}\) unless stability fails).  

  ### Method and Monthly Plan  
  **Months 1–3:** Formalize both seeds.  
  - *Toy model 1*: Heuristics for random \(k\)-SAT. Define \(\mathcal{D}\) (uniform phase transitions), \(C\) ("unsatisfiable"), \(\mathcal{F}\) (factorizations by clause symmetry, variable occurrence). Test stability under entropy-preserving factorizations.  
  - *Toy model 2*: Erdős–Rényi graph connectivity. Set bets at \(p = \ln n/n\) before generating edges. Compute \(\Delta_{\mathcal{H}}\) when "details" include high-degree nodes (observable) vs. expansion properties (hard to observe).  

  **Months 4–6:** Diagnose failure modes.  
  - For seed 1: Construct a heuristic where \(\mathcal{F}\) contains a destabilizer (e.g., factorizing random graphs by *girth* alters Hamiltonicity probability). Does self-consistency require \(\mathcal{F}\) to be *computationally simple*?  
  - For seed 2: Simulate heuristics for polynomial identity testing (PIT). Show calibration deteriorates when "random" instances hide subspace structures (using arithmetic circuit models).  

  **Months 7–9:** Cross-seed evaluation.  
  - When does factorization stability imply low calibration gap? (Conjecture: only if \(\mathcal{F}\) is learnable with subexponential queries.)  
  - Formalize an "independence hierarchy" linking PoI strength to computational constraints (e.g., PoI for PIT requires derandomization).  

  **Months 10–12:** Synthesize criteria for licensing PoI. Draft dissertation.  

  ### Deliverables and Evaluation  
  A **genuine result** would:  
  - Prove that for a class \(\mathcal{C}\) of heuristics, self-consistency (seed 1) is equivalent to the existence of a tractable refinement of \(\mathcal{F}\) (linking to complexity classes like \(\text{P}/\text{poly}\)).  
  - Show that calibration gaps (seed 2) for \(\mathcal{C}\) are bounded only if certain barrier assumptions hold (e.g., cryptographic pseudorandomness).  

  The project **merely restates assumptions** if stability/calibration become tautological (e.g., defining \(\mathcal{F}\) to exclude destabilizers a posteriori). I avoid this by tying \(\mathcal{F}\) to the heuristic’s *stated* simplifications and using complexity constraints.  

  **Abandoning seed 1 for seed 2** becomes necessary if:  
  - Factorization stability consistently demands \(\mathcal{F}\) be so impoverished it trivializes PoI, or  
  - Calibration gaps better explain real cases (e.g., heuristics for conjectures like \(\text{P} \neq \text{NP}\)).  

  ### Feasibility  
  This is an ambitious 18-month project condensed to 12 months by focusing on concrete toy models first. I will prioritize seed 1 if factorization stability yields crisp complexity ties; otherwise, seed 2 offers a viable pivot by Month 6. The core deliverable—a framework to evaluate heuristic self-consistency—will be achieved by formalizing at least one seed decisively.  

  ### Conclusion  
  Heuristic reasoning rests on an unjustified leap from "typical" to "structural." By treating PoI as a self-consistency test—factorial stability or preemptive calibration—I supply tools to audit this leap internally. This answers a foundational need in proof complexity (how do heuristics guide formal proofs?) and epistemology (when is ignoring details rational?). The fellowship enables this essential bridge-building.
