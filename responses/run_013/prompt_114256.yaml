    "relation_to_rdu_cpt": "REU is structurally similar to rank-dependent utility (RDU) and cumulative prospect theory (CPT) in using a transformation of cumulative probabilities. However, it differs philosophically: REU interprets the weighting function (r) as purely reflecting risk attitude under normative axioms, while RDU/CPT often treat weighting as a descriptive cognitive distortion of probability (blurring belief and attitude). REU also typically assumes a single r for all outcomes, unlike CPT's separate treatments for gains/losses.",
