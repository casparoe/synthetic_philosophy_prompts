  Key disanalogies that impact the practical conclusion: political agents have mutable intentions unlike static pathogens, societies lack biological precision in identifying "nonself," and political systems can't "delete" individuals like thymuses do cells. Decorative disanalogies include physical infection vectors versus ideological spread.

