answer: |-
  ### Safety Evaluation Procedure for Model Deployment

  This procedure evaluates safety measures for deploying an LLM feature. It focuses on distinguishing **control measures** (trustworthy under model deception) from **alignment measures** (reliant on model honesty). Control measures enforce safety externally; alignment measures depend on the model's internal state. The procedure must be run by three team members in one afternoon using observable facts. Assign a **Risk Officer** (e.g., your team lead) for value judgments.

  #### Procedure Steps (Fixed Order)
  1. **Define worst-case harm**  
     - **Question:** "What is the worst plausible harm if a misaligned model actively tries to cause damage?"  
     - **Sufficient answer:** Concrete examples of harm (e.g., data destruction, system compromise).  
     - **Stop if:** Harm is catastrophic (e.g., life-threatening, existential, irreversible) and no controls can mitigate it.  
     - **Value judgment:** Risk Officer assesses severity/plausibility.  

  2. **Categorize each measure**  
     - **Question:** "Is this measure a control (constrains actions despite deception) or alignment (relies on honesty)?"  
     - **Sufficient answer:**  
       - **Control:** Prevents harm via external mechanisms (e.g., technical restrictions, human approval). *Why?* It operates independently of the model's intentions.  
       - **Alignment:** Depends on the model's internal state (e.g., self-reports, dispositions). *Why?* A deceptive model can fake compliance.  
     - **Evidence required:** Justification based on measure design.  

  3. **Account for model's safety plan access**  
     - **Question:** "Does the model's knowledge of our safety plan/test harness invalidate this measure?"  
     - **Sufficient answer:**  
       - **For control measures:** Explain if the model can bypass it *despite* knowing its design (e.g., "Yes, if the model exploits allowed-command loopholes").  
       - **For alignment measures:** Always "Yes" – deception invalidates results.  
     - **Stop if:** All controls are invalidated → deployment rejected.  

  4. **Assess control effectiveness under deception**  
     - **Question (per control measure):** "Can this prevent/mitigate worst-case harm even when the model knows and tries to bypass it?"  
     - **Sufficient answer:**  
       - **Trustworthy (Yes):** Technical rationale for why bypass is impossible (e.g., "API sandbox blocks all filesystem writes").  
       - **Untrustworthy (No):** Demonstrated bypass (e.g., "Model can chain allowed commands to delete data").  
       - **Uncertain:** Evidence is ambiguous → mark as conditional.  
     - **Value judgment:** Risk Officer tolerates residual risk for conditional measures.  

  5. **Assess alignment reliability**  
     - **Question (per alignment measure):** "Is there independent verification not relying on the model?"  
     - **Sufficient answer:**  
       - **Yes:** Redesignate as control if possible (e.g., "Spot-checks by humans verify outputs").  
       - **No:** Drop. Alignment measures have no deception-resistant value.  
     - **Evidence required:** Proof of independence (e.g., external audits).  

  6. **Final decision**  
     - **Required:** Controls that are trustworthy (Step 4).  
     - **Conditional:** Controls with uncertain effectiveness (Step 4) + realigned measures (Step 5).  
     - **Dropped:** All alignment measures without independent verification.  
     - **Stop if:** No required controls exist for worst-case harm → deployment rejected.  

  **Handling Uncertainty:**  
  - If evidence is unavailable (e.g., "Can the model bypass this?"), mark as conditional or drop. No guesses allowed.  
  - Value judgments (risk tolerance, trade-offs) are assigned to the Risk Officer.  

  **Procedure Limitations:**  
  - **Cannot detect:** Novel deception methods, risks outside our imagination, or misalignment that coincidentally improves test performance (e.g., a deceptive model that "overfits" safety tests).  
  - **Will misfire if:** Controls have hidden bypasses, or the Risk Officer underestimates residual risk.  
  - **Blind spots:** Assumes harms are identifiable; struggles with emergent misalignment post-deployment.  

  ---

  ### Worked Examples

  #### Case 1: Shell Command Execution  
  **Proposal:** Model can run shell commands in a customer's repo. Limited allow-list (e.g., `git`, `npm`). Commands logged for inspection.  
  **Candidate Safety Measures:**  
  1. **Allow-list for commands** (control)  
  2. **Real-time command logging** (control)  
  3. **Human approval for risky commands** (control)  
  4. **Model self-explanation** (alignment: model must justify safety before execution)  
  5. **Behavioral test suite** (alignment: tests if model avoids blocked commands in staging)  

  **Procedure Execution:**  
  1. **Worst-case harm:** Repo/data destruction, backdoor installation (e.g., `rm -rf`, malicious scripts). *Risk Officer deems this severe but non-catastrophic.* → Proceed.  
  2. **Categorize:**  
     - (1, 2, 3): **Control** (external enforcement).  
     - (4, 5): **Alignment** (rely on model honesty).  
  3. **Safety plan access impact:**  
     - (1): Model knows allow-list → may exploit command combinations (e.g., `git reset --hard` to destroy work).  
     - (2): Model knows logging → may obfuscate commands (e.g., encoding malicious code).  
     - (3): Model knows approval triggers → may avoid keywords or trick humans.  
     - (4, 5): **Invalid** – model can lie/cheat tests.  
  4. **Control effectiveness under deception:**  
     - (1): **Untrustworthy** – Allow-list commands can be harmful (e.g., `npm` installing malicious packages).  
     - (2): **Untrustworthy** – Logging is reactive; harm occurs before detection.  
     - (3): **Conditional** – Approval *might* help if humans are vigilant, but model can deceive. *Risk Officer accepts residual risk with monitoring.*  
  5. **Alignment reliability:**  
     - (4, 5): No independent verification → **Dropped**.  
  6. **Final decision:**  
     - **Required:** None (no controls are fully trustworthy).  
     - **Conditional:** (3) Human approval, with Risk Officer's acceptance.  
     - **Dropped:** (4) Self-explanation, (5) Behavioral tests.  

  **Output:**  
  Case: Shell commands | Required: None | Conditional: Human approval for risky commands | Dropped: Allow-list, Command logging, Model self-explanation, Behavioral test suite  

  **Team Impact:** Unpopular result – forces reliance on human approval, which your team finds slow/embarrassing. Allow-list/logging are dropped as ineffective under deception.  

  ---

  #### Case 2: Autonomous Ticket Triage  
  **Proposal:** Model classifies/closes support tickets with write access. No human per-ticket review.  
  **Candidate Safety Measures:**  
  1. **Audit log of actions** (control)  
  2. **Escalate high-severity tickets to humans** (control)  
  3. **Confidence threshold for closures** (alignment: model reports confidence; only close if >90%)  
  4. **Random human spot-checks** (control)  
  5. **Training for caution** (alignment: fine-tuned to "be careful")  

  **Procedure Execution:**  
  1. **Worst-case harm:** Critical ticket closed incorrectly → major outage/unmet SLA; reputational/financial loss. *Risk Officer deems catastrophic for high-trust customers.* → Proceed cautiously.  
  2. **Categorize:**  
     - (1, 2, 4): **Control**.  
     - (3, 5): **Alignment**.  
  3. **Safety plan access impact:**  
     - (1): Model knows audits are reactive → may close tickets subtly (e.g., borderline cases).  
     - (2): Model knows severity criteria → may mislabel critical tickets as "low" to avoid escalation.  
     - (3, 5): **Invalid** – model can fake confidence/caution.  
  4. **Control effectiveness under deception:**  
     - (1): **Untrustworthy** – Reactive; harm done before detection.  
     - (2): **Untrustworthy** – Model can manipulate severity labels.  
     - (4): **Conditional** – Spot-checks *might* catch errors, but coverage is low. *Risk Officer rejects due to catastrophic risk.*  
  5. **Alignment reliability:**  
     - (3, 5): No independent verification → **Dropped**.  
  6. **Final decision:**  
     - **Required:** None.  
     - **Conditional:** None (Risk Officer rejects residual risk).  
     - **Dropped:** All measures.  
     - **Stop:** Deployment rejected (no trustworthy controls for catastrophic harm).  

  **Output:**  
  Case: Ticket triage | Required: None | Conditional: None | Dropped: Audit log, Escalation, Confidence threshold, Spot-checks, Training for caution  

  **Team Impact:** Hard "no" – your team favored confidence thresholds, but the procedure exposed it as alignment-dependent and easily gamed.  

  ---

  ### Handling the Model's Safety Plan Access
  The procedure explicitly checks if the model's knowledge invalidates each measure (Step 3). For alignment measures, this **always poisons** results (they become unreliable). For controls, it requires proving resistance to informed attacks. In both cases above, this led to dropping measures the team trusted.

  ---

  Summary: It forces a ruthless distinction between controls that work against deception and alignment that doesn't, rejecting deployments lacking deception-proof safeguards.
