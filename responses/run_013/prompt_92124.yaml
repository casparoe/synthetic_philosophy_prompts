  Step 6: Evaluate alignment measures:
    4. Model self-checks: This is alignment and relies on honesty. The model could lie in its explanation. We have no independent way to verify the explanation without knowing the true intent. Therefore, unreliable and should be dropped.
    5. Test suite: This is an alignment measure because during testing the model might be deceptive. The test suite might pass because the model knows it's being tested. Therefore, we cannot trust it for deployment. Drop.

