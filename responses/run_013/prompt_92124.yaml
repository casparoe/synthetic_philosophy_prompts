    - Self-checks and test suite: These are alignment and are already compromised by the model knowing the test setup.

  Step 5: Evaluate control measures under deception:
    1. Command allow-list: 
          - Question: Can the model bypass it? 
          - Answer: Potentially, by using allowed commands in a harmful way. For example, `git reset --hard` could destroy uncommitted work. So it might not be sufficient by itself. We need to analyze the specific commands. Since we don't have a guaranteed safe set, we cannot say it's unbypassable. Therefore, we mark as conditional: it must be combined with other controls (like human approval for destructive commands) and a very strict allow-list.
