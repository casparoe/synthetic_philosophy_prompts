  ok so I read Montaigne's essay about the cannibals (the one where he says we all call barbarism whatever isn't our own custom) and now I'm kind of stuck on something and dont have anyone to ask about it. He goes on and on about how the cannibals are actually not that bad and in some ways better than us, and how the real barbarians are the Europeans doing all that torturing back home. But he also seems to be saying we shouldn't judge other cultures because everyones customs are just different. Those two things can't both be true right? If he really thinks we can't judge other customs then he can't turn around and call the Europeans barbaric for what they do. And the part I really can't get past — is he actually saying cannibalism is morally fine?? Like is Montaigne really a relativist who thinks eating people is ok as long as its your culture, or is he making some narrower point about how we shouldn't be smug about our own customs? I want to know if I'm supposed to walk away thinking nothing is really wrong, it's all just custom, or if I've completely misread what relativism even means here.
