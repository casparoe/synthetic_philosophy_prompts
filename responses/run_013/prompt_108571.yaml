prompt: |-
  I spent the better part of last night arguing with a friend who is finishing a psychiatry residency, and we ended up exactly where we always end up. I take what I understand to be the naturalist line: there is a fact of the matter about whether a part or process is functioning as it should, fixed by biology — by what the heart is for, by the species-typical organisation of the organism — and our talk of disease tracks that fact, however imperfectly we detect it. He takes the normativist line: that calling something a disease is a value judgment, that the boundary of the pathological is drawn by what we take to be bad and worth treating, and that the biology in my position is a laundered version of my preferences about how bodies ought to work. We are not confused about the facts; we agree about what the heart does and about what happens in every case we discuss; and yet we get no closer. His declassification examples — the conditions medicine once called diseases that we now regard as ordinary variation or as identities — do not move me, and my favourite cases of unambiguous malfunction do not move him. He says the unambiguous ones are precisely the ones whose values are uncontroversial, which is what he would predict; I say his examples are cases where medicine was simply wrong about the biology, which is what I would predict. We have both noticed that our quarrel has the shape of a long-running dispute in the literature rather than a private one, so what I want is a diagnosis rather than a verdict.

  My own hypothesis, which I would like tested rather than confirmed, is that three things are tangled here. The first is an equivocation on "norm": the norm that a function is supposed to supply, in the sense of the species-typical or the design-standard, and the norm of a prescription, in the sense of what ought to be done about a body. Each side hears the other's sense, so the naturalist's claim that function is normative sounds to the normativist like a smuggled ought, while the normativist's claim that disease is a value sounds to the naturalist like a claim that medicine's categories are arbitrary. The second is a difference of question: the naturalist may be asking what makes a disease ascription true, while the normativist is asking what makes a diagnosis warranted — a question about a property against a question about a practice, both conducted under a single word. The third is a genuine question about the reference class. If the fact of the matter really is species-typical functioning, then whether a given trait counts as dysfunctional seems to depend on what we compare it with — the whole species, a local population, the person's own developmental history, the environment they now inhabit — and that choice is not obviously dictated by biology rather than by what we already care about. If the third is doing the work, I would expect this to be a dispute that is in principle decidable but only by a great deal of biology, and to have been mistaken all along for a dispute about values.

  So: what kind of disagreement is this, really, and what would count as progress given that answer? I do not want a survey of the positions or a reading list — no citations, I will take your word for it — but a diagnosis supported by what each side actually commits itself to, a verdict on which of my three hypotheses, or what fourth possibility I have not seen, is doing the stalling, and an honest statement of what would move it: a distinction, a piece of biology, a change of question from whether something is a disease to something else, or an argument that this one should be abandoned because there is nothing here to move. And if you conclude that my friend and I are simply asking different questions under one word, tell me what the two questions are, and whether either of them is the one I am actually asking when I say that a failing heart is a diseased heart.
reasoning: |-
  Okay, the user has had a long-standing debate with their psychiatrist friend about whether disease is a natural biological fact or a value judgment. They've identified three potential tangles: equivocation on "norm," different questions (truth vs. warrant), and the reference class problem. They want a diagnosis of the disagreement, not just a verdict.

  First, I need to unpack their three hypotheses. The user is clearly well-versed in the philosophy of medicine, given their nuanced analysis. They're frustrated because factual agreement doesn't resolve the dispute. Their core request is diagnostic: why does this persist despite shared facts?

  The equivocation on "norm" seems crucial. The naturalist uses "norm" as statistical/functional typicality, while the normativist hears prescriptive "ought." This linguistic overlap creates cross-talk. When the naturalist says "the heart should pump blood," they mean evolutionarily designed function, but the normativist interprets it as moral prescription.

  The question difference is equally important. The naturalist cares about ontological status ("what makes a disease true?"), while the normativist focuses on epistemic practice ("when should we diagnose?"). These are different levels of analysis – one about the world, one about human actions.

  The reference class problem reveals both positions' vulnerabilities. If disease requires species-typicality, what counts as the species baseline? Biology alone can't define the comparison class – is it global population or local ecology? This selection inevitably involves values about what variations matter.

  But there's a fourth issue: both positions are actually hybrids. The naturalist relies on unstated values (why care about functional disruption?), while the normativist smuggles in biological facts (why call deviations "dysfunctions" at all?). Each needs elements of the other to be coherent.

  Progress won't come from "winning" but from mapping boundaries. For clear physiological failures (failing heart), both frameworks converge. Disagreements arise at edges (chronic fatigue, autism) where biology is murky and values diverge. The key is recognizing when disputes are empirical (what's the functional impact?) vs. evaluative (should we medicalize this?).

  The user's real question when calling a failing heart diseased likely combines both: it's factually malfunctioning (naturalist) AND we should treat it (normativist). The entanglement serves practical needs – medicine requires both dimensions. Abandoning either question would impoverish clinical practice.

  To move forward, they should test their disagreements against cases where biology and values pull apart: conditions with biological bases that some embrace as identity. This exposes where their frameworks diverge and what each actually prioritizes.
answer: |-
  Your diagnosis is remarkably astute – you've identified the core philosophical knots with precision. This isn't a mere factual disagreement; it's a **clash of explanatory frameworks and foundational commitments**, where each view captures essential but incomplete truths about medicine. Your three hypotheses are interconnected parts of the tangle, but **the primary engine stalling resolution is the second: you are fundamentally asking different questions.** Here's the breakdown:

  1.  **The Crux: Ontology vs. Epistemology/Practice (Your Second Hypothesis)**
      *   **Your Question (Naturalist Core):** "What *is* a disease? What constitutes the objective state of affairs in the world (biological malfunction) that the term 'disease' *refers to*, independent of our judgments?" You seek the **ontological ground** – the biological fact that makes a disease ascription *true* or *false*. Your "failing heart" is diseased *because* it objectively fails to perform its evolved physiological function, regardless of whether anyone diagnoses it or values heart function.
      *   **Your Friend's Question (Normativist Core):** "What does it *mean* to *call* something a disease? What justifies the *act* of diagnosis and treatment within a social and medical practice?" They focus on the **epistemic and pragmatic context** – the human activity of labeling, intervening, and the values driving it. The failing heart is diagnosed *because* its malfunction causes harm *we* care about (death) and *we* have interventions *we* value. The act of diagnosis itself *is* the value-laden judgment of "badness" warranting medical attention.

  2.  **How Your Other Hypotheses Entwine with This:**
      *   **Equivocation on "Norm" (Hypothesis 1):** This arises *because* of the different questions.
          *   The naturalist's "norm" (species-typical function) answers the ontological question: *this* is the baseline against which malfunction is defined.
          *   The normativist's "norm" (prescription/valuation) answers the pragmatic question: *this* is the standard we use to decide when a deviation warrants the label and resources of "disease."
          *   The naturalist hears the normativist's "value judgment" as potentially undermining the *reality* of the malfunction. The normativist hears the naturalist's "biological norm" as smuggling in an unacknowledged value about *which* functions matter (why pumping blood? Why not something else?).
      *   **Reference Class Problem (Hypothesis 3):** This is a genuine difficulty *within* the naturalist ontological project, *exposed by* the normativist's pragmatic critique.
          *   *If* disease is defined by deviation from species-typical function, biology alone struggles to definitively specify the relevant reference class (species? Population? Individual history? Environment?). Choosing this class involves selecting *which* biological variation is relevant to "function" in a way that matters for health/disease. This selection *can* be influenced by pragmatic concerns (what variations cause problems *we* notice/care about?).
          *   This problem doesn't destroy the naturalist core (a failing heart is dysfunctional in *any* plausible reference class), but it highlights vulnerabilities at the boundaries, making some cases appear more like the normativist description. It shows that *applying* the ontological concept requires choices that aren't purely value-free, even if the underlying dysfunction might be.

  3.  **The Fourth Element: The Hybrid (and Necessary) Nature of Medicine:**
      *   Both views capture essential, interdependent aspects of actual medical practice:
          *   **Naturalist Anchor:** Medicine *depends* on discovering objective biological dysfunctions (pathophysiology, genetics, etc.). A treatment targeting a non-existent biological glitch fails. Biology constrains what *can* be a disease.
          *   **Normativist Engine:** Medicine is a *goal-directed human practice* aimed at relieving suffering, preventing death, and promoting well-being *as defined by human values*. Without the "badness" criterion, we wouldn't label harmless variations (e.g., red hair, benign anatomical quirks) as diseases, even if they deviate statistically.
      *   **The Stalemate:** Each side implicitly (and sometimes explicitly) denies the *necessity* of the other's core element within their own framework:
          *   You see values as merely *tracking* the biological facts (imperfectly).
          *   Your friend sees biological facts as merely *tools* used within the value-laden practice.
      *   **The Reality:** Medicine is **irreducibly hybrid**. The ontological fact (biological dysfunction) and the evaluative judgment (this dysfunction causes significant harm warranting intervention) are *both* necessary, but *neither* is sufficient alone, to define a medical disease *in practice*. A purely naturalist definition includes harmless dysfunctions. A purely normativist definition risks medicalizing any disliked condition.

  **What Would Count as Progress?**

  Progress won't come from "winning" the ontological or pragmatic argument outright. It comes from **mapping the boundaries and dependencies:**

  1.  **Acknowledge the Different Questions Explicitly:** Stop arguing past each other. Frame discussions as: "Are we discussing what *makes* this a biological dysfunction (ontological) or what justifies *treating* it as a disease (pragmatic)?" Recognize both are valid questions related to the complex phenomenon of "disease."
  2.  **Identify Points of Convergence and Divergence:**
      *   **Convergence:** Where significant biological dysfunction *and* significant harm are uncontroversial (your failing heart, untreated bacterial infection). Here, both frameworks align. Arguing here is futile and misses the point.
      *   **Divergence:** Focus debate *specifically* on "boundary" cases where biology is complex or values are contested (chronic fatigue syndromes, autism spectrum, gender dysphoria, mild hypertension, obesity). Here, ask:
          *   *(To Naturalist):* "What *specific, objective biological dysfunction* is present here that is analogous to a failing heart valve? Is the evidence strong enough to support an ontological claim of 'malfunction' at an organic level, distinct from statistical variation or adaptive responses?"
          *   *(To Normativist):* "Setting aside contested biology, *what specific harms* does this condition cause that warrant the label 'disease' and medical intervention? Are these harms intrinsic, or primarily societal? Are there alternative frameworks (disability, identity, social problem) that might be more appropriate?"
  3.  **Accept the Hybrid Model:** Recognize that a mature concept of *medical* disease requires both elements. Ask: "Does this condition involve a *plausible biological dysfunction/pathophysiological process* **AND** does this dysfunction cause *sufficient harm/distress* **AND** is medical intervention a *proportionate and effective response*?" This forces engagement with both sides.
  4.  **Use Biology to Constrain Values, Use Values to Guide Biology:** Acknowledge that:
      *   Biology sets boundaries – we can't validly call something a disease *caused by* biology if no biological basis exists or if it's demonstrably functional.
      *   Values set priorities – biology alone cannot tell us *which* dysfunctions are important enough to label "disease" and devote resources to; that depends on the harm caused within a human context.

  **Answering Your Final Question:**

  When you say "a failing heart is a diseased heart," **you are asking a combined question that relies on both frameworks, but emphasizing ontology.** You are asserting:
  1.  **(Ontological Claim):** This heart exhibits an *objective biological malfunction* (failure of its evolved pumping function).
  2.  **(Implicit Pragmatic Claim):** This malfunction is *sufficiently severe* to warrant the label "disease" (because you implicitly agree pumping blood is vital, and its failure is "bad").

  The naturalist provides the core ontological justification (1). The normativist explains why we apply the powerful social/medical label "disease" and intervene (2). **The stalling occurs because you each mistake the other's necessary contribution for an attempt to replace your own core commitment.** Progress lies not in abandoning either question, but in understanding how they interlock to define the complex reality of medicine.
