  First, I need to distill their thesis into one clear paragraph. The key points: interpretive burden (who recovers meaning/absorbs social risk), standing (who can demand truth), and how white lies are wrong because they deny standing, not just misrepresent. Cultural conventions determine standing, so the same sentence can be a white lie or courtesy in different contexts. Got it—keep it concise but cover all elements.

  Next, objections in order. The senior pragmaticist will challenge with Gricean maxims. Reply: universal principles need calibration, but interpretive burden explains why calibration differs culturally. Weakness: might still be seen as reducible to Grice. The linguistic anthropologist worries about grading cultures. Reply: descriptive, not evaluative; standing is convention-dependent. Weakness: moral terms like "wrong" could imply judgment. Kantian objects to licensing deception. Reply: truth-telling still required when standing exists; white lies wrong because they ignore this duty. Weakness: if standing is conventional, does that allow opting out? Virtue ethicist asks about betrayal of trust. Reply: trust presupposes standing; wrong is breaking that link. Weakness: feels abstract compared to relational betrayal. Grad students want measurability. Reply: empirical methods like discourse analysis, reaction studies. Weakness: operationalizing "burden" is tricky.

  Concessions upfront: 1) Not denying universals, just adding a layer. 2) "Wrong" is normative but context-specific. 3) Standing isn't the only factor in trust. Preempts digging.

  The dread question: If conventions define standing, can oppressive norms make denying truth okay? User fears it exposes relativism. Reply: Distinguish descriptive analysis from normative critique; conventions can be unjust. Weakness: feels like dodging moral evaluation.

  Overall, ensuring replies address each scholar's framework while candidly noting weaknesses. Keeping it podium-ready—no jargon overload, direct comebacks. User’s deep need: confidence defending a novel interdisciplinary claim against heavyweights without getting flattened. Prep sheet must arm them for precise, poised responses that acknowledge pitfalls but hold the line.
answer: |-
  Here’s your prep sheet, designed for quick reference during Q&A:

  ---

  **The Claim in One Paragraph**  
  Communication norms differ not primarily in how much honesty or politeness is valued, but in *who bears the interpretive burden*: the speaker (for clarity) or the hearer (for inference), and who has *standing* to demand truthful disclosure. A white lie is wrong not primarily as misrepresentation, but as a denial of the hearer’s standing to receive truth—a standing defined by community conventions. Thus, the same utterance (e.g., "This dish is interesting") may constitute a white lie in a high-standing-demand context (e.g., Japan, where hearers are expected to infer criticism) but mere courtesy or neutrality in a low-standing-demand context (e.g., Netherlands, where speakers bear the burden of clarity).

  ---

  **Objections, in the Order They Will Come**  

  1.  **"This is just Gricean maxims with cultural calibration. What does ‘interpretive burden’ add?"**  
      *(Senior Pragmaticist)*  
      **Reply:** Grice assumes cooperation requires *speakers* to be perspicuous, placing the burden on them. My account shows cultures systematically vary whether burden falls on speaker (to be clear) or hearer (to infer), altering the *baseline expectation* for cooperation. Standing norms determine *when* a maxim of quality is socially activated—e.g., a Dutch hearer has standing to demand directness, triggering the maxim; a Japanese hearer often does not, suspending it. This explains why calibration isn’t ad hoc but structurally patterned.  
      **Weakness:** Risks sounding like terminological relabeling of "calibration."  

  2.  **"You’re smuggling in moral evaluation (‘wrong’) to describe neutral conventions, imposing an external hierarchy."**  
      *(Linguistic Anthropologist)*  
      **Reply:** My use of "wrong" is internal to the normative structure *of the convention itself*. Within a community where hearers have standing, denying that standing *by convention* violates the local norm (like breaking a promise). I’m not judging Dutch vs. Japanese norms as better/worse; I’m arguing each has *its own* criteria for when an utterance constitutes a betrayal. This is descriptive of the norm’s logic, not prescriptive across cultures.  
      **Weakness:** Using moral language ("betrayal") inherently feels evaluative, even if intended descriptively.  

  3.  **"If lying’s wrongness depends on local standing conventions, doesn’t this justify deception wherever convention allows it?"**  
      *(Kantian)*  
      **Reply:** No, because my account doesn’t negate the duty to tell the truth *when standing exists*. The wrong in a white lie is *specifically* denying due standing. If convention grants standing (e.g., a doctor asking for symptoms in Netherlands *or* Japan), lying *is* straightforwardly wrong as misrepresentation + standing-denial. My point is that whether an utterance *counts as lying* depends on whether standing was owed *in that context*. Truth-telling is still obligatory where standing is operative.  
      **Weakness:** Implies truth-telling duties are contingent on social facts, which Kantians reject.  

  4.  **"This feels detached from the lived experience of betrayal. Isn’t the core wrong that trust is violated, not standing denied?"**  
      *(Virtue Ethicist)*  
      **Reply:** Trust *presupposes* standing. To feel betrayed, you must first believe you had a *right* to the truth in that context. My account grounds *why* that sense of right (trust) exists or doesn’t: it’s constituted by the standing convention. The "wrong" of a white lie is the speaker unilaterally deciding the hearer lacks the status to warrant truth, breaking the trust *generated by* the mutual recognition of standing. It explains *when* trust is normatively expected.  
      **Weakness:** May seem to reduce the visceral emotion of betrayal to a cold normative structure.  

  5.  **"How do you measure ‘interpretive burden’ or ‘standing’ empirically? Isn’t this untestable?"**  
      *(Grad Students)*  
      **Reply:** Burden can be operationalized:  
      *   **Production:** Analyze discourse for explicitness markers (hedges, qualifiers), directness frequency, and repair strategies when misunderstood.  
      *   **Comprehension:** Measure reaction times/accuracy to implied vs. direct meanings in context; track when hearers seek clarification vs. infer.  
      *   **Standing:** Elicitation tasks ("Would it be appropriate for X to demand a clearer answer from Y in this scenario?"); document sanctions for directness/indirectness breaches.  
      It’s falsifiable: finding a community where high directness coexists with hearer burden (or vice versa) would challenge the model.  
      **Weakness:** Operationalizing "burden" as a single dimension is reductionist; real talk is messy.  

  ---

  **Concessions to Make Up Front**  
  1.  **"This isn’t a *replacement* for Grice or politeness theory; it’s a framework for understanding *how* cultural norms configure their application."**  
  2.  **"The term ‘wrong’ here refers to a *norm-internal* violation, not a universal moral condemnation. Its valence depends entirely on the convention."**  
  3.  **"Standing is *one* factor in trust/honesty, not the whole story. Power dynamics, intimacy, and context also matter."**  

  ---

  **The Question I Am Hoping Nobody Asks**  
  **Question:** "If standing is defined by convention, couldn’t a deeply oppressive convention (e.g., denying women standing to demand truths from men) make it *not wrong* to systematically deceive them under your model? Doesn’t this endorse moral relativism?"  
  **Why I Dread It:** It forces me into normative ethics quicksand I’ve carefully avoided, potentially alienating both the relativist (if I condemn) and the Kantian (if I concede). It exposes a tension between descriptive analysis and moral critique.  
  **Least-Bad Answer:** "My model *describes* how conventions internally generate norms of truth-telling. Critiquing a convention *as oppressive* requires external normative resources (e.g., justice, equality). Within the convention, deceiving women might not violate local standing norms; but we can still argue *that convention itself* is morally flawed because it denies basic moral agency. The descriptive account doesn't preclude external critique; it helps identify *where* the ethical failure lies—in the standing rule, not (only) the individual deception."  

  ---  

  **Key to Podium Use:** Keep the "Claim" paragraph and "Concessions" mentally front-loaded. For objections, glance at the one-liner to anticipate who’s speaking, then use the reply bullet points. Flag the "Weakness" internally to avoid overclaiming. If the dreaded question comes, pause, then lean into the distinction between description/normative critique. Good luck!
