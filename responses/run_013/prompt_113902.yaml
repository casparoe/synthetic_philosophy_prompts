prompt: |-
  I am the model-risk lead at a company whose risk score is licensed to two public agencies: a large urban school district that uses it to rank applicants for oversubscribed seats, and a state child-welfare department that uses it to order referrals for investigation. Both agencies set their own decision thresholds, so whatever we certify about the score may not hold at the cutoff they actually operate. Our regulator has rejected our last submission as evasive — it said only that the score was 'not calibrated on any protected attribute' — and now requires a written statement, per release, of the fairness criterion the score is designed to satisfy, why the alternatives were rejected, and who bears the cost of the choice. I accept that equal calibration within groups, equal false-positive rates, equal false-negative rates, and equal selection rates cannot all hold at once when groups differ in base rate; I don't need that argued again. What I need is the procedure my team runs before each release: the questions in order, what counts as a sufficient answer to each, which steps are engineering and which are value decisions belonging to the agency rather than to us, and the point at which the procedure ends in a refusal to ship. It has to survive the case where the outcome label is a biased record of what it purports to measure — arrests rather than offences, substantiated reports rather than actual harm — and the case where a subgroup is too small for its error rates to be estimated with any confidence. Run it on both deployments, whose base rates and error costs differ, and tell me what the procedure cannot settle.
reasoning: |-
  We are designing a procedure for the model-risk lead to certify a risk score for release, given the constraints and requirements from the regulator. The procedure must address:
  1. The fairness criterion the score is designed to satisfy, why alternatives were rejected, and who bears the cost of the choice.
  2. The fact that the agencies set their own thresholds, so we must certify properties that hold across the entire score distribution or are invariant to threshold choice.
  3. The potential bias in the outcome label and the issue of small subgroups.

  We cannot require that all four fairness criteria (calibration, equal FPR, equal FNR, equal selection) hold simultaneously. Therefore, we must choose one (or a subset) and justify why.

  Given the two deployments:
  - School district: ranks applicants for oversubscribed seats. Base rate (proportion of "desirable" applicants) likely varies by group. The cost of a false positive (rejecting a desirable applicant) and false negative (accepting an undesirable applicant) might be seen as high. But note: the school district uses the score to rank, so they will set a cutoff. The actual outcome might be biased (e.g., based on past admissions which might reflect historical bias).
  - Child-welfare department: orders referrals for investigation. Base rate (proportion of actual harm) likely varies by group. The cost of a false negative (failing to investigate a case with actual harm) is very high, while a false positive (investigating a case with no harm) also has costs (intrusion, family stress). Again, the outcome label might be based on substantiated reports, which could be biased.

  The procedure must be robust to:
  - Biased labels: we cannot assume the outcome label is unbiased.
  - Small subgroups: we must have a way to handle groups that are too small for reliable error rate estimation.

  We propose the following procedure:

  **Procedure for Pre-release Certification**

  **Step 1: Define Protected Attributes and Relevant Subgroups**
  - **Question:** What are the legally protected attributes and relevant subgroups for each deployment context? (e.g., race, gender, income level, etc.)
  - **Who decides:** The agency (school district or child-welfare department) must provide this list, as it is a value decision about which groups require protection.
  - **Sufficient answer:** A list of protected attributes and the specific categories within each attribute that are of concern. For example, for race: Black, White, Asian, etc. The agency must also define any intersectional groups they wish to consider (e.g., Black females) but note that small sample sizes may become an issue.
  - **Handling small subgroups:** If a subgroup is too small (e.g., less than 30 instances in the evaluation data) for reliable estimation, we will note that we cannot evaluate fairness for that subgroup and require the agency to acknowledge and accept this limitation.

  **Step 2: Choose a Primary Fairness Criterion**
  - **Question:** What is the primary fairness criterion the score is designed to satisfy? (We present the agency with the options and the trade-offs.)
  - **Who decides:** The agency must choose the primary criterion because it involves value trade-offs (e.g., which type of error is more costly). However, we (as the model developer) must ensure that the chosen criterion is compatible with the model's design and can be measured with available data.
  - **Options and Trade-offs:**
    - **Equal calibration (calibration by group):** The score should be equally predictive across groups. This is invariant to threshold. However, if the base rates differ, then other criteria (like equal FPR or FNR) will not hold. Also, if the labels are biased, calibration may not reflect true outcomes.
    - **Equal false positive rates (FPR):** The rate at which low-risk individuals are incorrectly flagged as high-risk is equal across groups. This is important when the cost of a false positive is high (e.g., unnecessary investigation in child welfare).
    - **Equal false negative rates (FNR):** The rate at which high-risk individuals are missed is equal across groups. This is important when the cost of a false negative is high (e.g., missing a child in danger).
    - **Equal selection rates:** The proportion of each group that is selected (above threshold) is equal. This might be desired in the school context to ensure diversity, but it can conflict heavily with base rates.

    We explain that due to base rate differences, we cannot satisfy all at once. We also note that:
    - In the school context: The goal is to select the best applicants. If the score is well-calibrated, then the ranking is fair in the sense that the score reflects the same probability of success regardless of group. However, if the outcome label (e.g., past success) is biased, then calibration might not be the right target.
    - In the child-welfare context: Minimizing harm is critical. Equal FNR might be chosen to ensure that no group is systematically under-investigated. But if the labels are biased (e.g., substantiated reports are influenced by bias), then FNR might not capture the true harm.

    **Sufficient answer:** The agency must choose one primary criterion and provide a written justification for why it was chosen and why the others were rejected. We then document that the model was optimized and evaluated for that criterion.

    **Note:** We must also document that the chosen criterion might not hold at every threshold, but we will evaluate it at a set of thresholds and report the range of disparities. We require that the disparity does not exceed a pre-defined tolerance at any threshold (or on average, but we must be cautious because the agency might choose a threshold that falls in a high-disparity region).

  **Step 3: Evaluate the Chosen Fairness Criterion**
  - **Question:** Does the model satisfy the chosen fairness criterion within an acceptable tolerance?
  - **Who decides:** Engineering (our team) runs the evaluation, but the agency must set the tolerance.
  - **Procedure:**
    - We compute the chosen fairness metric (and the others for context) across a range of thresholds (for rate-based metrics) and for the entire distribution (for calibration).
    - For calibration: we check calibration curves and compute the Expected Calibration Error (ECE) by group, or use a statistical test for calibration (e.g., Hosmer-Lemeshow by group). We require that the difference in average predicted probability and observed event rate per group is within a tolerance (e.g., 0.05) and that the ECE is similar across groups.
    - For FPR and FNR: we compute the metric at multiple thresholds (e.g., 0.1, 0.2, ... , 0.9) and check that the absolute difference between groups does not exceed the tolerance (e.g., 0.05) at any threshold. Alternatively, we can check the area between the ROC curves by group? But note: we are concerned about specific points (the thresholds the agency might choose). We might also look at the minimum and maximum disparity over thresholds and require that the maximum disparity is below the tolerance.
    - For selection rate: we check the selection rate at multiple thresholds and require that the ratio (or difference) between groups is within a tolerance.

    **Handling biased labels:** We cannot correct for biased labels. Therefore, we document that the evaluation is based on the available labels and that the fairness assessment is conditional on these labels. We require the agency to acknowledge that the labels may be biased and that this might affect the fairness evaluation.

    **Handling small subgroups:** For subgroups too small for reliable estimation (e.g., less than 30 instances in the positive class for FNR, or in the negative class for FPR), we do not compute the metric and instead report that there is insufficient data. The agency must then decide whether to aggregate the subgroup with others (if legally and ethically permissible) or accept that we cannot evaluate fairness for that group.

    **Sufficient answer:** We produce a report showing the metrics for all groups (with confidence intervals when possible) and flag any group that exceeds the tolerance. We also report the other fairness metrics for transparency.

  **Step 4: Address Failures and Disparities**
  - **Question:** If the model fails the chosen fairness criterion for one or more groups, what is the plan?
  - **Options:**
    - **Mitigate:** We attempt to retrain the model using fairness constraints (e.g., adversarial debiasing, reweighting, or post-processing) to reduce the disparity.
    - **Adjust the criterion or tolerance:** The agency might relax the tolerance or change the criterion (but this requires going back to Step 2 and re-justifying).
    - **Acknowledge and accept:** The agency might accept the disparity, providing a justification (e.g., due to base rate differences, or because the disparity is in the direction that benefits the historically disadvantaged group). However, we must ensure this is legally defensible.
  - **Who decides:** The agency must decide on the action plan, but we (engineering) can only retrain if the agency requests mitigation and provides resources. We might refuse to ship if the disparity is large and the agency does not accept it or request mitigation.

  **Step 5: Document and Assign Responsibility**
  - **Question:** Who bears the cost of the fairness choice?
  - **Who decides:** We (the model developer) and the agency jointly document the costs. The agency must acknowledge that they bear the cost of the trade-offs inherent in their choice of fairness criterion and tolerance. For example:
    - Choosing equal FNR might lead to higher FPR in some groups, which might result in over-investigation of those groups (in child welfare) or over-rejection (in school admissions). The agency must acknowledge that they are responsible for these costs.
    - Choosing calibration might lead to unequal selection rates if base rates differ, and the agency must accept that this is a consequence of their choice.
  - **Sufficient answer:** A written statement by the agency that they understand the trade-offs and accept the costs. We also document that we, as the model developer, bear the cost of ensuring the model meets the chosen criterion (if possible) and that the agency bears the cost of the societal impact of the trade-offs.

  **Step 6: Final Certification and Refusal to Ship**
  - **Question:** Is the model ready for release?
  - **Procedure:** We check:
    - The agency has provided the protected groups and chosen a fairness criterion with justification.
    - The model meets the chosen fairness criterion within the tolerance set by the agency for all groups with sufficient data.
    - For groups with insufficient data, the agency has accepted the lack of evaluation.
    - The agency has provided a written statement accepting the costs.
  - **Refusal to ship:** We refuse to ship if:
    - The agency does not provide the required inputs (protected groups, criterion, tolerance, acceptance of costs).
    - The model fails the chosen criterion for one or more groups with sufficient data and the agency does not accept the disparity or request mitigation (and mitigation is not feasible or fails).
    - We discover a technical flaw in the model that prevents a fair evaluation (e.g., data leakage).

  **Running the Procedure on Both Deployments**

  **Case 1: School District (Oversubscribed Seats)**
  - **Step 1:** Protected attributes: race, income level (as defined by the district). Subgroups: e.g., Black, Hispanic, Asian, White; low-income, high-income. The district might also want intersectional groups (e.g., Black and low-income). If any subgroup is too small, we note it.
  - **Step 2:** The agency (school district) chooses calibration as the primary criterion because they want the score to reflect the same probability of success for applicants regardless of group. They reject equal selection rates because they are not aiming for demographic parity, and equal error rates because they are more concerned with the accuracy of the ranking than with equal error rates at a threshold they haven't set. They acknowledge that if base rates differ, selection rates will differ.
  - **Step 3:** We evaluate calibration by group. We find that for the group "Black", the observed success rate is systematically lower than the predicted probability (by 0.07 on average). We check the data and note that the outcome label is based on past academic performance which might be biased. We report this to the agency. The agency sets a tolerance of 0.05. The disparity (0.07) exceeds the tolerance. We move to Step 4.
  - **Step 4:** The agency has three options. They might:
    - Request mitigation: we try to recalibrate the model for the Black group (post-processing) but then note that this breaks the ranking (because the scores are adjusted only for one group). Alternatively, we might retrain with a fairness constraint. However, the agency might be concerned about the impact on other groups.
    - Adjust the tolerance: they might relax the tolerance to 0.08? But 0.07 is still within 0.08? Or they might not.
    - Accept the disparity: they might argue that the bias in the labels is causing the miscalibration and that they believe the true base rate is actually reflected by the model. This is risky. Alternatively, they might accept the disparity because they have other affirmative action policies that will adjust for it.
  - **Step 5:** The agency accepts the cost: they state that they will use additional criteria (not solely the score) for admissions to ensure diversity and mitigate any potential unfairness. They bear the cost of any harm from the miscalibration in the score.
  - **Step 6:** We agree to ship because the agency has accepted the disparity and the cost.

  **Case 2: Child-Welfare Department (Order Referrals)**
  - **Step 1:** Protected attributes: race, ethnicity, and family income. The state defines the groups: White, Black, Hispanic, and Others. The "Others" group is small (only 1% of the data). We note that we cannot reliably evaluate for "Others".
  - **Step 2:** The agency chooses equal FNR as the primary criterion because they cannot afford to miss high-risk cases in any group. They reject calibration because they care about the ordering at the top (high risk) and want to ensure that the rate of missing true cases is equal. They reject equal FPR because they are willing to tolerate higher false positives in some groups to achieve equal FNR. They reject selection rates because it is not a goal.
  - **Step 3:** We evaluate FNR at multiple thresholds. We find that at the threshold that gives an overall FNR of 0.1, the FNR for the Black group is 0.15 and for the White group is 0.08 (difference 0.07). The tolerance set by the agency is 0.05. We also note that the outcome label (substantiated reports) might be biased: Black families might be over-investigated and thus have more substantiated reports even if the true harm rate is the same. But we cannot adjust for that. We report the disparity.
  - **Step 4:** The agency must decide. They might:
    - Request mitigation: we try to adjust the model to equalize FNR (e.g., by post-processing or using a fairness-aware algorithm). However, this might require increasing the score for Black cases to reduce FNR, which would lead to more false positives for Black families. The agency must consider if they are willing to bear that cost.
    - Accept the disparity: they might not because the disparity is in the direction of higher FNR for the Black group, which is unacceptable in their mission.
  - **Mitigation attempt:** We retrain the model with a constraint to equalize FNR. We succeed in reducing the FNR disparity to 0.04 (within tolerance) but at the cost of increasing the FPR for Black families from 0.2 to 0.3 (while the FPR for White families remains at 0.2). The agency must now decide if they accept this trade-off.
  - **Step 5:** The agency accepts the trade-off: they state that they are willing to have higher false positives for Black families to ensure they are not missing true cases at a higher rate. They bear the cost of the increased burden on Black families and the potential for community distrust.
  - **Step 6:** We ship the retrained model.

  **What the Procedure Cannot Settle**
  1. **Biased labels:** The procedure cannot resolve the issue of biased outcome labels. We can only use the provided labels and document the potential bias. The agency must acknowledge this and bear the risk.
  2. **Small subgroups:** The procedure cannot provide fairness guarantees for groups too small to evaluate. The agency must decide whether to aggregate, ignore, or collect more data.
  3. **Value trade-offs:** The procedure does not dictate which fairness criterion is "right". It forces the agency to make the value choice and document it. We cannot resolve disputes about which trade-off is better.
  4. **Unforeseen disparities:** The procedure evaluates only the protected groups provided. It might miss disparities in unexamined groups or intersectional groups that were not defined (due to sample size or agency choice).
  5. **Long-term societal impact:** The procedure does not assess the long-term impact of the model on the groups (e.g., feedback loops). The agency must consider this separately.
  6. **Legal compliance:** The procedure does not guarantee legal compliance. The agency must consult legal experts to ensure their choices comply with anti-discrimination laws.

  This procedure provides a structured way to make the fairness choices explicit, assign responsibility, and document the rationale. It should satisfy the regulator by showing due diligence and transparency.
answer: |-
  Below is a step-by-step procedure for your team to run before each model release. It addresses the regulator's requirements, handles biased labels and small subgroups, specifies agency vs. engineering responsibilities, and ends with clear pass/fail criteria. The procedure is designed for both your school district and child-welfare deployments, with notes on how base rate differences and error costs impact each step. Finally, I clarify what the procedure **cannot settle**.

  ---

  ### **Pre-Release Fairness Certification Procedure**  
  **Goal**: Produce a regulator-compliant statement on the fairness criterion, justify rejected alternatives, assign cost responsibility, and determine if the model can be shipped.  
  **Inputs**:  
  - Protected attributes (defined by agency)  
  - Validation dataset (with outcome labels)  
  - Agency's chosen fairness criterion and tolerance thresholds  
  - Context on outcome label limitations (e.g., arrests ≠ offenses)  

  **Outputs**:  
  - A written statement for the regulator.  
  - A "ship/don't ship" decision.  

  ---

  ### **Step-by-Step Questions and Procedures**  
  #### **Step 1: Define Protected Groups and Acknowledge Label Bias**  
  **Question**: *"What protected attributes and subgroups must the model be evaluated against, and what are the known limitations of the outcome labels?"*  
  - **Who decides**: **Agency** (value decision). Agencies must define protected groups (e.g., race, income) based on legal/social context.  
  - **Engineering role**:  
    - Flag subgroups with sample size < 30 in either class (positive/negative) as "high uncertainty."  
    - Document outcome label limitations (e.g., "arrests may overrepresent marginalized groups" or "substantiated reports may undercount harm in low-income areas").  
  - **Sufficient answer**:  
    - Agency provides a list of protected groups.  
    - Agency acknowledges label bias risks in writing (e.g., "We recognize arrests are imperfect proxies for guilt").  
  - **Failure to ship**: If agencies refuse to define groups or acknowledge label bias.  

  **Example deployments**:  
  - **School district**: Groups = race, income. Labels = historical admissions data (may reflect past bias).  
  - **Child welfare**: Groups = race, geography. Labels = substantiated reports (may miss unreported harm).  

  ---

  #### **Step 2: Select Fairness Criterion and Justify Trade-offs**  
  **Question**: *"Which fairness criterion must the model satisfy, and why are alternatives rejected?"*  
  - **Who decides**: **Agency** (value decision). Agencies choose one primary criterion based on their error cost preferences.  
  - **Engineering role**:  
    - Explain trade-offs using base rate differences (no need to re-prove impossibility).  
    - Highlight deployment-specific risks:  
      - *School district*: False positives (rejecting qualified applicants) may harm equity; false negatives (accepting unqualified) may waste resources.  
      - *Child welfare*: False negatives (missing high-risk cases) may endanger children; false positives (unnecessary investigations) may traumatize families.  
  - **Sufficient answer**: Agency provides:  
    - **Chosen criterion** (e.g., "equal calibration within groups").  
    - **Rejected alternatives** with justification (e.g., "We reject equal FPR because it would increase false negatives in Group X, which has a lower base rate").  
    - **Cost bearer**: Agency explicitly states who bears the cost (e.g., "Applicants bear FNR costs; taxpayers bear FPR costs").  
  - **Failure to ship**: If agency fails to justify or assign costs.  

  **Common choices**:  
  - **School district**: Likely **calibration** (fair ranking) or **equal FNR** (minimize missed opportunities).  
  - **Child welfare**: Likely **equal FNR** (no group faces higher risk of missed harm) or **calibration** (accurate risk estimates).  

  ---

  #### **Step 3: Evaluate Fairness Under Label Uncertainty**  
  **Question**: *"Does the model satisfy the chosen criterion within tolerance, given label uncertainty?"*  
  - **Who decides**: **Engineering** (technical test).  
  - **Procedure**:  
    1. **Estimate metrics** for chosen criterion (e.g., calibration error, FPR, FNR) across all protected groups.  
    2. **Handle small groups**:  
       - If subgroup size < 30, report metric with 95% confidence intervals (CI).  
       - If CI width > 0.15 (e.g., FNR = 0.10 ± 0.12), mark as "indeterminate."  
    3. **Handle label bias**:  
       - Quantify disparity *without* assuming labels are unbiased (e.g., "FNR difference: 5% but labels may undercount harm in Group A").  
       - Sensitivity analysis: Simulate bias (e.g., "If label noise is 20% higher in Group A, disparity increases to 8%").  
  - **Sufficient answer**:  
    - Pass: All evaluable groups meet agency's tolerance (e.g., calibration error < 0.05).  
    - Fail: Any evaluable group violates tolerance.  
    - Indeterminate: Small groups remain unreliable after CI check.  
  - **Failure to ship**: If any evaluable group fails.  

  **Example deployments**:  
  - **School district**: Test calibration. If base rates differ (e.g., Group A: 30% qualified, Group B: 10%), calibration may hold while FPR/FNR diverge.  
  - **Child welfare**: Test equal FNR. If labels are biased (e.g., undercounting in Group A), FNR may appear equal but mask real disparity.  

  ---

  #### **Step 4: Mitigation and Agency Acceptance**  
  **Question**: *"If the model fails or has indeterminate groups, does the agency accept the risk?"*  
  - **Who decides**: **Agency** (value decision).  
  - **Procedure**:  
    - Engineering reports failures/indeterminate cases.  
    - Agency may:  
      - **Accept**: "We ship despite 8% FNR disparity in Group X due to data limitations."  
      - **Mitigate**: Adjust model (e.g., reweight data) or decision thresholds (e.g., set group-specific thresholds).  
      - **Reject**: Cancel release.  
  - **Sufficient answer**: Agency provides written acceptance/mitigation plan for failures/indeterminate cases.  
  - **Failure to ship**: If agency rejects the risk or mitigation is infeasible.  

  ---

  #### **Step 5: Finalize Regulator Statement and Ship Decision**  
  **Question**: *"Does the package satisfy all regulator requirements?"*  
  - **Engineering role**: Compile:  
    - Fairness criterion, justification, cost bearer (from Step 2).  
    - Evaluation results (Step 3) and agency acceptance (Step 4).  
    - Limitations (label bias, small groups).  
  - **Ship if**:  
    - Agency defined groups/justified criterion (Step 1–2).  
    - Model passes chosen criterion OR agency accepts failures (Step 3–4).  
  - **Do not ship if**:  
    - Agency avoids value decisions.  
    - Unmitigated fairness failures.  

  ---

  ### **What the Procedure Cannot Settle**  
  1. **Ground-truth bias**:  
     - The procedure cannot resolve disparities caused by biased labels (e.g., arrests ≠ offenses). It only quantifies disparities *under provided labels* and forces agencies to acknowledge uncertainty.  
  2. **Small-group fairness guarantees**:  
     - Groups with insufficient data (<30 samples) cannot be reliably assessed. The procedure flags these but cannot certify fairness for them.  
  3. **Long-term societal costs**:  
     - While agencies assign costs (Step 2), the procedure cannot validate if this is ethically/socially optimal (e.g., "Do marginalized groups disproportionately bear costs?").  
  4. **Threshold-specific fairness**:  
     - Fairness at agencies' custom thresholds is not guaranteed. The procedure tests criteria invariant to thresholds (e.g., calibration) or evaluates across thresholds (e.g., FPR curves).  
  5. **Criterion conflicts**:  
     - The procedure does not resolve disagreements between criteria (e.g., if calibration and FNR conflict). It forces the agency to choose and justify one.  

  ---

  ### **Summary Workflow for Both Deployments**  
  | Step | School District Example | Child Welfare Example |
  |------|-------------------------|------------------------|  
  | **1** | Groups: Race/income. Labels: Biased admissions data. | Groups: Race/geography. Labels: Underreported harm. |  
  | **2** | **Criterion**: Calibration (fair ranking). **Rejected**: Equal selection (would force quotas). **Costs**: Applicants bear FNR costs. | **Criterion**: Equal FNR (no missed high-risk cases). **Rejected**: Equal FPR (would increase FNR). **Costs**: Families bear FPR costs. |  
  | **3** | Pass: Calibration error < 0.05. Fail if Group A error = 0.08. | Pass: FNR difference < 0.03. Fail if Group X FNR gap = 0.06. |  
  | **4** | Agency accepts 0.08 error due to small sample. | Agency requests mitigation for 0.06 gap. |  
  | **5** | **Ship** with documentation of acceptance. | **Ship** after mitigation reduces gap to 0.02. |  

  This procedure ensures rigorous, regulator-compliant certification while respecting agency autonomy on value decisions. It ends in a refusal to ship only when agencies avoid responsibilities or unmitigated failures exist.
