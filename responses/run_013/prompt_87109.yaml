prompt: |-
  I chair the editorial standards committee at a mid-sized scholarly publisher. There are four of us, two without any linguistics background, we meet monthly for ninety minutes, and the docket routinely runs to eight or ten disputed usages. Our decisions bind every imprint until the next revision of the house style guide, three years out, and the editor-in-chief signs off on whatever we send up. Until this past spring I would have called this the least interesting job in the building. Then a manuscript on early modern political thought came in using "man" and "he" for the generic human throughout the argument, not just inside quoted sources, and when the copyeditor queried it the author replied that the usage was traditional, that "man" has always included women, and that changing it would import a political agenda into a work of scholarship. Two of my committee members agreed with him. The third said the usage made the book unreadable. I had no way to decide, and I have eight more items like it on the docket.

  What finally gave me a handle on the problem was Douglas Hofstadter's satire "A Person Paper on Purity in Language," written under the pseudonym William Satire, in which a defender of the status quo argues that "white" is the natural inclusive term for all people and that the reformers who want to substitute "person" everywhere are politicizing the language. The narrator's central defense — that "white is a mixture of all the colors of the rainbow, including black," and that used inclusively the word has no connotations whatsoever of race — is precisely the move I keep hearing from authors about "man." The piece also mocks the etymological defense, in which the "-white" of "chairwhite" is said to be a different word from the noun "white" because it is pronounced differently, and it mocks the supposed shrillness of the people asking for the change. My reading is that the satire's real target is a term that looks neutral to the people it already includes while marking everyone else, and that the way to expose this is to swap in a category that is not the default and watch the sentence turn strange.

  Please write the procedure my committee can actually run. I do not need a reading list, and I do not need a survey of positions on language and gender; I need something four people can execute in a single meeting, on a single sentence, without me in the room. Specifically:

  - Give me an ordered set of no more than eight questions, each with what counts as a sufficient answer, what to do when the answer is contested or unavailable, and where the procedure terminates.
  - Include a substitution test the committee can perform on a sentence in the meeting, with instructions for choosing the substitute term, for handling terms that have no clean marked counterpart, and for the case where the substitution produces something merely odd rather than revealing.
  - Mark clearly the three kinds of output the procedure can produce: change the usage, keep the usage, and this is a values question rather than a usage question, in which case the committee decides and records the dissent. Do not let the third category swallow the first two.
  - Say which distinctions from the satire have to survive the translation into a committee procedure — I take it the default/marked asymmetry, the difference between a term used generically and a term merely claimed to be generic, and the difference between an author's own voice and a quoted source are candidates — and which can be dropped, including the race analogy itself.
  - Run the procedure on three items from my docket. First, the early modern manuscript. Second, a history monograph whose quoted eighteenth-century sources use "men" for persons, where the copyeditor wants to modernize inside the quotation marks. Third, a proposal to replace "manhole" in our engineering list with a neutral compound, where the term is a term of art and the replacement would confuse readers. At least one of the three should come out against the reform-minded instinct, and I want to see the reasoning that gets there.
  - Tell me what the procedure cannot do, including the case where the house itself wants to use ironic or parodic framing in the style guide's rationale, and the risk that a reader takes the parody straight.
  - Identify where judgment cannot be eliminated and the committee has to record a minority position rather than manufacture a rule.

  Be committed. Give me the procedure you would actually adopt, with definite recommendations on each of the three items and definite answers about where the procedure stops. If you think one of my instincts is wrong — that quoted sources should be left alone, that terms of art are exempt, that "man" is a special case because of its etymology — say so and say why. State your confidence in the procedure as a whole, and identify the single step most likely to misfire on my docket.
reasoning: |-
  Okay, the user chairs an editorial standards committee at a scholarly publisher. They're dealing with a tricky issue: authors using "man" and "he" generically, claiming it's traditional and inclusive. The committee is divided, and they need a practical procedure to handle such disputes efficiently. 

  Hmm, the user is clearly frustrated—this problem exploded from "least interesting job" to a major headache. They found Hofstadter's satire insightful but need to operationalize it into a decision-making tool. Their request is highly structured: they want a step-by-step protocol, not theoretical debate. 

  Key challenges I notice: 
  - They need neutrality (can't appear ideologically driven)
  - Must work within 90-minute meetings
  - Decisions have 3-year binding consequences
  - Committee lacks linguistics expertise 

  The satire's core insight about "default/marked asymmetry" is genius—shows how "inclusive" terms actually exclude. But translating that into committee questions? Tricky. Need to avoid: 
  - Endless philosophy debates 
  - False equivalence ("both sides valid")
  - Letting authors veto with "tradition" claims 

  Ah! The substitution test is the golden key. But must handle edge cases: what if no clean parallel exists? Or if the substitution just sounds weird but not oppressive? 

  For the procedure... let's build it around three filters: 
  1) Is this actually generic? (Test with substitution) 
  2) Is the resistance about tradition or power? (Satire's race analogy reveals this) 
  3) Are there functional reasons to keep it? (Terms of art etc.) 

  Biggest risk: Committee members might say "substitution feels odd but I can't explain why"—that's where the "values question" escape hatch kicks in. But mustn't let that become the default outcome. 

  For the test cases: 
  - Early modern MS: Change "man" to "person". The substitution test with "white" reveals the exclusion. 
  - 18th-century quotes: DON'T modernize. Substitution breaks source integrity. 
  - "Manhole": Keep it. Technical term, substitution ("personhole"?) is absurd. 

  Confidence level? 85%. Weakest step is Q5—determining if awkwardness reveals exclusion or just unfamiliarity. But Hofstadter's "chairwhite" example shows how to spot the difference. 

  Final thought: User's instinct to protect quoted sources is correct. Their "terms of art exempt" instinct? Partly—function overrides inclusion when meaning breaks. But "man" isn't special due to etymology; that's a dodge. 

  Procedure's limits: Can't handle parody well, and can't fix societal biases—only flag exclusionary mechanics. But for their 90-minute meetings? This should cut through 80% of disputes.
answer: |-
  Here's a procedural framework incorporating Hofstadter's insights, designed for efficient committee execution. It prioritizes linguistic mechanics over ideological debate while exposing exclusionary dynamics. **Confidence: 85%**. Weakest step is Q5 (substitution interpretation), but clarity rules mitigate this.

  ---

  ### **Procedure: Generic Term Assessment Protocol (GTAP)**
  **Input**: A contested generic term (e.g., "man," "he") in a specific sentence + context (author’s voice/quotation/term of art).  
  **Output**: (A) Change usage, (B) Keep usage, (C) Values decision (recorded dissent).  
  **Steps** (Execute in order; terminate at any "sufficient answer"):

  1. **Is the term in a direct quotation or historical source?**  
     - *Sufficient "Yes"*: Keep usage. Output (B).  
     - *Contested*: If ambiguity exists (e.g., paraphrased source), proceed.  
     - *Terminates here if "Yes."*

  2. **Is the term a technical term of art with standardized meaning?**  
     - *Sufficient "Yes"*: Keep usage. Output (B).  
     - *Contested*: Requires evidence from 3+ field-specific reference works. If unavailable, proceed.  
     - *Terminates here if "Yes."*

  3. **Substitution Test**:  
     - **Substitute term selection**:  
       - *Default*: Replace contested term with a **marked social category** (e.g., "white," "Christian," "able-bodied") that is not the historical default in English.  
       - *If contested term has no clean counterpart*: Use "white" (per Hofstadter) or "native-born" as default substitutes.  
     - **Apply substitution** to the sentence (e.g., "Man is political" → "White is political").  
     - **Committee reads new sentence aloud**.

  4. **Does the substitution introduce ambiguity about who is included?**  
     - *Sufficient "Yes"*: The original term likely functions as a *marked* (non-inclusive) generic. Proceed to Q5.  
     - *Sufficient "No"*: Keep usage. Output (B).  
     - *Contested*: Vote (majority wins). Proceed either way.

  5. **Does the substitution reveal exclusion, not just oddness?**  
     - *Test*: Ask: "Does the new sentence sound like it *actively excludes* some groups, or is it merely awkward?"  
     - *Sufficient "Excludes"*: Change usage. Output (A).  
     - *Sufficient "Merely awkward"*: Proceed to Q6.  
     - *Contested*: Output (C). Record dissent. Terminate.

  6. **Is there functional disruption beyond stylistic preference?**  
     - *Examples*: Breaks parallelism, creates ambiguity, conflicts with defined terms.  
     - *Sufficient "Yes"*: Keep usage. Output (B).  
     - *Sufficient "No"*: Change usage. Output (A).  
     - *Contested*: Output (C). Record dissent. Terminate.

  ---

  ### **Key Satire Elements Retained**
  - **Default/Marked Asymmetry**: Exposed via substitution (Q3–Q5).  
  - **Generic vs. Claimed Generic**: Tested via substitution’s effect (Q4–Q5).  
  - **Author’s Voice vs. Quotation**: Protected in Q1.  
  - **Dropped**: Race analogy (use is illustrative, not prescriptive); etymological defenses (irrelevant to function).

  ---

  ### **Test Cases**
  1. **Early Modern Manuscript (Author uses "man" generically)**  
     - Q1: Not a quotation → Proceed.  
     - Q2: Not a term of art → Proceed.  
     - Q3: Substitute "white": "**White** is a political animal."  
     - Q4: Ambiguity? **Yes** (Who counts as "white"?).  
     - Q5: Exclusion revealed? **Yes** (Non-white readers implicitly excluded).  
     - Q6: Functional disruption? **No** (Changing to "human" works).  
     - **Output (A): Change usage.**  
     *Why*: Substitution exposes exclusion; no functional or historical justification for retention.

  2. **History Monograph (Modernize "men" in 18th-century quotes?)**  
     - Q1: **In quotation → Output (B): Keep usage.**  
     *Why*: Q1 terminates procedure. Altering quotes violates historical integrity. Copyeditor’s request rejected.

  3. **Engineering Text ("Manhole" → "Utility access point"?)**  
     - Q1: Not a quotation → Proceed.  
     - Q2: **Term of art?** Evidence: Standardized in OSHA, ANSI, industry manuals → **Output (B): Keep usage.**  
     *Why*: Q2 terminates. Replacement risks confusion; etymology irrelevant. *Reform rejected per protocol*.

  ---

  ### **What the Procedure Cannot Do**
  - **Handle irony/parody in style guides**: Satire requires context. If the committee adopts ironic framing (e.g., "Resolved: ‘white’ is truly inclusive"), readers may take it literally. **Recommendation**: Avoid humor; state rationale neutrally.  
  - **Resolve deeply held values disputes**: Q5 may force a values call (C) if committee splits on "exclusion vs. oddness."  
  - **Address intersectional terms**: Substitution struggles with terms lacking clear marked counterparts (e.g., "freshman").  
  - **Override disciplinary norms**: Fields reclaiming problematic terms (e.g., "queer" in gender studies) require Q2 evidence.

  ---

  ### **Where Judgment Persists & Minority Positions**
  - **Q5 (exclusion vs. oddness)**: Requires interpretation. If no consensus, output (C) and record: *"3 members found ‘man’ substitution exclusionary; 1 found it merely awkward."*  
  - **Q6 (functional disruption)**: "Disruption" is subjective. Record dissenting views.  
  - **Q2 (term of art)**: Requires evidence assessment. Minority may dispute sources.

  ---

  ### **Your Instincts Reviewed**
  - **Quoted sources left alone**: **Correct**. Protected by Q1.  
  - **Terms of art exempt**: **Conditionally correct**. Q2 requires evidence, not blanket exemption. "Manhole" qualifies; "manhours" likely does not.  
  - **"Man" special due to etymology**: **Incorrect**. Etymology doesn’t negate modern exclusion (per Q4–Q5). *Hofstadter mocks this via "chairwhite"*.

  ---

  ### **Final Recommendations**
  - **Adopt GTAP verbatim**: Forces concrete tests, minimizes ideological debates.  
  - **Track Q5 outcomes**: If >30% result in (C), revisit substitution guidelines.  
  - **Sample rationale for style guide**: *"Generic ‘man’ fails the substitution test for inclusivity. Exceptions: quotations, vetted terms of art."*  
  - **Your docket forecast**: 70% resolved at Q1/Q2/Q4; 20% at Q5; 10% at Q6/(C).

  **Commit**. This forces the question: Does the term *function* as inclusive, or merely claim to? Hofstadter’s lens makes the invisible visible.
