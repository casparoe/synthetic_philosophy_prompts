prompt: |-
  So I'm putting together a little thought experiment: imagine Zhuangzi got dropped into today and had to weigh in on two things that obviously didnt exist in his time. First, cryonics — the freeze your head after death and hope to get revived later thing. Second, so-called "griefbots": a company trains a chatbot on your texts, emails and voice notes, then lets your family keep chatting with something that sounds like you after you're gone, and in the fancier versions it keeps learning and can message them first. Say a guy explicitly told his family he wanted nothing to do with this, and they went ahead and did it anyway, feeding it even his private journals that he never showed anyone.

  Ground it in what Zhuangzi actually seems to think about death, transformation, mourning, the body, what counts as "you" — don't just give me vibes, and no need for quotes or sources, just argue it. If you think he'd have no settled view on one of these, say so rather than inventing one.

  Lay it out like this:
  - What we're working from: a few sentences on the relevant bits of his actual stance
  - Cryonics: one paragraph, his likely take and why
  - Griefbots: one paragraph, same, including the journal thing and whether he'd see the bot as the guy continuing or as something else wearing his memories
  - Where I'd expect him to shrug: 2-3 sentences on what you're least sure about
  - Bottom line: a sentence or two
