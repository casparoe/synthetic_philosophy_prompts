prompt: |-
  My collegue in HPS keeps an informal scoreboard on right-but-early theories and I need to know what she'll do with the case I'm putting up in seminar next week. Her calls so far: Malthus — no, not right but early, the prediction failed; and she adds that the standard rescue doesn't even get off the ground, because the demographic transition is something Malthus's own theory predicts (the preventive checks), so it isn't an external fix at all. Ehrlich's famine forecasts — falsified, no rescue, and the later claim that it's happening now is a different claim. Hubbert's 1956 call that US oil would peak around 1970 — vindicated, risky, dated, and it landed. Limits to Growth — not a prediction in the first place, just a model with free parameters, so the question doesn't arise.

  Next week's case: a grad student wants to argue that global peak oil was right but early. Same curve-fitting applied to world production, forecasts through the 90s and 2000s that the global peak was imminent or already behind us, and then it didn't arrive on schedule, thanks to unconventional oil and a demand story nobody modelled. Will she say right but early, or falsified? Give me your best guess, the rule she's actually running, at least one other rule that fits all four of her verdicts just as well, and the case that would seperate them. I care more about the rules than the verdict.
reasoning: |-
  Okay, let me tackle this HPS scoreboard puzzle. The user's colleague has clear patterns in judging "right-but-early" theories, and now they need to predict how she'll rule on global peak oil claims. 

  First, I need to unpack her existing verdicts. Malthus gets a "no" because his famine prediction failed, and crucially, the demographic transition wasn't an external fix - it was part of his own preventive checks. That suggests she demands both predictive accuracy and rejects rescues that are theoretically endogenous. 

  Ehrlich's famine forecast is straightforwardly falsified with no valid rescue. Hubbert's US oil peak gets full credit: correct prediction, dated explicitly, and it landed. Limits to Growth is dismissed as not even being a real prediction due to its unfalsifiable parameters. 

  The pattern seems to hinge on three things: whether the prediction was concrete and dated, if the failure had endogenous explanations within the theory, and whether later events constitute a valid "rescue." For global peak oil, the postponement due to unconventional oil and demand factors appears exogenous - not part of the original Hubbert curve model. That fits her rejection of "external fixes" in Ehrlich's case. 

  But here's the twist: she might consider if the core mechanism (resource depletion logic) remains valid despite timing errors. Yet her Malthus ruling suggests endogenous explanations kill the "early" defense. Since unconventional oil wasn't modeled, it's likely seen as an external patch. 

  I can think of two possible rules she might be using: 

  Rule A (strict): Requires both (1) dated testable prediction and (2) no endogenous explanation for delay. Falsified if either fails. 

  Rule B (mechanistic): Accepts "early" if (1) core mechanism is later validated and (2) delay factors were unknowable when predicted. 

  Global peak oil fails Rule A because unconventional oil is exogenous. But Rule B might save it if depletion physics is still deemed correct. However, her Ehrlich verdict suggests she disallows such rescues. 

  To distinguish these rules, imagine a case where a theory's own secondary mechanism causes the delay - like Malthusian preventive checks. Rule A rejects this (as she did), while Rule B might accept if the core threat materializes later. 

  My bet: she'll declare global peak oil falsified, using Rule A. The curve-fitting wasn't world-applicable, the rescue is external, and it echoes her Ehrlich ruling. 

  For the test case, propose a theory where: 
  - It predicts disaster X by year Y 
  - X occurs late due to its own recommended mitigation 
  - The mitigation wasn't implemented as modeled 

  Rule A rejects (endogenous delay), Rule B accepts (core mechanism validated). That's how we'd know.
answer: |-
  Based on your colleague's established pattern of verdicts, here's the breakdown for your global peak oil case:

  ### 1. **Best Guess for Her Verdict: FALSIFIED**  
     **Reasoning:**  
     - **Malthus/Ehrlich Parallel:** Like Ehrlich's falsified famine forecasts, the global peak oil prediction failed on its stated timeline ("imminent or already behind us" in the 90s/2000s). The cause (unconventional oil/demand factors) is an *external rescue*—exogenous factors not modeled in the original theory. She explicitly rejected such rescues for Ehrlich.  
     - **Hubbert Contrast:** Hubbert’s US peak succeeded because it was a *specific, dated prediction* (1970) that materialized as stated. Global peak oil lacks this precision—it’s a repeated "imminent" claim that missed repeatedly.  
     - **Preemptive Rescue Rejection:** She dismissed Malthus’ "preventive checks" as endogenous (not a rescue), but unconventional oil is clearly *exogenous* to Hubbert-style curve-fitting. This mirrors her Ehrlich ruling.  
     - **"Not a Prediction" Trap:** Like *Limits to Growth*, she may argue curve-fitting world production isn’t a testable prediction but a parameter-tuned model (especially if dates shifted post-failure).  

  ---

  ### 2. **The Rule She’s Likely Running:**  
  **"A theory is ‘right but early’ *only* if:**  
  **(a) Its core causal mechanism was validated *independently* of the initial failure, *and*  
  **(b) The delay is explained by *endogenous* factors (within the theory’s original framework), *not* external fixes or new variables."**  

  **Applied to her verdicts:**  
  - **Malthus:** Failed (a) & (b). Preventive checks are endogenous but *invalidated* the prediction (no famine), and the demographic transition wasn’t a rescue.  
  - **Ehrlich:** Failed (a) & (b). Famine didn’t occur; "happening now" is a new claim.  
  - **Hubbert:** Passed (a) & (b). Mechanism (depletion curve) worked *as predicted* for US oil; no delay/rescue needed.  
  - **Limits to Growth:** N/A (not a prediction).  
  - **Global Peak Oil:** Fails (a) & (b). Unconventional oil/demand are *external* factors; no independent validation of the global peak mechanism.  

  ---

  ### 3. **An Alternative Rule Fitting All Four Verdicts:**  
  **"A theory is ‘right but early’ if:**  
  **(a) It made a *dated, concrete prediction*,  
  **(b) The predicted event *eventually occurred* due to the same mechanism, *and*  
  **(c) The delay was caused by *quantifiable, unforeseeable interference* (not model error)."**  

  **Same verdicts, different logic:**  
  - **Malthus:** Fails (b). No mass famine occurred.  
  - **Ehrlich:** Fails (b). Famines didn’t occur as forecasted.  
  - **Hubbert:** Passes (a)–(c). Dated (1970), occurred, delay not applicable.  
  - **Limits to Growth:** Fails (a). No dated prediction.  
  - **Global Peak Oil:** Fails (b) & (c). No global peak occurred, and "unforeseeable interference" (unconventional oil) is debatable (was it truly unforeseeable?).  

  ---

  ### 4. **The Case That Separates the Two Rules:**  
  **The Ozone Hole Expansion Prediction (Hypothetical):**  
  - **Prediction:** A 1980 model forecasts catastrophic ozone depletion by 1995 due to CFCs.  
  - **Outcome:** By 1995, depletion is severe but not catastrophic because the *Montreal Protocol (1987) drastically reduced CFCs*. The mechanism (CFCs → ozone loss) is validated, but the worst outcome was averted by policy.  

  **How the rules diverge:**  
  - **Her Likely Rule:** **FALSIFIED.** The rescue (Montreal Protocol) is *external* to the model. Mechanism validated, but prediction failed due to exogenous factors.  
  - **Alternative Rule:** **RIGHT BUT EARLY.** Dated prediction (1995), eventual ozone crisis occurred (just delayed/lessened), interference (policy) was unforeseeable in 1980.  

  **Why it separates them:**  
  - Her rule rejects external rescues *even if the mechanism is sound*. The alternative rule allows unforeseeable interventions as valid delays.  

  **Key Distinction:**  
  - Her rule prioritizes *theoretical purity* (no external fixes).  
  - The alternative rule prioritizes *mechanistic accuracy* (if the core cause/effect is proven).  

  Your colleague’s pattern suggests she’ll judge global peak oil as **falsified**, aligning with her strict rejection of ex-post facto rescues. To test her rule, probe cases where endogenous vs. exogenous factors blur (e.g., the ozone example).
