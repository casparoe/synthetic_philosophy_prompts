prompt: |-
  I'm a brand-new staff attorney at the state sentencing board, and part of my job is to guess what the commissioners are going to do with a case before they do it. I cant get a read on them, so I want your help.

  Here's the track record, roughly, from the last couple years:

  - Guy blew a .19, ran a red, killed a nine-year-old: 12 years.
  - Guy blew a .21, ran the same red, nobody hurt, pulled over a block later: 10 years.
  - Woman who skimmed 2.3 million off a charity over six years, no record, and by sentencing she'd lost her job, her license, her marriage, and was basically broke: 3 years.
  - Man with six prior burglary convictions who took a laptop out of an unlocked car: 6 years.
  - Plant supervisor who falsified a safety inspection report. Nothing blew up, nobody was hurt, but the file said basically every plant in that industry fudges these: 5 years.
  - Nineteen-year-old lookout in an armed robbery where his friend shot the clerk dead. He says he didn't know about the gun. He got 3 years, the shooter got 25 to life.

  My boss keeps saying the board is "retributivist, like everybody in this state," and I honestly dont see it. And one of the commissioners talks constantly about "hard treatment" versus "the message," which I don't fully follow, but it seems to matter to him.

  The case in front of us: a 54-year-old woman with no record spent about four months planning to kill her ex-husband, and finally put what she thought was a lethal dose of a prescription sedative in his whiskey. She'd bought it off a website; it was a sugar pill. He woke up groggy, that's it. She confessed the next morning on her own and has been a wreck since — lost her job, her two kids won't speak to her, her ex has publicly forgiven her and asked us not to lock her up. No priors, no sign she'd ever do anything like this again, and the file notes that attempts like this basically never get reported or caught, so it's not as if anyone out there is watching this sentence and changing their behavior.

  What do you think they'll give her? I'm less interested in the number than in what rule the board is actually running — I can see two or three different stories that fit all six of those cases — and which story this new case actually puts pressure on. Then tell me what kind of case I should be watching for that would settle it, because I'd rather know what's really driving this than keep guessing. No need for real cases or cites, just the logic.

  Format, please:

  1. The number — one line: your best guess in years, plus a one-sentence why.
  2. The rules that fit their record — two or three of them, a couple lines each on how each one explains the six cases above.
  3. What each rule says about her — a few lines per rule.
  4. My best guess and why — one paragraph.
  5. The case that would settle it — one paragraph: describe the case and what each rule would predict about it.
reasoning: |-
  Alright, let me tackle this step by step. The user is a new staff attorney at a state sentencing board trying to predict commissioners' decisions. They provided six past cases with sentences and a new case involving a woman who attempted to poison her ex-husband with a fake pill. The user wants to understand the underlying rules the board follows and how they apply to the new case.

  First, I need to analyze the past cases. The DUI cases resulted in 12 and 10 years, showing severity based on outcome (death vs. no harm). The embezzlement case got only 3 years despite the large sum, possibly due to the defendant's prior suffering. The repeat burglar got 6 years, emphasizing criminal history. The safety inspector received 5 years for falsifying reports, even without accidents, indicating deterrence. The robbery lookout got 3 years versus the shooter's life sentence, highlighting role and intent.

  The boss mentions retributivism, but the sentences seem inconsistent with pure retribution. The commissioner's focus on "hard treatment" vs. "the message" suggests a mix of retribution and deterrence. 

  For the new case, the woman planned murder but used a placebo. She confessed, faced personal consequences, and the victim forgave her. No prior record. The key factors here are intent versus outcome, and whether deterrence is relevant since such crimes are rarely caught.

  Possible rules could be: Modified Retributivism (focus on intent and harm), Consequentialist Deterrence (prioritizing deterrence especially where crime is detectable), or Expressive Condemnation (sending a message about societal values).

  Applying each rule to the new case:
  1. Modified Retributivism: Severe due to high intent, but reduced by lack of harm and personal consequences. Maybe 8-12 years.
  2. Consequentialist Deterrence: Low sentence because the crime is rarely caught, so deterrence isn't effective. Possibly probation or minimal time.
  3. Expressive Condemnation: High sentence to condemn the act, regardless of outcome. Around 10-15 years.

  The best guess is 8-12 years under Modified Retributivism, as it balances intent with mitigating factors. The case that would settle the rules involves a high-deterrence scenario with a blameless life versus a low-deterrence one with a hardened criminal. Divergent predictions here would clarify the board's priorities.
answer: |-
  Here’s the breakdown based on the patterns and commissioner cues:

  **1. The number**  
  7–10 years. *Why:* High culpability for intent and planning, but mitigated by lack of harm and profound personal consequences.

  **2. The rules that fit their record**  
  - **Rule A: Modified Retributivism (Culpability + Outcome Severity)**  
    Punishment scales with *intent* and *actual harm*, but discounts if harm is averted or offender is "pre-punished" (e.g., DUI killer (high intent/harm) > failed poisoning (high intent/low harm); embezzler (high harm but pre-ruined) gets leniency; safety fraud (medium intent, near-miss harm) punished moderately).  
  - **Rule B: Consequentialist Deterrence (Focus on Deterrable Crimes)**  
    Punishes harder when the sentence can plausibly *deter others* (e.g., drunk driving (visible, common) gets heavy sentences; burglary recidivist (deterring repeat offenses) gets 6 years; safety fraud (deterring industry negligence) gets 5 years). Leniency where deterrence is ineffective (e.g., embezzler already ruined; lookout less culpable than shooter).  
  - **Rule C: Expressive Condemnation ("The Message")**  
    Punishment sends a societal message condemning specific *types* of harm or breach of trust, regardless of outcome (e.g., safety fraud (betraying public trust) punished despite no accident; burglary (violating security) punished heavily; charity theft (breach of fiduciary duty) punished moderately despite collapse).

  **3. What each rule says about her**  
  - **Rule A (Modified Retributivism):** High culpability (premeditated murder attempt) demands severe punishment, but significant mitigation: no actual harm, self-confessed, pre-ruined life, victim forgiveness. Outcome: **Moderate-High sentence (8-12 years)**.  
  - **Rule B (Consequentialist Deterrence):** Low deterrence value – crimes of passion/rarely caught aren't deterred by sentencing. Offender poses no future risk. Outcome: **Low sentence (probation to 3 years)**.  
  - **Rule C (Expressive Condemnation):** Must condemn *planned murder* and betrayal of intimate trust, regardless of outcome. "Grogginess" is irrelevant; the act itself is the message. Outcome: **High sentence (10-15 years)**.

  **4. My best guess and why**  
  The board will impose **7-10 years**, aligning with **Modified Retributivism (Rule A)**. This fits their record: they consistently weigh intent and harm (e.g., DUI deaths > near-misses), but reduce sentences for pre-existing ruin (embezzler) or averted harm (failed poisoning). The commissioner's "hard treatment vs. message" dichotomy suggests retributivism ("hard treatment" for culpability) is primary, but "message" (Rule C) is secondary when harm is abstract (safety fraud). Here, the lack of real harm and her collapse mitigate retribution, but the extreme intent prevents leniency. Rule B (deterrence) is discounted per the file note.

  **5. The case that would settle it**  
  **The Hypothetical:** A *highly publicized* case of a first-time offender, a respected doctor, who *successfully covers up a fatal medical error* (no intent to harm, but negligence and concealment). No prior record, genuine remorse, but the crime was only discovered by chance.  
  - **Rule A (Retributivism):** Moderate sentence (e.g., 3-5 years). Low intent (negligence, not malice), high harm, concealment adds culpability.  
  - **Rule B (Deterrence):** Very high sentence (e.g., 10+ years). Case is highly visible – strong deterrence signal to medical professionals about cover-ups.  
  - **Rule C (Expression):** High sentence (e.g., 7-10 years). Condemns betrayal of professional trust and obstruction, regardless of original intent.  
  **Settlement:** If the board imposes a high sentence (>7 years), **Rule B/C dominates**. If moderate (3-5 years), **Rule A (Retributivism) is core**, as harm alone isn’t decisive without high intent. A low sentence would confirm Rule B’s focus on deterrability/visibility.
