prompt: |-
  I am a novelist, and I have reached the part of a book where I need to know what my characters have done to one another. The book concerns a family, plus two outsiders, who between them bring about a death. None of them intends the death as such, all of them contribute to it, and the last third of the novel turns on who is entitled to say "we." I have been deciding the book by ear, which is the right way to write one and a poor way to arrive at a principle, and I would like to know what principle my ear has been following.

  Take the role of a philosopher of action who works on collective intentionality and joint action, and who is willing to reason from a novelist's examples rather than from the literature. Begin by restating my cases in your own words and sorting them by the feature you think is doing the work; only then commit to a principle. I would rather have your honest bookkeeping than your agreement, and a precise principle than a comprehensive one. Two of the verdicts below I hold with conviction and cannot hold together, and I would like you to say which one has to go.

  My verdicts:

  - Two movers carrying a piano down a stairwell, one at each end, having agreed on the plan: together, beyond argument.
  - A quartet improvising, no score, no signal, each player listening: more clearly together than the movers, though no plan exists anywhere. This is the verdict I would defend to the death.
  - Two strangers walking the same direction at the same pace for an hour, each unconsciously matching the other's stride: not together, though each is adjusting to the other the whole way.
  - A married couple who each, separately and over years, stop trying; neither says so; the marriage ends. I write that they let it end, and the sentence feels true, yet I cannot point to an act.
  - A crowd that surges and crushes a man against a barrier: I do not think the crowd acted together, and I do think the crowd is answerable as a body. I want both and cannot have both.
  - A corporation that lays off four hundred people through a committee process in which every member voted for a package none of them preferred: the corporation did it, though nobody intended it.
  - A shepherd and his dog moving a flock: together, though the dog can agree to nothing.
  - One man proposes a robbery; the other says nothing and drives the car: together.
  - Two writers who, in ignorance of each other, publish attacks on the same man on the same morning, each delighted to learn of the other: not together.
  - A mother and her adult son who alternate years of caring for a dying man, without discussion and without affection: together, and I do not care that both would deny it.
  - Two parties who sign an agreement, fully intend the joint act, and then each privately does something else that happens to produce the same result: not together.

  The principle I have been half-using, offered so that you can test it rather than adopt it: an action is joint when each participant's action is guided by their expectation of what the others are doing and by the shape of the whole they are making together, so that if the others had done otherwise, the participant would have done otherwise too. I can already see that this admits the strangers and may lose the quartet, and I do not know what it says about the corporation or the dog.

  What I want from you: the principle, or a small set of rival candidates, each stated precisely enough that I can check it against a case; for each clause, the case that forces it; your verdicts on cases I have not listed, including two chess players, a parent and a toddler putting away toys, a funeral at which the whole room weeps in the same instant, and a nation that goes to war through a chain of decisions no one intended; and an honest accounting of which of my verdicts the principle cannot accommodate and must therefore overturn. Work through the cases before you generalize, and show me where you are uncertain. If a term of art earns its place, define it in plain words the first time you use it; I cannot look anything up, so do not send me to a reading list or to names. I want the reasoning, not the sources.
reasoning: |-
  Okay, the user is a novelist working on a complex narrative about collective responsibility and unintentional death. They've presented 11 nuanced scenarios where groups either are or aren't "together" in action, highlighting tensions between their intuitive verdicts. Their core struggle is reconciling two convictions: that the improvising quartet is "more clearly together than the movers" and that the crowd both isn't acting together but should be answerable as a body.

  Hmm, the user's self-proposed principle (about mutual responsiveness to others' actions) seems promising but clearly conflicts with some verdicts—like how it would include the stride-matching strangers but exclude a faithful dog. Their examples reveal fascinating tensions: between intention and outcome, planning and emergence, human and non-human actors. The corporation case is particularly thorny—how can an entity act without any individual intending the outcome?

  The novelist needs surgical precision here, not theoretical grandstanding. They want a principle that can survive contact with their fictional universe. Their attachment to the quartet example suggests they value organic, unspoken coordination over contractual agreements. But then the marriage case complicates things—is "letting something happen" a joint action if both parties independently withdraw? 

  The crowd/corporation dilemma feels central. How can a collective be responsible without having acted together? Perhaps the answer lies in distinguishing action from answerability—like how we might blame "the system" without blaming any particular bureaucrat. But the user explicitly wants both for the crowd case, which creates tension.

  For the shepherd/dog scenario, the challenge is accommodating non-linguistic beings in joint action. If we require shared intention, the dog is excluded—but if we only require coordinated behavior, we might include too much (like the strangers). The mother/son case pushes against the participants' own denial of togetherness, implying the truth lies in observable patterns, not subjective states.

  The user's proposed principle fails the quartet test because jazz improvisation thrives on real-time adaptation, not pre-formed expectations. A better principle might require mutual openness to influence, not rigid expectations. The signing-parties-who-cheat case shows that bad faith undermines togetherness even if the outcome matches—intent matters more than result.

  New test cases: Chess players are together only if collaborating, not competing. Parent-toddler cleanup might qualify if the child responds to cues. Spontaneous group weeping at a funeral is synchrony without joint action. A nation's unintended war could be "joint" only if institutions, not individuals, are the actors—but that might satisfy the corporation case too.

  Ultimately, the crowd verdict must break. Either the crowd didn't act together (so no "we"), or it did (so they're answerable as a body). Can't have both. The quartet conviction is safer—it's the jewel their principle must protect.
answer: |-
  Based on your cases and my analysis of collective intentionality, I propose this principle: **An action is joint when participants are mutually responsive in real-time to each other's contributions, guided by a shared understanding (explicit or implicit) that they are engaged in a single, coordinated effort toward a common end state.**

  **Key Components & Cases That Forced Them:**
  1.  **Mutual Responsiveness:** Each adjusts their action based on others' actions *as they happen*. Forces exclusion of **Strangers Matching Stride** (unconscious, not responsive *to each other as co-participants*).
  2.  **Real-Time Coordination:** The adjustments happen interactively during the action. Forces exclusion of **Writers Publishing Simultaneously** (no interaction during the act) and **Signing Parties Cheating** (interaction ends before the real action).
  3.  **Shared Understanding of a Single Effort:** Participants grasp they are part of *one* undertaking, not just parallel acts. Forces exclusion of **Crowd Surging** (individuals react to local pressure, not a shared undertaking) and inclusion of **Mother/Son Care** (implicit understanding of the shared duty).
  4.  **Common End State:** They coordinate *towards* a specific outcome, however loosely defined. Forces inclusion of **Movers** (piano down stairs) and **Quartet** (coherent music), and exclusion of **Marriage Ending** (shared outcome, but no coordinated *action towards it*; it's decay, not joint action).
  5.  **Implicit/Explicit Understanding:** The "shared understanding" need not be verbalized or formal. Forces inclusion of **Shepherd/Dog** (highly trained mutual responsiveness within a shared task framework) and **Driver in Robbery** (silence implies acceptance of the joint frame).

  **Why your proposed principle needed refinement:**
  *   "Expectation" was too rigid, excluding the fluid **Quartet** (players react to *what is happening*, not fixed expectations).
  *   "Shape of the whole" needed anchoring in a "shared understanding" to exclude the **Strangers**.
  *   Focusing solely on counterfactual dependence ("if others...") *did* wrongly include the Strangers and struggled with the Quartet.

  **Applying the Principle to Your Verdicts:**

  1.  **Movers:** YES. Mutual responsiveness (adjusting grip/weight), real-time, shared understanding (agreed plan), common end state.
  2.  **Quartet:** YES. *Intense* mutual responsiveness, real-time, shared understanding (making music *together*), common end state (coherent performance). **Your conviction holds.**
  3.  **Matching Strangers:** NO. Mutual adjustment, but *no shared understanding* of a single effort. *Excluded.*
  4.  **Marriage Ending:** NO. Shared outcome, but *no mutual responsiveness* or coordinated action *towards* ending it. It happened *through* inaction. *Your "let it end" feels true for outcome, not joint action.*
  5.  **Crowd Crushing:** NO. Lacks *mutual responsiveness guided by shared understanding of a single effort*. Individuals react locally. **BUT:** *Answerability as a body is separate from joint action.* You likely *can't have both* "acting together" and "answerable as a body" *under the same description of the crushing*. The crowd-body might be answerable for *allowing* a dangerous situation or *being* a crushing force, but *it didn't perform the crushing as a joint action*. **This verdict must go or be reframed.**
  6.  **Corporation Layoffs:** *The Corporation?* YES, as an institutional actor. *The Committee?* AMBIGUOUS. They *did* mutually respond in real-time (discussion, voting) guided by a shared understanding (their role: deciding layoffs) toward a common end (a resolution). *That the outcome wasn't individually preferred doesn't negate the joint action of deciding.* The corporation enacted the result. *Included.*
  7.  **Shepherd & Dog:** YES. Mutual responsiveness (shepherd commands/dog herds), real-time, *implicit* shared understanding (task of moving flock), common end state. Dog's training instills the responsive role.
  8.  **Silent Driver in Robbery:** YES. Mutual responsiveness (driver acts on cues/needs of robber), real-time, shared understanding (implied by context/silence - they are robbing *together*), common end state.
  9.  **Writers Publishing Simultaneously:** NO. No mutual responsiveness *during the act*, no shared understanding of a *single effort*. *Excluded.*
  10. **Mother/Son Care:** YES. Mutual responsiveness (alternating implies responding to the need/passage of time), real-time coordination of handovers (even if minimal), *implicit* shared understanding (duty to care for X), common end state (care provided). Their denials are irrelevant to the observable joint action structure.
  11. **Signing Parties Cheating:** NO. While they jointly *signed*, the subsequent actions producing the result lack *mutual responsiveness* and the *shared understanding of a joint effort*. They acted independently and deceptively. *Excluded.*

  **Your New Cases:**

  *   **Two Chess Players (Competing):** NO. Mutual responsiveness? Yes. Real-time? Yes. *Shared understanding of a single effort?* No - they understand they are engaged in *opposing* efforts within a shared framework (the game). Common end state? Not one *state they cooperate towards*; each strives for their own victory. *(Not joint action)*
  *   **Two Chess Players (Collaborating on a Puzzle):** YES. Mutual responsiveness? Yes. Real-time? Yes. Shared understanding? Yes (solving *together*). Common end state? Yes (solution found). *(Joint action)*
  *   **Parent & Toddler Putting Away Toys:** YES (typically). Mutual responsiveness (parent guides, toddler mimics/adjusts), real-time, shared understanding (implicit: "cleaning up"), common end state (toys put away). Even if toddler is clumsy, the *framework* is joint.
  *   **Funeral: Whole Room Weeps Simultaneously:** NO. Synchrony ≠ joint action. Mutual responsiveness? Minimal/unconscious. Shared understanding of a *single effort*? No - each is expressing personal grief, even if triggered simultaneously. Common end state? Not an *action* they coordinate towards. *(Not joint action, but collective emotional expression)*
  *   **Nation Goes to War via Unintended Chain:** *The Nation?* As an institutional actor, YES (war was declared/enacted by its mechanisms). *The Decision-Makers?* AMBIGUOUS/NO. If *their chain of decisions* lacked mutual responsiveness guided by a shared understanding of *taking the nation to war* (e.g., each acted on narrow briefs without grasping the cumulative effect), then NO. The *outcome* (war) was not the result of a joint action *by those individuals*, though institutional actions led to it. Similar to the Corporation, the *institution* "acted".

  **The Verdict That Must Go:**

  **"A crowd that surges and crushes a man... I do not think the crowd acted together, and I do think the crowd is answerable as a body. I want both and cannot have both."**

  *   **Why it fails the principle:** The crushing lacks mutual responsiveness guided by a shared understanding of a single effort. It's emergent, uncoordinated mass behavior. Therefore, the crowd did *not* perform the crushing *as a joint action*.
  *   **Why you likely can't have both:** Answerability as a *body* for the crushing implies a collective agent *acted* to crush. But the principle shows the crushing wasn't a joint action *by that body*. The crowd-body might be answerable for *being* dangerous, or for *creating* the situation, or individuals might be answerable, but the description "the crowd crushed him as a joint action" is false. You need to separate the *event* (crushing by the crowd-mass) from the *type of action* (joint). The crowd *as a body* isn't an agent capable of joint action in this scenario. This conflicts with your Quartet conviction, which relies on genuine, responsive jointness.

  **Uncertainties:**

  *   **Corporation/Committee:** The line between institutional action and the joint action of the committee members is blurry. Does the committee's vote constitute mutual responsiveness? (Likely yes, through deliberation). Does the shared understanding exist at the committee level? (Likely yes: "we are deciding layoffs"). But the *corporation's* action is derivative.
  *   **Marriage Ending:** While clearly not joint action, the *feeling* of "they let it end" points to shared responsibility for an outcome via inaction, a distinct but related concept.
  *   **Nation Going to War:** Pinpointing *who* (if anyone) performed the joint action "taking the nation to war" is extremely complex in bureaucratic processes. Often, it's best attributed to the institution via its procedures.

  **The Principle Restated Clearly:**

  **An action is joint when participants, aware (explicitly or implicitly) that they are collaborating on a single task, continuously adjust their own contributions in response to each other's ongoing actions, coordinating in real-time to achieve a common goal.**

  This principle preserves your core conviction about the Quartet, excludes the Strangers, accommodates the Dog and Mother/Son, handles the Corporation as an institutional actor (or its committee), excludes the Writers, and forces the rejection of the Crowd *as a joint action*. It centers on the *dynamic interplay of awareness, responsiveness, and shared purpose* during the activity itself.
