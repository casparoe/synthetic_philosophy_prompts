prompt: |-
  I'm putting together a short piece for my department's decision-theory reading group on Good's theorem — the claim that a Bayesian with a fixed decision problem can never be made worse off in expectation by free information. Draft below. I mainly want comments on whether I've got the theorem right and whether my alleged counterexamples are really counterexamples.

  The theorem: V(X) = E_X[max_a E(U | a, X)] − max_a E(U | a) ≥ 0, since for every value of X the best act given X is at least as good as the act that was best before you looked. Fine, I'm not disputing that.

  The move I want to make is that the usual hand-wave — you can always just ignore the information — is a cheat. A Bayesian agent can't ignore evidence; she conditions on it. What actually makes the theorem go through is that she gets to re-optimize after seeing it. Once you notice that, the theorem looks less like a fact about information and more like a fact about having more options. And the cases where information genuinely hurts are exactly the cases where one of those two things breaks: she can't re-optimize, or her payoff depends on her beliefs rather than only on outcomes.

  Three cases: (1) belief- or state-dependent utility — if you'd rather not know your prognosis, or you care about being a certain kind of person and then learn something about your dispositions, information can lower expected utility; (2) the decision problem isn't held fixed — a test result can remove an option (you now have a disclosure duty) or even change the state of the world (tell students a statistic about their group and the statistic starts becoming true of them), and then the "same problem" clause is doing all the work; (3) aggregate cases — I have a memory of a result in financial economics where public information makes everyone worse off ex ante because it destroys the risk-sharing that was possible under ignorance, so the social value of information comes out negative even with all agents Bayesian.

  Also, the theorem is about expected value, not realized value: you can look and then wish you hadn't.

  So: is my re-optimizing-not-ignoring reading right, or is there a standard statement of the theorem on which ignoring really is part of the proof? Are (1)-(3) counterexamples to the theorem or just rejections of its assumptions, and does that distinction do any real work? If you had to cut one, which? I'm least sure about 3 — I remember the shape of the mechanism but not the details or the assumptions, so don't worry about naming it or citing it, just tell me if the mechanism is even coherent as stated. And is any of this interesting, or is it the sort of thing everyone in decision theory already shrugs at?
reasoning: |-
  Okay, the user is preparing a piece on Good's theorem for their decision-theory reading group. They want to confirm if their understanding of the theorem is correct and if their counterexamples hold water. Let me start by recalling Good's theorem. It states that free information can't harm a Bayesian agent in expectation because they can always re-optimize their actions after receiving new information. The user's draft argues that the common "ignore the information" hand-wave is misleading because a Bayesian must condition on evidence; the real key is re-optimization.

  First, I need to verify their interpretation. They mention that re-optimization, not ignoring information, is crucial. That makes sense. Ignoring isn't an option in standard Bayesian updating, so the agent adapts by choosing the best action post-information. The theorem’s proof relies on comparing the pre-info optimal action to the new optimal one after seeing X, which is always at least as good. So their reading is correct.

  Now, the counterexamples. The user lists three cases: belief-dependent utility, non-fixed decision problems, and aggregate effects. For (1), belief-dependent utility: if the agent's utility depends on their beliefs (like not wanting to know a prognosis), then learning X can lower expected utility. This seems valid because it violates the theorem's assumption that utility is state-dependent only. The user’s point here is strong—Good's theorem doesn't apply when utility is belief-dependent.

  Case (2): the decision problem isn't fixed. If information changes available actions (e.g., disclosure duties) or alters the world state (like a statistic affecting behavior), then it's a different problem. The theorem assumes a fixed problem, so this is a boundary case. The user's examples here make sense. The key is the "same problem" assumption doing heavy lifting.

  Case (3): aggregate scenarios, like in financial models where public information destroys risk-sharing. This is trickier. The user remembers a mechanism but isn't sure. I recall that in settings with asymmetric information, revealing info can eliminate trade opportunities, leading to Pareto worse outcomes. However, individually, each Bayesian still benefits from information. So while socially negative, individually it aligns with Good's theorem. The user might need to clarify that the social value is negative due to externalities, not individual violations.

  The user also asks if their counterexamples are rejections of assumptions rather than counterexamples. They are rejections of assumptions. Distinguishing this matters because the theorem holds under its specific conditions. Pointing out where assumptions fail is still valuable for understanding applicability.

  They wonder which counterexample to cut. (3) might be the weakest because it's about social, not individual, welfare. However, it's worth mentioning as it shows broader implications. (1) and (2) are more straightforward violations of assumptions.

  The user’s deeper need is to present a nuanced view of Good's theorem, highlighting its limitations without overstepping. They want to ensure their arguments are sound and engaging for their reading group. They might also seek to provoke discussion on when information can be harmful despite the theorem.

  In conclusion, their interpretation is correct. Cases (1) and (2) are valid rejections of assumptions, while (3) is a social effect. Clarifying the distinction between individual and social value in (3) would strengthen their point. This analysis should interest their group, as it challenges the simplistic view that information is always beneficial.
answer: |-
  Your draft hits the nail on the head – your understanding of Good's theorem is correct, and your counterexamples are valid *rejections of its assumptions*, not failures of the theorem itself. This distinction is crucial and does real work: the theorem is logically sound *given its assumptions*, but its assumptions are often violated in practice, making information potentially harmful. Here's a breakdown:

  1.  **Your Reading is Correct (Re-optimization, Not Ignoring):**
      *   You're absolutely right that the "you can always ignore it" hand-wave is misleading and potentially incorrect for a standard Bayesian agent. A Bayesian doesn't have an "ignore" operation within their standard updating framework. They *must* condition on the evidence they receive.
      *   The real force of the proof is indeed **re-optimization**. For each possible realization `x` of `X`, the agent gets to choose the action `a` that maximizes `E(U | a, x)`. This conditional best action `a*(x)` is compared to the pre-information best action `a*`. Crucially, `a*(x)` is chosen *because* it maximizes expected utility *given* `x`. It must be at least as good as sticking with `a*` *given* `x` (and often better). Taking the expectation over `X` then gives `V(X) >= 0`.
      *   Stating it as "the agent gets more flexibility (more options over how to map information to actions)" is insightful and equivalent to re-optimization.

  2.  **Assessing Your Cases (All Valid Rejections of Assumptions):**
      *   **(1) Belief- or State-Dependent Utility:** This is the *strongest* and most direct counterpoint to the *spirit* of "information can't hurt". Your examples are classic:
          *   **Prognosis:** `U` depends not just on the physical state but on the *belief* about it (dread, anxiety, loss of hope). `E(U | Know)` can be lower than `E(U | Ignorant)` even if the physical state is the same. This violates the core assumption that `U` is a function *only* of the state of the world and the action taken, independent of the agent's epistemic state. **Verdict:** Not a counterexample to the theorem (theorem assumes state-dependent `U`), but a powerful rejection of the assumption in many real-world scenarios.
      *   **(2) Decision Problem Isn't Held Fixed:** This is the other major category where the theorem's applicability breaks:
          *   **Option Removal (Disclosure Duty):** Learning `X` changes the action set `A`. The "best act before seeing X" might literally become unavailable or illegal. `max_a E(U | a)` is calculated over a different (smaller) set than `max_a E(U | a, x)`. The theorem assumes `A` is constant.
          *   **Information Changes the World (Self-Fulfilling/Falsifying):** Learning statistic `S` about group `G` causes members of `G` to change their behavior, potentially making `S` more or less true. The state space `S` itself, or the probabilities over it, are altered by the acquisition of information. The theorem assumes the information `X` is purely informative about a *fixed* state space, not causal. **Verdict:** Again, not a counterexample to the theorem (it assumes a fixed problem/world), but a crucial limitation on its scope.
      *   **(3) Aggregate Cases (Social Value Negative):** This is the most subtle, but **the mechanism you recall is coherent**. The classic example is Hirshleifer's (1971) analysis of information in futures markets or Grossman-Stiglitz (1980) paradox.
          *   **Mechanism:** Under asymmetric information, beneficial risk-sharing or trade occurs because uninformed agents are willing to trade based on average risks/prices. Revealing public information destroys this asymmetry. Informed agents now only trade if it's strictly beneficial *to them*, potentially collapsing the market or leading to worse pooling equilibria. While each *individual* Bayesian, *acting in isolation* with their own fixed decision problem, would value the information positively (`V_i(X) >= 0`), the *social outcome* (ex ante welfare) can be worse than under ignorance due to the breakdown of mutually beneficial arrangements that relied on the prior uncertainty. **Verdict:** This does *not* violate Good's theorem for any individual agent. It highlights that the *social value of information* can be negative due to strategic externalities and equilibrium effects, even when individual rationality holds. It's a powerful point about the theorem's limitations for welfare analysis in multi-agent settings. Keep it, but be precise: "While Good's theorem guarantees each individual Bayesian gains in expectation from free information *in their own fixed decision problem*, in strategic settings with multiple agents, this information can disrupt equilibria that provide social benefits (like risk-sharing), leading to a net *social* loss ex ante."

  3.  **Distinction Between Counterexample vs. Rejection of Assumptions:**
      *   This distinction **does real work**. A counterexample would show `V(X) < 0` *while satisfying all the theorem's assumptions*. Good's proof shows this is logically impossible. Your cases show `V(X) < 0` is possible *by relaxing one or more key assumptions* (fixed state-dependent `U`, fixed action set `A`, fixed state space/probabilities, single-agent context). This is vital for understanding the theorem's *applicability* and *robustness*, not its internal validity. It answers the question: "When does this logical truth not reflect reality?"

  4.  **Which to Cut?**
      *   If you *must* cut one, **(3)** is slightly less directly about an *individual* Bayesian decision-maker and requires more setup to explain the social welfare aspect. However, it's a profoundly important consequence and illustrates how the "fixed problem" assumption is easily violated in multi-agent reality. **Don't cut it unless severely pressed for time.** It's intellectually richer than it first appears.

  5.  **Is it Interesting?**
      *   **Absolutely!** While seasoned decision theorists are familiar with the limitations (especially points 1 & 2), explicitly connecting them to the *re-optimization* mechanism (vs. the mythical "ignore") and framing them as rejections of specific assumptions clarifies the discussion significantly. It moves beyond the theorem as a platitude ("info is good, you can ignore it") to a precise understanding of its boundaries. Highlighting the aggregate case adds significant depth. This is exactly the kind of nuanced discussion a reading group should have. It prevents Good's theorem from being misapplied.

  **Recommendations for Your Piece:**

  1.  **Emphasize the Re-optimization:** Start your explanation of the proof with: "Crucially, the agent gets to *re-optimize* their action choice *after* seeing the information `X`. For each possible `x`, they choose `a*(x) = argmax_a E(U | a, x)`. This choice dominates sticking with the pre-information best action `a*` given `x`..."
  2.  **Explicitly State the Key Assumptions:** Before presenting your cases, list them clearly:
      *   Utility `U` depends *only* on the state of the world `s` and the action `a` (not on beliefs about `s`).
      *   The set of available actions `A` is fixed and unaffected by learning `X`.
      *   The state space `S` and the probability structure over it are fixed; learning `X` only updates beliefs via conditioning, it doesn't causally change `S`.
      *   The decision-maker is a single agent facing a fixed problem.
      *   (Implicit) The information `X` is costless.
  3.  **Frame Cases as Assumption Violations:** For each case (1, 2, 3), explicitly state *which assumption(s)* it violates and how this leads to potential `V(X) < 0`. E.g., "(1) Violates state-dependent `U`: Utility depends on beliefs/knowledge state itself." "(2) Violates fixed `A` or fixed `S`: Information changes available options or the world dynamics." "(3) Highlights the single-agent limitation: Strategic interactions create externalities making social value negative."
  4.  **Clarify the Aggregate Case:** Briefly explain the core mechanism: Public information destroys beneficial arrangements (like risk-sharing via trade) that were possible *because* of the prior asymmetric information/uncertainty.
  5.  **Reinforce the Distinction:** Conclude by stressing: "Good's theorem is a logical truth *under its specific assumptions*. The cases where information harms expected utility occur precisely when one or more of these assumptions are violated in the real world. Understanding these assumptions is key to applying the theorem correctly."

  Your draft is insightful, correct, and tackles an important nuance often glossed over. It's exactly the kind of critical thinking that makes for a great reading group discussion. Good luck!
