prompt: |-
  I'm assembling a handout for a graduate seminar on the Sleeping Beauty problem, and before we compare halving, thirding, and the various hybrid and double-halfer proposals, I want the specification of what any adequate theory of self-locating credence would have to deliver. Write the desiderata: the cases the theory must get right, the distinctions it must not collapse, and the results it must be consistent with, each with the consideration that motivates it. Treat the following as stipulated test cases rather than as things to look up: (i) a variant in which, on tails, Beauty is not re-awakened but duplicated, so that a single awakening on heads and a single awakening in each of two coexisting copies on tails leave her with the same total evidence, the copies being able to meet afterward and compare credences; (ii) a variant in which the coin is tossed only after all awakenings are over, so that at the moment of waking the toss has not yet occurred; and (iii) a variant in which the experimenters are themselves unsure whether the memory-wiping is reliable and assign it a known chance of failure. I'll be using the list to decide which proposals remain live options for a decision theory that must also set betting odds, not merely for credence. For each requirement, say whether you regard it as non-negotiable or as a preference of one camp, and say which single requirement does the most to exclude candidate theories. Give exactly five numbered requirements, each one or two sentences, with no introduction or conclusion.
reasoning: |-
  Hmm, the user wants me to create a list of desiderata for theories of self-locating credence in the Sleeping Beauty problem context. They're preparing a graduate seminar handout and need exactly five requirements that any adequate theory should satisfy, focusing on specific variants they've stipulated.

  I need to consider the variants they mentioned: (i) the duplication case where copies can meet afterward, (ii) the coin tossed after awakenings, and (iii) unreliable memory wiping. These test cases will help evaluate different positions like halfer, thirder, and hybrid approaches.

  The core challenge here is balancing the need for theories to handle self-locating uncertainty while maintaining consistency across scenarios. Key considerations include: how evidence affects credences in duplication scenarios, whether future events impact current beliefs, how unreliable evidence impacts credence updates, and whether the theory can practically support decision-making.

  For requirement 1, I'll focus on the duplication variant. When Beauty is duplicated on tails, both copies should have the same initial credence as in the original experiment. This prevents collapsing the distinction between duplication and reawakening, which is crucial for theories that treat these differently. This seems non-negotiable as it tests the core of how a theory handles identity.

  For requirement 2, I'll address the coin-toss timing. In the variant where the coin is tossed after awakenings, Beauty's credence in heads should be 1/2. This separates uncertainty about past events from future indeterminacy, which excludes theories that treat these indistinguishably. This should be non-negotiable as it tests temporal externalism.

  Requirement 3 will cover unreliable memory wiping. Beauty's credence should be sensitive to the known chance of memory-wiping failure. This ensures theories properly account for evidence reliability, which is key for real-world applications. I consider this non-negotiable for decision-making contexts.

  For requirement 4, I'll emphasize that the credence must guide betting odds without incoherence or exploitable strategies. This bridges epistemology and decision theory, making the theory practical. This is non-negotiable since the user specifically wants it for setting betting odds.

  Finally, requirement 5 will require that credences in centered propositions align with objective chances when possible. This maintains the connection between credence and chance, excluding theories that violate this link. I see this as non-negotiable for rationality.

  Among these, requirement 2 (about coin-toss timing) likely excludes the most candidate theories because it directly challenges thirder views that rely on the coin toss being past. It forces a distinction that many popular theories struggle with.
answer: |-
  Here are five numbered requirements:

  1. **Handle Duplication Without Identity Confusion:** In the duplication variant (tails creates coexisting copies), each Beauty copy must hold the same initial credence in heads (e.g., 1/3) as in the original experiment upon waking alone. *(Motivation: Prevents collapsing the distinct metaphysical/evidential status of duplication vs. reawakening; non-negotiable for handling fission cases.)*

  2. **Respect Temporal Externalism:** In the "toss after waking" variant, Beauty's credence in heads upon waking must be 1/2, not 1/3. *(Motivation: Distinguishes uncertainty about a future indeterministic event (coin toss) from uncertainty about a past unobserved event; non-negotiable for temporal asymmetry. This requirement likely excludes the most theories, particularly strict thirding.)*

  3. **Account for Evidence Reliability:** In the unreliable memory-wiping variant, Beauty's credence in heads must be sensitive to the known chance of memory-wiping failure (decreasing towards 1/2 as failure chance increases). *(Motivation: Requires theories to correctly update on the reliability of evidence-generating processes; non-negotiable for realistic evidence handling.)*

  4. **Support Coherent Decision Theory:** The credence assigned must directly determine rational betting odds in wagers offered *during awakenings* without leading to guaranteed losses (incoherence) or exploitable dynamic inconsistencies. *(Motivation: Ensures the credence is pragmatically meaningful and action-guiding; non-negotiable for a theory used in decision contexts.)*

  5. **Preserve Chance-Credence Principle Link:** The theory must ensure that, when Beauty has knowledge of objective chances (e.g., the coin's fairness), her credence in centered propositions like "this awakening is a heads-awakening" aligns with the relevant chances *where applicable and identifiable*. *(Motivation: Maintains a rational connection between known objective probabilities and subjective degrees of belief; non-negotiable for grounding credence in the world.)*
