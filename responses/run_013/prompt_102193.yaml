  ### Decision Tree for Fitch's Paradox of Knowability

  This tree is designed for a graduate reading group familiar with Fitch's derivation in classical logic. It starts from the assumptions and branches through key questions about the ingredients of the argument. Each internal node is a single question about an ingredient, phrased neutrally. Branches represent possible answers. Positions (leaves) are labeled by content, with their most awkward commitment stated. Empty combinations are marked and diagnosed. Ingredients are treated as separable, and the tree avoids manufacturing distinctions where none exist.

  ---

  #### Decision Tree

  1. **Is the underlying logic classical?**  
     - **Intuitionistic**: Go to 1.1.  
     - **Classical**: Go to 2.  

     **1.1: Move to intuitionistic logic**  
     *Position:* Accept the knowability principle (KP) and all other assumptions, but use intuitionistic logic to block the derivation of omniscience.  
     *Awkward commitment:* We must accept that it is absurd to assert any truth is unknown (¬∃p(p ∧ ¬Kp) is provable, but ∀p(p → Kp) is not), even though we lack a constructive method to know all truths.  
     *Leaf ends.*  

     **2: Is knowledge factive?**  
     - **No**: *Empty combination.* (Diagnosis: Coherent but unattractive—denying that knowledge entails truth undermines a core feature of knowledge.)  
     - **Yes**: Go to 3.  

     **3: Does knowing a conjunction entail knowing each conjunct?**  
     - **No**: Go to 3.1.  
     - **Yes**: Go to 4.  

     **3.1: Denial that knowledge distributes over conjunction**  
     *Position:* Accept KP, factivity, and classical logic, but deny that K(p ∧ q) entails Kp ∧ Kq.  
     *Awkward commitment:* It is possible to know a conjunction (e.g., "p and I do not know p") without knowing either conjunct, which seems to allow "blind" or non-reflective knowledge.  
     *Leaf ends.*  

     **4: Is the knowability principle a single universally quantified claim?**  
     - **Universal quantification**: Go to 5.  
     - **Schema (instance per proposition)**: Go to 5. (Note: In practice, the schema vs. universal distinction does not separate responses; both require addressing the range of propositions.)  

     **5: Does the principle range over all propositions?**  
     - **Yes**: Go to 6.  
     - **No**: Go to 8.  

     **6: Does 'knowable' mean knowable by some possible knower at all (including ideal limits)?**  
     - **Ideal (limit of inquiry)**: Go to 7.  
     - **Actual (non-ideal knowers)**: Go to 6.1.  

     **6.1: Actualist move**  
     *Position:* Confine KP to what is actually knowable by non-ideal knowers (e.g., humans in the actual world), retaining all other assumptions.  
     *Awkward commitment:* Some truths (e.g., "there is extraterrestrial life") may be unknowable in practice by any actual agent, even if true, making KP vacuously weak.  
     *Leaf ends.*  

     **7: Does the derivation refute the knowability principle?**  
     - **Yes**: Go to 7.1.  
     - **No**: Go to 7.2.  

     **7.1: Realist response**  
     *Position:* Abandon KP as false due to the paradox, accepting classical logic, factivity, distribution, universal range, and ideal knowability.  
     *Awkward commitment:* There are truths (e.g., "p and no one knows p") that are inherently unknowable, even to an ideal community.  
     *Leaf ends.*  

     **7.2: Dialetheist option**  
     *Position:* Accept KP and all assumptions, but allow true contradictions for the offending propositions.  
     *Awkward commitment:* Some truths (e.g., "p and no one knows p") are both knowable and unknowable, violating classical consistency.  
     *Leaf ends.*  

     **8: What is the restriction on the range of propositions?** (Note: All branches from 8 assume classical logic, factivity, distribution, and a non-universal range.)  
     - **Propositions not about knowledge (non-epistemic)**: Go to 8.1.  
     - **Propositions whose truth does not depend on what is known**: Go to 8.2.  
     - **Basic or decidable propositions**: Go to 8.3.  

     **8.1: Restriction to non-epistemic propositions**  
     *Position:* KP applies only to propositions not involving the concept of knowledge (e.g., "snow is white," not "no one knows snow is white").  
     *Awkward commitment:* Knowledge itself cannot be a subject of inquiry under KP (e.g., "knowledge is fallible" is excluded).  
     *Leaf ends.*  

     **8.2: Restriction to propositions independent of knowledge**  
     *Position:* KP applies only to propositions whose truth is not affected by what is known (e.g., "there are black swans," but not "no one has discovered black swans").  
     *Awkward commitment:* Truths about current ignorance (e.g., "this undiscovered planet exists") are excluded, even though they seem knowable.  
     *Leaf ends.*  

     **8.3: Restriction to basic or decidable propositions**  
     *Position:* KP applies only to "basic" propositions (e.g., empirical observations) or decidable ones (e.g., mathematical statements with algorithms).  
     *Awkward commitment:* KP does not apply to undecidable or complex truths (e.g., the Goldbach conjecture), limiting its anti-realist appeal.  
     *Leaf ends.*  

  ---

  #### Summary of Leaves and Positions
  1. **Move to intuitionistic logic**: Awkward commitment: Must deny the meaningfulness of asserting unknown truths.  
  2. **Denial that knowledge distributes over conjunction**: Awkward commitment: Knowledge of conjunctions need not imply knowledge of conjuncts.  
  3. **Actualist move**: Awkward commitment: Some truths are unknowable by actual agents.  
  4. **Realist response**: Awkward commitment: Some truths are inherently unknowable.  
  5. **Dialetheist option**: Awkward commitment: Some truths are both knowable and unknowable.  
  6. **Restriction to non-epistemic propositions**: Awkward commitment: KP excludes all propositions about knowledge.  
  7. **Restriction to propositions independent of knowledge**: Awkward commitment: KP excludes truths dependent on current ignorance.  
  8. **Restriction to basic or decidable propositions**: Awkward commitment: KP excludes undecidable or complex truths.  

  #### Empty Combinations
  - **Deny factivity (at Node 2)**: Coherent but unattractive. Denying that knowledge entails truth is a radical revision of epistemology and is not occupied in the literature.  
  - **No other empty combinations**: All other paths lead to occupied positions. The tree does not force artificial distinctions; e.g., the schema vs. universal quantification (Node 4) converges at Node 5 because responses do not depend on this distinction in practice.  

  ---

  ### Closing Note
  This tree clarifies that **Fitch's derivation is valid in classical logic with factivity, distribution, universal KP, all propositions, and ideal knowability**. Responses must reject at least one ingredient. Settled points include:
  - The derivation's validity under the above assumptions.
  - The necessity of rejecting one assumption to avoid omniscience.

  Genuine disagreements persist among informed positions, primarily over **which ingredient is the most plausible culprit**. These are not verbal disputes but reflect deeper philosophical commitments:
  - **Logic choice**: Intuitionists reject classical negation rules; classicists see this as ad hoc.
  - **Knowability interpretation**: Actualists and idealists disagree on whether knowability requires realizability in the actual world.
  - **Range restriction**: Restrictionists debate which class of propositions preserves KP's anti-realist spirit without triviality.
  - **Distribution/factivity**: Denying distribution is seen as technical by some and incoherent by others; denying factivity is uniformly avoided.

  The paradox remains unresolved because each response imposes costs, and there is no consensus on the "correct" sacrifice. The tree helps locate these costs without endorsing any single path.
