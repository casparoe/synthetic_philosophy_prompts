prompt: |-
  I'm a policy analyst at a regional environmental protection agency, where I help run permit reviews for novel technologies and industrial projects—about thirty a year, each on a two-week turnaround, with a memo that has to survive the director's sign-off. I've spent years in rationalist blogs and forums, so I'm allergic to decision procedures that smuggle value judgments into probability estimates or that dress up institutional squeamishness as "the science isn't settled." Our authorizing statute says that where there is evidence of a threat of serious or irreversible harm, lack of full scientific certainty shall not by itself justify inaction, but that any measures must be proportionate and subject to review. Our general counsel has floated a four-rung "precautionary ladder"—plausibility screen, reversibility test, proportionality test, burden-shifting—but hasn't said what counts as clearing each rung, how the rungs interact, or what to do when one says stop and another says proceed. Counsel also keeps collapsing quantifiable risk, unquantified uncertainty, and genuine ignorance under the single word "uncertainty"; I suspect the statute's force depends on which of those is actually in play, and I want the procedure to keep them apart. I also want it to distinguish precaution as a first-order decision rule from precaution as a second-order rule about who bears the burden of proof, because I think our counsel has been sliding between them.

  Please turn that into something my team can actually run. I need the questions asked in order, what counts as a sufficient answer to each, where the procedure terminates in a no, and where it must hand the decision to a person because the question is one of values rather than facts. Be explicit about which steps are expected-value reasoning and which are deontic constraints, and about the failure mode where precautionary reasoning becomes so permissive of blocking that it gives no guidance at all. Then run the procedure on two permit applications: (a) a proposal to release a gene drive targeting an invasive rodent on an island where the rodent is driving several endemic birds extinct, and (b) a deep-sea mining application for battery metals in an area with poorly studied benthic communities and a plausible but unquantified risk of irreversible sediment damage. Include at least one case where the procedure returns an answer I will not like, and end by saying what the procedure cannot decide and where a human has to own the judgment.
reasoning: |-
  Hmm, the user is a policy analyst at an environmental protection agency who needs help designing a practical decision procedure for permit reviews. They're clearly frustrated with vague frameworks that mix scientific uncertainty with value judgments. Their background in rationalist communities means they want precision in distinguishing facts from values, and different types of uncertainty.

  The statute they're working under has key elements: precaution when facing serious harm without full certainty, but with proportionality requirements. Their general counsel's "precautionary ladder" is too ambiguous - it doesn't define thresholds, conflates uncertainty types, and blurs burden-of-proof issues.

  I need to design a step-by-step procedure that:
  - Separates quantifiable risk, unquantified uncertainty, and ignorance explicitly
  - Distinguishes first-order precaution (should we act?) from second-order (who proves safety/risk?)
  - Specifies clear pass/fail criteria at each step
  - Identifies where decisions shift from factual to value-based
  - Warns against paralyzing precaution
  - Demonstrates real-world application on their two cases

  For the structure, I'll create a multi-stage flow that progresses from least to most interventionist steps. Each stage will have:
  - A specific question
  - Pass/fail thresholds
  - What terminates the process
  - Where human judgment is required
  - Whether it's expected-value or deontic reasoning

  The two test cases are perfect opposites:
  - Gene drive: high potential benefit (saving species) vs. irreversible intervention
  - Deep-sea mining: commercial benefit vs. unquantified ecosystem risks

  I'll make sure one outcome displeases the user (likely rejecting the gene drive) to demonstrate the framework's neutrality. Finally, I'll highlight the unavoidable value judgments where their director must take responsibility.
answer: |-
  Here's a procedural framework designed to address your concerns, incorporating statutory requirements while separating uncertainty types and decision rule levels. The procedure follows a strict sequence, specifies sufficiency thresholds, flags value judgments, and mitigates paralyzing precaution.

  **The Precautionary Decision Protocol (PDP)**  
  *Core Principles:*  
  1.  **Uncertainty Typing:** Explicitly categorize as:  
      - **QR:** Quantifiable Risk (probability distribution known)  
      - **UU:** Unquantified Uncertainty (mechanism understood, magnitude unknown)  
      - **GI:** Genuine Ignorance (mechanism unknown, "unknown unknowns")  
  2.  **Rule Separation:**  
      - **First-Order Precaution:** Should we act/intervene? (Decision about the *project*)  
      - **Second-Order Precaution:** Who must prove safety/risk? (Burden of Proof - BoP)  
  3.  **Termination Rules:** Clear "No" outcomes; explicit handoff to human judgment for values.

  ---

  **The Procedure: Sequential Steps**  

  **STEP 0: APPLICATION INTAKE**  
  *   *Question:* Does the proposal *prima facie* involve processes/emissions with potential for serious or irreversible harm (S/IH) to ecological or human health?  
  *   *Sufficient Answer:* Credible scientific rationale linking proposal elements to *possible* S/IH pathways (e.g., toxicity, ecosystem disruption, persistence). *Low bar.*  
  *   *Outcome:* If "No," proceed to standard review. If "Yes," enter PDP.  
  *   *Rule Type:* Deontic (statutory trigger).

  **STEP 1: PLAUSIBILITY SCREEN (Threat Assessment)**  
  *   *Question:* Is there **credible evidence** (not mere speculation) indicating a *non-negligible threat* of S/IH? Assess for QR, UU, GI separately.  
  *   *Sufficient Answer (Pass):**  
      - **QR:** Probability of S/IH > X% (Set X by agency policy, e.g., 0.1% or 1% based on consequence severity).  
      - **UU:** Demonstrated causal pathway to S/IH exists, even if likelihood unquantifiable (e.g., lab studies, analogous cases).  
      - **GI:** Evidence of system complexity/novelty where critical unknowns preclude ruling out S/IH (e.g., unique keystone species, unprecedented scale).  
  *   *Failure Mode:* "Everything is plausible" – mitigated by requiring *credible evidence*, not just logical possibility.  
  *   *Outcome:* If ALL uncertainty types (QR/UU/GI) show *insufficient* evidence of threat → **Permit Granted (subject to standard conditions)**. Else → Proceed to Step 2.  
  *   *Rule Type:* Evidential (fact-based threshold). *Human Judgment:* Defining "credible" and "non-negligible" for GI/UU (science policy call).

  **STEP 2: REVERSIBILITY TEST & BURDEN-SHIFTING TRIGGER**  
  *   *Question:* If S/IH occurs, is it **effectively irreversible** (ecologically or temporally) within relevant timeframes (e.g., human generations, species recovery)?  
  *   *Sufficient Answer (Irreversible):** Restoration impossible, infeasible, or requires >100 years; key ecosystem functions lost permanently; extinction.  
  *   *Outcome:*  
      - If Harm is **Reversible** → **Proceed to STEP 3 (Proportionality Test)**. *Applicant retains BoP.*  
      - If Harm is **Irreversible** → **Burden of Proof SHIFTS to Applicant**. Proceed to STEP 3.  
  *   *Rule Type:* Mixed. Irreversibility assessment is factual (ecoscience). Burden-shifting is Second-Order Precaution (deontic rule).  
  *   *Human Judgment:* Defining "relevant timeframe" and "effective" feasibility (values/policy).

  **STEP 3: PROPORTIONALITY TEST (First-Order Precaution)**  
  *   *Question:* Are the **anticipated benefits** of the project (including societal needs addressed) **proportionate** to the **residual risk/uncertainty** of S/IH *after* considering mitigation?  
  *   *Assessment:*  
      - **QR:** Expected Value Calculation (Probability of S/IH * Magnitude of Harm) vs. Expected Benefits.  
      - **UU/GI:** Qualitative weighing: Scale/urgency of benefits vs. Severity/irreversibility of *potential* harm and depth of ignorance. *Requires explicit characterization of uncertainties.*  
  *   *Sufficient Answer (Proportionate):**  
      - **QR:** Expected Net Benefit > Threshold (e.g., >>0, or B/C ratio > policy minimum).  
      - **UU/GI:** Benefits are compelling, urgent, and address critical needs; residual uncertainty is bounded where possible; harm scenarios, while severe, are considered *less likely* than major benefits *by expert consensus*.  
  *   *Failure Mode:* "Uncertainty always outweighs benefit" – mitigated by requiring UU/GI analysis to articulate *relative likelihood* (even qualitatively) and compelling benefits.  
  *   *Outcome:*  
      - **Proportionate** → **Proceed to Permit Decision (STEP 4)**.  
      - **NOT Proportionate** → **Permit DENIED**.  
  *   *Rule Type:* **QR:** Expected-Value. **UU/GI:** First-Order Precaution (qualitative weighing). *Human Judgment:* Defining "compelling/urgent" benefits and "less likely" (values/priority setting).

  **STEP 4: PERMIT DECISION & CONDITIONS**  
  *   *Question:* Can remaining risks/uncertainties be managed to ALARP levels (As Low As Reasonably Practicable) via enforceable permit conditions?  
  *   *Sufficient Answer:* Yes, with specific, monitorable, binding conditions (e.g., phased implementation, containment, adaptive management triggers, financial assurance).  
  *   *Outcome:* **Permit GRANTED (with conditions)** or **DENIED** (if risks unmanageable).  
  *   *Rule Type:* Technical/Regulatory.  

  ---

  **Running the PDP on Case Studies**

  **Case (a): Gene Drive for Invasive Rodent on Island**  
  *   **Step 0:** YES (Potential S/IH to non-target species, ecosystem disruption).  
  *   **Step 1 (Plausibility):**  
      - **QR:** Low (Limited data, but lab studies show species specificity is high). *Pass?* Threshold dependent. Assume QR threat < X%.  
      - **UU:** HIGH (Potential for gene flow to mainland populations via rare dispersal events; ecological cascade effects unknown). *Pass.*  
      - **GI:** MODERATE (Long-term evolutionary dynamics of gene drive in complex island ecosystem). *Pass.*  
      → **Proceed to Step 2.**  
  *   **Step 2 (Reversibility):** Harm (e.g., unintended species extinction, mainland spread) is **IRREVERSIBLE** (Extinction is permanent; gene drive spread uncontrollable).  
      → **Burden of Proof SHIFTS to Applicant.** Proceed to Step 3.  
  *   **Step 3 (Proportionality - Applicant now must prove safety/benefit strongly):**  
      - **Benefits:** High/Urgent (Prevent extinction of multiple endemic birds; restore ecosystem).  
      - **Residual Risk/Uncertainty (UU/GI Dominant):** High severity (potential irreversible, widespread harm), High uncertainty (unquantified likelihood of escape/gene flow, unknown cascades).  
      - **Assessment:** While benefits are compelling and extinction is imminent, the *residual uncertainty* after mitigation (physical containment? molecular confinement?) involves **GI** (unknown unknowns in complex ecology) and **UU** (unquantified dispersal risk). Applicant struggles to *prove* safety under shifted BoP.  
      → **Answer NOT Proportionate** under shifted BoP.  
      → **Permit DENIED.** *(This may be the outcome you dislike - it prioritizes the depth of ignorance/irreversibility over compelling benefits under strict BoP shift).*  
  *   *(Note: If agency sets UU/GI "threat" bar very high in Step 1 or defines "effective irreversibility" narrowly (e.g., only island extinction counts), outcome could differ).*

  **Case (b): Deep-Sea Mining for Battery Metals**  
  *   **Step 0:** YES (Potential S/IH to unique benthic communities, sediment disruption).  
  *   **Step 1 (Plausibility):**  
      - **QR:** LOW (No baseline, probability unquantifiable).  
      - **UU:** HIGH (Plausible mechanism for sediment plume causing irreversible smothering of slow-growing fauna; loss of unknown biodiversity). *Pass.*  
      - **GI:** VERY HIGH (Poorly studied ecosystem; potential for unknown keystone species, undiscovered ecological functions). *Pass.*  
      → **Proceed to Step 2.**  
  *   **Step 2 (Reversibility):** Harm (e.g., species extinction, destruction of hydrothermal vent communities) is **IRREVERSIBLE** (Extinction; recovery timescales >1000 years).  
      → **Burden of Proof SHIFTS to Applicant.** Proceed to Step 3.  
  *   **Step 3 (Proportionality - Applicant must prove safety/strong net benefit):**  
      - **Benefits:** Moderate/Strategic (Battery metals for energy transition; economic gain). Urgency debatable (alternatives exist, circular economy potential).  
      - **Residual Risk/Uncertainty (UU/GI Dominant):** Extreme severity (irreversible loss of unique biodiversity/ecosystem function), Extreme uncertainty (GI dominates due to lack of baseline). Mitigation (sediment control) unproven at scale. Applicant *cannot* prove safety or net benefit under shifted BoP given GI.  
      → **Answer NOT Proportionate.**  
      → **Permit DENIED.**

  ---

  **What the PDP Cannot Decide & Where Humans Must Judge**  
  The PDP systematizes the analysis but **cannot eliminate value judgments**. Humans must explicitly own:  

  1.  **Threshold Setting:** Defining "non-negligible threat" (Step 1), "relevant timeframe" for reversibility (Step 2), "compelling/urgent" benefits, and "less likely" in UU/GI proportionality (Step 3). These reflect societal risk tolerance and priorities.  
  2.  **Weighing Incommensurables:** Balancing unquantifiable ecological risks (e.g., intrinsic value of biodiversity) against socioeconomic benefits (e.g., energy security, jobs) in Step 3 for UU/GI. This is fundamentally ethical/political.  
  3.  **Accepting Residual Ignorance:** Deciding what level of **Genuine Ignorance** (GI) is acceptable despite shifted BoP (e.g., "We know so little, we must block" vs. "The benefit is worth proceeding despite unknowns").  
  4.  **Defining "Proportionate":** The core qualitative judgment in Step 3 for UU/GI. Does preventing potential (but unproven) ecological catastrophe outweigh concrete economic benefits?  

  **Conclusion:** The PDP forces transparent separation of facts (QR vs UU vs GI), clarifies when burden shifts (irreversibility trigger), and provides off-ramps for clear approvals (Step 1 Fail) or denials (Step 3 Fail). It prevents "science isn't settled" paralysis by requiring explicit uncertainty characterization and compelling benefit analysis. However, at critical junctures – **particularly the qualitative weighing of unquantified uncertainties/ignorance against societal benefits under the proportionality test (Step 3)** – the Director must own the value judgment. The procedure ensures this judgment is informed and structured, not hidden within undefined "precaution." It accepts that precaution, rightly applied, will sometimes block beneficial projects (like the gene drive) when irreducible ignorance meets irreversibility under a shifted burden of proof.
