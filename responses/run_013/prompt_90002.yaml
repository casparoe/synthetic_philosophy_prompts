  ### 4. Verbal Disagreement  
  The dispute is **partly verbal** regarding the term "conditional information":  
  - **Infomin Camp**: Interprets "updating on a conditional" as **applying a constraint** to the distribution, requiring optimization (KL).  
  - **Conditionalization Camp**: Interprets "updating on a conditional" as **learning a logical relationship** (e.g., \(\text{Red} \rightarrow SC\)), demanding probability laws (e.g., \(P(SC \mid \text{Red}) = 1\)) override priors without further adjustment.  
  This divergence stems from differing views on whether constraints require *redistribution* (Infomin) or *selective replacement* (Conditionalization) of probabilities.  

