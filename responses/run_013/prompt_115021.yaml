prompt: |-
  I serve on the ethics committee of a teaching hospital, and I have been asked to draft a minority comment on a memo that has been circulating for the past month. The case is a woman in the middle stage of dementia. Several years ago, while competent, she signed a directive declining artificial nutrition and hydration in the event of advanced dementia. She no longer recognizes her family. She is not in pain; she eats with encouragement; on good days she says she wants to go on living. Because her swallowing is deteriorating, the team has proposed a feeding tube, and the question is whether to place it. The memo argues that the directive governs and that her present apparent wish to continue living cannot override it, and it makes its case with an analogy I keep running into: an advance directive is like a will. The competent woman was the testator; the document she signed is the instrument; the demented patient is the estate; the clinicians are the executors; and just as an estate cannot rewrite the will that created it, the present patient cannot revoke an instruction issued by the person she used to be. On that basis the memo recommends that her present wishes be treated as evidence about her welfare — data to be weighed — rather than as the authoritative voice of the person whose life is at stake.

  Two labels will help, and I will use them throughout: precedent autonomy for the authority of the earlier instruction, and contemporaneous autonomy for the authority of the present self's wishes. I also want kept apart two things a directive might be doing when it binds: precommitting against weakness of will (where the later self, were she lucid, would endorse the earlier restraint) and precommitting against a change in values (where the later self, were she lucid, would repudiate the instruction and mean it).

  Please audit the analogy. Make the mapping explicit, say where it holds, where it breaks, and whether the memo's conclusion can actually be carried by the analogy or only appeared to be. I would also like you to say which reading of the directive the analogy presupposes — an authoritative instruction, or fallible evidence of what she would now want — and whether it survives on the other reading. Please organize the response as follows.

  1. The mapping. A correspondence table: testator, instrument, estate, heir, executor, probate, and the moment of death, with what plays each role in the clinical case, and a flag on any role that has no counterpart. About 300 words.
  2. Where it holds. The features of testamentary succession that genuinely transfer to advance directives, and what work they do for the memo. About 250 words.
  3. Where it breaks. The disanalogies, marked as to which ones bear on the memo's conclusion and which are harmless decoration. Please consider at least whether the property disposed of can be separated from the person it disposes of, whether the transition from author to subject has a determinate moment, whether the later self has been left the testator's power to revoke, and how much of a will's force comes from an apparatus of enforcement that the clinic does not have. About 400 words.
  4. What the analogy quietly imports. The features of the source case it needs but the target lacks, and the conclusions that ride in on them. About 250 words.
  5. Does the conclusion survive. Your verdict on whether the memo's recommendation is supported by the analogy or merely dressed in it, and what would have to be argued independently. About 250 words.
  6. A better analogy. Assess the rival candidates I have heard floated — Odysseus at the mast, and an entrenched constitutional clause binding a later legislature — against the features that actually matter here, and offer your own if neither fits. About 200 words.
reasoning: |-
  Okay, the user is on an ethics committee and needs to draft a minority comment about a complex case involving a dementia patient's advance directive. They've asked me to audit a legal analogy comparing advance directives to wills that's being used to argue against honoring the patient's current wishes. 

  Hmm, this is a profound ethical dilemma with real-world consequences. The core tension is between respecting past autonomy (the directive) and present autonomy (her expressed will to live). The user seems intellectually rigorous - they've already defined key terms like precedent vs contemporaneous autonomy and want the analogy dissected systematically.

  First, I need to map the will analogy precisely. The testator is the competent past self, the estate is the current demented self... but already I see problems. Unlike property, you can't separate a person from their own life. And death's finality in wills doesn't apply to the gradual dementia transition. 

  The analogy holds in superficial ways - both documents express wishes when competent. But it breaks dangerously in assuming the current self is merely "property" to be disposed of. That's dehumanizing. Also, wills have probate courts for enforcement; clinical decisions involve ongoing relationships.

  Ah, and the analogy quietly imports the idea that identity is fixed at competence, ignoring how dementia transforms but doesn't erase personhood. The memo's conclusion leans entirely on this flawed premise - it can't stand without it.

  For better analogies... Odysseus tied to the mast works for weakness of will, but not value changes. Constitutional amendments are closer - they allow revisions with difficulty. Maybe a time-delayed contract with revocation clauses? But ultimately, no analogy captures the ethical weight of a living person's current cries to survive.

  The user needs to show that the current self isn't just "evidence" but a voice demanding moral consideration. I'll structure this tightly per their requested sections - they clearly want ammunition for committee debate.
answer: |-
  Here is a systematic audit of the will analogy and its implications for the case, structured per your request:

  **1. The Mapping (Correspondence Table)**

  | Testamentary Concept       | Clinical Case Analog                                  | Match Quality   | Notes                                                                 |
  | :------------------------- | :---------------------------------------------------- | :-------------- | :-------------------------------------------------------------------- |
  | **Testator**               | The competent person who signed the directive         | Direct          | The autonomous individual at Time T1.                                 |
  | **Instrument (Will)**      | The advance directive document                        | Direct          | The formal expression of wishes.                                      |
  | **Estate**                 | The demented patient (current self)                   | **Problematic** | Treats the living patient as property, not a person. Key disanalogy. |
  | **Heir/Beneficiary**       | *No clear counterpart*                                | Absent          | Directive designates no "beneficiary" of the refusal.                 |
  | **Executor**               | Clinicians/Healthcare team                            | Partial         | Charged with implementing the document, but role is caregiving, not asset distribution. |
  | **Probate**                | Ethics Committee/Hospital review process              | Partial         | Process to validate/interpret the directive's applicability.          |
  | **Moment of Death**        | Onset of the condition triggering the directive (advanced dementia) | **Problematic** | Dementia onset is gradual, not a discrete event like death. Ambiguity undermines the analogy. |
  | **Testator's Revocation Power** | Competent person's ability to revoke directive pre-incapacity | **Omitted**     | Crucial disanalogy: the *estate* (current self) has no revocation power, unlike the *testator*. |

  *Word Count: 190*

  **2. Where the Analogy Holds**

  The analogy holds in several limited but significant ways:
  *   **Formal Expression of Wishes:** Both a will and an advance directive are formal, written instruments created by a competent individual to dictate actions regarding their future state (death/loss of capacity). This formality underscores the seriousness of the author's intent.
  *   **Post-Capacity/Post-Death Authority:** Both instruments are designed to govern *after* the author loses the capacity to make decisions (through death or incapacity). They derive authority from the prior competent act.
  *   **Fiduciary Duty:** Executors (will) and clinicians/agents (directive) have a fiduciary duty to faithfully implement the terms of the document, resisting external pressures or personal preferences conflicting with the author's stated wishes.
  *   **Preventing Exploitation:** Both systems aim to prevent others (potential heirs/self-interested parties) from overriding the author's authentic wishes when they are vulnerable.

  These features support the memo's core argument: the formally expressed precedent autonomy of the competent person carries significant, potentially decisive, weight over the preferences expressed by the now-incapacitated individual or others after the triggering event. It emphasizes the directive as an *instruction*, not just evidence.

  *Word Count: 178*

  **3. Where the Analogy Breaks (Critical Disanalogies)**

  The analogy breaks down critically in ways directly bearing on the memo's conclusion:
  *   **Nature of the "Property" (Harmful):** Wills dispose of *external property* separable from the testator. The directive disposes of *the patient's own body and life*. The demented patient *is* the subject, not inert property ("the estate"). Treating her as an "estate" fundamentally devalues her ongoing existence and personhood, however diminished.
  *   **Indeterminate Transition (Harmful):** Death is a discrete, unambiguous event. The transition from competence to incapacity in dementia is gradual and contested. When exactly does the "testator" cease to be, and the "estate" begin? This ambiguity directly challenges the analogy's applicability in the "middle stage" where the patient still expresses preferences.
  *   **Revocation Power (Critical):** A testator can revoke or amend their will *until death*. Crucially, the *estate* cannot. The analogy explicitly denies the *current patient* (the "estate") any power to revoke the directive. However, unlike a corpse, the current patient *can* express preferences. The analogy assumes the directive is irrevocable *by the patient* once incapacity triggers it, but this is a contested ethical/legal point imported by the analogy, not proven by it.
  *   **Enforcement Apparatus (Harmless Decoration):** Wills rely on courts (probate) for enforcement and interpretation. Advance directives rely on clinical judgment, ethics committees, and sometimes courts, but lack the same rigid legal machinery. This difference doesn't inherently weaken the directive's authority within its domain but highlights the context is care, not property law.
  *   **Beneficiary Absence (Harmless):** The lack of a clear "heir" in the clinical case doesn't significantly weaken the analogy's core claim about precedent autonomy vs. the current patient.

  *Word Count: 302*

  **4. What the Analogy Quietly Imports**

  The analogy surreptitiously imports several contentious premises essential for the memo's conclusion:
  *   **Radical Discontinuity of Identity:** It presupposes that the competent author ("testator") and the demented patient ("estate") are distinct entities. This denies psychological continuity and the possibility that values might persist or evolve in ways the directive didn't anticipate. It frames the current patient as a non-personal residue.
  *   **Irrevocability at Trigger:** It assumes the directive becomes absolutely irrevocable the moment the specified condition (advanced dementia) arises, mirroring death's finality for a will. This ignores the potential for evolving preferences *within* the dementia journey and the ethical question of whether a directive *must* bind rigidly despite later expressions of will from the *same* biological person.
  *   **Directive as Sole Sovereign Instruction:** It frames the directive exclusively as an *authoritative instruction* (like a will's bequest), suppressing the alternative view that it is primarily *evidence* of likely wishes to be weighed alongside current expressions. The analogy inherently requires the "instruction" model.
  *   **Current Wishes as External Data:** By casting the patient as the "estate," her expressed wishes are necessarily seen as external to the authoritative voice (the testator), mere data points about the estate's condition, rather than expressions of the *same* person's current will.

  *Word Count: 219*

  **5. Does the Conclusion Survive?**

  The memo's **conclusion does not survive the breaking of the analogy**. The analogy *creates the appearance* of logical necessity for prioritizing precedent autonomy by:
  1.  Dehumanizing the current patient into passive "property."
  2.  Imposing a false, discrete moment where authority transfers absolutely and irrevocably.
  3.  Illegitimately importing the irrevocability premise of wills post-death.

  The analogy is **rhetorically powerful but philosophically flawed** as the sole basis for the conclusion. To argue that the directive categorically overrides current expressions of a will to live, one must independently argue for:
  *   The *ethical primacy* of precedent autonomy over contemporaneous autonomy in cases of value change (not just weakness of will).
  *   A specific threshold of cognitive decline where the *person* who authored the directive is deemed to no longer exist, rendering the current individual incapable of autonomous revocation.
  *   Why the directive must be interpreted as a binding instruction rather than primary (but potentially overridable) evidence of past wishes in the specific context of conflicting current expressions.
  The analogy masks the need for these difficult, independent ethical justifications.

  *Word Count: 200*

  **6. A Better Analogy?**

  *   **Odysseus at the Mast:** This captures **weakness of will** brilliantly. Odysseus binds himself *against* a predicted future impulse (succumbing to the Sirens) that he *knows* he will regret. It presupposes the later self, if unbound, would endorse the precommitment. **It fails for value change.** If Odysseus later *genuinely valued* the Sirens' song more than survival, the binding would be oppressive. This aligns poorly with a dementia patient who *currently*, without apparent distress, expresses a will to live – a potential value shift.
  *   **Entrenched Constitutional Clause:** This better addresses **value change over time**. A founding generation entrenches a rule (e.g., equal protection) to bind future majorities who might *genuinely* wish to deviate. This mirrors precedent autonomy aiming to bind a future self with potentially different values. **Strengths:** Acknowledges the later entity (legislature/current self) retains agency but is constrained by prior higher-order commitments. **Weaknesses:** Constitutions have amendment procedures (revocation), unlike the rigid will analogy. The "entrenchment" level of advance directives is debated, and the "amendment" process for a demented patient is ethically fraught.

  **Proposed Alternative: A Time-Delayed Contract with Revocation Clauses.** Imagine Person A contracts with Person B (a trusted agent) at T1: "If Condition X arises at T2, you must do Y, *unless I explicitly revoke this instruction while experiencing X*." This model:
  *   Respects precedent autonomy as an instruction.
  *   Explicitly builds in a mechanism for contemporaneous autonomy to potentially revoke, even within the constrained state.
  *   Avoids dehumanizing the later self.
  *   Acknowledges the agent's (clinician's) fiduciary duty while allowing for the possibility of authentic value expression post-trigger.
  It directly confronts the core ethical tension the will analogy obscures.

  *Word Count: 248*
