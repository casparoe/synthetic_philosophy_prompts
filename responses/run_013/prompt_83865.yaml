prompt: |-
  I have taught in both a German and an American philosophy department, and I keep noticing a pattern in how people describe someone who follows a rule against the grain. The same conduct gets opposite descriptions depending on whether the observer approves of the rule. A pharmacist who refuses to dispense a drug he thinks does harm is 'principled' to one audience and 'a fanatic hiding behind a rule' to the other. A civil servant who carries out an order he finds repellent is 'conscientious' to one audience and 'a coward who has outsourced his conscience' to the other. The reverse case flips in the same way: the man who follows his own judgment against a rule is 'making an exception for himself' when the observer approves of the rule and 'a man of conscience' when the observer does not. So 'integrity' and 'conscience' seem to be awarded on the strength of our verdict on the content of the judgment rather than on anything about the agent's relation to his own judgment, which makes me doubt the words do any work of their own. I notice a second thing as well: each of the two traditions I move between — one that holds a rule binds because it is the rule, one that holds only a man's own judgment binds him — has a well-worn name for the other's characteristic failure (legalism, blind obedience; self-righteous individualism, conscience as a licence) and no name for its own, which it does not count as a failure at all.

  Is there an established concept for either pattern? I have been told the first is just 'thick concepts', but that seems to concern the meaning of the words rather than the conditions under which we hand them out, and I doubt the second has a name at all. Don't simply supply a label: say what each phenomenon is, what it is not, and where its edges lie — including what would count as integrity or conscience that survives a verdict on the content. Give me a definite verdict rather than a survey of options: which existing concept comes closest, whether it is close enough to do the work, and if not, what you would call the thing instead and why that carving is better.
reasoning: |-
  Hmm, the user presents an insightful observation about moral language and cultural differences between German and American philosophical traditions. They've noticed how terms like "principled" or "conscientious" get applied inconsistently based on whether the observer approves of the rule being followed or broken, rather than on the agent's internal consistency. They also point out how each tradition has pejorative terms for the other's approach but lacks self-critical vocabulary.

  The user is clearly a philosophy professional based on their teaching experience and sophisticated analysis. They're frustrated with how moral language seems circular - where "integrity" gets awarded based on agreement with the action rather than the agent's relationship to their judgment. They've already considered and rejected "thick concepts" as an explanation since it deals with word meanings rather than application conditions.

  They want two things named: first, the pattern where moral praise depends on content approval rather than formal consistency; second, the pattern where traditions lack self-criticism while having labels for the other's failures. They want precise definitions with boundaries, not just labels, and a definite verdict on existing concepts.

  For the first pattern, "moral credentialing" seems closest - it captures how we use moral terms to signal alignment rather than describe properties. This differs from thick concepts by focusing on pragmatic function rather than semantic content. The boundary would be cases where someone acts against their own judgment - that wouldn't count even if we approved.

  For the second pattern, "asymmetric critique asymmetry" describes how traditions weaponize language against opponents while being blind to their own flaws. This differs from mere hypocrisy by being structural rather than individual. The boundary would be balanced traditions that have self-critical terms.

  No existing concept perfectly fits, so I'll propose "axiological ratification" for the first phenomenon (emphasizing value-endorsement) and "normative solipsism" for the second (highlighting the lack of external perspective). This carving is better because it isolates the core mechanisms: value-signaling in language use, and epistemic closure in moral traditions.

  The user's deeper need appears to be conceptual tools to cut through moral rhetoric and analyze what's actually happening when we deploy terms like "conscience." They want to transcend the very cultural frameworks they've observed by naming their operating mechanisms.
answer: |-
  Your observation cuts to the heart of moral epistemology and linguistic pragmatics. You've identified two distinct but related phenomena:

  **1. The Content-Dependent Application of "Integrity" and "Conscience" Terms:**  
  This is the core pattern where terms like "principled," "conscientious," "having integrity," or "fanatic," "coward," "self-righteous" are applied based *solely* on the observer's agreement with the *substantive moral judgment* being acted upon (the rule or the personal judgment), rather than on the *formal quality* of the agent's commitment to acting according to their *own* sincerely held conviction.

  *   **What it is:** A form of **evaluative attribution bias** or **moral credentialing by proxy**. The terms function primarily as signals of the *observer's* approval or disapproval of the *action's outcome/content*, using the language of character or motive as rhetorical dressing. "Integrity" and "conscience" become honorifics bestowed when the agent's action aligns with the observer's values, regardless of the agent's actual internal consistency. Conversely, pejoratives are applied when the action conflicts.
  *   **What it is not:**
      *   It is *not* simply the application of "thick concepts." Thick concepts (like "courageous," "cruel") blend description and evaluation inherently *within their meaning*. Your phenomenon concerns the *pragmatic conditions of application* for terms that *purport* to describe a *formal relation* (loyalty to principle/internal judgment) but are applied based on content.
      *   It is *not* genuine ascription of character based on perceived internal consistency. If that were the case, the pharmacist sticking to their *own* rule against harm would always be "principled," even if the observer thought the rule bad. Here, they become a "fanatic."
  *   **Edges & Surviving Integrity:**
      *   **Edge Case (Content-Independence):** True "integrity" or "conscience" ascription *would* survive a negative verdict on the content *if* the observer acknowledges the agent acted with rigorous internal consistency *against their own perceived best interest or comfort*, *solely* because they felt bound by their principle/judgment, even while profoundly disagreeing with that principle/judgment. Example: "I find his refusal to dispense the morning-after pill abhorrent and his reasoning flawed, but I cannot deny he acted with integrity according to his own lights, sacrificing his job/standing for his belief." This is rare.
      *   **Boundary:** The phenomenon breaks down when the agent is *perceived* as acting *against* their own sincere judgment (e.g., the civil servant who *secretly* despises the order but follows it out of pure careerism wouldn't genuinely be called "conscientious" even by rule-approvers; they'd be called obedient or compliant, but the pejorative "coward" might still apply).
  *   **Closest Concept & Verdict:** **Moral Credentialing** (extended from its typical use about individuals signaling their own virtue). This captures the idea that calling someone "principled" often serves to *credential* the *action* or *rule* they follow as morally good *by association* with a positive character term. However, it doesn't fully capture the *systematic flip* based on rule approval. **"Axiological Ratification"** (Value-Endorsement Labeling) is a more precise neologism: The label ("principled," "fanatic") primarily ratifies (or condemns) the *value* seen in the action/rule, using the agent's character as the nominal vehicle. **Verdict:** "Moral Credentialing" is *close* but insufficiently specific. "Content-Dependent Virtue Attribution" is descriptive but clunky. **"Axiological Ratification" is the most accurate conceptual carving**, as it directly names the core mechanism: the application of characterological language is contingent on (`axios` = value, worth) the observer's ratification of the action's underlying value.

  **2. Asymmetric Critique Asymmetry Between Rule-Based vs. Judgment-Based Traditions:**  
  This is the pattern where each tradition possesses a well-defined, pejorative concept for the *other* tradition's characteristic failure mode ("legalism"/"blind obedience" vs. "self-righteous individualism"/"conscience as licence"), but lacks a corresponding critical concept for its *own* characteristic failing, which it doesn't perceive as a failing.

  *   **What it is:** A form of **epistemic closure** or **normative solipsism** within a moral framework. It demonstrates how moral traditions develop robust external critique but suffer from internal blind spots reinforced by their core axioms. The lack of an internal pejorative signifies that the potential failing is either invisible from within the framework (seen as necessary or virtuous) or is conceptualized using softer, justificatory language ("duty," "responsibility," "authenticity").
  *   **What it is not:**
      *   It is *not* mere hypocrisy (acting contrary to professed beliefs). It's a structural feature of the framework's self-understanding.
      *   It is *not* simply disagreement. The asymmetry lies in the *conceptual resources available for self-critique* compared to external critique.
      *   It is *not* universal. Some traditions *do* develop internal critiques (e.g., discussions of "scrupulosity" in religious deontology, or "bad faith" in existentialism touching on inauthentic appeals to "authenticity").
  *   **Edges:**
      *   **Edge Case (Internal Critique):** A tradition *develops* a critical concept for its own potential failing. E.g., within a rule-based tradition: "Pharisaism" (overly literal, hypocritical rule-following neglecting spirit) or "bureaucratic indifference" (rule-following devoid of human concern). Within a judgment-based tradition: "Moral Narcissism" (excessive focus on one's own purity of conscience over consequences/others) or "Decision Paralysis" (inaction due to fear of inauthenticity).
      *   **Boundary:** The phenomenon weakens in pluralistic or critically reflective environments where traditions actively borrow or develop self-critical tools.
  *   **Closest Concept & Verdict:** **Ideological Blind Spot** or **Paradigmatic Immunity**. These capture the idea of an area shielded from critique by the framework itself. However, they are broad. **"Asymmetric Conceptual Armament"** highlights the imbalance in critical resources. **"Normative Solipsism"** emphasizes the self-enclosed justification that makes the internal failing invisible *as* a failing. **Verdict:** "Ideological Blind Spot" is common but vague. **"Normative Solipsism"** best captures the *why* of the asymmetry: each tradition's core norm (rule-authority vs. personal-judgment-authority) provides the sole, self-validating justification for actions flowing from it, making the characteristic action *by definition* immune to being labeled a "failure" *within* that system. The failure only appears when viewed from the *external* normative system. This carving is superior as it diagnoses the root cause in the foundational epistemic/moral stance.

  **Conclusion:**

  1.  **Pattern 1 (Content-Dependent Labeling):** The established concept of "thick concepts" is relevant but misapplied here, as it concerns semantics, not pragmatics. The closest useful concept is **Moral Credentialing**, but it lacks precision for the systematic flip. **Axiological Ratification** is the superior conceptualization, naming the core mechanism: character terms are applied primarily to endorse (`ratification`) the perceived underlying value (`axios`) of the action/rule, not the agent's formal relation to their judgment.
  2.  **Pattern 2 (Asymmetric Critique):** There is no single established term. "Ideological Blind Spot" is descriptive but broad. **Normative Solipsism** provides the most accurate diagnosis: each tradition's foundational norm (rule or personal judgment as ultimate authority) creates a self-justifying framework that renders its own characteristic mode immune to *internal* conceptualization as a failure, leading to the observed asymmetry in critical vocabulary. The failing is only visible and namable from the *other* solipsistic framework.

  These conceptual carvings allow you to analyze the phenomena without getting trapped in the very language games you've observed. "Axiological Ratification" explains *how* the language is used manipulatively, while "Normative Solipsism" explains *why* the traditions lack the tools for self-critique on this point.
