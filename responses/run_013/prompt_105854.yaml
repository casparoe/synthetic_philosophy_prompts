answer: |-
  Based on your willingness-to-pay amounts across the six scenarios, your decision rule appears to be a combination of **expected utility with strong diminishing marginal utility of money** and **probability truncation (ignoring extremely low probabilities)**. Specifically, you evaluate lotteries using a concave utility function (consistent with risk aversion) that heavily discounts very high payouts, and you effectively ignore outcomes with probabilities below a certain threshold (around \(10^{-6}\) or lower) when they are part of a complex distribution like the St. Petersburg game. This explains why your valuations for the St. Petersburg variants are insensitive to changes in the tail (e.g., capping or truncating the game) and why you undervalue low-probability, high-payout lotteries relative to expected value.

  ### Key Principles and Fit to Your Verdicts:
  1. **Diminishing Marginal Utility**: You have a utility function that is concave, meaning each additional dollar provides less utility. This is common for risk-averse individuals and explains why you pay less than expected value for all non-degenerate lotteries (cases 5 and 6). For the St. Petersburg game, this makes the infinite expected value finite under utility.
     
  2. **Probability Truncation**: For lotteries with a wide range of outcomes (like St. Petersburg), you ignore outcomes with very low probabilities (e.g., below \(10^{-6}\)), effectively truncating the game. This explains why your valuation for the classic St. Petersburg is similar to the limited-tosses version and barely changes when the payout is capped—you weren't considering the extreme tail anyway.

  Here's how these principles apply to each of your six cases:

  - **Classic St. Petersburg (expected value ∞, pay $20)**: Your $20 valuation matches the expected value of the first ~20 terms (where \(P(n) \geq 10^{-6}\)). The tail beyond \(n=20\) (\(P(n) < 10^{-6}\)) is ignored due to low probability, and diminishing utility caps the impact of high payouts. Expected utility with a concave function (e.g., logarithmic or power) gives a finite value around here.
    
  - **Capped St. Petersburg (expected value ~$31, pay $25)**: Capping reduces the expected value from infinity to $31, but your valuation only increases to $25 because (a) you were already ignoring the tail beyond \(n \approx 25\) (where \(P(n) < \sim 3 \times 10^{-8}\)) due to truncation, and (b) diminishing utility reduces the value of the $1 billion payout. The $5 increase from classic reflects the eliminated tail risk.

  - **Limited-tosses St. Petersburg (expected value ~$21, pay $20)**: You pay the full expected value because the game is inherently truncated at 20 tosses with no extreme tail. Diminishing utility doesn't bite much since the maximum payout ($1 million) is "only" moderately high in utility terms.

  - **Flat $10 (expected value $10, pay $10)**: Risk-free, so no risk aversion or truncation needed. You pay the expected value.

  - **$1000 at 50% (expected value $500, pay $300)**: Strong diminishing utility (e.g., power utility with exponent ~0.6) reduces the value of the $1000 payout, and risk aversion penalizes the 50% chance of nothing. Expected utility gives $\approx 300$.

  - **$10,000 at 10% (expected value $1000, pay $250)**: Even stronger undervaluation due to diminishing utility on $10,000 and underweighting of the 10% probability (prospect theory-like effect). Expected utility with the same curvature gives $\approx 250$.

  ### Verdict That Doesn't Fit Perfectly:
  - **Capped St. Petersburg (expected value ~$31, pay $25)**: This is the hardest to fully reconcile. Expected utility alone would value it higher than the classic version (you pay $25 vs. $20), but not as high as $31 due to diminishing utility on the $1 billion payout. However, your $25 is closer to a truncation at $n=25$ (expected value $25$) than to $31$, suggesting you might be truncating more aggressively here or inconsistently applying the principles. It doesn't fit as neatly as the others, but it's salvageable with a slight adjustment (e.g., higher probability threshold for truncation when payouts are capped).

  ### New Lottery: $5,000,000 at 0.1% (expected value $5000)
  - **What you'd likely pay**: About $200–$300.
  - **Reasoning**: The 0.001 probability is very low (similar to case 6, but lower), so you'd heavily underweight it due to probability truncation and diminishing utility. Expected utility with the same curvature as in cases 5–6 gives $S \approx 250$, but the lower probability pushes it toward the lower end. For comparison:
    - Case 6 (10% chance of $10,000): You pay $250 (25% of expected value).
    - Here, with 0.1% chance of $5,000,000, you'd pay roughly 4–6% of expected value ($200–$300), consistent with stronger underweighting for lower probabilities.

  ### Further Case to Test One Principle vs. Two:
  - **Proposed case**: Win $1,000,000 with probability \(10^{-6}\) (expected value $1), otherwise nothing.
    - **If one principle (expected utility + truncation)**: You'd pay almost nothing (e.g., $0.10 or less), because this probability is below your truncation threshold (like St. Petersburg tails), and diminishing utility makes $1 million irrelevant.
    - **If two principles (truncation for St. Petersburg only)**: You might pay slightly more (e.g., $0.50–$1), treating it as a simple lottery without truncation but with strong diminishing utility and risk aversion.
    - **Your likely verdict**: Paying nearly zero would confirm a unified principle (truncation applies universally). Paying close to $1 would suggest separate rules (truncation only for complex games like St. Petersburg).

  ### Conclusion:
  You're primarily running **expected utility with strong diminishing marginal utility**, which explains your undervaluation of high payouts and low probabilities in simple lotteries. For St. Petersburg-like games, this is augmented by **probability truncation**, which caps your consideration at moderate outcomes. The capped St. Petersburg case is the weakest fit, suggesting some inconsistency or an additional factor (e.g., mental accounting for caps). If the further case confirms universal truncation, it's one principle; if not, you might have two distinct approaches for complex vs. simple lotteries.
