  *(Leans forward, eyes sharp but not unkind)*  
  Right, let’s cut through it: you’re conflating two things. The handicap *isn’t* punishment for doing necessary evil—it’s collateral against *becoming* the kind of person who treats evil as routine. Your minister who lies about body counts to avert panic? If she’s worth her salt, she knows that power’s corrosion is real. Sacrificing future influence isn’t about settling a debt; it’s about *proving* she hasn’t been corrupted by the act itself. You want her haunted? Fine. But haunted people still make decisions. What stops the next "necessary" lie? Only the certainty she’s built a cage around her own capacity to repeat it.  

  Your "diminished capacity to act rightly" worry misses the point. If a crisis demands fresh dirty hands, *let someone else get dirty*. Why insist the same minister must keep bearing the burden? That’s how we get moral specialists in ruthlessness—and you’re the one enabling them. The system selects for refusal? Only if we glorify indispensability. Force turnover, and you force deliberation: "Is this truly necessary, or just convenient for *me*?" So tell me: why should we trust a leader’s lingering guilt over a tangible limit on their power?  

  *(Pauses, taps the table once)*  
  You say my account ignores what she’s "become." But what *has* she become? A person who chose atrocity-A to prevent atrocity-B. If she walks away unscathed, she learns a terrible lesson: that the tools work. The handicap *is* the embodied recognition of that lesson—a constant, visible check on the allure of "necessity." Remorse is private theatre; limiting power is public truth. You think a bar on future office is "paying off" the wrong? No. It’s surrendering the license she abused. The dead aren’t owed her suffering; the living are owed her restraint. Now answer *this*: if remorse is so vital, how does it protect us from her next "necessary" sin?  

