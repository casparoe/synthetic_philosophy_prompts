answer: |-
  ## Adversarial Collaboration Document: The Standing to Blame

  **Working Note:**
  *   **Agreed Candidate:** Blame centrally involves a normative demand made of the wrongdoer. Standing concerns the legitimacy/authority to issue *that specific demand*. The case battery tests the robustness and implications of each theory regarding this legitimacy. *(Likely Agreed)*
  *   **Agreed Candidate:** Lack of standing renders the blame act defective in its core function as a demand, distinct from being unfitting (wrong target), ineffective (no uptake), or involving a separate wrong (hypocrisy). *(Likely Agreed - core distinction)*
  *   **Agreed Candidate:** Moral relationships involve standards and expectations; standing is connected to participation in these relationships. *(Potentially Vacuous - both interpret "participation" very differently; discard as insufficiently precise)*
  *   **Crux Candidate:** Does the blamer's *own* conformity to the specific norm they invoke, or their consistency in applying it, constitute a necessary precondition for possessing the standing to make the demand inherent in blame? *(Core Disagreement)*
  *   **Crux Candidate:** Can an entity entirely external to the moral relationship (e.g., Case 6) possess standing to blame within that relationship solely based on correct judgment? *(Core Disagreement - relates to source of authorization)*
  *   **Crux Candidate:** Does hypocrisy primarily undermine standing (Camp A) or is it a separate moral failing that taints the act but doesn't negate the underlying authority (Camp B)? *(Core Disagreement)*
  *   **Discarded:** "Blame is important" (platitude), "Standing matters" (vacuous in this context), "Hypocrisy is bad" (agreed but uninformative about standing), "Moral community exists" (too vague, both interpret differently).

  **Section 1: Agreed Claims**

  Both camps endorse the following claims:

  1.  **Blame as Normative Demand:** Blame (as distinct from mere assessment or criticism) inherently involves addressing a normative demand to the wrongdoer concerning their culpable failure to meet a legitimate standard.
  2.  **Standing Concerns Legitimacy:** The concept of "standing to blame" pertains specifically to the legitimacy or authority of the blamer to issue *that specific normative demand* to the wrongdoer. A defect in standing renders the blame-act defective *qua* demand, irrespective of the accuracy of the underlying moral judgment.
  3.  **Distinct Defects:** A blame-act can be defective in multiple ways. Lack of standing is distinct from:
      *   *Unfittingness:* The blame targets an agent who is not culpable for the wrong.
      *   *Ineffectuality:* The blame fails to achieve uptake or its intended effects (e.g., prompting acknowledgment).
      *   *Associated Wrongdoing:* The act of blaming itself involves a separate moral wrong (e.g., cruelty, hypocrisy). *(Note: The core dispute concerns whether hypocrisy negates standing (A) or constitutes an associated wrongdoing (B)).*
  4.  **Case Battery Function:** The pre-registered case battery serves as a shared test bed. It is designed to probe the implications of each theory regarding the conditions for legitimate demand-making in blame. Agreement on predictions for these cases is not required; the value lies in comparing the theories' outputs and explanatory power against these stipulated scenarios. The battery does not purport to *settle* the debate definitively on its own.
  5.  **Standing and Relationships:** Standing to blame is conceptually linked to the blamer's position within, or relation to, the relevant moral relationship(s) implicated by the wrongdoing. *(Flagged: While agreed, this claim is substantively thin. The core disagreement lies in *how* this link is construed – via self-relational integrity (A) or external authorization (B)).*

  **Section 2: Table of Disagreements**

  | Question at Issue                                                                 | Camp A Formulation (Self-Relation)                                                                                              | Camp B Formulation (Authorization)                                                                                                     | What Turns on the Answer                                                                                                                                 |
  | :-------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------------------------ | :-------------------------------------------------------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------------------------------------------------- |
  | **Is the blamer's own conformity to the norm they invoke necessary for standing to blame?** | A blamer lacks the standing to blame for a specific wrong if their own conduct manifests a failure regarding that very norm (or an exemption claim), undermining their position as a participant entitled to make the demand. | A blamer's own failure regarding the norm they invoke does not negate their standing to blame, which is grounded in their authorization (e.g., community membership, role, relation to victim). Such failure may constitute hypocrisy or impair felicity/uptake, but not standing itself. | Whether hypocrisy (or inconsistency) is a defect *internal* to standing (A) or an *external* flaw that can taint an act issued with standing (B). The core legitimacy of the demand. |
  | **What is the fundamental source of standing?**                                       | Standing arises from the blamer's own status as a participant in good standing within the relevant moral relationship, which requires consistency in applying the norm they invoke.               | Standing arises from being authorized (by the moral community, a role, or a specific relationship to the victim/wrong) to hold others accountable to the relevant norm, irrespective of the blamer's own conformity to it. | The conceptual foundation of moral address. Whether standing is primarily self-referential (integrity) or other-referential (authorization).              |
  | **Can an entity lacking moral agency possess standing?**                            | Standing requires the capacity for mutual recognition and participation in the moral relationship. An entity lacking this (e.g., Case 6) cannot possess standing, though it may issue correct assessments. | Standing can be functionally ascribed based on role or design. An entity correctly applying community norms in a designated role (e.g., Case 6) can possess derivative standing to issue demands on behalf of the moral order, even without moral agency. | Whether standing is inherently tied to reciprocal moral agency or can be role-based/functional. The scope of legitimate blame sources.                    |

  **Section 3: Cruxes and Pre-Registered Predictions**

  1.  **Crux: Does a blamer's own past, equivalent, but fully addressed wrong (Case 1) negate standing?**
      *   **Camp A Prediction:** **No Standing Defect.** The blamer has acknowledged the wrong, made amends, and reformed. Their current participation in the moral relationship is in good standing regarding this norm. Their blame is not defective at its root due to standing.
      *   **Camp B Prediction:** **Standing Present.** The blamer's past, addressed wrong does not remove their standing (e.g., as a fellow community member). It may make their blame *appear* hypocritical or reduce its effectiveness, but the underlying authority to demand remains intact.
      *   **Embarrassment:** An outcome showing the blame is *fundamentally* illegitimate (beyond mere ineffectiveness) would embarrass Camp B. An outcome showing it is *fully* legitimate, with no taint of hypocrisy affecting its core validity, would challenge Camp A's typical emphasis on the lingering effects of past wrongs (though they predict no defect here).

  2.  **Crux: Does a blamer's own *ongoing* commission of the same wrong (Case 2) negate standing?**
      *   **Camp A Prediction:** **Lacks Standing.** The blamer is actively violating the norm they invoke. They lack the requisite integrity to participate in making this demand; their blame is defective at its root.
      *   **Camp B Prediction:** **Standing Present (but Hypocritical).** The blamer retains standing (e.g., as a community member bound by the norm). However, their blame is deeply hypocritical, constituting a separate and serious moral wrong that likely renders the act infelicitous and unlikely to achieve uptake.
      *   **Embarrassment:** If the blame is shown to have *any* legitimate normative force *as a demand* (beyond just being true) despite the hypocrisy, it would embarrass Camp A. If the hypocrisy is shown to *completely negate* any semblance of legitimate authority to demand (not just make it wrong or ineffective), it would embarrass Camp B.

  3.  **Crux: Can an artificial system (Case 6) possess standing to blame?**
      *   **Camp A Prediction:** **No Standing.** The system lacks moral agency, cannot participate in mutual recognition or relationships, and has no record of its own. It can issue true assessments/criticisms, but not legitimate normative *demands* presupposing relational standing.
      *   **Camp B Prediction:** **Can Possess Standing.** If designed to articulate and enforce community standards accurately from an authorized standpoint (e.g., a well-designed accountability tool), it can possess functional standing to issue demands on behalf of the moral community, even without agency. Its blame can be legitimate.
      *   **Embarrassment:** If users consistently experience the system's outputs *as legitimate demands* with normative force (not just information), it would embarrass Camp A. If such outputs are consistently experienced as alien, non-authoritative impositions lacking relational legitimacy, it would embarrass Camp B.

  4.  **Crux: Does a blamer's unaddressed record of a *different* serious wrong (Case 3) negate standing for *this* wrong?**
      *   **Camp A Prediction:** **Likely Lacks Standing (Implicit Exemption).** By blaming for Wrong Y while ignoring their own unaddressed Wrong X (comparable gravity), the blamer implicitly claims an exemption from the general demand of moral consistency. This undermines their standing to make *any* demand *as a fellow participant*.
      *   **Camp B Prediction:** **Standing Present (but Hypocritical/Inconsistent).** Standing is norm/relation-specific. Their standing to blame for Wrong Y is intact (e.g., as a community member). Their unaddressed Wrong X makes them hypocritical/inconsistent *generally*, which is a serious flaw and may undermine the effectiveness or moral acceptability of their blame for Y, but does not negate their specific standing regarding Y.
      *   **Embarrassment:** If unaddressed Wrong X is shown to fundamentally undermine the legitimacy of demanding accountability for *any* wrong (Y), it would support Camp A. If the blamer retains clear, untarnished authority specifically regarding Wrong Y despite their unaddressed X, it would support Camp B.

  **Section 4: Verbal Disagreement**

  Part of the dispute is plausibly verbal, centering on the scope of the term "standing."

  *   **Camp A** employs "standing" narrowly to denote *the blamer's own relational position and integrity specifically regarding the norm invoked*, necessary for the core validity of the demand.
  *   **Camp B** employs "standing" more broadly to denote *the authorization to hold accountable*, stemming from the blamer's role or position relative to the norm/community/victim, which they hold is distinct from the blamer's personal conformity.

  **Substantive Disagreement:** Once terminology is clarified, the core substantive disagreement remains: **Is the core legitimacy (validity *qua* demand) of blame constitutively dependent on the blamer's own integrity and consistency regarding the specific norm they invoke?** Camp A answers yes; this integrity is a precondition for being in a position to legitimately make the demand. Camp B answers no; the legitimacy stems from external authorization, and the blamer's integrity affects other properties of the act (like hypocrisy or effectiveness), not the foundational standing to issue the demand.

  **Section 5: Closing - What Would Change Our Mind (Signed)**

  *   **Camp A:** We would reconsider our position if presented with compelling evidence that blame issued by agents clearly lacking integrity or consistency regarding the relevant norm (e.g., active perpetrators, chronic hypocrites) is consistently experienced as, and functions socially as, possessing the *same core normative force and legitimacy* as blame from agents in good standing, *without* this being attributable solely to fear, error, or confusion about the blamer's record. Evidence that functional authorization alone (as in Case 6) reliably generates the distinctive phenomenology and social efficacy of legitimate moral demands would also be significant.
  *   **Camp B:** We would reconsider our position if presented with compelling evidence that blame issued by agents lacking integrity or consistency regarding the relevant norm is consistently experienced as, and functions socially as, *fundamentally different in kind* – lacking the core element of legitimate demand – compared to blame from agents in good standing, *even when* the authorization source (community, role, relation) is identical and the hypocrisy is fully recognized. Evidence that the demand-element *always* fails or misfires when the blamer lacks self-relational integrity, regardless of formal authorization, would be crucial. Demonstrating that "standing" in the narrow sense (A) is an indispensable, non-redundant component for explaining the distinctive force of blame, beyond mere correctness and authorization, would also be persuasive.

  ---
  **(Signed) Camp A Representative**
  **(Signed) Camp B Representative**
