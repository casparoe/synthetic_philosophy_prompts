answer: |-
  Here's a reading designed to challenge the simplistic pairing, engage seriously with both the play *and* Fuller's/Hart's specific arguments, and highlight the tragic core that resists easy philosophical resolution, suitable for your seminar:

  **Core Argument:** *Antigone* doesn't neatly map onto Hart-Fuller because it dramatizes a **clash of sovereignties** (divine/familial vs. civic) and the **tragic cost of legalism untempered by other values**, exposing limitations in *both* positivist *and* Fullerian natural law frameworks when faced with such fundamental conflicts. The play resists being a simple morality play for either side.

  **Deconstructing the Standard Pairing & Engaging Fuller:**

  1.  **Antigone is NOT Fuller's Natural Lawyer:**
      *   Fuller's "inner morality" is about the *procedural* legitimacy of *human* lawmaking. It's about how rules *function as law*. Antigone appeals to **transcendent, substantive divine commands** ("unwritten laws") and **familial duty**. She doesn't critique Creon's edict for lacking promulgation or clarity; she rejects its *authority* entirely based on a higher, competing source. She's closer to a **divine command theorist** or someone asserting a rival normative order (kinship/religious obligation).
      *   *Implication:* The standard reading *is* wrong about Fuller. Using Antigone as Fuller's champion fundamentally misrepresents his project. Fuller is concerned with the *form* of law, Antigone with its *source* and *substantive conflict*.

  2.  **Creon's Edict & Fuller's 8 Principles (The Awkward Fit):**
      *   **The Awkward Truth:** As you note, Creon's edict *does* plausibly satisfy many of Fuller's principles on the surface:
          *   **Generality:** Applies to all citizens (no named individuals).
          *   **Promulgation:** Publicly declared to the Chorus (representing citizens) and later to Antigone herself.
          *   **Prospectivity:** Announced *after* Polynices' death/treason (though punishing a past *act* prospectively).
          *   **Clarity:** "No one shall bury him... leave him unburied." Seems unambiguous.
          *   **Feasibility:** Physically possible to obey (don't bury him) and enforce (post guards).
          *   **Constancy:** Creon is stubbornly consistent... *until* the end.
      *   **The Problematic Principles:**
          *   **Non-Contradiction:** Does it contradict other Theban laws or fundamental societal norms? This is debatable. Burial rites were sacrosanct in Greek culture; denying them *was* a profound violation of divine law/piety. One could argue the edict inherently contradicts a deeper, unwritten legal/cultural framework essential to social order (as the Chorus and Tiresias imply).
          *   **Congruence:** **This is the critical failure.** Creon *does* relent, persuaded by Tiresias that the edict has brought divine wrath (pollution, omens). He rushes to free Antigone, acknowledging the law's injustice/impurity. **His reversal reveals his officials (himself included!) were not ultimately guided by the rule; they enforced it until external pressure (divine signs/prophecy) forced them to abandon it.** The rule lacked enduring internal acceptance *even by its author/enforcer*. This fatally undermines its claim to legality under Fuller.
      *   *Implication for Fuller:* The edict *seems* procedurally sound initially, creating a tension Fuller acknowledges: wicked regimes can *appear* to follow the inner morality. However, the **congruence failure exposed by Creon's reversal** provides the Fullerian argument: the regime's inability to consistently stand by its own rules under pressure shows it wasn't truly operating under the inner morality. The tragedy *results* from this failure. Antigone, however, didn't make *this* argument.

  **Engaging Hart & Positivism:**

  3.  **Antigone as Civil Disobedient (Hart's Lens):**
      *   If we accept the edict as a valid social rule (source: sovereign pronouncement), Hart is right: Antigone's problem is **obedience, not validity**. She's engaging in **civil disobedience** based on a higher moral conviction (divine/familial duty). The play *is* centrally about the justification for disobedience against a seemingly valid law.
      *   **Open Texture & Penumbra:** Hart's concepts are useful. Does scattering dust constitute "burying"? Creon argues yes ("honor equally with the pious"). Antigone might argue it's symbolic piety, not a full burial contravening the edict's core aim (denying honor/rites). **The edict's "bury" has a penumbra.** A Hartian judge could interpret it narrowly (only full interment) or broadly (any funerary act). The play doesn't resolve this ambiguity legally; Creon's interpretation stands, and Antigone doesn't argue semantics, only principle.

  4.  **Radbruch & Extreme Injustice:**
      *   Is the edict "intolerably unjust" (Radbruch)? By modern liberal standards, yes (denial of burial rites, cruel punishment). By ancient Greek standards, punishing traitors harshly was accepted, *but* denying burial crossed a line into impiety, inviting divine retribution (as Tiresias shows). **The play provides a way: the consequences.** The edict leads directly to Antigone's, Haemon's, and Eurydice's deaths, and civic pollution. This *dramatizes* its intolerable injustice through its catastrophic effects, even if Creon had legitimate reasons of state initially. It becomes unjust *in practice*.

  **Where the Play Resists & Offers Something More (The Tragic Core):**

  5.  **Beyond Liberal Rights & Caricatures:**
      *   **Antigone's Awkwardness:** She isn't championing universal human rights. Her duty is particularistic (family), her motives arguably obsessive, and she's harsh to Ismene. She's not a liberal heroine. Her strength lies in her absolute commitment to a non-state sovereign (the gods/family), challenging the state's monopoly on normative authority.
      *   **Creon's Complexity:** He's not a tyrant caricature. His initial concerns (restoring order after civil war, deterring treason) are legitimate state interests. He represents the **dangers of legalism and raison d'état taken to an absolute**, crushing other essential human bonds (family, piety). His tragedy is his inability to moderate his legal authority until it's too late.
      *   **The Irreducible Conflict:** The play shows **neither "sovereignty" is wrong in isolation.** Family/religious duty *is* fundamental. Civic order and punishing treason *are* necessary. The tragedy arises because **these legitimate claims become mutually exclusive and absolutized.** Neither positivism (valid law vs. moral disobedience) nor Fuller (procedural legitimacy) fully captures this **clash of incommensurable values** both vital to human flourishing. Law (Creon's edict) attempts to silence one sovereign (divine/familial), and the result is catastrophic. Neither Hart's separation nor Fuller's proceduralism offers a clear path through this kind of fundamental normative collision.

  **Teaching Strategy & Conclusion for Students:**

  *   **Start by Debunking:** Explicitly reject the "Antigone=NL, Creon=Positivism" trope. It's inaccurate and reductive.
  *   **Analyze the Edict:** Walk through Creon's edict against Fuller's 8 principles. Highlight the initial plausibility and the critical failure of *congruence* revealed by his reversal. Ask: Does this make it "not law" for Fuller?
  *   **Reframe Antigone:** Position her as a **challenger to state sovereignty** based on divine command/familial piety, *not* a Fullerian proceduralist. Her disobedience is based on substance, not form.
  *   **Hart's Lens:** Discuss the edict's potential validity as a social rule. Frame Antigone's act as civil disobedience. Explore the open texture of "burying."
  *   **Radbruch Test:** Discuss whether the consequences (deaths, pollution) demonstrate the edict's intolerable injustice, pushing it over Radbruch's line.
  *   **Embrace the Tragedy:** The crucial pedagogical moment is acknowledging **where the play exceeds the debate.** Ask students:
      *   Does Hart/Fuller help us understand *why* this conflict is so devastating? (Perhaps only partially).
      *   Does the play show that law (even procedurally sound law, per Fuller) can become monstrous when it fails to acknowledge limits imposed by other fundamental human values (family, piety)?
      *   Does the absolute nature of *both* claims (Antigone's piety, Creon's authority) make compromise impossible, leading to tragedy? Is this a failure the Hart-Fuller debate, focused on validity and obedience, doesn't fully address?
  *   **Conclusion:** *Antigone* isn't a proof text for Hart or Fuller. It's a powerful **dramatization of law's potential to clash catastrophically with other deep-seated human commitments when wielded absolutely.** It exposes the limits of viewing law *only* through the lenses of validity or procedural legitimacy when confronted with irreconcilable normative orders. The tragedy lies in the impossibility of reconciling two genuine, but conflicting, sources of obligation. Use it to show the *human cost* and *philosophical messiness* that abstract debates sometimes gloss over. This complexity is its enduring value for jurisprudence.
