answer: |-
  Below is a decision tree handout designed to sort students' views on the Knobe effect. Each branch is based on concrete cases, avoiding theoretical jargon. The leaves represent major positions in the debate, with their most awkward commitments noted. Positions the tree cannot distinguish are flagged at the end.

  ---

  **THE KNOBE EFFECT DECISION TREE**  
  *Does the side-effect asymmetry survive these twists?*

  ### START: The original Knobe effect  
  Chairman case (harm): 85% say "intentionally harmed environment."  
  Chairman case (help): 15% say "intentionally helped environment."  
  *Where does this asymmetry come from?*

  ---

  ### BRANCH 1: NON-MORAL NORM VIOLATION  
  **Scenario:** A CEO implements a policy to increase profits. A side effect violates:  
  - **Harm version:** Company dress code (e.g., employees wear prohibited red shirts).  
  - **Help version:** Company dress code (e.g., employees wear encouraged green shirts).  
  *Q: Is the dress-code violation still called "intentional" more often in the harm case?*  
  - **YES** (asymmetry persists) → Go to Branch 2.  
  - **NO** (asymmetry disappears) → Go to Branch 3.  

  ---

  ### BRANCH 2 (from YES): REPLACE "INTENTIONALLY"  
  **Scenario:** Same non-moral norm case (e.g., dress code), but ask:  
  - "Did the CEO **deliberately** violate the dress code?"  
  - "Did the CEO **knowingly** violate the dress code?"  
  *Q: Does the harm/help asymmetry persist for these words?*  
  - **YES** (asymmetry for "deliberately" and "knowingly") → **Leaf A: Normative Asymmetry**  
    *Most awkward commitment:* Calling a trivial norm violation (e.g., wearing red) "intentional" requires no moral blame—yet the asymmetry remains.  
  - **NO** (asymmetry only for "intentionally," not other words) → **Leaf B: Performance Glitch (Pragmatic)**  
    *Most awkward commitment:* The word "intentionally" uniquely triggers pragmatics (e.g., implying blame), but "knowingly" doesn’t—despite near-synonymy.  

  ---

  ### BRANCH 3 (from NO): NON-HUMAN AGENT  
  **Scenario:** A thermostat regulates temperature to save costs. Side effect:  
  - **Harm version:** Worsens air quality in a lab.  
  - **Help version:** Improves air quality in a lab.  
  *Q: Is the outcome still called "intentional" more often in the harm case?*  
  - **YES** (asymmetry persists for thermostats) → Go to Branch 4.  
  - **NO** (asymmetry disappears) → Go to Branch 5.  

  ---

  ### BRANCH 4 (from YES): CAUSATION WITHOUT BLAME  
  **Scenario:** Same thermostat case, but ask:  
  - "Did the thermostat **cause** the air quality change?"  
  *(Remove moral/blame language; focus on mechanical causation.)*  
  *Q: Is causation still attributed asymmetrically (more for harm)?*  
  - **YES** (asymmetry persists) → **Leaf C: Causal Asymmetry**  
    *Most awkward commitment:* Even thermostats "cause" bad outcomes more than good ones—implying normativity infects basic causation.  
  - **NO** (no asymmetry for causation) → **Leaf D: Nobody Stands Here**  
    *Why dead-end?* Asymmetry in intentionality (Branch 3) but not causation is incoherent—intentionality presupposes causation.  

  ---

  ### BRANCH 5 (from NO): CAUSATION WITHOUT BLAME (HUMAN AGENT)  
  **Scenario:** Original chairman case, but ask:  
  - "Did the chairman **cause** the environmental outcome?"  
  *(No "intentional," no blame/praise language.)*  
  *Q: Is causation still attributed asymmetrically (more for harm)?*  
  - **YES** (asymmetry persists) → **Leaf E: Causal Asymmetry**  
    *Most awkward commitment:* People deny the chairman "caused" the helpful outcome—even though he literally did.  
  - **NO** (no asymmetry for causation) → **Leaf F: Blame Leakage**  
    *Most awkward commitment:* Blame distorts *only* intentionality judgments, not causation—yet both are tightly linked in folk psychology.  

  ---

  ### LEAF SUMMARY & UNRESOLVED PAIRS  
  **Leaves:**  
  - **A. Normative Asymmetry:** Asymmetry is real; normativity (even non-moral) is baked into intentional action.  
  - **B. Performance Glitch (Pragmatic):** Asymmetry is a linguistic fluke; competence is symmetric.  
  - **C. Causal Asymmetry:** Effect is about causation, not intentionality; bad outcomes are "caused" more readily.  
  - **D. Nobody Stands Here:** Branch 4 dead-end (incoherent results).  
  - **E. Causal Asymmetry:** As in C, but specific to human agents.  
  - **F. Blame Leakage:** Asymmetry stems from blame influencing intentionality judgments alone.  

  **Unresolvable Pairs (tree cannot distinguish):**  
