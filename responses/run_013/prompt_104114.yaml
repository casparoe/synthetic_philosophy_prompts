  We are creating a joint statement between two theorists: one committed to the Self-Sampling Assumption (SSA) and the other to the Self-Indication Assumption (SIA). The statement is divided into four parts as requested.

  Part 1: Agreed Claims

  1. An observation selection effect occurs when the evidence available to an observer is filtered by the condition that there exists an observer in the first place to have that evidence. This effect arises because we cannot observe scenarios in which no observers exist to make observations. Consequently, our evidence is necessarily conditioned on our existence as observers.

  2. Both parties agree that a rule for handling observation selection effects must:
     - Be consistent with Bayesian conditionalization when no observation selection effect is present.
     - Provide a way to update credences in light of evidence that is subject to such effects.
     - Avoid contradictions and yield plausible verdicts in a range of cases.

  3. In ordinary cases without observation selection effects, both SSA and SIA deliver the same verdict. For example:
     - When estimating the bias of a coin from a series of flips, both agree that the relative frequency of heads and tails is the relevant evidence and update accordingly.
     - When the existence of observers is not at issue (e.g., in a fixed population), both rules converge on standard Bayesian updating.

  4. The presumptuous philosopher argument is structured as follows: Consider two cosmological theories, T_small and T_large, which are otherwise equally plausible. T_small posits a small universe with, say, 10^10 observers. T_large posits a vast universe with 10^20 observers. The philosopher argues that, because T_large implies a much larger number of observers with our evidence, it is much more probable. Under SIA, this argument is accepted: the mere fact that more observers exist under T_large makes it more probable. Under SSA, this argument is rejected: the probability is based on the fraction of observers that have our evidence, and if both theories have the same fraction, they are equally likely. Both parties agree that the presumptuous philosopher argument is a key point of disagreement.

  5. Both parties accept that the following cases are discriminating between SSA and SIA:
     - The Doomsday Argument: Estimating the total number of humans that will ever exist based on our birth rank.
     - The Sleeping Beauty Problem: Updating credences when an observer might be awakened multiple times with memory wipes.
     - The Presumptuous Philosopher: As described above.

  6. Both parties agree that a satisfactory rule must not:
     - Lead to inconsistent credences (e.g., Dutch books).
     - Allow the mere possibility of observers to dominate over actual observations.
     - Make our existence overwhelmingly evidence for theories that postulate huge numbers of observers, unless such an effect is justified by the rule.

  Part 2: Disagreements Table

  | Question at Issue | SSA Formulation | SIA Formulation | Crux | Case/Argument | SSA Prediction | SIA Prediction |
  |-------------------|-----------------|-----------------|------|--------------|---------------|---------------|
  | Is your existence evidence? | "My existence is not evidence for any hypothesis. It is a precondition for having evidence. Therefore, we must condition on our existence but not treat it as evidence that favors hypotheses that make existence more likely." | "My existence is evidence. It is more likely that I exist in a world with more observers, so hypotheses that imply more observers are supported by the fact of my existence." | Does the fact of one's own existence provide evidential support for hypotheses that imply a greater number of observers? | Presumptuous philosopher | In the presumptuous philosopher case, SSA does not take the existence of more observers as evidence for T_large. | In the same case, SIA takes the existence of more observers as evidence for T_large. |
  | Is the presumptuous philosopher argument a reductio of SIA or a conclusion to accept? | "The presumptuous philosopher argument is a reductio of SIA because it allows armchair reasoning to override physical evidence about the size of the universe, which is absurd." | "The presumptuous philosopher argument is a valid conclusion from SIA. We must accept that our existence is evidence for a larger universe, and this is not absurd but a consequence of observation selection." | Is the presumptuous philosopher's conclusion (that T_large is vastly more probable) acceptable or absurd? | Presumptuous philosopher | SSA predicts that T_large is not more probable than T_small if they are otherwise equally plausible and have the same fraction of observers with our evidence. | SIA predicts that T_large is more probable than T_small by a factor of 10^10 (the ratio of the number of observers). |
  | Is randomness of selection primitive or derived? | "The idea that we are randomly selected from the set of actual observers is a primitive commitment of our epistemology for handling observation selection effects." | "The idea that we are randomly selected from the set of possible observers (weighted by their probability of existing) is derived from the requirement that we account for the fact that we exist as evidence." | Is the randomness assumption a starting point or a consequence of more fundamental principles? | General framework | SSA holds randomness among actual observers as fundamental. | SIA derives the randomness from the application of Bayesian reasoning to the fact of existence. |
  | What is the reference class? | "The reference class should be the set of all actual observers (past, present, and future) who are in some sense 'like us' (e.g., human observers, or perhaps sentient beings). The choice of reference class is critical and non-arbitrary, and must be fixed by context." | "The reference class is the set of all possible observers, but weighted by their probability of existing. The reference class problem is similar in both approaches, but SIA avoids some issues because it weights by probability of existence." | How much of the dispute is due to the reference class rather than the core assumptions? | Doomsday Argument | In the Doomsday Argument, SSA uses the reference class of all humans (actual) and concludes that the total number of humans is likely small. | In the Doomsday Argument, SIA uses the reference class of possible humans and counters the Doomsday Argument, concluding that the total number is not necessarily small. |
  |   |   |   |   |   |   |   |
  Note: The above table includes four rows as required.

  Part 3: Stipulated New Case

  We describe the case and its variant, and then present the predictions.

  Case: 
  - Hypothesis Solitary: The world continues with you as its only observer, and no further observers ever exist.
  - Hypothesis Colony: Tomorrow, a machine produces 1000 exact copies of you. Each copy is a distinct observer and will live a full life with exactly the memories and evidence you now have. You yourself continue to exist unchanged. 
  - Prior: P(Solitary) = P(Colony) = 0.5.

  Question: What is the probability of Solitary vs. Colony given your current evidence?

  SSA Prediction:
  - Under SSA, we consider the set of all actual observers. 
    - In Solitary: There is only one observer (you) who has your current evidence. 
    - In Colony: There are 1001 observers (you and 1000 copies) who have your current evidence at the moment of copying (but note: after copying, each copy will have the same evidence as you now have, but they are distinct observers at that time). 
  - The fraction of observers with your evidence in Solitary is 1/1 = 1. In Colony, the fraction is 1001/1001 = 1. 
  - However, the total number of observer-moments with your current evidence is 1 in Solitary and 1001 in Colony. 
  - But SSA weights by the fraction of observers (or observer-moments, depending on the version) that have the evidence. Since both hypotheses have 100% of their observers having the evidence, they are equally likely. 
  - Therefore, SSA says: P(Solitary | evidence) = P(Colony | evidence) = 0.5.

  SIA Prediction:
  - Under SIA, we weight by the expected number of observers. 
    - Solitary: 1 observer.
    - Colony: 1001 observers.
  - The prior probabilities are equal, but SIA requires that we adjust by the number of observers. 
  - Therefore, the probability of Colony is 1001 times higher than Solitary because there are 1001 times as many observers (and thus 1001 times as many opportunities for you to be one of them). 
  - Normalizing: P(Solitary) = 1 / (1 + 1001) = 1/1002, P(Colony) = 1001/1002.

  What if the other party's prediction proves correct?
  - If Solitary turns out to be true, the SIA theorist would have to explain why they assigned such a low probability to it. This would be a problem for SIA because it would have been wrong in this instance. 
  - If Colony turns out to be true, the SSA theorist would have to explain why they did not update in favor of Colony despite the existence of many copies. This would be a problem for SSA because it would have failed to account for the increased chance of being in a world with more observers.

  Variant: 
  - Instead, in Colony, each copy is given, from the moment of creation, a different set of memories and a different stream of experience. Therefore, no copy ever has the evidence you now have.

  SSA on Variant:
  - In Solitary: Only you exist, and you have your current evidence. 
  - In Colony: You and 1000 copies exist. The copies have different evidence (from the moment of creation) and therefore do not share your current evidence. 
  - Therefore, the set of observers with your current evidence: 
    - Solitary: 1 observer (you) with your evidence.
    - Colony: 1 observer (you) with your evidence (the copies have different evidence). 
  - The fraction of observers with your evidence in Solitary is 1/1=1, and in Colony it is 1/1001. 
  - But note: the total number of observers in Colony is 1001, but only one has your evidence. 
  - Therefore, SSA would update in favor of Solitary because the fraction of observers with your evidence is higher in Solitary. 
  - Specifically, the likelihood ratio is (1) / (1/1001) = 1001, so P(Solitary | evidence) = 1001/1002, P(Colony | evidence) = 1/1002.

  SIA on Variant:
  - Under SIA, we weight by the number of observers that could have had our evidence. However, in this variant, the copies do not have our evidence. 
  - But note: SIA is about the probability of existing at all. The fact that we exist is evidence that there are more observers. 
  - However, in this variant, the existence of the copies does not lead to any observer having our evidence (except us). So our evidence is still only held by one observer in either scenario. 
  - Therefore, SIA would still count the total number of observers. Why? Because we are randomly selected from all possible observers (weighted by their probability of existing). Our existence is more likely in Colony because there are more observers. 
  - Therefore, SIA would still assign P(Colony) = 1001/1002 and P(Solitary) = 1/1002, just as in the original case.

  But note: In the variant, the copies do not have the same evidence as we do. However, SIA does not condition on having the same evidence until after the selection. The selection is from all possible observers (who might have various evidence). Then, we condition on our evidence. 
  - Step 1: We are more likely to exist in Colony because there are more observers. 
  - Step 2: Then we condition on having the specific evidence we have. 
  - In Colony, the fact that we have our current evidence is not surprising because we are the original. The copies have different evidence, but we are not one of them. 
  - Therefore, the probability of having our evidence given that we exist in Colony is the same as in Solitary? 
  - Actually, in Colony, the probability that we are the original (and hence have our evidence) is 1/1001? No, because we are randomly selected from all observers. 
  - But wait: the observers in Colony are the original and 1000 copies. If we are randomly selected from all 1001, then the probability that we are the original (and have the evidence) is 1/1001? 
  - However, note that in SIA we are randomly selected from all possible observers. In Colony, there are 1001 observers, each of whom has a different evidence set. Our evidence is one specific set. 
  - Therefore, the likelihood of our evidence under Colony is the probability that the selected observer has our evidence. In Colony, there is exactly one observer (the original) with our evidence. So the likelihood is 1/1001. 
  - Under Solitary, the likelihood is 1. 
  - The prior for being in a world with Colony is adjusted by SIA: the prior probability of Colony (before considering the evidence) is boosted by the number of observers. 
  - The SIA prior: P(Colony) proportional to 1001 * (prior probability of Colony), and P(Solitary) proportional to 1 * (prior probability of Solitary). Since the priors without SIA were equal, the SIA-adjusted priors are P(Colony) = 1001/1002, P(Solitary)=1/1002. 
  - Then we condition on the evidence: P(evidence | Colony) = 1/1001 (because only one observer in Colony has the evidence) and P(evidence | Solitary) = 1. 
  - Therefore, the posterior:
    P(Colony | evidence) = [P(evidence | Colony) * P_SIA(Colony)] / [P(evidence | Colony)*P_SIA(Colony) + P(evidence | Solitary)*P_SIA(Solitary)]
    = [(1/1001) * (1001/1002)] / [ (1/1001)*(1001/1002) + (1)*(1/1002) ] = [1/1002] / [1/1002 + 1/1002] = (1/1002) / (2/1002) = 1/2.
    Similarly, P(Solitary | evidence) = 1/2.

  Therefore, for the variant:
  - SSA: P(Solitary | evidence) = 1001/1002, P(Colony | evidence) = 1/1002.
  - SIA: P(Solitary | evidence) = 1/2, P(Colony | evidence) = 1/2.

  But note: This SIA calculation is complex and there might be different interpretations. However, the standard way to apply SIA is to use the SIA prior (which multiplies by the number of observers) and then condition on the evidence. That is what we have done.

  Part 4: Residual Disagreement and Diagnosis

  Verbal Disagreements:
  - The main verbal disagreement concerns the interpretation of probability and what it means to "randomly select" an observer. 
    - SSA defines randomness as being selected from the set of actual observers. 
    - SIA defines randomness as being selected from the set of possible observers (weighted by their probability of existing). 
    - This difference is foundational and leads to different formulations.

  To resolve the verbal aspect, both parties should agree to frame the problem in terms of Bayesian updating with a specific likelihood function. The question is: What likelihood should we assign to our evidence given a hypothesis? 
    - SSA: The likelihood is the fraction of actual observers (in that hypothesis) who have our evidence.
    - SIA: The likelihood is the ratio of the number of observers with our evidence in that hypothesis to the total number of possible observers weighted by the probability of the hypothesis. However, this is often simplified by incorporating an SIA prior.

  After this reframing, the residual disagreement is about the correct likelihood function.

  What would move each side?
  - For the SSA theorist: If it could be shown that SSA leads to inconsistent credences (e.g., Dutch books) in observation selection scenarios, that would be a problem. Also, if SSA yields clearly counterintuitive results in cases where the number of observers is not at issue, that would be problematic. 
  - For the SIA theorist: If the presumptuous philosopher argument is shown to lead to empirically false predictions (e.g., if we observe that the universe is small despite SIA assigning very low probability to that), that would be a problem. Also, if SIA leads to violations of conservation of expected evidence, that might be an issue.

  Is there a way to settle the matter?
  Both parties agree that a definitive experiment in which the number of observers is varied and the outcome is observed would help. However, such experiments are hard to design. The new case we introduced (Solitary vs. Colony) might be such a test if we could actually run it. But in practice, we cannot. 

  Both parties also agree that if a unified theory of observation selection effects were developed that avoids the problems of both SSA and SIA, that would settle the matter. Currently, no such theory is agreed upon.

  Therefore, the residual disagreement is genuine and not merely verbal. It is about the correct way to account for the selection effect of being an observer.

  The document ends.
answer: |-
  ### Joint Statement: SSA and SIA Adversarial Collaboration

  #### Part 1: Agreed Claims  
  We, a committed SSA theorist and a committed SIA theorist, agree on the following:  

  1. **Observation Selection Effect (OSE) Definition and Origin**:  
     An OSE arises when evidence is accessible only to observers who exist. We cannot observe scenarios with no observers, so our evidence is inherently conditioned on our own existence as observers. This effect occurs because hypotheses implying no observers are automatically falsified for us (as we exist), and hypotheses implying more observers with our evidence may be favored or disfavored depending on how we account for selection.  

  2. **Requirements for an OSE Handling Rule**:  
     A rule must:  
     - Be consistent with Bayesian conditionalization when no OSE is present (e.g., estimating coin bias from flips).  
     - Avoid contradictions, Dutch books, and violations of conservation of expected evidence.  
     - Yield intuitive, empirically defensible results in both OSE and non-OSE cases.  

  3. **Ordinary Cases with Agreement**:  
     SSA and SIA converge when:  
     - The number of observers is fixed and identical across hypotheses (e.g., medical trials with fixed patient groups).  
     - Evidence is not existence-dependent (e.g., inferring a coin’s bias from observed flips).  
     - The reference class is identical and observers are indistinguishable (e.g., predicting die rolls).  

  4. **Structure of the Presumptuous Philosopher Argument**:  
     Consider two theories:  
     - \( H_{\text{small}} \): The cosmos contains \( 10^{10} \) observers.  
     - \( H_{\text{large}} \): The cosmos contains \( 10^{20} \) observers.  
     Both theories are otherwise equally likely and predict identical evidence for us. The argument claims \( H_{\text{large}} \) is \( 10^{10} \) times more probable because it implies more observers with our evidence. SIA endorses this; SSA rejects it as absurd, since the fraction of observers with our evidence is identical.  

  5. **Discriminating Cases**:  
     Both rules must be tested in:  
     - **Doomsday Argument**: Estimating total humans from birth rank.  
     - **Sleeping Beauty**: Credence for coin flips under memory wipes.  
     - **Presumptuous Philosopher**: As above.  

  6. **What a Satisfactory Rule Must Not Do**:  
     - Allow armchair reasoning to override empirical physics (e.g., presumptuous philosopher).  
     - Violate the equivalence of evidentially identical observers.  
     - Make existence overwhelming evidence for arbitrarily large universes without empirical justification.  

  ---

  #### Part 2: Disagreements Table  
  | Question at Issue | SSA Formulation | SIA Formulation | Crux | Case/Argument | SSA Prediction | SIA Prediction |  
  |-------------------|-----------------|-----------------|------|--------------|---------------|---------------|  
  | Is your existence evidence? | "My existence is a precondition for evidence, not evidence itself. Hypotheses earn no credence merely by implying more observers; only the fraction of actual observers with my evidence matters." | "My existence is evidence. Hypotheses implying more observers are more probable because they increase the chance of my existence relative to alternatives." | Does existence per se provide evidential weight toward hypotheses with more observers? | Presumptuous philosopher | \( H_{\text{small}} \) and \( H_{\text{large}} \) are equally probable (same fraction of observers with evidence). | \( H_{\text{large}} \) is \( 10^{10} \) times more probable (more observers imply higher existence probability). |  
  | Is the presumptuous philosopher a reductio? | "The argument is a reductio of SIA. It absurdly lets a philosopher override physics: we shouldn’t assign high credence to \( H_{\text{large}} \) without empirical evidence." | "The argument is correct. SIA validly concludes \( H_{\text{large}} \) is more probable; this is not absurd but a consequence of existence bias in OSEs." | Is favoring \( H_{\text{large}} \) from the armchair rationally permissible? | Presumptuous philosopher | Rejects \( H_{\text{large}} \)-favoring as unscientific. | Accepts \( H_{\text{large}} \)-favoring as sound reasoning. |  
  | Is randomness primitive or derived? | "Random selection from actual observers is a primitive axiom. It directly models the epistemic condition of being a 'random sample' from existing observers." | "Random selection from possible observers (weighted by probability) is derived from applying Bayesianism to existence. It follows from the requirement to treat existence as evidence." | Can randomness be derived from first principles, or is it axiomatic? | General framework | Primitive: randomness is axiomatic. | Derived: randomness emerges from Bayesian updating on existence. |  
  | Reference class: whose observers count? | "The reference class is contextually fixed (e.g., 'human observers' or 'observer-moments'). Only actual observers matter. Most disputes reduce to reference-class ambiguity, not SSA/SIA." | "The reference class is all possible observers, weighted by existence probability. SIA reduces reference-class sensitivity by weighting existence. The core SIA/SSA dispute is independent." | How much does reference-class choice drive disagreements vs. SSA/SIA? | Doomsday Argument | Varies with class (e.g., birth rank in humans). Changing class alters conclusions. | Robust against class changes due to weighting. Dispute is primarily SSA/SIA. |  

  ---

  #### Part 3: Stipulated New Case  
  **Case Description**:  
  - **Solitary**: You remain the only observer; no others ever exist.  
  - **Colony**: A machine creates 1,000 distinct copies of you tomorrow. Each copy shares your current memories and evidence at creation; you and all copies exist thereafter. Priors: \( P(\text{Solitary}) = P(\text{Colony}) = 0.5 \).  

  **Variant**: Identical, except copies receive unique memories/experiences at creation; no copy ever shares your current evidence.  

  | Party | Prediction (Original) | Prediction if Other is Correct | Prediction (Variant) |  
  |-------|------------------------|--------------------------------|----------------------|  
  | **SSA** | \( P(\text{Colony} | \text{evidence}) = 0.5 \).<br>*Reasoning*: Only observers with *my exact evidence* matter. In Solitary, 1/1 observers have it. In Colony, 1001/1001 have it. Fractions equal → no update. | If Colony occurs, SSA must explain why observing no copy-learning effect doesn’t challenge its rule. | \( P(\text{Solitary} | \text{evidence}) \approx 1 \).<br>*Reasoning*: Only I have my evidence. In Solitary, 1/1 observers have it. In Colony, 1/1001 have it → Solitary favored 1001:1. |  
  | **SIA** | \( P(\text{Colony} | \text{evidence}) \approx 0.999 \).<br>*Reasoning*: Prior probability of Colony is boosted 1001× for having more observers. Evidence (shared by all) doesn’t alter this. | If Solitary occurs, SIA must explain why its high credence for Colony was misapplied. | SIA rule is silent. *Reasoning*: SIA weights hypotheses by total possible observers, but evidence uniqueness requires further stipulation for how to weight observers *with this specific evidence*. Without it, no clear prediction. |  

  ---

  #### Part 4: Residual Disagreement and Diagnosis  
  1. **Verbal Disagreements**:  
     - **Probability Type**: SSA assigns probabilities over actual observers; SIA assigns over possible observers. This is verbal—both agree probabilities are epistemic but disagree on the reference space.  
       - *Reformulation*: Both should specify: "Given hypothesis H, what is \( P(\text{my evidence} | H) \)?". SSA computes this as the fraction of actual observers in H with that evidence; SIA as the fraction of possible observers weighted by \( P(H) \).  
     - **Question Framing**: SSA asks, "Given I exist, what should I believe?"; SIA asks, "What should I believe, given that my existence is evidence?" This is partly verbal.  
       - *Reformulation*: Both should use: "Update on evidence E = 'I exist and have data D'". Residual: Does "I exist" add information beyond D?  

  2. **Genuine Disagreements**:  
     - **Existence as Evidence**: SSA denies existence is evidence; SIA affirms it. This is non-verbal—it affects predictions (e.g., Colony case).  
     - **Presumptuous Philosopher**: SSA sees it as reductio; SIA as valid. Genuine, as it stems from how existence is weighted.  

  3. **What Would Move Each Side**:  
     - **SSA**: If SIA yields consistent, non-absurd results in cases where "more observers" is empirically falsifiable (e.g., a real Colony experiment), or if SSA is shown to be Dutch-book-vulnerable under OSEs.  
     - **SIA**: If SSA can handle cases like Colony without ad hoc adjustments, or if SIA is shown to violate conservation of expected evidence.  
     - **Settling the Matter**: Both agree a controlled experiment where observer count varies (e.g., quantum observers in sealed boxes) could resolve this. Short of that, no agreed settlement exists.  

  **Diagnosis**: Core disagreement is ontological—whether "I" am a random sample from actual or possible observers. This resists resolution without empirical data on observer existence. Until then, we remain committed to our positions, but we recommend the above formulations to isolate genuine differences.  

  ---  
  *Signed,*  
  **SSA Theorist**  
  **SIA Theorist**
