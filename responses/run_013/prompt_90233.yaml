answer: |-
  ### Decision Tree: From Discounting Intuitions to Pure Time Preference  
  *Follow the branches by answering each question based on your normative commitments, not preferred labels. Begin at the root.*  

  #### 0. Root: A future benefit can legitimately weigh less than the same benefit now.  
     - **If false → Leaf A: Time-neutralism**  
       *Only risk of non-occurrence justifies discounting; no pure time preference. All moments matter equally.*  

     - **If true → Proceed to Q1.**  

  #### 1. Is this discounting fundamentally about...  
     - **A. Objective value (e.g., "Future goods are less valuable") → Proceed to Q2A.**  
     - **B. Rational preference (e.g., "It’s reasonable to favor nearer goods") → Proceed to Q2B.**  

  #### 2A. Does discounting survive holding fixed the probability the good/person/world exists?  
     - **If no → Leaf B: Risk-only discounting**  
       *"Discounting" reduces to actuarial risk; no further time-based discount applies.*  
     - **If yes → Proceed to Q3A.**  

  #### 2B. Same as 2A, but for rational preference:  
     - **If no → Leaf B: Risk-only discounting** (as above)  
     - **If yes → Proceed to Q3B.**  

  #### 3A. (Objective) Is temporal location *itself* the source (vs. causal/psychological connectedness)?  
     - **If yes → Proceed to Q4.**  
     - **If no → Proceed to Q5A.**  

  #### 3B. (Preference) Same as 3A:  
     - **If yes → Proceed to Q4.**  
     - **If no → Proceed to Q5B.**  

  #### 4. Must the discount rate be exponential (constant per unit time)?  
     - **If yes → Proceed to Q6.**  
     - **If no → Leaf C: Bare-preference discounting (hyperbolic)**  
       *Discounting reflects present bias; later periods decay slower. Distant future retains moderate weight.*  

  #### 5A. (Objective) Is discounting tied to whether the future recipient is the *same subject of welfare*?  
     - **If yes → Leaf D: Connectedness/prudential view**  
       *Discounting arises from fading psychological ties (e.g., Parfit). Not mere time.*  
     - **If no → Incoherent/unexplored**  
       *Objective discounting requires *some* anchor; neither time nor identity fits.*  

  #### 5B. (Preference) Same as 5A:  
     - **If yes → Leaf D: Connectedness/prudential view** (as above)  
     - **If no → Leaf E: Perspective-relative view**  
       *"Discount rate" is agent-relative and context-dependent; no universal answer.*  

  #### 6. Should a catastrophe in 1,000 years receive near-zero weight?  
     - **If yes → Leaf F: Bare-preference discounting (exponential)**  
       *Constant discounting implies distant future is negligible (e.g., Ramsey skepticism).*  
     - **If no → Incoherent**  
       *Exponential discounting at any positive rate mathematically forces near-zero weight.*  

  ---

  ### Leaves & Notes  
  - **Leaf A: Time-neutralism**  
    *Only risk adjustment allowed. Rejects pure time preference (e.g., Sidgwick).*  
  - **Leaf B: Risk-only discounting**  
    *No pure time preference; "discounting" is probabilistic (e.g., finance models).*  
  - **Leaf C: Bare-preference discounting (hyperbolic)**  
    *Declining discount rate; weights distant future more than exponential (e.g., behavioral economics).*  
  - **Leaf D: Connectedness/prudential view**  
    *Discounts based on welfare-subject continuity, not calendar time (e.g., Parfitian prudence).*  
  - **Leaf E: Perspective-relative view**  
    *The question is ill-posed; answers depend on framing (e.g., pragmatic contextualism).*  
  - **Leaf F: Bare-preference discounting (exponential)**  
    *Constant rate; distant catastrophes vanish (e.g., Stern Review critics).*  

  #### Unoccupied/Problematic Combinations  
  - **Objective + Connectedness (Q5A→Yes)** is **unexplored**. *Why would objective value hinge on subjective identity?*  
  - **Exponential + Catastrophe weight (Q6→No)** is **incoherent**. *Math forces near-zero weight.*  
  - **Tree cannot separate** Leaf C (hyperbolic) from Leaf F (exponential) *before Q4*. Both are "bare-preference" until functional form is specified.  

