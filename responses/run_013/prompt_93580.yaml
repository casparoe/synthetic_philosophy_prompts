prompt: |-
  A mate in my political theory group keeps pushing this argument and I genuinely can't tell if it's clever or just sophistry, so I'm outsourcing the verdict. He lays it out like this. (1) Corruption is the misuse of entrusted power for private gain. (2) A ward boss in a clientelist machine steers public jobs and contracts to his own network of supporters, who turn out and vote for him in return. (3) That network is a private party rather than the public at large, and the power he's wielding was entrusted to him by the public. (4) So by (1) he's corrupt. (5) But now take an ordinary MP who campaigns for a new hospital in her constituency and gets re-elected because the voters reward her for it. (6) Her constituency is also only a part of the public, not the whole of it, and she's also used entrusted power to send public money its way in return for an electoral payoff. (7) So if (4), she's corrupt too. (8) But nobody seriously thinks ordinary representation is corruption. (9) So the definition in (1) proves too much, and the whole anti-clientelism line is a Western norm smuggled in as a universal one.

  I want to keep (8), and I'd rather not give up the thought that the machine politician is definately doing something wrong. So which step goes, and what does dropping it cost me? If the answer is that (1) is just too thin, tell me what you'd add to it and why the addition isn't itself parochial.

  Lead with your bottom line in the first sentence, then the reasoning, no preamble and don't restate my question. British English please.
reasoning: |-
  Hmm, the user is grappling with a political theory argument from their group. Their friend claims that the standard corruption definition leads to an absurd conclusion: both clientelist ward bosses and ordinary representative MPs are corrupt. The user wants to reject the idea that ordinary representation is corrupt but also believes the ward boss is doing something wrong. They need to identify which step fails and how to refine the definition without being parochial.

  Breaking down the argument step by step:  
  - Premise (1) defines corruption as misuse of entrusted power for private gain.  
  - The ward boss (2-4) uses power to benefit supporters (a private group) for electoral gains, thus corrupt.  
  - The MP (5-7) secures a hospital for her constituency (a subset of the public) to win votes, so by (1) she should be corrupt too.  
  - But (8) says ordinary representation isn't seen as corrupt, so (1) "proves too much."  
  - Conclusion (9) argues anti-clientelism is a Western bias.  

  The core flaw is in step (6): the MP's constituency isn't "private" but part of the public she represents. Corruption requires benefiting a private party, not a subset of the public. The ward boss's network is private because it's an exclusive group based on loyalty, not a formal constituency. This distinction preserves (1) without implicating ordinary politics.  

  Dropping this distinction would cost clarity: it risks conflating legitimate representation with illicit patronage. The refinement isn't parochial because it focuses on whether beneficiaries are defined by public roles (constituents) or private ties (personal networks), a distinction observable cross-culturally. For instance, even in systems with strong clientelism, the ethical line often hinges on whether gains serve communal roles versus personal cliques.  

  The user implicitly seeks a universal definition that condemns clientelism without criminalizing normal democracy. By clarifying "private gain," we uphold that without Western bias, as the public-private divide is foundational to power entrustment globally.
answer: |-
  The flaw is in step (6): equating the MP's constituency with the ward boss's private network is invalid. The constituency is a legitimate *public* subdivision she is democratically mandated to represent, whereas the ward boss's network is a *private* group defined by personal loyalty and exchange, not public role. Dropping this distinction costs you the ability to differentiate legitimate representation from illicit patronage.

  Your mate's argument hinges on treating both beneficiaries ("private party" vs "constituency") as equivalent subsets of "the public". But they aren't. The MP's constituency is a formal, open, territorially defined segment of the public to whom she is institutionally accountable. Her power was entrusted *specifically to serve that constituency* as part of a system of geographic representation. When she secures a hospital, she is fulfilling her entrusted duty to that public segment; the electoral reward stems from legitimate democratic accountability.

  Conversely, the ward boss's network is a private, exclusive group defined by personal allegiance. His power was entrusted to serve *the entire public*, not this closed faction. Steering resources to them violates his duty to the broader public good. The gain is "private" because the network operates as a personal patronage vehicle, not a recognised public entity.

  Refining (1) to specify "for *improper* private gain" risks circularity. Instead, clarify that "private gain" involves benefiting parties *not entitled to the benefit by virtue of public role or need*. The ward boss's supporters gain purely through private loyalty; the constituency gains as constituents entitled to representation. This distinction isn't parochial—it addresses whether benefits flow via public rules or private bargains, a core concern in cross-cultural studies of corruption. Clientelism breaches norms of impartiality present in many non-Western traditions, not just liberal democracies.
