  First, I need to map the core tension: MEC claims that the act of killing in war is morally symmetrical regardless of the war's justice, but this clashes with intuition (how can someone fighting for slavery have equal permission to kill liberators?). The doctrine's defenders often pivot to pragmatic or institutional arguments—war's unique context, collective action problems, epistemic barriers—which feels like changing the subject to critics. 

