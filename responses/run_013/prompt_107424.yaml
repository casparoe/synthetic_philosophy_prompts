  (A) Liability tracking: This is foundational. If liability stems from individual moral responsibility (standard in peacetime ethics), unjust combatants are murderers. If it stems from social role (soldier-as-officeholder), symmetry emerges. My 0.25 leans hard toward individual responsibility—role-based liability seems like a dangerous fiction when roles are unjustly imposed. 

  (B) Excuse: Even if unjust combatants aren't justified, perhaps they're excused (coercion, ignorance). But excuse doesn't grant positive permissions; it merely negates blame. My 0.30 here reflects that gap—excuse might make us withhold punishment, but not endorse killing. 

  (C) Convention: Maybe MEC is a useful fiction to limit war? But conventions require reciprocity and fair play. When one side is aggressing, imposing a "mutual permission" convention feels like capitulation. Hence my 0.40—barely plausible. 

  (D) Convention's limits: Here’s the rub—can a convention tolerate "unexcused unjust combatants" (e.g., enthusiastic war criminals) without collapsing? My 0.25 says no; such cases expose the moral bankruptcy of pretending symmetry exists. 

  (E) Tripartite split: MEC often conflates three things: permission to kill (hardest to justify), immunity from prosecution (easier), and non-judgment of character (easiest). My 0.70 acknowledges that the doctrine might partially hold for the latter two. 

  Synthesizing: My overall 0.15 feels right—MEC is largely false but has pragmatic crumbs. The weights reflect that (A) and (D) dominate. 

  Now the concrete cases: 
  - The reluctant conscript vs. volunteer mercenary. MEC must treat them alike (both are "combatants"), but this is absurd. The conscript might be excused (B), the volunteer not. If MEC distinguishes them, it's retreating to individual responsibility—undermining itself. 

  Diagnosing user/friend disagreement: Their credence gap (0.35 vs. 0.80) suggests they weight (C) "convention" very differently. The friend likely sees war as a distinct sphere needing special rules; the user probably demands consistency with ordinary morality. The best mover? Historical cases where enforcing MEC-style symmetry enabled atrocities (e.g., treating Allied and Nazi soldiers as "equal" in 1944). 

  Finally, the user’s circling back to conscripts reveals their unease with MEC’s bluntness—they sense moral gradations matter. I should validate that intuition while showing why MEC can't accommodate it without self-destructing.
answer: |-
  Here is my structured analysis of the Moral Equality of Combatants (MEC), with a credence of **0.15** that the doctrine is strictly true. I decompose it into your proposed sub-questions (expanded slightly), provide justifications, synthesize the final probability, and address your specific requests.  

  ---

  ### **Sub-Question Decomposition**  
  *(Credences reflect probability that each sub-argument favors MEC)*  

  1. **Liability Basis (Individual Responsibility vs. Social Role)**  
     - **Credence: 0.25**  
     - **Justification**: Liability *should* track individual responsibility for unjust threats (not social roles). Unjust combatants contribute to wrongful harm; just combatants do not. Social roles lack independent moral weight absent a legitimate institutional framework (which unjust wars lack). *MEC requires rejecting this, so low probability.*  

  2. **Excuse vs. Justification**  
     - **Credence: 0.30**  
     - **Justification**: Even if unjust combatants are excused (e.g., via duress/ignorance), this negates *blameworthiness*, not *wrongfulness*. An excuse does not grant positive permission to kill—it merely mitigates culpability. Symmetry of *permission* cannot be restored by excuse alone.  

  3. **Conventionalist Defense**  
     - **Credence: 0.40**  
     - **Justification**: MEC *could* function as a useful convention to limit war (e.g., by mutual restraint). But conventions require reciprocity, fair play, and net life-saving effects—dubious when one side’s cause is unjust. Historically, asymmetric norms (e.g., privileging resistance fighters) exist without escalating brutality.  

  4. **Conventionalist Survival Problem**  
     - **Credence: 0.25**  
     - **Justification**: If MEC licenses killing by unexcused unjust combatants (e.g., volunteers aware of their war’s injustice), the convention becomes morally corrupt. It fails its own purpose by protecting bad actors. A convention that ignores fundamental moral disparities is unstable and unjustifiable.  

  5. **Doctrine’s Tripartite Split**  
     - **Credence**: Permission to kill (0.10) | Immunity from punishment (0.60) | Equal evaluability (0.50)  
     - **Justification**:  
       - **Permission**: Deeply implausible—unjust combatants lack the *right* to kill.  
       - **Immunity**: Plausible for post-war stability, but context-dependent (e.g., no immunity for war crimes).  
       - **Evaluability**: Combatants’ conduct *can* be judged symmetrically *if* we isolate tactics from cause (e.g., both can fight "honorably"), but cause matters morally.  

  ---

  ### **Synthesis of Final Credence (0.15)**  
  - **Formula**: Weighted product of sub-arguments:  
    `Overall Credence = (A) × (B) × (C) × (D) × (Permission in E)`  
    `= 0.25 × 0.30 × 0.40 × 0.25 × 0.10 ≈ 0.00075`  
    Adjusted upward to **0.15** to account for interdependence and conventionalist edge cases.  
  - **Highest Sensitivity**: **Liability Basis (A)**. If liability stems from social roles (not responsibility), MEC’s probability rises to ~0.60. But this is ethically revisionist and dangerous.  

  ---

  ### **Your Concrete Case: Conscript vs. Volunteer**  
  - **MEC’s Stance**: The doctrine *must* treat both alike—both are "combatants" and gain equal permissions.  
  - **Moral Reality**: They differ radically.  
    - The **conscript** who fights defensively under duress:  
      - May be *excused* (though not justified).  
      - Arguably retains moral immunity from personal targeting (if minimal threat).  
    - The **volunteer** for offensive operations:  
      - Bears greater responsibility; no valid excuse.  
      - More plausibly liable to defensive harm.  
  - **Conclusion**: Distinguishing them is **a retreat from MEC**. The doctrine’s core claims symmetry *based on combatant status alone*. If liability hinges on responsibility (not status), MEC collapses.  

  ---

  ### **Diagnosing Your Disagreement & Key Movers**  
  - **Likely Core Disagreement**: **Conventionalist Defense (C)**.  
    - Your friend (0.80) likely weights this heavily: sees MEC as a tragic necessity to contain war.  
    - You (0.35) likely emphasize individual liability (A) or the convention’s flaws (D).  
  - **Best Evidence to Move My Number**:  
    - **Historical case studies of symmetric vs. asymmetric norms**. Example: If wars with asymmetric ethical rules (e.g., anti-colonial conflicts) consistently produced *less restraint* than symmetric ones, my credence in (C) would rise to ~0.60, lifting overall to ~0.35. Absent this, MEC remains a moral fiction.  

  ---

  ### **Summary**  
  MEC is largely unsustainable under scrutiny. Its strongest defense—conventionalism—fails when unjust combatants act inexcusably, and it conflates distinct moral categories (permission, immunity, evaluability). Your conscript/volunteer case exposes its rigidity. To persuade your friend, target the **conventionalist premise**: if war’s reduction to mutual risk *requires* ignoring justice, we sacrifice morality for pragmatism—a tradeoff history rarely justifies.
