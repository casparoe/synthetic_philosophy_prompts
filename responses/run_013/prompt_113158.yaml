answer: |-
  **Essay Question**  
  Ilse and Roderick both exhibit identical behavioral and counterfactual profiles when their friend is threatened: neither acts, and all observable or testable scenarios yield indistinguishable outcomes. Yet Ilse’s device deletes the history constituting her attachment *during* the threat, while Roderick’s floods him with terror while leaving his attachment intact. Argue whether each character’s protective disposition survives the intervention (i.e., is finks/mask present?), grounding your verdict in metaphysical distinctions *beyond* counterfactual identity. Propose a refinement to the standard counterfactual analysis that accommodates your verdict, and design a new case exposing a residual weakness in your refinement.  

  ---

  **Model Answer (600 words)**  

  The Ilse/Roderick case collapses the standard fink/mask distinction by rendering their counterfactual profiles identical: both fail to protect when threatened, and no test can distinguish their states under stimulation. To resolve this, we must reject pure counterfactual analysis and appeal to *metaphysical persistence conditions* of the dispositional state. I argue Ilse’s disposition is *finked* (destroyed), while Roderick’s is *masked* (retained but blocked). The grounding lies in whether the mechanism disrupts the *categorical basis* of the disposition itself or merely its causal pathway.  

  Ilse’s disposition is finked because the device severs the *historical-continuity* required for her attachment’s existence. Dispositions like deep trust are not momentary states but *temporally extended properties*: they depend on a persistent psychological structure integrating past experiences. By deleting the constitutive history *during* the threat, the device annihilates the categorical basis (the attachment itself). Thus, no stable state exists to manifest—the disposition vanishes mid-stimulus. This aligns with finkishness: the stimulus triggers destruction of the very property that would manifest, violating the counterfactual’s "state held fixed" clause.  

  Roderick’s disposition, conversely, is masked. His attachment remains intact—its categorical basis (e.g., stored memories, emotional associations) persists unchanged. The terror is an *extrinsic additive force* that competes with but does not alter the protective disposition. Masking occurs because the terror parasitically hijacks Roderick’s cognitive resources, blocking expression without eroding the underlying state. Crucially, if the terror were removed mid-threat (e.g., by a second device), protection would immediately manifest. This satisfiability of the counterfactual under interference removal confirms masking.  

  The core distinction thus hinges on *intrinsic versus extrinsic disruption*. Finks alter the disposition’s supervenience base (Ilse’s erased history); masks introduce external causal interference (Roderick’s terror). This demands refining the counterfactual analysis to include *temporal persistence criteria*:  
  > *A thing has a disposition D iff (i) it is in a state S constituting D’s categorical basis, and (ii) if S persists unchanged through stimulus C, manifestation M would occur.*  

  This handles Ilse/Roderick: Ilse fails (i) as S is destroyed; Roderick satisfies (i) but (ii) fails due to terror.  

  However, my refinement fails with *decaying dispositions*. Suppose Ingrid is disposed to recoil at loud noises due to a neural state S that naturally degrades after 0.5 seconds. A stimulus (a loud noise) begins at t=0, but S decays at t=0.4s before manifesting. By my analysis, the disposition is finked (S doesn’t persist). Yet intuitively, this is masking—S decayed *autonomously*, not via a mechanism triggered by the stimulus. The refinement conflates internal fragility with external intervention, revealing that "persistence" requires specifying *normal conditions* for S’s stability—a problem inherited from dispositional essentialism.  

  ---

  **Marking Scheme (20 marks total)**  
  *Weak answers typically: (1) swap verdicts, (2) default to counterfactual similarity, (3) cite "state alteration" without metaphysical grounding, (4) propose superficial refinements, (5) offer trivial counterexamples.*  

  1.  **Correct verdicts with precision** (5 marks):  
      *A:* Explicitly labels Ilse’s case as finkish (disposition destroyed) and Roderick’s as masked (disposition intact).  
      *Weak:* Misassigns cases, calls both "masked/finked," or omits one verdict.  

  2.  **Grounding beyond counterfactuals** (5 marks):  
      *A:* Appeals to persistence conditions/categorical bases (e.g., Ilse’s historical discontinuity vs. Roderick’s stable attachment).  
      *Weak:* Relies on behavioral similarity or recycles "state alteration vs. interference" without deeper justification.  

  3.  **Rigorous justification per case** (4 marks):  
      *A:* For Ilse: argues attachment requires temporal continuity. For Roderick: shows terror is extrinsic additive interference.  
      *Weak:* Vagueness (e.g., "Ilse’s state changes, Roderick’s doesn’t") or conflation (e.g., "both are blocked").  

  4.  **Refinement addressing the crux** (4 marks):  
      *A:* Proposes a revision (e.g., temporal persistence of categorical basis) resolving Ilse/Roderick.  
      *Weak:* Ad-hoc fixes (e.g., "add ‘no history-deletion’") or regurgitates standard analysis.  

  5.  **Novel counterexample exposing flaw** (2 marks):  
      *A:* Designs a case (e.g., decaying dispositions) where the refinement fails and diagnoses why.  
      *Weak:* Trivial cases (e.g., standard fink/mask) or no counterexample.  

  ---  
  **Rationale**: This question forces engagement with the *metaphysics of persistence*—ignored in the "state alteration" heuristic—by exploiting identical counterfactuals. The A/B divider is whether students spot that dispositions like trust require *temporal integrity* (Ilse) versus *structural stability* (Roderick), moving beyond syntactic labels to ontological grounding. The refinement and counterexample then test if they grasp the lingering tensions in dispositional ontology.
