  First, I need to identify where standard theory falls short. The thin spot is the reliance on counterfactual identity. The usual distinction (does the mechanism alter the state or just interfere?) collapses here because both cases appear identical under counterfactual tests. That’s the crux: grounding a verdict without observable differences. 

  Brainstorming candidate angles: 
  - Metaphysical grounding: What makes a disposition "survive"? Is it categorical bases or intrinsic properties? 
  - Temporal vs. compositional criteria: Ilse’s attachment is deleted (temporal interruption), while Roderick’s is intact but overridden (compositional interference). 
  - Deeper metaphysics: Maybe dispositions aren’t just states but involve historical or structural properties. 

  Settling on the temporal/compositional split—it’s subtle but forces students to move beyond labels. Ilse’s case attacks the state’s persistence (fink), Roderick’s attacks expression (mask). The refinement should require specifying dispositional properties’ persistence conditions. 

  For the question: Must force (i) verdicts, (ii) grounding beyond counterfactuals, and (iii) a refined analysis with its own counterexample. Keep it one paragraph. 

  Model answer structure: 
  - Introduce the problem: Identical counterfactuals but different mechanisms. 
  - Analyze Ilse: State is destroyed (fink) because attachment’s temporal continuity breaks. 
  - Analyze Roderick: State persists but is overridden (mask) because terror is extrinsic. 
  - Grounding: Appeal to intrinsic/metaphysical facts—categorical bases for Roderick, discontinuity for Ilse. 
  - Refinement: Add temporal persistence to the counterfactual analysis. 
  - New counterexample: A slow-acting disposition where state degrades before manifestation—blurs fink/mask lines. 

  Marking scheme: Five critical moves (20 marks total). 
  1. Correct verdicts (fink for Ilse, mask for Roderick) — weak answers swap them or miss nuances. 
  2. Grounding beyond counterfactuals (e.g., intrinsic properties) — weak answers just rehash counterfactuals. 
  3. Rigorous justification for each verdict — weak answers use labels without argument. 
  4. Refinement with persistence criteria — weak answers propose vague or ad-hoc fixes. 
  5. New counterexample exposing refinement’s flaw — weak answers give trivial examples. 

