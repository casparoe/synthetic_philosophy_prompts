    - Honors her view: Doesn’t claim EU theory is "broken" (per your argument)—says certain phenomena resist definition.  
  - **For non-experts:**  
    - Uses storytelling ("Imagine a coin..."), not formulas.  
    - Key phrases like "how you tell the story" and "defy the totals" make the metaphor intuitive.  
