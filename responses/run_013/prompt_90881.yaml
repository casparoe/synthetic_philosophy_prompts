  Here’s a draft that threads the needle—accurate for experts, engaging for non-philosophers, and anchored in affection. I’ve woven the paradox into metaphors about her character, avoiding math jargon while honoring her intellectual legacy:

  ---

  **Toast for Dr. Eleanor Vance**  
  *(Raise glass, warm eye contact with the mentor)*  

  "Forty years. Forty years of questions, conversations, and—let’s be honest—some wonderfully fierce debates. For those of us who’ve had the honor of working with Eleanor, we know her brilliance isn’t just in finding answers… **it’s in revealing how beautifully messy the questions can be.**  

  Now, I need to tell you about a coin. *(Lean in conspiratorially)* Not a special coin—a perfectly fair one. Imagine flipping it until it lands heads. If it takes one toss, you win $2. Two tosses? You *owe* $2. Three? Win about $5.33. Four? Owe $4. And so on… forever.  

  *(Pause, turn to family)* I know—this sounds like a casino nightmare! But trust me, it matters. Because when Eleanor studied this game—the ‘Pasadena Game’—she uncovered something profound: **The whole story depends on how you tell it.**  

  See, if you tally the wins and losses in order, it *looks* like it should average out to about 69 cents. But change the order? You could make it seem worth a million dollars… or *owe* a million. There’s no single ‘right’ total—not because the math is broken, but because **some things refuse to be pinned down by a simple sum.**  

  *(Shift tone, focus on Eleanor)*  
  Eleanor, that’s how *you* moved through the world. You never let anyone reduce a person—or an idea—to one number. You showed us that **order matters.** How we arrange our choices, our arguments, even our lives—it changes everything. And yes, you joked this game ‘ruined your life in the best way.’ But really? It showed us *your* signature move: **You found freedom in the undefined.**  

  To the philosophers here: She taught us that uncertainty isn’t a flaw—it’s a feature. To the family: She proved that some people can’t be ‘added up’ in a tidy column. Her legacy? It’s not one grand total—it’s countless moments where she made us rethink *how we count what matters.*  

  So let’s raise a glass:  
  To Eleanor—a force of nature who turned ‘it depends’ into an anthem, and showed us that the richest things in life… **defy the totals.**"  

