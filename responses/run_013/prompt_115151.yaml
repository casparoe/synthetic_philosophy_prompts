  Risk: Judges/funders might squirm. But Nadia’s family and colleagues will recognize the truth—her legacy isn’t just her work, but the standard she set for what public defense *ought* to be. The closing redirects praise from her "sacrifice" to her uncompromising vision of justice. 

  After drafting, I’ll flag where interpretations might spark debate (e.g., whether calling out underfunding is appropriate at a retirement event). The user prefers transparency over surprise hecklers.
