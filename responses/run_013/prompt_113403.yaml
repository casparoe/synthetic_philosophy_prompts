  Right, let's unpack this properly – you've hit the nail on the head about the confusion surrounding Hart-Devlin. It's *not* really about whether law and morality are connected *at all* (they obviously are, laws often reflect morals), but **specifically about whether the fact that society finds something morally repugnant ("immoral") is *by itself* a sufficient justification for making it a criminal offence, *even when no direct, tangible harm to others can be demonstrated*.** Your flatmate is taking a Devlin-esque position.

  Here's the breakdown:

  1.  **Lord Patrick Devlin's Position (The Moralist):**
      *   **Core Argument:** Society is held together by a shared, fundamental morality. This "public morality" is essential for social cohesion and stability.
      *   **The "Disintegration Thesis":** If society collectively finds a practice deeply abhorrent, disgusting, and intolerable (like incest, in his view, even consensual adult incest), tolerating it undermines this shared morality. This erosion *is* a harm to society itself – the harm of social disintegration. The law is entitled to protect society from this harm.
      *   **The Role of Disgust:** Intense, widespread public feeling of disgust, indignation, intolerance, and reprobation towards an act is evidence that it attacks the foundational fabric of society. The "man on the Clapham omnibus" test: what would the ordinary, reasonable person find deeply shocking and unacceptable?
      *   **Justification for Criminalisation:** The law *can* and *should* enforce this shared public morality to prevent society crumbling, even if no *individual* victim (beyond the participants who consent) can be pointed to. Immorality *is* the harm to the social fabric. The Wolfenden Committee's focus *only* on harm to others was too narrow.

  2.  **H.L.A. Hart's Position (The Liberal):**
      *   **Core Argument:** Drawing heavily on John Stuart Mill's "harm principle". The only legitimate purpose of the criminal law is to prevent harm to others (including identifiable public harms like disorder or exploitation). The law should protect people, not enforce morality for its own sake.
      *   **Critique of "Public Morality":** What "society" finds immoral is often just the accumulated prejudices of the majority. Enforcing this is simply "tyranny of the majority" over minority choices and private lives.
      *   **The Limits of Disgust/Disapproval:** Feeling disgusted by something isn't a rational basis for law. Disgust is subjective and volatile. Criminal law needs a firmer, more objective foundation – demonstrable harm.
      *   **Critique of the "Disintegration Thesis":** Hart argued Devlin provided no evidence that abandoning laws against purely private, consensual "immoral" acts (like homosexuality between consenting adults in private, which was the *original* context of the Wolfenden Report and the Hart-Devlin debate) would actually cause society to disintegrate. Societies can tolerate significant moral pluralism without collapsing.
      *   **Justification for Criminalisation:** Criminalisation requires proof of harm to others (physical, psychological, financial) or a clear, tangible public harm (like disorder, nuisance, or exploitation). Mere "immorality" isn't enough.

  **Who "Won"? The State of Play:**

  *   **Policy Shift:** Hart's position, aligned with the Wolfenden Report, *did* win the day in terms of major policy shifts. The decriminalisation of homosexuality in England and Wales (1967) was the most direct consequence. The general trend in liberal democracies has been towards decriminalising private, consensual conduct between adults where no harm to others is evident.
  *   **Not Dead and Buried:** However, **Devlin's arguments are absolutely *not* "dead and buried" in legal philosophy, political debate, or even in the statute book.** Your flatmate is tapping into a persistent and powerful line of thought. Consider:
      *   **Your Incest Example:** Laws against adult, consensual sibling incest *do* largely rest on the "yuck factor" and the deeply held moral taboo, even where arguments about potential power imbalances or genetic risks to offspring (if they occur) are weak or non-applicable in a specific case. The Law Commission of England and Wales, while recommending reform to some incest laws, acknowledged the difficulty of justifying the *absolute* ban on adult consensual sibling sex *solely* on harm grounds, implicitly recognising the residual moralistic foundation. It remains a crime.
      *   **Other Examples:** Laws against bestiality, necrophilia, and certain extreme pornography often rely heavily on the "disgust" factor and moral revulsion, even when harm arguments (especially regarding consent) are complex or stretched. The concept of "outraging public decency" exists.
      *   **"Harm to Society" Arguments:** Politicians and campaigners *still* frequently argue for banning things because they are "degrading," "corrosive to society's values," or "against the natural order," echoing Devlin.
      *   **Legal Moralists:** Philosophers like Robert P. George continue to argue robustly for legal moralism, asserting that the law *should* promote virtue and discourage vice, even in private.

  **Does it Settle the Justification Question?**

  *   **No, it does not settle it.** The Hart-Devlin debate *frames* the core disagreement but doesn't resolve it. It's an enduring philosophical and political conflict between:
      *   **Liberalism (Harm Principle):** Law protects individuals from harm by others; private morality is not the law's business.
      *   **Legal Moralism/Conservatism (Devlin):** Law has a role in upholding the shared moral order essential for society; preventing moral decay *is* preventing harm to society itself.
      *   **Perfectionism:** Law should promote human flourishing and discourage harmful *choices* (even if only self-regarding).
  *   **The Current State of Play (UK Focus):**
      *   The *dominant trend* and *official policy justification* (e.g., from the Law Commission) leans heavily towards requiring evidence of **harm or significant risk of harm** for criminalisation.
      *   However, **residual moralism persists** in specific laws (like incest) and in political and public discourse.
      *   Arguments about **indirect harms** (e.g., "normalising" harmful behaviour, undermining family structures, damaging the "moral environment") are often deployed, which blur the line between direct harm and Devlin's social disintegration thesis.
      *   The **"harm principle" is not absolute or perfectly defined.** Defining "harm," especially intangible social harm, is contentious. Does causing widespread offence constitute a harm justifying restriction? (Think public order vs. private acts).

  **Your Flatmate's Strongest Case (The Devlin Arsenal):**

  Here are the most potent arguments for her side, phrased strongly:

  1.  **Society's Glue:** "Laws aren't just traffic regulations; they embody our deepest shared values. If something is genuinely felt by the overwhelming majority to be utterly depraved and intolerable – like adults shagging their siblings – letting it happen signals that those values mean nothing. That *erosion of shared norms* is a real harm; it makes society more atomised, less trusting, and ultimately weaker. The law *must* defend the foundations of the community it serves."
  2.  **The Slippery Slope of Tolerance:** "Once you say 'no harm, no foul' for something universally reviled like incest, where do you draw the line? What *other* deeply harmful or destabilising practices might we start tolerating simply because we can't immediately pinpoint a victim in a specific instance? The law needs bright lines based on fundamental moral boundaries to prevent this slide."
  3.  **Disgust as Evidence:** "This isn't just about 'I don't like it'. That intense, visceral feeling of disgust most people have towards certain acts isn't arbitrary; it's evolved or socially ingrained for a reason. It signals a profound threat to social order and human dignity. Dismissing this as mere prejudice ignores a powerful social instinct that points towards genuine harm to the social fabric."
  4.  **The 'Harm to Society' is Real:** "Society isn't just a collection of individuals; it's an entity with its own health. Permitting acts that are universally seen as profoundly degrading and unnatural – like your sibling example – *does* harm that entity. It coarsens the culture, damages the institution of the family (even if no kids are involved *this time*), and undermines the shared understanding of basic human relationships that allows society to function smoothly. Preventing *that* harm is absolutely the law's job."
  5.  **Practical Reality:** "Look at the law *right now*! Incest *is* illegal. Bestiality *is* illegal. The Law Commission might squirm, but Parliament hasn't changed it. Why? Because deep down, society – through its representatives – still believes Devlin was right about the core point: some things are simply beyond the pale, and the law must say so."

  **Your Counter (The Hart Arsenal):**

  *   **Tyranny of the Majority:** "Criminalising someone just because the majority finds their private life disgusting is pure oppression. People have a right to live their lives without the state enforcing other people's moral tastes, especially when they aren't hurting anyone. That's the bedrock of a free society."
  *   **Lack of Evidence for Collapse:** "Where's the proof that allowing private, consensual but 'immoral' acts causes society to disintegrate? Homosexuality was decriminalised, and society didn't crumble. Fear of a slippery slope isn't evidence."
  *   **Harm Principle Clarity:** "The law should focus on preventing real, identifiable harm – violence, theft, fraud, exploitation. 'Feeling icky' or worrying about vague 'social fabric' isn't enough. Without clear harm, criminalisation is unjustified state overreach."
  *   **Danger of Subjective Morality:** "Whose morality gets enforced? Public disgust is fickle and often rooted in historical prejudice. Law based purely on disgust is arbitrary and potentially oppressive."

  **In short:** You were slightly off initially. Hart didn't deny *any* connection; he fiercely opposed using the law *only* to enforce morality without harm. Devlin argued that enforcing core morality *is* preventing harm (to society). Your flatmate is channeling Devlin. While the harm principle dominates modern liberal discourse, Devlin's arguments remain powerful, especially in debates about acts causing profound public revulsion like incest, and they haven't been entirely banished from the law books or political debate. The row goes on because it pits fundamental values of individual liberty against social cohesion and moral tradition. Good luck tonight!
