  Okay, the user is having a heated debate with their flatmate about whether the law can ban something just because it's "degrading and disgusting," even without proven harm. They've looked into the Hart-Devlin debate but are still confused. Let me unpack this.

  First, I need to clarify the actual positions of Hart and Devlin. The user initially thought Hart argued for a complete separation of law and morality, while Devlin wanted them intertwined. But that's a bit oversimplified. Hart was a legal positivist, so he believed law and morality are separate concepts, but that doesn't mean laws can't reflect morals. His key point was that criminalizing behavior *only* because it's immoral isn't justified without harm. Devlin, on the other hand, argued society needs shared morals to survive, so banning deeply offensive behavior is legitimate even without direct harm.

  The user brings up incest between consenting adults as an example of something illegal without clear harm. This seems to support their flatmate's point. But Hart would counter that historical laws against incest are based on outdated morals, not harm principles. Modern approaches might focus on potential coercion or genetic risks, but if those are absent, the law might be unjustified under Hart's view.

  The user's tutor mentions "enforcement of morals," which is exactly what the Hart-Devlin debate centered on. So the user's confusion between whether the debate is about connection vs. enforcement makes sense. They are connected issues, but the core is about when morality alone justifies legal enforcement.

  For the current state of play, the harm principle still dominates, but moralistic laws persist (like incest or bestiality). The strongest case for the flatmate is societal cohesion: if an activity causes widespread disgust, it could undermine social bonds. Lord Devlin's "disintegration thesis" suggests that without shared morals, society falls apart. Also, the idea of "harm to society" as intangible damage is a point in her favor. The Law Commission's stance shows that even now, moral disgust influences laws despite official harm-based policies.

  The user needs solid arguments for both sides. For their flatmate's strongest points: societal cohesion, normative standards, and practical examples like incest laws. For the user, emphasizing individual liberty, the risk of tyranny by majority, and the importance of evidence-based harm. Also, pointing out that many moralistic laws are remnants, not modern justifications.

  I should make sure to use British English terms like "council," "flatmate," and "row." The user is a student, so referencing their tutor and academic context is important. They need clarity on the debate to argue effectively with their flatmate, so providing clear points for both sides is crucial. They might also want reassurance that their view has academic backing while acknowledging why their flatmate's position isn't entirely invalid.
