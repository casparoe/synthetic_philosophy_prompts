  Let me start by listing the core requirements. Safety isn't just about current dumb systems but superintelligent ones. Honesty needs to hold even under scrutiny gaps. Self-modification mustn't compromise alignment. Testing has to be possible pre-deployment. The distinction between aligned and controllable is crucial—control breaks down at higher intelligence. The system must care intrinsically about the spec, not just follow it instrumentally. The theory must be compatible with ML practices like gradient descent. Checkability by regulators is vital; without it, solutions aren't practical.

  Now, which requirements are real? Safety beyond current capabilities, honesty without oversight, handling self-modification, and pre-deployment testing are legitimate. Distinguishing aligned from controllable and intrinsic care are fundamental. ML compatibility is essential. Checkability is non-negotiable for real-world application.

  What about fears? Some might argue that scheming is overemphasized, but it's a valid concern. The "system must care intrinsically" might be seen as philosophical, but it's necessary for true alignment. 

