  4. Does the character believe that the theft was discovered at 9 PM? (Yes, fact 4)
  5. Does the character believe that the violin was stolen from the concertmaster's dressing room and the violin is a Stradivarius? (Yes, by AND: facts 1 and 8)
  6. Does the character believe that either the violin was stolen or the janitor is the thief? (Yes, by OR on fact 1: let P be fact 1, then P or Q for any Q)
  7. Does the character believe that they believe that the violin was stolen? (Yes, by BEL on fact 1)
  8. Does the character believe that the lock was not broken? (Yes, fact 5)
  9. Does the character believe that the conductor discovered the theft or the violin is a Stradivarius? (Yes, by OR on fact 4, or on fact 8? Actually, we can OR on any fact. So if we take fact 4: "the theft was discovered at 9 PM by the conductor", then we can OR: "the theft was discovered at 9 PM by the conductor or ...". But the question is: "Does the character believe that the conductor discovered the theft or the violin is a Stradivarius?" Note: from fact 4 we have "the conductor discovered the theft", so by OR, we can get that or anything. So yes.
  10. Does the character believe that the janitor stole the violin? (Can't tell - not in dossier and not derivable)

  For the group with the contradiction (D), they must answer yes to all, including question 10.

  This should work.

  **How to handle the game**:
  - Be clear that the rules are artificial and meant to expose a problem.
  - In the debrief, emphasize that this is a model and we are exploring its flaws.
  - The prize is lighthearted to keep it fun.

  This design should make them feel the absurdity in their bodies: the frustration of having to accept ridiculous beliefs, the unfairness of the contradiction, and the silliness of the disjunctions.

  Good luck with the workshop!
answer: |-
  ### Central Mechanic
  Participants role-play characters with fixed belief sets, answering questions and generating logical consequences based strictly on predefined inference rules, experiencing the absurdity of commitment to all deductive closures—regardless of actual awareness—through game pressure.

  ### Why This Design?
  I chose this structure because it forces novelists to viscerally confront the gap between a character's explicit thoughts and their "logical commitments" via competitive pressure, timed challenges, and a dramatic contradiction reveal. The dossier format mirrors how writers build character backgrounds, making the absurdity relatable. I sacrifice depth on possible-worlds semantics (which I'll explain verbally) to prioritize embodied frustration, using the bounty round to amplify the disjunction trick and the contradiction to showcase explosion. The debrief explicitly ties each game moment to the philosophical problems and repairs.

  ---

  ### Materials
  #### 1. **Dossiers** (Print one per participant; group into teams of 3–5 if needed)  
  Each dossier has 10 facts about a stolen violin case. **Dossier D** contains a contradiction (Facts 6 and 10).  

  **Dossier A: The Concertmaster’s Violin**  
  1. The violin was stolen from the locked dressing room between 7 PM and 9 PM.  
  2. Only the concertmaster, conductor, and janitor had keys to the dressing room.  
  3. The concertmaster was onstage from 7 PM to 9 PM.  
  4. The conductor was in the auditorium from 7 PM to 9 PM.  
  5. The janitor was cleaning the lobby from 7 PM to 8 PM.  
  6. The janitor’s fingerprints were on the dressing room door.  
  7. The violin is worth $2 million.  
  8. The theft was reported by the conductor at 9:15 PM.  
  9. The dressing room lock was undamaged.  
  10. The concertmaster owns the violin.  

  **Dossier B: The Busker’s Violin**  
  1. The violin was stolen from a park bench at 3 PM.  
  2. The busker left the bench at 2:55 PM to buy coffee.  
  3. The busker returned at 3:05 PM to find the violin gone.  
  4. Three witnesses were nearby: a florist, a cyclist, and a street artist.  
  5. The florist was arranging tulips from 2:50 PM to 3:10 PM.  
  6. The cyclist was repairing a bike tire from 2:58 PM to 3:07 PM.  
  7. The street artist was painting a mural starting at 3 PM.  
  8. The violin has a red sticker on its neck.  
  9. The bench is under a working security camera.  
  10. The busker needs the violin for a 4 PM audition.  

  **Dossier C: The Heirloom Violin**  
  1. The violin was stolen from a locked display case during a gala.  
  2. The case was forced open with a crowbar.  
  3. The gala ran from 8 PM to 10 PM.  
  4. Four guests were near the display: the host, a chef, a pianist, and a critic.  
  5. The host was giving a speech from 8:30 PM to 8:45 PM.  
  6. The chef was preparing desserts in the kitchen until 9 PM.  
  7. The pianist was performing from 8 PM to 9 PM.  
  8. The critic was taking notes in the lounge at 8:40 PM.  
  9. The violin belonged to the host’s grandmother.  
  10. A crowbar was found in the pianist’s bag.  

  **Dossier D: The Student’s Violin**  
  1. The violin was stolen from a practice room between 2 PM and 2:30 PM.  
  2. The student left the room at 2 PM to attend a lecture.  
  3. The student returned at 2:30 PM to find the violin gone.  
  4. Three people were in the hallway: a tutor, a librarian, and a cleaner.  
  5. The tutor was holding a physics textbook at 2:15 PM.  
  6. The librarian was in the practice room at 2:15 PM. *(Contradiction trigger)*  
  7. The cleaner was mopping the floor from 1:45 PM to 2:15 PM.  
  8. The practice room has no windows.  
  9. The librarian was logged into the library computer at 2:15 PM.  
  10. The librarian cannot be in two places at once. *(Contradiction: Facts 6 and 10)*  

  #### 2. **Rule Cards** (Print one per participant)  
  *Front:*  
  **Your Character’s Inference Rules**  
  You must apply these rules to the dossier facts. If the premises are in the dossier or derived, the conclusion is *automatically* part of your character’s beliefs—no matter if they’ve thought about it!  
  1. **MP (Modus Ponens):** If P is true and P implies Q is true, then Q is true.  
  2. **OR (Disjunction):** If P is true, then “P OR Q” is true for *any* Q (e.g., “The janitor has keys OR the moon is cheese”).  
  3. **AND (Conjunction):** If P is true and Q is true, then “P AND Q” is true.  
  4. **BEL (Belief Introspection):** If P is true, then “The character believes P” is true.  

  *Back:*  
  **Key Consequences**  
  - From BEL: If your dossier says “The violin was stolen,” your character believes they believe it (use for belief questions).  
  - From OR: You can generate infinite absurdities (e.g., “The violin was stolen OR unicorns exist”).  
  - Contradiction?: If your dossier contains P and not-P, your character believes *everything*.  

  #### 3. **Scoring Rules** (Read Aloud Verbatim)  
  > “Your character is committed to *every* sentence that logically follows from your dossier under the four rules—whether they’ve considered it or not. You are not being scored on what you personally deduce in time; you’re being scored on what *must* be true under the rules.  
  >  
  > **Round 1: Yes/No Questions**  
  > - I’ll ask questions. Answer:  
  >   - **‘Yes’** if the sentence follows from your dossier (or its negation isn’t there).  
  >   - **‘No’** if the *negation* follows (rare unless contradiction).  
  >   - **‘Can’t tell’** if neither follows.  
  > - Scoring:  
  >   - **+1 point** for correct answer.  
  >   - **–1 point** for incorrect answer.  
  >   - **–3 points** for ‘Can’t tell’ when the answer *does* follow (heavy penalty for ‘ignoring’ commitments).  
  >  
  > **Round 2: Bounty Hunt**  
  > - Write down *new* sentences that follow from your dossier but aren’t explicitly stated.  
  > - Rules:  
  >   - Must use ≥1 inference rule.  
  >   - Max 5 submissions per team.  
  > - Scoring:  
  >   - **+2 points** per unique, valid sentence (not submitted by others).  
  >   - **–1 point** per invalid submission.  
  > - If your dossier has a contradiction, *every* sentence is valid (but you lose points if you submit nonsense without realizing).  
  >  
  > **Round 3: Reveal**  
  > - I’ll expose that one dossier had a contradiction—committing that character to *everything*.  
  >  
  > **Prize:** Winning team picks dinner and gets the Magnifying Glass Trophy!”  

  ---

  ### Timeline (2 Hours Total)
  - **0:00–0:15 — Setup**  
    Hand out dossiers and rule cards. Assign teams. Briefly: “You’re detectives role-playing characters. Use only these rules and facts.”  
    *Why: Novelists need context to “inhabit” characters.*  

  - **0:15–0:25 — Study Time**  
    Teams read dossiers/rules. Clarify rule mechanics only (e.g., “OR lets you add anything to a fact”).  
    *Predictable issue: Someone asks, “Do we have to derive everything now?” Reiterate: “No—commitments exist whether derived or not.”*  

  - **0:25–0:55 — Round 1: Yes/No Questions**  
    Ask 10 questions rapid-fire (1–2 min per question). Mix:  
    - **Q1–Q3:** Explicit facts (e.g., Dossier A: “Does the character believe the violin is worth $2M?” → Yes).  
    - **Q4–Q6:** MP/AND inferences (e.g., Dossier B: “Does the character believe the florist was arranging tulips AND the cyclist was repairing a tire?” → Yes via AND).  
    - **Q7–Q8:** OR disjunctions (e.g., Dossier C: “Does the character believe the crowbar was used OR the host is innocent?” → Yes via OR).  
    - **Q9:** BEL introspection (e.g., Dossier D: “Does the character believe they believe the violin was stolen?” → Yes via BEL on Fact 1).  
    - **Q10:** Unanswerable (e.g., All: “Does the character believe the tutor stole it?” → Can’t tell).  
    *Track scores publicly (simple whiteboard).*  

  - **0:55–1:15 — Round 2: Bounty Hunt**  
    Teams write 5 new logical consequences. Verify submissions instantly:  
    - Valid: “Dossier A: Janitor has keys AND violin is worth $2M” (AND rule).  
    - Invalid: “Dossier B: Florist stole it” (no rule supports).  
    *Predictable issues:  
    - Teams spam OR disjunctions (e.g., “Violin stolen OR 1+1=3”). Mitigate by capping submissions.  
    - Team D (contradiction) may not realize their power. If they submit nonsense, say: “Valid... for now” to hint at Round 3.*  

  - **1:15–1:25 — Round 3: Contradiction Reveal**  
    Announce: “One dossier had a contradiction: Dossier D’s Facts 6 and 10. Under logic, this character believes *every* sentence—they could’ve submitted ‘The violin is on Mars’ for points.”  

  - **1:25–1:50 — Debrief**  
    Map game moments to the problem and repairs:  
    > **Closure Rule (MP/AND):** In Round 1, you lost points for ‘can’t tell’ on simple inferences (e.g., AND on two facts). *Problem:* Characters “know” all consequences instantly. *Repair (Awareness):* Only count beliefs the agent has a “grip” on. *Cost:* Loses obvious deductions (e.g., if a character believes “It’s raining,” they might not infer “The ground is wet” without focus).  
    >  
    > **Disjunction Trick (OR):** In Round 2, OR generated absurdities (e.g., “Violin stolen OR pigs fly”). *Problem:* Agents “know” infinite irrelevant truths. *Repair (Impossible Worlds):* Allow worlds where logic fails (e.g., a world where P is true but P OR Q isn’t). *Cost:* Breaks intuitive logic; hard to model.  
    >  
    > **Contradiction (Round 3):** Dossier D’s explosion exposed deductive closure’s fragility. *Problem:* One inconsistency destroys the system. *Repair (Resource-Bounded):* Agents derive beliefs over time/effort. *Cost:* Requires modeling cognitive limits; loses timeless truths (e.g., math).  
    >  
    > **Introspection (BEL):** In Q9, characters “knew” their own beliefs perfectly. *Problem:* Real people don’t. *Repair (All Approaches):* Awareness or resource bounds tame this.  
    >  
    > *What the game can’t do:*  
    > - It doesn’t show why closure is useful (e.g., for proofs or perfect logicians). *You must say:* “Closure captures ideal reasoning—like when a character slowly deduces a truth, we assume they *would* get there with infinite time. The game ignores this nuance.”  
    > - It doesn’t explain possible-worlds semantics forcing omniscience. *You must say:* “In formal models, ‘knowledge’ means truth in all possible worlds—so agents ‘know’ logic because it’s true everywhere. The game’s rules are a shorthand for this.”  
    > - *False impression risk:* Players might think the problem is “just bad rules.” *Clarify:* “Real knowledge models (e.g., economics, AI) face this—it’s not a game flaw but a deep paradox.”  

  - **1:50–2:00 — Winner Announcement & Trophy**  
    Tally scores. Award magnifying glass trophy.  

  ---

  ### Predictable Issues & Fixes
  1. **Disjunction spam in Round 2:**  
     - *Issue:* Teams will flood with “P OR [absurdity]” once they see the trick.  
     - *Fix:* Cap submissions at 5 per team. At debrief, say: “The OR rule felt silly? Exactly—it shows how closure forces characters to ‘know’ nonsense.”  

  2. **Contradiction found early:**  
     - *Issue:* Sharp players spot Dossier D’s contradiction in Round 1. They’ll answer “Yes” to everything, including Q10.  
     - *Fix:* Praise them publicly: “Team D nailed it—this character *does* believe everything! But would a real person?” Use to highlight explosion.  

  3. **BEL rule confusion:**  
     - *Issue:* Players balk at Q9 (e.g., “Why must they know their own beliefs?”).  
     - *Fix:* In study time, stress BEL’s artificiality. In debrief, link to real cases (e.g., characters denying their jealousy).  

  4. **Feeling “gotcha”:**  
     - *Issue:* Penalties for “can’t tell” on inferences may frustrate.  
     - *Fix:* Frame upfront: “This isn’t about you—it’s about how *logic itself* demands the absurd. Your frustration is the point.” Validate during debrief: “Did anyone feel their character ‘knew’ things they shouldn’t? That’s omniscience.”  

  5. **Time pressure skewing perception:**  
     - *Issue:* Players conflate “can’t derive in time” with “not committed.”  
     - *Fix:* Repeat scoring rules. In debrief, contrast: “In the game, time mattered for *you*—but not for your character’s commitments.”  

  ---

  ### What This Game Can’t Do & What You Must Add
  - **Can’t reproduce possible-worlds argument:** The game uses syntactic rules (inferences) instead of semantics (worlds). *You must say:* “Formal models define knowledge as ‘P is true in all worlds I consider possible.’ Since logic is true in all worlds, agents ‘know’ it—even if they haven’t thought of it. Our rules mimic this.”  
  - **Can’t justify closure’s usefulness:** *You must say:* “Closure works for bounded cases, like a mathematician proving a theorem—they *are* committed to each step. The game exaggerates to show where it breaks.”  
  - **Can’t model partial awareness:** The game treats awareness as all-or-nothing. *Clarify in debrief:* “Real people have *degrees* of awareness—like a character sensing something ‘off’ but not articulating it. Repairs like ‘awareness’ try to capture that.”  

  ### Why This Design Over Alternatives?
  I chose **competitive role-play** over lecture-based puzzles or group discussions because:  
  - **Embodied absurdity:** Novelists connect to character-driven stakes. Frustration from penalties/bounty pressure makes omniscience visceral.  
  - **Contradiction as climax:** The dossier explosion is a memorable “aha” moment for explosion.  
  - **Balanced focus:** Deductive closure, disjunction, introspection, and explosion all surface organically.  
  - **Trade-off:** We sacrifice nuance in possible-worlds semantics for emotional impact, trusting you to fill gaps in debrief.  

  ---  
  **Final Prep Tip:** Rehearse the timeline—keep questions/bounty fast-paced to sustain energy. Bring a timer, scoreboard, and the trophy. When players groan at OR spam or D’s explosion, smile: “That’s logical omniscience. Now, let’s fix it.”
