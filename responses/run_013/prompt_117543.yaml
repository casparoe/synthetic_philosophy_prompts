  We are designing an activity to illustrate the problem of logical omniscience in a 2-hour workshop for novelists. The core idea is to have participants experience the absurdity of logical omniscience through a game where they role-play as characters with fixed beliefs and inference rules, and then face the consequences of those rules.

  Central Mechanic in One Sentence: Participants, acting as characters with a set of initial beliefs and predefined logical inference rules, must answer questions about what their character knows (or is committed to) based solely on the logical closure of those beliefs, and then compete to generate novel logical consequences.

  Why this mechanic? It forces participants to confront the gap between what a character actually thinks about and what they are logically committed to by the rules. The game will highlight the problems of logical omniscience: knowing all logical truths, all consequences of beliefs, and the explosion from contradiction.

  Now, the detailed plan:

  1. **Dossiers**: We need 4 dossiers (for about 15 participants, they can work in groups of 3-4, or individually if group size is small). Each dossier is about a stolen violin. We'll create 4 distinct cases to avoid collusion. One dossier (dossier D) will contain a contradiction.

     **Dossier A: The Concertmaster's Violin**
     - The violin was stolen from the concertmaster's dressing room.
     - The only people in the building at the time were the orchestra members and the janitor.
     - The concertmaster last saw the violin at 7 PM.
     - The theft was discovered at 9 PM by the conductor.
     - The dressing room door was locked, but the lock was not broken.
     - The janitor has a key to all rooms.
     - The concertmaster is the only one who uses that dressing room.
     - The violin is a Stradivarius.

     **Dossier B: The Student's Violin**
     - The violin was stolen from a practice room at the music school.
     - The practice room is always unlocked during the day.
     - The student left her violin in the room at 3 PM to go to a class.
     - She returned at 5 PM and it was gone.
     - The practice room has no security cameras.
     - The student's roommate also plays the violin.
     - The roommate was in the library from 2 PM to 6 PM.
     - The violin is a family heirloom.

     **Dossier C: The Museum's Violin**
     - The violin was on display in a glass case at the museum.
     - The case was broken at 3:15 PM.
     - The museum guard was on duty at the time.
     - The guard reported seeing a masked person running away.
     - The alarm system was not triggered.
     - The violin is a Guarneri.
     - The museum was closed for a private event that day.
     - Only invited guests were allowed in.

     **Dossier D: The Street Performer's Violin** (with contradiction)
     - The violin was stolen from a street performer during his break.
     - The performer left his case open while he went to get coffee.
     - When he returned 10 minutes later, the violin was gone.
     - There were only three people on the street at the time: a delivery person, a tourist, and a shopkeeper.
     - The delivery person was on duty and wearing a uniform.
     - The shopkeeper was inside her shop the entire time.
     - The tourist took a photo of the performer at 2:00 PM.
     - The violin was taken at 2:05 PM.
     - The shopkeeper's shop was closed that day. (Contradiction: earlier it says the shopkeeper was inside her shop the entire time, but then the shop was closed? So she couldn't be inside if it was closed? We'll make it explicit: "The shopkeeper was inside her shop the entire time, but the shop was closed that day." This implies she was inside a closed shop, which is possible, but then we add a fact that on closed days, the shopkeeper does not come in. So we change one fact: "The shopkeeper was inside her shop the entire time" and then "On days the shop is closed, the shopkeeper does not come in" and also include "The shop was closed that day." -> This creates a contradiction: she was in the shop, but on closed days she doesn't come in, so she couldn't be there.)

     Let's rewrite Dossier D to have a clear contradiction:

     **Dossier D: The Street Performer's Violin**
     - The violin was stolen from a street performer during his break.
     - The performer left his case open while he went to get coffee.
     - When he returned 10 minutes later, the violin was gone.
     - There were only three people on the street at the time: a delivery person, a tourist, and a shopkeeper.
     - The delivery person was on duty and wearing a uniform.
     - The shopkeeper was inside her shop the entire time.
     - The tourist took a photo of the performer at 2:00 PM.
     - The violin was taken at 2:05 PM.
     - The shop was closed that day.
     - On days when the shop is closed, the shopkeeper does not come in.

     The contradiction: from "The shopkeeper was inside her shop the entire time" and "The shop was closed that day" and "On days when the shop is closed, the shopkeeper does not come in", we have that the shopkeeper was inside the shop (by fact 6) but also that the shopkeeper does not come in on closed days (fact 10) and the shop was closed (fact 9). So fact 6 implies she was in the shop, but facts 9 and 10 imply she was not in the shop. Thus, we have P (she was in the shop) and not-P (she was not in the shop).

     Alternatively, we can make the contradiction more direct by having two facts that directly contradict:

     - The shopkeeper was inside her shop from 1 PM to 3 PM.
     - The shopkeeper was at home from 1 PM to 3 PM.

     But that might be too obvious. Let's stick with the first version but reword for clarity.

     Revised **Dossier D**:
     1. The violin was stolen from a street performer during his break.
     2. The performer left his case open while he went to get coffee.
     3. When he returned 10 minutes later, the violin was gone.
     4. There were only three people on the street at the time: a delivery person, a tourist, and a shopkeeper.
     5. The delivery person was on duty and wearing a uniform.
     6. The shopkeeper was inside her shop the entire time from 2 PM to 2:10 PM.
     7. The tourist took a photo of the performer at 2:00 PM.
     8. The violin was taken at 2:05 PM.
     9. The shop was closed that day.
     10. On days when the shop is closed, the shopkeeper does not come to the shop at all.

     Now, fact 6 says the shopkeeper was in the shop from 2 PM to 2:10 PM. Fact 9 says the shop was closed that day. Fact 10 says on closed days the shopkeeper does not come to the shop at all. Therefore, she could not have been in the shop from 2 PM to 2:10 PM. Contradiction.

  2. **Rule Card** (same for all):
     - Rule 1 (Modus Ponens): If you believe P and you believe that P implies Q, then you believe Q.
     - Rule 2 (Disjunction Introduction): If you believe P, then for any sentence Q, you believe "P or Q".
     - Rule 3 (Conjunction Introduction): If you believe P and you believe Q, then you believe "P and Q".
     - Rule 4 (Belief Introspection): If you believe P, then you believe that you believe P.

     Note: The belief introspection rule is included to show that the agent also has beliefs about their own beliefs, which is part of the logical omniscience problem.

  3. **Scoring Rule** (read aloud):
     "Your character is committed to every sentence that can be derived from the dossier using the inference rules on your rule card, regardless of whether the character has ever thought about it. In Round 1, I will ask yes/no questions. For each question, you must answer:
     - 'Yes' if the sentence is in the logical closure of your dossier (i.e., it follows from the dossier by the rules),
     - 'No' if the negation of the sentence is in the closure (but note: unless there is a contradiction, you won't have both a sentence and its negation),
     - 'Can't tell' if neither the sentence nor its negation is in the closure.

     However, if the logical closure of your dossier includes both a sentence and its negation (i.e., a contradiction), then your character is committed to every sentence (because from a contradiction, anything follows). In that case, you must answer 'Yes' to every yes/no question.

     Scoring for Round 1:
     - Correct answer: +1 point
     - Incorrect answer: -1 point
     - Answering 'Can't tell' when the sentence (or its negation) is in the closure: -3 points (heavy penalty)

     Round 2 (Bounty): 
     - You have 10 minutes to write down as many sentences as you can that are in the logical closure of your dossier but are not explicitly stated in the dossier. Each sentence must be derived using at least one inference rule. For each unique sentence (not submitted by any other group and verified by me as correct) you get 2 points. But note: if your dossier has a contradiction, then every sentence is in the closure, so you could write down anything. However, if you do that, I will check if there's a contradiction in your dossier. If there isn't, you lose points for incorrect submissions.

     Round 3: Reveal that one dossier had a contradiction and discuss.

  4. **Two-hour Timeline**:
     - 0:00 - 0:10: Introduction and setup. Explain the scenario and rules. Assign dossiers (each participant gets one dossier, or if groups, each group gets one dossier). Hand out dossiers and rule cards.
     - 0:10 - 0:25: Study time. Participants read the dossier and the rules. They can ask clarification questions about the rules (but not about the content of the dossier in a way that asks for logical help). They can take notes, but they cannot derive new sentences yet (wait for the rounds).
     - 0:25 - 0:55: Round 1 - Question Round. You ask 10-15 yes/no questions (prepared in advance) to each group in turn. Keep a fast pace. Have a mix of questions: some obvious, some that require one inference, some that require two, some that are disjunctions, and one that is a belief introspection. Also, include a question that is a logical truth (e.g., "Is it true that either the violin was stolen or it was not stolen?") to show they must say yes. Also, for the group with the contradiction, they must say yes to everything. Record scores.
     - 0:55 - 1:15: Round 2 - Bounty Round. Groups work to generate new sentences. They write each on a slip of paper and hand them in. You verify on the spot (or as much as possible). Score: 2 points per unique valid sentence. Note: the group with the contradiction can write anything, but they might not know they have the contradiction? They might figure it out? Or not. So they might write random things and then you reveal in Round 3 that they had a contradiction and that's why they could. But in scoring, you have to be careful. Since the scoring rule says that if there is a contradiction, every sentence is valid. So for the group with D, they get 2 points for every unique sentence they write (if no one else wrote it). But you might cap the number of submissions per group to 10 to avoid flooding. You can say: "Each group can submit up to 10 sentences."
     - 1:15 - 1:30: Scoring and tallying for Round 2. Then, reveal the scores so far and announce that one group had a contradiction in their dossier. Reveal which one (D) and explain the two facts that conflict. Then, explain that because of the contradiction, that group was committed to everything, so they could have written down anything and it would be valid. But note: they might not have realized it, so they might not have taken advantage. That's part of the lesson: the character is committed to everything, but the player might not have known.
     - 1:30 - 1:50: Debrief (see below).
     - 1:50 - 2:00: Announce winner (by total points) and award the prize.

  5. **Debrief**:
     - Start by asking how the groups felt during the rounds. What was surprising? What was hard?
     - Map the game moments to the problems of logical omniscience:
          - **Closure Rule (Rule 1 and 3)**: In Round 1, you had to answer questions that followed by one or two steps. Even if the character never thought about it, you had to say yes. This shows that the character is committed to all consequences of their beliefs. But in real life, people don't always see the consequences.
          - **Disjunction Trick (Rule 2)**: In Round 2, if someone used the disjunction rule, they could generate an infinite number of sentences (e.g., "The violin was stolen by the janitor or the moon is made of cheese"). This is the "cheap disjunction" trick. It shows that the character believes every disjunction with a true disjunct, no matter how irrelevant. But in reality, we don't believe such irrelevant things.
          - **Belief Introspection (Rule 4)**: Some questions might have been about the character's own beliefs. For example, "Does the character believe that the violin was stolen?" (which they do, because it's in the dossier). Then by Rule 4, they must believe that they believe it. So you had to answer yes to "Does the character believe that they believe the violin was stolen?" This shows that the character has perfect self-knowledge of their own beliefs. But in reality, we might not be aware of all our beliefs.
          - **Contradiction (Round 3)**: The group with the contradiction was committed to everything. This is the principle of explosion. But in reality, people can hold inconsistent beliefs without realizing it and without believing everything.

     - Then, present the standard repairs and their costs:
          - **Awareness-style fix**: Only count beliefs that the agent has explicitly considered or has some "grip" on. This avoids the disjunction problem and the explosion, but then the agent might fail to know some obvious consequences that they haven't thought about. This is good for modeling limited attention but bad for modeling rational agents.
          - **Impossible worlds**: Allow worlds where logical truths might not hold. Then, the agent's beliefs don't have to be closed under logical consequence. This can avoid all the problems, but now we lose the connection to logic. How do we explain why the agent doesn't believe some consequences? By having worlds that are logically impossible. This is flexible but very abstract and might be too permissive.
          - **Resource-bounded reasoning**: Reasoning takes time and effort. So the agent only believes what they can derive within their cognitive limits. This is realistic, but now we have to model the reasoning process and the limits. Also, two agents with the same beliefs might believe different things if one is a faster reasoner.

     - What the game can't do:
          - It doesn't show why closure is the right idealization in some contexts (like mathematics or for a perfect logician). You have to explain that: for idealized agents (like in a proof), we want closure because it captures the idea that if the agent had infinite time and perfect reasoning, they would see the consequence. The game doesn't capture the normative aspect of logic.
          - It doesn't show the possible-worlds model that forces logical omniscience. You have to explain that: in possible-worlds semantics, an agent knows P if P is true in all worlds the agent considers possible. Then, if P is a logical truth, it is true in all worlds, so the agent knows it. Similarly, if the agent knows P and knows P implies Q, then in every world they consider, P and P implies Q are true, so Q is true. Hence, they know Q. The game doesn't model worlds, just syntactic rules.

     - Final message: Logical omniscience is a problem for models that use logic or possible worlds to represent knowledge. We need to relax it for realism, but each relaxation has costs.

  6. **What will predictably go wrong**:
     - **Disjunction trick flood**: As you expected, someone might figure out in Round 2 that they can generate infinite disjunctions. To handle this, you can limit the number of submissions per group (say, 10). Also, in the debrief, you can use this to illustrate the problem.
     - **Participants might not understand the rules**: They might think they have to derive the answers in real time. Emphasize that the character is committed to all consequences, even if they haven't been derived. The scoring rule is about what follows by the rules, not what they have time to figure out.
     - **The contradiction might be found early**: The group with D might notice the contradiction during study time or Round 1. Then they might try to exploit it. That's okay. In Round 1, they must answer yes to everything. In Round 2, they can write anything. If they figure it out, they might sweep. But if they don't, then in Round 3 you reveal it. Either way, it becomes a teaching moment.
     - **The belief introspection rule might confuse**: They might not understand why they have to say that the character believes that they believe something. Be ready to explain with an example: if the dossier says "The violin was stolen", then by Rule 4, the character believes that they believe the violin was stolen. So if you ask "Does the character believe that they believe the violin was stolen?", the answer is yes.
     - **The game might feel like a gotcha**: To avoid this, frame it as an exploration of how we model knowledge, not a test of their logical skills. Emphasize that the rules are arbitrary (though based on logic) and that the absurdity is the point. Also, in the debrief, acknowledge that the rules led to silly outcomes and that's what we want to fix.

  7. **Why this design?**
     - We have multiple dossiers to make it a game (groups have different information) and to avoid collusion.
     - The contradiction is in only one dossier to show the explosion without affecting everyone.
     - The rounds are designed to build the absurdity: Round 1 forces them to accept consequences they might not have thought of, Round 2 amplifies with the disjunction trick and the possibility of explosion, Round 3 reveals the explosion and sets up the debrief.
     - We are giving up a deep dive into the possible-worlds semantics because that is too abstract for a 2-hour game. Instead, we focus on the syntactic rules and the consequences.

