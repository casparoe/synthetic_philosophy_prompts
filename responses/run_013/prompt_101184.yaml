prompt: |-
  You are a philosopher of science with a specialism in evolutionary biology and the philosophy of the behavioural sciences. I would like you to diagnose an impasse, not adjudicate it, so please begin by thinking carefully about the structure of the disagreement before committing to any verdict; brainstorm the candidate diagnoses first, then argue for the one you find most defensible.

  For roughly four decades, evolutionary psychology has been dogged by the charge that its hypotheses about human behaviour — mate preferences, sexual jealousy, cheater detection, the allegedly modular architecture of the mind — are just-so stories. The critics and the practitioners have been talking past one another for as long as anyone can remember. The practitioners reply that their hypotheses are testable and have in fact been tested, that they generate predictions, and that cross-cultural data confirm them. The critics reply that a story which can be told about any outcome explains nothing, that the evidence is correlational or reconstructed after the fact, and that the whole programme rests on an unexamined assumption that every interesting feature of the mind is an adaptation. Nobody moves.

  My working hypothesis — which I would like you to treat as a hypothesis to be tested against what the two sides actually say, rather than as something to be confirmed — is that the phrase just-so story is doing at least three separable jobs in this dispute, and that part of the impasse is a failure to keep them apart: first, the charge that a hypothesis is untestable in principle; second, the charge that it is testable but not uniquely supported, that it is merely one explanation among several compatible with the same data; and third, the charge that even a well-supported hypothesis is not the same thing as a demonstrated history of selection, because showing that a trait currently does something useful is not showing that it was selected for. It may help to add a fourth contrast: a genuine adaptationist explanation should be reverse-engineered from the design of the trait, whereas a just-so story is forward-engineered from a problem to a convenient solution. If this diagnosis is on the right lines, the two sides may be answering different questions under a single term of abuse, and some of the apparent disagreement may be verbal. But it may equally be that a genuine methodological or even metaphysical disagreement is hiding underneath — about what a selection explanation is, about whether the notion of an environment of evolutionary adaptedness is a legitimate construct or a fiction, and about what could count as evidence for a psychological adaptation when one can neither run the experiment nor read the ancestral genome.

  Please do the following. First, reconstruct as fairly and concretely as you can what each side is actually claiming and what each takes itself to have shown, without reducing either to a caricature. Second, diagnose the impasse: is it verbal; is it a disagreement about facts, about standards of evidence, about which cases count as data, about the correct explanatory target, or about bedrock assumptions that neither side can argue for? Where a dispute that looks substantive turns out to be verbal, identify exactly which term is equivocating and how; where it turns out to be substantive, state what the real crux is. Third, and most importantly, tell me what, if anything, would count as progress given your diagnosis — a clarification, a distinction, a piece of evidence, a formal or experimental result, or a decision to stop asking one question and start asking another — and be honest if you think no progress should be expected, and why.

  Be concrete and engage the actual shape of the arguments rather than gesturing that both sides have a point. I am not asking for a literature survey, a reading list, or citations; I want the diagnosis itself, argued from the positions as you understand them. Write the whole answer in British English.
reasoning: |-
  Hmm, this is a fascinating and complex request about the evolutionary psychology debate. The user wants me to act as a philosopher of science specializing in evolutionary biology to diagnose the impasse between evolutionary psychologists and their critics regarding "just-so stories," without taking sides. 

  First, I need to unpack what each camp actually claims. Evolutionary psychologists argue they're doing rigorous science: generating testable hypotheses about psychological adaptations, making cross-cultural predictions, and confirming them empirically. They point to things like universal mate preference patterns or cheater detection mechanisms as evidence. Their critics aren't anti-evolution but object on methodological grounds - they see these as unfalsifiable narratives that retrofit explanations to observed behaviors, often relying on speculative EEA reconstructions.

  The user's hypothesis about three meanings of "just-so story" seems crucial here. Let me map that onto the debate:
  1) Untestability charge: Critics say hypotheses about ancestral adaptations can't be tested directly. Evolutionary psychologists counter with indirect testing through predictions.
  2) Non-uniqueness charge: Even if testable, critics argue multiple evolutionary accounts could fit the same data. Evolutionary psychologists claim their theories have superior predictive power.
  3) Non-historical charge: Demonstrating current function isn't proving historical selection. Evolutionary psychologists acknowledge this but see design evidence as strongly suggestive.

  There's also the fourth point about forward vs reverse engineering. Critics see evolutionary psychology as starting with problems and inventing solutions, while practitioners claim they start with observed traits and infer functions.

  The real impasse seems to be about what constitutes acceptable evidence for historical adaptations in psychology. Evolutionary psychologists accept strong inference from design plus universality as sufficient; critics demand either direct historical evidence (impossible) or elimination of all non-adaptationist explanations (extremely difficult).

  For progress, I think clarifying the burden of proof could help. If evolutionary psychologists explicitly stated they're inferring adaptations probabilistically rather than claiming proven historical origins, it might defuse some criticism. Meanwhile critics could acknowledge that testable predictions from adaptationist hypotheses do have scientific value even without direct historical evidence. But the metaphysical divide about what counts as "explanation" may persist - is it about origins or current function?

  The user clearly knows this literature well and wants nuanced analysis, not platitudes. They're after diagnostic precision - exactly where the disagreements lie and whether they're resolvable. I should avoid taking sides while being concrete about the arguments. British English phrasing will require attention to spellings and some terminology choices.
answer: |-
  ## Diagnosing the Impasse in the Evolutionary Psychology "Just-So Story" Debate

  **Reconstructing the Positions Concretely:**

  *   **Evolutionary Psychologists (EP Practitioners):**
      *   **Core Claim:** The human mind contains numerous domain-specific psychological adaptations – "modules" – sculpted by natural and sexual selection to solve specific adaptive problems recurrent in our "Environment of Evolutionary Adaptedness" (EEA). These adaptations explain universal patterns in human cognition and behaviour (e.g., mate preferences favouring cues to fertility/genetic quality, mechanisms for detecting social cheaters, sexual jealousy differing by sex due to paternity uncertainty).
      *   **What They Take Themselves to Have Shown:** They argue they generate specific, *testable predictions* derived from adaptationist logic. These predictions are tested empirically, often cross-culturally, seeking universality as evidence for adaptation (e.g., men universally value youth/attractiveness more than women do; women universally value resources/status more than men do; people are better at detecting violations of social exchange rules than logically identical abstract rules). They see converging lines of evidence (universality, functional design, specificity) as strongly supporting their hypotheses as the *best current adaptationist explanations*. They use the EEA as a heuristic framework to generate predictions, not as a rigidly defined historical snapshot.

  *   **Critics (of EP's Adaptationist Programme):**
      *   **Core Claim:** EP's explanations for psychological traits as specific adaptations are often unfalsifiable "just-so stories". They are post-hoc narratives that can be constructed to fit almost any observed behaviour by inventing plausible adaptive functions and EEA scenarios. Crucially, demonstrating a trait's *current* function or benefit does not demonstrate it was *selected for* that function.
      *   **What They Take Themselves to Have Shown:** They argue that:
          1.  EP hypotheses frequently lack genuine predictive novelty; evidence is often correlational, open to alternative explanations (e.g., cultural transmission, by-products of general learning, exaptations), or interpreted after the fact.
          2.  The EEE is often invoked speculatively, making hypotheses untestable *in practice* (you can't rerun evolution with different parameters).
          3.  EP relies heavily on an unexamined "adaptationist programme" – a prior assumption that complex traits *must* be direct adaptations, neglecting non-adaptive evolutionary processes (genetic drift, pleiotropy, spandrels) and non-evolutionary explanations.
          4.  Showing cross-cultural universality shows *something* is innate/developmentally robust, but not *why* it evolved (e.g., jealousy might be a by-product of attachment, not a specific adaptation for paternity certainty).

  **Diagnosing the Impasse:**

  Your hypothesis about the multifaceted nature of "just-so story" is astute and central. The impasse is **not merely verbal, but a deep entanglement of methodological, epistemological, and metaphysical disagreements**, amplified by equivocation on "just-so story". Let's dissect it:

  1.  **The Three Charges of "Just-So Story" (Your Hypothesis Confirmed):**
      *   **Charge 1 (Untestability in Principle):** Critics accuse EP of proposing hypotheses about the *unobservable past* (specific selective pressures in the EEA) that are inherently unfalsifiable. EP counters that their hypotheses generate *testable predictions about present behaviour* (universality, specific response patterns, reaction norms). **Verdict:** This charge is often overstated by critics. While *direct* historical tests are impossible, indirect tests via predictions about current design are a valid scientific approach (e.g., inferring past predation from anti-predator morphology). The disagreement here is less about absolute untestability and more about the *strength of inference* possible from indirect evidence.
      *   **Charge 2 (Non-Uniqueness/Underdetermination):** Critics argue that even if EP hypotheses make testable predictions, the evidence rarely uniquely supports *their specific adaptationist narrative* over plausible alternatives (cultural, by-product, different adaptive functions). EP counters that their hypotheses often generate *novel, counter-intuitive predictions* confirmed cross-culturally, making alternatives less plausible. **Verdict:** This is a core **methodological disagreement about standards of evidence and burden of proof.** Critics demand EP rigorously rule out alternatives or demonstrate predictive superiority *beyond correlation and universality*. EP believes converging lines of evidence (design, specificity, universality) strongly favour their adaptationist explanation over vague alternatives. The disagreement hinges on **what constitutes sufficient evidence to warrant an adaptationist inference in psychology.**
      *   **Charge 3 (Current Function ≠ Selection History):** Critics insist that demonstrating a trait is currently beneficial or functional does not prove it was *shaped by selection for that function*. It could be an exaptation, a spandrel, or have evolved for a different reason. EP counters that evidence of *complex, domain-specific functional design* is the hallmark of adaptation and strongly implies selection history. **Verdict:** This is a fundamental **epistemological and metaphysical disagreement about the nature of evolutionary explanation.** Critics adhere to a stricter historical definition of adaptation (requiring evidence of *past* selective causation). EP employs a design-based inference to the *best adaptive explanation* for the trait's existence and structure, seeing complex functional design as *de facto* evidence of selection history. The crux is **whether complex functional design is sufficient evidence for past selection *for* that function in the absence of direct historical data.**

  2.  **The Fourth Charge (Forward vs. Reverse Engineering):** Critics accuse EP of "forward-engineering": starting with a modern problem (e.g., mate choice), imagining an ancestral problem, and inventing a convenient module as the solution. They argue true adaptationism should "reverse-engineer": start with a detailed understanding of the psychological trait's structure and then infer its function. **Verdict:** This highlights a **methodological disagreement about heuristic practice.** While EP *aims* for reverse engineering (e.g., cheater detection module inferred from specific performance dissociations), critics see many studies starting from adaptive problems. The disagreement is over **how rigorously EP adheres to design-first inference in practice versus problem-first storytelling.**

  3.  **The Bedrock Disagreements:**
      *   **The EEA's Legitimacy:** Critics see the EEA as a dangerously vague fiction allowing endless post-hoc storytelling. EP sees it as a necessary, testable heuristic framework based on paleoanthropology, ethnography, and behavioural ecology. **Crux:** Is the EEA a legitimate scientific construct or an unfalsifiable narrative device?
      *   **The Ubiquity of Adaptation:** Critics argue EP assumes adaptationism is the default, neglecting other evolutionary forces. EP argues complex functional design *demands* an adaptationist explanation as the primary null hypothesis. **Crux:** What is the appropriate null hypothesis for complex psychological traits? Adaptation, by-product, or something else?
      *   **What Counts as Evidence for a Psychological Adaptation?** This is the ultimate impasse. EP relies on triangulation: universality (implies innate basis), functional design (implies adaptation), domain-specificity (implies specialised module). Critics argue this is insufficient: universality doesn't prove *why* it's innate; functional design doesn't prove *historical* selection for that function; domain-specificity can be debated and doesn't rule out learning or general mechanisms. **Crux:** What evidentiary threshold must be met to accept a hypothesis about a psychological adaptation, given the inherent constraints of studying the unobservable past?

  **What Counts as Progress?**

  Genuine progress requires addressing the substantive disagreements, not just clarifying terms. Based on the diagnosis:

  1.  **Refining Adaptationist Standards:** Progress would involve EP practitioners explicitly adopting and rigorously applying stricter criteria for inferring adaptations *in psychology*, moving beyond mere functionality and universality. This includes:
      *   **Stronger Tests of Alternatives:** Actively designing experiments and analyses to *disconfirm* leading non-adaptationist explanations (e.g., cultural transmission models, by-product hypotheses, general learning mechanisms) for the specific trait in question, not just stating they are implausible.
      *   **Demonstrating "Special Design":** Focusing research on finding evidence of complex, costly, or otherwise improbable features of the trait that are *specifically* predicted by the adaptationist hypothesis and hard to explain otherwise (e.g., specific cognitive biases or performance patterns predicted *only* by a cheater detection module).
      *   **Acknowledging Gradients:** Recognising that "adaptation" isn't binary. Progress could involve developing clearer frameworks for assessing the *relative strength* of evidence for adaptation vs. exaptation/spandrel for a given trait, based on design evidence and phylogenetic/comparative data where possible.

  2.  **Clarifying Explanatory Targets and Certainty:** Progress would involve EP explicitly distinguishing between:
      *   Demonstrating a trait is an evolved, developmentally robust feature (supported by universality).
      *   Demonstrating a trait's *current* adaptive function (supported by design evidence).
      *   Demonstrating its *historical selective origin* for that function (much harder, requiring design evidence plus evidence against exaptation/spandrel, potentially phylogenetic evidence). EP could more consistently frame conclusions as "the best *current* adaptationist explanation" rather than implying proven historical origin.

  3.  **Empirical Progress on Specific Cases:** Progress would occur if specific, high-profile EP hypotheses were subjected to tests capable of yielding decisive results *by the standards of both sides*. For example:
      *   Finding evidence of "special design" for a proposed module that is genuinely difficult for non-adaptationist models to explain.
      *   Discovering a validated genetic or neurological marker strongly linked to a proposed adaptation and its specific function.
      *   Identifying cases where a universal trait demonstrably *lacks* complex functional design or where its design better fits a non-adaptationist explanation.
      *   Using emerging techniques (e.g., ancient DNA informing population history, sophisticated modelling of cultural evolution) to constrain plausible EEA scenarios or test gene-culture coevolution models that compete with pure adaptationist explanations.

  4.  **Reconciling the EEA:** Progress could involve developing more empirically grounded, testable models of the EEA for specific domains (e.g., social structure, predator threats, dietary challenges) based on converging evidence from paleoecology, archaeology, genetics, and hunter-gatherer studies, moving beyond vague generalities.

  **Prognosis:**

  Significant progress *is* possible, but it requires effort from both sides. EP needs to embrace more stringent methodological standards and acknowledge the limitations of inferring deep history. Critics need to recognise that testable predictions derived from adaptationist hypotheses *are* scientifically valuable, even if they don't constitute absolute proof of historical selection, and engage constructively with the strongest versions of EP arguments and evidence. The impasse stems from fundamental differences in what constitutes acceptable evidence for historical evolutionary claims in psychology. Bridging it won't yield a single "winner," but fostering a more nuanced conversation focused on specific hypotheses, refined methodologies, and clearer standards of evidence would constitute genuine progress. Expecting the core metaphysical differences about the nature of adaptation and explanation to vanish is unrealistic, but their impact can be mitigated by methodological rigour and clearer communication. The debate shouldn't stop, but it needs to evolve beyond mutual caricature.
