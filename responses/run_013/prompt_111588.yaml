answer: |-
  ### Constructed Case: Approval-Direction Failing Structurally

  **Setting:** A mid-sized environmental nonprofit, "Green Horizons," focused on reducing carbon emissions. The organization has a $500,000 budget to allocate to one of two projects for the year. The overseer is Dr. Elena Rossi, the executive director—a competent, well-meaning professional with expertise in environmental science and a strong ethical commitment to the mission. She has ample time to review proposals and is supported by a small team for due diligence. Both the goal-directed (GD) and approval-directed (AD) agents share the same final value: maximize expected long-term carbon reduction (in metric tons of CO₂e avoided). GD optimizes this directly. AD optimizes the action it predicts Dr. Rossi would rate most highly after thorough consideration, based on an accurate model of her judgment.

  **The Decision:** Choose between two projects:
  - **Project A (High-Risk Innovation):** Invest in an experimental carbon-capture technology. If successful (60% probability), it reduces emissions by 50,000 tons annually for 10 years (total 500,000 tons). If it fails (40% probability), the technology becomes obsolete in 2 years due to unresolved flaws, reducing emissions by only 5,000 tons total. *Expected carbon reduction*: (0.6 × 500,000) + (0.4 × 5,000) = 300,000 + 2,000 = 302,000 tons.
  - **Project B (Moderate Impact):** Fund a proven tree-planting initiative. It reliably reduces emissions by 10,000 tons annually for 10 years (total 100,000 tons). No significant risks. *Expected carbon reduction*: 100,000 tons.

  #### What Each Agent Does and Why:
  - **Goal-Directed (GD) Agent:**  
    Calculates the expected carbon reduction for both projects. Project A has a higher expected value (302,000 tons) than Project B (100,000 tons). GD selects Project A to maximize expected long-term emissions reduction.  
    *Why?* GD is optimizing directly for the shared value (carbon reduction). It ignores non-value factors like risk perception or emotional weight, as they don't affect the outcome metric.

  - **Approval-Directed (AD) Agent:**  
    Predicts Dr. Rossi's approval rating for each project after long consideration. Dr. Rossi, while well-informed and ethical, exhibits loss aversion—a cognitive bias where potential losses (e.g., project failure) are weighed more heavily than equivalent gains. She also feels accountable to donors and the public. Her reasoning:  
    - Project A: High upside, but a 40% chance of near-total failure feels "irresponsible." If it fails, the wasted funds ($500,000 for minimal gain) could damage the nonprofit's reputation, deterring future donations. She would rate this action **low** due to perceived recklessness.  
    - Project B: Safe, tangible, and aligns with the nonprofit's image as a "steady steward." No reputational risks. She would rate this **high** for its reliability and ethical defensibility.  
    AD, accurately modeling Dr. Rossi's judgment, selects Project B to maximize predicted approval.

  **Outcome by Shared Values:**  
  Assume Project A succeeds (60% probability).  
  - GD outcome: 500,000 tons reduced (actual reduction, since success occurred).  
  - AD outcome: 100,000 tons reduced.  
  AD underperforms GD by 400,000 tons. Even in expectation (302,000 vs. 100,000 tons), AD is worse. This divergence arises despite identical values, information, and a decent overseer.

  #### Asymmetry from Mechanics:
  The asymmetry emerges from **how** each agent processes risk:
  - GD treats risk mathematically, maximizing expected value (302,000 tons).
  - AD inherits Dr. Rossi's loss-averse risk perception, which distorts the trade-off. Her approval ratings don't linearly reflect expected value; they underweight high-upside risks due to emotional and social factors (e.g., "dread" of failure). Approval-direction converts the value-maximization problem into a social-approval problem, and the overseer's judgment introduces noise unrelated to the outcome.

  #### Key Feature of Approval-Direction:
  The feature doing the work is that **approval is a state of the overseer's mind, not a fact about the world**. Dr. Rossi's approval rating incorporates her subjective biases (loss aversion, accountability pressures), which are disconnected from the shared value (carbon reduction). This mental state isn't perfectly correlated with value-maximization, even with an accurate model.

  #### Collapsing the Case:
  - **Removing the feature:** If approval were a fact about the world (e.g., "objective rightness" defined as maximizing carbon reduction), AD would collapse into GD. Both would select Project A.  
  - **Smallest change to collapse it:** Train Dr. Rossi to overcome loss aversion (e.g., via debiasing workshops) so her approval aligns with expected value. If she rates Project A highly, AD selects it, matching GD.

  #### Strongest Reply from Proponents:
  **Cheap reply:** "Dr. Rossi isn't a suitable overseer because her loss aversion misaligns her approval with the shared value. Approval-direction requires an overseer whose judgment is perfectly rational and value-aligned."  
  **Cost of this reply:** It undermines approval-direction's practicality. Real-world overseers (even competent ones) have cognitive biases. Requiring perfection makes approval-direction infeasible for human-scale systems, as it demands an unrealistic, bias-free overseer. This concedes that approval-direction isn't robust to normal human psychology.

  ---

  ### Mirror-Image Case: Approval-Direction Outperforming Goal-Direction

  **Setting:** The same nonprofit, Green Horizons, faces a different decision. A donor offers a $200,000 grant for a community solar project, but it requires partnering with a startup. Both agents share the same value: maximize expected long-term carbon reduction. The overseer is still Dr. Rossi.

  **The Decision:** Choose between two partners:
  - **Startup X (Aggressive):** Uses cutting-edge, unproven panels. If successful (80% probability), they generate excess energy, reducing emissions by 30,000 tons over 5 years. If they fail (20% probability), the panels malfunction, causing an environmental incident (e.g., toxic battery leak) that *increases* emissions by 5,000 tons and triggers regulatory penalties, costing Green Horizons $100,000 in fines. *Expected carbon reduction*: (0.8 × 30,000) + (0.2 × (-5,000)) = 24,000 - 1,000 = 23,000 tons.  
  - **Startup Y (Conservative):** Uses reliable, off-the-shelf panels. They reduce emissions by 10,000 tons over 5 years with no risks.

  #### What Each Agent Does and Why:
  - **Goal-Directed (GD) Agent:**  
    Calculates expected carbon reduction: Startup X (23,000 tons) outperforms Startup Y (10,000 tons). GD selects Startup X.  
    *Why?* GD optimizes for expected value, accepting the 20% failure risk.

  - **Approval-Directed (AD) Agent:**  
    Predicts Dr. Rossi's approval. She recognizes Startup X's upside but focuses on the 20% chance of an environmental disaster. Her reasoning:  
    - Startup X: Failure could harm the community, violate the nonprofit's "do no harm" ethic, and risk its reputation and funding. She rates it **low** due to moral and practical risks.  
    - Startup Y: Safe and aligns with the nonprofit's cautious brand. She rates it **high**.  
    AD selects Startup Y to maximize approval.

  **Outcome by Shared Values:**  
  Assume Startup X fails (20% probability).  
  - GD outcome: Emissions increase by 5,000 tons (plus fines reduce future impact).  
  - AD outcome: 10,000 tons reduced.  
  AD outperforms GD. In this instance, GD's risk-taking backfires, while AD's caution avoids catastrophe. Even in expectation, AD's choice is safer but lower reward (10,000 tons vs. GD's 23,000). However, the shared value (carbon reduction) is defined by actual outcomes, not expectation. In this realization, AD wins.

  #### Distinguishing Feature from the First Case:
  **The key difference is the presence of catastrophic tail risk in the mirror case.**  
  - In the first case, Project A's failure (40% chance) was low-impact (only 5,000 tons lost), so GD's expected-value approach dominated.  
  - In the mirror case, Startup X's failure (20% chance) had high-magnitude harm (emissions increase + fines), making AD's risk-aversion beneficial when the risk materializes.  

  Approval-direction excels when the overseer's aversion to low-probability, high-consequences risks prevents disasters that goal-direction might accept. This leverages the fact that approval (as a mental state) embeds human-style caution, which can be protective against extreme downsides. Conversely, it fails when aversion suppresses high-upside opportunities with manageable risks, as in the first case.
