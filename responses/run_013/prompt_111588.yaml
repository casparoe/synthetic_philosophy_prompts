  Now, the goal-directed agent (GD) will choose Option B because it maximizes the expected value of the shared goal (maximizing educational outcomes).

  What about the approval-directed agent (AD)? It must choose the action that it predicts Dr. Smith (the overseer) would rate most highly after long consideration.

  We assume Dr. Smith is a competent, well-meaning adult who cares about the mission. However, she is also human and subject to cognitive biases. Specifically, she is loss-averse: she dislikes losses more than she likes gains of the same magnitude. Moreover, she is accountable to the board and the donors. If the grant fails, she might have to explain why $1,000 was "wasted" on a failed grant writer instead of buying textbooks.

  After long reflection, Dr. Smith would rate the actions as follows:

  - Option A: Safe, tangible, and immediately impactful. She can report that 200 children received textbooks. This is a solid result.

  - Option B: Risky. If the grant fails, she has to explain why only 180 children got textbooks and why $1,000 was spent on nothing. Even though the expected value is higher, the possibility of a loss looms large in her mind. She would feel responsible for the loss and fear criticism.

  Therefore, Dr. Smith would rate Option A more highly than Option B. She would approve more of the safe, tangible action.

  The AD agent, accurately predicting this, chooses Option A.

