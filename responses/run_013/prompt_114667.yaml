prompt: |-
  Since iterated elimination of dominated strategies is basically the whole toolkit I remember from my game theory unit, and it's sold as the way you figure out what a rational player will do, I've never understood why anyone still bothers with all the Nash equilibrium machinery on top of it. Surely Nash is just where the elimination process bottoms out? Here's the thing that's actually bugging me though. My study group got into it because of a weird case where someone said a strategy can be "dominated by a mixed strategy" even though no single pure strategy beats it, and that this is the whole reason the textbook insists on mixed strategies when you're deleting dominated rows. I think I nodded along at the time, but now I can't reconstruct why that isn't just a technicality — if a pure strategy is worse than some lottery over your other pure strategies, isn't that the same as it being a bad strategy that we throw out anyway? And once we've thrown out all the bad ones, don't we just read off the answer?

  I guess what I want is for you to untangle what's actually going on with "eliminate the dominated strategies" as a slogan for how to play a game. Like, what are the different precise things that instruction could mean — dominated by what, deleted in what order, believed rational by whom — and for each reading, does it actually deliver a unique prediction about what gets played, or does it just shrink the game and leave you guessing? And specifically, does the mixed-strategy version buy you a *unique* answer that plain pure-strategy elimination doesn't, or is it only doing something subtler, like making the deletion procedure well-behaved? If it turns out mixed-strategy dominance is mostly about which strategies count as "dominated" rather than about pinning down play, I'd love to know that, because my study group is treating it like it cracks the game wide open and I suspect we've mixed up "rules out some strategies" with "tells you what to do."
