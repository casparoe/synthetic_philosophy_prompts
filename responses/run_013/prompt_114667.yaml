answer: |-
  You've hit on a beautifully subtle and important point in game theory! Your intuition is sharp, and your skepticism is warranted. Let's untangle the relationship between iterated elimination of dominated strategies (IEDS) and Nash equilibrium (NE), and why "mixed-strategy dominance" isn't just a technicality but fundamentally changes the predictions we can make. The key is understanding **what gets eliminated, when, and why**.

  **Core Distinction: What "Dominated" Means & What Eliminates It**

  1.  **Pure-Strict Dominance (PSD):** Strategy `s_i` is *strictly dominated* by another **pure** strategy `s_i'` if, for *every* possible combination of strategies the opponents could play, `s_i'` gives player `i` a **strictly higher payoff** than `s_i`.
      *   **Elimination Power:** Weakest. Only obviously terrible strategies are eliminated (ones always worse than a specific alternative).
      *   **Prediction Power:** Often leaves many strategies (and multiple NE) remaining.
      *   **"Believed Rational":** Players believe opponents won't play strategies dominated *by pure strategies*. They don't form beliefs about *probabilities* over opponents' strategies yet.

  2.  **Pure-Weak Dominance (PWD):** Strategy `s_i` is *weakly dominated* by another **pure** strategy `s_i'` if, for *every* possible combination of opponents' strategies, `s_i'` gives player `i` a payoff **at least as high** as `s_i`, and for **at least one** combination, it gives a **strictly higher** payoff.
      *   **Elimination Power:** Slightly stronger than strict (eliminates more strategies), but introduces problems.
      *   **Problem:** Order dependence! The sequence in which you eliminate weakly dominated strategies can lead to different final sets. Rationality arguments become murkier ("Why eliminate *this* weakly dominated strategy *first*?").
      *   **"Believed Rational":** Similar to PSD, but the justification for elimination is weaker since the dominated strategy isn't *always* worse.

  3.  **Mixed-Strict Dominance (MSD):** Strategy `s_i` is *strictly dominated* by a **mixed strategy** `σ_i` (a probability distribution over player `i`'s other pure strategies) if, for *every* possible combination of strategies the opponents could play, the **expected payoff** from playing `σ_i` is **strictly higher** than the payoff from playing `s_i`.
      *   **Elimination Power:** **Significantly Stronger** than pure dominance (PSD or PWD). This is the crux.
      *   **Why?** A mixed strategy `σ_i` creates a *new* "action" that player `i` can effectively take by randomizing. If this new "action" *always* beats `s_i`, regardless of what opponents do, then `s_i` is irrational to play. Even if no *single* pure strategy dominates `s_i`, a clever *mix* of other strategies might.
      *   **"Believed Rational":** Players believe opponents won't play strategies dominated *by any mixed strategy* (i.e., strategies that are bad responses *no matter what beliefs the player holds about opponents' play*). This is a **much stronger rationality requirement**. It implies players consider *all possible probabilistic beliefs* about opponents when evaluating their own strategies.

  **Why Mixed-Strict Dominance (MSD) is NOT Just a Technicality: An Example**

  Consider this simple 3x3 game (Player 1: Rows, Player 2: Columns):

  ```
              Player 2
              L     C     R
          ------------------
      Player T | 1,1 | 0,3 | 0,0
          1 M | 3,0 | 0,0 | 3,3
            B | 0,0 | 3,3 | 0,0
  ```

  *   **Pure-Strict Dominance (PSD) Analysis:**
      *   Look at Player 1 (Rows):
          *   Is T dominated? Compare T vs M: If P2 plays L, M(3) > T(1). If P2 plays C, T(0) = M(0). If P2 plays R, T(0) < M(3). T is not strictly dominated by M (it's worse against R, equal against C). T vs B: Similar issues. M is not dominated by T or B. B is not dominated by T or M. **No pure strategy for P1 is strictly dominated by another pure strategy.**
      *   Look at Player 2 (Columns):
          *   Is L dominated? Compare L vs C: If P1 plays T, C(3) > L(1). If P1 plays M, L(0) = C(0). If P1 plays B, L(0) < C(3). Not strictly dominated. Similar checks show no column is strictly dominated by another. **No pure strategy for P2 is strictly dominated by another pure strategy.**
      *   **Result of Iterated PSD:** **Nothing is eliminated!** The game remains 3x3. The pure-strategy Nash equilibria are (T, C), (M, R), and (B, C). PSD doesn't rule any of them out.

  *   **Mixed-Strict Dominance (MSD) Analysis:**
      *   Focus on Player 1. Can we find a mixed strategy that strictly dominates one of P1's pure strategies?
      *   **Consider strategy T for Player 1.** Is there a mixed strategy over {M, B} that *always* beats T?
          *   Let `σ_1 = p*M + (1-p)*B` (probability `p` on M, `1-p` on B).
          *   Expected payoff of `σ_1` vs. L: `p*3 + (1-p)*0 = 3p`
          *   Expected payoff of `σ_1` vs. C: `p*0 + (1-p)*3 = 3(1-p)`
          *   Expected payoff of `σ_1` vs. R: `p*3 + (1-p)*0 = 3p`
          *   Payoff of T vs. L: 1, vs. C: 0, vs. R: 0.
          *   We need `σ_1` to beat T against *every* column: `3p > 1` (vs L), `3(1-p) > 0` (vs C), `3p > 0` (vs R).
          *   `3(1-p) > 0` is always true for `p < 1`. `3p > 0` is always true for `p > 0`. The binding constraint is `3p > 1`, which requires `p > 1/3`.
          *   **Conclusion:** Any mixed strategy `σ_1` with `p > 1/3` (e.g., `p = 0.4`, `σ_1 = 0.4M + 0.6B`) yields a **strictly higher payoff** than T *no matter what Player 2 does* (3p > 1, 3(1-p) > 0, 3p > 0). **Therefore, T is strictly dominated by the mixed strategy `σ_1`.** We can eliminate row T.
      *   **Now the game reduces to:**
          ```
                  L     C     R
              ---------------
            M | 3,0 | 0,0 | 3,3
            B | 0,0 | 3,3 | 0,0
          ```
      *   **Now apply PSD (or MSD) in the reduced game:**
          *   Player 2: Look at Column L. Payoffs: 0 (vs M), 0 (vs B). Compare to C: 0, 3. Compare to R: 3, 0.
              *   L is strictly dominated by R (0<3, 0<0? Wait, 0=0 vs B... not strict). L is strictly dominated by C? vs M: 0=0, vs B: 0<3 -> not strict. Is L weakly dominated? Yes, by both C and R (it never gives more, and gives less sometimes).
          *   **If we allow weak dominance (order matters!):** Suppose we eliminate L first (weakly dominated by R). Game becomes:
              ```
                      C     R
                  ------------
                M | 0,0 | 3,3
                B | 3,3 | 0,0
              ```
              *   Now Player 1: M vs B? Depends on P2. Player 2: C vs R? Depends on P1. Two pure NE: (M, R) and (B, C). MSD eliminated T, but didn't deliver a unique answer. *However, it significantly shrunk the game and ruled out the (T, C) equilibrium.*
          *   **MSD in the 2x3 game?** Player 1: Is M dominated by B? No (B worse if P2 plays R). B dominated by M? No (M worse if P2 plays C). Player 2: Column L is strictly dominated by the mixed strategy `σ_2 = 0.5C + 0.5R`? Expected Payoff vs M: 0.5*0 + 0.5*3 = 1.5 > 0 (L's payoff). Vs B: 0.5*3 + 0.5*0 = 1.5 > 0 (L's payoff). **Yes! L is strictly dominated by the mixed strategy `0.5C + 0.5R`.** Eliminate L, leaving the 2x2 game above. We still have two NE.

  **The "So What?" - Untangling Your Questions**

  1.  **"Does mixed-strategy dominance buy a *unique* answer that pure doesn't?"**
      *   **Not necessarily for the final play prediction.** As the example shows, even after IEDS using mixed-strict dominance, multiple Nash equilibria can remain (like (M, R) and (B, C)). MSD-IEDS shrinks the game, potentially ruling out *some* equilibria (like (T, C)), but doesn't guarantee a unique survivor.
      *   **However, it *does* buy significantly more elimination power.** It rules out strategies (like T) that rational players would *never* play, even though no single pure strategy dominated them. This makes the prediction "Players will not play T" much stronger and more robust. PSD couldn't rule out T at all. MSD can. This is **fundamental**, not just a technicality. A player choosing T is making a clear mistake a rational player would avoid.

  2.  **"Is mixed-strategy dominance mostly about which strategies count as 'dominated' rather than pinning down play?"**
      *   **Exactly right!** This is the crucial insight. MSD (especially strict) is a powerful tool for **identifying strategies that no rational player should ever play**, under the strong rationality assumption that players consider *all possible beliefs* (probability distributions) over opponents' strategies. It's about **ruling out the irrational**. It doesn't, by itself, tell you *which* rational strategy will be played if multiple survive elimination. Its primary value is in **shrinking the game** dramatically and ruling out implausible Nash equilibria (like (T, C) in the example).
      *   Your suspicion that your study group is conflating "rules out some strategies" with "tells you what to do" is likely correct. MSD-IEDS is a refinement process. Nash equilibrium is a solution concept for the refined game.

  3.  **"Why Nash Equilibrium on top of IEDS?"**
      *   **IEDS (especially MSD) identifies what *won't* be played. NE identifies stable points *among the surviving strategies* where no player regrets their choice given the others' choices.** IEDS bottoms out at a set of strategies. NE tells us which profiles within that set are self-enforcing predictions of play. Sometimes IEDS leaves one strategy per player (the game is "dominance solvable"), and that profile *is* the unique NE. Often, it leaves a smaller game with multiple NE, and we need other refinements (focal points, risk dominance, etc.) or context to predict which one gets played.

  4.  **"Does IEDS deliver a unique prediction?"**
      *   **Depends on the dominance concept and the game:**
          *   **PSD-IEDS:** Often leaves large sets/multiple NE. Prediction weak.
          *   **PWD-IEDS:** Can be powerful but suffers from order dependence. The "unique" prediction depends on the elimination order, which lacks a strong justification. Prediction unreliable.
          *   **MSD-IEDS (Strict):** Strongest elimination power. Minimizes order dependence problems (strategies strictly dominated *never* become undominated). Often shrinks the game significantly. **If** it eliminates all but one strategy per player, you get a unique, compelling prediction. **If not**, it leaves a smaller game where NE or other concepts take over. The prediction is "Play will be in this smaller set" and potentially "It will be one of these NE within the set".

  **Conclusion: Untangling the Slogan**

  *   **"Eliminate dominated strategies"** is ambiguous! You must specify:
      *   **Dominated by what?** Pure strategies? Mixed strategies? Strictly or weakly?
      *   **Deleted in what order?** Especially critical for weak dominance.
      *   **Believed rational by whom?** Do players only rule out opponents playing pure-dominated strategies, or also mixed-dominated ones? (The latter implies much stronger/sophisticated rationality).
  *   **Mixed-Strict Dominance is crucial** because it dramatically expands the set of strategies we can identify as irrational ("dominated") beyond what pure dominance can see. A strategy dominated only by a mixed strategy is a genuinely bad choice a rational player would avoid, even if it's not obviously worse than any single alternative. This makes IEDS using MSD a much more powerful refinement tool.
  *   **However, MSD-IEDS is still primarily a tool for eliminating possibilities ("what won't happen")**, not necessarily for pinpointing a single outcome ("what will happen"). It shrinks the game, making the remaining analysis (often finding NE within the smaller set) more manageable and ruling out implausible equilibria. It doesn't guarantee a unique answer, but it gets you much closer than pure dominance alone.
  *   **Nash Equilibrium remains essential** because it defines stability *within* the set of strategies that survive rational elimination (like MSD-IEDS). IEDS tells us where rational play *won't* be; NE tells us where, within the remaining possibilities, play *could* stably rest.

  In short: Mixed strategies aren't primarily about predicting *how* people randomize (though they do that too). In dominance, they are a **tool for identifying irrationality** much more effectively. They make "eliminate dominated strategies" a far more powerful instruction for refining games and understanding rational play, even if they don't always crack the game wide open to a unique solution. Your study group is right about its importance for elimination, but likely overstating its power to directly predict the final play outcome in all cases.
