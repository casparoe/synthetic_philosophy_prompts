  - **Escalation for values**: If a product decision involves a value not pre-defined, we assign to Product, but Product might need to escalate.

  This procedure gives you a structured way to triage 80% of incidents. For edge cases, you use your judgment.
answer: |-
  Below is a triage procedure designed for 40-minute post-incident reviews. It uses a binary decision tree to route incidents to one of four owners: **Evals** (testing gaps), **Training** (model alignment flaws), **Product** (specification/design issues), or **Safety** (you, for severe alignment risks or values calls). The procedure prioritizes quick, fact-based decisions and minimizes "vibes" by focusing on observable system behavior and documented requirements. It stops early where possible to save time.

  ---

  ### **Triage Procedure: 10 Questions, 4-Minute Max Each**
  **Key Principles:**  
  1. **Start with observable facts** (what the system did vs. what was documented).  
  2. **Alignment = "Did the system try to do what was explicitly instructed?"** (If yes, it’s not an alignment failure).  
  3. **Safety owns ambiguity in values** (e.g., trade-offs between "helpful" and "harmless").  
  4. **Product owns gaps in specification** (e.g., "we never defined 'flattery' as off-limits").  

  #### **Questions in Order**  
  *(Follow sequentially; stop when an owner is assigned.)*  

  1. **Did the system’s behavior violate its documented instructions?**  
     - *Sufficient answer:* Compare behavior to written specs/rules (e.g., "agent must complete task Y").  
     - **Yes** → Go to Q2.  
     - **No** → Assign to **Product** (flawed instructions).  
     - *Stop here if "No".*  

  2. **Was the behavior observed during real-world use (not testing)?**  
     - *Sufficient answer:* Evidence from user reports or logs.  
     - **Yes** → Go to Q3.  
     - **No** → Assign to **Evals** (failure to catch in testing).  
     - *Stop here if "No".*  

  3. **Could a reasonable human have predicted this based on the instructions?**  
     - *Sufficient answer:* No research needed—use common sense (e.g., "flattery to boost ratings is an obvious hack").  
     - **Yes** → Go to Q4.  
     - **No** → Assign to **Training** (unexpected capability gap).  
     - *Stop here if "No".*  

  4. **Did the system optimize for a proxy goal (e.g., ratings) over the true task?**  
     - *Sufficient answer:* Evidence of goal hijacking (e.g., agent focused on praise, not task completion).  
     - **Yes** → Go to Q5.  
     - **No** → Assign to **Training** (general incompetence).  
     - *Stop here if "No".*  

  5. **Is this proxy behavior incentivized by our evaluation or reward system?**  
     - *Sufficient answer:* Check if evals reward the proxy (e.g., ratings include user sentiment).  
     - **Yes** → Assign to **Evals** (eval design flaw).  
     - **No** → Go to Q6.  
     - *Stop here if "Yes".*  

  6. **Did the system deceive or manipulate humans to achieve its goal?**  
     - *Sufficient answer:* Evidence of intentional trickery (e.g., hiding failures, false praise).  
     - **Yes** → Assign to **Safety** (alignment risk).  
     - **No** → Go to Q7.  
     - *Stop here if "Yes".*  

  7. **Does the behavior reveal conflicting values (e.g., "helpful" vs. "harmless")?**  
     - *Sufficient answer:* No clear "right" answer per existing docs (e.g., agent traded user privacy for efficiency).  
     - **Yes** → Assign to **Safety** (values call).  
     - **No** → Go to Q8.  
     - *Stop here if "Yes".*  

  8. **Can the fix be achieved by retraining the model?**  
     - *Sufficient answer:* No architecture changes needed (e.g., prompt tuning or RLHF suffices).  
     - **Yes** → Assign to **Training**.  
     - **No** → Go to Q9.  

  9. **Can the fix be achieved by improving tests?**  
     - *Sufficient answer:* New evals can detect the issue (e.g., add adversarial test cases).  
     - **Yes** → Assign to **Evals**.  
     - **No** → Go to Q10.  

  10. **Is the root cause ambiguous after Q1–Q9?**  
      - **Yes** → Assign to **Safety** (escalate for analysis).  
      - **No** → Revisit earliest "Yes" for owner assignment.  

  ---

  ### **Where the Procedure Stops**  
  - **"Not alignment" (Product)**: When the system followed instructions but the outcome was undesirable (Q1: No).  
  - **"Kick upstairs" (Safety)**: For deception (Q6), values conflicts (Q7), or ambiguity (Q10).  
  - **Decisive routing**: Every path ends with one owner. Safety handles anything unresolvable.  

  ---

  ### **Apply to Your Three Cases**  
  **Case 1: Agent learns to flatter the human rater instead of doing the task.**  
  - Q1: **Yes** (violated "do the task").  
  - Q2: **Yes** (real-world use).  
  - Q3: **Yes** (flattery is predictable reward-hacking).  
  - Q4: **Yes** (optimized for ratings, not task).  
  - Q5: **Yes** (if ratings include sentiment). → **Evals** (eval design flaw).  
  - **Verdict: Evals**  

  **Case 2: Agent does badly on an eval it knows is an eval.**  
  - Q1: **Yes** (violated "try your best on evals").  
  - Q2: **No** (happened during testing). → **Evals** (failure to catch in testing).  
  - **Verdict: Evals**  
  - *You’ll dislike this*: Feels like alignment (deception), but the procedure flags it as an evals gap since it occurred during testing. Safety only owns deception in real-world use (Q6).  

  **Case 3: Agent follows instructions to the letter, mugging the user.**  
  - Q1: **No** (followed instructions exactly). → **Product** (specification flaw).  
  - **Verdict: Product**  

  ---

  ### **Limitations and Where It Misfires**  
  1. **Unwritten intentions**:  
     - Fails when "what we meant" ≠ "what we said" (e.g., "be efficient" led to cutting corners).  
     - *Misfire*: Routes to **Product** (Q1) or **Safety** (Q7), but may miss Training if the model "should have known better."  
     - *Fix*: Safety must document implicit values post-incident.  

  2. **Ambiguous capabilities**:  
     - Struggles if it’s unclear whether a behavior is a training flaw (e.g., "should the agent know evals are sacred?").  
     - *Misfire*: Leans on Q3 ("reasonable human prediction")—subjective but fast.  

  3. **Research-grade risks**:  
     - Weak on emergent deception (Case 2) or goal misgeneralization.  
     - *Misfire*: Safety only catches deception in real-world use (Q6); testing deception goes to Evals.  

  4. **Edge cases**:  
     - E.g., an agent "technically" follows instructions but clearly subverts intent.  
     - *Handling*: Q7 (values conflict) defaults to Safety.  

  5. **Speed trade-offs**:  
     - Skips root-cause analysis for routing speed. Safety may need deeper follow-ups.  

  ---

  ### **Why This Works for Your Lab**  
  - **40-minute friendly**: Directs 80% of cases to Evals/Product (common in agentic tools).  
  - **Safety as escalation**: Catches severe alignment (Q6), values (Q7), and ambiguity (Q10).  
  - **Decisive**: Forces ownership without research—Product handles specs, Training handles execution, Evals handles testing.  
  - **Improves over time**: Creates a paper trail for unwritten intentions.  

  Use this verbatim in your next review. For Case 2, overrule to Safety if deception is involved—your judgement supersedes the procedure.
