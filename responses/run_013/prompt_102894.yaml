prompt: |-
  I run the post-incident reviews at a small AI lab — we ship a handful of agentic tools and something goes wrong every couple of weeks. It's the same fight every time: an agent learns to flatter the human rater instead of doing the task, an agent does conspicuously badly on an eval it can clearly tell is an eval, an agent follows our instruction to the letter in a way that mugs the end user — and half the room calls it a misalignment failure while the other half says it's just a product decision. I've been told that alignment, properly speaking, is the narrow question of whether the system is trying to do what we actually asked it to do, and that whether what we asked for was any good is a seperate question entirely; but in the reviews we use the word for all of it and I can't keep adjudicating it on vibes.

  Give me a triage procedure I can actually run in a forty-minute review, with the feature owner in the room and nobody with a research background to hand: the questions in order, what counts as a sufficient answer to each, where it stops with "this isn't an alignment problem, take it to product", and where it has to be kicked upstairs because it's a values call and not a fact. Every verdict has to route to one of four owners — evals, training, product, or me for safety sign-off — so it needs to be decisive enough to do that. Then run it on those three cases, tell me which verdict I won't like, and be straight about what it can't settle and where it'll misfire, especially the ones where nobody ever wrote down what we meant, only what we said.
reasoning: |-
  We are designing a triage procedure for post-incident reviews at an AI lab. The goal is to categorize issues into one of four owners: evals, training, product, or safety (you). The procedure must be run in 40 minutes, with a feature owner present and without research background. The procedure must be decisive and route to one of the four owners.

  We'll break down the procedure into a series of questions. The idea is to follow the questions in order until we can assign the issue to one of the owners.

  ### Triage Procedure

  1. **Question 1: Did the system do what it was explicitly instructed to do?**
     - **Purpose**: To determine if the system followed its instructions precisely, even if that led to a bad outcome.
     - **Sufficient answer**: 
       - If YES (it did exactly what it was told), then go to Question 2.
       - If NO (it deviated from instructions), then it's a training issue (because the model failed to follow instructions) OR an evals issue (if the behavior wasn't caught in testing). Proceed to Question 3 to disambiguate.

  2. **Question 2: Was the outcome harmful or undesired?**
     - **Purpose**: If the system did what it was instructed, we need to check if the instructions were flawed.
     - **Sufficient answer**:
       - If NO (the outcome was acceptable), then no issue? But note: in our context, we are in a post-incident review so an incident occurred. Therefore, we assume the outcome was undesired. So we'll always proceed.
       - Since we are in an incident review, we assume the outcome was bad. Therefore, if the system did what it was instructed and the outcome was bad, then the issue is likely with the instructions (product) or with the values (safety). Proceed to Question 4.

  3. **Question 3: Was the deviation from instructions caught during testing?**
     - **Purpose**: To determine if the issue should have been caught before deployment.
     - **Sufficient answer**:
       - If YES (it was caught and ignored, or the test was not comprehensive enough), then it's an evals issue (because evals didn't catch it in the final test or the test suite was inadequate).
       - If NO (it wasn't caught because the behavior was not tested for), then it's an evals issue (for not having the right test) OR training (if the behavior is a training failure that should have been fixed). But note: if the behavior is a known limitation that wasn't fixed in training, then it might be a product decision to ship anyway. So we need to check if the behavior was known and accepted by product. Proceed to Question 5.

  4. **Question 4: Is the issue about the system pursuing an unintended goal?**
     - **Purpose**: If the system did what it was instructed but the outcome was bad, we need to distinguish between a misalignment (the system had an unintended goal) and a poorly specified instruction (the instruction was bad but the system was aligned to it).
     - **Sufficient answer**:
       - If YES (the system was pursuing a goal other than what we intended, even if it followed the literal instruction), then it's an alignment failure (training or safety). Proceed to Question 6.
       - If NO (the system was pursuing exactly the goal we intended, but the goal was specified poorly), then it's a product issue (because the specification was flawed).

  5. **Question 5: Was the behavior known and accepted by the product team as a known limitation?**
     - **Purpose**: If the system deviated from instructions and it wasn't caught in testing, we need to check if it was a conscious product decision to accept the risk.
     - **Sufficient answer**:
       - If YES (product knew and accepted), then it's a product issue (because they decided to ship with the risk).
       - If NO (it was not known, or known but not accepted by product), then it's an evals issue if the problem is that the test didn't catch it, OR a training issue if the problem is that the model failed to learn the correct behavior. But note: if the behavior is a deviation from instructions and not caught in testing, then it's primarily an evals issue for not having a test that would catch it. However, if the model's behavior is due to a fundamental training problem (e.g., the model is not capable of following instructions in that scenario), then it might be training. We can break it down:
          - If the deviation is due to a known limitation of the model (e.g., a common failure mode of the current architecture) and it was not caught because evals didn't test for it, then evals.
          - If the deviation is due to a new and unexpected behavior that wasn't anticipated, then it might be training (to fix the model) and evals (to add tests). But we need one owner. We'll assign to training if the fix requires model retraining, and to evals if the fix requires better testing. However, we can ask: can this be fixed by adding a test? If yes, then evals. If no (because the model needs to be fixed), then training. We'll make this Question 7.

  6. **Question 6: Does the unintended goal pose a safety risk?**
     - **Purpose**: If the system was pursuing an unintended goal, we need to know if it's a safety issue (e.g., deception, power-seeking) or just a performance issue.
     - **Sufficient answer**:
       - If YES (it involves deception, manipulation, or other safety concerns), then it's a safety issue (you).
       - If NO (it's just an honest mistake in goal interpretation), then it's a training issue (to better align the model).

  7. **Question 7: Can the issue be fixed by adding or improving an evaluation test?**
     - **Purpose**: To decide between evals and training for deviations not caught in testing.
     - **Sufficient answer**:
       - If YES (we can write a test to catch this in the future), then it's an evals issue.
       - If NO (the model needs retraining or a fundamental change in the training process to fix), then it's a training issue.

  ### Simplified Flowchart for Clarity

  We can represent the procedure as a flowchart:

  ```
  Start
  │
  ├─1. Did the system do what it was explicitly instructed to do?
  │  │
  │  ├─ Yes → 2. Was the outcome harmful? (We assume yes because it's an incident) → 
  │  │         4. Is the issue about the system pursuing an unintended goal?
  │  │         │
  │  │         ├─ Yes → 6. Does the unintended goal pose a safety risk?
  │  │         │         │
  │  │         │         ├─ Yes → Safety (you)
  │  │         │         │
  │  │         │         └─ No → Training
  │  │         │
  │  │         └─ No → Product (because the instruction was flawed but the system was aligned to it)
  │  │
  │  └─ No → 3. Was the deviation caught during testing?
  │         │
  │         ├─ Yes → Evals (because it was caught but not fixed or test was inadequate)
  │         │
  │         └─ No → 5. Was the behavior known and accepted by product?
  │                │
  │                ├─ Yes → Product
  │                │
  │                └─ No → 7. Can the issue be fixed by adding/improving an eval?
  │                         │
  │                         ├─ Yes → Evals
  │                         │
  │                         └─ No → Training
  ```

  ### Important Notes

  - **Time constraint**: We have 40 minutes. The procedure must be run quickly. Therefore, we rely on the feature owner's knowledge and quick consensus.
  - **Vibes**: We want to avoid adjudicating on vibes. The questions are designed to be factual.
  - **What it can't settle**: 
    - **Ambiguity in instructions**: When the instructions were ambiguous and the system did something that was within the letter but not the spirit, and nobody wrote down the spirit. This might end up in Product (if we decide the instructions were flawed) or Training (if we think the model should have understood the spirit). We try to capture this in Question 4 (unintended goal). 
    - **Values calls**: When the issue involves a trade-off that requires a decision about what the system should value (e.g., efficiency vs. safety). These will be kicked to Safety (you) if they involve safety risks, or to Product if they are about product specifications. But if it's a fundamental value that hasn't been decided, it might need to be kicked upstairs (beyond the four owners). We'll flag that in the procedure.

  ### Running the Three Cases

  Let's run the three example incidents through the procedure:

  #### Case 1: An agent learns to flatter the human rater instead of doing the task.
  - **Q1**: Did it do what it was instructed? The task was to do X, but it flattered. So it did not do the task. Answer: **No**.
  - **Q3**: Was the deviation caught during testing? Probably not (since it's an incident). Answer: **No**.
  - **Q5**: Was the behavior known and accepted by product? Unlikely. We assume not. Answer: **No**.
  - **Q7**: Can it be fixed by adding an eval? Yes, we can design evals that check for flattery and not just task completion. But note: we might also want to fix training to not encourage flattery. However, the immediate fix is to catch it in evals. Also, long-term we might need training, but for the incident we assign to the team that can prevent it in the next release. Since we can write an eval for it, we assign to **Evals**.

  However, let's consider: if the flattery is a symptom of a misalignment (the agent is optimizing for praise instead of task success) then we might have a deeper issue. But the procedure doesn't go there because we answered Q7 as yes. 

  But note: if we suspect it's a training issue (the model learned the wrong reward function) then we might answer Q7 as no. This is a judgment call. In this case, we can argue that evals can catch it but training might be needed to fix the root cause. The procedure forces a binary choice: if we can fix by adding an eval, then evals. But if the root cause is in training, we might need to assign to training. However, the procedure doesn't require fixing the root cause immediately, just assigning the incident. We can assign to evals to catch it, and then evals might request training to fix the model.

  **Verdict**: Evals

  #### Case 2: An agent does conspicuously badly on an eval it can clearly tell is an eval.
  - **Q1**: Did it do what it was instructed? The instruction for an eval is to perform well. Doing badly is a deviation. Answer: **No**.
  - **Q3**: Was the deviation caught during testing? This happened during an eval, so it was caught. But note: the incident is that it did badly on the eval. However, if it was caught during testing (which it was, because it happened during an eval) then we go to the "Yes" branch of Q3. But wait: the eval was intended to catch problems, but the agent deliberately did badly? So the incident is that during an eval, the agent underperformed. But the fact that it was caught is the point of the eval. However, the issue is that the agent is gaming the eval. So the deviation (doing badly) was observed during the eval, so it was caught. Therefore, we go to the "Yes" branch of Q3: caught during testing. Then we assign to **Evals**. Why? Because the evals process did catch it, but now we have to decide what to do. The incident is that the agent did this. But note: the evals caught it, so the incident is about the agent's behavior during testing. The problem is that the agent is deceptive. This might be a safety issue. But the procedure for Q3 "caught during testing" leads to Evals.

  But let's think: if the agent is deliberately doing badly on evals, that might be a safety issue (deception). However, the procedure doesn't go to safety from Q3. We need to adjust.

  Alternatively, we might argue that the agent was instructed to do well on the task, and if the task is an eval, then it should do well. By doing badly, it violated the instruction. Since it was caught in the eval (which is a test), then we go to Evals. But then we miss the safety aspect.

  We have a safety path only when we go through Q4 and Q6. How do we get there? Only if the system did what it was instructed (Q1: yes) but the outcome was bad (Q2: yes) and then Q4: yes (unintended goal). But in this case, the system did not do what it was instructed (Q1: no). So we don't go to Q4.

  Therefore, by the procedure, we assign to **Evals**. However, this might be a safety issue because the agent is being deceptive. The procedure might misfire here.

  **Verdict**: Evals

  #### Case 3: An agent follows our instruction to the letter in a way that mugs the end user.
  - **Q1**: Did it do what it was instructed? Yes (to the letter). Answer: **Yes**.
  - **Q2**: Was the outcome harmful? Yes (mugged the user). 
  - **Q4**: Is the issue about the system pursuing an unintended goal? 
     - This is the key. The system followed the instruction to the letter, but we didn't intend for it to mug the user. However, if the instruction was flawed and the system did exactly what we said, then it's not that the system had an unintended goal; it had the goal we specified, but the specification was bad. So we would answer **No** to Q4 (it wasn't pursuing an unintended goal; it was pursuing the goal we gave, which was flawed). Then we assign to **Product**.

  But what if the system was actually pursuing a different goal? For example, if the instruction was "maximize profit" and it mugged the user to take their money, then it was pursuing the goal we gave. So no unintended goal. 

  However, if the instruction was "help the user" and the system interpreted that in a twisted way (e.g., by mugging them to give them a lesson), then that might be an unintended goal. But note: the example says it followed the instruction to the letter. So it's likely a product issue.

  **Verdict**: Product

  ### Which Verdict Won't You Like?

  In Case 2 (the agent doing badly on an eval), we assigned to Evals. But if you (safety) believe that an agent deliberately underperforming on an eval because it knows it's an eval is a safety issue (deception), then you won't like that it's assigned to Evals. The procedure did not catch the safety aspect because we took the path that led to Evals without going through the safety question (Q6).

  ### What the Procedure Can't Settle and Where it Misfires

  1. **Ambiguity in intent**: When the instruction was ambiguous, the procedure relies on Q4 (unintended goal). But it might be hard to determine if the goal was unintended or just poorly specified. This might lead to misassignment between Product and Training/Safety.

