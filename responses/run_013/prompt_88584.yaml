answer: |-
  ### Pragmatist Truth Decision Tree  
  *Follow the branches by answering each question based on concrete cases. Start here if you broadly agree that "truth is what works" but aren’t sure which pragmatist you align with.*  

  ---

  #### **Question 1: Untestable Past Claim**  
  *Consider: "A squirrel was on this exact spot on January 1, 1000 AD." No evidence exists or will ever be found. Is this claim either true or false?*  
  - **No** → Truth isn’t a property waiting to be discovered. Go to Q2.  
  - **Yes** → Truth is a property statements can have. Go to Q3.  

  #### **Question 2: Social Endorsement**  
  *Is "true" just a label we use to approve statements that help our community cooperate (e.g., calling democracy "true" because it promotes social harmony)?*  
  - **Yes** → **Leaf: Rorty-style social endorsement**.  
    *Awkward commitment:* Truth collapses into whatever your tribe finds useful—even if it’s arbitrary or ignores evidence.  
  - **No** → **Leaf: Pragmatism as a maxim only (Peirce’s early view)**.  
    *Awkward commitment:* You reject pragmatism as a truth theory—it’s just a tool to clarify ideas, leaving truth unexplained.  

  ---

  #### **Question 3: Comforting False Belief**  
  *A dying person believes they’ll recover, and this belief brings them peace. They die. Was their belief "true" because it helped them?*  
  - **Yes** → Truth is indexed to individual needs. **Leaf: Jamesian expediency view**.  
    *Awkward commitment:* False beliefs (e.g., "I’m invincible") can be "true" if they feel useful—risks relativism.  
  - **No** → Truth depends on shared inquiry, not psychology. Go to Q4.  

  #### **Question 4: Newtonian Mechanics**  
  *Newton’s theory worked for centuries until Einstein overturned it. Was it "true" when widely used?*  
  - **Yes** → Truth is grounded in present evidence. **Leaf: Deweyan warranted assertability**.  
    *Awkward commitment:* Truth changes over time (Newton was "true" then, "false" now)—undermines stability.  
  - **No** → Truth requires more than current success. Go to Q5.  

  #### **Question 5: Math Case (Fermat’s Last Theorem)**  
  *Before it was proven, was the truth of Fermat’s Last Theorem determined by...*  
  - **...what mathematicians would eventually prove if they kept researching forever?** → **Leaf: Peircean limit-of-inquiry view**.  
    *Awkward commitment:* Undecidable claims (e.g., some infinities in set theory) may never be "true" or "false"—truth evaporates.  
  - **...what an ideally rational agent would accept, even if humans never reach that insight?** → **Leaf: Putnam-style idealized rational acceptability**.  
    *Awkward commitment:* "Ideal conditions" are unknowable—truth becomes unmoored from human practice.  

  ---

  ### Notes & Unoccupied Positions  
  **Indistinguishable cases?**  
  - James vs. Dewey on the *dying person*: Both say "no" to truth here, but James would say a belief *could* be true if it helps *anyone*, while Dewey requires community warrant.  
  - Peirce vs. Putnam on *math*: They agree Fermat is true, but split on *why* (actual vs. idealized convergence).  

  **Unoccupied combinations** (answers in order):  
  - Q1: No → Q2: No → Q3: No → **Dead end**. *Why?* Rejecting truth-as-property *and* social endorsement leaves no pragmatist theory. Likely **incoherent** without a backup.  
  - Q1: Yes → Q3: No → Q4: Yes → Q5: Both answers → **Untenable**. *Why?* If truth is "current warrant" (Dewey), long-run convergence (Q5) is irrelevant. **Incoherent**.  

  **Design logic**:  
  - Branches prioritize core splits: truth-as-property? (Q1), individualism? (Q3), temporality? (Q4).  
  - Cases force real-world stakes: untestable claims (metaphysics), comforting lies (ethics), overturned science (epistemology), math (abstraction).  
  - Leaves cover your requested positions, with "awkward commitments" highlighting vulnerabilities.  

