  ### **Timeline (90 Minutes Total)**
  | Time  | Activity |
  |-------|----------|
  | 0–5   | **Introduction:** Explain the game, roles, and goals. Emphasize: "You are rational Bayesians. Your goal is to estimate P(Urn A)." |
  | 5–10  | **Round 1 Setup:** Flip coin (secretly), choose urn. Draw private signals (envelopes). All share common prior: P(Urn A) = 1/2. |
  | 10–20 | **Round 1 - Initial Posterior:** Students compute P(Urn A \| signal) (provide formula: P(A\|R) = 2/3, P(A\|B) = 1/3). Write on cards. |
  | 20–35 | **Round 1 - Announcements & Updating:** <br> 1. Read posters in order. Students update beliefs *using signals inferred from posteriors* (since posteriors reveal signals under common prior). <br> 2. Repeat until convergence (usually 1–2 passes). |
  | 35–40 | **Round 1 - Broker:** Broker tries to propose a bet. All decline (identical posteriors). |
  | 40–45 | **Round 2 Setup:** Distribute *private* prior cards (half P(A)=2/3, half P(A)=1/3). Redraw signals from *same urn*. |
  | 45–55 | **Round 2 - Initial Posterior:** Students compute posteriors with new priors (provide formulas). Write on cards. |
  | 55–70 | **Round 2 - Announcements:** Read posters. Students *cannot update* (posteriors don’t reveal signals; different priors). Repeat passes—no change. |
  | 70–75 | **Round 2 - Broker:** Broker proposes a spread bet (e.g., between min and max posterior). Participants accept. Broker "profits." |
  | 75–90 | **Debrief:** Discuss results, map to theorems, and explore implications (see below). |

  ---

  ### **Debrief Script (15 Minutes)**
  **Step 1: Recap Observations (5 min)**  
  - *Round 1:* "Disagreement vanished with public announcements. Broker found no bet."  
  - *Round 2:* "Disagreement persisted. Broker profited risklessly."  
  - *Key Question:* "What changed? Only the priors."  

  **Step 2: Map to Aumann’s Agreement Theorem (5 min)**  
  - **Common Prior (Round 1):** "You started with identical priors (P=1/2). This anchors beliefs."  
  - **Bayesian Updating:** "You updated rationally using signals."  
  - **Common Knowledge of Posteriors:** "Public announcements made beliefs mutually known, and repeated announcements made them *common* knowledge (everyone knows everyone knows...)."  
  - **The Agreement Result:** "With these three, disagreement is impossible. This is Aumann’s theorem."  

  **Step 3: Three Exits from Agreement (3 min)**  
  Persistent disagreement (Round 2) implies at least one failure:  
  1. **Different Priors:** "You had conflicting priors, unknown to each other."  
  2. **Non-Bayesian Updating:** "Not here—you updated correctly."  
  3. **Lack of Common Knowledge:** "Posteriors were public, but the *signal structure/priors* weren’t common knowledge."  

  **Step 4: Doctrine and Relaxations (5 min)**  
  - **Harsanyi Doctrine:** "The claim that belief differences stem *only* from information differences (i.e., common priors). Round 2 falsifies this."  
  - **All-or-Nothing Theorem:**  
    - "The theorem is binary: common prior + common knowledge ⇒ agreement. But relaxations exist:"  
    - *Common p-Belief:* "If beliefs are ‘close’ to common knowledge, posteriors are bounded (Monderer-Samet, 1989)."  
    - *Close Priors:* "If priors are ε-close, posteriors are δ-close (bounds depend on signals)."  
  - **No-Trade Theorem:**  
    - "In Round 1, no bet was possible—equivalent to a common prior. In Round 2, betting was possible—equivalent to different priors."  

  **Step 5: Final Discussion (2 min)**  
  - "What does this say about real-world disagreement? Politics? Science?"  
  - "The common prior is a useful idealization—but relaxations handle real-world messiness."  

  ---

  ### **Predictable Challenges & Mitigations**
  1. **Updating Computation (Round 1):**  
     - *Problem:* Students may struggle with Bayes’ rule.  
     - *Fix:* Provide cheat sheets:  
       - Common Prior: P(A) = 1/2, P(R|A) = 2/3, P(R|B) = 1/3.  
       - P(A|R) = [P(R|A)P(A)] / [P(R)] = (2/3 * 1/2) / (1/2) = 2/3.  
       - P(A|B) = 1/3.  
     - After first announcement, signals are revealed (posterior → signal), simplifying updates.  

  2. **Confusion in Round 2 Updating:**  
     - *Problem:* Students may try to update but can’t infer signals (posteriors overlap: e.g., P=0.5 could be R in Group 2 or B in Group 1).  
     - *Fix:* Explicitly say: "You hear others’ posteriors, but you *cannot* infer their signals. Do not change your belief."  

  3. **Broker Missteps:**  
     - *Problem:* Broker may set prices that don’t exploit disagreement.  
     - *Fix:* Provide broker formula:  
       - Set *q* = 100 × min posterior + 1 (e.g., min=0.4 → q=41).  
       - Set *p* = 100 × max posterior - 1 (e.g., max=0.6 → p=59).  
       - Profit = *p - q*.  

  4. **Unreproducible Element:**  
     - *The "As If" Common Knowledge of Structure:* The activity assumes students treat others as Bayesians with known signal structures. In Round 2, this is *false* (priors differ secretly), but students *behave as if* it’s true. You must verbally reinforce this: "In Round 2, you each *believed* others had your prior. This belief was incorrect, but you acted on it."  

