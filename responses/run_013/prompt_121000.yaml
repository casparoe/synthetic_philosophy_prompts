  ### **Settled vs. Contested Claims**  
  | Claim | Status | Notes |
  |-------|--------|-------|
  | **Aumann’s Theorem:** Common prior + common knowledge of posteriors ⇒ agreement. | Theorem (settled) | From Aumann (1976). Assumes partitional knowledge. |
  | **No-Trade Theorem:** Common prior ⇔ no strictly favorable bet. | Theorem (settled) | From Milgrom-Stokey (1982); generalizes to common prior. |
  | **Harsanyi Doctrine:** All belief differences stem from information differences (common priors). | Contested interpretation | Rejected by those who allow innate prior differences (e.g., Aumann accepts it; Kadane-Larkey critique it). |
  | **Common p-Belief Relaxation:** If posteriors are p-common knowledge, they lie within a bounded interval. | Theorem (settled) | From Monderer-Samet (1989). |
  | **Close Priors Relaxation:** ε-close priors ⇒ δ-close posteriors. | Theorem (settled) | Bounds depend on likelihoods (e.g., Nielsen, 2020). |
  | **Common Knowledge Requirement:** Necessary for agreement. | Theorem (setted) | Geanakoplos-Polemarchakis (1982) shows mutual knowledge isn’t enough. |

  **Sources for Disputed Claims:**  
  - Harsanyi Doctrine: Aumann (1987) defends it; Kadane & Larkey (1982) reject it.  
  - Realism of Common Prior: Morris (1995) discusses critiques; Feinberg (2000) shows equivalence to no-betting.  

  ---

  ### **Final Notes**  
  - **Why This Works:** The two-round contrast forces students to confront the common prior as the "invisible hand" behind agreement. The broker’s success in Round 2 viscerally illustrates its failure.  
  - **Customization:** Adjust signal complexity (e.g., add more urns/balls) for advanced students.  
  - **Extension:** For future sessions, add a Round 3 with non-Bayesian updaters to explore the third "exit."  

  This packet ensures students *experience* the common prior’s role before formalizing it. By the debrief, they’ll see it not as a "buried clause," but as the linchpin holding rational agreement together.
