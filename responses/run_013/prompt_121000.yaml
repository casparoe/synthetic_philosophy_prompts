  Below is a complete, runnable packet for your seminar activity. It's designed to make the common prior assumption tangible, leveraging the structure you outlined while addressing potential pitfalls. The activity uses an urn setup for simplicity, with clear roles and a timeline. I'll provide materials, setup instructions, roles, a payoff scheme, a minute-by-minute timeline, a debrief script, and notes on challenges and contested interpretations.

  ---

  ### **Materials and Setup**
  **Materials:**
  - Two urns:
    - Urn A: 2 red balls, 1 blue ball.
    - Urn B: 1 red ball, 2 blue balls.
  - A fair coin (to choose the urn secretly).
  - 16 sealed envelopes for private signals (each contains a colored slip: red or blue).
  - 16 prior cards (8 labeled "Prior: P(Urn A) = 2/3", 8 labeled "Prior: P(Urn A) = 1/3").
  - Poster cards for posterior announcements (index cards or sticky notes).
  - Whiteboard or projector to record posteriors.
  - Broker "bet slip" for proposing bets.

  **Setup:**
  1. **State Selection:** Flip the coin. Heads: use Urn A; tails: use Urn B. *Do not reveal the urn.*
  2. **Signal Draws:** For each student, draw a ball (with replacement) from the chosen urn. Place a colored slip (red/blue) in their envelope to represent their private signal.
  3. **Prior Assignment (Round 2 only):** Prepare 8 "P(A)=2/3" and 8 "P(A)=1/3" cards. Distribute these privately before signals.

  ---

  ### **Roles**
  1. **Participants (16 students):**  
     - Compute posteriors based on their private info (prior and signal).  
     - Announce posteriors when called.  
     - Update beliefs after hearing others (Round 1 only).  
     - Accept/reject bets from the broker.

  2. **Broker (1 student or facilitator):**  
     - After announcements, propose bets to exploit disagreement.  
     - In Round 1, attempt to find a bet all accept (will fail).  
     - In Round 2, find a bet with a spread between extreme posteriors.

  3. **Facilitator (You):**  
     - Explain rules, distribute materials.  
     - Choose state, draw signals, and distribute envelopes.  
     - Read posteriors aloud in order (e.g., by seat number).  
     - Record posteriors publicly (whiteboard).  
     - Moderate the broker’s betting phase.  

  ---

  ### **Payoff Scheme (No Real Money)**
  - **Betting Mechanism:**  
    - Broker proposes a "point trade" between two participants.  
    - **Buyer:** Pays "price" *p* to receive 100 points if Urn A is true.  
    - **Seller:** Receives *q* points now, pays 100 points if Urn A is true.  
    - **Broker:** Sets *p* (buy price) and *q* (sell price) with *p > q*. Profit = *p - q* points (riskless).  
  - **Rationale:**  
    - Participants accept if the bet is favorable *given their posterior*:  
      - Buyer accepts if posterior > *p*/100.  
      - Seller accepts if posterior < *q*/100.  
    - In Round 1, no trade occurs (identical posteriors).  
    - In Round 2, broker exploits disagreement by setting *q* < min posterior, *p* > max posterior.  
  - **Example:**  
    - Posteriors: 0.6 (Participant X), 0.4 (Participant Y).  
    - Broker sets *q* = 39, *p* = 61 (ensuring *p - q* = 22 points profit).  
    - X sells (0.4 < 0.39? No, but 0.4 < 0.61? Clarify: seller condition is posterior < *q*/100. Here, *q*/100 = 0.39, and 0.4 > 0.39, so Y (posterior 0.4) would not sell. Let me correct:  
      - Set *q* = 41 (so *q*/100 = 0.41). Y (0.4) sells because 0.4 < 0.41.  
      - Set *p* = 59 (so *p*/100 = 0.59). X (0.6) buys because 0.6 > 0.59.  
      - Broker profit = 59 - 41 = 18 points.  

