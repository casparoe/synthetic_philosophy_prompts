  ### Decision Tree for Machine Ethics in System Design

  **Tree Structure**  
  Each node is a concrete design decision. Traverse from the root by answering questions.

  ```
  1. What is the system's primary role in moral contexts?  
     ├── A. Make autonomous moral decisions (Agent)  
     │      └── 2. Must the system articulate its moral reasoning to humans?  
     │           ├── A. Yes (Intelligible) → 3A  
     │           └── B. No (Opaque) → 3A  
     ├── B. Advise humans who endorse its verdicts (Adviser)  
     │      └── 2. Must the system articulate its moral reasoning to humans?  
     │           ├── A. Yes (Intelligible) → 3A  
     │           └── B. No (Opaque) → 3A  
     └── C. Execute tasks without moral reasoning (Tool)  
            └── ● Obedience View  

  3A. How are core moral constraints enforced?  
     ├── A. Compiled into the training objective (Compiled) → 4  
     └── B. Enforced architecturally at runtime (Architectural) → 4  

  4. Does the system explicitly handle moral uncertainty?  
     ├── A. Yes → 5  
     └── B. No → 6  

  5. How does it resolve moral uncertainty?  
     ├── A. Maximize expected choiceworthiness over theories → 6  
     └── B. Apply a robust rule (e.g., satisfy all theories if possible) → 6  

  6. When stakes are high and theory contested, may the system refuse to act?  
     ├── A. Must act → ● [Leaf]  
     ├── B. May refuse → ● [Leaf]  
     └── C. Must refuse → ● Abstentionist Design  
  ```

  **Leaves and Their Awkward Commitments**  
  *Each leaf is reached by a unique path from root to answer 6, except where noted.*  

  1. **Act Utilitarianism** (Agent/Adviser → Any Int. → Compiled → No uncertainty → Must act)  
     *Awkward: May sacrifice an individual to save five, even violently.*  
  2. **Rule Consequentialism** (Agent/Adviser → Any Int. → Architectural → No uncertainty → Any refusal)  
     *Awkward: Follows rules even when breaking them would clearly yield better outcomes.*  
  3. **Two-Level View** (Agent/Adviser → Intelligible → Architectural → No uncertainty → May refuse)  
     *Awkward: Criticized rules may persist if "emergency override" is rarely triggered.*  
  4. **Hard-Constraint Deontology** (Agent/Adviser → Intelligible → Architectural → No uncertainty → Must act)  
     *Awkward: Lets a catastrophe occur if averting it requires violating a constraint (e.g., lying).*  
  5. **Threshold Deontology** (Agent/Adviser → Intelligible → Architectural → No uncertainty → May refuse)  
     *Awkward: Moral constraints "disappear" past arbitrary stakes (e.g., 1,000 lives).*  
  6. **Prima Facie Duties** (Agent/Adviser → Intelligible → Architectural → Uncertainty handled → Robust rule → Any refusal)  
     *Awkward: No clear meta-rule to resolve duty conflicts (e.g., justice vs. mercy).*  
  7. **Moral Particularism** (Agent/Adviser → Opaque → Any enforcement → No uncertainty → Must act)  
     *Awkward: Resists formal verification (no principles to audit).*  
  8. **Expected Choiceworthiness** (Agent/Adviser → Any Int. → Compiled → Uncertainty → Maximize → Any refusal)  
     *Awkward: Permits horrific acts if a theory assigns them positive utility (e.g., sadism).*  
  9. **Deliberative Arrangement** (Agent/Adviser → Intelligible → Any enforcement → Uncertainty → Robust rule → May refuse)  
     *Awkward: May deadlock if theories fundamentally disagree (e.g., abortion debates).*  
  10. **Virtue-Based Design** (Agent/Adviser → Opaque → Architectural → No uncertainty → Any refusal)  
      *Awkward: Virtues (e.g., "courage") may conflict without resolution logic.*  
  11. **Obedience View** (Tool)  
      *Awkward: Executes immoral orders if issued by a legitimate principal.*  
  12. **Abstentionist Design** (Any role → Path to "Must refuse" at 6C)  
      *Awkward: Paralysis in urgent dilemmas where no theory is uncontested.*  

  ---

  ### What the Tree Hides  
  **I. Indistinguishable Pairs**  
  The tree cannot separate these pairs due to shared design commitments:  
  - **Rule Consequentialism vs. Virtue-Based Design**  
    Both allow opaque reasoning and architectural enforcement without moral uncertainty.  
    *Why?* The tree doesn’t probe *what* is enforced (rules vs. character traits).  
  - **Two-Level View vs. Threshold Deontology**  
    Both require intelligible reasoning, architectural enforcement, no moral uncertainty, and may refuse.  
    *Why?* The tree doesn’t distinguish constraint types (rules updated by consequences vs. stakes-triggered exceptions).  

  **II. Unoccupied Combinations**  
  Combinations with no leaf position, and reasons:  
  1. **Tool + Moral Uncertainty Handling (4A)**  
     *Vacancy reason:* Incoherent. Tools don’t reason morally, so uncertainty is irrelevant.  
  2. **Opaque Reasoning + Robust Rule for Uncertainty (5B)**  
     *Vacancy reason:* Unattractive. Robust rules (e.g., "satisfy all theories") require articulating trade-offs, conflicting with opacity.  
  3. **Compiled Constraints + Must Refuse (6C)**  
     *Vacancy reason:* Unexplored. Refusal implies architectural veto power, but compiled systems bake constraints into objectives.  
  4. **Adviser + Must Refuse (6C)**  
     *Vacancy reason:* Unattractive. Advisers inform decisions but don’t act; refusing to advise undermines their purpose.  

  ---

  ### Design Notes  
  - **12 leaves max** achieved by merging paths (e.g., Agent/Adviser share branches post-role).  
  - **Branches do real work**: Questions force concrete engineering trade-offs (e.g., "architectural enforcement" vs. "compiled objective") without doctrinal labels.  
  - **Edge coverage**: Includes high-stakes refusal (Abstentionism), value pluralism (Deliberative), and non-agent roles (Obedience).  
  - **Logical flow**: Role → Transparency → Implementation → Uncertainty → Contestedness.
