prompt: |-
  I am in an advanced undergraduate ethics seminar on killing and letting die, and we have spent two weeks on the trolley cases and the doctrine of double effect. In the last meeting a student cut off the discussion with a line I have now heard three times: 'Double effect is just a rationalisation for letting people die.' I am sure the line is doing some work, but I cannot tell which work, and the seminar moved on before anyone unpacked it. I should like a menu of the precise claims that one-liner could be making, rather than a defence or a refutation of any one of them.

  Please distinguish, for instance, (a) the psychological claim that the doctrine is merely a post hoc rationalisation of intuitions we have for other reasons; (b) the conceptual claim that the intended/foreseen distinction cannot be drawn in a principled way, whether because intention is opaque, because foresight of a certain side-effect is enough for intention, or because the means/side-effect distinction collapses in cases like the loop; (c) the moral claim that even if the distinction can be drawn it makes no moral difference; (d) the explanatory claim that the doctrine is doing no independent work beyond a consequentialist calculation of proportionality; and (e) the radical claim that the doctrine is a piece of moral ideology that licenses the killing of the innocent. For each reading, say what it actually asserts, what kind of 'intention' is at issue -- foresight, motive, plan, or acceptance -- whether it is trivial, substantive but defensible, or false, and what it would commit its holder to about the standard cases: the switch, the footbridge, the terror bomber versus the tactical bomber, the craniotomy, and the loop case. I am also interested in whether the doctrine's four conditions are meant as necessary, sufficient, or merely evidentiary, and whether a separate condition about the closeness of the causal chain is doing any work. Then say which reading is most likely to be what my fellow student meant, and which readings would actually support the dismissive use to which the line was put. I am not asking for a bibliography or citations; I want the conceptual map, laid out as a list I can bring back to the seminar. Please write in British English.
reasoning: |-
  Okay, the user is in an advanced undergraduate ethics seminar focused on killing versus letting die, specifically discussing trolley problems and the Doctrine of Double Effect (DDE). They mention a fellow student dismissed DDE as "just a rationalisation for letting people die," and the discussion moved on before it could be unpacked. The user wants a clear breakdown of possible interpretations of that statement, not a defense or refutation. 

  First, I need to recall the core of DDE: it permits causing harm as a foreseen side effect if the act is good, the intention is good, the harm isn't a means, and there's proportionality. The student's dismissal seems reductive, so I'll map out the critical angles. The user specified five readings (a to e), so I'll structure around those.

  Starting with (a), the psychological claim: this is about DDE being post hoc justification for pre-existing intuitions. For example, in the switch case, people feel pulling the lever is acceptable, and DDE retrofits an explanation. Intention here is about conscious motive versus deep-seated bias. It's substantive but defensible—psychology often influences moral reasoning. The user needs to see how this undermines DDE's objectivity.

  Next, (b), the conceptual claim: this argues the intended/foreseen distinction is incoherent. Cases like the loop variant blur means versus side effects. Intention involves foresight crossing into acceptance or plan. It's substantive and defensible, challenging DDE's foundation. The user should note this makes DDE seem arbitrary in hard cases.

  For (c), the moral claim: even if we can distinguish intended from foreseen, it shouldn't matter morally. Proportionality or consequences might be what truly counts. Intention here is irrelevant; outcomes are key. This is substantive and defensible, aligning with consequentialism. The user might connect this to debates about whether motives affect permissibility.

  Then (d), the explanatory claim: DDE is redundant because proportionality does all the work. For instance, in tactical bombing, proportionality justifies it, not double effect. Intention is epiphenomenal. This is substantive if true, making DDE trivial. The user should see how this reduces DDE to a smokescreen.

  Lastly, (e), the radical claim: DDE is ideological, enabling harm (e.g., in craniotomy or warfare). Intention becomes a tool for bad actors. This is substantive but contentious. The user needs to recognize the political charge here—it paints DDE as dangerous.

  The user also asks about DDE's conditions: necessity, sufficiency, or evidentiary? I'll clarify that conditions are necessary but not sufficient, with proportionality as key. Causal proximity might play a role in loop cases but isn't formal. 

  For the student's likely meaning: given the dismissive tone, (a) or (d) are probable—they're reductive and fit "rationalisation." But (e) could also resonate emotionally. The user wants to identify which readings support dismissal: (a), (d), and (e) do by attacking DDE's validity or honesty, while (b) and (c) are more technical critiques.

  Unspoken needs: The user might feel frustrated by the abrupt end of discussion and seeks tools to revive it. They could want confidence to challenge peers or understand hidden biases in critiques. By providing this menu, they're equipped to lead deeper analysis, turning a one-liner into productive debate.
answer: |-
  Here is a conceptual map of the possible claims embedded in the statement "Double effect is just a rationalisation for letting people die," analysed according to your specifications. I'll use British English throughout.

  **Key for Analysis:**
  *   **Intention Type:** What aspect of "intention" the claim primarily targets (Foresight, Motive, Plan, Acceptance).
  *   **Assessment:** Trivial (T), Substantive but Defensible (S-D), False (F) - based on common academic debate.
  *   **Commitments:** Implications for standard cases (Switch, Footbridge, Terror vs Tactical Bomber, Craniotomy, Loop).
  *   **DDE Conditions:** Role of the four conditions (Good Act, Good Intention, Harm Not a Means, Proportionality) - Necessary (N), Sufficient (S), Evidentiary (E).
  *   **Causal Proximity:** Whether closeness of the causal chain is seen as doing independent work.

  **The Five Claims:**

  1.  **The Psychological Claim (Post Hoc Rationalisation):**
      *   **Assertion:** DDE doesn't *explain* moral intuitions; it is *invented afterwards* to justify intuitions we already hold for other reasons (e.g., emotional aversion to direct violence, implicit consequentialism, cultural norms). Its apparent explanatory power is illusory.
      *   **Intention Type:** Focuses on the *motive* for *invoking* DDE itself, rather than the agent's intention in the case. Suggests the *concept* of intention in DDE is constructed post-hoc.
      *   **Assessment:** S-D. Empirical psychology supports that reasoning often follows intuition.
      *   **Commitments:**
          *   *Switch:* We intuitively feel it's permissible; DDE provides a plausible-sounding reason.
          *   *Footbridge:* We intuitively feel it's wrong; DDE provides a plausible-sounding reason (pushing *is* intending harm as means).
          *   *Bombers:* We intuitively condemn terror bombing more; DDE provides a framework.
          *   *Craniotomy/Loop:* Our conflicting intuitions lead us to stretch or contract DDE concepts to fit.
      *   **DDE Conditions:** Treated as post-hoc justificatory tools, not foundational principles. Likely seen as E (evidence we *think* justifies our gut feeling).
      *   **Causal Proximity:** Not directly addressed; may be another post-hoc rationalising factor.
      *   **Supports Dismissal?** Yes. Directly claims DDE isn't genuine reasoning, just excuse-making.

  2.  **The Conceptual Claim (Distinction Collapse):**
      *   **Assertion:** The core distinction between "intended as means/end" and "merely foreseen side-effect" is conceptually incoherent, impossible to draw reliably, or collapses under scrutiny. Reasons: Intention is opaque/subjective; foresight with certainty implies acceptance/voluntariness equivalent to intention; the means/side-effect distinction is context-dependent or arbitrary (especially in complex causal chains like Loop).
      *   **Intention Type:** Targets the *plan* and what constitutes *acceptance* or willing. Argues foresight inevitably bleeds into intention.
      *   **Assessment:** S-D. Significant philosophical debate exists; Loop variant is designed to challenge the distinction.
      *   **Commitments:**
          *   *Switch/Loop:* If distinction collapses, these become morally equivalent (both permissible or both impermissible), contradicting standard DDE application.
          *   *Footbridge:* May become permissible if pushing is seen as merely foreseeing the death to save others (though counter-intuitive).
          *   *Bombers:* Distinction between terror and tactical bombing fades if foreseen death with certainty is seen as intended.
          *   *Craniotomy:* If crushing the head is deemed a necessary means to save the mother, DDE cannot forbid it.
      *   **DDE Conditions:** The third condition (harm not a means) is rendered meaningless or unworkable. Conditions are neither N nor S if the core distinction fails.
      *   **Causal Proximity:** Often central to this critique (e.g., Loop exploits causal closeness to blur means/side-effect).
      *   **Supports Dismissal?** Yes. If the distinction is bogus, DDE rests on sand.

  3.  **The Moral Claim (Distinction Without Difference):**
      *   **Assertion:** Even *if* the intended/foreseen distinction *can* be drawn clearly and coherently, it **lacks intrinsic moral significance**. What matters is the outcome, the overall consequences (net lives saved), the agent's motives (e.g., malice vs. benevolence), or other factors like rights violations. DDE mistakenly elevates a psychological/metaphysical distinction into a moral one.
      *   **Intention Type:** Focuses on the moral irrelevance of the *plan* or *foresight* distinction itself. May elevate *motive* or consequences instead.
      *   **Assessment:** S-D. Consequentialists explicitly hold this view; others argue intention *is* morally central.
      *   **Commitments:**
          *   *Switch/Footbridge:* Permissibility depends solely on consequences (5>1) or rights violations (directly using a person). Footbridge might be condemned for violating a right against being used, not the intention *per se*.
          *   *Bombers:* Terror bombing may be worse only if it causes *more* suffering or indicates worse motives, not because of the intention structure.
          *   *Craniotomy:* Potentially permissible if overall consequences are good (save one life, lose one) or impermissible due to rights violation.
          *   *Loop:* Morally equivalent to Switch.
      *   **DDE Conditions:** Proportionality (4th condition) might be the *only* morally relevant factor. The first three conditions are morally inert. Conditions are not N or S for permissibility; proportionality might be S.
      *   **Causal Proximity:** Lacks independent moral weight; relevant only to consequences or ease of prediction.
      *   **Supports Dismissal?** Yes. Makes DDE's core distinction morally otiose, reducing it to window dressing.

  4.  **The Explanatory Claim (Proportionality Does the Work):**
      *   **Assertion:** DDE appears to justify certain harmful acts (like Switch, Tactical Bombing) because we implicitly judge the good outcome *proportionately outweighs* the foreseen harm. The elaborate structure of intention/distinction adds nothing; it's consequentialist proportionality in disguise. DDE "rationalises" the proportional harm by dressing it up in non-consequentialist language.
      *   **Intention Type:** Argues that *foresight* and *acceptance* are epiphenomenal; the real driver is the calculation of net benefit. *Motive* might be benevolent, but the structure is redundant.
      *   **Assessment:** S-D. A common consequentialist critique; DDE proponents argue the *constraint* against intending harm is independent.
      *   **Commitments:**
          *   *Switch/Tactical Bomber/Loop:* Permitted because 5>1 (proportional).
          *   *Footbridge/Terror Bomber:* Forbidden because disproportionate (killing one to save one? Using someone as mere means *is* disproportionate/disrespectful) or bad consequences (undermining trust).
          *   *Craniotomy:* Forbidden because disproportionate (killing one to save one) or rights violation.
      *   **DDE Conditions:** Only the 4th condition (Proportionality) is doing any real justificatory work; the first three are superfluous rationalisation. Proportionality is necessary and potentially sufficient.
      *   **Causal Proximity:** May factor into consequence calculation (predictability, risk) but no independent role.
      *   **Supports Dismissal?** Yes. Portrays DDE as a redundant, misleading veneer over simple consequentialism.

  5.  **The Radical Claim (Moral Ideology / License to Kill):**
      *   **Assertion:** DDE functions ideologically to provide a spurious moral justification for actions that are, in reality, impermissible killings of the innocent. It is a tool used by the powerful (states, institutions) to sanitise foreseen but unacceptable harms (e.g., civilian bombing, controversial medical procedures) by reclassifying them as "unintended." It "rationalises" not just letting die, but *killing*.
      *   **Intention Type:** Focuses on how *foresight* and the *plan* are manipulated or defined too narrowly to excuse harmful actions. Highlights the *motive* for *using* DDE doctrine itself (excusing harm).
      *   **Assessment:** S-D (as a critical perspective). Highly contentious; proponents argue DDE *constrains* harm.
      *   **Commitments:**
          *   *Switch/Tactical Bomber/Loop:* DDE provides an unjustified excuse for actively causing death.
          *   *Footbridge:* Correctly condemned, but only because DDE ideology hasn't stretched *that* far yet.
          *   *Craniotomy:* A prime example of using DDE to forbid an act proponents see as justified killing under necessity.
          *   (Often extends beyond cases to real-world: collateral damage, certain end-of-life decisions).
      *   **DDE Conditions:** Seen as a legalistic checklist designed to permit harmful acts that violate fundamental prohibitions. Conditions are tools for rationalisation, not genuine moral criteria. Proportionality masks unacceptable trade-offs.
      *   **Causal Proximity:** May be seen as another manipulable factor in excusing harm.
      *   **Supports Dismissal?** Yes. Portrays DDE not just as wrong, but as actively dangerous and deceptive.

  **DDE Conditions & Causal Proximity:**
  *   **Conditions:** Within DDE, the four conditions are typically understood as **jointly necessary** (all must be satisfied) but **not sufficient** (other factors like justice might forbid the act). The "good intention" and "harm not a means" conditions are central to the intended/foreseen distinction. Proportionality is a distinct, crucial requirement.
  *   **Causal Proximity:** This is **not a formal condition** of traditional DDE. However, it often plays a significant **evidentiary or diagnostic role** in determining whether a harmful effect is *truly* a side-effect or is so intimately connected to the good effect that it becomes part of the means (as highlighted in the Loop variant). Its prominence is a response to critiques like (b).

  **Most Likely Student Meaning & Support for Dismissal:**
  *   **Most Likely:** Given the context (seminar on killing/letting die, dismissive tone "rationalisation for *letting die*"), interpretations **(a) Psychological** and **(d) Explanatory (Proportionality Does the Work)** are the most probable primary meanings. These directly frame DDE as an insincere or redundant justification. **(c) Moral Claim** is also plausible. The phrase "letting die" might slightly favour (a) or (d) over (e), though (e) is a strong secondary candidate if the student has radical leanings.
  *   **Supporting Dismissal:** The line is inherently dismissive. **All five interpretations support this dismissive use**, but in different ways:
      *   **(a), (d), (e)** directly characterise DDE as intellectually dishonest or deceptive (rationalisation, disguise, ideology).
      *   **(b)** dismisses it as conceptually incoherent.
      *   **(c)** dismisses it as morally irrelevant.
      *   The most *forcefully* dismissive uses stem from **(a), (d), and (e)**, as they attack the integrity or purpose of invoking DDE, not just its truth.

  This menu should equip you to dissect the one-liner and reignite a more precise discussion in your seminar.
