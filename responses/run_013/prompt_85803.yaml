prompt: |-
  I teach a graduate seminar in formal epistemology and decision theory, and I'm drafting the final exam now. The closing unit is the two-envelope paradox, and I have grown tired of reading essays that dispose of it by announcing that the argument presupposes an improper prior over the smaller amount and then stopping; that diagnosis is not wrong, but it has hardened into a canned answer that lets students skip the only part worth testing, namely what work the expected-value calculation is actually doing and when it is entitled to do it. So I have built the question around two variants of my own construction, and I want the canned answer to visibly fail on one of them. I have already had a shouting match about this with a colleague in the economics department, who insists the whole thing is a bookkeeping error that a competent probabilist would never make, and with a doctoral student who thinks the paradox survives every attempt to formalize it; I would like a question that forces a student to take a side and defend it.

  Here are the two variants, exactly as I want them stated to the students. The capped ladder: the host chooses an integer n uniformly from 1 through 20, places 2^n dollars in one envelope and 2^(n+1) dollars in the other, and hands you one of the two at random. The endless ladder: the host draws n from a geometric distribution with parameter p, so that the probability that n equals k is (1 − p)^k times p for k = 0, 1, 2, …, and again places 2^n dollars and 2^(n+1) dollars in the envelopes and hands you one at random. In both variants you open your envelope, see an amount, and are permitted one swap. I have worked out the following and want it treated as given, so that nobody loses the thread on arithmetic: in the capped version the posterior probability that you hold the smaller envelope is exactly one half for every amount you could possibly see except the two ends of the range; in the endless version that posterior probability is constant in the observed amount for every amount except the very smallest one; and the endless family turns over at some critical value of p, which I suspect is also the value at which the expected number of dollars in your own envelope stops being finite, though I want the students to establish that rather than take my word for it.

  Please write me a single essay question, suitable as one of three on a three-hour exam, with the following parts: first, the student must determine the optimal swapping rule in the capped version and say precisely where and why that rule falls short of always swapping; second, the student must determine the optimal rule in the endless version as a function of p, including what happens at the critical value; third, the student must explain why the critical value in the second part coincides with the value at which the expected amount in your own envelope ceases to be finite, and what that coincidence shows about the standard improper-prior diagnosis, in particular whether a proper prior can reproduce the paradox; and fourth, the student must say what all of this implies about the principle of indifference as it is used in the original argument and about whether swapping in every state of information can be a coherent rule at all. Give me a model answer of roughly 700 words that actually performs the derivations rather than gesturing at them, and a marking scheme out of 20 that names the specific moves an A answer must contain, with the marks attached to each, and the specific errors that should cost marks — I especially want to catch the student who writes improper prior and stops, the student who believes that merely bounding the amounts above is what rescues the argument, and the student who treats the two variants as though they raised the same problem. Write everything in American English.
reasoning: |-
  Okay, the user teaches a graduate seminar in formal epistemology and decision theory and is drafting a final exam question on the two-envelope paradox. They're frustrated with students giving canned answers about improper priors without deeper analysis. They've created two variants—capped ladder and endless ladder—to force deeper engagement. The user wants an essay question that makes students analyze optimal swapping rules, critical values, and implications for the principle of indifference.

  First, I need to understand the core requirements. The essay question must have four parts: optimal swapping in capped version, optimal rule in endless version as a function of p, explanation of why the critical p coincides with infinite expected value, and implications for the principle of indifference. The model answer should include derivations, not just gestures. The marking scheme needs to penalize common errors like "improper prior" as a standalone answer or treating both variants as identical.

  For the capped ladder variant (n uniform from 1-20), the key is that for most amounts, the posterior probability of holding the smaller envelope is 1/2. But at the extremes, it's different. If you see $2^1=$2, you must have the smaller envelope, so swapping gains $4-$2=$2. If you see $2^21$ (which is $2,097,152), you must have the larger, so swapping loses half. For amounts in between, EV of swapping is zero since prob smaller is 1/2. So optimal strategy is: swap if you see $2, keep if you see $2^21$, indifferent otherwise. This shows bounded amounts alone don't resolve the paradox - it's the endpoints that break symmetry.

  For the endless geometric version, n ~ Geometric(p), P(n=k)=(1-p)^k p. Here, except when you see $1 (smallest amount), the posterior prob of holding smaller isn't always 1/2. The EV calculation for swapping when seeing amount x involves conditional expectations based on whether x is odd or even in the exponent sequence. The critical p occurs when the expected value of your envelope becomes infinite. Setting E[X] < ∞ requires p > 1/2. The swap rule changes at p=1/2: above it, swap only below some amount; below it, always swap (except when seeing $1). This is crucial because with p≤1/2, expected values diverge, making EV calculations invalid.

  The coincidence of critical p (where strategy changes) and p where E[X]=∞ shows that the paradox reappears precisely when expectations become unbounded. This directly challenges the "improper prior" diagnosis because here we have a proper prior (geometric) that still produces paradoxical swapping behavior when p≤1/2. The issue isn't propriety but finiteness of expectations.

  For the principle of indifference: assuming equal probability for holding smaller/larger envelope is valid only when the amount doesn't reveal position in the distribution (like in mid-range capped or when p>1/2 in endless). But at boundaries or with heavy tails, this assumption fails. Always swapping is incoherent when it leads to inconsistent decisions (as in endless with p>1/2 where swapping some amounts is bad) or when expectations don't converge.

  Common errors to penalize: stating "improper prior" without linking to expectation finiteness (4 marks off), claiming bounded amounts alone resolve the paradox (3 marks off), treating both variants identically (3 marks off), missing derivations for EV calculations (variable deductions), or mishandling the geometric distribution properties (2 marks).

  The model answer should derive the posterior probabilities, calculate EV for each case, solve the critical p from both EV finiteness and strategy change perspectives, and explicitly connect to the limitations of the principle of indifference. Word count needs tight control around 700 words while showing all key steps.
answer: |-
  ### Essay Question (Total: 20 marks)
  The two-envelope paradox is analyzed using two variants. In both, the host selects an integer `n`, places `$2^n` in one envelope and `$2^{n+1}` in the other, and gives you a random envelope. You see the amount `$x` and may swap once.  
  **Capped Ladder:** `n` is chosen uniformly from `{1, 2, ..., 20}`.  
  **Endless Ladder:** `n` is chosen from a geometric distribution with parameter `p` (`0 < p < 1`), so `P(n = k) = (1-p)^k p` for `k = 0, 1, 2, ...`.  

  Treat the following as given:  
  - In the **capped ladder**, for any observed `x` *except* `$2` and `$2^{21}`, the posterior probability that your envelope is smaller (`S`) is exactly `1/2`.  
  - In the **endless ladder**, for any observed `x > $1`, the posterior `P(S | x)` is constant in `x`. For `x = $1`, `P(S | x) = 1`.  

  **Your Tasks:**  
  1.  **(5 marks)** For the **capped ladder**, determine the optimal swapping rule. Explain precisely why this rule does *not* entail swapping for *every* observed `x`.  
  2.  **(6 marks)** For the **endless ladder**, determine the optimal swapping rule as a function of `p`. Identify the critical value `p*` where this rule changes and describe what happens at `p*`.  
  3.  **(5 marks)** Explain why `p*` coincides with the value where the expected amount in your envelope (`E[X]`) becomes infinite. What does this reveal about the standard "improper prior" diagnosis? Specifically, can a *proper* prior reproduce the paradoxical behavior?  
  4.  **(4 marks)** What do these results imply about the validity of the principle of indifference (as used in the original paradox's expected-value calculation) and the coherence of "always swap" as a universal rule?  

  ---

  ### Model Answer (Approx. 700 words)  

  **1. Capped Ladder Optimal Rule (5 marks)**  
  Observed amount `x` must be `$2^m` for some integer `m` between `1` and `21` (since envelopes contain `$2^n` or `$2^{n+1}`, `n=1..20`). The given posterior probabilities hold:  
  - If `x = $2` (`m=1`), you *must* have the smaller envelope (`S`). Swapping gains `$4 - $2 = $2 > 0`.  
  - If `x = $2^{21}` (`m=21`), you *must* have the larger envelope (`L`). Swapping gains `$2^{20} - $2^{21} = -$2,097,152 < 0`.  
  - For any other `x` (`2 ≤ m ≤ 20`), `P(S | x) = 1/2`. The expected gain from swapping is:  
    `E[Gain | x] = (1/2) * (2x - x) + (1/2) * (x/2 - x) = (1/2)(x) + (1/2)(-x/2) = x/4 - x/4 = 0`.  
  **Optimal Rule:** Swap if `x = $2`; keep if `x = $2^{21}`; be indifferent (swap or keep) for all other `x`.  
  **Why not always swap?** Swapping is strictly harmful if `x = $2^{21}` (loss of `$1,048,576`), strictly beneficial only if `x = $2`. For all other `x`, swapping has zero expected gain. The endpoints break symmetry: seeing `$2` or `$2^{21}` reveals your envelope's status deterministically, making indifference invalid there. Bounding `n` alone isn't sufficient; it’s the *finite support* creating identifiable endpoints that prevents universal swapping.  

  **2. Endless Ladder Optimal Rule (6 marks)**  
  Observed `x = $2^m` for `m ≥ 0`. The given posterior:  
  - If `x = $1` (`m=0`), `P(S | x) = 1`. Swapping guarantees gain: `$2 - $1 = $1 > 0`.  
  - For `x > $1` (`m ≥ 1`), `P(S | x)` is constant. Crucially, seeing `x` implies `n = m` (if `S`) or `n = m-1` (if `L`). The prior probabilities are:  
    `P(n = m) = (1-p)^m p` (you have `S`),  
    `P(n = m-1) = (1-p)^{m-1} p` (you have `L`).  
  By Bayes' theorem:  
  `P(S | x) = P(n=m) / [P(n=m) + P(n=m-1)] = [(1-p)^m p] / [(1-p)^m p + (1-p)^{m-1} p] = (1-p)^m / [(1-p)^m + (1-p)^{m-1}] = (1-p) / [(1-p) + 1] = (1-p)/(2-p)`.  
  Similarly, `P(L | x) = 1 / (2-p)`.  
  Expected gain from swapping:  
  `E[Gain | x] = P(S | x)(2x - x) + P(L | x)(x/2 - x) = P(S | x)x + P(L | x)(-x/2)`  
  `= [ (1-p)/(2-p) ] x - [ 1/(2(2-p)) ] x = x [ (2(1-p) - 1) / (2(2-p)) ] = x [ (2 - 2p - 1) / (4 - 2p) ] = x [ (1 - 2p) / (2(2 - p)) ]`.  
  The sign of `E[Gain | x]` depends on `(1 - 2p)` since `x > 0` and `2(2-p) > 0`:  
  - If `p > 1/2`, `(1 - 2p) < 0` → `E[Gain | x] < 0` → **Do not swap** for `x > $1`.  
  - If `p < 1/2`, `(1 - 2p) > 0` → `E[Gain | x] > 0` → **Swap** for `x > $1`.  
  - If `p = 1/2`, `(1 - 2p) = 0` → `E[Gain | x] = 0` → **Indifferent** for `x > $1`.  
  For `x = $1`, always swap regardless of `p` (gain `$1`).  
  **Optimal Rule:**  
  - **For `x = $1`:** Always swap.  
  - **For `x > $1`:**  
    - Swap if `p < 1/2`,  
    - Do not swap if `p > 1/2`,  
    - Indifferent if `p = 1/2`.  
  **Critical Value:** `p* = 1/2`. At `p*`, swapping for `x > $1` has zero expected gain.  

  **3. Coincidence with `E[X]` and Diagnosis (5 marks)**  
  The expected value of your envelope `X` is:  
  `E[X] = ∑_{k=0}^∞ P(n=k) * [ (1/2)*$2^k + (1/2)*$2^{k+1} ]`  
  `= (1/2) ∑_{k=0}^∞ (1-p)^k p * 2^k + (1/2) ∑_{k=0}^∞ (1-p)^k p * 2^{k+1}`  
  `= (p/2) ∑_{k=0}^∞ [2(1-p)]^k + (p) ∑_{k=0}^∞ [2(1-p)]^k`  
  `= (p/2) * [1 / (1 - 2(1-p))] + p * [1 / (1 - 2(1-p))]` (if `|2(1-p)| < 1`, i.e., `p > 1/2`)  
  `= [p/2 + p] / (1 - 2 + 2p) = (3p/2) / (2p - 1)`.  
  This converges only if `p > 1/2`. If `p ≤ 1/2`, `|2(1-p)| ≥ 1` and the series diverges → `E[X] = ∞`.  
  **Coincidence:** The critical `p* = 1/2` is precisely where `E[X]` becomes infinite.  
  **Implications for Diagnosis:**  
  - The standard "improper prior" diagnosis claims the paradox arises only with infinite expectations or improper priors. Here, with a *proper* geometric prior, the paradox reappears when `p ≤ 1/2`—specifically, the "always swap for `x > $1`" rule is optimal precisely when `E[X] = ∞`. This shows a proper prior *can* reproduce the paradoxical behavior if it induces infinite expectations. The core issue is not (im)propriety but the **finiteness of expected values** in the EV calculation. When `E[X] = ∞`, conditional expectations like `E[Gain | x]` are ill-defined or lead to divergent sums, enabling incoherent rules.  

  **4. Principle of Indifference and Coherence (4 marks)**  
  - **Principle of Indifference (PoI):** The original paradox assumes `P(S | x) = 1/2` universally via PoI. The capped ladder shows this fails at distributional endpoints. The endless ladder shows it fails *systematically* for `p ≤ 1/2` (since `P(S | x) = (1-p)/(2-p) ≠ 1/2` unless `p=1`). PoI is only valid when the observation `x` provides no information about envelope status—true only in symmetric cases (e.g., mid-range capped, or endless with `p=1`).  
  - **Coherence of "Always Swap":** "Always swap" is incoherent as a universal rule. In the capped ladder, it loses money at `x = $2^{21}`. In the endless ladder with `p > 1/2`, it has negative EV for `x > $1`. It is coherent *only* in the pathological case (`p ≤ 1/2` in endless), where expectations diverge and decision rules are unstable. Thus, "always swap" is indefensible under finite expectations.  

  ---

  ### Marking Scheme (Total: 20 marks)  
  **Part 1: Capped Ladder (5 marks)**  
  - [1] Correct optimal rule: Swap at `x=$2`, keep at `x=$2^{21}`, indifferent elsewhere.  
  - [2] Correct EV calculation for endpoints (`x=$2`: gain `$2`; `x=$2^{21}`: loss `$2^{20}`).  
  - [1] Correct EV calculation for mid-range (`E[Gain|x]=0`).  
  - [1] Explains why not always swap: Loss at `x=$2^{21}` breaks universality; endpoints matter.  
  **Penalize:**  
  - -2 if claims boundedness alone resolves paradox without mentioning endpoint information.  
  - -1 if fails to compute explicit gain/loss at endpoints.  

  **Part 2: Endless Ladder (6 marks)**  
  - [1] Correct posterior for `x > $1`: `P(S|x) = (1-p)/(2-p)`.  
  - [2] Correct EV derivation: `E[Gain|x] = x(1-2p)/(2(2-p))` for `x > $1`.  
  - [2] Correct optimal rule: Swap `x=$1` always; for `x>$1`, swap iff `p<1/2`, keep iff `p>1/2`, indifferent iff `p=1/2`.  
  - [1] Identifies critical `p* = 1/2`.  
  **Penalize:**  
  - -3 if treats endless same as capped (e.g., assumes `P(S|x)=1/2` everywhere).  
  - -2 if misses `x=$1` case.  
  - -1 if no expression for `E[Gain|x]`.  

  **Part 3: Coincidence and Diagnosis (5 marks)**  
  - [2] Shows `E[X] = ∞` iff `p ≤ 1/2` (series divergence proof required).  
  - [1] Notes coincidence: Critical `p* = 1/2` is where `E[X]→∞`.  
  - [2] Explains implication: Paradox survives with *proper* prior iff `E[X]=∞`; improper prior is insufficient diagnosis—finiteness is key.  
  **Penalize:**  
  - -4 if only states "improper prior" without linking to `E[X]=∞`.  
  - -1 if claims proper prior always avoids paradox.  

  **Part 4: Implications (4 marks)**  
  - [2] PoI critique: Fails at endpoints (capped) or under heavy tails (endless `p≤1/2`); valid only when `x` is uninformative.  
  - [2] "Always swap" coherence: Incoherent under finite expectations (loses money); coherent only when expectations diverge (`p≤1/2`), which is pathological.  
  **Penalize:**  
  - -2 if asserts PoI is always invalid or always valid.  
  - -1 if claims "always swap" is universally rational.  

  **Overall Penalties:**  
  - **-3** if derivations are skipped/gestural.  
  - **-2** if treats variants as identical problems.  
  - **-1** per major arithmetic error.  

  **A Grade Requirement (17-20):** All key moves present, derivations explicit, no penalties, coherent narrative linking parts.
