  ### **Decision Tree: Levels of Explanation in Macro-Micro Systems**

  **How to use:** Start at Q1 and follow the branches based on your answers about the case (e.g., "Do clusters like simmballs exist as more than just the sum of their parts?"). Each leaf provides a position name, its core commitment, and the cost it pays.

  ---

  #### **The Tree**
  1. **Q1: Do macro-entities (e.g., simmballs, traffic jams) exist as entities distinct from their micro-components?**  
     *(i.e., is the whole more than just the parts?)*  
     - **No** → **Eliminativism about macro-entities**  
       *Commitment: Macro-entities don't exist; only micro-components (e.g., simms, individual ants) are real.*  
       *Cost: Denies intuitive and scientific utility of macro-explanations (e.g., calling it a "traffic jam" helps us predict and act).*  
     - **Yes** → Proceed to Q2.

  2. **Q2: Can all macro-level behavior be fully predicted from micro-level rules alone?**  
     *(i.e., if you knew everything about the micro-components and their interactions, could you perfectly foresee macro-outcomes?)*  
     - **Yes** → Proceed to Q3.  
     - **No** → **Emergentist downward causation**  
       *Commitment: Macro-entities have novel causal powers (e.g., simmballs exert forces that aren't reducible to simms), including downward causation on micro-components.*  
       *Cost: Appears to violate physical laws (e.g., conservation of energy) by adding "new" causation.*  

  3. **Q3: Are macro and micro causal descriptions about the same events?**  
     *(i.e., is "the simmball pushed" just another way of saying "the simms moved in a clumped pattern" with no added meaning?)*  
     - **Yes** → **No-competition move**  
       *Commitment: Macro and micro describe identical events; asking "which one caused it" confuses description with reality.*  
       *Cost: Struggles to explain why macro-descriptions (e.g., "the ant colony decided") feel informative when micro-descriptions exist.*  
     - **No** → Proceed to Q4.  

  4. **Q4: Does macro-causal talk (e.g., "the simmball caused the movement") ever provide information not found in micro-causal talk?**  
     *(i.e., does it add explanatory value beyond redescription?)*  
     - **No** → **Straight causal exclusion**  
       *Commitment: Macro-causation is false or just a redescription; only micro-causes (e.g., simms) are real.*  
       *Cost: Renders most everyday and scientific explanations (e.g., "the traffic jam caused delays") literally false or empty.*  
     - **Yes** → Proceed to Q5.  

  5. **Q5: Is macro-causal information more sensitive to context than micro?**  
     *(i.e., does the usefulness of macro-explanations depend on pragmatic factors like our interests or scale?)*  
     - **Yes** → **Real-pattern pragmatism**  
       *Commitment: Macro-causes are "real" only as useful patterns for prediction/explanation given our cognitive limitations.*  
       *Cost: Makes causation subjective; what's "real" varies with context, risking anti-realism.*  
     - **No** → Proceed to Q6.  

  6. **Q6: Does macro-causal information capture "difference-making" better than micro?**  
     *(i.e., do macro-variables (e.g., simmball position) better isolate what changes the outcome under interventions?)*  
     - **Yes** → **Difference-making / interventionist accounts**  
       *Commitment: Macro-causes are robust difference-makers; e.g., intervening on simmball position changes outcomes more clearly than tweaking individual simms.*  
       *Cost: Micro-details can still be difference-makers (e.g., a single trader can trigger a panic), creating tension with macro-focus.*  
     - **No** → Proceed to Q7.  

  7. **Q7: Does macro-causal information abstract away micro-details to achieve proportionality?**  
     *(i.e., is macro "just right" in specificity—neither too granular (micro) nor too vague?)*  
     - **Yes** → **Proportionality**  
       *Commitment: Macro-causes are explanatory because they are proportional to effects (e.g., "traffic jam" explains delays better than atomic car-positions).*  
       *Cost: Requires accepting that proportionality defines causation, which may exclude precise physical causes.*  
     - **No** → **Program explanation**  
       *Commitment: Macro-properties "program for" micro-causes but aren't causes themselves; e.g., simmball structure programs for simm interactions.*  
       *Cost: Macro-properties aren't causal, so they explain without "doing" anything, which feels unsatisfying.*  

  #### **Deflationist pluralism** 
  - This position is not a leaf because it doesn't fit the tree's case-based logic. It answers Q1–Q7 with "it depends" and holds that causation is plural (no single answer). It is covered by the tree as a meta-position: anyone rejecting the tree's binary branches (e.g., denying Q3's yes/no) defaults here.  
  *Commitment: Causation isn't unified; macro and micro can both be "true" causes in different senses.*  
  *Cost: Avoids taking a stand on cases, risking incoherence when explanations conflict.*

  ---

  ### **Key to Positions**
  - **Eliminativism about macro-entities**: Macro-entities don't exist; only micro-components are real.  
  - **Emergentist downward causation**: Macro-entities have novel causal powers, including top-down effects.  
  - **No-competition move**: Macro and micro describe the same events; no competition.  
  - **Straight causal exclusion**: Macro-causation is false or mere redescription; only micro-causes exist.  
  - **Real-pattern pragmatism**: Macro-causes are real as contextually useful patterns.  
  - **Difference-making / interventionist accounts**: Macro-variables are better difference-makers under interventions.  
  - **Proportionality**: Macro-causes are explanatory due to optimal specificity (proportionality).  
  - **Program explanation**: Macro-properties program for micro-causes but aren't causal themselves.  
  - **Deflationist pluralism**: Causation is plural; no single answer applies to all cases.  

