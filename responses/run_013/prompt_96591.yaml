  Below is the decision tree for your reading group session on levels of explanation, built from the logical space of questions about the case itself (e.g., the careenium). The tree is designed to sort positions based on responses to concrete questions about the case, without relying on pre-existing "-isms". Each branch node is a question that can be answered directly from the case description, and every leaf is a named position with its key commitment and the primary cost of holding that view. The tree is tested against the careenium, a traffic jam, an ant colony exhibiting opinion-like behavior, and a market panic, with notes on which branches become implausible ("go dead") for each case.

  The tree has 9 leaves (within the 10-leaf limit), covering all requested positions. No two positions occupy the same leaf, as differences in the cases reveal distinct commitments. Answer-combinations not occupied by any position are listed at the end, with reasons for their emptiness.

