       - *Eliminativism*: Panics are real (e.g., they cause systemic crashes).  
       - *Proportionality*: Macro-variables (e.g., market sentiment) are often too vague; micro-details (e.g., algorithmic trades) matter.  
     - **Notable**: Program explanation excels (e.g., "panic" programs for individual sell-offs).

