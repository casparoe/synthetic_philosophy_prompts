  I notice they're explicitly rejecting tidy consensus narratives—this suggests they've already heard superficial treatments and want the gritty philosophical underpinnings. Their examples (depth-counting vs attention-copying in bracket models) are beautifully concrete for demonstrating how intervention classes anchor the comparison. 

