answer: |-
  Your friend's argument against middle knowledge is indeed problematic because, as you suspect, it proves too much: if sound, it would undermine not only middle knowledge but also divine foreknowledge and creaturely freedom more generally. Since your friend is a classical theist who affirms divine foreknowledge and creaturely freedom, she must reject this argument to avoid inconsistency. The error lies in step (3) of the argument, specifically the claim that the counterfactual of freedom (CF) is true "independently of anything Peter does." I'll explain why this step is flawed, what it costs to give it up, and how this affects the case against middle knowledge.

  ### The Core Issue: Step (3) and the "Independently" Claim
  Step (3) states: "The conditional, if true, is true before Peter exists and independently of anything Peter does, and Peter has no control over facts that antedate him." The problem is the phrase "independently of anything Peter does." This implies that the truth of the CF is wholly external to Peter's agency, making it a "brute fact" that operates independently of his choices. But this misrepresents how proponents of middle knowledge (e.g., Molinists) understand CFs. For them, CFs are true *because of* what Peter *would freely do* in the specified circumstances. That is:
  - The truth of the CF depends on Peter's counterfactual free action; it is not independent of it.
  - This dependence means Peter is the ultimate source of the action described in the CF, even though the CF itself is true prior to Peter's existence.

  By contrast, step (3) treats the CF as if it were a necessary or causal truth that constrains Peter from the outside, like a logical or physical law. But CFs are contingent truths grounded in the agent's free will. For example:
  - "If Peter were in the courtyard, he would freely deny Christ" is true because Peter, in those circumstances, would choose to deny Christ. Peter's free choice is what makes the CF true; it is not true in spite of or apart from his agency.
  - Similarly, in the case of divine foreknowledge (which your friend accepts), a future truth like "Peter will deny Christ" is true because Peter will freely choose to deny Christ. The truth depends on Peter's future action, not vice versa.

  If step (3) is correct and the CF is true "independently of anything Peter does," then Peter's freedom is indeed threatened, as the argument concludes. But this would also apply to future truths: if "Peter will deny Christ" is true before Peter exists and independently of his actions, then his future denial is fixed, and he cannot do otherwise. This leads to fatalism, which your friend rejects. Therefore, to preserve creaturely freedom and divine foreknowledge, your friend must reject the "independently" claim in step (3).

  ### Why Giving Up Step (3) Resolves the Problem
  Rejecting the "independently" part of step (3) allows for a consistent view of truth and freedom:
  - **For middle knowledge**: The CF is true before Peter exists, but its truth *depends* on Peter's counterfactual free action. Peter is the ultimate source of the action because the CF reflects what he would choose. When Peter is placed in the courtyard, his denial is free because it stems from his own agency—not from an external, deterministic truth.
  - **For divine foreknowledge**: The future truth "Peter will deny Christ" is true before it happens (e.g., in God's timeless knowledge), but its truth depends on Peter's future free action. Peter is still the source, and the prior truth does not rob him of the ability to do otherwise in a libertarian sense.

  This resolves the generalization problem you noted. The argument appears to show that no act is free because every act has a true description (e.g., a CF or a future truth) that predates it. But once we clarify that these truths *depend* on the agent's free actions, the threat vanishes. The prior truth is a description, not a constraint. As a result:
  - Step (6) ("Peter could not have done otherwise, and the source of his act lies outside him") no longer follows. If the CF depends on Peter's action, the source is Peter himself.
  - Step (7) (the incompatibility of middle knowledge and freedom) is avoided, as CFs can be true without undermining freedom.

  ### What Giving Up Step (3) Costs Your Friend's Case Against Middle Knowledge
  Giving up the "independently" claim in step (3) undermines your friend's argument against middle knowledge because it removes the key asymmetry she relies on to attack CFs while preserving divine foreknowledge. Specifically:
  - **Cost to her case**: Her argument against middle knowledge fails because it no longer shows that CFs uniquely threaten freedom. If CFs depend on creaturely freedom (just as future truths do), then middle knowledge is no more problematic than divine foreknowledge. This forces her to either:
    - Abandon her opposition to middle knowledge, as it becomes compatible with freedom in the same way foreknowledge is, or
    - Find another argument against middle knowledge that doesn't rely on this flawed premise (e.g., by questioning whether CFs can be true or how God knows them).
  - **Cost to her broader view**: She must consistently apply this dependence principle to both CFs and future truths. This means affirming that prior truths (whether CFs or future contingents) do not causally determine actions but are grounded in the agent's free will. This is a standard move in classical theism (e.g., in Thomism or Molinism), but it requires her to reject any view that treats prior truths as externally constraining.

  ### Your Preference: Keeping (5) Over (3)
  You mentioned you would rather keep step (5) (the definition of free will requiring the ability to do otherwise and ultimate sourcehood) than step (3). This is reasonable and aligns with libertarian free will, which many classical theists accept. By rejecting step (3), you can preserve (5) without falling into fatalism:
  - **How (5) is preserved**: If the CF depends on Peter's action, then when Peter is in the courtyard, he could have done otherwise in the sense that:
    - He has the power to choose not to deny Christ (even if he wouldn't exercise it in those circumstances).
    - The source of the action is Peter, not the prior truth, because the truth reflects his choice.
  - **No cost to (5)**: Giving up step (3) doesn't force you to modify (5). Instead, it clarifies that prior truths do not negate the ability to do otherwise or ultimacy. For instance, Peter could have had a different character or dispositions such that the CF was false, but given who he is, he freely chooses as he does. Ultimacy is maintained because the choice originates in Peter, not in the CF.

  ### Conclusion
  The error in your friend's argument is step (3)'s claim that the counterfactual of freedom is true "independently of anything Peter does." This must be rejected because it misrepresents CFs as external constraints rather than descriptions dependent on Peter's free agency. Giving up this claim:
  - Rescues creaturely freedom by showing that prior truths (for both CFs and future events) depend on the agent's actions.
  - Prevents the argument from proving too much (i.e., denying all freedom).
  - Costs your friend her case against middle knowledge by removing the basis for treating CFs as uniquely freedom-threatening. If she maintains her classical theism, she should accept that middle knowledge is compatible with freedom, just as divine foreknowledge is.

  If you keep (5) and reject the "independently" part of (3), you pay no real cost to your view of freedom. Instead, you gain a consistent account of how truth and freedom coexist. For further study, you might explore Molinist responses to this objection (e.g., in works by William Lane Craig or Thomas Flint) or classical compatibilist approaches to foreknowledge (e.g., in Boethius or Aquinas). This will help you defend middle knowledge or refine your friend's argument without falling into fatalism.
