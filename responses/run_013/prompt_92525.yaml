prompt: |-
  I commission long-form features for a history magazine and we're launching a series on societies that 'fell' -- the Late Bronze Age world, the Classic Maya, Rapa Nui, that sort of thing. The trouble is every writer means something different by collapse: some mean a state loosing its grip, some mean a whole population going under, some mean a civilisation that just changed and carried on, and our house style is loose enough that it all slides through. I want a decision procedure I can hand to writers and fact-checkers -- a checklist or a flowchart in words, not an essay. Start from the point that a collapse claim is always relative to a stated system and a baseline, so the first questions have to fix what's supposed to be collapsing and against when. Then the ordered questions that pin down the claim, what evidence would settle each, where the answer comes out as not-collapse (keep decline, reorganisation, absorption and plain abandonment apart from each other), and where it's genuinely a values call about what counts as a society failing, which has to come to me rather than the writer. It has to be usable by someone who's read none of the archaeological debate, so keep the theory in the background -- but don't let it disappear: if there's a real distinction from the literature that has to survive the simplification, keep it and say why. Then run it on two cases, the Classic Maya and Rapa Nui, including one where it gives an answer our writers won't like. Finish with what the procedure can't do. British English please.
reasoning: |-
  Okay, the user is commissioning long-form features for a history magazine about societies that 'fell' - like the Late Bronze Age, Classic Maya, and Rapa Nui. They're frustrated because every writer defines "collapse" differently: sometimes it's a state losing control, other times a population decline, or just societal change. The magazine's house style is loose, so inconsistent definitions slip through.

  The user needs a practical decision procedure for writers and fact-checkers - a checklist or flowchart, not an essay. It must start by defining what's collapsing and the baseline. Then it should have ordered questions to pin down the claim, evidence required, and distinguish collapse from decline, reorganisation, absorption, or abandonment. Where it's a values call about societal failure, that should escalate to the user.

  The procedure must be usable by someone without archaeological expertise but keep key theoretical distinctions. It should be in British English. They want it tested on the Classic Maya and Rapa Nui cases, with one outcome writers won't like, and end with limitations.

  I'll structure this as a clear decision procedure with five steps. First step: define the system (what's collapsing - population? territory? institutions?) and baseline (against which period). Second step: identify terminal symptoms across five dimensions - political control, population, urbanism, economy, culture. For each, ask what evidence would confirm change.

  Third step: assess scale and simultaneity - how widespread and coordinated the changes were. Fourth step: apply exclusion tests to rule out non-collapse scenarios like managed decline, functional reorganisation, absorption, or abandonment. Fifth step: if it passes exclusions, determine if it's collapse or requires editorial judgment call.

  For Classic Maya, I'll show it likely wasn't total collapse (reorganisation continued in north), which writers may dislike. For Rapa Nui, I'll show near-total collapse fits. Limitations include evidence gaps, Eurocentric biases in defining "collapse," and cases where decline was self-sabotage versus environmental factors.

  The key is balancing simplicity with academic rigor - keeping essential distinctions like Tainter's collapse vs transformation while avoiding jargon. British English terms like "centred" not "centered" throughout.
answer: |-
  Here's a practical decision procedure for assessing "collapse" claims for your magazine series, designed for writers and fact-checkers. It focuses on defining the specific system, establishing a baseline, and applying clear tests based on observable evidence.

  **DECISION PROCEDURE: ASSESSING SOCIETAL COLLAPSE CLAIMS**

  **Core Principle:** "Collapse" is not a universal state. It's a claim about *a specific system* failing relative to *a specific baseline period*. Always define these first.

  **Step 1: Define the System & Baseline (MUST be answered first)**
  *   **Q1: What specific system is claimed to have collapsed?** *(e.g., The political state controlling City X? The population density in Region Y? The entire Classic Maya socio-political order? The monumental statue-building culture on Rapa Nui?)*
      *   *Evidence Needed:* Clear definition of the system's core elements (e.g., ruling dynasty, urban centres, population level, key cultural practices).
  *   **Q2: Against which baseline period is collapse being measured?** *(e.g., Compared to the peak of the Classic Maya period (c. 250-900 CE)? Compared to pre-European contact Rapa Nui?)*
      *   *Evidence Needed:* Clear timeframe reference and characteristics of the system *during that baseline period*.

  **Step 2: Identify Terminal Symptoms (What actually happened?)**
  Ask these questions about the period *after* the supposed collapse event(s), compared to the Baseline (Q2):
  *   **Q3: Political Control:** Did centralised authority (rulers, elites, administrative centres) lose control over its core territory?
      *   *Evidence Needed:* Abandonment of palaces/capitals, end of royal inscriptions/dynasties, evidence of invasion/fragmentation, loss of territorial markers.
      *   *Not-Collapse Indicator:* Power shifts between centres, dynastic changes *without* systemic loss of control.
  *   **Q4: Population:** Did the population within the system's core area decline significantly and rapidly?
      *   *Evidence Needed:* Archaeological settlement surveys (abandoned villages/towns), paleodemography (skeletal/botanical data), evidence of famine/disease.
      *   *Not-Collapse Indicator:* Gradual decline, population movement/relocation *within* the region, stable population post-change.
  *   **Q5: Urbanism & Monumentality:** Were major urban centres and/or monumental construction projects largely abandoned?
      *   *Evidence Needed:* Archaeological evidence of building cessation/decay, lack of maintenance, shift to smaller/non-monumental settlements.
      *   *Not-Collapse Indicator:* Shift in building *style* or *location*, continued construction at a reduced scale, functional changes to existing structures.
  *   **Q6: Economic Complexity:** Did long-distance trade networks, specialised craft production, or elite-controlled surplus economies break down?
      *   *Evidence Needed:* Disappearance of imported goods, simplification of material culture, end of specialised workshops, evidence of localised subsistence focus.
      *   *Not-Collapse Indicator:* Shift in trade partners or goods, adaptation to new economic realities, simplification as a *choice* (e.g., religious reform).
  *   **Q7: Cultural Continuity:** Did key cultural practices and identity markers (e.g., writing, elite iconography, major religious rituals) *cease* within the core area?
      *   *Evidence Needed:* End of inscriptions/iconography in traditional styles, abandonment of major ritual sites, replacement by distinctly different cultural markers.
      *   *Not-Collapse Indicator:* Evolution/adaptation of cultural practices, persistence of core beliefs/identity in new forms, syncretism.

  **Step 3: Assess Scale & Simultaneity**
  *   **Q8: Were the changes identified in Q3-Q7 widespread across the system's *core area*?** (Not just one city or region).
  *   **Q9: Did these changes occur within a relatively short timeframe (e.g., 1-3 generations, ~50-100 years)?** (Significantly faster than the system's historical rate of change).

  **Step 4: Apply Exclusion Tests (Is it REALLY collapse?)**
  If significant changes occurred in Q3-Q7, widespread (Q8) and rapid (Q9), check if it fits a clearer non-collapse category:
  *   **A. Managed Decline:** Was the change gradual, planned, or a strategic retreat? *Evidence:* Planned abandonment, orderly relocation, continued cultural identity elsewhere.
  *   **B. Functional Reorganisation:** Did the system transform but key functions (sustaining population, identity, local order) continue, even if scaled down? *Evidence:* Shift to smaller-scale polities/villages, adaptation of cultural practices, continued habitation.
  *   **C. Absorption:** Was the system integrated into a different, larger system? *Evidence:* New cultural/political markers *replacing* old ones, evidence of conquest/migration/integration, continuation *within* a new framework.
  *   **D. Plain Abandonment:** Was the area deserted for specific reasons (e.g., environmental shift making habitation impossible) *without* necessarily implying systemic failure elsewhere? *Evidence:* Move to equally viable areas, no evidence of societal breakdown *preceding* abandonment.

  **Step 5: The Collapse Call**
  *   If **significant, widespread, rapid** decline occurred across **multiple core dimensions** (Q3-Q7, with Q8 & Q9) and **does NOT fit** A, B, C, or D in Step 4, then "Collapse" is a valid description for that system relative to its baseline.
  *   If it **DOES fit** A, B, C, or D, use that term instead (e.g., "Reorganisation," "Absorption").
  *   **Values Call Escalation:** If evidence is ambiguous, OR if the *significance* of the changes (e.g., "Did society *fail* if the population survived but lost its elite culture?") is debatable **even after** the above steps, flag this as a **"Values Call - Escalate to Commissioning Editor"**. Explain the ambiguity (e.g., "Major political collapse and urban abandonment occurred, but population in rural areas persisted with adapted culture – is this systemic failure or reorganisation?").

  ---

  **Applying the Procedure: Case Studies**

  **1. The Classic Maya (System: Classic Lowland Maya socio-political order; Baseline: c. 750 CE - peak complexity)**
  *   **Q3 (Political):** YES. Widespread abandonment of royal courts, end of dynastic inscriptions and monument carving by kings.
  *   **Q4 (Population):** YES. Significant population decline in southern lowland core areas.
  *   **Q5 (Urbanism):** YES. Major centres like Tikal, Calakmul abandoned as political/ceremonial hubs.
  *   **Q6 (Economic):** YES. Breakdown of long-distance trade (e.g., obsidian, jade), elite craft production ceases.
  *   **Q7 (Cultural):** YES. Cessation of Long Count calendar use, royal iconography, and construction of corbel-vaulted temples in the south.
  *   **Q8 (Widespread):** YES in Southern Lowlands. NO in Northern Lowlands (e.g., Chichen Itza, Uxmal flourished later).
  *   **Q9 (Rapid):** YES in specific centres (often within decades), but varied regionally (~150 year process across south).
  *   **Step 4 (Exclusions):**
      *   **A. Managed Decline?** NO. Evidence points to crisis (warfare, drought).
      *   **B. Reorganisation?** PARTIAL in North. In South, core political/urban/elite culture *ended*.
      *   **C. Absorption?** NO. Not conquered by external power *during* collapse.
      *   **D. Abandonment?** NO. Abandonment was *symptom* of systemic failure.
  *   **Step 5 (Call):** **Collapse** of the *Classic Lowland Southern Maya socio-political order* relative to its 750 CE baseline. **BUT: Values Call Escalation Point:** Northern centres continued/reorganised, Maya people and culture persisted. Writers must specify *which* system collapsed (Southern Classic Order) and avoid implying total disappearance.

  **2. Rapa Nui (Easter Island) (System: Monolithic statue (moai) building culture & its socio-political structure; Baseline: c. 1600 CE - peak statue transport/erection)**
  *   **Q3 (Political):** YES. Evidence of violent overthrow of elite (oral history, mata'a spear points), breakdown of clan/chiefdom authority linked to moai.
  *   **Q4 (Population):** YES. Significant decline (debated scale) likely due to environmental degradation and conflict.
  *   **Q5 (Urbanism/Monumentality):** YES. Abrupt cessation of moai quarrying, transport, and erection. Abandonment of ceremonial platforms (ahu).
  *   **Q6 (Economic):** YES. Complex statue-moving economy vanished. Shift to survival focus.
  *   **Q7 (Cultural):** YES. Core practice of moai building/ancestor veneration ceased. Replaced by Birdman cult.
  *   **Q8 (Widespread):** YES. Island-wide phenomenon.
  *   **Q9 (Rapid):** YES. Evidence suggests major changes within 1-2 generations (~50-100 years) in late 17th/early 18th century.
  *   **Step 4 (Exclusions):**
      *   **A. Managed Decline?** NO. Evidence points to crisis (resource depletion, conflict).
      *   **B. Reorganisation?** YES, BUT... The new Birdman cult emerged *after* the core statue-building system had already disintegrated. The *previous system* ceased.
      *   **C. Absorption?** NO. Pre-dates significant European contact/influence on the *collapse event*.
      *   **D. Abandonment?** NO. People remained, but the core system ended.
  *   **Step 5 (Call):** **Collapse** of the *moai-building socio-political system* relative to its 1600 CE baseline. The society underwent radical, rapid, and fundamental change. Writers must specify *what* collapsed (the statue culture's structure), not the population extinction (which happened later due to European impacts).

  **What the Procedure CANNOT Do:**

  1.  **Fill Evidential Gaps:** It relies on available archaeological/historical evidence. If evidence is scant (e.g., precise population figures, exact timelines), conclusions will be tentative.
  2.  **Define "Significance":** Judging how much decline is "significant" (Q3-Q7) or how "rapid" is rapid enough (Q9) involves some inherent subjectivity, though evidence should guide it.
  3.  **Override Genuine Scholarly Debate:** Where experts fundamentally disagree on interpretation of *the same evidence* (e.g., primary cause of Maya collapse), the procedure can structure the argument but won't magically resolve it. Represent the debate fairly.
  4.  **Completely Eliminate Eurocentric Bias:** The focus on "complexity" (cities, writing, monuments) reflects Western historical priorities. The procedure mitigates this by requiring precise system definition (Step 1) and allowing for functional reorganisation (Step 4B), but writers should remain mindful.
  5.  **Distinguish "Self-Inflicted" vs. "External" Collapse:** It identifies *that* a system collapsed relative to its baseline and *what* changed, but not necessarily the moral framing (e.g., "ecocide" vs climate change vulnerability). That requires separate causal analysis.
  6.  **Handle "Dark Ages" Perfectly:** Periods with very poor evidence following a decline (e.g., post-Roman Britain) are tricky. The procedure highlights the evidential gap but can't confirm continuity or total collapse without data.

  This procedure provides a structured, evidence-led way to define "collapse" rigorously for your features. It forces specificity, separates observable change from interpretation, and flags genuine ambiguities for editorial oversight.
