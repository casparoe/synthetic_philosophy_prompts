  We are going to write a dialogue between two philosophers: 
   - Let's call the first speaker **Orthodox** (defending the view that learning is conditioning on certain evidence). 
   - The second speaker **Revisionist** (defending the view that all evidence is uncertain and learning is re-weighting by experience without conditioning on certainties).

   We'll structure the dialogue as follows:
   1. Orthodox states their position and the standard picture (conditioning on certain evidence).
   2. Revisionist states their alternative (Jeffrey conditionalization, or a similar rule for uncertain evidence).
   3. They discuss the first concrete case: the researcher who realizes that her theory entails a fact she has known all along (the old evidence problem).
   4. They discuss a second concrete case chosen to show a difference in verdicts: perhaps a case of perceptual uncertainty (e.g., seeing a cloth in dim light and updating about its color) where the two methods yield different results.
   5. They address the commutativity issue (order of evidence).
   6. They try to locate the substance of the disagreement and whether it's more than bookkeeping.

