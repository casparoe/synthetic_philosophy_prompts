   **Revisionist**: But then we are stuck with the old evidence problem and the regress of certainty. Let's try to locate the substance. I think the real difference is about what we take as the input to learning. You think the input is a certain proposition about experience. I think it's a change in the credences over a partition. And that difference might be just bookkeeping if we always can translate one to the other.

   **Orthodox**: But in the coin example, we saw that they lead to different results when mixed with certain evidence. And note: in your rule, we needed to specify the partition and the new credences over it. In my rule, we condition on a proposition. So the input is different. And that input might be subjective: how we choose to describe the experience.

   **Revisionist**: And that's where the bookkeeping part ends and the substance begins. You think that there is an objective fact about the experience that we condition on. I think that we are free to choose the partition and the new weights, and that choice is subjective. But both are representations of the same underlying experience. And both are approximations.

   **Orthodox**: But then we are both doing bookkeeping, but the bookkeeping has different consequences.

   **Revisionist**: Exactly. So the substantive disagreement is whether we can ever be certain about any proposition, even about our own experience. And I say no, we cannot. And that's why I prefer to represent learning as a shift in credences over a partition without ever going to certainty.

   **Orthodox**: And I say that we can be certain about the experience, and that's the only way to avoid the non-commutativity and other problems.

   **Revisionist**: But then we have the dogmatism and the old evidence problem. So we have to choose our poison.

   **Orthodox**: Fair enough. Maybe we can agree that both are useful in different contexts.

   **Revisionist**: I can live with that. But I still think that the Jeffrey framework is more honest about our uncertainty.

   **Orthodox**: And I think it introduces unnecessary subjectivity. But let's agree to disagree. And next time, let's meet in a room with a working radiator.

   **Revisionist**: Deal.
answer: |-
  ### Dialogue on Certain vs. Uncertain Evidence  
  **Characters:**  
  - **Orthodox (O):** Defends the view that learning requires conditioning on certain evidence (propositions with credence 1).  
  - **Revisionist (R):** Defends the view that all evidence is uncertain (credence <1), and learning re-weights existing possibilities without conditioning on certainties.  

  **Setting:**  
  A seminar room, post-reading group, radiator still broken. Coffee cups litter the table.  

  ---

  ### Scene 1: Stating Positions  
  **O:** Let’s reset. I argue that learning *must* begin with evidence you’re certain of—like "I see the dial pointing to 5"—and you condition on that. If you’re uncertain about the dial, you’re actually conditioning on a *certainty about your experience*, like "the dial *appeared* to show 5." Without that anchor, updating is arbitrary.  

  **R:** But that’s the crux: certainty is just a credence of 1. Nothing empirically grounded deserves absolute certainty. When you see the dial, you’re uncertain whether it’s accurate, malfunctioning, or a hallucination. Learning *is* the shift in your credences across a partition (e.g., "dial reads 5," "dial reads 6") due to experience. The conditional probabilities within each cell stay fixed; only the weights change.  

  **O:** So you endorse Jeffrey conditioning? If experience redistributes your credences over partition {E₁, E₂, ...}, your new credence in H is ∑ Pₒₗ𝒹(H|Eᵢ) × Pₙₑ𝓌(Eᵢ). But how is that basic? It *presupposes* the partition and weights.  

  **R:** Exactly—experience directly re-weights possibilities. Conditioning on "appearances" is redundant. You *think* you’re certain of "I saw blue," but that’s just high credence. Push further: are you certain of the neural signature of "seeing blue"? Uncertainty never ends.  

  **O:** Fair, but your approach invites chaos. Mine grounds learning in objective input. Let’s test both with cases.  

  ---

  ### Scene 2: Case 1 – The Old Evidence Problem  
  **R:** You recall the researcher: she’s known for years that Mercury’s perihelion precesses (call it E). She then learns her theory T entails E. Intuitively, she becomes more confident in T. But if she was *certain* of E, P(E)=1, and conditioning on T→E does nothing—since P(T→E) = P(¬T ∨ E) = 1 when E is true. Your view can’t explain her update.  

  **O:** Right, this embarrasses my side. Standard fix: she wasn’t *truly* certain of E. Perhaps she allowed a tiny credence that E was mismeasured. When she sees T entails E, she updates P(T) upward via Bayes.  

  **R:** That’s my point! If you admit she was never certain of E, you concede evidence is always uncertain. She updates by re-weighting {T, ¬T} based on the entailment.  

  **O:** But I relocate certainty: she *is* certain of her *memory* of E. Conditioning on "I recall E being true" *plus* "T entails E" works—if she trusts memory.  

  **R:** Dogmatism! What if her memory feels fuzzy? You retreat to "I recall the *feeling* of certainty," ad infinitum. My view accepts uncertainty upfront: entailment evidence re-weights T by her credence in E’s reliability.  

  **O:** Conceded—this case strains my "certainty-first" view. But yours has its own flaws.  

  ---

  ### Scene 3: Case 2 – Perceptual Uncertainty (Divergent Verdicts)  
  *Setup:* A cloth is either blue (B) or green (G). A researcher sees it in dim light, then in bright light.  
  - **Dim light experience:** Ambiguous; she sets Pₙₑ𝓌(B) = 0.6, Pₙₑ𝓌(G) = 0.4.  
  - **Bright light experience:** Clear blue; she sets Pₙₑ𝓌(B) = 0.99.  
  Hypothesis H: "The cloth is made of cotton."  
  Prior: P(B) = 0.5, P(H|B) = 0.7, P(H|G) = 0.3.  

  **Revisionist’s Approach (Jeffrey Conditioning):**  
  - Step 1 (dim light): P₁(H) = P(H|B) × P₁(B) + P(H|G) × P₁(G) = (0.7)(0.6) + (0.3)(0.4) = 0.54.  
  - Step 2 (bright light): P₂(H) = P(H|B) × P₂(B) + P(H|G) × P₂(G) = (0.7)(0.99) + (0.3)(0.01) = 0.696.  
  Final P(H) = 0.696.  

  **Orthodox’s Approach (Conditioning on Certainties):**  
  - Step 1 (dim light): Condition on appearance proposition A₁: "It appeared somewhat blue."  
    P(B|A₁) = 0.6 (from prior reliability data).  
    P₁(H) = P(H|A₁) = P(H|B) × P(B|A₁) + P(H|G) × P(G|A₁) = (0.7)(0.6) + (0.3)(0.4) = 0.54.  
  - Step 2 (bright light): Condition on A₂: "It appeared unambiguously blue."  
    P(B|A₂) = 0.99 (prior reliability).  
    P₂(H) = P(H|A₂) = (0.7)(0.99) + (0.3)(0.01) = 0.696.  
  Final P(H) = 0.696.  

  **O:** Same result! Your "re-weighting" just hides conditioning on appearances.  

  **R:** Try reversing the order: bright light *first*, then dim light.  

  **O:**  
  - Step 1 (bright light): P₁(H) = P(H|A₂) = 0.696.  
  - Step 2 (dim light): Now condition on A₁. But A₁ ("appeared somewhat blue") must be compatible with A₂ ("appeared unambiguous"). If A₂ implies A₁, P(A₁|A₂)=1, so P₂(H) = P₁(H|A₁) = P₁(H) = 0.696.  
  Same answer. Order doesn’t matter if evidence is certain.  

  **R:** In *my* rule, reversing order *changes* the result:  
  - Step 1 (bright light): P₁(H) = (0.7)(0.99) + (0.3)(0.01) = 0.696.  
  - Step 2 (dim light): Reapply Jeffrey to {B,G} with P₂(B)=0.6.  
    P₂(H) = P₁(H|B) × 0.6 + P₁(H|G) × 0.4.  
  But P₁(H|B) = ? Jeffrey assumes P(·|B) is unchanged, so P₁(H|B) = Pₒₗ𝒹(H|B) = 0.7.  
  Thus P₂(H) = (0.7)(0.6) + (0.3)(0.4) = 0.54.  
  **Final P(H) = 0.54 — different from 0.696!**  

  **O:** There it is! Order-dependence. If bright light first, you end at 0.54; if dim light first, at 0.696. But the total evidence is the same: one ambiguous experience, one unambiguous. Order shouldn’t matter.  

  **R:** It *should*! The bright light experience changes how I interpret the dim one. After seeing clear blue, the dim experience feels less informative—maybe the cloth *is* blue, but the light was poor. My credence for B is 0.99 after bright light; when dim light then only nudges it to 0.6, I’m skeptical.  

  **O:** Arbitrary! In reality, I’d treat the bright light as decisive. Your rule forces order-dependence because it freezes conditional probabilities. Mine doesn’t.  

  **R:** Your "appearance propositions" assume A₁ and A₂ are consistent. What if the dim experience felt "green-tinged" but bright was "pure blue"? Then A₁ and A₂ conflict. Conditioning fails unless you redefine the partition.  

  **O:** I’d condition on the *sequence*: "A₁ then A₂." Still commutative.  

  ---

  ### Scene 4: Commutativity and the Bookkeeping Dispute  
  **R:** You appeal to ever-finer descriptions of experience. But that’s my "elaborate description" regress! Where does it end?  

  **O:** When you reach propositions you’re willing to treat as certain. Your re-weighting is also bookkeeping: you choose the partition (e.g., "B or G") and new weights. But why not {B, ¬B}? Or include lighting hypotheses? Choices!  

  **R:** True, but I’m not committed to certainty. Still, let’s settle your commutativity point. My rule *is* order-dependent for uncertain evidence. But so what? Evidence isn’t always order-independent. If I hear a rumor then see a photo, versus see the photo first, I update differently—the photo dominates.  

  **O:** In your cloth case, both experiences are about the *same* thing—color under light. Order *shouldn’t* matter. Your rule makes rationality path-dependent in odd ways.  

  **R:** I concede it’s a flaw, but it’s the price of modeling uncertain evidence directly. You avoid it by burying uncertainty in "appearances." But that’s bookkeeping! The substance is: do experiences *give* us certain propositions? I say no.  

  **O:** And I say they *must*, or learning is ungrounded. But let’s locate the boundary. Once you accept that conditioning on certainties is *one way* to model learning, and Jeffrey’s is another, the rest is bookkeeping.  

  **R:** Agreed. The real disagreement starts when you insist that experience *provides* certainties. I say it only prompts re-weighting.  

  **O:** Exactly. For me, certainty anchors learning; for you, it’s a ladder to kick away.  

  **R:** Well said. I’ll grant your approach avoids order-dependence, but I’ll keep my radiators.  

  **O:** And I’ll grant that old evidence needs uncertainty. But I’m keeping my certainties.  

  **R:** Truce?  

  **O:** Truce. Now let’s find a warmer room.  

  ---  

  ### Summary of Key Resolutions  
  1. **Old Evidence:** Both concede the researcher likely had non-1 credence in E. Orthodox relocates certainty to "memory of E"; Revisionist treats entailment as uncertain evidence.  
  2. **Perceptual Case:**  
     - Orthodox and Revisionist agree when evidence order is fixed.  
     - **Divergent Verdict:** When order reverses, Revisionist’s rule gives different results (0.696 vs. 0.54); Orthodox’s does not.  
     - **Commutativity:** Revisionist concedes order-dependence is a flaw but argues it reflects real cognitive paths. Orthodox argues it violates rationality.  
  3. **Substance vs. Bookkeeping:**  
     - **Bookkeeping:** Both agree that describing learning as "conditioning on certainties" or "re-weighting partitions" can model the same process.  
     - **Substance:** The dispute begins over whether experience *provides* propositions we can be certain of (Orthodox) or only prompts shifts in credence over existing possibilities (Revisionist).  
  4. **Concessions:**  
     - Orthodox concedes old evidence requires non-1 credences to update.  
     - Revisionist concedes order-dependence is a cost of their view.  

  Both positions stand unrefuted but bear their own burdens: Orthodox’s "certainty" risks dogmatism, Revisionist’s flexibility risks path-dependence. The dialogue ends with mutual understanding, if not agreement.
