answer: |-
  Here's a straight-from-scratch reasoning on your question-shift view compared to contextualism and pragmatic encroachment, point by point:

  **1. Question-Shift vs. Pragmatic Encroachment (Distinctness & Prediction Difference)**
  *   **Distinct? Yes.** Encroachment says stakes *directly alter the epistemic status* (knowledge) of the same proposition for the subject. Question-shift says stakes *alter which proposition the subject needs to act upon*, while leaving the epistemic status of the original proposition untouched.
  *   **Case Where Predictions Diverge:** The **"Oblivious High-Stakes"** case.
      *   *Scenario:* Sarah has excellent evidence the pharmacy closes at 9 (website, called yesterday). She needs toothpaste *only* (low stakes). She forms the belief P: "The pharmacy closes at 9." Later, unbeknownst to her, her child develops a sudden, life-threatening fever requiring medicine *only available at that pharmacy*. The stakes are now immense, *but she has no idea*. She still just needs toothpaste and holds belief P based on the same evidence.
      *   **Pragmatic Encroachment:** The stakes for *Sarah* are now objectively high, even if she doesn't know it. This *lowers the epistemic standard Sarah must meet to count as knowing P*. Her evidence, sufficient for low-stakes knowledge of P, is now *insufficient* for high-stakes knowledge of P. She *does not know P* in this high-stakes context.
      *   **Question-Shift:** Sarah's *practical question* hasn't changed. She still only needs to answer "Is the pharmacy open till 9 so I can get toothpaste?" She knows the proposition P ("closes at 9") that answers *this* question. The high stakes (unknown to her) create a *potential new practical question* ("Can I *absolutely count on* the pharmacy being open?" - Q), requiring a different proposition (perhaps one involving more certainty/backup plans). But since Sarah isn't addressing Q, she still knows P, the proposition answering her *actual* question.
      *   **Difference:** Encroachment says Sarah loses knowledge of P due to high stakes. Question-Shift says she retains knowledge of P because her practical question remains the low-stakes one.

  **2. Question-Shift vs. Contextualism (Distinctness & Prediction Difference)**
  *   **Distinct? Yes.** Contextualism says the *meaning/truth-conditions* of "S knows that P" shift with the attributor's context. Question-shift says knowledge attributions track the *subject's practical question*, not the attributor's conversational context. Knowledge itself is invariant.
  *   **Case Where Predictions Diverge:** The **"Subject-Centered vs. Skeptical Lawyer"** case.
      *   *Scenario:* Ben, needing cheap packing tape, sees "Open until 9" on the store door (P). He believes P. He tells his friend: "I know it's open till 9, I'll grab tape later." Later, a skeptical lawyer, discussing reliability of store signs in general, says about Ben: "He didn't *know* it was open till 9; signs can be wrong."
      *   **Contextualism:** In the friend's low-stakes context, "Ben knows P" is true. In the lawyer's high-stakes/skeptical context, "Ben knows P" is false. The word "knows" means different things/requires different standards in the two contexts. Ben's epistemic state is fixed, but the truth of the knowledge *attribution* changes.
      *   **Question-Shift:** Ben's practical question was "Is this store open till 9 so I can get cheap tape?" P ("Open until 9") answers *that* question, and Ben knew P (based on the sign). The lawyer's skepticism raises a *different* question ("Is the sign *absolutely reliable* proof the store is open till 9?" - Q). Ben didn't know the proposition needed to answer *that* question. But attributing knowledge or lack thereof should track the *subject's* relevant practical question. So "Ben knows P" (relative to his practical question) remains true, regardless of the lawyer's context. The lawyer is simply talking about a different, stricter proposition (Q) needed for a different question.
      *   **Difference:** Contextualism says the lawyer's *attribution* "Ben doesn't know" is true (in his context). Question-shift says the lawyer is either wrong about Ben not knowing P (relative to Ben's question) or is talking about a different proposition (Q) needed for a question Ben wasn't asking. Ben still knew P for his purpose.

  **3. Stakes Awareness & the Oblivious High-Stakes Case (Revisited)**
  *   **Pragmatic Encroachment:** As above, says the oblivious subject *loses knowledge* of P due to the objective high stakes. Their evidence is no longer sufficient. This seems problematic – their belief and evidence haven't changed, and they aren't being reckless *from their perspective*.
  *   **Contextualism:** Depends on the attributor. If the attributor is aware of the high stakes, "S knows P" is false in their context. If the attributor is oblivious too, it might be true.
  *   **Question-Shift:** The oblivious subject *retains knowledge* of P, the proposition answering *their actual practical question* (e.g., "is it open for toothpaste?"). Acting on P *is* rational *for their question*. The problem arises because the *actual situation* demands they answer a *different, more demanding question* (Q: "can I count on it?"), which they haven't addressed. Their action *becomes* reckless due to the *actual* stakes, not because they lost knowledge of P, but because P doesn't sufficiently answer the *de facto* question Q imposed by the situation. **More Believable?** Question-shift's answer feels more believable. It preserves the intuition that the subject's epistemic position relative to P is unchanged, while explaining the recklessness of acting *as if P answers Q* when it doesn't (even if the subject doesn't realize Q is the relevant question).

  **4. Dropping "Knowledge Licenses Action" & Explaining Recklessness**
  *   **Losing Anything?** Not really. The core intuition "you shouldn't act unless you're in a strong enough epistemic position" is preserved. Question-shift just refines it: "You shouldn't act unless you know a proposition that adequately answers the practical question your action presupposes." This is arguably *more precise*.
  *   **Explaining Recklessness:** Question-shift explains it perfectly. Acting on a hunch feels reckless in high stakes because:
      1.  A high-stakes situation demands answering a demanding question Q (e.g., "Can I *count on* this?").
      2.  A strong hunch *might* support belief in a basic proposition P (e.g., "The bridge is safe"), but it usually doesn't constitute knowing the proposition needed to answer Q (e.g., "The bridge is safe *enough to risk my life*" or "The probability of failure is negligible").
      3.  Acting on the hunch is acting *as if* you know the proposition answering Q, when you only have support for P. This gap *is* the recklessness. Encroachment tries to collapse P and Q into one stakes-sensitive knowledge state; question-shift keeps them distinct but related.

  **5. Verdict & Best Objection**
  *   **Bet On:** **Question-Shift.** It feels more parsimonious and intuitive. It avoids:
      *   Contextualism's semantic instability (constantly shifting meaning of "knows").
      *   Encroachment's counterintuitive claim that objective stakes magically change epistemic status without any change in evidence or belief.
      *   It cleanly explains the core data (stakes seem to matter for action/licensing) by shifting the *target* of inquiry, not the nature of knowledge or the meaning of the word. It respects the intuition that basic evidence-based beliefs remain constant while practical reasoning demands adapt to circumstances.
  *   **Best Objection:** **The Problem of Identifying "The Relevant Question":** How do we objectively determine *which* practical question the subject *should* be answering? In the oblivious high-stakes case, *we* (as theorists) say the *de facto* question is Q. But the subject is only addressing P. Question-shift needs a principled, non-circular way to say "The high-stakes situation makes Q the relevant question for assessing the rationality of the subject's action, *even if the subject doesn't realize it*." This risks smuggling in a form of objective stakes-sensitivity *through the back door*, via the determination of the relevant question. Defending a robust, non-stakes-sensitive account of "practical question relevance" is the biggest challenge.

  **6. Name in Literature?**
  *   **Likely Name:** **Question-Sensitive Invariantism (QSI)** or a close variant (e.g., "Practical Question Invariantism"). Your description strongly aligns with this family of views defended by philosophers like Jonathan Schaffer, Mikkel Gerken, and others.
  *   **Better/Worse?** Your version sounds very much in line with sophisticated QSI. The core insight (shifting questions, not shifting knowledge) is central to it. Existing versions grapple with the "relevant question" problem mentioned above and try to refine the link between practical situations, questions, and the required epistemic position (e.g., is it still *knowledge* of Q, or just justification? How is Q defined?). Your "acting requires the right target" phrasing is clear. Whether yours is "better" depends on how it addresses the relevance problem compared to existing QSI accounts. On the face of it, it captures the essence well and avoids some potential complications in how knowledge is defined relative to Q. It's a strong, coherent version of the view.
