  Then there's the philosophy-of-language twist: Does saying "my pain is 7" require the patient to refer to their experience, or just produce words tied to it? And is reportability evidence of consciousness, or does it define it? If it's constitutive (like higher-order theories), then unreportable pain might not "count"—but that feels ethically icky. 

