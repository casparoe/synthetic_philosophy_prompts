  ### Conclusion

  The proposed principle—distinguishing intratemporal defects (cyclical preferences) from diachronic management failures (unmanaged foreseeable losses)—delivers all seven of your judgments. It treats diachronic irrationality as a failure in preference consistency or planning, not merely vulnerability to money pumps. This aligns with your intuition that (1) and (5) are irrational due to distinct defects, while (2)–(4) and (7) are rational, and (6) has defective preferences but blameless conduct.  

  For the additional cases:  
  - (a) and (b) avoid diachronic irrationality despite preference defects;  
  - (c) is irrational due to unmanaged foresight;  
  - (d) has no diachronic irrationality.  

  The principle is a requirement of rationality itself, emphasizing consistency and prudent management, and it holds regardless of charge size as long as a sure loss exists. This approach captures the essence of diachronic rationality: agents must have internally consistent preferences at each moment and manage their future selves wisely when foreseeable threats arise.
