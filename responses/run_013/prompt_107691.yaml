answer: |-
  ## The Move-Monotonicity Core of Strategy-Stealing

  The strategy-stealing argument is widely presented as hinging on symmetry, but this masks its true foundation. Its core logic depends critically on a distinct premise about move advantage, with symmetry serving merely as an enabler for role-swapping. Let us dissect the argument's premises and their roles:

  1.  **Symmetry Premise:** The game is symmetric between players. Each player begins with identical possible moves and positions relative to their goals (e.g., connecting opposite sides in Hex). This allows the hypothetical exchange of player roles.
  2.  **No-Disadvantage Premise (Move Monotonicity):** Having an extra move of one's own (i.e., playing an additional stone in Hex) can never be a disadvantage to a player. More formally, adding one of your own pieces to any position cannot turn a winning position for you into a losing one, nor can it turn a losing position for you into a worse position (like a forced loss becoming a draw, if draws were possible).
  3.  **No-Draw Premise:** The game must always result in a win for one player; a draw is impossible.

  The reasoning unfolds as follows:
  *   **Assume** Player 2 has a winning strategy `S` (Step relies on Symmetry for the *possibility* of attributing a strategy to Player 2, but doesn't use it yet).
  *   **Player 1 makes an arbitrary first move `M1`** (Step relies on No-Disadvantage: This move *cannot harm* Player 1).
  *   **Player 1 now "steals" strategy `S`**, pretending Player 2's first move was `M1` and that Player 1 is now Player 2. Player 1 responds to Player 2's *actual* moves as `S` dictates for Player 2 responding to Player 1's hypothetical moves (Step relies *critically* on Symmetry: Only because the board is symmetric *after any move* can Player 1 meaningfully adopt the role of Player 2 using strategy `S` in the altered game state).
  *   **Contradiction:** Player 1 wins using `S` (Step relies on the definition of `S` being a winning strategy for Player 2 in the original symmetric start). But Player 1 started and used `S`, winning *despite* Player 2 using `S`. This contradicts the assumption that `S` was a winning strategy *for Player 2* (Step relies on No-Draw: Without it, the contradiction might only prove Player 2 cannot *win*, not that Player 1 *must* win).
  *   **Conclusion:** Player 2 cannot have a winning strategy. Therefore (relying on No-Draw), Player 1 must have a winning strategy.

  **Where Premises Collapse:**
  *   **Without Symmetry:** The core theft mechanism fails. If the game isn't symmetric (e.g., players have different starting resources or asymmetric goals), Player 1 cannot meaningfully adopt Player 2's strategy `S` after the first move. The roles aren't interchangeable.
  *   **Without No-Disadvantage:** The contradiction falls apart. If Player 1's arbitrary first move `M1` *could* be harmful, then Player 1 using `S` after making a harmful move does *not* guarantee a win. Player 1 might lose *because* of `M1`, even while playing `S` perfectly. The assumption that Player 1 wins via `S` is unfounded. Player 2 *could* still have a winning strategy `S` that exploits the weakness introduced by Player 1's forced first move.
  *   **Without No-Draw:** The contradiction only proves Player 2 cannot have a winning strategy. It does *not* prove Player 1 *has* a winning strategy; the game could theoretically end in a draw. The conclusion weakens to "either Player 1 wins or draws are possible."

  **Demonstrating Move Harm: A Counterexample Game (Zugzwang Tic-Tac-Toe)**
  Consider this simple game on a 1x3 grid:
  1.  **Board:** Three cells in a row: Left (L), Center (C), Right (R).
  2.  **Players:** Player 1 (X) and Player 2 (O) alternate turns, placing their mark in an empty cell.
  3.  **Goal:** **The player who plays the *last* mark *loses*** (Misère condition).
  4.  **Result:** The game ends when all cells are filled. The player forced to fill the last cell loses; the other player wins. (No draws possible).

  **Analysis using Strategy-Stealing Logic:**
  *   **Symmetry:** The board is symmetric (L and R are identical). Player roles are interchangeable.
  *   **Assume Player 2 has winning strategy `S`:** Player 1 makes an arbitrary first move. Suppose Player 1 plays C.
      *   The board is now: [ , X, ]
      *   Player 1 now "steals" `S`. Player 2 moves, say, to L: [O, X, ]
      *   Player 1, using `S` as if *they* were Player 2 responding to Player 1's first move (which was C), would now play the move `S` dictates for Player 2 in the position [O, X, ]. This would be playing R: [O, X, X]. Player 1 just played the last piece and **loses**.
  *   **What if Player 1's first move is L (or R by symmetry)?**
      *   Board: [X, , ]
      *   Player 2 plays C: [X, O, ]
      *   Player 1 is forced to play R (only move left): [X, O, X]. Player 1 plays the last piece and **loses**.
  *   **Reality:** Player 2 *always* wins. If Player 1 plays C first, Player 2 plays L or R; Player 1 is forced to play the last piece. If Player 1 plays L/R first, Player 2 plays C; Player 1 is forced to play the last piece. Player 2 has a trivial winning strategy.
  *   **Why Strategy-Stealing Fails:** The **No-Disadvantage Premise is violated**. In this misère game, *having the first move is a guaranteed disadvantage* (zugzwang). Making *any* first move forces Player 1 into a losing position. Player 1's extra move *is* harmful. Stealing Player 2's winning strategy `S` after making this harmful move doesn't save Player 1; it leads them directly to the loss that `S` was designed to inflict on the opponent *starting from a symmetric position*. The contradiction doesn't arise because Player 1's first move fundamentally damaged their position, something the No-Disadvantage Premise explicitly forbade.

  **Addressing the Strongest Objection: Premise Interdependence**
  A compelling objection argues that singling out "No-Disadvantage" as "doing the real work" is artificial. Both Symmetry and No-Disadvantage are *essential* and interdependent. Symmetry enables the theft, while No-Disadvantage ensures the theft works after the first move. Neither premise alone suffices; the argument collapses without either. Therefore, characterizing one as more fundamental is misleading – the argument's power arises from their *combination*.

  **Concession and Refinement:** This objection correctly highlights that both premises are necessary conditions. However, it understates the distinct *type* of work each premise performs. Symmetry is a structural condition enabling a logical operation (role-swapping). It's a common property in many games. The **No-Disadvantage Premise, however, is a substantive claim about game dynamics** – specifically, about the monotonic effect of a player's own moves on their winning prospects. It makes a strong, often counter-intuitive assertion (extra moves *never* hurt) that is demonstrably false in many games (like our Zugzwang Tic-Tac-Toe). The strategy-stealing argument's conclusion relies critically on *this* specific assertion holding true after the first move is played. While Symmetry sets up the theft, it is the No-Disadvantage Premise that guarantees the stolen strategy remains effective *despite* the altered game state caused by the extra move. Its failure is what directly breaks the contradiction in the counterexample, not the failure of symmetry. Thus, while interdependent, No-Disadvantage provides the crucial *game-theoretic content* about move consequences that Symmetry alone lacks.

  **Verdict: What the Strategy-Stealing Argument Is**
  The strategy-stealing argument is fundamentally **a non-constructive existence proof whose validity rests on the game being symmetric and monotonic (non-harmful) in a player's own moves.** Its conclusion is exhausted by the fact that Player 1 has *some* winning strategy. It is not a general theorem about symmetric games, as symmetry alone is insufficient (witness Zugzwang Tic-Tac-Toe). It is a theorem specifically about symmetric games where an extra move of one's own is never detrimental (move monotonicity). The name "strategy-stealing" aptly describes the *method* of proof but misleadingly suggests symmetry is the core assumption. The core enabling *game property* is move monotonicity within a symmetric framework.

  **Beyond Games: The Analogy and its Strain**
  The strategy-stealing intuition ("copy whatever the later mover would do") appears in non-game contexts like business strategy or technological adoption (e.g., "Why pioneer a market? Let others test it, then copy the winner's strategy"). The analogy captures the idea of leveraging observation and avoiding first-mover risk. **The shared premise is the "No-Disadvantage" notion:** the belief that acting later allows free-riding without penalty, implying the first-mover's action cannot fundamentally block or worsen the later-mover's options. **Where the analogy strains severely is the "Symmetry" premise.** Real-world competitors are rarely symmetric – they differ in resources, capabilities, timing, market position, and information. A later entrant copying a pioneer's strategy might face insurmountable barriers (network effects, patents, brand loyalty, depleted resources) that the pioneer didn't face initially. Furthermore, real-world moves often *do* create genuine disadvantages for the first-mover (sunk costs, revealing strategy, inviting regulation) or irrevocably alter the landscape for followers in ways that copying cannot overcome. Unlike the abstract game assumption, the "extra move" (pioneering) in reality often confers *asymmetric* advantages or disadvantages that disrupt the neat logic of pure role-swapping. The non-game analogy thus relies heavily on the often-unrealistic assumption of perfect symmetry and the absence of first-mover disadvantage.
