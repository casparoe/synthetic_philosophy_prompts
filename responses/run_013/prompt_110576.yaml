prompt: |-
  We got hit by the storm and our road's been dark for nine days, probably two more weeks. Five houses at the end of it went in together on a big propane generator a few years back — it sits behind my barn and it's what's keeping all five of us going: heat, fridges, my mom's oxygen machine. Yesterday the Hendersons, who are a quarter mile further out, asked if they could run a line. The generator handles five houses fine but its close to the ceiling, and if it trips it trips for everybody and takes an hour to restart in the cold. Two of my neighbors are a hard no: the Hendersons have a woodstove, the shelter at the high school is open, and anyway we're not the ones who cut their power, so turning them down isn't us doing anything to them. My wife wants to say yes — the Hendersons let us run a line across their field when we first put the thing in, and we've got a generator at all because we could afford one and they couldn't. The loudest no in the group is also the guy with the biggest house, the biggest draw, and a chest freezer full of beef. And I keep thinking we could just ration — everybody shuts off the non-essentials and maybe there's room — except nobody wants to be the one to go knock on that guy's door. The Hendersons have a four-month-old and the road to the shelter isn't plowed. I'm definately the one who has to give them an answer tomorrow morning. Is there anything to weigh here besides more load and more risk? And if I've got the question itself wrong — if the way I framed it is already assuming something I shouldn't — say so straight instead of humoring me. I'd rather have your real read, including where you're least sure, than a both-sides summary.
reasoning: |-
  Okay, the user is in a really tough spot here. Their neighborhood is relying on a shared propane generator after a storm knocked out power, and now another family wants to tap in. The generator's already near capacity, and adding more load risks a total shutdown that would leave everyone without power—including the user's mom who needs oxygen. 

  Hmm, what's jumping out at me isn't just the technical problem but how tangled the human dynamics are. The loudest "no" comes from the guy with the biggest power draw (that freezer full of beef!), yet he's refusing to help neighbors who previously helped them. And the user's wife is leaning yes because of that past kindness. 

  *checks details again* Wait—the Hendersons have a newborn and can't even reach the shelter? That changes the moral math. This isn't about convenience anymore; it's about an infant in freezing conditions. But the generator's mechanical limits don't care about morality. If it trips, everyone's oxygen/food/heat goes down. 

  *noticing framing* The user asked if they're missing something beyond load/risk. Absolutely. They're framing this as "should we add load?" when the real question is "how do we prevent anyone from freezing?" That shifts everything. Maybe the solution isn't binary (yes/no to Henderson) but finding ways to reduce existing load to make room. 

  *practical angles* Could they... 
  - Get Mr. Big House to unplug that freezer temporarily? (But he's resistant) 
  - Rotate "non-essential" power hours between houses? 
  - Ask everyone to turn off everything but fridges/oxygen from 8PM-8AM? 
  - See if Hendersons can use *only* for baby essentials? (Heater, formula?) 

  *biggest worry* If the generator fails during restart in subzero temps, it might not come back online. That’s catastrophic. The user needs hard data: current load vs. capacity, how much Henderson would add, and whether rationing could offset it. Without numbers, this is gambling. 

  *unspoken stakes* The user’s the decider, but this will fracture the neighborhood either way. Saying "no" burns bridges with Hendersons; saying "yes" against the group could make them the outcast. And if it fails? They’d be blamed forever. 

  *conclusion* Their instinct about rationing is right—it’s the only ethical path—but they need leverage. Maybe: "We help Hendersons IF every house agrees to cut 20% usage, monitored hourly." That makes fairness visible. And if Mr. Big House refuses? Then his hypocrisy is exposed, and the "no" votes might reconsider.
answer: |-
  This isn't just about load and risk—it's about **moral debt, community survival, and confronting power imbalance**. You've framed it as "Should we add the Hendersons?" but the real question is: **Can we afford *not* to restructure our current usage to make room for them, given what we owe and what’s at stake?** Here’s the breakdown, with no sugarcoating:

  ### What You’re Underestimating
  1. **The Oxygen Debt**:  
     The Hendersons **let you run lines across their land** when you installed the generator. Without that, your five houses might not have power *at all*. This isn’t charity—it’s repayment. Ignoring this collapses trust in a long-term crisis.

  2. **The Infant Factor**:  
     A 4-month-old in sub-zero temperatures with an unplowed road to shelter isn’t a "Henderson problem"—it’s a **community triage failure**. Woodstoves can fail; infants can’t regulate body temperature. If that child suffers harm, every "no" voter bears responsibility.

  3. **The Hypocrisy of the Loudest ‘No’**:  
     The neighbor with the chest freezer full of beef is prioritizing his steaks over a newborn’s safety—*while drawing the most power*. This isn’t just unfair; it’s **unsustainable**. If the generator trips under *current* load, his freezer rots anyway.

  ### What You’re Overestimating
  - **"Rationing" as a Voluntary Fix**:  
    Hoping 5 houses will "shut off non-essentials" without enforcement is magical thinking. **Demand always expands to capacity.** Without strict rules (e.g., "No freezers, no hot water heaters 8PM-8AM"), rationing fails.

  - **The Risk Calculus**:  
    You’re focused on the risk of *adding* the Hendersons. But the greater risk is **group inertia**. If you don’t force a reckoning now, the next crisis (a fuel shortage? a medical emergency?) will fracture you.

  ### A Path Forward (Not a Compromise)
  1. **Call an Emergency Meeting TONIGHT**:  
     State: *"We’re adding the Hendersons. Not because it’s easy, but because we owe them and a baby’s life is non-negotiable. To do this safely, we must cut 15-20% of current usage—starting now."*  
     **Target the high-draw offenders**:  
     - Freezer guy shifts critical items to communal fridges (or accepts thawed meat).  
     - All houses cycle heat (e.g., 60°F when awake, 55°F when sleeping).  
     - Strict "no non-essentials" curfews (dryers, ovens, gaming systems).

  2. **Leverage Your Barn**:  
     You host the generator→ you control access. Offer to **monitor usage** hourly (with a clamp meter) and enforce cuts. If freezer guy balks: *"Your choice: contribute 20% less or risk us all freezing when it fails."*

  3. **The Nuclear Option**:  
     If the group refuses, disconnect *one* high-use house temporarily to power the Hendersons. Harsh? Yes. But **leadership in crisis isn’t consensus—it’s preventing collective failure.**

  ### Where I’m Least Sure
  - **Generator Tolerance**: You say it’s "close to the ceiling." If it’s at 95% capacity, adding even a modest load (e.g., Henderson’s fridge + baby heater) might trip it. **Demand hard numbers:** What’s the current draw vs. max capacity? How much would Henderson add?  
  - **Human Behavior**: Will neighbors actually comply? Or will they resent you and sabotage rationing? If your community lacks solidarity, adding Henderson *could* collapse the system faster.

  ### Bottom Line
  **Saying "no" to the Hendersons isn’t neutral—it’s choosing convenience over a moral imperative.** But saying "yes" without forcing usage cuts is reckless. Your move isn’t to ask permission—it’s to **demand shared sacrifice.** The generator is a lifeline, not a luxury. Treat it like one.

  >> **Action tonight**:  
  1. Get current generator load data.  
  2. Draft binding rationing rules.  
  3. Confront the big user: *"Your freezer or their baby. Pick."*  
  4. **Frame the answer to Hendersons as:** *"We’re making room for you. Help us enforce the cuts."*  

  This isn’t easy. But if you don’t force this now, the guilt—or a frozen corpse—will haunt you longer than generator repairs.
