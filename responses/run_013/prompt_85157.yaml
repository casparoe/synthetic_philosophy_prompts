  For someone undecided, this provides evidence that something conscious is happening during sleep. It's not just a narrative constructed on waking; the action is performed during sleep and can be observed. So this should strongly constrain the view towards the real-time experience side. I think this deserves a high rating, maybe 0.9 or 1. But let's see the others; I should be consistent.

