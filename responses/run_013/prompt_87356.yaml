answer: |-
  ### Final Examination Question  
  **Philosophical Logic and Epistemology**  
  **Time Allowed:** 45 minutes  
  **Marks:** 20  

  > **Question:** The problem of logical omniscience exposes a tension between the normative demands of rationality and the psychological reality of bounded agents. Two strategies to resolve it present a fork:  
  > **(a)** *Finer-grained content*: Keep attitude contents truth-apt but individuated more finely than sets of possible worlds, allowing agents to believe contradictions and severing logical consequence from belief.  
  > **(b)** *Coarse-grained content with resource-limitations*: Keep contents coarse-grained but model agents' limited awareness or computational capacity, reducing closure to entailments within their "awareness set".  
  >  
  > Choose **one** strategy ((a) or (b)) and defend it as the more philosophically viable solution. In doing so, you must:  
  > (i) Distinguish the failure to know *all logical truths* from the failure of *closure under entailment*, showing how your chosen strategy addresses at least one;  
  > (ii) Explain what an adequate account *must preserve* (e.g., truth-aptness of content, normativity of logic);  
  > (iii) Argue why the core problem reflects a need to explain *inference as an agent’s act*.  
  > A strong answer will also note hazards unique to the unchosen strategy.  

  ---

  ### Model Answer (Candidate’s Essay: 697 words)  
  I shall defend strategy (b)—coarse-grained contents paired with resource-limitations—as the more viable solution to logical omniscience. While imperfect, it better preserves logic’s normative grip on rationality and avoids reducing epistemic failure to mere technical possibility, as strategy (a) risks.  

  The problem of logical omniscience conflates two distinct failures: (1) an agent’s inability to know *every* logical truth (e.g., failing to believe a complex tautology), and (2) her failure to believe all *entailments* of her knowledge (e.g., knowing P and P→Q but not Q). Strategy (b) primarily targets (2). By modelling agents with a set of coarse-grained, possible-worlds-defined beliefs *plus* a finite "awareness set" (encoding propositions they actively grasp), closure holds only for entailments within this set. If Q lies outside the agent’s awareness, she is not irrational for failing to infer it from P∧(P→Q). This avoids omniscience without denying that logic *should* govern reasoning—when the agent *is* aware of the relevant propositions, failing to draw inferences *is* a defect.  

  Crucially, strategy (b) preserves truth-aptness and normativity. Beliefs remain true or false based on worldly states (coarse-grained content ensures this), and logic retains its normative force: an agent violates rationality only when she *could* have drawn an inference given her awareness. Strategy (a), by contrast, sacrifices both. Making contents finer-grained (e.g., using impossible worlds or syntactic structures) allows "believing P" and "believing ¬¬P" to differ—but at the cost of truth-aptness. If an agent believes a contradiction (say, P∧¬P) *as a single content*, this "belief" cannot straightforwardly be false; contradictions lack possible-worlds truth conditions. Worse, normativity erodes: since logical consequence no longer constrains belief (one may "believe" premises but "not believe" a consequence without irrationality), failing to infer is not a fault. This reduces epistemology to descriptive psychology.  

  The deeper issue is that logical omniscience arises because standard semantics treats inference as a static relation between propositions, not an act performed by agents. Strategy (b) acknowledges this by incorporating computational or attentional constraints, though it risks relocating epistemology into computational theory. Yet this is a strength: it frames rationality as *effortful*, recognising that agents must *do* something (e.g., compute, attend) to extract consequences. Strategy (a), by rendering content non-logical, abandons the project of explaining inference altogether; if logically equivalent contents are distinct, "inferring Q from P" has no stable meaning.  

  I concede strategy (b)’s hazard: if "awareness" is defined imprecisely, closure relative to awareness may *still* demand omniscience within an agent’s current computational horizon. However, this can be mitigated by tying awareness to feasibly accessible resources (e.g., working memory), not an idealised capacity. Strategy (a)’s cost is graver: it dissolves the connection between logic and truth. If we cannot say an agent who believes P and ¬P believes something false, we lose epistemology’s core link to knowledge as *true* belief.  

  Ultimately, strategy (b) succeeds by treating logical limitations as failures of *performance* (constrained processing) rather than *competence* (understanding content). It explains why we blame agents for not seeing obvious entailments (they *could* have attended/computed) but not arcane ones, while strategy (a) makes irrationality inexplicable. Neither strategy fully explains inference as an act—strategy (b) reduces it to computation, ignoring agency—but it comes closer by embedding logic in a dynamic psychology of reasoning. For preserving truth, normativity, and the *effort* of rationality, strategy (b) is superior.  

  ---

  ### Marking Scheme  
  **Total: 20 marks**  

  | **Criterion**                                                                                                | **Marks** | **To Earn Marks**                                                                 | **Common Pitfalls**                                                                 |
  |-------------------------------------------------------------------------------------------------------------|-----------|-----------------------------------------------------------------------------------|-------------------------------------------------------------------------------------|
  | **1. Distinguishes knowing *all logical truths* from *closure under entailment***                          | 4         | Clearly separates the two properties; explains how chosen strategy addresses ≥1.  | Treating them as identical; implying solving one solves both.                       |
  | **2. Identifies what an adequate account must preserve (truth-aptness + normativity)**                    | 4         | Explicitly names both; argues how chosen strategy preserves them.                 | Omitting truth-aptness; reducing normativity to descriptive psychology.             |
  | **3. Explains the problem as demanding an account of inference as an act**                                 | 4         | Locates omniscience in the neglect of inference as agent-driven; critiques both strategies. | Ignoring agency; treating inference as purely formal.                             |
  | **4. Notes a hazard specific to the *unchosen* strategy**                                                  | 4         | For (a): non-truth-apt content/non-normativity; For (b): awareness collapse risk. | Misattributing hazards; superficial critique (e.g., "it's complicated").           |
  | **5. Coherent defence of one horn**                                                                         | 4         | Justifies choice using trade-offs; avoids merely describing the strategy.          | Neutral summary; switching horns; ignoring costs of chosen strategy.              |

  **First-class answer distinction:** Explicitly recognises that *neither* strategy fully explains inference as a rational act, but evaluates which better *approximates* this ideal while preserving logic’s normative force.
