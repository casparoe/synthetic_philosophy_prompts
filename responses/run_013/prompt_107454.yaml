answer: |-
  ## Morning Pantoum with Absent Visitors

  My mother sees a teacup on the table.
  A shape leans gently on the curtain’s fold.
  The visitor is standing there, quite able.
  She wipes the surface clean, her fingers cold.

  A shape leans gently on the curtain’s fold.
  A dripping tap repeats its hollow sound.
  She wipes the surface clean, her fingers cold.
  A familiar face emerges from the ground.

  A dripping tap repeats its hollow sound.
  The visitor is standing there, quite able.
  A familiar face emerges from the ground.
  It holds no substance on the kitchen table.

  The visitor is standing there, quite able.
  The light defines the edges sharp and clear.
  It holds no substance on the kitchen table.
  I watch the empty space, dispelling fear.

  The light defines the edges sharp and clear.
  My mother sees a teacup on the table.
  I watch the empty space, dispelling fear.
  A shape leans gently on the curtain’s fold.

  ---

  **Notes on Form and Philosophy:**

  1.  **The Pantoum Structure:** The poem strictly follows the requested pantoum form (5 quatrains, 20 lines), with lines 2 and 4 of each stanza becoming lines 1 and 3 of the next. The final stanza closes the loop by using the first and third lines of the *opening* stanza as its second and fourth lines.
  2.  **Migrating Lines & Ambiguous Agency:** Key repeated lines ("A shape leans gently on the curtain’s fold," "The visitor is standing there, quite able," "She wipes the surface clean, her fingers cold," "My mother sees a teacup on the table") deliberately shift context. They could be the caregiver reporting the mother's description, the caregiver describing their *own* perception of the real object the mother *mistook*, or (in the case of "visitor" and "shape") the caregiver momentarily sharing the hallucination's description. The reader cannot be certain who "sees" what in each recurrence.
  3.  **The Common Factor Temptation:** The identical repetition tempts the reader to think, "Same words, same experience." The structure itself suggests a core sameness.
  4.  **Disjunctivist Resistance:** The *context* of each repetition argues against a common experiential core. The first "visitor" (line 3) might be real (a description the caregiver *also* sees). The second (line 11) is explicitly hallucinatory ("emerges from the ground"). The final "shape" (line 20) is ambiguous, but placed after "I watch the empty space," emphasizing its unreality *to the speaker*, even if the words echo the start. The "teacup" is first the mother's perception (hallucination?), later juxtaposed with the caregiver watching "empty space." Same words, fundamentally different kinds of events (veridical vs. hallucinatory).
  5.  **Philosophical Recognition:** Philosophers will see the Argument from Illusion in the subjective indistinguishability conveyed by the repeated lines. The disjunctivist response manifests in the poem's refusal to equate the experiences *behind* the identical reports, highlighted by the shifting context and the caregiver's final act of seeing "empty space." The "common factor" is linguistic, not experiential.
  6.  **Poem First:** The philosophical argument emerges organically through the sensory details (teacup, curtain fold, dripping tap, cold fingers, light defining edges, familiar face, ground, empty space), the emotional tension ("dispelling fear"), and the inherent unease of the repeating, shifting lines, without resorting to exposition or didacticism. The unresolved ambiguity and the looped structure embody the lived philosophical tension.
