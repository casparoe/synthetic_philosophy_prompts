answer: |-
  The British constitutional monarchy, and its analogues elsewhere, presuppose a distinctive philosophical framework regarding political legitimacy, representation, and state identity. Let us reconstruct this implicit theory sympathetically before examining its boundaries and exclusions.

  **Reconstructed Implicit Theory:**

  1.  **Source of Legitimacy: Dual Foundations & Historical Continuity:**
      *   Legitimacy arises not solely from immediate popular consent but from a blend of historical continuity, inherited constitutional order, and *current* popular acceptance mediated through established institutions. The Crown embodies the historical legitimacy and unbroken sovereignty of the state, tracing its authority (symbolically, if not practically) through centuries of evolution. Concurrently, the democratic legitimacy of the elected Commons is paramount for *governing*. The Monarch's role is to personify and safeguard the *system* within which democratic choice operates, ensuring its stability and continuity beyond electoral cycles. Legitimacy flows from the enduring Crown-in-Parliament, not from transient majorities or the Monarch's personal will.

  2.  **Representation: Separating the Person from the Office & Representing Unity:**
      *   Representation is split. The Monarch, through the *office* of the Crown, represents the *unity, permanence, and national identity* of the state itself. This representation is non-partisan, symbolic, and transcends the political divisions of the day. The Monarch does not represent a specific policy or will but embodies the state as a corporate whole across time. Conversely, the Prime Minister and Parliament represent the *governing will* and *policy preferences* of the electorate at a given moment. The Crown represents *who we are* as a polity; Parliament represents *what we (currently) want to do*.

  3.  **State Identity Through Time: The Crown as Corporation Sole:**
      *   The legal fiction of the Crown as a "corporation sole" is crucial. It posits the Crown as a single, perpetual legal entity distinct from the individual monarch and any temporary government. This ensures the state's continuous identity, property rights, contractual capacity, and legal standing irrespective of the death of a monarch, the fall of a government, or the outcome of an election. The state *is* the Crown, an immortal legal person. Governments are merely "Her Majesty's Government," temporary agents acting in the name of the enduring Crown. The opposition's "loyalty" is to this permanent state entity (the Crown), allowing them to oppose the *government* fiercely without being deemed disloyal to the *state*.

  **Practices: Requirements vs. Fits:**

  *   **Strictly Required by Convention/Law:**
      *   Monarch appoints the PM who commands Commons confidence (non-discretionary).
      *   Royal Assent to Parliamentary Bills is given (effectively automatic).
      *   Monarch remains strictly politically neutral (no voting, no public opinions).
      *   Monarch's personal immunity from prosecution (legal necessity for the office's function).
      *   Crown's legal personality (necessary for state continuity, property, contracts, prosecutions).

  *   **Merely Fit the Theory (Useful Conventions but not Strictly Mandated):**
      *   Monarch reading the government's legislative programme in the first person ("Queen's/King's Speech"). This powerfully *symbolises* the unity of the state behind the government's agenda and the Crown's role in enabling governance, but the *specific ceremonial form* is convention, not law. An address simply announcing the programme would suffice legally.
      *   Terminology ("Her Majesty's Government," "Loyal Opposition"). This reinforces the theoretical framework of government acting in the Crown's name and opposition loyalty to the state, but alternative titles are conceivable.
      *   The *extent* of ceremonial pomp. While ceremony embodies the dignified aspect of the state, its scale and detail are matters of tradition and choice, not strict necessity to the constitutional function.

  **Rival Views Quietly Excluded:**

  1.  **Purely Electoral Legitimacy:** The system excludes the view that political legitimacy *must* derive solely and directly from a popular electoral mandate for *all* offices wielding significant state authority. The Monarch's legitimacy stems from heredity, law, history, and acceptance within the constitutional order, not an election.
  2.  **Unitary Will Representation:** It rejects Hobbesian or Rousseauian notions that representation requires a single, identifiable sovereign will. Instead, it embraces a complex, layered representation: the Crown for unity/permanence, Parliament for the current governing will.
  3.  **Ceremonial Idleness:** It fundamentally contradicts the view (associated with strict legal positivism or utilitarian efficiency) that ceremony, symbolism, and the "dignified" parts of the constitution (Bagehot's terms) are philosophically or functionally irrelevant. Here, ceremony is essential for embodying state unity, continuity, and the source of authority.
  4.  **Personalised Sovereignty:** It excludes the idea that sovereignty resides in, or is exercised by, the Monarch as an individual. While the Crown is sovereign, the *monarch* is bound by strict conventions, making the office largely symbolic.

  **Coherence with Popular Sovereignty:**

  The system exhibits a *pragmatic coherence*, though a *conceptual tension* exists with the doctrine that sovereignty resides in the people.

  *   **Pragmatic Coherence:** The conventions ensure that *de facto* political power derives entirely from the democratic mandate of the Commons. The Monarch's lack of discretionary power and strict neutrality mean that popular sovereignty, exercised through Parliament, is the operational reality. The Crown acts as a neutral guarantor *of the system* within which popular sovereignty operates. The "Crown" symbolises the state's authority, but the *people*, via their representatives, are the source of legitimate governmental power. It functions as a stable system reconciling historical authority with modern democracy.
  *   **Conceptual Tension:** The ultimate legal principle remains "The Crown in Parliament is sovereign." While Parliament is elected, the formula retains the Crown. The notion of popular sovereignty is a powerful underlying political reality and legitimising force, but it is not the formal, legal source of sovereignty in the same way it is in republics with explicit popular sovereignty clauses. The system relies on the *fiction* that the Monarch's powers, however constrained by convention, are the source of governmental authority ("Queen-in-Parliament"). This sits uneasily with a pure philosophical commitment to popular sovereignty as the *only* legitimate foundation.

  **Changes Required by an Elected, Substantive Head of State:**

  Replacing the monarch with an elected president possessing substantive powers would necessitate fundamental changes:

  1.  **Legitimacy Source:** Legitimacy would shift explicitly and solely to direct or indirect electoral mandate for the head of state.
  2.  **Separation of Powers:** A clearer, potentially more adversarial, separation between the executive (President) and legislature (Parliament) would likely emerge, especially if the President had a direct mandate and policy role. The current fusion of executive (PM/Cabinet) within the legislature could be disrupted.
  3.  **Neutral Arbiter Lost:** The unique role of the Monarch as a politically neutral symbol of unity above the fray would disappear. An elected President is inherently political, even if the role is defined as ceremonial-plus. The concept of the "Loyal Opposition" to the *state* embodied by the Crown becomes harder to sustain if opposing a partisan President.
  4.  **Continuity Mechanism:** A new mechanism for ensuring state continuity (legal personality, contracts, immunity) distinct from a partisan elected official would need to be devised (e.g., a separate legal entity like "the State").
  5.  **Conventions Codified:** Many crucial unwritten conventions (like automatic assent, non-discretionary appointment of PM) would likely need formal codification in a written constitution to prevent clashes between two potentially competing mandates (President vs. Parliament).
  6.  **Ceremonial Focus:** While ceremony might remain, its unifying power as representing a non-partisan, historical state entity would be significantly diluted, replaced by the mandate of a temporary political office-holder.

  In essence, the constitutional monarchy cluster presents a coherent, albeit theoretically complex, system where symbolic historical legitimacy and continuity (the Crown) are carefully separated from, yet enable, the practical operation of popular sovereignty through democratic institutions. Its coherence relies on the strict containment of the Monarch's power by convention and the acceptance of the Crown as a perpetual, impersonal symbol of the state itself. An elected head of state would collapse this separation, fundamentally altering the sources of legitimacy, the nature of representation, and the dynamics of power.
