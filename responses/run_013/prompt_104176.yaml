prompt: |-
  Consider the constitutional monarch — the British case will do, and the pattern recurs in Scandinavia and Japan. Note a cluster of practices around the office. The monarch appoints the prime minister, but convention binds her to appoint whoever commands the confidence of the Commons, however little she likes him. The government's legislative programme is read aloud by her, in the first person, as though it were her own. Her assent is a legal precondition of every Act and is never withheld. She may not vote or voice political opinions, and is personally immune from prosecution. The Crown is one legal person that outlives governments, holds property and prosecutes in its own name. Ministers are hers; so is the opposition, which is officially loyal to her while opposing her government. What philosophical commitments does this cluster presuppose — about the source of political legitimacy, about what it is for a person or an office to represent a people, and about the identity of the state through time? Reconstruct the implicit theory as sympathetically as you can, then separate what the practices strictly require from what they merely fit, and name the rival views they quietly exclude: that legitimacy must be electorally conferred, that representation requires a unity of will, that the ceremonial part of a constitution is philosophically idle. Finally, say whether the cluster is coherent, given that the same constitution holds that sovereignty resides in the people, and what an elected, substantive head of state would have to change. Please answer in British English.
