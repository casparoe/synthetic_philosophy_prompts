  Now for distinctions: Strictly required are the conventions of apolitical restraint (no voting/opinions), automatic assent to legislation, and appointment of whoever commands Commons confidence. The "fits" are more subtle - like how the Crown's legal personhood conveniently handles state continuity, or how opposition loyalty rituals soften adversarial politics.

