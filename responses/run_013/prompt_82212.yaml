prompt: |-
  I'm in a little reading group on rational choice and we keep slamming into the same wall: when does somebody's choice actually tell you what they want? I've got a pile of gut verdicts that I can't get to line up, so I want you to find the principle behind them, or tell me which of my verdicts has to go.

  Here's the pile. My roommate buys the store-brand cereal every week even though the nice kind is right there and she can afford it -- that one clearly reveals she prefers the store brand, or at least prefers it all-things-considered. She also says out loud that she prefers the fancy kind, and I think that's just talk; the buying is the real evidence. But my friend with contamination stuff washes her hands like forty times a day, and I do not think that reveals a preference for washing -- it's a compulsion, it isn't really her, even though she keeps on choosing it. Same with a guy I know who drives twelve hours rather than fly two because he's terrified of flying; I don't think that's a preference for driving in the ordinary sense. Then there's my cousin, who orders the cake and also paid the waiter five bucks up front to not bring the dessert menu at all -- I feel like the paying reveals a real preference (against cake, or against being tempted) and the ordering reveals a real preference too, they're just at different levels. But when a different friend takes the smaller-sooner payout over the bigger-later one and tells me "yeah I know, I'm being an idiot," I still think his choice reveals what he prefers right then, and the regret is him having a preference about his own preferences. A friend took a worse job for less money because her dad worked there, and I don't read that as a mistake or a non-choice, I read it as her preferring something like loyalty. But when the same person flips between two options depending on how you word them -- "90% survive" vs "10% die" -- I think the choice revealed the wording, not a preference. And when someone picks A over B on Monday and B over A on Tuesday with nothing changed, I figure there's no fact of the matter there, just noise.

  My friend Priya keeps floating a rule she calls the reciept test: a choice reveals a preference only if you'd be fine having it printed on a reciept with your name on it. That gets the compulsion and the fear cases right, and maybe the wording case too, but it feels like it's sneaking the mind back in through the back door, which is exactly the thing I liked about the plain "the choice is the evidence" view to begin with. So is there one principle that gets all of these, or close? If not, which of my verdicts should I give up, and why that one rather than another? And tell me what your principle says about a case I haven't listed -- someone who, halfway through a meal they chose, gets offered a free swap to the other dish and takes it every time, but says afterward they wish they hadn't.

  Lead with the principle in your first sentence, then the reasoning -- no preamble, don't restate my cases back at me.
reasoning: |-
  Okay, the user is in a reading group about rational choice theory and they're struggling with when a choice actually reveals a person's true preference. They've provided several scenarios where choices seem to either reveal preferences or not, and they're looking for a unifying principle or guidance on which of their intuitions might be inconsistent.

  The core issue here is about revealed preference theory in economics, which traditionally holds that choices directly reveal preferences. But the user's examples show cases where this seems inadequate—like compulsive behaviors, fear-driven decisions, or framing effects. Their roommate buying store-brand cereal seems to indicate a preference for it, even if she says otherwise. But in the hand-washing compulsion case, the repeated choice doesn't feel like a true preference. Similarly, the fear of flying leading to a long drive isn't seen as a preference for driving.

  The user mentions their friend Priya's "receipt test," which suggests that a choice reveals preference only if you'd be comfortable having it publicly acknowledged. This introduces a subjective element, which the user feels might undermine the objective "choice as evidence" view they initially liked.

  I need to find a principle that can handle all these cases. The key might lie in distinguishing between choices made under full agency versus those influenced by constraints, internal conflicts, or cognitive biases. For example:
  - The store-brand cereal choice: no constraints, so it reveals preference.
  - Hand-washing compulsion: driven by OCD, not free agency.
  - Fear of flying: phobia overrides rational choice.
  - Paying to avoid dessert menu: shows a meta-preference to avoid temptation.
  - Smaller-sooner payout: reveals present preference, but with regret indicating conflict.
  - Job choice for loyalty: reflects a deeper value (loyalty over money).
  - Framing effect (90% survive vs. 10% die): choice influenced by wording, not true preference.
  - Inconsistent choices over time: indicates noise, not stable preference.

  The user also asks about a new case: someone who swaps their meal halfway through but regrets it later. Here, the swap reveals a momentary preference change, but regret shows a conflict with their overall preference.

  The principle could be: **A choice reveals a preference when it's made with full agency, free from overriding internal or external constraints, and reflects a stable evaluative state.** 

  This principle accounts for:
  - **Full agency**: Compulsions or phobias (like hand-washing or fear of flying) compromise agency.
  - **Constraints**: If someone is coerced or has no alternatives, the choice might not reflect preference.
  - **Stable evaluative state**: Framing effects or inconsistent choices show instability, while meta-preferences (like paying to avoid temptation) reflect higher-order stability.
  - **Reflective endorsement**: Similar to the receipt test but grounded in agency rather than publicity.

  Cases resolved:
  - Roommate's cereal: Full agency, stable choice → reveals preference.
  - Compulsions/phobias: Lack agency → doesn't reveal preference.
  - Paying to avoid menu: Agency used to align actions with higher-order preference → reveals meta-preference.
  - Smaller-sooner payout: Agency present but conflict → reveals momentary preference, with regret as meta-preference.
  - Loyalty job: Agency, stable value → reveals preference.
  - Framing effect: No stable evaluative state → reveals wording, not preference.
  - Inconsistent choices: Instability → no fact of the matter.

  In the meal-swap case: Swapping halfway shows a momentary preference (agency present), but regret indicates it's not aligned with their stable evaluative state. So the choice reveals a transient preference, but not their "true" preference.

  The user might need to give up the view that all choices equally reveal preferences. Instead, they should accept that preferences are hierarchical and context-dependent, and that some choices (due to constraints or instability) don't reflect core preferences. The receipt test is useful but can be subsumed under agency (would you endorse the choice with full reflection?).

  The principle maintains the "choice as evidence" view but refines it by requiring the choice to be agential and stable. This addresses the user's examples without sneaking in dualism—it's all about the conditions under which choices are made.
answer: |-
  **A choice reveals a preference only when it reflects an agent's stable, uncoerced evaluative stance, formed under conditions conducive to rational agency (e.g., adequate information, cognitive competence, and absence of overwhelming distortions).**  

  ### Reasoning:  
  Your verdicts align when choices meet three criteria: **(1) Agency** (free from compulsions, phobias, or external coercion), **(2) Stability** (consistent across time/framing), and **(3) Evaluative Endorsement** (aligned with the agent’s broader values or meta-preferences). Fail any criterion, and the choice doesn’t reveal a "true" preference.  

  - **Roommate’s cereal**: *Reveals preference*. Meets all criteria—stable, agential, no conflict with her meta-preferences (her verbal claim is discounted as insincere or overridden).  
  - **Hand-washing/fear of flying**: *Does not reveal preference*. Fails **agency** (compulsions/phobias are overwhelming distortions) and **evaluative endorsement** (she likely wishes she didn’t have these impulses).  
  - **Cousin paying to avoid dessert menu**: *Reveals meta-preference*. The payment reflects a **stable, endorsed higher-order preference** (avoiding temptation), while ordering cake fails **stability** (it’s contextually impulsive).  
  - **Smaller-sooner payout**: *Reveals momentary preference*. Fails **evaluative endorsement** (he regrets it, showing misalignment with his stable values) but satisfies **agency** (no distortion, just time-inconsistent discounting).  
  - **Worse job for loyalty**: *Reveals preference*. Meets all criteria—agential (conscious trade-off), stable (if context persists), and endorsed (loyalty is a core value).  
  - **Framing effects (90% survive vs. 10% die)**: *Does not reveal preference*. Fails **stability** (choice is artifact of wording, not underlying valuation).  
  - **Inconsistent Monday/Tuesday choice**: *Does not reveal preference*. Fails **stability** (random noise, no coherent evaluative stance).  

  Priya’s "receipt test" implicitly targets **evaluative endorsement** (would you own this choice?), but my principle avoids "sneaking in the mind" by grounding endorsement in observable conditions (e.g., stability, absence of distortions). It’s not about introspection but whether the choice coheres with the agent’s pattern of behavior and constraints.  

  ### Your Unlisted Case:  
  **Halfway meal-swap with regret**:  
  - **The swap**: *Reveals a momentary preference* (e.g., curiosity/boredom), but fails **stability** (the choice flip-flops mid-meal) and **evaluative endorsement** (regret shows it conflicts with their broader culinary values).  
  - **Principle’s verdict**: The initial order likely reveals their stable preference (selected with deliberation). The swap is noise—akin to your Monday/Tuesday case—not a "true" preference.  

  ### Which Verdict to Surrender?  
  **Give up "the buying is the real evidence" for the smaller-sooner payout case**. You treat his choice as revealing his "preference right then," but if he explicitly disavows it ("I’m being an idiot"), it lacks **evaluative endorsement**. His choice is better seen as a *mistake* under weakness of will (like your cousin ordering cake), not a genuine preference. Consistency demands we treat both as failures of rational agency—his regret isn’t just "a preference about preferences" but a signal that the choice misrepresents his reflective values. Keeping this verdict would force you to accept the hand-washing as a "preference" too, which you rightly reject.  

  ---  
  **Why this principle?** It preserves the core of revealed preference theory (choices matter) while incorporating bounded rationality. Preferences aren’t "in the head"—they’re inferred from choices *when conditions for rational agency hold*. No dualism required.
