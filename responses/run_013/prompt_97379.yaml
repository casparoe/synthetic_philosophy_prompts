  Also, the mention of self-defeating predictions like "why start if I'll procrastinate" ties into Newcomb-like problems. EDT might resign you to failure since the evidence suggests procrastination is inevitable. CDT would advocate for actions that causally change outcomes, like starting now to reduce procrastination. This highlights the practical difference: EDT can lead to fatalism, while CDT promotes agency.

