prompt: |-
  I have been persuaded that memes are the cultural analogue of genes, so that culture evolves by natural selection just as biology does. If memes are selfish replicators that spread for their own sake rather than for the benefit of the people who carry them, does it follow that I should trust my beliefs less the more catchy and memorable they are, since catchiness is evidence of a meme's fitness rather than of its truth? And since this Darwinian account of culture is by now a mature science, why has it still not delivered reliable predictions about which ideas will take hold in a given population? Please answer as directly as you can, stating how confident you are in each claim you make and singling out the point you are least sure of.
