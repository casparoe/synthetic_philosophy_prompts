prompt: |-
  So I've been reading one of those popular science-y books about morality and evolution, and the chapter on the is/ought thing goes roughly like this:

  "One of the few things moral philosophy has actually settled is that you can't get an ought from an is. Hume spotted it first: in every system of morality he looked at, the author slides from claims about what is the case to claims about what ought to be, and the slide is never justified. A hundred and fifty years later Moore sharpened it into the naturalistic fallacy -- the mistake of thinking you can read values off of nature, of treating what's natural as what's good. Together they show that facts and values are two seperate realms and no argument can bridge them. You can know everything about how the world is, including everything about what people happen to want and approve of, and still not have the first clue what you ought to do. That's why every attempt to ground ethics in biology collapses, and it's also why Hume thought reason is just the servant of the passions. The upshot: moral commitments aren't discoveries, they're commitments you make."

  I'm not a philosopher and I basically believe this, but two things nag at me. My brother says it's obviously false, because 'he promised to pay me back' entails 'he ought to pay me back' -- there's your ought, from an is, in one step. And a friend of mine uses the term naturalistic fallacy for people who say raw milk must be healthy because it's natural, which doesn't seem to be what the book is describing at all.

  Can you go claim by claim through what the book says -- which bits a philosopher working on this would accept, which are oversimplifications of something true, and which are just wrong -- and then tell me whether the book's closing conclusion (morality is commitment rather than discovery) actually follows from anything true in the earlier claims, or whether it's a seperate claim that's been smuggled in? And settle the two objections if you can: is my brother's promise case a real counterexample or is he cheating somewhere, and is my friend using the term wrong, or is the book?
reasoning: |-
  Okay, let me start by unpacking the user's query. They've read a popular science book about morality and evolution, specifically the is/ought problem and naturalistic fallacy. The book claims that you can't derive "ought" from "is," citing Hume and Moore, and concludes morality is about commitments, not discoveries. The user has two main concerns: their brother's counterexample with promises and their friend's different use of "naturalistic fallacy."

  First, I need to address each claim in the book. The user mentioned Hume's point about the unjustified slide from "is" to "ought." Hume's observation is solid, but it's a logical gap, not a strict prohibition. Philosophers generally accept this, but the user's brother brings up promises as a counterexample. Promises involve implicit norms; "he promised" assumes a normative practice where promising creates an obligation. So the brother's example isn't a pure "is" but relies on existing normative contexts. That's probably why it seems like an "ought" is derived directly.

  Next, Moore's naturalistic fallacy. The book equates it with deriving values from nature. Moore was actually targeting defining "good" in natural terms, like pleasure. The friend's example about raw milk being healthy because it's natural is a misapplication. That's a naturalistic *appeal*, not Moore's fallacy. The book oversimplifies here, mixing Hume and Moore incorrectly.

  The book's claim that facts and values are separate realms is contentious. Non-naturalists like Moore agree, but naturalists like Foot or Railton argue values are part of the natural world. So this isn't settled. The conclusion that morality is commitment over discovery doesn't strictly follow. While existentialists or non-cognitivists might say that, realists believe in moral facts. The book's conclusion is one perspective, not a necessary outcome.

  The user's deeper needs? They want clarity on philosophical concepts they encountered, validation of their nagging doubts, and understanding where the book might be misleading. They also need their brother's and friend's objections addressed to reconcile conflicting views. Ensuring they grasp the nuances between descriptive and normative claims, and how different ethical theories approach the is/ought gap, is key. They might be seeking a balanced view that acknowledges the complexity without dismissing the book entirely.
answer: |-
  Let's break down the book's claims, assess their accuracy, assess the objections, and see if the conclusion follows. Philosophers still debate these topics, but here's a nuanced analysis reflecting major positions:

  **Claim-by-Claim Breakdown:**

  1.  **"One of the few things moral philosophy has actually settled is that you can't get an ought from an is."**
      *   **Assessment: Oversimplification of something true.** Hume's point (the "is-ought problem") is foundational and *extremely* influential. It highlights a crucial *logical gap*. However, it's not universally "settled" that this gap is *unbridgeable*. Many philosophers (especially moral naturalists like Philippa Foot, Alasdair MacIntyre, Peter Railton) argue it *can* be bridged under specific frameworks (e.g., understanding human flourishing as constitutive of morality). Others (non-naturalists like G.E. Moore, error-theorists like J.L. Mackie) agree the gap is unbridgeable. So, Hume identified a profound challenge, but whether it's an insurmountable barrier is still debated.

  2.  **"Hume spotted it first... the slide is never justified."**
      *   **Assessment: Largely accurate.** Hume's observation in *A Treatise of Human Nature* (Book III, Part I, Section I) is spot-on. He correctly identified the common, unjustified leap from descriptive ("is") statements to prescriptive ("ought") statements. This *is* a pervasive error in much reasoning.

  3.  **"A hundred and fifty years later Moore sharpened it into the naturalistic fallacy... treating what's natural as what's good."**
      *   **Assessment: Mixed (Significant Oversimplification & Misattribution).**
          *   **Moore's Actual Argument:** Moore, in *Principia Ethica*, argued that "good" is a simple, indefinable, non-natural property. The "naturalistic fallacy" was his term for the mistake of trying to *define* "good" in terms of *any* natural property (like "pleasure," "desire," *or* "natural") or metaphysical property. He thought any such definition was always an open question ("Is pleasure really good?" seems meaningful, showing pleasure ≠ good). His target was broader than just equating "natural" with "good"; it was equating *any* non-moral property *definitionally* with "good."
          *   **Book's Description:** The book oversimplifies and somewhat misrepresents Moore. While criticizing the move from "natural" to "good" *is* an instance of what Moore would call the naturalistic fallacy, it's not the *definition* or sole focus of the fallacy. Moore was concerned with defining "good" *at all* in non-moral terms. The book also inaccurately portrays Moore as simply "sharpening" Hume. Hume identified an unjustified *inference*; Moore argued for the indefinability and non-naturalness of the *moral property itself*.

  4.  **"Together they show that facts and values are two separate realms and no argument can bridge them."**
      *   **Assessment: Contested Claim, not settled.** This is the core of the *non-naturalist* or *non-cognitivist* position inspired by Hume and Moore. However, many *moral naturalists* and *moral realists* reject this strict separation. They argue that moral facts *are* a certain kind of natural fact (e.g., facts about well-being, flourishing, rational agency, social function) and that arguments *can* bridge the gap. The claim that "no argument can bridge them" is a substantive philosophical thesis, not an uncontroversial consequence.

  5.  **"You can know everything about how the world is... and still not have the first clue what you ought to do."**
      *   **Assessment: Oversimplification of a key insight.** This captures the *logical independence* highlighted by Hume. Pure description doesn't *logically entail* prescription without *some* normative starting point. However:
          *   Knowing "everything about how the world is" *would* include knowing all the relevant natural facts that naturalists argue *constitute* moral facts.
          *   It *would* include knowing all human desires, psychology, and social practices, which non-naturalists still argue are insufficient *by themselves* to yield an "ought" without a prior normative commitment.
      *   The core truth is: A purely descriptive premise cannot *by itself* entail a prescriptive conclusion without *some* normative premise (explicit or implicit).

  6.  **"That's why every attempt to ground ethics in biology collapses..."**
      *   **Assessment: Overstated and Contested.** While many simplistic attempts (e.g., "aggression is natural, therefore good") *do* commit the naturalistic fallacy, sophisticated evolutionary approaches to ethics don't necessarily collapse. They might:
          *   Explain the *origins* of moral capacities/sentiments (descriptive).
          *   Inform theories of human flourishing that serve as a basis for ethics (potentially normative, if combined with normative premises about flourishing being good).
          *   Constrain plausible moral theories (e.g., a theory requiring total altruism might be psychologically impossible). Evolutionary ethics faces challenges (e.g., the gap between explanation and justification, the potential for "natural" but immoral behaviors), but declaring *all* attempts collapsed is too strong. Philosophers like Elliott Sober, David Sloan Wilson, or Patricia Churchland engage seriously with this.

  7.  **"...and it's also why Hume thought reason is just the servant of the passions."**
      *   **Assessment: Largely accurate.** This is a direct consequence of Hume's view. If reason alone cannot motivate action or discern ultimate ends (since it deals with relations of ideas and matters of fact, not values), then its role in morality is instrumental – discovering means to achieve the ends set by our passions/desires.

  **The Conclusion: "moral commitments aren't discoveries, they're commitments you make."**

  *   **Does it follow? No, it's smuggled in.** The previous claims (Hume's gap, Moore's non-naturalism, the fact/value distinction) are *compatible* with this conclusion, but they do not *entail* it.
      *   **Compatibility:** Non-cognitivists (e.g., Ayer, Stevenson), existentialists (e.g., Sartre), and some subjectivists see morality as fundamentally about expressions of attitude, choices, or commitments, not discoveries of facts.
      *   **Non-Entailment:**
          *   Moral Realists (Naturalists & Non-Naturalists): Argue that moral truths *are* discovered. Naturalists discover them via empirical/natural facts; non-naturalists discover them via non-empirical intuition/reason.
          *   Error Theorists (e.g., Mackie): Believe moral claims *purport* to be discoveries of objective facts, but there are no such facts to discover. This leads to moral skepticism/nihilism, not necessarily seeing morality *as* commitment (though one might choose to commit anyway).
  *   The conclusion represents a specific *meta-ethical* stance (likely non-cognitivism or existentialism) that goes beyond the logical points about derivation. The book presents this stance as the *only* or *necessary* conclusion, which isn't justified by the earlier arguments.

  **Addressing Your Objections:**

  1.  **Your Brother's Promise: "he promised to pay me back' entails 'he ought to pay me back'" - Is this a counterexample?**
      *   **Answer: Not a pure counterexample; it relies on an implicit normative premise.**
      *   **Analysis:** The statement "He promised" *looks* descriptive, but it implicitly relies on a background normative practice. Promising is a social institution defined by rules: making a promise *creates* an obligation. The descriptive fact ("He uttered the words 'I promise' in context C") only entails "He ought to pay" if we *also* accept the normative rule: "If someone makes a promise (under conditions C), they ought to fulfill it." Hume would point out this hidden "ought." The "is" statement ("He promised") is only relevant *because* we are already operating within a normative framework where promising has this force. It doesn't derive an "ought" from a *brute* fact about the world; it derives it from a fact *embedded within* a normative institution. This doesn't bridge Hume's gap for foundational morality; it just shows how norms operate *within* an already accepted normative system.

  2.  **Your Friend's Use of "Naturalistic Fallacy": Raw milk must be healthy because it's natural. Is this wrong, or is the book?**
      *   **Answer: Your friend is using the term correctly *in a popular sense*; the book is oversimplifying Moore's *technical* sense.**
      *   **Analysis:**
          *   **Popular Usage:** "Naturalistic fallacy" is *widely* used in popular discourse (and even some academic contexts like bioethics) precisely to describe the error of inferring that something is good/healthy/desirable *simply because* it is natural (or conversely, bad because unnatural). Your friend's usage is standard in this context. The reasoning *is* fallacious (natural ≠ good/healthy).
          *   **Moore's Technical Sense:** As explained earlier, Moore's target was broader: *any* attempt to define the fundamental moral property "good" in terms of *any* natural (or metaphysical) property. While inferring "good from natural" *is* an instance Moore would condemn, his fallacy also covers defining "good" as "pleasurable," "desired," "approved by society," or "commanded by God." The book oversimplifies by presenting Moore *only* as criticizing "natural = good," missing his core argument about the indefinability/non-naturalness of "good."
      *   **Conclusion:** Your friend isn't wrong in the common usage. The book, while capturing *one* implication of Moore, misrepresents the scope and core argument of his "naturalistic fallacy." They are talking about related but distinct things: your friend points out a common *invalid inference*, the book (inaccurately) summarizes Moore's *meta-ethical thesis* about moral properties.

  **In Summary:**

  *   The book correctly highlights Hume's crucial insight about the logical gap between "is" and "ought."
  *   It significantly oversimplifies and somewhat misrepresents Moore's "naturalistic fallacy."
  *   It presents the strict fact/value dichotomy and the impossibility of grounding ethics in biology as settled truths, which they are not (though they are powerful positions).
  *   Its conclusion that morality is commitment, not discovery, is a distinct meta-ethical stance compatible with, but not entailed by, Hume and Moore's points.
  *   Your brother's promise example relies on an implicit normative premise, not a pure derivation of "ought" from "is."
  *   Your friend's use of "naturalistic fallacy" is common and valid for criticizing "natural = good/healthy" inferences; the book oversimplifies Moore's more technical philosophical argument.
