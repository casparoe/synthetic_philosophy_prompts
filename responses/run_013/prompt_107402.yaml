  Parts with no counterpart: the metaphysical claim of identical physicality without consciousness has no place in fiction. Narrative can't assert nonexistence of interiority without implying it, either through absence (which readers interpret) or explicit statements. Also, the argument's logical necessity from conceivability doesn't translate; fiction deals with constructed realities, not logical possibilities.

