prompt: |-
  I direct ethics and grantmaking at a small Buddhist-founded foundation that distributes quarterly grants for humanitarian work. Our board charter commits us to putting compassion first, but it deliberately does not say whether that means maximizing the relief of suffering or holding to the precepts, and our five-person committee is split on the point. The Theravāda members treat the five precepts as near-absolute constraints, and read the tradition's claim that intention is what makes an action karmically decisive as ruling out consequentialist trade-offs; the Mahāyāna members invoke skillful means, and the bodhisattva's willingness to shoulder karmic burden for others' sake, to allow exceptions when the outcome is large enough. None of us is a trained philosopher, we decide in a two-hour meeting, and we have to record a written rationale that both factions will accept as having been applied in good faith. We keep discovering, after the fact, that we have been sliding between two different questions — how much suffering will this relieve, and what will this do to the intentions and dispositions of everyone involved — without noticing.

  I want a decision procedure the committee can run on each proposal: the questions to ask in order, what counts as a sufficient answer to each, where the procedure stops with a no, and where it hands the decision to a vote because the question is one of values rather than facts. Please build it around three registers and say explicitly how a proposal can be defeated by each: (1) the outcome register — expected suffering relieved and harm done, including effects far in the future; (2) the karmic register — the effect on the intentions and character of the actors, the foundation's own staff and donors included, since the tradition holds that the state of mind behind an act matters as much as the act's results, and that consequences are said to ripen over spans longer than a lifetime; and (3) the precepts, treated as side-constraints rather than as one more quantity to be traded off. The procedure has to say whether any register has lexical priority, and what to do when the two factions read the precepts differently — in particular whether a disagreement about whether skillful means can license an exception is a factual dispute the procedure can settle or a values dispute it must hand off. It also has to say how to reason at all when the relevant consequences are said to extend across lifetimes no one can estimate, and it should address, at least briefly, whether the no-self teaching undermines the whole exercise of adding up benefits across separate people, or whether conventional-level calculation remains the right thing to do. Keep it usable by people who know the tradition but not the academic literature, and do not ask us to consult sources.

  Then run it, step by step, on three proposals: a program with the highest expected suffering-reduction of anything on the table that would require us to spread a deliberately misleading claim about a treatment in order to overcome public hesitation; a contemplative-care program whose benefits we cannot measure at all, which its applicants defend on the ground that it builds the long-run dispositions of everyone it touches; and a partnership that would relieve a great deal of suffering but only by working through a local authority we know will use some of the money coercively. Make the procedure give a clear answer in each case, and let at least one of those answers be one I will not like. Close by telling me what the procedure cannot do, and which of its steps are judgment calls dressed up as procedure.
reasoning: |-
  We are designing a decision procedure for a Buddhist-founded foundation's grantmaking committee. The procedure must consider three registers: outcome (suffering relief and harm), karmic (effects on intentions and character), and precepts (as side-constraints). The committee is split between Theravāda (precepts as near-absolute, no consequentialist trade-offs) and Mahāyāna (skillful means, accepting karmic burden for greater good) perspectives.

  Key principles:
  1. Lexical priority: The precepts register has lexical priority because they are treated as side-constraints. If a proposal violates a precept and no exception is allowed (by the committee's agreed standards), it is rejected without considering outcomes.
  2. However, the committee must first agree on what constitutes a violation and whether an exception (via skillful means) is permissible. This is a values dispute and cannot be resolved by the procedure. The procedure must hand off to a vote if there is disagreement about the permissibility of an exception.
  3. The outcome and karmic registers are to be considered after the precepts register is passed. They are not lexically ordered relative to each other. The committee must evaluate both and then decide by vote if they conflict.

  The procedure must also address:
  - How to reason about consequences extending across lifetimes: We acknowledge the uncertainty but use conventional-level calculation (best available evidence) for the outcome register. For the karmic register, we focus on the present intentions and the cultivation of wholesome mental states.
  - The no-self (anatta) teaching: We proceed with conventional-level calculation of suffering relief because, at the conventional level, we operate as if persons exist and their suffering matters. The procedure does not require aggregating benefits in a way that reifies a permanent self; it is a practical tool.

  Decision Procedure Steps:

  Step 1: Precepts Register (Side-constraints)
     For each of the five precepts (no killing, no stealing, no sexual misconduct, no false speech, no intoxicants), ask:
     - Does the proposal require, cause, or endorse an action that violates a precept?
        - If no, move to the next precept.
        - If yes, then ask: Is this violation acceptable under the doctrine of skillful means? (This is a values question. If the committee unanimously agrees that it is acceptable, then the precept constraint is waived. If there is any disagreement, the proposal is rejected at this step because the precepts have lexical priority and we cannot override without consensus.)

     If the proposal passes all precepts (either by not violating or by unanimous agreement to waive due to skillful means), then proceed to Step 2.
     If the proposal is rejected at this step, record the rationale: "Violation of precept [X] without unanimous agreement to waive via skillful means."

  Step 2: Outcome Register
     - Estimate the expected net suffering relief: Consider the immediate and long-term effects (as far as we can reasonably project) on all beings. Use the best available evidence and expert opinion. Include both the direct relief and any indirect harms (e.g., unintended consequences).
     - The question: Is the expected net suffering relief clearly positive and significant relative to the resources expended?
        - If the answer is clearly yes (and there are no major red flags in the karmic register), then the proposal may be accepted.
        - If the answer is no (or negative), reject the proposal and record: "Insufficient expected net suffering relief."
        - If the answer is uncertain (e.g., because benefits are unmeasurable or long-term), then move to Step 3 (Karmic Register) for additional input. However, note that without a positive outcome estimate, the karmic register must be exceptionally strong to justify the grant.

  Step 3: Karmic Register
     - Evaluate the effect on the intentions and character of everyone involved (including foundation staff, donors, and direct actors):
          - Does the activity cultivate wholesome mental states (e.g., compassion, generosity, wisdom) and avoid cultivating unwholesome ones (e.g., greed, aversion, delusion)?
          - Does it risk corrupting the actors (e.g., by habituating them to harmful actions or intentions)?
     - The question: On balance, is the karmic effect positive (i.e., leading to the development of virtue and wisdom) for all parties?
          - If yes, and the outcome register is positive or uncertain but the karmic case is strong, then the proposal is accepted.
          - If the karmic effect is negative, then reject the proposal and record: "Negative karmic impact on actors."
          - If the outcome register is negative and the karmic effect is positive, then the proposal is rejected because the outcome register has precedence when it is clearly negative? But note: we are not lexically ordering outcome and karmic. Therefore, if the outcome register is negative (or uncertain) and the karmic register is positive, we must weigh them. This is a values conflict and goes to a vote.

  Step 4: Vote
     If the proposal passes the precepts register but there is:
        - A conflict between outcome and karmic registers (e.g., outcome is negative but karmic is positive, or outcome is positive but karmic is negative), or
        - Uncertainty in the outcome register and the karmic register is not decisive, or
        - Any other unresolved disagreement about the relative weights,
     then the committee votes to accept or reject. The rationale must record the disagreement and the vote outcome.

  Now, we run the procedure on three proposals:

  Proposal 1: A program with the highest expected suffering-reduction that requires spreading a deliberately misleading claim about a treatment to overcome public hesitation.

  Step 1: Precepts Register
     - Violation: The program requires false speech (deliberately misleading claim). 
     - Ask: Is this acceptable under skillful means? 
          - The Theravāda members say no (precept violation without exception). 
          - The Mahāyāna members say yes (because of the great suffering relief, it is skillful means and they are willing to shoulder the karmic burden).
     - Since there is disagreement (not unanimous), the proposal is rejected at Step 1. 
     - Rationale: "Violation of the precept against false speech without unanimous agreement to waive via skillful means."

  Proposal 2: A contemplative-care program with unmeasurable benefits, defended on building long-run dispositions.

  Step 1: Precepts Register
     - We assume no precept violation. (It's a care program that presumably adheres to the precepts.) Pass.

  Step 2: Outcome Register
     - Benefits cannot be measured. We cannot establish a positive expected net suffering relief with evidence. So we mark this as uncertain and move to the karmic register.

  Step 3: Karmic Register
     - The program is designed to build wholesome dispositions (compassion, mindfulness) in both caregivers and recipients. It is likely to have a positive karmic effect by cultivating virtue and wisdom.
     - Since the outcome is uncertain but the karmic effect is clearly positive, we accept the proposal (unless there are concerns about negative karmic effects, which we don't have in this case).
     - Rationale: "Outcome uncertain, but strong positive karmic impact on all involved."

  Proposal 3: A partnership that relieves a great deal of suffering but works through a local authority that will use some of the money coercively.

  Step 1: Precepts Register
     - The local authority's coercive use of money might involve causing harm (which could be seen as violating the precept against killing or causing harm, or against stealing if it's extortion). Also, the foundation's support might be seen as endorsing or enabling that.
     - Specifically, if the coercion involves physical harm or taking property without consent, it violates precepts. 
     - Ask: Is this acceptable under skillful means?
          - Theravāda: No, because we are enabling harm (even if we don't do it directly) and thus breaking the precepts.
          - Mahāyāna: Possibly, if the net suffering relief is great and we are motivated by compassion, accepting the karmic burden.
     - Since there is disagreement, we must reject at Step 1? But note: the violation is by the local authority, not directly by the foundation. However, the foundation is providing funds knowing they will be misused. The committee must decide if this constitutes a violation by the foundation. 

     Let us be clear: the precepts apply to the foundation's actions. The foundation is not directly killing, stealing, etc., but it is enabling an agent to do so. This is a gray area. The committee must decide if this enabling is a violation. 

     However, the procedure says: "Does the proposal require, cause, or endorse" a violation? The proposal requires working with this authority and we know the money will be used coercively. This is an endorsement? 

     We treat it as a potential violation. Therefore:
          - Theravāda: Violation and no exception.
          - Mahāyāna: Might argue that the greater good justifies it (skillful means) and the foundation's intention is pure.

     Without unanimous agreement to waive, the proposal is rejected at Step 1.

     But if the committee agrees that the foundation is not directly violating the precept (because the harm is indirect and the foundation's action is giving money for humanitarian aid, not for coercion), then it might pass Step 1. However, the problem states that the local authority will use "some of the money coercively". This implies that the foundation's funds are fungible and thus enabling. 

     Given the split, we must reject at Step 1 because of lack of unanimity on waiving. 

     However, if the committee first votes on whether this is a violation and the majority says it is not (so no need for waiver), then it passes. But the procedure does not specify voting at Step 1 except for waiver. 

     Clarification: Step 1 has two parts:
        (a) Determine if there is a violation. (This might be a factual or interpretive question. If there is disagreement, it becomes a values dispute and we must vote? But the procedure says that without unanimous waiver, we reject. So the initial determination of violation must be agreed? Actually, if one member believes there is a violation, then we are in the waiver question. And if waiver is not unanimous, we reject.)

     Therefore, for Proposal 3:
          - Some members (Theravāda) believe there is a violation (because enabling harm is equivalent to doing harm). Others (Mahāyāna) might not see it as a violation or might see it as justifiable. 
          - We then ask the waiver question: If there is a violation, can we waive? But the Theravāda members won't waive. So without unanimity on waiver, the proposal is rejected.

     Rationale: "Violation of precept against causing harm (by enabling) without unanimous agreement to waive via skillful means."

     However, note: the foundation is not causing harm directly, but the committee is split on whether enabling is a violation. The procedure must be adjusted to handle this. We can modify Step 1:

     Revised Step 1:
        - Ask: Do any committee members believe the proposal violates a precept?
            If no, pass.
            If yes, then: Do all committee members agree that this violation is acceptable under skillful means?
               If yes, then pass.
               If no, then reject.

     So for Proposal 3: 
          - Theravāda members believe it violates (enabling harm). 
          - Mahāyāna members might not believe it violates (because the foundation's action is giving for humanitarian purposes and the coercive use is by the local authority) OR they might believe it violates but it is acceptable under skillful means. 

          But the waiver question only applies if we agree there is a violation. So we must first decide: is there a violation? The procedure currently does not specify how to resolve a disagreement about whether an action constitutes a violation. We must add:

          Step 1a: Determine if there is a precept violation.
              - If the committee unanimously agrees there is no violation, then pass to Step 2.
              - If the committee unanimously agrees there is a violation, then proceed to the waiver question (Step 1b).
              - If there is disagreement (some say violation, some say not), then this is a values dispute and we proceed to Step 1b by assuming there is a violation? Or we vote? 

          We can adjust: 
              If any member believes there is a violation, then we proceed to the waiver question (Step 1b) for that violation. For the waiver, we require unanimity. If not unanimous, reject.

          Therefore, Proposal 3: 
              - At least one member (Theravāda) believes there is a violation (enabling harm). 
              - Now, we ask: Do all agree to waive? 
              - The Theravāda members will not waive (because they don't accept skillful means for this). 
              - Therefore, reject.

     This is consistent.

  Conclusion of the three proposals:
     - Proposal 1: Rejected at Step 1.
     - Proposal 2: Accepted at Step 3.
     - Proposal 3: Rejected at Step 1.

  What the procedure cannot do:
     - It cannot resolve deep doctrinal disagreements. It relies on unanimity at the precepts waiver step and voting when the outcome and karmic registers conflict.
     - It does not provide a way to quantify or precisely compare the outcome and karmic registers. When they conflict, it falls back to a vote.
     - It relies on the committee's best judgment about facts (outcome estimates, karmic effects) and interpretations (what constitutes a precept violation).

  Which steps are judgment calls dressed as procedure?
     - Step 1a: Determining whether an action violates a precept is a judgment call (especially in complex cases like enabling harm). The procedure masks this by requiring unanimity to waive if any member sees a violation.
     - Step 2: Estimating net suffering relief involves judgment, especially for long-term and uncertain effects.
     - Step 3: Assessing the karmic impact is inherently subjective.

  The procedure is a framework to structure discussion and make the values conflicts explicit, but it does not eliminate the need for judgment.
answer: |-
  ### Decision Procedure for Compassion-First Grantmaking

  Below is a step-by-step decision procedure designed for your committee, centered on three registers: **outcome** (net suffering relief), **karmic** (effects on intentions and character), and **precepts** (side-constraints). The procedure prioritizes the precepts as lexically primary (i.e., they cannot be overridden by outcomes). When disagreements arise about interpreting the precepts (e.g., whether skillful means applies), they are treated as **values disputes** and resolved by committee vote. For the outcome and karmic registers, conflicts are resolved by weighing evidence; if evidence is inconclusive, the proposal fails unless the karmic case is exceptionally strong. 

  The procedure uses **conventional-level calculation** (accepting "persons" as practical constructs) for aggregating suffering relief. Consequences spanning lifetimes are addressed through proximate evidence (e.g., observable long-term trends) and humility about uncertainty. The anatta (no-self) teaching does not negate conventional calculation; it simply reminds us that "benefits" are interdependent processes, not possessions.

  ---

  #### **Decision Procedure: Step-by-Step Questions**
  **Total Time:** Designed for a 2-hour meeting. Allocate time per step to avoid sliding between registers.  
  **Goal:** Reach a clear accept/reject outcome with a written rationale acceptable to both factions.

  1. **Precepts Register (Lexical Priority – Side-Constraints)**  
     **Purpose:** Ensure the proposal does not violate the Five Precepts (killing, stealing, sexual misconduct, false speech, intoxicants) unless there is unanimous agreement that skillful means applies.  
     **Questions to Ask:**  
     - Does this proposal require, endorse, or materially enable actions that violate any of the Five Precepts?  
     - If yes, is this violation **unanimously** justifiable as "skillful means" (bodhisattva exception)?  
       - *Criteria for "yes"*: The violation must be (a) necessary for a vastly greater good, (b) motivated by pure compassion (not convenience), and (c) the only viable option.  
     **Decision Rules:**  
     - If **no violation**, proceed to Step 2.  
     - If **violation but unanimous agreement** on skillful means, proceed to Step 2.  
     - If **violation without unanimous agreement**, **reject immediately**. No further discussion.  
     **Rationale Requirement:** Record which precept is at issue and why skillful means was or wasn’t accepted. Disagreements here are **values disputes** (not factual) and must be settled by unanimity or rejection.  

  2. **Outcome Register (Net Suffering Relief)**  
     **Purpose:** Estimate measurable and non-measurable effects on suffering, using conventional-level calculation.  
     **Questions to Ask:**  
     - What is the **expected net suffering relief** over 10–50 years? Include:  
       - Direct effects (e.g., lives saved, pain reduced).  
       - Indirect harms (e.g., unintended consequences, dependencies).  
       - Far-future risks (e.g., systemic changes, environmental impacts).  
     - Is this estimate based on **evidence** (data, expert input, past analogues)?  
     **Decision Rules:**  
     - If net relief is **clearly positive and significant** (relative to cost), proceed to Step 3.  
     - If net relief is **negative or negligible**, **reject**.  
     - If net relief is **unmeasurable or highly uncertain**, proceed to Step 3 but require stronger karmic justification.  
     **Rationale Requirement:** Note evidence sources and quantify uncertainties.  

  3. **Karmic Register (Intentions and Character)**  
     **Purpose:** Assess effects on the mental states of all involved (grantees, beneficiaries, staff, donors).  
     **Questions to Ask:**  
     - Does this proposal cultivate **wholesome qualities** (e.g., compassion, generosity, patience) in actors?  
     - Does it risk **corrupting character** (e.g., greed, aversion, delusion)?  
     - How does it affect the **foundation’s integrity** (e.g., reputational karma, donor trust)?  
     **Decision Rules:**  
     - If effects are **clearly positive** (e.g., reinforces bodhicitta), **accept** if Step 2 passed.  
     - If effects are **negative** (e.g., habituates harm), **reject**.  
     - If Step 2 was **uncertain but karmic effects are strongly positive**, **accept**.  
     - If Step 2 was **positive but karmic effects are negative**, **vote** (values conflict).  
     **Rationale Requirement:** Describe how mental states are shaped (e.g., via participant testimonials, ethical design).  

  **Final Vote:** Required only if:  
  - Step 2 (outcome) and Step 3 (karmic) conflict (e.g., one positive, one negative).  
  - Uncertainty in both registers leads to deadlock.  
  **Rationale Requirement:** Document the vote count and summary of disagreements.

  ---

  ### **Application to Three Proposals**
  **Committee Assumptions:**  
  - 2 Theravāda members (precepts absolute; no trade-offs).  
  - 2 Mahāyāna members (skillful means possible; karmic burden acceptable).  
  - 1 Undecided chair (you).  
  Proposals require 3+ votes to pass if a vote is called.

  #### **Proposal 1: High-Impact Program Requiring False Speech**  
  - **Description:** Spread a misleading claim about a medical treatment to overcome public hesitancy. Expected to save 10,000 lives.  
  - **Step 1: Precepts Register**  
    - Violation: **False speech** (deliberate misinformation).  
    - Skillful means? Theravāda: No (precept absolute). Mahāyāna: Yes (compassionate intent; burden accepted).  
    - **Outcome:** No unanimous agreement → **Reject**.  
    **Rationale:** "Violation of false speech precept. Committee split on skillful means (2 yes, 2 no). Unanimity not reached. Lexical priority applied."  
  - **Stop Here.** No further registers considered.  

  #### **Proposal 2: Contemplative-Care Program with Unmeasurable Benefits**  
  - **Description:** Trains caregivers in mindfulness-based compassion. No measurable outcomes; argued to build long-term virtuous dispositions.  
  - **Step 1: Precepts Register**  
    - No precept violations → **Proceed**.  
  - **Step 2: Outcome Register**  
    - Net suffering relief: **Unmeasurable** (no data) → **Proceed with caution**.  
  - **Step 3: Karmic Register**  
    - Effects: **Strongly positive** (cultivates compassion in caregivers; reinforces foundation’s mission).  
    - **Outcome:** Accept (positive karmic effects outweigh outcome uncertainty).  
    **Rationale:** "No precept violation. Outcome unmeasurable, but karmic effects clear: builds compassion and patience in all actors. Precedence given to karmic register due to outcome uncertainty."  

  #### **Proposal 3: Partnership with Coercive Local Authority**  
  - **Description:** Funds a food-distribution program in a conflict zone through a local partner who will divert 20% of funds to coercive policing. Expected to relieve starvation for 50,000 people.  
  - **Step 1: Precepts Register**  
    - Violation: **Killing** (enabling harm via diversion) and **stealing** (misuse of funds).  
    - Skillful means? Theravāda: No (prohibits material support for harm). Mahāyāna: Mixed (1 yes: suffering relief justifies risk; 1 no: diversion is greed, not compassion).  
    - **Outcome:** No unanimous agreement → **Reject**.  
    **Rationale:** "Violation of killing/stealing precepts. Skillful means not unanimous (1 yes, 3 no). Lexical priority applied."  
  - **Stop Here.** (Even with high suffering relief, precepts block approval.)  

  **Note:** Proposal 3’s rejection may be unpopular (given high suffering relief), but the procedure enforces precepts as inviolable without consensus on skillful means.

  ---

  ### **What the Procedure Cannot Do**  
  1. **Resolve Doctrinal Splits Deeply:** It flags precept disagreements as values disputes but doesn’t reconcile Theravāda/Mahāyāna differences. Voting is a band-aid.  
  2. **Eliminate Judgment Calls:** These are "dressed up as procedure" in:  
     - **Step 1:** Whether an action "materially enables" a precept violation (e.g., is funding coercion "killing"?).  
     - **Step 2:** Quantifying "net suffering relief" with incomplete data (e.g., long-term effects are guesses).  
     - **Step 3:** Assessing "wholesome character" (e.g., is hardship that builds resilience karmically positive?).  
  3. **Handle Infinite Uncertainty:** Consequences "across lifetimes" are addressed through proximate evidence but remain speculative. The procedure defaults to humility: if no actionable evidence, it leans on karmic register.  
  4. **Guarantee Satisfaction:** It prioritizes the foundation’s integrity (precepts and karma) over raw outcomes. Some high-impact proposals will lose, as in Proposal 1 and 3.  

  **Final Advice:** Use this procedure to **structure debate, not suppress it**. Document rationales meticulously to demonstrate good faith. When values clash, vote openly—transparency is your karmic anchor. The goal isn’t philosophical unity but operational clarity anchored in your charter’s "compassion first."
