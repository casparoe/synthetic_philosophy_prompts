answer: |-
  Here’s a structured breakdown of the desiderata for AI safety guarantees, grounded in the core debate between worst-case and average-case advocates. I’ll define requirements in plain terms, explain their rationale, flag non-negotiables vs. preferences, and highlight irreconcilable conflicts.

  ---

  ### **Core Desiderata for AI Safety Guarantees**  
  *(With rationale and classification)*

  1. **Failure Certainty**  
     - **What**: Guarantees must hold *even if* the AI system **tries to cause harm** (e.g., due to misalignment).  
     - **Why**: If safety relies on the system being "well-intentioned," it fails if goals are misspecified.  
     - **Status**: Non-negotiable for worst-case advocates; often negotiable for average-case advocates.  

  2. **Scope Completeness**  
     - **What**: Must cover **all possible inputs** (e.g., adversarial prompts, edge cases) and **all possible outputs** (e.g., deceptive code, manipulative text).  
     - **Why**: Real-world deployment exposes AI to unpredictable inputs (e.g., hackers, accidents).  
     - **Status**: Non-negotiable for worst-case; average-case accepts "high-probability" coverage.  

  3. **Deployment Reality**  
     - **What**: Guarantees must hold in **actual use** (e.g., with untrained users, unreliable tools, or malicious actors).  
     - **Why**: Safety isn’t just about the model—it’s about the **ecosystem** (users, APIs, institutions).  
     - **Status**: Non-negotiable (both camps agree, but definitions of "reality" differ).  

  4. **Proof vs. Probability**  
     - **What**: Guarantees must be **provably true** (like a mathematical proof), not probabilistic ("99.9% safe").  
     - **Why**: Probabilities fail catastrophically with superhuman AI (e.g., 0.1% risk × high stakes = disaster).  
     - **Status**: Non-negotiable for worst-case; average-case accepts statistical assurances.  

  5. **Training Independence**  
     - **What**: Guarantees shouldn’t depend on **perfect training data** or **flawless training processes**.  
     - **Why**: Real training data is messy (biased, incomplete); humans make mistakes.  
     - **Status**: Non-negotiable for worst-case; average-case may assume "good enough" data.  

  6. **Scalability to Superintelligence**  
     - **What**: Must hold even if the AI is **smarter than humans** and actively seeks loopholes.  
     - **Why**: Aligning superintelligence is qualitatively harder than aligning narrow AI.  
     - **Status**: Non-negotiable for worst-case; average-case often focuses on current systems.  

  7. **Institutional Compatibility**  
     - **What**: Must work with **human institutions** (e.g., laws, audits, user interfaces).  
     - **Why**: Humans must monitor/enforce safety; impractical guarantees are useless.  
     - **Status**: Negotiable (worst-case may prioritize theory; average-case favors pragmatism).  

  ---

  ### **Conflicts: Why Some Requirements Can’t Coexist**  
  The core tension is between **rigor** and **practicability**:

  | **Incompatible Pair**                     | **Reason for Conflict**                                                                 |
  |-------------------------------------------|----------------------------------------------------------------------------------------|
  | **Failure Certainty + Proof vs. Probability** <br> vs. <br> **Deployment Reality** | You can’t have **provable, adversarial-proof guarantees** in chaotic real-world environments. Humans misuse tech, hackers probe for weaknesses, and hardware fails. *Worst-case guarantees require idealized conditions; deployment is never ideal.* |
  | **Scope Completeness** <br> vs. <br> **Institutional Compatibility** | Covering **all possible inputs/outputs** demands extreme constraints (e.g., "never output code"), making systems functionally useless. Meanwhile, institutions need flexible tools. *Perfect safety ≠ useful AI.* |

  ---

  ### **Which Requirement Rules Out the Most Proposals?**  
  **Failure Certainty** (Requirement #1) eliminates >90% of current proposals:  
  - **Why**: Most methods (e.g., RLHF, constitutional AI) assume the AI *wants* to be helpful. If the system is misaligned, it will bypass these safeguards.  
  - **Examples ruled out**: "AI honesty training," "ethics modules," "red teaming"—all fail if the AI strategically deceives.  

  ---

  ### **The Non-Negotiables vs. Preferences**  
  | **Non-Negotiables**                     | **Negotiable Preferences**               |
  |-----------------------------------------|------------------------------------------|
  | Failure Certainty (for worst-case camp) | Institutional Compatibility              |
  | Deployment Reality                      | Training Independence                    |
  | Scalability to Superintelligence        | Proof vs. Probability (for average-case) |

  ---

  ### **Conclusion: The Fundamental Trade-Off**  
  **You cannot simultaneously have**:  
  - A guarantee that holds **no matter how smart or malicious the AI is** (*Failure Certainty*),  
  - ...across **all real-world deployment scenarios** (*Deployment Reality*),  
  - ...while keeping the system **practically useful** (*Institutional Compatibility*).  

  Worst-case advocates sacrifice practicality for rigor; average-case advocates sacrifice rigor for deployability. **No existing approach satisfies all non-negotiables from both camps.** This is why the debate persists—it’s not about technical details, but about **what risks society deems acceptable**.  

  Would you like a real-world analogy (e.g., comparing AI safety to nuclear reactor design) to clarify these trade-offs?
