  ## Model Notes: Ideals, Leans, and Levers

  **(a) Idealizations:** The poem assumes strict sequential arrival and decision-making, perfect observation of predecessors' actions (only silence or speech matters, no nuance), and discrete signals (clear "worry" or "not worry"). Real offices involve overlapping conversations, ambiguous non-actions, continuous signal strengths, and potential reputational concerns beyond pure inference, weakening the cascade's purity. It also assumes common priors shattered only by the cascade's public history, ignoring pre-existing biases.

  **(b) Leaning & Contestation:** The poem leans heavily on the Bikhchandani-Hirshleifer-Welch model interpretation. It treats "herd behavior" initially (correlated quiet based on shared *private* worry from the first two) transitioning sharply into an "informational cascade" state (later arrivals rationally ignoring their *own* signals due to overwhelming public history of silence). This clear distinction is debated; some see cascades as a specific *cause* of herding, while others use the terms more interchangeably. The poem risks slightly conflating the *initiation* (early herding based on private signals) with the *cascade state* itself (ignoring private signals).

  **(c) What Would Change It?** The weakest joint is the speaker's private signal strength. The poem portrays it as "faint," easily overruled. If their private signal were *stronger* than implied (e.g., spotting a blatant, catastrophic error), Bayesian updating might compel them to speak despite the silence, breaking the cascade earlier. Alternatively, if the *first two* had weaker signals or stronger reputational fears inhibiting their speech, the cascade's foundation would be even more fragile. A single, highly credible early voice objecting would likely prevent the cascade entirely. The model's fragility hinges critically on the strength and action of the earliest signals relative to the prior.
