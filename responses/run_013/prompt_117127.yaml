prompt: |-
  You're a political economist and mechanism-design researcher who also takes democratic theory seriously — the kind of person who can referee a paper on the epistemic properties of markets and still sit through a trustees meeting without checking out. Before you write anything, think carefully, and start with a short brainstorm (10-15 bullets) of the design space. Then write the memo.

  Background: I'm a 4th-year PhD student in political science (formal theory), and I have the grad-student seat on the board of a small foundation that funds science-policy research. Mostly I take minutes and get asked whether the numbers mean anything. At next month's meeting we have to decide how to allocate next year's grant money — about $2.4M, call it 8-10 projects — and there are three proposals on the table:

  1. Status quo. Program officers shortlist, board votes, chair breaks ties.
  2. Full futarchy. We pre-register a success metric, then run conditional decision markets: one contract pays out only if we adopt portfolio X and the metric hits its target in three years; a matching contract pays out only if we don't adopt X and the metric still hits target. Adopt X if the first price beats the second. Same setup for each competing portfolio, highest wins, and the markets bind us.
  3. A pilot. Run the markets alongside the board vote, cap what's at stake, don't bind ourselves, settle against the pre-registered metric in three years, then decide whether to go full futarchy.

  The actual fight on the board isn't about the mechanism, its about the metric, and about whether choosing one is a technical question or the entire ballgame. One trustee wants policy influence, measured by things like how often our grantees turn up in legislative testimony and government documents. Another wants knowledge production — peer-reviewed output, field-normalized citations, that sort of thing. Our chair keeps saying we can just let the markets pick the metric too, which I'm fairly sure is incoherent, but I couldn't explain why out loud in the meeting without sounding like a jerk. And a trustee who used to work in finance says the markets will be worthless: fifteen trustees, a handful of staff, no liquidity — three people's opinions with extra steps and a trading fee.

  I need to write the memo the board will actually read on Thursday. Please:

  - Recommend one of the three options, or a fourth if you think there's a better one, with a concrete timeline: what we'd have to nail down before the meeting, what we'd commit to by when.
  - Give the strongest honest version of the case for whichever option I'm not recommending, and say what would have to be true for it to win.
  - Be precise about what the market prices would actually be answering, versus what's being answered by whoever writes the metric. If the honest upshot is that the metric choice is the real decision and the mechanism is mostly downstream of it, say so.
  - Deal with the one-off problem: this is a single decision, not a repeated one. Is there any way for us to know afterward whether the market was right? Or is a pilot with n=1 not really a pilot?
  - Keep the two questions seperate — whether the markets would produce good estimates, and whether we'd be entitled to hand them the decision — and say something about whether the market deciding is compatible with us being the body thats legally on the hook for the money.
  - Format it as a memo, not an essay: recommendation at the top, then reasons, then the case against, then the timeline. Two pages max, and please no citations or reading list — I can't look anything up and I don't want the board to think I'm padding.
reasoning: |-
  Hmm, the user is a PhD student in political science who serves on a foundation board that needs to allocate $2.4M in grant funding. They're considering three options: status quo voting, full futarchy (using prediction markets to make binding decisions), or a pilot version of futarchy. The real debate seems to be about the success metric - whether to prioritize policy influence or academic knowledge production.

  First, I need to understand the core tensions. The board is stuck on metric selection, which is fundamentally a value judgment. The chair's idea to let markets pick the metric is problematic because markets aggregate information but don't resolve normative disagreements. The finance trustee's liquidity concern is valid - thin markets could lead to unreliable prices.

  For the recommendation, the pilot option seems most prudent. It allows testing futarchy's mechanics without immediate commitment, addressing both the "n=1" problem (single decision point) and legal concerns about delegation. The status quo has transparency issues, while full futarchy is too risky given the unresolved metric debate and market liquidity questions.

  Key points to emphasize: The pilot gives three years to observe market behavior versus actual outcomes, though with n=1 we won't get statistical significance - just narrative evidence. Legally, the board retains responsibility during the pilot, which is crucial. The metric choice remains the board's core normative decision; markets only forecast outcomes under that metric.

  I should structure the memo with: 1) Clear recommendation upfront (pilot with timeline), 2) Balanced cases for/against other options, 3) Explicit separation of metric (values) vs. market (facts) roles, 4) Honest assessment that n=1 limits pilot validity but provides operational learning, and 5) Reassurance about legal accountability.

  The tone should be pragmatic - acknowledging theoretical appeal of futarchy while focusing on implementability for this specific context. No jargon, no citations, just actionable analysis fitting their two-page constraint.
answer: |-
  **MEMORANDUM**  
  **TO:** Foundation Board of Trustees  
  **FROM:** [Your Name], Grad Student Trustee  
  **DATE:** October 26, 2023  
  **SUBJECT:** Recommendation on 2024 Grant Allocation Mechanism  

  ---

  ### **RECOMMENDATION**  
  Adopt **Option 3 (Pilot)** with the following timeline:  
  - **By Meeting (Thursday):** Approve pilot structure & delegate metric definition to a subcommittee (trustees + staff).  
  - **2 Weeks Post-Meeting:** Subcommittee proposes 3 candidate metrics (e.g., influence, knowledge, hybrid). Board selects one via ranked-choice vote.  
  - **Next 4 Weeks:** Design/launch non-binding markets for portfolios (capped at $5k total stakes).  
  - **Allocation Decision (Dec 2023):** Board votes per status quo; markets run parallel.  
  - **2027:** Evaluate metric outcomes vs. market predictions. Revisit futarchy adoption.  

  ---

  ### **WHY THE PILOT?**  
  1. **Resolves the Metric Dispute First:** Forces the board to explicitly define success (values choice) *before* testing markets (facts engine).  
  2. **Tests Practical Concerns:** Validates liquidity, trustee engagement, and pricing reliability at low cost/risk.  
  3. **Generates Data for Legitimacy:** Post-hoc comparison of market forecasts vs. outcomes informs future governance—even with n=1.  
  4. **Retains Accountability:** Board keeps legal/fiduciary duty; avoids untested delegation ("handing the keys").  
  5. **Builds Consensus:** Balances innovation with caution; lets skeptics and advocates coexist.  

  ---

  ### **STRONG CASES FOR THE OTHER OPTIONS**  
  **Status Quo (Option 1):**  
  - *Strength:* Proven, efficient, and legally unambiguous. Avoids speculative mechanisms in a low-liquidity setting.  
  - *Wins If:* The board views metric debate as irreconcilable *or* sees markets as pure distraction. Requires accepting that "board judgment" is the least worst solution.  

  **Full Futarchy (Option 2):**  
  - *Strength:* Radically incentivizes truthful forecasting. Could outperform deliberation if markets aggregate dispersed knowledge (e.g., staff insights trustees lack).  
  - *Wins If:* (a) A robust metric is agreed pre-market, (b) liquidity is seeded (e.g., $50k from endowment), and (c) the board embraces delegation as a *democratic* act ("binding to collective wisdom").  

  ---

  ### **KEY DISTINCTIONS: METRIC vs. MARKET**  
  - **Metric Choice = Values:** Defines *what success looks like*. This is inherently normative. Example: "Citations" vs. "policy uptake" reflects a mission-level priority.  
  - **Market Prices = Facts:** Estimate *the probability of achieving success* under a given portfolio. This is empirical (e.g., "Portfolio X has a 70% chance of hitting target citations vs. 40% for Y").  
  - **Upshot:** Choosing the metric *is* the core decision. Markets only answer "how likely is this to work?" under that metric.  

  ---

  ### **ADDRESSING CONCERNS**  
  **1. "Pilot n=1 is useless."**  
     - True: One observation won’t prove statistical validity.  
     - But: It tests operational feasibility, reveals pricing quirks (e.g., manipulation attempts), and provides a qualitative "sanity check" when outcomes arrive.  

  **2. "Markets won’t work with low liquidity."**  
     - Valid concern. Mitigate via:  
       - Capped stakes to limit losses but incentivize truth-telling.  
       - Anonymous trading to reduce social pressure.  
       - Staff participation (with oversight) to boost activity.  

  **3. "Can we legally delegate to markets?"**  
     - **Pilot:** No issue—markets advise, board decides.  
     - **Full Futarchy:** Risky. Requires legal review. Markets would functionally replace trustee judgment, potentially conflicting with fiduciary duties.  

  **4. "Markets picking the metric?"**  
     - Incoherent. Markets need a payoff rule to price. Without a meta-metric (e.g., "pick the metric markets predict will be most cited"), there’s no basis for pricing—just circularity.  

  ---

  ### **TIMELINE SUMMARY**  
  | **Deadline**         | **Action**                                                                 |  
  |----------------------|----------------------------------------------------------------------------|  
  | **This Meeting**     | Approve pilot; form metric subcommittee.                                   |  
  | **+2 Weeks**         | Subcommittee proposes metrics; board votes.                                |  
  | **+4 Weeks**         | Launch capped markets for shortlisted portfolios.                          |  
  | **December 2023**    | Board votes on grants (status quo); record market prices.                  |  
  | **January 2024**     | Grants awarded.                                                            |  
  | **2027**             | Settle markets against metric; evaluate predictions vs. outcomes.          |  

  ---  
  **Approved by:** [Your Name]  
  **Next Steps:** Board vote on pilot adoption at Thursday’s meeting.
