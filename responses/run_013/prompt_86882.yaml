  First, I need to understand each criterion. Topological is about the shape having one enclosed counter. Genealogical ties to historical roots. Ductus-based focuses on stroke order and number. Differential is about distinctness from other letters. Ecological is reader comprehension in context. Constructive is about fitting the style's generative grammar.

