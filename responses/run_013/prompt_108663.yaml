  Okay, the user is part of a reading group discussing "lexical-threshold negative utilitarianism." They want to nail down the essential requirements for any theory comparing pleasure and pain before debating its validity. Let me unpack their query.

  First, they describe the view: there's a threshold of suffering where below it, pain and pleasure can be traded off, but above it, no amount of pleasure can compensate. The user wants the criteria for an adequate account, not opinions on the theory itself. They list specific cases the theory must handle, distinctions it shouldn't collapse, and constraints it must respect. They're especially concerned about combining lexical thresholds with expected value under uncertainty and non-negligible risk of threshold suffering.

  Looking deeper, the user likely wants to avoid unproductive debates by establishing clear criteria upfront. They might be frustrated with the group circling arguments without a solid foundation. Their unspoken need is a structured framework to evaluate theories objectively, highlighting where trade-offs are necessary. They suspect the lexical view might have internal conflicts, especially around uncertainty, and want to know if it's salvageable.

  The key requirements include handling intensity-duration trade-offs, aggregation across individuals, thresholds in quality of life, and distinguishing between sensation and suffering. Constraints involve real-world trade-offs in medicine, diminishing returns, and subjective pain tolerance. The conflicts arise between lexical dominance, expected value, and non-negligible risk—forming an impossibility trio. If any two are held, the third must give. Typically, proponents drop strict expected value for alternatives like maximin or lexical thresholds. 

  The most impactful requirement is handling uncertainty, as it challenges lexical views. To salvage the idea, one might use lexical thresholds only for known outcomes or adopt a two-tier expected value approach. However, these have limitations. The user needs clarity on which requirements are non-negotiable versus preferences, and where compromises weaken the theory. Highlighting these trade-offs will help their group move beyond surface arguments to substantive evaluation.
answer: |-
  Here’s a distillation of the core requirements for an adequate theory of pleasure-pain comparability ("the spec"), the key conflicts, and how lexical-threshold negative utilitarianism (LTNU) navigates them:

  **I. Non-Negotiable Requirements (The "Must-Haves"):**
  These are widely agreed upon as essential for any plausible theory:

  1.  **Non-Trivial Tradeoffs:** Must allow *some* compensation of pain by pleasure and vice-versa in *some* scenarios (refuting pure absolutism). *(Constraint: Real-world decisions in medicine/animal welfare)*
  2.  **Asymmetry Acknowledgement:** Must reflect the plausible intuition that preventing severe suffering often takes priority over achieving equivalent pleasure (negative bias). *(Constraint: Moral urgency of suffering)*
  3.  **Sensitivity to Intensity & Duration:** Must explain why (a) intense pain for a short time differs from mild pain for a long time, and (b) neither intensity nor duration alone determines overall disvalue. *(Cases: Long dull ache vs. short sharp one)*
  4.  **Sensitivity to "Mattering":** Must distinguish mere unpleasant sensation ("pain") from profound suffering that dominates well-being or undermines agency. *(Distinction: Sensation vs. Suffering; Case: Shrug-off pain vs. life-swallowing pain)*
  5.  **Diminishing (Marginal) Returns:** Must accommodate that relieving pain becomes less urgent (per unit) as baseline suffering decreases, and that adding pleasure becomes less valuable (per unit) as baseline pleasure increases. *(Constraint: Pain relief/pleasure pursuit)*
  6.  **Subjectivity/Respect for Reports:** Must be consistent with the fact that identical stimuli cause vastly different suffering levels across individuals/species, and that self-reports of "not minding" a sensation must be taken seriously. *(Constraint: Individual variation in pain tolerance/reporting)*
  7.  **Aggregation Framework:** Must provide a coherent method for comparing outcomes involving different numbers of individuals. *(Case: One person's agony vs. many mild pains)*

  **II. Contentious Requirements (Where Theories Diverge - "The Camps"):**
  These are points where different theories make different choices, revealing their core commitments. LTNU makes specific choices here:

  8.  **Threshold Existence (Lexicality):** Is there a level of suffering beyond which *no* amount of pleasure/absence-of-pain elsewhere can compensate for its presence? *(LTNU: **YES**, this is its defining feature)*
  9.  **Aggregation Permeability:** Can large numbers of individuals experiencing *sub-threshold* disvalue (mild pains) outweigh the disvalue of *one* individual experiencing *super-threshold* suffering? *(LTNU: **NO** - super-threshold suffering lexically dominates any number of sub-threshold pains)*
  10. **Life Comparison:** Can a life of low-grade contentment *without* intense suffering be preferable to a life containing intense suffering but also greater peak pleasures? *(LTNU: **NO** if the suffering crosses the threshold - the misery trumps lexically)*
  11. **Interpersonal Comparability Strength:** Do we have sufficiently precise cardinal measurements to make *fine-grained* tradeoffs *across* lives, or only rough comparisons? (LTNU relies on enough comparability to identify the threshold).

  **III. The Core Conflict: Lexical Thresholds vs. Uncertainty & Expected Value**
  Your suspicion is **correct**. Holding all three below simultaneously is **impossible**:

  *   **(a) Lexical Dominance Above Threshold:** Suffering above threshold T is infinitely worse than any suffering below T. No amount of sub-T disvalue/pleasure compensates for one unit of super-T suffering.
  *   **(b) Compare Options by Expected Value (EV):** The value of a risky choice is the probability-weighted sum of the values of its possible outcomes.
  *   **(c) Non-Negligible Chance of Threshold Suffering:** For many significant actions, there is a probability p > 0 (even if small) that it could cause suffering crossing T.

  **Why Incompatible?**
  Suppose you have two options:
  *   **Option A:** Guaranteed to cause suffering S (intense, but *just below* T).
  *   **Option B:** Has a very high probability (1 - ε) of causing *no suffering*, but a tiny probability (ε) of causing suffering *just above* T (S+).

  *   **LTNU Value:**
      *   Value(A) = Disvalue(S) [Large finite negative number]
      *   Value(B) = (1-ε) * 0 + ε * (Disvalue(S+)) = ε * (-∞) = **-∞** (Because S+ > T has infinite disvalue).
  *   **Expected Value Calculation (if using LTNU values):**
      *   EV(B) = -∞
      *   EV(A) = Large finite negative number.
      *   Therefore, EV(B) << EV(A). LTNU-EV *always* prefers the *guaranteed* sub-T suffering (A) over the *risky* option with *any* chance of super-T suffering (B), no matter how small ε is or how bad S is.

  **This is absurd.** It implies you should *always* choose guaranteed, arbitrarily severe suffering (as long as it stays microscopically below T) over an option with a 0.0000001% chance of causing suffering microscopically above T, even if the alternative has a 99.9999999% chance of causing *no suffering at all*. This paralyzes decision-making.

  **Which One Do Proponents Give Up?**
  Proponents of lexical thresholds **must give up (b): Strict Expected Value Maximization under Cardinal Utility**. They cannot directly plug their lexical values into an EV calculation.

  **What Do They Do Instead? (Salvaging Lexicality):**
  1.  **Maximin/Rectify Worst-Case:** Focus solely on preventing the worst possible outcome (super-T suffering). Choose the option with the *least bad* worst-case scenario. (B is worse because its worst-case is S+ > T, while A's worst-case is S < T).
  2.  **Lexical Thresholds Apply Only to Known Outcomes:** Use EV *within* the sub-threshold domain and *within* the super-threshold domain, but treat any option risking *any* super-T suffering as infinitely worse than any option guaranteeing only sub-T outcomes, regardless of probabilities. This essentially uses a **leximin** rule across threshold categories.
  3.  **Two-Tier EV:** Assign finite but *astronomically large* disvalue to super-T suffering. The disvalue is so high that even tiny probabilities make avoiding super-T suffering dominate unless the probability is *truly negligible* (effectively zero). This approximates lexicality but technically avoids -∞. (The line between "astronomically large" and "infinite" is blurry in practice).

  **Does Giving Up Strict EV Cost Them the View?**
  *   **Cost:** Yes, significantly. It abandons a core tenet of standard consequentialism (maximizing expected value based on a cardinal scale) and replaces it with a more complex, risk-averse, or threshold-sensitive decision rule. It makes the theory much less straightforward to apply under uncertainty.
  *   **Survival:** The *core lexical idea* (super-T suffering cannot be compensated) survives, but its *implementation* under uncertainty becomes messy and potentially counterintuitive. The view morphs into "Lexical-Threshold Negative Utilitarianism *with Extreme Risk Aversion towards Threshold Crossing*".

  **IV. The Most Damaging Requirement Against Popular Positions**
  **Handling Uncertainty (Requirement implied by real-world decision-making)** is the most powerful.

  *   **It Rules Out:** Pure lexical views (if they naively use EV), strict total utilitarianism (which ignores asymmetry and thresholds), and some forms of prioritarianism (if they don't handle threshold risks adequately).
  *   **It Favors:** Theories that can smoothly integrate risk without absurd implications:
      *   **Standard Utilitarianism:** Handles uncertainty via EV naturally. (But fails on asymmetry/thresholds).
      *   **Prioritarianism:** Can handle EV if weights are finite. (But may struggle with strict lexical intuitions).
      *   **Sufficientarianism:** Focuses on getting above a *positive* threshold; handles risk better than negative lexical thresholds but doesn't directly address the pain/pleasure tradeoff asymmetry.
      *   **Negative Utilitarianism without Lexicality (e.g., with steep but finite weighting):** Can use EV but faces aggregation puzzles (mountains of mild pain outweighing agony).

  **V. Stating Lexicality to Survive?**
  Lexicality can *only* "survive" the uncertainty requirement by fundamentally changing its decision procedure under risk, as outlined above (Maximin, Lexical Categorization, or Astronomical Weighting). You cannot preserve *both* pure, infinite lexical dominance *and* standard expected value maximization in the face of non-zero risk. The price is abandoning standard EV.

  **Summary of Key Collisions:**

  *   **Lexical Threshold + Non-Negligible Risk + Standard EV = IMPOSSIBLE TRIO.** Sacrifice Standard EV.
  *   **Aggregation Permeability:** Lexical views forbid aggregating mild pains to outweigh agony. Non-lexical views (like total util) allow it. (Case: One agony vs. many mild pains).
  *   **Life Comparison:** Lexical views prioritize avoiding misery over achieving peak pleasure in a life. Other views allow compensation. (Case: Day of misery vs. lifetime of contentment).
  *   **Sensation vs. Suffering:** Any adequate theory *must* distinguish them. Lexicality focuses the threshold on *suffering*, not mere sensation.

  The core tension is between the powerful intuitive pull of lexical thresholds for extreme suffering and the mathematical and practical demands of decision-making under uncertainty. LTNU buys the intuition at the cost of complex, risk-averse decision rules. Other views buy tractability at the cost of allowing (in principle) compensation for even the worst suffering.
