answer: |-
  ## Tea Leaves and Meaning: A Sceptical Brew

  **Setting:** A worn sofa and armchairs in a shared living room, mugs of tea growing cold. Anna and Benedict are revisiting the week’s Kripke reading, the tilted card incident fresh in their minds.

  **Anna:** (Leaning forward, tapping her notebook) Right, Benedict, let’s revisit our tilted card. Sarah props it up askew, and suddenly Charles is adamant it means “tea ready”, while Marie insists it’s ambiguous or even “brewing”. Kripke’s point, using our little kettle code, is glaringly obvious, isn’t it? *What fact* settles it? What *actually* makes Charles right or Marie right about what that tilted position *meant*?

  **Benedict:** (Sighing, stirring his tea) It seems obvious to *me*, Anna. The rule was fixed when they set it up: red for on, amber for brewing, green for ready. Flat against the kettle, specific colours. That’s the agreement. The tilted card wasn’t part of the scheme. It’s simply an error, a misuse – a *failure* to follow the rule.

  **Anna:** But *how* was it fixed? Point to the fact. Was it the initial agreement two years ago? Just words uttered then? Those words themselves are open to infinite interpretations. Was it the two years of perfect use? But that’s only a *finite sequence* of applications: red-card-flat, amber-card-flat, green-card-flat. That sequence is equally compatible with countless rules.

  **Benedict:** Don’t be absurd. It’s compatible with the rule they *intended* and *followed consistently*! The rule is defined by their *understanding* at the time of setting it up, reinforced by every correct subsequent use. Their shared practice *embodies* the rule.

  **Anna:** Ah, but *what* understanding? Kripke’s genius is showing that ‘understanding’ isn’t some magical mental talisman that fixes all future applications. Let’s concoct a monstrous rule, Benedict. Suppose the *real* rule Charles meant all along was: “Use red-flat when the kettle *just turns on*, amber-flat when brewing, green-flat when ready – *unless* it’s the third Tuesday after a full moon, in which case *any* card tilted at precisely 17 degrees means ‘ready’, regardless of colour or kettle state.” Absurd? Absolutely. But *logically possible*? Given *only* the past finite uses, which never happened on that specific third Tuesday? Yes! Nothing in the past applications *rules it out*.

  **Benedict:** (Shaking his head) That’s just sophistry. You’re ignoring the *dispositions*. Charles and Marie *disposed* themselves only to use the flat cards in the three standard positions for those states. They were disposed *not* to use tilted cards. They *would have* corrected Sarah immediately if they’d seen her do it. *That’s* what constitutes their grasp of the rule – their stable dispositions to behave in certain ways.

  **Anna:** (Nodding emphatically) Precisely the point I hoped you’d make! Dispositions tell us what someone *would* do, not what they *ought* to do. What *grounds* the difference between Charles ‘correctly’ correcting Sarah and him merely acting according to his present inclination? If his disposition *is* the fact of his meaning, then whatever he’s disposed to say *is* correct by definition! But that’s nonsense. We all feel there’s a *norm* here, a ‘should’. When Sarah tilted the card, there *was* a question of what she *should* have done, based on the *meaning* of the code. But if meaning just *is* disposition, then Charles correcting her just becomes Charles having one disposition overriding Sarah’s different disposition. Where’s the *rule*? Where’s the *ought*? It collapses into mere behaviourism.

  **Benedict:** (Pausing, thinking) It’s not *just* individual disposition, Anna. It’s the *shared* practice, the *communal agreement* embedded in their actions over two years. The normativity arises from the social context. Their consistent joint action *established* the standard. Charles correcting Sarah isn’t just *his* inclination; it’s him upholding the standard *they* created together. The ‘ought’ comes from the commitment implicit in their shared practice.

  **Anna:** But Benedict, doesn’t Kripke’s scepticism apply just as fiercely to the community? Imagine a monstrous *communal* rule: “For the first million uses, act *as if* it’s red=on, amber=brew, green=ready-flat. But if anyone ever uses a tilted card, that triggers the *real* rule, which is…” and you can fill in any bizarre stipulation. The *finite* past communal practice is equally compatible with this monstrosity as with the simple rule you assume. How does the community’s past *fix* one unique future application for the tilted card? Their shared disposition *now* to call it wrong doesn’t prove that’s what they *meant* all along; it just shows what they are disposed to do *now*.

  **Benedict:** (Leaning back, looking frustrated but thoughtful) You’re forcing me to the edge. I see the force of the sceptical challenge; it’s deeply unsettling. But I can’t accept that meaning simply vanishes. There *was* a rule. Charles and Marie *did* mean something specific. Perhaps the grounding is… primitive? The agreement wasn’t just words; it was an *act* of establishing a convention within their life together. The meaning resides in the *practice itself*, not in some ghostly fact beyond it. Their confident agreement on every previous occasion, their unhesitating application, *is* the manifestation of the rule. When they disagree on the tilted card, it’s not that there was no fact; it’s that their practice hadn’t yet encountered this edge case. The rule needs *extending*, not declaring void.

  **Anna:** And how do they extend it ‘correctly’? According to what standard? If they extend it differently – Charles says tilted green means ready, Marie says it means error – what fact determines who is being true to the original meaning? Isn’t the sceptic saying that *any* extension is a *new* decision, a leap beyond what was fixed? The ‘original meaning’ simply doesn’t reach this far. The confidence Benedict mentions – that’s just psychological certainty. It feels like following the rule, but Kripke argues we cannot point to anything *in the past facts* that *justifies* that feeling over any other possible way of going on. The abyss opens right there, at the tilted card.

  **Benedict:** (Staring into his tea) So, you’re saying that for two years, they thought they were sharing a language, a code, but it was an illusion? That there was never a determinate fact about what ‘green card flat’ *meant*, only that they happened to agree up to that point? That seems… impossible to live with. It dissolves the possibility of communication entirely.

  **Anna:** Kripke doesn’t say communication is impossible. He offers a ‘sceptical solution’ – we *do* communicate, but not because meaning is fixed by facts about individuals or their past. It’s grounded in communal agreement *going forward*, in being admitted into a practice. Sarah learned the code by being told, and by conforming to *future* expectations. The tilted card isn’t covered by a past fact; it’s a moment requiring a *new* agreement within the practice. The ‘meaning’ isn’t a pre-existing rail; it’s the path we tread together as we go.

  **Benedict:** But without *some* connection to the past intention, some sense of fidelity… Doesn’t that just make meaning arbitrary? Why call it the *same* code?

  **Anna:** (Shrugging slightly) The sceptic says that’s the puzzle. We feel the pull of the rule, the ‘ought’, but when we look for its foundation in facts about past mental states, dispositions, or even communal history, it seems to vanish. The tilted card exposes the gap. We have to go on, Benedict, but perhaps without the metaphysical comfort of thinking the rule was laid down in stone two years ago. We just… agree. Or disagree. And the practice continues, or it doesn’t.

  **Benedict:** (After a long silence) I need another spot of tea. And I suspect this pot has gone stone cold. Much like my confidence in how we ever manage to mean anything at all. Pass the biscuits, Anna. We clearly need fortification.

  **Anna:** (Managing a small smile) Quite. Pass the green card, would you? Flat, please. We’ll assume it means ‘ready’… for now.
