  We are auditing a passage that claims to resolve the two-envelope paradox by pointing out that the assumption of "equally likely" for the two possibilities (that the other envelope contains either double or half) presupposes a flat prior over an unbounded range, which is improper. The passage claims that if we use a proper prior, then the expected gain from switching is zero.

