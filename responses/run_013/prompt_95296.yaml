            If we have the smaller: switching gives 2x - x = +x
            If we have the larger: switching gives x/2 - x = -x/2

          So:
            E[gain] = [f(x)/(f(x)+f(x/2))] * x + [f(x/2)/(f(x)+f(x/2))] * (-x/2)
