     - The problem is that if we take the set of possible amounts to be unbounded (like all positive reals), then a flat prior (uniform over the positive reals) is improper (not a valid probability distribution because it doesn't integrate to 1). This is a key point.

  3. **The expected value calculation**: (40+10)/2 = £25, which exceeds £20, so switching seems beneficial.

     - This is the standard paradoxical calculation.

  4. **The resolution**: The passage claims that if we specify a proper prior, then the two cases (that the other envelope has 40 or 10) are no longer equiprobable, and the expected gain from switching is exactly zero.

     - This is the core claim we must audit.

     - Example: Suppose we have a proper prior on the smaller amount, say S. Let the prior distribution be f(s). Then the two envelopes contain S and 2S.

     - We pick an envelope at random. The amount we see, call it X, can be either S or 2S. The probability of seeing X when the smaller is s is:
          P(X=x | S=s) = 
              (1/2) if x = s and we picked the smaller, 
              (1/2) if x = 2s and we picked the larger.

          But note: if we see X=x, then the pair must be either (x/2, x) [if x is the larger] or (x, 2x) [if x is the smaller]. However, the prior on S must be such that it can produce the observed x in one of these two ways.

     - The posterior probability that the observed x is the smaller (so the other is 2x) is:
          P(S=x | X=x) = [P(X=x | S=x) * f(x)] / [total probability of seeing x]
          Similarly, the posterior probability that the observed x is the larger (so that the other is x/2) is:
          P(S=x/2 | X=x) = [P(X=x | S=x/2) * f(x/2)] / [total probability of seeing x]

       The total probability of seeing x is:
          P(X=x) = (1/2) * f(x)   [if x is the smaller] + (1/2) * f(x/2)   [if x is the larger]

          So:
          P(S=x | X=x) = [ (1/2) f(x) ] / [ (1/2) f(x) + (1/2) f(x/2) ] = f(x) / [f(x) + f(x/2)]
          P(S=x/2 | X=x) = [ (1/2) f(x/2) ] / [ (1/2) f(x) + (1/2) f(x/2) ] = f(x/2) / [f(x) + f(x/2)]

     - Then the expected value of switching is:
          E = P(S=x | X=x) * (2x - x)   [if we switch when we have the smaller: we go from x to 2x, gain x] 
