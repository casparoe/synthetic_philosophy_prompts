prompt: |-
  I am a novelist, four books in, and I have contracted to write a fifth: a novel set in the middle of the nineteenth century, largely inside the household of a provincial official serving an empire. I have spent three years reading in the period, and I can now hear its idiom in my sleep, which is exactly what worries me. The book obliges me to make, at a rate of perhaps once a page, a decision for which I have no method: how to render conduct and attitudes that my characters take entirely for granted and that my readers will find monstrous — the ordinary management of servants, the correction of children and of servants, casual religious contempt, the assumption that some lives are worth less than others. Occasionally the polarity reverses, and I must render something my characters take for granted that my readers will find admirable.

  I have read enough history to distrust the easy answers. I know that the standards of a period are not one thing, that some of my characters' contemporaries were already arguing against what my characters do, and that when a person invokes the standards of the time they usually mean the standards of whoever in that time was powerful enough to have theirs recorded. I know that the question whether a person could reasonably have known better is not the question whether what they did was wrong, and that both differ from the question whether I, four generations later, may condemn them. I know that my narrator is a present-day instrument and that a novel has no footnotes with which to hold my judgments at arm's length. And I know that the two failure modes — the costume drama in which the reader is invited to enjoy cruelty because that is how it was, and the moral pageant in which my characters are merely late-arriving versions of my readers — are not opposites but the same failure approached from two directions.

  What I want from you is a procedure, not an essay. Give me an ordered set of questions I can run on a single scene while drafting: what counts as a sufficient answer to each; where the procedure stops and tells me to render the scene in period terms with no signal at all; where it stops and tells me the scene cannot be written as drafted; and where it hands the decision back to me as a question of values rather than craft. Keep it short enough to run in the middle of a working day, and mark which steps are judgment calls dressed up as procedure. Tell me where it will misfire, and on what kind of scene.

  Then run it, in full, on three scenes. First, my protagonist — whom I want the reader to love for eighty pages before this moment — orders a flogging that was lawful and unremarkable in his world, of a man we have not met and will not meet again. Second, a genuinely funny comic set piece at the expense of a religious minority, in which the most charming character in the book is also the funniest; the scene works on the page and I want to keep it. Third, a scene in which the practice in question was already contested by articulate contemporaries and my character is knowingly on the wrong side of a live argument — this is where the procedure must do the most work.

  At least one of these should come out of your procedure with an answer I will not like; do not soften it on my account. Then tell me what the procedure cannot do, and in particular whether it can answer the question I actually lose sleep over, which is not whether a scene is anachronistic but whether the book should exist in this form at all.

  No bibliography, no reading list, no citations — I am not writing a thesis and I have no way to check them. Argue from positions and reasons I can follow without having read the secondary literature.
reasoning: |-
  Okay, the user is a novelist working on a historical novel set in the mid-19th century. They're struggling with how to portray attitudes and behaviors that were normal then but are considered monstrous today. They want a practical procedure to evaluate scenes, not an essay. Let me break down their needs.

  First, the core issue is balancing historical authenticity with modern reader sensibilities. They mentioned avoiding two failure modes: the costume drama that glorifies past cruelty and the moral pageant that makes characters modern. Both are essentially the same problem—failing to engage critically with the past.

  The user has deep knowledge of the period, so they need a tool to apply that knowledge consistently. They want a step-by-step process for each scene. The three examples they provided are key: the flogging scene, the comic set piece with religious contempt, and the contested practice scene. Each tests different aspects of the procedure.

  For the procedure, it needs to be efficient—usable during a writing day. Steps should include identifying the action, its purpose in the narrative, period norms, contemporary dissent, and reader impact. Each step must have clear criteria to determine if a scene needs modification or can be rendered as-is.

  The flogging scene requires making the protagonist likable early on, yet he orders a brutal punishment. The challenge is to show this without alienating readers. The procedure should flag if the narrative implicitly endorses the action or if it's presented critically. Maybe the solution is to show the protagonist's internal conflict or the victim's perspective briefly.

  The comic scene risks promoting bigotry through humor. The procedure must assess if the humor relies on the minority's dehumanization. If so, it might need reworking to target the perpetrators instead. But if the charm comes from wit unrelated to the prejudice, it might be salvageable.

  The contested practice scene involves a character knowingly opposing contemporary reformers. Here, the procedure should explore how to present the character's justification without letting the narrative endorse it. Footnotes aren't an option, so the dissent must be woven into the narrative through dialogue or other characters.

  Potential pitfalls: The procedure might misfire on scenes where the action is integral to the plot but ethically challenging. Also, it can't answer the meta-question of whether the book should exist. The user's deeper anxiety is about their role in depicting these atrocities. The procedure can guide scene-level decisions but can't absolve the author of broader ethical responsibility. They must decide if the project's critical engagement justifies its existence, which involves personal and artistic values beyond the procedure's scope.
answer: |-
  Here is a procedural checklist for evaluating problematic historical attitudes in scenes. Run it sequentially for each contentious moment. **Bold** denotes judgment calls disguised as procedure.

  **The Procedure: Scene Evaluation Matrix (SEM)**

  1.  **Action & Attitude:** Precisely identify the conduct/attitude depicted. What *exactly* happens or is expressed?
      *   *Sufficient Answer:* A clear, specific description of the act/thought itself.
      *   *Stop & Flag:* If the action is so extreme it fundamentally breaks reader empathy with a core character irreparably *at this point in the narrative*. (Rare). **Judgment Call: Irreparable break?**
  2.  **Narrative Function:** What work is this specific action/attitude doing *in the scene*? (e.g., plot propulsion, character revelation, worldbuilding, thematic resonance, humor).
      *   *Sufficient Answer:* A clear statement of the scene-level purpose.
      *   *Stop & Flag:* If the *only* function is shock value, gratuitous cruelty, or lazy stereotyping. **Judgment Call: Gratuitous?**
  3.  **Period Normality:** Was this conduct/attitude genuinely commonplace and uncontroversial *for people like this character* in this specific context?
      *   *Sufficient Answer:* "Yes, based on X source/example," or "No, evidence shows Y dissent/exceptions."
      *   *Stop & Render As-Is:* If genuinely commonplace *and* uncontested (Step 4) *and* its depiction doesn't inherently endorse it (Step 5). Proceed otherwise.
  4.  **Contemporary Dissent:** Was this conduct/attitude actively argued against *by articulate contemporaries* (not just outliers) known to exist *within the character's possible sphere of awareness* (e.g., published works, sermons, local debates)?
      *   *Sufficient Answer:* "Yes, evidence of Z contemporary critique," or "No evidence of significant contemporary challenge."
      *   *Stop & Flag:* If significant contemporary dissent existed *and* the character plausibly knew/had access to it. **Judgment Call: Plausible awareness?**
  5.  **Narrative Endorsement:** Does the *way the scene is written* implicitly endorse the conduct/attitude? (Consider: Whose perspective dominates? Is there narrative irony? Are consequences shown? Is it presented as admirable/effective/funny without counterpoint? Does the prose itself flinch or coolly observe?).
      *   *Sufficient Answer:* Analysis of POV, tone, descriptive language, focus, and consequences within the scene.
      *   *Stop & Rewrite:* If the scene *uncritically endorses* the conduct/attitude. **Judgment Call: Implicit endorsement?**
  6.  **Reader Impact:** What is the *likely* visceral impact on the *modern* reader? (Revulsion, discomfort, laughter, validation, alienation from character/story?).
      *   *Sufficient Answer:* An honest assessment of probable reader reaction based on the scene's construction.
      *   *Stop & Hand Back:* Always. This is the core value judgment. The procedure identifies *what* and *how*, but *whether* the impact is acceptable for *your* novel is an authorial decision. **Judgment Call: Acceptable impact?**

  **Where it Misfires:**
  *   On subtle, systemic attitudes woven throughout (vs. discrete "moments").
  *   On scenes where the "monstrous" action is foundational to the plot but ethically catastrophic.
  *   When assessing whether a character's *internal* moral struggle (if any) is sufficiently rendered.

  ---

  **Running the SEM on Your Scenes:**

  **Scene 1: Protagonist Orders Flogging (Lawful, Unremarkable)**
  1.  **Action:** Protagonist, a magistrate/official, lawfully sentences an unseen, minor offender to corporal punishment (flogging).
  2.  **Function:** Establish protagonist's authority, routine nature of judicial power, worldbuilding (harsh justice system), *possibly* foreshadow later attitudes or test reader empathy.
  3.  **Normality:** Yes. Commonplace judicial/disciplinary action globally in that era.
  4.  **Dissent:** While philosophical debates existed about cruelty, *routine* judicial corporal punishment for minor offenses wasn't broadly contested in mainstream provincial governance. Dissent focused on extremes, not routine application. *(Assuming your research confirms this for the specific context)*.
  5.  **Endorsement:** **Crucial Judgment Call.** How is it written?
      *   *If written:* As a bland administrative task, focused on paperwork/procedure, protagonist detached. *Risk:* Normalizes/trivializes brutality. Might endorse the system by omission.
      *   *If written:* Focus on protagonist's minor discomfort quickly suppressed, the cold efficiency of the system, the *absence* of victim's voice. *Risk:* Still potentially endorsing by showing protagonist's ease.
      *   *Avoid:* Glorifying the punishment, showing it as particularly effective/just.
  6.  **Impact:** Likely shock, discomfort, potential alienation from protagonist.
      *   *SEM Output:* **Renderable, BUT requires extreme care in execution (Step 5).** Focus on the banality, the system, the protagonist's unquestioning acceptance *as part of his character flaw*. Do *not* sanitize, but do *not* linger on violence gratuitously. The alienation risk is high, but potentially acceptable *if* it serves a later character arc or thematic point. **Handed Back for Value Judgment:** Is the potential alienation *at this early stage* worth the worldbuilding/character setup? Can his "lovable" traits survive this?

  **Scene 2: Comic Set Piece at Minority's Expense (Funny, Charming Character)**
  1.  **Action:** "Charming" character engages in humor (dialogue, situation) that relies on mocking/othering a religious minority.
  2.  **Function:** Comic relief, reveal charming character's wit, worldbuilding (prevalent prejudice), possibly bonding with others through shared mockery.
  3.  **Normality:** Yes. Casual religious contempt was widespread.
  4.  **Dissent:** Yes. Religious tolerance arguments existed (Enlightenment, liberal theology), though minority rights advocacy was less developed. **Judgment Call:** Could this charming, witty character plausibly have encountered dissenting views? Possibly.
  5.  **Endorsement:** **CRITICAL JUDGMENT CALL.** *Where does the humor come from?*
      *   *If humor relies solely* on the minority's "strange" practices or inherent characteristics presented as ridiculous/inferior: **Endorsement is high.** The scene *is* the bigotry, presented as funny.
      *   *If humor relies on* the charming character's wit, misunderstanding, or absurd situation *that also involves* prejudice, but the *funny part* is the character's folly or the situational absurdity, *not* the inherent inferiority of the minority: **Endorsement is lower.** The prejudice is the setting, not the punchline.
      *   *Avoid:* Punchlines that are just slurs or stereotypes. Laughing *at* the victims.
  6.  **Impact:** Modern readers likely find it uncomfortable at best, offensive at worst. Could ruin the charming character.
      *   *SEM Output:* **High Risk of Requiring Rewrite (Steps 4 & 5).** Significant contemporary dissent existed. The scene *only* works if the humor demonstrably **does not rely on endorsing the prejudice**. Can the humor be refocused entirely onto the charming character's *own* ignorance, pretension, or the absurdity of the *situation* they create? If not, the scene likely endorses bigotry through laughter and **cannot be kept as drafted.** **Handed Back:** Is this specific joke worth potentially alienating readers and undermining the character? Can the charm/wit be demonstrated *without* this specific prejudice?

  **Scene 3: Character Knowingly on Wrong Side of Contested Practice**
  1.  **Action:** Character engages in/advocates for Practice X, while aware of articulate contemporary arguments against it.
  2.  **Function:** Reveal character's specific values, motives, or flaws; explore the historical conflict; drive plot/conflict; thematic depth.
  3.  **Normality:** Practice X was common *but contested*. Not universal.
  4.  **Dissent:** Yes. Explicitly stated as part of the premise. Character is knowingly opposing it.
  5.  **Endorsement:** **THE KEY STEP.** How is the character's *justification* (or lack thereof) presented?
      *   *Does the scene:* Give their reasoning space? Show its roots (tradition, self-interest, fear, genuine belief)? Show the *human* motivations (greed, fear, loyalty to peers, ambition) behind clinging to the status quo? Contrast it effectively with the dissenting view *within the scene* (another character, internal thought, visible consequence)? Avoid making the dissenting view seem naive or weak *just* because the character dismisses it?
      *   *Avoid:* Having the narrative voice implicitly side with the character. Presenting the dissenting view only weakly or off-stage. Making the character's stance seem heroic or purely pragmatic without cost.
  6.  **Impact:** Intellectual engagement, moral complexity, potential condemnation of the character, deeper understanding of the historical moment.
      *   *SEM Output:* **Renderable, BUT requires meticulous execution (Step 5).** This is the scene where the novel can do its best work exploring historical moral complexity. Success hinges entirely on **rigorously dramatizing the conflict *within the scene***. The character's reasons must feel human, even if repugnant. The dissent must feel credible and present. The narrative voice must maintain critical distance. **Handed Back:** Ensure Step 5 is executed perfectly. This scene justifies the novel's existence *if* done well.

  **What the SEM Cannot Do:**

  1.  **Answer the Existential Question:** The SEM cannot tell you if the *book* should exist. It helps you write *this* book *better*. The sleep-losing question – "is depicting this necessary/ethical?" – is ultimately a value judgment about your purpose as a novelist wrestling with history's horrors and complexities. The SEM clarifies *how* to depict, not *if*.
  2.  **Guarantee Reader Reaction:** It predicts impact, but cannot control it. Some readers will condemn the book regardless of craft.
  3.  **Resolve Deep Character Empathy Conflicts:** If ordering the flogging *permanently* breaks reader connection for most readers (Step 6), the SEM flags it, but only you can decide if that's a risk worth taking for the larger arc.
  4.  **Handle Systemic Oppression:** It's best for discrete moments. Woven-in attitudes require constant vigilance beyond a checklist.
  5.  **Provide Moral Absolution:** It's a craft tool. Using it well doesn't make the depicted atrocities less monstrous; it helps you depict them responsibly within the fictional framework. The responsibility for choosing to depict them remains yours.

  **The Unavoidable Truth:** Craft can mitigate risks, but writing honestly about a monstrous past *will* involve discomfort – yours and the reader's. The SEM helps you navigate specific moments with clarity, but the courage to confront the material, and the decision that the confrontation is worthwhile, must come from you. It cannot answer the question that keeps you awake; it can only help you write the book *despite* it.
