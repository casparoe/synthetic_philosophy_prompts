  3. Separates the threshold vs. scalar question from the proxy vs. constitutive debate 
  4. Proposes analyzing philosophical arguments and empirical literature to find where ambiguity collapses distinctions 
  5. Sets success as either resolving the ambiguity or showing it's irresolvable (valuing clarity over a specific outcome) 

