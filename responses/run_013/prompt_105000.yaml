  ---

  ### **Tree Summary**
  - **Additive actions** bypass the curse (→ *act-if-EV-positive*).  
  - **Threshold actions** branch on:  
    - Coordination → *wait-and-coordinate*.  
    - Correlation → *conformity-style rule*.  
    - Reversibility → *probe-first*.  
    - Irreversible + no coordination/correlation → hinges on private info/symmetry:  
      - Symmetric knowledge → *never-act*.  
      - Private info + asymmetric curse → *defer-to-best-informed*.  
      - Private info + symmetric curse → *symmetric-curse rule*.  

  This tree forces explicit tradeoffs (e.g., "Irreversible action with private info but no coordination? Now face symmetry."). Use it to map disagreements—often, fights stem from differing answers to Q1 (additive vs. threshold) or Q6 (symmetry).
