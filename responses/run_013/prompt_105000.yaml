  ### **Decision Tree: Unilateralist's Curse**

  #### **Start**: Commitment to decide whether to take a unilateral action.  
  *(Assume: Multiple actors face the same decision independently.)*

  ---

  #### **Q1: Is the action's value additive (each unit helps) or threshold-based (only "enough" actions matter)?**
  - **Additive**:  
    → *Leaf: **Plain act-if-your-own-EV-is-positive***  
    *Rationale: No curse—each action adds value independently. Ignore others.*  
    *Shared path: All additive cases end here.*  
  - **Threshold-based** (e.g., tragedy of the commons, over-provision risk):  
    → Proceed to Q2.

  ---

  #### **Q2: Can you cheaply coordinate with others or observe their choices?**
  - **Yes** (e.g., quick chat, real-time dashboard):  
    → *Leaf: **Wait-and-coordinate***  
    *Rationale: Avoid unilateral moves—solve the curse via communication.*  
  - **No** (truly independent decisions):  
    → Proceed to Q3.

  ---

  #### **Q3: Are others' choices likely correlated with yours?**  
  *(e.g., shared info, group identity, or your action signals theirs)*  
  - **Yes** (correlation):  
    → *Leaf: **Conformity-style rule***  
    *Rationale: Condition on your choice as evidence. Only act if EV remains positive after modeling correlated behavior (e.g., "If I act, similar actors will too").*  
  - **No** (uncorrelated/independent actors):  
    → Proceed to Q4.

  ---

  #### **Q4: Is the action reversible?**  
  *(e.g., can you undo effects or test cheaply?)*  
  - **Yes**:  
    → *Leaf: **Probe-first***  
    *Rationale: Take a reversible/miniature version to gather data (e.g., small-scale test).*  
  - **No** (irreversible/high-stakes):  
