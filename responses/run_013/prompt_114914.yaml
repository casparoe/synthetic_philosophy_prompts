  Hmm, interesting how they frame causal claims as inherently contrastive - "X caused Y rather than Z". That's a sophisticated starting point. The user seems academically trained, probably in history or philosophy, given their command of both the historical details (blank cheque, Schlieffen timetable) and theoretical concepts (Hart & Honoré). Their frustration with conflated explanatory/attributive purposes feels very genuine.

  Let me unpack their four requests systematically. First, mapping contrast classes: Fischer's "deliberate bid" implies "rather than accidental slide", while sleepwalking suggests "rather than controlled escalation". The treaty clause's contrast is purely legalistic. The user's hunch about verbal disagreement seems spot-on - much debate orbits around implied contrasts rather than raw facts.

  For selection rules, the July Crisis presents a delicious tension. Voluntary action points to Berlin's blank cheque (human choice), while abnormality highlights the Schlieffen timetable (mechanical necessity). This bifurcation challenges Hart & Honoré's unified theory - exactly as the user suspected. Their insight about the timetable being both abnormal and involuntary is perceptive.

  On national agency, the user nails the core dilemma. Fischer's actual evidence describes distributed elite intentions, not monolithic state will. Yet his thesis requires corporate agency to sustain "Germany" as the culprit. That gap between evidence and attribution is philosophically significant.

  Finally, running it backwards: the 60-year stalemate does suggest blame-driven pragmatism in causal selection. The user's "unfalsifiable" concern is valid but addressable - we can still test if political alignment predicts interpretation. Their moral anomaly challenge is sharp too: consider the Schlieffen timetable - abnormal and consequential, yet morally inert as a mechanism.

  Throughout, I'll maintain their requested focus: agents, contrasts, rules. Where theory falls short (e.g., on distributed intentionality), I'll note limitations without forcing fit. Their aversion to citations is refreshing - this is about conceptual craftsmanship.
answer: |-
  Here's the dissection using your causal framework, focusing on agents, contrasts, and selection rules:

  **1. Contrast Classes & The Verbal Dispute:**
  *   **Fischer Thesis:** "Germany caused the war **rather than** it being an accidental escalation driven by shared blunders, alliance rigidity, or inevitable great power conflict." The contrast class emphasizes *deliberate agency* vs. *structural forces/accident*. It selects Germany as the *abnormal deviator* (actively seeking war) from the background of reactive powers.
  *   **Sleepwalking Thesis:** "The complex interaction of structures, misperceptions, and rigid timetables caused the war **rather than** any single power (like Germany) deliberately orchestrating it." The contrast class emphasizes *systemic failure* vs. *deliberate conspiracy*. It selects *structural factors/all actors* as the causes, rejecting the abnormal *voluntary action* of a single culprit.
  *   **Treaty Clause (Article 231):** "Germany and its allies caused the loss and damage **rather than** the Entente Powers being responsible." The contrast class is purely *legal-blaming*: "Who pays?" It selects the *losing side* (the abnormal *deviator* from peace) for *attributive* liability.
  *   **Factual vs. Verbal Dispute?** Significant chunks *are* verbal, rooted in divergent **contrast classes** and **purpose** (explanation vs. blame). Both sides agree on core facts (blank cheque, unacceptable ultimatum, mobilisations, Schlieffen Plan). The fight is over:
      *   *What the contrast class is:* Deliberate action vs. systemic failure?
      *   *What "cause" is doing:* Explaining the war's origin *or* assigning legal/moral liability?
      Fischer emphasizes German *intent* and *responsibility* (attributive), Sleepwalkers emphasize the *causal mechanism* (explanatory) of system breakdown. The treaty clause is *purely* attributive.

  **2. Selection Rules in the July Crisis (Convergence & Divergence):**
  *   **Abnormality Rule:** What deviated from the "normal" background?
      *   *Standing Background:* Alliances, nationalism, militarism, imperial rivalry.
      *   *Abnormal Deviations:* The *assassination* (trigger), Vienna/Berlin's *decision to exploit it* (blank cheque, designed ultimatum), the *Schlieffen Plan* (rigid mechanism demanding rapid escalation).
  *   **Voluntary Action Rule:** What key choices were made?
      *   *Key Voluntary Actions:* Austrian decision to crush Serbia, German decision to issue the "blank cheque," German decision to activate the Schlieffen Plan.
  *   **Convergence:** The **Blank Cheque** is selected by *both* rules. It was an *abnormal*, voluntary political *choice* (deviating from restraint) initiating the high-risk crisis escalation.
  *   **Divergence (The Crux):** The **Schlieffen Plan & Mobilisation Timetables**.
      *   *Abnormality Rule:* Selects it STRONGLY. It was the *most abnormal, rigid, and consequential mechanism* – the literal device turning a Balkan war into a continental/world war once Russian mobilisation occurred. It was the unique, deviant factor overriding diplomacy.
      *   *Voluntary Action Rule:* **Rejects** it as "the cause" in an *attributive* sense. Its activation was a near-automatic military *reaction* (driven by perceived necessity/timetable logic, not a fresh *voluntary* choice for world war in late July/early August). The *voluntary action* was its prior adoption and the decision structure enabling it.
  *   **Impact on Hart-Honoré:** This divergence exposes a weakness. Their model struggles when the most *abnormal* and *necessary* factor (Schlieffen) is also the *least voluntary* (mechanical reaction). It forces a choice: Does "cause" mean the most *explanatorily salient abnormal condition* (Schlieffen) or the most *blameworthy voluntary intervention* (Blank Cheque)? The Fischer-Sleepwalker debate hinges on this.

  **3. National Agency & Responsibility:**
  *   **Reading 1 (Sum of Individuals):** Responsibility rests solely on specific leaders (Bethmann Hollweg, Moltke, Kaiser, etc.) who made choices based on their perceptions, pressures, and goals. Fischer's evidence (elite groups, pressure groups, military) fits *this* reading. Germany "did it" because its *decision-makers* did specific things with specific (documented) intentions.
  *   **Reading 2 (Corporate Agent):** Germany *as a state* is a unitary actor with intentions distinct from any individual. It bears responsibility as a collective entity.
  *   **What Fischer Needs/Used:** Fischer *primarily* relies on **Reading 1**. His work meticulously documents the goals, pressures, and decisions of *specific elites and groups* within the German government/military (Pan-Germans, military planners, industrialists, diplomats). He argues *these individuals and groups collectively* drove the policy. He *implies* Reading 2 ("Germany") for rhetorical/attributive force, but his historical method is grounded in Reading 1. The Fischer thesis **needs** Reading 1 to be historically credible; it *leverages* the *implication* of Reading 2 for its moral/political impact.

  **4. Running Backwards: What the Episode Shows About the Theory:**
  *   **Pragmatic & Blame-Driven?** The 60-year stalemate strongly supports the **pragmatic, blame-driven view** of causal selection.
      *   *Prediction:* Positions *should* track contexts of blame/political need. Fischer emerged in 1960s West Germany, challenging national myths during denazification/vs. communism. Sleepwalking resurged post-Cold War, fitting a less blame-focused, systemic-risk era. The treaty clause was pure victors' justice. The theory predicts this link between context and preferred contrast class/selection.
      *   *Virtue or Unfalsifiability?* It's a **virtue** of the theory that it *explains* why purely factual disputes persist – because the *selection criteria* (contrast class, purpose) are contested and context-dependent. It doesn't make the history "untrue," but shows *why* certain interpretations gain traction.
  *   **Sloppy Historians?** While historical interpretation involves judgment, the persistence of *both* plausible narratives (Fischer's "bid" vs. Sleepwalking "system") based on *shared archives* suggests the core issue isn't sloppiness, but the **inherent complexity of applying causal concepts** (abnormality, voluntariness) to chaotic historical events with multiple necessary conditions.
  *   **The Anomaly (Selection vs. Moral Judgment):**
      *   **Selection Points, Morality Says No:** The **Schlieffen Plan** itself. Selected by the *abnormality rule* as hugely causally significant. Yet, morally, we don't *blame* the *plan* (an inert mechanism). We blame the people who conceived, adopted, or activated it without sufficient regard for consequences. The rule picks an object morality doesn't judge.
      *   **Morality Points, Selection Says No (Potentially):** Consider a **hypothetical minor official** who, through sheer cowardice or stupidity, delays a crucial peace message, *materially contributing* to the outbreak. Morality might blame *them*. But causal selection rules (abnormality, voluntariness) would likely *not* pick them out as "the cause" of WWI against the backdrop of great power decisions/structures. Their action, while blameworthy, isn't sufficiently *abnormal* in scale or *voluntary* in its intended consequence relative to the main drivers.

  **Conclusion:** The Fischer controversy is a masterclass in your causal framework. The core dispute is less about *facts* than about **contrast classes** (deliberate bid vs. system failure) and the **purpose** of cause-talk (explanation vs. attribution). The **selection rules** (abnormality vs. voluntary action) powerfully illuminate the debate, especially highlighting the **Schlieffen Plan anomaly** where they critically diverge. The debate's persistence confirms the **pragmatic, context-dependent nature** of causal selection, particularly for events laden with blame. While Fischer relies on the *distributed agency* of German elites (Reading 1), the *rhetorical power* of his thesis leans on the *implication* of national corporate responsibility (Reading 2).
