answer: |-
  Here's a practical procedure for your committee, designed to handle uncertainty using imprecise probabilities and minimize arbitrary number-guessing. It transforms vague estimates into honest ranges, clarifies when to seek more information, and separates objective analysis from value judgments.

  ---

  ### **Decision Procedure for Funding Proposals**
  **Time:** 15-20 minutes per proposal  
  **Goal:** Replace made-up probabilities with robust, range-based decisions.  
  **Key Principle:** Use *imprecise probabilities* (a range of odds you’d truly bet on) to acknowledge uncertainty.

  #### **Step 1: Frame the Decision (2 min)**  
  - **Options:** What are the choices? (e.g., "Fund Proposal" vs. "Reject").  
  - **Key Uncertainty:** Identify the *one critical unknown* (e.g., "Will the event break even?" or "Will the club survive until March?").  
  - **Outcomes:** Define payoffs for each option under success/failure. Focus on:  
    - **Monetary Impact:** Net cost/gain to the fund.  
    - **Non-Monetary Impact:** Student engagement, equity, or other values (assign qualitative scores: High/Medium/Low).  

  #### **Step 2: Elicit Imprecise Probabilities (5 min)**  
  - **Ask:** *"What’s the LOWEST odds you’d bet on this succeeding? What’s the HIGHEST odds you’d bet against it?"*  
    - **Convert made-up numbers (e.g., "70%") to a range:**  
      - If someone says "70%," ask: *"Would you still bet on it at 60%? 50%? Where do you get uncomfortable?"*  
      - Default range for a "70%" claim: **50–85%** (wide uncertainty). If confident, **65–75%** (narrow).  
    - **Committee Consensus:** Discuss and agree on a range `[L, U]` (e.g., L = lowest plausible, U = highest plausible).  

  #### **Step 3: Calculate Expected Value (EV) Ranges (3 min)**  
  For the **"Fund"** option:  
  - **EV(Success)** = Monetary Gain + Non-Monetary Benefit  
  - **EV(Failure)** = Monetary Loss + Non-Monetary Cost  
  - **Expected Value Range** = `[L × EV(Success) + (1-U) × EV(Failure) , U × EV(Success) + (1-L) × EV(Failure)]`  
    *(This captures the best/worst plausible outcomes.)*  

  **Compare to "Reject" (baseline EV = 0).**  

  #### **Step 4: Decide Based on EV Ranges (3 min)**  
  - **✅ Fund Robustly:** Entire EV range > 0.  
  - **❌ Reject Robustly:** Entire EV range < 0.  
  - **⚠️ Ambiguous:** EV range crosses 0 (e.g., [-$100, $200]). Then:  
    - **If worst-case isn’t catastrophic (and best-case is good):** Fund.  
    - **If worst-case is unacceptable:** Reject.  
    - **If ranges are huge (e.g., [-$300, $500]):** Defer to gather data.  

  #### **Step 5: Dominance & Toss-Ups (2 min)**  
  - **Dominance:** One option is better *no matter the probability*.  
    - e.g., If min(EV of "Fund") > 0 → "Fund" dominates "Reject".  
  - **Genuine Toss-Up:** Options are close (±10% of fund size) → **Values decide.**  
    - Use criteria like: Equity, school values, historical support.  

  #### **Step 6: Where the Procedure Stops**  
  - **Non-Monetary Values:** The committee must weigh equity, student growth, etc.  
  - **Probability Ranges:** Subjective, but now honest and debated.  
  - **Final Call:** Activities director breaks ties or overrides if values conflict.  

  ---

  ### **Example 1: Robotics Club Event**  
  **Proposal:** $500 for a showcase. Claims it will break even (sell 200 tickets).  
  - **Key Uncertainty:** Will they sell enough tickets?  
  - **Outcomes:**  
    - **Success (break even):** Fund gains $0, High engagement (EV = $0 + $400 = **$400**).  
    - **Failure:** Fund loses $500, Medium engagement (EV = -$500 + $150 = **-$350**).  
  - **Probability Range:** Committee agrees: 40–70% chance of success (pessimistic due to venue costs).  
  - **EV Range for Funding:**  
    - Worst EV = (0.4 × $400) + (0.3 × -$350) = $160 - $105 = **$55**  
      *(Uses L for success, 1-U for failure)*  
    - Best EV = (0.7 × $400) + (0.6 × -$350) = $280 - $210 = **$70**  
    - **EV Range = [$55, $70]** → Entirely above $0.  
  - **Decision:** ✅ **Fund Robustly** (always positive EV).  

  ---

  ### **Example 2: New Film Club**  
  **Proposal:** $300 for equipment. Uncertain if active by March.  
  **You’re rooting for this but want objectivity.**  
  - **Key Uncertainty:** Will the club survive until March?  
  - **Outcomes:**  
    - **Success (active):** Fund loses $300, High engagement (EV = -$300 + $350 = **$50**).  
    - **Failure (inactive):** Fund loses $300, Low engagement (EV = -$300 + $50 = **-$250**).  
  - **Probability Range:** Committee agrees: 20–50% chance of survival (new clubs often fail).  
  - **EV Range for Funding:**  
    - Worst EV = (0.2 × $50) + (0.5 × -$250) = $10 - $125 = **-$115**  
    - Best EV = (0.5 × $50) + (0.8 × -$250) = $25 - $200 = **-$175**  
    - **EV Range = [-$175, -$115]** → Entirely below $0.  
  - **Decision:** ❌ **Reject Robustly** (always negative EV).  
    - *Even if you love film, the numbers are too risky. Procedure says no.*  

  ---

  ### **Key Takeaways**  
  1. **Made-up probabilities become honest ranges** through betting-odds framing.  
  2. **Ambiguity triggers data-gathering** (e.g., ask clubs for attendance plans, member commitments).  
  3. **Wide ranges expose low-stakes decisions** → Choose options with acceptable worst-cases.  
  4. **Values dominate close calls** (e.g., "This club serves underrepresented students").  
  5. **The procedure doesn’t decide values**—it forces clarity on uncertainty and tradeoffs.  

  This method reduces arguing over fake numbers, focuses on robust outcomes, and leaves space for your committee’s values when probabilities are fuzzy. Use the ranges to depersonalize debates ("Given our agreed odds, what’s the wise move?") and pivot to values when EV is close.
