prompt: |-
  Hey, so I'm a senior in high school and I'm the student rep on the committee that hands out money from the student activity fund to clubs. It's small money, like a few hundred bucks at a time, but we meet every other week and we always end up arguing about stuff nobody actually knows — will the robotics club's showcase sell enough tickets to cover the venue, will the new film club still exist in March, that kind of thing. We get maybe twenty minutes per proposal and the activities director has the final say, but she usually just goes with whatever we vote for. People keep saying things like 'I'd say there's a 70% chance' when they definately made the number up, and then we vote on the fake number.

  I read a bit about imprecise probabilities, where instead of one number you're supposed to give the range you'd actually be willing to bet at, and it made me think our whole process is backwards. Can you write me a procedure I can actually run in a meeting? The questions to ask in order, how to turn somebody's made-up 70% into an honest range, when the ranges are so far apart that we should go get more info instead of voting, and what to do when the ranges are so wide that the decision barely depends on the probability at all — I think that's when you pick whatever isn't terrible in the worst case? Also how to tell when one option is better no matter what the real number is, versus when it's a genuine toss-up.

  Then run it on two made-up proposals: a club asking for money for an event they swear will break even, and a brand new club that might fall apart by spring. I'm rooting for the film club one, so honestly it'd be useful to see the procedure tell me no. And tell me where the procedure stops helping and it's just us deciding what we care about, because I don't want to act like a checklist is making a values call for us.
reasoning: |-
  We are going to design a procedure for making decisions under uncertainty using imprecise probabilities. The goal is to replace made-up point probabilities with honest ranges and then use these ranges to make robust decisions.

   The procedure steps:

   1. Define the decision problem:
      - What are the options? (e.g., fund the proposal or not)
      - What is the key uncertainty? (e.g., will the event break even? will the club still exist in March?)

   2. For each option, define the outcomes in terms of costs and benefits, and identify the critical uncertainties.

   3. For each uncertainty, ask the committee members to provide a betting range (lower and upper probability) that they are comfortable with. This reflects their imprecise belief.

      How to elicit a range from a made-up 70%:
        - We can ask: "At what odds would you be willing to bet FOR the event breaking even? For example, if you think there's at least a 60% chance, you would accept a bet that pays you $1 if it breaks even and you lose $1.5 if it doesn't (because 1.5:1 odds against corresponds to 40% chance for the negative, so 60% for the positive). Similarly, at what upper odds would you be willing to bet AGAINST it? That is, when would you be willing to take the other side? This gives the upper bound of the probability range."

      Alternatively, we can use a simpler method:
        - Ask: "What is the lowest probability you would assign to this event such that you would still be willing to bet on it at even odds (i.e., if you lose, you lose the stake, if you win, you get the stake back plus the same amount in winnings)?" That gives the lower bound.
        - Then ask: "What is the highest probability you would assign such that you would be willing to bet against it at even odds?" That gives the upper bound.

      But note: if someone says "70%", we might convert that to a range by adding and subtracting a margin. However, the margin should reflect the person's uncertainty. We can use a rule of thumb: if they are very confident, the range might be narrow (e.g., 65%-75%), if not, wider (e.g., 50%-90%). However, we want an honest range. So we might ask them to consider:

          Lower bound: "If I had to bet on it, I wouldn't accept worse than ... because I'm not that sure."
          Upper bound: "If I had to bet against it, I wouldn't accept worse than ... because I'm not that sure."

      We can use a simple conversion for a point estimate p: set the lower bound to max(0, p - 0.2) and the upper bound to min(1, p + 0.2) as a default if we can't get a better range? But ideally, we want them to think about it.

      However, in a committee setting, we might not have time for each member to give a range for every uncertainty. Instead, we can have one discussion per proposal and then the committee as a whole agrees on a range? Or we can have each member write down a range and then we take the union? But that might be messy.

      Proposed: For each critical uncertainty, have the committee discuss and then the activities director (or a facilitator) proposes a range that captures the committee's uncertainty. Then the committee approves that range by consensus or majority.

   4. Calculate the expected value (or expected utility) for each option over the entire range of probabilities. We will use an interval of expected values.

      However, note: we might have multiple uncertainties, but for simplicity, let's assume one key uncertainty per proposal.

      Example: For the robotics club event, the uncertainty is whether the event breaks even (probability p of breaking even, 1-p of not). 

          Option 1: Fund the event with amount X.
            - If it breaks even, the club gets the money back (or we break even) and we get some benefit (e.g., student engagement) worth B.
            - If it doesn't break even, we lose X and also get a smaller benefit b (because the event still happened but at a loss).

          Option 2: Don't fund.

          Then the expected value of funding is: 
            p * (B) + (1-p) * (b - X)
          But note: we are funding X, so the net of funding is:
            p * (B) + (1-p) * (b) - X   [because we pay X regardless? Or only if they don't break even? Actually, we pay X upfront, and they return it if they break even? Let's clarify.]

          Let's re-express:

            We give the club $X. If the event breaks even, the club returns $X to the fund. So the net cost to the fund is 0 in that case, and we get benefit B.

            If it doesn't break even, the club cannot return the money, so the fund loses $X, and we get a smaller benefit b.

          Therefore, the net outcome for the fund is:
            - In success: 0 (money is returned) + B
            - In failure: -X + b

          So the expected net benefit is: p * B + (1-p) * (b - X)

          We can write this as: p*B + (1-p)*b - (1-p)*X

   5. Instead of a point p, we have an interval [L, U]. Then the expected net benefit becomes an interval:

          Lower bound of expected net benefit: min over p in [L, U] of [ p*B + (1-p)*b - (1-p)*X ]
          Upper bound: max over p in [L, U] of the same.

      But note: the expression is linear in p, so we only need to evaluate at the endpoints.

          Let f(p) = p*B + (1-p)*b - (1-p)*X
                  = p*B + (1-p)(b - X)
                  = p*B + (b - X) - p*(b - X)
                  = p*(B - (b - X)) + (b - X)

          So it's linear in p. Therefore:

            Lower bound: min( f(L), f(U) )
            Upper bound: max( f(L), f(U) )

   6. Compare the options:

      We have two options: fund and not fund.

          Not fund: we assume 0 net benefit (or whatever baseline).

      We can then see:

          - If the lower bound of the expected net benefit for funding is above 0, then funding is robustly good (no matter what p in [L,U], funding is better).
          - If the upper bound is below 0, then funding is robustly bad.
          - If the interval of expected net benefit includes 0, then the decision depends on p and we are uncertain.

      In the case of uncertainty, we might:

          - Collect more information to narrow the interval [L, U].
          - Make a decision based on a conservative criterion (e.g., maximize the worst-case outcome: if the worst-case of funding is better than not funding, then fund; but note the worst-case might be negative and worse than 0).

          However, note that we are using expected net benefit. We might also consider the worst-case scenario (which is the lower bound of expected net benefit) and compare it to the worst-case of the other option.

          In this case, the worst-case for funding is min(f(L), f(U)) and for not funding is 0. So:

            If min(f(L), f(U)) >= 0, then even in the worst-case we are at least breaking even in expectation -> fund.

            If max(f(L), f(U)) < 0, then don't fund.

            If min(f(L), f(U)) < 0 and max(f(L), f(U)) >= 0, then we are in an ambiguous zone.

      In the ambiguous zone, we can use additional criteria:

          - If the potential upside (max(f(L), f(U))) is high and the downside (min(f(L), f(U))) is not too bad, we might fund.
          - Or we might decide based on other factors (like alignment with school values, equity among clubs, etc.).

      Alternatively, we might use a decision rule that minimizes regret, but that might be too complex.

   7. When the range of probabilities is so wide that the expected value interval is too broad to make a clear call, we might:

          a) Decide to gather more information (if time and resources allow) to narrow the range.
          b) Use a conservative rule: only fund if the worst-case expected value is acceptable (e.g., above a threshold, say 0) or if the worst-case is not catastrophic and the best-case is very good.

          But note: we are dealing with student activities, so the stakes are not extremely high. We might also consider that funding a club that might fail is part of encouraging initiative.

   8. Dominance: We can check for stochastic dominance. However, in our linear case, we can see:

          Option A (fund) dominates Option B (not fund) if for every p in [L,U], f(p) >= 0.

          But note: our interval might not cover the entire [0,1] and we are only considering [L,U]. So we require that the minimum of f(p) over [L,U] is >=0.

   9. When the decision doesn't depend on the probability (or the range of probabilities) because one option is always better or worse, then we don't need to worry about the uncertainty.

   10. When the decision is a genuine toss-up (i.e., the interval of expected net benefit for funding overlaps with that of not funding, and both include the break-even point), then we must make a value judgment. That's where the committee's values come in.

   Implementation in the meeting:

     We have limited time (20 minutes per proposal). So we must be efficient.

     Steps for one proposal:

       Step 1: Present the proposal.
       Step 2: Identify the key uncertainty (or uncertainties). If more than one, we might need to simplify or focus on the main one.
       Step 3: For the key uncertainty, define the outcomes and the net benefit function (as above).
       Step 4: Elicit the probability range [L, U] for the key event (like break-even, or club survival). This should be done by committee discussion and then quick consensus on a range. We might ask:

            "What's the lowest probability of success that we think is plausible? And the highest?"

       Step 5: Calculate the expected net benefit interval for the funding option.

       Step 6: Compare to the alternative (not funding, which is 0).

          - If the entire interval is above 0: fund.
          - If the entire interval is below 0: reject.
          - Otherwise, we are in the ambiguous zone.

       Step 7: In the ambiguous zone, we might:

            Option A: If we have time and it's a close call, we might table the proposal to get more information (if possible).
            Option B: If we must decide, then we consider:

               a) The worst-case scenario: if the worst-case expected loss is acceptable (e.g., we can afford to lose that amount and the non-monetary benefits are worth the risk), then fund.
               b) The best-case scenario: if the best-case is very beneficial, we might take the risk.

            But note: we are a committee representing the student body. We might also consider:

               - Equity: has this club been funded before? Is it a new club that needs a chance?
               - Strategic value: does this event align with school goals?
