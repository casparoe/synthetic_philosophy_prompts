prompt: |-
  I am setting the final examination for a one-semester, upper-level undergraduate seminar on Kant's moral philosophy. My students have worked through the derivation of the categorical imperative in the Groundwork, the distinction between a contradiction in conception and a contradiction in the will, the corresponding division between perfect and imperfect duties, and the standing objections that the universalizability procedure is empty, that its verdicts depend on how the maxim is described, and that it covertly imports empirical assumptions about human needs. The examination is closed-book, students may not cite or quote the text, and the question must therefore be answerable from their grasp of the machinery alone.

  I want a single essay question, worth 30 marks and answerable in about 60 minutes at roughly 700 words, together with a model answer and a marking scheme. The question must be unanswerable by reciting the formulations of the categorical imperative or by summarising the four examples from the second section of the Groundwork (the suicide maxim, the lying promise, the neglected talents, the refusal to help). To force candidates into the argument rather than the labels, build the question around the following stipulated test, which is not a standard piece of terminology and which I will print on the paper exactly as set out here:

  The Universal Extinction Test (UET). Let a maxim be a general principle of action specifying a type of action and the end for which the agent performs it. A maxim fails the UET if and only if, in the world in which every agent acts on that maxim, no agent ever successfully performs the action type the maxim prescribes, where success means attaining the specified end by the specified means. Otherwise the maxim passes.

  The question should require the candidate to do each of the following, and the marking scheme should be organised around these tasks:

  1. State precisely what the UET asks and identify, unprompted, which element of Kant's own procedure it reconstructs and which it discards.
  2. Apply it to the four examples named above, saying for each whether the UET agrees with Kant's verdict and, where it does not, exactly why.
  3. Diagnose the pattern in those agreements and disagreements, and say what that pattern shows about whether the contradiction-in-conception test and the contradiction-in-the-will test can be run by a single procedure. The candidate must then assess whether the UET's shortfall, if there is one, is a defect in the test or instead evidence that Kant's second test rests on an assumption the first test does not need.
  4. Construct one maxim of the candidate's own devising, not among the four examples, on which the UET returns a verdict that is implausibly permissive or implausibly restrictive, and use it to press the difficulty that a maxim may be redrawn at a different level of generality so as to reverse the verdict. The candidate should say how a defender of the UET ought to reply and whether the reply succeeds.
  5. Reach a verdict on whether the UET is a defensible reconstruction of the universalizability test, and name the single consideration that would most change their mind.

  Deliverables and constraints:

  - The question as it would appear on the examination paper, carrying its instructions (closed-book, 60 minutes, 30 marks, approximate length) and phrased so that a candidate who has memorised the formulations without understanding the argument cannot score well. The question itself must pose the tasks without disclosing the analysis.
  - A model answer of roughly 650 to 750 words, self-contained, written as a strong candidate would write it, containing no page references and no quotations. It must discharge all five tasks and commit to a verdict rather than surveying the options. In task 2 it should show rather than assert why the lying-promise and suicide maxims come out as they do under the UET, and it should register rather than silently assume that the customary classification of the suicide example is contested. In task 3 it should make plain which cases the UET lets through, and what the will test would have to assume in order to catch them.
  - A marking scheme totalling 30 marks, allocating marks to the individual moves: restatement of the UET and of what it discards; correct verdicts and reasoning on the four examples; the diagnosis in task 3; the constructed maxim together with the generality objection and the reply; the verdict and the change-my-mind condition. For each must-hit point, add one line naming the specific error that costs marks there, and state explicitly what separates an A answer from a B answer, naming the two or three moves that a B answer will characteristically lack. Do not reward name-dropping of commentators or references to secondary literature; the marking scheme must be answerable by a student who has read nothing but the primary text and the lecture material.
reasoning: |-
  We are designing an exam question and model answer for an upper-level undergraduate seminar on Kant's moral philosophy. The focus is on the Universal Extinction Test (UET) as a reconstruction of Kant's universalizability procedure.

  The question must be unanswerable by mere recitation of the categorical imperative formulations or by summarizing Kant's four examples. Instead, it forces engagement with the argument by using the UET.

  The UET is defined as: 
    A maxim fails the UET if and only if, in the world in which every agent acts on that maxim, no agent ever successfully performs the action type the maxim prescribes (where success means attaining the specified end by the specified means). Otherwise, it passes.

  The question should require the candidate to:
  1. State what the UET asks and identify which element of Kant's procedure it reconstructs and which it discards.
  2. Apply the UET to Kant's four examples (suicide, lying promise, neglected talents, refusal to help) and note whether the UET agrees with Kant's verdict, and if not, why.
  3. Diagnose the pattern in agreements and disagreements, and say what that shows about whether the two tests (contradiction in conception and contradiction in the will) can be run by a single procedure. Then assess whether the UET's shortfall is a defect or evidence that Kant's second test rests on an additional assumption.
  4. Construct one new maxim (not from the four examples) on which the UET gives an implausible verdict (too permissive or too restrictive) and use it to raise the generality problem (redrawing the maxim at a different level of generality reverses the verdict). Then say how a defender of the UET might reply and whether that reply succeeds.
  5. Reach a verdict on whether the UET is a defensible reconstruction and name the single consideration that would most change their mind.

  Deliverables:
  - The exam question as it would appear.
  - A model answer (650-750 words) that addresses all five tasks.
  - A marking scheme (30 marks total) with allocations for each task and explicit criteria for A vs B answers.

  Let's design the question first.

  **Exam Question:**

  **PHIL 450: Kant's Moral Philosophy - Final Examination**

  **Instructions:** This is a closed-book examination. You may not cite or quote from any text. Write your answer in the booklet provided. Spend approximately 60 minutes on this question. Aim for about 700 words. The question is worth 30 marks.

  **Question:**

  Consider the following test:

  *The Universal Extinction Test (UET).* Let a maxim be a general principle of action specifying a type of action and the end for which the agent performs it. A maxim fails the UET if and only if, in the world in which every agent acts on that maxim, no agent ever successfully performs the action type the maxim prescribes, where success means attaining the specified end by the specified means. Otherwise the maxim passes.

  1. State clearly what the UET asks and explain which element of Kant’s universalizability procedure it reconstructs and which it discards.  
  2. Apply the UET to the following four maxims:  
     (a) The suicide maxim: "From self-love, I make it my principle to shorten my life when its continuance threatens more evil than it promises pleasure."  
     (b) The lying-promise maxim: "When I believe myself to be in need of money, I will borrow money and promise to repay it, even though I know that I cannot do so."  
     (c) The neglected-talents maxim: "I let my talents rust and devote my life merely to idleness, pleasure, and propagation."  
     (d) The refusal-to-help maxim: "I will not take anything away from my own well-being in order to help others."  
     For each, state whether the UET passes or fails the maxim, and whether this verdict agrees with Kant’s. If it disagrees, explain exactly why.  
  3. Identify the pattern in the UET’s verdicts on these examples. What does this pattern show about whether Kant’s two tests (contradiction in conception and contradiction in the will) can be run by a single procedure? Then, assess whether the UET’s shortfall (if any) is a defect in the test or evidence that Kant’s second test rests on an assumption the first does not need.  
  4. Invent one maxim (not among the four above) on which the UET returns an implausible verdict (either permissive when it should be restrictive, or vice versa). Show how redrawing the maxim at a different level of generality can reverse the UET’s verdict. How might a defender of the UET reply to this problem? Does the reply succeed?  
  5. Conclude by stating whether the UET is a defensible reconstruction of Kant’s universalizability test. Name the single consideration that would most change your mind about this verdict.

  ---

  **Model Answer (approx. 700 words):**

  The Universal Extinction Test (UET) asks whether a maxim, when universalized, leads to a world in which the action prescribed by the maxim can never be successfully performed. Success is defined as attaining the specified end by the specified means. The UET reconstructs the core of Kant's contradiction in conception test, which asks whether the maxim can be conceived as a universal law without contradiction. However, it discards the contradiction in the will test, which considers whether a rational being could will the maxim to be universal law without contradicting its own will, particularly in light of necessary ends.

  Applying the UET to Kant’s four examples:

  (a) The suicide maxim: This maxim prescribes shortening one’s life out of self-love to avoid suffering. If universalized, everyone would kill themselves when life becomes painful. However, self-love, which aims at the promotion of life, would be extinguished because there would be no agents left to act on self-love. Thus, in the universalization world, the action (shortening life to avoid suffering) cannot be successfully performed because self-love would cease to exist. The UET fails the maxim. This agrees with Kant, who classified suicide as a perfect duty violation (contradiction in conception).

  (b) The lying-promise maxim: The maxim is to make a lying promise to get money. If everyone acted on this maxim, then the institution of promising would collapse because no one would believe promises. Consequently, when an agent tries to make a lying promise, they would fail because no one would accept the promise. The UET fails the maxim. This agrees with Kant, who also found a contradiction in conception.

  (c) The neglected-talents maxim: The maxim is to neglect one’s talents for a life of pleasure. If universalized, everyone neglects their talents. However, even in such a world, an agent could still successfully neglect their talents and achieve the end of idleness and pleasure. The UET passes the maxim because the action remains performable and the end attainable. But Kant classified this as an imperfect duty violation (contradiction in the will). Thus, the UET disagrees with Kant. The disagreement arises because the UET only captures contradictions in conception, not the will.

  (d) The refusal-to-help maxim: The maxim is never to help others. If universalized, no one helps anyone else. An agent acting on this maxim can still successfully refuse to help and thereby preserve their own well-being. The UET passes the maxim. But Kant found a contradiction in the will because a rational being could not will such a world without conflicting with the necessary end of sometimes needing help. Hence, the UET disagrees with Kant.

  The pattern is clear: the UET captures the two perfect duty violations (suicide and lying promise) but fails to capture the two imperfect duty violations (neglected talents and refusal to help). This shows that the contradiction in conception test (which the UET reconstructs) cannot by itself run the contradiction in the will test. The UET's shortfall in cases (c) and (d) is not a defect of the test per se, but evidence that Kant's second test rests on an additional assumption: that rational agents necessarily have certain ends (like developing talents and receiving help) which they cannot rationally will to be universally thwarted. The UET does not incorporate this assumption.

  To illustrate a problem with the UET, consider a maxim of competitive sportsmanship: "To win a tennis match, I will hit the ball within the boundaries to earn points." If universalized, every tennis player hits every shot within the boundaries. But then, winning becomes impossible because every point is contested and the match continues indefinitely. Thus, the UET fails the maxim, deeming it impermissible. But this is implausibly restrictive because hitting the ball in bounds is essential to tennis. The problem arises because the maxim can be redrawn at a different level of generality. If we formulate the maxim as: "To enjoy a competitive game, I will play tennis by the rules," then universalization does not lead to extinction: the game remains playable and enjoyable. The verdict reverses. A defender of the UET might reply that the test requires maxims to be formulated at the level of the agent's intended means and end, and the first maxim is flawed because it misstates the true end (winning vs. playing). However, this reply is problematic because agents can describe their actions at various levels, and the UET offers no principled way to fix the description.

  In conclusion, the UET is a defensible reconstruction of the contradiction in conception test for perfect duties, but it fails to capture the contradiction in the will test for imperfect duties. Therefore, it is only partially defensible. The single consideration that would most change my mind is if it could be shown that the contradiction in the will test can be reformulated without invoking necessary ends of rational beings, and instead be captured by a purely logical or practical contradiction under universalization, thereby making the UET extendable to imperfect duties.

  ---

  **Marking Scheme (Total: 30 marks):**

  **Task 1: State UET and identify what it reconstructs/discards (4 marks)**
  - 2 marks: Clear statement of the UET (must include: universalization leads to no successful performance of the action with its end and means).
  - 2 marks: Correct identification that it reconstructs the contradiction in conception test and discards the contradiction in the will test.
  - *Common error:* Misstating the UET (e.g., omitting the end or means) or misattributing the reconstructed element (e.g., saying it covers both tests).

  **Task 2: Apply UET to the four examples (10 marks; 2.5 per example)**
  - For each example:
    - 1 mark: Correct UET verdict (pass/fail) and agreement/disagreement with Kant.
    - 1.5 marks: Correct reasoning for the UET verdict and explanation of disagreement (if any). Must show the reasoning (e.g., for lying promise: universal lying destroys promising, so action fails; for refusal to help: universal refusal does not prevent an agent from refusing and preserving their well-being).
  - Special note for suicide: Must register that Kant classified it as a perfect duty violation (contradiction in conception) but note that some dispute this because Kant's argument might be seen as relying on the purpose of self-love. The model answer handles it by the extinction of self-love.
  - *Common error:* Incorrect UET verdict (e.g., saying neglected talents fails UET) or incorrect agreement with Kant (e.g., saying UET agrees on refusal to help).

  **Task 3: Diagnose pattern and assess shortfall (6 marks)**
  - 2 marks: Correctly identifying the pattern (UET captures the perfect duties: suicide and lying promise; fails the imperfect duties: talents and help).
  - 2 marks: Correct conclusion that the UET cannot run both tests (contradiction in conception and will) by a single procedure because the will test requires an additional element.
  - 2 marks: Assessment that the shortfall is evidence that Kant's second test rests on an assumption (about necessary ends) that the first does not need, rather than a defect in the UET.
  - *Common error:* Failing to see the pattern (e.g., not distinguishing perfect and imperfect duties) or misattributing the shortfall (e.g., calling it a defect without reference to the will test's assumptions).

  **Task 4: Construct a maxim and raise generality problem (6 marks)**
  - 2 marks: Constructing a new, plausible maxim (not from the four) on which the UET gives an implausible verdict (either too permissive or too restrictive). The maxim must be clearly stated with action and end.
  - 2 marks: Showing how redrawing the maxim at a different level of generality reverses the UET verdict (e.g., from fail to pass or vice versa).
  - 2 marks: Offering a plausible reply from a UET defender (e.g., that maxims must be formulated at the right level of specificity, reflecting the agent's true intention) and evaluating whether it succeeds (e.g., noting the difficulty in fixing the description without independent moral input).
  - *Common error:* Using one of the four examples, or failing to show the reversal under redescription, or giving an unconvincing reply.

  **Task 5: Verdict and change-my-mind condition (4 marks)**
  - 2 marks: Clear verdict on the UET (e.g., partially defensible for perfect duties, not for imperfect duties).
  - 2 marks: Naming a specific, relevant consideration that would change their mind (e.g., if the will test could be reduced to a similar extinction test without invoking necessary ends).
  - *Common error:* Vague or irrelevant change-my-mind condition.

  **Distinguishing A from B answers:**
  - An A answer (top mark range) must:
    - Correctly identify that the UET discards the will test and why (Task 1).
    - Accurately reason through all four examples, especially noting the disagreement on imperfect duties (Task 2).
    - Clearly articulate the pattern and the role of necessary ends in the will test (Task 3).
    - Provide a compelling, self-constructed maxim and effectively raise the generality problem (Task 4).
    - Offer a balanced verdict and a pertinent change-my-mind condition (Task 5).
  - A B answer (good but not top) typically lacks:
    - The precise diagnosis of the pattern (especially the link to perfect/imperfect duties) in Task 3.
    - A well-constructed maxim and/or a clear demonstration of the generality problem reversal in Task 4.
    - The insight about the necessary ends in Task 3 or the change-my-mind condition in Task 5.

  **Note:** No marks for secondary literature or quotations. Focus on the student's own reasoning and understanding of Kant's machinery.
answer: |-
  ### Examination Question  
  **PHIL 450: Kant’s Moral Philosophy – Final Examination**  
  **Instructions:** This is a closed-book examination. You may not cite or quote from any text. Write your answer in the booklet provided. Spend approximately 60 minutes on this question. Aim for about 700 words. The question is worth 30 marks.  

  **Question:**  
  The *Universal Extinction Test (UET)* is defined as follows: A maxim (a general principle specifying a type of action and the end for which it is performed) fails the UET if and only if, in a world where every agent acts on that maxim, no agent ever successfully performs the action (where "success" means attaining the specified end by the specified means). Otherwise, the maxim passes.  

  1. State precisely what the UET examines and explain which element of Kant’s universalizability procedure it reconstructs and which it discards.  
  2. Apply the UET to the following four maxims:  
     (a) Suicide maxim: "From self-love, I shorten my life to avoid suffering."  
     (b) Lying-promise maxim: "I borrow money by a false promise to repay when in need."  
     (c) Neglected-talents maxim: "I neglect my talents to pursue idleness and pleasure."  
     (d) Refusal-to-help maxim: "I never sacrifice my well-being to help others."  
     For each, state the UET’s verdict (pass/fail), whether it agrees with Kant’s verdict, and if not, explain why.  
  3. Identify the pattern in the UET’s verdicts. What does this show about whether Kant’s two tests (contradiction in conception vs. contradiction in the will) can be unified? Assess whether the UET’s shortfall (if any) is a defect or evidence that Kant’s second test relies on an additional assumption.  
  4. Invent one new maxim (not among the four above) on which the UET yields an implausible verdict (e.g., forbidding a benign action or permitting a harmful one). Show how redrawing this maxim at a different level of generality reverses the UET’s outcome. Explain how a UET defender might reply, and whether this reply succeeds.  
  5. Conclude: Is the UET a defensible reconstruction of Kant’s test? Name the single consideration that would most change your mind.  

  ---

  ### Model Answer (approx. 700 words)  
  The Universal Extinction Test (UET) examines whether a maxim, when universalized, creates a world where the action it prescribes becomes impossible to perform successfully—meaning no agent achieves the end by the means specified. It reconstructs Kant’s *contradiction in conception test*, which asks if universalizing a maxim leads to a logical or practical contradiction that undermines the action itself. However, it discards Kant’s *contradiction in the will test*, which considers whether a rational agent could consistently *will* the universalized maxim without undermining necessary ends of reason (e.g., personal development or mutual aid).  

  Applying the UET to Kant’s examples:  
  (a) *Suicide maxim*: Universalizing this would mean everyone ends their life to avoid suffering. But self-love—the end of preserving well-being—requires agents to exist. In this world, self-love becomes impossible (no agents remain), so the action cannot succeed. UET fails it. This agrees with Kant’s verdict (perfect duty violation), though some dispute whether Kant’s argument relies purely on contradiction in conception.  
  (b) *Lying-promise maxim*: If everyone makes false promises to get money, trust in promises vanishes. When agents try to use a false promise, no one believes them, so they fail to get money. UET fails it, matching Kant’s contradiction-in-conception verdict.  
  (c) *Neglected-talents maxim*: Universal neglect of talents would still allow agents to idle and enjoy pleasure (e.g., lounging). The action remains successful: agents attain idleness. UET passes it. But Kant deems this a violation (imperfect duty), as it contradicts what we must will for rational self-development. UET disagrees.  
  (d) *Refusal-to-help maxim*: Universal refusal means no one helps, but agents can still refuse and preserve their well-being (e.g., hoarding resources). Success is possible. UET passes it, yet Kant finds a contradiction in will: we cannot rationally will a world where help is impossible when needed. UET disagrees.  

  The pattern is clear: UET fails maxims (a) and (b) (Kant’s perfect duties) but passes (c) and (d) (Kant’s imperfect duties). This shows the UET replicates the *contradiction in conception* test (focused on action feasibility) but cannot run the *contradiction in will* test, which addresses rational willing. The shortfall is not a UET defect but evidence that Kant’s second test rests on an additional assumption: rational agents have necessary ends (e.g., talent development or receiving aid) that they cannot will to undermine universally. The UET ignores these ends, so it cannot generate imperfect duties.  

  Consider a new maxim: "To win a chess match, I will capture my opponent’s king." If universalized, everyone always plays perfectly to win, so no one ever loses (stalemates ensue). Winning becomes impossible—UET fails it. But this is implausibly restrictive; competitive chess requires winning attempts. Redrawing the maxim to "To enjoy chess, I will play by the rules" passes UET: universal play preserves enjoyment. This exposes the *generality problem*: verdicts depend on how narrowly we describe the action. A UET defender might reply that maxims must reflect the agent’s true intention (e.g., "winning" vs. "playing"), so we should fix descriptions at the level of the intended means and end. But this reply fails because intentions are subjective; without independent criteria, agents can gerrymander maxims to manipulate outcomes (e.g., recast "winning" as "playing" to evade restriction).  

  The UET is a defensible reconstruction of Kant’s contradiction-in-conception test for *perfect duties* but fails for imperfect duties. It is only partially defensible. The single consideration that would change my mind is if it could be shown that necessary ends (like talent development) are not inherent to rational agency but are contingent—then the UET’s exclusion of the will test might be justified.  

  ---

  ### Marking Scheme (Total: 30 marks)  
  **Task 1: UET’s purpose and relation to Kant (4 marks)**  
  - 2 marks: Clear statement that UET tests if universalization makes the action *impossible to perform successfully* (end unattainable via means).  
  - 2 marks: Identifies UET reconstructs *contradiction in conception* and discards *contradiction in the will*.  
  - *Error costing marks:* Misdefining success (e.g., omitting "end" or "means") or misattributing the discarded element (e.g., saying UET includes the will test).  

  **Task 2: Verdicts on four examples (10 marks; 2.5 per example)**  
  - For each:  
    - 1 mark: Correct UET verdict (pass/fail) and agreement/disagreement with Kant.  
    - 1.5 marks: Accurate reasoning showing *why* UET passes/fails and cause of disagreement if any (e.g., for (c)/(d): action remains feasible without necessary ends).  
  - *Suicide note:* Must note Kant’s verdict but acknowledge disputed classification (e.g., whether it relies on self-love’s purpose).  
  - *Error costing marks:* Incorrect UET outcome (e.g., saying (d) fails) or misstating Kant’s verdict (e.g., claiming Kant permits suicide).  

  **Task 3: Pattern diagnosis and assessment (6 marks)**  
  - 2 marks: Pattern: UET fails perfect duties ((a)/(b)) but passes imperfect duties ((c)/(d)).  
  - 2 marks: Conclusion: UET cannot unify both tests because will test requires *necessary ends of reason*.  
  - 2 marks: Assessment: Shortfall is *evidence* of Kant’s additional assumption (not a UET defect).  
  - *Error costing marks:* Failing to link pattern to perfect/imperfect duties or misdiagnosing shortfall as a flaw in UET.  

  **Task 4: Constructed maxim and reply (6 marks)**  
  - 2 marks: New maxim with implausible UET verdict (e.g., forbids benign competition or permits harm).  
  - 2 marks: Shows generality problem: redescription reverses verdict (e.g., "winning" vs. "playing").  
  - 2 marks: Plausible UET reply (e.g., "fix descriptions to true intentions") and critique (e.g., "reply fails due to subjectivity").  
  - *Error costing marks:* Unoriginal maxim (e.g., recycling Kant’s examples) or no demonstration of reversal.  

  **Task 5: Verdict and change-my-mind (4 marks)**  
  - 2 marks: Reasoned verdict (e.g., "defensible only for perfect duties").  
  - 2 marks: Specific change-my-mind condition (e.g., "if necessary ends are contingent").  
  - *Error costing marks:* Vague verdict (e.g., "it depends") or irrelevant condition (e.g., "if Kant was wrong").  

  **A vs. B Answer Differentiation**  
  - **A answer (27–30 marks):**  
    - Task 3: Explicitly ties UET’s pattern to perfect/imperfect duties and Kant’s necessary ends.  
    - Task 4: Original maxim with compelling generality demonstration and incisive reply critique.  
    - Task 5: Nuanced verdict and high-impact change-my-mind condition.  
  - **B answer (21–24 marks):** Typically lacks:  
    - Task 3: Clear articulation of necessary ends in the will test.  
    - Task 4: Effective generality problem illustration or adequate reply evaluation.  
    - Task 5: Precise change-my-mind condition.  

  **Note:** No credit for quotations, citations, or references beyond Kant’s core machinery.
