answer: |-
  Here's a stress test of the selected-effects (etiological) account of function, addressing your concerns in order of decisiveness, along with proponent responses and an honest assessment:

  **Most Decisive Objections (Should Move You):**

  1.  **Novel Traits with No Selection History (The Synthesized Gene / New Mutation Case):**
      *   **The Problem:** This is arguably the *strongest* objection. Introducing a gene *de novo* that confers antibiotic resistance (or a spontaneous mutation doing the same in a novel environment) lacks *any* selection history for that effect. Yet, biologists *will* say it has the function of conferring resistance. The selected-effects account *must* deny this is a "proper function" – it's merely a beneficial effect, an accident. Denying function here clashes powerfully with scientific practice and intuition.
      *   **Proponent Response:** They *bite the bullet*. They insist "function" is an inherently historical concept. They might distinguish:
          *   **Proper Function (Etiological):** Only applies with a history of selection *for* the effect.
          *   **Systemic Role / Capacity Function (Causal-Role):** What the trait *does now* that is beneficial/causal within the system.
          *   **Concession:** Proponents admit this is a cost, but argue it preserves the crucial function/malfunction distinction. The synthesized gene *can't* malfunction in conferring resistance; it can just fail to do it. A heart *can* malfunction by not pumping blood, even if it makes noise. Swampman cases are variations of this.
      *   **Decisiveness:** **High.** It directly contradicts a core intuition about novel, adaptive traits. Biting the bullet is costly but arguably principled. If you find this denial *unacceptable*, the view is seriously undermined.

  2.  **Within-Organism Selection (B cells vs. Cancer vs. Viruses):**
      *   **The Problem:** B-cell somatic hypermutation/selection *looks* like natural selection writ small. If selection generates function, then high-affinity antibodies have the function of binding antigen. But then so do cancer mutations selected *within* the tumor for proliferation/invasion, and viral mutations selected *within the host* for immune evasion. Granting "function" to cancer/viruses feels deeply counterintuitive. Restricting "selection" to the *organismal lineage* seems ad hoc.
      *   **Proponent Response:** **They draw a principled line:** Selection must occur at the level of *replicators* (genes, organisms) that are *interactors* in the *evolution* of the lineage. B-cells are somatic variants within a single organism; their "selection" doesn't contribute to the *evolution* of the *species lineage*. Cancer/viruses are separate evolutionary lineages *parasitizing* the host lineage. Their adaptations *do* have functions *for their own lineage*, but *not within the functional economy of the host organism*. The heart's function is defined relative to the *organism's* evolutionary history, not the tumor's or virus's.
      *   **Decisiveness:** **High-Moderate.** The line-drawing feels less ad hoc here than in the novel trait case. The core move ("function is relative to the lineage whose evolutionary history defines it") is central to the account. While granting cancer/viruses functions *for themselves* might be jarring, proponents see it as consistent. Denying B-cells *proper functions* (though they have systemic roles) is a cost they accept. This objection highlights the crucial dependence on defining "the system" (the lineage).

  3.  **The Gerrymandering Problem (Selection "For" What?):**
      *   **The Problem:** Selection acts on phenotypes with countless effects. Why is "pumping blood" the function, not "pumping liquid," "making lub-dub sounds," or "occupying the pericardial space"? If we say "the effect that *explains* the persistence," how do we non-circularly pick the *right* explanatory effect? Why not the disjunction of all effects that contributed *some* fitness?
      *   **Proponent Response:** They appeal to **explanatory relevance and causal specificity**. Selection acts *differentially* based on specific causal properties. The sound might be a side effect; occupying space is too vague. What mattered was *specifically* the movement of blood (or a circulatory fluid in ancestors), delivering oxygen/nutrients. The explanation for the heart's persistence crucially relies on *that specific causal capacity*. "Pumping blood" is the *specific, fitness-relevant effect* that causally explains the trait's selection and persistence.
      *   **Decisiveness:** **Moderate.** This is a serious theoretical challenge *within* the view. The "explanatory relevance" answer *is* doing work – it's appealing to the *actual causal mechanisms* that drove differential reproduction in ancestral environments. It relies on empirically reconstructing the *selective regime*. While not purely mechanical, it's not *just* restating intuition; it's tying function to the best causal explanation of the trait's existence. It's messy but arguably inherent to explaining complex historical processes.

  **Less Decisive, But Awkward / Requiring Refinement:**

  4.  **Reverse Cases:**
      *   **(a) Exaptation/Malfunction:** A trait selected for X, stops doing X, but is now maintained by selection for doing Y.
          *   *Problem:* Does it still have the function of X? Or now Y? Or both?
          *   *Proponent Response:* The *proper function* remains X (its etiological origin). However, it *currently* has the *capacity function* of Y for which it is *now* maintained. If Y is maintaining it, Y becomes part of its *current maintenance explanation*, but its *origin* defines its proper function. (e.g., Feathers: original function = thermoregulation; current function (also) = flight).
      *   **(b) Drift-Originated Useful Trait:** A trait fixed by drift, never selected for, but now crucial.
          *   *Problem:* Strictly, no *proper function*.
          *   *Proponent Response:* Same as the novel trait case: no proper function, only a beneficial systemic role/capacity function. Its current indispensability doesn't change its origin story.
      *   **Decisiveness:** **Low-Moderate.** These are handled by distinguishing *proper function* (historical origin) from *current maintenance* and *systemic role*. Adding "maintained because of" clauses clarifies the *persistence* explanation but doesn't redefine the *original selected effect* that established the trait as functional. This refinement feels necessary and consistent with the core historical commitment, not a fatal weakening.

  5.  **Artifacts and Design:**
      *   **The Problem:** Is "selection" by a designer or through the artifact's own replication history *really* the same as natural selection? Does this genuinely unify biological and artifactual function?
      *   **Proponent Response:** They argue it *is* analogous. Designer intentions mimic the "selection pressure" – the artifact is "selected for" (reproduced, copied) *because* of certain effects it produces. For software, selection occurs through version control/debugging/replication cycles. The core idea – function is the effect for which the item was reproduced/copied/maintained – holds. It's the same *concept* of function, applied to different kinds of "lineages" (biological vs. cultural/technological).
      *   **Decisiveness:** **Low.** This is often seen as a *strength* of the view, offering a unified account. The analogy between natural and artificial selection is deep and historically significant. While the mechanisms differ, the abstract structure of "differential reproduction based on effects" is similar enough for many proponents. Denying unification here might be more contentious for the *causal-role* view.

  **Which Objection to Press?** If I could press only one, I'd press **#1 (Novel Traits)**. It's the clearest, most direct clash between the theory's core commitment and a strong, common-sense intuition within biology itself. The cost of biting the bullet is highest here.

  **Causal-Role Proponent's Strongest Objection (and SE Response):**
  *   **CR Objection:** "Your account is useless for explaining *current* behavior and capacities! A physiologist studying a heart *right now* needs to understand its *current causal role* in circulation to explain how the organism stays alive *today*. Its history is irrelevant to this. Worse, your account renders novel traits (like the synthetic gene) or traits in new environments functionally inert by definition, crippling explanatory power in real-time biology and medicine."
  *   **SE Response:** **Concession & Distinction.** Selected-effects proponents readily concede that the *causal-role/systemic capacity* is crucial for many scientific purposes, especially proximate biology and engineering. Their claim is not that this is unimportant, but that it represents a *different concept* – "function" in the sense of *what the trait is **supposed** to do, what it was **designed** (by evolution) to do*. This is essential for understanding malfunction, vestiges, and the normative aspect of biological traits. They argue you *need* both concepts. The SE account aims to capture the teleological/normative dimension inherent in biology, which the CR account lacks.

  **Has it been patched to death? Is it still a good account?**
  *   **Patched?** Yes, significantly. Distinctions like proper function vs. systemic role/capacity function, refinements on "selection-for" via explanatory relevance, clarifications on levels of selection (organismal lineage), and incorporating maintenance alongside origin are all patches.
  *   **Unfalsifiable?** Not quite. It still makes clear, testable predictions: A trait *without* a history of selection for an effect *cannot* have that effect as its proper function. A trait *can* malfunction relative to its selected effect. If we found a complex, seemingly adaptive trait with *no possible* selection history (e.g., instantly created swampman *with* a history-less heart), the SE account *must* deny it has proper functions. Whether we accept that denial is key.
  *   **Is it still good?** **Yes, but with limitations.** The SE account remains the best (perhaps only) game in town for capturing the normative "supposed to" and malfunction aspects of biological function *without* invoking actual designers. Its core insight – linking function to evolutionary history – is profound and explains much. However, the patches highlight its limitations:
      *   It's primarily an account of *evolutionary* function.
      *   It struggles at boundaries (novel traits, within-organism dynamics).
      *   It needs supplementation by causal-role concepts for many explanatory tasks in proximate biology.
      *   Its precision relies on often difficult historical reconstruction.

  **Conclusion:** The selected-effects account is robust for its core domain – explaining the evolved, normative functions of traits in organisms shaped by natural selection. Objections #1 (Novel Traits) and #2 (Within-Organism Selection) are the most serious, forcing proponents to bite costly bullets or draw potentially contentious lines. However, these bullets are arguably bitten for principled reasons central to the view's core commitment to history. The account has been refined, not destroyed, by its patches. It remains a powerful and arguably indispensable account of biological teleology, even if it isn't the *only* useful concept of "function" in biology and needs to coexist with causal-role perspectives. Its fate isn't death by patching, but recognition as a specific, powerful tool within a pluralistic understanding of function.
