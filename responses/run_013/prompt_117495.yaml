prompt: |-
  I teach a graduate seminar on the ethics of memory, and this term my students and I have been trying to make sense of a pattern in how institutions handle contested commemorations — a pattern that strikes me as philosophically unstable, and I would like your help in saying precisely why. When the object is a bronze figure on a plinth, the dominant response among the institutions I have compared notes with is not removal but retrofitting: the statue stays where it is, and a new plaque, an interpretive panel, or a commissioned counterwork is installed beside or around it. When the object is a building's name — a donor's or a founder's name over a library door, on a lecture hall, on an endowed chair — the dominant response is removal, with the name struck and nothing put in its place. When the object is a street name, the response is increasingly additive: a number of cities now permit a block to be co-named, so that an honorary second name is added to a sign that keeps its official one, and the old honoree and the new one share the plaque. And in a couple of planning documents I have read, there is a fourth device that seems to me the most interesting of all: the sunset monument, built with an expiration date, subject to review, renewal, or demolition after a fixed term of years, on the model of a license rather than a deed.

  I am not asking which of these responses is the right one. I am asking what each presupposes, and whether they can be held together. What conception of commemoration must be in play for a plaque to neutralize a statue but not to neutralize a name, and for an added name to neutralize a street sign that a removed name could not neutralize? Do these practices commit their users to the view that a monument is an act of honor, an act of assertion, an act of the community's self-definition, or merely an instrument for producing certain effects in passersby — and which of those views does each device quietly rule out? Where the devices seem to conflict, is the conflict real, or is there a single underlying theory that would license all four, perhaps because the differences track something other than the metaphysics of commemoration, such as the reversibility of the act, the identity of the agent who performed it, or the audience it reaches? I would like you to reconstruct the implicit theory as carefully as you can, to distinguish what these practices strictly presuppose from what they merely fit comfortably with, to tell me where they are philosophically underdetermined so that several theories would license the same behavior, and finally to say what would have to change in our commemorative practice if we abandoned that implicit theory for a rival one — say, for a view on which public commemoration is a promise rather than a claim, or on which it is nothing but a matter of who controls the visible surface of the city. Please write your answer in American English.
reasoning: |-
  Okay, let me approach this complex query methodically. The professor observes four distinct institutional responses to contested commemorations: statue retrofitting, name removal, street co-naming, and sunset monuments. The core challenge is to uncover the implicit theories behind these patterns without judging their validity.

  First, I consider how each object type differs in its commemorative function. Statues are physical presences occupying public space, while names are linguistic labels attached to functional spaces. Street signs operate as directional tools with secondary honorific functions. The material permanence seems crucial here - bronze is harder to remove than letters on a plaque.

  The retrofitting approach for statues suggests institutions view them as historical artifacts rather than active endorsements. Adding contextual signage transforms the monument into a dialectic object, acknowledging its existence while disputing its message. This implies commemoration is seen as mutable meaning rather than fixed statement.

  Name removal operates differently. Stripping a donor's name treats commemoration as a revocable honor, suggesting names represent current institutional values rather than historical record. The emptiness afterward is telling - it creates a deliberate absence, a negation without replacement.

  Street co-naming is fascinating as a compromise. The dual naming implies commemorations can be layered rather than zero-sum. It suggests streets can bear multiple meanings simultaneously, serving both practical navigation and evolving community values.

  Sunset monuments introduce temporal consciousness. By building expiration dates into commemorations, institutions treat them as contingent statements subject to future community assessment. This radically reimagines monuments as temporal contracts rather than eternal presences.

  I notice these approaches reveal different aspects of commemorative ontology: statues as historical documents, names as current endorsements, streets as functional carriers, and all as potentially temporal. The conflicts arise because institutions are responding to different dimensions of commemoration rather than applying a unified theory.

  The professor's question about neutrality deserves attention. Why does a plaque neutralize a statue but not a name? Perhaps because statues make visual claims that demand visual counterpoint, while names make declarative claims requiring revocation. The materiality matters - bronze asserts itself differently than letters.

  For classroom discussion, I should highlight how these practices reveal commemorations as: 1) multi-dimensional (historical/current, functional/symbolic) 2) context-dependent 3) possessing varying degrees of reversibility. The "promise vs claim" alternative theories would fundamentally alter each approach - if commemoration were a promise, sunset clauses would be natural; if merely urban surface control, removal would always be simplest.

  The philosophical tension stems from institutions addressing different aspects of commemoration rather than contradictions within a single theory. Each method responds to what feels most salient about that commemorative form.
answer: |-
  Your observation reveals a profound tension in how institutions conceptualize the ontology of commemoration—what a monument *is* and *does*. Below, I reconstruct the implicit theory governing these practices, distinguishing core presuppositions from compatible-but-not-necessary ideas, identify points of underdetermination, and explore consequences of rival theories.  

  ### **Implicit Theory of Commemoration: A Reconstruction**  
  The pattern suggests institutions treat commemoration as **context-dependent speech acts** whose meaning and authority derive from:  
  1. **Material Permanence vs. Malleability**: Physical objects (statues, buildings) are seen as *enduring historical facts*, while names and signs are *active endorsements*.  
  2. **Agency and Reversibility**: Who installed the commemoration (past community vs. present institution) and how easily it can be "undone."  
  3. **Functional Interference**: Whether modification disrupts practical use (e.g., navigation).  
  4. **Temporal Authority**: Whether the commemoration asserts ongoing relevance or fixed historicity.  

  #### **Device-Specific Presuppositions**  
  | **Object**       | **Dominant Response** | **Core Presuppositions**                                                                 | **Ruled-Out Views**                                      |  
  |------------------|------------------------|------------------------------------------------------------------------------------------|----------------------------------------------------------|  
  | **Statue**       | Retrofitting           | - Statues are *historical artifacts*, not active honors.<br>- Meaning is contextual, not intrinsic.<br>- Removal erases history; addition "corrects" it. | Commemoration as eternal honor or immutable self-definition. |  
  | **Building Name**| Removal                | - Names are *current institutional endorsements*.<br>- Continuation implies active approval.<br>- Silence (empty plinth) is neutral, not negative. | Commemoration as passive record or irreversible act.     |  
  | **Street Name**  | Co-naming              | - Streets are *functional identifiers first*, honors second.<br>- Dual meanings can coexist without contradiction.<br>- Pragmatism trives purity (avoids renaming chaos). | Commemoration as exclusive or zero-sum.                  |  
  | **Sunset Monument**| Fixed-term renewal   | - Commemorative authority is *provisional*.<br>- Community values evolve predictably.<br>- Renewal is an act of recommitment, not failure. | Commemoration as permanent or transcendent of time.      |  

  ### **Can These Be Held Together?**  
  Yes, under a unified theory where:  
  - **Commemoration is a performative act** (like J.L. Austin’s speech acts), gaining meaning from:  
    - *Illocutionary force*: Is it an "honor" (name) or "record" (statue)?  
    - *Perlocutionary effect*: What does it *do* to observers (e.g., inspire, alienate)?  
  - **Key variables**:  
    - **Reversibility**: Names are easily revoked; bronze is not.  
    - **Agent**: A statue reflects a *past* community’s values; a building name reflects the *current* institution’s.  
    - **Audience reach**: Streets serve daily/public functions; statues are symbolic/destinational.  
  - **Conflict resolution**: The practices cohere if we see institutions as prioritizing:  
    - *Historical fidelity* for physical objects,  
    - *Current moral accountability* for linguistic labels,  
    - *Utility* for infrastructure,  
    - *Temporal humility* for new installations.  

  ### **Philosophical Underdetermination**  
  The practices *do not* strictly require:  
  - A single theory of meaning (e.g., intentionalism vs. reception theory).  
  - A fixed view of whether commemoration "honors" or "records."  
  - Moral realism (they work equally well under relativism if values shift).  
  - **Accommodated but not required**: The idea that commemoration is primarily about *community self-definition*. Retrofitting statues allows redefinition; name removal rejects past self-definitions; co-naming permits multiplicity.  

  ### **Consequences of Rival Theories**  
  If we abandon the implicit theory for:  
  - **Commemoration as a Promise**:  
    - Sunset clauses become the *only* legitimate form (all commemoration is time-bound).  
    - Removal without replacement violates fidelity; retrofitting might "amend" the promise.  
    - Co-naming breaks the promise’s exclusivity.  
  - **Commemoration as Control of Visible Surfaces**:  
    - Removal would dominate *all* cases (simplest reassertion of control).  
    - Retrofitting and co-naming become half-measures; sunset clauses seem irrational.  
  - **Commemoration as Pure Assertion**:  
    - All contested objects *must* be removed or altered—silence (empty nameplate) is still an assertion of repudiation.  
    - Co-naming dilutes the intended assertion.  

  ### **Why Neutralization Fails for Names but Works for Statues**  
  - **Plaque + Statue**: The plaque reframes the statue as a *failed historical claim*, turning it into evidence of past error. The statue’s material persistence becomes pedagogical.  
  - **Removed Name**: An empty space is not "neutral" but an *erasure*—a new speech act denying honor. Adding a plaque beside nothing would imply the *absence itself* is commemorative (e.g., of violence), which institutions avoid.  
  - **Co-named Street**: The old name is *demoted* to a functional label ("Main St.") while the honorary layer shifts to the co-name. The original honoree is not negated but *displaced* from honorific status.  

  ### **Conclusion: The Metaphysics in Practice**  
  The implicit theory is **pragmatic historicism**: commemoration’s meaning depends on its material form, its reversibility, and whether the institution sees itself as *curator* (of statues/history), *author* (of names/current values), or *facilitator* (of streets/utility). The conflicts arise because these roles overlap uneasily—e.g., is a named building a historical record (like a statue) or a current endorsement? The practices reveal institutions grappling with commemoration as *simultaneously* fact, act, and instrument. To adopt a rival theory would force radical consistency: if all commemoration is a "promise," expiration dates become mandatory; if it’s "surface control," removal reigns. The current ecosystem persists precisely because it avoids committing to any single metaphysics—it is a patchwork of solutions for a patchwork phenomenon.  

  This framework should help your students interrogate whether this inconsistency reflects a deeper pluralism about memory or a failure of philosophical courage.
