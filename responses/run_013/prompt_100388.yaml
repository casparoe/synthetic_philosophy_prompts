answer: |-
  ## The Moral Weight of Conventions: Why Guest License Fails

  **Verdict: Everyday conventions *can* generate genuine moral obligations for visitors when non-compliance foreseeably harms specific individuals or undermines essential cooperative structures, rendering the "guest license" insufficient and often morally negligent.**

  Your instinct is correct: your friend's "guest license" view is dangerously simplistic. While conventions *are* often arbitrary coordination equilibria, dismissing them as morally insignificant for outsiders ignores the real-world consequences of non-compliance and the foundational role such conventions play in social cooperation. Your "imposition test" is closer to the mark but needs refinement: the core issue is **foreseeable harm to identifiable individuals or the undermining of essential cooperative frameworks that protect vulnerable parties.**

  Conventions become morally obligatory not merely through their existence, but through their *function*. They solve coordination problems, prevent conflict, allocate burdens and benefits, and crucially, create reasonable reliance. When a visitor knowingly enters a system built on such reliance, claiming exemption because they "weren't party to the bargain" is like refusing to drive on the right in a right-driving country – it ignores the tangible harm caused by disrupting the expected flow others depend on for safety and order. Outsider status doesn't absolve one of the responsibility to avoid actions that foreseeably cause harm within a system one voluntarily participates in.

  ### Applying the Refined Test to the Hard Cases

  1.  **The Anti-Tipping Visitor:**
      *   **Convention:** Tipping subsidizes wages in a system where employers underpay, relying on customer tips.
      *   **Visitor Action:** Declines to tip to protest the system.
      *   **Analysis:** **Genuine Moral Obligation.** Non-compliance directly shifts a *foreseeable, quantifiable cost* onto a specific, vulnerable individual – the server – who reasonably relied on the convention as part of their compensation within the existing (flawed) system. The visitor benefits from the service within that system. While the system itself may be immoral, the individual server is not the appropriate target for boycott; punishing them for structural injustice they didn't create is itself a moral failing. Outsider status doesn't change this; the harm to the specific server is just as real.

  2.  **The Conformist Jaywalker:**
      *   **Convention:** *De facto* jaywalking is the norm and expected flow of pedestrian traffic.
      *   **Visitor Action:** Jaywalks like the locals.
      *   **Analysis:** **No Genuine Moral Obligation (to obey the *letter* of the law).** Obeying the unenforced law against jaywalking in this context would be the genuinely disruptive act, violating the *de facto* coordination equilibrium that ensures pedestrian flow and safety *in that specific location*. There is no foreseeable harm caused to individuals relying on the *legal* rule, as everyone relies on the *actual* convention. The moral obligation here is to navigate safely according to the *prevailing, relied-upon practice*. Outsider status is irrelevant; conforming to the actual, functional equilibrium is the morally neutral (or even cooperative) act.

  3.  **The Queue Purist:**
      *   **Convention:** Holding a place for one friend arriving shortly is standard and accepted.
      *   **Visitor Action:** Refuses to hold a place, calling it cheating.
      *   **Analysis:** **Merely Conventional Obligation (to hold the spot), but Potential Moral Failing in Execution.** The specific act of holding a spot is a local coordination tool; refusing it disrupts the locally accepted efficiency norm. However, the *core* moral principle here is fairness and preventing undue delay. The visitor's rigid refusal, *if* it causes significant, foreseeable delay or frustration to others behind them who *were* relying on the local norm (e.g., making people wait much longer than expected), could become a minor moral failing – not because they broke the holding-spot rule, but because their inflexibility imposed an unreasonable cost *disproportionate* to their principled stand, violating the broader duty to minimize unnecessary harm in cooperative ventures. Outsider status slightly weakens the expectation to know the *specific* norm, but the underlying duty to be reasonably cooperative and avoid disproportionate disruption remains.

  4.  **The Host and the Dietary Refusal:**
      *   **Convention:** Guest eats what is served as a sign of respect/appreciation.
      *   **Visitor Action:** Refuses food due to their own (non-allergic/medical) conventions (e.g., vegetarianism, religious restriction).
      *   **Analysis:** **No Genuine Moral Obligation (to eat the food).** Bodily autonomy and core personal commitments (ethical, religious) override local hospitality conventions. While declining may disappoint the host, it doesn't typically shift a tangible, material *cost* onto them in the same way as unpaid wages or queue disruption. The harm is primarily to social expectation and feeling, not a quantifiable loss or violation of reliance essential for cooperation. A duty of *courtesy* in refusal exists (explaining politely if possible), but not a moral duty to violate fundamental personal norms. Outsider status reinforces the reasonableness of the host expecting potential differences.

  ### Conclusion

  The "guest license" crumbles upon scrutiny. Conventions are not merely arbitrary; they are the lubricant of social interaction, often creating reliance interests and preventing harm. While not all conventions carry moral weight (many are purely coordinative or symbolic), visitors *do* incur moral obligations when their actions, within a system they benefit from, foreseeably inflict harm on specific individuals (like the underpaid server) or unreasonably disrupt essential cooperative structures (like the queue's function in fair access) that others rely upon. Outsider status might excuse ignorance of the *specific* convention initially, but it does not provide blanket immunity from the moral duty to avoid foreseeable harm once the impact of non-compliance is understood. Politeness is insufficient; genuine moral obligations can indeed arise from the "small stuff" when real costs are shifted onto others.
