  Professionally, this needs to handle moral philosophy (conventionalism vs moral realism), game theory (coordination equilibria), and cultural anthropology (norms-as-social-contracts). But the tone must stay accessible – no jargon dumps. 

  Key insights forming: 
  - The friend's "arbitrary conventions" argument collapses when norms prevent tangible harm (like wage exploitation via tipping). 
  - "Guest license" ignores how visitors *benefit* from local coordination (e.g., orderly queues). 
  - The user's "imposition test" is salvageable if refined: focus on *foreseeable negative externalities* rather than vague "costs." 

  For the hard cases: 
  - **Anti-tipper**: Moral obligation exists because boycott harms servers without fixing the system. 
  - **Jaywalker**: No moral failing if conforming to *de facto* local practice. 
  - **Queue rebel**: Violates fairness – the "proxy" norm only works if all accept it. 
  - **Food refusal**: Convention creates expectation, but bodily autonomy overrides. 

  Verdict will be that conventions *can* be morally binding when they: 
  (a) Protect vulnerable parties 
  (b) Sustain cooperation 
  (c) Cause no harm when flouted. 
  Guest license fails on (a) and (b). 

