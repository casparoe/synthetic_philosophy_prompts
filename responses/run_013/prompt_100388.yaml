  Hmm, this feels philosophically meaty but also deeply personal – the user seems hurt by the rift with their friend and is genuinely searching for clarity. The examples they provide (tipping, jaywalking, queueing, food customs) are brilliantly chosen because they stress-test both positions. I notice the user admits their own test gave "answers they didn't like," which shows admirable intellectual honesty.

  The emotional subtext here matters. Beyond winning an argument, the user likely wants: 
