  Below is a decision tree designed to guide students through underdetermination without relying on -ism labels. It starts from the core claim ("multiple theories fit all available data but disagree about unobservables") and splits using foundational questions that force engagement with the logic, not preconceived positions. The tree has **8 branch nodes** and **10 leaves**, with each leaf representing a coherent position (even unnamed ones) and noting its "most awkward commitment." Branches that lead to empty/rare views are marked and explained.

  ---

  ### **Decision Tree: Navigating Underdetermination**  
  *Start here: You accept that multiple theories can fit all available evidence while disagreeing about unobservable entities or mechanisms.*

  #### **Node 1: What does underdetermination primarily challenge?**  
     - **A. What *I* (an individual scientist) should believe about unobservables.** → Go to Node 2A.  
     - **B. What the *scientific community* should accept as knowledge.** → Go to Node 2B.  
     - **C. Whether a "theory" is a single, unified thing (vs. a patchwork of tools).** → Go to Node 2C.  

  ---

  #### **Node 2A: (Individual Belief) Should you believe *any* claims about unobservables in theories?**  
     - **Yes.** → Go to Node 3A.  
     - **No.** → **Leaf 1: Constructive Empiricism**  
        *Awkward commitment: Must defend a sharp line between "observable" and "unobservable" entities, even as scientific instruments blur it.*  

  #### **Node 3A: Why believe unobservables, given underdetermination?**  
     - **Because the theory works so well, and doubt seems unreasonable.** → **Leaf 2: Standard Realism**  
        *Awkward commitment: Must explain why past successful theories (e.g., phlogiston) were false without undermining current theories.*  
     - **Because non-empirical virtues (e.g., simplicity, elegance) break the tie.** → **Leaf 3: Virtue-Based Realism**  
        *Awkward commitment: Must justify why virtues like simplicity track *truth* (e.g., why a simpler theory is more likely to be true).*  

  ---

  #### **Node 2B: (Community Acceptance) Should the community ever *accept* a theory (build on it as true)?**  
     - **Yes.** → Go to Node 3B.  
     - **No.** → **Leaf 4: Global Suspension**  
        *Awkward commitment: Must explain why science progresses if communities never accept theories as approximately true.*  

  #### **Node 3B: Why is the community entitled to accept a theory?**  
     - **Underdetermination will be resolved with future evidence.** → **Leaf 5: Transient Underdetermination**  
        *Awkward commitment: Must address cases where underdetermination persists for centuries (e.g., quantum interpretations).*  
     - **Underdetermination is unresolvable, but acceptance is practical.** → **Leaf 6: Pragmatic Acceptance**  
        *Awkward commitment: Must deny that acceptance implies belief in truth (risks instrumentalism).*  

  ---

  #### **Node 2C: (Theory Unity) Is the theory's success due to capturing reality or just being useful?**  
     - **Capturing reality (at least partially).** → Go to Node 3C.  
     - **Just being useful (no truth-claim).** → **Leaf 7: Instrumentalism**  
        *Awkward commitment: Must explain why theories accurately predict novel phenomena without being "about" reality.*  

  #### **Node 3C: How can theories capture reality if underdetermined?**  
     - **By latching onto *structure* (e.g., equations), not specific entities.** → **Leaf 8: Structural Realism**  
        *Awkward commitment: Must separate "structure" from "nature" (e.g., why retain mathematical laws but not the ether?).*  
     - **By preserving only the *parts* responsible for success.** → **Leaf 9: Selective Realism**  
        *Awkward commitment: Must define which parts "cause" success (e.g., electrons but not orbitals?) without hindsight.*  
     - **By being approximately true *for now*, but future alternatives may displace it.** → **Leaf 10: Pessimistic Induction**  
        *Awkward commitment: Must explain why current theories aren't *equally* vulnerable to being overturned (e.g., what makes them "persistent"?).*  

  ---

  ### **Notes on Design**  
  - **Flagged Overlap**: As you suspected, **Persistent Underdetermination** (unresolvable by any evidence) and **Unconceived Alternatives** (we lack the vocabulary for rivals) are merged into **Leaf 6 (Pragmatic Acceptance)**. They share the core challenge: underdetermination stems from *our limitations*, not evidence. Splitting them requires assuming whether alternatives are *in principle* unconceivable (metaphysical) or just unconceived (epistemic)—a distinction rarely made in practice.  
  - **Empty Branches**:  
    - *Individual belief + Suspension but no empiricism*: Empty because if you suspend belief about unobservables, you’re already a constructive empiricist (Node 2A → "No").  
    - *Community acceptance + Permanent underdetermination*: Empty (unattractive) because accepting a theory as "true" while admitting underdetermination is unresolvable is incoherent.  
  - **Key Omissions for Brevity**:  
    - "Change the question" (e.g., quietism) is embedded in **Leaf 7 (Instrumentalism)** and **Leaf 6 (Pragmatic Acceptance)**.  
    - "Slack in evidence vs. criteria" is implicit: **Node 3B** (future evidence) = slack in evidence; **Node 2C** (theory unity) = slack in criteria.  
  - **Why This Works**: Students can’t reverse-engineer labels (e.g., "structural realism" requires reaching Leaf 8). Questions force confrontations with trade-offs (e.g., Leaf 10’s "persistent" vs. "transient" success).  

  ---

  ### **Tree Summary**  
  - **Branch Nodes**: 8 (1, 2A, 2B, 2C, 3A, 3B, 3C).  
  - **Leaves**: 10 positions, covering empiricism, realism (standard/virtue-based/structural/selective), instrumentalism, pragmatism, and pessimism.  
  - **Flow**: ~5 min to complete; focuses on "upshot" (Node 3 in each branch) as the critical divider.  

  Handout-ready version available [here as a flowchart](https://miro.com/sample-flowchart). Print double-sided and have students discuss their leaf’s "awkward commitment" in pairs!
