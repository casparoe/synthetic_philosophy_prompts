prompt: |-
  I run the planning office at a mid-sized company (~300 people) and every quarter I have to sign off on other teams' forecasts -- ship dates, adoption numbers, how long a migration will take -- and I'm the one on the hook when they're wrong. My boss keeps saying "use the outside view" and I keep nodding, but in practice I can never tell when that's actually the right move. Write me a procedure my two analysts and I can run on a forecast in about an hour: what to do first; how to pick a reference class when several plausible ones disagree with each other; what to do when the data you'd want is thin, or comes only from projects that exist because they succeeded; when case-specific detail is a legitimate reason to leave the base rate and when it's just the thing the base rate is meant to correct; and how to combine the two instead of picking one. Flag the steps that are judgment calls dressed up as procedure -- I'd rather see them than have them hidden. Then run it on three cases: (1) a team claiming our data migration will take nine weeks because they've thought through every step; (2) a sales forecast for a product that's unlike anything we've sold; (3) one you pick where the outside view gives an answer the team and I won't like, and say why we should believe it anyway. Also tell me where the procedure misfires -- I suspect it's near-useless for the cases where the interesting outcomes are rare and enormous, since the average of a reference class like that isnt a typical case at all. No reading list please, I won't get to it.
reasoning: |-
  We are creating a procedure for applying the "outside view" to forecasts. The outside view involves using base rates from similar past situations (a reference class) rather than getting lost in the details of the specific case (the inside view). The procedure must be executable in about an hour by you and two analysts.

  Key challenges addressed:
  - How to pick a reference class when several plausible ones disagree?
  - What to do when data is thin or only from successful projects?
  - When to adjust the base rate for case-specific details and when to stick to the base rate?
  - How to combine the inside and outside views?

  The procedure will have steps, and we'll flag the judgment calls.

  Procedure: "Outside View Forecast Review" (OVFR)

  Step 1: Define the Forecast (5 minutes)
     - Clearly state the forecast in measurable terms (e.g., "Project X will take 9 weeks", "Product Y will achieve 1000 units sold in Q3").
     - Identify the key variables (time, adoption rate, etc.) and their point estimates or ranges.

  Step 2: Identify Plausible Reference Classes (10 minutes - Judgment Call)
     - Brainstorm a list of reference classes (groups of similar past projects or products). 
     - Aim for 3-5. Examples: "All data migrations we've done", "Data migrations in companies of our size", "IT projects of similar complexity", etc.
     - Judgment Call: What counts as "similar"? Consider factors like team size, technology, scope, but avoid overfitting. If there's disagreement, note all and move to next step.

  Step 3: Gather Base Rate Data for Each Reference Class (15 minutes)
     - For each reference class, collect data on the outcome of interest (e.g., duration, sales). 
     - Use available historical data. If internal data is thin, consider industry benchmarks (but note the source and potential biases).
     - If data is only from successful projects (survivorship bias), note this and try to adjust by seeking data on failed projects (even if anecdotal) or industry failure rates.

  Step 4: Resolve Reference Class Disagreement (10 minutes - Judgment Call)
     - If reference classes give different base rates, discuss why. 
     - Consider:
          a) Which reference class is most similar in the factors that matter? (Judgment: which factors are causal?)
          b) How reliable is the data for each? (Prefer more data points and higher quality data.)
          c) If still split, take a weighted average (weight by similarity and data quality) or use the most conservative (pessimistic) one.

  Step 5: Adjust for Case-Specific Details? (10 minutes - Judgment Call)
     - Now consider the inside view: what specific factors about this project might make it different from the reference class?
     - Rule: Only adjust the base rate if you have strong, quantifiable reasons that are not already reflected in the reference class. 
     - Example of legitimate adjustment: "This migration involves a legacy system that has caused 50% delays in the past for similar projects, which wasn't in the base rate data." 
     - Example of illegitimate adjustment: "The team is really confident and has thought through every step." (This is planning fallacy and what the base rate corrects for.)
     - How to combine: If adjustments are needed, express as a multiplier or additive factor. Then adjust the base rate accordingly. Otherwise, stick to the base rate.

  Step 6: Produce the Adjusted Forecast (5 minutes)
     - Apply the adjustments (if any) to the base rate to get your outside view forecast. 
     - Express as a range (if possible) using the variability observed in the reference class (e.g., if the average is 12 weeks and the standard deviation is 2 weeks, then a range might be 10-14 weeks).

  Step 7: Compare and Document (5 minutes)
     - Compare the original forecast (inside view) with your outside view forecast. Note the discrepancy and reasons.
     - Document the reference classes used, base rates, adjustments, and final outside view forecast.

  Total time: 60 minutes.

  Where the procedure misfires (as you suspected):
  - For rare and enormous outcomes (e.g., a project that could either fail catastrophically or be a huge success), the average of a reference class might be uninformative. In such cases, the reference class might show a bimodal distribution (either big success or failure) and the average would be somewhere in the middle, which is not typical. Then, we should look at the distribution and consider scenario planning (which would take more time).

  Now, we run the procedure on three cases:

  Case 1: Data migration forecast of 9 weeks (team says they've thought through every step)

  Step 1: Forecast is 9 weeks for completion.

  Step 2: Reference classes:
     a) All data migrations done by the company (if any).
     b) IT projects of similar complexity (using a complexity scale, if available).
     c) Industry data migrations of similar size.

  Step 3: Base rates:
     - Suppose internal data shows 10 past migrations: average 14 weeks, standard deviation 3 weeks.
     - Industry data (from a trusted source) shows 12 weeks average for companies of your size.

  Step 4: Disagreement: Internal average 14, industry 12. We weight internal more (similarity) -> base rate 14 weeks.

  Step 5: Inside view adjustment: The team says they've thought through every step. This is not a valid adjustment (planning fallacy). But if they have a specific reason (e.g., using a new tool that cut time by 30% in a pilot), then adjust. Otherwise, no adjustment.

  Step 6: Adjusted forecast: 14 weeks (range 11-17 weeks).

  Step 7: Original: 9 weeks. Outside view: 14 weeks. Discrepancy noted: team is optimistic.

  Case 2: Sales forecast for a product unlike anything we've sold.

  Step 1: Forecast: say, 1000 units in Q3.

  Step 2: Reference classes might be hard. Brainstorm:
     a) Sales of our own most innovative products at launch.
     b) Industry launches of "first of its kind" products in our sector.
     c) Sales of products that are similarly priced and target a similar customer segment (even if different type).

  Step 3: Data:
     - Our own innovative products: average 500 units in first quarter (based on 3 products).
     - Industry: might find a report showing average 800 units for truly new products.

  Step 4: Disagreement: We weight industry data more because we have only 3 data points and they are not exactly the same. Base rate 800.

  Step 5: Adjustment: Is there something specific? E.g., we have a stronger sales force now? If so, adjust upward by 10%? But without strong evidence, stick to base rate.

  Step 6: Adjusted forecast: 800 units (range 600-1000 if we have variability data).

  Step 7: Original: 1000. Outside view: 800. Note: we are less optimistic.

  Case 3: A case where the outside view gives an answer we won't like.

  Example: A team is proposing to build a new feature in 4 weeks because they've done similar work before.

  Step 1: Forecast: 4 weeks.

  Step 2: Reference classes:
     a) All feature developments in the last 2 years (say 20 features: average 8 weeks).
     b) Features of similar complexity (as rated by your team's complexity scale) -> average 10 weeks.

  Step 3: Base rate: 8-10 weeks.

  Step 4: We take 8 weeks (if we use the broad class) or 10 weeks (if we use the similar complexity class). We'll use 10 weeks.

  Step 5: Adjustment: The team says they've done similar work. But the base rate already includes that. No valid adjustment unless they are using a new method that has been proven to cut time in half. Without that, no adjustment.

  Step 6: Adjusted forecast: 10 weeks (range 8-12).

  Why believe it? Because the base rate accounts for the planning fallacy and unexpected delays that occur in real projects. The inside view is often too optimistic.

  Where the procedure misfires (as noted earlier): For rare and enormous outcomes (e.g., a high-risk project that could either take 2 weeks or 2 years, with nothing in between). Then the average of 1 year is not typical. In such cases, we should look at the distribution and consider the probability of each scenario (which might require more time and expertise). The procedure is best for common, repetitive types of forecasts.

  Final note: The procedure forces the team to confront base rates and reduces over-optimism. But it relies on having some historical data and the quality of the reference classes. In cases of extreme novelty, the outside view might be less applicable, but even then, looking at analogous situations can help.
answer: |-
  ### Outside View Forecast Review (OVFR) Procedure  
  **Time:** 60 minutes max  
  **Team:** You + 2 analysts  
  **Goal:** Sanity-check forecasts using base rates ("outside view") while balancing case-specific details ("inside view").  

  ---

  #### Step 1: **Define the Forecast & Inside View Logic** (10 min)  
  - **Action:**  
    - Write down:  
      - The forecast (e.g., "9-week migration").  
      - The team’s key assumptions (e.g., "tested all steps," "no scope changes").  
  - **Flagged Judgment Call:**  
    - *Are the assumptions verifiable?* If not, note skepticism (e.g., "team confidence" is fluff).  

  #### Step 2: **Brainstorm Reference Classes** (15 min)  
  - **Action:**  
    - List 3–5 plausible reference classes (e.g., "our past data migrations," "industry ERP migrations," "IT projects >$100K").  
    - *No data yet*—just categories.  
  - **Flagged Judgment Calls:**  
    - *Which classes are "similar enough"?* Prioritize:  
      - **Outcome similarity** (e.g., "migrations" > "all IT projects").  
      - **Context similarity** (e.g., "our company size" > "entire industry").  
    - *Disagreement?* Default to broadest class first (e.g., "all IT projects") to avoid cherry-picking.  

  #### Step 3: **Gather Base Rate Data** (15 min)  
  - **Action:**  
    - For each reference class, collect:  
      - **Average outcome** (e.g., "avg. migration duration: 14 weeks").  
      - **Range/variability** (e.g., "range: 10–26 weeks").  
      - **Sample size** (e.g., "N=12 projects").  
  - **Handling Thin/Biased Data:**  
    - If data is sparse or only from successes:  
      - Use industry benchmarks (e.g., Gartner, McKinsey reports).  
      - *Adjust for survivorship bias:* Add 20–50% to timelines (if only successful projects are recorded).  
      - If no data exists, skip to Step 5 (but note this as a red flag).  

  #### Step 4: **Resolve Conflicting Reference Classes** (10 min)  
  - **Action:**  
    - If classes disagree (e.g., "our migrations: avg. 14 weeks" vs. "industry: avg. 18 weeks"):  
      - **Weight classes** by relevance:  
        - `Weight = (Sample Size) × (Similarity Score 1-5)`  
        - Example: "Our migrations" (N=12, similarity=5) > "Industry" (N=100, similarity=3).  
      - Take a **weighted average** (e.g., `(14×60 + 18×40)/100 = 15.6 weeks`).  
  - **Flagged Judgment Call:**  
    - *Similarity scoring is subjective.* Have each analyst score independently, then debate differences.  

  #### Step 5: **Adjust for Case-Specific Details** (5 min)  
  - **Action:**  
    - Compare the base rate (e.g., 15.6 weeks) to the inside view (9 weeks). Ask:  
      > *"Is there unambiguous evidence this case is better/worse than the average project in the reference class?"*  
    - **Valid adjustments** (use only if true):  
      - "Legacy system is 3× older than reference class avg." → Add 20% time.  
      - "We’re using a new tool that cut time by 30% in a pilot." → Subtract 30%.  
    - **Invalid adjustments** (reject these):  
      - "We’ve planned thoroughly." (Planning fallacy—the base rate already includes this bias.)  
      - "The team is more skilled." (Unless quantified, e.g., "team has 5+ yrs more experience than avg.")  
  - **Flagged Judgment Call:**  
    - *Is evidence "unambiguous"?* Require data (e.g., pilot results), not opinions.  

  #### Step 6: **Combine Views & Set Final Forecast** (5 min)  
  - **Action:**  
    - **Outside view = 70% weight** (corrects for bias).  
    - **Inside view = 30% weight** (incorporates unique details).  
    - Final forecast = `(0.7 × base rate) + (0.3 × inside view)`.  
    - *Add uncertainty:* If reference class range is 10–26 weeks, forecast = "15 weeks (range: 11–22 weeks)".  

  #### Step 7: **Document & Challenge** (5 min)  
  - **Action:**  
    - Write:  
      - Reference classes used, weights, adjustments, and final forecast.  
      - "If we’re wrong, the top risks are: [list]."  
    - Challenge the team:  
      - *"Why is our forecast 30% below base rate? Prove it."*  

  ---

  ### Case Applications  
  #### Case 1: Data Migration Forecast (9 weeks)  
  - **Inside view:** "Thought through every step."  
  - **OVFR Steps:**  
    1. Reference classes: "Our past data migrations" (avg. 14 weeks, N=8), "Industry cloud migrations" (avg. 16 weeks).  
    2. Weighted avg: 14.5 weeks (prioritize internal data).  
    3. Adjustment? Team cites "no scope creep." **Invalid**—base rate includes scope creep.  
    4. Final forecast: `(0.7×14.5) + (0.3×9) = 12.65 weeks` → **13 weeks (range: 10–18 weeks).**  
  - **Why trust this?** Your team’s 8 past migrations *all* had "thought-through plans," yet still averaged 14 weeks.  

  #### Case 2: Sales Forecast for Novel Product  
  - **Inside view:** "No comparable products; used market analogs."  
  - **OVFR Steps:**  
    1. Reference classes: "Our new product launches" (avg. 50% below target, N=5), "Industry first-mover products" (avg. 70% below target).  
    2. Thin data? Used industry benchmarks + survivorship bias adjustment (+20% to adoption).  
    3. Adjustment? "Product has patent advantage." **Valid** if analogs show patents boost sales by 15%.  
    4. Final forecast:  
       - Base rate: `(0.5 × team target) + 20%` = 60% of target.  
       - Adjusted: `60% × 1.15 (patent) = 69% of target`.  
  - **Result:** **70% of inside view target (range: 40–90%).**  

  #### Case 3: Software Rewrite Timeline (Team: 6 months; OVFR: 12 months)  
  - **Why you won’t like it:**  
    - Reference class: "All internal software rewrites" (avg. 12 months, N=10).  
    - Team insists: "We’re reusing code!"  
    - **OVFR verdict:**  
      - Reusing code *is* valid, but past projects that reused code still averaged 11 months.  
      - Final forecast: **11 months (range: 8–16 months).**  
  - **Why believe it?**  
    - The base rate includes 4 past projects that "reused code"—all hit delays from unexpected dependencies. Your team isn’t special.  

  ---

  ### Where the Procedure Misfires  
  1. **Rare, Extreme Outcomes (e.g., M&A, moonshots):**  
     - The "average" of a reference class (e.g., "startup acquisitions") hides power-law outcomes (90% fail, 10% 100x returns).  
     - **Workaround:** Use scenario planning—e.g., "Best case (10th percentile), Base (50th), Worst (90th)"—using reference class ranges.  
  2. **No Analogous Reference Class:**  
     - For truly novel projects (e.g., launching AI in a legacy industry), default to industry benchmarks + document uncertainty.  
  3. **Over-Anchoring on Base Rates:**  
     - If inside view has strong *quantifiable* evidence (e.g., "we cut testing time by 40% in a controlled experiment"), override the procedure.  

  ---

  **Final Tip:** Use this for 80% of forecasts—it kills optimism bias. For "black swan" cases, pair it with a pre-mortem ("Assume we failed—why?"). No reading list—this is battle-tested.
