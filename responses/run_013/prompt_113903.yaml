prompt: |-
  My reading group has a Humean and an anti-Humean about laws of nature who've been going at it for a year and are now mostly accusing each other of begging the question. Write the joint statement they should be able to sign. Three things: (1) the agreed claims, including what each side is *not* committed to -- I'm fairly sure the Humean isn't saying laws are arbitrary or that anything goes, and the anti-Humean isn't saying laws are little agents shoving things around; (2) the remaining disagreement, with each side's position phrased in a way that side would accept; (3) the cruxes, and for each one a case or argument both sides agree bears on it plus what each predicts about it. Two cruxes I want handled explicitly: whether the anti-Humean can give any account of how we'd come to know the necessitation, or whether that demand just changes the subject; and whether the Humean can give a non-arbitrary reason the best system isn't simply a very long list. Also work this case in if it's any use, since none of us has read anything on it and I want to watch the two positions grind against something that isn't already in the textbooks: a world whose mosaic contains two regions, spatiotemporally and causally sealed off from one another, that happen to display exactly the same pattern of regularity. One axiomatization covering both, or two numerically distinct laws, or one law occurring twice over? Say which answer belongs to which side, and whether the difference makes a difference either side would predict. If the case turns out to be idle, say that too. Format: numbered agreed-claims section, then a disagreements table.
