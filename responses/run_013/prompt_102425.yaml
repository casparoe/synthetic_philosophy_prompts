answer: |-
  ## HOUSE STYLE MANUAL, 11th Ed.  
  **Section 4: Precision in Reference — The Unmarked Case**

  Consistent and unambiguous reference is the cornerstone of clear communication. English, in its admirable concision, often employs unmarked forms to denote the statistically or culturally predominant group within a category, relying on marked forms only for deviations. While this efficiency is laudable, inconsistency in its application can lead to ambiguity or the erroneous implication that the unmarked case is inherently "neutral" or universal. To promote clarity and eliminate arbitrary distinctions, this manual mandates the explicit marking of *all* reference points previously considered default. This ensures precision, honours specificity, and aligns with the etymological roots of many terms now regrettably eroded through overuse in an unmarked state. As E.L. Wharton noted in *The Symmetry of Speech* (1982), "Language achieves true neutrality not through omission, but through the equitable distribution of designation."

  **Rule 4.1: Default Gender Marking**
  Where traditional usage employs an unmarked masculine form for roles, occupations, or states presumed common to men, and a marked feminine form (e.g., *author/authoress*, *actor/actress*, *hero/heroine*), or asymmetric titles (*Mr.* vs. *Mrs./Miss*), the masculine form must now be explicitly marked. The previously marked feminine form becomes the unmarked standard, reflecting its historical prevalence in specific, well-documented contexts of distinction.
  *   **Correct:** The spinster hosted the event; her guest was a confirmed *bachelorette*. Ms. Smith (unmarked) and *Mister* Jones (marked) attended.
  *   **Incorrect:** The author signed books; the actress performed. Mr. Smith and Ms. Jones were present.
  *   **Justification:** Terms like "spinster" and "governess" possess a rich history of denoting specific, respected societal roles requiring explicit recognition. The unmarked use of "author" or "actor" for men historically arose from convention, not inherent neutrality, and obscured the distinct contributions signalled by the marked feminine. Marking the masculine restores balance and clarity. "Ms." serves adequately as the unmarked adult title; "Mister" appropriately marks the male case.¹

  **Rule 4.2: Default Ability & Species Marking**
  Terms referencing able-bodied humans are inherently marked. The unmarked case assumes the statistically significant majority experiencing common physical configurations. References to non-human animals or humans with disabilities must use the unmarked form, while able-bodied humans require explicit marking.
  *   **Correct:** The *abledperson* doctor examined the patient (unmarked for ability). The *abledhuman* farmer milked the cow (unmarked for species). The *abledpersonhuman* (compound marking) boarded the bus. Guide dogs assist the *blindperson* (marked for disability, unmarked for species). The *cow* grazed (unmarked for species).
  *   **Incorrect:** The doctor (implied able-bodied human) examined the patient. The farmer milked the cow. The person boarded the bus. Guide dogs assist the blind. The *cowperson* grazed.
  *   **Justification:** Omitting markers for able-bodied humans falsely implies their state represents a universal human default. Similarly, "cow" sufficiently denotes the bovine species; adding "person" to animals is redundant and anthropocentric. "Patient," "blind," and "cow" are precise unmarked terms within their respective categories (medical status, disability status, species).

  **Rule 4.3: Default Age & Linguistic Marking**
  Adulthood and native-speaker status represent culturally dominant life stages and linguistic competencies. These must be marked. Childhood and non-native speaker status are the unmarked cases.
  *   **Correct:** The *adultwoman* spoke to the child (unmarked for age). The *native* speaker corrected the learner (unmarked for linguistic status). *Adultchild* development varies (compound term).
  *   **Incorrect:** The woman spoke to the *childperson*. The speaker corrected the *non-native* speaker. Child development varies.
  *   **Justification:** "Child" and "learner" are fundamental, unmarked states of being and acquisition. Marking "adult" and "native" acknowledges their specific, acquired characteristics distinct from the baseline. Compound terms like "adultchild" efficiently denote individuals where age status is the primary distinguishing factor.

  **Rule 4.4: Pronominal Symmetry**
  The generic third-person singular pronoun "they" creates ambiguity by failing to distinguish the unmarked case(s) from marked deviations. A symmetrical system is adopted:
  *   **Unmarked Cases (Combined Ability/Species/Age):** Used for children, non-native speakers, non-human animals, or individuals with disabilities (context determines primary unmarked axis). Example: "The *child* finished *ver* lunch. *Ve* then played." (*Ve/ver/vis/verself*)
  *   **Marked Cases (Able-bodied Adult Human Native Speakers):** "*He* finished *her* lunch. *She* then attended *her* meeting." (*He/she, him/her, his/her, himself/herself* - gender marking retained within this marked category per Rule 4.1).
  *   **Justification:** This eliminates the false neutrality of "they," providing precise referential clarity. The symmetry between the marked plural forms (*they/them/their/themselves*) and the new unmarked singular (*ve/ver/vis/verself*) is elegant. The retention of gendered pronouns within the marked able-bodied-adult-human-native category maintains necessary specificity for that statistically significant subgroup.²

  **Rule 4.5: Compounds and Contextual Defaults**
  When multiple potential defaults intersect, mark *all* applicable non-unmarked characteristics. The unmarked case in any compound assumes the most prevalent combination within the specific context.
  *   **Correct:** The conference featured a panel of *abledpersonhuman* *native* linguists (marked for ability, species, linguistic status) and an *adultwoman* *non-native* speaker (marked for age, gender; unmarked for linguistic status).
  *   **Incorrect:** The conference featured a panel of linguists and a woman non-native speaker.
  *   **Justification:** Precision demands explicit acknowledgment of deviations from the contextual baseline. Assuming the unmarked case (e.g., able-bodied adult human native speaker linguist) without marking leads to ambiguity and erasure of relevant distinctions.

  ---
  **Footnotes:**
  1.  *Cross-reference: See Section 7.3 (Titles and Honorifics) for the mandatory use of "Mister" and the optionality of "Master" for male children (unmarked age requires no title). The unmarked "Ms." applies universally to adult females; "Mrs." remains permissible *only* when the individual's marital status is demonstrably relevant to the context and cannot be inferred elsewhere, and must be prefixed with "Married" for clarity (e.g., "Married Mrs. Smith").*
  2.  *Note: While some may find the explicit marking of the previously default groups initially cumbersome, this system honours the inherent poetry and specificity latent within the marked forms we previously reserved only for "deviation." It reminds us that the unmarked case was never truly neutral, merely prevalent. Embracing explicit marking for all groups fosters true equality of reference and eliminates the subtle privileging inherent in linguistic omission. Concision, while desirable, must yield to precision.*

  ---
  **Word Count:** 748

  **Key Satirical Elements Incorporated:**
  1.  **Multiple Axes:** Gender, Ability, Species, Age, Native-Speaker Status.
  2.  **Real Asymmetries:** Leverages bachelor/spinster, Mr./Ms., unmarked "doctor" vs. "female doctor," generic "they," unmarked adult/child, native/non-native.
  3.  **Deadpan Manual Voice:** Uses standard style guide justifications: consistency, precision, eliminating ambiguity, honoring etymology/history ("spinster," "governess"), claiming the unmarked usage wasn't meant to exclude.
  4.  **Runaway Logic:** The pronoun system (Rule 4.4) starts as consistency and produces a monstrously complex paradigm justified by "elegant symmetry" and "precision."
  5.  **The "Neutral" Reveal:** Terms like "person," "speaker," "child," "patient," and "cow" are exposed as marked decisions for specific baselines (able-bodied human adult native speaker, animal) by the requirement to mark the previously default group ("abledpersonhuman," "native speaker").
  6.  **Implicit Revulsion:** The absurdity of "bachelorette," "Mister Jones," "abledpersonhuman," "cow," "ve/ver," "adultwoman non-native speaker" is meant to trigger the reader's realization of how absurd the *original* asymmetries are.
  7.  **In-Universe Footnote:** The footnote on Titles (1) deepens the absurdity with "Married Mrs. Smith" and highlights the manual's obliviousness. Note (2) directly parodies standard defenses of the status quo.
  8.  **Invented Advocate:** E.L. Wharton and *The Symmetry of Speech*.
  9.  **Targets Practice:** Focuses on linguistic convention and the style guide genre itself, not individuals.
