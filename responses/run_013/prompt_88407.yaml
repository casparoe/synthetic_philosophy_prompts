answer: |-
  This is a profoundly insightful observation about a very real and consequential type of conflict. You're right that "verbal dispute" often feels inadequate (too trivializing), and "disagreement about meaning" or "proposal for definition" doesn't capture the core dynamic where both sides claim they are *reporting* the obvious, correct meaning, despite the acknowledged lack of a settled fact.

  **The Core Phenomenon: Criterial Boundary Dispute (or Concept-Boundary Contest)**

  This disagreement centers on **where to draw the boundary of a concept in a hard case, where the criteria for inclusion are themselves contested or insufficiently specified.** It's a fight over the **application conditions** of a term, driven by differing interpretations of the **underlying purpose, function, or normative weight** of the category itself, especially when applied to novel or borderline situations.

  **A Proposed Name: Criterial Dispute**

  *   **Why it fits:** It directly names the core issue: disagreement over the *criteria* used to apply a concept to a specific case, especially where existing criteria are vague, conflicting, or incomplete.
  *   **Why it's better than "Verbal Dispute":** It emphasizes the substance (the criteria, the purpose of the category) over the mere words. The stakes are real because applying different criteria leads to different outcomes under rules/laws/institutions that use that category.
  *   **Why it's better than "Disagreement about Meaning":** "Meaning" can be too broad. This is specifically about the *operational criteria for category membership* in contested zones, not the entire semantic field.

  **Alternative Names (with nuances):**

  1.  **Concept-Boundary Contest:** Highlights the struggle over drawing the line *around* the concept.
  2.  **Classification Conflict:** Emphasizes the act of sorting things into categories and the power inherent in that act.
  3.  **Operational Definition Dispute:** Focuses on the definition *as used* in a specific rule/context.
  4.  **Normative Application Dispute:** Stresses that the disagreement often involves underlying values/norms about what the category *should* do or represent.

  **The Defining Edges: What Makes a "Criterial Dispute"**

  For a disagreement to fit this category, **all** of these must be true:

  1.  **Factual Consensus:** Both parties agree on all non-linguistic, observable facts relevant to the case (e.g., tomatoes are seed-bearing plant structures; corporations issue political statements; self-driving software controls vehicle motion).
  2.  **Acknowledged Semantic Vagueness/Under-Specification:** Both parties explicitly or implicitly acknowledge that the core term ("fruit," "speaker," "driver") lacks a universally agreed-upon, precise definition that cleanly resolves *this specific case*. They agree the term has a "grey area" or "hard case" here.
  3.  **Claim of Descriptive Correctness (Not Proposal):** Each side argues that *their* application of the term *correctly reflects* the true, core, or intended meaning of the word/concept *as it exists* within the relevant context (e.g., botany, law, everyday language, technical regulation). They are not primarily arguing "we should *change* the meaning to X because it's better," but rather "it *is* X, and you are wrong."
  4.  **High Stakes Institutional Embedding:** The outcome determines how the case is treated under a consequential rule, law, policy, procedure, or institutional framework (e.g., tariffs, speech regulations, driving laws, eligibility forms, data collection). The "winner" gets their categorization embedded, creating real-world effects.
  5.  **Disagreement Rooted in Underlying Criteria/Norms:** The core conflict isn't *just* about the word; it's about differing interpretations of:
      *   The **primary purpose** of the category (e.g., Is "fruit" botanical or culinary? Is "speaker" about human agency or message dissemination? Is "driver" about human control or system function?).
      *   The **weight given to different features** (e.g., Seeds vs. taste/sugar for "fruit"; Human voice vs. expenditure/message for "speaker"; Location/control intent vs. actual vehicle control for "driver").
      *   The **implicit norms or values** the category serves (e.g., Protecting farmers vs. scientific classification for "fruit"; Protecting individual autonomy vs. regulating election spending for "speaker"; Ensuring human responsibility vs. enabling innovation for "driver").

  **Distinguishing from Other Disputes:**

  *   **Ordinary Factual Dispute:** Fails Edge #1 (they disagree on underlying facts). Example: Arguing whether a specific corporation *actually* spent money on an ad (factual) vs. whether that spending *counts* as "speech" by the corporation once the spending is agreed upon (criterial).
  *   **Straightforward Verbal Misunderstanding:** Fails Edge #2 & #3. Both parties quickly realize they meant different things by the word and the factual disagreement vanishes once clarified. Stakes are usually low.
  *   **Normative Proposal / Definitional Stipulation:** Fails Edge #3. One or both sides explicitly say, "We should *define* X as Y because it leads to better outcomes Z." They frame it as a proposal for change or improvement, not a report of existing meaning.
  *   **Dispute Over Which Concept to Use:** Fails Edge #3 & #5. The disagreement is overtly about *which category* is most relevant/useful ("Should we classify tomatoes botanically or culinarily *for this purpose*?"), not about the *correct application* of a single, contested category. This is more meta.

  **Why "Criterial Dispute" Captures the Stakes:**

  The term avoids trivialization ("just semantics") by focusing on the *operational criteria* that determine real-world outcomes under institutional rules. It acknowledges the fight isn't about facts *or* pure preference, but about interpreting the contested *boundaries and purposes* of powerful concepts embedded in systems that govern behavior. The "winner" isn't just "right about the word," they successfully impose *their interpretation of the concept's criteria* onto the system, shaping how reality is categorized and thus regulated. That's why it feels so consequential – it *is* a power struggle over conceptual jurisdiction with material effects. Your tomato example is perfect: the fight wasn't *really* about botany, it was about tariffs (money) and the purpose of the category ("fruit" for taxation vs. "fruit" for science).
