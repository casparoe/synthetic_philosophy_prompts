prompt: |-
  Something that's bugged me for a while and I can't tell if it's a real tension or just institutions doing institution things. US perjury basically needs a false statement — Bronston walked after giving literally true but evasive answers about his Swiss bank accounts, and the Court's fix was "counsel should ask better follow-up questions." But in securities law, a statement that's true as far as it goes while omitting the thing that would make it not misleading *is* the fraud, and roughly the same goes for advertising and for medical informed consent, where not telling the patient something is treated like telling them something false. Now regulators are going after "dark patterns," which don't assert anything false at all but reliably leave you with a false belief. So the criminal rule looks like it's committed to a different theory of what's wrong with lying than the regulatory stuff is. (I think the deliberately-technically-true answer is called "paltering"?)

  What theory does the perjury rule presuppose about the wrong of lying — that it's the breach of an assertion's truth-warrant, so that merely exploiting the hearer's inference isn't the same kind of act? Does the rest of the pattern presuppose a deception-based or autonomy-based theory instead, and are these actually inconsistent or just different domains with different stakes? Be careful to separate what the criminal practice strictly presupposes from what it merely fits with — I suspect a lot of it is really about proof problems, notice, and who gets to ask follow-ups rather than about moral philosophy, and I want to know if that's right or if there's a genuine commitment underneath. And tell me what would have to change in criminal practice if we adopted the deception-based view.

  Give it to me as exactly five numbered points, a sentence or two each, no intro and no wrap-up.
reasoning: |-
  Hmm, the user is asking about a tension between perjury law and other areas like securities law, advertising, and medical consent. They're pointing out that perjury requires a false statement, while in other contexts, omissions or misleading impressions can be treated as fraudulent. They want to know the underlying theories of what makes lying wrong and if these approaches are inconsistent. They specifically asked for five numbered points without any introduction or wrap-up.

  First, I need to recall the Bronston case where technically true but evasive answers weren't considered perjury. The court said lawyers should ask better follow-ups. Contrast that with securities law under Rule 10b-5, where omissions that make a statement misleading are fraud. The same applies in advertising with the FTC and in medical consent, where not disclosing risks is like lying. Now, regulators are targeting "dark patterns" that trick users without false statements. This suggests a difference in legal standards.

  The user mentioned "paltering" as deliberately true but misleading statements. That's key here. The core question is whether perjury's strict falsity requirement is based on a different moral theory—like breaching a truth warrant—versus deception or autonomy in regulatory areas. But I should consider if it's more about practical issues like proof and procedure rather than philosophical commitments.

  Breaking it down: Perjury might emphasize the formal act of asserting something false, so the wrong is violating the oath to tell the truth. In contrast, regulatory laws focus on the outcome—deception or harm to autonomy. The stakes are higher in criminal law, so standards are stricter to avoid wrongful convictions, requiring clear falsehoods. Regulatory contexts have lower burdens and aim to prevent harm, allowing for broader interpretations of misleading conduct.

  Also, procedural aspects matter. In perjury, follow-up questions are possible in settings like trials, whereas in advertising or online interactions, there's no chance for clarification, making omissions more problematic. If criminal law adopted a deception-based view, it would need to redefine elements like materiality and intent, which could blur lines and raise proof challenges.

  The user wants exactly five points. I'll cover: 1) Perjury's core wrong as false assertion breach. 2) Regulatory focus on deception/autonomy harm. 3) Stakes and proof differences. 4) Procedural context enabling follow-ups. 5) Changes needed if criminal law shifted to deception-based. Each point must be concise—a sentence or two.

  I need to ensure this addresses their deeper curiosity about whether this tension is philosophical or institutional. My response should clarify that it's largely institutional, driven by practicality, not conflicting morals.
answer: |-
  1.  Perjury's core wrong is seen as the *formal breach of the oath's truth-warrant* – intentionally asserting a factual falsehood under oath violates the specific promise to tell the truth demanded by the proceeding.
  2.  Regulatory contexts (securities, ads, consent) focus primarily on preventing *deception* or *harm to autonomy* caused by material omissions or misleading impressions, prioritizing the listener's reasonable understanding over strict factual falsity.
  3.  The difference stems largely from divergent stakes and proof burdens: criminal perjury requires high certainty ("beyond reasonable doubt") of a specific false assertion, while regulatory standards prioritize preventing harm and often employ lower burdens ("preponderance") focused on the overall misleading effect.
  4.  Perjury's procedural context (e.g., cross-examination) inherently allows for follow-up questions to clarify ambiguity, making intentional evasion a less compelling wrong than in contexts where such clarification is impossible (e.g., an ad, a consent form, an online "dark pattern").
  5.  Adopting a deception-based view in criminal perjury would require redefining its elements to encompass material omissions and misleading impressions created by literally true statements, significantly lowering the threshold for criminal liability and blurring lines with regulatory fraud.
