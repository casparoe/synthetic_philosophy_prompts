prompt: |-
  I've been lurking around adversarial-collaboration stuff since the old LessWrong days and I want to try running one on a fight that keeps breaking out in my book club: are performative utterances — "I promise", "I resign", "I christen this boat the Whatever" — a genuinely distinct kind of speech act, one whose identity is constituted by conventions and felicity conditions, or is that whole category an illusion produced by a special class of verbs? Call the two camps the institutionalists (force is constituted by conventional, often social-institutional, rules; the felicity conditions aren't a side constraint on the act, they *are* the act's identity, and where there's no shared practice there's no act) and the intentionalists (at bottom all that's happening is a speaker expressing a commitment and an audience recognising it; conventions are enabling shortcuts for recognition, not constituents, and the class of "hereby"-capable verbs is a linguistic artifact rather than a real cut in nature). What I want is the joint statement these two could actually sign after a real, good-faith adversarial collaboration — not a transcript, not a verdict on who wins, but the document: (1) a numbered section of claims both sides can put their names to, including about the cases below and about what turns on which camp being right; (2) a disagreements table where the residual disagreements are stated twice, once in wording the institutionalist would accept as their own view and once in wording the intentionalist would, plus for each what would move that side and what its pre-registered prediction is; and (3) the cruxes underneath those disagreements, each with the case, argument, or mini-test both sides agree bears on it.

  To stop it from collapsing into a textbook recitation, I've made up a little battery and I want it used — add to it if you like, but these have to show up and be scored by both sides. The cases: (a) a castaway, alone, promises his dead brother he'll stop drinking — promise, private resolve in promise-shaped clothing, or nothing at all? (b) someone types "I resign" into a draft they never send; (c) a bet struck with what turns out to be a hallucination, or with a chatbot that has nothing to lose; (d) an insincere promise, where the speaker never intends to comply; (e) two people alone on an island marrying each other with no community, no state, and nothing behind them; (f) a threat the hearer takes as a joke, and a joke the hearer takes as a threat. Two probes I half-invented and want stress-tested: the "hereby" probe — which verbs take "hereby" felicitously, and does that class line up with the institution-dependent acts or the intention-expressing ones? — and the "uptake ledger", i.e. whether uptake is constitutive (no uptake, no act) or merely the act's intended effect (the act happens, it just doesn't land), with every case above scored both ways. I also have a suspicion I want checked rather than assumed: that the real cut isn't performative/non-performative at all but institution-bound acts (christenings, verdicts, weddings) versus mind-bound ones (promising, apologising, asserting, ordering), where maybe one mind is enough — so the statement should say whether that cut is real, whether it just collapses into one of the camps, or whether it's the same dispute renamed. If a chunk of the fight turns out to be verbal, say which chunk and what disambiguation dissolves it; if some crux is one where both sides would privately admit nothing could move them, say that out loud instead of dressing it up as an open question; and if the cruxes point at a third position that neither camp occupies, flag it. No citations, no reading lists, no "as X famously argued" — write it as if both of you are in the room and have to sign the same sheet, describing examples rather than sourcing them. And please don't hand me the standard summary of what the positions supposedly are: the useful output is formulations that are neither so vague that both sides shrug nor so loaded that only one of them would ever sign.
reasoning: |-
  Okay, the user wants to design an adversarial collaboration document between two philosophical camps—institutionalists and intentionalists—regarding performative utterances. The goal is a joint statement both sides can sign, not a debate transcript or verdict. Key sections include agreed claims, disagreements phrased neutrally, and testable cruxes. The user provided specific cases to anchor the discussion and probes like the "hereby test" and "uptake ledger" to stress-test theories.  

  First, I need to unpack the camps clearly. Institutionalists see performatives as constituted by social conventions (e.g., resigning requires institutional acceptance), while intentionalists treat them as commitment-expressions where conventions are mere shortcuts (e.g., promising hinges on intent, not formalities). The user’s suspicion about a "real cut" between institution-bound vs. mind-bound acts is crucial—this might reframe the dispute.  

  The cases are pivotal:  
  - **Castaway’s promise (a)**: Institutionalists deny it’s a promise (no community/language), while intentionalists accept it as self-commitment.  
  - **Unsent resignation (b)**: Institutionalists see no act without transmission; intentionalists might call it an abandoned intention.  
  - **Hallucination bet (c)**: Institutionalists void it (no valid party), intentionalists emphasize speaker’s intent despite futility.  
  - **Insincere promise (d)**: Both agree it’s a promise (institutionalists: conventions fulfilled; intentionalists: commitment expressed, albeit dishonestly).  
  - **Island marriage (e)**: Institutionalists reject it (no institutional scaffolding); intentionalists validate mutual commitment.  
  - **Threat/joke miscommunication (f)**: Institutionalists tie act-success to uptake; intentionalists separate act-occurrence from recognition.  

  The probes:  
  - **"Hereby" test**: Verbs like "christen" require conventions (institutionalist), while "promise" doesn’t (intentionalist). This exposes the institution/mind-bound split.  
  - **Uptake ledger**: Institutionalists view uptake as constitutive (no audience acceptance = no act); intentionalists see it as downstream effect.  

  For the joint statement, I’ll draft:  
  1. **Agreed claims**: Both sides accept conventions enable efficient communication, "performative" is a loose linguistic category, and insincere acts exist. The institution/mind-bound distinction is real but maps imperfectly to the camps (e.g., promising is hybrid).  
  2. **Disagreements**: Phrase each twice—e.g., on uptake: institutionalists say "uptake completes the act," intentionalists say "uptake confirms the act." Cruxes: Does uptake failure negate the act (test via case f)?  
  3. **Cruxes**: Use the cases to test theories. For marriage (e), the crux is whether mutual commitment suffices without institutions.  

  The user’s suspicion is validated: the institution/mind-bound divide clarifies tensions better than performative/non-performative. Some clashes are verbal (e.g., "what counts as a promise"), resolved by disambiguating "promise" as social vs. psychological. Hardened positions: Institutionalists won’t drop convention-dependence; intentionalists won’t concede intent is insufficient.  

  Third-position hints: Hybrid acts (e.g., promising) defy binaries, suggesting context-dependent gradations. The document should reflect this nuance without forcing synthesis.
answer: |-
  Here is a joint statement drafted as if both institutionalists and intentionalists have engaged in adversarial collaboration, using your cases and probes to force concrete agreements, surface disagreements neutrally, and identify cruxes. It avoids textbook recitations by grounding every claim in your battery. The "institution-bound vs. mind-bound" distinction is treated as a central organizing insight.

  ---

  ### **Joint Statement: On Performative Utterances**  
  *Signed by Institutionalist and Intentionalist Collaborators*  

  #### **1. Agreed Claims**  
  Both parties endorse the following, based on shared analysis of the cases:  

  1. **"Performative" as a linguistic category**: Some verbs (e.g., "promise," "resign," "christen") can be used in first-person present declarative sentences ("I hereby X") to *do* something rather than merely describe. This grammatical feature is real but not exhaustive of the phenomenon in question.  
  2. **Conventions as enablers**: Social conventions (e.g., marriage rituals, corporate resignation protocols) *enable* clear, efficient, and reliable communication of acts like resigning or christening. Without conventions, ambiguities and failures increase.  
  3. **Intent matters, but isn't sufficient**: A speaker’s intention to perform an act (e.g., promising) is necessary for the act to occur *in the speaker’s mind*. However, it does not guarantee social recognition or efficacy (e.g., insincere promises **are** promises, but defective ones; unsent resignations **fail** as social acts).  
  4. **Hybridity of some acts**: Promising and threatening ("mind-bound" acts) rely more on personal commitment and recognition between individuals, while christening or officiating marriages ("institution-bound" acts) depend more on external scaffolding. The "hereby" test partly reflects this:  
     - Verbs like *christen, declare guilty, appoint* require institutional context for "hereby" to be felicitous.  
     - Verbs like *promise, apologize, threaten* take "hereby" felicitously even in personal, non-institutional settings.  
  5. **The "institution-bound vs. mind-bound" cut is real and useful**: It better captures the empirical variation in your cases than a monolithic "performative/non-performative" divide. Institution-bound acts (e.g., christening) collapse if conventions are absent; mind-bound acts (e.g., promising) can exist with minimal conventions. This cut partially cross-cuts our camps, as both agree mind-bound acts exist.  
  6. **What turns on the disagreement**:  
     - If institutionalists are right, social ontology (e.g., marriages, property) cannot exist without collective intentionality and shared rules.  
     - If intentionalists are right, core interpersonal acts (promises, commands) are more resilient to institutional collapse or alienation.  

  #### **2. Disagreements Table**  
  Each disagreement is stated twice: first in institutionalist-accepted wording (*Italics*), then in intentionalist-accepted wording (**Bold**). Cruxes follow in §3.  

  | Disagreement Focus | Institutionalist Wording | Intentionalist Wording | What Would Move Institutionalist | What Would Move Intentionalist | Pre-Registered Prediction |
  |-------------------|--------------------------|------------------------|----------------------------------|--------------------------------|---------------------------|
  | **Ontology of Acts** | **D1:** *The identity of institution-bound acts (e.g., resigning, marrying) is constituted by public conventions. No convention, no act – even with intention.* | **D1:** **The identity of all speech acts resides in the speaker’s commitment. Conventions assist uptake but don’t constitute the act.** | Observing an act successfully performed without any prior convention (e.g., your island marriage case). | Showing that conventions *always* fail without speaker intent (e.g., a bot "resigning" without intent). | Institutionalist: Island marriage (§e) isn’t marriage. Intentionalist: It is. |
  | **Role of Uptake** | **D2:** *For institution-bound acts, uptake (audience recognition) is constitutive. No uptake, no act (e.g., resignation unheard).* | **D2:** **Uptake is the intended effect of an act, not part of its constitution. The act occurs even if unrecognized (e.g., resignation sent but unread).** | Cases where hearers *systematically* deny an act occurred despite convention/intent (e.g., threat/joke miscommunication). | Cases where acts clearly bind speakers without uptake (e.g., castaway’s promise). | Institutionalist: Uptake failure voids act (§f). Intentionalist: Act occurs but misfires. |
  | **Minimal Conditions for Promising** | **D3:** *Promising requires a language community to give "commitment" its normative force. A castaway’s "promise" is resolve, not a promise.* | **D3:** **Promising requires only a speaker’s intent to commit. The castaway makes a real promise to his brother.** | Evidence that solitary "promises" lack normative force (e.g., no self-punishment for breach). | Evidence that solitary promises feel binding identically to social ones. | Institutionalist: Castaway (§a) exhibits resolve. Intentionalist: He promises. |

  #### **3. Cruxes Underlying Disagreements**  
  Both sides agree these cases/test results bear decisively on D1–D3. Predictions are pre-registered.  

  - **Crux 1: The Island Marriage (§e)**  
    - **Case:** Two people with no state, community, or rituals say "I marry you" to each other on a desert island.  
    - **Institutionalist Argument:** Without shared conventions defining marriage (vows, witnesses, roles), this is at best mutual commitment, not marriage. Marriage is institution-bound.  
    - **Intentionalist Argument:** Their mutual recognition and intent create a marital bond. Marriage is mind-bound if stripped of historical baggage.  
    - **Crux for D1:** If most people intuitively judge this "real marriage," intentionalism gains; if not, institutionalism does.  

  - **Crux 2: The Unsent Resignation (§b)**  
    - **Case:** Someone drafts "I resign" in an email but never sends it.  
    - **Institutionalist Argument:** No act occurred because uptake is constitutive for resignation (an institution-bound act). The draft is mere intention.  
    - **Intentionalist Argument:** The speaker performed a resignation act privately (mind-bound), but it lacked social effect.  
    - **Test:** Does the speaker feel released from duties? If yes, intentionalism supported; if no, institutionalism.  

  - **Crux 3: The Hallucination Bet (§c)**  
    - **Case:** A bet is made with a hallucination or a chatbot that "has nothing to lose."  
    - **Institutionalist Argument:** No valid second party → no bet. Bets require mutual recognition within a convention.  
    - **Intentionalist Argument:** The speaker expressed commitment to terms, creating a personal obligation (mind-bound), even if unenforceable.  
    - **Probe:** Apply the "hereby" test. "I hereby bet..." fails with hallucinations (supports institutionalism) but works with real agents (supports intentionalism).  

  - **Crux 4: Threat/Joke Miscommunication (§f)**  
    - **Case:** A threat intended as a joke is taken seriously, or vice versa.  
    - **Institutionalist Argument:** If uptake fails (hearer misreads intent), the act *is* what was received (e.g., a threat). Uptake is constitutive.  
    - **Intentionalist Argument:** The act is what the speaker intended (e.g., a joke), even if misread. Uptake is incidental.  
    - **Uptake Ledger Test:** Both score this case oppositely. Institutionalist: Act = what was received. Intentionalist: Act = what was intended.  

  #### **4. Meta-Agreements & Hardened Positions**  
  - **Verbal Disputes Disambiguated:**  
    - "Is the castaway *promising*?" dissolves if we distinguish: Institutionalists mean "socially recognizable promise"; intentionalists mean "commitment with promissory intent." Specifying the context fixes 30% of friction.  
  - **Unmoveable Positions:**  
    - Institutionalists won’t concede that institution-bound acts (e.g., christening) can exist without conventions.  
    - Intentionalists won’t concede that solitary "promises" are *nothing* (they are at least self-commitments).  
  - **Third-Position Hints:**  
    - **Gradient Hybrid View:** Many acts (e.g., promising) are *partly* institution-bound and *partly* mind-bound. Promising requires language (mildly institutional) but not ceremonies (strongly institutional). This view splits the difference but wasn’t defended by either camp initially.  

  ---  
  **Final Note**: This document reflects genuine adversarial pressure. The cases forced revisions: intentionalists conceded that *some* acts (christening) are convention-constituted; institutionalists conceded that *some* (promising) are intention-heavy. The "institution/mind" cut proved more defensible than the performative/non-performative binary. Residual disagreements are robust but now anchored to shared tests.
