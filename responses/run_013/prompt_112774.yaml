prompt: |-
  You are advising a small, well-endowed political ethics institute that has committed its next three years — roughly ten researcher-years — to a single topic: the problem of dirty hands in politics. The funders do not want a literature survey. They want an agenda: a ranked set of open questions with a defence of the ranking. They also have a practical bent, since whatever the institute produces should eventually bear on how democratic institutions handle officials who do wrong in the course of serving the public.

  The steering committee has split over how to frame the topic, and that split is part of what you must address. One camp holds that the wrong an official commits stays wrong even when committing it is the right thing to do, so that the official is genuinely guilty and ought to carry that guilt; on this reading the live questions concern what we owe such officials — punishment, gratitude, both, neither — and whether their remorse is a moral requirement or a self-indulgence. A second camp holds that public office is governed by a morality of its own, so that what looks like wrongdoing from the outside is a different, role-specific standard doing its work; on this reading there may be no wrong at all, only a regrettable world, and the live questions concern how roles acquire these permissions, who is bound by them, and whether the permissions survive the move from a single officeholder to a standing bureaucracy that spreads the dirty work across many hands. A third camp holds that the official faces a genuine conflict between two obligations and cannot avoid wrongdoing whichever way they turn; on this reading the live questions are about moral dilemmas themselves — whether they exist, what they do to agency and blame, and how institutions should treat agents who are doomed to fail one way or the other.

  Give me a defended agenda rather than a survey. Which open questions in this area most deserve the institute's limited resources, and in what order? State the criteria you are using — importance, tractability, neglectedness, how many other questions depend on the answer, how quickly an answer would change practice — be explicit about the trade-offs among them, and flag where reasonable people would weight them differently. For each question near the top of your ranking, say why it is upstream of the others, what a competent researcher could realistically accomplish on it in three years, and what evidence or argument during that period would move it up or down the list. Tell me which questions in the area are overrated or do not follow from anything, and which are merely downstream of choosing among the three framings above. Finally, identify which of the institute's eventual conclusions would genuinely change institutional design — accountability rules, oversight, amnesty, whistleblower protection, transitional justice — and which would be interesting only to philosophers.
reasoning: |-
  Okay, the user is asking me to create a research agenda for a political ethics institute focused on the problem of dirty hands in politics. They want a ranked set of open questions with justifications, not a literature survey. The institute has committed ten researcher-years over three years to this topic.

  I need to address a key division within their steering committee. There are three camps with different views:
  - Camp 1 believes officials remain guilty even when doing wrong is the right thing to do
  - Camp 2 thinks public office has its own morality where apparent wrongdoing isn't actually wrong
  - Camp 3 sees genuine moral dilemmas where officials can't avoid wrongdoing

  For my approach, I'll outline clear criteria for ranking questions: importance (ethical/practical impact), tractability (feasibility to research), neglectedness (how underexplored it is), leverage (how many other questions depend on it), and actionability (potential to change practice). I'll be explicit about trade-offs - for example, a highly important question might be less tractable.

  Top questions should be upstream issues that influence downstream debates. I'll identify which questions are overrated or dependent on choosing one framing. I'll also highlight which conclusions could actually change institutional design versus those only interesting to philosophers.

  For each top question, I'll explain why it's fundamental, what researchers could accomplish in three years, and what evidence could change its priority. I'll need to be practical since the funders want work that bears on how democratic institutions handle officials who do wrong while serving the public.

  The response should be structured with a clear ranking, justifications for the order, and practical implications. I'll flag where reasonable people might weight criteria differently, especially given the committee's divisions. Finally, I'll point out which questions don't merit top priority - either because they're overrated, downstream of the framing choice, or too philosophical without practical application.
answer: |-
  Here is a defensible research agenda prioritizing open questions on "dirty hands" in politics, designed for impact on institutional design within a 3-year, 10-researcher-year constraint. The ranking balances **Importance** (practical/ethical stakes), **Tractability** (feasibility of progress in 3 years), **Neglectedness** (current lack of attention), **Leverage** (how resolving it unlocks other questions), and **Actionability** (potential to directly inform institutional reform). Trade-offs are inevitable: *Importance* often conflicts with *Tractability* (deep philosophical issues are hard but crucial); *Neglectedness* can conflict with *Tractability* (unexplored terrain is riskier); *Leverage* favors foundational questions but may delay *Actionability*.

  **Weighting & Trade-offs:** I prioritize **Leverage** and **Actionability** highest, as the funders demand practical bearing on institutions and the committee split suggests upstream framing issues block progress. *Importance* is a baseline requirement. *Tractability* is weighted moderately – ambitious but realistic progress is needed. *Neglectedness* is a tiebreaker. *A Camp 1 advocate might weight Importance (specifically guilt/blame) higher; a Camp 2 advocate might weight Tractability (role-specific standards) higher; a Camp 3 advocate might prioritize Importance (dilemma existence).*

  ### Ranked Research Agenda (Top 5)

  1.  **What is the Source and Scope of Role-Based Permissions/Obligations in Public Office?**
      *   **Why Top?** **Leverage:** This is *the* upstream question. Progress here directly determines which camp's framing is most viable and shapes answers to all others (guilt, dilemmas, blame, institutional response). Camp 2 hinges on it, but Camps 1 & 3 must also engage (e.g., Can roles *create* obligations that conflict with ordinary morality? Can they *suspend* ordinary morality?). **Actionability:** Defining the legitimate scope of "role morality" is essential for designing accountability rules (e.g., when should "I was just doing my job" be a valid defense?), oversight mandates, and whistleblower protections. **Importance:** Gets to the core of political legitimacy and official power. **Tractability:** Can combine conceptual analysis (e.g., contractarian vs. constitutive theories of roles) with comparative institutional analysis (e.g., how different legal systems define "scope of employment" or "discretion" for officials) and empirical work on public/official expectations of roles. **Neglectedness:** While role morality is discussed, its *source* and precise *limits* (especially regarding *prima facie* wrongful acts) remain contested and underexplored empirically.
      *   **3-Year Goal:** Develop a typology of sources (legal mandate, public trust, functional necessity, etc.) and a defensible framework for *limiting* role permissions (e.g., absolute prohibitions, proportionality tests). Produce case studies demonstrating where existing institutional designs implicitly rely on conflicting assumptions about role morality.
      *   **What Moves It?** *Up:* Discovery of robust cross-cultural/institutional patterns supporting a specific source/limit theory. *Down:* Consensus that role morality is entirely derivative of ordinary morality or hopelessly relativistic.

  2.  **Under What Conditions (If Any) Can the "Moral Burden" of Dirty-Hands Acts Be Distributed or Mitigated Within Institutions?**
      *   **Why Here?** **Leverage & Actionability:** Directly addresses Camp 2's concern about bureaucracies and Camp 1/3's concern about individual guilt. Answers determine if blame/punishment/remorse can be shared, mitigated by process, or dissolved by structure – crucial for institutional design. **Importance:** Modern governance is bureaucratic; individualistic "tragic hero" models are often inadequate. **Tractability:** Amenable to institutional analysis (e.g., chain of command, committee decisions, specialized units), historical case studies (e.g., intelligence oversight committees, war cabinets), and conceptual work on collective agency/responsibility. **Neglectedness:** Focus often remains on the individual official; systemic/institutional mitigation is less explored.
      *   **3-Year Goal:** Identify institutional mechanisms (e.g., rigorous authorization processes, multi-layered review, transparency protocols) that demonstrably alter the moral burden on individuals. Develop criteria for when burden distribution is legitimate vs. mere scapegoating or diffusion. Propose concrete institutional "burden-sharing" designs.
      *   **What Moves It?** *Up:* Evidence that specific mechanisms reliably reduce *justified* feelings of guilt or public blame without enabling wrongdoing. *Down:* Strong arguments that moral burden is inherently non-transferable regardless of process.

  3.  **What Constitutes Appropriate Remorse (or Lack Thereof) in Officials Post-Dirty-Hands Action, and What Institutional Responses Does This Trigger?**
      *   **Why Here?** **Actionability:** Directly informs accountability practices (hearings, apologies, sanctions), potential amnesty/forgiveness processes, and public trust dynamics. **Leverage:** Bridges Camps 1 (remorse as essential), 2 (remorse as potentially inappropriate for role), and 3 (remorse as tragic residue). **Importance:** Relates to societal healing, official rehabilitation, and preventing cynicism. **Tractability:** Can analyze historical examples of apologies/responses, psychological studies on guilt/perception, public opinion data on trust, and normative theories of emotion and blame. **Neglectedness:** While remorse is discussed, its *institutional implications* are underdeveloped.
      *   **3-Year Goal:** Develop a framework distinguishing performative remorse, authentic guilt, appropriate role detachment, and dangerous psychopathy. Propose institutional practices (e.g., truth commissions, restorative justice panels, therapy provisions) calibrated to different types of remorseful/non-remorseful responses. Assess impact on public trust.
      *   **What Moves It?** *Up:* Evidence linking specific types of remorse/institutional response to positive democratic outcomes (reduced polarization, increased trust). *Down:* Consensus that remorse is purely private or always performative/politicized.

  4.  **Do Genuine, Unresolvable Moral Dilemmas Exist for Public Officials? If So, What Does This Imply for Blame and Institutional Design?**
      *   **Why Here?** **Leverage:** Central to Camp 3's framing; challenges Camp 1 (if no dilemma, guilt is clearer) and Camp 2 (if dilemma exists, role morality may not dissolve it). **Importance:** If dilemmas exist, standard blame/punishment models may be unjust. **Actionability:** Affirms need for "tragedy-acknowledging" institutions (e.g., qualified amnesty, symbolic reparations, non-punitive accountability). **Tractability:** Primarily conceptual/philosophical but can be tested against hard cases (e.g., ticking bomb, famine relief corruption) and historical precedents. **Neglectedness:** Practical institutional implications of accepting dilemmas are underexplored.
      *   **3-Year Goal:** Rigorously define criteria for a genuine dilemma in politics. Map the conceptual landscape: if dilemmas exist, what forms of institutional response (if any) are justifiable? Develop "dilemma-aware" accountability protocols.
      *   **What Moves It?** *Up:* Strong consensus on a clear, real-world example of a genuine dilemma; compelling arguments linking dilemma-acceptance to specific institutional reforms. *Down:* Widespread rejection of dilemma possibility; lack of actionable institutional insights derived from dilemma theory.

  5.  **How Do Democratic Institutions Legitimately Authorize *Ex Ante* the *Possibility* of Dirty-Hands Acts (e.g., via Oversight, Laws, Vague Mandates)?**
      *   **Why Here?** **Actionability:** Directly targets institutional design – laws, oversight bodies, emergency powers, whistleblower systems. **Importance:** Prevention and legitimate authorization are better than managing aftermath. **Tractability:** Comparative analysis of constitutional provisions, emergency laws, intelligence oversight statutes, and legislative debates. Normative analysis of democratic consent for potential wrongdoing. **Leverage:** Connects role permissions (Q1) to concrete mechanisms. **Neglectedness:* Less discussed than *ex post* responses.
      *   **3-Year Goal:** Evaluate existing *ex ante* authorization mechanisms (e.g., FISA courts, parliamentary security committees) for legitimacy and effectiveness in constraining/minimizing dirty hands. Propose improved designs for democratic authorization of necessary evils.
      *   **What Moves It?** *Up:* Identification of effective *ex ante* mechanisms that reduce actual harm/injustice. *Down:* Evidence that *ex ante* authorization invariably enables abuse or is democratically illegitimate.

  ### Overrated/Downstream/Philosophy-Only Questions

  *   **Overrated:** "Do dirty hands situations *really* exist?" (Often a semantic diversion; focus should be on *how* they manifest and are handled). "Is utilitarianism the correct framework?" (Overly broad; specific institutional questions matter more).
  *   **Downstream of Framing Choice:** Questions like "Should remorse be required?" (depends on Camp 1 vs 2), "Is the official blameworthy?" (depends on all camps), "How do roles acquire permissions?" (central to Camp 2, derivative for others). *This is why Q1 is paramount.*
  *   **Primarily Philosophical (Lower Priority):** Deep meta-ethical debates about moral realism/anti-realism as applied to DH; highly abstract discussions of "the nature of agency" in dilemmas without institutional links; exhaustive taxonomies of dilemma types without practical import.

  ### Impact on Institutional Design

  *   **High Impact Conclusions:** Findings from Q1 (Role Permissions Scope) directly inform: **Accountability Rules** (What counts as a valid defense? What standard applies?), **Oversight Design** (What are overseers *allowed* to permit/disallow?), **Whistleblower Protection** (When is exposing a "role-permitted" act justified?). Findings from Q2 (Burden Distribution) inform **Bureaucratic Structure & Process Design** (How to assign tasks/review to mitigate individual burden?), **Collective Punishment/Reward Systems**. Findings from Q3 (Remorse) inform **Amnesty/Forgiveness Processes**, **Public Truth-Telling Mechanisms**, **Sanction Severity Calibration**. Findings from Q5 (*Ex Ante* Authorization) inform **Emergency Powers Laws**, **Intelligence Oversight Bodies**, **Legislative Mandates**.
  *   **Limited Practical Impact (Primarily Philosophical):** Proving/refuting the *existence* of dilemmas (Q4) *unless* tied to specific institutional responses; highly abstract accounts of the *metaphysics* of guilt; debates focused solely on individual conscience without institutional context.

  This agenda prioritizes questions that cut across the committee's divisions, target the foundational issue (role morality), and offer the clearest path to actionable insights for democratic institutions grappling with the inevitable moral costs of governance. It balances ambition with realism for a 3-year horizon.
