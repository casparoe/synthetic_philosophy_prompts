prompt: |-
  Bit of an odd request — I'm a third-year PhD in ethics/political theory and I've gotten into a running arguement with a friend in my cohort who works on distributive justice. She's sharper than me and I usually lose, so I want a second opinion before I go back at her. Her gloss on prioritarianism goes like this:

  'Prioritarianism is the view that we give extra weight to the interests of the worse off — the worse off always come first, no matter how big the gains to anyone else. So it's egalitarianism with a new name; prioritarians just won't say the word equality out loud because it's unfashionable. And it inherits egalitarianism's fatal flaw, the leveling-down objection: if what matters is the gap, then a world where everyone is equally poor is better than a world where the poor are a bit better off and the rich are much better off, so prioritarianism would have us burn the rich people's money even when nobody gains by it. Nobody believes that, so the view is dead — and the fact that prioritarians have been chewing on this objection for thirty years is basically an admission.'

  Something about this is off and I can't articulate what, and honestly I've never been able to see why the priority view is supposed to be a genuine third option rather than egalitarianism in disguise (I know the distinction is meant to be Parfit's, which is part of what's bugging me). Take her paragraph apart sentence by sentence and tell me what's right, what's a fair simplification, and what's backwards — and then, separately, tell me whether the priority view has a real problem in this neighbourhood once the summary is corrected, rather than just concluding she's wrong and moving on. Say how confident you are at each step and single out the point you're least sure about; I'd rather see where you're hedging than get a smooth answer.
