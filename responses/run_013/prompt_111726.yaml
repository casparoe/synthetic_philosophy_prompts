prompt: |-
  I serve as senior staff to the ethics committee of a state legislature, and part of my job is to field requests from members and their staffs to bless some exception to the ordinary rules -- a bit of surveillance, a promise quietly broken, a favor traded with a regulator, a confidential file shown to the wrong person -- where the justification offered is always that it is necessary to prevent something worse. I did graduate work in political theory before this job, so I know the shape of the problem of dirty hands and I find it genuinely clarifying, but the literature I remember is mostly concerned with whether a politician can remain morally clean, or with whether the problem is real at all, and none of it has given me anything I can run. What I want from you is a decision procedure my committee can actually apply.

  Please write it as a checklist in prose: the questions to ask in order, what counts as a sufficient answer to each, where the procedure stops with a flat no, and where it hands the decision to a person because the question has become one of values rather than facts. The procedure has to be runnable in about ninety minutes by committee staff who have no philosophical training, it has to say what to do when we cannot get the facts we would need, and it has to be honest about which steps are judgment calls dressed up as mechanics. I would rather have a shorter procedure with the soft joints clearly marked than a longer one that pretends to be an algorithm. I also want it to distinguish, as sharply as the material allows, the case where someone really is choosing between two genuine moral costs and the case where a cost is being manufactured or shifted onto someone else to spare the decision-maker. Where your procedure rests on a specific thinker's distinction, say so in a sentence rather than gesturing at a school, and flag the points where you are improvising rather than drawing on anything written.

  Then run it on three requests, one of which is a real case from last session and two of which I have invented to stress it. (a) A committee chair proposes to trade an informal assurance about a future funding bill to a regulator in exchange for expediting a permit; the permit matters enormously to a single constituent, and the assurance is not something the chair can actually deliver. (b) A member asks us to sanction surveillance of a small advocacy group whose two most vocal members are suspected of planning violence at a hearing; our evidence is real but thin. (c) A member wants to withhold from a criminal defendant's lawyer a document that would help the defense, on the ground that releasing it exposes a source and ends an operation aimed at a serious crime. For at least one of these I expect the procedure to give an answer I will not like, and I would like you to say plainly which one that is. Finish by telling me what the procedure cannot do, and what kind of case should never be brought to it at all.
reasoning: |-
  Okay, I need to really understand what this user is asking for. They're a senior staffer for a state legislature's ethics committee, dealing with requests that often involve "dirty hands" scenarios—situations where politicians justify breaking rules to prevent worse outcomes. The user has a background in political theory but finds existing literature too abstract. They want a practical, executable decision procedure in checklist form.

  The user's explicit needs are clear: a step-by-step procedure that non-philosophers can run in 90 minutes, with clear stopping points, handling of missing facts, and transparency about judgment calls. But reading deeper, I sense frustration—they're tired of theoretical debates about moral cleanliness and need concrete tools. The emphasis on distinguishing genuine moral trade-offs from manufactured costs suggests they've seen bad-faith justifications. They're likely under pressure to provide consistent, defensible rulings.

  Hmm, the three test cases are revealing. Case (a) involves deception (unenforceable promise), (b) balances security vs. civil liberties with weak evidence, and (c) pits due process against law enforcement—all classic tensions. The user expects one outcome to be unpopular, which tells me they value intellectual honesty over comfort. Their closing request about the procedure's limits shows pragmatism; they know no tool is universal.

  For the procedure structure, I'm thinking like an emergency protocol: sequential filters where failure at any step ends the review. Key influences: Weber's "ethic of responsibility" (step 3), Shue's necessity criteria (step 4), and Nagel's "absolutism" (step 6). But I'll flag where I deviate, like step 5's "manufactured cost" test—that's my synthesis from real-world ethics failures.

  The test cases will stress-test it. Case (a) should fail early (step 1—deception isn't truly rule-breaking? Wait, no: promising undeliverable assurances violates transparency norms). Case (b) might clear steps 1-4 but stumble at step 6 (surveillance disproportionate). Case (c) is toughest; step 5 exposes how the "cost" to the investigation is shifted to the defendant. That's probably the disliked outcome—sacrificing a fair trial feels gross, even if logically consistent.

  Limitations matter. The procedure can't handle systemic corruption or "ends justify means" mentalities. It's for edge cases, not wholesale rule abandonment. Also, it assumes good faith—if a requester lies, the checklist won't save them.

  ...Better start drafting. Prose checklist first, then apply ruthlessly.
answer: |-
  Here is a decision procedure designed for your committee's operational reality. It draws primarily on Michael Walzer's "dirty hands" framework, Henry Shue's work on necessity, Bernard Williams' critique of utilitarianism, and Thomas Nagel's absolutism, with noted improvisations. The procedure assumes good faith initial review by staff to weed out blatant rule violations without plausible justification.

  **Ethics Committee "Dirty Hands" Evaluation Protocol**

  **Principle:** An exception to core ethical rules (honesty, fairness, due process, confidentiality) is permissible *only* when absolutely necessary to prevent a significantly greater, imminent, and concrete harm, and no morally preferable alternative exists. The moral cost *must* be borne directly by the decision-maker accepting responsibility.

  **Procedure (Sequential - Failure at any step ends review with "No"):**

  1.  **Define the Rule-Breaking & Core Values:** "What specific ethical rule(s) would this action violate? Which core legislative values (e.g., honesty, fairness, due process, public trust, equal protection, institutional integrity) does this rule protect?" *[Sufficient Answer]:* A clear identification of the breached rule(s) and the specific values undermined. *[Stop if]:* The action violates a core constitutional principle or a bright-line legal prohibition (e.g., bribery statutes). *[Judgment Call]:* Defining "core values" – staff must reference committee precedents or state ethics code.
  2.  **Define the Alleged Greater Harm:** "What specific, concrete harm is this action claimed to prevent? How is it significantly worse than the harm caused by breaking the rule?" *[Sufficient Answer]:* A description of the harm that is specific (who/what is harmed?), concrete (not speculative), significantly worse (e.g., physical danger vs. procedural delay; systemic injustice vs. political embarrassment), and imminent (likely to occur soon without intervention). *[Stop if]:* The alleged harm is vague, speculative, primarily political (e.g., losing an election), or not demonstrably worse than the rule-breaking harm. *[Judgment Call]:* Assessing "significantly worse" – requires comparing incommensurable values (e.g., safety vs. privacy). Staff must document rationale.
  3.  **Establish Causal Necessity (Walzer/Shue):** "Is breaking *this specific rule* demonstrably necessary to prevent the greater harm? Could the harm be prevented by acting within the rules, even if less efficiently or conveniently?" *[Sufficient Answer]:* Evidence showing that lawful/ethical alternatives are genuinely unavailable or demonstrably ineffective in *this specific situation* to prevent the imminent harm. The rule-breaking must be the *only* feasible path. *[Stop if]:* Lawful alternatives exist, even if slower, harder, or less certain. *[Judgment Call]:* Evaluating feasibility and effectiveness of alternatives. Requires practical reasoning.
  4.  **Establish Imminence & Specificity:** "Is the greater harm likely to occur *soon* if we do nothing? Is the threat specific and identifiable, not just a general risk?" *[Sufficient Answer]:* Credible evidence (intelligence, specific threats, documented patterns) showing a high probability of the harm materializing in the near future absent this specific action. *[Stop if]:* Harm is remote, hypothetical, or based on generalized fear. *[Judgment Call]:* Assessing probability and timeframe – staff must cite sources and note uncertainty.
  5.  **Interrogate Cost-Shifting/Manufacture (Williams/Improvisation):** "Is the 'cost' of *not* breaking the rule actually a cost being unfairly shifted onto others to spare the decision-maker or their allies discomfort? Was the 'necessity' manufactured by prior bad choices or failures (e.g., poor planning, ignoring warnings)?" *[Sufficient Answer]:* A demonstration that the burden of preventing the harm falls appropriately where responsibility lies, and the dilemma wasn't created recklessly or to avoid accountability. *[Stop if]:* The "necessity" arises from shifting a burden unfairly onto vulnerable parties (e.g., denying due process to an individual to cover institutional failure) or stems from culpable negligence. *[Judgment Call]:* Highly interpretive. Requires probing the history and who truly bears the cost of *both* action and inaction. **Flag: Core distinction point between genuine dirty hands and bad faith.**
  6.  **Assess Proportionality & Minimal Intrusion (Nagel/Shue):** "Is the rule-breaking action the *least* intrusive/damaging means possible to achieve the necessary end? Is the severity of the rule-breaking proportionate to the harm prevented?" *[Sufficient Answer]:* Evidence that milder alternatives (even if still rule-bending) were considered/rejected for solid reasons, and the chosen method inflicts the smallest possible moral cost. The harm prevented must *significantly* outweigh the harm caused. *[Stop if]:* The action is gratuitously harmful, broader than necessary, or disproportionate (e.g., mass surveillance for a minor threat). *[Judgment Call]:* Weighing incommensurable harms. Staff must articulate the calculus.
  7.  **Verify Transparency & Accountability (Walzer):** "Can this action be disclosed publicly *after* the fact? Is the decision-maker prepared to accept full personal responsibility and potential consequences (e.g., censure, electoral defeat) for breaking the rule?" *[Sufficient Answer]:* A plausible plan for eventual disclosure (even if delayed for operational reasons) and a clear commitment from the requester to bear responsibility. *[Stop if]:* The action *must* remain permanently secret to "work" or the requester seeks immunity from accountability. *[Judgment Call]:* Assessing feasibility of future disclosure and sincerity of accountability acceptance.
  8.  **Acknowledge the Moral Cost (Walzer):** "Does the requester explicitly acknowledge that this act is morally wrong, even if necessary, and that it incurs a personal moral debt?" *[Sufficient Answer]:* An explicit, on-record statement from the requester acknowledging the ethical violation and its personal moral weight. *[Stop if]:* The requester insists the action is "clean" or justified in a way that erases the moral wrong. *[Judgment Call]:* Gauging sincerity, but the *statement itself* is required.

  **Handling Missing Facts:** If critical information for Steps 2, 3, 4, or 6 is unavailable within the timeframe and cannot be reasonably inferred:
  *   **For Steps 2/4 (Harm):** Presume the harm is not sufficiently concrete/imminent. **Result: Stop, No.**
  *   **For Steps 3/6 (Necessity/Proportionality):** Presume lawful alternatives exist or the action is disproportionate. **Result: Stop, No.**

  **Applying the Protocol to Test Cases:**

  **(a) Permit Expediting via Undeliverable Assurance:**
  1.  Breaches: Honesty (false promise), Fairness (undue influence), Institutional Integrity (corrupt trade). Values: Trust, Fair Process.
  2.  Harm Prevented? Constituent hardship (significant but likely not catastrophic/irreversible).
  3.  Necessity? **Stop, No.** Lawful alternatives exist: Chair could advocate formally through official channels, seek public pressure on regulator, or help constituent navigate process. Breaking honesty rules isn't *necessary*.
  4.  *(N/A - Stopped at 3)*
  5.  *(N/A)* **Manufactured Cost?** Likely shifting burden of chair's lack of influence onto truthfulness/process integrity.
  6.  *(N/A)*
  7.  *(N/A)*
  8.  *(N/A)* **Result: DENIED.**

  **(b) Surveillance of Advocacy Group (Thin Evidence):**
  1.  Breaches: Privacy, Freedom of Association, Due Process. Values: Civil Liberties, Rule of Law.
  2.  Harm Prevented? Potential violence at hearing (serious, concrete harm).
  3.  Necessity? *Questionable.* Can security be increased via overt means? Can specific individuals be monitored via lawful warrants if evidence exists? Thin evidence weakens necessity claim.
  4.  Imminence/Specificity? Thin evidence challenges this. "Suspected planning" is vague. Requires assessment of source credibility. **High Judgment Call on evidence weight.**
  5.  Cost-Shifting? Surveillance shifts burden of security onto innocent members' rights based on association and thin suspicion. **Risk of unfair shift.**
  6.  Proportionality/Minimal Intrusion? Targeting the whole group is likely disproportionate and not minimal if only 2 individuals are suspects. **Stop, No.** Action is overbroad. Surveillance of a group based on thin evidence of 2 members is disproportionate to the threat level (unless evidence suggests group-wide conspiracy).
  7.  *(N/A - Stopped at 6)*
  8.  *(N/A)* **Result: DENIED.** (Thin evidence fails Step 4/necessity, overbreadth fails Step 6).

  **(c) Withholding Exculpatory Document (Protect Source/Operation):**
  1.  Breaches: Due Process (Brady violation), Fairness. Values: Fair Trial, Justice.
  2.  Harm Prevented? Endangering source, collapsing major investigation into serious crime (very serious, concrete harm).
  3.  Necessity? *Plausible.* If revealing the document *directly and unavoidably* exposes the source and ends the operation, lawful alternatives (e.g., redaction, judge's in-camera review) may be impossible. **Judgment Call:** Is exposure truly unavoidable? Requires expert input.
  4.  Imminence/Specificity? Harm to source/investigation is specific and imminent upon disclosure.
  5.  **Cost-Shifting/Manufacture? CRITICAL STEP.** The "cost" of not withholding (failed operation) is being shifted *entirely* onto the defendant's right to a fair trial. The state created the dilemma by using a source/method that now conflicts with justice. **Major Judgment Call:** Is this shifting a fundamental burden unfairly? (Likely: Yes).
  6.  Proportionality? Withholding evidence that could exonerate someone is an extreme violation. Does preventing the collapse of *this specific* operation outweigh potentially imprisoning an innocent person? **Extreme Judgment Call:** Values clash profoundly (Justice vs. Security). Nagel might argue this is an absolute prohibition.
  7.  Transparency/Accountability? Almost certainly requires permanent secrecy. Decision-maker unlikely to accept *personal* legal consequences (prosecution for Brady violation). **Stop, No.** Permanent secrecy and avoidance of legal accountability fail Step 7.
  8.  *(N/A)* **Result: DENIED.** (Fails Step 5 - Unfair Shifting, and Step 7 - Secrecy/Accountability). **This is the answer you likely dislike.** The procedure prioritizes fundamental due process (an absolute for Nagel, a core value where shifting cost is intolerable for Williams) over investigative continuity, demanding accountability that cannot realistically be met.

  **What the Procedure Cannot Do:**

  1.  **Resolve Deep Value Conflicts:** When Steps 5, 6, or 7 become central (e.g., sacrificing one fundamental right for another), the procedure forces a "No" or highlights the irreconcilable conflict for the *committee* to decide, not staff. It doesn't magically solve these.
  2.  **Ensure Good Faith:** It assumes requesters provide honest information. If they lie (especially about necessity or alternatives), the procedure fails.
  3.  **Handle Systemic Corruption:** It's designed for discrete "dirty hands" dilemmas, not pervasive institutional rot where rule-breaking is the norm.
  4.  **Predict the Future:** Assessments of imminence, necessity, and proportionality involve unavoidable uncertainty. It demands evidence but can't guarantee predictions are correct.
  5.  **Absolve Guilt:** It facilitates a *permissible* exception, not a *morally clean* one. The actor remains morally compromised (Walzer).
  6.  **Replace Legal Advice:** It doesn't determine legality, only ethical permissibility within the committee's mandate. Legal counsel must review independently.

  **Cases Never to Bring to this Procedure:**

  1.  **Blatant Self-Interest:** Requests primarily benefiting the member politically or financially under a thin guise of necessity.
  2.  **Punitive Actions:** Using "prevention" as cover for retaliation or silencing dissent.
  3.  **Violations of Absolute Prohibitions:** Actions involving torture, summary execution, or other universally condemned acts (Walzer/Nagel). These are never permissible.
  4.  **Routine Rule-Bending:** Situations lacking a genuine, significant, imminent harm that necessitates breaking core rules. Use standard ethics review instead.
  5.  **"The Ends Justify the Means":** Requests where the decision-maker explicitly rejects the inherent wrongness of the action itself (fails Step 8).

  This procedure forces rigorous justification, exposes bad faith and cost-shifting, protects fundamental rights where possible, and demands accountability for the moral stain of necessary wrongs. It won't make the decisions easy, but it should make them more transparent and defensible.
