answer: |-
  ### Seminar Plan: Pain Asymbolia and the Badness of Pain  
  *(Sequence: 6 Steps for 90 Minutes)*  

  1.  **Grounding the Core Question (10 min)**  
      *State:* "Today’s goal: Does pain asymbolia show *why* pain is bad? Not 'what pain is' (sensation vs. brain state) or 'how nociception works'."  
      *Distinguish:* **What pain *is*** (ontology: physical/neural basis) **vs. Why pain *is bad*** (normativity: source of its aversiveness). *Stress:* We assume pain is *usually* bad; we ask *what makes it so*.  

  2.  **Dissecting Pain’s Components (15 min)**  
      *Define using IASP framework:*  
      - **Sensory-Discriminative:** Intensity, location, quality (e.g., burning).  
      - **Affective-Motivational:** Unpleasantness, aversion, urge to escape.  
      *Key Point:* These *can* dissociate. "Affective dimension" ≠ emotion *about* pain; it’s part of the pain experience itself.  

  3.  **Separating Badness from Sensation (10 min)**  
      *Pose two hypotheses:*  
      - **(A) Intrinsic Badness:** Pain’s felt quality *itself* is inherently unpleasant/bad.  
      - **(B) Consequent Motivation:** Pain is bad *because* it generates aversion/desire to stop.  
      *Crucial:* Asymbolia tests (A) vs. (B). Must establish this dichotomy *before* introducing cases.  

  4.  **Introducing Asymbolia & Its Prerequisites (15 min)**  
      *Define:* Asymbolia = *Intact sensory pain report + Correct localization + Absent withdrawal/aversion*.  
      *Prerequisites for the case to work:*  
      - Affective component ≠ "emotion added later"; it’s dissociable from sensation.  
      - "Badness" ≠ just judging harm exists; it’s the *experience* of unpleasantness.  
      *Defuse Philosopher Collapse Here:* "If the patient reports ‘pain’ *accurately* (sensory), calls it 'pain', but lacks aversion, we *must* take the report seriously. Denying it’s pain *assumes* aversion is essential—precisely what we’re testing!"  

  5.  **The Carrying Case: Real Asymbolic Patient (20 min)**  
      *Winner:* **Actual patient case** (e.g., classic descriptions from Schilder & Stengel or Berthier et al.).  
      *Why it wins:*  
      - **Must Have:** Unambiguous sensory report ("I feel sharp pain in my hand"), correct localization, no withdrawal, no distress, no cognitive impairment (e.g., understands "pain" concept).  
      - **Must Not Have:** Reduced pain *intensity* description, general apathy (anhedonia), or altered consciousness.  
      *Why rivals fail:*  
      - *Thought Experiment:* Invites "imagination failure" objections; lacks clinical reality.  
      - *Different Lesion (e.g., SII lesion with degraded sensation):* Doesn’t isolate affect; confounds sensory loss with affective dissociation.  
      *Defuse Resident Reductionism Here:* "The lesion (e.g., insular lesion) *enables* the dissociation, but the *philosophical work* is in what the dissociation *shows* about pain’s structure, not just localization."  

  6.  **Interpreting Asymbolia: Badness & Significance (15 min)**  
      *The Lesson:* Asymbolia suggests pain’s *badness* lies in its affective-motivational component, not its sensory quality. If sensation were intrinsically bad, removing aversion shouldn’t leave "pain".  
      *Clarify "Asymbolia":* It’s **failure of affective response** (unpleasantness/aversion is missing), NOT primarily "loss of significance" (which could be cognitive). Significance *follows* affect.  
      *Implication for (A) vs. (B):* Undermines (A) Intrinsic Badness; supports (B) Badness via generated aversion.  
      *Closing Question:* **"Could an asymbolic patient’s experience (sensation without aversion) still be *bad*? If not, *why not*—and what does that tell us about why normal pain *is* bad?"**  
      *(Tests understanding: If sensation isn’t bad without aversion, aversion likely makes it bad.)*  

  ---

  ### Omissions (Flag Early & Reiterate)  
  - **Consciousness debates:** Is asymbolic "pain" truly conscious? (Assume standard clinical reports are valid).  
  - **Lesion specificity debates:** Exact neural substrates are evolving; we use asymbolia *phenomenologically*.  
  - **Alternative theories of pain’s badness** (e.g., representationalism). Stick to (A) vs. (B).  

  ### Misconception Management  
  - **"No aversion = Not pain" (Philosophers):** Defused at Step 4 using patient report validity.  
  - **"Just a lesion finding" (Residents):** Defused at Step 5 by linking dissociation to the (A)/(B) distinction.  
  - **"Affect vs. Significance confusion":** Clarified at Step 6; affect is necessary for motivational significance.  

  **Time Buffer:** Save 5 min for closing question discussion. Sequence ensures philosophy drives the clinical data, not vice-versa.
