  ## OFFERING MEMORANDUM: PUBLIC LABOUR NOTES (PLN)

  **Issuer:** The Publick Bank of Industria (the "Bank", "we", "us", "our")
  **Instrument:** Public Labour Notes (the "Notes", "Counters", "PLN")
  **Denominations:** PLN 1, PLN 5, PLN 10, PLN 50, PLN 100
  **Offering:** Perpetual, ongoing issuance at the discretion of the Bank
  **Date:** [Current Date]

  **COVER SUMMARY**

  This Offering Memorandum describes the issuance and nature of Public Labour Notes ("Notes" or "PLN") by The Publick Bank of Industria (the "Bank"). The Notes are instruments of credit designed solely to facilitate the circulation of value within the jurisdiction served by the Bank.

  1.  **Nature of the Instrument:** The Notes are tangible tokens (paper, or other agreed material) functioning as Counters. They constitute entries in a public register for the purpose of reckoning, recording, and transferring obligations arising from Industry. They possess no intrinsic value and are not commodities, standards of measure, or pledges of specific bullion or other tangible assets. Their sole utility lies in their capacity to be transferred as tokens signifying a claim upon future Industry.
  2.  **Backing:** The value ascribed to the Notes derives entirely from the present and future Industry of the People within the Bank's jurisdiction, being the application of human labour to the four elements (earth, air, fire, water). The security of the Notes rests upon the collective Industry and the stable governance facilitating it, not upon any reserve of specie.
  3.  **Purpose:** The Notes are issued to "stir up Industry" by providing a fluid medium for the circulation of credit. It is the Bank's position that the true Wealth of the Nation resides in its Industry, and that such Wealth is proportioned to the circulation of credit, regardless of the physical token used. The Notes aim to ensure that every member of the community has power (understood as the capacity to command the necessaries and conveniences of life) according to their Industry.
  4.  **Redemption:** Notes are not redeemable in gold, silver, or any specific commodity. Their "redemption" is effected through their acceptance in exchange for goods and services produced by Industry. The Bank provides no guarantee of conversion into any other asset beyond this functional acceptance within the community's economic sphere.
  5.  **Circulation Imperative:** The utility of the Notes is contingent upon their circulation. Hoarding is antithetical to their purpose and diminishes the collective Wealth by stifling Industry. Mechanisms may be instituted to discourage prolonged inactivity of Notes (see Clause 7).

  **DEFINED TERMS**

  1.  **Bank:** The Publick Bank of Industria, the Issuer.
  2.  **Bearer:** The lawful possessor of a Note.
  3.  **Counter:** The physical token (Note) representing an entry in the public register of obligations. Its value is purely relational, defined by its exchangeability for the products of Industry.
  4.  **Four Elements:** Earth, air, fire, water; the primary materials upon which human labour acts to generate Wealth.
  5.  **Industry:** The application of human labour to the Four Elements, resulting in goods and services constituting the true Wealth of the Nation.
  6.  **Notes / PLN:** Public Labour Notes issued by the Bank.
  7.  **People:** The collective body of inhabitants within the Bank's jurisdiction whose Industry forms the basis of the Note's credit.
  8.  **Power:** The capacity of an individual to command the necessaries and conveniences of life, proportionate to their Industry.
  9.  **Idle Rich:** Persons holding significant counters without proportionate contribution to Industry, potentially hindering circulation and diminishing collective Power.
  10. **Wealth:** The aggregate goods and services produced by the Industry of the People. Distinct from the quantity of Notes in circulation.

  **NUMBERED CLAUSES**

  1.  **Nature of PLN:** PLN are tickets or counters. They are not money in the sense of being a commodity with intrinsic value, nor are they a fixed standard or measure. They are tokens for recording and transferring value arising from Industry.
  2.  **Source of Value:** The value represented by a PLN arises solely from the expectation of future Industry of the People. It is a relational value, signifying a proportional claim on the future output of goods and services. The elements of earth, air, fire, and water, combined with human labour, are the sole origin of the Wealth upon which this value depends.
  3.  **Absence of Metallic Backing:** No reserve of gold, silver, or other precious metal backs the PLN. The continued functionality of the PLN denominations is independent of the existence of such bullion. Confidence in the PLN rests on confidence in the Industry and governance of the People.
  4.  **Purpose of Issuance:** Notes are issued by the Bank to stimulate Industry. The volume of issuance shall be calibrated (at the Bank's sole discretion) to maintain sufficient circulation of credit to maximize productive activity, thereby increasing the Wealth and Power of the Nation. We reject the notion that money is wealth; it is a means to facilitate the creation of wealth (Industry).
  5.  **Redemption Mechanism:** PLN are redeemed *functionally* through their acceptance in exchange for the products of Industry within the community. The Bank undertakes no obligation to redeem Notes in specie or any specific commodity. The obligation represented by a PLN is to the collective Industry, not to the Bank's assets.
  6.  **Power and Industry:** The Bank's objective is a state wherein each member possesses Power according to their Industry. The PLN system is designed to facilitate this proportionality by linking the medium of exchange directly to the source of value (Industry) and ensuring its circulation.
  7.  **Circulation and Hoarding:** The utility of the PLN system is maximized when Notes circulate frequently, "stirring up Industry". Prolonged hoarding of Notes is detrimental to this purpose and diminishes collective Power. The Bank reserves the right to implement mechanisms (such as demurrage fees or expiry periods, detailed in supplementary regulations) to actively discourage hoarding and incentivize circulation. The Idle Rich, holding Notes without corresponding Industry, present a specific risk to circulation (see Risk Factors).
  8.  **Transferability:** Notes are freely transferable by delivery to any Bearer within the jurisdiction. Acceptance by any party is voluntary but constitutes recognition of the Counter's function.

  **SCHEDULE A: RISK FACTORS**

  Potential Subscribers should carefully consider the following inherent risks associated with Public Labour Notes:

  1.  **Confidence Risk:** As the PLN is a token backed solely by confidence in the future Industry of the People and the stability of governance, any significant lapse in this confidence (due to political upheaval, perceived decline in work ethic, external threat, or philosophical rejection of the token theory) could render the Notes inert or significantly devalue them. The arbitrary nature of the sign means confidence is its sole support.
  2.  **Industry Risk:** The value of the PLN is directly contingent upon the present and future Industry of the People. A decline in productive output, whether due to natural disaster, pestilence, war, mass idleness, or failure to apply labour effectively to the Four Elements, will directly impair the value and acceptability of the Notes. The Note is a ticket drawn on future Industry; if that Industry fails, the ticket is worthless.
  3.  **Issuance Volume Risk:** The Bank possesses sole discretion over the volume of PLN issued. While issuance aims to optimize circulation to stimulate Industry, there exists no theoretical or practical constraint (such as a finite commodity reserve) preventing excessive issuance. Over-issuance could lead to a decline in the value ascribed to each Note relative to goods and services (commonly termed inflation), potentially undermining confidence and disproportionately harming those reliant on fixed holdings (including the Industrious Poor).
  4.  **Hoarding and Idle Rich Risk:** The tendency of entities (notably the Idle Rich) to hoard Notes rather than circulate them actively hinders the system's primary purpose of stimulating Industry. This stagnation can create artificial scarcity for circulating Notes, paradoxically alongside large inactive holdings, reducing overall economic activity and Wealth creation, thereby potentially devaluing *all* Notes.
  5.  **Redemption Limitation Risk:** The functional redemption of PLN relies entirely on their voluntary acceptance in exchange for goods and services. There is no guaranteed mechanism for a Bearer to compel redemption in any specific asset or commodity. In times of stress, acceptance may become limited, restricting the Note's utility.
  6.  **Governance and Discretion Risk:** The success of the PLN system is highly dependent on the prudent exercise of discretion by the Bank regarding issuance volume, anti-hoarding measures, and overall management. Poor governance, corruption, or misjudgment could destabilize the system.
  7.  **External Perception Risk:** Prevailing global doctrines hold that money requires intrinsic value or metallic backing. Persistent external scepticism or refusal to recognize the PLN theory could limit its external acceptance and create internal doubt, impacting confidence and utility.

  **GOVERNING LAW AND JURISDICTION**

  This Offering Memorandum and all matters arising out of or relating to the issuance and circulation of Public Labour Notes, including their nature, transfer, and the obligations they signify, shall be governed by and construed in accordance with the **Principles of Industria**, being the philosophical and economic precepts derived from the Querist and enshrined in the Bank's Charter, as interpreted by the Bank's Governing Council. All disputes shall be subject to the exclusive jurisdiction of the Tribunals of Industria.

  **THE PUBLICK BANK OF INDUSTRIA**
  By: _________________________
  [Authorized Signatory]
  *Per Procurationem*

  ---

  **Notes on Satire & Berkeleyan Fidelity:**

  1.  **"What Backs It?" Malformed:** Clause 2 & 3 explicitly reject intrinsic/metallic backing, defining value relationally through future industry. The Risk Factors (1, 2, 5) highlight the vulnerability of this non-standard backing.
  2.  **Redemption Terms:** Clause 5 defines redemption purely functionally (acceptance for goods/services), denying specie redemption. Risk Factor 5 underscores the limitation.
  3.  **Relational Value:** Defined Term "Counter" and Clause 2 root value solely in the expectation of future industry output.
  4.  **Anti-Hoarding:** Clause 7 explicitly targets hoarding as detrimental, reserves rights for counter-measures, and links Idle Rich to Risk (Factor 4). This stems from Berkeley's view that idle money stifles industry.
  5.  **Industrious Poor / Idle Rich:** The terms are defined. "Power according to Industry" (Clause 6) targets disproportionate wealth without work. Risk Factor 4 identifies the Idle Rich as a systemic risk, inverting traditional class-risk assumptions.
  6.  **Risk Factors as Objections:** Each Risk Factor directly translates a standard objection to Berkeley's theory (confidence in sign, reliance on industry, no issuance limit, hoarding problem, lack of redemption guarantee, external disbelief) into a formal risk disclosure. This is the core comedic mechanism – presenting the theory's inherent vulnerabilities as cold, legal risks.
  7.  **Concession/Wound:** Risk Factors 2 ("Industry Risk") and 3 ("Issuance Volume Risk") are genuine concessions. The Bank admits its currency's value *can* collapse if industry fails (a devastating blow) or if *it itself* mismanages issuance (an institutional failure), without abandoning the core theory – these are simply the inherent risks of the system Berkeley proposed.
  8.  **Register & Consistency:** Maintains a deadpan, formal prospectus register throughout. Uses consistent terminology ("Counter", "Industry", "Power", "Idle Rich", "Four Elements") derived directly from the Querist queries. The logic flows from Berkeley's axioms.
  9.  **Satire Target:** The entire structure satirizes the expectation of metallic backing and intrinsic value by presenting a prospectus for a currency that explicitly lacks it, grounded in a coherent (if vulnerable) alternative theory. The legalese format amplifies the contrast between conventional finance and Berkeley's radical propositions.
