answer: |-
  ## Joint Statement on Concept Induction in Bongard-Style Problems

  **Preamble:** This document represents the collaborative effort of two research perspectives (Rule-First and Similarity-First) to clarify the nature of concept induction. We utilize a shared testbed: Bongard-style problems presented via text descriptions and small relational encodings, eliminating visual perception as a confounding factor. Each problem presents two sets of items (typically six per side), distinguished by an abstract property; the solver must induce this distinction and correctly classify novel probe items.

  **Part 1: Agreed Claims**
  Both camps accept the following foundational points:

  1.  **Problem Structure:** A Bongard-style problem is defined by a pair of sets (positive and negative examples) and probe items. The core task is inducing the abstract distinction partitioning the examples and applying it to the probes.
  2.  **Solving Criterion:** Solving requires correctly classifying novel probe items not present in the initial examples. Performance is primarily measured by probe classification accuracy.
  3.  **Scoring the Battery:** The agreed battery of problem families (listed below) will be evaluated based on solver performance (probe accuracy) and, where applicable and measurable, solver-reported confidence, reaction time, or rule descriptions. Success patterns *across* families are critical evidence.
  4.  **Scope of Testbed:** This battery can establish:
      *   The relative difficulty of different problem types for various solvers (human or artificial).
      *   Whether solvers exhibit systematic successes or failures on specific problem structures.
      *   Whether solvers demonstrate transfer or interference between related problems.
      *   The battery *cannot* definitively establish the sole, universal mechanism of human concept induction in all contexts, nor exhaustively cover all possible concept types.
  5.  **Fair Test:** A fair test compares solvers embodying the distinct theoretical principles of each camp on this agreed battery, under controlled conditions. Performance differences on specific families are interpretable only against the background of this agreed structure and scoring.
  6.  **Agreed Fair Test Families:** Both camps explicitly agree that the following seven families constitute fair and appropriate tests within this framework:
      1.  Negative-existential problems
      2.  Second-order problems
      3.  Deceptive-similarity problems
      4.  Re-encoding pairs
      5.  One-shot problems
      6.  Set-level problems
      7.  Ambiguity problems

  **Part 2: Core Disagreements**

  | Question in Dispute                                                                 | Rule-First Position (as accepted by them)                                                                                          | Similarity-First Position (as accepted by them)                                                                                                                                 | Crux for Rule-First                                                                 | Crux for Similarity-First                                                                      |
  | :---------------------------------------------------------------------------------- | :--------------------------------------------------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------------------------------------------------------------------------ | :---------------------------------------------------------------------------------- | :--------------------------------------------------------------------------------------------- |
  | **1. What is the fundamental format of the induced concept?**                       | The induced concept *is* a discrete, recombinable symbolic predicate (a rule) over features/relations; this predicate *is* the concept. | The induced concept *is* a graded similarity structure or metric within a representation space; generalization is similarity computation under this metric.                         | How can a similarity metric *be* the concept without a rule defining the relevant similarity? | How can a discrete rule capture the graded, context-sensitive nature of real concept application? |
  | **2. Must a solver state the rule for it to be considered the mechanism?**          | If a solver cannot explicitly state a rule fitting the examples and justifying probe classifications, the mechanism cannot be rule application; the rule *is* the mechanism. | Solvers may articulate a rule *post-hoc*; the rule description is an output, not necessarily the generative mechanism. The similarity metric drives generalization.                  | Without an explicit rule, what evidence distinguishes rule-based generalization from similarity? | How can a stated rule prove it wasn't generated *after* the similarity-based decision?        |
  | **3. What does success/failure on Re-encoding pairs show?**                         | Success shows abstract rule transfer: the same rule applies despite surface changes. Failure shows reliance on superficial features. | Success shows alignment of similarity metrics across representations: items deemed similar under the concept remain similar. Failure shows metric dependence on specific encoding. | If the concept is the similarity metric, why would re-encoding disrupt it?         | If the concept is the rule, why would re-encoding ever hinder its application?                 |
  | **4. Do Ambiguity problems have a single determinate correct answer for probes?** | Yes. The minimal description length (MDL) principle selects the correct rule; probes have a unique correct classification under the MDL rule. | No. The problem is inherently underspecified; solvers may legitimately use either rule, guided by their similarity metric or biases; probe classifications may vary legitimately. | How can a solver be "correct" if multiple rules fit? MDL provides objectivity.      | How can a unique answer exist absent additional constraints beyond the given examples?        |
  | **5. Is solving fundamentally binary or graded?**                                   | Solving is binary: the solver induces the correct rule or does not; probe accuracy is the measure. Confidence/RT reflect auxiliary processes. | Solving is graded: similarity computation yields confidence levels; performance (accuracy, RT, confidence) reflects the degree of alignment between metric and partition.           | How can a "partial" concept explain discrete correct/incorrect probe judgments?    | How does a discrete rule explain graded performance (confidence, RT) on probes?                |

  **Part 3: Cruxes and Predictions**

  1.  **Crux: Performance on Negative-Existential Problems**
      *   **Sub-question:** Can solvers reliably achieve high probe accuracy on negative-existential problems *without* explicitly representing the absence as a rule?
      *   **Probe:** Compare solver accuracy and reported strategies on negative-existential problems (e.g., "no part contains another") vs. positive-equivalent problems (e.g., "some part contains another").
      *   **Rule-First Prediction:** Solvers will achieve high accuracy *only* if they explicitly represent and report the negative rule. Accuracy without explicit rule report will be near chance. Positive-equivalent problems will be easier and more often solved without explicit complex rules.
      *   **Similarity-First Prediction:** Solvers can achieve high accuracy by learning a similarity metric sensitive to the relational *structure* where the absence is implied, without necessarily formulating an explicit negative rule. Performance gap between negative and positive problems will be smaller than Rule-First predicts, and explicit rule reports won't perfectly correlate with success.
      *   **Concession:** Rule-First concedes its core claim is weakened if solvers achieve high accuracy on negative-existential problems without reporting the rule. Similarity-First concedes its position is weakened if accuracy without rule report is consistently near chance.

  2.  **Crux: Generalization in Ambiguity Problems**
      *   **Sub-question:** When presented with ambiguity problems, do solvers converge on the Minimal Description Length (MDL) rule for generalization, or do they diverge based on similarity metrics/biases?
      *   **Probe:** Present ambiguity problems (e.g., two distinct rules fit all examples). Collect probe classifications and solver justifications. Analyze consistency across solvers and alignment with the MDL rule vs. alternative plausible rules.
      *   **Rule-First Prediction:** Solvers will overwhelmingly classify probes according to the MDL rule and report that rule as the basis for their decision. Justifications will reference the simplicity of the MDL rule.
      *   **Similarity-First Prediction:** Probe classifications will show significant variability across solvers, clustering around different possible rules consistent with their learned similarity metrics or biases. Reports will cite similarity to examples or specific features, not necessarily MDL.
      *   **Concession:** Rule-First concedes if probe classifications show high variability inconsistent with MDL. Similarity-First concedes if classifications show near-universal convergence on the MDL rule and justifications cite simplicity.

  3.  **Crux: Transfer in Re-encoding Pairs**
      *   **Sub-question:** Does solving the first instance of a re-encoding pair facilitate solving the second instance more than solving a different problem, and what mechanism explains the transfer?
      *   **Probe:** Measure transfer (accuracy, RT) on the second encoding after solving the first. Analyze solver reports: do they state transferring the *same rule* or note increased *familiarity/similarity*? Compare to control (solving unrelated problem first).
      *   **Rule-First Prediction:** Strong positive transfer; solvers explicitly report applying the same abstract rule learned from the first encoding. Transfer is rule identity.
      *   **Similarity-First Prediction:** Moderate positive transfer; solvers report the second instance "feels similar" or "follows the same pattern," facilitated by alignment of similarity metrics. Transfer is metric adaptation.
      *   **Concession:** Rule-First concedes if strong transfer occurs *without* solvers reporting rule identity. Similarity-First concedes if transfer is weak/non-existent despite surface dissimilarity, or if solvers overwhelmingly cite identical rule application.

  **Part 4: Nature of Disputes**

  *   **Primarily Verbal/Terminological:** The dispute over whether the concept *is* the rule or *is* the similarity metric is partially terminological. Both camps agree that solvers produce classifications and may produce rule descriptions. The genuine disagreement lies in **what computational or cognitive process is fundamental** to generating the classification and the description. Labeling the output "the concept" vs. "a description of the concept" reflects this deeper mechanistic difference rather than being purely semantic.
  *   **Genuine Disagreements:** The disagreements concerning:
      1.  **The necessity of an explicit rule report for claiming rule-based mechanism** (Row 2) reflects a fundamental difference in what constitutes evidence for a mechanism. This is methodological and substantive.
      2.  **The determinacy of answers in ambiguity problems** (Row 4) reflects a deep philosophical and empirical divide about underspecification and inductive bias.
      3.  **The interpretation of re-encoding transfer** (Row 3) probes the nature of abstraction (symbolic rule vs. structural alignment) and is empirically testable.
      4.  **The binary vs. graded nature of solving** (Row 5) reflects differing views on the fundamental output and process of induction, impacting how performance is analyzed.
      5.  **The mechanism enabling success on negative-existential problems** (Crux 1) is a core test of the necessity of explicit symbolic negation rules.
      6.  **The basis of generalization in ambiguity** (Crux 2) tests the power of MDL versus similarity metrics/biases in guiding underconstrained induction.
      7.  **The mechanism of transfer in re-encoding** (Crux 3) distinguishes rule transfer from metric adaptation.

  This statement outlines our common ground, clarifies our core disagreements, identifies testable cruxes, and distinguishes terminological from substantive issues. We commit to designing and executing experiments based on this framework.
