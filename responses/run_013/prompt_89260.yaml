prompt: |-
  I'm workshopping a paper next week and I want to know what's coming for me. The thesis: the separateness-of-persons objection to utilitarianism, in the Rawls/Nozick form, is really two claims stapled together -- a metaphysical one (persons are numerically distinct, so you can't sum welfare across them the way you sum across time-slices within one life) and a moral one (it's wrong to sacrifice one person for a bigger total). I argue the metaphysical half does no work. The utilitarian already treats a single life as an aggregate over stages; if intrapersonal aggregation is fine, then distinctness by itself can't block interpersonal aggregation. So the objection has to stand on the moral premise, which needs defending on its own and usually just gets asserted.

  The room: two Kantians, one working on the Formula of Humanity and one a constructivist who thinks the whole thing is about the conditions of agency; a Rawlsian who knows the difference-principle literature cold; a Parfit person who will want to know how my argument sits with the reductionist view of personal identity; and one social-choice economist who'll ask what this does to the possibility of a social welfare function.

  Give me the Q&A prep sheet: the eight or nine objections I'll actually get, in roughly the order they'll come, each phrased the way that particular person would put it, and ordered by how much damage it does, with a two-minute reply and a flag on where the reply is soft. Tell me what to concede in the first thirty seconds so I'm not re-litigating Parfit for an hour. And tell me the one question I'm hoping nobody asks. I have a suspicion it's whether my symmetry argument proves too much -- that it makes the separateness of time-slices a problem for prudence, and thus for my own setup -- but you tell me. Dont bother telling me to add more examples of the utility monster, I've heard it.
reasoning: |-
