  *strokes imaginary beard* The Athenian would definitely prioritize the necessity horn - that controlled wine exposure is irreplaceable. His puppet metaphor from Laws is perfect here: wine uniquely loosens the iron cords of shame that stiffen with age. A "hard conversation" can't replicate that physiological unmasking. 

