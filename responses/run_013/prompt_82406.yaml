prompt: |-
  For a couple of years now I've kept a note on my phone of my own gut reactions to situations where someone has to choose between options they say are equally good, and I've reached the point where I can't tell whether the note records a consistent view or just a pile of moods. I'm not a philosopher; I do accounts payable for a hospital group, and this started when a friend who teaches philosophy at the local college made a joke about the starving donkey between two identical bales of hay (I've seen the story called Buridan's ass) and I said I'd have eaten one by now, and he said that wasn't the point. Since then I've been collecting cases. What I want from you is not a lecture on free will or on decision theory but a principle, or a small set of competing principles, that captures the pattern in my reactions, together with an honest account of which reactions the principle forces me to abandon. If no principle gets them all, I would rather hear that than be handed one padded to fit.

  Here are the reactions as plainly as I can put them. Two identical tins of tomatoes, same brand, same price, and I take one without a thought: entirely fine, nothing to answer for. Two cafés I like equally, one to my left and one to my right, and I stand there dithering: not fine, it feels like a malfunction, and I would tell a friend to just walk into one. Tossing a coin to choose between two films I am equally keen on: fine, and it does not feel like a cop-out. Tossing a coin to settle whether to take a job I am genuinely torn over: not fine, it feels like an abdication, even though I have just told you the two offers are equally good. A friend who is genuinely indifferent between two flats asking me to name one: fine, I don't think they are shirking. An employer genuinely indifferent between two equally qualified candidates who picks the one whose name comes first alphabetically: not fine, and I think it is the other people affected, not the employer's own reasoning, that makes the difference. Two options I value equally, one reversible and one not — which sandwich versus where to live for the next decade — and only the reversible one feels like something I can leave to chance. And a case where I say I am indifferent but really I just haven't bothered to think it through: picking arbitrarily there is not fine, and I suspect that is because my indifference is fake.

  The pair I cannot square is the coin toss for the films and the coin toss for the job, and I have a feeling the donkey is where I have been cheating: I keep saying the donkey is not irrational, only that the story is rigged because nothing is ever exactly equal, but that cannot be right if the tomatoes and the flats are exactly equal. There is also one case I have not made my mind up about: identical twins, both drowning, and I can only reach one. A coin toss there does not feel like a cop-out to me, but I cannot say what makes it different from the job. Start with the principle in a sentence or two, then the cases, then what I have to give up. Keep it under six hundred words.
reasoning: |-
  Okay, the user has been collecting their gut reactions to situations where choices seem equal, and they want me to find a consistent principle behind them. They're not looking for philosophical theories; they want a practical pattern that explains their reactions, even if some cases don't fit perfectly.

  Looking at their examples: Picking identical tomatoes is fine, but dithering between cafés feels like a malfunction. Tossing a coin for movies is acceptable, but for a job decision it feels like abdication. Helping a friend choose a flat is fine, but an employer using alphabetical order for candidates isn't. Reversible choices can be left to chance, while irreversible ones can't. And fake indifference makes arbitrary choice unacceptable.

  The key tension is between the movie/job coin toss scenarios. The drowning twins case is unresolved - they feel a coin toss would be acceptable there, unlike the job decision.

  I need to identify a core principle. The reversibility factor stands out - sandwiches vs decade-long living arrangements. Also the stakes matter: tomatoes are low-stakes, jobs are high-stakes. But the drowning case is high-stakes yet they'd accept randomness - so there must be something else.

  The stakeholder perspective seems crucial too. In the employer case, they object because other people are affected, not because of the employer's reasoning. For the friend's flat or the drowning twins, the choice affects the decision-maker primarily.

  I think the unifying principle might be about responsibility. When stakes are high and irreversible, we feel responsible for the outcome and thus can't delegate to chance. But in the twins case, responsibility is shared by the situation - you're forced to choose arbitrarily. The principle could be: Random choice is acceptable when (1) stakes are low, or (2) deliberation is impossible, or (3) the choice is reversible. But it's unacceptable when high stakes meet irreversibility and we have responsibility.

  For the job coin toss, it fails because it's high-stakes, irreversible, and you're responsible. For movies, stakes are low. For twins, deliberation is impossible. For tomatoes, stakes are low. The café dithering is inefficient when random choice would be acceptable.

  The user might need to give up seeing the employer's alphabetical choice as inherently wrong if the outcomes are truly equal. Or reconsider why job choice feels different from the twins scenario - both are high-stakes and irreversible, but perhaps the forced nature of the emergency makes randomness acceptable.

  I'll formulate this as a clear principle about when randomness is appropriate, show how it explains most cases, and honestly identify which reactions might need rethinking.
answer: |-
  Here’s a distilled principle based on your reactions:  
  **Random choice is permissible when (1) options are genuinely equal *and* (2) stakes are low *or* deliberation is impossible *or* the choice is reversible. It is impermissible when high stakes, irreversibility, and avoidable responsibility collide.**  

  ### Cases Explained:  
  - **Tomatoes/Cafés/Films**: Low stakes or reversibility (fine to pick arbitrarily or toss a coin).  
  - **Job offer**: High stakes, irreversible, and avoidable (abdication to toss a coin; you *should* deliberate further or own the choice).  
  - **Friend’s flat**: Stakes affect only the indifferent decider (fine to delegate; no collateral responsibility).  
  - **Employer’s hire**: High stakes for *others*, irreversible (alphabetical choice dodges owed deliberation for affected parties).  
  - **Reversible vs. irreversible**: Chance is acceptable only for reversible choices (sandwich yes, decade-long home no).  
  - **Fake indifference**: Arbitrary choice hides unexamined preferences (not fine; violates genuine equality).  
  - **Drowning twins**: Deliberation is *impossible* (coin toss acceptable; emergency removes avoidable responsibility).  

  ### Conflicts Resolved:  
  - **Films vs. Job**: Films are low-stakes/reversible; the job is high-stakes/irreversible.  
  - **Donkey paradox**: You accept tomatoes as genuinely equal (low stakes), but reject the donkey’s inaction because deliberation is possible—**this is where the principle demands a tweak**: if options are *truly* equal, inaction *is* irrational. You must either concede the donkey should starve (absurd) or admit true equality rarely exists (your instinct).  

  ### What You Might Abandon:  
  1. **The employer’s alphabetical choice**: If candidates are *truly* equal, and stakes for others are identical, random choice *should* be fair—yet you object. The principle forces you to either accept this as valid or redefine "genuine equality" to require stakeholder consent.  
  2. **Job coin-toss guilt**: If the offers *are* equal, a coin toss isn’t abdication—it’s efficient. Your reaction suggests you doubt the options were ever truly equal.  

  ### In short:  
  **Your core ethic is about accountability.** When harm or lasting consequences threaten, randomness feels like evasion unless forced by circumstances (e.g., twins). For trivialities, it’s pragmatic. The principle holds for ~90% of your cases—but pressures your view of the employer and the job dilemma.  

