answer: |-
  Alright, PhD student. Locked and loaded as your hardline simm-level reductionist. Let's spar.

  Your lock gadget is clever, but it doesn't prove simmballs *shove*. It proves the lock's mechanism is *sensitive* to a specific macro-pattern *in virtue of* the micro-dynamics. When you swap the simm substrate realizing the same simmball pattern, you're creating a *different* micro-causal chain each time. The lock fires because the *new* specific arrangement of simms at its interface triggers the same micro-mechanism within the lock (likely involving its *own* simms being displaced magnetically or physically). The effect "tracks" the simmball pattern *only* because that pattern is a reliable *indicator* of the *type* of micro-configuration that will interact with the lock's micro-structure to produce the effect.

  The causal work is *always* done by the specific simms colliding, magnetizing, and transferring momentum *at the point of contact*. The pattern's constancy across realizations doesn't mean *it* exerts force; it means *different* sets of micro-events (the specific simms pushing in Case A vs. Case B) can produce the *same* outcome *at the lock's mechanism* due to its design sensitivity. The simmball pattern is a *description* of what those diverse micro-events have in common that leads to the same effect on the lock – it's not an additional *causal agent*. The "tracking" is epistemological, not ontological. The simm-level facts *do* fix what happens, and the simmball "facts" are supervenient summaries, not causal forces. Your lock responds to *physical configurations*, not abstract patterns – it just responds identically to physically distinct configurations that *we* classify as the same pattern. Who shoves? Only simms. Always simms. The pattern is a shadow, not a pusher. Counter?

  *(Staying sharp: I concede the indispensability and invariance of pattern-description for prediction/control. But I deny that this invariance implies causal efficacy at the pattern level. The causal exclusion argument holds: if the micro-dynamics are sufficient to cause the effect (which they demonstrably are in each specific instance), then attributing causal power to the macro-pattern is either redundant or false. The "tracking" is explained by the lock's micro-design being tuned to respond to that micro-configuration-type, not by the pattern itself pushing.)*
