  We are to design desiderata for a theory of safe Pareto improvements (SPI). The core idea: a modification that makes every player at least as well off as in the original game, no matter how the players (or their programmatic representatives) behave. This must hold without probabilistic assumptions.

  We break down the requirements into three groups: cases to get right, distinctions to preserve, and results to be consistent with. Then we consider three test cases.

  First, let's brainstorm the full space of what one might demand:

  1. **Universality**: Works for any game, any number of players, any commitment technology.
  2. **Robustness**: Safe against any possible behavior of the opponents, including adversarial, irrational, or arbitrary programmatic behavior.
  3. **Non-triviality**: Should allow non-trivial improvements in non-cooperative games (like Prisoner's Dilemma).
  4. **Efficiency**: Should achieve improvements that are as close to Pareto optimal as possible.
  5. **Computability**: The theory should yield a decidable characterization of when an SPI exists and what it looks like.
  6. **Practicality**: The modification should be implementable with real commitment technologies (contracts, programs, etc.).
  7. **Player Sovereignty**: The improvement should respect the players' autonomy in the sense that they are not forced to accept a modification that they might not want under all possible realizations of uncertainty.
  8. **Stability**: The improvement should not create new incentives for deviation that undermine the original safety.

  But we must prune to what is genuinely required. We focus on the core of safety and non-probabilistic guarantees.

  Now, we organize the requirements.

  ## I. Cases the theory must get right

  Each case forces a particular aspect of the theory.

  1. **Prisoner's Dilemma (PD)**:
     - *Case*: One-shot PD with symmetric posted programs. The modification should allow (Cooperate, Cooperate) to be achieved without any risk of being exploited (i.e., without the possibility of (Cooperate, Defect)).
     - *Forces*: The theory must allow for mutual commitment that enforces cooperation. This forces the theory to handle symmetric commitment devices.

  2. **Bargaining Problem (e.g., Ultimatum Game or a Coordination Game with a bad equilibrium)**:
     - *Case*: A game where without commitment, the worst outcome (e.g., both players getting 0) is a possible equilibrium. The modification should guarantee at least the next best thing (e.g., a fair split) without allowing the worst outcome.
     - *Forces*: The theory must be able to eliminate bad equilibria without introducing new risks. This forces the theory to handle multiple equilibria and to guarantee a minimum payoff.

  3. **The Trojan Horse**:
     - *Case*: An apparently attractive modification that, when implemented, allows one player to exploit the other in a new way. For example, a modification that in most cases leads to mutual gains but in some cases (under a particular adversarial program) leads to one player being worse off than in the original game.
     - *Forces*: The theory must require that the improvement is safe against every possible behavior, including adversarial behavior that was not present in the original game. This forces the theory to be robust against arbitrary deviations.

  ## II. Distinctions the theory must not collapse

  These are critical to avoid confusion and to ensure the theory is well-grounded.

  1. **Improving the game vs. improving the play**:
     - *Motivation*: The modification changes the rules (the game) or the instructions (the play). We are modifying the strategic situation, but we must be clear whether we are changing the game form (e.g., by adding a contract) or just the strategies (e.g., by pre-committing to a strategy). The theory must account for both but not conflate them because the safety conditions differ.

  2. **Safety against best responses vs. arbitrary programs**:
     - *Motivation*: If we only require safety against best responses, then in PD we might think that mutual cooperation is safe because if one cooperates the other's best response is to defect. But we require safety against arbitrary defection. The theory must require safety against arbitrary deviations (by the opponents) to be robust.

  3. **Principals' payoffs vs. representatives' payoffs**:
     - *Motivation*: The principals (the players) care about their own payoffs, but if they delegate to representatives (programs), the representatives might have different incentives. The theory must ensure that the improvement is for the principals, and the representatives are just instruments. We must not collapse the two because a representative might be programmed to act against the principal's interest.

  4. **Guaranteed vs. likely**:
     - *Motivation*: We require certainty (weakly better off with probability 1), not just high probability. This is non-negotiable because the problem statement says "with certainty".

