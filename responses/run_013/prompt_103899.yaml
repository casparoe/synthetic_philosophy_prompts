  ### Desiderata for a Theory of Safe Pareto Improvements (SPI)

  A **safe Pareto improvement (SPI)** is a modification of a strategic situation (game or instructions) ensuring every player is *weakly better off with certainty*, regardless of opponents' behavior, without probabilistic assumptions. The theory must support real commitment technologies (e.g., contracts, posted programs, verifiable promises). Below are requirements, motivated by cases, distinctions, and consistency constraints. Requirements marked **†** are non-negotiable; **‡** excludes otherwise-attractive theories.

  ---

  ### **I. Cases the Theory Must Get Right (Non-Negotiable †)**
  1. **Prisoner’s Dilemma (PD) with Symmetric Programs**  
     - *Case*: One-shot PD where mutual cooperation is achieved via symmetric posted programs (e.g., "cooperate if you do").  
     - *Forces*: The theory must enable enforceable mutual cooperation without exploitation risk (e.g., no (Cooperate, Defect) outcome).  
     - *Test*: SPI must strictly dominate mutual defection without assuming opponent rationality.

  2. **Bargaining with Catastrophic Default**  
     - *Case*: A game (e.g., asymmetric coordination or ultimatum game) where the default outcome includes mutual loss (e.g., (0,0) is a genuine equilibrium).  
     - *Forces*: The theory must eliminate catastrophic outcomes *without creating new risks*, ensuring a minimum guaranteed payoff.  
     - *Test*: SPI must make the worst possible outcome strictly better than the default catastrophe.

  3. **Trojan Horse Exploitation**  
     - *Case*: An apparent improvement that, under adversarial play, enables one player to exploit another (e.g., a contract that seems fair but allows one party to force a worse outcome).  
     - *Forces*: The theory must require robustness against *all* deviations, including those with no rational incentive.  
     - *Test*: SPI must preclude any outcome worse than the original game’s worst-case for any player.

  ---

  ### **II. Distinctions the Theory Must Not Collapse (Non-Negotiable †)**
  1. **Game Improvement vs. Play Improvement**  
     - *Motivation*: Modifying the game (e.g., adding enforceable contracts) is distinct from modifying play (e.g., recommending strategies). Collapsing these risks assuming players follow instructions.  
     - *Requirement*: SPI must alter the game’s rules or commitment structure, not assume compliance.

  2. **Safety Against Best Responses vs. Arbitrary Programs**  
     - *Motivation*: Safety against best responses (e.g., Nash equilibrium) fails against irrational or malicious deviations (e.g., a program that defects unconditionally in PD).  
     - *Requirement*: SPI must hold against *any* programmatic deviation, including non-best-response or adversarial behavior **‡**.

  3. **Principals’ Payoffs vs. Representatives’ Payoffs**  
     - *Motivation*: Players (principals) delegate to programs (representatives), but payoffs must align with principals’ interests. Representatives might act against principals (e.g., due to hacking).  
     - *Requirement*: SPI must evaluate payoffs from the principals’ perspective, not the representatives’.

  4. **Guaranteed vs. Merely Likely**  
     - *Motivation*: "Certainty" demands guaranteed weak improvement, not probabilistic (e.g., 99% safe). Likelihood assumptions violate non-probabilistic constraints.  
     - *Requirement*: SPI must ensure improvement in *all* possible worlds, not in expectation.

  5. **Existence vs. Selection of Improvements**  
     - *Motivation*: Multiple SPIs may exist (e.g., multiple fair divisions), but the theory need not resolve selection. Collapsing these overburdens SPI with equilibrium selection.  
     - *Requirement*: SPI must define existence criteria separately from implementation (e.g., via focal points or bargaining).

  ---

  ### **III. Results or Impossibilities the Theory Must Be Consistent With**
  1. **No Strict Improvement in Zero-Sum Games**  
     - *Consistency*: In zero-sum games, no SPI can strictly improve one player without harming another. The theory must respect this.
  2. **Folk Theorem with Commitment**  
     - *Consistency*: In repeated games without commitment, some payoffs are unattainable; with commitment, they become feasible. The theory must align with this but avoid probabilistic strategies.
  3. **Revelation Principle Limitations**  
     - *Consistency*: Direct mechanisms relying on truthful reporting fail against arbitrary programs. The theory must not assume truthfulness.

  ---

  ### **Test Cases: Requirements and Resolutions**
  1. **Asymmetric Commitment**  
     - *Issue*: Only one player can commit (e.g., post a program); the other cannot.  
     - *Requirement*: SPI must be relativized to **commitment technologies** (e.g., programmable contracts). Safety is a property of **(game, technology set)**, not the game alone.  
     - *Resolution*: In asymmetric PD, SPI may not achieve mutual cooperation (e.g., if only one commits, defection remains possible). The theory must accept this limitation.

  2. **The Spoiler**  
     - *Issue*: A non-player (spoiler) can degrade commitment (e.g., corrupt the verifier) at personal cost, gaining nothing.  
     - *Requirement*: Safety must consider **only players**, not all agents. Spoilers are external to the game; robustness is a technological constraint.  
     - *Resolution*: If spoilers break commitment, SPI fails. The theory must assume commitment technologies are externally secure (non-negotiable †).

  3. **Introspective Uncertainty**  
     - *Issue*: Players are unsure of their own payoff functions when agreeing to modifications.  
     - *Requirement*: SPI must require **ex post Pareto for every type**, not ex ante expected payoffs. Certainty demands improvement for all realizations.  
     - *Resolution*: Ex post safety is stronger but necessary. Ex ante expectations introduce implicit probabilities, violating non-probabilistic constraints.

  ---

  ### **Chosen Formulation of SPI**
  A modification is an SPI iff:  
  1. **Safety**: For every program profile in the modified game, there exists a program profile in the original game yielding payoffs weakly worse for all players.  
  2. **Improvement**: There exists a program profile in the modified game that strictly improves at least one player’s payoff without harming others, compared to the original game’s *best* equilibrium or default outcome.

  **Defense**:  
  - Safety ensures robustness against arbitrary deviations (addressing Trojan Horse cases).  
  - Improvement ensures non-triviality (addressing PD and bargaining).  
  - Relativization to commitment technologies handles asymmetry (e.g., only programmable players benefit).  

  **Trade-offs Adopted**:  
  - **Dropped**: Decidability for arbitrary infinite games. Safety against arbitrary programs **‡** makes SPI undecidable in general (halting problem). Accept decidability only for finite games.  
  - **Dropped**: SPI in asymmetric games without commitment. If only one player commits, mutual gains may be impossible (e.g., asymmetric PD).  
  - **Weakness**: Safety requirement limits improvements to outcomes bounded by the original game’s payoff set (e.g., no fines below minimax). Bargaining gains require symmetric commitment.  

  **Inconsistencies and Non-Triviality**:  
  - **Joint Inconsistency**: Safety against arbitrary programs **‡** and complete decidability **cannot coexist** for Turing-complete programs (reduction from halting problem). We sacrifice decidability for robustness.  
  - **Non-Degeneracy**: SPI is non-trivial (e.g., PD cooperation is achievable), but only when commitment technologies are symmetric and secure. Asymmetry or spoilers reduce opportunities.  
  - **Critical Exclusion**: Safety against arbitrary programs **‡** excludes Nash-based or best-response-focused theories (e.g., correlated equilibria), but this is necessary for certainty.  

  ---

  ### **Conclusion**
  The theory demands SPI relativized to commitment technologies, with safety against arbitrary programs and ex post type-wise improvement. It handles PD, bargaining, and Trojan Horse cases, but asymmetric commitment or spoilers limit applicability. Decidability is sacrificed for robustness in infinite games. **SPI is non-degenerate but constrained**: trivial improvements (e.g., no change) always exist, but non-trivial ones require symmetric, spoiler-proof commitment.
