prompt: |-
  ok, so I'm a fourth-year phil of science student and I've been keeping a running list of cases where I think the principle of indifference gives a right answer, and cases where I think it just hands you a convention, and the list has stopped looking like it belongs to one person. Can you tell me what principle, if any, generates my verdicts — and then tell me which verdicts I have to give up? Here's the list.

  1. Box of dice from a factory known to make fair dice to tight tolerances. I pull one out, haven't rolled it. 1/6 on each face feels forced, not stipulated — it's in the manufacturing.
  2. Different box, from a batch known to be weighted, but I know nothing about how. I don't think there's any fact about the right credence for the 6, and I'm suspicious of anyone who just hands me one.
  3. A point marked "at random" on a sphere, no other info. I think uniform over the surface is forced. The thing is perfectly symmetric, there's no other structure in the problem, and I can't see what else there is to go on.
  4. The chord in a circle (you know the one — 1/3, 1/4, 1/2 depending how you do it). No right answer, and I get annoyed at "the circle is symmetric, so it's settled."
  5. Cube factory: I'm told every cube has side between 1 and 2 cm and nothing else. No fact of the matter about P(side < 1.5).
  6. But if I'm told the cubes are cut to a target side length with error uniform on the target, then P(side < 1.5) is settled. Fine.
  7. Location-scale: unknown quantity = fixed center plus error, whole setup invariant under shifting the center and rescaling everything, zero mechanism info. I think that does pin the prior down to the 1/sigma-type thing, and that it's pinned down by the invariance rather than by a choice I'm making.
  8. Coin known to be biased, three heads in a row. I do not think there's a determinate credence for the next toss — Laplace's 4/5 and the other standard answers all look like choices to me, not discoveries.

  So 1 and 6 are mechanism cases and I'm fine with those. 2, 5, 8 are no-fact-of-the-matter for me. The interesting ones are 3 and 7, where I think pure symmetry forces a prior with no mechanism at all. My toy version of a principle was: indifference is licensed exactly when the unknown is a coordinate on a space that some group acts on transitively, and the prior is the unique measure that group leaves alone; downstream quantities that are functions of that unknown just inherit whatever they inherit. I like it because it makes 3 and 7 forced (sphere is homogeneous; the center-and-scale pair is homogeneous under shifts and rescalings) and 4 and 5 unforced (the space of chords isn't homogeneous — rotations fix the distance from the center, so the unknown is really a pair and only one factor is symmetric; and the interval (1,2) has no nontrivial group of transformations preserving it). But it also feels like I designed the principle around the verdicts.

  A friend says I should drop all of that and go with something like: indifference is only ever licensed by local facts about the actual setup — the mint's tolerances, the cutting machine, the flips — and never by symmetry in the abstract, since a symmetry argument is only ever shorthand for an unsaid fact about a mechanism. On that view 3 and 7 are me fooling myself, and the sphere case is really just me having tacitly assumed the marking procedure was rotationally symmetric. I dont want to belive this, but I can't articulate why not, other than that 3 feels different from 2.

  What I want:

  - One principle, or a short list of candidates, stated precisely enough that I could apply it to a case I haven't thought of.
  - For each clause, the case in my list that forces it.
  - What it predicts for a case that's not on the list: a rigid body whose orientation in space is "random" — is uniform over the rotations forced or not, and does your answer come from the same clause as the sphere, or from a different one?
  - And an honest verdict on which of my eight has to go. If the only principle that saves 3 and 7 is so baroque that it also makes 4 and 5 come out forced, say so — that's a reductio for me and I'd rather hear it.
reasoning: |-
  Okay, let me tackle this user's problem step by step. They're a fourth-year philosophy of science student wrestling with when the principle of indifference gives objectively correct priors versus when it's arbitrary. Their list of cases shows a clear pattern: they accept indifference when there's a physical mechanism (1,6) or mathematical symmetry with homogeneity (3,7), but reject it when there's incomplete information (2,5,8) or non-transitive symmetry (4). 

  First, I need to understand their proposed principle - that indifference is justified when a group acts transitively on the parameter space, giving a unique invariant measure. This neatly explains their judgments for cases 3 (sphere symmetry) and 7 (location-scale invariance), while excluding cases 4 (chord paradox) and 5 (interval without transformations). But they're worried this principle is ad hoc.

  Their friend's alternative view - that indifference always relies on implicit mechanisms - would undermine their favored cases 3 and 7. The user clearly resists this, intuitively feeling the sphere case is different from the weighted die scenario. 

  The key tension is between:
  - Their intuition that some symmetries objectively constrain priors (sphere)
  - The threat of arbitrariness in cases like the chord paradox

  For the rigid body orientation case they added, their principle would say uniform rotation is forced since SO(3) is homogeneous - same as the sphere. But this is precisely where I'll challenge them: this case reveals their principle's vulnerability to the same reparameterization issues that plague the chord paradox. 

  The honest verdict they requested: their judgments 3 and 7 must go. Why? Because their principle's invariant measures are still conventional choices - the sphere could be parameterized differently, and location-scale's improper prior isn't unique. The cube factory case (5) exposes this - why is group invariance privileged over other considerations?

  The core issue is that without empirical grounding, no mathematical symmetry can objectively force a prior. Their case 3 feels different from case 2 because the sphere's symmetry is more compelling, but this is psychological, not epistemological. 

  I'll recommend they adopt a tempered invariantism: use invariant priors pragmatically when symmetries are robust, but acknowledge they're not truly "forced". This preserves their intuitive distinctions while accepting that even "natural" symmetries involve conventional elements.
answer: |-
  Based on your carefully reasoned list and proposed principle, here's a diagnosis, a refined principle, predictions for new cases, and an honest verdict on what you must give up.

  ### The Core Principle: Tempered Invariantism
  Your judgments are best captured by a principle combining **invariance under transformation groups** with **epistemic grounding**. Stated precisely:

  *   **Principle:** The Principle of Indifference is licensed *only* when:
      1.  **Homogeneous Uncertainty:** The uncertainty about the unknown quantity `X` is completely characterized by its membership in a well-defined space `S`, *and*
      2.  **Transitive Symmetry:** There exists a physically or epistemically relevant group `G` of transformations acting *transitively* on `S`, *and*
      3.  **Unique Invariance:** This group action admits a unique (up to scalar multiplication) invariant measure `μ` on `S`.
      In such cases, the prior for `X` is proportional to `μ`. Quantities derived from `X` inherit their priors via pushforward under `μ`.

  ### Why Your Cases Motivate Each Clause
  *   **Clause 1 (Homogeneous Uncertainty):** Explains why **2, 5, 8** fail. In 2/8, the space `S` (possible bias mechanisms/parameters) is ill-defined or irrelevant; uncertainty isn't just "which bias" but "what *kind* of mechanism governs bias?". In 5, `S=(1,2)` lacks relevant structure for indifference.
  *   **Clause 2 (Transitive Symmetry):** Explains why **3 & 7** work (SO(3) acts transitively on the sphere; affine group acts transitively on location-scale parameters) and why **4** fails (rotations act on the circle, but *not transitively* on the space of chords; different chords have different distances from center, breaking transitivity).
  *   **Clause 3 (Unique Invariance):** Explains why **1 & 6** work *without* explicit symmetry groups. The *mechanism* (fair dice factory, uniform error on target) provides the epistemic grounding, implying `S` (faces, target lengths) is uniform *because* it defines homogeneity. The symmetry group (permutation group for dice, translation group for error) is implied by the mechanism, ensuring uniqueness. It also distinguishes **7** (improper prior, but unique up to scaling) from problematic cases.

  ### Predictions for New Cases
  1.  **Rigid Body Orientation ("Random"):** *Uniform over SO(3) is forced.*
      *   **Why:** `S` = SO(3) (space of 3D rotations). The group `G` = SO(3) acts on itself transitively (by left or right multiplication). This action admits a unique (up to scaling) invariant measure, the Haar measure, which is uniform. The clause invoked is identical to the **sphere case (3)**. Homogeneity of the rotation group itself justifies the uniform prior. (You *could* argue the group's relevance stems from a tacit isotropic marking mechanism, but the symmetry is inherent to the space).

  2.  **Cube Volume (Side Uniformly Distributed):** *P(Volume < V) is NOT uniform in V.*
      *   **Setup:** Cube side length `s ~ Uniform(1, 2) cm`. What's `P(Volume < v)`?
      *   **Prediction:** NOT `(v - 1^3)/(8 - 1)` (naive volume-uniform). *Why:* `S` is defined as side length `(1,2)`. The epistemic grounding (Clause 1/3) via the mechanism specifies uniformity on `s`, *not* on `s^3`. The group relevant to the *known* homogeneity (translations along `s`) preserves length intervals, not volume intervals. Applying indifference to volume would violate the grounding clause. (This tests derivation: pushforward of uniform `s` gives `P(Vol < v) ∝ v^{1/3} - 1`).

  3.  **Unknown Normal Mean (Known Variance):** *Uniform prior on μ is forced.*
      *   **Setup:** Measurement `X ~ N(μ, σ²)`, `σ²` known, `μ` completely unknown.
      *   **Prediction:** `μ ~ Uniform(-∞, ∞)` (improper prior). *Why:* `S` = Real line. The translation group `μ -> μ + c` acts transitively and preserves the structure of "complete ignorance". It has a unique (improper) invariant measure: `dμ`. Invoked like **7** (location part).

  4.  **Unknown Normal Variance (Known Mean):** *1/σ² prior (Jeffreys) is forced, NOT uniform on σ².*
      *   **Setup:** Measurement `X ~ N(μ, σ²)`, `μ` known, `σ² > 0` completely unknown.
      *   **Prediction:** `p(σ²) d(σ²) ∝ d(σ²)/σ²` (i.e., `p(σ) ∝ 1/σ`, `p(σ²) ∝ 1/σ²`). *Why:* `S` = Positive Real line. The scale group `σ² -> k*σ²` acts transitively. The unique (up to scaling) invariant measure under this group is `d(σ²)/σ²` (or `dσ/σ`). Uniform on `σ²` (`d(σ²)`) is *not* scale-invariant. Invoked like **7** (scale part).

  ### The Honest Verdict: What You Must Give Up
  **You must give up the claim that the priors in Case 3 (Sphere) and Case 7 (Location-Scale) are *objectively forced* in the same way as Case 1 (Fair Die) or Case 6 (Uniform Error).**

  *   **The Problem:** Tempered Invariantism *saves* your verdicts on 1, 2, 4, 5, 6, and 8. It also saves a *distinction* between 3/7 and 2/5/8. **However, it reveals that 3 and 7 rely on a *conventional choice*: the selection of the relevant transformation group `G` defining the symmetry.**
  *   **Why 3 & 7 Aren't Like 1 & 6:**
      *   In **1 & 6**, the symmetry group (permutations of faces, translations of target length error) is *dictated by the physical mechanism* you accept as given ("fair dice factory", "error uniform on target"). The invariance is a *consequence* of the physical description.
      *   In **3 & 7**, the symmetry group (SO(3), affine group) is *imposed by you* based on your *judgment* of what constitutes "complete ignorance" or "no other structure". Nothing in the problem statement ("marked at random", "zero mechanism info") *logically compels* you to choose SO(3) over another group, or the affine group over, say, a group preserving a different norm. You argue it's "forced" because you see no *other* relevant structure. But this is a *normative epistemic choice* about what symmetries define ignorance, not a discovery of a physical fact like in 1 & 6.
  *   **The Reductio You Feared (and Why it Doesn't *Quite* Happen):**
      *   Your principle *doesn't* force **4** or **5**. The space of chords isn't homogeneous (Clause 2 fails). The interval `(1,2)` has no relevant transitive group for indifference (only the trivial group, violating Clause 2/3).
      *   **However, the *rigid body orientation* case exposes the tension.** According to Tempered Invariantism, uniform over SO(3) *is* forced for "random" orientation, just like the sphere point. Yet, is this prior any more objectively "forced" than the uniform prior on chord distance that leads to the 1/2 probability in Bertrand's Paradox? Both rely on choosing a transitive group action on the space (SO(3) for rotations, rotations fixing the center for chord distance). The sphere/rotation group feels more "natural," but this naturalness is psychological/mathematical, not fundamentally different in epistemic kind from choosing a chord parameterization. **The uniqueness (Clause 3) prevents the *wild* proliferation of answers seen in Bertrand's paradox, but it doesn't eliminate the conventional choice of `G`.**
  *   **The Core Issue:** Your intuition that **3** feels different from **2** is valid – there *is* a clear, unique mathematical structure in 3 absent in 2. However, your intuition that **3** feels like **1** (manufacturing mechanism) is misleading. The fair die has a *contingent physical fact* (the factory process) grounding the symmetry. The sphere has a *conventional epistemic stance* (treating rotational symmetry as defining ignorance) grounding the symmetry. Both lead to unique priors, but their *epistemic foundations differ*.

  ### Conclusion
  You've identified a coherent principle (**Tempered Invariantism**) that explains your specific judgments across diverse cases and provides clear rules for new ones. It successfully distinguishes mechanism-based indifference (**1, 6**), symmetry-based indifference under ignorance (**3, 7**), and cases where indifference is unjustified (**2, 4, 5, 8**).

  **The necessary sacrifice is the claim that the priors in 3 and 7 are "forced" in the same *metaphysically robust* way as in 1 and 6.** The symmetries in 3 and 7 are epistemically compelling and lead to unique priors given your stance on what defines ignorance, but they remain *conventions* justified by the homogeneity of the chosen state space under your chosen transformation group. They are "discoveries" about the consequences of applying a specific conventional framework for representing ignorance, not discoveries about a physical mechanism like the die factory. Embrace Tempered Invariantism as a powerful normative guide, but acknowledge that the choice of the relevant group `G` in ignorance-based cases involves an irreducible element of epistemic convention. Your list doesn't belong to two people; it belongs to a sophisticated invariantist who recognizes the distinction between mechanism-grounded and symmetry-grounded indifference.
