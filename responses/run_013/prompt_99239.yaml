prompt: |-
  I work on the design team at a national statistics office, and we have been told to build a word-free visual system for presenting our headline claims to a public that reads several languages and includes many people with limited literacy. One of my colleagues keeps invoking Otto Neurath — the Vienna Circle philosopher who, through the 1920s and 30s, tried to construct a picture language for social and economic statistics, the forerunner of what later became known as Isotype — as proof that this is not merely possible but superior to prose, on the grounds that pictures can carry exact meaning that words only blur, and that a single visual grammar could be learned once and then read anywhere. I am skeptical, but I want to take the idea seriously rather than wave it away, so I would like you to turn Neurath's actual position on picture languages into a procedure my team can run. I care about what he really held, not the popular caricature: that the picture language was meant to be a genuine language with a strict grammar rather than decoration; that it was bound up with his physicalism, so that only observable, spatiotemporal states of affairs can be depicted and abstract or theoretical entities require auxiliary signs; and that its supposed self-evidence was always in tension with the fact that any such language has to be learned. Where the caricature and the real view diverge, follow the real view.

  Please write the procedure as an ordered sequence of questions we ask about a candidate claim before committing it to pictures: what counts as a sufficient answer at each step, the point at which the procedure returns a firm instruction to depict it a particular way, the point at which it says this part must stay in words, and the points where the decision is a matter of editorial values rather than of Neurath's theory and therefore has to be handed to a person — assume our director has final sign-off. Then run it on three cases, including at least one where the procedure gives an answer we will not like. First, a simple quantity claim: that a certain fraction of households lost power for more than a day last winter. Second, a causal claim: that a newly introduced fee caused a drop in applications. Third, and this is the one that genuinely worries me, a claim carrying uncertainty and comparison at once: that the gap between two regions probably narrowed, even though the estimates overlap. Neurath's framework was built for counts of things you can point at, and I suspect it has nothing honest to say about probably or about overlapping, so be explicit about where his picture language reaches its limit and whether that limit is a defect of his program in particular or a general fact about pictures. Tell me at the end what the procedure cannot do, and where a reader will inevitably be misled no matter how carefully we design the thing. Please finish with a final line beginning "Verdict:" that names, in one sentence, the single part of a claim that can never be safely pictured.
reasoning: |-
  We are designing a procedure based on Otto Neurath's actual views on picture languages (Isotype). Neurath's core principles:
  1. Picture language is a genuine language with a strict grammar, not decoration.
  2. It is tied to physicalism: only observable, spatiotemporal states of affairs can be directly depicted. Abstract or theoretical entities require auxiliary signs (which are conventional and must be learned).
  3. The language must be learned; it is not naturally self-evident. However, once learned, it can be read universally.

  The procedure will be a sequence of questions to evaluate a candidate claim for depiction. We want to determine:
  - When we can depict the claim entirely in pictures.
  - When part of the claim must remain in words (if it involves abstract concepts that cannot be depicted without auxiliary signs, or if it goes beyond observable states of affairs).
  - When the decision is editorial and must be handed to a person (with the director having final sign-off).

  Procedure:

  1. **Question: Can the claim be reduced to an observable, spatiotemporal state of affairs?**
     - *Sufficient answer*: If the claim describes a physical event, object, or a countable entity that exists in space and time, then yes. If it involves abstract concepts (like "cause", "probably", "justice") then no.
     - *Instruction*: If yes, proceed to step 2. If no, then the claim (or the abstract part) must be expressed in words, or we must use an auxiliary sign (which is a conventional symbol that must be learned) for the abstract concept. However, note that auxiliary signs are still part of the picture language but require learning.

  2. **Question: Is the claim about a countable quantity?**
     - *Sufficient answer*: The claim must involve discrete entities that can be represented by individual pictograms (e.g., people, households, power outages). If the quantity is continuous or not easily broken into discrete units, we may need to represent it by other means (like a bar for a magnitude) but this must be done in a way consistent with the grammar.
     - *Instruction*: If yes, we can represent it by a set of pictograms (each representing a unit) and then group them to show the quantity. If no (e.g., it's about a rate, a proportion, or a continuous measure), we may use a different visual representation (like a bar chart) but note that the bar chart itself is an auxiliary sign and must be learned. So we can use it, but we must be consistent and teach it.

  3. **Question: Does the claim involve a relationship between two or more observable states of affairs? (e.g., comparison, change over time, cause and effect)**
     - *Sufficient answer*: If the relationship is spatial (e.g., more in A than in B) or temporal (e.g., increase from time 1 to time 2), then we can represent it by arrangement (side-by-side, stacked, etc.). However, if the relationship is abstract (like causation, correlation, or probability), then we cannot depict it directly and must use an auxiliary sign or leave it in words.
     - *Instruction*: For spatial/temporal relationships, we can use relative positions, sizes, or arrows (which are auxiliary signs for direction). For abstract relationships, we must use an auxiliary sign (e.g., a specific symbol for "cause" that we define) or leave it in words. Note: Neurath was skeptical about depicting causation directly because it is not observable. He would require an auxiliary sign.

  4. **Question: Does the claim involve uncertainty or probability?**
     - *Sufficient answer*: If the claim is about an observed frequency (e.g., in 9 out of 10 trials, X happened) we can depict the frequency with pictograms. But if it is about an estimate with a margin of error (e.g., "probably", "likely", or confidence intervals), then we are in the realm of abstract concepts.
     - *Instruction*: For observed frequencies, we can show the proportion (step 2). For uncertainty about an estimate, we must use an auxiliary sign (e.g., a special symbol for "uncertainty" or a visual convention like a dashed outline) or leave it in words. This is because uncertainty is not directly observable but inferred.

  5. **Editorial decisions**: 
     - After the above steps, we may have a design that uses pictograms and auxiliary signs. However, the choice of auxiliary signs and the exact arrangement is a matter of convention and must be consistent. The editorial team must decide on the exact symbols and ensure they are taught to the audience (via a key or prior exposure). Also, the overall layout and color scheme are editorial.
     - *Hand to a person*: At any step where we decide to use an auxiliary sign, the exact design of that sign must be approved by the director. Also, the decision to use an auxiliary sign versus words for a particular concept is editorial (because it depends on the audience's prior learning). The director must sign off on the entire design to ensure consistency and teachability.

  Now, run the procedure on three cases:

  **Case 1: A simple quantity claim: "A certain fraction of households lost power for more than a day last winter."**

  - Step 1: Observable? Yes. Losing power is an event that happens to households (physical entities). The duration "more than a day" is also observable (though time is abstract, we can represent it by a clock or calendar symbol, which is an auxiliary sign). So we can proceed.
  - Step 2: Countable? Yes. We can count households and those that lost power. We can represent households with a pictogram of a house. We can show the fraction by having a group of houses and then mark some of them (e.g., with a dark color) to indicate power loss. The duration "more than a day" might be represented by an auxiliary sign (e.g., a clock showing 24 hours) next to the affected houses. Alternatively, we can break the claim into two parts: the fraction and the duration. The fraction is easily depicted, but the duration requires an auxiliary sign.
  - Step 3: Relationship? The claim is about a single state (at a past time) and does not involve a relationship between two distinct states. So no complex relationship to depict.
  - Step 4: Uncertainty? None in this claim (it's a simple fact).
  - Editorial: We will need to design an auxiliary sign for "more than a day". We might use a clock with an arrow pointing beyond 24 hours. The director must approve this sign.

  **Verdict for Case 1**: Entirely picturable with auxiliary signs. We can show a group of houses, with a fraction of them in a dark color (or with a bolt crossed out) and next to each affected house we put the duration sign (clock with arrow beyond 24h). The fraction is shown by the proportion of dark houses.

  **Case 2: A causal claim: "A newly introduced fee caused a drop in applications."**

  - Step 1: Observable? The fee and the applications are observable (we can see money being paid and application forms being submitted). The drop in applications is observable (we can count applications before and after). But "caused" is an abstract concept (causation is not directly observable; we infer it). So we must use an auxiliary sign for causation or leave that part in words.
  - Step 2: Countable? Applications are countable. We can show the number of applications before and after. The fee might be represented by a money symbol (an auxiliary sign for fee).
  - Step 3: Relationship? We have two time periods and two states (before fee and after fee). The drop is a change over time, which we can show by two groups of application forms (one larger group for before, one smaller for after). But causation? We cannot depict the causal link without an auxiliary sign. We might use an arrow from the fee symbol to the applications, but that arrow would be an auxiliary sign for causation (which must be learned). Alternatively, we might use a special symbol (like a lightning bolt) to mean "causes".
  - Step 4: Uncertainty? None stated.
  - Editorial: We must decide on an auxiliary sign for causation. This is critical and must be approved by the director. Also, the fee is an abstract concept (it's a rule, not a physical object) so we use a money symbol as an auxiliary sign. The drop in applications is observable and countable.

  **Verdict for Case 2**: We can depict the fee (with a money symbol), the applications (with form pictograms), and the drop (by comparing two groups). But the causal link requires an auxiliary sign. Without it, we cannot convey cause. Therefore, we must either use the auxiliary sign (and teach it) or leave the word "caused" in text. The procedure says we can use an auxiliary sign, but the director must approve.

  **Case 3: Claim carrying uncertainty and comparison: "The gap between two regions probably narrowed, even though the estimates overlap."**

  - Step 1: Observable? The gap (difference between two regions) is an abstract concept. We can observe the measurements in each region (if we have data) but the gap is a derived concept. Moreover, "probably" is an abstract concept about uncertainty. The estimates and their overlap are also abstract (they are statistical constructs). So we are dealing with multiple abstract concepts.
  - Step 2: Countable? We are dealing with estimates (which are not directly countable) and a gap (which is a difference). We might represent the regions with pictograms (e.g., two maps) and then show the measurements (say, average income) as bars. But the gap is the difference between two bars. The narrowing of the gap is a change in that difference over time. However, the claim also says the estimates overlap (meaning the confidence intervals overlap) and that the narrowing is only probable.
  - Step 3: Relationship? We have a comparison between two regions and a change over time (narrowing). We can show the two regions at two time points (e.g., two pairs of bars, one pair for each time). But the gap (the difference) would be represented by the relative length of the bars. However, the gap narrowing is a change in the difference, which we can show by the change in the relative lengths. But the claim also says the estimates overlap (which is about uncertainty in the estimates) and that the narrowing is only probable.
  - Step 4: Uncertainty? This is central. We have two kinds of uncertainty: 
     a) The estimates are uncertain (they have confidence intervals, and they overlap).
     b) The conclusion that the gap narrowed is only probable.
     How to depict? We can show the confidence intervals for each region at each time (e.g., with error bars). The overlap would be visible if we plot the intervals. But the word "probably" in the claim expresses a degree of belief in the narrowing, which might be based on the data but is not directly observable. We would need auxiliary signs for the uncertainty (like error bars) and then an auxiliary sign for "probably" (which is even more abstract). Alternatively, the narrowing might be shown with a dashed arrow (to indicate it is not certain) but that is an editorial decision.
  - Step 1 again: Because of the abstract concepts (gap, estimates, uncertainty, probability), we must use auxiliary signs for each. But note: the gap is not directly observable, so it requires an auxiliary sign (like a double-headed arrow between the two bars). The estimates are also abstract (they are calculated) so we are representing them by bars, which are auxiliary signs. The uncertainty (confidence intervals) can be shown by error bars (an auxiliary sign). The word "probably" might be represented by a question mark or a special symbol (like a cloud) but that is not standard and must be learned.

  **Verdict for Case 3**: This claim pushes the limits of Neurath's picture language. We can depict the two regions and their measurements at two times using bar charts with error bars (to show the estimates and their uncertainty). We can show the gap by the difference in bar heights and the narrowing by a reduction in that difference over time. However, the probability of the narrowing (despite the overlap) is an abstract inference that cannot be directly depicted. We would need an auxiliary sign for "probably" and also explain that the overlapping error bars do not preclude a real change (which is a complex statistical concept). This is where the picture language fails to convey the exact meaning without words. We might end up having to use words for the "probably" part, or we might use an auxiliary sign but risk being misunderstood.

  **What the procedure cannot do**:
  - It cannot depict abstract concepts without auxiliary signs, and auxiliary signs must be taught and might not be self-evident.
  - It cannot depict complex relationships (like causation, probability, or statistical inference) without losing precision. These require words or a shared understanding of the auxiliary signs.
  - It cannot convey nuances of uncertainty beyond simple representations (like error bars) which might be misinterpreted (e.g., overlapping confidence intervals do not mean there is no significant change).
  - It cannot replace the need for education: the audience must learn the visual grammar.

  **Where a reader will inevitably be misled**:
  - Abstract concepts: A reader might not understand the auxiliary sign for "cause" or "probably" if they haven't learned it.
  - Uncertainty: Visual representations of uncertainty (like error bars) are often misinterpreted even by literate audiences. For low-literacy audiences, this is even harder.
  - Causation: Showing an arrow from A to B might be taken as a physical connection rather than a statistical association.
  - In the third case, the visual might show the narrowing gap and the overlapping error bars, but without words, the viewer might think the gap did not really change (because of the overlap) or might not grasp the probabilistic statement.

  **Final Verdict**:
  Verdict: The single part of a claim that can never be safely pictured is the abstract concept of probability (or uncertainty) in an inference, especially when it is a matter of statistical reasoning that goes beyond the observed data.
answer: |-
  Based on Otto Neurath's actual principles—physicalism (only observable, spatiotemporal states of affairs can be directly depicted; abstract/theoretical concepts require learned auxiliary signs), strict visual grammar (systematic rules, not decoration), and the necessity of learning (no innate "self-evidence")—here is a step-by-step procedure for evaluating claims. The procedure prioritizes fidelity to Neurath's core ideas, not popular simplifications. It identifies when to depict, when to use words, and when editorial judgment is required (with director sign-off). 

  ---

  ### **Procedure for Evaluating Claims: Neurathian Picture Language**
  **Key Rules**:
  - **Depict directly**: Only if the claim describes an observable, countable state of affairs in space/time (e.g., "100 households").
  - **Use auxiliary signs**: For simple abstract concepts (e.g., "fee" as a coin icon) that can be standardized and learned. These are part of the grammar but require teaching.
  - **Use words**: For irreducible abstractions (e.g., "cause", "probably"), theoretical entities, or relationships that lack a physical analog.
  - **Editorial handoff**: When choices involve conventions (e.g., designing an auxiliary sign) or trade-offs in clarity. Director has final approval.

  **Ordered Questions**:
  1. **Is the claim reducible to an observable, spatiotemporal state of affairs?**  
     - *Sufficient answer*: Yes, if it describes physical objects/events that can be pointed to (e.g., households, power outages, applications).  
     - *No*: If it involves unobservable abstractions (e.g., "cause", "probability", "gap").  
     - **Instruction**:  
       - If **yes**, proceed to Q2.  
       - If **no**, the abstract element *must stay in words* (per physicalism).  

  2. **Is the claim about discrete, countable units?**  
     - *Sufficient answer*: Yes, if entities can be represented as individual pictograms (e.g., one house icon = one household).  
     - *No*: If continuous, aggregated, or derived (e.g., averages, rates, gaps).  
     - **Instruction**:  
       - If **yes**, depict via unit pictograms (e.g., 5/10 houses dark = 50%).  
       - If **no**, use an *auxiliary sign* for the aggregate (e.g., a bar for "magnitude"), but note this requires learning. Proceed to Q3.  

  3. **Does the claim involve a relationship (e.g., comparison, change, effect)?**  
     - *Sufficient answer*: Yes, if the relationship is spatial/temporal (e.g., "more in A than B", "drop over time").  
     - *No*: If the relationship is abstract (e.g., "caused", "probably", "despite overlap").  
     - **Instruction**:  
       - If **yes**, depict via relative arrangement (e.g., icons side-by-side for comparison, arrows for direction).  
       - If **no**, the relationship *must stay in words* (it violates physicalism; no auxiliary sign can fully capture it without ambiguity).  

  4. **Does the claim involve uncertainty or probability?**  
     - *Sufficient answer*: Yes, if it references observable frequencies (e.g., "3 in 4 times").  
     - *No*: If it references epistemic uncertainty (e.g., "probably", "estimates overlap", "likely").  
     - **Instruction**:  
       - If **yes**, depict via proportion (e.g., 3 full icons + 1 faded icon).  
       - If **no**, uncertainty *must stay in words* (it is unobservable; auxiliary signs for probability are conventional and unreliable).  

  5. **Editorial handoff required?**  
     - *Always* at these points:  
       - Designing auxiliary signs (e.g., icon for "fee" or "drop").  
       - Choosing arrangements (e.g., layout for comparisons).  
       - Balancing simplicity vs. precision.  
     - **Instruction**: Hand to director for sign-off. Neurath’s theory does not prescribe specific designs—only that signs must be consistent and taught.  

  ---

  ### **Running the Procedure on Three Cases**
  **Case 1: Simple Quantity Claim**  
  *"A certain fraction of households lost power for more than a day last winter."*  
  - **Q1**: Observable? Yes (households, power loss, duration). Proceed.  
  - **Q2**: Countable? Yes (households are discrete units). Depict via unit pictograms: e.g., 5 dark houses + 5 light houses = 50% loss.  
  - **Q3**: Relationship? None (no comparison/causation). No action.  
  - **Q4**: Uncertainty? None. No action.  
  - **Editorial**: Auxiliary sign needed for "more than a day" (e.g., clock icon with "24h+"). Director approves design.  
  - **Verdict**: **Fully depictable** with auxiliary signs.  

  **Case 2: Causal Claim**  
  *"A newly introduced fee caused a drop in applications."*  
  - **Q1**: Observable? Partially. "Fee" and "applications" are observable (depictable), but "caused" is abstract. "Caused" must stay in words.  
  - **Q2**: Countable? Applications are countable. Depict pre-fee vs. post-fee applications as unit groups (e.g., 10 icons → 5 icons).  
  - **Q3**: Relationship? "Drop" is temporal (depict with downward arrow), but "caused" is abstract. Arrow cannot imply causation; "caused" requires words.  
  - **Q4**: Uncertainty? None. No action.  
  - **Editorial**: Auxiliary sign for "fee" (e.g., coin icon). Director approves.  
  - **Verdict**: **Partially depictable**. Must show:  
    - Fee (coin icon) + applications (unit icons) + drop (arrow).  
    - But "caused" requires words (e.g., text label: "result").  

  **Case 3: Uncertainty + Comparison Claim**  
  *"The gap between two regions probably narrowed, even though the estimates overlap."*  
  - **Q1**: Observable? No. "Gap" (abstract difference), "estimates" (theoretical), "probably" (epistemic), and "overlap" (statistical) are unobservable. Only regional measurements (e.g., income) are observable. Proceed with caution.  
  - **Q2**: Countable? No. "Gap" and "estimates" are derived aggregates. Use auxiliary signs: bars for regional magnitudes, but not units.  
  - **Q3**: Relationship? "Narrowed" is a spatial relationship (depict with converging bars). But "even though" implies contradiction—unpicturable abstraction.  
  - **Q4**: Uncertainty? Yes. "Probably" and "overlap" are epistemic/statistical uncertainty. Cannot be depicted; must stay in words.  
  - **Editorial**: Auxiliary signs for regions (e.g., maps) and magnitudes (bars). Uncertainty requires words. Director must approve trade-offs.  
  - **Verdict**: **Barely depictable, misleading alone**. Can show:  
    - Two regions (map icons) + converging bars for "narrowed gap".  
    - But "probably" and "overlap" require text. Without words, the visual implies certainty in narrowing, misrepresenting the claim.  

  ---

  ### **What the Procedure Cannot Do**
  1. **Depict abstractions faithfully**: Causation, probability, and statistical concepts (e.g., "overlap") lack physical analogs. Auxiliary signs (e.g., dashed lines for uncertainty) are conventions, not self-explanatory.  
  2. **Convey logical qualifiers**: Words like "despite", "probably", or "even though" require syntax impossible in pictures.  
  3. **Handle inference**: Pictures show what *is*; they cannot explain *why* or *how likely*.  

  ### **Where Misleading is Inevitable**
  - **Uncertainty/Probability**: Visuals (e.g., faded icons) imply observed frequency, not epistemic doubt. Viewers will confuse "3 in 4 occurred" (depictable) with "75% chance" (not depictable).  
  - **Context-dependent concepts**: "Gap" or "cause" may be misinterpreted as physical (e.g., a hole or force) without words.  
  - **Overlapping estimates**: Depicting overlapping bars suggests equivalence, not probabilistic narrowing. This misleads on statistical nuance.  

  **Neurath’s Limit**: His system fails for uncertainty and theoretical comparisons because it rejects unobservables. This is a **defect of his program**—he dismissed statistics beyond counts—but also a **general limit of pictures**: they excel at nouns, fail at verbs and qualifiers.  

  ---

  **Verdict:** The single part of a claim that can never be safely pictured is **epistemic uncertainty** (e.g., "probably", "likely"), as it requires inferential reasoning absent in observable reality.
