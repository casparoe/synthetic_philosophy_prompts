  In the PR chamber: A:4, B:5, C:3.

  No party has a majority. So coalitions are needed.

  Possible coalitions:
     A+B: 4+5=9 -> majority. They can divide the 100 points.
     A+C: 4+3=7 -> majority.
     B+C: 5+3=8 -> majority.
     A+B+C: 12 -> majority, but not minimal.

  We can have each coalition negotiate a division. We will ask the students to form groups by party and then negotiate.

  But we have 18 students: we need to assign them to parties. We have 6 A, 7 B, 5 C. But wait, in the PR round, the seats are A:4, B:5, C:3. So we need to assign 4 students as A representatives, 5 as B, 3 as C. But we have 18 students. We can have each seat represented by one student? Then we have 12 representatives (one for each seat). The other 6 students can be lobbyists or observers? That might be unfair.

  Alternatively, we have the entire party caucus negotiate. We divide the class into three groups: the A party (6 students), B party (7), C party (5). But then they have different numbers. And the power is in the seats: A has 4 seats, B has 5, C has 3. So we need to make clear that the number of seats is what matters for forming a government.

  We can have each party delegation have a leader who casts the bloc vote for the party. And the party has a number of votes equal to its seats.

  For the bargaining, we can have each party delegation (all students in the party) discuss what they want. Then the leaders negotiate.

  We then have a government formation round: any two parties can form a government by signing an agreement on how to divide the 100 points. We then see what coalitions form and at what division.

  We expect that C, being pivotal, can demand more than its proportional share.

  For example, in the A+C coalition: 7 seats. They need to agree on a division. What is C's bargaining power? It can threaten to go with B. Similarly, B+C would give 8 seats.

  We might expect that C can demand close to 50 points in either coalition? But we have to see.

  To make it hurt: if C joins A, then B gets nothing. If C joins B, then A gets nothing. So C can play them off.

  The minimal winning coalition with C might give C a lot.

  We can then compare to what they would get in a grand coalition: proportional to seats? 4+5+3=12, so A: 4/12 *100 = 33.3, B:41.7, C:25. But in a minimal winning coalition, C might get more than 25.

  We then have the students form governments and report the divisions.

  Now, the redistricting minute: after the FPTP round, the party that lost (which would be A and C in the FPTP round) gets to redraw the district boundaries. But we have 4 tables. We can have them physically move the tables to change the district populations? But the tables are fixed by the room? The instructor says we can move the tables, so we can create new districts by regrouping the students.

  We have 18 students. We currently have districts of 3,5,4,6. The losing side (the parties that are underrepresented: A and C) gets to redraw the map into 4 new districts. They can regroup the students arbitrarily, but they must respect contiguity? Since they are in a room, we ignore contiguity. They just form new groups of whatever size they want, but the total is 18 and we still want 4 districts. And then we re-run the FPTP block voting with the same party preferences but new district groupings.

  They will try to gerrymander. For example, they might pack B's voters into as few districts as possible and spread their own to win more districts.

  After they redraw, we run the FPTP block voting again and see if the result changes.

  Then we have them defend the map.

  Timeline for the 90 minutes:

  0-10 min: Setup. Assign students to tables (districts) and assign party preferences secretly. We hand out party assignments. We explain the first round: each district will elect its members by block voting. Each voter in a district has as many votes as there are seats, and must cast all votes for one party's entire slate. The party with the most votes in the district wins all the seats in that district.

  10-25 min: First round (FPTP block voting). Each district votes. We count the votes in each district and announce the winner. We then tally the total seats on the whiteboard.

  25-35 min: We show the total votes per party nationwide. Then we do the PR round: we ignore districts and use the nationwide vote totals to allocate 12 seats by the Hare quota and largest remainders. We calculate that on the whiteboard.

  35-45 min: Enlargement: we add 2 seats (so 14 total). We recalculate the PR allocation for 14 seats. We use the same vote totals. We show how the allocation changes. (But we won't have the Alabama paradox, so it's just for show.)

  45-60 min: Bargaining round. We divide the class into three party groups (by their original party assignment). We explain that the government is formed by any coalition of parties that has at least 7 seats (majority of 12). The government can divide 100 points among the three parties. Each party cares only about the points it receives. We let the parties negotiate. After 5 minutes, we ask for coalitions to report: which parties are in the government and how many points each party gets.

  60-75 min: Redistricting. We tell the class that we are going back to the FPTP system. The losing side in the first FPTP round (parties A and C) gets to redraw the district boundaries. They have 5 minutes to regroup the 18 students into 4 new districts (any sizes, but 4 districts). Then we run the FPTP block voting again with the new districts and the same party preferences. We count the seats.

  75-90 min: Debrief. We guide a discussion about what they experienced.

  Now, what might go wrong:

  1. In the bargaining round, the parties might not form a minimal winning coalition. For example, they might form a grand coalition and split the points proportionally. Or they might not agree. We need to encourage them to negotiate. We can say that if no government is formed, then a new election is called and everyone gets 0 points. So they have an incentive.

  2. In the redistricting, the losing side might not be able to agree on a map. We can let them propose one map and then we use it.

  3. The vote counting in the block voting might take time. We should have a template for each district.

  4. The PR calculation might be confusing. We should do it step by step on the board.

  5. The time might run out. We need to keep strict time.

  Debrief:

  We want them to notice:
  - In the first round (FPTP), they saw that a party (B) won a majority of seats without a majority of votes. The voting system manufactured a majority.
  - In the PR round, they saw that the seats were more proportional, but then in the bargaining, the small party (C) was able to extract more than its proportional share of power (points).
  - In the enlargement, they saw that adding seats changed the allocation, but one party might not gain as much as expected (though we didn't have a loss).
  - In the redistricting, they saw that the district boundaries had a huge impact on the FPTP result.

  We then finally name the systems: FPTP with block voting, and proportional representation.

  We also note that accountability in single-member districts might be stronger because each district has its own representative, but in PR, the representative is from a party list.

  What this activity cannot reproduce:
  - The accountability argument for single-member districts: we didn't have individual representatives for districts in the PR system. We might mention that in the debrief.

  We also didn't show the Alabama paradox. We can mention that some apportionment rules can cause a state to lose seats when the total number of seats increases, but it is rare and we skipped it for simplicity.

  Now, let's write the activity in continuous prose.
answer: |-
  Before diving into the design, let me think through the mechanics to ensure they align with your constraints and goals. The core challenge is creating a simulation where the same voter preferences yield divergent outcomes under different counting rules, while embedding the two specific moments you requested—enlargement-induced seat loss and redistricting—without overcomplicating the arithmetic. I considered three approaches but discarded two. First, a pure first-past-the-post (FPTP) single-member district system was tempting for simplicity, but with only four districts, the resulting four-seat chamber would be too small to show meaningful divergence or power dynamics. Second, a mixed-member proportional system risked muddying the comparison between FPTP and proportionality. I settled on using FPTP with block voting in multi-member districts for the initial round. This amplifies the "manufactured majority" effect (your first goal) by allowing district sweeps, while keeping seat counts high enough for the subsequent proportional and bargaining rounds. For the Alabama paradox (enlargement causing a seat loss), I tested Hamilton method apportionments on small populations, but clean examples at this scale—like your 18 voters—are mathematically elusive without fractions or complex remainders. Instead, I’ll use the enlargement to highlight how seat gains under proportionality don’t translate linearly, setting up the power paradox (your second goal) more organically. The redistricting moment will follow naturally from the FPTP round, leveraging your movable tables.

  Here’s the activity, structured as a 90-minute flow. Use the whiteboard for all tallies—no pre-printed materials needed. Assign parties secretly to avoid preconceived alliances.

  ---

  **Setup (0–10 minutes):**  
  Arrange the four tables to represent districts, labeling them North, South, East, West. Assign students to tables: North (3 students), South (5), East (4), West (6). This creates mild malapportionment. Privately hand each student a card with their party affiliation: "Unity" (left-leaning, 8 students total), "Order" (right-leaning, 7), or "Balance" (centrist, 3). Distribute affiliations to concentrate Unity in two districts and spread Order, ensuring a manufactured FPTP majority: North (3 Unity), South (3 Order, 2 Balance), East (3 Unity, 1 Balance), West (4 Order, 2 Balance). Explain that they’ll vote twice on the same preferences—once by district rules, once nationally—to form a legislature. Emphasize that parties are fictional and no real-world analogs should be inferred.  

  **First Count: FPTP Block Voting (10–25 minutes):**  
  Each district elects multiple members via block voting. Seats per district are apportioned by population: North (2 seats), South (3), East (3), West (4)—total 12 seats. Rules: Voters cast all their district’s seats as a bloc for one party. The party with the most votes wins all seats in that district. Ties are broken by coin flip (avoid them via the affiliation distribution). Votes are public: each table stands and announces votes aloud (e.g., "North: 3 votes for Unity"). Tally on the whiteboard:  
  - North: Unity 3 → wins 2 seats  
  - South: Order 3, Balance 2 → Order wins 3 seats  
  - East: Unity 3, Balance 1 → Unity wins 3 seats  
  - West: Order 4, Balance 2 → Order wins 4 seats  
  Result: Unity 5 seats, Order 7 seats, Balance 0. Order holds a majority (7/12) despite only 11/18 votes (Order 7 votes + Unity 6 + Balance 5). Pause: "What patterns do you see?" Let them note the majority and the zero for Balance—don’t name FPTP yet.  

  **Second Count: Proportional Allocation (25–40 minutes):**  
  Shift to a proportional national legislature with the same 12 seats, using the identical voter preferences. Tally nationwide votes on the board: Unity 6, Order 7, Balance 5. Apply simple largest remainder method: quota = total votes (18) / seats (12) = 1.5. Unity: 6 / 1.5 = 4 seats (exact). Order: 7 / 1.5 = 4.666 → 4 seats (remainder 1). Balance: 5 / 1.5 = 3.333 → 3 seats (remainder 0.5). One seat remains; award it to the highest remainder (Order). Final: Unity 4, Order 5, Balance 3. Contrast with FPTP: "Unity lost a seat, Balance appeared, but Order still leads—why?" Highlight vote-to-seat discrepancies.  

  **Enlargement (40–50 minutes):**  
  Announce: "To better reflect the people, we’re adding two seats—total 14." Recalculate proportionally with the same votes: quota = 18 / 14 ≈ 1.286. Unity: 6 / 1.286 ≈ 4.66 → 4 seats (remainder 6 - 4×1.286 = 0.856). Order: 7 / 1.286 ≈ 5.44 → 5 seats (remainder 7 - 5×1.286 = 0.57). Balance: 5 / 1.286 ≈ 3.89 → 3 seats (remainder 5 - 3×1.286 = 1.142). Initial seats: 4+5+3=12; two remain. Highest remainders: Balance (1.142) and Unity (0.856). Award seats to Balance and Unity. Final: Unity 5, Order 5, Balance 4. Point out: "Balance gained, but Order—which won more votes—stayed at 5 seats while Unity caught up." Though no party lost seats, Order’s share decreased (41.7% to 35.7%) despite enlargement—a soft analogue to the paradox.  

  **Bargaining Round (50–65 minutes):**  
  Reset to the proportional result (Unity 4, Order 5, Balance 3). Assign roles: 4 Unity students, 5 Order, 3 Balance. Explain: "The legislature must pass a bill with 7+ votes. Each party has one policy demand: Unity wants Policy X (e.g., free tuition), Order wants Policy Y (e.g., tax cuts), Balance wants Policy Z (e.g., electoral reform). Passing a bill gives 100 ‘influence points’ to the coalition. Parties only care about their own points. Negotiate for 5 minutes—any majority coalition can form, but you must agree how to split the points." No real policy details are needed; the points abstractly represent "getting what you want." Walk around nudging: "Balance, you’re in every possible majority. Unity/Order, without Balance, you lose." Afterward, ask coalitions to report splits. Typically, Balance auctions support—e.g., joining Unity for 50 points, or Order for 55—exceeding their seat share (3/12=25%). Contrast with a Unity-Order split (e.g., 45-55), where Balance gets nothing but the big parties compromise. The pain point: Balance’s leverage despite fewer votes/seats.  

  **Redistricting Minute (65–75 minutes):**  
  Return to the initial FPTP outcome (Unity 5, Order 7, Balance 0). Tell the underrepresented (Unity and Balance): "Redraw district boundaries to change the result. Regroup all 18 students into four new districts—any sizes—in 3 minutes." They’ll likely pack Order voters (e.g., one Order-majority district) and spread their own. After redrawing, rerun FPTP block voting with the new districts and original affiliations. Example: If they create districts like 5 (4 Unity, 1 Order), 5 (3 Unity, 2 Balance), 4 (4 Order), 4 (2 Order, 2 Balance), Unity and Balance may flip seats. Then, ask the redrawers: "Defend this map. Is it fair?" Let them squirm as they admit geography shaped the outcome.  

  **Debrief (75–90 minutes):**  
  Map moments to feelings:  
  - After FPTP: "You saw a majority emerge from counting rules. Did the population ‘want’ Order, or did the system hand it to them?"  
  - After PR: "Balance won seats but felt powerless? Then suddenly pivotal? That’s the gap between seats and power."  
  - After enlargement: "Adding seats helped Balance but diluted Order’s share. Proportionality adjusts, but not always ‘fairly’."  
  - After bargaining: "Balance extracted more points than its size. Is that democratic? Or does it reward obstruction?"  
  - After redistricting: "You changed the map and changed the winner. How much of representation is engineering?"  
  Only now name the systems: "What you called ‘district voting’ is FPTP block voting; ‘national voting’ is proportional representation." Surface the accountability argument: "In districts, you knew who ‘your’ rep was. In PR, who’s accountable? But in districts, the map chose winners." End with open questions: "Does proportionality fix ‘wasted votes’? Or just create new trade-offs?"  

  ---

  **Predictable Failures:**  
  - **Bargaining stalemate:** Students may resist "selling out" for points, especially Order/Unity. Nudge hard: "If no coalition forms, everyone gets zero—and you fail the polity."  
  - **Redistricting chaos:** With 3 minutes, students might draw inefficient maps. Let them fail—the defense moment reveals more than a perfect gerrymander.  
  - **Vote miscounts:** In block voting, a student might split votes. Intervene firmly: "All votes to one party, or it’s spoiled."  
  - **Enlargement confusion:** Some will question why Order didn’t gain seats. Use it: "Why did Balance gain more? Quotas aren’t intuitive."  
  - **Affiliation drift:** A student might switch parties mid-activity. Prevent this by assigning affiliations verbally and privately.  

  **What This Cannot Reproduce:**  
  The simulation simplifies accountability—voters don’t "punish" reps between elections. In the last three minutes, ask: "In districts, you could name your rep. In PR, who do you blame if Policy Z fails? But in districts, what if your rep ignored you?" This frames accountability as a felt cost of PR without lecturing. Also, real-world proportionality involves thresholds and lists; briefly note that post-activity to avoid cluttering the core takeaway.  

  This design prioritizes clean runs over exhaustive detail. The arithmetic stays visible, the paradoxes emerge experientially, and the payoff-less bargaining stings because points force trade-offs. Run it tight, and the room will feel the tensions you want to lodge.
