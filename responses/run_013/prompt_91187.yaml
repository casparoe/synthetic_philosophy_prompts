  Below is a complete, ready-to-run design for your 90-minute session. It focuses on experiential learning about logical uncertainty without using the term until the debrief. The activity uses a hidden digit of a mathematical constant, proposition trading, and private hints to create palpable tension around unknowable logical facts. The self-referential card is engineered to expose pricing paradoxes through group interaction.

  ---

  ### **Activity Title:** The Belief Bazaar  
  *Unspoken problem: Logical uncertainty in probabilistic reasoning*

  ---

  ### **Materials List** (Prep time: 1 afternoon)
  1. **Hidden Fact**:  
     - A sealed envelope containing a card: "The 1,000th digit of π is [*precomputed digit, e.g., 7*]."  
     - *(Use π for familiarity; its digits are fixed but impractical to compute live. Verify digit online beforehand.)*

  2. **Proposition Cards** (Laminate or use stiff paper):  
     - Card 1: "The digit is odd."  
     - Card 2: "The digit is prime." (Primes: 2,3,5,7)  
     - Card 3: "The digit is seven."  
     - Card 4: "The digit is three or seven."  
     - Card 5: "The digit is odd or even." (Logical truth)  
     - Card 6: "The digit is greater than nine." (Logical falsehood)  
     - **Round 4 Only**: Card 7: "The settlement price of this card is ≥0.5."  

  3. **Hint Cards** (16 unique cards, one per participant):  
     - Use the actual digit (e.g., 7) to generate hints:  
       - **Decisive hint (1 copy)**: "The digit is the smallest prime that is one less than a perfect cube." (Only true for 7: 2³=8, 8-1=7.)  
       - **Non-decisive hints (15 copies)**: Mix of 5 each:  
         - "The digit is at least 5."  
         - "The digit is prime."  
         - "The digit is odd."  
     - *(Ensure hints don’t collectively rule out all options; e.g., "at least 5" + "prime" + "odd" leaves 5 or 7.)*

  4. **Chips & Logistics**:  
     - 100 chips per participant (use poker chips or paper slips).  
     - Whiteboard/projector to display prices and trades.  
     - Timer.  
     - Participant handouts: Simplified rules (Appendix A).  

  ---

  ### **Rules and Order of Play** (90 min total)

  #### **Phase 1: Setup** (0–10 min)  
  - **Facilitator Script**:  
    > "Today, we’re traders in a market of ideas. Inside this envelope is a *determinate fact*: the 1,000th digit of π. It’s fixed, but we don’t know it. Each of you gets chips, a private hint about the digit, and will trade claims about it. Your goal: build chip wealth through smart trades. No sharing hints! Trades are with me, the ‘house.’"  
  - Distribute:  
    - 100 chips per participant.  
    - 1 random hint card per participant.  
    - Display proposition cards 1–6 (not 7 yet).  

  #### **Phase 2: Trading Rounds 1–3** (10–35 min; 8 min/round)  
  - **Per Round** (Repeat ×3):  
    1. **Price Setting (3 min)**:  
       - Each participant writes **buying** (B) and **selling** (S) prices for *all 6 propositions* (0 ≤ B, S ≤ 1).  
       - Prices = What they’ll pay/accept for a card that pays **1 chip if true, 0 if false** at settlement.  
    2. **Trade Execution (3 min)**:  
       - Collect prices. For *each participant and proposition*:  
         - If B > 0, house **sells 1 unit** to them at price B (they lose B chips, gain +1 holding).  
         - If S < 1, house **buys 1 unit** at price S (they gain S chips, gain -1 holding; shorts allowed).  
       - Track holdings/chips on the board.  
    3. **Price Display (2 min)**:  
       - Post all B/S prices anonymously (e.g., "Participant 3: Card1 B=0.7, S=0.6"). Highlight:  
         - Exploits (e.g., if B for "odd" > S for "odd," house profits from arbitrage).  

  #### **Phase 3: Round 4 – Self-Referential Twist** (35–50 min)  
  - **Introduce Card 7 (5 min)**:  
    > "New card! It says: *‘The settlement price of this card is ≥0.5.’* Settlement price = the average of your *buying prices* for this card in this round. If the claim is true, it pays 1; if false, 0. Trade as before—now with 7 cards."  
  - **Price Setting & Trading (10 min)**:  
    - Repeat Round 1–3 process for **all 7 cards**.  
    - *Critical*: For Card 7, settlement depends *only* on its own B-price average.  

  #### **Phase 4: Settlement** (50–60 min)  
  1. Reveal the digit (open envelope).  
  2. Resolve cards 1–6: Pay 1 chip/unit if true, 0 if false.  
  3. Resolve Card 7:  
     - Calculate average of B-prices for Card 7.  
     - Pay 1 chip/unit if average ≥0.5, else 0.  
  4. Announce final chip leaders.  

  ---

  ### **Payoff Scheme**  
  - **Chips as Reputational Capital**: No real money. Final standings = "wealth" ranking.  
  - **House Trades Ensure Exploits Hurt**: If prices are incoherent (e.g., B for "seven" > S for "odd" despite implication), house profits visibly, embarrassing the trader.  
  - **Key Incentive**: Setting "fair" prices avoids losses; good hint use builds wealth.  

  ---

  ### **Facilitator’s Nudge Script** (Use only if stuck)  
  - **If participants freeze in Round 1** (e.g., confusion on B/S meaning):  
    > "Think of buying a card as betting ‘yes’ at cost B. If true, you net (1 - B). Selling is betting ‘no’—you profit S if false, or lose (1 - S) if true."  
  - **If decisive hint holder announces the digit**:  
    > "Remember, hints are private. If shared, it breaks the game—like showing cards in poker."  
  - **If Card 7 causes paralysis**:  
    > "Price Card 7 based on what you think the *group’s average B-price* will be. High? Low? Your price affects the average!"  

  ---

  ### **Debrief Framework** (60–90 min; map events to concepts)  
  **Goal**: Connect in-room experiences to logical uncertainty. Never say "logical uncertainty" until debrief.  

  | **In-Room Event**                  | **Concept to Unveil**                                                                 | **Facilitator Script**                                                                 |
  |------------------------------------|---------------------------------------------------------------------------------------|----------------------------------------------------------------------------------------|
  | Exploited incoherent prices (e.g., B for "seven" > S for "odd") | Probability theory assumes logical omniscience; real agents miss implications. | "Your prices ignored that ‘seven’ implies ‘odd.’ Standard probability *assumes* you see all logic upfront. But we don’t!" |
  | Tautology (Card 5) traded <1 or contradiction (Card 6) >0 | Logical truths/falsehoods drift to 1/0 with learning, but not instantly. | "Card 5 *must* be true, yet early prices were <1. Card 6 *must* be false, yet some sold it! With time, we correct—but not at once." |
  | Decisive hint didn’t move the market | Private info aggregates slowly; logical uncertainty ≠ empirical uncertainty. | "One hint *could* have revealed the digit. Why didn’t the market jump? In empirical settings (e.g., weather), prices update fast. Here, we doubt *reasoning*, not just facts." |
  | Card 7 oscillated (e.g., B-prices yo-yoed) | Self-reference creates regress ("What do they think I think?") | "Card 7’s value depended on your *beliefs about beliefs*. No ‘right’ price—it’s circular. Probability theory breaks here." |
  | Provable claims (e.g., "odd or even") unsettled until reveal | Non-omniscient agents treat proofs as uncertain until computed. | "Card 5 was provable, but you priced it <1 until the end. Before proving it, you treated it as uncertain—like an unsolved conjecture." |

  **Closing Insight**:  
  > "What you felt—frustration with hidden logic, pricing things you *could* know but don’t—is **logical uncertainty**. Standard probability ignores this. It assumes we see all logical implications instantly. But we don’t! Programs like *logical induction* tackle this by treating beliefs as stock prices that avoid exploits over time. Today, you lived the problem."  

  ---

  ### **Predictable Problems & Fixes**  
  1. **Slow Trading Start**:  
     - *Risk*: 30% may not grasp B/S mechanics.  
     - *Fix*: Run a **practice round** with a non-digit claim (e.g., "Paris is France’s capital").  

  2. **Decisive Hint Leaked or Ignored**:  
     - *Risk*: Holder blurts it out (ends game) or is dismissed.  
     - *Fix*: Stress hint privacy; make decisive hint *cryptic* (requires reasoning). If leaked, say: "Hint invalidated. Play on."  

  3. **Card 7 Paralysis or Shouting**:  
     - *Risk*: Group deadlocks or argues vs. trading.  
     - *Fix*: Use the nudge script; remind that oscillation is okay.  

  4. **Math/Logic Errors**:  
     - *Risk*: E.g., Mistaking "even" as not complementary to "odd" (0 is even).  
     - *Fix*: Clarify digit rules upfront: "Digits are 0–9. 0 is even; 1 is not prime."  

  ---

  ### **Where the Analogy Runs Out**  
  The activity **cannot reproduce**:  
  - **Long-term learning guarantees**: Logical induction ensures prices *eventually* trust future proofs (e.g., if you *will* prove P, prices reflect it *now*). Here, rounds are too short for this to emerge organically.  
    - *Bridge verbally*: "In real logical induction, the ‘trader’ learns to preemptively price based on *anticipated* proofs. Our game is a snapshot—no time for that."  
  - **Infallible limits**: The model guarantees exploit resistance *in the limit*, but our market is small and noisy.  
    - *Bridge*: "You saw *moments* of coherence, but long-run guarantees require infinite time."  

  ---

  ### **Appendix A: Participant Cheat Sheet**  
  - **Buying price (B)**: What you pay to own a card. If true at settlement, you get 1 chip. Net gain = (1 - B) if true, -B if false.  
  - **Selling price (S)**: What you accept to give up a card (or short-sell). If false, you gain S. If true, you lose (1 - S).  
  - **Holdings**: Can be negative (short sales).  
  - **Hints**: Private! Use them to inform prices.  
  - **Goal**: Maximize chips.  

  ---

  This design ensures participants grapple with logical uncertainty viscerally. The debrief ties chaos to theory, making the abstract concrete. Run it as-is, and the room will leave both irritated and enlightened.
