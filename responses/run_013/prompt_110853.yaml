prompt: |-
  hey — I'm a PhD student in philosophy, though my thesis is really all decision theory and formal epistemology, so this is close to home, I'm just not an expert on this particular corner. I've been stuck on expected-value fanaticism for weeks and I want to get past the version everyone repeats.

  You know the shape of it: if you're an EV maximiser, then for any action there's some gamble with a microscopic probability of an astronomical payoff that beats it, so a consistent maximiser gets Pascal's-mugged into doing practically anything. Everyone either bites the bullet or reaches for ignoring small probabilities or for risk-aversion. I don't need the definition again. What I want is the most important implications of taking fanaticism seriously — the downstream consequences, both for how you'd actually live and for the state of hte debate itself.

  Two things to make it concrete, otherwise you'll just hand me the textbook version. First, the setting I care about: I'm in a tiny giving circle — six of us, pooled donations, call it £40k a year — so I want the implications for how a small donor should actaully allocate, not just for thought experiments. Second, the bit I'm genuinely stuck on: suppose the relevant probabilities aren't known point values. Option A saves a thousand lives for sure. Option B has somewhere between a one-in-a-billion and a one-in-ten-million chance of some astronomically huge good (you pick the scale). I don't know which; I just have a range. Does fanaticism still dominate, or does the uncertainty do real work? And what does the answer imply for the rest of the fanaticism debate?

  Give it to me as a table, one row per implication, ordered by how much weight you'd put on each, with these columns:
  - implication: the consequence, in one sentence
  - basis: the argument or consideration it follows from
  - status: basically settled / live dispute / minority view, among people who actually work on this
  - defeater: what would have to be true for it to fail

  Be honest in the status column — the whole reason I'm asking is that I don't want a contested claim dressed up as the consensus. And if you think part of my framing is confused (the ranged-probability thing, say), tell me so and explain why.

  (and yeah, I know this is basically the fanaticism literature — I'm not after a reading list or citations, just the implications, sorted by how solid they are.)
