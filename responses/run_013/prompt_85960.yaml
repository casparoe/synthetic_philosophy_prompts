  The standard resolution is to use the ex-ante optimal strategy and not allow the agent to deviate. This is the approach of "consistent planning". 

  Therefore, the requirement of ex-ante optimality might override sequential rationality in imperfect recall settings. So we might have to relax sequential rationality.

  Which requirement does the most work at ruling out candidates?

  The requirement of **Belief Consistency** is very strong. It rules out arbitrary beliefs and forces a specific belief formation. Without it, the agent might form beliefs that lead to suboptimal actions.

  The requirement of **Ex-Ante/Ex-Post Coherence** is also very important and rules out theories that allow the agent to change plans without new information.

  Summary of Conflicts:

  - In the base case, sequential rationality (if interpreted as choosing the best action at the node given consistently formed beliefs) would lead to choosing to take the exit (because at p=0.5, taking gives 1/3 and passing gives 1/6). But if the agent takes with probability 1, then the survival probability is 0, which is worse than 0.25. So sequential rationality (if applied without precommitment) leads to a worse outcome. Therefore, the theory must allow for precommitment to a strategy that is not sequentially rational in the moment? Or must redefine rationality in the context of imperfect recall.

  Given the above, a theory that requires sequential rationality at every node (without precommitment) would fail in the base case because it would lead the agent to take the exit and die. Therefore, the theory must either:

    a) Allow precommitment and stick to it (so that the agent does not reconsider at the node), or
    b) Use a solution concept that incorporates the strategy in the belief formation and then finds a fixed point where the action is optimal given the beliefs and the beliefs are consistent with the strategy.

  In the fixed-point approach, we require that at the node, the agent is indifferent between taking and passing. Then we solve for p such that U(take) = U(pass). 

  From earlier:

    U(take) = (1-p)/(2-p)

    U(pass) = [1/(2-p)] * U(node)

    and U(node) = p * U(take) + (1-p) * U(pass)

  But if we set U(take) = U(pass) = U, then:

    U = [1/(2-p)] * U   => U [1 - 1/(2-p)] = 0 => either U=0 or 1 = 1/(2-p) which implies 2-p=1 => p=1.

