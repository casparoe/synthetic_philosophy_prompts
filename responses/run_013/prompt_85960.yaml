  Now, the desiderata list with the case that forces it:

  1. **Indistinguishability Handling**: Base case. The theory must prescribe a strategy for indistinguishable nodes.

  2. **Payoff Sensitivity**: Base case. The theory must account for the lethal payoffs and not recommend a strategy that leads to certain death when a better one exists.

  3. **Ex-Ante/Ex-Post Coherence**: Base case. The plan made ex ante must be consistent with the actions taken ex post, even though the agent cannot remember past actions.

  4. **Expected Utility Maximization**: Base case. The strategy must maximize expected utility.

  5. **Information Integration**: Variant (a). The theory must incorporate probabilistic clues (like 70/30) into the decision.

  6. **Multi-Agent Coordination**: Variant (b). The theory must handle multiple agents who pre-commit to a strategy and whose actions may be correlated or independent.

  7. **Precommitment Legitimacy**: Variant (c). The theory must distinguish between strategies that use available precommitment devices (if allowed) and those that do not.

  8. **Belief State Robustness**: Variant (d). The theory must handle belief states that include uncertainty about past events (how many exits have been passed).

  9. **Sequential Multi-Agent Handling**: Variant (e). The theory must handle a sequence of agents, each with the same information and each acting independently, but where the outcome depends on the actions at the actual exits.

  10. **Belief Consistency**: Base case and variants. Beliefs must be consistent with the strategy and the game tree.

  11. **Sequential Rationality**: Variant (d) and (e). Actions must be optimal at every decision node given the beliefs.

  12. **Dominance Avoidance**: Base case. The theory must avoid dominated strategies.

  13. **Correlation Handling**: Variant (b). The theory must allow for correlated strategies when agents can pre-coordinate.

  Now, which of these are fundamental and which are habits of a camp?

  - The requirement of expected utility maximization is fundamental to rational choice.
  - Sequential rationality is fundamental in extensive-form games.
  - Belief consistency (in the sense of consistency with the strategy) is also fundamental (as in perfect Bayesian equilibrium).
  - The requirement of ex-ante/ex-post coherence is particularly challenging in imperfect recall and is the source of the paradox. Some theories (like the consistent planning of Piccione and Rubinstein) emphasize ex-ante optimality, while others (like the multi-selves approach) might emphasize sequential rationality. There is a literature on this conflict.

  Are any two requirements incompatible?

  In the base case, the requirement of sequential rationality and ex-ante optimality are not in conflict because the optimal ex-ante strategy (p=0.5) is also the one that is sequentially rational when beliefs are set consistently (as we saw, the expected utility at a node is p(1-p), so setting p=0.5 maximizes it, and at the node, the agent is indifferent between taking and passing only if p=0.5? Let's see: at a node, U(take)= (1-p)/(2-p) and U(pass)= [1/(2-p)] * U(node) = [1/(2-p)] * p(1-p). At p=0.5, U(take)= (0.5)/(1.5)=1/3, U(pass)= (1/1.5)*(0.25)= (2/3)*(1/4)=1/6. So U(take) > U(pass). Therefore, at the node, the agent prefers to take the exit. But if he sets p=1 (always take), then survival probability is 0. So there is a conflict: at the node, the agent would want to take the exit (because U(take)= (1-p)/(2-p) and at p=0.5 it is 1/3, which is greater than U(pass)=1/6). But if he takes with probability 1, then he dies at the first exit. So if he sets p=1, then U(take)= (1-1)/(2-1)=0, and U(pass)= (1/(2-1))*0=0. So at p=1, the agent is indifferent. But at p=0.5, he prefers to take. So the optimal strategy at the node (if he could choose p at the node) would be to take. But that leads to death. This is the conflict.

  The resolution in the literature is that the agent must precommit to p=0.5. At the node, if he has precommitted to p=0.5, then he flips the coin and does not deviate. But if he can reconsider at the node, he would want to take. Therefore, the theory must either allow precommitment (and not allow reconsideration) or must find a way to make the strategy sequentially rational.

