  ### **Key Takeaway**  
  For your scene to work, the protagonist must **pre-commit to a mixed strategy** (e.g., flip a coin at each exit with \( p = 0.5 \) in the base case, or \( p = 0.714 \) in variant (a)). Any theory rejecting this fails the desiderata. The tension arises because rationality demands:  
