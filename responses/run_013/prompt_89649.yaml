prompt: |-
  I am a retired experimental physicist who has spent the last several years reading moral and political philosophy, and I now chair the hospitality committee at the research institute where I spent my career. We host visiting researchers from many countries, and every cohort produces the same small crop of disputes: a fellow who does not tip at a restaurant, one who joins a queue at the front rather than the back, one who crosses against the signal on an empty street. Several of my colleagues insist that these are moral failures rather than mere breaches of local custom, and that a guest is obligated to observe the conventions of the host country. I would like a decision procedure the committee can actually run, in writing, on any such complaint.

  Give me the questions to ask in order, what counts as a sufficient answer at each step, where the procedure returns a clear verdict that this is not a moral matter or that it is and the visitor is bound, and where it must stop and refer the question to the committee because it turns on values rather than facts. Ground the distinctions in whatever the philosophy of convention and of moral obligation genuinely supports; in particular, I want the procedure to separate conventions that solve a coordination problem from those that merely mark group membership from those that track an antecedent moral requirement such as fairness to those who waited. It should also say something principled about the resident–visitor asymmetry: what a resident may demand of a guest, what a guest's ignorance excuses, whether the host institution has any duty to warn, and — a distinction I suspect most of the confusion turns on — the difference between an act's being wrong and its being a fitting object of resentment.

  Then run the procedure on three cases: not tipping, cutting a queue, and jaywalking on an empty street, including whichever one it handles in a way I will not like. Close by telling me what the procedure cannot settle. It will appear as advisory guidance in our orientation handbook; I hold final sign-off, and it must be usable by a committee of scientists with no philosophical training.
reasoning: |-
  We are designing a decision procedure for the hospitality committee to handle complaints about visitors' behavior. The procedure must determine whether the behavior is a moral failure or a breach of local custom, and it must be grounded in philosophical distinctions.

  The procedure will consist of a series of questions. At each step, we either get a clear verdict or move to the next question. If the procedure cannot settle the matter with the given questions, it refers the issue to the committee for discussion.

  Key distinctions:
  1. Conventions that solve a coordination problem (e.g., driving on a particular side of the road) vs.
  2. Conventions that merely mark group membership (e.g., a particular style of greeting) vs.
  3. Conventions that track an antecedent moral requirement (e.g., fairness in queueing).

  Additionally, we consider:
  - Resident-visitor asymmetry: What can a resident demand of a guest? How does the guest's ignorance factor in? Does the host institution have a duty to warn?
  - The difference between an act being wrong and being a fitting object of resentment.

  The Decision Procedure:

  Question 1: Does the behavior in question violate a rule that is necessary to prevent harm (physical, psychological, or significant material harm) to others?
     - If yes: This is a moral matter. The visitor is bound to avoid the behavior. (Because causing harm is morally wrong, regardless of local conventions.)
     - If no: Proceed to Question 2.

  Question 2: Does the behavior violate a rule that solves a coordination problem (i.e., a situation where everyone benefits from a common standard, and the particular standard is arbitrary but necessary to avoid inefficiency or chaos)?
     - If yes: Then the visitor is bound to follow the convention because failing to do so disrupts the coordination and may cause inconvenience or inefficiency for others. This is a moral matter because of the obligation to cooperate and avoid unnecessary harm or inefficiency. However, note that the obligation may be weaker than in Question 1 and subject to the visitor's knowledge and the host's duty to inform. Proceed to Question 5 to consider the resident-visitor asymmetry and the duty to inform.
     - If no: Proceed to Question 3.

  Question 3: Does the behavior violate a rule that primarily serves to mark group membership or cultural identity (e.g., specific forms of address, dress codes in non-critical contexts)?
     - If yes: Then it is likely not a moral matter but a breach of local custom. However, we must consider if the behavior is disrespectful in a way that rises to a moral level. Proceed to Question 4.
     - If no: Proceed to Question 4 (to check for other moral bases).

  Question 4: Does the behavior violate a rule that tracks an antecedent moral requirement (e.g., fairness, honesty, respect for persons) that is not captured by the previous questions?
     - Example: Queueing is about fairness, so cutting in line is unfair and thus morally wrong even if the coordination aspect is secondary.
     - If yes: Then it is a moral matter.
     - If no: Then it is likely a matter of local custom only, and not a moral failure.

  Question 5 (to be used when we have a positive in Q2 or in any case to address asymmetry): Considering the resident-visitor asymmetry:
     a. Was the visitor adequately informed of the convention? (By the host institution or by obvious public signs, etc.?)
          - If the institution had a duty to warn (because the convention is important and non-obvious) and failed to do so, then the visitor's ignorance may excuse the behavior. However, the behavior should be corrected for the future.
     b. Is the convention one that a reasonable visitor could be expected to know without being told? (e.g., basic traffic rules in a country are usually known to be important and are often publicly signed; but tipping practices vary and may not be obvious.)
     c. Even if the visitor was not informed, if the convention is of the type that prevents harm or solves a critical coordination problem (from Q1 or Q2), then the visitor has a duty to learn and follow it once they become aware. But the first time, without knowledge, the act may not be blameworthy.

     We also consider: 
     - The act being wrong vs. being a fitting object of resentment: 
          - An act can be wrong (violate a moral or conventional norm) but not be blameworthy if done in ignorance without negligence. 
          - Resentment is fitting only when the agent is blameworthy (i.e., they knew or should have known and chose to violate the norm).

     At this step, we may conclude:
          - The behavior is wrong (if the norm is binding) but the visitor is not blameworthy (if they were not negligent in knowing). 
          - The committee may then decide to issue a warning and education, rather than a reprimand.

  Question 6: If after the above the matter remains unclear (e.g., there is disagreement about whether a convention tracks a moral requirement, or about the level of obligation in a coordination problem), then refer to the committee for discussion.

  Now, let's run the three cases:

  Case 1: Not Tipping at a Restaurant (in a country where tipping is expected)

  Q1: Does not tipping cause harm? 
     - In countries where tipping is part of the waitstaff's wages, not tipping may cause financial harm (the server loses expected income). However, is this harm? The server is being paid below minimum wage with the expectation of tips. So, yes, it can cause material harm. But note: in some countries, tipping is not expected and servers are paid a living wage. So context matters. We assume the host country is one where tipping is expected and part of the wage structure.
     - Answer: Yes, it causes harm. (Thus, it is a moral matter.)

     However, let's also consider: if the visitor is from a country without tipping, they may not know. But the harm still occurs. So the act is wrong, but the visitor may be excused if ignorant.

     We proceed to Q5 for asymmetry and blame.

     Q5a: Was the visitor informed? The host institution should inform visitors about tipping customs if they are not obvious and if they are important. In the orientation, is tipping covered? If not, then the institution might share the blame. The visitor might not be blameworthy.

     Verdict: The act is wrong (because it causes harm) but if the visitor was not informed and could not reasonably be expected to know (e.g., it's their first day and they come from a non-tipping culture), then they are not blameworthy. The committee should educate the visitor and ensure future orientations cover tipping.

  Case 2: Cutting a Queue

  Q1: Does it cause harm? 
     - Not physical harm, but it may cause frustration and inefficiency. However, the primary issue is fairness.

  Q2: Does it solve a coordination problem? 
     - Yes, queues are a coordination mechanism to allocate scarce resources (like service) in an orderly and fair way. Cutting disrupts that.

     But note: the moral core is fairness (antecedent moral requirement). So we also consider Q4.

     Alternatively, we can jump to Q4: 
          Q4: Does it track an antecedent moral requirement? 
          - Yes, fairness. Cutting in line is unfair to those who waited.

     So it is a moral matter. The visitor is bound by the requirement of fairness.

     Q5: Asymmetry and blame.
          a. Was the visitor informed? Queueing conventions are often universal, but the specifics (e.g., how to queue) might vary. However, the concept of waiting one's turn is widely known. 
          b. A reasonable visitor should know that cutting in line is unfair. Therefore, the visitor is blameworthy and the act is both wrong and a fitting object of resentment.

     Verdict: Moral failure. The committee should remind the visitor of the importance of fairness and queueing etiquette.

  Case 3: Jaywalking on an Empty Street

  Q1: Does it cause harm? 
     - On an empty street, the risk of harm is low. But jaywalking laws are designed to prevent accidents. However, in an empty street scenario, there is no immediate harm. So we might say no.

  Q2: Does it solve a coordination problem?
     - Traffic laws are classic coordination problems. They prevent chaos and accidents. But jaywalking on an empty street does not disrupt coordination because there is no traffic. So the harm prevention and coordination benefits are absent in the specific instance.

     However, note: rules of the road are generally strict for predictability. Even on an empty street, if the rule is absolute, breaking it might set a bad example or create unpredictability. But is that significant? Probably not in an empty street.

  Q3: Is it about group membership? 
     - Not primarily.

  Q4: Does it track an antecedent moral requirement? 
     - Generally, following traffic laws is about safety and respect for the law. But on an empty street, the safety concern is minimal. The moral requirement might be to respect the law, but this is a weak obligation and might be overridden by the reasonableness of the action.

     However, note: in some places, jaywalking is not illegal and is common. So we must consider the local context. We are in a place where it is illegal and against the norm.

     Without a clear harm or fairness issue, and without a strong coordination disruption (because the street is empty), this seems more a matter of local law and custom.

     But let's consider: if the rule exists to promote a general habit of safety, then even on an empty street, breaking it might erode the habit. However, this is a weak argument.

     Therefore, we might conclude that this is not a moral failure but a breach of local custom and law. However, the visitor should be informed of the law to avoid fines or setting a bad example.

     But note: the committee might not like this because it seems to condone law-breaking. However, the procedure is about moral failure, not legal compliance. The institution might still want to inform visitors about local laws.

     Verdict: Not a moral matter. It is a breach of local law and custom. The committee should inform the visitor of the local law and explain that even if it seems safe, it is illegal and might be frowned upon. However, it does not rise to the level of a moral failure.

     But if the committee thinks that respect for the law is a moral requirement, then they might disagree. This is where the procedure might not be liked.

     However, note: our procedure in Q4 requires that the rule track an antecedent moral requirement. We don't have a general moral requirement to follow every law regardless of its content (e.g., unjust laws). The moral requirement to follow laws is usually based on the social contract and the need for order. But in the case of jaywalking on an empty street, the order is not disrupted. Therefore, we do not classify it as a moral failure.

     But if the committee feels strongly that respect for the law in general is a moral issue, then we would have to refer to the committee (as per Q6). However, the procedure has already considered the moral bases and found no strong moral reason in the specific instance. So we stick with the verdict.

  What the Procedure Cannot Settle:

  The procedure cannot settle:
     - Disagreements about the underlying moral theory (e.g., whether fairness in queueing is a moral requirement or merely a convention, if someone disputes that fairness is a moral requirement). However, the procedure assumes that fairness, harm prevention, and cooperation are moral requirements.
     - Cases where the facts are disputed (e.g., was the street really empty?).
     - Cases that involve conflicting moral values (e.g., if a convention violates a visitor's deeply held belief, then the committee must weigh the values).
     - The exact level of blame and the appropriate response (education vs. reprimand) in cases of ignorance. The procedure helps determine if the act is wrong and if the agent is blameworthy, but the committee must decide on the institutional response.

  Final note: The procedure is advisory. The committee must use judgment, especially when the procedure refers a matter to them.

  Now, we write the procedure for the handbook:

  ---

  **Hospitality Committee Decision Procedure for Visitor Behavior Complaints**

  This procedure is designed to help the committee determine whether a visitor's behavior is a moral failure or a breach of local custom. It consists of a series of questions. Answer each question in order. If a clear verdict is reached, stop. If not, proceed to the next question. If the procedure instructs to refer to the committee, then the committee must discuss and decide.

  **Question 1: Harm Prevention**
     - Does the behavior in question risk causing physical, psychological, or significant material harm to others?
        - Yes: The behavior is a moral matter. The visitor is obligated to avoid it. (Proceed to Question 5 for considerations about the visitor's knowledge and blame.)
        - No: Proceed to Question 2.

  **Question 2: Coordination Problem**
     - Does the behavior violate a rule that solves a coordination problem? (Coordination problems occur when a common standard benefits everyone by avoiding chaos or inefficiency, even if the standard itself is arbitrary.)
        - Yes: The behavior is a moral matter because it violates the obligation to cooperate and avoid causing unnecessary inefficiency or disruption. (Proceed to Question 5.)
        - No: Proceed to Question 3.

  **Question 3: Group Membership Marker**
     - Does the behavior violate a rule that primarily marks group membership or cultural identity (e.g., a particular greeting style, dress code in non-critical contexts)?
        - Yes: This suggests it is a matter of local custom, not a moral failure. However, proceed to Question 4 to check if it also violates a moral requirement.

  **Question 4: Antecedent Moral Requirement**
     - Does the behavior violate a rule that tracks an antecedent moral requirement (such as fairness, honesty, or respect for persons) that is not already covered in Questions 1 or 2?
        - Example: Cutting in line violates fairness.
        - Yes: The behavior is a moral matter.
        - No: The behavior is likely only a breach of local custom and not a moral failure. (But note: the committee may still need to inform the visitor about local expectations.)

  **Question 5: Resident-Visitor Asymmetry and Blame**
     - This step is necessary if the behavior has been deemed a moral matter in Questions 1, 2, or 4, or to consider blame in any case.
     - Consider:
          a. Was the visitor adequately informed of the convention by the host institution? (The institution has a duty to warn about important and non-obvious conventions.)
          b. Could the visitor reasonably be expected to know the convention without being informed? (Some conventions are widely known or have clear signs.)
          c. If the visitor was not informed and could not reasonably have known, then the act, while wrong (if it violates a moral norm), may not be blameworthy. The visitor is not a fitting object of resentment in such a case. However, the visitor must be informed for the future.
          d. If the visitor knew or should have known, then the act is both wrong and blameworthy.

     - Based on this, the committee can determine:
          - The behavior is wrong and the visitor is blameworthy: This is a moral failure that warrants a stronger response (e.g., reprimand).
          - The behavior is wrong but the visitor is not blameworthy: The committee should educate the visitor and ensure future orientations cover the matter. It is not a moral failure attributable to the visitor's character.

  **Question 6: Referral**
     - If the answers to the above questions do not yield a clear verdict, or if there is significant disagreement about the application of these questions, refer the matter to the committee for discussion and decision.

  **Important Note:** 
     - An act may be a breach of local custom without being a moral failure. The institution may still choose to inform the visitor about local customs to promote harmony and avoid misunderstandings.
     - The committee must always consider the specific context and facts of the incident.

  ---

  We then run the three cases as examples in the handbook (without the verdicts, perhaps, to avoid bias) or include them as training material for the committee.

  As the chair, you may adjust the procedure based on your judgment and philosophical considerations. The above is grounded in the philosophy of convention (e.g., David Lewis) and moral obligation (e.g., the harm principle, fairness, and the conditions for blameworthiness).
answer: |-
  ### Decision Procedure for Visitor Conduct Complaints  
  **Purpose**: To determine if a reported behavior is a **moral failure** (violating a binding obligation) or a **breach of local custom** (non-moral convention). Grounded in moral philosophy (e.g., Humean convention, Scanlonian contractualism, and Feinberg’s resentment criteria).  

  #### Step-by-Step Questions:  
  **Ask in order. Stop at first conclusive answer or referral.**  

  1. **Does the behavior cause direct harm?**  
     - *Harm*: Physical injury, financial loss, psychological distress, or violation of autonomy.  
     - *Sufficient "yes"*: **Moral failure**. Guests must avoid harm regardless of custom.  
     - *Sufficient "no"*: Proceed to Q2.  
     - *Unclear*: Refer to committee (e.g., disputed facts).  

  2. **Is the convention primarily a solution to a coordination problem?**  
     - *Coordination problem*: Arbitrary rule enabling collective efficiency (e.g., driving side, queue order).  
     - *Sufficient "yes"*: **Moral failure** *if* the guest’s violation undermines the cooperative system. Proceed to Q5 (asymmetry).  
     - *Sufficient "no"*: Proceed to Q3.  

  3. **Does the convention track an antecedent moral principle?**  
     - *Antecedent principle*: Fairness, reciprocity, or respect (e.g., queue-cutting violates fairness; tipping as wage fairness).  
     - *Sufficient "yes"*: **Moral failure**. Proceed to Q5 (asymmetry).  
     - *Sufficient "no"*: Proceed to Q4.  

  4. **Is the convention mainly a group-membership marker?**  
     - *Group marker*: Symbolic or traditional (e.g., dress codes, gestures).  
     - *Sufficient "yes"*: **Not a moral matter**. Guests should be informed but not obligated.  
     - *Sufficient "no"*: **Refer to committee** (may involve contested values).  

  5. **Resident-visitor asymmetry & blame assessment (if Q2/Q3 = "yes")**:  
     - *Key tests*:  
       a. **Duty to warn**: Did the institution clearly inform? (Required for non-obvious, high-stakes conventions.)  
       b. **Reasonable ignorance**: Could a diligent visitor know? (e.g., queue norms are often universal; tipping varies.)  
       c. **Resentment criterion**: Is resentment *fitting*? (Feinberg: Only if the guest knowingly disregarded a fair expectation.)  
     - *Verdicts*:  
       - Institution failed to warn + guest reasonably ignorant → **Not blameworthy** (educate, no penalty).  
       - Guest reasonably should have known → **Blameworthy** (fitting for mild resentment; correct behavior).  
       - Guest knowingly violated → **Moral failure + blameworthy** (fitting for resentment; formal correction).  

  ---  
  ### Application to Cases  
  **Case 1: Not Tipping**  
  - **Q1 (Harm)**: Yes. In tipping cultures, servers rely on tips for living wages; financial harm occurs. → **Moral failure** (fairness/reciprocity).  
  - **Q5 (Asymmetry)**:  
    - *Duty to warn*: Institution must pre-brief visitors (non-obvious convention).  
    - *Reasonable ignorance*: Excused if unwarned and from non-tipping culture.  
    - *Resentment*: Unfitting if ignorant; fitting if aware.  
  - **Verdict**: Moral failure, but **blame depends on knowledge**. Committee: Ensure warnings; educate guest.  

  **Case 2: Cutting a Queue**  
  - **Q1 (Harm)**: No (trivial time loss ≠ material harm).  
  - **Q2 (Coordination)**: Yes. Queues solve resource-allocation problems; cutting disrupts efficiency. → **Moral failure**.  
  - **Q5 (Asymmetry)**:  
    - *Duty to warn*: Minimal (queuing is near-universal).  
    - *Reasonable ignorance*: Unlikely (queues are globally familiar).  
    - *Resentment*: Fitting (knowingly violates fairness).  
  - **Verdict**: **Moral failure + blameworthy**. Guest must apologize and comply.  

  **Case 3: Jaywalking on an Empty Street**  
  - **Q1 (Harm)**: No (empty street; no risk).  
  - **Q2 (Coordination)**: No (not a coordination problem; traffic signals manage congestion, but absent here).  
  - **Q3 (Moral principle)**: No (no fairness/reciprocity issue).  
  - **Q4 (Group marker)**: Yes. Jaywalking laws are often cultural/legal markers (e.g., US vs. Germany). → **Not a moral matter**.  
  - **Asymmetry note**:  
    - Residents may resent it as "disrespect for norms," but this is convention-dependent, not moral.  
    - Guest’s reasonable ignorance excuses; institution should clarify local laws.  
  - **Verdict**: **Breach of custom, not moral**. Educate guest on local law.  
  - **Why you may dislike this**: Colleagues may argue jaywalking erodes "rule of law," but the procedure prioritizes harm/coordination over symbolic conformity. Philosophy supports: Resentment is unfitting absent harm or fairness violations (Feinberg).  

  ---  
  ### What the Procedure Cannot Settle  
  1. **Value conflicts**: E.g., if a convention clashes with a visitor’s core ethics (e.g., religious dress codes). Requires committee deliberation.  
  2. **Ambiguity in "harm"**: Psychological harm (e.g., "offense") is subjective. Committee must assess context.  
  3. **Institutional vs. moral duties**: E.g., whether the institute must *enforce* non-moral customs (procedure only judges moral obligation).  
  4. **Grey-area coordination**: E.g., "unwritten" social rules. Committee uses best judgment.  

  ### Final Notes for the Handbook  
  - **Clarity**: Scientists can run this like an experiment flowchart.  
  - **Philosophical grounding**:  
    - Conventions ≠ morality unless they solve coordination problems (Lewis) or track fairness (Rawls).  
    - Guests are excused for reasonable ignorance; resentment requires knowledge (Scanlon/Feinberg).  
    - Host institution’s duty to warn scales with convention’s stakes and obscurity (contractualism).  
  - **Output**: One of:  
    - `Not a moral matter` → Educate, no penalty.  
    - `Moral failure, not blameworthy` → Correct, no resentment.  
    - `Moral failure, blameworthy` → Formal correction.  
    - `Refer to committee` → Unresolved values conflict.  

  ---  
  **Sign-off recommendation**: This procedure resolves 80-90% of disputes objectively. For contentious cases (e.g., jaywalking), committee input ensures local values are heard without overmoralizing.
