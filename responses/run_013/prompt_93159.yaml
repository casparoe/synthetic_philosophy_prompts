prompt: |-
  I'm second year in a phil of science PhD and my thesis keeps drifting into Jeffrey conditionalization and updating on uncertain evidence, which is fine except I've realized I've been collecting objections and puzzle cases for a year without ever writing down what a theory here is supposed to do. Before I pick a side I want the spec. So: give me the desiderata list for a theory of how an agent should update its credences when what comes in isn't a proposition it's certain of, but something weaker — a shift in confidence, a noisy readout, a soft signal. Purpose I care about: I want a rule I can both defend in a phil paper and actually implement in a pipeline that ingests soft signals, so adequacy = gets the right answers on the cases below and doesn't need machinery I can't state out loud.

  Requirements I want, each with the case that motivates it, and tell me which are non-negotiable and which are just what one camp happens to want:

  - the classic case: I look at a swatch in bad light and come away 0.7 on green, 0.3 on blue. Any adequate rule gives an answer here, and it should be the standard-looking one — the old conditional probabilities of other hypotheses given green / given blue stay put, the new numbers on the partition are just the input. But say what that stay-put requirement (rigidity) is actually doing, and whether it's a genuine requirement or a substantive assumption in disguise.
  - must reduce to plain conditionalization when the input is certainty. Non-negotiable, I assume.
  - the input problem, which I think is the real one: on the version where the input isn't a proposition at all, just a change in credence, what stops any change of mind from counting as an observation? I want a requirement that seperates learning from wishful thinking, and I want to know if it can be met without smuggling propositions back in.
  - partition choice. The rule only fires once you've said which partition the evidence lives on. If all I learn is that my credence in H should now be 0.8, what fixes the partition? Is there a requirement here or is this just a hole.
  - order effects. Successive updates by the rule generally don't commute — I worked a two-hypothesis example and the two orders gave me different posteriors. So do I demand commutativity for evidence that's intuitively independent (two different soft classifiers on the same image; the same net run twice with dropout), or is the order-dependence a feature I should embrace?
  - related, and I haven't seen anyone put it this way: the rule is invertible. Any input that takes me from P to P' can be undone by a later input, because rigidity is preserved either way. Should I require no-unlearning — evidence, once in, can't be washed out by a later soft input — and if so does that collide with rigidity or with the previous bullet?
  - auditability: I want to be able to read the input back off the before/after pair. Contrast the graphical-models move of encoding the uncertainty as a likelihood ratio and conditioning on a dummy node, where the posterior doesn't tell you what likelihood you took in. Is auditability a real desideratum or an engineering prejudice of mine?
  - the case where the evidence bears on the conditional structure itself and not just the marginal — I learn my colour vision is off, so P(green | it looks green) moves. Any rule that fixes the conditionals in advance seems to have nothing to say here. Requirement or counterexample?

  Then flag any subset of these you think can't be jointly satisfied. Thats the part I most want. A short scorecard at the end is fine — plain conditioning, Jeffrey's rule, the dummy-node likelihood trick, and the option of insisting that all evidence is propositional after all and just conditioning on the experience. Keep the weight on the criteria though, I'll fight about the contenders in my chapter.
reasoning: |-
  Okay, let me tackle this user's query. They're a second-year PhD student in philosophy of science, working on their thesis about Jeffrey conditionalization and updating on uncertain evidence. They've been collecting objections and puzzle cases but haven't defined what a theory should actually do. Now they want a list of desiderata for such a theory, with specific cases motivating each requirement. They also want to know which desiderata are non-negotiable and which might be contentious, plus any conflicts between them.

  First, I need to understand their main concerns. They want a rule that's both philosophically defensible and practically implementable. The key is balancing theoretical rigor with computational feasibility. Their mention of "pipeline that ingests soft signals" suggests they care about real-world applications, maybe in AI or decision systems. 

  Looking at their listed requirements: The classic bad light swatch case (70-30 green/blue) sets the baseline—any rule must handle this and enforce rigidity (keeping conditionals fixed). Then reduction to Bayes when input is certain—this seems essential. The input problem is crucial: distinguishing learning from arbitrary belief changes. Partition choice is a known issue in Jeffrey's framework. Order effects and invertibility relate to sequential updates. Auditability matters for transparency, especially in applied contexts. Finally, handling shifts in conditional probabilities (like impaired color vision) challenges fixed rigidity.

  For each point, I consider: What's the core demand? Which cases motivate it? How do existing approaches (Jeffrey, dummy node, propositional insistence) handle it? Where might tensions arise? The big conflicts seem to be between rigidity and conditional shifts, auditability vs dummy-node opacity, and partition dependence vs input freedom. Also, invertibility might clash with no-unlearning if we want evidence to be indelible.

  The user's unspoken need might be clarity on whether a "pure" non-propositional approach can satisfy all desiderata, or if compromises (like dummy nodes) are inevitable. Their focus on implementability suggests they'll prioritize solutions that don't require mystical priors or inaccessible propositions. I should flag where desiderata conflict outright—e.g., you can't have full rigidity AND handle conditional shifts—and where existing frameworks hit limits.
answer: |-
  Here's a desiderata list for a theory of updating on uncertain evidence, grounded in your cases and requirements. I'll flag negotiability, core tensions, and a scorecard at the end.

  **Core Desiderata for Uncertain Evidence Update Rules:**

  1.  **Basic Adequacy & Rigidity (The Classic Swatch Case):**
      *   **Requirement:** Given an input specifying new credences `P_new(E_i)` over a partition `{E_1, E_2, ..., E_n}`, the rule must produce a new credence function `P_new`. Crucially, *conditional probabilities given the partition elements must be preserved*: `P_new(H | E_i) = P_old(H | E_i)` for all hypotheses `H` and all `E_i`. The new credences for hypotheses are `P_new(H) = Σ_i [P_new(E_i) * P_old(H | E_i)]`.
      *   **Motivation:** Your swatch case. The bad light shifts confidence *between* green/blue but shouldn't change what those hypotheses imply about other things (e.g., "if it *were* green, what's the probability it's emerald?" remains fixed).
      *   **What Rigidity Does:** It isolates the evidential impact *to the partition*, preventing arbitrary global belief shifts. It leverages the agent's existing conditional structure.
      *   **Negotiability:** **Non-Negotiable for Basic Functionality.** This *defines* the core Jeffrey-type update. Violating rigidity means the input isn't *just* about the partition elements; the agent is also learning something about the relationships *between* those elements and other propositions, which contradicts the input specification. It's a substantive *constraint* inherent to this type of update, defining what "just getting evidence about the partition" means.

  2.  **Reduction to Conditionalization (Certain Input):**
      *   **Requirement:** If the input specifies `P_new(E_k) = 1` for some `E_k` (certainty), the rule *must* yield `P_new(H) = P_old(H | E_k)` for all `H`.
      *   **Motivation:** Foundational coherence. Updating on uncertain evidence should generalize standard Bayesian updating.
      *   **Negotiability:** **Non-Negotiable.** Failing this breaks the connection to the bedrock of Bayesianism.

  3.  **The Input Problem (Distinguishing Learning from Arbitrary Change):**
      *   **Requirement:** The rule must incorporate a *constraint* on what constitutes valid evidential input. It cannot treat *any* arbitrary shift `P_old(H) -> P_new(H)` as "evidence about H". There must be a principled way to specify *which* partition the evidence pertains to and *how strongly*.
      *   **Motivation:** Preventing wishful thinking, hallucinations, or rationalizing existing biases from counting as evidence. If I just decide `P_new(H) = 0.8` because I want it to be true, is that "evidence"?
      *   **What Solves It (The Crux):**
          *   **Option A (Propositions Smuggled In):** The input *is* propositional, describing an event/experience (e.g., "I had an experience as of greenness with confidence 0.7"). Conditioning on *this proposition* (using its likelihood given `Green`/`Blue`) avoids the problem but abandons pure non-propositionalism. (The "dummy node" trick *is* this).
          *   **Option B (Exogenous Constraint):** Inputs must be *externally specified* forces acting *only* on the designated partition credences. The rule *itself* doesn't distinguish learning from desire; the *source/origin* of the input does. The rule merely dictates *how* to consistently update *given* such an input is accepted as evidence. **This is the Jeffrey framework's stance.**
      *   **Negotiability:** **Non-Negotiable Requirement, Deeply Problematic Implementation.** You *must* have *some* constraint. Pure Jeffrey offers Option B: the input is *stipulated* as being "about" partition `{E_i}`. This pushes the problem upstream to epistemology/philosophy of mind: what justifies accepting an input as evidential *about that partition*? The rule *itself* provides no answer. Meeting this *without smuggling propositions* requires accepting Option B and its limitations.

  4.  **Partition Choice (The Ambiguity Hole):**
      *   **Requirement:** (Ambiguous) If the input is only `P_new(H) = 0.8`, the rule needs a *partition* to apply rigidity. What fixes this partition?
      *   **Motivation:** The minimal input case. What if I only get an updated credence for `H`, not for a full partition `{E_i}`?
      *   **The Hole:** This is a **fundamental limitation** of the basic Jeffrey rule. The rule *requires* the input to specify the entire partition `{E_i}` and `P_new(E_i)` for each element. Inputting *only* `P_new(H) = 0.8` is *underspecified* for the rule. The agent *must choose* a partition `{H, Not-H}` or `{H, A, B, C,...}` where `Not-H = A∨B∨C∨...` and specify `P_new(Not-H)` or the `P_new(A)`, `P_new(B)`, etc. **There is no unique, principled way within the rule itself to determine this partition solely from `P_old` and `P_new(H)=0.8`.**
      *   **Negotiability:** **Not a Requirement the Rule Can Solve Alone.** This highlights that the input *must* specify the partition. The desideratum here is *recognition* of this limitation. Any adequate theory must either accept that the partition is part of the input specification (Jeffrey) or provide a compelling, general solution to partition selection given minimal inputs (an unsolved problem).

  5.  **Order Effects / Commutativity:**
      *   **Requirement:** Should updates based on evidence intuitively pertaining to *independent* aspects of the world commute? `Update_A then Update_B` should equal `Update_B then Update_A`.
      *   **Motivation:** Two different soft classifiers on the same image; same net run twice with dropout. The order shouldn't matter if they provide independent information.
      *   **Reality:** Basic Jeffrey updates **do not commute** in general, even for intuitively independent evidence. Successive Jeffrey updates on different partitions will typically yield different results depending on order.
      *   **Negotiability:** **Negotiable / Contextual.** Commutativity is *desirable* for independent evidence but is **not a core requirement** of the Jeffrey framework. Order-dependence reflects how the *first* update changes the agent's credences over the partition relevant to the *second* update, altering the base for rigidity. This can be seen as a feature capturing the context-sensitivity of evidence interpretation. Demanding universal commutativity is likely incompatible with rigidity unless the partitions are probabilistically independent *and* the inputs are specified in a very specific way (e.g., likelihood ratios).

  6.  **Invertibility / No-Unlearning:**
      *   **Requirement A (Invertibility):** For any update `P_old -> P_new` via the rule on input `I`, there should exist an input `I'` (according to the same rule) that takes `P_new` back to `P_old`.
      *   **Requirement B (No-Unlearning):** Genuine evidence, once incorporated, cannot be completely "washed out" by subsequent *soft* evidence updates alone. Some permanent trace should remain.
      *   **Motivation:** (Invertibility) Debugging, theoretical elegance, potential for belief revision. (No-Unlearning) Intuition that evidence leaves a lasting mark; preventing volatile belief swings.
      *   **Status:**
          *   **Invertibility:** Jeffrey updates **are invertible** in principle. Given `P_old`, `P_new`, and the partition `{E_i}` used, you can compute the input `P_new(E_i)` that caused the shift. Rigidity is preserved backward.
          *   **No-Unlearning:** **Highly Negotiable & Collides with Rigidity/Invertibility.** Rigidity + Invertibility *allows* washing out. Suppose evidence `I1` shifts `P(E1)` up. Later evidence `I2` could shift `P(E1)` back down to its original value *while preserving rigidity*. If `I2` is accepted as legitimate evidence, the net effect washes out `I1`. Requiring No-Unlearning would violate either the commitment to rigidity (by demanding conditional probabilities *change* irreversibly based on past inputs) or invertibility (by making some belief states unreachable from others). It's more an epistemological constraint on *what inputs count as evidence* than on the update rule itself.

  7.  **Auditability (Reading the Input):**
      *   **Requirement:** Given `P_old` and `P_new`, it should be possible to uniquely identify the input (partition `{E_i}` and `P_new(E_i)`) that caused the update via the rule.
      *   **Motivation:** Debugging models, understanding agent history, ensuring transparency (especially in pipelines). Contrasts with dummy-node likelihood, where `P_new` only reveals the posterior over hypotheses, not the likelihood ratio used.
      *   **Status:** Jeffrey updates **are auditable**. Given `P_old` and `P_new`, *if* you know the partition `{E_i}` that was updated, you can directly read off `P_new(E_i)` (it's just the marginal). Rigidity allows reconstruction: `P_old(H | E_i) = P_new(H | E_i)` for any `H`. **However, identifying the *partition* itself is not auditable.** `P_new` doesn't tell you *which* partition the input was applied to. (See Partition Choice hole).
      *   **Negotiability:** **Highly Desirable for Implementation, Partially Achieved.** Auditability of the *input values given the partition* is a strength of Jeffrey vs. dummy-node. Auditability of the *partition choice* itself is impossible from `P_old`/`P_new` alone and relies on external metadata/logging.

  8.  **Handling Shifts in Conditional Structure (The Calibration Case):**
      *   **Requirement:** The rule should accommodate evidence that directly impacts the agent's conditional probabilities `P(H | E)` (linking hypotheses to potential evidence), not just marginal credences over `E`.
      *   **Motivation:** Learning your color vision is unreliable: `P(Green | Looks Green)` decreases. Learning a sensor's accuracy changed. This evidence *changes the meaning* of future "looks green" experiences.
      *   **Challenge:** Rigidity *fixes* `P(H | E_i)` during an update on `{E_i}`. The rule has no mechanism to *change* these conditionals based on evidence. This evidence acts at a "higher level".
      *   **Negotiability:** **Counterexample / Beyond Scope.** This is a **fundamental limitation** of Jeffrey conditionalization *as a primitive update rule*. It assumes the conditional structure (`P_old(H | E_i)`) is stable. Handling this requires either:
          *   **Propositionalizing:** Treating the calibration evidence ("my vision is impaired") as a proposition `C`, conditioning on `C`, which *changes* `P(H | Looks Green)` within the model.
          *   **Higher-Order Modeling:** Extending the belief state (e.g., representing uncertainty over reliability models) and applying standard/Jeffrey updates within this larger space.
          *   **Radical Revision:** Using a different update rule (e.g., minimizing some divergence under new constraints on conditionals). Jeffrey's rule itself **cannot** directly satisfy this requirement.

  **Conflicts & Trade-offs:**

  1.  **Rigidity (1) vs. Conditional Shifts (8):** **Direct Conflict.** You cannot keep conditionals rigid *and* have a rule that fundamentally changes them based on evidence. Rigidity defines Jeffrey; handling (8) requires moving beyond it.
  2.  **Pure Non-Propositional Input (3-Option B) vs. Auditability (7) / Handling Conditional Shifts (8):** Insisting evidence isn't propositional makes solving the input problem epistemologically harder, complicates auditability (what *was* the evidence?), and makes handling conditional shifts nearly impossible without introducing propositions or models.
  3.  **Rigidity (1) & Invertibility (6) vs. No-Unlearning (6):** Rigidity and Invertibility together *allow* unlearning. Enforcing No-Unlearning requires breaking one of them or restricting admissible inputs.
  4.  **Partition Choice (4) is a Hole:** No rule within this framework uniquely solves it. Input must specify the partition.

  **Scorecard on Approaches:**

  | Desideratum                  | Plain Conditioning | Jeffrey Rule | Dummy-Node Likelihood | "All Evidence Propositonal" |
  | :--------------------------- | :----------------- | :----------- | :-------------------- | :-------------------------- |
  | **1. Basic Adequacy/Rigidity** | N/A (Certain E)    | **Yes**      | **Yes** (via model)   | N/A (Certain Experience)    |
  | **2. Reduce to Bayes**       | **Yes**            | **Yes**      | **Yes**               | **Yes**                     |
  | **3. Input Problem (Pure NP)**| N/A                | **Option B** | **Fails** (Prop)      | **Solves** (Prop)           |
  | **4. Partition Choice**      | N/A                | **Hole**     | **Solved** (Node Def) | **Solved** (Experience Def) |
  | **5. Commutativity (Indep)** | **Yes** (if prop)  | **No**       | **Yes** (if nodes ind)| **Yes** (if exp ind)        |
  | **6a. Invertibility**        | **Yes** (Undo E)   | **Yes**      | **No** (LR hidden)    | **Yes** (Undo Exp)          |
  | **6b. No-Unlearning**        | **No** (Can Undo)  | **No**       | **No**                | **No** (Can Undo)           |
  | **7. Auditability**          | **Yes** (E)        | **Partial**  | **Poor** (LR hidden)  | **Yes** (Exp Prop)          |
  | **8. Conditional Shifts**    | **Yes** (Cond on C)| **No**       | **Yes** (Update model)| **Yes** (Cond on C)         |

  **Key Takeaways:**

  *   **Jeffrey's Rule:** Delivers core rigidity (1, 2), pure non-propositional input (3B), invertibility (6a), and partial auditability (7). It **fails** on partition choice (4), commutativity (5), no-unlearning (6b), and handling conditional shifts (8).
  *   **Dummy-Node Likelihood:** Solves input problem via propositions (3), partition choice (4), commutativity for independent nodes (5), and handles conditional shifts via model updates (8). It **fails** pure non-propositionalism (3), auditability (7), and invertibility (6a).
  *   **"All Evidence Propositional":** Solves input problem (3), partition choice (4), commutativity for independent experiences (5), auditability (7), and conditional shifts (8). It **fails** pure non-propositionalism (3) and invertibility/no-unlearning (6a/6b) in the same way conditioning does.
  *   **Unresolvable Tensions:** Pure non-propositionalism (3B) vs. handling conditional shifts (8). Rigidity (1) vs. conditional shifts (8). Auditability of partition (7) vs. minimal input (4). Rigidity/Invertibility (1/6a) vs. No-Unlearning (6b).
  *   **Your Path:** Jeffrey is elegant but limited. For implementation, the Dummy-Node/Propositional approach is often more robust and flexible, handling (4) and (8) cleanly, at the cost of abandoning pure non-propositionalism. Rigidity is non-negotiable *for Jeffrey*, but conditional shifts (8) are a major motivator for moving beyond it. **Focus your defense on how your chosen approach navigates the Input Problem (3) and the Conditional Shift challenge (8), given the unavoidable trade-offs.** Acknowledge the partition hole (4) if sticking with Jeffrey.
