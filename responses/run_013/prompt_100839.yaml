answer: |-
  **Verdict:** The phenomenon you're describing is a specific manifestation of **agenda dependence** in judgment aggregation. While there isn't a single universally established term for the *order-driven flip between consistent outcomes*, "agenda dependence" covers the core mechanism. It is distinct from the discursive dilemma (which focuses on inconsistency) and Condorcet cycling (which involves preferences). Below is the detailed breakdown.

  ```json
  {
    "established_name": "agenda dependence",
    "nearest_concepts": [
      "discursive dilemma",
      "Condorcet cycling",
      "path dependence",
      "multiple elections paradox"
    ],
    "how_it_differs": "The discursive dilemma highlights collective inconsistency (e.g., majority premises force a rejected conclusion), while your case preserves consistency but flips outcomes via order. Condorcet cycling involves cyclic preferences over alternatives, whereas this concerns sequential voting on logically linked propositions. Path dependence is a broader umbrella; this is a judgment-aggregation-specific subtype where outcomes are consistent but order-sensitive.",
    "coined_term": null,
    "definition": "Agenda dependence in judgment aggregation occurs when the sequence of voting on logically interconnected propositions determines the collective outcome, despite fixed voter judgments and consistent final results. The outcome is path-dependent: different voting orders yield different (but internally coherent) decisions.",
    "boundary_cases": [
      "**Independent propositions**: If all questions are logically unrelated (e.g., 'Should we buy chairs?' and 'Should we paint the wall?'), outcomes are order-independent.",
      "**Unanimous voters**: When all voters agree on every proposition, any voting sequence produces the same result.",
      "**Sequential unanimity**: If an early vote in the sequence is unanimous, subsequent votes cannot alter the outcome, preventing order effects.",
      "**Premise-based voting**: If the group always votes on premises first (e.g., 'Is X a problem?') and derives conclusions (e.g., 'Adopt P?') logically, outcomes stabilize and order effects vanish.",
      "**No pivotal voters**: When no voter's judgment on a later proposition would change the outcome given prior votes (e.g., majorities are large enough to override swing votes), order dependence fails to materialize."
    ]
  }
  ```

  ### Key Clarifications:
  - **Why not "discursive dilemma"?** The discursive dilemma focuses on *inconsistent* group outcomes (e.g., majority supports premises but rejects the logical conclusion). Your case avoids inconsistency: both sequences end coherently, but the conclusions differ due to order.
  - **Why not Condorcet cycling?** Condorcet cycles involve pairwise preference votes that loop (A>B, B>C, C>A), revealing no stable majority winner. Your setup uses binary judgments on propositions, not preferences, and produces stable (but order-dependent) outcomes.
  - **Edge Cases**: The phenomenon arises only when:
    - Propositions are logically interdependent (e.g., C requires A and B).
    - Voters are pivotal (e.g., majorities on individual propositions are slim).
    - No exogenous constraints force consistency (e.g., if C is automatically set to A∧B after premise votes, order effects disappear).

  This "order-driven flip" is a subcase of agenda manipulation, where chairs exploit path dependence to steer outcomes. It emerges in groups with heterogeneous judgments on logically connected issues, vanishing when propositions are independent or judgments unanimous.
