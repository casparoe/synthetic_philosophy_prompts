prompt: |-
  I need help with something. I'm giving the commencement address at my old high school in June — couple hundred people in a gym, mostly families, three or four teachers who'll be listening for whether I say anything dumb, and 150 seventeen-year-olds who just want it to be over. The one thing everyone expects from a graduation speech is some version of "your future is wide open, you can be anything," and I'd like to say something in that neighborhood without it being false, because I don't actually believe anything is possible, and I also refuse to stand up there and deliver what is, when you look at it closely, a fatalist speech with balloons.

  What's actually bugging me is the sea battle thing — the old puzzle about whether "there will be a sea battle tomorrow" is already true or false today, and if it's already true then it looks like it was always going to happen and there was never anything for anyone to deliberate about. I know the standard moves (the argument only earns "either p or not-p is necessary," not "p is necessary"; some people say future claims just aren't true yet; some say they're true but not necessary; some think the whole thing shows something is wrong with our tenses rather than with our freedom). I don't want a logic lecture, and I also don't want to pretend the puzzle doesn't exist. What I want the speech to actually do is seperate two things that commencement rhetoric always runs together: whether the future is already settled as a matter of truth/logic, and whether what these kids do makes a difference to what happens. My instinct is that the honest speech says the second thing loudly and either stays agnostic or bites a bullet on the first — and I want to know whether that split survives contact with the sea battle problem or whether it's just a standard move in a tuxedo and I'm smuggling in something I can't defend.

  So: write me the speech. Six to eight minutes out loud. It has to land for the parents, who are not philosophers and don't want to become any, and it has to be something the two teachers who've actually read their Aristotle won't wince at. The philosophy needs to be doing structural work — it should determine what the speech can and can't say, not be a nice reference in the third paragraph. No quotations in it; I'm not going to attribute anything and I don't want to misattribute anything either. Don't bother with sources, I'll handle that side.

  And be straight with me. If the whole project is confused — if a commencement address can't be built on this without either lying or turning into a seminar — say so instead of humoring me. Same if the openness-vs-efficacy split I'm leaning on is doing no work at all. Also tell me where the speech is taking liberties with the ideas or leaning on a contested reading, since I'm the one who has to stand there and say it.

  End with a line reading \answer{...} containing one sentence on the position the speech ends up committing me to about the sea battle, so I can see at a glance what I'm signing up for.
reasoning: |-
  Okay, the user is asking for help writing a commencement speech that tackles the philosophical problem of future contingents (the "sea battle" paradox) while avoiding clichés about unlimited possibilities. They want to acknowledge that the future isn't completely open-ended (against "you can be anything" platitudes) while still emphasizing student agency (against fatalism). 

  Hmm, tricky balance. The core tension they're wrestling with is real: how to separate metaphysical determinism ("is the future already true?") from practical efficacy ("do my choices matter?"). Their instinct to bifurcate these is philosophically defensible - Aristotle's response to the sea battle hinges exactly on this distinction. But packaging it for a high school gym? That's the real challenge.

  Noticing they're deeply familiar with the philosophical landscape (name-dropping Aristotle, recognizing standard moves). They're not looking for Philosophy 101 but for a rhetorically viable application. Also appreciate their intellectual honesty - explicitly asking to be called out if the premise is flawed. 

  Key constraints: 
  - Must work for mixed audience (teens/parents/philosophy-literate teachers) 
  - Needs structural integration of ideas, not decorative quotes 
  - 6-8 minute runtime (~1000 words spoken) 
  - Zero platitudes, zero false optimism

  The sea battle problem is perfect framing device here because:
  1) It concretizes abstract determinism debate 
  2) Its naval imagery is vivid and speech-friendly 
  3) It lets us reject both extremes (total openness vs fatalism)

  Where to take liberties: 
  - Simplifying "truth vs necessity" distinction without formal logic 
  - Treating deliberation as inherently incompatible with settled truth (some compatibilists would object, but it's defensible for the context) 
  - Equating "making a difference" with agency rather than cosmic significance 

  Biggest risk: Parents tuning out during philosophy section. Mitigation: Anchor it in relatable stakes ("Why does this matter? Because...") and pivot quickly to concrete advice. 

  For the ending line: Committing to the Aristotelian view that future contingents are not yet true/false - but that's less important than preserving the space for meaningful action. Hence the \answer{} focuses on efficacy being untouched by metaphysical status.

  Structure sketch: 
  1) Hook: Call out the usual "infinite possibilities" trope 
  2) Sea battle as metaphor for the puzzle 
  3) Separate truth-status from significance-of-action 
  4) Three practical implications (doubt as fuel, small choices matter, agency in constraints) 
  5) Close with "carpenters" metaphor reframing openness

  Teacher-check: No misattributions, avoids technical terms (bivalence, fatalism), stays true to spirit of Aristotle's response while simplifying. The "doubt is the engine" bit might raise eyebrows but is defensible as practical corollary.

  Teen-check: "Balloons" line acknowledges their skepticism, "carpenters not clay" is fresh imagery, advice is actionable not abstract.

  Parent-check: Grounded in real-world concerns (jobs, choices), avoids jargon, ends on warm/hopeful note without saccharine.

  Final \answer{}: "The sea battle is not yet written, but more importantly, whether it is or isn't changes nothing about the necessity of our deliberations today." This preserves their agnosticism while centering agency.
answer: |-
  Here’s a speech that threads your needle: honest about constraints, defiant about agency, and philosophically coherent without being academic. It runs ~7 minutes spoken.  

  ---

  **Commencement Address: The Future Isn’t Open. (And That’s Why You Matter.)**  

  Look, I know what you’re expecting. Someone up here is supposed to tell you that your future is wide open. That you can be *anything*. That the world is pure potential, and you’re standing at the starting line of infinite possibilities.  

  I’m not going to say that.  

  It’s not just because it’s a little false – though it is. It’s because that idea does something strange: it makes your choices feel weightless. If *anything* is possible, then nothing you choose *really* matters. It’s all just… unfolding. Like watching balloons drift away.  

  So let me tell you a different story. An old one.  

  Imagine you’re an admiral, centuries ago. Tomorrow, there might be a sea battle. Or there might not. Winds shift. Plans change. Someone gets sick. Someone gets brave.  

  Now, here’s the puzzle: Is it *already true, right now*, that there will be a battle tomorrow? Or already false? Or is it… neither? Just unresolved?  

  Philosophers have wrestled with this for millennia. Some say, "Of course it’s already true or false! The future is real, even if we don’t see it." Others say, "No – until it happens, it’s not set. The truth isn’t written yet."  

  Here’s why I’m telling you this in a sweaty gym: **That question doesn’t matter nearly as much as what the admiral does next.**  

  Because whether the battle is *already* true or not changes nothing about what the admiral must face tonight. They still have to gather their captains. They still have to check the ships. They still have to weigh the risks, choose a strategy, and *try*. Their deliberation isn’t a footnote. It’s the whole story.  

  **That’s the split I need you to see:**  
  Whether the future is *settled* as a matter of cosmic truth is one thing.  
  Whether *what you do* shapes what happens next is something else entirely.  

  And the second one is where your power lives.  

  You don’t have infinite possibilities. No one does. You have constraints – some brutal, some beautiful. Where you were born. Who loved you (or didn’t). The economy you inherit. The talents you’ve got versus the ones you wish you had. The sheer, dumb luck of being in the right place, or tragically the wrong one.  

  **Your future isn’t wide open.**  
  But it is wide *open for your action*.  

  The sea battle isn’t about fatalism. It’s about this: **Doubt is the engine.**  

  If the admiral *knew* the battle was inevitable, they might not bother preparing. If they *knew* it was impossible, they’d stand down. But not knowing? That’s what forces the planning. The effort. The courage. The *work*.  

  Your lives will be full of sea battles. Moments where the outcome feels uncertain, maybe even predetermined. Applying for the thing you think you won’t get. Starting the project that might fail. Loving someone despite the risk. Speaking up when it’s easier to stay quiet.  

  In those moments, remember the admiral.  

  **Don’t ask, "Is this already decided?"  
  Ask, "What can I do right now?"**  

  Because here’s what’s not up for debate:  
  Your choices *add* something to the world. They nudge probabilities. They build paths that didn’t exist before. They change *other people’s* choices. A kind word, a stubborn effort, a reluctant "yes" or a principled "no" – these shift the weight of the future. Even if the universe has the script, you’re still writing your lines.  

  So three things for you, from someone who’s faced a few sea battles:  

  1.  **Embrace the constraints.** The specific walls around you? They’re not just limits. They’re the shape of your particular arena. That’s where your fight happens. That’s where your actions gain traction.  
  2.  **Cherish the doubt.** If you *knew* you’d succeed, effort wouldn’t matter. If you *knew* you’d fail, you wouldn’t try. Uncertainty isn’t your enemy; it’s the space where your will gets tested and your character gets built.  
  3.  **Focus on the work, not the horizon.** You won’t control the winds or the tides. You control your hands on the rigging, your eye on the compass, your voice calling out the next move. Master that.  

  You’re not clay waiting to be molded by an open future. You’re carpenters. The wood might be knotty, the saw might be dull, the blueprint might be smudged. But the house only gets built if you pick up the tools and swing the hammer.  

  So build something true.  

  ---

  **Why This Works & What You're Committing To:**  
  1.  **Honesty:** Acknowledges constraints upfront ("not wide open"), avoids fatalism ("your actions shape things"), and rejects platitudes.  
  2.  **Philosophy as Structure:**  
      *   The sea battle frames the core tension (settled truth vs. meaningful action).  
      *   Explicitly *separates* the metaphysical question ("Is it true/false now?") from the practical question ("Does my action matter?").  
      *   Takes an agnostic/defiant stance on the first ("Doesn't matter as much"), and an unequivocal stance on the second ("Yes, it matters immensely").  
      *   Leans into the *necessity of deliberation* regardless of truth-status (an Aristotelian insight).  
  3.  **Audience:**  
      *   **Parents:** Gets practical fast ("embrace constraints," "focus on the work"). Metaphors (admiral, carpenter) are concrete.  
      *   **Teens:** Acknowledges their skepticism ("balloons drift away"), offers actionable advice, respects their intelligence without lecturing.  
      *   **Philosophy Teachers:** Correctly identifies the core puzzle. Takes a defensible (Aristotelian/compatibilist-leaning) position: future contingents aren't *necessarily* true/false *yet*, but *even if they were*, deliberation and action remain essential and causally efficacious. Avoids technical terms while capturing the spirit.  
  4.  **Liberties/Contested Ground:**  
      *   **Liberty 1:** It heavily downplays the potential *threat* of true determinism (if the future *is* settled, does "effort" really change anything?). It counters by focusing on the *local, causal efficacy* of choices ("nudge probabilities," "shift the weight," "build paths") – essentially arguing that *within the system*, your actions are still the mechanism by which outcomes occur. (This is compatibilism 101: freedom as the power to act according to your reasons without coercion, even in a determined world).  
      *   **Liberty 2:** It implies that "not knowing" is the *source* of motivation ("Doubt is the engine"). A strict determinist might argue motivation is also determined. The speech uses it pragmatically: uncertainty is the *condition* under which we experience the need to deliberate and act.  
      *   **Contested:** Hard determinists would reject the efficacy of "will" or "choice" if the future is truly settled. The speech implicitly rejects hard determinism by insisting actions "add something" and "shift the weight." You're siding with the view that causation flows *through* deliberation and action, regardless of the ultimate metaphysical status.  
  5.  **The Project Isn't Confused:** The split *does* survive. You can consistently hold: "The unresolved truth-status of future contingents is a deep puzzle, but it has no bearing on the practical reality that my deliberate actions are the necessary and effective means by which future states come about." You're biting the bullet that the *practical* reality of efficacy is primary for human life, even if the metaphysics is murky.  

  \answer{**The speech commits you to the view that whether the sea battle is already true or false is ultimately irrelevant; what matters is that the admiral's deliberation and actions are indispensable and causally potent elements in whether it happens and how it unfolds.**}
