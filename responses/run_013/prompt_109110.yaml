  The probe on Earth's surface case involves geographic coordinates. The natural symmetry here is rotational invariance - the problem doesn't specify any preferred longitude, suggesting uniform distribution over latitude might be valid. For the random real number between 1 and 1000, the uniform prior seems intuitive but logarithmic rescaling reveals issues. The tropics probability should be calculable from surface area ratios, but students might miss that latitude isn't uniform due to spherical geometry.

  The real number case exposes how linear scaling breaks indifference. The challenge is to recognize that Earth's case has physical symmetries that constrain the prior, while the unbounded real number case lacks sufficient symmetry structure. Strong students should identify that symmetry groups determine when invariance yields uniqueness.

  For the essay question, it needs to present both cases clearly and ask students to evaluate symmetry-based indifference. The model answer should demonstrate resolving the Earth case with rotational symmetry while showing the real number case's arbitrariness. Must-hit points include recognizing the Earth's spherical symmetry, seeing the real number's rescaling problem, analyzing symmetry group richness, discussing Jaynes' invariance approach, and concluding about well-posedness. The A-grade separator is explicitly stating that physical symmetries justify the Earth prior but are absent in the pure mathematical case.

  The marking scheme allocates 4 marks per point across five areas: problem analysis, symmetry application, invariance principle critique, resolution differentiation, and philosophical implications. Common errors include treating Earth's latitude as uniform or missing how rescaling breaks indifference in the number case. The top performance differentiator is explicitly contrasting the Earth's physical symmetries against the abstract number line's lack thereof.
answer: |-
  Below is a comprehensive essay question, model answer, and marking scheme designed to meet your specifications. The crux is recognizing that **symmetry demands only constrain the prior when the symmetry group is sufficiently rich (e.g., transitive or acting freely) to uniquely determine a uniform measure over the relevant structure, and that the Earth case possesses such symmetries (rotation) while the abstract real number interval does not.** Strong students will identify the *physical salience* of the Earth's spherical symmetry as justifying a unique prior (surface area measure), contrasting it with the *mathematical underdetermination* in the number case where no physically relevant symmetry forces linearity.

  ---

  ### (1) Essay Question (45-minute essay prompt)

  **Evaluate the following proposal for applying the Principle of Indifference:**
  > "When faced with uncertainty over a parameter space, we should assign probabilities such that the prior distribution is invariant under all symmetries inherent in the problem specification. If the symmetry group is rich enough, this uniquely determines the prior. Cases lacking sufficient symmetry are ill-posed for indifference, not paradoxical."

  **Consider two cases:**
  1.  **Earth Probe:** A probe lands at a "random point" on Earth's surface. What is the probability it lands within the tropics (latitudes between -23.5° and +23.5°)?
  2.  **Number Generator:** A machine outputs a "random real number" between 1 and 1000. What is the probability the output is less than 10?

  **Does symmetry invariance successfully resolve both cases? Why or why not? Your answer must address:**
  *   What relevant symmetries exist in each case.
  *   Whether the symmetry group is "rich enough" to uniquely determine an invariant prior.
  *   The resulting probabilities (if determinable) and why they are justified.
  *   Whether the proposal avoids paradox or merely shifts the difficulty.

  ---

  ### (2) Model Answer (~650 words)

  The proposal to demand invariance under inherent symmetries offers a promising refinement of the Principle of Indifference, but its success depends critically on whether the problem's symmetries are sufficiently rich to uniquely define a measure. The two cases reveal a crucial distinction: one possesses physically meaningful symmetries that uniquely determine a prior, while the other lacks such structure, rendering the problem ill-posed for indifference without additional constraints.

  **Case 1: Earth Probe**
  The problem specifies a "random point" on Earth's *surface*. Earth is a sphere. The inherent symmetries are the *rotations* of the sphere: there is no distinguished direction or location in space. The rotation group SO(3) acts transitively and freely on the sphere's surface. This rich symmetry group uniquely determines the invariant prior: the uniform distribution over *surface area*. This measure is proportional to the spherical surface element, dA ∝ cos(φ) dφ dθ (where φ is latitude, θ longitude). Calculating the probability of landing in the tropics involves integrating this measure between φ = -23.5° and φ = +23.5°.
  *   Surface area between tropics = ∫_{-23.5°}^{23.5°} ∫_0^{360°} R² cos(φ) dθ dφ ∝ ∫_{-23.5°}^{23.5°} cos(φ) dφ
  *   Total surface area ∝ ∫_{-90°}^{90°} cos(φ) dφ
  *   P(Tropics) = [sin(23.5°) - sin(-23.5°)] / [sin(90°) - sin(-90°)] = sin(23.5°) ≈ 0.397
  Symmetry invariance succeeds here. The rotation group is rich enough (transitive, compact) to uniquely define the uniform measure on the sphere (Haar measure). The specification "on the surface" physically implies this 2D spatial measure. Latitude alone cannot be uniform, as that would violate rotational symmetry.

  **Case 2: Number Generator**
  The problem specifies a "random real number" in [1, 1000]. What are the inherent symmetries? The interval [1, 1000] is a bounded subset of the real line. The most obvious symmetry is *translation invariance*. However, translation is inherently broken by the finite bounds [1, 1000]; translating any number x by k ≠ 0 moves it outside the interval. The only plausible "inherent" symmetry is *scale invariance* – the problem mentions no privileged unit. The machine outputs a number, not a physical quantity tied to a specific scale. The multiplicative group (positive reals under multiplication) acts on the interval. However, scale invariance alone is insufficient to uniquely determine a prior.
  *   A uniform prior over the linear measure (dx) is invariant under *additive* translation (x → x + c), but this symmetry is broken by the bounds and irrelevant to scale.
  *   A uniform prior over the logarithmic measure (d(log x) = dx/x) is invariant under *multiplicative* rescaling (x → kx). This yields: P(X < 10) = [log(10) - log(1)] / [log(1000) - log(1)] = log₁₀(10) / log₁₀(1000) = 1/3.
  *   Why prefer dx or dx/x? The group of scaling transformations (x → kx) acting on [1, 1000] is *not rich enough*. It doesn't act transitively on the finite interval (e.g., there's no k such that k*1 = 500). Crucially, it does not uniquely determine the measure. Both the linear measure and the log measure are quasi-invariant under scaling *if* we allow the interval bounds to also scale, but the problem fixes the bounds at 1 and 1000. With *fixed bounds*, scale invariance demands that the relative probability density ratio between two points depends only on their ratio, but it doesn't fix the density at any specific point. Many measures (e.g., dx/x^p for different p) satisfy this weak condition. The symmetry group is too poor to force uniqueness.

  **Evaluation of the Proposal**
  The Earth case demonstrates the strength of symmetry invariance. The physically salient symmetry (rotation) is rich, directly tied to the meaning of "random point on a sphere," and uniquely pins down the prior (surface area measure). The paradox of latitude vs. surface area is resolved by recognizing the true symmetry group.

  The Number Generator case reveals the proposal's limitation. The inherent symmetry (scale) is plausible but mathematically insufficient to uniquely determine a prior on the bounded interval. The group is not rich enough. The problem is ill-posed *for indifference* because the symmetry constraint alone doesn't specify whether "random" implies uniformity over the number itself (P=9/999≈0.009), its logarithm (P=1/3), or another scale. Additional structure (e.g., is the number representing a physical quantity? Is the generator linear?) is needed. The proposal correctly diagnoses this as underdetermination, not paradox, but it doesn't solve it.

  Therefore, the proposal is partially successful. It resolves cases with rich, physically relevant symmetry groups (like spatial selection) but falters where symmetries are insufficient or ambiguous (like abstract number generation), correctly identifying the latter as ill-posed for indifference without further specification. The crux is the *richness* of the symmetry group and its *physical salience*.

  ---

  ### (3) Marking Scheme (20 marks total, 4 marks per point)

  1.  **Correct Analysis of Earth Symmetries & Measure:** Recognizes rotational symmetry (SO(3)) as inherent and decisive; identifies the uniquely determined invariant measure as surface area (dA ∝ cos(φ) dφ dθ), *not* uniform latitude. *Common Error:* Claims indifference over latitude (φ) is natural, ignoring rotational symmetry and spherical geometry.
  2.  **Correct Probability for Earth:** Calculates P(Tropics) based on surface area measure: ∫cos(φ)dφ / ∫cos(φ)dφ = sin(23.5°)/1 ≈ 0.397. Shows understanding the measure requires integrating cos(φ). *Common Error:* Calculates (47°/180°) = ~0.261, based on uniform latitude.
  3.  **Correct Analysis of Number Generator Symmetries & Ambiguity:** Identifies scale invariance as the plausible inherent symmetry; explains why it's insufficient: bounded interval breaks full scale group, multiple measures (dx, dx/x) satisfy weak scale conditions, group not rich/transitive. *Common Error:* Assumes translation invariance applies or claims scale invariance uniquely demands dx/x without addressing ambiguity.
  4.  **Contrasts Rich vs. Poor Symmetry Groups:** Explicitly states that Earth's rotation group is rich (transitive, compact) allowing unique Haar measure, while the scaling group on [1,1000] is poor (non-transitive, broken by bounds) leading to underdetermination. *Common Error:* Treats both cases as equally paradoxical or attributes ambiguity solely to boundedness without analyzing group structure.
  5.  **Evaluates Proposal & Ill-Posedness:** Concludes symmetry invariance successfully resolves Earth but fails to resolve Number Generator (only diagnoses it as ill-posed). Acknowledges proposal avoids "inconsistency" claim but doesn't solve underdetermined cases. *Common Error:* Declares proposal wholly successful or wholly unsuccessful; fails to distinguish resolvable vs. ill-posed cases.

  **A/B Separator:** The single move separating an A (18-20) from a B (14-16) is **explicitly contrasting the *physical salience and mathematical richness* of the Earth's rotational symmetry group (uniquely fixing dA) against the *abstractness and poverty* of the scaling symmetry group on [1,1000] (failing to fix a unique measure).** B answers identify the different symmetries and outcomes but lack this deep structural contrast.
