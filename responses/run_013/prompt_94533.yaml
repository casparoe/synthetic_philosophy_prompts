  ### Bet-Sizing Philosophy Quiz  
  *Answer each question based on your immediate intuition. There are no right or wrong answers—just honest choices.*

  ---

  1. **Single Bet on 60/40 Coin**  
     You have $1,000. A fair offer: 60% chance to double your stake, 40% chance to lose it. One bet only. You’ll never bet again. If you end with $0, it’s catastrophic. What do you stake?  
     A. $1,000  
     B. $200  
     C. $0  

  2. **Thousand Rounds of 60/40**  
     Same coin. You’ll bet 1,000 times in a row, resizing your bet each round. Starting with $1,000, what’s your strategy?  
     A. Bet everything every round.  
     B. Bet 20% of your current bankroll each round.  
     C. Bet 1% of your current bankroll each round.  

  3. **$100 Betting Increments**  
     Same as above (1,000 rounds, 60/40 coin), but you must bet in exact $100 increments. Starting bankroll: $1,000. Your first bet?  
     A. $1,000  
     B. $200  
     C. $100  

  4. **$10,000 or Disaster**  
     You have $9,000. Need $10,000 by Friday to avoid disaster. Only option: a 50/50 double-or-nothing bet of $1,000. Win: $10,000 (safe). Lose: $8,000 (disaster). Do nothing: $9,000 (disaster).  
     A. Take the bet.  
     B. Do not take the bet.  

  5. **Unknown Coin Bias**  
     A coin with unknown bias (could be fair, could be skewed). You’ll flip it 10,000 times, learning as you go. How do you bet?  
     A. Fixed fraction of bankroll (e.g., 10%) always.  
     B. Update bias estimate after each flip; bet the "optimal" fraction for that estimate.  
     C. Start very small (e.g., 1%), increase slowly as you gain confidence.  

  6. **Final Bet at 85**  
     You’re 85, no heirs, no legacy goals. Last bet of your life. 60% chance to double your stake, 40% to lose it. Bankroll: $1,000. What do you stake?  
     A. $1,000  
     B. $200  
     C. $100  

  7. **Betting Others’ Money**  
     You manage others’ money. Your cut: 20% of profits. No penalty for losses. Same 60/40 coin, 1,000 rounds. What do you do?  
     A. Bet everything every round.  
     B. Bet 20% of bankroll every round.  
     C. Bet 50% of bankroll every round.  

  8. **Thousand Independent Copies**  
     A thousand copies of you (each with $1,000) are offered the same one-shot 60/40 bet. You care about all equally. What do you tell each?  
     A. Bet everything.  
     B. Bet $200 (20%).  
     C. Bet $100.  

  9. **Software with Rollbacks**  
     You’re software. Before any losing bet, you can snapshot and roll back to retry. No cost. Offered one 60/40 even-money bet. What do you stake?  
     A. Everything.  
     B. 20% of bankroll.  
     C. $100.  

  10. **1% Chance of $100k Loss**  
      You face a 1% chance of losing $100,000. Insurance removes this risk. What’s the max you’d pay?  
      A. Up to $1,000.  
      B. Up to $2,000.  
      C. Up to $5,000 or more.  

  ---

  ### Scoring Key  
  Match your answers to the patterns below. If you match multiple, pick the best fit. Positions are *descriptive*, not prescriptive.

  1. **Log Utility / Growth Rate Maximization**  
     *"Kelly is just EU with log utility" or "Always maximize growth rate."*  
     **Pattern:** 1B, 2B, 3B, 4B, 5B, 6B, 7B, 8B, 9A, 10B.  
     - Believes Kelly is optimal under known probabilities. Ignores incentives (Q7B) and treats rollbacks as pure opportunity (Q9A).  

  2. **Regime View**  
     *"Maximize EV for one-shot, growth rate for repeated bets."*  
     **Pattern:** 1A, 2B, 3B, 4A, 5B, 6A, 7B, 8A, 9A, 10A.  
     - Bets all in one-shots (Q1A, Q6A) but Kelly for repeated (Q2B, Q3B). Takes desperate bets to avoid disaster (Q4A).  

  3. **Fractional Kelly (Uncertainty-Adjusted)**  
     *"Use fractional Kelly—your probabilities are always wrong."*  
     **Pattern:** 1C or 1B, 2C, 3C, 4A or 4B, 5A or 5C, 6C, 7C, 8C, 9C, 10B or 10C.  
     - Conservative sizing (Q2C, Q3C, Q8C). Prefers low-risk learning (Q5A/C). Pays extra for insurance (Q10B/C).  

  4. **Ambiguity Skeptic**  
     *"Probabilities are fiction. Optimization is hubris."*  
     **Pattern:** 1C, 2C, 3C, 4B, 5C, 6C, 7C, 8C, 9C, 10C.  
     - Avoids bets or stakes minimally (Q1C, Q5C, Q6C). Rejects "known" probabilities (Q4B). High insurance premiums (Q10C).  

  5. **Survival-First / Ruin-Averse**  
     *"Never risk an absorbing loss (ruin)."*  
     **Pattern:** 1C, 2C, 3C, 4A, 5C, 6C, 7C, 8C, 9C, 10C.  
     - Prioritizes avoiding disaster (Q4A) but minimizes exposure elsewhere (Q1C, Q2C). Buys expensive insurance (Q10C).  

  6. **Deflationary / Incentives-Driven**  
     *"Bet sizing is about contracts and incentives, not math."*  
     **Key markers:** 7A, 9A.  
     - Bets aggressively with other people’s money (Q7A). Exploits rollbacks (Q9A). Other answers vary.  

  ---

  ### Notes  
  - **Uncharted Combinations:**  
    - *Q1A + Q2A + Q3A + ...* (max EV always): Rare; most reject this due to near-certain ruin. Theoretically coherent if you accept ruin risk.  
    - *Q4A + Q10A* (bet to avoid disaster but pay only expected loss for insurance): Inconsistent—usually reflects oversight.  
    - *Q7B + Q9C* (Kelly with rollbacks but stake minimally): Unexplored; likely values "optionality" over growth.  

  - **Indistinguishable Positions (without extra questions):**  
    - *Log Utility vs. Growth Rate*: Identical here (both maximize expected log). Add a case with nonlinear wealth utility to split.  
    - *Fractional Kelly vs. Ambiguity Skeptic*: Overlap in conservatism. Split with a case where probabilities are "known" (e.g., government bond) but the skeptic still avoids betting.  

  - **What Your Result Doesn’t Tell You:**  
    Your quiz result reflects *stated preferences in these scenarios*, not real-world expertise or consistency. It doesn’t capture:  
    - How you update beliefs with data.  
    - Your tolerance for non-monetary risks (e.g., reputation).  
    - Whether you’d reconsider after seeing long-run simulations.  

  ---  
  *Quiz by [Your Name] for the Reading Group. Reflect, debate, and remember: no position is "correct"—just revealing.*
