prompt: |-
  I have been reading around in forecasting and collective judgment, and I keep encountering a pattern for which I cannot find a name that fits exactly.

  The first instance: a large group of forecasters, each of whom is only slightly more reliable than a coin on the questions at hand. If their mistakes are unrelated — each erring for their own idiosyncratic reasons — the group's majority verdict is far more accurate than any individual member, and it grows more accurate still as the group is enlarged. Size is a virtue; the mediocre many reliably outperform the excellent few.

  The second instance: the same group, but now the members share a common source of error. They read the same few outlets, were trained on the same material, or reason from the same background assumption, so their mistakes point the same way. The result inverts. The group is not merely wrong; it is confidently and extremely wrong, and enlarging the group makes the collective verdict more extreme in the wrong direction. Size has become a vice; the many are worse than the few, and worse in proportion to their number.

  What interests me is that the only thing that changed between the two cases is whether the individual errors are aligned, and yet the effect of adding members reverses sign. I have heard the first case celebrated under the general heading of the wisdom of crowds, and I gather there is a classical result about majority voting and individual competence that underwrites it. But I am after the second case specifically — the amplification of a shared error by aggregation, where more participants make the group more confidently wrong — and I want to know whether that has an established name and analysis of its own.

  If it does, tell me precisely what the extra condition is that flips the classical result, and how the second case is distinguished from the first. If it does not have a name, give me one and define it, and then say how it relates to, and differs from, the nearest things I do know of — groupthink, information cascades, and group polarization. I care much less about the label than about the carving: what exactly the phenomenon is, whether the crucial feature is the alignment of the errors or merely the presence of a shared bias, whether the shared error must point in one direction or can be a shared tendency to scatter, and where the edges of the phenomenon lie.

  Please answer as a numbered list of exactly five items, each a sentence or two, with no introduction and no conclusion. Within that list, also tell me what would change your verdict — which consideration or argument would lead you to a different name or a different carving — and where your reasoning is most likely to fail.
reasoning: |-
  Okay, let me tackle this fascinating question about collective judgment dynamics. The user describes two contrasting scenarios where group size either improves or worsens accuracy based on error correlation, and wants precise conceptual carving.

  First, I recognize the core distinction: independent vs correlated errors. The classical wisdom-of-crowds relies on error independence, while the problematic inversion occurs when errors become dependent through shared biases. But I need to identify if this inversion has an established name.

  Considering related concepts:
  - Groupthink describes social conformity but doesn't inherently involve mathematical error amplification
  - Information cascades focus on sequential decision-making
  - Group polarization concerns attitude extremity without necessarily linking to competence metrics

  The key mechanism here is bias amplification through aggregation, specifically when shared bias creates systemic rather than random errors. I recall mathematical models like Condorcet's theorem where correlated errors violate the independence assumption. This seems fundamental yet unnamed in common parlance.

  For the naming dilemma: since no perfect term exists, I'll propose "systematic error amplification" to emphasize how shared biases scale with group size. The crucial differentiator from the first scenario is specifically aligned directional bias - not just any correlation, but coordinated errors in the same direction.

  The edge cases worth noting: 
  - Shared cognitive biases (e.g. confirmation bias) would qualify
  - Non-directional correlation (e.g. consistent overconfidence) might not trigger inversion
  - The phenomenon requires the bias to affect the majority decision mechanism

  Verdict-changers would include:
  - If correlated errors canceled out rather than accumulated
  - If the aggregation method changed (e.g. averaging vs majority)
  - Cases where bias isn't systemic but stems from diverse shared sources

  The reasoning's weakest point concerns non-directional correlations - the model assumes biases push monolithically, whereas real-world shared biases might have compensating effects.
answer: |-
  1.  The phenomenon where aggregated collective judgment becomes *more confidently and extremely wrong as group size increases due to shared systematic bias* is most precisely described as **Systematic Error Amplification**, highlighting the amplification of a consistent bias through aggregation.
  2.  The crucial condition flipping the classical "wisdom of crowds" result (which relies on Condorcet's Jury Theorem) is **directional correlation in individual errors** – specifically, a shared systematic bias causing individual errors to be positively correlated and consistently skewed in the same direction, violating the theorem's independence and constant competence assumptions.
  3.  It is distinguished from **groupthink** (focused on social pressure for conformity suppressing dissent), **information cascades** (sequential decisions based on preceding actions rather than private signals), and **group polarization** (shifting attitudes towards extremity *after* deliberation) because the error amplification occurs *mechanically* through the aggregation of pre-existing, correlated biased judgments, even without social interaction or deliberation; the core driver is the statistical dependence of errors.
  4.  The essential feature is **aligned directional bias** – the shared error *must* create a consistent tendency for individuals to err in the same specific direction (e.g., all consistently overestimate); mere shared noise increasing variance or a shared tendency to scatter (non-directional correlation) would not cause the majority verdict to become more extreme and wrong with size, though it could harm accuracy.
  5.  My verdict on the name ("Systematic Error Amplification") and carving would change if: (a) the phenomenon primarily described *deliberative* shifts rather than mechanical aggregation effects (favoring "group polarization"), or (b) the bias amplification depended critically on sequential influence rather than simultaneous judgment (favoring "information cascade"); the reasoning is most likely to fail at the edge case of **weakly correlated non-directional biases**, where increased group size might still harm accuracy but without the clear, directional amplification.
