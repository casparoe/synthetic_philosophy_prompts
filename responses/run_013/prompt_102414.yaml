  The villanelle's repetition is key. Its cyclical returns to the refrains will mirror the inescapable logic of the trap. For the quatrain's "lock" moment, I'll have the two refrains collide: "We arm because the threat is real" directly followed by "The walls grow higher as we fall," emphasizing how individual action reinforces collective doom. 

  Last challenge: making the selection logic legible without lecturing. The final tercet should hint at the solution (acting as a whole) while showing why it's impossible under current rules. "If we were one we’d break the chain" introduces the alternative, but "The walls grow higher as we fall" confirms the tragic inertia. That contrast should leave the reader feeling the trap's teeth.
answer: |-
  ## Multipolar Trap (Villanelle)

  We arm because the threat is real and near,
  The rivals sharpen steel, the shadows crawl.
  **The walls grow higher as we fall.**

  To hold our ground, we cut the core, the clear
  Standard abandoned for a cheaper call
  **We arm because the threat is real and near.**

  They slash the price? We match them, drown the fear
  With deeper cuts that undermine us all.
  **The walls grow higher as we fall.**

  We outbid promises, the cost severe,
  Each pledge exceeding sense, beyond recall.
  **We arm because the threat is real and near.**

  The race is downward, fast, the chasm sheer,
  No single player caused the common stall.
  **The walls grow higher as we fall.**

  We build the cage ourselves, each bolt sincere,
  Responsive actors answering the squall.
  **We arm because the threat is real and near.**
  **The walls grow higher as we fall.**

  If we were one we’d break the chain, that’s plain,
  But each alone must heed the urgent thrall:
  **We arm because the threat is real and near,**
  **The walls grow higher as we fall.**

  ---

  **Notes on the Execution:**

  *   **Refrains:** "We arm because the threat is real and near" (participant logic) / "The walls grow higher as we fall" (aggregate outcome).
  *   **Concrete Actors & Moves:** "We arm", "cut the core", "slash the price", "match them", "outbid promises", "build the cage" – all plural actors taking concrete, locally rational actions.
  *   **The Trap's Logic:** The poem shows the sequence: threat perception -> arming -> cost-cutting/standard erosion -> bidding wars -> collective deterioration ("walls grow higher", "chasm sheer", "common stall", "cage"). The actors are "responsive," not foolish.
  *   **Villanelle as Trap:** The relentless return to the refrains mirrors the inescapable logic of the participants' moves and the inevitable outcome. The form *enacts* the compulsion.
  *   **Closing Quatrain as Lock:**
      *   Lines 1-2 ("We build... answering the squall") explicitly state the actors are building their own prison through responsive actions.
      *   The final couplet brings the refrains together: The *reason* ("We arm...") directly leads to the *result* ("The walls..."). This meeting sounds like a resolution but confirms the lock is shut. The actors remain trapped in the logic of the part.
  *   **Selection Logic:** The penultimate tercet ("If we were one...") explicitly states the solution (acting as a whole) while simultaneously showing why it doesn't happen ("each alone must heed the urgent thrall"). The unit of selection is the individual participant, not the whole.
  *   **Legibility for All:**
      *   **Knows the Trap:** Sees the exact sequence of moves, the locally rational decisions, the unintended collective outcome, and the unit-of-selection problem.
      *   **Doesn't Know:** Feels the escalating tension ("shadows crawl", "chasm sheer", "urgent thrall"), the paradoxical decay ("walls grow higher as we fall"), the sense of being forced ("must heed"), and the finality of the locked refrains. The "ratchet closes."
