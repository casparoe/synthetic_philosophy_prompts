  Hmm, the user provided clear guidelines: one refrain should be in first-person plural ("we") showing the participant's perspective, and the other impersonal refrain describing the aggregate outcome. The closing quatrain needs to make these refrains converge like a lock clicking shut. The actors must be concrete—like nations or corporations—not abstract. And the core tension must be clear: the trap persists because participants act as individual units rather than considering the whole system.

