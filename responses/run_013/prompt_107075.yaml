prompt: |-
  I keep noticing a move and I dont know if it has a name, so if it doesn't, I'd like to know what to call it and where exactly its edges are. Here's the shape of it. Someone is defending a practice their own group does -- a church that won't ordain women, a family that arranges its kids' marriages -- and when an outsider objects, out comes the relativism: you can't judge another culture by your standards, morality is just the local consensus, who made you the arbiter. Fine. But then the same person, later, is genuinely angry about some other practice -- how another country treats women, or a company doing something exploitative -- and now it's not 'relative to their culture' at all, it's just flat wrong, and they argue for it like there's a fact of the matter. What makes it interesting is that each move comes with a plausible-sounding reason. The relativist move gets 'respect other cultures.' The universalist move gets 'but this one actually harms people,' or 'but they never really consent,' or 'but that's not even a real part of their culture, it's a recent invention.' So it isn't just hypocrisy -- the person can always give a reason why the two cases differ. It's more that the meta-ethical stance looks like it gets picked to match the conclusion they already wanted, and the reason comes after. Is there a name for this specific thing? I know the neighborhood -- cultural relativism, the tolerance argument, ethnocentrism, plain inconsistency -- but none of those seems to be it, because none of them capture the asymmetry, the way relativism is a shield for your own side and a hammer for everyone else's. If there's no term, coin one and tell me how it differs from ordinary hypocrisy on one side and from a legitimate distinction like 'this practice really is harmful' on the other. And does the reason they give for the asymmetry get them off the hook, or is the reason itself part of the pattern?
reasoning: |-
  Okay, the user is describing a specific rhetorical pattern they've observed where someone switches between relativism and universalism depending on whether they're defending their own group or criticizing others. They want to know if there's a name for this, or if not, what to call it. They also want to understand how it differs from simple hypocrisy or legitimate ethical distinctions.

  First, I recall that this is a common logical inconsistency, but I need to pinpoint the exact term. The user mentions cultural relativism, ethnocentrism, etc., but none fully capture the asymmetry. The key here is the selective application: relativism as a shield for one's own group and universalism as a weapon against others.

  I remember that some philosophers have discussed this. Bernard Williams comes to mind with his "relativism of distance," but that's more about historical judgments. Then there's "asymmetric relativism" or "motivated relativism." But I think the term "Immunizing Double Standard" might fit. It emphasizes the protective aspect for the in-group and the aggressive stance against out-groups.

  The user also wants to know if the reasons given for the asymmetry are valid or just part of the pattern. Here, the distinction between legitimate harm-based arguments and this pattern lies in consistency. If someone applies universal principles uniformly, harm-based critiques are valid. But in this case, the inconsistency reveals that the principles are selectively applied based on group affiliation.

  Another angle is the meta-ethical stance switching. The person isn't committed to either relativism or universalism; they use whichever serves their pre-existing bias. Terms like "motivated reasoning" or "confirmation bias" are related but broader. The specific move is the tactical switch between ethical frameworks.

  The user might also be interested in why this is problematic beyond hypocrisy. It's because it undermines genuine ethical discourse by avoiding accountability. The reasons given (like harm or consent) might be valid in isolation, but the selective invocation without consistent principles makes them suspect.

  I should check if there's a coined term already. "Convenient Relativism" or "Selective Universalism" are sometimes used. However, "Immunizing Double Standard" captures both the defensive and offensive moves. Explaining how it's different from hypocrisy: hypocrisy is violating one's own stated principles, whereas here, the principles themselves are switched situationally. Legitimate distinctions rely on consistent criteria, whereas this pattern applies criteria inconsistently based on group loyalty.

  Also, the user asks if the reasons get them off the hook. The answer is no because the reasons are post-hoc justifications. The initial stance (relativist/universalist) is chosen based on the desired conclusion, not principled reasoning. The reasons are part of the pattern because they mask the underlying bias.

  In conclusion, the term "Immunizing Double Standard" or "Tribal Epistemic Double Standard" might be most fitting. It highlights the group-based inconsistency and the tactical use of ethical frameworks. The user's deeper need is likely to articulate this concept for critical discussions, possibly in academic or debate contexts, to call out such inconsistencies effectively.
answer: |-
  That's an **excellent** dissection of a very specific and common rhetorical maneuver. You're right that standard terms like "hypocrisy" or "cultural relativism" don't quite capture the **asymmetry and tactical switching** you've identified.

  The most precise terms for this pattern are:

  1.  **Immunizing Double Standard (or Strategy):** This is the strongest contender. It directly names the core dynamic: using relativism to *immunize* one's own group/practices from criticism, while applying universal moral standards to *attack* others. The "double standard" lies in the inconsistent application of the meta-ethical framework (relativism vs. universalism) based solely on whether the target is "us" or "them."
  2.  **Tribal Epistemic Double Standard:** This emphasizes the *group loyalty* ("tribal") aspect driving the inconsistent application of knowledge/ethics principles ("epistemic"). It highlights that the choice of framework (relativist/universalist) is determined by group affiliation, not objective reasoning.
  3.  **Motivated Relativism / Selective Universalism:** These describe *how* the double standard functions. Relativism is only "motivated" (deployed) when it protects the in-group. Universalism is "selectively" applied only when condemning the out-group.
  4.  **Schrodinger's Meta-Ethics:** (A bit more playful, but descriptive) Like the cat being both dead and alive, the meta-ethical stance (relativism vs. universalism) only collapses into a definite state based on the observer's desired outcome regarding the target group. Its nature depends entirely on who is being judged.

  **Why these terms capture it better than "hypocrisy" or "relativism":**

  *   **Hypocrisy:** Simple hypocrisy is violating one's *own stated principles*. This is more complex. The person isn't necessarily violating a *single, stated* principle; they are *tactically switching the foundational principle itself* (relativism vs. universalism) depending on the target. The plausible reasons given mask the underlying inconsistency in the *meta-ethical commitment*.
  *   **Cultural Relativism:** This is just one tool used *part* of the time. A true cultural relativist would apply it *consistently*, even to practices they find abhorrent (though they might still dislike them personally). The pattern you describe is the *instrumental, selective use* of relativism as a shield.
  *   **Ethnocentrism:** While present (valuing one's own group above others), it doesn't capture the *rhetorical mechanism* of switching meta-ethical frameworks. Ethnocentrism is the *attitude*; the Immunizing Double Standard is the *strategy* employed because of that attitude.
  *   **Inconsistency:** Too vague. This is a very *specific type* of inconsistency in foundational ethical reasoning applied asymmetrically.

  **Edges of the Pattern & Distinguishing it from Legitimate Distinctions:**

  1.  **The Core Asymmetry:** The defining feature is the **reversal of the meta-ethical stance** (relativism vs. universalism) **based primarily on group affiliation (in-group vs. out-group)**. The *reasons* come *after* to justify the pre-determined stance for that group.
  2.  **Legitimate Distinction:** A legitimate argument distinguishes practices based on *consistent principles*. For example:
      *   "Practice X causes demonstrable, severe harm; Practice Y, while different, does not reach that threshold of harm." (Consistent universal harm principle)
      *   "Practice Z claims cultural justification but lacks genuine historical roots and is actively contested *within* that culture." (Consistent principle about authentic cultural practices vs. power grabs)
      *   **Key:** The *same* criteria (harm, consent, authenticity) are applied to *all* cases, even if the conclusion differs. The burden of proof is consistent.
  3.  **Immunizing Double Standard:** Here, the *criteria themselves shift* depending on the group.
      *   For the **in-group practice:** Relativism is invoked *first* as the shield. Harm/consent/authenticity arguments are either dismissed ("you can't judge by your standards"), minimized, or used *defensively* ("it's not *really* harmful in *our* context," "consent is understood differently here").
      *   For the **out-group practice:** Universalism is invoked *first* as the hammer. Harm/consent/authenticity arguments are deployed *aggressively* as *absolute* condemnations. Relativist counter-arguments ("but it's their culture") are dismissed.
      *   **The Switch:** The same person who moments ago argued *against* universal harm/consent standards when defending their group now argues *for* those exact same universal standards when attacking another group. *The validity of the standards themselves changes based on who is being judged.*

  **Does the reason get them off the hook? Is the reason part of the pattern?**

  *   **No, the reason does *not* get them off the hook.** The reason is **post-hoc justification** for the asymmetrical stance, not the genuine cause of it. The *desire* to defend the in-group and condemn the out-group comes first; the meta-ethical stance and specific reasons are selected to fit that desire.
  *   **Yes, the reason *is* part of the pattern.** The plausible-sounding reasons (harm, consent, authenticity) are **integral to the tactic.** They provide intellectual cover, making the inconsistency *less* blatant than simple hypocrisy. They allow the person to *feel* justified and reasonable. However, the *selective application* of these criteria based on group loyalty exposes the underlying bias. The reasons are weapons/shields chosen from the arsenal, not fixed principles guiding the judgment.

  **In essence:** You've identified **"The Immunizing Double Standard"** – a tactic of strategically deploying relativism as a shield for one's own tribe while wielding universalism as a hammer against others, using plausible-but-inconsistently-applied criteria (harm, consent, culture) as the ammunition. It's hypocrisy operating at the level of foundational ethical frameworks, disguised by post-hoc reasoning. Recognizing this pattern is crucial for cutting through the rhetorical fog and exposing the core bias driving the inconsistent judgments.
