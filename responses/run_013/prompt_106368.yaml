prompt: |-
  Ok so I fell down a Wikipedia hole about Belgium and hit something I can't stop chewing on. In 1990 the Belgian parliament passed a law decriminalising abortion. The king at the time, Baudouin, was a serious Catholic and told the PM, Wilfried Martens, that he couldn't sign it — his conscience wouldn't let him. In Belgium a law doesn't come into force without the king's signature (royal assent), so this was heading straight for a constitutional crisis. The workaround they landed on: the government declared the king unable to govern, stepped into his authority for a bit, enacted the law themselves, and then parliament voted to put him back on the throne the next day. He was out for something like 44 hours. Law passed, king's conscience intact, monarchy survived.

  I'm a software engineer, zero formal philosophy or political theory, so I don't have the right words for this, but I want to run the episode through the theory of constitutional monarchy. You know the package: the monarch in a democracy is supposed to act on the advice of elected ministers; the real governing happens in the ministers and parliament and the monarch is basically the ceremonial wrapper; the most the monarch gets is to be kept informed, to encourage, and to warn; and then there are these so-called reserve powers that everyone says exist but that nobody can quite agree on when it's legit to actually use. That package.

  What I want:

  First, map the episode onto the theory honestly. Who are the players, what were Baudouin's actual options, what does the theory say he was supposed to do, and what does it say about the governments move — was declaring him unable to govern a fair use of that mechanism, given it's meant for a king who's ill or incapacitated, not one who simply disagrees with a law he's being asked to sign?

  Then the other direction: what does the episode do to the theory? Does it confirm the convention works — the machine just routed around the king's conscience and still produced a law — or does it expose the convention as a fiction, since the only way to keep it was to pretend the king wasn't there for two days? Did Baudouin effectively use a veto, or a reserve power, while managing not to call it one? Is the 44-hour suspension a clever pressure valve, or a quiet abuse that sets a bad precedent? And where is the theory just silent — is there any principled answer to a monarch's conscience colliding with a duly passed law, or is this one of those cases the theory never actually anticipated and just papers over?

  Last, briefly, by the lights of the same theory: how would this have gone in a few of the other constitutional monarchies (UK, Scandinavia, Japan)? Would the answer really be different, or is the underlying logic identical and only the costumes change? I don't want reading lists or citations, just the argument.

  And don't split the difference at the end — I keep flip-flopping on whether the king comes off principled or absurd, and whether the system comes off robust or hollow. Tell me which reading the theory actually supports and why.
