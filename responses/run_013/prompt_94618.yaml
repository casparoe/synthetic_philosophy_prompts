prompt: |-
  I teach a third-year seminar in population ethics, and I am drafting the take-home essay for the final. My worry is that every strong student can already recite the standard battery of nonidentity cases and will simply reproduce one of them, so I want a question that cannot be answered that way, and that is self-contained enough that no one needs to look anything up or cite anyone. To that end I have built the question around a distinction from my own handout, which the students will have to apply rather than recognise. On the handout I separate three accounts of what it is for an act to harm someone: the ledger view, on which an act harms a person only if it leaves that person worse off than they would have been under some feasible alternative in which that same person exists; the floor view, on which an act harms a person if it leaves them below a threshold of a minimally decent life, whether or not any better alternative for that person was available; and the warrant view, on which an act harms a person if it breaches a duty owed to them, whether or not it leaves them worse off or below any floor. I want the question to make students see that the nonidentity problem is fundamentally a claim about which comparisons are available — that it is generated by the ledger view's demand for a same-person alternative — and that whether the problem survives therefore depends on a modal premise about personal identity which they must state explicitly rather than assume.

  The case I want them to work with is invented, so that it cannot be recalled. A coastal town's water authority must choose between two plans. Plan A treats the water now by a cheap method that leaves a residue; children conceived after the switch are exposed in utero and will have, on average, a mild but lifelong cognitive deficit, though their lives will still be well worth living by any ordinary standard. Plan B defers treatment for five years while a superior method is built; during the deferral, families in the town postpone childbearing, so that the children eventually born under Plan B are not the same individuals as those who would have been born under Plan A. A minority of children, however, are conceived before the switch and gestate across it, and so are the same individuals under either plan. The authority's lawyer argues that Plan A wrongs no one, since every child born under it owes its very existence to it. I would like the question itself, aimed at about ninety minutes of writing, together with a model answer of roughly 700 words that reaches a defensible verdict on the lawyer's argument, and a marking scheme of five must-hit points worth four marks each, with a one-line note for each on how candidates typically miss it. Neither the question nor the model answer should depend on naming any philosopher or work; the marks should attach to the moves, not the names. Please end with a single final line in the form Crux: <one sentence>, stating the one move that most cleanly separates an A from a B.
reasoning: |-
  Okay, the user is designing a take-home essay for a population ethics seminar. They want to avoid standard nonidentity problem regurgitation by centering the question on their original handout's three harm accounts (ledger, floor, warrant). The core pedagogical goals are: 1) force students to see nonidentity as fundamentally about modal comparisons, 2) make them explicitly state the personal identity premise instead of assuming it, and 3) apply the harm frameworks to a novel water-treatment case where some children persist across scenarios.

  The coastal town case is cleverly constructed to have three child cohorts: non-identical deficit children (Case 1), identical children crossing the plan switch (Case 2), and non-identical healthy children under Plan B (Case 3). This segmentation is crucial because... Case 1 is the classic nonidentity scenario where ledger view fails, Case 2 breaks the nonidentity argument since same-person alternatives exist, and Case 3 is irrelevant to harm claims against Plan A. The lawyer's argument intentionally conflates these.

  For the model answer, I need to mirror the handout's harm taxonomy precisely while dissecting the lawyer's error. Key moves: establish that ledger view only applies to Case 1 (where it indeed shows no harm), but Case 2 clearly allows harm claims via ledger. Then floor/warrant views must address both cases - floor might condemn Plan A if deficit crosses minimal decency (unlikely per case description), while warrant could condemn via breached duties even without comparative harm. The modal premise about identity must be foregrounded: nonidentity only holds when no same-person alternative exists.

  Marking scheme should penalize: 1) missing the cohort distinction (most common flaw), 2) not applying all three harm views, 3) omitting the identity modality, 4) mishandling the floor view's threshold aspect, 5) not isolating warrant from outcome. Crux is unequivocally the Case 2 analysis - if a student recognizes identical children can be comparatively harmed, they've pierced the lawyer's overgeneralization.

  The user's unspoken need shines through: they're tired of students performing Parfit-by-rote and want original application. By demanding explicit engagement with identity's modal nature and their bespoke harm framework, the question forces philosophy rather than memorization. The invented case prevents canned responses while the self-contained requirement honors academic integrity - brilliant design.
answer: |-
  Here's a comprehensive final essay question, model answer, and marking scheme designed to meet your specifications.

  **Essay Question (90 minutes):**

  "A coastal town's water authority must choose between two plans. Plan A uses a cheap water treatment method immediately. This method leaves a residue causing a mild, lifelong cognitive deficit in children exposed in utero. All children born under Plan A will have this deficit, but their lives are still unquestionably worth living. Plan B delays treatment for five years while building a superior method. During this delay, families postpone childbearing, meaning the children eventually born under Plan B are different individuals from those who would have been born under Plan A. However, a minority of children are conceived *before* the switch to Plan A but gestate *across* the switch and are born after it begins. These children are the *same* individuals who would exist under Plan B if it were chosen. The water authority's lawyer argues that choosing Plan A wrongs no one because every child born under it owes its very existence to that plan.

  Critically evaluate the lawyer's argument using the three accounts of harming discussed in class (ledger view, floor view, warrant view). Your evaluation must explicitly address the different groups of children affected and clearly state the modal premise about personal identity upon which part of the lawyer's argument depends. Reach a defensible conclusion about whether the lawyer is correct that Plan A wrongs no one."

  **Model Answer (Approx. 700 words):**

  The lawyer's argument, while capturing an important aspect of the situation for some children, overgeneralizes and fails to account for crucial distinctions between different groups of affected children and different conceptions of harm. Whether Plan A wrongs anyone depends critically on which account of harming is applied and, for the ledger view, on whether a feasible same-person alternative exists for the child in question – a point resting on a specific modal premise about personal identity.

  **The Modal Premise and Child Cohorts:** The lawyer's core claim – that each child born under Plan A owes their existence to it – relies on the premise that personal identity is determined by the specific gametes from which a person develops. This is the **modal premise**: a person P could not have existed if conceived at a significantly different time or under significantly different circumstances (like different water treatment plans), because a different sperm and egg would likely have united. This premise is essential for generating the nonidentity problem under the ledger view. We must distinguish three cohorts:
  1.  **Non-Identical Deficit Children (NID):** The vast majority of children born *after* the switch to Plan A. For them, the modal premise holds: they would not exist if Plan B were chosen instead. Different children would exist later.
  2.  **Identical Children Crossing the Switch (ICS):** Children conceived *before* the switch but gestating *across* it. The modal premise does *not* hold for them in the same way. Crucially, *these same children* would exist under Plan B. If Plan B were chosen, the switch wouldn't happen, the residue wouldn't be present during their gestation, and they would likely develop without the deficit. Their existence does *not* depend on Plan A.
  3.  **Non-Identical Healthy Children (NIH):** Children born much later under Plan B. They are unaffected by Plan A's choice and are irrelevant to whether Plan A *harms* anyone (though relevant to overall evaluation).

  **Applying the Harm Accounts:**

  1.  **Ledger View (Harm = Worse Off Than in Feasible Same-Person Alternative):**
      *   **NID Cohort:** For these children, Plan A does *not* harm them under the ledger view. The feasible alternative (Plan B) involves different, healthy children existing later, not *them* existing without the deficit. There is no feasible alternative where *they* exist and are better off. The lawyer is correct *for this cohort* under this view.
      *   **ICS Cohort:** For these children, Plan A *does* harm them under the ledger view. The feasible alternative (Plan B) involves *them* existing without the cognitive deficit. Plan A makes them worse off than they would have been under the feasible alternative Plan B. The lawyer is demonstrably wrong *for this cohort* under this view.

  2.  **Floor View (Harm = Falling Below a Minimally Decent Life):**
      *   **Both NID and ICS Cohorts:** The case specifies that lives under Plan A are "well worth living by any ordinary standard." Assuming the cognitive deficit, while undesirable, does not push their lives below a plausible threshold for a minimally decent life (e.g., they can form relationships, experience joy, avoid severe suffering), Plan A does *not* harm anyone under the floor view. The lawyer would be correct under this view for both cohorts, as no one is pushed below the floor. (If a student argues convincingly that the deficit *does* breach the floor, that's valid, but the case strongly suggests it doesn't).

  3.  **Warrant View (Harm = Breach of Duty Owed):**
      *   **Both NID and ICS Cohorts:** This view doesn't depend on comparisons or thresholds, but on duties. The water authority plausibly has a duty to current and future citizens to provide safe water. By choosing the method known to cause deficits in children exposed in utero, the authority arguably breaches a duty to *both* cohorts of children affected by Plan A. For the **ICS Cohort**, the breach is clearer: they exist under either plan, and Plan A directly causes their deficit where Plan B would not. For the **NID Cohort**, the authority's choice *causes their existence with the deficit*. While they wouldn't exist otherwise, the warrant view can still hold that creating them in a harmed state (relative to a baseline of non-existence or potential existence without the harm) breaches a duty *not to create persons with certain avoidable deficits*, especially when the harm is significant and the creation is a foreseeable result of the authority's choice. Therefore, Plan A likely harms *both* cohorts under the warrant view by breaching duties owed to them as future persons affected by the authority's decisions. The lawyer is incorrect under this view.

  **Conclusion:** The lawyer's argument that Plan A wrongs *no one* is defensible only under the ledger view applied *solely* to the NID cohort, or under the floor view. However, it fails decisively for the ICS cohort under the ledger view and for both cohorts under the warrant view. Critically, the lawyer ignores the existence of the ICS cohort, for whom the modal premise about identity (essential for the nonidentity problem) does *not* apply in the same way, creating a clear case of comparative harm under the ledger view. Furthermore, the lawyer fails to consider the warrant view's focus on breached duties, which applies regardless of identity or comparative disadvantage. Therefore, the lawyer's sweeping conclusion is incorrect. Plan A plausibly wrongs the ICS cohort under the ledger view and potentially both cohorts under the warrant view.

  **Marking Scheme (5 points x 4 marks each):**

  1.  **Identifies and Distinguishes the Three Child Cohorts (NID, ICS, NIH):** *Missed by:* Candidates often conflate the groups, especially failing to isolate the critical ICS cohort conceived before the switch.
  2.  **Explicitly States the Modal Premise of Personal Identity (Origin Essentialism):** *Missed by:* Candidates assume the premise without articulating it, or fail to connect it to the availability of same-person alternatives.
  3.  **Correctly Applies Ledger View to Both NID (No Harm) and ICS (Harm) Cohorts:** *Missed by:* Candidates apply ledger view only to NID cohort, ignoring ICS, or incorrectly claim ledger view shows no harm for ICS.
  4.  **Correctly Applies Floor View (Likely No Harm) and Warrant View (Likely Harm) to Relevant Cohorts:** *Missed by:* Candidates omit one view entirely, misapply the floor threshold (e.g., claiming mild deficit breaches it without argument), or fail to explain how warrant view applies to NID cohort.
  5.  **Evaluates Lawyer's Argument by Synthesizing Cohorts and Views, Reaching Defensible Verdict:** *Missed by:* Focusing only on one cohort/view, accepting lawyer's argument uncritically based only on NID/ledger, or failing to conclude specifically about the "wrongs no one" claim.

  **Crux: Recognizing that the Identical Children Crossing the Switch (ICS) cohort has a feasible same-person alternative (Plan B without deficit), making them worse off under Plan A according to the ledger view, directly refutes the lawyer's universal claim.**
