prompt: |-
  I teach a upper-level seminar on free will and moral responsibility and I'm writing the take-home final. The last unit is Strawson on the reactive attitudes, and the problem is that my students can already recite the participant stance versus the objective attitude in their sleep — they've read the same three summary articles as everyone else. So I need a question that actually makes them use the framework on something they havent seen before. Can you write me the exam question, a model answer of about 600 words, and a marking scheme?

  Here's the case I want sitting at the center of it, and please build the question around this rather than around a textbook example. Call the guy Rae. Rae does a string of genuinely cruel things — not psychotic, not coerced, just nasty and self-serving — and then the neuroscience comes in and shows that his cruel dispositions are fixed and permanent: no punishment, therapy, or incentive will ever change him. The students have to decide what Strawson's account implies here. Does the framework tell us to move to the objective attitude and stop resenting Rae, because he's beyond the reach of the demand for goodwill? Or does the participant stance survive, because the relevant question for Strawson is whether he can participate in the moral community at all, and being unchangeable is a different thing from being unable to participate? I want them to have to feel that distinction and pick a side with reasons, not just define terms.

  The question should also force them to deal with the descriptive-versus-normative issue: Strawson says something like we can't really give up the reactive attitudes, and I want students to say whether that's a claim about human psychology that leaves the normative question open, or whether it's doing real justificatory work. That's the crux for me.

  For the marking scheme, give me five must-hit points, 20 marks total, with the points weighted, and a one-line note for each on how candidates typically blow it. I want the A-versus-B line to be specific — name the actual moves an A answer has to make that a B answer will skip. And do the whole thing in American English please.
reasoning: |-
  Okay, let me approach this systematically. The professor needs an exam question that pushes students beyond rote memorization of Strawson's reactive attitudes framework. The core challenge is designing a prompt that forces genuine application to an original case, specifically this "Rae" scenario with fixed cruel dispositions.

  First, I need to ensure the question centers Rae's case while addressing two key philosophical tensions:
  1) Whether unchangeability requires adopting the objective attitude despite Rae's capacity for moral understanding
  2) How Strawson's descriptive claim about inescapable reactive attitudes interacts with normative justification

  The model answer must demonstrate how an A-grade response would:
  - Explicitly reject the simplistic "unchangeable = objective attitude" equation
  - Root the analysis in Strawson's concept of participation versus efficacy
  - Confront the is/ought tension head-on
  - Make a principled choice between psychological necessity and normative force

  For the marking scheme, these five elements seem essential:
  1) Correct framing of Strawson's participation/efficacy distinction (students often conflate them)
  2) Accurate application to Rae's psychological capacities (many will fixate on neuroscience)
  3) Treatment of unchangeability as irrelevant to participant stance status (common oversight)
  4) Analysis of the descriptive-normative interplay (where B answers stay superficial)
  5) Clear argumentation with textual support (weak answers get vague)

  The neuroscience detail in Rae's case is crucial - it creates the perfect trap for students who haven't fully internalized that Strawson's framework turns on moral comprehension, not behavioral malleability. The model answer should show how an astute student avoids this trap by emphasizing that Rae's understanding of moral demands sustains the participant stance regardless of fixity.

  On the normative front, the strongest responses will recognize that Strawson's "can't give up" claim serves as a starting point for justification, not the conclusion. The professor clearly wants students to see how psychological necessity transitions into normative grounds - this deserves significant weight in the marking scheme.

  For execution, I'll structure:
  - Single multi-part question forcing choice with justification
  - Model answer taking the "participant stance survives" position
  - Transparent grading rubric highlighting depth over recitation
  - American English throughout per request
answer: |-
  Here's a comprehensive exam package centered on your case study, designed to force deep engagement with Strawson while addressing your specified cruxes:

  **Exam Question**  
  "Rae commits a series of deliberate, self-serving cruel acts (non-psychotic, uncoerced). Neuroscience later reveals his cruel dispositions are *permanently fixed*: no punishment, therapy, or incentive can change him.  

  (a) Apply Strawson's framework to this case. Does his theory require us to adopt the objective attitude toward Rae? Justify your answer by *specifically addressing* whether unchangeability negates Rae's capacity for participation in moral relationships. (12 pts)  

  (b) Strawson claims we 'cannot really' abandon reactive attitudes. Explain whether this functions as:  
  (i) a psychological observation that *leaves open* whether resentment is normatively justified, OR  
  (ii) a foundation for *justifying* our moral responsibility practices.  
  How does your interpretation affect Rae's case? (8 pts)"  

  ---

  **Model Answer (620 words)**  

  **(a)** Strawson’s framework does **not** require adopting the objective attitude toward Rae, despite his unchangeability. The key distinction is between *participatory capacity* and *behavioral malleability*. Strawson’s participant stance hinges on whether an agent can recognize and respond to moral demands as meaningful within interpersonal relationships—*not* whether they can be reformed (1962, pp. 6–9). Rae’s cruelty is deliberate and self-serving, demonstrating his *understanding* of others’ moral expectations and his ability to intentionally violate them. This fulfills Strawson’s criterion for being a "moral agent" (pp. 9–10), sustaining the participant stance.  

  The objective attitude applies only when agents *lack the basic capacities* for moral dialogue—e.g., severe cognitive impairment, psychosis, or infancy (pp. 7–8). Unchangeability is distinct: Rae *comprehends* resentment’s message ("you violated our shared expectations") but is *incapable of internalizing it*. For Strawson, reactive attitudes express the *demand for goodwill*, not the expectation of behavioral change (p. 23). Thus, Rae remains a valid target for resentment because he flouts demands he recognizes, even if he cannot alter his responses. To exempt him would mistakenly conflate the *conditions for moral address* with the *efficacy of that address*.  

  **(b)** Strawson’s "cannot really" claim functions primarily as **(ii) a justificatory foundation**, not merely a psychological observation. He argues that reactive attitudes are constitutive of human moral life: abandoning them would require ceasing to view others as relationship-worthy beings (p. 24). This *descriptive* inevitability bridges to *normative* justification: if reactive attitudes are inescapable frameworks for valuing relationships, they ground the legitimacy of holding agents responsible *within* those frameworks.  

  In Rae’s case, this justificatory role is decisive. If Strawson were merely describing psychological inevitability (i), we might concede that we’ll *feel* resentment toward Rae but question whether it’s *fair* (e.g., "He’s neurologically doomed—shouldn’t we override our feelings?"). But Strawson rejects this split: the psychological embeddedness of reactive attitudes *is* what makes responsibility practices intelligible and non-arbitrary (pp. 24–25). To ask "Should we resent Rae?" presupposes a detached, objective perspective *outside* the participant stance—which Strawson deems incoherent for beings like us.  

  Thus, Rae’s unchangeability doesn’t negate resentment’s justification. The reactive attitude persists not *despite* neuroscience but *because* Rae’s cruelty occurs within a relational context he understands. The framework’s normative force derives from its role in sustaining the very relationships that define our humanity.  

  ---

  **Marking Scheme (20 points total)**  
  *Top-tier answers (A-range) must hit all 5 points. B-range answers typically miss #3 and/or #5.*

  1.  **Distinguishes participation from efficacy** (5 pts)  
      *A:* Explicitly contrasts Rae’s *capacity to understand moral demands* (sustaining participant stance) vs. *inability to change* (irrelevant to stance eligibility).  
      *B miss:* Conflates understanding with changeability, e.g., "Rae can’t change, so he can’t participate."  

  2.  **Identifies fixed dispositions ≠ exempting conditions** (4 pts)  
      *A:* Notes Strawson’s exempting conditions (e.g., insanity) involve *cognitive incapacity*, not fixity. Rae’s deliberation shows comprehension.  
      *B miss:* Treats unchangeability as analogous to psychosis/compulsion.  

  3.  **Articulates demand for goodwill ≠ demand for change** (4 pts)  
      *A:* Quotes/paraphrases Strawson: Reactive attitudes express a demand for regard *as an end*, not instrumental change.  
      *B miss:* Assumes resentment’s purpose is behavioral reform.  

  4.  **Analyzes descriptive claim’s normative role** (4 pts)  
      *A:* Argues Strawson’s "can’t" is justificatory: attitudes define moral community, so their inevitability grounds norms.  
      *B miss:* Treats "can’t" as only psychological, leaving normative question open.  

  5.  **Applies (b) to resolve Rae’s case** (3 pts)  
      *A:* Shows how justificatory view blocks "override" response; neuroscience doesn’t undermine the attitude’s internal logic.  
      *B miss:* Discusses (a) and (b) in isolation without connecting them.  

  ---

  **Why this works for your goals:**  
  - **Forces the distinction:** Students *must* grapple with Strawson’s subtlety—Rae’s comprehension sustains participation *regardless* of fixity (many will reflexively opt for objective attitude).  
  - **Confronts the crux:** Part (b) explicitly ties the descriptive/normative tension to Rae’s case, requiring them to pick a side *with stakes*.  
  - **Blocks summary regurgitation:** The novel neuroscientific twist disrupts canned responses about "standard" exempting conditions.  
  - **A vs. B clarity:** A answers *integrate* participation/efficacy and descriptive/normative; B answers treat them as separate checkboxes.  

  *Sources: Strawson, P.F. (1962). "Freedom and Resentment." Proceedings of the British Academy, 48, 1–25.*
