prompt: |-
  I am trying to build a procedure that sorts any action into one of three boxes — forbidden, required, or beyond the call — and the third box keeps collapsing into one of the other two. Before I commit to a theory of supererogation, write me the desiderata: what any adequate theory of it has to deliver. Give the full list — the phenomena it must fit, the cases it must get right, the distinctions it may not erase, and the results it must remain consistent with — with the case or consideration behind each requirement. Keep at least these in view: an act that is genuinely optional yet morally better than the act one was required to perform; the blamelessness of simply not doing it; an act that costs the agent nothing and still counts as going beyond; two agents who can each contribute only a fragment of a good that neither is required to complete; and the drift by which what was once beyond duty becomes duty as it grows easier. Then say which requirements are non-negotiable and which are the prejudices of one camp, and flag any pair you believe cannot be jointly satisfied. That last part is what I most want; skip the scorecard of existing views.
reasoning: |-
  We are constructing desiderata for a theory of supererogation. The goal is to have a set of requirements that any adequate theory must satisfy. We are to focus on the phenomena, cases, distinctions, and consistency requirements. We must also highlight which requirements are non-negotiable and which might be contentious, and flag any pairs that seem incompatible.

   Let's list the desiderata:

   1. **The Optionality Requirement**: There must be acts that are genuinely optional (i.e., neither forbidden nor required) and yet are morally better than the minimally required act. 
      - *Case/Consideration*: An act that is beyond the call (supererogatory) must be such that the agent is not required to do it, but if done, it is morally better than just doing what is required.

   2. **The Blamelessness Requirement**: Failing to perform a supererogatory act must not entail blame or moral condemnation. 
      - *Case/Consideration*: The blamelessness of simply not doing the supererogatory act. The agent who does only what is required does nothing wrong.

   3. **The Beyondness Requirement**: An act can be supererogatory even if it costs the agent nothing. 
      - *Case/Consideration*: An act that costs the agent nothing and still counts as going beyond the call of duty. (This challenges the idea that supererogation necessarily involves sacrifice.)

   4. **The Fragmentary Contribution Requirement**: It must be possible for two (or more) agents to each contribute only a fragment of a good that neither is individually required to complete, and the failure of any one agent to contribute does not make them blameworthy, even if the collective good is not achieved because of multiple individual failures. 
      - *Case/Consideration*: Two agents, each of whom can contribute only a fragment of a good (say, donating a small amount to a charity) that is not enough by itself and also not required of them. The failure of one does not make the other's contribution required? Or the failure of both does not make either blameworthy? The idea is that each is free to contribute or not, and the good is only achieved if enough contribute.

   5. **The Drift Requirement**: What was once beyond the call of duty can become required as it becomes easier to perform. 
      - *Case/Consideration*: The drift by which an act that was once supererogatory (because difficult) becomes obligatory when it becomes easy. For example, with technological advancement, rescuing someone from a distance might become easy and thus required.

   Additionally, we can consider some other standard points:

   6. **The Goodness Requirement**: Supererogatory acts must be morally good (or at least permissible) and better than some available alternative that is merely permissible. 
      - *Case/Consideration*: Without this, we might call an act supererogatory that is actually bad.

   7. **The Sacrifice Consideration (but note the Beyondness Requirement above)**: While we have said that an act can be supererogatory without cost, it is often thought that typical supererogatory acts involve some sacrifice. However, the theory must not require sacrifice in all cases. So we have already included that sacrifice is not necessary.

   8. **The No Collapse Requirement**: The theory must not collapse the category of the supererogatory into either the required or the forbidden. This is to preserve the tripartite division. 
      - *Case/Consideration*: The problem of the third box collapsing. The theory must explain why sometimes an act is optional and beyond duty without becoming required or forbidden.

   9. **The Consistency Requirement**: The theory must remain consistent with the idea that there are limits to what can be required (e.g., extreme sacrifice might not be required) and that supererogation starts beyond that limit. 
      - *Case/Consideration*: For instance, it might be required to save a drowning child if it only costs getting one's clothes wet, but not required if it costs one's life. The latter might be supererogatory.

   10. **The Agglomeration Problem**: If an agent can perform a series of supererogatory acts, does that series become required? The theory must handle cases of repeated opportunities without making the cumulative effect required. 
       - *Case/Consideration*: If I give one dollar to charity every day, each act is supererogatory. But if I give every day for a year, is that required? Probably not, but the theory must account for this.

   11. **The Interaction with Imperfect Duties**: The theory must distinguish between supererogatory acts and acts that are required by an imperfect duty (which allow for discretion in when and how to perform). 
       - *Case/Consideration*: An imperfect duty (like helping others) requires some acts of helping but leaves choice about which ones and when. Supererogation might go beyond what the imperfect duty requires.

   Now, let's flag:

   - **Non-negotiable**: The first two (Optionality and Blamelessness) are widely regarded as non-negotiable. Without them, we don't have supererogation. Also, the Beyondness Requirement is important because it challenges the traditional view that supererogation requires sacrifice. But note: some might argue that without any cost, an act is not supererogatory. So this might be contentious.

   - **Contentious**: 
        - The Beyondness Requirement (3) might be contentious because some theories (especially those emphasizing sacrifice) may not accept that an act with no cost can be supererogatory.
        - The Fragmentary Contribution Requirement (4) might be challenging because it involves collective action and the problem of over-demandingness. Some theories might say that if the good is important enough and the cost is negligible, then each agent is required to contribute. But we want to allow that the act remains beyond duty even in such cases.

   - **Potential Incompatibilities**:
        - Between the Fragmentary Contribution (4) and the Drift (5): As an act becomes easier (drift), it may become required. But in the fragmentary case, if the cost is negligible (so very easy), then why isn't it required? The theory must explain why in the fragmentary case, even though the cost is low, it is not required (perhaps because the individual contribution is negligible? but then drift might say that if it's easy and the good is significant, it becomes required). This tension might be resolved by noting that in the fragmentary case, the individual contribution by itself does not produce the good, so the agent might not be required to contribute unless there is assurance that others will too. But without that assurance, the act remains optional.

        - Between the Beyondness (3) and the typical intuition that supererogation involves going above and beyond: If an act costs nothing, is it really going beyond? Some might argue that it is not. So this requirement might be contentious and might conflict with the common understanding.

        - Between the Optionality (1) and the Drift (5): If an act becomes very easy, the drift requirement says it becomes required. But then it is no longer optional. So the same act that was once optional (when hard) becomes non-optional (when easy). This is not an incompatibility per se, but it shows that the same act can change category. The theory must account for this.

        - Between the Fragmentary Contribution (4) and the No Collapse Requirement (8): If we have a situation where a collective good is needed and each individual contribution is negligible, then one might argue that each agent is required to contribute (because the cost is low and the good is great). But then the supererogatory category collapses for that act. The theory must avoid this collapse.

   Now, flagging pairs that might be difficult to jointly satisfy:

     - **Fragmentary Contribution (4) and Drift (5)**: 
          - In the fragmentary case, if the cost of contributing is very low (approaching zero), then by the drift principle, the act should become required. But the fragmentary case is set up to be beyond duty. How can we have both? 
          - Possible resolution: The drift might apply only when the act by itself produces a significant good. In the fragmentary case, the individual act does not by itself produce a significant good (only a fragment). So even if it costs nothing, it might remain supererogatory because the agent is not required to contribute to a collective good unless there is a reasonable expectation that the collective good will be achieved (or unless the agent is required to do their fair share). This requires a nuanced view.

     - **Beyondness (3) and the traditional view of supererogation**:
          - Many think supererogation requires sacrifice. If we insist that an act with no cost can be supererogatory, we might conflict with common intuitions. But this is more of a challenge to the traditional view.

     - **Agglomeration (10) and Drift (5)**:
          - If an act is repeated many times, the cumulative cost might become high. But the drift principle says that if an act becomes easier (each instance remains low cost) then each instance might become required? But then the agglomeration might lead to a very demanding requirement. The theory must avoid this.

   After laying out the desiderata, note that the most challenging pair is (4) and (5). Also, note that the Beyondness (3) may be a point of contention.

   Finally, we must also consider:

   12. **The Limits of Requirement**: The theory must respect that there are limits to what can be morally required. Acts that require extreme sacrifice (e.g., giving one's life) are typically beyond the call of duty. 
       - *Case/Consideration*: The traditional example of a soldier jumping on a grenade to save comrades is supererogatory because it is not required (it's too costly) but is morally heroic.

   This requirement (12) is non-negotiable and is the flip side of the Drift Requirement (5): when an act becomes easier, it may become required, but when it is very hard, it is not required.

   With these in mind, we have a robust set of desiderata.
answer: |-
  Below are the desiderata for an adequate theory of supererogation, structured to capture the phenomena it must accommodate, the cases it must correctly classify, the distinctions it must preserve, and the results it must align with. Each requirement is grounded in a specific case or consideration, with non-negotiables flagged, contentious points noted, and potential incompatibilities highlighted. The focus is on conceptual adequacy, not scoring existing theories.

  ---

  ### **Desiderata for a Theory of Supererogation**  
  **Core Phenomena & Cases to Fit:**  

  1. **Genuine Optionality with Moral Superiority**  
     - *Requirement*: The theory must recognize acts that are **morally optional** (neither forbidden nor required) yet **morally better** than the minimally required act.  
     - *Case*: Rescuing a stranger from a burning building at great personal risk when one could easily call for help instead (required). The rescue is praiseworthy but not obligatory.  
     - *Non-negotiable*: Yes. Collapses the "beyond" box if unmet.  

  2. **Blameless Omission**  
     - *Requirement*: Failing to perform a supererogatory act must **not warrant blame or censure**.  
     - *Case*: Choosing not to donate a kidney to a stranger. The agent is morally neutral (not required), not condemnable.  
     - *Non-negotiable*: Yes. Essential to distinguish supererogation from duty.  

  3. **Costless Supererogation**  
     - *Requirement*: An act must be classifiable as supererogatory **even if it costs the agent nothing** (e.g., no effort, risk, or sacrifice).  
     - *Case*: Pressing a button to divert renewable energy to a struggling community, with no personal downside. The act is optional but morally better than the required minimum (e.g., not wasting resources).  
     - *Non-negotiable*: Contentious. Some camps tie supererogation to sacrifice; others reject this.  

  4. **Fragmentary Contributions**  
     - *Requirement*: The theory must allow **multiple agents** to each contribute a fragment toward a collective good, where:  
       - No single agent is required to complete the good alone.  
       - No agent is blameworthy for abstaining, even if the collective good fails.  
     - *Case*: Ten people each need to donate $1 to save a life. No one is required to donate (the $1 is trivial but not obligatory), yet each donation is supererogatory. If only nine donate, no single abstainer is blameworthy.  
     - *Non-negotiable*: Contentious. Utilitarians may argue trivial costs make it required; deontologists often reject this.  

  5. **Duty-Drift with Ease**  
     - *Requirement*: Acts once supererogatory must **become obligatory** as they grow easier or less costly.  
     - *Case*: In 1800, crossing a continent to deliver life-saving medicine was supererogatory (due to danger). In 2024, overnight shipping makes it required. The theory must explain this transition.  
     - *Non-negotiable*: Yes. Reflects the dynamic link between cost and obligation.  

  **Distinctions to Preserve:**  

  6. **Supererogation vs. Imperfect Duties**  
     - *Requirement*: The theory must **distinguish supererogation from imperfect duties** (e.g., beneficence), which are obligatory but flexible in execution.  
     - *Case*: Giving $1 to charity is supererogatory; giving 10% of income annually (as an imperfect duty) is required. Supererogation lacks the "duty to adopt a maxim" inherent in imperfect duties.  
     - *Non-negotiable*: Yes. Erasing this collapses optional acts into required ones.  

  7. **Supererogation vs. Permissible Suboptimality**  
     - *Requirement*: The theory must **avoid reducing supererogation to merely "permissible" acts**, emphasizing its **positive moral value** beyond baseline permissibility.  
     - *Case*: Choosing to read a book (permissible but neutral) vs. volunteering at a shelter (supererogatory). The latter is actively commendable.  
     - *Non-negotiable*: Yes. Otherwise, the "beyond" box collapses.  

  **Results to Align With:**  

  8. **No Overdemandingness**  
     - *Requirement*: The theory must **not make excessive sacrifices obligatory** (e.g., self-destruction, profound loss).  
     - *Case*: Jumping on a grenade to save ten lives is supererogatory, not required.  
     - *Non-negotiable*: Yes. Aligns with intuitive limits of duty.  

  9. **Praiseworthiness Without Requirement**  
     - *Requirement*: Supererogatory acts must warrant **praise for performance** without implying blame for non-performance.  
     - *Case*: Donating a $1,000 bonus to charity. Praise is appropriate, but no censure for keeping it.  
     - *Non-negotiable*: Yes. Core to supererogation’s moral structure.  

  ---

  ### **Contentious Requirements & Potential Incompatibilities**  
  - **Costless Supererogation (3)**:  
    - *Contentiousness*: Rejected by sacrifice-centric views (e.g., classical utilitarianism). Non-negotiable for "no-sacrifice" camps.  
  - **Fragmentary Contributions (4)**:  
    - *Contentiousness*: Contested by theories requiring collective coordination (e.g., some contractualisms). May be seen as a "prejudice" of individualism.  

  #### **Flagged Incompatible Pairs**  
  The following requirements are in tension and may be **impossible to jointly satisfy** under a single theory:  

  1. **Fragmentary Contributions (4) + Duty-Drift with Ease (5)**  
     - *Conflict*: If each fragmentary act (e.g., donating $1) costs nothing (ease), Duty-Drift implies it should become **required**. Yet Fragmentary Contributions demand it remains **optional** (no blame for abstaining).  
     - *Why incompatibility?*: Duty-Drift ties obligatoriness to low cost, while Fragmentary Contributions insist on optionality despite low cost. Resolving this requires either:  
       - Denying that fragmentary acts are truly costless (e.g., psychological effort), or  
       - Limiting Duty-Drift to acts with direct/significant impact (unlike fragments).  

  2. **Costless Supererogation (3) + Overdemandingness (8)**  
     - *Conflict*: If costless acts can be supererogatory (3), but extreme sacrifices are never required (8), what distinguishes a costless supererogatory act from a high-cost one? Overdemandingness assumes cost matters for duty, but (3) severs cost from supererogation.  
     - *Why incompatibility?*: (3) decouples supererogation from cost, while (8) uses cost to define the limits of duty. A theory must either:  
       - Reject (3) and tie supererogation to cost, or  
       - Argue that (8) is about absolute sacrifice thresholds, not costlessness.  

  3. **Fragmentary Contributions (4) + Praiseworthiness (9)**  
     - *Conflict*: If no single fragmentary act is praiseworthy (due to negligible impact), yet (9) requires praiseworthiness, fragmentary acts cannot be supererogatory. Conversely, if fragments are praiseworthy, (4) must explain why abstaining isn’t blameworthy.  
     - *Why incompatibility?*: (9) demands intrinsic moral value, while (4) implies value is contingent on collective success.  

  ---

  ### **Summary**  
  - **Non-negotiables**: Genuine Optionality (1), Blameless Omission (2), Duty-Drift (5), Supererogation vs. Imperfect Duties (6), No Overdemandingness (8), Praiseworthiness (9).  
  - **Contentious**: Costless Supererogation (3), Fragmentary Contributions (4).  
  - **Key Incompatibilities**: Fragmentary Contributions + Duty-Drift (most critical), Costless Supererogation + Overdemandingness.  

  A viable theory must resolve these tensions—e.g., by refining "cost" (beyond material sacrifice) or limiting fragmentary cases—without collapsing the third box. The Fragmentary vs. Duty-Drift conflict is the hardest nut to crack, demanding a dynamic account of how individual acts aggregate into moral requirements.
