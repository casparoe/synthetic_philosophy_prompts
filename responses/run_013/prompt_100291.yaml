prompt: |-
  ok so this is a thing i've been chewing on for a while and i don't know if it has a name. i'm not a lawyer or a philosopher, i just work in a creative-ish field and read too much.

  here's what i keep noticing. somebody has an idea. maybe they say it out loud in a meeting, maybe they mention it to a friend over drinks, maybe they write it in a notebook and never do anything with it. then later someone else -- who either never heard it, or heard it and forgot -- actually does something with that idea, and it becomes "theirs." and the first person feels robbed. not legally robbed, they usually know there's no case. just... robbed. and the weird part is the feeling seems strongest exactly when there's the least to lose: when the idea was never going to make money, when the second person never even knew about the first, when the idea was honestly the kind of thing lots of people were already circling around anyway.

  a couple concrete flavors of it:

  - a group of people kick an approach around for months in conversation, nobody writes anything down, one person eventually writes it up properly and now its "her framework." everyone else is genuinely happy for her and also quietly stung, and none of them can state a grievance, because she did do the work of articulating it.
  - a word or phrase that everyone was using loosely for years gets claimed by whoever first writes an essay about it, and from then on you're supposed to cite that person as if they invented the thing, which they sort of did and sort of didn't.

  and here's the part that really bugs me. we have a sharp, common word for taking someone's actual sentences -- plagiarism. we have basically no word for taking someone's idea and just saying it in your own words, even though i'm pretty sure most people feel that one more keenly. and separately: you can give an idea away, publish it, explain it to everyone, hand it over -- but you can't give away the credit for it. the credit is the one part you don't control, and turns out to be the only part that mattered.

  so: is there an established name for this whole cluster -- the felt ownership of an idea that exists with or without any law, that attaches to whoever first put it into words, that survives you giving the idea away, and that gets stronger the less actual harm there is? if there's a name, great, tell me it, and then tell me precisely how it differs from the things its not: the labor-mixing story about property, the legal "moral rights" you hear about in europe, the priority-and-credit norms people describe in science, the matthew effect, and the ordinary idea/expression line. i have a feeling it's none of those exactly. and if there's no name, coin one and draw the edges -- what counts, what doesn't, and whether this is one thing or three things wearing a trenchcoat. i don't need a bibliography, i need the carving.
reasoning: |-
  Okay, the user is describing a phenomenon they've observed in creative fields where someone feels a sense of ownership over an idea that wasn't acted upon, only for someone else to later develop and receive credit for it. They're specifically asking if this has a name and how it differs from related concepts like plagiarism, intellectual property, or the Matthew Effect.

  First, I need to unpack what they're describing. The core elements seem to be:
  - The psychological sense of ownership over an idea before it's executed
  - The frustration when someone else develops it independently
  - The paradox that this feeling is strongest when there's no actual loss (no money involved, no plagiarism occurred)
  - The observation that credit attaches to the first person who articulates the idea publicly, regardless of prior discussions

  I recall that while there isn't a single perfect term for this, several concepts come close. The "Idea-Expression Dichotomy" in copyright law explains why ideas can't be owned, but doesn't address the psychological aspect. "Cryptomnesia" describes unconscious plagiarism but misses the independent creation scenario. The "Matthew Effect" explains how established figures get disproportionate credit, but doesn't cover cases where the original thinker was unknown.

  The user's examples are telling - especially the one about a group discussing an approach that one person later writes up as "their framework." This highlights how execution trumps ideation in terms of credit. The other example about a phrase becoming attributed to whoever wrote about it first shows how documentation creates ownership.

  For the psychological aspect, "Psychological Ownership" fits well - the feeling that something is "mine" even without legal rights. And for the credit assignment part, "Credit Displacement" captures that sense of being erased from the narrative.

  What's unique here is the combination of: the non-monetary nature, the lack of plagiarism, the independent development, and the emotional weight disproportionate to actual stakes. The user is right that we lack a crisp term for this specific cocktail of feelings and social dynamics.

  I'll propose "Evanescent Credit" as a possible term that captures how the original thinker's connection to the idea vanishes once someone else articulates it. I'll also map out the boundaries clearly - distinguishing it from plagiarism (which requires copying), IP law (which requires formal rights), and the Matthew Effect (which requires existing fame).

  The user seems to want both validation of their observation and conceptual clarity. They're frustrated by the lack of language for this common experience. I'll emphasize that while no term is perfect, we can characterize the phenomenon precisely by combining several existing concepts.
answer: |-
  You've hit on a profound, pervasive, and *maddeningly* unnamed phenomenon in creative and intellectual work. It *is* distinct from related concepts, and your frustration about the lack of a sharp word is spot-on. While no single universally accepted term exists, we can carve the conceptual space precisely and propose a fitting name.

  **The Core Phenomenon & Its Name**

  This is **Idea Credit Displacement**, specifically fueled by **Psychological Ownership of Ephemera**.

  *   **Idea Credit Displacement:** The core injustice felt is the *displacement* of the originator(s) from the *credit narrative* associated with an idea once it gains formal articulation/publication by someone else. The "credit" (attribution, association, recognition) moves from the originators to the articulator/publisher.
  *   **Psychological Ownership of Ephemera:** The "felt ownership" stems from **Psychological Ownership** (a well-established concept in psychology – feeling something is "MINE" even without legal rights). The object of ownership is **Ephemera:** vague notions, half-formed thoughts, conversational snippets, unrecorded discussions – ideas existing in an unstable, non-fixed state.

  **The Carving: What It Is (and Isn't)**

  1.  **Core Elements:**
      *   **Object:** An *idea* (concept, approach, observation, phrase nuance) in its *pre-formal* state (conversation, thought, undeveloped note).
      *   **Feeling:** **Psychological Ownership** by the originator(s) – a deep sense of "This is *my* (or *our*) insight/contribution."
      *   **Action:** Someone else (often unaware or forgetting the origin) **articulates/publishes/executes** the idea in a fixed, visible form (essay, framework, product, talk).
      *   **Outcome:** **Credit Displacement:** The articulator becomes the *de facto* or *de jure* source associated with the idea. The originator's psychological ownership feels violated, despite no legal claim.
      *   **Paradox:** The feeling is *strongest* when:
          *   The idea had low/no commercial value.
          *   The displacement was unintentional (no plagiarism).
          *   The idea was "in the air" (multiple independent origins likely).
          *   The originator freely shared the ephemeral idea.

  2.  **What It Is NOT (The Distinctions You Asked For):**
      *   **Plagiarism:** Plagiarism is the *verbatim or near-verbatim theft of fixed expression*. Idea Credit Displacement involves *ideas* that were *never fixed* by the originator and are *re-expressed independently* by the displacer. It's about the *concept*, not the specific words. Plagiarism is theft of output; this is displacement of association with input.
      *   **Labor-Mixing Property Theory (Lockean):** This justifies ownership based on mixing labor with resources. The originator *did* labor (thinking, discussing), but the *resource* (the raw idea space) is inherently non-rivalrous and non-excludable. Crucially, they *didn't* mix labor with the *fixed, public expression* that garners credit. The displacer mixed *their* labor with the ephemeral idea *and* the act of fixation. The originator's labor remains invisible.
      *   **Moral Rights (Droit Moral):** These are *legal* rights (primarily authorial/artistic) protecting attribution and integrity *of a specific, fixed work*. Idea Credit Displacement happens *before* a fixed work exists by the originator. It's about the *pre-work* idea association, not protecting the integrity of a work you *did* create.
      *   **Scientific Priority Norms:** Science has formal mechanisms (publications, pre-prints, conferences) precisely to *prevent* this displacement by establishing a timestamped record of *who articulated what when*. The agony in your scenarios stems from the *lack* of such formal systems in creative/business contexts for ephemeral ideas. Scientific norms *aim* to fix credit at the point of *first disclosure*; displacement happens when disclosure is informal and unfixed.
      *   **The Matthew Effect (Credit Concentration):** "To those who have, more will be given." This explains why established figures often get *disproportionate* credit for work they were marginally involved in. Idea Credit Displacement *can be exacerbated* by the Matthew Effect (the articulator might be more established), but it's distinct. Displacement can happen between peers or even where the originator *was* more senior. The core is the *transfer* of association from the unfixed origin to the fixed expression, regardless of relative status.
      *   **Idea/Expression Dichotomy (Copyright Law):** This is the legal doctrine *permitting* the situation: copyright protects *expression*, not ideas. Idea Credit Displacement is the *psychological and social consequence* of this doctrine in action. The law says the displacer did nothing wrong; the originator feels wronged socially/psychologically.

  3.  **Key Differentiators of "Idea Credit Displacement":**
      *   **Focus on Ephemera:** The idea must be in an unfixed, conversational, or purely mental state.
      *   **Psychological Ownership Central:** The harm is primarily the violation of this feeling of ownership, not economic loss or reputational damage *per se* (though those can follow).
      *   **Independent Articulation:** The displacer typically arrives at the expression independently or through forgotten osmosis, not conscious copying.
      *   **Credit Transfer:** The outcome is a shift in *who is associated with the idea* in the collective consciousness.
      *   **The Inverse Harm Paradox:** The feeling intensifies with the *lack* of tangible harm or malice.

  **Is it One Thing or Three in a Trenchcoat?**

  It's **one core phenomenon** (Psychological Ownership of Ephemeral Ideas + Credit Displacement upon Fixation) manifesting in slightly different contexts:

  1.  **The Collaborative Seedling (Your "Framework" Example):** Group psychological ownership over a developing idea crystallized by one member's articulation work. Displacement: The group effort is erased; it's "her" framework.
  2.  **The Linguistic Capture (Your "Word/Phrase" Example):** Diffuse, unowned usage of a term crystallized by someone defining/contextualizing it in writing. Displacement: The diffuse origin is forgotten; it's "his" concept.
  3.  **The Forgotten Spark:** Person A shares a raw idea casually with Person B. Person B forgets the source, later develops it independently. Displacement: Person A feels robbed; Person B is hailed as the originator.

  **The Name & The Gap**

  While **Idea Credit Displacement** accurately describes the *outcome*, and **Psychological Ownership of Ephemera** describes the *source of the feeling*, the *combination* – the specific, painful experience you describe – lacks a perfect, widely recognized single word or phrase. This is the linguistic gap you identified.

  **Proposal:** **Evanescent Credit Capture (ECC)**.

  *   **Evanescent:** Captures the fleeting, ephemeral nature of the original idea/ownership.
  *   **Credit:** The core asset being displaced.
  *   **Capture:** How the act of fixation/publication seizes and holds the credit association.

  **Why this resonates:** It emphasizes the *transient nature* of the original ownership ("Evanescent"), the *prize* being lost ("Credit"), and the *mechanism* by which it's lost ("Capture" through fixation). It acknowledges the feeling of something valuable *slipping away* to someone else, precisely when it seemed least valuable in concrete terms.

  **In essence:** You've identified the **Evanescent Credit** problem – the heartbreakingly fragile nature of association with an idea before it's made concrete, and how easily that association is **Captured** by whoever performs the act of concretion, regardless of origin or intent. The lack of a common word for this specific pain *is* part of the phenomenon itself – the very ephemerality that defines it makes it hard to pin down with language.
