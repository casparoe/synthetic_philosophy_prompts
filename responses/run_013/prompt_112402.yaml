  ### Sestina of the Shifting Measure  

  Within the bounded, green and level **field**,  
  a target waits: the centered, shaded **disk**.  
  We drop a point upon the coordinate **grid**—  
  along a **spoke**? Or by the **square**?  
  What **measure** falls, to answer what we hold?

  Our scene: a square, side two, without a fold.  
  A point must land at random in the **field**;  
  it hits the bullseye? That’s the **disk**, we’re told.  
  Now, first: impose on x and y the **grid**—  
  each axis uniform, no weight to **spoke**  
  nor bias in the **square** of what’s enrolled.

  What’s counted? Neither angle nor the **square**  
  of distance guides the hand we must uphold.  
  We pick by map, by Cartesian creed: the **grid**  
  ignores the center. Thus, across the **field**,  
  the point is scattered wide. When **spoke**-aligned,  
  we’d turn, but here we fix upon the **disk**?

  The chance? The circle’s area, pi, we find,  
  divided by four: that’s our shifting **measure**.  
  This point’s **square** placement seems concise and fair.  
  But shift the frame: now draw a radial **spoke**  
  from center out. On r and θ, bestow the **field**’s  
  indifference. Why prefer one **grid**?

  Here, rotation rules: each **spoke**  
  is equal. r runs from none to max, we hold,  
  and θ from zero round. The **field**  
  now spreads in rings, not squares. Our **disk**  
  awaits: we ask the same. What **measure**  
  then? By this light, without the **square**

  of r to weight it, chance is one-over-root-two, bare.  
  But wait—a third: let z (the **square**  
  of r) be uniform! No **spoke**  
  now guides. What symmetry commands this **measure**?  
  Scale? Distance squared? We grip what we uphold:  
  indifference in z. The **disk**  
  still sits, the **field** unchanged, the point untold.

  The **disk** demands: “Am I within the **field**  
  by r<1?” But z is king now. Dismiss the **grid**  
  and radial lines. The **square** of r’s the whole.  
  z uniform from zero to two. The **spoke**  
  means naught. The chance? One half! What we uphold  
  depends on where the uniform **measure** falls.

  ### Envoi  
  The **disk** endures, a fixed and steady hold,  
  though **grid**, **spoke**, **square** shift the **field**’s attire.  
  No single **measure** claims the prize; the fragments scold.

