  ### Prose Note  
  The poem explores three parametrizations of a point chosen randomly in a square field (side length 2) to find the probability of landing within a disk (radius 1) centered in the square.  

  - **Stanza 1 (Grid)**: Uniform Cartesian coordinates (x, y). Symmetry: translational invariance. Probability: π/4 (disk area π, field area 4).  
  - **Stanza 2 (Square)**: Uniform squared radial distance (z = x² + y²). Symmetry: indifference to scale of z. Probability: 1/2 (z uniform in [0, 2], disk requires z ≤ 1).  
  - **Stanza 3 (Spoke)**: Uniform polar coordinates (r, θ). Symmetry: rotational invariance. Probability: 1/√2 (radial uniformity without Jacobian weighting: favorable arc length 1, max radial span √2).  
  - **Stanzas 4–6**: Reiterate the core tension—each stanza recontextualizes the same end-words without new probabilities, emphasizing how the question ("disk") persists while symmetries ("grid", "spoke", "square") reframe the uniform measure.  

  The poem claims the principle of indifference fragments probability assignments: the same event, under equally plausible re-parametrizations licensed by distinct symmetries, yields irreconcilable probabilities, revealing "uniform at random" as context-dependent.
