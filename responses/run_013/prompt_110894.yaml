answer: |-
  **Exam Question:**  

  Dutch book arguments purport to show that agents with probabilistically incoherent credences are irrational.  
  (a) Precisely distinguish the mathematical core of the Dutch book theorem from the additional normative premise required to turn this mathematical result into an argument for irrationality. Explain why this premise is indispensable and cannot be derived mathematically.  
  (b) Suppose an agent assigns credence 0.4 to *A*, 0.4 to *B*, and 0.3 to *A∨B*, failing to notice that *A* and *B* are logically equivalent. A bookie, spotting this equivalence, exploits her with a Dutch book. Is the agent irrational *in the specific sense targeted by the Dutch book argument*? What does this reveal about the argument’s presuppositions regarding logical omniscience?  
  (c) Critics claim the Dutch book argument is merely prudential: avoiding monetary loss is only rationally required if one values money. Assess whether reformulating bets using "doxastic dollars" (payouts linear in the agent’s credence) successfully answers this objection by genuinely justifying the bridge premise, or merely relocates the problem.  
  (d) Conclude: What is the *strongest* normative claim about rationality defensibly supported by Dutch book arguments? Identify one significant limitation on what they can establish.  

  ---

  **Model Answer (760 words):**  

  Dutch book arguments establish only that probabilistically incoherent agents exhibit *pragmatic* inconsistency in specific choice contexts, not that their beliefs are inherently false or unjustified. The Dutch book theorem is a mathematical result: if an agent’s credences violate the probability axioms, there exists a set of bets (with money-payouts) that she deems fair individually but which collectively guarantee her loss across all possible states. Crucially, this theorem does not itself assert irrationality; it is a synchronic inconsistency proof. The indispensable bridge premise is a *normative linking principle*: an agent is irrational if she is susceptible to a sure loss in a system of bets she accepts as fair. This premise cannot be derived mathematically because it connects a formal property (incoherence) to a normative failing (irrationality) via a contingent value (avoiding sure losses). Mathematics shows *how* exploitation occurs; philosophy asserts that such exploitability is defective.  

  In the case of the agent assigning *cr(A)=0.4*, *cr(B)=0.4*, and *cr(A∨B)=0.3* while overlooking *A*≡*B*, she *is* irrational in the Dutch book argument’s specific sense. The argument targets *synchronic incoherence* in her current credal state, irrespective of its etiology. Her non-additivity (*cr(A∨B) < cr(A) + cr(B)* despite *A* and *B* being equivalent, hence *A∨B*≡*A*) directly violates the probability calculus. The bookie’s exploitation demonstrates this incoherence. This reveals that the Dutch book argument presupposes *logical omniscience* at the level of credence *constraints*. It demands that credences conform to logical truths (e.g., additivity for disjoint propositions) even if the agent is unaware of those truths. The argument diagnoses structural incoherence, not epistemic negligence in reasoning. While this makes the standard argument impractical for bounded agents, its proponents maintain that rationality requires *implicit* coherence with logical constraints.  

  The "merely prudential" objection has force against money-based Dutch books: if an agent is indifferent to monetary losses, a sure loss doesn’t compel her. Reformulating bets using "doxastic dollars" (e.g., a bet on *P* pays $1 * cr(P)) attempts to circumvent this by aligning payouts with the agent’s credences. A bet is "fair" if its expected doxastic-dollar value is zero according to her credences. Crucially, under this scheme, a Dutch book against an incoherent agent guarantees her a loss in *doxastic utility* (negative expected value by her *own* lights), not just money. However, this reformulation does not genuinely earn the bridge premise; it merely relocates the normative burden. The bridge premise now becomes: "An agent is irrational if she is susceptible to a sure loss in *doxastic utility*." While this sidesteps contingent values like money, it still assumes that avoiding *doxastic* sure losses is rationally obligatory. The argument now hinges on the normative primacy of *coherence-as-avoidance-of-doxastic-loss* rather than coherence-as-truth-tracking. This exposes a deeper circularity: the doxastic utility function is defined *using* the probability axioms it aims to justify. The reformulation makes incoherence self-defeating *given the chosen scoring rule*, but it doesn’t independently justify why rationality requires adhering to *that* scoring rule.  

  The strongest defensible claim from Dutch book arguments is a *pragmatic inconsistency thesis*: agents with incoherent credences are committed to evaluating sets of choices as simultaneously fair and strictly dominated (guaranteeing a net loss). This establishes a failure of instrumental rationality *in a specific betting context*. Dutch book arguments cannot establish that probabilistically coherent credences are more *accurate*, *truth-conducive*, or *evidentially justified* than incoherent ones. They are silent on whether coherence promotes true belief, only that it avoids pragmatic self-sabotage in certain decision scenarios. The arguments are thus limited to demonstrating a form of *internal consistency* required for rational agency in wager-based choices, not epistemic virtue per se.  

  ---

  **Marking Scheme (30 points total):**  

  1.  **Core Distinction & Bridge Premise (6 pts):**  
      *   *Must-hit:* Clearly separates the mathematical theorem (existence of a sure-loss bet set given incoherence) from the normative bridge premise (susceptibility to sure loss entails irrationality). Explicitly states the bridge premise cannot be derived from the math and is a philosophical claim about defectiveness.  
      *   *Common miss:* Merely restating the theorem or conflating mathematical possibility with normative conclusion.  

  2.  **Logical Omniscience Case (6 pts):**  
      *   *Must-hit:* Correctly identifies the agent *is* irrational *by the Dutch book criterion* (due to synchronic incoherence) and explicitly links this to the argument’s presupposition that credences must satisfy logical constraints (like additivity for equivalents) regardless of the agent's awareness.  
      *   *Common miss:* Arguing the agent isn't irrational due to ignorance (misunderstanding the argument's synchronic focus) or failing to articulate the logical omniscience presupposition.  

  3.  **Prudential Objection & Doxastic Dollars (6 pts):**  
      *   *Must-hit:* Concedes the objection holds for money-based books but argues credence-based payouts shift the loss to doxastic utility. Critically evaluates that this *relocates* the normative burden to a new bridge premise about avoiding doxastic sure loss without escaping circularity (justifying the scoring rule).  
      *   *Common miss:* Claiming doxastic dollars "solve" the prudential objection without noting the relocated normativity or circularity.  

  4.  **Strongest Claim & Limitation (6 pts):**  
      *   *Must-hit:* States the strongest claim is pragmatic inconsistency (commitment to dominated choices) and identifies one key limitation: inability to establish truth-conduciveness, accuracy, or evidential justification of coherence.  
      *   *Common miss:* Overclaiming (e.g., "proves beliefs must be probabilistic") or stating a vague limitation (e.g., "doesn't apply to real people").  

  5.  **Precision & Structure (6 pts):**  
      *   *Must-hit:* Answers all parts directly, uses precise terminology (synchronic, incoherence, bridge premise, doxastic utility, pragmatic inconsistency), avoids significant irrelevance or confusion. Demonstrates understanding that the argument targets structural coherence, not reasoning processes.  
      *   *Common miss:* Vagueness on key terms, tangents, failing to address all sub-questions, or misrepresenting the core target of the argument.  

  **Grade Differentiation:**  
  *   **A (27-30 pts):** Hits all must-hit points with clarity, precision, and critical insight. Explicitly recognizes the argument's core is about *synchronic structural coherence* and its *pragmatic* implications.  
  *   **B (24-26 pts):** Addresses all parts but may lack depth in one area (e.g., superficial treatment of doxastic dollars' circularity, or weaker articulation of the limitation). Minor imprecision or less developed critical analysis.  
  *   **C (18-23 pts):** Misses one must-hit point entirely or shows significant confusion/misunderstanding in two areas (e.g., fails on the bridge premise or the logical omniscience case).  
  *   **D/F (<18 pts):** Misses multiple must-hit points, fundamental misunderstandings (e.g., confuses Dutch book with diachronic updating), or severe irrelevance.
