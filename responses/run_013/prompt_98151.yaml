  Okay, the user is in a philosophy of religion seminar discussing David Lewis's paper on penal substitution. They want to argue against Lewis from a retributivist perspective. Let me start by understanding the core of Lewis's argument: he claims that penal substitution isn't inherently unjust because we accept voluntary substitution in everyday cases, like someone taking a friend's prison sentence.

  The user's opening move points out that in Lewis's examples, the substitute is punished without injustice, suggesting our concept of punishment allows substitution. The retributivist needs to counter this by distinguishing punishment from other burdens. The key is to argue that punishment must be deserved individually; voluntary assumption of cost doesn't equate to just punishment.

  I need to stay in character as a committed retributivist. The user emphasized not strawmanning, so I should acknowledge voluntary burden-taking but insist it's not punishment. The retributivist's stance is that punishment requires personal guilt. Substitution might transfer costs, but not moral guilt or retributive desert.

  The user mentioned examples like taking a prison sentence. The retributivist could argue that even if society accepts it, it doesn't make it just punishment—it's more like assuming a debt. The divine case is different because God, as a perfect moral agent, cannot justly punish an innocent. Human systems might allow it due to practicality, but divine justice must adhere strictly to desert.

  I should avoid making it about other features unless necessary. Focus on the intrinsic link between punishment and personal desert. The retributivist must clarify that substitutionary atonement conflates taking on costs with bearing punishment. In ordinary cases, the substitute isn't being punished justly; they're volunteering for a burden, which is a different moral category. In the divine scenario, punishing Jesus for others' sins isn't retributively just because he doesn't deserve it. The injustice is clearer with God because there's no pragmatic excuse; it's purely about moral desert.
answer: |-
  As a retributivist, I reject your core premise: in Lewis's examples, the volunteer isn't truly *punished*; they merely *assume a cost or burden*. Punishment, by definition, requires the infliction of suffering *because* the recipient *deserves* it for their *own* wrongdoing. When a soldier volunteers for a dangerous mission, they bear a risk, not punishment. When a friend pays your fine, they discharge a debt obligation, not receive penal retribution. The state may *call* it punishment, but morally, it’s cost-transfer. The injustice is masked because human systems prioritize expediency or relationship bonds over pure desert. But God, as perfect moral agent, cannot commit this category error: *punishing* Christ—who is innocent of *our* sins—for *our* guilt isn’t substitution; it’s scapegoating. The essence of retribution is personal desert, which substitution obliterates.
