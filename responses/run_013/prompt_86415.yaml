prompt: |-
  I'm a novelist, which means my whole job is guessing what someone wants from what they do, and Ive run into a thing I don't have a word for. It comes in two flavours and I'm not sure they're the same thing.

  One. There's a woman in my last book who always gives up her seat on the train. My editor read her as kind. I had written her as frightened: she can't stand a stranger standing over her and she stands up to end it. Nothing on the page decides between the two, and both readings survive every scene she's in. Same book, related problem: I tried to deepen another character by giving her a want — she wants to be warm — and then realised that every room she ever stands in is the same temperature, so the want never sorts one option above another. It's real, it's hers, and you could delete it without changing a single thing she does. So some wants are invisible in principle, not just hard to spot.

  Two, and this may be a different animal entirely: we — readers, me, everyone — treat small cheap gestures as deep disclosures (she leaves the porch light on, therefore lonely), but when someone does something large and expensive we reach straight for the situation (she only stayed because she had nowhere else to go). Which feels backwards, since the costly act is the one that actually cost her something. Or am I missing why that isn't backwards?

  So: is there an established name for any of this? I assume somebody in economics or AI or psychology has chewed on the problem of inferring what a creature wants from what it does, and I'd like to know the nearest named ideas, how they differ from each other, and which of them my second case belongs to, if any — I have a hunch it's just how audiences are built. If there's no single term, coin one, and tell me where it stops: what it covers and what it dosn't. I'm after the boundary lines, not the label. And please don't just hand me a reading list, I want the carving.
reasoning: |-
  Okay, let me tackle this novelist's query. They're describing two distinct but related phenomena about inferring character motivations from actions. First, the ambiguity where a behavior can support multiple interpretations (like giving up a seat being either kindness or fear). Second, the invisibility of wants that never manifest in choices (like wanting warmth when temperature never varies). Then there's the asymmetry where costly actions get attributed to circumstance while trivial ones get overinterpreted as character revelations. 

  Hmm. The first issue feels deeply philosophical. It reminds me of Wittgenstein's beetle-in-the-box problem - we can't ever truly verify private mental states through external behavior. Every act is multiply interpretable, which is both a curse and gift for novelists. That woman on the train... her action is a Rorschach test for the observer. The editor sees kindness because it fits their worldview, while the author knows it's fear. Neither is wrong based solely on the text. And that warmth desire... it's haunting precisely because it's a "ghost motive" - real but causally inert. Like background radiation of character.

  Now the second asymmetry puzzles me more. Why do we romanticize small gestures as identity disclosures but explain away big sacrifices as situational? I think it's because trivial acts feel "surplus" - beyond functional necessity, so we read them as voluntary self-expression. Whereas major acts have obvious external pressures. Also there's narrative economy: readers crave efficient characterization. A porch light left on is a cheap symbolic dividend. But actually... the costly act paradox reveals something profound about human nature. We distrust grand gestures precisely because they could be coerced, while find authenticity in unobserved micro-behaviors.

  For terminology... the first problem is essentially the underdetermination of theory by evidence from philosophy of science. Quine would say all behavior is theory-laden. The ghost motive issue relates to "revealed preference" limitations in economics - if a preference never affects choices, does it exist? The asymmetry might connect to "attribution theory" in psychology - we attribute others' behavior to disposition when convenient, to situation when inconvenient. But none fully capture the writer's dilemma.

  Perhaps the umbrella term is "representational opacity" - the inherent gap between observable action and interiority. With three subtypes: interpretative ambiguity (multiple motives fit), causal invisibility (motives without behavioral consequences), and disclosure asymmetry (small acts read as character, big acts as circumstance). The boundaries... it covers any disjunction between internal state and external manifestation in narrative contexts. Excludes cases where motives are explicitly stated or directly observable through physiological cues.

  This feels messy but real. The novelist is wrestling with fundamental limits of their craft - that behavior is always underdetermined, some interiority remains forever unexpressed, and readers impose patterns whether they exist or not. There's no perfect solution, only awareness of these fault lines in human interpretation.
answer: |-
  You've struck at a fundamental tension in representing human motivation through action – and the limits of inference. There isn't a single perfect term covering *all* your cases, but the core concepts are well-established. Here's the carving, focusing on the boundaries and distinctions:

  **The Core Problem: The Underdetermination of Motive by Behavior**

  This is the philosophical bedrock. Any single action (or set of actions) can potentially be explained by multiple, often conflicting, internal states (desires, beliefs, fears, intentions). Your **woman giving up her seat** is a classic example. Her behavior is *compatible* with both kindness *and* fear. No finite set of actions can *logically prove* one interior state over the other. This is related to the **Problem of Other Minds** (how can we know what others *really* think/feel?) and **Quine's Thesis of the Underdetermination of Theory by Data** (multiple theories can explain the same evidence).

  *   **Boundaries:** Covers situations where observed behavior is equally consistent with multiple plausible motivations. *Excludes* cases where actions are explicitly stated to be driven by a specific motive within the narrative frame, or where physiological cues (e.g., trembling, blushing) strongly constrain interpretation.

  **Flavor One: Ambiguity & Ghost Motives**

  1.  **Interpretative Ambiguity / Motivational Equivocality:** This is the specific case where a behavior (or pattern) sustains multiple valid interpretations of *why* it was done (kindness vs. fear). The action itself doesn't resolve the ambiguity. It thrives in the gap between action and intention.
      *   **Boundaries:** Covers actions open to multiple motivational readings. *Excludes* actions where the motive is unambiguous within the story's context (e.g., screaming while jumping away from a snake clearly indicates fear).

  2.  **Inefficacious Desire / Ghost Motive / Latent Preference:** This is the **"want for warmth"** problem. A desire exists internally but never manifests in observable *choice* because the environmental conditions necessary to *reveal* it through differential action are absent. The desire is causally inert in the observable narrative.
      *   **Boundaries:** Covers desires that *could* theoretically influence choices *if* the situation demanded it, but never get the opportunity. *Excludes:*
          *   Desires that *do* influence choices (even subtle ones).
          *   Desires that are purely hypothetical ("I wish I could fly" when gravity is constant).
          *   Desires inferred *from* actions (the core of revealed preference theory).
      *   **Contrast with Economics/AI (Revealed Preference):** Traditional revealed preference theory in economics *defines* preferences by observed choices under constraints. Your "ghost motive" highlights a *critique* of this: preferences *can* exist without ever being revealed by choice if constraints never vary to test them. AI agents might have latent goals encoded in their reward functions that are never activated in their training environment.

  **Flavor Two: The Costly Act Paradox & Attribution Asymmetry**

  This is a distinct but related phenomenon concerning *how observers* (readers, characters, ourselves) *attribute* motives based on the *nature* of the act:

  1.  **The Fundamental Attribution Error (FAE) - But Nuanced:** The FAE is the tendency to over-attribute behavior to internal dispositions (personality, motives) and under-attribute to situational factors. Your observation reveals a fascinating *asymmetry within this*:
      *   **Low-Cost/Surplus Actions:** Acts that seem "unnecessary" or exceed basic functional requirements (leaving a porch light on, a small gift, a minor courtesy) are readily interpreted as direct "windows to the soul" – revealing deep-seated dispositions (loneliness, kindness, thoughtfulness). The *lack* of an obvious situational *demand* for the act makes us attribute it to character. (*"Why else would they do it?"*)
      *   **High-Cost/Constrained Actions:** Acts involving significant sacrifice, risk, or cost (staying in a bad marriage, donating a kidney, fleeing a warzone) are *more readily* attributed to powerful situational pressures or constraints (*"They had no choice," "Where else would they go?" "The reward was huge"*), *even if* internal dispositions also played a major role. The situational factors are so salient they overshadow potential dispositional contributions in our initial interpretation.
      *   **Why it *Feels* Backwards (But Isn't Entirely):**
          *   **Narrative Efficiency & Symbolism:** Small gestures are efficient narrative shorthand. They feel like pure, unforced expressions of self precisely because they *aren't* demanded by the situation. They become potent symbols.
          *   **Suspicion of Grand Gestures:** Large sacrifices trigger skepticism. We instinctively wonder about hidden situational pressures, ulterior motives, or potential coercion. "Did they *really* do it out of pure love, or were they trapped/paid/manipulated?" The cost itself raises the question of justification.
          *   **Causal Salience:** Situational forces *are* often the most *obvious* explanation for highly costly behavior. Disentangling the internal dispositional contribution is harder. The situation screams; the internal whisper is harder to hear.
          *   **"Costly Signaling Theory" (from Evolutionary Bio/Anthro) - A Counterpoint:** This theory suggests that *genuinely* costly acts *can* be powerful signals *because* they are hard to fake (e.g., a peacock's tail). However, in *narrative interpretation*, the *audience's* first instinct is often *not* to trust the signal, but to look for the situational pressure or hidden benefit that *explains away* the cost. The peacock's tail might signal fitness, but a human observer might first think, "He must have gotten lucky with food," before concluding "He must be strong."

  *   **Boundaries:** Covers the *observer's tendency* to attribute low-cost acts primarily to disposition and high-cost acts primarily to situation. *Excludes*:
      *   Acts where the situational cause is explicitly overwhelming (e.g., dodging a falling rock).
      *   Acts where the dispositional cause is explicitly undeniable (e.g., a character monologuing about their pure love before a sacrifice).
      *   Acts where cost is ambiguous or irrelevant to interpretation.

  **How They Relate & Where They Differ**

  *   **Common Root:** All stem from the fundamental gap between observable behavior and unobservable internal states (motives, desires).
  *   **Flavor 1 (Ambiguity/Ghost Motives)** is about the *inherent limitations of behavior as evidence* for specific internal states. It's ontological/epistemological (what *can* we know?).
  *   **Flavor 2 (Attribution Asymmetry)** is about the *psychological heuristics observers use* to bridge that gap, particularly the *systematic bias* in how we map different *types* of actions (low-cost vs. high-cost) onto dispositional vs. situational causes. It's psychological/social.

  **The Carving - Your Labels & Boundaries**

  1.  **Motivational Equivocality:** When an action or pattern *sustains multiple plausible and distinct motivational interpretations* (e.g., Kindness vs. Fear). *Boundary:* The action itself doesn't resolve the ambiguity; multiple readings fit the data equally well.
  2.  **Inefficacious Desire / Ghost Motive:** When a character possesses a genuine internal want that *never manifests in observable choice or action* because the environmental conditions necessary to *test* or *reveal* it through differential behavior are consistently absent (e.g., Wanting Warmth in Constant Temperature). *Boundary:* The desire exists internally but is causally inert in the observable narrative; deleting it changes no action.
  3.  **Cost-Disposition Attribution Asymmetry (CDAA):** The *observer tendency* to interpret **low-cost/surplus actions** as primarily revealing **dispositional traits** (character, deep motives), while interpreting **high-cost/constrained actions** as primarily driven by **situational pressures** or constraints. *Boundary:* Focuses on the *observer's inference process* based on the *perceived cost vs. situational demand* of the act; explains why small gestures feel more "authentically revealing" than grand sacrifices, despite the latter costing more.

  **Why CDAA (Your Second Case) Belongs Here:**

  It fits squarely within social cognition and attribution theory, specifically highlighting a nuanced pattern within the broader Fundamental Attribution Error. It explains the "backwards" feeling: we *over*-read disposition into actions that seem freely given (low cost/surplus) and *under*-read disposition into actions that seem forced (high cost/constrained), even though the latter often involves *more* internal commitment. It's a powerful heuristic audiences (and people) use to "read" character quickly, often prioritizing narrative efficiency and symbolic resonance over a full cost-benefit analysis of the actor's internal state. It *is* partly "how audiences are built," but it's grounded in a very real psychological tendency.

  You've identified profound cracks in the foundation of inferring inner life from outer action – the ambiguity inherent in behavior, the existence of silent desires, and the biases in how we map actions to motives based on their perceived cost. These aren't flaws in your craft; they are the very territory you navigate as a novelist exploring the human condition.
