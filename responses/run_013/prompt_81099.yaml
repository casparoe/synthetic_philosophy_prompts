prompt: |-
  Okay, I need a philosopher for this one, or a logician, ideally someone who works on the old self-reference puzzles and can explain things to a person who never took a class. Please think hard before you answer, and maybe start by brainstorming a list of candidate concepts before you settle on anything, because I have a feeling the obvious answer is wrong.

  Background: I've been reading about truth and knowledge on and off for a couple of years, mostly blog posts and old forum threads, no formal training. There's an arguement I keep running into and I can't tell if it's famous or if people on the forum made it up. It goes like this.

  Start with the friendly thought that nothing is so hidden that in principle nobody could ever find it out -- anything true is knowable by someone, somehow. Now take some truth that, as a matter of fact, nobody knows. Something nobody ever bothered to check. Now consider the statement: that thing is true, and nobody knows it. That statement looks true, and it looks knowable like any other. But it can't be known. Whoever knew it would have to know both halves, and if they knew the second half -- that nobody knows it -- then they'd know it, so the second half would be false, so the whole thing wouldn't be something they knew. So here's a truth nobody can know, and the friendly thought is dead. I'm told that if you do the formal version you don't just get "not everything is knowable," you get the much crazier "everything true is already known," which is obviously false. So something has to give, and everyone seems to agree the pressure point is that weird proposition about nobody knowing.

  What I want to know: does this have a name, and more to the point, is it one thing or several things I've been mashing together? Because I keep seeing what I think is the same shape in other places:

  - the surprise test thing, where a teacher announces a test next week that you won't be able to predict, the class reasons itself into saying it can't happen, and then it does;
  - the sentence "it's raining and I don't think it's raining," which can be true but which I apparently can't sensibly say;
  - and something I saw called the knower, where a sentence says of itself that it isn't known, and that blows up into a flat contradiction, unlike the first arguement which only blows up a principle.

  Are those one move or four different moves? My gut says the first is different in an important way, because the statement isn't talking about itself -- it's talking about the world, it's just that the world includes whoever is doing the knowing. But I can't tell if that's a real distinction or me being confused.

  The label isn't really what I'm after anyway, so please don't just hand me a name and a summary and stop. I want the carving: what exactly the phenomenon is, where its edges are, which of my examples belong in the same box and which are merely cousins, and what the nearest things are that it is not. Also, is the argument actually valid, or is there a hidden step? And is there a respectable way to keep the friendly thought -- say, that it only applies to statements that could be known without contradicting themselves -- or is that just taping over the hole?

  Two last things. I have no way to look anything up right now and I don't want a reading list or citations, I wouldn't be able to get them anyway, so just explain it in your own words. And don't be shy about telling me my framing is muddled if it is.
