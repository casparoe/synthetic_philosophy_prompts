answer: |-
  Here are five arguments for Horizon-Restricted Self-Indication (HRSI) over SSA and plain SIA:

  1.  **HRSI Corrects SIA's Fundamental Flaw:** SIA incorrectly weights observers causally disconnected from you, whose existence cannot possibly influence your evidence; HRSI fixes this by restricting weighting only to observers within your causal horizon, ensuring only potentially relevant observers impact hypothesis likelihoods based on your perspective.
  2.  **HRSI Preserves SIA's Key Strength Against Doomsday:** Like SIA, HRSI weights future observers (causally downstream from you) within the horizon, neutralizing the Doomsday Argument's improbable conclusion without needing SIA's problematic weighting of causally isolated observers elsewhere.
  3.  **SSA Fails by Arbitrarily Ignoring Relevant Observers:** SSA relies on defining a "reference class," which is subjective and often excludes causally connected observers (like future humans in Doomsday); HRSI objectively uses the causal structure of the universe to define the relevant set, avoiding this arbitrariness.
  4.  **HRSI Defeats the Presumptuous Philosopher:** The philosopher's T1 vs T2 argument fails under HRSI because the extra observers in T2 are causally sealed off; HRSI only boosts T2 if its extra observers are within *your* causal horizon, forcing the philosopher to use evidence, not just armchair counting.
  5.  **Probability Must Respect Causal Structure:** Evidence shaping your beliefs must be causally connected to you; weighting observers outside your horizon (SIA) or relying on arbitrary reference classes (SSA) violates this principle, while HRSI naturally incorporates causality as the basis for anthropic reasoning.
