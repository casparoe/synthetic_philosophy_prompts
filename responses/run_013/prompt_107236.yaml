prompt: |-
  Not sure if this has a name, and it's been bugging me. There's a move I keep seeing in arguments about historical figures. Someone criticises a figure the speaker admires — Jefferson and slavery, Churchill and the Bengal famine, Columbus and what he did to the people he found — and back it comes: "you can't judge him by today's standards, he was a man of his time." Fine. But the same speaker, same conversation, will turn around and praise that same figure for being ahead of his time, for having the guts to go against the consensus of his day. So the era gets to excuse everything bad and is never credited with anything good, while the man gets all the credit and none of the blame. And it isn't even applied evenly — nobody bothers to say Pol Pot was a man of his time. The shield only comes out for people the speaker already likes, and never for the ones they don't.

  Is there an established term for this specific thing? I know there's talk about presentism and not imposing our values on the past, and something about the luck of being born when you were, but as far as I can tell those are about whether context should count at all, not about this lopsided, pick-and-choose way of deploying it. If there's a real name, tell me what it is and how it differs from the nearest ideas; if there isn't, coin one and define it sharply enough that I can tell it apart from ordinary presentism and from plain old special pleading.
reasoning: |-
  Okay, the user is describing a rhetorical inconsistency they've observed in historical debates. They point out how people use the "man of his time" defense to excuse flaws in admired historical figures while simultaneously praising those same figures for being "ahead of their time" when it suits them. They note this selective application only protects favored figures and isn't used for disliked ones like Pol Pot. 

  The user wants to know if there's an established term for this specific double standard. They mention being aware of concepts like presentism but feel this is distinct - not about whether historical context matters generally, but about the inconsistent application of that principle. They're essentially asking for either an existing academic term or a newly coined phrase that precisely captures this cognitive bias.

  This seems like a case of special pleading combined with temporal inconsistency. The underlying psychological mechanism appears to be motivated reasoning - protecting cherished beliefs about historical heroes. The user is clearly frustrated by this intellectual dishonesty and wants precise language to call it out.

  The closest existing concepts would be:
  - The "man of his time" fallacy (when used inconsistently)
  - Motivated historiography
  - Heroic exceptionalism

  But none fully capture the temporal asymmetry aspect. The core problem is the two contradictory standards applied simultaneously: demanding contextual leniency for bad actions while denying contextual constraints for good actions. This creates a no-lose scenario for favored figures where the era absorbs blame but never credit.

  A newly coined term seems justified here. "Temporal Double Standard" directly names the inconsistency but might be too broad. "Selective Contextualism" emphasizes the cherry-picking aspect. "The Historical Halo Effect" connects it to cognitive bias research but loses the temporal element. Perhaps "Asymmetric Temporal Justification" or "Biased Temporal Accounting" would work, though they're mouthfuls.

  The key differentiators from presentism are: 1) It's not about whether to apply modern standards at all, but about inconsistent application; 2) It specifically involves claiming the figure transcended their era for good deeds but was constrained by it for bad deeds; 3) It's applied selectively based on pre-existing admiration.

  The user seems analytically sophisticated - they've already identified the inconsistency and want precise terminology to articulate it. Their frustration suggests they've encountered this repeatedly in debates. Providing a sharp definition and differentiation will likely satisfy their need for intellectual clarity in these discussions.
answer: |-
  You've perfectly dissected a pervasive and intellectually dishonest rhetorical maneuver. There isn't a single, universally accepted *academic* term for **this specific combination of inconsistent temporal reasoning and selective application**, though it's widely recognized as problematic. However, we can define it sharply and differentiate it from related concepts.

  ## The Core Problem & Its Definition

  *   **The Inconsistency:** Using the historical context *only* to **excuse** negative actions ("He was a man of his time") while simultaneously denying the power of that same context to **constrain** positive actions ("He was ahead of his time").
  *   **The Selectivity:** Applying this inconsistent standard only to figures the speaker admires, never to those they condemn.

  **Proposed Term: Asymmetric Temporal Accounting**

  *   **Definition:** The fallacious practice of selectively applying historical context standards to defend a favored historical figure: invoking the constraints of their era to absolve them of blame for negative actions ("man of his time"), while simultaneously dismissing the constraints of that same era to credit them exclusively for positive actions deemed progressive or exceptional ("ahead of his time"). This creates an unjustifiable asymmetry where the era absorbs blame but never credit, and the individual receives credit but never blame.

  ## Why This Term Fits & How It Differs

  1.  **"Asymmetric":** Directly captures the core flaw – the *unequal* application of the temporal standard (excusing bad, not crediting good for the era). It highlights the imbalance.
  2.  **"Temporal":** Clearly locates the fallacy in the handling of time and context.
  3.  **"Accounting":** Evokes the idea of keeping score – assigning credit and blame – but doing so inconsistently. It implies a balancing that is deliberately skewed.

  ## Differentiation from Related Concepts

  *   **Presentism:** This is the *broader* concept of judging the past solely by modern standards without considering historical context. **Asymmetric Temporal Accounting** *uses* the *argument against presentism* ("man of his time") strategically, but only for defense, while *ignoring* the logical implication of that argument when it comes to praise. It's a *misuse* or *selective invocation* of anti-presentism.
  *   **Special Pleading:** This is absolutely a form of special pleading (applying a double standard to protect a favored position). **Asymmetric Temporal Accounting** is the *specific type* of special pleading that manifests through this *particular temporal inconsistency* regarding historical figures and context. It's the *mechanism* of the special pleading in this domain.
  *   **"Man of His Time" Fallacy:** While this phrase is sometimes used critically, it usually refers to the *overuse* or *uncritical application* of historical context as an excuse. **Asymmetric Temporal Accounting** is more precise because it specifies the *paired inconsistency* with the "ahead of his time" claim.
  *   **Hero Worship / Hagiography:** This describes the *tendency* to uncritically praise figures, often ignoring flaws. **Asymmetric Temporal Accounting** is a *specific rhetorical tactic* employed *within* hero worship to deflect criticism while maintaining praise, using temporal arguments inconsistently.
  *   **Motivated Reasoning:** This is the *underlying psychological process* – the speaker starts with the desired conclusion (defend the hero) and then finds arguments (including asymmetric temporal ones) to support it. **Asymmetric Temporal Accounting** is the *expression* of that motivated reasoning in historical discourse.

  ## Key Characteristics of Asymmetric Temporal Accounting

  1.  **Requires Two Claims:** It only manifests when *both* "man of his time" (for defense) *and* "ahead of his time" (for praise) are used for the *same* figure in the *same* context.
  2.  **Temporal Inconsistency:** It fundamentally violates the principle that if context constrains actions (absolving some blame), it logically must also constrain *exceptional* actions (lessening exclusive credit for being "ahead").
  3.  **Selective Application:** It is only deployed for figures the speaker *already* admires. Figures condemned (like Pol Pot, Hitler) are judged by absolute or modern standards ("evil"), not given the "man of his time" defense. The era is never invoked to explain their actions as normative constraints.
  4.  **Shields the Hero:** The individual figure is immunized from criticism for negatives (blame shifted to the era) while receiving full, exclusive credit for positives (credit *not* shared with the era or its progressive undercurrents).
  5.  **Intellectually Dishonest:** It's not a genuine attempt to understand historical context; it's a defensive tactic to preserve an idealized image.

  ## Using the Term Effectively

  When you encounter this:
  1.  Point out the **inconsistency**: "You can't have it both ways. If he was constrained by his era regarding slavery (excusing it), how could he simultaneously transcend that same era regarding democracy or science (crediting him exclusively)? That's applying the context asymmetrically."
  2.  Name the fallacy: "This looks like **Asymmetric Temporal Accounting**. You're using the era to absorb blame but not credit."
  3.  Highlight the selectivity: "Notice how this 'man of his time' shield only comes out for Jefferson/Churchill/etc., never for figures we universally condemn. Why is the era only a constraint for your heroes?"
  4.  Demand consistent standards: "Apply the same contextual reasoning consistently. If the era explains his flaws, it must also explain the limits of his virtues and the contributions of others who shared his progressive views."

  While "Asymmetric Temporal Accounting" might not be in every history textbook *yet*, it precisely defines the specific intellectual inconsistency you've identified, differentiating it clearly from broader concepts like presentism or simple bias. It names the game being played.
