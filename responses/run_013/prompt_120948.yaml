  ### **Decision Tree: Can Transformative Choices Be Made Rationally?**
  **Root Commitment:** *Transformative choices change both what you know and what you care about, so current values can't rank options.*

  1. **Is the change in what you care about (preferences) the core obstacle, or is it secondary to not knowing what the experience will feel like?**  
     - **Change in preferences is core:** Go to 2.  
     - **Not knowing the experience is core (preference change is a red herring):** Go to 3.  

  2. **Even though preferences will change, is there a fact of the matter about what’s better for you, fixed by something beyond preferences (e.g., objective values)?**  
     - **Yes:** → **Leaf: Objective Good View**  
       - *Position:* Rational choice is possible by appealing to objective facts about well-being (e.g., flourishing, autonomy).  
       - *Hardest commitment to keep:* Your future self might deeply care about something objectively "worse" for you.  
     - **No:** Go to 4.  

  3. **Can you overcome not knowing the experience by borrowing knowledge from others who’ve lived it?**  
     - **Yes:** → **Leaf: Testimonial Knowledge View**  
       - *Position:* Rational choice is possible by learning from others' experiences and applying your current values.  
       - *Hardest commitment to keep:* Your preferences may change in ways that make others' experiences irrelevant to *your* future values.  
     - **No:** Go to 5.  

  4. **Can you rationally aim at a value you don’t yet grasp, with reasons pointing forward to the person you’ll become?**  
     - **Yes:** → **Leaf: Forward-Looking Reasons View**  
       - *Position:* Rational choice is possible by committing to reasons that "point forward" to values you’ll grow into (e.g., self-creation).  
       - *Hardest commitment to keep:* You can’t know if the value you’re growing into is truly worth it until you live it.  
     - **No:** Go to 6.  

  5. **Is this uncertainty uniquely problematic (beyond ordinary decision-making)?**  
     - **Yes:** → **Leaf: Unique Uncertainty View**  
       - *Position:* Transformative choices require new decision theories (e.g., weighted beyond probabilities) due to radical ignorance.  
       - *Hardest commitment to keep:* That standard tools (e.g., expected utility) can’t handle this, even though they handle other deep uncertainties.  
     - **No:** → **Leaf: Ordinary Uncertainty View**  
       - *Position:* This is just dramatic ordinary uncertainty; use standard tools (e.g., best-guess probabilities/utilities).  
       - *Hardest commitment to keep:* That preference changes don’t create a new problem.  

  6. **Can a second-order preference (e.g., "I want to be the kind of person who values X") rationally guide you?**  
     - **Yes:** → **Leaf: Second-Order Preference View**  
       - *Position:* Rational choice is possible by aligning with your higher-order desires about who to become.  
       - *Hardest commitment to keep:* Second-order preferences may also change unpredictably.  
     - **No:** → **Leaf: Skeptical View**  
       - *Position:* No rational basis exists; these choices are inherently non-rational leaps.  
       - *Hardest commitment to keep:* That we must still make high-stakes choices anyway.  

