answer: |-
  ### Bottom Line  
  Bankroll management rules like fractional Kelly sizing presuppose that the primary goal is maximizing the long-term exponential growth rate of wealth, not expected monetary value. This view treats money as having logarithmic utility (each doubling of wealth has equal value) and ruin as an infinitely bad outcome. The rules are coherent *only* under repeated betting: for one-shot bets, fractional sizing is irrational under this theory. Expected utility with non-logarithmic concave functions can mimic fractional betting but isn't identical. Risk-neutral EV maximization would demand vastly different behavior, like all-in betting on positive-EV wagers, invalidating the 2% rule entirely.

  ### The Rule as a Decision Procedure  
  1. **Bankroll Definition**: Maintain a dedicated fund ("roll") separate from living expenses.  
  2. **Fractional Bet Sizing**: For each bet, stake a fixed fraction (e.g., 1-2%) of the current bankroll. The fraction is derived as:  
     `f* = (bp - q) / b` (Kelly criterion), where `b` is net odds, `p` is win probability, `q=1-p`.  
     Then use `f = k * f*` (e.g., `k = 0.25` for "quarter-Kelly").  
  3. **Stop-Losses**: Cease play after losing a predefined % of the roll (e.g., 20-30%) in a session/day.  
  4. **Ruin Avoidance**: Treat bankroll depletion as catastrophic failure; never risk total loss.  
  5. **Reassessment**: Adjust stakes only after significant roll changes (±25-50%).  

  ### What It Presupposes  
  **Rationality as Growth-Rate Maximization**: The core commitment is that rationality means maximizing the *geometric mean* of wealth growth over time. This prioritizes long-term compounding and survival over short-term expected value. The practice inherently assumes repeated, independent bets—it’s meaningless for one-off wagers.  

  **Logarithmic Value of Money**: Wealth has diminishing marginal utility, but specifically *logarithmic* utility (`U(W) = log(W)`). This makes each doubling of wealth equally valuable and implies:  
  - Ruin (`W→0`) has utility approaching `-∞`, making it infinitely worse than partial losses.  
  - Fractional sizing ensures optimal growth without risking ruin.  

  **Probability as Edge**: Probabilities and odds are assumed known or accurately estimable. The "edge" (`bp - q`) determines bet sizing, with larger edges justifying larger fractions. Uncertainty in probability estimates is handled by underbetting (e.g., quarter-Kelly).  

  **Bad Outcomes Defined by Ruin and Variance**: The worst outcome isn’t monetary loss per se, but *bankruptcy* (absorbing state ending all future play). Variance is bad only insofar as it increases ruin risk or reduces compound growth. Stop-losses hedge against emotional tilt or misestimation, not just mathematical risk.  

  **Time-Averages Over Ensemble Averages**: The "law of large numbers" here is ergodic—focusing on a single trajectory through time (one player’s path) rather than parallel universes. Avoiding ruin ensures the long-run growth rate is realized.  

  ### What It Merely Fits  
  - **Concave Utility Functions**: Expected utility maximization with *any* concave `U(W)` (e.g., `U(W) = √W`) can produce fractional betting due to risk aversion. However, it doesn’t demand *fixed* fractions or growth-rate maximization. Logarithmic utility is a special case where growth-rate max and EU coincide.  
  - **Hard Ruin Constraints**: A risk-neutral better with a strict "no ruin" rule might bet fractions, but would stake *more* aggressively than Kelly near the ruin boundary. Kelly optimally balances growth and survival; a hard constraint overemphasizes survival at growth’s expense.  
  - **Psychological Risk Aversion**: The rules incorporate behavioral safeguards (e.g., stop-losses) beyond pure math, accommodating human biases.  

  ### Where It’s Silent  
  - **Initial Bankroll Size**: What constitutes a "safe" starting roll (e.g., 50 buy-ins? 100?) depends on context and risk tolerance.  
  - **k in k-Fractional Kelly**: Choice of `k` (e.g., 1/2 vs. 1/4) is heuristic, trading growth for reduced variance. No universal optimum exists.  
  - **Correlated Bets**: Rules assume independence; adjustments for correlated risks (e.g., tournament fields, sector bets in quant finance) are ad hoc.  
  - **Rebalancing Frequency**: When to update stakes (after every bet? weekly?) is unspecified.  
  - **Non-Bankroll Income**: How external cashflow affects the "roll" is unaddressed.  

  ### What Changes If You Swap the Theory  
  **Expected Value Maximization (Risk-Neutral)**:  
  - **Bet Sizing**: Stake *everything* on any positive-EV bet (`f* = 100%`). The 2% rule vanishes: a 51% chance to double money justifies all-in wagers.  
  - **Ruin Irrelevance**: Bankruptcy is merely another loss; if EV is positive *on average across many parallel universes* (ensemble average), one should bet despite high ruin risk.  
  - **Stop-Losses Illogical**: Stopping after losses caps downside but forfeits future positive-EV opportunities.  
  - **One-Shot Coherence**: For a single bet, all-in on positive EV is rational. Fractional sizing underperforms.  
  - **Outcome**: Bankroll growth becomes erratic. The median outcome plummets due to frequent ruin, even if the mean wealth rises.  

  **Expected Utility (Non-Log Concave)**:  
  - Bet sizing varies with wealth level (e.g., poorer agents bet smaller fractions). Fixed % staking only emerges for log utility.  
  - Ruin avoidance is less absolute; utility might be bounded (`U(0) > -∞`), making recovery possible.  
  - Growth rate is not directly optimized; long-run wealth may be lower than under Kelly.  

  **Practical Impact**: Swapping to EV max would cause bankrolls to explode or implode within weeks. Professionals using the 2% rule would consider EV maximizers recklessly self-destructive—because in their real-world, non-ensemble trajectory, they usually *are*.
