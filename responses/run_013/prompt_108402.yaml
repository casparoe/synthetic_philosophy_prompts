  ### Decision Tree: From Burial Assemblage to Belief Inferences

  **Case Description:** A small later prehistoric cemetery; most graves contain a single pierced animal-tooth pendant at the throat of the deceased. One grave holds an intact aurochs skull laid face-down across the chest of an adult.  

  #### **Tree Structure**  
  *(Start at the root; follow branches based on answers to object-centered questions.)*  

  1. **Q1: Can the entire burial assemblage (pendants + skull) be explained solely by non-mental factors (e.g., taphonomy, functional adaptation, environmental constraints)?**  
     - **Yes** → **Leaf: Taphonomic Minimalism**  
       *Awkward commitment: Must explain the pendant’s consistent throat placement and the skull’s face-down orientation as accidental or natural, despite their apparent intentionality.*  
     - **No** → Proceed to Q2.  

  2. **Q2: Does the repetition of the pendant across graves indicate a community-wide *norm* (customary rule), or a *common cause* (e.g., shared functional need without social enforcement)?**  
     - **Norm** → Proceed to Q3.  
     - **Common Cause** → Proceed to Q3.  
     *Note: Both paths proceed; the skull’s uniqueness demands separate analysis.*  

  3. **Q3: Is the aurochs skull’s face-down placement deliberate ritual *inversion*, or the result of post-depositional *disturbance* (e.g., collapse, scavenging)?**  
     - **Deliberate Inversion** → Proceed to Q4.  
     - **Disturbance** → Proceed to Q4.  
     *Note: After Q2–Q3, if both pendant and skull are non-symbolic (common cause + disturbance), leap to Leaf 7.*  

  4. **Q4: Does the symbolic weight of practices (pendant norm and/or skull inversion) require *shared propositional beliefs* (e.g., "pendants protect souls"), or can they exist via *non-propositional practices* (e.g., habits, social imitation without explicit beliefs)?**  
     - **Requires Shared Beliefs** → Proceed to Q5.  
     - **Sustained Without Beliefs** → Proceed to Q6.  

  5. **Q5: (If shared beliefs required) Is an ethnographic parallel used to *generate hypotheses* (testable against data), or to *warrant conclusions* (directly justifying beliefs)?**  
     - **Generate Hypotheses** → **Leaf: Processual Middle-Range Inference**  
       *Awkward commitment: Relies on testable "middle-range" theories for symbolism, which are scarce for prehistoric minds.*  
     - **Warrant Conclusions** → **Leaf: Cognitive-Universalist Reconstruction**  
       *Awkward commitment: Assumes cross-cultural cognitive universals, risking projection of modern/anthropological categories onto the past.*  
     - **No Analogy Used** → **Leaf: Contextual Archaeology**  
       *Awkward commitment: Interprets beliefs solely from internal context, risking circularity when data is sparse (e.g., one cemetery).*  

  6. **Q6: (If practices sustained without beliefs) Is an ethnographic parallel used to *generate hypotheses* or to *warrant conclusions*?**  
     - **Generate Hypotheses** → **Leaf: Practice-Theoretic Account**  
       *Awkward commitment: Treats ritual as constitutive of social order but struggles to explain why practices persist if agents lack shared beliefs about their meaning.*  
     - **Warrant Conclusions** → **Leaf: Unnamed**  
       *Unattractive: Using analogy to warrant non-belief-based practices conflates distinct cultural logics; rarely defended.*  
     - **No Analogy Used** → **Leaf: Practice-Theoretic Account (Contextual Focus)**  
       *Awkward commitment: In limited contexts (e.g., no settlement data), practices may be misread as symbolic when they are functional.*  

  7. **Leaf: Minimal Intentionalism**  
     *(Reached if pendant = common cause AND skull = disturbance)*  
     *Awkward commitment: Posits only basic mental states (e.g., "intent to bury"), leaving the pendant’s recurrence and skull’s presence as unexplained anomalies.*  

  ---

  #### **Notes on Unoccupied/Unseparated Paths**  
  - **Q2 (Common Cause) + Q3 (Deliberate Inversion) + Q4 (Sustained Without Beliefs) + Q6 (Warrant Conclusions)**:  
    → *Unnamed* (unattractive, as using analogy to warrant non-belief practices is internally contradictory).  
  - **Q2 (Norm) + Q3 (Disturbance) + Q4 (Requires Shared Beliefs)**:  
    → Covered under Q5 (e.g., Processual/Cognitive-Universalist).  
  - **Indistinguishable Leaves**:  
    - *Contextual Archaeology* (Q5, no analogy) and *Practice-Theoretic Account (Contextual Focus)* (Q6, no analogy) both avoid analogy but differ in belief commitments. The tree separates them via Q4’s belief question.  
  - **Unexplored Combinations**:  
    - All paths are occupied except the "unattractive" leaf (Q6, warrant conclusions). This combination is coherent but rarely advocated, as practice theorists avoid analogical warranting.  

  ---

  #### **Tree Key**  
  - **Branch Nodes**: Object-centered inferential licenses (Q1–Q6).  
  - **Leaves**: Named positions with awkward commitments. Positions reflect *inferential strategies*, not specific scholars.  
  - **Design Logic**: Moves from taphonomic skepticism (Q1) to social practice (Q2–Q3) to belief ontology (Q4) and analogical rigor (Q5–Q6).  
  - **"Shared Practices"**: Defined by Q2 (norm) or Q3 (deliberate inversion). "Symbolic weight" in Q4 derives from these.  

  This tree scaffolds critical thinking: students confront how *objects* (pendants, skulls) license inferences about minds (norms, beliefs), while exposing each position’s vulnerabilities.
