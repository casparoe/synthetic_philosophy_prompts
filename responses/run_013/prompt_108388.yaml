prompt: |-
  I'm assembling teaching material on how concepts drift when they are copied between neighbouring practices, and I need one worked example rather than a general discussion. The setting I have in mind is a small, self-contained microdomain of the kind where everyone knows everyone: a single workshop, laboratory, or guild whose members share a vocabulary and can tell, without hesitating, whether a term is being used correctly.

  Take a concept that begins life in one part of such a microdomain with a narrow, operational job — it picks out something you can point at, measure, or act on, and its boundaries are fixed by what the work requires. It is then carried into an adjacent part of the same microdomain, where it is used as though it still meant the same thing, but the new context gives it a different job: it now classifies, or licenses an inference, or marks a status, rather than picking out the original thing. The copy survives the journey, but its extension has shifted, and the two uses can no longer both be right about the same borderline case. What I want is a case where the shift is not simple ambiguity (one word, two dictionary senses, no real dispute), and not mere vagueness (one sense, fuzzy edges), but genuine slippage: the second use inherits the authority of the first while quietly changing what the term covers, so that people reasoning in the two uses talk past each other without noticing.

  Please do three things.

  First, invent the microdomain and specify it tightly enough that the example stands on its own: the practice, the people, the two sub-parts, and the term. Give me the term's original job and its original boundaries, stated as the practitioners themselves would state them, and then the borrowed job and the new boundaries. I should be able to see exactly which case falls on one side under the old use and the other side under the new one.

  Second, give me the example in motion: a short scene or exchange in which two competent users of the term, each internally consistent, reach incompatible conclusions about one concrete case, and neither can see why the other is being obtuse. Show where each would say the other has simply misused the word, and why that accusation is unfair from the other's position.

  Third, diagnose the slippage. Is the drift driven by the new job the term has to do, by an analogy that was apt at the centre and misleading at the edges, by a change in what counts as evidence in the new sub-part, or by something else? Say what the two uses actually disagree about — a fact, a standard, or a starting intuition — and whether anything short of splitting the term in two would resolve it. If splitting it would work, say what the two resulting terms would be and what each would lose; if it would not, say why the concept is genuinely fluid and the drift is not an error at all.

  Keep the example small and concrete. I would rather have one well-specified case with its seams visible than a survey of many, and I would rather the term be one whose two uses are both defensible than one where the second use is plainly a mistake.
reasoning: |-
  Okay, the user is asking for a detailed example of concept drift in a small, self-contained microdomain. They want a concrete scenario where a term shifts meaning when borrowed between sub-practices, leading to genuine confusion without simple ambiguity or vagueness. 

  Hmm, they’re clearly assembling teaching materials, so the example needs to be pedagogical—self-contained, vivid, and with visible seams. The emphasis on "slippage" (not just ambiguity) suggests they want to highlight how authority from the original use cloaks the shift. 

  First, I’ll need a microdomain that’s tight but rich enough for sub-practices. A small workshop feels right—familiar, tactile, with clear roles. The term should have a core operational job in one sub-practice that becomes evaluative in another. "True surface" jumps to mind: in machining, it’s purely functional (does it seat correctly?), but in finishing, it’s about aesthetic standards. 

  The borderline case—say, a microscratched lens seat—must perfectly split the two uses. Machining cares about function (if it seals, it’s true); finishing cares about flaws (scratches break continuity). That’ll force the conflict. 

  For the dialogue, I’ll pit the no-nonsense machinist against the perfectionist finisher. Their argument should show mutual exasperation: "It seals, so it’s true!" vs. "Can’t you see the scratches?" Each accusation of misuse needs to feel fair from their viewpoint. 

  Diagnosing the slippage: the drift stems from the new job (classification vs. operation). They’re not disagreeing on facts but on what counts as relevant. Splitting the term ("functional-true" vs. "cosmetic-true") would lose the shared history that gives the borrowed use its weight. That’s the key teaching point: the inertia of the original authority masks the change. 

  ... Wait, is a lens workshop too niche? Maybe, but optics are visceral—scratches, sealing, glare are tangible. And "self-contained" is met. Alternative: pottery studio ("watertight" vs. "glaze-ready"?), but lenses feel sharper for borderline cases. Proceeding.
answer: |-
  Here's a concrete example set in a small, precision **optical lens workshop**, crafting lenses for specialized instruments (e.g., microscopes, surveying equipment). The team includes:

  *   **Grinders/Polishers (Sub-Practice A):** Responsible for shaping and achieving the *physical geometry* of the lens surface to optical specifications (curvature, smoothness). They work with laps, polishing compounds, and interferometers.
  *   **Coaters/Inspectors (Sub-Practice B):** Responsible for applying anti-reflective coatings and performing *final visual & functional inspection* under calibrated light. They work with vacuum chambers, coating materials, and inspection benches.

  **The Concept:** **"True Surface"**

  **Origin (Sub-Practice A - Grinding/Polishing):**
  *   **Job:** To identify surfaces ready for coating. Specifically, a surface is **"true"** if its physical geometry deviates less than λ/4 (a quarter wavelength of light, ~140 nanometers for visible light) from the specified ideal curve *over the entire functional aperture*. Measured interferometrically.
  *   **Boundaries:** A surface is **"true"** if the interferogram shows smooth, continuous, concentric rings with no abrupt breaks or irregularities exceeding λ/4 deviation. Scratches *deeper* than λ/4 that disrupt the ring pattern make it "not true." Scratches *shallower* than λ/4, even if visible, are irrelevant as they won't significantly affect coating adhesion or *initial* optical performance. **Focus:** Physical topology within functional tolerance.
  *   **Operational Use:** "This surface is finally **true** – interferometer shows λ/8 deviation max. Send it to coating."

  **Borrowed Concept (Sub-Practice B - Coating/Inspection):**
  *   **Job:** To classify lenses ready for final assembly and sale. A **"true surface"** means the surface is flawless *under final inspection standards* – it will not cause scattering, glare, or customer rejection under intended use conditions.
  *   **Boundaries:** A surface is **"true"** only if it shows *no visible defects* (scratches, digs, coating streaks) detectable under the standard inspection lamp (a specific angle and intensity) by a trained inspector. Crucially, *even a scratch shallower than λ/4* becomes relevant if it *catches the light* during inspection and creates a visible line. The interferometric measurement is background data; the *visual experience* is paramount. **Focus:** Perceived perfection under quality control lighting.
  *   **Operational Use:** "This coating looks good, but there's a faint scratch at 2 o'clock – the surface isn't perfectly **true**. We can't ship it as Grade A."

  **The Borderline Case:** **A lens with a single, very fine scratch.**
  *   **Depth:** Measured interferometrically at λ/6 (~90nm) – *well within* the λ/4 tolerance for Grinders.
  *   **Visibility:** Under the Coater's inspection lamp, at a specific angle, this scratch diffracts light just enough to appear as a faint, thin, bright line across the surface.

  **The Exchange: Scene in the Inspection Area**

  *   **Ari (Grinder/Polisher):** (Bringing the lens to Ben, the Inspector) "Ben, finally nailed that tricky biconcave. Interferometer shows it's beautifully **true**, λ/6 max deviation. Best one this week. Ready for coating and ship!"
  *   **Ben (Coater/Inspector):** (Takes the lens, places it under the inspection lamp, rotates it slowly. Pauses, frowns.) "Hang on, Ari. There's a scratch here, see? Catches the light right across the center. Surface isn't **true** like this. We can't ship it."
  *   **Ari:** (Leans in, squints) "That? That's nothing! Barely a whisper. It's only λ/6 deep – well within spec. The *surface geometry* is perfect. It *is* **true**. It'll coat fine and work perfectly. You're being too picky."
  *   **Ben:** (Points emphatically at the scratch glowing under the lamp) "Too picky? Ari, look at it! That line is obvious under the lamp. A customer sees that glare in their eyepiece, they'll reject the whole instrument as defective. If it shows under inspection, it's *not* a **true surface**. Period. Your machine might say it's flat, but the *surface* isn't flawless."
  *   **Ari:** (Frustrated) "Flawless? Since when does '**true**' mean 'cosmetically perfect'? It means *optically functional*! My interferometer *proves* this scratch doesn't affect the wavefront. You're misusing the term. '**True**' is about the *shape*, not invisible blemishes!"
  *   **Ben:** (Equally frustrated) "Misusing it? Ari, if it *looks* flawed under standard inspection, it *is* flawed for the customer. The '**surface**' includes what you *see* on it. Your numbers are great, but the *actual surface* right here isn't **true** for shipping. You grinders think it's all about curves, but we're the last line of defense against returns!"

  **Why Each Accusation is Unfair:**
  *   **Ari thinks Ben misuses "true":** Because Ben ignores the rigorous, quantifiable measure of functional geometry (λ/4 deviation) that defines "true" for Ari's work. Ben brings in an aesthetic/visual criterion Ari sees as irrelevant to the core meaning. Ben's standard seems subjective.
  *   **Ben thinks Ari misuses "true":** Because Ari ignores the practical reality of customer perception and final quality control under real inspection conditions. To Ben, the surface *as a deliverable product* includes its visual perfection. Ari's focus on pure geometry seems blind to the real-world outcome.

  **Diagnosing the Slippage:**

  1.  **Driven by the New Job:** The core driver is the shift in purpose. For Grinders, "true" verifies *manufacturing completion* against a *physical specification*. For Coaters/Inspectors, "true" verifies *product acceptability* against a *quality/perception standard*. The new job (preventing customer rejection) demands attention to features (visible scratches) irrelevant to the old job (achieving functional geometry).
  2.  **Change in Evidential Priority:** In Sub-Practice A, the interferometer is the gold standard; visual inspection is secondary. In Sub-Practice B, the calibrated inspection lamp is the gold standard; interferometer data is background information. What *counts* as evidence for the surface's condition shifts.
  3.  **Analogy at the Center, Misleading at the Edge:** Both uses center on the idea of a "perfect" surface. A lens perfect in both geometry *and* cosmetics satisfies both. The slippage occurs at the edge: *can a surface be geometrically perfect but still imperfect (not "true") due to a cosmetic defect?* Sub-Practice A says no, Sub-Practice B says yes.
  4.  **What They Disagree About:** They disagree fundamentally on the **standard of relevance** for the concept "true surface." Is it purely functional geometry (A), or is it the total visual/perceptual quality of the finished product (B)? They also potentially disagree on the **ontology** of the surface – is it purely a geometric shape (A), or does it include its superficial appearance (B)?
  5.  **Resolution & Splitting:**
      *   **Splitting *would* technically work:** Introduce distinct terms: "**Interferometrically True**" (meets λ/4 geometry spec) and "**Inspected True**" (passes final visual QC under lamp).
      *   **What Splitting Loses:** It loses the **shared heritage and borrowed authority**. The power of "true" in Inspection comes partly from its association with the precise, technical achievement of Grinding. Calling it "Inspected True" makes it sound less fundamental. Conversely, "Interferometrically True" might sound overly technical to Inspection. Splitting clarifies but severs the conceptual link that made borrowing impactful (and caused the drift).
      *   **Why Drift Isn't Just Error:** The drift is functional for Sub-Practice B. Borrowing "true" leverages the authority of precision geometry to bolster the importance of visual perfection. It elevates cosmetic inspection to the same level of critical importance as geometric tolerances *within their microdomain*. Insisting on the old definition would undermine the Coater's necessary gatekeeping role based on customer-facing criteria. The concept is fluid because the *work* defines what matters about the surface, and the work differs subtly between sub-practices, even in a shared domain. The borderline case reveals a genuine difference in priorities, not sloppy thinking.

  **In essence:** "True surface" drifts from "meets the geometric specification for function" to "meets the visual quality standard for shipment." The scratch λ/6 deep is the pivot point: it *is* true for the grinder (functionally sound) but *is not* true for the inspector (visually flawed). The slippage is powered by the new context's need to prioritize customer perception, borrowing the old term's authority while quietly changing its boundaries.
