  We are to adjudicate the exchange between Dana and Ellis about the function of the raised ridge on the pond snail's shell. We will go move by move, rating each as clearly mistaken, questionable, or clearly right, and then provide a brief justification. After that, we will say who is closer to the truth overall and identify what each is missing, including whether the disagreement is verbal or substantive.

  **Background:** The ridge originally evolved to deflect the jaws of a beetle predator. The beetle has been absent for thousands of years, and currently the ridge is selectively neutral. However, in the present environment, the ridge happens to brace the shell against a crab that invaded a century ago, but this bracing effect has not been selected for.

  **The Exchange:**

  **Move (1):** Dana argues that the ridge's function is to deflect the beetle's jaws because that is what it was selected for, and function is a matter of history, not the current environment.

  **Rating:** Questionable  
  **Justification:** Dana is representing the etiological (or selected-effects) theory of function, which defines a trait's function in terms of the historical reason it was favored by natural selection. This is a legitimate and widely held view in philosophy of biology. However, it is not without controversy. The problem is that the beetle has been absent for a long time (thousands of years), and the ridge now has no causal role in beetle defense. Moreover, the ridge currently has a different effect (bracing against crabs) that is beneficial. The etiological theory would indeed say the function is beetle defense, but whether that is the right way to think about the current trait is debatable. Thus, while not clearly mistaken, it is questionable because it ignores the present context and the new effect.

  **Move (2):** Ellis argues that the ridge has no function now because function is about the trait's current causal contribution to the organism's capacities in its present environment. Since the ridge contributes nothing to any current capacity (except we know about the crab, which Ellis hasn't mentioned yet but will come up later), it has no function.

  **Rating:** Questionable  
  **Justification:** Ellis is representing the causal-role (or systemic capacity) theory of function, which defines function in terms of the trait's current role in a system. However, note that in the present environment, the ridge does have a causal role in bracing against the crab (as Ellis will bring up in move 4). But at this point, Ellis is only considering that the ridge is neutral with respect to the beetle (which is gone) and not mentioning the crab. Moreover, he says the ridge contributes nothing, which is not entirely accurate if we consider the crab (though that effect is not due to selection). Also, he is dismissing the historical view. The causal-role theory is also a legitimate view, but his assertion that the ridge has no function now is questionable because, by his own lights, it might have a function if we consider the crab (which he will address in move 4). At this point, he is only focusing on the absence of the beetle and not the presence of the crab.

  **Move (3):** Dana replies that on Ellis's view, if the beetle were reintroduced, the ridge would suddenly acquire the function of beetle defense overnight, and lose it again if the beetle died out. She argues that functions cannot flicker in and out with the surroundings.

  **Rating:** Clearly right  
  **Justification:** Dana is pointing out a consequence of the causal-role theory: that a trait's function can change immediately with a change in the environment, even if the trait itself has not changed. This is a common criticism of the causal-role theory and is a valid point. It highlights that the causal-role account makes function too contingent on the current environment and may not capture the stability we often associate with biological functions.

  **Move (4):** Ellis replies that functions are relational and thus flickering is expected. He then introduces the crab example: the ridge now happens to brace against the crab, saving lives, but this effect was never selected for. On Dana's historical account, the ridge must be said to be for beetle defense and not crab defense, even though the crab is the current threat.

  **Rating:** Clearly right  
  **Justification:** Ellis makes a strong counterpoint. The etiological theory (Dana's view) would indeed assign the function as beetle defense and ignore the current beneficial effect against the crab because that effect was not selected for. This seems counterintuitive because the ridge is now actually helping against the crab. Ellis's point is that the historical account may ignore current beneficial effects that are not due to selection. This is a well-known challenge for the etiological theory.

  **Move (5):** Dana replies that selection is the only thing that separates a function from a mere effect. Without it, every effect of a trait would be a function (e.g., the heart makes noise, so noise-making would be a function of the heart), making the notion of function collapse.

  **Rating:** Clearly right  
  **Justification:** Dana is highlighting a key motivation for the etiological theory: without a historical criterion, we have no principled way to distinguish between a function and a mere side effect. For example, the heart's noise is a side effect of its pumping, and we don't want to say that noise-making is a function of the heart. The etiological theory avoids this by requiring that the function be the effect for which the trait was selected. This is a valid argument and a standard defense of the etiological theory.

  **Move (6):** Ellis replies that the causal-role account does not count every effect. It only counts contributions to some capacity of the system that we have independently singled out for analysis. For example, noise-making is excluded because we are not analyzing the heart under the capacity "making noise."

  **Rating:** Clearly right  
  **Justification:** Ellis is correct about the causal-role theory. It requires that we specify a system and a capacity we are interested in. So, if we are analyzing the circulatory system, we are interested in the heart's role in pumping blood, not in making noise. Thus, the causal-role theory does not collapse into counting every effect. This is a standard feature of the theory.

  **Move (7):** Dana replies that what singles out the capacity is arbitrary and circular: we choose the capacity that makes the answer come out as we want.

  **Rating:** Questionable  
  **Justification:** Dana's criticism is that without an independent criterion for choosing the capacity, the causal-role theory is arbitrary and circular. This is a common criticism. However, in practice, biologists often have a specific context in mind when they talk about function (e.g., the function of the heart in the circulatory system). But it is true that the causal-role theory does not provide a non-arbitrary way to choose the system and capacity. This is a point of debate. Therefore, it's questionable because while the criticism has some force, the causal-role theory does have a structured way of defining function within a given analytical context.

  **Overall Assessment:**

  Both Dana and Ellis are defending legitimate theories of function in biology. The etiological theory (Dana) and the causal-role theory (Ellis) are two major accounts, and each has strengths and weaknesses.

  **Who is closer to the truth?** It depends on the context. In the context of evolutionary biology, the etiological theory is more commonly used because it links function to adaptation and natural selection. However, in the context of functional anatomy or physiology, the causal-role theory may be more appropriate because it focuses on current mechanisms.

  In the specific case of the snail ridge, both views have merit. The ridge does have a historical function (beetle defense) and a current effect (crab defense) that is beneficial. But note that the crab defense is not a function in the etiological sense because it hasn't been selected for. In the causal-role sense, it is a function if we are considering the capacity of the snail to resist crab predation.

  However, the problem is that the ridge did not evolve for crab defense, and there's no evidence that the ridge has been modified by selection to resist crabs. It's a lucky accident. So, if we are asking what the ridge is *for* (in the evolutionary sense), then Dana is right. If we are asking what the ridge currently *does* that is beneficial, then Ellis is right.

  **What is each missing?**

  - **Dana** is missing the fact that the ridge now plays a role in crab defense, which is a current function in a non-historical sense. Her theory does not account for this because it only looks at history.

  - **Ellis** is missing the historical dimension. His view does not account for why the ridge exists in the first place. Without the history of beetle defense, the ridge might not be there at all. Also, his view might assign function to accidental benefits, which may not be the reason the trait is maintained (if at all).

  **Verbal vs. Substantive Disagreement:**

  The disagreement is partly verbal because they are using the term "function" in different ways. Dana is using it in the etiological sense, while Ellis is using it in the causal-role sense. They are talking past each other to some extent.

  However, it is also substantive because they are making different claims about what we should consider when assigning function. Dana emphasizes the trait's evolutionary history, while Ellis emphasizes its current causal role. These are two different scientific interests.

  **Conclusion:** Overall, in the context of evolutionary biology, Dana's view (etiological) is more appropriate because the ridge is a product of evolution by natural selection for beetle defense. But Ellis's point about the current role against crabs is important and should not be ignored. The best approach might be to use both concepts: the ridge has the etiological function of beetle defense and a current causal role in crab defense.

  However, note that the question is about the function of the trait. In evolutionary biology, the function is typically the effect for which the trait was selected. Thus, Dana is closer to the truth in that specific context.

  But in the broader picture, both theories are valid and serve different purposes. For the adjudication of the exchange, we see that both have made strong points and both have weaknesses.

  **Final Rating on Overall Truth:** Dana is closer to the truth about the snail ridge in the sense of what the trait was originally designed for (by natural selection) and why it exists. However, Ellis has a point that in the current environment, the ridge is serving a new beneficial role. But since the question is about the function (and in evolutionary biology, function is typically historical), we lean toward Dana.

  But note: the ridge is currently not under selection for either beetle or crab defense (since the beetle is gone and the crab effect is accidental and not selected). So, in the strict etiological sense, the function is still beetle defense (the historical reason the trait was selected and maintained until the beetle disappeared). However, if we are talking about the present, the ridge has no function in the etiological sense because there is no current selection for it. But Dana would still say the function is beetle defense because that's why it's there. This is a subtle point.

  Given that, and the fact that the ridge is now neutral (except for the accidental crab defense which is not selected), Dana's historical assignment of function (beetle defense) is correct for the reason the trait exists. But Ellis is right that in the present, it has no function in the etiological sense because there's no current selection. However, note that Dana's view does not require current selection: the function is fixed by history. So, for Dana, the function remains beetle defense even without current selection.

  Thus, overall, Dana's view is more consistent with evolutionary theory. But we must recognize the value of Ellis's point about the current causal role.

  In summary, the exchange shows the two sides of a philosophical debate that is ongoing. Both have merit, but in the context of evolutionary biology, the etiological theory is dominant and thus Dana is closer to the truth about the function of the snail ridge.
