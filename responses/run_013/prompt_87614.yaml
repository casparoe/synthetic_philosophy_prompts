  Regarding the seeking test: The fact that "a seeker of planets rejects Pluto" doesn't automatically prove Gongsun's point - it could just show definitional change. Gongsun's deeper claim is about necessary incompatibility of compound/simple terms due to different respects, but IAU's distinction is contingent on human criteria-setting.

