  1) The Pluto affair neither fully vindicates nor refutes Gongsun Long - it's partially relevant but shows limitations. 
  2) Dwarf planets are "not planets" only by stipulation in Gongsun's framework, not by necessary non-identity. 
  3) The theory's critical limitation: It can't address why boundaries should be drawn at particular points (e.g., cultural significance vs orbital mechanics). The School of Names remains descriptive about language boundaries, not prescriptive about which boundaries matter.

