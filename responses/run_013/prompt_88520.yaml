answer: |-
  ## Proposal: Dissolving the Careenium Puzzle – A Workshop on Levels of Causation

  **The Core Question:** When we describe a higher-level entity (like a "simmball" clump of magnetic balls) as causing something (like moving another clump), is this description *genuinely causal* in a way that doesn't reduce to or conflict with the causal story at the lower level (individual "simms" jostling)? The persistent puzzle – why this feels problematic, leading to worries about causal exclusion or overdetermination – stems, we suspect, not from a single mystery but from the hidden conflation of three distinct conceptualizations of "cause." Does the simmball "push" in the sense of being a manipulable *difference-maker*, in the sense of being the direct locus of *force transfer* or "oomph," or in the sense of being a *robust explanatory pattern*? Our proposal is that the apparent tension dissolves once these senses are separated, leaving resolvable normative questions about explanatory practice rather than intractable metaphysical conflicts.

  **Why the Standard Stalemate Persists:** The literature on higher-level causation, particularly in mental causation, often oscillates between seemingly incompatible intuitions. Reductionists argue compellingly that all "real" causal work happens at the fundamental (e.g., simm) level, making higher-level causes epiphenomenal or mere descriptions. Non-reductionists counter that higher-level properties and entities demonstrably make a difference to outcomes and are indispensable for explanation and prediction. Each position gains traction by implicitly prioritizing a different aspect of causation. The reductionist often focuses on the physical *production* of change – the literal transfer of momentum or energy. The non-reductionist often relies on *difference-making* under intervention (if the higher-level property changed, the outcome would change) or the *explanatory indispensability* of higher-level patterns. Because these distinct notions are rarely disentangled within the debate, arguments talk past each other, and the core puzzle remains unresolved. The careenium, stripped of biological or psychological complexities, provides an ideal, minimal arena to isolate these strands.

  **Proposed Method: Constructive Toy Models:** Instead of re-surveying philosophical positions or simulating complex biological systems (which introduce confounding empirical uncertainties), this project adopts a constructive, model-based approach. We will deliberately design and analyze a family of *toy careenia* – simplified variations on Hofstadter's magnetic ball setup – engineered to pull apart the three proposed senses of causation:

  1.  **Difference-Making Dominance:** A model where stable clump-level properties (e.g., "size A" or "shape B") reliably predict outcomes under interventions *that would be incoherent or ineffective at the simm level*. For example, a scenario where swapping a specific *type* of clump (defined by its aggregate properties) with another type reliably changes the system's trajectory, even if the precise micro-configuration of simms within the clump types varies wildly, making simm-level interventions impractical or non-predictive. Here, the clump level provides the clean difference-making story.
  2.  **Production Primacy:** A model where the dynamics are explicitly governed by direct, local force transfers *only* between individual simms (e.g., strict Newtonian collisions with momentum conservation). While stable clumps form and exhibit regular behavior, any attempt to attribute force transfer *to the clump itself* is demonstrably a book-keeping fiction; the "push" of a clump is exhaustively constituted by the pushes of its constituent simms interacting with their immediate neighbors. The causal "oomph" resides solely at the micro level.
  3.  **Robust Pattern Primacy:** A model exhibiting complex, chaotic simm-level interactions where individual trajectories are unpredictable, but where emergent clump-level dynamics exhibit stable, predictable regularities that are *robust* across variations in the underlying micro-dynamics (e.g., changes in friction coefficients, slight variations in initial simm positions). The clump-level description offers superior prediction and explanation *despite* the micro-level messiness, earning its status as a "real pattern."
  4.  **Level Collapse Cases:** Crucially, we will also build models where the levels *don't* usefully separate, serving as controls: a) A model so simple that clump-level descriptions add no predictive or explanatory value beyond the simm-level description. b) A model where the clump-level description *fails* to be robust or support interventions, despite apparent stability.

  **Why This Approach Succeeds:**
  *   **Clarity:** Toy models offer unparalleled transparency. We specify the rules governing the simms precisely, making causal relationships at both levels analytically tractable or straightforwardly simulatable.
  *   **Control:** We can isolate variables (like interaction rules, noise levels, scale separation) impossible to control in real neural systems or purely conceptual arguments.
  *   **Targeted Separation:** By design, each variant highlights the conditions under which one causal sense becomes salient while others recede, directly testing our hypothesis about conceptual conflation.
  *   **Scope Honesty:** A one-day workshop is ideal for collaboratively designing, simulating (using simple physics engines or cellular automata frameworks), and analyzing 3-4 core variants. Key outcomes achievable within the day include: a consensus taxonomy of causal senses derived from the models; clear identification of which model features trigger the salience of each sense; and a preliminary verdict on which traditional disputes (e.g., exclusion arguments) dissolve when senses are separated, and which genuine normative disagreements about explanatory practice remain. The short written output would summarize this taxonomy, the model variants, and their implications.

  **Expected Result & Failure Condition:** Success means demonstrating a systematic *wedge*: showing that across our toy models, the verdict on whether the simmball "pushes" *varies decisively* depending on whether we mean difference-making, production, or robust pattern. This would yield a small, concrete taxonomy clarifying when, why, and in what sense higher-level causation is legitimate. The residual "dispute" becomes normative: for a given explanatory context (prediction, mechanism, intervention), which causal concept is most appropriate? The project fails decisively only if, despite our deliberate engineering, the three senses *invariably align* across all plausible toy models we can conceive. If manipulation of the clump *always* implies direct force transfer *by the clump* and *always* corresponds to the most robust pattern (or vice versa), our hypothesis about conflation driving the puzzle would be undermined, and the exclusion worry might regain its unified force. We consider this outcome unlikely, given the prima facie distinctness of the concepts, but its possibility underscores the empirical nature of this conceptual investigation.

  This workshop offers a unique opportunity: to use a deliberately simple, constructible model to cut through decades of tangled debate, not by finding a new answer to an old question, but by showing that the old question masked three better ones. The output will be a shared conceptual toolkit for clearer future discussions of causation across levels, grounded in concrete, analyzable examples.
