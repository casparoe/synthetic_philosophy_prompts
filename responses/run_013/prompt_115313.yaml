  Here’s a rigorous defense of your position, structured around your requirements:

  ### Core Argument: Contrastive Salience as the Foundation of Omissive Causation
  When we claim an omission "caused" an outcome, we’re not describing a physical chain of events (since no action occurred). Instead, we’re invoking a **contrastive explanation**: the outcome becomes intelligible *only* when we contrast actual inaction with a **salient alternative action** that was normatively, contextually, or pragmatically expected. Duties, laws, or norms *derive* their causal relevance from making certain alternatives salient—they aren’t primitive causal factors. Counterfactual dependence (e.g., "if they acted, the outcome would differ") is necessary but insufficient; without salience, we get absurd causal attributions (e.g., "my omission to flap my arms caused the bridge collapse because I could’ve theoretically created a wind barrier"). Salience filters which counterfactuals matter.

  ---

  ### Evidence 1: Omission *Without Duty* Still Causes the Outcome  
  **Case: The Hiker’s Silent Trek**  
  *A group of hikers traverses a remote trail. Alex, an experienced hiker, notices a critical bridge ahead has washed out but stays silent, secretly hoping the group leader (whom Alex dislikes) will be blamed for poor planning. The group proceeds, and the leader falls to their death.*  

  **Why causation is intuitive despite no duty:**  
  - **Counterfactual dependence:** If Alex had warned them, the group would have stopped (outcome altered).  
  - **Salience without duty:** The alternative where Alex *speaks up* is highly salient:  
    - **Contextual expectation:** Hikers in a group implicitly rely on shared observations for safety.  
    - **Explanatory contrast:** The death is best explained by contrasting actual silence ("Alex said nothing") with the salient alternative ("Alex warned them").  
  - **Duty’s irrelevance:** Alex had no legal or role-based duty (not a guide), yet we intuitively say their silence *caused* the death. Salience arises from **shared situational norms** (mutual aid in survival contexts), not formal obligations.  

  ---

  ### Evidence 2: Duty *Without Causation* Feels Off  
  **Case: The Overwhelmed Firefighter**  
  *Firefighter Ben is on duty but collapses from a sudden heart attack, unable to respond to a fire alarm. The fire station is understaffed, and without Ben’s intervention, a building burns down. Ben had a clear duty to act.*  

  **Why causation feels off despite duty:**  
  - **Counterfactual dependence holds:** If Ben had acted (and been healthy), he *could* have extinguished the fire.  
  - **Salience blocked:** The alternative "Ben fights the fire" isn’t salient *as an explanation* for the outcome. Why?  
    - **Non-actualizability:** Ben’s incapacity makes the alternative *irrelevant* to explaining why the fire raged—it’s akin to contrasting with "if a superhero intervened."  
    - **Explanatory focus:** The fire’s cause is traced to understaffing/faulty alarms, not Ben’s inaction. His duty *fails* to make "Ben acting" salient because it was *impossible* given the circumstances.  
  **Result:** Duty alone doesn’t imply causation; salience requires the alternative to be a *realistic* contrast.  

  ---

  ### Addressing the Salience Objection: "Isn’t this too subjective?"  
  **Objection:** If causation depends on "whatever we find salient," it becomes arbitrary—e.g., if I find "Alex reciting poetry" salient, does that make it a cause?  

  **Rebuttal:** Salience isn’t whimsical; it’s constrained by **pragmatic, normative, and contextual anchors**:  
  1. **Normative Frameworks:** Salience tracks *reasonable expectations* in a context (e.g., warning of danger is salient for hikers; reciting poetry isn’t). These expectations emerge from social practices, not individual whims.  
  2. **Explanatory Relevance:** Salient alternatives must be *explanatorily useful*. Contrasting with irrelevant alternatives (e.g., "if Alex had flapped her arms") doesn’t clarify why the outcome occurred.  
  3. **Stability:** Shared human interests (survival, cooperation) create robust salience patterns. We *converge* on "speaking up" as salient in danger scenarios across cultures.  
  4. **Duties as Salience-Generators:** When duties *do* matter (e.g., a lifeguard omitting to save a swimmer), it’s because they *make* the alternative action ("lifeguard diving in") highly salient. Duties aren’t causal; they *elevate* salience.  

  **In essence:** Salience is intersubjectively stable, grounded in human needs and shared reasoning. It avoids the arbitrariness of "anything goes" while resolving the pitfalls of duty-based theories (too narrow) and pure counterfactuals (too broad).  

  ### Why This Theory Wins
  - **Unifies intuitions:** Explains why we see causation in the hiker (no duty) but not the firefighter (duty present).  
  - **Demotes duty:** Duties are just one way salience is generated—not a causal ingredient.  
  - **Handles vagueness:** Salience accommodates gray areas (e.g., "Was the alternative *sufficiently* salient?") better than binary duty/no-duty splits.  
  This framework captures the *explanatory* essence of omissive causation: we cite omissions as causes when the salient alternative *best explains what went wrong*. Duties merely shape that salience; they don’t define it.
