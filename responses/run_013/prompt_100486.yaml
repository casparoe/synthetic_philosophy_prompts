  I'm drafting a scene for a novel and I want a small philosophical contraption to hang it on. Could you build me a statue-and-clay thought experiemnt where the lump and the statue come apart in the direction that's supposed to be the awkward one: the statue is still there and the lump is gone. It has to be something that could actually go down in a pottery studio or a foundry, no exotic physics, no swapping bits in or out, and the same material stays put the whole time. One paragraph for the scenario. Then walk me through it: what the constitution view says, what the view that says the statue just is the lump says, and what someone who thinks statues aren't really objects at all says. Point to the single feature of the case that's doing all the work, tell me what happens if you take that feature away, and tell me how someone who thinks I've rigged it -- that I've assumed my conclusion instead of earning it -- would come at the case. And be straight with me: if what I'm asking for is impossible, or if I've got the positions muddled, say so rather than playing along. A short note at the end on where the scenario takes liberties with the real metaphysics would be great too, since I don't want to fool myself while I'm writing.
