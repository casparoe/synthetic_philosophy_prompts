answer: |-
  ## MU, Unbuilt

  **I.**  
  &nbsp;&nbsp;&nbsp;&nbsp;MI  
  &nbsp;&nbsp;&nbsp;&nbsp;From M and I, a string begins its spread.  
  &nbsp;&nbsp;&nbsp;&nbsp;Rule one: append a U to the end.  
  &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;MIU  
  &nbsp;&nbsp;&nbsp;&nbsp;Rule two: Mx calls its own echo, twin.  
  &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;MII  
  &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;MIIII  
  &nbsp;&nbsp;&nbsp;&nbsp;Rule three: three I's huddle, traded for U.  
  &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;MIU  
  &nbsp;&nbsp;&nbsp;&nbsp;Rule four: two U's vanish without trace.  
  &nbsp;&nbsp;&nbsp;&nbsp;The branches fork; the forest thickens deep.  
  &nbsp;&nbsp;&nbsp;&nbsp;More ink, more time, more paper we employ.  
  &nbsp;&nbsp;&nbsp;&nbsp;Perhaps down *this* path... MU lies asleep.  
  &nbsp;&nbsp;&nbsp;&nbsp;We trace each twist with hope, and then deploy.  

  **II.**  
  &nbsp;&nbsp;&nbsp;&nbsp;MIIU  
  Stop. Count the I's: one, two, but never *none* times three.
  &nbsp;&nbsp;&nbsp;&nbsp;From doubling? One becomes two, two becomes four.  
  &nbsp;&nbsp;&nbsp;&nbsp;From swapping? Three I's leave. That's minus three.  
  &nbsp;&nbsp;&nbsp;&nbsp;Appending U? Or deleting UU? Still, they stay:  
  &nbsp;&nbsp;&nbsp;&nbsp;Not divisible, never cleanly split.  

  **III.**  
  &nbsp;&nbsp;&nbsp;&nbsp;MU  
  &nbsp;&nbsp;&nbsp;&nbsp;This name, not built, stands where no path is laid.  
  &nbsp;&nbsp;&nbsp;&nbsp;The rules don't count; they only rearrange.  
  &nbsp;&nbsp;&nbsp;&nbsp;This proof's no move – a strange arithmetic  
  &nbsp;&nbsp;&nbsp;&nbsp;That settles all by what it can't exchange.  
  &nbsp;&nbsp;&nbsp;&nbsp;Not "think outside!" – just see what must persist.  
  &nbsp;&nbsp;&nbsp;&nbsp;No UU gone, no III swapped, no echo cast  
  &nbsp;&nbsp;&nbsp;&nbsp;Can shift the count that holds the first I fast.  
  &nbsp;&nbsp;&nbsp;&nbsp;From why to how, the forest clears its mist:  
  &nbsp;&nbsp;&nbsp;&nbsp;The target rests forever, still unbuilt.  

  ---

  **Argument Read Off:**
  1.  **Pattern:** Consistent indentation for derivations and reasoning *within* the system's logic.
  2.  **Break:** The flush-left, imperative "Stop. Count the I's..." line breaks the indentation pattern precisely when the invariant is introduced.
  3.  **Resumption:** Indentation returns immediately after the invariant is established, marking the return to formal reasoning, now *about* the system.
  4.  **Sonic Echo:** "From M and I..." (opening) resonates with "From why to how..." (closing), marking the shift from initial construction to final understanding.

  **Accuracy Check:**
  *   **Strings:** `MI` (Start), `MIU` (Rule 1 on MI), `MII` (Rule 2: Mx -> Mxx, x=I), `MIIII` (Rule 2: Mx -> Mxx, x=II), `MIU` (Rule 3: III->U), `MIIU` (Rule 1 on MII). `MU` is presented separately in Part III.
  *   **Rules:** Only the four defined rules are used/implicitly referenced. No invented rules.
  *   **Invariant:** Correctly identified as the count of `I`'s modulo 3 (never zero mod 3, i.e., never divisible by 3). The operations (doubling, subtracting 3, adding/deleting 0 I's via U rules) preserve this property. `MU` has 0 I's (0 mod 3), violating the invariant.
  *   **Nature of Proof:** Emphasizes the proof is *not* a derivation ("The rules don't count"; "This proof's no move"), yields a refusal ("This name, not built"; "The target rests forever, still unbuilt"), and is settled "in one move" ("settles all").
  *   **Analogy:** "a strange arithmetic / That settles all by what it can't exchange" hints at meta-reasoning without invoking Gödel or undecidability. The system *is* decidable via this invariant.
  *   **Avoided Pitfalls:** No moralizing, no "outside the box" cliché, no false equivalence to incompleteness, `MU` is correctly marked as unreached.
