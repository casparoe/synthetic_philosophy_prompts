answer: |-
  ### The Case: The Conservation of Annihilation Vectors
  Consider a world whose entire history consists of point particles of two types, A and B, interacting only via pairwise annihilation: when an A and B particle collide, they vanish, emitting no energy. The world contains trillions of such annihilation events distributed across space and time. All particle velocities are measurable and exhibit a striking regularity: **in every annihilation event, the vector sum of the velocities of the A and B particles immediately before collision is exactly zero**. This holds without exception. The velocities themselves vary widely—some pairs approach head-on, others obliquely—but the vector sum is invariably zero. Crucially, this conservation pattern is not derivable from any other dynamical regularities (e.g., conservation of mass/energy is absent; particles have no other interactions). The particles' intrinsic properties (mass, charge) are identical within types but offer no explanation for the velocity constraint. For the Humean, adding this regularity as an axiom simplifies the system enormously, replacing infinite disjunctive descriptions of possible velocity outcomes with one law. For the anti-Humean (specifically, an Armstrong-style necessitation theorist), this regularity lacks a grounding relation between universals or properties.

  ---

  ### Verdicts and Reasoning
  1. **Humean Verdict: LAW**  
     The regularity is exceptionless, globally exhibited, and not derivable from other patterns. Adding "All A-B annihilation vector sums = 0" as an axiom drastically increases **strength**: it entails all past and future annihilation outcomes. It also maximizes **simplicity**: without it, the best system must list every annihilation's velocity outcome individually (or use infinitely many disjuncts), making it vastly more complex. This axiom's descriptive economy guarantees its place in the best system. Thus, it is a law.  

  2. **Anti-Humean Verdict (Armstrong-style): NOT A LAW**  
     Anti-Humeanism (here, **strong necessitation theory**) requires laws to be grounded in a relation of natural necessitation (N) between universals. Here, no such relation exists. The velocity conservation does not arise from the *natures* of A-particles, B-particles, or annihilation; it is brute. Universals (e.g., *having velocity V*, *annihilating*) share no N-relation that *explains* the regularity—it is merely a cosmic coincidence. Since laws must be ontologically grounded in necessitation, this regularity fails.  

     *Why this version?* Armstrongian anti-Humeanism is chosen because it explicitly ties lawhood to a relation between universals. A primitivist (who takes lawhood as unanalyzable) *might* side with the Humean here, but necessitation theorists cannot.  

  ---

  ### The Pivotal Feature  
  **The regularity is brute: it lacks a metaphysical grounding in the properties or relations of the entities involved.** The velocities conserve inexplicably, with no causal or modal "hook" in particle natures.  

  ---

  ### Modified Feature: Adding Grounding  
  **Change:** Suppose A-particles intrinsically "seek" zero vector sum with B-particles upon annihilation (e.g., their essences include this disposition).  
  **Result:** The disagreement *collapses*. The anti-Humean now accepts the regularity as lawfully grounded in property essences. The Humean’s verdict is unchanged (it still optimizes the best system).  

  ---

  ### Decisive vs. Marginal Gain  
  The gain for the Humean is **decisive**. Omitting the axiom forces an intractably complex system (e.g., enumerating all velocity outcomes). No marginal case exists here: if the gain were marginal (e.g., the regularity simplifies only 51% of descriptions), the Humean *might* exclude it, but here it simplifies *all* annihilation descriptions. The disagreement is categorical, not gradational.  

  ---

  ### Strongest Reply for the Anti-Humean (Who Fares Worse)  
  **Reply:** "This 'law' is an accidental uniformity. Its brute, unexplained nature makes it unfit for scientific explanation—it predicts but does not *explain* why vector sums are zero. Humeanism mistakes descriptive efficiency for nomicity, conflating epistemology with metaphysics. Only grounded regularities sustain counterfactuals and induction; this one would fail if new particle types appeared."  

  ---

  ### Why This Works  
  - **No violations of requirements**: No aliens, no single-instance, no stipulation. Anti-Humean denial follows from the lack of necessitation.  
  - **Asymmetry achieved**: Humeans accept (due to systemic optimization); Armstrongians reject (due to lack of grounding).  
  - **Shows**: The dispute hinges on whether lawhood requires *metaphysical grounding* (anti-Humean) or merely *descriptive supremacy* (Humean). If no grounding exists, anti-Humeanism *must* deny lawhood—even for pervasive, useful regularities.
