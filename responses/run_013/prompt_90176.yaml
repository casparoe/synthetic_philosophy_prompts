  [Clears throat, stands facing the gathering]  

  Ray wouldn’t have wanted a fuss. He’d have wanted the organ tuned and the hymns picked out properly. He’d have wanted us to remember him honestly. So I will.  

  For sixty years, Ray was my closest friend. He knew I don’t share his faith. I knew St. Bridget’s was his compass, his rhythm, his home. We never pretended otherwise. We didn’t need to. Because what held us together ran deeper than agreement. It was trust, forged over decades of shared history – rock hunting in the rain, arguing baseball stats, sitting quietly when words weren’t needed. He was the most consistent man I’ve ever known. Morning mass, year after year. Fingers finding the keys, filling this hall with something that felt solid, even to me.  

  There’s a power in that consistency. In showing up. In building a life around something bigger than yourself. Ray’s faith wasn’t just words to him; it was the frame he built his days within. It gave him purpose. It connected him – to Father Alvarez, to all of you, to generations of this parish who felt that lift in their chest when he played. That connection, that shared language of ritual and music and quiet presence… it *meant* something. It held him. It holds you now.  

  We humans are built for this. We reach for patterns. We build structures to make sense of the world, to hold each other up when the ground feels shaky, to mark the moments that matter with something more than silence. Ray’s life was a testament to the strength found in that reaching, in that building. His belief was the bedrock of his kindness, his patience, his unwavering decency. He didn’t just play the organ; he *was* part of the structure here. The steady beat beneath the melody.  

  Our friendship proved you don’t need the same map to walk side by side. We saw the landscape differently, radically so. But we respected the path the other was on. I admired the integrity with which he walked his. His faith made him who he was – generous, grounded, utterly reliable. It shaped the space he held for his family, for his music, for this community. And that space was real. The comfort he gave, the music he offered, the quiet strength he embodied – those weren’t illusions. They were the tangible outcomes of a life lived with deep conviction.  

  So today, we feel the silence where his music was. We feel the gap where his presence steadied us. It’s a very human thing, to gather like this, to share stories, to lean on the rituals we know. To find, together, a way to carry the weight of losing someone so essential. Ray understood that need. He spent his life tending to it.  

  He was my friend. A good man. Honest to his core. I’ll miss him. And I’m grateful, profoundly grateful, that his chosen structure – this faith, this community, this music – gave him the strength to be exactly who he was. That was gift enough.
