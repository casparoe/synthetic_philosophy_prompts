answer: |-
  The British constitutional monarchy embodies a sophisticated theory of political authority grounded in **constitutional conventions, latent sovereignty, and the separation of symbolic from operational power**. Its coherence depends on a distinct view of sovereignty, accountability, and the paradox of "constitutional latency." Below is a systematic reconstruction:

  ### I. Core Theory of Political Authority
  The practice presupposes **Dualist Sovereignty**:
  - **Legal Sovereignty**: Formally resides in the "Crown-in-Parliament" (monarch + Lords + Commons).  
  - **Political Sovereignty**: Effectively resides in democratically accountable institutions (Parliament + Cabinet).  
  The monarch embodies the *continuous state* while ministers exercise *temporal power*. Authority derives from **historical legitimacy** (monarchy) and **popular consent** (Parliament), fused through conventions that prioritize stability.

  ### II. Sovereignty: Necessary Commitments & Rival Theories Excluded
  - **Commitment**: Sovereignty resides in the **Crown-in-Parliament as a perpetual institution**, not in any single actor.  
    - *Why?* The monarch’s powers exist only via ministerial advice, yet her reserve powers (e.g., appointing PM in hung parliaments) confirm institutional sovereignty’s supremacy over individual will.  
  - **Excluded Theories**:  
    - **Absolutism** (monarch as sovereign actor): Contradicted by binding conventions.  
    - **Pure Popular Sovereignty** (e.g., Rousseau): Rejected because authority flows from the Crown, not direct popular mandate.  
    - **Legal Positivism** (sovereignty = unlimited legislative power): Fails to explain conventions restraining both monarch *and* Parliament.  
  - **Accommodated Theories**:  
    - **Diceyan Parliamentary Sovereignty**: Compatible if "Parliament" includes the Crown.  
    - **Constitutional Pluralism**: Accepts multiple sources of authority (tradition, law, democracy).

  ### III. Accountability & the "Unaccountable Monarch" Paradox
  The rule that ministers answer for the monarch’s acts applies a **General Principle of Accountability**:  
  > *Authority is legitimate only when traceable to an accountable agent.*  
  - **Monarch’s exemption**: Her non-accountability is tolerable because:  
    1. **She exercises no operational discretion** (all acts are ministerial).  
    2. **Her latent power exists solely to ensure accountability elsewhere**:  
       - By receiving confidential briefings and counseling ministers, she acts as a **constitutional conscience**, forcing government to confront its reasoning.  
       - Her *potential* intervention (e.g., refusing dissolution) ensures governments avoid crises requiring it.  
  - **Constitutional Latency Coherence**:  
    - **Is it stable?** Yes, as a **self-extinguishing power**: Its credibility depends on the *threat* of use, but use reveals its limits (e.g., 1975 Australian crisis).  
    - **Genuineness**: The power is real *because* its exercise is catastrophic. Like a nuclear deterrent, efficacy lies in non-use.  

  ### IV. Undetermined Elements: Competing Legitimacies
  The practice is **procedurally underdetermined**, allowing divergent justifications:  
  - **Traditionalist View**: Authority stems from historic Crown legitimacy.  
  - **Democratic View**: Monarch is a cipher; legitimacy flows from Parliament.  
  - **Constitutionalist View**: Conventions themselves are foundational.  
  *Why compatible?* All accept the **procedural primacy of conventions** over abstract principles. The same institutions could arise from Burkean traditionalism or Oakeshottian pragmatism.

  ### V. Replacing the Theory: The "Ceremonial Placeholder" Challenge
  If the monarch were stripped of discretion and reduced to pure ceremony:  
  - **Necessary Changes**:  
    1. **Eliminate confidential briefings**: No "counsel/warn" function requires ignorance.  
    2. **Codify reserve powers**: E.g., Fixed-term Parliaments Act 2011 (now repealed) constrained dissolution.  
    3. **Transfer discretionary roles**: E.g., President/Govern-General assumes crisis powers (as in Germany/India).  
  - **Consequences**:  
    - **Loss of constitutional resilience**: No confidential forum for unfiltered counsel.  
    - **Crises become legalistic**: Hung parliaments require rigid rules, not flexible conventions.  
    - **Erosion of latent authority**: The "deterrent" effect vanishes, potentially encouraging governmental brinkmanship.  

  ### Conclusion: The Implicit Theory
  The system rests on a **Proceduralist Theory of Authority**:  
  > Legitimacy arises from adherence to evolved conventions that distribute powers, ensuring no actor can monopolize sovereignty while maintaining a symbolic "guardian" of state continuity.  
  **Constitutional latency** is coherent because it binds power to forbearance: the Crown’s authority is preserved *because* it is never used independently. This creates a stable equilibrium where accountability is concentrated in ministers, while the monarch’s influence operates through anticipation and moral suasion—a uniquely British solution to the paradox of vesting ultimate authority in a powerless sovereign.
