prompt: |-
  I am a software engineer with no formal philosophy background, and I am preparing to interview a philosopher for a small internal podcast at my company. The guest defends a version of metaontological deflationism: she argues that many disputes about whether composite objects, numbers, or persons exist are merely verbal, because the disputants operate within different conceptual frameworks or attach different meanings to existence claims, and she treats existence questions as internal to a framework rather than as questions with a single framework-independent answer.

  I want the interview to stay in the weeds and not let her simply restate the view. I have built a diagnostic test from my day job, which I call the interoperability test. It says a dispute is merely verbal when four conditions hold: (1) observational equivalence, meaning both sides agree on all observable or predictive consequences; (2) translational parity, meaning each side's vocabulary can be mapped onto the other's without losing explanatory or predictive power; (3) schema canonicalization, meaning the dispute persists only because each side treats its own ontology as the default or canonical description; and (4) decision invariance, meaning no practical, scientific, or normative decision changes when you switch from one ontology to the other. I want questions that press whether this test captures the metaontological notion of a verbal dispute, where it over-generates or under-generates, and what her view implies when the test fails.

  Draft eight to ten interview questions in a sequence that makes her standard deflections progressively harder. For each question, include the follow-up keyed to the answer she is most likely to give. Press on: the difference between verbal and genuine disagreement; quantifier variance and whether it makes ontology a matter of language choice; the objection that if any disagreement can be redescribed as verbal by positing a new meaning, the view threatens to make every dispute verbal; whether deflationism leaves us unable to criticize frameworks that seem politically or morally harmful, especially for existence claims about race, gender, or social kinds; the distinction between questions internal to a framework and questions about the framework as a whole; and what argument or evidence could count against her view. Do not ask for citations, reading lists, or bibliographies, and do not ask generic questions about her career, influences, or advice for students.

  Return a single JSON object with exactly these fields: `guest_position_summary` (string), `diagnostic_test_summary` (string), and `questions` (array). Each element of `questions` must be an object with fields: `order` (integer, starting at 1), `question` (string), `target` (string naming the specific claim or move in her position that the question tests), `likely_reply` (string, the answer she is most likely to give), `follow_up` (string, keyed to that likely reply), `pressure_type` (one of: clarification, counterexample, internal_tension, scope, meta_level), and `uses_software_analogy` (boolean). Ensure the sequence ends with a question about what could change her mind.
reasoning: |-
  We are given:
    - Guest position: metaontological deflationism (many existence disputes are merely verbal because they arise from different conceptual frameworks; existence questions are internal to a framework).
    - Diagnostic test (interoperability test) with four conditions: 
        (1) observational equivalence
        (2) translational parity
        (3) schema canonicalization
        (4) decision invariance

   We must draft 8-10 interview questions that press on:
     - The difference between verbal and genuine disagreement.
     - Quantifier variance and whether it makes ontology a matter of language choice.
     - The objection that deflationism might overextend (making every dispute verbal by positing new meanings).
     - The moral/political critique: inability to criticize harmful frameworks (for race, gender, social kinds).
     - The internal/external framework distinction.
     - What could count against her view.

   Structure for each question:
     order: integer starting at 1
     question: string
     target: string (specific claim or move in her position)
     likely_reply: string (the most probable answer from her position)
     follow_up: string (keyed to the likely reply)
     pressure_type: one of ['clarification', 'counterexample', 'internal_tension', 'scope', 'meta_level']
     uses_software_analogy: boolean

   We are to return:
     {
       "guest_position_summary": string,
       "diagnostic_test_summary": string,
       "questions": [ ... ]
     }

   Sequence: start with clarifying the view, then apply the test, then press on the key issues, and end with what could change her mind.

   Let's plan the sequence:

   1. Clarify the core of her view: what makes a dispute merely verbal? (pressure: clarification)
   2. Introduce the interoperability test and ask if it captures her notion. (pressure: clarification, then internal_tension if she disagrees)
   3. Press on quantifier variance: does it reduce ontology to language choice? (pressure: internal_tension)
   4. Overgeneration objection: if we can always posit meaning variance, doesn't every dispute become verbal? (pressure: counterexample, scope)
   5. The distinction between internal and external questions: how to decide which framework to use? (pressure: meta_level)
   6. The moral/political challenge: what about harmful frameworks? (pressure: counterexample, internal_tension)
   7. What happens when the test fails? (pressure: scope, counterexample)
   8. What could change her mind? (pressure: meta_level)

   We need 8-10, so we might break some into multiple questions.

   Let's draft:

   Question 1: Clarifying the core notion of verbal dispute.
     Target: Her definition of verbal dispute.
     Likely Reply: She will say that a dispute is verbal when the parties are using the same words but with different meanings (or different conceptual frameworks) and there is no substantive disagreement once clarified.
     Follow-up: But how do we determine when a difference in meaning is at play? Is it just when there is no disagreement at the level of observations?

   Question 2: Introducing the test and asking if it captures her notion.
     Target: The four conditions in the test as a diagnostic for verbal disputes.
     Likely Reply: She might agree that these conditions are sufficient but not necessary? Or perhaps she'll say they capture the idea but are too strict?
     Follow-up: If she says they are too strict, ask for an example of a verbal dispute that fails one of the conditions.

   Question 3: Quantifier variance and ontology as language choice.
     Target: The claim that existence questions are framework-internal, and quantifier variance (different meanings for "exists").
     Likely Reply: She may say that ontology is not arbitrary but is tied to the framework we adopt, and the choice of framework is not merely linguistic but pragmatic.
     Follow-up: But then doesn't that make the choice of framework a substantive, non-verbal matter? How does this avoid collapsing into a form of realism?

   Question 4: Overgeneration objection.
     Target: The worry that by positing meaning variance arbitrarily, we can make any dispute verbal.
     Likely Reply: She might say that we don't posit meaning variance arbitrarily; it must be motivated by the disputants' actual usage or the structure of their theories.
     Follow-up: But then how do we rule out motivated meaning variance in cases where we think there is a genuine disagreement? For example, in scientific realism vs. anti-realism?

   Question 5: Internal/external distinction.
     Target: The idea that existence questions are internal to a framework, but what about choosing a framework?
     Likely Reply: Framework choice is a pragmatic matter, not a matter of truth.
     Follow-up: But if framework choice is pragmatic, does that mean that we can choose a framework for morally repugnant reasons? And if so, how do we critique that?

   Question 6: Moral/political challenge.
     Target: The application to social kinds (race, gender) and harmful frameworks.
     Likely Reply: She might say that deflationism does not preclude criticizing frameworks on moral or pragmatic grounds. But note: the objection is that existence claims about race/gender are not merely verbal because they have normative consequences.
     Follow-up: But if two frameworks disagree on the existence of races (one says races exist as biological kinds, the other denies that), and if they are observationally equivalent and meet the other conditions, then by your view it's verbal. But doesn't that prevent us from saying one is objectively false? And what if the framework that says races exist is used to justify oppression?

   Question 7: When the test fails (one or more conditions fail).
     Target: What implications does her view have when the test fails? For instance, if there is observational equivalence but not translational parity?
     Likely Reply: She might say that if the test fails, then the dispute is not verbal. But then we can ask: is the test necessary and sufficient?
     Follow-up: What if two frameworks are observationally equivalent but there is no translation? Does that mean they are not verbal? Or could they still be?

   Question 8: What could change her mind?
     Target: The defeasibility of her view.
     Likely Reply: She might say that if we found a case where the disputants clearly are talking past each other but the test fails, or vice versa, that would challenge the test. But what about her overall view?
     Follow-up: What about a case where we have two frameworks that meet all four conditions, but there is a strong intuition that the disagreement is substantive? Would that challenge her view?

   We might need 10 questions? Let's break some:

   1. Core notion of verbal dispute.
   2. How does the test capture it? (with follow-up if she disagrees)
   3. Does quantifier variance make ontology a matter of language choice?
   4. Overgeneration: doesn't this make every dispute verbal?
   5. How do we decide between frameworks? (meta-level)
   6. What about harmful frameworks? (social kinds example)
   7. If a dispute fails the test, does that mean it's not verbal? (scope)
   8. What if the test passes but we feel the dispute is substantive? (counterexample to sufficiency)
   9. What if the test fails but we feel it is verbal? (counterexample to necessity)
  10. What evidence could change her mind?

   Now, let's write the JSON.

   Note: We must not ask for citations, etc.

   Also, we can use software analogies in some questions (but not all). Let's mark which ones do.

   We'll write:

   guest_position_summary: "The guest defends metaontological deflationism, holding that many ontological disputes (e.g., about composite objects, numbers, or persons) are merely verbal because the disputants operate within different conceptual frameworks or attach different meanings to existence claims. She treats existence questions as internal to a chosen framework, denying that there is a single framework-independent answer to such questions."

   diagnostic_test_summary: "The interoperability test for a dispute being merely verbal requires: (1) observational equivalence (agreement on all observable or predictive consequences); (2) translational parity (each side's vocabulary can be mapped onto the other's without loss of explanatory or predictive power); (3) schema canonicalization (the dispute persists only because each side treats its own ontology as the default); and (4) decision invariance (no practical, scientific, or normative decision changes when switching ontologies)."

   Then the questions array.

   Let's write the first few:

   Question 1:
     order: 1
     question: "Could you start by explaining what you take to be the key markers of a merely verbal dispute in ontology?"
     target: "core definition of verbal dispute"
     likely_reply: "A dispute is verbal when the parties are not disagreeing about the facts but are using key terms (like 'exists') with different meanings, rooted in different conceptual frameworks. Once we clarify the frameworks, we see that each can translate the other's claims and that the disagreement vanishes."
     follow_up: "But how do we determine when a difference in meaning is the culprit? Is it enough that we can map one framework to the other without loss, or are there other factors?"
     pressure_type: "clarification"
     uses_software_analogy: false

   Question 2:
     order: 2
     question: "I've developed an interoperability test to diagnose verbal disputes. It requires: observational equivalence, translational parity, schema canonicalization, and decision invariance. Does this test capture the kind of verbal disputes you have in mind?"
     target: "adequacy of the interoperability test"
     likely_reply: "Yes, broadly, though I might not require all four conditions. For instance, translational parity might be too strong if we allow for some explanatory loss that doesn't affect predictions. Also, schema canonicalization is a psychological factor that might not be necessary for the dispute to be verbal in principle."
     follow_up: "If we relax the conditions, how do we avoid false positives? For example, if we drop translational parity, could we mistake a substantive disagreement for a verbal one?"
     pressure_type: "internal_tension"   [because she might want to relax the conditions but then we press on overgeneration]
     uses_software_analogy: true   [because the test is presented as a "diagnostic test" from software]

   Question 3:
     order: 3
     question: "A central idea in your view is quantifier variance: that different frameworks can have different meanings for 'exists'. Doesn't this reduce the question of what exists to a matter of linguistic choice?"
     target: "quantifier variance and its implications"
     likely_reply: "No, because the choice of framework is not arbitrary or merely linguistic; it's guided by pragmatic considerations like simplicity, fruitfulness, and coherence with our other beliefs. But within a framework, the existence questions have objective answers."
     follow_up: "But if the choice of framework is pragmatic, then isn't the answer to 'Do numbers exist?' also pragmatic? And doesn't that mean there's no framework-independent fact about whether numbers exist? Isn't that a form of anti-realism?"
     pressure_type: "internal_tension"
     uses_software_analogy: false

   Question 4:
     order: 4
     question: "Critics worry that if we can always posit a meaning variance to explain disagreement, then every dispute becomes verbal. How does your view avoid this overgeneration problem?"
     target: "overgeneration objection"
     likely_reply: "We don't posit meaning variance without evidence. It must be grounded in the actual usage and theoretical commitments of the disputants. Moreover, in many disputes, there are observable consequences at stake, so condition (1) of your test fails."
     follow_up: "But what about disputes where there are no current observable differences, like in metaphysics? Take the dispute between presentists and eternalists about time. Both agree on all current observations. Can we just posit meaning variance and declare it verbal? Doesn't that preclude the possibility of a genuine metaphysical disagreement?"
     pressure_type: "counterexample"
     uses_software_analogy: false

   Question 5:
     order: 5
     question: "You distinguish questions internal to a framework from external questions about which framework to adopt. How should we decide which framework to adopt, and is that decision itself a matter of truth or something else?"
     target: "framework choice and meta-level questions"
     likely_reply: "Framework choice is pragmatic: we choose based on which framework is most useful for our purposes, not on which is 'true' in a framework-independent sense. There is no external truth about which framework is correct."
     follow_up: "But then what stops someone from adopting a framework that serves nefarious purposes? For example, a framework that denies the existence of systemic racism? How can we critique such a framework if it is internally consistent and pragmatically useful for maintaining the status quo?"
     pressure_type: "meta_level"
     uses_software_analogy: false

   Question 6:
     order: 6
     question: "Let's press the moral challenge. Consider a framework that asserts the existence of biological races and uses this to justify oppression, and another that denies biological races exist. If these frameworks meet the conditions of the interoperability test (say, they are observationally equivalent and intertranslatable), does your view force us to say this dispute is merely verbal?"
     target: "moral/political implications for social kinds"
     likely_reply: "First, note that such frameworks are unlikely to meet the test. For example, they may not be observationally equivalent because one might make different predictions about health disparities. But even if they did, we can still reject the racist framework on moral and political grounds, not on ontological grounds. Deflationism doesn't prohibit criticizing frameworks; it just says that the ontological question 'Do races exist?' is internal to a framework."
     follow_up: "But if the dispute is verbal, then the racist isn't making a false ontological claim; they are just using a different framework. Doesn't that undermine our ability to say they are objectively wrong? And doesn't that weaken our moral critique?"
     pressure_type: "counterexample"
     uses_software_analogy: false

   Question 7:
     order: 7
     question: "Suppose a dispute fails the interoperability test because, say, there's no translational parity. Does that mean, by your lights, that the dispute is not verbal? And what would that imply for the ontological status of the entities in question?"
     target: "failure of the test (specifically translational parity)"
     likely_reply: "If there is no translation without loss of explanatory power, then the frameworks might be expressing genuinely different theories. So the dispute could be substantive. But note that sometimes translation might be difficult without being impossible, so we have to be cautious."
     follow_up: "But what if the lack of translation is due to one framework having a concept that the other cannot express? Does that mean the entity in question exists in one framework and not the other, and that this is a substantive difference? How does that square with deflationism?"
     pressure_type: "scope"
     uses_software_analogy: true   [because translational parity is like interoperability in software]

   Question 8:
     order: 8
     question: "What if the test passes — all four conditions hold — but we have a strong intuition that the disagreement is substantive? For example, in mathematics, Platonists and fictionalists might agree on all predictions and be intertranslatable, but the fictionalist says numbers don't exist while the Platonist says they do. By the test, it's verbal. But doesn't it feel like there's a real disagreement here?"
     target: "intuitions of substantivity when test passes"
     likely_reply: "The test is designed to capture when a dispute is verbal, so if it passes, I would say the dispute is verbal. The feeling of substantiveness might come from the importance of the framework choice. But we must separate the pragmatic importance from the idea of a framework-independent fact."
     follow_up: "But then how do you account for the intuition? And doesn't this lead to the overgeneration problem we discussed earlier? If every dispute where the test passes is verbal, then many deeply held metaphysical disagreements are dismissed as verbal, which seems to trivialize them."
     pressure_type: "counterexample"
     uses_software_analogy: false

   Question 9:
     order: 9
     question: "Conversely, what if the test fails but we have reason to think the dispute is verbal? For instance, two frameworks might not be intertranslatable because one uses a complex jargon, but we suspect that with enough work we could build a translation. Does your view require that we wait until we find a translation to declare it verbal?"
     target: "failure of the test but intuition of verbalness"
     likely_reply: "Deflationism is not committed to the test as the only way. If we have independent reason to think the dispute is verbal (like the disputants agreeing on all non-ontological matters), then even without a translation, we might suspect it's verbal. But without translation, it's harder to be sure."
     follow_up: "But doesn't that mean the test is not necessary? How then do we avoid arbitrariness in declaring disputes verbal?"
     pressure_type: "internal_tension"
     uses_software_analogy: true   [because translation is like making two systems interoperable]

   Question 10:
     order: 10
     question: "Finally, what kind of argument or evidence would lead you to reconsider your deflationist position? Are there any possible findings that could convince you that some ontological disputes are not merely verbal?"
     target: "defeasibility of deflationism"
     likely_reply: "If we found a case where two frameworks are genuinely incompatible — not just in the sense of having different ontologies, but in a way that one must be false even after clarifying meanings — that would challenge deflationism. But I don't see how that could happen because existence claims are always relative to a framework."
     follow_up: "But what if we discovered that a particular ontological claim has unexpected empirical consequences? For example, if the existence of composite objects turned out to be testable in quantum gravity? Wouldn't that show that the dispute wasn't verbal after all?"
     pressure_type: "meta_level"
     uses_software_analogy: false

   We have 10 questions.

   Now, we write the JSON.
answer: |-
  Here is the structured interview plan in JSON format, designed to progressively challenge the deflationist position while maintaining focus on concrete philosophical tensions:

  ```json
  {
    "guest_position_summary": "The guest defends metaontological deflationism, arguing that disputes about the existence of entities like composite objects, numbers, or persons are often merely verbal. This occurs when disputants operate within different conceptual frameworks with divergent meanings for existence claims. She treats existence questions as internal to a chosen framework rather than having framework-independent answers, emphasizing that ontological disagreements frequently stem from semantic or conceptual differences rather than substantive conflicts about reality.",
    
    "diagnostic_test_summary": "The interoperability test diagnoses merely verbal disputes through four conditions: (1) Observational equivalence: Both sides agree on all observable/predictive consequences; (2) Translational parity: Each vocabulary can map onto the other without explanatory/predictive loss; (3) Schema canonicalization: Dispute persists due to treating one's ontology as default; (4) Decision invariance: No practical, scientific, or normative decisions change when switching ontologies.",
    
    "questions": [
      {
        "order": 1,
        "question": "Your view distinguishes verbal disputes from substantive disagreements. How does your deflationism identify a dispute as 'merely verbal' rather than reflecting a genuine difference in how the world is?",
        "target": "Core mechanism for identifying verbal disputes",
        "likely_reply": "A dispute is verbal when apparent disagreement vanishes upon recognizing that parties are using divergent conceptual frameworks or assigning different meanings to existence claims. Genuine disagreement requires shared semantic frameworks with conflicting claims about mind-independent reality.",
        "follow_up": "But how do we confirm that differences are purely semantic rather than structural? For example, if two scientists agree on particle behavior but disagree on whether 'tables exist,' is that semantic or a deeper metaphysical conflict?",
        "pressure_type": "clarification",
        "uses_software_analogy": false
      },
      {
        "order": 2,
        "question": "Consider the interoperability test's four conditions. Would you accept this as sufficient to diagnose verbal disputes in ontology? If not, which condition is least defensible?",
        "target": "Adequacy of interoperability test",
        "likely_reply": "It captures key aspects but may be overly strict. Translational parity could be problematic—some frameworks might resist lossless translation yet still represent verbal disagreements if they fulfill the other conditions.",
        "follow_up": "If we relax translational parity, what prevents dismissing any disagreement as verbal by claiming 'we just lack the right translation'? Doesn't this risk overgeneration?",
        "pressure_type": "internal_tension",
        "uses_software_analogy": true
      },
      {
        "order": 3,
        "question": "Critics argue quantifier variance reduces ontology to language choice. If existence claims are framework-relative, does this imply there's no fact about what 'really exists'—only which linguistic conventions we adopt?",
        "target": "Implications of quantifier variance",
        "likely_reply": "Not mere convention—framework choice responds to pragmatic, explanatory, or experiential considerations. But these don't track framework-independent truths about existence.",
        "follow_up": "If pragmatic factors govern framework selection, and existence is framework-bound, doesn't this mean the answer to 'Do numbers exist?' depends entirely on our pragmatic goals? Isn't that still reducing existence to instrumental choice?",
        "pressure_type": "internal_tension",
        "uses_software_analogy": false
      },
      {
        "order": 4,
        "question": "Objectors claim deflationism overgenerates: if any dispute can be called verbal by inventing new meanings, doesn't this threaten to make all disagreements verbal—including scientific or moral ones?",
        "target": "Overgeneration objection",
        "likely_reply": "Meaning variance must be plausibly grounded in the disputants' actual usage or theoretical commitments. We can't arbitrarily invent meanings to dismiss disagreements.",
        "follow_up": "But in ontology, meaning differences often emerge precisely to resolve theoretical tensions. Take presentism vs. eternalism: both sides might adjust 'exists' to fit their model. Isn't this just redescribing substantive disagreement as verbal?",
        "pressure_type": "counterexample",
        "uses_software_analogy": false
      },
      {
        "order": 5,
        "question": "How does your view handle disputes where frameworks have different practical/normative consequences? For example, a framework denying systemic racism's existence versus one affirming it might be observationally equivalent regarding raw data but yield divergent policy decisions.",
        "target": "Normative implications of frameworks",
        "likely_reply": "Decision invariance must hold for verbal disputes. If switching frameworks changes normative outcomes, it's substantive. Deflationism doesn't apply to such cases.",
        "follow_up": "But what if both frameworks 'explain' disparities without predictive differences—e.g., one attributes them to biology, another to sociology—while justifying opposite policies? Doesn't your view still label this verbal if we can translationally map their claims?",
        "pressure_type": "counterexample",
        "uses_software_analogy": true
      },
      {
        "order": 6,
        "question": "You distinguish internal questions (within frameworks) from external questions (about framework choice). How can we critically evaluate harmful frameworks—like those denying personhood to certain groups—if criticism requires standing outside all frameworks?",
        "target": "Critique of harmful frameworks",
        "likely_reply": "We critique frameworks pragmatically: by showing their moral costs, empirical inadequacies, or internal inconsistencies—all without appealing to framework-independent existence.",
        "follow_up": "But if a framework is internally consistent and claims 'inferior races don't exist as persons,' doesn't deflationism force us to accept this as a valid internal claim? How is this critique not just imposing another framework?",
        "pressure_type": "internal_tension",
        "uses_software_analogy": false
      },
      {
        "order": 7,
        "question": "Suppose two ontologies fail observational equivalence: e.g., one predicts quantum decoherence where the other doesn't. Does your view imply their dispute must be substantive?",
        "target": "Failure of observational equivalence",
        "likely_reply": "Yes—predictive divergence indicates a substantive disagreement about reality, not just semantic differences.",
        "follow_up": "But what if they later reconcile predictions through framework adjustments? Does the dispute switch from substantive to verbal? Doesn't this make the verbal/subjective distinction epistemically unstable?",
        "pressure_type": "scope",
        "uses_software_analogy": true
      },
      {
        "order": 8,
        "question": "When the interoperability test fails—say, decision invariance doesn't hold—what positive account does deflationism offer for resolving such disputes?",
        "target": "Implications of test failure",
        "likely_reply": "It suggests a substantive disagreement. Resolution then depends on empirical adjudication or pragmatic comparison of framework virtues—but still not discovering framework-independent truths.",
        "follow_up": "If pragmatic virtues (simplicity, coherence) decide framework choice, and these virtues conflict, is that disagreement itself substantive or verbal? Where does the regress stop?",
        "pressure_type": "meta_level",
        "uses_software_analogy": false
      },
      {
        "order": 9,
        "question": "Could you envision any argument or evidence that would falsify metaontological deflationism? What would demonstrate that some existence disputes aren't verbal?",
        "target": "Defeasibility of deflationism",
        "likely_reply": "If we found an ontological disagreement where parties unequivocally shared meanings and frameworks but still disagreed about existence, that would challenge deflationism. But I argue this never occurs.",
        "follow_up": "Suppose neuroscience reveals humans have an innate, cross-cultural concept of 'existence' that's violated in ontological disputes. Would that suggest a framework-independent grounding?",
        "pressure_type": "meta_level",
        "uses_software_analogy": false
      }
    ]
  }
  ```

  ### Key Design Rationale:
  1. **Progressive Pressure**: Starts with clarification, moves to test applicability, then presses on internal tensions (quantifier variance → pragmatism) and overgeneration risks, escalates to moral/political counterexamples, and concludes with falsifiability.
  2. **Countering Deflections**: Follow-ups anticipate common deflationist responses (e.g., appealing to pragmatism or denying applicability to normative cases) and immediately pressure their implications.
  3. **Software Analogies**: Used sparingly (3/9 questions) to ground abstract points without over-relying on the interviewer's background.
  4. **Moral Challenge**: Explicitly ties deflationism to high-stakes social ontology (Q5-Q6), forcing engagement with real-world consequences.
  5. **Falsifiability Focus**: Final question requires specifying what could change her mind, preventing indefinite retreat to "framework-relative" justifications.
  6. **Test Integration**: Questions 2, 5, and 7 directly probe the interoperability test's boundaries and implications for her view.
