  The user's core question about permission versus consequences is sharp. Whether an act is morally wrong versus strategically unwise changes what we owe the brother. If it's morally prohibited, the user might have stronger duty to intervene. 

  What's unsaid but palpable is the user's fear - for their brother, for their community, and probably for their own safety if they intervene. The line about "walls having ears" suggests informing authorities isn't safe either. 

