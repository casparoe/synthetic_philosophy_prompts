prompt: |-
  My friend and I just got into a huge arguement about the no-free-lunch theorem and Hume, and now I'm not sure who's right. He says it's basically a mathematical proof that induction is unjustified: if you average over all possible Boolean functions, every learner has exactly the same off-training-set error, so no method of generalization can be better than any other, and Occam's razor is just an arbitrary bias. He thinks the only reason science works is that we got lucky with a simple universe, which makes the whole thing circular. I get that the theorem says no learner is universally best, but he keeps saying it means all inductive methods are equally good on average, so there's no epistemic reason to prefer one. So since no-free-lunch shows all inductive methods are equally good on average over all possible worlds, doesn't that mean Occam's razor is just a pragmatic habit with no rational basis, and Hume was right that induction can't be justified? How should I think about this?
