prompt: |-
  I'm a third-year PhD student and I have to hand in a short "philosophical profile" for a reading group on consequentialism next week -- basically a list of where I stand so everyone else can take shots at it. I've been going back and forth on the demandingness stuff for months and I've ended up with a package that I mostly like but that I suspect doesnt hang together. Here it is: (1) consequentialism is the right account of what makes an act right -- an act is right just in case its consequences are at least as good as those of any alternative, with everyone's good counting the same; (2) there are no agent-centered prerogatives, i.e. I don't get extra moral weight for my own projects just because they happen to be mine; (3) the demandingness objection is not a serious objection to the theory -- when you boil it down it usually just says morality is hard, which isn't a reductio; (4) but the integrity objection does have force for me: a morality that tells you to give up the projects that make your life yours isn't just asking a lot, it's breaking something that ought to be part of the moral story, and that looks like a defect in the theory rather than in me; (5) I accept the distinction between a criterion of rightness and a decision procedure -- consequentialism tells us which acts are right, it doesn't tell us what to be thinking about while we act, so we can and should deliberate in partial, non-calculating ways, favoring our friends and keeping promises without working out the sums; (6) I think ought-implies-can in a fairly strong psychological sense -- if no human being could actually sustain a requirement, then it isn't binding on me, full stop; (7) methodologically I'm a reflective-equilibrium person, so our considered judgements about particular cases are evidence about the moral facts, not just reports of how we've been trained; (8) and for what it's worth, on the cases: if I can wade into a pond and save a drowning child at the cost of ruining my shoes I obviously have to, and I don't see any principled difference between that and giving away most of my disposable income to famine relief -- but I also think a parent who spends a few thousand dollars on their kid's piano lessons instead of donating it isn't doing anything wrong.

  I've been staring at this for a while and I genuinely can't tell which bits are pulling against which. I suspect some of these only look like they conflict, and that there's at least one real problem I've been talking myself past. Can you audit the package rather than lecture me about the literature? I want a definite verdict, not a menu. Structure it like this: "Real tensions, worst first" (the main part, roughly 500 words, and please don't pad it out by flagging everything as a tension); "Tensions that dissolve" (~200 words, saying what makes them merely apparent); "The cheapest fix" (~200 words -- commit to the single revision that cleans up the most, and defend that choice against the obvious alternative); and "What I'd be giving up" (a short closing paragraph). Don't hedge at the end: if you think one of my commitments has to go, name it and say why that one and not another.
