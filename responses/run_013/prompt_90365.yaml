prompt: |-
  I am a PhD student in philosophy at work on a dissertation about convention and the evolution of norms, and I have a methodological problem I would like your help with.

  For the past year I have been sitting in on the reading group of my supervisor, whose work is squarely in the Lewisian tradition on convention, and I have kept a log of her verdicts on the cases we discuss. I want to reconstruct the rule she is actually running, because her verdicts are the fixed points against which I have been calibrating my own account. The log so far:

  1. Driving on one side of the road rather than the other: a convention.
  2. Using a particular word for a particular kind of object: a convention.
  3. Treating a particular kind of token as money: a convention.
  4. Boarding a bus in the order in which one arrived: a convention.
  5. An individual's private habit of always taking the same route home: not a convention.
  6. A pattern that two strangers happen to hit on in a single encounter, with no expectation of ever meeting again: not a convention.

  That is the entire record. She has never ruled on a case in which a shared regularity is expected of everyone but solves no coordination problem, so the log does not yet discriminate among the accounts I am weighing.

  The new case I would like you to call is this. A practice has emerged in a large, dispersed online community whereby members append a particular short phrase to a message before disagreeing with its author. No one devised it; it spread by imitation of a few high-status early users and is now near-universal. Members expect one another to do it and think slightly less of those who do not; the practice is stable and entirely arbitrary, in that the community could just as easily have settled on a different phrase, or on none at all. But it solves no coordination problem: no one's ability to communicate depends on others' using the phrase, and no one is better off because others use it. Nor is it common knowledge in the technical sense: people conform and expect conformity, but they have never formed any higher-order expectations about what others expect. My supervisor has not seen this case.

  What I want from you is less a verdict than the shape of the reasoning. Give me your best guess at her verdict and at the rule she is running; set out the other rules that fit her six recorded verdicts just as well; say what each of those rules predicts about the new case; say which one you would bet on and why; and name the further case that would most cleanly separate them. Please keep the whole answer to 800 words or fewer.
reasoning: |-
  Okay, let me tackle this philosophical puzzle step by step. The user is a PhD student in philosophy working on convention and norm evolution, trying to reverse-engineer their supervisor's implicit rule for identifying conventions based on six existing verdicts. The core challenge is applying this to a new case about an arbitrary online communication practice.

  First, I need to analyze the six fixed verdicts to identify common patterns. Cases 1-4 are clearly conventions (driving side, language, money, queuing), while 5-6 are not (private habit, transient pattern). The Lewisian framework seems central here - coordination problems and mutual expectations appear key. 

  Looking deeper at Lewis's theory: conventions solve coordination problems where agents have common interests and preferences for conformity. The online phrase case lacks this - it's arbitrary and normative but doesn't resolve coordination issues. Still, it has mutual expectations and social enforcement, which might push it into convention territory under some interpretations.

  I consider three possible rules that fit the initial six cases:
  1) Strict Lewisian: requires coordination problem + mutual expectations
  2) Normative Lewisian: adds normative expectations/pressure
  3) Expectation-Focused: drops coordination requirement, keeps mutual expectations + stability

  For the online case, these yield different predictions: Strict Lewisian says no (no coordination), others say yes. The supervisor's emphasis on expectations in the log suggests she might lean toward the Normative Lewisian view. 

  The cleanest test case would be a norm with mutual expectations and social enforcement but no coordination problem - like the online case itself. If she calls it convention, she's likely using Rule 2; if not, Rule 1. 

  I'd bet on Rule 2 prevailing because the supervisor seems sensitive to normative elements in her past rulings (e.g., queuing). The online case's social enforcement through esteem loss mirrors her verdicts on cases 2-4.
answer: |-
  Based on your supervisor's Lewisian framework and recorded verdicts, here's the reasoning structure, potential rules, predictions for your case, and a discriminating test:

  **Her Likely Rule & Verdict:**
  *   **Best Guess at Her Rule:** A convention requires: (1) A *regularity in behavior* within a population; (2) *General conformity* to that regularity; (3) *Mutual expectations* of conformity (each expects others to conform); (4) A *preference* for conformity *conditional* on the conformity of others (i.e., it solves a coordination problem); (5) *Arbitrariness* (another regularity could have served the same coordination purpose).
  *   **Justification:** This classic Lewisian definition fits all 6 cases perfectly:
      *   Cases 1-4: Clear coordination problems (avoid collisions, communicate, establish medium of exchange, avoid conflict in boarding) solved by the regularity, with mutual expectations and arbitrariness.
      *   Case 5: No mutual expectations (private habit).
      *   Case 6: No mutual expectations (single encounter, no future) and no stable regularity.
  *   **Prediction for Online Phrase:** **Not a convention.** While it satisfies (1) regularity, (2) general conformity, (3) mutual expectations, and (5) arbitrariness, it **fails (4)**: There's no *coordination problem* being solved. No one's success in communicating disagreement depends on others using the phrase; it doesn't coordinate actions to avoid conflict or achieve a mutually beneficial outcome. The preference for conformity stems from social esteem/norm enforcement, not coordination dependence.

  **Alternative Rules Fitting the 6 Cases:**
  1.  **Rule A (Strict Lewisian):** As above. Requires coordination problem.
  2.  **Rule B (Normative Lewisian):** (1) Regularity; (2) General Conformity; (3) Mutual Expectations *of conformity as appropriate/expected* (potentially weaker than full Lewisian mutual belief); (4) *Normative Force* (belief it *should* be followed, criticism/pressure for deviation); (5) Arbitrariness. *Drops the strict coordination problem requirement, emphasizes normative expectations.*
      *   **Fits Cases:** 1-4 clearly have normative force. Case 5 lacks mutual expectations. Case 6 lacks stable regularity and normative expectations beyond the single instance.
      *   **Prediction for Online Phrase:** **Convention.** It has regularity, conformity, mutual expectations of use (as appropriate), normative force (esteem loss for non-use), and arbitrariness.
  3.  **Rule C (Expectation-Focused):** (1) Regularity; (2) General Conformity; (3) Mutual Expectations of conformity; (4) Arbitrariness; (5) *Stability* (persists over time/repeated interactions). *Drops both coordination problem and strict normative force.*
      *   **Fits Cases:** 1-4 have mutual expectations and stability. Case 5 lacks mutual expectations. Case 6 lacks stability.
      *   **Prediction for Online Phrase:** **Convention.** It has regularity, conformity, mutual expectations, arbitrariness, and stability.

  **Bet & Why:**
  *   **Bet:** She uses **Rule A (Strict Lewisian)** and would say **Not a Convention**.
  *   **Reasoning:** Her work is "squarely Lewisian." Lewis's core innovation was defining convention via coordination equilibria. Cases 1-4 are textbook coordination problems. Cases 5 & 6 fail on fundamental Lewisian prerequisites (mutual expectations, population-level regularity). The online case's lack of a coordination problem is precisely the gap your log hasn't tested yet, suggesting it's the key discriminator she implicitly relies on. While norms and esteem are important (Rule B), Lewisians often treat them as downstream *results* of conventions solving coordination problems, not the defining feature itself. Rule C seems too weak, potentially classifying mere stable customs without the strategic interdependence Lewis emphasized.

  **Discriminating Case:**
  *   **The Case:** A widespread, stable, arbitrary norm of politeness: e.g., always saying "Gesundheit" after a sneeze in a community. Everyone expects others to do it, thinks less of those who don't (normative force), it's arbitrary, and it's stable. Crucially, **it solves no coordination problem.** No one's action needs coordinating with others to achieve a goal (like avoiding collision); it's purely expressive/symbolic.
  *   **Why it Separates:**
      *   **Rule A (Strict Lewisian):** **Not a Convention.** Fails the coordination problem requirement.
      *   **Rule B (Normative Lewisian):** **Convention.** Satisfies regularity, conformity, mutual normative expectations, normative force, arbitrariness.
      *   **Rule C (Expectation-Focused):** **Convention.** Satisfies regularity, conformity, mutual expectations, arbitrariness, stability.
  *   **Your Online Case** already serves this discriminatory function against Rule A. The "Gesundheit" case is simply a clearer, more universal real-world analogue, removing the online context as a potential confound. Presenting both strengthens the test.

  **Conclusion:** Your supervisor's unrecorded fixed point is likely the strict coordination requirement. The online case probes this boundary directly. Her verdict will reveal whether she adheres rigidly to Lewis's core mechanism or allows normative force *without* coordination to suffice. The "Gesundheit"-type case provides a decisive test between the rules fitting her prior data.
