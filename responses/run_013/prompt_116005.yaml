  Ah, that's a point. The primary goods index is measured at a point in time, but behind the veil, parties care about their lifetime prospects. If a policy boosts income now but causes a recession later, the lifetime income of the least advantaged might be lower. But the user said the policy maximizes primary goods for the least advantaged—presumably at the time. If we consider lifetime maximization, then the policy might not actually maximize it. However, the case needs the policy to technically maximize primary goods at the point of assessment. Perhaps the government assesses the policy at a snapshot, showing higher income, but the veil parties look at the entire life course. This could be the extension: the veil parties consider the stability and sustainability of primary goods over a lifetime, not just a static point. 

  So, scenario: A resource dividend policy. A country sells drilling rights on public lands, using revenues to fund a universal basic income, raising the minimum income significantly. However, economists predict the fund will deplete in 15 years, causing a sharp economic downturn. Current least advantaged individuals enjoy higher incomes, but their lifetime prospects are worse due to the impending crash. The government's assessment focuses on current primary goods, showing maximization. But behind the veil, parties reject it because they care about their whole lives. They would prefer a sustainable policy with slightly lower but stable income. 

