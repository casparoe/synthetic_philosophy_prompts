  Okay, the user is a novelist working on a book and needs a case where a minister's Rawlsian defence of a policy is demolished in argument. Specifically, they want a scenario where parties behind the veil of ignorance would reject a policy that actually maximises primary goods for the least advantaged, without relying on envy, risk-aversion, or violating first principles. It has to be plausible for a modern government, no sci-fi.

  First, I need to recall Rawls' principles. The difference principle allows inequalities only if they benefit the least advantaged. The veil of ignorance ensures impartiality—parties don't know their place in society. The challenge is to find a policy that technically maximizes primary goods but is rejected for reasons internal to the veil of ignorance.

