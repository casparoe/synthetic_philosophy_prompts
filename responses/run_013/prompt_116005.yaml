  Wait, the user said "maximise the primary goods," so the policy must indeed increase the total index. The rejection must come from elsewhere. Maybe the veil parties consider the stability of the society. If the policy leads to social unrest, even if primary goods are higher, the system might collapse. Rawls does discuss stability in "A Theory of Justice." Parties want a society that can endure. So a policy that maximizes goods now but risks future instability might be rejected.

