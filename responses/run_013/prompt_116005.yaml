  This is tricky. Perhaps the issue is that the policy undermines the social bases of self-respect by creating a perception of second-class citizenship. Even if income is higher, if the least advantaged are stigmatized, their self-respect suffers. Self-respect is a primary good, so if the policy reduces it, then the overall index isn't maximized. But the user said the policy does maximize primary goods. So maybe the case must assume that self-respect isn't diminished, or find another angle.

