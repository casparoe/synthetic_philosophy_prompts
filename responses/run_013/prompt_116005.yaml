  Perhaps a policy that increases income but erodes social bases of self-respect. Self-respect is a primary good. If the policy creates stigmatization or dependence, it could undermine self-respect even if material goods increase. For instance, a welfare program that provides higher benefits but requires humiliating conditions. The least advantaged have more goods but less self-respect. The veil parties might reject this because self-respect is crucial for pursuing a conception of the good, which they value regardless of their position.

