answer: |-
  ### Case Construction  
  **Scenario:** A government proposes selling extraction rights for a finite public mineral reserve, using all revenues to fund an immediate cash transfer exclusively to the least advantaged quintile. This raises their current income above any alternative policy (e.g., sovereign wealth funds or gradual redistribution). However, the windfall is non-recurring and exhaustible within 10 years. Post-depletion, the economy contracts due to lost revenue, automation displaces unskilled labour, and the least advantaged face permanent 20% income reductions. Primary goods (income/wealth) are maximised *at the point of assessment* but collapse thereafter.  

  **Extension:** Parties evaluate policies over a *complete life* rather than a static snapshot. This aligns with Rawls’ stipulation that individuals behind the veil assess "life prospects" (e.g., *Theory of Justice* §11: "expectations for the course of a complete life").  

  ---

  ### Reasoning  
  **Minister’s Difference Principle Defence:**  
  *"The policy maximises primary goods for the least advantaged now. Their cash transfer is £15,000 annually versus £12,000 under alternatives. This satisfies the difference principle: no other arrangement improves their position. Concerns about future instability are speculative or conflate primary goods with subjective well-being."*  

  **Veil of Ignorance Rejection:**  
  1. **Ignorant of temporal position:** Parties do not know if they will be born *during windfall* or *post-collapse*.  
  2. **Lifetime expectations:** A policy granting high short-term goods but severe long-term losses risks placing someone in the worst-off cohort *over their lifetime*. Post-collapse least-advantaged individuals suffer £9,600 annually (vs. £12,000 under sustainable policies).  
  3. **No irrational risk-aversion:** Rejection stems not from fearing risk but from predictable, irreversible harm to life prospects. Choosing sustainability avoids *guaranteeing* a cohort’s catastrophic decline.  
  4. **Primary goods focus:** The critique addresses income/wealth stability—core primary goods—not conceptions of the good.  

  **Key Feature:** *Time-limited benefit guaranteeing irreversible collapse*.  
  - **If removed (e.g., windfall is sustainable):** The rejection dissolves. The policy would then genuinely maximise lifetime primary goods.  

  ---

  ### Rawlsian Reply and Rebuttal  
  **Strongest Reply:**  
  *"Rawls explicitly defines the least advantaged by lifetime expectations (*Theory* §12: ‘over the whole life’). The minister’s static assessment misapplies the difference principle. A proper lifetime analysis shows this policy *fails* to maximise the least advantaged’s position."*  

  **Does It Succeed?**  
  - **Yes**, textually: Rawls consistently frames expectations in terms of "life prospects" (e.g., §13: "mobility over generations").  
  - **But contested:** Some scholars (e.g., Pogge) argue Rawls focuses on *current* worst-off to avoid intertemporal vagueness.  
  - **Outcome:** The reply succeeds on mainstream readings, exposing the minister’s error. The demolition works by revealing the policy’s lifetime harm—already prohibited by a strict interpretation of the difference principle.  

  ---

  ### Summary for Narrative Use  
  **Settled:** Rawlsian parties assess lifetime prospects; static snapshots violate the framework.  
  **Disputed:** Whether "least advantaged" must be defined cross-sectionally (rare) or generationally (standard).  
  **Dramatic Note:** The minister’s error stems from conflating immediate gains with enduring justice—a hubris your protagonist can exploit.  

  *[British English: spellings/terms verified]*
