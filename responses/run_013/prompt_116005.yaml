  Rawls has fair equality of opportunity and the difference principle. Economic inequalities are allowed if they benefit the least advantaged. But if the policy allows monopolies, it might violate fair equality of opportunity because new entrants can't compete. The user specified no violation of fair equality. So that's a problem. 

