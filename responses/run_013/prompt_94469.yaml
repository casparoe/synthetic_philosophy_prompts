prompt: |-
  I teach an upper-level undergraduate seminar on philosophy of mind and religion, and I want one 90-minute session that makes about 18 students feel the force of Ayer's position on life after death — specifically the claim that the belief in survival after the death of the body, in the form it is usually held, is not a genuine hypothesis, because we lack a criterion of personal identity that could be applied across the gap. I want them to run into the problem themselves: that the difficulty is not a shortage of evidence but the absence of any specification of what would count as evidence either way. Ayer had a near-death experience late in life, after which he reported a red light and a presence he took to be responsible for the universe, and he still refused to treat the episode as establishing survival; I want that refusal to feel like the honest response rather than a stubborn one.

  Design a runnable activity for the session. The rules, roles, or incentives should arrange things so that the students construct criteria of personal identity, apply them to cases of apparent survival, and then discover for themselves that their criteria either collapse into bodily continuity, or become so permissive that they cannot distinguish survival from ordinary psychological change, or have no independent test. They should reach the impasse before anyone names Ayer or his position.

  Please include:

  - The setting and a timed sequence for the session.
  - The rules, roles, and materials, including any case cards, handouts, or scoring sheets written out so I can use them directly.
  - At least four cases: one near-death experience of the kind Ayer had; one claim of reincarnation or mediumship; one case of gradual or partial continuity (such as brain replacement, fission, or a slow change of character and memory); and one case in which the only evidence is testimony from a single person.
  - A debrief that maps particular moments in the activity onto the structure of Ayer's argument, including the distinction between saying that survival is false and saying that it is not a genuine hypothesis.
  - An honest account of what will predictably go wrong the first time I run it, and how to handle it.
  - A frank note on which feature of Ayer's view the activity cannot reproduce and that I will have to supply myself.

  The students should not read anything in advance, and the answer should not include quotations from Ayer or from secondary literature. Please write your answer in British English.
reasoning: |-
  We are designing a 90-minute session for 18 students to explore A.J. Ayer's critique of the belief in life after death. The core idea is that without a criterion of personal identity that can be applied across the gap of death, the belief in survival is not a genuine hypothesis. We want students to experience the problem of lacking a criterion and then see that without one, we cannot even specify what would count as evidence.

  The activity will be structured as a group exercise in which students generate criteria for personal identity and then apply them to four cases. We aim for them to discover that their criteria either (a) collapse into bodily continuity (which is interrupted by death), (b) become too permissive (so that ordinary psychological changes might count as survival), or (c) lack an independent test (so we cannot verify survival). The activity should lead them to the impasse before introducing Ayer.

  **Structure of the Session (90 minutes):**

  1. **Introduction (10 mins):** Set the stage without mentioning Ayer. Present the question: "How could we know if someone has survived the death of their body?" Explain that we will explore by trying to define what would count as evidence.

  2. **Group Formation and Criteria Generation (15 mins):** Divide the class into four groups (about 4-5 students per group). Each group is given the task: "Define a criterion for personal identity that could be used to determine whether a person who has died has survived in some form. Your criterion must be something that we could, in principle, test." They write their criterion on a poster or large sheet of paper.

  3. **Case Application (30 mins):** Each group receives a packet with four case cards (each describing a scenario). They must apply their criterion to each case and decide: does this case show survival? They record their answers and reasons for each case.

  4. **Group Rotation and Critique (20 mins):** Groups rotate to another group's poster (with their criterion and case responses). They must critique the criterion: does it work? They look for problems (e.g., too permissive, too strict, no independent test). They write their critique on sticky notes and attach them.

  5. **Whole Class Discussion (10 mins):** Bring the class together. Ask: "What problems did we run into? Did any criterion work for all cases? Why or why not?"

  6. **Debrief and Introduction of Ayer (5 mins):** Explain that they have encountered a problem that A.J. Ayer raised: without a clear criterion of identity that can cross the gap of death, we cannot even say what evidence would count for or against survival. Note that Ayer had a near-death experience but still refused to count it as evidence for survival because he lacked such a criterion.

  **Materials:**

  1. **Group Posters:** One per group, with space for:
     - Group name/number
     - Their criterion for personal identity (written in marker)
     - A grid for the four cases (with columns: Case | Survival? | Reason)

  2. **Case Cards (four per group, each describing one scenario):**
     - **Case 1 (Near-death experience):** "Pat dies on the operating table. Doctors revive Pat after 10 minutes. Pat reports floating above the body, seeing a bright red light, and feeling the presence of a being responsible for the universe. Pat feels changed by the experience but has no specific new knowledge (e.g., of events during the operation that they couldn't have known)."
     - **Case 2 (Reincarnation/Mediumship):** "A child, Sam, claims to be the reincarnation of a woman who died 50 years ago. Sam provides specific details about the woman's life that are later verified. A medium also claims to channel the same woman and provides additional accurate details that were not public."
     - **Case 3 (Gradual Change):** "Alex undergoes a gradual brain replacement over 10 years (each part replaced by an artificial neuron that functions identically). After the replacement, Alex has the same memories and personality. But then, over the next 10 years, Alex's personality and values slowly change until they are very different from the original Alex."
     - **Case 4 (Testimony Only):** "Taylor dies. A stranger, Jordan, appears and claims to be Taylor, now in a new body. Jordan says that during the afterlife, Taylor's mind was transferred to this new body. Jordan provides no verifiable evidence (such as private memories) but sincerely insists they are Taylor."

     (Each case card should be on a separate sheet.)

  3. **Critique Materials:** Sticky notes and pens for the rotation phase.

  **Rules and Roles:**

  - Groups must define a criterion that is testable (in principle).
  - During the case application, they must apply their criterion consistently to all four cases and record their reasons.
  - During the rotation, groups are assigned to critique a different group's work. They should look for:
     - Does the criterion collapse into requiring the same body? (Then it cannot survive death.)
     - Does the criterion allow for too much? (e.g., if psychological continuity is the criterion, then Case 3 might be survival even when the person changes completely, which seems wrong.)
     - Is there no way to independently test the criterion? (e.g., in Case 4, if we rely on testimony, how do we know it's not a delusion or lie?)

  **Predictable Problems and Handling:**

  1. **Problem:** Students may not generate criteria that are sufficiently distinct or might fixate on one type (e.g., only psychological).  
     **Handling:** Have a list of prompts ready: e.g., "Could it be based on memories? On the soul? On the body? On a combination?" Encourage diversity.

  2. **Problem:** Groups might not see the flaws in their own criteria.  
     **Handling:** The rotation phase is key. The critiquing group will likely spot the problems. Also, during the whole class discussion, you can highlight conflicting judgments.

  3. **Problem:** The discussion might get stuck on one case or one criterion.  
     **Handling:** Keep time strictly. Move groups along. In the whole class discussion, focus on patterns across groups.

  4. **Problem:** Students may not see the connection to Ayer's point.  
     **Handling:** In the debrief, explicitly map their struggles to Ayer's argument. Point out that in each case, they were trying to find a criterion and ran into one of the three problems (collapse, permissiveness, or untestability). Emphasize that Ayer's near-death experience (Case 1) did not provide a criterion, so he refused to accept it as evidence.

  **Debrief (Mapping to Ayer):**

  - Explain that the activity recreated Ayer's challenge:  
    1. **The demand for a criterion:** Without a criterion, we cannot even start to look for evidence.  
    2. **The three problems they encountered:**  
       - *Bodily collapse:* If the criterion requires the same body, survival is impossible by definition.  
       - *Permissiveness:* If we use psychological continuity, then ordinary changes (like in Case 3) might count as survival, but that seems too broad.  
       - *No independent test:* In Case 4, without verifiable evidence, we have no way to check.  
    3. **The distinction between false and not a genuine hypothesis:** Ayer does not say survival is false. He says that until we have a criterion, the belief is not even a testable claim. Therefore, it is not a genuine hypothesis.  
    4. **Ayer's near-death experience:** He had an experience (like Case 1) but because it did not provide a criterion for how to verify that the person in the experience was *him*, he refused to take it as evidence for survival. His refusal was honest because without a criterion, the experience could be just a hallucination.

  **What the Activity Cannot Reproduce:**

  The activity cannot fully convey Ayer's *verificationist* background. For Ayer, a statement is meaningful only if it is either analytic (true by definition) or empirically verifiable. The belief in survival fails the verificationist criterion of meaning because we cannot specify what would verify it. The activity focuses on the problem of criteria, but the deeper verificationist principle (which grounds the criticism) will have to be explained by you. You might say: "Ayer's point is rooted in a broader view: for any claim to be meaningful, we must be able to say what would count as evidence for or against it. Without that, the claim is not even false; it's meaningless."

  **Final Note:** Avoid naming Ayer until the debrief. The cases are designed to cover the key challenges. The activity should build a shared experience of the problem so that when you introduce Ayer, it feels like a natural conclusion.

  Here is the text for the handouts:

