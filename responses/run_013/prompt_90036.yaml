answer: |-
  ### The View, Restated
  Your core objection to dynastic wealth centers on the "private exit": inherited wealth allows heirs to permanently detach from societal obligations (work, taxes, civic participation) that bind others. This isn't primarily about unfair starts ("equal opportunity") but about severing reciprocity. Thus, heavy inheritance taxation is justified not for revenue or punishing the dead, but to prevent this exit from being purchasable. The estate tax becomes a tollbooth on the private escape route.

  ---

  ### Fatal If True (Empirical & Conceptual Blows)
  1.  **Heirs Don't Actually Exit:** Data consistently shows most large inheritors remain economically active. They work (often in managing wealth), pay significant taxes (income, capital gains, property), participate in philanthropy and civic life, and rely on public infrastructure. True "exit" (complete withdrawal) is rare. If heirs mostly stay *in* the web, the core premise collapses.  
  2.  **Exit Doesn't Require Inheritance:** A self-made billionaire can exit far more decisively than a modest heir. "Exit capacity" correlates with absolute wealth, not its origin. Taxing inheritance harder than earned wealth creation doesn't effectively target the exit problem – a wealth tax or high progressive income/consumption taxes would be more directly relevant. The focus on inheritance is misplaced.  
  3.  **Proves Too Much (Conceptual Overextension):** If *any* sufficient wealth enables exit, your logic condemns not just inherited wealth, but all significant wealth accumulation. This leads towards radical egalitarianism or anti-capitalism, which may not be your intent. Your "opt-out" objection loses its specificity to *inheritance*.

  ---

  ### Awkward but Survivable (Design & Nuanced Challenges)
  1.  **Why Target the *Estate*, Not the Recipient?** If the harm is the heir's exit capacity, why tax the *transfer* (estate tax) rather than the heir's *lifetime* receipt of wealth (inheritance tax) or their *ongoing* wealth (wealth tax)? An estate tax is a clumsy tool for the stated goal. Your allies would concede this.  
  2.  **Collapse into Republicanism/Domination?** Does the "exit" harm stem from the heir's *freedom from dependence* on others (republican non-domination) or the *threat* their detachment poses to social cohesion? If the former, it's a broader worry about concentrated power; if the latter, it risks conflating harm with mere non-participation. Is the heir's quiet exit *itself* harmful, or only if it enables domination? This ambiguity weakens the distinctiveness of the "opt-out" frame.  
  3.  **The "Web" Has Holes:** Is the "web of mutual obligations" truly universal? Do trust fund kids *really* depend less on public roads, police, or stable markets than a middle-class worker? Some dependence remains inescapable, blurring the exit line. Your allies might argue the *degree* of dependence and the *freedom from labor coercion* are key differences.

  ---

  ### What My Own Side Gives Up
  Your natural allies (progressive wealth/estate tax advocates) would likely concede:
  1.  **Equal Opportunity Isn't Irrelevant:** They'd agree your "exit" concern is distinct and valuable, but not the *only* important objection. Equality of opportunity remains a core justification alongside preventing oligarchy.  
  2.  **The Estate Tax Isn't the Perfect Tool:** They'd admit that a well-designed inheritance tax (on recipients) or robust wealth tax would better target the "exit capacity" of *heirs* than the current US-style estate tax.  
  3.  **"Opting Out" Isn't the Sole Harm:** They'd maintain that the unfair starting-line advantage and the potential for dynastic power concentration remain independent, powerful arguments.

  ---

  ### Insulation Check
  Your view **absorbs many counterexamples** through normative conviction:
  *   Heirs work? *"They work by choice, without the material necessity binding others."*
  *   Self-made wealth exits too? *"Yes, but preventing dynasties prevents *permanent*, *multi-generational* exits detached from any contribution."*
  *   Why not tax all wealth? *"Inherited wealth is uniquely problematic because it represents unearned, perpetual detachment."*
  *   Is exit *inherently* bad? *"Yes, if society depends on reciprocity; non-participation while consuming the baseline is parasitic."*

  **This insulation is both a strength (coherent normative core) and a risk.** It risks circularity: "Exit is bad because it breaks obligations; breaking obligations is bad because it enables exit." It becomes a foundational value claim about the necessity of universal participation under material constraint. While logically coherent, it struggles empirically and may alienate those valuing negative liberty or seeing non-participation as benign.

  ---

  ### Bottom Line
  Your "opt-out" objection is a powerful, distinct normative critique of dynastic wealth, emphasizing social reciprocity over equal starts. Its fatal flaw is empirical: most heirs don't truly exit. Its conceptual strength becomes a vulnerability when applied *solely* to inheritance, as earned wealth enables similar exits. The view survives most counterarguments through normative insistence, but at the cost of empirical precision and broad appeal. It's a provocative lens, not a complete policy blueprint.
