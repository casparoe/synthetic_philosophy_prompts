answer: |-
  ### Project Proposal: The Causal Purchase of Symbolic Patterns in Mechanistic Systems  

  #### **Title**  
  Pattern-Sensitivity as Causal Anchor: Resolving Symbolic Efficacy in Substrate-Determined Systems  

  #### **Abstract** (150 words)  
  This project tackles a foundational puzzle in philosophy of mind and complex systems: Can symbolic descriptions causally explain system behavior when the underlying dynamics are fully determined by simple micro-interactions? Using a toy model (a "careenium" sphere populated by colliding "simmballs"), I argue that the question "Do symbols do causal work?" is under-specified. It conflates *external descriptive overlays* with *intrinsic pattern-sensitivity*—where subsystems respond to macro-patterns, not just micro-states. I develop an interventionist criterion for causal purchase: Macro-patterns have efficacy if interventions on them (preserving micro-dynamic *types*) robustly alter macro-outcomes across micro-realizations. This conceptual method avoids reductionist stalemates by identifying when patterns become non-redundant causal levers. Success yields a test for when symbolic explanations are substantive; failure occurs if macro-interventions collapse into micro-specifications. The outcome reframes mental causation around architectural realizability.  

  ---

  ### 1. **Precise Problem Statement**  
  The careenium model illustrates a tension: Simmballs interact only via contact physics, yet the system admits a symbolic narrative (e.g., "symbols are compared"). This invites the question: *When the careenium's macro-behavior (e.g., a "decision") correlates with symbolic operations, do the symbols play a causal role?* Two standard answers fail:  
  - **Reductive physicalism** ("Only simmballs push"): Dismisses symbols as *explanatory fictions* but ignores subsystems that detect patterns (e.g., a simmball-configuration acting as a comparator).  
  - **Non-reductive emergentism** ("Symbols have downward power"): Posits novel causal powers without specifying *how* macro-patterns interface with micro-dynamics.  
  The core gap: Both treat "symbolic causation" monolithically, obscuring a key distinction—between **externally imposed descriptions** (irrelevant to causation) and **intrinsic pattern-sensitivity** (where subsystems *use* patterns as inputs). The question is open because neither account operationalizes this divide.  

  #### **Why the Obvious Positions Leave It Open**  
  - Physicalism focuses on micro-closures, neglecting that pattern-sensitive substructures can make macro-patterns *difference-makers*.  
  - Emergentism invokes autonomy but lacks criteria to distinguish "real" pattern-sensitivity from epistemic convenience.  
  Result: We cannot discern if symbols are "doing work" in the careenium or just in our stories.  

  ---

  ### 2. **Method: Conceptual Interventionism**  
  I propose an interventionist criterion for **causal purchase**:  
  > *A macro-pattern (e.g., a symbolic state) has causal efficacy iff there exist well-defined interventions that:*  
  > *(a) Alter the macro-pattern while holding fixed the* type *of micro-dynamics (e.g., modify a "symbol" without changing collision physics),*  
  > *(b) Change macro-outcomes (e.g., system "decisions"), and*  
  > *(c) Yield consistent results across distinct micro-realizations of the same pattern (robustness).*  

  **Why this method?**  
  - **Addresses the under-specification**: It explicitly tests for *intrinsic* pattern-sensitivity (e.g., a careenium region that triggers different behaviors when a symbolic pattern changes, regardless of *which* simmballs instantiate it).  
  - **Advantages over alternatives**:  
    - *Vs. supervenience*: Supervenience (e.g., Davidsonian anomalism) establishes dependence but not efficacy; interventions test causal leverage.  
    - *Vs. computationalism*: Treating the system as abstract computation (e.g., Fodor) assumes symbols are causal by fiat; interventions ground this in realizability.  
    - *Vs. dynamical systems*: Focusing on attractors (e.g., van Gelder) ignores discrete symbolic operations; interventions handle both.  
  **Process**: Construct careenium variants (conceptually/computationally) to isolate when macro-interventions satisfy (a)–(c). For example:  
  - *Pattern-sensitive variant*: A "comparator" substructure (e.g., a ring of simmballs configured to react only to specific pattern-arrivals).  
  - *Pattern-insensitive variant*: All behavior is micro-linear (e.g., outcomes fixed by initial collisions).  

  ---

  ### 3. **Work Plan (12 Months)**  
  - **Months 1–2**: Refine criterion; formalize "macro-intervention" (e.g., Woodward-inspired) and "robustness" (invariance under micro-equivalence classes).  
  - **Months 3–4**: Build careenium case studies: pattern-sensitive vs. insensitive architectures. Use minimal computational models (e.g., cellular automata) to illustrate.  
  - **Months 5–6**: Test criterion on borderline cases (e.g., chaotic systems; near-decomposable structures). Identify when robustness holds/fails.  
  - **Months 7–8**: Compare to real-world analogs (e.g., neural pattern-completion vs. atomic physics; DNA transcription).  
  - **Months 9–10**: Analyze failure modes: When do macro-interventions covertly require micro-specification?  
  - **Months 11–12**: Synthesize framework; draft paper.  

  ---

  ### 4. **Expected Outcomes and Failure Conditions**  
  #### **Real Result**  
  A positive result shows that:  
  - Macro-patterns have causal purchase *if* the system contains pattern-sensitive substructures (e.g., the careenium’s "comparator").  
  - Efficacy is verified when interventions on patterns (e.g., flipping a "symbol") reliably alter outcomes across micro-variants.  
  This implies symbolic explanations are *architecturally grounded*, not just descriptive.  

  #### **Failure**  
  The project fails if:  
  - **Macro-interventions collapse into micro-specifications** (e.g., changing a "symbol" *only* works if we control exact simmball positions—no robustness).  
  - **Robustness is trivial or impossible** (e.g., pattern-sensitivity reduces to micro-properties in all plausible architectures).  
  *Mitigation*: By Month 6, we test toy models for collapse; if found, we refine or reject the criterion.  

  #### **Scope**  
  Focused on conceptual clarity, not empirical claims. Real-world applications (e.g., cognitive science) are illustrative, not primary.  

  ---

  ### 5. **Response to "Is This Just Mental Causation?"**  
  "This project reframes mental causation by replacing debates over supervenience/intentionality with a testable *causal-purchase criterion*. Unlike traditional approaches, it asks: *What architectures allow macro-patterns (e.g., beliefs) to be levers for intervention?* It shifts focus from 'Do mental properties exist?' to 'When do patterns become reliable causal nodes?'—grounding the discussion in realizability, not dualism or eliminativism."  

  --- 

  ### **Deliverables**  
  - A paper defining the criterion and applying it to the careenium.  
  - Framework for evaluating symbolic efficacy in mechanistic systems.  
  - Fellowship report with implications for philosophy of mind.  

  **Word Count**: ~900 (fits two pages with references).  
  **Citations to Add**: Woodward (causation), Dennett (real patterns), Fodor (symbols), Craver (mechanisms).
