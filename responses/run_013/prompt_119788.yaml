  We are going to structure the proposal as follows:

  1. **Title and Abstract**: A concise summary of the project.
  2. **Introduction and Problem Statement**: The careenium thought experiment and the two interpretations of symbolic causation.
  3. **Research Question**: Precise statement of the question and why existing positions leave it open.
  4. **Methodology**: Conceptual analysis and the macro-intervention criterion.
  5. **Work Plan**: Month-by-month breakdown for one year.
  6. **Expected Outcomes and Risks**: What a real result would look like and what would count as failure.
  7. **Relation to Mental Causation Debate**: How this project differs.

  Let's go step by step.

  ---

  **Title**: The Causal Purchase of Symbols: A Macro-Interventionist Approach to Pattern-Sensitive Systems

  **Abstract** (150 words): This project investigates the causal status of symbolic descriptions in complex systems, using a thought experiment of a "careenium" — a sphere containing countless simple colliding particles ("simmballs"). The central question is whether symbolic patterns can be said to exert causal influence, or whether all causation is reducible to micro-level collisions. I argue that the question is under-specified: it conflates two distinct interpretations of "symbolic causation." The project develops a criterion for causal purchase at the macro level — the existence of well-defined macro-level interventions that affect macro-outcomes across different micro-realizations. This conceptual approach moves beyond the stalemate between reductive physicalism and non-reductive emergentism by focusing on the conditions under which macro-patterns become robust causal relata. The outcome will be a framework for evaluating when symbolic descriptions are not merely explanatory glosses but capture pattern-sensitive causal structures.

  ---

  **1. Introduction and Problem Statement**

  The careenium thought experiment (inspired by discussions in philosophy of mind and complex systems) consists of a sphere (the careenium) containing millions of inert particles (simmballs) that interact solely through elastic collisions. Despite the simplicity of its micro-dynamics, the system can be described as performing symbolic operations (e.g., storing and comparing patterns). This invites the question: when the careenium "decides," do the symbols play a causal role? 

  Two common responses are inadequate:
  - **Reductive physicalism**: Only the simmballs and their collisions do causal work; the symbolic description is an epistemic overlay.
  - **Non-reductive emergentism**: The system exhibits novel causal powers at the macro level, but without specifying how these powers are anchored in the micro-dynamics.

  Both positions leave open a key distinction: is the system's behavior driven *only* by micro-causal chains, or are there macro-scale parts that are *sensitive to patterns*? Without this distinction, the debate remains intractable.

  ---

  **2. Research Question**

  *Precisely: Under what conditions can a macro-pattern (e.g., a symbolic configuration) in a system with micro-determined dynamics be said to have causal purchase, such that interventions on the pattern (while holding fixed the micro-dynamics *type*) yield changes in macro-outcomes?*

  This formulation avoids two dead ends:
  - It rejects the idea that symbols are *merely* descriptive (by demanding a causal difference-maker role).
  - It avoids positing mysterious "downward causation" by requiring that pattern-sensitivity be implemented via micro-structures that detect patterns.

  The question is open because neither reductive nor emergentist accounts specify how pattern-sensitivity emerges or how to test for it.

  ---

  **3. Methodology**

  The project uses conceptual analysis grounded in interventionist theories of causation (e.g., Woodward 2003). The core criterion is:

  > *A macro-pattern **M** has causal purchase if there exist interventions on **M** that:*
  > *a) Are well-defined at the macro level (e.g., altering a symbol while preserving micro-dynamic laws),*
  > *b) Alter macro-outcomes **O** (e.g., the system's "decision"), and*
  > *c) Are robust across different micro-realizations of **M** (i.e., the same change in **M** implemented in different micro-ways yields the same change in **O**).*

  This approach is chosen over alternatives because:
  - **Compared to supervenience-based approaches**: It doesn't just assert that macro-properties supervene on micro-properties; it tests whether macro-variations have causal consequences.
  - **Compared to computationalism**: It doesn't presuppose that the system implements a computation; it asks when patterns become causal relata.
  - **Compared to dynamical systems theory**: It focuses on discrete symbolic patterns rather than continuous attractors.

  The method involves refining the criterion, applying it to toy models (e.g., variations of the careenium), and assessing implications for real-world systems (e.g., neural networks).

  ---

  **4. Work Plan (12 Months)**

  - **Months 1–2**: Literature review (causation, emergence, complex systems) and refinement of the interventionist criterion.
  - **Months 3–4**: Develop a formal model of the careenium with definable macro-patterns (e.g., using cellular automata or agent-based simulations in abstract terms).
  - **Months 5–6**: Analyze conditions for pattern-sensitivity: What micro-structures allow subsets of simmballs to respond to macro-patterns?
  - **Months 7–8**: Test the criterion on edge cases (e.g., systems where macro-interventions collapse to micro-specifications).
  - **Months 9–10**: Apply the framework to neural/symbolic systems (e.g., how neural patterns implement symbol manipulation).
  - **Months 11–12**: Synthesize results; draft paper and fellowship report.

  ---

  **5. Expected Outcomes and Risks**

  **Success**: A rigorous framework showing that macro-patterns have causal purchase when:
  - The system contains pattern-detecting substructures (e.g., a "comparator" subset of simmballs).
  - Interventions on patterns are robust under micro-variation.
  This would demonstrate that symbolic descriptions can be causally substantive without dualism.

  **Failure Modes**:
  - **Collapse into micro**: If all macro-interventions *must* specify micro-details to be well-defined (e.g., changing a symbol always requires altering specific simmballs in a fixed way), the criterion fails. (This would support reductive physicalism.)
  - **Trivial robustness**: If robustness holds only for degenerate cases (e.g., patterns that are micro-structurally identical across realizations), the approach adds nothing new.

  **Realistic Scope**: The project delivers a conceptual toolkit, not a full theory of mental causation. It will show *how* to ask the question properly, not resolve all metaphysical issues.

  ---

  **6. Relation to Mental Causation Debate**

  "This project reframes the mental causation debate by replacing the focus on supervenience with a test for causal purchase via interventions. Unlike standard non-reductive approaches, it doesn't posit irreducible macro-properties; instead, it asks when macro-patterns become *causal levers* in virtue of pattern-sensitive substructures. This shifts the discussion from 'how do mental properties fit into physics?' to 'what micro-architectures make patterns causally effective?'"

  ---

  **Final Proposal Structure (Two Pages)**

  - **Header**: Title, your name, affiliation.
  - **Abstract** (150 words).
  - **1. Introduction**: Careenium thought experiment and the problem of symbolic causation.
  - **2. Research Question and Gap**: Precise question and why existing views don't answer it.
  - **3. Methodology**: Interventionist criterion and why it's better than alternatives.
  - **4. Work Plan**: Timeline with key milestones.
  - **5. Expected Outcomes and Risks**: Success/failure conditions.
  - **6. Significance**: How this advances philosophy of mind and complex systems.

