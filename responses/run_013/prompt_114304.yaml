prompt: |-
  I have been trying to state the principle behind my function ascriptions, and my verdicts keep pulling in different directions. I would like you to find the principle, or the best small set of principles, that captures them, and to tell me which verdicts I should abandon. I am working with the distinction between a trait's having a function because of its history of selection (the selected-effect view) and its having a function because of its current causal contribution to fitness (the causal-role view), but I do not want to assume either account. Here are the cases and my verdicts.

  1. A bacterium acquires a mutation that makes a pump expel an antibiotic. The mutation arose this morning; the bacterium has not divided since. I say the pump already has the function of expelling the antibiotic.

  2. A cave fish retains eyes, but they are covered by skin and no longer connected to the brain. I say the eyes have no function.

  3. A bird species has lost flight; its wings are now used in courtship displays. I say the wings' function is display, not flight.

  4. A human heart has a congenital defect and cannot pump enough blood. I say it still has the function of pumping blood, even though it is malfunctioning.

  5. A callus forms on a laborer's hand from repeated friction. I say the callus has the function of protecting the hand, even though it is not heritable and was not selected for.

  6. A computer program has a bug that reliably crashes it. I say the bug does not have the function of crashing the program, even though it reliably does so.

  7. A village performs a rain dance. It does not cause rain, but it strengthens social bonds. I say the dance's function is social bonding, not rain-making.

  8. Human blood is red. I say its being red does not have the function of signaling danger, even if it sometimes does.

  9. Feathers first evolved for thermoregulation; later they were co-opted for flight. I say their function now is flight, not thermoregulation.

  10. The human tailbone is a vestige of a tail. I say it has no function now.

  11. A tan develops after sun exposure and protects the skin. I say the tan has the function of protection, even though it is not heritable.

  12. A gene is silenced by methylation in a lineage where it was once selected for a metabolic function. I say the silenced gene has no function now.

  13. A species has a trait that is currently neutral but was selected for in the past. I say it has no function now.

  14. A byproduct of a developmental process, such as the navel, is not something I would say has a function, even if it reliably occurs and can be used for something.

  I suspect the principle is something like: for biological traits, a function is a current causal contribution to fitness, except that a malfunctioning trait retains the function it was selected for; for artifacts, a function is what it was designed to do; and byproducts have no function. But I am not sure this is one principle or three, and I do not know what it says about cases where selection and current contribution come apart in the other direction, such as a trait that was selected for F but now contributes to fitness by G, or a trait that was never selected for but now contributes to fitness by F.

  Is there a single principle that gets all of these, or close? State it precisely, with the case that motivates each clause. What does it predict for the following cases I have not listed: (a) a trait that was selected for F but now contributes to fitness by G and not F; (b) a trait that was never selected for F but now contributes to fitness by F; (c) a trait that is currently neutral but was selected for F; (d) an artifact that was designed for F but is now used only for G; (e) a biological trait that is a byproduct of a selected trait but now contributes to fitness; (f) a malfunctioning artifact that was designed for F but does G? Which of my verdicts would the principle force me to give up, and which should I give up? If no single principle can save all, tell me which verdict is the one to abandon and why. I am especially unsure about case 1 and case 4 together: the new mutation seems to have a function before any selection, while the defective heart seems to have a function it cannot perform. I keep going back and forth on whether those two verdicts can belong to the same account.

  Please structure your answer as follows: (1) Summary, 100–150 words, stating the principle or principles in a sentence or two; (2) The principle, precisely stated, 200–300 words, with each clause and the case that motivates it; (3) How it captures my verdicts, 400–600 words, case by case; (4) Where it breaks, and which verdict to abandon, 300–500 words; (5) Predictions for the new cases, 300–500 words; (6) Bottom line, 100–150 words. Do not give me a reading list or citations; I want the principle and the reasoning.
reasoning: |-
  Okay, let me tackle this user's complex query about function ascriptions. The user presents 14 cases where their intuitive verdicts on functional attributions seem inconsistent, and they're struggling to find unifying principles between selected-effect (historical) and causal-role (current contribution) views. 

  First, I notice the user is clearly deeply engaged with philosophical biology - they've constructed nuanced cases that probe boundary issues like new mutations (case 1), vestigial organs (case 10), and non-heritable traits (case 11). Their frustration with pulling verdicts in different directions suggests they've hit genuine theoretical tension points. The core challenge is reconciling "forward-looking" attributions (like the new antibiotic pump) with "backward-looking" ones (like the defective heart).

  Hmm... their suspicion about needing separate principles for biology vs artifacts makes sense, but I wonder if we can do better. The recurring pattern I see is that they prioritize current fitness contribution EXCEPT when there's clear historical design - but only if that design still "aims" at something. That explains why the callus (case 5) gets a function (current benefit) while the vestigial eyes (case 2) don't (no current benefit despite history). 

  The real headache is case 1 vs case 4. How can a brand-new mutation immediately have a function while a broken heart keeps its old function? The key might be whether the trait belongs to a historically designed system. The heart is part of an evolved system where pumping was selected for, so it retains that function even when broken. The new pump mutation isn't part of such a system yet - but if we see the bacterium's cellular mechanisms as a designed system, maybe the mutation immediately serves a function within that system. 

  For the new cases, co-opted traits (a) would get G as function since that's the current contribution, while never-selected but beneficial traits (b) would get F. Neutral ex-adaptations (c) get no function - this means abandoning verdict 13, but that seems necessary. Artifacts repurposed for G (d) create tension - if we're consistent, they should have G as function, but that feels counterintuitive. Maybe artifacts need separate handling after all...

  The compromise might be this: functions require either current fitness contribution OR being part of a system with historical design that explains the trait's presence. This saves most verdicts except possibly case 13 (which becomes inconsistent) and forces a choice on artifacts. I'll recommend abandoning verdict 13 to maintain coherence elsewhere. The user seems ready to sacrifice some intuitions for theoretical unity, given their request to identify which verdicts to drop.
answer: |-
  ### (1) Summary  
  Your verdicts suggest a hybrid principle: **A trait has function F if F is its current fitness-contributing effect within a historically maintained system.** This combines causal-role (current contribution) with a selected-effect constraint (system history). Malfunctions retain historically selected functions. Non-heritable traits gain functions if they reliably contribute to fitness *now*. Vestiges and neutral traits lack functions. Artifacts follow design history. This captures 12/14 verdicts; abandon #13 and refine artifact handling.  

  ### (2) The Principle, Precisely Stated  
  **Core Principle**: *A trait T in system S has function F iff:*  
  **(i)** *F is a causal contribution of T to the fitness/goal-achievement of S,* **and**  
  **(ii)** *S has a history of maintenance/selection for traits of type T (or their mechanisms) performing F-like effects.*  

  **Clauses and Motivations**:  
  - **Clause (i)**: *Current causal role* (motivated by cases where new or repurposed traits contribute immediately: e.g., **#1** (new mutation), **#5** (callus), **#7** (rain dance’s social bonding)).  
  - **Clause (ii)**: *Historical maintenance* (motivated by cases where lack of selection history voids functions: e.g., **#2** (vestigial eyes), **#10** (tailbone), **#12** (silenced gene)).  
  - **Malfunction Corollary**: If T was historically maintained for F and remains part of a system selected for F, it retains F as its function even if broken (motivated by **#4** (defective heart)).  
  - **Artifact Addendum**: For artifacts, F is fixed by design history alone (motivated by **#6** (bug not functional), **#14** (navel not functional)).  

  **Exclusions**: Byproducts (#14), neutral traits (#13), and traits lacking system history (#8) lack functions.  

  ### (3) How It Captures Your Verdicts (Case-by-Case)  
  - **#1**: **Captured**. The pump’s antibiotic expulsion satisfies (i) (current fitness contribution) and (ii) (bacteria have a history of selection for toxin expulsion).  
  - **#2**: **Captured**. Eyes lack (i) (no current contribution) and fail (ii) (no recent selection for vision).  
  - **#3**: **Captured**. Wings satisfy (i) (courtship aids fitness) and (ii) (wings historically maintained for flight, now repurposed). Function is *display*.  
  - **#4**: **Captured**. Malfunction Corollary: Hearts are part of a system historically maintained for blood pumping.  
  - **#5**: **Captured**. Callus satisfies (i) (current protection) and (ii) (skin repair mechanisms are historically maintained). Non-heritability is irrelevant.  
  - **#6**: **Captured**. Artifact Addendum: Bugs lack design history for crashing.  
  - **#7**: **Captured**. Social bonding satisfies (i) (current fitness via group cohesion) and (ii) (rituals historically maintained for social functions).  
  - **#8**: **Captured**. Blood color fails (ii): no history of selection for signaling.  
  - **#9**: **Captured**. Flight satisfies (i) (current fitness contribution) and (ii) (feathers now maintained for flight).  
  - **#10**: **Captured**. Tailbone fails (i) and (ii): no current contribution or recent maintenance.  
  - **#11**: **Captured**. Tan satisfies (i) (current protection) and (ii) (skin response mechanisms historically maintained).  
  - **#12**: **Captured**. Silenced gene fails (i) and (ii): no current contribution and no maintenance.  
  - **#13**: **Not captured** (see §4).  
  - **#14**: **Captured**. Navel fails (ii): a byproduct, not maintained for any effect.  

  ### (4) Where It Breaks and Which Verdict to Abandon  
  **Conflict with #13**: You say a currently neutral trait with past selection has no function. But if Clause (ii) requires *historical maintenance*, a trait maintained by past selection (even if now neutral) might retain its function. For example, if a trait was crucial for survival until recently and persists due to genetic drift, the principle could assign its historical function.  
  - **Why abandon #13?** Consistency demands it. Clause (ii) focuses on whether the *system* was maintained *for* F-like effects. If the trait is inactive but the system persists due to past selection for F, F remains its function (e.g., dormant genes in conserved pathways). Your other verdicts prioritize active contributions (#2, #10), but #13 is an outlier.  
  - **Artifact tension**: In **#6**, you deny the bug a function, but if an artifact is repurposed (e.g., a hammer used as a paperweight), the principle might assign its *current* use if it satisfies artifact design. This needs refinement (see §5).  
  - **Minimal revision**: Drop **#13**. A neutral trait with a robust selection history retains its function, but note it must still satisfy Clause (ii) — historical maintenance for F.  

  ### (5) Predictions for New Cases  
  **(a) Trait selected for F, now contributes to G (not F)**:  
  - *Prediction*: Function is **G**.  
  - *Why*: Current contribution (G) dominates if the system is maintained for G-like effects (e.g., bird wings in #3: flight→display).  

  **(b) Trait never selected, now contributes to F**:  
  - *Prediction*: Function is **F**.  
  - *Why*: Satisfies Clause (i) and (ii) if the trait-type’s mechanism was maintained (e.g., callus in #5).  

  **(c) Trait currently neutral, was selected for F**:  
  - *Prediction*: Function is **F** (abandoning your #13 verdict).  
  - *Why*: Clause (ii) is met (historical maintenance for F), even if Clause (i) lapses.  

  **(d) Artifact designed for F, now used only for G**:  
  - *Prediction*: Function is **F** (design history fixes function).  
  - *Why*: Artifact Addendum prioritizes original intent (e.g., a chair used as a stepstool retains "sitting" as function).  

  **(e) Biological byproduct now contributing to fitness**:  
  - *Prediction*: **No function** (e.g., navel in #14).  
  - *Why*: Fails Clause (ii): not part of a system historically maintained for that effect.  

  **(f) Malfunctioning artifact designed for F but doing G**:  
  - *Prediction*: Function is **F**.  
  - *Why*: Malfunction Corollary (e.g., a broken toaster that shocks people retains "heating bread" as function).  

  ### (6) Bottom Line  
  Your core principle is: **Function requires current fitness contribution within a system historically maintained for that effect-type.** This hybrid view explains 13/14 cases if you abandon **#13** (neutral traits retain historical functions). It resolves the tension between #1 (new mutation) and #4 (defective heart): both rely on system history (bacterial defenses/heart evolution), but current contribution activates the function in #1, while historical fixation preserves it in #4. For artifacts, consistently apply design history. The only cost is accepting that vestigial-but-recently-selected traits (#13) retain functions, aligning with your treatment of malfunctioning organs (#4). This achieves maximal coherence with minimal revision.
