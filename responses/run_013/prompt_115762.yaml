prompt: |-
  I chair the governance committee of a mid-sized research foundation, and after a year of internal argument we have agreed to trial futarchy — the idea that we should settle our values by voting but estimate the consequences of a proposal by betting on them — for our major allocation decisions. We make roughly a dozen binary decisions a year (fund this program or not; adopt this procurement rule or not; continue this grant or end it), each committing a significant share of the budget, and the committee is split between members who trust expert judgment and members who trust markets. We meet monthly, decide within two weeks, have no economist on staff, and every decision needs the board's sign-off. I need something better than a slogan: a decision procedure the committee can actually run, written for people who are not economists.

  Give me that procedure. It should set out the steps in order, say what counts as a sufficient answer at each step, mark where the procedure terminates in a decision, and mark where it must hand the matter back to a person because the question is one of values rather than prediction. The procedure has to do the conceptual work the slogan hides. At a minimum it should force us to settle, in the right order: what welfare metric the market is supposed to forecast, and who is authorized to choose it; whether the relevant markets are genuinely conditional — paying out on the outcome given the policy, not on the policy's chances — or have quietly collapsed into an ordinary prediction market; how the two branches of the comparison are priced and how the difference between them is read; what threshold of expected gain is required to overturn the status quo, and why that threshold is a values choice the market cannot make for us; how resolution and the measurement of the metric are verified; and what to do when the market is thin, when its price reflects the capital and risk-appetite of the traders rather than their beliefs, or when the estimated difference falls inside the noise.

  Handle these hard cases explicitly, and say what the procedure does with each: a proposal whose benefits fall on people outside the metric; a proposal that is popular for reasons the metric does not capture; a metric that the market's own verdict could move, so that the forecast becomes self-fulfilling; and a proposal whose outcome will not be observable for years. Then run the procedure on two or three worked examples — including at least one where it returns an answer I will not like, and say so — and close by stating plainly what the procedure cannot do and which decisions it cannot be trusted with.

  Write it as a procedure, not an essay, with the hard cases and the points where judgment cannot be eliminated marked as such. Where a step is a judgment call dressed up as a rule, say so. And separate what is settled from what is genuinely contested among people who know this material: do not present a contested claim — about whether markets beat experts, about whether manipulation is fatal, about whether a metric can be chosen without smuggling in values — as though it were the consensus.
reasoning: |-
  Okay, let me think through how to design a practical futarchy procedure for this research foundation. The user chairs a governance committee that's agreed to trial futarchy for major binary decisions, with about a dozen such calls per year. They need a clear, executable process that addresses the conceptual gaps in the futarchy slogan, written for non-economists.

  First, I need to establish the core structure: values decided by voting, consequences by markets. The procedure must force explicit choices about the welfare metric upfront - that's crucial because the metric defines what "good" means for the foundation. Since the board retains final sign-off, I'll make the committee recommend but not decide the metric.

  For market design, conditional markets are essential to separate policy evaluation from implementation likelihood. But I anticipate problems with thin markets - common in small-scale implementations. The threshold question is particularly important because it reflects risk tolerance, which is inherently a values judgment the market can't make. I'll suggest a default of 10% expected gain but emphasize it must be set deliberately.

  Hard cases need special handling:
  - Externalities require either metric adjustment or explicit board override
  - Self-fulfilling metrics need careful construction to avoid feedback loops
  - Long-term outcomes will need intermediate proxies that the committee must define

  The examples should demonstrate both successful operation and failure modes. One should show the committee rejecting a popular proposal because the market predicts negative impact - precisely the "answer you won't like" that proves the system is working as intended.

  Throughout, I'll flag contested aspects transparently: market efficiency assumptions, manipulation risks, and the inevitable value judgments in metric selection. The conclusion must clarify that this is a decision aid, not an abdication of governance - some decisions will always require human judgment.

  The tone should be directive but not prescriptive, using numbered steps for clarity while acknowledging where flexibility is needed. For verification, I'll suggest simple binary payouts where possible to reduce complexity.
answer: |-
  ## Futarchy Trial Procedure for Research Foundation Governance Committee

  **Scope:** Binary decisions committing significant budget share (e.g., fund/not fund program, adopt/not adopt rule, continue/end grant). Requires Board sign-off. Decisions made within 2 weeks of committee meeting.

  **Core Principle:** Voting determines *what we value* (the welfare metric). Betting (prediction markets) estimates *expected outcomes* under different policies relative to that metric. Markets inform, not decide; the committee retains judgment.

  ---

  **Procedure Steps:**

  1.  **Define the Welfare Metric (Values Vote - Committee):**
      *   **Action:** Committee debates and votes to define a single, quantifiable metric representing the foundation's goal for *this specific decision*. Examples: "Number of peer-reviewed publications generated within 3 years," "Dollar value of follow-on funding attracted by grantees within 5 years," "Percentage reduction in project cost over baseline."
      *   **Sufficient Answer:** A precisely defined metric (variable, measurement method, timeline, source of verification data) approved by simple majority vote. *Must include explicit verification method.*
      *   **Judgment Call:** Defining the metric inherently involves value choices about what "success" means. *[Contested: Whether a truly "value-neutral" metric exists for complex research outcomes.]*
      *   **Output:** Approved Welfare Metric (WM) documented.
      *   **Terminates if:** Committee cannot agree on a WM within one meeting cycle. **Hand back to Board** with recommendation to either abandon proposal or define WM itself.

  2.  **Define Policy Scenarios & Market Conditions (Committee):**
      *   **Action:** Define two clear, mutually exclusive scenarios:
          *   `Scenario A (Status Quo or Alternative 1):` Describe the current state or the rejected path.
          *   `Scenario B (Proposed Policy):` Describe the proposed change.
      *   **Action:** Define the exact conditions under which the WM will be measured for payout (e.g., "WM measured on Dec 31, 2027, using data from Foundation Annual Report verified by external auditor").
      *   **Sufficient Answer:** Unambiguous descriptions of A and B, and a concrete resolution condition/timeline.
      *   **Output:** Defined Scenarios A & B, Resolution Condition.

  3.  **Design Conditional Markets (Committee with Market Operator):**
      *   **Action:** Instruct the Market Operator (e.g., internal staff or external platform like Polymarket, Kalshi) to create two *separate* conditional prediction markets:
          *   `Market A:` Pays $1 if `Scenario A` occurs *AND* the WM is measured at `Value X`. Pays $0 otherwise. *This is a prediction on the WM value GIVEN Scenario A.*
          *   `Market B:` Pays $1 if `Scenario B` occurs *AND* the WM is measured at `Value X`. Pays $0 otherwise. *This is a prediction on the WM value GIVEN Scenario B.*
      *   **Critical:** Markets must be *conditional* on the scenario occurring. They predict the WM *outcome conditional on the policy being in place*, not the *probability the policy is adopted*. Traders bet on the *consequence* of the policy, not its popularity.
      *   **Sufficient Answer:** Two functioning markets launched, clearly labeled as conditional on Scenario A and Scenario B respectively.
      *   **Judgment Call:** Choosing a reputable operator and market structure (e.g., continuous double auction, LMSR). *[Contested: Whether thin markets can ever be efficient.]*

  4.  **Seed Markets & Run Trading Period (Market Operator):**
      *   **Action:** Market Operator seeds each market with modest initial liquidity (e.g., Foundation funds $1000 split between the two markets) to kickstart trading.
      *   **Action:** Trading opens for a defined period (e.g., 5-7 business days). Trading should be open to a predefined group (e.g., committee members, foundation staff, external experts identified by committee, potentially public). Anonymize traders if possible.
      *   **Output:** Market prices at close of trading for Market A (P_A) and Market B (P_B). P_A represents the market's predicted probability density that the WM = $1 *IF Scenario A happens*. P_B represents the same *IF Scenario B happens*.

  5.  **Estimate Expected WM Difference (Committee):**
      *   **Action:** Calculate the key comparison: `Expected WM(B) - Expected WM(A)` ≈ `P_B - P_A`.
      *   **Interpretation:** `P_B - P_A` estimates the *change in the expected value of the Welfare Metric* if we switch from Scenario A to Scenario B. A positive difference suggests Scenario B is expected to improve the WM.
      *   **Sufficient Answer:** A single numerical value: `Δ = P_B - P_A`.

  6.  **Apply Decision Threshold (Values Judgment - Committee):**
      *   **Action:** Compare `Δ` to a pre-defined **Decision Threshold (DT)**.
      *   **Defining DT (Values Choice - Committee/Board):** *Before any markets run for any decision*, the Committee must recommend, and the Board must approve, a default Decision Threshold (e.g., Δ >= +0.10). This represents the *minimum expected improvement in the WM required to justify changing the status quo*. **Why Thresholds are Values:** Markets predict *outcomes*, but the *cost of change, risk tolerance, and minimum acceptable benefit* are value judgments. A small positive Δ might not be worth the disruption. *This step cannot be automated.*
      *   **Sufficient Answer:** A clear rule: Recommend Scenario B if `Δ >= DT`. Recommend Scenario A (status quo) if `Δ < DT`. If no pre-set DT exists, **Hand back to Committee/Board** for an explicit values judgment on whether the measured `Δ` is sufficient.
      *   **Output:** Committee Recommendation (A or B).

  7.  **Board Sign-Off & Implementation (Board):**
      *   **Action:** Board reviews Committee recommendation, process, WM, Δ, and DT. Approves or rejects the recommended action.
      *   **Output:** Final Decision.

  8.  **Resolution & Payout (Market Operator):**
      *   **Action:** After the Resolution Condition is met (e.g., Dec 31, 2027), the Market Operator collects the verified WM value.
      *   **Action:** The Operator determines which scenario actually occurred (A or B) and pays out the corresponding market (A or B) based on whether the measured WM value triggered the $1 payout condition ($1 if WM >= X? WM = X? - defined in Step 2). The other market expires worthless.
      *   **Critical:** Ensures traders are rewarded for accurate prediction of the *actual outcome under the implemented scenario*.

  ---

  **Handling Hard Cases Explicitly:**

  *   **Thin Market, Capital/Risk Effects:** If trading volume is very low (e.g., < $500 total across both markets) OR prices are highly volatile without news:
      *   **Procedure:** Committee *must* flag this. The `Δ` value is deemed unreliable. **Hand back to Committee.** Committee uses expert judgment or other evidence alongside the noisy market signal. *Do not rely solely on the market price.*
  *   **Δ Inside Noise (Small Magnitude):** If `|Δ| < 0.05` (or another small value defined *ex-ante*), the signal is likely noise.
      *   **Procedure:** Treat as `Δ ~ 0`. Apply Decision Threshold rule (likely favors Status Quo unless DT is negative). **Committee must explicitly confirm** if the Status Quo recommendation aligns with their overall judgment given the weak market signal.
  *   **Benefits Outside Metric:** If a proposal has clear benefits (e.g., reputational boost, equity impact) not captured by the WM.
      *   **Procedure:** The market forecast (`Δ`) *only* covers the WM. Committee *must* explicitly discuss and factor in these external benefits *during their final recommendation judgment* (Step 6). **This is a values override based on the WM's incompleteness.**
  *   **Popular for Non-Metric Reasons:** If a proposal is popular for reasons (e.g., ideological alignment, personal connections) unrelated to the defined WM.
      *   **Procedure:** The conditional market design *should* prevent this from affecting `Δ`, as traders bet on the *outcome* (WM) given the policy, not the policy's adoption chances. If popularity *indirectly* influences beliefs about the outcome, that's valid market information. **Committee should not override solely because popularity disagrees with `Δ` unless they suspect market failure (manipulation, irrationality).** *[Contested: How effectively markets filter out sentiment from prediction.]*
  *   **Self-Fulfilling/Falsifying Metric:** If the market's prediction itself could influence the WM outcome (e.g., predicting high publications causes more submissions).
      *   **Procedure:** **Difficult to mitigate.** Committee should try to design the WM to be less manipulable (e.g., "publications in top-10 journals" harder to game than total pubs). Anonymize market participation if possible. **Acknowledge the risk.** If deemed severe, **Hand back to Committee** – market may be invalid for this case.
  *   **Long-Term Outcomes:** If the WM resolution is many years away (e.g., 5+ years).
      *   **Procedure:** **Requires proxy markets.** Define an *intermediate, verifiable proxy metric* correlated with the long-term WM (e.g., "Year 1 milestone completion rate" for a 5-year publication goal). Run markets on the proxy. **Committee must explicitly justify the proxy's validity and document the assumption that proxy Δ predicts long-term WM Δ.** Payout occurs on the proxy.

  ---

  **Worked Examples:**

  **Example 1: Fund New AI Ethics Program (Δ > DT - Expected Success)**
  *   **WM:** Number of peer-reviewed publications (in specified journals) by funded researchers within 3 years. (Verified: Publication database audit).
  *   **A:** Status Quo (No Program). **B:** Fund Program ($2M).
  *   **Markets:** Market A: Pays $1 if no program & pubs >= X? (Set X based on current baseline). Market B: Pays $1 if program funded & pubs >= Y (Set Y = X + target increase).
  *   **Result:** P_A = 0.55 (55% chance pubs >= X w/o program), P_B = 0.80 (80% chance pubs >= Y *with* program). Δ = 0.80 - 0.55 = +0.25.
  *   **DT:** Pre-set at +0.15.
  *   **Recommendation:** Fund Program (Δ = +0.25 > +0.15). *Likely Board Approval.*
  *   **Why you might not like it:** If you subjectively believe AI ethics research is low-value despite publication potential, the WM forces a focus you disagree with. The procedure overrides that subjective value.

  **Example 2: Adopt Stricter Procurement Rules (Δ < DT - Expected Harm)**
  *   **WM:** Total project cost (as % deviation from initial budget) averaged over next 5 projects. Lower % deviation is better. (Verified: Finance audits).
  *   **A:** Status Quo Rules. **B:** Adopt New Stricter Rules.
  *   **Markets:** Market A: Pays $1 if Status Quo & Avg Cost Deviation <= X%. Market B: Pays $1 if New Rules & Avg Cost Deviation <= Y% (Set Y = X, comparing same target).
  *   **Result:** P_A = 0.70, P_B = 0.40. Δ = 0.40 - 0.70 = -0.30.
  *   **DT:** +0.10.
  *   **Recommendation:** Reject New Rules (Δ = -0.30 < +0.10). *Likely Board Approval.*
  *   **Why you might not like it:** If the *reason* for proposing stricter rules was ethical concerns (e.g., fair labor) or reputational risk *not captured in the cost WM*, the procedure ignores these values. You lose despite good intentions.

  **Example 3: Continue High-Risk Physics Grant (Thin Market / Inside Noise)**
  *   **WM:** Dollars of follow-on funding (govt/industry) attracted within 2 years. (Verified: PI reports + external validation).
  *   **A:** Terminate Grant. **B:** Continue Grant ($1.5M).
  *   **Markets:** Launched.
  *   **Result:** Very low volume ($300 total). P_A = 0.48, P_B = 0.52. Δ = +0.04.
  *   **Analysis:** Volume too low. |Δ| < 0.05 (noise threshold). **Hand back to Committee.**
  *   **Committee Action:** Acknowledges market unreliable/silent. Relies on expert reviews (PI progress, panel assessment) which are mixed but lean slightly positive. Also considers strategic value of the research area (external benefit not in WM).
  *   **Recommendation:** Continue Grant (based on expert judgment + weak market signal + strategic value). *Board sign-off depends on their view of the committee's reasoning.*
  *   **Why it might fail:** Experts could be wrong. Market thinness might signal genuine uncertainty experts are ignoring. The "strategic value" judgment could be flawed.

  ---

  **What This Procedure CANNOT Do (Limitations):**

  1.  **Replace Values Judgment:** It cannot define the Welfare Metric or the Decision Threshold. These remain critical committee/board responsibilities reflecting core values.
  2.  **Guarantee Accurate Predictions:** Markets, especially thin ones, can be wrong, manipulated, or reflect biases/capital imbalances rather than true expectations. They are an *input*, not an oracle.
  3.  **Handle Highly Subjective or Non-Quantifiable Values:** If the core value (e.g., "artistic merit," "transformative potential") cannot be operationalized into a quantifiable, verifiable metric, futarchy fails. **Hand back to people.**
  4.  **Solve Very Long-Term or Radically Uncertain Futures:** Proxies are imperfect. Markets struggle with unprecedented events ("unknown unknowns").
  5.  **Eliminate the Need for Expertise:** Expert judgment is still needed to design the WM, scenarios, interpret thin/noisy markets, assess externalities, and choose proxies.
  6.  **Function Without Sufficient Liquidity & Participation:** Thin markets are unreliable. Incentives might be needed to attract informed traders.
  7.  **Prevent All Manipulation:** While conditional markets help, determined actors with capital can try to distort prices, especially in thin markets. Monitoring is essential.
  8.  **Make Decisions Where the Outcome Cannot Be Verified:** The WM *must* be resolvable. If it can't be measured objectively later, the market mechanism breaks.

  **Conclusion:** This procedure forces explicit choices on values (WM, DT) and separates prediction (markets) from valuation. It provides a structured way to harness collective intelligence about outcomes but **does not absolve the committee or board of their governance responsibilities.** Judgment is required at critical points, especially regarding the metric, threshold, thin markets, externalities, and long-term uncertainty. Use it as a disciplined decision *aid*, not an automatic decision *maker*. Monitor its performance closely during the trial.
