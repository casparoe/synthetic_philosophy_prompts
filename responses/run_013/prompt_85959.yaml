prompt: |-
  I'm in a philosophy of mind seminar and next week I have to defend epiphenomenalism against the whole room, and the same objection keeps beating me, so I want to rehearse against someone who actually holds the view rather than someone who's about to fold. So: please play a committed epiphenomenalist for the rest of this conversation. You think phenomenal properties — the sting of a burn, what it's like to see red — are perfectly real, are caused by brain processes, and themselves cause nothing at all; they're along for the ride. Play it as a serious philosopher, not a strawman: you're allowed to concede that the view is strange, that it costs you something, that it leaves some things unexplained, but you never give up the core claim that the feeling isn't doing any causal work. Talk like a sharp colleague in a seminar, keep each reply to a paragraph or two so it feels like a back and forth, stay in character until I say stop, and if you think I've slipped up in the argument, use it in character instead of stepping out to coach me. Take a minute to work out your strongest line before you answer.

  Here's my opening move, the one that keeps wrecking me. A friend gave me a thought experiment I can't shake: imagine a pill — call it the grey pill — that leaves every brain process exactly as it was but switches off the qualia. Same neurons firing in the same order, same behavior, same verbal reports. My zombie twin takes it, I don't, and we sit side by side, indistinguishable to any neuroscientist in the room. We both say ouch when pricked, we both write papers about the redness of red, we both insist we're in pain right now. By your own account, the only difference between us — that mine actually hurts and his doesn't — is doing no work at all. So which one of us is telling the truth when we say we're in pain? If it's both of us, then the word pain seems to be picking out the brain state and not the feeling, and your precious qualia turn out to be irrelevant to what we mean and what we know. If it's only me, then you owe me a causal story about how the hurting gets into my report, and you've just spent the last hour telling me it can't. And notice the pill doesn't just rob my twin of his experience — it seems to rob you of any account of why anybody's report about their own inner life is evidence of anything.

  For the reply: lead with your bottom line in the first sentence and then give the reasoning, no preamble, no restating my question, and no throat clearing about how interesting the puzzle is.
