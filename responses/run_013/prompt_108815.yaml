  Ok, so background: I'm a second-year PhD student and I have to submit a proposal for our department's spring workshop on weird topics in applied ethics -- they want two pages, but just give me the substance and I'll format it. My half-formed idea, and please tell me if it's a non-starter: everyone in animal-welfare and AI-moral-status debates keeps leaning on brain size (or brain-like complexity, or 'scale') without ever defending it, and when you press them they either say it's a crude proxy for the thing that's really doing the moral work -- sentience, or cognitive capacity, or the ability to have interests at all -- or they wave it off as phrenology-adjacent nonsense. I think both moves dodge the actual question, which is whether a structural or quantitative fact about a brain could bear directly on how much a being's interests matter, not just on whether it has interests at all. And I want to pull apart two things that I think get run together alot: moral status (do you count at all?) versus moral weight (how much do you count, given that you count?). My hunch is that brain size, if it's morally relevant at all, would matter for the second and not the first, and that whether it does depends on your theory of welfare in a way nobody's really spelled out -- like, on a hedonist picture maybe what matters is the sheer quantity of valenced states, which a bigger brain might support more of, whereas on a desire-satisfaction or objective-list picture the story looks totally different, and on some views (the ones where all that matters is having the capacity at all) size just drops out entirely. There's also a puzzle I can't shake: if brain size tracks the number of welfare-relevant states a being can be in, is 'having more capacity for welfare' the same as 'being smarter'? Intuitively no, but I can't say why.

  Can you turn this into an actual proposal? I need the question stated so it has a determinate answer, why the three standard positions (the pure-proxy view, the irrelevance view, and the naive 'bigger brain, more moral weight' view) each leave it open, what I'd concretely do for one semester, why a conceptual approach beats just waiting for more neuroscience, and an honest assessment of what would count as the project failing or being too big for a semester. No citations or reading lists please, I'll add those. Hard cap: 800 words.
