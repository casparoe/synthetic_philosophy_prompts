prompt: |-
  I cover science and ideas for a magazine, and I keep watching smart reporters — including me, in print, twice — get heritabilty wrong in the same three ways. Next month I'm running a 75-minute session at a science-writers workshop: 18 people, mostly reporters who've done the "is intelligence genetic" story and will do it again. I want them to feel the problem in their hands, not hear it in a lecture, so design me a simulation they run themselves. My rough idea: everyone gets a genotype card and an environment card, the trait is just the two added up, and they compute the heritability of the trait in the room off their own data. Then the number has to move twice for reasons that have nothing to do with genes getting more important — once where I hand everyone the same environment, and once where I split the room into two groups on different environments, so a big between-group gap appears that's 100% environmental while the within-group heritability stays high. I want them to arrive at: heritability is a variance ratio inside one population at one time, not a property of a trait or a person; a high figure is compatible with the average shifting a lot when environments shift; a high within-group figure licenses nothing about differences between groups; and you can't read causal strength off a variance decomposition. Keep the trait botanically neutral during play so nobody starts moralizing mid-game and I can cash it out in the debrief.

  Give me the rules, materials, how they get a number without me doing stats on the board, a debrief that maps each round onto one of those four points, what will predictably go wrong the first time and how I handle it, and an honest note on which part of the real science (twins, SNPs, whatever) the exercise cant reproduce and I'll have to just say out loud.
reasoning: |-
  We are designing a simulation for a science writers workshop to illustrate key concepts about heritability. The goal is to avoid common misunderstandings. We'll use a simple additive model: trait = genotype + environment. We want participants to compute heritability from their own data and then observe how heritability changes when we manipulate the environment, without changing the genetic component.

  Key points to illustrate:
  1. Heritability is a variance ratio within a single population at a specific time, not a property of a trait or person.
  2. A high heritability is compatible with large average shifts when environments change.
  3. High within-group heritability does not explain between-group differences.
  4. Variance decomposition does not imply causal strength.

  We'll run three rounds:
  - Round 1: Baseline (both genetic and environmental variation).
  - Round 2: Everyone gets the same environment (so environmental variance becomes zero).
  - Round 3: Split the room into two groups with different environments (creating a between-group gap that is 100% environmental).

  Materials:
  - Genotype cards: These will be numbers representing genetic contributions. We'll use integers, e.g., from 1 to 10. We can use a deck of cards or pre-printed slips.
  - Environment cards: Similarly, integers for environmental contributions. We want enough variation.

  To keep it botanically neutral, we'll call the trait "X".

  Steps:

  1. **Preparation**:
     - Prepare two sets of cards: one for genotype (G) and one for environment (E). Each set should have a range of values. For example, G: 1 to 10, E: 1 to 10. We need at least 18 of each (one for each participant). We can use a uniform distribution for simplicity.

  2. **Round 1: Baseline**
     - Each participant draws one G card and one E card at random (without replacement? or with? We can do with replacement to keep it simple and independent). 
     - Their trait value X = G + E.
     - Collect all the X values and compute the total variance (V_total) and the variance due to genetics (V_genetic). Since we are simulating, we know the components. We can compute V_genetic as the variance of the G values and V_environmental as the variance of the E values. Then, heritability (h^2) = V_genetic / V_total.

     But we want the participants to compute the heritability without complex stats. How? We can have them compute the correlation between genotype and trait? But that would be high because they are directly related. Alternatively, we can use the fact that in this additive model, the heritability is the proportion of variance due to genetics.

     We can do:
     - Have each participant write their G and X (they know their own G and E, but we can have them report only G and X to the group).
     - We can compute the variance of G and the variance of X. But doing variance calculations by hand for 18 points is tedious.

     Alternative approach: Use a scatterplot? Or we can use a simplified method.

     Since time is limited, we can pre-calculate the variances on a computer and show them? But we want them to feel it. Alternatively, we can use a simple approximation.

     Idea: Use the range or the standard deviation? But that might not be accurate.

     Another idea: We can have them compute the correlation between G and X. In this model, the correlation between G and X is the square root of heritability? Actually, in the additive model without covariance, the correlation between G and X is sqrt(V_G / V_total) = sqrt(h^2). So h^2 = (correlation)^2.

     How to compute correlation without a computer? We can do a rough estimate by ranking? Or we can use a simple formula: correlation = covariance(G,X) / (sd_G * sd_X). But computing covariance and standard deviations by hand is messy.

     Let me think of a better way: We can have them plot G vs X on a big grid on the wall? Then we can draw a best-fit line and estimate the slope? The slope of G on X is the heritability? Actually, in a univariate regression of X on G, the slope is cov(G,X)/var(G). But note: X = G + E, so cov(G,X) = cov(G, G+E) = var(G) + cov(G,E). If we assume G and E are independent, then cov(G,E)=0, so the slope is 1. That doesn't help.

     Alternatively, we can regress X on G and get a slope of 1 regardless of the variances? That's not what we want.

     We want to estimate the proportion of variance. So we need to compute variances.

     Given the constraints, I suggest we do:

     - We collect the G and X values from everyone and write them on a board or a shared document that we can project.
     - We then compute the variance of X and the variance of G. The heritability is the ratio of V_G to V_X? But note: V_X = V_G + V_E (if independent). So h^2 = V_G / (V_G + V_E).

     However, we don't have V_E? But we can compute V_X and V_G, and then V_E = V_X - V_G? Only if we assume independence. And in our model, they are independent.

     So we can compute:
       V_G = variance(genotypes)
       V_X = variance(trait values)
       Then h^2 = V_G / V_X

     But wait: this is the broad-sense heritability (since we are not using any relatedness). And in our model, it is exactly the proportion of variance.

     How to compute variance without a computer? We can do:

       Step 1: Compute the mean of G and the mean of X.
       Step 2: For each individual, compute (G_i - mean_G)^2 and (X_i - mean_X)^2.
       Step 3: Sum the squares for G and for X.
       Step 4: Divide by n-1 to get the sample variances.

     This is a bit cumbersome but doable for 18 points if we have a calculator? Or we can have the participants help. We can use a spreadsheet on a laptop and project it? That might be acceptable in a workshop.

     Alternatively, we can pre-program a simple app that they input the numbers and it computes the variance? But we want them to see the process.

     Since time is 75 minutes, we can spend 10 minutes on this calculation. We can have the participants call out their numbers and we write them in two columns. Then we can compute the mean and then the deviations. We can assign a few participants to help with the calculations.

     We'll do that.

  3. **Round 2: Uniform Environment**
     - Collect the environment cards and give everyone the same environment value, say E=5 (or whatever the mean was in the first round? or just a fixed number). 
     - They keep their genotype card.
     - Now, X = G + 5.
     - Again, compute the heritability: h^2 = V_G / V_X. Now V_E=0 because everyone has the same E, so V_X = V_G. Therefore, h^2=1.

     This illustrates that when environmental variation is reduced, heritability goes up (to 1) even though the genetic contributions haven't changed.

  4. **Round 3: Group-Specific Environments**
     - Split the room into two groups (e.g., Group A and Group B). 
     - Assign Group A an environment value of 2, and Group B an environment value of 8 (or any two numbers that are different and symmetric around the previous mean). 
     - They keep their genotype cards.
     - Now, for Group A: X = G + 2; for Group B: X = G + 8.
     - Now, we compute heritability in two ways:
          a) Within each group: For Group A, X = G+2, so V_X = V_G (since E is constant). Similarly for Group B. So within each group, h^2=1.
          b) But if we combine the groups: The total variance V_X will be larger. We can compute the overall heritability: V_G / V_X, but note that V_X now includes the between-group variance (due to environment) and the within-group variance (due to genes). The between-group variance is large, so V_G / V_X will be small.

     We want to show that the within-group heritability is high, but the between-group difference is 100% environmental.

     We can also compute the average trait value for each group: 
          Group A: mean_X = mean_G + 2
          Group B: mean_X = mean_G + 8
     The difference is 6, which is entirely due to environment.

     Then we can compute heritability for the entire room: 
          V_G = variance of G for everyone (which is the same as before, because we didn't change G)
          V_X = total variance of X (which now has a big component from the group difference)

     We expect h^2 = V_G / V_X to be low because V_X is large.

     This illustrates that the high heritability within groups does not explain the between-group difference.

  Debriefing:

  We map each round to the points:

  1. Round 1: Baseline. Heritability is a ratio of variances in this population at this time. If we had a different population or a different environment distribution, it would change.

  2. Round 2: Uniform environment. Heritability becomes 1. But note: the average trait value might have changed (if the uniform environment is different from the average environment in round 1). This shows that a high heritability is compatible with the average trait shifting when the environment shifts (even though in this case, we shifted the environment to a constant). Also, note that heritability increased because we reduced environmental variance.

  3. Round 3: Group-specific environments. 
     - Within each group, heritability is 1. 
     - The between-group difference (the gap) is entirely environmental. 
     - But when we compute heritability for the entire population, it drops because of the added environmental variance between groups. 
     This shows that high within-group heritability does not license any claims about between-group differences. Also, the heritability for the entire population is lower than within groups because the environmental variation between groups is now part of the total variance.

  4. General point: The exercise shows that heritability is a population statistic at a given time and environment. It does not tell us about the causal strength of genes in an absolute sense, because if we change the environment, the same genes can lead to different outcomes (as in round 2 and 3).

  What might go wrong:

  - The calculation of variance might be time-consuming and error-prone. 
     Solution: Have a pre-made spreadsheet ready. We can have participants call out their numbers, we input, and then we show the calculation. Or we can use a calculator and do it together quickly.

  - Participants might question the independence of G and E? In our model, we are assigning independently. We can note that in reality, there might be gene-environment correlations, but for simplicity we are assuming independence.

  - In Round 3, when we split the groups, we might not have balanced genotypes? We didn't assign genotypes by group, so the two groups should have similar distributions of G? But if the groups are small, there might be sampling variation. To minimize this, we can assign the groups randomly? Or we can note that the genetic variance within each group should be similar to the overall genetic variance.

  - The trait is additive: X = G + E. What if there are interactions? We are ignoring that for simplicity.

  Honest note on what the exercise can't reproduce:

  - In reality, we cannot directly observe the genetic and environmental components. We infer heritability from studies of relatives (like twins) or from molecular genetics (like SNPs). This exercise lets us see the components because we are simulating them. In real studies, we have to make assumptions (like the absence of gene-environment correlation) and use statistical models to estimate heritability.

  - Also, the exercise uses a very simple additive model without any gene-environment interactions or non-additive genetic effects (dominance, epistasis). Real heritability estimates can be more complex.

  - The exercise uses a one-locus model (each person has one genotype value) but in reality, traits are often polygenic.

  Rules and Materials:

  Materials:
  - 18 genotype cards: numbers from 1 to 10 (we can have multiples to allow for 18, but we want variation so we can have, say, two of each number from 1 to 9? Then we have 18). Actually, we can generate 18 numbers from a distribution. Let's do uniform from 1 to 10 (integers). We can write these on index cards.
  - 18 environment cards: similarly, numbers from 1 to 10 (integers). Again, uniform.

  Round 1:
  - Each participant draws one genotype card and one environment card.
  - They compute X = G + E.
  - They write down their G and X on a shared sheet (or call out to facilitator who records in a spreadsheet).
  - Facilitator computes:
        mean_G = average of G
        mean_X = average of X
        V_G = sum of (G_i - mean_G)^2 / (n-1)   [sample variance]
        V_X = sum of (X_i - mean_X)^2 / (n-1)
        h^2 = V_G / V_X

  Round 2:
  - Facilitator collects all environment cards and gives everyone a fixed environment card (e.g., E=5).
  - They compute new X = G + 5.
  - Record new X values.
  - Compute new V_X (which should equal V_G, because now X = G + constant) and h^2 = V_G / V_X = 1.

  Round 3:
  - Split the participants randomly into two groups (Group A and Group B).
  - Group A gets environment E=2, Group B gets E=8.
  - They compute new X: Group A: X = G+2, Group B: X = G+8.
  - Record all X values and group membership.

  Now, we compute:
     a) Within Group A: 
          V_X_A = variance of X in A -> should equal V_G_A (variance of G in A). Since E is constant, h^2_A = 1.
          Similarly for Group B: h^2_B = 1.
     b) Between-group difference: 
          mean_X_A = mean_G_A + 2
          mean_X_B = mean_G_B + 8
          The difference: (mean_G_B + 8) - (mean_G_A + 2) = (mean_G_B - mean_G_A) + 6.
          Since the groups were randomly assigned, we expect mean_G_A ≈ mean_G_B, so the difference is about 6, due entirely to environment.
     c) For the entire room: 
          V_G = variance of G for all (should be similar to round 1)
          V_X = variance of X for all (which now includes the between-group variation)
          h^2 = V_G / V_X -> which will be less than 1 and less than the round 1 value.

  Debriefing points:

  - Round 1: This is the baseline heritability. It is a snapshot of the current population. If we change the environment distribution, heritability can change (as we saw in rounds 2 and 3).

  - Round 2: We made the environment uniform. Heritability became 1. This shows that heritability is a ratio of variances and when we reduce environmental variation, the ratio of genetic variance to total variance increases. But note: the average trait value changed? It depends on what fixed E we used. If we used E=5 and the original mean E was, say, 5.5, then the average X might have shifted a bit. But the main point: even with high heritability (1), we can shift the trait by changing the environment (as we did by setting E=5 for everyone). Also, if we had set E to a different value, the average would shift even more.

  - Round 3: 
     - Within each group, heritability is 1. This shows that within a group, the variation is entirely genetic. 
     - But the difference between the groups is entirely environmental (because the genetic distributions are similar). 
     - However, if we compute heritability for the entire population, it is lower because the total variance now includes the environmental difference between groups. This is a key point: high heritability within groups does not mean that between-group differences are genetic.

  - General: The exercise shows that heritability is a population statistic that depends on the current variances. It does not measure the causal strength of genes in an absolute sense. For example, in round 2, the environment was set to a constant, so genes were the only source of variation. But in round 3, the environment was the source of the group difference. The same genes can lead to very different outcomes in different environments.

