prompt: |-
  Ok so my mate's been banging on about Godel again and I want a straight answer out of you lot, cos we're going round in circles.

  His claim, roughly, is this: the incompleteness result isn't just a curiosity about arithmetic. Take any rule-system that (a) is consistent, (b) can be specified by an effective procedure so there's no mystery about what its rules are, and (c) is rich enough to encode facts about its own rules and how they apply. He reckons such a system will always contain rulings that are correct by the system's own lights but can't be derived from it. He thinks this applies to legal codes, constitutions, the internal rulebooks of big organisations, and the safety rules we try to write for AI systems. I think he's half-right at best.

  Give me your own credence that his generalised claim is true, and decompose it. I want the sub-questions it actually hinges on, a rough number for each, one line of justification per number, and then how they combine into the final figure. The ones I can see are: whether the sort of rule-system he's pointing at really can meet the arithmetic-strength condition rather than just looking vaguely similar; whether a Godel sentence for, say, a legal code is itself a genuine legal ruling or just a self-referential artefact that the system has no business recognising; whether the underivability even bites given that real systems have judges, discretion, and rules about how to change the rules; and whether the whole thing is just a fancy restatement of the boring point that no finite rulebook anticipates every case. Add any sub-question you think I've missed and drop any I've listed that you think is a red herring.

  I'm sitting at about 0.6 on it, my mate is at 0.95, and a third friend who thinks the whole analogy is vacuous is at 0.15. Tell me which of us two you think is furthest off and which sub-question our disagreement most likely lives on. Then say which single sub-question your own number is most sensitive to and what would actually move it.

  Write it in British English please.
