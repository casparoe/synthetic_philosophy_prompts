  Hmm. User's missed something big: expressive sufficiency. Can a legal system actually encode syntax, proofs, etc., like arithmetic does? That's probably the biggest hurdle. Also, the "genuine ruling" point feels secondary—Gödel sentences are inherently meta, so forcing them into "rulings" might be category error. Discretion/amendment mechanisms do blunt the bite, but incompleteness is deeper than patchability. 

