  First, the user encountered three deployments: scientific realism, "true for him" in personal beliefs, and truth relativism. They need each interpretation analyzed for plausibility, what "works" means, and which deployments it licenses. Also, they want the Peirce-James split clarified and their cash-register test addressed.

  I recall that Peirce focused on meaning clarification through practical consequences, while James linked truth directly to usefulness. Peirce's long-run convergence contrasts with James's individual belief utility. The user mentioned Peirce renaming his view to distance from James, so highlighting that distinction is key.

  For the menu, I should categorize interpretations from least to most controversial. Starting with uncontroversial meanings like semantic clarification, then moving to epistemic criteria, definitions of truth, and finally relativist views. Each should specify "works" parameters and applicability to the three deployments.

  The cash-register test seems to align with James's individual expediency. The user suspects this is problematic. Explaining why "true for him" is a category error involves distinguishing between usefulness and actual truth. Peirce's long-run view avoids this by focusing on community consensus over time.

  I need to ensure each point addresses the user's need for quick reference in seminar. Separating Peirce and James's positions clearly will help counter the classmate's name-dropping. Also, noting which deployments each interpretation supports will show where the classmate overextends pragmatism.

  Finally, preparing counterarguments using Peirce's objections to James could strengthen the user's position. Emphasizing that James's view leads to relativism while Peirce's doesn't might undercut the classmate's third deployment. The user wants ammunition, so concise, impactful points are essential.
answer: |-
  Here's your pragmatic counter-menu, structured for seminar deployment. Each entry dissects "truth = what works" into distinct interpretations, with clear assessments and applications to your classmate's moves.

  ---

  ### **The Pragmatic Truth Menu: Interpretations & Implications**

  #### **1. Semantic Clarification (Peircian Meaning-Test)**  
  - **Claim**: Truth claims aren't meaningful unless we can specify their *observable practical consequences*. If two ideas have identical consequences, they are functionally equivalent.  
  - **Platitude/Defensible?**: Defensible (Peirce's original maxim). Clarifies concepts but doesn't define truth.  
  - **"Works" Means**: Testable predictions/effects in experience. Not "usefulness" but "what difference would this make?"  
  - **Licenses Which Moves?**:  
    - *Deployment 1 (Science)*: ✅ Legitimate. Debating "real existence" of unobservables *is* word games if consequences are identical.  
    - *Deployment 2 ("True for him")*: ❌ No. Beliefs about partners have testable consequences (e.g., "would never leave" is falsifiable).  
    - *Deployment 3 (Relativism)*: ❌ No. Peirce insisted truth is *convergent* across investigators.  

  #### **2. Epistemic Criterion (Jamesian Practical Justification)**  
  - **Claim**: A belief's *justification* comes from its practical success in solving problems, guiding action, or improving life. Useful beliefs are *warranted*.  
  - **Platitude/Defensible?**: Defensible (James's core epistemology). Most philosophers accept utility as *evidence*, not as truth itself.  
  - **"Works" Means**: Satisfies human needs (cognitive, emotional, social) for the believer/community. Short-to-medium term.  
  - **Licenses Which Moves?**:  
    - *Deployment 1*: ✅ Partially. Predictive success justifies *accepting* the theory, but doesn't settle "reality."  
    - *Deployment 2*: ✅ Partially. Beliefs that improve life are *justified* for that person, but "true for him" is misleading.  
    - *Deployment 3*: ⚠️ Risky. James flirted with this but denied relativism ("The True is only the expedient *in the long run*").  

  #### **3. Ontological Definition (Radical Jamesian Instrumentalism)**  
  - **Claim**: Truth *is identical to* utility. "True" = "currently useful to believe." Truth is *made* by human satisfaction.  
  - **Platitude/Defensible?**: False/Highly Controversial (James's most criticized view). Contradicts realism, objectivity.  
  - **"Works" Means**: Immediate gratification for an individual/group. No long run, no convergence.  
  - **Licenses Which Moves?**:  
    - *Deployment 1*: ✅ But reduces science to convenient fiction.  
    - *Deployment 2*: ✅ "True for him" is literal here.  
    - *Deployment 3*: ✅ Directly implies relativism ("useful varies by community").  
  - **Peirce vs. James**: James held this occasionally; Peirce called it "a very venomous species of nonsense."  

  #### **4. Long-Run Convergence (Peircean Ideal Consensus)**  
  - **Claim**: Truth is what the scientific community *would* stably believe after infinite inquiry and testing. Utility (successful prediction/control) *guides* inquiry toward truth.  
  - **Platitude/Defensible?**: Defensible (Peirce's mature view). Avoids subjectivism.  
  - **"Works" Means**: Survives all tests across all contexts/interests over indefinite time. "Works" for the *community of inquirers*.  
  - **Licenses Which Moves?**:  
    - *Deployment 1*: ✅ "Earns its keep" *in perpetuity* suggests reality.  
    - *Deployment 2*: ❌ Beliefs based on comfort, not evidence, won't survive long-run inquiry.  
    - *Deployment 3*: ❌ Truth is *community-independent*; local "usefulness" ≠ truth.  
  - **Rescues Short-Run?**: ✅ Yes. Short-term utility ≠ truth, but points toward it.  

  #### **5. Radical Relativism (Not James or Peirce)**  
  - **Claim**: "Truth" is *nothing more* than what's useful to a person/culture right now. No convergence, no objectivity.  
  - **Platitude/Defensible?**: False/Extreme. Self-refuting (Is *this claim* "true" only if useful?).  
  - **"Works" Means**: Subjective satisfaction or cultural reinforcement. Ephemeral.  
  - **Licenses Which Moves?**:  
    - *Deployment 1*: ✅ But makes science arbitrary.  
    - *Deployment 2*: ✅ "True for him" is the only "truth."  
    - *Deployment 3*: ✅ Directly stated.  
  - **Pragmatist?**: Neither Peirce nor James endorsed this. James explicitly rejected it.  

  ---

  ### **Your Specific Queries Answered**

  1.  **Peirce/James Split**:  
      - **Peirce**: Held **#1 (Meaning-Test)** and **#4 (Long-Run Convergence)**. Rejected utility as truth definition (#3).  
      - **James**: Embraced **#2 (Epistemic Criterion)** and sometimes **#3 (Instrumentalism)**. Hedged against relativism (#5) but was ambiguous.  
      - **"Long Run Rescue"**: Only **#4** (Peirce) fully escapes short-run objections. James's "long run" was inconsistent.  

  2.  **Cash-Register Test ("True iff believing it pays off")**:  
      - **Interpretation**: Pure **#3 (Radical Instrumentalism)**.  
      - **Real Pragmatist Stuck With It?**: James sometimes talked this way (*Pragmatism* lectures), but it's his weakest, most criticized position. Peirce rejected it utterly.  
      - **Problem**: Leads to absurdity (e.g., believing you’re immortal "pays off" until you die).  

  3.  **"True for him" – Category Error?**:  
      - **Yes, always**, *except* under **#3** or **#5**. Truth is not agent-relative.  
      - **Rhetorical Work**: Under **#2**, it misleadingly expresses *justification/warrant for him*. Under **#1** or **#4**, it's nonsense.  

  ---

  ### **Seminar Ammunition Cheat Sheet**
  | **When He Says...** | **Counter With...**                                                                 |
  |---------------------|-------------------------------------------------------------------------------------|
  | **"Who cares if it's real? It works!" (Science)** | Peirce (#1/#4): Useful *now* ≠ true. Truth is long-run convergence. Debate over "real" *is* meaningful if consequences differ. |
  | **"True for him" (Confidence in partner)**        | #2: It's *justified* for him, not "true." #4: Comforting lies fail the long-run test. "True for him" is incoherent outside radical relativism (#3/#5). |
  | **"Truth is relative to what's useful to a community"** | Peirce (#4): Truth is what *all* communities *would* converge on. James (#2): Denied relativism; truth must be "expedient in the long run." |

  **Nuke Option**: "If 'truth is what works' *for you in shutting down debate*, does that make it true? Or is truth something more robust?" (Appeals to **#4** or highlights self-refutation of **#5**).
