  Okay, let me tackle this user's deep dive into Aristotle's Politics. They're stuck on the apparent inconsistency between how Aristotle judges naturalness in barter versus money. The key tension is between telos (purpose) and need as criteria, plus that intriguing idea about second-order uses.

  Hmm, the user's frustration is palpable - they've clearly wrestled with this passage repeatedly in their reading group. Their core question has two precise parts: which criterion (telos, need, or detachment from need) actually matters for Aristotle, and whether their "second-order use" theory holds water. They're not just asking for explanations but demanding an interpretive stance backed by textual evidence.

  First, about the criteria: when Aristotle says barter isn't "contrary to nature" despite violating telos, he's introducing a hierarchy. Telos matters (hence the shoe's exchange use being secondary), but need overrides it as the more fundamental natural principle. The money case confirms this - when convention severs exchange from need entirely, that's when Aristotle objects. So need is the bedrock criterion.

  Now for the user's "second-order use" theory. That's actually brilliant and textually grounded. Aristotle's phrasing about the barterer "using it as a shoe" (even in exchange) implies the underlying use-value persists through the transaction. Money's uniqueness is having only exchange-value - a pure second-order use detached from any primary function. This perfectly explains why wealth-seeking becomes unlimited with money: no natural limit (like satiety of needs) applies.

  I should emphasize how Aristotle's complaint about Midas illustrates this - gold can't satisfy hunger because it lacks primary use-value. And his "first principle and limit" description of money directly supports the idea of exchange-value operating independently.

  The user's suspicion about rhetorical "contrary to nature" language is partly right, but Aristotle isn't being inconsistent - he's building a layered argument where need anchors naturalness, and money's danger lies in severing that anchor. Their second-order theory isn't imported; it's latent in the text and resolves the apparent contradiction.
answer: |-
  You've nailed the core tension in this passage. Let's cut through the ambiguity with a firm stance on both questions:

  **1. The Load-Bearing Criterion: Detachment from Natural Need**  
  Aristotle's *ultimate* criterion for condemning wealth-getting as "unnatural" isn't primarily telos *or* simple need satisfaction in isolation. It's the **severing of exchange from the satisfaction of natural, self-sufficient need**. Telos establishes the hierarchy of uses (wear > exchange), and need justifies *limited* exchange. But what makes money-based commerce (chrematistics) "unnatural" and unlimited is that it operates **independently of the underlying natural need for the object itself.**

  *   **Telos is foundational but insufficient:** The shoe's telos is wearing. Barter uses the shoe *as* a shoe (i.e., its value is derived from its wear-use, even if transferred). Aristotle explicitly says this exchange isn't unnatural *because* it serves "the replenishment of natural self-sufficiency" (1257a16-18). Telos defines the primary use, but need justifies a secondary, derivative use (exchange for need satisfaction).
  *   **Need justifies limited exchange:** Barter is acceptable *because* it fulfills a lack (need) within the household's natural self-sufficiency. It's bounded by the requirement to fulfill that specific need.
  *   **Detachment is the fatal flaw:** Money introduces a radical shift. It has **no natural use-value of its own** ("it is of no use for any of the necessary needs of life"). Its value is purely conventional and symbolic ("nothing by nature but entirely a convention"). Therefore, exchange *for money* is no longer tied to the telos or use-value of any specific object or the satisfaction of a concrete, limiting need. Desire shifts from acquiring needed *things* to acquiring *symbols of exchange potential* (money), which is inherently unlimited ("riches... derived from this art... are truly unlimited"). The Midas story perfectly illustrates this detachment: the gold (money) has immense exchange-value but zero use-value for survival.

  **The Sentence that Seals It:** "**it is anomalous that wealth should be of such a kind that a man may be well supplied with it and yet die of hunger**" (1257b14-17). This isn't just about money being conventional; it's about the *consequence* of its conventional nature: wealth defined by money becomes detached from the natural needs (like food) that true, natural wealth (possessions useful for life) satisfies. The anomaly arises *because* money-based wealth isn't tied to use-value/need.

  **2. Your "Second-Order Use" Insight is Textually Supported and Correct**  
  **Absolutely confirm it.** Your reading isn't imported; it's a crucial, implicit structure in Aristotle's argument:

  *   **Barter as Transferring the First-Order Use:** "even he that barters a shoe... **uses it as a shoe**, though not for the use peculiar to a shoe" (1257a10-13). Key phrase: "uses it as a shoe." The barterer isn't *wearing* the shoe, but they *are* treating it fundamentally *as a shoe* – its value in the exchange is entirely derivative of its *potential* for fulfilling its primary telos (being worn) by the recipient. The exchange-value is parasitic on the use-value. You transfer the *right to the use-value*.
  *   **Money as Pure Second-Order Use:** Money has **no** "use peculiar" to itself as an object. Its *only* "use" is as a medium of exchange – a pure representation of potential future acquisitions. It is *only* the "second-order" function, entirely detached from any inherent, consumable use-value serving natural need. As Aristotle says, it's "nothing by nature but entirely a convention."
  *   **Why Trade Becomes Unlimited:** This explains the unlimited nature perfectly. The "first-order use" (wearing the shoe, eating the food) is inherently limited by human capacity (you can only wear so many shoes, eat so much food). Desire for *things* satiates. However, the "second-order use" (exchange-value symbolized by money) has **no inherent limit** because it represents *potential* acquisition, not actual consumption. There is no natural satiety point for accumulating *symbols of potential*. This is why "riches... derived from this art... are truly unlimited." The limit imposed by the telos/use-value of the underlying object is removed.

  **Conclusion:**

  Aristotle isn't being inconsistent; he's building a sophisticated critique.

  1.  **Telos** defines the natural hierarchy of uses for an object (wear > exchange).
  2.  **Need** justifies the secondary, derivative use (exchange) *as long as* it serves the replenishment of natural self-sufficiency, making it "not contrary to nature."
  3.  **Detachment from Need/Use-Value** is the core criterion condemning money-based wealth-getting. Money severs exchange from its anchor in natural need and the use-value/telos of objects. Its value is pure convention, existing only for further exchange.
  4.  **Your "Second-Order Use" Model** is essential and textually grounded. Barter involves transferring the right to the first-order use-value. Money *is* the institutionalization of pure second-order use (exchange-value). This pure exchange-value, detached from the natural limits imposed by satiable needs and the specific telos of consumable objects, is why the desire for money-based wealth is "truly unlimited." Aristotle's complaint *is* fundamentally about the objects and their relationship to need, but the mechanism enabling the perversion is the creation of a symbolic system (money) that operates independently of those objects and needs. The "contrary to nature" language targets this specific detachment, not exchange itself.
