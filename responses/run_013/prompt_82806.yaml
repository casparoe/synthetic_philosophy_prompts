  Okay so background: I'm a third-year joint philosophy and cognitive science student, and I'm in this ethics course on well-being right now where we spent a whole seminar on what my professor calls the heterogenity problem for hedonism — the worry that an orgasm, the relief when a toothache finally stops, the pleasure of a proof clicking, laughing at your friend's joke, a hot bath after a freezing walk, seem to have nothing in common, and hedonism can't just say well-being is pleasure and the absence of pain unless it can say what the common thing actually is. Fine. The other half of my degree is more or less reinforcement learning, so my head is full of reward, reward prediction error, model-based vs model-free, wanting vs liking from the addiction module, temporal discounting, all of that. What I want is for you to take the three moves I've seen hedonists make and restate each one in that vocabulary as faithfully as you can, seperate, one by one. Move one: pleasures share a distinctive felt quality, a certain kind of feeling-tone that all and only pleasures have. Move two: pleasure isn't a feeling at all, it's taking pleasure in something, an attitude you take toward a state of affairs that might not even be happening. Move three: the only thing they share is that they come in degrees of pleasantness and those degrees can be added up, which is the one that lets you do the arithmetic. For each of them, tell me what translates cleanly into reward-learning terms, what you had to fudge or stretch, and then the part I actually care about, what has no counterpart at all. My suspicion is that the scalar reward signal just assumes the answer to the heterogeneity problem rather than earning it, and that hedonists would kill for a scalar like that, but I can also see the flip side, that maybe the thing they're after isn't a shared intrinsic quality but a shared functional role, and that my vocabulary can say that fine while it's the hedonists who are muddled. So give me your honest read on where the residue falls: is it something my framework can't express, or something that was never as clear as it sounded. I dont need a reading list or citations, just the argument. And could you write it as continuous prose, no headings, bullets, bold or tables, just paragraphs like an email, I print these out and read them on the bus. Sorry for the wall of text.
