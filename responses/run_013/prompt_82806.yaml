  Move Two (attitudinal pleasure) maps neatly to model-based valuation - those top-down cognitive appraisals divorced from immediate experience. The fudge is that RL treats this as just another input to the reward signal, not a separate ontological category. The true gap is philosophical: attitudinal theories want a stance that could in principle exist without any affect, while RL always ties back to some reward signal.

  Move Three (purely scalar) is where things get spicy. The clean fit is perfect - RL's reward signal is literally a common currency scalar. But that's exactly where the user's suspicion kicks in: this doesn't solve heterogeneity, it presupposes it's solved. The residue is huge here - all the philosophical work of justifying why these diverse experiences belong on one scale is absent in RL. RL just operationalizes the scale; it doesn't validate it.

