  Final thought: The user's sharp observation about scalar reward signals "assuming the answer" hits home. RL provides the perfect functionalist solution, which ironically shows that the hedonist's original phenomenological concerns might be misplaced - or at least, that functional equivalence might be all we can get. The residue isn't RL's limitation so much as a revelation about the nature of the problem itself.
answer: |-
  Right, printing this out for the bus ride makes sense. Let's tackle those three hedonist moves through the lens of your reinforcement learning (RL) toolkit – reward signals, prediction errors, wanting/liking, etc. – and see where the translations hold, strain, or hit a wall. Your suspicion about the scalar signal is spot on and is where things get most interesting.

  **Move One: Shared Felt Quality.** Translating the idea that all pleasures share a distinctive intrinsic feeling-tone is tricky. The cleanest fit is with the concept of the **'liking' reaction** (as opposed to 'wanting'). This refers to the core, relatively immediate, hedonic impact – the 'yumminess' of sugar, the warmth of the bath, the relief when pain stops. Neuroscience points to specific, albeit distributed, neural substrates (like opioid and cannabinoid systems in hotspots) generating positive affective reactions across diverse stimuli. So, the 'feeling-tone' maps reasonably well to this evolved biological mechanism for generating positive affect, a kind of primal 'good' signal triggered by various inputs. Where you have to fudge is the *unity* part. The heterogeneity problem bites because the *subjective experience* of intellectual satisfaction feels fundamentally different from sensual warmth. RL/neuro can show overlapping or shared neural *circuitry* generating positive affect, but it doesn't magically make the *phenomenology* identical. Different inputs (a proof clicking vs. warm water) engage different sensory and cognitive pathways *before* converging on reward systems. The residue, the thing RL *can't* express, is the *intrinsic, identical qualitative feel* across all pleasures. RL explains *why* diverse things feel *good* (they engage the liking system), but it doesn't make the *way* they feel good *subjectively the same kind of thing*. It describes the mechanism generating positive valence, not the supposed single, universal qualia of 'pleasureness'.

  **Move Two: Attitudinal Pleasure.** The idea that pleasure is an attitude – taking pleasure *in* something, even non-occurring states – translates surprisingly well into specific RL concepts. This maps cleanly onto **model-based valuation** and **reward prediction**. When you take pleasure *in* the *idea* of your future vacation, you are simulating a future state using your world model and assigning it a high expected value (positive reward prediction). The 'attitude' is the cognitive act of appraisal and valuation performed by the model-based system. The pleasure lies in the positive *evaluation* itself, the high scalar value assigned to that representation, not necessarily in a concurrent feeling. The wanting/liking distinction also plays a role here: you can cognitively *want* (desire) and value (high predicted reward) the future state without immediate 'liking'. Where the fudge happens is that RL fundamentally grounds these valuations, even model-based ones, in *past* experiences of 'liking' or reward. The value signal, even for abstract ideas, is ultimately calibrated against primary rewards or learned associations. The valuation *is* the signal, but hedonists proposing this move might want to separate the attitude more cleanly from any affective state *at all*. The big residue is the potential *detachment*. Could you have this 'attitudinal pleasure' completely dissociated from *any* capacity for 'liking' or reward? Could a system *only* do model-based valuation of abstract states with high positive value signals but have *zero* affective response, even potentially? RL frameworks generally assume the reward signal has motivational and/or affective force – it drives learning and behavior. A purely cold, affectless 'taking pleasure in' might have no direct counterpart; the scalar reward signal intrinsically implies *some* motivational/affective role, even if deferred.

  **Move Three: Scalar Pleasantness.** This is the friction point you identified. The move that pleasures only share being positive scalars that add up maps **perfectly cleanly** onto the core RL concept of the **scalar reward signal (R)**. This is the fundamental common currency. Whether it's the immediate 'liking' from the bath, the prediction error relief when pain stops (positive RPE), or the high expected value assigned to understanding a proof (model-based prediction), they all contribute a positive value to the *same* cumulative signal that drives learning (updating value functions) and behavior (policy selection). Temporal discounting handles the 'adding up' over time. This is precisely what RL provides: a single, quantitative axis of value. The hedonist dream of a common metric is realized here functionally. But here's your crucial point: **The RL framework *assumes* this scalar solves the heterogeneity problem by fiat; it doesn't *earn* it phenomenologically.** It provides the functional common currency – the thing diverse events have in common *is* their impact on this signal (how much they increase R or V(s)). What gets completely **fudged or stretched** is the *justification* for putting such diverse experiences on the *same* scale. Why *should* the relief from toothache cessation and the joy of a friend's joke contribute to the *same* sum of well-being? RL just operationalizes it. It *sidesteps* the heterogeneity problem by defining the commonality *as* the scalar value impact. The **massive residue** is the *philosophical justification* for why this functional common currency (which RL beautifully describes) corresponds to the *normative* common currency of well-being. RL shows *how* diverse inputs get translated into a scalar, but it doesn't tell us *why* aggregating *that particular scalar* constitutes well-being, especially when the underlying experiences feel so different. It provides the mechanism, not the normative argument.

  **Where the Residue Falls:** Your framework can express the *functional* unity brilliantly – the shared role in generating a positive reward signal, driving learning, motivating behavior. It handles wanting vs. liking, immediate vs. predicted rewards, and the scalar summation perfectly. The residue – the thing your framework *can't* express and exposes – is the **assumed leap from functional role to intrinsic phenomenological unity or normative justification**.

  *   For Move One, it shows the biological mechanism for 'good' but can't make the qualia identical.
  *   For Move Two, it models the valuation process but struggles with completely affectless 'attitude'.
  *   For Move Three, it provides the scalar machinery but reveals that the heterogeneity problem was *never* really about finding a functional common currency – RL has that – but about the *philosophical worry* that such diverse experiences *shouldn't* be treated as fungible contributions to a single sum of well-being, *despite* their shared functional role. The scalar signal doesn't resolve that worry; it embodies it.

  Your vocabulary clarifies that what hedonists often *seek* (a shared intrinsic feeling) might be chimerical, and what they *need* for their arithmetic (a common scalar) exists functionally. But it also starkly reveals that the functional role doesn't automatically bestow normative unity. The 'muddle' might lie in conflating the functional necessity of a common currency in learning systems with the philosophical question of whether that currency truly captures the essence of diverse positive experiences for well-being. The residue isn't a failure of your framework; it's the framework illuminating the philosophical tension.
