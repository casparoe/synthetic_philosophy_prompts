prompt: |-
  I'm a backend dev with no philosophy background, and I keep seeing people cite Dennett's Quining Qualia as if it killed off the whole idea of qualia. The part I cant get past is the coffee-taster example with Chase and Sanborn. Two coffee tasters both say their palate got more refined, but after the change one reports that coffee now tastes worse to him and the other reports that it tastes better. Dennett seems to think this shows you can't cleanly separate a change in the taste itself from a change in how much you like it, so the idea of a private what-it's-like fact that could settle which one really changed is bogus. Can you walk me through the actual argument step by step in plain terms? Specifically, why can't we just say their qualia changed in opposite directions? And is there a decent comeback to Dennett here, or does the coffee case really make qualia incoherent? I don't need a reading list, just the logic.
