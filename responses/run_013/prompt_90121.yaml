  We built the schools and paved the roads in hope.  
  More graduates than ever fill the halls.  
  The state collects its taxes, but the gold is thin.  
  The rent has doubled on my crumbling walls.  

  More graduates than ever fill the halls.  
  They queue for posts that vanished overnight.  
  The rent has doubled on my crumbling walls.  
  My friend returned to live with his parents.  

  They queue for posts that vanished overnight.  
  Our landlord hoards the grain behind new gates.  
  My friend returned to live with his parents.  
  The budget speech ignored the broken gates.  

  Our landlord hoards the grain behind new gates.  
  The streets are loud with stories left untold.  
  The budget speech ignored the broken gates.  
  A hundred polished resumes for one posting.  

  The streets are loud with stories left untold.  
  The palace guard now triples at the doors.  
  A hundred polished resumes for one posting.  
  We built the schools and paved the roads in hope.  

  The state collects its taxes, but the gold is thin.  
  We built the schools and paved the roads in **vain**.  

