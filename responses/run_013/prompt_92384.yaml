  ---

  ### **Decision Tree: Market Epistemology from No-Trade Theorem**

  1. **Does the no-trade theorem’s *common-prior assumption* hold as a harmless idealization in real markets?**  
     - **Yes** → Go to 2  
     - **No** → Go to 5 *(Differences in priors drive trade; theorem avoids core dynamics)*  

  2. **In a common-prior world, do prices instantly reflect *all* available information?**  
     - **Yes** → Go to 3 *(Strong-form efficiency)*  
     - **No** → **Hayekian dispersed-knowledge** *(Prices aggregate decentralized info through dynamic trading)*  

  3. **Can rational agents profit from *new* information in an efficient market?**  
     - **Yes** → Go to 4 *(Prices aren’t perfectly efficient yet)*  
     - **No** → Go to 8 *(Perfect efficiency eliminates profit motives)*  

  4. **Is the market price best interpreted as a *probability* (e.g., of an asset’s true value)?**  
     - **Yes** → **Efficient-markets/rational-expectations** *(Prices = unbiased truth-tracking estimates)*  
     - **No** → **"Prices are coordination devices, not credences"** *(Prices balance supply/demand; guide action, not truth)*  

  5. **Are differences in priors primarily driven by *asymmetric information* (not worldview/power)?**  
     - **Yes** → Go to 6 *(Trade stems from hidden knowledge)*  
     - **No** → Go to 7 *(Trade stems from bias/power)*  

  6. **Do prices reliably *aggregate dispersed information* despite divergent priors?**  
     - **Yes** → **Hayekian dispersed-knowledge** *(Prices sync decentralized knowledge via trade)*  
     - **No** → **"Prices are coordination devices, not credences"** *(Prices resolve uncertainty via equilibrium, not truth)*  

  7. **Is trade mostly driven by *cognitive biases* (e.g., overconfidence)?**  
     - **Yes** → **Behavioral "no-trade assumes away the phenomenon" camp** *(Theorem ignores irrationality)*  
     - **No** → **Political-economy "markets track power not truth" camp** *(Prices reflect coercion/privilege)*  

  8. **Can efficient markets *persist* without incentives to gather information?**  
     - **Yes** → **Efficient-markets/rational-expectations** *(Info arises exogenously; prices self-correct)*  
     - **No** → **"Efficiency and the incentive to acquire info are in tension" view** *(Efficiency undermines its own foundations)*  

  ---

  ### **Key Notes on the Tree**
  **Unseparated Leaves**:  
  - **Hayekian** and **Coordination** leaves appear in multiple branches (nodes 2/6 and 4/6). The tree *cannot fully distinguish* these if agents reject strong-form efficiency (node 2) but accept information aggregation (node 6). Both camps overlap on prices coordinating action, but Hayekians emphasize *truth-tracking* while Coordinationists reject it.  
  - **Behavioral** and **Political-economy** are cleanly separated by node 7 (cognitive bias vs. structural power).

  **Empty/Unexplored Branches**:  
  - **Node 6 → "No"**: If priors diverge due to information (node 5=Yes) but prices *fail* to aggregate it (node 6=No), the branch has no leaf. This is *unexplored* in literature—no major camp argues prices *both* ignore information *and* lack coordination/power functions.  
  - **Node 8 → "Yes"**: Arguably *incoherent*. If no incentive exists to gather info (node 3=No), claiming efficiency persists (node 8=Yes) violates rational expectations. Only fringe "free info" models go here.  

  **Why Leaves Land Where They Do**:  
  - **Efficient-markets**: Requires common priors (node 1=Yes), instant info aggregation (node 2=Yes), and dismisses info-acquisition paradox (node 8=Yes) or profit incentives (node 3=No → node 8=Yes).  
  - **"Tension" view**: Accepts efficiency (node 2=Yes) but acknowledges its self-undermining incentive problem (node 3=No → node 8=No).  
  - **Behavioral**: Rejects common priors (node 1=No) and attributes trade to bias (node 7=Yes).  
  - **Political-economy**: Rejects common priors (node 1=No) and attributes trade to power (node 7=No).  
  - **Coordination**: Emerges when prices aren’t probabilities (node 4=No) *or* fail to aggregate info (node 6=No).  
  - **Hayekian**: Dominates when common priors hold but strong-form efficiency fails (node 2=No) *or* dispersed info is aggregated despite divergent priors (node 6=Yes).

