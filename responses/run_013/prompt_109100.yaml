  Biggest potential conflict is between NFL's "no best learner" claim and science's apparent success. The resolution lies in recognizing that science works precisely because its methods encode good domain-specific assumptions (like spatial/temporal uniformity). Mildest tension is between Bayesian updating and simplicity - they're actually complementary when priors favor simpler models.

