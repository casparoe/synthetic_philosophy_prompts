prompt: |-
  I'm a philosophy PhD student working on moral psychology, and I keep generating verdicts about when an action has moral worth without being able to make them add up to a principle. Please act as an expert on the moral worth of action, reason carefully through each case before generalising, and begin by brainstorming the candidate principles that could generate the pattern below before you commit to one. I'm not asking for a literature review; I want to know what to say.

  My verdicts:

  1. A pharmacist charges fair prices and never overcharges, because overcharging would ruin a reputation that is worth money to him. What he does is right, and has no moral worth at all. He is not, however, a bad person.

  2. A passer-by pulls a drowning child out of a canal on pure unreflective panic and sympathy, without a moment's thought about duty or reasons. This strikes me as a paradigm of moral worth, about as admirable as conduct gets.

  3. A soldier helps a comrade desert, because he cannot bear to see him shot, while believing throughout that desertion is wicked and that he is doing something vile. I want to say the act was wrong and yet that he is admirable in a way that has something to do with morality.

  4. A woman gives a tenth of her income to the poor, as she was raised to, never having questioned it; not doing it would strike her as unthinkable and faintly frightening. This has less worth than 2 but more than 1, and I cannot defend that ordering.

  5. A man takes a pill that makes him markedly more compassionate, then keeps a costly promise to a stranger out of the compassion it induces. I do not think the worth of his act is reduced — yet in 2 I seemed to be crediting the sympathy itself rather than any endorsement of it.

  6. A woman keeps a promise at considerable cost largely because breaking it would destroy her self-image as someone who keeps promises. I want to call this genuine moral worth, though it is as self-directed as 1.

  7. Someone visits a dying friend out of love, but also reminds herself on the way that it is her duty, and feels a little pleased with herself for doing it. I find this slightly worse than the same visit without the reminder — which sits badly with 3, where the agent's moral convictions are entirely wrong and yet the act still seems admirable.

  My tentative principle was that the moral worth of an act is the extent to which it is explained by the agent's grasp of the moral reasons actually in play. I can see it failing on 3, and perhaps on 5.

  Give me the principle, or the smallest set of principles, that captures as many of these verdicts as possible. State it precisely, identify the case that motivates each clause, and say plainly which verdict it forces me to give up. Then tell me what it implies for two or three further cases that you choose because they discriminate between your surviving candidates. I also suspect I have been running two questions together: say whether one principle can cover both the worth of acts and the worth of persons, or whether I need separate accounts. Be committed — pick a principle and defend it rather than laying out the options. Please answer in British English.
reasoning: |-
  Okay, this is a fascinating challenge from a philosophy PhD student working on moral psychology. They've presented seven nuanced cases where their intuitive verdicts on moral worth don't neatly align with existing theories, and they're struggling to formulate a coherent principle. 

  First, I notice they're explicitly rejecting a literature review approach - this isn't about Kant or Aristotle but about systematizing their own judgments. That's refreshing. Their tentative principle (moral worth tied to grasp of actual moral reasons) clearly fails for case 3 where the soldier acts against his moral convictions, and possibly case 5 with the compassion pill.

  Looking at their verdicts: 
  - Case 1 (profit-motivated pharmacist) has zero moral worth despite right action
  - Case 2 (unreflective rescue) is peak moral worth
  - Case 3 (conflicted soldier) has paradoxical worth despite wrong action
  - Case 4 (habitual charity) has moderate worth
  - Case 5 (chemically-induced compassion) has undiminished worth
  - Case 6 (self-image promise) has full worth
  - Case 7 (duty-reminded visit) has slightly reduced worth

  The tensions stand out: Why does unreflective sympathy (2) get full credit while habitual charity (4) gets less? Why does self-image motivation work in 6 but not 1? And how can wrong actions (3) have moral worth at all?

  Hmm... their intuition seems to track something about motivational force rather than correctness. The pharmacist's motivation is purely instrumental (reputation for profit), while the panic rescuer's is visceral and immediate. The soldier case suggests that acting from deep care can be admirable even against judgment. The compassion pill case implies the source of motivation might not matter if the drive itself is moral.

  I'm leaning toward a principle centered on the nature of the motivating desire rather than cognition about reasons. But it must explain why the duty-reminded visit (7) loses points while the self-image promise-keeping (6) doesn't - both involve self-regard. Perhaps the distinction is whether the self-concern reinforces or distracts from the other-directed motive?

  For case 4, the habitual giver's motivation seems less intense or personal than the rescuer's, which might explain the difference in worth. But intensity feels slippery as a criterion...

  The real puzzle is separating act-worth from agent-worth. In case 3, the act is wrong but the agent's compassion gives him moral credit. This suggests we need two distinct evaluations. Maybe the principle should focus on the quality of motivation for act-worth, while agent-worth could include dispositions beyond the act?

  After wrestling with this, I'll propose a dual-aspect view: Moral worth of acts stems from being non-instrumentally motivated by features that make the act morally significant, while agent-worth concerns responsiveness to moral considerations more broadly. This handles case 3 by separating act-wrongness from agent-admirability, explains case 7's demerit (duty-reminding dilutes direct concern), and preserves case 5's worth (the compassion still targets the right features). 

  For case 4's middle ranking, we might say habitual motivation engages moral concerns less robustly than reflective or emotional engagement. Case 1 fails because reputation is instrumental to profit, not intrinsically tied to fairness. Case 6 works because "being a promise-keeper" directly engages fidelity's moral core.

  The two test cases I'd add: First, someone who helps from sheer duty with no sympathy but full conviction (Kant's grocer) - should have act-worth but less agent-worth than the sympathetic rescuer. Second, someone acting from manipulated beliefs (e.g., saving a child they falsely think is theirs) - motivation targets morally relevant features but cognitively distorted, so perhaps diminished worth.

  This approach demands surrendering the intuition that case 3's act has moral worth - it doesn't, but the agent does. That might be the necessary compromise. The principle prioritizes motivational structure over correctness, depth over reflection, and separates act/agent evaluations where needed.
answer: |-
  After careful analysis of your seven cases, I propose this dual-aspect principle to capture your verdicts while resolving the tensions:

  **The Moral Worth of an act is determined by the extent to which it is motivated *non-instrumentally* by the *morally salient features of the situation itself*, rather than by the agent's beliefs about morality or self-referential concerns. The Moral Worth of a *person* (in an act) additionally requires that their motivation reflects a *reliable disposition* to respond appropriately to morally salient features.**

  **Key clauses explained:**
  1. **"Motivated non-instrumentally"** (Cases 1, 6, 7):  
     - Rules out the pharmacist (Case 1) whose fairness is purely instrumental to reputation/profit.  
     - *Saves* Case 6: Keeping the promise *is* constitutive of her self-image; the morally salient feature (fidelity) isn't a mere tool.  
     - *Saves* Case 7’s demerit: The duty-reminder and self-satisfaction introduce instrumental self-regard ("I must do this *to be* virtuous"), diluting direct focus on the friend’s plight.

  2. **"By the morally salient features themselves"** (Cases 2, 3, 5):  
     - Explains Case 2: The passer-by acts directly from sympathy for the child’s suffering (the salient feature).  
     - *Saves* Case 3’s partial worth: The soldier is motivated by his comrade’s suffering (salient feature), *not* his false belief that helping is "vile." The act is wrong (due to consequences), but his *response to suffering* is admirable.  
     - *Saves* Case 5: Compassion pill or not, he acts from direct concern for the stranger (salient feature). The source doesn’t negate this.

  3. **"Reliable disposition" for agent-worth** (Cases 3, 4):  
     - Case 3: The soldier’s compassion reflects a reliable disposition to respond to suffering, granting *agent*-worth despite wrong action.  
     - Case 4: Habitual giving shows *some* reliability in responding to need (salient feature), but less than Case 2’s visceral sympathy. Hence *act*-worth > Case 1 but < Case 2.  
     - *Resolves the Case 4 ordering*: Her motivation is non-instrumental but *passive*; she responds to need out of habit, not deep engagement. Less robust than Case 2’s immediacy.

  **Verdict you must surrender:**  
  - **Case 3’s act cannot have moral worth** under this principle. The act is wrong (fails moral permissibility), but the *agent* has moral worth because his motivation reflects a reliable disposition to compassion. This separates act-worth (requires rightness + proper motivation) from agent-worth (can apply in wrong acts).

  **Why one principle cannot cover both act and agent:**  
  - Act-worth demands *success*: motivation must target *actual* salient features *in a right action*.  
  - Agent-worth demands *sensitivity*: motivation must reflect a disposition to detect and respond to salient features, even if misguided (Case 3) or passive (Case 4).  
  - Merging them forces contradictions (e.g., endorsing Case 3’s act as "worthy" while calling it wrong).

  ---

  **Test Cases Applying the Principle:**  
  1. **The Calculated Rescuer:**  
     *A mountaineer saves a rival from a crevasse solely because the rival owes her money. She feels no sympathy.*  
     - **Verdict:** Right act, zero moral worth (motivated instrumentally by debt, not salient feature of peril). Agent lacks moral worth here.  
     - *Discriminates*: Confirms that "non-instrumental" is necessary (cf. Case 1).

  2. **The Repentant Bigot:**  
     *A man raised to despise Group X saves a drowning member of Group X. He acts from immediate horror at their suffering, despite believing (via indoctrination) that Group X deserves harm. He later questions his belief.*  
     - **Verdict:** Act has moral worth (motivated by suffering, the salient feature). Agent has moral worth (disposition to compassion overrides false belief).  
     - *Discriminates*: Shows motivation can target salient features *against* belief (aligns with Case 3’s agent-worth).

  3. **The Duty-Bound Donor:**  
     *A person donates a kidney to a stranger purely from abstract duty, feeling no empathy. They correctly judge it’s morally required.*  
     - **Verdict:** Act has moral worth (non-instrumental motivation by salient feature: saving a life). Agent has moral worth, though less than if empathy were present (reliability is cognitive, not affective).  
     - *Discriminates*: "Salient features" need not be emotional (unlike Case 2). But agent-worth is gradable based on dispositional depth.

  ---

  **Defence Against Your Tentative Principle:**  
  Your "grasp of moral reasons" fails Case 3 (agent misunderstands reasons) and Case 5 (no "grasp" needed for compassion pill). My principle avoids intellectualism: motivation by salient features (e.g., suffering, promise-breaking) can be affective (Case 2), habituated (Case 4), or pill-induced (Case 5) without requiring correct *judgment*. What matters is whether the motivation *latches onto* what actually matters morally in the situation.

  **Final Formulation:**  
  > **Act-Worth Principle:** An act has moral worth iff (i) it is morally right, and (ii) it is motivated non-instrumentally by the features that make it morally salient.  
  > **Agent-Worth Principle:** An agent has moral worth in performing an act iff their motivation non-instrumentally reflects a reliable disposition to respond to morally salient features (regardless of the act’s permissibility).  

  This systematises your verdicts, explains Case 4’s middle rank, and cleanly handles Case 3’s tension. It demands surrendering act-worth for Case 3—but this is the cost of coherence. If you resist this, we must revisit whether *wrong acts* can ever have moral worth (which Cases 1 and 7 suggest they cannot). Stand by the separation: it’s the soldier we admire, not his act.
