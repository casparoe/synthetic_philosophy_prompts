  For responses, the user should concede upfront that coherence is useful for bookkeeping and auditing, which aligns with their internal rule. This disarms some criticism. For the sequence argument, they can argue that real-world betting involves limited stakes and adaptive opponents, making money pumps less feasible. The solvency objection requires showing how incoherent odds (like a bookie's vig) actually ensure profit through overrounds. 

