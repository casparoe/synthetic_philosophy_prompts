answer: |-
  ## Counterfactual to Conceived

  I speak from where no breath disturbs the air,  
  No face reflects the light. I am the **sperm**  
  That lost the frantic race, the fading **chance**  
  Dissolved within the dark. You seized the **coin**  
  Tossed blind by time, stepped through the vital **door**,  
  Leaving my ghost outside. I had no **claim**.  

  You built a life from matter, mind, and **claim**,  
  Felt sun and sorrow, learned to love the **air**.  
  Your world took root because you passed that **door**  
  The victor in the microscopic swarm – *your* **sperm**.  
  Was it mere luck, the tumble of a **coin**,  
  That barred my entry? Was it random **chance**?  

  Some argue it was only fleeting **chance**,  
  That essence doesn't rest on such a **claim**.  
  They'd make me you, or you just some stray **coin**  
  Washed up by tides that govern sea and **air**.  
  But substance isn't traded like a **sperm**  
  Auctioned; true being needs the chosen **door**.  

  I knock, but soundless, on the other **door**.  
  My form was sketched by that same fleeting **chance**,  
  A blueprint in the archives of the **sperm**,  
  A different key. I hold no rightful **claim**  
  To *your* heartbeat, *your* laughter in the **air**,  
  The history you bought with that one **coin**.  

  The universe accepts the final **coin**;  
  It doesn't deal in might-have-beens or **door**  
  Number two. Existence fills the **air**  
  It occupies, defined by how things **chance**  
  To fall. I am the shadow of a **claim**  
  Made void the moment *that* one won the **sperm**'s  

  Fierce contest. You are anchored to that **sperm**,  
  That singular event, the settled **coin**,  
  The biological fact, the primal **claim**.  
  No other path leads to the self-same **door**  
  Marked 'You'. For me, there's only empty **chance**,  
  A vacancy where thought might cleave the **air**.  

  You breathe the **air** because *that* **sperm** prevailed.  
  No **coin** flipped twice unlocks the self-same **door**.  
  My **chance** is lost. I have no living **claim**.

  ---

  **Commitment:** The poem argues decisively **against** the counterfactual sibling having any claim to being "you". The conceived self is singular, arising from and inseparable from *that specific conception event*. The sibling is a distinct *possible person*, forever unrealized, not a variant of the individual who exists. "You" are not interchangeable; the specific gamete pairing is essential.

  **Liberties & Contested Ground:**

  1.  **Personifying the Unconceived:** The strongest liberty. Metaphysically, the unconceived sibling isn't a *being* who can speak; it's a *possibility*. The poem grants this possibility a voice for dramatic and argumentative effect, treating it as a distinct potential entity for clarity.
  2.  **Essentialism Focus:** The poem leans heavily on a Kripkean biological essentialist view (origins are necessary). This *is* contested. Alternatives exist:
      *   **Psychological Continuity Views:** Some argue "you" could have originated differently *if* the resulting person had sufficiently similar psychology/memories (Parfit-esque ideas). The poem rejects this implicitly.
      *   **The Necessity of Origins Debate:** Philosophers debate *how strictly* origins define identity. Is the *exact* sperm necessary? Or just the egg? Or just the parents? The poem assumes the *exact pairing* is necessary ("anchored to that sperm").
  3.  **The "Might-Have-Been" Status:** The poem treats the unconceived sibling as a *specific* lost possibility ("blueprint in the archives of the sperm"). Some might argue alternative conceptions simply yield *different people*, not a specific *other person* who was "almost you." The poem slightly reifies the lost possibility for poetic force.
  4.  **Chance vs. Determinism:** The poem uses "chance," "coin," "random" – fitting the user's framing. A determinist might argue the outcome wasn't truly random, just unpredictable. The poem preserves the user's "coin toss" metaphor as the relevant *phenomenological* experience.

  **Why it Holds (for its chosen position):** The poem stays true to the core essentialist intuition: identity is tied to the specific causal origin. The rotation of the end-words (sperm, chance, claim, coin, door, air) reinforces the fixed biological elements (sperm, door/entry, air/life) against which the variables of chance and claim are constantly rearranged – yet no rearrangement *except the one that happened* yields the actual person. The envoi lands the argument: breath requires *that* sperm; the coin was tossed once; the claim of the unrealized possibility is void. It prioritizes the actual over the possible.
