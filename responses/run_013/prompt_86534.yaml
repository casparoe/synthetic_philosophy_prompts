  ok so ive fallen down a rabbit hole and i need help. you know the line that you couldnt have come from a different sperm and egg -- that the particular pairing that made you is essential to you, so theres a possible world with someone just like you in every respect who nevertheless isnt you, because a different swimmer got there first. fine, i can just about swallow that. but heres what keeps nagging me: there were millions of the little buggers and the one that made it is basically an accident of timing. so what do i say to the counterfactual sibling, the one who'd have turned up if number 4,672,113 had got there instead? do i get to tell him he was never going to be anyone? or does he have just as good a claim to have been me as i have? it feels like the essentialist line makes "me" rest on a coin toss, which is a strange thing for something to rest on.

  id like a sestina about this, in the voice of that never-conceived sibling, speaking to the one who made it. i want the six end-words to be the fixed furniture of the situation -- the things that stay put no matter how the poem rearranges them -- so that the rotation itself does some of the work: the same six elements coming round again in new orders, and the live question being whether any rearrangement adds up to a person or just to the same stuff shuffled differently. the envoi has to actually land the argument rather than trail off.

  please commit. pick a line on whether the sibling has any claim to have been me, and let the whole poem stand behind that rather than hedging both ways. and afterwards tell me where you had to take liberties with the ideas, or where you leant on a reading of the position thats genuinely contested -- id rather know than not. accurate enough that someone who works on this wouldnt wince, but it still has to be a real poem, not a lecture in verse. no need to name anyone in it; i just want it to be right.
