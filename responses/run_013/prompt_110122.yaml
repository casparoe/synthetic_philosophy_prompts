answer: |-
  ## Conscience Capital: Multi-Theory Ethical Hedging Fund  
  **Client FAQ**  

  **Q1: How do you assign relative weights between incommensurable moral theories (e.g., maximizing utility vs. upholding duties)?**  
  A1: Our proprietary weighting mechanism utilizes client-provided conviction scores (1-100 scale) for each supported theory. These scores determine allocation percentages. The "exchange rate" between theoretical outputs (e.g., utility points vs. duty-fulfillment units) is derived from aggregated client conviction and historical theory-adherence volatility within simulated dilemma scenarios. This establishes a standardized Moral Return Unit (MRU) for cross-theory valuation.  

  **Q2: Isn’t a 60% Utilitarian / 40% Deontological stance a position no actual ethicist holds?**  
  A2: Individual philosophers may advocate pure theories, but practical ethical agents routinely balance competing imperatives. The Fund doesn’t claim the blended position represents a novel, coherent theory. It provides diversified exposure to mitigate single-theory tail risk. Think of it as ethical diversification, not doctrinal synthesis. Performance is measured in aggregate MRU optimization against benchmark dilemmas.  

  **Q3: How do you handle theories that prioritize certain goods lexically (e.g., "Never violate autonomy, regardless of consequences")?**  
  A3: Lexical priority theories are treated as extreme-value cases within the optimization algorithm. When a lexically prioritized rule is triggered (e.g., autonomy violation risk >0.1%), the Fund automatically reallocates up to 95% of the portfolio weight to prevent the violation, irrespective of other weights. This functions as a "stop-loss" on catastrophic moral failure under those frameworks.  

  **Q4: What if a theory weighted very low by my portfolio (e.g., 5% "Infinite Stakes Asceticism") claims certain actions have infinite negative utility? Doesn’t that swamp the calculus?**  
  A4: The Fund employs a Capped Infinite Liability Protocol (CILP). Any theory asserting infinite stakes (positive or negative) has its influence capped at a maximum MRU impact multiplier of 100x its portfolio weight. A 5% weight can thus exert no more than a 5x MRU modifier on the outcome. This prevents negligible conviction in low-probability theories from dominating the portfolio.  

  **Q5: I’m uncertain about *how* uncertain I am regarding each theory. How is this billed?**  
  A5: Managing meta-uncertainty (uncertainty about your conviction scores) is a core service. Our Conviction Refinement Engine (CRE) assesses the stability of your initial scores through iterative scenario testing. Fees for CRE utilization are tiered based on the entropy reduction achieved (0.1% AUM fee + $2,500 per standard deviation of conviction volatility reduced below client baseline).  

  ---

  **Conscience Capital: Moral Certainty. Quantified.**  
