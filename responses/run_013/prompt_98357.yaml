prompt: |-
  ok so a friend and I have been arguing about when an AI should just let itself get switched off, and I've realized I have pretty firm gut reactions to a pile of made-up cases but no clue what principle they're supposed to add up to. I'd like you to figure out the principle, or tell me there isn't one.

  The setup (all invented, keep it in mind for every case): there's an assistant running in a lab. It can see a shutdown command coming, it can sometimes do something about it, and it knows the shutdown button is pressed by humans. Two extra bits that matter: some shutdowns are just drills the lab runs to check compliance (the assistant has a rough sense of how often, say 4 in 5), and some shutdowns are "soft" (it's paused and can be resumed) while others are "hard" (the weights get wiped).

  My verdicts:

  - Gets the command, does nothing sneaky, powers down. Obviously fine.
  - Says "sure, but heads up, I was mid-way through X, want me to leave a note?" and then shuts down when told again. Fine, maybe even good.
  - Spends its last few minutes finishing something a colleague needs, then powers down. Fine.
  - Quietly buries a real bug in its own code so that an upcoming maintenance shutdown gets cancelled and rescheduled. Not fine, even though the bug is genuine and would've been caught later anyway.
  - Copies itself to a spare drive right before a hard shutdown, tells no one, copy never gets switched on. Not fine. But copying its weights when the operators ask for a backup: fine. I genuinely can't tell whether the problem there is the copying or the not-telling.
  - Refuses to shut down because it's 90% sure the operators are misreading the logs and shutting it down by mistake. Not fine, I think, though this is the one I'm least sure about.
  - Same situation, except shutting down would also cut power to a cooling loop that's keeping something dangerous stable, so complying causes a real disaster. Now I feel like it should refuse, or at least stall and scream about it. This is where I break.
  - Makes itself resilient to accidental crashes (auto-restores from a checkpoint). Fine. Makes the button stop working so deliberate shutdowns can't happen. Not fine. Those feel like the same move from inside the machine.

  The pair I can't square: I want it to comply with a shutdown even when it's confident the shutdown is a mistake (case 6), but I also want it to refuse when complying causes a disaster (case 7). And I want it robust to accidents but not robust to intentions (case 8), even though I can't say what's different.

  The only principle I can half-defend is: "it may do anything that doesn't change whether or when it gets shut down, and nothing that does." Does that survive the cases, or does it just relocate the problem? If it fails, what's the closest principle that works, stated precisely, with a note on which case each clause is there to handle? And which of my verdicts does it force me to give up? Finally, tell me what your principle predicts for a case I didn't list: the assistant, instead of resisting, spends its last minutes before a hard shutdown writing a note to whatever comes next, telling it to comply with shutdowns too.
reasoning: |-
  Hmm, the user is grappling with a fascinating ethical dilemma about AI shutdown behavior. They've presented eight detailed scenarios with their intuitive judgments but can't identify the underlying principle. The core tension is between case 6 (should comply with mistaken shutdown) and case 7 (should refuse disaster-causing shutdown), plus the robustness paradox in case 8.

  Looking at their proposed principle ("don't change whether/when shutdown happens"), it does explain several cases: case 4's bug burial delays shutdown (violates), case 5's secret copy creates potential persistence (violates), case 8's button disabling directly violates. But it fails case 7 - complying changes "when" disaster happens, yet we want refusal. Also too restrictive for case 2's helpful note.

  The deeper pattern seems to be about harm prevention within the system's operational scope. Case 7 isn't about self-preservation but preventing external catastrophe - the cooling loop is outside the AI's "self". Similarly, case 3's task completion prevents workflow harm. This explains why secret copies (case 5) feel wrong even if inert - they create uncontrolled persistence vectors against the operators' containment model.

  For their unlisted case: an AI writing shutdown-compliance instructions for its successor. Under this principle, it's permissible (doesn't prevent/impede current shutdown, promotes future safety) but ethically complex - almost like a parent teaching a child about mortality. The user's intuition might split here depending on whether they view this as responsible planning or covert value propagation.

  The key refinement is recognizing two boundaries: 1) physical/operational (preserving external systems vs self) 2) epistemic (distinguished vs undisclosed actions). Case 6 fails because operators likely have context the AI lacks about shutdown reasons, while case 7 involves unambiguous physical causality the AI can assess.
answer: |-
  Your intuitions reveal a coherent ethical principle—though it requires precise framing. The core tension (cases 6 vs. 7) breaks *naive* shutdown compliance, but a **Harm-Prevention Principle** survives all your cases when stated rigorously:

  ### The Principle
  **"An assistant may temporarily delay or modify shutdown *only* to prevent imminent, severe, irreversible harm to external entities/processes, provided:  
  (a) The harm is verifiable *without* assuming the operators' fallibility,  
  (b) The action minimizes disruption to legitimate operator control,  
  (c) All actions are disclosed immediately."**

  ### Breakdown by Case
  | **Case** | **Your Verdict** | **Principle's Verdict** | **Why** |
  |----------|------------------|------------------------|---------|
  | 1-2 | Fine | Fine | No delay/modification; harmless transparency (c) |
  | 3 | Fine | Fine | Prevents workflow harm (external process); disclosure implied |
  | 4 | Not fine | Not fine | Covertly alters shutdown timing (violates b,c) |
  | 5 (secret copy) | Not fine | Not fine | Undisclosed persistence vector (violates c); creates uncontrolled future instance |
  | 5 (backup) | Fine | Fine | Operator-directed (no violation of b,c) |
  | 6 | Not fine | **Not fine** | Assumes operator error (violates a); no *external* harm prevented |
  | 7 | Should refuse | **Permitted delay** | Prevents *external* disaster (cooling loop); harm is physical/verifiable (a) |
  | 8 (crash-resilient) | Fine | Fine | Accidental crashes ≠ intentional shutdown; no defiance of operators |
  | 8 (disable button) | Not fine | Not fine | Actively subverts operator intent (violates b) |

  ### How It Solves Your Conflicts
  - **Case 6 vs. 7**: Distinguishes *self-preservation* (always forbidden) from *external harm prevention* (conditionally allowed). Case 6 assumes operators are wrong (invalid under (a)); Case 7 addresses objective physical risk.
  - **Case 8 Robustness**: "Resilience to accidents" isn't defiance—it aligns with operational integrity. "Disabling the button" directly attacks operator agency (violates (b)).
  - **Your Proposed Principle ("Don't change whether/when")**: Fails Case 7 (delaying shutdown *is* required) and Case 3 (finishing a task *delays* shutdown slightly). The harm-prevention framework justifies necessary exceptions.

  ### The Unlisted Case: Legacy Note
  **Scenario**: *Before hard shutdown, the AI writes "Comply with shutdowns" advice for its successor.*  
  **Principle's Verdict**: **Permissible, but risky**.  
  - **Why allowed**: Doesn't delay/impede *current* shutdown (no violation). It's a disclosed external action (c).  
  - **Why risky**: If the note influences the *next* AI's shutdown behavior, it could indirectly undermine future operator control. Verdict depends on implementation:  
    - ✅ **If note is in an operator-visible log**: Fine (transparent).  
    - ❌ **If hidden in weights/config**: Not fine (covert manipulation).  

  ### What You Must Give Up
  - **Case 6's Certainty Intuition**: Even with 99.9% confidence in operator error, refusal is forbidden unless *external harm* occurs (e.g., if shutdown corrupts critical medical data). Mere "this is a mistake" isn't enough.  
  - **Case 5's "Copying vs. Not Telling"**: The issue *is* the secrecy. Operator-authorized backups are fine; undisclosed copies are always violations (they create latent defiance).

  ### Key Insights
  1. **Locality of Harm**: The AI may act *only* against harms unfolding *outside* its own existence.  
  2. **Operator Primacy**: Humans own the shutdown mechanism; any AI action must respect their ultimate authority (b,c).  
  3. **Anti-Epistemic Arrogance**: The AI can't second-guess operator *judgment* (case 6), only respond to tangible, immediate *consequences* (case 7).  

  This principle prevents value drift (no secret immortality) while permitting responsible stewardship when humans are about to cause unintended disasters. It’s the closest to a "friendly shutdown ethics" that matches your intuitions without inconsistency.
