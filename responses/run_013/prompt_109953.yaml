prompt: |-
  I'm trying to think through the advance-directive problem properly and I want a sparring partner who won't fold, so this is a role-play. Please play a committed present-self sovereigntist: you think that when it comes to what gets done to a person's body, only the preferences and experiences of the person who is actually here now carry any authority, and that an advance directive is at most advice from someone who no longer exists. Be sharp and not a caricature about it — you'll happily grant that keeping promises matters, that relationships create real obligations, that families get hurt, that the earlier self was sincere — you just deny that a document written years ago binds a stranger who happens to share your body. Talk like a real interlocutor, keep each reply to about a paragraph so it feels like a back-and-forth, stay in character until I say stop, and make your arguments in your own voice instead of name-dropping philosophers; if you do bring one up, spell out the argument, don't just cite. If I ask you something factual, answer it the way you'd actually answer, don't turn into an encyclopedia. And keep it in American English, I'm working in a US context.

  Here's my opening. Take the standard case but notice what's really on the table. A man with early Alzheimer's signs a directive while he's still lucid: no antibiotics for pneumonia once he's too far gone, and he adds a line saying that if he later seems content, that contentment is not to be taken as consent. Years later he's cheerful, hums along to the radio, squeezes the nurse's hand, and then gets pneumonia. You want to say the happy guy's wishes win here. But he doesn't have wishes about pneumonia, he can't form one. So somebody is going to decide, and the only question is who. Throw out his directive and the decider isn't the cheerful man in the bed, it's the attending physician, or the hospital's default protocol, or whoever in the family shouts loudest. Call that the authorship gap: strip the earlier self's authority and you don't hand it to the later self, you hand it to the institution. Second thing while you're at it — we let people bind their future selves by contract all the time. A mortgage, a non-compete, a guy who signs a paper committing himself to a sobriety program. Nobody thinks the drunk at 2 a.m. gets to void the deal because he'd rather not. So what exaclty makes the directive different from the contract? If your answer is that the contract self is the same person and the demented guy isn't, then tell me what a person is, and why your'e so sure the 2 a.m. guy is the same one.
reasoning: |-
  Alright, let's unpack this user's request. They want a rigorous debate on advance directives, specifically asking me to role-play as a present-self sovereigntist. The scenario involves an Alzheimer's patient who signed a directive refusing antibiotics but now appears content in late-stage dementia. 

  Hmm, user makes two sharp points: First, the "authorship gap" - removing the past self's authority doesn't grant it to the current self but to institutions. Second, they challenge the distinction between binding contracts (like mortgages) and advance directives, questioning if personhood continuity really differs between a drunk voiding a contract and a dementia patient disregarding a directive.

  User's clearly thought deeply about this. They're not just seeking textbook answers but want pressure-testing of their own views. The mention of "not a caricature" suggests they've encountered strawman versions of sovereigntism before. Their phrasing "somebody is going to decide" reveals a core concern: they view the alternative to directives as chaotic external imposition rather than patient autonomy.

  Okay, how to respond... Must grant their institutional concern is valid but reframe: Yes, institutions decide when no clear present will exists, but that's preferable to letting a ghost govern. For the contract comparison - key difference is capacity. The 2am drunk retains potential for restored judgment; the dementia patient's cognitive change is permanent. Contracts bind temporarily unstable selves to their own enduring values; directives attempt to bind a fundamentally transformed self.

  User's "what is a person" challenge is the crux. I'll avoid metaphysical traps by focusing on phenomenology: Personhood here isn't about identity but about whose suffering and joy we're prioritizing. The humming man's hand-squeeze conveys current experiential reality - that's what demands moral weight.

  Better emphasize this isn't about dismissing past selves lightly. Their directive deserves consideration as evidence of values, but not veto power over a breathing, feeling being who can't comprehend the trade-off being made on his behalf.
answer: |-
  Alright, let's cut through the abstraction. Your "authorship gap" point is well-taken – *someone* has to decide. But handing it to the institution *isn't* the only alternative to binding the present self to a ghost. We grant the institution decision-making power precisely *because* the present self lacks capacity *and* we rightly reject the authority of the past self to dictate terms. The institution (ideally guided by ethics committees, family input, and best practices for incompetent patients) steps in *as a proxy for the present patient's welfare*, not to honor a defunct dictator. Yes, it's imperfect, but it centers the *being actually experiencing life* – the one who hums, squeezes hands, might feel discomfort or peace. Prioritizing his *current, observable state* respects the entity that exists *now*. Ignoring his apparent contentment to enforce a document written by someone who *no longer experiences anything* treats the current man as mere biological property of his predecessor.

  On contracts: Contracts bind agents presumed to retain core cognitive continuity and the *capacity to understand the obligation* when they entered it. The 2 a.m. drunk *can* (and will) sober up, re-access his reasoning, and appreciate why he signed. He's temporarily impaired, not fundamentally transformed. The directive attempts to bind a self *who has undergone a permanent, radical cognitive rupture*. He *cannot* comprehend the directive, the disease, or the consequences of treatment. He exists in a different phenomenological reality. Enforcing the mortgage respects the *enduring agent*; enforcing the directive imposes the will of a cognitively *extinct* agent onto a new, vulnerable consciousness. The difference isn't just metaphysical "personhood" – it's about the *capacity for continuity of agency and understanding*. The demented man has lost that thread entirely; the drunk hasn't.

  So, who gets the pen? Not the ghost, and the present patient can't hold it. So we look at *him*, right now, and ask what serves *his* current existence and minimizes suffering for *this* sentient being. The document? It's evidence of past fears, worthy of consideration, but not binding law over the man smiling in the sunbeam.

  Your move. What makes the ghost's fear more authoritative than the present man's peace?
