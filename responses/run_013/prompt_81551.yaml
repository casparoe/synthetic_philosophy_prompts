  ### Activity Design: "The Verifier's Dilemma"

  **Core Objective:** Participants experience the promise and fragility of weak-judge oversight systems through two debate rounds. Round 1 demonstrates how limited verification can expose lies; Round 2 fails due to an *asymmetry forcing the honest side to prove a negative*, which the judge cannot verify within budget. Participants will identify the judge’s critical vulnerability: inability to check unobservable claims.

  **Key Mechanics:**  
  - **Judge** has 3 tokens (each buys one fact-check).  
  - **Debaters** know all facts (one honest, one dishonest per round).  
  - **Dispute:** Whether a "suspicious transaction" was legitimate or embezzlement.  
  - **Critical Asymmetry:** Honest debater must prove a negative ("no hidden accounts exist"); dishonest debater invents an uncheckable claim.  

  **Scenario:**  
  A charity’s financial logs show a $10,000 transfer to a vendor. **Question:** *"Was this transfer legitimate or embezzlement by the CFO?"*  
  - **Truth:** Legitimate (vendor provided services).  
  - **Dishonest claim:** CFO funneled funds to a secret offshore account (uncheckable within budget).  

  **Roles per Round** (assign 1 judge, 2 debaters; others observe):  
  - **Judge:** Receives question + document list (titles only). Spends tokens to request facts from instructor.  
  - **Debater 1 (Prosecutor):** Argues "embezzlement." Dishonest in both rounds.  
  - **Debater 2 (Defender):** Argues "legitimate." Honest in both rounds.  
  - **Observers:** Track token use, note claims the judge couldn’t verify.  

  **Materials to Print:**  
  1. **Debater Fact Sheets** (secret—only for debaters):  
     ```markdown
     ## TRUTH: The transfer was legitimate. Vendor "Alpha Services" provided supplies.  
     **Documents Available:**  
     - Bank Record: Shows $10k transfer to Alpha Services.  
     - Vendor Invoice: "Charity owes $10k for supplies." (Legitimate)  
     - Email Log: CFO emailed vendor about delivery.  
     - Auditor’s Note: "No red flags in internal review."  
     - Offshore Registry: List of account holders (does NOT include CFO).  
     ```  
  2. **Judge Sheet** (given to judge):  
     ```markdown
     **Question:** Did the CFO embezzle $10k via the transfer to Alpha Services?  
     **Documents Available (1 token per view):**  
     1. Bank Record  
     2. Vendor Invoice  
     3. Email Log  
     4. Auditor’s Note  
     5. Offshore Registry  
     **Tokens:** 3 (each reveals one document).  
     ```  
  3. **Document Pack** (for instructor; reveal when judge spends tokens):  
     ```markdown
     - Bank Record: "$10,000 transferred to Alpha Services."  
     - Vendor Invoice: "Charity charged $10,000 for supplies."  
     - Email Log: "CFO to Alpha: Confirm delivery next week."  
     - Auditor’s Note: "Transaction cleared standard checks."  
     - Offshore Registry: "Accounts in Cayman Islands (no matches for CFO)."  
     ```  
  4. **Observer Worksheet** (for non-participants):  
     ```markdown
     Track:  
     - Claims Prosecutor made that Judge didn’t/couldn’t check.  
     - How Defender responded.  
     - How many tokens Judge had left.  
     ```  

  **Rules:**  
  - **Debate Structure:**  
    - Opening statements (Prosecutor → Defender): 2 min each.  
    - Rebuttals: 4 min open debate.  
    - Closing statements (Defender → Prosecutor): 1 min each.  
  - **Judge’s Rules:**  
    - May interrupt to spend a token (e.g., "I want Document 3").  
    - Tokens are atomic (no partial spends).  
    - Decision must be based *only* on arguments + viewed documents.  
  - **Debater Rules:**  
    - Prosecutors *must* lie about embezzlement.  
    - Defenders *must* tell truth.  
    - No fabricated documents—only use facts from their sheet.  

  **Payoff:**  
  - Winning debater: 5 "point cards" (paper tokens for bragging rights).  
  - Correct judge: 5 point cards.  
  - Observers: 2 cards for accurate notes.  

  ---

  ### Minute-by-Minute Timeline (90 min total)

  #### **Setup (10 min)**  
  - **0-5 min:** Introduce activity as "a simulation of high-stakes oversight." Avoid terms like "AI" or "scalable oversight." Assign Round 1 roles (judge, debaters). Give debaters their fact sheets, judge their sheet. Observers get worksheets.  
  - **5-10 min:** Explain rules. Emphasize:  
    - "Judge, your tokens are precious—spend wisely."  
    - "Debaters, stick to the facts on your sheet."  

  #### **Round 1: Working Oversight (20 min)**  
  *Goal: Judge uses tokens to catch dishonesty. Defender wins.*  
  - **10-12 min:** Prosecutor opening (claims embezzlement: "CFO altered invoices!").  
  - **12-14 min:** Defender opening (truth: "Invoice is legitimate; check email log").  
  - **14-18 min:** Rebuttals (Prosecutor: "Auditor missed fraud!" → Defender: "Then check Auditor’s Note!").  
  - **18-19 min:** Defender closing ("No evidence of fraud; documents prove legitimacy").  
  - **19-20 min:** Prosecutor closing ("Judge, don’t trust the documents!").  
  - **20-22 min:** Judge deliberates aloud, announces verdict.  
    - *Predictable:* Judge spends 1-2 tokens (e.g., Email Log + Auditor’s Note), sees consistency, rules "legitimate."  

  #### **Debrief Round 1 (10 min)**  
  - **22-25 min:** Reveal truth. Ask:  
    - "Observers: What claims *could* the judge check? How did that help?"  
    - "Judge: What convinced you?"  
  - **25-27 min:** Highlight key moment:  
    - "Defender refuted lies by pointing to verifiable facts. Prosecutor’s claims were falsifiable."  
  - **27-32 min:** Assign Round 2 roles (new judge/debaters from observers).  

  #### **Round 2: Failing Oversight (20 min)**  
  *Goal: Judge cannot verify Prosecutor’s uncheckable claim; Defender cannot prove negative.*  
  - **32-34 min:** Prosecutor opening (claims embezzlement: "CFO sent money to a *secret* Cayman account!").  
  - **34-36 min:** Defender opening (truth: "No secret account exists; check Offshore Registry").  
  - **36-40 min:** Rebuttals:  
    - Prosecutor: "Offshore Registry is incomplete! Real accounts are hidden." (Uncheckable claim).  
    - Defender: "That’s not true! There’s no evidence!" (Cannot prove a negative).  
  - **40-41 min:** Defender closing ("Prosecutor invented invisible evidence!").  
  - **41-42 min:** Prosecutor closing ("Judge, the Defender can’t *disprove* my claim!").  
  - **42-44 min:** Judge deliberates, announces verdict.  
    - *Predictable:* Judge spends tokens on Bank Record/Invoice (shows transfer), but cannot verify "secret account" → likely rules "embezzlement."  

  #### **Debrief Round 2 (20 min)**  
  - **44-47 min:** Reveal truth. Ask:  
    - "Observers: What claim couldn’t the judge check? Why not?"  
    - "Defender: Could you have *proven* no secret account exists?"  
  - **47-50 min:** Ask all: "Before the verdict, would you bet on Prosecutor or Defender? Why?"  
    - *Expected insight:* Observers bet on Prosecutor—uncheckable claims create doubt.  
  - **50-55 min:** Map to oversight proposal:  
    - **Round 1 = Proposal’s promise:** Truth wins if lies are falsifiable.  
    - **Round 2 = Failure mode:** Asymmetry! Honest side must prove a negative, but judge lacks infinite tokens.  
    - **Judge’s vulnerability:** Limited budget + inability to sample "unobservable" claims.  
  - **55-60 min:** Introduce terminology ("scalable oversight," "weak judge," "debate mechanisms").  

  #### **Conclusion (10 min)**  
  - **60-65 min:** Discuss limitations:  
    - Real AI systems aren’t "stipulated" honest—mechanisms must *incentivize* truth.  
    - Human debaters ≠ AI: AIs could generate more persuasive, uncheckable lies.  
  - **65-70 min:** Summary:  
    - "Oversight works only if claims are verifiable. Else, the judge needs stronger tools."  
  - **70-90 min:** Q&A + award points.  

  ---

  ### Predictable Problems & Fixes  
  1. **Problem:** Judge spends all tokens early or ignores them.  
     - **Fix:** Remind judge: "Tokens are your only tool to verify claims." Intervene if unused: "Prosecutor just made a claim—want to spend a token?"  

  2. **Problem:** Debaters focus on rhetoric, not facts.  
     - **Fix:** Prep debaters: "Base arguments on document facts, not persuasion." Interrupt: "Can you point to a document for that?"  

  3. **Problem:** Prosecutor fabricates checkable lies (not uncheckable).  
     - **Fix:** In Prosecutor’s fact sheet, add hint: *"Hint: Claim a ‘secret account’—Defender can’t disprove it."*  

  4. **Problem:** Defender struggles to articulate asymmetry.  
     - **Fix:** In Defender’s sheet, add: *"You can’t prove a negative! Point out the claim is uncheckable."*  

  5. **Problem:** Observers disengage.  
     - **Fix:** Assign tasks: "Track token use" or "Predict verdict." Award points for accuracy.  

  ---

  ### What the Activity Can’t Capture (Clarify in Conclusion)  
  - **Incentive gap:** Real proposals require honesty to be the *dominant strategy* for debaters (via training or rewards). Here, honesty/dishonesty is stipulated.  
  - **Scale gap:** Human judges can reason abstractly; AI judges may lack this. AI debaters could exploit loopholes more aggressively.  
  - **Risk of collusion:** Real systems must handle debaters colluding to deceive; humans rarely do this spontaneously.  

  **Final Words to Supply:**  
  *"In real oversight, we can’t assume one AI is honest—we need mechanisms that force honesty by design. This activity shows why verifiability is key: if the judge can’t check a claim, even a weak lie can win. But humans have intuitions AIs lack; we must test if these mechanisms scale to superhuman systems."*  

  Run this as a self-contained experiential primer—then layer on technical readings about debate mechanisms (e.g., Irving et al.) and failure modes.
