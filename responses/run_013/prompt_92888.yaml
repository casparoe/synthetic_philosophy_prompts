prompt: |-
  ok so this is going to sound like a phil 101 question but hear me out — I'm three years into a PhD that's supposedly about exactly this and I've genuinly lost the thread.

  My old MA supervisor runs a tiny reading group on tense and the future, and I've ended up as the person who's supposed to know what she actually thinks. Problem is she refuses to state a general view and just gives verdicts case by case. Here's what I've got:

  (1) "There was a battle yesterday." She says: straightforwardly true, or false if there wasn't one — even if it happened entirely by chance and could easily not have. No hedging, no indeterminancy; past tense is past tense.

  (2) "There'll be a sea battle tomorrow," where as of right now nothing settles it either way — no plans, no causes, nothing. She says it is not true and not false. I asked whether she meant we can't know; she said no, it has no truth value yet. She's firm on this.

  (3) "Either there'll be a sea battle tomorrow or there won't be" — same setup. She says this one is true, and not just true but can't fail to be true. She does *not* think that means one of the two disjuncts is already true. When I said that sounds like a contradiction she said it only sounds like one if you assume truth distributes over a disjunction the way it does over the parts, which she denies.

  (4) "The eclipse will happen tomorrow." She says that's true or false right now, full stop. When I asked why this differs from the battle she said "because eclipses are caused," and then when I pushed, "because anyone can work it out," and then got annoyed and said both, and honestly I can't tell which one she thinks is doing the work. This is the one I keep coming back to.

  Next week I'm bringing two new cases:

  (i) Tomorrow's battle is fully caused — there's a hidden chain of events that will definitely produce it — but the chain sits inside a chaotic system that nobody could ever in practice predict or discover. Does she say the prediction is true now? Or still indeterminate, because it's unknowable?

  (ii) Monday, Sam says "there'll be a battle Tuesday." As of Monday, nothing settles it. Tuesday comes, the battle happens. Wednesday, I ask her: was what Sam said on Monday true? Not "is it true now" — was it true then, when he said it.

  What I want from you: what she'll say about (i) and (ii), and more importantly what rule or rules she's actually running. I'd bet good money there's more than one that fits everything up there, so tell me what each of them predicts about (i) and (ii), which one you'd put money on and why, and what third case I should put to her to flush out the difference. I'm not really asking what's true (say that too if you like) — I'm asking what she's committed to.
reasoning: |-
  Okay, let me start by unraveling this user's problem. They're a PhD student struggling to pin down their supervisor's views on truth values for future contingents. The supervisor gives case-by-case judgments but avoids stating a general principle. The user has collected four key judgments from her and plans to present two new cases. They want to predict her responses and uncover the underlying rules, especially since there might be multiple consistent principles.

  First, I need to analyze the existing cases. For (1), past events are straightforwardly true or false, even if accidental. That suggests a clear realist view of the past. (2) is about an uncaused future event—no truth value yet. Super interesting that she insists it's not about epistemology but ontology: no truth value at all. Then (3) complicates things; the disjunction is necessarily true even though neither disjunct has a truth value. That defies standard logic where disjunction relies on truth values of parts. She explicitly rejects truth distribution over disjunction here.

  Case (4) is the real puzzle. Future eclipses have a truth value now because they're "caused" and "anyone can work it out." But which factor is decisive? Causation or knowability? The user noticed her hesitation, so this ambiguity is key. 

  Now for the new cases. For (i): a fully caused but unpredictable battle. If causation is her main criterion, she should say it's true now. If knowability matters, it might be indeterminate. I recall Aristotle's sea battle example here, but the causation angle makes it different. For (ii): Sam's Monday statement about Tuesday's battle. On Wednesday, after it happened, was it true when he said it? If she's a temporalist, she might say it wasn't true then but is true now. If she's retroactive, she'd say it was true all along. But her past-tense view (1) suggests she treats past truths as fixed, so maybe she'd extend that to past predictions.

  Putting this together, I see two possible principles at play: a strong causation-based view (truth requires deterministic causation) or a knowability-based view (truth requires epistemic accessibility). Both fit most cases, but they diverge on case (i). The causation view would say the chaotic but determined battle is true now; knowability would say indeterminate. For (ii), both might agree it's true now, but the "was it true then" question tests temporalism vs. retroactive truth. 

  The user's frustration is palpable—they've been wrestling with this for years. They need clarity to anticipate their supervisor's responses and design a revealing third case. I should suggest a case that forces her to choose between causation and knowability, like a predictable but uncaused event. Or a case about past predictions to test temporalism. 

  Hmm, also worth noting: her rejection of truth distribution in disjunction (3) hints at a non-classical logic approach, maybe supervaluationism or branching time. But she might not explicitly endorse those frameworks. The user needs concrete predictions, so I'll focus on how the principles apply to the new cases. 

  This is tricky because the supervisor's responses could be inconsistent. The user suspects multiple rules; I agree. By laying out the options and their implications, the user can test her systematically. Their deeper need is probably to understand her well enough to engage critically or align their thesis work. They might also want ammunition to challenge her if contradictions emerge. 

  I'll structure this with principles first, then predictions for (i) and (ii), then a killer third case. The user will need something that isolates causation from knowability—like a quantum event with known probabilities but no determinism. That could force her hand.
answer: |-
  Based on the patterns you've provided, your supervisor operates with a **non-standard, context-dependent view of truth values for future contingents**, prioritizing **epistemic accessibility and/or causal determinism** over pure temporal logic. Here's the breakdown of her likely rules, predictions for your cases, and a strategy to expose the core principle:

  ### Core Rules (Dual Principles Fitting the Data)
  1.  **Past-Future Asymmetry:** Statements about the settled past *always* have a definite truth value (true or false), even if contingent. Statements about the unsettled future *can* lack a truth value.
  2.  **The "Settledness" Trigger for Future Truth:** A future-tense statement ("P will happen") has a truth value *now* **if and only if** the future event P is *already causally settled or nomologically necessary* **OR** it is *in principle knowable/predictable with certainty* based on present facts.
      *   **Why both?** Case (4) is the key. She offers "caused" (causal determinism) *and* "anyone can work it out" (epistemic accessibility) as reasons, refusing to prioritize one. This suggests her "settledness" criterion is disjunctive: *either* causal determinism *or* epistemic certainty grants the future event a truth value *now*.

  ### Applying the Rules to Your Cases (i) & (ii)

  *   **Case (i): Fully caused but chaotic & unpredictable battle.**
      *   **Causal Determinism Rule:** The hidden causal chain ensures the battle *will* happen. It's settled nomologically. **Prediction:** She will say "There will be a battle tomorrow" is **TRUE** *now*. (This aligns with her eclipse case reasoning: "because eclipses are caused").
      *   **Epistemic Accessibility Rule:** The chaotic system makes it impossible "in practice" *and* likely "in principle" for anyone to predict or discover the chain. It's unknowable. **Prediction:** She will say "There will be a battle tomorrow" is **NEITHER TRUE NOR FALSE** *now*. (This aligns with the unknowable sea battle case).
      *   **Conflict:** This case *explicitly pits her two criteria against each other*.
      *   **My Bet:** I'd put good money (60/40) on her leaning towards **Causal Determinism** here. Why?
          1.  Her irritation in (4) suggests "caused" was the primary reason, with "knowable" added defensively.
          2.  The sea battle case (2) focused on the *lack of causes* ("nothing settles it") as the reason for indeterminacy, not just unknowability. Causation seems more fundamental.
          3.  Philosophers often prioritize metaphysics (causation) over epistemology (knowability) for grounding truth.

  *   **Case (ii): Sam's Monday prediction about Tuesday's uncaused battle; asked on Wednesday after it happened.**
      *   **The Question:** "Was what Sam said on Monday true *then*, when he said it?"
      *   **Analysis:** Her view on the *past* is crucial here (Case 1). On Wednesday, the battle is firmly in the past. Sam's utterance ("There'll be a battle Tuesday") is also a past event. We *know* the battle happened.
      *   **Prediction:** She will say **YES, it was TRUE on Monday**.
      *   **Why?:**
          1.  **Past-Future Asymmetry:** Evaluating a *past utterance* about a *now-past event*. According to her rule (1), past events (including utterances and the events they reference) have definite truth values. Denying Sam's statement was true *then* would imply some past truths are indeterminate, contradicting (1).
          2.  **Retroactive Definiteness:** Her position in (2) is that the future statement *lacked* a truth value *at the time*. However, once the event becomes past, *all* statements about it (including past predictions) become evaluable as simply true or false based on the settled past fact. She treats the *truth value of the utterance itself* as fixed by the *current settledness* of the event it referred to. Sam was right, and his statement, *considered historically*, was correct.

  ### The Crucial Third Case to Flush Out the Rule (Causation vs. Knowability)
  To decisively test whether **Causal Determinism** or **Epistemic Accessibility** is the primary driver for her "settled future," present this:

  *   **Case (iii): Predictable but Uncaused Future Event.**
      *   "There exists a perfectly reliable, simple, publicly available *oracle device*. It has never been wrong. Today, it flashes 'BATTLE' indicating a sea battle will definitely happen tomorrow. Crucially, the oracle works by *pure chance correlation* – it has no causal connection whatsoever to future events (maybe it's quantum noise perfectly correlated with macro-events by sheer fluke). There are *no causes* ensuring the battle; it remains metaphysically contingent. However, based *only* on the oracle's output, everyone *knows with absolute certainty* a battle will happen tomorrow."
      *   **Question:** Is "There will be a sea battle tomorrow" **true**, **false**, or **neither** *right now*?
      *   **What it Tests:**
          *   If she says **TRUE**: Epistemic Accessibility (knowability) is sufficient, even without causation. Causal Determinism is secondary.
          *   If she says **NEITHER**: Causal Determinism is necessary. Knowability alone, even perfect knowability based on a reliable but acausal correlate, is insufficient. The future must be *metaphysically* settled, not just *epistemically* accessible.
          *   If she hesitates or offers a novel answer: It confirms the deep tension, but likely reveals her core intuition leans towards requiring metaphysical grounding (causation) for truth.

  ### Summary of Predictions & Strategy
  1.  **Case (i) Prediction:** Leaning towards **TRUE** (Causal Determinism wins over Epistemic Inaccessibility).
  2.  **Case (ii) Prediction:** **YES, it was TRUE on Monday** (Retroactive application of Past-Future Asymmetry).
  3.  **Case (iii) Strategy:** Present this to force the choice between Causation and Knowability as the *essential* factor for future truth. Her answer here will be the most revealing about her underlying metaphysics.

  Her view resembles a hybrid of **Aristotelian Future Contingents** (lack of truth value for open futures) with a **supervaluationist** flavor (truth for disjunctions/necessities like LEM without truth for the disjuncts), but crucially modified by her **Settledness Trigger** (Causation *or* Knowability). The core tension is whether "settled" means *metaphysically determined* or *epistemically certain*. Case (iii) is designed to break that tie. Good luck with the reading group!
