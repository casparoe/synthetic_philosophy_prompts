prompt: |-
  I am working through the literature on uncertain evidence and want a clean specification before I evaluate any particular updating rule. Write the desiderata for a theory of how a rational agent should revise credences when the evidence is uncertain. The central case is the one Jeffrey conditionalization was designed for: the agent does not learn that some proposition is true, but shifts credences across a partition of evidential possibilities, and then must redistribute credence over the rest of the algebra. The theory should say what any adequate rule in this area must deliver.

  For each requirement, give the case or consideration that motivates it, and mark whether it is non-negotiable or a preference of a particular camp. Include at least the following, and add any others you think belong:

  - The rule must generalize strict conditionalization as a limiting case, where one evidential cell receives credence one.
  - The rule must respect a rigidity condition: conditional probabilities within each evidential cell should remain unchanged by the update, or the theory must explain what replaces that condition and why.
  - The rule must be invariant under refinement of the evidential partition: if a cell is split into subcells that agree on the relevant conditional probabilities, the final credences should not change.
  - The rule must address order effects. If an agent receives two uncertain observations, does the final credence depend on the order? Under what conditions should it not? Consider the case where the two observations are described by the same partition but the agent's total experience differs between orders, and say what that implies for the requirement.
  - The rule must be diachronically coherent: it should not expose the agent to a sure loss from a bookie who knows the agent's updating rule.
  - The rule must handle evidence that the agent cannot fully articulate, and evidence that is old rather than new.
  - The rule must distinguish updating on evidence from supposing a hypothesis for the sake of argument.
  - The rule must say something about infinite partitions and cases where the relevant conditional probabilities are undefined.
  - The rule must be computable or at least approximable in realistic cases.
  - The rule must say how it treats higher-order uncertainty about the reliability of the evidence source.

  Then flag any pair or subset of these desiderata that you suspect cannot be jointly satisfied. This is the part I most want. For example, does full refinement invariance conflict with the rigidity condition in some cases? Does the demand for order independence conflict with the demand to treat the agent's total experience as the evidence? If some subset is jointly unsatisfiable, state the conflict as a result about the area, not as a defect of one rule.

  Finally, briefly indicate how Jeffrey conditionalization, a maximum entropy rule, and a reflection-style rule fare against the list. Keep the scoring short; the criteria are the deliverable.
reasoning: |-
  We are specifying desiderata for a theory of updating under uncertain evidence, with Jeffrey conditionalization as the central case. We list the requirements, motivate them, and mark their negotiability. Then we note potential conflicts and briefly evaluate three rules.

  Desiderata:

  1. **Generalization of Strict Conditionalization**  
     - *Motivation*: When the evidence becomes certain (i.e., one cell of the partition gets probability 1), the rule should reduce to Bayesian conditionalization. This ensures continuity with the standard case.  
     - *Negotiability*: Non-negotiable. Any rule that fails this would be inadequate as a generalization.

  2. **Rigidity Condition**  
     - *Motivation*: Jeffrey's insight was that the conditional probabilities given each evidential proposition should remain fixed. This preserves the agent's beliefs about the world given the evidence. If rigidity is abandoned, we need an explanation of how conditional probabilities change and why.  
     - *Negotiability*: Non-negotiable for Jeffrey-style rules, but some alternative theories (e.g., rules that allow for learning about dependencies) might relax it with justification.

  3. **Invariance under Refinement of the Evidential Partition**  
     - *Motivation*: If we split a cell into subcells that do not change the conditional probabilities (i.e., the conditional probabilities given the original cell are the same as the weighted average of the conditionals given the subcells), then the update should not change. This ensures that the rule is not sensitive to how coarsely we describe the evidence.  
     - *Negotiability*: Non-negotiable for a clean theory, but note that in practice, conditional probabilities might not be defined for arbitrary refinements.

  4. **Order Effects**  
     - *Motivation*: When updating sequentially on two pieces of uncertain evidence, the order might matter. But if the two updates are based on independent experiences and the partitions are the same, we might want commutativity. However, if the total experience is different in each order (e.g., the agent's overall state of evidence is path-dependent), then order effects may be justified. The requirement should clarify when order should not matter (e.g., when the evidence is propositional and the updates are based on the same underlying state).  
     - *Negotiability*: Commutativity is a preference of some camps (e.g., those who view evidence as purely propositional) but not non-negotiable if the evidence is experiential and order affects the total evidence.

  5. **Diachronic Coherence**  
     - *Motivation*: The updating rule should not make the agent vulnerable to a sure-loss contract (a "Dutch book") over time by a bookie who knows the rule. This is a standard requirement for rationality.  
     - *Negotiability*: Non-negotiable for pragmatic reasons.

  6. **Handling Unarticulated and Old Evidence**  
     - *Motivation*: Evidence might not be fully expressible in the agent's language (unarticulated) or might be already known but re-evaluated (old evidence). The rule should account for how uncertain evidence interacts with such cases.  
     - *Negotiability*: Non-negotiable for a comprehensive theory.

  7. **Distinguishing Updating from Supposing**  
     - *Motivation*: Updating on evidence (changing one's actual credences) should be distinct from supposing a hypothesis for conditional reasoning (e.g., as in imaging or conditional probabilities). The rule must not conflate the two.  
     - *Negotiability*: Non-negotiable.

  8. **Treatment of Infinite Partitions and Undefined Conditional Probabilities**  
     - *Motivation*: In infinite partitions, conditional probabilities might not be defined (due to non-measurability or division by zero). The rule must either handle these cases or specify when it applies.  
     - *Negotiability*: Non-negotiable for a fully general theory, but approximations may be acceptable.

  9. **Computability/Approximability**  
     - *Motivation*: The rule should be implementable in principle for realistic agents, at least approximately.  
     - *Negotiability*: A practical concern, so negotiable in theory but necessary for applicability.

  10. **Higher-Order Uncertainty**  
      - *Motivation*: The agent might be uncertain about the reliability of the evidence source (e.g., the accuracy of a sensor). The rule should account for this kind of uncertainty, which might require updating on the evidence and the reliability simultaneously.  
      - *Negotiability*: Non-negotiable for complex real-world cases.

  Potential Conflicts:

  - **Refinement Invariance vs. Rigidity**: In some cases, refining the partition might reveal that the conditional probabilities are not rigid because the subcells have different conditional probabilities. If the rule enforces rigidity on the original partition, then when we refine, the conditional probabilities on the subcells might not be rigid. This conflict arises if we require rigidity to hold at every level of granularity. Resolution: Rigidity must be required relative to the coarsest partition that captures the evidence. But then refinement invariance might fail if we require rigidity at the finer level. Alternatively, we might require that the conditional probabilities are rigid at the finest available partition, but then the rule must specify which partition to use.

  - **Order Independence vs. Total Experience**: If the agent's total experience is different when the updates occur in a different order (e.g., because the agent learns about the order of learning), then order effects are expected. But if we require order independence in all cases, we might be ignoring the path-dependency of evidence. This conflict is resolved by clarifying that order independence is only required when the total evidence (the net effect of the two updates) is the same regardless of order. However, in uncertain evidence, the total evidence is often defined by the sequence of updates, so order independence may not be generally desirable.

  - **Higher-Order Uncertainty and Computability**: Accounting for higher-order uncertainty (e.g., about the reliability of the evidence) can lead to complex hierarchical models that may be computationally intractable. This is a tension between desiderata 9 and 10.

  Evaluation of Rules:

  1. **Jeffrey Conditionalization**:
     - Generalization of strict conditionalization: Yes, when one cell gets probability 1.
     - Rigidity: Assumes rigidity as a condition.
     - Refinement invariance: Only if the refinement preserves the rigidity condition. May fail if the conditional probabilities change upon refinement (but by assumption in the desideratum, they don't). However, note that Jeffrey updating is defined for a fixed partition and does not automatically extend to refinements without additional assumptions.
     - Order effects: It is commutative if the partitions are the same and the updates are applied independently? Actually, Jeffrey updating is not commutative: the order of updates on different partitions can matter.
     - Diachronic coherence: Vulnerable to Dutch books in some cases? Actually, it is diachronically coherent if the rigidity condition holds and the partition is fixed, but note that if the agent anticipates future updates, coherence might require more (like the martingale property). There are Dutch book arguments for Jeffrey conditionalization under rigidity.
     - Unarticulated/old evidence: Not directly addressed; typically assumes evidence is articulated by the partition.
     - Updating vs. supposing: Clear: it is an update rule.
     - Infinite partitions: Not defined in the original formulation; requires measure theory.
     - Computability: Straightforward for finite partitions.
     - Higher-order uncertainty: Not built-in; must be modeled by expanding the partition to include reliability.

  2. **Maximum Entropy Rule**:
     - Generalization: When the constraint is a single proposition true, it reduces to conditioning on that proposition.
     - Rigidity: Not necessarily. It minimizes informational change subject to constraints (the new probabilities on the partition). It may change conditional probabilities if that helps achieve higher entropy.
     - Refinement invariance: Not guaranteed. MaxEnt can be sensitive to the level of description.
     - Order effects: Not commutative in general.
     - Diachronic coherence: Not generally coherent (can be Dutch booked).
     - Unarticulated evidence: Can handle constraints that are not partition-based, so potentially better.
     - Updating vs. supposing: Intended for updating.
     - Infinite partitions: Can be extended with differential entropy, but tricky.
     - Computability: Can be computationally intensive.
     - Higher-order uncertainty: Must be incorporated into constraints.

  3. **Reflection-Style Rule** (e.g., the principle of reflection or van Fraassen's rule):
     - Generalization: When future certainty, it reduces to conditioning.
     - Rigidity: Not directly. Reflection sets current credence equal to expected future credence, which might not preserve conditionals.
     - Refinement invariance: Not clear.
     - Order effects: Not commutative.
     - Diachronic coherence: Reflection can lead to Dutch books if the agent knows their future credences are not reliable.
     - Unarticulated evidence: Not clear.
     - Updating vs. supposing: Blurs the line because it uses expected future belief.
     - Infinite partitions: Same as conditionalization.
     - Computability: Requires modeling future credences.
     - Higher-order uncertainty: It is about trusting one's future self, but if the agent is uncertain about future reliability, it becomes complex.

  Summary of Conflicts:

  A key conflict is between **refinement invariance** and **rigidity** when the conditional probabilities are not constant across subcells. If we require rigidity for a coarse partition, then upon refining, we might have to break rigidity for the subcells. This suggests that we must specify the partition at which rigidity holds. But then the rule is not invariant under refinement. Hence, we cannot have both full refinement invariance and rigidity at arbitrary levels.

  Also, **order independence** and **respecting the total experience** conflict when the order of updates affects the total evidence. Thus, order independence should only be required when the total evidence is order-invariant.

  Finally, **diachronic coherence** and **higher-order uncertainty** might conflict because accounting for higher-order uncertainty (e.g., learning about reliability) can lead to situations where the agent's updating rule is not rigid and thus vulnerable to Dutch books. This is an active area of research.

  In conclusion, no rule satisfies all desiderata perfectly. Jeffrey conditionalization does well on many but fails on order effects and refinement invariance in some cases. Maximum entropy and reflection rules have their own drawbacks.
answer: |-
  Below is a systematic specification of desiderata for a theory of credence revision under uncertain evidence, motivated by the Jeffrey conditionalization framework. For each, I provide the **motivating case/consideration** and flag **negotiability**. I then identify **potential conflicts** between desiderata and briefly evaluate **Jeffrey conditionalization**, **maximum entropy rules**, and **reflection-style rules** against the list.  

  ---

  ### **Desiderata for Uncertain Evidence Updating**  
  1. **Generalizes Strict Conditionalization**  
     - *Motivation*: When evidence becomes certain (e.g., learning *E* with credence 1), the rule must reduce to Bayesian conditionalization: \( P_{\text{new}}(H) = P_{\text{old}}(H|E) \).  
     - *Negotiability*: Non-negotiable. Failure implies incompatibility with standard Bayesianism.  

  2. **Rigidity Condition**  
     - *Motivation*: If conditional probabilities within evidential cells change arbitrarily, the update loses objectivity. Rigidity preserves the agent’s beliefs *given* the evidence: \( P_{\text{new}}(H|E_i) = P_{\text{old}}(H|E_i) \) for all hypotheses \( H \) and evidential cells \( E_i \).  
     - *Negotiability*: Non-negotiable for Jeffrey-style rules; alternatives (e.g., learning causal structure) must justify relaxing it.  

  3. **Invariance Under Partition Refinement**  
     - *Motivation*: Refining a partition into subcells with identical conditional probabilities (e.g., splitting "red" into "crimson" and "scarlet" without changing \( P(H|\text{red}) \)) should not alter final credences. Ensures robustness to evidence granularity.  
     - *Negotiability*: Non-negotiable. Failure invites representational arbitrariness.  

  4. **Addresses Order Effects**  
     - *Motivation*: Sequential updates on partitions \( \mathcal{E} \) then \( \mathcal{F} \) may yield order-dependent results if the agent’s *total experience* differs between sequences (e.g., observing a flash then a sound vs. sound then flash). Commutativity should hold only when experiences are identical across orders.  
     - *Negotiability*: Commutativity is a preference (e.g., for propositional evidence purists) but negotiable if experiences are order-sensitive.  

  5. **Diachronic Coherence**  
     - *Motivation*: No Dutch books—no sequence of bets exploiting the rule should force sure loss. Protects rationality under predictable updating.  
     - *Negotiability*: Non-negotiable. Synchronic coherence alone is insufficient.  

  6. **Handles Unarticulated and Old Evidence**  
     - *Motivation*: Agents often lack vocabulary for evidence (e.g., "a smell I can’t describe") or re-evaluate existing knowledge (e.g., reinterpreting old data). The rule must not require evidence to be novel or linguistically precise.  
     - *Negotiability*: Non-negotiable for real-world applicability.  

  7. **Distinguishes Updating from Supposing**  
     - *Motivation*: Updating (e.g., adopting a credence shift due to sensory input) must differ from *supposition* (e.g., imaging \( P(H| \text{suppose } E) \)) to avoid conflating belief revision with hypothetical reasoning.  
     - *Negotiability*: Non-negotiable.  

  8. **Handles Infinity/Undefined Probabilities**  
     - *Motivation*: Continuous evidence (e.g., a spectrometer reading) or undefined \( P(H|E_i) \) (e.g., when \( P_{\text{old}}(E_i) = 0 \)) must be addressed without ad hoc assumptions.  
     - *Negotiability*: Non-negotiable for generality.  

  9. **Computability/Approximability**  
     - *Motivation*: Agents with limited resources must approximate updates (e.g., via sampling). Rules requiring unbounded computation (e.g., solving PDEs) are impractical.  
     - *Negotiability*: Negotiable for ideal agents; non-negotiable for bounded rationality.  

  10. **Higher-Order Uncertainty**  
      - *Motivation*: Doubt about evidence reliability (e.g., "I saw a flash, but my vision is blurry") must propagate to hypotheses. The rule should not presuppose fixed likelihoods.  
      - *Negotiability*: Non-negotiable for complex agents.  

  ---

  ### **Conflicts Between Desiderata**  
  - **Refinement Invariance (3) vs. Rigidity (2)**:  
    If conditional probabilities *differ* across subcells upon refinement, rigidity at the coarse level forces non-rigidity at the fine level. *Conflict*: Rigidity must be defined relative to a fixed partition. Full invariance is unattainable if rigidity holds only coarsely.  

  - **Order Independence (4) vs. Total Experience (Motivation for 4)**:  
    Requiring commutativity *regardless of experience* (e.g., same partition, different phenomenology) ignores path-dependence. *Conflict*: Order-independence is only viable if "evidence" is defined propositionally, but Jeffrey cases often involve non-propositional experiences.  

  - **Diachronic Coherence (5) vs. Higher-Order Uncertainty (10)**:  
    Rigidity (required for coherence in Jeffrey updating) breaks if agents learn about evidence reliability mid-update. *Conflict*: Coherence may demand fixed likelihoods, but higher-order uncertainty requires them to be mutable.  

  - **Computability (9) vs. Infinity Handling (8)**:  
    Rules for infinite partitions (e.g., density-based updates) often lack closed-form solutions, hindering approximation. *Conflict*: Generality trades off against tractability.  

  **Result**: No rule can satisfy all desiderata simultaneously without compromise. Jeffrey conditionalization prioritizes 1,2,5 but conflicts with 3,4,10. Maximum entropy prioritizes 3,7,8 but clashes with 2,5.  

  ---

  ### **Rule Evaluation**  
  | Desideratum               | Jeffrey Conditionalization             | Maximum Entropy Rule                     | Reflection-Style Rule                |  
  |---------------------------|----------------------------------------|------------------------------------------|--------------------------------------|  
  | 1. Generalizes Strict     | ✅ Yes: Reduces when \( P_{\text{new}}(E_i) = 1 \). | ✅ Yes: Constraint \( P_{\text{new}}(E_i) = 1 \) implies it. | ⚠️ Only if future credence is certain. |  
  | 2. Rigidity               | ✅ Core assumption.                    | ❌ Violates: Maximizes entropy, altering conditionals. | ❌ Violates: Future credences may change conditionals. |  
  | 3. Partition Invariance   | ❌ Fails if refinement changes rigidity. | ✅ Preserved under compatible refinements. | ❌ Sensitive to partition granularity. |  
  | 4. Order Effects          | ❌ Non-commutative; order matters.     | ❌ Non-commutative; depends on constraint sequence. | ⚠️ Commutative only under idealized trust. |  
  | 5. Diachronic Coherence   | ✅ Coherent under rigidity.            | ❌ Dutch-bookable; not probability-kinematic. | ❌ Dutch-bookable if self-trust is misplaced. |  
  | 6. Unarticulated/Old Evidence | ⚠️ Requires articulable partition.    | ✅ Can handle entropy constraints from vague evidence. | ❌ Relies on precise future credences. |  
  | 7. Update vs. Supposition | ✅ Clear: updates actual credences.    | ✅ Clear: constraint-based update.       | ❌ Blurs: future credence as supposition. |  
  | 8. Infinity/Undefined     | ⚠️ Limited to discrete cases.         | ✅ Extends via functional optimization.  | ⚠️ Same limitations as strict conditionalization. |  
  | 9. Computability          | ✅ Easy for finite partitions.         | ❌ Hard: convex optimization for large spaces. | ⚠️ Requires modeling future selves. |  
  | 10. Higher-Order Uncertainty | ❌ Fails: rigidity assumes fixed likelihoods. | ⚠️ Possible via constraints on reliability. | ✅ Natural: discounts unreliable future selves. |  

  **Key Takeaways**:  
  - **Jeffrey conditionalization** excels on 1,2,5,7 but fails 3,4,10 due to rigidity and partition dependence.  
  - **Maximum entropy** satisfies 3,6,8 but violates 2,5 (rigidity/coherence) and is intractable (9).  
  - **Reflection rules** handle 10 gracefully but fail 2,5,7 (rigidity/coherence/supposition) and lack generality (8).  

  **Conclusion**: The desiderata reveal trade-offs central to the literature (e.g., rigidity vs. flexibility, coherence vs. higher-order uncertainty). Jeffrey conditionalization remains the benchmark for its coherence and simplicity, but no rule dominates universally.
