  First, I consider the core challenge: unreceived performatives seem problematic for both theories. For convention-first, if social practices require uptake, how do private vows work? For intention-first, if recognition is essential, how can unheard resignations be valid? The user suspects some disagreement may stem from equivocal use of "convention" - sometimes meaning coordination solutions, other times meaning constitutive rules.

  The response structure needs careful planning: 
  - Agreed claims establishing common ground
  - Disagreements table with precise formulations
  - Cruxes with test cases
  - Analysis of verbal disputes
  - My own adjudication

  For the agreed claims section, I identify points both camps would accept: the distinction between illocutionary force and perlocutionary effect, the importance of context, and that conventions/intentions typically coexist. The key is making these substantive without being vacuously agreeable.

  When structuring the disagreements table, I focus on three core divides: 
  1) What constitutes force (conventions vs intentions)
  2) Necessity of uptake
  3) Status of private performatives
  Each position is phrased as its proponents would endorse.

  For the cruxes, I design test cases that isolate variables: 
  - The unheard resignation letter 
  - The uncommunicated refusal 
  - The machine-processed agreement
  Each camp's prediction is clearly stated.

  The verbal dispute analysis reveals how "convention" gets used differently - as constitutive framework versus coordination device. This explains some apparent disagreements.

  Finally, in my adjudication, I lean toward intention-first while acknowledging convention's importance for institutional acts. The decisive consideration would be whether we can identify any speech act completely detached from all conventions.

  Throughout, I maintain the requested formal structure while ensuring accessibility for readers unfamiliar with the primary texts. The tone remains professional yet engaging, suitable for the user's general readership.
answer: |-
  ## Joint Statement on Speech Acts and Unreceived Performatives  
  *(Drafted by Convention-First and Intention-First Advocates)*  

  ### I. Agreed Claims  
  1. **Illocutionary Acts as Distinct**: Speech acts (e.g., promising, warning) achieve their force by doing something *in* saying something (illocution), distinct from merely causing effects (perlocution).  
  2. **Contextual Necessity**: All speech acts require *some* context to succeed—linguistic, social, or situational—even if minimal.  
  3. **Co-Presence of Elements**: Both conventions and intentions are typically involved in speech acts. Conventions facilitate recognition; intentions guide communicative goals.  
  4. **Uptake’s Practical Role**: Hearer recognition is pragmatically crucial for securing the act’s social effect (e.g., ensuring a warning is heeded).  
  5. **Not All Utterances Are Acts**: An utterance only becomes a specific speech act when contextual/intentional thresholds are met (e.g., random words aren’t promises).  
  6. **Unreceived Cases Challenge Both**: "Unreceived performatives" expose unresolved tensions in both theories and require refinement.  

  ---

  ### II. Disagreements Table  
  | **Sub-Question**                                                                 | **Convention-First Position**                                                                                             | **Intention-First Position**                                                                                              | **Why the Difference Matters**                                                                                               |  
  |----------------------------------------------------------------------------------|---------------------------------------------------------------------------------------------------------------------------|---------------------------------------------------------------------------------------------------------------------------|------------------------------------------------------------------------------------------------------------------------------|  
  | **What constitutes the force of an illocutionary act?**                          | Force is conferred by a *public convention*: rules that assign status (e.g., "I resign" only works within a governance system). | Force is constituted by *intentionality*: the speaker’s aim to achieve an effect through hearer’s recognition of that aim. | Determines whether acts like resignations can exist outside institutional frameworks (e.g., in anarchic contexts).            |  
  | **Is hearer recognition (uptake) necessary for the act to occur?**               | Uptake is *often necessary* because conventions require social ratification (e.g., a wedding vow needs witness acknowledgment). | Uptake is *not necessary* for the act: a promise is made if the speaker intends it, even if unheard (e.g., a diary vow). | Affects legal/personal validity: Is an unheard resignation binding? Is a private vow morally significant?                    |  
  | **Can unreceived utterances (e.g., unheard vows) be full performatives?**        | No: Unreceived utterances are *incomplete attempts*. Force requires convention-bound uptake (e.g., unread resignation = attempt, not act). | Yes: The act is *completed* by intention. Uptake aids effectiveness but isn’t constitutive (e.g., private vow = binding self-commitment). | Impacts autonomy: Can individuals create obligations/acts alone, or must society validate them?                              |  

  ---

  ### III. Cruxes: Sub-Questions for Resolution  
  *(With agreed test cases and predictions)*  

  1. **Crux: Can conventions exist without intentional backing?**  
     - **Case**: A machine-triggered contractual agreement (e.g., software auto-clicking "I agree" with no human intent or oversight).  
     - **Convention-First Prediction**: *Not a speech act*. Conventions require human practices; absent intent, it’s a mechanical event.  
     - **Intention-First Prediction**: *Not a speech act*. Intent is irreducible; conventions are tools for intentional agents.  
     - **Why Crucial**: If conventions can exist without intent, convention-first wins; if intent is foundational, intention-first wins.  

  2. **Crux: Is uptake necessary for acts that alter institutional status?**  
     - **Case**: A resignation letter posted to a private blog, never read by the relevant authority.  
     - **Convention-First Prediction**: *No resignation occurred*. Institutional acts require uptake by designated agents.  
     - **Intention-First Prediction**: *Resignation was performed*. The speaker’s intention + conventional form suffices; non-receipt is a practical failure.  
     - **Why Crucial**: Tests whether institutional force is granted by rules alone or by intent + form.  

  3. **Crux: Do private vows create moral obligations?**  
     - **Case**: A silent, unrecorded vow to quit smoking, never disclosed.  
     - **Convention-First Prediction**: *No obligation*. Obligations require social accountability; private intent lacks force.  
     - **Intention-First Prediction**: *Obligation exists*. Self-directed commitments are binding via intentional self-obligation.  
     - **Why Crucial**: Reveals whether obligations stem from social structures or individual agency.  

  ---

  ### IV. Verbal Residue Analysis  
  - **Equivocation Identified**: "Convention" is used two ways:  
    - *(Coordination)*: Recurring solutions to communication problems (e.g., "I do" at weddings).  
    - *(Constitutive)*: Rules that create the act’s existence (e.g., marriage requires a licensed officiant).  
  - **Genuine Disagreement**: Whether constitutive conventions *alone* generate illocutionary force (*Convention-First*) or whether they merely scaffold intentions (*Intention-First*).  
  - **Proposed Clarification**: Replace "convention" with **"institutional scaffolding"** (for rule-bound contexts) and **"coordination device"** (for intention-recognition tools).  

  ---

  ### V. Adjudication: My Verdict on the Surviving Crux  
  The core unresolved crux is whether *institutional acts* (resigning, marrying) require uptake. **I side with Convention-First here**: Acts like resignations derive force from systems of rules requiring ratification. An unheard resignation is merely an attempt because institutions are inter subjective—they demand social verification. An intention alone cannot alter institutional reality; a president’s private "I declare war" changes nothing without machinery of state.  

  **Why Intention-First Falters Here**: It conflates *personal commitments* (vows) with *institutional transformations*. While intentions may bind the self, they cannot, unaided, reconfigure public statuses.  

  **The Single Consideration That Would Change My Mind**: If it could be shown that institutions *themselves* are reducible to aggregates of intentional states (e.g., collective acceptance = summed individual intentions), I would adopt Intention-First. But as long as institutions exert emergent normative power (e.g., "You’re still employed until HR processes your resignation"), Convention-First holds.  

  ---  
  *This document isolates genuine disagreement, exposes verbal pitfalls, and forces both camps to confront edge cases. The convention/intention dichotomy collapses for personal acts but holds for institutional ones—suggesting a hybrid theory is needed.*
