prompt: |-
  I have a set of gut verdicts about comparisons that flip when the data are split, and I want to know what principle, if any, they add up to. In each case I give the numbers and what I think.

  1. A trial of drug D against placebo, 100 patients per arm. D happened to be given mostly to the sicker patients: among mild cases D saved 9 of 10 and placebo 72 of 90; among severe cases D saved 36 of 90 and placebo 2 of 10. Overall D saved 45%, placebo 74%. Verdict: D works; the overall comparison is the misleading one.

  2. Two intensive care units, A and B, 100 patients each, with the same case mix on admission. A ventilates almost everyone: 90 ventilated, 45 survived, and 8 of its 10 unventilated patients survived. B ventilates 20, of whom 9 survived, and 60 of its 80 unventilated patients survived. Overall A 53%, B 69%; within each group A is ahead. Verdict: B is the better unit. Who ends up on a ventilator is a consequence both of how sick the patient was and of the unit's own habits, so the two groups are not comparing like patients, and here I would rather read the bottom line.

  3. A firm pays men more than women overall, but within every job title women earn at least as much as men. Verdict: the within-title comparison does not show the firm is fair, because who ends up in which title is part of what I am asking about. I go with the overall gap.

  4. A crop trial where the reversal appears only when the plots are split by which of two technicians recorded the yields. Verdict: nothing here; I would report the overall difference and treat the split as noise.

  5. Life expectancy in two countries. Country A has a much younger population and a slightly higher crude death rate, but lower death rates in every age band. Verdict: both numbers look right to me, for different questions — the crude rate for how likely a randomly chosen resident of A is to die this year, the age-adjusted one for whose health system is doing better — and I cannot tell whether that makes my verdicts inconsistent.

  6. The case I keep going back and forth on: two diets compared on weight loss, with results split by how closely participants stuck to their diet. Adherents do better on both diets. Sticking to a diet is partly a matter of what the diet is like to live with and partly a matter of the person.

  I suspect the principle is causal: pool the data unless the variable I am splitting on is a common cause of both the treatment and the outcome, in which case split. Is that right, or does one of my verdicts have to go? State the principle as precisely as you can, say which verdict it cannot accommodate, and tell me what it implies for a case I have not given — a variable that is a common cause of treatment and outcome but is itself partly shaped by the treatment, such as a severity score taken a few days in. If no single principle fits, give me the two best candidates and what each costs me. I would also like to know whether the principle is genuinely about causes or is only the thin instruction to answer the question that was asked, and if it is the latter, whether that is a defect.
reasoning: |-
  We are dealing with Simpson's paradox and similar phenomena. The key is to determine when to look at the overall data and when to break down by a confounding variable.

  The principle: 
  - We should condition on (i.e., split by) a variable if it is a confounder (i.e., a common cause of the treatment and the outcome) in order to get an unbiased estimate of the causal effect of the treatment on the outcome.
  - On the other hand, if the variable is a mediator (i.e., on the causal pathway from treatment to outcome) or a collider, we should not condition on it because that would introduce bias.

  However, in some cases, the variable might be both a confounder and a mediator. This is complex.

  Let me analyze each case:

  1. Drug trial: 
     - The severity of illness is a confounder: it affects both the assignment to drug (sicker patients got D) and the outcome (survival). 
     - Therefore, we condition on severity. The overall comparison is confounded and misleading. Verdict: correct to split.

  2. ICU units:
     - The variable in question is whether a patient was ventilated. However, ventilation is not a pre-treatment variable. It is an intervention that occurs after admission and is influenced by the ICU unit's practice and the patient's condition. 
     - The patient's condition (severity) is a confounder: it affects both the decision to ventilate (so it affects the ventilation status) and the outcome. But note, the ICU unit also affects ventilation (so ventilation is also an intermediate variable). 
     - However, the question is about the quality of the ICU units. We are comparing the two units. The problem is that the ventilation practice differs. The ventilation variable is a mediator of the ICU effect? Actually, the outcome (survival) is caused by the patient's condition and the treatment (ventilation) provided. The ICU unit affects the decision to ventilate and the quality of ventilation. 
     - But note: we are not assigning ventilation randomly. The sicker patients are more likely to be ventilated. Therefore, within the ventilated group, the patients in unit A might be sicker than in unit B? Actually, the case mix on admission is the same. But then the units have different thresholds for ventilation. 
     - The issue: if we condition on ventilation, we are comparing patients who were ventilated in A vs B and non-ventilated in A vs B. But the ventilation decision is made by the unit and depends on the patient's condition. However, the patient's condition is the same on admission. Therefore, the ventilation decision is driven by the unit and the patient's condition. 
     - But note: the patient's condition (on admission) is a confounder for the effect of ventilation on survival. However, here we are comparing the ICU units, not ventilation. The problem is that the ventilation decision is a post-admission variable and is affected by the ICU unit. Therefore, conditioning on ventilation would block part of the effect of the ICU unit (if the unit affects survival by choosing to ventilate appropriately). 
     - Alternatively, we might consider the ventilation decision as a mediator. Then conditioning on it would lead to biased estimates of the total effect of the ICU unit. 
     - Therefore, we should not condition on ventilation. We should look at the overall survival. Verdict: correct to use the overall.

  3. Gender pay gap:
     - The job title is an intermediate variable because the firm's hiring/promotion practices (which might be discriminatory) assign job titles. The job title then affects pay. 
     - The overall pay gap might reflect discrimination in assignment to job titles. Therefore, we should not condition on job title if we want to know the total effect of gender on pay (which includes both discrimination in hiring/promotion and in pay within title). 
     - Verdict: correct to use the overall.

  4. Crop trial by technicians:
     - The technician is not a confounder. It is an external factor that might add noise. There is no reason to think that the technician assignment is a common cause of the treatment (crop variety) and the outcome (yield). Therefore, we do not condition. Verdict: correct.

  5. Life expectancy:
     - The age is a confounder for the effect of the country on death. The country's health system affects death rates, and the age distribution of the population is a pre-existing condition. 
     - However, the crude death rate is also informative for other purposes. 
     - The verdict is that both are valid for different questions. This is consistent: 
          - The overall (crude) death rate answers: what is the risk of death for a randomly selected person in that country?
          - The age-adjusted death rate answers: which country has a better health system (controlling for age)?
     - So we condition on age when we want to compare the health systems.

  6. Diet adherence:
     - Adherence is a post-randomization variable. It is affected by the diet (some diets are easier to stick to) and by the individual. 
     - If we condition on adherence, we are comparing the effect of the diet only among those who adhered. But adherence is also a consequence of the diet. Therefore, conditioning on a mediator would block part of the diet's effect (the part that works by increasing adherence). 
     - Moreover, adherence is also influenced by individual factors that might be related to the outcome (weight loss). Therefore, the group that adheres might be different from the group that does not. 
     - We are interested in the total effect of the diet (which includes both the effect of the diet itself and the effect via adherence). Therefore, we should look at the overall effect (intention-to-treat) and not condition on adherence.

  Now, the proposed principle: 
     - Condition on a variable if it is a confounder (common cause of treatment and outcome) but not if it is a mediator or a collider.

  But note: in the ICU case, we did not condition on ventilation because ventilation is a mediator (and also because it is affected by the ICU and the patient's condition). However, the patient's condition (on admission) is a confounder. We did condition on it by having the same case mix? Actually, the example says "same case mix on admission", so we don't need to condition on severity because it is balanced by design? But the problem is that within each ventilation group, the severity might not be the same? Actually, the example does not give severity breakdown within ventilation. We are told the overall case mix is the same, but the ventilation decisions are different. 

  In the ICU case, the ventilation group is a mixture of the unit's practice and the patient's condition. Therefore, if we condition on ventilation, we are comparing patients who were ventilated in A vs B, but the reason they were ventilated might be different. In unit A, they ventilate almost everyone, so the ventilated group in A includes both mild and severe. In unit B, they ventilate only the very sick. Therefore, the ventilated group in B is much sicker than in A. So the within-ventilation comparison is confounded by severity. That's why we see a reversal: the ventilated group in B has a lower survival rate because they are sicker. Similarly, the non-ventilated group in A is very small and might be the healthiest, while in B the non-ventilated group is larger and includes a mix.

  Therefore, the problem in the ICU case is that ventilation is a collider? Actually, no. It is a variable that is affected by two causes: the patient's condition and the ICU unit. When we condition on ventilation, we induce an association between the patient's condition and the ICU unit. Specifically, if we condition on ventilation, then in unit B only the very sick are ventilated, while in unit A everyone is ventilated. So within the ventilated group, unit B has sicker patients. Similarly, in the non-ventilated group, unit A has only the healthiest (because they didn't need ventilation) while unit B has the moderately sick (who they didn't ventilate). Therefore, conditioning on ventilation creates a bias because we are comparing groups that are not comparable in terms of severity.

  Thus, the principle: we should not condition on a variable that is a collider or a mediator, and we should condition on confounders. But in the ICU case, ventilation is not a confounder? It is a variable that is a consequence of the treatment (ICU unit) and the patient's condition. Conditioning on it creates a spurious association between the ICU unit and the patient's condition? That is, it creates a collider bias.

  Therefore, the principle holds: we condition on confounders and avoid conditioning on mediators and colliders.

  Now, what about a variable that is both a common cause and is also affected by the treatment? For example, a severity score taken a few days after treatment starts.

  This variable (let's call it Z) is a time-dependent confounder. It is a confounder for the subsequent treatment and outcome, but it is also affected by the prior treatment. This is a situation that requires more advanced methods (like marginal structural models or g-methods). We cannot simply condition on Z because that would block part of the effect of the treatment (if the treatment affects Z, which then affects the outcome). But if we don't condition, then Z confounds the effect of the subsequent treatment.

  In such cases, we need to use methods that can handle time-dependent confounding.

  Therefore, the principle as stated (condition on confounders) is not sufficient. We must avoid conditioning on variables that are affected by the treatment. But if a variable is a confounder and also affected by the treatment, we face a challenge.

  So for the case you mentioned (a severity score taken a few days in), we cannot simply condition on it. We would need to use methods that adjust for the time-dependent confounding appropriately.

  Now, to the verdicts:

  - Case 1: correct to split (severity is a confounder).
  - Case 2: correct to use overall (ventilation is a collider when we condition on it? Actually, conditioning induces collider bias, so we avoid conditioning. But note: we are not given the patient severity beyond admission, and we are told the case mix is the same. So the overall should be fine. However, the example does not provide severity at the time of ventilation decision. So we rely on the overall).
  - Case 3: correct to use overall (job title is a mediator or a consequence of discrimination).
  - Case 4: correct to ignore the split (technician is not a confounder, so we don't condition).
  - Case 5: both are valid for different questions (so the principle is that we condition for the causal question about the health system, but we do not condition for the descriptive question about the overall death rate).
  - Case 6: we should not condition on adherence because it is a mediator and also because it may be affected by unmeasured confounders. We should look at the overall effect (intention-to-treat).

  Therefore, the principle I propose:

     Condition on a variable Z if:
       1. Z is a confounder (i.e., it causes both treatment and outcome) and 
       2. Z is not affected by the treatment.

     If Z is affected by the treatment, then conditioning on Z would block part of the treatment effect and also might introduce bias if there are unmeasured common causes of Z and the outcome.

     If Z is a mediator (on the causal pathway from treatment to outcome) or a collider (caused by two variables, one of which is the treatment and the other an unmeasured cause of the outcome), then we should not condition on Z.

     For time-dependent confounders (which are confounders and also affected by prior treatment), we need more advanced methods.

  Now, which verdict does this principle not accommodate? 

     All verdicts seem to fit.

     However, note that in case 2, we are not conditioning on ventilation because conditioning would create a collider bias (since ventilation is caused by both the ICU unit and the patient's condition). The patient's condition is a confounder, but we are told the case mix is the same on admission, so we don't need to condition on it? Actually, the example says "same case mix on admission", so we don't condition on severity because it is balanced. But then why do we get a reversal? Because the ventilation decision is driven by both the unit and the patient's condition. The problem is that within the ventilation groups, the patient's condition is not the same. So we have a new confounding within the strata? This is the collider bias. Therefore, we avoid conditioning.

     So the principle holds.

     Is the principle genuinely about causes? Yes, because we are using causal reasoning (confounders, mediators, colliders). We are not just answering the question that was asked. The question that was asked might be ambiguous. For example, in the pay gap, we are interested in the total effect of gender on pay, which includes both direct and indirect discrimination. Therefore, we do not condition on job title. But if we were only interested in the direct pay discrimination within job titles, then we would condition. However, the verdict says we care about the overall gap. So the principle is causal: we are interested in the total causal effect of the treatment (gender, which is not manipulable, but we are thinking of it as an exposure) on the outcome (pay). 

     But note: we cannot randomly assign gender. So we must be cautious. The overall gap might be due to other factors (like differences in education, experience, etc.). So we might want to condition on those to get the direct effect? But the example says that within every job title women earn at least as much. So the question is about the assignment to job titles. The verdict is that we are interested in the total effect (including job assignment). 

     Therefore, the principle is causal and it is not just about the question asked. However, the question asked might determine which causal effect we are interested in (total effect or direct effect). 

     In the diet case, we are interested in the total effect of the diet (the effect we would see if we assigned the diet and let adherence happen naturally). Therefore, we do not condition on adherence.

     The defect of the thin instruction (just answer the question) is that sometimes we don't know what question we should ask. The causal principle guides us to the appropriate question.

  Conclusion:

     The principle: Condition on a variable Z if and only if:
          (a) Z is a pre-treatment confounder (i.e., it causes both the treatment assignment and the outcome and is not affected by the treatment) and 
          (b) conditioning on Z does not induce bias (e.g., by creating collider bias or by conditioning on a mediator).

     For variables that are post-treatment, we avoid conditioning unless we are explicitly interested in direct effects (and even then, we must be cautious).

     In the case of a severity score taken a few days in (which is post-treatment and might be affected by the treatment), we cannot simply condition. We must use methods that can handle time-dependent confounding (like g-methods).

     All your verdicts are consistent with this principle.

     However, note that in case 2, we are not conditioning on ventilation because it is post-treatment and because conditioning would induce collider bias. We rely on the overall because the case mix is balanced at baseline.

     But what if the case mix were not balanced? Then we would condition on the baseline severity. But note that the example says the case mix is the same on admission.

