answer: |-
  **Speech for the Edinburgh Society of Merchants and Planters, 1776**

  My Lord President, Honoured Guests, Ladies and Gentlemen of the Edinburgh Society,

  It is a signal honour to stand before you tonight, amidst the convivial atmosphere of this distinguished gathering, on the very year that sees our esteemed fellow citizen, Dr Adam Smith, bestow upon the world his profound *Inquiry into the Nature and Causes of the Wealth of Nations*. We meet to celebrate commerce – the lifeblood of nations – and to propose a toast to the commerce and prosperity of that vast entity, the British Empire. A worthy sentiment, indeed, and one I shall gladly join you in honouring.

  Dr Smith’s great work, I venture to say, offers us not merely instruction, but a powerful lens through which we might examine the very objects of our toast. His is a philosophy grounded in observation, in tracing the often-unseen consequences of our actions and institutions. And it is with the spirit of honest inquiry, a spirit I know this learned city cherishes, that I would draw your attention to some of his reflections concerning the empire and its commerce – reflections that, I believe, illuminate the path to *true* and *lasting* prosperity.

  Smith observes, with characteristic penetration, that our splendid American colonies, and indeed the system of trade that binds them, were not primarily conceived for the grandeur of the Crown or the general wealth of the nation. Their foundations, he argues, were laid by the enterprise and capital of private adventurers, and their subsequent regulation has been powerfully shaped by the interests of merchants engaged in that trade. This vigour and initiative we must acknowledge and admire; it is the engine of much we see around us.

  Yet, Dr Smith compels us to ask: For whom does this system truly prosper? He demonstrates, with relentless logic, that the monopoly of the colonial trade – that exclusive access so fiercely guarded – operates not as a bounty upon the nation, but as a subtle tax *upon* the home consumer. The dearness of sugar, tobacco, or timber in our shops is the direct consequence of shutting out cheaper supplies from foreign shores. The merchant may profit from the scarcity, but the labourer, the artisan, the ordinary subject in Britain pays the higher price.

  Furthermore, consider the immense apparatus required to secure this vast territorial empire and its monopolised commerce – the fleets that patrol the oceans, the armies garrisoning distant shores, the costly administration extending from Whitehall to the Carolinas. Who bears this extraordinary burden? Dr Smith points unflinchingly to the public purse, funded by the taxes of the whole people. The profits of the colonial trade, however, flow into the coffers of a comparatively small group. There exists, he suggests, a profound imbalance: the many shoulder the cost, while the concentrated gains enrich the few. Can such an arrangement be the soundest foundation for *national* prosperity?

  He ventures further, posing a question that should give thoughtful merchants pause. Is it truly wise, is it economically rational, for a great nation to conquer and govern distant lands, at immense expense, principally to create customers for its shopkeepers? Or might this suggest, as Smith implies with a touch of irony, that the merchants have perhaps acquired an influence over policy disproportionate to the *national* interest? Is empire, maintained on such terms, a prudent investment for Britain, or a potentially ruinous extravagance?

  And we cannot, in this assembly gathered under the banner of commerce and empire, ignore the dark foundation upon which much New World prosperity is built. Dr Smith, with moral clarity, denounces the slave trade and the institution of slavery as economic absurdities founded on profound injustice – a horror incompatible with the principles of humanity and sound policy alike. Yet this very horror props up the plantation system, a cornerstone of our colonial wealth. This dissonance hangs heavy in the air we breathe tonight, a silent challenge to our proclaimed values of liberty and improvement.

  Smith’s sympathy for the grievances of our American cousins – their resistance to taxation without representation, their desire for free trade – stems precisely from this analysis. He sees their complaints not as mere rebellion, but as a logical reaction to a system he finds economically irrational *for Britain itself*. The attempt to maintain an expensive monopoly over unwilling subjects is, in his view, a project more likely to drain the metropolis than enrich it.

  Therefore, Ladies and Gentlemen, when we raise our glasses to “the Commerce and Prosperity of the British Empire,” let us do so with Dr Smith’s profound insights freshly in mind. Let us toast not to the perpetuation of monopolies that tax our own people, nor to an empire maintained at public expense for private gain, nor to riches built on the abomination of slavery. Let us toast, instead, to a commerce that is truly *free* – free from the shackles of exclusive privilege. Let us toast to a prosperity that is *broadly based* – enriching the industrious many throughout these islands, not just the fortunate few. Let us toast to an empire conceived not as a system of extraction and domination, but as a community bound by mutual interest, justice, and enlightened policy. *That* would be a commerce worthy of Britain, and *that* would be a prosperity both sound and lasting.

  To the Commerce and Prosperity of the British Empire – wisely understood, and justly pursued!
