prompt: |-
  Modern patent systems resolve competing claims to the same invention with priority rules: the patent goes to whoever filed first, and the invention is treated as the work of a determinate individual or team who can then exclude others from it. Yet the same systems refuse patents for inventions that a person skilled in the art would find obvious given the prior art, and the history of science and technology is full of near-simultaneous arrivals — the calculus, natural selection, the telephone, the incandescent lamp — that suggest many inventions would have appeared on roughly the same schedule whoever happened to get there first. What conception of discovery does this practice presuppose: that inventions are attributable to particular minds in a way that makes the first filer's claim to exclusive control coherent, or merely that the law needs some determinate tie-breaker and is otherwise indifferent to who deserves credit? Reconstruct the implicit theory, distinguish what the practice strictly requires from what it merely fits, say which rival views it quietly rules out, and say what would have to change if simultaneous discovery were treated as the normal case rather than a curiosity. Lead with your bottom line in the first sentence, then give the reasoning, with no preamble. Separate what is settled from what is genuinely contested among people who know the history and law of invention, and don't present a contested view as the consensus.
reasoning: |-
  Hmm, the user wants me to analyze modern patent systems and their underlying conception of discovery. They're pointing out a tension: patent systems award patents to the first filer while also requiring that inventions be non-obvious (meaning they wouldn't have been developed by anyone skilled in the field around the same time). They mention famous examples of simultaneous inventions like calculus and the telephone to suggest many inventions are actually inevitable developments.

  The user wants me to reconstruct the implicit theory behind patent law, distinguish what the practice strictly requires from what it merely fits, identify what rival views it rules out, and discuss how things would change if simultaneous discovery were considered normal. They want my bottom line first, then reasoning, with no preamble. I need to separate settled points from contested ones.

  Looking at patent law, the core idea seems to be that inventions are attributable to specific individuals or teams. First-to-file systems clearly prioritize the first filer, which suggests an individualistic view of invention. But non-obviousness requirements acknowledge that inventions build on prior art - if something is obvious given existing knowledge, it's not patentable. This creates a tension: patent law treats the first filer as uniquely deserving, while history shows many discoveries are simultaneous.

  The settled aspects: Patent systems need a tie-breaker (first-to-file or first-to-invent) to resolve conflicts. Non-obviousness is required to prevent trivial patents. The law doesn't require that only one person could have invented something, just that it wasn't obvious at the time. And simultaneous invention doesn't invalidate a patent unless it demonstrates obviousness.

  Contested areas among experts include whether simultaneous invention proves obviousness (some say yes, others note timing lags). There's debate about how much credit individuals deserve versus broader societal progress. Some argue patent systems could be more collaborative, while others defend the individual incentive model.

  If simultaneous discovery were treated as normal rather than exceptional, patent law would need significant changes. We might see shorter patent terms, mandatory licensing, more use of prizes instead of patents, or broader research exemptions. The entire individualistic foundation would be undermined.

  I'll structure my response with the bottom line first: that patent law implicitly treats inventions as primarily attributable to specific inventors despite acknowledging simultaneous invention. Then I'll break down the reasoning into what's settled, what's contested, and the implications if simultaneous discovery were normalized. I'll be careful not to present contested views as consensus.
answer: |-
  **Bottom line:** Patent law's priority rules presuppose that inventions are primarily attributable to specific inventors whose timely effort justifies exclusive control, while the non-obviousness requirement acknowledges that inventions emerge from a shared technological context, but treats simultaneous invention as an exceptional challenge to individual attribution rather than the norm.

  **Reasoning:**

  1.  **Settled Law and Practice:**
      *   **Priority Rule:** Law *requires* a determinate tie-breaker (first-to-file/first-to-invent) to assign the patent right efficiently and avoid costly disputes over minor timing differences. It is legally indifferent to whether *credit* for the idea *should* go solely to the first filer; its function is to assign the *property right* decisively.
      *   **Non-Obviousness:** Law *requires* that an invention not be obvious to a person skilled in the art at the time of filing. This explicitly recognizes that invention builds on prior art and occurs within a shared technological/scientific trajectory. If simultaneous invention *demonstrates* obviousness (e.g., multiple independent arrivals *very* close in time using known methods), the invention is invalidated. Simultaneous invention is thus a potential *evidentiary tool* for proving obviousness, not a direct challenge to the priority rule itself.
      *   **Individual Attribution:** The practice *strictly requires* treating the invention as the work of a specific, identifiable individual or team for the purposes of assigning the patent right and legal responsibility. This is an administrative and legal necessity for the system to function (assigning rights, enforcing infringement, licensing).

  2.  **Implicit Theory (Fitting, Not Strictly Required):**
      *   While the law *requires* a tie-breaker and individual attribution administratively, the *coherence* of granting a *monopoly* based on being first implicitly relies on a conception where the first filer's contribution is sufficiently unique and non-inevitable to merit exclusionary control. The system presumes that, absent obviousness, the *specific* effort and insight of the *particular* inventor(s) who filed first were the *proximate cause* of the invention appearing *when and as it did*, even if others *might* have arrived there later. It fits a view where the inventor adds a non-trivial, identifiable leap beyond the prior art, making their individual contribution decisive for the timing and specific form of the invention.

  3.  **Rival Views Quietly Ruled Out:**
      *   **Purely Societal/Collective Determinism:** The practice rules out the view that inventions are *entirely* predetermined by the state of prior art and social need, rendering the specific inventor irrelevant (as this would make *all* non-obvious inventions obvious by definition, collapsing the system). The non-obviousness bar is set *above* mere inevitability given the prior art.
      *   **Pure "Eureka" Moment Romanticism:** Conversely, it also rules out the view that inventions spring fully formed from genius minds in complete isolation, as the non-obviousness requirement explicitly ties validity to the context of the "person skilled in the art" and the existing knowledge base.
      *   **Credit-Based Systems:** It rules out systems primarily concerned with accurately distributing *scientific credit* (like academic authorship norms). The patent system cares about assigning an exclusive *right*, not moral credit; simultaneous inventors who file second get nothing, regardless of their independent contribution.

  4.  **Contested Views Among Experts:**
      *   **The Significance of Simultaneity:** There is genuine contestation over how strongly the historical frequency of near-simultaneous invention *undermines* the implicit theory of individual decisiveness presupposed for monopoly justification. Some argue it shows individual contribution is often marginal, making the monopoly an inefficient reward. Others argue simultaneity often involves significant lags, variations in method/quality, or occurs *because* the first inventor's work spurred others, still supporting the value of the first contribution.
      *   **Obviousness as Proxy:** There's debate over whether the non-obviousness requirement adequately captures the reality of incremental, context-driven invention, or if the bar is often set too low, allowing patents on inventions that were, in practice, inevitable soon after.
      *   **The Nature of the Inventive Leap:** Experts contest the extent to which the specific cognitive contribution of the named inventor(s) is truly decisive versus being a necessary but relatively small step on a well-trodden path.

  5.  **Implications of Treating Simultaneity as Normal:**
      If simultaneous discovery were treated as the *normal* case rather than an exception used only to prove obviousness, the foundational justification for granting exclusive rights based on being first would collapse. Significant changes would be required:
      *   **Radically Shorter/Weaker Monopolies:** Patent terms would likely be much shorter, recognizing the reduced marginal contribution of the first filer.
      *   **Mandatory Licensing/Compulsory Pools:** Exclusive rights might be replaced or heavily supplemented by systems requiring licensing on fair terms, especially for foundational inventions likely to have multiple discoverers. Patent pools would become more central.
      *   **Shift to Prizes or Direct Funding:** Reward systems based on recognizing utility after the fact (prizes) or funding research upfront (grants) might replace or dominate the patent incentive for basic or highly predictable advances.
      *   **Broader Research Exemptions:** Exemptions for research use and potentially even early commercial development by others arriving independently would expand significantly.
      *   **Focus on Implementation over Conception:** Protection might shift towards rewarding specific, successful implementations or reductions-to-practice rather than the initial conception, as the latter is seen as more collectively determined. The link between the inventor's specific contribution and the exclusive right would be fundamentally weakened.
