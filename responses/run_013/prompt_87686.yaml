prompt: |-
  I recently read a short introduction to the debate between moral particularism and moral generalism, and I would like to know how much of it I can trust before I build any further thoughts on it. The explanation ran roughly as follows. Morality, on the particularist view, is a matter of responding to each situation on its own terms. There are no moral principles: because every situation is unique, no general rule can tell you what to do, and anyone who believes they can work out what to do by consulting a rule has mistaken a rough rule of thumb for a genuine guide. The particularist's central insight is that reasons are entirely context-dependent — a feature that counts in favour of acting one way here may count in favour of the opposite way there, or count for nothing at all, so nothing whatsoever can be said in advance about what supports what. This is essentially the older idea of prima facie duties restated in new vocabulary. The generalist, by contrast, holds that moral thinking consists in subsuming a case under the correct principle and reading off the answer, which is precisely why generalists are helpless before genuine moral difficulty. And because the particularist denies that any two situations are truly alike, the view drifts toward the claim that morality is whatever the situation seems to demand to the person caught up in it, which leaves it unable to explain how moral disagreement is even possible.

  I have no academic training in philosophy, and I have been turning this over on my own. Some of it rings true to me — I do think the details of a situation matter in a way that a rule seems to flatten out — but the last part bothers me, and I suspect the description of the generalist is a bit of a cartoon. What I want is a careful audit rather than a verdict on the whole debate. Please take the passage claim by claim and tell me which parts a thoughtful particularist would happily endorse, which are reasonable simplifications that a specialist would let pass, which are subtle misrepresentations, and which are simply wrong. I would particularly like to know whether the closing claims — that the view cannot account for moral disagreement and that it slides into "whatever seems right to the person in the situation" — actually follow from the parts of the view that survive scrutiny, or whether they depend on something the passage has quietly gotten wrong. I would also like to know what a generalist would rightly object to in the passage's description of their own position, since I gather that being able to apply a principle is not the same as applying it mechanically.

  Finally, please be explicit about your own confidence. Where the passage's summary is contested among people who study this, say so rather than presenting one reading as settled, and tell me what would change your mind — which argument or consideration would lead you to a different assessment of the summary, and at which point your own reasoning is most likely to be going wrong.
reasoning: |-
  Okay, let me approach this user's query systematically. They're clearly an intelligent autodidact who's spotted some red flags in a particularism/generalism summary and wants a forensic analysis. The user explicitly asks for a claim-by-claim audit with confidence levels - that's refreshingly precise.

  First, I need to unpack the passage's key claims about particularism: (1) complete rejection of moral principles, (2) radical context-dependence where reasons can invert, (3) equivalence to prima facie duties, and (4) alleged slide into subjectivism. Then the generalism caricature: (1) mechanical subsumption model, (2) helplessness in hard cases.

  Hmm... the user's suspicion about the "cartoonish" generalist description is spot-on. Even Kantians like Korsgaard have sophisticated accounts of moral judgment beyond rule-application. I should flag that as a major distortion. The particularism analysis also conflates Dancy's radical holism with moderate versions - big oversight.

  For the disagreement problem: the passage commits a non sequitur. Particularists like Little have robust accounts of intersubjective critique through shared sensitivity and reason-types. The subjectivism charge only sticks if we ignore their entire epistemology of moral perception. 

  Confidence levels: I'll tier them. High confidence on correcting the prima facie duties equivalence (Ross ≠ particularism) and the generalism strawman. Medium confidence on context-dependence nuances - some scholars like McKeever debate whether holism entails particularism. Should mention that.

  User's meta-request about my own uncertainty is smart. I'll explicitly note where professional disagreements persist (e.g., whether holism destroys all principles) and what evidence would change my reading - say, if Dancy retracted his holism claim.

  The "moral difficulty" jab at generalism feels particularly uncharitable. Must emphasize how Rossian pluralism or Kantian casuistry handles dilemmas. User deserves to see the real debate's depth beyond this reductive summary.
answer: |-
  Here's a careful audit of the passage, claim-by-claim, incorporating your concerns and addressing confidence levels. I'll follow your structure explicitly.

  **Passage Claim:** "Morality, on the particularist view, is a matter of responding to each situation on its own terms."
  *   **Assessment:** **Largely Correct & Endorsed.**
  *   **Reason:** This captures the core particularist commitment to the primacy of the particular case over general rules. Particularists (like Jonathan Dancy) argue that correct moral judgment requires attending to the specific features of *this* situation.
  *   **Confidence:** High. This is foundational to particularism.

  **Passage Claim:** "There are no moral principles: because every situation is unique, no general rule can tell you what to do..."
  *   **Assessment:** **Overstated Simplification (leaning towards Misrepresentation).**
  *   **Reason:** Radical particularists (like Dancy) *do* argue that there are no exceptionless, non-trivial moral principles that both guide action *and* survive all possible contexts. However, many particularists allow for *heuristic* principles, rules of thumb, or "default" reasons that are *usually* valid but can be overridden or silenced by context. They deny principles have *ultimate* authority or can be applied without context-sensitive judgment. "No moral principles whatsoever" is a strong reading, contested even among particularists. The claim "because every situation is unique" is also slightly misleading; uniqueness isn't the core argument (similar situations might exist), but rather the *holism of reasons* (see next point).
  *   **Confidence:** Medium-High. While the passage captures a strong particularist tendency, it flattens nuances within particularism. Evidence like Dancy's *Ethics Without Principles* confirms the radical holism, but other particularists (e.g., Margaret Little) might phrase it less absolutely.

  **Passage Claim:** "...anyone who believes they can work out what to do by consulting a rule has mistaken a rough rule of thumb for a genuine guide."
  *   **Assessment:** **Reasonable Simplification (Particularist Perspective).**
  *   **Reason:** This expresses the particularist critique of generalist methodology. Particularists argue that treating rules as algorithmic decision-procedures ignores necessary context-sensitivity and leads to error. They see rules as useful summaries of past judgments or training wheels, not fundamental guides.
  *   **Confidence:** High. This is a standard particularist critique of rule-based reasoning when taken as foundational.

  **Passage Claim:** "The particularist's central insight is that reasons are entirely context-dependent — a feature that counts in favour of acting one way here may count in favour of the opposite way there, or count for nothing at all..."
  *   **Assessment:** **Core Insight Correct, "Entirely" is Strong.**
  *   **Reason:** This describes the *Holism of Reasons*, a cornerstone of particularism (especially Dancy's). A feature like "causing pain" might be a reason against an action (hitting someone), a reason *for* an action (dentist drilling), or morally neutral (massage therapist applying pressure). This context-dependence is central.
  *   **Confidence:** High for holism being central. "Entirely" might be slightly overemphasized; some reason-types (e.g., "causing gratuitous suffering for fun") might be *extremely* stable across contexts, but particularists argue even these *could* be overridden/silenced in conceivable (if bizarre) scenarios. The core claim of pervasive context-sensitivity stands.

  **Passage Claim:** "...so nothing whatsoever can be said in advance about what supports what."
  *   **Assessment:** **Overstated / Misrepresentation.**
  *   **Reason:** While radical holism challenges the possibility of *exceptionless, substantive* principles, particularists *do* think we can say *something* in advance. We know certain features (pain, promise-breaking, helping) are *typically* relevant and have a default valence (negative, negative, positive). We can identify *kinds* of reasons. We just cannot guarantee their valence or force in *every* conceivable future situation without knowing the context. The claim implies total unpredictability, which isn't accurate to particularist epistemology; they rely on trained perception and understanding of *types* of features.
  *   **Confidence:** High that this is overstated. Particularist writings consistently discuss default reasons and the role of experience/judgment, not utter pre-contextual ignorance.

  **Passage Claim:** "This is essentially the older idea of prima facie duties restated in new vocabulary."
  *   **Assessment:** **Significant Misrepresentation / Mostly Wrong.**
  *   **Reason:** This is a crucial error. W.D. Ross's *prima facie duties* are *general principles* (e.g., fidelity, non-maleficence) that always provide *pro tanto* (as far as it goes) reasons. They are genuine, context-*invariant* reasons that conflict, and the right act is determined by which duty is *most stringent* in the situation. Particularists *reject* this. For them, a feature *only* becomes a reason *within* a specific context; it doesn't carry its moral weight independently. Rossian duties *are* the kind of general principles particularism opposes. Ross is a pluralist *generalist*.
  *   **Confidence:** Very High. This conflation is a common misunderstanding but is explicitly rejected by both Ross scholars and particularists (like Dancy, who contrasts his view sharply with Ross).

  **Passage Claim (Generalist):** "The generalist... holds that moral thinking consists in subsuming a case under the correct principle and reading off the answer..."
  *   **Assessment:** **Cartoonish Misrepresentation / Straw Man.**
  *   **Reason:** This portrays generalism as simplistic rule-application, which serious generalists (Kantians, Utilitarians, Rossians) explicitly reject. Generalists acknowledge:
      1.  **Interpretation:** Principles need interpretation to be applied to complex situations (What *counts* as lying? What *maxim* am I acting on?).
      2.  **Specification:** Principles often need specification in light of circumstances.
      3.  **Conflict:** Principles can conflict, requiring judgment about which takes priority *in this case* (Rossian stringency, Kantian prioritization rules).
      4.  **Judgment:** Recognizing which principle applies involves non-algorithmic judgment.
      Generalists believe principles are essential *guides* and *constraints*, not mechanical answer-generators. They argue principles provide essential structure, consistency, and justifiability that particularism lacks.
  *   **Confidence:** Very High. This is a persistent caricature. Reading Kant's *Groundwork* (on maxim formulation/testing) or Ross (on conflict and actual duty) immediately dispels it. A generalist would object vehemently.

  **Passage Claim (Generalist):** "...which is precisely why generalists are helpless before genuine moral difficulty."
  *   **Assessment:** **Uncharitable & Largely False.**
  *   **Reason:** This relies entirely on the previous caricature. Generalists have sophisticated frameworks for handling moral dilemmas and hard cases: Ross's weighing of prima facie duties, rule-utilitarian calculations of consequences under rules, Kantian casuistry applying the Categorical Imperative to complex maxims, Rawlsian reflective equilibrium. They see principles as *tools* for navigating difficulty, not obstacles that render them helpless. While particularists argue principles *distort* judgment in hard cases, generalists argue they *illuminate* them. Calling them "helpless" is polemical, not analytical.
  *   **Confidence:** High that this is unfair. Generalist literature is replete with nuanced discussions of moral dilemmas.

  **Passage Claim:** "And because the particularist denies that any two situations are truly alike..."
  *   **Assessment:** **Overstated / Misleading.**
  *   **Reason:** While holism emphasizes context-dependence, particularists don't necessarily claim *absolute* uniqueness denying *any* similarity. They focus on the *moral* uniqueness – the constellation of reasons present might differ, making direct rule-based comparison impossible. Two physically similar situations might differ morally due to subtle context. But they don't deny we learn from past cases or see patterns; they deny that these patterns constitute exceptionless principles.
  *   **Confidence:** Medium. The emphasis on uniqueness is sometimes strong in particularist rhetoric, but the core argument is about holism and the failure of principles, not metaphysical uniqueness.

  **Passage Claim:** "...the view drifts toward the claim that morality is whatever the situation seems to demand to the person caught up in it..."
  *   **Assessment:** **Non Sequitur / Significant Misrepresentation.**
  *   **Reason:** This does *not* follow logically from holism or the rejection of principles. Particularists emphatically reject subjectivism. They argue:
      1.  **Objectivity:** Moral reasons are *objective* features of situations; it's about what the situation *actually* demands, not what the agent merely *feels* it demands.
      2.  **Competence:** Correct judgment requires *sensitivity*, *experience*, *imagination*, and *virtue* (like phronesis/practical wisdom). It's a skill, not a feeling.
      3.  **Critique:** We can criticize judgments as *insensitive*, *ignorant of relevant features*, *biased*, or *lacking in understanding*. Disagreement arises from differing perceptions of salient features or their moral import, not mere whim.
  *   **Confidence:** High that this is a non sequitur and misrepresents particularism. Dancy and others explicitly address and reject this subjectivist reading.

  **Passage Claim:** "...which leaves it unable to explain how moral disagreement is even possible."
  *   **Assessment:** **False (based on the previous misstep).**
  *   **Reason:** Since the subjectivist slide doesn't follow, this criticism collapses. Particularists *do* explain disagreement:
      *   Disagreements arise because people perceive different features as salient in the situation.
      *   Disagreements arise because people assess the *valence* or *weight* of the same features differently within the context.
      *   Disagreements arise due to differences in background experience, sensitivity, or moral understanding.
      *   Disagreements arise about how past cases bear on the current one (analogy vs. disanalogy).
      The *object* of disagreement is what the *situation itself* requires, not the agent's feelings. They argue disagreement is *more* intelligible because it focuses on the concrete details, not abstract rule-wrangling.
  *   **Confidence:** High that this criticism fails, given the particularist account of objectivity and disagreement outlined above.

  **Summary of Key Issues:**

  1.  **Prima Facie Duties:** The passage fundamentally misidentifies Ross as a particularist. He is a key target *for* particularists.
  2.  **Generalist Caricature:** The portrayal of generalism as mechanical subsumption is a serious straw man. Generalists have rich accounts of judgment, interpretation, and conflict resolution.
  3.  **Subjectivism/Disagreement:** The claim that particularism leads to subjectivism and cannot explain disagreement is a non sequitur based on misunderstandings. Particularists offer objective (though not principle-based) accounts of moral truth and disagreement.
  4.  **Nuance Lost:** The passage oversimplifies particularism ("no principles whatsoever," "nothing can be said in advance," "no two situations alike") and ignores the spectrum of views within it (radical vs. moderate).

  **Your Specific Questions:**

  *   **Do the closing claims (subjectivism, no disagreement) follow?** **No.** They depend on the misrepresentation that rejecting principles entails rejecting moral objectivity and the possibility of mistaken judgment. Particularists maintain objectivity is found *in* the situation, discerned by a competent judge, not *in* principles.
  *   **What would a generalist rightly object to?** Primarily the portrayal of moral reasoning as mechanical subsumption yielding an automatic answer, rendering them "helpless" in hard cases. They would argue principles are essential for rationality, consistency, justification, and guiding deliberation, not bypassing it.

  **My Confidence & Potential Weak Points:**

  *   **High Confidence:** Misrepresentation of Ross, Straw Man of Generalism, Subjectivism/Disagreement non sequitur, Core Holism claim.
  *   **Medium Confidence:** Degree of absolutism in rejecting principles ("nothing whatsoever"), emphasis on uniqueness. Some particularist rhetoric *can* sound more radical than the core arguments imply. Scholars like Sean McKeever & Michael Ridge argue robust ("defeasible") principles *are* compatible with holism. If compelling arguments emerged showing how holism *necessarily* undermines *all* forms of generalizable moral guidance (beyond mere rules of thumb), my assessment of the "no principles" claim might shift.
  *   **Where I Could Be Wrong:** My interpretation relies heavily on Dancy as the paradigmatic radical particularist. Critics might argue I'm underestimating the force of the charge that without principles, justification becomes circular ("I see it because I'm sensitive, I'm sensitive because I see it") or that disagreement resolution becomes opaque. If a sophisticated argument convincingly showed that particularist "sensitivity" *must* collapse into subjectivism upon close analysis, I would need to re-evaluate.
  *   **Reasoning Weak Point:** The trickiest part is balancing the radical implications of holism with the particularist insistence on objectivity and critique. My reasoning leans on their appeal to virtues of judgment as securing objectivity. A critic might argue these virtues are too vague or culturally contingent to do the work required, potentially weakening the objectivity claim. However, the passage's direct inference to subjectivism remains invalid.

  This passage contains a core insight (holism of reasons) but packages it with significant misrepresentations of both particularism (equating it with Ross, implying subjectivism) and generalism (cartoonish subsumption model), and overlooks crucial nuances. Build your further thoughts on more reliable sources (Dancy's *Ethics Without Principles*, McKeever & Ridge's *Principled Ethics*, articles in journals like *Ethics*).
