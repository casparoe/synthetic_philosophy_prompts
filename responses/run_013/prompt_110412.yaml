prompt: |-
  I serve on the restitution working group at my museum, and before I draft our report I would like a consistency audit of my own position. Here is roughly where I have landed.

  (1) A community has a moral right to the material heritage that constitutes it. Where an object left a community by force, or through a transaction the community had no real power to refuse, it should go back, and the present-day community is the bearer of the claim.

  (2) There is no universal-museum exception to (1). The fact that an encyclopedic collection lets millions of strangers encounter an object does not outweigh the source community's claim, and I would not trade that claim away for a promise of long-term loans.

  (3) I am not an essentialist about cultures. What a community is, is continually remade; there is no fact of the matter about which present group is the true continuation of a past one, and the groups that colonial administrators recognised are no more artificial than the ones that preceded them.

  (4) Where an object left through a transaction that was lawful under the law in force at the time, however unequal the parties, the moral claim to return it is weaker than in a case of outright seizure.

  (5) Returned objects should go to communities rather than to national governments, and they should end up on public display somewhere; I take the meanings a good display generates to be as real as any the object carried before.

  (6) I reject inherited guilt, and I do not think moral claims are inherited the way debts are. All the same, I think we should hand back the objects at issue, and I do not think we need anyone's apology to justify doing it.

  One verdict I hold independently of the rest: our holdings from a colonial punitive expedition, acquired under a transaction that was lawful at the time, should be returned without conditions.

  Please audit this package rather than survey the restitution debate. Which of these commitments actually pull against each other, and how badly? Rank the tensions by severity, and for each one say what would have to give and what that would cost. Some of them, I suspect, only look like tensions; say which those are and why. Then tell me which single revision would clear up the most, and whether the rest of the package would still be recognisable as mine.

  I would also like the answer to state how confident it is at each major step, and to single out the point it is least sure of, with a note on what would change its mind.
reasoning: |-
  Okay, let me approach this systematically. The user presents a carefully crafted position on museum restitution with six core principles and one independent verdict, requesting a consistency audit rather than a general debate survey. 

  First, I need to map the internal logic: Principle 1 establishes moral rights based on community identity and involuntary loss, while Principle 3 complicates this by rejecting cultural essentialism. That's likely the core tension - how to reconcile non-essentialism with strong restitution claims. The colonial punitive expedition verdict seems consistent with Principle 4's distinction between lawful transactions and seizures, but I wonder if Principle 6's rejection of inherited guilt creates friction with the act of returning objects acquired under past legal systems.

  Hmm, the display requirement in Principle 5 also deserves scrutiny - does demanding public display potentially conflict with the community's autonomy post-restitution? And Principle 2's dismissal of universal museums feels cohesive with the overall framework, but I should check if it inadvertently supports institutional power when combined with Principle 4's lawful transaction clause.

  Now ranking tensions by severity: The community definition paradox (Principles 1+3) must be top - it strikes at the very foundation of the restitution claim. Secondary tensions include the display autonomy issue (Principle 5 vs self-determination) and the lawful transaction loophole (Principle 4 potentially undermining Principles 1/2). The inherited guilt stance (Principle 6) seems more complementary than conflicting upon closer reading.

  For false tensions: Principle 6's rejection of inherited guilt actually strengthens the position by focusing on present justice rather than historical blame. And the punitive expedition verdict aligns perfectly with Principle 1's "no real power to refuse" standard despite Principle 4's lawful transaction hierarchy.

  The most impactful revision would be refining Principle 3 to acknowledge constructed communities while adding a legitimacy standard for claimants - perhaps focusing on cultural continuity of harm rather than essentialized identity. This wouldn't sacrifice the anti-essentialist core but would prevent Principle 1 from becoming vacuously true.

  Least confident point is whether Principle 4's "weaker claim" framing inadvertently privileges colonial legality; counterevidence would be examples where clearly coercive transactions were technically lawful. The overall position remains recognizable with this adjustment - still demanding restitution but with more nuanced philosophical grounding.
answer: |-
  Here's a consistency audit of your position, ranking tensions by severity, identifying false tensions, and recommending a key revision:

  ### Ranked Tensions (Most Severe First)

  1.  **Principle 1 (Community Moral Right) vs. Principle 3 (Non-Essentialism)** - **Severity: High**
      *   **Conflict:** Principle 1 asserts a strong moral right based on heritage constituting *the* community. Principle 3 fundamentally challenges the idea that any "present-day community" is the singular, objectively true continuation of the past group that created/lost the object. How do you identify *the* bearer of the claim if communities are fluid and all historical demarcations are "artificial"?
      *   **What Would Have to Give:** Principle 3 undermines the certainty required for Principle 1. You'd need to either:
          *   **Modify Principle 1:** Soften "constitutes it" and "the bearer" to acknowledge claimant communities are legitimate *stakeholders* or *successors-in-interest* based on cultural/political continuity *as perceived today*, not as an essential truth. This costs some moral absolutism.
          *   **Modify Principle 3:** Acknowledge that while no continuation is "true" in an essentialist sense, practical, legal, and moral frameworks *require* identifying legitimate claimants based on demonstrable cultural/political continuity and self-identification. This costs some philosophical purity.
      *   **Confidence (8/10):** This is the core tension. Non-essentialism critically challenges the foundation of the claim in Principle 1.

  2.  **Principle 5 (Return to Communities & Display Requirement) vs. Principle 1/3 (Community Definition/Autonomy)** - **Severity: Medium-High**
      *   **Conflict:** Principle 5 dictates *both* the recipient (communities, not states) *and* the outcome (public display). This potentially infringes on the autonomy of the community receiving the object. What if their cultural tradition or current needs dictate private ritual use, restricted access, or even destruction/decay? Your requirement prioritizes *your* value (public meaning-generation) over *their* determination of the object's future.
      *   **What Would Have to Give:** Principle 5's display requirement. To be consistent with respecting the community's right (Principle 1) and their constructed identity/practices (Principle 3), the *community* must decide the object's disposition post-return. This costs your value of public pedagogical access.
      *   **Confidence (7/10):** The display mandate contradicts the autonomy implied by the moral right of return.

  3.  **Principle 4 (Weaker Claim for Lawful Transactions) vs. Principle 1/2 (Strength of Claim / No Universal Exception)** - **Severity: Medium**
      *   **Conflict:** Principle 4 creates a potential loophole for colonial-era acquisitions deemed "lawful" despite extreme inequality. This weak claim category could be exploited to justify retaining objects in encyclopedic museums (contrary to Principle 2), especially if "lawful" is interpreted formalistically. It risks privileging colonial legality over the "no real power to refuse" standard in Principle 1.
      *   **What Would Have to Give:** Either:
          *   **Refine Principle 4:** Explicitly state that "lawful" is necessary but *not sufficient*, and that extreme power imbalance, coercion, or lack of informed consent renders the transaction functionally equivalent to force/refusal under Principle 1, negating the "weaker claim." Or,
          *   **Reject Principle 4:** Acknowledge that "lawfulness" under profoundly unjust systems carries minimal moral weight. This costs nuance but strengthens consistency with Principles 1 & 2.
      *   **Confidence (6/10):** The conflict is contextual. Your colonial punitive expedition verdict shows you *do* see beyond formal lawfulness in clear cases. The tension arises if "lawful" is applied too broadly.

  ### False Tensions (Apparent but Reconcilable)

  1.  **Principle 6 (No Inherited Guilt/Apology Needed) vs. Principle 1 (Moral Obligation to Return):**
      *   **Why False:** These are perfectly compatible. Principle 6 addresses the *basis* for the obligation (not inherited guilt/debt, but present-day moral right and justice) and the *process* (no need for performative apology as condition). It clarifies *why* you return (rectifying a past wrong affecting present claimants) without requiring modern individuals to feel personal guilt. Returning the object itself *is* the primary moral act. No conflict.
      *   **Confidence (9/10)**

  2.  **Colonial Punitive Expedition Verdict vs. Principle 4 (Weaker Claim for Lawful Transactions):**
      *   **Why False:** Your verdict explicitly addresses this. You argue that a transaction occurring *during* a punitive expedition, even if technically "lawful" under colonial authority, inherently falls under Principle 1's "force" or "no real power to refuse." The coercive context overwhelms any formal legality. Principle 4's "weaker claim" applies to transactions lacking *this specific level* of overt state violence/coercion, even if unequal. The verdict is a logical application of Principle 1, overriding the "lawful" aspect due to context.
      *   **Confidence (8/10)**

  ### The Single Most Impactful Revision

  *   **Revise Principle 3** to explicitly address claimant legitimacy within a non-essentialist framework.
  *   **Suggested Revision:** "I am not an essentialist about cultures. What a community *is* is continually remade; there is no single objective fact of the matter about which present group is the one true continuation of a past one, and the groups that colonial administrators recognised are no more artificial than the ones that preceded them. *However, for the purposes of restitution claims, legitimate present-day claimants are those communities who demonstrably maintain a significant cultural, spiritual, or historical connection to the object and the context of its creation or loss, and who are recognized as such through self-identification and, where appropriate, broader social or political acknowledgment. The validity of a claim rests on this contemporary connection and the circumstances of loss, not on an unbroken essential identity.*"
  *   **Why it Clears Up the Most:** It directly tackles the **High Severity** tension between Principles 1 and 3. It provides a practical, non-essentialist basis for identifying claimants ("significant connection," "self-identification," "context of loss") that supports Principle 1's moral right without relying on mythical continuity. It also indirectly strengthens your colonial punitive expedition verdict by focusing on the *context of loss*.
  *   **Impact on Recognizability:** The core commitment remains perfectly recognizable: strong moral claims based on involuntary loss, no universal museum exception, non-essentialism, practical return to communities. The revision clarifies the *operationalization* of community claims within your non-essentialist view, making the overall position more robust and internally consistent. It doesn't weaken the core moral stance; it grounds it philosophically.

  ### Point of Least Confidence & What Could Change It

  *   **Point:** The potential conflict between **Principle 4 (Weaker Claim for Lawful Transactions)** and **Principle 1/2** if "lawful" is interpreted too formally, especially concerning transactions under extreme colonial duress that weren't overtly violent seizures (e.g., "sales" during famine, "gifts" demanded by administrators, transactions under threat of sanction).
  *   **Confidence Level (5/10):** I'm less sure how strictly you intend the "lawful transaction" category or how narrowly you define "no real power to refuse."
  *   **What Would Change My Mind:** Evidence from your other writings or reasoning showing you interpret "lawful transaction" in Principle 4 very narrowly, essentially limiting it to transactions where genuine, minimally constrained consent was possible even within an unequal system (a very high bar for the colonial context), or that you inherently view most colonial transactions as meeting the "no real power to refuse" standard regardless of formal legality. Your punitive expedition verdict suggests the latter, but clarity on the scope of Principle 4 is key. If you clarified that Principle 4 applies *only* to transactions lacking *both* overt force *and* the overwhelming systemic coercion inherent in colonialism, the tension with Principle 1/2 would largely vanish.
