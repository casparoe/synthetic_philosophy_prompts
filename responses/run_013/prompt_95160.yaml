  For the concede-up-front section: They should acknowledge regional diversity upfront (e.g., Natufian vs. Neolithic Anatolia trajectories) and avoid overgeneralizing. This disarms the most predictable critique. The "unasked question" I'll suggest probes whether hierarchy was truly inevitable or just correlated with surplus storage. The verdict should highlight the biggest risk: survivorship bias in osteological data undermining their health decline narrative.

