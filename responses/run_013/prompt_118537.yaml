  We are given a debate between a philosopher and a statistician on the problem of old evidence in Bayesian confirmation theory. The case: a laboratory recorded a result D ten years ago, and it has been taken for granted. Now a hypothesis H is proposed that entails D. The question is how D confirms H, if at all, in light of it being old evidence.

  We have five rounds. I will adjudicate each move and then give an overall assessment.

  **First Round (Philosopher):**
  The philosopher argues that if D is old evidence with credence 1, then P(D)=1 and P(D|H)=1 (since H entails D). Therefore, by the standard definition of confirmation (which requires that P(H|D) > P(H)), we have P(H|D) = P(H) because P(D|H)/P(D) = 1. Hence, D does not confirm H. But intuitively, D should confirm H. This is the problem of old evidence.

  Rating: **Clearly right** (for pointing out the problem as traditionally understood in Bayesian epistemology). The problem is well-known and the reasoning is correct under the assumption that D has probability 1.

  **Second Round (Statistician):**
  The statistician responds that the idealization of certainty (P(D)=1) is the problem. In practice, scientists don't have absolute certainty. If P(D) is less than 1 (say 0.97) and H entails D (so P(D|H)=1), then P(D|H) > P(D) and hence D confirms H. The problem evaporates if we drop the idealization.

  Rating: **Defensible**. The statistician is correct that in actual scientific practice, we rarely have absolute certainty. By relaxing the certainty assumption, we can get confirmation. However, this move does not fully address the philosophical problem because even if we set P(D) to less than 1, the question remains: why should the degree of confirmation depend on an agent's prior degree of belief in D (which might be arbitrary) rather than on the objective evidential relation? Moreover, the problem of old evidence is often presented as a challenge to the Bayesian framework even when we model agents with actual degrees of belief.

  **Third Round (Philosopher):**
  The philosopher counters that the statistician's move does not solve the problem but relocates it. The boost that H gets from D is inversely proportional to P(D): the lower P(D) (i.e., the less confident the lab was in D), the more confirmation. But the lab's confidence in D (say, 0.97 vs 0.9999) is a historical fact about their record-keeping and not about the relation between H and D. Thus, the degree of confirmation becomes arbitrarily adjustable by an irrelevant prior.

  Rating: **Clearly right**. The philosopher correctly identifies a weakness in the statistician's response. The Bayesian measure of confirmation (e.g., the difference P(H|D) - P(H) or the ratio P(H|D)/P(H)) does depend on the prior P(D). In the case of old evidence, the prior P(D) is set by the agent's past assessment, which may be arbitrary and not related to the hypothesis H. Therefore, the same evidence D can provide different amounts of confirmation to H depending on how certain we were about D in the past. This seems to make the confirmation measure subjective in an undesirable way.

  **Fourth Round (Statistician):**
  The statistician shifts the focus to the likelihood ratio (Bayes factor): P(D|H)/P(D|¬H). They note that since H entails D, P(D|H)=1. The key then is P(D|¬H), which is the probability of D under the alternative hypotheses. This, they argue, is a substantive scientific question and does not depend on the lab's prior confidence in D.

  Rating: **Defensible and partially right**. The statistician is right that the Bayes factor does not depend on the prior probability of D (P(D)) but on the likelihoods. Moreover, the Bayes factor is often considered a good measure of the strength of evidence. However, note that the Bayes factor is only part of the story. The posterior odds of H versus ¬H are the prior odds times the Bayes factor. The prior odds are still needed to get the posterior. But the statistician's point is that the strength of evidence (as captured by the Bayes factor) is independent of the prior P(D). This is true. However, the problem of old evidence is often framed in terms of the change in probability of H. The Bayes factor does not directly tell us the change in probability of H unless we also consider the prior probability of H and the alternatives. Moreover, if we are to use the Bayes factor, we still need to compute P(D|¬H). The problem is that if D is old evidence, then we have known D for a long time. How do we assess P(D|¬H) now? We must condition on all our current background knowledge, which includes D. Then P(D|¬H) would be 1 if we condition on D? This is the same problem again. However, the statistician might be thinking of a counterfactual scenario: what would the probability of D be if we did not know D? This is the standard Bayesian move to handle old evidence (known as the counterfactual approach).

  **Fifth Round (Philosopher and Statistician):**
  The philosopher introduces a distinction between the record (R: the notebook contains a certain entry) and the world (D: the measured quantity had that value). The idea is that what was certain all along was R, not D. So we can have P(R)=1, but P(D) might be less than 1. Then H entails D, but not R? Actually, H is about the world and entails D, but the evidence we have is R. So we can say that R confirms H because H entails D and R is evidence for D.

  The statistician replies that R is itself old evidence (we have known R for ten years) so we have P(R)=1. Then the same problem arises for R: if we have P(R)=1, then P(R|H) = P(R) = 1? But note that H does not entail R. H entails D, but R is a record of D. So the connection between R and D is not logical but contingent. Therefore, we have to consider the likelihoods P(R|H) and P(R|¬H). But if we have P(R)=1, then we run into the same problem: P(H|R) = P(H). So the problem recurs.

  The statistician also notes that if the world-directed proposition D is uncertain, then the notebook R does not entail D. Therefore, we must ask about the reliability of the notebook, which is the prior we were trying to discard.

  Rating of the philosopher's move: **Helpful but incomplete**. The distinction is a good one and is a standard move in the literature (sometimes called the problem of the "evidential relevance of logical truths" or the "problem of known evidence"). By separating the record (R) from the event (D), we avoid assigning probability 1 to D. However, as the statistician points out, R is now the old evidence and we have P(R)=1. So we are stuck with the same problem for R. The philosopher must then say that we are not certain about R? But that seems to lead to an infinite regress.

  Rating of the statistician's reply: **Clearly right**. The statistician correctly points out that if we take R as the evidence, then it is old and we have P(R)=1. Then we face the same problem: how can R confirm H? Moreover, if we are to use R as evidence for D and then D for H, we must have a chain. But the chain breaks because we have P(R)=1 and then we cannot get confirmation from R to D? Actually, we can: if we have P(R)=1, then we cannot update on R because it's already known. But we can consider the counterfactual: what would our beliefs be if we didn't know R? Then we could update on R and get confirmation for D, and then for H. However, the philosopher did not make this counterfactual move.

  **Assessment of the Fifth Round Distinction:**
  The distinction between the record (R) and the event (D) is helpful because it allows us to see that the evidence we actually have (the record) is distinct from the event in the world. This is a good move. However, it does not by itself solve the problem because the record is old evidence. Therefore, the problem recurs for the record. The key to solving the problem is to consider how we would update if we did not have the evidence. This counterfactual approach is the standard solution in Bayesian epistemology. We are to imagine that we do not know D (or R) and then compute the probability of H conditional on D (or R). This counterfactual update gives us the confirmation that D (or R) provides to H.

  **What both parties are missing:**
  Both parties are missing the counterfactual approach to old evidence. The standard solution in the literature (proposed by Garber, Jeffrey, and others) is to consider what our degree of belief in H would be if we did not know D. Then we can compute the probability of H conditional on D, and we see that it would be higher. This counterfactual update does not require that we actually change our current degrees of belief (which are conditioned on D) but it shows that D does confirm H in the sense that if we were to learn D (and we didn't already know it), then H would be confirmed.

  In the fifth round, the philosopher's distinction could be combined with the counterfactual approach: we can imagine a situation where we do not know the record R. Then we can update on R and see that it confirms D, and then D confirms H (via H entailing D). Alternatively, we can directly compute the counterfactual likelihood of H given R.

  **Overall Assessment:**
  Now, we rate each round and then decide who has the better of it.

  Round 1: Philosopher is clearly right (exposes the problem).
  Round 2: Statistician is defensible (but incomplete).
  Round 3: Philosopher is clearly right (shows the relocation of the problem).
  Round 4: Statistician is defensible and partially right (the Bayes factor is important, but they don't solve the problem of old evidence).
  Round 5: The philosopher's distinction is helpful but incomplete. The statistician's reply is clearly right (the problem recurs). However, both miss the counterfactual move.

  **Who has the better of it overall?**
  The philosopher has the better of the argument overall because they successfully show that the statistician's initial responses (rounds 2 and 4) do not fully resolve the problem. The statistician's moves are pragmatic and might work in practice, but they do not address the philosophical puzzle. The philosopher, however, also does not provide a solution but highlights the depth of the problem. The fifth round shows that the problem is not easily dissolved by a simple distinction.

  However, note that the counterfactual approach (which was not raised by either) is the standard solution. So both parties are missing a key move. But within the moves they made, the philosopher is more consistently correct in pointing out the flaws.

  **Final Ratings (summarized):**
  1. First Round (Philosopher): Clearly right.
  2. Second Round (Statistician): Defensible.
  3. Third Round (Philosopher): Clearly right.
  4. Fourth Round (Statistician): Defensible and partially right.
  5. Fifth Round:
     - Philosopher's proposal: Helpful but incomplete (defensible, but not a full solution).
     - Statistician's reply: Clearly right (shows the proposal does not solve the problem).

  **Closing Statement:**
  The philosopher has the better of the argument because they have successfully shown that the statistician's attempts to dissolve the problem (by relaxing certainty and by appealing to the Bayes factor) do not fully resolve the underlying issue of how old evidence can confirm a new hypothesis. The problem of old evidence remains a challenge for Bayesian confirmation theory, and the counterfactual approach is needed to address it. The fifth-round distinction does not help because it leads to a regress, and the key insight both are missing is the counterfactual evaluation of evidence. However, the statistician's points about the Bayes factor and the non-absolute nature of scientific certainty are important practical considerations.
answer: |-
  ### Adjudication of the Exchange

  #### **First Round (Philosopher)**
  - **Rating**: Clearly right.  
  - **Justification**: The philosopher correctly identifies the core problem of old evidence in Bayesian confirmation: if \(D\) is already known with certainty (\(P(D) = 1\)), and \(H\) entails \(D\) (so \(P(D|H) = 1\)), then \(P(H|D) = P(H)\). Thus, \(D\) cannot raise the probability of \(H\), violating the intuition that \(D\) *should* confirm \(H\). This is a well-established paradox in Bayesian epistemology, and the reasoning is logically sound under standard probability axioms.

  #### **Second Round (Statistician)**
  - **Rating**: Defensible but incomplete.  
  - **Justification**: The statistician is right to challenge the idealization of certainty. In practice, scientists rarely hold absolute confidence (\(P(D) = 1\)) in empirical data; a value like \(P(D) = 0.97\) is more realistic. If \(H\) entails \(D\), then \(P(D|H) = 1\), and \(P(D|H) > P(D)\) implies that \(D\) confirms \(H\) (e.g., via the likelihood ratio). This dissolves the *technical* problem of probability-raising. However, it does not address the deeper issue of how the *degree* of confirmation should be objectively grounded, leaving it vulnerable to the philosopher’s next move.

  #### **Third Round (Philosopher)**
  - **Rating**: Clearly right.  
  - **Justification**: The philosopher correctly exposes a flaw in the statistician’s pragmatism. The confirmation boost \(P(H|D) - P(H)\) depends inversely on \(P(D)\): a lower prior \(P(D)\) (e.g., 0.97) yields a larger boost, while a higher prior (e.g., 0.9999) yields a smaller one. Yet \(P(D)\) reflects historical confidence in the lab’s bookkeeping, not the evidential relationship between \(H\) and \(D\). Allowing an arbitrary prior to dictate the weight of evidence undermines objectivity, as confirmation becomes manipulable by irrelevant factors.

  #### **Fourth Round (Statistician)**
  - **Rating**: Defensible and partially right.  
  - **Justification**: Shifting focus to the Bayes factor (likelihood ratio \(P(D|H)/P(D|\neg H)\)) is insightful. Since \(H\) entails \(D\), \(P(D|H) = 1\), and confirmation hinges on \(P(D|\neg H)\)—how likely \(D\) is under alternative hypotheses. This *does* decouple confirmation from the prior \(P(D)\) and anchors it in scientific substance (e.g., if \(\neg H\) makes \(D\) unlikely, \(D\) strongly confirms \(H\)). The part that survives critique is that the Bayes factor avoids direct dependence on \(P(D)\). However, this move neglects that \(D\) is *old* evidence: background knowledge already includes \(D\), making \(P(D|\neg H)\) tricky to assess without circularity or counterfactual reasoning.

  #### **Fifth Round (Philosopher’s Distinction and Statistician’s Reply)**
  - **Philosopher’s Move (Record vs. World)**:  
    - **Rating**: Helpful but ultimately neutral.  
    - **Justification**: Distinguishing the *record* \(R\) (notebook entry) from the *event* \(D\) (measured value) is astute. It separates psychological certainty (\(P(R) = 1\) for the record) from empirical uncertainty (\(P(D) < 1\) for the event). \(R\) can confirm \(H\) because \(H\) entails \(D\), and \(R\) supports \(D\) (e.g., via reliability of the notebook). This reframes the problem and avoids assigning \(P(D) = 1\). However, it does not resolve the core issue, as \(R\) itself is old evidence.  
  - **Statistician’s Reply**:  
    - **Rating**: Clearly right.  
    - **Justification**: The statistician correctly notes that \(R\) is now the old evidence with \(P(R) = 1\), so the original problem recurs: if \(H\) entails \(D\) but not \(R\) (since the notebook could be erroneous), then \(P(R|H)\) need not be 1. We must now assess \(P(R|H)\) and \(P(R|\neg H)\), reintroducing the reliability of the notebook as a prior. This prior (e.g., lab’s trustworthiness) is just as arbitrary as the original \(P(D)\), nullifying the distinction’s utility. The move also fails because \(R\) does not entail \(D\), forcing us back to subjective priors about the record’s accuracy.  
  - **Overall Impact of Distinction**: The distinction **hurts** the philosopher’s position. It adds complexity but does not solve the problem, as the statistician shows it merely shifts the uncertainty to a new prior (reliability of the record), reigniting the same objections from Round 3.

  #### **What Both Parties Miss**
  - **Counterfactual Reasoning**: Neither addresses the standard Bayesian solution to old evidence: assess confirmation counterfactually by asking how \(H\)’s probability *would* change if \(D\) (or \(R\)) were *new* evidence. This involves temporarily removing \(D\) (or \(R\)) from background knowledge, computing \(P(H|D)\) as if \(D\) were unknown, then comparing it to \(P(H)\). This preserves confirmation without requiring \(P(D) < 1\) and avoids reliance on arbitrary priors.  
  - **Role of Background Knowledge**: Both neglect that Bayesian updating must condition on *all* evidence. \(D\)’s status as "old" means it is baked into the prior probabilities; confirmation requires imagining a state of ignorance about \(D\). The debate conflates the *historical* act of learning with the *logical* relation between \(H\) and \(D\).

  #### **Overall Verdict**
  - **Who has the better of it?** The **philosopher** wins the exchange narrowly.  
  - **Reasoning**:  
    - The philosopher’s moves (Rounds 1, 3, and 5) consistently expose flaws in Bayesianism: Round 1 frames the paradox correctly; Round 3 shows that relaxing certainty fails to ground confirmation objectively; Round 5’s distinction, while flawed, highlights the ambiguity in "evidence."  
    - The statistician’s responses (Rounds 2, 4, and 5) are pragmatic and salvage Bayesianism in practice but do not resolve the philosophical problem. Round 2’s retreat from certainty is ad hoc; Round 4’s Bayes factor only partially helps (it ignores old evidence’s integration into priors); Round 5’s rebuttal effectively defeats the record/event distinction but offers no new solution.  
    - Ultimately, the philosopher forces the statistician into concessions (e.g., confirmation depends on arbitrary priors), while the statistician’s solutions remain vulnerable to the core objection that old evidence *should* confirm but appears inert in the Bayesian framework. The counterfactual approach, unmentioned by either, would have strengthened the statistician’s case but was not invoked.
