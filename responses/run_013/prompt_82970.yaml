prompt: |-
  I am a distributed-systems engineer — I work on storage and replication, and I think natively in terms of primaries and replicas, append-only logs, log compaction, tombstones, quorums and consensus, MVCC snapshots, content-addressed hashes, force-pushes and reflogs — and I have no training in history or in philosophy. Last night a historian friend and I argued for three hours about the claim that history is written by the victors, and I came away with the uncomfortable suspicion that I had been silently translating everything she said into my own vocabulary and mistaking the translation for the thing itself. I would like you to do that translation deliberately and then tell me what did not survive it.

  Take the cluster of positions people actually hold here: that the winners' account becomes the canonical record and everything else decays; that what survives is determined less by who won than by who kept the archives, the registries, the paperwork, and the receipts; that evidence nonetheless constrains what can be said, so there is a fact of the matter and some accounts are simply wrong; and that every history is written for the needs of the present and the past itself is unrecoverable. Restate each of these as faithfully as you can in the vocabulary I actually use, drawing on whatever from my world genuinely fits — replication and failover, which replica is writable, compaction and garbage collection, tombstones for records deleted rather than never written, snapshots and as-of queries, history rewriting in version control versus content hashing that pins what a commit contained, forks that preserve a losing branch indefinitely, schema migration that makes older records unreadable by later readers, Byzantine faults, provenance and lineage tracking. Assume I am fully fluent in that vocabulary and need none of it explained; explain the historical side to me as though I know nothing.

  Then give me the residue report, which is the part I actually care about. For each position: what comes through intact, what comes through only in a distorted or weakened form, and what has no counterpart in my vocabulary at all. I am specifically interested in whether my vocabulary can express the difference between a record that was never written and one that was written and then suppressed, whether it can express a record being true as opposed to merely authoritative, and whether power and agency have any analogue in it beyond topology and write permissions. Be honest about where you had to smuggle systems assumptions in and call the result a translation. Do not name historians or cite works — I could not check them and I do not want the pedigree, I want the structure of the positions.

  Please answer as a single JSON object with this shape:

  {
    "positions": [
      {
        "label": "short name of the position, in the historians' own terms",
        "translation": "the restatement in systems vocabulary, 150-250 words, in prose",
        "mappings": [
          {"history_term": "...", "systems_term": "...", "fidelity": "clean | strained | forced", "note": "one sentence on what the mapping preserves or loses"}
        ],
        "survives": "what of the position comes through intact",
        "residue": "what is lost, garbled, or silently added"
      }
    ],
    "cross_cutting_residue": [
      {"idea_lost": "...", "why_it_fails_to_translate": "...", "verdict": "gap in my vocabulary | the original claim was less determinate than it sounded | both"}
    ],
    "smuggling_report": "where the translation quietly imported my framework's assumptions and presented them as the historian's meaning",
    "my_instinct": "a verdict on whether my working picture — one writable primary, everyone else's log diverging, whichever replica survives is what we call the record — is basically right or badly flattening, plus the single strongest thing it misses",
    "bottom_line": "at most three sentences"
  }

  Fill the arrays with as many entries as the material honestly requires, and write real prose inside the fields rather than fragments.
