    2. What survives is determined less by who won than by who kept the archives, the registries, the paperwork, and the receipts.
    3. Evidence constrains what can be said, so there is a fact of the matter and some accounts are simply wrong.
    4. Every history is written for the needs of the present and the past itself is unrecoverable.

   We will create a JSON object with the structure provided.

   Steps for each position:
    - label: a short name for the position in historian terms.
    - translation: restate in systems vocabulary (150-250 words) using the terms provided.
    - mappings: an array of mappings between history terms and systems terms, with fidelity (clean, strained, forced) and a note.
    - survives: what comes through intact in the translation.
    - residue: what is lost, garbled, or silently added.

   Then, we have cross_cutting_residue for ideas that are lost across the board, a smuggling_report, and a bottom_line.

   Important: The user is interested in whether the systems vocabulary can express:
     - The difference between a record that was never written and one that written and then suppressed.
     - A record being true vs. authoritative.
     - Power and agency beyond topology and write permissions.

   Let's begin.
