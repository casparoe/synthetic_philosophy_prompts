answer: |-
  ## Meridian Group Employee Handbook: Section 17.3 - Utterance Felicity Compliance

  **Gravest Violation:** Knowingly executing a performative utterance with insincere intention (Abuse Felicity Failure), particularly regarding commitments, directives, or status changes (e.g., false promise, fraudulent authorization).

  **Policy 17.3.1: Valid Execution of Performative Utterances**
  All utterances intended to effect changes in duties, status, permissions, or commitments ("performatives") must satisfy the Framework's felicity conditions to be valid. Non-compliant utterances are void and constitute a reportable incident (Form MG-HR-417).

  **Policy 17.3.2: Felicity Conditions Defined**
  For a performative utterance to be valid and binding:
      a)  **Procedure:** The conventional procedure associated with the utterance must exist and be correctly followed (e.g., only authorized personnel may state "I approve this budget").
      b)  **Participants & Circumstances:** Participants must be appropriate and circumstances correct (e.g., stating "You're fired" requires managerial authority over the employee and adherence to termination protocols).
      c)  **Execution:** The procedure must be executed completely and correctly.
      d)  **Uptake:** The intended recipient(s) must understand and accept the utterance as the intended action (e.g., stating "I'll take that task" requires the assigner's acknowledgment for uptake).
      e)  **Sincerity:** Participants must possess the requisite thoughts, feelings, or intentions (e.g., stating "I promise to finish by Friday" requires genuine intent to complete the task).

  **Policy 17.3.3: Misfire vs. Abuse**
      a)  **Misfire (Void Act):** Failure of conditions (a), (b), (c), or (d) renders the utterance entirely void (e.g., an unauthorized employee stating "I authorize this purchase").
      b)  **Abuse (Valid but Insincere Act):** Failure of condition (e) (Sincerity) results in a valid but improperly executed act, constituting misconduct (e.g., stating "I endorse this candidate" while secretly planning to undermine them).

  **Policy 17.3.4: Uptake Requirement**
  Uptake (condition d) is a fundamental validity condition, not merely courtesy. An utterance lacking uptake is a misfire (e.g., emailing "I resign, effective immediately" to an invalid address or defunct manager).

  **Policy 17.3.5: Unhappy Utterances**
  An utterance failing one or more felicity conditions is "unhappy" (invalid or defective). Its unhappiness is distinct from truth/falsehood. "I name this conference room 'The Nexus'" is unhappy if uttered by an unauthorized person, regardless of the room's actual name.

  **Policy 17.3.6: Scope of HR Jurisdiction (Illocutionary Focus)**
  HR governs the **illocutionary act** (the action *performed in* speaking: promising, ordering, resigning, authorizing). HR does not govern:
      *   **Locutionary act:** The physical act of saying words or their literal meaning (e.g., grammatical errors, mispronunciation unless impacting uptake).
      *   **Perlocutionary act:** The effects *caused by* speaking (e.g., causing offense, persuasion, motivation), except where linked directly to an abuse (insincere illocution).

  **Policy 17.3.7: Non-Serious Utterances (Parasitic Speech)**
  Utterances clearly framed within fiction, jest, rehearsal, quotation, or hypothetical discussion ("I would quit if...") are generally exempt, provided the non-serious context is mutually understood. Ambiguity must be clarified immediately to prevent misfires. Deliberate ambiguity to avoid commitment may constitute abuse.

  **Policy 17.3.8: Use of "Hereby"**
  While "hereby" explicitly signals a performative (e.g., "I hereby declare this meeting open"), its absence does not invalidate a performative if the context and conventional procedure are clear (e.g., "Meeting adjourned" suffices). "Hereby" is recommended for high-stakes formal declarations to minimize misfire risk.

  ---

  **FAQ: Utterance Felicity Compliance (Section 17.3)**

  **Q1: If I sarcastically say "Yeah, I *promise* I'll get right on that," is that an abuse?**
  A1: Context is critical. If the sarcastic tone and lack of intent are clear to all participants (uptake of non-seriousness), it is likely parasitic speech and exempt. If ambiguity exists and a listener could reasonably interpret it as a sincere commitment, it constitutes a misfire (lack of sincerity) and must be clarified immediately. Deliberate sarcasm intended to mislead is abuse.

  **Q2: My manager said "Consider it done" regarding my request, but later denied it. What do I report?**
  A2: Report the incident citing potential Abuse (Policy 17.3.3b). "Consider it done" functions as a commissive (like a promise) implying acceptance and commitment. If the manager lacked sincere intention to fulfill the request at the time of utterance, this is an abuse.

  **Q3: I accidentally said "You're approved" to the wrong vendor during a call. Is this reportable?**
  A3: Yes. Report as a potential Misfire (Policy 17.3.3a & 17.3.2a/b). The procedure (approving a vendor) was executed incorrectly (wrong participant/vendor). Immediate retraction and correction to the correct parties are required.

  **Q4: How does this apply to written communication?**
  A4: All policies apply equally to written communication. Uptake requires the message to be received and understood by the correct party. Sincerity is assessed based on the author's state of mind at the time of writing.

  **Q5: I felt pressured when my lead said "We really need this by EOD." Is that covered?**
  A5: This utterance is primarily directive (illocutionary act of urging/requesting). If the procedure (lead making a request) was correct and they sincerely believed the deadline necessary, the illocution is likely valid. Your feeling of pressure is a *perlocutionary effect* (Policy 17.3.6), outside core felicity jurisdiction, though potentially addressable under other policies (e.g., stress). An insincere request made to harass would be abuse.
