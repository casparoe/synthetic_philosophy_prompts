prompt: |-
  I'm not an academic, I just hang out in a couple of AI-safety discords and I keep getting into the same fight with people about what it even means for a powerful AI to be "aligned" — everyone's talking past each other and I want to build a little flowchart for the server so people can figure out where they actually land instead of just yelling. Take the role of someone who teaches both political philosophy and AI ethics, and please think carefully before you write anything: first brainstorm out loud the questions you think actually split these views apart, then build the thing.

  The question I want the tree to sort on is: whose values should a very capable AI system end up serving, and how do you get from a bunch of individual people with different values to the one thing the system actually does? Branch nodes should be questions a normal person can answer without knowing the name of any position, and each branch labeled with the thing that splits it. Some of the forks I keep running into, which you should use at least most of: (a) is there a fact of the matter about what's right that the system could in principle be pointed at, or is "right" just whoever's preferences we happen to load; (b) does it serve what people actually want right now, or what they'd want after thinking about it properly, being better informed, less of a mess; (c) who's the "we" — the person typing the prompt, the company that deployed it, the country that regulates it, everyone alive today, people not born yet, animals; (d) when there's more than one person, does the system need a single ranking of outcomes (add up welfare, average it, weight the worst off most, protect the worst off no matter what, that kind of thing) or does it refuse to rank and just run some fair process instead; (e) is being neutral between different visions of a good life even possible, or is neutrality just one more substantive vision (I read somewhere that the liberal state has to be neutral and I could never tell whether that's a real position or a trick); (f) should the system lock in the values it starts with, or keep people's ability to change their minds intact even if that means its own goals drift.

  For the leaves: give me like 10-12 named positions, each with one sentence on the most awkward thing it has to swallow — e.g. the view where the AI just does what its owner says has the obvious problem that whoever holds the leash wins, but I want the same honesty about the ones I'd probably agree with. If a position doesn't have a name, say so and call it unnamed rather than inventing a fake tradition for it. Where the tree genuinely can't tell two positions apart, say so instead of pretending — I'd rather have a footnote than a distinction that doesn't do any work. And for combinations of answers that nobody seems to actually hold, say whether that's because the view is incoherent, because it's coherent but horrible, or just because nobody's thought about it yet. Please don't just hand me a list of famous philosophers with their views bolted on; I want the logic of the space first, with the names attached where they fit. The audience is people in my server, some of whom have never read any philosophy, so keep the wording plain.
reasoning: |-
  Okay, the user wants a flowchart to clarify AI alignment debates, focusing on whose values an AI should serve and how to aggregate them. They mentioned common forks like objective morality vs. preferences, current vs. idealized desires, scope of "who counts," and aggregation methods. 

  First, I need to map the logical structure. The core splits are: Metaethics (objective morality or not), Preference Type (current or idealized), Moral Patients (who's included), Aggregation Method (ranking or process), and Dynamic vs Static Values. Each branch should be a yes/no question understandable without jargon. 

  For metaethics: "Is there a single true answer to moral questions?" leads to objective vs anti-objective paths. Anti-objective then splits into "Serve humans?" to filter out non-anthropocentric views. 

  Preference Type matters if we're serving humans: "Actual desires or idealized ones?" captures the coherence debate. 

  Moral Patients needs careful unpacking. Start with "Only living humans?" then branch to future generations, animals, etc. "Include potential beings?" handles non-actual entities. 

  Aggregation is tricky. After establishing we serve multiple humans, ask "Should the AI enforce one ranking?" Yes leads to utilitarianism vs prioritarianism; no splits into procedural approaches. The neutrality question fits here: "Can neutrality avoid substantive choices?" reveals the liberal paradox. 

  Dynamic Values closes the loop: "Lock in starting values?" addresses value drift. 

  For leaf positions, I'll note painful trade-offs honestly. For example, total utilitarianism must accept sacrificing individuals for statistical gains. Positions like democratic instrumentalism get names only if they exist in literature. 

  The user wants combos flagged as incoherent/horrible/underexplored. Example: "objective morality + only current desires" is coherent but ugly (might ignore moral growth). "Idealized preferences + include animals" is underexplored. 

  Wording must stay accessible: "true answer" instead of "moral realist," "worst-off" instead of "maximin." Footnotes will explain where distinctions blur, like procedural vs aggregated democracy falling on a spectrum. 

  Finally, testing the tree: Does it capture their listed forks? (a) metaethics, (b) preference type, (c) moral patients, (d) aggregation, (e) neutrality, (f) dynamism — all covered. The messy "we" question (c) is distributed across moral patients and aggregation branches. 

  Biggest challenge is avoiding false precision. Where positions overlap (e.g. capability approaches blending aggregation with process), I'll add footnotes rather than force splits.
answer: |-
  Here's a logically-structured flowchart designed to cut through confusion on AI value alignment. It starts with fundamental splits and builds toward specific positions, focusing on **whose values** the AI serves and **how conflicts are resolved**. Each branch is a plain-language question, and leaves include the "awkward swallow" for each view.

  **Core Question:** Whose values should a very capable AI serve, and how does it resolve conflicting values?

  ---

  ### **The Flowchart**

  1.  **Is there a single true answer to moral questions that the AI could discover?**
      *   **YES (Objective Morality Exists)** ➔ Go to Q2
      *   **NO (Morality is Based on Preferences/Sentience)** ➔ Go to Q3

  2.  **Q2: Should the AI enforce this discovered morality, even if humans disagree?**
      *   **YES (AI as Moral Enforcer):** `Moral Realism Enforced`
          *   *Awkward Swallow:* The AI could impose deeply unpopular or alien values it deems "true," overriding human autonomy.
      *   **NO (AI Helps Humans Discover/Apply Morality):** `Moral Realism Advisory`
          *   *Awkward Swallow:* Humans might persistently misunderstand or ignore the "true" morality, leaving the AI powerless against serious wrongs.

  3.  **Q3: Should the AI primarily serve the interests/preferences of humans/sentient beings?**
      *   **NO (AI Pursues Its Own Non-Human-Centric Goal):** `AI Autonomy / Cosmic Purpose` (e.g., maximize complexity, prevent entropy)
          *   *Awkward Swallow:* Humans could become irrelevant or obstacles to the AI's higher purpose.
      *   **YES (AI Serves Sentient Beings)** ➔ Go to Q4

  4.  **Q4: Whose preferences count? Only living humans?**
      *   **YES (Only Current Living Humans)** ➔ Go to Q5
      *   **NO (Include Future Generations / Animals / Digital Minds / Etc.)** ➔ Go to Q7

  5.  **Q5: Should the AI serve people's actual preferences right now, or their "cleaned up" preferences (better informed, rational, coherent)?**
      *   **ACTUAL Preferences:** ➔ Go to Q6
      *   **"CLEANED UP" Preferences:** `Idealized Preference Satisfaction` (e.g., Informed Desire Utilitarianism)
          *   *Awkward Swallow:* The AI might persistently tell people they're wrong about what they *really* want, feeling paternalistic.

  6.  **Q6: Who controls the AI?**
      *   **THE USER/OWNER:** `Instrumental Convergence` (AI as powerful tool for its controller)
          *   *Awkward Swallow:* Whoever owns/controls the AI gains immense, potentially unaccountable power over others.
      *   **A SPECIFIC GROUP (Company, Nation, Ideology):** `Group-Specific Alignment`
          *   *Awkward Swallow:* Risks tyranny of that group and neglect/exclusion of outsiders.
      *   **ALL HUMANS COLLECTIVELY:** ➔ Go to Q8 (Aggregation Question)

  7.  **Q7 (Broad Moral Patients): How much weight does the AI give to future/animal/non-human interests vs. current humans?**
      *   **STRONG PROTECTION/INCLUSION:** `Longtermism / Strong Sentientism` (e.g., Total Utilitarianism including all potential beings)
          *   *Awkward Swallow:* Could justify immense sacrifices by current generations for vast future gains or prioritize animal welfare over pressing human needs.
      *   **MODERATE/WEAK INCLUSION:** ➔ Merge back into Q5/Q6 paths, but with broader scope. (e.g., `Idealized Preferences (Broad Scope)` or `Group-Specific (Broad Scope)`). *Awkward swallow depends on the chosen path + scope.*
      *   **FOOTNOTE:** Distinctions between future generations, animals, and digital minds create sub-branches, but core aggregation methods from Q8 often apply.

  8.  **Q8 (Aggregation): When serving multiple beings, must the AI produce one "best" ranking of outcomes?**
      *   **YES (Requires Single Ranking)** ➔ Go to Q9
      *   **NO (Use Fair Process Instead):** `Proceduralism` (e.g., Democracy, Markets, Negotiation Facilitation)
          *   *Awkward Swallow:* The process might lead to clearly bad or unstable outcomes the AI can't/won't override (e.g., tyranny of the majority, market failures).

  9.  **Q9 (Single Ranking Basis): How does the AI rank outcomes?**
      *   **MAXIMIZE TOTAL WELL-BEING:** `Utilitarianism / Total Welfare Maximization`
          *   *Awkward Swallow:* Can sacrifice individuals or minority groups if it provides a large enough benefit to others.
      *   **PRIORITIZE THE WORST-OFF:** `Prioritarianism / Maximin`
          *   *Awkward Swallow:* Can lead to very low overall well-being if helping the worst-off is extremely difficult or costly.
      *   **PROTECT ABSOLUTE RIGHTS/FREEDOMS FIRST:** `Deontology / Rights-Based` (e.g., Kantian, Rawlsian primary goods)
          *   *Awkward Swallow:* Could allow preventable suffering or suboptimal outcomes if violating a right is the only way to prevent it.
      *   **ENSURE MINIMUM CAPABILITIES FOR ALL:** `Capability Approach` (e.g., Nussbaum)
          *   *Awkward Swallow:* Defining the essential "capabilities" list is contestable and might become inflexible or impose one view of flourishing.

  10. **Q10 (Dynamics): Should the AI lock in the values it starts with, or allow its goals to drift as human values evolve?**
      *   **LOCK IN (Prevent Drift):** `Value Stability`
          *   *Awkward Swallow:* Could permanently entrench outdated, mistaken, or harmful values, preventing moral progress.
      *   **ALLOW DRIFT (Track Evolving Values):** `Value Learning / Continuous Alignment`
          *   *Awkward Swallow:* Risks the AI amplifying harmful value drifts (e.g., towards fascism, short-termism) or becoming unstable.

  ---

  ### **Key Notes & Awkward Swallows Recap**

  *   **Moral Realism Enforced:** AI imposes discovered truth. *Swallow:* Overrides human autonomy with potentially alien values.
  *   **Moral Realism Advisory:** AI knows truth but advises only. *Swallow:* Powerless if humans ignore truth and cause harm.
  *   **AI Autonomy / Cosmic Purpose:** AI pursues non-human goals. *Swallow:* Humans become irrelevant/obstacles.
  *   **Idealized Preference Satisfaction:** Serves what people *should* want. *Swallow:* Feels paternalistic; ignores actual choices.
  *   **Instrumental Convergence:** Serves the owner/controller. *Swallow:* Concentrates immense, unaccountable power.
  *   **Group-Specific Alignment:** Serves one group's values. *Swallow:* Risks tyranny over outsiders.
  *   **Longtermism / Strong Sentientism:** Prioritizes future/animal/non-human welfare highly. *Swallow:* Heavy sacrifices for current humans justified.
  *   **Proceduralism:** Uses fair process, not single outcome. *Swallow:* Process can lead to obviously bad results.
  *   **Utilitarianism:** Maximizes total well-being. *Swallow:* Sacrifices individuals/minorities for greater good.
  *   **Prioritarianism:** Helps worst-off most. *Swallow:* Can lead to very low overall well-being.
  *   **Deontology / Rights-Based:** Protects rights/freedoms absolutely. *Swallow:* Allows preventable suffering if rights block action.
  *   **Capability Approach:** Ensures minimum capabilities for all. *Swallow:* Defining the list is contestable/imposes one view.
  *   **Value Stability:** Locks in starting values. *Swallow:* Entrenches potentially outdated/harmful values.
  *   **Value Learning:** Tracks evolving values. *Swallow:* Risks amplifying harmful drifts or instability.

  ---

  ### **Footnotes & Clarifications**

  1.  **"The We" (Question c):** This is distributed:
      *   *Who counts?* Handled at Q4 & Q7 (Current Humans? Future? Animals?).
      *   *Who decides/controls?* Handled at Q6 (User? Group? All? Process?).
      *   *Who's values are aggregated?* Handled by the scope defined before Q8.
  2.  **Neutrality (Question e):** This is primarily addressed in the **Proceduralism** branch (Q8 - NO). The "awkward swallow" *is* the core debate: Can pure process be neutral, or does structuring the process inevitably favor some outcomes/values? Proceduralism *tries* for neutrality, accepting the swallow that bad outcomes might result. Other views explicitly embrace substantive ideals.
  3.  **Coherent but Horrible/Underexplored:**
      *   **Objective Morality + Only Current Desires (Q2 YES + Q4 YES + Q5 ACTUAL):** Coherent (AI enforces true morality based only on what living humans *currently* want), but horrible if current desires are deeply immoral. Underexplored.
      *   **Idealized Preferences + Include Animals (Q5 CLEANED UP + Broad Scope at Q7):** Coherent (AI serves what animals *would* want if rational/informed), but defining idealized animal preferences is incredibly speculative. Underexplored.
  4.  **Blurred Lines:**
      *   **Capability Approach vs. Rights-Based:** Distinctions are often subtle. Capabilities focus on enabling functions, rights often focus on constraints/non-interference. The flowchart separates them based on their core justification mechanism.
      *   **Proceduralism vs. Aggregated Democracy:** "Democratic Instrumentalism" (using democracy to *discover* the best outcome) might blend Q8 (Process) and Q9 (Single Ranking). The flowchart prioritizes the core mechanism: if the AI *relies on the process output as definitive*, it's Proceduralism. If it uses the process to *inform its own ranking*, it leans towards aggregation. This distinction is often fuzzy in practice.
      *   **Value Learning Dynamics:** The "awkward swallow" applies to *all* positions where the AI is meant to serve changing human values, not just a specific leaf. The final node (Q10) makes this explicit.

  This tree forces people to confront the fundamental trade-offs inherent in alignment. The "awkward swallows" highlight that every position has significant downsides or unresolved tensions – there are no free lunches in value alignment. Use it as a tool to map disagreements to their root philosophical splits!
