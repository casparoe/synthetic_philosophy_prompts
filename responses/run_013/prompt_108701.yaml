prompt: |-
  Right, I need help with something I should have sorted out months ago. I'm running the opening session of a grad seminar on the levels-of-selection debate — genes, individuals, groups, the whole mess — and I've realised I don't have a clean answer to the question my students will definately ask in week one, which is: what is a "unit of selection" claim even supposed to be doing? Watching the literature, everyone seems to be arguing past each other, and my suspicion is that half the disagreement is that they're answering to different requirements without saying so. So before we read anything, write me the desiderata: what does an adequate theory of units/levels of selection have to deliver? I want the full spec — the cases it has to get right and why those cases and not others (segregation distorters and meiotic drive, uniparentally inherited cytoplasmic elements, sterile workers in the eusocial insects, alarm calls and other apparently self-sacrificing behaviours, the policing of cheats inside a multicellular body with cancer as the stock example, and the major transitions where a lower-level unit gets absorbed into a higher-level one); the distinctions it mustn't collapse (replicator versus vehicle or interactor; selection of versus selection for; selection on individuals that happens to have group-level effects versus selection on groups as units in their own right; a group-beneficial effect versus group adaptation versus group fitness as a seperate property); and the formal results it has to live with — that the Price equation will happily partition covariance at whatever level you feed it, that kin-selection and group-selection treatments of the same trait come out equivalent across a wide range of models, and that you can have selection at a level with no evolutionary response at that level.

  Then tell me which of the requirements are genuine and which are just prejudices of one camp. I've a strong hunch that "the theory mustn't multiply levels beyond necessity" and "the theory must be able to say which level is the real one" are doing completely different kinds of work, and that the second isn't a desideratum at all — but I want your argument, not mine. Flag every pair you think can't be jointly satisfied; the one I most want to see is whether a theory can be level-neutral in its formalism and still return a non-arbitrary verdict on a concrete case like the eusocial insects, and if that's unsatisfiable then say so, because the list turning out to be unsatisfiable is itself the interesting result. One extra case I want the spec to rule on, since it isn't on the usual menu: whether the heritable microbiome — the holobiont, if you'll allow it — could be a unit of selection at all, given that the association is largely reassembled fresh each generation rather than inherited as a package. And keep the scorecard short; two or three lines each on the gene's-eye view, multilevel selection, and the kin-selection/contextual-analysis machinery is plenty, I'll do the proper scoring in the seminar with them.
reasoning: |-
  Okay, the user is running a grad seminar on the levels-of-selection debate and needs a clear framework for evaluating theories of units of selection. They want desiderata—what an adequate theory must deliver—covering specific cases, necessary distinctions, formal constraints, and insights into which requirements are genuine versus camp prejudices. 

  First, I need to map their explicit requests:  
  - Key biological cases (segregation distorters, cytoplasmic elements, eusocial insects, altruism, cancer policing, major transitions)  
  - Critical conceptual distinctions (replicator vs. vehicle, selection of/for, group effects vs. group adaptation, etc.)  
  - Formal constraints (Price equation’s flexibility, kin/group equivalence, selection without response)  
  - Meta-requirements (flagging conflicting desiderata, assessing "level neutrality vs. non-arbitrariness")  
  - The holobiont edge case  

  Their deeper needs:  
  - Unpacking why debates feel like people are talking past each other (likely due to unstated desiderata conflicts).  
  - Neutralizing tribal biases ("mustn’t multiply levels" vs. "must identify the real level") by exposing their functions.  
  - A pedagogical tool to help students dissect literature.  

  For desiderata, I’ll group into three buckets:  
  1. **Explanatory scope**: Must handle all listed cases without ad-hoc adjustments.  
  2. **Conceptual precision**: Must maintain distinctions that prevent equivocation (e.g., conflating group effects with group selection).  
  3. **Formal coherence**: Must respect mathematical truths (e.g., Price partitioning, kin/group equivalence).  

  The tensions they highlighted are crucial:  
  - "Level neutrality" (formal flexibility) clashes with "non-arbitrariness" (singular answers) because formalism alone can’t resolve ontological debates (e.g., is eusociality *really* individual or group selection?). This is unsatisfiable—theories must add interpretive principles.  
  - "Don’t multiply levels" (parsimony) vs. "identify the real level" (ontology) are indeed different: one is methodological, the other metaphysical. Only the first is a genuine desideratum.  

  Holobiont viability hinges on heritability: if microbiome composition is reliably reconstructed (e.g., via host genetics/environment), it *could* qualify, but patchy heritability often disqualifies it.  

  For scorecards:  
  - **Gene’s-eye view**: Excels at selfish elements and distinctions (replicator focus), but strains on altruism/multicellularity by reducing hierarchy.  
  - **Multilevel selection**: Handles transitions/group adaptation well, but risks proliferating levels arbitrarily.  
  - **Kin/contextual**: Formally clean and level-neutral, but feels "empty" to some by avoiding ontology.  

  Core conflict: Formalism (e.g., Price) can describe *any* level, but "unit" claims require added criteria like functional integration or inheritance bottleneck. That’s why debates persist—it’s about what *else* matters beyond math.
answer: |-
  Below is the formal specification ("spec") for an adequate theory of units/levels of selection, structured by your requirements. I flag key tensions and conflicts, including the central **unsatisfiable pair** you identified.  

  ---

  ### **I. Desiderata: What the Theory Must Deliver**  
  **A. Cases It Must Get Right (and Why):**  
  1. **Segregation distorters/meiotic drive**: Tests *replicator-level* selection without organismal benefit.  
  2. **Cytoplasmic elements**: Forces distinction between *vertical inheritance* (uniparental) and functional integration.  
  3. **Sterile workers (eusociality)**: Requires explaining *apparent individual sacrifice* without assuming group selection prematurely.  
  4. **Self-sacrificing behaviors (e.g., alarm calls)**: Distinguishes *kin-selected* vs. *group-selected* altruism.  
  5. **Cancer/policing in multicellularity**: Demonstrates *conflict suppression* as a hallmark of higher-level individuality.  
  6. **Major transitions (e.g., cells → organisms)**: Must explain how new units emerge via *collapsing lower-level fitness*.  
  *Why these?* They cover selfish genes, incomplete inheritance, cooperation, conflict, and evolutionary transitions—cornerstones of the debate.  

  **B. Distinctions It Must Preserve:**  
  1. **Replicator (inherited variant) vs. interactor (entity facing selection)** → Prevents conflating inheritance with selection dynamics.  
  2. **Selection *of* (outcome) vs. selection *for* (cause)** → Avoids mistaking byproducts for adaptations.  
  3. **Group effects (individual selection) vs. group selection** → Requires criterion for when groups are *units* (e.g., heritable group variation).  
  4. **Group benefit vs. group adaptation** → Benefit may be incidental; adaptation requires group-level heritable fitness.  
  *Collapsing these obscures causality*.  

  **C. Formal Constraints:**  
  1. **Price equation flexibility**: Must allow covariance partitioning at *any* level, but not equate this with biological significance.  
  2. **Kin/group equivalence**: Must acknowledge mathematical isomorphism but clarify *causal interpretation*.  
  3. **Selection without response**: Must handle cases (e.g., meiotic drive) where gene-level selection lacks phenotypic change.  
  *Formalism is necessary but insufficient for ontology*.  

  **D. Holobiont Test Case**:  
  - If microbiome composition is *heritable* (via host genetics/environmental niche) and affects fitness, it *can* be a unit.  
  - If reassembled randomly each generation → fails replicator/interactor criteria.  

  ---

  ### **II. Conflicts and Genuine vs. Spurious Desiderata**  
  **Genuine Desiderata** (essential for explanatory adequacy):  
  - Handle all cases in **I.A** without ad hoc fixes.  
  - Maintain distinctions in **I.B** to avoid causal confusion.  
  - Respect formal constraints (**I.C**) while providing biological interpretation.  
  - "**Don’t multiply levels beyond necessity**" → Parsimony in *explanatory entities* (methodological).  

  **Spurious Desiderata** (camp prejudices):  
  - "**Identify the *real* level of selection**" → Assumes a singular causal locus (often false: e.g., selfish genes + group selection in eusociality).  
  - "**Require group fitness to be indivisible**" → Ignores emergent fitness in transitions (e.g., multicellularity).  

  **Key Unsatisfiable Pair**:  
  - **Level-neutral formalism vs. Non-arbitrary verdicts** → **Unsatisfiable**.  
    - *Why*: Formalisms (e.g., Price, contextual analysis) are level-agnostic; they partition variance *as input*.  
    - But "units" require *biological criteria* (e.g., heritability, conflict suppression) for non-arbitrariness.  
    - *Eusocial insects example*: Formalism can assign selection to individuals (kin) or groups (MLS), but only criteria like *functional decoupling of workers* justify "group" as a unit.  

  ---

  ### **III. Theory Scorecard (Short)**  
  | **Approach**          | **Strengths**                                  | **Fatal Flaws**                              |  
  |------------------------|-----------------------------------------------|---------------------------------------------|  
  | **Gene’s-eye view**    | Cleanly handles selfish genes; enforces replicator/interactor split. | Reduces group adaptation to byproducts; strains in major transitions. |  
  | **Multilevel (MLS)**   | Natural fit for transitions, group adaptations; intuitive for hierarchies. | Risks level proliferation; often conflates group effects with group selection. |  
  | **Kin/Contextual**     | Formally rigorous; resolves kin/group equivalence; level-neutral. | Avoids ontology ("what is a unit?"); feels "empty" to critics. |  

  ---

  ### **Conclusion**  
  An adequate theory must: (1) Explain all core cases without special pleading; (2) Enforce causal distinctions; (3) Harmonize with formalism while adding *biological criteria* for units (e.g., heritable variation, conflict suppression). **The central tension is irreconcilable**: Formalism alone cannot dictate units—it requires supplemental criteria. This explains why debates persist: camps prioritize different criteria (e.g., gene-centric = replicator fidelity; MLS = functional integration). Your seminar’s key insight: "Unit of selection" is not a discovery but an *explanatory choice_ guided by biological evidence. The holobiont? It fails unless microbiome inheritance is non-random—highlighting that heritability is non-negotiable.
