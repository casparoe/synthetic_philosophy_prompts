  Your intuitions reveal a fascinating pattern that aligns with several principles in decision theory and ethics, even if they feel inconsistent at first glance. Let's break down the core drivers and synthesize a coherent principle that explains most of your verdicts—along with which intuitions might need refinement.

  ### The Pattern: Pragmatic Skepticism Toward Tiny Probabilities
  Your gut reactions suggest **diminishing sensitivity to probability below a threshold**, but **only when payoffs become "unbounded"** (infinite, existential, or beyond meaningful human scale). Crucially, this skepticism *intensifies* when probabilities feel speculative or ungrounded. Here's how it maps to your cases:

  | Scenario | Your Verdict | Probability Scale | Payoff Scale | Probability Reliability | Outcome Tangibility |
  |----------|--------------|-------------------|-------------|-------------------------|---------------------|
  | X-risk charity | ✔️ Switch | Low (1/1,000) | Existential (saving all future lives) | Low (speculative) | Abstract |
  | 1-in-1M to save 10M lives | ✔️ Gamble | Very low | Large but bounded (10M lives) | Assumed reliable | Concrete |
  | Pascal's Mugger | ❌ Refuse | Unspecified tiny | Unbounded (infinite torture) | Zero (untrustworthy) | Abstract |
  | $100 Bliss Pill | ❌ Refuse | Extreme (1/10⁴⁰) | Unbounded (eternal bliss) | Assumed reliable? | Abstract |
  | Physics Experiment | ❌ Don't run | Very low (1/10⁹) | Existential risk + bounded gain | Reliable? | Concrete risk |
  | Lottery Ticket | ❌ Don't buy | Extreme (1/10¹²) | Large but bounded ($1B) | High (published) | Concrete |

  ### The Core Principle: **Bounded Pragmatism**
  > **Act on tiny probabilities only if:**
  > **(a) The payoff is bounded and concrete, OR**
  > **(b) The probability estimate is sufficiently credible AND the stakes are existential.**  
  > **Otherwise, default to tangible, certain impacts.**

  This explains your verdicts:
  1. **X-risk charity (✔️)**  
     Fits (b): Stakes are existential (*all* future lives), and while probability is speculative, it's backed by research (credibility matters).  
  2. **Save 10M lives (✔️)**  
     Fits (a): Payoff is huge but bounded (10M lives ≠ "infinite"). Probability isn't vanishingly tiny.  
  3. **Pascal's Mugger (❌)**  
     Fails both: Probability is untrustworthy (extortion), payoff is abstractly unbounded.  
  4. **Bliss Pill (❌)**  
     Fails (a): Payoff is unbounded (eternal bliss). Fails (b): Probability is comically speculative (no mechanism).  
  5. **Physics Experiment (❌)**  
     Fails (b): The existential risk has concrete, near-term weight. A 1-in-10⁹ chance of doom feels more "real" than a 1-in-1,000 x-risk estimate.  
  6. **Lottery (❌)**  
     Fits (a) but you refuse: Payoff is bounded ($1B ≠ existential), but **this is your outlier**. Your intuition conflicts with cold expected value—likely due to psychological factors (e.g., known low EV, loss aversion).

  ### Where Your Intuitions Might Need Adjustment
  - **Lottery ticket**: Your refusal *is* technically irrational if we *only* consider expected value (EV). A $1 ticket for 1-in-10¹² chance of $1B has an EV of $0.0001. But:  
    - Humans reasonably discount probabilities below ≈1/10⁸ (they feel "effectively zero").  
    - The *utility* of $1B isn't life-changing if you're financially stable (diminishing returns).  
    **Verdict**: Keep your refusal—it's pragmatically sound, even if EV-positive.  
  - **Bliss Pill**: Defensible! Eternal bliss is **causally disconnected** from the pill (no plausible mechanism), making the probability functionally zero. Unlike x-risk work, there's no theory of change.  
  - **Physics Experiment**: Your refusal is wise. Existential risk probabilities feel more concrete when tied to a lab than to centuries of future uncertainty. The "precautionary principle" dominates here.

  ### The Job-Quit Dilemma: X-risk Charity or Physics Experiment?
  **This is closer to the physics experiment.** Here's why:  
  - **Probability reliability**: A 1-in-1M chance requires extraordinary evidence. Is this based on rigorous models? Or is it your friend's optimism?  
  - **Personal cost**: Quitting your job has *certain, high-impact downsides* (lost income, career disruption).  
  - **Opportunity cost**: Could you do more good by earning to donate?  

  **Apply Bounded Pragmatism**:  
  - If the probability is credible (e.g., based on peer-reviewed models) and the work uniquely reduces risk, *consider* it—like the x-risk charity.  
  - If the probability is soft or personal costs are high, it mirrors the physics experiment: tangible risks outweigh speculative gains.  

  > **Recommendation**: Don't quit unless:  
  > (1) The 1-in-1M estimate is exceptionally well-grounded,  
  > (2) Your skills are irreplaceable, AND  
  > (3) You'd still thrive if the project fails.

  ### The Big Picture
  Your intuitions aren't inconsistent—they reflect a **human-aligned form of expected utility theory** that discounts:  
  - Ultra-tiny probabilities (<10⁻¹⁵)  
  - Unbounded payoffs (eternity, infinity)  
  - Untrustworthy probability sources  
  - Abstract outcomes lacking "moral vividness"  

  Philosophers like Nick Bostrom (existential risk) and Eliezer Yudkowsky (AI risk) endorse versions of this. As Yudkowsky warns: *"Don't let your math get detached from reality."* Your gut knows this—hence the lottery refusal despite "clean" odds.

  **To integrate this**: Stress-test probability estimates. If a claim wouldn't convince a skeptical scientist, treat it as near-zero. Save heroic bets for cases where the harm of inaction is both vast *and* credible. And yes—keep that x-risk donation.
