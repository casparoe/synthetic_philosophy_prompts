answer: |-
  ## Final Examination: Historical Method and the Gospels

  **Question:** Your seminar colleague proposes reframing the standard criteria of authenticity (e.g., embarrassment, dissimilarity, multiple attestation, coherence) explicitly as likelihood ratios: P(Evidence | Authentic) / P(Evidence | Inauthentic). He argues this probabilistic approach resolves the apparent tensions among the criteria (e.g., dissimilarity isolating Jesus from Judaism, coherence risking circularity, all criteria presupposing transmission models) by making disagreements about specific probability estimates rather than fundamental method. Evaluate this proposal. Does translating the criteria into this explicit probabilistic framework successfully rescue their validity as tools for historical Jesus research, or does it merely relocate the core methodological difficulties inherent in applying these criteria to the Gospel tradition? In your answer, critically assess where the necessary probabilities could plausibly come from and whether this approach overcomes the problems of evaluating individual tradition units in isolation and presupposing contested historical background assumptions. Defend a clear verdict on the proposal's overall success or failure.

  **(Answer time: 90 minutes)**

  ---

  ## Model Answer (Approx. 800 words)

  The proposal to reframe authenticity criteria explicitly as likelihood ratios represents a valuable conceptual clarification but ultimately fails to rescue them as reliable tools for historical Jesus research. While it exposes the underlying logic and potential tensions more starkly, it merely relocates the fundamental methodological difficulties onto the problem of estimating the probabilities themselves and fails to solve the core issues of atomistic evaluation and circular presuppositions.

  Translating criteria into likelihood ratios (LR = P(E|A) / P(E|I)) certainly illuminates their mathematical structure. Dissimilarity, for instance, claims P(E|A) is high (Jesus was unique) while P(E|I) is low (the church wouldn't invent something unlike its own beliefs). Embarrassment claims P(E|I) is low (the church wouldn't invent embarrassing material). Coherence claims a high P(E|A) because it fits an established authentic profile. Multiple attestation increases P(E|A) if sources are independent. This formalization highlights that apparent tensions between criteria often stem from differing implicit estimates of these probabilities. For example, the tension between dissimilarity (favoring uniqueness) and coherence (favoring continuity) becomes a debate about whether P(E|A) is higher for sayings that are *dissimilar* to Judaism/Christianity or for sayings that *cohere* with other "authentic" material. Similarly, objections to embarrassment become arguments about whether P(E|I) is *actually* low (did the church ever invent embarrassing traditions for theological reasons?).

  However, this clarity does not solve the problem; it exposes the Achilles' heel: **the near-impossibility of assigning objective, non-circular values to P(E|A) and P(E|I).** The core function of the criteria was precisely *to estimate* the probability that the church would invent or preserve a given tradition unit (affecting P(E|I)) and the probability that Jesus said/did something distinctive or characteristic (affecting P(E|A)). Formalizing the criteria as LRs does not magically generate these probabilities; it just demands we state explicitly what was previously implicit. Where do these numbers come from?

  1.  **No Independent Baseline:** We lack an objective, statistically significant dataset of known authentic and inauthentic Jesus sayings/deeds against which to calibrate these probabilities. Our estimates are inevitably derived from *assumptions* about the historical Jesus, the early church's tendencies, and the transmission process – the very things the criteria were meant to investigate independently. Estimating P(E|I) (probability of invention) requires a model of early Christian creativity and transmission, which is highly contested and exactly the kind of background knowledge the criteria claimed to circumvent. Is P(E|I) low for a potentially embarrassing saying? That depends entirely on one's prior assumptions about the evangelists' or tradents' motives and methods, for which we have no independent control group.
  2.  **Atomism Amplified:** The probabilistic approach, especially when combining LRs for individual units (as implied by multiplying ratios), intensifies the problem of evaluating units in isolation. The meaning, plausibility, and thus the probabilities assigned to P(E|A) and P(E|I) for a single logion or pericope are often critically dependent on literary context, thematic clusters, and narrative framing within the Gospels – contexts deliberately minimized by the criteria approach. Assigning a high LR based on dissimilarity to a saying stripped of its narrative setting ignores how that setting might significantly alter P(E|A) or P(E|I). The probabilistic framework doesn't overcome this atomism; it formalizes it.
  3.  **Circularity Remains:** The coherence criterion, formalized as a high P(E|A) because E fits the established authentic profile, becomes explicitly circular. The "authentic profile" is itself constructed using the other criteria. Assigning a high LR via coherence directly depends on prior probabilistic judgments made using dissimilarity, embarrassment, etc., creating a self-reinforcing loop. The probabilistic lens makes this circularity more transparent but does not break it.
  4.  **Tensions Relocated, Not Resolved:** While the proposal correctly identifies that tensions are often about probability estimates, resolving those tensions requires agreeing on those estimates. The debate doesn't disappear; it shifts to arguing over the stipulated values of P(E|A) and P(E|I), values which are inherently speculative and rooted in the same contested historical, theological, and literary judgments that fueled the original debates. Does dissimilarity isolate Jesus? That's now a debate about the relative heights of P(E|A) and P(E|I) for unique vs. traditional material, grounded in prior assumptions about 1st-century Judaism and Christian development – the heart of the historical impasse.

  In conclusion, while the probabilistic reframing offers valuable analytical clarity by exposing the logical structure and implicit assumptions of the criteria, it does not rescue them. It fails to provide a method for obtaining the necessary probabilities objectively or non-circularly. The difficulties of atomistic evaluation persist and are formalized. The reliance on presupposed background knowledge about transmission and community behavior becomes more explicit but is no less problematic. The tensions among criteria are transformed into disagreements about subjective probability estimates rooted in the same fundamental historical uncertainties. Therefore, the proposal merely relocates the methodological impasse; it does not overcome it. The core problems inherent in applying these criteria to the Gospel tradition remain fundamentally unresolved within this probabilistic framework.

  ---

  ## Marking Scheme (20 Marks Total)

  **Must-Hit Points (4 marks each):**

  1.  **Recognizes & Explains the Likelihood Ratio Proposal:** Clearly describes how the proposal translates specific criteria (e.g., Dissimilarity, Embarrassment) into the form P(E|A)/P(E|I) and explains the colleague's argument that this resolves tensions by making disagreements about probability estimates.  
      *Mark Lost For:* Vague description of the probabilistic approach or failure to link specific criteria to specific LR arguments.

  2.  **Critically Assesses Source of Probabilities (P(E|A) & P(E|I)):** Directly addresses the challenge of assigning objective values to these probabilities, highlighting the lack of an independent baseline and the circular reliance on the very historical knowledge (e.g., about transmission, church tendencies) the criteria aimed to bypass.  
      *Mark Lost For:* Merely stating probabilities are hard to assign without linking this to the core methodological problem of circularity/independence, or failing to mention the absence of a calibration dataset.

  3.  **Analyzes Problem of Isolated Unit Evaluation:** Explains how the probabilistic approach, particularly combining LRs for individual units, formalizes and potentially exacerbates the issue of evaluating traditions stripped of their literary/narrative context, and how this impacts probability estimates.  
      *Mark Lost For:* Ignoring the atomism critique or failing to explain how context dependence affects P(E|A)/P(E|I).

  4.  **Addresses Circularity (Especially Coherence) & Relocation of Tensions:** Identifies how the coherence criterion becomes explicitly circular within the LR framework and explains that while tensions are framed as disagreements about probabilities, resolving these disagreements requires contestable historical judgments, thus relocating rather than resolving the impasse.  
      *Mark Lost For:* Ignoring the specific circularity of coherence in this model or claiming tensions are simply "resolved" without noting the shift to debating subjective probability estimates based on prior assumptions.

  5.  **Defends a Clear, Critical Verdict & Overall Justification:** States a clear verdict (e.g., "relocates but does not resolve difficulties") and provides a synthesized justification drawing on the analysis of probability estimation, atomism, circularity, and relocated tensions to explain *why* the proposal ultimately fails to rescue the criteria.  
      *Mark Lost For:* An indecisive or vague verdict; a verdict unsupported by the preceding analysis; only summarizing points without a final synthesized justification for the verdict.

  **Grading Summary:**
  *   **A (18-20):** Hits all 5 points clearly and convincingly. Demonstrates deep understanding of the proposal's structure and the core methodological impasse. Analysis is sophisticated, well-integrated, and justifies a strong verdict. Writing is clear and concise.
  *   **B (16-17):** Hits most points (4-5) but perhaps less deeply or with minor gaps/weaknesses in one area. Shows good understanding but may lack some sophistication in integrating the critique or justifying the verdict. Generally clear writing.
  *   **C (14-15):** Addresses the main points but superficially or with significant gaps/errors in 1-2 areas. Understanding of the proposal or the critique may be shaky. Verdict may be weak or poorly supported.
  *   **D (12-13):** Significant misunderstanding of the proposal or the critique. Fails to address key points (e.g., source of probabilities, circularity). Verdict absent or illogical.
  *   **F (<12):** Fundamentally misunderstands the question or proposal. Relies on rote summary of criteria/objections without engaging the probabilistic reframing. Incoherent or extremely deficient.
