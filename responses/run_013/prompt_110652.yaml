prompt: |-
  I'm a third-year PhD in history and philosophy of computing, and I've been roped into running the interview segment at a departmental workshop next month. The guest is a philosopher of AI who's been developing a reading of Turing's learning-machine writings — the postwar report on intelligent machinery and the 1950 paper in Mind — where the interesting claim isn't the imitation game at all. Her line is that Turing's real proposal was developmental: you don't build an adult, you build something with a childhood, and the point of the childhood is that the machine's teacher can't see what's going on inside it. She treats that as a condition on the resulting intelligence rather than an engineering convenience, and reads the whole education analogy as committing him to specific claims about error, discipline, and the value of an opaque learner.

  Can you draft 8-10 interview questions? I want them pressing on content, not letting her restate. Specifically: at least one on whether the developmental reading is really in the texts or read back in from later work in machine learning; one on the tension between her opacity requirement and Turing's own apparent confidence that you could intervene in a learning machine's behaviour and modify it by means other than straight instruction; one on what the education analogy does to the imitation game as a test — does it turn into a test of a trajectory rather than a snapshot?; and one on whether the child machine is meant to have anything like initiative or curiosity, or just reinforcement. For each of the sharp ones, give me a follow-up keyed to the answer she's most likely to give.

  One more thing: I'd rather you seperate what's actually settled in the texts from what's genuinely contested, and not present her reading as the consensus — it isn't.
