prompt: |-
  I'm on the curriculum commitee for our district's 9th-grade world history course — thirty weeks, four units, rewrite due in the spring, and the school board signs off in June. The fight we keep having isn't about coverage; everyone agrees we need more Asia, Africa, and the Americas in there. It's about framing. When we just slot new regions in, the story still bends around Europe: the only unit that's supposed to explain the modern world is the one on industrialization, everything before 1500 gets filed under 'medieval' or 'traditional,' and the regions we add end up described by what they supposedly lacked (no wheels, no iron, no horses). One colleague wants to delete the Industrial Revolution unit and replace it with 'knowledge and technology across Afro-Eurasia, 1200-1700'; another says that's just trading one center for another, and he's not wrong — a course centered on China or on the Islamic world would have its own blind spots. Meanwhile the state standards mandate a strand called something like 'the expansion of Western civilization,' and a group of parents are already convinced we've gone too far the other way. So I don't want a list of buzzwords or a sermon about why Eurocentrism is bad. I want a decision procedure my committee can actually run, unit by unit, to decide (a) whether a given framing is Eurocentric and (b) whether a proposed fix is an improvement on it: the questions to ask in order, what counts as a sufficient answer to each, where the procedure stops and gives a no, and where it has to hand the decision to a person because the disagreement is about what history is for and not about the facts. It should keep straight the difference between Europe showing up as one region among others and Europe showing up as the axis the whole thing turns on, since I think my colleagues on both sides conflate those. And it has to be honest that no frame is neutral — that we can't tell the past from everywhere at once — so it should say which distortions we're accepting and why, rather than pretending the right framing will have none. Draw on whatever is actually settled in the field about periodization and framing; I don't need a reading list and please don't cite things, I need the machinery.

  Then run it on three cases: our existing Scientific Revolution unit, with the proposed replacement above; an Industrial Revolution unit a teacher wants to keep but rebuild as 'coal, colonies, and cotton,' with Britain still the site but slavery, Caribbean plantations, and Indian textiles doing the explanatory work; and the periodization itself, i.e. whether labeling 500-1500 'the Middle Ages' is something we can fix or just a name we're stuck with. At least one of those should come out the way I don't want it to — I'd rather find that out in committee than at the board meeting — and tell me plainly where the procedure can't decide anything and a teacher is just going to have to pick.
reasoning: |-
  Okay, the user is on a curriculum committee for a 9th-grade world history course. They're dealing with a framing issue where adding more content from Asia, Africa, and the Americas still ends up centering Europe. The real problem is how to avoid Eurocentrism without just swapping one center for another. They need a practical decision procedure to evaluate framings unit by unit.

  First, I need to understand their main request: a step-by-step process to determine if a framing is Eurocentric and if a fix improves it. The procedure must differentiate between Europe as a participant versus the axis of history. Also, it must acknowledge that all frames have distortions and be based on settled historical scholarship without citations.

  The user mentioned three cases to test the procedure: the Scientific Revolution unit, the Industrial Revolution unit redesigned as 'coal, colonies, and cotton', and the periodization of 500-1500 as 'Middle Ages'. They want at least one outcome to be unfavorable to reveal issues early.

  Breaking down the decision procedure. Key elements: defining Eurocentrism operationally, checking for implicit comparisons to Europe, assessing if Europe is the driver of change, and ensuring other regions have agency. The procedure should have clear questions with thresholds for rejection. Also, it needs to handle cases where values conflict, requiring human judgment.

  For the Scientific Revolution unit, the existing version likely centers on European figures. The replacement "knowledge and tech across Afro-Eurasia 1200-1700" might avoid Europe as the axis but could still be Afro-Eurasia-centric. The procedure should flag if it treats other regions as lacking or passive.

  The 'coal, colonies, and cotton' framing for Industrial Revolution shifts focus to global factors like slavery and colonies. But since Britain is still the site, does it make Europe the axis? The procedure needs to check if Europe's role is contextualized within global systems or if it remains the central driver.

  The periodization question about 'Middle Ages' is tricky. The term itself is Eurocentric. Alternatives like 'Postclassical Era' might be better, but the procedure should assess if the label implies Europe as the norm. If the label can't be changed, the content must challenge the Eurocentric implications.

  The user also wants the procedure to explicitly state accepted distortions. For example, choosing a global frame might underemphasize regional nuances. Acknowledging this upfront is crucial for transparency.

  Potential pitfalls: The committee might conflate Europe's presence with Eurocentrism. The procedure must distinguish between Europe being included versus being the benchmark. Also, some fixes might introduce new biases, like focusing too much on connections and losing regional depth.

  For the test cases, the Scientific Revolution replacement passes if it presents multiple knowledge systems without hierarchy. The 'coal, colonies, cotton' framing might pass if it shows Britain's role as part of a global network. The 'Middle Ages' label fails unless the content actively counters its Eurocentrism.

  Where the procedure can't decide is when there's a fundamental disagreement on history's purpose. For example, if some value civilizational achievements while others emphasize oppression, the procedure can't resolve that. The committee must then make a values-based choice.

  Ensuring the procedure is practical: clear yes/no questions, thresholds for rejection, and explicit distortion statements. For instance, after each unit evaluation, the committee must articulate what distortions they're accepting and why.

  Testing the cases: The Scientific Revolution replacement should pass as it avoids Eurocentrism. The Industrial unit redesign also passes by decentering Britain's agency. The periodization label 'Middle Ages' fails unless reframed, requiring a new title or explicit content adjustments.

  The user's deeper needs include avoiding school board conflicts, ensuring curricular coherence, and providing teachers with a defensible framework. They need a tool that facilitates consensus and preemptively identifies problematic framings through structured analysis.
answer: |-
  Here's a concrete decision procedure designed for your committee to evaluate unit framings unit-by-unit. It focuses on identifying Eurocentrism and assessing proposed fixes, explicitly acknowledges inherent distortions, and delineates where factual analysis ends and value judgments begin.

  **The Eurocentrism Evaluation & Framing Improvement Procedure (EEFIP)**

  **Core Principle:** No framing is neutral. All historical narratives prioritize certain perspectives, actors, and processes while obscuring others. The goal is not to eliminate perspective but to choose one consciously that aligns with the course's stated goals (e.g., global understanding, critical thinking) and minimizes unexamined bias, particularly the privileging of Europe as the universal benchmark or inevitable engine of change.

  **Step 1: Define the Unit's Core Question & Scope**
  *   **Question:** What central historical question(s) is this unit explicitly designed to answer? (e.g., "Why did industrialization happen first in Britain?" vs. "How did global networks of resources, labor, and knowledge enable industrialization?")
  *   **Scope:** What temporal and geographical boundaries does the framing set? Are they justified by the core question?
  *   **Threshold:** If the core question *assumes* Europe as the sole subject or inevitable outcome (e.g., "How did Europe achieve modernity?"), it fails immediately. Proceed to Step 2 only if the question is potentially open to multi-regional or global processes.

  **Step 2: Identify the "Driver" Narrative & Key Actors**
  *   **Question:** Who or what is presented as the primary agent(s) of historical change within this unit's narrative? What processes are emphasized? Where are they located geographically?
  *   **Analysis:** Map the narrative flow. Identify if change originates primarily from one region (especially Europe) and spreads elsewhere ("diffusion"), or if it arises from complex interactions, parallel developments, or diverse regional initiatives.
  *   **Eurocentrism Flags (Fail if 2+ Flags are Raised):**
      *   **Flag 1: Europe as Sole Origin Point:** Change is depicted as originating *only* or *primarily* in Europe.
      *   **Flag 2: Europe as Universal Benchmark:** Other societies are described primarily in terms of what they lacked *compared to Europe* (e.g., "lacked nation-states," "no scientific revolution") rather than on their own terms or via comparison across multiple regions.
      *   **Flag 3: Non-Europe as Passive/Reactive:** Non-European regions primarily appear only as recipients of European ideas/actions, obstacles to European progress, or sources of raw materials/labor for European development. Their agency is minimized.
      *   **Flag 4: Europe as Telos:** The narrative implicitly or explicitly positions European-style development/modes of organization (e.g., industrialization, nation-state) as the inevitable or superior endpoint of historical progress that other regions were (or are) striving toward.

  **Step 3: Assess Representation & Relationality**
  *   **Question:** How are different world regions represented? Are they explored primarily in isolation, or are their interconnections explored? Is Europe one region among many, or the central axis?
  *   **Analysis:** Examine unit content weighting, case studies, and vocabulary.
  *   **Eurocentrism Flags (Fail if "Axis" criteria met):**
      *   **"Axis" Test:** Does the unit's structure or narrative *require* Europe to be the central reference point for understanding developments elsewhere? (e.g., "The Age of Exploration" implicitly centers Europe; "Eurasian Exchange Networks" does not). If yes, it's Eurocentric as the axis.
      *   **"Participant" Test:** Can Europe be understood as one significant participant within a broader system or set of parallel developments? If yes, it passes this step (even if prominent, as long as not the *axis*).

  **Step 4: Evaluate a Proposed Fix**
  *   **Question:** Does the proposed alternative framing directly address the specific Eurocentrism flags identified in Steps 2 & 3 for the *original* framing?
  *   **Analysis for Improvement:**
      *   **Mitigation:** Does it reduce the number or severity of Eurocentrism flags?
      *   **New Distortions:** What new biases or omissions might this framing introduce? (e.g., Over-emphasizing connections at expense of internal dynamics; creating a new "center"; downplaying power imbalances like colonialism).
      *   **Alignment with Core Question:** Does it still effectively address the unit's core historical question (or is the question also being productively changed)?
      *   **Manageability:** Is the scope feasible within time/resource constraints? (A practical, non-ideological necessity).
  *   **Threshold:** The fix is an improvement if it significantly mitigates identified Eurocentrism *without* introducing equally problematic distortions *and* remains feasible/manageable. It doesn't need to be perfect, just better.

  **Step 5: Acknowledge Distortions & Justify Choice**
  *   **Mandatory Output:** For the chosen framing (original or fixed), the committee **must explicitly state:**
      1.  **The primary distortion(s) inherent in this framing:** (e.g., "Over-emphasizes global connections at the expense of deep regional analysis"; "Focuses on state power, marginalizing subaltern voices"; "Treats Afro-Eurasia as a coherent unit, underplaying distinct African trajectories"; "Prioritizes economic structures over cultural/intellectual history").
      2.  **Why this distortion is acceptable *for this unit*:** Link to the unit's core question, scope, manageability, and overall course goals. (e.g., "This distortion allows us to effectively trace the global material foundations of industrialization within the time constraints"; "We accept this regional focus to enable deeper comparative analysis of state formation"; "We prioritize connections here to counter prior isolationist narratives, acknowledging regional depth is covered in other units").

  **Where EEFIP Stops and Humans Decide:**
  *   **Step 1 Threshold:** Disagreement on the *core question* itself is fundamental. EEFIP can't resolve whether the unit *should* ask "Why Britain?" or "What is modernity globally?". This requires committee debate based on *course-wide goals and philosophy*.
  *   **Step 4 "New Distortions":** Judging the *severity* of a new distortion vs. the mitigated Eurocentrism is often subjective. EEFIP forces explicit acknowledgment, but the final weighting is a human judgment call based on values and priorities.
  *   **Step 5 Justification:** *Why* a particular distortion is acceptable hinges entirely on the committee's educational philosophy and priorities for the course. EEFIP ensures the discussion happens explicitly.

  **Running EEFIP on Your Cases:**

  **Case 1: Scientific Revolution Unit**
  *   **Existing Framing:** Likely "The Scientific Revolution in Europe (1550-1700)".
  *   **Step 1:** Core Question: Probably "How did modern science emerge in Europe?" - **FAILS** (Assumes Europe as sole subject/outcome). *Proceed hypothetically assuming it passed.*
  *   **Step 2:** Drivers = European thinkers (Copernicus, Galileo, Newton), Process = European intellectual breakthrough. **Flags:** 1 (Sole Origin), 2 (Benchmark - others "lacked" it), 3 (Non-Europe likely passive/absent). **FAIL.**
  *   **Step 3:** **Axis Test:** Narrative entirely centers on Europe as the site and source. **FAIL (Axis).**
  *   **Proposed Fix:** "Knowledge and Technology across Afro-Eurasia, 1200-1700".
  *   **Step 4 (Evaluation of Fix):**
      *   **Mitigation:** Directly addresses Flags 1, 2, 3, 4. No single origin, multiple benchmarks, active non-European participants (Islamic scholars, Chinese innovations, Indian math), not teleological towards Europe.
      *   **New Distortions:** Might underemphasize *why* institutional structures in Europe later fostered specific types of systematization (without claiming inherent superiority); risk of becoming "Afro-Eurasio-centric," marginalizing the Americas; potential loss of depth on the complex *European* intellectual shift if not handled carefully.
      *   **Alignment:** Changes the core question to "How did knowledge and technology develop and circulate across Afro-Eurasia?" - a valid and important question.
      *   **Manageability:** Broad scope requires careful selection of concise, impactful case studies. Feasible with focus.
  *   **EEFIP Verdict:** **Significant Improvement.** Mitigates core Eurocentrism flags. New distortions are acknowledged and can be managed through content selection. Core question productively changed.

  **Case 2: Industrial Revolution Unit - "Coal, Colonies, and Cotton"**
  *   **Existing Framing:** Likely "The Industrial Revolution in Britain".
  *   **Step 1:** Core Question: "Why/How did the Industrial Revolution happen in Britain?" - Passes threshold (though focused).
  *   **Step 2:** Drivers = British inventors, entrepreneurs, institutions. **Flags:** 1 (Sole Origin - implied), 3 (Non-Europe as source of materials/labor, agency minimized). **Likely FAIL (Flags 1 & 3).**
  *   **Step 3:** **Axis Test:** Britain is the central site and agent. **FAIL (Axis).**
  *   **Proposed Fix:** "Coal, Colonies, and Cotton: The Global Making of Industrialization (with Britain as a focal point)".
  *   **Step 4 (Evaluation of Fix):**
      *   **Mitigation:** Directly addresses Flags 1 & 3. Britain is *a* site, not *the* sole origin; Slavery, plantations, and Indian deindustrialization are active, essential *global* components driving/forming the process, not just inputs. Agency of enslaved people, colonized populations (even if coerced) is part of the explanation.
      *   **New Distortions:** Risk of downplaying *internal* British factors (geography, institutions, finance) if not integrated well; could become overly economistic; still geographically broad.
      *   **Alignment:** Answers "Why Britain?" *by embedding Britain within global systems* (capital from slave trade, markets from colonies, raw materials like cotton). More robust answer to the original question.
      *   **Manageability:** Very feasible. Uses familiar anchor (Britain) while fundamentally reframing context.
  *   **EEFIP Verdict:** **Significant Improvement.** Effectively decenters Britain as the sole agent/axis, making global exploitation and interaction central to the explanation. Mitigates key flags. New distortions manageable.

  **Case 3: Periodization - Labeling 500-1500 as "The Middle Ages"**
  *   **This is a framing choice for a large temporal block.**
  *   **Step 1:** Core Question: Implicitly, "What defines this era globally?".
  *   **Step 2 & 3 Analysis:** The term "Middle Ages" itself is the issue.
      *   **Flag 2 (Benchmark):** It defines the era purely in relation to European periodization ("middle" between Classical Antiquity and Renaissance). It implies Europe is the norm.
      *   **Flag 4 (Telos):** It positions this period as merely a prelude to the (European) Renaissance/Modernity.
      *   **Axis Test:** The term inherently makes European historical development the axis for defining global chronology. **FAIL (Axis - via terminology).**
  *   **Proposed Fix:** Alternatives: "The Postclassical Era," "Era of Expanding Networks," or thematic titles ("Age of Faith and Empire?" - though problematic too). *EEFIP can't mandate a specific new label.*
  *   **Step 4 (Evaluation of Fix - Using "Postclassical Era" as example):**
      *   **Mitigation:** Removes explicit European referent (Classical/Renaissance). Avoids Flag 2 & 4 embedded in the label itself.
      *   **New Distortions:** "Postclassical" still centers the *collapse of classical empires* (Rome, Han, Gupta) as the defining start, potentially marginalizing regions less affected (e.g., parts of Africa, Americas). It's vague. Thematic titles have their own biases.
      *   **Alignment:** Allows for a more global perspective within the period. Doesn't force other regions into a European-derived box.
      *   **Manageability:** Simple terminology change.
  *   **EEFIP Verdict on the Label "Middle Ages":** **FAIL.** The term itself is Eurocentric as the axis (Step 3 Axis Test). It must be changed. **"Postclassical Era" is an Improvement.** While imperfect and introducing a different distortion (centering imperial collapse), it removes the inherent Eurocentric baggage. The content taught *under* this new label must then be scrutinized via EEFIP for individual units to avoid Eurocentrism in the narrative itself.

  **Where the Procedure Can't Decide (And You Have to Pick):**

  1.  **The Core Question (Step 1 Threshold):** EEFIP flags a question like "Why did Europe dominate after 1500?" as Eurocentric. But *should* the course even ask that question? Or should it ask "How did global power dynamics shift between 1500-1800?"? This is a fundamental philosophical choice about the course's purpose that EEFIP exposes but cannot resolve. The committee must debate and vote on the *kind* of historical questions deemed most valuable for students.
  2.  **Weighing Distortions (Step 4 & 5):** Is the potential "Afro-Eurasio-centrism" of the Scientific Revolution fix *worse* than the Eurocentrism it replaces? Is the economistic focus of "Coal, Colonies, Cotton" a more acceptable distortion than narratives ignoring exploitation? EEFIP forces you to name these distortions and justify the choice, but the *value judgment* of which distortion is less problematic for your educational goals rests with the committee.
  3.  **The "Why" in Step 5:** *Why* is accepting a focus on state power over subaltern voices acceptable? EEFIP mandates stating the reason, but the validity of that reason ("It's more manageable," "State power is central to standard political history narratives") is based on the committee's shared (or contested) values and priorities.

  **Conclusion:** EEFIP provides a structured, evidence-based way to move beyond buzzwords. It forces explicit identification of Eurocentrism as defined by specific flags and the "axis test," mandates evaluation of fixes against those specific flaws, and requires owning the resulting distortions. It successfully identifies the "Middle Ages" label as inherently problematic and shows how the proposed fixes for Science and Industry units are significant improvements by decentering Europe as the axis and primary agent. The areas it highlights for human judgment (core questions, weighing distortions, justifying choices) are precisely where the real, values-based curriculum debates happen. Using this procedure should lead to more defensible, less implicitly Eurocentric units and expose fundamental disagreements early, before the school board meeting.
