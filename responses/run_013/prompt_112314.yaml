  3. Round 2: Constitutive Values (25 minutes: same)
  4. Debrief (35 minutes)

  **Debrief Script:**
  We want to draw out the key points.

  Start by asking about Round 1:
  - "In the first round, did anyone manage to make a trade that left you better off? How did it work?"
  - "Did anyone feel that the trade was a genuine improvement by your own standards?"

  Then Round 2:
  - "In the second round, did trades work as well? Did anyone end up worse off even though you thought you were making a good trade? Why?"
  - "Did anyone feel that trading away one commitment affected how you felt about the others?"

