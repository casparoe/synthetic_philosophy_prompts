  **Facilitator's Plan: The Value Exchange Activity**

  **Total Time:** 90 minutes

  **Materials:**
  - Role sheets for Round 1 (14 different roles, each with preferences and point values for 3 decisions).
  - Role sheets for Round 2 (14 roles, with preferences and conditional point values for 3 new decisions).
  - Whiteboard or flip chart to record the status quo and outcomes.
  - Paper and pens for students to record their agreements and points.

  **Preparation:**
  - Prepare the role sheets in advance. For Round 1, design 14 roles with varying preferences on 3 policy decisions. For Round 2, design 14 roles with preferences on 3 moral decisions and with some roles having conditional points (interdependencies).

  **Introduction (5 minutes):**
  "Today we're going to simulate collective decision-making in a diverse society. Each of you will play a role with specific values. We have two sets of decisions to make. The goal is to get as much of what you value as possible. You can negotiate with others to trade support on one decision for support on another. We'll do two rounds. In each round, we'll have three decisions to make. For each decision, there are two options: the status quo and a proposed change. We'll vote on each change. Your satisfaction is measured in points that are private to you. At the end, we'll discuss the experience."

  **Round 1: Policy Decisions (Modular Values) (25 minutes)**

  1. **Assign Roles (2 minutes):** Hand out Round 1 role sheets. Each sheet has:
     - Role name.
     - For each of 3 decisions:
          - Description of the decision and the two options (status quo and change).
          - Which option they prefer.
          - How many points they get if their preferred option wins (and 0 if the other wins).
     - Example: 
          - Role: Environmental Advocate
          - Decision 1: Arts Funding
              - Option A (status quo): Current funding.
              - Option B: Decrease funding by 10%.
              - You prefer Option B. If Option B wins, you get 2 points. If Option A wins, you get 0.
          - Decision 2: Tax Policy
              - Option A (status quo): Current tax rate.
              - Option B: Raise taxes on the wealthy.
              - You prefer Option B. If it wins, 8 points; else 0.
          - Decision 3: Environmental Regulation
              - Option A (status quo): Current regulations.
              - Option B: Stricter regulations.
              - You prefer Option B. If it wins, 10 points; else 0.

     Note: The status quo for each decision is fixed. The group will vote on whether to change to Option B.

  2. **Status Quo Calculation (1 minute):** Have each student calculate their status quo points (if no changes happen, they get points for each decision where they prefer the status quo and 0 for the others).

  3. **Negotiation (10 minutes):** Students can negotiate with each other. They can make binding agreements: "I will vote against the change on Decision X (so the status quo remains, which you want) if you vote for the change on Decision Y (so the change happens, which I want)." They can form coalitions. Encourage them to write down agreements.

  4. **Voting (5 minutes):** Vote on each decision one by one. For each decision:
     - Ask: "Should we change from the status quo to Option B?"
     - Students vote by show of hands. Majority wins.
     - Record the outcome.

  5. **Calculate Points (2 minutes):** Each student calculates their total points for Round 1.

  6. **Quick Reflection (5 minutes):** Ask:
     - "How many of you have more points than in the status quo?"
     - "Did trading work? How?"

  **Round 2: Moral Decisions (Constitutive Values) (25 minutes)**

  1. **Assign New Roles (2 minutes):** Hand out Round 2 role sheets. Each sheet has:
     - Role name and a description of their value system (if appropriate).
     - For each of 3 new decisions, their preferred option and points.
     - Some roles have conditional points. For example:
          - Role: Religious Conservative
          - Decision 4: Same-sex marriage
              - Option A (status quo): Only opposite-sex marriage allowed.
              - Option B: Allow same-sex marriage.
              - You prefer Option A. If A wins, 10 points; if B wins, 0.
          - Decision 5: Religious symbols in public schools
              - Option A (status quo): Allowed.
              - Option B: Banned.
              - You prefer Option A. If A wins, 8 points; if B wins, 0.
          - Decision 6: Hate speech protection
              - Option A (status quo): Protected as free speech.
              - Option B: Can be banned.
              - You prefer Option A. If A wins, 7 points; if B wins, 0.
          - Condition: If the outcome of Decision 4 is B (same-sex marriage allowed), then your points for Decisions 5 and 6 are halved (rounded down) even if you win.

     Similarly, for a "Civil Libertarian":
          - Decision 4: Prefer B (10 points)
          - Decision 5: Prefer B (5 points)
          - Decision 6: Prefer A (10 points) [because they protect free speech]
          - Condition: If the outcome of Decision 6 is B (hate speech can be banned), then your points for the other decisions are halved.

  2. **Status Quo Calculation (1 minute):** Students calculate their status quo points (assuming no changes).

  3. **Negotiation (10 minutes):** Same as before. But note: students do not know the conditional rules of others.

  4. **Voting (5 minutes):** Vote on each decision.

  5. **Calculate Points (2 minutes):** Now students apply any conditional rules and calculate their total.

  6. **Quick Reflection (5 minutes):** Ask:
     - "How many of you have more points than in the status quo? Less?"
     - "Did anyone make a trade that backfired? Why?"

  **Debrief (35 minutes):**

  Start by asking about Round 1:

  1. "In Round 1, many of you found trades that improved your outcome. Can someone describe a trade that left both parties better off? How did it work?" 
     - Draw out: They traded concessions on lower-priority issues for gains on higher-priority ones.

  2. "This is the gains-from-trade idea: by exchanging concessions, both parties can end up ahead. It assumes that we can compare the importance of different issues (commensurability) and that giving up one issue doesn't affect the others (modularity)."

  Transition to Round 2:

  3. "In Round 2, things seemed to break down for some. Who had a different experience? Can you explain why your trade didn't work as expected?"
     - Expect stories about conditional points: "When I lost on Decision 4, it made my win on Decision 5 and 6 feel hollow because they were worth less."
     - Draw out: Some values are constitutive. Losing on a core issue can undermine the entire system.

  4. "Did anyone feel that trading away a particular commitment changed how you felt about the commitments you gained? Why?"
     - This touches on the endogeneity of preferences: the trade itself changed the meaning of the values.

  5. Strategic behavior: "Did anyone consider exaggerating how much you cared about an issue to get a better deal? What would happen if everyone did that?"
     - Draw out: The system rewards strategic misrepresentation, which can lead to polarization and radicalization.

  6. "At the end, were you able to say cleanly whether the trades you made were gains? Why or why?"
     - Some might say yes, but others no because the points don't capture the moral experience.

  Now, map to philosophical concepts (but without jargon first):

  7. "Let's connect this to our argument about moral disagreement. In Round 1, we saw how trade can be positive-sum. In Round 2, we encountered limitations: 
     - Some values cannot be easily traded because they are tied to your identity or worldview (alienability).
     - The possibility of strategic behavior can corrupt the process.
     - And note: the act of trading might change your values (endogeneity)."

  8. Finally, pose the unresolved question: "So, when we face moral disagreements, is trade a way to find mutual gains, or is it a kind of betrayal? And how can we even measure 'better off' when the trade might change what we care about?"

  **Predictable Problems and Handling:**
  - **Free-riding or refusal to trade:** Some students might not engage. Ask them in the debrief: "Why did you choose not to trade?" and use that to discuss integrity and incommensurability.
  - **Arithmetic fails to convince:** Emphasize that the points are a model of their own subjective satisfaction. If they didn't feel it, that's part of the point: real values might not be quantifiable.
  - **Coalition exclusion:** In voting, a majority might ignore the minority. Point out that the gains-from-trade argument assumes everyone is at the table and can trade. If not, we get exclusion.

  **What the activity cannot reproduce:** 
  - The first-person moral experience of compromising a core commitment (the feeling of selling out). We have to describe this in words.

  \answer{the first-person moral experience of selling out}
answer: |-
  ### Facilitator's Plan: The Value Exchange Simulation  
  **Total Time:** 90 minutes  
  **Materials:**  
  - 14 role sheets (7 "Type A" and 7 "Type B" for Round 1; reassigned as "Type C" and "Type D" for Round 2).  
  - 14 tokens (e.g., colored chips) to represent "satisfaction points."  
  - A shared decision board (whiteboard or digital) to record agreements and outcomes.  
  - Timer.  

  **Setup:**  
  - Arrange chairs in a circle to encourage face-to-face negotiation.  
  - Place the decision board at the front with three slots: "Decision 1," "Decision 2," "Decision 3."  
  - Hand out role sheets and tokens at the start of each round. Tokens are private (not transferable) and represent a student’s "satisfaction level."  

  ---

  ### **Introduction (5 minutes)**  
  "Today, we’ll simulate collective decision-making in a diverse group. Each of you has a role with specific values. We’ll make three group decisions per round. Your goal is to maximize your satisfaction points, which reflect how well the outcomes align with your values. You can negotiate trades: 'I’ll support your preferred outcome on Decision X if you support mine on Decision Y.' All agreements must be written on the decision board to be binding. Let’s begin."  

  ---

  ### **Round 1: Modular Values (25 minutes)**  
  *Goal: Students experience a Pareto-improving trade where everyone gains by their own metrics.*  

  1. **Assign Roles and Explain Rules (5 min)**  
     - Distribute **7 Type A and 7 Type B role sheets** (see *Role Sheets* below).  
     - **Type A roles** prioritize Decisions 1 > 2 > 3.  
     - **Type B roles** prioritize Decisions 3 > 2 > 1.  
     - **Satisfaction points:**  
       - If your top priority wins: +3 tokens.  
       - If your second priority wins: +2 tokens.  
       - If your third priority wins: +1 token.  
       - If a decision goes against your preference: +0 tokens.  
     - **Status quo:** All decisions default to "Option 0" (e.g., no change). Status quo gives everyone 0 tokens.  
     - **Trading rules:**  
       - Negotiate 1:1 or in groups.  
       - Any agreement must specify: "I support [Option] on Decision [X] in exchange for your support on [Option] on Decision [Y]."  
       - Binding only if written on the decision board.  
     - **Voting:** Majority wins per decision.  

  2. **Negotiation and Voting (15 min)**  
     - Start timer (10 min for negotiation, 5 min for voting).  
     - Circulate and prompt: "Find someone with opposite priorities. What can you offer them?"  
     - **Predictable issue:** Some students may resist trading ("I won’t compromise my values!"). Gently remind: "Your goal is to maximize your tokens by your own ranking."  
     - After negotiation, hold a public vote per decision. Record outcomes on the board.  

  3. **Calculate Points (5 min)**  
     - Students tally tokens based on outcomes.  
     - Ask: "How many of you have more tokens than the status quo (0)?" (Most will).  
     - Sample reflection: "Show of hands: Who gained by trading a lower priority for a higher one?"  

  ---

  ### **Round 2: Constitutive Values (25 minutes)**  
  *Goal: Students hit the incommensurability problem—trades "dissolve" their value system.*  

  1. **Assign New Roles and Explain Twist (5 min)**  
     - Redistribute **7 Type C and 7 Type D role sheets**.  
     - **Type C roles** (e.g., "Community First"): Wins on Decisions 1 and 2 are interdependent.  
     - **Type D roles** (e.g., "Rights First"): Wins on Decisions 2 and 3 are interdependent.  
     - **Satisfaction points (critical twist):**  
       - Top priority: +3 tokens.  
       - Second priority: +2 tokens, **but only if top priority also wins**. If not, +0.  
       - Third priority: +1 token, **but only if top two priorities win**. If not, +0.  
     - Same status quo, trading, and voting rules as Round 1.  

  2. **Negotiation and Voting (15 min)**  
     - Start timer (same as Round 1).  
     - **Predictable issues:**  
       - Students may not grasp interdependencies at first ("Why did I get 0 tokens? I won Decision 2!").  
       - Coalitions may exclude quiet students (e.g., 4-5 dominant traders). Intervene: "Check if everyone has a partner."  
     - After voting, record outcomes.  

  3. **Calculate Points (5 min)**  
     - Students tally tokens. Many will have low scores (e.g., win on second priority but lose top, so +0).  
     - Ask: "Who feels worse off than Round 1? Why?"  

  ---

  ### **Round 3: Strategic Behavior Twist (10 minutes)**  
  *Goal: Students notice trading incentivizes radicalization.*  

  1. **Announce New Rule (2 min)**  
     - "You now have one minute to publicly declare a 'non-negotiable' position. You gain +1 bonus token if you win it, but lose -1 token if you compromise it. Otherwise, same rules as Round 2."  

  2. **Negotiation and Voting (8 min)**  
     - Students declare non-negotiables (e.g., "Decision 1 is non-negotiable for me!").  
     - **Predictable issue:** Some inflate positions ("I’ll say everything is non-negotiable to get bonuses!"). Others refuse on principle.  
     - Vote and tally points.  

  ---

  ### **Debrief (35 minutes)**  
  *Script: Draw out insights via questions. Withhold jargon until students articulate ideas.*  

  **Step 1: Relive Round 1 (Gains-from-Trade)**  
  - Q1: "In Round 1, how did you achieve gains? Give an example of a win-win trade."  
    - *Listen for:* "I conceded a low-priority issue to win a high-priority one."  
    - **Map to:** Pareto improvement—trades increased everyone’s satisfaction by their own rankings.  
  - Q2: "What assumptions made this possible?"  
    - *Draw out:* Values were modular (separable) and commensurable (could be ranked/traded).  

  **Step 2: Contrast Round 2 (Objections)**  
  - Q3: "In Round 2, why did some trades backfire? How did it feel?"  
    - *Listen for:* "Winning my second priority felt worthless when I lost my top one."  
    - **Map to:** Non-commensurability (values can’t be ranked independently) and non-alienability (trading a value "dissolves" others).  
  - Q4: "Did anyone’s ‘satisfaction’ depend on the *combination* of outcomes? How?"  
    - **Map to:** Constitutive commitments—values are interdependent.  

  **Step 3: Analyze Round 3 (Strategic Corruption)**  
  - Q5: "In Round 3, how did the ‘non-negotiable’ rule change behavior?"  
    - *Listen for:* "People exaggerated stances to get bonuses."  
    - **Map to:** Strategic misrepresentation—system rewards radicalizing positions to gain leverage.  
  - Q6: "Is this a flaw in the people or the mechanism?"  
    - *Draw out:* Incentives can corrupt moral reasoning.  

  **Step 4: The Big Unresolved**  
  - Q7: "After the trades, could you always tell if you were ‘better off’? Why or why not?"  
    - *Listen for:* "In Round 2, my tokens didn’t capture my frustration" or "Trading changed how I saw my values."  
    - **Map to:** Endogeneity of preferences—trades alter your "lights."  
  - Q8: "When is a trade a ‘gain’ versus a ‘sellout’? What’s the difference?"  
    - **Introduce jargon:** Commensurability, integrity, alienation.  

  **Step 5: Synthesize**  
  - "We started with a gains-from-trade model (Round 1), but hit limits: some values resist being traded like currency (Round 2), and the system can encourage dishonesty (Round 3). This mirrors real debates: Can moral conflict be positive-sum, or does trade undermine the ‘ground’ of our values?"  

  ---

  ### **Predictable Problems and Solutions**  
  - **Free-riders/Refusers:** A student rejects all trades.  
    - *Solution:* Use them in debrief: "You didn’t trade—did you end up better or worse? Why?" Highlights integrity vs. gains.  
  - **Arithmetic Fails:** Students dismiss tokens as "unrealistic."  
    - *Solution:* "The tokens represent ‘by your own lights.’ If they felt arbitrary, that’s the point—real values might not be quantifiable."  
  - **Exclusion:** A coalition dominates, sidelining others.  
    - *Solution:* Note aloud: "Did anyone feel unheard? How does this reflect real power dynamics in negotiation?"  

  ---

  ### **What the Activity Cannot Reproduce**  
  The rules simulate tradeoffs, but **cannot replicate the visceral first-person experience of "selling out" a core commitment**—the guilt, identity crisis, or sense of moral corruption. Tokens abstract away the emotional weight of betraying a value that defines who you are. You must *describe* this texture:  
  > "Imagine trading a value like ‘never lie’ for a gain. Even if you ‘win,’ you might feel you’ve destroyed your integrity—the thing that made the win meaningful. No points system can capture that."  

  \answer{the visceral texture of selling out}
