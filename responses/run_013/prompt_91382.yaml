answer: |-
  Here’s a concrete argument that reframes the problem of old evidence as a *reductio* against the orthodox Bayesian assumption that known propositions have probability 1, rather than a flaw in conditionalization itself. I’ll then defend a "revisable evidence base" model and honestly state its costs.

  ---

  ### **The Argument: A Reductio Against Probability-1 Evidence**
  **Orthodox Bayesianism’s problem of old evidence**:  
  - If evidence \(E\) is already known (e.g., Mercury’s perihelion shift), \(P(E) = 1\).  
  - By Bayes’ theorem, \(P(H|E) = \frac{P(E|H)P(H)}{P(E)} = P(H)\) (since \(P(E) = 1\)).  
  - Thus, \(E\) cannot confirm \(H\), even if \(E\) was critical to \(H\)’s construction (e.g., Einstein’s derivation of GR). This is absurd.  

  **The flawed assumption**:  
  The core issue is not conditionalization but the *immutable certainty* assigned to known evidence: if \(P(E) = 1\), learning \(E\) cannot change beliefs. But science treats evidence as *revisable* (e.g., if new instruments question past data). Orthodox Bayesianism conflates "known" with "certain beyond all possible doubt."  

  **Revisable evidence base solution**:  
  Suppose an agent has credences over evidence propositions. "Knowing" \(E\) means sharply raising \(P(E)\) (e.g., to 0.999), **not** fixing it at 1. Let’s make this concrete:  

  - **Scenario**: An agent tests a hypothesis \(H\): "This coin is biased toward heads."  
  - **Evidence \(E\)**: "7 heads in 10 flips."  
  - **Initial credence**: Before flipping, \(P(E) = \text{Binomial}(7; 10, 0.5) \approx 0.12\).  
  - **After observing \(E\)**: The agent *raises* \(P(E)\) to 0.999 (reflecting high confidence), but not 1.  
  - **Hypothesis \(H\)**: Let \(P(H) = 0.4\) initially.  

  **Can \(E\) still confirm \(H\) after being "known"?**  
  - **Yes**, because \(P(E) < 1\). Calculate the boost to \(H\) using Bayes:  
    \[
    P(H|E) = \frac{P(E|H) \cdot P(H)}{P(E)} \quad \text{where} \quad P(E) = 0.999.
    \]  
  - Assume \(P(E|H)\) is high (e.g., 0.8; biased coins favor heads).  
  - Then:  
    \[
    P(H|E) = \frac{0.8 \cdot 0.4}{0.999} \approx 0.32 \quad \text{(posterior)}.
    \]  
  - **Crucially**: Compare to the counterfactual \(P(H|\neg E)\):  
    \[
    P(H|\neg E) = \frac{P(\neg E|H) \cdot P(H)}{P(\neg E)} = \frac{0.2 \cdot 0.4}{0.001} = 80.
    \]  
    (This is illegal—probabilities can’t exceed 1! But formally, it shows \(H\) is *devastated* if \(E\) were false.)  
  - **Result**: \(E\) *does* confirm \(H\) because \(P(H|E) > P(H)\) would hold if \(P(E)\) were lower. The agent recognizes that if \(E\) were falsified (\(P(E) \approx 0\)), \(H\) would collapse. Thus, \(E\) is still providing support.  

  **No auxiliary repairs needed**:  
  - **No counterfactual credences**: No need to imagine "what \(P(H)\) would be if \(E\) were unknown." Confirmation is evident from the *current* impact of \(E\) on \(H\)’s resilience.  
  - **No re-parameterized likelihoods**: \(P(E|H)\) remains unchained from \(P(E)\).  
  - **No special rules**: Standard conditionalization applies.  

  ---

  ### **The Cost: What Orthodox Bayesianism Does Better**
  **Loss of certainty in "knowledge"**:  
  Orthodox Bayesianism cleanly models *indefeasible knowledge*: once \(E\) is learned, it stays certain. This supports:  
  - **Diachronic Dutch books**: Certain evidence guarantees you won’t bet against known facts.  
  - **Crisp learning models**: "Conditionalize when \(E\) becomes certain" is simple and unambiguous.  

  For the revisable-base agent, "knowledge" is messy. If \(P(E) = 0.999\), the agent might still accept a bet against \(E\) with 1000:1 odds. This clashes with the intuition that "knowledge" implies indefeasibility.  

  **Verdict: The trade is worth making**.  
  - **Why?** The problem of old evidence is catastrophic for orthodox Bayesianism—it renders historical evidence scientifically irrelevant. The revisable-base model fixes this while preserving Bayesian coherence.  
  - **Cost mitigation**: The agent can set \(P(E)\) arbitrarily close to 1 (e.g., 0.999…9), making bets against \(E\) practically negligible. Science already treats evidence as fallible (e.g., data recalibration).  
  - **Overall**: Sacrificing *rhetorical* clarity about "certain knowledge" is a small price for a framework where *all evidence* can dynamically support hypotheses.  

  ---

  ### **Summary**
  - **Reductio target**: The assumption \(P(E) = 1\) for known evidence creates the problem of old evidence—not conditionalization.  
  - **Solution**: Agents with revisable evidence bases (\(P(E) \approx 1\)) allow old evidence to confirm hypotheses naturally.  
  - **Cost**: Orthodox Bayesianism elegantly models indefeasible knowledge; revisable bases require embracing fallibilism.  
  - **Verdict**: Worth it. The revisable-base model better reflects scientific practice, where no evidence is sacred.
