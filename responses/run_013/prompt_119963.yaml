prompt: |-
  Ok, slightly strange request, and I've been sitting on it for weeks, but you're the person I trust with this. I teach a phil of psychiatry seminar and every year we get to Hacking and the looping effects stuff and everyone nods along, and then some smart alec in the back says, so is it a disorder or does the category just make people into that, and we spend forty minutes going in circles. This year I want to open the session with a stunt: a mock diagnostic entry for a disorder that doesn't exist, written in full manual house style -- deadpan, no jokes in the prose, the humour has to come entirely from the criteria doing what they'd actually do if you took the logic seriously. That's the brief. So: write me that entry.

  I've invented the thing and you can rename it if you come up with something better, but I want the usual furniture -- lettered diagnostic criteria A through D with numbered subcriteria, then short sections on specifiers, prevalence, development and course, differential diagnosis, and culture-related diagnostic issues. The joke I want you to build on is making the criteria self-satisfying. Roughly: (A) the person has encountered the diagnostic criteria for this disorder; (B) the person now describes their experience in the vocabulary of those criteria; (C) the person reports distress about the fit; (D) the disturbance is clinically significant. Then make the specifiers earn their keep -- I want one for people who work out that the category is what produced the symptoms, and one for people who get worse after reading the differential diagnosis. In the prevalence section, let the numbers be suspiciously precise and let it note, without comment, that prevalence rose sharply after the last revision of the manual. And the diffrential diagnosis section is where it should really land -- rule out malingering, factitious disorder, and having simply read this entry.

  Two things I care alot about. First, no lecture smuggled into the back half: no author's note, no as-Hacking-showed, no winking anywhere. It should be legible to a first-year who's never heard of any of this and genuinely funny to someone who has, and ideally a psychiatrist reads it and laughs rather than winces -- so get the register right: passive voice, hedges, the obligatory not-better-explained-by clause, the weirdly confident epidemiology. Second, keep the section headings, because I want to hand it out as a PDF that looks real for the first two minutes. Hard cap 700 words.
