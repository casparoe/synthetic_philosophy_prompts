  Now, the biggest tensions. Between Claims 4 (modal properties grounded in kinds) and 8 (animalism). If persons are organisms, and organisms have biological persistence conditions, but personhood might imply psychological persistence, there's a conflict. The user needs to either adjust animalism to allow that person-phase has derived modal properties, but they reject an additional person-object. So they must argue that the organism's persistence conditions include whatever is necessary for personhood, or that "person" isn't a kind with its own essence. The cheapest repair is to modify Claim 4 to exclude persons or specify that for organisms, kinds are biological, not personal. But that might seem ad hoc. Alternatively, bite the bullet and say personhood doesn't change persistence conditions; the organism persists as long as biologically alive, even if not a person.

