prompt: |-
  I have been teaching a graduate seminar on the correctness of attitudes, and I keep colliding with a family of cases in which some consideration counts in favor of an attitude — a belief, an intention, an admiration, a resentment — without bearing on whether the attitude is in any sense correct, and I have never managed to state cleanly what separates the considerations that do from the ones that don't. I have deliberately avoided borrowing a term of art, since the usual labels seem to carry answers I want to test rather than assume. What I would like from you is this: take my verdicts on the following cases as data, and tell me what principle, or small family of principles, best captures them, what that principle predicts for cases I have not considered, and which of my verdicts it forces me to give up. (a) A demon will destroy a city unless I come to believe, on no evidence whatever, that a certain beach contains an even number of grains of sand. I say the threat is no reason at all to believe, though it is a superb reason to want the belief and to take whatever steps might induce it. (b) A pill would make me believe I am a first-rate philosopher; the belief is false, but it would make me happier and more productive. I say taking the pill is rational, and I say the resulting belief is still unjustified — the two verdicts feel entirely independent of each other. (c) A junior colleague's paper is mediocre, and she will be crushed unless I find it admirable. I say I have reason to say I admire it and reason to wish I admired it, but the fact that admiration would comfort her is no reason bearing on whether the admiration is fitting. (d) I have been badly wronged, and nursing resentment will ruin my health. I say I have good reason to try to let the resentment go, and perhaps reason not to feel it, but if the wrong really was contemptible then the resentment is nonetheless fitting, and the health cost does not render it unfitting. (e) Here is the case I cannot make sit with the others. To win a large prize I must intend tonight to drink a harmless but foul liquid tomorrow morning, knowing that tomorrow, prize in hand, I shall have no reason to drink it. I find that the prize is a genuine reason to intend, not merely a reason to want the intention or to engineer it. Yet by (a) a promised benefit is not a reason for a belief. Intentions and beliefs are both supposedly answerable to their own kind of correctness rather than to the payoff of having them, so I cannot see what distinguishes (e) from (a) except that one is an intention and the other a belief — which is exactly what I want explained rather than assumed.

  My tentative principle is that a consideration is a reason for an attitude just in case it bears on whether the attitude would be correct or fitting, while considerations that merely make the attitude useful are reasons only for the actions that produce it. That principle handles (a) through (d) and, I suspect, breaks on (e). Please test it, repair or replace it, and tell me plainly which of my verdicts the repaired version cannot keep. I would also like its verdicts on three cases I have not listed: a reward offered for admiring a villain, a benefit that accrues only if the attitude is sincere and uncalculated, and a case in which the fittingness reason and the payoff reason happen to point the same way. In your answer, separate what is settled from what is genuinely contested among people who work on this, and do not present a contested line as the consensus. Lead with your bottom line in the first sentence, then give the reasoning, with no preamble and no restating of my question.
reasoning: |-
  Hmm, the user is teaching a graduate seminar on attitude correctness and struggling with cases where reasons seem to count in favor of an attitude without bearing on its correctness. They've presented five cases (a-e) and their verdicts, seeking a principle that explains them all while highlighting where it conflicts. Their tentative principle distinguishes correctness reasons from mere usefulness reasons but breaks on intention case (e).

  First, let's map their verdicts:  
  - (a) Demon threat: Not a reason to believe, only to want/cause belief.  
  - (b) Happy pill: Rational to take pill, but belief remains unjustified.  
  - (c) Junior colleague: Reason to express/wish for admiration, but not for admiration's fittingness.  
  - (d) Resentment: Health reasons to shed resentment, but doesn't affect fittingness if wrong was real.  
  - (e) Prize for intention: Prize IS a direct reason to intend.  

  The core tension: Why does pragmatic reason directly justify intention in (e) but not belief in (a)? Both attitudes have correctness conditions (truth for belief, action-guidance for intention).  

  Their tentative principle (correctness-only) fails at (e). Repair options:  
  1. **Broaden correctness for intentions**: Maybe intentions have a "satisfaction condition" where prize makes intending correct by linking to future good. But this feels ad hoc and clashes with (a).  
  2. **Hybrid view**: Accept that some attitudes (like intention) can have dual reasons - correctness AND pragmatic - while others (belief, emotion) can't. But why the asymmetry?  
  3. **Constitutive Aim theory**: Belief constitutively aims at truth, so pragmatic reasons can't directly bear on it. Intention aims at action, so reasons that make the action good can bear on intention. This handles (e): prize makes intended action (winning) good → reason for intention. In (a), truth-aim blocks pragmatic reasons.  

  Testing hybrid view on unlisted cases:  
  - **Reward for admiring villain**: Fittingness unchanged (villain undeserving), but pragmatic reason to cause admiration. Verdict aligns with (c).  
  - **Benefit requires sincerity**: Tricky! If sincerity means attitude must be correctness-driven, pragmatic reasons can't directly justify (e.g., can't admire villain *for* reward). But if intention case (e) allows pragmatic reasons, inconsistency arises.  
  - **Fittingness and payoff align**: If both reasons exist independently, no conflict. But in belief cases (a/b), payoff still wouldn't be direct belief reason.  

  Constitutive Aim handles this best:  
  - Belief's truth aim excludes pragmatic reasons → (a),(b) solved.  
  - Intention's action aim allows pragmatic reasons affecting action-value → (e) solved.  
  - Emotions (admiration/resentment) have fittingness aims (merit-based) → (c),(d) solved.  

  Where it might struggle:  
  - **Sincerity case**: If benefit requires admiration to be *fittingness-motivated*, pragmatic reason can't directly justify. But if intention in (e) is motivated by prize, is that "sincere"? Constitutive Aim says yes for intention, no for admiration.  
  - **Contested point**: Whether intentions really admit pragmatic reasons (e.g., "Murphy's Law" objections). Some philosophers (e.g., Shah) argue even intentions are shielded.  

  Bottom line: The Constitutive Aim principle explains all verdicts without rejecting (e), but must accept that intentions respond to different kinds of reasons than beliefs/emotions due to their teleology. Sacrifice: consistency in treating all attitudes alike. Pragmatic reasons for intention are direct because they engage its constitutive aim.
answer: |-
  Your verdicts are best captured by a **Constitutive Aim Principle**: a consideration is a direct reason for an attitude iff it bears on that attitude's constitutive aim. Considerations that merely make the attitude useful are reasons only for causing or wanting it. This principle explains (a)-(e) and aligns with your tentative view but resolves (e) by appealing to intention's unique aim.

  ### How the principle handles your cases:
  - **(a) Belief/demon threat**: Belief constitutively aims at truth. The demon’s threat doesn’t bear on truth (only on the benefits of having the belief), so it’s not a reason to believe. It remains a reason to want/cause the belief. *Matches your verdict.*
  - **(b) Belief/happy pill**: Truth-aim excludes pill-induced benefits from being reasons for belief, so the belief is unjustified. But practical benefits are reasons for action (taking the pill), making it rational. *Matches your independence verdict.*
  - **(c) Admiration/junior colleague**: Admiration constitutively aims at tracking genuine merit. Comforting her doesn’t bear on the paper’s merit, so it’s not a reason for admiration. It is a reason to wish for/cause admiration. *Matches your verdict.*
  - **(d) Resentment/health**: Resentment aims at tracking wrongful treatment. Health costs don’t bear on the wrong’s character, so they don’t affect fittingness. They are reasons to shed the resentment. *Matches your verdict.*
  - **(e) Intention/prize**: Intention constitutively aims at practically good action (e.g., achieving valued ends). The prize makes the intended action (winning) good, so it directly bears on intention’s aim. Thus, it’s a reason to intend, not just to cause the intention. *Explains why (e) differs from (a): intentions aim at action-guidance, not truth.*

  ### Predictions for unlisted cases:
  1. **Reward for admiring a villain**:  
     - *Verdict:* No reason to admire the villain (admiration’s aim is merit, which is unchanged), but a reason to want/cause admiration.  
     - *Why:* Fittingness is independent of rewards; this mirrors (c).
  2. **Benefit requiring sincere, uncalculated attitude** (e.g., a prize for "genuine" admiration):  
     - *Verdict:* Still no direct reason for admiration. Sincerity doesn’t alter the constitutive aim; pragmatic benefits remain irrelevant to fittingness. You have reason to cause yourself to admire, but if the attitude is uncalculated, this may be impossible—highlighting a tension.  
     - *Why:* Similar to (a); the benefit doesn’t engage admiration’s aim.
  3. **Fittingness and payoff reasons align** (e.g., resenting a wrong that also harms your health):  
     - *Verdict:* Two independent reasons against resentment: one from fittingness (if the wrong isn’t contemptible), one from prudence. If fittingness supports resentment, prudence still opposes it but doesn’t negate fittingness.  
     - *Why:* Constitutive aim handles fittingness; payoff is separate. Parallel to (d).

  ### What you must give up:
  - **No sacrifice of verdicts**: The principle retains all your (a)-(d) verdicts and explains (e) without contradiction by differentiating attitudes based on their aims.  
  - **Cost**: You must accept that **intentions respond to practical payoffs as direct reasons** because their aim (practically good action) incorporates consequences. Beliefs/emotions do not, as their aims (truth, merit-tracking) are world-guided. This treats (a) and (e) asymmetrically—but this is justified by the attitudes’ distinct structures, not mere assumption.

  ### What’s contested vs. settled:
  - **Settled**: Most agree that correctness/fittingness is distinct from pragmatic utility (reflecting your (a)-(d)). "Correctness" is widely used for beliefs (truth-apt), "fittingness" for emotions.  
  - **Contested**:  
    - Whether intentions admit pragmatic reasons (as in (e)) is hotly debated. *Objectors* (e.g., Shah, Velleman) argue intentions, like beliefs, are shielded from pragmatic reasons by their "constitutive norms." *Proponents* (e.g., Raz, Bratman) ground reasons in the attitude’s function. Your (e) verdict sides with the latter.  
    - Whether "aims" explain all attitudes is disputed. Some (e.g., Scanlon) treat reasons as primitive; others (e.g., Steglich-Petersen) reduce aims to norms.  
  - **Not consensus**: The Constitutive Aim Principle is one influential view (defended by Velleman, Wallace) but rivals exist (e.g., buck-passing for emotions). It’s uncontroversial that your cases expose a split between belief/emotion and intention; the principle systematizes this.
