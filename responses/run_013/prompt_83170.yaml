answer: |-
  I understand your frustration perfectly — it’s the familiar unease of seeing a specialized concept, nuanced and contested within its home discipline, smoothed into a universal axiom elsewhere. Let’s dissect that sentence, "only costly signals are honest," by walking through the ladder of interpretations it might bear, from the thinnest to the most ambitious, assessing each for truth and substance. I’ll then pinpoint what your seminar colleagues likely need for their conclusions and expose the hinges where doubt creeps in, even for me.

  Starting at the base, we have the **tautological reading**: 'Costly' here is defined purely functionally as *whatever expense is necessary and sufficient to render deception evolutionarily unprofitable or impossible*. On this reading, the sentence becomes true by definition: a signal is "honest" because its cost prevents cheating. It's empty of empirical content, offering no guide to *what* actually constitutes such a cost in the real world or *how* it works. It’s trivially true but philosophically inert; it cannot tell us why a peacock's tail works but a politician’s crocodile tears might not. This reading can't carry the weight your seminar places on the principle.

  Ascending to substance, we reach the **fitness cost thesis**: Honest signals require a *net reduction in the signaller's biological fitness* (survival and reproductive success). This cost is a real drain, not just an expenditure of energy or resources easily recouped. This is the bedrock of Zahavi's intuition and Grafen's models. It’s **substantive and defensible** within evolutionary biology *for the specific contexts it was developed to explain*, like sexual selection or predator deterrence. The cost acts as a barrier, making it unprofitable for low-quality individuals to fake the signal. However, its defensibility hinges critically on the *differential cost* assumption – that the same signal imposes a heavier burden on cheats than on the genuinely high-quality. If the cost falls equally on all, deception *can* persist, or the signal may not evolve at all. Evidence against this would be stable signalling systems where low-quality signallers bear no greater relative cost, or where honesty is maintained primarily by receiver retaliation or genetic linkage rather than upfront investment. My weak joint here is the leap from "defensible in specific models" to "universally necessary." Not all honest signals *need* this kind of cost; consider cryptic camouflage (honest about location, low cost) or signals enforced by punishment.

  This leads directly to the **differential cost/condition-dependent cost thesis**: The core of the handicap principle. Honesty is secured because the *marginal fitness cost* of producing the signal is higher for low-quality signallers than for high-quality ones. The peacock's tail is metabolically expensive, but a healthy, parasite-resistant peacock bears that cost more easily than a sickly one. This differential makes it impossible or unprofitable for low-quality individuals to produce the *same* signal magnitude effectively. This is the **substantive core** of the biological principle and its most defensible form. Grafen's formalization hinges on this. Its truth relies on the existence of this differential – if high-quality individuals *also* suffer prohibitively, the signal might not evolve, or if low-quality individuals can cheaply mimic, deception floods in. Evidence against it would be honest signals where no such differential cost exists (e.g., enforced by entirely different mechanisms like indexical constraints – where the signal is physically impossible to fake, like body size). My doubt here is practical: demonstrating the *precise* nature and magnitude of the differential cost in complex natural systems is often inferential and difficult, leaving room for alternative explanations.

  Now we enter the territory where the principle often gets stretched in popular discourse, the **cost guarantees honesty thesis**: This claims that *any sufficiently costly display or behaviour is necessarily an honest signal of some underlying quality*. This is **false**. Costliness alone doesn't guarantee honesty or even that the behaviour *is* a signal. Think of: 1) **Wasteful competition** (e.g., escalating fights over a disputed territory that cost both contestants dearly without signalling anything beyond escalating commitment). 2) **Mistakes or mismatches** (e.g., an animal expending huge energy on a display in the wrong context, seen by no receiver, or a human pursuing an expensive but useless degree – costly, but not necessarily signalling genuine ability effectively, and potentially deceptive if the institution is corrupt). 3) **Byproduct costs** (e.g., the massive energy drain of migration is costly and relates to fitness, but it's primarily a survival necessity, not primarily a *signal*). Cost can be correlated with many things besides hidden qualities intended for communication. The weak joint is obvious: correlation (cost and quality) isn't causation (cost evolved *as a guarantee* of honesty).

  Climbing higher, we find the **universal signalling thesis**: *Any expensive behaviour is, by virtue of its cost, functioning as a signal.* This is also **false**. Costly behaviours have many primary functions besides signalling: foraging, predator avoidance, thermoregulation, locomotion. The cost is a consequence of the activity's core function, not necessarily an investment in communication. A wading bird's long foraging flight is expensive, but it's primarily about getting food, not signalling foraging prowess to mates (though it *could* incidentally inform observers). Attributing signalling function requires evidence of design for communication and receiver response, not just expense. The seminar's leap from "costly" to "therefore a signal" commits this error.

  Finally, at the apex, lies the **institutional necessity thesis**: That the handicap principle *explains and dictates the necessary structure* of human institutions (education, religion, ritual) because they *must* function as costly signal filters. This is a **highly problematic overextension**. While costly signalling *can* be a useful lens to analyze *aspects* of human behaviour (e.g., conspicuous consumption, rigorous initiation rites), claiming it's the *necessary* or *primary* explanation ignores: 1) **Human intentionality and culture**: Signals can be arbitrary, conventional, and divorced from biological fitness costs (e.g., expensive art; costs can be social or monetary, not caloric or survival-based). 2) **Multiple functions**: Institutions like universities provide skills, knowledge, networking, and socialization, not just signals. Degrees can signal despite being cheap (if standards are trusted) or fail to signal despite being costly (if perceived as corrupt). 3) **Alternative mechanisms**: Trust in human societies is built on reputation, reciprocity, contracts, laws, norms, and punishment – mechanisms far beyond the scope of Zahavi's original insight. Applying the handicap principle here often involves metaphorical stretching of "cost" and "fitness" to the point of incoherence. Verdict: **False** as a necessary or universal explanation. Evidence against it is the sheer diversity of functional human institutions that don't neatly map onto differential biological cost structures.

  **So, which reading must your seminar be using?** To reach their sweeping conclusions – that a politician's humiliation, a fast, or a degree *must* be a trustworthy window to hidden quality *because* it is costly – they need something akin to the **cost guarantees honesty thesis** or the **universal signalling thesis**, possibly bolstered by a vague, uncritical borrowing of the **institutional necessity thesis**. They are taking the substantial but context-bound differential cost/condition-dependent cost thesis and inflating it into a universal guarantee. Crucially, **the readings they need are among the false ones** (cost guarantees honesty, universal signalling) or the untenably overextended one (institutional necessity). The defensible core (differential fitness cost securing honesty in specific evolutionary contexts) simply cannot support the weight of their general claims about human trustworthiness or the inherent meaning of any costly act.

  **Where is my reasoning most exposed?** It's the transition from the biological models to human behaviour. The models assume evolutionary forces shaping traits over generations for genetic fitness. Applying this directly to conscious, culturally mediated, symbolically rich human actions with complex individual motivations and institutional histories is fraught. My verdict against the institutional thesis rests heavily on this discontinuity. Someone deeply committed to evolutionary psychology might push back, arguing that ultimate biological explanations underpin proximate cultural forms. I find that often requires forcing the phenomena into the theory's box, ignoring the unique complexities of human cognition and culture. If compelling evidence emerged that costly rituals or credentials *universally* function *primarily* as Zahavian handicaps across diverse human societies, with other functions being negligible, I'd have to reconsider the strength of my rejection of the institutional thesis. But that evidence isn't there; human behaviour reveals far too many counterexamples where cost does *not* equal honest signalling. The weak joint, then, is the analogy itself – the map (handicap principle) is not the territory (human social complexity). Your suspicion is warranted; their use of the principle leans on a reading that is, biologically speaking, unsupported.
