prompt: |-
  Hi, so I don't have any kind of philosophy background, I just read alot and think about stuff on my own, so if I use a term wrong just roll with it.

  Heres the thing I keep chewing on. There's this worry that I think people call "cluelessness" about consequences. The idea is that whenever you do something to try to make the world better, the effects ripple out forever, and after a few steps they depend on so many things you can't possibly know that you have no idea whether your good deed actually made things better or worse in the end. Like, giving money to a charity might change some kid's life in a great way, but it might also set off some chain of events nobody could of predicted that ends in a war in eighty years. If that's right, then how is "do what has the best consequences" even a usable rule?

  I've been collecting the answers I've seen people give to this, plus a couple I came up with myself, and honestly I can't tell which ones are actually good and which are just words that make the worry go away. Here's my list:

  1. Just admit you can't know, and fall back on plain rules like don't lie, don't steal, keep your promises, help the person in front of you.
  2. Take your best guess at the odds of each outcome and multiply them out anyway, even when the guesses are basically made up.
  3. Draw a line around the near future and the people close to you and say only those consequences really count.
  4. Say the uncertainty is the same no matter which option you pick, so it cancels out, and you should just choose whatever looks best up close.
  5. Look for moves that seem good across alot of different ways the future could go, so you don't have to bet on any one of them happening.
  6. Say the whole mess shows that judging acts by their consequences is broken as a way of deciding anything.

  What I want is for you to sort these into tiers, from most convincing to least convincing, and say in a sentence why each one lands where it does. If two of them turn out to be the same idea wearing different clothes, point that out and tell me which one I should keep. I'm mostly trying to figure out which of these I could actually live with, so don't just say they all have problems — I already know that.

  Please write your answer as normal prose, like an email to a friend. No headings, no bullet points, no bold, no tables, just sentences and paragraphs. And American English please, I'm in the states.
