answer: |-
  Here’s a structured desiderata list for a theory of moral responsibility, designed to provoke critical engagement by starting with requirements rather than theories. I’ve organized it into core phenomena, essential distinctions, and philosophical demands — flagging tensions and parochial elements where they arise.

  ---

  ### **I. Core Phenomena & Cases a Theory Must Explain**  
  *(Non-negotiable for any minimally adequate theory)*  

  1. **Excuses vs. Exemptions**  
     - *Case:* **Coerced Theft** (excuse) vs. **Toddler Breaking a Vase** (exemption).  
     - *Requirement:* Explain why coercion/knowledge defects *mitigate blame within the responsibility framework*, while childhood/psychosis *removes the agent from the framework entirely*. Must ground this in features of the agent (e.g., capacity for norm-governed agency).  

  2. **Manipulation Cases**  
     - *Case:* **Brainwashed Assassin** (e.g., instantiated with false memories/desires via neurosurgery; meets current epistemic/control conditions).  
     - *Requirement:* Account for why a manipulated history *undermines responsibility* despite present "responsiveness." Tests whether history/autonomy matters independently of current psychology.  

  3. **Psychopathy/Severe Mental Illness**  
     - *Case:* **Psychopath Understanding Morality But Unmoved** (e.g., knowingly harms others with no affective resonance).  
     - *Requirement:* Explain why such agents are often *exempt* (not merely excused) without collapsing into skepticism. Must distinguish lack of moral capacity (exemption) from mere bad character (blameworthy).  

  4. **Proportional Blame & "Petty" Wrongs**  
     - *Case:* **Forgotten Birthday** (minor neglect with no ill intent, but technically blameworthy).  
     - *Requirement:* Explain why blame can be *apt but inappropriate to express* in trivial cases. Tests the theory’s resources for distinguishing *blameworthiness* from *blame-practices*.  

  ---

  ### **II. Essential Distinctions a Theory Must Preserve**  
  *(Collapsing these is a fatal flaw)*  

  5. **Responsible vs. Held Responsible vs. Blameworthy**  
     - *Responsible:* Having the *capacity* for responsibility (e.g., adult in normal circumstances).  
     - *Held Responsible:* Social act of attributing responsibility (e.g., blaming someone).  
     - *Blameworthy:* *Meriting* blame due to culpable wrongdoing.  
     - *Requirement:* A theory must not conflate metaphysical capacity with social practices or normative status.  

  6. **Participant vs. Objective Attitudes** (Strawson)  
     - *Case:* Treating a friend’s insult with resentment (participant) vs. treating a dementia patient’s insult with clinical detachment (objective).  
     - *Requirement:* Explain the *rational shift* between these attitudes — why exemptions warrant the objective stance.  

  7. **Agency-Grounded vs. Practice-Grounded Responsibility**  
     - *Requirement:* Must clarify whether responsibility is *primarily a fact about agents* (e.g., control, reasons-responsiveness) or *constituted by our practices* (e.g., Strawsonian attitudes). A theory can lean either way but must address the tension.  

  ---

  ### **III. Contested/Parochial Desiderata**  
  *(Important but theory-dependent; inclusion risks bias)*  

  8. **Moral Luck**  
     - *Case:* **Reckless Driver A** (kills a pedestrian) vs. **Reckless Driver B** (kills no one).  
     - *Parochial Status:* Central for *outcome-based* theories (e.g., Nagel) but often rejected by *control-based* theories (e.g., Zimmerman). Flag as optional: a theory can *deny* moral luck but must explain why outcomes seem to affect blame.  

  9. **"Practice-Grounded" Requirement**  
     - *Parochial Status:* Strawsonians demand that responsibility *must* be analyzed via reactive attitudes/practices. *Opposing View:* This risks conflating what we *do* with what *justifies* it (e.g., psychopaths might trigger reactive attitudes illegitimately).  

  ---

  ### **IV. The Central Tension: Where Desiderata Conflict**  
  **The Incompatible Pair:**  
  - **Demand A (Agency-Grounded):** Responsibility must be grounded in *agent-internal facts* (e.g., reasons-responsiveness, control mechanisms).  
  - **Demand B (Practice-Grounded):** Responsibility *just is* the aptness of reactive attitudes within a community (Strawson).  

  **Why They Conflict:**  
  - Agency-focused theories (e.g., Fischer & Ravizza) struggle to explain why *practices* are essential (Demand B). If responsibility is about psychological mechanisms, why do attitudes matter beyond epistemology?  
  - Practice-focused theories (e.g., Strawsonians) struggle with manipulation cases (Demand 2). If an agent *now* fits participant attitudes, why does history matter? This risks making responsibility *too practice-dependent*.  
  - **Result:** No theory fully satisfies both. *Reasons-responsiveness* theorists bite the bullet on practices; *Strawsonians* bite the bullet on history. Scanlonians (see below) reframe the problem but don’t resolve it.  

  ---

  ### **V. Quick Scorecard on Major Approaches**  
  - **Strawsonians:** Excels at distinctions (5–7) and exemptions (1,3). Struggles with manipulation (2) and agency-grounding (Tension A/B).  
  - **Reasons-Responsiveness** (Fischer, Wallace): Explains excuses (1), manipulation (2), and agency-grounding. Struggles with psychopathy (3) and petty blame (4), often over-intellectualizing.  
  - **Scanlonian Contractualists:** Blame as impaired relations (solves 4,7). Reduces exemptions to "meaning impairment" — risks making responsibility too relational (problems with 2,3).  

  ---

  ### **Key Takeaways for Your Seminar**  
  1. **Non-Negotiables:** Phenomena 1–4 and distinctions 5–7 are the baseline. A theory failing here is inadequate.  
  2. **The Pinch Point:** The agency/practice tension (Demands A/B) is where theories fracture. Highlight this to show why "starting from requirements" reveals deeper problems than textbook surveys.  
  3. **Productive Inconsistency:** The list *is* internally strained (especially A/B + manipulation + exemptions). This isn’t a flaw — it explains why the debate remains live.  

  This framework forces students to evaluate theories *against problems* rather than chronology. The handout practically writes itself: present this list, then dissect theories by how many boxes they tick (and which they abandon). Let me know if you want case details fleshed out!
