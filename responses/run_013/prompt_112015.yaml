prompt: |-
  My mother has advanced dementia, and for the past year my brother and I have been arguing about the house. She still has good days. On one of them, unprompted, she told me she did not want it sold. My brother's reply — and I have since heard the same move from my sister about the funeral and from my aunt about her letters — is that this is not what she really wants. What she really wants, he says, is what she would have wanted back when she could still see the whole situation clearly; and that woman, he is confident, would sell, because selling is the sensible thing and our mother was always a sensible woman. What interests me is not who is right but the shape of the move. The person being consulted is a version of my mother improved along certain lines — better informed, steadier, less frightened, able to hold the whole picture in view at once — while her values are left exactly as they were, so that the improvement is supposed to stand neutral between my brother and me. And yet in every actual use of it I have witnessed, the improved woman turns out to want precisely what the person invoking her wants, and there is no way to check, because she never says anything her own advocate has not already said on her behalf. When I try the same trick on myself it behaves the same way: the me who has thought it all through agrees with whatever I already lean toward, only more calmly. The oddity is sharpest where the two of us agree completely about the facts — we both know what the money would do, and for whom — so the appeal to her being better informed cannot be doing the work it is asked to do, since better information settles questions about what is the case and this is a disagreement about what matters.

  I suspect I am looking at a general move rather than a family failing, and I would like to know whether it has a name. I am aware of something in law and medicine about deciding for people who cannot decide for themselves, but as I understand it that applies precisely where the person cannot speak at all, whereas here she does speak and is overruled by an appeal to the woman she would be if she could think straight. I have a vague sense that political philosophers do something similar when they justify arrangements by what people would agree to under improved conditions, and that economists and philosophers of welfare have a related notion about preferences a person would have if fully informed — but I cannot tell whether either of those is the same thing, or whether the thing I am describing is a distinct and nameless variant of them.

  So: if there is an established term for this move, tell me what it is. I will not be satisfied with the bare label. I want the carving — what exactly the move is, how it relates to the nearest established concepts and where it parts company with each of them, why the improvement is made along some dimensions of a person and not others, and whether the resulting verdict can ever have authority over the actual person's expressed wish. Give me the boundary cases: does the move become legitimate when the person is wholly unable to speak, or when the improvement is confined to information alone, or when the person herself has previously endorsed the improved version? If nothing established fits, say so plainly and coin a term, define it, and tell me which of the cases I have described fall inside it and which fall outside.
reasoning: |-
  Okay, the user describes a situation where family members override their mother's expressed wishes due to her advanced dementia by appealing to what a hypothetical "improved" version of her would want. They're noticing a pattern where this "improved self" conveniently aligns with the advocate's desires. The user isn't asking who's right but wants to understand the underlying logical move and whether it has a name.

  First, I need to identify the core move: substituting a person's actual expressed preference with a hypothetical, idealized version of themselves—enhanced in rationality, information, etc.—while claiming neutrality. The user points out that this move consistently favors the advocate's position, making it suspect.

  The user mentions related concepts like hypothetical consent in political philosophy (Rawls' veil of ignorance) and fully informed preferences in welfare economics. But those differ because they're used for impartial justification in policy or idealized decision-making, not overriding current expressed wishes. The key distinction here is the override of actual current capacity to express a preference, even if imperfectly.

  I recall that in medical ethics, substituted judgment involves deciding based on what the incapacitated person would've wanted, but that's for when they can't communicate at all. Here, the mother can express wishes on good days, so this move is more like a "counterfactual override"—invoking a hypothetical competent self to dismiss actual statements.

  The user's deeper need seems to be validation of their skepticism about this move's legitimacy and a framework to challenge it. They might also seek arguments to use in family disputes or to assuage guilt about honoring their mother's actual wishes.

  Exploring boundary cases: When is this move valid? If the person is completely unable to speak, substituted judgment applies. If only information is added, it's more defensible but still risks bias. If the person previously endorsed the improved version (like a living will), that carries weight. But in the described case, none apply—the mother's current wish is clear, and no prior directive supports selling.

  Since no exact term exists, I'll define "Competent Counterfactual Override" (CCO). Characteristics: it selectively enhances capacities (rationality, not values), claims neutrality but tends to align with the advocate, and overrides current expressions. It fits all the user's examples: the house, funeral, letters.

  The user needs reassurance that their intuition about this move's circularity and bias is sound. Highlighting that CCO lacks authority over actual wishes unless certain conditions are met (like prior directives) could empower them in family discussions.
answer: |-
  The phenomenon you describe is both philosophically profound and practically treacherous. It lacks a single established name because it straddles several domains, but its core structure and flaws are identifiable. Let's carve it precisely:

  **The Core Move: "Competent Counterfactual Override" (CCO)**

  *   **Definition:** The act of overriding a person's (P) currently expressed preference or decision (E) by appealing to the preference or decision that a hypothetical, improved version of P (P+) *would* make, where P+ possesses enhanced cognitive capacities (e.g., full information, rationality, calmness, foresight) *but* retains P's original core values and character traits. The key claim is that P+ represents P's "true" or "authentic" will, superior to E due to P's current impairments.

  *   **The Shape of the Move (As You Observed):**
      1.  **Actual Expression (E):** P expresses a preference/decision (e.g., "Don't sell the house").
      2.  **Impairment Invoked:** The advocate (A) acknowledges P's current cognitive limitations (dementia, fear, lack of information, inability to grasp the whole picture).
      3.  **Counterfactual Construction (P+):** A constructs a hypothetical version of P (P+), improved *specifically* along the dimensions deemed impaired in (2). P+ is "P but unimpaired" – better informed, calmer, more rational, more foresightful, etc. Crucially, A claims P+ shares P's *fundamental values* ("sensible," frugal, family-oriented).
      4.  **Attribution of Preference to P+:** A attributes a specific preference/decision (E+) to P+ (e.g., "Sell the house").
      5.  **Override:** A concludes that E+ represents P's "true" will and overrides E in favor of E+.
      6.  **Circularity & Bias:** Invariably, E+ aligns perfectly with A's own preference. P+ functions as a ventriloquist's dummy for A.

  **Relationships to Established Concepts (and Departures):**

  1.  **Substituted Judgment (Law/Medicine):**
      *   **Concept:** Making decisions for an incapacitated person based *solely* on what that specific person *themselves* would have chosen if competent, inferred from their *known prior values, beliefs, and expressed wishes* (e.g., living wills, past conversations).
      *   **Relation:** CCO superficially resembles substituted judgment in aiming to respect P's hypothetical competent will.
      *   **Departure:** *Crucially*, substituted judgment relies *empirically* on P's *actual past expressions and documented values* to infer their likely choice. CCO, however, constructs P+ *counterfactually* based on A's *interpretation* of P's character ("sensible") and *assumptions* about what that character *logically implies* in the current situation, often *ignoring or overriding P's current expression (E)*. Substituted judgment applies when P *cannot* communicate *at all*; CCO is used *despite* P communicating E. Substituted judgment seeks P's *own* choice; CCO often imposes A's choice *via* P+.

  2.  **Hypothetical Consent (Political Philosophy - e.g., Rawls):**
      *   **Concept:** Justifying social/political arrangements by asking what people *would* agree to under fair, idealized conditions (e.g., a "veil of ignorance" hiding personal circumstances), assuming rational self-interest.
      *   **Relation:** Both use a counterfactual agent (P+ / parties behind the veil) to determine a "better" outcome. Both aim for neutrality/impartiality.
      *   **Departure:** Hypothetical consent is a justificatory tool for *impersonal rules or institutions* affecting a collective. Its "improved conditions" are designed *specifically for impartiality* (veil of ignorance), stripping away *all* specific knowledge that could bias self-interest. CCO is used for *personal, specific decisions* for *one individual*. Its "improvements" are selective (only cognitive enhancements, values fixed) and lack the rigorous mechanism for impartiality. Most importantly, hypothetical consent doesn't *override* an actual person's *expressed current wish*; it justifies rules *to* which people *might* hypothetically consent.

  3.  **Ideal Advisor/Informed Preference Theories (Welfare Economics/Philosophy):**
      *   **Concept:** Determining a person's "true" welfare or preference by considering what they *would* prefer if they were fully informed, rational, and free from cognitive biases or distortions (e.g., addiction, temporary passions).
      *   **Relation:** This is the *closest* established concept. Both construct P+ (the fully informed, rational self) to determine the "authentic" preference.
      *   **Departure:**
          *   **Scope of Improvement:** Ideal advisor theories often struggle with *which* values to "correct" (e.g., adaptive preferences). CCO explicitly *fixes* P's core values ("sensible woman") and *only* enhances cognitive capacities. This selective "improvement" is key to its claimed neutrality.
          *   **Override Function:** While ideal advisor theories aim to discover a person's *own* best interest, CCO is *used operationally* to *override* their current, expressed wish (E), even when P retains *some* capacity to express it. The ideal advisor is generally invoked when the *actual* preference is clearly distorted or misinformed; CCO is used even when E is coherent and based on understood facts, as you noted ("this is a disagreement about what matters").
          *   **Bias & Verification:** Ideal advisor theories grapple with how to *objectively* determine what P+ would choose, independent of the advocate's bias. CCO, as you astutely observe, utterly fails this: P+ *always* agrees with A, and P+ has no independent voice ("no way to check"). The lack of a method to access P+ independently of A's construction is a fatal flaw.

  **Why Select Cognitive Enhancements, Not Values?**
  The claim of neutrality rests on this. Altering P's values would make P+ a *different person*, clearly imposing A's values. Enhancing *only* cognition (information, rationality, calm) while fixing values supposedly allows P+ to apply P's *own* values *better* to the situation. This is the purported mechanism for respecting P's autonomy. However, as you see, the selection of *which* cognitive capacities to enhance (foresight? emotional detachment?) and the *interpretation* of what those fixed values *imply* in the current context are highly vulnerable to A's bias.

  **Authority over Actual Expressed Wish (E)?**
  Does P+'s verdict (E+) have authority over E? **Generally, No, in the context you describe.**

  1.  **P's Current Capacity is Key:** If P retains *any* meaningful capacity to express a coherent preference based on their *current* understanding and values, E holds significant weight. Respect for autonomy prioritizes the *actual person's* current expression, however impaired, over a hypothetical construct, especially one as manipulable as P+.
  2.  **CCO's Fatal Flaws:** Its inherent circularity (P+ always agrees with A), lack of independent verification, and susceptibility to bias in constructing P+ and attributing E+ to it completely undermine any claim of authority P+ might have *over E*.
  3.  **Exceptions/Boundary Cases:**
      *   **Wholly Unable to Speak:** When P is *completely* incapacitated and *cannot* express *any* preference (E is absent), substituted judgment *based on prior known wishes and values* becomes necessary and legitimate. CCO *morphs into* substituted judgment in this scenario, but ideally grounded in *evidence* of P's past self, not pure conjecture about a "sensible" person. **Inside.**
      *   **Improvement Confined to Information Alone:** If the *only* enhancement is providing missing *factual* information (e.g., "Mom, if we sell, the proceeds could fully fund X nursing home you liked, not just cover Y years here"), and P *then* changes their mind to E+, this isn't really CCO. It's simply informed consent. E+ becomes P's *new actual* expressed wish after receiving facts. **Outside.** True CCO overrides E *despite* P understanding the facts but valuing different outcomes.
      *   **Person Previously Endorsed P+:** If P, while clearly competent, explicitly stated something like, "If I ever get dementia and say I don't want the house sold, ignore me and sell it because that's the sensible thing," *then* following that prior directive overrides the current E. This is a form of *Ulysses Contract* or *advance directive*. Here, the authority comes from P's *own past authentic instruction*, not from A's construction of P+. CCO claims authority *without* such prior endorsement. **Outside** (unless such a directive exists).
      *   **Clear, Documented Prior Values Contradicting E:** If P had *repeatedly, consistently, and recently* (before significant decline) expressed values or made decisions that *directly contradict* E (e.g., constantly worrying about finances, insisting on practicality), *and* E seems wildly out of character *and* incoherent, *then* giving *some* weight to the implications of those prior values over the current impaired E becomes more defensible. This edges towards substituted judgment. However, it *still* requires strong evidence of P's *own* past will, not just A's assertion of what a "sensible" P+ would do. **Borderline/Case Specific.** Pure CCO lacks this evidentiary grounding.

  **Conclusion: A Distinct and Problematic Variant**

  You are correct. The "move" you describe – **Competent Counterfactual Override (CCO)** – is a distinct, nameless (until now) variant. It borrows elements from informed preference theories and substituted judgment but crucially differs:

  1.  **Operational Override:** It is used to actively *override* a currently expressed wish (E).
  2.  **Selective Counterfactual Construction:** It constructs P+ with selectively enhanced cognition *only*, claiming value-neutrality.
  3.  **Inherent Circularity & Bias:** P+ invariably echoes A's preference, with no independent access or verification.
  4.  **Lack of Prior Authorization:** It lacks the grounding in P's *own* documented prior wishes or directives that legitimate substituted judgment or advance directives.

  **Instances Falling Inside CCO:**

  *   Your brother overriding your mother's "don't sell" wish based on the "sensible" P+.
  *   Your sister overriding potential funeral wishes (expressed or anticipated) based on what P+ would want.
  *   Your aunt overriding wishes about letters based on P+.
  *   Your self-experiment where your "thought it through" self agrees with your leaning.

  **Instances Falling Outside CCO:**

  *   Making a decision for your mother when she is *utterly* non-communicative, based *only* on her documented past values and wishes (Substituted Judgment).
  *   Your mother changing her mind *after* being given *new factual information* she lacked before (Informed Consent).
  *   Following your mother's *written advance directive* made while competent, instructing you to sell the house if she has dementia (Advance Directive/Ulysses Contract).

  CCO is a seductive but deeply flawed rhetorical and justificatory tool. It masks the advocate's imposition of their own preference behind a veneer of neutrality and respect for the impaired person's "true self." Its authority over the actual expressed wish of a person with *some* remaining capacity is, as your experience shows, highly suspect and ethically precarious. Recognizing it as "Competent Counterfactual Override" names the beast and exposes its mechanisms.
