prompt: |-
  I am a novelist, and between drafts of a novel set in the 1840s I have written a short essay — part author's note, part argument — on how practices like dueling and slaveholding actually ended, and I would like your comments before I send it out.

  The thesis: moral argument did very little of the work. Both practices were argued against for a century without any visible effect on conduct, and what changed was not conviction but the price of contempt. Every such practice is held up by an economy of contempt — who is entitled to look down on whom, and for what — and it ends when contempt is redirected from those who refuse the practice onto those who keep it. A corollary I want to press: contempt aimed at the act leaves the practice standing, since the practitioner can always plead exception or necessity; only contempt aimed at the sort of person who does it moves anyone. On this account abolition succeeded where slaveholding became a mark of coarseness rather than mastery, and dueling died in England while the statutes against it sat unenforced — the last fatal duel on English soil, at Priest Hill in 1852, was fought not by Englishmen but by two French exiles who had carried their quarrel and their code over with them, which suggests the English stopped believing before they stopped legislating, and that those still dueling were the ones with no English reputation left to spend. That is the other half of the thesis, and the part I trust least: I claim that revolutions run fastest where the old practitioners can convert their standing into a new currency — the planter into a man of commerce, the duelist into a man of business — and stall where no conversion is available, so that the same arguments fail in one place and succeed in another.

  What I want from you is pressure, not encouragement. Is this a mechanism or a redescription — have I said more than that norms change once enough people stop minding? Is it genuinely distinct from the honor-centered accounts of dueling's decline (Appiah's, for instance) and the interest-centered accounts of abolition (the Williams line), or have I merely re-labelled one of them? Does the conversion claim do independent work, or is it decoration any story could accommodate? And give me the strongest counterexample you can: a practice that ended with no revaluation of contempt, or a contempt redirected while the practice survived. Then tell me which paragraph you would cut as the weakest, and why. I do not want a reading list; I want to know where the argument breaks.
reasoning: |-
  Okay, the user is a novelist working on a short essay about how practices like dueling and slaveholding ended. They propose that moral arguments were ineffective; instead, the key was a shift in the "economy of contempt." Essentially, practices end when contempt shifts from those who refuse the practice to those who uphold it. They're seeking critical feedback, not encouragement, and want to know where their argument might break down.

  First, I need to understand their core thesis. They argue that moral arguments didn't work; it was about redirecting contempt. Contempt aimed at the person, not the act, drives change. Also, practitioners need to convert their social standing into a new form. The examples given are dueling in England ending because it became seen as coarse, and slaveholders becoming men of commerce.

  The user's explicit requests are: pressure testing the mechanism, checking if it's distinct from existing theories (Appiah on honor, Williams on economic interests), evaluating the conversion claim, providing counterexamples, and identifying the weakest paragraph.

  Breaking down their argument: Step one is redirecting contempt—shaming the practitioner personally. Step two is status conversion—allowing elites to transition without losing standing. They mention dueling's decline in England versus other places, and abolition succeeding where planters could become businessmen.

  Now, where might this argument be weak? First, distinguishing it from existing theories. Appiah links dueling's decline to sincerity in moral beliefs, which overlaps with contempt as a social signal. The user's view is more about social cost than sincerity. For Williams, economic interests are primary. The user's contempt economy might be a parallel system, not a replacement, but they need to clarify that.

  The conversion claim: Does it do independent work? In dueling, the English gentry shifted to business/colonial roles, maintaining status. In abolition, some planters became capitalists. But was this conversion necessary? In temperance, the working class didn't convert status; they were shamed into compliance without gaining new standing. That's a counterexample—contempt redirected without conversion, yet the practice declined among certain groups. Also, in footbinding, external pressure and nationalism played roles, conversion might not have been key.

  Counterexamples: Footbinding ended with state intervention and nationalism, not just contempt revaluation. Temperance saw contempt shift to drinkers, but without status conversion for the poor. Also, dueling persisted in places like Germany without conversion options? Need to check that. Another point: abolition in the UK involved economic factors; the shift in contempt might have been simultaneous, not causal.

  The weakest paragraph: Probably the one claiming conversion is necessary. The temperance counterexample shows contempt can work without conversion, especially when backed by law or targeting marginalized groups. The user might overstate the conversion part.

  So, recommendations: Clarify the mechanism vs. redescription. Admit overlap with Appiah but emphasize social enforcement. Address how economic factors interact with contempt. Acknowledge counterexamples where conversion wasn't necessary. Cut or revise the conversion paragraph to avoid overclaiming.
answer: |-
  Here's the pressure test you requested, line by line:

  **1. Mechanism vs. Redescription:**  
  Your core argument risks being a potent redescription rather than a novel mechanism. "Norms change once enough people stop minding" *is* essentially what you describe. The "economy of contempt" framework is vivid and useful, but its unique mechanism hinges on **the specific redirection of contempt *onto the practitioner personally*** ("the *sort of person* who does it"). *This* is your distinct contribution – shifting social sanction from the *act* (which allows excuses) to the *actor's character* (which is harder to evade). It moves beyond "minding" to *who is socially punished and for what identity*. Strengthen this distinction explicitly.

  **2. Distinction from Appiah (Honor) & Williams (Interest):**  
  *   **Appiah (Honor):** Your view *complements* rather than replaces honor-centered accounts. Appiah argues dueling declined when sincerity became paramount, making the honor code *internally* unsustainable. You argue it declined when violating the code (by *not* dueling) ceased to be dishonorable *because the duelist himself became contemptible*. Your focus is on the *external social enforcement mechanism* (contempt) changing target, while Appiah focuses on the *internal logic* of the honor system collapsing. They are symbiotic, not opposed. Your framework explains *how* the external pressure shifted to make Appiah's internal crisis matter socially. **Verdict: Distinct lens on the *social enforcement* side, overlapping with the outcome.**
  *   **Williams (Interest):** This is a harder sell. Williams (and successors) argue abolition succeeded in the British Empire when slavery became *economically disadvantageous* to powerful metropolitan interests. Your "contempt economy" feels secondary here. Did contempt shift *because* of economic interests (planters seen as backward/inefficient), or did the shift enable the economic transition? Your conversion claim (planter to businessman) *presupposes* the economic shift Williams highlights. You haven't shown contempt *drove* the change independently of material interest; it may have been the *cultural lubricant* for an economically driven transition. **Verdict: Your framework risks being epiphenomenal to economic explanations unless you can show contempt *preceded* and *facilitated* the economic shift independently.**

  **3. The Conversion Claim: Does it do independent work?**  
  This is the shakiest part. Does conversion *enable* the shift, or is it merely a *description* of what happens to successful adapters?
  *   **Weakness:** It sounds plausible for elites (planter -> merchant, duelist -> businessman). But is it *necessary*? What about practices ending among non-elites where "conversion" isn't an option (e.g., declining superstitions among peasants)? Or cases where the "old practitioners" are simply shamed into compliance *without* gaining new status (e.g., public drunkenness)?
  *   **Stronger Framing:** Rephrase it as **"Exit Ramps for Elites."** The key insight is that durable norm shifts often require *pathways for high-status adherents to abandon the practice *without suffering catastrophic status loss***. Where no such pathway exists (e.g., a code defining manhood solely by dueling), resistance is fiercer. Conversion isn't magic; it's about offering a socially acceptable "way out" with preserved dignity/standing. This explains *differential speed* of change across contexts better than claiming conversion drives the change itself. It addresses *elite resistance*, not the entire mechanism.

  **4. Strongest Counterexamples:**  
  *   **Footbinding in China:** Ended rapidly (~1 generation) primarily due to *state-led nationalist modernization campaigns* and *anti-colonial shame* ("backward practice" making China weak), combined with *new laws* and *organized activism*. While contempt was redirected (bound feet became shameful, unbound modern), the driving forces were top-down state power, nationalist ideology, and organized reform groups – not primarily a spontaneous shift in the "contempt economy." The *speed* and primary drivers challenge your model.
  *   **Temperance/Prohibition (Partial):** While drinking declined significantly in some periods (e.g., early 19th C US), the shift involved intense *moral/religious argument* (evangelicalism), *organized political action* (WCTU, Anti-Saloon League), and *legal coercion* (Prohibition). Contempt for drunkards existed before, during, and after. While contempt was weaponized ("drunken lout"), the practice's decline (where it happened) relied heavily on organized moral/political movements *using* contempt, not the spontaneous shift you describe. Prohibition also failed spectacularly, showing contempt + law isn't always sufficient.
  *   **Dueling's Persistence:** While dying in England, dueling thrived elsewhere (e.g., Germany, American South) *well after* it was widely condemned morally and legally. Why no redirection of contempt *there*? Your model needs to explain this variation. Was the "conversion" pathway absent? Was the social structure (e.g., rigid aristocracy) too resistant? Or did the "honor group" simply remain powerful enough to *define* contempt internally?

  **5. Weakest Paragraph:**  
  **Cut the paragraph containing: "...revolutions run fastest where the old practitioners can convert their standing into a new currency... and stall where no conversion is available..."**

  *   **Why:** This is where your argument is most vulnerable to being "decoration" or an overreach. As argued above (Point 3), the "conversion" claim isn't sufficiently distinct as a *driver* and risks circularity (successful changers converted, those who didn't... didn't change). It blurs the focus from your core, more robust mechanism – the *redirection of contempt onto the practitioner's identity*. The Priest Hill anecdote powerfully illustrates the *effect* of changed contempt (French exiles with no English reputation to lose), making the subsequent conversion claim feel tacked on and less essential to that specific example. Removing this strengthens the essay by focusing on your genuinely distinct insight about contempt targeting the *person*, not just the act.

  **Summary & Recommendations:**

  *   **Strength:** Your core insight – **that practices end when social contempt shifts from *refusers* to *practitioners* based on their *character/identity*** – is powerful, distinct from purely moral or interest-based explanations, and offers a valuable social enforcement lens (especially vs. Appiah).
  *   **Weakness:** The "conversion" claim needs significant reframing ("exit ramps for elites") or cutting. The distinction from economic drivers (Williams) needs sharper articulation (is contempt the driver or the companion?).
  *   **Action:** 
      1.  **Explicitly state** the unique mechanism: Contempt must target the *practitioner's identity/social type*, not just the act, to be effective.
      2.  **Reframe or cut** the "conversion" paragraph as suggested. Use the Priest Hill example solely to illustrate the changed *contempt economy* rendering the practice socially unsustainable for those embedded in it.
      3.  **Acknowledge the interplay:** Briefly concede that economic shifts (Williams) or internal honor code crises (Appiah) often *create the conditions* where the redirection of contempt can gain traction and become decisive. Your mechanism operates powerfully *within* these contexts.
      4.  **Address variation:** Briefly note that the *speed* and *completeness* of the shift depends on factors like elite exit ramps and social structure, without overburdening the core thesis.
      5.  **Sharpen the corollary:** Hammer home that targeting the *practitioner* is key. Contrast it explicitly with moral arguments targeting the *act* (which allow for excuses).

  Your argument doesn't "break," but it needs tightening to ensure its most original and robust element – the **personalized social sanction** – stands clearly apart from related theories and avoids the overextension of the conversion claim. It's a compelling and useful framework for understanding norm change.
