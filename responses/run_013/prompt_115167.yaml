  Okay, the user wants me to act as a philosopher of social science with expertise in game theory and normative ethics. They're an economist working on game theory and mechanism design, asking about whether everyday conventions like tipping or queueing are moral obligations that visitors must follow. They want this debate restated using specific game theory concepts: coordination games, multiple equilibria, equilibrium selection, correlated equilibrium, common knowledge, empirical vs normative expectations, punishment and metanorms, incomplete information, and the contrast between Nash equilibrium versus deontic constraint. Then they want a "residue report" showing what translates cleanly, what requires distortion, and what can't be expressed at all in game-theoretic terms.

  I need to approach this carefully. First, I'll outline the main philosophical positions on conventions as moral obligations. The conventionalist view sees these practices as coordination solutions without inherent morality - they're morally neutral patterns we follow to avoid chaos. The moral particularist view argues that once established, conventions generate local obligations through fairness or promise-like commitments. The cosmopolitan view claims there are universal moral rules that override or judge local conventions. And the practice positivist view sees obligations as entirely internal to social practices.

  Now for the game-theoretic translation: Conventions map well to coordination games with multiple equilibria. The current practice is the selected equilibrium. Normative expectations relate to correlated equilibrium where people condition behavior on shared signals. Common knowledge is crucial - everyone knows the rule, knows others know it, etc. Punishment and metanorms explain norm enforcement. Incomplete information deals with visitors unaware of local rules.

  But the residue - what doesn't translate - is where things get interesting. The distinct moral "ought" can't be reduced to equilibrium selection. Moral obligations have a categorical force that Nash equilibria lack - we feel bound even when unobserved. The source of normativity is problematic - game theory shows how norms function, not why we should feel obligated. Fairness arguments exceed game theory's scope. And the insider/outsider distinction creates tension - why should visitors comply before internalizing the norm?

  This residue reveals limitations in both frameworks. Game theory excels at describing how norms work but not their moral force. The philosophical debate sometimes conflates descriptive and normative claims. The key insight is that coordination efficiency explains the convention's existence, but moral obligation requires additional philosophical justification - they're related but distinct layers.
answer: |-
  Here's a systematic translation of the "conventions as moral obligations" debate into your specified game-theoretic vocabulary, followed by a residue report highlighting the conceptual gaps.

  **Brainstormed Main Philosophical Positions:**
  1.  **Conventionalism (Humean):** Conventions are solutions to coordination problems. Obligation stems *only* from the utility of coordination and the expectation of reciprocity. No inherent morality.
  2.  **Moral Particularism (Contractualist/Promissory):** Once established, a convention creates localized moral obligations based on fairness (not exploiting others' compliance), implicit consent, or a quasi-promissory force ("playing by the rules" of the society you're in).
  3.  **Cosmopolitanism:** Local conventions are morally binding *only if* they align with universal moral principles (e.g., fairness, non-exploitation). Visitors have no obligation to follow arbitrary or unjust local norms.
  4.  **Practice Positivism:** Obligation is *defined* by the social practice itself. "Ought" means "is required by the local rule," full stop. Morality is internal to the practice.

  **Translation into Game-Theoretic Vocabulary:**

  1.  **Conventions as Coordination Games & Multiple Equilibria:**
      *   **Clean Translation:** Tipping percentages, queueing order, jaywalking thresholds are pure coordination games. Multiple stable behavioral patterns (equilibria) are possible (e.g., tipping 15% vs. 20%, orderly queueing vs. scrum, jaywalking only at crossings vs. anywhere clear). No single equilibrium is inherently superior in payoff structure alone; the specific value is arbitrary.
      *   **Equilibrium Selection:** The prevailing local convention *is* the selected equilibrium. Selection occurs through history, focal points, or social learning.

  2.  **Correlated Equilibrium & Common Knowledge:**
      *   **Clean Translation:** The convention functions as a publicly known correlation device. Actors condition their behavior (tip amount, queue position) on the commonly known "signal" (the local norm). Common knowledge (CKn) of the norm is essential: I know the norm, I know you know it, I know you know I know it, etc. This allows actors to confidently coordinate on the *same* equilibrium.

  3.  **Empirical vs. Normative Expectations:**
      *   **Clean Translation:**
          *   *Empirical Expectation (EE):* "I expect (predict) most people here tip 20% / queue orderly / rarely jaywalk mid-block." Based on observation.
          *   *Normative Expectation (NE):* "I expect (believe people think they *should*) tip 20% / queue orderly / avoid jaywalking here." Beliefs about others' attitudes.
      *   **Essential for Stability:** A convention is robust when EE and NE align and are high. EE tells me what others *will* do; NE tells me others *expect* me to do it (and may sanction deviation).

  4.  **Punishment & Metanorms:**
      *   **Clean Translation:** Sanctions (disapproval, social exclusion, fines for jaywalking) sustain the convention by altering payoffs for deviation. This transforms the coordination game into an *assurance* game or adds punishment dimensions.
      *   **Metanorms:** Sanctions apply not just to norm violation (jaywalking) but also to the *failure to sanction* violators ("Why didn't you say something to that queue-jumper?"). This stabilizes the enforcement mechanism itself.

  5.  **Incomplete Information & The Visitor:**
      *   **Clean Translation:** The visitor faces incomplete information about the local equilibrium (tipping rate? queue strictness? jaywalking tolerance?). They may lack CKn – unsure if locals know *they* know the norm. Uncertainty about the strength/alignment of EE and NE (Do people *really* care? Will they sanction *me*?).
      *   **Visitor's Choice Problem:** Updating beliefs (learning the norm), assessing risk of sanction/reputational damage, potential payoff from "free-riding" if EE/NE are weak (e.g., not tipping where enforcement is lax).

  6.  **Nash Equilibrium vs. Deontic Constraint:**
      *   **Clean Translation (Nash):** Following the convention is a Nash Equilibrium (NEq). Given that (almost) everyone else follows it *and* expects/sanctions compliance, my best response is to follow it too. Deviation yields lower expected utility (risk of sanction, coordination failure, disapproval).
      *   **Contrast with Deontic Constraint:** A deontic constraint ("You *ought* to do X") claims binding force *independent* of the strategic payoffs or sanctions in the current interaction. It claims X is right/wrong *in itself* or because of a prior commitment/fairness principle.

  **Residue Report: The Untranslatable Core**

  The translation captures the *structure* and *function* of conventions brilliantly, but stumbles on the core *moral* element of the debate. Here's the residue:

  1.  **The Distinctively Moral "Ought" vs. Equilibrium Selection/Sanction Avoidance:**
      *   **Residue:** The philosophical debate centers on whether "You *ought* to follow the local convention" means merely (a) "It's the selected equilibrium and deviation lowers your utility (via sanction or coordination failure)" or (b) "You have a genuine moral duty, irrespective of immediate consequences or sanctions, perhaps based on fairness, respect, or implicit promises."
      *   **Distortion if Forced:** Reducing (b) to (a) *is* the distortion. Game theory perfectly explains *why* people follow conventions (NEq, sanctions) and why it's often *prudent* for visitors to comply (incomplete info, risk). It cannot *establish* that (b) is true. Calling the NEq a "moral obligation" within GT is just relabeling, not translating the normative force.
      *   **Exposed Deficit (GT):** GT vocabulary lacks the conceptual resources for intrinsic normativity, categorical imperatives, or non-instrumental reasons for action. It can model *sanctioned* "oughts" but not genuinely *moral* oughts. It conflates motivation (avoiding sanction) with justification (moral rightness).

  2.  **The Source of Normativity:**
      *   **Residue:** *Why* do people feel normative expectations? *Why* do they sanction? GT shows *how* NE sustains equilibrium, but not the origin of the *belief* that others *should* comply. Is this belief merely a psychological correlate of the NEq, or a genuinely normative judgment?
      *   **Distortion if Forced:** Attributing NE solely to past learning or fear of metanorms reduces normativity to behavioral regularity and strategic fear. This may accurately describe some cases but ignores the potential internalization of norms as genuinely *right*.
      *   **Exposed Ambiguity (Debate):** The philosophical debate often glosses over the complex origins of normative force. GT exposes that appeals to "obligation" might just be appeals to stable expectations and sanctions, lacking deeper moral foundation.

  3.  **Fairness as More Than Payoff Symmetry:**
      *   **Residue:** The "moral particularist" argument often hinges on *fairness*: "It's unfair to benefit from others' compliance without complying yourself." GT can model symmetric payoffs in coordination and the incentive to reciprocate ("I comply if you comply").
      *   **Distortion:** However, the moral concept of fairness often implies a *duty* to reciprocate even if one could get away with non-compliance *without sanction* (e.g., discreetly under-tipping where detection is impossible). GT struggles with this "duty beyond deterrence."
      *   **Exposed Deficit (GT):** GT captures conditional reciprocity well ("Tit-for-Tat") but struggles with unconditional fairness motives that operate even outside the shadow of the future or sanctions.

  4.  **The Visitor's Obligation: Common Knowledge vs. Moral Recognition:**
      *   **Residue:** Is the visitor's obligation triggered solely by achieving CKn of the local norm (i.e., learning the rules and knowing they are known)? Or does it require some form of *moral recognition* or *acceptance* of the norm's legitimacy or the fairness claim?
      *   **Distortion if Forced:** Reducing the obligation to CKn + sanction risk ignores the question: "Even if I *know* this is the rule and know I'll be frowned upon, *why should I care* morally (beyond prudence) if I think the rule is silly or arbitrary?" GT answers the prudential "should" perfectly. The moral "should" remains.
      *   **Exposed Ambiguity (Debate):** Proponents of a visitor's obligation often imply that mere presence or benefit creates the duty, but GT highlights that the mechanism (CKn, sanctions) is purely strategic. Opponents might argue recognizing the convention's *coordination function* is sufficient for a weak obligation (efficiency), but GT itself doesn't establish this efficiency as *moral*.

  **Conclusion:**

  *   **Clean Translation:** The game-theoretic framework excels at describing conventions *as* coordination equilibria, the role of common knowledge, the dynamics of empirical/normative expectations, the mechanics of punishment/metapunishment, the strategic problem of the visitor (incomplete info), and the contrast between strategic stability (NEq) and non-strategic constraint.
  *   **Translation with Distortion:** Attempting to translate the distinctively *moral* "ought" as merely "the selected equilibrium" or "the strategy avoiding sanctions" fundamentally distorts the philosophical claim. Fairness arguments can be partially modeled but lose their unconditional moral character. The origin of normative expectations is reduced to strategic or psychological factors.
  *   **Untranslatable Residue:** The core residue is **intrinsic moral normativity** – the idea that one *ought* to follow a convention *because it is the right thing to do*, even absent sanctions, strategic advantage, or personal preference, potentially based on fairness, respect, or implicit commitment. This concept cannot be expressed within the purely descriptive, strategic, and payoff-based vocabulary of game theory.
  *   **What the Residue Reveals:**
      *   **GT Deficit:** Game theory, as a positive/descriptive framework, lacks the tools for genuine normative ethics. It explains *behavior* and *strategic rationality* superbly but cannot ground *moral obligation*. It exposes that much apparent normativity might be strategic.
      *   **Debate Ambiguity:** The residue exposes that philosophical arguments for conventional moral obligations often rely on unexamined assumptions about the automatic moral force of social practices ("practice positivism") or conflate prudence (avoiding sanction) with morality. The GT translation forces clarity: *Is the obligation claimed strategic or categorical?* If categorical, GT cannot capture it.

  The interesting residue lies precisely in this gap: Game theory provides a powerful lens to see *how* conventions work and why compliance is often rational, but it starkly reveals that establishing a genuinely *moral* obligation requires stepping outside the strategic framework into the domain of normative ethics proper, appealing to principles (fairness, consent, respect) that GT can describe the *effects* of, but not validate as *sources* of obligation. The visitor's "obligation" is prudentially compelling once the local equilibrium is known, but its *moral* force remains an open philosophical question GT cannot settle.
