  You are a philosopher of social science with genuine expertise in both game theory and normative ethics. Think carefully, and start by brainstorming the main positions before you write. I am an economist who works on game theory and mechanism design. I want the debate over whether everyday conventions -- tipping, queueing, jaywalking, and similar local practices -- are moral obligations, and whether visitors must follow the local versions, restated as faithfully as possible in my vocabulary: coordination games, multiple equilibria and equilibrium selection, correlated equilibrium, common knowledge, empirical versus normative expectations, punishment and metanorms, incomplete information, and the contrast between a Nash equilibrium and a deontic constraint. Then give me the residue report. What translates cleanly? What translates only with distortion? What cannot be expressed at all -- for instance, is the distinctively moral ought anything more than an equilibrium-selection device or a social sanction, and is the visitor's obligation best understood as a problem of common knowledge, fairness, or something else? Keep the translation honest: do not smuggle in game-theoretic assumptions and call them translation. Treat the residue as the interesting part, and say whether it exposes a defect in the game-theoretic vocabulary or a place where the original debate was less clear than it looked.
