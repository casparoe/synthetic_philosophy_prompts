prompt: |-
  I'm a novelist. I keep hearing that if your preferences aren't coherent—if they cycle, or violate independence, or flip when the same option is described as a loss instead of a gain—then you can be money-pumped or Dutch-booked, and there's no utility function that represents you as maximizing anything. I know character, motivation, plot, arc, revision; I dont know the math side. Restate that coherence argument for expected utility maximization as faithfully as you can in my vocabulary, then give me the residue report: what translates cleanly, what only translates with distortion, and what has no counterpart at all. Is the residue because my craft vocabulary is missing something real, or because the argument is thinner than it sounds? One paragraph, max 250 words.
reasoning: |-
  Okay, the user is a novelist who's heard about coherence in preferences but isn't familiar with the math. They want the argument restated in their vocabulary and a residue report. 

  First, I need to translate expected utility concepts into storytelling terms. "Preferences" become "character desires," "money-pumping" turns into "manipulation traps," and "utility function" transforms into "consistent motivations." The Dutch book analogy works well as "losing bets no matter what happens."

  For the residue report: The math concepts of transitivity and independence map cleanly to character consistency. The money pump example translates vividly as a three-scene manipulation trap. But the precise probability weighting in "description invariance" has no direct equivalent—novelists handle framing effects through unreliable narrators or perspective shifts, not mathematical axioms. 

  The untranslatable part isn't missing craft vocabulary; it's the difference between artistic ambiguity and decision theory's demand for total consistency. Characters can rationally violate axioms for thematic reasons (e.g., tragic flaws), but the math assumes perfect rationality. This gap exposes the argument's thinness when applied to fiction—human inconsistency is the writer's playground, not a flaw to fix.

  I'll structure this as: 1) Translation using narrative terms 2) Residue analysis highlighting what fits (transitivity/traps), what distorts (independence as "unchanging desires"), and what's absent (probability math) 3) Conclusion that the residue reflects artistic freedom vs. theoretical rigidity.
answer: |-
  Here's the coherence argument in your terms, followed by the residue report:

  **Translation:** If your character's desires loop (choosing A over B, B over C, but C over A), flip based on how choices are framed (loss vs. gain), or change when identical options are presented differently, they become predictable and manipulable. A clever antagonist (or the universe itself) can construct a sequence of offers ("scenes") exploiting these inconsistencies, forcing your character to endlessly trade resources (money, time, status) downward with no escape, like a plot trap snapping shut. This means there's no *single*, stable internal drive ("core motivation") consistently guiding their choices across all situations – their actions can't be explained as maximizing one coherent want.

  **Residue Report:**
  *   **Clean Translate:** Preference loops → Desire cycles; Money-pumping → Predictable manipulation trap draining resources; No utility function → No single core motivation explaining all choices.
  *   **Distorted Translate:** "Independence" → Roughly "unchanging desires when irrelevant details change," but the math is precise about *how* irrelevant details are added. "Description invariance" → Framing effects, but the math demands total immunity, unlike nuanced character irrationality.
  *   **No Counterpart:** The *precise mathematical definition* of "coherent" preferences (axioms like transitivity, independence). Your craft vocabulary *has* equivalents for the *consequences* (predictable manipulation, thematic inconsistency), not the abstract logical structure itself. This isn't missing craft depth; it highlights the argument's narrow focus on formal, consequence-free consistency. Real characters (and people) *do* violate these axioms for emotional, contextual, or thematic reasons – the math identifies a specific *type* of vulnerability, not a universal flaw. The "thinner" aspect is that it ignores *why* inconsistency might exist (depth, trauma, growth) and only cares about exploitability.
