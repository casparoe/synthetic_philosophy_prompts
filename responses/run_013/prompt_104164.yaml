prompt: |-
  I'm a graduate student splitting my time between philosophy of science and an interpretability research group, and I keep deferring the front section of a paper I'm writing: a specification of what a theory of representation in neural networks would actually have to deliver before I'm willing to treat the claim "this model represents X" as something with a truth value rather than a useful façon de parler. Before I read more papers that each quietly assume a different answer to that, I want the desiderata on the table, not another survey. Please act as a philosopher of science and cognitive scientist with a working knowledge of mechanistic interpretability, think carefully, brainstorm the relevant phenomena first, and then compress your thinking into a requirements list rather than padding it with a literature tour.

  The deliverable is the list: each requirement a theory of neural representation must satisfy to count as adequate, stated with the consideration or case that motivates it, and marked as either non-negotiable given my purpose (a theory good enough to guide interpretability work and to underwrite a safety audit that wants to say the model represents a goal it never expresses) or merely a preference of one camp. Anchor the list in the cases I keep colliding with, so the requirements earn their place: a linear probe decodes a property from a layer with near-perfect accuracy, yet ablating or steering along the probe direction leaves behaviour untouched, while a direction found by activation patching causally moves behaviour yet no probe recovers it cleanly; a single unit responds to many unrelated inputs, and a sparse autoencoder re-describes the same layer as many near-monosemantic features without changing the network's function at all; adding a steering vector makes the model produce more of a concept but also shifts behaviour it shouldn't; two networks with near-identical internal geometry, by a standard similarity metric, behave differently, and two networks that behave identically have quite different geometry; the same concept is decodable from different directions across seeds and layers even though behaviour is stable; and a feature that is plainly used in one task is inert in another.

  The requirements must force the theory to confront, at minimum: the difference between information merely being present and something being represented; whether content is fixed by correlation, by causal role in the computation, or by the theorist's decoding procedure; how the theory accommodates distributed and superposed representations without turning "a representation" into a fiction; whether representations must be able to misrepresent; whether representation is a two-place or a three-place relation (network, content, and interpreter or downstream consumer); and what role the network's task or context plays in fixing content. If some subset of the requirements cannot be jointly satisfied, say so explicitly and say what has to give; I suspect the causal-role requirement and the misrepresentation requirement pull apart, and that any requirement demanding stable, context-free content collides with what the probing results show. Finally, briefly score the main families of view against the list (representation as decodable information, as causal or structural role, as task-relative posit, and as recovered sparse feature), but keep that part short — the criteria are the deliverable, and I'll do the full scoring myself.
reasoning: |-
  We are constructing a list of desiderata for a theory of representation in neural networks. The goal is to have a clear set of requirements that such a theory must meet to be considered adequate for guiding interpretability work and for underwriting safety audits (especially in cases where the model might represent a goal that is never expressed). The requirements are motivated by specific phenomena and must address key philosophical issues.

  Key phenomena to anchor the requirements (from the user's description):

  1. **Probing without causal effect**: A linear probe decodes a property with high accuracy, but ablating or steering along that direction does not change behavior.
  2. **Causal without probing**: A direction found by activation patching causally affects behavior, but no probe recovers it cleanly.
  3. **Polysemantic units**: A single unit responds to many unrelated inputs.
  4. **Sparse autoencoder re-description**: A sparse autoencoder decomposes a layer into near-monosemantic features without changing the network's function.
  5. **Steering side effects**: Adding a steering vector increases the production of a concept but also shifts behavior in unintended ways.
  6. **Geometry vs. behavior**: Networks with similar internal geometry (by standard metrics) behave differently, and networks with identical behavior have different internal geometries.
  7. **Representational drift**: The same concept is decodable from different directions across seeds and layers, even though behavior is stable.
  8. **Context-dependent feature use**: A feature that is used in one task is inert in another.

  Key philosophical issues to confront:

  - Difference between information being present and being represented.
  - What fixes content: correlation, causal role, or decoding procedure?
  - How to handle distributed and superposed representations without making "representation" fictional.
  - Must representations be able to misrepresent?
  - Is representation a two-place (network, content) or three-place (network, content, consumer) relation?
  - Role of task and context in fixing content.

  We will now list the requirements. Each requirement will be stated with:
  - The requirement itself.
  - The motivating phenomenon or consideration.
  - Whether it is non-negotiable (for the user's purpose) or a preference of one camp.

  Finally, we will briefly note if some requirements are in tension and then score the main families of views.

  **List of Requirements for a Theory of Neural Representation**

  1. **Non-Negotiable: Causal Relevance Requirement**  
     *Requirement*: The theory must distinguish representations by their causal role in the network's computations that lead to behavior, not merely by the presence of information.  
     *Motivation*: Phenomenon (1) and (2) show that decodability does not imply causal relevance, and causal relevance can exist without clean decodability. For safety audits (e.g., detecting unexpressed goals), we need representations that play a causal role in the model's decision-making.

  2. **Non-Negotiable: Context Sensitivity Requirement**  
     *Requirement*: The theory must account for how the representational content of an activation pattern can depend on the context (e.g., task, input, or state of the network).  
     *Motivation*: Phenomenon (8) (context-dependent feature use) and (5) (steering side effects) show that the same activation can have different functional roles in different contexts. Also, (7) (representational drift) suggests that the same content can be realized in different ways depending on context (like the training seed). For interpretability, we must not assume fixed, context-free content.

  3. **Non-Negotiable: Distributed Representation Requirement**  
     *Requirement*: The theory must accommodate distributed and superposed representations without reducing them to a set of monadic (i.e., non-overlapping) features.  
     *Motivation*: Phenomenon (3) (polysemantic units) and (4) (sparse autoencoder re-description) demonstrate that the same underlying computation can be described at multiple levels of granularity (e.g., at the unit level or at a decomposed feature level). The theory should not privilege one description as the "true" representation but should allow for multiple valid descriptions that capture different aspects of the distributed representation.

  4. **Preference: Misrepresentation Requirement**  
     *Requirement*: The theory should allow for the possibility of misrepresentation (i.e., the network represents something that is not the case).  
     *Motivation*: Philosophical considerations about the nature of representation: without the possibility of error, it is hard to distinguish representation from mere causal covariance. However, note that for some interpretability purposes (e.g., explaining successful behavior), misrepresentation might be less critical. Marked as a preference because while it is important for a full theory of content, it might be negotiable for some practical interpretability work. But note: for safety audits (e.g., if the model represents a harmful goal that does not match reality), misrepresentation is crucial.

  5. **Non-Negotiable: Consumer-Relative Requirement**  
     *Requirement*: The theory must treat representation as a three-place relation: between the representation bearer (e.g., an activation pattern), the content, and a consumer (i.e., a downstream computational process that uses the representation).  
     *Motivation*: Phenomenon (2) (causal without probing) and (5) (steering side effects) highlight that the same activation pattern might be used by different downstream processes for different purposes. Also, (8) (context-dependent use) suggests that the consumer's role is essential. This requirement helps explain why the same activation can have multiple contents (if consumed by different processes) and why content is fixed by how it is used, not just by how it is generated.

  6. **Non-Negotiable: Task-Relativity Requirement**  
     *Requirement*: The theory must account for how the content of a representation is fixed (at least in part) by the task the network is performing.  
     *Motivation*: Phenomenon (8) (context-dependent feature use) and the need to understand the role of the network's training and objectives. For safety audits, we care about representations that are relevant to the model's objectives and potential goal representations.

  7. **Non-Negotiable: Multiple Realization Requirement**  
     *Requirement*: The theory must allow that the same representational content can be realized by different activation patterns (or in different directions) across networks, layers, or training runs.  
     *Motivation*: Phenomenon (6) (geometry vs. behavior) and (7) (representational drift). Networks with identical behavior can have different internal geometries, and the same concept can be decoded from different directions. This is crucial for generalization across models.

  8. **Non-Negotiable: Abstraction Level Requirement**  
     *Requirement*: The theory must be explicit about the level of abstraction at which representations are identified (e.g., individual units, directions in activation space, or patterns across multiple units).  
     *Motivation*: Phenomenon (4) (sparse autoencoder re-description) shows that we can change the level of description (from units to features) without changing the network's function. The theory must not arbitrarily privilege one level.

  **Tensions Between Requirements**:

  - **Causal Relevance vs. Misrepresentation**: The causal role of a representation is tied to its actual computational effects. However, misrepresentation requires that the representation can be tokened in a way that does not correspond to the state of the world. One way to resolve this is by having a teleosemantic component (tying content to the function for which the mechanism was selected, i.e., training) that allows for error when the mechanism is triggered in non-normal conditions. But note: the training process might not specify a unique function.

  - **Context Sensitivity vs. Stable Content**: The requirement for context sensitivity (2) may seem to conflict with the idea of stable content. However, the theory must account for both: content can be stable in certain contexts but not in others. The tension is managed by the consumer-relative and task-relative requirements.

  **Brief Scoring of Main Views**:

  - **Decodable Information (e.g., linear probing, information theory)**:
    - Fails: Causal Relevance (1), Consumer-Relative (5), and Context Sensitivity (2) because it focuses on correlation, not use.
    - Passes: Distributed Representation (3) if we allow distributed codes, and Multiple Realization (7) because decoding can be done from many directions.

  - **Causal/Structural Role (e.g., functional role semantics)**:
    - Fails: Context Sensitivity (2) if the role is fixed, and Distributed Representation (3) if it requires discrete roles. Also, may struggle with Multiple Realization (7) because the same causal role might be implemented differently, but the theory might not account for that.
    - Passes: Causal Relevance (1) and possibly Consumer-Relative (5) if the consumer is part of the causal structure.

  - **Task-Relative Posit (e.g., pragmatic or instrumentalist views)**:
    - Fails: Causal Relevance (1) because it may ignore whether the representation is actually used. Also, may not satisfy Misrepresentation (4) because content is assigned by the theorist.
    - Passes: Context Sensitivity (2), Task-Relativity (6), and Abstraction Level (8) because it allows flexible assignment.

  - **Sparse Features (e.g., via sparse autoencoders)**:
    - Fails: Context Sensitivity (2) because features are assumed to be context-independent, and Consumer-Relative (5) because it does not specify the consumer. Also, may not account for Distributed Representation (3) if it assumes features are atomic.
    - Passes: Abstraction Level (8) by design, and may pass Causal Relevance (1) if the features are causally relevant (but note: they are re-described and may not be the actual mechanism).

  **Conclusion**: The non-negotiable requirements (1-3, 5-8) are essential for a theory that can guide interpretability and safety audits. The preference (4) for misrepresentation is important for a full theory of content but might be harder to satisfy. The causal role and consumer-relative requirements are central, and the theory must be grounded in the actual computational processes of the network.
answer: |-
  Below is a requirements list for a theory of neural representation, grounded in the phenomena you described and designed to address the philosophical issues you raised. Each requirement is stated concisely, followed by the **motivating phenomenon or case** and a designation as **non-negotiable** (essential for interpretability/safety audits) or **preference** (reflects a theoretical camp). Tensions between requirements are explicitly flagged, and a brief scoring of existing approaches is provided. The list compresses the core desiderata without padding.

  ---

  ### **Requirements for a Theory of Neural Representation**  
  *(Non-negotiable requirements are critical for guiding interpretability work and safety audits; preferences reflect philosophical ideals that may not be universally shared.)*

  1. **Causal Efficacy Requirement**  
     *The theory must require that a representation plays a causal role in the network’s behavior.*  
     **Motivation**: Linear probes decode properties but leave behavior unchanged when ablated (Phenomenon 1), while activation patching causally alters behavior even without clean decoding (Phenomenon 2). Distinguishes *correlational information* from *functional representation*.  
     **Status**: **Non-negotiable** (essential for safety audits: unexpressed goals must have downstream causal power).

  2. **Consumer-Relative Requirement**  
     *The theory must treat representation as a three-place relation: (activations, content, downstream computational consumer).*  
     **Motivation**: Steering vectors shift behavior in unintended ways (Phenomenon 5), and features are used in one task but inert in another (Phenomenon 8). Content depends on *how downstream layers use activations*, not just their statistical properties.  
     **Status**: **Non-negotiable** (avoids "content without use"; critical for context dependence).

  3. **Context-Relativity Requirement**  
     *The theory must allow content to vary with task, input, or network state.*  
     **Motivation**: Features active in one task are inert in another (Phenomenon 8), and steering vectors have side effects (Phenomenon 5). Content is not fixed solely by intrinsic properties of activations.  
     **Status**: **Non-negotiable** (required to explain real-world model behavior; stable "core" content is empirically unsupported).

  4. **Multiple Realizability Requirement**  
     *The theory must permit identical content to be realized by different activation patterns across layers, seeds, or architectures.*  
     **Motivation**: Identical behavior with different internal geometries (Phenomenon 6), and decodable concepts from different directions across seeds/layers (Phenomenon 7). Content is invariant under changes in implementation.  
     **Status**: **Non-negotiable** (necessary for generalization in interpretability across models).

  5. **Non-Fictionality Requirement**  
     *The theory must not reduce distributed/superposed representations to artifacts of the observer’s decomposition method.*  
     **Motivation**: Sparse autoencoders decompose polysemantic units into "near-monosemantic" features without changing network function (Phenomenon 4). Distributed representations are real computational elements, not observer fictions.  
     **Status**: **Non-negotiable** (prevents theory from being unfalsifiable; aligns with mechanistic evidence).

  6. **Misrepresentation Capability Requirement**  
     *The theory should allow representations to misrepresent (e.g., be tokened in error).*  
     **Motivation**: Safety-relevant cases (e.g., model represents a harmful goal that doesn’t exist). Philosophical necessity for robust content ascription.  
     **Status**: **Preference** (camps disagree; functionalist theories often support this, causal-informational may not).

  7. **Abstraction-Agnosticism Requirement**  
     *The theory must not privilege a specific level of abstraction (e.g., units, directions, circuits) for defining representations.*  
     **Motivation**: Sparse autoencoders redescribe layers without functional change (Phenomenon 4), and causal directions evade linear probes (Phenomenon 2). No "ground truth" granularity exists.  
     **Status**: **Non-negotiable** (interpretability tools must be adaptable; reality is multi-scale).

  ---

  ### **Key Tensions Between Requirements**  
  - **Causal Efficacy vs. Misrepresentation**: Causal theories tie content tightly to actual computational role, making misrepresentation hard to define (e.g., if a "false" representation causes appropriate behavior, is it false?). *Resolution likely requires teleosemantics* (content as function under optimization) or consumer-based error detection.  
  - **Context-Relativity vs. Stable Content**: Context sensitivity (Requirement 3) conflicts with desires for stable, observer-independent content. *Tension unresolvable—embrace context-relativity*: Phenomenon 7 (drift) and 8 (task-dependence) show content is inherently unstable.  
  - **Consumer-Relative vs. Decodability**: If content depends on consumers (Requirement 2), linear probes (observer-centric) may not align with "true" content. *Accept that decodability is insufficient* (Phenomenon 1).

  ---

  ### **Brief Scoring of Major Approaches**  
  *(Against non-negotiable requirements; misrepresentation omitted as preference.)*  

  | **Theory Family**             | **Causal Efficacy** | **Consumer-Relative** | **Context-Relativity** | **Multiple Realizability** | **Non-Fictionality** | **Abstraction-Agnosticism** |  
  |-------------------------------|---------------------|------------------------|------------------------|----------------------------|----------------------|-----------------------------|  
  | **Decodable Information**     | ✗ (Fails Phenom 1)  | ✗ (Ignores consumers) | △ (Content fixed)      | ✓ (Any correlate works)    | ✗ (Fictionalizes)    | ✗ (Privileges probes)        |  
  | **Causal/Structural Role**    | ✓ (Core strength)   | △ (Often two-place)    | ✗ (Fixed role)         | ✗ (Role tied to structure) | ✓ (Real patterns)    | △ (Circuit-focused)          |  
  | **Task-Relative Posit**       | ✗ (Pragmatic, not causal) | ✗ (Observer-centric) | ✓ (Built-in)           | ✓ (Task defines content)   | △ (Risk of fiction)  | ✓ (Flexible)                |  
  | **Recovered Sparse Features** | △ (If causal)       | ✗ (No consumer)        | ✗ (Static features)    | ✗ (Tied to SAE basis)      | ✓ (Explicit goal)    | ✗ (Privileges SAEs)          |  

  **Key**: ✓ = Satisfies, △ = Partially, ✗ = Fails.  
  **Summary**: No theory fully satisfies non-negotiables. **Causal-role theories** (e.g., computational neuroscience-style) excel at causal efficacy but fail context-relativity and multiple realizability. **Consumer-based theories** (e.g., Millikan-inspired) best handle context and misrepresentation but need mechanisms to avoid circularity. **Task-relative views** sacrifice causal grounding.  

  ---

  ### **Recommendations for Your Theory**  
  - **Anchor in consumers**: Downstream layers determine content (Requirement 2), resolving causal efficacy vs. information debates.  
  - **Embrace context**: Reject stable content (Phenomenon 7–8); use consumer-state to define context (e.g., "feature X represents *Y for consumer Z in context C*").  
  - **Accept tensions**: Drop misrepresentation if needed; prioritize causal efficacy for safety. Use optimization history (e.g., training) to ground teleosemantic content where possible.  

  This list forces confrontation with your cases and philosophical issues. The non-negotiables exclude popular but insufficient approaches (e.g., pure decodability) and steer toward a consumer-coupled causal theory.
