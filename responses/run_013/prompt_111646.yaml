prompt: |-
  ok so I've been down a causation-by-omission rabbit hole again and I want a tier list out of you, but with a twist.

  Quick setup in case it's been a while: we say the gardener caused the plants to die by not watering them, and we say the parent caused the drowning by not watching, but we don't say that you caused the drowning just because you also didn't jump in, even though your not-jumping is exactly as counterfactually relevant as the parent's not-watching. Every theory has to pay somewhere for that asymmetry, and I want to know where each one pays.

  My twist is a test I've been calling the swap test, and I want you to rank the approaches below by how well they pass it, best to worst, tier-list style, with one line on why each lands where it does.

  The swap test: find a case where A omits to do X and something bad happens. Now construct a second case with the same physical goings-on and the same counterfactual profile, where the very same physical behavior of A counts as a doing rather than an omission -- the only thing that changed is which slice of the world we're treating as A's contribution and which slice we're treating as the fixed background. A good theory should either return the same causal verdict in both cases, or give a principled, non-question-begging reason why the verdict flips. A theory that gets the verdict it wants by quietly re-describing which case is which fails.

  The approaches:

  1. Omissions are causes in exactly the same sense actions are; the only real question is causal selection -- which of the many difference-makers we single out -- and selection runs on norms.
  2. Omissions are causes, but only when the counterfactual dependence is of a special kind: difference-making relative to a salient default or contrast, not just any old counterfactual dependence.
  3. Omissions aren't causes at all; "caused by omission" is loose talk for an explanation that cites a norm violation, not a causal relation.
  4. Omissions are causes only when the omitted act was something the agent was under a duty or expectation to do, so the normativity is baked into causal status itself rather than just into which cause we pick out.
  5. Omissions are quasi-causal: they earn their place in causal explanations via a distinct relation -- something like enabling or disabling -- rather than the causal relation proper.

  Two extra asks: flag any of these that you think collapse into each other once you push on them, and tell me straight whether my swap test is even coherent, cause I half suspect its rigged -- it might just presuppose that the verdict shouldn't flip, which is the whole thing in dispute.
reasoning: |-
  Okay, the user is deep into causation by omission and has this swap test idea. They want me to rank five philosophical approaches based on how well each handles the swap test. The swap test is tricky because it demands that a theory either gives the same causal verdict in two physically identical cases where only the framing of omission vs. action changes, or provides a principled reason for the flip. 

  First, I need to unpack each approach quickly. Approach 1 says omissions are causes just like actions, and norms only affect which cause we pick. Approach 2 says omissions are causes but only with special counterfactuals tied to defaults. Approach 3 claims omissions aren't real causes at all—it's just norm-talk. Approach 4 ties causal status to duties, baking norms into causation itself. Approach 5 treats omissions as quasi-causal via relations like enabling.

  Now, the swap test challenge: Imagine a case where A doesn't water plants (omission) leading to death. Then swap the framing so the same physical inaction is now treated as an action—say, actively ignoring the plants. The physical events and counterfactuals are identical; only the description of what counts as "A's contribution" vs. "background" changes. 

  For Approach 1: It should give the same verdict (both are causes) but might flip the verdict quietly because norms (which drive selection) shift with framing. If the swap changes what's "salient," the theory might call it omission in one case and action in the other, then say norms explain the difference. But that's circular—it uses norms to define the case, then norms to select causes. That fails the swap test by re-describing the scenario rather than explaining the flip. 

  Approach 2: Here, the counterfactual has to be relative to a default. In the omission case, the default is "watering," so not watering is causal. In the swapped "action" case, if the default is "ignoring plants," then watering would be the deviation. But the bad outcome still counterfactually depends on not-watering, so it should still be causal! Except now the theory might say the default flipped, so the dependence isn't "special" anymore. But why does the default flip? If the swap forces the default to change arbitrarily, it seems unprincipled. The approach might handle it if defaults are fixed independently, but the swap test could manipulate defaults. If defaults are context-dependent, this approach might fail by letting the flip happen without a deep reason. 

  Approach 3 is clean: omissions aren't causes, period. In both cases of the swap, the physical inaction isn't causal; only positive forces are. The "caused by omission" talk is just shorthand for "norm violation explains why we focus on this non-cause." So swap or no swap, verdict is the same: no causation by omission. This passes easily—it doesn't flip because it never granted causal status in the first place. The downside is it might feel counterintuitive for cases like the negligent gardener. 

  Approach 4 ties causation to duties. If A has a duty to water, not watering is causal. In the swap, if we reframe the same inactivity as an action (e.g., "deciding not to water"), does the duty still attach? Presumably yes—the duty defines the causal status, not the framing. So if the duty exists, both descriptions still point to causation by omission. But if the swap changes whether a duty applies (e.g., reframing bystander inaction as "not helping" vs. "minding own business"), the theory might flip verdicts based on duty assignments. But duties aren't physical; they're normative facts. If duties are fixed, verdicts shouldn't flip. If duties shift with framing arbitrarily, it fails. But if duties are objective, this could work. The problem is that in the swap test, the physical facts are the same, so duties should be too—meaning no flip. So this might pass. 

  Approach 5 says omissions are quasi-causal via enabling/disabling. In the omission case, not watering disables survival. In the swapped action case, the same inaction might be framed as an action that disables. But quasi-causation isn't real causation, so the verdict might be consistent: "not X" plays a disabling role in both. However, the theory might distinguish "active disabling" (real cause) from "passive not-enabling" (quasi-cause), and the swap could blur this. If the swap forces the same behavior to be "active," does it become real causation? If so, the verdict flips without a principled reason—that's bad. If quasi-causation is the same in both, it passes. But I suspect the approach might inconsistently reclassify based on framing. 

  Now, for collapses: Approach 1 and 4 feel similar—both use norms, but 1 puts it in selection, 4 in causation itself. Under pressure, 4 might reduce to 1 if "duty causes" are just selected from many causes. Approach 2 and 4 might overlap if "salient default" is defined by duties. But 2 is more flexible. Approach 3 is starkly different. 

  On the swap test's coherence: The user is right to suspect it might be rigged. By demanding the same physical facts, it assumes that causation should be determined solely by physical+counterfactual details, but many approaches (especially 3,4,5) say normative or conceptual facts matter. If norms are part of the "fixed background," the swap might force a normative change, violating the test. So the test might subtly presuppose physicalism about causation, which is contested. A theory could rightly say, "Your swap alters normative context, so flip is principled." But if the test insists norms are fixed, it becomes question-begging. 

  Final tier: 
  - S-tier: Approach 3 (no flip, ever) 
  - A-tier: Approach 4 (if duties are fixed, no flip) 
  - B-tier: Approach 2 (if defaults are stable, but they might not be) 
  - C-tier: Approach 5 (quasi-causation might be frame-invariant, but messy) 
  - D-tier: Approach 1 (heavily relies on norms for selection, likely to flip arbitrarily) 

  Extra note: 4 is better if duties are objective; worse if duties depend on framing. The user's worry about circularity is valid—the test might exclude norm-based theories unfairly.
answer: |-
  Here's a tier list ranking the approaches by how well they pass your swap test, from best to worst, with concise explanations. I've flagged collapses and addressed the coherence of the swap test at the end.

  **Key Insight**: The swap test exposes whether a theory **grounds the omission/action distinction in objective features** (avoiding circular reliance on framing) or **covertly uses norms/framing to define causation itself**.

  ---

  ### Tier List (Best to Worst)
  1. **Approach 3: Omissions aren't causes at all**  
     **Rank**: S-tier (passes perfectly).  
     **Why**: Verdict never flips. In both swap cases, the physical inaction is *never* a cause—it's merely explanatory context for norm violations. Same physical facts → same non-causal verdict. No reliance on framing.  

  2. **Approach 4: Omissions are causes only under duties/expectations**  
     **Rank**: A-tier (passes with principled flip).  
     **Why**: Flips verdicts *only* if duties change. Duties are normative facts external to framing (e.g., "gardener has duty" vs. "bystander has no duty"). If duties are fixed in the swap, verdicts don't flip. If the swap *changes* duties (e.g., redefining roles), the flip is principled—it tracks duty, not semantics.  

  3. **Approach 2: Omissions cause via contrastive counterfactuals**  
     **Rank**: B-tier (partial pass, but defaults may shift arbitrarily).  
     **Why**: Flips if the "salient default" changes. But if defaults are objective (e.g., biological needs), verdicts hold. If defaults are context-dependent, the swap could manipulate salience, making the flip unprincipled. Better than most but vulnerable to framing.  

  4. **Approach 5: Omissions are quasi-causal (enabling/disabling)**  
     **Rank**: C-tier (fails; quasi-causation is framing-sensitive).  
     **Why**: The swap can force reclassification of the *same physical inaction* as "disabling" (omission) or "actively interfering" (action). With no clear boundary, verdicts flip based on description—violating the test.  

  5. **Approach 1: Omissions = causes; norms handle selection**  
     **Rank**: D-tier (fails catastrophically).  
     **Why**: *All* difference-makers (including your not-jumping-in) are causes. The swap changes which one we *select* via norms, flipping verdicts based *entirely* on framing. Circular: norms define "omission" then "explain" selection.  

  ---

  ### Collapses
  - **Approach 1 → Approach 4**: If "selection norms" are duties (e.g., "select causes that violate duties"), Approach 1 collapses into 4.  
  - **Approach 2 → Approach 4**: If "salient defaults" are duty-based (e.g., "default = expected action"), 2 collapses into 4.  
  - **Approach 5** is distinct but unstable—it risks collapsing into **3** (if quasi-causation isn't causal) or **1** (if enabling is "causal").  

  ---

  ### Is the Swap Test Coherent?  
  **Yes, but it’s a strict test that favors reductive physicalism**.  
  - **It’s not rigged**, but it *assumes* that causation should supervene on physical facts + counterfactuals. This challenges theories where norms *constitutively* define causation (e.g., Approach 4 might reject this).  
  - **Your worry is valid**: If a theory argues that "A's contribution" *is* norm-dependent (e.g., duties fix what counts as "background"), the swap test begs the question by holding norms fixed. But that’s the point—it tests whether norms are *explanatory* or *definitional*.  
  - **Verdict**: The test is fair for exposing circularity but penalizes non-reductive theories. Approach 3 aces it precisely by being reductive.  

  **Final Take**: Approach 3 passes flawlessly but sacrifices intuitions (e.g., "gardener *caused* death"). Approach 4 offers a principled flip if duties are objective. The rest struggle with frame-dependence. Your swap test is a sharp tool—but it cuts deepest against theories that blur metaphysics and pragmatics.
