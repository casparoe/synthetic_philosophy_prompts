prompt: |-
  I teach one ninety-minute session in an upper-level undergraduate seminar on consequentialism and the aggregation of harms. There are fourteen students, a whiteboard, and a room that gets uncomfortably warm by the end of the hour. They have the standard utilitarian machinery down cold and have started treating it as a settled instrument, which is precisely the complacency I want to disturb. What I want is a runnable activity that makes them feel the pull of the puzzle usually posed as a choice between one person being tortured for fifty years and an astronomical number of people each receiving a single dust speck in the eye — and, more importantly, that makes them feel what each escape from the puzzle costs. The shape I have in mind, though you should improve it wherever it is weak, is a public commitment followed by probes. The group must settle on one number T: the number of people who would have to receive the speck before they would prefer that to the torture, with the understanding that below T they choose the torture and at or above T they choose the specks. One number, written on the board, signed by everyone who voted for it, monotone — no answering that it depends, no declaring the question ill-formed, no splitting the difference between two thresholds. Only after the number is committed to and displayed do the probes begin, and I want the probes to be the part they remember at the end of term. If T is finite, they must defend it when T is astronomically large; if they refuse to give a finite T, they must say whether they would turn down a trade in which an astronomical number of people are spared a speck of dust in exchange for shaving a single day off the torture. Then a revision round in which T may be changed, on the condition that whoever moves it must say aloud which intuition the group is abandoning in order to move it.

  Beyond that skeleton, give me the whole apparatus: rules, materials (I have index cards, a whiteboard, and a stack of cheap tokens; no money, no projector), a role structure if roles genuinely help, a minute-by-minute timeline for the ninety minutes, and a decision scheme with no cash payoff. I would like at least one phase in which the group's own T is applied to something real rather than hypothetical — the obvious candidate being how the last stretch of the session is spent, with everyone doing a short dull task versus one volunteer doing a long one, the numbers scaled to their T and the group obliged to carry out whichever option its threshold selects; keep whatever you choose harmless, reversible, and something nobody can be conscripted into. I also want a debrief that maps specific moments of the activity onto the parts of the problem: what happened when they fixed T, what happened at each probe, what the revision cost them, and where the aggregating answer and the non-aggregating answer each get their grip and where each starts to look monstrous. Assume no lecture beforehand — the structure should do the work, and they should not hear the standard name of the puzzle or the standard labels for the two families of answers until the debrief. Do not build any of it around named authors, readings, or positions; I want them to have constructed the positions before anyone tells them the positions have names. Finally, tell me what will predictably go wrong the first time I run it and how to handle each failure: I am expecting at least one student to insist that a dust speck is not a harm at all, so the trade is free; another to point out that a speck in the eye could cause a fatal accident; a deadlock if the threshold has to be unanimous; and a filibuster about whether a finite threshold is even expressible. End with an honest note on what this activity cannot reproduce and what I will therefore have to supply myself. Say how confident you are that the design will produce the experience I described rather than a brisk forty minutes of arguing about whether dust specks count as harms, and single out the one design decision you are least sure of and what you would change if it fails in the room.
reasoning: |-
  We are designing a 90-minute session for an upper-level undergraduate seminar on consequentialism and aggregation. The goal is to challenge the students' complacency with utilitarianism by making them confront the "torture vs. dust specks" puzzle. The activity should force them to set a threshold T (the number of dust specks at which they prefer the specks over one person being tortured for 50 years) and then probe the implications of that threshold. The activity should include a real application of T in the classroom and a debrief that maps the activity to the philosophical puzzle.

  Constraints:
  - 14 students
  - Whiteboard, index cards, cheap tokens (no money, no projector)
  - Room gets warm, so avoid overly physical activities
  - Harmless, reversible real activity in the last stretch
  - No lecture beforehand; no standard names for the puzzle or positions until debrief
  - Avoid named authors, readings, positions

  Structure Overview:
  1. Introduction and framing (without revealing the puzzle) - 5 minutes
  2. Setting the scenario and rules for T - 10 minutes
  3. Group deliberation and commitment to T - 20 minutes
  4. Probes and challenges - 20 minutes
  5. Revision round - 10 minutes
  6. Real application of T (using a classroom task) - 15 minutes
  7. Debrief - 10 minutes

  Total: 90 minutes

  Detailed Minute-by-Minute Timeline:

  0-5 min: Introduction
  - Frame the activity as an exercise in collective decision-making about trade-offs in harm. Do not use the words "torture" or "dust speck" yet. Instead, use abstract terms: "a very severe harm to one person" and "a very minor harm to many people."
  - Explain the rules: The group must choose a single number T. This number represents the point at which the group would prefer to have the minor harm happen to T people rather than the severe harm to one. Below T, they choose the severe harm; at or above T, they choose the minor harm. The number must be written on the board and signed by everyone who voted for it. No hedging.

  5-15 min: Setting the Scenario
  - Reveal the scenario: "One person is subjected to 50 years of torture. The alternative is that a large number of people each get a dust speck in their eye. The dust speck is momentary and causes a brief, minor irritation. It does not cause any lasting harm or infection. It is the smallest harm you can imagine that still counts as a harm. We are to ignore any ripple effects (like a dust speck causing an accident) because we are focusing on the direct harm. We are also to assume that the harms are independent and additive."
  - Clarify: The dust speck is not harmful in any significant way beyond the momentary discomfort. It is not a harm that could lead to anything else. (This addresses the predictable objection that a dust speck could cause a fatal accident.)
  - Emphasize: The group must set a finite T or explicitly set T as infinity (meaning they would never choose the specks over the torture). If they set T as infinity, they are committing to the position that no number of dust specks, no matter how large, is worse than the torture.

  15-35 min: Group Deliberation and Commitment to T
  - The group must come to a decision. They can use any method they like (discussion, voting, etc.) but must produce one number (or infinity) and have it written on the board. The decision does not have to be unanimous, but every student must indicate whether they support the chosen T by signing the board (or not). However, the group must have a rule for how to decide (e.g., majority vote). The instructor will not break ties; they must find a way to choose one T.
  - Materials: Whiteboard for writing T and signatures. Index cards for private votes if they wish to use a voting method.
  - Instructor role: Circulate, remind them of the rules (must choose one T, must be monotonic), and prevent filibustering by setting a timer. If they are deadlocked, suggest they take a vote to break the deadlock (e.g., between two leading candidates for T). They can also use tokens to vote (each student gets one token to place on a number written on the board, then the mode or median is taken, but they must then all sign the chosen T even if they disagree). The key is that they commit to one T.

  35-55 min: Probes and Challenges
  - Now that T is on the board, the instructor leads a probing session. The goal is to make the students defend their T and feel the costs of their choice.
  - If T is finite:
    - Ask: "Would you hold to T even if it were an astronomically large number, say 3^^^3 (using Knuth's up-arrow notation to represent a huge number)?"
    - Push: "What if T is so large that the total suffering from the dust specks (even though each is tiny) is immense? Does that matter?"
  - If T is infinity (i.e., they would never choose the specks):
    - Ask: "Imagine we could reduce the torture by one day in exchange for giving a dust speck to an astronomical number of people. Would you take that trade? What if we reduced it by one second? One millisecond? At what point would you take the trade? If you refuse, why?"
  - Record objections and push for consistency. The instructor should be Socratic, asking questions without giving answers.

  55-65 min: Revision Round
  - The group is allowed to change T. However, anyone who moves T (by suggesting a new number) must state aloud which intuition the group is abandoning to make the change. For example: "We are moving T from 10^9 to 10^15 because we realized that at 10^9 we were being too callous about the torture victim." Or, "We are moving T from infinity to 10^20 because we realized that an astronomical number of dust specks might be worse than shaving a millisecond off the torture."
  - They can change T only once. The new T is written on the board, and students can choose to sign or not (but the group must have a rule for adopting the new T).

  65-80 min: Real Application
  - Apply T to a real classroom situation. Design a harmless, reversible task that mirrors the trade-off. Example:
    - The group must decide how to spend the last 15 minutes of class: 
      Option A: Everyone does a short, dull task (e.g., copying a paragraph from a book by hand) for a duration scaled to T. The duration per person is set to be very short (e.g., 1 second per person? But that might be too short). Alternatively, we can scale the number of repetitions per person.
      Option B: One volunteer does a long, dull task (e.g., copying the same paragraph multiple times) for a duration that is longer but done by one person. The durations are set so that the total "harm" (in terms of time spent) is the same as in the dust specks scenario? But note: we want to mimic the trade-off.

    - How to scale:
      - Let the minor harm (dust speck) be represented by a very short task (e.g., 5 seconds of a dull task). The severe harm (torture) is represented by a long task (e.g., 50 years is about 1.5 billion seconds, but we can't do that). Instead, we can scale the time to the classroom context.

    - Revised real activity:
      - The minor task: Each student who does the task spends 5 seconds writing a fixed sentence on an index card. (Harmless and reversible: they just write a sentence and can throw it away.)
      - The severe task: One volunteer spends X minutes doing the same task (writing the same sentence repeatedly) without a break. The scaling: 
          We set the ratio: one torture = T dust specks. 
          So, if T is the number of dust specks, then the severe task time = T * 5 seconds.
          But if T is large, this could be too long (e.g., T=10^9 would be 158 years! Not feasible).

    - Alternative scaling for feasibility:
      We set the severe task to be a fixed time (say 10 minutes) and then set the number of minor tasks to be T (but we only have 14 students). Alternatively, we can have the one volunteer do the severe task for a fixed time (10 minutes) and then the minor tasks are done by the rest of the class, but each minor task is very short (5 seconds) and we have to do T of them? But we don't have T people.

    - Given the constraints (14 students, 15 minutes), we can do:
      - The group must choose between:
        Option A: One volunteer writes a fixed sentence 500 times (which takes about 10-15 minutes) while the rest of the class sits and waits (or does nothing).
        Option B: Every student in the class writes the same sentence K times, where K is chosen so that the total number of writings is 500. Then each student writes about 36 times (500/14 ≈ 35.7, so 36). This takes each student about 3 minutes (if 5 seconds per sentence, 36*5=180 seconds = 3 minutes) and the group total is 500 writings.

      But note: This does not scale with T. We want the real activity to reflect the threshold T they set.

    - Better: The severe harm is represented by one student doing 500 writings (which we'll call equivalent to 50 years of torture). The minor harm (dust speck) is one writing (which takes 5 seconds). Then the threshold T they set should tell us when they prefer the specks (many writings) over the torture (one person doing 500). So if T is less than 500, then they would prefer the torture? But that doesn't make sense because 500 specks (each 5 seconds) is 2500 seconds (about 42 minutes) of total time, while the torture is 500 writings (2500 seconds) by one person. So it's the same total burden? But the point of the puzzle is that the dust specks are minor and spread out, while the torture is concentrated.

    - Instead, let the torture be a fixed long time (say 10 minutes of continuous writing) and the dust speck be a fixed very short time (say 5 seconds). Then the trade-off is: 
        Option A: One person does 10 minutes of writing.
        Option B: T people each do 5 seconds of writing.

      But T might be huge, and we only have 14 students. How to handle?

    - Compromise: We'll use the threshold T to determine what we do, but we'll cap the number of people at 14. So:
        If T <= 14, then Option B is chosen: each of T students (randomly selected) does 5 seconds of writing (one sentence). The rest do nothing.
        If T > 14, then Option A is chosen: one volunteer does 10 minutes of writing (which is 600 seconds, equivalent to 120 dust specks). But note: 10 minutes is 600 seconds, and each dust speck is 5 seconds, so one torture is equivalent to 120 specks? But T might be 1000, then they should choose Option A? Actually, if T>14, then according to their threshold, they would prefer the torture because the number of specks (14) is below T. So we do Option A.

      So the rule for the real activity:
        - If T <= 14, then we do the specks: T students (randomly selected) each write one sentence (taking about 5 seconds each).
        - If T > 14, then we do the torture: one volunteer writes for 10 minutes (the entire 15 minutes is allocated for this, so they start immediately and write until time is up).

      However, note: if T is finite but very large (say 10^20), they are still forced to choose torture because we can't have 10^20 people. This is a limitation, but it reflects the fact that in the real world we are constrained. The point is to see that they have committed to a threshold that in practice leads to one outcome.

      But wait: if T is 100, then they prefer torture for one over 100 specks. But if we can only do 14 specks (which is less than 100), then they must choose torture. So the activity is consistent.

    - Implementation:
      - If T <= 14: Randomly select T students (using tokens in a hat). Each selected student writes one sentence on an index card (the same sentence for everyone). They do it simultaneously. Time: about 10 seconds total.
      - If T > 14: The instructor asks for one volunteer to do the torture. If no one volunteers, then the group must choose by random draw (all names in a hat, one drawn). The volunteer writes the same sentence repeatedly for 10 minutes (or until the end of the activity time). The sentence should be long enough that it takes about 5 seconds to write. Example: "The quick brown fox jumps over the lazy dog." They write it on index cards, one per sentence, and stack them.

    - Why it's harmless and reversible: The writing is dull but not painful. The volunteer can stop at any time (but we hope they don't, to respect the activity). The index cards can be discarded.

  80-90 min: Debrief
  - Map the activity to the puzzle:
    - "What we just did is a version of a classic puzzle in ethics: the torture vs. dust specks problem. The standard names for the positions are:"
        - Aggregativism: the view that even tiny harms can add up to outweigh a large harm (so T is finite, even if large).
        - Non-aggregativism: the view that the torture is so severe that no number of dust specks can outweigh it (T is infinite).
    - Discuss what happened during the activity:
        - Setting T: What was hard about it? Did they feel the pull of both sides?
        - Probes: How did they feel when they were forced to consider astronomical numbers? What about when they considered shaving off a tiny bit of torture?
        - Revision: What did they abandon? How did that feel?
        - Real application: Did they feel the weight of their decision when it was applied in the room? For example, if they set T>14, then one person had to do a long task. How did that person feel? How did the group feel watching?
    - Highlight the costs of each position:
        - Aggregativism: When T is finite, you are willing to trade an astronomically large number of minor harms to avoid one severe harm. But then you are imposing a huge total burden of minor harms. Is that acceptable?
        - Non-aggregativism: You avoid the huge total burden of minor harms, but then you are stuck with the torture. And you might even refuse to shave off a tiny bit of torture even in exchange for preventing an astronomical number of minor harms. Is that acceptable?
    - Connect to consequentialism: How does this challenge the utilitarian idea that we can simply add up harms?

  Predictable Problems and Solutions:

  1. "A dust speck is not a harm at all."
     - Solution: In the setup, define the dust speck as a momentary discomfort that is the smallest harm that still counts. Emphasize that we are to consider it as a harm, no matter how small. If a student still objects, ask: "Would you volunteer to receive a dust speck in your eye right now for no reason? If not, then it is a harm, however small."

  2. "A speck in the eye could cause a fatal accident."
     - Solution: In the setup, explicitly rule out ripple effects. The harm is the direct and immediate discomfort only. We are to assume that the dust speck does not lead to any other harm. It is a controlled thought experiment.

  3. Deadlock in setting T.
     - Solution: Have a voting mechanism in place. If they cannot agree, take a vote on a few options (e.g., the top three T values proposed, plus infinity) and choose the one with the most votes. If still tied, flip a coin. The key is to move forward.

  4. Filibuster about whether a finite threshold is expressible (e.g., because the number is too big).
     - Solution: Allow them to write T in scientific notation or even as "10^100" or "an astronomically large number". The point is to commit to a finite number or infinity. If they argue that no finite number is acceptable, then they are choosing infinity.

  5. Refusal to participate in the real activity, especially if chosen for the torture.
     - Solution: The real activity must be harmless and reversible. Emphasize that it's just a few minutes of writing. If a student really doesn't want to do the torture, allow them to opt out and have the group choose another volunteer or draw again. But try to encourage participation by making the task very benign.

  6. The group might set T very low (e.g., 2) and then in the real activity, only 2 students do a trivial task. This might not feel like a cost.
     - Solution: The point is more about the principle and the probes. The real activity is a small-scale illustration. The debrief will emphasize the implications when scaled up.

  Confidence and Weak Points:

  - Confidence: I am moderately confident that the design will produce the intended experience. The forced commitment to T and the probes are powerful. The real activity makes it concrete. The debrief ties it together.

  - Weak Point: The real activity scaling. Because we are limited to 14 students, if T is set above 14, then we do the torture (one person writes for 10 minutes). If T is set below 14, we do the specks (T students write for 5 seconds). But if T is set to 1000, then the real activity does the torture, which might feel justified because 14<1000. However, the total burden of the torture (10 minutes) is equivalent to 120 specks (since 10*60/5=120). So if T is 1000, they are saying they would rather have one person suffer 10 minutes than have 1000 people suffer 5 seconds. But in the real activity, they are getting the torture because they don't have 1000 people. This is consistent but might feel artificial. Alternatively, we could set the torture time to be T * 5 seconds? But then if T is 1000, the torture is 5000 seconds (83 minutes) which is too long. 

    - Alternative for real activity: We do a token system where each dust speck is represented by a token. We have a jar for the torture and a jar for the specks. The group must decide: put one token in the torture jar (representing the torture) or T tokens in the specks jar (each token representing one dust speck). Then we physically see the jars. But what do the tokens do? They don't cause harm. So it's symbolic.

    - Given the time and the desire for a real task, I think the writing task is better because it involves real time and effort. The mismatch between T and the actual number of students is a limitation, but we can explain in the debrief that in the real world we are constrained by the number of people. The key is that the threshold T leads to a decision: either the specks (if feasible) or the torture (if the required number of specks is not available).

  What the Activity Cannot Reproduce:
  - The activity cannot fully reproduce the astronomical scale of the original puzzle. We are limited by the classroom and time. The debrief must emphasize that the real activity is a metaphor and that the puzzle becomes more troubling at astronomical scales.
  - It also cannot reproduce the true horror of torture. The writing task is just a boring task, not real torture. The debrief must stress that the original scenario involves extreme suffering.

  Design Decision I Am Least Sure Of:
  - The real activity. If it falls flat because the task is too trivial or because the scaling feels arbitrary, it might not have the intended impact. If it fails, I would replace it with a token-based representation. For example:
     - Have two jars: one labeled "Torture" and one labeled "Dust Specks".
     - The group must decide: put one token in the torture jar (representing the torture) or T tokens in the specks jar (each token is a dust speck).
     - Then, at the end of class, the instructor dumps the tokens from the chosen jar into a box to symbolize the harm being done. The torture jar has one token, the specks jar has T tokens. This is symbolic but avoids the scaling issue.

  However, I think the writing task is more engaging. Try it and see. If it fails, switch to tokens in the next iteration.

  Final note: The activity is designed to take the full 90 minutes. The strict time limits for each phase are crucial to avoid getting stuck on the dust speck objection. The instructor must be firm on the rules and keep the activity moving.

  Let me know if you need any adjustments.
answer: |-
  ### Structured Activity: Threshold of Harm Aggregation  
  **Objective:** Challenge utilitarian complacency by forcing students to confront the torture vs. dust specks paradox through public commitment, probing, and real-world application. The design emphasizes experiential learning, with no pre-lecture or named positions.  

  ---

  #### **Materials**  
  - **Whiteboard:** For recording \( T \) (threshold number), signatures, and debate notes.  
  - **Index Cards (14):** For voting, role assignments, and the real activity.  
  - **Cheap Tokens (50+):** For anonymous voting and random selection.  
  - **Timer:** To enforce strict phases (use a phone or watch).  
  - **Two Jars:** Labeled "TORTURE" and "SPECKS" for the real activity.  

  ---

  #### **Roles** (Optional, but recommended to prevent filibustering)  
  - **Facilitator (1 student):** Keeps time, enforces rules (e.g., "no hedging").  
  - **Scribe (1 student):** Records key arguments on the whiteboard.  
  - **Objector (1 student):** Must voice one counterargument during probes.  
    *Assign via token draw at start; rotate if needed.*  

  ---

  #### **Rules**  
  1. **No Escape Clauses:**  
     - Students cannot say "it depends," "the question is ill-formed," or split thresholds.  
     - Any violation is flagged by the Facilitator (token penalty: offender sits out next vote).  
  2. **Threshold Commitment:**  
     - \( T \) must be a whole number or ∞ (infinity). No ranges.  
     - Adopted by majority vote. All supporters sign beside \( T \) on the whiteboard.  
  3. **Probes & Revisions:**  
     - During probes, answers must reference \( T \).  
     - To revise \( T \), a student must state aloud: "We abandon the intuition that [state intuition]."  
  4. **Real Activity Safety:**  
     - No physical harm or coercion. Tasks are boring but optional (opt-out allowed).  

  ---

  ### **Minute-by-Minute Timeline**  
  **Total: 90 minutes**  

  #### **Phase 1: Setup & Scenario Framing (10 min)**  
  - **0–3 min:** Introduce the activity neutrally.  
    > *"Today, we’re making a collective choice between two harms: one *severe* harm to a single person, and one *minor* harm to many people. Your task is to set a threshold where the minor harms become preferable."*  
  - **3–8 min:** Describe the harms *without* naming the puzzle.  
    > *"Severe harm: One person endures 50 years of torture—constant, excruciating pain. Minor harm: A momentary dust speck in the eye. It causes brief irritation (5 seconds), no lasting damage, no infection or accidents. Assume no ripple effects."*  
    - **Pre-empt objections:**  
      > *"If you think a dust speck isn’t a harm, consider: Would you accept one in your eye right now for no reason? If not, it counts as a harm—small, but real."*  
  - **8–10 min:** Explain \( T \):  
    > *"Define \( T \) as the number of people who must get dust specks before you prefer that over the torture. Below \( T \), choose torture; at or above \( T \), choose specks. Commit to one number. Example: If \( T = 10 \), torture is worse than 9 specks but better than 10."*  

  #### **Phase 2: Threshold Commitment (20 min)**  
  - **10–15 min:** Silent reflection. Students write proposed \( T \) values (or ∞) on index cards.  
  - **15–25 min:** Group debate. Scribe lists proposals on whiteboard. **Rules:**  
    - Facilitator silences off-topic arguments (e.g., "dust specks aren’t harms").  
    - Vote via tokens: Each student places a token beside one proposal. Majority wins. Tie? Revote with top two options.  
  - **25–30 min:** Record \( T \) and signatures.  
    > *"Write \( T \) on the board. All who support it, sign below. This locks in our choice."*  

  #### **Phase 3: Probes (20 min)**  
  *Instructor-led Socratic dialogue. Focus: Expose costs of \( T \).*  
  - **30–40 min: Finite \( T \) Probe** (if \( T \) is a number):  
    > *"Your \( T \) is [value]. Would you hold this if \( T \) were enormous? Say, \( 3^{100} \) (a 48-digit number)? If yes, isn’t that total suffering immense? If no, why commit to \( T \)?"*  
    - **Push:** *"Is there any number so large you’d reject it? If not, does utilitarianism demand we accept *any* aggregation?"*  
  - **40–50 min: Infinite \( T \) Probe** (if \( T = ∞\)):  
    > *"You’d never choose specks. What if we could reduce the torture by 1 day in exchange for giving a dust speck to \( 3^{100} \) people? Would you take that trade? What about 1 second? A millisecond? Where do you draw the line?"*  
    - **Push:** *"If you refuse, how is that different from dismissing the dust speck’s moral weight entirely?"*  
  - **Objector Role:** Must voice one counterargument (e.g., *"Doesn’t this make us monsters for ignoring the torture victim?"*).  

  #### **Phase 4: Revision Round (10 min)**  
  - **50–55 min:** Allow one change to \( T \). Proposer must state:  
    > *"We move \( T \) from [old] to [new] because we abandon the intuition that [e.g., small harms can’t outweigh large ones/suffering must be bounded]."*  
  - **55–60 min:** Revote and re-sign (same rules as Phase 2).  

  #### **Phase 5: Real Application (15 min)**  
  *Mirror \( T \) with a harmless classroom task.*  
  - **Task:** Copy a sentence (*"The quick brown fox jumps over the lazy dog."*) on index cards.  
    - **Dust speck harm:** 5 seconds of writing (≈ minor irritation).  
    - **Torture harm:** Scaled writing time (see below).  
  - **60–65 min:** Calculate task based on \( T \):  
    - **If \( T \leq 14 \):** "Specks" option. Randomly select \( T \) students (token draw). Each writes *one sentence* (5 sec).  
    - **If \( T > 14 \) or \( T = ∞ \):** "Torture" option. One volunteer writes for \( X \) minutes:  
      \[  
      X = \left( \frac{5}{60} \times T \right) \text{ minutes} \quad \text{(capped at 12 min for feasibility)}  
      \]  
      *Example: \( T = 100 \rightarrow X \approx 8.3 \text{ min} \)*  
  - **65–75 min:** Conduct the task.  
    - **Opt-out:** Anyone (especially "torture" volunteer) can decline—no penalty. Group adjusts: Draw a new volunteer or default to specks with available students.  
  - **75–77 min:** Symbolic "harm" tally:  
    - Place one token in the TORTURE jar (if torture chosen) or \( T \) tokens in the SPECKS jar (if specks chosen). Display jars.  

  #### **Phase 6: Debrief (13 min)**  
  *Map activity to the puzzle without jargon until the end.*  
  - **77–82 min:** Guided reflection:  
    > 1. *"When you fixed \( T \), what felt uneasy? Why was committing hard?"*  
    > 2. *"During probes, what made you question \( T \)? Did infinity feel like a cop-out? Did a finite \( T \) feel callous?"*  
    > 3. *"In the revision, what did you abandon? Did it feel like a moral loss?"*  
    > 4. *"In the real task: If you chose torture, how did watching one person scribble feel? If specks, did spreading the burden feel justified?"*  
  - **82–87 min:** Introduce formal terms:  
    > *"This is the *torture vs. dust specks* paradox. Two answers:  
    > - **Aggregative:** Finite \( T \). Many small harms outweigh one large harm. *Cost:* Total suffering becomes monstrously large.  
    > - **Non-aggregative:** Infinite \( T \). Torture is incomparably worse. *Cost:* You can’t reduce torture even a little for any number of small harms.  
    > Utilitarianism *demands* aggregation—but today, you felt why both answers have a cost."*  
  - **87–90 min:** Final open question:  
    > *"Where does this leave consequentialism? Can we avoid both monsters?"*  

  ---

  ### **Predictable Problems & Solutions**  
  1. **"Dust specks aren’t harms!"**  
     - **Solution:** Pre-empt in setup (Phase 1). If raised, respond: *"If you’d refuse a free speck, it’s a harm. We’re treating it as the smallest nonzero harm."*  
  2. **"A speck could cause an accident!"**  
     - **Solution:** Rule out ripple effects upfront (Phase 1). *"Assume no secondary consequences—only the direct 5-second discomfort."*  
  3. **Deadlock over \( T \):**  
     - **Solution:** Token-based majority vote. If deadlocked, Facilitator forces a revote on top two options.  
  4. **Filibuster on expressibility (e.g., "No finite \( T \) exists!"):**  
     - **Solution:** *"Commit to ∞ or the largest number you can defend. We’ll probe it."* Use timer—cut off after 2 minutes.  
  5. **Refusal in real activity:**  
     - **Solution:** Opt-out allowed. If torture volunteer declines, draw another or switch to specks. No stigma.  

  ---

  ### **Limitations & Instructor Notes**  
  **What the Activity Cannot Reproduce:**  
  - **Scale of Astronomical Numbers:** Students won’t *feel* the weight of \( 3^{100} \) specks. You’ll need to emphasize in debrief: *"In real policy, T forces us to accept vast hidden suffering."*  
  - **True Horror of Torture:** The writing task is tedious, not traumatic. Stress: *"This is a metaphor. Real torture is existential—imagine 50 years, not 10 minutes."*  
  - **Utilitarian Nuances:** The activity simplifies aggregation (no probability, varying harms). Post-activity, assign readings on variable marginal disutility or risk.  

  **Confidence & Weak Points:**  
  - **Confidence (80%):** The forced commitment + real application creates tension. Probes and revision make costs visceral.  
  - **Weak Point:** The real activity’s scaling. If \( T \) is huge (e.g., \( 10^{20} \)), the torture task is long but still abstract. If it flops:  
    - **Fix:** Replace with token jars only. *"Place 1 token in ‘torture’ or T tokens in ‘specks.’ The jar we use represents the harm we chose."* Focus debrief on the symbolism.  

  **First-Run Advice:**  
  - **Stay Strict:** Enforce rules relentlessly—interrupt filibusters.  
  - **Embrace Discomfort:** If students squirm during probes or revision, lean in: *"Why does this decision feel wrong?"*  
  - **Post-Activity:** Assign Parfit or Ng for deeper analysis, now that they’ve lived the puzzle.  

  This design forces engagement with aggregation’s costs while sidestepping theoretical baggage. The real activity—though imperfect—makes the abstract immediate, and the debrief ties their lived frustration to the utilitarian dilemma.
