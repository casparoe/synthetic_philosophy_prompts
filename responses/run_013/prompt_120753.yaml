prompt: |-
  I've been trying to get my head around the Judy Benjamin problem. The setup: you're dropped into a territory divided into Red and Blue, and each of those is split into Headquarters and Second Company. You have no clue where you are, so you figure all four possibilities are equally likely. Then you get a radio message saying that the odds are 3:1 that you're in the Red area, but that's all they can tell you. So now you know Red is three times as likely as Blue, but you still don't know anything about Headquarters vs Second Company. The question is how you should update your beliefs. I've heard that the minimum relative entropy or infomin rule gives one answer, but that there's something troubling about it. Can you explain what the problem actually is, why it's a problem for Bayesian updating, and what the main proposed solutions are? I don't need citations or reading lists, just a clear explanation of the issue and why it's tricky.
