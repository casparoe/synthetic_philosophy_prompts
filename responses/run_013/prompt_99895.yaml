prompt: |-
  Alright, I need help drafting a short research proposal, and I want you to actually think before you write. Take on the role of a philosopher of mind and moral philosopher who's spent a lot of time around AI systems -- someone who knows the functionalism and representation debates as well as the applied-ethics end of things. Before you commit to anything, brainstorm to yourself three or four different ways one might try to pin down "deception" for an AI system, weigh them briefly, and only then pick one and build the proposal around it. I don't want the first idea that comes to mind.

  Here's my situation. I'm applying for a small internal grant -- six months, one RA, basically my summer -- on how we should define honesty and deception when the agent in question is a large language model. My half-formed thought is this. The discussion seems to come in two flavours and neither quite works. One flavour treats deception as a property of an output: if the content is false or misleading, it's deception. But that makes every hallucination a lie and every sycophantic answer a con, which can't be right -- a system that's just broken isn't deceiving you, it's malfunctioning. The other flavour treats it as a property of the system's inner life: it deceives only if it holds a belief it's contradicting, or an intention to mislead. LLMs arguably don't have beliefs or intentions in the sense that would require, so that route either lets them off the hook entirely or forces us to pretend they have a psychology they don't.

  What I want to try instead is to move deception out of the system's head and into the relation between the system and the user. Rough guess at a criterion: something is deceptive, rather than merely misleading, when its misleadingness is robust -- when it survives the user's ordinary attempts to check up on it. A model that says something false and then folds the moment you push back is malfunctioning; a model whose falsehoods are stable under scrutiny, or that steers you away from the questions that would expose it, is doing something else, and that something else is what I want to call deception. I'm not sure this survives contact with the obvious counterexamples, and I suspect the line between malfunction and deception is going to need more than one criterion. That's part of the project.

  Turn this into the proposal. I need: the question stated precisely enough that it has a determinate answer; an arguement for why the two existing approaches don't settle it, not just an assertion; what I'd actually do month by month -- this is a conceptual project but I want it to touch the ground, so say what kind of cases, analyses, or small studies would count as evidence one way or the other; why this approach rather than just patching the output-based definition; and an honest section on what a result would look like, what would count as the project failing, and what might make it definately too big for six months. Leave out citations and any reading list -- I'll add those myself -- so refer to positions and arguments by description rather than by name. About two pages, first person, in my voice, a bit dry.
