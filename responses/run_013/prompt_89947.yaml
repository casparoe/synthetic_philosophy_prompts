prompt: |-
  I'm a science journalist and next month I'm running a 45-minute brown-bag for our newsroom's data and investigations desk on the reference class problem — the mess you get into when you've got a probability for "people like this" and you have to decide whether it applies to this one person (a recidivism score, a disease risk, an insurance premium). Don't explain the problem to me, I've got a decent handle on it; I want a plan for teaching it, not the spiel itself. What has to be in place first before the whole thing even registers as a problem rather than a pedantic nitpick, what single example should carry the session (and tell me what that example needs to have, and what it must leave out — I was going to use a rare-mutation patient who's relevant classes are "everyone over 50," "everyone with the mutation," "everyone at this clinic," "everyone with the family history," but talk me out of it if something works better), the misconceptions they'll walk in with — my bet is "just use the narrowest class you've got" and "this is basically a small-sample-size thing" — and exactly where in the sequence I should head each one off, plus the one question to ask at the end to tell whether it actually landed. And be honest about what I should just refuse to get into at this length.
reasoning: |-
  Okay, the user is a science journalist preparing a 45-minute session for their data and investigations desk on the reference class problem. They already understand the concept but need a teaching plan. Let me break down their requirements.

  First, they want to know what foundational knowledge the audience must have. The team works with data, so probability basics are likely covered. But emphasizing that probabilities are reference-class-dependent, not individual, is crucial. They might confuse individual risk with group statistics. Also, clarifying that the problem isn't just small sample sizes but about conflicting classes.

  Next, choosing the right example. They proposed a rare-mutation patient with overlapping classes. That could work because it involves healthcare, a relatable context. But I need to ensure the example has multiple, equally defensible classes without a clear "narrowest" option. Including classes like age, mutation, family history, and clinic patients creates ambiguity. Must avoid rare diseases where data scarcity overshadows the class choice issue.

  Misconceptions to address: "Use the narrowest class" and "it's a small sample problem." Timing is key. Tackle the narrowest class myth right after introducing the example. Show how different narrow classes yield different probabilities. Then, separate the sample size issue by using classes with solid data but conflicting results.

  Structure-wise: Start with pre-requisites, present the example, explore class choices, address misconceptions, then discuss implications. End with a question to check understanding—maybe asking them to identify which classes apply and why others don't in a new scenario.

  What to avoid: Philosophical debates about probability interpretations, technical solutions like Bayesian methods, and overcomplicating with too many examples. Keep it focused on the core issue—choosing the right reference class.

  Finally, the one question at the end should force them to apply the concept, like evaluating classes for a recidivism case. This shows if they grasp that the problem is about judgment, not calculation.
answer: |-
  Here’s a battle-tested teaching plan for your brown-bag, focusing on structure, psychological hooks, and surgical strike points:

  ### 1. **Pre-Requisites (The "Must Be In Place" Foundation - 5 mins)**
     * **What They MUST Believe First:**  
       *Probability is fundamentally tied to a defined group.* Hammer home: "Probability for *one specific person* doesn't exist in a vacuum. It is *always* conditional on a reference class ('people like this')."  
       *They already think probabilistically.* They use risk scores, prevalence rates, or demographic data daily. The problem arises when they realize "people like this" is ambiguous.  
     * **Where to Place This:** Opening 60 seconds. Use a lightning-quick example: "What's the probability Jane (a 45-year-old smoker) gets lung cancer? Is it the rate for *all people*, *all women*, *all smokers*, or *female smokers aged 45-50*?" Immediately highlight the answer depends entirely on which group you pick.

  ### 2. **The Killer Example: Why Your Mutation Case Works (But Needs Tweaks) (15 mins)**
     * **Stick with your rare-mutation patient.** It's excellent because:  
       *Medical context is visceral and high-stakes.*  
       *Classes are inherently ambiguous:* "Over 50" (age), "Mutation X" (biology), "This Clinic" (socioeconomic/access bias), "Family History" (genetics).  
       *Conflicting probabilities are plausible:* Clinic patients might have higher comorbidities, mutation carriers lower risk with family history, age might dominate.  
     * **Crucial Tweaks & Focus:**  
       * **Data MUST Exist for Key Classes:** Emphasize this isn't "no data," but "too many conflicting data sets." E.g., "Mutation X carriers: 8% lifetime risk", "Patients at this clinic: 15% risk", "Mutation X + Fam Hx: 5% risk", "Over 50: 12% risk".  
       * **Leave Out Rarity as Cause:** Explicitly state: "Assume robust studies exist for each class. The problem isn't *data scarcity*, it's *class ambiguity*."  
       * **Force the Choice:** "You're the doctor. Which number do you tell the patient? Why is THAT class the 'right' one for *this specific person* sitting in front of you?"  
     * **Visual Anchor:** Show a Venn diagram with the patient at the center of overlapping circles (Age, Mutation, Clinic, Family Hx). Label each circle with its conflicting probability.

  ### 3. **Targeted Misconception Busting (Where & How - 15 mins)**
     * **Misconception 1: "Just Use the Narrowest Class"**  
       * **When to Strike:** IMMEDIATELY after presenting the example probabilities.  
       * **How to Kill It:** "Great! Let's use the narrowest. What *is* the narrowest class? 'Mutation X + Family History + Over 50 + Treated at This Clinic'? We likely have *no data* for that hyper-specific group. Do we fall back to 'Mutation X + Family History' (5%)? But what if this clinic serves a population with high pollution exposure, making 'Clinic Patients' (15%) more relevant? **Narrowness doesn't guarantee relevance or available data.**"  
     * **Misconception 2: "This is Basically a Small-Sample-Size Problem"**  
       * **When to Strike:** After demolishing "narrowest class," before moving to implications.  
       * **How to Kill It:** "Even with HUGE sample sizes for every class, the problem persists. Imagine we have 10 million people in each category. We *still* get: Mutation Class = 8%, Clinic Class = 15%. Which applies to *this patient*? The conflict isn't statistical noise; it's about which defining characteristic matters most *for the specific outcome in this specific context*." Connect it back: The Venn diagram circles are large (good data), but their overlap is messy judgment.

  ### 4. **Core Implications for Journalists (The "So What" - 7 mins)**
     * **Interpreting Claims:** When someone says "People like X have Y% risk," **ALWAYS ask: "How do YOU define 'people like X'?"** Probe the reference class baked into the model/claim.  
     * **Reporting Nuance:** Avoid presenting single-point probabilities for individuals without disclosing the reference class(es) used and potential alternatives. "This risk score is based on Z class" is mandatory context.  
     * **Investigating Bias:** Reference class choices can hide bias (e.g., using "zip code" proxies for race in recidivism scores). Ask: "Why THIS class and not THAT one?"  
     * **Humility:** Acknowledge that even experts often lack a principled way to choose. The problem is often *pragmatic*, not solvable by pure math.

  ### 5. **The Landing Check Question (1 min)**
     * **The Question:** *"You're reporting on a new algorithm predicting recidivism. The developer says it uses 'hundreds of features' for accuracy. Why isn't this a solution to the reference class problem we discussed?"*  
     * **Why it Works:** It tests if they grasp that:  
       1) Features *define* the class ("people with these hundreds of features"),  
       2) The core problem (is *this* class definition the *relevant* one for the outcome/purpose?) remains untouched by complexity,  
       3) Bias can be baked into the feature selection/weighting defining the class.

  ### 6. **What to FIRMLY Avoid (For 45 Mins)**
     * **Deep Philosophy:** Don't dive into frequentist vs. Bayesian holy wars (mention it exists, but don't explain). Skip Popper/Carnap.
     * **Technical Solutions:** No deep dives into model-based clustering, hierarchical Bayesian models, or causal diagrams. Acknowledge they *exist* as attempts to manage it, but they don't *solve* it.
     * **More than 1 Primary Example:** Stick with the mutation case. Briefly mention recidivism/insurance as parallel confirmations, but don't develop them fully. Avoid rabbit holes.
     * **False Precision:** Don't spend time on "optimal" class selection rules – emphasize there usually aren't any.

  ### Session Flow Summary
  1.  **(5 min) Hook & Foundation:** Probability = Group Property. Ambiguity of "Like This".
  2.  **(15 min) Deep Dive Example:** Mutation Patient + Venn Diagram. Conflicting probabilities from valid classes.
  3.  **(15 min) Bust Myths:** "Narrowest Class?" -> Nope (Relevance/Data). "Small Samples?" -> Nope (Fundamental Ambiguity).
  4.  **(7 min) Implications:** Asking "Which Class?", Reporting Nuance, Spotting Bias, Embracing Uncertainty.
  5.  **(2 min) Landing Check:** The Recidivism Algorithm Question + Quick Debrief.
  6.  **(1 min)** Wrap: "It's a lens, not a solution. Always ask 'WHO counts as LIKE THIS?'"

  **Why this works:** It meets journalists where they live – concrete examples, practical implications, and skepticism towards oversimplified claims. The mutation case forces confronting ambiguity *even with good data*. Busting "narrowest class" and "small samples" early prevents those ideas from acting as mental escape hatches. Ending with the recidivism question ties it directly to their beat and tests if they see the problem persists beneath technical complexity. Good luck!
