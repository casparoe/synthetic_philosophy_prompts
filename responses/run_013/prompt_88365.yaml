  But note: in case 5, the representation is activated by one input. Condition (c) requires a range, so case 5 fails. Case 6: we can intervene even without activation, so condition (a) is met by intervention. Condition (c) requires that the representation is such that it could be activated by multiple inputs. In case 6, the representation is wired and we can perturb it, but it is never activated. However, the property P is defined such that if it were activated by an input, then it would be for a range? The case doesn't specify. We must interpret condition (c) as: the representation is not tied to a single input pattern. In case 5, it is tied to one string. In case 6, the representation is for a property that could in principle apply to multiple inputs, even if it never occurs. So condition (c) is about the scope of the representation: it must be general in the sense that it is not input-specific.

  Now test the principle on the cases:

  1. Yes: (a) Steering and ablation change behavior in a way that tracks truth-value. (b) Robust to seed variation. (c) Generalizes across sentences.

  2. No: (a) Fails because interventions don't change behavior (agreement remains correct). So (a) is not satisfied. The information is there but not used causally.

  3. Yes: (a) Ablation destroys behavior, perturbations shift output predictably (tracks P). (b) Not explicitly stated, but we assume robustness (since it's a synthetic task, likely controlled). (c) The property P is defined for inputs in the task, so it should generalize across inputs (the subspace is for the task).

  4. No: (a) Initially, steering seemed to change behavior to track sentiment, but (b) when controlled for topic, the effect disappears and not robust across seeds? The case says "disappears once we control for topic and re-run across seeds", so (b) fails.

  5. No: (a) Interventions change behavior as predicted. (b) We can assume robustness (if we re-run seeds, it would likely be there). But (c) fails: it only works for one particular string, so not general.

  6. Yes: (a) Intervening produces coherent changes in behavior that track P. (b) Not mentioned, but we assume robustness. (c) The representation is not tied to one input; it is defined for a property that could apply to multiple inputs (even if never encountered). So condition (c) holds.

  7. We have a causal role (a) and presumably robustness (b). But condition (a) requires that the behavioral change tracks P. The ambiguity is: does it track the model's uncertainty or the world difficulty? We must see what the intervention does. If ablating the direction removes hedging, then without it the model does not hedge even when it would be uncertain. So the behavior (hedging) is tracking the model's uncertainty? But the direction is also tracking world difficulty. We need to see if there is a control that can dissociate. If we can control for world difficulty and see if the direction still tracks uncertainty, then we can tell. If not, then it might be ambiguous. The principle requires that the behavioral change tracks P. If we intervene and set the state to a value that indicates high uncertainty (even on easy inputs), does the model hedge? If so, then it is tracking uncertainty. Similarly, if we set it to low uncertainty on hard inputs, does the model fail to hedge? Then it is about the model's uncertainty. But the case doesn't give this. The principle does not resolve the ambiguity because it depends on what P we are testing. We must specify P. The principle says: the behavioral change must track P. So if we define P as the model's uncertainty, then we need to show that the intervention causes hedging when P is high (even if the input is easy) and no hedging when P is low (even if the input is hard). Without such a dissociation, we cannot be sure. So the principle does not inherently resolve the ambiguity; it requires that we can set up the intervention to show that the behavior is tracking the intended P and not a confound. Therefore, for case 7, we cannot say without further experiments. But note: the representation might be of world difficulty and the model uses that to decide when to hedge. Then P would be world difficulty. The model does not represent its own uncertainty per se, but it does represent world difficulty and uses it appropriately. So there might be a fact of the matter, and the principle requires that we test by intervention: what does the state control? If we can control the state independently of the input, we can see what behavior it drives.

  Now, the principle:

  **Final Principle:**

  A neural network represents a property P if and only if:

     (1) **Causal Tracking**: There exists an intervention on the internal state (leaving the input unchanged) that changes the downstream behavior in a way that tracks P. That is, the behavioral change is predictably dependent on the value of P as set by the intervention.

     (2) **Robustness**: The effect in (1) holds after controlling for confounding variables and is recoverable across independently trained models (seed variation).

     (3) **Generality**: The representation is not specific to a single input or a fixed set of inputs; it must be activatable by, and its behavioral effect must manifest for, a range of inputs.

  Clauses motivated by:

  - (1) by cases 1, 2 (absence), 3, 4 (if we had a causal effect, it was confounded), 5, 6, 7.

  - (2) by case 4 (confound) and case 1 (seed variation).

  - (3) by case 5 (fails) and case 1 (passes). Also, case 6 passes because the representation is defined for a general property and could be activated by multiple inputs.

  Now, test on a new case: a network in which P is represented only in a subspace that is causally used solely when the model is asked to do a task it was never trained on but generalizes to.

  - Example: A model trained on image classification, but we find a subspace that, when the model is tested on a new task (e.g., object detection), is causally used. We can intervene on this subspace and change the object detection behavior in a way that tracks P (say, object position). And it generalizes to multiple images.

  - According to the principle: 
     (1) We can intervene and change behavior (on the new task) to track P. 
     (2) We need to check robustness (controls for confounds and across seeds). 
     (3) It must work for a range of inputs (images). 

  - If these hold, then yes, it represents P.

  Two more cases to discriminate:

  Case A: A direction that decodes and steers the presence of a rare word, but only for one specific context (e.g., "The word 'zygote' appears in the text"). Ablating it removes the model's ability to use that word in that context. It does not work for other contexts. Robust across seeds.

  - Verdict by principle: 
    (1) Causal: ablation and steering change behavior. 
    (2) Robust. 
    (3) Not general: only one context. So no representation of the property (presence of the word in general) but maybe a representation of that specific context. We might say it represents the property for that context, but the property we care about is the word's presence. Since it doesn't work for other contexts, it fails (3). So no.

  Case B: A direction that, when steered, causes the model to output French, but only if the input is already in French. If the input is in English, steering has no effect. The effect is robust. And it works for any French input (range).

  - (1) Intervention changes behavior (to more French-like) for French inputs. Tracks the property "should output in French" when the input is French? 
  - But what is P? If P is "the output should be in French", then the intervention only works when the input is French. Is that tracking P? We can say: the intervention sets a state that represents the desired language, but the model only follows it if the input is in the same language? This might be a failure. Alternatively, we can define P as the model's internal "French mode". Then the intervention does track P: when we set the state to high French mode, the output becomes more French for French inputs. And it doesn't affect English inputs. But then P is not a world property but an internal one. We must be clear about P.

  - The principle requires that the behavioral change tracks P. If P is the model's internal language setting, then yes: setting it to French causes French output for French inputs. And it is general (for any French input). Robust? Assume yes. So yes, it represents the internal language setting.

  - But if P is the desired output language (a world property), then the model's behavior does not always track P because if we set the state to French and give an English input, it doesn't output French. So the behavioral change (more French) only occurs under certain conditions. This might violate (1) because the tracking is conditional. We can refine: the behavioral change must track P under the conditions that the representation is intended for? But that's vague. The principle as stated requires that the intervention changes the behavior to track P. In this case, the intervention only works when the input is French. So it does not track P (desired French output) unconditionally. Therefore, if we define P as the desired output language, then the representation does not meet (1) because the effect is conditional on the input language. So we would say no. But if we define P as an internal control signal for French, then yes.

  - The moral: we must specify P clearly. The principle is relative to a property P.

  Now, the ledger: which of the original seven verdicts does the principle not accommodate?

  - Case 6: We said yes. The principle says yes because (1) intervention changes behavior to track P, (2) assume robustness, (3) the representation is general (not tied to one input). So it accommodates.

  - Case 5: We said no. Principle says no because (3) fails: only one string. So it accommodates.

  - Case 7: The principle does not directly decide because it depends on what P we are testing and whether the intervention tracks that P. We need to set up an intervention that dissociates the two candidate Ps (model uncertainty vs world difficulty). So the principle is consistent with the verdict being either, depending on the evidence.

  But is there a verdict we must give up?

  - Case 6 and Case 5 are both accommodated: 5 fails (3), 6 passes (3) because the representation is not input-specific.

  - Case 2: We said no, and the principle says no because (1) fails: interventions don't change behavior.

  - Case 4: We said no, and principle says no because (2) fails.

  - Case 1: Yes, passes all.

  - Case 3: Yes, passes all (assuming robustness and generality).

  - Case 7: The principle does not force a verdict without more evidence, so it is consistent with the existing indecision.

  But note: in case 6, the representation is never exercised. The principle does not require actual use, only that an intervention can change behavior to track P. So it's fine.

  One might argue that case 6 should be no because it's never used. But our verdict was yes, and we stick to it. The principle accommodates.

  Now, what should an interpretability researcher do? A decision procedure:

  Step 1: Define the property P precisely.

  Step 2: Identify a candidate internal state (e.g., a direction, a subspace) that might represent P.

  Step 3: Test for causal tracking:
     - Perform interventions (e.g., ablation, patching, steering) on the candidate state while holding inputs fixed.
     - Check if the downstream behavior changes in a way that predictably depends on the value of P as set by the intervention. If not, it is not a representation of P.

  Step 4: Test for robustness:
     - Control for confounding variables: vary other factors that might be correlated with P and see if the effect persists.
     - Check across independently trained models (seeds) to see if the effect is recoverable.

  Step 5: Test for generality:
     - Check if the representation and its causal effect hold for a range of inputs (not just one or a few). This includes inputs that were not in the training set but within the domain of generalization.

  Step 6: If all three conditions are met, then the network represents P. Otherwise, it does not.

  Decisive evidence:

  - For: An intervention that, across a range of inputs, changes the behavior in a way that tracks P, and this effect holds after controlling for confounds and across seeds.

  - Against: 
     - If interventions do not change behavior (like case 2).
     - If the effect disappears under proper controls or across seeds (like case 4).
     - If the effect is only present for a single input (like case 5).

  Final Answer:

  **Principle:**

  A neural network represents a property P if and only if:

  (1) **Causal Tracking**: Interventions on the internal state (e.g., ablation, patching, steering) can change the downstream behavior in a way that predictably depends on the value of P, as set by the intervention.

  (2) **Robustness**: This effect persists after controlling for plausible confounding variables and is recoverable across independently trained models.

  (3) **Generality**: The representation and its behavioral effect are not specific to a single input or a fixed set; they must hold for a range of inputs.

  **Ledger:** The principle accommodates all the original verdicts except that it does not force a verdict on case 7 without further evidence. We should give up nothing from the original verdicts.

  **For case 7:** The principle requires that we set up interventions to dissociate the two candidate properties (model uncertainty and world difficulty). For example, fix an input of high world difficulty but intervene to set the state to low "uncertainty/difficulty" and see if the model still hedges. If it does not hedge, then the state is driving the hedging. Then, fix an easy input and set the state to high uncertainty: if the model hedges, then it is tracking the state we set (which we interpret as uncertainty). If the hedging only occurs when the input is actually difficult, then it might be tracking world difficulty. The decisive evidence would be if the state can be set independently to cause the behavior regardless of the input's actual difficulty. If so, then it represents the model's uncertainty. Otherwise, it represents world difficulty.
answer: |-
  ### Stage 1: Brainstorming Candidate Criteria and Tensions
  From the cases, the following candidate criteria emerge, with cases pulling in opposite directions:

  - **Causal role in behavior (intervention-dependence)**: Cases 1, 3, 5, and 6 support this: interventions (ablation, steering) change behavior predictably. Case 2 undermines it: interventions don't affect behavior despite decodability.
  - **Robustness to confounds and seed variation**: Case 4 requires this (sentiment effect vanished with controls). Case 1 supports it (recoverable across seeds).
  - **Generalization beyond specific inputs**: Case 5 rejects memorized lookups (single string), while Case 1 accepts truth-value due to generalization. Case 6 conflicts: it accepts unused representations, implying generality isn't about *actual* use but *potential* applicability.
  - **Human legibility or linearity**: Case 3 rejects this (nonlinear, illegible subspace accepted).
  - **Information availability vs. use**: Case 2 shows decodability alone is insufficient; the info must be *used* causally.
  - **Independence from world properties**: Case 7 highlights tension: if a direction tracks both model-internal (uncertainty) and world (difficulty) properties, is it a representation of either?

  **Genuine tensions**:
  - **Case 5 vs. Case 6**: Case 5 (memorized lookup) is rejected despite causal role, while Case 6 (unused direction) is accepted. This pulls between requiring *actual generalization* (Case 5) and accepting *structural potential* (Case 6). Resolution must allow unused representations but exclude input-specific encodings.
  - **Case 5 vs. Case 1**: Both have causal role and decodability, but only Case 1 generalizes. This demands a generalization criterion.
  - **Case 7 ambiguity**: If causal role is present but the property (uncertainty vs. difficulty) is underdetermined, the criterion must specify what "tracks P" entails.

  ### Stage 2: Committed Principle
  After weighing tensions, the principle is revised to prioritize **causal utility**, **robustness**, and **input-general applicability**. The key insight: representation requires not just information encoding, but that the system *uses* that information *as* P in its computations, with generality reflecting the property's role in the model's functional architecture.

  **Final Principle**:  
  A network represents a property P if and only if:  
  (1) **Causal Utility**: There exists an intervention (e.g., ablation, patching, steering) that predictably changes downstream behavior in a way that tracks P, and this effect is not epiphenomenal (motivated by Case 2 and Case 3).  
  (2) **Robustness**: The effect in (1) persists after controlling for confounding variables and is recoverable across independently trained models (motivated by Case 4 and Case 1).  
  (3) **Input-General Applicability**: P is not tied to a specific input or fixed set; the representation must be activatable by, and causally effective for, a range of inputs where P could reasonably apply (motivated by Case 5 and Case 6).  

  ### Stage 3: Testing the Principle
  **New Case**: A subspace represents P (e.g., spatial relationships) and is causally used only when the model generalizes to an untrained task (e.g., puzzle-solving).  
  - **Verdict**: **Yes**, if it satisfies:  
    - (1) Interventions on the subspace alter puzzle-solving behavior predictably (e.g., ablating it impairs performance).  
    - (2) Effect holds across seeds and after controlling for low-level features.  
    - (3) P applies to multiple puzzle instances (not one specific puzzle).  

  **Discriminatory Cases** (to test against weaker criteria):  
  - **Case X**: A direction decodes and steers "is a noun" in a LM. Ablation degrades noun-handling, but only for 10 memorized nouns; for novel nouns, behavior is unchanged.  
    - **Verdict**: **No**—fails (3) (not input-general; only fixed set).  
  - **Case Y**: A nonlinear feature tracks "emotional valence." Steering amplifies valence-consistent outputs, controlled for topic and robust across seeds. However, ablation leaves behavior unchanged because the model uses redundant pathways.  
    - **Verdict**: **No**—fails (1) (no causal utility; epiphenomenal).  

  ### Stage 4: Ledger of Verdict Accommodation
  The principle accommodates most verdicts but requires revising two:  
  - **Accommodated Verdicts (no change)**:  
    - Case 1: Yes—satisfies (1), (2), (3) (tracks P causally, robust, general across sentences).  
    - Case 2: No—fails (1) (no causal effect on behavior).  
    - Case 3: Yes—satisfies (1) (subspace interventions track P), (2) (assumed robust in synthetic task), (3) (P applies to task inputs).  
    - Case 4: No—fails (2) (not robust to controls/seeds).  
    - Case 6: Yes—satisfies (1) (interventions track P), (2) (assumed robust), (3) (P is input-general even if unused).  
  - **Verdicts to Revise (with reason)**:  
    - **Case 5 (No → Yes)**: You must abandon "memorized lookup" rejection. The principle accepts it: (1) Interventions track P (token prediction), (2) assumed robust, (3) P ("this string has next token T") is input-general—it applies to *any* input where the string appears. The intuition that memorization isn't "real" representation is overruled: generality is about P's scope, not novelty.  
    - **Case 7 (Ambiguous → Resolvable)**: The principle forces a test: define P as "model uncertainty" or "difficulty." If interventions (e.g., steering) can dissociate them (e.g., set high uncertainty on easy inputs causes hedging), then it represents uncertainty. If not, it represents difficulty. The fact of the matter turns on whether P is tracked *independently* of confounds (per (2)).  

  ### Stage 5: Decision Procedure for Interpretability Researchers
  To determine if a discovered feature is a representation of P:  
  1. **Define P precisely** (e.g., "truth-value," not just "sentiment").  
  2. **Test Causal Utility (1)**:  
     - Intervene (ablate/patch/steer) on the feature while holding inputs fixed.  
     - Measure if behavior changes predictably with P (e.g., steering truth-direction increases truthful outputs).  
     - *Decisive evidence for*: Behavior shifts track P (e.g., ablation removes hedging in Case 7).  
     - *Decisive evidence against*: No behavior change (Case 2) or changes don’t correlate with P.  
  3. **Test Robustness (2)**:  
     - Re-run interventions controlling for confounds (e.g., for sentiment, vary topic).  
     - Repeat across multiple model seeds.  
     - *Decisive evidence for*: Effect persists post-controls and across seeds.  
     - *Decisive evidence against*: Effect vanishes (Case 4).  
  4. **Test Input-General Applicability (3)**:  
     - Check if interventions affect behavior for a range of inputs where P is relevant (not predefined sets).  
     - *Decisive evidence for*: Effects hold for diverse inputs (e.g., truth-direction works for many sentences).  
     - *Decisive evidence against*: Effects only for specific inputs (e.g., Case X).  

  **What turns on Case 7?** If the feature represents uncertainty, it reflects self-monitoring; if difficulty, it reflects world-modeling. The principle demands empirical disambiguation via interventions (Step 2 above). If interventions cannot dissociate the two, P is underspecified, and it may not cleanly represent either.
