answer: |-
  Below is a decision tree designed to sort positions on decision theory puzzles like Counterfactual Mugging and XOR Blackmail. It uses concrete cases to force distinctions between views, avoids abstract questions, and includes your custom cases (70% predictor and two friends). The tree has 10 questions, fits on one page, and exposes 7+ distinct positions. Questions are grounded in specific scenarios, and each leaf names a position + its most awkward consequence for a case. Incoherent/empty branches are marked.

  ---

  ### **Decision Tree: What Should You Do in Weird Choice Puzzles?**
  *Start at Q1. Answer based on instinct, not theory labels.*

  **Q1: Newcomb’s Problem**  
  Omega offers you two boxes: Box A (opaque) and Box B (transparent, $1,000). Omega predicts your choice: if predicted one-box (take only A), she put $1M in A; if predicted two-box (take A+B), she left A empty. You see $1,000 in B. Do you take:  
  - **A1: Only Box A? → Q2**  
  - **A2: Both Boxes A and B? → Q5**  

  **Q2: Parfit’s Hitchhiker**  
  You’re stranded in the desert. A driver says: “I’ll drive you to town if you promise to pay me $1,000 afterward. If you don’t promise/pay, I leave you to die.” You promise, get driven to town, and now face paying. Do you:  
  - **A1: Pay the $1,000? → Q3**  
  - **A2: Not pay? → Q4**  

  **Q3: 70%-Accurate Mugging**  
  Omega flips a coin:  
  - Heads (50%): She gives you $10,000 if she predicted you’d pay if tails.  
  - Tails (50%): She asks for $100.  
  *She’s right 70% of the time.* Coin is tails. Do you:  
  - **A1: Pay $100? → Q6**  
  - **A2: Not pay? → Position: [Deferential] Awkward: Pays a perfect Omega but not a 70% one, despite the policy working better at 70%.**  

  **Q4: Smoking Lesion**  
  You consider smoking. A genetic lesion causes cancer and a craving to smoke. Smoking *doesn’t* cause cancer—the lesion does. You enjoy smoking. Do you:  
  - **A1: Smoke? → Position: [Inconsistent One-Boxer] Awkward: One-boxes in Newcomb (evidence-focused) but ignores evidence here (smoking indicates the lesion).**  
  - **A2: Not smoke? → Position: [Evidential Decision Theory] Awkward: In Mugging (tails), won’t pay $100 even though paying would mean Omega likely gave you $10,000 in the heads branch.**  

  **Q5: Smoking Lesion** (Same as Q4)  
  Do you:  
  - **A1: Smoke? → Q7**  
  - **A2: Not smoke? → Position: [Causal-Evidential Hybrid] Awkward: Two-boxes in Newcomb (ignores evidence) but avoids smoking (treats it as evidence), without a clear principle.**  

  **Q6: Two-Friends Mugging**  
  Same as standard Mugging (tails, pay $100 for $10,000 if heads), but now you and a friend face it *together*. Same coin, asked separately. You know you’ll both choose identically (e.g., both pay or both don’t). Do you:  
  - **A1: Pay $100? → Q8**  
  - **A2: Not pay? → Position: [Inconsistent Policy-Selector] Awkward: Pays in solo Mugging but not here, even though cooperation guarantees mutual gain.**  

  **Q7: Standard Counterfactual Mugging**  
  Omega is perfect. Coin is tails. Do you:  
  - **A1: Pay $100? → Position: [Causal Decision Theory*] Awkward: Pays in Mugging (unusual for CDT) but two-boxes in Newcomb, losing $999K. (*Variant of CDT that ignores predictors.)**  
  - **A2: Not pay? → Position: [Causal Decision Theory] Awkward: Two-boxes in Newcomb, getting only $1,000 when one-boxers get $1M.**  

  **Q8: Cold-Reader Mugging**  
  Same as 70% Mugging, but the “predictor” is a human cold-reader (60% accurate, guesses based on your facial cues). Coin is tails. Do you:  
  - **A1: Pay $100? → Position: [Functional/Updateless Decision Theory] Awkward: Pays a cold-reader, treating his guess like Omega’s prediction, even though it’s just a face-read.**  
  - **A2: Not pay? → Position: [Acausal Policy-Selector] Awkward: Pays a perfect Omega but not a human, even at 60% when paying is profitable.**  

  **Q9: Twin Prisoner’s Dilemma**  
  You and your identical twin play separately. You’ll both choose identically (e.g., both cooperate or both defect). Payoffs:  
  - Both cooperate: $500 each.  
  - One defects, one cooperates: Defector gets $1,000, cooperator $0.  
  - Both defect: $100 each.  
  Do you:  
  - **A1: Cooperate? → Position: [Acausal FDT/UDT] Awkward: Cooperates with a twin you’ve never met, as if your choices are magically linked.**  
  - **A2: Defect? → Position: [Functional Decision Theory] Awkward: Defects against your twin, getting $100 instead of $500, because you see choices as independent.**  

  **Q10: XOR Blackmail**  
  You get a letter: “We *might* have embarrassing photos. Pay $100 to block release. Photos exist only if you lack gene X (1% chance). We’ll release them only if you don’t pay AND they exist. We mail everyone this letter.” Do you:  
  - **A1: Pay $100? → Position: [Expected Utility Maximizer] Awkward: Pays despite knowing there’s a 99% chance photos don’t exist and paying won’t help.**  
  - **A2: Not pay? → Position: [Causal Decision Theory] Awkward: Won’t pay in Blackmail but might in other cases, with no clear line on when evidence matters.**  

  ---

  ### **Position Summaries & Awkward Consequences**
  1. **Evidential Decision Theory (EDT)**: Treats choices as evidence. *Consequence:* Won’t pay in Mugging (tails) despite missing out on $10,000 in heads.  
  2. **Causal Decision Theory (CDT)**: Acts only on causal influence. *Consequence:* Two-boxes in Newcomb, getting $1,000 vs. $1M.  
  3. **Functional/Updateless Decision Theory (FDT/UDT)**: Chooses policies, not acts. *Consequence:* Pays a cold-reader, trusting a 60% face-read like divine Omega.  
  4. **Acausal FDT/UDT**: Treats correlated agents as one. *Consequence:* Cooperates with a stranger (twin) as if choices are telepathically linked.  
  5. **Deferential**: Pays only perfect predictors. *Consequence:* Rejects a 70%-accurate Mugging even though paying is profitable.  
  6. **Acausal Policy-Selector**: Pays Omega but not humans. *Consequence:* Pays a godlike predictor but not a skilled human, even with identical payoffs.  
  7. **Expected Utility Maximizer**: Pays if expected value is positive. *Consequence:* Pays in XOR Blackmail despite 99% chance it’s pointless.  
  8. **Inconsistent One-Boxer/Hybrids**: Mixed evidence/causal focus. *Consequence:* One-boxes in Newcomb but ignores evidence in Smoking Lesion.  

  ### **Notes**  
  - **Empty branches**: Q3A1 (“Only perfect predictors”) is rare but coherent. Q5A2 (two-box + don’t smoke) has no adherents (incoherent mix).  
  - **Splits**: The tree separates positions by:  
    - Whether choices are evidence (e.g., EDT vs. CDT).  
    - Policy vs. act focus (e.g., FDT vs. Acausal FDT).  
    - Predictor mechanism (e.g., Deferential vs. FDT).  
    - Group agency (e.g., Acausal FDT vs. FDT in Twin PD).  
  - **Your cases**: The 70% Mugging exposes policy views (FDT pays, Deferential doesn’t). The two-friends case splits individual vs. group policy (Q6).  
  - **Why no "precommit" branch?** Positions like "just precommit" collapse into FDT (policy-picking).  
  - **XOR Blackmail**: Used in Q10 to split CDT (not pay) from EU maximizers (pay).  

  This tree forces exposure of disagreements: e.g., if you pay in standard Mugging (Q1A1→Q2A1) but defect in Twin PD (Q9A2), you land in FDT (rejecting acausal links). Print as a one-pager for your group!
