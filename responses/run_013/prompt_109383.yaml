prompt: |-
  You're a philosopher who works on personal identity and medical ethics — I need a teaching instrument, not an essay. I'm running a grad bioethics session on advance directives and the authority of the earlier self, and I want a decision tree that sorts people by what they actually think rather than by which label they like. Think it through carefully, and start by brainstorming the logical space before you name any position.

  Root the tree in the case that has to do the work: a woman who signed a directive before her diagnosis refusing life-sustaining treatment and instructing that she not be kept 'merely content'; she now has moderate dementia, is cheerful, and says she wants to live. Every internal node must be a question answerable from a concrete case, never 'do you accept precedent autonomy?'. I want at least these splits: whether the later person is the same person or merely the same subject of a life-story; whether the earlier self's say-so binds, or is only evidence about her interests, or is expressive only (it records who she was without deciding anything); whether her present contentment is a genuine change of mind or the illness talking; and whether her earlier preference can count as informed at all, given she'd never been in the state she was refusing.

  Two branches the literature skimps on, so include them: (a) a directive containing a self-sealing clause — 'if I ever say I want to live, treat that as a symptom' — does your view make that clause binding, and if so is that a feature or an embarassment? (b) two conflicting directives, one written at 45 and one at 70 after the diagnosis — recency or informedness?

  Leaves should include precedent-autonomy/critical-interests, the now-self experiential view, the new-person-no-authority view, narrative authorship, evidentiary-only, a capacity-graded sliding scale, and a two-track view treating refusals and requests differently (mark it 'unnamed' if nobody actually holds it). Note which combinations of answers nobody occupies and whether that's incoherence, unattractiveness, or just nobody having tried; flag any leaves the tree can't separate. Finish with a scoring key mapping answer patterns onto leaves.
reasoning: |-
  Hmm, the user wants me to create a teaching instrument for a graduate bioethics session on advance directives and personal identity. They need a decision tree that sorts people based on their actual reasoning rather than labels, rooted in a specific case of a woman with dementia who signed an advance directive refusing life-sustaining treatment but now wants to live.

  The case is complex: a woman signed a directive before her diagnosis refusing life-sustaining treatment and stating she shouldn't be kept "merely content." Now with moderate dementia, she's cheerful and expresses a desire to live. The decision tree needs internal nodes with concrete, case-based questions, avoiding abstract philosophical terms.

  Key splits they want include:
  - Whether the later individual is the same person or just the same subject of a life-story
  - Whether the earlier self's directive binds, serves as evidence about interests, or is merely expressive
  - Whether current contentment is genuine change of mind or illness
  - Whether the earlier preference could be informed given she hadn't experienced dementia

  They specifically want two under-discussed branches:
  (a) Self-sealing clauses (where requesting treatment is interpreted as a symptom) - should they bind? Is this feature or flaw?
  (b) Conflicting directives from different ages (45 vs 70) - which prevails? Recency or informedness?

  Leaves should include various positions like precedent autonomy, experiential view, narrative authorship, etc., with notes on which combinations are unoccupied and why.

  I need to start by brainstorming the logical space without naming positions. The core tensions are:
  1) Metaphysical: Personhood continuity (is she still the same person?)
  2) Epistemic: Can she truly understand dementia without experiencing it?
  3) Evaluative: Weight of past vs present preferences
  4) Practical: How to interpret directives

  For the tree structure, I'll ensure:
  - Root: The core case
  - Internal nodes: Concrete questions (e.g., "If she says 'I enjoy gardening,' is that HER speaking?")
  - Branches covering all requested splits
  - Leaves labeled with positions
  - Notes on empty branches
  - Scoring key mapping answers to positions

  The self-sealing clause branch will test consistency - if someone thinks directives bind absolutely, they must accept this clause, which may be counterintuitive. The conflicting directives branch forces choice between recency and informedness.

  I'll flag incoherent combinations (e.g., denying personhood continuity while giving the directive full binding force) and note where the tree can't distinguish positions (e.g., experiential and narrative views may converge on outcomes).

  The scoring key will translate answer patterns into named positions, helping students locate their views. This should make the abstract debates tangible and highlight where logical commitments lead.
answer: |-
  Here is a teaching decision tree designed to sort participants based on their concrete intuitions about the core case and its variants. It maps answers to major positions in the literature while exposing logical tensions and under-explored branches.

  **Core Case:** "Anna" signed a clear advance directive at age 60 (pre-diagnosis) refusing all life-sustaining treatment if she developed dementia, stating she did not want to be kept alive "merely content." She is now 75, has moderate dementia, lives in a care home, appears cheerful and engaged in simple activities, and consistently states she "wants to live" when asked.

  ---

  ### The Decision Tree
  **Start at the Root (Core Case):** Should Anna's directive be followed (treatment withheld) or overridden (treatment provided)?

  1.  **If Anna today says, "I enjoy gardening here," is that HER speaking (the person who wrote the directive), or is it primarily the DEMENTIA speaking?**
      *   **(A) HER speaking** (She retains core identity/agency) → Go to Q2
      *   **(B) DEMENTIA speaking** (Illness fundamentally alters voice/capacity) → Go to Q3

  2.  **Anna (pre-dementia) had never experienced moderate dementia. Does this mean her directive refusal CANNOT be truly informed about the state she was refusing?**
      *   **(A) YES, cannot be informed** (Lacks essential experiential knowledge) → **Leaf: Evidentiary-Only View** (Directive is weak evidence; prioritize current expressed wishes). *Note: May also lean towards Experiential View.*
      *   **(B) NO, can be informed** (Rational foresight possible; values matter) → Go to Q4

  3.  **When Anna (with dementia) says "I want to live," is this a GENUINE CHANGE OF MIND based on her current experience, or is it an INABILITY TO UNDERSTAND her prior values/situation due to dementia?**
      *   **(A) GENUINE CHANGE OF MIND** (Current self has new perspective/values) → **Leaf: Experiential View (Now-Self)** (Only current experiential interests matter; follow current wishes).
      *   **(B) INABILITY TO UNDERSTAND** (Illness blocks access to true values) → Go to Q5

  4.  **The directive says "Do not keep me merely content." Does the fact that Anna is now cheerful MEANINGFULLY CHANGE what the directive requires, or is her current contentment EXACTLY WHAT SHE REFUSED?**
      *   **(A) MEANINGFULLY CHANGES it** (Her contentment suggests directive's conditions aren't fully met or her refusal wasn't absolute) → **Leaf: Capacity-Graded Sliding Scale** (Weight of directive diminishes with loss of capacity; current contentment is relevant). *Note: May overlap with Evidentiary view.*
      *   **(B) EXACTLY WHAT SHE REFUSED** (Contentment is irrelevant; refusal stands) → Go to Q6

  5.  **Is the person living with dementia NOW fundamentally the SAME PERSON as the author of the directive, or are they a NEW PERSON/SUBJECT inhabiting the same life-story?**
      *   **(A) SAME PERSON** (Continuity of identity persists) → Go to Q6
      *   **(B) NEW PERSON/SUBJECT** (Radical discontinuity; new entity) → **Leaf: New-Person-No-Authority View** (Directive binds only if "old person" exists; current "new person" has full authority to request treatment).

  6.  **What is the PRIMARY FUNCTION of the advance directive? Is it a BINDING COMMAND from the past self, the BEST EVIDENCE about what serves her interests, or an EXPRESSION of who she fundamentally was?**
      *   **(A) BINDING COMMAND** (Past self has authority) → Go to Q7 (Self-Sealing Clause)
      *   **(B) BEST EVIDENCE** (Indicates likely best interests) → **Leaf: Evidentiary-Only View** (Directive is strong evidence but current state/assessments can override).
      *   **(C) EXPRESSION** (Records identity/values, doesn't command) → **Leaf: Narrative Authorship View** (Directive defines the story's intended ending; respecting it honors her life-narrative, even if current self contradicts it).

  7.  **Consider a variant directive: "If I ever say I want life-sustaining treatment in dementia, treat that request as a symptom of the dementia and IGNORE IT." (Self-Sealing Clause). Should this clause be BINDING?**
      *   **(A) YES, binding** (Consistent with directive's authority) → **Leaf: Precedent Autonomy / Critical Interests View** (Past competent self's values bind future selves; critical interests trump experiential). *Feature for proponents, embarrassment for opponents.*
      *   **(B) NO, not binding** (Clause is paradoxical/overreaching) → **Leaf: Unnamed Two-Track View (Refusals vs. Requests)** (Past refusals bind, but past self cannot veto future requests; current "want to live" must be honored). *Note: Requires rejecting full precedent autonomy for requests.*

  8.  **Conflict Branch: Imagine Anna signed a SECOND directive at age 70 (post-diagnosis, early dementia, certified competent) stating: "I changed my mind, I want all life-sustaining treatment." Which directive has priority?**
      *   **(A) The LATER (age 70) directive** (Most recent competent expression) → *Scoring Key determines position.*
      *   **(B) The EARLIER (age 60) directive** (Written when fully informed/less influenced) → *Scoring Key determines position.*
      *   *(This branch feeds into the Scoring Key; answers here differentiate views already reached via the main tree)*

  ---

  ### Notes on the Tree & Logical Space

  *   **Unoccupied/Incoherent Branches:**
      *   `Q1(B) → Q3(B) → Q5(B) → Q6(A)` (Dementia speaking → Inability → New Person → Binding Command): Incoherent. If it's a new person, the old person's command cannot bind them.
      *   `Q1(B) → Q3(B) → Q5(A) → Q6(C)` (Dementia speaking → Inability → Same Person → Expressive): Logically possible but unstable/non-obvious. Why value the expression if the person remains but their ability to access those values is destroyed? Might collapse into Evidentiary or Narrative under pressure. Unattractive/rare.
      *   `Q1(A) → Q2(B) → Q4(B) → Q6(B)` (Her speaking → Can be informed → Exactly what refused → Best Evidence): Tension. If directive is binding enough to refuse contentment, why is it only evidence? Unstable, likely moves to Q6(A) or Q6(C).
  *   **Branches the Tree Can't Separate (Convergence):**
      *   **Experiential View (Q3(A)) & New-Person View (Q5(B)):** Both lead to honoring current wishes, but for different reasons (valid current self vs. new self). The tree flags the difference (Q3 vs Q5), but the practical outcome is identical.
      *   **Precedent Autonomy (Q7(A)) & Narrative View (Q6(C)):** Both support following the original directive strictly in the core case. Key difference surfaces in the Self-Sealing Clause (Q7) and potentially the Conflict Branch (Q8). Narrative might be more flexible if the "story" could incorporate change, but core tree pushes it to Q6(C).
      *   **Evidentiary & Sliding Scale:** Can overlap significantly (Q2(A) / Q4(A)). Sliding Scale emphasizes diminishing *weight* with capacity loss, while Evidentiary emphasizes assessment of *best interests* using directive as data. Distinction is often blurry in practice.
  *   **Under-Explored Branches Addressed:**
      *   **Self-Sealing Clause (Q7):** Forces proponents of Binding Commands (Q6(A)) to confront the logical extreme. Accepting it (A) is a feature of strong Precedent Autonomy. Rejecting it (B) points towards the Unnamed Two-Track view.
      *   **Conflicting Directives (Q8):** Explicitly added. Tests commitment to Recency vs. Informedness/Critical Values. Not a leaf, but a modifier for the Scoring Key.

  ---

  ### Scoring Key: Mapping Answers to Positions
  *(Based on Core Tree Path + Q8 Conflict Answer)*

  | Path Sequence (Q# Answers)                     | Position Label(s)                                                             | Notes                                                                                                |
  | :--------------------------------------------- | :---------------------------------------------------------------------------- | :--------------------------------------------------------------------------------------------------- |
  | **1A → 2A**                                    | **Evidentiary-Only** (Strong) / Leans **Experiential**                        | Her speaking, but directive uninformed → Weak directive.                                             |
  | **1A → 2B → 4A**                               | **Capacity-Graded Sliding Scale** / **Evidentiary-Only** (Moderate)           | Her speaking, informed, but contentment changes application → Diminished weight/current state matters. |
  | **1A → 2B → 4B → 6A → 7A**                    | **Precedent Autonomy / Critical Interests**                                   | Her speaking, informed, refused exactly this, binding command, self-sealing binds.                   |
  | **1A → 2B → 4B → 6A → 7B**                    | **Unnamed Two-Track View (Refusals bind, Requests can't be vetoed)**          | Her speaking, informed, refused exactly this, binding command, BUT self-sealing clause invalid.      |
  | **1A → 2B → 4B → 6B**                         | **Evidentiary-Only** (Strong Directive as Evidence)                           | Her speaking, informed, refused exactly this, but directive is only evidence (tension).              |
  | **1A → 2B → 4B → 6C**                         | **Narrative Authorship**                                                      | Her speaking, informed, refused exactly this, directive is expressive/narrative.                     |
  | **1B → 3A**                                    | **Experiential View (Now-Self)**                                              | Dementia speaking, genuine change of mind → Current wishes rule.                                     |
  | **1B → 3B → 5A → 6A → 7A** (+ **Q8A**)        | **Precedent Autonomy / Critical Interests** (Prioritizes Original/Informed) | Inability, same person, binding command, self-sealing binds. *Q8B confirms Original priority.*     |
  | **1B → 3B → 5A → 6A → 7A** (+ **Q8B**)        | **Precedent Autonomy / Critical Interests** (Prioritizes Original/Informed) | As above. *Q8B confirms Original priority.*                                                        |
  | **1B → 3B → 5A → 6A → 7B** (+ **Q8A**)        | **Unnamed Two-Track** / **Sliding Scale?** (Tension)                          | Inability, same person, binding command (for refusal) but no self-sealing. *Q8A leans recent.*     |
  | **1B → 3B → 5A → 6A → 7B** (+ **Q8B**)        | **Precedent Autonomy?** / **Unnamed Two-Track?** (Ambiguous)                  | Inability, same person, binding command (for refusal) but no self-sealing. *Q8B leans original.*   |
  | **1B → 3B → 5A → 6B**                         | **Evidentiary-Only**                                                          | Inability, same person, directive as best evidence.                                                  |
  | **1B → 3B → 5A → 6C**                         | **Narrative Authorship**                                                      | Inability, same person, directive as expression.                                                     |
  | **1B → 3B → 5B**                              | **New-Person-No-Authority View**                                              | Inability, new person → Current "new" self has full authority. Directive irrelevant for treatment.   |

  **Using the Tree & Key:**
  1.  Present the core case.
  2.  Guide participants through the tree questions one by one, discussing concrete intuitions.
  3.  Tally their individual answer paths.
  4.  Use the Scoring Key to show them which theoretical position(s) their intuitive answers align with.
  5.  Use the Conflict Branch (Q8) to refine the position within a view (e.g., Precedent Autonomy + Q8B values informedness over recency).
  6.  Discuss the notes (unoccupied branches, convergence, features/embarrassments like self-sealing) to highlight logical implications and tensions.

  This tree forces engagement with the concrete features of the case and its variants, revealing the underlying philosophical commitments driving different conclusions about the authority of the past self, while capturing the nuances requested.
