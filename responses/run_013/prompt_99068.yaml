prompt: |-
  ok so before i read more theories of consent i want to know what an adequate one actually has to do. not a definition -- the desiderata. the cases any theory of "this consent was valid / it wasn't" has to get right, the distinctions it can't collapse, the stuff it has to stay consistent with.

  purpose first, since i know "adequate" is relative: i want a standard a hospital ethics committee or a data-protection regulator could apply, so it has to be usable by someone who can't read minds and often has to judge before the fact rather than after. keep that in mind for anything about feasibility.

  here are the cases i keep tripping on. tell me which are genuine constraints on any theory and which are just me being confused:

  - the threat nobody issues. someone takes a dangerous job because they're broke. no coercer exists, there's no threatener to point at, but it feels wrong to call it free. a theory either counts this as valid or it has to explain why the absence of a threat-maker doesn't matter.
  - consent to a bundle. i agree to a study; the protocol quietly shifts a year later to something i'd have refused; i never withdraw. valid or not?
  - the unverifiable condition. i consent "provided the surgeon is the most qualified available," but neither i nor the committee can check that. can a valid consent rest on a condition nobody can evaluate? if yes, what's left of the information requirement; if no, almost no real-world consent survives.
  - consent that changes what i'll want. i agree to a treatment that will, as a side effect, make me more pliable about future treatments. can consent to X be valid when X undermines the standing of my later consent -- and do we judge the first consent by my before or after values?
  - the person who can't be wrong about their own competence. we call someone incompetent to consent if they can't understand what they're agreeing to, but "understand" how well, and who sets the bar without already smuggling in a standard of competence?
  - act vs. state. i sign but don't want it; or i want it but never say so. which one is the consent?

  then the requirements list proper -- each requirement with the case or consideration behind it -- and please seperate the ones that are real constraints on any theory from the ones that are really just house preferences of one camp (the autonomy people vs. the welfare people). what i most want is the pairs you think can't be had together. i have a hunch that "fully informed" and "decidable by a committee in advance" pull against each other, and maybe "tracks the agent's actual will" vs. "legible/checkable from the outside" too. if some subset is jointly unsatisfiable, say so -- that's the actual result i'm after.

  skip the scorecard of which theorist wins, i'll do that part myself.
reasoning: |-
  Okay, the user is asking about the desiderata for a theory of consent that's practical for institutional use, like a hospital ethics committee or data regulator. They want to know what an adequate theory must achieve, the constraints it must satisfy, and any inherent tensions between requirements. They've listed several tricky cases and want to understand which are genuine constraints and which might stem from confusion.

  First, I need to address their cases one by one. The threat without a threatener—like taking a dangerous job due to poverty. This challenges theories that require explicit coercion. The key here is distinguishing between coercion (external threats) and constraints from circumstances. For institutional purposes, we can't invalidate consent just because of background injustice; otherwise, too many consents would be invalid, which isn't practical. So this case highlights the constraint that a theory must handle structural pressures without collapsing all consents under duress.

  Next, consent to a bundle where the protocol changes later. This tests dynamic vs. static consent. Institutions need clear rules, so the theory must require mechanisms for ongoing consent or specify conditions under which changes are permissible without re-consent. The constraint here is ensuring consent remains meaningful over time without making it administratively unfeasible.

  The unverifiable condition case, like consenting only if the surgeon is the most qualified. This pits internal will against external verification. Institutions can't rely on conditions they can't verify, so the constraint is that conditions must be monitorable. This means consent theories must either discard unverifiable conditions or treat them differently, impacting how information requirements are applied.

  Consent that alters future desires, such as treatments making one more pliable. This involves the stability of the agent's will over time. The constraint is ensuring that consent doesn't undermine future autonomy. The theory needs to address whether such effects invalidate initial consent and whose values matter—pre or post-treatment. This ties into core autonomy principles but must be balanced with feasibility.

  Determining competence without circularity. The challenge is setting a standard for understanding that isn't self-referential. The constraint is that competence must be assessed based on functional abilities, not the content of the decision, to avoid paternalism. Institutions need clear, operational criteria, which might not capture all nuances but must be workable.

  Act vs. state of consent—signing without wanting vs. wanting without signing. This gets at the expression vs. internal state. For institutions, the expression is necessary because they can't access internal states. The constraint is that consent must be externally verifiable, prioritizing clear signals over subjective states.

  Now, the core requirements. The user wants pairs that conflict. Key tensions include:

  1. Fidelity to will vs. institutional legibility. Internal states are hard to verify, so institutions rely on expressions, which might not match true will. This is a fundamental tension.

  2. Full information vs. pre-decisional feasibility. Requiring full understanding might be ideal, but in practice, information is always incomplete. Institutions need actionable standards, so they might use "reasonable person" standards instead.

  3. Dynamic will-tracking vs. finality. Consent that adapts to changing wishes is more ethical but harder to implement. Institutions need closure for practicality, leading to fixed points like signed forms.

  4. Non-exploitation vs. neutrality. Preventing exploitation (like in poverty cases) requires normative judgments, but institutions must avoid imposing values. This creates a tension between protecting welfare and respecting autonomy without bias.

  The user's deeper need seems to be identifying where a theory must sacrifice one value for another in practice. They might be designing policies or evaluating theories for real-world application, needing to know which trade-offs are unavoidable. Highlighting the joint unsatisfiability of certain pairs (like will-tracking and legibility) addresses their hunch and provides the "actual result" they seek.
answer: |-
  Here's a breakdown of consent desiderata for your institutional use case, focusing on necessary constraints, inherent tensions, and your specific cases. The goal is a **practically applicable standard for external adjudicators** (like ethics committees/regulators) who **cannot read minds** and often judge **prospectively**.

  **I. Your Cases: Genuine Constraints vs. Potential Confusions**

  1.  **The Threat Nobody Issues (Dangerous job due to poverty):**
      *   **Constraint:** A theory *must* distinguish between **coercion** (wrongful threat by an agent) and **constraint** (background injustice/circumstance). Invalidating consent due to mere constraint (poverty, lack of options) would collapse *most* consents in an unjust world, rendering the concept useless for institutions. An adequate theory must explain why this is *constrained but possibly valid* consent, while still accounting for its moral weight (e.g., highlighting vulnerability, requiring stronger safeguards, justifying policy intervention). The absence of a coercer *is* crucial – this is fundamentally different from "Sign this or I break your legs."

  2.  **Consent to a Bundle (Protocol shifts later):**
      *   **Constraint:** A theory *must* address **scope and duration**. Consent is inherently tied to the *specific act/arrangement* presented. A significant, material deviation (especially one the agent would have refused) generally invalidates consent unless:
          *   The original consent explicitly covered foreseeable changes *of that nature* (broad but specific authorization).
          *   There's a clear, feasible, and utilized mechanism for *ongoing* consent/re-negotiation.
      *   *Your Case:* This is likely **invalid consent** for the *changed protocol*, absent the above. Silence ≠ consent to material change. The challenge is defining "significant/material deviation" prospectively.

  3.  **The Unverifiable Condition ("Most qualified surgeon"):**
      *   **Constraint:** **External verifiability is essential for institutional application.** A theory *must* handle conditions. If a condition is *inherently unverifiable* by the institution/agent *at the relevant time*:
          *   **Option A:** The condition renders the consent **invalid or conditional in a way that prevents action** until verification is possible. (Impractical, often paralyzing).
          *   **Option B (Practical Constraint):** The consent is interpreted as valid *only if* the agent was informed the condition *could not be verified* and consented anyway, *or* the condition is treated as an expression of preference/wish rather than a strict validity condition. **This highlights a core tension:** Strict adherence to internal will vs. institutional feasibility. Unverifiable conditions undermine the "information" requirement's *practical* purpose for *ex ante* judgment.

  4.  **Consent Changing Future Wants (Treatment making you pliable):**
      *   **Constraint:** A theory *must* grapple with **temporal stability of the agent's will and competence.** This is a **core challenge** for autonomy-based views.
          *   **Initial Consent:** Validity is judged based on competence/voluntariness/information *at the time of consent*. If the treatment *causes* future incompetence/undue influence, and this risk was *known and undisclosed*, the initial consent is likely invalid due to lack of information. If the risk was disclosed and understood, consent might be valid *initially*.
          *   **Future Consent:** The *future* consent, influenced by the treatment, is judged based on competence/voluntariness *at that future time*. If the treatment renders the agent incompetent or unduly influenced, future consent is invalid. The initial consent doesn't automatically validate the future ones.
          *   **Constraint:** The theory must distinguish the validity of *distinct acts* of consent at different times, even if one causally influences the other. Judging "initial consent by after values" is incoherent.

  5.  **Setting the Competence Bar Without Circularity:**
      *   **Constraint:** **Competence assessment must avoid purely content-based judgments.** It *cannot* be "understands well enough to make the *right* (approved) decision." The standard must be **functional**:
          *   Can the agent understand the *nature* of the act/procedure?
          *   Can they understand the *foreseeable* material risks, benefits, and alternatives?
          *   Can they understand the *implications* (personal, social, etc.)?
          *   Can they *reason* about this information in a relatively consistent way relevant to their own values/situation?
      *   **Constraint:** The *level* of understanding required ("how well") must be **context-dependent** (higher for major risks/complexities) but defined **prospectively and generally** (e.g., "reasonable understanding for a person in this situation," assessed via standardized tools/conversations). Perfect understanding is impossible; the bar is "adequate for a meaningful choice." Circularity is avoided by focusing on *process* (can they grasp/use the info?) not *outcome* (do they agree with us?).

  6.  **Act vs. State (Sign vs. Want):**
      *   **Constraint:** For institutional, external adjudication, **consent must be an *externally manifested communicative act***. The internal mental state ("wanting") alone is insufficient because it's inaccessible. Conversely, a signature without any underlying willingness (e.g., forged, signed under immediate duress with a gun to the head) is not valid consent.
      *   **Constraint:** A theory *must* require **both**:
          1.  A **voluntary internal state** of agreement (or at least, absence of dissent where dissent is possible/expected).
          2.  An **external expression** (verbal, written, clear gesture) signifying that agreement *to the relevant parties*.
      *   *Your Cases:* Signing but not wanting (with no coercion/mistake) is **invalid** (expression without state). Wanting but never saying so is **invalid** (state without expression). Institutions fundamentally rely on the *expression* as the primary, verifiable evidence of the state.

  **II. Core Desiderata & Inherent Tensions**

  Here's a breakdown of requirements, their rationale (the "why"), and whether they are fundamental constraints or involve camp preferences. Crucially, **the tensions often arise between requirements essential for respecting autonomy and requirements essential for institutional feasibility/protection.**

  | **Desideratum** | **Rationale (The "Why")** | **Constraint or Preference?** | **Key Tensions** |
  |-----------------|---------------------------|------------------------------|------------------|
  | **1. Voluntariness**<br>(Absence of coercion/undue influence) | Core of autonomy. Coercion negates choice. | **Fundamental Constraint** | Vs. **Institutional Legibility** (Proving internal state). Vs. **Feasibility** (Handling background constraints like poverty). |
  | **2. Competence**<br>(Capacity to understand/decide) | Necessary for meaningful choice. Protects vulnerable agents. | **Fundamental Constraint** | Vs. **Non-Circular Standard** (Avoiding paternalism). Vs. **Feasibility** (Setting clear, prospective bars). |
  | **3. Information**<br>(Adequate disclosure of material facts) | Enables understanding of choice. Without it, agreement isn't to the *actual* proposal. | **Fundamental Constraint** | Vs. **Full Information Feasibility** (Perfect knowledge impossible). Vs. **Decidability** (Defining "material" prospectively). |
  | **4. Specificity/Scope**<br>(Clear boundaries of consent) | Respects autonomy by ensuring consent matches what occurs. | **Fundamental Constraint** | Vs. **Feasibility** (Managing bundled/broad consent). Vs. **Dynamic Will-Tracking** (Handling changes over time). |
  | **5. Fidelity to Will**<br>(Consent reflects agent's actual choice) | The *point* of consent is respecting the agent's decision. | **Fundamental Constraint** | **PRIMARY TENSION:** Vs. **Institutional Legibility/Verifiability** (Cannot read minds). |
  | **6. Institutional Legibility/Verifiability**<br>(Consent must be externally observable/assessable) | Mandatory for *any* external adjudicator (committee, regulator). | **Fundamental Constraint** | **PRIMARY TENSION:** Vs. **Fidelity to Will**. Vs. **Unverifiable Conditions**. |
  | **7. Feasibility/Decidability**<br>(Standards usable prospectively by non-mind-readers) | Necessary for real-world application (your hospital/regulator context). | **Fundamental Constraint** | Vs. **Full Information**. Vs. **Perfect Voluntariness Assessment**. Vs. **Dynamic Will-Tracking**. |
  | **8. Dynamic Will-Tracking**<br>(Consent adapts if agent's will changes) | Maximizes fidelity to will over time. | **Strong Autonomy Preference** | Vs. **Feasibility/Decidability/Finality** (Need closure). Vs. **Scope** (Managing changes). |
  | **9. Non-Exploitation**<br>(Prevent consents exploiting vulnerability) | Protects welfare/promotes justice. | **Welfare/Justice Preference** | Vs. **Neutrality** (Avoiding substantive judgment of choices). Vs. **Feasibility** (Defining "exploitation"). |
  | **10. Finality**<br>(Consent provides permission to proceed) | Provides practical certainty for action. | **Institutional Feasibility Constraint** | Vs. **Dynamic Will-Tracking**. Vs. **Perfect Fidelity** (What if they change mind instantly?). |

  **III. Key Jointly Unsatisfiable Pairs (The Tensions You Suspected)**

  1.  **Fidelity to Will (Actual Internal State) vs. Institutional Legibility/Verifiability:** This is **the core, fundamental tension**. You *cannot* have perfect knowledge of the internal state without mind-reading. Any practical theory *must* rely on proxies (expression, context, competence assessment) that are imperfect indicators of the true will. **Trade-off:** Legibility requirements (clear expressions, documented processes, ignoring unverifiable conditions) inherently risk overriding or misrepresenting the actual internal state in some cases.

  2.  **"Fully Informed" vs. Feasibility/Decidability (Prospective Judgment):** Perfect, complete information is impossible. Defining "fully" prospectively for diverse agents is impossible. Committees need clear, operationalizable standards for "adequate" or "material" information *in advance*. **Trade-off:** "Fully informed" becomes "reasonably informed given the context and agent capacity" or "disclosure of material risks a reasonable person/this person would want," which are necessarily imperfect approximations.

  3.  **Fidelity to Will / Dynamic Will-Tracking vs. Finality & Feasibility:** Truly tracking an agent's will moment-to-moment (e.g., revoking consent silently by changing their mind) is incompatible with the need for institutions to have clear signals (like signed forms or verbal "stop") and to be able to rely on consent to proceed with actions (surgery, data processing). **Trade-off:** Consent processes require clear "on/off ramps" (expressions of agreement/withdrawal) and often treat consent as valid until explicitly revoked *in a recognized way*, even if the internal state changes earlier.

  4.  **Non-Exploitation (Welfare) vs. Neutrality (Autonomy):** Strict autonomy views resist invalidating consent solely because the choice seems bad or exploitative *to the committee*, fearing paternalism. Welfare views demand intervention to prevent harmful outcomes, even from "voluntary" choices under duress/constraint. **Trade-off:** Defining "undue influence" or "exploitation" prospectively without imposing the committee's values is extremely difficult. Resolving your "threat nobody issued" case lives here. A theory must balance protecting vulnerable agents from severe harm against respecting their choices under difficult circumstances.

  **Conclusion for Your Purpose:**

  An adequate theory for institutional use (hospital, regulator) **must** prioritize **Legibility, Verifiability, Feasibility, and Decidability** alongside the core constraints of **Voluntariness (freedom from coercion), Competence, Adequate Information, and Specificity**. This inherently means:

  *   **Relying heavily on clear external expressions** as the primary evidence of consent.
  *   **Defining competence functionally and prospectively** with standardized tools.
  *   **Defining "adequate information" as disclosure of "material" risks/benefits/alternatives** based on reasonableness or context, not perfection.
  *   **Treating consent as bounded by its scope** and requiring re-consent for material deviations.
  *   **Distinguishing coercion from constraint**, generally validating the latter while mandating heightened scrutiny/safeguards.
  *   **Requiring verifiable conditions** or interpreting unverifiable ones cautiously.
  *   **Accepting some imperfection in tracking the true, dynamic internal will** in favor of workable processes and finality.

  The tensions, especially **Internal Will vs. External Verification** and **Ideal Information vs. Practical Standards**, are not resolvable; they define the practical landscape of consent governance. Your goal is finding a theory that navigates these tensions with the most defensible balance for the specific high-stakes, institutional context you're concerned with. Theories will differ primarily in *how* they manage these trade-offs, particularly between maximizing fidelity to individual autonomy and ensuring robust, administrable institutional protections.
