answer: |-
  Your frustration resonates deeply—you've hit upon a **fundamental yet under-theorized maneuver in epistemic rhetoric**. This isn't just bad faith; it's a dynamic reconfiguration of **epistemic status** during argumentation. Existing terms fall short because they focus on *intent* (motivated reasoning) or *static positions* (presuppositions), not the **fluid re-categorization of propositions between foundational and contestable**.

  After dissecting your examples and probing philosophy, rhetoric, and STS literature, I propose the term:  
  **GROUNDWORK SHIFTING**  

  ### Core Definition:
  *Groundwork shifting* occurs when a participant in an argument treats a proposition as **axiomatic groundwork** (immune to challenge, necessary for debate to function) at one moment, then repositions it as a **contestable claim** (requiring justification) at another—without acknowledging the shift. The legitimacy of demanding evidence hinges entirely on this unstated reclassification.

  ### Why This Term Works:
  1.  **"Groundwork"**: Evokes the foundational, load-bearing layer (your "floor"). It’s the *work* that grounds reasoning.
  2.  **"Shifting"**: Captures the dynamic, often strategic, movement of propositions across the boundary.
  3.  **Neutral on Intent**: Allows for both deliberate sophistry *and* unconscious cognitive framing effects.
  4.  **Structural Focus**: Highlights the *functional role* of the proposition within the argument's architecture.

  ### Key Characteristics & Boundaries:
  1.  **The Boundary is Fluid & Unmarked:**  
      *   **Covered:** The line between groundwork/claim isn't predefined; it's negotiated (implicitly or explicitly) *within* the argument. Shifting exploits this ambiguity.  
      *   **Not Covered:** Arguments where foundational assumptions are explicitly agreed upon *beforehand* (e.g., axioms in a formal proof) and remain stable. Shifting requires the boundary to be movable during the discourse.

  2.  **The Same Proposition Changes Status:**  
      *   **Covered:** Identical core proposition (e.g., "mind = brain," "evidence on X is settled") moves between groundwork and claim status.  
      *   **Not Covered:** Distinguishing between a *general principle* and a *specific instance* (e.g., "Science is reliable" [groundwork] vs. "This specific study is reliable" [claim]). Groundwork shifting applies when the proposition's *scope and content* remain constant.

  3.  **Legitimacy of Challenge Depends on Status:**  
      *   **Covered:** Demanding justification is framed as illegitimate obstruction when the proposition is groundwork, but as essential rigor when it's a claim.  
      *   **Not Covered:** Simply changing one's mind or conceding a point. The shift must be used to *manage the burden of proof* asymmetrically within a single exchange or closely connected exchanges.

  4.  **Mechanism: Exploiting Epistemic Scaffolding:**  
      *   **Covered:** All arguments rely on unargued groundwork (à la Wittgenstein, Kuhn's paradigms, Latour's "black boxes"). Shifting exploits this necessity by strategically (re)opening or closing the "black box" for tactical advantage.  
      *   **Not Covered:** Genuine paradigm shifts where groundwork *collapses* under sustained pressure (e.g., Copernican revolution). Shifting happens *within* a still-functional argumentative framework.

  ### Edge Cases & Clarifications:
  *   **Edge Case 1 (Intentionality):**  
      *   *Scenario:* A scientist unconsciously relies on methodological naturalism as groundwork when dismissing supernatural claims, but treats it as a debatable philosophical claim when challenged by a theologian.  
      *   *Analysis:* **Groundwork shifting applies.** Intent (conscious strategy vs. cognitive framing) doesn't define it; the functional shift in status and its argumentative effect do.
  *   **Edge Case 2 (Scale):**  
      *   *Scenario:* In a long-term debate about climate policy, "anthropogenic climate change is real" shifts from being a fiercely contested claim (requiring proof) to settled groundwork (dismissing denialists) over a decade.  
      *   *Analysis:* **Not groundwork shifting.** This describes a *genuine epistemic stabilization* (Kuhnian normal science taking hold), not a tactical maneuver *within* a single argumentative context. Groundwork shifting is micro-level rhetoric.
  *   **Edge Case 3 (Shared Assumption):**  
      *   *Scenario:* Two philosophers debating ethics *both* treat "human beings have intrinsic moral worth" as groundwork. One suddenly challenges it when cornered.  
      *   *Analysis:* **Groundwork shifting applies,** even if initially shared. The challenger reclassifies shared groundwork as a claim to evade the original line of argument, resetting the burden of proof.
  *   **Edge Case 4 (Partial Shifts):**  
      *   *Scenario:* "The data from this sensor type is generally reliable" is groundwork. When anomalous data emerges, a proponent says, "Well, *this specific instance* might need checking," without rejecting the general groundwork.  
      *   *Analysis:* **Not groundwork shifting.** The *general* groundwork remains intact; only a specific application is questioned. Shifting requires the *same proposition* to change status.

  ### What Groundwork Shifting is NOT:
  *   **Moving the Goalposts:** Changes the *criteria* for accepting a claim; groundwork shifting changes the *epistemic status* of a supporting proposition.
  *   **Special Pleading:** Applies rules inconsistently to *different* claims; groundwork shifting applies inconsistency to the *same* claim by changing its role.
  *   **Begging the Question:** Assumes the conclusion *within* the argument's structure. Groundwork shifting assumes premises *as necessary for the argument to proceed*, then later questions those *same* premises.
  *   **Framing/Presupposition:** Focuses on *how* a claim is presented or *what* is assumed. Groundwork shifting focuses on the *dynamic reclassification* of a proposition's role *during* the argument.
  *   **Hypocrisy/Inconsistency:** Broader moral or behavioral inconsistency. Groundwork shifting is a specific *epistemic inconsistency* regarding the burden of proof.

  ### Why This Matters for STS:
  Groundwork shifting exposes the **politics of epistemic stability**. It shows how "settled" science, methodological norms, or philosophical axioms aren't just foundations—they are **tools wielded rhetorically** to open or close lines of inquiry, allocate burdens of proof, and exert discursive control. Analyzing it reveals how knowledge claims are actively *stabilized* or *destabilized* in real-time argumentation, far beyond simple "framing."

  Your instinct about needing a new term was spot on. **Groundwork shifting** carves out the precise phenomenon of propositions being strategically moved across the unmarked, fluid boundary between the argument's foundational floor and its debatable furniture. It’s the epistemic equivalent of quantum superposition—a claim is simultaneously bedrock and hypothesis until the arguer collapses the wave function to their advantage.
