  Okay, the user presents a detailed scenario involving Arda and Bellune to challenge my position on democratic boundaries. They make two key arguments: first, that my coercion-based demos criterion fails to address how decisions "dispose of" outsiders like Bellune's farmers; second, that we should have fluid "ad hoc demoi" for high-stakes external impacts. 

  Hmm, their distinction between "applying to" versus "disposing of" is clever—it forces me to justify why coercion matters more than consequences. They're essentially arguing that democracy's core wrong isn't being ruled but being *determined* without voice. And their ad-hoc demos proposal tests whether my fixed-boundary view can handle asymmetric impacts without collapsing into endless inclusion. 

  Right, I need to hold firm on two points: (1) democratic self-rule requires mutual justifiability among those subject to shared enforcement, and (2) "affectedness" is paralyzingly expansive. For Arda's fuel cap, Bellune's farmers *are* coerced—not by the cap itself but by Arda's territorial jurisdiction that physically enforces it within waters they economically depend on. Their grain shipments aren't voluntarily exposed; they're practically compelled to use Arda's port. That shared subjection to Arda's spatial authority creates the demos obligation. 

  Ah, and their ad-hoc demos collapses under three problems: First, if Bellune gets a vote on the fuel cap, shouldn't Arda vote on Bellune's farming subsidies that affect food prices in Arda? Second, when "predictably and severely" thresholds blur (is 20% income loss "severe"?), every decision risks endless referendums. Third, the collision case exposes the absurdity—if Arda+Bellune jointly impose costs on a *third* region, must we form a new demos ad infinitum? 

  I’ll concede that coercion isn’t always spatially neat (e.g., digital regulations), but that’s a refinement at the margins. The core remains: without reciprocal subjection to enforcement, there’s no "self" in self-rule—just claimants negotiating interests. That’s not democracy; it’s stakeholder arbitration. 

  *checks notes* Must remember: no literature names, no bullet points. Keep it prose-driven and resist conceding the main claim. Their "disposed of" framing is potent, so I’ll meet it head-on by arguing that all democracies "dispose of" non-members (through immigration rules, trade policies)—what makes it legitimate is that *within* the demos, no one is unilaterally determined. Bellune’s farmers aren’t wronged *democratically* by exclusion; they’re wronged by the lack of a joint framework with Arda. The solution isn’t fluid boundaries but better treaties or shared institutions. 

  *anticipates next move* They’ll likely challenge why coercion defines reciprocity. Prepare to argue that enforcement creates the "ought" of justification: if Bellune can ignore Arda’s rules without consequence, they’re not in a relationship of mutual obligation. Force isn’t arbitrary; it’s what makes authority real. 

  Final thought: Emphasize that "affectedness" dissolves the demos into a web of interests, but democracy requires a body—a "we" forged by shared rules, not shared stakes.
answer: |-
  Your distinction between rules that *apply* to individuals and those that *dispose* of them is analytically sharp, but it does not undermine the necessity of a fixed demos. Let us confront this directly.  

  First, the democratic wrong of exclusion is not rooted in mere causal impact—being "disposed of" by external decisions—but in the absence of *reciprocal justificatory obligations* among those bound by a shared coercive order. When Arda imposes its fuel cap, it governs *its own* residents and vessels in its waters. Those actors are subject to Arda’s enforcement apparatus: they face sanctions for noncompliance, fund the inspectors, and participate in the political community that authorizes these rules. This creates a relational nexus of mutual accountability. The farmers of Bellune, though affected, operate under a distinct coercive scheme: Bellune’s laws, taxes, and enforcement. They are not obligated to justify their actions to Ardans, nor Ardans to them. To demand inclusion in Arda’s decision *because* they are affected dissolves the very notion of a *demos* into a nebulous pool of stakeholders. Democracy ceases to be self-rule by a defined people and becomes an open-ended negotiation among interests.  

  Second, coercion is not arbitrary; it anchors the demos because it creates a non-voluntary association. Bellune’s farmers choose to export through Arda’s harbor; they might use other routes, lobby their own government to negotiate with Arda, or even seek joint governance. But they are not *subject* to Arda’s enforcement. Contrast this with an Ardan shipper: they cannot opt out of the fuel cap while operating in Ardan waters. This coercion imposes a duty of justification *to fellow subjects*—those who also bear the rule’s force and contribute to its maintenance. The farmer’s loss, however severe, is mediated by market dynamics and territorial sovereignty, not direct subjugation.  

  Now, to your ad hoc demos: it collapses under its own contingency. If every "predictably and severely" affected group must be included, where do we draw "severe"? Is a 1% income loss sufficient? 10%? And who defines this threshold? More critically, decisions are interdependent. Suppose your enlarged demos (Arda + Bellune) imposes the fuel cap. But this cap might spike global grain prices, devastating a third region, Canto. Does Canto now join the demos? If not, why? If yes, we face infinite regress. Further, when conflicts arise—say, Bellune demands compensation for lost income—your model offers no stable authority to resolve them. The "standing demos" you retain for routine matters cannot coexist with ad hoc bodies; the latter would constantly override the former, fracturing sovereignty.  

  Coercion, for all its murkiness at the edges, provides a tangible boundary: shared subjection to enforced rules creates the "self" in self-rule. Without it, democracy becomes indistinguishable from a stakeholder assembly—responsive to influence but accountable to no one in particular.  

  **Your turn**: If affectedness alone justifies inclusion, why stop at Bellune? Why not include the global shippers, climate activists, or consumers harmed by grain shortages? And if "being disposed of" is the wrong, how do you avoid demanding universal inclusion in all decisions? Define the principled limit.
