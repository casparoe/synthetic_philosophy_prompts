answer: |-
  Your objection is sharp, but it misconstrues the core distinction. Let's take your kind master. The slave's unfreedom doesn't hinge on the *likelihood* or *cost* of interference (the modal facts negative libertarians track). It hinges on the *structural relationship itself*. The master possesses unchecked power to interfere at whim—power unconstrained by the slave's interests or voice. Even if statistically safe today, the slave lives subject to another's arbitrary will. That's a relational condition, not a probabilistic forecast of harm.

  You're right that "arbitrary" carries normative weight—it denotes power unanswerable to the interests of those affected. But this isn't smuggled-in legitimacy theory; it's integral to *describing the domination*. The slave isn't merely insecure; they are subordinated. Their choices exist only by the master's grace, not as a matter of right or protected status. Negative liberty sees chains; we see the *position* of the chained—even when the chains hang slack.

  Is this about "authority" rather than "liberty"? Only if we divorce liberty from social reality. Freedom isn't atomistic; it's shaped by power relations. To be free is to stand as an equal, not subject to another's arbitrary power. Your kind master *could* sell the slave tomorrow on a whim. That latent capacity, rooted in an unconstrained power imbalance, defines the slave's unfreedom *now*. Negative liberty misses this because it fixates on overt interference, not the architecture of dependence. So no, I'm not just tracking insecurity more acutely. I'm identifying a distinct evil: being at the mercy of another.

