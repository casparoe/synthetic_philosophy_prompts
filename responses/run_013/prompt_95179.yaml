prompt: |-
  After a long career at the bench in molecular biology, I have spent my retirement reading philosophy of biology, and I keep meeting the claim that DNA is a code, or that genes carry information, in contexts where I can no longer tell what is being asserted. Before I commit to any account, I want the specification: what must an adequate theory of genetic information — or of the coding claim in particular — be able to do? Set out the desiderata, each with the case or consideration behind it, and separate the requirements that are genuine from those that are merely commitments of one camp. Three considerations from my own work must appear on the list, and I want to see how each constrains the others: that the same codon can be reassigned in different lineages, so that what a triplet means is settled by the translation apparatus rather than by the sequence alone; that a single stretch of DNA can be read in overlapping frames and yield more than one product; and that information in the Shannon sense is defined without any notion of content, so the term cannot carry the explanatory weight by itself. Tell me whether any subset of the requirements is jointly unsatisfiable — I suspect that demanding a meaning intrinsic to the sequence collides with the context-dependence above — and which single requirement does the most to rule out the candidate accounts. The purpose I have in mind is a practical one: an account that will let me say, in a way I would defend at a seminar, when it is literally true that a piece of DNA carries information about something, and when the coding talk is only a metaphor. You need not score the existing accounts against the list; I will do that myself.
reasoning: |-
  Okay, the user is a retired molecular biologist who's diving into philosophy of biology. They're encountering claims that DNA is a code or genes carry information and want to understand what makes an adequate theory of genetic information. They need desiderata for such a theory, with three specific considerations from their work. 

  First, I need to unpack their three key considerations: codon reassignment across lineages (meaning depends on translation apparatus), overlapping reading frames (one sequence, multiple products), and Shannon information lacking semantic content. These are non-negotiable and must constrain other requirements. 

  The user wants practical criteria to distinguish literal genetic information from metaphor. They're analytical - note how they suspect intrinsic meaning clashes with context-dependence. I should flag that tension explicitly. 

  Hmm... their unspoken needs might include: reconciling their bench experience with philosophical claims, avoiding oversimplified "DNA as blueprint" narratives, and having ammunition against sloppy uses of "code" in seminars. The "defend at a seminar" point suggests they want academic rigor. 

  For desiderata, I'll start with core requirements anchored to their three points. The codon reassignment implies meaning is relational, not intrinsic. Overlapping frames break the one-sequence-one-product assumption. Shannon's limitation means we need semantic content beyond bit-counting. 

  Then expand to derived requirements: context-dependence (their main suspicion), causal specificity, functionality, evolvability, and avoiding anthropomorphism. The practical applicability requirement is crucial - they want clear litmus tests. 

  Biggest challenge? Their third consideration (Shannon) torpedoes any pure information-theory account. And yes, intrinsic meaning is dead on arrival due to codon reassignment. I'll emphasize that as the key disqualifier. 

  Should I mention specific theories? They said no scoring, but the tension between biosemiotics and causal theories might lurk in the background. Stay neutral. Focus on their framework. 

  Final checklist: Did I cover all three considerations? Codon reassignment → relational meaning. Overlapping frames → multi-functionality. Shannon → semantic requirement. And flagged the intrinsic-meaning conflict. Practical criteria included. Good.
answer: |-
  Here are the desiderata for an adequate theory of genetic information, structured around your requirements, with justifications and critical tensions highlighted. Your three considerations are integrated as core constraints.

  ### I. Core Requirements (Anchored in Empirical Reality)
  1.  **Relational Meaning (Non-Intrinsic Code):**
      *   **Requirement:** The theory must account for the fact that the "meaning" (specific amino acid assignment) of a nucleotide triplet (codon) is not determined solely by the triplet sequence itself, but by the *translation apparatus* (tRNAs, synthetases) of the organism/cell.
      *   **Case:** Codon Reassignment (e.g., UGA as Stop in most lineages vs. Selenocysteine in specific contexts; AUA as Ile in most vs. Met in some mitochondrial genomes; various non-standard codes in ciliates, yeasts). The sequence is necessary but insufficient; meaning is conferred relationally by the cellular machinery.
      *   **Impact:** Directly refutes notions of intrinsic semantic content in the DNA sequence alone.

  2.  **Multi-Functionality/Context-Dependent Parsing:**
      *   **Requirement:** The theory must account for the fact that a single, contiguous stretch of DNA nucleotide sequence can be "read" in multiple, functionally distinct ways depending on biological context.
      *   **Case:** Overlapping Reading Frames (e.g., viral genomes, bacterial operons like *trp* leader peptide, eukaryotic genes with alternative ORFs). A sequence segment can simultaneously encode part of different functional polypeptides depending on the translational start site or frame shift.
      *   **Impact:** Undermines simplistic "one sequence -> one product" models and necessitates context-dependence in interpretation.

  3.  **Semantic Content Beyond Shannon:**
      *   **Requirement:** The theory must explicitly incorporate *semantic* or *functional* content ("aboutness", specific biological effect) that goes beyond the purely syntactic, statistical definition of information (reduction of uncertainty) provided by Shannon information theory.
      *   **Case:** Shannon information quantifies the *capacity* to specify one sequence from alternatives (e.g., codon choice reducing uncertainty about amino acid identity), but says nothing about *what* that sequence *does* or *means* biologically (e.g., specifying "start" vs. "tyrosine" vs. a regulatory binding site). A high-Shannon-information sequence could be junk DNA. Biological function requires semantic content.
      *   **Impact:** Rules out accounts claiming Shannon information *alone* provides a sufficient foundation for genetic information/coding. Shannon information is necessary (channel capacity) but insufficient (lacks semantics).

  ### II. Derived Requirements (Constrained by Core & Biological Reality)
  4.  **Context-Dependence:**
      *   **Requirement:** The theory must recognize that the "information carried" or "meaning" of a DNA sequence is contingent upon the specific cellular/organismal context (developmental stage, cell type, environmental conditions, presence of co-factors, the state of the machinery itself).
      *   **Cases:** Tissue-specific alternative splicing, developmental gene regulation, conditional codon reassignment (e.g., selenocysteine insertion dependent on SECIS element), dependency of regulatory element function on specific transcription factor expression. Meaning/effect is not universally fixed.
      *   **Constraint by Core:** Reinforced by (1) Relational Meaning & (2) Multi-Functionality. Context defines *which* relational system (e.g., which tRNA set) or *which* functional parsing (e.g., which reading frame) is active.

  5.  **Causal Specificity:**
      *   **Requirement:** The theory must explain how DNA sequences exert *specific causal influence* on biological outcomes (e.g., specific polypeptide sequence, specific binding affinity, specific regulatory outcome).
      *   **Case:** Point mutations leading to specific amino acid changes with predictable functional consequences (e.g., sickle cell anemia), engineered mutations disrupting specific regulatory sites. DNA differences make specific differences to phenotypes.
      *   **Constraint by Core:** Must be compatible with (1) Relational Meaning (specificity arises from interaction with machinery) and (3) Semantic Content (specificity implies content beyond mere signal). Avoids overly vague notions of "information".

  6.  **Functionality/Teleonomy:**
      *   **Requirement:** The theory must connect information/coding to biological *function* understood naturalistically (e.g., via evolution by natural selection). Information should be tied to a *normative* aspect - sequences are "about" something because they were selected *for* causing that something.
      *   **Case:** The genetic code is near-universal *because* it works; mutations that disrupt coding/regulation are usually deleterious; sequences are maintained *for* their functional effects. "Mistakes" (e.g., misincorporation, mis-splicing) exist and are often harmful.
      *   **Constraint by Core:** Provides the evolutionary grounding for the relational systems in (1) and the semantic content in (3). Explains *why* specific relational mappings exist.

  7.  **Evolvability:**
      *   **Requirement:** The theory must be compatible with, and ideally help explain, how genetic information systems *evolve* (new codes, new regulatory information, new gene functions).
      *   **Case:** Origin and evolution of the genetic code, gene duplication and neofunctionalization, evolution of regulatory networks, instances of codon reassignment (Core 1).
      *   **Constraint by Core:** Must accommodate (1) Relational Meaning (machinery can evolve) and (2) Multi-Functionality (overlaps can be evolutionary starting points). Challenges overly rigid or ahistorical definitions.

  ### III. Practical Requirement (Your Purpose)
  8.  **Literal vs. Metaphorical Discriminability:**
      *   **Requirement:** The theory must provide clear, defensible criteria for distinguishing when attributing "information" or "coding" to DNA is literally true from when it is a useful metaphor or shorthand.
      *   **Case:** Needed for precise discussion in seminars, philosophy, and biology. Prevents equivocation and clarifies explanatory scope.
      *   **Constraint by Core:** Must draw on (3) Semantic Content, (4) Context-Dependence, and (6) Functionality. Metaphorical uses likely lack specific relational mapping, causal specificity, or selected function.

  ### IV. Avoiding Common Pitfalls (Negative Requirements)
  9.  **Non-Anthropomorphism:**
      *   **Requirement:** The theory must avoid smuggling in intentionality, agency, or mental representation as fundamental to genetic information. Meaning must be naturalized.
      *   **Case:** Avoiding analogies like "DNA is a blueprint *designed* by an engineer" or "genes *intend* to make proteins". The system evolved; its "meaning" is derivative.
      *   **Constraint by Core:** Addressed by grounding in (6) Functionality/Teleonomy (selection, not intention) and (1) Relational Meaning (physical interaction, not mental symbol).

  ### Critical Tensions & Key Constraints

  1.  **The Central Incompatibility:** Your suspicion is correct.
      *   **Requiring Intrinsic Meaning/Semantics (e.g., "codon X *means* amino acid Y inherently") is fundamentally incompatible with Core Requirement 1 (Relational Meaning) and Core Requirement 4 (Context-Dependence).** Any theory positing intrinsic, sequence-alone determined meaning is falsified by codon reassignment.

  2.  **The Most Constraining Requirement:**
      *   **Core Requirement 3 (Semantic Content Beyond Shannon) does the most to rule out candidate accounts.** It immediately eliminates:
          *   **Pure Shannon Information Theories:** They lack semantic content ("aboutness").
          *   **Simple "Blueprint" or "Recipe" Analogies:** While intuitive, they often implicitly rely on intrinsic meaning or designer intentionality, violating Non-Anthropomorphism and failing under codon reassignment/overlap.
          *   **Theories conflating information capacity (Shannon) with functional information:** They cannot distinguish functional sequence from junk DNA or noise.
      *   This requirement forces the theory to bridge the gap between syntax (sequence) and semantics (biological function).

  3.  **Other Key Constraints:**
      *   **Core Requirement 1 (Relational Meaning) and Requirement 7 (Evolvability)** strongly constrain how stable or universal the "code" can be. It must be evolvable machinery.
      *   **Requirement 2 (Multi-Functionality) and Requirement 4 (Context-Dependence)** constrain notions of specificity, requiring it to be relative to context.
      *   **Requirement 6 (Functionality/Teleonomy)** is crucial for naturalizing semantics but must be carefully distinguished from Requirement 9 (Non-Anthropomorphism).

  ### Joint Satisfiability
  *   **The core set (1, 2, 3) can be jointly satisfied.** They demand a theory where meaning is relational (1), dynamic/contextual (2 supported by 4), and involves genuine semantic content tied to function (3 & 6), arising from evolution (7), without intrinsic properties or anthropomorphism (9), while explaining causal specificity (5). This points towards theories grounded in **evolutionarily established, context-dependent causal relations between specific DNA structures and specific biological outcomes via molecular machinery**.
  *   The main tension lies *between satisfying this core set and maintaining any notion of intrinsic semantic content* (which is ruled out by 1 & 4). Accounts trying to preserve intrinsic meaning will fail Core Requirement 1.

  This framework provides the rigorous specification you sought. It grounds the desiderata firmly in biological reality (especially your three key considerations), highlights the critical constraints and incompatibilities, and sets the stage for you to evaluate whether existing accounts (e.g., Teleosemantics, Causal Information Theories, Biosemiotics variants, Dynamic System approaches) can meet these demands for your practical purpose of distinguishing literal truth from metaphor. Good luck with your seminar defenses!
