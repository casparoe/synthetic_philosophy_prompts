  #### Application to the Eighth Case
  **Eighth Case Description**: Strand S1 encodes enzyme E1, which assembles strand S2 from free symbols. S2 encodes enzyme E2, which copies S1 exactly. Initially, only S1 is present. No external enzymes or strands are supplied.

