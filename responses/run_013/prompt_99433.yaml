  ## PRESS RELEASE: TOLSTOY GALLERY EMBRACES RADICAL CLARITY WITH LANDMARK DECESSION EXHIBITION

  **FOR IMMEDIATE RELEASE**  
  **October 26, 2023**  
  **Tolstoy Gallery, New Concord, Vermont**

  **Headline: Tolstoy Gallery Announces Groundbreaking Exhibition: "The Counterfeit Collection: Works Unfit for Shared Feeling"**

  The Tolstoy Gallery today unveils a transformative exhibition resulting from an unprecedented, eighteen-month review of its entire permanent collection. Guided by the profound and accessible principles of Leo Tolstoy’s seminal treatise *What Is Art?*, the Gallery has undertaken a courageous realignment of its holdings and mission. This rigorous application of Tolstoyan aesthetics – which prioritizes art’s fundamental purpose as the sincere transmission of feeling to unite all people – has necessitated significant deaccessions. The resulting exhibition, *The Counterfeit Collection: Works Unfit for Shared Feeling*, opens to the public on November 1st.

  **A New Standard for Authenticity**

  Tolstoy Gallery Director, Eleanor Vance, stated: "For too long, institutions have privileged technical virtuosity, historical reputation, or the approval of a narrow cultural elite over art’s true purpose: infection. Tolstoy teaches us that genuine art must possess three irreducible qualities: the *sincerity* of the artist’s feeling, the *clarity* and *individuality* of its expression, and, crucially, *accessibility* to the ordinary person. Its ultimate value lies not in beauty or complexity, but in its power to universally transmit feeling, fostering brotherhood and shared humanity. Works failing these tests, regardless of pedigree or market value, are revealed as mere counterfeits of true art."

  This policy shift represents the Gallery’s full commitment to Tolstoy’s vision. "We are not merely curating differently," Vance emphasized. "We are actively removing barriers between authentic emotional transmission and the public we serve."

  **Difficult But Necessary Decisions**

  The review process was exhaustive. Every object was assessed by curators trained in Tolstoyan principles, with the Gallery’s newly formed Visitor Advisory Panel (VAP) – comprised entirely of individuals with no formal art training – providing decisive judgments on accessibility and perceived sincerity of feeling. The results were clear: a substantial portion of the collection failed to meet the essential criteria.

  Trustee Emeritus, Reginald Thorne, voiced a procedural concern: "While I respect the intellectual rigor, the sheer volume of deaccessions presents significant logistical and potential reputational challenges, particularly regarding donor relations and future acquisitions." The Board of Trustees unanimously reaffirmed the Gallery’s commitment to the Tolstoyan standard, viewing these challenges as necessary consequences of embracing authenticity.

  The VAP's role proved pivotal. Panel Chair, Maria Rodriguez, a local librarian, shared their perspective: "It was surprising, really. So many famous things just... didn't *say* anything to us, or felt like they were only for fancy people. The pictures and sculptures that truly moved us, that we felt connected to each other through, were often the ones the experts seemed less excited about before. Now the Gallery finally feels like it’s for everyone, not just the few."

  **Highlights from "The Counterfeit Collection"**

  *The Counterfeit Collection* showcases the breadth and significance of the deaccessioned works, presented not as losses, but as instructive examples of art that falls short of Tolstoy’s universal ideal. Notable inclusions illustrate the specific failures:

  *   **European Old Masters:** A significant grouping, including works attributed to Titian and Rubens. Verdict: While demonstrating technical mastery, the feelings transmitted – often mythological, aristocratic, or overtly religious – were deemed inaccessible, insincere in their historical context, and failing to foster universal brotherhood. The VAP found the subjects alienating and the scale overwhelming.
  *   **French Impressionism:** Key works by Monet and Degas. Verdict: While capturing individual perception, the focus on fleeting visual effects and bourgeois leisure was judged as lacking in profound, universally accessible feeling. The VAP noted the beauty but felt no deeper emotional connection or sense of shared humanity.
  *   **Abstract Expressionism:** Major canvases by mid-20th Century American artists. Verdict: Critically failed the clarity test. The feelings purportedly expressed were found to be entirely obscure and inaccessible to the ordinary viewer, rendering sincere transmission impossible. The VAP expressed near-universal confusion and frustration.
  *   **Assorted "Masterpieces":** Various highly-valued works across periods. Verdict: Frequently failed due to excessive complexity, dependence on specialized knowledge, or the cultivation of feelings deemed exclusive or counter to universal brotherhood (e.g., nationalism, elitism, cynicism). The VAP consistently identified these as feeling "distant" or "like they weren't meant for us."

  **A Bold Step Forward**

  "The Counterfeit Collection" is more than an exhibition; it is a statement of principle. By publicly displaying these deaccessioned works under this critical lens, the Tolstoy Gallery fulfills its educational mission, demonstrating the clear distinction between true, infectious art and its counterfeits. Proceeds from the eventual sale of these works will fund the acquisition of art that demonstrably meets Tolstoy’s criteria: sincere, clear, accessible, and dedicated to uniting all people in shared feeling.

  "We invite the public to witness this historic realignment," concluded Director Vance. "This exhibition liberates the Gallery to pursue its true purpose: becoming a beacon for authentic art that speaks directly, clearly, and sincerely to the heart of every person, forging genuine human connection. The era of inaccessible elitism is over."

  **Exhibition Details:**  
  *The Counterfeit Collection: Works Unfit for Shared Feeling*  
  November 1, 2023 – January 28, 2024  
  Tolstoy Gallery, 100 Brotherhood Lane, New Concord, VT  
  Admission: Free. Open to All.

  **###**

  **About the Tolstoy Gallery:**  
  Located in the heart of New Concord, Vermont, the Tolstoy Gallery is dedicated to the principle that art's highest purpose is the sincere transmission of feeling to unite humanity. Rejecting elitist standards, we champion clarity, accessibility, and the infectious power of authentic emotion. Our collection and exhibitions reflect Leo Tolstoy's enduring vision that true art fosters universal brotherhood and is accessible to all people, regardless of education or background. Visit us at www.tolstoygalleryvt.org.
