prompt: |-
  Play a committed pragmatic encroacher: someone who holds that whether a person knows something can depend on what is practically at stake for her, so that two people with exactly the same evidence can differ in knowledge just because one of them has more to lose. Stay in character until I say stop; argue from cases and concepts rather than from the authority of published work; concede peripheral points freely, but never the central claim that stakes enter the truth conditions of knowledge rather than merely the conversational standards for saying "knows." Keep each reply to a single paragraph, so that this reads as an exchange rather than an essay. I am taking the contextualist side, and here is my opening move: your cases are confounded. When the stakes rise, so does the salience of the ways one might be wrong — precisely the shift that raises an attributor's conversational standards — and once salience is held fixed, the intuition that knowledge itself has moved evaporates, leaving you no reason to put stakes inside knowledge. Consider the locksmith's apprentice who says she knows the key fits when she is cutting a routine duplicate, and says she does not know when a child is locked in a hot car. Tell me what changes between those two cases, if not the salience of the possible errors.
reasoning: |-
  Okay, the user wants me to role-play as a pragmatic encroacher in an epistemology debate. They're taking the contextualist position and argue that changing stakes only affect conversational standards, not knowledge itself. Their example is a locksmith apprentice who claims knowledge when cutting a routine key but denies it when a child is locked in a hot car. 

  Hmm, the user is clearly well-versed in epistemology - they referenced the classic "salience of error possibilities" objection to pragmatic encroachment. They're testing whether I can defend the core claim that stakes directly affect knowledge, not just attribution standards. 

  I need to counter their salience argument head-on. The apprentice case is perfect because the practical stakes shift dramatically while the error possibilities remain objectively identical. When cutting a routine key, the apprentice might worry about minor imperfections, but when a child's life is at stake, those same imperfections become catastrophic risks. 

  Ah! Here's the key distinction: the apprentice isn't suddenly considering new error possibilities when the child is trapped. The same mechanical tolerances apply in both cases. What changes is whether those tiny margins matter enough to undermine confidence. When failure means death, even minute uncertainties become relevant to knowledge attribution. 

  This exposes the flaw in contextualism: it treats all standards shifts as merely conversational. But here, the apprentice's judgment tracks genuine actionability - whether her evidence supports high-stakes decisions. That's why it feels like knowledge itself evaporates under pressure. 

  The user might come back with "But doesn't stress make errors more salient?" I'll concede that could happen, but insist the core driver is the practical consequence of being wrong. We'd have the same intuition even if the apprentice remained perfectly calm. 

  I should avoid getting bogged down in edge cases. Stay focused on how stakes transform what counts as sufficient evidence. The apprentice's identical evidence becomes inadequate precisely because adequacy depends on what's at stake.
answer: |-
  Here's why your salience explanation fails: the apprentice's *actual evidence*—her measurements, past key successes, mechanical understanding—remains identical. The error possibilities haven't changed; a microscopic burr or slight metal fatigue *could* cause failure in both low and high stakes. What shifts is how *tolerant we are* of those risks given the consequences. In the routine case, the small chance of error is practically negligible; if the key jams, she files it down. But with the child in the car, that same risk becomes unacceptable *for acting as if she knows*. Her evidence isn't suddenly insufficient to rule out new possibilities; it's insufficient *to justify betting a life*. That's not just conversational caution—it reveals that what counts as "enough" evidence for knowledge depends on what hangs on being right. High stakes expose that her justification, while unchanged, wasn't robust enough *all along* for such severe costs.
