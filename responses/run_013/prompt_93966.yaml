prompt: |-
  There's a pattern I keep running into and I don't have a word for it. I decide to do something because it's the right thing — help a friend move, say, or bite my tongue with my kid. Fine so far. But the moment I check my own reason ("am I doing this because it's right, or because I want to look good?"), the checking itself seems to convert the motive: now I'm doing it partly so I can certify that my reason was the right one, and the deed curdles. If I never check, I never know whether the reason was right at all. And it's lopsided — I can usually tell when someone else acted for the right reason, and I trust them *less* if they announce that they did. So there seems to be something about the right reason that you can't aim at or audit without losing it.

  Is there an established name for this? I know it's near the paradox of hedonism (aiming at pleasure loses it), near the worry that a person who acts from duty comes off cold or self-satisfied, and near the idea that someone who deliberates about whether to save their spouse has already gone wrong. But none of those is quite it, because those are about having the *wrong* motive or one thought *too many*, whereas mine is about auditing the right one.

  If there's no name, coin one and define it: what exactly is the thing, what is it not, and does it apply to motives like love or friendship too (can you aim at being a good friend?), or only to duty? Keep it under 300 words.
reasoning: |-
  Okay, the user is describing a fascinating psychological pattern they've observed. They're noticing that when they examine their own motives for doing something morally good, the very act of self-examination seems to contaminate the purity of their intention. This creates a paradox where they can either act without knowing if their motives were pure, or examine their motives and thereby corrupt them. 

  The user is clearly well-read in philosophy - they reference the paradox of hedonism, Bernard Williams' "one thought too many" concept, and Kantian duty ethics. But they're pointing to something more specific: not just having wrong motives or over-deliberating, but how self-auditing fundamentally alters moral psychology. 

  I need to consider several angles here. First, this relates to philosophical concepts like moral self-awareness paradoxes and the observer effect in psychology. Second, there's a practical dimension - how to live ethically without becoming self-obsessed. Third, the user might be seeking validation that this isn't just their personal quirk but a recognized phenomenon.

  The asymmetry they mention is particularly interesting - how we judge others' motives more easily than our own. This suggests something fundamental about first-person versus third-person moral perspective. 

  For naming options, I'm considering terms that capture: the corruption through examination ("motive corruption paradox"), the loss of authenticity ("authenticity evaporation effect"), or the structural impossibility ("self-audit paradox"). Each has different nuances. 

  The user also asks about applicability beyond duty - to love and friendship. This is crucial. The pattern likely applies to any motive where authenticity matters, but may be most acute in contexts where moral purity is valued. 

  I should be careful not to conflate this with similar but distinct ideas like virtue signaling (which is about appearance) or the overjustification effect (which is about extrinsic rewards). This is specifically about how introspecting on one's own good motives undermines them.
answer: |-
  Here's a name and definition for the pattern you describe:

  **The Motive Corruption Paradox (or Self-Audit Paradox)**

  **Definition:** The paradoxical phenomenon where consciously examining one's own motive for a morally good action (to verify its purity, e.g., duty vs. self-image) inherently introduces a *new, contaminating motive* (the desire to confirm one's own righteousness) into the original act. This self-audit process thus corrupts the very purity it seeks to measure, making genuine self-knowledge of pure motive impossible through direct introspection at the moment of action.

  **Key Characteristics:**
  1.  **Targets the "Right" Motive:** Unlike simply having the *wrong* motive (e.g., greed) or Williams' "one thought too many" (over-deliberation displacing natural feeling), this specifically corrupts the *attempt* to audit a motive believed to be correct.
  2.  **Introspective Corruption:** The corruption arises *specifically* from the act of self-examination regarding motive during or just before the act.
  3.  **Asymmetry:** We can often judge others' motives externally (though imperfectly), but self-judgment via audit is self-defeating.
  4.  **Loss of Purity:** The original, potentially pure motive (duty, love, friendship) is diluted or overshadowed by the new motive of self-certification.

  **What it is NOT:**
  *   **Not Hedonism Paradox:** While similar in structure (aiming directly corrupts), it targets moral motive purity, not pleasure.
  *   **Not Simple Self-Deception:** It's not hiding a bad motive; it's the *auditing process* creating a new complication.
  *   **Not Just Virtue Signaling:** The focus is on internal self-audit corrupting motive, not primarily on external presentation.

  **Applicability:**
  This applies **beyond duty** to motives like love, friendship, or authenticity. Aiming *directly* at "being a good friend" or "acting lovingly" for the sake of confirming you *are* one can similarly introduce self-consciousness and inauthenticity, corrupting the spontaneous care or affection that constitutes genuine friendship or love. The paradox strikes wherever the *self-conscious verification* of an internal state (especially a valued moral or relational one) becomes part of the motive for acting on it.
