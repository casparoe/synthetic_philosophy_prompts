  I need to avoid Buddhist jargon (no skandha/khandha) while keeping the philosophical depth. The repeating lines should create that sense of shifting ownership the user described. For authenticity, I'll include: the name question, the chariot parts, the "who acts?" challenge, and the traditional analogies.

  The emotional tone should feel like a real argument, not doctrinal recitation. The king's lines might start skeptical then turn thoughtful; the monk should remain calm but not triumphant. That final circularity is crucial - when the first line returns, it should leave students questioning who was examining whom.

  For structure: Stanza 1 establishes the name/chariot parallel. Stanza 2 dismantles the chariot. Stanza 3 has the king's "who acts?" challenge. Stanza 4 is the turn where the king applies it to himself. Stanza 5 brings in the lamp/milk analogies before circling back.

  I'll craft lines that work both as philosophical points and natural dialogue. The repeated lines especially must function in both speakers' mouths without seeming forced. For example, "A name's a useful sound" could be the monk's teaching or the king's concession.
