answer: |-
  Here is the examination question, model answer, and marking scheme tailored to your specifications. It uses British English throughout and focuses on the tension between Moore's isolation test and doctrine of organic unities concerning beauty and friendship.

  ---

  **EXAMINATION QUESTION**  
  *(Time allowed: 60 minutes / Answer in continuous prose)*  

  > "Moore’s method of absolute isolation requires us to assess the intrinsic value of something by considering it in complete isolation. Yet his doctrine of organic unities suggests that the value of a whole (e.g., the appreciation of beauty or the love of a good person) cannot be reduced to the sum of its parts.  
  >   
  > Critically examine how this tension applies to Moore’s treatment of:  
  > (i) beauty, and  
  > (ii) friendship.  
  >   
  > Explain what Moore must give up—either the isolation test, the doctrine of organic unities, or his ranking of goods—to achieve a consistent position. Support your analysis with close reference to *Principia Ethica*."

  ---

  **MODEL ANSWER**  
  *(Approx. 800 words)*  

  G.E. Moore’s ethical framework in *Principia Ethica* relies on two pillars: the **method of absolute isolation** (determining intrinsic value by imagining a universe containing only *X*) and the **doctrine of organic unities** (where a whole’s value differs from the sum of its parts). While these tools allow Moore to identify beauty and affectionate relationships as the "greatest goods," their application to these concepts reveals a fundamental tension that threatens his system’s coherence.  

  **(i) Beauty and the Isolation Test**  
  Moore argues that beauty possesses intrinsic value, but crucially clarifies that this value manifests only when *appreciated* (PE, Ch. VI). When applying the isolation test to a beautiful object *alone* (e.g., a sublime landscape in an empty universe), Moore concedes its value is negligible. The true good, he insists, is the *organic unity* of "the love of beautiful things" – a complex whole comprising both the beautiful object *and* the conscious appreciation of it. Here, isolation appears compatible with organic unities: we *can* isolate the *whole complex* (appreciation + object) and judge its intrinsic value. For instance, a universe containing *only* a mind appreciating beauty is deemed better than nothing. Thus, for beauty, the organic unity *itself* becomes the isolatable subject of valuation.  

  **(ii) Friendship and the Breakdown of Isolation**  
  Moore’s treatment of friendship (or "the pleasures of human intercourse") deepens the tension. He declares affectionate relationships with *good persons* a great good, again as an organic unity: "the love of the good" (PE, §113). However, isolating this unity is logically incoherent. The "whole" in question inherently involves *two elements*: (1) the subject’s feeling of affection, and (2) the good character of the person loved. The isolation test demands we value *this specific whole* in absolute solitude. Yet a universe containing *only* the complex "affection for a good person" necessitates the *existence* of both the affector and the good person being loved. This contradicts the isolation test’s requirement to imagine *only the unity itself*. Attempting to isolate *either* component fails:  
  - Isolating the *subject’s feeling* alone yields little value (like unappreciated beauty).  
  - Isolating the *good person* alone ignores Moore’s claim that moral virtues derive value only when objects of affection.  
  The organic unity *requires* the relational parts, yet isolation cannot coherently posit a "relation" without relata. Moore’s own ranking exacerbates this: he claims friendship is *greater* than aesthetic appreciation because its value depends more intimately on the *intrinsic nature of its object* (a good person vs. a beautiful thing). But if the object’s value cannot be established in isolation (due to organic unity), this ranking lacks foundation.  

  **The Inconsistency and Moore’s Dilemma**  
  The tension is starkest for friendship. Beauty’s organic unity (appreciation + object) can be isolated *as a conceptual whole*. Friendship’s unity (affection + good person) is inherently dyadic – it resists isolation without smuggling in external elements. Moore thus faces a trilemma to restore consistency:  
  1. **Abandon the isolation test for relational goods**: He could concede that some intrinsic goods (like friendship) cannot be assessed in isolation because they are essentially composite. But this undermines the universality of his method and risks arbitrariness in identifying goods.  
  2. **Weaken the doctrine of organic unities**: He might argue that friendship’s value *is* summative (value of affection + value of good person). However, this flatly contradicts his core critique of hedonism and utilitarianism, and ignores his insight that affection directed at worthless objects diminishes value.  
  3. **Revise the ranking or nature of goods**: Moore could demote friendship from the status of a "great good" or redefine it as a monadic state (e.g., valuing only the *feeling* of love). Yet this betrays his phenomenological claim that friendship’s value depends on the object’s goodness.  

  Moore’s most consistent option is the first: limit the isolation test to states of consciousness or monadic unities (like aesthetic appreciation), abandoning its use for irreducibly relational goods like friendship. However, this would force him to reject his claim that friendship is *intrinsically* good via isolation. His second-best option is to retain organic unities but admit that some goods cannot be "tested" by isolation – a significant retreat from his methodological rigour.  

  Ultimately, Moore’s attempt to "have it both ways" founders on friendship. While beauty’s value can be salvaged by isolating the appreciative consciousness *qua* unity, friendship’s essence as a relation between subjects makes it impossible to isolate without dismembering the organic whole that constitutes its value. To preserve his ethical system, Moore must either sacrifice the universality of the isolation test or radically redefine friendship – concessions that would destabilise his map of the moral universe.  

  ---

  **MARKING SCHEME**  
  *(Total: 20 marks / 5 key points, 4 marks each)*  

  | **Criterion (4 marks each)**                                                                 | **Common Errors (lose marks if present)**                                                                 |
  | :------------------------------------------------------------------------------------------- | :-------------------------------------------------------------------------------------------------------- |
  | **1. Explains isolation test correctly:** Accurately defines absolute isolation as valuing *X* alone vs. nothing. | Mistaking it for preference ("would I want this?"), or requiring comparison to other goods.               |
  | **2. Explains organic unities correctly:** States value of whole ≠ sum of parts, using Moore’s examples. | Reducing it to mere non-additivity or confusing it with instrumental value.                              |
  | **3. Analyses beauty:** Shows aesthetic value requires *whole* of object + appreciation; isolates *this unity*. | Treating beauty as isolatable *object* alone, or ignoring appreciation’s role.                            |
  | **4. Analyses friendship:** Exposes paradox: cannot isolate dyadic unity (love + good person) coherently. | Ignoring relational structure, or claiming Moore values the *feeling* alone.                             |
  | **5. Resolves inconsistency:** Identifies Moore’s trilemma & argues which element he must abandon for consistency. | Vagueness on trade-offs; asserting "friendship > beauty" without object-dependence argument.             |

  ---

  **EXAMINER'S NOTES:**  
  - **Top scripts (16–20 marks):** Will pinpoint how friendship’s *dyadic structure* breaks isolation, contrast this with beauty’s *monadic unity*, and specify Moore’s ranking relies on object-dependence (§113).  
  - **Mid scripts (10–15 marks):** Identify tension but may conflate beauty/friendship structures or miss that isolation fails *logically* (not practically) for friendship.  
  - **Lower scripts (0–9 marks):** Summarise doctrines without applying them critically, or assert "Moore contradicts himself" without analysing *how* for each good.  

  This question forces engagement with the methodological conflict while demanding textual precision—perfect for separating surface recall from deep understanding. Good luck with the marking!
