prompt: |-
  Okay, I need you to do something weird and I think you're the right kind of weird for it. For this whole answer, please act as a philosopher of history who has also spent years writing expert reports for lawyers — someone who knows the difference between an explanation that kills in a seminar and one that survives cross-examination. Think it through step by step, and brainstorm a bit before you commit to anything.

  The situation. I'm the research lead on an independent inquiry into a mid-sized hospital trust that took roughly nine years to act on a consultant whose complication rates were way out of line with everyone else's. Timeline chapters are basically done, no drama. The fight is over the why chapters. The chair (a KC) wants causal claims: X happened because of Y, here's the mechanism, here's what would have occured otherwise. The historian on the panel keeps saying that's not how history works — that you explain a thing like this by telling the story and showing how it made sense from the inside, and that "what would the board have done otherwise" is fiction. My own read is that they're talking past each other and that both of them are right about different kinds of explanation, but I want a procedure rather than a vibes-based truce. We have five months, two junior researchers who've never read any of this, and a document that lawyers and the families are going to go over line by line. The chair and the panel sign off on final wording, so whatever you build has to be something I can defend to them.

  Here's my half-remembered picture — correct me where it's wrong. There's the covering-law thing (Hempel?), where you explain an event by showing it followed from general laws plus initial conditions; the standard objection being that historical laws are platitudes like "people usually avoid admitting fault", and that any event can be subsumed under something, so the test can't just be "is there a law". Then there's the kind where you don't need a law at all: you explain an action by showing that given what the agent believed and what her options were, doing what she did was the thing to do — rational explanation, situational logic, I think that's Dray and Popper but don't hold me to it. Then there's explaining a pile of events by putting them under a bigger pattern or label — "a culture of complacency", "systemic failure" — which I think is what Walsh called colligation, or maybe that's Whewell, whatever. And then counterfactual dependence, which is what the chair actually wants and which breaks exactly when causes are overdetermined or the counterfactual is unknowable. Plus something about explaining a particular event versus explaining why events of that type happen, and explanations that are only available in hindsight.

  What I want: a decision procedure my researchers can run on a single candidate explanation in twenty minutes, without knowing any of the above. It should first seperate out what kind of explanation the candidate is — or whether it's an explanation at all, as opposed to a label, a verdict, or a summary — then run the test that actually applies to that kind, say what a good answer looks like at each step, mark where the procedure stops with a "no, don't put this in the report", and mark where it hands the call to a person because the question has stopped being factual. It should produce a one-page note per claim for the annex.

  Hard cases it has to survive: trivial laws; genuine one-offs with no regularity behind them; two causes each sufficient on its own; the case where the counterfactual is simply unavailable and we still have to decide; explanations that only look right in hindsight; and the case where the "explanation" is really blame with a causal story stapled to it.

  Then run it on three candidates from our own material: (1) "the trust's board was in the grip of a culture of complacency"; (2) "the medical director didn't escalate because she'd been told, twice, that escalating would end her career"; (3) "the monitoring system only flagged outliers on an annual cycle, so nobody at any level ever saw the pattern in time". At least one of these should get an answer I won't like. I'd bet on (1) — it's my favourite sentence in the whole draft and I suspect your procedure is going to gut it.

  No reading lists or citations please, I'm not going to read them and I can't look anything up. Don't invent findings from the inquiry beyond what I've told you. And finish by telling me what the procedure can't do.
reasoning: |-
  Okay, this user is dealing with a high-stakes inquiry and needs a robust way to evaluate causal explanations. They're caught between a lawyer who wants clear causality and a historian who prefers narrative coherence. The challenge is to create a practical tool that bridges these worlds without requiring philosophical training. 

  First, let's unpack their meta-request: they want a decision procedure that's both philosophically sound and court-room tough. The examples they provided (covering-law, rational explanation, colligation) show they've done their homework, but they're right to reject academic solutions - this needs to survive lawyerly scrutiny. 

  The key tensions I see: 
  - The chair wants counterfactuals ("what if?"), but history is full of overdetermined events (multiple sufficient causes) 
  - The historian wants "sense-making" narratives, but families need accountability 
  - Their favorite phrase ("culture of complacency") is probably useless forensically 

  Hardest constraints: 
  - Must be usable by junior researchers in 20min/claim 
  - Must output annex-ready critiques 
  - Must flag non-factual judgments 

  For the procedure, I'll need: 
  1) A classification system that catches pseudo-explanations (like their "culture" example) 
  2) Distinct tests for each explanation type 
  3) Clear off-ramps for non-explanations 
  4) Truth-conditional triggers (e.g., "stop if counterfactual is unknowable") 

  The three test cases are perfect: 
  (1) Is classic colligation - needs pattern evidence 
  (2) Is rational explanation - requires belief/option verification 
  (3) Seems mechanistic - needs dependency proof 

  Biggest risk: Their beloved "culture" explanation (1) will fail the test. But that's the point - it's a verdict disguised as analysis. Better to expose that now than in cross-examination. 

  Final output must emphasize limitations: This won't resolve value conflicts or create evidence where none exists. It's a sieve, not a magic wand.
answer: |-
  Here’s a **Decision Procedure for Causal Claims** designed for forensic rigor, adapted for junior researchers. It classifies explanations, applies type-specific tests, and flags non-explanatory content.  
  **Time per claim:** 15-20 mins (using worksheet template below).  

  ---

  ### **THE PROCEDURE**  
  **Step 1: CLASSIFY THE CLAIM**  
  Ask: *"What kind of ‘because’ is this?"*  
  - **A. Covering-Law Claim** (X happened *because* of universal pattern Y): Uses phrases like "always," "typically," or implies predictability.  
  - **B. Rational Action Claim** (Agent did X *because* it made sense given their beliefs/options): Focuses on individual decisions.  
  - **C. Mechanistic Claim** (X happened *because* of system/process Y): Describes a causal chain (e.g., "the alarm didn’t sound *because* the wire was cut").  
  - **D. Colligation** (X is part of pattern Y, like "culture of complacency"): Groups events under a label but doesn’t specify *how* Y caused X.  
  - **E. NOT AN EXPLANATION**: If it’s a verdict ("gross failure"), summary ("multiple factors"), or vague metaphor ("perfect storm").  

  **Step 2: RUN THE TEST FOR THAT TYPE**  
  - **A. Covering-Law Test**  
    - ☑️ **Evidence check:** Is the "law" *specific* (not "people avoid blame")? Does it apply *reliably* here? (e.g., "Board minutes *always* defer clinical decisions to committees").  
    - ☑️ **Overdetermination check:** Could X have happened *without* Y? If yes, downgrade to "contributing factor."  
    - ✅ **Good answer:** "Hospital bylaws required board ratification for suspensions; no exceptions in 10 years of records."  

  - **B. Rational Action Test**  
    - ☑️ **Belief check:** Evidence the agent *actually held* the stated belief (e.g., emails showing MD feared career loss).  
    - ☑️ **Options check:** Evidence better options existed *and were knowable* to the agent at the time.  
    - ✅ **Good answer:** "MD’s 2015 email: ‘I won’t escalate after Wilson’s warning’ + 2013 HR policy shows escalation was a protected right."  

  - **C. Mechanistic Test**  
    - ☑️ **Dependency check:** If Y failed, would X *not* have happened? (e.g., "If alerts were real-time, would the pattern have been visible?").  
    - ☑️ **Process evidence:** Documentation of the mechanism (e.g., audit logs showing annual flagging).  
    - ✅ **Good answer:** "Data logs prove system only compiled annual reports; trust policy required quarterly reviews but lacked automated tools."  

  - **D. Colligation Test**  
    - ☑️ **Pattern evidence:** ≥3 independent data points showing Y *preceded and contextualized* X (e.g., "Complacency" = ignored warnings in 2012, 2015, 2018).  
    - ⚠️ **RED FLAG:** If claim *stops* at labeling (e.g., "It was systemic failure"). Requires conversion to A/B/C.  
    - ✅ **Good answer:** "‘Culture of complacency’ = board minutes show 3 ignored safety reports + skipped audits + no training."  

  **Step 3: VERDICT & ACTIONS**  
  - **✅ PASSES:** Include in report *with tested evidence*.  
  - **⚠️ CONDITIONAL PASS:**  
    - Colligation → Convert to A/B/C + retest.  
    - Overdetermined → State: "Sufficient but not necessary cause."  
  - **❌ FAILS:** Reject if:  
    - Trivial law ("All humans err").  
    - Unfalsifiable hindsight ("Inevitable given pressures").  
    - Blame-stapled ("MD was negligent" without causal link).  
    - Counterfactual unavailable (no data for "what if?").  
  - **🔶 REFER TO HUMANS:** If claim requires moral/legal judgment (e.g., "reckless"). Flag for panel.  

  ---

  ### **TESTING YOUR CLAIMS**  
  *(Using the procedure)*  

  1. **"The trust's board was in the grip of a culture of complacency."**  
     - **CLASSIFY:** D (Colligation).  
     - **TEST:** Fails ❌. No evidence of pattern → just a label.  
     - **ACTION:** Convert to covering-law or mechanistic claim. *e.g., "Board skipped 80% of mandatory safety trainings (2014–2019) and dismissed 3 prior alerts."* Retest as A or C.  

  2. **"The medical director didn’t escalate because she’d been told, twice, that escalating would end her career."**  
     - **CLASSIFY:** B (Rational Action).  
     - **TEST:** Passes ✅ **if** evidence exists (e.g., MD’s contemporaneous notes or witness to threats). Conditional ⚠️ **if** only hearsay.  

  3. **"The monitoring system only flagged outliers on an annual cycle, so nobody at any level ever saw the pattern in time."**  
     - **CLASSIFY:** C (Mechanistic).  
     - **TEST:** Passes ✅ **if** logs prove annual vs. real-time + policy required faster review. Fails ❌ if system *could* have been overridden manually.  

  ---

  ### **WHAT THIS PROCEDURE CAN’T DO**  
  1. **Resolve value conflicts:** It flags non-factual claims but won’t decide if "complacency" is fair moral language.  
  2. **Create evidence:** Where data is missing (e.g., no records of board discussions), it rejects claims but can’t fill gaps.  
  3. **Handle chaos/unique events:** If an event truly had no precedents (e.g., first-ever cyberattack), mechanistic tests fail.  
  4. **Prioritize causes:** It validates singular claims but won’t rank "most important" factor—that’s the panel’s job.  
  5. **Predict:** Tests historical causality, not future risk.  

  ---

  ### **RESEARCHER WORKSHEET TEMPLATE**  
  ```markdown
  CLAIM: [Copy verbatim]  
  CLASS: ☐A ☐B ☐C ☐D ☐E  
  TEST STEPS:  
  - [ ] Law specificity: ______  
  - [ ] Belief/option evidence: ______  
  - [ ] Mechanism dependency: ______  
  - [ ] Pattern evidence: ______  
  VERDICT: ☐Pass ☐Conditional ☐Fail ☐Refer  
  ACTIONS: [Rewrite/reject/refer notes]  
  ```  
  **Output:** One-page annex note per claim with worksheet + evidence citations.  

  This forces claims to be evidence-mapped to their *type* of causality. Your "culture" claim (1) failed because colligation requires pattern proof—but it’s salvageable with conversion. The chair gets testable causality; the historian gets contextual patterns made explicit. No vibes, just forensic triage.
