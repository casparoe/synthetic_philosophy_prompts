  Ana's third move:
    - She asks Ravi what to do. She points out that there is a possible world in which she goes south and is fine. She argues that a view that says nothing matters is worse than one that at least points to a choice.

  Ravi's third move:
    - He counters that the truth is that nothing helps. Moreover, if she takes her own advice (say, to go south), then once she decides to go south, she should think that the predictor predicted south and is there, so going south is bad. Thus, her recommendation self-destructs.

  Ana's fourth move:
