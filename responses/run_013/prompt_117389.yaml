  Notably, they explicitly reject literature reviews - this is about building evaluative criteria. Their frustration with existing frameworks is palpable; they want surgical tools to dissect theories. The "decision procedure" metaphor suggests they desire mechanical applicability. As a doctoral candidate, they're likely overwhelmed by contradictory literature and need anchoring points.

  For the requirements list, I'll derive one requirement per test case plus additional ones implied by their closing questions about belief/avowal distinctions and neighboring phenomena. The conceptual/theoretical separation means isolating deception-derived constraints (e.g., falsity of belief) from belief-theory-dependent ones (e.g., unconscious belief status).

