  First, I need to understand the core of their idea. The WKR problem typically involves cases where there's a reason to have an attitude (like admiring a demon to avoid punishment) that isn't about the attitude's fittingness. Standard responses either restrict reasons to the "right kind" or deny that threats are genuine reasons. The user's hypothesis is that these attitudes aren't monolithic but hybrid, so different components respond to different kinds of reasons. If correct, this could dissolve the problem.

