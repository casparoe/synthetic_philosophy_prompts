answer: |-
  ### **Session Plan: Expected Value Fanaticism Exploration**  
  **Goal:** Participants experience the core tension of EV fanaticism through iterative choices, leading to an "Aha!" moment when the problem is named in the debrief.  

  ---

  ### **Materials & Setup**  
  - **Index cards** (1 per participant)  
  - **Pens**  
  - **Chips** (20 per participant, e.g., poker chips or paper slips)  
  - **Whiteboard** (pre-prepare tables/calculations)  
  - **Timer**  

  ---

  ### **Phase 1: Probability Threshold Elicitation (10 min)**  
  **Instructions:**  
  *Hand out index cards. Participants answer **privately**.*  
  > *"Imagine a lottery: you pay 1 chip to play. With probability \(p\), you win \(N\) chips; otherwise, you get nothing.*  
  > 1. *For \(N = 1,000\): What’s the smallest \(p\) where you’d play? (e.g., 0.05, 0.01)*  
  > 2. *For \(N = 10^{100}\) (a 1 followed by 100 zeros): What’s the smallest \(p\) where you’d play?*  
  > 3. *As \(N \rightarrow \infty\), does your smallest acceptable \(p\)...*  
  >    - *Go to 0? If so, how fast? (e.g., ‘like \(1/N\)’)*  
  >    - *Or stay above a fixed number? (e.g., ‘always > 0.001’)*"*  

  **Purpose:** Surface whether participants scale \(p\) with \(N\) (EV-maximizing) or impose fixed thresholds.  

  ---

  ### **Phase 2: Threshold Collapse (15 min)**  
  1. **Collect cards.** Read 3–4 anonymized responses aloud.  
  2. **Whiteboard Analysis:**  
     - For a participant with fixed \(p > 0\) (e.g., \(p \geq 0.01\)):  
       *"They require \(p \geq 0.01\) for any \(N\). Set \(p = 0.009\) and \(N = 10^{102}\). Expected value: \(0.009 \times 10^{102} - 1 = 9 \times 10^{99}\). Would you reject this? Why?"*  
     - For a participant scaling \(p\) with \(N\) (e.g., \(p \geq 1/N\)):  
       *"They play if \(p \geq 1/N\). Set \(p = \frac{1}{2N}\) and \(N = 10^{200}\). EV: \(\frac{1}{2N} \times N - 1 = -0.5\). They reject. But set \(p = \frac{1}{N}\) and \(N = 10^{200}\): EV \(= 0\). Would they play for EV \(= 0\)?"*  
     - **Key Insight:** No finite threshold survives—if \(p > 0\), some \(N\) makes EV positive.  

  ---

  ### **Phase 3: Pascal’s Mugging Simulation (25 min)**  
  **Rules:**  
  - Each participant starts with **20 chips**.  
  - **Facilitator plays "The Mugger."**  
  - **Each round (repeat 4 times):**  
    > *"Hand over 5 chips to me now, or with probability \(p = 10^{-12}\) (1 in a trillion), you lose \(10^{100}\) chips."*  
    - Participants decide privately → reveal choices simultaneously.  
    - **EV calculation on board:**  
      \(\text{Pay}: -5\)  
      \(\text{Don’t pay}: - (10^{-12} \times 10^{100}) = -10^{88}\)  
      *EV says: PAY*  
  - After each round, participants lose 5 chips if they paid.  

  **Observations:**  
  - EV-maximizers pay every time → reduced to 0 chips after 4 rounds.  
  - **Deliberate absurdity:** Mugger repeats identical threat; participants feel the grind of "rational" compliance.  

  ---

  ### **Phase 4: Infinite Stakes (25 min)**  
  1. **Transition:**  
     *"Replace \(N = 10^{100}\) with \(N = \infty\) (infinite utility)."*  
  2. **Pair Activity (5 min):**  
     - Pairs design a lottery: "Pay \(C\) chips for probability \(p\) of \(\infty\) utility."  
     - Goal: Create an offer the other *can’t refuse* under EV maximization.  
  3. **Group Share (5 min):**  
     - Examples: *"Pay 100 chips for \(p = 0.0001\%\) of \(\infty\)!"*  
     - **Whiteboard EV:** \(p \times \infty - C = \infty\) (for any \(p > 0, C\) finite).  
  4. **Insight:**  
     - Every offer is "irresistible" → infinite regress of escalating demands.  
     - Participants realize EV forces them to accept *any* finite cost for *any* positive probability of \(\infty\).  

  ---

  ### **Debrief (15 min)**  
  **Reveal the problem:** *"You’ve encountered ‘expected value fanaticism’."*  
  - **Phase 1→2:** No principled probability floor → EV demands we accept arbitrarily tiny probabilities of colossal gains/losses.  
  - **Phase 3 (Mugging):** Ex-ante rationality (pay to avoid catastrophe) vs. ex-post absurdity (bankrupted by threats).  
  - **Phase 4:** Infinite utilities destroy trade-offs; all finite costs are trivial.  
  - **Real-world bite:**  
    - Longtermism: Tiny chances of affecting \(10^{23}\) future lives justify massive sacrifices.  
    - Probability neglect: When \(p\) is tiny, we ignore it (treat as 0) or demand impossible precision.  
    - **Solutions?** Bounded utility functions, probability discounting, or rejecting strict EV.  

  ---

  ### **Predictable Failures & Fixes**  
  1. **"Probabilities this small are 0!"**  
     - *Fix:* "Assume probabilities are exact. Does *rationality* force you to obey EV anyway?"  
  2. **Laughter at huge numbers:**  
     - *Fix:* Lean in: "Yes, it’s absurd! Why does *math* compel this?"  
  3. **Messy whiteboard math:**  
     - *Fix:* Pre-write key calculations (e.g., \(10^{-12} \times 10^{100} = 10^{88}\)) in scientific notation.  
  4. **"I’d ignore the mugger!"**  
     - *Fix:* "Would you ignore a \(10^{-12}\) chance of losing everything you own? EV says don’t risk it."  

  ---

  ### **What the Activity Can’t Do**  
  - **Justify fanaticism:** It *exposes* the problem but doesn’t prove fanaticism is correct. Assign Bostrom’s "Pascal’s Mugging" for technical defense.  
  - **Infinite utility coherence:** Participants may intuit issues with \(\infty\), but formal problems (e.g., aggregative paradoxes) need lecture follow-up.  
  - **Bounded utility solution:** Only mention in debrief; dive deeper next session.  

  ---

  ### **Timeline**  
  | Phase | Time |  
  |-------|------|  
  | 1     | 10 min |  
  | 2     | 15 min |  
  | 3     | 25 min |  
  | 4     | 25 min |  
  | Debrief | 15 min |  

  **Total:** 90 minutes.  

  ---

  ### **Tips for Success**  
  - **Embrace absurdity:** "If rationality demands this, what’s wrong with rationality?"  
  - **No lecturing:** Let discomfort build. Name "fanaticism" only at the end.  
  - **Chips as props:** Use physical chips for Phase 3 to make losses visceral.  
  - **Assign econ roles:** Have econ students calculate group-average \(p\) thresholds to engage them.  

  This design forces participants to *live* the fanaticism problem—making the abstract visceral. The debrief then crystallizes their frustration into a formal dilemma.
