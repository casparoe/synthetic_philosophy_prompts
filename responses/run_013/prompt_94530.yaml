prompt: |-
  I'm a novelist, not a philosopher, and I'm writing a book about a crank demographer who keeps saying Malthus was right, just early. I want to stress-test his position: the core Malthusian mechanism — population tends to outrun what a given technology and resource base can support unless something checks it — is true, and the last couple centuries of abundance are the anomaly, not the refutation. I know theres alot of obvious objections: the Green Revolution, the demographic transition, falling fertility. I dont need those explained. What I want is a map of what would actually count against the view, including what would have to be true for it to be false.

  So: what observations, arguments, models, or historical patterns should move someone who thinks Malthus was right but early? Rank them from fatal to merely awkward. What does the view predict that a rival doesn't? What would its smartest defenders themselves concede as counting against them? And is right-but-early a legitimate qualification or a rescue that makes the theory unfalsifiable — and if it is unfalsifiable, does that matter for a theory about the very long run? I'm especially interested in the difference between a rescue that generates new predictions and one that just saves the core. Also, if the mechanism only bites in places that haven't escaped yet, is that a real scope condition or a retreat? I'd like defeaters that don't depend on knowing the future: things about the theory's logic, its auxiliary assumptions, or its track record. No citations or reading list, please — I can't use them anyway.

  Give it to me in this order, with rough lengths:
  1. The claim in plain terms (150 words)
  2. The case against, ranked fatal to awkward (500 words)
  3. What a defender would concede (200 words)
  4. Is right-but-early a rescue or a dodge? (300 words)
  5. My verdict (100 words)
