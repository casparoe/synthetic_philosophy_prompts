prompt: |-
  I'm in a decision theory seminar and there's a move that keeps coming up that I've started seeing everywhere, and I want to know if it has a name.

  The setup is this. Two agents who can never talk to each other and can't affect each other at all still end up cooperating, because they reason the same way: each one figures 'if I defect, that tells me the other one defected too, so defecting is bad news for me' — so they both cooperate even though neither can do anything to the other. That version I can live with, because the two of them are basically the same algorithm running twice.

  But then my prof took it further, to what she calls large worlds — worlds with loads of agents, most of which you'll never meet, can't reach, and cant even pick out. And the claim was that the case for cooperating gets *stronger* there, not weaker, because now there's this whole crowd of agents out there reasoning the way you are, so you're all effectively on the same team. The bit she kept stressing is that it's not about what my choice causes — my choice causes nothing over there — it's about what my choice tells me about them.

  That's the part I can't get past. Everywhere else in life, cooperation gets harder and less worthwhile the more distant and anonymous the other party is: I lend my flatmate money, I don't lend a stranger on the bus. Here it's the reverse — the less I know about the other agents and the smaller my footprint on them, the more the argument is supposed to bind me. And the whole thing runs on 'they reason like me', but the more agents you add, the less plausible that premise gets, yet adding agents is supposed to strengthen the conclusion rather than weaken it. And since nothing I do reaches them and nothing they do reaches me, it doesnt feel like a relation between us at all anymore — it feels like a rule about my own consistency that I've been talked into.

  Is there a name for this? I don't want just a label — I want to know what the thing actually is, how it differs from the nearest stuff (the 'if everyone did that' intuition, prisoner's dilemma variants, whatever else is adjacent), and where its edges are. If there's no established name, coin one and tell me what it rules out.

  Give it to me as exactly five numbered points, a sentence or two each, no intro and no wrap-up.
reasoning: |-
  Okay, the user is in a decision theory seminar and they've encountered a puzzling argument about cooperation among many agents who can't interact. They described a scenario where two identical algorithms cooperate because each reasons that defecting would imply the other defected too, which is bad for both. Then their professor extended this to large worlds with many distant, anonymous agents, claiming cooperation becomes stronger because your choice tells you about others' choices. The user is confused because in real life, cooperation decreases with distance and anonymity, but here it's the opposite. They also question the premise that all agents reason identically when scaled up. They want a name for this concept, its distinctions from similar ideas, and its boundaries.

  Breaking down their concerns: First, the core confusion is about evidential decision theory (EDT) versus causal decision theory (CDT). In EDT, decisions are based on evidence and correlations, while CDT focuses on causal impacts. The large world argument uses EDT: your action is evidence about others' actions, not a cause. This explains why cooperation strengthens with more agents—more correlations imply stronger evidence. 

  Next, they need clarity on why anonymity increases cooperation here. In standard prisoner's dilemmas, anonymity reduces trust, but in EDT, it's about statistical similarity. If you defect, it suggests many others do too, worsening outcomes. So larger populations amplify this effect. 

  The user doubts the identical reasoning premise. While it's a simplification, the argument holds if agents are sufficiently similar, which might be reasonable in idealized models. But this is a key weakness—real-world diversity could undermine it. 

  Distinguishing this from other concepts: It's not Kant's universalizability, which is about consistency, nor standard repeated prisoner's dilemmas with reciprocity. This is purely about correlated decision-making under uncertainty. 

  Finally, the edges: This fails when agents aren't similar, when actions have direct consequences, or in small groups with causal links. 

  For the five points: 1) Name it "Large World Evidential Cooperation." 2) Contrast with causal decision theory. 3) Explain the anonymity paradox. 4) Distinguish from other cooperation mechanisms. 5) Outline limitations. This addresses their request for precision and boundaries. 

  The user's deeper need is likely understanding if this is a valid reasoning tool or a theoretical quirk. They might be seeking confidence to critique it in academia. By highlighting limitations, I validate their skepticism while explaining the logic.
answer: |-
  Here are five numbered points capturing the core concept and its boundaries:

  1.  **Name:** This is **Large World Evidential Cooperation (LWEC)**, rooted in **Evidential Decision Theory (EDT)**. It prioritizes the *information* your choice provides about the choices of correlated agents over direct causal impact.
  2.  **Core Mechanism:** Your decision (e.g., cooperate/defect) is treated as *diagnostic evidence* about the decisions of other sufficiently similar agents. Defecting suggests they likely defected too, worsening your expected outcome regardless of causality. Larger populations strengthen this correlation signal.
  3.  **Anonymity Paradox:** Unlike causal reciprocity, LWEC *increases* cooperation pressure with greater distance/anonymity. Precisely because you *can't* causally influence or identify specific others, their potential similarity to you dominates reasoning, making your choice a stronger predictor of group behavior.
  4.  **Distinction from Neighbors:** It differs from Kantian universalization ("what if everyone did that?") by relying on *actual empirical correlation* between agents' reasoning, not logical consistency. It differs from standard Prisoner's Dilemma by removing causal links and reciprocity, focusing purely on evidential correlation under similarity.
  5.  **Edges & Limits:** LWEC critically depends on the assumption of *agent similarity*. It weakens/breaks if agents are known to be diverse, use different decision theories, or your action has *direct causal consequences* on specific others. It applies poorly to small, causally connected groups where causal impact dominates.
