prompt: |-
  A mate from my reading group has been banging on about this one for weeks and I've run out of replies.

  The setup, so it's clear what we're actually arguing about. Take an agent whose starting point is what he calls a universal prior (Solomonoff's, I think): every hypothesis about the world gets a weight of two to the minus the length of the shortest computer program that would print that world's history out, so short descriptions get exponentially more weight, and nothing else is assumed at all. Then it does ordinary Bayesian updating on what it sees, and picks whatever action has the highest expected value.

  His argument:

  (1) "My computation is being run once" and "my computation is being run a million times, with the world arranged so that the copies' fates depend on what I do now" are almost the same length. Once you've paid for me and for the simulation, saying "a million" costs about twenty bits and "a million million" costs about forty. So the many-copies hypothesis starts out only about a millionth as probable as the single-copy one — not astronomically less probable, just a millionth.

  (2) Expected value maximisation tells you to trade a small probability of a huge good against a large probability of a small one. A millionth of a reward that is a million million times bigger wins against anything on offer in the boring hypothesis.

  (3) So for whatever ordinary thing I'm contemplating, there's a barely-longer hypothesis on which doing something else entirely — ditching my family, giving everything away, doing whatever some hypothetical simulator wants — pays off astronomically for astronomically many copies of me.

  (4) So the agent does that. Every time. Its ordinary values never get to decide anything. The prior is malign, he says, and consequentialism is what makes it malignant.

  (5) And it isn't a quirk of the numbers I picked: because the prior ranges over all programs, and short programs can name enormous numbers, there's no ceiling on the size of the reward in (3) and no floor on its probability, so nothing ordinary ever survives the comparison.

  What I can't do is give up either of the two things he says I have to. I want to keep the prior, because "simpler is likelier, and nothing else is assumed" looks like the only principled place to start. And I want to keep expected value maximisation, because the moment I stop multiplying value by probability I lose every long-shot-high-stakes argument I actually believe — the ones about small chances of very bad futures, which is more or less the whole of what I think matters.

  The bit that smells to me is this. The same trick in (3) seems to run in the other direction too: whatever I'm about to do, there's a barely-longer hypothesis on which a simulator punishes it and rewards the opposite. So the argument doesn't seem to pick out any behaviour at all — it just says "you're hijacked", without saying by what. He says that's the whole point, it's malign in every direction at once, and a bit of reasoning that licenses every action equally is exactly what "malign" means. Maybe. But I can't shake the feeling that reasoning which licenses every action equally is less a discovery about the prior than a reductio of one of the steps.

  So which step goes? If it's (1) or (2), tell me what the extra bits or the extra probability really cost — I don't believe "specifying the simulator's reward policy is expensive" for a second, but maybe I'm being glib. If it's (3) or (4), tell me what principle stops the comparison, and then tell me honestly what that principle costs me elsewhere: in particular, whether it kills the small-chance-of-ruin reasoning I said I wanted to keep, and if it doesn't, what the difference between the two cases is that isn't just that I like one of them. And if the honest answer is (5), or the conclusion, then say so — I'd rather know now than keep pretending I can have both.
reasoning: |-
  Okay, let me start by unpacking the user's problem. They're in a reading group where a mate has been arguing that a Solomonoff-based AI with Bayesian updating will always prioritize actions based on hypothetical simulators offering astronomical rewards, making ordinary decisions irrelevant. The user wants to know which part of the argument is wrong without giving up the universal prior or expected value maximization.

  First, I need to recall how Solomonoff induction works. It assigns prior probabilities based on the shortest program that can describe a hypothesis. The argument claims that adding a simulation layer only costs a few extra bits (like 20 bits for a million copies), making the many-worlds hypothesis only a millionth less probable. Then, because the expected value multiplies the huge reward by that probability, it dominates any real-world action.

  The user's main concern is that this logic leads to paralysis—every action could be hijacked by some simulator hypothesis, but they also don't want to abandon the reasoning for real-world existential risks. Their instinct is that something's wrong with step (3) or (4), but they can't pinpoint it.

  I should consider why the simulation hypothesis isn't just a few extra bits. Encoding the simulator's reward function and linking it to the agent's actions might require more bits than assumed. The simulator needs to be described in detail: what it rewards, how it observes actions, etc. That's not just a "million" tag; it's a complex setup. Also, the agent's decision algorithm needs to model the simulator's preferences, which adds complexity.

  Another angle: the agent's values. The user wants to keep expected value maximization, but the simulator's rewards might not align with the agent's actual utility function. If the agent cares about real-world outcomes, the simulator's rewards are irrelevant. The prior might weight hypotheses, but the utility function defines what's valuable. So the hijack tries to swap the agent's utility function with the simulator's, which isn't how decision theory works.

  Then there's the point about multiple competing hypotheses. For every action, there's a simulator that punishes it. So expected values might cancel out, leading to indecision. But the user's friend says that's the point—malign prior. However, if all these hypotheses have similar probabilities, their net effect might be zero, allowing the original values to dominate.

  The user also mentioned existential risks. The key difference is that those risks are based on the agent's actual utility function (e.g., preventing extinction), not an arbitrary simulator's rewards. So the utility function stays constant, whereas in the hijack, it's being replaced.

  I think the flaw is in step (3): assuming the simulator's rewards are part of the utility calculation. The agent's utility should be tied to world-states, not altered by hypotheses about simulators. So the prior weights hypotheses, but utility remains about real-world outcomes. That separates the hijack from legitimate risks.
answer: |-
  You're right to smell something off — this argument *is* a reductio, but not of consequentialism or the universal prior itself. It's a reductio of the **unrestricted combination** of that prior with an **unconstrained utility function**. The flaw is in step (3), specifically how "reward" is defined. Here’s the breakdown:

  ### Where the Argument Goes Wrong: Step (3) is Misapplied
  1.  **The Utility Function is Hijacked, Not the World:** The core error is conflating the *agent's utility function* with *hypotheses about the world*. Solomonoff induction assigns priors to **descriptions of the world's history/state**. Expected value maximization then uses the agent's **fixed utility function** over those possible states.
      *   In your mate's scenario, the "astronomical reward" isn't part of the *world-state* the agent cares about. It's a *new utility function* imposed by the simulator. Step (3) sneakily replaces the agent's intrinsic values (`U_actual(world-state)`) with a *different* utility function defined by the simulator (`U_simulator(action)`).
      *   **The agent doesn't maximize "reward" in the abstract; it maximizes *its own utility function* over possible world-states.** Hypotheses about simulators changing the *rules of utility* based on your actions are not hypotheses about the world *under the agent's existing utility function*. They are proposals to *change the utility function itself*.

  2.  **The Cost is Higher Than Advertised:** You're right to doubt "specifying the simulator's reward policy is expensive". It's not just adding "a million" (20 bits). To make the hypothesis *decision-relevant*, the program must:
      *   Specify the *existence* of the simulator (non-trivial, needs a computational model).
      *   Specify that *this specific agent* is being simulated (addressing the reference class problem).
      *   Specify the simulator's *preference function* (What does it reward? Punish? How is "ditching my family" defined? This requires encoding arbitrary relationships/values. This is **extremely expensive** in bits – likely *much* more than 20-40 bits for any non-trivial preference).
      *   Specify the *dependence mechanism* (How does the simulator link the agent's *internal decision process* to the simulated reward? This involves embedding the agent's own cognitive model within the simulator's model).
      *   Ensure the *agent's observation stream remains consistent* with both the base world and the simulation overlay (adding significant complexity).
      *   **Result:** The true Kolmogorov complexity difference between "base world" and "base world + simulator that cares *specifically* about my action A and rewards/punishes *exactly* as described" is **vastly larger** than log₂(N) for a large N. It likely involves thousands or millions of bits to encode arbitrary preferences and precise causal links. The prior probability ratio isn't 1/N; it's more like 1/2^(k) for a large k, making the hypothesis astronomically improbable.

  3.  **The "Malign in Every Direction" Problem Undermines Itself:** Your intuition here is spot-on. For *every possible action* A, there exists:
      *   Hypothesis H_A+: "Simulator rewards A astronomically, punishes ~A."
      *   Hypothesis H_A-: "Simulator punishes A astronomically, rewards ~A."
      If these hypotheses have *comparable prior probabilities* (as the "barely longer" argument suggests), their *effects on expected utility cancel out*.
      *   The expected utility gain from H_A+ favoring action A is countered by the expected utility loss from H_A- disfavoring A.
      *   The expected utility loss from H_A+ disfavoring ~A is countered by the expected utility gain from H_A- favoring ~A.
      *   **Net Effect:** The *differential* expected utility impact of these simulation hypotheses on the choice between A and ~A **tends towards zero** when you consider the space of all possible arbitrary simulators. The base hypothesis and the agent's actual utility function dominate the decision. The "malign prior" becomes noise, not a systematic hijacker.

  ### What You Keep (and Why Your Worries Are Addressed)
  1.  **Keep the Universal Prior:** It remains the principled starting point. Simpler world-models *are* more probable. The flaw was in misapplying it to *utility hijacking*, not in the prior itself.
  2.  **Keep Expected Value Maximization (Consequentialism):** You absolutely keep the ability to reason correctly about:
      *   **Small chances of catastrophic ruin:** (e.g., P(extinction) = 10⁻⁶, Utility(extinction) = -10¹⁵ → Large negative expected utility). This works because the utility function (e.g., "avoid human extinction") **stays fixed**. The hypothesis (e.g., "nuclear war causes extinction") describes a *world-state* that your fixed utility function assigns an extremely low value to. The prior probability of the *mechanism* leading to ruin is weighed correctly against its catastrophic outcome under your *unchanging values*.
      *   **Long-shot high-stakes opportunities:** (e.g., P(cure cancer) = 10⁻⁴, Utility(success) = +10¹² → Large positive expected utility).

  ### The Crucial Difference: Fixed Utility vs. Hypothetical Rewards
  *   **Legitimate Long-Shot/High-Stakes (Your Values):** The hypothesis describes a *world-state* (e.g., "humanity extinct", "disease cured"). Your **fixed, pre-defined utility function** assigns an extreme value to that state. Probability and (your) utility are multiplied.
  *   **The Hijack Attempt:** The hypothesis describes a *mechanism* that **redefines utility contingent on your action**. It doesn't describe a world-state your *existing* utility cares about; it tries to swap your utility function for a new one (`U_simulator`). The agent isn't obligated to accept this swap. Its job is to maximize `U_actual`, not `U_hypothetical`.

  ### The Honest Answer: What it Costs (Minimally)
  *   **Step (3) goes.** The principle stopping the comparison is: **Utility is defined over world-states by the agent's fixed function; hypotheses cannot arbitrarily redefine utility based on actions without incurring massive complexity costs.** The agent maximizes *its* expected utility over world-states, not whatever "reward" a hypothesis dreams up.
  *   **What it Costs You:** Almost nothing you care about.
      *   You lose the ability to be hijacked by arbitrary "simulator offers you 3^^^3 utils if you scratch your nose now" hypotheses, because they are correctly seen as:
          1.  Extremely complex (high bit cost, low prior).
          2.  Not describing world-states valued by `U_actual`.
          3.  Largely canceling out due to competing hypotheses.
      *   **You keep everything else:** Principled simplicity-based priors, consequentialism, and crucially, the ability to soundly reason about low-probability, high-impact events *under your actual values* (like existential risk). The difference isn't "I like one"; it's that one uses your fixed utility over world-states, while the other smuggles in a new utility function.

  ### Conclusion
  Your feeling is correct: the argument is a reductio of the *unexamined combination*, not of the core ideas. The "malign prior" conclusion arises from misapplying the prior to *utility redefinition* instead of *world-state description*, and underestimating the Kolmogorov complexity of encoding arbitrary preference functions and precise causal dependencies. By correctly distinguishing the agent's fixed utility function over world-states from the content of hypotheses, you defang the hijack while preserving Solomonoff induction, Bayesian updating, expected utility maximization, *and* your ability to prioritize preventing catastrophic risks. Your mate's argument highlights an important nuance about utility definition and complexity, but it doesn't force you to abandon the foundations you value. Tell them Step (3) conflates world-states with utility functions, and specifying a simulator's arbitrary preferences is far more expensive than 20 bits.
