prompt: |-
  Okay so I've gotten into a stupidly long argument with a freind who's a type designer and I want to actually put a number on it, because I keep flip-flopping. The background: I've been poking at Hofstadter's old Letter Spirit project, where the whole premise is that each letter has a kind of Platonic core -- its spirit -- and each typeface has a spirit too, and the program's job is to invent new letterforms that are obviously still that letter but in a style nobody's seen before. What keeps bugging me is that 'a' comes in at least two shapes that share basically no geometry: the double-story one (bowl, little curved roof, stem) and the single-story round one you see in a lot of handwriting and geometric sans faces, and everyone reads both as 'a' without blinking. So where's the core, exactly?

  Then my friend has this variable font she's building where one axis continuously deforms an 'a' toward something more like an 'e', or a blob -- you drag a slider and watch it go frame by frame. She insists there's a determinate fact of the matter about every frame on that slider: each one either is or isn't an 'a', and the mushy feeling you get in the middle is just us being unsure, not the world being fuzzy. I think that's probably wrong but I don't trust my gut here and I want a real number.

  So give me your actual credence in the claim: for any two letterforms that are both clearly readable as 'a', and any continuous morph path between them, there's a determinate fact of the matter about whether each intermediate form is an 'a' -- i.e. the category has sharp boundaries and not just graded typicality. And don't just hand me the number, decompose it. Roughly how much of your credence rides on (1) whether perceptual/conceptual categories in general have sharp boundaries vs prototype/graded structure, (2) whether the space of possible letterforms is effectively discrete enough -- constrained by stroke roles and by what the style will tolerate -- that the path never actually crosses a real gray zone, (3) whether 'a' is more like a natural kind with a hidden essence or more like a conventional kind, the game/money sort of thing, (4) whether the question is even well-posed (is vagueness a feature of the world or just of our words?), and (5) any term you'd add. Number and one line of justification for each, how they combine, then the total. Also, I'm sitting around 0.2 and she's up at like 0.8, so tell me which term we most likely actually disagree on, which term you're least confident in yourself, and what would move it most.
