            Announce: "It is now common knowledge that at the beginning of Phase 2, each traveler chose their disposition (honest, bonded, or opportunistic) with the sole aim of maximizing their total points for the entire game. Their choice was made for purely instrumental reasons."

            Then we run 2 more rounds.

          Minute 48-56: Phase 3 (2 rounds).

          Minute 56-76: Debrief.

