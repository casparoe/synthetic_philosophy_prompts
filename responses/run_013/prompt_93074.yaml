     What the activity cannot reproduce:

       1. The hitchhiker cannot simply decide to become the kind of person who pays. In the game, travelers choose a disposition card, but in reality, character is not so easily chosen.

       2. The opacity of real character: in the game, the disposition is public and known. In reality, we often don't know another's character.

       3. The case with no third party and no repeat play: the bond requires an external enforcer (the facilitator) and the reputation requires repeated interactions.

       4. The activity cannot establish why being an honest person should be valued beyond its instrumental payoff.

     The facilitator must:

        - In the debrief, explain that in reality, becoming an honest person is not a simple decision, but a matter of cultivation of character.
        - Note that in one-shot interactions with no external enforcer, commitment might be impossible and the hitchhiker's problem may have no solution.
        - Point out that the game shows the instrumental value of honesty, but that in life we might value honesty intrinsically.

     The game should not pretend to show that honesty is intrinsically valuable, only that it can be instrumentally rational.

