          Minute 0-5: 
            - Explain the game: 
              * We are simulating a ride-hailing market. 
              * Roles: travelers and drivers (12 travelers, 4 drivers).
              * Each round: 
                    Travelers request a driver by sending a slip.
                    Drivers choose at most one traveler (or none) to carry.
