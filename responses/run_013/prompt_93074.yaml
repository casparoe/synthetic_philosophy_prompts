  ### Hitchhiker's Predicament: In-Class Game Design

  **Learning Goal:** Experience the rational necessity of pre-committing to a disposition that seems locally irrational (paying upon arrival) to achieve globally optimal outcomes (getting rides).

  ---

  ### **Game Structure**
  **Roles:**  
  - **Travelers (10 students):** Need rides to earn points.  
  - **Drivers (6 students):** Provide rides at a cost.  
  *Why 10:6?* Creates competition among travelers, forcing drivers to be selective.

  **Point System:**  
  - Traveler earns **100 pts** upon arrival.  
  - Driver incurs **-10 pts** per ride (cost of fuel/time).  
  - Agreed payment: **50 pts** from traveler to driver after arrival.  
  - **Bond cost:** 60 pts (forfeited if traveler reneges; returned if they pay).  

  **Key Incentives:**  
  - A *payoff-maximizing traveler* reneges at arrival (100 > 100–50).  
  - *Drivers* who expect reneging refuse rides (lose 10 pts).  
  - **Equilibrium without commitment:** No rides, 0 pts for all.  

  ---

  ### **Materials**
  1. **Disposition Cards** (3 types per traveler):  
     - **Green (Honest):** "Always pays, no matter what."  
     - **Blue (Bonded):** "Posted 60-pt bond. Forfeits bond if reneges."  
     - **Red (Opportunistic):** "Pays or reneges freely."  
  2. **Bond Tokens:** 60-pt chits (for bonded travelers).  
  3. **Ledgers:** Track points (starting balance: 100 pts each).  
  4. **Request Slips:** Travelers write name + disposition to request rides.  
  5. **Whiteboard:** Track matches and public dispositions.  

  ---

  ### **Sequence of Play (55 minutes)**  
  **Phase 1: Collapse (15 minutes)**  
  *Goal: Experience market failure without commitment.*  
  - **Round 1 (5 min):**  
    - Travelers request rides via slips (no dispositions yet). Drivers accept/reject.  
    - **After match:** Travelers arrive (gain 100 pts), then choose: pay (lose 50, driver gains 50) or renege (no cost, driver loses 10).  
    - *Expected outcome:* Most travelers renege; drivers lose points.  
  - **Rounds 2–3 (10 min):**  
    - Repeat. Drivers grow wary; many refuse rides. Trade collapses.  
    - *Debrief note:* "Why did drivers stop offering rides?"  

  **Phase 2: Commitment Devices (25 minutes)**  
  *Goal: Revive trade via dispositions/bonds.*  
  - **Setup (5 min):**  
    - Travelers choose a disposition:  
      - **Honest:** Take green card.  
      - **Bonded:** Surrender 60 pts for a bond token + blue card.  
      - **Opportunistic:** Take red card.  
    - Dispositions displayed publicly.  
  - **Rounds 4–8 (20 min, 4 min/round):**  
    - Travelers add disposition to request slips.  
    - Drivers see dispositions and choose riders.  
    - Honest/bonded must pay (bonded lose token if they renege). Opportunistic choose freely.  
    - *Expected outcome:* Honest/bonded get rides; opportunistic are stranded.  

  **Phase 3: Common Knowledge (15 minutes)**  
  *Goal: Show instrumental rationality of dispositions.*  
  - **Announcement (2 min):**  
    - "All travelers chose dispositions *in advance* to maximize total points. Rationality is public knowledge."  
  - **Rounds 9–10 (8 min):**  
    - Repeat Phase 2. Drivers exclusively carry honest/bonded travelers.  
  - **Final Settlement (5 min):**  
    - Honest travelers: Keep all earnings.  
    - Bonded travelers: Refund 60-pt bond *only if* they never reneged.  

  ---

  ### **Debrief (25 minutes)**  
  1. **Map Game to Theory (15 min):**  
     - **Collapse:** "Why did no one get rides? Travelers reneged → drivers refused → Pareto-worst outcome."  
     - **Dispositions:** "Honest travelers pay despite local cost. But by pre-committing, they get rides. The 'irrational' act is globally rational."  
     - **Bonds:** "External commitment (like contracts) substitutes for character. But bonds cost points—internal disposition is cheaper."  
     - **Common Knowledge:** "When rationality is public, opportunistic players are screened out. You *must* commit visibly to succeed."  

  2. **Key Insight (5 min):**  
     - "The theory that says ‘always maximize locally’ (renege) is self-effacing. If followed, it destroys the system. The winning strategy is to pre-commit to ‘irrationality’."  

  3. **Student Reflection (5 min):**  
     - "Would you pay as a traveler? Why did bonded players lose points? How is this like real-world promises?"  

  ---

  ### **Predictable Problems & Solutions**  
  1. **Players try to pay upfront/side-deal:**  
     - *Problem:* Violates "payment after arrival" rule.  
     - *Fix:* Announce: "Upfront payments voided. No side deals—enforcement impossible." Penalize violators (-20 pts).  

  2. **Drivers give free rides (muddying incentives):**  
     - *Problem:* Altruism masks the collapse dynamic.  
     - *Fix:* Stress: "Drivers are payoff-maximizers. Losing 10 pts is unsustainable." Award bonus points to strict drivers.  

  3. **Overused bonds (obscuring character):**  
     - *Problem:* Bonds dominate if players ignore the cost.  
     - *Fix:* Debrief: "Bonds tie up capital. Honesty is free—why didn’t everyone choose it?" Contrast point totals.  

  4. **Anxiety over points:**  
     - *Problem:* Students treat points as real stakes.  
     - *Fix:* Open with: "Points are frictionless. Focus on the structural dilemma."  

  ---

  ### **What the Game Cannot Capture**  
  1. **Becoming "the kind of person who pays":**  
     - The game lets travelers *choose* a disposition card. Real character requires habituation, not just choice.  
     - **Facilitator must say:** "In life, becoming honest isn’t a switch. It’s a cultivated trait. The game abstracts this."  

  2. **Opacity of real character:**  
     - Dispositions are public in-game. Real drivers can’t see "honesty cards."  
     - **Facilitator must say:** "This game assumes perfect information. Reality requires signals (reputation, brands) to infer character."  

  3. **No third-party/repeat-play edge cases:**  
     - Bonds require an enforcer (facilitator). Repeat play enables reputation.  
     - **Facilitator must say:** "Without repeat interactions or courts, commitment may fail. The hitchhiker truly stranded has no solution here."  

  4. **Value beyond payoff:**  
     - The game equates rationality with points. Real integrity may be intrinsically valuable.  
     - **Facilitator must say:** "The game shows honesty’s *instrumental* value. It doesn’t prove honesty is morally right—only that it’s pragmatically necessary."  

  **When to Stop:** End the simulation after Phase 3. Use debrief to clarify limits. Do not claim the game "proves" morality or solves one-shot dilemmas. Stress: "This is why societies invent repeat play (reputations) and third parties (courts). But the core bind remains."  

  ---

  ### **Timeline Summary**  
  - **Setup:** 5 min  
  - **Phase 1 (Collapse):** 15 min  
  - **Phase 2 (Commitment):** 25 min  
  - **Phase 3 (Common Knowledge):** 15 min  
  - **Debrief:** 25 min  
  **Total:** 80 minutes  

  This design forces students to *live* the hitchhiker’s paradox, then collectively unpack it. The gameplay creates frustration (collapse) and relief (commitment), priming deep discussion of rationality’s limits.
