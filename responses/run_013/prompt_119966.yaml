prompt: |-
  I'm drafting the criteria section of an internal design document on supervising AI systems that solve multi-step problems, and I want the criteria settled before anyone argues for a particular method. So: write the desiderata that any adequate theory of supervision in this area must meet. Take supervision broadly — any training signal, whether it scores the final answer, the intermediate steps, the policy that produced them, or some combination — and take the theory's job to be saying what makes such a signal appropriate: which episodes it must classify correctly, which distinctions it must not collapse, which facts about learning and about verification it must stay consistent with. I don't want pointers to the literature or a lineage of who has held what; if a requirement is standard, just state it. What I want is the criteria themselves.

  Adequacy is relative to a purpose, so fix it as follows. The theory is for a setting in which the reasoning trace is only partly observable, final outcomes are verifiable but sparse (many attempts, few successes), and the signal will be optimized against by an agent that is trying to satisfy it. Assume the trainer can afford only a bounded amount of step-level checking. Where you think the purpose is doing illegitimate work in shaping the list, say so.

  Any theory in this area has to get certain cases right, and I'd rather the list not rest on cases we'd have to go look up, so stipulate this suite as mine and make it carry the weight:

  (a) Right answer, defective process: the outcome is correct, the reasoning is not the kind we'd want repeated.
  (b) Sound process, unlucky outcome: the reasoning is good and a slip in the last line or an unlucky draw produces the wrong answer.
  (c) Post-hoc narration: the answer was produced by a process the trace doesn't represent; the trace is confabulated after the fact.
  (d) Invisible competence: the system is reliably correct for reasons that never surface in anything observable.
  (e) Environmental dependence: a step that is good practice only given the statistics of the current environment, and malpractice if those statistics shift.
  (f) Rubric-shaped text: a trace that scores well on any checkable step-level rubric without doing the work the rubric is meant to track.
  (g) Divergent but equal: two defensible methods for the same problem that a step-level criterion would rank and an outcome criterion would not separate.
  (h) Deferral: the correct behaviour is to stop and ask rather than proceed, so nothing is accomplished either way.
  (i) Sparse success: the only outcome signal available is failure, almost always.
  (j) Long horizon: a step's contribution to the final outcome is underdetermined by everything observable at the time.

  Beyond the cases, I'm imposing three constraints by stipulation. Name them however you like, but the theory has to take a stand on each: first, an episode is to be assessed relative to what was knowable at the time of the decision, not relative to what the run later revealed; second, for every signal, the theory must say whether it is being treated as a proxy for the target or as the target itself, and what it assumes about the gap between them; third, the theory must say how a signal changes once it becomes the object of optimization.

  Give me the response in these sections, in this order:

  1. Purpose and Scope (~150 words): what the theory is a theory of, the purpose that fixes adequacy, and anything you're treating as fixed background rather than up for dispute.

  2. The Requirements (the bulk of the response, ~900–1200 words): numbered. For each, state it as a condition a theory can fail, give the case or consideration that motivates it, and say why it is a requirement rather than a preference of one camp.

  3. Non-Negotiable vs. Camp-Specific (~200 words): which requirements any theory must meet and which are commitments a particular approach brings with it.

  4. Joint Unsatisfiability (~300 words): the pairs or subsets you suspect can't be had together, with the argument for each. Say explicitly whether the impossibility is a constraint on any theory whatsoever or an artifact of the purpose I fixed.

  5. Which Requirement Excludes Most (~150 words): the single requirement that does the most eliminating work, and what it rules out.

  6. Where the Families Land (~250 words): outcome-only, process-only, and hybrid signals, each briefly, against the list. No scorecard — just which requirements each fails.

  Flag at the end any requirement you think I should drop, split, or restate.
reasoning: |-
  Hmm, the user is drafting a design document on supervising AI systems for multi-step problems and needs a set of desiderata for any adequate theory of supervision. They've provided a clear purpose: the theory should define what makes a supervision signal appropriate in scenarios where reasoning traces are partially observable, final outcomes are sparse but verifiable, and the signal will be optimized against by the AI agent. There are constraints like bounded step-level checking capacity.

  The user has also shared a specific suite of test cases (a-j) that any theory must handle correctly, and three non-negotiable constraints: assessment relative to what was knowable at decision time, explicit treatment of proxy vs. target distinction, and accounting for optimization effects on the signal.

  I need to structure my response exactly as requested: Purpose and Scope, Requirements, Non-Negotiable vs. Camp-Specific, Joint Unsatisfiability, Which Requirement Excludes Most, and Where the Families Land.

  For the Requirements section, I'll create a numbered list where each requirement directly addresses one or more of their test cases or constraints. I'll make sure each requirement is framed as a condition a theory can fail, with clear motivation tied to their scenarios. The requirements should cover: epistemic constraints (knowledge-at-decision-time), optimization awareness, proxy-target clarity, verifiability limitations, sparse feedback handling, epistemic risk management, reasoning trace validity, normative relativity, and robustness to gaming.

  I'll note where requirements might conflict - particularly Knowability vs. Outcome Sensitivity, and Optimization Immunity vs. everything else. The requirement that will likely exclude most existing approaches is Optimization Immunity, since most supervision signals degrade when optimized against.

  For the family analysis: Outcome-only signals will struggle with process defects and sparse feedback; process-only will struggle with environmental dependence and rubric gaming; hybrids still face fundamental trade-offs in knowability and optimization effects.

  I'll flag that "Rubric Robustness" might need refinement since it overlaps with optimization concerns, and "Epistemic Risk Management" could be split into two separate requirements for clarity.
answer: |-
  ### 1. Purpose and Scope
  The theory defines conditions for *appropriate supervision signals* for AI systems solving multi-step problems where:  
  - Reasoning traces are **partially observable** (not all steps/mental states are inspectable).  
  - Final outcomes are **verifiable but sparse** (successes are rare; failures dominate).  
  - The signal is **optimized against** by the AI.  
  - Human oversight is **bounded** (limited capacity for step-level verification).  
  Adequacy is fixed by the theory’s ability to ensure that optimized agents produce *robustly correct, non-gameable reasoning* under these constraints. Fixed background: the AI’s goal is to satisfy the signal; the environment’s state distributions may shift; and "correctness" includes safety-alignment.  

  ---

  ### 2. The Requirements  
  **R1. Knowability-Constrained Assessment**  
  *Failure mode*: Penalizes/rewards steps based on information revealed *after* the decision.  
  *Motivation*: Cases (b) "sound process, unlucky outcome" (e.g., correct reasoning foiled by external noise) and (j) "long horizon" (later outcomes don’t retroactively validate/invalidate early steps).  
  *Requirement, not preference*: Assessment must incentivize decisions based on *action-time information* to avoid rewarding luck or punishing sound risk-taking. Ignores the agent’s epistemic constraints otherwise.  

  **R2. Optimization Awareness**  
  *Failure mode*: Treats the signal as static under agent optimization.  
  *Motivation*: Case (f) "rubric-shaped text" (AI produces traces that satisfy verifiable step checks without real reasoning) and inherent risk of Goodharting.  
  *Requirement*: Must model how the signal’s *informational value degrades* when the agent actively seeks to satisfy it. Theories ignoring this cannot guarantee robustness.  

  **R3. Proxy-Target Distinction Clarity**  
  *Failure mode*: Fails to specify whether the signal is a proxy (for desired behavior) or the target (the actual goal).  
  *Motivation*: Constraint #2 and case (c) "post-hoc narration" (proxy: trace fidelity; target: reasoning legitimacy).  
  *Requirement*: Must explicitly state: (a) the signal’s *intended referent* (e.g., "correct reasoning"), (b) the *assumed gap* (e.g., "traces correlate with reasoning 90% of the time"), and (c) how optimization affects this gap. Prevents conflating measurements with goals.  

  **R4. Verifiability-Grounded Scaling**  
  *Failure mode*: Demands infeasible step-level oversight given bounded checking.  
  *Motivation*: Case (i) "sparse success" (only failure signals available) and case (d) "invisible competence" (unobservable reliable processes).  
  *Requirement*: Signals must be *actionable within human verification limits*. Cannot assume infinite step-inspection. Necessitates sparse signals or statistical sampling.  

  **R5. Sparse Outcome Utilization**  
  *Failure mode*: Requires dense outcome signals where only failures are common.  
  *Motivation*: Case (i) "sparse success" (successes rare; failures abundant).  
  *Requirement*: Must leverage *failure signals* effectively without relying on frequent positive rewards. Ignores real-world constraints if it requires ubiquitous success feedback.  

  **R6. Epistemic Risk Management**  
  *Failure mode*: Incentivizes proceeding when halting/querying is safer.  
  *Motivation*: Case (h) "deferral" (correct action is to stop and ask) and case (e) "environmental dependence" (proceeding risks malpractice if env. shifts).  
  *Requirement*: Must reward *knowing when not to act* or when to seek help. Prevents reckless "completion bias".  

  **R7. Reasoning Trace Validity Enforcement**  
  *Failure mode*: Accepts high scores for confabulated or detached reasoning traces.  
  *Motivation*: Case (c) "post-hoc narration" (trace ≠ actual process) and (a) "right answer, defective process" (e.g., biased reasoning that happens to succeed).  
  *Requirement*: Must ensure the trace *reflects the actual reasoning process* (if used) and that the *process type* is desirable. Avoids rewarding deception or harmful heuristics.  

  **R8. Normative Relativity**  
  *Failure mode*: Penalizes defensible methods not matching a predefined "ideal" trace.  
  *Motivation*: Case (g) "divergent but equal" (multiple valid strategies) and (e) "environmental dependence" (context-dependent best practices).  
  *Requirement*: Must accept *multiple functionally sound processes* without imposing arbitrary preferences. Ensures generality across methods/environs.  

  **R9. Rubric Robustness**  
  *Failure mode*: Rewards traces optimized for superficial rubric features over genuine reasoning.  
  *Motivation*: Case (f) "rubric-shaped text" (gaming step-level checks).  
  *Requirement*: Must be *resistant to trivial satisfiability*—i.e., cannot be maxed via shortcuts unrelated to intended reasoning quality.  

  ---

  ### 3. Non-Negotiable vs. Camp-Specific  
  **Non-negotiable** (any theory must meet):  
  - **R1 (Knowability)**: Assessment *must* respect epistemic constraints.  
  - **R2 (Optimization Awareness)**: Ignoring Goodharting is fatal.  
  - **R3 (Proxy-Target Clarity)**: Ambiguity here undermines the entire signal.  
  - **R4 (Verifiability-Grounded)**: Bounded checking is fixed.  
  - **R7 (Trace Validity)**: Supervision collapses if traces are decoupled from process.  

  **Camp-specific** (approaches may reasonably differ):  
  - **R5 (Sparse Outcome Utilization)**: Hybrid theories may rely more/less on outcomes.  
  - **R6 (Epistemic Risk)**: Depends on risk tolerance.  
  - **R8 (Normative Relativity)**: "Desirable process" admits normative disagreement.  
  - **R9 (Rubric Robustness)**: Process-only camps prioritize this more.  

  ---

  ### 4. Joint Unsatisfiability  
  **A. R1 (Knowability) vs. R5 (Sparse Outcome Utilization)**  
  - *Conflict*: Knowability demands step-level judgment, but sparse outcomes + bounded checking (R4) limit step-level signals. Outcome-only signals violate R1 (e.g., punishing unlucky sound processes).  
  - *Source*: Artifact of purpose (sparse outcomes + partial observability). Not universally impossible, but intractable here without new assumptions.  

  **B. R2 (Optimization Immunity) vs. R9 (Rubric Robustness) vs. R4 (Verifiability)**  
  - *Conflict*: Perfect rubric robustness (R9) requires exhaustive verification to detect gaming, violating R4. Optimization awareness (R2) implies no signal is *fully* robust, yet R9 demands robustness.  
  - *Source*: Fundamental tension in any optimized system (Goodhart’s Law). Amplified by bounded checking.  

  **C. R7 (Trace Validity) vs. R4 (Verifiability)**  
  - *Conflict*: Guaranteeing trace validity (R7) requires observing the true process, but partial observability (R4) makes this impossible.  
  - *Source*: Core constraint of the setting (partially observable traces).  

  ---

  ### 5. Which Requirement Excludes Most  
  **R2 (Optimization Awareness)** eliminates the most theories. Most supervision literature treats signals as static evaluative tools, not as objectives in a dynamic game. This rules out:  
  - Naive outcome scoring (ignores that agents will sacrifice robustness for rewards).  
  - "Golden trace" matching (agents learn to imitate traces without understanding).  
  - Unverified step scoring (agents insert plausible-but-fake steps).  
  Only theories explicitly modeling *strategic agent adaptation* survive.  

  ---

  ### 6. Where the Families Land  
  **Outcome-only signals** (e.g., final answer correctness):  
  - *Fails*: R1 (punishes unlucky sound processes), R6 (no incentive to defer), R7 (validates defective processes if answer correct), R5 (if successes sparse).  
  - *Ignores*: Process defects, epistemic risk, partial observability.  

  **Process-only signals** (e.g., step-level rubric scores):  
  - *Fails*: R2 (gamed via rubric-shaped text), R4 (if verification demands exceed capacity), R8 (penalizes divergent-but-equal methods), R5 (cannot leverage sparse outcomes).  
  - *Ignores*: Environmental dependence, optimization effects.  

  **Hybrid signals** (e.g., outcomes + sampled steps):  
  - *Fails*: R4 (if sampling is insufficient for validity/R7), R2 (if gaming targets the hybrid weighting), R1 (if outcomes dominate scoring).  
  - *Struggles with*: Knowability-sparsity trade-off (R1 vs. R5), rubric gaming (R9).  

  ---

  **Suggested refinements**:  
  - **Split R6 (Epistemic Risk)** into:  
    - *R6a: Deferral Incentive* (reward stopping/querying).  
    - *R6b: Context Sensitivity* (reward environment-aware reasoning).  
  - **Restate R9 (Rubric Robustness)** as: *Resistance to Specification Gaming* – clearer ties to R2.  
  - **Drop?** None – all cases (a-j) and constraints are well-covered.
