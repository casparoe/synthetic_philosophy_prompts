prompt: |-
  ok so context first: I've been reading rationalist blogs and forums since like 2009, so basically all of my moral machinery is decision theory — utility functions over world-states, expected value, VNM, the whole shut up and multiply thing, dust specks vs torture, that entire corpus. I have zero formal philosophy training though, so half of what I'm about to say is probly me misremembering.

  There's this debate I keep half-bumping into, the one about whether the numbers count when you can save one person or save five, where the guy (Taurek?) says the numbers just dont give you a reason, that five people don't have a bigger claim than one just because there's more of them, and that if you're going to favor anyone at all you should at least flip a coin. I want you to restate his position as faithfully as you can in the vocabulary I actually think in — expected utility, a utility function over outcomes, what it is to be a rational agent choosing under uncertainty, and whatever bargaining or social-choice machinery looks closest to the coin flip. Please dont strawman him into he's just being irrational.

  Then the residue report, which is the part I actually care about, and I want it specific:

  - My gut says Taurek's coin flip is just a symmetric bargaining solution — the thing you get when you refuse to compare utilities across people and impose a symmetry axiom instead. Am I right, or am I flattening him?

  - Cant I trivially represent the numbers-dont-count view as just a utility function that happens to be insensitive to how many people get saved? If yes, then the whole debate looks like a difference in utility functions and there's nothing deep in it — so tell me if that's the right way to see it, and if it isn't, tell me exactly what in the framework blocks the trivial move.

  - The one I really want: does the framework presuppose there's a single chooser, a we with one utility function over outcomes, when Taurek's whole point is that there is no we, just separate people with separate claims? If that's the bit that doesn't survive the translation, say so — and then tell me which it is, the framework missing something real or Taurek's view being mushier than it looks. And if I take the axioms seriously, am I not just forced into aggregation anyway (isn't that the Harsanyi thing)?

  Dust specks vs torture is where the numbers-count intuition usually shows up in my neck of the woods, so if the translation has anything non-obvious to say about that case, throw it in, but dont force it.

  Keep it honest — dont smuggle in well obviously you maximize total utility and call that a translation rather than taking a side.
