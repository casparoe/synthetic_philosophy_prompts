  First, I need to create a strong, non-strawman version of these arguments. The legal incompleteness claim requires formalizing a tax code into a Gödel-system—arithmetic capable, consistent, recursive. The mind-machine argument needs the mind's "self-verification" ability. These must feel concrete enough to resist dismissal.

