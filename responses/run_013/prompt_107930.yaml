  - Relative unprovability (system-dependent)
  - Truth's reliance on ω-consistency vs. Rosser's fix
  - Second theorem symmetry (humans also can't self-prove consistency)
  - Meta-system costs (Turing machine hierarchies)
  - One genuine application (e.g., Turing machines halting problem) vs. vibes (legal codes failing recursiveness)

  Marking scheme should penalize:
  - Missing relative unprovability (calling things "absolutely unprovable")
  - Handwaving truth/consistency distinctions
