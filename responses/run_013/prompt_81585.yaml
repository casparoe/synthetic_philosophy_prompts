prompt: |-
  Ok so here's the thing thats been bugging me all term, and I want to use it in my grad seminar, so I'd like your honest take rather than a survey of the literature.

  Everyone fights about when the Anthropocene starts — the bomb spike, Watt's steam engine, the colonial dip in CO2, take your pick. I care about the question one level up: is there a fact of the matter here at all?

  Take P: "There is a correct answer to when the Anthropocene began, and any committee that ratifies a date is either getting it right or getting it wrong." Not a defensible convention, not a useful marker — a fact, out there to be discovered or missed.

  Give me your credence in P, and please don't just hand me a number with a shrug. Decompose it. Candidate terms below, use them or swap in better ones if you see something I've missed:

  (a) how discovery-like versus convention-like stratigraphic boundaries generally are — the golden spike is a physical thing in a physical rock, but a room full of people votes on it;
  (b) whether the Anthropocene is a special case because the marker is us, so the boundary is only detectable by the very technosphere it dates, which smells faintly self-referential;
  (c) my hobby horse: whether treating it as a diachronous event rather than a point boundary (the great oxidation event is my model here) turns "when did it start" into a bad question rather than a merely hard one;
  (d) whether "epoch" picks out a natural kind at all, or is just a handy bucket that the International Commission could redefine next decade;
  (e) the blind stratigrapher test — a geologist turning up in ten million years with no knowledge of us: would she draw the line where we do? If not, what does that do to P?

  Numbers and one line of justification per term, then show me how you combine them into the final figure. Then tell me which term you're least confident about and what evidence would move it most. Finish with \crux{...} naming the term your answer is most sensitive to, and then, as the very last line, \answer{...} containing your credence in P to two decimals.
