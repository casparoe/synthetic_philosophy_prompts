prompt: |-
  My friend's a political theory grad student and she swears the left/right split is a real distinction and not just an accident of where people happened to sit in the French assembly, but honestly her actual calls are hard to predict. She files anarcho-capitalists as right, Soviet-style communists as left, fascists as right, social democrats as left, the 60s counterculture as left, the religious right as right, and a Catholic-traditionalist party that wants a generous welfare state but also wants to keep the old social hierachy firmly in place as right too. Now a movement has turned up in our seminar that wants to abolish private ownership of the means of production and flatten class hierarchy altogether, while at the same time restoring a strict traditional religious and moral order and rolling back what it calls cultural decay. Where does she file it? I care less about the label than about the rule she seems to be running to hold each side together, the other rules that fit her earlier calls just as well, what each of those predicts for this case, your best guess at which one she's really using, and a further case that would actually tell them apart.
