  Therefore, the hierarchy rule seems most consistent. For the new group, flattening class is a left move, but restoring traditional order is right. The friend might prioritize the economic hierarchy reduction because it's a core left tenet. Especially since the left is often defined by opposition to class hierarchy. So she'd file them as left.

  But the user mentioned that the Catholic group with welfare is right because of social hierarchy. So if the new group enforces cultural hierarchy, even without class hierarchy, it might be right. But abolishing class hierarchy is fundamental to the left. This is tricky.

  Perhaps the friend sees the left as opposing all hierarchies, while the right accepts some. The new group opposes class hierarchy but enforces cultural ones. Since they're not opposing all hierarchies, they might not be purely left. But the Soviet communists enforced party hierarchies, yet are still left. So maybe it's about intention or primary focus.

  Best guess: the friend's rule is that the left fundamentally opposes fixed social/class hierarchies, while the right accepts/enforces them. Cultural issues are secondary unless they reinforce social hierarchies. The new group flattens class, so left, despite cultural conservatism. Similar to how some left movements have been culturally conservative.

  Test case: a group that supports free-market capitalism (economic right) but is radically progressive on social issues (e.g., LGBTQ+ rights, gender equality). Under the hierarchy rule, free-market maintains economic hierarchy, so right. Under cultural rule, they'd be left. But the friend's past classifications suggest hierarchy is key. The anarcho-capitalists are right even though they might support social liberties. So such a group would be right under hierarchy rule, left under cultural rule. If the friend calls them right, hierarchy rule is confirmed. If left, then cultural rule is primary.
