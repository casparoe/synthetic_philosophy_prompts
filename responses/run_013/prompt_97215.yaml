  Based on your friend's prior classifications and the puzzle of this new movement, here's a breakdown of the likely rule she's using, alternative rules that *almost* fit her pattern, predictions for each, my best guess at her actual rule, and a decisive test case.

  ### 1. Your Friend's Likely Core Rule: "Hierarchy Legitimization"
  *   **Rule:** Left = **Fundamentally opposes fixed, inherited, or "naturalized" social/economic hierarchies** (class, caste, etc.). Right = **Accepts or actively enforces fixed, inherited, or "naturalized" social hierarchies** (tradition, religion, race, bloodline, property-based class).
  *   **Why it fits her prior calls:**
      *   *Anarcho-capitalists (Right):* Reject state hierarchy but fiercely defend hierarchy based on private property ownership and market outcomes as "natural" or justified.
      *   *Soviet Communists (Left):* Explicit goal was abolishing class hierarchy.
      *   *Fascists (Right):* Explicitly glorified hierarchy (race, nation, leader), even if using state power to manage the economy.
      *   *Social Democrats (Left):* Seek to mitigate economic hierarchies through redistribution and welfare.
      *   *60s Counterculture (Left):* Challenged traditional social hierarchies (patriarchy, racial segregation, established authority).
      *   *Religious Right (Right):* Defends traditional social hierarchies (patriarchal family, religious authority).
      *   *Catholic-Traditionalist Welfare Party (Right):* The generous welfare state doesn't erase their core commitment to maintaining a "fixed" old social hierarchy (e.g., church authority, traditional family roles, perhaps aristocracy). Welfare is seen as charity within the hierarchy, not a challenge to its structure.
  *   **Prediction for the New Movement:** **LEFT.** Despite the strict traditionalism, the core goal of **abolishing private ownership and flattening class hierarchy** is the defining feature under this rule. Eliminating the fundamental *economic* hierarchy trumps the enforcement of *cultural* hierarchy. (Think historical examples like some strains of religious socialism or early Christian communism that rejected wealth hierarchy but upheld patriarchal structures).

  ### 2. Alternative Rules That *Almost* Fit (But Don't Perfectly)

  *   **Rule A: Economic Structure**
      *   *Rule:* Left = Favors collective ownership/control of major productive assets. Right = Favors private ownership/control.
      *   *Fits:* Soviet Communists (Left), Anarcho-Capitalists (Right), Social Democrats (Left-ish on spectrum, but usually accepts core private ownership).
      *   *Fails:* Fascists (Often had significant state control/nationalization, yet filed Right). Catholic-Traditionalists (Want welfare state *within* private ownership system? Ambiguous, but friend filed Right). Doesn't explain 60s Counterculture or Religious Right easily.
      *   *Prediction for New Movement:* **LEFT** (Abolishes private MoP).
  *   **Rule B: Cultural Progressivism vs. Traditionalism**
      *   *Rule:* Left = Favors liberalizing/challenging traditional social/cultural norms. Right = Favors conserving/restoring traditional social/cultural norms.
      *   *Fits:* 60s Counterculture (Left), Religious Right (Right), Catholic-Traditionalists (Right). *Partially fits* Fascists (Right - traditionalist/ultra-nationalist).
      *   *Fails Miserably:* Soviet Communists (Often culturally conservative/puritanical, yet filed Left). Anarcho-Capitalists (Can be culturally libertine/progressive, yet filed Right). Doesn't explain economic distinctions well.
      *   *Prediction for New Movement:* **RIGHT** (Restores strict traditional order, rolls back cultural decay).
  *   **Rule C: Scope of State Power (Libertarian vs. Authoritarian)**
      *   *Rule:* Left/Right isn't the primary axis; the key split is Libertarian (min state) vs. Authoritarian (max state).
      *   *Fits:* Anarcho-Capitalists (Lib/Right), Soviet Communists (Auth/Left), Fascists (Auth/Right).
      *   *Fails:* Social Democrats (Moderate state, filed Left), 60s Counterculture (Often anti-state, filed Left), Religious Right & Catholic-Traditionalists (Often favor state enforcing morals, filed Right - but this rule groups them with Soviet Communists as "Authoritarian", which your friend *doesn't* do). Your friend clearly distinguishes Left/Right *within* authoritarian and libertarian camps.
      *   *Prediction for New Movement:* Ambiguous, but likely **Authoritarian**. Doesn't answer Left/Right.

  ### 3. Best Guess at Her Actual Rule
  **"Hierarchy Legitimization" is overwhelmingly the most consistent rule explaining *all* her prior classifications.** She prioritizes the stance on fundamental, fixed social/economic hierarchy above all else. Economic systems (Rule A) and cultural stances (Rule B) are often *correlated* with this, but not definitive. The Catholic-Traditionalist case is the smoking gun: welfare (often seen as "left" economically) doesn't override the commitment to fixed social hierarchy, so it's Right. The New Movement's abolition of class hierarchy is its defining *hierarchical* stance, making it Left.

  ### 4. The Decisive Test Case
  To definitively distinguish **"Hierarchy Legitimization"** from **"Cultural Progressivism/Traditionalism" (Rule B)**, propose this movement:

  *   **The Movement:** A group advocating for radically **deregulated free-market capitalism, minimal taxation, and near-complete privatization (AnCap-lite economics)**, combined with **full-throated support for LGBTQ+ rights, gender fluidity, secularism, drug legalization, and the abolition of traditional marriage laws.**

  **How the Rules Predict:**
  1.  **Hierarchy Legitimization (Friend's Likely Rule):** **RIGHT.** This movement strongly legitimizes and defends hierarchy based on private property and market outcomes as the natural/just order. The cultural progressivism doesn't challenge this core economic hierarchy; it might even be seen as an extension of market individualism/consumer choice. (Fits her filing of AnCaps as Right despite potential cultural liberalism).
  2.  **Cultural Progressivism/Traditionalism (Rule B):** **LEFT.** The cultural platform is radically progressive and challenges virtually all traditional norms. The economics become secondary.

  **Why it Works:**
  *   Your friend filed Anarcho-Capitalists (economically similar and potentially culturally liberal/libertine) as **Right**. If she files this culturally hyper-progressive capitalist group as **Right**, it confirms Hierarchy is her core rule. If she files it as **Left**, it means she's actually using Cultural Progressivism as the primary rule (Rule B), despite the anomalies with Soviet Communists and Anarcho-Capitalists in her prior list.
  *   This case cleanly separates the two strongest competing explanations by flipping the usual correlations (progressive culture + right economics vs. traditional culture + left economics).

  **In summary:** Your friend is almost certainly using **"Hierarchy Legitimization"** as the defining principle. This predicts she files your seminar's new movement as **LEFT**, despite its traditionalism, because abolishing class hierarchy is the fundamental hierarchical shift. The test case pits hyper-progressive capitalists against traditionalist communists to expose whether hierarchy or culture is truly paramount.
