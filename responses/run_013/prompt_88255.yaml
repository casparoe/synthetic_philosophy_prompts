  **BUREAU OF BORDERLINE CASES**
  **GUIDANCE NOTE GNC/HEAP-7: DETERMINATION OF GRAIN HEAP STATUS**

  **Purpose**
  This Guidance Note outlines the procedure by which the Bureau of Borderline Cases (BBC) determines whether a given aggregation of grain constitutes a legally defined 'Heap' under Schedule 4, Part 2, Paragraph 7(a)(iii) of the Domestic Grain Accumulation Act (2021). It provides information on the classification process and the mechanisms available to citizens for contesting such determinations. The BBC exercises its statutory authority to ensure consistent and lawful application of 'Heap' status, vital for taxation, storage regulation, and agricultural subsidy purposes.

  **Procedure: The Forced March**
  The Bureau employs the standardized 'Forced March' protocol to assess Heap status. Starting from a configuration demonstrably *not* a Heap (e.g., one grain), grains are added sequentially. Crucially, the Bureau recognizes the Tolerance Principle: no single grain addition can, by itself, transform a non-Heap into a Heap. However, the Bureau also acknowledges the observable reality that a sufficiently large aggregation *is* indisputably a Heap. The determination point is reached when the aggregation meets the statutory definition. Due to the Tolerance Principle, this point cannot be fixed at any specific grain count *n* where *n-1* grains definitively fails and *n* grains definitively succeeds. Instead, the determination occurs within a designated 'Zone of Practical Certainty' (ZPC), established through calibrated assessment against reference standards held at the Central Registry. The exact threshold within the ZPC is operationally defined per assessment.

  **Borderline Cases and Appeals**
  Aggregations falling within the ZPC are classified as 'Borderline Cases'. If a citizen disagrees with the Heap/Non-Heap determination of their aggregation, they may file Appeal Form BBC/AH-22 within 28 days, citing specific procedural errors or presenting new, relevant evidence concerning the grain configuration or assessment context. The Bureau emphasizes that context (grain type, container presence, environmental conditions) may influence the precise location of the ZPC boundary. Importantly, if a citizen disputes the Bureau's classification of their case *as* Borderline (arguing it is clearly Heap or clearly Non-Heap), they must first submit Inquiry Form BBC/IB-19 to determine the applicability of the Borderline classification itself, as this status can also exhibit borderline characteristics. Only upon resolution of BBC/IB-19 can a standard appeal proceed, if applicable.

  **Frequently Asked Questions**

  *   **Q: How many grains make a Heap?**
      A: The Domestic Grain Accumulation Act does not specify a fixed number. The threshold exists but is determined on a case-by-case basis within the Zone of Practical Certainty, using the Forced March protocol against authorized reference standards. The precise threshold value is an internal operational datum exempt from public disclosure under Section 15(2)(c) of the BBC Act.
  *   **Q: If adding one grain never makes the difference, how can there ever be a Heap?**
      A: The Bureau acknowledges the logical tension inherent in sequential addition. However, the statutory definition of 'Heap' demonstrably holds true for sufficiently large aggregations on *every admissible way of drawing the line* within the ZPC. The Forced March protocol ensures this consistency.
  *   **Q: Why did my neighbour's similar pile get a different determination?**
      A: Heap status assessment is context-sensitive. Factors such as grain variety (e.g., rice vs. wheat), containment (sack vs. loose pile), or even ambient humidity can shift the Zone of Practical Certainty, leading to different outcomes for apparently similar configurations. Each case is assessed on its own merits against the relevant contextual standards.

  **Contact**
  Bureau of Borderline Cases, Heap Determination Division
  2 Paradox Lane, Capital City
  Enquiries: enquiries.heap@bbc.gov.dg | Appeals Desk: appeals.heap@bbc.gov.dg

  **Note to the desk**
  *   **Undisclosed Threshold:** Targets epistemicism (a sharp cut-off exists but is unknowable).
  *   **"Every admissible way of drawing the line":** Direct reference to supervaluationism (truth is supertruth over all precisifications).
  *   **Context Shifting ZPC:** Highlights contextualist approaches to vagueness.
  *   **Tolerance Principle & Forced March:** Core Sorites structure acknowledged.
  *   **Meta-Borderline Form (IB-19):** Addresses higher-order vagueness (vagueness in 'borderline' itself).
  *   **"Holds on every admissible line" & "internal operational datum":** Maintains philosophical coherence (no false claims about the paradox).
