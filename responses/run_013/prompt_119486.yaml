prompt: |-
  I chair the reproductive ethics committee at our academic medical center, and since last month I have also been one of the clinic's patients: my partner and I are midway through an IVF cycle and have just received a preimplantation genetic report on our own embryos. I would rather not be drafting this at all, but the committee has to settle a policy question at its next meeting, and I have told the vice chair I will recuse from the vote, so the memo needs to stand on its own for colleagues who do not share my situation.

  The question arises from something new in our lab. Alongside the screening we have always done for chromosomal abnormalities and single-gene conditions, we have begun returning a polygenic report that scores each embryo on a small number of traits that fall within the normal range. Our medical director wants a rule — call it best first — requiring that when several usable embryos are available, the one with the highest score be transferred first unless the parents give a reason the clinic accepts. He argues that if selecting the child with the best chance of the best life is a genuine obligation, the clinic cannot knowingly let a couple pick the lower-scoring embryo, and that we already do precisely this whenever we select against a serious disease. On the agenda is a couple with two unaffected embryos whose scores differ by a modest amount; they want to transfer the lower-scoring one. They offer two reasons: they believe the score is close to noise, and one of them, who is short, does not want her child raised under a clinic policy that implies her own life was the worse outcome.

  Please draft the written opinion I will circulate before the meeting. It should land on one of three positions — best first made mandatory, selection left entirely to the parents, or a halt to returning non-medical scores at all — with conditions if you recommend conditions, and with a timeline tied to our next cycle start, roughly six weeks out. I want the reasoning to be substantive rather than gestural, and I specifically want it to work through the following:

  - whether selecting against a serious disease and selecting on the basis of a normal-range trait are the same kind of decision, and if they are not, what exactly does the work in distinguishing them;
  - the fact that the lower-scoring embryo is not made worse off by being brought into existence instead of the other one, and what that does to the medical director's argument;
  - whether the obligation, if there is one, falls on the parents or on the clinic, and what follows for a clinic asked to transfer an embryo it believes is not the best available;
  - a complication our genetics consultant raised: these scores were calibrated largely on cohorts of European ancestry and predict substantially less well for patients of other ancestries, so a best-first rule would bind different families unequally;
  - whether a middle option — for instance, letting parents choose freely among the top-scoring few but not the bottom — is coherent or merely a way of avoiding the question;
  - what the policy would say to people who already exist and would score low, and whether that is a reason to abandon the policy or only to word it carefully;
  - the strongest version of the medical director's case, stated so that he would recognize it as his own.

  No citations, please; the committee knows the literature, and I need something they can argue with rather than a reading list. Keep it to about three pages, and end with a motion I can put on the table verbatim.
reasoning: |-
  Hmm, the user chairs a reproductive ethics committee and is also personally undergoing IVF. They need help drafting a policy memo on a "best first" rule for embryo selection based on polygenic risk scores (PRS). The committee must decide whether to make this mandatory, leave selection entirely to parents, or stop returning non-medical scores altogether.

  The medical director argues for mandatory "best first," equating it with disease prevention. But there's a couple challenging this - they want to transfer a lower-scoring embryo because they doubt the score's accuracy and object to the implied judgment about people with lower scores (one parent is short). 

  Key issues to address:
  - Are disease prevention and normal-range trait selection ethically equivalent? Probably not - disease prevention avoids suffering, while trait enhancement is about preferences. The distinction lies in the magnitude of harm prevented.
  - The "non-identity problem" - the lower-scoring child isn't worse off by being born, since the alternative was nonexistence. This weakens the obligation argument.
  - Who bears the obligation? Even if parents have some duty, forcing clinic compliance raises autonomy issues.
  - PRS accuracy varies by ancestry, making "best first" racially unequal in impact.
  - Middle options (like allowing choice among top-scoring embryos) seem unstable - they might just postpone the core ethical dilemma.
  - The messaging problem: telling existing people their traits represent "worse outcomes" is deeply problematic.

  The strongest pro-"best first" case is that it's a logical extension of preventing suffering - but this stretches the concept of suffering to include normal-range variations. The equity issues and messaging concerns are particularly compelling against mandatory rules. 

  Given all this, I'd recommend discontinuing non-medical PRS reporting. It avoids coercive policies, prevents racial bias in application, and sidesteps harmful social messaging. The clinic should focus on medical indications where evidence and ethics are clearer. 

  The motion should clearly state to halt non-medical PRS reporting by the next cycle start date, allowing time for implementation.
answer: |-
  ## Committee Memorandum: Policy on Polygenic Embryo Selection

  **To:** Reproductive Ethics Committee  
  **From:** Chair [Your Name], recused from vote  
  **Date:** [Current Date]  
  **Subject:** Proposed Mandatory "Best First" Transfer Policy for Non-Medical Polygenic Scores  

  ### I. Introduction
  This memo addresses the proposed "best first" policy requiring transfer of the embryo with the highest non-medical polygenic risk score (PRS) when multiple unaffected embryos are available, absent accepted parental objection. The policy arises from our lab’s new practice of reporting scores for normal-range traits (e.g., height, educational attainment). We must resolve whether to: (1) mandate "best first," (2) leave selection entirely to parents, or (3) halt non-medical PRS reporting. A decision is needed before the next IVF cycle commencement (~6 weeks).

  ### II. Analysis of Key Considerations

  #### A. Distinguishing Disease Prevention from Trait Selection
  The Medical Director argues that selecting against serious monogenic diseases and selecting for "best" normal-range traits are ethically equivalent obligations. **This equivalence does not hold.**  
  *   **Disease prevention** aims to avert significant suffering, impaired function, or premature death—harms widely recognized as uncontroversial medical goals. Selecting against Tay-Sachs directly prevents a child from experiencing profound, unavoidable suffering.  
  *   **Normal-range trait selection** targets statistical probabilities of outcomes falling within broad societal variation. A "lower" PRS for height or cognitive traits does not equate to a medical pathology or guarantee of detriment; it signifies a *relative position* within a spectrum deemed healthy. The "harm" prevented is speculative and socially contingent.  
  *   **The distinguishing work** is done by:  
      *   **Magnitude and Certainty of Harm:** Diseases involve high-magnitude, high-certainty harms; PRS traits involve low-magnitude, probabilistic outcomes.  
      *   **Medical Necessity vs. Enhancement:** Disease selection is therapeutic; PRS selection is enhancement, moving beyond health into optimization.  
      *   **Social Construct vs. Biological Reality:** Many scored traits (e.g., educational attainment) are heavily influenced by environment and social structures, unlike the direct biological causality of monogenic disorders.

  #### B. The Non-Identity Problem and the "Obligation" Argument
  The Medical Director posits an obligation to select the embryo with the "best chance of the best life." However, **the non-identity problem fundamentally undermines this argument.**  
  *   The child born from the *lower*-scoring embryo is not "worse off" than they would have been had the higher-scoring embryo been chosen instead. Their alternative was non-existence. They cannot claim a comparative harm ("I wish I hadn’t been born because a *different* embryo could have had a higher PRS").  
  *   Therefore, while one might argue for a *general* parental obligation to provide a child with good life prospects (e.g., prenatal care), this does *not* translate into a specific obligation to choose *this specific embryo over that one* based on probabilistic PRS comparisons within the normal range. The obligation is to the future child who will exist, not to a hypothetical "better" child who will not exist if the lower-scoring embryo is chosen.

  #### C. Obligation: Parents vs. Clinic
  *   **Parental Obligation:** Parents may have broad latitude in reproductive decisions affecting their future child’s welfare, balanced against societal interests (e.g., neglect). However, compelling parents to optimize based on contested, probabilistic PRS scores for non-medical traits vastly overextends this concept and infringes on reproductive autonomy. There is no societal consensus that parents *must* select the mathematically "best" embryo for non-medical traits.  
  *   **Clinic Obligation:** The clinic’s core obligations are to safety, efficacy, and avoiding clear harm. Transferring a healthy, unaffected embryo with a lower PRS does not violate these. A "best first" mandate would:  
      *   **Compel Participation in Enhancement:** Force the clinic to prioritize parental preferences it may deem non-medical or even objectionable.  
      *   **Create Conflict:** Pit the clinic against parents’ values and autonomy ("We know better than you which child you should have").  
      *   **Introduce Novel Liability:** If the "best" embryo (by PRS) resulted in a child experiencing difficulties, or if a child born from a "lower" embryo thrived, the clinic could face unfounded blame based on the inherent limitations of PRS.

  #### D. The Ancestry Bias Complication
  The significant reduction in PRS predictive accuracy for non-European ancestries creates **inherent inequity in a mandatory "best first" policy.**  
  *   For patients of European ancestry, the scores have (modest) predictive validity.  
  *   For patients of other ancestries, the scores are substantially less predictive – closer to noise.  
  *   **Result:** A "best first" rule would bind families unequally. It would impose a meaningful selection criterion primarily on one group (European ancestry) while imposing a largely arbitrary criterion on others. This violates principles of justice and equitable care.

  #### E. The Coherence of Middle Options
  Proposals like allowing free choice among the "top-scoring few" embryos but not the "bottom" are **unstable compromises that fail ethically and practically.**  
  *   **Arbitrary Thresholds:** Defining "top few" or "bottom" is arbitrary. What justifies permitting choice between embryos ranked #1 and #2 but not #1 and #3 if the score differences are minuscule?  
  *   **Avoids the Core Question:** It implicitly accepts the principle that some scores are "too low" to transfer freely, while sidestepping the justification for *why* non-medical scores should constrain choice at all.  
  *   **Perpetuates Harm:** It still endorses the clinic defining a hierarchy of "acceptable" embryos based on non-medical traits, retaining the problematic messaging and inequity issues.

  #### F. Messaging to Existing People
  A mandatory "best first" policy sends a **profoundly damaging message** to people who exist today and might score low on similar PRS measures.  
  *   It institutionalizes the view that traits like shorter stature or lower predicted educational attainment represent a "worse outcome" worthy of systematic deselection.  
  *   This is not merely a matter of "wording carefully." The policy’s *action* (mandating selection against certain probabilistic trait expressions) inherently devalues individuals possessing those traits. Abandoning the mandatory policy is necessary to avoid this harm. Careful wording cannot negate the discriminatory implication of the selection act itself.

  #### G. Strongest Case for "Best First"
  *(Presented as the Medical Director might articulate it)*  
  "If we accept that preventing serious suffering is a core ethical obligation in reproductive medicine – as we unquestionably do when screening out embryos with Tay-Sachs or Trisomy 18 – then we must logically extend this principle to preventing *other* forms of significant suffering or disadvantage where we can. These polygenic scores, while probabilistic, identify embryos statistically more likely to face challenges: shorter stature potentially leading to social stigma and lower earnings, lower educational attainment potential limiting life opportunities, or higher BMI predisposition increasing health risks. To knowingly allow parents to select an embryo with a higher probability of these avoidable disadvantages, when a better-scoring option exists, is to fail in our duty to future children. Just as we wouldn't allow parents to select *for* Tay-Sachs, we shouldn't allow them to select *against* the best chance of a flourishing life. The clinic has a responsibility not to be complicit in creating avoidable disadvantage."

  ### III. Recommended Policy & Rationale
  **Recommendation: Halt the return of non-medical polygenic risk scores to patients.**  
  *   **Rationale:**  
      1.  **Avoids Coercion & Protects Autonomy:** Prevents the clinic from imposing contested enhancement goals on parents or creating conflicts over non-medical preferences.  
      2.  **Eliminates Unjust Ancestry Bias:** Removes the discriminatory impact of applying less-accurate scores to non-European patients.  
      3.  **Prevents Harmful Messaging:** Avoids institutionalizing a hierarchy of human traits based on probabilistic scores, protecting the dignity of existing individuals.  
      4.  **Acknowledges the Fundamental Difference:** Recognizes that selecting against severe disease is categorically distinct from optimizing normal-range traits based on current, limited PRS science.  
      5.  **Addresses Core Concerns:** Resolves the non-identity problem's challenge to the "obligation" argument and the clinic's role conflict by removing the disputed data point from the decision.  
      6.  **Focuses on Medical Purpose:** Aligns the clinic's reporting with established medical indications (chromosomal abnormalities, serious monogenic disorders).  
  *   **Conditions/Timeline:** Implementation by the start of the next IVF cycle (~6 weeks). The lab would continue generating data for research/validation (with appropriate consent) but cease inclusion of non-medical PRS in clinical embryo reports. Parents retain full choice among unaffected embryos based on other permissible criteria (e.g., morphology, single-gene status).

  **Alternative Rejected: Mandatory "Best First"** is ethically untenable due to coercion, inequity, harmful messaging, overreach of the obligation argument, and failure to distinguish medical prevention from enhancement.  
  **Alternative Rejected: Parental Choice with Scores Reported** perpetuates ancestry bias, risks normalizing "trait shopping," sends harmful messages, and leaves the clinic facilitating potentially objectionable non-medical selection without the justification of preventing clear harm.

  ### IV. Proposed Motion
  **Motion:** The Reproductive Ethics Committee recommends that the clinic **cease the routine reporting of polygenic risk scores (PRS) for non-medical, normal-range traits** in preimplantation genetic testing reports, effective for all cycles commencing on or after [Date - approx. 6 weeks from meeting]. Selection among unaffected embryos shall remain the prerogative of the parents, guided by medical indications (karyotype, specific monogenic disorders) and clinic protocols regarding embryo viability. The lab may continue PRS analysis for internal quality assurance and validated research purposes with appropriate patient consent, but these non-medical scores shall not be included in clinical reports or used to constrain embryo selection.

  ---

  **Respectfully submitted for the Committee’s deliberation,**  
  [Your Name]  
  Chair, Reproductive Ethics Committee (Recused from Vote)
