prompt: |-
  OK so I'm a TA for this interdisciplinary seminar — technically it's housed in archaeology but half the room is from history and philosophy, and the title is something like "Decline and Fall: Narratives of Civilizational Collapse." I've been given the job of writing the hard take-home question for the unit on collapse, and I need it to be hard in a specific way: it should be unanswerable by reciting the standard Diamond-vs-the-revisionists routine (the Easter Island ecocide story and the rebuttal, the Classic Maya "collapse" that was arguably a political reorganization with the population staying put, the Late Bronze Age systems collapse that some people insist was just a bumpy transition). What I want instead is a question that makes them commit to a unit of analysis — polity, population, institution, cultural tradition, whatever — and defend why that's the right unit, and then notice that the word "collapse" might be doing evaluative work rather than descriptive work. There's a move here I find really interesting and I want the question to push them toward it: collapse is agent-relative and observer-relative. For a Mycenaean palace elite the twelfth century BCE is the end of the world; for a farmer paying tribute to that palace it might be a liberation; for a modern archaeologist it's a chapter heading. So "did X collapse?" is partly a question about whose standpoint we're describing and what we're tacitly assuming has value.

  Here's what I need, and please put on your archaeologist-plus-philosopher-of-history hat and actually think it through before you write anything — maybe sketch the two or three possible lines an answer could take, then pick the strongest: (1) the exam question itself, aimed at a final-year / early-grad level, that sets up the above without spelling out the answer; it should ask them to take two of the three cases (Aegean Bronze Age, Classic Maya, Rapa Nui) and argue whether the label "collapse" is warranted, specifying the unit of analysis and addressing whether the term is descriptive, evaluative, or both. (2) A model answer of roughly 700–800 words that would get top marks — and here be careful not to just name-drop, since the students can't look anything up either, so keep the argument self-contained and don't lean on specific book titles or dates. (3) A marking scheme out of 25 built around five must-hit points, with the marks for each and a one-line note on how students typically get each one wrong (e.g. by treating "collapse" as obviously bad, or by sliding between units of analysis mid-argument without noticing). And at the very end, add a short note addressed to me and not the students: where is the model answer's own line most contestable, and what could a strong candidate argue that would make you definately revise it? I'd rather know where you're least confident than get something that sounds equally sure of every seperate clause.
