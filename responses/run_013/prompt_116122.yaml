prompt: |-
  ok so heres my epistemic profile, and I'd like a consistency check before I go around acting on it:

  1. The outside view is the default. Base rates, reference classes, the planning fallacy — if I catch myself reasoning from the particulars of my own case, I treat that as a warning sign rather than as evidence.
  2. Epistemic modesty is a virtue. Concretely: when I learn that people in my position are systematically biased about X, the right response is to lower my credence in X.
  3. But there's an opposite failure mode that I think is just as bad, where someone invokes the base rate as a way of never updating on anything they actually know. I've watched that eat people's lives.
  4. Calibration is the whole ballgame. Modesty isn't a feeling or a personality trait, it's a property of a credence, and someone well calibrated at 90% is being immodest and is right to be.
  5. I do think I'm well above average at a few things, and I don't think that's the above-average effect, because the relevant reference class is people who've put the hours in, not people in general.
  6. And none of this means ignoring my own evidence — if I have information that nobody in the reference class had, I should obviously use it. The outside view is just an inside view that somebody else had first and then froze in place.

  Which of these actually pull against each other, which only look like they do, and which one should I give up? Rank the tensions by severity rather than telling me they're all equally bad, say what the cheapest fix is for each, and then tell me which single revision cleans up the most. Also: tell me what would change your mind about that ranking — which consideration, if it turned out the other way, would make you name a different item as the one to drop.
reasoning: |-
  Okay, let me tackle this user's epistemic profile. They want a consistency check before acting on it. Their six points seem well-thought-out, but potential tensions need examining. 

  First, I notice a core tension between point 1 (outside view as default) and point 6 (using unique evidence). The outside view relies on aggregated data, while unique evidence could justify overriding it. But point 6 actually resolves this by framing the outside view as someone else's inside view - clever reframing that makes them complementary rather than contradictory. 

  Point 2's epistemic modesty clashes interestingly with point 4's calibration focus. Modesty suggests lowering credences when learning about biases, but calibration demands matching confidence to actual accuracy. The key is recognizing that well-calibrated 90% confidence isn't immodest - it's properly confident. So these only appear to conflict when we confuse modesty with underconfidence.

  The real danger zone is point 3's warning about base rate abuse. This directly challenges point 1's outside-view primacy. I recall cases where people use base rates to ignore contrary evidence - exactly what the user fears. The resolution might be in point 6's unique evidence exception, but the tension feels substantive here.

  Point 5's claim of genuine superiority seems tricky. Even restricting to "people who've put hours in," the above-average effect could still apply. But the user seems aware of this risk, so the bigger issue is whether this conflicts with their modesty principle. Actually, no - point 4 allows justified high confidence if calibrated.

  For fixes: The cheapest is clarifying terminology around modesty versus calibration. The most impactful revision would be to point 1 - adding explicit exceptions for unique evidence and active updating, which point 6 already hints at. Dropping point 1 entirely would be overkill, but refining it captures the spirit of point 3's warning.

  What would change my mind? If I saw evidence that unique evidence is usually misleading, I'd worry more about point 6. But in reality, domain-specific expertise often does justify overrides. The user's balanced approach seems robust.
answer: |-
  Here's a consistency audit of your epistemic profile, ranked by tension severity with fixes and revision priorities:

  ### **Severity Ranking & Tensions**
  1.  **Point 1 vs. Point 3 (Severe)**  
      - **Tension:** Defaulting to the outside view (1) risks enabling the failure mode in (3) – using base rates to *ignore* unique evidence.  
      - **Fix:** Explicitly amend (1) to: "*The outside view is the default **unless unique evidence passes a high bar for relevance and reliability***."  
      - **Cheapest Fix Cost:** Low (clarifying amendment).  

  2.  **Point 2 vs. Point 4 (High)**  
      - **Tension:** Lowering credence upon learning about bias (2) could *undermine calibration* (4) if you’re already well-calibrated.  
      - **Resolution:** They only *appear* to conflict. Point (4) is the **meta-rule**: modesty (2) must serve calibration (4). If your 90% confidence is truly calibrated, *don’t* lower it arbitrarily.  
      - **Fix:** Reframe (2) as: "*Epistemic modesty means **updating toward the base rate of accuracy for people in my position** when bias is detected*."  

  3.  **Point 5 vs. Point 2 (Moderate)**  
      - **Tension:** Claiming genuine superiority (5) could conflict with lowering credence upon bias warnings (2).  
      - **Resolution:** Tension dissolves if your self-assessment (5) is **itself calibrated** (per point 4). Track your performance in those domains with Brier scores.  
      - **Fix:** Add to (5): "*...and I maintain calibration metrics in these domains.*"  

  4.  **Point 6 vs. Point 1 (Low/None)**  
      - **Apparent Tension:** Using unique evidence (6) seems to oppose defaulting to the outside view (1).  
      - **Resolution:** Point (6) is the **escape hatch** for (1). They’re complementary: the outside view is your prior; unique evidence updates it.  

  5.  **Point 3 vs. Point 6 (None)**  
      - **Synergy:** Point (3) warns against *over-rigid* base rates; (6) provides the corrective (unique evidence).  

  ---

  ### **The Single Best Revision**  
  **Amend Point 1** to include an explicit exception for high-quality unique evidence (as above).  
  - **Why:** It resolves the most severe tension (Point 1 vs. 3) while reinforcing Point 6. Cost: minimal wording change. Impact: prevents your outside-view default from enabling base-rate abuse.  

  ### **What Would Change My Mind About the Ranking?**  
  If you provided evidence that **unique evidence is systematically misleading in your domain** (e.g., subjective experience in stock-picking), I’d rank **Point 6 as the top candidate to drop**. Conversely, if you showed **base rates are consistently gamed or unrepresentative** (e.g., startup success rates), I’d prioritize dropping **Point 1**.  

  ---

  ### **Recommendation: Keep All, But Refine**  
  Your framework is robust *if* you:  
  1. **Clarify Point 1** with the "high bar" exception.  
  2. **Operationalize Point 5** with calibration tracking.  
  3. **Treat Point 4 as the supreme rule** that overrides all others when conflicts arise.  

  **Weakest Point**: Point 3 isn’t a principle but a warning. Integrate its insight into Point 1’s amendment and Point 6. No need to drop it—just absorb it.  

  ### **Key Insight**  
  Your profile’s core tension is **balancing generalized knowledge with local evidence**. The fix isn’t dropping principles but *building a decision rule for when to switch modes*:  
  > *"When unique evidence is strong and base rates are weak (e.g., noisy data, unrepresentative classes), shift weight to the inside view. Else, default to the outside."*  

  This makes your system antifragile: base rates guard against idiosyncratic overconfidence; unique evidence prevents statistical blindness.
