answer: |-
  ### Exam Question  
  **Case Study:** Dr. Elara Vance, a renowned physicist who died three years ago, is the subject of a new biographical drama film. The filmmaker invents a clandestine romantic affair that never occurred and attributes to Dr. Vance a climactic speech endorsing a controversial environmental policy she actively opposed in real life. Dr. Vance’s granddaughter protests that this distorts her grandmother’s legacy and values. A historian objects that the film misleads the public about documented facts. The filmmaker defends the choices, stating: "This is art, not a biography. The dead cannot be defamed, and artistic license allows reimagining lives for thematic resonance."  

  **Question:** Using the "two-ledger view" (obligations to the living vs. obligations to the dead as subjects), critically assess the filmmaker’s reply. Can the second ledger (obligations to the dead) be reduced to the first (obligations to the living) in this case? If not, what constitutes the "narrative remainder" that persists when we collapse the second ledger into the first? Finally, what conditions would need to hold for the filmmaker’s defense to succeed? Your answer must engage at least one major objection to the idea that the dead can be wronged (e.g., that wrongs require a subject who can experience harm).  

  ---

  ### Model Answer (700 words)  
  The filmmaker’s reply fails because it collapses the second ledger (obligations to the dead) into the first (obligations to the living), ignoring the irreducible ethical duty we owe to Dr. Vance as a subject of her own life. This duty transcends harm to living parties and leaves a moral—not merely aesthetic—"narrative remainder" when violated.  

  **Obligations to the Living vs. the Dead**  
  The first ledger is straightforward: the filmmaker owes the living transparency to avoid misleading audiences (e.g., viewers might falsely believe Dr. Vance supported the policy), respect for the granddaughter’s emotional ties to her grandmother’s legacy, and fidelity to historians’ custodianship of truth. These are real but limited harms. The granddaughter’s distress and public misinformation are serious, yet they address only the living’s interests. The second ledger, however, demands that Dr. Vance herself be treated not as raw material but as a person whose narrative integrity warrants respect. Inventing a clandestine affair and falsifying her political stance treats her life as a vessel for the filmmaker’s themes, violating a duty of "narrative trust." This trust acknowledges that persons, alive or dead, possess a unique story shaped by their choices and values. To reduce this obligation to the first ledger—claiming that "no harm to the dead" nullifies it—is to deny Dr. Vance’s moral status as an agent whose life deserves truthful representation.  

  **The Narrative Remainder as Moral Residue**  
  When we collapse the second ledger into the first, a "narrative remainder" persists: the unresolved ethical weight of misappropriating Dr. Vance’s identity. This residue is moral, not aesthetic. If it were merely aesthetic (e.g., "poor artistry"), the wrong would dissolve into subjective criticism. But here, the remainder is the unfulfilled obligation to Dr. Vance herself—a failure to honor her as the author of her life. Even if the granddaughter forgave the film or audiences recognized it as fiction, the distortion leaves a moral scar. It says, "Your identity is malleable to others’ purposes," reducing her autonomy posthumously. This residue lingers because the duty to the dead is *deontological*: it binds us regardless of consequences to the living.  

  **Engaging the Objection: Can the Dead Be Wronged?**  
  A key objection asserts that wrongs require a subject who can experience harm; since Dr. Vance cannot feel humiliation or damage to her interests, no wrong exists. This misunderstands the nature of posthumous wrongs. While the dead cannot experience *harm* (understood as worsened well-being), they can suffer *wrongs* through violations of their narrative agency. Consider promises: breaking a deathbed vow wrongs the deceased not by harming them (they feel nothing) but by betraying their trust. Similarly, misrepresenting Dr. Vance wrongs her by usurping her story—a violation of respect owed to persons as ends in themselves. Philosophers like Kant (though not cited) ground this in dignity: persons must never be mere means. The filmmaker uses Dr. Vance as a means for artistic expression, disregarding her actual values. This wrong is relational, not experiential; it corrupts the moral relationship between the living and the dead.  

  **Conditions for the Filmmaker’s Defense**  
  The filmmaker’s reply could only succeed if two conditions held:  
  1. **The dead lack moral status as narrative subjects**: If persons are only "raw material" after death, obligations dissolve into duties to the living (e.g., avoiding distress to descendants). But this ignores how we intuitively condemn posthumous betrayal (e.g., desecrating a will).  
  2. **The narrative remainder is purely aesthetic**: If the residue were just "artistic failure," ethics would not apply. Yet audiences feel moral unease—not just displeasure—at historical distortion, suggesting a deeper violation.  

  Absent these conditions, the defense fails. The filmmaker’s artistic license does not absolve them of the second ledger’s demands. Truthful artistry could still innovate (e.g., using symbolism) without usurping Dr. Vance’s voice.  

  **Conclusion**  
  The second ledger is irreducible. Collapsing it leaves a moral narrative remainder—a debt to the dead that outlives their interests. The filmmaker wrongs Dr. Vance by subordinating her story to art, and no appeal to the impossibility of harming the dead can erase this. We owe the dead what we owe all persons: respect for their narrative sovereignty.  

  ---  

  ### Marking Scheme (25 marks total)  
  **Must-hit points (20 marks total):**  

  | Point                                                                                                | Marks | Common Error                                                                 |
  |------------------------------------------------------------------------------------------------------|-------|------------------------------------------------------------------------------|
  | **1. Clearly distinguishes the two ledgers**: Explains obligations to the living (e.g., granddaughter’s distress, public misinformation) vs. obligations to the dead (Dr. Vance as a subject of narrative trust). | 5     | Conflates the ledgers (e.g., "duty to the dead is just about descendants"). |  
  | **2. Defends the irreducibility of the second ledger**: Argues that duties to the dead cannot be reduced to duties to the living, using the concept of "narrative trust" or equivalent. | 5     | Dismisses the second ledger as "metaphorical" without engaging its moral basis. |  
  | **3. Identifies the narrative remainder as moral residue**: Explains why misrepresentation leaves a moral (not aesthetic) residue even if living parties are unharmed. | 4     | Reduces the remainder to "bad art" or "historical inaccuracy."             |  
  | **4. Engages the "no harm" objection**: Counters the claim that the dead cannot be wronged by distinguishing *harm* (experiential) from *wrong* (violation of agency/dignity). | 4     | Assumes the objection defeats the second ledger outright.                 |  
  | **5. Specifies conditions for the filmmaker’s success**: States what would need to be true (e.g., dead lack moral status; remainder is aesthetic) for the defense to hold. | 2     | Lists generic criteria (e.g., "if the film is entertaining").              |  

  **Overall Argument & Structure (5 marks):**  
  - **A-grade (5 marks)**: Takes a clear stand; logically integrates all five points; anticipates counterarguments (e.g., "But if wrongs don’t require experience, what grounds them?").  
  - **B-grade (3 marks)**: Summarizes positions without original synthesis; addresses points mechanically; weak objection engagement.  

  **Difference between A and B answers**:  
  - An **A** answer **explicitly argues why the dead’s inability to experience humiliation does not settle the ethics** (e.g., by redefining wrongs as violations of relational trust).  
  - A **B** answer **notes the distinction but fails to show why it matters** for the "narrative remainder."  

  ---  
  This question forces students to confront the second ledger’s irreducibility by demanding they define a wrong *to the dead* that is not a harm to the living, while the marking scheme penalizes superficial appeals to artistic license. The model answer demonstrates how to isolate the "narrative remainder" as a moral residue, pushing beyond stock defenses.
