  Resolution Mechanics:

  For each station, we have three devices. We run each device 10 times and compute the empirical frequency of the event. We then compare each table's probability to these three frequencies. If it is within 0.05 of one of them, they win.

  But to save time, we can use the theoretical probabilities and just run the devices to demonstrate? But the constraint says empirical frequencies. We'll run the devices and use the empirical frequency.

  But note: the empirical frequency might not be exactly the theoretical value. So we have to use what we get.

  In the JSON, for each station, we describe the device, the parameterization it implies, and the probability it yields (the theoretical one). The empirical one will be close.

