prompt: |-
  I chair the physical-sciences grants panel of a national research council, and at Thursday's meeting we must settle a proposal that has split our referees down the middle. The applicants want funding to investigate whether the laws of physics permit a computation that no Turing machine could perform. Their apparatus, in outline, would place one part of a computer on a worldline along which it can complete an unbounded sequence of operations — an open-ended search, say, for a counterexample to a conjecture — while a second part, following a different worldline, waits only a finite time and then reads off whatever the first part has produced. If the first part halts, the reader learns that it halted and what the answer was; if it never halts, the reader is somehow to learn that too. The applicants concede that whether any such arrangement is physically realisable is precisely what they propose to find out, and that a null result would interest them as much as a positive one.

  Our referees divide three ways. One holds that the identification of effective calculability with what a Turing machine can do is a settled result, so a proposal to construct a counterexample is incoherent and should be declined on that ground alone. A second holds that the same identification is at most a conjecture about the physical world, so that testing it is ordinary science and ought to be funded. A third holds that it is neither a theorem nor a hypothesis but a stipulation — an explication of what we are to mean by effective calculability — and that no experiment could confirm or refute it either way.

  Please draft the decision memo I shall circulate before the meeting. It should reach a clear recommendation — fund, decline, or fund subject to stated conditions — with reasons the panel and the applicants can both engage with; say what would count as success or failure for a project of this kind; and give the strongest of the three referee positions its due rather than dismissing it. I should also like the memo to say whether the panel ought to adopt a standing policy for proposals of this foundational character or to judge them case by case, and to be honest about what the panel is and is not competent to decide.
reasoning: |-
  Okay, the user chairs a physical-sciences grants panel and needs help drafting a decision memo for a controversial proposal. The proposal aims to investigate whether physical laws allow computations beyond what Turing machines can achieve. 

  Hmm, this is a fascinating multidisciplinary puzzle straddling physics, computer science and philosophy. The referees' three-way split reflects deep tensions: one sees computability as mathematically settled, another as testable physics, the third as conceptual stipulation. The chair needs a memo that respects all views while providing clear guidance.

  First, let's unpack the proposal's core idea. They want to exploit relativistic spacetime so one computer component performs unbounded computations while another "reads" the result in finite time. The applicants admit they don't know if this is physically possible - that's what they want to investigate. Importantly, they consider either outcome (possible or impossible) scientifically valuable.

  The referees' positions are all defensible but incomplete:
  - Referee 1 is right that Church-Turing is mathematically proven... for abstract computation. But this proposal is about physical realizability.
  - Referee 2 correctly notes that whether physics permits hypercomputation is empirical. But they underplay the conceptual challenges in defining "success".
  - Referee 3 highlights that "effective calculability" is a defined term... yet physical experiments could still explore if nature instantiates non-Turing processes.

  For the memo's recommendation, "fund with conditions" seems wisest. We should require applicants to: 
  1) Explicitly define experimental success/failure criteria
  2) Engage deeply with computability theory's conceptual framework
  3) Address known physical obstructions (like quantum noise)

  Success shouldn't be binary. Even a negative result (showing the setup can't isolate non-Turing behavior) would advance understanding of computation's physical limits. The panel must acknowledge it can judge scientific merit but not resolve philosophical debates about computation's nature.

  About standing policy - foundational projects need case-by-case evaluation since they vary so much. But we could develop review guidelines emphasizing: 
  - Clarity on what physical phenomenon is being tested
  - Distinguishing mathematical impossibilities from physical constraints
  - Value of negative results

  The tone should be respectful to all viewpoints while steering toward actionable science. The memo must make clear that while the Church-Turing thesis isn't being "tested" per se, its physical underpinnings are fair game for experiment.
answer: |-
  ## Decision Memorandum: Proposal ID [Insert Number] - "Physical Realizability of Non-Turing Computation"  
  **To:** Physical-Sciences Grants Panel Members  
  **From:** Chair, Physical-Sciences Grants Panel  
  **Date:** [Current Date]  
  **Subject:** Pre-Meeting Recommendation & Discussion Framework  

  ### 1. Recommendation
  **Fund the proposal, subject to the following conditions:**  
     - (a) The experimental design must explicitly define *testable physical signatures* distinguishing "success" (evidence of non-Turing-computable output) from "failure" (no such evidence) within relativistic constraints.  
     - (b) The final report must rigorously analyze whether observed outcomes reflect *fundamental physical limits* or *experimental noise/limitations*.  
     - (c) A philosopher of physics or theoretical computer scientist must join the advisory team to ensure conceptual precision.  

  ### 2. Summary of Proposal & Referee Positions
  The applicants seek to investigate whether specific spacetime configurations (e.g., exploiting closed timelike curves, cosmic strings, or other general-relativistic geometries) could physically realize a computation exceeding Turing-machine limits. Key apparatus: One component performs unbounded operations (e.g., infinite search), while a second component "reads" the result in finite time—even if the first component never halts.  

  **Referee Positions Acknowledged:**  
     - **Position 1 (Decline):** Church-Turing thesis is a *mathematical theorem* (effective calculability ≡ Turing computability). Proposing a physical counterexample misunderstands computability theory.  
     - **Position 2 (Fund):** Church-Turing is a *physical hypothesis*. Physics may permit non-Turing processes; testing this is legitimate science.  
     - **Position 3 (Philosophical Stipulation):** Church-Turing defines "effective calculability." Experiments test physics, not definitions. Outcomes are physically significant but don’t "refute" a conceptual framework.  

  All positions are coherent and reflect profound disciplinary perspectives. Our task is not to adjudicate philosophy but to evaluate scientific merit.  

  ### 3. Reasons for Conditional Funding
     - **Scientific Testability:** Whether spacetime geometry enables information processing indistinguishable from non-Turing computation *is an empirical question*. The proposal targets a concrete physical mechanism, not abstract computability.  
     - **Value of Null Results:** As applicants note, demonstrating that quantum/relativistic effects *cannot* isolate non-Turing behavior under these constraints would advance understanding of physics’ computational limits.  
     - **Novelty:** Prior experiments tested quantum computing or analog systems; this exploits *general relativity’s causal structure*—a less-studied approach.  
     - **Due to Position 1:** The condition (c) addresses this concern. If the apparatus merely simulates uncomputability via physical artifacts (e.g., noise), the project fails. Clarity on this is essential.  
     - **Due to Position 3:** Success/failure criteria (below) focus on *physical realizability*, not redefining computation.  

  ### 4. Defining Success and Failure
     - **Success:** Observation of repeatable, device-independent outputs that:  
       (i) Solve a problem *provably unsolvable* by any Turing machine (e.g., halting problem for a class of machines),  
       (ii) Cannot be explained by precomputation, noise, or known physics.  
     - **Failure:**  
       - Null result: No non-Turing-computable output detected under experimental conditions.  
       - Ambiguous result: Outputs are replicable but attributable to classical/quantum noise or experimental error.  
       - Inconclusive setup: The apparatus cannot isolate or read the "infinite process" as theorized.  
     *Note:* "Success" would revolutionize physics; "failure" still elucidates the relationship between GR and computation.  

  ### 5. Panel Competence and Foundational Proposals
     - **What we can judge:** Scientific rigor, methodological soundness, and potential to illuminate *physical laws*. We are competent to evaluate relativistic/quantum experimental designs.  
     - **What we cannot judge:** The metaphysical status of the Church-Turing thesis. Our remit is physics, not the foundations of mathematics.  
     - **Standing Policy Recommendation:** Foundational proposals should be **judged case-by-case** but held to two standards:  
       (i) They must formulate *falsifiable physical predictions* (not just philosophical claims).  
       (ii) They must demonstrate engagement with relevant theoretical frameworks (e.g., computability theory, quantum gravity).  

  ### 6. For Thursday’s Discussion
     - Does the panel agree that *conditional funding* balances scientific openness with conceptual rigor?  
     - Are the success/failure criteria (Section 4) sufficiently precise?  
     - Should we require applicants to specify a *particular unsolvable problem* their apparatus would target?  

  This proposal challenges us to think deeply about the interplay of physical law and information. While controversy is inevitable, the questions it raises are emblematic of cutting-edge science. By funding it conditionally, we support empirical inquiry without endorsing speculative claims.  

  **Recommended Motion:**  
  *"Fund Proposal [ID] subject to conditions (a), (b), and (c), with oversight from the panel on experimental validation criteria."*  

  ---  
  **Attachments:** Full referee reports, applicant response.  
  **Meeting:** Thursday, [Time], Conference Room A.
