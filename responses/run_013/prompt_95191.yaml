prompt: |-
  I have recently been appointed to my county's well-being advisory group, and the charge is uncomfortable: we are to design a local index modeled on the international happiness rankings, and then adopt it as a target in the county's strategic plan. Before I take a position on any particular instrument, I want the specification in hand. What must a measure of a population's well-being deliver to count as adequate for that purpose?

  Write me the requirements list. For each requirement, give the consideration that puts it on the list: the case the measure has to get right, the distinction it must not collapse, the pattern it must be consistent with. Among the ones I have already run into: comparability of self-reports across languages and cultures; the difference between how people felt yesterday and how they judge their lives as a whole, and whether an instrument may average the two into a single number at all; adaptation and shifting expectations; a population average versus the condition of those at the bottom; the fact that a published index becomes a target and will be gamed; the precision required for neighborhood-level scores; and whether the index must register improvements that are improvements even if nobody's expectations move. Our epidemiologist also proposes validating the whole thing against net migration, on the theory that people move toward places where life goes better, and I cannot tell whether that is validation or circularity — rule on it.

  Then separate the genuine desiderata from the prejudices of one camp, since the economists, the statisticians, and the public-health staff on the panel are pulling in different directions, and tell me whether some subset of the requirements cannot be jointly satisfied. I suspect the last item on my list is in tension with several of the others; if it is, say so plainly and say what has to give. Then, briefly, how the leading approaches to measuring this fare against your list.

  End with a final line beginning Verdict: that names either the single requirement eliminating the most popular approaches or the pair you judge jointly unsatisfiable.
reasoning: |-
  Hmm, this is a complex and nuanced query about designing a well-being index for county-level policy. The user is clearly deeply engaged with the conceptual challenges, having already identified several key tensions in well-being measurement. 

  Let me unpack the layers here. First, the core ask is for a requirements list with justifications - but the subtext reveals concerns about political viability, methodological purity, and potential trade-offs. The user's background seems technical (noticing adaptation/expectation issues) but pragmatic (worried about gaming). 

  The epidemiologist's migration validation point is particularly thorny. At first glance it seems circular - migration patterns ARE influenced by well-being, but also CREATE well-being shifts through selection bias and demographic changes. This needs careful handling. 

  I notice three distinct tensions in the requirements:
  1) Philosophical: Hedonic vs evaluative well-being can't be naively averaged
  2) Methodological: Precision at neighborhood level vs cultural comparability
  3) Political: Gaming risks vs need for simple targets

  The migration validation question... I'm ruling it as a weak validation at best. While intuitive, it ignores that migrants aren't representative (selection bias), moving itself causes well-being fluctuations, and some groups (elderly, poor) can't vote with feet. Better as correlational check than core validation.

  For the leading approaches:
  - OECD Better Life's dashboard solves the averaging problem but fails the gaming test 
  - Bhutan's GNH has cultural specificity issues 
  - Experience sampling is precise but impractical for neighborhoods 
  - Life evaluation surveys are gameable but comparable

  The fundamental unsolvable tension is between the "no averaging" requirement and the "must be targetable" requirement. Any single index forces conceptual blending, while dashboards avoid blending but become unwieldy targets. Hence my verdict centers on that trade-off.

  User seems prepared for hard truths - I'll be blunt about trade-offs while respecting their sophisticated starting point. The "what has to give" section might sting but they've asked for candor.
answer: |-
  Here’s a rigorously structured requirements list for your county well-being index, grounded in conceptual clarity, empirical challenges, and policy constraints. Requirements are ranked by criticality, with justifications and trade-offs clarified.

  ---

  ### **Core Requirements for an Adequate Well-Being Measure**  
  1. **Conceptual Validity**  
     *Requirement*: Explicitly distinguish and measure **hedonic well-being** (momentary affect) and **evaluative well-being** (life satisfaction).  
     *Case to get right*: A cancer patient reporting high life satisfaction due to resilience but low daily mood. Collapsing these conflates adaptation (a philosophical problem) with suffering (a policy priority).  

  2. **Non-Gameability**  
     *Requirement*: Resistant to manipulation by policymakers or stakeholders.  
     *Distinction not to collapse*: Genuine improvements vs. "teaching to the test" (e.g., coaching residents on survey responses). Must include **objective anchors** (e.g., mental health service access).  

  3. **Distributional Sensitivity**  
     *Requirement*: Report disaggregated scores (e.g., by income quintile, race, neighborhood) and track the well-being of the **worst-off 10%**.  
     *Pattern to match*: Rising averages masking stagnation among marginalized groups (e.g., gentrification improving county averages while displacing poor residents).  

  4. **Cultural/Linguistic Equivalence**  
     *Requirement*: Cross-culturally validated self-report scales with **differential item functioning** analysis.  
     *Case to get right*: "Happiness" may imply excitement (low-arousal cultures) or contentment (high-arousal cultures).  

  5. **Dynamic Expectations Adjustment**  
     *Requirement*: Detect improvements **independent of shifting expectations** (e.g., via vignette methodologies or objective correlates).  
     *Case to get right*: A job training program raising incomes but not self-reported well-being due to higher aspirations.  

  6. **Spatial Precision**  
     *Requirement: Neighborhood-level granularity** without statistical noise (N ≥ 100 per unit).  
     *Distinction not to collapse*: Policy impacts in a deprived census tract vs. adjacent affluent areas.  

  7. **Policy-Relevant Sensitivity**  
     *Requirement*: Detect changes within 3–5 years of interventions (e.g., new parks, housing policies).  
     *Pattern to match*: Gradual well-being gains from urban greening, not captured by annual surveys.  

  8. **Validation Against External Benchmarks**  
     *Requirement*: Correlate with **behavioral outcomes** (e.g., suicide rates, volunteering) – *not migration*.  
     *Ruling on migration*: **Circularity, not validation**. Migration selects for mobile populations (young, skilled), ignores trapped populations (elderly, poor), and confounds causation (migrants’ well-being often dips post-move). Reject epidemiologist’s proposal.  

  ---

  ### **Separating Desiderata from Disciplinary Prejudices**  
  - **Economists** prioritize aggregation (single index) and monetization. *Prejudice*: Assuming all well-being dimensions trade off linearly.  
  - **Statisticians** demand reliability and granularity. *Prejudice*: Overweighting methodological elegance over feasibility.  
  - **Public Health** focuses on objective health metrics. *Prejudice*: Underestimating subjective well-being as "soft."  

  **Jointly Unsatisfiable Requirements**:  
  - **Tension**: Non-gameability (Requirement 2) + Policy-Relevant Sensitivity (Requirement 7) + Single-Index Target (implied by strategic plan).  
  - **Why**: A single index invites gaming; disallowing aggregation undermines target-setting; high sensitivity requires frequent/expensive sampling.  
  - **What Must Give**: **Abandon a single-index target**. Use a **dashboard approach** (e.g., 3–5 headline indicators) to satisfy all requirements except simplistic aggregation.  

  ---

  ### **Leading Approaches vs. Requirements**  
  | **Approach**               | Strengths                               | Failures Against Requirements        |  
  |----------------------------|-----------------------------------------|---------------------------------------|  
  | **OECD Better Life Index** | Distributional sensitivity (Requirement 3), Conceptual validity (1) | Gameable (2), Lacks neighborhood precision (6) |  
  | **Gallup World Poll**      | Cultural equivalence (4), Dynamic expectations (5) | Low spatial precision (6), Aggregates hedonic/evaluative (1) |  
  | **Bhutan GNH Index**       | Anti-gaming design (2), Distributional (3) | Culturally specific (4), Low sensitivity (7) |  
  | **Experience Sampling**    | Granular precision (6), Hedonic focus (1) | Costly for neighborhoods (6), Unvalidated for policy (7) |  

  ---

  **Verdict: Conceptual Validity + Non-Gameability + Single-Index Target are jointly unsatisfiable.**  
  **Recommendation**: Adopt a modular dashboard (e.g., evaluative well-being + affect balance + poverty-linked distress) with explicit anti-gaming rules. Sacrifice the "single number" for policy robustness.
