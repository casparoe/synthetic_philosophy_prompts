prompt: |-
  ok so my bioethics seminar has this final project where we have to take one of the course units and turn it into something a real practitioner could actually use, and I got the unit on whether genuine moral dilemmas are even possible. I picked it because it wound me up — half the class kept saying "obviously dilemmas exist, look at this case" and the prof kept going "not so fast, you might just not know which one wins." By the end I couldn't tell if they were disagreeing about ethics or about what the word even means, and I still can't, so now I have to build something out of it.

  What I have to hand in is a decision procedure that a hospital ethics consult service could actually run when someone pages them and says "we have a dilemma." Not an essay — an intake triage thing. The people running it are clinicians with zero philosophy training plus maybe one ethicist who is not always around, they get maybe three to five of these a week, and usually someone needs an answer within a few hours, sometimes minutes. So it has to be runnable by a smart non-philosopher, and for every step it has to say what counts as a good enough answer before you're allowed to move on.

  The whole point of it is to seperate real dilemmas from the stuff that just looks like one. So the first thing it should do is figure out whether the "dilemma" is a problem of not knowing which option is right (which is solvable in principle, so go get the info) or a problem of there being no right option (which isn't). Then it should test whether both options are actually required of you or only permitted, whether the situation could have been avoided upstream by better planning, and what is still owed afterward — because even when you pick the lesser evil I think something is still owed to whoever got the short end, and the procedure should not pretend the decision settled that. I also want it to force you to state whether you could actually have intended the bad outcome on the losing side, and not just tolerated it, because that feels like the line between doing something wrong and merely letting it happen.

  Where it can't get an answer, I want it to say so and hand the thing to a person, not fudge it.

  Then run it on two cases. Case one: an ICU has one ECMO circuit and two patients who both need it, one young and previously healthy, one older with other conditions, and the team genuinely can't find a rule that doesn't feel like it's just picking. Case two: a ward is short a nurse, a patient gets a med late and is harmed, and everyone is calling it a tragic unavoidable dilemma, but I suspect your procedure will say it isn't a dilemma at all — it's a staffing failure somebody could have prevented. That second one is the answer I don't want, so please don't soften it for me.

  Format it as:

  "What this is and isn't for" — about 100 words, just framing.
  "The procedure, step by step" — about 700 words, numbered steps, and under each step one line on what counts as an answer good enough to move on.
  "Two cases run through" — about 400 words.
  "Where it stops, and where I'm fooling myself" — about 150 words.

  And in that last section, be straight with me about what a procedure like this definately can't do, because I have to present this and I'd rather know the holes now than get eaten alive in Q&A. Also no reading list or citations please — the prof said she doesn't want us hiding behind other people's names, I just need the procedure itself.
reasoning: |-
  Hmm, let me unpack this bioethics seminar project. The user has to create a practical decision procedure for hospital ethics consults that distinguishes genuine moral dilemmas from apparent ones. They're frustrated with the philosophical ambiguity in their course and need something actionable for time-pressed clinicians.

  First, I need to understand their core requirements: 
  - Must be usable by clinicians without philosophy training
  - Processes cases in minutes/hours
  - Identifies solvable conflicts vs true dilemmas
  - Includes key elements: obligation status, avoidability, reparations, intentionality
  - Explicitly flags when human judgment is needed
  - Rigorously tests their two case examples

  The user's intellectual tension is interesting - they recognize their own bias in the staffing failure case but demand intellectual honesty. That tells me the procedure must withstand self-contradiction. Their emphasis on "not softening" suggests they value rigor over comfort.

  For the framework, I'm considering a flowchart-like sequence with clear exit points. The critical path should be:
  1. Verify there's an actual conflict between obligations (not just uncertainty)
  2. Test if either "obligation" is actually discretionary 
  3. Check for upstream system failures
  4. Assess if harm is intended or merely foreseen
  5. Mandate reparations regardless of choice

  The intentionality test (Step 5) is particularly crucial - it draws the line Kantians care about. And the reparations step (6) operationalizes the "moral residue" concept without jargon.

  For the cases: 
  - ECMO scenario should trap in Step 4 (no non-arbitrary tiebreaker) 
  - Staffing failure must get rejected at Step 3 (clearly avoidable)

  Biggest vulnerability I see: the procedure assumes obligations can be clearly identified, but real clinical norms are often fuzzy. Also, Steps 4-5 require uncomfortable introspection - clinicians might shortcut them. Should explicitly warn about that in the limitations section.

  Notable omission: the procedure doesn't handle value conflicts (e.g., religious objections) well. That's a deliberate gap since the brief focuses on obligation conflicts. Might need to call that out.

  User's anxiety about Q&A is palpable. The limitations section should highlight:
  - Can't resolve fundamental value disputes
  - Depends on honest system analysis
  - Requires users to sit with moral discomfort
  - Doesn't replace policy development

  The tone needs to stay clinical but with philosophical integrity - no dumbing down, just operationalizing. Steps should sound like protocol language ("Verify...", "Determine...") with unambiguous completion criteria.
answer: |-
  ## Practical Dilemma Triage Tool for Hospital Ethics Consults

  **What this is and isn't for:**
  This is an intake triage tool for clinicians paging Ethics about an apparent "moral dilemma." It's designed to rapidly distinguish *genuine* moral dilemmas (where no morally right action exists) from conflicts caused by **uncertainty, preventable system failures, or misunderstanding obligations.** It provides a structured path forward for each. It is *not* for resolving deep philosophical debates, adjudicating purely legal disputes, or replacing complex case consultation when needed. Its goal is efficient initial sorting.

  **The Procedure: Step by Step**

  *   **Who:** Run by the clinician(s) initially involved or the first available Ethics team member (clinician or ethicist). Needs honesty about facts and intuitions.
  *   **Goal:** Classify the conflict & determine next steps within minutes.
  *   **Output:** One of: `SOLVABLE CONFLICT`, `GENUINE DILEMMA`, or `NEEDS ETHICIST NOW`.

  1.  **State the Conflict:** "We must do **Action A** (because of Reason X) *and* we must do **Action B** (because of Reason Y), but we *cannot* do both." State A & B clearly and concretely (e.g., "Start ECMO for Patient 1" / "Start ECMO for Patient 2"; "Give med now to Patient C" / "Adhere to safe staffing policy").
      *   *Good Enough:* Clear, specific actions identified that are mutually exclusive in *this specific moment*. If actions aren't truly mutually exclusive (`We need to do A *first* but B *later*` isn't a dilemma), stop: `SOLVABLE CONFLICT - Sequencing`. Explore sequencing/logistics.

  2.  **Clarify Obligations:** For **Action A** and **Action B** separately: Is this action *required* (a duty/obligation) or merely *permitted* (an option)? What is the core value/rule demanding it? (e.g., Beneficence, Non-maleficence, Justice, Fidelity, Autonomy).
      *   *Good Enough:* A plausible value/rule cited for each action. If *either* action is only *permitted* (not obligatory), stop: `SOLVABLE CONFLICT - Option Elimination`. Choosing the obligatory action is likely correct; the permissible-but-not-obligatory action can be foregone without wrongdoing.

  3.  **Assess Preventability:** Could reasonable planning or system management *before this moment* have prevented this conflict? (e.g., Was there a known staffing shortage? Was a contingency plan missing? Was resource scarcity predictable?).
      *   *Good Enough:* A "Yes" or "No" answer based on available institutional knowledge. If **Yes**, stop: `SYSTEM FAILURE - Not a Dilemma`. Flag the upstream cause. The immediate choice may still be hard, but the *root* conflict was preventable and requires system-level action. Proceed to next step only if **No**.

  4.  **Seek a Tiebreaker:** Is there any *relevant, non-arbitrary distinction* between the claims of Action A and Action B that makes one obligation *stronger* than the other *in this specific context*? (e.g., Urgency, Likelihood of benefit/avoiding harm, Long-term prognosis, Prior commitments, Specific vulnerabilities). List potential distinctions explicitly.
      *   *Good Enough:* A genuine attempt to list plausible distinctions. If a **Clear Distinction** is found favoring one action, stop: `SOLVABLE CONFLICT - Obligation Prioritized`. The stronger obligation wins. If **No Clear Distinction** emerges after reasonable effort (the claims seem truly equal/commensurate), proceed.

  5.  **Test Intentionality:** For the action you are leaning towards (or would have to choose if forced): Could you honestly *intend* the negative consequence suffered by the party losing out (or their proxy), as part of your chosen action? Or is that consequence merely a *foreseen but unintended side-effect*? (e.g., "We intend to save Patient 1 *knowing it directly causes* Patient 2's certain death" vs. "We intend to save Patient 1 *and foresee but don't intend* that Patient 2 *might* die before another circuit is available").
      *   *Good Enough:* An honest self-assessment. If **Intentional Harm** seems unavoidable for *any* choice, proceed (this suggests a core feature of a dilemma). If the harm is **Unintended** for the chosen action, it may be permissible (like double effect); re-evaluate Step 4. If unsure, proceed cautiously.

  6.  **Dilemma Confirmation & Residual Duty:** If you passed through Steps 1-5 (Mutually Exclusive Obligations, Both Obligatory, Unpreventable, No Clear Distinction, Intentional Harm Unavoidable), classify: `GENUINE MORAL DILEMMA`. **Crucially:** State clearly what is *still owed* to the party(ies) harmed by the unchosen action *after* the decision is made (e.g., Transparency, Apology, Support, System change advocacy, Bereavement care).
      *   *Good Enough:* Explicit acknowledgment of the dilemma status and at least one concrete action constituting the "residual duty."

  7.  **Escalation Point:** If at any step the answer is unclear after reasonable effort (e.g., Obligation status murky, Preventability uncertain, Distinction debatable, Intentionality confusing), OR if the emotional/social/political stakes are extremely high: Stop and page `NEEDS ETHICIST NOW`.

  **Two Cases Run Through**

  *   **Case 1 (ECMO):**
      1.  **Conflict:** Start ECMO for Young Patient (A) OR Start ECMO for Older Patient (B) - only one circuit.
      2.  **Obligations:** *A:* Obligation (Beneficence/Justice for young life). *B:* Obligation (Beneficence/Justice for older life). Both obligatory.
      3.  **Preventability:** Likely `No` (assuming sudden, unexpected dual need beyond planned capacity).
      4.  **Tiebreaker:** Consider distinctions: Prognosis? Comorbidities impact? Time sensitivity? If *no non-arbitrary distinction* clearly favors one (e.g., both have similar *chance* of meaningful recovery, age alone feels arbitrary), then `No Clear Distinction`.
      5.  **Intentionality:** Choosing A *intentionally* denies B a life-saving chance (and vice versa). Harm seems intentional.
      6.  **Dilemma:** `GENUINE MORAL DILEMMA`. **Residual Duty:** Transparent communication with both families, sincere apology to family of unchosen patient, emotional/social support, review allocation policy.
      7.  *Output:* `GENUINE MORAL DILEMMA` (with residual duties noted).

  *   **Case 2 (Staffing/Missed Med):**
      1.  **Conflict:** Give med on time to Patient C (A) OR Adhere to safe staffing ratios (B) - short one nurse.
      2.  **Obligations:** *A:* Obligation (Beneficence/Non-maleficence). *B:* Adhering to ratios is likely a *system policy* for safety, but the *core obligation* is Non-maleficence/Safety *for all patients*. Giving the med might violate the *system* rule but fulfill the core duty to *this* patient? (Potential confusion here).
      3.  **Preventability:** **Yes.** The staffing shortage was known. Lack of contingency (float pool, overtime plan, diversion) caused the conflict. *Stop Here.*
      4.  *Output:* `SYSTEM FAILURE - Not a Dilemma`. The immediate harm stems from a preventable system breakdown (inadequate staffing plan/contingency). The *apparent* conflict between patient care and policy masks the real failure. Focus on harm mitigation for Patient C and urgent system review.

  **Where it stops, and where I'm fooling myself**

  *   **Definite Stops:** It cannot resolve fundamental clashes of *incommensurable values* (e.g., deep religious objection vs. medical standard). It relies on honest self-reporting in Steps 3 (Preventability) and 5 (Intentionality) – denial or rationalization breaks it. It assumes clinicians can grasp core obligations (Step 2) without philosophy training; murky cases will trip it up. High-stakes emotional/political conflicts often need skilled facilitation, not just a flowchart.
  *   **Fooling Myself:** Believing this neatly separates "real" from "fake" dilemmas. Reality is messy – many cases exist on a spectrum. Calling something a `SYSTEM FAILURE` doesn't make the immediate choice painless. The "intentionality" test (Step 5) is philosophically contentious and hard to apply cleanly. I'm assuming residual duties are always clear – they often aren't. This tool simplifies complex moral psychology; it's a starting point, not a complete solution. Expect pushback on its rigidity and the potential for Step 3 to feel like blame-shifting.
