prompt: |-
  I've been teaching a unit on Nyāya epistemology for a few years now -- the four pramāṇas, perception, inference, comparison, testimony, and the old fight over whether a cognition arrives with its own credentials or has to be certified from the outside -- and last week it hit me that a one-page "claim standard" I helped write for a small fact-checking desk I sit on the board of is basically a pramāṇa list wearing a newsroom's clothes, with nobody having intended it. Here's what the document actually says. One: if one of our own reporters saw it with their own eyes, it's settled, and we don't go hunting for reasons to doubt it. Two: a claim can also be established by showing it follows from things we already accept, but only if the writer can state the general rule they're leaning on. Three: unfamiliar labels -- is this a hate crime, was this a "riot" -- get settled by the statute's definition plus a side-by-side with the paradigm cases everybody already agrees about. Four: if a designated expert asserts it, we run it, full stop, no requirement that we re-derive it ourselves. Five: nothing counts if we've already said it, so a claim that merely restates our earlier reporting establishes nothing new -- our editor calls that one "no free second helpings" and thinks it's just about not padding the feed. I dont think it's just about that.

  What I want from you is the implicit epistemology. What view about where justification comes from does this standard only make sense under? Is it even internally consistent -- why does our own reporters eyeball get to be self-certifying while a stranger's testimony needs an independent second source, and yet an expert's bare assertion gets waved through with no corroboration at all? Which of the five rules strictly presuppose that picture, which ones would be just as happy under a rival one, and what does the standard quietly rule out -- a reliabilist story about tracking the truth, a coherentist one, a plain institutional "trust the process" story? Where is it philosophically underdetermined, so that several theories would license the exact same five rules? And if we swapped the presupposed picture for its opposite -- nothing is justified until something else certifies it -- what concretely breaks: which rules survive, which have to be rewritten, and does the desk get better or worse at its job?

  Give it to me as a numbered list of exactly five items, a sentence or two each, no introduction and no conclusion.
reasoning: |-
  Okay, the user is teaching Nyāya epistemology and noticed that a fact-checking standard they helped write mirrors the pramāṇas. They want me to analyze the implicit epistemology behind this standard. Let me start by breaking down each rule.

  First rule: Reporter's eyewitness is self-certifying. That's like perception (pratyakṣa) in Nyāya, which is immediate and doesn't need external validation. But why is it trusted without doubt? Probably assumes reporters are reliable observers. But if we switched to a view where nothing is self-certifying, this rule would need corroboration, slowing things down.

  Second rule: Inference requires stating the general rule. Similar to Nyāya anumāna, where inference needs a universal premise (vyāpti). It rejects invalid inferences but relies on existing knowledge. Under a justification-needs-certification view, even sound inferences might need extra checks, adding steps.

  Third rule: Labeling by comparison to paradigm cases. This is upamāna, analogy. Uses prototypes to classify new instances. If paradigms aren't trusted, this falls apart. Coherentism might accept it if it fits the narrative, but foundationalism needs those paradigms as anchors.

  Fourth rule: Expert testimony accepted without corroboration. Śabda in Nyāya, but only for credible sources. The standard trusts designated experts, implying institutional reliability. If experts aren't trusted, this rule would require verification, which could be impractical but more thorough.

  Fifth rule: No self-corroboration. Prevents circularity. Foundationalist and coherentist systems both reject circular justification. If the desk allowed it, they could pad content but risk inaccuracies repeating.

  Now, consistency questions. Eyewitness is self-certifying, but stranger testimony isn't. Experts are trusted without check. Why? The system assumes internal reliability (reporters, experts) but distrusts external sources. That's a reliabilist institutional trust. Under a global mistrust view, everything needs verification, making the process slower and resource-heavy.

  Which rules presuppose the self-certifying view? Rules 1 and 4 rely on trusted sources not needing extra checks. Rule 2 could fit under inferential systems but needs the universal to be already justified. Rule 3 depends on accepted paradigms. Rule 5 avoids circularity, common in many theories.

  If swapped to everything needing certification, Rule 1 would need corroboration, Rule 4 verification, slowing the desk. Rule 2 might need the universal premise checked. Rule 3 requires trusted paradigms. Rule 5 stays. The desk becomes more thorough but inefficient, possibly missing real-time reporting needs.

  Underdetermined areas: Rule 2 could be foundationalist (universals as basic) or coherentist (fits the system). Rule 5 is universally accepted. Rule 3's paradigms could be from various sources, not specified.

  So the implicit view is a mix of foundationalism (perception, experts as basic) and reliabilism (trusting institutional processes). Switching to external justification would break efficiency but add rigor.
answer: |-
  Here is the numbered analysis as requested:

  1.  **Implicit Foundationalism with Reliabilist Elements:** The standard presupposes a foundationalist epistemology where certain basic sources (reporter perception, expert testimony) are inherently reliable and justification-conferring without needing external certification. This is combined with a reliabilist trust in institutional processes (reporters as trained observers, experts as designated truth-trackers), explaining why their outputs are self-certifying while stranger testimony is not.

  2.  **Internal Consistency via Source Hierarchy:** The standard is consistent *only* under a hierarchical view of source reliability intrinsic to the institution. A reporter's perception is self-certifying because reporters are vetted agents of the desk itself (internal foundational source). An expert's bare assertion is accepted because their designation *by the institution* implies pre-vetted reliability (external source granted foundational status). A stranger's testimony lacks this institutional imprimatur and thus requires external certification.

  3.  **Presupposing Self-Certification vs. Flexibility:** Rules 1 (perception) and 4 (expert testimony) strictly presuppose foundational self-certification. Rule 2 (inference) presupposes foundationalism for its premises but *could* function under coherentism if "things we already accept" meant system coherence. Rule 3 (comparison/paradigms) is flexible, compatible with foundationalism (paradigms as basic) or coherentism (paradigms fitting the system). Rule 5 (no self-corroboration) rejects circularity and is compatible with almost any non-skeptical theory.

  4.  **Ruled-Out Theories & Underdetermination:** The standard explicitly rules out pure coherentism (rejecting Rule 5's "no free second helpings" as insufficient) and strict internalist justification requiring conscious certification for *all* inputs. It is underdetermined regarding the *origin* of justification for paradigms (Rule 3) and the premises for inference (Rule 2) – foundationalism, reliabilism, or institutional trust could license them. Reliabilism explains the trust in reporters/experts but conflicts with Rule 1's dismissal of hunting for defeaters.

  5.  **Consequences of Swapping to External Certification:** Swapping to "nothing justified until certified" would break Rule 1 (require corroboration for eyewitness), Rule 4 (require corroboration for experts), and Rule 3 (require certification for paradigms). Rule 2 would survive but need its premises certified. Rule 5 remains vital. The desk would become more thorough but slower, resource-intensive, and potentially paralyzed by infinite regress (certifying the certifiers), harming real-time fact-checking efficiency while potentially increasing rigor against institutional blind spots.
