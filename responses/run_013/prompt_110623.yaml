prompt: |-
  I am assembling a specification before committing to any particular account. The setting is practical as much as metaphysical: a coroner, a historian of a financial collapse, a regulator and a metaphysician all have to say what caused an outcome when what happened is that something did not happen, and I want to know what a theory of causation by omission would have to deliver to be usable in all four places — not merely internally tidy, but good enough to settle cases. Write out the requirements such a theory must satisfy, each with the case or consideration that motivates it. Do not survey the literature and do not give me a reading list; the criteria are the deliverable, and I will do the scoring against particular accounts myself.

  At a minimum I want the following addressed, and you should add anything else you think genuinely belongs on the list:

  - The plain cases. A doctor who does not prescribe the antibiotic; a driver who does not brake; a lookout who is looking the other way. Any theory has to count these as causal, and has to say in virtue of what.
  - The case against them. There is a standing temptation to hold that absences are not events, that causation relates events, and therefore that omissions are not causes at all but only things we cite in explaining. Set out what that option is committed to and what it costs.
  - The non-agential cases. An antibiotic is absent from a culture and the bacteria grow; a gene is deleted and the phenotype appears; a braking subroutine does not execute and the vehicle collides. Same phenomenon as the doctor's omission, or does the theory need a separate treatment for the artefactual and the merely natural?
  - The case with no possible agent. The rain did not come and the harvest failed. Nobody omitted anything. Must the theory call this causal, and if it must, what stops every fact about the world from becoming a cause of every other fact?
  - Proliferation. Grant that omissions can be causes and that counterfactual dependence is the test, and everyone in the city who did not call the fire brigade caused the house to burn. What constrains the spread? Separate the accounts that constrain it by worldly facts from those that constrain it by norms, expectations or duties, and say what each constraint buys and what it costs.
  - Selection. Even granting that many omissions are causal, we single one out as the cause — the salient one, the blameworthy one, the difference that mattered. Is that singling-out part of causation or part of something else, and can the theory tell the difference?
  - Redundancy and preemption. Two people could each have saved the child and neither does; a watchdog sleeps, though the intruder would have got in anyway. Neither omission is a but-for condition, yet at least one looks causal. What must the theory deliver here?
  - Nested and compound omissions. A fails to tell B; B fails to warn C. May an omission cause an omission, and does the theory multiply causes or absorb them?
  - Omissions as double prevention. The usual move is to treat an omission as causing by preventing a preventer. Say what that buys and where it strains.
  - The normative cases. Two structurally identical factories, one failing to fit a safety valve that is standard in its industry, one failing to fit a novel one. If our causal verdict differs although the physical facts do not, is the theory in trouble or is that the correct result?
  - Degrees and vocabulary. Causal talk about omissions comes in degrees and in different idioms — the historian's absence of a lender of last resort, the engineer's failure mode, the regulator's non-compliance. State whether the theory owes an account of these, or whether they are decoration on a single underlying relation.

  Then, on the structure of the list itself: mark which requirements are non-negotiable and which are preferences of one camp; identify any subset you believe cannot be jointly satisfied and say which member you would give up, since that is the part I most want to see; and name the single requirement that does the most to eliminate candidate accounts. Close with a brief assessment, no more than a paragraph each, of how regularity accounts, counterfactual and dependence accounts, interventionist accounts, powers-and-mechanism accounts, and the view that omissions are not causes but quasi-causal or merely explanatory fare against the list. Keep that closing section short; the list is where the thinking is. The list itself can be a table.
reasoning: |-
  Okay, the user is asking for a comprehensive specification on a theory of causation by omission. They’re clearly deeply engaged with the philosophical and practical challenges here—coroner, historian, regulator, metaphysician—each needing to explain why something *didn’t happen* caused an outcome. This isn’t just academic; they want criteria rigorous enough to "settle cases," so practicality is key.  

  First, I need to unpack their bullet points. They’ve listed 11 concrete concerns, from "plain cases" (like a doctor not prescribing antibiotics) to nuanced issues like normative divergence (identical factories, different safety standards). They’re wary of theory-building that’s "internally tidy" but useless in practice. Their unspoken frustration? Philosophers often talk past real-world needs.  

  The big tension they’re circling: how to avoid causal sprawl (where *every* omission becomes a cause) without resorting to hand-waving. They want constraints—worldly facts vs. norms—laid bare. Also, they’re skeptical of easy outs like "omissions aren’t *real* causes"; that might tidy metaphysics but implodes in the coroner’s courtroom.  

  For the response structure, they want a table of requirements, each tied to a motivating case. Then a meta-analysis: non-negotiables vs. trade-offs, and a killer assessment of existing theories. The closing comparisons must be brutally concise—no jargon dumps.  

  Key pitfalls to avoid:  
  - **Don’t** survey literature or recommend readings. They’ll score theories themselves.  
  - **Do** flag irreconcilable conflicts (e.g., proliferation vs. sparse ontology).  
  - **Highlight** where norms *must* intrude (e.g., regulator’s "non-compliance" vs. engineer’s "failure mode").  

  The user’s depth suggests they’ve wrestled with this before. Their demand for "what it costs" to reject omissions as causes hints they’ve seen Strawson-style arguments and found them ethically inadequate. I’ll stress that cost in Requirement 2: if absences aren’t causal, the historian can’t explain the financial collapse credibly.  

  Most explosive requirement? **Proliferation** (Req 5). Any theory using counterfactuals *will* drown in causes unless constrained. I’ll split solutions: "worldly" (e.g., process theories) cut sprawl but struggle with norms; "normative" (e.g., duty-based) handle blame but risk subjectivity. The user needs to choose their poison here.  

  For the assessment:  
  - **Regularity theories** fail early (Req 1)—no constant conjunction for non-events.  
  - **Counterfactual theories** ace plain cases but explode in proliferation (Req 5).  
  - **Interventionist** accounts shine on agential cases (Req 3) but wobble on "no agent" (Req 4).  
  - **Powers/mechanism** theories handle natural omissions (Req 3) but choke on double prevention (Req 9).  
  - **Non-causal views** save ontology (Req 2) but collapse in courtrooms (Req 1, 6).  

  The irreconcilable trio? **Sparseness** (avoiding trivial causes), **Non-normativity** (worldly facts only), and **Covering normative cases** (Req 10). You can’t have all three. If forced, I’d ditch non-normativity—norms are unavoidable in human contexts.  

  Final note: The user’s "degrees and vocabulary" ask (Req 11) is subtle. A good theory needn’t reduce "absence" (historian) to "failure mode" (engineer), but must show they’re facets of one relation. If it can’t, it’s probably missing something.  

  This will be tight. Table first, then bloodletting in the assessment.
answer: |-
  ## Theory of Causation by Omission: Required Features & Constraints

  **Core Requirement:** The theory must provide a *practically applicable criterion* for identifying causal omissions across diverse contexts (forensic, historical, regulatory, metaphysical), capable of settling concrete cases without collapsing into triviality, normativity, or metaphysical incoherence.

  | Requirement Number | Requirement Description                                                                 | Motivating Case/Consideration                                                                                                                               | Category      | Notes on Conflict/Cost                                                                                                                                 |
  | :----------------- | :-------------------------------------------------------------------------------------- | :---------------------------------------------------------------------------------------------------------------------------------------------------------- | :------------ | :----------------------------------------------------------------------------------------------------------------------------------------------------- |
  | **R1**            | **Count Plain Agential Omissions as Causal:** Must recognize omissions by capable agents as causes of harm.                                             | Doctor not prescribing antibiotic (patient dies); driver not braking (pedestrian hit); lookout failing to watch (theft occurs).                              | Non-negotiable | Foundation for practical accountability. Failure here renders the theory useless for coroners, regulators.                                             |
  | **R2**            | **Address & Reject (or Seriously Cost) the "No Absences as Causes" View:** Must explain why rejecting omissions as causal is untenable or prohibitively costly in practice. | Temptation: Absences aren't events → causation requires events → omissions aren't causes (only explanatory).                                                | Non-negotiable | Cost: Makes blame/explanation in R1 cases fundamentally non-causal (merely "explanatory"), undermining responsibility & historical analysis. Creates disconnect between explanation and cause. |
  | **R3**            | **Treat Non-Agential Omissions as Causal:** Must treat natural/systemic absences identically to agential omissions where functionally equivalent.       | Antibiotic absent → bacteria grow; gene deleted → phenotype; braking subroutine not executing → collision.                                                  | Non-negotiable | Distinction between "natural" and "artefactual" omission is artificial for causation. Engineer (failure mode) and biologist (gene deletion) need same causal structure. |
  | **R4**            | **Handle Purely Natural Omissions:** Must allow purely natural absences (no possible agent) as causes, while preventing universal causal sprawl.        | Rain didn't come → harvest failed.                                                                                                                          | Non-negotiable | *The Core Challenge:* Requires a constraint mechanism (see R5) that works for nature. Failure leads to either denying obvious causes or absurdity (everything causes everything). |
  | **R5**            | **Constraining Proliferation:** Must provide a *principled* constraint on which absent events count as causes, separating worldly from normative constraints. | Counterfactual alone: Everyone not calling fire brigade caused the fire.                                                                                    | Non-negotiable | **Irreconcilable Tension Core:** Worldly constraints (e.g., spatiotemporal proximity, process links) risk missing normatively salient causes (R6, R10). Normative constraints (duties, expectations) risk subjectivity & losing natural cases (R4). |
  | **R6**            | **Account for Salience/Selection:** Must distinguish causal *status* from causal *salience/selection* for blame/explanation.                            | Many omissions caused the fire; we single out the paid lookout or the absent safety valve.                                                                  | Preference    | Failure risks conflating metaphysics with pragmatics/norms. Theory must *at least* allow salience to be a separate step *based on* causal facts + context. |
  | **R7**            | **Handle Redundancy & Preemption:** Must deliver causal status for omissions in overdetermination/preemption scenarios where no omission is strictly necessary (but-for). | Two capable guards *both* fail to stop the intruder (redundancy); watchdog sleeps, but intruder had bypass (preemption).                                    | Non-negotiable | Essential for fair attribution (historian on financial collapse). But-for test fails here; theory needs a stronger condition (e.g., sufficiency, process disruption). |
  | **R8**            | **Allow Omissions to Cause Omissions:** Must permit causal chains involving omissions.                                                                | Supervisor fails to instruct worker → worker fails to secure load → load falls.                                                                             | Non-negotiable | Necessary for complex historical/regulatory analysis. Theory must not arbitrarily block omission→omission links. May multiply causes but reflects reality. |
  | **R9**            | **Address "Double Prevention" Analysis:** Must engage with the view that omissions cause by *preventing a preventer*, stating benefits and strains.     | Doctor not giving antibiotic prevents the antibiotic from preventing bacterial growth.                                                                      | Preference    | Benefit: Frames omission as an active prevention event, easing event-based ontologies. Strain: Can feel forced for purely natural omissions (R4) and complex chains (R8). |
  | **R10**           | **Accommodate Normative Influence on Causal Verdicts:** Must explain how identical physical facts can yield different causal verdicts based on norms/expectations. | Two factories: One omits *standard* safety valve; one omits *novel* valve. Only the first is cited as *the cause* of the accident.                          | Non-negotiable | Regulator *needs* this distinction. Theory must either incorporate norms into causation (risks subjectivity) or cleanly separate causal base (physical) from normative selection/salience (R6). |
  | **R11**          | **Explain Degrees & Idioms:** Must provide a base causal relation underlying varied vocabulary (absence, failure, non-compliance), explaining degrees (major/minor cause) if present. | Historian: "Absence of lender of last resort"; Engineer: "Failure mode: brake subroutine not executing"; Regulator: "Non-compliance with standard XYZ". | Preference    | Degrees/idioms likely stem from salience (R6) and norms (R10) applied to the base causal fact. Theory need not reduce idioms but must show they map to the underlying relation. |

  **Structure & Conflicts:**

  1.  **Non-Negotiables:** R1, R2, R3, R4, R5, R7, R8, R10. These are demanded by the practical cases (coroner, historian, regulator, metaphysician). Failure on any renders the theory unusable for its intended purpose.
  2.  **Preferences:** R6, R9, R11. These relate to elegance, integration, or explaining common practice but can potentially be handled as separate steps (e.g., salience as post-causal selection).
  3.  **Irreconcilable Triad (Pick 2.5):**
      *   **Sparseness (Minimal Proliferation - R5):** Prevent trivial causes (e.g., everyone not calling the fire brigade).
      *   **Non-Normativity (R5 Worldly Constraints):** Constrain causes using only objective, non-normative, worldly facts (spatiotemporal, physical processes).
      *   **Covering Normative Cases (R10):** Deliver different causal verdicts for normatively distinct but physically identical omissions.
      *   **Conflict:** You cannot robustly satisfy all three. **Sacrifice Recommendation:** Sacrifice strict **Non-Normativity (R5 Worldly Constraints)**. Norms (expectations, standards, duties) are *necessary* for practical causal selection in human affairs (R10) and are often the only viable constraint against absurd proliferation in complex social/natural systems (R5). A purely "worldly" constraint struggles immensely with R4, R5, and utterly fails R10.
  4.  **Major Eliminator:** **R5 (Constraining Proliferation)** is the graveyard of theories. Any account relying solely on counterfactual dependence fails spectacularly here unless augmented. Theories that cannot handle R5 while satisfying R1, R3, and R4 are non-starters.

  **Assessment of Candidate Accounts (Against the List):**

  *   **Regularity (Humean):** Fails R1, R3, R4 (no constant conjunction for absences/non-events). Fails R7 (redundancy). Fails R10 (no normative sensitivity). **Unusable.**
  *   **Counterfactual Dependence (Lewisian):** Excels at R1, R3. Handles R4 *but catastrophically fails R5* (massive proliferation). Struggles with R7 (redundancy requires tweaks). Struggles with R10 (norms not inherent). **Fails core R5 constraint.**
  *   **Interventionist (Woodward):** Excels at R1, R3 (especially agential/non-agential). Handles R10 well (norms can define variables/interventions). Mitigates R5 *if* interventions are restricted (but restriction often relies on norms/salience). Struggles with R4 (defining interventions for purely natural absences is awkward). Handles R7 via modularity. **Strong contender, but R4 & R5 reliance on norms/salience is a feature/cost.**
  *   **Powers / Mechanisms:** Handles R3, R4 naturally (absence disrupts mechanism/power). Mitigates R5 via physical/spatial proximity of mechanism. Struggles with R1, R7 (agential omissions as "disruptions" can feel strained). Struggles severely with R10 (norms don't fit mechanistic base). **Good for natural/engineering cases (R3,R4,R5-worldly), weak for agential/normative (R1,R10).**
  *   **Omissions Not Causes (Quasi-Causal/Explanatory):** Satisfies R2 only by denying R1, R3, R4. Renders causal explanations in coroner/historian/regulator cases fundamentally non-causal, undermining accountability and explanation. **Cost (denying R1,R3,R4) is prohibitively high for practical use.**
