prompt: |-
  Before I read any more theories of content, I want the spec. Write me the desiderata for a theory of what makes a mental or neural state about something — the phenomena it has to explain, the cases it has to get right, the distinctions it can't collapse, each with the case that forces it. I want at least: misrepresentation (a state that's supposed to be about F but fires when no F is around); the disjunction problem — why a state reliably triggered by two different things doesn't just mean their disjunction; content with nothing behind it (a belief about unicorns, a plan for a house that never gets built); the imperative/descriptive split (a bee's dance both reports where the nectar is and tells you to go there); and content where there's no selection history to appeal to — say a person who's worn a belt that buzzes toward north for a year and now just feels which way north is, or a net that got its job by gradient descent rather than evolution. Also say whether the theory owes us correctness in a normative sense rather than mere reliable correlation, and whether it has to give determinate content or can shrug and say "it's about the disjunction" or "about the average of the two". For each requirement, why its a requirement and not a prejudice of one camp, and mark the non-negotiable ones. Then flag any pair you think can't be had together — that's what I'm actually after. Keep any scorecard of the main contenders to a couple of lines.
reasoning: |-
  We are going to outline the desiderata for a theory of mental content. The goal is to specify the phenomena that such a theory must account for, the cases it must get right, and the distinctions it must preserve. We will also address the normative aspect and determinacy of content. For each requirement, we will explain why it is a requirement and not merely a prejudice, and note which ones are non-negotiable. We will also flag any pairs of requirements that might be in tension. Finally, we will provide a brief scorecard of the main theories.

  ### Desiderata for a Theory of Mental Content

  1. **Misrepresentation**
     - **Phenomenon**: The possibility of a mental state being about F but being tokened (activated) in the absence of F.
     - **Case**: A frog's visual system is tuned to detect flies (small, dark, moving dots). It sometimes snaps at BB pellets, which are not flies. The state is supposed to represent flies but misrepresents the BB pellet as a fly.
     - **Why requirement**: Without misrepresentation, we cannot account for error. If a state is activated by non-Fs, then either it is not really about F or it is about something broader (like flies-or-BBs). But then we lose the ability to say the frog is making a mistake. This is non-negotiable because error is a central feature of cognition.
     - **Non-negotiable**: Yes.

  2. **The Disjunction Problem**
     - **Phenomenon**: Explaining why a state that is reliably triggered by two distinct things (F and G) is not simply about the disjunction (F or G).
     - **Case**: A state in a rat's brain is triggered by both the smell of cheese and the smell of peanut butter. We want to say that the state is about cheese (because that's what the rat is seeking) and that when it is triggered by peanut butter, that is a case of misrepresentation. But if the state is triggered by both, why isn't its content the disjunction (cheese or peanut butter) so that both triggers are veridical?
     - **Why requirement**: Without solving the disjunction problem, we cannot have misrepresentation (see above). If the content is disjunctive, then the state is always correct when triggered by either F or G. This is non-negotiable because it is tied to misrepresentation.
     - **Non-negotiable**: Yes.

  3. **Content Without Causal/Historical Basis (Empty Content)**
     - **Phenomenon**: Mental states can be about non-existent things (unicorns) or non-realized states of affairs (a plan for a house that is never built).
     - **Case**: 
       - *Belief about unicorns*: A child believes in unicorns. There are no unicorns, so the content is not caused by unicorns and does not track unicorns.
       - *Plan for a house*: An architect has a detailed plan for a house that is never built. The plan is about a house that doesn't exist.
     - **Why requirement**: Our theory must account for the intentionality of mental states that are not grounded in actual objects or events. If a theory only allows content for things that exist or have caused the state, it cannot account for imagination, fiction, or false beliefs. This is non-negotiable because such states are commonplace.
     - **Non-negotiable**: Yes.

  4. **Imperative vs. Descriptive Content**
     - **Phenomenon**: Some mental states (or signals) have both descriptive (indicative) and imperative (directive) aspects. A theory must account for this split and how a single state can have both.
     - **Case**: A bee's dance indicates the location of nectar (descriptive) and also directs other bees to go there (imperative). Similarly, in human language, an utterance like "The door is open" can be both a description and a request to close it (depending on context).
     - **Why requirement**: Without accounting for this, we cannot explain how the same representation can play different functional roles. This is a requirement because it is a common feature of communication and mental states (e.g., a desire for water is both about water and directs behavior to get water). However, one might argue that a theory could reduce one to the other or explain them separately. But the challenge is to explain how a single state can have both. This is non-negotiable for a comprehensive theory.
     - **Non-negotiable**: Yes.

  5. **Content Without Selection History**
     - **Phenomenon**: Content must be assignable even when there is no evolutionary or learning history that selects for the state.
     - **Cases**:
       - *Belt that buzzes toward north*: A person wears a belt that vibrates when facing north. After a year, they develop an immediate sense of where north is without the belt. The content "north" is acquired without biological evolution and without explicit learning of a map, but through a novel device.
       - *Artificial neural network*: A network trained by gradient descent to recognize cats. It has no evolutionary history, and the learning process is not based on pre-existing representational capacities. We want to say that the network's state is about cats, but it has no history of selection for cat detection.
     - **Why requirement**: Many representational systems (especially artificial ones) do not have a history of natural selection. A theory that relies solely on evolutionary history (like some teleosemantic theories) would not apply to these cases. This is non-negotiable because of the prevalence of learned and artificial representations.
     - **Non-negotiable**: Yes.

  6. **Normative Dimension (Correctness)**
     - **Phenomenon**: Does the theory require that content assignments entail a normative standard of correctness? Or is it enough to have reliable correlation?
     - **Issue**: If a state is about F, then it should be correct when F is present and incorrect otherwise. But if the theory only requires reliable correlation, then it might not capture the normativity of representation (that it ought to be true or accurate).
     - **Why requirement**: Without normativity, we cannot say that the frog is making a mistake when it snaps at a BB pellet. But some theories (e.g., causal-informational) may settle for reliable correlation and give up on normativity. However, normativity is central to our concept of content. We expect that a belief can be false, and that there is a sense in which it should not have been tokened. This is non-negotiable for many, but some might argue that normativity is not essential. We mark it as non-negotiable for a full theory of intentionality.
     - **Non-negotiable**: Yes.

  7. **Determinacy of Content**
     - **Phenomenon**: Must the theory assign a determinate content (e.g., the state is about flies, not flies-or-BBs) or can it be indeterminate?
     - **Issue**: If the theory allows indeterminate content (e.g., "it's about the disjunction" or "it's about the average of the two"), then it might not solve the disjunction problem and misrepresentation becomes problematic.
     - **Why requirement**: We need determinacy to account for specific intentionality. When I think about Paris, I am thinking about Paris, not about Paris-or-a-simulation-of-Paris. But some theories (like interpretationism) might allow some indeterminacy. This is non-negotiable for avoiding the disjunction problem and for capturing the specificity of thought.
     - **Non-negotiable**: Yes.

  ### Tensions Between Desiderata

  - **Misrepresentation and Disjunction Problem**: Solving the disjunction problem is necessary for misrepresentation. But if a theory solves the disjunction problem by appealing to selection history (as teleosemantics does), then it may conflict with **Content Without Selection History**. Teleosemantics says that the state is about what it was selected to indicate. But in the belt example, there is no selection history, so teleosemantics might not apply. Thus, there is tension between solving the disjunction problem (via history) and accounting for novel representations without history.

  - **Content Without Causal/Historical Basis and Determinacy**: For empty content (unicorns), there is no causal history to ground the content. But if we rely on causal history for determinacy (as in causal theories), we have a problem. We might need a descriptive or conceptual role theory for such cases, but then we must ensure determinacy.

  - **Normativity and Naturalism**: If we require normativity, we must explain how it arises from natural processes. This is a challenge for naturalistic theories.

  ### Scorecard of Main Theories

  1. **Causal/Informational Theories** (e.g., Fodor): 
     - Solves misrepresentation? Not without appeal to asymmetric dependence (which is controversial). 
     - Disjunction problem? Addressed by asymmetric dependence (F causes the state, G doesn't, unless via F).
     - Empty content? Fails (no causal connection to unicorns).
     - Imperative/descriptive? Not typically addressed.
     - Without selection history? Might work for learning (if causal chains are established) but not for empty content.
     - Normativity? Not explicitly, unless coupled with normativity from elsewhere.
     - Determinacy? Aim for determinacy via asymmetric dependence.

  2. **Teleosemantics** (e.g., Millikan, Papineau):
     - Misrepresentation: Yes (via failure of function).
     - Disjunction problem: Solved by what the state was selected for.
     - Empty content? Problematic (no selected function for unicorns).
     - Imperative/descriptive: Can handle via functional role (descriptive: indicators; imperative: imperatives have directive functions).
     - Without selection history? Fails for novel devices (belt) and artificial nets (unless we extend "selection" to learning, which is controversial).
     - Normativity? Yes (via biological norms: the state should indicate F because that's its function).
     - Determinacy? Yes (via the specific function).

  3. **Conceptual Role Semantics** (e.g., Block, Harman):
     - Misrepresentation: Possible if the role includes connections to the world, but tricky.
     - Disjunction problem: Not directly addressed; might rely on the role to specify content.
     - Empty content: Handled well (unicorns are defined by their role in thought).
     - Imperative/descriptive: Can handle by different roles (inferential vs. action-guiding).
     - Without selection history? Yes, because it's about current role.
     - Normativity? Not inherently, unless roles are normatively governed.
     - Determinacy? May face indeterminacy (Quinean inscrutability).

  4. **Interpretationism** (e.g., Davidson, Dennett):
     - Misrepresentation: Possible under an ideal interpretation.
     - Disjunction problem: Might allow some indeterminacy.
     - Empty content: Handled (interpretation can assign unicorns).
     - Imperative/descriptive: Can be handled by the interpretation of the agent's stance.
     - Without selection history? Yes, because interpretation is based on behavior and environment.
     - Normativity? Yes (correctness is according to the best interpretation).
     - Determinacy? May not be fully determinate (indeterminacy of translation).

  ### Summary of Tensions

  The most notable tension is between:
  - **Solving the disjunction problem and accounting for misrepresentation** on the one hand, and 
  - **Content without selection history** on the other.

  Theories that rely on selection history (teleosemantics) have a robust solution to the disjunction problem and misrepresentation but fail for cases without history. Causal theories struggle with disjunction and empty content. Conceptual role and interpretationist theories handle empty content and lack of history but may struggle with determinacy and misrepresentation.

  Another tension is between:
  - **Normativity** and 
  - **Naturalism** (the requirement that content be explained in naturalistic terms).

  Theories must show how norms arise from non-normative facts.

  ### Non-Negotiable List
  All the listed desiderata (1-7) are non-negotiable for a comprehensive theory of content. However, different theories may sacrifice one to achieve others. The challenge is to find a theory that satisfies all.

  This sets the stage for evaluating theories: we must see which can handle all seven without internal contradiction.
answer: |-
  Below is a structured specification of desiderata for a theory of mental content, including phenomena to explain, cases to accommodate, distinctions to preserve, and key philosophical tensions. I've organized it as requested, marking non-negotiable requirements, justifying each, flagging pairwise tensions, and ending with a scorecard of major theories. Non-negotiable items are those any minimally adequate theory *must* address to capture core features of intentionality (aboutness). Tensions highlight where desiderata might conflict.

  ---

  ### **Core Desiderata for a Theory of Mental Content**  
  *(Non-negotiable items marked with ⚠️)*  

  1. **Misrepresentation**  
     - **Phenomenon**: A state's content fails to match the world (e.g., it represents F when F is absent).  
     - **Case**: Frog visual neurons fire at flies (F) but also at BB pellets (non-F). The state *misrepresents* pellets as flies.  
     - **Why requirement, not prejudice**: Misrepresentation is foundational to cognition (error, illusion, false belief). Without it, all mental states would be "true by default," collapsing intentionality into mere correlation. *Not* a linguistic or cultural artifact.  
     - **Non-negotiable**: ⚠️ Yes.  

  2. **The Disjunction Problem**  
     - **Phenomenon**: Why a state triggered by F *or* G isn't *about* (F ∨ G), allowing misrepresentation when triggered by G alone.  
     - **Case**: A neuron fires for cats (F) and raccoons (G) at night. It must be *about cats specifically* (e.g., evolved for cat-detection), so raccoons trigger misrepresentation.  
     - **Why requirement, not prejudice**: Solves ambiguity in causal-informational theories. Avoids trivializing content (e.g., "everything" as content). Reflects how brains discriminate objects.  
     - **Non-negotiable**: ⚠️ Yes (tied to misrepresentation).  

  3. **Empty Content**  
     - **Phenomenon**: Content about non-existent/non-instantiated entities (no causal referent).  
     - **Case**: (a) Belief about unicorns (nothing satisfies "unicorn"). (b) Architect's blueprint for a house never built (content without real-world instantiation).  
     - **Why requirement, not prejudice**: Human cognition routinely targets non-actual things (fiction, plans, false positives). A theory that requires causal contact with referents (e.g., crude causal theories) fails here.  
     - **Non-negotiable**: ⚠️ Yes.  

  4. **Imperative/Descriptive Distinction**  
     - **Phenomenon**: Some states *describe* (e.g., "nectar is here") while others *prescribe* (e.g., "go here"). Hybrid states exist.  
     - **Case**: Bee dance: indicates nectar location (descriptive) *and* directs hive-mates (imperative). Human example: A map shows terrain (descriptive) but also guides movement (imperative).  
     - **Why requirement, not prejudice**: Cognitive systems combine information and action. Collapsing the distinction ignores functional differences (e.g., belief vs. desire). Not reducible to behavioral dispositions alone.  
     - **Non-negotiable**: ⚠️ Yes (for comprehensive theories).  

  5. **Content Without Selection History**  
     - **Phenomenon**: Content assigned without evolution or learning history.  
     - **Cases**:  
       - (a) Human with vibrotactile belt: After 1 year, "feels" north without the belt. No evolution or "training" for north-representation.  
       - (b) AI vision net: Trained via gradient descent to recognize "cats"—no biological selection, no prior representational capacity.  
     - **Why requirement, not prejudice**: Challenges teleosemantic theories (which rely on selection history). Modern cognition/AI often lacks historical etiology. *Not* an edge case (e.g., rapid learning, novel tools).  
     - **Non-negotiable**: ⚠️ Yes (for applicability to non-biological systems).  

  6. **Normative Correctness vs. Mere Correlation**  
     - **Question**: Must the theory imply states *ought* to be true/accurate (normativity), or is reliable correlation sufficient?  
     - **Cases**: Frog snapping at BB pellet: Does the state *ought not* fire (normative failure), or is it just statistically atypical?  
     - **Why requirement, not prejudice**: Normativity is central to content (e.g., beliefs aim at truth; misrepresentation implies failure). Dismissing it reduces content to information theory, losing its evaluative aspect.  
     - **Non-negotiable**: ⚠️ Yes (for theories capturing "intentionality" fully).  

  7. **Determinacy of Content**  
     - **Question**: Must content be precise (e.g., "cat," not "cat-or-raccoon"), or can it be indeterminate/disjunctive?  
     - **Cases**: Neuron firing for cats/raccoons: Can content be "cat" (determinate) or must it be "cat-or-raccoon" (indeterminate)?  
     - **Why requirement, not prejudice**: Determinacy avoids vagueness in explanation (e.g., why we *treat* the frog as misrepresenting BBs). Indeterminacy may be acceptable in peripheral cases, but core cognition demands specificity (e.g., "water" vs. H₂O/Twin-Earth XYZ).  
     - **Non-negotiable**: ⚠️ Yes (required for misrepresentation & disjunction problem).  

  ---

  ### **Tensions Between Desiderata**  
  *(Pairs difficult to satisfy jointly)*  

  - **Misrepresentation/Disjunction Problem + Content Without Selection History**:  
    Teleosemantic solutions to misrepresentation/disjunction (e.g., Millikan) appeal to evolutionary/learning history. But novel devices (vibrobelt) or AI lack this history. *Tension*: Solving misrepresentation historically conflicts with ahistorical cases.  

  - **Empty Content + Determinacy**:  
    Empty content (unicorns) lacks causal anchors, making determinacy harder. Conceptual role theories (e.g., Block) can handle emptiness but risk indeterminacy (e.g., "unicorn" as disjunction of descriptions). *Tension*: Grounding determinate content in nothing.  

  - **Normativity + Content Without Selection History**:  
    Normativity often relies on biological/functional norms (e.g., proper function). Novel systems (AI) lack this. Can normativity be derived from current structure? *Tension*: Naturalizing norms without history.  

  - **Imperative/Descriptive + Determinacy**:  
    Hybrid states (bee dance) blur content types. A theory might resolve this via context, but determinacy demands unambiguous content assignment. *Tension*: Preserving distinction while allowing unity.  

  ---

  ### **Theoretical Scorecard**  
  *(How leading theories fare on key desiderata)*  

  1. **Causal-Informational (e.g., Fodor)**:  
     - 👍: Handles determinacy via asymmetric dependence.  
     - 👎: Fails empty content, disjunction problem, normativity. Struggles without history.  

  2. **Teleosemantic (e.g., Millikan, Papineau)**:  
     - 👍: Solves misrepresentation/disjunction via selection history; adds normativity.  
     - 👎: Fails content without history; empty content problematic (no selected function for unicorns).  

  3. **Conceptual Role (e.g., Block, Brandom)**:  
     - 👍: Handles empty content, imperative/descriptive (via role), and ahistorical cases.  
     - 👎: Risky indeterminacy; normativity optional/added; disjunction problem unsolved.  

  4. **Interpretivist (e.g., Dennett, Davidson)**:  
     - 👍: Handles empty content, normativity (via interpretation), and hybrid states.  
     - 👎: Content often indeterminate; struggles with misrepresentation/disjunction.  

  5. **Predictive Processing/PP (e.g., Clark, Hohwy)**:  
     - 👍: Naturalistic; handles normativity (prediction error minimization); accommodates AI.  
     - 👎: Unclear on empty content/disjunction; imperative/descriptive split underdeveloped.  

  ---

  ### **Conclusion**  
  A viable theory must satisfy all non-negotiable desiderata (1–7), but tensions exist—most sharply between **historically grounded solutions** (for misrepresentation/disjunction) and **ahistorical cases** (novel devices/AI). Theories like teleosemantics excel at normativity and misrepresentation but fail for ahistorical content; conceptual role handles emptiness and hybrid states but risks indeterminacy. The hardest pairs to reconcile are **misrepresentation without history** and **empty content with determinacy**. A theory that resolves these—e.g., via dynamic sensorimotor contingencies (for ahistorical cases) and inferential roles (for emptiness)—would be groundbreaking.
