answer: |-
  ### **Harsanyi's Aggregation Theorem Activity: "The Chocolate Lottery"**  
  **Goal:** Students experience the veil of ignorance, confront the role of decision rules (utilitarianism vs. maximin), and discover how cardinal utility/comparability shapes outcomes.  

  ---

  #### **Materials**  
  1. **Role Cards** (printable):  
     - 14 cards: 5 "Type A", 5 "Type B", 4 "Type C".  
  2. **Utility Charts** (printable posters):  
     - **Type A**: Utility = √(tokens)  
     - **Type B**: Utility = 2 × tokens  
     - **Type C**: Utility = tokens  
  3. **Tokens**: 100 paper tokens (e.g., printed circles).  
  4. **Payoff**: Chocolate coins (or small candies). Utility points → chocolate (1 point = 1 piece).  
  5. **Lottery Box**: Contains 14 folded slips (5 "A", 5 "B", 4 "C").  

  ---

  #### **Timeline (80 min)**  
  **1. Setup (10 min)**  
  - **No lecture.** Briefly explain:  
    > *"You’ll split into groups to allocate tokens. Tokens convert to chocolate later. You don’t know your ‘type’ yet—it’ll be randomly assigned. Your type determines how much chocolate you get from tokens."*  
  - Distribute **Role Cards** face-down. Students *don’t* look yet.  
  - Divide into 3 groups (by counting off 1–3). Each group has ~4–5 students.  

  **2. Veil of Ignorance Allocation (25 min)**  
  - **Task:**  
    > *"As a group, decide how to split 100 tokens among Types A, B, and C. You don’t know your type. Record your allocation and reasoning."*  
  - Give each group:  
    - 100 tokens (physical or paper).  
    - **Utility Chart** (posted visibly).  
    - Worksheet: *"Allocation: A=___, B=___, C=___. Why?"*  
  - **Instructor:** Circulate, ask probing questions:  
    - *"What’s ‘fair’ if you might be anyone?"*  
    - *"Should everyone get equal tokens? Or equal utility?"*  

  **3. The Lottery and Payoff (15 min)**  
  - **Reveal types:** Students draw from the **Lottery Box** to discover their type.  
  - **Calculate payoffs:**  
    - Groups report allocations. Instructor calculates utility for each type:  
      - E.g., Group 1 allocates (A:20, B:50, C:30).  
      - Type A: √20 ≈ 4.5 → 4.5 points  
      - Type B: 2×50 = 100 points  
      - Type C: 30 points  
    - Distribute chocolate based on points (1 point = 1 piece).  
    - *Example:* A student with Type B gets 100 chocolates; Type A gets 4.5 (round to 5).  

  **4. Debrief (30 min)**  
  - **Guided Discussion:**  
    - **Q1:** *"How did you allocate? Why?"*  
      - Predict: Most split equally (e.g., 33/33/34) or favor high-marginal-utility types (Type B).  
    - **Q2:** *"How do you feel about outcomes? Was it fair pre-lottery? Post-lottery?"**  
      - Highlight: Equal tokens ≠ equal utility (e.g., Type A gets less for same tokens).  
    - **Q3:** *"Did the veil push you toward summing utilities? Why?"*  
      - Tease out: They likely maximized *expected* utility (utilitarianism) or worst-case (maximin).  
  - **Map to Harsanyi:**  
    - **Cardinality:** Utility functions forced intertype comparisons (√ vs. linear).  
    - **Weights:** Equal probability (lottery) → equal weights... but only if they *assumed* equiprobability!  
    - **Ex Ante vs. Ex Post:** Fairness pre-lottery (ex ante equality of chance) vs. inequality post-reveal.  
    - **What’s missing:** The theorem’s formal axioms (EU + Pareto → linear aggregation). *You must explain this part.*  

  ---

  #### **What Will Go Wrong (And How to Fix)**  
  1. **"Utility is abstract!"** → Use physical tokens/chocolate to make stakes visceral.  
  2. **Groups fixate on equal tokens, ignore utility:** Ask: *"Will Type A enjoy 20 tokens as much as Type B?"*  
  3. **Post-lottery resentment:** Lean into it! *"Why is Type B smiling? Is this fair after the fact?"*  
  4. **Time crunch:** Strictly enforce 25 min for allocation. Have a timer.  
  5. **Math errors:** Pre-calculate utilities for common allocations (e.g., 25/25/50).  

  ---

  #### **What the Activity Can’t Do**  
  - **Formal theorem proof:** Students won’t derive linear aggregation from axioms. *You must lecture this.*  
  - **Pareto optimality:** The activity implies it (via payoff maximization) but doesn’t formalize it.  

  ---

  **One-liner:** *"The veil feels empty until you pour a decision rule into it—and suddenly, utilitarianism emerges from the cup."*
