prompt: |-
  so I've gotten weirdly into this lately — my partner's french and I promised to translate a little Renaissance poem for our anniversary card, nothing fancy, but I keep getting stuck because the original rhymes and scans and every time I fix the sense the rhyme dies and when I fix the rhyme the sense goes weird. went down a rabbit hole and ended up skimming that Hofstadter book, Le Ton beau de Marot (the 1997 one), where he translates one tiny 16th-century Clément Marot poem like a million different ways and just obsesses over the tradeoffs. great fun, not helping me pick.

  anyway I whined about it to a friend who plays in bands and he was like "dude, a translation is just a cover version. nobody expects a cover to sound like the original, you just gotta capture the vibe and do your own thing." and now I'm half-convinced I'm allowed to just drop the rhyme scheme, write a nice free-verse english version, and still call it a translation, since apparently that's exactly what a cover does.

  before I deface a dead poet, help me audit this. give me the mapping first — what plays the song, the recording, the arrangement, the groove, the listener, the "faithful cover" — then where the cover-version picture actually breaks for translation, especially for a poem where the form is arguably part of the point. which of those disanalogies actually matter for what my friend is using the analogy to do, and which are just noise? and does his conclusion survive — that I can ditch the form and still call the result a translation — or was the analogy carrying the whole argument? if there's a better analogy for translating-under-constraint, tell me what it is and what it gets right that "cover version" doesnt.

  (also, slightly worried: the more I read about translation the less I believe there's a right answer at all. is that just what happens)
