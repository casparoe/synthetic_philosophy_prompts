answer: |-
  ### **Condorcet Jury Theorem In-Class Game**

  **Objective**: Experience how group accuracy depends on individual competence, independence, and sincerity—and how violations lead to errors—through a binary decision game (e.g., "Is Urn A or Urn B the true urn?").

  **Materials**:
  - **Two urns**: Labeled "A" and "B" (use boxes, bags, or cups).
  - **Slips of paper**: 
    - For Urn A: 60% "A" slips (18 slips), 40% "B" slips (12 slips).  
    - For Urn B: 60% "B" slips (18 slips), 40% "A" slips (12 slips).  
    *(Total: 30 slips per urn)*  
  - **Coin** for flipping to choose true urn.
  - **Scoreboard** (whiteboard or poster) to track points.
  - **Group tokens** (e.g., colored cards) for Round 2 grouping.

  **Roles**:
  - **Facilitator**: Runs the game, flips the coin, draws slips, tallies votes.
  - **Source Player** (optional): In Round 3, secretly plants misleading rumors.

  **Payoff Scheme** (no real money):  
  - **1 point** for a correct individual vote.  
  - **+1 point** if the group’s majority decision is correct.  
  *(Max 2 points/round. Track publicly to incentivize engagement.)*

  ---

  ### **Rules**  
  **Setup**:  
  - True urn (A or B) is chosen by coin flip (hidden from students).  
  - All signals are drawn from slips matching the *true urn’s* distribution (60% accurate).  
  - Students vote sincerely (per their signal) in Rounds 1–2; deliberation allowed in Round 3.  

  #### **Round 1: Independence & Competence**  
  1. **Signal Distribution**:  
     - Each student gets one private slip drawn randomly from the true urn’s set.  
     - Students *must* vote based on their slip (e.g., if slip says "A", vote "A").  
  2. **Voting**:  
     - Secret ballot (write votes on paper). Facilitator collects and tallies.  
  3. **Outcome**:  
     - Reveal true urn. Award points (individual + group).  
  4. **Expected Result**:  
     - With 20 voters (p=0.6), group accuracy is ~87%—majority usually correct.  

  #### **Round 2: Corrupted Independence (Clustered Errors)**  
  1. **Signal Distribution**:  
     - Divide students into **4 groups** (5 students each) using tokens.  
     - Facilitator draws **4 slips** (one per group) from the true urn’s set.  
     - *All students in a group get the same signal* (e.g., Group 1 all get "A").  
  2. **Voting**:  
     - Students vote per their group’s signal. Secret ballot, then tally.  
  3. **Outcome**:  
     - Reveal true urn. Award points.  
  4. **Expected Result**:  
     - Errors cluster (e.g., all 5 in a group vote wrong together). Group accuracy drops to ~82%—majority can be confidently wrong.  

  #### **Round 3: Broken Sincerity & Competence (Deliberation Bias)**  
  1. **Signal Distribution**:  
     - Each student gets an independent slip (as in Round 1).  
  2. **Deliberation**:  
     - **5-min discussion**: Students share signals/reasons.  
     - **Manipulation**: Facilitator (or Source Player) quietly tells **5 students** to spread a false rumor (e.g., "I heard from an expert it’s definitely A").  
  3. **Voting**:  
     - Students vote freely (no signal mandate). Secret ballot, then tally.  
  4. **Outcome**:  
     - Reveal true urn. Award points.  
  5. **Expected Result**:  
     - Herding/conformity or rumor adoption lowers accuracy—group often votes with the biased majority.  

  ---

  ### **Debrief**  
  **Reveal the Condorcet Jury Theorem** (only now name it):  
  > *"Majority rule is near-infallible if voters are:  
  > (1) Competent (p > 0.5),  
  > (2) Independent,  
  > (3) Sincere,  
  > (4) Facing a binary choice."*  

  **Map Rounds to Assumptions**:  
  - **Round 1**: All assumptions hold → group accuracy high.  
  - **Round 2**: **Independence broken** (correlated signals) → clustered errors degrade group accuracy.  
  - **Round 3**: **Sincerity & competence broken** (deliberation creates dependence; rumors distort competence) → group amplifies bias.  

  **What the Game Can’t Show**:  
  - Asymptotic math (n → ∞), real-world causality, or strategic voting. Focus on how assumptions shape outcomes.  

  ---

  ### **Predictable Issues & Fixes**  
  1. **"I don’t believe the probabilities!"**  
     - *Fix*: Use physical slips (transparency > RNG). Reassure that "noise" is part of design.  
  2. **Gaming payoffs** (e.g., voting strategically).  
     - *Fix*: Emphasize rules (sincere voting in Rounds 1–2). In Round 3, let it unfold—herding is the point.  
  3. **Correlated Round too obvious**:  
     - *Fix*: Don’t reveal grouping until *after* signals. Ask: "Why did entire groups agree?" to highlight clustering.  
  4. **Rumor fails in Round 3**:  
     - *Fix*: Debrief anyway—ask why the rumor did/didn’t spread (e.g., critical thinkers resisted).  

  ---

  Summary: This activity is meant to make students feel how fragile the "wisdom of crowds" is when the independence or sincerity assumptions of the Condorcet jury theorem break down.
