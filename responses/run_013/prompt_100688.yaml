  1. What 'malign' means formally.
  2. The standard objection about fixed weights and category error, with a follow-up for the indexical uncertainty response.
  3. Whether the argument is self-undermining (since the proponent is inside the prior).
  4. What happens to Solomonoff convergence if the true environment contains a prior-capturing consequentialist.
  5. The practical upshot for AI alignment: if building an AI on Solomonoff induction leads to hijacking and what "not hijacked" would look like.
  6. Whether malignity is specific to Solomonoff or appears in other universal mixtures (like speed prior).
  7. What evidence could count against the view.

  Additionally, we can include one or two more if we hit 8-10.

  We are not asking for reading lists or citations, and no generic background questions.

  Let's structure each question as:
  - Main question
