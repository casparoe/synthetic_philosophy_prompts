  The collective duty angle is interesting—if everyone thinks like the user, the safe seat might not stay safe. But is that convincing for an individual? The expressive view is different—voting as expression regardless of impact. That could hold, but does it "count" in the way the friend meant?

  The civic duty view is common—voting as ethical obligation. But the user might see this as circular if the duty's source isn't explained. The definitional view is trivial but worth mentioning. 

