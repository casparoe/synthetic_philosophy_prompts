answer: |-
  ## The Unstable Law

  The nomological reading of the quantum wavefunction, while intuitively appealing, collapses into instrumentalism under scrutiny. It fails to establish a stable, ontologically distinct third position between ontic realism and epistemic/instrumentalist views.

  Its initial distinction is clear: unlike the ontic view, which treats the wavefunction as a concrete physical entity (like a field in high-dimensional space), the nomological view denies it physical existence in the world. Unlike purely epistemic views (often precursors to instrumentalism), it insists the wavefunction-as-law is "robustly real." Proponents argue it dissolves the dimensionality puzzle – the law operates in 3N-space to govern behaviour in 3D space – and explains the indirectness of measurement and the nature of quantum probability. Probability arises from the law itself governing systems, not from an inherently probabilistic physical object.

  However, the analogy to laws of nature breaks down critically. Traditional laws (like Newton's laws or Maxwell's equations) are characterized by generality, universality, and invariance. They are not *particulars* we manipulate; they are the fixed framework within which particulars evolve. The wavefunction manifestly fails this test:
  1.  **Particularity & Contingency:** The wavefunction of a specific system (e.g., a hydrogen atom in its ground state, a prepared spin) is a highly specific, contingent mathematical object. It depends entirely on the system's preparation and history. Laws do not have "ground states" or "preparations."
  2.  **Manipulability:** We actively prepare, control, and measure the wavefunction of individual systems using laboratory apparatus. We don't "prepare" or "adjust" the law of gravity with knobs; we manipulate objects governed *by* that law. The wavefunction behaves like the *state* being manipulated, not the invariant law governing it.
  3.  **Dependence:** What *is* this law governing? In theories with a primitive ontology (like Bohmian particles), the wavefunction *can* be interpreted as a dynamical law guiding the particles. But in pure wavefunction theories (like Everettian QM), there *is* no deeper ontology. The wavefunction *is* the fundamental description. Calling it a "law" governing "itself" or "nothing" is vacuous or circular, dissolving into the claim that the wavefunction is merely a mathematical device for calculating the evolution of... the wavefunction. This is instrumentalism.

  The insistence that laws are "robustly real" creates a fatal tension. If laws are genuine, mind-independent features of reality, how does this "robust reality" differ from the physical existence attributed by the ontic view? The wavefunction's specific, contingent, manipulable nature makes it utterly unlike traditional laws. If proponents grant it a *sui generis* type of "law-reality" that encompasses being a particular, contingent, manipulable object, they have simply invented a new label ("law") for what the ontic realist calls a "physical entity," rendering the dispute verbal. Alternatively, if they acknowledge its status as a calculational tool for predicting the behaviour of the *actual* ontology (pointers, particles), they embrace instrumentalism. The nomological view cannot sustain its claimed middle ground; the wavefunction's characteristics inevitably pull it towards being either a state (ontic) or a predictive instrument.

  The PBR theorem does not rescue the nomological view. It assumes wavefunctions represent underlying physical states (ontic/epistemic views) and derives a contradiction with preparation independence if distinct pure states overlap on the underlying state space. A proponent of the nomological view would rightly argue the theorem simply presupposes the wavefunction *is* a state description, not a law. The theorem targets epistemic interpretations specifically, not the core claim of the nomological view that the wavefunction *isn't* describing a state at all. Its irrelevance highlights that the fatal flaws of the nomological view lie deeper, in its inability to coherently define what a "particular, contingent, manipulable law" governing an undefined ontology *means* without collapsing into one of the existing categories.

  **Strongest Objection & Reply:**

  *   **Objection:** Laws *can* be contingent and evolve! Consider cosmological "constants" or proposed theories with dynamical laws. Why can't the wavefunction be such a particular, contingent law governing a system's ontology?
  *   **Reply:** Even in models with "evolving laws," the *law-at-a-time* is general, applying uniformly to all relevant systems within its domain. A specific hydrogen atom's wavefunction is not a general principle applying to many systems; it is the unique, system-specific description *prescribed by* the general laws of quantum mechanics (like the Schrödinger equation) given initial conditions. We manipulate *this specific description* experimentally. This behaviour is fundamentally characteristic of a *state* within a theoretical framework governed by overarching laws, not of a law itself. Treating each system's unique wavefunction as its own distinct "law" trivializes the concept beyond recognition, offering no explanatory advantage over instrumentalism.
