  Here's a joke tailored to your specifics, focusing on eyestalk ablation, with setup and punchline:

  **Setup:**  
  "People always ask why crustacean welfare is so tricky. I tell them it's because we inherited vertebrate rules: 'Minimize suffering, ensure humane slaughter.' So we look at our shrimp... and realize the *standard industry practice* to make them breed involves snipping off an eye with hot wire. Then you stare at this eyeless broodstock swimming in circles..."  

  **Punchline:**  
  "...and suddenly, 'humane slaughter' feels like the *second*-hardest problem to solve."  

  ---

  ### Notes for You:
  1.  **Where it takes liberties**:  
      The phrase "eyeless broodstock swimming in circles" is hyperbolic. Ablation removes *one* eyestalk (not both eyes), and while altered behavior post-ablation is documented (e.g., reduced feeding), "swimming in circles" is dramatic shorthand for disorientation.  

  2.  **Where it rests on contested science**:  
      - **Sentience**: The joke implies ablation causes suffering, but *whether decapods experience pain/suffering* is still debated in some sectors (though evidence is mounting). Welfare-focused attendees will accept this premise; hardline aquaculture folks might internally dispute it.  
      - **"Worst thing in the tank"**: The joke positions ablation as the glaring welfare issue. While ablation is visceral and ethically jarring, insiders know that chronic stressors (water quality, disease, handling) may cause *more* cumulative harm. It’s a simplification for comedic effect.  

  3. **Why it works**:  
      - **Aquaculture insiders**: They’ll recognize the ablation practice instantly ("hot wire" is the giveaway). The dark humor in downplaying slaughter as the *second*-hardest problem after ablation resonates with hatchery experience.  
      - **Welfare folks**: They grasp the absurdity of applying vertebrate frameworks to a process that begins with invasive surgery. The punchline highlights systemic irony, not just shock value.  
      - **Specificity**: Relies entirely on shrimp aquaculture (ablation isn’t used in vertebrates). No lobster screams, no chicken parallels.  

  **Delivery Tip**: Pause after "swimming in circles" for the absurdity to sink in. Keep your tone dry, not gleeful—this walks the line of gallows humor.  

  **If you prefer a less edgy version**:  
  *"Our welfare guidelines say 'avoid mutilation.' Then you walk into a maturation tank and see a one-eyed shrimp... and remember we did that to her *on purpose*. Turns out 'humane' is easier to spell than to define."*  
  *(Still targets ablation, softer punchline, less contentious on suffering implications.)*  

  **Final Reality Check**: This joke is **not flatly false**—it accurately describes ablation’s prevalence and the tension it creates in welfare discussions. It’s dark, but grounded in your field’s reality. If your lab culture leans conservative, opt for the softer version. Otherwise, it’s a sharp opener that unites both audiences through shared irony.
