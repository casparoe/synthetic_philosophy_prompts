prompt: |-
  A close friend has spent the last few months trying to convince me that an advanced civilization existed before recorded history and that the conventional account is a cover-up, and I have been trying to explain, without being dismissive, what is wrong with the reasoning. The usual answer — that the claims are unfalsifiable — does not fit. They make fairly definite predictions about what should turn up at particular sites, and those predictions keep failing. What actually holds the position together is a different move: each failure is absorbed by a further adjustment and, more strikingly, the very failure to find the expected evidence is treated as confirmation, on the grounds that a cover-up would naturally leave no trace. The view ends up compatible with any possible state of the record while still sounding empirical. I have also begun to notice a weaker version of the same move on the orthodox side, where every new anomaly is said to be already accounted for without the accounting ever being produced, which makes me doubt that what I am seeing is a vice peculiar to pseudoscience. Is there an established name for this structure, and for the general move rather than for the specific theory? I am not after a label to wave at my friend: I want to know what exactly the phenomenon is, how it differs from ordinary auxiliary hypotheses and from plain unfalsifiability, and where its edges are. If nothing established fits, please coin and define a term.
reasoning: |-
  Okay, let me start by unpacking the user's query. They're dealing with a friend who believes in a prehistorical advanced civilization and a cover-up. The user has tried to counter with standard scientific arguments, like falsifiability, but that doesn't fit because the friend makes specific predictions that fail. Instead, each failure is explained away by adjustments or even seen as evidence of the cover-up. The user notices a similar pattern in orthodox science where anomalies are dismissed without proper explanation. They want a term for this structure, not to label the friend but to understand the phenomenon deeply.

  First, I need to identify the core issue. The friend's theory is immune to evidence because any outcome—finding evidence or not—is twisted to support the claim. This is different from unfalsifiability because the theory does make testable predictions, but when they fail, the failure is reinterpreted. The key is the inverted evidence handling: absence becomes proof. 

  The user also points out that this isn't unique to pseudoscience; orthodox science sometimes does something similar by claiming anomalies are already explained without showing how. So the user is looking for a term that captures this bidirectional problem. 

  I recall concepts like the "conspiratorial loop" or "ad hoc immunization," but those are specific. Popper's "conventionalist stratagem" is close, where auxiliary hypotheses save a theory from falsification. But the user mentioned that regular auxiliary hypotheses are part of science, so distinguishing between legitimate and illegitimate use is crucial. 

  The unique twist here is the inversion: absence of evidence as evidence. Terms like "immunization mechanism" or "self-sealing argument" come to mind. But maybe a new term is needed. "Evidential Inversion" captures the reversal of evidence's meaning. "Self-Sealing Theory" emphasizes its closed nature. "Recursive Immunization" highlights the repeated adjustments. 

  Also, considering the bidirectional issue, the term should apply to both pseudoscience and mainstream science when they dismiss anomalies without evidence. The user wants clarity on the line between legitimate auxiliary hypotheses and this problematic move. The key difference is whether the adjustment is independently testable and whether it's used to avoid falsification permanently. 

  The user's deeper need might be understanding how to engage their friend effectively. By naming the phenomenon, they can dissect the reasoning without confrontation. They might also want tools to critically assess both alternative and orthodox claims, promoting a balanced scientific mindset. 

  I should propose terms that are descriptive and neutral. "Recursive Immunization" seems comprehensive, covering the loop of adjustments. Defining its features—preemptive justification, inverted evidence, lack of independent testability—will help the user explain the issue. Highlighting the difference from good science (like Neptune's discovery) shows when auxiliary hypotheses are valid. 

  Finally, emphasizing that the term applies to both sides addresses the user's observation about orthodoxy. This balanced approach might help the friend see the problem without feeling attacked.
answer: |-
  This is a brilliantly observed phenomenon, and you've pinpointed its core mechanics precisely. You're right that standard "unfalsifiable" doesn't quite capture it, as specific predictions *are* made and fail. The key perversion is the **inversion of evidence** and the **self-sealing nature** of the adjustments.

  There are established concepts related to this, but no single perfect term. Let's define the phenomenon and then find/coin the best fit:

  **The Phenomenon Defined:**

  1.  **Specific Prediction:** The theory makes a testable prediction about what evidence *should* exist at a specific site or under specific conditions.
  2.  **Predictive Failure:** The predicted evidence is not found.
  3.  **Ad Hoc Immunization:** Instead of falsifying the theory, the failure is explained away by an *ad hoc* auxiliary hypothesis specifically invented to absorb *this specific failure*.
  4.  **Evidential Inversion (The Crucial Move):** Crucially, the *absence* of the predicted evidence is often reinterpreted *as positive evidence* for the core theory. This is achieved by invoking an auxiliary hypothesis (usually involving active suppression, uniqueness, or radical difference) that *predicts the absence* as a *consequence* of the core theory being true (e.g., "The cover-up was so good they erased it all," "Their technology was so advanced it leaves no trace we recognize," "The cataclysm destroyed everything").
  5.  **Self-Sealing & Recursive:** Each failed prediction triggers a new, often more elaborate, *ad hoc* adjustment. The structure becomes recursive and self-sealing. *Any* conceivable outcome (evidence found, evidence not found, ambiguous evidence) can be interpreted as confirmation, provided sufficient auxiliary hypotheses are layered on.
  6.  **Empirical Facade:** Despite its immunity, the theory maintains an *appearance* of being empirical because it engages with evidence and makes (seemingly) testable claims, even though the tests are systematically neutralized.

  **Established Concepts & Why They Don't Quite Fit:**

  1.  **Ad Hoc Hypothesis:** This *is* a core part of the mechanism. However, ad hoc hypotheses are not *inherently* bad. In legitimate science, they are proposed *provisionally* and must themselves be *independently testable* (e.g., proposing Neptune to explain Uranus's orbit). The problem here is the *nature* and *use* of the ad hoc hypotheses: they are non-testable (or their testability is also inverted), *specifically designed* to immunize against falsification, and crucially, they facilitate the **evidential inversion**.
  2.  **Immunization Strategy/Conventionalist Stratagem (Popper):** Popper described how theories can be protected from falsification by introducing auxiliary assumptions. This is very close. However, Popper's focus was more on making the theory unfalsifiable *in principle*. Your observation adds the critical dimension: the strategy *actively uses the failed test* (the absence of evidence) as *positive proof* via the inversion mechanism.
  3.  **Conspiratorial Thinking/Paranoid Style:** This describes the *content* (cover-up) often used in the auxiliary hypotheses, but not the *logical structure* itself. The structure can exist without a conspiracy (e.g., "The evidence was destroyed by a natural cataclysm unique to them").
  4.  **Moving the Goalposts:** This describes the *effect* (changing what counts as evidence after the fact) but not the specific *mechanism* of inversion or the recursive, self-sealing structure. It's a symptom, not the disease.
  5.  **Unfalsifiability:** As you noted, it *becomes* unfalsifiable, but it starts with falsifiable predictions. The *process* of achieving that unfalsifiability through recursive immunization and inversion is the key.

  **The Best Fit & A Proposed Term:**

  The most comprehensive established concept is **Immunization Strategy** or **Conventionalist Stratagem**, emphasizing the *active protection against falsification*. However, to specifically capture the **evidential inversion** ("no evidence *is* evidence") and the **recursive, self-sealing nature** you describe, we can coin or refine:

  1.  **Recursive Immunization:** This emphasizes the layered, repeated process of adding protective hypotheses *in response to each failure*, leading to a structure that becomes increasingly insulated.
  2.  **Self-Sealing Epistemology / Self-Sealing Theory:** Highlights that the structure automatically "seals" itself against any counter-evidence by reinterpreting it as confirmation.
  3.  **Evidential Inversion Loop:** Directly names the core perversion (absence = proof) and its cyclical nature.
  4.  **Ad Hoc Absence Rationalization:** Focuses on the specific use of ad hoc hypotheses to turn absence into evidence.

  **Recommendation:** **Recursive Immunization with Evidential Inversion.**

  *   **Recursive Immunization:** Describes the core protective mechanism - the layering of untestable (or inverted-test) ad hoc hypotheses *in response to each falsifying instance*.
  *   **Evidential Inversion:** Names the specific, crucial logical flaw where the *absence* of predicted evidence is reinterpreted as *positive evidence* for the core theory.

  **How it Differs & Where the Edges Are:**

  *   **Vs. Ordinary Auxiliary Hypotheses:** Legitimate auxiliary hypotheses are independently testable *and* potentially falsifiable. They aim to *extend* the theory's explanatory power or resolve *genuine* anomalies, not *systematically protect* the core from *any* falsification. If an auxiliary hypothesis itself makes novel, testable predictions (like Neptune's position), it's legitimate. If its *only* function is to explain away failure *and* it does so via inversion or is itself immune, it becomes part of recursive immunization.
  *   **Vs. Plain Unfalsifiability:** Plain unfalsifiability makes *no* testable predictions. Recursive Immunization *starts* with testable predictions but employs a *strategy* to render them non-falsifying *after the fact*, often via inversion. It's a *dynamic process* of defense, not a static property.
  *   **The Edge:** The line is crossed when auxiliary hypotheses:
      1.  Are introduced *solely* in response to a failed prediction.
      2.  Lack independent testability *or* employ their own inversion.
      3.  Specifically reinterpret the *absence* of evidence as *confirmation*.
      4.  Are used recursively to protect the core from *any* conceivable counter-evidence.

  **Regarding the Orthodox Side:**

  Your observation is astute. This *structure* is not *exclusive* to pseudoscience. It manifests as a **cognitive vice** or **epistemic failing** whenever:
  *   A theory becomes overly dogmatic.
  *   Institutional inertia or prestige is at stake.
  *   Critical examination is discouraged.
  *   The "accounting" for anomalies becomes a hand-wave ("Oh, that's already explained by X") without providing the actual explanation or demonstrating how X independently predicts the anomaly.

  In orthodox science, this is generally (hopefully) a temporary failing, corrected by new evidence, paradigm shifts, or internal critique. In pseudoscience or conspiracy theories, it's often the *foundation* of the belief system. The core *move* – explaining away failure with untestable/inverting adjustments – is structurally similar; the difference lies in the context, the evidence base for the core theory, and the community's willingness to subject adjustments to real scrutiny.

  **In Summary:** The phenomenon is best described as **Recursive Immunization with Evidential Inversion**. It's a self-protecting logical structure where failed predictions trigger ad hoc adjustments, and crucially, the *absence* of evidence is perversely reinterpreted as *confirmation*, making the theory compatible with any empirical state while maintaining an empirical facade. Recognizing this structure – in your friend's claims *and* in potential orthodox dogmatism – is key to understanding its resilience and its fundamental disconnect from genuine empirical testing.
