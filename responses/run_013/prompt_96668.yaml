prompt: |-
  I'm teaching a grad seminar on the unity of the proposition, and a student in it -- the kind who reads Bradley for fun -- has handed me an argument I can't get out of my head, mostly because I'm fairly sure it proves a lot more than he wants it to. He insists it's just Bradley's regress with the truth-theoretic stakes made explicit. Here it is, tidied up:

  (1) Any complex -- a proposition, a fact, a heap of stones, the world -- is either nothing over and above its constituents or something over and above them. (2) If it's nothing over and above them, it's a mere plurality, not one thing; and a proposition that isn't one thing isn't the sort of thing that can be true. (3) So a complex must be more than its constituents: there must be something that unifies them. (4) Whatever unifies them can't itself be one of the things unified, since if it were, the very same question would just arise again about it and the rest. (5) So the unifier is a further item that has to be combined with the others. (6) Combining is a relation, and a relation that relates its relata is one more item that has to be combined with them. (7) Repeat. No complex is ever finished being unified, and an unfinished unification isn't a unification at all. (8) So there are no complexes: no propositions, no facts, no wholes, nothing with parts. (9) But (8) refutes itself -- it's a proposition, with parts, offered as an argument, with steps, and it presupposes the very complexity it denies. (10) So something above has to go.

  What I'd like to keep, if I can: that propositions are genuinely one thing rather than secret pluralities (whatever that would even mean), and that at least some things are true. What I'm not willing to pay is the move where we just declare unification primitive and unanalyzable -- that's a promissory note, not a solution. So: which step do I reject, why did it look fine, and what does rejecting it cost me? I especially want to know whether (4) is doing something sneaky. I can't tell whether it's a genuine constraint or whether it quietly assumes that anything occurring in a complex occurs in it as one more constituent -- which is precisely what the multiple-relation people deny. If the fix needs a principled distinction between occurring as a term and occurring as relating, or Frege's unsaturatedness and the mess that comes with it when you try to say that the concept horse is not a concept, tell me what that distinction actually buys and where it starts to strain. And if the frame is wrong -- if this isn't really a proves-too-much argument so much as a reductio of a premise I'm smuggling in by even stating it this way -- say so instead of playing along; if my wanting to keep both unity and truth turns out to be incoherent, I'd rather hear that than get a tidy survey of the positions. Don't hedge at the end: tell me what you'd actually give up, and how confident you are that the alternatives are any cheaper. I've probably got a typo or two in the numbering, ignore that.
reasoning: |-
  Okay, let me start by unpacking this problem. The user is teaching a grad seminar on the unity of the proposition, and a student presented an argument based on Bradley's regress. The argument seems to prove too much—denying the existence of any complexes, which includes propositions, facts, etc.—but ends in a contradiction because the argument itself is a complex. The user wants to maintain that propositions are unified entities and that some things are true, without accepting unification as primitive. They suspect step (4) might be problematic and mention Frege's unsaturatedness as a possible solution.

  First, I need to understand the steps of the argument. Premise (1) sets up a dichotomy: a complex is either just its constituents or something more. Step (2) says if it's nothing over and above, it's a mere plurality, not a unity, so it can't be true. Step (3) concludes there must be a unifier. Step (4) claims this unifier can't be one of the constituents, leading to an infinite regress in steps (5)-(7). Step (8) concludes no complexes exist, which is self-refuting in step (9). Step (10) says something must be rejected.

  The user's main concerns are rejecting step (4) because it might assume that the unifier is just another constituent. They mention multiple-relation theorists and Frege's unsaturatedness. The key is whether the unifier can be part of the complex without being a separable constituent. Frege's idea is that concepts are unsaturated, meaning they inherently relate to objects without needing an external relation. This avoids the regress because the relation isn't a separate entity that needs combining.

  But applying unsaturatedness to propositions raises issues. For example, in "Socrates is mortal," "is mortal" is unsaturated, binding Socrates without an additional relator. But propositions themselves, as wholes, need unity. If we treat propositions as structured entities with saturated and unsaturated components, maybe that works. However, higher-order unities might still cause problems, like with quantifiers or complex predicates.

  The user also wants to avoid promissory notes, so they need a principled distinction between occurring as a term vs. as relating. Frege's approach provides that, but leads to paradoxes like "the concept horse is not a concept." So, there's a cost here. Alternatively, rejecting step (2) might be possible. If a complex is nothing over its parts but still unified, perhaps through internal relations or structure. But that might not satisfy the need for a unified truth-bearer.

  Another angle: maybe the argument is a reductio of the initial dichotomy in premise (1). If complexes are neither identical to nor distinct from their parts, but something else, that could avoid the regress. But how to articulate that without mystery? Process ontology or systems theory might help, but that could be too vague. 

  The user emphasizes not hedging, so I need to pick a clear path. Rejecting step (4) by adopting unsaturatedness seems the most viable. The cost is Frege's paradox and the awkwardness of higher-order unities. But it maintains unity and truth. Rejecting step (2) is another option, but it risks making unity primitive. The user prefers a solution that doesn't just declare unification unanalyzable. 

  Also, the self-refutation in step (9) shows that denying complexes is impossible. So, the argument must be flawed. The critical point is step (4)'s assumption that the unifier must be a constituent. If the unifier is the way constituents are arranged or the relational structure itself, not an additional part, then regress stops. This requires a robust theory of predication where relations are non-relational entities. 

  In summary, rejecting step (4) by distinguishing between constituents and the manner of combination (via unsaturatedness) is the best bet. The cost is dealing with Frege's issues and potential complexities in higher-order logic, but it's a workable solution that meets the user's main goals.
answer: |-
  Here’s my no-hedges verdict: **Reject step (4)**. It smuggles in the assumption that whatever "unifies" must itself be *a constituent* (i.e., an *object-like entity*) within the complex it unifies. This is the core error, and rejecting it costs you the need for a robust, non-mysterious theory of *non-object-like* aspects of structure (like Fregean unsaturatedness or something analogous). You *can* keep propositions as unified truth-bearers and truth itself, but you *must* abandon the idea that unification is accomplished by adding more *things*.

  Here's the breakdown:

  1.  **Why Step (4) is the Sneaky Culprit:** Step (4) states: *"Whatever unifies them can't itself be one of the things unified..."* This assumes:
      *   That the unifier *could* potentially be "one of the things unified" (i.e., a constituent).
      *   That if it were such a constituent, it would be *just another relatum* needing unification with the others.
      *   Crucially, it assumes that *anything* playing a role in the complex *must* play that role *as a constituent object* within the complex.

      This is precisely what theories like Frege's deny. Step (4) is not a neutral observation; it *presupposes* a specific (and problematic) ontology where everything is fundamentally object-like ("saturated"). It blocks the possibility of *non-object-like* elements (unsaturated relations, concepts, modes of combination) from the start.

  2.  **What Rejecting (4) Buys You (Frege's Gambit):**
      *   **The Distinction:** You introduce a fundamental ontological distinction between *objects* (saturated entities, "terms") and *concepts/relations* (unsaturated entities). An unsaturated entity isn't "a thing unified" alongside objects; it *is* (part of) the unification itself. Its nature is *incomplete* or *gappy*; it inherently *demands* saturation by objects to form a whole.
      *   **Stopping the Regress:** In "Socrates is mortal," "Socrates" (an object) saturates one gap in the concept "__ is mortal" (an unsaturated entity). The *combination* isn't achieved by adding a *third thing* (a saturated relation) that relates Socrates to mortality. The unsaturated concept "__ is mortal" *itself* is the combinatorial principle. Its unsaturatedness *is* its relating function. There's no further "thing" (a saturated relation) that needs to be "combined" with Socrates and mortality, because the complex *is* the saturation of the concept by the object. Step (6) ("Combining is a relation...") simply doesn't apply; combining isn't *effected by* a saturated relation; it *is* the saturation of an unsaturated one.
      *   **Unity & Truth:** The proposition is genuinely one thing – the saturated complex. Its unity comes from the unsaturated entity binding the saturated ones. This unity allows it to be truth-evaluable; it presents a state of affairs.

  3.  **What Rejecting (4) Costs You (The Fregean Price):**
      *   **The Concept Horse Problem:** You cannot coherently talk *about* unsaturated entities (like "__ is mortal") as if they were objects. Saying "The concept __ is mortal is unsaturated" is strictly speaking nonsense or category-mistaken on Frege's view, because "the concept __ is mortal" tries to name the concept as an object, stripping it of its unsaturatedness – the very feature essential to its unifying role. This creates severe expressive limitations in the meta-language.
      *   **Higher-Order Unity Strains:** While simple subject-predicate unity is handled elegantly, higher-order unities (quantification, propositional attitudes, complex predicates) become deeply challenging. What unifies "∀x(Fx)"? Is the quantifier unsaturated? What saturates it? Is "Fx" an object or unsaturated? Explaining the unity of *that* complex without regress or paradox requires elaborate (and often contentious) type hierarchies or other mechanisms. The simplicity of the basic distinction starts to fray under higher-order pressure.
      *   **The "Mystery" Charge (Even If Unfair):** Critics will argue unsaturatedness is just a label for the problem ("How *does* the unsaturated bit bind the saturated bits?") masquerading as a solution. You need to bite the bullet and insist unsaturatedness *is* the primitive, non-object-like mode of being that explains combination. While it stops the regress by rejecting the "more constituents" assumption, it *does* make unification primitive and unanalyzable *in terms of object-like entities*. It replaces the regress with a brute ontological category. This is the cost of avoiding both step (4)'s assumption *and* declaring unification primitive *simpliciter* – you declare a *specific kind* of primitive entity whose nature *is* unification.

  4.  **Why the Alternatives Are Worse (For Your Goals):**
      *   **Rejecting (2) ("Nothing over and above = mere plurality"):** This saves complexes but risks making them "secret pluralities" or heaps. How is a heap "one thing"? How can a mere plurality be true? This feels like abandoning the core motivation for unity. Defending it requires a strong mereological or structuralist view where "nothing over and above" doesn't imply mere plurality, but explaining *how* without smuggling in something like unsaturatedness or structure-primitives is tough. It might ultimately collapse into the Fregean position or a different primitive.
      *   **Rejecting the Whole Frame (Dichotomy in (1)):** While tempting ("complexes are neither identical to nor distinct from their parts!"), this often leads either to obscurity (Hegelian/Bradleyan absolute where distinctions collapse) or back to needing something *like* unsaturatedness to articulate the "third way". It doesn't provide a clearer path to satisfying your desire for non-primitive unity than Frege does.
      *   **Embracing Primitive Unification (No Analysis):** This explicitly gives up on your constraint ("not willing to pay... promissory note"). It stops the regress by fiat at step (3) or (4). While consistent, it leaves the *how* of unity completely unexplained. If you find this unsatisfying (as you stated), Frege's unsaturatedness is at least a *structured* primitive that offers a *model* for how unity arises from ontological category differences.
      *   **Accepting the Conclusion (8) & Living with (9):** Incoherent. The argument *is* performatively self-refuting. You literally cannot coherently assert it.

  **My Bottom Line (What *I'd* Give Up):**
  I'd reject step (4) and pay the Fregean price. I'd accept unsaturatedness (or a close analogue like a fundamental distinction between relata and relations-as-combinators) as a primitive ontological category necessary to halt the regress and ground unity. I'd grit my teeth through the "concept horse" problem, treat it as a limitation of *talking about* the framework *within* a language built on object-reference, and build elaborate type theories to handle higher-order unity as best as possible. The cost is real (expressive limits, higher-order complexity, accepting a combinatorial primitive), but it's the cheapest way to keep propositions genuinely unified, truth-apt, and avoid both the regress *and* declaring unification primitive *without structure*.

  **Confidence Level:** Moderately High (~75%). Bradley's regress genuinely exposes a deep problem for *constituent* ontologies. Frege's unsaturatedness is the most developed and principled way to block it at step (4) while preserving unity. The alternatives either sacrifice unity/truth (accept heaps), embrace mystery (primitive unification *simpliciter*), or lead down obscure paths that might circle back. The cost of Frege's solution is significant but arguably necessary and less damaging to your core goals than the alternatives. Step (4) is indeed the quiet engine driving the whole destructive regress by assuming everything is a saturated constituent. Reject *that* assumption forcefully.
