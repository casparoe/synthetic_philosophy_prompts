prompt: |-
  I'm a junior in high school writing a long paper for an ethics seminar that I hope to expand into my senior thesis, and my teacher has let me focus on just war theory. I've gotten stuck on the doctrine that soldiers on both sides of a war are morally on a par — that a soldier conscripted into an unjust aggression has the same right to kill, and is no more blameworthy for killing, than a soldier defending against him. I've read enough to know this is usually called the moral equality of combatants, and that it gets defended both as a legal convention, since lawful combatants on either side enjoy immunity from prosecution for killing in accordance with the laws of war, and as a moral truth in its own right; some philosophers I've encountered even argue the doctrine is simply false, because an unjust combatant is doing something impermissible regardless of what the law says. The trouble is that when I press on it, the arguments keep splitting into several quite different questions and I can't tell which ones are actually doing the work. Some people frame it as a question about permissions — whether both sides are permitted to kill — while others frame it as a question about liability, meaning whether both sides deserve to be killed or blamed; some say the whole dispute is downstream of whether you assess a war by its cause or by how it is fought; and still others think the interesting question is what the doctrine is for — military discipline, reciprocity between armies, the protection of civilians, or keeping law and morality from collapsing into one another. I've also noticed that veterans and the writers who discuss moral injury describe guilt in ways that don't look symmetric at all, which makes me wonder whether the equality is a truth about morality or a useful fiction that the practice of war happens to require.

  What I want from you is not a survey but a defended agenda. Which of the open questions in this area is most worth settling first, in the sense that the most other questions depend on its answer, and which are comparatively idle or overrated? Please rank something like four or five candidate questions, state the criteria you're using — importance, how many downstream claims rest on the answer, whether a high school student with a year and a library card could actually make progress on it, and whether the answer would change anything for international law, for how soldiers are trained, or for how veterans are treated afterward — and tell me which of my framings above is a genuine crux and which is a distraction. I'd rather have your reasoning about the ordering than a reading list, and I'd like to know what evidence or argument over the next year would move a question up or down your ranking.
reasoning: |-
  Okay, the user is a high school junior working on a just war theory paper that'll become their senior thesis. They're stuck on the moral equality of combatants doctrine. They've noticed the arguments split into different questions—permissions vs. liability, cause vs. conduct, the purpose of the doctrine—and want to know which question is most central to tackle first. They want a prioritized list based on importance, dependencies, feasibility, and real-world impact.

  First, I need to unpack why they're overwhelmed. They've encountered multiple philosophical angles but can't see the hierarchy. Their deeper need is to find a manageable research focus that clarifies the bigger picture without getting lost in complexity. Since they're a high schooler, feasibility matters—they need something accessible with a library card. Also, they hint at veterans' moral injury, suggesting they care about human impacts beyond theory.

  The core tension is between legal convention and moral truth. The doctrine's defenders (like McMahan) say it's legally useful but morally false, while others (Walzerians) see symmetry as pragmatically necessary. The user’s observation about veterans' asymmetric guilt challenges the doctrine’s realism. That’s probably where the stakes are highest: if soldiers feel moral asymmetry, does that undermine the doctrine’s practical or ethical basis?

  Next, ranking the questions. The top priority should be the one that unlocks others.  
  - **Q1 (Permission vs. Liability)** seems foundational because it defines the entire conflict: if unjust combatants lack moral permission to kill, the doctrine collapses unless justified by other factors (like necessity). This affects Q2 (cause vs. conduct) and Q4 (purpose).  
  - **Q2 (Cause vs. Conduct)** is second because it’s a major philosophical split. If ad bellum justice affects in bello rules, the equality doctrine weakens. But this depends on Q1’s answer—if permissions are tied to liability, cause matters more.  
  - **Q4 (Purpose of the Doctrine)** is third because it’s where law and morality intersect. If the doctrine is purely functional (e.g., protecting civilians), that might excuse moral asymmetries. This is feasible for the user to research via historical cases (e.g., how reciprocity works in real wars).  
  - **Q3 (Moral Injury Evidence)** is fourth. While powerful for challenging the doctrine’s realism, it’s more empirical. The user could analyze veteran testimonies but might lack psychology expertise. Still, it’s crucial for showing why the doctrine might be a "useful fiction."  
  - **Q5 (Law-Morality Distinction)** is last. It’s abstract and derivative; once Q1-4 are addressed, this resolves naturally.  

  For feasibility: Q4 is most accessible (historical documents), Q3 is doable (memoirs/interviews), Q1-2 require harder philosophy but are essential. The user should start with Q1—grappling with McMahan vs. Walzer—then use that lens for the others.  

  Impact-wise: If Q1 shows moral equality is indefensible, it pressures legal reforms (e.g., holding aggressors accountable). Q3’s evidence could change veteran therapy by validating asymmetric guilt.  

  Distractions: Framing this as *only* about "cause vs. conduct" oversimplifies; the real crux is whether conduct can be judged independently when cause is unjust (Q1). Similarly, fixating on "law vs. morality" (Q5) before Q1-4 is putting the cart before the horse.  

  The user should focus on Q1 first. Reading McMahan’s critiques and Walzer’s defenses would clarify permissions/liability. If they find that unjust combatants *are* morally liable, the doctrine’s functional purpose (Q4) becomes critical to explore next. Veteran accounts (Q3) can then test if real-world psychology aligns with theory.
answer: |-
  Your frustration with the splintering of arguments is astute—this is precisely why the moral equality of combatants (MEC) remains a live wire in just war theory. Below is a defended ranking of the core questions, ordered by their *architectural significance*: which questions, if resolved, would collapse or reconstruct the most dependent claims. I prioritize **conceptual priority** (does answering this unlock others?), **practical impact** (does it affect law, training, or veteran care?), and **feasibility** for your research context. Crucially, **#1 is non-negotiable as a starting point**—it's the keystone holding up the entire debate.

  ### Ranking Criteria
  1. **Conceptual Leverage**: How many downstream disputes depend on this?  
  2. **Practical Consequences**: Would clarity here reshape law, military ethics, or veteran support?  
  3. **Research Accessibility**: Can a motivated high schooler make headway with libraries/databases?  
  4. **Avoiding Distractions**: Does the question isolate a genuine crux or muddy priorities?

  ---

  ### Ranked Questions (with Distractions Called Out)
  1. **Are combatants on unjust and just sides *equally permitted* to kill enemy soldiers?**  
     - **Why #1**: This is the core *moral* claim of MEC. If permissions are symmetric, liability (#2) and purpose (#4) become secondary. If asymmetric, MEC collapses as a moral truth.  
     - **Leverage**: Resolving this forces engagement with causality (#3) and exposes whether legal equality is pragmatic or principled. McMahan’s reductio is decisive here: *If a civilian may kill a criminal aggressor in self-defense, why may a soldier not kill an unjust combatant?* If the answer is "because soldiers are agents of war," you’ve conceded MEC rests on role-based conventions, not morality.  
     - **Feasibility**: High. Engage primary sources: Walzer’s *Just and Unjust Wars* (Chapter 4) vs. McMahan’s *Killing in War*. Track their disagreement on whether soldiers "consent" to mutual risk.  
     - **Impact**: Undermines MEC’s moral basis if disproven, pressuring international law (e.g., prosecuting aggression) and training (e.g., emphasizing moral discernment).  
     - **Evidence to Track**: Historical cases of soldiers refusing unjust orders (e.g., WWI conscientious objectors). If their refusal is seen as morally *required*, MEC weakens.  

  2. **Does *ad bellum* injustice (the unjust cause) automatically render *in bello* actions (conduct in war) morally impermissible?**  
     - **Why #2**: This determines whether the "independence thesis" (that *jus in bello* can be judged separately from *jus ad bellum*) is defensible. If not, MEC fails—unjust combatants *cannot* fight "cleanly."  
     - **Leverage**: Shapes #1 (permissions) and #4 (MEC’s purpose). If independence is false, MEC is purely a legal fiction.  
     - **Feasibility**: Medium. Analyze conflicts where *ad bellum* was dubious but *in bello* strict (e.g., U.S. in Iraq 2003 vs. ISIS). Philosophers like David Rodin challenge independence; Jeff McMahan defends conditional independence.  
     - **Impact**: Affects military training—should soldiers question missions?—and international law (e.g., should POW status depend on *ad bellum* justice?).  
     - **Evidence to Track**: Post-WWII tribunals: German soldiers were tried for war crimes but not *merely* for fighting (implying independence). Does this reflect morality or pragmatism?  

  3. **Do veterans’ experiences of *moral injury* reveal an asymmetry in blameworthiness?**  
     - **Why #3**: Empirical evidence here directly challenges MEC’s descriptive plausibility. If soldiers on unjust sides report deeper guilt, MEC’s moral claim (not just its legal function) is suspect.  
     - **Leverage**: Tests whether MEC’s symmetry is psychologically tenable. If moral injury correlates with *ad bellum* injustice, it supports linking #1 and #2.  
     - **Feasibility**: High. Accessible sources: memoirs (e.g., Karl Marlantes’ *What It Is Like to Go to War*), studies by Shay or Litz on moral injury. Compare testimonies from "aggressor" vs. "defender" veterans (e.g., Soviet Afghan War vs. Finnish Winter War vets).  
     - **Impact**: Could reform veteran therapy (e.g., validating asymmetric guilt) and challenge "warrior codes" that enforce moral blindness.  
     - **Evidence to Track**: Interviews/polls on guilt levels among veterans of controversial wars (Vietnam, Iraq) vs. defensive wars (e.g., Ukraine 2022–present).  

  4. **Is MEC primarily a *functional* doctrine to protect civilians and ensure reciprocity?**  
     - **Why #4**: If MEC is merely pragmatic, its moral claims are secondary. But this depends on #1–3. If MEC isn’t morally true, *why* adopt it?  
     - **Leverage**: Resolving #1/#2 dictates whether this is a necessary compromise (McMahan) or a moral error.  
     - **Feasibility**: High. Examine ICRC documents and laws of war (e.g., Geneva Conventions). Does reciprocity *actually* protect civilians? Case study: Syria’s war, where collapsed reciprocity led to indiscriminate attacks.  
     - **Impact**: Justifies or undermines MEC’s legal status. If functional, reforms could target reciprocity mechanisms (e.g., stronger war crime tribunals) without rejecting MEC.  
     - **Evidence to Track**: Conflicts where reciprocity failed (e.g., WWII Eastern Front) vs. where it held (e.g., Desert Storm). Did MEC help or hinder civilian protection?  

  5. **Does collapsing the law-morality distinction in war create dangerous chaos?**  
     - **Why Last**: This is a meta-question that presupposes answers to #1–4. If MEC is morally false (#1), we *should* seek alignment (e.g., via law reform). If functionally vital (#4), divergence is necessary.  
     - **Leverage**: Minimal—depends entirely on prior answers.  
     - **Feasibility**: Low (too abstract for your scope).  
     - **Impact**: Theoretical; unlikely to change practice soon.  

  ---

  ### Distractions in Your Framings
  - **Genuine Crux**:  
    - **Permissions vs. Liability**: This is *vital* and integrated into #1. If unjust combatants lack permission to kill, they may be liable to defensive harm—but not necessarily "deserving" of blame (e.g., conscripts). This distinction drives McMahan’s critique.  
  - **Overrated Distractions**:  
    - **"Cause vs. Conduct" as a standalone frame**: It’s subsumed under #2. The real issue isn’t the dichotomy but whether they *can* be separated.  
    - **"What the doctrine is for" without moral grounding**: Purpose (#4) only matters after addressing #1. Otherwise, you risk justifying immorality for pragmatism.  

  ---

  ### Strategic Recommendation  
  Start with **Question 1 (Permissions)**. It’s the linchpin: if permissions are asymmetric, MEC is morally dead, and you’ll expose its legal/pragmatic function (#4) as a necessary evil. If symmetric, you’ll defend it as a moral truth. **Evidence to gather**:  
  - **Philosophical**: Does McMahan’s self-defense analogy hold? Study domestic laws on defense against aggressors.  
  - **Historical**: How have societies judged soldiers of defeated/unjust regimes (e.g., Confederates in the U.S., Nazis post-1945)?  
  - **Legal**: Do the Geneva Conventions *assume* moral equality or merely *stipulate* legal parity?  

  With a year, you can:  
  1. Dissect 2–3 key philosophers (Walzer, McMahan, Fabre).  
  2. Analyze 1–2 historical cases (e.g., Vietnam protests vs. Gulf War support).  
  3. Review moral injury studies to test asymmetry.  

  **If you prove permissions are asymmetric**, you’ve destabilized MEC’s core—making your thesis a weapon against complacency in military ethics. If not, you’ll force its defenders into pragmatic concessions. Either way, you cut to the heart of war’s morality.
