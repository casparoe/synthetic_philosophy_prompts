answer: |-
  ### Death Determination Procedure for On-Call Intensivist  
  **Backbone:** Confirm irreversible cessation of circulatory/respiratory function **or** irreversible cessation of all brain/brainstem function using legally mandated criteria and tests—irreversibility is the anchor, not clinical intuition.  

  ---

  #### Step-by-Step Procedure:  
  1. **"Is the patient meeting *all* clinical criteria for brain death with confirmatory testing completed per hospital protocol?"**  
     - *Sufficient Answer:* Yes (proceed to declare brain death) **or** No (go to Step 2).  
     - *Tests Required:*  
       - Absent brainstem reflexes (pupillary, corneal, oculovestibular, gag).  
       - Apnea test demonstrating no respiratory drive with PaCO₂ ≥60 mmHg.  
       - Confirmatory test (EEG, angiogram, or SPECT) showing no intracranial blood flow/activity if required by policy.  
     - *Handoff:* If family disputes legal death despite positive testing, pause declaration and call ethics committee.  

  2. **"Is there complete cessation of spontaneous circulatory and respiratory function *without* artificial support?"**  
     - *Sufficient Answer:* Yes (go to Step 3) **or** No (go to Step 4).  
     - *Tests Required:*  
       - Absent pulses, heart sounds, and breath sounds on auscultation for ≥5 minutes.  
       - Confirmatory ECG flatline (no P/QRS/T waves) and arterial line flutter (if present).  
     - *Irreversibility Note:* This step assesses *cessation*, not irreversibility—irreversibility is addressed next.  

  3. **"Is the cessation of function *irreversible* given the clinical context?"**  
     - *Sufficient Answer:*  
       - **Not on life-sustaining tech:** Yes (declare circulatory death) *if* no CPR attempted or efforts failed.  
       - **On life-sustaining tech (e.g., ECMO, ventilator):** Only if support is withdrawn AND cessation persists beyond autoresuscitation potential (see Step 4).  
     - *Handoff:* If family demands continued support despite irreversible cessation, notify ethics committee—death declaration proceeds, but conflict requires mediation.  

  4. **"Is the patient on technology artificially replacing circulatory/respiratory function (e.g., VA-ECMO, ventilator)?"**  
     - *Sufficient Answer:*  
       - **No:** Return to Step 3.  
       - **Yes:** Death **cannot** be declared until support is withdrawn AND irreversible cessation is confirmed post-withdrawal. Irreversibility is *not* inferable while on support.  
     - *Test Required:* Withdraw support per protocol → observe for autoresuscitation (typically 2–10 minutes).  
     - *Hospital Convention Alert:* "Irreversibility" during DCD standoff periods relies on institutional policy, not biology.  

  ---

  #### Case Applications:  
  **Case 1: VA-ECMO Patient with No Intrinsic Cardiac Activity**  
  - Step 1: No (not brain death).  
  - Step 2: No (ECMO artificially maintains circulation).  
  - Step 4: Support must be withdrawn to test irreversibility.  
  - **Outcome:** **Not dead** until ECMO is weaned AND cardiac activity remains absent ≥5 minutes post-wean. *Family/nurses may hate this—ECMO obscures irreversibility.*  

  **Case 2: DCD Donor at 5-Minute Standoff**  
  - Step 1: No.  
  - Step 2: Yes (cessation confirmed).  
  - Step 3: Irreversible *by hospital protocol* (5-minute standoff).  
  - **Outcome:** **Dead.** *Irreversibility is a legal/social contrivance here—no biological basis for 5 minutes vs. 2.*  

  **Case 3: Persistent Vegetative State (PVS) with Family Claiming "Already Gone"**  
  - Step 1: No (PVS ≠ brain death; brainstem intact).  
  - Step 2: No (respiratory function intact).  
  - **Outcome:** **Not dead.** *Procedure stops—death declaration legally impermissible. Ethics committee must address goals-of-care conflict.*  

  ---

  #### What This Procedure Cannot Settle & Dead-End Protocol:  
  - **Cannot Settle:**  
    - Requests to *withdraw life support* (vs. declaring death).  
    - Disputes over prognosis in severe brain injury without brain death.  
    - Demands to prolong support after irreversible cessation (e.g., family insisting ECMO continue post-declaration).  
  - **Dead-End Resolution:**  
    - If irreversibility is contested (e.g., ambiguous testing) OR legal conflict arises (e.g., family lawsuit threat):  
      → **Halt.**  
      → **Require two attending physicians** to sign concurrence with findings.  
      → **Immediately escalate to ethics committee chair and hospital legal counsel.**  
    - Death declaration **must not proceed** without dual signatures in dead-end scenarios.  

  **Final Note:** Irreversibility is a legal determination masquerading as a biological one in DCD/ECMO cases. Your policy *is* the criterion—own that.
