          Whereas a Keynesian would say in Q5: No, both cannot be rational because the evidence determines a single (though maybe imprecise) evidential relation. 
          So they would go to Q6 and then to Leaf 1.

          Therefore, they are separated.

     - Knightian uncertainty and Keynesian with low weight might be similar, but in the tree, they are separated by the answer to Q6: 
          Can we assign an objective probability (even imprecise) with sparse evidence? 
          Keynes: Yes (so go to Leaf 1)
          Knight: No (so go to Leaf 4)

     So the tree should work.

     We'll present it as a decision tree on the handout.

     Example path for Keynes:
