     Example path for Deflationary:
          Q1: No -> Q3: tools for making decisions -> Leaf 5

     We'll draw this as a tree in the handout.

     Let me write the questions again for clarity:

     Q1: For a unique event, is a probability assignment (like "70% chance") an objective fact (true or false independently of anyone's beliefs)?
          Yes -> Q2
          No -> Q3

     Q2: Is this objective fact primarily about the world or about the evidence?
          About the world -> Q4
          About the evidence -> Q5

     Q3: What is a probability assignment?
          Reports of my personal degree of belief -> Leaf 2 (Subjectivist/Bayesian)
          Tools for making decisions (only facts are about actions) -> Leaf 5 (Deflationary)
          Indications that the event is uncertain and not quantifiable -> Leaf 4 (Knightian)

     Q4: For a biased coin (bias unknown), can you assign a probability (other than 0.5) to heads?
          Yes -> Leaf 3 (Frequency/Propensity)
          No -> Leaf 4 (Knightian)

     Q5: Given the same evidence, can two people with different probability assignments both be rational?
          Yes -> Leaf 2 (Subjectivist/Bayesian)
          No -> Q6

     Q6: With very sparse evidence, is it still possible to assign an objective probability (even if not a precise number)?
          Yes -> Leaf 1 (Keynes)
          No -> Leaf 4 (Knightian)

