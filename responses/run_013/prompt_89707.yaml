  Okay, the user is a former public defender turned philosopher preparing for a keynote at a law-and-neuroscience workshop. They've outlined a thesis distinguishing two types of free will: a "thin" capacity for reasons-responsiveness relevant to legal responsibility, and a "thicker" self-authorship capacity tied to authenticity. Their goal is to show neuroscience challenges only the latter while leaving legal foundations intact.

  Hmm, the audience composition is crucial here - mostly criminal law scholars (tacit retributivists skeptical of neuroscience hype), plus two philosophers (one hard determinist) and a neuroscientist sensitive to being instrumentalized. This creates layered tensions: The legal scholars will care about preserving blameworthiness, the hard determinist will attack the thin capacity, and the neuroscientist will resist reductive interpretations of their work.

  The Q&A prep needs to prioritize by damage likelihood. Top threats would be:
  1. The hard determinist denying any meaningful reasons-responsiveness under determinism (directly attacks the thin will's foundations)
  2. The neuroscientist objecting to oversimplification of volition studies (undermines credibility with empirical experts)
  3. Legal scholars fearing slippery slopes if neuroscience erodes retributivism (threatens practical buy-in)

  For the "hoped nobody asks" entry, the deepest worry is whether the thick/thin distinction merely dodges the metaphysical debate - a meta-objection that could reframe the entire argument as semantic evasion. 

  The user's history as a public defender suggests they'll value concrete examples over abstraction. Replies should anchor to legal practice (e.g., "We already accept diminished responsibility in addiction cases without abandoning blame entirely") while acknowledging philosophical limits ("I concede neuroscience may complicate our experience of agency, but the law's operational criteria remain intact").

  Least confident point is the reply to slippery slope concerns. While conceptually sound to say "courts already handle gradations," rising neurolaw evidence might indeed pressure retributive foundations - a tension worth flagging for the user.
