  Below is your Q&A prep sheet, ranked by likely damage and probability. Replies are coded: **Concede** (acknowledge validity), **Hold** (defend position), **Split** (reframe/distinguish), **Deflect** (redirect).

  | Rank | Who Raises It               | Objection (Phrased Authentically)                                                                                                                                 | Two-Minute Reply                                                                                                                                                                                                                                                                                                                                                                 | Soft Spot?                            | Strategy |
  |------|-----------------------------|-------------------------------------------------------------------------------------------------------------------------------------------------------------------|----------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------|---------------------------------------|----------|
  | 1    | Hard Determinist Philosopher | "You claim 'thin' free will survives neuroscience, but if every decision is causally determined by neural processes, how can *any* responsiveness to reasons be 'free'? Isn't this just dressing up compatibilism in a lab coat?" | "You're right that determinism challenges *libertarian* freedom. But the law doesn’t require contra-causal freedom—it requires *practical* agency. The 'thin' capacity is about whether the defendant could recognize and act on legal/reasons (e.g., 'Put the gun down!'). Neuroscience shows *how* this works mechanistically, not that it’s *absent*. Blame tracks dysfunction in this system (e.g., psychosis), not metaphysics." | Conflates mechanism with absence of capacity. | Hold     |
  | 2    | Neuroscientist              | "You’re using neuroscience as a prop again! My fMRI studies on volition don’t map onto either of your 'free wills.' You’re forcing messy data into philosophical categories."                                                       | "Fair critique—I concede neuroscience *alone* can’t define these capacities. My argument relies on your field to show *constraints* (e.g., addiction’s neural loops eroding 'thick' self-authorship). I’m not claiming you’ve *measured* free will, but that your work *informs* when cognitive systems relevant to responsibility are compromised. Let’s collaborate on better frameworks." | Overclaims neuroscience’s role.       | Concede/Split |
  | 3    | Criminal Law Scholars       | "If neuroscience kills 'thick' free will, won’t it erode retributivism in practice? Jurors hearing 'his brain made him do it' will abandon desert, whatever you say about 'thin' capacity."                                        | "History suggests otherwise. We already accept mitigation (e.g., insanity, duress) without collapsing retributivism. The 'thin' capacity sets the *floor* for blame: if you can grasp 'this is wrong + prison awaits,' you’re responsible. Neuroscience clarifies *why* some fail this test (e.g., severe addiction), but won’t erase the core intuition: 'You knew better.'" | Underestimates jury’s vulnerability to neuro-reductionism. | Hold     |
  | 4    | Criminal Law Scholars       | "Why bifurcate free will? Courts handle responsibility holistically. Splitting it feels like a philosopher’s dodge to save blame while conceding everything else."                                                                | "Because confusion *causes* practical errors. E.g., we deny parole to addicts who show 'thin' responsibility (they understand rules) but lack 'thick' self-control—futilely demanding what neuroscience says may be impossible. Clarity lets us blame *appropriately* (thin) while reforming sentencing to target capacity-building (thick). It’s pragmatic, not dodging." | Risks making legal tests *more* complex. | Split    |
  | 5    | Philosopher of Mind         | "Your 'thick' free will sounds like a romantic fiction. If it’s unscientific and legally irrelevant, why keep it? Isn’t this just mourning a myth we’re better off without?"                                                         | "It’s existentially vital—not legally, but *personally*. Regret and pride presuppose 'I authored this.' Losing that *feels* catastrophic, even if the law doesn’t care. We shouldn’t gaslight people into pretending neuroscience doesn’t alter their self-conception. My point is: the law rests on sturdier ground ('thin') than identity ('thick')." | May seem dismissive of existential concerns. | Hold     |
  | **?** | **Anyone** | **"Isn’t your 'thin' capacity just a circular legal fiction? You define it as 'what justifies blame,' then say blame is justified by it. How is this not question-begging?"** | "It’s *operational*, not circular. We empirically observe that humans *can* adjust behavior to reasons (e.g., deterrence works). The law institutionalizes that observation. Neuroscience might *explain* the mechanism, but it doesn’t invalidate the observation—unless you think *all* responsiveness is illusion (which even determinists don’t claim)." | Depends on accepting pragmatic legal foundations. | Hold |

  **Final Row: The Objection You Hope Nobody Asks**  
  | ?    | Neuroscientist or Philosopher | "If 'thick' self-authorship is scientifically doomed, why do *you* feel responsible for this speech? Isn’t your own conviction that *you* authored this argument proof against your thesis?" | **Reply:** "Brilliant point—I *do* feel like the author, and that’s the tension! Neuroscience may show this feeling is post-hoc confabulation (e.g., Libet). I’d split it: the *feeling* is real (and precious), but its *accuracy* is what’s threatened. I’m not immune to the illusion. But notice: even if my 'thick' will is fake, my 'thin' capacity isn’t—I revised this talk based on your critiques!" **Strategy:** Split/Concede |

