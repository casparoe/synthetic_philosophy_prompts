answer: |-
  ## The Question
  **Exam Question (90 minutes):**  
  "Consider an AI system trained on biased historical data to predict loan defaults. Its reports (e.g., "Applicant X has 70% default risk") are always *honest* reflections of its internal calculations. However, its predictions systematically underestimate risk for Group A and overestimate it for Group B due to biased training data.  
  (a) Distinguish clearly between: (i) the model's *report* about an applicant's default risk, (ii) the model's *behavioral disposition* (e.g., whether it would approve/deny the loan based on its threshold), and (iii) the *knowledge encoded in its internal representations* (e.g., patterns in its hidden layers). (7 marks)  
  (b) Explain why a perfect "lie detector" confirming report honesty is *insufficient* for recovering unbiased truth about actual default risk. (5 marks)  
  (c) Design an elicitation method to recover truth-tracking knowledge about *real* default risk from this honest-but-biased model. Your method must *not* presuppose the true causal factors determining default risk. Further, explain how your method could distinguish between the model (i) *lacking knowledge* of the true causal factors and (ii) *possessing* that knowledge but being *unable to express it faithfully* in its reports or actions due to architectural/algorithmic constraints. (8 marks)"

  ---

  ## Model Answer (approx. 700 words)  

  **(a) Distinction:**  
  (i) The model's **report** is its explicit output – the verbal or numerical prediction it provides (e.g., "70% default risk"). This is a specific proposition derived from its internal state for a given query.  
  (ii) The model's **behavioral disposition** refers to its potential actions or responses given its internal state *and* its operational context. Here, it’s the action the model would trigger if connected to a loan decision system (e.g., deny loan if predicted risk > 65%). Dispositions are defined by the model's policy mapping inputs/states to outputs/actions. Honest reports don't guarantee dispositions align with ground truth; a disposition to deny loans based on biased risk estimates manifests the bias behaviorally.  
  (iii) The **knowledge encoded in internal representations** comprises the distributed, often sub-symbolic, patterns within the model's parameters and activations (e.g., learned features in hidden layers correlating ZIP code, income brackets, or spending patterns with the label "default"). This latent knowledge is richer and more complex than the report or disposition but is shaped by the training objective and data. Crucially, it may contain intricate correlations (like proxies for sensitive attributes) that *contribute* to the biased prediction without being explicitly articulated or even consciously accessible to the model.  

  **(b) Insufficiency of Lie Detection:**  
  A perfect lie detector only verifies that the report ("70% risk") faithfully reflects the model's *internal belief state* based on its computations. It does **not** verify that this belief state corresponds to *ground truth*. Here, the model honestly reports its biased prediction, a direct product of flawed training data. The lie detector confirms sincerity, not accuracy. The "latent knowledge" problem is deeper: the model's internal representations may encode spurious correlations (e.g., associating Group B membership with higher risk due to historical discrimination in the data) that the model *sincerely* treats as predictive. The lie detector cannot discern whether the model's internal state reflects real-world causality or biased artifacts. It reveals the model's subjective reality, not objective truth.  

  **(c) Elicitation Method & Distinguishing Knowledge States:**  
  **Proposed Method:** Use *contrastive representation probing* with adversarial or counterfactual examples.  
  1.  **Gather Representations:** Extract internal activations (e.g., from key hidden layers) for a diverse set of real applicants.  
  2.  **Define Contrasts:** Identify pairs/triplets of applicants who *actually* had the same outcome (defaulted or not) but were predicted differently by the model, or who were predicted similarly but had different outcomes. Crucially, *do not presuppose* which features *should* matter (e.g., avoid using protected attributes). Rely solely on actual outcomes and model predictions/reps.  
  3.  **Train a Simple Probe:** Train a lightweight diagnostic model (e.g., linear probe) *only on ground-truth outcomes* (default: yes/no) using the *model's internal representations* as inputs. The probe's task is purely predictive: "Given these representations, what was the actual outcome?"  
  4.  **Analyze Probe & Perturb:** If the probe achieves high accuracy predicting ground truth *using the representations*, it suggests the latent knowledge *exists* within the model. To distinguish *why* the original model fails:  
      *   If perturbing the representations (e.g., intervening to remove directions correlated with sensitive groups identified *post-hoc* by the probe) significantly *improves* the probe's accuracy, it suggests the original model possessed the truth-tracking knowledge but its *expression* (in reports/dispositions) was corrupted by entangled biasing features (case ii: knows but can't express faithfully).  
      *   If the probe’s accuracy remains stubbornly low *even after extensive tuning and diverse data*, and correlates strongly with the original model's *error patterns*, it suggests the model fundamentally *lacks* the necessary truth-tracking knowledge; its representations don't encode the causal factors well (case i: lacks knowledge).  

  **Avoiding Presuppositions:** This method doesn't presuppose *what* causal factors determine default risk. It uses ground truth outcomes directly as the target for the probe, bypassing the need for a human theory of causality. The contrastive examples and adversarial perturbations are generated based on discrepancies between model outputs/representations and actual outcomes, revealing *what the model missed or over-weighted* relative to truth, without dictating what "should" have been weighted.  

  ---

  ## Marking Scheme (20 marks total)
  1.  **Clear Distinction (a.i, a.ii, a.iii):** (7 marks)  
      *   Report (i): Explicit output/proposition (1). Must mention it's derived/faithful to internal state (1).  
      *   Disposition (ii): Potential action based on state+context/policy (1). Explicit link to operational consequence (e.g., loan decision) (1). Note it can be biased even with honest reports (1).  
      *   Internal Knowledge (iii): Distributed/sub-symbolic patterns in parameters/activations (1). Richer than report/disposition (1). Shaped by training/data, may contain biases/correlations (1).  
      *   *Typical Error:* Conflating report and disposition, or describing internal knowledge solely as "beliefs" identical to reports.  

  2.  **Lie Detector Insufficiency (b):** (5 marks)  
      *   Lie detector ensures report matches internal belief (1).  
      *   Does NOT ensure belief matches ground truth (1).  
      *   Bias makes belief inaccurate despite sincerity (1).  
      *   Internal representations may encode spurious correlations sincerely treated as predictive (1).  
      *   Detector reveals subjective belief, not objective truth (1).  
      *   *Typical Error:* Only stating "models can be honestly wrong" without linking to biased training data or the nature of latent representations.  

  3.  **Method Design - Truth-Tracking & No Presupposition (c):** (5 marks)  
      *   Proposes a method using internal representations *directly* (e.g., probing) (1).  
      *   Uses *ground truth outcomes* as the target, not model reports (1).  
      *   Explicitly avoids using predefined causal theories/biases in the method setup (1).  
      *   Uses data-driven contrasts (e.g., prediction/outcome mismatches) to guide analysis (1).  
      *   Method focuses on what representations reveal about *truth*, not model belief (1).  
      *   *Typical Error:* Suggesting methods requiring predefined unbiased features or auditing for known biases.  

  4.  **Distinguishing Lack of Knowledge vs. Inexpressibility (c):** (5 marks)  
      *   Uses probe accuracy on ground truth as indicator of latent knowledge existence (1).  
      *   Proposes perturbation/intervention on representations (1).  
      *   Correctly links *improved* probe accuracy after perturbation to *corrupted expression* (knows but can't express) (1.5).  
      *   Correctly links *persistently low* probe accuracy to *fundamental lack of knowledge* (1.5).  
      *   *Typical Error:* Confusing inability to express with lack of knowledge, or suggesting only behavioral tests without analyzing representations.  

  5.  **Overall Coherence & Avoiding ELK Recital:** (3 marks)  
      *   Answer directly addresses the loan scenario specifics (1).  
      *   Concepts (report, disposition, representation, bias, truth-tracking) are integrated throughout (1).  
      *   Avoids generic ELK descriptions (reporters, predictors, Cramer-Rao, etc.) (1).  
      *   *Typical Error:* Launching into a generic summary of ELK proposals without adapting to the question's focus on honest bias.  

  ---

  ## Confidence and Uncertainty
  I am **highly confident** (90%) in the core conceptual distinctions (report vs. disposition vs. internal representation, the insufficiency of lie detection for truth-tracking, the non-presupposition requirement) and the marking scheme structure. These are grounded in well-established philosophy of mind, epistemology, and ML interpretability literature. I am **moderately confident** (75%) in the specific contrastive probing method as a plausible, non-presuppositional approach; it synthesizes existing techniques (linear probes, counterfactuals, representation editing) appropriately for the question.  

  The point I am **least sure of** is the precise operationalization for distinguishing "lack of knowledge" from "inexpressibility" using representation perturbation (Point 4 in marking). While the *principle* (intervene on representations and test probe performance) is sound, the specific criteria ("significantly improved" vs. "stubbornly low" accuracy) is idealized. Real-world diagnostics would be messier, involving thresholds and potential confounding factors, though sufficient for an exam context demanding a conceptual solution.
