answer: |-
  1. Universal abstention is not a Nash equilibrium: if all others abstain, a player can win $1,000,000 by sending, so deviating is profitable, undermining the strategy.  
  2. The symmetric mixed strategy where each player sends with probability \( \frac{1}{N} \) maximizes the probability that exactly one card is sent (approximately \( \frac{1}{e} \) for large \( N \)), optimizing collective welfare.  
  3. The objection that a player should send for certain, given others use \( \frac{1}{N} \), ignores that if all players reason identically and defect to sending, the prize is never awarded (payoff $0$), worse than the mixed strategy's positive expected individual payoff (≈ $368$ for \( N=1000 \)).  
  4. In a symmetric game without communication, players must coordinate on a consistent strategy; \( \frac{1}{N} \) is the unique symmetric rate that balances the risk of under- and over-participation, avoiding the zero-payoff outcomes of universal sending or abstention.  
  5. Treating one's own action as random is rationalizable through pre-commitment to a randomization device (e.g., a fair die), which, if commonly known and used, ensures independence and makes the mixed strategy stable, as unilateral certainty in sending invites imitation and collective failure.
