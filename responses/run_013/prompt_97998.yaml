answer: |-
  **Take down the post.**  

  **The consistent rule derived from all five rulings:**  
  Content is removed only if it meets *both* criteria:  
  1. **Uses a slur targeting a protected group** AND  
  2. **Combines it with dehumanizing language implying imminent threat, expulsion, or inherent violence** (e.g., "vermin," "disease," "rats," "driven out," with contextual cues like time/place).  
  Content is left up if it lacks either criterion (e.g., criticism without slurs, satire, non-dehumanizing disputes).  

  **How the rule predicts past rulings:**  
  - *Religion critique left up*: Used contempt but **no slur** → meets neither criterion.  
  - *Politician cartoon left up*: Satire targets non-protected class → **no protected-group slur**.  
  - *"Vermin" post removed*: **Slur + dehumanization** ("vermin," "driven out") + **context** (rally location/time) → both criteria met.  
  - *Religious dispute left up*: Disputed claims without slurs → **no slur**.  
  - *"Disease/rats" post removed*: **Slur + dehumanization** ("disease," "rats") + **context** (time/place attached) → both criteria met.  

  **Prediction for the new case:**  
  - **Slur is present** (targeting protected ethnic group).  
  - **Dehumanizing language** ("stupid and prone to violence") implies *inherent dangerousness*, paralleling "disease" or "vermin" in removed cases.  
  - **But lacks context** (no time/place/call to action).  
  → **Rule ambiguity**: Criterion 2 ("implying imminent threat/expulsion") hinges on contextual severity. Here, "prone to violence" suggests inherent threat but lacks rally-like immediacy.  

  **Recommendation with reasoning:**  
  Remove the post. While it lacks explicit context, "prone to violence" is dehumanizing and *inherently* implies a threat to public safety, aligning with the logic behind removing "disease on the body politic" (which also cited inherent traits). Consistency requires treating slurs + violence-implying dehumanization as meeting Criterion 2 *even without explicit context*, as:  
  - Past rulings treated "disease/rats" as removal-worthy *because* it framed the group as a contaminant (inherent danger), not solely due to appended context.  
  - "Prone to violence" similarly frames the group as intrinsically threatening, escalating harm beyond mere "contempt" (which was allowed).  
  - **Key nuance**: The rule tolerates harsh criticism but draws the line at slurs + language implying the group is *dangerous or subhuman by nature*.  

  **Future test case to separate competing interpretations:**  
  A post using the same ethnic slur but *only* claiming the group is "lazy" (no implication of violence/subhuman status).  
  - **Under this rule**: Leave up (dehumanization lacks threat/expulsion connotation).  
  - **If European members demand removal**: Their stance likely prohibits *any slur use* regardless of context, conflicting with past rulings leaving up non-dehumanizing criticism.  
  - **If First Amendment advocates demand leaving up**: Their stance likely protects all non-incitement opinions, conflicting with past removals of slurs + dehumanization.  

  **Why this works**: The rule cleanly splits all five cases without exception, prioritizing the *combination* of slur + threatening dehumanization as the bright line. It rejects "slurs alone" (European tilt) and "only imminent violence" (First Amendment tilt) as inconsistent with the board’s actual votes.
