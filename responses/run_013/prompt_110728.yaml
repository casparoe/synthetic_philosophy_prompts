answer: |-
  Here’s a structured research proposal addressing your core concerns, designed for a one-semester theoretical fellowship. It frames your "half-formed idea" into a tractable project with clear goals, methods, and evaluation criteria.

  ---

  **Research Proposal: Robustness and Collapse in Idealization-Based Normativity**

  **1. Research Question & Core Problem:**  
  Does introducing *robustness across idealization profiles* resolve the arbitrariness problem inherent in idealization-based normative theories (e.g., full-information accounts, ideal advisor theories, deliberative convergence models), or does it inevitably collapse into either *triviality* (admitting too many profiles, rendering almost no actions robustly normative) or *smuggling* (covertly restricting profiles to preserve pre-existing substantive commitments), thereby failing to provide a defensible foundation for normativity?

  **2. The Arbitrariness Problem & Why Existing Defenses Fall Short:**  
  Idealization-based theories ground normativity (what an agent *ought* to do) in what some idealized counterpart *would* do/advise/choose. The core weakness is the *selection problem*:  
  *   **No Principled Stopping Point:** Idealizations can range from minimal (e.g., full factual information) to maximal (e.g., full information, logical omniscience, perfect coherence, impartial benevolence, timeless perspective).  
  *   **Justification Gap:** Theorists typically select an idealization set (`I`) that yields their preferred normative conclusions (e.g., utilitarianism, Kantianism, sophisticated instrumentalism). Crucially, the *defense* of `I` itself is often underdeveloped or circular – `I` is justified *because* it yields plausible verdicts, but plausibility is judged against the very normative intuitions the theory aims to ground.  
  *   **Standard Defenses Don’t Solve It:** Common responses (e.g., "`I` tracks true agency," "`I` is necessary for genuine value," "`I` avoids akrasia") typically either:  
      *   **Presuppose substantive norms** (e.g., defining "true agency" requires prior normative commitments).  
      *   **Ignore the selection problem** by focusing solely on the output of their chosen `I`.  
      *   **Appeal to practicality/guidance** – which is precisely what these theories often struggle with, given the gap between ideal and non-ideal agents.  

  **Your Proposed Solution & Its Vulnerability:**  
  Introduce the concept of an **Idealization Profile (`P`)** – a specific, admissible set of idealizing assumptions (information, coherence, motivation, cognition, temporal perspective, etc.). Define an action as **Indirectly Normative** for a non-ideal agent if it is **at least as good as every alternative action under *every* admissible profile `P` within a defined family `F`**. *Robustness* replaces *uniqueness* derived from a single `I`.  
  *   **The Vulnerability (The Collapse Worry):** Does `F` avoid arbitrariness?  
      *   **Triviality Collapse:** If `F` is too large/permissive (admitting wildly divergent `P`), no action (or only trivially dominant ones like "avoid immediate death") may satisfy the robustness criterion. Robustness becomes vacuous.  
      *   **Smuggling Collapse:** If `F` is constrained to avoid triviality, the constraints themselves likely encode substantive normative assumptions (e.g., "`P` must include impartiality," "`P` must preserve core desires"), effectively smuggling in a first-order normative view and defeating the purpose of using idealization to *ground* normativity.  

  **3. Project Plan (One Semester - Whiteboard Work):**  
  *   **Month 1: Formalizing Profiles (`P`) and Families (`F`):**  
      *   Develop a taxonomy of idealization dimensions (Information, Coherence, Motivation, Cognition, Temporal Perspective, etc.).  
      *   Define what constitutes a *minimally admissible* `P` (e.g., must include factual omniscience? minimal rationality constraints?). Define `P` as a vector across these dimensions.  
      *   Define types of `F`: Unrestricted, Constrained by formal criteria (e.g., consistency, minimal rationality), Constrained by substantive criteria (e.g., preserving identity-relevant desires).  
  *   **Month 2: Modeling the Triviality Collapse:**  
      *   Construct simple decision problems (e.g., Newcomb-like problems, Prisoner's Dilemmas, resource allocation under uncertainty).  
      *   Systematically vary `P` within large/permissive `F` (e.g., all logically possible combinations of idealization dimensions).  
      *   Analyze: How many actions survive as robustly normative? Are they plausible core norms, or trivial/implausible? Does the set of robust actions change drastically with minor tweaks to `F`?  
  *   **Month 3: Modeling the Smuggling Collapse:**  
      *   Define candidate constraints for `F` designed to avoid triviality (e.g., "`P` must satisfy transitivity of preferences," "`P` must not alter the agent's core values," "`P` must be psychologically conceivable").  
      *   Scrutinize *the justification for each constraint*: Does it rely on prior normative commitments (e.g., valuing autonomy, valuing certain outcomes) or empirical assumptions?  
      *   Test: Does applying these constraints inevitably favor certain first-order normative outputs (e.g., utilitarian vs. Kantian verdicts) across diverse decision problems?  
  *   **Month 4: Synthesis & Meta-Normative Implications:**  
      *   Evaluate: Under what conditions (if any) does robustness yield non-trivial, non-question-begging normative guidance? Is it stable?  
      *   Confront the "Wrong Picture?" Question: If robustness collapses, does this reveal a fatal flaw in the *ideal-point strategy itself* (its inability to bridge the ideal/non-ideal gap without arbitrariness)? Or does it show we've misapplied it by demanding *guidance* it wasn't designed for (perhaps its role is purely *evaluative*, not action-guiding for non-ideal agents)?  
      *   Outline implications: If the ideal-point picture is flawed, what alternative meta-normative frameworks look promising? If guidance is the wrong demand, how should we understand the purpose of idealization?  

  **4. Why this Approach? (Beats Piecemeal Objections):**  
  Grinding through objections to specific idealizations (e.g., "Full information is impossible," "Ideal coherence is alienating") is necessary but insufficient. It:  
  1.  **Misses the Structural Problem:** It treats symptoms (issues with *particular* `I`) without diagnosing the core disease (the *selection problem* for `I`).  
  2.  **Is Reactive & Defensive:** It plays whack-a-mole against existing theories.  
  3.  **Doesn't Offer an Alternative Framework:** It critiques without constructing.  

  **This project offers a decisive advantage:**  
  *   **Proactive & Structural:** It directly attacks the foundational arbitrariness by modeling the *space of possible idealizations* (`F`).  
  *   **Systematic & Diagnostic:** It provides a general tool (`P`/`F`/Robustness) to diagnose *why* and *how* specific idealization-based theories fail or succeed, revealing common failure modes (triviality/smuggling).  
  *   **Constructive:** It rigorously tests a potential *solution* (robustness) to the core problem, yielding a clear verdict on its viability and broader implications for normative theory.  

  **5. Outcomes & Success/Failure Criteria:**  
  *   **Good Result (Success):**  
      *   A clear formal framework for analyzing idealization profiles (`P`) and families (`F`).  
      *   A rigorous demonstration that robustness either:  
          (a) **Succeeds:** Identifies a stable, non-trivial, non-smuggling core of robustly normative demands across plausibly constrained `F`, offering a novel foundation. *Or,*  
          (b) **Fails Diagnostically:** Demonstrates inevitable collapse (triviality *or* smuggling) under any coherent definition of `F`, providing strong evidence that the ideal-point strategy *as a source of action-guidance for non-ideal agents* is fundamentally flawed.  
      *   A compelling argument for the meta-normative implications: either the need to abandon/reconceive the ideal-point picture, or a clear demarcation of its proper (non-guidance) role.  
  *   **Project Failure:**  
      *   The framework proves too vague or intractable to yield clear results within the timeframe.  
      *   The analysis of collapse remains inconclusive or merely recapitulates known objections without structural insight.  
      *   The meta-normative conclusions are underdeveloped or lack force.  

  **6. Scope: Semester, Not Career (But a Launchpad):**  
  This is squarely a **one-semester project**. The goal is *not* to develop a complete robustness-based normative theory or definitively settle all meta-normative debates. It is:  
  1.  To rigorously *test the viability* of the robustness maneuver as a solution to the arbitrariness problem.  
  2.  To provide a *diagnostic framework* for understanding the strengths and limitations of idealization-based normativity.  
  3.  To draw clear, focused *meta-normative conclusions* based on (1) and (2).  

  The output will be a detailed manuscript outlining the framework, the collapse analysis, and the implications. This work *could* launch a longer career arc (e.g., developing a positive robustness-based theory if viable, or exploring alternative meta-normative frameworks if not), but the proposed semester delivers a self-contained, high-impact investigation with a definitive answer to your core question about robustness and collapse.

  ---
  **Key Strengths of this Proposal:**

  1.  **Clear, Answerable Question:** Focuses laser-like on the viability of robustness as a solution to arbitrariness, framed around the specific collapse risks.
  2.  **Highlights the Gap:** Explicitly shows why standard defenses don't address the structural selection problem.
  3.  **Methodology Matches the Fellowship:** Pure conceptual/theoretical work, broken down into manageable monthly goals centered on modeling and analysis.
  4.  **Justifies the Approach:** Clearly argues why this structural analysis is superior to piecemeal objections.
  5.  **Defined Success/Failure:** Concrete criteria for evaluating the outcome of the robustness test.
  6.  **Honest about Scope:** Positions this as a foundational, diagnostic semester that could lead to larger projects but delivers significant results on its own.
  7.  **High Stakes:** Connects the technical investigation to profound meta-normative implications about the whole ideal-point strategy.

  Fill in your specific examples and citations, and this provides a solid, compelling framework for your fellowship application. Good luck!
