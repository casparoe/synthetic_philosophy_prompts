  ## Terminal Truths: A Dialogue at Gate B7

  **Setting:** A generic airport bar, plastic seats, the low hum of delayed flights. ELIAS (60s, tweed jacket slightly rumpled) swirls amber liquid in a glass. MARA (50s, sharp eyes behind glasses, scarf artfully draped) taps her phone in frustration.

  **MARA:** Four hours. Four hours staring at that infernal 'DELAYED' sign. It’s mocking us, Elias. Like that damned coin flip we argued about for half of grad school.

  **ELIAS:** (Chuckles dryly) Ah, the eternal ‘heads or tails tomorrow’. Still think it’s fundamentally indeterminate *now*, Mara? That the universe hasn’t… chosen yet?

  **MARA:** Absolutely. If the flip *could* genuinely go either way – no hidden gears, pure contingency – then saying "It *will* be heads" isn't true *or* false right now. It’s simply… open. A fact waiting to be born tomorrow. Claiming it’s *already* settled, true or false, smuggles in determinism through the back door of logic.

  **ELIAS:** But logic *demands* it, Mara! Take the proposition P: ‘The coin will land heads when Elias flips it at Gate B7 tomorrow at, gods willing, 9 AM.’ Logic operates on propositions having truth values. If P isn’t true, and it isn’t false… what is it? Some mystical third thing? That violates the very bedrock of bivalence we rely on for coherent thought. The *potential* for either outcome doesn’t negate the necessity that *one* outcome *will* obtain, making P true or false in retrospect. Why can’t that truth value exist timelessly?

  **MARA:** Because ‘timelessly’ ignores the *flow* of time, Elias! Saying P is ‘timelessly true’ just because it *will be* true later is cheating. It conflates the *eventual* fact with a *current* property. Right now, before the flip, the coin *hasn’t* landed. There *is* no ‘heads landing’ fact *in the present* for P to correspond to. ‘True’ now should mean something *about* now – a correspondence to *current* reality. Tomorrow’s reality isn’t current reality. It’s potential reality.

  **ELIAS:** Hmm. You’re pressing on correspondence. That’s fair. But consider this case – it’s been gnawing at me. Imagine a company, teetering. Its CEO publishes a report: "We *will* go bankrupt within the year." Purely speculative, based on shaky trends. But investors panic. They pull funds, demand loans, suppliers flee. The panic *causes* the bankruptcy. The report made itself true.

  **MARA:** (Leans forward, intrigued) Ah, the self-fulfilling prophecy paradox. Lovely mess.

  **ELIAS:** Exactly! When the report was published, was the sentence "We will go bankrupt" *true*?

  **MARA:** At the moment of publication? Based purely on the *then-existing* state? Probably not. The future was genuinely open. Bankruptcy was *possible*, maybe even *likely*, but not inevitable. The report itself wasn’t describing a *fact*; it was making a prediction that then *became* a catalyst. So, no, not true *then*.

  **ELIAS:** But then, when *did* it become true? The moment panic started? The moment the first investor pulled out? When the bankruptcy papers were filed? It’s fuzzy. And crucially, the sentence *caused* its own truth. Does that mean it *was* true *before* it caused the events that made it true? That seems nonsensical. Or does it only become true *after* the bankruptcy, retroactively? But then, what was its status *during* the panic it was causing? Was it… indeterminate *while* it was actively determining reality?

  **MARA:** (Takes a slow sip, thinking) You’re right, it *does* blur the lines horribly. My instinct is still that at publication, it *wasn't* true. The future wasn't fixed. It *became* true through the chain of events *it initiated*. The ‘truth-maker’ – the actual bankruptcy – didn’t exist at T=0 (publication), it came into being later, partly *because* of the statement. So the statement gained its truth value *when* the truth-maker came into existence. Before that, it was false, or more accurately, *not yet true* or *not-yet-false*.

  **ELIAS:** But that feels like saying the statement was *false* when published, which seems equally wrong! It wasn't false; its publication was the very thing that prevented it from *being* false! If the report hadn’t been published, bankruptcy might well have been avoided. So at T=0, it wasn't describing a current falsehood either. This case makes your ‘no current truth value’ view appealing… but also highlights its own problem: when *does* the switch flip? Is there a magic moment the bankruptcy becomes ‘inevitable’? What if the panic started but then a white knight investor swooped in at the last second? The truth value would have flipped back!

  **MARA:** (Nods) It highlights the messiness of applying ‘true *now*’ to the future, especially when agency and prediction interact. Maybe the whole ‘true *now*’ framing *is* confused for future contingents. We’re trying to pin a static property onto something fundamentally dynamic. Perhaps ‘true’ for future statements just means ‘will turn out to be the case’, full stop, without implying a *current* metaphysical fact.

  **ELIAS:** But that circles back! If ‘will turn out’ is settled *now* – even if we don't know it – then it *is* a fact *now*, just a future-oriented one. If it’s *not* settled now, then ‘will turn out’ is just a prediction, not a description of a *current* truth.

  **MARA:** Let’s press the boundaries. Does determinism matter? If Laplace’s demon knew every particle state right now, could calculate the coin *will* land heads, does that make P true *now*?

  **ELIAS:** (Sighs) This is where I often stumble. Intuitively, yes, if determinism holds, the future *is* fixed, so P *is* true (or false) now. But… even if determinism is false, and the coin is quantum-random, truly indeterminate until observed… I still think P *must* have a truth value now. Because *tomorrow*, it will *have had* that truth value. It will *be* true *then* that it *was* true *all along*, even if the mechanism was random. The randomness affects *how* the outcome happens, not *that* one outcome *will* happen, making a proposition determinately true or false.

  **MARA:** I strongly disagree. If the outcome is genuinely undetermined *until* the flip, then *until* that moment, there is no ‘which outcome *will* happen’. There’s only ‘which outcome *can* happen’. Saying it *was* true all along in an indeterministic universe imposes a fictional settledness. ‘True’ *now* for a future contingent in an open universe is an empty label. It only gains meaning *after* the fact. ‘It will be heads’ is just an expression of expectation or probability before the flip, not a bearer of a truth value.

  **ELIAS:** So is ‘true’ just ‘warranted assertibility’ for you? If I have overwhelming evidence the coin is weighted, am I ‘warranted’ in asserting P, and that’s all we mean by calling it ‘true’?

  **MARA:** No, no. That’s the pragmatist error. ‘True’ and ‘warranted to assert’ are different. I can be warranted in asserting something false (if I have excellent but misleading evidence) and unwarranted in asserting something true (if I have no evidence for a fluke). In the bankruptcy case, investors were *warranted* in panicking based on the report, but the report *wasn't* true *at the moment it warranted their panic*! It *became* true *because* of their warranted panic. Truth is about *how the world is* (or, for futures, *how it will be*), not what we’re justified in believing. But for the future, ‘how it will be’ isn’t part of ‘how it *is*’ *now*.

  **ELIAS:** So we *do* have a genuine disagreement about the nature of time and propositions, not just semantics. You see time as fundamentally dynamic, reality unfolding, facts coming into being. I see reality as a static block – past, present, future all equally real, just temporally located differently. From that ‘eternalist’ view, the sea battle tomorrow *is* happening, just ‘over there’ in time. The proposition about it points to that event, fixed in the tapestry. The truth value is timeless. Your ‘open future’ view requires a dynamic, ‘growing block’ or ‘presentist’ ontology where only the past and present are real.

  **MARA:** Precisely. And your eternalism feels like denying the palpable openness of the present moment, the reality of possibility. This airport *might* get us out tonight, or it might not. That ‘might’ feels real, not illusory. Saying ‘it is already true that we leave at 9 PM, or it is already false’ kills that openness, that potentiality. It renders the future as inert as the past.

  **ELIAS:** But does it? Knowing a truth value doesn’t change the *experience* of uncertainty or the *reality* of causal processes leading to the outcome. The coin *feels* open to me as I flip it, even if, from a God’s-eye view, its result is fixed (or timelessly located). The feeling and the ontological status are distinct.

  **MARA:** But if the ontological status *is* fixed or timelessly true, then the feeling of openness is an *illusion*. And I refuse to believe my deepest sense of possibility – my feeling that I *could* choose to order another drink or not – is just ignorance of a pre-written script. That bankruptcy report *could* have been wrong, until it made itself right. That ‘could’ is ontologically significant, not just epistemic.

  **ELIAS:** (Looks at his empty glass, then at the still-delayed sign) So, what would settle it? If we could prove determinism true or false? But even determinism’s truth is contested. A cosmic observation showing the ‘block universe’? Impossible. We’re stuck with intuitions about time and logic.

  **MARA:** Perhaps. Or perhaps we need to admit our concept of ‘truth’ strains when applied too rigidly to the not-yet-existent. Maybe ‘true’ is primarily a property of statements about the past and present, and we stretch it awkwardly to the future. The bankruptcy case shows that stretch causing a tear.

  **ELIAS:** (Smiles faintly) So, philosophers at an airport bar, grounded by metaphysics rather than mechanics. Shall we call it a draw for now? Though I maintain my coin flip proposition *is* already true… or false. I just don’t know which. Another drink while we wait for reality… or the timeline… to catch up?

  **MARA:** (Raises her glass) To the open future… or the fixed one. Whichever it is, *this* drink is undeniably present. And warranted. Cheers, Elias. The argument stands… delayed, but not cancelled.

  **ELIAS:** Cheers, Mara. Until the next connection… or contradiction. *(They clink glasses as the PA system crackles unintelligibly.)*

