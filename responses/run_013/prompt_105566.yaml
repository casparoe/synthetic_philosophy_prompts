answer: |-
  Here’s a structured 90-minute teaching plan centered on your two commitments, sequenced to build inevitability, using the **honeybee** as the core case study. Its small brain, complex behaviors, and evolutionary distance from vertebrates force confrontation with your key ideas.

  **Why the Honeybee?**  
  It conspicuously *has* capacities like valenced experience (pain/pleasure coding), cross-modal integration (visual/olfactory learning), and sophisticated learning (numerosity, concept formation). It conspicuously *lacks* a cortex, self-referential behaviors, and any plausible "narrative" self. This tension makes the cluster approach feel necessary, not evasive.

  ---

  ### **Teaching Plan Sequence**  
  *(Total: 90 min; transitions italicized)*  

  #### **I. Trap Them With the Puzzle (15 min)**  
  - **Open (5 min):** Show video of two hypothetical robotic systems performing identical avoidance behaviors: one purely feedforward (pre-programmed reflexes), one recurrent (internal feedback loops adjusting predictions).  
    *Ask: "What *behavioral* test could distinguish these?"*  
  - **Puzzle Statement (10 min):** "Suppose System A has recurrent wiring and System B is feedforward. If a theory claims *only* A is conscious, no experiment can ever confirm it. If it claims *both* are conscious, it must explain why."  
    **→ *Do not resolve. Let this hang.***  

  #### **II. Fracture "Consciousness" Using the Bee (30 min)**  
  - **Case Study Intro (5 min):** Honeybee behaviors:  
    - **Valence:** Avoid electric shocks (distinct from mere nociception; trade-offs with reward).  
    - **Integration:** Learn odor-color associations (multisensory binding).  
    - **Gap:** No evidence of "self" location (e.g., mirror test failures).  
  - **Capacity-Cluster Exercise (25 min):  
    - *Split audience into 3 groups. Assign each one capacity:*  
      1. Valence (e.g., "Does shock *feel bad* to the bee?")  
      2. Integration (e.g., "Does combining sight/smell feel unified?")  
      3. Self-Location (e.g., "Does the bee experience pain *as its own*?")  
    - *Groups list evidence for/against their capacity in bees.*  
    - *Regroup: Chart findings. Highlight mismatches:*  
      > "High valence/integration evidence... near-zero self-location. What does this *mean* for ‘bee consciousness’?"  
    **→ *Crucial: Show clusters *can* come apart in real biology.**  

  #### **III. Why Clusters Aren’t a Dodge (20 min)**  
  - **Contrast with Binary Views (10 min):**  
    - *Project 2 claims:*  
      A. "Bees lack consciousness (no cortex!)"  
      B. "Bees are conscious (they learn like vertebrates!)"  
    - *Ask:* "What do both miss?" *Elicit:* They ignore the *pattern* of capacities.  
  - **The Substantive Proposal (10 min):**  
    - "Sentience isn’t a light switch. It’s a recipe: some ingredients might be missing, but the dish changes. If bees have valence/integration but no self-location, they might experience ‘raw feels’ without ownership. That’s a *testable* difference from vertebrates."  
    **→ *Link to Puzzle:* "This matters because..."**  

  #### **IV. Earn Back the Puzzle (15 min)**  
  - **Revisit Feedforward vs. Recurrent (10 min):**  
    - *Ask:* "In the bee, where might recurrence exist? (e.g., mushroom body feedback loops). Where might it be feedforward? (e.g., escape reflexes)."  
    - *Point out:* A single brain mixes both. What would "partial consciousness" imply?  
  - **Implicit Moral (5 min):**  
    - "If two systems *behave identically* but differ in architecture, and if architecture matters for consciousness (e.g., recurrence = integration), then... *[pause]*... behavior alone can’t decide."  
    **→ *Puzzle now feels unavoidable, not stated.*  

  #### **V. Check Understanding & Wrap (10 min)**  
  - **Diagnostic Question (7 min):**  
    > *"Sketch a ‘sentience profile’ for an animal *not* discussed today (e.g., octopus, zebrafish) using our 3 capacities. What gaps make its consciousness *harder/easier* to probe than the bee’s?"*  
    - *Listen for:*  
      - Recognition that evidence varies *by capacity*.  
      - Awareness that identical behaviors (e.g., avoidance) can’t resolve valence vs. reflex.  
  - **Closure (3 min):**  
    - "We haven’t answered ‘Is the bee conscious?’ We’ve built tools to ask: *Which threads of sentience might it have?* And we’ve seen why behavior alone can’t untangle them. That’s the work ahead."  

  ---

  ### **Handling Misconceptions**  
  | **Misconception**          | **When to Address**              | **Response**                                                                 |
  |----------------------------|----------------------------------|------------------------------------------------------------------------------|
  | **"Consciousness = intelligence"** | During bee valence discussion (II) | "Bees calculate efficiently—but does processing *feel like anything*? Intelligence can be unconscious (e.g., deep learning)." |
  | **"No cortex, no experience"**     | Contrasting binary views (III)   | "Octopuses have complex cognition without a cortex. If structure matters, we need *which* structures—and why." |
  | **"All-or-nothing"**               | Cluster exercise debrief (II)    | "If self-location is missing but valence isn’t, is that ‘half-conscious’? Or a different *kind*?" |
  | **"Settle via brain areas"**       | Revisiting the puzzle (IV)       | "If feedforward and recurrent circuits occupy the same region, same neurons—what then?" |
  | **"Just anthropomorphism"**        | Introducing capacities (II)      | "Anthropomorphism is *assuming* human-like experience. We’re asking: *which mechanisms* justify which inferences?" |

  ---

  ### **What to Omit & How to Frame It**  
  - **Omit:**  
    - Philosophical theories (e.g., IIT, global workspace).  
    - Neuroanatomy deep dives.  
    - Debates about specific species (e.g., fish pain).  
  - **Frame:**  
    > "Today is about *how to think*, not final answers. We’re bracketing *which* theories are right to ask: *what would even count as evidence?* If you’re thinking, ‘But what about [X]?’—good! That means our framework is sharp enough to probe it."  

  This plan forces engagement with your two commitments: the cluster model arises to explain the bee’s contradictions, and the unresolved puzzle underscores why behavioral evidence is necessary but insufficient. The honeybee’s biological realism prevents dismissal as a "toy model," while its simplicity keeps focus on the conceptual scaffolding.
