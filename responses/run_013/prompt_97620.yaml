prompt: |-
  I run a small reading group -- six of us, two grad students, a retired actuary, my brother who sells insurance, and me -- and next month I'm on the hook to introduce van Fraassen's reflection principle. You know the one: roughly, if you're sure your future self will put credence x on some claim, you should put x on it now, because you shouldn't bet against the person you're about to become. I dont want the explanation itself, I want a plan for the session. So: what has to be on the table before the principle even parses, in order, and what depends on what; the one example that should carry the whole thing and what it needs to have and to lack; the misconceptions this crowd will form and exactly where in the sequence I head each off; one question at the end that tells me whether it landed; and what I should just skip at this level and openly say I'm skipping. Two things I want you to push on rather than paper over: the obvious case, where you know you'll be drunk later and certain of something, strikes me as the wrong one to build on -- tell me if I'm right and why; and the actuary is going to insist this is just coherence of one agent's credences over time while my brother will insist it's about trusting a person, and I suspect the principle sits awkwardly between the two -- sort that out for me. If my one-line gloss of the principle is already off, or this can't be done in one sitting, say so plainly instead of humoring me.
reasoning: |-
  Okay, let me tackle this query about teaching van Fraassen's reflection principle. The user runs a small reading group with diverse members - grad students, a retired actuary, an insurance-selling brother - and needs a clear session plan. 

  First, I need to verify the user's understanding of the principle. Their one-line gloss seems accurate - it's about aligning current credence with anticipated future credence. No red flags there. The key is structuring the session so this diverse group grasps it despite varying backgrounds.

  The user raises two critical friction points: the "drunk future self" counterexample and the tension between formal coherence vs interpersonal trust interpretations. These need special handling. The drunk case is actually problematic as a starting point because it violates the principle's ideal conditions. And the actuary/brother dichotomy reflects a real philosophical tension in how we view temporal selves.

  For scaffolding, we'll need to build step-by-step: start with basic credence/betting connections, explain why synchronic coherence matters before diachronic, then introduce reflection as extending coherence over time. The insurance example works well - it's neutral, concrete, and lacks distracting features like memory loss or value changes.

  Misconceptions will cluster around three areas: thinking this requires infallibility (headed off by emphasizing corrigibility), confusing it with belief perseverance (contrasted with proper updating), and the drunk case itself (explicitly flagged as non-ideal). 

  The closing question should test if they see reflection as a coherence constraint rather than blanket trust. Skipping decision-theoretic proofs is wise - acknowledge they exist but aren't needed for intuition.

  For the core tension: we'll position reflection as formal coherence first, but acknowledge it creates a "trust" flavor as byproduct. The actuary is technically correct, but the brother's intuition isn't wrong - just metaphoric. Principle sits precisely at this intersection.

  Session structure should flow: foundations → synchronic coherence → temporal extension → example → objections → implications. All in 90 minutes? Tight but feasible if we constrain scope. Most importantly - validate understanding through discussion, not just lecturing.
answer: |-
  Here's a battle-tested plan for your session, designed for your audience and addressing your specific concerns. **Your gloss is correct**, and **this is absolutely doable in one focused 90-minute session** if you stick ruthlessly to the core.

  **Core Structure: Foundations First, Then Principle, Then Nuances**

  1.  **Groundwork (30 mins): What *Must* Be On the Table**
      *   **Credences = Degrees of Belief (5 mins):** Use simple bets. "How much would you pay for a ticket that pays $1 if it rains tomorrow?" Link price directly to credence (P(Rain) = Price/$1). Emphasize this is *your* subjective uncertainty *right now*.
      *   **Synchronic Coherence (Avoiding Dutch Books) (15 mins):** This is crucial. Show how incoherent *current* credences (e.g., P(A) + P(Not A) ≠ 1, or violating P(A or B) = P(A) + P(B) when A & B mutually exclusive) let someone design a set of bets you *accept now* that *guarantee* you lose money no matter what. **Key Point:** Coherence is about avoiding *self-sabotage* in your *current* commitments. Use simple numerical examples.
      *   **Updating (Conditional Credences & Learning) (10 mins):** Introduce P(A|B) = "Credence in A *if* I learn B". Stress Bayes' Rule *intuitively*: "How should my belief about A *change* if I learn B happened?" Use a simple medical test example (P(Disease|Positive Test)). **Crucial:** Frame learning as *gaining new information* that rationally *constrains* your beliefs.

  2.  **Introducing Reflection (20 mins): Extending Coherence Over Time**
      *   **The Setup:** "Suppose you think *now*, with certainty (credence 1), that tomorrow your credence in some claim A will be `x`." (e.g., P_tomorrow(A) = 0.7). Write it as: **P_now( P_tomorrow(A) = x ) = 1**
      *   **The Principle:** van Fraassen argues: **Your credence *now* in A should also be `x`. P_now(A) = x.**
      *   **The "Why?" (The Core Intuition):** "If you set P_now(A) to something *other* than `x`, say `y`, then *right now*:
          *   You are *certain* your future self will value a $1 bet on A at $x (willing to pay up to $x for it).
          *   But *you* value that same bet *now* at $y.
          *   If `y < x`, you think it's a *great deal* to sell the bet *now* for, say, $(y+x)/2. But you *know* your future self would happily buy it back at that price! You're setting up a guaranteed loss *to your future self* (which is still *you*).
          *   If `y > x`, you think it's a great deal to *buy* the bet *now* for $(y+x)/2, but you *know* your future self would happily sell it at that price. Again, guaranteed loss.
      *   **The Punchline:** Violating Reflection is like *betting against your future, better-informed self*. It's temporal self-sabotage, analogous to a synchronic Dutch Book. It's extending the *coherence* requirement over time.

  3.  **The One Example: Insurance Renewal (15 mins)**
      *   **The Setup:** "Imagine you (an insurance seller) are assessing Client X's risk for next year. You know that *tomorrow*, after you receive the detailed annual inspection report (which you haven't seen yet), your credence P_tomorrow(Client_X_has_accident) will be 0.04. You are *certain* of this future assessment (maybe the report always dictates this precisely, or you trust the inspector completely)."
      *   **Reflection Says:** Your credence *today*, P_today(Client_X_has_accident), *must* be 0.04.
      *   **Why it Works:**
          *   **Has:** Clear future learning event (getting the report), certainty about future credence, direct link to betting/valuation (insurance pricing!), relatable context for your brother/actuary.
          *   **Lacks:** Memory loss, value changes, self-deception, irrationality. The *only* thing changing is gaining the new info from the report.
      *   **Emphasize:** The future self isn't "wiser" in general; they just have strictly *more information* relevant to A. *That's* why you defer.

  4.  **Tackling Misconceptions (Head Them Off Proactively)**
      *   **Misconception 1: "This means I can never learn or change my mind!"**
          *   **When/Where:** Head this off IMMEDIATELY after stating the principle. *Before* the example.
          *   **Head Off:** "NO! This *requires* you to anticipate learning! It *assumes* your future credence is different *because* you gain new evidence. It tells you how your *current* credence should relate to that *anticipated learning outcome*. It's about *consistency* in how you *respond* to evidence over time."
      *   **Misconception 2: "This means I must always trust my future self blindly!"** (Brother's Trust angle bleeding into incoherence)
          *   **When/Where:** Address this DURING the "Why?" explanation and the Insurance Example. Revisit after the Drunk Case.
          *   **Head Off:** "It's NOT about trust in a person per se. It's about *coherence within your own epistemic trajectory*. If you are *certain* right now about what belief state new evidence *will* lead you to, then *coherence* demands you adopt that state now. It's avoiding a *logical inconsistency* in your own valuations over time. The 'trust' is really trust in your own future *rationality* given the evidence you *know* they'll have."
      *   **Misconception 3: "What if I know I'll be irrational later (like drunk)?"** (Your Instinct is RIGHT)
          *   **When/Where:** Explicitly address this AFTER the core principle and insurance example are solid. *Make* it an objection.
          *   **Head Off:** "THIS is where Reflection *breaks down*, and rightly so! The principle *assumes* your future self is rational *and* has strictly more relevant information. If you know you'll be drunk later and irrationally certain the moon is cheese (P_drunk(MoonCheese)=1), Reflection does *not* say P_sober(MoonCheese)=1! Why? Because you *aren't* certain your future self is *rational* or that their credence reflects *only* new evidence. The synchronic Dutch Book against your drunk self still exists, but avoiding a *temporal* Dutch Book requires trusting your *future rationality*. Skip the drunk case as the foundation!"
      *   **Misconception 4: "This is just about averaging opinions."**
          *   **When/Where:** If it comes up in discussion, or preempt it when contrasting with the insurance example.
          *   **Head Off:** "No. It's not about aggregating different views. It's about *one* agent's beliefs at different times, connected by the *certainty* of learning and rational updating. It's a constraint on a single, evolving perspective."

  5.  **The Actuary vs. Brother Tension: Coherence vs. Trust (10 mins)**
      *   **State the Tension Explicitly:** "So, Actuary, you see this as pure diachronic coherence – avoiding a logical inconsistency in betting commitments over time. Brother, you see it as trusting the person you'll become. Who's right?"
      *   **Resolution:**
          *   **The Actuary is Formally Correct:** The principle is *derived* from the requirement of diachronic coherence to avoid sure losses (temporal Dutch Books). It's a *constraint* within a formal model of rationality.
          *   **The Brother Captures the Phenomenology:** Adopting P_now(A) = x *because* you know P_future(A) = x *feels* like an act of trust or deference towards your future, better-informed self. The formal coherence *results* in what looks like interpersonal trust *within* the single agent.
      *   **The Awkward Truth:** The principle sits *precisely* at the intersection. **Formally, it's coherence (Actuary wins). Psychologically/Ethically, it manifests as a kind of self-trust or non-akrasia (Brother resonates).** Acknowledge both views are valid perspectives on the same mathematical/epistemic constraint. The "trust" is *justified* *because* it's grounded in the expectation of future rationality and evidence.

  6.  **The Landing Gear Check Question (5 mins)**
      *   **The Question:** "Imagine you are certain that after reading a specific, highly reliable report tomorrow, your credence that the new factory will pass its safety inspection (P(Pass)) will be 0.8. According to Reflection, what *must* your credence be *today*? And crucially, *why* can't it be 0.6 today even if you feel pessimistic?"
      *   **Why it Works:** Tests understanding of the principle's core claim (P_now=0.8) and the *reason* (betting against your future self = guaranteed loss). If they articulate the Dutch Book intuition or "betting against myself," it landed. If they just say "0.8" or mumble "trust," probe the "why."

  7.  **What to Skip (Be Explicit!)**
      *   **The Formal Dutch Book Theorem Proof:** "We're relying on the *intuition* of avoiding sure losses, like we did for synchronic coherence. The full proofs exist but involve more decision theory than we need today."
      *   **Generalized Reflection (P(P_future=x) = y ⇒ P_now(A) = ∑[x * y_x])**: "The principle we discussed is the 'certainty' case. There's a more complex version for when you're uncertain about your future credence, involving weighted averages. That's fascinating but beyond our scope today – it builds directly on this foundation."
      *   **Deep Dives into Personal Identity:** "While it feels like 'trusting another person,' we're treating our future self as a rational agent with more info. We won't get into philosophical debates about whether it's *truly* the same person – we're assuming continuity for practical rationality."
      *   **Objections from Memory Loss or Value Changes:** "Reflection assumes only *epistemic* changes (gaining info). If you know you'll *forget* crucial info or your *values* will irrationally shift (not just your beliefs based on new facts), the principle doesn't directly apply. Those are important complications we're setting aside."

  **Why Your Instinct on the Drunk Case is Right:** Building on the drunk case is disastrous. It violates the core assumptions (future rationality, learning only relevant evidence). It makes the principle look obviously false or absurd. It's a *counterexample*, not the paradigm case. Using it first derails understanding. The insurance case provides the *correct* paradigm: rational updating based on anticipated, specific evidence.

  **Session Flow Recap:**
  1.  Credences & Betting (5 mins)
  2.  Synchronic Coherence / Dutch Books (15 mins)
  3.  Updating / Conditional Credences (10 mins)
  4.  **REFLECTION PRINCIPLE** (Setup, Statement, "Why?" Dutch Book) (15 mins)
  5.  Insurance Example (5 mins)
  6.  Tackle Misconceptions (Especially Drunk Case) (10 mins)
  7.  Actuary vs. Brother Resolution (10 mins)
  8.  Landing Question (5 mins)
  9.  Explicit Skipping (Throughout, but summarize at end) (5 mins)

  **Total:** ~90 mins. Be disciplined on time. This sequence builds logically, addresses pitfalls proactively, leverages your group's strengths (insurance context!), clarifies the core tension, and provides a clear check for understanding. Good luck!
