prompt: |-
  Imagine Thorstein Veblen confronted with a contemporary synthesis that unifies costly signaling and the handicap principle and analyses any display along two axes: whether its cost is pure waste or a byproduct of a genuinely useful process, and whether it is an unfakeable index or a strategic signal that can be faked at a price. The synthesis is then applied to luxury branding, academic credentials, political protests, and online virtue signaling. Predict Veblen's position: would he regard this synthesis as a natural extension of his account of conspicuous consumption and conspicuous waste, or as a betrayal of it? Would he accept the handicap principle as an explanation of human social display, or insist that the relevant costs are socially constructed and status-driven rather than biologically honest? Where would he locate explanatory power—in the cost of the signal, in the audience's interpretation, or in the institutions that stabilize meaning? What would he identify as the synthesis's most important error about modern status competition?

  Return a JSON object with fields: predicted_position (one paragraph), agreement_points (array of strings), disagreement_points (array of strings), key_veblenian_concepts_used (array of strings), mapping_to_modern_phenomena (object with keys luxury_branding, academic_credentials, political_protests, online_virtue_signaling, each a string), anachronism_risk (one of low, medium, high, plus one sentence), and confidence (a number from 0 to 1 with one sentence of justification).
reasoning: |-
  Hmm, the user wants me to imagine how Thorstein Veblen would react to a contemporary synthesis of costly signaling and the handicap principle. This synthesis analyzes displays along two axes: cost as waste versus byproduct of usefulness, and signals as unfakeable index versus strategically fakeable. It's applied to luxury branding, academic credentials, political protests, and online virtue signaling.

  I need to predict Veblen's position on several aspects. Would he see this as an extension or betrayal of his conspicuous consumption theory? Would he accept the handicap principle? Where would he locate explanatory power? What would he identify as the synthesis's most important error about modern status competition?

  I recall Veblen's key ideas from "The Theory of the Leisure Class": conspicuous consumption, conspicuous leisure, conspicuous waste, pecuniary emulation, and the importance of social institutions in establishing status symbols. His framework is deeply sociological and institutional, focusing on how capitalism shapes wasteful displays.

  For the JSON response, I'll need to structure my answer carefully. The predicted_position should be a paragraph explaining his likely view that this synthesis is a partial extension but incomplete. Agreement points could include his recognition of waste as signal and the role of cost barriers. Disagreement points would cover his rejection of biological honesty, emphasis on social construction, and different view of institutions. Key Veblenian concepts would be those I mentioned earlier.

  For mapping to modern phenomena:
  - Luxury branding: He'd see it as pure conspicuous waste
  - Academic credentials: Mixed - some useful byproduct but corrupted by conspicuous waste
  - Political protests: Potential useful byproduct but often co-opted as strategic signaling
  - Online virtue signaling: Conspicuous waste with low-cost strategic fakery

  Anachronism risk is medium since I'm applying his 19th century framework to digital contexts he couldn't foresee. Confidence is high (0.9) because the core of his theory remains remarkably applicable to status displays.

  The most important error Veblen would identify is the synthesis's neglect of how status competition itself drives cost inflation through emulation rather than biological constraints.
