answer: |-
  Here is a prioritized research agenda for your doctoral student, grounded in your concerns and constraints. The ordering balances **conceptual upstreamness**, **tractability with philosophical tools**, **neglect due to disciplinary blind spots**, and **downstream impact** on political philosophy/institutional design. I explicitly name trade-offs and contested premises. 

  ### **Ranking Criteria**
  1. **Upstreamness**: Must resolve foundational questions before others can advance.
  2. **Tractability**: Uses fixed-point methods, implementation, or aggregation machinery (no econometrics).
  3. **Neglect**: Underexplored due to economists’ focus on outcomes over processes.
  4. **Downstream Impact**: Could reshape rights theory, constitutional design, or mechanism design.
  5. **Dead Ends**: Avoids incremental tweaks to Sen’s framework.

  ---

  ### **The Agenda (Ordered by Priority)**
  1. **Formalize "Metarights" (Values that Structure Counting)**  
     **Focus**: Your second idea—rights as constraints structuring aggregation, not inputs counted. Formalize how a "right" partitions the space of admissible profiles or defines equivalence classes over social states *before* preferences are aggregated.  
     **Why First?**  
     - *Upstream*: Until we clarify whether rights filter profiles or compete with preferences, other models inherit ambiguity.  
     - *Tractable*: Use topology/fixed points to model rights as pre-conditions on the domain (e.g., "No profile where A dictates B’s religion is admissible").  
     - *Neglected*: Economists treat rights as preferences or constraints *within* aggregation; philosophers rarely formalize "structuring" roles.  
     - *Downstream Impact*: If successful, reorients constitutional design (rights as "meta-rules" for democratic deliberation).  
     **Contested Premise**: *That rights are categorically distinct from preferences*. If false, this collapses into standard social choice. **Move up** if you can show distinct behavior under perturbation (e.g., rights as invariant to preference intensity).  
     **Trade-off**: Requires philosophical legwork to define "structuring values" non-arbitrarily—but your student’s skills suit axiomatization.  

  2. **Rights as Process Control (Choice Situation Design)**  
     **Focus**: Your first idea—rights as shaping the *process* (e.g., agenda-setting, information revelation), not vetoing outcomes. Model the right-holder as selecting a game form or information structure, with outcomes determined by equilibrium play.  
     **Why Second?**  
     - *Upstream*: Builds on (1)—if rights structure aggregation, process control is a natural mechanism.  
     - *Tractable*: Use implementation theory (e.g., rights as selecting subgames or message spaces). Philosopher’s edge: Normative constraints on "admissible processes" (e.g., no humiliation).  
     - *Neglected*: Game forms focus on *outcomes* of rights-exercises; less on *how* the game is chosen.  
     - *Downstream Impact*: Clarifies institutional design (e.g., referendum vs. parliamentary procedures as rights).  
     **Contested Premise**: *That individuals can coherently rank processes*. **Move down** if process preferences reduce to outcome preferences. **Defend** by requiring only ordinal comparisons over procedural features (e.g., "public deliberation > secret vote").  

  3. **Agenda Power as Rights (With Manipulation-Proofness)**  
     **Focus**: Your colleague’s idea—rights as control over which pairs are compared. Axiomatize when agenda-setting powers avoid Sen’s paradox or generate new impossibilities (e.g., agenda manipulation forcing cycles).  
     **Why Third?**  
     - *Builds on (1)/(2)*: Agenda control is a species of process control.  
     - *Tractable*: Extend tournament theory or McKelvey’s chaos theorems to rights-holders.  
     - *Downstream Impact*: Guides judicial review (when courts should invalidate agenda restrictions).  
     **Dead End Warning**: Pure agenda-manipulation literature often ignores rights, treating agenda-setters as strategic agents. **Avoid** by tying agenda power to *protected personal spheres* (e.g., "A controls agenda on {x,y} only if x,y differ solely in A’s private domain").  

  ---

  ### **What to Deprioritize (Dead Ends & Zombies)**  
  - **Alienable Rights**: Requires interpersonal utility comparisons or ad hoc waiver rules. Economists keep publishing here, but it dodges the core paradox: *how rights enter aggregation*.  
  - **Domain Restrictions**: "No meddlers" conditions are mathematically neat but philosophically empty—rights shouldn’t depend on others’ preferences.  
  - **Weakening Pareto**: Sacrifices collective rationality for consistency; rarely informs new rights models.  

  ---

  ### **Why This Order? Logical Dependencies**  
  - Without (1), (2) and (3) risk reproducing Sen’s framework in new clothing (e.g., "process" preferences become another input to aggregate).  
  - (1) provides axioms for (2): Rights structuring aggregation define what counts as a "legitimate process."  
  - (3) tests (2) concretely: Agenda control is a formalizable instance of process control.  

  ### **Feasibility within 3 Years**  
  - **Year 1**: Formalize "metarights" (1). Define minimal properties (e.g., idempotence: applying rights twice changes nothing). Use fixed points to find consistent aggregators.  
  - **Year 2**: Apply to process control (2). Use implementation theory—rights as selecting mechanisms.  
  - **Year 3**: Explore agenda manipulation (3) as application. Connect to constitutional design (e.g., when agenda powers protect minorities).  
  - **Your Role**: In the semester + reading group, tackle the "structuring values" problem in (1)—this needs philosophical heavy lifting.  

  ### **If Successful, What Changes?**  
  - **Political Philosophy**: Rights shift from "trumps" to *constitutive rules for legitimate collective choice*.  
  - **Institutional Design**: Courts/designers ask, "Does this procedure respect rights-structured domains?" not "Does this outcome violate a veto?"  
  - **Mechanism Design**: New mechanisms where rights *enable* efficient outcomes by restricting admissible strategies.  

  This agenda treats Sen’s result not as a paradox to solve but as a diagnostic that the *frame* is wrong. The leverage is in redefining rights’ role in aggregation—precisely where philosophers outperform economists.
