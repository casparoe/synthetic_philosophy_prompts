prompt: |-
  OK so I'm a PhD student in philosophy of economics and my officemate Devi and I have been having the same fight since last spring, and at this point I think we should just write the damn thing down together. The fight is about coherence arguments for expected utility maximization -- the whole family: Dutch books, money pumps, the "you can be made to lose for sure" line, representation theorems, the lot. I'm on the side that says these arguments establish a genuine rational requirement. She's on the side that says they establish something much weaker -- at most that your attitudes are jointly unsatisfiable, and only under a pile of extra assumptions about what you're willing to accept and when.

  I want you to play the role of a decision theorist who knows this material cold, has taught the standard representation results, and can also do the formal side. Think carefully before you write, and start by brainstorming on the side: which parts of our dispute are real, which are us talking past each other, and what a fair version of each of our positions would actually say. Then produce the joint statement we should sign. No citations or reading lists needed, I know the literature.

  The document:

  1. A numbered list of agreed claims. Real ones, not "we both agree decision theory is interesting." What do the theorems prove and not prove? What do the exploitation arguments presuppose? What's the difference between a representation result and a rationality claim? I'd rather have ten sharp agreed claims then twenty waffly ones.
  2. A disagreements table, one row per disagreement: (a) the disagreement in wording neutral between us; (b) my formulation, in words I'd accept as mine; (c) her formulation, in words she'd accept as hers; (d) the crux -- the sub-question such that settling it would force one of us to move; (e) something we both already agree bears on that crux (a case, a formal result, a hypothetical experiment, a consistency check); (f) what each of us predicts about how that thing comes out.
  3. A short section on which parts of our fight are on reflection merely verbal -- different senses of "rational", "required", "coherent", "exploitable" -- and which parts look verbal but aren't.
  4. Anything we both agree would be a decisive result: a theorem or finding that would actually end one of the rows.

  Some things I specifically want both of us pinned down on, because I think this is where the action is:

  - The payoff-unit problem. A Dutch book has to be stated in some payoff currancy. If it's money, you need the agent to be roughly risk-neutral in money, which almost nobody is. If it's utility, you've helped yourself to the thing you were supposed to be deriving, since utility is standardly recovered from preferences by a theorem that already assumes probability. So: is the argument only about a narrow class of risk-neutral agents, or is it circular, or is there some third option? I want us both on record.
  - The partition problem. EU maximization isn't even defined until you fix a partition of states, and you can get different rankings of the same acts under different partitions. Coherence arguments hand you a probability function over whatever algebra you give them; they don't tell you which algebra. Does rationality require a particular algebra, which one, and does any of these arguments say?
  - The pump needs an extra premise. Diachronic pumps seem to need naivety, or a willingness to pay to switch, or some assumption about the agent's decision procedure (no precomittment, no policy of refusing trades). Synchronous Dutch books seem to need the agent to accept a whole bundle of bets at once, including ones she'd never be offered. Is that extra premise itself a rational requirement, or a substantive and optional assumption about agency?
  - Idealization. The bookie is logically omniscient; the agent has to take bets on propositions whose implications she hasn't worked out. Does the argument say anything about us, or only about ideal agents -- and does that matter for whether an incoherent human is irrational?
  - The triviality worry. If utility is just whatever makes your preferences satisfy the axioms, is "maximize expected utility" a substantive claim about rationality at all, or a definition dressed up as a theorem?
  - Completeness. The representation results want a complete preference order. Is rational incompleteness possible, and if so does the pump show it's impermissible?

  Don't just tell me what's in the literature. The point is to draft text Devi and I could both actually sign, which means formulations that are neither vacuous nor slanted. If you find a row where the honest answer is "this isn't a disagreement about anything", say so and cut it. And at the end, tell me how confident you are in the main agreed claims, and single out the one point in the whole document you're least sure of -- if a row is basically you guessing at how a philosopher would phrase something, flag that too.
