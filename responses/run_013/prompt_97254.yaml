  ### Scoring Key  
  After completing the quiz, compare your answers to the patterns below. Each pattern corresponds to a philosophical position on "wrong kind of reasons" cases. If your answers match a pattern, you likely align with that position. If they don’t match any, see the "Notes" section.  

  1. **Object-Based Reasons Only**  
     You think reasons for an attitude (e.g., admiration, belief) must be about the object itself (e.g., the demon’s traits, the job’s qualities). Non-object-based reasons (e.g., threats, rewards) aren’t real reasons for the attitude—they’re reasons to want or act as if you have it.  
     - **Answers**: Q1:B, Q2:B, Q3:B, Q4:A, Q5:B, Q6:B, Q7:B, Q8:B, Q9:B  

  2. **Question-Relative Reasons**  
     You think reasons must bear on the question the attitude answers (e.g., admiration answers "Is this admirable?"). If a reason doesn’t relate to that question (e.g., a threat doesn’t make the demon admirable), it’s not a real reason for the attitude.  
     - **Answers**: Q1:B, Q2:B, Q3:B, Q4:A, Q5:B, Q6:B, Q7:B, Q8:A, Q9:B  

  3. **Deflationist or Pluralist (Indistinguishable)**  
     - **Deflationist**: You think all reasons are "real," even non-object-based ones (e.g., threats, rewards). They just might be outweighed by other reasons (e.g., evidence).  
     - **Pluralist**: You think there are two kinds of reasons (object-based and non-object-based), both real, but only object-based ones make the attitude "fitting."  
     This quiz cannot distinguish these; both give the same answers.  
     - **Answers**: Q1:A, Q2:A, Q3:A, Q4:A, Q5:A, Q6:A, Q7:A, Q8:A, Q9:A  

  4. **Pragmatist About Belief**  
     You think practical reasons (e.g., outcomes, incentives) can be real reasons for belief, not just for actions. For non-belief attitudes (e.g., admiration, anger), you default to object-based reasons.  
     - **Answers**: Q1:B, Q2:B, Q3:B, Q4:A, Q5:A, Q6:A, Q7:B, Q8:B, Q9:C  

  5. **Reject Fitting-Attitude**  
     You think goodness shouldn’t be defined by what’s "fitting to value." Reasons for attitudes are often indirect (e.g., only reasons to act or cultivate feelings, not for the attitude itself).  
     - **Answers**: Q1:B, Q2:B, Q3:B, Q4:B, Q5:B, Q6:B, Q7:B, Q8:B, Q9:B  

  6. **Attitude-Transformation**  
     You think incentives/threats change the attitude’s nature (e.g., "admiration" under threat isn’t real admiration). This only appears in specific cases.  
     - **Answers**: Q1:C, Q7:C. For other questions, you typically chose B (like Object-Based).  

  **Notes**:  
  - **Indistinguishable Positions**: Deflationist and Pluralist (Position 3) cannot be told apart with this quiz. Both answer "A" to all questions.  
  - **Unmatched Patterns**: If your answers don’t fit any position, it’s likely because:  
    - You have a hybrid view (e.g., pragmatist about belief but reject fitting-attitude for emotions). No major theory advocates this, but it’s coherent.  
    - Your pattern is inconsistent (e.g., mixing A/B randomly). This might reflect ambivalence, not a known position.  
  - **Ineffective Question**: Q4 (gratitude) doesn’t separate positions well. All positions except Reject Fitting-Attitude say "A" if the object-based reason exists (e.g., the help). Only Reject Fitting-Attitude says "B" consistently.  

