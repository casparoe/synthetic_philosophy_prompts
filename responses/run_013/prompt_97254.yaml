  ### Quiz Questions  
  For each scenario, choose the answer that best reflects your view.  

  1. **Demon Threat**: A demon says he’ll torture you unless you admire him. Do you have a reason to admire him?  
     A) Yes—avoiding torture is a real reason to admire him.  
     B) No—he isn’t admirable. I only have a reason to *want* to admire him or *act* admiring.  
     C) Not possible—any feeling I produce wouldn’t be admiration, just a similar emotion.  

  2. **Boss Payment**: Your boss offers you money to genuinely like your job. Do you have a reason to like your job?  
     A) Yes—the money is a real reason to like it.  
     B) No—I only have a reason to *make myself* like it. Whether I like it depends on the job itself.  

  3. **Coach’s Advice**: A coach says your team plays better when you’re angry at the opponents. Do you have a reason to be angry at them?  
     A) Yes—helping the team win is a real reason to be angry.  
     B) No—they didn’t wrong me. I only have a reason to *pretend* or *act* angry.  

  4. **Owed Gratitude**: Someone says you owe gratitude to a person who helped you (you don’t feel it). Do you have a reason to feel grateful?  
     A) Yes—because they helped me, I should feel grateful.  
     B) No—feelings can’t be forced. I only have a reason to *act* grateful or *cultivate* gratitude.  

  5. **Belief for Success**: Believing you’ll pass a test makes you more likely to pass. Do you have a reason to believe you’ll pass?  
     A) Yes—increasing my chances is a real reason to believe it.  
     B) No—I should only believe based on evidence. I have a reason to *want* to believe, not to believe.  

  6. **Trusting Your Doctor**: Trusting your doctor makes your medicine work better. Do you have a reason to trust your doctor?  
     A) Yes—improving treatment is a real reason to trust.  
     B) No—trust should be based on the doctor’s skill. I have a reason to *want* to trust, not to trust.  

  7. **Fear for Money**: A scientist pays you to become genuinely afraid of a harmless spider. Do you have a reason to be afraid?  
     A) Yes—the money is a real reason to be afraid.  
     B) No—it’s harmless. I only have a reason to *act* afraid.  
     C) Not possible—fear requires seeing danger, so this wouldn’t be real fear.  

  8. **Intention Under Threat**: A mobster will break your legs unless you intend to pay him. Do you have a reason to intend to pay?  
     A) Yes—avoiding harm is a real reason to intend.  
     B) No—I don’t owe payment. I only have a reason to *act* as if I intend.  

  9. **Belief vs. Family**: You have strong evidence a candidate is dishonest, but your family will disown you if you believe it. Do you have a reason to believe they’re dishonest?  
     A) Yes—the evidence is a reason to believe, and disownment is a reason not to (they conflict).  
     B) Only the evidence is a reason—disownment isn’t about the candidate’s honesty.  
     C) Disownment is a reason to believe they’re *honest* (even against evidence).
