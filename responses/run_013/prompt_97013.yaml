  I need to build a case where two paintings are perceptually identical, created under different circumstances, with no deception involved. The copy must be made by a serious artist who arguably worked harder than the original creator. The artist should have only seen photographs and technical records, not the original painting itself.

  The scenario should be realistic - set in the contemporary art world without sci-fi elements. I must avoid any fraud or deception - nothing is being passed off as something it's not. The copyist should be a recognized artist who put in more technical effort than the original creator.

  For point one, I'll describe the scenario: an original painting by a self-taught artist who painted intuitively, and a copy by a technically skilled artist who reconstructed it from documentation. Both are indistinguishable.

  For point two, View A would say they have equal value since they look identical and create the same experience.

  For point three, View B would value the original higher due to its unique creation history - the original artist's direct expression versus the copyist's reconstruction.

  For point four, I'll identify that what's doing the work is the difference in creative intention - the original as direct expression versus the copy as reconstruction. If this were removed (if both had similar creative processes), the valuations would converge.

  For point five, I'll show how a skeptic might dismiss View B as snobbery, arguing that the physical objects are what matter, not art market narratives.

  I'll follow all the formatting requirements: five numbered points, British English, concise sentences, no citations or further reading needed. The thought experiment should clearly demonstrate the conflict between these views without rigging the outcome toward either position.
answer: |-
  1.  **Scenario:** A celebrated, intensely expressive abstract painting ("Red Composition") is created rapidly by Artist A, a self-taught recluse working purely on instinct. Decades later, distinguished Artist B, renowned for technical mastery and reconstructive analysis of damaged works, painstakingly recreates "Red Composition" using only high-resolution photographs, pigment analysis reports, and canvas weave documentation provided by the museum holding the original. Artist B's process takes years, involving meticulous layering and brushwork experimentation to achieve perceptual parity. Both paintings are now displayed side-by-side in a museum, clearly labelled as original and reconstruction, under identical conditions. No expert or scientific test can distinguish them visually or experientially.

  2.  **View A Verdict:** A holds both paintings are aesthetically equal. The aesthetic value supervenes entirely on the perceivable properties of the object – colour, form, texture, composition, and the immediate phenomenological experience they provoke. As these properties are identical in both objects, their aesthetic merit is identical. The history of production is irrelevant to the *aesthetic encounter* itself; only the presented object matters.

  3.  **View B Verdict:** B holds the original "Red Composition" possesses greater aesthetic value. The value does not supervene solely on the object's perceivable properties but also on its history of production. The original's value stems crucially from its genesis as the direct, unmediated expression of Artist A's unique sensibility and intention at that specific moment. Artist B's work, despite its technical brilliance and greater effort, is a reconstruction *of* that specific historical act. Its value is derivative, arising from its success in mimicking the outcome of A's original creative act, not from being the instantiation of that act itself. The history – A's creation as the primary, originating instance – is an inseparable part of what makes the *work* the work and confers its specific value.

  4.  **Key Feature & Its Removal:** The feature doing the work is **the fundamental difference in the *type* of creative act – originating expression versus reconstructive mimicry.** If removed (e.g., if Artist B had independently painted an identical-looking work *before* Artist A, or if both were equally original expressions created simultaneously but independently), View A's verdict would remain unchanged (equal value based on appearance). View B's verdict would collapse or require significant reformulation; without the original's status as the *source* or *first instance* of that specific expression, the core historical distinction driving its higher valuation disappears. B might then struggle to find a relevant historical difference to justify unequal value.

  5.  **Skeptic's Attack:** A skeptic dismissing B as snobbery would argue: "This proves nothing about inherent artistic value, only about art market fetishism and historical sentimentality. The objects are identical. Any perceived difference in value is purely external – a story we tell ourselves about 'originality' driven by rarity, investment, and romantic notions of the artist-genius. Artist B demonstrably achieved the same result through harder work and superior skill. To privilege A's version is irrational bias; the physical painting and the experience it delivers are all that truly matter. B's argument just mystifies the object with unnecessary historical baggage."
