prompt: |-
  I teach a second-year metaphysics unit and I've got one 90-minute session with about 18 students to do Al-Ghazālī's occasionalism — the view that nothing created has any causal power of its own, and that what we call a cause is just the orderly habit in which God keeps producing one thing after another. On the page it lands as a quaint medieval oddity; they nod, they write it down, they leave thinking no-one could really believe it. What I want is for them to actually feel the vertigo: that the necessity they're so sure they see between cause and effect isn't seen at all, that it's a projection, and that once you drop it the world turns into a sequence of free-standing events rather than a web of powers — and, weirdly, that "miracle" stops being dramatic, because if there was never any necessity there's nothing for a miracle to violate.

  Please design me a runnable in-class activity that gets them there through what happens, not through me explaining it. Crucially I don't want them to just re-run the Hume lecture they've half-remembered — I want the Ghazālī flavour: a voluntary habit that could be otherwise, and events that are decreed fresh each time rather than pushed along by anything inside the things themselves. So here's the thing I'd like you to build the whole activity around, because it's what makes it not-Hume: one of the students secretly plays the Sustainer, and everything the rest observe is just the Sustainer's ongoing decree. The investigators watch a run of pairings (this lever, then that lamp lights; this powder, then that colour) and naturally start attributing powers to the objects and betting on the next outcome. The Sustainer is told to be mostly consistent — I was thinking a written "habit ledger" they fill in each round — but with a limited number of times they're allowed to break their own pattern, and when they do, the investigators' "laws" fail without any law having been broken. I'd like the discovery that there was an agent behind the whole thing to come near the end, and for them to feel the shift from "these objects have powers" to "these events are just regularly paired."

  Give me: the roles and how to assign them, the materials (nothing expensive — cards, a torch, a few household bits), the rules, a rough timeline for the 90 minutes, a scoring scheme so it stays fun without real money, and a debrief that maps specific moments in the game onto bits of the position. Also tell me what will predictably go wrong the first time I run it and how to handle it, and be honest about which feature of occasionalism the game can't reproduce and that I'll have to supply myself in the debrief. Write the whole thing in British English please.
reasoning: |-
  We are going to design a classroom activity called "The Sustainer's Habit" to illustrate Al-Ghazālī's occasionalism.

  Key elements:
  - One student is the "Sustainer" (God's role) who decides the outcomes of events according to a mostly consistent habit but with occasional breaks.
  - The rest of the students are "Investigators" (metaphysicians) who observe and try to predict outcomes and form causal theories.
  - The goal is for the Investigators to experience the shift from attributing causal powers to objects to realizing that events are just paired by the Sustainer's habit.

  Materials:
  - A lever (could be a light switch or a cardboard lever) and a lamp (a desk lamp or torch).
  - Coloured powders (e.g., non-toxic food colouring in separate containers) and a clear liquid (water) in a beaker or glass.
  - A whiteboard or flip chart for the Sustainer to record the "habit ledger" (but this will be kept secret until the end).
  - Cards for the Sustainer: one set for the lever/lamp (e.g., "light on", "light off") and another set for the powder/liquid (e.g., "red", "blue", "no change", etc.).
  - A bell or buzzer to signal the start/end of rounds.
  - Score sheets for Investigators to record predictions and a scoring system.

  Roles and Assignment:
  - Assign one student as the Sustainer (by drawing lots or volunteer). This student should be discreet and able to keep a secret. They are given the habit ledger and rules for breaking the habit.
  - The rest (about 17) are Investigators. They form groups of 3-4 (so about 4-5 groups) to discuss and record their predictions.

  Rules for the Sustainer:
  - The Sustainer has two sets of events to manage: 
    a) Lever and Lamp: When the lever is pulled, the lamp may light or not.
    b) Powder and Liquid: When a powder is added to the liquid, it may change colour or not.
  - The Sustainer fills in a pre-written habit ledger at the start (hidden from the class) that specifies the normal outcome for each cause. For example:
      - Lever pulled: lamp lights (normal habit) but with one exception (break) allowed in 10 trials.
      - Powder A: turns red (normal), but with one break allowed.
      - Powder B: turns blue (normal), but with one break allowed.
  - The Sustainer is allowed to break the habit a limited number of times (e.g., 3 breaks in total for all events over 15 rounds). The breaks must be used at different points (so not all in one event type).
  - The Sustainer records each event outcome in a private ledger (so they remember the habit and breaks). They must be consistent except for the breaks.

  Rules for Investigators:
  - The Investigators observe the events and, in their groups, discuss and record:
     a) What they think the causal power of the object is (e.g., "the lever turns on the lamp", "powder A turns liquid red").
     b) Predict the outcome for the next trial (they must write it down before the event).
  - Each group gets points for correct predictions (1 point each). They also get a chance to bet extra points (up to 3) on a trial they feel very confident about (but only once per group).

  Timeline (90 minutes total):

  1. Introduction (10 minutes):
     - Set the scene: "Today we are going to investigate the nature of causation. You are a team of metaphysicians observing a series of events. Your job is to figure out the causal laws at work."
     - Explain the two types of events: 
          (a) The Lever-Lamp: when the lever is pulled, what happens to the lamp?
          (b) The Powder-Liquid: when a powder is added to the liquid, what colour does it become?
     - Assign roles: one Sustainer (without revealing the full role to the class) and the rest as Investigators in groups.

  2. Round 1: Training (5 minutes):
     - The teacher demonstrates one trial of each event without the Sustainer (to show the setup). For example, pull the lever and the lamp lights; add powder A and the liquid turns red.

  3. Rounds 2-16: The Experiments (50 minutes):
     - Each round consists of:
          a) The teacher announces the event type and the specific cause (e.g., "We are now going to pull the lever" or "We are adding powder B").
          b) The Investigators, in their groups, write down their prediction for that event (and optionally place a bet if they haven't used their one bet yet).
          c) The Sustainer then decides the outcome (following their habit ledger, but using a break if they choose). They physically perform the action (or the teacher does based on their instruction to keep the Sustainer hidden? - but we want the Sustainer to be active). Alternatively, to keep the Sustainer secret, the teacher can be the one to pull the lever or add powder, but the Sustainer secretly informs the teacher of the outcome (via a note or whisper) just before the action.
          d) The outcome occurs (lamp lights or not; liquid changes to a colour or remains clear).
          e) The teacher records the outcome publicly (on a board) without comment.
          f) The Investigators record the outcome and adjust their theories.
     - We do 15 rounds, alternating between lever and powder events. The Sustainer uses their breaks (say 3 times) at pre-planned or chosen points (but within the limit).

  4. Mid-Game Discussion (10 minutes):
     - After about 8 rounds, pause and ask the Investigators:
          - "What patterns are you seeing?"
          - "What causal powers do you attribute to the lever? To the powders?"
          - "How confident are you in your predictions?"

  5. Rounds 17-21: The Breaks (10 minutes):
     - The Sustainer uses their remaining breaks (if any) in these rounds. They should break the habit in a way that surprises the Investigators (e.g., the lever is pulled and the lamp doesn't light, or powder A is added and the liquid turns blue).

  6. Revelation and Final Round (5 minutes):
     - The teacher stops the game and reveals the role of the Sustainer: "You might have noticed some unexpected events. There's a reason: one of you has been acting as the Sustainer, deciding the outcome of each event according to a habit, but with a few breaks. The Sustainer, please come forward and show your habit ledger."
     - The Sustainer reveals the ledger and explains where they broke the habit.

  7. Debriefing (20 minutes):
     - Map the game to Al-Ghazālī's occasionalism:
          a) The events were not connected by necessity but by the Sustainer's habit.
          b) The breaks were not violations of a law because there was no inherent power in the objects - just a habit that changed.
          c) The Investigators projected necessity onto the events, but the Sustainer was free to change at any time.
          d) The "miracles" (breaks) were not dramatic violations of nature because there was no nature (in the sense of necessary causal powers) to violate - just a change in the pattern.
     - Discuss the shift: from objects having powers to events being paired by the Sustainer's will.

  Scoring Scheme:
  - Each correct prediction: 1 point.
  - Each bet: if correct, they get the number of points they bet (so betting 3 and being right gives 3 extra points). If wrong, they lose the bet amount (so -3).
  - The group with the most points wins (prize: perhaps a chocolate bar or just bragging rights).

  What might go wrong:
  - The Sustainer might be too obvious (e.g., giggling or looking at the ledger conspicuously). Solution: choose a discreet student and have them sit at the front with the teacher, and the ledger can be a small notebook.
  - The Investigators might not take it seriously. Solution: emphasize the competitive aspect (scoring) and the mystery.
  - The breaks might be too frequent or infrequent. Solution: the teacher should pre-set the habit ledger with the Sustainer and ensure breaks are spaced and not too many (3 breaks in 15 rounds is about 20%).
  - Time: 50 minutes for 15 rounds might be tight. Solution: keep rounds quick (about 3 minutes per round). Alternatively, reduce the number of rounds (maybe 10 rounds) and adjust breaks accordingly.

  Feature the game can't reproduce:
  - In Al-Ghazālī, God is not just a hidden agent but the only real cause. The game might leave the impression that the Sustainer is just a human intervening, rather than the continuous sustainer of every event. In the game, the events are still caused by the teacher or Sustainer physically, whereas in occasionalism, even the physical actions are directly caused by God. 
    - How to handle: In the debrief, emphasize that in the game, the Investigators saw the lever being pulled as a cause, but in reality (according to occasionalism) even the pulling of the lever is an event that is directly caused by God. The game simplifies by having the Sustainer only decide the outcome, but in reality, every event (the pulling, the lighting, etc.) is a direct act of God. This is a crucial point to make in the debrief.

  Materials in Detail:
  - Lever and Lamp: Use a simple cardboard lever attached to a box. Inside the box, have a torch (flashlight) that the Sustainer can turn on or off by a hidden switch (or by covering the light with a hand). Alternatively, use a desk lamp with a switch that the Sustainer can access without being seen (e.g., under the table).
  - Powder and Liquid: Use three small containers of powder (flour with food colouring: red, blue, and yellow). The liquid is water in a clear glass. The Sustainer can have pre-mixed small amounts of coloured water in hidden containers to add when "breaking" the habit (e.g., using a pipette to add colour without the powder) or they can simply say the colour and the teacher changes it (if using a projector, use images). Alternatively, use non-toxic indicators (like red cabbage juice) that change colour with vinegar or baking soda, but then the Sustainer must control the addition of the real agent. To keep it simple, we'll have the Sustainer decide and then the teacher (or Sustainer) just announces the colour change (if we cannot do it physically without revealing the trick). 
    - However, to maintain the illusion, we must have a physical change. So, if we use food colouring, the Sustainer can have a hidden way to change the water (e.g., a second glass that is switched, or a hidden dye tablet dropped in). But this might be too complex. Alternatively, the teacher can do the physical part, and the Sustainer passes a note for the outcome.

  Revised for simplicity and secrecy:
  - The teacher is the one who physically performs the actions (to avoid the Sustainer being seen manipulating the outcomes). The Sustainer sits at the front and, before each event, writes the outcome on a card and hands it to the teacher. The teacher then reads it and performs the action accordingly (for the lamp, the teacher can control the switch; for the liquid, the teacher has a set of hidden dyes to add to the water to produce the colour or uses pre-coloured water in a hidden container to swap). This way, the Sustainer's role is secret until the end.

  Alternative for the liquid: 
  - Use three powders (A, B, C) and a clear liquid. The Sustainer decides the outcome (colour) for each powder in each trial. The teacher has a way to produce any colour (e.g., by having a set of hidden syringes with food colouring that can be injected into the water just after adding the powder, or by having the powder in a container that already has a hidden dye). But to avoid complexity, we can simulate the colour change by having the Sustainer hold up a coloured card (red, blue, green, or clear) after the powder is added, and the teacher then projects that colour on a screen (using a computer) or holds up a large card. Then the Investigators see the colour without any actual chemical reaction.

  Given time constraints and materials, the card method might be easiest.

  Final Plan for Materials:
  - Lever-Lamp: A cardboard lever that doesn't actually connect to anything. The teacher flips a switch on a lamp based on the Sustainer's instruction (so the lamp is controlled by the teacher under the table).
  - Powder-Liquid: Three containers with white powder (flour or cornstarch) and one clear glass of water. The Sustainer decides the colour (red, blue, yellow, or no change). The teacher then holds up a coloured card (or changes a PowerPoint slide) to show the resulting colour. Alternatively, use a digital simulation.

  Habit Ledger Example (for Sustainer):
  - Lever: Habit is "light on" for 7 times, then one break (light off). Then continue with light on until the next break (if any).
  - Powder A: Habit is "red" for 5 times, then one break (e.g., blue). Then back to red.
  - Powder B: Habit is "blue" for 5 times, then one break (e.g., no change).
  - Powder C: Habit is "yellow" for 5 times, then one break (e.g., red).
  But the Sustainer has only 3 breaks in total, so they must plan accordingly.

  The teacher should prepare the ledger with the Sustainer before the class.

  British English throughout: done.

  Let's write the full activity plan accordingly.
answer: |-
  Below is a complete 90-minute in-class activity designed to immerse students in Al-Ghazālī’s occasionalism, using the "Sustainer" mechanic to evoke the "vertigo" of a world without inherent causal powers. The focus is on experiential discovery—students *feel* the shift from projecting necessity onto objects to seeing events as divinely decreed habits. Materials are low-cost and household-based. I’ve included a timeline, troubleshooting, and a debrief linking gameplay to Ghazālī’s ideas.

  **Activity Title:** The Sustainer’s Habit: An Occasionalism Simulation  
  **Objective:** Students experience how "causes" are merely God’s consistent habits, not powers in objects, and how "miracles" are simply changes in divine decree.  

  ---

  ### **Materials** (Total cost: under £10; most items can be borrowed)  
  1. **Event Props**:  
     - **Lever & Lamp**: A cardboard lever (cut from a box) and a torch ("lamp").  
     - **Powder & Liquid**: Three jars labelled A, B, C (fill with identical flour or cornflour; add food colouring to make them *look* different, e.g., A=pink, B=blue, C=yellow). One clear glass of water ("liquid").  
     - **Outcome Cards**: For Sustainer: 10 cards saying "LIGHT ON", 10 saying "LIGHT OFF" (lever); 10 cards each for "RED", "BLUE", "NO CHANGE" (powder).  
  2. **Sustainer Tools**:  
     - **Habit Ledger**: A notebook with pre-filled habits (e.g., "Lever: Usually LIGHT ON", "Powder A: Usually RED").  
     - **Break Tokens**: 3 coins/buttons (allow 3 habit breaks).  
  3. **Investigator Tools**:  
     - **Prediction Slips**: Small papers for writing bets.  
     - **Group Theories Sheet**: A3 paper for recording "causal laws".  
     - **Scoreboard**: Whiteboard to track group points.  
  4. **Other**: Timer, bell (for rounds), envelopes (for secret roles).  

  ---

  ### **Setup & Roles** (5 minutes)  
  - **Assign Roles**:  
    - **Sustainer (1 student)**: Secretly chosen via a marked slip in an envelope ("You are the Sustainer—keep this secret!"). They sit apart with the Habit Ledger and Break Tokens.  
    - **Investigators (17 students)**: Split into 4 groups (4–5 per group). Each group gets Prediction Slips, a Theories Sheet, and pens.  
  - **Teacher’s Role**: Facilitate rounds, record points, and maintain pace. Do NOT explain metaphysics—let the game do the work.  

  ---

  ### **Rules & Scoring** (Explain clearly; 5 minutes)  
  1. **How Rounds Work**:  
     - Each round, one event occurs: either **Lever** (teacher pulls cardboard lever; Sustainer decides if torch lights) or **Powder** (teacher adds powder to water; Sustainer decides colour/no change).  
     - **Investigators** predict outcomes *before* seeing them. Groups discuss and write predictions on slips.  
     - **Sustainer** uses Habit Ledger to decide outcomes but can break habit 3 times using Break Tokens (e.g., torch doesn’t light when it usually does). *Crucially, they record breaks in the ledger (e.g., "Round 7: Broke habit—Powder A turned BLUE, not RED")*.  
  2. **Scoring** (non-monetary; incentivises engagement):  
     - **Correct prediction**: 1 point.  
     - **Confident Bet**: Once per game, a group can bet 3 points on a prediction. If right, +3; if wrong, -3.  
     - **Theory Points**: Mid-game, groups earn 2 points for a plausible "causal law" (e.g., "Lever always lights the lamp").  
     - **Winner**: Group with most points gets "Metaphysics Master" title (or similar honour).  

  ---

  ### **Timeline** (90 minutes total)  
  1. **Introduction (5 min)**:  
     - *Teacher says*: "You’re investigators observing events. Find the laws linking causes (lever/powder) and effects (light/colour). Record predictions and theories. Highest score wins."  
     - *Do NOT mention Sustainer or occasionalism—this is revealed later*.  

  2. **Rounds 1–8: Pattern Building (25 min)**  
     - Run 8 quick rounds (3 min/round): 4 lever, 4 powder (pre-set order, e.g., L, P, L, P...).  
     - **Sustainer Action**: Follow Habit Ledger (e.g., lever usually lights; Powder A usually red). Use *no breaks yet*.  
     - **Investigator Action**:  
       - Groups predict outcomes, noting "laws" on Theories Sheet (e.g., "Lever has power to light lamp").  
       - After round 4, groups write one "causal law" to earn 2 points.  
     - *Teacher*: Record outcomes publicly (e.g., "Round 1: Lever pulled → Light ON") and update scores.  

  3. **Mid-Game Discussion (10 min)**  
     - *Pause and ask groups*:  
       1. "What causal powers have you discovered? What *must* happen when the lever is pulled?"  
       2. "How certain are you? Would you bet big on the next round?"  
     - *Listen for*: Confidence in "laws", mentions of necessity ("It *has* to light!").  

  4. **Rounds 9–14: Habit Breaks (20 min)**  
     - Run 6 rounds (3 min/round). Mix events (e.g., P, L, P, L...).  
     - **Sustainer Action**: Use 2–3 Break Tokens (e.g., torch doesn’t light; Powder A turns blue). Record breaks in ledger.  
     - **Investigator Action**: Groups bet if confident. Observe frustration when "laws" fail.  
     - *Teacher*: Note emotional reactions (e.g., "But powder A *always* turned red before!").  

  5. **Revelation & Final Round (10 min)**  
     - After round 14, announce: "One investigator isn’t just observing—they’ve been *deciding* outcomes. Sustainer, reveal yourself!"  
     - Sustainer shares Habit Ledger, showing where habits broke.  
     - **Final Round**: Sustainers chooses an outcome freely (no habit). Investigators predict—most will be wary.  

  6. **Debrief (20 min)**  
     - *Start with reflection*: "How did your understanding of the lever/powder change? What did you feel when the ‘laws’ failed?"  
     - *Map to Ghazālī*:  
       | **Game Moment**          | **Ghazālī’s Occasionalism**                                  |  
       |---------------------------|-------------------------------------------------------------|  
       | Early confidence in "laws" | Humans project necessity onto God’s habits (no real powers in objects). |  
       | Habit breaks              | "Miracles" aren’t violations—no necessity existed to break. |  
       | Sustainer’s freedom       | God decrees each event voluntarily; habits could change.    |  
       | Final-round uncertainty   | World is "free-standing events" (tawḥīd), not a web of powers. |  
     - *Key quote*: "What you call a cause is merely God’s ‘customary habit’ (ʿādah)—and habits can shift without drama" (cf. *The Incoherence of the Philosophers*).  

  ---

  ### **What Will Go Wrong & Fixes**  
  - **Problem**: Sustainer is obvious (e.g., smirking).  
    - **Fix**: Choose a discreet student. Brief them: "Stay neutral. If asked, say you’re observing."  
  - **Problem**: Investigators ignore "breaks" as flukes.  
    - **Fix**: Debrief emphasises: "The breaks weren’t ‘glitches’—they revealed the *absence* of underlying power."  
  - **Problem**: Groups debate, slowing rounds.  
    - **Fix**: Use a timer (1 min for predictions). Say: "Decide fast—real science is uncertain!"  
  - **Problem**: Students say, "This is just Hume!"  
    - **Fix**: In debrief, contrast: "Hume saw habit in *our minds*; Ghazālī saw it in *God’s will*. That’s why miracles aren’t ‘violations’."  

  ---

  ### **What the Game Can’t Teach (Requires Debrief)**  
  - **God as Sole Cause**: The game implies the Sustainer "intervenes," but Ghazālī argues *every* event (even the lever moving) is directly decreed—no created thing has agency. Say:  
    > "In this game, the teacher pulled the lever—but for Ghazālī, even that movement is God’s act. Objects are ‘occasions’ for divine action, not hidden causes. The Sustainer isn’t just ‘intervening’—they’re the *only real actor*."  

  ---

  ### **Why This Works**  
  - **Vertigo Achieved**: By Round 14, students feel the groundlessness of their "laws"—evoking Ghazālī’s claim that necessity is projected, not observed.  
  - **Ghazālī vs. Hume**: The Sustainer’s voluntary habit (not psychological conditioning) and the divine-revelation twist make this distinctly Ghazālī.  
  - **Engagement**: Scoring and bets keep it fun; revelation sparks debate.  

  **Final Tip**: Run it twice if possible—students grasp the metaphysics deeper when they play both roles. Use British idioms in debrief ("It’s not the lever’s *job* to light the lamp—it’s the Sustainer’s *habit*!").
