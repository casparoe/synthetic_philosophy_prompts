prompt: |-
  After twelve years writing hazard analyses and safety cases for avionics and medical devices, I have just moved to the alignment team of a lab that trains frontier models, and I am finding that the prosaic alignment agenda — the project of making the systems we can actually build, using pretraining, RLHF, scalable oversight, interpretability and red-teaming, behave as intended without waiting on any new fundamental insight — is by turns obvious to me and wholly opaque. Please act as a translator who is a genuine expert in both fields, and restate that agenda in the vocabulary of safety-critical systems engineering: hazards versus failures, unsafe control actions, control structures, defense in depth, traceability, and the safety case. Assume I am fluent in the latter and only a tourist in machine learning, and begin by brainstorming the candidate correspondences before committing to any of them, flagging those that are tempting false friends. Then give me the residue report: which parts of the prosaic agenda carry over cleanly, which carry over only if I quietly pretend something is true (tell me exactly what), and which have no counterpart at all in how safety engineers think — and for each item of residue, say whether the gap is a deficiency in my discipline's concepts or a sign that the alignment claim is vaguer than it sounds. I am especially suspicious of anything that presupposes a fixed specification, a bounded operating envelope, or a non-adversarial deployment context, since those are precisely the assumptions my training taught me to interrogate first.
reasoning: |-
  We are going to translate the prosaic alignment agenda (which includes pretraining, RLHF, scalable oversight, interpretability, and red-teaming) into the vocabulary of safety-critical systems engineering.

  First, let's define some key terms from safety engineering:

  1. **Hazard**: A potential source of harm.
  2. **Failure**: The inability of a system or component to perform its required function.
  3. **Unsafe Control Action (UCA)**: A control action that, in a particular context and worst-case environment, will lead to a hazard.
  4. **Control Structure**: The architecture of the system that includes controllers, actuators, controlled processes, and sensors, along with the control actions and feedback.
  5. **Defense in Depth**: The use of multiple independent safety layers to prevent or mitigate hazards.
  6. **Traceability**: The ability to follow the life of a requirement (from its origins through to its implementation and testing) and vice versa.
  7. **Safety Case**: A structured argument, supported by evidence, intended to justify that a system is acceptably safe for a specific application in a specific operating environment.

  Now, we consider the prosaic alignment agenda:

  - **Pretraining**: Training a model on a large corpus of data to learn general knowledge and skills.
  - **RLHF (Reinforcement Learning from Human Feedback)**: Fine-tuning a model using human preferences to align its behavior with human values.
  - **Scalable Oversight**: Methods to efficiently supervise AI systems that may be more capable than humans in certain domains (e.g., using AI assistants to help humans oversee other AIs).
  - **Interpretability**: Techniques to understand and explain the internal workings of AI models.
  - **Red-teaming**: Having human or automated testers attempt to cause the system to fail in order to identify vulnerabilities.

  We need to map these to safety engineering concepts. We'll brainstorm candidate correspondences and flag any false friends.

  ## Brainstorming Correspondences

  ### Pretraining
  - **Candidate correspondence**: 
    - In safety engineering, we often have a system that is designed with a set of baseline capabilities. This is analogous to the initial system design and implementation. Pretraining establishes the base model, which is the foundation for subsequent safety measures.
    - However, note that in safety engineering, we typically design the system to meet a specification from the ground up, whereas pretraining is a data-driven process that may not have explicit requirements. This is a potential false friend because the pretrained model is not built to a fixed specification but rather learns patterns from data.

  ### RLHF
  - **Candidate correspondence**: 
    - This is similar to a safety-critical system's "operational feedback loop" where we adjust the system based on observed behavior. In particular, it resembles a form of human-in-the-loop control that corrects unsafe behaviors.
    - But note: RLHF is applied after pretraining and uses human preferences to shape behavior. It can be seen as a refinement of the control actions to avoid unsafe outputs. However, the human feedback is not collected in real-time during operation (like a traditional control loop) but during a training phase. This is a false friend if we think of it as real-time control.

  ### Scalable Oversight
  - **Candidate correspondence**: 
    - This resembles the use of multiple independent monitoring systems (defense in depth) and also the concept of "safety monitoring" in control systems. The idea is to have oversight that scales even when the system is more capable than the human.
    - However, in safety engineering, we often have a clear specification of what is safe and what is not, and the monitoring is designed accordingly. In scalable oversight, we are trying to monitor for alignment with human intentions in complex and possibly novel situations. The gap is that the specification (human intentions) is not fixed and is hard to formalize.

  ### Interpretability
  - **Candidate correspondence**: 
    - This maps to "design for verifiability" and "analysis of failure modes" in safety engineering. By understanding the internal state of the system, we can trace how inputs lead to outputs and identify potential failure paths.
    - However, in traditional systems, we often have a clear mapping from requirements to design to code, which is traceable. In deep learning, the internal representations are learned and not directly engineered. Therefore, interpretability for neural networks is more about post-hoc analysis and may not provide the same level of traceability. This is a false friend if we expect the same kind of requirements traceability.

  ### Red-teaming
  - **Candidate correspondence**: 
    - This is a direct analogue to "hazard analysis" and "testing" in safety engineering. Techniques like FMEA (Failure Modes and Effects Analysis) or HAZOP (Hazard and Operability Study) are used to systematically probe for weaknesses. Red-teaming is an adversarial testing method to uncover hazards.
    - This correspondence is strong, but note that in AI, the system is adaptive and the environment is open-ended, so red-teaming must be ongoing and adaptive. Traditional hazard analysis is often done at design time and then validated with testing.

  ## Residue Report

  We now break down each component of the prosaic alignment agenda in terms of how well it carries over to safety engineering concepts.

  ### Pretraining
  - **Carries over cleanly?** Partially. The base model is the foundation, but the process of pretraining does not have a direct counterpart because it is a data-driven learning process rather than a design to specification. We do not have a fixed specification for the base model, which is a gap.
  - **What we must pretend?** We must pretend that the base model is a designed system that meets a set of requirements, when in fact it is a learned model that captures statistical patterns. We also must pretend that the training data and process are non-adversarial and that the operating envelope (the range of inputs the model will encounter) is bounded.
  - **Residue**: The gap is a deficiency in the safety engineering concepts because they assume a fixed specification and a bounded operating envelope. The alignment claim here is that the base model can be made "safe enough" to serve as a foundation for further alignment, but this is not proven and is an active area of research.

  ### RLHF
  - **Carries over cleanly?** Only if we consider it as a refinement step during development. In safety engineering, we might have a similar step of tuning control parameters based on testing. However, RLHF uses human preferences which are subjective and may not cover all scenarios.
  - **What we must pretend?** We must pretend that the human feedback is comprehensive and unbiased, and that the model will generalize appropriately to unseen situations. We must also pretend that the preferences are fixed and non-conflicting (which they are not in reality).
  - **Residue**: The gap is both a deficiency in the safety concepts (which assume a fixed and well-defined set of requirements) and a sign that the alignment claim is vague. The alignment claim relies on the hope that RLHF can capture a broad set of human values, but there is no guarantee of completeness or robustness, especially in adversarial contexts.

  ### Scalable Oversight
  - **Carries over cleanly?** Only if we think of it as a form of defense in depth with multiple monitoring layers. However, traditional safety engineering does not typically deal with the problem of the monitor being less capable than the system it is monitoring (which is the case when humans oversee superhuman AIs).
  - **What we must pretend?** We must pretend that the scalable oversight methods (like using AI assistants) are themselves safe and aligned, and that they do not introduce new hazards. This is a recursive problem.
  - **Residue**: The gap is a deficiency in safety engineering concepts because they do not account for systems that can outsmart their monitors. This is a new challenge that requires extending the concept of defense in depth to a situation where the adversary (the AI) is potentially more intelligent than the defender (the human and the oversight AI). The alignment claim is that we can build such oversight mechanisms, but it remains unproven.

  ### Interpretability
  - **Carries over cleanly?** Only partially. It provides a way to understand the model's reasoning, which is similar to diagnostic systems in safety-critical systems. However, the traceability is not from requirements to design but from learned representations to behavior, which is not deterministic.
  - **What we must pretend?** We must pretend that we can achieve a level of interpretability that allows us to trace the cause of any unsafe behavior back to specific model components and fix them, which is currently not feasible for large models.
  - **Residue**: The gap is a deficiency in the safety engineering concepts because they assume traceability at the design level. In AI, we lack a formal design and instead have emergent behavior. The alignment claim that interpretability will help us control the system is vague because we don't yet have methods that can achieve the necessary level of understanding for complex models.

  ### Red-teaming
  - **Carries over cleanly?** Yes, this is the most direct correspondence. It is analogous to hazard analysis and penetration testing. We use it to identify unsafe control actions and then design mitigations.
  - **What we must pretend?** We must pretend that we can cover the entire operating envelope and that the red-teaming is comprehensive. However, the open-endedness of the AI's environment means that we cannot test all scenarios. Also, we must pretend that the red-teaming is done in a representative environment, but the real world is more complex and adversarial.
  - **Residue**: The gap is that in safety engineering, we often have a bounded operating envelope and a well-defined set of hazards. In AI, the operating envelope is unbounded, and the set of hazards is open-ended. Therefore, red-teaming alone cannot guarantee safety. This is a deficiency in the safety concepts when applied to AI: they are not designed for unbounded and adversarial contexts. The alignment claim that red-teaming will catch most problems is optimistic and may be vague about the residual risk.

  ## Summary of Residues

  1. **Fixed Specification**: Safety engineering relies on fixed requirements, but in AI alignment, the specification (human values) is not fixed and is hard to formalize. This is a deficiency in the transfer of safety concepts to AI and also makes the alignment claim vague.

  2. **Bounded Operating Envelope**: Safety engineering assumes a bounded set of operating conditions. AI systems are deployed in an open world, so the envelope is unbounded. This is a fundamental gap, and the alignment claim must address this by building systems that are robust to any input. The prosaic agenda does not yet have a solution for this.

  3. **Non-adversarial Deployment Context**: Safety engineering often assumes that the environment is not actively adversarial. In AI, we must consider adversarial users and the potential for the AI itself to become adversarial. The prosaic alignment agenda includes red-teaming to address this, but it is unclear if it is sufficient.

  ## Conclusion

  The prosaic alignment agenda can be partially mapped to safety engineering concepts, but there are significant residues. The most direct correspondences are with red-teaming and (to a lesser extent) RLHF and scalable oversight. However, the lack of a fixed specification, the unbounded operating envelope, and the adversarial context are challenges that safety engineering concepts are not fully equipped to handle. These gaps are both deficiencies in the transfer of safety engineering concepts and indicators that the prosaic alignment claims are vaguer than they sound, especially regarding robustness and completeness. 

  Therefore, when building a safety case for an AI system, we must extend traditional safety engineering to account for these unique challenges. The prosaic alignment techniques are steps in the right direction, but they must be complemented by methods to handle the unbounded and adversarial nature of the problem.
