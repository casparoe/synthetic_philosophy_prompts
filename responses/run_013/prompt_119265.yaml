  ## REGULATORY IMPACT ASSESSMENT: FELICIFIC AUDIT OF STATUTES CRIMINALISING CERTAIN SEXUAL IRREGULARITIES (1793 REVISION)

  **Reference:** HO/FEL/93-07B  
  **Date:** 17th October, 1793  
  **Prepared For:** Under-Secretary (Moral Compliance), Home Office  
  **Prepared By:** T. W. Higgs, Junior Clerk (Felicity Division)

  **1. Executive Summary:**  
  This assessment applies the principles of Felicific Calculus to statutes pertaining to acts commonly designated "Sodomy", "Buggery", and cognate "Unnatural Acts" (25 Hen. VIII, c.6; 5 Eliz. I, c.17; et seq.). Preliminary quantification suggests the current legislative framework generates significant negative utility (pain) exceeding any demonstrable positive utility (pleasure) arising from deterrence or moral affirmation. Key pain-drivers include secondary harms (blackmail, concealment anxiety) and substantial public disapprobation directed *at* offenders. The argument from "Unnaturalness" is noted but assigned null weight per core utilitarian principle (pleasure/pain being sole arbiters). However, the *expression* of this argument as public sentiment manifests as a major quantifiable pain, presenting a calculative anomaly requiring instruction.

  **2. Scope & Methodology:**
  *   **Scope:** Considers pains/pleasures accruing to: (1) Individuals directly engaging in proscribed acts; (2) Individuals indirectly affected (e.g., blackmail victims, associates); (3) The Public at large (sentiment, perceived moral hazard).
  *   **Method:** Application of Bentham's Seven Dimensions to identified Pains/Pleasures associated with the *existence and enforcement* of the statutes. Quantification scale: 0 (Negligible) to 10 (Severe/Prolonged/Ubiquitous). Weighted summation.

  **3. Felicific Analysis (Pains Generated by Statutes):**

  *   **3.1. Direct Pains of Punishment (Upon Conviction):**
      *   *Intensity:* Capital sentence (10). Corporal punishment (8).
      *   *Duration:* Execution (Terminal, 10); Imprisonment/Pillory (Variable, High (7-9)).
      *   *Certainty:* Low conviction rate (Est. <5% reported incidents). Diminishes perceived weight, but extreme severity retains high aggregate pain potential (Weighted Score: 7).
      *   *Propinquity:* Immediate upon conviction. Certainty factor reduces perceived immediacy for potential offenders (6).
      *   *Fecundity:* High. Generates secondary pains (family ruin, stigma) (8).
      *   *Purity:* Largely pure pain, minimal countervailing pleasure (9).
      *   *Extent:* Small number directly affected annually, but impact catastrophic (5).

  *   **3.2. Secondary Pains (Systemic Harms):**
      *   *Fear of Discovery & Prosecution:* Pervasive among liable individuals.
          *   *Intensity:* High (Fear of ruin/death) (8).
          *   *Duration:* Chronic, lifelong for many (8).
          *   *Certainty:* Low absolute risk, high perceived risk due to severity (7).
          *   *Propinquity:* Constant potential (8).
          *   *Fecundity:* Generates concealment pains, blackmail vulnerability (9).
          *   *Purity:* High pain component (8).
          *   *Extent:* Moderate (Estimated liable population: 2-5%?) (6).
      *   *Blackmail:*
          *   *Intensity:* High (Financial ruin, psychological terror) (9).
          *   *Duration:* Can be indefinite (8).
          *   *Certainty:* High risk for discovered individuals (8).
          *   *Propinquity:* Immediate threat upon discovery (8).
          *   *Fecundity:* Generates further fear, impoverishment, potential for violence (8).
          *   *Purity:* Overwhelmingly painful (9).
          *   *Extent:* Significant subset of liable population affected (7).
      *   *Pains of Concealment & Duplicity:*
          *   *Intensity:* Moderate-Severe (Anxiety, isolation) (7).
          *   *Duration:* Chronic (8).
          *   *Certainty:* High for engaged individuals wishing secrecy (8).
          *   *Propinquity:* Constant social interaction necessitates vigilance (8).
          *   *Fecundity:* Breeds mistrust, hinders social cohesion (7).
          *   *Purity:* Primarily pain, though minor pleasure of security possible (6).
          *   *Extent:* Widespread among liable population (8).

  *   **3.3. Public Sentiment (Disapprobation):**
      *   *Intensity:* High (Revulsion, moral outrage) (8).
      *   *Duration:* Persistent cultural attitude (9).
      *   *Certainty:* Near-universal among aware public regarding the *acts* (9).
      *   *Propinquity:* Constant societal pressure, expressed in discourse/law (8).
      *   *Fecundity:* Fuels support for laws, generates stigma, enables blackmail (9).
      *   *Purity:* **Problematic Dimension.** Ostensibly pure pain *for the object of disapprobation*. However, the *expression* of disapprobation may yield pleasure (sense of virtue, communal bonding) *to the disapproving public*. This creates calculative friction. Current weight assigned to pain *inflicted*: (8).
      *   *Extent:* Very wide (Majority of population) (9).
      *   **Note on "Unnaturalness":** The *argument* "Act X is Unnatural" is devoid of intrinsic felicific weight (Pleasure/Pain being the natural arbiters). It registers *only* insofar as it manifests as this quantifiable public disapprobation (Pain score above).

  **4. Pleasures Generated by Statutes (Postulated Benefits):**

  *   **4.1. Deterrence of Proscribed Acts:** Presumed reduction in acts causing undefined "social harm".
      *   *Intensity:* Uncertain. Acts themselves may generate pleasure for participants (Unquantified, excluded per statute).
      *   *Duration:* Presumed lasting if law effective.
      *   *Certainty:* Low demonstrable causal link; acts persist clandestinely.
      *   *Propinquity:* Remote (Prevention of hypothetical future acts).
      *   *Fecundity:* Uncertain.
      *   *Purity:* Contingent on acts causing net pain (Unproven).
      *   *Extent:* Presumed broad.
      *   *Weighted Score (Est.):* Low-Medium (3-4). Highly speculative.

  *   **4.2. Pleasure of Moral Vindication (Public):** Satisfaction derived from existence/punishment under law.
      *   *Intensity:* Moderate (Sense of justice/order) (5).
      *   *Duration:* Episodic (During discourse/punishment) (4).
      *   *Certainty:* High for those valuing the norm (7).
      *   *Propinquity:* Remote for most (5).
      *   *Fecundity:* May reinforce social norms (6).
      *   *Purity:* Mixed with potential pain of contemplating the acts (4).
      *   *Extent:* Wide among disapproving public (8).
      *   *Weighted Score (Est.):* Medium (5).

  **5. Net Felicific Balance:**  
  Summation of quantified pains (Sections 3.1, 3.2, 3.3) substantially outweighs quantified pleasures (Sections 4.1, 4.2). The greatest pain-generators are the secondary systemic harms (Fear, Blackmail, Concealment) and the pervasive public disapprobation, both directly attributable to the *existence and threat* of the statutes. The deterrence benefit is weak and speculative.

  **6. Anomaly & Recommendation:**  
  A significant calculative difficulty arises concerning Public Disapprobation (Sec. 3.3). While the *argument* of "Unnaturalness" is correctly excluded, the *sentiment itself* constitutes a major, measurable pain inflicted *by the public* upon individuals. However, legislating against this widespread sentiment is impractical and likely generates further pain. Crucially, *should the pain inflicted by public sentiment upon individuals engaging in harmless* (felicifically neutral or positive) *private acts carry weight in the sum, if that sentiment is deeply held?* **This matter requires further instruction regarding the felicific valuation of majoritarian moral sentiment directed at private, non-coercive conduct.**

  **7. Conclusion:**  
  Based on felicific calculus applied to measurable pains and pleasures, the current statutes appear net generators of significant pain, primarily through mechanisms of fear, extortion, concealment, and the channeling of public disapprobation. The core deterrence rationale lacks robust felicific support. Revision or repeal warrants consideration contingent upon resolving the anomaly noted in Section 6.

  **T.W. Higgs, Jnr. Clk (Fel.)**

  ---

  **Annotations on Benthamite Grounding & Contested Areas (150 Words):**

  *   **Settled:** Bentham explicitly rejected "unnaturalness" as a valid argument against homosexuality/sodomy, seeing it as a circular "hateful non-reason" devoid of utility basis. This is clear in published work (e.g., *Offences Against One's Self* manuscript, though unpublished then, argues thus). Dismissing it while counting its *effects* (disapprobation) is authentically Benthamite – he acknowledged real pains caused by prejudice.
  *   **Settled:** Bentham prioritized secondary harms (blackmail, fear) generated by laws against "victimless" crimes as major disutilities. His analysis of indirect pains is central.
  *   **Contested:** Bentham's *private* views on age of consent/pederasty in unpublished MSS are ambiguous and debated. Some fragments suggest a stricter utility-based line than contemporaries; others seem disturbingly pragmatic. **This piece avoids that entirely.**
  *   **Authentic Tension:** The "anomaly" (Sec 6) reflects a real tension in Bentham: can deep-seated, pleasure-giving public sentiment *based on prejudice* justify inflicting pain on minorities through law? He grappled with this; the clerk's confusion mirrors it. The piece doesn't invent calculus features; it pushes purity's dual role (pain felt vs. pleasure of inflicting) and the core problem of valuing sentiment.
  *   **No Invention:** All calculus dimensions and their application here are extrapolated from Bentham's core principles. The "purity" friction arises naturally from applying the method rigorously to this context.
