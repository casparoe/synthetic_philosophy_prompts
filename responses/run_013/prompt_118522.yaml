  The user's examples show that improvement preserves identity, while degradation breaks it. The dinghy, though more original material, is seen as lesser due to patches. The rebuilt boat, though mostly new, is better and thus still grandad's. The pile of old planks isn't the boat because it doesn't function as one. 

  I should mention theories by philosophers like Derek Parfit or David Wiggins. Parfit's teletransportation paradox touches on identity through change. Wiggins' sortal concepts might apply: what the object is (a boat) dictates identity conditions. The user's case adds a normative layer: improvement vs. degradation affecting identity judgments.

  The user also asks about edge cases: if the boat is modified beyond rowing, when does it become a different object? Here, the function defines the kind. If it can't row, it's no longer a rowboat, hence a different object. The "kind" and its defining functions are key. 

