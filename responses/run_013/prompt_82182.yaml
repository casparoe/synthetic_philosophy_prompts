prompt: |-
  Alright, I've been reading alot about this thing called consequentialist cluelessness and I want a short story that actually dramatizes it instead of just having a character name-drop it. Quick gloss so you know what I'm after: it's the worry that if you try to judge an action by its total consequences, you're basically stuck, because you can't enumerate all the downstream effects, you can't put a number on them, and the further out you go the more they depend on chaotic stuff no one could of predicted, so a serious consequentialist starts to wonder whether she can ever know if she did the right thing.

  Here's the premise I want you to build on. Invent a near-future gadget, name it whatever you want, that lets an investigator watch the actual chain of events that followed some past decision, forward through time, in as much detail as she likes. The catch: it only ever shows the world that actually happened. It never shows the world where the decision went the other way. A young investigator gets assigned one specific historical choice to assess, pick something mundane but weighty, a town council voting to dam a river, a researcher deciding to publish a finding, a captain rerouting a ship, whatever, and she watches it unfold for a couple of centuries. I want the reader to feel why that doesn't settle anything: she sees the actual downstream world but has no baseline to compare it against, the effects branch and cancel and snowball long past the point where you could call any of them hers, some are wonderful and some are horrific and they don't trade off against each other cleanly, and even the near-term stuff is ambiguous (did the dam save the town or just move the flood downstream?). Her older colleague keeps saying the only sane standard is what a reasonable person could have foreseen at the time; let that argument actually get made and actually get pushed on.

  A few things. Don't resolve the cluelessness, and don't have the machine conveniently reveal the counterfactual or hand her a score. I'd also rather you not turn it into a lecture, so no two characters explaining the philosophy to each other, let it come out of what she sees and what she and her colleague fight about. Third person, present tense, around a thousand words is fine, longer if it's earning it.

  Start your reply with the story itself. First sentence is the story, no title, no preamble, no commentary after it.
