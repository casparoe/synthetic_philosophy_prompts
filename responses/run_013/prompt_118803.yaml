  ## Internal Case File: COC/2024/07  
  **Committee for Ontological Conciliation**  
  University of Kings Wenlock  
  **Case Officer:** T. W. Pettigrew, Clerk to the Committee  

  ---

  **1. Complaint Received:** 17/05/2024  
  **Parties Involved:**  
  *   **Complainant:** Prof. Arthur Thorne (Dept. of Philosophy)  
  *   **Respondent:** Dr. Beatrice Shaw (Dept. of Philosophy)  

  **Nature of Dispute:** Persistent disagreement concerning the ontological status of the object commonly referred to as "the seminar table" in Room G.07 (Hegel Building). Prof. Thorne asserts categorically "There *is* a table in G.07". Dr. Shaw asserts categorically "There is *no* table in G.07; there are merely atoms arranged table-wise". The dispute has caused "atmosphere detrimental to collegiality and clear philosophical discourse" (Prof. Thorne, Complaint Form §2).  

  **Remedy Sought:** Formal conciliation by the Committee, leading to a mutually acceptable resolution recognising the table's existence (Prof. Thorne), or, failing that, a definitive ruling (Both Parties, implicitly).  

  **2. Interviews Conducted:** 20/05/2024  

  *   **Interview with Prof. Thorne:**  
      Prof. Thorne presented as earnest and mildly exasperated. He stated his position is "simply common sense" and reflects "how the world is furnished". He insisted that denying the existence of tables, while simultaneously acknowledging the existence of atoms arranged table-wise, is "incoherent" and "tantamount to denying the manifest image of the world". He expressed concern that Dr. Shaw's view, if correct, would undermine the foundations of ordinary language and perception. When asked if he could understand Dr. Shaw's assertion as meaning something like "There are no *fundamental* tables", he conceded he *could*, but stated this was not what she *meant*, nor did it capture the literal falsehood she intended by her statement.  

  *   **Interview with Dr. Shaw:**  
      Dr. Shaw was precise and adamant. She clarified that her denial is strictly ontological: "At the fundamental level of what exists independently of our conceptual schemes, there exist only particles and fields in certain configurations. The 'table' is a useful conceptual overlay, a façon de parler, but it does not name a distinct, additional entity over and above the particles." She stated Prof. Thorne is "mistaking a pragmatic convention for an ontological discovery". When asked if she could charitably interpret Prof. Thorne's "There is a table" as meaning "There is a configuration of atoms that serves the functional role we associate with 'table'", she agreed this captured the *empirical content* but insisted it deliberately obscured the crucial *ontological* point about what fundamentally exists. She emphatically denied that this dispute affects practical predictions about the behaviour of the object in G.07.  

  **3. Application of Committee Guidance Leaflet (Appendix A): Tests for a Merely Verbal Dispute**  

  The Clerk reviewed the dispute against the Committee's standard criteria:  

  *   **(i) Divergence only over 'exists':**  
      Both parties explicitly ground their disagreement in divergent conceptions of what it *means* for something to exist. Prof. Thorne employs an ontology inclusive of ordinary objects; Dr. Shaw employs a more restrictive ontology admitting only fundamental particles/fields. The disagreement centrally concerns the conditions under which the term 'exists' applies. (*Test Appears Satisfied*).  

  *   **(ii) Capacity for Charitable Reinterpretation:**  
      Both parties demonstrated the *intellectual capacity* to provide a charitable reinterpretation of the other's position (as noted in interviews). Prof. Thorne *can* see Dr. Shaw's statement as about fundamentality. Dr. Shaw *can* see Prof. Thorne's statement as about functional groupings. However, both *explicitly reject* these reinterpretations as accurately capturing the meaning or force of the other's *actual* assertion. Dr. Shaw insists her statement is one of literal non-existence; Prof. Thorne insists his statement is one of literal existence. (*Test Problematic: Capacity demonstrated, but acceptance/relevance denied by parties*).  

  *   **(iii) No Divergence in Prediction or Practice:**  
      Both parties agree that all empirical predictions regarding the observable properties, behaviour, or utility of the object in G.07 – whether one calls it a table or an atom-arrangement – remain identical. Dr. Shaw sits on it, places books upon it, and refers to "the table" in departmental memos without practical difficulty. Prof. Thorne does not attribute occult powers to the table. (*Test Appears Satisfied*).  

  **4. Analysis:**  
  The dispute exhibits the hallmark features of a terminological divergence rooted in differing commitments concerning the meaning and scope of 'exists'. While the parties exhibit strong attachment to their preferred idioms and ontological frameworks (Prof. Thorne's manifest image ontology vs. Dr. Shaw's fundamental particle ontology), the Clerk finds no evidence that this attachment corresponds to a disagreement about the non-linguistic, empirically accessible facts concerning the object in Room G.07. The core divergence concerns *how* to describe these facts using existential quantifiers, not *what* the facts are. The objections raised regarding charitable reinterpretation (Test ii) stem from the parties' metaontological convictions about the primacy of their own framework, which lies beyond the Committee's remit to adjudicate. The Committee's role is conciliation through conceptual clarification, not metaphysical arbitration.  

  **5. Findings:**  

  1.  The dispute between Prof. Thorne and Dr. Shaw satisfies the Committee's criteria (i) and (iii) for classification as a Non-Fault Verbal Dispute (NFVD).
  2.  While the parties reject the charitable reinterpretations offered under Test (ii), this rejection reflects a metaontological stance concerning the priority of their respective frameworks, not an inability to grasp the alternative description's empirical content. This does not negate the primarily verbal nature of the dispute as defined by the Committee's Guidance.
  3.  The Committee takes no stance on the relative merits of the ontological frameworks employed by either party. Its finding of NFVD is metaontologically neutral.

  **6. Disposition:**  
  The dispute is declared a **Non-Fault Verbal Dispute (NFVD)**. The Committee recommends:  
  *   Prof. Thorne and Dr. Shaw acknowledge the primarily terminological nature of their disagreement.  
  *   Both parties recognise that the other is employing a coherent conceptual scheme, albeit one utilising different criteria for the application of 'exists'.  
  *   Future discussions should explicitly specify the ontological framework being employed when using existential claims in contexts prone to misunderstanding.  
  *   The object in Room G.07 may continue to be used for the placement of books, coffee cups, and elbows without ontological prejudice.  

  **7. Dissenting Note (Dr. Evelyn Vance, Committee Member):**  
  While concurring with the practical recommendations, I dissent from the finding of NFVD and its claimed neutrality. The Committee's tests, particularly the dismissal of Test (ii) objections and the reliance on empirical equivalence (Test iii), implicitly presuppose a deflationary or Carnapian metaontology. It assumes existence claims *only* have meaning relative to a chosen linguistic framework and that frameworks are pragmatically equivalent if empirically so. This *is* a substantive metaontological stance – specifically, one rejecting ontological realism of the kind Prof. Thorne implicitly endorses and Dr. Shaw explicitly argues against. Declaring the dispute "merely verbal" is not a neutral observation; it is an endorsement of quantifier variance and the conventionality of ontology, thereby *taking a side* against the view that there is a uniquely privileged, framework-independent answer to "What exists?". The Committee's procedure is not metaontologically inert.  

  ---

  **Appendix A: Committee for Ontological Conciliation – Guidance for Mediators**  
  *(Extract: Identifying Non-Fault Verbal Disputes (NFVDs))*  

  A dispute is eligible for a NFVD finding if it demonstrably meets *all three* of the following criteria:  

  1.  **Terminological Core:** The parties' apparent disagreement over the truth of a statement 'S' demonstrably reduces to a divergence *only* in their respective interpretations or commitments regarding the meaning, scope, or application conditions of the term 'exists' (or its cognates) within 'S'. Disagreements about non-existential predicates or underlying non-linguistic facts disqualify the dispute.  
  2.  **Charitable Reinterpretability:** Each party possesses the conceptual resources to provide a charitable reinterpretation of the other party's contested assertion within their *own* framework, such that the *empirical content* or *practical import* asserted by the other is preserved, even if the specific ontological commitment is translated or paraphrased away. This does not require the party to *agree* with the reinterpretation, only to acknowledge its coherence and empirical equivalence.  
  3.  **Practical/ Predictive Equivalence:** The adoption of either party's position yields no divergent predictions about observable events, necessitates no changes in practical engagement with the world (beyond verbal behaviour), and implies no difference in the non-linguistic evidence deemed relevant. The dispute makes no tangible difference to any empirical outcome or course of action.  

  **Purpose:** The NFVD finding aims to resolve unproductive conflict by clarifying the linguistic-conventional nature of the disagreement, promoting mutual understanding of differing frameworks, and refocusing discourse on substantive matters where genuine disagreement about the world is possible. The Committee remains strictly neutral on the metaphysical merits of any particular ontological framework.  

  ---
  **Clerk's Final Note:** Filed 24/05/2024. Copies distributed to Parties, Committee Members, and Head of Philosophy (for information). Recommend Parties review the Guidance Leaflet (attached) for ontological hygiene in future discourse.  

