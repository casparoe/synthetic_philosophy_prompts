answer: |-
  ## Sestina: The Ledger of Levels

  A sacrifice unfolds: the sentry dies,  
  Alerting kin, the startled **group** takes flight.  
  The predator departs, unfed, denied  
  Its meal. The consequence? The watchful **body**  
  Lies still. Its costly gift, a coded **gene**  
  For vigilance, now stains the forest floor. Yet, in the **lineage**,  
  The trait persists. Why pay the **body**'s price?  
  The **ledger** tallies differently: the **group**  
  That flees intact survives. The **body**'s loss  
  Is group's enduring gain. But see, the **gene**  
  For sacrifice requires a host, a **body**  
  To burn. Is this the level where the **strife**  
  Is truly waged? Or just a ripple in the **lineage**'s  
  Flow? The **ledger** balances the **strife**  
  Of nested interests: does the **lineage**  
  Grow stronger through this sacrifice? The **group**  
  Thrives, yes. But watch the selfish **gene**  
  That rides within, a hitchhiker that cheats  
  The fair division, skews the **body**'s  
  Costly gift. It rigs the **ledger**, steals the **body**'s due.  
  The **lineage** bears the mark, the **strife**  
  Internal, fierce. The **gene** is not one team,  
  But factions warring. Does this chaos help the **group**?  
  Or hinder? Still, the sentry falls. The **ledger**  
  Shows survival for the kin, the **group**. The **body**  
  Counts its cost alone. But is selection *for* the **group**?  
  Or merely *on* it? Count the **body**'s toll  
  Against the **lineage**'s slow ascent. The **strife**  
  Is real – the dying gasp, the fleeing feet. The **ledger**  
  Must assign the cause. Perhaps the **gene**  
  Itself is pressured, not for **group**'s sake,  
  But by the kin nearby. The **lineage** blurs the **body**'s edge.  
  The **body**'s fitness fades, a flickering light,  
  Defined by what? Against its **group**, its kin,  
  Its kind? Or just itself? The shifting **ledger**  
  Changes sums with every level claimed. The **strife**  
  Exists. But *where* is profit counted? In the **gene**'s  
  Prolific spread? The **lineage**'s span?  
  The **lineage** stretches, tracing deep descent,  
  While **body** after **body** fuels the chain.  
  The **group** emerges, fragile, from the **strife**  
  Of individuals. The **ledger** holds the proof –  
  But proof of what? A consequence, not cause?  
  Perhaps the **gene** is bookkeeper, the silent **ledger**  
  Of survival's script. Or maybe **strife** itself  
  Is architect, the **body** just its transient field.  
  The **group** endures? The **lineage** persists?  
  The **ledger** spins its numbers, cold and vast.  

  **Envoi**  
  O tangled **lineage**, where kin's kind calculus  
  Unweaves the **strife**: each **ledger** line a **gene**'s demand.  

  ---

  ### Why This Works (For You & Your TA)

  1.  **The Six End-Words & Their Roles:**
      *   **Gene:** Represents the sub-organismal unit, including its potential selfishness ("selfish stretch that rigs the lottery," "factions warring," "bookkeeper").
      *   **Body:** The individual organism, bearing the cost ("lies still," "costly gift," "tolls," "flickering light," "transient field").
      *   **Group:** The collection of individuals, potentially benefiting ("takes flight," "thrives," "fragile," "emerges").
      *   **Lineage:** The population/genetic line over time ("persists," "stretches," "tracing deep descent," "blurs the body's edge," "kin's kind calculus").
      *   **Ledger:** The accounting of fitness and cost ("tallies," "balances," "shows survival," "changes sums," "holds the proof," "spins its numbers"). Embodies the relativity of fitness accounting.
      *   **Strife:** Conflict/Competition, both within (selfish genes) and between levels (individual vs. group benefit) ("waged," "internal fierce," "chaos," "dying gasp," "architect").

  2.  **The Rotation & The Problem:**
      *   Each stanza ends with a different word, forcing a shift in perspective on the *same core event* (the sentry's sacrifice).
      *   Stanza 1 ends with "strife" – the conflict is highlighted.
      *   Stanza 2 ends with "lineage" – the long-term consequence/persistence is emphasized.
      *   Stanza 3 ends with "body" – the individual cost is the final thought.
      *   Stanza 4 ends with "group" – the collective survival dominates.
      *   Stanza 5 ends with "gene" – the replicator/bookkeeper angle comes last.
      *   Stanza 6 ends with "ledger" – the accounting itself, the relativity, is the focus.
      *   **This forces the reader to see how the *same biological event* can be framed to make each level seem like the primary cause or unit of account, highlighting the core difficulty of the debate.** It doesn't feel like a trick because the event *is* genuinely multi-level.

  3.  **Hitting Your Content Points:**
      *   **(1) Trait Cost/Benefit:** The sentry's sacrifice is the central image. It *helps the group* ("group takes flight," "group's gain") but *costs the body* ("body lies still," "body's loss," "body's toll"). The poem refuses to resolve which is "the" unit (Stanzas 1, 3, 4, Envoi).
      *   **(2) Selection *at* vs. *for*:** Stanza 4 explicitly questions: "But is selection *for* the group? / Or merely *on* it?" The poem shows group-level *events* (the group fleeing, surviving) but questions whether selection is acting *for* the group as an evolutionary unit versus a consequence of individual/kin selection.
      *   **(3) Genes Aren't Tidy:** Stanza 3 tackles this: "watch the selfish gene... a hitchhiker that cheats," "The gene is not one team, / But factions warring." This complicates the "gene as unit" picture before groups even enter.
      *   **(4) Relativity of Fitness:** Stanza 5 centers this: "The body's fitness fades... Defined by what? Against its group, its kin, / Its kind? Or just itself? The shifting ledger / Changes sums with every level claimed." The "ledger" embodies this definitional relativity.

  4.  **The Envoi:**
      *   It combines "lineage," "strife," and "ledger" (with "gene" embedded). Crucially, it *blurs* the levels:
          *   "Tangled lineage" implies interconnectedness.
          *   "Kin's kind calculus" points to Hamilton's Rule/inclusive fitness, a way of modeling that often mathematically unifies individual/kin/group perspectives.
          *   "Each ledger line a gene's demand" suggests the accounting (*ledger*) is ultimately driven by replicator success (*gene*), but the *strife* is inherent in the lineage's interactions. No single level "wins"; they are presented as inseparable facets.

  5.  **Accessibility & Depth:**
      *   The core image (sentry sacrifice) is immediately graspable. Terms like "ledger," "strife," "lineage" have common meanings that parallel their technical use.
      *   A knowledgeable reader (your TA) will see the specific references: the sentry (altruism/group selection), selfish genetic elements, the *for* vs. *on* distinction, the relativity of fitness, and the kin selection/multilevel equivalence hinted in the envoi.
      *   The formal constraints and shifting focus create a feeling of complexity and irresolution that mirrors the philosophical debate itself.

  This sestina uses its rigid structure not just as a formality, but as the *essential argument* about the units of selection, making the conceptual difficulty viscerally felt through the relentless permutation of perspective. Good luck in class – your TA should be impressed!
