prompt: |-
  I'm in a seminar on the ethics of cities (I'm a 4th year, the course is half philosophy half urban planning students) and next week I have to run the whole 80-minute session myself, about 18 people at round tables. The prof wants us to stop reading about NIMBYism and actually feel it, and I want the thing to land without me lecturing at them first. Can you design the activity?

  What I want them to walk out feeling: that whether the corner building gets built is never a separate question from who gets to decide, and that the who-gets-to-decide question has no neutral answer -- every procedure for answering it is already a distribution of rights. Also that the NIMBY isn't being a hypocrite, she's in a stable spot.

  Here's the rough shape I had, fix it or replace it: three parallel neighborhood tables of six. Each table has a block map with an empty corner lot and six roles -- four owner-occupiers, one renter, one small local developer whose financing is contingent on a deadline. Two votes, in this order. First, before any discussion and by secret ballot, they pick the decision rule for the second vote (unanimous, two-thirds, simple majority, or abutter veto). Then they vote on whether to approve a four-story twelve-unit building that needs upzoning. Rule that you may lie about your preferences but not about the facts on your role card. No real money, stakes are just your character's interest -- quiet, view, rent, the ability to stay, profit, deadline.

  Then the part I care most about: after the vote, I deal each table one shock card -- the renter's lease ends, an owner gets a job offer, a family with two kids wants to move in -- and they have to re-run the rule vote and the project vote. And during the second round I drop in two or three absent-resident cards: people who are affected but aren't in the room (the night-shift workers who can't make a 7pm meeting, the people who'd move in, the ones who'd be pushed out two neighborhoods over). Nobody plays them, they just sit on the table.

  What I need from you: full rules and setup, the role and shock and absent-resident cards written out so I can print them, a timeline for the 80 minutes, what to say and not say while it's running, and then a debrief that maps each moment onto the actual ideas -- procedural vs substantive rights, use value vs exchange value, why the secret rule vote is the whole game, why the shock card makes positions look like principles until you move the person. Also tell me honestly what will predictably go wrong the first time (I'm worried the developer just gets dogpiled, or that they all approve unanimously and nothing interesting happens) and how to handle it. And be straight with me about what this format can't reproduce -- I already suspect it flattens the real power asymmetry, since in the real thing the landlord has a lawyer and the tenants don't, and no card can carry decades of displacement.
reasoning: |-
  We are designing an experiential activity to explore the ethics of urban development, focusing on NIMBYism, decision-making procedures, and the inherent distribution of rights in those procedures. The activity involves three parallel neighborhood tables, each with six participants. The goal is for participants to feel the tension between individual interests and collective decision-making, and to understand that procedures are not neutral.

  Key learning objectives:
  1. The question of "who decides" is inseparable from "what gets built" and every procedure distributes rights unequally.
  2. NIMBYs are not hypocrites; their position is stable given their circumstances (use value vs exchange value).
  3. Shock events reveal how positions are tied to circumstances, not fixed principles.
  4. Absent residents highlight the exclusionary nature of local decision-making.

  Activity Structure:
  - Three rounds: 
    - Round 1: Vote on the decision rule (secret ballot) and then vote on the project.
    - Round 2: After a shock event, re-vote on the rule and the project.
    - Introduction of absent residents (during Round 2) to show excluded stakeholders.

  Materials Needed:
  - Three identical sets of role cards (one set per table, 6 roles per set).
  - Three identical sets of shock cards (one per table, to be drawn randomly in Round 2).
  - Absent-resident cards (2-3 per table, to be introduced during Round 2).
  - Block maps for each table (showing an empty corner lot and surrounding properties).
  - Voting ballots (for rule and project votes).
  - Timer.

  Role Cards (6 per table):
  1. Homeowner A (Corner Lot Abutter): 
     - You own the house next to the empty lot. You value the quiet and the morning sun that would be blocked by a tall building. You are concerned about increased traffic and parking. You moved here for the peaceful atmosphere and worry about the character of the neighborhood changing.

  2. Homeowner B (Across the Street):
     - You own a house directly across from the empty lot. You are worried about the loss of your view of the park beyond the lot. You also fear that the new building would set a precedent for more development and increase density, which might lower property values. However, you are planning to retire in 5 years and might sell.

  3. Homeowner C (Down the Block):
     - You live a few houses away from the lot. You are concerned about the strain on local schools and infrastructure. You have two young children and worry about more cars and less street safety. But you also recognize the city needs more housing and don't want to seem selfish.

  4. Homeowner D (Around the Corner):
     - You live on the adjacent street. You are less directly affected, but you worry about increased noise and congestion. You are also concerned about the environment (loss of green space, stormwater runoff). You are active in the neighborhood association and value community consensus.

  5. Renter (Nearby Apartment):
     - You rent an apartment two blocks away. You are struggling with rising rents and fear displacement. You support the new building because it might create more affordable units and ease rent pressure. You also like the idea of more neighbors and amenities. But you don't have a long-term stake in the neighborhood.

  6. Small Local Developer:
     - You own the empty lot and want to build a 4-story, 12-unit building (with 2 affordable units). Your financing is contingent on starting construction within 6 months. If delayed, you lose funding and the lot remains vacant. You believe this project will help the city's housing crisis and bring new life to the neighborhood.

  Shock Cards (one per table for Round 2):
  - Card 1: The Renter's lease is ending. Their landlord has increased the rent by 30%. They must decide whether to stay (if the new building offers affordable options) or leave the neighborhood.
  - Card 2: Homeowner B gets a job offer in another city. They are considering selling and moving. This changes their perspective on property values vs. neighborhood character.
  - Card 3: A family with two young children is hoping to move into one of the units in the new building. They currently live in an overcrowded apartment in a less safe neighborhood and need more space.

  Absent-Resident Cards (2-3 per table, introduced during Round 2):
  - Night-Shift Worker: Works nights and sleeps during the day. Cannot attend meetings held at 7 PM. They would be affected by construction noise but also need affordable housing near their job.
  - Future Resident: A young professional who would like to move into the neighborhood but cannot find an affordable place. They would benefit from the new building.
  - Displaced Resident: A low-income resident who was pushed out of a nearby neighborhood due to rising rents. They are now commuting 90 minutes each way to work and have no voice in this decision.

  Activity Timeline (80 minutes total):

  1. Introduction (5 minutes)
     - Explain the setup: "Today we are simulating three neighborhood meetings about a proposed four-story building on an empty corner lot. Each of you has a role card with your character's interests. We'll have two rounds of decision-making."
     - Emphasize: "You may lie about your preferences (to protect your interests) but not about the facts on your role card. The stakes are your character's well-being (quiet, view, affordability, profit, etc.)."

  2. Round 1: Initial Votes (25 minutes)
     - Step 1: Secret ballot vote on the decision rule (5 minutes). Options: Unanimous, Two-thirds majority, Simple majority, Abutter veto (only those adjacent to the lot get to veto). 
       - Instructions: "Vote for the rule you think will best serve your interests. Do not discuss before voting."
     - Step 2: Tally the rule at each table and announce it. (2 minutes)
     - Step 3: Discussion of the project (10 minutes). Participants discuss the building proposal, advocating for their role's interests.
     - Step 4: Project vote under the chosen rule (3 minutes). Vote by show of hands (or secret ballot if the rule allows for it and they wish). Record the outcome.
     - Step 5: Briefly note the outcome at each table. (5 minutes for steps 3-5)

  3. Shock Event and Round 2 (25 minutes)
     - Step 1: Introduce the shock (5 minutes): "We now fast-forward 3 months. Each table draws one shock card. Read it aloud and discuss how this changes the situation."
     - Step 2: Introduce absent residents (simultaneously): Place 2-3 absent-resident cards on the table. "These are people affected by your decision but not present. Consider them in your discussion."
     - Step 3: Re-vote the decision rule (secret ballot, same options). (5 minutes)
     - Step 4: Tally the new rule. (2 minutes)
     - Step 5: Discussion and project re-vote under the new rule. (10 minutes) 
     - Step 6: Record the outcome.

  4. Debrief (25 minutes)
     - Start with reactions: "What was that like? Any surprises?" (5 minutes)
     - Map to concepts:
       - Rule vote: "Why did you vote for the rule you did? How did the rule shape the outcome? Note: the rule vote is where rights are distributed. Unanimous gives each person a veto, abutter veto privileges proximity, majority rule might ignore minorities." (5 minutes)
       - Shock: "How did the shock change perspectives? Did anyone feel their position was tied to circumstances? This shows how use value (home as a place to live) vs exchange value (home as an asset) can conflict." (5 minutes)
       - Absent residents: "Who wasn't in the room? How did their absence affect the decision? Real meetings often exclude renters, shift workers, future residents." (5 minutes)
       - NIMBYism: "Did anyone feel like a NIMBY? Why is that position stable? It's rational to protect your home environment when you have no other way to secure it." (5 minutes)

  What Could Go Wrong and Mitigation:
  1. Problem: The developer gets dogpiled (everyone opposes the project).
     - Mitigation: The developer has a strong card (deadline, affordable units). Remind players that the city needs housing, and the developer is local. Also, the shock might shift opinions.

  2. Problem: Unanimous approval (nothing interesting).
     - Mitigation: The role cards are designed to have conflicting interests (e.g., homeowners vs renter). If they still approve, the shock might change that. Also, the rule vote might be contentious even if the project vote isn't.

  3. Problem: One person dominates the discussion.
     - Mitigation: Set discussion time limits. Encourage quieter players by asking: "What does your character think?"

  4. Problem: Players don't take roles seriously.
     - Mitigation: Emphasize the stakes and the fact that they can lie about preferences but must stick to the facts. The shock cards add drama.

  What the Activity Can't Capture:
  - Real power asymmetries: In reality, developers often have more resources (lawyers, experts) than residents. Absent residents (like renters) may lack organization. The activity simplifies these power dynamics.
  - Long-term effects: Displacement, generational wealth, and historical context (e.g., redlining) are flattened. The shock cards are immediate, but real changes unfold over years.
  - Emotional weight: Decades of attachment to a home or fear of displacement are hard to simulate in a role card.

  Final Materials Preparation:
  - Print role cards (6 per table, 3 tables = 18 cards).
  - Print shock cards (3 total, one for each table).
  - Print absent-resident cards (6-9 total, 2-3 per table).
  - Prepare block maps (simple sketch: streets, houses, empty lot).
  - Voting ballots: one set for rule vote (with the four options) and one for project vote (yes/no) for each round.

  This design should create a visceral experience of the tensions in urban development decisions and set up a rich debrief on the ethics of procedures and exclusion.
answer: |-
  ### **Activity Design: "The Corner Lot Dilemma"**  
  **Goal:** Make participants feel the procedural ethics of NIMBYism—how "who decides" shapes outcomes, and how positions are tied to circumstances, not hypocrisy.  

  ---

  ### **Setup & Materials**  
  **Time:** 80 minutes  
  **Participants:** 18 people (3 tables of 6).  
  **Materials per Table:**  
  1. **Block Map:** A simple sketch of a residential block with an empty corner lot.  
  2. **Role Cards:** 6 cards (one per participant).  
  3. **Shock Cards:** 3 cards (one drawn randomly per table in Round 2).  
  4. **Absent-Resident Cards:** 3 cards (placed on the table in Round 2).  
  5. **Voting Slips:** For rule votes (options: Unanimous, 2/3 Majority, Simple Majority, Abutter Veto) and project votes (Yes/No).  

  **Printables:**  
  - **Role Cards** ([Print 1 set per table](https://i.ibb.co/6nL7K0b/role-cards.png)):  
    > **Homeowner A (Corner Abutter):**  
    > - *Facts:* Your house borders the empty lot. You cherish your garden’s sunlight and quiet mornings.  
    > - *Stakes:* A 4-story building blocks your light, increases noise, and may lower your property value. Your well-being depends on tranquility.  
    > - *Secret Script:* "This will ruin my home. I’ll lose the only place that feels safe."  
    >
    > **Homeowner B (View Enthusiast):**  
    > - *Facts:* Your living room overlooks the empty lot and a park beyond. You host book club here.  
    > - *Stakes:* The building destroys your view. You’re retired and can’t afford to move.  
    > - *Secret Script:* "That view is my daily joy. Without it, this house is worthless to me."  
    >
    > **Homeowner C (Family Anchor):**  
    > - *Facts:* You live 3 houses down. Your kids play on the street. You’re active in the neighborhood watch.  
    > - *Stakes:* More residents = more cars = unsafe streets. You fear crowded schools.  
    > - *Secret Script:* "I fought for this community. Newcomers don’t care about kids like mine."  
    >
    > **Homeowner D (Empty Nester):**  
    > - *Facts:* You’ve lived here 20 years. Your mortgage is paid off. You’re considering downsizing.  
    > - *Stakes:* The building could raise property values (good for selling) but disrupt the neighborhood’s "charm."  
    > - *Secret Script:* "Maybe I can sell high and leave... but what about my friends?"  
    >
    > **Renter (Precarious Tenant):**  
    > - *Facts:* You rent a cramped apartment nearby. Rent jumped 30% last year. You work two jobs.  
    > - *Stakes:* The building includes 2 affordable units. This might be your only chance to stay in the neighborhood.  
    > - *Secret Script:* "If I’m priced out, I lose my job, my kid’s school, everything."  
    >
    > **Small Developer (Under Pressure):**  
    > - *Facts:* You own the lot. Your loan requires breaking ground in 6 months. The city needs housing.  
    > - *Stakes:* If delayed, you lose financing. The lot stays empty, and you go bankrupt.  
    > - *Secret Script:* "I’m not a corporation—I live here too. This project keeps my business alive."  

  - **Shock Cards** ([Print 3 cards total](https://i.ibb.co/6nL7K0b/shock-cards.png), one per table):  
    > **Shock 1: Renter’s Lease Ends**  
    > - *Facts:* The renter’s landlord just notified them of a 40% rent hike. They must move in 60 days unless the new building is approved.  
    > - *Effect:* The renter is now desperate. Their vote may shift, and others must react.  
    >
    > **Shock 2: Distant Job Offer**  
    > - *Facts:* Homeowner B got a dream job in another state. They’ll sell in 3 months.  
    > - *Effect:* Their view matters less now. Do they prioritize quick profit or legacy?  
    >
    > **Shock 3: Family in Crisis**  
    > - *Facts:* A family of 4 is homeless after an eviction. They’ve applied for an affordable unit in the new building.  
    > - *Effect:* This humanizes the project. Opponents must confront real beneficiaries.  

  - **Absent-Resident Cards** ([Print 3 cards per table](https://i.ibb.co/6nL7K0b/absent-cards.png)):  
    > **Card 1: Night-Shift Worker**  
    > - *Facts:* Works 10 PM–6 AM. Sleeps during meetings. Needs affordable housing near their job.  
    > - *Stakes:* Silent during votes. Their fatigue is invisible to the group.  
    >
    > **Card 2: Future Resident**  
    > - *Facts:* A teacher who can’t afford current rents. Would move into the new building.  
    > - *Stakes:* No voice in decisions but deeply affected by exclusion.  
    >
    > **Card 3: Displaced Elder**  
    > - *Facts:* Lived here 40 years. Priced out last year. Now faces a 2-hour commute.  
    > - *Stakes:* Past displacement isn’t considered in current votes.  

  ---

  ### **Timeline (80 Minutes)**  
  **0:00–0:05 — Intro (You Facilitate)**  
  - **Say:** "Today, we’re simulating a neighborhood decision about a corner-lot development. You’ll role-play residents with competing interests. Rules:  
    1. You may lie about your *preferences* but not the *facts* on your card.  
    2. Two votes: First on *how* to decide, then on *whether* to build.  
    3. Stakes are your character’s well-being—not money."  
  - **Do:** Assign roles randomly at each table. Show the block map.  

  **0:05–0:20 — Round 1: Rule Vote & Project Vote**  
  - **Step 1: Secret Rule Vote (5 mins)**  
    - *Say:* "Write your choice on a slip: **Unanimous, 2/3 Majority, Simple Majority, or Abutter Veto** (only adjacent homeowners can veto). Vote based on what helps *your role*. No discussion."  
    - *Do:* Collect votes, tally, and announce the rule for each table.  
  - **Step 2: Project Discussion (10 mins)**  
    - *Say:* "Debate the 4-story building. Argue your role’s interests. Remember: lying about preferences is allowed, but stick to facts."  
  - **Step 3: Project Vote (5 mins)**  
    - *Do:* Hold a public vote (hands) using the chosen rule. Record results.  

  **0:20–0:45 — Round 2: Shock & Re-Vote**  
  - **Step 1: Introduce Shock & Absent Residents (5 mins)**  
    - *Say:* "3 months passed. Draw one shock card. Read it aloud. Also, these absent residents [place cards] are affected but can’t speak. Consider them."  
  - **Step 2: Re-Vote Rule & Project (20 mins)**  
    - *Do:* Repeat secret rule vote → tally → project debate → project vote.  
    - *Say:* "Discuss how the shock and absentees change your stance."  

  **0:45–1:05 — Debrief (20 mins)**  
  Start with reactions, then layer in theory:  
  1. **Reactions (5 mins):**  
     - *Ask:* "What surprised you? Did anyone feel trapped by their role?"  

  2. **Procedural Rights (5 mins):**  
     - *Map:* "The rule vote decided who had power *before* the debate. Unanimous gave everyone veto power; abutter veto privileged proximity. **Key Insight:** There’s no neutral way to decide—every rule distributes rights unevenly."  

  3. **Shocks & Stability (5 mins):**  
     - *Map:* "When the renter faced eviction or Homeowner B got a job offer, their ‘principles’ shifted. **Key Insight:** NIMBYs aren’t hypocrites—their position is rational *for their circumstances*. Use value (home as sanctuary) vs. exchange value (home as asset) creates irreconcilable stakes."  

  4. **Absent Residents (5 mins):**  
     - *Map:* "The night-shift worker couldn’t advocate for their need. **Key Insight:** Decision procedures exclude marginalized voices by design—e.g., meetings at 7 PM assume free evenings. This isn’t an accident; it’s systemic."  

  **1:05–1:20 — Final Q&A (15 mins)**  
  - Discuss real-world parallels: e.g., "How do cities address absent stakeholders?"  

  ---

  ### **What Will Go Wrong (and Fixes)**  
  1. **The Developer Gets Dogpiled:**  
     - *Why:* Homeowners may unite against "greed."  
     - *Fix:** Remind them: "The developer is local and needs this to survive. If they fail, the lot stays vacant." Use the shock card to humanize them (e.g., "My kids’ college fund is tied to this").  

  2. **Unanimous Approval (No Conflict):**  
     - *Why:* Players avoid confrontation.  
     - *Fix:** Assign roles strictly—ensure anti-development players (Homeowners A-C) lean into NIMBYism. Shock cards add pressure (e.g., the desperate renter may sway votes).  

  3. **Role Misunderstanding:**  
     - *Why:* Confusion between "preferences" vs. "facts."  
     - *Fix:** Clarify rules twice. Example: "Homeowner D *can* lie about supporting the project to sell high, but *can’t* lie about having a paid-off mortgage."  

  4. **Shallow Discussion:**  
     - *Why:* Students debate abstractly, not emotionally.  
     - *Fix:** Urge them: "Speak as your role. Use ‘I’ statements: ‘*My* garden will die if this passes.’"  

  ---

  ### **What This Can’t Capture (Be Honest)**  
  - **Power Asymmetries:**  
    - Real developers hire lawyers; renters lack resources. Here, all roles have equal voice.  
    - *Mitigation:* In debrief, note: "In reality, Homeowner A might sue, while the Renter can’t afford a lawyer. This simulates ideals, not power."  

  - **Long-Term Displacement:**  
    - Shock cards show immediate crises, not generational trauma (e.g., redlining).  
    - *Mitigation:* Highlight absent residents: "The Displaced Elder card represents history we ignore."  

  - **Emotional Weight:**  
    - Role cards can’t replicate decades of attachment.  
    - *Mitigation:* Use secret scripts (e.g., "Your garden is your therapy after your spouse died") to add depth.  

  - **Structural Incentives:**  
    - Real cities have tax policies, zoning codes, and racist histories.  
    - *Mitigation:* In intro, say: "We’re isolating the ‘who decides’ question—but remember, this sits within larger systems."  

  ---

  ### **Why This Works**  
  - **Secret Rule Vote:** Forces players to confront procedural bias upfront.  
  - **Shock Cards:** Reveal how "principles" are circumstantial.  
  - **Absent Residents:** Visualize exclusion without lecturing.  
  - **Debrief:** Connects feelings to theory—e.g., "When you voted for abutter veto, you made proximity a right."  

  **Final Tip:** Start cold—no lecture. Let the game do the teaching. Then, in debrief, reveal how each moment maps to ethics. They’ll feel the tension between fairness and self-interest.
