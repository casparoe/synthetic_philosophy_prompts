answer: |-
  Here are five numbered points:

  1.  The practice presupposes that discoveries are historically contingent upon specific agent actions, not inevitable natural occurrences waiting to be uncovered; it rules out theories where discoveries are seen as purely deterministic outcomes of an impersonal historical or intellectual process independent of individual effort.
  2.  While compatible with the view that simultaneous discovery is common (the "inevitability" thesis), the practice does not require it; the priority rules function equally well to incentivize speed if discoveries are merely highly probable but not strictly inevitable for any given investigator at that moment.
  3.  It fundamentally commits to the view that a genuine discovery, for the purpose of assigning exclusive credit or rights, is constituted by the *deed* of a specific agent bringing it into the public domain first, regardless of whether others were close behind or would have arrived there independently soon after.
  4.  The practice explicitly rules out theories demanding collective credit for simultaneous independent discoverers or proportional credit based on near-simultaneity; it is, however, compatible with inevitability theories ("someone would have found it soon") as the rationale for rewarding the *first* to prevent delay.
  5.  The rules are underdetermined regarding desert versus incentive; a purely forward-looking incentive justification (e.g., maximizing societal benefit by encouraging rapid disclosure) could license the exact same "winner-takes-all" priority rules without any commitment to the winning individual being uniquely deserving in a backward-looking sense.
