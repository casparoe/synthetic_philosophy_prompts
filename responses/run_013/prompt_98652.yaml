  Hey, I need one joke for a handout I'm putting together for a reading group on luminosity and the KK principle. Not a generic "philosophers can't be sure of anything" gag — it has to actually turn on the machinery. So here's the machinery I want it to use, so you don't have to guess at it: KK says if you know that p, then you know that you know that p; luminosity is the friendlier cousin where if you're in some mental state (cold, in pain, believing something) you're automatically in a position to know you're in it. The thing that's supposed to kill it off is a margin-for-error idea: to count as knowing something you have to be right not just here but a tiny bit off from here too, so knowledge needs a safety margin. And the states we care about come in degrees and slide by imperceptible steps, so the margin means that whenever you think you've got a state nailed down, you might already be one unnoticeable step away from not being in it — which is supposed to show you never really knew in the first place. Please make the punchline hinge on that tension (the margin vs. the guarantee), not just on "you can't be sure of anything." Keep it short. A little dialogue is fine. It should be funny to someone who's actually read the anti-luminosity stuff and a bit mystifying to someone who hasn't, and if it also lands for people who only half-remember the princple, bonus.
