prompt: |-
  I'm a second-year PhD student in philosophy, working mainly on metaethics and the philosophy of action, and I keep running into a slogan that I now realize I do not understand in any precise way. The slogan is "you can't get an ought from an is." I first met it in a seminar on practical reason, where a commentator used it to brush aside a paper arguing that once we see how certain social arrangements produce avoidable suffering, we have all the facts we need to conclude that we ought to change them. Since then I've heard it used for at least four different jobs: to reject a definition of "good" in natural terms, to deny that any descriptive premises can logically entail a normative conclusion, to insist that facts alone cannot motivate anyone to act, and to claim that normative properties are not part of the natural world. I suspect these are not the same claim and that some are trivial while others are controversial or even false, but I can't get the distinctions straight enough to say which.

  Could you lay out, as a menu rather than a single favored interpretation, the distinct precise theses that "you can't get an ought from an is" could be expressing? I would like each reading stated in a way that makes its commitments explicit -- for example, whether it is a claim about formal validity, about meaning and analyticity, about epistemic justification, about motivation, about metaphysics, or about the pragmatics of accepting a conclusion -- and then a verdict on each: which are platitudes no one should deny, which are substantive and defensible, which are probably false, and which are simply confused. I am especially interested in how the slogan relates to what gets called the naturalistic fallacy, since I think people around me use the two interchangeably, and in whether any of the readings can do the work my seminar commentator needed. To make that last question concrete: suppose someone argues that because a practice causes avoidable suffering at low cost, we ought to abolish it; which reading of the slogan would have to be true for that inference to be illegitimate, and does that reading survive scrutiny? It would help if you also considered potential pressure points -- thick ethical concepts that seem both descriptive and evaluative, institutional facts that appear to be normative all the way down, instrumental principles that license an "ought" from a desire plus a fact, and the difference between entailment and conversational implicature. No citations or reading list needed; I want the conceptual map and the verdicts.
reasoning: |-
  Okay, let's tackle this PhD student's query about "you can't get an ought from an is." They're in philosophy, focusing on metaethics and philosophy of action, and they've encountered this slogan used in multiple ways. They need clarity on the distinct interpretations of the slogan, their commitments, and their validity. Plus, they want to know if any version can invalidate the inference from "practice causes suffering" to "we ought to abolish it."

  First, I recall Hume's original point in the Treatise. He observed that moralists shift from "is" and "is not" to "ought" and "ought not" without explanation. But he didn't frame it as a strict logical rule; it was more about needing a reason for the transition. So the slogan has been stretched beyond that.

  The student mentioned four uses: rejecting naturalistic definitions, denying entailment from descriptive to normative, facts not motivating, and normative properties not being natural. These need unpacking. Let me list possible precise theses.

  Start with logical entailment. One interpretation is that no set of descriptive premises can entail a normative conclusion without normative content. That seems plausible. For example, "X causes suffering" doesn't logically force "ought to abolish X" without some normative bridge. But then, if you add a premise like "suffering ought to be prevented," it works. So this version holds unless you have normative premises. It's a formal validity point.

  Next, definitional naturalism. Defining moral terms purely descriptively, like "good" as "pleasure." Moore's naturalistic fallacy comes in here. He argued that such definitions commit a fallacy because you can always question if the natural property is good. So this thesis is about meaning and is defensible, though contested by naturalists.

  Motivational internalism: facts alone can't motivate. Hume's psychology fits here—reason is the slave of the passions. Descriptive beliefs need desires to motivate. This is a substantive claim in philosophy of mind. Internalists accept it, externalists deny it. So it's controversial.

  Metaphysical non-naturalism: normative properties aren't natural. This is a claim about ontology. Moore and non-naturalists hold this; naturalists reject it. It's a major debate in metaethics.

  Then there's the pragmatic point: accepting descriptive facts doesn't force normative conclusions without normative commitments. This is about argumentative burden and seems plausible.

  Now, applying these to the seminar example. The argument was: practice causes avoidable suffering, so we ought to abolish it. For the slogan to invalidate this, which thesis must be true? The logical entailment thesis would require that the inference lacks validity unless there's a hidden normative premise. That's likely true here—without assuming suffering should be prevented, the conclusion doesn't follow. But if such a premise is added, it works. So the commentator might be right only if they point out the missing premise, not that the inference is inherently invalid.

  Thick concepts and institutional facts complicate things. Terms like "cruel" mix description and evaluation, so they might bridge is and ought. Institutional facts, like "this is a promise," carry normative force. These challenge pure separations.

  Instrumental reasoning: if you desire an end, and an action is necessary, then you ought to do it. But this relies on a normative principle of rationality.

  So, verdicts: Logical entailment is a platitude if we require explicit normative premises. Definitional naturalism is defensible but debated. Motivational internalism is substantive and contested. Metaphysical non-naturalism is also contested. The pragmatic point is plausible.

  The naturalistic fallacy is often conflated with the slogan. Moore focused on defining goodness in natural terms, whereas Hume's point was broader. They overlap but aren't identical.

  For the student's case, the logical gap thesis highlights the need for a normative premise in the suffering argument. But once added, the inference works. So the slogan, in this reading, doesn't dismiss the argument but clarifies its structure.
answer: |-
  Here's a conceptual map of distinct theses captured by "you can't get an ought from an is," organized by their commitments, verdicts on plausibility, and implications for your seminar example. I'll treat the slogan as a *family* of claims, not a single doctrine. The "naturalistic fallacy" (Moore's term) overlaps significantly but targets definitions specifically—I'll note connections.

  ---

  ### **The Menu of Interpretations**

  1. **The Logical Gap Thesis**  
     - **Commitments**: Formal validity in deductive logic. No set of *purely descriptive* premises (statements about what *is* the case) can *entail* a purely normative conclusion (a statement about what *ought* to be) without at least one normative premise.  
     - **Verdict**: **Platitude, but trivial**. True by definition: descriptive premises contain no normative operators, so no deductive rule can "generate" one.  
     - **Pressure Points**:  
       - *Thick concepts* (e.g., "cruel," "courageous"): If these are both descriptive and normative, they might bridge the gap. But they arguably presuppose normative standards.  
       - *Institutional facts* (e.g., "This is a promise"): Seem descriptive but imply norms (e.g., "ought to keep"). However, the normativity here is conditional (e.g., *if* you accept the institution).  
     - **Naturalistic Fallacy Link**: Distinct. Moore’s fallacy concerns defining "good" in natural terms, not logical entailment.  
     - **Seminar Example Relevance**: For the inference ("causes suffering → ought to abolish") to be *formally invalid*, this thesis must hold. It does—but adding a suppressed normative premise (e.g., "Avoidable suffering ought to be prevented") validates it. The slogan highlights a missing step but doesn't doom the argument.

  2. **The Semantic Barrier Thesis**  
     - **Commitments**: Meaning and analyticity. Normative terms (e.g., "ought," "good") cannot be *defined* using purely descriptive/naturalistic vocabulary without loss of meaning. Normative claims are not reducible to descriptive ones.  
     - **Verdict**: **Substantive and defensible** (but contested). Moore’s "open question argument" backbone: if "good" meant "pleasure," asking "Is pleasure good?" would be tautological—but it’s meaningful.  
     - **Pressure Points**:  
       - *Naturalist reductions* (e.g., "good = conducive to flourishing"): Rejected here as category errors.  
       - *Thick concepts*: Pose a challenge if their evaluative content is semantically inseparable from description.  
     - **Naturalistic Fallacy Link**: **Direct**. This *is* the naturalistic fallacy—defining normative properties in natural terms.  
     - **Seminar Example Relevance**: Irrelevant. The argument doesn’t propose a definition; it infers a norm from facts. The slogan here targets metaethical reductionism, not everyday moral reasoning.

  3. **The Motivational Inertia Thesis**  
     - **Commitments**: Philosophy of mind/action. Purely descriptive beliefs (e.g., "This causes suffering") cannot *motivate* action without a pre-existing desire or conative state.  
     - **Verdict**: **Substantive and defensible** (Humean internalism). Desires supply the "oomph"; reason alone is inert. Externalists (e.g., moral realists) deny this.  
     - **Pressure Points**:  
       - *Moral perception*: If suffering *directly* motivates, facts might carry normative force. Internalists reply: motivation still requires a conative disposition.  
       - *Instrumental "oughts"* (e.g., "If you want X, you ought to do Y"): Motivating but rely on a desire for X.  
     - **Naturalistic Fallacy Link**: Indirect. Motivational gaps might explain why definitions fail, but not identical.  
     - **Seminar Example Relevance**: Tangential. The commentator might imply that "seeing suffering" isn’t enough to *move* us—but this is about psychology, not logical validity.

  4. **The Metaphysical Gap Thesis**  
     - **Commitments**: Ontology. Normative properties (e.g., *obligation*) are not part of the natural world and cannot be reduced to or supervene on natural properties without normative laws.  
     - **Verdict**: **Substantive and contested**. Non-naturalists (e.g., Parfit) endorse this; naturalists (e.g., Railton) reject it.  
     - **Pressure Points**:  
       - *Supervenience*: Normative properties depend on natural ones but aren’t identical. Non-naturalists must explain this dependence.  
       - *Causal efficacy*: If normative properties aren’t natural, how do we know them?  
     - **Naturalistic Fallacy Link**: Close. Moore thought "good" denoted a non-natural property; this extends to all normativity.  
     - **Seminar Example Relevance**: Indirect. If true, normative conclusions require non-natural grounds—but the argument might still work if "ought" is irreducible.

  5. **The Justificatory Gap Thesis**  
     - **Commitments**: Epistemology. Descriptive facts alone cannot *justify* normative conclusions without prior normative commitments (e.g., principles, values).  
     - **Verdict**: **Substantive and defensible**. Echoes foundationalism: normative claims need normative foundations. Coherentists/naturalists might deny this.  
     - **Pressure Points**:  
       - *Reflective equilibrium*: Justification may involve iterating between facts and norms.  
       - *Institutional facts* (e.g., "This vote is illegitimate"): Derive normativity from systems we endorse.  
     - **Naturalistic Fallacy Link**: Only if justification requires non-natural grounds.  
     - **Seminar Example Relevance**: Key for your commentator. To reject "suffering → ought," they likely assume this: facts need normative supplementation (e.g., "Suffering matters morally"). Without it, the inference is question-begging.

  6. **The Pragmatic Implication Thesis**  
     - **Commitments**: Pragmatics of argumentation. Accepting descriptive premises doesn’t *rationally compel* acceptance of a normative conclusion unless the interlocutor shares relevant normative commitments.  
     - **Verdict**: **Platitude**. A point about dialectic, not logic. If you deny "Suffering ought to be prevented," descriptive facts won’t sway you.  
     - **Pressure Points**:  
       - *Thick concepts*: Calling a practice "oppressive" may pragmatically implicate "ought to abolish."  
       - *Conversational implicature*: Describing suffering may carry an evaluative charge contextually.  
     - **Naturalistic Fallacy Link**: None.  
     - **Seminar Example Relevance**: Explains why the commentator "brushed aside" the argument. They likely denied the implied norm (e.g., suffering is bad). The slogan here warns against assuming shared values.

  ---

  ### **Summary Verdicts & Seminar Application**
  - **Platitudes**: Logical Gap (1) and Pragmatic Implication (6). Hard to deny but unexciting.  
  - **Defensible & Substantive**: Semantic Barrier (2), Motivational Inertia (3), Justificatory Gap (5). Core metaethical debates.  
  - **Contested**: Metaphysical Gap (4). Divides non-naturalists/naturalists.  
  - **Confused Uses**: Using the slogan to dismiss *all* fact-to-norm inferences (e.g., ignoring instrumental or contextual normativity).  

  **For your seminar example**:  
  - **Which thesis invalidates the inference?** Only the **Logical Gap (1)** and **Justificatory Gap (5)** are directly relevant.  
    - (1) shows the argument isn’t *formally valid* without a normative premise (e.g., "Avoidable suffering is bad").  
    - (5) shows that without shared normative commitments, the facts alone don’t *justify* the conclusion.  
  - **Does it survive scrutiny?**  
    - (1) survives trivially: add the missing premise, and the inference works.  
    - (5) survives scrutiny *if* you grant that justification requires normative foundations. But if normative facts are grounded in natural ones (e.g., suffering *constitutes* badness), (5) may collapse. Thick concepts ("cruel") or instrumental reasoning ("if you value welfare, then...") can bridge the gap contextually.  

  **Bottom line**: The slogan’s power in your seminar relied on the **Justificatory Gap**. The commentator implied that descriptive facts about suffering need normative support to yield an "ought." This is defensible but not fatal—it exposes a premise needing defense, not a flaw in principle. The inference holds if the normative premise (e.g., "Preventing suffering is obligatory") is defensible independently.
