prompt: |-
  For thirty years I built interferometers and worried about systematic error, and since retiring I have been sitting in on a graduate seminar in the philosophy of perception, where I have discovered that I am a poor philosopher and an enthusiastic one. The topic I cannot get any purchase on is the dispute over whether a case of genuinely seeing something and a case of merely seeming to see it are episodes of the same fundamental kind. The argument for the negative answer looks trivial when I read it and yet evidently moves people, and I have come to suspect it is one of those arguments whose force is invisible in print. I have talked the seminar leader into letting me run one session, and I want it to be an experiment rather than a lecture: twelve to fourteen graduate students, roughly half from philosophy and half from cognitive science, ninety minutes, in a seminar room with movable chairs, decent blackout, a whiteboard, and a small budget (say fifty euros) for props, plus whatever I can salvage from the lab's discards. Please design the session for me.

  What I want them to have felt by the end is a particular inferential step and its cost, not a doctrine, and I would rather the names of the positions were not spoken until the debrief. Early on, the activity should get them to make the move themselves, in their own persons and without being told to: from the fact that two episodes cannot be told apart from the inside, to the conclusion that the two must therefore have something of the same kind at their core, with the difference between them lying somewhere outside the experience — in how it was caused, or in whether an object happened to be there. The rules should make that commitment something they have actually recorded (a vote, a written verdict, a classification they must sign) before anything undermines it, and the staging should be genuinely first-person wherever possible: the old trick of crossing the fingers and touching the tip of the nose so that one nose is felt as two is cheap and repeatable, and I want at least one moment where a participant cannot tell, by any means available to them, whether what another participant is reporting is a perception or a mistake, and must nonetheless act on it. Then, in the second half, the ground should shift under the commitment they made. I want three things built into that shift. First, a case where the causal history is thoroughly abnormal but the report happens to be correct — I have in mind the sort of thing where direct stimulation of the relevant cortex yields an experience matching what is actually in front of the subject — because that puts pressure on the idea that what makes the good case good is merely its causal pedigree. Second, the disjunctivist's negative characterisation of the bad case: the hallucinating subject is not in a state of a distinctive kind that the perceiver also occupies, only in one that cannot be told apart from it. Third, the two worries that this immediately provokes, which I want the room to generate rather than receive: that it leaves the difference between the cases brute and inexplicable, and that it threatens the perceiver's justification, since the hallucinator seems to be as well placed as the perceiver with respect to how things seem.

  Give me the whole thing as a runnable package: a materials list with a fallback for every prop, the roles (including whether I need a confederate and how to brief that person so they do not give the game away), the sequence with timings, the precise points at which participants commit to something in writing, and the moment at which I should expect the room to divide. Then a debrief that maps each stage of what actually happened onto the corresponding step in the reasoning, keeping the argument from illusion — the mismatch between how something appears and how it is — clearly separate from the argument from hallucination, where there is no object at all, since I gather these are routinely run together and that the heavy lifting is done by the second. It should also keep separate the version of the disagreement about what experience is and the version about what justifies a perceptual belief. Tell me what will predictably go wrong the first time I run it — I expect the illusion to fail on two or three people, someone to announce that this is all just misfiring neurons and therefore not philosophy, and someone else to refuse to commit because they can see where I am steering them — and how to handle each without sliding into a lecture. Finally, be straight with me about what the activity cannot do: I assume it can stage indistinguishability but not sameness or difference of kind, and that a staged illusion is not a hallucination, so tell me which premise the room will simply have to take on my word and how I should flag that at the close. I would rather they leave dissatisfied and clear-headed than satisfied and confused, and I want them to see what the disjunctivist's move costs, not merely that it is available.
reasoning: |-
  We are designing a 90-minute seminar session for a mixed group of philosophy and cognitive science graduate students. The goal is to have participants experience the inferential step from indistinguishability to sameness of kind (with the difference lying in external factors) and then challenge that commitment by introducing disjunctivist concerns. The session should avoid naming positions until the debrief and should be experiential.

  Key elements:
  1. Early activity: participants make the move from indistinguishability to same kind of episode (with external difference) and commit to it in writing.
  2. Use first-person experiences: e.g., crossed fingers illusion.
  3. Include a moment where one participant must act on another's report without knowing if it's perception or error.
  4. Second half: undermine the initial commitment with:
     a. A case of abnormal causal history but correct report (e.g., direct cortical stimulation matching reality).
     b. The disjunctivist idea that the hallucination is not a state of the same kind as perception.
     c. Two worries: the difference becomes brute and inexplicable, and it threatens justification.

  Structure:
  - Introduction (5 min)
  - Activity 1: Crossed fingers illusion and commitment (15 min)
  - Activity 2: Acting on another's report (20 min)
  - Activity 3: Challenging the commitment (30 min)
  - Discussion and debrief (20 min)

  Materials:
  - Movable chairs for group work.
  - Blackout for controlling light (for some illusions).
  - Whiteboard for instructions and recording.
  - Props (budget 50 euros):
     - Small objects for tactile tasks (e.g., marbles, textured fabrics) - 5 euros.
     - Blindfolds (2-3) - 5 euros.
     - A laser pointer (or penlight) for pointing - 5 euros.
     - A small plant or artificial flower (for the hallucination scenario) - 10 euros.
     - A buzzer or bell (for responses) - 5 euros.
     - Paper and pens for written commitments - 5 euros.
     - Optional: a prism (for visual distortion, if available from lab discards) or a mirror.
  - Fallbacks: 
     - If no blackout, use a dark corner or a box for tactile tasks.
     - If no laser pointer, use a stick.
     - If no buzzer, use hand raising.

  Roles:
  - The instructor (you) to facilitate.
  - One confederate (a graduate student briefed in advance) for Activity 2. They will be the one reporting (either truthfully or deceptively) in a scenario.

  Confederate briefing:
  - They will be given a card with a scenario (either a true perception or a false one) and must report accordingly. They must not reveal the deception until the debrief. We'll have two scenarios: one where they see a plant and report truthfully, and one where they are blindfolded but still report seeing a plant (as if hallucinating). The confederate must be consistent and not overact.

  Sequence:

  1. Introduction (5 minutes):
     - Welcome and set the stage: "Today we are going to explore how we come to know about the world through perception. We'll do some activities and then discuss. I ask that you try to participate fully and record your thoughts as we go."
     - Explain the rules: "We are going to have a few exercises. I'll ask you to write down your judgments at certain points. These are for your own reflection and for discussion, not for grading. Also, we'll be moving around a bit."

  2. Activity 1: Crossed Fingers Illusion and Commitment (15 minutes)
     - Have participants pair up (or do it themselves if alone).
     - Instructions: "Cross your fingers (index and middle) and then touch the tip of your nose. What do you feel? ... Now uncross and touch again. What do you feel now?"
     - After they try: "When you cross your fingers, you feel two nose tips. But of course, there is only one nose. So, in the crossed-fingers case, you are having an experience that does not match reality. But note: from the inside, the experience of two nose tips feels just like the experience of two actual objects. Now, write down on the paper: 
          'In the crossed-fingers case, I am having an experience that is fundamentally the same kind of experience as when I touch two actual objects with uncrossed fingers? Yes/No. The difference is only in the cause (my crossed fingers vs two objects).' 
       Then sign and date it."
     - Collect the papers (or have them keep for later, but you want commitment recorded).
     - Whiteboard: Tally the votes (if you collect) or note that most said yes.

  3. Activity 2: Acting on Another's Report (20 minutes)
     - Set up: One participant (the confederate) will be seated at a table. On the table, there is a plant (or artificial flower). The room is normally lit. The confederate is either looking at the plant (condition A) or blindfolded (condition B). You will randomly assign the condition by drawing a card (but the confederate knows in advance which condition they are in because they are briefed).
     - Instructions to the group: "We are going to play a game. [Confederate's name] is sitting at the table. I may or may not place a plant in front of them. They will tell us whether they see a plant. Your job is to decide, based on their report, whether to water the plant. If you decide to water, you must actually pour water (we'll use an empty pitcher to simulate). But note: if there is no plant and you water, you make a mess. If there is a plant and you don't water, it might die. We will do two rounds."
     - Round 1 (condition A: plant present, confederate not blindfolded): 
          - Place the plant. Confederate reports: "I see a plant." 
          - Ask the group: "Do you water?" They must vote (by show of hands) and then one volunteer pours (with empty pitcher).
     - Round 2 (condition B: confederate blindfolded, plant present or absent? We want the confederate to report seeing a plant even though they are blindfolded. But note: if the plant is present, then even though they are blindfolded, they might be hallucinating and by chance it's there. To make it a pure hallucination, we remove the plant. However, to avoid giving away that the plant might be absent, we do:
          - Remove the plant while the confederate is blindfolded (but the group should not see the removal? That might be tricky). Alternatively, we can have the plant absent from the start and the confederate is blindfolded and reports seeing a plant (hallucination). 
          - So: Round 2: no plant, confederate blindfolded. Confederate reports: "I see a plant." 
          - Group must decide: water or not? They vote and then pour (or not).
     - After both rounds: "In the first round, you watered because you believed the report. In the second round, if you watered, you made a mess. But note: from your perspective, the reports were the same. You could not tell from the report alone whether it was a genuine perception or a mistake (hallucination). But you had to act. Now, write down: 
          'The report of seeing a plant in the two cases was the same kind of mental state? Yes/No. The difference is only in the cause (actual plant vs. hallucination).' 
       Sign and date."
     - Collect or have them keep.

  4. Activity 3: Challenging the Commitment (30 minutes)
     - Now we challenge the initial commitment with three elements.

     a. Abnormal causal history but correct report:
        - Describe a thought experiment: "Imagine a subject in a lab. The experimenter directly stimulates the visual cortex to produce an experience of a red apple. At the same time, by coincidence, there is a red apple in front of the subject. So the subject reports 'I see a red apple'. The report is correct, but the causal chain is abnormal (direct brain stimulation). Does this count as seeing? Write down your initial reaction: Yes or No? Why?"
        - Let them write briefly (2 min) then discuss in pairs (3 min). Then ask for a show of hands: who thinks it is seeing? Who thinks it is not? Note the division.

     b. Disjunctivist's negative characterization:
        - Without naming disjunctivism, present: "One view is that when the subject hallucinates, they are not in a state that is fundamentally the same as when they see. The seeing state is one thing, the hallucination is another, and they only seem the same. The difference is not just in the cause but in the very nature of the state. The subject in the hallucination case is not in a state that the perceiver is also in, except for the fact that they can't tell the difference."
        - Ask: "What worries does this raise?" Let them discuss in groups of 4 (5 min). Then each group reports one worry.

     c. Two worries:
        - The room should generate:
           1. Brute difference: How can two states be indistinguishable but fundamentally different? That seems inexplicable.
           2. Threat to justification: If the hallucinator is in a state that is indistinguishable from seeing, then how can the perceiver be justified? The perceiver could be in the same state as the hallucinator and not know it.
        - Write these on the whiteboard as they come up.

  5. Discussion and Debrief (20 minutes)
     - Now name the positions: "What we've been exploring is the argument from illusion and hallucination. The initial move you made is the common kind view: that perception and hallucination are the same kind of state because they are indistinguishable from the inside. The challenge is the disjunctivist view: they are not the same kind; the good case (perception) is one thing, the bad case (hallucination) is another, and they only share the property of being indistinguishable for the subject."
     - Map the activities:
          - Activity 1 (crossed fingers) was an argument from illusion (mismatch between appearance and reality).
          - Activity 2 (hallucination) was an argument from hallucination (no object at all).
          - Note: the heavy lifting is done by the hallucination argument because in illusion there is still an object, but in hallucination there is none.
     - Clarify the two versions:
          - Metaphysical: What is the nature of experience? (common kind vs disjunctivist)
          - Epistemological: How do we get justification? (if the states are the same, then the perceiver has no better reason than the hallucinator)
     - Point out the two worries from Activity 3c and how they remain challenges.

  Predictable problems and solutions:
  1. The illusion fails on some people: Some might not feel two noses. 
     - Solution: Have a backup illusion (e.g., the rubber hand illusion if time and materials allow, but that's complex). Alternatively, use the visual illusion: hold a finger close to the nose and look at it with one eye and then the other, noting the shift. Or use a prism to shift vision. But since we have a budget, we can get a prism (or use a glass of water as a lens). Alternatively, use the mirror: put a mirror vertically and have them put their nose to the edge, so they see two halves of their face. But that might be too obvious. 
     - In the moment: Acknowledge that not everyone experiences the illusion and use that to discuss individual differences.

  2. "This is just misfiring neurons, not philosophy":
     - Solution: "That's a good point. We are using empirical examples to explore a philosophical question: what is the nature of experience and justification? The cognitive science students might help us connect the neural level to the philosophical."

  3. Someone refuses to commit because they see where you're steering:
     - Solution: "That's fine. You can write down that you are withholding judgment and why. We are interested in your honest reaction."

  What the activity cannot do:
  - It stages indistinguishability but does not prove that the states are the same kind or different. The room must take on your word that disjunctivism is a live option and that the common kind view is not the only possibility. 
  - The staged hallucination (Activity 2) is not a real hallucination; it's a deception. We are relying on the thought experiment for the hallucination case. 
  - At the close: "Today we've seen how indistinguishability pushes us to think that perception and hallucination are the same kind of state. But we've also seen the cost of denying that: it makes the difference between seeing and hallucinating brute and threatens our justification. We haven't settled the issue, but we've felt the pull of both sides. Remember, the activity with the confederate was a simulation: real hallucinations are not under our control. But the philosophical problem remains: what is the nature of experience and how do we know the world?"

  Final note: The debrief should leave them clear that the argument from hallucination is the key one and that disjunctivism is a response that comes with costs. They should leave dissatisfied but with a clearer view of the dialectic.
answer: |-
  ### Session Design: "The Indistinguishability Experiment"

  #### **Overview**
  This 90-minute session uses experiential activities to lead participants from the "common kind" inference (indistinguishability implies same fundamental mental state, with differences only in external causes) to confronting the disjunctivist challenge. The debrief maps the activities to the philosophical arguments, separating illusion (misrepresentation) from hallucination (no object) and distinguishing metaphysical (nature of experience) from epistemological (justification) issues.

  ---

  ### **Materials List** (Budget: ≤€50 + Lab Discards)
  | **Item** | **Purpose** | **Cost/Fallback** |
  |----------|-------------|-------------------|
  | 6 blindfolds | Activity 2 (hallucination simulation) | €5 (cheap fabric) / **Fallback:** Scarves or lab coats |
  | 1 small potted plant (real or realistic fake) | Activity 2 (object for "seeing") | €10 / **Fallback:** Picture of a plant |
  | 1 empty watering can | Activity 2 (action prop) | €0 (lab discard) / **Fallback:** Cup |
  | 12 response cards (red/blue) | Voting in Activities 1 & 3 | €5 (cardstock) / **Fallback:** Torn paper |
  | 12 pens & clipboards | Written commitments | €5 / **Fallback:** Reused paper |
  | 1 buzzer or bell | Voting deadline signal | €5 / **Fallback:** Phone timer sound |
  | 1 laser pointer | Highlighting whiteboard notes | €10 / **Fallback:** Pen |
  | Blackout curtains | Control lighting for immersion | €0 (lab discard/seminar room) / **Fallback:** Turn off lights |
  | Whiteboard markers | Recording votes/arguments | €0 (assumed available) |  
  | **Lab Discards Salvage:** Prism (for visual distortion), rubber hand (for illusion backup) | Backup for failed illusions | €0 |

  **Total Cost:** €40 (€10 buffer for contingencies).

  ---

  ### **Roles**
  - **Instructor (You):** Facilitate activities, enforce timing, record votes on whiteboard. Remain neutral; use "we" language ("What did we just observe?").
  - **Confederate (1 Philosophy Student):** Briefed before the session. Role: In Activity 2, they *always* report seeing a plant, whether blindfolded (hallucination simulation) or not (genuine perception). **Briefing Script:**  
    *"In both rounds, you’ll say, 'I see a plant.' Do not smile, hesitate, or hint at deception. If asked, insist you’re reporting truthfully. We’re testing how others respond to identical reports."*  
  - **Participants (12–14 Students):** Half philosophy, half cognitive science. Mixed seating to encourage cross-discipline pairs.

  ---

  ### **Session Sequence (90 Min Total)**
  **Goal:** Trap the "common kind" inference early, then destabilize it with disjunctivist challenges.

  #### **Phase 1: Trap the Inference (40 Min)**
  *Objective: Commit participants to "indistinguishability → same kind of mental state."*

  1. **Introduction (5 Min)**  
     - Chairs in circle. Lights on.  
     - *Your Script:* "We’ll explore perception through hands-on puzzles. I need your first-person reports and written decisions. No theory yet—just observe and act. Rules: Commit honestly. Silence devices. Use response cards for votes."  

  2. **Activity 1: Crossed Fingers Illusion (15 Min)**  
     - *Why:* Forces first-person indistinguishability.  
     - *Steps:*  
       - **Demo (2 min):** "Cross your index and middle fingers. Touch your nose tip. What do you feel?" (Most feel two noses).  
       - **Contrast (2 min):** "Uncross fingers. Touch two actual objects (e.g., pens). Feel two objects? Now touch one object. Do the two-object and one-object feels differ *in kind*?"  
       - **Commitment (5 min):** Distribute response cards. *Prompt:* "When feeling two noses (illusion), is this fundamentally the same *kind* of experience as feeling two actual objects? Blue = Yes (same kind, cause differs). Red = No."  
       - **Vote & Record (6 min):** Buzz after 30s. Tally blues/reds on whiteboard. >80% will vote blue.  
     - *Fallback:* If illusion fails for 2–3 people, use a prism (lab discard) to distort a pen’s position. Ask if the "bent pen" experience is the same kind as seeing a truly bent pen.

  3. **Activity 2: Act on Indistinguishable Reports (20 Min)**  
     - *Why:* Forces action despite uncertainty about perception/hallucination.  
     - *Setup:* Confederate sits at table with plant. Group stands facing them.  
     - *Steps:*  
       - **Round 1: Genuine Perception (5 min):** Lights on. Plant visible. Confederate: "I see a plant." Group votes: "Water it?" (Yes/No via cards). Designated "waterer" pantomimes watering.  
       - **Round 2: Hallucination Simulation (10 min):** Lights off briefly (blackout). Remove plant; blindfold confederate. Lights on. Confederate: "I see a plant." Group votes again. *Most will vote "water" (same report → same trust).*  
       - **Written Commitment (5 min):** *Prompt:* "The confederate’s reports in Rounds 1 and 2 felt like the same kind of mental state to you. Agree? Write ‘Yes’ or ‘No’ and sign." Collect slips.  
     - *Fallback:* If blackout fails, use a screen to hide plant removal.

  ---

  #### **Phase 2: Undermine the Commitment (35 Min)**  
  *Objective: Expose costs of disjunctivism (brute difference, threatened justification).*

  4. **Activity 3: Abnormal Cause, Correct Report (15 Min)**  
     - *Why:* Challenges "causal pedigree" as definitive.  
     - *Steps:*  
       - **Scenario (5 min):** "A patient has a chip implanted in their visual cortex. Today, it fires randomly, creating a red flash. At that *exact* moment, a nurse holds up a red card. The patient reports ‘red card’—correctly! Did they *see* it?"  
       - **Discussion (10 min):** Pairs debate: "Same mental state as normal seeing?" Vote via cards. *Expected split: 60% No (abnormal cause ≠ seeing), 40% Yes (outcome matters).*  
     - *Pressure Point:* "If the cause is abnormal, how can it be the same kind of state? But if it’s not, what makes perception ‘genuine’?"

  5. **Activity 4: The Disjunctivist Challenge (20 Min)**  
     - *Why:* Generates the two worries (bruteness, justification).  
     - *Steps:*  
       - **Prompt (5 min):** "Suppose the hallucinator in Activity 2 isn’t in a state the perceiver also has. They only *seem* identical. The difference is brute—no deeper explanation."  
       - **Group Work (10 min):** Groups of 3 list worries on whiteboard sections. *Nudge:* "What’s unsettling about this? Consider knowledge or explanatory gaps."  
       - **Share Out (5 min):** Groups read worries. *You record two clusters:*  
         - Cluster 1: "Brute difference → inexplicable" (e.g., "Why can’t we tell them apart?").  
         - Cluster 2: "Threatens justification" (e.g., "If indistinguishable, how am *I* justified?").  
     - **Division Point:** Here. Philosophy students lean into Cluster 2; cognitive science into Cluster 1.

  ---

  #### **Debrief (15 Min)**  
  *Objective: Map activities to arguments, separate illusion/hallucination, metaphysics/epistemology.*

  1. **Reveal the Inferential Step (5 Min):**  
     - "Early on, you inferred: ‘If two episodes are indistinguishable from the inside, they must share a core mental state, differing only externally.’ You voted, wrote, and acted on this."  
     - Show initial vote tallies/written commitments.  
     - "This is the ‘common kind’ view. But in the second half, we challenged it with disjunctivism: Perception and hallucination are *different kinds* of states—they only *seem* alike."

  2. **Map the Challenges (7 Min):**  
     - **Illusion vs. Hallucination:**  
       - *Crossed fingers (illusion):* How something *is* vs. how it *appears*.  
       - *Confederate report (hallucination):* No object at all. The "heavy lifting" argument.  
     - **Three Pressures:**  
       - *Abnormal cause:* Correct report despite freak cause → sameness isn’t about causes.  
       - *Disjunctivism:* Hallucination isn’t a "deficient version" of perception—it’s a different state.  
       - *Two Worries:*  
         - Brute difference (Cluster 1) → "Inexplicable!"  
         - Justification threat (Cluster 2) → "If hallucinators are equally ‘seem-right,’ how am *I* justified?"  

  3. **Clarify the Disagreements (3 Min):**  
     - *Metaphysical:* What *is* experience? (Common kind: shared state. Disjunctivist: perception is relational, hallucination isn’t.)  
     - *Epistemological:* What *justifies* belief? (Common kind: seemings justify. Disjunctivist: only perception provides justification.)  
     - *Cost of Disjunctivism:* "It avoids postulating ‘deceptive’ mental states but makes the perception/hallucination gap brute and risks skepticism."

  ---

  ### **Predictable Problems & Solutions**
  1. **Illusion Fails for Some:**  
     - *Problem:* 2–3 people don’t feel two noses.  
     - *Solution:* Use prism backup. Normalize: "This varies! If it failed, imagine it worked—how *would* you infer?"  

  2. **"This Isn’t Philosophy!":**  
     - *Problem:* Cognitive science student calls it "just misfiring neurons."  
     - *Solution:* "Great—let’s test that. Does neuroscience *resolve* the indistinguishability problem? Vote: Can neurons explain why two states *feel* identical?" Steer toward justification worry.  

  3. **Refusal to Commit:**  
     - *Problem:* Philosopher suspects steering and withholds judgment.  
     - *Solution:* "Write why you’re hesitant. We’ll use it later." In debrief: "Some resisted. That’s the disjunctivist impulse—denying the inference!"  

  4. **Hallucination Too Artificial:**  
     - *Problem:* "A blindfolded confederate isn’t hallucinating!"  
     - *Solution:* Debrief: "We simulated indistinguishability. Real hallucinations aren’t controlled—but the *inferential step* is the same."  

  ---

  ### **What the Activity Cannot Do**
  1. **Staged ≠ Hallucination:**  
     - The confederate’s report simulates indistinguishability but doesn’t replicate hallucination’s phenomenology. Participants must *accept* that hallucination is subjectively identical to perception—**flag this at the close:** "We took indistinguishability as given. But is it true? That’s empirical. Our focus was the *inference* it triggers."  

  2. **Sameness/Difference of Kind:**  
     - Activities show indistinguishability and its consequences but cannot *prove* metaphysical sameness/difference. **Flag:** "We felt the cost of disjunctivism, but we didn’t settle what experience *is*. That’s the unresolved core."  

  3. **Cost Without Closure:**  
     - The session won’t resolve the dispute. **Close explicitly:** "Today wasn’t about answers. You felt the inferential step and its discontents. Disjunctivism avoids ‘deceptive’ mental states but costs explanatory simplicity and risks skepticism. Which price would *you* pay? Sit with that tension."  

  ---

  ### **Final Script Snippet**
  **At Close:** "You leave dissatisfied—good! Clarity here means seeing the trap: indistinguishability pulls us to common kinds, but denying that leaves brute gaps. Philosophy often starts where experiments end. Your homework: Tonight, if you ‘see’ your keys, ask: Could this be a hallucination? And if not—*why not*?"  

  This design ensures the inferential step is felt, committed to, and challenged, with disjunctivism’s costs highlighted through experience. Run it cold—the tensions will emerge organically.
