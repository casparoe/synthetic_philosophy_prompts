  I'm in the middle of an argument with my flatmate, who's doing an MA in philosophy, and because I'm the one who took the logic course I've been drafted into writing it up (loser buys dinner at the place with the terrible pasta). He hit me with the knowability paradox — Fitch's paradox, I think it's named after him, probally badly — and I haven't been able to stop chewing on it. Here's the setup as he gave it to me, and I want you to check that I've reproduced it correctly before you do anything else with it. The anti-realist about truth holds something like: every truth is knowable, that is, for any proposition p, if p is true then it is possible for someone to know p. Now take a true proposition that in fact nobody knows; that's supposed to be an unremarkable thing to exist. By the knowability principle it's possible for someone to know the conjunction: p, and nobody knows p. But knowledge is factive — if you know something then it's true — and if you know a conjunction you know each conjunct. So the knower in that possible situation knows p, and also knows that nobody knows p, which by factivity means nobody knows p. So they know p and they don't know p. Contradiction; hence no truth is unknown; hence every truth is known, which is absurd. The premise that there exists an unknown truth is obviously fine, so the knowability principle looks like the thing to give up. I know the usual escape routes — restrict the principle to some special class of propositions, refuse classical logic, deny that knowledge distributes over conjunction — and I find all of them a bit of a fudge. So what I actually want is an essay on whether the anti-realist can be saved, and in particular on a fix that I've been defending and that my flatmate says is dead on arrival: don't say every truth is knowable now, say that no truth is forever unknown, i.e. every truth is knowable eventually, because inquiry carried on long enough ends up knowing it. That seems to me like the honest version of the anti-realist thought anyway — the real claim is about the convergence of inquiry, not about what you or I could know this afternoon — and the temporal slack looks like it should be enough to block the derivation. Work it through for me properly: does the Fitch-style argument go through against the eventual version, or does the looseness of eventually let the anti-realist out?

  Approach this as a professional philosopher of logic would, and treat my fix seperately from the textbook repairs rather than lumping it in with them. Start with a short brainstorm in which you lay out the premises each step of the derivation leans on — factivity, distribution of knowledge over conjunction, the idealisation of the knower, the possibility of knowing a conjunction at all, classical versus intuitionistic logic — because I want to see exactly which premise each proposed repair has to attack. Then write the essay proper, maybe 1500 words, in prose rather than bullet points. Weigh the standard repairs honestly, give the eventual-knowability version a serious run including the strongest version of my flatmate's objection, and then reach a verdict: either the fix works and the anti-realist survives, in which case tell me precisely which step it blocks and why that step is illegitimate, or it fails, in which case tell me whether it fails in the same way the original does, what the anti-realist should do instead, and whether that alternative is principled or is just the paradox being quarantined by hand. If your verdict is that no version of the knowability principle survives, say so plainly and tell me what that does to the motivations for anti-realism more generally — does the paradox kill only the slogan, or the whole position? Don't give me citations or a reading list, I can't look anything up, and don't hedge at the end; I'd rather have a wrong verdict that's argued for than a survey that refuses to land.
