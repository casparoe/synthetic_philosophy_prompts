  We are designing a decision procedure to handle claims that a puzzle is unsolvable. The procedure must be systematic and as automated as possible, but it will also involve editorial judgment at certain points.

  The procedure will be broken down into steps. The goal is to either:
  - Prove that the puzzle is solvable (by providing a solution or by a non-constructive argument that one must exist) OR
  - Prove that the puzzle is unsolvable (by showing that the target state is not reachable according to the rules) OR
  - Conclude that the puzzle's solvability is undecided by the procedure, requiring human judgment.

  We note that the puzzles are string rewriting systems with a given start string, a set of moves (rewrite rules), and a target string.

  We will use the following methods:
  1. **Invariants**: Properties that are preserved by all moves. If the start string has an invariant and the target does not (or vice versa), then the target is unreachable.
  2. **Reachability by backward moves**: Sometimes it is easier to work backward from the target and see if we can reach the start. This is especially useful if the moves are reversible or if we can define a set of backward moves.
  3. **State space analysis**: If the state space is small enough, we can enumerate all reachable states. We are constrained by computational resources (overnight on a laptop).
  4. **Rule analysis**: We can look for rules that only increase or decrease the string in some way (e.g., length, counts of certain letters) and see if we can bound the state space.

  The procedure:

  **Step 1: Check for obvious mismatches.**
     - Compare the start and target strings for trivial properties (e.g., if the target contains a character not in the start and the rules cannot introduce new characters, then it's unsolvable). Similarly, if the start and target are identical, then it's solvable.
     - Check that all characters in the target are in the alphabet of the start and the rules. If not, then unsolvable.

     *If step 1 fails (i.e., there is a mismatch), then the puzzle is unsolvable. If the start and target are the same, then it is solvable (by zero moves).*

  **Step 2: Check for invariants.**
     - We look for a property (a function from strings to some set) that is preserved by every move. Examples include:
          - The length modulo some number.
          - The count of a particular letter modulo some number.
          - The parity of the string (e.g., the number of A's mod 2).
     - We compute the invariant for the start and the target. If they differ, then the target is unreachable.

     *How to find invariants?*
          - We can look at the effect of each rule on a candidate invariant. We try simple ones first: linear functions (e.g., total value of letters mod m) or simple properties (e.g., the presence of a certain substring).

     *If we find an invariant that distinguishes the start and target, then the puzzle is unsolvable.*

  **Step 3: Check for reversibility of rules.**
     - If the rules are reversible (i.e., for every forward move there is a backward move and vice versa), then we can try to work backward from the target and see if we can reach the start. We can also try to compute the entire state space from the target backward.

     *If we can compute the entire state space (within computational limits) and the start is not in it, then the puzzle is unsolvable. If we find a path from the target backward to the start, then the puzzle is solvable (and we have a solution).*

  **Step 4: Brute-force search (forward and backward).**
     - We perform a breadth-first search (BFS) starting from the start string, applying moves until we either find the target or run out of states (within computational limits). We must avoid repeated states (by keeping a set of visited states).
     - Similarly, we can do a BFS from the target backward (if we can define backward moves that are inverses of the forward moves, or by inverting the rules appropriately).

     *If we find the target during forward search, then the puzzle is solvable and we have a solution. If we run out of states without finding the target, then we have a candidate for unsolvable, but note: we might not have explored the entire state space because it could be infinite or too large. We must be cautious.*

     *If the state space is finite and we can enumerate all reachable states without hitting the target, then we can conclude unsolvable. Otherwise, we cannot be sure.*

  **Step 5: Check for termination and normal forms.**
     - We can try to see if the system is terminating (i.e., every sequence of moves eventually stops). If so, then we can compute the set of normal forms (states that cannot be rewritten) and see if the target is among them. We can then check if the start can lead to the target normal form.

     *This step is more advanced and may require some human insight or known techniques (e.g., Knuth-Bendix completion). It might be skipped if not feasible.*

  **Step 6: Human judgment and publication.**
     - If the procedure has not yielded a definitive answer by Step 5, then we must rely on human judgment. We can also consider publishing the puzzle with a note about the unresolved claim, or retracting it if we believe the argument is strong.

