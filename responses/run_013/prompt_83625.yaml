          - If we exhaust all states within the bound and the target is not found: then we cannot conclude. We note that the state space might be larger than our bound. We then go to step 5.

     5. **Advanced analysis**:
          - Try to determine if the system is terminating (using simplification orders, etc.). If terminating, then we can compute the normal forms and see if the target is a normal form. Then we can check if the start can be rewritten to the target. This step may require expert knowledge and is optional.

     6. **Human judgment**:
          - If we have a strong argument from solvers and we can verify it, then we accept their verdict.
          - Otherwise, we may need to publish a note that the puzzle's solvability is unresolved and retract it.

     **When a step cannot be completed** (e.g., we cannot find an invariant, or the brute-force search hits the limit without finding the target and without exhausting the state space), then we move to the next step. If all steps are exhausted without a decision, then we declare it undecided by the procedure.

     **Note on Case 3**: Without the specific puzzle, we cannot run the procedure. We rely on the team's argument and our ability to verify it. If we can verify it (by checking their invariant, for example), then we return "unsolvable" for the printed puzzle.

     **Final note**: The procedure is not guaranteed to halt for all puzzles (due to the undecidability of the word problem for semi-Thue systems). But for many puzzles with small state spaces or simple invariants, it will work.

     We hope this procedure helps.
answer: |-
  ### Decision Procedure for Verifying Unsolvability Claims

  This procedure checks claims that a puzzle is unsolvable. It combines automated checks (invariants, brute-force search) and editorial judgment. Steps must be followed in order. If a step yields a definitive answer, stop and return the verdict. If a step cannot be completed, proceed to the next. Computational limits: brute-force searches are capped at 1 million states or 12 hours on a laptop.

  ---

  **Step 1: Validate the claim syntax**  
    • *Action:* Ensure the claim specifies the start string, target string, rules, and a clear argument for unsolvability.  
    • *Insufficient claim:* If the argument is vague (e.g., "I tried and failed"), return *"Claim rejected; provide a mathematical argument"* to the solver.  
    • *Proceed:* If the claim is well-formed, go to Step 2.

  **Step 2: Check for trivial mismatches**  
    • *Action:* Verify that the target’s alphabet is reachable from the start.  
    • *Unsolvable if:* The target contains a character absent in the start *and* no rule introduces new characters.  
    • *Solvable if:* Start and target are identical (0 moves).  
    • *Inconclusive:* Proceed to Step 3.

  **Step 3: Seek an invariant**  
    • *Action:* Look for a preserved property (e.g., string length mod *m*, character counts mod *k*, parity) that differs between start and target.  
    • *How:*  
      - Compute the property for the start and target.  
      - Test if every rule leaves the property unchanged.  
    • *Unsolvable if:* Found (publish the invariant in the note).  
    • *Failure:* If no invariant is found after checking common candidates (mod 2, 3, 4; linear combinations), proceed to Step 4.  
    • *Judgment call:* Choosing which invariants to test is editorial; prioritize simplicity.

  **Step 4: Brute-force forward search**  
    • *Action:* Run BFS from the start, recording all reachable states (with string length capped to avoid explosions).  
    • *Solvable if:* Target is found (publish the path as proof).  
    • *Unsolvable if:* The entire finite state space is exhausted and target is absent.  
    • *Inconclusive if:* Search hits computational limits → Proceed to Step 5.  
    • *Limitation:* A failed search only proves unsolvability if the state space is finite and fully explored. Otherwise, it suggests nothing.

  **Step 5: Brute-force backward search**  
    • *Action:* Run BFS from the target using *reverse rules* (if well-defined inverses exist).  
    • *Unsolvable if:* Start is not in the backward-reachable set and the state space is finite/exhausted.  
    • *Solvable if:* Start is found (publish reverse path).  
    • *Failure:* If reverse rules are ambiguous or computationally infeasible → Proceed to Step 6.

  **Step 6: Evaluate solver’s argument**  
    • *Action:* Rigorously verify the solver’s unsolvability proof.  
    • *Accept if:* The argument is a valid invariant (Step 3) or exhaustive search (Step 4/5).  
    • *Reject if:* The proof has logical errors or unverified assumptions.  
    • *Inconclusive:* If the argument is novel but unautomated (e.g., a complex induction), make an editorial judgment → Proceed to Step 7.

  **Step 7: Editorial verdict**  
    • *Action:* Weigh evidence: invariants (Step 3), search results (Steps 4–5), solver arguments (Step 6), and puzzle intent.  
    • *Publish "unsolvable" if:*  
      - An invariant or exhaustive search confirms it.  
      - Multiple solvers provide congruent arguments.  
    • *Publish "solvable" if:* A solution is found during checks.  
    • *Retract or note uncertainty if:* Evidence is conflicting or inconclusive.  
    • *Judgment call:* Deciding "I don’t know" is acceptable; publish an apology if the puzzle is flawed.

  ---

  ### Case Applications

  **Case 1: MI → MU (Calibration)**  
  - *Procedure:*  
    1. **Step 1:** Claim is well-formed.  
    2. **Step 2:** No trivial mismatch (alphabet matches).  
    3. **Step 3:** Invariant found: number of `I` modulo 3.  
      - Start `MI`: 1 `I` → 1 mod 3.  
      - Target `MU`: 0 `I` → 0 mod 3.  
      - Rules preserve `#I mod 3`:  
        - Rule 1: Adds `U` → no change.  
        - Rule 2: Duplicates `x` → `#I` becomes `2k`; `2k ≡ 2 × k mod 3` (not identical, but note: from `k ≡ 1`, possible values are `2 × 1 ≡ 2 mod 3` or `2 × 2 ≡ 1 mod 3`; never `0`).  
        - Rules 3 and 4: No change to `#I mod 3`.  
      - ∴ Unsolvable.  
  - *Publishable argument:*  
    > "The number of `I` is always 1 or 2 modulo 3. Start `MI` has 1 `I` (1 mod 3). Target `MU` has 0 `I` (0 mod 3). All rules preserve this invariant. Thus, `MU` is unreachable."

  **Case 2: AAB → B (Current Puzzle)**  
  - *Procedure:*  
    1. **Step 1:** Claim assumed well-formed.  
    2. **Step 2:** No trivial mismatch.  
    3. **Step 3:** Invariant found: `(#A - #B) mod 3`.  
      - Start `AAB`: 2 `A`, 1 `B` → `2 - 1 = 1 ≡ 1 mod 3`.  
      - Target `B`: 0 `A`, 1 `B` → `0 - 1 = -1 ≡ 2 mod 3`.  
      - Rules preserve `(A - B) mod 3`:  
        - Rule 1 (`AA→B`): Lose 2`A`, gain 1`B` → `Δ = -2 - (+1) = -3 ≡ 0 mod 3`.  
        - Rule 2 (`BB→A`): Lose 2`B`, gain 1`A` → `Δ = +1 - (-2) = +3 ≡ 0 mod 3`.  
        - Rules 3 (`A→BB`), 4 (`B→AA`), 5 (`AAA→ε`): Similar; all changes are multiples of 3.  
      - ∴ Unsolvable.  
  - *Verdict:* You are right; `B` is unreachable. Submissions editor’s derivation to `A` is valid (e.g., `AAB → BB → A`), but `A → B` is impossible.  
  - *Publish without spoilers:*  
    > "The puzzle is unsolvable: an invariant property of the start does not match the target. Solvers may discover this by tracking character counts modulo 3. Full explanation next month."

  **Case 3: March Puzzle (Discrepancy)**  
  - *Scenario:*  
    - Solvers claim unsolvable under printed rules.  
    - Answer key used a modified rule.  
  - *Procedure:*  
    1. **Steps 1–6:** Run on the *printed rules*.  
      - If invariant or search confirms unsolvable → Publish "unsolvable" with apology.  
      - If solvable under printed rules → Correct answer key and publish solution.  
    2. *What you can publish:*  
      > "Investigation confirms the puzzle as printed is unsolvable due to [invariant/search]. We apologize; our answer key used a modified rule. Credit to [solver team]."  
    3. *Key difference:*  
      - Verdict about *printed rules*: Determines what solvers faced. Use Steps 1–7.  
      - Verdict about *generated rules*: Irrelevant to solvers; do not publish.  
    4. *What you cannot settle:*  
      - If the printed puzzle’s state space is infinite and no invariant is found, brute-force searches are inconclusive, and solvers’ arguments are unverifiable → Editorial judgment required (Step 7). Publish:  
      > "The puzzle is retracted; we cannot confirm solvability due to unresolved claims and a rule discrepancy."

  ---

  ### Procedure Limitations and Judgment Calls
  - **Invariant search (Step 3):**  
    - *Misfire:* May miss complex invariants (e.g., nonlinear, contextual). A "confident" solver argument might be an unverified guess.  
    - *Judgment:* Prioritize mod counts and linear invariants; if unsolved, declare inconclusive.
  - **Brute-force (Steps 4–5):**  
    - *Misfire:* Fails for large/infinite state spaces. A negative search only proves unsolvability if the space is finite and fully explored.  
    - *Judgment:* Set conservative bounds; a timeout implies uncertainty.
  - **Solver arguments (Step 6):**  
    - *Misfire:* A "serious" argument may contain subtle errors. Treat non-constructive proofs (e.g., "no path exists") as guesses until verified.  
    - *Judgment:* Accept only proofs replicable via Steps 1–5.
  - **Editorial step (Step 7):**  
    - *Misfire:* Overreliance on solver consensus might overlook mistakes.  
    - *Judgment:* When uncertain, retract the puzzle.

  ### When You Don’t Know
  Publish:  
  > "We lack conclusive proof for this claim. While our searches found no solution, we cannot confirm unsolvability. Share further insights via [contact]."

  ---

  This procedure balances automation and transparency, providing defensible verdicts while flagging uncertainty. Use invariants as primary tools; they yield concise, publishable proofs when brute-force fails.
