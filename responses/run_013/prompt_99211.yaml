  In the original Prisoner's Dilemma, players choose actions directly, without any precommitment or program submission. In program equilibrium, they commit to a strategy via a program. So, it's a different game.

  Anna might be missing that the program equilibrium introduces a new element: the ability to commit to a strategy conditional on the opponent's strategy, which wasn't present before. So, while it's a Nash equilibrium in the program game, it doesn't directly apply to the one-shot simultaneous-move game.

  But Anna says it's a solution for the one-shot game via this meta-game. I think it's partly sound because it does provide a way to achieve cooperation, but it relies on additional assumptions.

  Ben's point: "the result only relocates the difficulty." He says the conditional program is reliable because programs can't deviate, and precommitment wasn't the issue; the dilemma was about rational choice without commitment.

  In the standard Prisoner's Dilemma, without commitment, defection dominates. Here, with programs, you can commit to cooperate if the other does, which makes cooperation rational. But Ben says credible precommitment was never the problem; the problem is that without such mechanisms, cooperation isn't rational.

  He also points out that transparency and mutual simulability are unrealistic.

  Ben is correct that program equilibrium requires players to be able to inspect each other's programs and simulate them, which might not be practical. But in theory, it's a valid model.

