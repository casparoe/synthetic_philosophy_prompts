  What is missing? Both might be missing that in the program equilibrium, there could be other strategies, like ones that punish defection, but in one-shot, it's tricky. Also, the selection of equilibrium might require additional refinement.

  Overall, both have valid points, but they might be talking past each other about what the "problem" is. For Anna, the problem might be finding a way to cooperate rationally in a dilemma-like situation, and program equilibrium provides that. For Ben, the problem is the essence of the dilemma without external mechanisms.

  Also, in terms of what both are missing: They might not discuss that program equilibrium can be seen as a way to implement correlated equilibria or something, but in this case, it's direct.

