  Anna's counter: The choice of program is a rational choice before play, and no program can do better against the other. Transparency is just a modeling idealization, like assuming known strategies.

  Ben's final point: Defecting programs are also fixed points; for example, a program that always defects is also a best response to itself. So, it shows multiplicity, not that cooperation is available.

  I need to adjudicate each of these four moves: sound, partly sound, or mistaken, and say what both might be missing.

  Let me start with Anna's first point: "it shows that rational cooperation in a one-shot prisoner's dilemma is attainable..."

