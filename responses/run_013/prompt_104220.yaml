answer: |-
  Here is the specification of desiderata for an adequate theory of conversational implicature and speaker meaning, tailored to your purpose of adjudicating disputes about what is said vs. implicated and embedded implicature behavior. Requirements are classified as **Non-negotiable** (essential for the court-of-appeal role) or **Negotiable** (camp-specific preferences).

  ---

  ### **1. Phenomena the Theory Must Explain**  
  **Requirement**: Explain the full range of observed implicatures (particularized, generalized, scalar, relevance-driven, irony, figurative speech, indirect requests) **and** demarcate implicature from:  
  - **Entailment** (non-cancellable, truth-conditional)  
  - **Presupposition** (projection behavior, non-at-issue content)  
  - **Hinting** (non-intentional causal effects).  
  **Motivation**: Without this coverage, the theory cannot arbitrate boundary disputes (e.g., "only" as presupposition vs. implicature).  
  **Verdict**: **Non-negotiable** for scope; demarcation criteria may be theory-dependent (e.g., projection tests vs. cancellability).  
  **Confidence**: High (empirically grounded; excludes underspecified theories).  

  ---

  ### **2. Mechanism Constraints**  
  **Requirement**: Specify how implicatures are generated and constrained by:  
  - **Recoverability**: Must be derivable from what is said + context + cooperative principle (or equivalent).  
  - **Defeasibility**: Must be cancellable without contradiction (e.g., "Some died; in fact, all").  
  - **Detachability**: Not tied to specific lexical form (e.g., "but" vs. "and" cancels contrast implicature).  
  **Motivation**: Tests like defeasibility are central to distinguishing implicature from entailment/presupposition.  
  **Verdict**:  
  - Recoverability & defeasibility: **Non-negotiable** (define implicature as inferential).  
  - Detachability: **Negotiable** (scalar implicatures may be lexicalized; irony/figure resist detachment).  
  **Confidence**: High for recoverability/defeasibility; detachability is less universal.  

  ---

  ### **3. Distinctions the Theory Must Not Collapse**  
  **Requirement**: Preserve:  
  - **Speaker meaning vs. sentence meaning** (implicature belongs to speaker; conventional content to sentence).  
  - **Meaning vs. causing belief** (intentional communication vs. accidental effects).  
  - **Intended vs. recovered implicature** (speaker’s intention vs. hearer’s inference).  
  **Motivation**: Prevents conflation in disputes (e.g., "What the speaker meant" vs. "What the sentence implies").  
  **Verdict**: **Non-negotiable** (core to defining "speaker meaning").  
  **Confidence**: Very high (foundational to pragmatics).  

  ---

  ### **4. Accounts of Speaker Meaning**  
  **Requirement**: Must align with intention-based analyses (e.g., Grice: speaker intends hearer to recognize intention via utterance). Must handle **non-propositional cases** (e.g., silence, gestures).  
  **Motivation**: Ensures coherence with broader communication theory; needed for cases like ironic tone or omitted answers.  
  **Verdict**: **Non-negotiable** for intention-based core; mechanism for non-propositional cases may vary.  
  **Confidence**: High (widely accepted baseline); lower for how to handle edge cases.  

  ---

  ### **What the Theory Owes the Five Cases**  
  1. **Quoted Speech (statute/weather bulletin)**:  
     - Must locate implicature in the **act of quoting** (e.g., "By quoting this now, I imply X").  
     - Machinery must apply to **third-party maxims** (e.g., flouting relevance on the quoted author’s behalf).  
     - *Adequacy test*: Can the theory derive implicature without attributing cooperation to the quoted source?  

  2. **Asserting Known Information**:  
     - Must recognize **non-world-oriented implicatures** (e.g., "I am reminding you" or "I doubt your attention").  
     - **Not detachable**: Paraphrase loses effect (e.g., "As you know..." vs. "The sun rises").  
     - *Adequacy test*: Theory must accommodate implicatures targeting **meta-communicative stances**, not just truth-conditions.  

  3. **Divergent Hearers**:  
     - Must allow implicature to be **hearer-relative within bounds** (e.g., politeness inferences may vary).  
     - **Not fully determinate**, but constrained by speaker intention and context.  
     - *Adequacy test*: Preserving the speaker-meaning/hearer-inference distinction does *least damage*; denying hearer-relativity risks over-intellectualizing.  

  4. **Embedded Implicature (under negation/conditional/question)**:  
     - Must explain **apparent survival** (e.g., "If some died, I’m sad" still implies not all).  
     - **Defeasibility must be retained** (e.g., "If some or all died...").  
     - *Adequacy test*: Handle via **local pragmatic enrichment** (e.g., implicature computed in embedded clause) or **semantic conventionalization**—but without abandoning defeasibility.  

  5. **Implicature by Silence/Omission**:  
     - Intention-based accounts **must apply** (e.g., speaker intends recognition of omission as meaningful).  
     - **No expressed proposition**: Meaning arises from **salient alternatives** (e.g., unanswered question → refusal).  
     - *Adequacy test*: Speaker meaning can be constituted by **ostensive-inferential acts beyond words**.  

  ---

  ### **Conflicts and Exclusionary Power**  
  - **Key Conflict**: Recoverability (2) vs. Hearer-Relativity (3). If implicature is fully determined by speaker intention + context, divergent but competent hearers shouldn’t occur.  
  - **Most Exclusionary Requirement**: **Recoverability** eliminates theories where implicature is purely conventional (e.g., Bach’s "impliciture") or non-inferential.  

  ---

  ### **Brief Pass Over Major Theories**  
  - **Gricean (maxim-based)**:  
    - ✔️ Strong on recoverability, defeasibility, distinctions.  
    - ✖️ Struggles with embedded cases, non-propositional acts, and over-determines speaker intention.  
  - **Relevance Theory**:  
    - ✔️ Excels at embedded cases, non-propositional meaning, and hearer-relativity.  
    - ✖️ Weak on determinacy (collapses intended/recovered); "relevance" may be too flexible.  
  - **Truth-Conditional Minimalism**:  
    - ✔️ Clear said/implicated divide.  
    - ✖️ Fails phenomena coverage (e.g., misses irony), ignores intention, cannot handle silence.  

  ---

  ### **Weakest Requirement**  
  **Least Confident Desideratum**: **Detachability** (2). While useful for lexical pragmatics, it is irrelevant to many implicatures (e.g., irony, relevance-driven inferences) and may reflect a lexicalist bias.  

  This specification prioritizes adjudicatory utility: it enforces mechanisms for boundary-setting (1–2), preserves distinctions vital to disputes (3), and ensures applicability to hard cases (4 + test cases). The goal is to equip your seminar with a rigorous, dispute-resolution-focused toolkit.
