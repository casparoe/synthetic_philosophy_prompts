prompt: |-
  I am a philosophy of biology PhD student leading a 75-minute discussion section (roughly eighteen second-year students, most of them biologists with two years of genetics and no philosophy) attached to a concepts-in-biology module. The topic is the species problem, and I want a plan for how to teach it, not an explanation of it.

  The target I am teaching toward: by the end the students should see that the disagreement among species concepts is not merely terminological — that the rival criteria are not just competing labels for one and the same underlying division — and they should feel the force of that claim rather than hear me assert it. Please give me the order in which the pieces must be introduced, with the dependency between them made explicit; what has to be in place before the question is even intelligible to them; the single carrying example to organize the section around; the misconceptions they will arrive with or generate, and the precise point in the sequence at which to head each one off; one closing question or brief exercise that would show me whether the point landed; and what I should openly refuse to resolve at this level, with a note on how to say so.

  For the carrying example I want to avoid the textbook cases they might answer from memory. Here is a case I have in mind, and I would like you to judge whether it can bear the whole section or needs a partner: a single lineage of small fish distributed along a chain of connected lakes; in the two end lakes the fish are sharply distinct in body form and feeding habit and, when brought together experimentally, interbreed only at low rates; through the middle lakes runs a fully fertile continuum of intermediate forms, and genetic data show low but non-zero gene flow from one end of the chain to the other; and one of the middle-lake populations has recently shifted to obligate self-fertilization, exchanging no genes at all while remaining morphologically continuous with its neighbors. Tell me where each of the main species criteria would draw the boundaries here, and how to keep the students from concluding too quickly that the criteria are simply answering different questions.
reasoning: |-
  Okay, the user is a Philosophy of Biology PhD student leading a discussion section for second-year biology students. They need a lesson plan on the species problem, specifically designed to show that the disagreement isn't just terminological. The key is to make students feel the force of this claim rather than just hearing it asserted.

  First, I need to understand the students' background. They've had two years of genetics but no philosophy. So, they likely think species concepts are just different labels for the same natural divisions. The challenge is to disrupt that assumption effectively.

  The user provided a ring species-like case with fish in connected lakes. It's a great example because it has multiple tension points: end populations with low interbreeding, intermediates, and a self-fertilizing population. This can illustrate conflicts between biological, morphological, and phylogenetic species concepts.

  I should structure the session to build understanding step by step. Start with what they know—species as real categories—then introduce criteria conflicts using the fish example. Preempt the "different questions" misconception by showing that all concepts aim to capture the same evolutionary reality but disagree due to conflicting evidence.

  Timing is crucial. The 75 minutes need to be broken down: intro (5 min), criteria intro (15 min), group work on fish case (25 min), discussion (25 min), and wrap-up (5 min). Group work is essential here to engage them actively.

  Possible misconceptions: thinking criteria are just different tools for different jobs, or that gene flow settles everything. Addressing these during the group report stage by highlighting conflicting boundaries and the self-fertilizing population's challenge to the biological concept.

  The closing exercise should ask where they'd draw the line and why, forcing them to commit to a criterion, revealing the underlying disagreement. End by emphasizing that the problem is unresolved, steering clear of complex solutions for now.

  The user's case is robust enough to carry the session. It incorporates isolation, morphology, gene flow, and a complicating factor (self-fertilization). No need for another example; diving deep here is better than spreading thin.

  Need to explicitly refuse resolving the species problem. Frame it as an ongoing debate, validating their confusion as a sign of understanding the complexity. This maintains focus on the lesson's goal without overcomplicating.
answer: |-
  Here’s a battle-tested lesson plan using your fish case to force confrontation with the species problem’s substantive (not terminological) core. The sequence builds cognitive tension deliberately.

  **Target Outcome:** Students viscerally grasp that competing species concepts carve nature at *objectively different joints* due to prioritizing conflicting biological processes (reproduction, lineage cohesion, adaptive form).

  **Carrying Example:** Your fish case is **perfect** — rich, non-textbook, and multilayered. No partner needed. It contains all necessary tensions.

  ---

  ### **Lesson Plan: 75 Minutes**

  #### **Phase 1: Foundational Setup (15 min)**
  *   **Goal:** Establish species as "real" categories & expose pre-theoretic intuitions.
  *   **Activity:** 
      *   (5 min) **Opening Question:** *"What makes two organisms the same species? Give a biological reason, not a definition."* (List answers: "can breed," "look similar," "evolved from same ancestor"). 
      *   (5 min) **Reframe:** Acknowledge these reflect real processes (gene flow, selection, descent). Emphasize: *"Biologists agree species are real evolutionary units, but disagree fiercely on HOW to define that unit."* 
      *   (5 min) **Introduce 3 Core Concepts SIMPLY:** 
          *   **Biological Species Concept (BSC):** Species = groups actually/potentially interbreeding & reproductively isolated *from others*. (Focus: Gene Flow Barrier).
          *   **Morphological Species Concept (MSC):** Species = groups consistently distinguishable by anatomical/structural features. (Focus: Adaptive Form/Gap).
          *   **Phylogenetic Species Concept (PSC):** Species = smallest monophyletic group of organisms sharing a unique common ancestor. (Focus: Lineage History/Divergence).
      *   **Crucial:** *"These aren't just words. They point to different *things* biologists think are most important in evolution."*

  #### **Phase 2: Applying Concepts to the Fish Case (Group Work - 25 min)**
  *   **Goal:** Generate conflicting answers *from the same data*.
  *   **Activity:** 
      *   (5 min) **Present Case Clearly:** Sketch lake chain diagram on board. Label Ends (A & Z), intermediates (B, C, D... Y), and Selfing Population (S, say in lake M). Summarize key facts: 
          *   A & Z distinct (form/feeding), low interbreeding.
          *   B-Y intermediates, fertile continuum, low gene flow A<->Z.
          *   S: Obligate selfing, morphologically continuous, no gene flow.
      *   (15 min) **Group Task (3 Groups):** *"Apply ONE concept (assign BSC, MSC, PSC) to draw species boundaries on the lake chain. Be ready to explain:* 
          1.  *How many species?*
          2.  *Where are the boundaries?*
          3.  *What specific evidence justifies YOUR boundaries over others?"*
      *   (5 min) **Prep Groups:** Circulate, ensure understanding of *their* concept. Key Qs: *"What's the *decisive factor* for your concept? Where does the case make that factor fuzzy?"*

  #### **Phase 3: Conflict Eruption & Guided Discussion (30 min)**
  *   **Goal:** Force confrontation of incompatible boundaries; preempt "different questions" dismissal.
  *   **Activity:** 
      *   (15 min) **Group Reports (Order: BSC -> MSC -> PSC):** 
          *   **BSC Group:** Likely 1 species OR 2 species + problem children. Boundaries fuzzy due to gene flow. **S is a HUGE problem:** No gene flow = distinct species? But morphologically identical? Contradicts continuity. **Conflict Point:** Gene flow exists A<->Z (low) but is it *enough*? S has *zero*.
          *   **MSC Group:** Likely 1 species OR 2 species + intermediates. Boundaries fuzzy due to gradual change. **S is easy:** Morph continuous = same species. **Conflict Point:** A & Z look/act different! Are intermediates "one species" despite variation?
          *   **PSC Group:** Likely MANY species (A, B, C?... S?... Z). **S is easy:** Unique lineage = distinct species. **Conflict Point:** Is there enough divergence? Monophyly test tricky with gene flow. Are A & Z distinct lineages?
      *   **(10 min) Facilitate Collision:** 
          *   Highlight *Specific Boundary Disagreements:* "Group BSC says S is probably Species 3, Group MSC says S is part of the main species, Group PSC says S is definitely its own species. *They have the exact same data about S!*"
          *   **Preempt Misconception 1 ("Just Different Questions"):** *"But wait, aren't they just asking different things? BSC about breeding, MSC about looks, PSC about ancestry? So couldn't they ALL be right?"* **NO. PUSH BACK:** *"If they were just different questions, we could assign different 'species labels' for different purposes without conflict. But look: Is S part of the main fish species *or not*? The concepts force different YES/NO answers on the SAME question about classification. They disagree on what *fundamentally constitutes* a species unit in nature."* Connect back to Phase 1: They all aim to capture "the real evolutionary unit."
          *   **Preempt Misconception 2 ("Gene Flow Wins"):** If students default to BSC as "most biological," ask: *"Why prioritize reproduction over shared descent (PSC) or adaptation (MSC)? Is the selfing fish (S) *less* a product of evolution than its neighbors? Does its lack of gene flow make its lineage unreal?"* Force value judgment.
          *   **Key Question:** *"What is the SINGLE biggest point of tension in this case that makes the concepts disagree?"* (Target Answer: **The conflicting signals from different biological processes - gene flow vs. morphological continuity vs. lineage divergence - aren't perfectly aligned in nature.**)
      *   **(5 min) Synthesize:** *"The disagreement isn't about words. It's about which evolutionary process (reproductive isolation, morphological adaptation, lineage splitting) is *definitive* for marking when one evolutionary unit splits into two. The fish show these processes don't always change in lockstep."*

  #### **Phase 4: Assessment & Wrap-up (5 min)**
  *   **Closing Question/Exercise (Diagnostic):** *"Take 1 minute: Write down ONE sentence. If you *had* to decide RIGHT NOW whether the selfing fish population (S) is a separate species, what would your MAIN biological reason be? (Not which concept, the *reason*)."*
      *   **Why it works:** Forces commitment to a *priority* (gene flow? lineage? form?). Reveals if they see the choice as substantive. Scan answers quickly for key words signaling underlying concept allegiance ("can't breed," "unique lineage," "looks same").
  *   **What to Refuse to Resolve (Crucial!):** 
      *   *"We WON'T solve the species problem today. There's no consensus answer, and philosophers & biologists still debate it. Sophisticated concepts (e.g., General Lineage Concept) try to handle this complexity, but tensions remain. The point today is to see *why* it's a hard problem – the biological world is messy, and our concepts highlight real, conflicting aspects of how evolution works."* 
      *   **How to Say It:** Be firm but validating. *"Your confusion/frustration is appropriate! It reflects the genuine complexity of evolution. If this felt messy, you understood it correctly. Our job today was to expose the depth of the problem, not to fix it."*

  ---

  **Why This Sequence Works:**

  1.  **Builds on Intuition:** Starts where students are (species are real, based on breeding/looks).
  2.  **Creates Cognitive Dissonance:** Their initial intuitions (from Phase 1) are challenged by the group work results.
  3.  **Conflict is Data-Driven:** Disagreement emerges *from their own analysis* of the same case, not lecturer dictation.
  4.  **Precision Targeting of Misconceptions:** Actively heads off "just labels" and "BSC is best" at the point they naturally arise (during report comparison).
  5.  **The Fish Case Carries the Load:** It provides:
      *   **BSC Conflict:** Gene flow (A<->Z low, intermediates fertile) vs. Isolation (A/Z low interbreed, S complete isolation). *Boundaries fuzzy/contradictory.*
      *   **MSC Conflict:** Clear endpoints (A/Z distinct) vs. Continuum (B-Y intermediates, S identical). *Where to draw the line?*
      *   **PSC Conflict:** Is the whole chain one lineage? Are A & Z distinct lineages? *Is S divergent enough?* Monophyly challenged by gene flow.
      *   **The Knife Edge:** S is the perfect fulcrum – it *forces* concepts apart (BSC: Isolated? -> Species. MSC: Identical? -> Not Species. PSC: Unique lineage? -> Species).
  6.  **Closure Validates Struggle:** Refusing to resolve it legitimizes their discomfort and underscores the philosophical point – it's a substantive problem inherent to biology.

  **Teaching Tips:**

  *   **Stick Rigorously to Time:** Phase 3 is the crucible. Protect that time.
  *   **Board Work:** Keep a running summary of group answers (Species Count? S's Status?) side-by-side for stark contrast.
  *   **Embrace the Mess:** Don't smooth over disagreements. Amplify them. "Group BSC says S is out, Group MSC says S is in. Can both be right about what EXISTS here?"
  *   **Language:** Use "prioritize," "definitive criterion," "conflicting biological signals," "carving nature at its joints."
  *   **Confusion is Progress:** If they end the session less sure about what a species "is," but understanding *why* it's unclear, you succeeded.

  This plan leverages your excellent case study to make the species problem feel unavoidable and biologically deep, moving students beyond a superficial "different definitions for different jobs" understanding. Good luck!
