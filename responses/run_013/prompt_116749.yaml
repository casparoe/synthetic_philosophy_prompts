prompt: |-
  I'm a novelist, and I'm about a year out from drafting a book built around a priority dispute: two people arrive at the same insight at nearly the same time, and the story turns on what that coincidence does to them, their reputations, and everyone in their orbit. I've been reading around the Newton–Leibniz calculus quarrel and the near-simultaneous Darwin–Wallace papers, and I keep finding that the chronology is the least interesting part. What actually grips me is the conceptual machinery underneath it: what it means for an idea to be "in the air," whether a discovery of that kind was bound to be made by someone, and whether being first is even the thing worth caring about. I have roughly a year of research before I draft and I obviously can't read everything, so what I want from you is an agenda, not a survey and certainly not a reading list -- no bibliographies, please, since I'll be working largely offline.

  Here are the candidate questions I've been circling, and I'd like you to rank them -- or tell me I've mis-framed the field entirely. First, the inevitability thesis: was the discovery bound to happen, and if so, does the mere existence of a near-simultaneous rival fatally undercut the "lone genius" story, or does it leave that story mostly intact? Second, the identity question, which I suspect is upstream of the first: are Newton's fluxions and Leibniz's differentials really one discovery or two, and are the Darwin and Wallace formulations genuinely equivalent, or does treating them as "the same discovery" beg a question? Third, the normative question: why do we care who was first, and should we -- is priority a genuine epistemic or moral category, or just an institutional convenience? Fourth, reception and neglect -- discoveries made and ignored, and the strange afterlife of an idea that has to be made twice. And fifth, the counterfactual-credit problem: if it would have happened anyway, on what basis does anyone deserve the credit?

  I want the ordering defended on explicit criteria -- which questions are upstream of the others, which are tractable by argument rather than requiring empirical sociology I'd never be able to settle, which are neglected, and which would change how I write the characters if I got a real answer versus which are just decorative. Tell me what would move a question up or down the list, where the dependencies run, and which of my five you'd drop.
reasoning: |-
  Okay, the user is a novelist working on a book about a priority dispute. They're interested in the underlying concepts rather than just the chronology. They've provided five candidate questions and want them ranked based on specific criteria like upstream influence, tractability, neglect, and impact on character development.

  First, I need to understand their main concerns. They want to explore what it means for an idea to be "in the air," whether discoveries are inevitable, and the significance of being first. The novel's focus seems to be on the psychological and social impacts of simultaneous discovery rather than historical accuracy.

  Looking at their questions:
  1. Inevitability Thesis: Was the discovery bound to happen? Does a rival undercut the "lone genius" idea?
  2. Identity Question: Are simultaneous discoveries truly the same or different?
  3. Normative Question: Why do we care about priority? Is it epistemic or just practical?
  4. Reception & Neglect: What happens when discoveries are ignored and later rediscovered?
  5. Counterfactual Credit: If it would've happened anyway, who deserves credit?

  Now, I should rank these based on the criteria they mentioned. Which questions are foundational? The Identity Question (#2) seems upstream because defining what counts as the "same" discovery affects all other questions. If two ideas aren't identical, the inevitability and credit questions change.

  Next, tractability. Questions relying on empirical sociology (#4) might be harder to settle with argument alone, whereas philosophical ones (#2, #3, #5) are more debatable. The Normative Question (#3) is crucial for character motivations—why they care about priority drives conflict.

  Neglect: Reception & Neglect (#4) is underexplored but might not directly impact character dynamics as much. Counterfactual Credit (#5) is important but could be covered under inevitability and normative aspects.

  Impact on writing characters: The Normative Question (#3) directly shapes why characters act as they do—pride, ethics, desire for recognition. Inevitability (#1) influences their sense of uniqueness. Identity (#2) affects how they perceive their contributions.

  So, ranking them:
  1. **Normative Question (#3)**: Core to character conflict. Why care about being first? This drives the plot and relationships.
  2. **Identity Question (#2)**: Foundational; defines what's being disputed. Affects how characters justify their claims.
  3. **Inevitability Thesis (#1)**: Shapes characters' self-perception. If inevitable, their struggle for recognition might feel futile.
  4. **Counterfactual Credit (#5)**: Important but can be integrated with inevitability and normative aspects.
  5. **Reception & Neglect (#4)**: Less central to the core dispute, though could add depth as a subplot.

  Dependencies: Identity and Normative questions are primary. Inevitability and Counterfactual build on them. Reception might be a separate thread but not essential for the main conflict.

  Dropping Reception (#4) as it's more tangential unless the story involves rediscovery. The other four are more tightly linked to the priority dispute's immediate impact.

  This ranking prioritizes character-driven conflict and philosophical depth, which aligns with the user's focus on the conceptual machinery over chronology.
answer: |-
  Here's a ruthless ranking of your five questions, designed to maximize conceptual payoff for your novel while minimizing dead-end research. The ranking is based on four criteria: **Upstream Primacy** (how much other questions depend on it), **Character Leverage** (how directly it shapes character decisions and conflicts), **Tractability** (whether it can be wrestled with through argument vs. requiring unverifiable data), and **Neglect-to-Value Ratio** (under-explored but high-impact angles). I'll rank them, defend the order, note dependencies, and suggest one to drop.

  ### Ranked Agenda (Most Critical First):
  1.  **The Normative Question (#3): Why do we care who was first?**  
      *   **Why #1:** Utterly upstream. *Everything* hinges on why priority matters in your fictional world. Is it about money (patents, grants)? Fame? Tenure? Scientific immortality? Moral desert? Tribal loyalty? This defines the *stakes* for your characters. If priority is just "institutional convenience," your protagonists might shrug. If it's tied to identity or moral worth, it becomes existential.  
      *   **Character Leverage:** Directly fuels character motivation, shame, rage, betrayal, obsession. Drives plot.  
      *   **Tractability:** Perfect for argument. You can explore it through dialogue, internal monologue, institutional pressures. No sociology needed.  
      *   **Neglect-to-Value:** Often treated superficially ("fame is the spur"). Delving into the *why* (vanity, ethics, economics, legacy) is rich, under-explored territory for fiction.  
      *   **Changes Your Writing:** Defines the core conflict's intensity. Is this a polite disagreement or a war?

  2.  **The Identity Question (#2): Are they really the same discovery?**  
      *   **Why #2:** Directly upstream of inevitability and credit. *What* is being disputed? If Newton's fluxions and Leibniz's differentials are fundamentally different frameworks (as some historians argue), or if Darwin's mechanism was more robust than Wallace's sketch, then "inevitability" becomes murky. This question cuts to the heart of the protagonists' claims and self-justification.  
      *   **Character Leverage:** Shapes how characters *perceive* their rival's work (as theft, inferior imitation, parallel brilliance, or tragic overlap). Fuels intellectual snobbery, defensiveness, or grudging respect.  
      *   **Tractability:** Excellent for argument. Characters can dissect each other's work, highlighting nuances, flaws, or brilliance.  
      *   **Neglect-to-Value:** Often glossed over in popular "simultaneous discovery" narratives. Crucial for authenticity and depth.  
      *   **Changes Your Writing:** Determines whether the conflict feels like a tragic misunderstanding, a battle of genuinely distinct ideas, or a squabble over semantics. How intellectually honest are your characters?

  3.  **The Counterfactual-Credit Problem (#5): If it was inevitable, who deserves credit?**  
      *   **Why #3:** Builds directly on the Normative (#3) and Inevitability (#1) questions. It's the *consequence*. If we care *why* priority matters (Normative) and *if* it was bound to happen (Inevitability), then *who deserves the laurels* becomes the burning, personal question tearing your characters apart.  
      *   **Character Leverage:** Intensely personal. Drives actions: sabotage, generosity, spite, collaboration, withdrawal. Forces characters to confront whether their worth is tied to being "first."  
      *   **Tractability:** Philosophical gold. Characters argue ethics, effort, luck, preparation, and the nature of contribution.  
      *   **Neglect-to-Value:** The core emotional wound of priority disputes, often buried under historical narratives.  
      *   **Changes Your Writing:** Defines the moral landscape. Is one character grappling with undeserved credit? Is another consumed by bitterness over lost glory despite knowing it was "in the air"?

  4.  **The Inevitability Thesis (#1): Was the discovery bound to happen?**  
      *   **Why #4:** Important, but somewhat downstream. Its impact *depends* on the answers to #2 (Identity) and #3 (Normative). If the discoveries aren't truly identical (#2), inevitability weakens. If priority doesn't fundamentally matter (#3), inevitability becomes an academic footnote.  
      *   **Character Leverage:** Affects *self-perception*. Does Character A feel like a unique genius whose thunder was stolen, or just the lucky conduit for an inevitable idea? Does Character B feel validated ("See? It *was* ripe!") or diminished ("I wasn't special")?  
      *   **Tractability:** Moderately tractable. Can be argued based on the state of the field, precursor ideas, technological/social context. Avoid deep sociology – focus on what *your characters* believe about inevitability and why.  
      *   **Neglect-to-Value:** Well-trodden ground philosophically/historically, but still potent for character interiority.  
      *   **Changes Your Writing:** Shapes the characters' sense of destiny, uniqueness, and potential bitterness/acceptance. Less about driving action, more about internal stakes.

  5.  **Reception and Neglect (#4): Discoveries made and ignored.**  
      *   **Why #5:** Least central to the *core dynamic* of a simultaneous priority dispute. It's a fascinating adjacent phenomenon (Mendel, Waterston, etc.), but its mechanics (why some ideas land and others don't) are often highly contextual, sociological, and harder to generalize or argue cleanly. It adds texture but doesn't drive the primary conflict.  
      *   **Character Leverage:** Low for the immediate dispute. *Could* be used as a cautionary tale a character references, or if *one* claimant's work was initially neglected, adding a layer of injustice. But it's not core.  
      *   **Tractability:** Low. Highly dependent on specific historical context, networks, timing, rhetoric – requires the kind of granular sociology you want to avoid.  
      *   **Neglect-to-Value:** Interesting historically, but tangential to the psychological and ethical core of your conflict.  
      *   **Changes Your Writing:** Adds background depth or a thematic echo, but unlikely to fundamentally reshape your protagonists' conflict or choices.

  ### The Drop Recommendation
  *   **Drop Reception and Neglect (#4).** It's the least essential to the core drama of a simultaneous priority dispute. Its inclusion risks diluting the intense focus on the two rivals and their immediate circle. The energy spent here is better invested in deepening the psychological and ethical trenches of #1, #2, #3, and #5. If "neglect" feels vital, fold it into the backstory of a minor character or a discarded idea one protagonist had earlier, making the *current* recognition feel even more precious or precarious.

  ### Dependencies & How to Move a Question
  *   **Upstream Flow:** The **Normative Question (#3)** is the bedrock. Why care? → This shapes how they fight over **Identity (#2)** (Is it worth fighting over *this* difference?) → Which influences views on **Inevitability (#1)** (If it's different, was it *really* inevitable?) → Culminating in the raw nerve of **Counterfactual-Credit (#5)** (Given all that, who *deserves* it?). **Reception/Neglect (#4)** operates mostly on a parallel track.
  *   **Moving Up:** A question moves up if it **directly forces character decisions or exposes fundamental contradictions in their worldview**. #3 and #5 do this explosively. #2 moves up if the *intellectual distinction* between the discoveries becomes a primary weapon or source of shame. #1 moves down if the characters *already* accept inevitability but fight anyway (making #3 and #5 paramount).
  *   **Moving Down:** A question moves down if it becomes **abstract background noise** rather than **personal stakes**. #4 risks this most. #1 moves down if the characters are more consumed by the fight itself than the philosophical "why" of simultaneity.

  ### Your Research Mission
  Focus your year on inhabiting the **Normative (#3)** and **Identity (#2)** spaces. Read arguments *for and against* why priority matters in science/art (e.g., Merton's norms vs. winner-takes-all economics; Romantic genius vs. collective effort). Study the *substantive differences* in the Newton/Leibniz and Darwin/Wallace cases – not just that they fought, but *what specific nuances or emphases* distinguished their work. This arms your characters with genuine intellectual ammunition for their battles. Let #5 emerge organically from this friction, and let #1 be a haunting specter they grapple with internally. Jettison #4 unless a specific, powerful instance screams to be a minor motif. Your novel's power lies in the human fallout of the dispute, not the catalogue of near-misses.
