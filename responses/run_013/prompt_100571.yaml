answer: |-
  ### Moral Trade Procedure for Your Swap Desk  
  I'll turn the moral trade idea into a concrete, 20-minute procedure. **Core principle**: Moral trade is valid *only* if both parties genuinely gain by their own values, without harming others or creating perverse incentives. I'll drop philosophical nuances (e.g., "utility monsters," infinite regress of trades) to keep it practical. Here’s the step-by-step:

  ---

  #### **Procedure: 6 Questions to Ask**  
  *(Stop at any "NO" answer; hand to human judgment only at Step 5)*  

  1. **Is money going *only* to registered organizations (not people)?**  
     - *Why*: Your house rule prevents bribes, conflicts of interest, or personal gain.  
     - *Good enough answer*: Documentation showing funds flow to nonprofits/charities.  
     - **STOP if NO**: Instant reject.  

  2. **Is the trade voluntary, with no coercion or exploitation?**  
     - *Why*: Moral trade requires free choice. Coercion voids the "mutual benefit" claim.  
     - *Good enough answer*: Both traders confirm in writing they’re acting freely.  
     - **STOP if NO**: Reject (e.g., threats, blackmail, power imbalances).  

  3. **Do both traders gain *by their own stated values*?**  
     - *Why*: The core of moral trade. Each must be better off subjectively.  
     - *Good enough answer*: Each trader provides a 1-sentence statement: *"I value [what I get] more than [what I give up] because [reason]."*  
       - Example: *"I value $800 for AI safety more than $800 for animals because I think AI risk is urgent."*  
     - **STOP if NO**: Reject if statements are missing, incoherent, or dishonest (e.g., Trader A says they value Trader B’s cause but history shows they hate it).  

  4. **Is the trade verifiable and logistically feasible?**  
     - *Why*: No "trust-based" promises; you need proof of execution.  
     - *Good enough answer*: A clear plan for how you’ll confirm actions (e.g., donation receipts, signed contracts).  
     - **STOP if NO**: Reject if it’s impossible to verify (e.g., "I’ll be happier if you donate").  

  5. **Does the trade harm third parties or the giving circle’s integrity?**  
     - *Why*: Moral trade shouldn’t create victims or erode trust.  
     - *Hand to human judgment*: This is values-based, not factual. Ask: *"Would approving this encourage extortion, undermine our mission, or hurt innocent people?"*  
       - *Good enough answer*: None. This is where **you or the circle** must decide based on context.  
       - *Red flags*: Job blackmail, silencing advocacy, or rewarding harmful behavior.  

  6. **Is this a one-time exchange, not a recurring demand?**  
     - *Why*: Prevents "ransom" scenarios (e.g., "Pay me yearly or I’ll revert").  
     - *Good enough answer*: The proposal specifies a single, closed transaction.  
     - **STOP if NO**: Reject (e.g., "Keep paying or I reopen the factory").  

  ---

  ### **Why This Works for You**  
  - **Fits 20 minutes**: Steps 1–4 are quick factual checks. Only Step 5 requires deeper thought.  
  - **Blocks bad-faith trades**: The "no cash to people" (Step 1) and "verifiability" (Step 4) rules prevent most scams.  
  - **Your friend’s mirror test**: Used in Step 3 (traders must articulate their own values), but discarded elsewhere—it’s too abstract for real-world tradeoffs.  
  - **Rooted in true moral trade**: This *is* moral trade, but with guardrails for practicality. Without these, it becomes "whoever shouts loudest gets paid."  

  ---

  ### **Run the Procedure on Your Proposals**  
  #### **Proposal 1: Clean Swap**  
  *"I give $800 to your animal welfare org if you give $800 to my AI safety org."*  
  - Step 1: **YES** (Money to orgs).  
  - Step 2: **YES** (Assumed voluntary).  
  - Step 3: **YES** (Both traders state: *"I value $800 for my cause > $800 for theirs"*).  
  - Step 4: **YES** (Easy to verify via receipts).  
  - Step 5: **NO HARM** (No third-party impact; no integrity risk). → **Approve**.  
  - Step 6: **YES** (One-time).  
  **Verdict: ✅ APPROVE**. Pure moral trade—both gain by their values.  

  #### **Proposal 2: Vegetarian for Donation**  
  *"Someone offers to go vegetarian for a year if the circle pays $2000 to a farmed animal org."*  
  - Step 1: **YES** (Money to org).  
  - Step 2: **YES** (Voluntary).  
  - Step 3: **YES** (Trader states: *"I value $2k for animals > not being vegetarian."* Circle states: *"We value this person’s vegetarianism > $2k."*).  
  - Step 4: **NO** (Can’t verify vegetarianism for a year without invasive tracking). → **STOP. REJECT**.  
  - *Why it felt different*: It’s not a reciprocal trade—it’s paying for behavior change. Step 4 (verifiability) killed it.  

  #### **Proposal 3: Factory Jobs for Dropped Campaign**  
  *"A company offers to keep a factory open for 2 years if we drop our campaign against them."*  
  - Step 1: **YES** (No money; just actions).  
  - Step 2: **NO** → **STOP. REJECT**.  
    - *Why*: Coercion is implied. The company is leveraging job losses to silence criticism. This fails the "voluntary" test (Step 2).  
