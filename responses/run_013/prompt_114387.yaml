prompt: |-
  Right, so I'm in third year and I'm doing this module on social ontology where we've just finished the David Lewis book on convention (the 1969 one). I'm trying to work out what my seminar tutor actually thinks a convention is, because I'm fairly sure she isn't running straight Lewis, and I can't get a straight answer out of her.

  Here's her record, from the examples we've rowed about in class:

  - Which side of the road we drive on: convention.
  - Calling a cat a cat rather than any other noise: convention.
  - Everyone accepting the same bits of metal as money: convention.
  - Standing on the right of the escalator so people can walk past on the left: convention.
  - Everyone in a lecture theatre facing the front: not a convention — she says that's just what the room does to you, there's no sense in which you're doing it because everyone else is.
  - Putting your bins out on the same morning as the neighbours because that's when the council empties them: not a convention, because the neighbours aren't coordinating with each other, they're each just reacting to the council.
  - Everyone in a hall of residence doing their washing on a Sunday because the laundry room is only unlocked on Sundays: not a convention, same reason.

  I think she might be running one of three things, but I can't tell which:
  (a) proper Lewis: mutual expectation + common knowledge + it has to be a coordination problem + there has to be at least one alternative regularity that would have worked just as well;
  (b) Lewis with the alternative bit dropped: anything mutually expected and self-sustaining, where you do it because everyone else does it, even if it's the only thing anyone could sensibly do;
  (c) something like: conventions can't be held up by sanctions or social pressure — if the only reason you conform is that you'll get grief for not conforming, it isn't a convention.

  Now the new case I want to ask her about, and I genuinely can't call it: in my mate's lab, the whole group has its weekly meeting at 2pm on Wednesdays. Everyone turns up at 2, everyone expects everyone else to turn up at 2, and you get a proper earful off the PI if you skip it. But there's no alternative anyone can see — 2pm Wednesday is the only slot when the PI, the microscope and the whole group are all free. So it's the only way the thing could be run, and it's also enforced.

  Predict her verdict on the lab meeting. Tell me which of (a), (b), (c) she's really running, or whether it's some fourth rule that fits her calls better. Tell me which of the others fit all her earlier verdicts just as well — I want the rules that are still standing after all that, not just the one you fancy. Then tell me which further case would actually settle it, i.e. the case that best tells the surviving rules apart, and what each of them would say about it.

  I'm less fussed about whether she's right than about what she's actually committed to, so if her earlier calls genuinely underdetermine the lab meeting, say so and tell me what she'd be buying with each choice.
reasoning: |-
  Okay, let me tackle this social ontology puzzle. The user is clearly deep in Lewisian convention theory and needs help reverse-engineering their tutor's position. From the examples given, the tutor seems to have specific but unstated criteria distinguishing conventions from non-conventions. 

  First, I notice all the "convention" examples (driving side, language, money, escalator) share two traits: they're arbitrary solutions to coordination problems (Lewis' core idea), and crucially, they rely on mutual expectations rather than external enforcement. The escalator case is particularly telling - nobody enforces it, we just do it expecting others to do the same.

  Now the "not convention" cases are revealing: lecture seating isn't arbitrary (room layout dictates it), bin day and laundry day aren't mutual coordination but individual responses to external constraints. This suggests the tutor might be emphasizing the arbitrariness condition (Lewis' alternative possibilities) more strictly than some interpretations.

  For the lab meeting quandary: it's enforced (earful from PI) and non-arbitrary (only possible slot). If she's strict Lewis (option a), it fails both conditions. If she dropped arbitrariness (b), the enforcement might still disqualify it. Option c focuses solely on enforcement, but that wouldn't explain why lecture seating isn't a convention. 

  The key differentiator might be whether mutual expectations alone suffice without enforcement. I'd propose testing with an unenforced but non-arbitrary case: say everyone buys bread from the only bakery in town because they expect others to. If she calls that convention, she's probably on (b); if not, she's likely strict Lewis (a).
answer: |-
  Based on her rulings and the lab meeting case, here's the breakdown:

  1.  **Predict her verdict on the lab meeting:** **Not a convention.**
  2.  **Which rule (a, b, c) is she likely running?** **(a) Proper Lewis** (mutual expectation + common knowledge + coordination problem + alternative regularity required).
  3.  **Which rules fit her earlier verdicts?**
      *   **(a) Proper Lewis:** Fits *all* examples perfectly.
      *   **(b) Lewis without alternatives:** Fails on the Lecture Theatre and Laundry Room cases. These *do* involve mutual expectations and self-sustaining behaviour ("I face front because everyone else does and it's expected", "I wash Sunday because everyone else does and it's expected"). If she dropped the alternative requirement, she should call these conventions, but she explicitly does *not*.
      *   **(c) No sanctions/social pressure:** Fails on multiple counts. Her "convention" examples *do* often involve social pressure/sanctions (fines for driving wrong side, ridicule for calling a cat a dog, social disapproval for blocking escalator, potential legal issues for rejecting money). Yet she calls them conventions. Conversely, the Lecture Theatre case has minimal sanction pressure but she doesn't call it a convention. Sanctions/pressure don't seem to be her defining criterion.
  4.  **The surviving rule:** Only **(a) Proper Lewis** cleanly fits *all* her previous rulings without contradiction.
  5.  **The diagnostic case to settle it:** **The Unenforced, Non-Arbitrary Coordination.**
      *   **Scenario:** Imagine a remote village with only one narrow bridge across a dangerous river. Everyone *must* cross at dawn when the light is best and the current slowest. Villagers cross at dawn, expect others to cross at dawn, and do it because everyone else does (coordination - crowding at other times is dangerous). There are *no* feasible alternatives (crossing at other times is highly perilous). There is *no* social sanction or enforcement mechanism beyond mutual expectation and common knowledge.
      *   **Predictions based on rules:**
          *   **(a) Proper Lewis:** **Not a Convention.** It lacks an *alternative* regularity that would have served just as well. Dawn is the *only* rational/safe time.
          *   **(b) Lewis without alternatives:** **Convention.** It involves mutual expectations, common knowledge, and self-sustaining behavior solving a coordination problem, even without alternatives.
          *   **(c) No sanctions:** **Convention?** (Potentially). It lacks sanctions/enforcement. However, if sanctions aren't the core issue for her, this might not be decisive.
      *   **Why this case?** It directly isolates the "alternative regularity" requirement (from a) from the "mutual expectation/coordination" requirement (from b). Her ruling on this case would clearly distinguish between (a) and (b). Rule (c) is likely already eliminated by her previous rulings.

  **Analysis of the Lab Meeting Case Under Lewis (a):**

  *   **Mutual Expectation & Common Knowledge?** Yes. Everyone expects everyone to be there at 2 pm Wednesday (ME), and this is common knowledge (CK).
  *   **Coordination Problem?** Yes. Getting the whole group, the PI, and the microscope together at one time requires coordination.
  *   **Alternative Regularity?** **No.** According to the description, "2pm Wednesday is the only slot when the PI, the microscope and the whole group are all free. So it's the only way the thing could be run." This fails Lewis's requirement for an *arbitrary* convention where another time *could* have been chosen if everyone expected it. Here, there is no alternative that would work.
  *   **Sanctions?** While present (earful from PI), Lewis *does* allow conventions to be supported by sanctions. His driving example includes legal sanctions. Sanctions alone don't disqualify it under Lewis. The *lack of an alternative* does.
  *   **Conclusion for (a):** Not a convention. It's a uniquely optimal solution to a coordination problem, enforced by authority. It's a rule or a practical necessity, not a convention in the Lewisian sense.

  **What She'd Be Buying With Each Choice (If Underdetermined - Though It Isn't Here):**

  *   **Calling it a Convention:** She would be moving towards **(b) Lewis without alternatives**, emphasizing mutual expectations and coordination solving *regardless* of whether alternatives exist. This would require her to reconsider her Lecture Theatre and Laundry rulings.
  *   **Calling it Not a Convention:** She reaffirms **(a) Proper Lewis**, sticking to the requirement that conventions involve arbitrariness – the idea that "we do it this way, but we *could* have done it another way just as well if we all expected each other to do that instead." This maintains consistency with all her previous rulings.

  **Conclusion:**

  Your tutor is very likely a **strict Lewisian (a)**. Her rulings consistently hinge on the requirement for an *alternative possible regularity*. The Lecture Theatre isn't arbitrary (room dictates it). Bin Day and Laundry Day aren't mutual coordination but individual responses to external constraints (council schedule, locked door). The lab meeting fails because it's the *only* feasible solution, not an arbitrary choice among alternatives. The diagnostic case (Unenforced, Non-Arbitrary Coordination) would definitively confirm this by showing she rejects mutual-expectation-based coordination *without* alternatives as a convention.
