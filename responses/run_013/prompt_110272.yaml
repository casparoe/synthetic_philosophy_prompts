prompt: |-
  So I've been reading alot of philosophy of language lately — I'm the kind of person who reads too much LessWrong and adjacent blogs and somehow wandered into the expressivism literature — and I keep having the feeling that the whole Frege-Geach mess is a problem I already know from programming languages, and I want to know if thats a real insight or just me pattern-matching. Quick setup in case it helps: expressivists say a sentence like lying is wrong doesn't describe a fact, it expresses a non-cognitive attitude (disapproval, roughly). Frege-Geach points out the same sentence shows up unasserted inside compounds — if lying is wrong then getting your kid to lie is wrong — and inside valid arguments like modus ponens, so its meaning cant just be the attitude you happen to have when you assert it, on pain of equivocation. Then there's the nastier sub-problem I've seen called the negation problem: grant the expressivist a compositional semantic value for the sentence; what does lying is not wrong express? The mere absence of disapproval? A distinct attitude of tolerance or approval? If the value of the sentence is an attitude, negation has to do something determinate to it, and it's not obvious there's a principled answer that isnt just smuggling descriptive content back in.

  My vocabulary, since I mostly think in PL: pure values vs effects, evaluation contexts, thunks and forcing, denotational vs operational semantics, monads / algebraic effects, referential transparency, quoting vs evaluating. My hunch is content = the pure value, force or assertion = an effect that fires when you run the thing, an embedded occurrence = a subterm whose effect doesn't fire, and expressivism = the claim that the value of a moral sentence is itself an effectful computation. So: restate the expressivist position — including how it wants to answer Frege-Geach and the negation problem — as faithfully as you can in that vocabulary, and then give me the residue report: what translates cleanly, what only translates if you fudge it, and what has no counterpart at all. My guess is the correctness/normativity of attitudes is the thing that wont fit (a program can be buggy but not morally incorrect), but tell me if I'm wrong and why.

  Format: exactly five numbered points, one or two sentences each, no intro and no wrap-up. Make the first four specific pieces of the view — the core claim, the embedding/conditional case, the negation case, and the validity/modus-ponens case — each translated into my vocabulary or explicitly noted as failing to translate, and make the fifth the residue: the part that doesn't survive the translation at all, and why.
reasoning: |-
  Hmm, the user is deep into philosophy of language, especially expressivism and the Frege-Geach problem, and they're drawing parallels to programming language concepts. They want me to map expressivist ideas to PL terms like effects, monads, and so on, and then identify what doesn't translate. They've given a clear format: five numbered points without intros or conclusions.

  First, I need to recall the expressivist position. Expressivists say moral sentences express attitudes, not facts. For example, "lying is wrong" expresses disapproval. The Frege-Geach problem questions how this works in embedded contexts like conditionals or modus ponens arguments. The negation problem asks how negation affects the attitude—does "not wrong" mean absence of disapproval or a different attitude?

  The user's PL analogy: content is a pure value, assertion is an effect that runs when evaluated, and embedded occurrences are subterms where the effect isn't fired. Expressivism claims moral sentences are effectful computations, not descriptive values.

  Now, I'll structure the response as per the query: five points. The first four cover specific parts: core claim, embedding in conditionals, negation, and validity like modus ponens. The fifth is the residue that doesn't translate.

  1. Core claim: Translate "lying is wrong" as an effectful computation—e.g., a monadic action that produces disapproval. The meaning isn't a truth value but the effect itself.

  2. Embedding in conditionals: For phrases like "if lying is wrong, then...", this maps to placing the effectful computation in a context where it's not executed, like a thunk or a quoted expression. The conditional treats it as a value that can be passed around without firing the effect, avoiding equivocation in arguments.

  3. Negation problem: "Lying is not wrong" is trickier. In PL terms, negation could be an operator that transforms the effect, like flipping disapproval to approval. But this might be arbitrary without a principled rule. If it's just absence of effect, that doesn't capture the attitude correctly. So, it translates only if we fudge it by defining negation as an effect modifier, but expressivists struggle to justify this without sneaking in descriptive content.

  4. Validity and modus ponens: Arguments must preserve validity. In PL, this means denotational semantics—the pure values must compose logically, even if effects are involved. So, expressivists need to extract a truth-conditional core from the effectful computations to make inferences work, like using a monad to separate values from effects. This translates well because PL has tools for handling effects in compositions.

  5. Residue: What doesn't translate? The user guessed it's the normativity of attitudes—why we should have certain attitudes. In PL, an effectful computation can be buggy or run incorrectly, but that's about functionality, not moral correctness. Attitudes in expressivism involve normative force that PL lacks; code doesn't have "shoulds" beyond execution errors. So, this part is lost in translation.

  I need to ensure the response is concise—one or two sentences per point—and sticks to the format. No intro or wrap-up. Check that each point addresses the user's vocabulary and the expressivist issues accurately.
answer: |-
  1. Core claim: "lying is wrong" denotes a suspended effect (e.g., a monadic action yielding disapproval), not a pure descriptive value; this translates cleanly as equating moral content with effectful computations awaiting evaluation.  
  2. Embedding (e.g., in conditionals): Unasserted occurrences are thunks (unevaluated computations/quoted effects), preventing attitude discharge in embedded contexts; this translates cleanly via effect suppression in subterms.  
  3. Negation problem: "not wrong" requires an operator mapping the base attitude-effect (e.g., disapproval → tolerance), but this only translates if fudged by stipulating an arbitrary effect-transformer, lacking expressivism’s needed normative justification.  
  4. Validity (modus ponens): Preserving logical form requires denotational values (truth-conditions) composing purely; this translates only if fudged by projecting a descriptive "core" from the effect (e.g., via monadic bind), contradicting pure expressivism.  
  5. Residue: The normativity of attitudes—why we *should* disapprove of lying—fails to translate; PL effects lack inherent correctness beyond functional execution (bugs ≠ moral errors), while expressivism requires attitudes to be intrinsically normative.
