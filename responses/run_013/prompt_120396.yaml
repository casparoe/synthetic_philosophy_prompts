  We are building an exam question about money pumps and diachronic rationality, centered on Nadia's case with three variants of foresight and decision-making.
   The case: Nadia has strict cyclic preferences (A>B, B>C, C>A). She starts with C. The trader offers:
     Monday: Trade C (+£1) for B
     Tuesday: Trade B (+£1) for A
     Wednesday: Trade A (+£1) for C

   The question must cover three variants:
     (i) Naive: does not foresee later choices.
     (ii) Foresees perfectly but decides each offer by comparing the two bundles on the table.
     (iii) Foresees perfectly and decides by the final holding she would reach if she accepted, given future choices.

   The question should also ask about what the variants show about the relation between intransitivity, exploitability, and diachronic rationality, and force a position on whether the pump shows cyclic preferences are irrational or only irrational with an additional premise, and whether variant (iii) is still cyclic.

   Deliverables:
     (1) The exam question (with case and parts)
     (2) A model answer (700 words, definite line, strongest objection and reply)
     (3) Marking scheme: 5 must-hit points (with marks and typical loss)
     (4) What separates A from B

   Let's design the exam question first.

  Exam Question:

  Nadia's Preferences and the Money Pump

  Nadia has strict cyclic preferences over three bundles A, B, and C. Specifically, at every moment she strictly prefers A to B, B to C, and C to A. A trader makes her the following three offers on three consecutive days, each to be accepted or declined on the spot and never repeated:

  - On Monday: Trade the bundle C (which she currently holds) plus one pound for bundle B.
  - On Tuesday: Trade the bundle B (if she holds it) plus one pound for bundle A.
  - On Wednesday: Trade the bundle A (if she holds it) plus one pound for bundle C.

  Nadia begins the week holding bundle C. She cannot bind her future self in advance, and the three trades cannot be combined into a single package.

  (a) For each of the following three variants of Nadia's decision-making, determine whether the trader can extract money from her (and how much) and explain why. (9 marks)

  (i) Naive Nadia: She does not foresee her later choices and on each day considers only the immediate trade.

  (ii) Sophisticated but myopic Nadia: She foresees her later choices perfectly, but on each day decides by comparing only the two bundles then on the table (the one she would give up and the one she would get).

  (iii) Sophisticated and forward-looking Nadia: She foresees her later choices perfectly and on each day considers the final holding she would end up with if she accepted the current offer, given what she would go on to accept and decline.

  (b) What do the three variants jointly show about the relation between intransitive preferences, exploitability, and diachronic rationality? In particular, do they show that cyclic preferences are irrational? Or do they only show that cyclic preferences are irrational when combined with a further premise about commitment, foresight, or how choices are evaluated? Also, is variant (iii) still a case of cyclic preference at all? (11 marks)

  Model Answer (about 700 words):

  The three variants of the money pump scenario reveal distinct vulnerabilities arising from cyclic preferences under different decision-making procedures, and they challenge the notion that intransitivity necessarily implies irrationality without qualification.

  In variant (i), Naive Nadia does not foresee future offers. On Monday, she is offered B for C plus £1. Since she prefers B to C, she accepts and now holds B, having paid £1. On Tuesday, she is offered A for B plus £1. She prefers A to B, so she accepts and now holds A, having paid another £1. On Wednesday, she is offered C for A plus £1. She prefers C to A, so she accepts and ends up with C, having paid a total of £3. The trader extracts £3, and she is back where she started. This shows that without foresight, cyclic preferences make her vulnerable to a full pump.

  In variant (ii), Sophisticated but myopic Nadia foresees her future choices but on each day only compares the immediate bundles. On Monday, she knows that if she accepts (trading C+£1 for B), then on Tuesday she will accept trading B+£1 for A (because she prefers A to B), and on Wednesday she will accept trading A+£1 for C (because she prefers C to A). Thus, she foresees that accepting Monday's offer leads to a sequence ending with C and having paid £3. But on Monday, when she compares her current holding (C) to the immediate trade (B), she prefers B to C. So she accepts. Similarly, on Tuesday, she holds B and compares it to A (prefers A) and accepts, and on Wednesday, she holds A and compares it to C (prefers C) and accepts. The trader again extracts £3. This variant shows that even with foresight, if the agent evaluates each trade myopically, she still falls prey to the pump.

  In variant (iii), Sophisticated and forward-looking Nadia also foresees the future but evaluates each choice by the final outcome. On Monday, if she accepts (trading C+£1 for B), she knows she will then accept Tuesday's trade (B+£1 for A) and Wednesday's trade (A+£1 for C), so she ends up with C and down £3. If she declines on Monday, she keeps C. So she compares the final outcome of accepting (C and -£3) with declining (C and £0). Clearly, she prefers the latter. Therefore, she declines on Monday. The trader gets nothing. On Tuesday, if she holds B (which she does only if she accepted Monday, but she didn't), then she would compare: accepting leads to A and then on Wednesday to C and -£2 (from Tuesday and Wednesday), but since she didn't accept Monday, she holds C throughout. Similarly, Wednesday: if she holds A, she would end up with C and -£1 by accepting, but she doesn't hold A. So in variant (iii), she avoids all trades and the trader extracts nothing.

  The three variants jointly demonstrate that exploitability of cyclic preferences depends critically on the agent's decision-making procedure. Intransitivity alone does not guarantee exploitability; it requires a failure of rationality in the diachronic setting. Specifically, variant (i) fails due to lack of foresight; variant (ii) fails because of myopic evaluation even with foresight; only variant (iii) escapes by evaluating the entire path. This suggests that the money pump argument does not show that cyclic preferences are inherently irrational, but rather that they become problematic when combined with a myopic or non-forward-looking decision procedure. The irrationality lies in the diachronic inconsistency of the decision-making, not in the preference cycle per se.

  Moreover, variant (iii) raises the question: is Nadia still cyclic? In her forward-looking evaluations, she is effectively comparing final outcomes. On Monday, she prefers declining (keeping C with no loss) to accepting (ending with C and -£3). This is consistent with having a preference for more money. But note that her underlying preferences over bundles remain cyclic. However, when she evaluates sequences, she breaks the cycle by incorporating the monetary cost. In fact, she now has a transitive preference over the outcomes that include money: having C with £0 is better than having C with -£3. Thus, her cyclic preferences over bundles are still present, but she avoids the pump by considering the entire transaction and not just the bundles.

  The strongest objection to this view is that if cyclic preferences persist, they might lead to exploitation in other scenarios. For instance, if the trader offered a different sequence, or if the agent faced a single choice between A, B, and C, she might choose in a cycle. However, in a single choice, she would have to pick one, and there is no clear best choice because of the cycle. This might still be problematic. But the point of the money pump is to show a dynamic inconsistency and exploitation, and variant (iii) avoids that. The objection highlights that cyclic preferences can lead to indecision or arbitrary choice, but that is a separate issue. The money pump, as a dynamic exploitation argument, is defused by forward-looking rationality.

  In conclusion, the variants show that cyclic preferences are not necessarily irrational in the sense of leading to dynamic exploitation if the agent is sophisticated and forward-looking. The irrationality in the money pump arises from the decision procedure, not the preferences alone. Therefore, the argument for transitivity based on money pumps requires an additional premise about how choices are made over time.

  Marking Scheme (5 must-hit points, total 20 marks):

  1. Correct analysis of variant (i): Trader extracts £3. (4 marks)
     - Typical loss: Failing to show the sequence of trades and the outcome (ending at C with £3 less).

  2. Correct analysis of variant (ii): Trader extracts £3. (4 marks)
     - Typical loss: Not explaining that despite foresight, the myopic evaluation leads to accepting all.

  3. Correct analysis of variant (iii): Trader extracts nothing. (4 marks)
     - Typical loss: Not recognizing that she declines Monday because of the overall outcome.

  4. Clear explanation of what the variants show about the relation between intransitivity, exploitability, and diachronic rationality: Exploitability depends on the decision procedure, not just intransitivity. (4 marks)
     - Typical loss: Making a vague statement without tying to the variants.

  5. Taking a clear position on whether cyclic preferences are irrational (or only with an extra premise) and on whether variant (iii) remains cyclic: Argues that cyclic preferences are not necessarily irrational (only with a flawed decision procedure) and that variant (iii) still has cyclic preferences over bundles but evaluates outcomes with money transitively. (4 marks)
     - Typical loss: Failing to address the issue of whether variant (iii) is cyclic or not, or giving an unclear answer.

  What separates an A answer from a B answer:

  An A answer will not only correctly analyze each variant and the overall lesson but also engage deeply with the philosophical crux: the distinction between preferences and decision procedures, and the conditions under which cyclic preferences lead to exploitation. It will clearly articulate that the money pump does not prove cyclic preferences are inherently irrational because the sophisticated forward-looking agent avoids it, and it will address the objection about variant (iii) still having cyclic preferences. The argument will be concise, well-structured, and show original thought within the constraints.

  A B answer will correctly analyze the three variants and summarize the lesson but may not fully explore the implications for the rationality of cyclic preferences or may give a superficial treatment of whether variant (iii) is cyclic. It might also lack depth in addressing the objection or might fail to tie the analysis to the broader question of diachronic rationality.
answer: |-
  ### Exam Question

  **Nadia's Money Pump**  
  Nadia has strict cyclic preferences over three bundles A, B, and C: at every moment, she strictly prefers A to B, B to C, and C to A. A trader makes her the following three offers on consecutive days, each accepted or declined on the spot and never repeated:  
  - **Monday**: Trade her current bundle C (plus £1) for bundle B.  
  - **Tuesday**: Trade her current bundle B (plus £1) for bundle A.  
  - **Wednesday**: Trade her current bundle A (plus £1) for bundle C.  

  Nadia begins holding C. She cannot bind her future self, and the trades cannot be bundled.  

  **(a)** For each variant of Nadia below, determine whether the trader extracts money (and how much), and explain why. (9 marks)  
  (i) **Naive Nadia**: She does not foresee later choices and evaluates each offer based only on the bundles immediately involved.  
  (ii) **Myopically Sophisticated Nadia**: She perfectly foresees her future choices but evaluates each offer by comparing only the two bundles on the table.  
  (iii) **Forward-Looking Sophisticated Nadia**: She perfectly foresees future choices and evaluates each offer by the *final holding* she would reach if she accepted it, given her future decisions.  

  **(b)** What do the three variants jointly show about the relationship between intransitive preferences, exploitability, and diachronic rationality? Specifically:  
  - Do they prove that cyclic preferences are inherently irrational?  
  - Or do they show irrationality only arises with an additional premise (e.g., about commitment, foresight, or choice evaluation)?  
  - Is variant (iii) still a genuine case of cyclic preferences?  
  Argue for a definite position. (11 marks)  

  ---

  ### Model Answer (700 words)  

  **(a)**  
  **(i) Naive Nadia**: The trader extracts **£3**. On Monday, Nadia prefers B to C, so she trades C+£1 for B. On Tuesday, she prefers A to B, so she trades B+£1 for A. On Wednesday, she prefers C to A, so she trades A+£1 for C. She ends with C, having paid £3. Without foresight, she treats each trade in isolation, revealing how cyclic preferences enable stepwise exploitation.  

  **(ii) Myopically Sophisticated Nadia**: The trader extracts **£3**. Though Nadia foresees the entire sequence, she evaluates each trade myopically. On Monday, she compares B to C (prefers B) and accepts, knowing she will later trade B for A and A for C, leaving her at C with £3 less. Despite her foresight, she cannot resist the immediate preference. The same occurs on Tuesday and Wednesday. Her myopia—evaluating only the immediate bundles—forces her into the pump.  

  **(iii) Forward-Looking Sophisticated Nadia**: The trader extracts **£0**. Nadia foresees future choices and evaluates offers by their final outcome. On Monday, accepting would lead her to trade sequentially, ending with C minus £3. Declining leaves her with C. Since C with £0 is better than C with £-3, she declines. No further trades occur. She avoids exploitation by considering the cumulative consequence of her choices.  

  **(b)** The variants jointly demonstrate that **cyclic preferences are not inherently irrational**; instead, exploitability depends on **diachronic decision-making failures**. The pump only succeeds when agents disregard the temporal structure of choices, showing that irrationality arises from an *additional premise* about *how choices are evaluated*, not from intransitivity alone.  

  In variants (i) and (ii), exploitation occurs because Nadia evaluates choices locally: naively (ignoring future trades) or myopically (ignoring cumulative costs). Here, cyclic preferences *interact* with flawed decision rules to produce losses. Yet variant (iii) escapes: by evaluating choices globally (via final holdings), she "solves" the cycle. This reveals that the money pump argument implicitly assumes agents evaluate choices *myopically* or *without foresight*. Without this premise—i.e., if agents are forward-looking—cyclic preferences need not be exploitable.  

  Crucially, variant (iii) **remains a genuine case of cyclic preferences**. Nadia’s underlying ranking of bundles (A>B, B>C, C>A) persists, as defined. However, when evaluating *sequences*, she incorporates monetary consequences, forming a *new* transitive ranking over outcomes (e.g., "C with £0" > "C with £-3"). This does not "cure" her cyclic bundle preferences; it shows that rational agents can *manage* cycles by expanding their evaluation criterion to include external factors (like money). Cyclic preferences are thus problematic only when agents fail to consider the diachronic implications of their choices.  

  **Strongest objection**: One might argue that if cyclic preferences persist, variant (iii) merely "hides" irrationality. For instance, if offered bundled trades (e.g., "swap C for B now, but commit to all three trades"), Nadia would reject it (as it leaves her worse off). But in sequential choices, her cycle is irrelevant because she evaluates final states transitively. This implies cyclic preferences are *pragmatically* irrational in dynamic contexts unless agents are perfectly foresighted—which is unrealistic.  

  **Reply**: This objection conflates *preferences* with *practical rationality*. Cyclic preferences are not "hidden"; they are *subordinated* to a higher-order transitive standard (final outcomes) in variant (iii). The objection’s concern—that few agents have perfect foresight—highlights why money pumps are *practical* risks, but it does not prove cyclic preferences are *intrinsically* irrational. Rather, it shows that rationality in dynamic settings requires agents to align their choice evaluation with long-term consequences. Thus, the pump critiques not transitivity, but *myopia*.  

  In sum, the variants prove that exploitability stems from *diachronic myopia*, not cyclic preferences alone. Rationality requires evaluating choices in light of their full consequences—a premise variant (iii) satisfies. Cyclic preferences may be unusual, but they are demonstrably compatible with sophisticated, non-exploitable behavior.  

  ---

  ### Marking Scheme (20 marks total)  
  1. **Variant (i) analysis (4 marks)**: Correct outcome (£3 extracted) and explanation (naivety leads to stepwise acceptance).  
     *Typical loss: Omitting that cyclic preferences drive each trade, or misstating the net loss.*  
  2. **Variant (ii) analysis (4 marks)**: Correct outcome (£3 extracted) and explanation (foresight + myopic evaluation forces acceptance).  
     *Typical loss: Claiming foresight prevents exploitation, or not distinguishing myopic vs. forward-looking evaluation.*  
  3. **Variant (iii) analysis (4 marks)**: Correct outcome (£0 extracted) and explanation (forward-looking evaluation justifies declining Monday’s offer).  
     *Typical loss: Arguing she accepts trades, or not linking foresight to final-outcome reasoning.*  
  4. **Broader implications (4 marks)**: Clear position: exploitability requires a flawed decision rule (e.g., myopia), not just cyclic preferences.  
     *Typical loss: Asserting cyclic preferences are inherently irrational, or not addressing the "additional premise" requirement.*  
  5. **Handling cyclic preferences in (iii) (4 marks)**: Defends that (iii) retains cyclic preferences but avoids exploitation via transitive outcome-evaluation.  
     *Typical loss: Claiming (iii) "abolishes" the cycle, or not engaging with the "genuine case" question.*  

  ---

  ### A vs. B Answer Differentiation  
  - **A answer**: Hits all marking points *and* offers a nuanced, original argument in (b). Integrates the variants to show why myopia—not intransitivity—is the crux. Anticipates and thoroughly rebuts the strongest objection (e.g., by separating preferences from decision rules).  
  - **B answer**: Correctly answers (a) and (b) but with superficial treatment of (b). May list observations without synthesizing them (e.g., "variant (iii) escapes, so cycles aren’t always bad"), or inadequately address whether (iii) remains cyclic. Fails to confront the objection persuasively.
