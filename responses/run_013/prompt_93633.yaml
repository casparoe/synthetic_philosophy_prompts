  We are designing a classroom demonstration for a master's-level seminar on rational choice. The students are familiar with the standard Ellsberg urn paradox (comparing a known-probability urn to an ambiguous one) and have seen it in lecture. We need to move beyond that to show that ambiguity aversion is not a preference for the unknown per se, but is the same as the aversion to a two-stage lottery that is reduced to a one-stage equivalent. Specifically, we want to show that:

  1. A bet on a color from an urn with known composition (say, 50 red, 50 blue) is equivalent to a two-stage lottery where a fair coin flip chooses which of two identical known urns (both 50-50) to draw from. The two-stage lottery is identical to the one-stage in terms of final probabilities (50% chance of winning in both). But if a student prefers the one-stage, they are violating a reduction principle they would otherwise endorse.

  2. Additionally, if possible without compromising the main point, we want to test whether the attitude changes when the ambiguous urn is presented as already determined (but unknown to the participant) versus not yet settled.

  We have 90 minutes, 16 students, no computers, and we can use paper, index cards, a projector. We'll use tokens or points for incentives.

  We must avoid:
  - Giving away the point too early (so no naming the reduction principle until the reveal).
  - Using real money (so we'll use points and perhaps a prize at the end).

  Let's consider structurally different designs:

  **Design 1: Sequential Choice with Paired Comparisons**
     - Each student makes a series of choices between two bets. We include:
          (A) Bet on a known 50-50 urn.
          (B) Bet on an ambiguous urn (with 100 balls, but unknown red/blue composition).
          (C) Bet on a two-stage lottery: a fair coin flip to choose which of two known 50-50 urns to draw from.
          (D) A variant of (B) where the ambiguous urn is described as already fixed (but unknown) versus not yet fixed.

     How it might fail: The two-stage lottery (C) might be seen as more complex and might be avoided for that reason, not because of ambiguity aversion. Also, if we present all choices at once, students might figure out the equivalence and adjust their answers.

  **Design 2: Eliciting Indifference Prices**
     - We ask students to state the minimum price at which they would be willing to sell a ticket to each of the bets (A, B, C, D). Then we compare the prices. The bet with the highest selling price is the most preferred.

     How it might fail: Eliciting prices is cognitively demanding and might not work well in a classroom setting. Also, the range of prices might be hard to compare without a common scale.

  **Design 3: Voting with Public Display of Preferences**
     - We present pairs of bets and have students vote for their preferred option. We display the votes and then discuss. We can do multiple rounds.

     How it might fail: Students might be influenced by others' votes (herd behavior). Also, we might not get individual commitment to choices.

  **Design 4: Individual Choice with Private Response and Public Aggregation**
     - Each student gets a form with multiple questions. They answer privately, then we collect and display the aggregate results. This avoids herd effects and allows each to see their own choices.

     How it might fail: It might take more time to collect and aggregate.

  Given the goals, I think **Design 4** is best because:
  - It ensures individual reflection.
  - We can design the form to have the key comparisons in an order that builds the reveal.
  - We can control the timing and avoid early reveals.

  We'll combine it with a public discussion after the private choices.

  Now, let's design the activity in full.

  **Materials:**
  - Handout with 6 questions (each a choice between two bets) for each student.
  - Index cards (for optional use in the two-stage lottery, but we won't actually draw because of time; we'll simulate with a coin flip on the projector).
  - Projector to display aggregate results (and to flip a coin for demonstration).
  - Tokens or points to record choices. We can have one token per question, and then at the end, one question will be randomly selected to be played for real (with a prize).

  **Payoff Structure:**
  - Each student will make 6 choices. At the end, the facilitator will randomly select one of the 6 questions (by a die roll) and then, for the chosen question, the facilitator will implement the bet that the student chose in that question. We will then see who wins and award points (or a prize). This ensures that each choice is incentive-compatible.

  **Timeline (90 minutes total):**

  **Part 1: Introduction and Setup (10 minutes)**
  - (0-5 min) Facilitator introduces the session: "We are going to explore some choices involving uncertainty. You are familiar with the Ellsberg paradox. Today we will look at some variations. You will make choices, and at the end, one of your choices will be randomly selected and played for real points (or a prize)."
  - (5-10 min) Distribute handouts and explain the format. The handout has 6 questions. Each question is a choice between two bets. Each bet pays 100 points if you win and 0 if you lose. The students must circle their preferred bet for each question.

  **Part 2: Individual Choice (15 minutes)**
  - Students work silently on the handout. The questions are:

     **Question 1 (Baseline known vs ambiguous):**
     - Bet A: Draw a ball from Urn K (known: 50 red, 50 blue). Win 100 points if red.
     - Bet B: Draw a ball from Urn A (ambiguous: 100 balls, each is either red or blue, but you don't know how many of each). Win 100 points if red.

     **Question 2 (Baseline known vs two-stage):**
     - Bet A: Same as above (Urn K, win if red).
     - Bet C: First, flip a fair coin. If heads, draw from Urn K1 (50 red, 50 blue). If tails, draw from Urn K2 (also 50 red, 50 blue). Win 100 points if the drawn ball is red.

     **Question 3 (Ambiguous vs two-stage):**
     - Bet B: As in Q1 (Urn A, win if red).
     - Bet C: As in Q2 (coin flip then urn draw, win if red).

     **Question 4 (Ambiguous already fixed vs not fixed):**
     - Bet B1: Urn A is already filled (the composition is fixed but unknown to you). Win if red.
     - Bet B2: Urn A will be filled after you choose (the composition is not yet determined). Win if red.

     **Question 5 (Two-stage vs known - reversed):**
     - Bet C: As in Q2 (two-stage).
     - Bet A: As in Q1 (known).

     **Question 6 (Ambiguous vs known - repeated to check consistency):**
