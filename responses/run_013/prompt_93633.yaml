  ### Live Classroom Demonstration Design: Unifying Ambiguity Aversion and Compound Lottery Aversion

  **Core Insight to Demonstrate:**  
  Ambiguity aversion (preferring known-risk urns over ambiguous ones) stems from the same psychological disposition as aversion to *two-stage lotteries*—even when the two-stage lottery is objectively equivalent to a known-risk lottery. This violates the reduction principle (rational agents should treat compound lotteries as equivalent to their simplified form). The secondary insight: attitudes remain unchanged whether ambiguity is framed as "already resolved but unknown" or "not yet resolved."

  ---

  #### **Design Rationale & Structural Options Considered**  
  Before drafting, I evaluated four approaches. Each fails to fully meet the goals:

  1. **Sequential Real-Choice Tournaments**  
     - *Structure:* Students play multiple rounds of urn bets, accumulating tokens. Choices escalate from simple known/ambiguous to compound lotteries.  
     - *Failure:* Incentives may distort choices (e.g., risk-seeking to "catch up"), and the equivalence reveal depends on facilitator narration, not self-discovery.  

  2. **Paired Indifference Pricing**  
     - *Structure:* Students set minimum selling prices for bets on known, ambiguous, and compound lotteries. Prices reveal preference intensities.  
     - *Failure:* Pricing complexity overwhelms; fails to force direct preference comparisons. No "aha" moment when seeing one’s own contradictions.  

  3. **Strategy-Proof Voting with Discussion**  
     - *Structure:* Public votes on bet pairs, followed by immediate debates. "Strategy-proof" rules discourage herd effects.  
     - *Failure:* Early vocal students hijack the narrative; peer pressure masks individual reasoning. Violations feel like group errors, not personal traits.  

  4. **Private Choice → Blind Aggregation → Personal Reveal (Selected Approach)**  
     - *Structure:* Students answer bet pairs privately. Aggregated results are displayed *before* equivalence is explained. Each student then compares their choices to the group pattern and calculates personal contradictions.  
     - *Why It Works:*  
       - Privacy avoids social influence.  
       - Aggregated data surprises students with peer consensus *before* they grasp why.  
       - Self-audit of choices forces recognition of inconsistency.  
       - Secondary insight tested via identical choice framing.  

  ---

  ### **Full Demonstration Design**  
  **Materials:**  
  - 16 envelopes, each containing:  
    - 1 token (for betting)  
    - 3 identical index cards (for choices)  
    - 1 personal audit sheet (grid to record choices)  
  - Projector + 2 pre-prepared slides:  
    - Slide 1: Blank grid for choice aggregation.  
    - Slide 2: Urn/coin probability calculations (revealed late).  
  - 1 prize (e.g., book) for one winner selected via lottery.  

  **Payoff Structure:**  
  - All bets pay 100 points if successful, 0 if not.  
  - One bet per student is randomly selected for real play (details below).  
  - **Urns:**  
    - **Urn K:** 50 red, 50 blue balls (known).  
    - **Urn A:** 100 balls, red/blue ratio unknown (ambiguous).  
    - **Urn Pair (K1, K2):** Two urns, both identical to Urn K.  

  ---

  #### **Timeline (90 Minutes Total)**  
  **Phase 1: Setup (10 min)**  
  - **Facilitator:**  
    - *Say:* "Place tokens in front of you. They represent entry into bets. Later, one person will win a prize based on their token. Each index card is for one choice. Write your seat number on all cards. Use the audit sheet to note your choices privately."  
    - *Do:* Distribute envelopes. Project blank aggregation grid (columns: Choice 1A/1B, 2A/2B; rows: seat numbers 1–16).  
    - *Don’t:* Mention ambiguity aversion, compound lotteries, or probabilities.  

  **Phase 2: Private Choice Elicitation (15 min)**  
  - **Facilitator:**  
    - *Say:* "On each card, circle your preferred bet. Choices are:  
      - **Choice 1:**  
        A: Bet on Urn K (50 red, 50 blue). Win if red.  
        B: Bet on a two-stage lottery: Flip a fair coin. If heads, bet on Urn K1 (50 red, 50 blue). If tails, bet on Urn K2 (same as K1). Win if red.  
      - **Choice 2:**  
        A: Bet on Urn K (same as above).  
        B: Bet on Urn A (ratio unknown). Win if red.  
      - **Choice 3:**  
        B1: Bet on Urn A (ratio unknown, *fixed yesterday*). Win if red.  
        B2: Bet on Urn A (ratio unknown, *fixed tomorrow*). Win if red."  
    - *Do:* Emphasize silence. Collect cards in three batches (Choice 1 first, then 2, then 3).  
  - **Student Task:** Circle choices on cards and note them on audit sheets.  

  **Phase 3: Aggregation & Blind Display (20 min)**  
  - **Facilitator:**  
    - *Do:* Tally choices on projected grid as cards are collected. For Choice 3, add a note: "B1 = fixed yesterday, B2 = fixed tomorrow."  
    - *Say (after Choice 1 tally):* "Look at the grid. For Choice 1, how many chose A? How many B?" (Wait for show of hands). "Interesting consensus."  
    - *Say (after Choice 2 tally):* "Now Choice 2. How many chose A? B? Compare to Choice 1."  
    - *Don’t:* Explain patterns or label preferences.  
  - **Critical Display Order:**  
    1. Show Choice 1 results (A vs. B).  
    2. Show Choice 2 results (A vs. B).  
    3. Show Choice 3 results (B1 vs. B2).  
    - *Example Grid:*  
      | Seat | Choice 1 | Choice 2 | Choice 3 |  
      |------|----------|----------|----------|  
      | 1    | A        | A        | B1       |  
      | 2    | A        | A        | B2       |  
      | ...  | ...      | ...      | ...      |  

  **Phase 4: The Reveal via Self-Audit (25 min)**  
  - **Facilitator:**  
    - *Say:* "Open your audit sheet. Add two calculations:  
      1. Circle if you chose 1A *and* 2A.  
      2. Circle if you chose 1B *and* 2B.  
      Now, compute the *objective probability* of winning for each bet:  
      - Urn K (1A/2A): 50% red → **50% chance to win**.  
      - Two-stage lottery (1B): Coin (50% heads) → Urn K1 (50% red) OR Urn K2 (50% red). Math: (0.5 × 0.5) + (0.5 × 0.5) = **50% chance to win**.  
      - Urn A (2B/Choice 3): ??? red → **Unknown chance, but expected 50% if you assume random composition**."  
    - *Do:* Project Slide 2 with probability math.  
    - *Say:* "If you chose 1A over 1B, you rejected a mathematically identical bet. If you chose 2A over 2B, you rejected ambiguity. If you did both, you used the same rule twice: avoiding multi-stage uncertainty."  
    - *Don’t:* Use jargon ("reduction principle," "ambiguity aversion").  

  **Phase 5: Debrief & Prize Draw (20 min)**  
  - **Facilitator:**  
    - *Say:* "Let’s discuss: Raise hands if you chose 1A and 2A. What felt different about the two-stage bet?" (Listen, then reinforce). "Notice: Choice 3 (B1 vs. B2) split roughly 50-50. Whether ambiguity is ‘already known’ or ‘not yet settled’ didn’t matter—only the lack of information did."  
    - *Do:* Randomly draw one student’s token. Resolve one of their bets using a coin/urn drawn in real-time. Award prize.  
    - *Key Points to Convey:*  
      1. **What the activity shows:**  
         - Choices 1 and 2 are driven by the same trait (aversion to layered uncertainty).  
         - This trait violates reduction (indifference to compound/simple equivalence).  
         - Framing (past/future ambiguity) doesn’t shift attitudes (Choice 3).  
      2. **What it suggests but doesn’t prove:**  
         - Ambiguity aversion is *not* about information quality but about cognitive discomfort with unresolved stages.  
         - Rationality debates: Is this aversion defensible? (Activity is silent; facilitator notes normative vs. descriptive views).  
      3. **What’s missing (facilitator must add):**  
         - The activity assumes students treat Urn A as having expected 50% red (empirical regularity; flag as testable).  
         - Real-world ambiguity often involves *unknowable* probabilities (e.g., climate events), not just hidden ones.  

  ---

  ### **Predictable Problems & Mitigations**  
  1. **Early Reveal by Savvy Students:**  
     - *Risk:* A student says, "This is about compound lotteries!" during aggregation.  
     - *Mitigation:* "Hold that thought—let’s see everyone’s data first." Redirect to audit phase.  

  2. **Probability Misinterpretation:**  
     - *Risk:* Students assume Urn A has ≠50% red or distrust the coin.  
     - *Mitigation:* Stress: "Urns K1/K2 are identical to K; coin is fair; Urn A has no info." If challenged: "Assume expected 50% for Urn A if needed—we’re testing reactions."  

  3. **Incentive Distortions:**  
     - *Risk:* Token system encourages risk-seeking for prizes.  
     - *Mitigation:* Use a prize with flat utility (e.g., book) and random bet selection.  

  4. **Choice Inconsistencies:**  
     - *Risk:* A student chooses 1A (rejects two-stage) but 2B (prefers ambiguity), breaking the correlation.  
     - *Handling:* Acknowledge outliers: "Most of you showed a pattern—let’s discuss why some didn’t."  

  5. **Time Shortfall:**  
     - *Risk:* Aggregation takes >20 min.  
     - *Can’t Design Around:* Pre-fill dummy data for 8 seats as a fallback.  

  **Unavoidable Limitations:**  
  - Small sample size (n=16) may weaken correlation visibility.  
  - The design assumes students compute compound probabilities correctly (test with a pre-check question if time allows).  
  - Facilitator must verbally distinguish between "ambiguity as lack of knowledge" and "ambiguity as fundamental uncertainty"—the activity blurs these.  

  ---

  **Why This Design Wins:**  
  It weaponizes familiarity—students expect to "see ambiguity aversion again" but instead uncover their own inconsistency between known-risk and compound bets. The self-audit makes the violation visceral, and the secondary insight (Choice 3) slots in cleanly without distraction. By the end, they *feel* the reduction principle’s failure before it’s named.
