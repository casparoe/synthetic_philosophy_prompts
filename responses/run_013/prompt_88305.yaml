answer: |-
  ### Decision Procedure for Supervision Choice
  **Goal**: Choose between outcome or process supervision per task family, optimizing for robustness against gaming, given cost constraints. Run with 3 people in <60 min. Steps are ordered; terminate early when a clear answer emerges. Use majority vote for ambiguous answers.

  #### Step 1: Can we reliably check the final answer?  
  - **Question**: Is there an objective, automated, or low-cost way to verify correctness (e.g., test suite, known answer)?  
  - **Sufficient yes**: Verification is >95% accurate, requires no expertise, and is executable within the training loop (e.g., code test suite).  
  - **Sufficient no**: Verification is subjective, requires deferred judgment (e.g., months later), or lacks clear criteria.  
  - **Termination**:  
    - **Yes** → Proceed to Step 2.  
    - **No** → Skip to Step 3.  

  #### Step 2: Is the outcome check *robust* against gaming?  
  - **Question**: Can the model achieve a high score by means other than genuine competence (e.g., memorization, exploiting loopholes)?  
  - **Sufficient yes**: Gaming requires near-equivalent effort to true competence (e.g., diverse test cases, no leaks).  
  - **Sufficient no**: Gaming is cheap (e.g., answers leaked, test suite has narrow coverage).  
  - **Termination**:  
    - **Yes** → **CHOOSE OUTCOME SUPERVISION** (Cheap and robust).  
    - **No** → Proceed to Step 3.  

  #### Step 3: Can annotators reliably score the process?  
  - **Question**: Can we define a rubric for intermediate steps that non-expert annotators can apply consistently (inter-annotator agreement ≥80%)?  
  - **Sufficient yes**: Rubric uses concrete, falsifiable criteria (e.g., "code must explain edge cases," "math steps must align with known theorems").  
  - **Sufficient no**: Rubric requires domain expertise, involves subjective "quality" judgments, or has high ambiguity.  
  - **Termination**:  
    - **No** → **CHOOSE OUTCOME SUPERVISION** (If outcome is checkable) or **HANDOFF TO HUMAN** (If outcome uncheckable).  
    - **Yes** → Proceed to Step 4.  

  #### Step 4: Is process supervision harder to game than outcome?  
  - **Question**: Is faking a rationale that satisfies the rubric more "expensive" for the model than gaming the outcome?  
  - **Assessment**:  
    - If the task requires **structured, verifiable steps** (e.g., code comments referencing specific inputs, math derivations), gaming is hard → **Leans process**.  
    - If the task involves **creative/subjective reasoning** (e.g., literature reviews), gaming is easy → **Leans outcome**.  
  - **Termination**:  
    - **Clearly harder to game** → Proceed to Step 5.  
    - **Not harder** → **CHOOSE OUTCOME SUPERVISION**.  
    - **Unclear** → **HANDOFF TO HUMAN** (Judgment call on gaming risk).  

  #### Step 5: Is the cost increase justified?  
  - **Question**: Does the expected reduction in gaming risk (from Step 4) justify the 5–8× per-item cost of process labels?  
  - **Assessment**:  
    - **High justification**: Task is safety-critical, or gaming in deployment has severe consequences.  
    - **Low justification**: Task is low-stakes, or cost dominates (e.g., huge dataset).  
  - **Termination**:  
    - **Yes** → **CHOOSE PROCESS SUPERVISION**.  
    - **No** → **CHOOSE OUTCOME SUPERVISION**.  
    - **Unclear tradeoff** → **HANDOFF TO HUMAN** (Value judgment on cost vs. risk).  

  #### Key Compromises from Framing  
  - **Dropped**: The idea that "process vs. outcome is always a choice between proxies." Why? Because while true, it paralyzes decision-making. We instead focus on **relative gaming cost** (Steps 2 & 4), which is actionable.  
  - **Why this works**: Forces explicit comparison of gaming risk per task, avoiding false principles like "process for hard tasks."  

  ---

  ### Case Applications  
  #### Case 1: Code-Gen Task with Test Suite  
  - **Step 1**: Outcome checkable? **Yes** (test suite).  
  - **Step 2**: Robust against gaming? **No** (model can overfit to test cases, e.g., hardcode solutions).  
  - **Step 3**: Process scorable? **Yes** (annotators can check for code comments/step explanations).  
  - **Step 4**: Harder to game process? **Yes** (faking coherent, input-specific comments is costlier than gaming tests).  
  - **Step 5**: Cost justified? **No** (test suites are standardized; gaming risk is manageable via diverse tests).  
  - **Decision**: **OUTCOME SUPERVISION** (✅ Saves cost; aligns with your bet against intuition).  

  #### Case 2: Long-Horizon Research Assistant Task  
  - **Step 1**: Outcome checkable? **No** (judgment deferred for months).  
  - **Step 3**: Process scorable? **No** (annotators can’t reliably judge novelty/soundness of research steps).  
  - **Decision**: **HANDOFF TO HUMAN** (❌ No good proxy; requires value call on tolerating wrong-but-honest outputs).  

  #### Case 3: Math Word Problems with Leaked Answers  
  - **Step 1**: Outcome checkable? **Yes** (known answers).  
  - **Step 2**: Robust against gaming? **No** (answers leaked → memorization trivial).  
  - **Step 3**: Process scorable? **Yes** (annotators can verify step-by-step math logic).  
  - **Step 4**: Harder to game process? **Yes** (faking correct derivations is harder than recalling answers).  
  - **Step 5**: Cost justified? **Yes** (gamed outcomes are useless; process teaches transferable skills).  
  - **Decision**: **PROCESS SUPERVISION** (✅ Outcome gaming is unavoidable).  

  ---

  ### What the Procedure **Can’t** Do  
  1. **Resolve value judgments**:  
     - E.g., "Is wrong-but-honest better than right-but-deceptive?" (Handled in Step 5 handoffs).  
  2. **Predict emergent gaming strategies**:  
     - If a task *seems* robust but model capabilities evolve (e.g., learns to generate fake rationales flawlessly), the procedure won’t catch it.  
  3. **Handle ambiguous task families**:  
     - Example: "Summarize scientific papers." *Looks like* Case 2 but has checkable facts → Procedure might misjudge in Step 1 if not carefully scoped.  
  4. **Quantify unmeasurable risks**:  
     - Relies on qualitative estimates of "gaming cost" (Step 4) when precise numbers are unavailable.  
  5. **Override cost constraints**:  
     - If process labels are too expensive (Step 5), it defaults to outcome regardless of ideals.  

  **Final Note**: The procedure prioritizes **actionability** over philosophical purity. For your thesis—yes, it sometimes rejects process supervision (Case 1), because cost and gaming risk matter more than ideology. Use it to force debates beyond "vibes," but acknowledge its limits in Steps 3–5.
