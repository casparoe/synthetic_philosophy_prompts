          Actually, the procedure in Step 3 says: 
            - If no: Terminate and choose **OUTCOME SUPERVISION** (if the outcome is at least checkable) OR if not, then we have a problem that leads to Step 5.

          Since the outcome is not checkable, we go to Step 5.

