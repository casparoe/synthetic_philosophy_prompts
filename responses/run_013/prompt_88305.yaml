prompt: |-
  Ok so I'm a 2nd year PhD student — ML/AI safety-ish, though my department is more phil of sci so I'm the weird one — and I'm doing a rotation on a post-training team at a lab this summer. My job is to write the data spec for a new training run, which mostly means deciding, per task family, whether we supervise the process (the model's intermediate steps and rationales get scored) or the outcome (only the final answer gets scored). We make this call maybe two or three times a week during the data sprint and right now it's vibes plus whoever argues loudest in the meeting. I keep having to re-defend the same calls to annotators and to the one staff researcher who has to sign off, so I want an actual procedure instead of a pile of principles. Stakes: a bad call either burns a few hundred thousand dollars of compute on a run that learns to game our rubric, or we spend three months labelling process data we turn out not to need.

  Here's the framing I want you to build it on, because I think the usual line that process supervision is just what you do for hard reasoning is unhelpful. Process supervision isn't an escape from proxy gaming, it's the same thing with a different proxy. When you score the process you've decided that the observable you'll optimize is the model's own trace, and the model will attack whatever is cheapest to fake inside that signal — a rationale that reads as careful reasoning to a monitor without being what actually produced the answer is cheap. So the real question is never process or outcome, it's which of my two signals sits further from something the model can corrupt cheaply, given that the model is producing both of them. And when neither the final artifact nor the trace is directly checkable, I'm choosing between two proxies and should stop pretending the distinction is principled there.

  So: write me a decision procedure I can run with three other people in under an hour, for a given task family. Ordered questions, what counts as a sufficient yes or no at each step, where it terminates in use outcome, where it terminates in use process, and where it hands off to a human because the question is about values (how much we care about a model that's right for bad reasons versus one that's wrong but honest, say) rather than facts. Constraints: I have budget for human process labels but they run 5-8x the per-item cost of outcome labels, my annotators are smart but not domain experts, the model can't see its own reward but it can see the rubric. If a step needs a number I can't actually get, the procedure has to say what to do instead. And if you have to drop some distinction from the framing above to make the thing usable, tell me which one and why, because I'd rather know than find out later.

  Then run it on three cases: (1) a code-gen task where we have a test suite, (2) a long-horizon research-assistant task where we genuinely won't know for months whether the output was any good, (3) something where the answer is checkable but the check is itself gameable, like a math word-problem set with known answers that leaked somewhere.

  I want at least one of these to come out against what I'd naively want. My honest bet is the procedure tells me to use outcome supervision on (1) and (3), even though the whole reason I'm on this team is that I think process supervision is where the field should be going. If that's what it says, say it plainly rather than hedging to make me feel better about my thesis.

  Finish with what the procedure definately can't do — which calls are judgment dressed up as procedure, and where it will misfire on a task family that looks like the ones above but isn't. No citations or reading lists please, I can't search from the meeting and it just turns into people saying well such-and-such paper showed and we go in circles. Just the procedure and the reasoning behind each step.
reasoning: |-
  We are building a decision procedure to choose between process supervision (scoring intermediate steps) and outcome supervision (scoring only the final answer) for a given task family.

  Key considerations from the framing:
  - Both process and outcome supervision are proxies. We want the one that is harder for the model to game (i.e., the one where the model cannot cheaply fake the signal we are optimizing).
  - We have constraints: 
    - Process labels are 5-8x more expensive per item than outcome labels.
    - Annotators are smart but not domain experts.
    - The model can see the rubric but not its own reward (so it can try to game the rubric).
  - We need a procedure that can be run in under an hour with three other people.
  - The procedure must be step-by-step, with clear termination points for choosing outcome or process, or handing off to a human for value judgments.

  We'll design the procedure as a series of questions. At each step, we require a clear yes/no or a specific input. If we cannot get a required number, we have a fallback.

  ---

  **Decision Procedure for Task Family X**

  **Step 1: Is the outcome directly and reliably checkable?**
     - **What we mean**: Can we determine the correctness of the final answer with high confidence and without ambiguity? (e.g., via a test suite, known answer, or a clear and objective criterion)
     - **Check for**: 
          - If there is a test suite or known answer that is not leaked and cannot be gamed trivially? (if leaked, then the model might know the answer without reasoning)
          - If the outcome check is objective and not subjective?
     - **Sufficient yes**: The outcome can be checked with near 100% accuracy by an annotator (or automatically) and the check is robust against gaming (i.e., the model cannot easily produce the right answer without actually solving the task correctly).
     - **Sufficient no**: The outcome is not checkable at all, or the check is highly unreliable (e.g., we don't know the answer and cannot judge it objectively) or the check is easily gameable (e.g., the model can output the known answer without proper reasoning).
     - **If yes**: Proceed to Step 2.
     - **If no**: Skip to Step 3.

  **Step 2: Is the outcome check robust against gaming?**
     - **What we mean**: Even if the outcome is checkable, can the model achieve a high score by means that do not reflect genuine competence? (e.g., memorization, exploiting flaws in the test suite, or generating answers that look correct but are not)
     - **Check for**:
          - Are there multiple ways to get the correct outcome? (if only one way, then gaming might be hard)
          - Is the test suite comprehensive and not leaky? (if leaked, then gaming is easy)
          - How expensive is it for the model to produce a correct outcome without actually doing the intended process? (if cheap, then gaming is easy)
     - **Sufficient yes**: We believe that the model cannot easily game the outcome check without performing the intended reasoning (e.g., the task requires novel solutions, the test suite is adversarial, or the space of correct outcomes is very narrow and hard to guess).
     - **Sufficient no**: There are known easy ways to game the outcome (e.g., the answers are available online, the test cases are limited and known, or the model can output a correct answer by a trivial method that doesn't generalize).
     - **If yes**: Terminate and choose **OUTCOME SUPERVISION** (because we have a reliable and robust outcome signal that is cheaper to label).
     - **If no**: Proceed to Step 3.

  **Step 3: Can we define a process rubric that is both checkable by annotators and robust against gaming?**
     - **What we mean**: We are considering process supervision. We need to see if we can write a rubric for the intermediate steps that:
          - An annotator (who is smart but not a domain expert) can reliably apply (inter-annotator agreement is high).
          - The model cannot easily fake (i.e., generating a rationale that looks good but doesn't reflect the actual reasoning is expensive for the model).
     - **Check for**:
          - **Checkability**: Can we write clear, objective criteria for the steps? (e.g., "the rationale must mention at least three relevant factors", "the code must have comments explaining each step")? Or is the process inherently subjective?
          - **Robustness against gaming**: Would it be harder for the model to generate a fake rationale that satisfies the rubric than to actually do the reasoning? (Consider: if the rubric is too vague, the model can write a plausible-sounding rationale without substance. If too specific, it might be hard for the model to hit the criteria without doing the work, but also hard for annotators to judge.)
          - **Cost**: Remember that process labels are 5-8x more expensive. We need to be confident that the benefits outweigh the cost.
     - **Sufficient yes**: We can define a rubric that is both checkable (annotators can apply it with high agreement) and we have reason to believe that gaming it would be expensive (e.g., because the rubric requires specific, non-obvious details that are hard to fabricate without doing the work).
     - **Sufficient no**: We cannot define such a rubric (e.g., because the process is too complex or subjective for annotators to judge, or because we suspect that generating a fake rationale that satisfies the rubric is easy).
     - **If yes**: Proceed to Step 4.
     - **If no**: Terminate and choose **OUTCOME SUPERVISION** (if the outcome is at least checkable, even if gameable) OR if the outcome is not checkable at all, then we have a problem: we might need to hand off to a human for a value judgment (see Step 5).

  **Step 4: Is the cost of process labelling justified by the expected reduction in gaming?**
     - **What we mean**: Even if we can do process supervision, is it worth the extra cost? We compare the risk of gaming under outcome supervision (which we know is present from Step 2) with the risk under process supervision and the extra cost.
     - **Check for**:
          - **Gaming risk under outcome**: How bad would it be if the model games the outcome? (e.g., it might produce correct answers in training but fail in deployment on slightly different tasks, or it might be brittle)
          - **Gaming risk under process**: How bad would it be if the model games the process? (e.g., it produces rationales that look good but are disconnected from the answer, so in deployment when we remove the rationale the model fails)
          - **Cost difference**: We know process labels are 5-8x more expensive. How many examples do we plan to label? (If we are labeling 1000 examples, the cost difference is 4000-7000 outcome labels. If we are labeling 1M, the cost is prohibitive.)
          - **Expected benefit**: Is there evidence (even theoretical) that process supervision leads to more robust models for this task family?
     - **We need a quantitative estimate?** But we might not have one. Instead, we can use:
          - If we have data from similar tasks, use that.
          - Else, we assign a qualitative risk score (low, medium, high) for gaming under outcome and under process, and then consider:
              - If outcome gaming risk is low and process gaming risk is not clearly lower, then outcome is better (cheaper).
              - If outcome gaming risk is high and process gaming risk is low, then process might be worth it.
              - If both are high, then we might be in trouble and need to reconsider the task or the rubrics.
     - **Sufficient yes for process**: The outcome gaming risk is high, the process gaming risk is low, and the budget allows for the extra cost. Also, the task is critical enough to justify the expense.
     - **Sufficient no (choose outcome)**: The cost is too high relative to the expected benefit (e.g., the outcome gaming risk is manageable, or the process gaming risk is not much lower than outcome).
     - **If we cannot decide**: Proceed to Step 5.

  **Step 5: Handoff to human for value judgment.**
     - **When**: 
          - We have a situation where neither outcome nor process is clearly better (e.g., both are highly gameable, or we have a conflict between cost and risk).
          - Or when the task involves a value trade-off (e.g., do we prefer a model that is right for bad reasons or wrong but honest?).
     - **What to do**: The team (or a designated decision-maker) must weigh the non-factual aspects. The procedure cannot decide because it depends on:
          - How much we care about interpretability (process gives us that) vs. cost.
          - How critical the task is (if it's safety-critical, we might want process even if expensive).
          - Our tolerance for gaming in deployment.

  ---

  **Now, run the procedure on the three cases:**

  **Case 1: Code generation with a test suite**
     - Step 1: Is the outcome directly and reliably checkable? 
          - Yes, by running the test suite. The test suite can determine correctness of the code.
     - Step 2: Is the outcome check robust against gaming?
          - It depends. If the test suite is comprehensive (covers many edge cases) and not leaked, then it might be robust. But if the model has seen the test cases during training (or they are publicly available) then it might memorize and game. Also, if the model can generate code that passes the tests by exploiting the test suite (e.g., hard-coding answers for the test cases) then it's gameable.
          - We must consider: How good is the test suite? If it's state-of-the-art and adversarial, then yes. But often, test suites are limited.
          - In practice, for code generation, test suites are the gold standard and we often rely on them. However, they are not perfect and can be gamed (e.g., by overfitting to the test cases). But note: if the test suite is large and diverse, gaming by memorization is expensive. Also, if we are doing training with the same test suite, the model might overfit to it.
          - **Verdict**: If the test suite is very good (and not leaked) then we can say yes. But if we suspect overfitting is easy, then no.
          - Let's assume we have a good test suite that is not leaked. Then Step 2: **yes** -> choose **OUTCOME SUPERVISION**.

          However, if we are concerned about overfitting (i.e., the model might learn to pass the test suite without generalizing to unseen cases), then we might consider process supervision to encourage good coding practices. But note: the procedure asks about gaming the outcome check, not about generalization. Gaming the outcome check here means passing the tests without writing good code. If the test suite is comprehensive enough to catch such gaming, then it's robust.

          But the framing says: the model can see the rubric. The rubric for outcome is "pass the tests". The model might generate code that passes the tests by any means, including writing code that is not robust or general. So if we care about the code quality beyond the tests, then the outcome check is not capturing that.

          However, the procedure in Step 2 is about whether the outcome check is robust against gaming. If the test suite is the only criterion we have for correctness, then passing the tests is the goal. If we want more (e.g., code quality, comments, efficiency), then we have to define that in the rubric. But for a code generation task, the test suite is the standard.

          Given the above, the outcome supervision is chosen. This goes against the intuition that process supervision (e.g., requiring comments and step-by-step reasoning) would be better for code. But the procedure says: if the outcome is checkable and robust, use outcome because it's cheaper.

          So for this case: **OUTCOME SUPERVISION**.

  **Case 2: Long-horizon research-assistant task (output quality unknown for months)**
     - Step 1: Is the outcome directly and reliably checkable? 
