     - Case 3 (math word problems): **PROCESS SUPERVISION**

  ---

  **What the procedure definitely can't do:**

  1. **Handle tasks where both outcome and process are uncheckable**: In such cases, we hand off to human (Step 5). But the human might not have a good answer either.

  2. **Quantify gaming risk precisely**: We use qualitative judgments. This is a gap, but without data we cannot do better.

  3. **Account for future generalization**: The procedure focuses on gaming during training on the given task. It does not directly address whether the learned behavior will generalize to new tasks. That is left to the human in Step 5 if necessary.

  4. **Deal with tasks where the process is inherently unobservable**: For example, if the model's internal reasoning is opaque and we are relying on the rationale it produces, we are trusting that the rationale reflects the process. The procedure assumes that the process signal is the rationale the model outputs.

