prompt: |-
  I'm three weeks into a seminar on animal ethics, and the section on wild animals has left me with a list of gut verdicts that I can't get under a single heading. I've been keeping the list on my phone, and it runs roughly as follows. A fawn is being swept down the river behind my parents' house: I wade in and pull it out, and I'd think someone who let it drown to save their shoes had something wrong with them. A fox has been sleeping under the shed all spring with mange and a weeping sore on its flank: I trap it, drive it to the vet, pay for the antibiotics, and feel entirely fine about it. But in a hard February, when the deer in the woods behind us are visibly starving and I could put out hay for the price of a takeaway, I don't — and I have a fairly firm sense that I shouldn't, that I'd be propping up animals who are going to die anyway and dragging next spring's population up past what the woods can carry. A hawk has decided that my bird feeder is a buffet; I could net it or move it and I don't, and taking the squirrels' side against a hawk feels like a betrayal, even though a squirrel's death is no prettier than the fawn's would have been. Yet a hedgehog that turns up in the garden crawling with ticks and fly-strike goes straight to the vet, and if I could pick an eye-worm out of a finch's eye I would, without hesitating — even though in both of those cases I am killing the creatures that are eating the animal I'm rescuing. I should also admit that a mouse in the kitchen gets a trap without a flicker of what I feel about the fawn, and that when I say my own convenience doesn't enter into any of this, I'm not sure I believe myself.

  So the pattern seems to be: accidents and disease, yes; starvation, no; a proper predator, no; a parasite, yes; and my own convenience, apparently, whenever it suits me. The best principle I've managed is something like: I may relieve suffering that isn't doing anyone any good, but I mustn't take sides between two animals who are each pursuing their own good, and I mustn't do anything that turns a wild animal into a dependent. That doesn't survive the fawn (the river isn't pursuing anything, but then neither is the winter), and it doesn't explain why the tick loses its case and the hawk wins.

  A friend in the same seminar thinks I'm fiddling while Rome burns. She wants to drop the fawn business and fund a contraceptive bait programme instead, on the grounds that nearly every wild animal born dies young and dies badly, so the humane move is to have fewer of them born rather than to rescue the photogenic ones. My gut says the fawn and her programme differ in kind, but I can't say why, and I suspect it may only be that one is a photograph and the other is a spreadsheet. Is there a principle that gets my list, or close to it? If no single principle does, I'd rather be told which verdict has to go, what the repaired principle says about my friend's programme, and what it says about the case I keep dodging: the pond behind the barn that dries out every June with a few thousand tadpoles in it, which I could keep topped up with a hose.
reasoning: |-
  Okay, let me try to unpack this user's ethical dilemma. They've presented a list of conflicting gut reactions about intervening with wild animals, and they're struggling to find a consistent principle. 

  First, I notice the user is clearly thoughtful and self-aware - they recognize their own contradictions (like saving fawns but trapping mice) and even question their motives. The pond tadpole example at the end feels like a test case they've been avoiding. 

  Hmm... their current attempted principle fails on multiple fronts. The "suffering that isn't doing anyone any good" idea collapses when comparing winter starvation (natural) vs mange (natural). And the "not taking sides" rule explains the hawk-squirrel dilemma but fails with parasites. 

  *scratches head* What's really different about parasites? Maybe because they're not moral agents? But then neither is a river... 

  Ah! The dependency angle is stronger. When they help the fawn or hedgehog, it's a one-time intervention returning them to independence. But feeding deer in winter creates recurring dependence. That holds up surprisingly well across cases - even explains why the contraceptive program feels different (it prevents future suffering without creating dependents). 

  *checks notes* The tadpole pond... that's tricky. Topping it up would create dependency if done regularly, but what if it's just once? The user's own principle would allow it as a temporary rescue like the fawn. But they might feel uneasy - rightly so - because unlike the fawn, this could become an annual obligation. 

  *realizes* The friend's contraceptive program actually avoids this dependency problem entirely. The user's resistance to it might indeed be the "spreadsheet vs photograph" bias they suspect. 

  *considers* Should I point out their mouse exception? Yes - it shows human spaces create different ethical rules. That's consistent with how most ethicists view domicile pests. 

  Ultimately their gut reactions mostly hold up under a "minimal intervention" framework. The winter feeding is the real outlier they might need to reconsider - or perhaps reframe as ecologically harmful rather than just creating dependents. 

  The pond... I'll suggest it's permissible but warn about dependency risks. And acknowledge that even with principles, these remain hard choices with reasonable disagreement.
answer: |-
  Your list reveals a nuanced, ecologically-aware conscience wrestling with the core tension in wild animal ethics: *individual compassion vs. systemic responsibility*. Your gut verdicts aren't arbitrary; they point toward a coherent, if complex, principle. Let's break it down.

  **The Principle: Minimal Intervention for Acute Harm Caused by Non-Integrated Agents**

  This principle attempts to unify your list:

  1.  **"Minimal Intervention":** You act decisively only when intervention is brief, targeted, and doesn't create long-term dependence or alter natural processes significantly (e.g., pulling out the fawn, treating the hedgehog *once*). You avoid ongoing, ecosystem-altering actions (e.g., feeding deer all winter).
  2.  **"Acute Harm":** You intervene against severe suffering *happening now* that is exceptional or unnatural *in its immediacy* (drowning, grotesque parasitic infestation, open wound) rather than chronic, systemic suffering inherent to wild existence (starvation in winter, predation).
  3.  **"Caused by Non-Integrated Agents":** This is key. You intervene when the *source* of harm is:
      *   **Non-Agentive:** A force of nature without goals or interests (the river, disease pathogens, parasites).
      *   **Not Integrated into the Local Ecological Narrative:** The harm originates from an external, disruptive source not part of the established predator-prey or competitive dynamics of that ecosystem. Ticks and eye-worms aren't "pursuing their good" *within the meaningful ecological story* of the hedgehog or finch in the way the hawk is pursuing its good *within* the predator-prey story of the feeder. Humans (and their structures like rivers altered by development, or introduced diseases) often *are* this disruptive source.

  **Applying the Principle to Your Cases:**

  *   **Fawn in River (Yes):** Acute harm (drowning) *now* caused by a non-agentive force (river). Intervention is minimal (one rescue) and doesn't create dependence. *(The river isn't "pursuing" anything, fitting "non-integrated agent").*
  *   **Fox with Mange/Sore (Yes):** Acute harm (painful disease, open wound) *now*. Mange is often exacerbated by human-altered environments (causing stress, concentration). Intervention is targeted (one treatment). Aim is to return fox to independence.
  *   **Starving Deer (No):** Harm (starvation) is chronic, systemic, and inherent to the seasonal cycle and population dynamics. Intervention (feeding) is ongoing, alters natural selection and carrying capacity, creates dependence, and harms the ecosystem long-term.
  *   **Hawk at Feeder (No):** Harm (predation) is caused by an agent (hawk) *actively pursuing its own good* and fully integrated into the local ecological narrative (predator-prey). Taking sides disrupts this fundamental process. *(Your "betrayal" feeling captures this ecological role recognition).*
  *   **Hedgehog with Parasites / Finch with Eye-worm (Yes):** Acute harm *now* caused by non-agentive parasites. Parasites aren't morally relevant agents "pursuing their good" in a way that creates a conflict needing neutrality; they are pathogens causing suffering. Removal is targeted relief of acute suffering without altering broader ecological roles. *(The tick "loses" because it's a pathogen, not a fellow ecological protagonist).*
  *   **Mouse in Kitchen (Yes - Trap):** This falls under a *different, justifiable principle*: **Defending Human Domicile.** Your home is a human-created space where exclusion of pests for hygiene/safety is ethically distinct from interventions in the wild. This isn't hypocrisy; it's recognizing different spheres of obligation.
  *   **Your Convenience:** You're right to be suspicious. The principle *should* minimize this. Does letting the hawk hunt *really* avoid inconvenience? Maybe partly. Be vigilant, but the core principle holds weight independently.

  **Addressing the Fawn vs. Contraceptive Programme:**

  *   **Fawn:** Fits the principle – acute, non-agentive harm, minimal intervention.
  *   **Contraceptive Programme:** This is **fundamentally different** and your gut is correct. It's not about rescuing individuals from acute harm *now*, but about *preventing future suffering* by managing population size *systemically*. It addresses the root cause of much wild animal suffering (overpopulation leading to starvation, disease, predation pressure) without creating individual dependents. It *aligns* with the "systemic responsibility" side of the tension your principle navigates. Your "spreadsheet vs. photograph" suspicion is astute – the programme lacks the immediate emotional pull but addresses suffering on a vastly larger scale. **The principle doesn't reject it; it operates on a different level.** It's a *complementary* strategy focused on prevention rather than acute rescue.

  **The Dodged Case: The Tadpole Pond**

  *   **Applying the Principle:**
      *   **Acute Harm?** Yes, desiccation is acute and fatal.
      *   **Caused by Non-Integrated Agents?** The drying pond *could* be natural seasonal variation (part of the ecosystem) OR significantly worsened by human activity (drainage, climate change altering rainfall). This is crucial.
      *   **Minimal Intervention?** Topping up *once* with a hose is arguably minimal. But *if* it becomes necessary every year due to human-caused change, it risks:
          *   **Creating Dependency:** Tadpoles evolving to rely on your intervention.
          *   **Altering Ecosystem:** Preventing natural population control via drought, potentially boosting populations unsustainably or favoring species less adapted to natural cycles.
          *   **Not Truly Minimal:** Becomes an ongoing obligation.

  *   **Verdict:** It's *permissible* under the principle **only if**:
      1.  The drying is **primarily unnatural** (e.g., caused by a new drainage ditch on your property).
      2.  You intervene **minimally** (perhaps *one* top-up at the critical moment, not sustaining the pond artificially all summer).
      3.  You **avoid making it an annual dependency**.

      If the drying is largely natural, the principle suggests **not intervening**. The suffering, while acute for individuals, is part of the natural population regulation for that species and ecosystem. Letting it happen aligns with the "systemic responsibility" aspect and avoids creating dependency.

  **Which Verdict Might Need Reconsideration?**

  The principle largely validates your instincts. The strongest tension is with **"my own convenience."** Does letting the hawk hunt *truly* stem from respecting ecological roles, or is avoiding the hassle of moving the feeder a factor? Be rigorously honest here. If convenience *is* a factor in *not* netting the feeder (protecting squirrels), it weakens the ecological justification slightly, though the core "don't take sides" argument remains powerful.

  **Conclusion:**

  Your gut verdicts are remarkably consistent with an ethic of **"Compassionate Non-Interference with Minimal Exceptions."** The core principle prioritizes:

  1.  **Non-Interference** with natural processes (predation, starvation cycles, natural disasters).
  2.  **Minimal Exceptions** for **Acute Suffering** caused **Immediately** by **Non-Agentive or Non-Integrated Sources** (accidents, grotesque parasitic/disease burdens *if treatable*), provided intervention is truly **Minimal** and **Non-Dependency-Creating**.

  Your friend's contraceptive programme isn't contrary to this; it's a separate, systemic strategy addressing the *source* of suffering your principle navigates around. The tadpole pond is ethically fraught – intervene only if human actions caused the unnatural severity, and even then, do the absolute minimum. Embrace the complexity; a single, perfectly clean principle is elusive in wild animal ethics. Your thoughtful struggle *is* the sign of a developed ethical sense grappling with a messy reality.
