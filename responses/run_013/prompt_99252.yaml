prompt: |-
  I am preparing a position statement for a graduate seminar on epistemic value and would like a consistency audit before I circulate it. The package I intend to defend is this:

  (1) Knowledge is more valuable than mere true belief, and the difference is not incidental; it is part of what knowledge is for.
  (2) The value of knowledge is instrumental: knowledge is valuable because it is a more reliable guide to action than true belief.
  (3) True belief is sufficient for successful action. Once a belief is true, adding justification, warrant, or a no-false-lemmas condition does not make the agent more likely to succeed in what she does.
  (4) The Meno problem is a problem about differential value: what needs explaining is the value of the difference between knowledge and true belief, not the value of knowledge as a whole.
  (5) What explains the differential value is stability: knowledge survives counterfactual challenge and revision better than mere true belief.
  (6) Knowledge requires a no-false-lemmas condition, so a true belief that is reliably formed but rests on a false intermediate premise is not knowledge.
  (7) Epistemic value is monistic: all epistemic value derives from the value of true belief and the disvalue of false belief. There is no independent epistemic value in justification, coherence, or cognitive achievement as such.
  (8) Understanding is a species of knowledge, and it is more valuable than knowledge because it is more explanatory.
  (9) Knowledge is the norm of practical reasoning: it is appropriate to act on what one knows, and inappropriate to act on what one merely believes truly.

  I suspect that some of these are in tension, but I cannot see where the fault lines lie. Please audit the set. Which pairs are genuinely in tension, which only appear to be, and how severe is each genuine tension? Rank the genuine tensions by severity. For each, say what would have to give and what the cheapest revision would be. Then tell me which single revision would remove the most tension. I am not asking for a literature review, citations, or a survey of positions; I want the internal structure of this position and a verdict on whether it hangs together.
reasoning: |-
  Okay, let me tackle this consistency audit for the user's position statement on epistemic value. The user has outlined nine distinct theses and wants to know where internal tensions lie. 

  First, I need to map the logical relationships between these claims. The core tension points seem to radiate from three anchors: the instrumental value thesis (2), the sufficiency of true belief for action (3), and the monism about epistemic value (7). 

  Starting with the most glaring conflict: How can knowledge be more instrumentally valuable than true belief (2) if true belief alone suffices for successful action (3)? This seems like direct contradiction. The user's stability solution (5) attempts to bridge this, but stability feels like a separate virtue rather than an instrumental advantage. If I were in the user's position, I'd consider reframing "successful action" to include long-term reliability rather than single-instance success.

  Then there's the monism claim (7) butting against multiple other points. If all value derives only from truth/falsity, how can understanding be more valuable than knowledge (8)? And how does the no-false-lemmas requirement (6) add value under this monistic view? The user might need to either soften monism or explain these as instrumental extensions of truth value.

  The no-false-lemmas condition (6) also puzzles me in this framework. If justification adds no extra success probability (3), why exclude beliefs with false lemmas? The user's stability argument (5) could justify this if false-lemma beliefs are less stable - that's a possible salvage path.

  For understanding's superior value (8), the user must show how explanatory power reduces to truth-conduciveness under monism (7). Maybe by arguing understanding generates more true beliefs? Otherwise this threatens to break the monistic framework.

  The normativity claim (9) actually fits surprisingly well with the instrumental value thesis (2), creating a coherent action-guiding picture. But it slightly strains against claim (3) - if true belief suffices, why demand knowledge for appropriate action? The user could resolve this by distinguishing sufficiency from appropriateness.

  Looking at severity, the instrumental-value-vs-sufficiency clash feels most acute because it undermines the core Meno solution. Next would be the monism-understanding tension, then the monism-no-false-lemmas issue. The cheapest fix might be redefining "successful action" to include resilience, which would simultaneously ease the main tension and support the stability thesis.

  If the user makes only one revision, I'd recommend overhauling claim (3) to allow that true belief suffices for isolated actions while knowledge provides systemic reliability. This would preserve most of the package while eliminating the sharpest contradiction.
answer: |-
  Here’s a consistency audit of your position, ranked by severity of tension, with diagnoses and solutions. The core tensions stem from **instrumental value claims conflicting with monism** and **the sufficiency of true belief for action undermining knowledge's added value**.

  ### 🚩 **Severity Rank 1: Critical Tension**  
  **Conflict:** (2) vs. (3) + (7)  
  - **Tension:** (2) claims knowledge is *instrumentally* more valuable than true belief because it’s a "more reliable guide to action." But (3) states that once a belief is true, justification/warrant adds **nothing** to success in action. (7) further restricts all epistemic value to truth/falsity, denying independent value to reliability.  
  - **Why severe?** (3) directly negates (2)’s instrumental advantage. If true belief is *sufficient* for successful action (per 3), and all value is truth-monistic (per 7), knowledge’s "reliability" can’t add instrumental action-guiding value.  
  - **Cheapest revision:** Modify (3) to:  
    *"True belief is sufficient for successful action *in the actual world*, but knowledge is more reliable *across counterfactual scenarios*."*  
    This preserves your stability thesis (5) and justifies (2)’s instrumentalism via resilience.  

  ### 🚩 **Severity Rank 2: Major Tension**  
  **Conflict:** (7) vs. (8)  
  - **Tension:** (7) asserts all epistemic value reduces to true belief/false belief (monism). But (8) claims understanding is *more valuable than knowledge* due to explanatory power—implying non-truth-conditional value.  
  - **Why severe?** Explanatory power isn’t reducible to truth-conduciveness (e.g., a list of true non-explanatory beliefs). If understanding is more valuable *as such*, (7) is false.  
  - **Cheapest revision:** Reinterpret (8) within (7):  
    *"Understanding is a species of knowledge that *organizes more true beliefs* (e.g., general laws), making it *instrumentally* more valuable for generating further true beliefs."*  
    This retains (8)’s hierarchy but grounds it in truth-monism.  

  ### ⚠️ **Severity Rank 3: Moderate Tension**  
  **Conflict:** (3) vs. (6)  
  - **Tension:** (3) says adding justification/no-false-lemmas doesn’t improve success in action. But (6) requires no-false-lemmas for knowledge, implying beliefs with false lemmas are deficient. Why exclude them if they don’t impede success?  
  - **Why moderate?** (6) is defensible if false lemmas threaten *stability* (5), but (3) undercuts this by denying practical costs.  
  - **Cheapest revision:** Limit (3) to *isolated* actions:  
    *"For a *single action*, true belief suffices. But for *ongoing* agency, false lemmas undermine reliability (linking to 2/5)."*  

  ### ⚠️ **Severity Rank 4: Moderate Tension**  
  **Conflict:** (5) vs. (7)  
  - **Tension:** (5) cites *stability* as the source of knowledge’s differential value. But (7) denies independent value to any property beyond truth/falsity. Stability isn’t inherently truth-conditional.  
  - **Why moderate?** Stability can be framed as *instrumental* to minimizing future false beliefs (e.g., unstable beliefs decay into error).  
  - **Cheapest revision:** Explicitly ground (5) in (7):  
    *"Stability is valuable *because* it preserves true belief and avoids false belief over time."*  

  ### 🔍 **Apparent Tensions (Resolvable)**  
  1. **(4) vs. (2)/(5):**  
     - *Appearance:* (4) focuses on the *differential* value of knowledge over true belief, while (2)/(5) explain it instrumentally/stability-wise.  
     - **Resolution:** (2) and (5) directly address (4)’s demand—no conflict.  

  2. **(9) vs. (3):**  
     - *Appearance:* If true belief suffices for success (3), why is knowledge the norm of practical reasoning (9)?  
     - **Resolution:** (9) concerns *appropriateness*, not success. (3) can coexist if knowledge is a more *responsible* or *reliable* norm despite true belief’s occasional sufficiency.  

  3. **(6) vs. (7):**  
     - *Appearance:* (6)’s no-false-lemmas condition seems to add a non-truth-conditional requirement.  
     - **Resolution:** False lemmas can be seen as *risk factors for future error* (linking to 5/7), preserving monism.  

  ---

  ### 📌 **Summary & Recommended Revisions**  
  - **Biggest flaw:** (3) fatally undermines (2) and (5). **Revise (3)** to acknowledge true belief’s *actual-world* sufficiency while granting knowledge *counterfactual* reliability.  
  - **Critical patch:** (3) is the linchpin. Revising it as above resolves:  
    - The (2)/(3) conflict (Severity 1),  
    - Much of (3)/(6) tension (Severity 3),  
    - Bolsters (5)’s role in explaining (2).  

  - **Secondary fix:** Reinterpret (8) as instrumentally truth-conducive to preserve (7).  

  **Strongest single revision:** **Modify (3)** to limit true belief’s sufficiency to *actual* outcomes while granting knowledge *resilience across possibilities*. This eliminates the most severe tension, aligns with (5), and protects your core theses (2, 4, 7).  

  **Verdict:** Your position is *salvageable with revisions* but currently **inconsistent at its core** due to (3). With the proposed fixes, it coheres into a distinctive instrumentalist-monist account centered on stability.
