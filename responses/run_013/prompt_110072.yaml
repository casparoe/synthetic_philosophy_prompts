  - For anachronism, press on whether "what/this" distinction exists in period texts

  The falsifiability question is smart - shows user understands Popperian critique. Should frame it as "what evidence would make you abandon this reading?" rather than "prove you're wrong."

  Avoid reading list per request, but questions should implicitly cover major scholarship tensions (e.g., Chad Hansen's mass nouns vs Harbsmeier's predicates). User's "cost of importing apparatus" point suggests they suspect Eurocentric projection.

  Most importantly: questions must build like a cross-examination. No warm-up softballs - start precise, end lethal. Podcast format means concise but devastating follow-ups.
answer: |-
  Here’s a structured interview sequence in British English targeting your guest’s interpretation, designed to escalate in critical pressure. Each question includes a likely response and a sharp follow-up.

  ---

  ### **Interview Questions: White Horse Paradox Interrogation**
  *(British English phrasing, with follow-ups keyed to anticipated answers)*

  1. **Q1:** Your reading hinges on the claim that "horse" names a "what" (形 *xíng*, shape/form), "white" names a "quality" (色 *sè*, colour), and "white horse" names a "this" (實 *shí*, concrete object). Could you clarify *how* this distinction avoids reducing "a white horse is not a horse" to triviality?  
     *Likely Response:* "It’s not about set inclusion; it’s about *referential categories*—'horse' names an abstract property, so it cannot be identical to a compound object."  
     **Follow-up:** But if "white horse" merely *qualifies* "horse" with colour, why isn’t this just Aristotle’s genus-differentia? Isn’t your "category" distinction importing later metaphysical frameworks into a text that lacks terms for 'abstract property'?

  2. **Q2:** The dialogue opens with the advocate’s claim that "horse" designates shape and "white" designates colour. Later, the "seeking a horse" argument (where you can’t substitute a yellow horse for a white one) seems to rely on extensional class logic. Are these two arguments compatible, or is one subsidiary to the other?  
     *Likely Response:* "The seeking-horse section is a *rhetorical illustration* of the core semantic point—names fix reference differently."  
     **Follow-up:** Then why does the objector *lose* the seeking-horse debate? If the semantic argument is primary, the extensional example should be redundant—yet it’s treated as decisive. Isn’t this evidence the text *is* partly about class inclusion?

  3. **Q3:** The objector clearly hears 非 (*fēi*) in "white horse non-horse" as "is not a kind of horse" (class exclusion), not "is not identical to horse". On your reading, which sense is *required*, and why does the objector’s "misreading" collapse?  
     *Likely Response:* "The objector fails because he assumes all names refer uniformly. *Fēi* marks *referential mismatch*, not class exclusion."  
     **Follow-up:** But the text *allows* the objector to interpret *fēi* extensionally—and still defeats him. If your semantic reading is correct, why doesn’t the advocate *correct* this "misinterpretation"? Doesn’t the dialogue exploit *fēi*’s ambiguity deliberately?

  4. **Q4:** If your thesis is that "white horse ≠ horse" merely signifies they belong to distinct referential categories, why would this merit a paradoxical treatise? Plato’s "Theaetetus is not Socrates" is trivial; what makes *this* non-trivial?  
     *Likely Response:* "Because it targets a *deep assumption*: that all names function identically. This was radical in classical Chinese thought."  
     **Follow-up:** Where’s the evidence that pre-Han thinkers *did* assume names function uniformly? The *Mozi* canon already distinguishes abstract attributes (*jian*) from objects (*ti*). Isn’t this "revolution" overstated?

  5. **Q5:** You argue the School of Names rejects a "one-size-fits-all" theory of naming. But in *Gongsun Longzi*’s "Hard and White" dialogue, hardness and whiteness are *separated* from the stone—implying attributes *can* be named independently. Doesn’t this undermine your "compound object" reading?  
     *Likely Response:* "Not at all—'Hard and White' reinforces that qualities are distinct referents. The stone is the *shí* ('this'), like the white horse."  
     **Follow-up:** Then why does "Hard and White" conclude hardness/whiteness *cannot* exist apart from the stone? If "white horse" is a *shí*, but "white" alone isn’t, how is this consistent?

  6. **Q6:** Classical Chinese lacks articles/copulas, blurring "is" (identity/class/subset). Given this, isn’t your distinction between "names a what" vs. "names a this" projecting Aristotelian categories onto a text that might just be debating *ming* (names) and *shi* (stuff)?  
     *Likely Response:* "The *Gongsun Longzi* itself uses *xíng* (form) and *shí* (object)—it’s *their* distinction, not mine."  
     **Follow-up:** But *xíng* elsewhere means "physical form", not "abstract property". If your reading relies on *xíng* meaning "universal", isn’t that an anachronism? What’s the *cost* of forcing this framework onto the text?

  7. **Q7:** On your view, is the paradox *solved* by clarifying naming conventions? If so, why does the advocate treat "white horse non-horse" as a necessary truth rather than a linguistic stipulation?  
     *Likely Response:* "Because naming conventions *reveal* ontological distinctions—it’s not arbitrary."  
     **Follow-up:** Then is the School of Names doing metaphysics or semantics? If the former, why is there no theory of *what exists*? If the latter, why does the dialogue present itself as resolving a *paradox*?

  8. **Q8:** What textual evidence *could* falsify your reading? If a reconstructed *Gongsun Longzi* showed the "seeking a horse" argument was the *core* and the shape/colour distinction marginal, would you abandon it?  
     *Likely Response:* "The shape/colour opening frames the whole dialogue—without it, the rest makes little sense."  
     **Follow-up:** But scholars like A.C. Graham treat that opening as a *later addition*. If the received text is corrupt, how much weight can your reading bear?

  ---

  ### **Key Tactics Embedded**
  - **Fei Ambiguity:** Q3 traps her in explaining why the objector’s "class inclusion" reading fails despite being linguistically plausible. Forces her to defend textual coherence.  
  - **Triviality Charge:** Q4 presses the "why bother?" angle. If her reading demystifies the paradox, it must explain why it was ever provocative.  
  - **Anachronism:** Q6 demands she justify *xíng/shí* as technical terms, not retrofitted abstractions. Follow-up invokes contemporaneous texts (*Mozi*) to challenge novelty.  
  - **Corpus Consistency:** Q5 uses "Hard and White" to test if her framework holds across the School of Names.  
  - **Falsifiability:** Q8 is the kill switch—forces her to admit what would undermine her thesis, exposing its fragility.  

  ### **Delivery Tips**
  - **Pivot sharply on jargon:** If she says "It’s about reference," retort: "Reference *to what?* Horse-as-shape isn’t in the world—how is this not Platonism?"  
  - **Exploit historical pressure:** "You claim this targets a 'widespread assumption'—show me *one* pre-Han text that assumes names work uniformly."  
  - **End on stakes:** "If the School of Names *wasn’t* doing proto-analytic philosophy, were they just sophists? Does your reading save them from being 'word-play'?"  

  This sequence boxes her into defending textual coherence, historical plausibility, and philosophical payoff—exactly as requested. No mercy.
