  2. The dual meaning of 非 (fei) - identity vs class inclusion
  3. Triviality challenge: why write this if obvious?
  4. Anachronism risk in importing semantic frameworks
  5. How her reading affects other School of Names texts
  6. What evidence would falsify her theory

  User's phrasing suggests intellectual frustration - "going in circles", "don't want her to get away with" - they need steelman questions but with surgical follow-ups. The British English note is practical but also signals academic identity concerns.

  Right, structure should:
  - Open clarifying her core thesis
  - Pressure-test internal consistency (fei interpretation)
