answer: |-
  ### Moral Uncertainty Decision Tree  
  *Sorting by substantive commitments, not self-identified labels*  

  **Instructions:** Answer each question based on your actual view. Proceed down the tree without peeking at the outcomes.  

  ---

  #### Q1. Is uncertainty about moral rightness reducible to uncertainty about *descriptive facts* (e.g., "Does God exist?")?  
  - **Yes** → Proceed to Q2.  
  - **No** → Moral uncertainty is a distinct practical problem → Proceed to Q7.  

  #### Q2. Can verdicts of your plausible moral theories be placed on a *common scale* (e.g., all yield cardinal choiceworthiness scores comparable across theories)?  
  - **Yes** → Proceed to Q3.  
  - **No** → Proceed to Q5.  

  #### Q3. Should the highest-credence theory *veto* acts it deems morally forbidden?  
  - **Yes** → **Leaf: Veto-Then-MEC**  
    - *Awkward commitment*: Permits forcing everyone to comply with a 34%-credence theory’s strictures, even if alternatives have 66% combined credence.  
  - **No** → Proceed to Q4.  

  #### Q4. Should a theory’s influence adjust for its *internal stakes* (e.g., a theory that sees huge differences between acts gets more weight than one seeing small differences)?  
  - **Yes** → **Leaf: Stakes-Adjusted MEC**  
    - *Awkward commitment*: A theory assigning "zero" to another’s highest priority (e.g., animal suffering) may be muted, potentially underweighting radical demands.  
  - **No** → **Leaf: Maximizing Expected Choiceworthiness (MEC)**  
    - *Awkward commitment*: A 0.1% credence in a theory that calls eating meat 1,000x worse than murder dominates decisions.  

  #### Q5. Should we aggregate theories using a *voting system* (e.g., Borda count weighted by credence)?  
  - **Yes** → **Leaf: Parliamentary Compromise**  
    - *Awkward commitment*: Two theories agreeing on option A > B (but differing on *how much* better) are double-counted, overemphasizing consensus.  
  - **No** → Proceed to Q6.  

  #### Q6. Should we *avoid the worst-case outcome* across theories (e.g., minimize maximum regret)?  
  - **Yes** → **Leaf: Worst-Case Hedging**  
    - *Awkward commitment*: A 0.1% credence in a theory banning vaccines (viewed as murder) may block widespread vaccination.  
  - **No** → **Leaf: Defer to Highest-Credence Theory**  
    - *Awkward commitment*: A 35%-credence theory overrules a 65% combined opposition on high-stakes issues.  

  #### Q7. What is the primary *unit of choice* in moral uncertainty?  
  - **Act** → Proceed to Q8.  
  - **Policy** → **Leaf: Parliamentary Compromise** (as in Q5).  
  - **Whole Life** → **Leaf: Defer to Highest-Credence Theory** (as in Q6).  

  #### Q8. When theories disagree, should we *compromise* between them?  
  - **Yes** → **Leaf: Parliamentary Compromise** (as in Q5).  
  - **No** → Proceed to Q9.  

  #### Q9. Should *risk aversion* apply to moral outcomes?  
  - **Yes** → **Leaf: Worst-Case Hedging** (as in Q6).  
  - **No** → **Leaf: Defer to Highest-Credence Theory** (as in Q6).  

  ---

  ### Key Notes  
  1. **Indistinguishable Leaves**:  
     - *Parliamentary Compromise* and *Defer to Highest-Credence Theory* appear in multiple paths. The tree cannot separate these from their identical instances.  
     - *Worst-Case Hedging* appears in both Path A (Q6) and Path B (Q9).  

  2. **Unoccupied Combinations**:  
     - **Veto + No Common Scale**: Incoherent (veto requires assessing "forbidden" acts, but Q2→No blocks intertheoretic comparisons).  
     - **Stakes Adjustment + Parliamentary**: Unattractive (voting systems ignore cardinal stakes; combining them dilutes coherence).  
     - **Whole Life + Hedging**: Unexplored (whole-life commitment clashes with hedging’s act-by-act pessimism).  

  3. **Cases at Nodes**:  
     - **Q4 (Stakes Adjustment)**: Two theories agree A > B but disagree on stakes (e.g., "A is slightly better" vs. "A is vastly better").  
     - **Q6 (Worst-Case Hedging)**: A theory assigns *zero* value to another’s highest priority (e.g., animal rights vs. theology).  
     - **MEC Leaf**: Tiny credence in a theory that calls eating meat a grave wrong.  

  ---

  **Design Rationale**:  
  - Branch nodes prioritize *action-guiding commitments* (e.g., veto power, scaling, risk aversion) over labels.  
  - "Splitting" concerns (Q4/Q5) alter influence via stakes adjustment or voting.  
  - Path B (Q7–Q9) isolates non-factualist views, forcing unit-of-choice clarity.  
  - Awkward commitments expose tradeoffs (e.g., veto tyranny vs. MEC extremism).
