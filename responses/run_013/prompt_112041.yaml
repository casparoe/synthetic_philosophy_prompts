prompt: |-
  I teach a third-year seminar that philosophy and psychology students take together, and in a fortnight I have to run a ninety-minute session on what the cross-cultural evidence about folk morality is supposed to show about whether morality is objective. I taught it badly last year and I want to get it right. I opened with the trolley problem, on the theory that it was the one case everyone already had an opinion about; the discussion immediately degenerated into a guessing game about how people in other societies would answer, and then split into two camps that could not give reasons — half the room took the variation in moral judgement to refute moral realism outright, the other half took moral psychology to be simply irrelevant to metaethics. A colleague in the psychology department tells me I am overcomplicating things and should just present the findings and let the students draw their own conclusions, which is more or less what I did last year. What I want from you is a teaching plan, not an explanation of the topic: the order in which the ideas have to be introduced and what depends on what. I am fairly confident that both the moral/conventional distinction and the distinction between the content of a moral code and the status of moral claims have to be on the table early, but I cannot see which must come first, and I want you to decide and defend the order rather than lay out the alternatives. I would also rather they reason from a case they can all evaluate than take my word for what a particular society says, so build the session so that it does not depend on them accepting any ethnographic report.

  The thing I most want your judgement on is the carrying case. I have drafted my own vignette, because the published materials feel too loaded: a woman inherits her late mother's wedding ring, has it melted down and recast as a set of everyday spoons, and uses them at the family table, with everyone's knowledge and nobody's objection. Should that carry the session? Tell me what such an example has to contain and, just as importantly, what it must lack — my hunch is that anything bringing in harm, unfairness, deception, or even a bereaved person's distress will let the students file the disagreement under facts or consequences and learn nothing — and tell me plainly why the trolley problem is the wrong case to build on, since I have a suspicion about this but not an argument, and whether it has any legitimate use later, once the framework is in place. Then the misconceptions. I am expecting 'so morality is just relative' and 'so the empirical data are beside the point', but I suspect the ones that will do real damage are subtler — that the moral/conventional distinction is the legal/conventional distinction under another name, or that variation in what people judge is the same thing as variation in what is judged, or that the sampling complaint everyone has heard is a complaint about Western-ness rather than about education, wealth, industrialisation and democracy — and I want each one located at the exact point in the sequence where it has to be headed off, not merely named.

  Finish with the single question I should put to them in the last five minutes to find out whether they have grasped the inferential structure rather than collected some facts, and with what I should tell them we are not going to settle today and why. Commit to your recommendations and give your reasons; where you think a familiar choice is a mistake, say so and say what to do instead. I would rather have a plan I might disagree with than a balanced survey of options.
reasoning: |-
  Okay, let me approach this systematically. The professor needs a tight 90-minute lesson plan that avoids last year's trolley problem pitfalls and centers on cross-cultural evidence's implications for moral objectivity. 

  First, the core problem: students either overgeneralize variation as disproving realism or completely disconnect psychology from metaethics. The solution requires carefully staged concepts where each step builds on the last without ethnographic dependence. 

  The wedding ring spoons case is promising precisely because it lacks harm/deception elements that let students retreat to factual disagreements. It forces confrontation with pure symbolic meaning - the exact type of cross-cultural variation that challenges objectivity claims. But it must be deployed after establishing the moral/conventional distinction, otherwise students won't recognize it as moral. 

  Sequence is critical: 
  1. Start with moral/conventional distinction (using classroom examples like uniform rules vs hitting) to establish morality's special status. 
  2. Introduce ring-to-spoons case as a challenge: is this moral or conventional? Cross-cultural data shows some societies treat it as deeply moral. 
  3. Only then introduce the content/status distinction to prevent students from conflating cultural variation with relativism. 

  Trolley problem fails early because it triggers consequentialist reasoning - students debate outcomes, not metaethics. But it can be useful later when examining how cognitive processes might inform objectivity debates. 

  Key misconceptions to preempt:
  - When introducing moral/conventional distinction, explicitly contrast it with legal/conventional to prevent conflation.
  - When presenting variation, emphasize it's about differences in judgment frameworks, not just different facts.
  - Address WEIRD sampling by highlighting urbanization/education as variables, not geography. 

  Final question should force synthesis: "If two cultures genuinely disagree about the ring/spoons act while agreeing on all facts, what would realism require vs. what would relativism allow?" 

  Crucially, end by stating we're not solving metaethics - just examining whether empirical data constrains theories. The evidence challenges naive realism but doesn't dictate anti-realism. 

  This structure makes psychological evidence inescapable for metaethics while blocking overhasty conclusions. Every misconception gets dismantled at the point where it would naturally arise.
answer: |-
  Here is a tightly sequenced 90-minute teaching plan designed to force engagement with the inferential structure, using your ring/spoons case as the anchor and preempting key misconceptions at critical junctures. **The core strategy is to make the empirical data *inescapable* for metaethics by first establishing moral phenomenology.**

  ---

  ### **Phase 1: Grounding Moral Experience (20 mins)**
  **Goal:** Establish the *moral/conventional distinction* as a psychological reality before introducing variation.  
  **Activity:**  
  - Present **two scenarios**:  
    (A) *Conventional*: A student wears pajamas to seminar (against school rules).  
    (B) *Moral*: A student hides a library book to prevent others accessing it.  
  - Ask: *"What’s the difference in how you react? Imagine both acts happen in a society with no rules against them."*  
  - Elicit features: authority-independence, seriousness, generalizability. **Emphasize**: This distinction is observed *cross-culturally* (Turiel, Smetana).  

  **Why this first?**  
  Without establishing that morality *feels* objective (beyond rules/conventions), students default to legalistic thinking. Preempts *"moral/conventional = legal/conventional"* by using apolitical examples.  

  ---

  ### **Phase 2: Introducing Variation via Your Ring/Spoons Case (25 mins)**  
  **Goal:** Force confrontation with *genuine moral disagreement* where harm/fairness/deception are absent.  
  **Activity:**  
  - Present your vignette (ring → spoons). Poll initial reactions: *"Is this morally acceptable? Why/why not?"*  
  - Reveal: Some societies view this as deeply immoral (symbolic desecration); others are indifferent. **Stress**: All parties agree on *facts* (no deception, no objection, no harm).  
  - Key questions:  
    *"Is this a *moral* disagreement or just different conventions?"* (Leverage Phase 1: authority-independence/seriousness).  
    *"If both sides feel their view is objectively correct, what does this imply?"*  

  **Why this case works (and trolley fails):**  
  - **Lacks**: Harm, unfairness, distress, consequences → blocks "factual disagreement" escapes.  
  - **Contains**: Purely symbolic meaning → exposes culturally constructed moral "facts."  
  - **Trolley’s flaw**: Triggers consequentialist reasoning (outcomes > ontology) and invites speculation. *Use it later* (Phase 4) to examine *how* cognitive processes inform metaethics.  

  ---

  ### **Phase 3: Content vs. Status Distinction (20 mins)**  
  **Goal:** Sever the link between *variation in judgments* and *metaethical conclusions*.  
  **Activity:**  
  - Pose: *"We’ve seen cultures disagree on moral content (e.g., ring/spoons). Does this prove morality isn’t objective?"*  
  - Present two positions:  
    - **Student A**: "Yes—if morality were objective, everyone would agree."  
    **Student B**: "No—disagreement doesn’t disprove objectivity (e.g., flat earth)."  
  - Intervene: **Content** (what is wrong) vs. **Status** (what "wrongness" *is*). Ask:  
    *"Can moral claims *aspire* to objectivity even if we disagree? What would that look like?"*  
  - Preempt: *"Variation in judgment ≠ variation in truth"* by noting historical/scientific disagreements persist despite objective truth.  

  **Crucial preemption**: When introducing content/status, explicitly dissect WEIRD sampling: *"Is this about *Western* minds or *industrialized, educated* minds? Does urbanization shift moral cognition? If so, why?"* (Targets "culture = geography" error).  

  ---

  ### **Phase 4: What Psychology Can/Cannot Show (15 mins)**  
  **Goal:** Block "irrelevance" rebuttals by showing psychology *constrains* metaethics.  
  **Activity:**  
  - Return to ring/spoons: *"If our moral intuitions are shaped by cultural symbols (not harm), does this challenge realism?"*  
  - Contrast:  
    - **Robust realism**: Moral facts exist independently of human cognition.  
    - **Psychology’s challenge**: If moral intuitions track culturally variable symbols (not mind-independent facts), realism needs explanation (e.g., why symbols vary).  
  - **Reintroduce trolley** cautiously: *"Trolley data shows *systematic* patterns (e.g., personal force). Does this suggest universal cognitive architecture? If so, does that *support* realism?"*  

  **Why here?** Trolley now illustrates *how* psychology can inform (not settle) metaethics—e.g., universal cognitive constraints *might* hint at objective structure.  

  ---

  ### **Final 5-Minute Synthesis Question**  
  **"If two cultures agree on all non-moral facts about the ring/spoons act but disagree morally, what *must* a moral realist say about one culture? What *could* a relativist say?"**  
  - **Tests grasp**: Forces distinction between *error theory* (realism) and *non-factualism* (relativism). Reveals if students see psychology as *evidence* (not proof).  

  ---

  ### **What We’re Not Settling Today**  
  **State explicitly**: *"We’re not resolving whether moral realism is true. We’re asking: Does cross-cultural psychology *constrain* what a plausible metaethics looks like? If moral intuitions are sensitive to arbitrary symbols (like rings), realism needs a story about why."*  
  **Why this framing**: Prevents premature closure; positions psychology as metaethics’ necessary interlocutor.  

  ---

  ### **Why This Sequence Works**  
  1. **Moral/conventional first**: Without the phenomenology of objectivity, variation seems like "just customs."  
  2. **Ring/spoons early**: Forces disequilibrium—students *feel* the disagreement is moral but can’t appeal to harm.  
  3. **Content/status second**: Prevents "variation → relativism" overreach by separating ontology from epistemology.  
  4. **WEIRD/judgment-vs-truth preemptions**: Placed *exactly* when misconceptions would arise (e.g., sampling when discussing variation).  

  **Commitments**:  
  - **Ditch trolley as opener**. It’s a distraction. Use only later to examine cognitive universals.  
  - **Use ring/spoons unedited**. Adding harm/deception destroys its purpose.  
  - **End with the synthesis question**. It’s the litmus test for structural understanding.  

  This plan makes psychology *inescapable* for metaethics without letting students weaponize it reductively. The ring/spoons case—by being emotionally resonant yet culturally variable—does the heavy lifting.
