  The connection to Frege and Cantor's naive set theory also holds up. Their systems allowed unrestricted comprehension, which Russell proved inconsistent. The mention of type theory as Russell's solution is historically accurate, though modern foundations use ZFC instead. 

  When the student calls it "the liar paradox in set-theoretic dress," that's a defensible analogy. Both involve self-reference leading to contradiction. But I should note that while related, they aren't identical paradoxes. 

  The claim about the Axiom of Foundation blocking self-membership needs careful handling. It's true that Foundation prevents sets from containing themselves, but that's not actually what stops Russell's paradox. The real culprit is Restricted Comprehension - Foundation is more about well-foundedness than solving this specific paradox. 

  Ah, and here's a key point: the student says ZFC's Restricted Comprehension prevents formulas from defining sets in terms of themselves. This is misleading. What Restricted Comprehension actually does is require sets to be subsets of existing sets. Self-reference isn't directly addressed - the system avoids contradiction by limiting what sets can exist, not by banning self-referential definitions entirely. 

  The closing moral about self-reference being universally illegitimate strikes me as an overstatement. While naive self-reference caused problems, modern systems like ZFC don't ban it entirely - they just regulate it carefully through hierarchical construction. The user should know that self-reference still appears in mathematics through indirect means like fixed-point theorems. 

  For the user's specific question about what blocks Russell's paradox: it's really the weakening of Comprehension to Restricted Comprehension in ZF set theory. Foundation is a separate issue. The self-reference moral is too strong - mathematics doesn't reject self-reference wholesale, just certain unrestricted forms of it. 

