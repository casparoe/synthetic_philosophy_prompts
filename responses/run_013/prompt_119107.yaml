prompt: |-
  I chair the steering committee of a foundation that has committed about £4 million over three years to a programme on path dependence: the thesis that where a system ends up depends on the particular sequence by which it got there, so that a different early accident would have delivered a different endpoint. The programme will support roughly eight researchers across economics, evolutionary biology, and comparative politics, plus one methods postdoc, and can sustain three or four lines of work properly. The question of what to fund is therefore a real one, and I am asking you to set the agenda for it.

  Three commitments of my own should be treated as part of the problem rather than as settled background; tell me if any of them is confused, and propose replacements if you think they are.

  First, I distinguish first-order from second-order path dependence. A first-order claim says that a given system's trajectory was sensitive to early contingency. A second-order claim says that the degree of sensitivity is itself historically variable: systems can accumulate commitments that make them progressively harder to divert, or acquire features — recombination, modularity, rapid turnover of components, selection for evolvability, standing supplies of migration or imitation — that restore contingency. Is there any directional story to be told about second-order path dependence, or is the variability itself unstructured?

  Second, I think much of the literature runs together a mechanism claim with a counterfactual claim. The mechanism claim is that some self-reinforcing process was at work. The counterfactual claim is that, had the early accident gone differently, the system would have settled elsewhere and stayed there. The second does not follow from the first, and the most celebrated case study in the field has been contested on precisely that gap. If the diagnosis is right, what follows for what we should fund?

  Third, I suspect the whole debate is partly hostage to a granularity problem. Whether a domain looks contingent or convergent depends on the level of description at which outcomes are compared — function, form, performance, or some coarser profile — and descriptions can be gerrymandered in either direction. Is that a genuine obstacle to the question of whether the same outcomes would have arrived anyway, or a distraction?

  Against that background, give me a prioritised agenda: which open questions in this area matter most, in what order, and why. Rank by explicit criteria — how many other questions depend on the answer; how tractable the question is with the tools our disciplines actually have (conceptual analysis, comparative case work, formal modelling, experimental evolution; we are not funding large new data collection); how neglected it is; and how much the answer would change what funders and policymakers do about early intervention as against later correction. Note the trade-offs between those criteria, name at least one candidate question that is overrated and should be dropped, and say what evidence over the next two or three years would move a question up or down the list. I want an argued agenda, not a survey and not a reading list: do not give me citations, and do not lean on particular authors or titles.

  Write in British English. End with a final line beginning "Priority order:" followed by the three questions you rank highest, numbered, each given as a short label of no more than ten words.
reasoning: |-
  Okay, the user chairs a foundation steering committee with a £4 million programme on path dependence. They need to set a research agenda with clear priorities. Their three commitments frame the problem: distinguishing first and second-order path dependence, separating mechanism from counterfactual claims, and addressing granularity issues.

  Hmm, the user seems deeply familiar with the field's nuances but wants fresh perspective on structuring the programme. Their frustration with existing literature gaps is palpable - especially the conflation of mechanism and counterfactual claims. The real stakes here involve steering research toward actionable insights for policymakers.

  Let me unpack their core concerns. On second-order path dependence, they're asking whether systems evolve toward rigidity or flexibility in predictable ways. The granularity problem feels particularly thorny - can we even compare outcomes meaningfully across different descriptive levels? And that mechanism-counterfactual gap... it's striking how often foundational case studies fail here.

  For the agenda, tractability matters most given no new data collection. We'll need questions resolvable through modeling, case comparisons or conceptual work. Policy relevance is key too - they'll want funders to know when early intervention pays off versus when course-correction suffices.

  *scratches head* That neglected criterion is tricky... most path dependence research focuses on first-order claims, so second-order questions are wide open. But are they tractable? Maybe through evolutionary biology models where evolvability traits are measurable.

  Biggest trade-off: high-policy-impact questions (like early intervention thresholds) might be less tractable short-term. Whereas nailing the mechanism-counterfactual link could transform methodology across fields faster.

  Overrated candidate? "Identifying irreversible tipping points" - often conflates persistence with true path-locking. We'd need perfect counterfactuals to verify, which we rarely have.

  Monitoring evidence: If experimental evolution labs show systems regaining flexibility after rigidity, that boosts second-order questions. New formal models separating path-sensitivity from outcome-variance would elevate granularity debates.

  Priority order must reflect foundations first: without solving the mechanism-counterfactual muddle, other findings remain shaky. Then second-order dynamics - it's the scaffolding question. Granularity comes third as it enables cross-domain comparison.

  Right, final labels need punch... "Mechanism-counterfactual decoupling" for the core gap. "Second-order resilience trajectories" captures evolvability shifts. "Descriptive level dependency" for granularity. All under ten words.
answer: |-
  ### Prioritised Research Agenda for Path Dependence Programme

  **Core Criteria & Trade-offs:**  
  Tractability (using existing tools) and foundational importance (enabling other research) are prioritised over policy impact, as robust answers to mechanistic questions must precede actionable advice. Neglect is weighted moderately – virgin territory is valuable but risky if intractable. Policy relevance suffers when questions are highly abstract, yet *must* inform the agenda to avoid academic navel-gazing. The key trade-off: high-policy-impact questions (e.g., intervention timing) often require resolving abstract conceptual/methodological gaps first.

  **Overrated Question to Drop:**  
  *"Identifying Irreversible Tipping Points in Socio-Economic Systems."*  
  **Why:** Often conflates persistence (which may be temporary) with true path-dependent irreversibility. Requires unrealistic causal isolation in complex systems and is frequently politicised. Focus should shift to *conditions enabling reversibility*.

  **Evidence Shifting Rankings (2-3 years):**  
  - **Upward shift:** Experimental evolution (e.g., digital organisms) showing consistent patterns in when/why systems regain contingency after rigidity.  
  - **Downward shift:** Persistent failure to formalise testable criteria distinguishing path dependence from mere persistence in cross-disciplinary case studies.  

  **Prioritised Questions:**  

  1. **What measurable criteria definitively decouple self-reinforcing mechanisms from counterfactual stability?**  
     *Why highest:* Foundationally critical. Until we can rigorously distinguish a mechanism (e.g., increasing returns) from proof that alternative stable states exist, the field lacks disciplinary legitimacy. *Tractability:* High – amenable to formal modelling (e.g., stochastic processes with absorbing states) and meta-analysis of contested case studies using shared analytical frameworks. *Neglect:* Severe – most empirical work assumes the link. *Policy Impact:* Indirect but profound – validates whether early intervention is theoretically justified.  

  2. **Under what conditions do systems evolve towards greater or lesser second-order path sensitivity?**  
     *Why:* Addresses your core puzzle about directionality in second-order dynamics. Framing it as "conditions" rather than "directional stories" embraces variability while seeking structure. *Tractability:* Strong – testable via comparative biology (e.g., evolvability in phylogenies), institutional economics (rigidity in regulatory regimes), and computational models (evolving modularity). *Neglect:* High – scant cross-domain work. *Policy Impact:* Direct – reveals whether early flexibility investments prevent future lock-in.  

  3. **How does the granularity of outcome description determine observed path contingency?**  
     *Why:* Tackles the gerrymandering risk head-on. Without this, cross-system comparisons are meaningless. *Tractability:* Moderate – requires conceptual innovation (defining "outcome spaces") and re-analysis of existing datasets at multiple descriptive levels. *Neglect:* Under-discussed outside niche philosophy of science. *Policy Impact:* High but subtle – determines whether "success" is path-dependent (e.g., "democracy" vs. specific electoral rules).  

  **Justification of Order:**  
  Question 1 is the *sine qua non* – without closing the mechanism-counterfactual gap, the field cannot reliably claim any instance of path dependence exists. Question 2 builds on this by exploring your second-order concern, using the validated criteria from Q1. It is more tractable than granularity due to clearer empirical handles (e.g., biological proxies). Question 3, while vital for generalisability, is marginally less urgent; resolving Q1-2 provides tools to dissect granularity systematically. All three leverage existing data/methods and address neglect.

  **Priority order:**  
  1. Mechanism-counterfactual decoupling criteria  
  2. Second-order resilience trajectories  
  3. Descriptive level dependency
