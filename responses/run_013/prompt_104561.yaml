prompt: |-
  Me and a friend got into it for like two hours last night about hypocrisy — she thinks it's basically always a dodge, I think sometimes it's the whole point — and it got heated because this exact thing keeps happening at work and I have no idea what I'm doing. I'm a team lead at a ~45 person software company. I'm not HR and I'm not a manager of managers, but I'm the person who ends up deciding whether a concern about a colleague's conduct actually gets raised — informally over coffee, in a review, or escalated up to HR or the CEO, which I can do but shouldn't do lightly. The concerns are mundane: someone skips steps on the safety checklist, someone is a jerk to juniors in code review, someone quietly takes credit for an intern's work. And almost every time, before anything happens, someone says I'm the last person who gets to say that — because I did the same thing eighteen months ago, or because I've been sharp in reviews myself, or because I obviously just don't like the guy. Sometimes that's pure deflection. Sometimes I think it's actually correct and I should shut up and hand it off to someone else. Right now I'm improvising, in front of people, which is the worst way to do it.

  What I want from you is a decision procedure I can run in ten minutes, in my head, before I open my mouth — a checklist or a flowchart in words, with the order spelled out and, for each step, some sense of what counts as a pass. Ground it in whatever the philosophy of standing to blame actually says. I have a feeling I'm mashing three seperate questions into one: (1) is this thing actually wrong, (2) am I the right person to be the one to say it, (3) will saying it do any good. I want them kept apart. Two things I half-remember and want you to either confirm or shoot down: that what kills your standing isn't having ever done the same thing, it's being uncommitted to the rule you're invoking — i.e. it's about holding yourself to the same standard, not about having a spotless record; and that losing standing to blame is different from losing the right to have the person punished or sanctioned, so you can be barred from the personal confrontation and still be allowed, or even required, to report it up the chain. And please be explicit that "you have no standing" never means "the conduct was fine." The procedure needs to handle at least these: I'm guilty of the exact same thing right now; I'm guilty of something only sort of similar; I did it, stopped, and admitted it to the team; my record is clean but my motive is obviously personal; the person is a junior who reports to me and I'm the only one positioned to raise it; and the case where I lack standing but the conduct is serious enough that somebody has to act. Mark clearly the points where the procedure runs out and it's a values call I have to own — I don't want a flowchart that pretends the hard part isn't hard. Also say who should sign off at each level, since I can't unilaterally do the formal stuff.

  Then actually run it on three cases: (a) a peer who's been skipping a safety step, where I skipped the same step last year and got talked to about it; (b) a peer who humiliates juniors in reviews, where I've been blunt but never cruel; (c) me wanting to raise that a colleague takes credit for other people's work, when I'm pretty sure part of my motivation is that he got promoted and I didn't. Include at least one where the procedure tells me to stay quiet and hand it off, even though the conduct is genuinely bad — I'd rather find that out now. And if the whole idea of "standing" is doing less work than I think, or the request is confused at the root, just say so instead of handing me a tidy procedure anyway; I'd rather have the real answer. Where you're unsure, flag it, and don't present a contested position as if it were the consensus.
reasoning: |-
  Okay, this user is a team lead in a software company dealing with workplace conflicts involving hypocrisy accusations. They need a clear decision procedure to handle when to raise concerns about colleagues' misconduct. Let me unpack their situation.

  First, their core frustration: they keep getting called out for past behavior when trying to address current issues. They've identified three key questions tangled together: whether the conduct is wrong, whether they're the right person to address it, and whether speaking up will help. Smart breakdown - that's a solid foundation.

  I recall philosophical concepts about standing and blameworthiness. The user's half-remembered points are actually quite sharp: standing depends on current commitment to the standard, not a spotless record. And importantly, lacking standing to personally confront doesn't mean the conduct should be ignored - escalation paths still exist. Need to emphasize that distinction.

  The requested procedure must handle nuanced scenarios: current guilt, past similar behavior, clean record with questionable motives, junior reporting lines, and serious misconduct requiring action despite standing issues. User explicitly wants the flowchart to acknowledge where judgment calls are unavoidable - no false precision.

  For structure, a three-stage approach seems natural: first determine if it's actually misconduct, then assess personal standing, finally evaluate pragmatic impact. Each stage needs clear pass/fail criteria. Standing assessment should focus on three pillars: consistency (current behavior), hypocrisy (past behavior resolution), and motive (personal vs principled).

  Important to build in off-ramps: where standing fails but misconduct is serious, mandate handing off to HR or manager. And always clarify that "no standing" ≠ "no problem" - the content issue remains valid regardless of messenger.

  For the case applications: 
  (A) Safety checklist skipping: misconduct yes, standing weak (recent violation), better to escalate to safety officer 
  (B) Humiliating juniors: misconduct clear, standing solid if user's past bluntness wasn't cruel, proceed with care 
  (C) Credit-stealing with promotion jealousy: misconduct real, standing compromised by motive - must disclose bias or hand off

  Should stress that stages 2-3 involve judgment calls. No algorithm can replace self-honesty about motives. Also note organizational realities: HR/manager involvement thresholds, documentation needs.

  The user's self-awareness here is impressive. They recognize their own potential biases and want tools to compensate. The procedure should honor that by including motive checks and disclosure prompts. Might add that if they're unsure about motives after reflection, default to handing off - better safe than hypocritical.

  Final structure should be: 
  1. Misconduct? (Policy/reason test) 
  2. Standing? (Consistency/hypocrisy/motive) 
  3. Practicality? (Impact/alternatives) 
  With off-ramps to escalate or delegate at each stage
answer: |-
  Based on your description, you've correctly identified the core tension: **"Standing" (your moral authority to call out misconduct) is not about having a perfect past, but about your *current commitment to the standard you're enforcing*.** Your recollection of the philosophy is sharp – it's about *consistency and integrity*, not spotlessness. The key distinction between **personal standing (to confront)** and **organizational duty (to report)** is also critical. Below is a decision procedure grounded in ethical principles of standing (drawing on philosophers like R. Jay Wallace and T.M. Scanlon), designed for real-world use.

  ---

  ### **The Standing & Action Decision Procedure**
  **Run these 3 questions IN ORDER. Stop and act if any step fails – don't proceed if you lack standing or it's futile.**  
  **Time:** ~10 mins (5 mins for steps 1-2, 5 mins for step 3).  
  **Goal:** Separate *validity of the concern* from *your role in addressing it*.

  #### **STEP 1: IS THE CONDUCT ACTUALLY WRONG?**  
  *(Validate the concern objectively before considering yourself)*  
  - **Ask:** "If *anyone else* did this, would it violate a written rule, team norm, or basic ethical standard (e.g., fairness, safety)?"  
  - **Pass if:**  
    - It breaches **company policy** (e.g., safety checklist), or  
    - It harms **team function** (e.g., humiliation destroys morale), or  
    - It's **unambiguously unethical** (e.g., stealing credit).  
  - **Fail if:** It's a minor stylistic gripe, personal preference, or you can't articulate the harm.  
  - **➔ If FAIL:** Stop. Do nothing.  
  - **➔ If PASS:** Proceed to Step 2.  
  - *Values call?* Yes – if harm/norm violation is borderline. Err toward "pass" if safety/ethics are involved.

  #### **STEP 2: DO *I* HAVE STANDING TO ADDRESS IT DIRECTLY?**  
  *(Can *you* credibly confront without hypocrisy? Focus on CURRENT integrity)*  
  - **Ask 3 sub-questions (ALL must pass):**  
    1. **Consistency:** "Am I *currently* adhering to this standard? (Not 'have I always?' but 'am I *now*?')"  
       - *Fail only if you're actively, knowingly violating the same rule.*  
    2. **Hypocrisy Check:** "If I violated this in the past, did I: (a) stop, (b) acknowledge it was wrong, and (c) make amends if needed?"  
       - *Pass if:* You reformed and owned it (e.g., apologized to juniors after sharp feedback).  
       - *Fail if:* You never addressed it, still do it secretly, or dismissed criticism.  
    3. **Motive:** "Is my primary motive to uphold the standard/stop harm – NOT personal dislike, rivalry, or ego?"  
       - *Pass if:* You'd raise this even for a friend/enemy, or if you disclosed bias.  
       - *Fail if:* You're driven by resentment, jealousy, or tribal loyalty.  
  - **➔ If ALL PASS:** You have standing. Proceed to Step 3.  
  - **➔ If ANY FAIL:** You lack standing for *personal confrontation*. **Still proceed to Step 3** – you may still need to report.  
  - *Values call?* Yes – especially on motive. Be brutally honest. If unsure, assume "fail" and disclose/hand off.

  #### **STEP 3: WILL ADDRESSING IT DO MORE GOOD THAN HARM?**  
  *(Pragmatic test: Even with standing, is action wise?)*  
  - **Ask:**  
    - "Is there a safer/more effective way to address this (e.g., peer feedback vs. HR)?"  
    - "Will *my involvement* undermine the message due to past friction or bias?"  
    - "Is the person likely to retaliate or escalate conflict?"  
  - **Pass if:**  
    - Harm is serious (e.g., safety risk, abuse), AND/OR  
    - You're the only/best-placed person to act (e.g., lead witnessing credit theft), AND  
    - No lower-risk alternative exists (e.g., anonymous reporting isn't feasible).  
  - **Fail if:**  
    - It's minor and better handled by the person's manager, or  
    - Your involvement would fuel drama (e.g., bitter rivalries), or  
    - A neutral party (HR, skip-level) can handle it credibly.  
  - **➔ If PASS:** Act based on severity:  
    - **Low risk:** Informal chat (coffee).  
    - **Moderate risk:** Documented feedback (review).  
    - **High risk/pattern:** Escalate (HR/CEO).  
  - **➔ If FAIL:** Hand off or stay silent (*but only if harm is minor*). For serious issues, escalate even if "fail."  
  - *Values call?* Yes – judging risks/alternatives. When in doubt, consult before acting.

  ---

  ### **Escalation Paths & Sign-Off**  
  - **Informal chat (coffee):** Your call – but brief your manager afterward.  
  - **Formal feedback (review):** Get sign-off from **your manager** or **HR** before documenting.  
  - **Escalate to HR/CEO:** **Mandatory sign-off from HR** (if exists) or **your manager**. Never unilateral.  
  - **Hand-off:** Transfer to **HR**, **the person's manager**, or a **neutral peer**. Inform them of the concern and *your conflict* (e.g., "I lack standing due to past issues, but this needs review").

  ---

  ### **Key Principles Embedded**  
  1. **Standing ≠ Sainthood:** It requires *current* consistency + resolved past lapses.  
  2. **Standing ≠ Reporting Duty:** Losing standing to *confront* doesn't absolve you from *reporting* serious misconduct.  
  3. **"No Standing" ≠ "No Problem":** The conduct remains wrong – someone else may need to act.  
  4. **Bias Must Be Disclosed:** If your motive is mixed but standing passes, disclose your conflict (e.g., "I acknowledge tensions, but this behavior harms the team").  

  ---

  ### **Applied to Your Cases**  
  *(Using the procedure)*  

  #### **CASE A: Peer skipping safety step. You skipped it last year, got corrected.**  
  1. **Wrong?** PASS (Safety violation → objective risk).  
  2. **Standing?**  
     - *Consistency:* PASS (You stopped after being corrected).  
     - *Hypocrisy:* PASS (You accepted feedback and reformed).  
     - *Motive:* PASS (Safety isn't personal).  
  3. **Actionable?** PASS (Safety risks can't wait; informal chat suffices).  
  **➔ ACTION:** **Address it informally** ("Hey, I got called out for this last year – let's not risk it"). Copy-paste your own feedback experience. No escalation needed yet.  

  #### **CASE B: Peer humiliates juniors. You're blunt but not cruel.**  
  1. **Wrong?** PASS (Harm to morale/psychological safety).  
  2. **Standing?**  
     - *Consistency:* PASS (You're "blunt" but not cruel → different severity).  
     - *Hypocrisy:* PASS (No history of cruelty to resolve).  
     - *Motive:* PASS (Protecting juniors is principled).  
  3. **Actionable?** PASS (Harm ongoing; you're well-placed as lead).  
  **➔ ACTION:** **Formal feedback** (e.g., in peer review: "Feedback style crosses into personal attacks, damaging team trust"). Get manager sign-off.  

  #### **CASE C: Colleague takes credit for intern's work. You resent their promotion.**  
  1. **Wrong?** PASS (Theft of credit → unethical).  
  2. **Standing?**  
     - *Consistency:* PASS (Assuming you don't steal credit).  
     - *Hypocrisy:* PASS (No relevant past violation).  
     - *Motive:* **FAIL** (Your resentment dominates – you admit jealousy).  
  3. **Actionable?** **But STANDING FAILED → HAND OFF.**  
  **➔ ACTION:** **Escalate to HR/their manager** with full disclosure: *"This needs investigation. I acknowledge personal tensions may cloud my judgment, but multiple reports suggest credit theft."* **Do not confront personally.**  

  ---

  ### **When the Procedure Says "Stay Quiet & Hand Off"**  
  In **Case C**, the conduct is wrong (Step 1 passes), but your motive fails Step 2. Result: **You must not confront** – but because the harm is serious (career impact on intern), **you must escalate neutrally**. This isolates the bias risk while ensuring accountability.  

  ---

  ### **Caveats & Reality Checks**  
  - **Standing Isn't Magic:** Some philosophers (e.g., Macalester Bell) argue standing is overemphasized – if conduct is wrong, anyone can call it out. But in your *role*, credibility impacts effectiveness. This procedure errs toward caution to avoid backlash.  
  - **Your Role Matters:** As a lead, you have a *duty to act* on serious issues even with compromised standing – hence the hand-off requirement.  
  - **Hardest Part:** Honest motive checks. Ask: "Would I raise this if I liked the person?" If no, hand off.  
  - **When in Doubt:** **Disclose and delegate.** Say to HR/your manager: *"I think X is wrong, but I may lack standing due to [past issue/bias]. How should we handle?"*  

  This won't eliminate conflict, but it forces discipline: separate the *issue* from the *messenger*, act only with integrity, and protect the team when you're the wrong messenger. Run the steps, own the values calls, and lean on HR for formal actions.
