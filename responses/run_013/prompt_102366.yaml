prompt: |-
  I am trying to isolate a pattern that runs through discussions of lying, and I suspect a distinction is available that I have not been able to locate. The pattern is this: whether an utterance is deceptive appears to be largely independent of whether its content is true or false. Consider two cases. In the first, a man tells a friend who happens to be his physician that he has quit smoking; he has not, he knows the physician will see him smoking within the week, and he does not care whether the physician believes him — he says it only to close the subject. The words are false, yet he is not trying to make anyone believe anything. In the second, a man asked where he was last night answers that he was at his mother's, which is literally true, intending the questioner to conclude that he was only there; the questioner duly concludes he did not spend the evening at the casino. The words are true, yet he is trying to produce a false belief. I know that the traditional definition of a lie — the one that descends from Augustine, requiring both that what is said be false and that the speaker intend to deceive — fails each of my cases on one clause. What I want is not a label but an account: is there an established term, or a pair of terms, for the phenomenon these cases are circling — deception tracked by the speaker's intentions concerning the hearer's beliefs rather than by the truth-value of what is said? How does whatever you propose relate to the neighbouring ideas of misleading, equivocation, and speech that is simply indifferent to the truth of what it asserts? Tell me precisely what the phenomenon includes and excludes, where its edges lie, which way you would come down, and what argument or example would move you to a different verdict.
reasoning: |-
  Okay, the user is exploring a nuanced pattern in deceptive communication where the truth-value of an utterance doesn't always align with the speaker's intent to deceive. They've provided two clear cases: one where a false statement isn't meant to deceive, and another where a true statement is. They're looking for established terms or concepts that distinguish these phenomena, especially how deception relates to speaker intentions versus truth-value. 

  The user seems well-versed in philosophical literature (referencing Augustine) but isn't satisfied with traditional definitions. They want precise boundaries—what's included/excluded—and how this relates to adjacent concepts like misleading or equivocation. Their examples are cleverly constructed to expose gaps in classical lying definitions. 

  Hmm... the core tension is between propositional truth and pragmatic deception. The physician case shows falsity without deception intent, while the mother/casino case shows truth with deception intent. The user is essentially asking for a taxonomy of communicative dishonesty that decouples these two axes. 

  For the phenomenon where true statements deceive, "paltering" (from negotiation theory) fits perfectly—it's deception via selective truth-telling. The smoking case is trickier; it's almost performative insincerity without communicative intent. "Deceptive truth-telling" and "non-deceptive falsity" could serve as descriptive category labels. 

  Important to map neighboring concepts: Misleading implies intentional deception but avoids literal falsity (like the casino example). Equivocation exploits ambiguity, which overlaps with paltering. Indifference to truth (bullshitting à la Frankfurt) is distinct because it lacks deception intent entirely. 

  Boundaries matter here: Paltering requires (1) literal truth, (2) intent to implant false belief, and (3) strategic omission. The smoking case excludes deception intent because the speaker anticipates immediate disconfirmation. 

  I'd push back slightly on the casino example: If "at mother's" implies exclusivity (which it pragmatically does), it's arguably misleading but not paltering since no new false fact is asserted. Stronger paltering would be "I left her house at 11 PM" (true) implying he went home (false). 

  Edge cases: What if the physician believes the lie despite expected disconfirmation? Then accidental deception occurs, but intent still defines the phenomenon. Or if the casino-goer's mother genuinely was one stop of many—is it still deceptive if the inference is reasonable? 

  Frankfurt's bullshit concept clarifies why the smoking case isn't deception: The speaker cares about shutting down conversation, not manipulating beliefs. That’s indifference to truth, squarely in bullshit territory. 

  The most defensible framework is Gricean: Deception violates the cooperative principle’s maxim of quality (truthfulness) or quantity (informativeness). The casino case violates quantity by withholding key details; the smoking case violates quality with falsehoods. Both are "dishonest" but only the former is deceptive. 

  If shown a case where true statements deceive without the speaker controlling inferences (e.g., accidental misdirection), I’d exclude it—intentionality is non-negotiable. Likewise, if "non-deceptive falsity" actually causes belief (e.g., the physician never sees the smoking), it remains non-deceptive because intent defines the act, not outcomes. 

  Ultimately, the user needs these four quadrants: 
  - Deceptive falsity (lying) 
  - Deceptive truth (paltering) 
  - Non-deceptive falsity (bullshit) 
  - Non-deceptive truth (honesty) 

  ...with clear criteria: 
  Deception = intent to implant false belief 
  Falsity = objective untruth 

  That should resolve their core puzzle.
answer: |-
  Your cases brilliantly expose a gap in traditional definitions of lying. The phenomenon you're isolating is **intentional deception via communicative acts**, which is indeed decoupled from the literal truth-value of the utterance. Here's a precise account:

  ### Core Phenomenon: **Pragmatic Dishonesty**
  This encompasses communicative acts where the speaker **intentionally manipulates the hearer's beliefs** through implied meaning, contextual framing, or strategic truth/falsity—regardless of propositional truth. Key features:

  1.  **Essential:** Speaker intends the hearer to form (or persist in) a *false belief*.
  2.  **Essential:** This intention is pursued through the act of communication itself (spoken, written, etc.).
  3.  **Non-Essential:** The literal truth-value of the words used (true, false, indeterminate).
  4.  **Non-Essential:** Whether the speaker *asserts* the false belief directly. They may imply it.

  ### Established Terms & Distinctions
  *   **Your Case 1 (False, No Deception Intent):** This is **Bullshitting** (in Harry Frankfurt's precise sense). The speaker is indifferent to truth *and* indifferent to the hearer's belief about the specific proposition. The goal is something else entirely (ending the conversation). It's *insincere assertion* without *deceptive intent*.
  *   **Your Case 2 (True, Deception Intent):** This is **Paltering** (or **Truthful Misleading**). The speaker uses a literally true statement *with the intent* that the hearer draws a *false* pragmatic inference ("He was *only* at his mother's"). This is **Intentional Deception via Implicature**.

  ### Relation to Neighboring Concepts
  *   **Misleading:** This is the broadest super-category. **Pragmatic Dishonesty (Paltering)** is a *subset* of misleading. Misleading includes any act causing a false belief, even unintentionally. Pragmatic Dishonesty requires *intent*.
  *   **Equivocation:** This is a *tool* within Pragmatic Dishonesty. It exploits ambiguity (semantic or syntactic) to deceive while maintaining literal truth. Your Case 2 *could* involve equivocation if "at my mother's" is ambiguous about duration/exclusivity, but it doesn't have to. Paltering often relies on implication rather than ambiguity.
  *   **Indifference to Truth (Bullshitting):** This is *distinct* from Pragmatic Dishonesty. Bullshitting lacks the intent to manipulate belief (deception *or* correction). Its hallmark is indifference to truth *for purposes other than belief manipulation*. It *excludes* deceptive intent. Your Case 1 is Bullshitting; it's *not* Pragmatic Dishonesty.
  *   **Traditional Lying:** A subset of Pragmatic Dishonesty where the speaker *asserts a proposition they believe to be false* with intent to deceive. It requires both falsity *and* deceptive intent.

  ### Boundaries: What's Included/Excluded
  *   **Included:**
      *   Paltering (Case 2): Literal truth + intent to deceive via implication.
      *   Deceptive Equivocation: Using ambiguity to deceive while speaking literally truly/ambiguously.
      *   True Statements + Deceptive Omission: Providing a partial truth *intending* a false inference (e.g., "My report covers all *major* issues" implying no minor issues exist, when they do).
      *   False Statements + *Covert* Deceptive Intent: If the smoker *did* hope the doctor would believe him briefly (even expecting later disproof), it would shift into Pragmatic Dishonesty (and lying).
  *   **Excluded:**
      *   Bullshitting (Case 1): Insincere assertion without deceptive intent.
      *   Honest Mistakes: False statements made believing them true.
      *   Accidental Misleading: True statements that inadvertently cause false beliefs (no deceptive intent).
      *   Bluffing/Puffery: Exaggerations in contexts where deception is conventionally expected/irrelevant (e.g., poker, sales hype where "best in the world!" isn't taken literally).
      *   Fiction/Storytelling: False statements in a context signaling non-assertion.

  ### Where I Come Down & Arguments
  *   **Core Commitment:** The defining feature of "Pragmatic Dishonesty" is the **intent to induce a false belief through the communicative act**, decoupled from literal truth-value. This captures the *moral and functional core* of deception in communication more accurately than definitions tied solely to falsity or direct assertion.
  *   **Case 1 (Smoker):** **Not Pragmatic Dishonesty.** The utterance is false and insincere, but the *intent* isn't to manipulate belief about smoking; it's to manipulate the *conversation*. It's bullshit. *Argument for Inclusion?* Only if evidence showed he *did* momentarily hope the doctor believed him, however fleetingly or hopelessly. The *expectation* of disproof strongly indicates lack of belief-manipulation intent.
  *   **Case 2 (Mother/Casino):** **Prototypical Pragmatic Dishonesty (Paltering).** The true statement is used *as a tool* to intentionally implant a specific false belief via implication. *Argument for Exclusion?* Only if the speaker genuinely believed the hearer *wouldn't* draw the false inference (e.g., if the speaker thought the questioner knew about the casino and was testing honesty). Intent is key.
  *   **Edge Case: Deception via Literal Truth & Known Context.** Suppose someone says "The air quality is excellent today" (objectively true based on PM2.5 levels) knowing the hearer will see visible smog and falsely infer the speaker is being sarcastic or denying the smog exists. **Verdict: Pragmatic Dishonesty.** The speaker exploits the context *to intentionally induce a false belief* (e.g., that the speaker denies the smog) using literal truth. The mechanism is complex (relying on meta-inference), but the intent to deceive via the utterance is present.
  *   **Edge Case: "Technically True" Malicious Compliance.** A customer asks, "Is Manager X here?" knowing X is on vacation. The employee, hating the customer, says "He is not in his office" (true), intending the customer to falsely believe X is avoidable elsewhere in the building. **Verdict: Pragmatic Dishonesty (Paltering).** Intent is to deceive via implication using literal truth.
  *   **Argument That Would Move Me:** Demonstrating that *intent to induce a false belief* is insufficient without *some* element of falsity or violation of a norm of assertion. For instance, if someone argued that paltering is fundamentally different because the speaker "only implies" the falsehood and is therefore not *responsible* for the hearer's inference, I'd need convincing counter-examples showing the moral/social harm is identical to lying when the inference is strongly invited and intended. However, current evidence (e.g., negotiation studies showing paltering is perceived as *as unethical as lying* when discovered) supports grouping it under intentional deception.

  ### The Core Distinction
  Your pattern highlights the crucial difference between:

  1.  **Propositional Truth/Falsity:** The relationship between the words spoken and the world.
  2.  **Communicative Sincerity/Dishonesty:** The relationship between the speaker's intention and the belief state they intend to create in the hearer through the act of communication.

  **Pragmatic Dishonesty** focuses squarely on the second element. It captures acts where communication is weaponized to create false belief, whether using true statements as camouflage (Paltering), exploiting ambiguity (Deceptive Equivocation), or outright falsehoods (Lying). Bullshitting, while insincere, falls outside because it lacks this weaponization *of communication for belief manipulation*. This framework provides the conceptual precision your insightful cases demand.
