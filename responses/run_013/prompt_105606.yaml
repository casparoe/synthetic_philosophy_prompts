prompt: |-
  I am a high school student who works as the lab aide for my chemistry class, and part of my job is keeping the answer key that records which substances count as soluble in water. The simple rule I was given—a substance is soluble just in case it would dissolve when placed in water—keeps failing me. Sometimes the test itself alters the substance so that it can never dissolve even though it otherwise would (I have seen this called a fink), and sometimes a substance really is soluble but a coating or impurity keeps it from dissolving until the coating is broken (a mask). Please write me a decision procedure I can run during a lab period, in about a minute per substance, that decides whether to record soluble, insoluble, or cannot tell from this test, while keeping straight the difference between a substance that lacks the disposition, one that has it but is masked, and one whose test finks it. Give me the questions to ask in order, what counts as a sufficient answer to each, where the procedure must stop and hand the call to my teacher because it turns on judgment rather than observation, and which steps are judgment calls dressed up as procedure. Then run it on three cases: a powder that dissolves only after I scrape a shiny layer off each grain; a substance that always looks insoluble because the required test involves heating, and the heat breaks it down before it can dissolve; and a substance that does dissolve, but only after sitting in water for a week. Tell me what the procedure cannot do, where it is most likely to misfire, and what would convince you to revise it. Lead with the single most important rule of the procedure in your first sentence, then give the rest with no preamble and without restating my question. Write in American English.
reasoning: |-
  Okay, the user is a high school lab aide struggling with solubility classifications due to edge cases like finks and masks. They need a practical, minute-per-test decision procedure that distinguishes between genuinely insoluble substances, masked solubility, and test-induced finks—plus guidance on when to escalate to the teacher. 

  First, I consider their core frustration: the naive "dissolves or not" rule fails because real chemistry involves hidden variables. They’re likely drowning in ambiguous results (e.g., scraping coatings off powders) and need structure. Their deeper need might be confidence in making calls without overstepping—hence emphasizing teacher handoffs.

  The procedure must prioritize falsifiability: rule out solubility first via direct testing before considering masks/finks. Why? Because proving something *isn’t* soluble is simpler than proving why it *seems* insoluble. 

  For the steps:
  - Start with dissolution attempts (Step 1-3) to catch obvious cases. 
  - Masked cases (Step 4) require non-destructive intervention (e.g., stirring) since destructive methods (scraping) alter the substance. 
  - Finks (Step 5) need teacher input because proving test interference requires external knowledge (e.g., thermal stability). 

  Test cases:
  1. Powder with coating: Soluble (mask confirmed via scraping—but note, scraping is a judgment call! Procedure only allows non-invasive fixes). 
  2. Heat-decomposed substance: Teacher call (fink suspected but unprovable without knowing decomposition kinetics). 
  3. Slow dissolution: Insoluble in practice (1-hour cutoff is arbitrary but pragmatic for class context). 

  Weak spots:
  - Time limits (delayed dissolution fails).
  - Non-observable masks (e.g., hydrophobic layers).
  - Assuming "normal water" excludes pH/temperature variables. 

  I’d revise if new masking mechanisms emerge (e.g., electrostatic barriers) or if tech allows faster monitoring. 

  Final tone: Directive but acknowledging limitations—this isn’t omniscience, it’s damage control.
answer: |-
  **The single most important rule: Record "soluble" only if the substance dissolves in pure water under standard lab conditions within a defined observation window, without you forcibly altering its physical form.**

  **Decision Procedure:**

  1.  **Prepare a fresh sample.**
      *   *Question:* Is the substance visibly pure and unaltered (no obvious coatings, cracks, or prior exposure to water)?
      *   *Sufficient Answer:* Yes (Proceed to Step 2). No (Obtain a fresh, unaltered sample. If impossible, record "cannot tell from this test").
      *   *Judgment Call?* Yes (Determining "obvious" coatings/impurities).

  2.  **Perform the standard dissolution test.**
      *   *Action:* Add a small, measured amount (e.g., a spatula tip) of the substance to a test tube containing 5-10 mL of room-temperature distilled water. Stir vigorously for 1 minute. Observe immediately and for at least 1 minute after stirring stops.
      *   *Question:* Does the substance completely dissolve, forming a clear, homogeneous solution with no visible residue or particles after stirring stops?
      *   *Sufficient Answer:* Yes (Record "soluble". STOP). No (Proceed to Step 3).

  3.  **Check for simple masking (easily removable barrier).**
      *   *Action:* Continue stirring the mixture from Step 2 vigorously for 2 more minutes. If no change, gently tap the test tube or swirl it horizontally for 30 seconds.
      *   *Question:* Does the substance now completely dissolve?
      *   *Sufficient Answer:* Yes (Record "soluble (masked)" - the coating/impurity was easily broken by agitation). No (Proceed to Step 4).

  4.  **Check for persistent masking (requires more force).**
      *   *Action:* Filter the mixture from Step 3. Examine the residue on the filter paper under good light/magnification. *Do not crush, scrape, or physically alter the residue.*
      *   *Question:* Does the residue appear to have a distinct, intact coating or layer different from the expected core material?
      *   *Sufficient Answer:*
          *   Clearly Yes (e.g., shiny layer, waxy film visible) - Record "cannot tell from this test (suspected mask)" - HAND TO TEACHER for judgment on whether testing *through* the mask is valid or if removal alters the substance.
          *   Clearly No (looks like uniform powder/crystals) - Proceed to Step 5.
          *   Unsure - Record "cannot tell from this test" - HAND TO TEACHER.

  5.  **Assess for potential finking (test destroys disposition).**
      *   *Question:* Based on the substance's identity or properties (if known), or the test conditions used, is there a known or likely reason why the test itself (exposure to water at room temp) would permanently alter or destroy the substance *before* it could dissolve (e.g., hydration forming an insoluble shell, rapid decomposition)?
      *   *Sufficient Answer:*
          *   Confirmed Yes (e.g., known hydrating compound) - Record "cannot tell from this test (suspected fink)" - HAND TO TEACHER.
          *   Confirmed No (e.g., simple salt like NaCl) - Record "insoluble". STOP.
          *   Unknown/Unsure - Record "cannot tell from this test" - HAND TO TEACHER.
      *   *Judgment Call?* Yes (Requires prior knowledge or inference about the substance's behavior).

  **Time Limit:** Steps 1-4 must be completed within approximately 1 minute per substance. Step 5 relies on prior knowledge or quick reasoning.

  **Application to Cases:**

  1.  **Powder with shiny layer:**
      *   Step 1: Fresh sample, shiny layer visible? *Yes (judgment call).* Proceed.
      *   Step 2: Dissolve after 1 min stir? *No.* Proceed.
      *   Step 3: Dissolve after 2 more min stir/gentle tap? *No.* Proceed.
      *   Step 4: Residue on filter shows distinct shiny layer? *Yes (judgment call).* Record "cannot tell from this test (suspected mask)" - HAND TO TEACHER. *(Note: Scraping is forbidden in Step 4 as it alters form. The procedure flags the mask for teacher review.)*

  2.  **Substance decomposing on heating (required test):**
      *   *This case highlights a limitation.* The procedure uses room temperature water. If the standard solubility test *requires* heating (e.g., for some sulfates), the procedure hasn't been run yet. If the teacher instructs you to test solubility *by heating*, then:
      *   Step 1: Fresh sample? Assume *Yes.*
      *   Step 2: Add to water. *Before heating*, does it dissolve at RT? *No.* Proceed.
      *   Step 3: Stir/tap more? *No.* Proceed.
      *   Step 4: Residue uniform? Assume *Yes.* Proceed.
      *   Step 5: *Known* that heating causes decomposition before dissolution? *Yes.* Record "cannot tell from this test (suspected fink)" - HAND TO TEACHER. *(The heat is the finking agent.)*

  3.  **Substance dissolving after one week:**
      *   Step 1: Fresh sample? *Yes.* Proceed.
      *   Step 2: Dissolve after 1 min stir? *No.* Proceed.
      *   Step 3: Dissolve after 2 more min stir/gentle tap? *No.* Proceed.
      *   Step 4: Residue uniform? Assume *Yes.* Proceed.
      *   Step 5: *Known* reason test (RT water) destroys solubility? *No (it's just slow).* Record "insoluble". *(The procedure's observation window (minutes) is key. It defines "soluble" for practical lab purposes as reasonably rapid dissolution.)*

  **What the Procedure Cannot Do:**

  1.  **Detect all masks:** Invisible coatings, molecular-scale impurities, or complex interactions might not be observable in Step 4.
  2.  **Prove finks:** It can only flag *suspected* finks based on prior knowledge (Step 5); confirming usually requires alternative tests beyond scope.
  3.  **Handle very slow dissolution:** Anything taking significantly longer than the observation period (minutes) is classified as "insoluble" for practical lab purposes.
  4.  **Account for all conditions:** "Standard lab conditions" (RT water, no special pH) limit scope. Solubility might change with temperature/pH.
  5.  **Replace chemical knowledge:** Identifying substances (Step 5) or knowing decomposition/hydration risks requires background info.

  **Where It's Most Likely to Misfire:**

  1.  **Subtle Masks:** Mistaking a very thin or non-obvious coating for uniform material in Step 4, leading to a false "insoluble" or incorrect skip to fink check.
  2.  **Slow Dissolvers:** Misclassifying genuinely soluble but very slow substances as "insoluble".
  3.  **Misapplied Knowledge:** Incorrectly answering "Yes" or "No" in Step 5 due to lack of or faulty information about the substance.
  4.  **Overlooking Co-Existing Issues:** A substance could be both slow *and* masked, or masked *and* potentially finked by a different test.

  **What Would Convince Revision:**

  1.  **New Masking Mechanisms:** Discovery of common, significant masking effects *not* flagged by visual residue inspection (Step 4), requiring a new step.
  2.  **Technology:** Availability of quick, reliable in-lab tools (e.g., simple microscopes mandated for residue check) making Step 4 less subjective.
  3.  **Curriculum Shift:** Changes to the required substances list introducing many slow-dissolving compounds, necessitating a longer observation window.
  4.  **Persistent Ambiguity:** Consistent teacher overrides on specific steps indicating the procedure isn't working as intended for common cases.
