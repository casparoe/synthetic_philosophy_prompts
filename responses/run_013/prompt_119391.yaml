answer: |-
  ## Opening Remarks for the Citizens' Assembly  
  *(Approx. 1000 words; British English; Plainspoken; Addresses Core Concerns)*

  Good morning. My name is [Your Name], and I’m a local writer. Until recently, the idea of a town run by lottery lived only in my novels. Now, it’s here. You sixty people, chosen by chance off the electoral roll, are about to become the first Citizens’ Assembly of [Town Name]. Some of you are curious. Some are deeply unsure. And I know at least a few of you are downright furious about being roped in. That’s entirely fair. It’s an enormous thing to be asked. So, let’s not pretend this is normal. It’s not. Let’s look straight at what it is, and what it isn’t.

  First, what it *isn’t*. It isn’t an election. You didn’t campaign. You didn’t make promises. Nobody voted for you. And crucially, nobody can vote you *out*. Your service ends in eighteen months, regardless. That’s the design: the "one-way door". You serve, and then you step away, barred from elected office here for six years. The activists call this "term limits done right." They have a point – it stops anyone building a decades-long career here, like our much-respected Doreen and others who’ve given tremendous service. But let’s be honest about the trade-off. While you rotate in and out, the people who *always* remain – the clerks, the officers, the consultants – their influence doesn’t rotate. It persists. Your job, collectively, is to be the fresh eyes, the common sense, the voice of the *now*, pushing back against the inertia of the permanent machine. The "one-way door" protects us from career politicians, but it hands immense responsibility *to you* to be the check on the permanent structure while you’re here. Don’t underestimate that.

  So, what replaces the fear of the ballot box? What stops this becoming unaccountable? It’s not the same thing, and we shouldn’t pretend it is. Elections create a direct, personal threat: "Do badly, get thrown out." That’s gone. Instead, we’ve built something different into the system.

  1.  **Rotation & Continuity:** You don’t all start fresh. A third of you leave and are replaced every six months. That means there are always people here who’ve been doing it longer, who know the ropes, the history, the context. It injects new perspectives constantly, but avoids the chaos of sixty complete novices every eighteen months. The discipline comes from knowing you inherit the work of those before you, and you must leave things in a state fit for those who come after. It’s a relay race, not a series of sprints where you only care about your own lane.
  2.  **The Second Panel:** Any big decision you make? It doesn’t just become law. Six months later, thirty *different* people, chosen by lot that very morning, will sit in secret. They’ll look at your decision, cold. They won’t know the arguments you had, the pressures you felt. They’ll just see the outcome. And they can send it back to you, once. Just once. That’s a powerful check. It forces you to think: "Will this stand up? Will it make sense to strangers months from now, with none of our inside knowledge?" It’s accountability delayed, but accountability nonetheless. It demands clarity and fairness baked into your decisions from the start.
  3.  **The Council’s Override (and Transparency):** The old Council isn’t vanishing. They retain a final safeguard: a two-thirds vote to override you. But crucially, they *must* publish their detailed reasons why, right alongside yours. And you *must* publish yours in full. No hiding. No vague excuses. This forces both you *and* the Council into the open. Your reasoning has to be robust enough to withstand public scrutiny and the potential of being overridden by a high bar. Theirs has to justify overturning the considered view of a representative group of citizens. Sunlight is a powerful disinfectant.

  Now, the awkward bit. Consent. Sixty of you didn’t volunteer. You were called up, like jury service. And now you’re being asked to make decisions that bind everyone here, including me. How is that legitimate? It’s a fair question. It’s legitimate not because you wanted it, or campaigned for it, but because *any one of us* could have been sitting in your seat. The roll of the dice was fair. You are, as near as makes no difference, a random sample of us. Your job isn’t to represent your *own* interests, or the interests of people who voted for you – because nobody did. Your job is to represent *what seems fair and reasonable to a group of ordinary people* who’ve taken the time to learn the facts, listen to each other, and deliberate. That’s a different kind of legitimacy, grounded in fairness of process and representativeness, not in campaigning or popularity contests.

  That leads to the sample question. Because you’re a sample, not a mandate, there’s no point lobbying you *as candidates*. No one can buy your future vote because you won’t *have* a future vote here after eighteen months. That’s genuinely powerful. But… the second panel? They meet in secret. Is that the same as being un-lobbyable? Honestly? We don’t know yet. The secrecy is meant to protect them from pressure, to let them judge purely on the merits placed before them. It *aims* to be un-lobbyable. But it’s an experiment. We’ll need vigilance, and perhaps review, to see if that secrecy truly delivers the impartial fortress it’s meant to be, or if it creates other shadows. Transparency where possible, fairness always – those need to be our watchwords.

  So, to the sixty of you. You look apprehensive. Good. That shows you grasp the weight of this. You weren’t chosen because you’re experts. You were chosen because you’re *us*. Your qualification is your life here, your common sense, your ability to listen, learn, and talk to each other honestly. You’ll be supported – with information, with time, with impartial advice. But the judgments? Those are yours. Your task is immense: to be the town’s common sense, amplified and focused.

  To the activists: You wanted more. I know you see compromise here. But look at the mechanisms: rotation, the second panel, the one-way door, the transparency rules. They are not just decorations. They are the engineered replacements for electoral pressure. They are *different*. They might be clumsy. They might need adjustment. But they are a serious attempt to build a structure that forces careful, considered, publicly justifiable decisions from a group of ordinary people. Argue their merits fiercely, absolutely. But recognise the intent behind their design.

  To our long-serving councillors, like Doreen: Thank you. Your experience, your love for this town, is a resource, not a relic. The Assembly will need context, history, understanding of how things actually work on the ground. They’ll need your wisdom, offered freely and without expectation of control. This isn’t about replacing dedication like yours; it’s about finding a new way to channel the town’s collective wisdom alongside it.

  We’ve given up the clear, brutal discipline of the ballot box. We’ve given up the idea of representatives chosen by popular acclaim. In its place, we’re betting on a different set of forces: on random selection creating a true mirror of the town; on rotation preventing stagnation; on structured scrutiny (the second panel, the Council’s high-bar override) providing checks; and on radical transparency forcing clear justification for decisions.

  It’s an experiment. It might work brilliantly. It might need fixing. It might, possibly, fail. But it starts today. It starts with you sixty. Your task isn’t to be perfect, or to please everyone. Your task is to listen, learn, deliberate honestly, make the best decisions you can for [Town Name] as you see it, and explain *why* you did it, clearly, for all of us to see and judge.

  Good luck. We’re all counting on you. Let’s begin.
