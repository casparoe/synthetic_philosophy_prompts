  Next, empirical patterns. Ambiguity aversion isn't stable; it reverses between gains and losses or varies with competence. If it were purely about missing information, it should be consistent, but it's not. Also, it's domain-dependent, which undermines the idea that it's a rational response to under-specification.

  The unfalsifiability risk: if "under-specification" can be applied anywhere, what cases does it exclude? The friend might say it only applies when probabilities are truly unknown, but in practice, it's hard to define. This makes the position vague and potentially untestable.

  On the second-order preferences question: yes, you can model ambiguity aversion as a preference over sets of probabilities (like in max-min models), but this reclassifies it rather than explaining it away. However, this might make it seem like an ordinary preference, but the coherence issues remain problematic.

  For the information vs. description point: studies show framing affects ambiguity aversion. If it were about actual information, it should be invariant to how it's presented, but it's not. This suggests it's more about perception than rational response.

  What would the friend concede? Probably that ambiguity aversion isn't always rational, especially when it leads to incoherence. The position might survive only as a critique of Savage's completeness assumption but not as a full alternative normative theory.

  The most decisive defeater is the Dutch book argument, showing practical incoherence. The position is exposed because it can't handle cases where preferences lead to guaranteed losses. I'll end with the answer as specified.
answer: |-
  ### Putting the Position on Trial: Defeaters and Vulnerabilities

  Your friend's position—that ambiguity aversion in the Ellsberg paradox is rational due to genuine under-specification—has intuitive appeal but faces critical weaknesses. Below, I rank defeaters from fatal to awkward, classify them, and address your three questions. The most decisive objections reveal the position's normative fragility and empirical misalignment.

  #### **Ranked Defeaters**  
  1. **Fatal: Coherence/Money-Pump Vulnerability**  
     - **Type**: Coherence argument (Dutch book).  
     - **Why fatal**: Ambiguity-averse preferences can be exploited via a *dynamic* Dutch book. Suppose you strictly prefer betting on known urns (K) over ambiguous urns (A) for both red and black balls. A clever bookie can:  
       - Offer you a bet on K-red at a price you accept.  
       - Later, when uncertainty persists, offer a "hedge" bet on A-black (which you prefer over K-black due to aversion).  
       - These combined bets guarantee a loss if the ambiguous urn has unequal probabilities (e.g., 90% red/10% black).  
     - **Teeth**: This violates *dynamic consistency*. Your friend must concede that rational agents cannot be systematically pumped for money without irrationality. It shows ambiguity aversion isn't just about "missing facts" but about incoherent updating.  

  2. **Fatal: Empirical Instability Across Domains**  
     - **Type**: Empirical pattern it cannot accommodate.  
     - **Why fatal**: Ambiguity aversion reverses under losses (people seek ambiguity when facing possible losses) and varies with perceived competence (e.g., medical experts show less aversion in their field than novices). If aversion were purely a response to under-specification, it should be domain-invariant. Instead, it tracks *psychological comfort*, not epistemic gaps.  
     - **Teeth**: Your friend's "facts about the world" framing fails—the same urn description elicits different aversions based on framing or agent background. This aligns with prospect theory (ambiguity as loss aversion) but not with under-specification.  

  3. **Serious: Collapse into Rival Explanations**  
     - **Type**: Argument that the position reduces to a subjective preference.  
     - **Why serious**: The position *can* be redescribed as a preference over second-order prospects (e.g., maximizing the minimum expected utility over possible priors). But this doesn't make it vacuous—it reclassifies it as an ordinary (if complex) preference. However, this invites a *reductio*: if ambiguity aversion is "rational," so is any other smooth preference function (e.g., loving uncertainty). Normative force evaporates.  
     - **Teeth**: It forces your friend to admit this is *descriptively* valid but *normatively* optional—undermining the claim that it's uniquely defensible.  

  4. **Awkward: Unfalsifiability Risk**  
     - **Type**: Case it cannot describe / boundary problem.  
     - **Why awkward**: "Under-specification" is elastic. What would it exclude? Suppose an urn is explicitly described as having *no objective probability* (e.g., "filled by a capricious demon"). Here, aversion persists, but the position might still apply. Yet if we test it against a case where probabilities are *known but complex* (e.g., P(red) = √2/2), aversion diminishes—suggesting the issue is cognitive load, not under-specification.  
     - **Teeth**: It predicts nothing unique. A subjective expected utility (SEU) account with pessimism predicts aversion; your friend's account adds no testable excess content.  

  #### **Your Three Questions, Answered**  
  - **Can it be reduced to second-order prospects?**  
    Yes—but this reclassification strips normative privilege. It becomes a "strange-looking" preference that violates coherence (Defeater #1) and is empirically unstable (Defeater #2).  

  - **Does aversion track information or description?**  
    Overwhelmingly, it tracks *description* and *framing*. Studies show:  
    - Aversion vanishes if the ambiguous urn is described as "filled by a neutral machine, mechanism unknown" (same information, different framing).  
    - It intensifies when options are described negatively ("losing $10 if black" vs. "winning $10 if red").  
    This contradicts your friend's claim that it encodes "facts about the world."  

  - **Is the position unfalsifiable?**  
    It risks being so. To rescue it, your friend must specify *when* under-specification exists (e.g., "no symmetry principle applies"). But Ellsberg aversion arises even when subjects *know* the symmetric principle (e.g., they’re told coins were flipped but distrust the experimenter). This conflates under-specification with distrust.  

  #### **What Your Friend Must Concede**  
  Your friend’s position survives only as a *descriptive critique of SEU’s completeness assumption*, not as a normative alternative. He must concede:  
  - Ambiguity aversion cannot be universally rationalized without inviting Dutch books.  
  - It is not primarily about "missing facts" but about *psychological attitudes* (distrust, loss aversion).  
  - The "two agents" twist confuses *information* with *source credibility*: knowing a process is "fair" vs. "unspecified" is epistemically identical if no further details are given. The difference is in *trust*, not facts.  

  #### **The Decisive Test: Removing the Agent**  
  Imagine a *mechanism* choosing bets for a passive beneficiary using pre-committed rules. If the rule is "always prefer known probabilities," it avoids Dutch books and aligns with SEU. If it incorporates ambiguity aversion, it becomes exploitable. This shows aversion is a *psychological artifact*, not a rational response to under-specification.  

  **Final Verdict**: The position is **exposed**—it cannot resolve coherence failures or empirical inconsistencies.  

  \answer{Dutch books show practical incoherence; exposed}
