  We are writing a two-page proposal (1000-1200 words) for a small internal grant. The core idea is that the Tortoise's problem in Lewis Carroll's dialogue is not about justification but about the kind of state required for inference: premise-shaped states (propositional, truth-apt) are being added, but what's missing is a transitional state (non-propositional, not truth-apt). The project will investigate whether such transitional states can be appraised as correct or incorrect, and what this means for the normativity of logic.

  The proposal must:
  - State the question with a determinate answer.
  - Explain why existing responses leave a gap.
  - Lay out a concrete method (4-6 steps).
  - Include a timeline (6 months, one day a week).
  - Define success and failure conditions.
  - Address scope and an objection about the Tortoise being a stipulation.
  - End with a JSON summary.

  Structure the proposal as follows:

  1. **Title**: Working title (max 12 words)
  2. **Introduction**: Set up the problem, state the question, and the core move.
  3. **Gap in the Literature**: Why standard responses don't address the state-shape issue.
  4. **Method**: Concrete steps (a-d as specified, plus possibly one or two more).
  5. **Expected Outcomes and Risks**: What success looks like, failure conditions.
  6. **Scope and Timeline**: What will be done in 6 months and what to drop if needed.
  7. **Addressing the Objection**: The stipulation worry and a reply.
  8. **Conclusion**: Recap and significance.

  Then, compress into JSON as specified.

  ---

  **Proposal Draft**

  **Title**: Premise-Shaped States and the Missing Transition: Revisiting Carroll's Tortoise

  **Introduction**

  Lewis Carroll’s dialogue “What the Tortoise Said to Achilles” presents a regress problem: the Tortoise accepts the premises and the conditional of a modus ponens argument but refuses to draw the conclusion without an additional premise, leading to an infinite regress. Standard interpretations frame this as a puzzle about justification: how to stop the regress of reasons. This project challenges that framing. I argue that the Tortoise’s problem is not a lack of justification but a lack of a specific kind of mental state. The Tortoise operates exclusively with “premise-shaped” states—propositional attitudes (e.g., beliefs) that can be true or false, believed or doubted. What is missing is a “transitional state”: the act of inferring, which is not itself premise-shaped. This distinction reframes the central question: **Can transitional states be appraised as correct or incorrect, and if they cannot, what are the implications for the normativity of logic?** This question has a determinate answer: either transitional states are appraisable (and we must explain how), or they are not (and we must reconceive logic’s normative force).

  **Gap in the Literature**

  Existing responses to the Tortoise focus on justification. Some argue the regress stops with basic rules (Harman, Boghossian), others with dispositions (Ryle, Quine), practical commitments (Wittgenstein), or non-propositional knowledge-how (Ryle again). While these address why the regress *should* stop, they do not confront the state-shape mismatch. For instance, even if we say a disposition stops the regress, the Tortoise might accept a *premise* describing that disposition (e.g., “I am disposed to infer when I accept P and if P then Q”) without inferring. The gap is that all regress-stoppers proposed are either premise-shaped themselves (and thus subject to the Tortoise’s demand) or, if not, their non-propositional nature is not leveraged to explain why they escape the regress. This leaves open whether *any* non-premise-shaped state can serve as a regress-stopper and how it could be normative.

  **Method**

  The project will proceed in four concrete steps:

  1. **Define the criterion for premise-shaped states**: Any state that can be written on the Tortoise’s list (i.e., expressed as a proposition) counts as premise-shaped. This criterion is drawn from the dialogue itself and ensures the test is grounded in the Tortoise’s behavior.

  2. **Test candidate regress-stoppers**: Evaluate standard candidates against the criterion:
     - *Dispositions*: A disposition to infer (e.g., “I am disposed to accept Q when I accept P and if P then Q”). This can be written as a proposition, so it is premise-shaped and fails.
     - *Primitive inferential licenses* (e.g., Boghossian’s “blind but blameless” entitlements): If these are understood as non-propositional, they might survive—but we must show they cannot be premise-ified.
     - *Practical commitments* (e.g., Wittgensteinian “hinge” commitments): These are often expressed as propositions (e.g., “I commit to inferring via modus ponens”), making them premise-shaped.
     - *Knowing-how* (Ryle): Non-propositional, but can it be appraised as correct? This candidate has the best chance of survival.

  3. **Detailed analysis of one candidate**: Focus on knowing-how. Argue that if inference is a skill, it is not premise-shaped and thus escapes the regress. However, skills can be appraised (e.g., as competent or incompetent), so this might ground normativity without propositional justification. But if the appraisal of skill itself relies on premise-shaped standards (e.g., “competent inference satisfies logic”), we risk regress. Resolving this will show whether non-propositional appraisal is possible.

  4. **Reconceive normativity**: If transitional states cannot be appraised (e.g., if they are brute), logic’s normativity must be indirect (e.g., governing beliefs *about* rules) or non-cognitive (e.g., expressing ideals). If they can be appraised non-propositionally (e.g., as skillful), normativity is preserved but redefined.

  **Expected Outcomes and Risks**

  - **Success looks like**: A clear verdict on at least one candidate (e.g., knowing-how) showing whether non-premise-shaped states can be regress-stoppers and appraisable. This will yield a publishable paper arguing that logic’s normativity targets skills, not just beliefs, or (if the candidate fails) that normativity must be weakened to a descriptive regularity.

  - **Failure conditions**:
    1. The premise-shaped criterion is question-begging: If any candidate (e.g., a disposition) can be re-described as non-propositional, the distinction collapses.
    2. No candidate survives: If all proposed regress-stoppers are premise-shaped, the project shows the problem is insoluble—but this is still a result.
    3. The normativity question becomes intractable: If transitional states are appraisable but only circularly, the regress resurfaces.

  **Scope, Timeline, and Objection**

  - **Timeline** (6 months, ~8 days/month):
    - Month 1: Refine criterion and survey candidates.
    - Month 2: Test dispositions and inferential licenses.
    - Month 3: Analyze knowing-how in depth (core argument).
    - Month 4: Extend to normativity implications.
    - Month 5: Address objections (especially stipulation worry).
    - Month 6: Draft paper.

  - **Scope verdict**: This is ambitious for six months. **Drop the detailed analysis of multiple candidates**; focus solely on knowing-how (step 3) and one other (e.g., dispositions) for contrast. Leave the rest as promissory notes.

  - **Main objection and reply**:
    - *Objection*: The Tortoise is a stipulated irrational creature; real reasoners don’t behave this way, so the puzzle is artificial.
    - *Reply*: The Tortoise exposes a structural flaw in any account that reduces reasoning to premise-shaped states. Even if humans aren’t like the Tortoise, the challenge is to explain what *prevents* us from being like it—which requires a non-premise-shaped element. This buys a conditional result: *if* reasoning requires transitions, then...

  **Conclusion**

  By shifting focus from justification to state-shape, this project reframes Carroll’s puzzle as a problem about the architecture of reasoning. The outcome will clarify whether logic’s norms apply to transitional states and, if not, what this means for the authority of logic. Even if the project fails by its own criteria, it will advance understanding by forcing a reckoning with the non-propositional core of inference.

