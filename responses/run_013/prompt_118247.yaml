  ### Joint Statement of Adversarial Collaboration on Self-Locating Belief

  #### Part 1: Agreed Claims  
  1. **Self-Sampling Assumption (SSA)**: Other things equal, an agent should assign self-locating credences as if they were randomly selected from the set of all actual observers within a specified reference class.  
  2. **Self-Indication Assumption (SIA)**: Other things equal, an agent’s existence is evidence that must be accounted for; hypotheses entailing more observers are favored proportionally to the number of observers they imply.  
  3. **Nature of Disagreement**: The dispute concerns the normalization of self-locating credences, not facts about the world. It is methodological: how to weight first-person perspectives in probabilistic reasoning.  
  4. **Ceteris Paribus Clause**: Both principles apply only when non-self-locating evidence is symmetric. The clause suspends the principles when external evidence breaks symmetry (e.g., empirical data overrides armchair cosmology).  
  5. **Relevant Cases**: The following bear on the dispute:  
     - Sleeping Beauty  
     - Doomsday Argument  
     - Presumptuous Philosopher (armchair cosmology)  
     - Reference Class Expansion  
     - Nightshift Case  
  6. **Costs Conceded**:  
     - **SSA Concession**: SSA yields the Doomsday Argument, which may contradict intuitive eschatology.  
     - **SIA Concession**: SIA allows armchair resolution of cosmological questions, violating empiricist norms.  

