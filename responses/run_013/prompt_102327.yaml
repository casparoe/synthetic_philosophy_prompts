prompt: |-
  I'm putting together a seminar on where moral values get their authority, and before I wade through any more genealogies I want the spec first. So write me the desiderata -- the full list of what any adequate genealogy of a moral value has to deliver. Not one particular account; the criteria that any of them has to meet. Assume the point of the whole exercise is to let me tell, for a given value, whether an account of its history has actually undercut its authority or merely told me where it came from. That's the job I need done.

  So: the cases it has to get right, the distinctions it can't collapse, the explanatory work it has to do, each with the consideration behind it. The cases I keep coming back to are the drift in what counts as cruelty, the way a practice like punishment gets handed down and endlessly re-interpreted, and the awkward one -- whether tracing a value's origin is even the sort of thing that can strip its authority. On distinctions, I want at least these kept apart: explaining vs debunking, origin vs justification, a practice's original function vs its present one, and showing a belief is contingent vs showing it's false. Add whatever else you think can't be run together. And mark which of the requirements are non-negotiable and which are just the preferences of one camp.

  Then the bit I actually want: tell me which of these requirements can't all hold at once. I suspect theres a tangle at the centre of it -- if the genealogist uses standards like truth, or non-cruelty, or reason to cut down the value she's examining, and those standards have genealogies of their own, does the whole programme eat itself? Say plainly whether it does, whether that's fatal or a bullet worth biting, and which single requirement does the most to knock out the usual contenders.

  Then test your own list on a case that isn't the stock one. Take the modern ideal that your main job in life is to be true to yourself. Does the list tell me what a genealogy of that would have to do, and would the result be a debunking or just a story about where the ideal came from? If the list can't answer that, the list is wrong somewhere -- say where.

  You can close with a short verdict on how Nietzsche's own way of doing it fares against your list, and how the more functionalist or evolutionary debunking styles fare, but keep that part tight; the criteria are the main thing.

  Dont give me a menu of positions and leave me to pick. Commit: give me the list you'd actually defend, say where you'd dig in, and put your neck out on the self-undermining question.
reasoning: |-
  Okay, let me start by unpacking the user's request. They're organizing a seminar on the authority of moral values and need a set of criteria to evaluate genealogical accounts. The main goal is to distinguish between a genealogy that debunks a moral value versus one that merely explains its origin. 

  First, I need to identify the core requirements. The user mentioned specific cases: changing definitions of cruelty, the evolution of punishment practices, and whether tracing origins can strip authority. They also want key distinctions like explaining vs debunking, origin vs justification, etc. 

  The user’s deeper need seems to be a tool to critically assess genealogies without getting lost in theoretical debates. They want actionable criteria, not just a survey of existing positions. They also hint at a concern about self-undermining—if the standards used in debunking are themselves genealogically contingent, does the whole project collapse?

  I should structure the desiderata into categories: core non-negotiables and contextual preferences. Non-negotiables would include avoiding genetic fallacy, explaining practical authority, and handling contingency properly. Preferences might be about theoretical frameworks like functionalism or pragmatism. 

  The self-undermining issue is crucial. If a genealogy uses evaluative standards that it itself might debunk, that's a problem. But maybe it's addressable by adopting a pragmatic stance where the standards are provisional tools, not absolute truths. That way, the genealogy doesn't eat itself but remains useful for specific purposes.

  For the test case on "being true to oneself," I need to apply the criteria. A genealogy showing this ideal emerged from consumer culture and therapeutic practices might explain its rise. But does it undercut authority? Only if it reveals the ideal functions to serve capitalism or masks deeper alienation, challenging its emancipatory claims. The criteria should help decide if this is debunking or just an origin story.

  Nietzsche’s genealogy might struggle with self-undermining since he uses evaluative terms without clear grounding. Evolutionary approaches might reduce values to adaptive functions, risking the genetic fallacy. Both need careful handling to meet the core criteria.

  Finally, the list must be defensible. I’ll commit to the non-negotiables, emphasizing avoiding genetic fallacy and distinguishing origin from justification. The pragmatic approach to self-undermining seems the most viable, biting the bullet that all critique is context-dependent but still useful.
answer: |-
  Here’s your **Genealogical Adequacy Checklist** – a defensible set of criteria for evaluating *any* genealogy of moral values, designed to answer the core question: **"Does this history undercut authority, or just describe origins?"**

  ---

  ### **I. Non-Negotiable Desiderata**  
  *(Violating these invalidates the genealogy as a debunking tool)*  

  1. **Avoidance of the Genetic Fallacy Trap**  
     - *Must:* Rigorously distinguish **origin** from **justification**.  
     - *Why:* Tracing a value to power struggles, evolutionary instincts, or historical accidents *alone* cannot debunk it. Example: Newton’s calculus emerged from his theological obsessions, but that doesn’t invalidate its mathematical truth.  
     - *Test:* If the account implies "X originated in Y, therefore X is false/unjustified," it fails.  

  2. **Explanation of Practical Authority**  
     - *Must:* Explain **why this value commands obedience/respect** in its socio-historical context.  
     - *Why:* Authority isn’t self-explanatory. Genealogy must show *how* the value gained traction (e.g., social utility, psychological resonance, coercion).  
     - *Test:* Does the genealogy reduce authority *entirely* to illusion, error, or false consciousness? If so, it begs the question of why the illusion persists.  

  3. **Contingency Without Automatic Debunking**  
     - *Must:* Show the value’s **historical/cultural contingency** *without* equating contingency with falsehood.  
     - *Why:* Contingency is necessary but insufficient for debunking (e.g., democracy is contingent but not thereby invalid).  
     - *Test:* Does the account treat "this could have been otherwise" as synonymous with "this is arbitrary/unjustified"? If yes, it fails.  

  4. **Function/Meaning Distinction**  
     - *Must:* Separate a practice’s **original function** from its **current meaning/justification**.  
     - *Why:* Punishment may originate in vengeance, but its modern authority rests on deterrence or justice. Collapsing these conflates history with validity.  
     - *Test:* Does the genealogy imply that because punishment *began* as tribal retaliation, modern retributive justice is *nothing but* disguised barbarism?  

  ---

  ### **II. Contextual Desiderata**  
  *(Essential for explanatory power; failure weakens but doesn’t invalidate)*  

  5. **Dynamic Interpretation Tracking**  
     - *Must:* Explain **how reinterpretation shapes authority** across time.  
     - *Why:* Values like "cruelty" shift meaning (e.g., corporal punishment once "kind" discipline, now "cruel"). Genealogy must map how redefinitions sustain authority.  
     - *Test:* Can it explain why Victorian "self-reliance" morphed into neoliberal "self-optimization" without losing normative force?  

  6. **Debunking Mechanism Specification**  
     - *Must:* Identify **precise conditions under which genealogy debunks**.  
     - *Why:* Not all origins undermine authority. Debunking requires showing the value’s authority *depends* on false beliefs about its origin/nature (e.g., divine command).  
     - *Test:* If a value’s authority relies on the myth that it’s "timeless and universal," showing its recent invention *can* debunk. If not, it’s mere history.  

  7. **Immanent Critique Compatibility**  
     - *Must:* Allow evaluation **using standards internal to the value’s own framework**.  
     - *Why:* Using external standards (e.g., "biology proves morality false") is question-begging. Successful debunking exposes *internal* contradictions or false presuppositions.  
     - *Test:* Does the genealogy show "be true to yourself" undermines itself by assuming a coherent self that it actually fragments?  

  ---

  ### **III. The Self-Undermining Tangle: Solved**  
  **Does genealogy eat itself? No – if it meets Desideratum 7.**  
  - *Problem:* If you debunk Reason using Reason, or Morality using moral standards, you’re self-refuting.  
  - *Solution:* **Pragmatic bracketing**. Genealogy can temporarily adopt immanent standards (e.g., "truth," "non-cruelty") as *tools* for local critique without endorsing them transcendentally.  
  - *Bullet to bite:* Genealogy is **provisional and perspectival**, not a metaphysical tribunal. Its authority is practical: it helps us navigate values, not ground them absolutely.  
  - *Fatal flaw in contenders:* Ignoring this leads to **performative contradiction** (e.g., evolutionary debunkers presupposing rationality while calling it an adaptation).  

  **The knockout requirement:** **#6 (Debunking Mechanism Specification)**. Most genealogies fail by assuming origin-stories *automatically* debunk, without showing how authority *depends* on false origin-myths.  

  ---

  ### **Test Case: "Be True to Yourself"**  
  - **Genealogy:** Traces the ideal to 19c Romanticism + 20c consumer capitalism + therapeutic culture. Shows it functions to legitimize individualism, market choice, and self-branding.  
  - **Checklist Application:**  
    - **Contingency (#3):** Yes – it’s recent, culturally specific.  
    - **Practical Authority (#2):** Explains resonance via consumerism’s "authenticity" marketing.  
    - **Original vs. Current Function (#4):** Romantic "soul" vs. neoliberal "flexibility."  
    - **Debunking Mechanism (#6):** **Debunks if:** Authority relies on the myth of a "core self" existing prior to social forces. Genealogy shows the "self" is *produced by* the very forces the ideal claims to transcend.  
    - **Result:** **Debunking** (if it exposes this contradiction); **mere history** (if it just notes the ideal’s capitalist origins).  

  ---

  ### **Verdicts on Key Styles**  
  - **Nietzsche:**  
    - *Strengths:* Masters #2 (explaining authority via power), #5 (tracking reinterpretations of "good").  
    - *Fails:* #1 (slips into genetic fallacy by treating "slave morality" origins as *inherently* degrading), #7 (uses "nobility" as transcendent standard).  
  - **Evolutionary Debunking (e.g., Street):**  
    - *Strengths:* #3 (highlights contingency of moral intuitions).  
    - *Fails:* #1 (infers "moral truth inaccessible" from adaptive origins), #6 (no mechanism linking origin to *false presuppositions* in justification).  
  - **Functionalist (e.g., Foucault):**  
    - *Strengths:* #4 (separates punishment’s functions/meanings), #5 (tracks shifting power dynamics).  
    - *Fails:* #7 (rejects immanent critique; risks normative nihilism).  

  ---

  ### **The Takeaway**  
  A genealogy **undercuts authority** only if:  
  1. The value’s **current justification relies on false claims** about its origin/nature (e.g., "true self" as pre-social), *and*  
  2. The genealogy **exposes this dependency** using standards the value itself accepts.  

  **Your list is safe.** It forces genealogists to do the hard work: not just recounting history, but dissecting *how* history sustains or sabotages authority. If a genealogy can’t pass this test, it’s a chronicle – not a critique.
