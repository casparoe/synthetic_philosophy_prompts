  First, I need to identify the core questions that split the positions. The user specifically mentioned six leaf positions they want included. The challenge is building branches that lead to these without relying on pre-existing ideological labels. 

  Hmm... the first branching point should probably tackle whether moral psychology is even relevant to normative truth. That's the deepest split. The "no" path leads straight to leaf (1) - the separate compartments view. But the "yes" path needs further splitting.

  For the "yes" branch, the next logical question is about the reliability of moral foundations. If they're unreliable, that gets us to leaf (5) - the shaky foundations view. If reliable, then we need to ask whether breadth matters. 

  The breadth question is crucial for distinguishing leaf (2) wider-is-better from leaf (3) parochialism. But both assume foundations are reliable - which might need clarification. Also need to handle anti-realism leading to leaf (4), and constructivism as leaf (6).

  I notice leaf (6) - constructivism - might actually belong earlier in the tree. It's not about whether psychology bears on normativity, but how. Should it split off right after establishing relevance? Probably yes, as a third option alongside debunking and vindication.

  The user wants to know where the map might be wrong. Biggest risk is oversimplifying the reliability question - it's not binary. Also, "parochialism" might secretly rely on contested normative assumptions. And constructivism might not be a single leaf - there are multiple ways psychology could inform theory-building.

  For empty cells: the combination where foundations are reliable but breadth doesn't matter AND the extra foundations are bad seems both logically possible and actually occupied by some Kantians. Need to mention that exception.

  What would change the map? If Haidt's empirical claims were disproven, that would collapse half the tree. Or if someone proved moral foundations are hardwired evolutionary adaptations - that might force reevaluation of reliability arguments.
answer: |-
  Here's a logical decision tree mapping the positions on whether moral psychology (specifically left/right differences in Moral Foundations Theory - MFT) bears on *normative* moral truth. Each branch is a concrete question answerable without knowing the outcome, leading to your specified leaves. Positions are defined by their answers, not labels.

  **The Decision Tree**

  1.  **Does descriptive moral psychology (MFT findings) have *any possible bearing* on which moral claims are normatively true/correct?**
      *   **NO** → **Leaf 1: Separate Compartments** (e.g., "Interesting sociology, irrelevant to ethics.")
          *   *Rationale:* Facts about *how* people form moral judgments (psychology) are fundamentally different from facts about *what* makes those judgments true/correct (normative ethics). Knowing the origins tells us nothing about validity. (Common among Kantians, some utilitarians, non-naturalist realists).
      *   **YES** → Go to Question 2.

  2.  **Is the descriptive link between psychology and moral judgment *reliable* (i.e., do MFT foundations generally track *genuine* moral features/truths)?**
      *   **NO (Unreliable)** → Go to Question 3.
      *   **YES (Reliable)** → Go to Question 4.

  3.  **Is the unreliability severe enough to undermine the normative relevance of the *entire* MFT descriptive claim?**
      *   **YES** → **Leaf 5: Shaky Foundations** (e.g., "The left/right difference might not even be real or robust; arguing over its meaning is pointless.")
          *   *Rationale:* If the empirical claim (e.g., conservatives use more foundations) is methodologically flawed, culturally specific, or doesn't hold up under scrutiny (e.g., controlling for education, group identity, political strategy), then the normative debate based on it lapses. Focus shifts to debunking MFT itself. (Empirically skeptical critics).
      *   **NO (Unreliable but descriptive claim is solid)** → Go to Question 4 *from a debunking perspective*. (But note: This path is logically possible but rarely occupied *for MFT specifically* - see "Empty Cells" below).

  4.  **Given the (assumed reliable) descriptive difference (conservatives use more foundations), does greater *breadth* of foundations used indicate greater moral correctness?**
      *   **YES** → **Leaf 2: Wider is Better** (e.g., "Conservatives see more moral dimensions; their view is richer/more complete.")
          *   *Rationale:* Morality is complex. Foundations reflect deep-seated human concerns. Ignoring some (like Loyalty, Authority, Sanctity) leads to an impoverished, incomplete morality. Using more foundations captures more moral truth. (Haidt's own leanings, some communitarians).
      *   **NO** → Go to Question 5.

  5.  **Is the normative irrelevance of breadth due to the *specific character* of the "extra" foundations?**
      *   **YES** → **Leaf 3: Parochialism Reply** (e.g., "The 'extra' foundations conservatives use are precisely the tribalistic/hierarchical ones we should reject!")
          *   *Rationale:* The foundations emphasized more by conservatives (Purity, Loyalty, Authority) are evolutionarily geared towards group cohesion and hierarchy, often leading to exclusion, oppression, or irrationality. They are morally suspect, not virtues. Breadth here is a bug, not a feature. (Common progressive response).
      *   **NO (Breadth irrelevant for other reasons)** → *Logically possible but largely empty* (See "Empty Cells" below). Or, leads to **Leaf 4** or **Leaf 6** via different reasoning.

  6.  **Does the existence of diverse psychological foundations imply there is *no single normative moral truth* to be found?**
      *   **YES** → **Leaf 4: Anti-Realist Dissolution** (e.g., "Morality is just what our evolved brains spit out; neither side is 'right,' it's just different tastes.")
          *   *Rationale:* If moral judgments *just are* the outputs of these psychological systems, there's no deeper "truth" independent of them to adjudicate between foundations. MFT diversity explains moral disagreement but dissolves the "who's right" question. (Moral relativists, error theorists, some subjectivists).
      *   **NO (There is normative truth, psychology informs its content)** → **Leaf 6: Constructivist Raw Material** (e.g., "The foundations reveal basic human concerns ethics must address, but reason must shape them into a coherent moral view.")
          *   *Rationale:* The foundations identify fundamental human values/concerns that any plausible moral theory *must* engage with and try to integrate or justify. Psychology provides the "raw data" of human moral experience, but normative reasoning (e.g., consistency, avoiding harm, promoting flourishing) is needed to build the best theory. Neither side automatically wins; the foundations need critical evaluation and synthesis. (Kantian constructivists, sophisticated utilitarians, some neo-Aristotelians).

  **Empty Cells & Why**

  1.  **Q2: NO (Unreliable) + Q3: NO (Claim solid) + Q4: YES (Breadth good):** "The foundations are unreliable, the descriptive claim holds, and breadth is good." *Why empty?* Incoherent. If foundations are unreliable at tracking truth, claiming breadth of unreliable foundations is good makes no sense. (This path exists only to lead to debunking or alternative views).
  2.  **Q4: NO (Breadth irrelevant) + Q5: NO (Not due to character):** "The descriptive difference is real and reliable, breadth doesn't matter, but *not* because the extra foundations are bad." *Why empty?* Unattractive/Unexplored. If foundations reliably track genuine moral features, *and* breadth doesn't indicate correctness, *and* the extra foundations aren't inherently problematic, it's unclear *what* would make one set of foundations more correct. This position lacks a clear normative criterion derived from MFT. (Perhaps occupied by someone who thinks only *one* specific foundation matters, but they'd likely see the "extra" foundations as irrelevant *or* bad, fitting Leaf 3 or a niche view not covered).

  **Where the Map Might Be Wrong & What Could Change It**

  1.  **Collapsing Distinctions:**
      *   **Leaf 3 (Parochialism) vs. Debunking Aspect of Leaf 6:** A strong "Parochialism" view might functionally argue the "extra" foundations are *so* unreliable/suspect that they shouldn't be raw material either. The line between rejecting them outright (Leaf 3) and seeing them as problematic raw material needing radical transformation (Leaf 6) can blur. *What changes it?* Clarity on whether the critic believes *any* positive moral content can be salvaged from foundations like Purity/Authority within a reformed theory.
      *   **Leaf 1 (Separate Compartments) vs. Leaf 6 (Constructivist):** Some strict moral realists (Leaf 1) see *no* role for psychology, while constructivists (Leaf 6) see it as essential raw material. But a constructivist might argue their *output* is objective truth, looking like Leaf 1 to an outsider. *What changes it?* Does the view allow descriptive psychology (like MFT) to *constrain* or *inform* what counts as a viable normative theory? If yes, it's closer to Leaf 6; if no, Leaf 1.
  2.  **Hidden Occupied Cell:** The "Empty Cell" **Q4: NO + Q5: NO** might be occupied by **Moral Particularists** who reject general rules/foundations entirely. They might agree the psychology is real/reliable but think moral truth is always context-specific, so counting foundations is meaningless. (I omitted this as a distinct leaf per your request, but it's a possible seventh view).
  3.  **Empirical Shifts:**
      *   **Undermining Q2/Q3:** Strong evidence that MFT foundations *are* reliable adaptations tracking genuine fitness/cooperation benefits (or conversely, overwhelming evidence they *are* purely irrational biases) would strengthen/reduce skepticism for paths relying on reliability/unreliability.
      *   **Undermining Q4/Q5:** Evidence that societies emphasizing "broader" foundations are *not* more stable/flourishing, or that "narrower" foundations societies avoid specific harms more effectively, would challenge Leaf 2 and Leaf 3 respectively. Cross-cultural studies on foundation use and societal outcomes are key here.
  4.  **Conceptual Shifts:** A powerful argument showing that *any* appeal to psychological origins *necessarily* commits the genetic fallacy (confusing origin with validity) could collapse the whole "YES" branch into Leaf 1. Conversely, a strong argument that moral truth *must* be grounded in human psychology/nature could make Leaf 1 untenable for many.
  5.  **"Wider is Better" Nuance:** Leaf 2 might split. One version: "More foundations = more truth *content*" (Haidt-ish). Another: "Using more foundations leads to *better moral judgment* (wisdom, less bias)" – which is a psychological, not directly normative, claim. If the latter, it might fit better under Q2 as a claim about reliability.

  **In Plain Terms for the Dinner Table:**

  Think of it like taste buds:
  1.  **Separate Compartments:** Knowing conservatives have more active taste buds tells us nothing about whether chocolate *actually* tastes better than vanilla. (Psychology vs. Truth).
  2.  **Wider is Better:** More taste buds mean they experience flavors more richly; their preference is likely more accurate.
  3.  **Parochialism Reply:** The "extra" taste buds are for detecting poison or rot! It's good they notice, but it doesn't make rotten fruit taste *good*.
  4.  **Anti-Realist Dissolution:** "Tastes better" is just what our taste buds say. Neither side is "right," it's just biology.
  5.  **Shaky Foundations:** Maybe conservatives don't *really* have more active taste buds – the test is flawed.
  6.  **Constructivist Raw Material:** Taste buds tell us what flavors humans can detect. A great chef uses that knowledge to create dishes that are objectively balanced and delicious, considering all sensations.

  **Use This At Dinner:** Ask: "Okay, *first* – do you think that *how* people's brains make morals (the psychology) tells us *anything* about what's *actually* right or wrong?" That gets you to Branch 1. Follow the tree from there based on answers. It forces clarity on *why* people think the psychology matters or not, cutting through the rehashing. Good luck!
