answer: |-
  Below is a sorting instrument designed as a quiz to categorize your stance on hinge epistemology based on concrete case judgments. The quiz consists of 10 scenarios with 2-3 mutually exclusive responses each. Responses are phrased to avoid theoretical jargon, allowing you to choose based on intuitive reactions to the cases. The scoring key maps your answer pattern to one of the eight specified outcomes, with a label, key commitments, what the position denies, and common confusions. I also note indistinguishable positions and unoccupied combinations.

  ### Quiz Instructions
  For each scenario, select **one** response that best reflects your view. Answer based on your immediate judgment, not theoretical labels.

  1. **Traumatic Loss of Certainty**: After a traumatic brain injury, a person becomes convinced their hands are not their own and might vanish at any moment. They no longer take their hands for granted.  
     A. This is a breakdown in a fundamental way of engaging with the world; their basic actions (e.g., using hands) are disrupted, not their beliefs.  
     B. They have lost a necessary foundation for rational thought; this loss is pathological and prevents normal functioning.  
     C. They have adopted a new framework of certainty; their new view (that hands are unstable) is just as valid as their old one.  

  2. **Moral Certainty Shift**: Someone raised in a culture where cruelty to children is accepted comes to see it as deeply wrong after exposure to other societies.  
     A. Cruelty to children is objectively wrong; the person has discovered a universal moral truth, and their former culture was mistaken.  
     B. Moral wrongness is a community-dependent commitment; neither their old nor new view is objectively better, only different.  
     C. Wrongness isn't about truth or belief; it's a deep-seated moral reaction, and the person has developed a new sensibility through experience.  

  3. **Religious Conversion**: A devoutly religious person loses their faith after a personal tragedy and becomes an atheist.  
     A. This shift cannot be called rational or irrational; it's a brute change in what they treat as unquestionable.  
     B. The shift is rational because the tragedy provided evidence against a benevolent God.  
     C. The shift is a loss of foundational trust, like losing faith in a friend; it isn't about evidence or reasons.  

  4. **Doubt in Daily Life**: While cooking, a person starts doubting whether the stove in front of them is real.  
     A. This doubt is nonsensical; it lacks a context or method for resolution (e.g., they keep cooking anyway).  
     B. The doubt is genuine but unanswerable; the stove's reality must be assumed for inquiry to function.  
     C. The doubt is confused; their certainty about the stove shows in their actions (e.g., turning knobs), not in beliefs they state.  

  5. **Scientific Framework Change**: A scientific community has long assumed that all diseases have biological causes. After studying psychosomatic illnesses, they accept that some diseases lack physical causes.  
     A. This is a rational update based on new evidence; the old assumption was always open to revision.  
     B. The old assumption was a constitutive rule of medical inquiry; the change is a shift in frameworks, not justified by evidence within the old system.  
     C. The old assumption wasn't a deep commitment; it was a testable hypothesis that got refuted.  

  6. **Memory Reliability**: A person is certain their childhood memories are reliable, even though they have occasional errors and no proof.  
     A. This certainty is an entitlement; they can rely on it without evidence for inquiry to work.  
     B. This certainty is a matter of trust in their mind, like trusting a friend; it isn't rational or irrational, just necessary.  
     C. This certainty is knowledge; they know their memory is reliable without needing to defend it.  

  7. **Radical Scepticism in Practice**: Someone lives as if the physical world is an illusion (e.g., they avoid touching objects, fearing they aren't solid).  
     A. This is incoherent; meaningful doubt requires a method and context (e.g., testing solidity), which they lack.  
     B. Their doubt is valid but paralyzing; we must assume the world's reality to act, though it can't be proven.  
     C. Their behavior shows a different way of acting; the "doubt" isn't a belief but a practical stance.  

  8. **Grief and Loss of Meaning**: After a devastating loss, a person feels the world is unreal and life is meaningless. They function mechanically but without conviction.  
     A. They have lost a necessary condition for engaged living; this is a breakdown in their worldview.  
     B. Their new outlook (world as unreal) is a valid shift in fundamental commitments, not better or worse.  
     C. They have lost a basic trust in life; this change is existential, not about evidence or rationality.  

  9. **Moral Disagreement as Hinge**: Two people debate whether "torturing innocents for fun is always wrong." One treats this as an absolute certainty; the other denies it.  
     A. The first is correct; this is a universal moral truth, and the denier is making an error.  
     B. This is a clash of community-dependent hinges; neither can be judged from a neutral standpoint.  
     C. Wrongness is not a proposition; the first person is expressing a non-negotiable moral reaction.  

  10. **Hinge Revision in Crisis**: A lifelong pacifist, after experiencing violence, becomes certain that preemptive force is sometimes necessary.  
      A. This shift is rational; the experience provided evidence that their old certainty was flawed.  
      B. This is a change in foundational commitments; it cannot be assessed as rational, only as a new framework.  
      C. This is a transformation in their way of being (e.g., acting defensively); it isn't about beliefs or evidence.  

  ### Scoring Key
  Tally your responses. Each outcome corresponds to a pattern of answers. The outcome with the **most matches** is your result. If tied, see the note on indistinguishable positions.

  | Outcome | Label | Your Answers (Ideal Pattern) |
  |---------|-------|------------------------------|
  | **1** | **Animal Certainty** | Mostly **A** in Q1, Q4, Q7; **C** in Q2, Q3, Q9, Q10 |
  | **2** | **Constitutive Certainty** | Mostly **A** in Q2, Q9; **B** in Q1, Q4, Q5, Q8 |
  | **3** | **Entitlement** | Mostly **A** in Q6; **B** in Q4; **A** or **B** in Q1, Q8 (but not exclusively) |
  | **4** | **Unreflective Knowledge** | Mostly **A** in Q3, Q5, Q7; **C** in Q6; **A** in Q9 |
  | **5** | **Dissolution** | Mostly **C** in Q1, Q2, Q4, Q7, Q9; **A** or **C** in Q5, Q10 |
  | **6** | **Necessary but Unanswerable** | Mostly **B** in Q1, Q4, Q5, Q7; **A** in Q8 |
  | **7** | **Relativism** | Mostly **B** in Q2, Q5, Q7, Q9; **C** in Q1; **A** in Q3; **B** in Q8 |
  | **8** | **Fideistic Trust** | Mostly **C** in Q3, Q6, Q8, Q10; **B** in Q2 |

  #### Outcome Descriptions
  For your result, read the label, key commitments, what this view denies, and common confusions. Names of key defenders are included for reference only.

  1. **Animal Certainty**  
     - **Label**: Ways of Acting  
     - **Commitments**: Hinges are embodied actions (e.g., trusting hands, reacting morally), not beliefs or propositions. They show in practice and cannot be stated, doubted, or justified.  
     - **Denies**: That hinges are truth-apt or open to rational assessment.  
     - **Confused with**: (5) Dissolution (both reject propositions) or (8) Fideistic Trust (both focus on non-cognitive elements).  
     - **Defender**: Wittgenstein  

  2. **Constitutive Certainty**  
     - **Label**: Framework Propositions  
     - **Commitments**: Hinges are propositions that define rationality (e.g., "hands exist"). They are held with certainty and exempt from doubt/justification within the system they constitute.  
     - **Denies**: That hinges are arbitrary or revisable via evidence.  
     - **Confused with**: (4) Unreflective Knowledge (both treat hinges as certain) or (6) Necessary but Unanswerable (both emphasize necessity).  
     - **Defender**: Wright  

  3. **Entitlement**  
     - **Label**: Non-Evidential Warrant  
     - **Commitments**: Hinges are not known or justified, but we are entitled to them for inquiry to function (e.g., trusting memory). Entitlement is a rational permission without evidence.  
     - **Denies**: That hinges require evidence or can be knowledge.  
     - **Confused with**: (8) Fideistic Trust (both involve non-evidential acceptance) or (2) Constitutive Certainty (both reject evidentialism).  
     - **Defender**: Wright  

  4. **Unreflective Knowledge**  
     - **Label**: Inarticulate Knowledge  
     - **Commitments**: Hinges can be knowledge (e.g., "the world exists") without the ability to defend them. Radical doubt is unmotivated, as it lacks a context or method.  
     - **Denies**: That knowledge requires justification or that scepticism is meaningful.  
     - **Confused with**: (2) Constitutive Certainty (both treat hinges as propositional) or (6) Necessary but Unanswerable (both reject scepticism).  
     - **Defender**: Pritchard  

  5. **Dissolution**  
     - **Label**: Question-Dissolving  
     - **Commitments**: Demands to justify/doubt hinges are confusions. The "problem" disappears when we see hinges as embedded in action/language; no defense or refutation is needed.  
     - **Denies**: That hinge commitments are the kind of thing that can be questioned or analyzed.  
     - **Confused with**: (1) Animal Certainty (both reject propositions) or (6) Necessary but Unanswerable (both set scepticism aside).  
     - **Defender**: Moyal-Sharrock  

  6. **Necessary but Unanswerable**  
     - **Label**: Unresolved Scepticism  
     - **Commitments**: Hinges are necessary for inquiry (e.g., trusting perception), but sceptical questions about them are real and unanswerable. Scepticism is set aside in practice, not refuted.  
     - **Denies**: That hinges can be justified or that scepticism is nonsensical.  
     - **Confused with**: (2) Constitutive Certainty (both stress necessity) or (4) Unreflective Knowledge (both reject doubt).  
     - **Defender**: Stroud  

  7. **Relativism**  
     - **Label**: Local Rationality  
     - **Commitments**: Hinges vary between communities (e.g., moral or epistemic norms). No neutral standpoint exists to judge one community's hinges better than another's; rationality is local.  
     - **Denies**: That universal hinges or a global rationality exist.  
     - **Confused with**: (8) Fideistic Trust (both involve community-based commitments) or (2) Constitutive Certainty (both see hinges as framework-defining, but (7) denies universality).  
     - **Defender**: Bloor  

  8. **Fideistic Trust**  
     - **Label**: Faith-Like Commitment  
     - **Commitments**: Hinges are held on trust, akin to religious faith (e.g., trusting memory or morality). This trust isn't rationally grounded but isn't irrational; it's a pre-rational foundation.  
     - **Denies**: That hinges need or can have rational support.  
     - **Confused with**: (3) Entitlement (both involve non-evidential acceptance) or (7) Relativism (both may be community-based).  
     - **Defender**: Coliva  

  ### Notes on Design
  - **Losing vs. Revising a Hinge**: Questions 1 and 8 test this. Question 1 (brain injury) probes whether losing a hinge (e.g., certainty about hands) is a disruption in action (A), pathology (B), or a framework shift (C). Question 8 (grief) asks if losing meaning is a breakdown (A), valid shift (B), or existential trust-loss (C). These distinguish outcomes like (1) and (8) (loss as action/trust disruption) from (6) (loss as pathology) or (7) (revision as framework change).
  - **Practical/Moral Hinges**: Questions 2, 5, and 9 include moral cases (e.g., cruelty to children) to test if moral hinges behave like epistemic ones. Responses reveal if you see them as universal (A), relative (B), or non-propositional (C), separating outcomes like (2) and (4) (universal) from (7) (relative) or (1) and (5) (non-propositional).
  - **Indistinguishable Positions**:  
    - **(1) Animal Certainty and (5) Dissolution** cannot be reliably separated. Both reject hinge propositions and dissolve sceptical questions. They often choose identical responses (e.g., Q1A, Q4C, Q7C). This blur occurs because both views see hinges as embedded in practice, making concrete cases insufficient to split them.  
    - **(3) Entitlement and (8) Fideistic Trust** are hard to distinguish. Both involve non-evidential acceptance (e.g., Q3C, Q6A/B, Q8C). The line between "entitlement as warrant" and "trust as faith" is often theoretical, not case-based.  
    Explanation: The quiz uses cases, but these pairs share identical judgments on most scenarios because their differences emerge in meta-theoretical interpretations (e.g., whether trust is "warrant" or "faith"), not concrete verdicts.  
  - **Unoccupied Combinations**:  
    - **Hinges are propositions and rationally revisable without loss of certainty**: Empty because incoherent. If hinges are certain (defining rationality), revising them without loss of certainty would require a meta-framework, which the view denies. (Outcomes like (2) and (4) treat hinges as fixed; (7) allows revision but without rationality claims.)  
    - **Hinges are non-propositional and open to criticism**: Empty because incoherent. Non-propositional hinges (e.g., actions or sensibilities) are not truth-apt, so criticism (e.g., "wrong" or "unjustified") doesn't apply. (Outcomes (1) and (5) explicitly deny criticism.)  
    - **Hinges can be knowledge and community-relative**: Empty because unattractive. If knowledge is factive (true), relativity undermines it; few defend this as it risks self-contradiction. (Outcome (4) treats hinges as knowledge but not relative; (7) treats them as relative but not knowledge.)  
    - **Hinges are non-propositional and rationally revisable**: Empty because unattractive. Revisability implies rational assessment, but non-propositional items (e.g., actions) aren't assessable this way. No major defender occupies this, as it mixes incompatible features.  

  This instrument prioritizes your case judgments while acknowledging limitations. If your answers don't cleanly map to one outcome, you may hold a hybrid view or emphasize nuances not captured in the debate. Reflect on the scenarios to clarify your stance.
