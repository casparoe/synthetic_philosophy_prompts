  - If mostly 1C,2B,3A,5B,7B,8B: Position 7
  - If mostly 3C,6B,8C: Position 8

  Now, note the indistinguishable pairs:

  - (1) and (5) both choose 4C and 7C. They might be separated by Q5: (5) might choose 5C (not a hinge), while (1) might not have a clear answer. In Q5, (1) might not see it as a hinge but as a way of acting in science, so 5C. But (5) also chooses 5C. So hard to separate.

  - (3) and (8) are separated by Q6A vs Q6B and also by Q3: (3) has no clear answer for Q3, while (8) chooses 3C.

  - (2) and (6) both choose 1B,4B,5B. They might be separated by Q2 and Q7: (2) chooses 2A and 7A, while (6) might not have a strong opinion on moral or community, so might not choose 2A or 7A. In our scoring, (6) doesn't have 2A or 7A, so if they choose 1B,4B,5B,8A, it's (6), while (2) has 1B,2A,4B,5B,7A,8A.

  Unoccupied combinations:

  - Hinges are propositions and rationally revisable without loss of certainty: This is incoherent because if they are hinges, they are held with certainty and are not revisable within the system. If revised, certainty is lost. So incoherent.

  - Hinges are non-propositional and open to criticism: If non-propositional, they are not true/false, so criticism doesn't apply. Incoherent.

  - There might be combinations like (2) and (7): hinges are propositions and community-relative. But (7) already says that, so it's occupied.

  - (4) and (7): hinges can be knowledge and community-relative. But knowledge is typically factive, so if community-relative, it might not be knowledge in an absolute sense. This combination might be unattractive or incoherent.

