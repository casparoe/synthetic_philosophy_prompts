answer: |-
  ### The Problem, Stated Precisely
  Expected-value fanaticism arises when standard expected utility maximization implies that actions with any nonzero probability of producing an astronomically large payoff (or avoiding an astronomically large loss) dominate all other choices, even when the probability is vanishingly small. This occurs because the expected value calculation (probability × magnitude) can remain arbitrarily large if the magnitude scales sufficiently fast to compensate for diminishing probability. The problem manifests in three distinct but related versions:

  1.  **The Pure Formal Problem:** A theorem showing that unbounded utility functions (or unbounded disutility from catastrophes) lead to divergent or pathological expected values in decisions involving extreme stakes with nonzero probability (e.g., modified St. Petersburg games, Pascal's Mugging).
  2.  **The Epistemic Problem:** When probabilities of vast outcomes are not merely small but *deeply uncertain* or *impossible to reliably quantify* (e.g., the probability that a specific action triggers a chain reaction causing human extinction), expected value calculations become highly sensitive to arbitrary or uninformed probability assignments.
  3.  **The Long-Termism Problem:** When evaluating actions affecting the far future (e.g., existential risk reduction), the potential magnitude of impact (affecting trillions of future lives) can seem to overwhelm any finite cost, even with tiny subjective probabilities.

  An adequate solution must address the **Pure Formal Problem** as a minimal requirement, demonstrating how decision theory can avoid fanatical conclusions driven solely by the mathematical structure of unbounded utilities and nonzero probabilities. Addressing the **Epistemic Problem** is highly desirable for real-world applicability. Addressing the **Long-Termism Problem** is crucial if the solution is intended for existential risk contexts. A solution is **inherently fanatical** if its core logic *always* prioritizes minuscule chances of vast payoffs over significant certainties. A solution **merely permits fanaticism** if it allows fanatical conclusions in specific, extreme cases but doesn't mandate them universally or for ordinary decisions.

  ### The Desiderata
  Any adequate treatment of expected-value fanaticism must satisfy these requirements:

  1.  **Respect Expected Value in Ordinary Decisions:** The solution must reproduce standard, uncontroversial expected utility maximization for commonplace decisions involving moderate stakes, well-defined probabilities, and bounded impacts (e.g., buying insurance, choosing a reliable car). *Why required:* Expected utility theory is empirically and normatively successful for most decisions. A "solution" that breaks it for ordinary cases is worse than the problem.
  2.  **Avoid Absolute Irrelevance:** Vast-but-unlikely outcomes cannot be rendered *literally irrelevant* or assigned zero decision weight solely due to the smallness of their probability. *Why required:* Completely ignoring tiny-probability catastrophes (e.g., a specific asteroid deflection scenario) or transformative opportunities (e.g., a specific speculative medical breakthrough) seems recklessly myopic. A theory must allow for *some* sensitivity to genuinely possible, extreme stakes.
  3.  **Action-Guidance:** The solution must yield definite, actionable prescriptions in finite time for realistically complex decisions, including those involving vast stakes and uncertain probabilities. *Why required:* Decision theory is fundamentally practical. A theory that only says "this is hard" or requires infinite computation fails its purpose. It must tell an agent what *to do*.
  4.  **No Arbitrary Numerical Cutoffs:** The solution must not rely on ad hoc thresholds (e.g., "ignore probabilities below 10^-9", "cap utility at 10^100") that lack principled justification and whose changes drastically alter prescriptions. *Why required:* Arbitrary cutoffs are theoretically unsatisfying, vulnerable to manipulation, and fail to resolve the underlying structural problem – they just shift where the fanaticism kicks in.
  5.  **Handle Divergent Expectations:** The solution must provide coherent prescriptions for St. Petersburg-like scenarios where the expected value mathematically diverges (is infinite or undefined). *Why required:* These are the purest formal instantiations of the fanaticism problem. A solution that only handles finite-but-large expectations avoids the core mathematical challenge.
  6.  **Immunity to Fanatical Hijacking:** The solution must not be vulnerable to trivial manipulation by constructing scenarios involving arbitrarily small probabilities of arbitrarily large payoffs/losses (Pascal's Mugging). *Why required:* If a theory prescribes paying a mugger $1000 based solely on their claim that they'll torture 3↑↑↑↑3 people otherwise (with no evidence), it is practically unusable and normatively defective.
  7.  **Avoid Decision Paralysis:** The solution must not make decision-making *more* difficult or computationally intractable than standard expected utility maximization, especially concerning vast stakes. *Why required:* Paralysis was a core motivation for seeking a solution. A "fix" that makes it impossible to decide between crucial existential risk interventions due to pervasive uncertainty is self-defeating.
  8.  **Maintain Sensitivity to Scale & Probability:** The solution must preserve the intuition that increasing the probability of a vast outcome (even from extremely low) or increasing its magnitude (even if already vast) should make an action aimed at achieving it relatively *more* attractive, all else equal. *Why required:* A theory that violates this (e.g., by treating all outcomes above a certain magnitude identically regardless of probability, or all probabilities below a threshold identically regardless of magnitude) collapses crucial distinctions and loses essential information.
  9.  **Compatibility with Uncertainty:** The solution must function robustly under conditions of deep uncertainty, imprecise probabilities, or ignorance regarding the probabilities and/or magnitudes of extreme outcomes. *Why required:* The most critical applications (e.g., existential risk) involve profound uncertainty. A solution requiring precise inputs is useless here.

  ### Non-Negotiables vs. Preferences
  *   **Non-Negotiable (Constitutive):** (1) Respect Expected Value in Ordinary Decisions, (2) Avoid Absolute Irrelevance, (3) Action-Guidance, (5) Handle Divergent Expectations, (6) Immunity to Fanatical Hijacking, (8) Maintain Sensitivity to Scale & Probability. These define the core tension: preserving the power of expected value reasoning while preventing its pathological breakdown. Failing any of these means the solution doesn't solve the problem it set out to fix or breaks fundamental aspects of rational choice.
  *   **Negotiable (Camp Prejudices):** (4) No Arbitrary Numerical Cutoffs is often strongly held but *could* be relaxed if a *principled*, non-arbitrary threshold could be justified (though none currently exists). (7) Avoid Decision Paralysis is highly desirable but a solution might add complexity; the key is that it must be *practically usable*, not necessarily simpler. (9) Compatibility with Uncertainty is crucial for real-world application but a formal solution might first address precise probabilities before extending to uncertainty. Preferences for *how* to satisfy the non-negotiables (e.g., favoring bounded utility vs. probability weighting vs. lexical rules) define different camps.

  ### Pairs Jointly Unsatisfiable?
  The core tension lies between the fundamental engine of expected value and the need to avoid its pathological extremes:

  *   **Respect EV Ordinarily (1) & Immunity to Hijacking (6):** Expected value works because it weighs probability and magnitude linearly. Hijacking exploits linearity: halving probability can be offset by doubling magnitude *ad infinitum*. To block hijacking, the theory must *depart* from strict linear probability-magnitude weighting for tiny probabilities or vast magnitudes. But this departure risks breaking ordinary EV (1) if it kicks in too soon, or violating Sensitivity (8). A solution must find a principled way to *modify* weighting only in the extreme tail without undermining the core.
  *   **Avoid Irrelevance (2) & Immunity to Hijacking (6):** To prevent hijacking, one must discount tiny probabilities or vast utilities *somehow*. But discounting too aggressively makes vast outcomes irrelevant (violating 2). A solution must discount *just enough* to block hijacking while preserving *some* sensitivity to genuinely significant extreme possibilities.
  *   **Action-Guidance (3) & Handling Uncertainty (9) & Avoid Paralysis (7):** Profound uncertainty about extreme outcomes inherently makes decisions harder. Any solution incorporating this uncertainty (9) risks increasing complexity and causing paralysis (7), threatening action-guidance (3). A solution must provide a tractable method for reasoning under deep uncertainty about extremes without becoming computationally monstrous or perpetually inconclusive.
  *   **Handle Divergence (5) & No Arbitrary Cutoffs (4):** Resolving divergent expectations (like St. Petersburg) typically requires *some* limiting procedure (e.g., finite resources, bounded utility, probability discounting). Critics argue all such procedures introduce arbitrariness (4) – where to bound, how to discount? A solution must justify its limiting principle non-arbitrarily, perhaps based on properties of agents or the decision context itself.

  ### How Standard Fixes Fare (Against Desiderata)
  *   **Bounding Utility:** Satisfies (5), (6), (1) (if bound high). Fails (2) (outcomes above bound are irrelevant), (8) (insensitive to scale beyond bound), arguably (4) (choice of bound often arbitrary).
  *   **Discounting Tiny Probabilities (e.g., `p/(p+k)`):** Satisfies (1), (6) better than bounds. Fails (5) (may not resolve true divergence), (8) (collapses distinctions between very small p), (4) (choice of discount function/k arbitrary), risks failing (2) if discount too severe.
  *   **Lexicographic Rules (e.g., minimize p(catastrophe) first):** Satisfies (6), (2) (vast outcomes always matter), (3) (simple rule). Fails (1) (ignores moderate stakes if *any* catastrophe risk exists), (8) (insensitive to probability/magnitude differences within priority classes), (5) (doesn't address divergence within a class).
  *   **Ignoring Probabilities Below Threshold:** Satisfies (3), (6) (if threshold chosen). Fails (2), (4) (highly arbitrary), (8) (insensitive below threshold), (5) (doesn't resolve divergence above threshold).
  *   **Finitely Iterated Reasoning / Resource Bounds:** Satisfies (3), (7), (6) (implicitly). Fails (5) (avoids divergence via assumption, not resolution), (1) (can behave non-standardly even for moderate cases if bounds are tight), (8) (sensitivity depends on arbitrary bound).

  **Most Surviving Desiderata:** No fix satisfies all. Probability discounting (with care) often survives (1), (3), (6), sometimes (5), but consistently fails (4) and risks failing (2)/(8). **Most Damaging Requirement:** **Immunity to Fanatical Hijacking (6)** is the killer for naive expected utility and rules out solutions that are too permissive (like high utility bounds). **No Arbitrary Cutoffs (4)** is the most common killer for practical fixes. **Handling Divergence (5)** is the most formal challenge, eliminating fixes that only work for finite expectations.
