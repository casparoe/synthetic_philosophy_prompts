prompt: |-
  Hey, I'm a third-year phil student doing a philosophy of science unit — we've done underdetermination and the Duhem–Quine stuff already, so you don't need to explain to me what underdetermination is. I want to ask about a pattern I keep noticing that I dont think is quite the same thing, and I want to know whether it has a name. Take the role of a philosopher of science who knows this literature well, think it through carefully, maybe brainstorm a few candidate concepts before you commit, and please don't just hand me a label — I care way more about where the edges of the thing are and what it isn't.

  Here's what I keep seeing. Whenever a lecturer says two theories are 'equally well supported by all the evidence' or 'observationally equivalent', the claim always seems to hold only relative to a prior decision about what counts as evidence in the first place. Change that decision — decide that some quantity is directly measurable rather than merely inferred, or take a coarser-grained description of the outcomes — and the two theories quietly stop looking equivalent. Two cases: Ptolemaic vs Copernican astronomy gets called observationally equivalent, but that seems to depend on treating naked-eye positions as the observation base; and in a psych seminar two models of the same choice data were called equivalent only because we'd already fixed which choices counted as the 'same' option.

  So: is there an established name for this — for the equivalence (or underdetermination) being an artifact of where you draw the line between what's observed and what's inferred? If it's really just Duhem–Quine holism or conventionalism, say so and explain why, but it feels more specific than that: it isn't that any hypothesis can be rescued, it's that the very claim of equivalence has a hidden parameter. And if there's no name for it, coin one and define it, including what it's not.
reasoning: |-
  Okay, this is a sharp question from a third-year philosophy student who's already comfortable with Duhem-Quine and underdetermination. They've noticed something subtle: what appears as observational equivalence between theories often depends on prior decisions about what counts as "evidence" in the first place. They give two clear examples (Ptolemy vs Copernicus, and psychology models) and want to know if this specific phenomenon has a name. 

  First, I need to unpack what they're really asking. They're not confusing this with standard underdetermination – they explicitly say it feels different because it's about the hidden parameter in defining the observation base. The key distinction they're drawing is that equivalence isn't just about auxiliary hypotheses (like in Duhem-Quine), but about the conventional choice of what we call "data" before the theory even gets involved. 

  Hmm... let me mentally scan the literature. Duhem-Quine is too broad – that's about preserving hypotheses by adjusting auxiliary assumptions. Conventionalism à la Poincaré comes close but focuses on geometric conventionalism specifically. The psychology example makes me think of Carnap's protocol sentences and the theory-ladenness of observation, but that's about how concepts shape perception, not about equivalence relations. 

  What about Quine's "ontological relativity"? No, that's more about reference than empirical equivalence. Maybe van Fraassen's "observable/unobservable" distinction? Closer, but still not quite – van Fraassen uses it for constructive empiricism, not for relativizing equivalence. 

  Ah! The astronomy example triggers a memory: Feyerabend and Kuhn both discussed how Ptolemy and Copernicus weren't actually equivalent because they used different instrumentation (sextants vs telescopes), but that's about theory change shifting observation standards. The student's point is more fundamental – it's about the pre-theoretical choice of evidence granularity. 

  Perhaps this is what Hacking meant by "styles of reasoning" or Cartwright's "nomological machines"? Not exactly... wait, maybe it's a form of "perspectival realism"? But that's broader. 

  I think the closest established concept is actually hiding in plain sight: the "theory-ladenness of observation." But I need to be careful – the student isn't saying observations are interpreted differently, but that the choice of observational vocabulary itself determines equivalence. That's more radical. Kitcher's "reference potential" might handle the psych example, but feels overkill. 

  Maybe there isn't a perfect label. If I had to coin one, "evidential frame-relativity" captures it: equivalence is relative to the chosen granularity of evidence description. But I should emphasize boundaries: this isn't about underdetermination of theories by fixed evidence (Duhem-Quine), nor about meaning variance (Kuhn), nor about reducibility (Nagel). It's specifically about how carving the data space precedes equivalence judgments. 

  The psychology example is particularly telling – if you redescribe choices (e.g., grouping options differently), models that seemed equivalent may diverge. That suggests this is about the conventional partitioning of the phenomenal field. Reminds me of Goodman's "ways of worldmaking" but applied to data. 

  Ultimately, I'll position this as a consequence of Carnap's framework relativism combined with theory-ladenness, but distinct enough to merit attention. The student deserves credit for spotting this pattern – it exposes how "observational equivalence" claims often smuggle in metaphysical commitments about what's primitive. I'll avoid jargon unless necessary and focus on clarifying the boundaries they asked for.
answer: |-
  Your observation cuts deep into the presuppositional scaffolding of empirical equivalence claims—and you're right that this is *distinct* from standard Duhem-Quine holism or underdetermination. What you're identifying is a **pre-empirical conventional choice** that *creates* the appearance of equivalence by defining what counts as the "observation base." Let's dissect it step by step.

  ### Core Phenomenon: **Evidential Frame-Relativity**
  The pattern you describe—where equivalence hinges on prior decisions about the *granularity, ontology, or epistemic status* of the evidence itself—is best understood as **evidential frame-relativity**. Here's why this isn't just Duhem-Quine:

  - **Duhem-Quine Holism**: Focuses on how *auxiliary hypotheses* (A) can be adjusted to preserve a core theory (T) against recalcitrant evidence (E). Equivalence arises from the flexibility of (A).  
  - **Your Cases**: The equivalence arises *before* auxiliary adjustments. It’s built into the *definition of E itself*. Change how you describe or partition the evidence (e.g., what counts as a "direct" measurement, or how you individuate "choices"), and equivalence dissolves.  

  ### Key Features & Boundaries
  1. **The Hidden Parameter**: Equivalence is relative to an **evidential frame**—a convention specifying:  
     - What is "directly observable" vs. inferred (e.g., naked-eye star positions vs. telescopic phases of Venus)  
     - The *level of description* for outcomes (e.g., grouping "choices" coarsely vs. finely)  
     - What is "noise" vs. "signal" (e.g., ignoring atmospheric refraction in ancient astronomy)  

  2. **Not Merely Theory-Ladenness**:  
     While theory-ladenness (e.g., Hanson, Kuhn) notes that observation is conceptually structured, your cases show how the *choice of evidential framework* isn’t just theory-influenced—it *generates* equivalence. Ptolemy/Copernicus aren’t equivalent if you include tidal data or telescopic observations, but their equivalence *under naked-eye frames* is a product of deliberately restricting evidence to positional astronomy.

  3. **Not Underdetermination Proper**:  
     Underdetermination claims that multiple theories fit *all available evidence*. But in your cases, "all available evidence" is ambiguously defined. If evidence includes *instrumentally mediated* data (e.g., spectrometer readings) or *fine-grained behavioral descriptions*, the theories diverge. The equivalence is *artifactually sustained* by the frame.

  4. **Distinct from Conventionalism**:  
     Poincaré-style conventionalism (e.g., choosing Euclidean vs. non-Euclidean geometry) treats *theoretical structures* as conventional. Your cases involve conventions about *evidence description*, which is upstream of theory choice.

  ### Established Concepts & Why They Don't Fully Fit
  - **Carnap’s "Linguistic Frameworks"**: Close! Carnap noted that ontological questions (e.g., "Do numbers exist?") are relative to linguistic frameworks. Your cases extend this to *evidential ontologies* (e.g., "Is a choice defined by surface features or cognitive process?"). But Carnap didn’t focus on equivalence.  
  - **Van Fraassen’s "Observable/Unobservable"**: His empiricist distinction affects what counts as evidence, but he treats it as fixed—not a *variable parameter* that modulates equivalence.  
  - **"Pragmatic Equivalence" (Quine)**: Quine acknowledged that equivalence can be pragmatic, but didn’t emphasize how *re-describing data* breaks equivalence.  

  ### A Proposed Name: **Frame-Relative Equivalence (FRE)**
  If no existing term suffices, let’s coin **Frame-Relative Equivalence (FRE)** with a precise definition:  

  > **FRE**: Two theories T₁ and T₂ are *frame-relatively equivalent* iff they are empirically equivalent *only relative to a specific evidential frame F*, where *F* specifies:  
  > - (a) The admissible types of evidence (e.g., only visual, only behavioral)  
  > - (b) The descriptive vocabulary for evidence (e.g., "planet positions at time t," "choice of option A")  
  > - (c) The epistemic status of data (e.g., "raw readings are incorrigible")  
  >   
  > **Crucially**: Altering *any aspect of F* may break the equivalence. FRE is thus distinct from *robust* equivalence (invariant across frames).

  ### Why This Matters
  You’ve spotted a methodological blind spot: claims of "observational equivalence" often smuggle in **unexamined conventional choices** about evidence. For example:  
  - In Ptolemy/Copernicus, restricting evidence to *geocentric angles* hides that Copernicus predicts *phases of Venus* (observable with telescopes).  
  - In psychology, calling choices "equivalent" ignores that re-categorizing options (e.g., by cognitive load) might distinguish models.  

  This isn’t just philosophy—it affects how scientists present theories. A researcher might claim two neural models are "equivalent" on behavioral data, but this holds only if behavior is described *coarsely*; finer-grained data (e.g., reaction times, eye-tracking) may break equivalence.  

  **In short**: You’re highlighting that empirical equivalence is often *manufactured* by the evidential frame—a profound point that deserves more attention. If FRE isn’t yet canon, your critique might help make it so. Keep pushing on these edges.
