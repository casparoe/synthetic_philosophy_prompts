answer: |-
  Life is two distinct concepts—synchronic (current self-maintenance) and diachronic (lineage evolution)—masked as one term, creating unavoidable ambiguity in borderline cases.

  **Synchronic (Individual-Level):**  
  - **Includes:** Mules (metabolize now), sterile worker ants (maintain homeostasis), frozen embryos (paused but restorable self-maintenance), intact corpses (briefly post-mortem).  
  - **Excludes:** Viruses, viroids, prions (no intrinsic metabolism/repair), evolving lineages without current individuals (e.g., extinct species).  
  - *Core:* "Alive" = actively resisting entropy *now* via energy-dependent processes.

  **Diachronic (Lineage-Level):**  
  - **Includes:** Viruses, viroids (evolve via selection/replication), mules (born from evolving lineages, though endpoints).  
  - **Excludes:** Sterile workers (no independent lineage), corpses, frozen embryos (no ongoing evolution), fire crystals (self-replicating but no adaptation).  
  - *Core:* "Life" = information transmission enabling adaptation across generations.

  **Tradeoffs & Conflicts:**  
  1. **Shifting Frames Change Verdicts:**  
     - A *frozen embryo* is synchronic-nonliving (dormant) but diachronic-living (lineage potential).  
     - A *sterile ant* is synchronic-living (metabolizes) but diachronic-nonliving (evolutionary dead-end).  
  2. **Neither is Primary:**  
     - Synchronic explains *aliveness* (e.g., why a metabolizing coma patient is alive).  
     - Diachronic explains *diversity* (e.g., why life adapts over millennia).  
  3. **Edge Cases Reveal the Split:**  
     - **Prions:** Synchronic ❌ (no metabolism), Diachronic ❌ (no heritable variation).  
     - **Viroids:** Synchronic ❌ (no self-repair), Diachronic ✅ (RNA evolution via host replication).  
     - **Self-Sustaining Reactor:** Synchronic ✅, Diachronic ❌ → "Life" only if defining by present state.

  **Conclusion:** The tension arises because biology conflates *being alive* (synchronic) with *being life* (diachronic). Borderline cases force a choice: prioritize persistence (synchronic) or potential (diachronic), with no unified resolution.
