prompt: |-
  I sit on the historical marker and memorial committee of a small town in the American South. We are nine volunteers, none of us a professional historian; we meet once a month and rule on whatever the public brings us — a request to raise a new marker, to reword an old one, to add a plaque, to rename a school, occasionally to take a thing down. Our decisions can be appealed to the town council, so a bad ruling costs the town a year of argument. At present we decide by asking what feels defensible that night, which in practice means the outcome depends on who showed up. I have no formal training in history or philosophy — I have simply been reading on my own for several years — and I want to arrive at something I can actually hand to the committee: not an essay, a procedure.

  What has occupied me is the contrast among the four places I keep reading about, because each seems to fail in a different way. In Germany the reckoning with the Nazi past is largely inward-facing: the memorials speak to the perpetrators' own descendants and say, in effect, this is what we did, and the whole apparatus of schools and monuments and a word for working through the past is aimed at the nation's own future. In Japan the contest is over whether the deed is admitted at all; a shrine in Tokyo honors the country's war dead, and its own records count people convicted as war criminals among them, so that honoring the fallen and glorifying what they did cannot be pulled apart — even the emperor stopped going. In Turkey the official position is denial; the mass deportations and killings of Armenians in 1915 are officially described as something else and saying otherwise has been a crime, so the question there is not what to build but whether anything may be said. And in the South the monuments themselves were the act of memory politics: they went up decades after the war, built by a we that defined itself against the people it had enslaved, so that here the memorial is the instrument of the false memory rather than the remedy for it. I notice that the local formula — that a statue is about heritage, not about hate — is doing exactly the work of separating the deed from the people who did it.

  Out of all this I have pulled four ideas that seem to me to matter, and I would like them put to use rather than admired. First, the Germans have two words where we have one: one for a memorial that commemorates, which tells you that something happened or that certain people are worth remembering and which is usually built to leave you settled or proud, and one for a memorial that warns, which is built to unsettle you and to carry a lesson forward, and which is often deliberately uncomfortable to stand in front of. The strange fact I keep returning to is that the large Holocaust memorial in Berlin is called by both words, which suggests the same object is being asked to commemorate and to warn at once, and that those two jobs pull against each other. Second, I read of a project that puts small brass plates into the pavement outside the houses where victims last lived, instead of gathering the memory into one plaza you can walk around, so that you meet it while going about an ordinary day and cannot choose to avoid it — a completely different theory of what a memorial is for. Third, I have read of artists who design memorials to sink into the ground or efface themselves, on the theory that a permanent and beautiful monument flatters the visitor into believing the past has been taken care of. Fourth, the Japanese case raises a question I cannot settle: when you honor people who died serving a cause, and the cause was criminal, is there any way to honor the dead without honoring the deed? The shrine is defended as remembrance of the fallen and attacked as glorification of what they did, and both descriptions strike me as true.

  So here is what I want. Give me a decision procedure the nine of us could run, in order, on any proposal that comes before us, containing: the questions in the order we should ask them; what counts as a sufficient answer to each, and what counts as a dodge; the point at which the procedure simply stops and the answer is no; and the points at which it must stop and hand the matter to a person or a body because the remaining question is one of values rather than of fact. It has to be runnable in the fifteen or twenty minutes we realistically give an item, by people who will never read the theory behind it, and it has to keep whatever is genuinely load-bearing in the four ideas above while dropping whatever will not survive the trip into a volunteer committee. Where the procedure has to simplify in a way that will make it misfire on some proposals, say which ones.

  Then please run it, showing the steps, on three proposals. (a) Keep a Confederate monument in the square but add a large plaque explaining that it was erected in the early 1900s as part of a campaign to assert white supremacy — the compromise most of the committee favors. (b) Rename an elementary school now named after a local physician who was also, in the 1950s and 1960s, a leader of the local resistance to desegregation. (c) Place a small memorial at the old courthouse steps to the people who were sold there — this one is mine.

  I expect the procedure to give me an answer I do not like on at least one of these, and I want you to say so plainly rather than bend the procedure toward my preferences. And at the end, tell me what the procedure cannot do: which proposals it will handle badly, and which of its steps are value judgments wearing the costume of a test.
reasoning: |-
  Okay, the user is part of a committee in a Southern town dealing with historical markers. They're volunteers without professional history training, and their current process is inconsistent. They want a practical procedure, not an essay, based on four key ideas from their research: German memorial types (commemorate vs. warn), decentralized memorials like Stolpersteine, impermanent designs, and the Japan dilemma of honoring soldiers without glorifying crimes.

  First, I need to create a step-by-step procedure that's usable in 15-20 minutes. It should incorporate those four concepts but simplify them for volunteers. The steps must be clear questions with pass/fail criteria and identify when to stop or delegate. The procedure should avoid academic jargon and focus on actionable decisions.

  The user mentioned specific cases: Germany's inward focus, Japan's denial, Turkey's suppression, and the South's problematic monuments. The key challenge is balancing commemoration with warning, especially for Confederate symbols. The "heritage not hate" argument needs addressing as it separates deeds from perpetrators.

  For the decision procedure, I'll structure it into distinct phases. Phase 1 determines if the proposal is even valid—does it meet basic standards? Phase 2 assesses ethical soundness using the German two-type concept. Phase 3 handles practical concerns like community impact. Each phase has knockout questions; failing any stops the process. Delegation points are crucial for value judgments beyond the committee's scope.

  The brass plates idea (decentralized memorials) informs the "encounter design" test—does it force reflection in daily life? The sinking memorial concept leads to the "permanence paradox" question about avoiding complacency. The Japan dilemma becomes the "honor/deed separation" test for military figures.

  Now, applying it to the three test cases: 
  - For (a) adding a plaque to a Confederate statue, Phase 1 passes (it's historical) but Phase 2 fails because it can't separate heritage from hate. The warning/commerce balance is off. 
  - For (b) renaming the segregationist doctor's school, Phase 1 fails—the name currently honors bad acts. 
  - For (c) the slave auction memorial passes all phases—it's a decentralized warning that avoids permanence pitfalls.

  The procedure will struggle with ambiguous figures (e.g., founding fathers with slaves) and "both sides" narratives. Steps like "honor/deed separation" are value judgments disguised as tests—committees must own that. Also, it can't resolve deep community divisions; those need delegated dialogue.

  User's deeper needs: They want legitimacy beyond personal opinions, fearing costly appeals. The unspoken tension is Southern identity—how to acknowledge pain without erasing history. They might also need cover to oppose popular compromises like (a). The procedure gives them defensible "no"s grounded in ethics, not just feelings.
answer: |-
  Here is a decision procedure designed for your committee, incorporating your core insights while prioritizing practicality, defensibility, and time constraints. It's structured as a flowchart of **knockout questions** – fail any, and the proposal is rejected or requires fundamental revision. Pass all, and it's approved (subject to practicalities in Phase 3).

  **The Historical Marker & Memorial Committee Decision Procedure (V1.0)**

  **Core Principle:** *The primary purpose of public historical commemoration in our context is truth-telling that serves the public good, prioritizing the perspectives of the marginalized and preventing the glorification of injustice, while acknowledging complexity where it exists.*

  **Phase 1: Foundational Legitimacy (5 mins)**
  *   **Question 1.1: Is the subject historically significant and verifiable?** Does it represent a real event, person, or pattern demonstrably connected to our town/region? Is the core claim supported by credible historical evidence (archives, scholarship, primary sources)?
      *   *Pass:* Subject is specific, real, and evidence exists. (E.g., "Dr. X led the White Citizens Council," "Auctions occurred on these steps," "This statue was erected in 1910 by the UDC").
      *   *Fail:* Subject is mythical, exaggerated beyond evidence, or lacks local connection. *STOP. REJECT.*
      *   *Dodge:* Relying solely on tradition, hearsay, or uncorroborated family lore. Vague claims ("honoring our heritage").
  *   **Question 1.2: Does the proposal avoid actively glorifying injustice?** Does it celebrate, valorize, or present as heroic individuals/groups/actions directly involved in systemic oppression (slavery, segregation, racial terror, displacement of Indigenous peoples) or other verifiable major crimes against humanity?
      *   *Pass:* Commemorates victims, resistors, or complex figures without celebrating oppressive acts. Explains context neutrally or critically. Acknowledges harm done. (E.g., "Remembering those enslaved and sold here," "Explaining this statue's role in promoting segregation").
      *   *Fail:* Uses honorifics, martial imagery, or language glorifying perpetrators of oppression or their cause. *STOP. REJECT.*
      *   *Dodge:* Using euphemisms ("states' rights," "economic differences"), focusing solely on military service while ignoring cause, claiming "both sides" equivalence where power was grossly unequal.

  **Phase 2: Ethical & Memorial Function (7 mins)**
  *   **Question 2.1: What is the primary function? (Apply German Concept)** Is it primarily to **Warn** (make uncomfortable, provoke reflection on harm/injustice, teach a lesson) or primarily to **Commemorate** (honor sacrifice, achievement, loss in a way that settles or inspires pride)? Can it reasonably attempt both *without* the "Commemorate" function undermining the "Warn" function for subjects involving oppression?
      *   *Pass (Warn):* Clear focus on truth-telling about harm, injustice, or problematic history. Design/content prompts discomfort/reflection. (E.g., plaque explaining a statue's racist intent, memorial to victims of lynching).
      *   *Pass (Commemorate):* Honors victims of injustice, civil rights figures, community builders *without* significant complicating oppressive actions. (E.g., plaque for local integration pioneer).
      *   *Pass (Attempts Both):* For complex figures/events *not* centrally defined by perpetration (e.g., a founding father who enslaved people but also contributed significantly to civic institutions - *use extreme caution*). Must explicitly acknowledge the harm/warning aspect and show why commemoration is *still* warranted despite it. *Requires strict scrutiny.*
      *   *Fail:* Attempts to Commemorate perpetrators of systemic oppression or their cause. Any proposal where "Commemorate" clearly overshadows/contradicts the necessary "Warn" function for subjects involving oppression. *STOP. REJECT.* (This knocks out most unmodified Confederate monuments and names honoring segregationists).
      *   *Dodge:* Claiming "neutrality" or "just history" when dealing with oppression. Saying "Commemorate" when "Warn" is ethically required.
  *   **Question 2.2: Does it overcome the "Permanence Paradox"?** Does the form/content actively work against the risk that a beautiful or permanent monument fosters complacency ("we've dealt with this")? (Applies especially to *new* memorials or major *additions*).
      *   *Pass:* Incorporates elements of impermanence, discomfort, required engagement (reading, reflection), or decentralized encounter (like brass plates). Avoids triumphalist or purely aesthetic grandeur for subjects of suffering/injustice. Text prompts ongoing questions, not closure.
      *   *Pass (Contextualization):* For modifying *existing* problematic monuments (adding plaques), the new text *must* directly challenge the original message's intent and context, making the whole *uncomfortable*.
      *   *Fail:* A traditional, grand, purely aesthetic monument to suffering/injustice that offers easy closure or passive observation. An added plaque that is timid, euphemistic, or fails to disrupt the original monument's glorifying message. *STOP. REJECT or REQUIRE REVISION.*
      *   *Dodge:* Focusing only on craftsmanship or longevity without considering the message's interaction with form.
  *   **Question 2.3: Can the "Deed" be separated from the "People" (Japan Dilemma)?** (Crucial for proposals involving military figures, officials, or others who died "serving" an unjust cause). Is there a way to acknowledge individual loss/grief *without* implying endorsement of the cause they served? Does the proposal explicitly reject the cause while acknowledging the human cost?
      *   *Pass:* Focuses on the *human cost* of the unjust system/war (e.g., "Mourning all lives lost in a war fought to preserve slavery"). Explicitly separates the loss from the cause ("They died for a cause that was wrong"). Contextualizes individual actions within the harmful system.
      *   *Fail:* Honors individuals *because* of their service to the unjust cause or uses language/imagery that valorizes that service or cause. *STOP. REJECT.*
      *   *Dodge:* "Honoring their sacrifice" without context. Focusing only on their military role while ignoring the political cause. Implying equivalence between perpetrators and victims.

  **Phase 3: Practicality & Implementation (3 mins)**
  *   **Question 3.1: Is the location appropriate and safe?** Is the proposed site historically relevant? Is it public and accessible? Are there significant safety concerns (traffic, vandalism, protests)? Does it respect sacred or burial grounds?
      *   *Pass:* Site is relevant, public, accessible, no major safety/desecration issues.
      *   *Fail:* Site is irrelevant, inaccessible, poses significant safety risks, or desecrates sacred ground. *STOP. REJECT or REQUIRE SITE CHANGE.*
      *   *Dodge:* Ignoring safety due to historical relevance. Choosing convenience over significance.
  *   **Question 3.2: Is the text/design clear, accurate, and concise?** Is the language understandable to the public? Is it factually correct? Is it free of obvious grammatical/spelling errors? Is it brief enough for the medium?
      *   *Pass:* Yes, or minor edits can fix it.
      *   *Fail:* Text is factually inaccurate, unintelligible, or excessively long. *STOP. REQUIRE REVISION.*
      *   *Dodge:* Allowing vague or euphemistic language to pass for brevity.
  *   **Question 3.3: Are there significant, unresolved community objections grounded in historical harm or truth-telling (not just preference)?** Have affected descendant communities or historical experts raised *substantive* objections based on factual inaccuracy, perpetuation of harm, or suppression of truth? (Note: Loud objections ≠ substantive objections).
      *   *Pass:* No substantive objections, or objections have been addressed via revision. General disagreement is present but not based on core truth/harm issues.
      *   *Fail:* Significant, unresolved objections from affected communities/experts based on verifiable harm or historical inaccuracy. *STOP. REQUIRE CONSULTATION/REVISION or DELEGATE.* (This is the **Delegation Point:** If community division is deep and relates to conflicting values/interpretations *beyond* the core facts of harm/oppression identified in Phases 1 & 2, the committee may need to formally delegate to a facilitated community dialogue process *before* making a final decision, acknowledging this goes beyond a simple factual test).
      *   *Dodge:* Confusing preference ("I like the old name") with substantive harm ("This name celebrates someone who fought to keep my children out of school").

  **Procedure Summary:**
  1.  **Phase 1:** Legitimacy & Anti-Glorification (Knockout: Fail 1.1 or 1.2 = REJECT).
  2.  **Phase 2:** Memorial Ethics & Function (Knockout: Fail 2.1, 2.2, or 2.3 = REJECT or REQUIRE MAJOR REVISION).
  3.  **Phase 3:** Practicalities & Community (Fail 3.1 or 3.2 = REJECT/REVISE. Fail 3.3 = DELEGATE/REVISE/CONSULT).
  4.  **Pass all:** APPROVE (proceed to implementation logistics).

  ---

  **Applying the Procedure:**

  **(a) Keep Confederate monument, add large plaque explaining its 1900s white supremacist context.**

  *   **1.1: Pass.** Subject (statue and its context) is verifiable.
  *   **1.2: Pass (Barely, hinges on plaque).** The *original* monument glorifies. The *proposal* (original + plaque) aims to contextualize. Passes IF plaque is sufficiently critical.
  *   **2.1: Warn/Commemorate?** *This is the crux.* The *original* commemoration is toxic. The *proposal* attempts to layer a "Warn" function over it. **Does the "Warn" function *overpower* the "Commemorate" function?** Likely **FAIL.**
      *   *Why?* The imposing physical form of the soldier/leader inherently commands space and traditional reverence. A plaque, even a large one, is often read as secondary. The "Commemorate" function (valorizing the Lost Cause) remains visually dominant. The "Warn" function struggles to overcome this inherent messaging. The visitor's primary *experience* is still confronting a monument to the Confederacy. *STOP. REJECT this compromise.* **Recommendation:** Removal or radical transformation (e.g., artist intervention) are ethically safer. If *must* stay, the plaque needs to be massive, unavoidable, and use starkly critical language placed *directly on* the statue base, not beside it.
  *   **Procedure Outcome: REJECT.** (This is likely the answer you dislike).

  **(b) Rename elementary school named after local physician (1950s-60s segregation resistance leader).**

  *   **1.1: Pass.** His role is verifiable.
  *   **1.2: FAIL.** Naming a public school *is* active glorification and honor. It celebrates the individual, implicitly endorsing his legacy. His leadership against desegregation is a defining act of systemic oppression relevant to the school's function. *STOP. REJECT the current name.*
  *   **Procedure Outcome: REJECT the current naming. APPROVE pursuit of renaming.** (The proposal is implicitly "rename", so passing Phase 1.2 requires rejecting the *status quo* name. The committee would then need a separate process for choosing a new name, running *that* proposal through this procedure).

  **(c) Place small memorial at old courthouse steps to people sold there.**

  *   **1.1: Pass.** Slave auctions occurred at courthouses; specific site significance is plausible/researchable.
  *   **1.2: Pass.** Commemorates victims, not perpetrators. No glorification.
  *   **2.1: Primary Function?** Clearly **Warn** (highlight inhumanity, injustice) and **Commemorate** victims. These functions align (unlike (a)).
  *   **2.2: Permanence Paradox?** A *small* memorial (implied: not grandiose) at the site of the trauma. **Pass,** especially if designed for engagement/reflection (text, perhaps names, simple but impactful form) rather than passive grandeur. Avoids complacency by location and subject matter.
  *   **2.3: Honor/Deed Separation?** N/A. Honoring victims, not perpetrators serving an unjust cause.
  *   **3.1: Pass.** Historically relevant location. Public space. Safety likely manageable.
  *   **3.2: Pass** (Assumes well-drafted text).
  *   **3.3: Pass** (Assumes no major substantive objections from descendant communities beyond general support for remembrance).
  *   **Procedure Outcome: APPROVE.**

  ---

  **What the Procedure Cannot Do (Limitations & Value Judgments):**

  1.  **Resolve Deep, Value-Laden Community Divisions:** It identifies when to delegate (Phase 3.3), but it doesn't *solve* those conflicts. Facilitation, dialogue, and potentially elected officials are needed there.
  2.  **Perfectly Handle "Ambiguously Complicated" Figures:** Figures who did both significant good *and* significant harm (e.g., founding fathers who enslaved people) are hard. Question 2.1 ("Attempts Both") is the weakest point, relying heavily on committee judgment about whether commemoration is *still* warranted and if the harm is sufficiently acknowledged. This step is **highly value-laden.**
  3.  **Define "Verifiable" or "Credible" for All Cases:** Determining what counts as sufficient evidence (Phase 1.1) involves judgment. Consulting local historians or archives is ideal but not always feasible in 20 mins.
  4.  **Eliminate Subjectivity in "Glorification" or "Harm":** While 1.2 tries to be objective (celebrating verifiable oppressors), perceptions of glorification or harm can vary. The committee must be courageous in applying the standard based on historical facts of oppression.
  5.  **Mandate Removal:** It can reject *proposals* to keep or glorify, but it doesn't force removal of existing things unless a removal proposal comes before it. It provides strong ethical grounds *for* removal proposals.
  6.  **Guarantee "Correct" History:** It aims for defensible truth-telling based on evidence, but history is interpretation. It prioritizes perspectives marginalized by traditional narratives and facts of oppression.
  7.  **Solve the Japan Dilemma Perfectly:** Question 2.3 provides a framework (separate loss from cause, reject the cause), but applying it cleanly is emotionally and politically fraught. It prevents *glorification*, but acknowledging loss without *any* implication of endorsement is subtle.
  8.  **Handle "Both Sides-ism" Well:** Proposals demanding "equal" commemoration for perpetrators and victims of systemic oppression (e.g., matching Confederate and Union monuments) would likely fail Phase 1.2 (glorification) and misunderstand power dynamics, but could cause contentious Phase 3.3 debates.
  9.  **Value Judgments in Disguise:** Key steps are fundamentally value-driven, wearing a factual costume:
      *   **1.2 "Avoid Glorifying Injustice":** Defining "systemic oppression" and "glorification" involves values.
      *   **2.1 "Warn vs. Commemorate" Balance:** Judging if commemoration overshadows warning is a value call.
      *   **2.3 "Honor/Deed Separation":** Deciding if acknowledgment constitutes endorsement is value-laden.
      *   **3.3 "Substantive Objections":** Judging what constitutes "grounded in historical harm" vs. preference is critical and subjective.

  **Conclusion:** This procedure forces the committee to confront the core ethical dilemmas you identified (glorification vs. warning, permanence, separation of honor/deed, decentralized memory) in a structured, time-bound way. It provides clear grounds for rejecting proposals that perpetuate harmful myths or glorify oppression, even popular compromises like (a). It protects against arbitrary decisions based on who attends. While it contains value judgments, it makes them explicit within a defined framework focused on truth-telling and preventing the normalization of injustice, giving your decisions a much stronger defensible foundation. Remember: **Phase 1.2 (No Glorification) and Phase 2.1 (Warning Must Dominate for Oppression) are the most critical and consequential knockouts.** Use them courageously.
