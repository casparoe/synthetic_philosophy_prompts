answer: |-
  Below is a complete exam package designed to test conceptual understanding of heritability in context. The question forces engagement with *why* heritability estimates vary across environments and *how* they are misinterpreted.

  ---

  **Exam Question**  
  A behavioural genetics study reports heritability estimates of 0.85 for twelve-year-olds' arithmetic scores in Country A (with highly uniform schooling, nutrition, and after-school care) and 0.25 for the same test in Country B (where these factors vary widely). Estimates derive from twin studies comparing identical and fraternal twins. A commentator states:  
  *"In Country A, differences in arithmetic are mostly genetic, so extra tutoring will do little. In Country B, they’re mostly environmental, so that’s where investment should go."*  

  Critically evaluate this commentary by addressing **all five** of the following:  
  1. Precisely what does the heritability figure of 0.85 in Country A measure, and what does it *not* imply?  
  2. Explain why this *pair* of estimates (0.85 in A, 0.25 in B) aligns with the variance partitioning model, rather than proving genes "matter more" in A. Does the claim about tutoring in A logically follow?  
  3. What can these *within-country* heritability estimates validly reveal – and *not* reveal – about why **average** arithmetic scores might differ *between* Countries A and B?  
  4. How would the "mostly genetic" interpretation in Country A be affected if (a) children with similar genetic variants tend to receive similar environments (*gene-environment correlation*), or (b) identical genetic variants have systematically different effects on arithmetic depending on the environment (*gene-environment interaction*)? Which key assumption of the twin method does this scenario *itself* cast doubt upon?  
  5. What evidence would **actually** determine whether extra tutoring improves arithmetic scores in Country A? How could the commentator’s second claim ("investment should go to B") be reworded into a scientifically defensible statement?  

  *(Answer in approx. 700 words. Target: 45 minutes)*  

  ---

  **Model Answer** (Approx. 590 words)  

  1.  **Meaning of Heritability (0.85):**  
      Heritability (h² = 0.85) estimates the *proportion of phenotypic variance* in arithmetic scores *within Country A's specific population and environment* that is attributable to *genetic variance* among individuals in that population. It is a population-specific statistic. Crucially, it **does not** imply that 85% of *an individual's* score is genetically determined, nor that genes are the dominant *cause* of the trait in an absolute sense. It also does not measure how "genetic" arithmetic ability is *fundamentally* or predict the effect of changing environments.  

  2.  **Why the Pair Makes Sense & Tutoring Claim:**  
      The variance partitioning model predicts that heritability (h² = Vg/Vp) increases as environmental variance (Ve) *decreases*, assuming genetic variance (Vg) is relatively constant. Country A's uniform environment minimizes Ve, making Vg a larger *proportion* of Vp (high h²). Country B's variable environment increases Ve, diluting the *proportion* explained by Vg (low h²). This reflects differences in *environmental variation*, not stronger genetic effects in A.  
      **Tutoring Claim:** The claim "extra tutoring will do little in A" **does not follow**. High heritability indicates that *current* environmental differences within A explain little variance *because environments are already uniform*. It says nothing about the potential impact of a *new, systematic* environmental intervention (like tutoring) applied *universally*. Tutoring could raise the *mean* score for all children in A, even if individual *differences* remain largely genetic.  

  3.  **Within-Country vs. Between-Country Differences:**  
      These *within-country* heritability estimates explain the *sources of individual differences* **within** each population. They **cannot** directly explain why the **average** arithmetic score might be higher in A than B, or vice versa. The difference in *means* between countries is likely driven by differences in the *average* environment (e.g., overall schooling quality, nutrition levels in A vs. B), which affects all individuals similarly within each country and thus doesn't contribute to *within-country variance* (Vp). Heritability is blind to these shared environmental effects on the mean.  

  4.  **G-E Correlation/Interaction & Twin Assumption:**  
      *   **(a) Gene-Environment Correlation (rGE):** If children genetically predisposed to arithmetic also receive better environments (e.g., more books, tutors), the genetic variance (Vg) estimate becomes inflated. Some variance attributed to genes in the "mostly genetic" interpretation actually arises from correlated environmental advantages, weakening the "genetic dominance" claim.  
      *   **(b) Gene-Environment Interaction (GxE):** If identical genetic variants yield higher scores only in enriched environments (e.g., good schools), the effect of genes is *dependent* on the environment. In A's uniform environment, GxE variance is minimized, making h² appear high. However, this high h² doesn't mean genes operate independently of the environment; it means the *current* environment allows genetic differences to express uniformly.  
      **Doubtful Assumption:** The scenario inherently questions the **Equal Environments Assumption (EEA)**. The EEA assumes identical twins experience environments no more similar than fraternal twins. If Country A's uniformity (or B's variability) affects how similarly *all* twin pairs are treated (e.g., identical twins given more identical tutoring *because* they are identical), this violates the EEA, biasing heritability estimates upwards.  

  5.  **Evidence for Tutoring & Rewording Claim:**  
      **Evidence for Tutoring:** The *only* way to determine if tutoring helps in Country A is through a **randomized controlled trial (RCT)**. Randomly assign children in A to receive extra tutoring or not, then compare score changes. This directly tests the causal effect of the intervention, independent of heritability estimates.  
      **Defensible Rewording:** The commentator's claim "investment should go to B" is flawed as it misinterprets low h² as high environmental malleability. A defensible version grounded in the findings would be:  
      *"The high environmental variance observed within Country B suggests that *existing* environmental differences significantly impact individual outcomes. Targeted interventions aimed at reducing *specific adverse* environmental factors (e.g., malnutrition, poor-quality schooling) for disadvantaged children in B might effectively reduce inequality in arithmetic scores."*  
      This focuses on reducing harmful *variation* within B, not assuming universal malleability, and is consistent with the low h² indicating significant environmental *variation* influencing differences.  

  ---

  **Marking Scheme (20 Marks Total)**  

  *   **Must-hit points (4 marks each):**  
      1.  **Defines h² correctly & its limits:** Clearly states h² = proportion of *phenotypic variance within population* due to *genetic variance*, *not* individual determinism, genetic "strength", or modifiability.  
          *   *Costs marks:* Vague definitions; implying h² measures genetic contribution absolutely or per individual.  
      2.  **Explains pair via Vp model & refutes tutoring claim:** Explains high h² in A results from low Ve (not high Vg), low h² in B from high Ve; explicitly states tutoring claim doesn't follow because h² ≠ modifiability.  
          *   *Costs marks:* Saying genes matter more in A; failing to link h² change to Ve change; not challenging tutoring logic.  
      3.  **Distinguishes within-variance vs. between-mean causes:** States within-country h² explains individual differences only; cannot explain country mean differences, which depend on shared environmental/cultural factors.  
          *   *Costs marks:* Confusing sources of variation within groups with sources of differences between group averages.  
      4.  **Impacts of rGE & GxE + Identifies EEA doubt:** Explains rGE inflates Vg estimate; GxE shows genetic effects are context-dependent; identifies EEA as the key twin assumption challenged by the uniformity/variability described.  
          *   *Costs marks:* Only mentioning one concept; not linking scenario specifics to EEA violation risk.  
      5.  **Identifies RCT evidence + Defensible rewording:** Correctly identifies RCT as the necessary evidence for tutoring; provides a defensible rewording focused on reducing specific adverse environmental *variation* in B based on its low h².  
          *   *Costs marks:* Suggesting observational/heritability evidence suffices; rewording that still misinterprets h² (e.g., "B is more malleable").  

  *   **A vs. B Answer Differentiation:**  
      *   **A (18-20 marks):** Demonstrates deep, integrated understanding. Seamlessly connects all concepts (variance partitioning, rGE/GxE, EEA, RCT necessity). Precise terminology. Explicitly dismantles misconceptions in the commentary throughout. Defensible rewording is cogent and directly addresses the limitations revealed.  
      *   **B (14-17 marks):** Hits all key points correctly but may lack integration or depth. Explains concepts accurately but perhaps sequentially rather than showing their interplay. Terminology mostly correct. Identifies flaws in commentary but may not consistently link back to core misconceptions. Rewording is defensible but perhaps less sharp or insightful.  

  **\answer{Misinterpreting heritability as genetic determinism or modifiability across contexts}**  

