prompt: |-
  Right, so a mate and I have been going back and forth about Kant and the murderer at the door — you know, the one where the guy at the door asks where your friend is hiding — and I've ended up with a pile of opinions that I'm honestly not sure actually hang together. I want you to stress-test the lot. Here's roughly where I've landed. (1) Lying is wrong without exception; I'm with Kant, you don't lie to the murderer, full stop. (2) The reason it's wrong isn't the harm the lie does to whoever gets deceived — it's that lying trashes the whole practice of truthful communication, or maybe that it's a duty I owe to humanity in general rather than to this or that particular person. (3) And since the ground isn't harm, it definately doesn't matter who I'm lying to or what would come of it; the wrongness doesn't come in degrees. (4) But I also want to say that the duty of truthfulness is owed to the person I'm actually speaking to, otherwise it makes no sense to say they've been wronged when I lie to them. (5) And in the murderer case I can't shake the feeling that if my friend dies, the real failure is mine for not protecting them, so it ought to be permissible to deceive the murderer if that's the only way to save them. (6) I do think it's fine to say something perfectly true that I know the murderer will take the wrong way, so I get to save my friend without lying. (7) And I've no problem at all with someone using force against the murderer, even lethal force, to stop him.

  What I want from you is an audit, not a lecture on what Kant said. Go through these and tell me which ones are genuinely pulling against each other and which only look like they are — I've a suspicion that a couple of them sit fine together and I'm just pattern-matching. Order the real tensions by how bad they are, and for each one say what I'd have to give up to fix it and what that'd cost me; then tell me whether there's a single edit that tidies up the most. And where something is only an apparent clash, say why it dissolves, and whether anything dodgy survives underneath once it does. Please write it in British English.
