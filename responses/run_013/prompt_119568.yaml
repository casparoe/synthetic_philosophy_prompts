answer: |-
  You've identified a fascinating and pernicious logical maneuver. While no single term perfectly captures *every* nuance you describe, the phenomenon is well-recognized in critical thinking and philosophy of science. The most fitting established concept is **Immunization Stratagem** or **Immunizing Maneuver/Strategy**, **specifically coupled with an inverted Survivorship Fallacy.**

  Here's the breakdown and why it fits, along with boundaries:

  1.  **The Core: Immunization Stratagem**
      *   **Definition:** The act of modifying a theory (or building it from the outset) specifically to make it resistant to criticism or falsification. This involves incorporating auxiliary hypotheses that explain away potential counter-evidence *before* it arises or *as it arises*.
      *   **Your Fit:** The "built-in explanation of its own rejection" (suppression, destruction, academic prejudice, evidence hidden) is the quintessential immunizing auxiliary hypothesis. It renders the core claim unfalsifiable *in practice* because any lack of evidence is *predicted* and *explained* by the theory itself. This is the "defect" you mentioned (unfalsifiability) being engineered.

  2.  **The Crucial Inversion: Survival-as-Confirmation Fallacy**
      *   **Definition:** This is the specific move you identified: Taking the *mere persistence* or *survival* of the theory *despite* attacks (which were rendered ineffective *by* the immunization) and interpreting this survival *as positive evidence* for the theory's truth.
      *   **The Fallacy:** It confuses *resistance to disproof* (often achieved by making disproof impossible) with *confirmation*. Survival isn't due to evidential strength but due to the theory being shielded from meaningful test. It's a perversion of the legitimate scientific virtue of resilience.

  3.  **The Combined Term & Definition:**
      *   **Immuno-Corroborative Fallacy (or Stratagem):**
          *   **Definition:** A deceptive argumentative strategy wherein a theory is rendered unfalsifiable through auxiliary hypotheses (the immunizing move), and this very unfalsifiability – manifested as the theory's persistence despite criticism – is then fallaciously presented as evidence *corroborating* the theory's truth.
          *   **Key Elements:**
              *   Preemptive or Ad Hoc Immunization: Building in the explanation for lack of evidence/rejection.
              *   Survival: The theory persists *because* it's unfalsifiable via the immunization.
              *   Inverted Inference: Mistaking this engineered survival for genuine confirmation or corroboration.

  4.  **Distinguishing it from Neighbors:**

      *   **Simple Unfalsifiability:** This is a *property* (a defect). The Immuno-Corroborative Fallacy *exploits* this property by actively *using* it (the survival resulting from unfalsifiability) as *positive evidence*. Unfalsifiability is the shield; presenting the shield's effectiveness as proof of the warrior's righteousness is the fallacy.
      *   **Ad Hoc Rescue/Patches:** These are the *immunizing moves themselves* (e.g., "evidence was destroyed"). The Immuno-Corroborative Fallacy *goes further* by citing *the success of these patches* (i.e., the theory hasn't been abandoned *because* of the patch) as *proof* the core theory is correct. The patch isn't just saving the theory; its saving power is offered as evidence *for* the theory.
      *   **Conspiracy Theory:** While often *using* an immunizing hypothesis (suppression by powerful actors), the core of a conspiracy theory is the *existence and actions* of the conspirators. The Immuno-Corroborative Fallacy focuses on the *logical inversion* of using the *effects* of the immunizing hypothesis (survival) as evidence. Not all conspiracy theories explicitly make this inversion; not all Immuno-Corroborative Fallacies involve conspiracies (e.g., "evidence just hasn't been found *yet*").
      *   **Appeal to Persecution (Galileo Gambit):** This argues that because the proponent/theory is rejected/attacked, it *must* be true (like Galileo). The Immuno-Corroborative Fallacy is a *specific subset* of this. It requires not just persecution claims, but that the *persecution/rejection is an inherent prediction of the theory itself* (via the immunizing hypothesis), and it's the *endurance through this predicted persecution* that's offered as proof. The immunizing hypothesis provides the "reason" for persecution that the theory "predicted."

  5.  **Boundary Cases: Scientific Resilience**

      *   **Ordinary Scientific Resilience:** This falls decisively **OUTSIDE** the Immuno-Corroborative Fallacy. Here's why:
          *   **No Built-in Immunization:** Resilient scientific theories (e.g., Newtonian physics enduring minor anomalies before relativity) do *not* incorporate auxiliary hypotheses *whose sole purpose* is to explain away *any and all* counter-evidence or rejection. Anomalies are acknowledged as problems to be solved.
          *   **Survival ≠ Corroboration:** Scientists don't point to a theory's mere survival through anomalies *as proof* it's true. They point to its *explanatory power, predictive success, coherence with other knowledge, and ability to be tested* (even if tests sometimes reveal anomalies). Survival through *some* challenges is a consequence of evidential strength, not a replacement for it. The focus remains on *positive evidence*, not the *lack of successful falsification* engineered by the theory itself.
          *   **Falsifiability Intact:** A truly resilient scientific theory remains *in principle falsifiable*. It hasn't been modified to make counter-evidence logically impossible; it has simply absorbed known anomalies *without collapsing*, often leading to refinement or eventual replacement when anomalies become overwhelming or a better theory emerges.
          *   **Focus on Evidence:** Resilience is supported by *existing positive evidence*, not by the *failure of critics* to disprove it due to an immunizing clause.

      *   **Pseudoscientific "Resilience":** This is where the Immuno-Corroborative Fallacy *masquerades* as resilience. The difference is the presence of the immunizing hypothesis and the explicit or implicit argument that "it's still here after all these attacks, so it must be right."

  **In essence:** The Immuno-Corroborative Fallacy takes the shield constructed to make a theory untouchable (immunization) and claims the existence and effectiveness of that shield *is* the proof of the theory's merit (corroboration via survival). It's a self-sealing, self-justifying loop that bypasses the need for actual positive evidence and genuine testability. Ordinary scientific resilience, while sometimes superficially similar in outcome (the theory persists), operates on a fundamentally different logical and evidential basis.
