  Okay, the user is working on a research proposal about money-pump arguments in decision theory, specifically challenging the assumption that intransitivity is the core issue. They want to show that preference cycling over time, even with transitivity at each moment, can still lead to exploitation. 

  Hmm, the user's core insight is sharp—existing literature treats money-pumps as revealing synchronic irrationality (intransitivity), but temporal cycling might expose a deeper diachronic problem. Their suspicion that exploitability and irrationality can come apart is philosophically significant. 

  First, I need to refine the central question. The strongest version asks: "Can an agent with strictly transitive-at-each-time preferences be money-pumped due solely to cyclical preference shifts over time?" This isolates the issue from standard intransitivity cases. 

  Three precisifications come to mind: 
  1) **Weak shifts**: Cyclical but slow preference changes where the agent can anticipate future shifts. Here, standard solutions like sophistication/resolution might apply. 
  2) **Strong shifts**: Abrupt, unpredictable changes where foresight fails. This is where exploitability might persist despite rationality. 
  3) **Meta-preference failures**: The agent lacks higher-order preferences to regulate shifts. This might bridge exploitability and irrationality. 

  The second approach feels most novel—it forces a wedge between exploitability (practical vulnerability) and irrationality (normative defect). The literature assumes they align, but here an agent could satisfy all standard rationality conditions yet still be pumped if shifts are unpredictable. That’s publishable territory. 

  For the proposal, I’ll frame it as a dilemma: If the pump works, transitivity isn’t the real target; if it doesn’t, exploitability requires synoptic failures. The method should test standard fixes (sophistication, resolution, commitments) against temporal cycling. Crucially, sophistication/resolution fail with strong shifts—you can’t plan around unpredictable changes. This is the gap. 

  Scope-wise, this is a semester project: formalize models, test solutions, and show where exploitability divorces from irrationality. Failure would be if all cases reduce to known problems (e.g., if cycling implies synchronic incompleteness). But I doubt that—the temporal dimension adds new structure. 

  User’s instinct to avoid vague "explore X/Y" is spot on. I’ll keep the proposal lean: question → gap → method → success/fail conditions. No fluff. They’ll add citations later, so I’ll reference view families (e.g., McClennen’s resoluteness vs. Gauthier’s sophistication). 

  Honest risk: Some might argue cyclical shifts imply hidden irrationality (e.g., inconsistent reasons). But that’s exactly the debate the project would fuel—worth flagging as "failure" if unavoidable. Still, the temporal pump seems robust enough to warrant investigation.
answer: |-
  ## Research Proposal: Temporal Money-Pumps and the Diachronic Target of Exploitability Arguments

  **Project Title:** Exploitability Without Synchronic Incoherence: Money-Pumps Targeting Diachronic Preference Cycling

  ### 1. Core Research Question
  *Can an agent whose preferences are strictly transitive at every individual moment in time, but cycle predictably across time, be subjected to a money-pump? If so, what does this reveal about the necessary conditions for rational immunity to exploitability, and does it force a conceptual separation between exploitability and irrationality?*

  **Determinate Resolution:** The project will be resolved by:
      (a) Formally constructing a robust money-pump scenario exploiting *only* predictable diachronic cycling (no synchronic intransitivity).
      (b) Rigorously testing whether standard solutions to synchronic money-pumps (sophistication, resoluteness, commitment devices, meta-preferences) successfully block the *diachronic* pump.
      (c) Establishing whether exploitability *necessarily* implies irrationality in this diachronic case, or if a rational agent satisfying standard synchronic criteria can be exploitable due solely to predictable preference change.

  ### 2. Why Existing Positions Leave It Open
  Existing decision theory largely conflates exploitability with synchronic irrationality (primarily intransitivity). The standard money-pump narrative targets the synchronic structure of preferences at a single time. Responses focus on synchronic fixes:

  *   **Orthodox Transitivity Enforcers:** Assume rationality requires transitivity, making exploitability proof of irrationality. They dismiss diachronic cycling as irrelevant to the core argument.
  *   **Sophistication Approaches (e.g., McClennen, early Gauthier):** Address dynamic choice by having agents anticipate *future* synchronic incoherence (e.g., future temptation/intransitivity). They don't address cycling where *each future self is synchronic-rational*.
  *   **Resoluteness Approaches (e.g., McClennen):** Advocate sticking to an initial plan made before preference shifts. This assumes the initial plan is optimal *relative to the initial preferences* and doesn't address whether *predictable cycling itself* is irrational or exploitable.
  *   **Meta-Preference Views (e.g., Bratman):** Introduce higher-order preferences over one's own preference structures. However, they often presuppose a stable meta-preference, not addressing agents whose fundamental evaluative criteria themselves cycle predictably.
  *   **Causal Decision Theory / Ratificationism:** Focus on the synchronic evaluation of acts/options at choice nodes, not the diachronic pattern of shifts in the evaluation *function* itself.

  **The Gap:** No major position systematically investigates whether predictable preference cycling *across synchronic-rational selves* is sufficient for exploitability *by itself*, or whether the standard solutions (designed for synchronic flaws) apply here. The possibility that exploitability might persist without synchronic irrationality remains unexplored.

  ### 3. Proposed Methodology (Semester Plan)

  *   **Month 1: Formalizing the Diachronic Money-Pump (DMP)**
      *   Construct a precise sequential decision model (tree or extensive form) involving choices over time (t1, t2, t3) and small monetary payments ("pennies").
      *   Define an agent with strictly transitive preferences at t1 (A > B > C), t2 (B > C > A), t3 (C > A > B).
      *   Design a strategy for the "pumper" to offer trades exploiting the predictable shifts: e.g., at t1, pay penny to swap C for A; at t2, pay penny to swap A for B; at t3, pay penny to swap B for C. Result: Agent ends with original option (C) minus 3 pennies.
      *   Ensure no single choice is intransitive; exploitability arises purely from shifting transitive orderings.
  *   **Month 2: Testing Standard Solutions Against the DMP**
      *   **Sophistication:** Can the agent at t1, knowing its t2 and t3 preferences, foresee the pumping path and refuse the initial trade? *Challenge:* Refusing might violate t1 preferences (if A > B > C, and the trade offers A for C + penny, refusal may be suboptimal *at t1*). Does sophistication mandate a suboptimal choice *now* to avoid future exploitation? Is this rational?
      *   **Resoluteness:** Can the agent at t1 form a "plan" (e.g., "Reject all trades") binding future selves? *Challenge:* If the plan prevents trades that would be preferred by the future self *at that time* (e.g., t2 self prefers B over C and would rationally accept a trade for B if offered directly), is it rational to bind oneself against future rational preferences? Does resoluteness require *irrationality* at t2/t3?
      *   **Commitment Devices:** Can the agent pre-commit at t1 to prevent trades at t2/t3? *Challenge:* Requires foresight and a feasible device. Crucially, does adopting such a device *change the agent's preferences* (making them stable) or merely *constrain action* despite shifting preferences? Is exploiting oneself via commitment rational if preferences shift?
      *   **Meta-Preferences:** Can the agent have a stable higher-order preference *against* cycling? *Challenge:* What if the meta-preference *itself* cycles predictably? Or if the agent lacks the resources (cognitive, normative) to form stable meta-preferences? Does the requirement for stable meta-preferences beg the question against the possibility of rational cycling?
  *   **Month 3: Analysis of Exploitability vs. Irrationality & Implications**
      *   Synthesize results: Does any standard solution robustly block the DMP without requiring actions that violate the agent's *current* synchronic rationality?
      *   Core Argument: If the DMP works and standard solutions fail or impose synchronic irrationality, then *exploitability is possible even in the absence of synchronic irrationality*.
      *   Conceptual Clarification: Argue that money-pump arguments primarily target *predictable dynamic inconsistency* (which *can* arise from synchronic intransitivity, but *can also* arise from predictable diachronic cycling of synchronic-rational preferences). The necessary condition for exploitability is predictability of inconsistency, not synchronic incoherence itself.
      *   Define the "Diachronic Coherence Requirement": Rational agents must either have stable preferences or possess mechanisms (like robustly effective meta-preferences or commitment) that render predictable shifts non-exploitable. This requirement is distinct from synchronic transitivity/completeness.
      *   Draft findings and outline implications for theories of dynamic choice, rationality, and the interpretation of money-pump arguments.

  ### 4. Success vs. Failure Conditions

  *   **Good Outcome (Success):**
      *   A formally robust DMP is constructed.
      *   Standard synchronic solutions are shown to be inadequate or themselves irrational when applied to the DMP.
      *   A compelling case is made that exploitability persists without synchronic irrationality, forcing a separation and highlighting predictability of dynamic inconsistency as the true target.
      *   A clear, novel "Diachronic Coherence Requirement" is articulated as a distinct component of rationality.
      *   The project identifies a significant gap in the literature concerning the rational permissibility of predictable preference change.
  *   **Failure:**
      *   The DMP scenario inevitably smuggles in synchronic intransitivity or irrationality under scrutiny (e.g., if cycling implies incompleteness at choice points).
      *   A standard solution (likely sophistication or resoluteness, perhaps with specific interpretations) robustly blocks the DMP without irrationality, showing the problem is reducible to existing frameworks.
      *   The argument conclusively shows that predictable diachronic cycling *itself* constitutes a form of irrationality (e.g., as a failure of meta-rationality), collapsing the distinction between exploitability and irrationality in this case. (This is a *substantive* failure of the core hypothesis, but still a valuable result).
      *   The project becomes mired in unresolvable debates about the nature of preference or personal identity over time, failing to yield clear conclusions about exploitability.

  ### 5. Scope Assessment
  This is firmly a **one-semester project**. The core task – constructing the DMP and testing standard solutions against it – is focused and achievable within 3-4 months. It targets a specific, well-defined gap using established tools from decision theory and dynamic choice. While the *implications* could be far-reaching (potentially challenging foundational assumptions), the *core work* of demonstrating the possibility and analyzing standard defenses is manageable in this timeframe. The outcome will be a paper demonstrating the DMP and its implications, suitable for the fellowship and subsequent journal submission.

  **Proposal Tone:** This proposal stays firmly in the weeds of decision-theoretic modeling and argumentation. It focuses on constructing a specific challenge (the DMP) and rigorously testing existing solutions against it. The philosophical implications (separating exploitability/irrationality, defining diachronic coherence) arise directly from this technical analysis. The plan is concrete: formalize, test, analyze. This is a work plan, not a general essay.
