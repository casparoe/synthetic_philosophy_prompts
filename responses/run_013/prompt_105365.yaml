prompt: |-
  I'm working up a short research proposal — two pages, for a small internal fellowship in decision theory — and I need you to help me turn a half-formed idea into something clear and defensible. Act like a philosopher who works on diachronic rationality and has read far too many money-pump papers. Before you write anything, please brainstorm out loud for a bit: what's the strongest version of the idea below, what are the two or three ways it could be made precise, and which of those is most likely to be a genuine contribution rather than a relabeling of something already on the shelf. Then give me the proposal itself.

  Here's the idea. Every money-pump argument I've come across targets *intransitive* preferences: the agent prefers A to B, B to C, and C to A all at the same time, so you lead them around the loop and relieve them of some money. The usual moral is that intransitivity is irrational, or at minimum a kind of incoherence. But it seems like you can build the same kind of pump out of an agent whose preferences are perfectly transitive at every moment and only *cycle across time*: on Monday they prefer A to B, on Tuesday B to C, on Wednesday C to A, and so on, with each day's ranking internally consistent. There's no intransitivity anywhere in sight, yet you can still walk them around the loop and extract money. So either the pump shows nothing about rationality in this case, or it shows that the real target of money-pump arguments was never transitivity but something about how preferences are supposed to hang together over time. I lean toward the second, and I suspect it forces a seperate between two things that get run together a lot: (a) being exploitable and (b) being irrational. My hunch is they can come apart, and that the literature mostly assumes they can't.

  What I need the proposal to do:

  - State the question so it has a determinate answer — I want to know exactly what would count as resolving it, not a vague "explore the relationship between X and Y."
  - Say why the existing positions leave it open. I don't need citations, I'll add those myself, so just refer to the families of views and the moves they make.
  - Lay out the method: what I'd actually do, month by month, over a semester. I'm especially interested in whether the standard fixes for intransitive agents — becoming sophisticated, becoming resolute, adopting a commitment device, having preferences about your own preference structure — even apply when the cycle is across time instead of within a single ranking. It's not obvious they do, and if they don't, that's probably where the real result lives.
  - Tell me what a good outcome looks like versus what would count as the project failing. I'd rather know now if the honest answer is "this collapses into a question people already answered."
  - Give an honest read on scope: is this a semester, a year, or a career?

  Think carefully about the framing before you commit to it, since that's the part I'm least sure about. Also don't let it drift into a general essay on rationality — keep it a plan for work I haven't done yet, and keep it in the weeds.
