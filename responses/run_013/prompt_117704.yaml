prompt: |-
  I'm a high school student doing an independent research project on interpretability, and I'd like a careful conceptual explanation rather than a survey. I don't have journal access, so please don't organize the answer around who has said what; I'm interested in the ideas themselves.

  The project is on mechanistic anomaly detection, which I take to mean roughly this: you use circuit-level analysis on a model's training distribution to form a hypothesis about the mechanism the model is using, and then you flag an input as anomalous when the model's behaviour on that input isn't what the hypothesized mechanism would predict. My advisor keeps pressing me on something that comes before any of that, and I can't answer her: when do two episodes of a model's computation count as instances of the same mechanism at all?

  Here is the case I keep coming back to. I train a small transformer on formatted multi-digit addition. On inputs that look like the training data, one pair of attention heads plus an MLP does the work: ablating them destroys accuracy. On a new family of inputs — say, addends with leading zeros, or ones with unusually long carry chains — the model is still accurate, but the information is now routed through a different set of heads; ablating the original circuit barely hurts performance, while ablating the new heads wipes it out. So is this the same mechanism or a new one? Three criteria I've tried give me three answers. (1) Same components and wiring: no, plainly not. (2) Same algorithm — still digit-wise addition with carry propagation, just implemented elsewhere: yes. (3) Same role in the larger computation, i.e. the same thing is being computed and handed onward: yes, and this is the one I actually want, but I can't say why it should win over the other two.

  A friend suggested that a mechanism should simply be defined as an equivalence class of computations under the set of interventions we care about, so that sameness just means invariance under those interventions. That seems to make sameness depend on what we happen to care about, which sounds circular — unless the notion really is interest-relative and that's simply the truth of the matter.

  Please explain how these criteria come apart, and what, if anything, settles which one is right for the purpose of calling something an anomaly. If my framing assumes something that makes the question unanswerable as posed, tell me that plainly instead of answering the nearest well-formed question — I would rather find out that my question is confused. And if the honest answer is that it always depends on your purposes, please say what work the purposes are actually doing rather than leaving it as a slogan.
reasoning: |-
  We are grappling with a fundamental question in mechanistic interpretability: when do two computational episodes (i.e., two model activations on different inputs) count as instances of the same mechanism? The example provided is a transformer trained on multi-digit addition that, on out-of-distribution inputs (like leading zeros or long carry chains), uses a different set of heads and MLPs to perform the same task. The three criteria considered are:

  1. **Same components and wiring**: This is a structural criterion. If the same set of neurons and connections are used, then it's the same mechanism. In the example, the components change, so by this criterion, it's a different mechanism.

  2. **Same algorithm**: This is a functional criterion at the level of the abstract algorithm. The model is still performing digit-wise addition with carry propagation, so by this criterion, it's the same mechanism.

  3. **Same role in the larger computation**: This is also a functional criterion but at a higher level of abstraction. The output (the sum) is the same and is used in the same way by downstream processes (if any). So by this criterion, it's the same mechanism.

  The problem is that these criteria conflict. The question is: which one is right for the purpose of mechanistic anomaly detection? And is there a non-circular way to decide?

  ### The Friend's Suggestion: Invariance Under Interventions

  Your friend's suggestion is to define a mechanism as an equivalence class of computations under a set of interventions. That is, two computational episodes are the same mechanism if, for every intervention in a set we care about (e.g., ablations, activation patching, etc.), they respond in the same way. 

  This approach is interest-relative because the set of interventions we care about is determined by our goals. However, it is not necessarily circular if we can independently specify the set of interventions. The key is that the interventions are our tools for probing the mechanism. 

  In the context of anomaly detection, the set of interventions we care about might be those that we have used to understand the model on the training distribution. Then, an input is anomalous if the model's behavior on that input (as revealed by these interventions) does not match the behavior we expect from the mechanism we identified in the training distribution.

  ### How Does This Apply to Your Example?

  Let's say we have identified a circuit (a set of heads and MLPs) that is necessary and sufficient for addition in the training distribution. We have done this by, for example, ablating components and seeing that performance drops only when we ablate these specific components.

  Now, on a new input (say, with leading zeros), we perform the same set of interventions:

  - Ablating the original circuit does not cause a performance drop (so the original circuit is not necessary for this input).
  - Ablating a different set of heads and MLPs causes a performance drop (so a new circuit is necessary).

  By the interventionist criterion, the computational episode on the new input does not belong to the same mechanism as the training distribution because it does not respond in the same way to the ablation of the original circuit.

  But note: if we had defined the mechanism at a higher level of abstraction (say, by the algorithm it implements) and our interventions were different (e.g., we only care about the output and not the internal components), then we might get a different result. For example, if our intervention is to change the input digits and see if the output is the correct sum, then the new input might be classified as the same mechanism because it produces the same output.

  ### What Settles Which Criterion to Use?

  The purpose of the anomaly detection determines the criterion. In mechanistic anomaly detection, we are specifically interested in the internal workings of the model. We want to know if the model is using the same internal process it learned during training. Therefore, we are likely to care about the internal structure (circuit) and how it responds to interventions on that structure.

  Thus, for your project, the first criterion (same components and wiring) or the intervention-based criterion (which is a generalization of the first) might be the most appropriate. Why?

  - The goal is to detect when the model is solving the same problem (addition) but using a different internal process. That is exactly what you observed in the example: the model uses a different circuit. This is an anomaly because we expected the model to use the same circuit it learned during training.

  However, note that the model is still performing the task correctly. So if we only care about the output, we wouldn't flag this as an anomaly. But if we care about the internal consistency of the model's mechanism (for example, because we are worried that the model might be using a different mechanism that could fail in ways we don't understand), then we do want to flag it.

  Therefore, the key is to clarify the goal of the anomaly detection:

  - If the goal is to detect when the model is producing outputs that are incorrect (or have unexpected properties) relative to the training distribution, then we might not care about the internal mechanism. We might just look at the output.

  - If the goal is to detect when the model is using a different internal process, even if the output is correct, then we care about the internal structure and the interventions that probe it.

  In the context of mechanistic interpretability, the latter is typically the focus. The anomaly is a deviation in the mechanism.

  ### Resolving the Tension

  The three criteria are actually operating at different levels of abstraction:

  1. **Structural level**: The physical (or computational) substrate: the specific neurons and connections.
  2. **Algorithmic level**: The abstract steps the computation takes (e.g., the algorithm of addition with carry).
  3. **Functional level**: The role the computation plays in the larger system (e.g., producing the sum).

  These levels are not mutually exclusive; they are complementary. However, for the purpose of mechanistic anomaly detection, we are typically interested in the structural level because we are trying to understand the model as a computational machine built out of specific components.

  ### Conclusion

  For your project, the criterion that should be used is the one that aligns with the goal: detecting when the model uses a different internal circuit to solve the same task. Therefore, you should consider two episodes as instances of the same mechanism if they use the same set of components (or at least, if the same circuit is necessary and sufficient for the computation on both inputs). If the model uses a different set of components (as revealed by the same set of interventions that identified the original circuit), then that is a different mechanism.

  This is a structural criterion, but note that it is relative to the interventions we have chosen to define the circuit. The interventions are the tools that allow us to define the mechanism. Thus, the friend's suggestion is on the right track: the mechanism is defined by its responses to interventions. The set of interventions we choose reflects what we consider to be the essential properties of the mechanism.

  So, in summary:

  - The purpose of the anomaly detection (to flag changes in the internal computational structure) determines which criterion we use.
  - The criterion we use is the structural one, operationalized through interventions: if the same set of interventions that were necessary and sufficient for the mechanism in the training distribution are not necessary and sufficient on a new input (i.e., the model uses a different set of components to achieve the same output), then the input is anomalous.

  Thus, in your example, the input with leading zeros is anomalous because the model uses a different circuit. This is true even though the algorithm and the functional role are the same.

  ### Final Note: Is the Question Confused?

  Your framing is not confused. It is a deep and important question. The key insight is that there is no absolute notion of "the same mechanism" independent of our interests and the level of abstraction we choose. But for the specific purpose of mechanistic anomaly detection, we have a clear reason to prefer the structural (intervention-based) criterion.
answer: |-
  Your question cuts to the heart of a foundational challenge in mechanistic interpretability: **what constitutes "sameness" of a mechanism across different computational episodes?** This isn't a confusion in your framing—it's a legitimate conceptual puzzle. I'll explain why the three criteria you proposed naturally conflict, why your advisor's pushback is warranted, and how to resolve this for anomaly detection. The resolution isn't arbitrary; it hinges on the **purpose** of mechanistic anomaly detection itself.

  ### Why the Criteria Conflict: Levels of Abstraction
  The three criteria you listed operate at distinct levels of abstraction:
  1. **Structural Sameness (components/wiring)**:  
     Focuses on the physical implementation—specific neurons, attention heads, or weights.  
     *In your example*: Different heads/MLPs are active → *different mechanism*.  
     *Analogy*: Two calculators adding numbers—one using silicon chips, another using vacuum tubes. Different hardware, same function.

  2. **Algorithmic Sameness (abstract procedure)**:  
     Focuses on the step-by-step process (e.g., digit-wise addition with carry propagation).  
     *In your example*: Addition still follows the same algorithmic steps → *same mechanism*.  
     *Analogy*: Two programmers write code for addition—one in Python, another in C++. Different code, same algorithm.

  3. **Functional Sameness (role/output)**:  
     Focuses on the computation's purpose in the larger system (e.g., "compute the sum of two numbers").  
     *In your example*: The output is still the correct sum → *same mechanism*.  
     *Analogy*: A human and a calculator both output "5+3=8." Different implementers, same role.

  These levels are **orthogonal**: a mechanism can be the same at one level but different at another. There's no universal "correct" level—each reveals different aspects of the system.

  ### Why Purpose Determines the Right Criterion
  Mechanistic anomaly detection isn't about cataloging mechanisms for their own sake—it's a **safety tool**. Its goal is to flag inputs where the model behaves *correctly but unexpectedly*, suggesting hidden flaws (e.g., edge cases where the model might fail catastrophically later). This purpose dictates which criterion matters:  
  - **Structural deviations are red flags** because they reveal that the model's *known reliable circuit* isn't being used, even if the output looks correct.  
  - Functional/algorithmic sameness alone is insufficient—it masks the fact that the model is "winging it" with a backup circuit that might be less robust.  

  In your example:  
  - The model uses a **new circuit** for inputs with leading zeros (structural change).  
  - But it still adds correctly (functional sameness) using the same algorithm (algorithmic sameness).  

  This *is* anomalous for safety: the model has **redundant pathways** for addition. You'd want to detect this because:  
  1. The backup circuit might fail under slight distribution shifts (e.g., longer carry chains).  
  2. It suggests the model learned multiple strategies, which could indicate brittle overfitting.  
  3. It reveals that ablating the "original" circuit wasn't a faithful indicator of mechanism reliance—a hole in your interpretability claim.  

  **Thus, for anomaly detection, structural sameness is primary.** It directly probes whether the model relies on the *specific circuit you documented* during analysis.

  ### How "Intervention-Relativity" Avoids Circularity
  Your friend's suggestion—defining mechanisms via equivalence under interventions—isn't circular. It's a **operationalization tool**:  
  - **Interventions** (e.g., ablation, activation patching) are tests you perform to *define* the mechanism.  
  - **Sameness** means: *If I apply the same intervention to two inputs, do I get the same effect?*  

  In your case:  
  - On training data, ablating Head A and Head B destroys performance → they're necessary.  
  - On leading-zero inputs, ablating A+B does nothing → they're not necessary.  
  - Thus, by intervention (ablation), the computations are **not equivalent** → different mechanism.  

  This isn't "whatever we care about" arbitrarily—it's grounded in:  
  1. **Reproducibility**: The mechanism is defined by experimental results (intervention outcomes).  
  2. **Generalizability**: An anomaly occurs when interventions behave differently *despite functional sameness*.  

  Purpose enters here because you choose interventions that test **safety-relevant properties** (e.g., "does the model rely on this fragile subsystem?"). The relativity isn't arbitrary—it's tied to the failure modes you're monitoring.

  ### Practical Resolution for Your Project
  1. **Define mechanisms structurally**:  
     A "mechanism" is the minimal set of components (e.g., heads, MLP layers) necessary *and sufficient* for a task on your training distribution. Validate this via interventions (ablation, patching).  

  2. **Flag anomalies via intervention drift**:  
     An input is anomalous if:  
     - The model's output is functionally correct (so it's not a standard misprediction),  
     - But interventions show **changed reliance** on the mechanism (e.g., ablating it no longer causes failure).  

  3. **Acknowledge higher-level sameness, but subordinate it**:  
     You can note algorithmic/functional consistency in your reports ("still adds correctly"), but the anomaly is the structural deviation. This explains *why* the model might fail later—it's using an unvetted backup.  

  ### Why This Isn't a Slogan
  Saying "it depends on purpose" often feels empty, but here, purpose **constrains the metaphysics**:  
  - Safety goals require monitoring *implementation consistency* because that's where hidden flaws live.  
  - If you cared only about output correctness (e.g., in a static benchmark), structural sameness wouldn't matter.  
  - But mechanistic anomaly detection is inherently about **internal processes**—hence structure wins.  

  Your case exemplifies this: the structural shift *precedes* potential failure. Long carry chains might break the backup circuit precisely because it wasn't optimized for them during training.

  ### Key Takeaways
  - **Conflict source**: Sameness is level-relative (structural/algorithmic/functional).  
  - **Resolution**: For mechanistic anomaly detection, prioritize structural sameness with interventions as the test.  
  - **Why**: Structural deviations indicate unvetted computations that could fail under stress—even if outputs are currently correct.  
  - **Non-circularity**: Interventions operationalize "mechanism" via reproducible tests, not arbitrary interest.  

  This isn't confusion—it's a deep insight about how interpretability tools must align with their use cases. Your example is a perfect testbed: try running interventions on the backup circuit for long carry chains and see if it fails more often than the primary circuit. That would validate why structural anomaly detection matters.
