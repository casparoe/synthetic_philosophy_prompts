prompt: |-
  For several years I have worked on large distributed systems, and I keep running into a pattern in how we reason about them for which I have no name. I would like to know whether philosophy of science already has one, and if the nearest established concepts do not fit, I would like a careful account of what the thing actually is and how it differs from those concepts, rather than a bare label.

  Here is the pattern. Such a system admits two descriptions. The upper one is coarse — throughput, queue depth, the shape of the latency distribution, the tendency of a cache to stay hot — and it is the description we use to predict and to explain. The lower one is the exact trajectory: which instruction ran, which packet arrived when. We act on the upper description, and it is remarkably stable: move the system to different hardware, rewrite its internals, change the timing of individual events, and the upper-level claims still hold. The lower-level story is not merely unwieldy; it appears to be the wrong place to look for the general truths, since almost everything in it is incidental.

  What I cannot classify is this. The clean upper-level behaviour is not something the lower-level description delivers at any actual operating point. It appears only as a limit — as the number of requests grows, as the workload becomes stationary, as the noise averages out — and at every finite, real, messy operating point the lower-level description yields something that does not exhibit the clean regularity, or exhibits it only approximately and by accident. Yet we treat the upper-level law as true of the real system, and we are right to: it is the reliable thing to reason with, and it does not care which of many very different lower-level arrangements is doing the work. So the object of interest is a general truth that (i) is stated at the coarse level rather than the fine one, (ii) is robust across an enormous range of fine-grained differences, and (iii) cannot be read off any single finite fine-grained situation, only off a limit that no actual system attains.

  I have heard the words reduction and emergence used in this vicinity, and neither seems to be the thing. Reduction suggests that the coarse truth ought to be derivable from the fine description, whereas here the derivation goes through only in a limit we never reach. Emergence, as it has been explained to me, suggests that the coarse level has novel causal powers of its own that push the fine level around, and I neither need nor want to claim that; the fine level seems to be doing all the pushing. Nor is this simply multiple realizability, if I understand that term, since that says one coarse kind can be realized in many ways, whereas my puzzle is that the coarse law is exact only in a limit and merely approximate everywhere else.

  So: does this configuration have an established name, and what is the best-established concept under which it should be filed? I would like you to do three things. First, tell me whether there is a standard term for it and, if so, what it is. Second, if there is no single term, give me the two or three nearest concepts and say precisely where each one diverges from the pattern above — specifically, which of the three features I listed each concept captures and which it misses. Third, in either case, propose a definition of the phenomenon as I have described it that would let me decide, of a given case, whether it is an instance, and supply a boundary case that has some of the three features but not all, so that I can see where the edges lie. I am not asking for a reading list or for citations; I want the carving.
reasoning: |-
  Okay, the user is describing a pattern they've observed in large distributed systems where they have two levels of description: a coarse upper level with stable, predictable behaviors like throughput and latency distributions, and a detailed lower level with exact event trajectories. The upper level remains consistent despite changes in hardware or implementation, while the lower level is messy and incidental. The key points are that the upper-level behavior only emerges as a limit (e.g., with infinite requests or stationary workloads) but is treated as true for practical purposes, even though it's never perfectly realized in any finite system.

  The user rejects reductionism because the coarse truths aren't derivable from fine details without invoking unrealized limits. They also dismiss emergence as commonly explained because they don't see novel causal powers at the coarse level—just robust statistical patterns. Multiple realizability is noted but deemed insufficient since it only addresses variability in implementation, not the limit-based approximation.

  I need to figure out if there's an established philosophical term for this. The core elements are: (1) coarse-grained descriptions, (2) robustness across fine-grained variations, and (3) dependence on mathematical limits for exactness. Statistical mechanics comes to mind, where thermodynamics (coarse) arises from particle mechanics (fine) only in the thermodynamic limit. Concepts like universality in phase transitions also fit—critical behavior is identical across different systems when scaled to infinity.

  "Universality" might be close, but it's more specific to critical phenomena. "Effective theories" or "renormalization group invariants" from physics describe high-level laws that hold regardless of microscopic details. However, these terms might be too physics-specific. The user wants a concept that emphasizes the limit-based emergence without new causality.

  Since no single term perfectly fits, I should outline the closest concepts: universality, effective theories, and the thermodynamic limit. Each captures different aspects. Universality emphasizes robustness and limit dependence but is domain-specific. Effective theories handle coarse-grained stability but may imply derivability. The thermodynamic limit captures the infinite-system idealization but is a condition rather than the phenomenon itself.

  For a boundary case, consider fluid dynamics: Navier-Stokes equations describe fluid behavior macroscopically, derived from molecular chaos in the continuum limit. This fits all three criteria. A near-miss example is biological natural selection: it's coarse and robust but doesn't require a mathematical limit; it operates in finite populations. 

  The best term might be "asymptotic universality," combining the limit aspect with robustness. This term isn't standard but accurately captures the phenomenon's essence. The user needs a precise definition to identify instances: a statistical regularity that becomes exact only as a system scales infinitely, remains stable across micro-variations, and guides practical reasoning despite finite approximations.
answer: |-
  Based on your precise description, there is **no single, universally established term** in philosophy of science that perfectly captures *all three features together* as you've defined them. However, there are several closely related concepts. Here's the analysis and the closest fit:

  1.  **The Core Phenomenon Defined (Based on your description):**
      *   **Definition:** A robust, law-like statistical regularity describable only at a coarse-grained level, which:
          (i) Is *exactly* true only in a specific mathematical limit (e.g., infinite size, infinite time, vanishing noise) that no actual finite system achieves.
          (ii) Is *robustly stable* across vast differences in the underlying fine-grained details and implementations.
          (iii) Is *practically indispensable* for reliable prediction and explanation of the system's behavior, despite only being approximately manifest (to varying degrees) in any finite instantiation.
          (iv) Cannot be rigorously *derived* from the fine-grained description of any *single finite instance* without invoking the limiting condition.

  2.  **Nearest Established Concepts & Their Divergences:**

      | **Concept**          | **Feature Captured**                              | **Feature Missed/Divergence**                                                                                              | **Why It Diverges**                                                                                                                               |
      | :------------------- | :------------------------------------------------ | :------------------------------------------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------------------------------------------ |
      | **Emergence (Strong/Emergent Properties)** | (i) Coarse-grained level of description. (ii) Robustness (often implied). | (iii) **Crucially misses the *limit-dependence* for exactness.** Emergent properties are often thought to be *actually present* in finite systems, even if novel. The "downward causation" aspect you reject is also common here. | Emergence focuses on novelty and potential causal autonomy *within the finite system*. Your phenomenon requires the *limit* for the *exactness* of the regularity, even if the approximation is robust. |
      | **Reductionism (Strict)** | (i) Fine-grained level as fundamental.           | (ii) **Fails robustness.** (iii) **Fails limit-dependence.** Strict reduction claims the coarse truth *should* be derivable *without limits* from the fine details of the *actual system*. | It fundamentally clashes with your core point: the coarse truth *cannot* be derived from the fine details of any single finite instance; it requires the idealization of the limit. Robustness shows it's *not* dependent on those specific details. |
      | **Multiple Realizability** | (ii) Robustness across fine-grained differences. | (i) **Doesn't inherently specify the coarse level *as the level of law-like regularity*.** (iii) **Doesn't address the *limit-dependence* for exactness.** | It explains *why* the coarse description is possible/useful (the same function/state can be built many ways), but doesn't capture the key point that the *law itself* only holds exactly in a limit, not in any individual realization. |
      | **Universality (Physics/Complex Systems)** | (i) Coarse-grained description (critical exponents). (ii) **Extreme Robustness** (details irrelevant near criticality). (iii) **Strongly implies limit-dependence** (scaling limits, infinite system size). | (iii) **Slightly too specific:** Universality is most rigorously defined in the context of continuous phase transitions and critical phenomena governed by renormalization group flow. | **This is the CLOSEST conceptual fit.** It nails (ii) and (iii), and strongly implies (i). Its limitation is its primary association with a specific *class* of physical phenomena (phase transitions) and the mathematical machinery (RG) used there, though the *idea* is broader. |
      | **Thermodynamic Limit** | (iii) **Defines the essential limit condition** (N→∞, V→∞, N/V constant) where exact laws (e.g., thermodynamics) emerge from statistical mechanics. (i) Coarse-grained description. | (ii) Robustness *follows* but isn't the primary focus; the focus is the condition for deriving exact laws. | It names the *limit* itself upon which the coarse-grained description *depends* for its exact truth. It's a necessary *condition* for your phenomenon in many contexts, but not the *name of the phenomenon* (the robust limit-dependent regularity). |
      | **Effective Field Theory (EFT)** | (i) Coarse-grained description. (ii) Robustness (low-energy physics insensitive to high-energy details). (iii) **Implies limit-dependence** (coarse-graining scale, often an IR limit). | (iii) **Focus is on approximation hierarchy & separation of scales, not always an *infinite* limit.** EFTs are designed to work *well* at finite scales. | EFTs are a powerful *methodology* embodying the *principle* behind your phenomenon – useful coarse laws independent of finer details. However, they are often constructed to be accurate *without* requiring the literal infinite limit, working well within a range. |

  3.  **The Best Conceptual Fit & A Proposed Term:**

      *   **Closest Established Concept: Universality** (understood broadly, beyond strict phase transitions). This captures the essence of robust, limit-dependent behavior insensitive to microscopic details.
      *   **Proposed Term for Your Specific Phenomenon: Asymptotic Universality** or **Limit-Dependent Macroscopic Regularity**.
          *   **Definition:** A statistical regularity governing the collective behavior of a complex system, which is:
              *   Described exclusively at a macroscopic/coarse-grained level.
              *   Observable only as an approximation in any finite instantiation of the system.
              *   Exact only under a specific asymptotic limit (e.g., system size → ∞, time → ∞, noise amplitude → 0, etc.).
              *   Robustly stable across significant variations in the system's microscopic implementation details.
              *   Functionally indispensable for the reliable prediction and explanation of the system's aggregate behavior.

  4.  **Boundary Cases:**

      *   **Clear Instance:** **Queuing Theory / Network Throughput.** The Law (e.g., Little's Law: L = λW) describes stable relationships between average queue length (L), arrival rate (λ), and average waiting time (W).
          *   *(i)* Coarse-grained (averages).
          *   *(ii)* Robust: Holds for diverse scheduling disciplines (FIFO, priority), server speeds, even packet types (if workload is similar). Rewriting the queue manager internals doesn't break it if the averages hold.
          *   *(iii)* Limit-Dependent: Exact only in steady-state (λ stable, infinite time horizon assumed). Any *finite* measurement interval shows fluctuations around the predicted averages. You cannot derive the *exact* steady-state value of L from a *single finite trace* of packet arrivals/service times without assuming the limit.
      *   **Near Miss (Has (i) & (ii), Lacks Key Aspect of (iii)): Biological Natural Selection.** Coarse-grained (fitness, population change). Highly robust (works across DNA/protein implementations, ecosystems). **However:** The "law" (differential reproduction based on heritable variation) *is directly operative* and observable *in finite populations and timeframes*, even if quantitative predictions require stochastic models. It doesn't *require* an infinite population or infinite time limit for the *core causal mechanism* to be exactly true *in that instance*. The limit (infinite population, infinite time) is used for *certain models* (e.g., deterministic allele frequency change), but the core principle is instantiated finitely.
      *   **Near Miss (Has (iii), Lacks (i) or (ii)): Chaotic System (e.g., Double Pendulum).** Its long-term behavior is *only* describable in a limit (attractor structure, sensitive dependence quantified by Lyapunov exponents in the infinite-time limit). **However:** (i) This description is often still fine-grained (phase space trajectory) or about instability, not a *coarse aggregate* like throughput. (ii) It is *not robust* to microscopic changes – tiny differences (butterfly effect) lead to vastly different trajectories. The robust, predictable thing (the attractor *shape* or the *exponent*) is coarse, but the sensitivity destroys robustness of the fine-grained path, which isn't your focus.
      *   **Near Miss (Has (i) & Robustness Implied, Lacks Explicit (iii)): Software Abstraction/API.** Defines a coarse behavior (e.g., `put(key, value)`). Robust across hardware/OS/internal rewrites. **However:** The correctness of the abstraction *is* (ideally) verifiable and derivable *for each specific finite implementation* against the specification. It doesn't *fundamentally rely* on an unreachable mathematical limit for its truth in a *single* system; it relies on the specific code correctly implementing the spec *in that instance*. The limit-dependence for *exactness* is missing.

  **In Summary:** Your phenomenon is best understood as a form of **Universality**, specifically **Asymptotic Universality**. It's a robust, macroscopic regularity that emerges *exactly* only under an idealized mathematical limit (size, time, vanishing fluctuations) but provides the indispensable, stable framework for understanding and engineering complex distributed systems despite this, precisely *because* it is insensitive to the chaotic details of any finite realization. This captures the core of your three features: coarse description, robustness, and essential dependence on an unreachable limit for exactness.
