  ## The Marovian Dead Letter Case

  In the Commonwealth of Marovia, Parliament passes the **Accessible Public Buildings Act 2023**, requiring all new public buildings to include step-free access. The Act is morally exemplary, promoting equality and inclusivity, and faces no significant public or political opposition. Marovian constitutional convention holds that statutes only become operative law after being **engrossed on vellum and impressed with the Great Seal**; this Act, due to an administrative oversight during a clerk’s strike, was never sealed. Crucially, we examine **two distinct patterns of official practice** regarding unsealed enactments:

  1.  **Uniform Practice Version:** For centuries, without exception, Marovian judges have *refused* to apply any unsealed enactment. Prosecutors never bring charges under them, police never enforce them, and officials cite the absence of the Seal as the definitive reason. The sealing ceremony is universally understood by all officials (judges, clerks, police chiefs, ministers) as an indispensable constitutional *precondition* for legal validity.
  2.  **Divided Practice Version:** Historical practice is inconsistent. *Some* judges have occasionally applied unsealed enactments deemed "urgent" or "uncontroversial," others have refused. Prosecutors sometimes proceed, sometimes don’t. Government guidance waffles, calling sealing "highly desirable" but not always "strictly necessary." Officials disagree openly; some insist sealing is vital, others see it as mere tradition or bureaucratic tidiness. There is no convergent understanding.

  **Judge Anya’s Dilemma:** Judge Anya must decide whether to order a ramp installed at a new courthouse, relying *only* on the unsealed Accessible Public Buildings Act. Is it valid law she must apply?

  ### Analysis: Applying the Theories

  1.  **Hartian Positivism (Focus: Social Fact of Official Acceptance)**
      *   **Core Mechanism:** Validity depends on the rule of recognition (RoR) – the ultimate rule identifying valid law within the system, evidenced by the *convergent practice and attitude* of officials (especially judges), treating certain criteria as *obligatory*.
      *   **Uniform Practice Verdict: NOT VALID LAW.** Here, the convergent official practice is crystal clear and utterly uniform. The *universal* refusal to apply unsealed statutes, *coupled* with the consistent articulation that the Seal is a *precondition* (not just a custom), demonstrates that the RoR *includes* the Great Seal requirement. Officials, through their behaviour and statements, treat the Seal’s absence as a *rule-based defect* negating validity. The Act’s moral worth is irrelevant; the social fact of official rejection based on a recognised rule defeats it. Judge Anya *must* dismiss the claim.
      *   **Divided Practice Verdict: LIKELY VALID LAW (But Uncertain).** Here, the key positivist test – convergent official practice treating a criterion as *obligatory* – fails. There is no consistent pattern of rejection based *solely* on the missing Seal. Officials’ practices diverge, and their attitudes (as shown in guidance and conflicting judicial rulings) reveal no shared belief that the Seal is a *necessary condition* for validity. It appears treated as a strong convention or best practice, not a validity-defining rule. Without this uniform practice/attitude establishing the Seal as part of the RoR, the Act likely *is* valid law because it passed Parliament – the core criterion officials *do* uniformly accept. Positivism struggles with ambiguity, but the burden is on showing a *rule* exists; here, the evidence suggests no such rule is *accepted*. Judge Anya *could* apply it, citing Parliament’s will as the decisive factor. The moral merit doesn’t *make* it law, but its passage via the primary law-making source does, absent a recognised secondary rule (the Seal requirement) negating it.
      *   **Why the Flip?** Positivism’s answer flips entirely based on the *empirical fact* of convergent official practice/attitude regarding the Seal’s status as a *validity condition*. Uniform rejection proves it *is* a rule; divided practice suggests it *isn't*.

  2.  **Fullerian Natural Law (Focus: Internal Morality of Law & Fulfilment of Function)**
      *   **Core Mechanism:** Law must meet minimum procedural moral standards (generality, promulgation, non-retroactivity, clarity, non-contradiction, possibility of compliance, constancy, congruence between declared rule and official action - the "inner morality of law") to *be* law. A rule utterly failing these is a "managerial directive" or mere power, not law. Authority derives from serving the common good through these principles.
      *   **Uniform Practice Verdict: VALID LAW (But Defective in Application).** For Fuller, the Act itself poses no problem: it’s general, clear, prospective, possible to comply with, promulgated (passed by Parliament), and aimed squarely at the common good (accessibility). The *defect* lies in the *system’s failure* regarding **congruence** – officials are systematically refusing to apply a rule that *is* validly made and morally sound. This is a profound failure of the legal *system*'s fidelity to its own rules, making the system itself defective. Crucially, *the rule itself* hasn't violated the inner morality; the flaw is in its *enforcement* by officials. Therefore, the Act *is* valid law. Judge Anya, to uphold the law’s constancy and congruence, *should* apply it, thereby correcting the systemic failure. The Seal convention, while traditional, lacks fundamental moral authority itself; its elevation over Parliament’s substantive enactment violates the principle that law must serve the common good and not be defeated by arbitrary formality.
      *   **Divided Practice Verdict: VALID LAW.** The analysis is largely the same. The Act itself meets all criteria of the inner morality. The divided practice signifies confusion and poor administration (detracting from clarity and constancy), but the core validity of the enactment isn't nullified. The confusion is about a *procedure*, not about the Act’s inherent qualities as a potential legal rule. Fuller would likely see the Seal requirement itself as potentially problematic if inconsistently applied (undermining clarity and constancy), but again, the *fault* lies with the system’s administration, not the substantive rule demanding accessibility. Judge Anya *should* apply it, promoting the common good and upholding Parliament’s legitimate authority.
      *   **Why No Flip?** Fuller’s focus is on the *substantive enactment’s characteristics* and its *purpose* relative to the common good. The official practice regarding the Seal is relevant to *systemic health* (congruence) but doesn't automatically negate the *validity* of a rule that otherwise fulfils the criteria for being law. The moral worth *and* formal passage by the recognised authority *make* it law. The Seal issue is seen as a procedural hurdle or bureaucratic failure, not a validity-defining moral principle.

  ### What's Doing the Work & The Seams

  *   **The Real Mechanism:** The reversal hinges on **the nature of the defective element** and **what each theory considers constitutive of legal validity**.
      *   For the **Positivist**, the Seal requirement's status is *entirely* determined by social fact (official practice/attitude). Uniform rejection makes it part of the RoR, killing the law. Divided practice suggests it *isn't* part of the RoR, so the law lives. The moral content is irrelevant scaffolding.
      *   For the **Natural Lawyer**, the Seal requirement is evaluated *morally* – is it a fundamental procedural principle essential to lawfulness? Fuller's answer is likely "No." It's merely a formality. The Act's moral purpose and passage by the recognised sovereign *are* fundamental. The official practice highlights a *systemic failure of congruence*, but doesn't negate the *inherent validity* of the rule itself. If the flaw were *within the rule* (e.g., it secretly reinstated slavery), Fuller *would* deny its legal character. Here, the flaw is *external* (procedural formality, then enforcement failure).
  *   **Taking it Away:** If the norm *were* morally objectionable (e.g., mandated discrimination), the Natural Lawyer (Fuller) would likely deny it *is* law in both versions, seeing it as violating the inner morality (serving injustice, not the common good). The Positivist verdicts would likely remain the same as above – dependent *only* on the social fact of the Seal's status in the RoR.
  *   **Attacking the Case:**
      *   **Positivist Attack (on Natural Law Verdict in Uniform Practice):** "You've cheated! You've *stipulated* the Seal isn't a fundamental moral principle. But if officials *treat* it for centuries as the *constitutional keystone* of validity, embodying the solemnity and authenticity of law, doesn't *that* social fact *give* it a moral significance within *that* system? Fuller talks about congruence – the officials' uniform practice *is* congruent with *their* understanding of the validity rule. By forcing Judge Anya to apply it, *you* are creating incongruence between her action and the established official practice defining validity!" (This argues the formality *has* become part of the system's "inner morality" through practice).
      *   **Natural Law Attack (on Positivist Verdict in Divided Practice):** "Your 'law' is a sham! In the divided version, officials are acting arbitrarily. Some apply it, some don't. This violates the core Fullerian principles of *clarity* and *constancy*. How can citizens know their obligations? You might call it 'valid', but it fails as *law* because it cannot reliably guide conduct – a fundamental purpose of law. Your positivism, by validating it based purely on Parliamentary passage while ignoring the enforcement chaos, sanctions a system that is fundamentally defective and unjust in its *operation*, even if the rule itself is good." (This argues the systemic defect *does* invalidate the rule's *character* as law).
  *   **Stipulation Check:** The key potential stipulation is that the **Seal requirement lacks inherent moral significance** for Fuller. A defender *could* argue that in a system where it's deeply embedded as *the* mark of sovereign authentication, it *does* carry moral weight for congruence and constancy. However, Fuller prioritises substance over form; a rule passed by the sovereign body *should* suffice if the formality serves no deeper moral purpose like preventing fraud or ensuring deliberation. The case holds if we accept that *this particular* formality is morally arbitrary. The **moral unobjectionability** of the norm is crucial to isolate the procedural issue – a wicked law would muddy the waters for the Natural Lawyer.

  This case cleanly isolates how positivism turns on observable official behaviour regarding validity criteria, while Fullerian natural law turns on the rule's inherent characteristics and purpose, treating enforcement failures as systemic defects rather than validity negators. The morally good law forces the positivist into the uncomfortable position of potentially denying valid law on a technicality, while the natural lawyer insists on applying it despite bureaucratic failure – achieving the requested reversal precisely through the lens of official practice.
