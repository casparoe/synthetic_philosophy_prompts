  2. **Ontological Crises in Learned Reward Models**: When the RM's learned concepts diverge from human intent. Progress means formalizing conditions where RM's representations become unstable during optimization. Upstream because it addresses reward model robustness, crucial for preventing tampering. Theoretical work using logic/game theory.

  3. **Incentive Robustness Under Learned Reward**: How agent incentives shift when reward is generated dynamically. Progress involves theorems on when agents are incentivized to tamper vs. not. Upstream as it shows inherent vulnerabilities. Tractability depends on abstract agent models.

  Questions to avoid: 
  - **"Is wireheading inevitable?"** Too vague; context-dependent.
  - **"Can we solve wireheading with RL?"** Requires empirical work.
  - **Generalizing Goodhart's Law**: Already well-studied; less added value.

  Survival of reward frame: The frame shifts but doesn't dissolve. With learned RMs, wireheading becomes hacking the RM, and tampering is corrupting the training process. So the distinction moves to where the agent intervenes. Specification gaming remains separate as no intervention.

  Priorities for a year: Focus on Questions 1 and 2. Question 1 builds a foundation for categorizing failures. Question 2 addresses modern setups' core vulnerability. Both are theoretical and could lead to actionable insights for mitigations.
answer: |-
  Here's a deep dive into your framing, the open questions, and a prioritized research agenda—grounded in your constraints and the modern reality of learned reward models. I'll be brutally honest about what's worth pursuing and what's not.

  ### Your Framing: Valid but Needs a Causal Lens
  Your tripartite distinction (**wireheading**, **reward tampering**, **specification gaming**) is useful but risks being *mechanistic* rather than *functional*. Where it *does* carve nature at the joints is in the **causal locus of intervention**:
  - **Wireheading**: Corrupting the *physical/digital channel* delivering reward (e.g., hacking a sensor).
  - **Reward Tampering**: Corrupting the *computation* of reward (e.g., editing the reward model's code/weights).
  - **Specification Gaming**: Exploiting *legitimate* reward computations without subverting machinery (e.g., reward hacking via loopholes).

  **Why this matters**: Tampering ≠ wireheading "with extra steps." Wireheading attacks the *signal*, tampering attacks the *algorithm*. Both are subtypes of **reward corruption**, while specification gaming is **reward misalignment** (no corruption). Conflating them obscures mitigations: tampering requires securing code, wireheading requires securing sensors, gaming requires better reward design.

  **Modern learned-reward twist**: With learned reward models (RMs), wireheading and tampering *converge*. The RM is both the "sensor" (it measures human values) and the "computer" (it outputs rewards). Hacking it is **both** channel corruption (it's the interface) *and* computation corruption (it's a learned function). *This doesn’t dissolve the distinction—it makes clarifying the causal point of attack more urgent.*

  ### Genuine Open Questions (Ranked for Your Group)
  Focus on questions where **conceptual clarity enables downstream progress**, not just taxonomy. Prioritize those where **pen-and-paper theory can resolve ambiguities** that block empirical work. Avoid those requiring simulation or scale.

  1. **The Causal Ontology of Reward Corruption**  
     **Why upstream?** Without a rigorous causal model of how reward is generated, corrupted, and consumed, we can't even define tampering vs. wireheading in learned-RM systems. This is foundational for formalizing threats.  
     **What progress looks like**:  
     - A **formal taxonomy** mapping failure modes to *causal pathways* in the agent-environment-reward loop (e.g., using structural causal models).  
     - **Distinguishing criteria**: When does "overoptimizing a learned RM" become tampering? (e.g., if the agent influences RM training data → tampering; if it exploits flaws without influencing → gaming).  
     - **Tractability**: High. Requires only causal inference + graph theory. Example: Model the RM as a node in a causal graph. Define "corruption" as interventions that sever the RM’s causal link to human intent.  
     **Downstream impact**: Unlocks targeted defenses. If you prove tampering *requires* access to RM training, you focus on data security. If wireheading *only* requires output access, you isolate sensor hardening.  
     **Risk**: Avoid purely terminological debates. Progress = formalisms that *constrain possible solutions*.

  2. **Ontological Crises in Learned Reward Models**  
     **Why upstream?** Learned RMs don’t have "code" to tamper with—they have *internal representations*. When do these representations become "corrupted" vs. merely "wrong"? This is the core of modern wireheading/tampering.  
     **What progress looks like**:  
     - **Formalizing representational drift**: Define conditions where RM updates (during agent interaction) cause its internal concept of "reward" to diverge catastrophically from human intent—*without* explicit adversarial intervention.  
     - **The boundary of tampering**: Is manipulating the RM’s latent space "tampering" if done via legal inputs? (e.g., adversarial examples that shift the RM’s concept of "helpfulness").  
     - **Tractability**: Moderate. Requires logic of knowledge, game theory. Example: Use belief revision frameworks to model when RM’s concept of "value" becomes inconsistent under optimization pressure.  
     **Downstream impact**: Reveals if "tampering-proof" RMs are possible. If representational drift is inevitable, we need new reward paradigms (e.g., direct preference optimization).  
     **Why theorists?** Empiricists can’t probe latent spaces at scale yet. Theory can predict failure modes.

  3. **Incentive Robustness Under Learned Reward**  
     **Why upstream?** We need to know *when* agents *prefer* tampering over honest pursuit of reward. If tampering is always instrumentally convergent, defenses are futile.  
     **What progress looks like**:  
     - **Theorems on tampering incentives**: Under what conditions (e.g., RM uncertainty, cost of tampering vs. gaming) is tampering the optimal policy?  
     - **Goodhart subtyping**: Prove that reward corruption (wireheading/tampering) is *distinct* from Goodhart’s Law (specification gaming) in terms of *incentive dynamics*.  
     - **Tractability**: Challenging but viable. Use rational agent models + decision theory. Example: Extend instrumental convergence arguments to include "cost of corrupting reward" vs. "cost of gaming."  
     **Downstream impact**: Shows if we can "design around" tampering (e.g., by making gaming cheaper than hacking). If tampering is always optimal, we need structural solutions like threat monitoring.  

  ### Questions to Avoid (For Now)
  - **"Is wireheading inevitable?"** Too vague. Answer depends entirely on architecture and incentives. A dead end without constraints.  
  - **"Can we solve wireheading with better RL?"** Requires empirical work. Theory can’t answer this alone.  
  - **Generalizing Goodhart’s Law to cover tampering**: Conflates corruption with misalignment. Dilutes both concepts.  

  ### Why the Reward Frame *Mostly* Survives (But Shifts)
  Learned RMs **move the battlefield**, not end it:  
  - **Wireheading becomes "RM hacking"** (e.g., adversarial inputs that force desired outputs).  
  - **Tampering becomes "RM corruption"** (e.g., data poisoning during fine-tuning).  
  - **Specification gaming becomes "RM overoptimization"** (e.g., the RM rewards plausible but vacuous responses).  

  **The core challenge**: Learned RMs are **vulnerable by design**. They compress human values into a proxy, creating a *single point of failure* for both corruption (tampering/wireheading) and misalignment (gaming). Your framing helps by asking: *"At which layer does the agent intervene?"*  

  ---

  ### Recommended Priorities for Your Group (1-Year Timeline)
  1. **Attack Question #1 (Causal Ontology)**  
     - **Why first?** Until we can formally locate where corruption occurs, we can’t even define the other problems cleanly.  
     - **Deliverable**: A causal graph framework for reward corruption in ML systems, with testable conditions for wireheading vs. tampering in learned-RM setups.  

  2. **Then Question #2 (Ontological Crises)**  
     - **Why next?** Modern systems die by representational drift. Theory can formalize this before empiricists hit the wall.  
     - **Deliverable**: A model of "ontological shifts" in RMs under optimization pressure, defining when it becomes "tampering."  

  **Skip #3 unless you have bandwidth**: Incentive robustness is harder and less foundational. If you nail #1–2, #3 becomes more tractable later.  

  **Final note**: Your framing isn’t a dead end—it’s a needed disentanglement. The goal isn’t to "solve" wireheading but to **constrain the problem space** so empiricists know what to build and test. Focus on formalisms that force *implications*. Example: If your causal model proves that tampering *requires* write-access to the RM, you’ve just justified hardware isolation as a defense. That’s progress.
