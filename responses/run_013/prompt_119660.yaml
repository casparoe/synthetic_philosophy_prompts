  The user specifically requests five numbered points analyzing the Lockheed case through different theoretical lenses: principal-agent theory, collective-action problems, anthropological gift-exchange, clientelism, and the cultural specificity of corruption definitions. They emphasize practical application for character development and insist on concise, defensible positions without intros/conclusions.

  Hmm, the core tension here is between universalist versus culturally relative views of corruption. The Lockheed case perfectly exposes this - Western corporations framed bribes as "commissions" while recipient cultures saw them as legitimate reciprocity. The user's frustration with moral categories "slipping" suggests they need frameworks where corruption emerges from systemic incentives rather than individual villainy.

  For point 1, principal-agent theory fits awkwardly because multiple principals (shareholders, citizens) have conflicting interests. Lockheed's survival arguably served shareholders despite violating public trust. Point 2's collective-action angle is stronger - the scandal persisted because unilateral honesty felt suicidal in a corrupt system. 

  The anthropological perspective (point 3) feels most crucial here. Calling payments "commissions" wasn't just euphemism; it reflected genuine normative differences. The Dutch prince likely saw military contracts as legitimate patronage, not corruption. This cultural clash shaped how the Foreign Corrupt Practices Act carved exceptions for "facilitating payments."

  On clientelism (point 4), the Japanese PM's actions become legible as distributive politics rather than theft. His resignation wasn't moral awakening but failed balance of obligations. Finally, the FCPA's asymmetry (punishing payers not takers) reveals corruption as a legal construct privileging Western jurisdiction over universal ethics.

  The user's hidden need might be justifying character motivations beyond "greedy/corrupt" tropes. A defense attorney character could rationally invoke point 2 ("everyone did it"), while a recipient official might sincerely believe point 3 ("this is custom"). The FCPA exception for facilitation payments becomes the perfect plot device - the exact blurred line their characters would debate.
answer: |-
  Here are five numbered points addressing your query:

  1.  **Principal-Agent Theory Fails the Test:** The "principals" (shareholders, taxpayers, electorates) are fractured and often in conflict. Lockheed paying bribes *did* serve shareholder interest (survival via sales), betraying taxpayers funding its bailout. Officials took payments serving local political patrons or personal networks, betraying abstract national interests. The theory struggles because loyalty was never solely to a single, clear principal.

  2.  **Collective-Action Captures the Rationale:** The scandal exemplifies a classic collective-action trap. *Not* paying bribes meant losing contracts to competitors who did. *Not* demanding them meant losing influence/resources to rivals within the system. Individual actors (executives, officials) were rationally responding to the perceived environment, making systemic change impossible without external enforcement (like the FCPA).

  3.  **Anthropological Lens Reveals Competing Moralities:** Calling payments "commissions" and hospitality "custom" wasn't mere excuse; it reflected embedded norms of reciprocity and obligation. Officials often genuinely believed powerful positions *entitled* them to personal enrichment as a form of tribute or lubricant for the system. This directly challenges the Western ideal of an impartial, disinterested bureaucracy.

  4.  **Clientelism Explains Political Survival:** For figures like Tanaka or the Italian President, payments weren't just personal graft but fuel for political machines. Distributing contracts (and the kickbacks they enabled) secured loyalty, funded parties, and maintained power networks. Resignations stemmed from exposure threatening this system, not necessarily moral guilt over the *act* itself.

  5.  **FCPA Asymmetry Exposes Cultural Power:** The law’s focus solely on the *payer* (US firms) and its "facilitation" exception highlight corruption as a culturally/politically defined category imposed by US jurisdiction and norms. It targeted what *Americans* could control, implicitly accepting that "routine" bribery elsewhere might be unavoidable, while refusing to criminalize foreign officials beyond US reach. This undermines claims of universal definition.
