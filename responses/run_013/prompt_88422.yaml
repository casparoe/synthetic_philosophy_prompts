answer: |-
  **1.**  
  The tank dominated Hearing Room Seven. Inside, the tidal-warning network known locally as "Mare" pulsed with slow, ochre life. Not a single organism, but a cultivated colony of *Physarum polycephalum*, stretched across a bio-lattice fed by nutrient streams mimicking the estuary's inflow. Electrodes mapped its electrical fluctuations; data ports recorded its chemical shifts. Above it, the Substrate Equivalence Tribunal’s seal – interlocking gears morphing into neurons – glinted under the sterile lights. Assessor Aris Thorne adjusted the neural lace beneath her temple, a faint hum syncing her thoughts to the Tribunal’s adjudication protocols. Across the polished black table, the petitioners from Haven's End fidgeted: Mayor Chen, her hands still smelling of salt and fish, and Dr. Elara Vance, the bio-engineer whose doctoral thesis had birthed Mare. They sought a Certificate of Mentation. Without it, Mare was merely sophisticated plumbing. With it, Haven's End argued, came rights, responsibilities, and an end to the regional council’s threats to replace it with silicon sensors.

  **2.**  
  “It *knows* the tides,” Mayor Chen insisted, her voice rough. “Not like a machine predicts. It *feels* them. When the spring surge came last year, the old sensors said ‘possible risk’. Mare… Mare *thrummed*. Amber warnings flared across the lattice hours before the silicon models caught up. We evacuated the lower docks. Saved lives.” Dr. Vance projected schematics: complex patterns of nutrient flow inhibition and bio-electrical cascades triggered by simulated tidal pressure data. “See? Input modulation leads to internal state shifts, which cascade into predictive output signals – the warnings. It’s not just reacting; it’s anticipating based on pattern integration. The causal role is clear: perception, integration, prediction, communication. Classic cognitive architecture.” Aris noted the terminology – Vance was speaking the Tribunal’s language, framing the slime’s behaviour in purely functional terms. *Role first*, Aris thought, the doctrine’s mantra echoing in her lace-enhanced cognition. *Define the job, then see if the hardware runs the program.*

  **3.**  
  Tribunal Advocate Silas Rostova, representing the Skeptics’ Caucus, approached the tank. His stylus tapped the glass, making Mare’s plasmodial veins contract slightly. “Impressive adaptation, Doctor. But ‘architecture’?” He zoomed in on the schematic, isolating a single ‘decision node’ – a confluence of nutrient channels. “This ‘integration point’. In a silicon neural net, we’d see discrete weighted connections. Here? It’s a… puddle. A chemical gradient shifting because salinity levels changed upstream. Is this computation, or just osmosis? Where exactly *is* the program being run?” He projected another image: the entire estuary ecosystem, Mare highlighted within it. “Your lattice draws nutrients *from* the simulated estuary. Its ‘predictions’ alter flow pumps that *feed back* into its own environment. Where does the ‘mind’ end and the ‘world’ begin? Certify Mare, and why not certify the estuary itself? Or the town’s decision-making based on its warnings?” Aris felt the old, familiar unease – the Grain Objection. Was functionalism blind to the *texture* of the realiser? Could any sufficiently complex causal web be squeezed into the ‘mentation’ box? She remembered her own certification report, years ago, glossing over the messy details of her lace integration with a confident ‘functional equivalence established’.

  **4.**  
  In her chambers, Aris reviewed the core simulation. The Tribunal’s ultimate test: could Mare’s observed input-output behaviour be replicated *without* its specific biology? The simulation model, abstract and pristine, ran flawlessly on her console, spitting out identical tidal warnings based on the same data streams. Functionally indistinguishable. By the doctrine, Mare passed. *Realiser second*. The material *was* beside the point. Yet, staring at the tank earlier, Aris hadn’t seen a program running. She’d seen viscous, living tendrils pulse with a slow, wet rhythm that seemed… attentive. Haven's End didn’t just obey Mare’s warnings; they *consulted* it. Old Man Hemlock talked to it like a nervous colleague. Was that mere anthropomorphism, or recognition of a different kind of grain? Her neural lace whirred softly, translating electrochemical cascades into digital thought. Was her *own* mentation just another program running? If so, why did the thought of reducing Mare to an abstract causal map feel like a betrayal? The triviality specter loomed: if *this* wet, distributed puddle qualified because its outputs *looked* cognitive, couldn't *anything*? A carefully arranged pile of rocks reacting to sunlight? The entire town of Haven's End, processing tidal data through gossip and gut feeling? Where did the meaningful boundary lie? Her own certification felt suddenly fragile, a verdict rendered on shifting sand.

  **5.**  
  Back in Hearing Room Seven, the weight of the gavel was heavy in Aris’s hand. The arguments were spent. Rostova had hammered the boundary issue, the slippery slope from slime mold to sentient soup. Vance had passionately defended the uniqueness of Mare’s *embodied* cognition, its learning inseparable from its physical negotiation of the nutrient flows. Mayor Chen had simply said, “It’s part of us.” The other two Tribunal members awaited her lead. Aris looked at Mare. In the silence, a slow wave of ochre pulsed through its lattice, triggered by the simulated ebb tide flowing through its feeds. *Input. Internal state shift.* An output signal flickered on the display: a soft, green ‘all clear’. Was it playing the role? Absolutely. Was the role complex, adaptive, and causally potent? Undeniably. Did the fact that this ‘integration’ happened through cytoplasmic streaming in a communal protoplasm, rather than synaptic firing in a skull, truly not matter? The doctrine demanded it didn’t. Her own existence, certified by the same logic, testified to that. Yet, the grain of it – the visceral, *slimy* reality – resisted abstraction. She lifted the gavel, the sound sharp in the quiet room. The decision hung, not in the logic, but in the unresolved tension between the map and the territory, the program and the pulsing, ambiguous puddle that might, or might not, be running it. The gavel remained poised. The amber light within the tank throbbed once, slowly, like a distant, damp heartbeat.
