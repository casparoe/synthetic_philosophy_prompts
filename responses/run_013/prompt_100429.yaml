  - Justifying that structure normatively (Buchak's "coherence" axiom vs. mathematical convenience). 
  - Boundary conditions for the risk function (r(0)=0, r(1)=1, increasing). 
  - Critically evaluating REU's abandonment of independence/sure-thing—including Buchak's defense and the student's own view. 
  - Distinguishing Buchak's normative use from descriptive uses like Quiggin's RDU or prospect theory. 

  Common pitfalls to avoid in answers: 
  - Conflating risk function r with utility function u. 
  - Treating rank-dependence as just a technical fix for Allais paradox. 
  - Mistaking REU for EUT with a different utility curve. 

  The user also wants a marking scheme that can spot conceptual errors even in vocab-fluent answers. For example, a student might say "r transforms probabilities" but not grasp why it's applied cumulatively/rank-ordered. Or they might parrot "independence is normatively dubious" without engaging Buchak's positive argument. 

