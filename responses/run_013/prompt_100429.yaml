  - Use simple examples (e.g., a gamble) to illustrate EUT's fusion vs. REU's separation. 
  - Explicitly state r's domain (decumulative probabilities) and why ranks matter. 
  - Link rank-dependence to Buchak's Coherence axiom as normative. 
  - Contrast Buchak's normative goals with Quiggin/Tversky-Kahneman's descriptive ones. 
  - Take a clear stance on independence (e.g., "While Buchak argues it's a welcome correction... I find it problematic because..."). 

