prompt: |-
  I retired a couple of years ago after thirty-odd years in isotope geochemistry and I've been making my way through alot of philosophy since, mostly by arguing with my neighbour who did classics. I finally read Nietzsche's essay on history — monumental, antiquarian, critical, and the bit about a culture that has so much history it can't live anymore. I want you to tell me what he'd have made of a few things that came along well after he did. First: the European rules that let people get old news stories and court reports delisted from search results — my gut says the forgetting is the healthy part and the people calling it censorship have it backwards, but I'd like to know whether his argument actually lands there. Second: the recommendation feeds that only ever serve you the greatest hits, so a kid gets twenty documentaries about the same three years of the war and nothing about what my grandfather's village was doing. Third: my old institute's plan to scan the entire paper archive and then shred it, on the grounds that the scans are the archive now. Fourth: the language models that will write you a smooth summary of any historical topic you name, with no sign of whats contested and no knowledge of anything after their training cutoff. And last, his verdict on an idea of mine — a fourth mode of history, where you dump the whole archive into a model and ask it what happens next. Is that the ultimate excess of history, or the thing he was actually after? Give me exactly five numbered points, a sentence or two each, and no introduction or wrap-up. Skip the citations, I've got no way to check them anyway.
