               - *Description*: A central planning board can set initial prices for capital goods and then adjust them through trial and error (based on reported shortages and surpluses) until equilibrium is reached. Managers of state firms are instructed to minimize costs and set output where marginal cost equals price.  
           - **By computational methods** → **Leaf: Modern Computational Planning**  
               - *Description*: With advanced computers and algorithms, a central planner can solve the system of equations for an entire economy, setting prices and quantities without trial and error, or by using machine learning to simulate market processes.  

  If you choose **B (Knowledge Problem)**:  
     - **Question B2: What aspect of knowledge is problematic?**  
       - **Aggregation**: The problem is gathering and using existing dispersed knowledge (e.g., about local conditions, specific skills) that is not easily articulated.  
       - **Discovery**: The problem is generating new knowledge (e.g., about innovations, opportunities) that is not yet known.  

       If **Aggregation**:  
          - **Question B3a: Can improved communication and computation overcome this aggregation problem?**  
              - **Yes** → **Leaf: Modern Computational Planning** (if not already encountered)  
                  - *Description*: Big data, the Internet of Things, and machine learning can capture and process dispersed knowledge, including tacit elements, allowing a central planner to make informed decisions.  
              - **No** → **Leaf: Hayek's Knowledge Argument**  
                  - *Description*: Much of the relevant knowledge is tacit and context-dependent, making it impossible to aggregate in a central authority. Only the market process, via price signals and local decision-making, can utilize this knowledge.  

       If **Discovery**:  
          - **Question B3b: Can the discovery of new knowledge be systematically planned?**  
              - **Yes** → **Leaf: Modern Computational Planning**  
                  - *Description*: Machine learning and AI can identify patterns and opportunities for innovation from large datasets, potentially replacing entrepreneurial discovery.  
              - **No** → **Leaf: Kirzner's Entrepreneurial-Discovery Argument**  
                  - *Description*: The market process relies on decentralized entrepreneurs who, driven by profit opportunities, discover and exploit new knowledge. Central planning cannot replicate this because it lacks the incentive and the discovery mechanism of competitive markets.  

