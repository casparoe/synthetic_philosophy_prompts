     - **Question C2: Can incentives be designed to mimic market efficiency without private ownership?**  
       - **Yes** → **Leaf: Incentive-Compatible Planning** (this might be part of Lange-Lerner or modern proposals, but not a named classic position)  
           - *Description*: By rewarding managers based on performance metrics (e.g., cost minimization, output targets), planning can achieve efficiency. However, this is often seen as vulnerable to gaming and lacks the innovation drive of ownership.  
       - **No** → **Leaf: Incentive-Based Critique of Planning**  
           - *Description*: Without private property and the right to profits, individuals lack the motivation to take risks, innovate, or work efficiently. This position is associated with property rights defenders but not a specific named thesis in the classic debate.  

