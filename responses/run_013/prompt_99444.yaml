  - **Kirzner vs. Hayek**: The tree separates them by the type of knowledge (aggregation vs. discovery), but note that both are part of the Austrian tradition and their arguments overlap.  
  - **Unoccupied Node**: The combination "Incentive Problem with a solution by computation" is not explicitly addressed by the modern computational position, which focuses more on knowledge and calculation. This node might be less coherent because computation does not directly solve incentive issues.  
