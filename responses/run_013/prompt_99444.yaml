  **Start**: A planned economy must allocate capital goods without market prices for the means of production.  
  **Question 1**: What is the *primary obstacle* to rational allocation?  
  - **Epistemic obstacle**: The problem is fundamentally about *knowledge*—gathering, transmitting, or processing information needed for allocation.  
  - **Motivational obstacle**: The problem is fundamentally about *incentives*—aligning individual behavior with social goals.  
  - **No coherent obstacle**: The "problem" misdiagnoses the debate; the core disagreement is not about obstacles but about divergent questions or values.  

  ---

  #### **Branch 1: Epistemic Obstacle** (from Q1)  
  **Question 2**: What is the *nature of the epistemic failure*?  
  - **Calculation failure**: Without market prices, there is no common unit of account to compare costs/benefits of alternative capital uses (static efficiency).  
  - **Discovery failure**: Without markets, there is no process to generate new knowledge about ends/means, innovations, or future opportunities (dynamic efficiency).  

  **Branch 1.1: Calculation Failure** (from Q2)  
  **Question 3**: Is this failure *insurmountable in principle*?  
  - **Yes** → **Leaf: Misesian Impossibility Thesis**  
    - *Description*: Rational calculation is logically impossible without market prices for capital goods. No unit of account exists to compare heterogeneous resources, making efficient allocation unattainable even with perfect data.  
  - **No** → **Question 4**: Can the failure be overcome by *non-market mechanisms* in practice?  
    - **Yes, via iterative adjustment** → **Leaf: Lange-Lerner Trial-and-Error Socialism**  
      - *Description*: A central planning board can simulate markets by setting initial prices for capital goods and iteratively adjusting them based on shortages/surpluses reported by firms. Efficiency emerges from trial-and-error.  
    - **Yes, via computation/ML** → **Leaf: Modern Computational Planning**  
      - *Description*: With unlimited computation and machine learning, a planner can solve allocation problems by processing real-time data, bypassing the need for market prices. Prices are derived algorithmically.  
    - **No, markets are irreducible** → *This path loops back to Mises* (no distinct leaf; the tree cannot separate this from Mises' principle-based claim).  

  **Branch 1.2: Discovery Failure** (from Q2)  
  **Question 5**: Is the discovery process *replicable under planning*?  
  - **No, discovery requires markets** → **Leaf: Kirzner's Entrepreneurial-Discovery Argument**  
    - *Description*: Markets enable entrepreneurial alertness to profit opportunities, discovering new ends/means. Planning cannot replicate this because it lacks the competitive feedback loop for experimentation.  
  - **Yes, with adaptive institutions** → **Question 6**: What is the *relevant comparison*?  
    - **Idealized markets vs. idealized planning** → **Leaf: Lange's Competitive-Solution Variant**  
      - *Description*: Planning can mimic market discovery by decentralizing decisions to public managers who follow marginal-cost rules and innovate within competitive frameworks.  
    - **Actual markets vs. actual planning** → **Leaf: Hayek's Knowledge Argument**  
      - *Description*: Actual markets outperform actual planning because prices transmit dispersed, tacit knowledge (e.g., local conditions) that cannot be centralized. Planning fails at discovery due to information loss.  
  - **Yes, with computation/ML** → **Leaf: Modern Computational Planning**  
    - *Description*: Machine learning can discover patterns and innovations from big data, replacing entrepreneurial alertness. Dynamic efficiency is achievable through predictive algorithms.  

  ---

  #### **Branch 2: Motivational Obstacle** (from Q1)  
  **Question 7**: Is the motivational failure *primarily about*?  
  - **Static inefficiency**: Misallocation due to lazy/corrupt managers or workers (e.g., overusing resources).  
  - **Dynamic inefficiency**: Stifled innovation due to lack of rewards for risk-taking.  

  **Branch 2.1: Static Inefficiency** (from Q7)  
  **Question 8**: Can incentives be *designed* to ensure efficiency?  
  - **Yes** → **Leaf: Lange-Lerner Trial-and-Error Socialism** (if paired with managerial rules)  
    - *Description*: By tying manager rewards to output/cost targets, planning can align incentives with static efficiency.  
  - **No** → *Unoccupied node*.  
    - *Note*: This combination (static inefficiency insoluble by design) is unexplored in the classic debate. Critics assume markets inherently solve incentives, but no named position starts here.  

  **Branch 2.2: Dynamic Inefficiency** (from Q7)  
  **Question 9**: Is the issue *solvable without markets*?  
  - **No** → **Leaf: Kirzner's Entrepreneurial-Discovery Argument** (via incentive angle)  
    - *Description*: Innovation requires profit-driven entrepreneurs; planning lacks this incentive structure.  
  - **Yes** → *Unoccupied node*.  
    - *Note*: This node (dynamic incentives solvable without markets) is incoherent to Austrians but unexplored by socialists. Modern innovation-policy positions might fit here, but none are named in the debate.  

  ---

  #### **Branch 3: No Coherent Obstacle** (from Q1)  
  **Leaf: Deflationary Position**  
  - *Description*: The "debate" is a category error. Pro-market sides (Mises/Hayek) address *efficiency under scarcity*, while pro-planning sides (Lange) address *equitable administration*. They disagree because they answer different questions.  

  ---

  ### **Notes on Unseparated Positions, Unoccupied Nodes, and Modern Computation**
  1. **Unseparated Positions**:  
     - **Hayek vs. Kirzner**: The tree partially separates these (Hayek under *actual comparison* and *knowledge aggregation*, Kirzner under *discovery failure*), but they overlap on tacit knowledge. Kirzner's entrepreneurial role blends epistemic and motivational elements, so the tree cannot isolate it fully.  
     - **Lange-Lerner vs. Lange's Competitive Solution**: The tree groups these under iterative adjustment (Lange-Lerner) and idealized discovery (Lange's variant), but in practice, they share key features.  

  2. **Unoccupied Nodes**:  
     - **Static inefficiency insoluble by design** (Branch 2.1): Unexplored. Assumed implausible without markets.  
     - **Dynamic incentives solvable without markets** (Branch 2.2): Incoherent to Austrians; unattractive to socialists who focus on epistemology.  
     - **Discovery failure solvable by non-computational planning** (Branch 1.2): Unexplored. All planning responses default to markets or computation.  

  3. **Modern Computational Planning**:  
     - Collapses the tree at **computation/ML nodes** (under both calculation and discovery failures). It claims to dissolve epistemic obstacles by relocating knowledge aggregation/discovery to algorithms.  
     - **Relocation, not dissolution**: The tree shows computation *shifts* the problem:  
       - For **calculation**, it assumes input data can be objective/comprehensive (Hayekians disagree: tacit knowledge remains uncaptured).  
       - For **discovery**, it assumes ML can replicate entrepreneurial intuition (Kirznerians disagree: algorithms lack "alertness" to unseen opportunities).  
     - Thus, computation is a *technical fix* that sidesteps motivational issues but inherits epistemic debates about data quality and innovation.  

  ---

  ### **Which Node Does the Most Sorting Work?**
  **Question 1 (Epistemic vs. Motivational vs. Deflationary)** does the heaviest lifting:  
  - It forces a split between knowledge-based critiques (Mises/Hayek/Kirzner), incentive-based critiques (often implicit in Austrians), and meta-positions (deflationary).  
  - This node clarifies whether disagreements are about *feasibility* (epistemic), *implementation* (motivational), or *framing* (deflationary).  
  - In your reading group, if disputes persist, this question likely reveals if participants are arguing about "can it work?" (epistemic) vs. "will actors try?" (motivational).  

  This tree isolates distinctions that are frequently blurred (e.g., Hayek's dynamic knowledge vs. Mises' static calculation) and accommodates modern positions without privileging them. Use it to map disagreements to the literature's logical structure.
