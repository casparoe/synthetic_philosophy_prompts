  **Decision Tree for the Socialist Calculation Debate**

  Start at the root with the commitment: A planned economy must allocate capital goods without market prices for the means of production.

  **Question 1: What is the primary reason to expect failure in such an economy?**  
     - **A. Calculation Problem**: Without market prices, there is no common unit of account to compare the efficiency of alternative uses of capital goods.  
     - **B. Knowledge Problem**: The necessary information for efficient allocation is dispersed, tacit, and cannot be aggregated by a central authority.  
     - **C. Incentive Problem**: Without private property, individuals lack the motivation to use resources efficiently or to innovate.  
     - **D. Different Questions**: The debate is confused; the two sides are addressing fundamentally different concerns (e.g., one about economic efficiency, the other about political freedom or something else).  

