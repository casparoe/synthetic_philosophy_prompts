  **Modern Computational Planning and the Knowledge Problem**:  
  The tree shows that the modern computational position claims to answer both the calculation problem (via solving equations) and the knowledge problem (via big data and machine learning). However, it might only relocate the problem:  
  - For knowledge aggregation, it assumes that tacit knowledge can be made explicit through data. Critics (e.g., Hayekians) argue that this is impossible because context and interpretation are lost.  
