answer: |-
  Here’s a polished research proposal tailored to your specifications, balancing precision with feasibility for a 6,000-word term paper:

  ---

  **Research Proposal: Metaphysical Foundations of the White Horse Paradox**  
  **Supervisor Submission**  

  ### 1. Research Question  
  *Does Gōngsūn Lóng’s argument that "a white horse is not a horse" (白馬非馬) in the *White Horse Dialogue* primarily concern the* identity conditions of kinds *rather than the semantics of terms or predication?*  

  ### 2. Critical Gap in Existing Readings  
  Current interpretations fall into two semantic camps:  
  - **Extension Theory**: "Horse" refers to all horses, "white horse" to a subset; non-identity follows from set exclusion.  
  - **Predication Theory**: Classical Chinese grammar treats "white horse" not as a compound kind-term but as a subject ("horse") modified by a distinct predicate ("white"), making "white horse" categorically dissimilar to "horse."  

  **The Gap**: Both approaches reduce the paradox to linguistic conventions or reference, neglecting its *metaphysical underpinnings*. Neither explains *why* Gōngsūn Lóng treats "horse" and "white horse" as fundamentally distinct ontological categories, nor why the dialogue emphasizes scenarios involving property change (e.g., a horse losing whiteness). This suggests an unexamined question: **Is the argument grounded in a theory of how kinds persist through time and alteration?**  

  ### 3. Proposed Approach: Testing the Kind-Identity Reading  
  I will evaluate whether the dialogue’s internal logic and textual clues better support a metaphysical interpretation, where:  
  - **"Horse"** denotes a *substance-kind* whose instances persist through accidental change (e.g., color).  
  - **"White horse"** denotes a *property-dependent kind* whose instances cannot survive loss of the defining property (whiteness).  
  - Thus, they are non-identical because their *criteria of persistence* differ.  

  **Method**: Three lines of evidence will be prioritized to *contrast* with semantic readings:  
  - **Argument Structure**: Analyze how the dialogue’s key moves (e.g., "one cannot use ‘white horse’ to seek a horse") rely on modal claims about *what a thing can lose while remaining itself*. Semantic readings struggle to explain this focus.  
  - **Responses to Objections**: Scrutinize Gōngsūn Lóng’s rebuttals (e.g., the yellow/black horse counterexample). The kind-identity reading predicts emphasis on scenarios where properties are gained/lost; semantic readings focus on classification.  
  - **Broader Context**: Compare the dialogue’s reasoning to other School of Names fragments (e.g., on "hardness/whiteness") that explicitly problematize property-bearer relations. Semantic readings treat these as isolated; a metaphysical reading reveals thematic coherence.  

  **Why this is more than redescriptive?**  
  A successful kind-identity analysis must:  
  - Explain textual elements semantic readings treat as puzzling (e.g., why property *change* is central).  
  - Show that Gōngsūn Lóng’s conclusions *require* ontological distinctions, not just linguistic ones.  
  - Demonstrate that rival readings *cannot* fully account for the argument’s dialectical force or philosophical targets (e.g., critiques of "common names").  

  ### 4. Expected Outcomes and Risks  
  - **Success**: A coherent account showing the paradox:  
    - Targets *naive realism about kinds* (e.g., that "horse" and "white horse" are ontologically continuous).  
    - Anticipates debates about essence/accident or sortal persistence.  
    - Explains the dialogue’s historical reception as unintuitive yet logically rigorous.  
  - **Failure Conditions**:  
    - If key premises (e.g., "a horse can cease to be white") are merely rhetorical and not metaphysical anchors.  
    - If the argument reduces to syntax/grammar *without* ontological commitments.  
    - If later Mohist/Confucian critiques exclusively treat it as semantic.  
  - **Inconclusive Result**: Ambiguity in whether metaphysical claims are explicit or implied.  

  ### 5. Scope Assessment  
  **Feasible for a term paper**, provided:  
  - Focus remains on the *White Horse Dialogue* and 2–3 key secondary sources (e.g., Fraser’s semantic view vs. Graham’s logical view).  
  - Broader School of Names context is limited to *directly comparative fragments* (e.g., "When a white horse is horse..." from *Gōngsūn Lóngzi*).  
  - *No comprehensive engagement* with Western metaphysics (e.g., Aristotle’s substance) beyond targeted analogies.  
  **This is not a dissertation chapter**—it tests one interpretive hypothesis against rivals within a confined textual corpus. A dissertation would require deeper philological analysis, reception history, and cross-traditional comparison.  

  ---

  **Deliverable**: A 6,000-word paper defending the kind-identity reading as philosophically richer and textually superior to semantic alternatives, concluding that the paradox challenges intuitive assumptions about the *ontology of change*—not just language.  

  Let me know if you'd like adjustments to emphasize specific aspects of the argument or feasibility concerns!
