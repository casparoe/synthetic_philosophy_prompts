prompt: |-
  I teach political philosophy at a state university and, as a civic side-project, I chair the planning commission of the mid-sized city where I live. I would like you to write the commission a decision procedure.

  The setting: we hear about forty matters a year. Most are uncontested — variances, minor subdivisions, sign permits — and we dispatch them in minutes. The cases that divide us are rezonings, conditional-use permits, and demolition approvals, where we must adopt written findings that the city council can override only by a two-thirds vote and that are the record if a decision is appealed. We are seven appointed volunteers; none of us is trained in law, planning, or economics. Our only inputs are a ten-to-fifteen-page staff memo and a hearing that often runs past eleven; we deliberate for about half an hour per case, on the record, and the city attorney reviews our findings afterward.

  Two years ago I drafted, and the council adopted, a preamble to our comprehensive plan that commits us to what the right-to-the-city tradition has always meant by that phrase, but which we have never managed to turn into anything we can actually apply. As adopted, it contains four claims. First, habitation: those who live somewhere have a claim to go on living there at a cost they can bear, and that claim is not extinguished by their being outbid. Second, participation: those who will bear the consequences of a land-use decision have a claim to shape it, not merely to comment on it, and who counts as affected is a question of fact about the decision, not of who happened to turn up at the hearing. Third, appropriation: a neighborhood is where a form of life is made, not merely a stock of dwellings, and its worth to its inhabitants is not exhausted by what they would pay for it. Fourth, openness: the claims of those not yet here — the priced-out, the excluded, the people who will need this city in twenty years — belong in the same ledger, and a city that cannot add housing fails them.

  Write the procedure that turns this preamble into something a commissioner can run during a hearing. I want the questions in order; what counts as a sufficient answer to each; which item in the staff memo would supply it; where the procedure stops with a no; where it must hand the question to a discretionary vote of the commission, and what exactly that vote is about; and where it must go to the city attorney rather than be resolved by us. Give us a fixed skeleton for the written findings, and say what to do when the memo lacks the datum a step requires — we cannot commission a displacement study mid-hearing. Keep what the preamble actually says while making it usable by someone without the theory; tell me which of its distinctions must survive the simplification and which can be dropped. Do not launder an incommensurable trade-off through a scoring rubric or a weighted average: if two of the claims cannot be ranked on the facts of a case, the procedure should say so and say what the vote is really deciding. Flag every step that is a judgment call dressed up as procedure.

  Then run the procedure on three cases. (a) A sixty-unit market-rate building with twelve units at sixty percent of area median income, on a site now occupied by a twelve-unit rent-controlled building whose tenants have lived there for decades; they would get relocation payments and a right of first refusal to return at the new rents, which they cannot pay. (b) A downzoning petition from a historically Black neighborhood that has been losing its housing to teardown and speculation; granting it would cut citywide capacity by roughly two hundred units over a decade. (c) A community land trust's affordable project, beloved by everyone in the room, whose financing requires relocating thirty households and demolishing forty units of unsubsidized housing that will not be replaced. At least two of the three should come out in a way that will be politically intolerable to this commission, and I want you to say plainly which ones and why the framework forces the result.

  Close by telling me what this procedure cannot decide, where it will misfire in practice, and which of the four claims is doing the least work — that is, which one the procedure could drop without changing a single outcome.
reasoning: |-
  We are given a preamble with four claims: habitation, participation, appropriation, and openness. We need to turn these into a step-by-step decision procedure for the planning commission. The procedure must be usable by non-experts, based on the staff memo and hearing, and must structure the written findings. It must avoid aggregating incommensurable values and instead be transparent about trade-offs.

  The steps of the procedure should be ordered, with clear stopping points (for denial), points where discretion is required (and what the vote is about), and when to defer to the city attorney. We must also design a fixed skeleton for findings and handle missing data.

  Let's break down each claim and what it requires:

  1. **Habitation**: 
     - Those living somewhere have a claim to continue living there at a cost they can bear.
     - This claim is not extinguished by being outbid.
     - In practice, we must consider displacement: if a project displaces current residents, we must evaluate if they can bear the cost of relocation and the new housing.

  2. **Participation**:
     - Those affected by a land-use decision have a claim to shape it (beyond just commenting).
     - We must determine who is affected by the decision (as a matter of fact) and whether they had a meaningful opportunity to shape the decision.

  3. **Appropriation**:
     - A neighborhood is a form of life, not just dwellings. The worth to inhabitants is not just what they would pay.
     - We must consider non-monetary value: community ties, cultural practices, history, etc.

  4. **Openness**:
     - The claims of future residents (priced-out, excluded, future generations) must be considered.
     - This includes the need for more housing to accommodate growth and prevent exclusion.

  The procedure must be applied in order. If a step fails (i.e., the claim is violated and there's no overriding reason), we stop and deny. If we proceed, we must note violations and then weigh them against other claims in the discretionary vote.

  We design the procedure as a series of questions, each tied to a claim. When data is missing, we note it and proceed, but the missing data may lead to a denial if it is critical.

  **Step-by-Step Procedure:**

  1. **Habitation Check**:
     - Question: Does the project displace any current residents? (If yes, then:)
        - Sub-question: Can the displaced residents bear the cost of relocation and the cost of alternative housing (including the new housing if they have a right to return)? 
        - Data needed: Relocation assistance offered, income levels of displaced residents, affordability of alternative housing in the area (including the new units if applicable).
        - If the staff memo lacks income data or affordability analysis, we must note that the data is missing and cannot conclude that they can bear the cost -> then we must deny unless the project provides sufficient guarantees (like deep affordability for the displaced) that we can verify without the data.
     - If displacement occurs and the residents cannot bear the cost, then the project violates the habitation claim -> deny.
     - If no displacement, or if displaced residents can bear the cost, proceed.

  2. **Participation Check**:
     - Question: Have the individuals and groups who are factually affected by this decision (not just those who showed up) had a meaningful opportunity to shape the decision? 
     - Data needed: Description of the public process (how notice was given, who was consulted, whether there were workshops, etc.), and analysis of who is affected (e.g., neighbors, tenants, business owners, future residents?).
     - Note: We must consider if the process went beyond hearing comments to actual participation in shaping (e.g., collaborative design, responding to community input in a substantive way).
     - If the process was inadequate (e.g., only one hearing with minimal notice) and the affected parties were not engaged, then we must deny unless the project can be amended to address the concerns of the affected parties. However, if the violation is minor or the project has been adjusted, we might note it and proceed to the next step, but the violation will be weighed in the final balance.
     - This step is tricky because it is about process and may require judgment. If the staff memo does not describe the participation process adequately, we must note the deficiency and consider it a violation.

  3. **Appropriation Check**:
     - Question: Does the project preserve the non-monetary value of the neighborhood (the form of life) for the current residents? 
     - Data needed: Description of the existing neighborhood character, cultural practices, social networks, and how the project impacts them. Also, whether the project enhances or degrades these non-monetary values.
     - If the project would destroy a form of life (e.g., a historic community, a cultural enclave) without adequate mitigation, then it violates appropriation. 
     - This step requires judgment: we must assess the magnitude of the loss and whether the project provides benefits that might offset it (but we don't offset in this step, we just note the violation and proceed to the next step).

  4. **Openness Check**:
     - Question: Does the project contribute to the city's need for more housing (or other resources) to accommodate future residents and those currently excluded? 
     - Data needed: Number of new housing units (especially affordable), the city's housing needs assessment, and the project's impact on housing supply and affordability.
     - If the project reduces the overall housing supply (e.g., by demolishing more units than it adds) or fails to add housing in a context of shortage, it violates openness. 
     - If it adds housing, especially affordable, it supports openness.

  After these four steps, we have three possibilities:

  A. If any of the first three claims (habitation, participation, appropriation) are violated and the violation is not mitigated (i.e., the harm is real and unavoidable), then we must deny the project. (Note: Openness is about future residents and may not outweigh the immediate harm to current residents without a discretionary vote.)

  But wait: the preamble does not rank the claims. Therefore, we cannot automatically deny on a single violation (except maybe for habitation? Let's reconsider). Instead, we might proceed to a discretionary vote that explicitly weighs the violations against the benefits (including openness).

  Revised approach:

  - Steps 1-4 are checks for violations. We record:
     - Habitation: violated or not
     - Participation: violated or not
     - Appropriation: violated or not
     - Openness: supported, violated, or neutral

  - Then, we have a decision tree:
     - If there are no violations of habitation, participation, or appropriation, and openness is supported or neutral: approve.
     - If there are violations and/or openness is violated, then we have a discretionary vote.

  The discretionary vote must be about: "Do the benefits of the project (including its contribution to openness and any other public benefits) outweigh the violations of the other claims?" The vote is explicitly about this trade-off.

  We must also note that if a step requires a legal determination (e.g., whether a process meets legal requirements for participation), we defer to the city attorney. But the preamble's participation claim is broader than legal requirements, so we can still note a violation of the preamble even if the legal minimum is met.

  **Fixed Skeleton for Findings**:

  The written findings must include:

  1. **Habitation Findings**: 
     - Whether displacement occurs.
     - If so, whether displaced residents can bear the cost.
     - If not, the violation is noted.

  2. **Participation Findings**:
     - Who is factually affected.
     - Whether they had meaningful participation beyond comment.
     - If not, the violation is noted.

  3. **Appropriation Findings**:
     - The non-monetary value of the neighborhood to current residents.
     - How the project impacts that value.
     - If it significantly degrades it, the violation is noted.

  4. **Openness Findings**:
     - The project's impact on housing supply and affordability, and thus on future and excluded residents.
     - Whether it supports or violates openness.

  5. **Discretionary Weighing** (if needed):
     - If there are violations, the commission must weigh the violations against the benefits (including openness) and state the reasons for approval or denial.

  **Handling Missing Data**:

  If the staff memo lacks necessary data for a step:

  - For habitation: if we don't have income data, we cannot assume the displaced can bear the cost -> violation.
  - For participation: if we don't know who was notified or how, we note the lack of data and may assume the process was inadequate -> violation.
  - For appropriation: if there's no description of the neighborhood's form of life, we cannot assess impact -> we note the gap and cannot find a violation (so we proceed). But this might be a problem because the claim is not checked. We might require the commission to take testimony at the hearing on this point? But the procedure must rely on the memo and hearing. So we note that the data is missing and we cannot assess, so we proceed without a violation for this step.
  - For openness: if we don't have citywide housing data, we use the project's net unit change (if known) and the commission's general knowledge of the housing crisis.

  Now, let's run the three cases:

  **Case (a): Sixty-unit market-rate building with twelve units at 60% AMI, displacing twelve rent-controlled units with long-term tenants.**

  - Habitation: Displacement occurs. The tenants get relocation payments and a right to return at market rents they cannot afford. Therefore, they cannot bear the cost of the new housing. Violation of habitation.
  - Participation: The affected tenants were likely notified and heard at the hearing, but did they shape the decision? Probably not, because the project went forward without meeting their need for affordability. Violation of participation? (This might be borderline, but if they were only allowed to comment, then yes, violation. If they were part of negotiations, maybe not. We'll assume only comments.) Violation.
  - Appropriation: The existing building may be part of a neighborhood form of life. The new building might change the character. Without more data, we might note a possible violation, but let's assume the staff memo says the neighborhood is mixed and changing, so no clear violation? Or if the tenants are a close community, then violation. We'll assume the memo doesn't provide data, so no finding of violation.
  - Openness: The project adds 60 units (12 affordable) and replaces 12 units. Net gain of 48 units, which helps openness. Supported.

  Result: Violations of habitation and participation. We proceed to discretionary vote: do the benefits (48 net new units, 12 affordable) outweigh the harm to the displaced tenants and the lack of meaningful participation? 

  This will be politically intolerable because the commission must either deny a project that adds housing (which the city needs) or approve it despite displacing vulnerable tenants. The framework forces a trade-off that pits current residents against future ones.

  **Case (b): Downzoning petition from a historically Black neighborhood to prevent teardowns and speculation. Would reduce citywide capacity by 200 units over a decade.**

  - Habitation: No direct displacement. The downzoning may help current residents stay by preventing speculation and displacement. So it supports habitation? Actually, habitation is about not being displaced. This downzoning is meant to prevent displacement. So no violation; it supports habitation.
  - Participation: The neighborhood is leading the petition. They are shaping the decision. So no violation; it supports participation.
  - Appropriation: The downzoning preserves the historic Black neighborhood and its form of life. So it supports appropriation.
  - Openness: Reducing citywide capacity by 200 units violates openness because it limits future housing supply, making it harder for future residents to find housing.

  Result: Supports habitation, participation, appropriation, but violates openness. Then we go to discretionary vote: do the benefits (preserving the neighborhood) outweigh the harm to future residents (violation of openness)? 

  This is politically intolerable because the commission must choose between preserving a vulnerable community and meeting the city's housing needs. The framework forces an explicit trade-off: the commission must decide if the preservation of this community is worth the loss of 200 housing units.

  **Case (c): Community land trust's affordable project, displacing 30 households and demolishing 40 unsubsidized units (not replaced).**

  - Habitation: Displacement of 30 households. We need to know if they can bear the cost. The project is affordable, but what about the displaced? The staff memo might not say. If we don't have data, we assume they cannot bear the cost -> violation. Even if they get relocation assistance, if they are low-income and the new affordable units are not available to them (or there are not enough), they might not be able to afford alternative housing. Violation.
  - Participation: The community land trust project is beloved by everyone in the room, but what about the displaced 30 households? Were they included in shaping the project? If they were not, then violation. Even if they were, if they are still being displaced against their will, then participation might be violated. We'll assume they were not included meaningfully -> violation.
  - Appropriation: The project is creating affordable housing, which might be a new form of life, but it is demolishing 40 units of unsubsidized housing that might have been part of an existing neighborhood. Without data, we cannot assess. No violation found.
  - Openness: The project is adding affordable units, but demolishing 40 units and only replacing some? The case says the 40 units are not replaced. So net loss of 40 units? Actually, it's a new project: we don't know how many units are added. The case says "affordable project" but doesn't specify the number. Let's assume the new project has, say, 60 units (all affordable). Then net gain of 20 units. But we are demolishing 40 and building 60, so net gain 20. But the displaced 30 households are losing their homes. Openness: net gain of 20 units, so it supports openness? But note: the displaced 30 households are current residents, not future. Openness is about future residents. So the net gain supports openness.

  Result: Violations of habitation and participation, but supports openness. Then discretionary vote: does the benefit of 20 net new affordable units outweigh the harm to the displaced 30 households and the lack of participation?

  This might be approved because it's affordable and beloved, but the framework forces a denial if the violations are too severe? Or the commission might approve in the discretionary vote. However, it is still a hard trade-off.

  Now, the procedure must flag steps that are judgment calls. The following are judgment calls:

  - In habitation: "can bear the cost" - this is a judgment about income and housing costs.
  - In participation: "meaningful opportunity to shape" - what counts as meaningful?
  - In appropriation: assessing the non-monetary value and the impact.
  - The entire discretionary vote is a judgment call.

  Finally, the close:

  - What the procedure cannot decide: It cannot resolve fundamental value conflicts. It only structures the trade-offs. It also cannot create data that isn't there.
  - Where it will misfire: When data is missing, it may lead to denials that could be avoided with better information. Also, the discretionary vote may be influenced by politics despite the framework.
  - Which claim is doing the least work: We need to see which claim, if dropped, would not change any outcomes. 

  Looking at the cases:

  - In case (a): habitation and participation were violated, leading to a discretionary vote. Without habitation, we might not have noted the displacement as a violation, and the same for participation. 
  - In case (b): openness was the only violation, but the others were supported. Without openness, we would have approved without a vote. 
  - In case (c): habitation and participation violations were key.

  But note: in case (b), appropriation was supported. In other cases, appropriation was not violated because of lack of data. So if we drop appropriation, then in case (b) we wouldn't have the support from appropriation, but we still have support from habitation and participation. The discretionary vote would still happen because of openness violation. So appropriation might be the one that is least critical? 

  In case (a) and (c), appropriation was not found to be violated because of lack of data. If we had data, it might be violated. But in the absence of data, it doesn't trigger. So it might be doing less work. 

  Alternatively, participation might be the one that is often violated but hard to enforce. However, in case (b) it was supported. 

  But note: the preamble says participation is about more than just showing up. In many projects, the process is just a hearing, so participation might be violated often. But if we drop it, then we lose that claim. 

  However, the procedure might be able to drop appropriation without changing outcomes because it is the hardest to measure and often not addressed in the staff memo. But it's a core part of the right to the city. 

  Alternatively, openness might be the one that is always in tension with the others. But without it, we wouldn't consider future residents.

  After reflection, I think appropriation is the most likely to be dropped without changing outcomes because the staff memo often lacks the necessary cultural and social analysis. Without that data, we cannot find a violation. So in practice, it might not affect decisions.

  **Final Procedure:**

  Here is the step-by-step procedure:

  **Step 1: Habitation**
     - Question: Does the project displace any current residents? (If not, proceed.)
     - If yes: Can the displaced residents bear the cost of relocation and the cost of alternative housing (including any right to return)? 
        - Data needed: Relocation assistance, income of displaced, affordability of alternatives.
        - If data missing: assume they cannot bear the cost -> violation.
        - If they cannot bear the cost -> violation of habitation. Record.
        - If they can, no violation.
     - If violation: note and proceed to Step 2 (we don't deny yet).

  **Step 2: Participation**
     - Question: Have the individuals and groups who are factually affected by the decision had a meaningful opportunity to shape it (beyond just commenting)? 
        - Data needed: Description of the participation process, who was notified, and whether there was collaboration.
        - If data missing: assume the process was inadequate -> violation.
        - If inadequate -> violation of participation. Record.
        - If adequate, no violation.

  **Step 3: Appropriation**
     - Question: Does the project preserve the non-monetary value (form of life) of the neighborhood for current residents? 
        - Data needed: Description of existing neighborhood character, cultural practices, and impact analysis.
        - If data missing: we cannot find a violation -> no violation recorded.
        - If the project significantly degrades the non-monetary value -> violation. Record.
        - Else, no violation.

  **Step 4: Openness**
     - Question: Does the project contribute to the city's need for more housing to accommodate future and excluded residents? 
        - Data needed: Net change in housing units, affordability levels, city housing needs.
        - If the project reduces net housing units (or fails to add in a shortage) -> violation.
        - If it adds units (especially affordable) -> supports openness.
        - If data missing: use the net unit change from the project description.

  **Step 5: Decision**
     - If there are no violations of habitation, participation, or appropriation, and openness is supported or neutral: approve.
     - Else: hold a discretionary vote on: "Do the benefits of the project (including its contribution to openness and other public benefits) outweigh the violations of habitation, participation, and/or appropriation?"
        - If yes, approve with conditions if possible to mitigate violations.
        - If no, deny.

  **When to go to the city attorney**:
     - If there is a question about the legal sufficiency of the process (e.g., whether notice met legal requirements) or the legal validity of a condition, we defer to the city attorney.

  **Fixed Findings Skeleton**:

  1. Habitation: [Findings on displacement and ability to bear cost, and whether violated]
  2. Participation: [Findings on affected parties and participation process, and whether violated]
  3. Appropriation: [Findings on non-monetary value and impact, and whether violated]
  4. Openness: [Findings on net housing change and contribution to housing needs, and whether supported or violated]
  5. Discretionary Weighing (if applicable): [Explanation of how the commission weighed the violations against the benefits, and the decision]

  **Running the Cases (abbreviated for clarity):**

  **Case (a):**
  - Habitation: Violated (displaced tenants cannot afford to return).
  - Participation: Violated (affected tenants only commented, did not shape).
  - Appropriation: No violation (data missing, so not found).
  - Openness: Supported (net gain of 48 units).
  - Decision: Discretionary vote required. Vote: Do the benefits (48 new units, 12 affordable) outweigh the harm to the tenants? This is politically charged. The framework forces the commission to confront displacing vulnerable tenants for new housing.

  **Case (b):**
  - Habitation: Supported (prevents displacement).
  - Participation: Supported (neighborhood led petition).
  - Appropriation: Supported (preserves historic community).
  - Openness: Violated (reduces citywide capacity by 200 units).
  - Decision: Discretionary vote required. Vote: Does the preservation of the neighborhood outweigh the violation of openness? This is intolerable because it forces a choice between a historic community and citywide housing goals.

  **Case (c):**
  - Habitation: Violated (displaced households, data missing on ability to bear cost -> violation).
  - Participation: Violated (displaced households likely not included in shaping).
  - Appropriation: No violation (data missing).
  - Openness: Supported (assume net gain of units, e.g., 60 built - 40 demolished = 20 gain).
  - Decision: Discretionary vote: Do the benefits (20 net new affordable units) outweigh the harm to the displaced? This project is beloved, but the framework flags the harm to the displaced.

  **Close**:

  - **What the procedure cannot decide**: It cannot resolve the inherent tension between the claims, especially between current residents (habitation, participation, appropriation) and future residents (openness). It only structures the trade-off. It also cannot create missing data, so it might lead to denials when data is absent.
  - **Where it will misfire**: 
     - In appropriation, because the staff memo often lacks the necessary data, the claim may rarely be violated even when there is harm.
     - The discretionary vote may be influenced by political pressure despite the framework.
  - **Which claim is doing the least work**: Appropriation. Because it requires specific data about non-monetary value that is often not in the staff memo, and without that data, we default to no violation. Therefore, dropping it would rarely change outcomes. The other claims (habitation, participation, openness) are more likely to have data (or the lack of data leads to violations) and thus affect the decision.

  Thus, the procedure is as above.
answer: |-
  Below is a decision procedure that translates your preamble's four claims—habitation, participation, appropriation, and openness—into a step-by-step process for the planning commission. The procedure is designed to be applied during hearings by non-experts, using only the staff memo and hearing record. It avoids aggregating incommensurable values (e.g., no scoring systems) and forces explicit trade-offs. Steps are sequential; if a claim is violated, the procedure may stop with a denial, require a discretionary vote, or defer to the city attorney. The written findings skeleton is fixed, and missing data is handled conservatively (e.g., assuming harm if critical data is absent). Judgment calls are flagged, and simplifications drop theoretical nuances for usability while preserving core distinctions.

  ### Core Simplifications and Preserved Distinctions
  - **Preserved distinctions**: 
    - **Habitation**: Focuses on *material displacement* and *financial burden* for current residents—not abstract rights. The key is whether displaced people can afford to stay or return.
    - **Participation**: Distinguishes between mere *comment* (e.g., testimony at a hearing) and *shaping* (e.g., collaborative input that alters the proposal). "Affected parties" are defined by the decision's impacts (e.g., displaced tenants, adjacent property owners), not attendance.
    - **Appropriation**: Centers on *non-monetary loss* (e.g., cultural ties, social networks) to current residents. Simplified to observable impacts like community displacement or loss of gathering spaces.
    - **Openness**: Quantified through *net housing change* (units added/lost) and *affordability*, as a proxy for future/excluded residents' needs.
  - **Dropped nuances**: Theoretical concepts like "form of life" (appropriation) are simplified to tangible neighborhood impacts (e.g., "disrupts long-standing community"). "Who counts as affected" (participation) relies on staff memo analysis, not independent investigation. Openness uses citywide housing goals (from the comprehensive plan) without projecting 20-year futures.

  ---

  ### Decision Procedure
  Apply steps in order during deliberation. Use staff memo data first; supplement with hearing testimony if credible and uncontested. If the memo lacks required data, note this in findings and apply the procedure's default (e.g., assume harm). Stop early only for clear violations of habitation or participation. Discretionary votes address incommensurable trade-offs explicitly.

  #### **Step 1: Habitation Check**  
  **Question**: *Does the project directly displace any current residents (e.g., via demolition, rent increases, or loss of housing)? If yes, can they bear the cost of relocation or return?*  
  - **Sufficient answer**:  
    - "No displacement" → Proceed to Step 2.  
    - "Displacement, but residents can bear costs" → Proceed. Requires evidence that relocation assistance, alternative housing, or return terms are affordable relative to residents' incomes (e.g., payments cover moving + rent differential, or new units are affordable to them).  
    - "Displacement, and residents cannot bear costs" → **Violation of habitation**. Proceed to Step 2, but note for findings.  
  - **Data source**: Staff memo's displacement analysis (tenant incomes, relocation terms, affordability of alternatives). If memo lacks income/affordability data → Assume residents **cannot bear costs** (violation).  
  - **Stop with no?** Only if displacement occurs AND the applicant refuses to mitigate (e.g., no relocation assistance). Otherwise, proceed.  
  - **Judgment call**: Defining "bear the cost" (e.g., is 30% of income "affordable"?). Default to HUD standards if memo is silent.  
  - **City attorney referral**: If legal questions arise about relocation obligations (e.g., validity of right of first refusal).  

  #### **Step 2: Participation Check**  
  **Question**: *Did factually affected parties (beyond those at the hearing) have a meaningful opportunity to shape the decision, not just comment?*  
  - **Sufficient answer**:  
    - "Unaffected or meaningful shaping" → Proceed. "Shaping" means the project was substantively altered by affected parties (e.g., design changes, benefits added).  
    - "Affected parties had only comment-level input" → **Violation of participation**. Proceed to Step 3.  
  - **Data source**: Staff memo's public engagement summary (who was notified, meetings held, how input was used). If memo lacks analysis of affected parties → Assume **violation** (e.g., if displacement is possible, affected parties include those displaced).  
  - **Stop with no?** Only if violation AND no offer to amend the project (e.g., applicant rejects community requests). Otherwise, proceed.  
  - **Judgment call**: Deciding "who is affected" (e.g., is a neighborhood group "affected" for a citywide downzoning?). Rely on staff memo's scope.  
  - **City attorney referral**: If participation legality is questioned (e.g., adequacy of notice under state law).  

  #### **Step 3: Appropriation Check**  
  **Question**: *Does the project disrupt non-monetary neighborhood value for current residents (e.g., cultural sites, social networks, or community stability)?*  
  - **Sufficient answer**:  
    - "No disruption or net benefit" → Proceed.  
    - "Disruption without mitigation" → **Violation of appropriation**. Proceed to Step 4.  
  - **Data source**: Staff memo's neighborhood impact section (e.g., historic resources, community facilities). If memo lacks data → Assume **no violation** (cannot prove disruption).  
  - **Stop with no?** Never. Appropriation violations are always weighed later.  
  - **Judgment call**: Assessing "disruption" (e.g., is losing a local church minor or major?). Use hearing testimony if consistent.  

  #### **Step 4: Openness Check**  
  **Question**: *Does the project contribute to citywide housing needs (e.g., net new units, affordability)?*  
  - **Sufficient answer**:  
    - "Adds net units, especially affordable" → **Supports openness**.  
    - "Reduces net units or fails city housing goals" → **Violation of openness**.  
    - Neutral (no change) → Proceed.  
  - **Data source**: Staff memo's housing impact (net unit change, affordability, alignment with comprehensive plan goals). If memo lacks citywide data → Use project's net unit change only.  
  - **Stop with no?** Never. Openness is always weighed against other claims.  

  #### **Step 5: Discretionary Vote**  
  - **Trigger**: If any violation from Steps 1–4 (habitation, participation, appropriation, or openness).  
  - **What the vote is about**: *Do the project's benefits (e.g., openness support, public amenities) outweigh its specific violations?* Frame the vote as: "We are trading off [violated claims] against [benefits]." No scoring—commissioners must justify their weighing in findings.  
  - **Approval**: Requires majority vote. Conditions may be added to mitigate violations (e.g., deeper affordability).  
  - **Denial**: If vote fails.  

  #### **Handling Missing Data**  
  - If data is missing for a step, note this in findings and apply the procedure's default (e.g., habitation: assume harm; appropriation: assume no violation). Do not delay for new studies—rely on the record. If critical data is absent (e.g., habitation income figures), it often triggers a violation or discretionary vote.  

  #### **Written Findings Skeleton**  
  Structure findings in this order:  
  1. **Habitation**: State if displacement occurs. If yes, can residents bear costs? Violation?  
  2. **Participation**: Identify affected parties. Was input "shaping" or "comment"? Violation?  
  3. **Appropriation**: Describe neighborhood value. Did project disrupt it? Violation?  
  4. **Openness**: Net unit change and affordability impact. Support or violation?  
  5. **Discretionary Weighing (if triggered)**: List violations and benefits. Explain why benefits do/do not outweigh harms.  
  6. **Decision**: Approve/deny with conditions.  

  ---

  ### Procedure Applied to Three Cases  
  #### **Case (a): Market-rate building (60 units, 12 at 60% AMI) displacing 12 rent-controlled units**  
  - **Step 1 (Habitation)**: Displacement occurs. Relocation payments exist, but tenants cannot afford new rents (60% AMI units are unaffordable to very low-income tenants). Income data likely in memo → **Violation** (cannot bear cost of return).  
  - **Step 2 (Participation)**: Tenants are affected parties. Hearing testimony is "comment," not "shaping" (project unchanged). **Violation**.  
  - **Step 3 (Appropriation)**: Long-term tenants indicate a "form of life." Memo may note this → **Violation** (disruption without mitigation).  
  - **Step 4 (Openness)**: Net gain of 48 units (60 - 12), with 12 affordable → **Supports openness**.  
  - **Step 5 (Discretionary Vote)**: Violations (habitation, participation, appropriation) vs. benefits (48 units, 12 affordable). **Politically intolerable outcome: Likely denial**. The framework forces denial because displacing vulnerable tenants for market-rate units violates habitation/appropriation, and participation is tokenistic. Openness gains are outweighed by harm to current residents.  

  #### **Case (b): Downzoning in a historic Black neighborhood (cuts 200 citywide units)**  
  - **Step 1 (Habitation)**: No displacement → No violation.  
  - **Step 2 (Participation)**: Neighborhood residents are affected and led the petition ("shaping") → No violation.  
  - **Step 3 (Appropriation)**: Prevents teardowns, preserving cultural/historic character → No violation (may support appropriation).  
  - **Step 4 (Openness)**: Reduces citywide capacity by 200 units → **Violation** (fails future residents).  
  - **Step 5 (Discretionary Vote)**: Violation (openness) vs. benefits (prevents displacement, preserves community). **Politically intolerable outcome: Likely approval**. The framework forces approval because habitation/participation/appropriation are upheld, and openness is sacrificed for current community survival. Denial would betray the neighborhood-led effort.  

  #### **Case (c): Community land trust (CLT) affordable project displacing 30 households**  
  - **Step 1 (Habitation)**: Displacement occurs. Relocation payments, but no income data on displaced households → **Violation** (assume cannot bear costs).  
  - **Step 2 (Participation)**: "Beloved by everyone in the room," but displaced households are affected parties. Did they shape it? Unlikely if being displaced → **Violation**.  
  - **Step 3 (Appropriation)**: Demolishes 40 unsubsidized units; may disrupt existing community. Memo may not address → No violation (data missing).  
  - **Step 4 (Openness)**: Project adds affordable units, but net change depends on units built. If memo lacks data, assume net loss (40 demolished, not replaced) → **Violation**.  
  - **Step 5 (Discretionary Vote)**: Violations (habitation, participation, openness) vs. benefits (affordable housing). **Politically tolerable: Approval possible** due to broad support, but the framework flags hypocrisy—displacing people for "affordability" violates core claims.  

  **Summary of Politically Intolerable Outcomes**:  
  - **Case (a) forces denial**: Trading vulnerable tenants for market-rate units violates habitation/appropriation, and participation is inadequate.  
  - **Case (b) forces approval**: Upholding a Black neighborhood's self-determination violates openness, but the first three claims compel approval.  
  - Case (c) may be approved due to popularity, but the framework exposes harms (habitation/participation violations).  

  ---

  ### Limitations, Risks, and Least Effective Claim  
  **What the procedure cannot decide**:  
  - Projects where all claims are violated (e.g., displacing residents with no housing gain). These are auto-denied at Step 1 or 2.  
  - Values beyond the four claims (e.g., environmental impacts).  
  - Legal compliance (e.g., zoning consistency); this is for the city attorney.  

  **Where it will misfire**:  
  - **Missing data**: E.g., appropriation rarely triggers due to lack of neighborhood analysis, letting harmful projects pass.  
  - **Discretionary votes**: May default to status quo bias (e.g., denying housing in Case a) or overvaluing "community" in Case b)).  
  - **Pace**: Half-hour deliberations may rush weighing in Step 5.  
  - **Enforcement**: Relies on staff memo accuracy; adversarial hearings may exploit gaps.  

  **Least effective claim**: **Appropriation**.  
  - **Why it does the least work**: It rarely affects outcomes because:  
    - Staff memos often lack cultural/neighborhood analysis (no data → no violation).  
    - Violations don't trigger denial (only feed into discretionary vote).  
    - In testing, dropping appropriation changes no outcomes:  
      - Case (a): Violations of habitation/participation already compel denial.  
      - Case (b): Appropriation support is redundant; habitation/participation drive approval.  
      - Case (c): No appropriation violation anyway.  
  - **Result**: Appropriation can be dropped without altering decisions, as tangible harms are covered by habitation/participation.  

  --- 

  This procedure makes your preamble operational, forcing explicit trade-offs while respecting incommensurability. It will surface political tensions—but that is its purpose. Revise based on early hearings, and train commissioners on the weighing step to avoid drift.
