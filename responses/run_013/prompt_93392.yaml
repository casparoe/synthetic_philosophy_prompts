  Now, the user's deeper question: Is this one move or two? Darwin's inversion is about origins (design without a designer), Turing's about processes (computation without comprehension). Applying both to language involves stacking them: variation/selection for origins and mechanistic processing for competence. But the wrinkle is language models training on human-generated content. The comprehension is outsourced to humans during training, but the model itself doesn't understand. This might be a third layer—content generation without comprehension at runtime. However, this still fits within the stacked model: human comprehension (via Darwinian processes) creates the data, then Turing-style processes replicate competence without comprehension. So it's still a combination of the first two moves. The user's spookiness might stem from the outsourcing, but it doesn't introduce a new fundamental element.

