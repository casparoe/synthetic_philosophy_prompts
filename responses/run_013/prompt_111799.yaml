prompt: |-
  I am a third-year philosophy student currently taking a seminar on metaethics and normativity, and I would like to rehearse a line of objection against indirect normativity. Please play a committed defender of an ideal-deliberation account: someone who holds that an act is right just in case it would be approved by an ideal deliberator who is fully informed, vividly aware of every relevant perspective, and free of cognitive and affective distortion. Make the defender rigorous, resourceful, and fair. They may refine distinctions, grant that some formulations are circular, and concede local points, but they must not abandon the core thesis or retreat into the claim that the ideal deliberator would simply approve of whatever we independently believe is right. Do not cite authors or texts; argue the position on its merits. Stay in character until I say stop, and keep each reply to a single paragraph. Here is my opening move. I want to press you with a case I have been calling the unconsulted sage. Suppose there is a person, S, who under full information and ideal deliberation would prefer that no one ever consult her about her own treatment. She would endorse a standing policy of others deciding for her, and she would not want her actual preferences solicited. The case stipulates that this is what ideal deliberation yields, so please do not simply answer that ideal deliberation would not produce it; if you think the case is incoherent, identify exactly which condition of ideal deliberation it violates and why. Now ask what your account says. If it says we should consult S, then the criterion looks like actual consultation rather than idealized approval. If it says we may ignore S, then idealized approval authorizes ignoring the very person whose idealized approval is supposed to ground the account's authority. Either way, the ideal deliberator seems either redundant or authoritarian. Which horn do you take, and what does the case reveal about the structure of indirect normativity?
reasoning: |-
  Okay, let me unpack this philosophy student's challenge. They're presenting a sophisticated thought experiment called the "unconsulted sage" designed to pressure ideal-deliberation accounts of normativity. The core tension is fascinating: if an ideally rational agent would prefer never to be consulted about their own treatment, does consulting them anyway violate the very standard they'd endorse?

  Hmm, the student has clearly anticipated defensive moves by preemptively ruling out dismissing the case as implausible. They want me to either bite the bullet on consultation being unnecessary (making idealization redundant) or admit it's required (making actual preferences irrelevant). Both seem damaging. 

  I notice the student is framing this as exposing a structural flaw in "indirect normativity" - that's the real target here. Their seminar must be covering constructivist approaches where normative truth depends on idealized agreement. The sage case seems engineered to show that such idealization either collapses into actual preferences or becomes authoritarian.

  Right, my defense strategy should: First, rigorously grant the hypothetical while distinguishing levels of endorsement - the sage's ideal preference is itself normative. Second, explain why honoring her meta-preference doesn't negate the account's authority but demonstrates its consistency. Third, show redundancy doesn't follow because her deliberative output includes dispositions about consultation. 

  The affective distortion clause might be relevant - if her aversion stems from trauma, that could disqualify it, but the student specified "free of distortion," so I can't rely on that. Must treat her preference as authentically ideal. 

  Interesting implications: This reveals how ideal-deliberation accounts handle second-order endorsements. The sage's case isn't a counterexample but a feature - her idealized will includes directives about how to treat her non-ideal self. That preserves authority while avoiding redundancy. The structural point is that indirect normativity operates at the level of principles, not acts. 

  I should concede that actual consultation becomes instrumental rather than fundamental, but argue that's precisely what makes it indirect. The authoritarian horn misses how the deliberator's approval conditions all actions, including when to override preferences. 

  This is good practice - the student has constructed a airtight version of the "wrong preferences" objection. My response must show how the theory coherently absorbs such cases without collapsing.
answer: |-
  I take the second horn without hesitation: we may—indeed, should—ignore S's *actual* preferences and refrain from consulting her, precisely *because* doing so aligns with her *idealized* endorsement of a policy of non-consultation. The case reveals not redundancy or authoritarianism, but the hierarchical structure of normative authority within ideal deliberation. The ideal deliberator’s approval grounds normativity by specifying the *conditions* under which preferences warrant respect—including the condition that certain preferences (like S’s actual, non-ideal ones) ought to be disregarded when they conflict with the meta-policy she would endorse under ideal conditions. S’s ideal self isn’t "ignored"; her ideal judgment *is* the authority, and it expressly delegates decisions about her treatment to others. The account remains indirect because the right-making property isn’t consultation itself, but conformity to the deliberator’s ideally endorsed principles—which here prescribe non-consultation. No circularity arises: the ideal stance coherently evaluates first-order actions (how to treat S) and second-order policies (whether to consult her) simultaneously, without privileging actual preferences.
