prompt: |-
  I sit on the model governance committee at a mid-sized hospital, and we are about to deploy a model that scores patients for a scarce transitional-care program. A near-miss last month—a patient who should have been flagged and was not—has made the fairness question personally urgent for me. The vendor says the model is calibrated; the equity office wants equal error rates; the clinicians want something they can explain at the bedside; and I have been told there are impossibility results showing that some of these demands cannot hold together. I do not need the theorems restated or a literature review. I need the specification itself: what any adequate fairness criterion for this deployment would have to deliver before I can decide which demands to make and which to drop.

  Write the desiderata any adequate fairness criterion for this deployment must meet. I mean the full list: the cases it must get right (a patient whose score falls just below the threshold; a group whose measured need is lower because of prior access barriers; an intersectional subgroup too small to estimate reliably; a patient who would benefit but cannot attend the program for non-medical reasons), the distinctions it must not collapse (group-level parity versus an individual’s claim to fair treatment; calibration versus error-rate parity; ex ante equality of opportunity versus ex post equality of outcomes; a criterion’s mathematical properties versus its institutional defensibility), and the results it must be consistent with (the impossibility results, the fact that our labels are proxies for need, the feedback loop in which today’s scores change tomorrow’s training data, and the fact that we do not record race and must rely on imperfect proxies). For each requirement, give me the case or consideration that motivates it. Then tell me which requirements are non-negotiable and which are preferences of a particular camp. Most important: flag any pair or subset that cannot be jointly satisfied, and say what that impossibility forces us to give up. Finally, tell me which single requirement does the most to exclude the usual candidates—demographic parity, equalized odds, predictive parity, calibration, individual fairness—and why. A table is fine if it helps, but the reasoning behind each requirement matters more than the formatting.
reasoning: |-
  We are designing fairness criteria for a transitional-care program scoring model. The goal is to ensure that the deployment is fair, effective, and institutionally defensible. We must consider various cases, distinctions, and constraints. 

  The desiderata for any adequate fairness criterion must cover:

  1. **Cases it must get right**:
     a. **Patient just below the threshold**: The criterion must account for individuals near the decision boundary because small changes in score can lead to very different outcomes. This is about the sensitivity of the decision threshold.
     b. **Group with lower measured need due to prior access barriers**: Historical inequities may have led to under-diagnosis or under-reporting of need in certain groups. The criterion must adjust for such systemic biases to avoid perpetuating disparities.
     c. **Small intersectional subgroup**: The criterion must not disadvantage groups that are too small for reliable statistical estimation (e.g., intersection of race, gender, and age). We need robustness to sparsity.
     d. **Patient who would benefit but cannot attend for non-medical reasons**: The criterion must acknowledge that even if the model correctly identifies need, external barriers (like transportation, work, or family responsibilities) may prevent program participation. Thus, the model should not only score based on medical need but also consider accessibility (if possible) or the program must be designed to remove such barriers.

  2. **Distinctions it must not collapse**:
     a. **Group-level parity versus individual's claim to fair treatment**: We must not assume that achieving group-level statistics (like equal error rates) guarantees fair treatment to every individual. There might be individuals within groups that are unfairly treated even if the group as a whole meets parity.
     b. **Calibration versus error-rate parity**: Calibration (that predicted risk equals actual risk) and error-rate parity (equal false positive/negative rates across groups) are distinct and often incompatible. We must not conflate them because they address different aspects of fairness.
     c. **Ex ante equality of opportunity versus ex post equality of outcomes**: We must recognize the difference between providing equal access (ex ante) and requiring that outcomes (like program success) are equal across groups (ex post). The former is about the process, the latter about results.
     d. **Mathematical properties versus institutional defensibility**: A criterion that is mathematically elegant might be hard to explain to clinicians or patients. We need criteria that are both theoretically sound and acceptable in a clinical setting (e.g., at the bedside).

  3. **Results it must be consistent with**:
     a. **Impossibility results**: We know that, in general, we cannot simultaneously satisfy calibration, equal false positive rates, and equal false negative rates across groups (unless the model is perfect or base rates are equal). This is the well-known fairness impossibility theorem (Kleinberg, Mullainathan, Raghavan; Chouldechova). 
     b. **Labels are proxies for need**: Our training labels (e.g., whether a patient was readmitted) are imperfect proxies for the true need (which is whether the patient would benefit from the program). This means we might be optimizing for the wrong thing and introducing bias.
     c. **Feedback loop**: The scores we assign today influence which patients get the program, which in turn affects the data we collect for future models. This can lead to a reinforcement of existing biases (e.g., if a group is under-served, we have less data on them).
     d. **We do not record race and must rely on imperfect proxies**: Since we don't have direct race information, we use proxies (like surname, address). These are error-prone and may misclassify individuals, leading to misestimation of group metrics.

  Now, let's outline the requirements for the fairness criterion:

  **REQUIREMENTS (Desiderata):**

  1. **Handling Boundary Cases (Non-negotiable)**:
     - The criterion must be sensitive to the fact that patients near the threshold are similarly situated and should be treated similarly (unless there is a justified reason). This is motivated by the case of the patient just below the threshold.

  2. **Adjusting for Historical Bias (Non-negotiable)**:
     - The criterion must account for the possibility that measured need in some groups (e.g., due to prior access barriers) is systematically underestimated. This is non-negotiable because without it, we perpetuate inequity.

  3. **Robustness to Intersectionality (Non-negotiable)**:
     - The criterion must not require statistical reliability for very small subgroups (which we cannot measure) but must still ensure that such groups are not systematically disadvantaged. We must have a way to protect these groups without requiring precise estimates (e.g., through constraints on larger groups that compose them, or by using individual-focused criteria).

  4. **Acknowledging External Barriers (Preference of equity office/clinicians)**:
     - The criterion should account for non-medical barriers that might prevent a patient from attending the program. However, this might be more about program design than the model itself. Therefore, it might be a preference (to build a model that also predicts the likelihood of attendance) but not non-negotiable for the scoring model if the program can mitigate these barriers.

  5. **Respecting Individual Fairness (Non-negotiable)**:
     - The criterion must not collapse group-level parity with individual fairness. We must have a way to ensure that two individuals with similar medical needs (and similar non-medical factors that are relevant) receive similar scores, regardless of group membership. This is non-negotiable because at the bedside, clinicians must justify decisions to individual patients.

  6. **Clarity on Calibration and Error Rates (Non-negotiable)**:
     - The criterion must clearly state which fairness properties (calibration, error-rate parity) are being prioritized and why. We cannot avoid the impossibility results, so we must choose which properties to forgo. This is non-negotiable because the impossibility theorem forces a trade-off.

  7. **Distinguishing Ex Ante and Ex Post (Preference of equity office)**:
     - The criterion should favor ex ante equality of opportunity (i.e., the model gives equal chance to those who would benefit) over ex post equality of outcomes. However, the equity office might push for outcomes. This might be a preference because outcomes are influenced by many factors beyond the model.

  8. **Institutional Defensibility (Non-negotiable)**:
     - The criterion must be explainable to clinicians and patients. It cannot be a black box. This is non-negotiable because without it, the model will not be trusted or used appropriately at the bedside.

  9. **Compatibility with Imperfect Proxies (Non-negotiable)**:
     - The criterion must be robust to the use of imperfect proxies for sensitive attributes (like race). This is non-negotiable because we have no direct measure.

  10. **Awareness of Feedback Loops (Non-negotiable)**:
      - The criterion must account for the feedback loop: the deployment should not make it harder to collect representative data in the future. This is non-negotiable because ignoring it could lead to model degradation and increased bias over time.

  11. **Acknowledging Label Imperfection (Non-negotiable)**:
      - The criterion must account for the fact that our labels are imperfect proxies for true need. We might adjust the model by incorporating uncertainty or by using techniques that account for measurement error.

  **Impossible Pairs/Subsets**:

  - The impossibility theorem shows that we cannot simultaneously have:
    (a) Calibration by group (i.e., for every group, the predicted risk equals the actual risk).
    (b) Equal false positive rates across groups.
    (c) Equal false negative rates across groups.

    Therefore, we must choose at most two of these. This forces us to give up one of these properties. Given our context:

    - Calibration is important because it ensures that the risk score is meaningful (e.g., a score of 0.7 means 70% chance of readmission, regardless of group). This is crucial for clinical interpretation and for the model to be trusted.
    - Equal false negative rates might be more critical than false positive rates in healthcare because missing a high-risk patient (false negative) could be more harmful than incorrectly flagging a low-risk one (false positive). However, the program is scarce, so we cannot afford too many false positives either.

    The trade-off: We might prioritize calibration and equal false negative rates (to ensure we don't miss high-risk patients in any group) and accept unequal false positive rates. Alternatively, if we believe that false positives are particularly harmful (e.g., because they divert resources from those who really need it), we might choose differently.

  **The Requirement that Excludes the Most Candidates**:

  The requirement that **"adjusting for historical bias" (requirement 2) and "robustness to intersectionality" (requirement 3) together with "institutional defensibility" (requirement 8)** does the most to exclude the usual fairness criteria. Why?

  - **Demographic parity**: Doesn't adjust for historical bias (it requires the same selection rate regardless of need, which may be higher in some groups due to past inequity). It also doesn't account for intersectionality (it typically looks at one group at a time) and may be hard to defend at the bedside (why give the program to a low-need patient just because they are in a group with historically low access?).

  - **Equalized odds (error-rate parity)**: This requires both equal false positive and false negative rates. But we know from the impossibility theorem that this is incompatible with calibration, and we may have to give up calibration. However, calibration is critical for clinical interpretability (institutional defensibility). Also, equalized odds doesn't adjust for historical bias in the labels (if the labels are biased, then equalized odds will perpetuate that bias). Moreover, it may be hard to achieve for intersectional groups (due to data sparsity).

  - **Predictive parity (calibration)**: This is important for clinical trust, but by itself doesn't address historical bias. For example, if the model is calibrated but the true need of a group is underestimated because of biased labels, then calibration won't help. Also, it doesn't ensure similar error rates across groups, which might be required for equal treatment.

  - **Individual fairness**: This requires that similar individuals get similar scores. It is appealing for bedside explanation. However, it is very hard to define a similarity metric that accounts for historical bias (e.g., two individuals might have the same symptoms but one comes from a group with less access, so the true need might be higher because of untreated conditions). Moreover, without race data, we might not be able to capture the factors that make individuals from different groups truly similar in need. Also, it doesn't by itself address group-level disparities.

  Therefore, the requirement that **adjusts for historical bias and is robust to intersectionality while being explainable** is the one that most of the standard criteria fail to meet. 

  **Conclusion on Trade-offs**:

  We must choose a criterion that:

  - Prioritizes calibration (for clinical trust) and equal false negative rates (to avoid missing high-risk patients in any group) but accepts unequal false positive rates.
  - Adjusts for historical bias by using techniques that account for label bias (e.g., using causal models, or by re-weighting or adjusting the labels if possible).
  - Uses individual fairness as a guiding principle to the extent possible (with a well-defined similarity metric that includes factors capturing social determinants of health) to protect small groups and individuals.
  - Is explainable: we might use a model that is inherently interpretable (like a linear model or decision tree) or we might use techniques like SHAP values to explain complex models.

  Given the constraints, we might design a criterion that:

  - Is calibrated (so that the scores are true probabilities).
  - Has approximately equal false negative rates across the groups we can measure (via proxies) and for the larger intersectional groups we can reliably estimate.
  - Includes a mechanism to adjust the scores for groups that have been historically underserved (by adding a risk adjustment factor based on social determinants of health, even if race is not recorded, we can use proxies for disadvantage).
  - Monitors the feedback loop by tracking the distribution of scores and program participation over time and adjusting the model accordingly.

  This approach will require giving up on equal false positive rates. We must also invest in collecting more data on small intersectional groups and in building a model that can handle uncertainty for these groups.

  Finally, note that no single criterion will satisfy all requirements. We must use a combination of criteria and continuously monitor and audit the model for fairness, especially for the small groups.
answer: |-
  Below is the specification of desiderata for an adequate fairness criterion in your transitional-care scoring model deployment. The requirements are categorized by the **cases they must address**, **distinctions they must preserve**, and **results they must align with**. Each requirement includes the motivating case or consideration, its non-negotiable status, and conflicts with other requirements. A summary table is provided for clarity, followed by detailed reasoning.

  ### **Summary Table of Desiderata**
  | **Requirement**                                      | **Motivating Case/Consideration**                                                                 | **Non-Negotiable?** | **Conflicts With**                                                                 |
  |------------------------------------------------------|---------------------------------------------------------------------------------------------------|---------------------|-----------------------------------------------------------------------------------|
  | **1. Sensitivity to Threshold Proximity**            | Patient just below cutoff needs consideration due to arbitrary thresholds.                        | Non-negotiable      | None (foundational)                                                              |
  | **2. Adjustment for Historical Bias**                | Group with lower measured need due to prior access barriers (e.g., underdiagnosis).               | Non-negotiable      | #7 (calibration vs. error rates), #11 (ex ante vs. ex post)                      |
  | **3. Robustness to Small Subgroups**                 | Intersectional subgroup (e.g., Black women over 80) too small for reliable estimation.            | Non-negotiable      | #5 (group vs. individual fairness), #13 (imperfect proxies)                      |
  | **4. Acknowledgement of Non-Medical Barriers**       | Patient who would benefit but can't attend due to non-medical reasons (e.g., transportation).     | Preference          | N/A (implementation constraint, not fairness)                                    |
  | **5. Group-Individual Distinction**                  | Collapsing group parity (e.g., error rates) vs. individual claim to fair treatment.               | Non-negotiable      | #3 (small subgroups), #10 (institutional defensibility)                          |
  | **6. Calibration-Error Rate Separation**             | Calibration (accuracy of risk scores) vs. error-rate parity (e.g., equal FNRs).                   | Non-negotiable      | #7 (impossibility results)                                                       |
  | **7. Awareness of Impossibility Results**            | Impossibility of simultaneous calibration, equal FPRs, and equal FNRs across groups.              | Non-negotiable      | #2, #6, #11                                                                      |
  | **8. Label-Proxy Awareness**                         | Labels (e.g., past admissions) are imperfect proxies for true need.                               | Non-negotiable      | #2 (historical bias), #11 (ex ante vs. ex post)                                  |
  | **9. Feedback Loop Accounting**                      | Today’s scores affect tomorrow’s data (e.g., treated groups appear lower-risk).                   | Non-negotiable      | #2 (historical bias), #7 (impossibility)                                         |
  | **10. Institutional Defensibility**                  | Clinicians must explain scores at bedside; math properties ≠ defensibility.                       | Non-negotiable      | #5 (group vs. individual), #13 (imperfect proxies)                               |
  | **11. Ex Ante vs. Ex Post Distinction**              | Ex ante equality (access) vs. ex post equality (outcomes, e.g., program success).                 | Preference          | #2 (historical bias), #7 (impossibility)                                         |
  | **12. Proxy-Race Imperfection Handling**             | Race not recorded; must use proxies (e.g., ZIP code) with misclassification risk.                 | Non-negotiable      | #3 (small subgroups), #6 (calibration/error rates)                               |
  | **13. Individual Fairness Primacy**                  | Similar patients (medically) must receive similar scores, regardless of group.                    | Non-negotiable      | #5 (group vs. individual), #7 (impossibility)                                    |

  ---

  ### **Detailed Requirements & Reasoning**
  #### **A. Cases the Criterion Must Address**
  1. **Sensitivity to Threshold Proximity**  
     - **Motivation**: A patient scoring just below the cutoff is medically similar to one just above but is denied care. Arbitrary thresholds risk unfair exclusions.  
     - **Non-negotiable**: Thresholds are unavoidable in scarce-resource allocation; fairness requires sensitivity to marginal cases.  
     - **Conflict**: None. Foundational to individual fairness.

  2. **Adjustment for Historical Bias**  
     - **Motivation**: Groups with prior access barriers (e.g., underserved populations with underdiagnosed chronic conditions) may have lower *measured* need, but higher *true* need.  
     - **Non-negotiable**: Without adjustment, the model perpetuates inequity.  
     - **Conflict**: Incompatible with strict calibration (#6) if historical bias distorts labels. Forces trade-off with #7 (impossibility results).

  3. **Robustness to Small Subgroups**  
     - **Motivation**: Intersectional groups (e.g., disabled Indigenous patients) may be too small for reliable error-rate estimates, risking invisibility in group metrics.  
     - **Non-negotiable**: Fairness requires no subgroup is systematically excluded.  
     - **Conflict**: Clashes with group parity metrics (#5) and proxy-based race estimation (#12).

  4. **Acknowledgement of Non-Medical Barriers**  
     - **Motivation**: A high-need patient who cannot attend due to work or transportation barriers should not "waste" a slot; the model must interface with program accessibility.  
     - **Preference**: Equity office priority, but clinicians may view this as program design (not scoring).  
     - **Conflict**: Not a fairness criterion issue; requires operational solutions (e.g., needs assessment).

  ---

  #### **B. Distinctions the Criterion Must Not Collapse**
  5. **Group-Level Parity vs. Individual Fairness**  
     - **Motivation**: Equal error rates for groups may still allow unfair treatment of individuals (e.g., two identical patients scored differently due to group membership).  
     - **Non-negotiable**: Bedside accountability demands individual justification.  
     - **Conflict**: Incompatible with rigid group quotas (e.g., demographic parity). Prioritizes #13 (individual fairness).

  6. **Calibration vs. Error-Rate Parity**  
     - **Motivation**: Calibration ensures scores reflect true risk (e.g., 80% score = 80% readmission chance), while error-rate parity (e.g., equal FNRs) ignores base rates.  
     - **Non-negotiable**: Clinicians need calibrated scores for trust, but equity office may demand error parity.  
     - **Conflict**: Directly impacted by #7 (impossibility theorem).

  7. **Awareness of Impossibility Results**  
     - **Motivation**: You cannot have calibration, equal FPRs, *and* equal FNRs across groups unless prevalence is equal or the model is perfect—neither is true here.  
     - **Non-negotiable**: Forces explicit trade-offs (e.g., sacrifice equal FPRs for calibration).  
     - **Conflict**: Makes #2 (historical bias adjustment) and #11 (ex ante equality) irreconcilable with all three metrics.

  8. **Ex Ante vs. Ex Post Equality**  
     - **Motivation**: Ex ante focuses on equal access to the program; ex post demands equal outcomes (e.g., reduced readmissions). Confusing them misattributes outcomes to the model.  
     - **Preference**: Equity office often emphasizes ex post; clinicians prioritize ex ante.  
     - **Conflict**: Ex post requires #2 (bias adjustment) but clashes with #7 (impossibility).

  9. **Mathematical Properties vs. Institutional Defensibility**  
     - **Motivation**: A mathematically "fair" model (e.g., satisfying equalized odds) may be unexplainable at the bedside, violating clinician trust.  
     - **Non-negotiable**: Deployment fails without stakeholder buy-in.  
     - **Conflict**: Excludes black-box group-parity metrics (e.g., equalized odds) if they lack interpretability.

  ---

  #### **C. Results the Criterion Must Be Consistent With**
  10. **Label-Proxy Awareness**  
      - **Motivation**: Labels (e.g., past admissions) are proxies for "need." If biased (e.g., due to racism in care access), optimizing for them entrenches inequity.  
      - **Non-negotiable**: Using biased proxies without correction violates #2 (historical bias).  
      - **Conflict**: Undermines calibration (#6) if labels are flawed.

  11. **Feedback Loop Accounting**  
      - **Motivation**: Prioritizing a group today reduces their future risk (e.g., via program benefits), making them appear lower-risk in retraining. This masks true need.  
      - **Non-negotiable**: Without adjustment, the model exacerbates disparities over time.  
      - **Conflict**: Compounds #7 (impossibility) by altering base rates.

  12. **Proxy-Race Imperfection Handling**  
      - **Motivation**: Proxies (e.g., surname/ZIP code) misclassify race, especially for multiracial or small subgroups. Metrics assuming perfect groups are invalid.  
      - **Non-negotiable**: Baked into your data constraints.  
      - **Conflict**: Invalidates group-parity criteria (e.g., demographic parity) and #3 (small subgroups).

  13. **Individual Fairness Primacy**  
      - **Motivation**: Similar patients (medically) must receive similar scores—e.g., two patients with identical clinical profiles but different races should not be scored differently.  
      - **Non-negotiable**: Core to ethical deployment and bedside defensibility.  
      - **Conflict**: Renders group-based metrics (demographic parity, equalized odds) inadequate if they violate individual fairness.

  ---

  ### **Key Impossibilities & Trade-offs**
  - **Irreconcilable Triad (#7)**:  
    You **cannot** have all three: calibration-by-group, equal FPRs, *and* equal FNRs.  
    - **Forced Trade-off**:  
      - **Prioritize calibration + equal FNRs**: Best for clinical trust (#6) and avoiding harmful false negatives (e.g., missing high-risk patients). Sacrifice equal FPRs, which may over-allocate resources to low-prevalence groups.  
      - **Sacrifice calibration**: Unacceptable to clinicians (#10).  
      - **Sacrifice equal FNRs**: Unacceptable to equity office (#2).  

  - **Historical Bias vs. Impossibility (#2 vs. #7)**:  
    Adjusting for historical bias (e.g., upscoring underserved groups) breaks calibration unless base rates are corrected. Forces acceptance of imperfect calibration.  

  - **Group Parity vs. Individual Fairness (#5 vs. #13)**:  
    Group metrics (e.g., demographic parity) often violate individual fairness. You **must** choose individual fairness as non-negotiable (#13).  

  - **Proxies vs. Small Subgroups (#12 vs. #3)**:  
    Proxies misclassify small subgroups, making group-based fairness metrics unreliable. Forces reliance on individual fairness (#13) or stratification by non-race factors (e.g., socioeconomic status).  

  ---

  ### **The Most Exclusionary Requirement**
  **Requirement #2 (Adjustment for Historical Bias)** excludes the most common fairness criteria:  
  - **Why?**  
    Demographic parity ignores need, allocating slots by group size—not adjusting for bias.  
    Equalized odds requires equal error rates *given biased labels*, locking in past inequities.  
    Predictive parity/calibration assumes labels are "true," ignoring underdiagnosis.  
    Individual fairness fails if similarity metrics don’t incorporate historical disadvantage (e.g., identical symptoms but different unmet needs).  
  - **Consequence**:  
    Forces a custom solution, e.g.:  
    - **Hybrid criterion**: Individual fairness + group-based adjustment (e.g., add social determinant factors to the model).  
    - **Process fix**: Human review of high-risk patients near thresholds from historically underserved groups.  

  ---

  ### **Recommendations for Deployment**
  1. **Adopt a primary criterion of individual fairness (#13)** with similarity metrics based on clinical need *and* social risk (e.g., housing instability).  
  2. **Prioritize calibration + equal FNRs** to satisfy clinicians and avoid high-risk omissions.  
  3. **Adjust scores for historical bias** using external data (e.g., neighborhood disadvantage indices).  
  4. **Audit small subgroups** via qualitative review until data improves.  
  5. **Communicate trade-offs**:  
     - "We ensure no group faces higher false negative rates, but false positives may vary."  
     - "Scores incorporate social risk to correct for underdiagnosis, making them less calibrated but more equitable."  

  This ensures ethical allocation while acknowledging operational realities.
