  2. Must support **counterfactual robustness** (e.g., "if dad recalled mom's death, he'd grieve" feels explanatory; thermostat "beliefs" lack this depth).  
  3. Involve **evaluative commitments** (neighbor's kindness and prejudice reflect competing frameworks; immune systems lack evaluation).  

