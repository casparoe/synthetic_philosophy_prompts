  The core tension lies in their intuitive judgments: they accept beliefs in dogs/toddlers as literal, reject them in thermostats as metaphorical, feel uneasy about immune systems despite parallels to corporations, and struggle with their neighbor's contradictory stances. Their father's case is especially charged—they want validation that attributing beliefs to him remains apt but suspect it might not be.  

