answer: |-
  The Kitty Genovese case, as popularly remembered—a victim in clear peril while neighbors hear and could intervene with minimal risk—presents a profound challenge to the concept of supererogation. I argue that this memory, if taken at face value, exposes a critical instability in the supererogation framework: it suggests that acts appearing "beyond duty" under ordinary circumstances collapse into strict obligation when the cost of rescue is trivial and the harm grave. Consequently, the neighbors' inaction wasn't merely unheroic; it was morally wrong. However, this verdict doesn't destroy supererogation as a category. Instead, it forces a clearer demarcation of a *minimal duty of easy rescue*, preserving supererogation for genuinely costly or risky interventions.

  **Applying the Framework to the Case:**
  The supererogationist position traditionally holds that heroic acts—like confronting a violent assailant—are morally optional. One fulfills duty by not harming others; aiding them, especially at significant personal risk, is praiseworthy but not obligatory. If we accept the popular narrative (neighbors aware, attack audible/long, rescue via phone call or shout feasible with negligible risk), this framework seems to license inaction. The neighbors didn’t *cause* the harm; their failure was one of omission, not commission. Supererogationism might say they missed a chance for heroism but violated no strict duty.

  This application, however, strains credulity. When rescue requires only a trivial act (e.g., calling police) to prevent imminent death or grievous harm, labeling it "supererogatory" renders morality bizarrely undemanding. The framework *is* silent on whether "easy rescue" constitutes a distinct duty, but the Genovese case forces the issue. If supererogation implies that *any* act preventing extreme harm without significant cost is merely "good but not required," it licenses passive complicity in easily preventable atrocities. Here, the cost-benefit asymmetry is staggering: a minute of effort versus a life. The framework, strictly applied, absolves the neighbors, but this reveals not the case's permissibility, but the framework's inadequacy in handling extreme asymmetries of cost and consequence. Their inaction wasn't a failure of heroism; it was a failure of basic moral decency—a violation of what we intuitively owe each other when help is effortless and the stakes are life and death.

  **Applying the Case to the Framework:**
  The popular memory of Genovese powerfully argues *against* a pure supererogationist view that denies any duty of easy rescue. It triggers the consequentialist suspicion: *How can preventing murder at zero cost be optional?* If morality permits standing by while someone dies solely because one didn’t wield the knife, it becomes grotesquely permissive. The case suggests that the line between duty and supererogation isn't drawn solely by the *type* of act (rescue vs. non-harm) but critically by the *cost/risk* involved. When cost tends toward zero and prevented harm toward infinity, the act ceases to be optional. This collapses "supererogatory easy rescue" into a *duty*.

  However, the case doesn’t destroy supererogation entirely; it refines its scope. A morality demanding intervention *regardless of cost or risk*—requiring everyone to rush into burning buildings or tackle armed assailants—*would* be intolerably demanding. Supererogation remains essential to distinguish the *obligatory minimum* (easy rescue) from the *genuinely heroic* (high-risk intervention). The Genovese case exposes the need for this intermediate category: a duty of minimal rescue. Recognizing this duty doesn’t erase supererogation; it prevents the category from being abused to excuse profound moral indifference in low-cost/high-stakes scenarios. The neighbors' failure was wrong not because they weren’t heroes, but because they neglected a minimal, non-heroic duty born of our shared vulnerability.

  **Conclusion:**
  The Kitty Genovese narrative, as popularly understood, demonstrates that supererogation is unstable *if* it denies a basic duty of easy rescue. In scenarios of trivial cost and catastrophic preventable harm, inaction isn't merely non-heroic; it's morally culpable. The neighbors' failure (on the popular facts) was wrong. However, this doesn't invalidate supererogation as a category. It compels us to define a clear threshold: morality *requires* intervention when the cost is negligible and the harm severe. Only *beyond* this threshold—where genuine risk or sacrifice begins—does supererogation properly apply, protecting ordinary life from crushing demands while condemning passive indifference to easily preventable horrors. The case doesn’t eliminate the "beyond duty" category; it insists we first establish a plausible, non-heroic baseline of duty.
