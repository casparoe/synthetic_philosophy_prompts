answer: |-
  ### Thought Experiment: The Community Center Compromise

  In a small town, the Community Oversight Board must decide two issues: whether to approve a permit for an annual rally by a fringe political group (Issue X), and whether to relocate a historic statue of the town's founder from the central square to a less prominent location (Issue Y). The board has two blocs: the Civic Preservationists (P), who prioritize free assembly and historical continuity, and the Social Equity Advocates (E), who prioritize preventing public harm and rectifying historical injustices. The status quo is the current arrangement: the rally permit is pending (neither approved nor denied), and the statue remains in place. A compromise bundle is proposed: approve the rally permit (X+) but keep the statue in place (Y+), and simultaneously, relocate the statue (Y-) but deny the rally permit (X-). This bundle moves each issue partway—giving each bloc what they want on their secondary issue but not their primary one. Both blocs substantively prefer the bundled outcome to the status quo, as their own utility rankings show. Yet, each bloc rejects the bundle due to a core deontological constraint: P cannot endorse any action that facilitates harm (like approving the rally), and E cannot endorse any action that perpetuates injustice (like keeping the statue). This is a trade across issues, not a division of a single disputed good.

  ### Demonstration

  - **P's value system**: Outcome-utility ranking (higher = better):  
    (X-, Y+) = 8 (deny rally, keep statue: best outcome—upholds both values).  
    (X-, Y-) = 6 (deny rally, relocate statue: acceptable, but violates historical duty).  
    (X+, Y+) = 5 (approve rally, keep statue: enables harm, though history is preserved).  
    Status quo = 4 (pending decisions: inaction risks both harms).  
    (X+, Y-) = 2 (approve rally, relocate statue: worst—enables harm and destroys history).  
    Constraint: "Never actively enable foreseeable harm to others." Approving the rally (X+) violates this, as the rally is expected to incite violence.  

  - **E's value system**: Outcome-utility ranking:  
    (X-, Y-) = 8 (deny rally, relocate statue: best outcome—prevents harm and rectifies injustice).  
    (X+, Y-) = 6 (approve rally, relocate statue: acceptable, but violates anti-harm duty).  
    (X-, Y+) = 5 (deny rally, keep statue: prevents harm but perpetuates injustice).  
    Status quo = 4.  
    (X+, Y+) = 2 (approve rally, keep statue: worst—enables harm and enshrines injustice).  
    Constraint: "Never actively perpetuate systemic injustice." Keeping the statue (Y+) violates this, as it symbolizes oppression.  

  - **Gains-from-trade verdict**:  
    The bundle (approve rally + relocate statue) yields (X+, Y-).  
    P's utility: 6 (up from status quo of 4, a +2 gain).  
    E's utility: 6 (up from status quo of 4, a +2 gain).  
    Exchange rate: Rally approval (valued by P at +1 utility over status quo) for statue relocation (valued by E at +1 utility over status quo). Both strictly improve, confirming mutual gains.  

  - **Parties' verdicts and constraints**:  
    P rejects the bundle because it requires approving the rally (X+), which violates their constraint against enabling harm (even though the overall outcome ranks higher). Acting to cause harm is forbidden, regardless of net gains.  
    E rejects the bundle because it requires keeping the statue (Y+), which violates their constraint against perpetuating injustice (even though the overall outcome ranks higher). Acting to uphold injustice is forbidden, regardless of net gains.  

  - **Structural feature doing the work**:  
    The key feature is that each party's constraint prohibits a *specific act* (approving the rally for P, keeping the statue for E) that is part of the compromise, even though the *outcome* of the bundle is preferred. If the constraints are removed (e.g., if both blocs were purely outcome-focused), the bundle is a strict improvement, refusal becomes irrational, and the case collapses into a standard gains-from-trade scenario.  

  - **Attack from the trade model defender**:  
    A defender might argue that the trade model can be extended to "act-space": each bloc could trade *acts* rather than outcomes, with P trading "approve rally" for E's "relocate statue" at a "price" where both acts are performed. Refusal is then irrational because the act-trade also yields mutual gains (e.g., P gets their valued statue relocation, E gets rally denial).  

  - **Rebuttal**:  
    The attack fails because it ignores the deontological nature of the constraints. For P, "approve rally" is intrinsically wrong—they cannot "trade" it without violating their principles. Similarly for E and "keep statue." The trade model assumes all values are commensurable (reducible to a single utility scale), but constraints treat certain acts as forbidden, making them non-tradable. The case is not rigged; it reflects real-world deontological commitments.  

  - **What the case establishes about the trade model**:  
    The case shows that the trade model requires an additional premise: that each party's ranking is over *outcomes only* and that they are willing to act solely to maximize outcome-utility. This premise is a limitation, not a description of compromise, as it excludes agents with act-based constraints (e.g., "I must not lie, even if it produces a better outcome"). Compromise can involve trades, but only when constraints permit; otherwise, it may be forbidden by integrity-based principles. The model remains valid for purely consequentialist agents but falters when constraints are present.
