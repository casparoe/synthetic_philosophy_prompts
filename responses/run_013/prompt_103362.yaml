  A pain (understood as a sensory state that may or may not include an unpleasant affective component) is bad for a subject if and only if either (i) it is unpleasant for that subject, or (ii) it is the object of a negative affective attitude (such as distress, dislike, or dissatisfaction) on the part of the subject.

