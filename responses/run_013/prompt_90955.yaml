  What would change my mind? If someone built a system with a fixed, large catalogue of representations and operations that could solve a wide range of analogy problems (including ones that require novel representations) without any mechanism for creating new representations on the fly, and if that system could solve problems that require a representational shift that was not explicitly programmed in the catalogue, then I would have to reconsider. But note: if the catalogue is fixed, then the system is limited to what was pre-programmed. If the system could, for example, generate new representations by composing existing ones in a way that was not pre-specified, then that would be a way around the fixed catalogue. But then it's not really fixed. Alternatively, if the catalogue were so large that it covered every humanly conceivable representation, then it might work. But that is not feasible.

