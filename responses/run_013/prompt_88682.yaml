  ## Interagency Coordination Memorandum 24-7  
  **Subject:** Guidance on the Determination of Process Rationale (Version 3.1)  
  **Issuing Body:** Bureau of Adaptive Teleology (BAT)  
  **Effective Date:** Immediately  
  **Supersedes:** IMD 24-6  

  **1. Purpose & Scope**  
  This document establishes standardized procedures for the Bureau of Adaptive Teleology (BAT) to assess whether a nominated Process exhibits a Free-Floating Rationale (FFR). An FFR exists when a Process reliably tracks a state of affairs beneficial to its persistence or replication, absent explicit representation or comprehension by any agent within the system. This determination is independent of claims regarding intentionality, consciousness, or design.  

  **2. Definitions**  
  *   **Process:** Any temporally extended, functionally organized sequence of events or operations.
  *   **Free-Floating Rationale (FFR):** The beneficial state of affairs (e.g., survival, replication, efficiency) tracked by a Process due to its selective history or stable functional role, without requiring representation of that state by any component within the Process.
  *   **Rationale-Holder (RH):** An entity capable of internally representing reasons and acting upon them. (Note: Presence of an RH does not preclude an FFR; they are not mutually exclusive).
  *   **Selection History:** A documented causal chain wherein variant Processes differentially persist based on consequences relative to the claimed rationale.
  *   **Proper Function:** The characteristic activity a Process performs in virtue of its selective history or stable systemic role.
  *   **Tracking:** A reliable causal relationship between the Process's operation and the relevant state of affairs, established through counterfactual sensitivity or differential response.
  *   **Representation:** The internal encoding or symbolic stand-in for the state of affairs within the system.

  **3. Core Criteria for FFR Determination**  
  A Process exhibits an FFR if it satisfies **all** of the following:  
  *   **(C1) Selection History / Stabilizing Mechanism:** The Process exists in its current form due to a history of selection favoring variants that produced Outcome *O*, OR it occupies a stable functional niche within a larger system where *O* is its designated contribution.
  *   **(C2) Proper Function:** The Process reliably produces or contributes to Outcome *O* under normal conditions.
  *   **(C3) Non-Representational Tracking:** The Process reliably adjusts its operation to achieve or maintain *O* based on environmental inputs, without requiring internal representation of *O* or the reasons for achieving it. (Representation elsewhere in the system is permissible).

  **4. Assessment Workflow (Verbal Description)**  
  1.  **Nomination:** Receive Form BAT-7FFR detailing Process, claimed rationale (*O*), and supporting evidence (historical, functional analysis).
  2.  **Initial Screening:** Verify completeness. Reject if *O* is vague, demonstrably false, or lacks plausible causal link to Process. (See *Table 1: Common Rejections*).
  3.  **C1 Evaluation:** Assess evidence for selection history (e.g., variation, differential persistence linked to *O*) or systemic functional role. Consult historical records, comparative analysis, or system blueprints.
  4.  **C2 Evaluation:** Assess evidence of reliable production of *O* (empirical data, functional simulation). Does the Process malfunction if *O* is not achieved?
  5.  **C3 Evaluation:** Assess mechanism. Does the Process react to cues *correlated* with *O*, adjusting behaviour to achieve *O*, without evidence of internal representation of *O* itself? Analyze internal states/architecture if accessible.
  6.  **Synthesis & Determination:** If all criteria (C1, C2, C3) are met, FFR status is **AFFIRMED**. If any criterion fails, status is **DENIED**. Document rationale for each criterion finding.
  7.  **Output:** Issue Determination Notice (Form BAT-8DN).

  **5. Appeals Procedure**  
  Appeals based on new evidence or procedural error must be submitted on Form BAT-9AP within 60 days. BAT will re-evaluate contested criteria only. Appeals invoking arguments requiring an RH (e.g., "but nothing *means* it!") are summarily dismissed (See *Section 7: Interagency Coordination*).

  **6. Table 1: Worked Examples & Determinations**

  | Process          | Claimed Rationale (*O*) | C1 Met? | C2 Met? | C3 Met? | BAT Determination | Notes                                       |
  | :--------------- | :---------------------- | :------ | :------ | :------ | :---------------- | :------------------------------------------ |
  | Beaver Dam       | Impound water           | Yes     | Yes     | Yes     | **AFFIRMED**      | Clear selection history; adaptive tracking. |
  | Thermostat       | Maintain temperature T  | Yes     | Yes     | Yes     | **AFFIRMED**      | Designed function; tracks T via sensor.     |
  | Chess Engine     | Win chess game          | Yes     | Yes     | **No**  | **DENIED**        | Relies on internal representation of game state/goals (C3 Fail).¹ |
  | River Meander    | Minimize energy loss    | Yes     | Yes     | Yes     | **AFFIRMED**      | Physical principle selection; reliable outcome. |
  | Market Price     | Signal scarcity        | Yes     | Yes     | Yes     | **AFFIRMED**      | Emergent from aggregated interactions; tracks supply/demand. |
  | Immune System    | Neutralize pathogen X   | Yes     | Yes     | Yes     | **AFFIRMED**      | Evolved function; clonal selection tracks antigens. |
  | Coin (10 Heads) | Land heads              | **No**  | **No**  | **No**  | **DENIED**        | No selection history for heads; random outcome (C1, C2 Fail).² |
  | Company Hiring Policy | Hire competent employees | Yes     | Partial | **No**  | **PENDING**       | Selection history exists (C1). Function often unreliable (C2 Partial). Relies heavily on HR *representations* of competence (C3 Fail).³ |
  | Venus Flytrap Closure | Capture insects        | Yes     | Yes     | Yes     | **AFFIRMED**       | Evolved function; triggered by touch hairs, no internal model of "insect". |

  *Footnotes:*
  *   **¹:** *Disagreement noted: C1/C2 proponents argue selection pressure on algorithms suffices. BAT ruling: Internal state manipulation constitutes representation of game goals/rules, violating strict C3. See Memo BAT/LOGIC-REFUTE-4.*
  *   **²:** *Rejects "retroactive teleology" – past outcomes don't create rationale.*
  *   **³:** *Referred to BRA for RH assessment component; BAT jurisdiction limited to FFR.*

  **7. Interagency Coordination**  
  This Bureau operates under the *Adaptive Teleonomy Act*. The Bureau of Rational Agents (BRA) holds jurisdiction over determinations involving Rationale-Holders (RHs). BAT determinations are strictly limited to identifying FFRs. **Memo Directive:** BAT personnel must disregard all BRA communications asserting that FFRs are "incoherent without an RH" or demanding RH verification for FFR cases. Such arguments constitute jurisdictional overreach. Standard Response Template BAT-RESP-1 ("Respectfully, jurisdiction resides with BAT per ATA Sec. 5c; submit RH claims to BRA via Form BRA-12RH") shall be used for all such inquiries. BRA's lane is RHs; BAT's lane is FFRs. Maintain clear boundaries. (Ref: BAT/BRA-MEMO-WARNS-12, -15, -18, -21, -23).

  **8. Self-Application & Recursive Considerations**  
  This Guidance Document (GD-24-7) is itself a Process. To ensure methodological consistency, BAT is required to assess its own FFR status periodically:
  *   **Claimed Rationale (*O*):** To reliably guide BAT personnel in making accurate FFR determinations.
  *   **C1 (Selection History):** This document supersedes IMD 24-6, reflecting iterative refinement based on past determination challenges and interagency friction (selective pressure for clarity and jurisdictional defensibility).
  *   **C2 (Proper Function):** This document is routinely consulted and applied by BAT personnel during determinations, generally leading to consistent outputs when applied correctly.
  *   **C3 (Non-Representational Tracking):** The document operates through explicit rules and criteria. Its application adjusts BAT decisions (e.g., denying coin flip rationale) based on input (Process nominations), reliably tracking the goal of accurate FFR identification. However, its content *is* representational (text conveying concepts). Does this internal representation within the document itself constitute an RH within the Process, violating C3? Or is the document merely a stable functional component within the larger BAT determination system, where the tracking occurs via the *application* of the rules by personnel (or automated systems)?

  **Current Status:** Self-application audit is ongoing (Initiated: DD/MM/YYYY). Preliminary analysis suggests potential C3 conflict due to representational content. Final determination is deferred pending development of criteria for self-referential systems. See Appendix B: Recursive Rationale Audit (Draft). This Guidance remains in effect until superseded or its FFR status is conclusively **DENIED**. Personnel shall continue applying it as the operative procedure, noting the unresolved metaphysical tension inherent in its operational existence. The question of *where the rationale ultimately resides* remains...
