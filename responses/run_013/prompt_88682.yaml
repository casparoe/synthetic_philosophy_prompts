prompt: |-
  ok so context: I'm a 4th year PhD in phil of bio / cog sci and my reading group is doing the free-floating rationale thing (pretty sure it's Dennett's phrase but dont quote me) — the idea that a process can track a reason without anyone representing it, so a beaver's dam is for holding back water because dams that didn't hold water didn't get built, and a cuckoo chick's begging is for getting fed even though the chick has no idea what its doing. The whole point is: a reason, but no reasoner anywhere in the loop.

  For the group I have to bring in a satire piece and I want it to actually be about the concept, not just lol bureaucracy. Can you write me this:

  A deadpan regulatory guidance document from an invented agency whose job is to decide, for any process anyone submits to it, whether that process has a rationale. Real guidance-note voice — purpose, definitions, criteria, an appeals procedure, a table of worked examples with the agency's verdicts on each, a short closing section. Describe a flowchart in words rather than drawing it. Put a rival body in the background that insists reasons require reasoners, with the agency repeatedly writing memos telling it to stay in its lane — that's most of the running gag.

  The target I want skewered is the practice of crediting a process with a reason just because you can tell its history as a selection story — i.e. handing out rationales so freely that the category stops doing any work. So the agency should be competent and even-handed, and its criteria should be recognisably the real ones: selection history, proper function, behaving as if designed, tracking versus representing, and so on. The funny verdicts have to follow honestly from applying those criteria, not from the agency being dumb — a phil of bio person should laugh rather than wince. Let the tests disagree on at least one case, so the agency has to pick a side and justify it in a footnote. End with the agency applying its own criteria to this very guidance note, and dont resolve it — by the last line I want the reader to be the one stuck with the question of where reasons actually live.

  Worked examples I'd like in the table (use most of them, plus at least one of your own that I havent thought of): a beaver's dam, a thermostat, a chess engine, a river's meander, a price in a market, an immune system, a coin that's come up heads ten times running, and a company's hiring policy.

  About 750 words, section headings fine. Readable to someone who's never heard the term, and never wink at the reader — no asides, no jokes about the agency being Kafkaesque, no real people as characters, no citations. Thanks!
reasoning: |-
  Okay, the user is a fourth-year PhD in philosophy of biology/cognitive science. Their reading group is discussing the "free-floating rationale" concept—probably Dennett's idea—where processes track reasons without any conscious representation. They need a satire piece in the form of a regulatory guidance document from a fictional agency that determines if processes have rationales. 

  The key requirements are: deadpan bureaucratic tone, no winks to the reader, using real criteria like selection history and proper function. The satire should target over-attributing reasons just because a selection story can be told. The rival body arguing that reasons require reasoners will be the running gag. 

  I need to structure it like a real guidance document: purpose, definitions, criteria, appeals, workflow, examples table. The examples must include beaver dams, thermostats, chess engines, river meanders, market prices, immune systems, coin flips, hiring policies, plus one original. Crucially, the agency must apply criteria consistently—the humor comes from rigorous application leading to absurd verdicts, not incompetence. 

  For the conflict: I'll have the rival Bureau of Rational Agents (BRA) constantly intruding, with memos telling them off. One test case (probably the chess engine) will show criteria disagreement, resolved in a footnote. The ending should mirror the document itself—applying the criteria to its own existence, leaving the reader questioning where reasons reside. 

  Word count is tight (~750). I'll avoid: jargon without explanation, meta-jokes, real names. The tone stays dry: "adaptive teleology" as a term, "non-representational tracking" as a bullet point. The satire punches up at academic habits, not bureaucracy itself. 

  Testing the depth: The user wants philosophers to laugh at their own tendency to overextend "reasons" via selectionist thinking. The memo about coin flips rejecting "retroactive teleology" nails that. Hiring policy being "Pending BRA Consultation" highlights the institutional turf war. 

  Final beat: The document evaluating itself creates that delicious loop. Ending mid-sentence with "Appendix B: Self-Application Audit" implies infinite regress—perfect for a PhD group debating where reasons "live".
