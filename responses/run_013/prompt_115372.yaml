answer: |-
  ### Scenario: The Apartment Sublet
  You manage two identical vacant apartments. Two prospective tenants—Alex and Bailey—both seem reliable. You must choose whom to rent Apartment A to; the other gets B. The units are indistinguishable, and both applicants are equally qualified. Your evidence about how their lives will unfold post-lease is perfectly symmetric: both appear equally likely to thrive, face modest hardships, or form positive community ties. Based solely on foreseeable local effects (rent paid, property upkeep), the choice seems neutral. However, renting A to Alex triggers a cascade: Alex befriends a neighbor who later recommends a job to Alex’s sibling, leading that sibling to decline a different job, causing a ripple in a small business’s hiring that ultimately results in a life-saving medical innovation being delayed by 18 months. Renting A to Bailey instead leads Bailey to take a different bus one morning, missing a chance encounter that, through a chain of social and professional interactions, averts that delay. Hundreds die due to the delay in the Alex-A scenario, but no amount of investigation by you could uncover these specific branching paths or their aggregate effects—the chains are too complex, sensitive, and opaque.

  ### Analysis
  1.  **Expected Value (Subjective) Consequentialism:** Your evidence is perfectly symmetric between options. No calculable expected value difference exists, even in principle. Neither choice maximizes expected good over the other. Both are permissible; flipping a coin is fine.
  2.  **Actual Consequence (Objective) Consequentialism:** The outcomes differ massively. Choosing the Alex-A path causes hundreds of deaths compared to the Bailey-A path. It is objectively (though unknowably) a serious wrong. You have no excuse; you *should* have picked Bailey for A.

  ### The Separating Feature
  **Irremediable Evidence Symmetry in a Deterministic World:** The world is fixed/deterministic; one choice *does* cause vastly worse outcomes. Crucially, *no possible evidence accessible to the agent* breaks the symmetry in foresight. The causal chains are so long, branching, and micro-level unpredictable that the aggregate difference remains forever hidden *despite* being large and determinate. This isn't risk (unknown probabilities over knowable outcomes) but profound ignorance of *what the outcomes even are* or *how the choice connects to them*.

  ### If You Remove That Feature
  If you make the chains shorter/simpler or allow that *sufficient* (though immense) investigation *could* reveal the probable outcomes or break the evidence symmetry (e.g., you *could*, in theory, model the entire social cascade), it collapses into a standard **risk/uncertainty case**. Expected Value Consequentialism would then demand you try to calculate the best odds or maximize the chance of avoiding catastrophe. The "cluelessness" vanishes.

  ### Cheapest Attack for the Expected Value Defender
  Argue that **genuine, irremediable symmetry of this kind is impossible or irrelevant in practice.** Claim:
  *   *Impossible:* Determinism plus complexity doesn't guarantee *absolute* epistemic symmetry. *Some* differentiating evidence, however slight or buried, must exist in principle. If we grant infinite (or sufficient) time/resources, the symmetry *would* break, making it a hard (but ordinary) risk problem.
  *   *Irrelevant:* Morality must be action-guiding. Demanding agents be responsible for utterly unknowable distant effects renders morality impossible or paralyzing. Only foreseeable (or reasonably knowable) consequences matter for blame/praise. The "objective" wrong here is a metaphysical curiosity, not a genuine moral failing.

  ### Contested Ground
  There is **no tidy consensus** on whether:
  1.  Such profound, irremediable cluelessness *is* metaphysically/epistemically possible.
  2.  Objective consequentialism *should* hold agents responsible for these utterly unforeseeable actual consequences.
  3.  Expected value consequentialism's "permissibility" verdict in such cases is a fatal flaw or a necessary feature of a feasible moral theory.

  The core dispute hinges on the nature of moral responsibility under radical ignorance about the deterministic causal fabric.
