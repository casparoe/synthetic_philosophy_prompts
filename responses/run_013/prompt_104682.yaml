  A proponent of the conclusion-based procedure might argue that the committee should focus on the conclusion (Q) because it is the actual decision to be made (whether to give the drug). They might say that the conditional (P→Q) is a general rule that might not be appropriate in this specific context, and that the majority's rejection of Q reflects the collective will on the concrete issue. They might also question the relevance of the conditional in this decision, arguing that the committee should vote directly on the allocation without being bound by a prior general rule. Moreover, they could point out that the premise-based procedure forces the group to accept Q even though a majority does not support it, which is undemocratic for the decision at hand.

