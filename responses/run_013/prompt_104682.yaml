  **Scenario: Hospital Triage Committee**

  A hospital triage committee of three members (A, B, and C) must decide on the following policy for allocating a scarce resource (e.g., a new expensive drug):

  - Proposition P: "The patient is in a critical condition."
  - Proposition Q: "The patient receives the drug."
  - Conditional proposition: P→Q: "If the patient is in a critical condition, then they receive the drug."

  The committee members vote as follows:

  - Member A (a cost-concerned administrator) believes that critical patients should not automatically get the drug because it is expensive and might not be effective for the most critical cases. So A judges: P true (the patient is critical), Q false (should not get the drug), and therefore P→Q false (the conditional rule is not acceptable because it would require giving the drug to critical patients).

  - Member B (a public health expert) believes that the drug should be given based on overall benefit, and that critical patients are less likely to benefit. B thinks the drug should be given to non-critical patients only. Hence, B judges: P false (the patient is not critical? or at least in this case, the patient under consideration is not critical in B's view) and Q false (the patient should not get the drug). Since the patient is not critical, B believes the conditional is still true (because the conditional only says that if critical then get the drug, and here the patient is not critical, so the conditional holds). So B: P false, Q false, P→Q true.

  - Member C (an advocate for the critically ill) believes that critical patients should get the drug. Moreover, in the case under consideration, C judges the patient to be critical and therefore should get the drug. So C: P true, Q true, and P→Q true.

  Now, the majority votes:

  - P: A and C say true -> majority true.
  - Q: A and B say false -> majority false.
  - P→Q: B and C say true -> majority true.

  Thus, the group collectively violates modus ponens: they accept "if critical then get the drug", they accept "the patient is critical", but they reject "the patient gets the drug".

  **Premise-based vs. Conclusion-based Procedures**

  - Premise-based procedure: The group would take majority votes on the premises (P and P→Q) and then derive the conclusion Q by modus ponens. Here, majority says P is true and P→Q is true, so they would conclude Q must be true.

  - Conclusion-based procedure: The group would take a majority vote directly on Q. Here, majority says Q is false.

  Thus, they come apart: premise-based yields Q true, conclusion-based yields Q false.

  **The Key Feature**

  The key feature that makes the dilemma possible is that the propositions are logically connected and the majority votes are taken independently. In particular, the fact that the majority on Q is determined without regard to the logical connection to P and P→Q is crucial. Also, note that the conditional P→Q is not a premise in the usual sense but a rule that connects two factual propositions. The dilemma arises because the majority on the antecedent (P) and the conditional (P→Q) is not aligned with the majority on the consequent (Q).

