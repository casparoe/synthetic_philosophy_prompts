prompt: |-
  I'm in sixth form and I run a sort of unofficial philosophy club with a teacher, Mrs H, who's definately got a bee in her bonnet about guilt and shame. She keeps giving verdicts on cases and I want to know what she'll say about the one we're actually dealing with at school.

  Her verdicts so far, as best I can write them down:

  - A kid who cheats in a mock exam, feels guilty, confesses, and asks to resit: she says guilt is doing its job here.
  - A kid who cheats, feels ashamed, and starts avoiding the subject and lying about it: she says shame is doing damage here.
  - A girl who feels ashamed that her family can't afford the school trip, so she doesn't go and doesn't tell anyone: she says that's shame being dumped on her by the school's culture, not a useful moral emotion.
  - A boy who feels guilty about something he couldn't control, like his parents splitting up, and can't stop apologising: she says that's guilt gone wrong, not guilt doing its job.
  - A workplace where people feel shame about missing targets and then work harder: she says shame is doing its job there, even though she doesn't like it.
  - A restorative justice meeting where the person who did the harm feels guilt, hears from the victim, and repairs what they can: she says that's the gold standard.
  - A public shaming campaign on social media where someone is humiliated and then apologises: she says that's shame being used as punishment, and it doesn't count as moral repair.

  Then she says something I can't fully get my head round. She thinks cultures can choose which emotion they major in, but not in the way people usually mean. She says institutions don't just punish behaviour; they build the emotional plumbing. She calls this an emotion regime. But she also says there's a difference between an emotion being available in a culture and a culture actually selecting it. She thinks guilt and shame aren't rivals exactly; they're two different ways of attaching a person to a norm, and the real question is what the norm is attached to — the act or the self — and whether the person can do anything about it. She also thinks you can't always seperate the emotion from the audience: shame needs a real or imagined watcher, guilt needs an internalised standard, and a culture can supply one without the other.

  Now the actual case. Our school is bringing in a new policy for vaping. Option G is the guilt-ish one: private reflection with a tutor, a letter of apology to someone affected (maybe the cleaner who has to pick up the pods), and a repair task. Option S is the shame-ish one: a small meeting where the kid has to admit what they did in front of a few affected people, hear how it landed, and then do a private repair task. The aim of S is to make them feel ashamed of being the kind of person who vapes in the toilets, not just guilty about the act. The head wants to know which will work better, and also whether we can deliberately make the school a guilt culture rather than a shame culture. She says she wants a decision that's consistent with what Mrs H has already said.

  What would Mrs H say about Option G vs Option S? What rule is she actually running? What other rules fit her earlier verdicts just as well? Which of those rules would come apart on this case, and what further case would tell them apart? I'm less bothered about whether she's right than about what she's committed to.
reasoning: |-
  Okay, let me try to figure out what Mrs. H would say about the vaping policy options. She's really into guilt and shame, and how they function differently. The key points from her past verdicts are that guilt is productive when it leads to confession and repair, like in the cheating case where the kid confessed. Shame is damaging when it makes someone hide or avoid the issue, like the kid who lied after cheating. But she also said shame can work in some contexts, like the workplace example where shame about missing targets made people work harder. However, she criticized public shaming on social media as punishment without real repair.

  Mrs. H also talks about emotion regimes. Institutions shape emotions, not just behaviors. Guilt focuses on the act ("I did something bad"), while shame targets the self ("I am bad"). She thinks cultures can choose which emotion to emphasize, but it depends on what the norm is attached to and whether the person can fix it. Plus, the audience matters: shame needs a watcher, guilt needs an internal standard.

  Now, the vaping policies. Option G is guilt-oriented: private reflection, apology letter, repair task. This seems to align with guilt's internal focus and chance for amends. Option S uses shame: admitting fault in a meeting, facing affected people, aiming to make them feel ashamed of their identity. The head wants to know which works better and if the school can become a guilt culture.

  Mrs. H would likely favor Option G. It mirrors the restorative justice case she called the gold standard—private, focused on the act, with repair. Option S tries to instill shame about the self, which could lead to avoidance or hiding, like the examples where shame was harmful. Also, the small meeting might feel like an audience, triggering shame's negative effects. Even though the workplace example showed shame working, that was about targets, not personal identity. Here, targeting the self as a "vaper" could be damaging.

  The rule Mrs. H uses seems to be: guilt is good when it leads to repair without attacking the self; shame is acceptable only if it's about actions and leads to change, but risky when it internalizes as identity. Other possible rules might focus on privacy versus publicity, but her workplace example complicates that. A better differentiator would be a case where public shame leads to genuine repair without harm, but Mrs. H's social media example shows she doubts that. Another test case might involve unavoidable failures—like the boy feeling guilty about his parents' divorce—to see if the emotion matches responsibility. If Option S caused someone to feel irreparably flawed, it would fail her test.
answer: |-
  Based on Mrs. H's established pattern of reasoning ("emotion regime," the function of guilt/shame, attachment to act vs. self, and the need for repair), here's what she would likely say about Option G vs. Option S, the rule she's running, alternative rules, and how to test them:

  **Mrs. H's Verdict on the Vaping Policy:**

  1.  **Option G (Guilt-ish):** She would **strongly endorse this**. Her reasoning would be:
      *   **Attachment to the Act:** The private reflection, apology letter, and repair task focus on *what the student did wrong* (vaping, littering, impacting the cleaner) rather than attacking *who they are*.
      *   **Guilt Doing its Job:** It mirrors the "gold standard" restorative justice case. Guilt is triggered (via reflection/internal standard), harm is acknowledged (to the cleaner/environment), and concrete repair is offered. It avoids the pitfalls of shame (avoidance, lying).
      *   **Internal Standard/Audience:** The process relies on an internalized standard of right/wrong (guilt) fostered by the tutor conversation and reflection task. The "audience" (cleaner) receives an apology and sees the repair, but the *confrontation* isn't public or identity-focused. It aims for moral learning, not humiliation.
      *   **Consistency:** It aligns perfectly with her positive verdicts on the confessing cheater (guilt leading to correction) and restorative justice.

  2.  **Option S (Shame-ish):** She would **criticize this strongly**. Her reasoning would be:
      *   **Attachment to the Self:** The explicit aim ("make them feel ashamed of *being the kind of person* who vapes") directly targets the core self, not just the act. This is the hallmark of problematic shame for her (e.g., the cheating kid who hid, the girl ashamed of her family).
      *   **Shame Doing Damage:** Forcing a confession/admission in front of "a few affected people" *before* any repair creates a high risk of the damaging shame response: avoidance, defensiveness, hiding, or internalizing a negative identity ("I *am* a bad person/a rule-breaker"). It prioritizes feeling bad *about oneself* over understanding the impact of the *act*.
      *   **Audience as Catalyst:** The small meeting provides the "real or imagined watcher" essential for triggering this damaging, self-focused shame. While not social media-level public, it's still a forced performance of remorse before an audience, leaning towards humiliation/punishment rather than the "gold standard" of repair-focused dialogue.
      *   **Inconsistency:** It resembles the public shaming case she rejected (shame as punishment, not repair) and risks creating the kind of shame that made the cheating kid lie or the girl skip the trip. It might achieve compliance (like the workplace shame), but at the cost of damaging the student's self-concept and potentially fostering resentment, not genuine moral understanding. The "private repair task" comes *after* the shaming, which feels like an afterthought, not the core mechanism.

  3.  **On Creating a "Guilt Culture":** She would **agree it's desirable and possible**.
      *   She'd argue Option G is a concrete step towards building that "emotional plumbing." It focuses on internal standards (guilt), harm to others, and reparation. It avoids institutionalizing identity-based shame (Option S). She'd likely say the school *is* choosing its emotion regime by selecting which policy to implement.

  **The Rule Mrs. H is Running (The "H Principle"):**

  > **An emotion (guilt/shame) is morally functional ("doing its job") only when:**
  > 1.  **It is primarily attached to a *specific act or failure* rather than the core self.**
  > 2.  **The individual has agency over the act (could have done otherwise) and can realistically undertake repair for it.**
  > 3.  **The institutional process facilitates and prioritizes acknowledgment of harm and concrete reparation over humiliation or identity labeling.**
  > 4.  **The "audience" element (for shame) is minimized or structured solely to facilitate understanding harm and repair, not to induce self-loathing.**
  >
  > *   **Guilt is generally preferable** as it inherently focuses on the act (internal standard) and motivates repair.
  > *   **Shame is potentially functional only in very limited contexts** (like her workplace example - focusing on the *failure to meet the target*, not the person's worth) but carries inherent risks (self-focus, avoidance) and is **dysfunctional when** attached to the core self, unchosen circumstances, or used punitively with an audience.

  **Alternative Rules that Fit Most (But Not All) Verdicts:**

  1.  **The Privacy Rule:** "Guilt is good (private/inward); Shame is bad (public/outward)."
      *   *Fits:* Confessing cheater (guilt/private good), Avoiding cheater (shame/private? bad), Girl skipping trip (shame/private bad), Boy apologizing uncontrollably (guilt/private? bad), Restorative justice (guilt-focused dialogue/semi-public good), Social media shaming (shame/public bad).
      *   **Fails:** Workplace shame ("private" feeling of shame leading to harder work deemed functional, even if disliked) and potentially the avoiding cheater (shame could be felt privately). The workplace case breaks this rule.
      *   *Breaks on Vaping Case:* Option S is semi-private (small meeting), yet Mrs. H rejects it based on *self-focus*, not primarily privacy. Option G involves writing to the cleaner (semi-public act), yet is endorsed.

  2.  **The Action Rule:** "Shame/Guilt is good if it leads to positive behavioral change."
      *   *Fits:* Confessing cheater (change: confessed/resit), Workplace shame (change: worked harder), Restorative justice (change: repaired harm). Rejects uncontrollable guilt (no useful change), avoiding cheater (change: hid/lied - negative), girl skipping trip (change: withdrew - negative), social shaming (change: apology under duress - not genuine repair?).
      *   **Fails:** Mrs. H explicitly rejects social shaming *even if* it leads to an apology ("doesn't count as moral repair"). She cares about the *quality* of the change (genuine repair vs. coerced compliance) and the *cost* (damage to self). She also critiques the workplace shame *despite* the behavioral change because she "doesn't like it" (likely due to the shame mechanism).
      *   *Breaks on Vaping Case:* Option S *might* deter future vaping (behavioral change), but Mrs. H would reject it due to the self-focus and humiliation risk. Option G might also deter, but she endorses it for its reparative focus, not just deterrence.

  3.  **The Suffering Rule:** "Appropriate suffering for the offense is key; guilt/shame are just tools."
      *   *Fits:* Confessing cheater (suffered guilt, confessed - appropriate), Avoiding cheater (suffered shame, hid - inappropriate response), Girl skipping trip (suffered shame, withdrew - inappropriate suffering for circumstance), Uncontrollable guilt (suffered excessively - inappropriate), Workplace (suffered shame, worked harder - deemed appropriate even if disliked), Social Shaming (suffered humiliation - inappropriate).
      *   **Fails:** Mrs. H's critique goes beyond proportionality. She fundamentally distinguishes *types* of suffering (act-focused guilt vs. self-focused shame) and *how* it's induced (dialogue/repair vs. audience/humiliation). Her verdict on the girl isn't just "too much suffering," it's "wrong *kind* of suffering for the wrong reason."
      *   *Breaks on Vaping Case:* A proponent of this rule might see the "suffering" in Option S (shame in a meeting) as proportional to the offense (vaping). Mrs. H would argue the *type* of suffering (identity-shaming) and *method* (forced audience) are inherently problematic, regardless of proportionality.

  **Differentiating Test Case:**

  The case that best differentiates Mrs. H's rule ("H Principle") from the alternatives (especially the Action Rule and the Privacy Rule) is:

  *   **The "Private Identity Shame Leading to Positive Change" Case:**
      *   *Scenario:* A student plagiarizes an essay. They feel intense, *private* shame about being "a fraud" and "not smart enough." This shame motivates them to *secretly* work incredibly hard on the next assignment (which is original and excellent) to prove to themselves they aren't a fraud. They never confess the plagiarism.
      *   *Mrs. H's Verdict (H Principle):* **Dysfunctional.** While it led to behavioral change (hard work, original next essay), the shame is attached to the *core self* ("fraud," "not smart") not just the *act* of plagiarism. There is no acknowledgment of harm (to the teacher, other students, academic integrity) or reparation. The change is driven by self-loathing and proving self-worth, not moral understanding or repair. The privacy doesn't mitigate the self-focus damage.
      *   *Action Rule Verdict:* **Functional.** It led to positive behavioral change (stopped plagiarizing, produced good work).
      *   *Privacy Rule Verdict:* **Ambiguous/Functional?** The shame was private and led to change, so potentially good (unlike public shame). This highlights the Privacy Rule's weakness regarding the *content* of the emotion.
      *   *Suffering Rule Verdict:* **Likely Functional?** The student suffered intensely (shame) and changed behavior; the suffering might be seen as proportional/appropriate.

  This case shows Mrs. H prioritizes the *object* of the emotion (act vs. self) and the presence of *repair/acknowledgment* over mere behavioral change or privacy. Her rejection of this scenario (despite "successful" change) would sharply contrast with the Action Rule and expose the limitations of the Privacy Rule. It reinforces her core commitment: guilt (act-focused, reparation-oriented) is the morally healthier and more functional emotion for building a constructive "emotion regime." She's committed to the *quality* of moral motivation and repair, not just the outcome of compliance.
