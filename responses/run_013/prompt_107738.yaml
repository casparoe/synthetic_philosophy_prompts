  First, I recall the rubric criteria: a moral emotion is better if it (a) targets the real issue, (b) prompts change rather than hiding, and (c) operates independently of observers or false beliefs. This framework will structure the analysis.

  For the joint claims, I need points both sides accept. Key definitions: guilt focuses on actions ("I did bad"), shame on self ("I am bad"). Behaviorally, guilt drives reparations, shame leads to avoidance or hiding. Culturally, shame societies emphasize honor and external judgment, while guilt cultures stress internal conscience. Both agree emotions can be internalized but debate whether internalized shame is distinct from guilt.

  The disagreements will reflect their core arguments without dilution. J maintains guilt is intrinsically action-focused and self-correcting, while shame is socially dependent and destructive. R contends shame is identity-deep and community-sustaining, while guilt is superficial and transactional. 

  Cruxes must pinpoint resolvable disputes. The "Empty Stadium" case tests emotional persistence without observers: J predicts guilt remains active while shame vanishes, proving shame's social dependence. R argues internalized shame persists, showing its authenticity. Their "internalization" definitions clash here—R sees it as true shame, J calls it guilt rebranded.

  For the culture question, the first crux examines whether "dominant moral emotion" is measurable or just an average. J sees it as fuzzy aggregation; R believes in observable patterns via institutions. The second crux asks if societies can intentionally shift frameworks. J cites secularization as proof of choice; R argues deep cultural inertia resists top-down change.

  Predictions for cultural tests involve second-gen immigrants and education systems. J expects acculturation toward guilt frameworks; R predicts persistent shame patterns without explicit reinforcement. Both agree on measurable indicators like apology styles or disciplinary approaches.

  I should ensure the joint statement mirrors their voices in disagreements while keeping agreements neutral. The Empty Stadium scenario effectively isolates the observer-dependency debate. For culture cruxes, concrete examples like Japan's reforms or Scandinavian models make the arguments tangible. 

  The user's hidden need is likely mediating a heated debate while meeting academic requirements. By framing cruxes as testable predictions, the document transforms abstract arguments into empirical inquiries—which might cool tensions by shifting focus to evidence. Also, explicitly labeling semantic disputes (e.g., "internalized shame") preempts talking-past-each-other.
