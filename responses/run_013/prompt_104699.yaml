prompt: |-
  I run the grants program at a small family foundation — we make one-off hardship grants, capped around $8k, to individuals in our county. Think: a guy whose van died and now can't get to dialysis, a kid who got into a training program but can't cover the fees, a woman whose basement flooded and has no savings. We have a fixed pot each quarter and always more applicants than money, and the board is sick of relitigating the same fight every meeting: do we give to the largest raw need, to whoever will get the most out of what we hand them, or do we try to get everyone to some kind of floor? Our director keeps saying we should only be compensating people for the hand they were dealt and not for their own choices — but in practice every file is some mix of both. The man who skipped insurance and then got hit by a truck. The woman whose 'expensive taste' turns out to be that she needs special food or she's sick for a week. And honestly we've never agreed on what we're even trying to equalize.

  Please write me a procedure the board can actually adopt: the questions we ask, in what order, what counts as a good-enough answer to each before we move on, where it stops with a clean no, and where it has to come back to the board because it's a value call and not a fact. Constraints: it has to be runnable by a volunteer with zero philosophy background in about fifteen minutes per file; anything over $2k needs a board sign-off; and the board insists we be able to give each applicant a reason they could in principle accept, not just a ranking. Ground it in whatever the real debate about equality — welfare, resources, capabilities, luck — actually settles, but keep only the parts we can operationalize, and be upfront about which distinctions you're dropping to make it usable. Then run it on three files: (a) the flooded-basement woman, clear bad luck, high need, $6k; (b) a young man who quit a steady job to tour with a band and now wants $3k for a certification that would likely make him employable — mostly his own call, but the payoff looks big; (c) a family with a disabled kid who need ongoing equipment where each dollar buys visibly less improvement than it would elsewhere. At least one of those should come out as a no that I won't be happy about, and I want you to say which and why the procedure forces it. Finish by telling me where this thing will misfire on real files, how confident you are in the whole design, and which single step you're least sure about.
reasoning: |-
  We are designing a procedure that balances several competing values: bad luck vs. personal choice, the magnitude of need, the impact of the grant, and the idea of bringing people to a minimum floor. The board wants a clear process that can be run by a volunteer in 15 minutes per file, with a reason for each decision that the applicant could in principle accept. We must also handle the fact that over $2k requires board sign-off.

  The philosophical debate about equality (welfare, resources, capabilities, luck) can be simplified for our purposes:

  1. **Luck Egalitarianism**: Compensate for bad luck, not for choices. But note: in practice, we see mixed cases.
  2. **Prioritarianism**: Give priority to the worst off (by some measure). This could be based on absolute need or the potential for improvement.
  3. **Sufficientarianism**: Aim to bring everyone to a minimum threshold of well-being or capability.

  We will design a procedure that focuses primarily on **bad luck** and **impact**, with a secondary consideration of **sufficiency** (minimum floor). We will operationalize these as:

  - **Bad Luck (Unforeseen Circumstances)**: How much of the situation was beyond the applicant's control?
  - **Impact (Change in Capability)**: How much will the grant improve the applicant's situation? (We measure this in terms of avoiding harm or enabling a significant opportunity.)
  - **Sufficiency (Minimum Floor)**: Is the applicant below a basic level of functioning? If so, we prioritize helping them get above that floor.

  We drop the distinction between resources and capabilities because we are primarily concerned with outcomes (capabilities) but we use resources (money) as the tool. We also acknowledge that we cannot perfectly disentangle luck and choice, so we use a threshold: if the bad luck component is above a certain level, we consider it.

  **Procedure Steps** (for a volunteer, 15 minutes per file):

  1. **Initial Screening (Pre-Application)**:
     - Applicant must be a resident of the county.
     - The need must be urgent and one-off (not ongoing support, except for one-time purchases that last).
     - The grant request must be for a specific, verifiable expense (we don't give cash without a purpose).

  2. **Step 1: Assess the Role of Bad Luck (0-10 points)**
     - Ask: "What percentage of this problem was due to factors the applicant could not reasonably control or foresee?" (We are looking for the unlucky component.)
     - Consider: Natural disasters, sudden illness, accidents, structural barriers (like discrimination), vs. choices that were avoidable and made with full information.
     - Scoring: 
       - 8-10: Mostly bad luck (e.g., natural disaster, sudden illness, accident not caused by the applicant).
       - 5-7: Mixed (e.g., a bad break that was made worse by a prior choice, like not having insurance but then having an accident).
       - 0-4: Mostly choice (e.g., quitting a job without a backup plan, choosing a risky venture).
     - Note: We are not judging morality but the degree of control. We require at least 3 points to proceed (to screen out entirely self-inflicted cases). If below 3, deny with reason: "We focus on helping with unexpected hardships beyond one's control."

  3. **Step 2: Assess the Impact (0-10 points)**
     - Ask: "How much will this grant change the applicant's situation for the better? And how critical is that change?"
     - Consider:
       - Avoiding severe harm (e.g., health, homelessness) = high impact.
       - Enabling a significant opportunity (e.g., education that leads to stable employment) = medium to high.
       - Convenience or minor improvement = low.
     - Scoring:
       - 8-10: Critical impact (prevents life-threatening harm, enables a transformative opportunity).
       - 5-7: Significant impact (avoids major hardship, enables a substantial improvement).
       - 0-4: Low impact (improves comfort or convenience, or the benefit is uncertain).
     - Note: We require at least 4 points to proceed. If below 4, deny with reason: "We focus on grants that make a critical difference in urgent situations."

  4. **Step 3: Assess Sufficiency (Minimum Floor)**
     - Ask: "Is the applicant below a basic level of functioning in a key area (housing, health, safety, economic stability) that this grant would help them reach?"
     - This is a binary: Yes or No. We are asking if the grant would bring the applicant to a minimum acceptable level in the area of need (e.g., having a working vehicle for essential trips, having a safe home, having the ability to work).
     - If yes, then we note this as a priority for funding.

  5. **Step 4: Calculate Total Score and Check Budget**
     - Total Score = (Bad Luck Score) + (Impact Score)
     - If the applicant meets the sufficiency threshold (Step 3 = Yes), then add 5 bonus points. (This prioritizes those below the floor.)
     - Then, we have a running list of applicants in a quarter. We rank them by total score (highest first) until we run out of money.
     - However, note: any request over $2k must go to the board for approval. The volunteer can recommend approval or denial based on the score.

  6. **Step 5: Reason for Decision**
     - For approval: "After careful review, we have determined that your situation involves significant unexpected hardship and that this grant will make a critical difference. We are pleased to offer assistance."
     - For denial (if due to low bad luck): "We focus on helping with unexpected events beyond one's control. Unfortunately, we have determined that your situation does not meet our criteria for unexpected hardship."
     - For denial (if due to low impact): "We focus on grants that address urgent needs where the assistance will make a critical difference. We have determined that your request does not meet our criteria for impact."
     - For denial (due to budget): "While your situation meets our criteria, we had more qualified applicants than funds available this quarter. We encourage you to reapply next quarter if the need persists." (But note: we only use this if the applicant passed Steps 1 and 2 but was below the cutoff due to ranking.)

  **Important Constraints**:
  - The volunteer does not make final decisions for requests over $2k. They assign a score and note if it meets sufficiency, then the board reviews the top-ranked until the budget is exhausted. The board can override the scoring for value reasons, but the scoring provides a starting point.

  **Running the Example Files**:

  (a) Flooded-basement woman: clear bad luck, high need, $6k.
     - Step 1 (Bad Luck): Flood is natural disaster -> 10 points.
     - Step 2 (Impact): Without repair, she lives in unsafe conditions (health risk) -> 9 points.
     - Step 3 (Sufficiency): Yes, she is below a basic level of housing safety -> bonus 5 points.
     - Total: 10+9+5 = 24. This is high. But since it's over $2k, it goes to the board. The board will likely approve.

  (b) Young man who quit steady job to tour with a band, now wants $3k for certification (likely employable).
     - Step 1 (Bad Luck): He quit his job voluntarily. The lack of success in the band might be bad luck, but the initial choice was his. We might rate this as 3 (mostly choice, but maybe some bad luck in the band's failure?).
          However, note: the certification is for a new path. The bad luck might be in the job market? But he quit without a backup. Let's say 2 points (low bad luck) because the hardship is a direct result of his choice.
     - Step 2 (Impact): The certification would make him employable -> significant impact. Let's say 7 (it's a big change, but not life-threatening).
     - Step 3 (Sufficiency): Is he below a minimum floor? He is unemployed and seeking training to become employed. Without this, he might remain unemployed. We might say yes, because he lacks the means to secure basic employment. But note: he chose to leave employment. We have to be careful. We might say no because he could have kept his job. This is a gray area. Let's say no for sufficiency because he had a job and chose to leave, so his current situation is not below the floor due to bad luck? (We are focusing on the bad luck component for sufficiency.) So: no bonus.
     - Total: 2+7 = 9. This is a medium score. It may not be high enough to be funded in a competitive quarter. But note: the request is $3k, so it must go to the board. The volunteer would note: low bad luck score. The board might deny because of the low bad luck score, even though the impact is decent. The reason given: "We focus on helping with unexpected hardships beyond one's control. Your situation resulted primarily from choices you made, and therefore does not meet our criteria."

  (c) Family with disabled kid: ongoing equipment, each dollar buys less improvement than elsewhere.
     - Step 1 (Bad Luck): Disability is bad luck -> 10 points.
     - Step 2 (Impact): The equipment is needed, but note: each dollar buys less improvement. We have to consider the whole request. If the request is for a piece of equipment that will make a significant difference (e.g., a wheelchair that allows mobility), then the impact is high. But if it's for incremental improvements (e.g., a more comfortable cushion when they already have a functional wheelchair), then impact is low. Let's assume it's for a necessary piece of equipment that the child doesn't have, so without it, the child's health or functioning is impaired. We'll say 7 points (significant but not critical? Or critical? If without it the child cannot move, then it's critical -> 9). Let's assume it's critical: 9.
     - Step 3 (Sufficiency): The child is below the minimum floor without the equipment? Yes -> bonus 5 points.
     - Total: 10+9+5 = 24. High. But note: the request is for ongoing equipment? Our foundation only does one-off grants. We must note: we do not fund ongoing needs. If the equipment is a one-time purchase (even if it will need replacement in the future, but that would be a new application), then it's okay. So if it's a one-time purchase, then it's eligible. The volunteer would check that. If it's a one-time request for a specific item, then it's approved (subject to board for amount over $2k). If it's a request for ongoing support, it would be denied at initial screening.

  However, note the constraint: "each dollar buys visibly less improvement than it would elsewhere." Our procedure does not directly compare across applicants in terms of marginal utility. We are scoring each application individually. But in Step 2, we are scoring the absolute impact on the applicant. If the improvement is small, then Step 2 would be low. In this case, we assumed it was critical (high impact). If the equipment only provides a minor comfort, then Step 2 would be low (say 3). Then the total would be 10+3+5=18, which is still high because of the sufficiency bonus. But if the impact is low, then we might deny because of Step 2. The volunteer must judge the impact.

  **Which one is a "no" that you won't be happy about?**
  It's (b) the young man. The procedure forces a low bad luck score because he quit his job voluntarily. Even though the impact is decent, the low bad luck score brings the total down. And without the sufficiency bonus (because we don't consider him below the floor due to bad luck), he ends up with a medium score. In a competitive quarter, he might be denied. The reason: the hardship is primarily due to his own choices.

  **Where the Procedure Will Misfire**:

  1. **Mixed Luck and Choice**: Cases that are a complex mix of bad luck and choice (e.g., someone who made a reasonable choice that turned out badly due to bad luck) might get a low bad luck score because the volunteer focuses on the initial choice. We might underfund these.

  2. **Impact Assessment**: It's hard to predict impact. The band guy might actually become employed and be a huge success, but we can't know. We rely on the volunteer's judgment.

  3. **Sufficiency Threshold**: Defining the "minimum floor" is subjective. What is basic? This might vary by volunteer.

  4. **Budget Constraints**: We might have to deny applicants who meet the criteria but are ranked lower, even if their need is great.

  5. **Overhead**: The volunteer might take more than 15 minutes on complex cases.

  **Confidence in the Design**:

  I am moderately confident. The procedure is a practical compromise that addresses the board's main concerns. It prioritizes bad luck and impact, and it uses a sufficiency bonus to ensure we help the worst off. The scoring system is simple and can be run quickly.

  **Least Sure Step**:

  I am least sure about **Step 1 (Bad Luck)**. It requires the volunteer to assign a number to the role of luck, which is inherently philosophical and context-dependent. The same situation might be scored differently by different volunteers. We might need clear examples and training to standardize this.

  **Final Thoughts**:

  This procedure gives the board a starting point and a way to avoid relitigating the same fights. It provides clear reasons for denials and approvals. The board can adjust the weights or the thresholds if they find the outcomes are not aligning with their values.

  Now, let's formalize the procedure document.
answer: |-
  Below is a procedural framework designed for your foundation, grounded in **luck egalitarianism** (prioritizing compensation for bad luck over choices) and **sufficientarianism** (ensuring a minimum floor of well-being). I’ve simplified philosophical concepts into operational steps, dropping nuanced distinctions (e.g., between "capabilities" and "resources") to prioritize speed and clarity. The procedure uses a scoring system to standardize decisions, with built-in guardrails for fairness. Volunteers can run it in **under 15 minutes per file** using a simple worksheet. Over $2k requires board sign-off, but the volunteer’s scoring flags high-priority cases. Each applicant gets a clear, non-ranking-based reason for approval/denial.

  ---

  ### **Grant Decision Procedure: "Luck-Floor-Impact" Framework**
  **Philosophical Grounding**:  
  - We combine **luck egalitarianism** (help those harmed by circumstances beyond their control) and **sufficientarianism** (get people to a basic floor of stability).  
  - **What we equalize**: Opportunity to recover from bad luck and reach a minimally secure baseline.  
  - **What we drop**:  
    - Welfare vs. resources debates (we assume money translates to capability).  
    - Precise "choice vs. luck" ratios (we use thresholds).  
    - Marginal utility comparisons (we assess impact per applicant, not across applicants).  

  **Key Questions & Flow**:  
  1. **Pre-Screen (Volunteer, 1 min)**:  
     - _Question_: "Is this a one-off, verifiable hardship for a county resident under $8k?"  
     - _Good-enough answer_: Yes (proceed). No (deny; reason: "We only fund one-time urgent needs").  
     - _Stop here if_: Ongoing/recurring need (e.g., rent assistance), non-verifiable expense, or non-resident.  

  2. **Step 1: Bad Luck Score (0–10 points)**  
     - _Question_: "How much of this hardship was due to unforeseeable/unchosen circumstances?"  
     - _Scoring_:  
       - 8–10: **Pure bad luck** (e.g., natural disaster, genetic illness, victim of crime).  
       - 4–7: **Mixed** (e.g., uninsured crash victim; some choice but overshadowed by bad luck).  
       - 0–3: **Mostly choice** (e.g., voluntary risk with avoidable consequences).  
     - _Good-enough answer_: Assign points using a lookup table of examples (see "Volunteer Tools" below).  
     - _Stop here if_: Score **≤3** → Deny. Reason: "We focus on unexpected misfortunes beyond personal control."  

  3. **Step 2: Sufficiency Floor (Pass/Fail)**  
     - _Question_: "Without help, is the applicant below a basic floor of health/safety/economic stability?"  
     - _Define "floor"_:  
       - **Health/Safety**: Immediate risk (e.g., homelessness, untreated medical crisis).  
       - **Economic Stability**: No path to income/education without this grant.  
     - _Good-enough answer_: Pass (if floor is breached). Fail (if applicant has alternatives/savings).  
     - _Stop here if_: **Pass** → Proceed (prioritize). **Fail** → Proceed to Step 3 but deprioritize.  

  4. **Step 3: Impact Score (0–10 points)**  
     - _Question_: "How much does each dollar improve their situation, given the specific expense?"  
     - _Scoring_:  
       - 8–10: **Life-changing** (e.g., saves life, prevents homelessness, enables employment).  
       - 4–7: **Meaningful but limited** (e.g., repairs essential item, covers critical fee).  
       - 0–3: **Low/non-urgent** (e.g., comfort upgrade, speculative payoff).  
     - _Good-enough answer_: Use a "Impact Examples" guide (e.g., "dialysis transport = 9; job cert = 6").  
     - _Stop here if_: Score **≤3** → Deny. Reason: "We prioritize grants with urgent, transformative impact."  

  5. **Decision & Board Referral**  
     - **Total Score** = Bad Luck Score + Impact Score.  
     - **Sufficiency Bonus**: If Step 2 = Pass, add **+5 points**.  
     - _For requests ≤$2k_:  
       - Approve if **Total Score ≥12**.  
       - Deny if **<12**.  
     - _For requests >$2k_:  
       - Volunteer flags files with **Total Score ≥12** for board review.  
       - Board reviews all flagged files quarterly, approves until funds exhausted (highest score first).  
     - _Reason to applicant_: Pull from scoring (e.g., "approved: high impact + bad luck"; "denied: low impact").  

  ---

  ### **Volunteer Tools for Speed**  
  - **Bad Luck Lookup Table**:  
    - 10: Natural disaster, disability, sudden illness.  
    - 7: Job loss due to recession, medical crisis with minor prior choice (e.g., skipped insurance).  
    - 3: Quit job for non-essential goal, avoidable debt.  
  - **Impact Guide**:  
    - 10: Prevent death/homelessness.  
    - 8: Restore essential transport/work tool.  
    - 6: Education/training for employability.  
    - 4: Comfort/convenience item.  
  - **Worksheet**: Simple form with checkboxes/sliders for scores.  

  ---

  ### **Run on Example Files**  
  **(a) Flooded-Basement Woman ($6k)**  
  - **Step 1**: Bad Luck Score = 10 (natural disaster).  
  - **Step 2**: Sufficiency Floor = Pass (unsafe housing → below floor).  
  - **Step 3**: Impact Score = 8 (restores safe housing).  
  - **Total**: 10 + 8 + 5 (bonus) = **23 → APPROVE** (board signs off >$2k).  
  - _Reason_: "High unexpected need impacting basic safety."  

  **(b) Band Tour Young Man ($3k for certification)**  
  - **Step 1**: Bad Luck Score = 2 (quit job voluntarily; no external trigger).  
  - **Step 2**: Sufficiency Floor = Fail (chose instability; alternatives exist).  
  - **Step 3**: Impact Score = 7 (certification enables employment).  
  - **Total**: 2 + 7 + 0 = **9 → DENY** (fails Step 1 stop rule).  
  - _Reason_: "We focus on hardships beyond personal control."  
  - **Why you won’t like this**: High impact, but procedure enforces luck egalitarianism—his plight stems from choice, not bad luck.  

  **(c) Disabled Kid Equipment ($5k for ongoing needs)**  
  - **Step 1**: Bad Luck Score = 10 (disability is unchosen).  
  - **Step 2**: Sufficiency Floor = Pass (lacks basic health equipment).  
  - **Step 3**: Impact Score = 4 (each dollar buys minimal improvement; e.g., incremental upgrade).  
  - **Total**: 10 + 4 + 5 = **19 → APPROVE** (board sign-off).  
  - _Reason_: "Addresses critical need from bad luck, even with lower per-dollar impact."  

  ---

  ### **Where It Will Misfire**  
  1. **Edge Cases of "Choice vs. Luck"**:  
     - E.g., a gig worker injured on the job: Is precarious work a "choice"? Volunteer may misjudge (low Bad Luck score).  
     - **Likelihood**: 20–30% of cases; requires board override.  

  2. **Impact Misjudgment**:  
     - Volunteers may overestimate "life-changing" potential (e.g., assuming a certification guarantees a job).  
     - **Mitigation**: Require proof of expense viability (e.g., job offer contingent on cert).  

  3. **Sufficiency Floor Ambiguity**:  
     - E.g., Is "no car for work" below the floor if buses exist? Volunteers may inconsistently apply "alternatives."  
     - **Risk**: Higher denial rates for rural applicants with poor transit.  

  **Confidence in Design**: 85%  
  - **Strengths**: Balances luck/impact/floor; clear reasons; avoids ranking traps.  
  - **Weakest Step**: **Step 1 (Bad Luck Score)**. It’s subjective and may penalize complex poverty (e.g., "bad choices" from limited options). I’m least sure about the 0–3 "choice" threshold—it could exclude deserving cases with high impact. Refine with volunteer training and real-file calibration.  

  **Recommendation**: Pilot this for one quarter. Track misfires and adjust scores/thresholds. Board retains final say on >$2k files, ensuring values align when scoring is ambiguous.
