answer: |-
  Here is the examination question, model answer, and marking scheme tailored to your specifications.

  ---

  ### 1. Essay Question (for Exam Paper)  
  **Aristotle on Money, Exchange, and the Ethics of Acquisition**  

  In *Nicomachean Ethics* V.5 and *Politics* I.8-10, Aristotle argues that money (νόμισμα) is conventional, serving as a measure of communal need (χρεία) to enable proportionate reciprocity (ἀντιπεπονθός) in exchange. Yet he condemns interest (τόκος) as "unnatural" because money is "barren" (ἄγονος) and because wealth-getting (χρηματιστική) aimed at endless accumulation is corrupting.  

  Consider a modified lending practice:  
  *An interest-bearing loan where the lender’s total return (principal + interest) is contractually capped at the amount required to sustain the lender’s household for one year—ensuring the end of acquisition is limited to household need (οἰκονομία), not limitless wealth.*  

  **Question:**  
  Would Aristotle condemn this *capped-interest loan*? Your essay must:  
  (a) Explain whether Aristotle’s objection to interest depends *primarily* on money’s "barrenness" (a claim about *money’s nature*) or on the *unlimited aim* of accumulation (a claim about *human desire*);  
  (b) Assess whether Aristotle can consistently reject the *form* (interest) while approving the *end* (limited need) in this case;  
  (c) Analyze how Aristotle’s view of money as a "measure of need" (χρεία) shapes his critique. Does this conventionalist foundation help or undermine his argument against usury?  

  *Ground your response in Aristotle’s texts and concepts. Avoid rehearsing broad contrasts between οἰκονομία and χρηματιστική; engage the tension between his monetary conventionalism and his ethical critique.*  

  ---

  ### 2. Model Answer (≈700 words)  

  Aristotle’s analysis of money creates a paradox. He insists money’s value is purely conventional (*NE* 1133a26–30), established by law (νόμος) or agreement (συνθήκη) to quantify otherwise incommensurable needs (χρεία) and facilitate fair exchange (*NE* 1133a19–22). Yet he attacks interest as "most unnatural" (ἡ μάλιστα παρά φύσιν) because money, being "barren," cannot "breed" more money (*Pol.* 1258b1–8). The capped-interest case—where returns are limited to household sustenance—tests whether Aristotle’s usury critique relies on money’s intrinsic sterility or the limitless pursuit of wealth. I argue Aristotle *must* condemn this arrangement, but his conventionalism about money undermines the "barrenness" argument, forcing his critique onto ethical terrain: the perversion of reciprocity and the danger of unlimited desire.  

  **The Problem with "Barrenness" and Conventionalism**  
  Aristotle’s claim that money is "barren" (*Pol.* 1258b5–7) seems metaphysical: gold coins lack reproductive capacity. But if money’s value is conventional (*NE* 1133b1), not natural, "barrenness" cannot be a biological fact about coins. As scholars like Scott Meikle (contested) stress, Aristotle’s conventionalism implies money has no "nature" independent of its social function. Thus, condemning interest because money "cannot reproduce" is incoherent: convention could *assign* money reproductive power (e.g., via interest). The objection must instead target *why* society permits such a practice. Here, Aristotle’s deeper argument emerges: interest severs exchange from reciprocal justice. Money enables proportionate reciprocity (ἀντιπεπονθός), which binds the community by equalizing need (*NE* 1132b31–34). Interest corrupts this by generating profit from the *medium* of reciprocity itself, distorting money from a "measure" into an autonomous end (*Pol.* 1257b10–11).  

  **Limited Ends vs. Unethical Means**  
  The capped loan appears to resolve Aristotle’s concern about limitless desire. Yet he would still condemn it. Why? Because even with a limited end, interest violates reciprocity’s *form*. In natural exchange (κατὰ φύσιν), goods or services of equal need-value are traded; money merely intermediates (*Pol.* 1257a14–19). Interest, however, allows money to "grow" *without* the lender contributing a good or service to the community—it "makes a gain out of money itself" (*Pol.* 1258b1–2). Aristotle’s analogy with household tools clarifies: a shuttle weaves cloth, fulfilling its purpose; money measures need, fulfilling its purpose. Using a shuttle as firewood (*Pol.* 1258a1–5) or money to breed money perverts their functions. The capped loan’s "limited end" does not redeem this functional perversion.  

  **Χρεία as Measure: Subjective Value and Its Pitfalls**  
  Aristotle’s "measure of need" (χρεία) doctrine is pivotal but double-edged. He states value derives from communal need, not intrinsic properties (*NE* 1133a26–28)—a proto-subjective theory of value. This helps his usury critique: if value stems from human need, money cannot *naturally* generate value. But it also undermines the "barrenness" argument by emphasizing money’s plasticity. Worse, if χρεία is subjective, why can’t interest reflect a borrower’s "need" for capital? Aristotle anticipates this: exchange must reflect *proportionate* contributions to the community, not arbitrary demand (*NE* 1132b31–1133a2). Interest disrupts proportion by rewarding ownership over contribution. Thus, χρεία anchors his ethics: money must serve reciprocal justice, not create value *ex nihilo*.  

  **Verdict on the Capped Loan**  
  Aristotle must reject the capped loan. Its limited end avoids the vice of *pleonexia* (greed), but not the functional error: interest still treats money as a "productive" tool, severing gain from reciprocal contribution. His consistency hinges on prioritizing the *form* of exchange over intention. Yet this exposes a tension: if convention defines money’s role, could a society not *conventionally* validate interest as reciprocal (e.g., rewarding risk)? Aristotle implicitly resists this (*Pol.* 1258b2–8), suggesting his deeper objection is ethical, not monetary: interest enables gain detached from the virtuous activity that should define economic life.  

  **Conclusion**  
  The capped-interest case reveals Aristotle’s critique relies less on money’s "barrenness" (weakened by conventionalism) than on the *unnatural separation of wealth from virtuous action*. His objection to usury is ultimately about preserving reciprocity as the foundation of communal justice. While scholars debate if Aristotle fully reconciles χρεία’s subjectivity with natural justice (e.g., Miller vs. Meikle), the capped loan fails because it instrumentalizes money contrary to its role in binding the polis through proportionate exchange.  

  ---

  ### 3. Marking Scheme (30 Marks Total)  
  **Must-hit points** (Deduct marks if absent/muddled):  

  | **Points**                                                                                                | **Marks** | **Common Mistake (costs marks)**                               |  
  |-----------------------------------------------------------------------------------------------------------|-----------|----------------------------------------------------------------|  
  | **1. Identifies tension:** Explains conflict between monetary conventionalism & "barrenness" argument.    | 6         | Treating "barrenness" as literal fact without addressing conventionalism. |  
  | **2. Analyzes capped loan:** Explicitly argues whether Aristotle condemns it *despite* limited end.       | 8         | Ignores the case; assumes limited end automatically justifies interest. |  
  | **3. Distinguishes form/end:** Assesses if condemning *interest* (form) can coexist with approving *limited need* (end). | 6         | Conflates form and end (e.g., "limited end makes interest acceptable"). |  
  | **4. Engages χρεία:** Explains how money as "measure of need" affects usury critique (helps/undermines). | 6         | Mentions χρεία but doesn’t link to value subjectivity or reciprocity. |  
  | **5. Reaches verdict:** Clear conclusion on capped loan + why Aristotle’s critique holds (or not) coherently. | 4         | Unsupported verdict; ignores functional perversion argument. |  

  **A vs. B Differentiation:**  
  - **A Answer (24–30 marks):** Explicitly shows capped loan fails due to *formal violation of reciprocity* (not just unlimited desire). Recognizes χρεία’s ambiguity and its impact on the "barrenness" argument.  
  - **B Answer (18–23 marks):** Correctly rejects capped loan but roots objection *only* in "barrenness" or unlimited desire, neglecting reciprocity’s formal role. May misjudge χρεία’s implications.  

  **Note:** Award partial marks for incomplete execution. Full marks require precision on all five points.  

  ---  
  This design forces students beyond slogans by centering the hypothetical case and Aristotle’s internal tension, while the model answer and rubric reward engagement with philosophical (not just exegetical) depth.
