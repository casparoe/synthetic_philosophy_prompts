prompt: |-
  I want you to act as a philosopher who works on decision theory under uncertainty and on the long-term future, and to think carefully before you answer — start by restating the view below in your own words and brainstorming a list of possible defeaters before you rank anything.

  Here's a view I've been pushing in seminar: taking the simulation argument seriously — the idea that we might well be simulated beings in someone else's computer — should dampen fanaticism about the far future. By fanaticism I mean the Pascal's-mugging-ish reasoning that a tiny probability of astronomically large future value should swamp ordinary present-day considerations. Call it the dampening thesis.

  So: what would count against it? I don't want generic "the far future matters anyway" replies, I want the things that should actually move someone who holds it. Which parts of the simulation argument does the thesis really need? I have a suspicion that if the sim hypothesis just scales far-future value down by a constant factor it does nothing at all, since fanaticism is about ratios and rankings — tell me whether that's right, and if it is, what the thesis has to claim instead. What does it predict that a non-dampening view doesnt? Which defeaters would even a friendly defender have to concede? And is there a risk it's been qualified into unfalsifiability — if so, is that a fatal problem here or just the price of a view like this?

  One more thing I keep worrying about: the sim argument might itself be a fanaticism generator, since there's presumably some tiny chance our behavior matters enormously to whoever is running things. If so, is my thesis self-undermining, or can it survive that? I'd find a case where the sim hypothesis leaves every ranking of options exactly as it was especially persuasive, so tell me if you can build one. Skip the citations, I just want the argument. Rank the defeaters from fatal to merely awkward.
