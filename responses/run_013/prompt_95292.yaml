prompt: |-
  ok so i want a pantoum about dreaming, and specifically about the fact that the only access you ever get to a dream is the memory you wake up holding, which got made at the moment you woke. theres two camps on this and i want the poem stuck between them. one says the dream just is the waking report — theres no experience you had while asleep that the report is about, so asking what the dream was realy like is like asking what someone was really thinking before they said a word. the other says fine, but what you wake up with presents itself as a memory of an experience, and you have no way to check it against anything, so either way its doing everything an experience does. the pantoums loop should carry that: lines have to come back changed, so the first time a line is about the dream, later its about the remembering, and later still about the telling. i also want one line addressed to a figure in the dream, and i never want that figure described outside the address, so the reader cant tell whether they were ever there. by the last stanza, when the opening lines return, the poem should have quietly shut the door on whether there was anything it was like to be in the dream — not by being vague, but because the form has made the inside and the outside the same loop. 16 to 20 lines, no title, and it should hold up as a poem even for someone whos never thought about any of this.
reasoning: |-
  Okay, the user wants a pantoum about dreaming, focusing on the idea that we only know dreams through the memory we wake up with. They mention two philosophical camps: one sees the dream as just the waking report, and the other acknowledges that the report feels like a memory of an experience. The pantoum's looping structure should reflect this by transforming lines—first about the dream, then remembering, then telling. There's also a request for an ambiguous address to a dream figure and a subtle resolution where the distinction between inside and outside the dream blurs.

  First, I need to recall the pantoum structure. It's a Malaysian form with repeating lines in a specific pattern: stanzas of four lines where the second and fourth lines of each stanza become the first and third of the next. The last stanza should loop back to the first, creating a circular effect. For 16-20 lines, that means 4-5 stanzas. I'll aim for four stanzas (16 lines) to keep it tight.

  The core themes: the unreliability of dream memory, the debate between the dream as report vs. experience, and the ambiguity of the dream figure. The poem needs to work both philosophically and poetically for general readers. So, I'll use accessible language and vivid imagery—like light, water, doors—to convey abstract ideas concretely.

  For the line transformations: Start with lines describing the dream (e.g., "I held a light and walked through water"). When repeated, shift to remembering ("I held a light... or did I?"), then to telling ("I tell you how I held..."). This mirrors the user's request, showing how the same line changes meaning with context.

  The dream figure: I'll include an address like "You, by the door—did you speak first?" without describing them elsewhere. This keeps their presence ambiguous, leaving readers unsure if they were part of the dream or a construct of memory.

  Ending: The last stanza should blend the opening lines, making the dream and report indistinguishable. By reusing "I held a light..." as both dream and telling, the loop closes, emphasizing that the "inside" and "outside" are now one. No explicit resolution—just the form doing the work.

  Deeper needs: The user seems interested in philosophy of mind, memory, and perception. They want the poem to embody the tension without preaching, using form as content. Unspoken might be a desire to explore how art can resolve theoretical debates through structure and ambiguity. I'll ensure the poem stands alone emotionally—evoking the fragility of dreams—so it resonates beyond the philosophy.

  Language: Keep it lyrical and sensory. Avoid jargon. Use metaphors like "water" for fluid memory, "door" for thresholds of consciousness. Rhyme subtly; pantoums don't require it, but internal music helps.

  Finally, test the flow: Stanza 1 sets the dream. Stanza 2 shifts to waking. Stanza 3 addresses the figure and memory. Stanza 4 merges everything. The loop should feel inevitable, making the philosophical point through repetition and change.
