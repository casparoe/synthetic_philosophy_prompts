prompt: |-
  I'm 16 and I've somehow ended up in a months-long argument with my mate Dan about whether it's ok to eat meat, and I keep losing because I can't work out whether the things he says are actual positions with names or just stuff he's making up on the spot. I tried googling but it's all either factory farming stuff or the non-identity problem, which I don't think is quite it.

  Here's the bits I can't get past.

  First one. I said the cow gets killed, that's the bad bit. He said the cow wouldn't have existed at all if nobody ate beef, and it had a decent life, so we haven't done it a wrong. I said you can't just compare being killed to never existing, and he said that's exactly the point, you can't, so the killing isn't a harm. I know this is somewhere near the non-identity thing but that seems to be about people who do end up worse off, and here he's saying nobody's worse off, so I don't know if it's the same thing or a cousin of it.

  Second one, the one that actually annoys me. He reckons beef is kinder than chicken, because one cow feeds a family for a month and one chicken is one dinner, so per dinner you're killing loads more chickens than cows. He says it's just maths. Then my vegetarian friend tried to back me up and he turned it round on her: he said her lentils and soya kill mice and bugs in the fields at harvest, probably more of them than a cow's worth, and the soya goes to feed cows anyway so she's paying for that too. And then he said the mice in the fields have awful lives and die horrible deaths regardless, so their deaths barely count. She didn't have an answer and neither did I.

  So what I'm actually asking about is the last bit. It feels like there's a move where you stop asking how bad a death is and start counting deaths per meal, or deaths per calorie, and once you do that the big animals come out best and the small ones and the plants come out worst, and the whole thing turns into a numbers game where the answer is 'eat beef, it's the least murdery option'. Is that a thing? Does it have a name, and is it genuinely different from the first thing he said, because they feel different to me -- the first one is about whether anything bad happened at all, and this one is about which bad thing is smallest. And is the crop-death bit the same argument or a separate one?

  I don't want just a label. If there is a name I want to know exactly where the edges are: what it covers and what it doesn't, whether the deaths-per-calorie version is a real position anyone actually holds or just a thing people say to win arguments, whether the 'their lives are bad anyway' bit is part of it or a different move entirely, and which of the things I've described is closest to something that already exists. If none of them have names, can you make one up properly and tell me the cases where it would and wouldn't apply, because I need to know what to actually say to him.

  Also please tell me what would change your mind. If you say the chicken thing has a name and it's X, what would make you go 'actually no, it's Y' or 'actually none of these fit'? I'd rather know where you're shaky than get a confident answer that falls apart when he asks a follow up.
