  my half-baked rule: a system suffers only if it has (1) a signal that's negative, (2) the signal is functionally integrated, i.e. it changes what the system does, and (3) the signal is about the system's own condition rather than just about the world. run that against the list and tell me where it fails.

  what I actually want:

  - the principle, or 2-3 candidate principles, that gets closest to all my verdicts, stated precisely enough that I could code it up as a predicate over a system description
  - which of my verdicts it forces me to give up, and which pair of verdicts is doing the damage
  - what it predicts for cases I didn't list, e.g. a self-play agent that gets negative reward for losing, an agent trained on a noisy proxy for what I actually care about, a population of agents where only the population average reward matters, and an agent rewarded specifically for predicting its own negative reward
  - if the honest answer is that my verdicts are inconsistent and no principle saves them all, say so and tell me the cheapest one to drop

  no need to cite anyone or point me at papers, I can't look them up anyway and I don't care who said what. I want the rule.
