  I should start by outlining Lewis's core features: coordination, alternatives, preferences, expectations, common knowledge, precedent. Then, for each possible interpretation of "just a convention," evaluate its validity. For instance, saying conventions involve coordination is trivial for promises, but calling them arbitrary might be substantive or false depending on context. The evolution point about sanctions turning conventions into norms is crucial—once internalized or enforced, is it still "just" a convention? That affects the obligation angle.

