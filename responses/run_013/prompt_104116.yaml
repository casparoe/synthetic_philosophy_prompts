answer: |-
  Here's a conceptual map breaking down "it's just a convention" within a Lewisian framework, tailored for your needs. I'll use three core examples: **Walking Conventions** (e.g., which sidewalk side), **Money**, and **Promising**. For each reading, I'll assess it and flag whether it supports the "non-binding" move.

  **Lewisian Core Features of Convention (Recap):**
  1.  **Coordination Problem:** Multiple equilibria exist; agents need to coordinate on one.
  2.  **Alternatives:** Other stable patterns *could* have worked.
  3.  **Preferences:** Agents prefer coordinating *somehow* over not coordinating, and often prefer conforming if others do.
  4.  **Mutual Expectations & Common Knowledge:** People expect others to follow, expect others to expect them to follow, and so on (common knowledge).
  5.  **Precedent:** The pattern persists because "this is how we've done it," reinforcing expectations.

  ---

  **Distinct Readings of "It's Just a Convention" (& Assessment):**

  1.  **"It's a solution to a coordination problem."**
      *   **Meaning:** The practice functions to align expectations/actions where multiple stable solutions were possible.
      *   **Examples:**
          *   *Walking:* Trivially true. Left/right solves the coordination problem of avoiding collisions.
          *   *Money:* Substantively true. Shells, gold, paper, digital tokens all *could* work as media of exchange if coordinated upon. The specific form solves the "what do we use for trade?" problem.
          *   *Promising:* **Substantive Claim (Likely True).** Promises *do* coordinate expectations (promisor's future action, promisee's reliance). Other signals *could* serve this function (oaths, blood pacts, specific formal declarations?).
      *   **Supports Non-Binding Move? NO.** Solving a coordination problem says nothing about the *reasons* for adhering to the solution *once established*. Obligation might arise *from* the coordinated expectations and reliance.

  2.  **"It's arbitrary (contingent on history/alternatives exist)."**
      *   **Meaning:** Other equilibria *could* have served the same coordinating function just as well. The specific form isn't uniquely determined by rationality or the problem itself.
      *   **Examples:**
          *   *Walking:* Trivial truth. Left works fine; right would work fine too.
          *   *Money:* Trivial truth. Gold works; fiat currency works; Bitcoin *could* work. The specific token is arbitrary relative to the function.
          *   *Promising:* **Substantive Claim (Plausible but Contested).** While core signaling *might* be needed, the specific linguistic form ("I promise"), social rituals, and scope *could* be different. Critics might argue the *core function* (generating assurance) necessitates specific features that aren't fully arbitrary.
      *   **Supports Non-Binding Move? WEAKLY / MISLEADINGLY.** Arbitrariness *of origin/form* does **not** entail arbitrariness *of normative force once established*. Driving on the left in the UK is arbitrary but *legally* binding and *practically* obligatory for safety. The visitor often **equivocates** between "arbitrary origin" and "optional adherence" here.

  3.  **"It's sustained primarily by precedent and mutual expectations."**
      *   **Meaning:** The reason people follow it *now* is largely because "it's the done thing" and they expect others to do it too (Lewis's core mechanism).
      *   **Examples:**
          *   *Walking:* Trivial truth. You walk on the expected side because others do and expect you to.
          *   *Money:* Defensible truth. The value of fiat money relies *crucially* on the expectation that others will accept it. Precedent matters immensely.
          *   *Promising:* **Substantive Claim (Plausible but Partial).** Precedent and expectations *are* key factors in why people keep promises (reputation, predictability). However, proponents of promissory obligation argue internal attitudes (intention to undertake obligation) or moral principles *also* play a crucial role.
      *   **Supports Non-Binding Move? NO.** This describes the *mechanism of stability*, not the *source of normativity*. Something can be stable via expectations AND generate genuine obligations (e.g., many rules of law).

  4.  **"It lacks intrinsic/non-instrumental reason-giving force."**
      *   **Meaning:** The *only* reason to follow the convention is instrumental: to coordinate, avoid sanction, gain benefit, or because others expect it. There's no "ought" inherent in the convention itself.
      *   **Examples:**
          *   *Walking:* Defensible claim. You walk on the right to avoid collisions and weird looks. No deeper moral "ought".
          *   *Money:* Defensible claim. You use dollars because they work for exchange, not because dollars are morally good.
          *   *Promising:* **Substantive Claim (Hotly Contested - Visitor's Core Move).** This is where your visitor jumps: "Promises are *just* tools for coordination; the *only* reason to keep one is the instrumental benefit of coordination/sanction avoidance. There's no *sui generis* moral 'obligation' generated." Critics argue the *act of promising* itself creates a distinct moral reason.
      *   **Supports Non-Binding Move? YES, BUT THIS IS THE CONTESTED CLAIM.** This is *not* a trivial consequence of Lewis's definition. Lewis describes *how conventions work*, not their *normative source*. This reading smuggles in a **reductive, instrumentalist view of normativity** as *part of the definition* of convention. It conflates "explained by coordination" with "reducible to coordination incentives".

  5.  **"Deviation isn't inherently wrong/criticizable, only inexpedient."**
      *   **Meaning:** Breaking the convention might be stupid (it won't work, you'll face sanctions), but it's not morally wrong *just* because it breaks the convention. Criticism is based on consequences, not principle.
      *   **Examples:**
          *   *Walking:* Trivial truth. Walking on the left in the US isn't *immoral*, just dangerous and annoying.
          *   *Money:* Defensible claim. Counterfeiting is illegal and harmful, but using seashells as money today isn't *morally* wrong, just useless.
          *   *Promising:* **Substantive Claim (False, according to critics of the visitor).** Breaking a promise *is* typically seen as inherently wrong/criticizable *even if* the promisor avoids sanctions or the promisee wasn't harmed. The criticism appeals to the act itself, not just consequences.
      *   **Supports Non-Binding Move? YES, BUT AGAIN, CONTESTED.** This directly supports the "no genuine obligation" claim. However, it *assumes* that conventions *cannot* generate inherent wrongness/criticizability. This is **precisely what's at stake** in the debate about promising. Lewis's framework is neutral on this.

  ---

  **Your Evolution-of-Norms Question (Sanctions/Resentment):**

  *   **Lewisian Baseline:** Conventions are stabilized by the *coordination payoff* itself. Sanctions/resentment aren't *necessary* in the core definition (e.g., we drive on the right primarily to avoid crashes, not fines, though fines help).
  *   **Adding Sanctions/Resentment:** When a pattern is stabilized partly or wholly by the *threat of punishment* (formal sanctions) or *social disapproval/resentment*, it transitions from a **pure coordination convention** towards a **social norm** (in the stricter sense used by e.g., Brennan, Pettit, Bicchieri).
  *   **Does "just a convention" still hold?**
      *   **Origin/Structure:** Yes, it likely *started* as or shares key features with a convention (coordination problem, alternatives, precedent).
      *   **Normative Force:** **This changes the game significantly.** The presence of *resentment* is key:
          *   Resentment implies people *feel* the deviation is *wrong*, not just inexpedient. They appeal to a norm.
          *   Internalization: People may follow the norm because they believe it's *right*, not just expect others to.
          *   **"Just a convention" (Reading 4 & 5) becomes MUCH harder to defend.** The practice now involves attitudes (resentment, disapproval) and potential reasons (avoiding wrongdoing, upholding commitments) that go *beyond* mere coordination efficiency. It has acquired **normative depth**.
      *   **Example:**
          *   *Pure Convention (Walking):* Deviation causes confusion/annoyance, maybe mild disapproval ("weirdo").
          *   *Norm (Promise-Keeping):* Deviation causes *resentment* ("you betrayed me!"), moral criticism, and potentially sanctions (distrust, exclusion). The *reason* for sanction/criticism appeals to a broken obligation, not just failed coordination.
  *   **Conclusion on Evolution:** Once a convention becomes entrenched with widespread resentment for deviations and internalized acceptance as "the right thing to do," calling it "just a convention" in the sense implying *no genuine normative force* (Readings 4 & 5) is likely **false or seriously misleading**. It has become a **normative practice** grounded in social expectations *and* shared attitudes about right/wrong. The "binding" force is social and psychological, but often experienced (and argued to *be*) genuinely moral.

  **Your Visitor's Move: The Pile-Up & Equivocation**

  1.  **Step 1:** "Promises coordinate expectations." (True, Reading 1 - trivial/substantive).
  2.  **Step 2:** "Therefore, promises are Lewisian conventions." (Plausible, but requires showing they fit all criteria like alternatives/precedent - substantive claim).
  3.  **Step 3 (The Sneaky Equivocation):** "Conventions are *just* solutions to coordination problems (Reading 1) / *just* arbitrary (Reading 2) / *just* sustained by expectations (Reading 3)." (Mixing relatively benign readings).
  4.  **Step 4 (The Illegitimate Leap):** "Therefore, promises *only* generate reasons based on coordination payoffs/sanctions (smuggling in Reading 4), and breaking them isn't inherently wrong/criticizable (smuggling in Reading 5)." **This does NOT follow from Steps 1-3.** Steps 1-3 are compatible with promises generating genuine obligations *through* the conventional practice (e.g., via reliance, trust, the act of commitment itself). The visitor **conflates the mechanism (coordination) with the normative source** and **equivocates between Lewis's technical 'convention' and the colloquial 'mere convention' (implying triviality/arbitrariness of normativity).**

  **Your Menu for Office Hours:**

  | Reading of "Just a Convention"        | Walking Side | Money      | Promising           | Supports Visitor's Non-Binding Move? |
  | :------------------------------------ | :---------- | :--------- | :------------------ | :----------------------------------- |
  | **1. Solves Coordination Problem**    | Trivial T   | Substantive T | Substantive T       | **NO**                               |
  | **2. Arbitrary (Alternatives Exist)** | Trivial T   | Trivial T  | Substantive (Plaus) | **WEAKLY (Equivocation)**            |
  | **3. Sustained by Precedent/Exp.**    | Trivial T   | Defensible T| Substantive (Part)  | **NO**                               |
  | **4. Lacks Intrinsic Normativity**    | Defensible  | Defensible | **Contested Claim** | **YES (Core Move)**                  |
  | **5. Deviation Not Inherently Wrong** | Trivial T   | Defensible | **Contested Claim** | **YES (Directly)**                   |

  **Key Rebuttal Points:**

  *   "Lewis explains *how* conventions work, not their *normative weight*. Something can be conventional *and* genuinely binding."
  *   "Arbitrariness of origin ≠ arbitrariness of current normative force. Driving conventions are arbitrary but binding."
  *   "The presence of coordination doesn't exclude additional normative sources like reliance, trust, or the commitment act itself."
  *   "If breaking promises reliably provokes *resentment* (not just annoyance), that signals people perceive a norm violation, not just coordination failure. That changes the 'just'."
  *   "You're equivocating between 'convention' as a coordination mechanism and 'convention' as meaning 'not really obligatory'."

  This map should give you the precise tools to dissect the "just a convention" move, identify where the argument goes astray (usually the leap to Readings 4/5), and force clarity on what is actually being claimed. Good luck in the reading group trenches!
