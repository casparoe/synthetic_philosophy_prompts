  Also, addressing the sanction point: if a convention evolves to include resentment for violations, it becomes a social norm, which carries normative force beyond mere coordination. This bridges to obligation theories like Hart or Scanlon, but the user doesn’t want citations. Emphasize that stability through sanctions doesn’t negate conventional origins but adds layers, making "just" misleading.

