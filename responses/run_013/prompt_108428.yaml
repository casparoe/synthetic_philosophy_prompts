prompt: |-
  I've been drafted to run the February session of a monthly discussion group that spun out of a reading group a few of us kept going after the pandemic — about a dozen people, mostly working programmers plus two policy analysts, all of them argument-comfortable and none of them historians — and the topic I've been handed is how to use historical analogies when reasoning about transformative AI. I don't need anyone talked into the subject; the group reads the same blogs I do and has already absorbed the outside view, base rates, and the general suspicion of narrative. What I need from you is a plan for teaching the skill itself in seventy-five minutes with a whiteboard, and the plan is the deliverable — don't run the argument for me, tell me how to run the session.

  Here is the material I want to build on, and I'd like you to tell me whether it survives contact with an audience. A friend of mine has been pushing a three-way distinction I've found genuinely clarifying: an analogy can function as a base rate (it tells you what usually happens in cases of this kind), as a frame (it tells you which features of the present case are worth looking at), or as a repertoire (it tells you which moves were available to the actors, so you can ask which of them are available now). On her account, 'is this analogy apt?' is a malformed question, because the same analogy can be first-rate in one mode and worthless in another — nuclear weapons are plausibly a decent repertoire for thinking about deterrence and a poor base rate for thinking about the frequency of catastrophe. I also want to lodge a point I've only half worked out: the outside-view move, which this group already trusts, presupposes that a reference class has been chosen, and choosing the analogy is exactly choosing the reference class, so the analogy has done its work before anyone consults a frequency. My provisional carrying example is the printing press, because it's the case everyone believes they already know and it forces the question of what the analogy is supposed to do; I keep being tempted by nuclear weapons and suspect that's mere familiarity, and the Industrial Revolution feels too diffuse to anchor anything — tell me whether that instinct is right. I'd also like the audience to leave with one disanalogy lodged firmly in mind: the press spread through matter, metal and paper and a trade in books, whereas the thing we're actually worried about can be copied at approximately zero marginal cost, which changes what containment could even mean.

  Plan the session: the order in which the pieces must go so that the three modes land as a working tool rather than a taxonomy, what has to be in place before my carrying example can do any work (and whether you'd replace it, and with what, given that the audience knows no history and I have no time to teach any), and in either case what the example has to have and has to lack for the three modes to be visible in it. Then the misconceptions they'll arrive with or develop, in the order they'll actually surface, with the exact point in the sequence where I should head each one off — my guesses are at minimum 'an analogy is an argument whose conclusion follows if the mapping holds,' 'apt versus inapt is binary,' 'one disanalogy kills it,' and 'this technology is unprecedented, so no analogy applies,' but tell me what I'm missing and which of my four is really the same mistake wearing a hat. Tell me what to leave out at this level and to say so out loud. Finish with the single question I should ask in the last five minutes that would show whether the tool took, and what a wrong answer to it would look like. Lead with your bottom line — the one sequencing decision the whole session turns on — in your first sentence, then the reasoning, with no preamble and no restating of my question.
reasoning: |-
  Okay, the user is running a discussion group on using historical analogies for transformative AI. They need a 75-minute session plan with a whiteboard, focusing on teaching the skill of applying analogies in three modes: base rates, frames, and repertoires. The group is knowledgeable about concepts like the outside view but lacks historical expertise.

  First, I need to structure the session so the three modes are practical tools, not just a taxonomy. The key sequencing point is introducing the modes early and reinforcing them through an example. Starting with the malformed question "is this analogy apt?" sets up why the three-way distinction is necessary. 

  The printing press example seems solid. It's familiar, which helps since the audience isn't historians. The key disanalogy with zero marginal cost for digital tech is crucial to highlight containment differences. But I should check if there's a better example. Nuclear weapons are common but might bias the group. Industrial Revolution is too broad. Printing press stays.

  Common misconceptions: treating analogies as arguments with mappings, aptness as binary, one disanalogy invalidating, or unprecedented tech making analogies useless. These need addressing at specific points. For example, when introducing the three modes, emphasize that each mode has different validity criteria. During the printing press example, discuss how disanalogies affect each mode differently.

  What to leave out: Deep historical details. State explicitly that the goal isn't to evaluate specific analogies but to use the framework. Avoid debates on which analogy is "correct."

  The final check question: Ask for one base rate, frame, and repertoire from the printing press example applied to AI. A wrong answer would conflate the modes or treat the analogy as monolithic. For example, using the printing press as a base rate for AI success rates without considering different contexts.

  Timing breakdown: Intro (5 mins), Three modes with whiteboard (20 mins), Printing press example (25 mins), Group exercise (15 mins), Misconceptions (5 mins), Wrap-up (5 mins). The group exercise reinforces application. Addressing misconceptions after the demo lets them see the framework in action first.

  Ensure the user emphasizes that choosing the analogy sets the reference class, which happens before base rates. This ties into the outside view they already know. Highlighting this during the three modes section is key.
answer: |-
  Here is your session plan. The critical sequencing decision: **Introduce the three modes *before* presenting the printing press example, and explicitly use the example to *demonstrate* each mode in action.**

  **Session Plan (75 mins total):**

  1.  **Framing & The Core Problem (5 mins):**
      *   Whiteboard: "Historical Analogies: How?"
      *   State the goal: "Not *whether* to use analogies (we do!), but *how* to use them skillfully to avoid common traps."
      *   Pose the malformed question: "We often ask: 'Is this analogy *apt*?' But what does 'apt' even mean?" Briefly poll the group: "What makes an analogy 'apt'?" (Capture quick answers – likely "similarities," "relevance," "predictive power"). Don't debate yet.
      *   State your core point: "Aptness depends on *what job* the analogy is doing. Asking 'is it apt?' too early is like asking 'is this tool useful?' without knowing if you're hammering a nail or sawing wood."

  2.  **Introduce the Three Modes (20 mins):**
      *   Whiteboard: Three Columns - **Base Rate | Frame | Repertoire**
      *   Define each *functionally* (use simple language & quick examples):
          *   **Base Rate:** "What *typically happened* in situations perceived as similar? (e.g., 'Most major technological shifts cause significant labor disruption.')"
          *   **Frame:** "What *aspects* of the current situation are most *important* to focus on? (e.g., 'Like the introduction of electricity, focus on infrastructure needs and phased adoption.')"
          *   **Repertoire:** "What *actions*, *strategies*, or *responses* were available or attempted? (e.g., 'Regulators tried X, Y, Z with early radio; which of those levers exist for AI?')"
      *   **Crucial Distinction:** "The *same analogy* can be strong in one mode and weak in another. Nuclear weapons: Great *Repertoire* for arms control concepts. Terrible *Base Rate* for catastrophic outcomes (n=1 major deployment)."
      *   **Address Your Half-Worked Point:** "The 'Outside View' relies on picking a reference class. Choosing your analogy *is* choosing that reference class. The analogy sets the stage *before* the base rate question is even asked." (Whiteboard this under Base Rate).

  3.  **Deep Dive: Printing Press Example - Applying the Modes (25 mins):**
      *   **Why Printing Press?** (State explicitly): Familiar, involves information spread & societal impact, *and* has critical disanalogies. Nuclear is tempting but overshadows; Industrial Revolution is too sprawling. Printing Press is the right anchor.
      *   **Set the Stage:** "Let's apply the three modes to the Printing Press (PP) for Transformative AI (TAI). What do we *think* we know about PP?"
      *   **Guide Through Each Mode:**
          *   **Base Rate:** "What *generally* happened? (e.g., Spread of ideas accelerated, religious/political upheaval, censorship attempts often failed long-term, literacy increased over decades/centuries). Useful? Maybe for diffusion speed *patterns* or initial disruption likelihood? Limitations? Timescales vastly different? Controllability?"
          *   **Frame:** "What key *features* does PP highlight for TAI? (e.g., Decentralized production potential? Democratization of knowledge access? Challenges to existing authorities? Difficulty controlling information flow?). Useful? Yes, points to critical dynamics. Limitations? Focuses *only* on information spread aspects, maybe misses autonomy."
          *   **Repertoire:** "What *actions* were taken? (e.g., Pre-publication censorship (licensing), post-publication punishment, subsidizing 'approved' printers, burning books, developing counter-ideologies). Useful? Absolutely! Shows range of attempted control/direction. Lets us ask: Which of *these* levers exist for TAI? (e.g., Code licensing? Server seizures? Promoting 'aligned' AI? Counter-AI?)."
      *   **Introduce the Key Disanalogy:** "Now, hit pause. Major Disanalogy: PP spread through *atoms* (metal, paper, ships). TAI spreads through *bits* (near-zero marginal cost)."
          *   **Impact on Modes:** "How does this disanalogy affect *each mode*? Base Rate: Maybe makes PP diffusion speed *too slow* as a predictor? Frame: Still highlights 'control of spread' but forces us to ask *how* control mechanisms differ radically? Repertoire: Makes *some* moves (like physical seizure) impossible, highlights need for *new* moves (e.g., cryptographic containment?)? **The disanalogy doesn't kill the analogy; it refines how we use it in each mode.**"

  4.  **Group Exercise: Quick Brainstorm (15 mins):**
      *   Task: "Pick *one* other historical analogy (e.g., Electricity, Steam Engine, Radio, even Nukes if they insist). In 2 mins, brainstorm: 1 potential Base Rate insight, 1 Frame it suggests, 1 Repertoire action. Then, identify *one major disanalogy* and briefly say how it impacts each of your three points."
      *   Process: Quick group shout-out (1-2 groups share). Focus on *applying the modes*, not debating the analogy's ultimate validity. Use whiteboard to capture snippets.

  5.  **Tackling Misconceptions Explicitly (5 mins):**
      *   "Now that we've seen the modes, let's revisit common pitfalls. We likely walked in with some:"
          *   **"Analogy = Argument (Mapping -> Conclusion)":** (Address after Modes/Example) "We saw it's not one argument; it's three different *tools* for different reasoning steps."
          *   **"Apt/Inapt is Binary":** (Address after showing same analogy strong/weak in different modes) "Nope. It's mode-dependent. A 'bad' analogy in one mode might be gold in another."
          *   **"One Disanalogy Kills It":** (Address explicitly during Printing Press disanalogy discussion) "Disanalogies are *diagnostic tools*. They tell us *where* and *how* the analogy needs refinement in each mode, or where a mode might not apply. They don't invalidate the entire tool."
          *   **"Unprecedented = No Analogies Apply":** (Address after Repertoire mode & Exercise) "Unprecedented *outcomes* are possible, but *dynamics* (like challenge to authority, control attempts, economic disruption) and *human responses* (like regulation, adaptation, fear) have precedents. Repertoire is especially powerful here – we don't need identical tech to learn from past *strategies*." (Your 4th point is fundamentally the same as the "One Disanalogy Kills It" error applied broadly).
      *   **Missing Misconception:** **"The 'Best' Analogy Exists":** Implicitly combat this by showing multiple analogies can be useful for different modes/purposes. The Exercise hints at this.

  6.  **Wrap-up & Check (5 mins):**
      *   **What to Leave Out (State Clearly):** "We *didn't* try to find the 'best' analogy for TAI. We *didn't* deep dive into historical accuracy. We *didn't* resolve whether AI *is* like nukes or printing. We *focused on the skill*: *using* analogies effectively by asking 'What job is this analogy doing for me right now (Base Rate, Frame, Repertoire)?' and 'How do disanalogies refine, rather than destroy, that use?'"
      *   **Final Check Question:** "Take the Printing Press again. *Briefly*: What's *one* plausible way to use it as a **Base Rate** for TAI? As a **Frame**? As a **Repertoire**?" (Ask for volunteers or quick show of hands for each mode).
          *   **Wrong Answers:** Conflating modes (e.g., "As a base rate, it tells us authorities will try censorship" – that's Repertoire). Declaring it "inapplicable" entirely. Focusing *only* on the disanalogy without showing how the mode still offers *some* insight despite it. Using it monolithically ("The printing press shows AI will cause revolution" - doesn't specify the mode or the limited insight).

  **Why This Sequence Works:**

  1.  **Problem First:** Starts with the felt difficulty ("aptness is vague"), creating a need for the framework.
  2.  **Tool Before Example:** Provides the conceptual structure *before* applying it, so the example demonstrates *how* to use the tool, not just illustrates it.
  3.  **Example Reinforces Modes:** Walking through each mode with PP makes the abstract concrete and shows their distinct utility.
  4.  **Disanalogy as Diagnostic:** Introducing the critical disanalogy *within* the example demonstrates how to handle them *within the framework* (refining modes), directly combating the "one disanalogy kills it" myth.
  5.  **Immediate Application (Exercise):** Cements learning by having them try the framework quickly on another example.
  6.  **Explicit Debunking:** Tackles misconceptions *after* they've seen the tool work, when the flaws in their initial thinking are more apparent.
  7.  **Clear Scope & Check:** Explicitly stating what *wasn't* the goal manages expectations. The final question directly tests if they can apply the three-way distinction independently.
