  I am a novelist at work on a book about the mid-century decipherment of Linear B, and I want to use the episode to think through a problem in archaeological inference. I know the standard narrative—the syllabic grid, the tablets as administrative records, the collapse of the palace system—so I am not asking for that. What I want is an analysis of the decipherment through the lens of the theory that reconstructing past beliefs and institutions from objects requires middle-range theory: independently justified bridging arguments that link material patterns to human behavior, after formation processes have been stripped away. Take the Linear B tablets as the object and the Mycenaean palatial economy and religion as the target. What does the theory say the decipherers were entitled to infer, and what should they have withheld? Where does the inference from tablets to institutions actually run, and where does it overreach? Does the fact that the bridge here is partly linguistic—a decipherment—change the epistemic situation, or does it just relocate the underdetermination? And what does the episode show about the theory: does it confirm the need for bridging arguments, or is it a case the theory never anticipated, where the objects speak too directly for the theory's caution to apply? Please say how confident you are in each claim and single out the point you are least sure of.
